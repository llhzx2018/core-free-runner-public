# P07-M05 新服务器初始化 — Depot CI sandbox KVM capability proof.
# This is a one-shot public-safe check, not a production or full-install job.
# No private checkout, no imported secrets, no database, no cloud API writes.
# Never run via Depot "GitHub Actions runners": those do NOT expose /dev/kvm.
name: P07-M05 新服务器初始化 - Depot CI KVM 准入验证
on:
  workflow_dispatch:
  push:
    branches:
      - feat/p07-unified-independent-module-router-20261112
    paths:
      - .depot/workflows/p07-m05-kvm-capability.yml
permissions:
  contents: read
jobs:
  p07-m05-kvm-capability:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/feat/p07-unified-independent-module-router-20261112'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact public verification source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify sandbox KVM access without private data or installation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_REPOSITORY:-}" = llhzx2018/core-free-runner-public
          test "${GITHUB_REF:-}" = refs/heads/feat/p07-unified-independent-module-router-20261112
          source /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          echo "P07_M05_DEPOT_TEST_HEAD=$(git rev-parse HEAD)"
          echo P07_M05_DEPOT_PRIVATE_SOURCE=NOT_USED
          echo P07_M05_DEPOT_CLOUDPANEL_INSTALL=NOT_RUN
          echo P07_M05_DEPOT_OWNER_PRODUCTION=UNTOUCHED
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo P07_M05_DEPOT_KVM=BLOCKED_NO_DEVICE_OR_ACCESS
            exit 13
          fi
          echo P07_M05_DEPOT_KVM=PASS_DEVICE_AVAILABLE
          echo P07_M05_DEPOT_NATIVE_GUEST_FULL_INSTALL=NOT_RUN
