# P07-M05 新服务器初始化 — one-off free OSS proof on REAL Debian13 GCE VM.
# Not a new GitHub repository / permanent Runner. CI uses the existing
# core-free-runner-public branch and NO private product source or secrets.
# Cirrus compute_engine_instance starts Debian13 DIRECTLY, not under
# unsupported LXC/Docker or unaccelerated nested QEMU/KVM.
# https://github.com/cirruslabs/cirrus-ci-docs/blob/master/docs/guide/custom-vms.md
p07_m05_debian13_native_task:
  name: P07-M05 新服务器初始化 — Debian13 native CloudPanel platform proof
  only_if: $CIRRUS_BRANCH == 'feat/p07-unified-independent-module-router-20261112' && $CIRRUS_PR == ''
  compute_engine_instance:
    image_project: debian-cloud
    image: family/debian-13
    platform: linux
    architecture: amd64
    cpu: 4
    memory: 8G
    disk: 35
  timeout_in: 50m
  cloudpanel_native_script: |
    set -Eeuo pipefail
    bash tests/p07_m05_cirrus_native_cloudpanel.sh
