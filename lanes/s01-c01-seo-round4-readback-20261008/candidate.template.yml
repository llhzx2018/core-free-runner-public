name: S01-C01 SEO round4 exact artifact readback
on:
  push:
    branches: [task/s01-c01-seo-round4-readback-20261008]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      PROVIDER_VERSION: '{{PROVIDER_VERSION}}'
      ARTIFACT_ID: '{{ARTIFACT_ID}}'
      ARTIFACT_BYTES: '{{ARTIFACT_BYTES}}'
      ARTIFACT_DIGEST: '{{ARTIFACT_DIGEST}}'
      ORIGINAL_RUN: '{{ORIGINAL_RUN}}'
      ORIGINAL_JOB: '{{ORIGINAL_JOB}}'
      ORIGINAL_HEAD: '{{ORIGINAL_HEAD}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact reader spec
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py render --spec lanes/{{LANE_ID}}/spec.json --template lanes/{{LANE_ID}}/candidate.template.yml --output /tmp/reader.yml >/dev/null
          cmp /tmp/reader.yml .github/workflows/{{LANE_ID}}.yml
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec lanes/{{LANE_ID}}/spec.json --input .github/workflows/{{LANE_ID}}.yml
      - name: Download actual archive and original job classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/archive.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$ORIGINAL_JOB" > /tmp/job.json
          python3 lanes/{{LANE_ID}}/reader.py
