name: S01-C01 layout professional information exact candidate
on:
  push:
    branches: [task/{{LANE_ID}}-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      SOURCE_VERSION: '{{SOURCE_VERSION}}'
      BASE_SHA: '{{BASE_SHA}}'
      CONTROL_PROOF_RUN: '{{CONTROL_PROOF_RUN}}'
      CONTROL_PROOF_SHA: '{{CONTROL_PROOF_SHA}}'
      CONTROL_PROOF_TREE: '{{CONTROL_PROOF_TREE}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/{{LANE_ID}} lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/brand-page-live-preview-contract.php
          php target/tests/layout-page-workflow-contract.php
          php target/tests/layout-workflow-v4-contract.php
          node --check target/tests/layout-v8-browser-check.js
          node --check target/src/assets/js/admin/admin-layout-page-refinement-v1.js
          php target/tests/update-center-human-language-contract.php
          php target/tests/update-center-credential-native-offer-runtime.php
          node --check target/src/assets/js/admin/admin-brand.js
          node --check target/tests/brand-v8-browser-proof.js
          python3 lane/build.py
      - name: Preserve completed controls proof for identical runtime bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh run download "$CONTROL_PROOF_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-layout-v8-candidate-$CONTROL_PROOF_RUN" --dir control-proof
          python3 lane/reuse-controls.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '{{PREVIOUS_BYTES}}'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = '{{PREVIOUS_SHA256}}'
      - name: Browser dependencies and 24 source-render cases
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          mkdir wp-css
          for f in common forms; do curl -fsSL "https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-admin/css/$f.css" -o "wp-css/$f.css"; done
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-includes/css/buttons.css -o wp-css/buttons.css
          NODE_PATH="$PWD/node_modules" V8_WP_CSS="$PWD/wp-css" node target/tests/brand-v8-browser-proof.js
          mkdir -p proof/fixture
          cp target/proof/*.json target/proof/*.png proof/fixture/
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-layout-v8-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
            proof/fixture/*.json
            proof/fixture/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py
