name: S01 frontend reference and human progress verification
on:
  push:
    branches: [task/s01-frontend-review-20261017]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Bound exact lane identity
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-frontend-review-20261017/spec.json --template runner/lanes/s01-frontend-review-20261017/candidate.template.yml --output /tmp/review-rendered.yml
          cmp /tmp/review-rendered.yml runner/.github/workflows/s01-frontend-review-20261017.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-frontend-review-20261017/spec.json --input runner/.github/workflows/s01-frontend-review-20261017.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-frontend-review-20261017 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target
      - name: Exact source and scoped syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          for path in target/src/inc/services/frontend-page-{directory,progress}-service.php target/src/inc/admin/views/frontend-page*.php target/src/inc/admin/controllers/layout.php target/src/inc/bootstrap/manifests/admin-tabs/layout.php; do php -l "$path";done
          node --check lane/browser.cjs
      - name: Browser runtime
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real isolated WordPress persistence and desktop browser
        run: bash lane/native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-review-proof-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove transient private source
        if: always()
        run: rm -rf target
