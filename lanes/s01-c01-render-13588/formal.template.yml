name: S01-C01 render formal release
on:
  push:
    branches: [task/{{LANE_ID}}-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      SOURCE_VERSION: '{{SOURCE_VERSION}}'
      BASE_SHA: '{{BASE_SHA}}'
      CANDIDATE_RUN: '{{CANDIDATE_RUN}}'
      CANDIDATE_SHA: '{{CANDIDATE_SHA}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-render-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .render_native_cases==6 and .render_controls=="PASS" and .render_draft_preservation=="PASS" and .render_form_preservation=="PASS" and .render_persistence=="PASS" and .render_csrf=="PASS" and .render_revision_conflict=="PASS" and .render_invalid_contract=="PASS" and .render_keyboard=="PASS" and .render_alignment=="PASS" and .render_disclosures=="PASS" and .render_network_failure=="PASS" and .render_busy_lock=="PASS" and .render_native_post=="PASS" and .render_true_blocked_state=="PASS" and .actual_presentation_consumers=="PASS" and .complete_save_readback=="PASS" and .bounded_performance=="PASS" and .clean_install=="PASS" and .recovery_data=="PASS" and .recovery_checks>=42 and .function_cases>=35 and .public_width_cases==6' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/{{LANE_ID}} lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          工具页渲染：统一单页设置、原生下拉与18px方形复选框，修复无脚本隐藏控件；增加重新检查已保存配置。
          修复不完整回读误报保存、保存中控件/预览可操作、超时/异常响应结果不明确、冲突重试覆盖风险。所有字段/校验/修订哈希确认后才清除修改，失败保留输入。
          已保存的默认模式、输入布局、参数展开、标准区进度、移动端降级和延迟资源加载作用于实际前台；专用页面模式优先。兼容字段拒绝未注册值；预加载仅获取已登记同源脚本/样式，不提前执行。
          Exact candidate Run: $CANDIDATE_RUN。真实隔离WordPress六宽度后台与前台、全部控件/保存/重载/异常/冲突/无脚本、实际呈现消费者、受限资源加载重复测量、干净安装、数据恢复，以及$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。发布前Assistant检查真实桌面和手机截图。
          Theme只负责本页及呈现消费者；Shell/Header/Main Menu、权限/nonce、Descriptor安全、Provider算法、SEO Canonical Truth与Updater机制保持。旧1.35.8说明明确封存，动态状态读取唯一Canonical Source。
          本轮验证限定工具页渲染及相关Theme功能，不代表全产品或Provider算法验收。OWNER真实使用待手工升级后复验，Production未执行；独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-render-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
