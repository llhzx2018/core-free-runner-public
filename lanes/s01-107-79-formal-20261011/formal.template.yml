name: S01 Theme107 M3U879 exact formal release
on:
  push:
    branches: [task/{{LANE_ID}}]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      SOURCE_VERSION: '{{SOURCE_VERSION}}'
      BASE_SHA: '{{BASE_SHA}}'
      THEME_MAIN_SHA: '{{THEME_MAIN_SHA}}'
      M3_SHA: '{{M3_SHA}}'
      M3_TREE: '{{M3_TREE}}'
      M3_VERSION: '{{M3_VERSION}}'
      M3_MAIN_SHA: '{{M3_MAIN_SHA}}'
      M3_SOURCE_VERSION: '{{M3_SOURCE_VERSION}}'
      M3_BASE_SHA: '{{M3_BASE_SHA}}'
      CANDIDATE_RUN: '{{CANDIDATE_RUN}}'
      CANDIDATE_SHA: '{{CANDIDATE_SHA}}'
      CANDIDATE_ARTIFACT: '{{CANDIDATE_ARTIFACT}}'
      CANDIDATE_DIGEST: '{{CANDIDATE_DIGEST}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact source and one-spec identity audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/{{LANE_ID}}/spec.json --template runner/lanes/{{LANE_ID}}/formal.template.yml --output /tmp/rendered-formal.yml >/dev/null
          cmp /tmp/rendered-formal.yml runner/.github/workflows/{{LANE_ID}}.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/{{LANE_ID}}/spec.json --input runner/.github/workflows/{{LANE_ID}}.yml > proof/lane-audit.json
          cp -a runner/lanes/{{LANE_ID}} lane
          bash -n lane/formal.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: m3target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010
          persist-credentials: false
          path: historic-footer
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed79-20261010-candidate
          persist-credentials: false
          path: historic-embed
      - name: Reverse verified Candidate and publish two formal private releases
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash lane/formal.sh
      - name: Public safe formal receipt only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-107-79-formal-receipt-${{ github.run_id }}
          path: |
            proof/lane-audit.json
            proof/candidate-reverse.json
            proof/identity.json
            proof/m3-identity.json
            proof/theme-FINAL_RELEASE.json
            proof/m3-FINAL_RELEASE.json
          if-no-files-found: error
          retention-days: 30
      - name: Read back exact actual formal receipt archive
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-proof.zip
          python3 - <<'PY'
          import os,json,hashlib,pathlib,zipfile
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text())
          b=pathlib.Path('/tmp/formal-proof.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not m['expired'] and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest() and m['size_in_bytes']==len(b)
          with zipfile.ZipFile('/tmp/formal-proof.zip') as z:
           assert z.testzip() is None
           expected={'lane-audit.json','candidate-reverse.json','identity.json','m3-identity.json','theme-FINAL_RELEASE.json','m3-FINAL_RELEASE.json'}
           assert set(z.namelist())==expected
           for n in expected: assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           for n in ['theme-FINAL_RELEASE.json','m3-FINAL_RELEASE.json']: assert json.loads(z.read(n))['status']=='PASS'
          print('PUBLIC_FORMAL_RECEIPT_READBACK',json.dumps({'status':'PASS','run_id':os.environ['GITHUB_RUN_ID'],'artifact_id':m['id'],'bytes':len(b),'digest':m['digest']}))
          PY
      - name: Remove private source and package working data
        if: always()
        run: rm -rf target m3target m3run historic-footer historic-embed readback /tmp/candidate-proof.zip /tmp/theme-expected.json proof/*.zip
