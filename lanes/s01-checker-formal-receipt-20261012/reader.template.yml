name: S01 immutable formal release receipt recovery
on:
  push:
    branches: [task/{{LANE_ID}}]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      FORMAL_RUN: '{{FORMAL_RUN}}'
      FORMAL_SHA: '{{FORMAL_SHA}}'
      FORMAL_ARTIFACT: '{{FORMAL_ARTIFACT}}'
      FORMAL_DIGEST: '{{FORMAL_DIGEST}}'
      THEME_MAIN: '{{THEME_MAIN}}'
      M3_MAIN: '{{M3_MAIN}}'
      M3_TREE: '{{M3_TREE}}'
      M3_VERSION: '{{M3_VERSION}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Verify exact reader spec
        run: |
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/{{LANE_ID}}/spec.json --template runner/lanes/{{LANE_ID}}/reader.template.yml --output /tmp/reader.yml
          cmp /tmp/reader.yml runner/.github/workflows/{{LANE_ID}}.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/{{LANE_ID}}/spec.json --input runner/.github/workflows/{{LANE_ID}}.yml > proof/lane-audit.json
      - name: Independently read immutable private assets and public receipt
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python3 runner/lanes/{{LANE_ID}}/receipt-reader.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success()
        with:
          name: s01-checker-formal-receipt-recovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error

