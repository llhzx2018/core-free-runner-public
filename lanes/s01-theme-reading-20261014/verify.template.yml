name: S01 desktop reading template exact-source verification
on:
  push:
    branches: [task/{{LANE_ID}}]
permissions:
  contents: read
  actions: read
jobs:
  reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      BASE_SHA: '{{BASE_SHA}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Registered lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/{{LANE_ID}}/spec.json --template runner/lanes/{{LANE_ID}}/verify.template.yml --output /tmp/rendered.yml >/dev/null
          cmp /tmp/rendered.yml runner/.github/workflows/{{LANE_ID}}.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/{{LANE_ID}}/spec.json --input runner/.github/workflows/{{LANE_ID}}.yml > proof/lane-identity.json
          cp -a runner/lanes/{{LANE_ID}} lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline
      - name: Real PHP functions and source identity
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '[:space:]' < target/VERSION)" = "$TARGET_VERSION"
          python3 - <<'PY'
          import json,subprocess,pathlib
          files=subprocess.check_output(['git','-C','target','diff','--name-only',__import__('os').environ['BASE_SHA'],'HEAD']).decode().splitlines()
          assert sorted(files)==sorted(json.loads(pathlib.Path('lane/allowed-changes.json').read_text())),files
          PY
          php -l target/src/inc/theme-native-toc.php
          php -l target/src/inc/content-reading-system.php
          php -l target/src/inc/modules/module-hero.php
          php target/tests/reading-short-section-index.php > proof/native-functions.json
          php target/tests/public-reading-final-owner-contract.php
          php target/tests/public-detail-heading-contract.php > proof/detail-heading.json
          node --check lane/reading-browser.cjs
          bash -n lane/native.sh
      - name: Frozen Provider and browser runtime
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          python3 - <<'PY'
          import pathlib,hashlib
          b=pathlib.Path('provider/vf-tools-m3u8_V1.25.91.zip').read_bytes()
          assert len(b)==3580535 and hashlib.sha256(b).hexdigest()=='fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df'
          PY
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress desktop geometry, navigation and state preservation
        run: bash lane/native.sh
      - name: Public-safe synthetic evidence only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-reading-proof-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Uploaded artifact readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/receipt.zip
          python3 - <<'PY'
          import hashlib,zipfile,json,os,pathlib,stat
          m=json.loads(pathlib.Path('/tmp/receipt-meta.json').read_text());d=pathlib.Path('/tmp/receipt.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert m['digest']=='sha256:'+hashlib.sha256(d).hexdigest() and m['size_in_bytes']==len(d)
          with zipfile.ZipFile('/tmp/receipt.zip') as z:
            assert z.testzip() is None
            for f in z.infolist():
              p=pathlib.PurePosixPath(f.filename);assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(f.external_attr>>16)
              assert p.suffix in ('.json','.png')
              if p.suffix=='.json':json.loads(z.read(f))
            final=json.loads(z.read('FINAL_EVIDENCE.json'));assert final['status']=='PASS' and final['source_sha']==os.environ['TARGET_SHA'] and final['source_tree']==os.environ['TARGET_TREE']
          print('PUBLIC_ARTIFACT_RECEIPT',json.dumps({'status':'PASS','id':m['id'],'bytes':len(d),'digest':m['digest'],'run_id':os.environ['GITHUB_RUN_ID']}))
          PY
      - name: Remove transient private sources and packages
        if: always()
        run: rm -rf target baseline provider /tmp/wp-cli-s01.phar
