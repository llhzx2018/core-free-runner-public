name: S01-C01 recovery formal release
on:
  push:
    branches: [task/{{LANE_ID}}-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      SOURCE_VERSION: '{{SOURCE_VERSION}}'
      BASE_SHA: '{{BASE_SHA}}'
      CANDIDATE_RUN: '{{CANDIDATE_RUN}}'
      CANDIDATE_SHA: '{{CANDIDATE_SHA}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-recovery-candidate-$CANDIDATE_RUN" --dir tested
          python3 - <<'PYREVERSE'
          import json,pathlib,os
          t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text())
          assert t['status']=='PASS' and t['source_sha']==os.environ['CANDIDATE_SHA'] and t['source_tree']==os.environ['TARGET_TREE'] and t['version']==os.environ['TARGET_VERSION']
          for k in ['upgrade','source_rollback','wordpress_browser','security_boundary','frozen_shell_header_menu','recovery_data','recovery_controls']:assert t[k]=='PASS',k
          assert t['recovery_viewports']==6 and t['recovery_data_check_count']>=42
          live=json.loads(pathlib.Path('tested/live-browser.json').read_text());data=json.loads(pathlib.Path('tested/recovery-data.json').read_text())
          required=['first_point_no_reload','real_download','native_no_js_export','real_preflight','real_import','real_restore','real_defaults','source_isolation','picker_cancel','expired_retry','failed_write_retry','draft_invalidation','summary_refresh','busy_lock','network_failure','revision_conflict','nonce','guest','permission','confirmation','corruption','upload_abuse','empty_refresh','long_picker','true_blocked']
          assert t['recovery_functional_checks']==required and all(live[k]=='PASS' for k in required)
          assert len(live['checks'])==6 and all(c['status']=='PASS' for c in live['checks']) and not live['errors']
          assert data['status']=='PASS' and len(data['checks'])>=42 and all(v=='PASS' for v in data['checks'].values())
          assert data['checks']['own_export_fits_upload_limit']=='PASS' and data['checks']['bounded_server_import_limits']=='PASS'
          assert t['owner_preview_runtime']=='N_A' and t['owner_real_use']=='POST_PRODUCTION_REQUIRED' and t['production']=='NOT_EXECUTED'
          PYREVERSE
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/{{LANE_ID}} lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          主题备份与恢复：四个任务共用同一个操作面，当前任务按钮在内容页底，减少空白与模块干扰。原生下拉、20px单选框、键盘任务切换、长恢复点列表滚动、确认与焦点恢复覆盖桌面和手机；打开弹窗先收起旧提示，避免遮挡标题或操作。
          修复导出的备份超过旧1MB限制而无法导回的问题；浏览器与后台共用服务器实际容量限制，上限8MB，文件/粘贴超限继续拒绝。
          首个恢复点创建后无需重载即可恢复；刷新同步真实七类设置、六类运行功能、容量和操作结果。切换上传/粘贴只提交当前来源；编辑输入立即撤销旧预检，过期和冲突可重新预检。执行中锁定其他操作，恢复默认不会保存另一任务的策略草稿。配置或恢复点异常时拒绝备份与新恢复点。
          Exact candidate Run: $CANDIDATE_RUN。隔离真实WordPress验证实际下载JSON、预检不写入、实际导入/恢复/默认、保护点、回读和运行功能；写入失败注入验证旧配置/策略/保护点回滚；nonce/guest/权限、备份损坏、版本和上传边界、网络/冲突/忙碌状态保持；$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/重新应用通过。
          本页按当前需求同时核对功能与UX/UI。Shell/头部/主菜单和既有导入恢复事务、权限机制、升级机制保持。Production由OWNER手工升级；独立Preview Runtime按SSOT为N_A，机器与Assistant检查不代表OWNER真实使用PASS。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-recovery-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
