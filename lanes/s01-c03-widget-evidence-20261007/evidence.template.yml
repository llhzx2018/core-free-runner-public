name: S01-C03 exact native evidence durable readback
on:
  push:
    branches: [task/s01-c03-widget-evidence-20261007]
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      NATIVE_RUN: '{{NATIVE_RUN}}'
      NATIVE_RUNNER_SHA: '{{NATIVE_RUNNER_SHA}}'
      NATIVE_ARTIFACT_ID: '{{NATIVE_ARTIFACT_ID}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Readback target spec
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c03-widget-evidence-20261007/spec.json --template runner/lanes/s01-c03-widget-evidence-20261007/evidence.template.yml --output /tmp/readback-rendered.yml >/dev/null
          cmp /tmp/readback-rendered.yml runner/.github/workflows/s01-c03-widget-evidence-20261007.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c03-widget-evidence-20261007/spec.json --input runner/.github/workflows/s01-c03-widget-evidence-20261007.yml
      - name: Read exact successful native archive only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" > /tmp/native-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_ARTIFACT_ID" > /tmp/native-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$NATIVE_ARTIFACT_ID/zip" > /tmp/native-proof.zip
          python3 runner/lanes/s01-c03-widget-evidence-20261007/readback.py
      - name: Temporary archive cleanup
        if: always()
        run: rm -f /tmp/native-proof.zip
