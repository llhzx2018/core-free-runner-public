name: S01-C03 widget exact formal release
on:
  push:
    branches: [task/s01-c03-widget-20261007-release]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      CANDIDATE_RUN: '{{CANDIDATE_RUN}}'
      CANDIDATE_RUNNER_SHA: '{{CANDIDATE_RUNNER_SHA}}'
      CANDIDATE_ARTIFACT_ID: '{{CANDIDATE_ARTIFACT_ID}}'
      PROMOTED_MAIN_SHA: '{{PROMOTED_MAIN_SHA}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target spec preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c03-widget-20261007-release/spec.json --template runner/lanes/s01-c03-widget-20261007-release/release.template.yml --output /tmp/rendered-release.yml >/dev/null
          cmp /tmp/rendered-release.yml runner/.github/workflows/s01-c03-widget-20261007-release.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c03-widget-20261007-release/spec.json --input runner/.github/workflows/s01-c03-widget-20261007-release.yml > proof/lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Actual candidate archive reverse verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > /tmp/candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/candidate-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/candidate-proof.zip
          python3 runner/lanes/s01-c03-widget-20261007-release/reverse.py
      - name: Exact promoted source and deterministic rebuild
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c03-widget-20261007-release lane
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq '.object.sha')" = "$PROMOTED_MAIN_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$PROMOTED_MAIN_SHA --jq '.tree.sha')" = "$TARGET_TREE"
          php target/tests/frontend-s01-uiux-final-owner-contract.php
          php target/tests/unit/package-physical-locator-contract.php
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('proof/identity.json').read_text());b=json.loads(pathlib.Path('candidate/proof/identity.json').read_text());assert a==b,(a,b)
          PY
      - name: Publish authorized exact tag and formal asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TARGET_REPO/git/refs/tags" > /tmp/tags.json
          gh api "repos/$TARGET_REPO/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import pathlib,json,os
          tag='v'+os.environ['TARGET_VERSION']
          assert not any(n['ref']=='refs/tags/'+tag for n in json.loads(pathlib.Path('/tmp/tags.json').read_text()))
          assert not any(n['tag_name']==tag for n in json.loads(pathlib.Path('/tmp/releases.json').read_text()))
          pathlib.Path('/tmp/release-notes.md').write_text('Fix the embedded widget duplicate main landmark, host-width overflow and small touch targets. Native isolated WordPress comparison, actual input/Clear/keyboard/mode/dropdown, upgrade/recovery/reapply/clean install and eight Theme pages cross-page configuration verified. Original engine issues: four to zero in the declared synthetic content/dependency environment. Source: '+os.environ['TARGET_SHA']+'; candidate run '+os.environ['CANDIDATE_RUN']+'. Production upgrade remains manual; no Owner product acceptance claimed. Existing separate backend Provider overview work is not included.\n')
          PY
          gh api "repos/$TARGET_REPO/git/refs" -X POST -f ref="refs/tags/v$TARGET_VERSION" -f sha="$PROMOTED_MAIN_SHA" > proof/tag.json
          gh release create "v$TARGET_VERSION" "proof/vf-tools-m3u8_V$TARGET_VERSION.zip" --repo "$TARGET_REPO" --verify-tag --title "VF Tools M3U8 V$TARGET_VERSION" --notes-file /tmp/release-notes.md
      - name: Exact delivered asset remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir delivered
          gh api "repos/$TARGET_REPO/releases/tags/v$TARGET_VERSION" > proof/release-meta.json
          gh api "repos/$TARGET_REPO/git/ref/tags/v$TARGET_VERSION" > /tmp/tag-readback.json
          gh release download "v$TARGET_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-m3u8_V$TARGET_VERSION.zip" --dir delivered
          python3 runner/lanes/s01-c03-widget-20261007-release/readback.py
      - name: Retain actual native visual crops
        run: |
          python3 -m pip -q install Pillow==11.3.0
          python3 - <<'PYVIS'
          from PIL import Image
          import pathlib,base64,io,json
          for width in [768,390]:
           p=pathlib.Path('candidate/checks/candidate/proof/provider-player-'+str(width)+'.png')
           im=Image.open(p)
           # Original actual browser PNG retained; crop only for human inspection.
           y=min(920 if width==768 else 1150,max(0,im.height-1200))
           crop=im.crop((0,y,im.width,min(im.height,y+1600)))
           path=pathlib.Path('proof/widget-visual-'+str(width)+'.jpg');crop.save(path,quality=70)
           print('VF_VISUAL_'+str(width)+'_BEGIN');print(base64.b64encode(path.read_bytes()).decode());print('VF_VISUAL_'+str(width)+'_END')
          PYVIS
      - name: Safe release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-widget-release-${{ github.run_id }}
          path: proof/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target candidate delivered proof/*.zip /tmp/candidate-proof.zip
