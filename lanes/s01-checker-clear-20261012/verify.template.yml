name: S01 C03 checker professional clear regression
on:
  pull_request:
    paths:
      - '.github/workflows/{{LANE_ID}}.yml'
permissions:
  contents: read
jobs:
  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      BASE_SHA: '{{BASE_SHA}}'
      TARGET_SHA: {{TARGET_SHA}}
      TARGET_TREE: {{TARGET_TREE}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned lane preflight
        run: |
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/{{LANE_ID}}/spec.json --template runner/lanes/{{LANE_ID}}/verify.template.yml --output /tmp/rendered.yml
          cmp /tmp/rendered.yml runner/.github/workflows/{{LANE_ID}}.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/{{LANE_ID}}/spec.json --input runner/.github/workflows/{{LANE_ID}}.yml > proof/lane-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: {{TARGET_SHA}}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: '{{REPOSITORY}}'
          ref: '{{BASE_SHA}}'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-source rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mkdir -p proof
          python - <<'PY'
          import json,os
          with open('proof/IDENTITY.json','w') as f:
              json.dump({'sourceSha':os.environ['TARGET_SHA'],'sourceTree':os.environ['TARGET_TREE'],'scope':'professional clear lifecycle; selected mode; fresh result; no production writes','productionWrites':False},f,indent=2)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/checker-browser" playwright@1.58.2
          node "$RUNNER_TEMP/checker-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Baseline must reproduce the stale professional report
        run: |
          set -euo pipefail
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          cp private-source/tests/playlist-checker-result-copy.browser.cjs baseline/tests/
          set +e
          NODE_PATH="$RUNNER_TEMP/checker-browser/node_modules" node baseline/tests/playlist-checker-result-copy.browser.cjs > /tmp/baseline.log 2>&1
          baseline_status=$?
          set -e
          test "$baseline_status" -ne 0
          grep -q 'Clear hides the previous professional report' /tmp/baseline.log
          echo 'PASS baseline reproduced: Clear hides the previous professional report assertion failed' > proof/BASELINE.txt
      - name: Execute syntax parser and actual renderer browser regressions
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          php -n -l src/includes/renderers/raw-playlist-checker.php
          php -n -l tests/fixtures/playlist-checker-result-copy.php
          node --check src/public/js/modules/playlist-checker.js
          node --check src/public/dist/playlist-checker.js
          node tests/playlist-checker-diagnostic-safety.node.cjs | tee ../proof/DIAGNOSTICS.txt
          NODE_PATH="$RUNNER_TEMP/checker-browser/node_modules" node tests/playlist-checker-result-copy.browser.cjs > ../proof/BROWSER.json
          python - <<'PY'
          import json
          p=json.load(open('../proof/BROWSER.json'))
          assert len(p['cases'])==12 and all(c['state']=='PASS' for c in p['cases'])
          print('PASS 12 bilingual source/dist browser cases')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: s01-c03-checker-result-copy-20261012
          path: proof/
          if-no-files-found: error
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf private-source baseline
