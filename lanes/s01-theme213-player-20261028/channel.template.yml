name: S01 exact Theme channel contract
on:
  push:
    branches: [{{BRANCH}}]
    paths: ['.github/workflows/{{LANE_ID}}-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: {{REPOSITORY}}
  TARGET_VERSION: {{TARGET_VERSION}}
  TARGET_SHA: {{TARGET_SHA}}
  UPDATE_SHA: {{UPDATE_SHA}}
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: {{UPDATE_SHA}}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/{{LANE_ID}}/channel-spec.json --input control/.github/workflows/{{LANE_ID}}-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only {{UPDATE_BASE_SHA}} {{UPDATE_SHA}})" = projects/S01-C01.json
          git -C source diff --exit-code {{UPDATE_BASE_SHA}} {{UPDATE_SHA}} -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='{{ASSET_SHA256}}' and m['asset_bytes']=={{ASSET_BYTES}}
          assert m['runtime_files']==476 and '{{SOURCE_VERSION}}' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          import pathlib,subprocess
          base=json.loads(subprocess.check_output(['git','show','{{UPDATE_BASE_SHA}}:projects/S01-C01.json']))
          changed={k for k in set(base)|set(m)if base.get(k)!=m.get(k)}
          assert changed=={'target_version','from_versions','release_tag','asset_name','asset_bytes','asset_sha256','notes','released_at'}
          assert m['from_versions']==base['from_versions']+['{{SOURCE_VERSION}}']
          pathlib.Path('../proof').mkdir(exist_ok=True)
          pathlib.Path('../proof/channel.json').write_text(json.dumps({'status':'PASS','source':'{{UPDATE_SHA}}','version':m['target_version'],'sha256':m['asset_sha256'],'bytes':m['asset_bytes'],'runtime_files':m['runtime_files'],'changed_fields':sorted(changed),'protocol_tests':'PASS','production':'UNTOUCHED'},indent=2))
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme213-channel-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf source
