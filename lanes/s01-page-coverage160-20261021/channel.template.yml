name: S01 exact Theme channel contract
on:
  push:
    branches: [{{BRANCH}}]
    paths: ['.github/workflows/s01-page-coverage-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: {{REPOSITORY}}
  TARGET_VERSION: {{TARGET_VERSION}}
  TARGET_SHA: {{TARGET_SHA}}
  UPDATE_SHA: {{UPDATE_SHA}}
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: {{UPDATE_SHA}}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='{{ASSET_SHA256}}' and m['asset_bytes']=={{ASSET_BYTES}}
          assert m['runtime_files']==476 and '{{SOURCE_VERSION}}' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
