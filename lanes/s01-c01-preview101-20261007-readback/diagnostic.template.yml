name: S01-C01 isolated workspace geometry
on:
  push:
    branches: [task/{{LANE_ID}}]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REPO: '{{REPOSITORY}}'
      TARGET_VERSION: '{{TARGET_VERSION}}'
      TARGET_SHA: '{{TARGET_SHA}}'
      TARGET_TREE: '{{TARGET_TREE}}'
      SOURCE_VERSION: '{{SOURCE_VERSIONS_CSV}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target-owned lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/{{LANE_ID}}/spec.json --template runner/lanes/{{LANE_ID}}/diagnostic.template.yml --output /tmp/preview-candidate-rendered.yml >/dev/null
          cmp /tmp/preview-candidate-rendered.yml runner/.github/workflows/{{LANE_ID}}.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/{{LANE_ID}}/spec.json --input runner/.github/workflows/{{LANE_ID}}.yml > proof/lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/{{LANE_ID}} lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/preview-human-language-followup-contract.php
          php target/tests/preview-workflow-v4-contract.php
          node --check target/tests/preview-controls-browser-check.js
          node --check target/tests/preview-workflow-browser-check.js
          python3 lane/build.py
      - name: Previous exact formal asset
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir previous
          gh release download v{{SOURCE_VERSIONS_CSV}} --repo "$TARGET_REPO" --pattern vf-tools-theme_V{{SOURCE_VERSIONS_CSV}}.zip --dir previous
          test "$(stat -c %s previous/vf-tools-theme_V{{SOURCE_VERSIONS_CSV}}.zip)" = 1786534
          test "$(sha256sum previous/vf-tools-theme_V{{SOURCE_VERSIONS_CSV}}.zip | awk '{print $1}')" = 7e62cfc6811574dc0ee0002da42cc6296b4ddc7278454ad1e812484d443c3aaf
      - name: Exact formal Provider dependency for isolated contrast
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir provider
          gh release download v1.25.57 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.57.zip --dir provider
          test "$(stat -c %s provider/vf-tools-m3u8_V1.25.57.zip)" = 3565910
          test "$(sha256sum provider/vf-tools-m3u8_V1.25.57.zip | awk '{print $1}')" = e12e822efa16ff071a22bd05af02d69461aa3738d0bcbde8660adb326fa6143f
          python3 - <<'PYZIP'
          import zipfile,pathlib,stat
          with zipfile.ZipFile('provider/vf-tools-m3u8_V1.25.57.zip') as z:
            assert z.testzip() is None
            for i in z.infolist():
              p=pathlib.PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(i.external_attr>>16)
          PYZIP
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Exact stage and Provider-only contrast
        run: bash lane/stage-probe.sh
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target provider proof/*.zip
