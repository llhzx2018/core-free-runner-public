name: P05 V1.1.12 Formal FULL Publication

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_MAIN_SOURCE: c76991297b4508ebd1d1f656c06f5989f60629f7
      P05_VERIFIED_TREE: c9bbbc7563e18a9619cee09dd771121f7c9ba63c
      P05_EXACT_SOURCE: b3cede5d2c06e4e93553e1c32543c0627e3881d4
      P05_FINAL_GATE_RUN: '33333697238'
      P05_FINAL_GATE_JOB: '99316710921'
      VERSION: 1.1.12
      ASSET: VF_SEO_V1.1.12_FULL.zip
      RECEIPT: VF_SEO_V1.1.12_RELEASE_RECEIPT.txt
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - name: Bind Final Exact Source PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$P05_FINAL_GATE_RUN" > /tmp/final-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$P05_FINAL_GATE_JOB" > /tmp/final-job.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/final-run.json')); job=json.load(open('/tmp/final-job.json'))
          assert run['id']==int(os.environ['P05_FINAL_GATE_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['P05_FINAL_GATE_JOB']) and job['run_id']==int(os.environ['P05_FINAL_GATE_RUN']) and job['conclusion']=='success'
          assert job['name']=='final-exact-source'
          print('P05_V1112_FINAL_GATE_BINDING=PASS')
          PY

      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact promotion and current Production truth
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(git rev-parse "$P05_EXACT_SOURCE^{tree}")" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.1.12') process.exit(1);
          if(v.version!=='1.1.12'||v.target_version!=='1.1.12'||v.working_version!=='1.1.12') process.exit(1);
          if(v.production_version!=='1.1.11'||v.production_write!==0) process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          echo 'P05_V1112_MAIN_TREE_EQUIVALENT=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies and PHP runtime modules
        run: |
          set -Eeuo pipefail
          cd p05 && npm ci && cd ..
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl sqlite3
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e))exit(1);} if(!class_exists("ZipArchive"))exit(1);'

      - name: Complete engineering and security regression
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate

      - name: PHP and CloudPanel/browser regression
        working-directory: p05
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = "$VERSION"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' "$S/PHP_RELEASE_MANIFEST.json" >/dev/null
          ! grep -F 'core-free-runner-public' "$S/PHP_RELEASE_MANIFEST.json"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh

      - name: Rebuild pristine formal staging
        working-directory: p05
        run: |
          set -Eeuo pipefail
          rm -rf build/vf-seo-php-release dist/client
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.env"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -name runtime.env -o -name setup.lock.json \) | grep -q .; then exit 1; fi

      - name: Deterministic FULL build
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release'); asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix(); info=ZipInfo(rel,(1980,1,1,0,0,0))
                      info.external_attr=((p.stat().st_mode & 0o777) & 0xFFFF) << 16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a'); build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"; rm "../$ASSET.b"
          sha="$(sha256sum "../$ASSET"|awk '{print $1}')"
          bytes="$(stat -c%s "../$ASSET")"
          files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_EXACT_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nUPDATE_AUTHORITY=core-updates:llhzx2018/core-updates/projects/P05.json\nBINARY_AUTHORITY=llhzx2018/vf-seo Release UPDATE.zip\nATOMIC_AUTHORITY=repair-v*.php\nPRODUCTION_VERSION=1.1.11\nPRODUCTION_WRITE=0\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_EXACT_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"
          echo "P05_V1112_FULL_SHA256=$sha"

      - name: Publish private Product Release v1.1.12 FULL
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2; exit 1
          fi
          gh release create "v$VERSION" --repo llhzx2018/vf-seo --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.1.12 · Backend Update Closure' \
            --notes 'V1.1.12 makes 系统与更新 a first-class authenticated backend workspace and restores the common update authority: core-updates/projects/P05.json → vf-seo Product Release UPDATE.zip → standard Atomic repair. The obsolete public-mirror/FULL updater route is forbidden. Runtime Pointer/private SQLite boundaries and browser-first install remain unchanged. Current Production remains owner-observed v1.1.11; this publication performs no Production write. Atomic UPDATE/repair assets are published only after their separate formal gate passes.' \
            "$ASSET" "$RECEIPT"

      - name: Remote readback FULL Release truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json')); a={x['name']:x for x in r['assets']}
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          full=a[os.environ['ASSET']]
          assert int(full['size'])==int(os.environ['P05_BYTES'])
          assert full.get('digest')=='sha256:'+os.environ['P05_SHA256']
          assert os.environ['RECEIPT'] in a
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_FULL_ASSET_ID='+str(full['id']))
          print('P05_V1112_FORMAL_FULL_PUBLICATION=PASS')
          print('P05_PRODUCTION_WRITE=0')
          PY
