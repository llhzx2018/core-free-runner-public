name: P04 V2.7.4 Bounded Runtime Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-v274-diagnostic-*.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require registered private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || exit 78

      - name: Checkout exact candidate ephemerally
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: a7593cecd1e20e696db4fd38c04c7a85f578d500
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p04

      - name: Prepare PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium
        working-directory: p04
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Run bounded current runtime gate
        id: gate
        working-directory: p04
        shell: bash
        env:
          VF_V274_TESTED_RUNTIME_COMMIT: a7593cecd1e20e696db4fd38c04c7a85f578d500
          VF_V274_EVIDENCE_DIR: ${{ runner.temp }}/p04-v274-diagnostic-evidence
          VF_V274_KEEP_TMP: '1'
        run: |
          set -Eeuo pipefail
          timeout --signal=TERM --kill-after=10s 420s bash scripts/run-v274-runtime-consolidation-gate.sh

      - name: Diagnostic summary on failure or timeout
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          E="$RUNNER_TEMP/p04-v274-diagnostic-evidence"
          echo '=== EVIDENCE FILES ==='
          if [ -d "$E" ]; then find "$E" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort; fi
          if [ -f "$E/V274_RUNTIME_CONSOLIDATION_REPORT.json" ]; then
            echo '=== REPORT ==='
            jq '{status,version,schema,migration,route_ownership,overview_truth,settings_performance,backup,advanced,desktop,mobile,screenshots,page_errors,console_errors}' "$E/V274_RUNTIME_CONSOLIDATION_REPORT.json"
          fi
          echo '=== SERVER LOG TAIL ==='
          latest="$(find /tmp -maxdepth 1 -type d -name 'vf-infra-v274-runtime-*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -n "$latest" ] && [ -f "$latest/php-server.log" ]; then tail -n 120 "$latest/php-server.log"; fi
          exit 1
