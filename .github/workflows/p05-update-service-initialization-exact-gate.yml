name: P05 Update Service Initialization Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-update-service-initialization-exact-gate.yml'

permissions:
  contents: read

env:
  P05_BASE: c251d95c2bdca5e5738604df1b23d29c51057410
  P05_CANDIDATE: 9a4d2dfbcab9bb33893a18338b7fb24b06c4e016

jobs:
  exact-source:
    if: github.head_ref == 'tmp/p05-update-service-initialization-gate-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Bind exact source and two-file scope
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          git cat-file -e "$P05_BASE^{commit}"
          test "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" | sort | tr '\n' ' ')" = 'src/client/UpdateShortcut.tsx tests/unit/update-shortcut-initialization.test.ts '
          git diff --check "$P05_BASE" "$P05_CANDIDATE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          echo P05_UPDATE_INIT_EXACT_SCOPE=PASS

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Product and engineering regression
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run security:gate
          echo P05_UPDATE_INIT_ENGINEERING=PASS

      - name: Update initialization truth and secret-boundary gate
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          UI=src/client/UpdateShortcut.tsx
          ROUTES=php/src/RuntimeOpsRoutesTrait.php
          UPDATER=php/src/PhpUpdater.php
          grep -Fq '连接更新服务' "$UI"
          grep -Fq '/api/system/update/credential' "$UI"
          grep -Fq '/api/system/step-up' "$UI"
          grep -Fq '后续版本会自动复用' "$UI"
          grep -Fq 'type="password"' "$UI"
          ! grep -Fq '稍后再试即可，不需要额外配置' "$UI"
          ! grep -Eq 'localStorage|sessionStorage' "$UI"
          grep -Fq "if (\$path === '/api/system/update/credential'" "$ROUTES"
          grep -Fq 'STEP_UP_REQUIRED' "$ROUTES"
          grep -Fq "if (\$path === '/api/system/step-up'" "$ROUTES"
          grep -Fq 'private const TOKEN_ENV = '\''VF_PRIVATE_READ_TOKEN'\''' "$UPDATER"
          grep -Fq '\$manifest = \$this->fetchValidatedManifest(\$token);' "$UPDATER" || grep -Fq '$manifest = $this->fetchValidatedManifest($token);' "$UPDATER"
          grep -Fq '$this->assertReleaseIdentity($manifest, $found);' "$UPDATER"
          grep -Fq '$this->writeRuntimeEnvValue(self::TOKEN_ENV, $token);' "$UPDATER"
          test -z "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" -- php/src/PhpUpdater.php php/src/RuntimeOpsRoutesTrait.php)"
          echo P05_UPDATE_INIT_SECRET_BOUNDARY=PASS

      - name: Seal exact candidate
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          echo "P05_UPDATE_SERVICE_INITIALIZATION_GATE=PASS"
          echo "product_write=0"
          echo "release_write=0"
          echo "production_write=0"
