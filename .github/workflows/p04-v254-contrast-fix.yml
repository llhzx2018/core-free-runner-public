name: P04 V2.5.4 Contrast Fix

on:
  push:
    paths:
      - '.github/workflows/p04-v254-contrast-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Apply exact contrast correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/v254-ui.css')
          s=p.read_text(encoding='utf-8')
          old='--vf-primary:#0b956d;--vf-primary-hover:#087b5b;--vf-primary-soft:#eaf7f1;'
          new='--vf-primary:#087b5b;--vf-primary-hover:#05684d;--vf-primary-soft:#eaf7f1;'
          if s.count(old)!=1: raise SystemExit('v254 primary sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('public/maintenance.php')
          s=p.read_text(encoding='utf-8')
          old='--brand:#0b956d;--brand-hover:#087b5b;'
          new='--brand:#087b5b;--brand-hover:#05684d;'
          if s.count(old)!=1: raise SystemExit('maintenance brand sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l public/maintenance.php
          git diff --check
          git diff --name-only
          test "$(git diff --name-only)" = $'public/assets/v254-ui.css\npublic/maintenance.php'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add public/assets/v254-ui.css public/maintenance.php
          git commit -m 'fix(P04): meet WCAG contrast for V2.5.4 primary actions'
          git push origin HEAD:maintenance/p04-v2.5.4-full-backend-ui-20260816
