name: P04 V2.8.10 Publication
on:
  push:
    paths:
      - '.github/workflows/p04-v2810-publication-20260828.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-infra
      MACHINE_SOURCE: 8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98
      MERGED_MAIN: 0a2fe242422cdeaece988c742e29a82c034ae25a
      FORMAL_RUN: 33142877248
      FORMAL_ARTIFACT: P04-V2.8.10-FORMAL-RELEASE-SET
      TAG: v2.8.10
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact verified release and update channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p04-publish/artifact" "$RUNNER_TEMP/p04-publish/assets"
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" --dir "$RUNNER_TEMP/p04-publish/artifact"
          FULL_SRC="$(find "$RUNNER_TEMP/p04-publish/artifact" -type f -name 'VF_Infra_V2.8.10_FULL.zip' -print -quit)"
          UPDATE_SRC="$(find "$RUNNER_TEMP/p04-publish/artifact" -type f -name 'VF_Infra_V2.8.10_UPDATE.zip' -print -quit)"
          test -n "$FULL_SRC" -a -n "$UPDATE_SRC"
          cp "$FULL_SRC" "$RUNNER_TEMP/p04-publish/assets/VF_Infra_V2.8.10_FULL.zip"
          cp "$UPDATE_SRC" "$RUNNER_TEMP/p04-publish/assets/VF_Infra_V2.8.10_UPDATE.zip"
          cd "$RUNNER_TEMP/p04-publish/assets"
          sha256sum VF_Infra_V2.8.10_FULL.zip VF_Infra_V2.8.10_UPDATE.zip > RELEASE_SHA256SUMS.txt
          FULL_SHA="$(sha256sum VF_Infra_V2.8.10_FULL.zip | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum VF_Infra_V2.8.10_UPDATE.zip | awk '{print $1}')"
          UPDATE_BYTES="$(stat -c %s VF_Infra_V2.8.10_UPDATE.zip)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "$RUNNER_TEMP/p04-publish/product" >/dev/null 2>&1
          cd "$RUNNER_TEMP/p04-publish/product"
          test "$(git rev-parse origin/main)" = "$MERGED_MAIN"
          git cat-file -e "$MACHINE_SOURCE^{commit}"
          test "$(git show "$MACHINE_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.10'
          PRODUCT_TREE="$(git show -s --format=%T "$MACHINE_SOURCE")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then echo P04_V2810_TAG_ALREADY_EXISTS; exit 31; fi
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git tag "$TAG" "$MACHINE_SOURCE"
          git push origin "refs/tags/$TAG"

          cd "$RUNNER_TEMP/p04-publish/assets"
          cat > release-notes.md <<'MD'
          # P04 · VF Infra V2.8.10

          Common Product Baseline V2 正式发布。

          - 15 个必需 Domain 全部进入正式 Runtime Resolver，LOGGING closure 已闭环。
          - Common Baseline V2：DRIFT=0 / UNKNOWN=0；既有 Exception / N_A 保持可追踪。
          - System Info / System Baseline / Online Update / Backup-Restore / Runtime Health 维持统一运维语义。
          - PERSONAL_SINGLE_ADMIN 安全基线保持机器验证状态；Provider Authority 继续 READ_ONLY_FIRST。
          - Fresh Install / Schema 14 / deterministic FULL+UPDATE / Browser Maintenance 均真实通过。
          - V2.8.9 → V2.8.10 Source-Exact Atomic PASS；Schema 14 不变，Migration NONE。
          - Production 不由发布动作自动修改，需 Owner 在 VF Infra 后台执行在线升级。

          Formal Gate: Run 33142877248 / Job 98757392839 = PASS.
          Final Exact Source Gate: Run 33142975819 / Job 98757709324 = PASS.
          MD
          gh release create "$TAG" VF_Infra_V2.8.10_FULL.zip VF_Infra_V2.8.10_UPDATE.zip RELEASE_SHA256SUMS.txt \
            -R "$PRODUCT_REPO" --title 'VF Infra V2.8.10' --notes-file release-notes.md
          RELEASE_JSON="$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}")"
          RELEASE_ID="$(jq -r '.id' <<<"$RELEASE_JSON")"
          RELEASED_AT="$(jq -r '.published_at' <<<"$RELEASE_JSON")"
          UPDATE_ID="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.10_UPDATE.zip")|.id' <<<"$RELEASE_JSON")"
          REMOTE_UPDATE_BYTES="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.10_UPDATE.zip")|.size' <<<"$RELEASE_JSON")"
          REMOTE_UPDATE_DIGEST="$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.10_UPDATE.zip")|.digest' <<<"$RELEASE_JSON")"
          test "$REMOTE_UPDATE_BYTES" = "$UPDATE_BYTES"
          test "$REMOTE_UPDATE_DIGEST" = "sha256:$UPDATE_SHA"
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$MACHINE_SOURCE"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" "$RUNNER_TEMP/p04-publish/core-updates" >/dev/null 2>&1
          cd "$RUNNER_TEMP/p04-publish/core-updates"
          python3 - "$RELEASE_ID" "$RELEASED_AT" "$UPDATE_ID" "$UPDATE_BYTES" "$UPDATE_SHA" "$PRODUCT_TREE" <<'PY'
          import json,sys
          from pathlib import Path
          release_id=int(sys.argv[1]); released_at=sys.argv[2]; asset_id=int(sys.argv[3]); asset_bytes=int(sys.argv[4]); asset_sha=sys.argv[5]; tree=sys.argv[6]
          p=Path('projects/P04.json'); old=json.loads(p.read_text(encoding='utf-8'))
          assert old['project_id']=='P04' and old['target_version']=='2.8.9'
          d={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.8.10','update_type':'ATOMIC','from_versions':['2.8.9'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra',
            'release_tag':'v2.8.10','release_name':'VF Infra V2.8.10','release_id':release_id,
            'release_product_commit':'8f91cc4c7bd9fadf6398eda60bcd2c2283a02d98','release_product_tree':tree,
            'asset_name':'VF_Infra_V2.8.10_UPDATE.zip','asset_id':asset_id,'asset_bytes':asset_bytes,'asset_sha256':asset_sha,
            'backup_required':True,'rollback_supported':True,'released_at':released_at,'minimum_php':'8.0.0',
            'notes':'V2.8.10 正式发布 Common Product Baseline V2；15/15 Required Domains、LOGGING closure、DRIFT=0/UNKNOWN=0。Schema 14，无 Migration；仅支持 V2.8.9 → V2.8.10 Atomic，Provider Authority 继续 READ_ONLY_FIRST。'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool projects/P04.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P04.json
          git commit -m 'release(P04): publish V2.8.10 update channel'
          git push origin main
          echo "P04_V2810_RELEASE_ID=$RELEASE_ID"
          echo "P04_V2810_UPDATE_ASSET_ID=$UPDATE_ID"
          echo "P04_V2810_FULL_SHA256=$FULL_SHA"
          echo "P04_V2810_UPDATE_SHA256=$UPDATE_SHA"
          echo "P04_V2810_UPDATE_BYTES=$UPDATE_BYTES"
          echo "P04_V2810_TAG_SOURCE=$MACHINE_SOURCE"
          echo P04_V2810_PUBLICATION=PASS
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.10-PUBLICATION-EVIDENCE
          path: |
            ${{ runner.temp }}/p04-publish/assets/RELEASE_SHA256SUMS.txt
            ${{ runner.temp }}/p04-publish/assets/release-notes.md
          if-no-files-found: error
