name: P01 Favicon Exception Audit

on:
  push:
    branches:
      - test-p01-favicon-exception-audit-20260930
    paths:
      - '.github/workflows/temp-p01-favicon-exception-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 34bb84fcd36e96494a091e2a9295fc4187052903
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Audit provider and source favicon behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess, re, html
          domains=["voluum.com","webcare360.com"]
          def curl(url, extra=None):
              cmd=["curl","-L","-sS","--max-time","12","-D","-","-o","/tmp/body.bin",url]
              if extra: cmd[1:1]=extra
              p=subprocess.run(cmd,text=True,capture_output=True)
              headers=p.stdout
              body=b""
              try:
                  body=open("/tmp/body.bin","rb").read()
              except Exception:
                  pass
              status=0
              m=re.findall(r"HTTP/\S+\s+(\d+)",headers)
              if m: status=int(m[-1])
              ct=""
              ms=re.findall(r"(?im)^content-type:\s*([^\r\n]+)",headers)
              if ms: ct=ms[-1].strip()
              return {"url":url,"rc":p.returncode,"status":status,"content_type":ct,"bytes":len(body),"body":body,"stderr":p.stderr[-500:]}
          out=[]
          for d in domains:
              row={"domain":d}
              r=curl(f"https://a.favicon.im/{d}?throw-error-on-404=true",["-H","Accept: image/png,image/x-icon,image/vnd.microsoft.icon,image/webp,image/jpeg,image/gif;q=0.9"])
              row["provider"]={k:v for k,v in r.items() if k!="body"}
              row["provider_head_hex"]=r["body"][:32].hex()
              rr=curl(f"https://{d}/favicon.ico")
              row["root_favicon"]={k:v for k,v in rr.items() if k!="body"}
              row["root_head_hex"]=rr["body"][:32].hex()
              page=curl(f"https://{d}/")
              text=page["body"][:524288].decode("utf-8","replace")
              icons=[]
              for tag in re.findall(r"<link\b[^>]*>",text,re.I):
                  if re.search(r"\brel\s*=\s*(['\"]).*?(?:icon|apple-touch-icon).*?\1",tag,re.I):
                      href=re.search(r"\bhref\s*=\s*(['\"])(.*?)\1",tag,re.I)
                      if href: icons.append(html.unescape(href.group(2)))
              row["page"]={k:v for k,v in page.items() if k!="body"}
              row["declared_icons"]=icons[:20]
              out.append(row)
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
          echo P01_FAVICON_EXCEPTION_AUDIT=PASS

      - name: Feed real provider SVGs through P01 validator
        shell: bash
        run: |
          set -Eeuo pipefail
          for domain in voluum.com webcare360.com; do
            curl -fsS --max-time 12 "https://a.favicon.im/${domain}?throw-error-on-404=true" -o "/tmp/${domain}.svg"
          done
          cat >/tmp/favicon-validator-gate.php <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/product/src/app/bootstrap.php';
          $ref=new ReflectionClass(VfIconCache::class);
          $cache=$ref->newInstanceWithoutConstructor();
          $m=$ref->getMethod('validateImage');
          $m->setAccessible(true);
          foreach(['voluum.com','webcare360.com'] as $domain){
              $bytes=(string)file_get_contents('/tmp/'.$domain.'.svg');
              try{
                  $r=$m->invoke($cache,$bytes,'image/svg+xml');
                  echo json_encode(['domain'=>$domain,'accepted'=>true,'mime'=>$r['mime']??'','width'=>$r['width']??0,'height'=>$r['height']??0],JSON_UNESCAPED_SLASHES)."\n";
                  if(($r['mime']??'')!=='image/svg+xml') exit(41);
              }catch(Throwable $e){
                  $tags=[];
                  if(preg_match_all('/<\/?([A-Za-z][A-Za-z0-9:_-]*)\b/', $bytes, $mm)) $tags=array_values(array_unique(array_map('strtolower',$mm[1])));
                  $attrs=[];
                  foreach(['style=','href=','xlink:href=','url(','<style','<use','<image','<filter','<fe','<animate',' on'] as $needle){
                      if(stripos($bytes,$needle)!==false)$attrs[]=$needle;
                  }
                  echo json_encode(['domain'=>$domain,'accepted'=>false,'error'=>$e->getMessage(),'tags'=>$tags,'active_markers'=>$attrs],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
                  exit(42);
              }
          }
          PHP
          php /tmp/favicon-validator-gate.php
          (cd product && php tests/unit/navigation_v247127_safe_svg_favicon_contract.php)
          echo P01_FAVICON_REAL_SVG_VALIDATOR_AUDIT=PASS
