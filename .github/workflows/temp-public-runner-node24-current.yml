name: TEMP Public Runner Node24 Current Action Gate

on:
  push:
    branches:
      - verify/public-runner-node24-current-20260829

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 6b742ec4e013a962900a0ebd6aef54994e83fcf3
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and bounded non-BOOK delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base=3a35ded4c4b8e0f2d3b9b36d389f64e73cdef658
          test "$(git rev-parse HEAD)" = "6b742ec4e013a962900a0ebd6aef54994e83fcf3"
          actual="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/core-agent-current-verify.yml' '.github/workflows/runner-selftest-current.yml' | sort)"
          test "$actual" = "$expected"
          test "$(git diff --numstat "$base"...HEAD -- .github/workflows/core-agent-current-verify.yml)" = $'3\t3\t.github/workflows/core-agent-current-verify.yml'
          test "$(git diff --numstat "$base"...HEAD -- .github/workflows/runner-selftest-current.yml)" = $'2\t2\t.github/workflows/runner-selftest-current.yml'
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/core-agent-current-verify.yml
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/runner-selftest-current.yml
          grep -q 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/runner-selftest-current.yml
          ! grep -E -q 'actions/(checkout|upload-artifact)@v[0-9]+' .github/workflows/core-agent-current-verify.yml .github/workflows/runner-selftest-current.yml
          echo 'BOOK_WORKFLOW_UNCHANGED=PROVEN'

      - name: Run public runner regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -v

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > public-runner-node24-current-receipt.txt <<'EOF'
          EXACT_SOURCE=6b742ec4e013a962900a0ebd6aef54994e83fcf3
          EXACT_BASE=3a35ded4c4b8e0f2d3b9b36d389f64e73cdef658
          CHANGED_FILES=2
          BOOK_WORKFLOW_CHANGED=NO
          PRIVATE_SOURCE_USED=NO
          MAIN_WRITE=NO
          NODE24_CURRENT_ACTION_GATE=PASS
          EOF

      - name: Exercise pinned Node24 upload-artifact runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: public-runner-node24-current-${{ github.run_id }}
          path: public-runner-node24-current-receipt.txt
          if-no-files-found: error
          retention-days: 1

      - name: Machine marker
        run: echo 'PUBLIC_RUNNER_NODE24_CURRENT_MACHINE=PASS'
