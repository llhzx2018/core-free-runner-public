name: P02 V2.5.57 Overlay Empty Responsive Gate

on:
  push:
    branches:
      - run/p02-v2557-overlay-empty-20260920
    paths:
      - '.github/workflows/p02-v2557-overlay-empty-responsive.yml'

permissions:
  contents: read

jobs:
  ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: 6ecce964aaab77f74d921274e928e70a2c594d79
      TARGET_VERSION: 2.5.57
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 6ecce964aaab77f74d921274e928e70a2c594d79
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact source and repository contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          bash scripts/verify-repository.sh
          tests=(
            tests/unit/p02_daily_ux_micro_refinement.mjs
            tests/unit/p02_daily_ux_flow_refinement.mjs
            tests/unit/p02_daily_ux_task_continuity.mjs
            tests/unit/p02_reader_action_continuity.mjs
            tests/unit/p02_workspace_mode_truth.mjs
            tests/unit/p02_reader_command_hierarchy.mjs
            tests/unit/p02_reader_menu_keyboard_flow.mjs
            tests/unit/p02_workspace_more_keyboard_parity.mjs
            tests/unit/p02_ux_browser_harness_contract.mjs
            tests/unit/p02_csp_runtime_config_contract.mjs
            tests/unit/p02_maintenance_version_authority_contract.mjs
            tests/unit/p02_maintenance_recent_auth_contract.mjs
            tests/unit/p02_maintenance_workspace_command_contract.mjs
            tests/unit/p02_maintenance_session_loss_contract.mjs
            tests/unit/p02_verification_lane_architecture_contract.mjs
            tests/unit/p02_candidate_version_identity_contract.mjs
            tests/unit/p02_candidate_packaging_contract.mjs
            tests/unit/p02_reading_comfort_baseline.mjs
            tests/unit/p02_visible_shell_refactor.mjs
            tests/unit/p02_inkstone_shell_parity.mjs
            tests/unit/p02_update_authorization_recovery.mjs
            tests/unit/p02_multisource_repair_contract.mjs
          )
          for t in "${tests[@]}"; do node "$t"; done
          echo P02_V2557_OVERLAY_EMPTY_SOURCE_GATE=PASS

      - name: Real Chromium 1440 1024 390 matrix
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh | tee /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2557_MEDIUM_1024_MATRIX=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2557_MOBILE_SHEET=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2557_MOBILE_EMPTY_ACTIONS=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2556_CATEGORY_SETTINGS_DESKTOP=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2556_CATEGORY_SETTINGS_MOBILE=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2555_COMPLEX_SETTINGS_DESKTOP=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_V2555_COMPLEX_SETTINGS_MOBILE=PASS' /tmp/p02-v2557-browser.log
          grep -Fx 'P02_UX_BROWSER_REVERIFY=PASS' /tmp/p02-v2557-browser.log
          echo P02_V2557_OVERLAY_EMPTY_BROWSER_GATE=PASS
