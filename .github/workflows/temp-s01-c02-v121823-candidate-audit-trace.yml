name: TEMP S01-C02 Ops 1.21.823 Candidate Audit Trace
on:
  push:
    branches:
      - temp/s01-c02-v121823-candidate-failure-readback-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121823-candidate-audit-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: e4bf4735f881fe733b04f309f9db517ebae71a34
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Trace candidate audit writers and failure producers
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CANDIDATE_AUDIT_REFERENCES ==='
          grep -RInE --include='*.php' "candidate_audit|final_candidate_audit_result|result_failed|generation_result" ops/includes ops/vf-ops.php | head -n 800 || true
          echo '=== FAILURE_APPEND_PATTERNS ==='
          grep -RInE --include='*.php' "failures\[\]|\['failures'\]|candidate.*audit|audit.*candidate" ops/includes/release ops/includes/cf-release ops/includes/cf-static* ops/includes/formal-candidate-service.php | head -n 1200 || true
          echo '=== FINAL_CANDIDATE_AUDIT ==='
          sed -n '1,320p' ops/includes/release/audits/class-final-candidate-audit.php
          echo '=== FINAL_AUDIT_STEP ==='
          sed -n '1,280p' ops/includes/release/steps/class-step-final-audit.php
          echo '=== CANDIDATE_ARTIFACT_BUILDER ==='
          sed -n '1,360p' ops/includes/release/builders/class-candidate-artifact-builder.php
          echo '=== CANDIDATE_ENTRY_PROCESSOR ==='
          sed -n '1,360p' ops/includes/release/builders/class-candidate-entry-processor.php
          echo 'PASS_V121823_CANDIDATE_AUDIT_TRACE_V2'
