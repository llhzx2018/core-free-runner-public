name: P01 Upload Cache Audit

on:
  push:
    branches:
      - vf-agent-operations-v1
    paths:
      - '.github/workflows/p01-upload-cache-audit.yml'
      - 'requests/p01-upload-cache-audit-*.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 928f262e89b29e4933a26148c123863b9b5b18d5
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          path: p01
      - name: Exact source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo EXACT_SOURCE=$EXPECTED_HEAD
      - name: Upload source audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILE INPUT / UPLOAD ENTRYPOINTS ==='
          grep -RInE --include='*.php' '\$_FILES|move_uploaded_file|is_uploaded_file|UPLOAD_ERR_|post_max_size|upload_max_filesize' p01/src | head -240 || true
          echo '=== MIME / EXTENSION / IMAGE VALIDATION ==='
          grep -RInE --include='*.php' 'finfo|mime_content_type|getimagesize|allowed|allowlist|extension|pathinfo|basename\(' p01/src/app p01/src/api.php | head -260 || true
          echo '=== ARCHIVE / EXTRACTION ==='
          grep -RInE --include='*.php' 'ZipArchive|PharData|extractTo|archive|tar\.gz|uncompressed|numFiles|statIndex|realpath|\.\./' p01/src/app p01/src/api.php | head -320 || true
          echo UPLOAD_AUDIT_COMPLETE
      - name: Cache source audit
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CACHE HEADERS ==='
          grep -RInE --include='*.php' "Cache-Control|Expires:|ETag|Last-Modified|no-store|immutable|max-age|stale-while-revalidate" p01/src | head -320 || true
          echo '=== STATIC ASSET IDENTITY ==='
          grep -RInE --include='*.php' --include='*.js' 'asset_url|\?v=|VERSION|VF_VERSION|filemtime|cache' p01/src/app/AdminShell.php p01/src/index.php p01/src/assets p01/src/app | head -320 || true
          echo CACHE_AUDIT_COMPLETE
