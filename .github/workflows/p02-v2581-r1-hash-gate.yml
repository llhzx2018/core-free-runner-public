name: P02 V2.5.81 R1 Hash Gate
# rerun: r3-final-mobile-touch

on:
  push:
    branches:
      - task/p02-v2581-r1-hash-gate-20260921
    paths:
      - '.github/workflows/p02-v2581-r1-hash-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: p02-v2581-detail-bugfix-r1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Candidate identity and changed hashes
        working-directory: product
        run: |
          echo "P02_R1_HEAD=$(git rev-parse HEAD)"
          echo "P02_R1_VERSION=$(tr -d '\r\n' < VERSION)"
          for f in VERSION public/assets/app.js public/assets/app.css public/assets/maintenance.js public/assets/scratch-tabs.js public/system-baseline.php public/system-info.php public/diagnose.php; do
            bytes=$(wc -c < "$f" | tr -d ' ')
            sha=$(sha256sum "$f" | awk '{print $1}')
            echo "HASH|$f|$bytes|$sha"
          done

      - name: Focused static regression
        working-directory: product
        run: |
          node tests/unit/p02_v2581_detail_bugfix_r1.mjs
          node tests/unit/p02_v2581_detail_bugfix_r2.mjs
          node tests/unit/p02_v2581_detail_bugfix_r3.mjs
          php -l public/system-baseline.php
          php -l public/system-info.php
          php -l public/diagnose.php
