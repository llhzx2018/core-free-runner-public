name: P01 V2.47.277 Owner Notes Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247277-owner-notes-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.277 owner notes core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Clone exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 908e7441ebb5c00d9002764940fb9c1f8d6001e3
          git -C candidate checkout -q --detach 908e7441ebb5c00d9002764940fb9c1f8d6001e3
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Verify P01 identity and Owner notes
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.276" and
            .target_version=="2.47.277" and
            .from_versions==["2.47.276"] and
            .release_id==405832393 and
            .product_identity=="cae8f65c21ab9041ef1ad5c1a96482347c726f0e" and
            .asset_name=="VF_Start_V2.47.277_UPDATE.zip" and
            .asset_bytes==2355557 and
            .asset_sha256=="3c9b212fcdae3037b7eeac6a20cb0f39e1c8e2e5a27808ac3b24c31f597beb05" and
            (.notes|contains("后台框架与概览页")) and
            (.notes|contains("生产环境")) and
            (.notes|contains("内部操作代码"))
          ' projects/P01.json >/dev/null
          notes="$(jq -r '.notes' projects/P01.json)"
          for bad in "reorder_categories" "category_batch" "admin" "success" "Shell" "Production" "Owner" "Atomic" "Release" "Provider" "Server"; do
            if grep -Fq "$bad" <<<"$notes"; then echo "OWNER_NOTE_ENGLISH_LEAK:$bad"; exit 1; fi
          done
          echo P01_V247277_OWNER_NOTES_CHINESE_FIRST=PASS
      - name: Verify bounded delta
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
