          set -Eeuo pipefail
          test "$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)" = "$EXPECTED_MAIN"
          test "$(gh api repos/$PRODUCT_REPO/branches/develop --jq .commit.sha)" = "$EXPECTED_DEVELOP"
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/v2.36.5 --jq .object.sha)" = "$FORMAL"
          rel=$(gh api repos/$PRODUCT_REPO/releases/tags/v2.36.5)
          test "$(jq -r .id <<<"$rel")" = "$RELEASE_ID"
          test "$(jq -r .draft <<<"$rel")" = false
          test "$(jq -r .prerelease <<<"$rel")" = false
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_UPDATES_MAIN"
          printf 'FRESH_FENCE=PASS\n' | tee /tmp/fence.txt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Write closure authority only
