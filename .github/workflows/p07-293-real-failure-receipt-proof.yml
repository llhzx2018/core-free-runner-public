name: P07 #293 Authentic SQL Failure Receipt Recovery Contract Proof
on:
  pull_request:
    paths: ['.github/workflows/p07-293-real-failure-receipt-proof.yml']
permissions:
  contents: read
jobs:
  p07-exact-receipt-proof:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Temporary exact candidate private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 49d062d41e06758c0a5699a9ba3def184fac67e5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Verify actual producer-consumer receipt and no database reimport
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = 49d062d41e06758c0a5699a9ba3def184fac67e5
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest -q tests.test_migration_failed_laravel_recovery tests.test_migration_failed_prepare_audit
          python3 -B lib/server_migration_pull.py recover-failed-laravel-import --help | grep -F -- '--confirm'
          echo 'P07_REAL_FAILURE_RECEIPT_EXACT_SOURCE_SYNTHETIC_PASS'
      - name: Delete disposable private workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_PRIVATE_WORKSPACE_CLEANUP_DONE'
