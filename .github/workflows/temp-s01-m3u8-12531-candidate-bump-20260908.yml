name: temp-s01-m3u8-12531-candidate-bump-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-m3u8-12531-candidate-bump-20260908.yml]
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-routine-surfaces-visible-refinement-20260908
      EXPECTED_HEAD: 3ad5754dd8f9ea80eb72fab1961d629fe4cfe628
    steps:
      - name: Exact candidate version bump
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/m3u8-bump
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-bump
          cd /tmp/m3u8-bump
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '1.25.30'
          files=(
            VERSION
            src/admin/ui-v4/phase4-component-workspace.css
            src/vf-tool-m3u8.php
            tests/provider-dashboard-visible-ui-contract.php
            tests/unit/dashboard-human-language-contract.php
            tests/unit/host-recovery-human-language-contract.php
            tests/unit/package-physical-locator-contract.php
            tests/unit/recovery-runtime-human-language-followup-contract.php
            tests/unit/settings-human-language-followup-contract.php
            tests/unit/update-refresh-policy-contract.php
            tests/unit/visible-console-v2-contract.php
          )
          for f in "${files[@]}"; do
            grep -q '1\.25\.30' "$f"
            sed -i 's/1\.25\.30/1.25.31/g' "$f"
            ! grep -q '1\.25\.30' "$f"
          done
          test "$(tr -d '\r\n' < VERSION)" = '1.25.31'
          grep -F 'Version: 1.25.31' src/vf-tool-m3u8.php >/dev/null
          grep -F "VF_TOOL_M3U8_VERSION', '1.25.31" src/vf-tool-m3u8.php >/dev/null
          mapfile -t changed < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${files[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          php -l src/vf-tool-m3u8.php >/dev/null
          for f in tests/provider-dashboard-visible-ui-contract.php tests/unit/dashboard-human-language-contract.php tests/unit/host-recovery-human-language-contract.php tests/unit/package-physical-locator-contract.php tests/unit/recovery-runtime-human-language-followup-contract.php tests/unit/settings-human-language-followup-contract.php tests/unit/update-refresh-policy-contract.php tests/unit/visible-console-v2-contract.php; do php -l "$f" >/dev/null; done
          php tests/routine-surfaces-visible-ui-contract.php
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add -- "${files[@]}"
          git commit -m 'S01-C03: bump routine surfaces visible closure to 1.25.31'
          new_head="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git"
          git push -q origin "HEAD:refs/heads/${BRANCH}"
          test "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')" = "$new_head"
          echo "NEW_HEAD=$new_head"
          echo 'PASS_S01_C03_12531_CANDIDATE_BUMP'
