name: P07 Release13 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release13-readback-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d676411aaed707b3a78a26698e88d3bf7e86dac4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release13 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'd676411aaed707b3a78a26698e88d3bf7e86dac4'
          test "$(cat BUILD_ID)" = '0.1.0-release13'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release13' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = cc94582ff03766820e489eb03bfa4f12b343142c' docs/authority/CURRENT.md
          grep -Fq 'Release13 Distribution Gate           36707407078 PASS' docs/authority/CURRENT.md
          grep -Fq 'release13 Production install            NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md
          grep -Fq 'release12 Owner real backup path        REAL_FAIL / FRESH_VERIFY_NOT_PASS' docs/authority/CURRENT.md

          grep -Fq '| B45 | Package-owned MySQL Snapshot |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE13_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md
          ! grep -F 'B45 | Package-owned MySQL Snapshot' docs/authority/ACCEPTANCE_MATRIX.md | grep -Fq 'PUBLIC_DISTRIBUTION_PENDING'

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release13'
          assert slot3['source_main_commit']=='d7cdcd45370bc0a177b4b2dceec38e95a67a3824'
          assert slot3['mysql_export_snapshot_contract']=='PACKAGE_OWNED_IMMUTABLE_SNAPSHOT_V1'
          assert p['release']['slot3_build']=='0.1.0-release13'
          assert p['release']['public_distribution_commit']=='cc94582ff03766820e489eb03bfa4f12b343142c'
          assert p['release']['runtime_manifest_blob']=='2a3bb3dee14e6236138a86e271dac74df81f17eb'
          assert p['release']['overlay_manifest_blob']=='24d2dd09d04e6330a73ec28d928ef9e435a94984'
          assert p['release']['final_installer_blob']=='e62cbde514c77270fc75ed9c72d6752776092a36'
          assert p['release']['stable_installer_blob']=='1eebe7cd4e8146b38fc056be76501b398a29c078'
          assert p['release']['toolbox_blob']=='011ce3b7e1d7de6a94d036f49c137530a96f7b86'
          assert p['production']['slot3_build']=='0.1.0-release3'
          assert p['production']['release12_owner_real_use']=='REAL_FAIL_BACKUP_FRESH_VERIFY_NOT_PASS'
          assert p['production']['release13_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert p['production']['migration_executed'] is False
          assert p['production']['dns_write'] is False
          assert p['production']['source_delete'] is False
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE13_READBACK_SOURCE=d676411aaed707b3a78a26698e88d3bf7e86dac4'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
