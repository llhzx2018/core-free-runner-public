name: P02 V2.5.102 Formal Release Preflight

on:
  push:
    branches:
      - release/p02-v25102-preflight-20260924
    paths:
      - '.github/workflows/p02-v25102-formal-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REPO: llhzx2018/vf-library
      TARGET_SHA: 430d0e7d7a1f47e2d444f57ac615e6bdabb53823
      TARGET_TREE: 2401c0fef338ffb14e7e02524752674361459cdc
      TARGET_VERSION: 2.5.102
      TARGET_TAG: v2.5.102
      VF_RELEASE_FROM_VERSIONS: "2.5.81 2.5.82"
      VF_RELEASE_SOURCE_SHA: 430d0e7d7a1f47e2d444f57ac615e6bdabb53823
      VF_RELEASE_SOURCE_TREE: 2401c0fef338ffb14e7e02524752674361459cdc
      VF_RELEASE_SOURCE_REF: main
    steps:
      - name: Checkout exact product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 430d0e7d7a1f47e2d444f57ac615e6bdabb53823
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Checkout current governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: governance
      - name: Install release dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
      - name: Exact source and release authority
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git show -s --format=%T HEAD)" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          grep -F 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/authority/ACCEPTANCE_MATRIX.md
          grep -F 'DYNAMIC_TRUTH_NOT_STORED_HERE' docs/authority/CURRENT.md
          grep -F 'Historical / Release Regression Evidence' docs/authority/CURRENT.md
          test "$(git status --porcelain)" = ""
          bash scripts/verify-repository.sh
          python3 scripts/verify-source-manifest.py
          node tests/unit/p02_final_engineering_closure_release_tooling.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          echo P02_V25102_PRE_RELEASE_SOURCE_AUTHORITY=PASS
      - name: Authority drift marker scan
        run: |
          set -Eeuo pipefail
          python3 governance/governance/authority/tools/authority_drift_lint.py product             --rules governance/governance/authority/VF_AUTHORITY_DRIFT_LINT_RULES_V1.0.json             --json | tee "${RUNNER_TEMP}/p02-v25102-authority-drift.json"
          python3 - "${RUNNER_TEMP}/p02-v25102-authority-drift.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          print("AUTHORITY_DRIFT_RESULT="+x["result"])
          print("AUTHORITY_DRIFT_REVIEW_REQUIRED="+str(x["review_required"]))
          for f in x["findings"]:
              if f["severity"]=="REVIEW_REQUIRED":
                  print("REVIEW",f["file"],f["line"],f["rule"],f["text"])
          PY
          echo P02_V25102_AUTHORITY_DRIFT_SCAN=PASS
      - name: Formal artifact preflight
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V25102-RELEASE-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_V25102_FORMAL_ARTIFACT_PREFLIGHT=PASS
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v25102-formal-preflight-${{ github.run_id }}
          path: |
            product/build/release-preflight
            ${{ runner.temp }}/p02-v25102-authority-drift.json
          if-no-files-found: ignore
          retention-days: 14
