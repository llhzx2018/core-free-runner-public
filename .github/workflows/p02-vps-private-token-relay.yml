name: P02 VPS Existing Private Token Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-vps-private-token-relay.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      INFO_URL: https://lib.kewaro.com/VF_Library_V2.4.22_UPDATE_DISCOVERY_BRIDGE_ACTIVATOR_V2.php?relay=info
      TOKEN_URL: https://lib.kewaro.com/VF_Library_V2.4.22_UPDATE_DISCOVERY_BRIDGE_ACTIVATOR_V2.php?relay=token
    steps:
      - name: Require existing unified read token
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"

      - name: Wait for V2 activator on Production VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f /tmp/p02-relay-info.json
          for i in $(seq 1 120); do
            if curl -fsS --connect-timeout 5 --max-time 10 -H 'Accept: application/json' "$INFO_URL" -o /tmp/p02-relay-info.json; then
              status="$(php -r '$d=json_decode(file_get_contents("/tmp/p02-relay-info.json"),true); echo is_array($d)?($d["status"]??""):"";')"
              if [ "$status" = "success" ]; then
                echo 'P02_VPS_RELAY_ALREADY_COMPLETE'
                exit 0
              fi
              if [ "$status" = "ready" ]; then
                test "$(php -r '$d=json_decode(file_get_contents("/tmp/p02-relay-info.json"),true); echo $d["project_id"]??"";')" = 'P02'
                test "$(php -r '$d=json_decode(file_get_contents("/tmp/p02-relay-info.json"),true); echo $d["current_version"]??"";')" = '2.4.22'
                echo 'P02_VPS_RELAY_ENDPOINT_READY'
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'V2 activator was not uploaded within the relay window.' >&2
          exit 1

      - name: Seal existing token to VPS one-time public key
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
          $info=json_decode(file_get_contents("/tmp/p02-relay-info.json"),true);
          $token=(string)getenv("VF_PRIVATE_READ_TOKEN");
          $pk=base64_decode((string)($info["public_key_b64"]??""),true);
          $nonce=(string)($info["nonce"]??"");
          if(!is_array($info)||$token===""||!is_string($pk)||strlen($pk)!==SODIUM_CRYPTO_BOX_PUBLICKEYBYTES||$nonce==="")throw new RuntimeException("relay input invalid");
          $sealed=sodium_crypto_box_seal($token,$pk);
          file_put_contents("/tmp/p02-relay-payload.json",json_encode(["nonce"=>$nonce,"sealed_token_b64"=>base64_encode($sealed)],JSON_UNESCAPED_SLASHES));
          '

      - name: Deliver and activate Production discovery bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --connect-timeout 10 --max-time 60 -H 'Content-Type: application/json' --data-binary @/tmp/p02-relay-payload.json "$TOKEN_URL" -o /tmp/p02-relay-result.json
          php -r '$d=json_decode(file_get_contents("/tmp/p02-relay-result.json"),true); if(!is_array($d)||($d["ok"]??false)!==true||!in_array(($d["status"]??""),["success","already-success"],true))throw new RuntimeException("VPS relay activation failed"); echo "P02_VPS_DISCOVERY_BRIDGE_ACTIVATED\n";'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/p02-relay-info.json /tmp/p02-relay-payload.json /tmp/p02-relay-result.json
