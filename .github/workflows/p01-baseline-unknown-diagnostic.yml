name: P01 Baseline Unknown Diagnostic

on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-baseline-unknown-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: cd3dea5cfe9a21173297ade4312a226113bd808c
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Fresh install and print unresolved keys
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p01-unknown
          cp -a p01/src /tmp/p01-unknown
          cd /tmp/p01-unknown
          php -S 127.0.0.1:18094 -t . >/tmp/p01-unknown-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18094/setup.php -o /tmp/p01-unknown-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-unknown.cookies -b /tmp/p01-unknown.cookies http://127.0.0.1:18094/setup.php -o /tmp/p01-unknown-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          t=open('/tmp/p01-unknown-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-unknown.cookies -b /tmp/p01-unknown.cookies -X POST http://127.0.0.1:18094/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Diagnostic' --data-urlencode 'admin_password=P01BaselineGate!2026' --data-urlencode 'admin_password_confirm=P01BaselineGate!2026' -o /tmp/p01-unknown-post.html
          php -d upload_max_filesize=200M -d post_max_size=205M <<'PHP'
          <?php
          require 'app/bootstrap.php';
          $r=VfCommonBaseline::report(vf_db());
          foreach($r['rows'] as $row){if(($row['result']??'')==='UNKNOWN')echo 'UNKNOWN_KEY='.$row['domain'].'.'.$row['parameter'].' SOURCE='.$row['source']."\n";}
          echo 'COUNTS='.json_encode($r['counts'],JSON_UNESCAPED_SLASHES)."\n";
          PHP
