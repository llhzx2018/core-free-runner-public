name: R63 Focused Channel Provider Context Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r63-channel-provider-context.yml'

permissions:
  contents: read

jobs:
  r63-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: f655a12caa870bcd969f89584c0db24dc7480abc
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: f655a12caa870bcd969f89584c0db24dc7480abc
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_provider_context_facet_contract.php
          php tests/unit/channel_provider_context_facet_contract.php
          php tests/unit/channel_watch_search_context_contract.php
          php tests/unit/contextual_product_search_contract.php
          echo R63_CHANNEL_PROVIDER_CONTEXT_PASS
          echo R63_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
