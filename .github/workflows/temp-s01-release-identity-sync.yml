name: TEMP S01-C03 1.25.5 Release Identity Sync

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-release-identity-sync-20260902
  cancel-in-progress: true

jobs:
  sync-release-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: b4d65798e6961e23370d2dff09e1a9ba8fca84a6
      TARGET_BRANCH: release-prep/s01-1.25.5
      TARGET_VERSION: 1.25.5
      TARGET_ROUND: R229
      OUT: /tmp/s01-c03-release-identity-candidate
    steps:
      - name: Checkout exact release-prep branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: release-prep/s01-1.25.5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: m3u8

      - name: Assert exact base and synchronize only formal identity files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd m3u8
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          def replace_exact(path, pairs):
              p=Path(path); s=p.read_text()
              for old,new in pairs:
                  c=s.count(old); assert c==1, f'{path}: expected one {old!r}, got {c}'
                  s=s.replace(old,new,1)
              p.write_text(s)
          v=Path('VERSION'); assert v.read_text().strip()=='1.25.4'; v.write_text('1.25.5\n')
          replace_exact('src/PACKAGE_PROFILE.json', [
              ('  "pluginVersion": "1.25.4",','  "pluginVersion": "1.25.5",'),
              ('  "version": "1.25.4",','  "version": "1.25.5",'),
              ('  "round": "R228",','  "round": "R229",'),
          ])
          replace_exact('src/plugin-manifest.json', [
              ('  "version": "1.25.4",','  "version": "1.25.5",'),
              ('  "round": "R228",','  "round": "R229",'),
              ('  "pluginVersion": "1.25.4",','  "pluginVersion": "1.25.5",'),
          ])
          replace_exact('src/vf-tool-m3u8.php', [
              (' * Version: 1.25.4',' * Version: 1.25.5'),
              ("define('VF_TOOL_M3U8_VERSION', '1.25.4')","define('VF_TOOL_M3U8_VERSION', '1.25.5')"),
              ("define('VF_TOOL_M3U8_ROUND', 'R228')","define('VF_TOOL_M3U8_ROUND', 'R229')"),
              ("return 'R228_PROVIDER_SCHEMA_IDENTITY_RECOVERY';","return 'R229_PROVIDER_SCHEMA_DIAGNOSTIC_FIRST_RECOVERY';"),
          ])
          pp=json.load(open('src/PACKAGE_PROFILE.json')); pm=json.load(open('src/plugin-manifest.json'))
          assert (pp['pluginVersion'],pp['version'],pp['round'])==('1.25.5','1.25.5','R229')
          assert (pm['pluginVersion'],pm['version'],pm['round'])==('1.25.5','1.25.5','R229')
          assert pp['profile']=='R224 VF Tools M3U8 V7.1 Phase 2 security revalidated'
          assert pp['currentVerification']['version']=='1.25.0' and pp['currentVerification']['round']=='R222'
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(VERSION src/PACKAGE_PROFILE.json src/plugin-manifest.json src/vf-tool-m3u8.php)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(git diff --numstat | awk '{a+=$1; d+=$2} END{print a ":" d}')" = '11:11'
          git diff --check
          grep -Fq "return '1.3.0'" src/includes/v6-provider-schema.php
          ! git diff -- src/includes/v6-provider-schema.php | grep -q .

      - name: Export exact candidate files and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT/src"
          cp m3u8/VERSION "$OUT/VERSION"
          cp m3u8/src/PACKAGE_PROFILE.json "$OUT/src/PACKAGE_PROFILE.json"
          cp m3u8/src/plugin-manifest.json "$OUT/src/plugin-manifest.json"
          cp m3u8/src/vf-tool-m3u8.php "$OUT/src/vf-tool-m3u8.php"
          git -C m3u8 diff --binary > "$OUT/candidate.patch"
          sha256sum "$OUT/VERSION" "$OUT/src/PACKAGE_PROFILE.json" "$OUT/src/plugin-manifest.json" "$OUT/src/vf-tool-m3u8.php" > "$OUT/SHA256SUMS.txt"
          cat > "$OUT/IDENTITY.txt" <<EOF
          BASE_SHA=$BASE_SHA
          TARGET_BRANCH=$TARGET_BRANCH
          VERSION=$TARGET_VERSION
          ROUND=$TARGET_ROUND
          PROVIDER_SCHEMA=1.3.0
          CHANGED_FILES=4
          DIFF_NUMSTAT=11:11
          MAIN_WRITE=NO
          TAG_WRITE=NO
          RELEASE_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload exact release identity candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-1.25.5-r229-identity-${{ github.run_id }}
          path: /tmp/s01-c03-release-identity-candidate/
          if-no-files-found: error
          retention-days: 14
