name: P01 V2.39.2 Owner Production Closure Branch

on:
  push:
    branches:
      - gate/p01-v2392-production-closure-20260903
    paths:
      - '.github/workflows/p01-v2392-production-closure.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_P01_MAIN: bbb3d4754ae8b1d12c4bc1bc3c21bf75a56329bc
      TARGET_BRANCH: docs/p01-v2392-production-closure-20260903
    steps:
      - name: Require private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          echo 'PRIVATE_WRITE_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact P01 published checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_P01_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Verify live main and target branch absence
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_P01_MAIN"
          LIVE_MAIN="$(git ls-remote "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/main | awk '{print $1}')"
          test "$LIVE_MAIN" = "$EXPECTED_P01_MAIN"
          if git ls-remote --exit-code "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo 'TARGET_BRANCH_ALREADY_EXISTS' >&2
            exit 81
          fi
          echo 'P01_V2392_PRODUCTION_CLOSURE_BASE=PASS'

      - name: Build exact five-file production closure checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          import copy, json
          from pathlib import Path

          project = Path('VF_PROJECT.json')
          data = json.loads(project.read_text(encoding='utf-8'))
          assert data['production_version'] == '2.39.1'
          assert data['production_release']['version'] == '2.39.1'
          assert data['published_release']['version'] == '2.39.2'
          assert data['working_version'] == '2.39.2'
          assert data['target_release_version'] == '2.39.2'
          assert data['schema_version'] == '2026090201'

          frozen_model = json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True)
          pub = copy.deepcopy(data['published_release'])
          assert pub['release_source'] == '4f823f249c169af23a2a790b5d377d02d08a7309'
          assert pub['release_id'] == 381483161
          assert pub['migration'] is None

          owner = {
              'version': '2.39.2',
              'schema': '2026090201',
              'migration': None,
              'schema_evidence': 'No schema change; successful strict Atomic 2.39.1 -> 2.39.2 with Current/Latest/Footer/History consistency closes the target runtime/no-migration production contract.',
              'final_screenshot_sha256': 'fc0036d3c350cc9cfcaf2f3382979eeebcb2b326c970297cd81a8c64a09ca803',
              'screenshot_size': '1319x639',
              'screenshot_bytes': 76348,
              'current': '2.39.2',
              'latest': '2.39.2',
              'footer': '2.39.2',
              'state': '已是最新版本。',
              'history': '2.39.1 -> 2.39.2 / success',
              'last_check': '2026-09-03 02:39:01',
              'update_completed_at': '2026-09-03 02:39:18 (UI displayed)',
              'terminal_ui_visual_closure': 'PASS',
              'assistant_production_write': False,
          }

          pub.update({
              'release_state': 'PUBLISHED / OWNER INSTALLED OBSERVED / PRODUCTION CLOSURE PASS',
              'assistant_production_write': False,
              'production_closure': 'PASS / OWNER OBSERVED',
              'owner_production_runtime': '2.39.2',
              'owner_production_schema': '2026090201',
              'owner_schema_evidence': owner['schema_evidence'],
              'owner_version_readback': 'Current V2.39.2 / Latest V2.39.2 / Footer V2.39.2 / 已是最新版本。 / history 2.39.1 -> 2.39.2 success.',
              'owner_online_state': 'V2.39.2 CURRENT = LATEST / UP_TO_DATE',
              'owner_update_completed_at': owner['update_completed_at'],
          })

          data['status'] = 'V2.39.2 PRODUCTION CLOSURE PASS / REAL PRODUCT ACCEPTANCE PENDING'
          data['production_version'] = '2.39.2'
          data['current_phase'] = 'V2.39.2 PRODUCTION CLOSED / REAL FIVE-GROUP + MANAGED PROJECTS ACCEPTANCE'
          data['production_release'] = copy.deepcopy(pub)
          data['published_release'] = copy.deepcopy(pub)
          data['owner_production_activation_evidence'] = owner

          change = dict(data.get('current_change') or {})
          change.update({
              'release_completed': True,
              'owner_production_activation': True,
              'production_closure_complete': True,
              'production_write': False,
              'runner_main_write': False,
              'owner_production_runtime': '2.39.2',
              'owner_production_schema': '2026090201',
              'owner_update_completed_at': owner['update_completed_at'],
          })
          data['current_change'] = change
          data['authority']['current_production_evidence'] = 'docs/evidence/P01_V2.39.2_OWNER_PRODUCTION_CLOSURE_20260903.md'
          data['candidate_version'] = '2.39.2'
          data['candidate_schema_version'] = '2026090201'
          data['candidate_state'] = 'NONE / V2.39.2 PRODUCTION'
          data['formal_release_state'] = 'V2.39.2 PUBLISHED / OWNER PRODUCTION CLOSURE PASS'
          data['current_authority'] = 'Owner Production V2.39.2 OBSERVED / Published Latest V2.39.2 / Production Closure PASS'
          data['next_action'] = 'Run real five-group round-trip + Managed Projects CRUD + explicit Kewaro P01-P06 conversion/idempotency on Owner Production. No release work pending; no site/repository retirement is authorized.'

          assert data['production_release']['version'] == '2.39.2'
          assert data['published_release']['version'] == '2.39.2'
          assert data['production_version'] == '2.39.2'
          assert data['schema_version'] == '2026090201'
          assert data['production_release']['migration'] is None
          assert json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True) == frozen_model
          project.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          current = Path('docs/authority/CURRENT.md')
          current_block = '\n'.join([
              '<!-- P01_V2392_PRODUCTION_CLOSURE_CURRENT -->',
              '## V2.39.2 Production Closure · PASS · Real Product Acceptance Pending · 2026-09-03',
              '',
              '- Owner Production：`V2.39.2`；Published Latest：`V2.39.2`。',
              '- Owner 最终更新页截图：`1319x639` / `76348 bytes` / `sha256:fc0036d3c350cc9cfcaf2f3382979eeebcb2b326c970297cd81a8c64a09ca803`。',
              '- UI 回读：Current `V2.39.2`；Latest `V2.39.2`；Footer `V2.39.2`；状态 `已是最新版本。`。',
              '- Last Check：`2026-09-03 02:39:01`；Update History：`2.39.1 -> 2.39.2 / success`；完成时间显示 `2026-09-03 02:39:18`。',
              '- Online Atomic：严格单跳 `V2.39.1 → V2.39.2`；Schema `2026090201 → 2026090201`；Migration `NONE`。',
              '- Assistant Production Write：`NO`；版本发布/在线升级 Production Closure = `PASS`。',
              '- 注意：本条只关闭版本/在线升级链；真实五组往返、Managed Projects CRUD、Kewaro 显式转换/二次幂等仍为独立 Production Product Acceptance Gate，当前不得提前宣告 PASS。',
              '- Kewaro 站点/仓库退役或删除仍未授权。',
              '',
              '**Current Truth：V2.39.2 已成为 Published + Owner Production Truth；下一步直接进入真实五组 + Managed Projects Production Acceptance，不再执行 Release 工作。**',
              '',
          ])
          current.write_text(current_block + current.read_text(encoding='utf-8'), encoding='utf-8')

          handoff = Path('docs/handoff/CURRENT_STATE.md')
          handoff_block = '\n'.join([
              '> **Current Production Truth · 2026-09-03**',
              '> Owner 已真实完成 `V2.39.1 → V2.39.2`：Current/Latest/Footer 均为 V2.39.2，状态“已是最新版本”，Update History=`2.39.1 -> 2.39.2 / success`。Schema 保持 `2026090201`，无 Migration。V2.39.2 版本/在线升级 Production Closure = PASS；Assistant Production Write = NO。下一步不是继续 Release，而是执行真实五组往返、Managed Projects CRUD 与 Kewaro 显式转换/二次幂等 Production Acceptance；任何站点/仓库退役仍未授权。',
              '',
          ])
          handoff.write_text(handoff_block + handoff.read_text(encoding='utf-8'), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_block = '\n'.join([
              '## V2.39.2 · Owner Production Closure PASS · Product Acceptance Pending',
              '',
              '- Owner 已真实完成 `V2.39.1 → V2.39.2` 在线 Atomic 升级。',
              '- Current / Latest / Footer 均回读 `V2.39.2`，状态“已是最新版本”；History=`2.39.1 -> 2.39.2 / success`。',
              '- Schema `2026090201 → 2026090201`；Migration `NONE`；Assistant Production Write = NO。',
              '- 版本/在线升级 Production Closure = PASS；真实五组往返、Managed Projects CRUD、Kewaro 显式转换/二次幂等继续作为独立 Production Product Acceptance。',
              '- 任何 Kewaro 站点/仓库退役或删除仍未授权。',
              '',
          ])
          changelog.write_text(changelog_block + changelog.read_text(encoding='utf-8'), encoding='utf-8')

          evidence = Path('docs/evidence/P01_V2.39.2_OWNER_PRODUCTION_CLOSURE_20260903.md')
          evidence.write_text('\n'.join([
              '# P01 · VF Start V2.39.2 · Owner Production Closure',
              '',
              '- Status: `PRODUCTION CLOSURE PASS / REAL PRODUCT ACCEPTANCE PENDING`',
              '- Owner Production: `V2.39.2`',
              '- Published Latest: `V2.39.2`',
              '- Formal Source: `4f823f249c169af23a2a790b5d377d02d08a7309`',
              '- Release: `v2.39.2` / ID `381483161`',
              '- Online hop: `V2.39.1 -> V2.39.2` ONLY',
              '- Schema: `2026090201 -> 2026090201`',
              '- Migration: `NONE`',
              '- Current: `V2.39.2`',
              '- Latest: `V2.39.2`',
              '- Footer: `V2.39.2`',
              '- UI state: `已是最新版本。`',
              '- Last Check: `2026-09-03 02:39:01`',
              '- Update History: `2.39.1 -> 2.39.2 / success`',
              '- Update completed (UI): `2026-09-03 02:39:18`',
              '- Screenshot: `1319x639` / `76348 bytes`',
              '- Screenshot SHA-256: `fc0036d3c350cc9cfcaf2f3382979eeebcb2b326c970297cd81a8c64a09ca803`',
              '- Assistant Production Write: `NO`',
              '',
              '## Boundary',
              '',
              'This evidence closes the V2.39.2 version / online-update Production chain only.',
              'Real five-group round-trip, dormant-state restoration on real data, cover/Hosted Topic HTML durability, Managed Projects CRUD, URL-less retired Project behavior, explicit Kewaro P01-P06 conversion and second-run idempotency remain separate Owner-observed Production Product Acceptance gates.',
              'No Kewaro site/repository retirement or destructive action is authorized by this closure.',
              '',
              '## Verdict',
              '',
              '`P01_V2392_OWNER_PRODUCTION_CLOSURE=PASS`',
              '`P01_V2392_REAL_PRODUCT_ACCEPTANCE=PENDING`',
              '`ASSISTANT_PRODUCTION_WRITE=NO`',
              '',
          ]) + '\n', encoding='utf-8')
          PY

          printf '%s\n' \
            'CHANGELOG.md' \
            'VF_PROJECT.json' \
            'docs/authority/CURRENT.md' \
            'docs/evidence/P01_V2.39.2_OWNER_PRODUCTION_CLOSURE_20260903.md' \
            'docs/handoff/CURRENT_STATE.md' >/tmp/expected-files.txt
          git diff --name-only "$EXPECTED_P01_MAIN" | sort >/tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(cat src/VERSION.txt)" = '2.39.2'
          git diff --quiet "$EXPECTED_P01_MAIN" -- src app assets || true
          echo 'P01_V2392_PRODUCTION_CLOSURE_DOCS=PASS'

      - name: Commit and push private docs branch only
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git checkout -b "$TARGET_BRANCH"
          git add CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.39.2_OWNER_PRODUCTION_CLOSURE_20260903.md docs/handoff/CURRENT_STATE.md
          git diff --cached --name-only | sort >/tmp/cached-files.txt
          diff -u /tmp/expected-files.txt /tmp/cached-files.txt
          git commit -m 'docs(P01): close V2.39.2 owner production'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_P01_MAIN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "P01_V2392_PRODUCTION_CLOSURE_HEAD=$(git rev-parse HEAD)"
          echo 'RUNNER_MAIN_WRITE=NO'
          echo 'ASSISTANT_PRODUCTION_WRITE=NO'

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf p01
          echo 'PRIVATE_SOURCE_CLEANUP=PASS'
