name: TEMP P04 Baseline Contract Drift Gate

on:
  push:
    branches:
      - verify/p04-baseline-contract-drift-20260829

permissions:
  contents: read

jobs:
  p04-baseline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECTED_SOURCE: 6314b6358dc6f06aea29821a488743e5573f954a
    steps:
      - name: Verify private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact P04 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-infra
          ref: 6314b6358dc6f06aea29821a488743e5573f954a
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prove exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE"
          echo "P04_EXACT_SOURCE=$actual"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 Node24
        with:
          python-version: '3.12'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 Node24
        with:
          node-version: '24'

      - name: Repository health and migration gates
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py
          echo 'P04_REPOSITORY_HEALTH_MIGRATION=PASS'

      - name: PHP and Python syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          python -m py_compile scripts/build-release-tree.py scripts/build-v256-update-release.py scripts/build-v256-formal-artifacts.py scripts/build-v287-update-release.py scripts/validate-v256-formal-artifacts.py scripts/validate-online-atomic-package.py
          echo 'P04_SYNTAX=PASS'

      - name: Current PHP contracts
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/core_updates_contract_v252.php
          php tests/integration/provider_billing_contract_v250.php src
          php tests/integration/provider_billing_pagination_v256.php src
          php tests/integration/provider_balance_domain_attention_contract.php
          php tests/integration/domain_quick_group_contract_v288.php src
          php tests/integration/domain_attention_group_management_contract_v289.php src
          php tests/integration/project_membership_contract_v257.php src
          php tests/unit/provider_currency_contract_v256.php src
          php tests/unit/provider_billing_persistence_contract_v256.php .
          php tests/unit/job_partial_health_contract_v256.php .
          php tests/unit/ui_contract_v280.php .
          php tests/unit/maintenance_ui_contract_v288.php .
          php tests/unit/domain_attention_group_management_ui_v289.php .
          echo 'P04_CURRENT_PHP_CONTRACTS=PASS'

      - name: Current JavaScript syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in \
            public/assets/app.js \
            public/assets/v254-ui.js \
            public/assets/v256-ui.js \
            public/assets/v257-view.js \
            public/assets/v257-mobile.js \
            public/assets/v257-nav.js \
            public/assets/v257-cn.js \
            public/assets/v270-final-polish.js \
            public/assets/v271-unified-shell.js \
            public/assets/v272-backend-detail-ux.js \
            public/assets/v272-copy-polish.js \
            public/assets/v274-performance-bridge.js \
            public/assets/v275-ua-workflow.js \
            public/assets/v280-navigation-simplify.js \
            public/assets/v2811-human-baseline.js \
            tests/e2e/v256-responsive.mjs \
            tests/e2e/v256-upgrade.mjs \
            tests/e2e/v257-personal-first.mjs \
            tests/e2e/v271-shell-unification.mjs \
            tests/e2e/v272-backend-detail-ux-v2.mjs \
            tests/e2e/v273-typography-rhythm.mjs \
            tests/e2e/v274-runtime-consolidation-v2.mjs \
            tests/e2e/v275-ua-workflow.mjs \
            tests/e2e/provider_balance_domain_attention.mjs \
            tests/e2e/v288-p04-maintenance.mjs \
            tests/e2e/v289-domain-attention-group-management.mjs; do
            node --check "$f"
          done
          echo 'P04_JS_SYNTAX=PASS'

      - name: Current shell gate syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n \
            scripts/run-v256-browser-gate.sh \
            scripts/run-v256-upgrade-gate.sh \
            scripts/run-v257-browser-gate.sh \
            scripts/run-v271-shell-unification-gate.sh \
            scripts/run-v272-backend-detail-ux-gate.sh \
            scripts/run-v273-typography-rhythm-gate.sh \
            scripts/run-v274-runtime-consolidation-gate.sh \
            scripts/run-v275-ua-workflow-gate.sh \
            scripts/run-v288-p04-maintenance-gate.sh \
            scripts/run-v289-domain-attention-group-management-gate.sh
          echo 'P04_SHELL_SYNTAX=PASS'

      - name: Build public-safe PASS receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/P04_BASELINE_CONTRACT_DRIFT.txt <<EOF
          P04_EXACT_SOURCE=$EXPECTED_SOURCE
          P04_BASELINE_CONTRACT_DRIFT_MACHINE=PASS
          PRODUCT_CODE_CHANGED=NO
          TEST_FILES_CHANGED=3
          PRIVATE_SOURCE_PERSISTED=NO
          MAIN_WRITE=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: p04-baseline-contract-drift-${{ env.EXPECTED_SOURCE }}
          path: evidence/P04_BASELINE_CONTRACT_DRIFT.txt
          if-no-files-found: error
          retention-days: 14
