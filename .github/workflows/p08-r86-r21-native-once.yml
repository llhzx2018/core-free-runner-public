name: P08 R86 genuine R21 Owner 0.1.0 to official 0.1.1 Atomic MySQL MariaDB
on:
  push:
    branches: [test/p08-r86-r21-mysql-mariadb-20261113]
permissions:
  contents: read
jobs:
  r21-native-engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - driver: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_full_restore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
      P08_R71_REAL_ZIP_TEST: YES
    steps:
      - name: Private exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: d26a19bbb0d652857560937f39d4da0e08be54c8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact source and PHP one-time fixer syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = d26a19bbb0d652857560937f39d4da0e08be54c8
          test "$(cat VERSION)" = 0.1.1
          git merge-base --is-ancestor 917a28636e23c89a64b0f889ed103787fd6234b8 HEAD
          git merge-base --is-ancestor dd1ad4d881ae232ec5e817d05402ce1753b640e7 HEAD
          git merge-base --is-ancestor 9c7f76434fe2d064f2f1ac15c58a760f778cf055 HEAD
          php -l scripts/p08-r21-official-atomic-once.php
          php -l tests/compatibility/p08_r71_real_flat_bridge_atomic.php
          grep -Fq '562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd' scripts/p08-r21-official-atomic-once.php
          grep -Fq '329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c' scripts/p08-r21-official-atomic-once.php
          echo P08_R86_ORIGINAL_R21_AND_OFFICIAL_RELEASE_EXACT_PINS=PASS
      - name: Build genuine official Bridge FULL target FULL and Atomic from unmodified tags
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha 9c7f76434fe2d064f2f1ac15c58a760f778cf055 --output-dir "$RUNNER_TEMP/p08-r71-real-artifacts"
          python3 scripts/verify_owner_atomic_pair.py "$RUNNER_TEMP/p08-r71-real-artifacts" dd1ad4d881ae232ec5e817d05402ce1753b640e7 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(sha256sum "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" | cut -d' ' -f1)" = 329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c
          echo P08_R86_FINAL_OFFICIAL_ATOMIC_BYTES_IDENTICAL_TO_PUBLISHED_RELEASE=PASS
      - name: Rebuild historical R21 actual source and capture its independent FULL manifest SHA
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/p08-r71-flat-src"
          git archive --format=tar 917a28636e23c89a64b0f889ed103787fd6234b8 | tar -xf - -C "$RUNNER_TEMP/p08-r71-flat-src"
          test "$(cat "$RUNNER_TEMP/p08-r71-flat-src/VERSION")" = 0.1.0
          cd "$RUNNER_TEMP/p08-r71-flat-src"
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r71-old-flat-full.zip" --version 0.1.0 --source-sha 917a28636e23c89a64b0f889ed103787fd6234b8
          unzip -p "$RUNNER_TEMP/p08-r71-old-flat-full.zip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r21-built-manifest.json"
          sha256sum "$RUNNER_TEMP/p08-r21-built-manifest.json" | cut -d' ' -f1 > "$RUNNER_TEMP/p08-r21-built-manifest.sha"
          test "$(cat "$RUNNER_TEMP/p08-r21-built-manifest.sha")" != 562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd
          test "$(wc -c < "$RUNNER_TEMP/p08-r21-built-manifest.sha")" -eq 65
          echo P08_R86_HISTORICAL_R21_BUILD_SHA_DIFFERS_FROM_OWNER_MANIFEST=CONFIRMED
      - name: Unpack synthetic R21 old FULL and official Bridge and native DB fixtures
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/p08-r71-site-success" "$RUNNER_TEMP/p08-r71-site-fault" "$RUNNER_TEMP/p08-r71-bridge"
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-success"
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-fault"
          unzip -q "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" -d "$RUNNER_TEMP/p08-r71-bridge"
          if [ "$P08_TEST_DB_DRIVER" = mariadb ]; then
             sudo apt-get update -qq
             sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client > /dev/null
          fi
          php tests/fixtures/create_ci_databases.php
          echo P08_R86_REAL_SQL_HISTORICAL_INSTALL_FIXTURE=PASS
      - name: Old R21 genuinely installs, user data is created and offline Bridge is activated
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php             "$RUNNER_TEMP/p08-r71-site-success"             "$RUNNER_TEMP/p08-r71-bridge"             "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip"             917a28636e23c89a64b0f889ed103787fd6234b8             dd1ad4d881ae232ec5e817d05402ce1753b640e7             9c7f76434fe2d064f2f1ac15c58a760f778cf055 success > "$RUNNER_TEMP/p08-r86-success.txt"
          grep -Fxq 'P08_R71_ACTUAL_FLAT_TO_COMPATIBLE_BRIDGE_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p08-r86-success.txt"
          echo P08_R86_REAL_R21_TO_OFFICIAL_BRIDGE_NATIVE_DATA=PASS
      - name: Explicit fail-closed on original Owner exact digest mismatch
        shell: bash
        run: |
          set -Eeuo pipefail
          if php source/scripts/p08-r21-official-atomic-once.php --inspect "$RUNNER_TEMP/p08-r71-site-success" > "$RUNNER_TEMP/p08-r86-negative.log" 2>&1; then
            echo P08_R86_FALSE_OWNER_MATCH; exit 8
          fi
          grep -Fq 'P08_R86_R21_FULL_MANIFEST_NOT_OWNER_VERIFIED' "$RUNNER_TEMP/p08-r86-negative.log"
          echo P08_R86_PRODUCTION_HASH_WILL_NOT_ACCEPT_SYNTHETIC_BUILD=PASS
      - name: Isolated only adapted manifest pin tests exact offline official Atomic source path
        shell: bash
        run: |
          set -Eeuo pipefail
          # Test-only temporary copy substitutes the unique synthetic R21
          # FULL hash. The real shipped script remains strictly pinned to
          # Owner 562a...; no fixture byte or adjusted code goes to Release.
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path('source/scripts/p08-r21-official-atomic-once.php').read_text()
          a='562a664a27d1b632cc28e2225a9712c8ac670533a1e88f2e9dc41f14097f2acd'
          b=Path(os.environ['RUNNER_TEMP']+'/p08-r21-built-manifest.sha').read_text().strip()
          assert src.count(a)==1 and len(b)==64 and b!=a
          (Path(os.environ['RUNNER_TEMP'])/'p08-r86-isolated-only.php').write_text(src.replace(a,b))
          PY
          php "$RUNNER_TEMP/p08-r86-isolated-only.php" --inspect "$RUNNER_TEMP/p08-r71-site-success" | tee "$RUNNER_TEMP/p08-r86-inspect.txt"
          grep -Fxq 'P08_R86_STATE=R21_BRIDGE_SAFE_TO_PREPARE_OFFICIAL_UPDATE' "$RUNNER_TEMP/p08-r86-inspect.txt"
          php "$RUNNER_TEMP/p08-r86-isolated-only.php" --apply-from-bridge "$RUNNER_TEMP/p08-r71-site-success" "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" | tee "$RUNNER_TEMP/p08-r86-update.txt"
          grep -Fxq 'P08_R86_R21_OFFICIAL_SHA256_ATOMIC_SUCCEEDED=YES' "$RUNNER_TEMP/p08-r86-update.txt"
          test "$(readlink "$RUNNER_TEMP/p08-r71-site-success/current")" = releases/9c7f76434fe2d064f2f1ac15c58a760f778cf055
          echo P08_R86_REAL_SQL_TWO_STAGE_OFFICIAL_ATOMIC_FROM_R21=PASS
      - name: Actual HTTP health and setup lock plus data row/private landings preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:18871 -t "$RUNNER_TEMP/p08-r71-site-success/public" "$RUNNER_TEMP/p08-r71-site-success/public/index.php" > "$RUNNER_TEMP/p08-r86-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 2
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18871/up)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18871/setup.php)" = 503
          test -d "$RUNNER_TEMP/p08-r71-site-success/storage/app/private/adops/landings"
          echo P08_R86_REAL_NATIVE_SQL_OWNER_HTTP_AND_DATA=PASS
      - name: Fault injection on independent R21 origin keeps old private data and code
        shell: bash
        run: |
          set -Eeuo pipefail
          P08_TEST_DB_CLEAN="$P08_TEST_DB_FULL_RESTORE" php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php             "$RUNNER_TEMP/p08-r71-site-fault" "$RUNNER_TEMP/p08-r71-bridge"             "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip"             917a28636e23c89a64b0f889ed103787fd6234b8             dd1ad4d881ae232ec5e817d05402ce1753b640e7             9c7f76434fe2d064f2f1ac15c58a760f778cf055 fault-after-swap > "$RUNNER_TEMP/p08-r86-fault.txt"
          P08_TEST_DB_CLEAN="$P08_TEST_DB_FULL_RESTORE" php source/tests/compatibility/p08_r71_real_atomic_post_bridge.php             "$RUNNER_TEMP/p08-r71-site-fault" "$RUNNER_TEMP/p08-r71-bridge"             "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip"             dd1ad4d881ae232ec5e817d05402ce1753b640e7             9c7f76434fe2d064f2f1ac15c58a760f778cf055 fault-after-swap >> "$RUNNER_TEMP/p08-r86-fault.txt"
          grep -Fxq 'P08_R71_REAL_TARGET_POINTER_FAULT_AND_AUTOMATIC_CODE_ROLLBACK=PASS' "$RUNNER_TEMP/p08-r86-fault.txt"
          echo P08_R86_NATIVE_R21_FAILURE_ROLLBACK_AND_PRIVATE_PAYLOAD=PASS
      - name: No private source or synthetic credentials persist on public Runner
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf source "$RUNNER_TEMP"/p08-r71-* "$RUNNER_TEMP"/p08-r86-* "$RUNNER_TEMP"/p08-r21-*
          echo P08_R86_PRIVATE_SOURCE_BINARY_DB_TEST_MATERIAL_CLEANUP=PASS
