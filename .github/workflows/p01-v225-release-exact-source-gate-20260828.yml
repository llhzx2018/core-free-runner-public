name: P01 V2.25.0 Release Exact Source Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-release-exact-source-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHA: 92c68ceae9af9e802017043478d37c5512cb3941
      TREE: 5db9ee2c6a7e58d44e40772cd5658fe4b85a87c1
      DEVELOP: 19fc03dca150150e2bdedb34a49e145d8d9d03a0
      VERSION: 2.25.0
      SCHEMA: '2026082801'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Release identity fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$DEVELOP"
          test "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/release/p01-v2.25.0-20260828|awk '{print $1}')" = "$SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$VERSION"
          grep -F "define('VF_VERSION', '2.25.0');" src/app/bootstrap.php >/dev/null
          grep -F '## V2.25.0 · Formal Release · 2026-08-28' CHANGELOG.md >/dev/null
          mapfile -t ids < <(git diff --name-only "$DEVELOP..$SHA")
          test "${#ids[@]}" -eq 4
          for f in "${ids[@]}"; do case "$f" in VERSION|src/VERSION.txt|src/app/bootstrap.php|CHANGELOG.md) ;; *) echo "unexpected release identity file: $f" >&2; exit 1;; esac; done
          echo P01_V225_RELEASE_IDENTITY=PASS
      - name: Fresh runtime and final VF teal contract
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/system_baseline_human_ui_contract.php | grep -Fx 'SYSTEM_BASELINE_HUMAN_UI_CONTRACT=PASS'
          rm -rf /tmp/p01-v225-release /tmp/p01-v225.cookies
          cp -a src /tmp/p01-v225-release; cd /tmp/p01-v225-release
          php -S 127.0.0.1:18255 -t . >/tmp/p01-v225.log 2>&1 & echo $! >/tmp/p01-v225.pid
          trap 'kill "$(cat /tmp/p01-v225.pid)" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sS http://127.0.0.1:18255/setup.php -o /tmp/setup.html && break || sleep 1; done
          curl -fsS -c /tmp/p01-v225.cookies -b /tmp/p01-v225.cookies http://127.0.0.1:18255/setup.php -o /tmp/setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v225.cookies -b /tmp/p01-v225.cookies -X POST http://127.0.0.1:18255/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V225 Release' --data-urlencode 'admin_password=P01V225!Release' --data-urlencode 'admin_password_confirm=P01V225!Release' >/tmp/setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/verify.txt; grep -Fx 'VERIFY_PASS=YES' /tmp/verify.txt
          php cli/surface-verify.php | tee /tmp/surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/surface.txt; grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/surface.txt
          php cli/baseline-verify.php | tee /tmp/base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          curl -fsS -c /tmp/p01-v225.cookies -b /tmp/p01-v225.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18255/api.php?action=login' --data '{"password":"P01V225!Release"}' | jq -e '.ok==true' >/dev/null
          for route in surfaces.php start.php channels.php watch.php surface-manager.php; do
            curl -fsS -c /tmp/p01-v225.cookies -b /tmp/p01-v225.cookies "http://127.0.0.1:18255/$route" -o "/tmp/${route%.php}.html"
            grep -F 'vf-app-sidebar' "/tmp/${route%.php}.html" >/dev/null
            grep -F 'surface-vf-theme.css' "/tmp/${route%.php}.html" >/dev/null
          done
          grep -F '个人互联网首页' /tmp/surfaces.html >/dev/null
          grep -F '网站导航' /tmp/start.html >/dev/null
          grep -F '频道记忆' /tmp/channels.html >/dev/null
          grep -F '私人片单' /tmp/watch.html >/dev/null
          grep -F '资源收件箱' /tmp/surface-manager.html >/dev/null
          curl -fsS -c /tmp/p01-v225.cookies -b /tmp/p01-v225.cookies http://127.0.0.1:18255/system-baseline.php -o /tmp/system-baseline.html
          grep -F '你怎么用这页' /tmp/system-baseline.html >/dev/null
          grep -F '技术详情（给开发 / 排障使用）' /tmp/system-baseline.html >/dev/null
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V225_RELEASE_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V225_RELEASE_SOURCE=$SHA
          echo P01_V225_RELEASE_TREE=$TREE
          echo P01_V225_RELEASE_MACHINE=PASS
          echo SCHEMA=$SCHEMA
          echo PRODUCTION=NO
