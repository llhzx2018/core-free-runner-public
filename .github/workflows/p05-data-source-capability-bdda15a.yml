name: P05 Data Source Capability Truth Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-data-source-capability-bdda15a.yml']
permissions:
  contents: read
jobs:
  p05-data-source-capability-exact-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-data-source-capability-bdda15a-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: bdda15a3b6c13c43f98d42de906d7c6007c2a2ea
      P05_BASE_MAIN: 05a41528ebd388033817ab75fda6caad44189ea9
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and six-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE"
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' \
            php/src/ProductOptimizationService.php \
            php/src/RuntimeOpsRoutesTrait.php \
            src/client/ProductSiteViews.tsx \
            src/server/common-system-v2.ts \
            src/server/product-optimization.ts \
            tests/unit/product-data-source-capability-truth.test.ts | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'P05_DATA_SOURCE_CAPABILITY_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_DATA_SOURCE_CAPABILITY_ENGINEERING=PASS'
      - name: Data Source capability truth and cumulative Product contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test tests/unit/product-data-source-capability-truth.test.ts
          node --import tsx --test \
            tests/unit/product-changes-record-observe-truth.test.ts \
            tests/unit/product-change-analysis.test.ts \
            tests/unit/product-global-search-object-locator-truth.test.ts \
            tests/unit/product-global-search-truth.test.ts \
            tests/unit/global-search-completeness-window.test.ts \
            tests/unit/product-refresh-error-truth.test.ts \
            tests/unit/product-audit-capability-rerun-truth.test.ts \
            tests/unit/product-audit-page-evidence-drilldown-truth.test.ts \
            tests/unit/product-audit-page-preview-completeness.test.ts \
            tests/unit/product-page-opportunity-evidence-truth.test.ts \
            tests/unit/product-opportunity-evidence-truth.test.ts \
            tests/unit/product-keyword-page-drilldown-truth.test.ts \
            tests/unit/product-opportunity-query-drilldown-truth.test.ts \
            tests/unit/product-settings-truth.test.ts \
            tests/unit/product-site-load-race-truth.test.ts \
            tests/unit/product-site-identity-boundary-truth.test.ts \
            tests/unit/product-aeo-window-truth.test.ts \
            tests/unit/product-opportunity-window-truth.test.ts \
            tests/unit/product-search-movement-label-truth.test.ts \
            tests/unit/product-page-workspace-completeness.test.ts \
            tests/unit/product-object-detail-state-truth.test.ts \
            tests/unit/product-object-selection-race-truth.test.ts \
            tests/unit/product-portfolio-truth.test.ts \
            tests/unit/product-portfolio-query-boundary.test.ts
          npm run test:php-product-parity
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_DATA_SOURCE_CAPABILITY_TRUTH=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          echo 'P05_DATA_SOURCE_CAPABILITY_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_DATA_SOURCE_CAPABILITY_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_DATA_SOURCE_CAPABILITY_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
