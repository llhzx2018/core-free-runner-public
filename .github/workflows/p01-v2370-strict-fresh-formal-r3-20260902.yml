name: P01 V2.37.0 Strict Fresh Formal R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2370-strict-fresh-formal-r3-20260902.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PORT: '18617'
      ADMIN_PASS: P01V2370StrictFreshR2
      EVID: /tmp/p01-v2370-strict-r2-evidence
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 95fa7dbcc6c9eb5869412a88bdc58382870abebe
          path: gridhelper
      - name: Frozen artifact strict fresh gate R3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash runner/scripts/p01_v2370_strict_fresh.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-strict-fresh-r3-${{ github.run_id }}
          path: /tmp/p01-v2370-strict-r2-evidence
          if-no-files-found: error
          retention-days: 90
