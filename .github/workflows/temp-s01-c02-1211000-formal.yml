name: S01-C02 V1.21.1000 Formal Release

on:
  push:
    branches:
      - release/s01-c02-1211000-formal
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: c8c788f6ebf88d666ff5a3de41ce600f902e87ee
      PROMOTED_MAIN_SHA: 9cff905814ae593d866a0f38827d59d9e5f1996f
      TARGET_VERSION: 1.21.1000
      RELEASE_TAG: v1.21.1000
      ASSET_NAME: vf-tools-ops_V1.21.1000.zip
      TESTED_RUN_ID: '36983311499'
      TESTED_ARTIFACT: s01-c02-v1.21.1000-diagnostic
      EXPECTED_BYTES: '3475336'
      EXPECTED_SHA256: e423464cae16a1bd77e1cb912f1f845e11518b45d8a5bf61caf92acb19f5c61f
      EXPECTED_RUNTIME_FILES: '975'
      EXPECTED_RUNTIME_FP: 1508c76e48ee2ea2dae8370030f0d7391fe20555153874ff454e7119b8a68300
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify promotion and tested artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          test -f "tested/$ASSET_NAME"
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          jq -e '.pass==true and .false_positive_fixed==true and .true_positive_fail_closed_preserved==true and .frozen_shell_header_menu_changed==false' tested/diagnostic.json >/dev/null
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo EXACT_DIAGNOSTIC_CANDIDATE=PASS

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1000

          Technical & Indexing · Global Gate Notice Boundary:
          - 修复「技术与索引」仍出现重复红色 SEO Gate 全局提示的真实根因
          - 仅在 seo_technical 页面抑制重复 GATE_BLOCKED admin notice
          - 关键词权威页面真实 GATE_BLOCKED 红色 fail-closed 提示继续保留
          - Shell / Header / Header Menu 不变
          - no schema/auth/permission/write/updater/ownership changes
          - OWNER_DIRECT_DIAGNOSTIC_RELEASE exact proof PASS
          - Candidate Run: 36983311499
          - OWNER Preview: POST_RELEASE_REQUIRED
          - OWNER Real Use: POST_PRODUCTION_REQUIRED
          EOF
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1000" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo PUBLISHED_AT=$PUB
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
