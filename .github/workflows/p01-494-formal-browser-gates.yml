name: p01-494-formal-browser-gates
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-494-formal-browser-gates.yml']
permissions:
  contents: read
jobs:
  isolated-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      SOURCE_REPO: llhzx2018/vf-start
      SOURCE_BRANCH: fix/p01-v247493-owner-dialog-save-ux
      TARGET_SHA: c4a8c6cfd8cc831f4771a382c231dfedebf8fc56
      P01_TEST_ORIGIN: http://127.0.0.1:18671
      P01_TEST_PASSWORD: P01Synthetic-18671!
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-advanced-20261105-gate
      VF_IA6_DISPOSABLE_ACK: IA6-ADVANCED-ONLY
    steps:
      - name: Checkout public-safe temporary workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P01 source and real synthetic Chromium interaction
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd jq >/dev/null
          ROOT="$(mktemp -d /tmp/p01-ia6-chromium.XXXXXXXX)"
          trap 'test -z "${SERVER_PID:-}" || kill "$SERVER_PID" >/dev/null 2>&1 || true; rm -rf "$ROOT" "$VF_E2E_RUNTIME_ROOT"' EXIT
          git clone -q --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${SOURCE_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${SOURCE_REPO}.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          unset READ_TOKEN
          echo "P01_EXACT_BROWSER_SOURCE=$TARGET_SHA"
          cp -a "$ROOT/candidate/src" "$VF_E2E_RUNTIME_ROOT"
          php -S 127.0.0.1:18671 -t "$VF_E2E_RUNTIME_ROOT" >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 80); do
            if curl -fsS -c "$ROOT/cookie" -b "$ROOT/cookie" "$P01_TEST_ORIGIN/setup.php" -o "$ROOT/setup.html" 2>/dev/null; then break; fi
            sleep 0.3
          done
          test -s "$ROOT/setup.html"
          CSRF="$(python3 -c 'import re,sys;s=open(sys.argv[1],encoding="utf8").read();m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",s);assert m;print(m.group(1))' "$ROOT/setup.html")"
          curl -fsS -c "$ROOT/cookie" -b "$ROOT/cookie" -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=IA6 Synthetic' \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" -o "$ROOT/setup-result.html"
          (cd "$VF_E2E_RUNTIME_ROOT" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_IA6_BROWSER_FRESH_INSTALL=PASS
          cd "$ROOT/candidate"
          npm install --no-save --no-audit --no-fund --silent playwright@1.56.1
          npx --no-install playwright install --with-deps chromium >/dev/null
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          timeout 480s node tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          timeout 90s node tests/integration/p01_ia6_backup_missing_unprotect_native_browser.mjs
          timeout 180s node tests/integration/p01_ia6_four_fallbacks_http_browser.mjs
          echo P01_IA6_FINAL_NATIVE_CHROMIUM_AND_RECOVERY_BUTTON=PASS
          echo P01_IA6_FINAL_BROWSER_SOURCE_GATE=PASS
