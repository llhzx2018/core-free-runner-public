name: P05 V1.2.3 Final Exact Source Gate R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-v123-final-exact-source-gate.yml'

permissions:
  contents: read

jobs:
  final-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vf_seo
          POSTGRES_USER: vf_seo
          POSTGRES_PASSWORD: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vf_seo -d vf_seo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 45f81677c206476013ed1d543ab661356107800c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and five-file Version Lock
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '45f81677c206476013ed1d543ab661356107800c'
          test "$(git rev-parse HEAD^{tree})" = 'b858117477fd1cb41fb53a62da6bdebfa26ad21f'
          test "$(git rev-parse HEAD^)" = 'f19f2b9c0819acf2fa19adb5d2b403a68b5d9352'
          files="$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')"
          echo "P05_V123_VERSION_LOCK_FILES=$files"
          test "$files" = 'VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.3_CANDIDATE.md package.json src/client/ProductApp.tsx '
          test "$(cat VERSION)" = '1.2.3'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.3') process.exit(1)"
          git diff --exit-code HEAD^ HEAD -- package-lock.json
          git diff --check HEAD^ HEAD

      - name: Verify release and security authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['version']=='1.2.3'
          assert p['production_version']=='1.2.2'
          assert p['formal_release']=='v1.2.2'
          assert p['release_authorization']=='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          assert p['production_deployment_authorization']=='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING'
          q=p['post_v1_2_2_update_service']
          assert q['browser_secret_collection']=='FORBIDDEN_LOCKED'
          assert q['update_read_token']=='GLOBAL_VF_PRIVATE_READ_TOKEN_SERVER_SIDE_ONLY'
          assert q['third_project_token']=='FORBIDDEN_BY_CURRENT_GOVERNANCE'
          assert q['machine_production_readback']=='NOT_CLAIMED'
          assert p['authority']['release_candidate']=='docs/authority/RELEASE_V1.2.3_CANDIDATE.md'
          PY
          git diff --exit-code HEAD^ HEAD -- docs/authority/RELEASE_V1.2.2_CANDIDATE.md docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md
          grep -F 'P05 · Product Optimization · v1.2.3' src/client/ProductApp.tsx >/dev/null
          test -f php/bin/init-update-service.php
          grep -F 'VF_PRIVATE_READ_TOKEN' php/bin/init-update-service.php >/dev/null

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Complete engineering and security regression
        shell: bash
        env:
          DATABASE_URL: postgresql://vf_seo:vf_seo@127.0.0.1:5432/vf_seo
        run: |
          set -Eeuo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate

      - name: Install PHP release runtime modules
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl sqlite3
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e))exit(1);} if(!class_exists("ZipArchive"))exit(1);'

      - name: PHP CloudPanel browser and formal staging gates
        shell: bash
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_RELEASE_SOURCE_SHA='45f81677c206476013ed1d543ab661356107800c' npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = '1.2.3'
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          test -f "$S/php/bin/init-update-service.php"
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' "$S/PHP_RELEASE_MANIFEST.json" >/dev/null
          ! grep -F 'core-free-runner-public' "$S/PHP_RELEASE_MANIFEST.json"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          echo P05_V123_FINAL_EXACT_SOURCE=PASS
          echo P05_EXACT_SHA=45f81677c206476013ed1d543ab661356107800c
          echo P05_EXACT_TREE=b858117477fd1cb41fb53a62da6bdebfa26ad21f
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
