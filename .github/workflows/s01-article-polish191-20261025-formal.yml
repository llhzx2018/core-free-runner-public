name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-article-polish191-release-20261025]
    paths: ['.github/workflows/s01-article-polish191-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.191
  TARGET_SHA: 427eb34ef03f93887028df1865eabe2241f9ad33
  TARGET_TREE: 5f069d1ec3188aa9a199b8d1c78886f368dd0a8a
  BASE_SHA: ad7a93087733fff7473fbcc198682367c17dc0bf
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-polish191-20261025/formal-spec.json --input control/.github/workflows/s01-article-polish191-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 427eb34ef03f93887028df1865eabe2241f9ad33
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40198974787 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40198974787 --jq .head_sha)" = 2b966a5ca4c508e8910fee28c71ec46c1bc35d98
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40198974787 --repo llhzx2018/core-free-runner-public --name s01-home-40198974787 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-article-polish191-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='41bcb19c719e9bb0e6c49719711cdbf975bbc688'
          for phase,count in [('before',8),('after',8),('smoke',2)]:
              result=json.loads((r/('polish-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==count
              assert result['errors']==[] and result['writes']==[]
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for ad in ['off','ready']:
                      stem=lang+'-'+str(width)+'-'+ad
                      baseline=json.loads((r/('polish-baseline-'+stem+'.json')).read_text())
                      after=json.loads((r/('polish-after-'+stem+'.json')).read_text())
                      assert after['padding']=='24px' and abs(after['gap']-(baseline['gap']-40))<2
                      for key in ['title','h1','description','canonical','hreflang','robots','schema','body','header','footer']: assert after[key]==baseline[key],key
                      for kind in ['top','end']: assert (r/('polish-'+stem+'-'+kind+'.png')).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='97f3a8186bd4d69bb16cd882586c42933a7dfd92c722ae8e2afd84e1b821ac22' and new['bytes']==1997062
          coverage=json.loads(pathlib.Path('control/lanes/s01-article-polish191-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='41bcb19c719e9bb0e6c49719711cdbf975bbc688' and coverage['tree']=='5f069d1ec3188aa9a199b8d1c78886f368dd0a8a'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40198974787'
          coverage['merged_source']='427eb34ef03f93887028df1865eabe2241f9ad33'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.191 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.191 provider/vf-tools-theme_V1.35.191.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.191' --notes '文章桌面精修收口：移除标题底部与正文顶部叠加留白，正文入口由64px收敛为24px，目录同步起点；文末长标题完整换行，装饰箭头保持独立图标，不再孤行。保留真实中英文URL、键盘与无脚本导航，不改正文、SEO、广告合同、190保存事务、权限或其它组件。精确候选双语桌面/平板有无广告8组、长标题窄宽压力、真实导航、干净安装、190升级191/回退/重复安装和受保护数据/合同字节一致通过。476运行文件。Production由Owner手工升级，最终人工验收及手机实机仍待确认。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.191 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.191 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.191 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.191.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.191.zip remote/vf-tools-theme_V1.35.191.zip
          echo '97f3a8186bd4d69bb16cd882586c42933a7dfd92c722ae8e2afd84e1b821ac22  remote/vf-tools-theme_V1.35.191.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.191.zip)" = 1997062
          gh release view v1.35.191 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
