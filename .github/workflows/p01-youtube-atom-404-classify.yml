name: P01 bounded YouTube Atom 404 classification one-shot
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-youtube-atom-404-classify.yml
permissions:
  contents: read
jobs:
  classify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_SHA: 0267c1e42a9094c93a3583d63b31120a2d2ada24
    steps:
      - name: Install PHP native dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-mbstring php-xml php-sqlite3 >/dev/null
      - name: Exact GitHub source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git"
          live="$(git ls-remote "$remote" refs/heads/main | awk '{print $1}')"
          test "$live" = "$PRODUCT_SHA"
          git clone -q --depth 1 --branch main "$remote" product
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: One target handle + two Atom requests maximum
        shell: bash
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          require 'product/src/app/bootstrap.php';
          require 'product/src/app/YouTubeManualUpdates.php';
          $resolve=new ReflectionMethod(VfYouTubeManualUpdates::class,'resolveChannelId');
          $request=new ReflectionMethod(VfYouTubeManualUpdates::class,'request');
          $parse=new ReflectionMethod(VfYouTubeManualUpdates::class,'parseFeed');
          try {
              $id=$resolve->invoke(null,'https://www.youtube.com/@ZhangDaFei');
              if (!preg_match('/^UC[A-Za-z0-9_-]{22}$/D',$id))throw new RuntimeException('UNVERIFIED_ID');
              echo "P01_YOUTUBE_TARGET_ID=".htmlspecialchars($id,ENT_QUOTES)."\n";
              $targets=['target'=>$id,'control'=>'UCBR8-60-B28hp2BmDPdntcQ'];
              foreach($targets as $type=>$cid){
                  try{
                      $xml=$request->invoke(null,'https://www.youtube.com/feeds/videos.xml?channel_id='.$cid,262144);
                      $items=$parse->invoke(null,$xml);
                      echo "P01_YOUTUBE_".strtoupper($type)."_ATOM=PASS count=".count($items)."\n";
                  }catch(Throwable $e){
                      $code=$e->getMessage();
                      if (!preg_match('/^YT_[A-Z0-9_]+$/D',$code)) $code='YT_UPSTREAM_OR_ENV';
                      echo "P01_YOUTUBE_".strtoupper($type)."_ATOM=NOT_PROVEN reason=".$code."\n";
                  }
              }
          }catch(Throwable $e){
              $code=$e->getMessage();
              if (!preg_match('/^YT_[A-Z0-9_]+$/D',$code)) $code='YT_UPSTREAM_OR_ENV';
              echo "P01_YOUTUBE_TARGET_HANDLE=NOT_PROVEN reason=".$code."\n";
          }
          PHP
          echo P01_YOUTUBE_CLASSIFICATION_READ_ONLY=PASS
