name: P07 M03 D04 exact release137 private OWNER TRIAL package
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-exact137-owner-package-20261117.yml']
permissions:
  contents: read
jobs:
  private-exact-owner-trial:
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      NO_COLOR: '1'
      PRODUCT_SHA: '1fabe5c91e487d522a43200af9e0e20b40316597'
      PRODUCT_BUILD: '0.1.0-release137'
      PRIVATE_TAG: 'p07-m03-d04-v0.1.0-release137-rc4-owner-trial'
      TRIAL_ZIP: 'P07-M03-D04-0.1.0-release137-rc4-OWNER-TRIAL.zip'
    steps:
      - name: Public infrastructure current checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P07 source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '1fabe5c91e487d522a43200af9e0e20b40316597'
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: .p07-private
      - name: Verify exact staged-only M03 and build deterministic private trial zip
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat .p07-private/BUILD_ID)" = "$PRODUCT_BUILD"
          python3 -B .p07-private/tests/test_p07_m03_d04_target_inventory_guard.py
          (cd .p07-private && python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_prepared_online_*.py')
          (cd .p07-private && python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_whole_vps_online_*.py')
          (cd .p07-private && python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_whole_file_private_snapshot.py')
          (cd .p07-private && python3 -B scripts/check_p07_modules.py)
          root="$RUNNER_TEMP/p07-private-trial"
          mkdir -m 0700 -p "$root"
          python3 -B .p07-private/scripts/p07_candidate_bundle.py \
             --product-root .p07-private --public-root . \
             --output "$root/stage" \
             --product-sha "$PRODUCT_SHA" --build "$PRODUCT_BUILD" \
             --care 0.1.0-rc85 --m03-only
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-private-trial"
          stage=root/"stage"
          att=json.loads((stage/"candidate_attestation.json").read_text("utf-8"))
          assert att["product_source_sha"]==os.environ["PRODUCT_SHA"]
          assert att["product_build"]==os.environ["PRODUCT_BUILD"]
          assert att["status"]=="FORMAL_STAGING_NOT_PUBLISHED"
          assert att["independent_module_only"] and not att["other_modules_changed"]
          assert att["system_care_build"]=="UNCHANGED"
          assert not any((stage/s).exists() for s in
                         ("installers/p07-toolbox.sh", "installers/p07-system-care.sh", "packages"))
          overlay=stage/"dist/p07/0.1.0/overlay"
          manifest=overlay/"RUNTIME.gitblob"
          files=[
             ("candidate/candidate_attestation.json",stage/"candidate_attestation.json"),
             ("candidate/installers/p07-final.sh",stage/"installers/p07-final.sh"),
             ("candidate/installers/p07.sh",stage/"installers/p07.sh"),
             ("candidate/dist/p07/0.1.0/overlay/RUNTIME.gitblob",manifest),
             ("candidate/dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz",
               stage/"dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"),
          ]
          paths=set()
          for line in manifest.read_text().splitlines():
              sha,path=line.split("  ",1)
              data=(overlay/path).read_bytes()
              assert hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()==sha
              paths.add(path)
              files.append(("candidate/dist/p07/0.1.0/overlay/"+path,overlay/path))
          assert {"bin/vfops-migrate-ui","lib/server_migration_pull.py",
                  "lib/migration_target_inventory_guard.py",
                  "lib/migration_prepared_online_refresh.py",
                  "lib/migration_prepared_whole_vps_refresh.py",
                  "lib/migration_prepared_whole_file_snapshot.py","BUILD_ID"}<=paths
          readme=(
             "P07 M03 网站与数据 / D04 服务器迁移：release137-rc4 OWNER TRIAL\n"
             "PRIVATE PRE-RELEASE ONLY / NOT FORMAL RELEASE / NOT A PUBLIC TOOLBOX UPDATE.\n"
             "PRODUCT_SHA="+os.environ["PRODUCT_SHA"]+"\n"
             "PRODUCT_BUILD="+os.environ["PRODUCT_BUILD"]+"\n"
             "Supported isolated proof: ONE_SITE and WHOLE_VPS MariaDB11.8 PULL -> PREPARED.\n"
             "NEW: single-site PREPARED online second PRIVATE static/SQLite/MySQL snapshot.\n"
             "NEW: all-source PREPARED WHOLE_VPS site-by-site PRIVATE file/database warm snapshots.\n"
             "Unsupported mixed/multi-DB/external/unsafe/symlink/oversized sites fail closed.\n"
             "No source/target same-point-in-time or final synchronization proof.\n"
             "FORMAL ARCHITECTURE GATE BLOCKED: LEGACY_GOD_FILE_GROWTH.\n"
             "FINAL WRITER QUIESCENCE AND CUTOVER ARE BLOCKED; NEVER FORCE ENABLE.\n"
             "Only on an independently authorized UNUSED test target; NO Owner production VPS.\n"
             "Do NOT run on existing CP2, old VPS, or old partial 18-site transaction.\n"
             "Do not auto-edit DNS, remove SOURCE, overwrite target, or change M01/M02/M04/M05.\n"
             "The wrapper is not a public up-to-date install entry until formal release.\n"
          ).encode()
          files.append(("candidate/OWNER_TRIAL_SCOPE.txt",readme))
          filename=os.environ["TRIAL_ZIP"]
          out=root/filename
          def emit(path):
              with zipfile.ZipFile(path,"x",zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=False) as z:
                  for name,src in sorted(files):
                      data=src if isinstance(src,bytes) else src.read_bytes()
                      assert not name.startswith("/") and ".." not in pathlib.PurePosixPath(name).parts
                      info=zipfile.ZipInfo(name,(2026,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(stat.S_IFREG|(0o755 if name.endswith(".sh") else 0o644))<<16
                      z.writestr(info,data)
          emit(out)
          second=root/"second.zip"
          emit(second)
          d=hashlib.sha256(out.read_bytes()).hexdigest()
          assert hashlib.sha256(second.read_bytes()).hexdigest()==d
          second.unlink()
          with zipfile.ZipFile(out) as z:
              assert len(z.namelist())==len(files)==len(set(z.namelist()))
              for name,src in files:
                  assert z.read(name)==(src if isinstance(src,bytes) else src.read_bytes())
          (root/"SHA256SUMS").write_text(d+"  "+filename+"\n","ascii")
          print("P07_RC4_EXACT_PRODUCT_SHA="+os.environ["PRODUCT_SHA"])
          print("P07_RC4_PRIVATE_ZIP_SHA256="+d)
          print("P07_RC4_RUNTIME_FILE_COUNT="+str(len(paths)))
          print("P07_RC4_M03_ONLY_DETERMINISTIC_STAGE=PASS")
          PY
      - name: Create and verify only PRIVATE draft + trial asset before publishing private pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo "P07_TRIAL_WRITE_CAPABILITY_MISSING"; exit 78; }
          repo="llhzx2018/vf-server-ops"
          root="$RUNNER_TEMP/p07-private-trial"
          test "$(gh api "repos/$repo/git/ref/heads/p07-m03-d04-source-sqlite-coverage-20261114" --jq .object.sha)" = "$PRODUCT_SHA"
          if gh release view "$PRIVATE_TAG" --repo "$repo" >/dev/null 2>&1; then
            echo "P07_TRIAL_TAG_ALREADY_EXISTS_REFUSE_OVERWRITE"; exit 77
          fi
          cat > "$root/README_RELEASE.txt" <<EOF
          P07-M03 网站与数据 / D04 服务器迁移：release137 rc4 仅供隔离试用。
          当前唯一有效产品源码 SHA：$PRODUCT_SHA。
          新增：单站 PREPARED 状态下在线二次私有快照，不覆盖现有目标。
          新增：整 VPS 在 PREPARED 状态下按站验证来源范围，生成隔离的网站文件及数据库私有预同步副本。
          这不是最终同步；外置资产、多库、混合数据、危险文件不受支持时整批拒绝，绝不跳站称成功。
          正式代码架构门禁尚阻断：LEGACY_GOD_FILE_GROWTH（旧迁移主文件继续增长）。
          最终停写、真实跨资产一致性及切换仍需独立安全验收。
          单站 / 整 VPS 相同 MariaDB 11.8 引擎双 CloudPanel 隔离测试通过；
          release136 -> release137 原子升级、失败恢复、幂等测试通过。
          最终停写、最终同步、源机切换、真实生产网站、跨引擎转换未认证。
          不可安装在已有业务 CP2、旧 VPS、生产环境；不可自动切换 DNS。
          不可作为正式 M03 更新版本；M01/M02/M04/M05 不变。
          EOF
          gh release create "$PRIVATE_TAG" "$root/$TRIAL_ZIP" "$root/SHA256SUMS" \
             --repo "$repo" --target "$PRODUCT_SHA" --draft --prerelease \
             --title "P07 M03-D04 release137 rc4 (OWNER TRIAL ONLY)" \
             --notes-file "$root/README_RELEASE.txt"
          entry="$(gh api "repos/$repo/releases" --jq '.[]|select(.tag_name==env.PRIVATE_TAG)')"
          test -n "$entry"
          test "$(jq -r .draft <<< "$entry")" = true
          test "$(jq -r .prerelease <<< "$entry")" = true
          test "$(jq -r .target_commitish <<< "$entry")" = "$PRODUCT_SHA"
          test "$(jq -r '.assets|length' <<< "$entry")" = 2
          asset_id="$(jq -r --arg name "$TRIAL_ZIP" '.assets[]|select(.name==$name)|.id' <<< "$entry")"
          test -n "$asset_id"
          gh api "repos/$repo/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > "$root/asset-readback.zip"
          test "$(sha256sum "$root/asset-readback.zip" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$root/SHA256SUMS")"
          echo P07_RC4_PRIVATE_RELEASE_ASSET_SHA256_READBACK=PASS
          id="$(jq -r .id <<< "$entry")"
          gh api --method PATCH "repos/$repo/releases/$id" -F draft=false -F prerelease=true > "$root/published.json"
          test "$(jq -r .draft "$root/published.json")" = false
          test "$(jq -r .prerelease "$root/published.json")" = true
          test "$(jq -r '.assets|length' "$root/published.json")" = 2
          test "$(jq -r .target_commitish "$root/published.json")" = "$PRODUCT_SHA"
          echo P07_RC4_OWNER_TRIAL_PRIVATE_PRERELEASE_PUBLISHED=PASS
          echo P07_RC4_FORMAL_RELEASE=NO
          echo P07_RC4_PUBLIC_TOOLBOX_UNCHANGED=YES
          echo P07_RC4_PRODUCTION_CHANGED=NO
      - name: Remove all private source and sandbox assets
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private "$RUNNER_TEMP/p07-private-trial"
          test ! -e .p07-private
          echo P07_RC4_TEMPORARY_PRIVATE_SOURCE_CLEANUP=PASS
