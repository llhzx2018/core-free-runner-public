name: S01-C02 V1.21.1070 Formal Quality Native Disclosure Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_ops_1070_upgrade
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 730e53d1ee9b411edb6f6603482a1df0af8fd1b1
      TARGET_VERSION: 1.21.1070
      RELEASE_TAG: v1.21.1070
      ASSET_NAME: vf-tools-ops_V1.21.1070.zip
      TESTED_RUN_ID: 37772652029
      TESTED_SOURCE_SHA: 847eeb247ad11a795ac1067df7b55a3837968cf7
      TESTED_SOURCE_TREE: ff340a482c711402dfa4c3b9336bee67a7b10b63
      TESTED_ARTIFACT: s01-c02-1211070-quality-disclosure-evidence
      EXPECTED_BYTES: 3533036
      EXPECTED_SHA256: 9bc122a1923c5ebc0c7b59fcb355dbca22a0045942e8ee60b15d1c9ce69cbb65
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: 9f8b2e54bbe9d0a7124773f5cd4977a62cdac205fb3d47ca793fd45ade1e43ca
      PREVIOUS_TAG: v1.21.1069
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1069.zip
      PREVIOUS_SHA256: 1ea45ba6788cd12762dd7cbc856df43a32f5c59bce7fb6a73d20de2d09a4bb2e
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Verify exact Candidate promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p tested evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "S01-V10-QUALITY-NATIVE-ISSUE-DISCLOSURE-CLOSURE" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          test "$(gh run view "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = "success"
          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver
            and .lifecycle_php=="PASS" and .lifecycle_js=="PASS" and .security_php=="PASS" and .controls_browser=="PASS" and .quality_soft_boot_browser=="PASS" and .source_home_policy_php=="PASS" and .rendered_home_php=="PASS" and .publish_zip_browser=="PASS" and .zip_gate_truth=="PASS" and .real_chunk_php=="PASS" and .source_semantic_php=="PASS" and .quality_disclosure_native_browser=="PASS"
            and .browser_regression=="PASS" and .owner_product_pass==false and .production=="NOT_TOUCHED"
          ' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(jq -r '.asset_bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' tested/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          php target/tests/s01-c02-1211061-source-security-isolated.php
          php -l target/tests/s01-c02-1211064-home-fallback-source-true-positive-regression.php
          php target/tests/s01-c02-1211064-home-fallback-source-true-positive-regression.php
          php -l target/tests/s01-c02-1211065-rendered-home-single-writer-true-positive-regression.php
          php target/tests/s01-c02-1211065-rendered-home-single-writer-true-positive-regression.php
          php -l target/includes/admin-v13/views/publish_zip_v6.php
          php -l target/tests/s01-c02-1211066-publish-zip-saved-task-view-fixture.php
          node --check target/assets/js/admin-publish-zip.js
          node --check target/tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
          php -l target/tests/s01-c02-1211068-zip-gate-truth-view-fixture.php
          node --check target/tests/s01-c02-1211068-zip-gate-truth-contract.js
          node target/tests/s01-c02-1211068-zip-gate-truth-contract.js
          php -l target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php
          php target/tests/s01-c02-1211067-zip-php-chunk-real-contract.php
          php -l target/tests/s01-c02-1211069-source-semantic-freshness-isolated.php
          php target/tests/s01-c02-1211069-source-semantic-freshness-isolated.php
          node --check target/assets/js/admin-acceptance-overview.js
          node --check target/tests/s01-c02-1211070-quality-native-disclosure-browser.js
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php
          grep -F "'acceptance_overview' => ['admin-acceptance-overview.js','admin-o11-source.js']" target/includes/views/admin-style-helpers/admin-style-core.php >/dev/null
          php target/tests/s01-c02-1211060-source-lifecycle-isolated.php
          node target/tests/s01-c02-1211060-source-lifecycle-ajax-result.js
          php target/tests/s01-c02-1211059-quality-capability-runtime-contract.php
          php target/tests/s01-c02-1211058-quality-disclosure-contract.php
          php target/tests/s01-c02-1211057-active-quality-task-action-contract.php
          php target/tests/s01-c02-1211056-quality-task-entry-contract.php
          php target/tests/s01-c02-1211055-quality-center-final-visual-contract.php
          php target/tests/s01-c02-1211054-quality-center-visual-hierarchy-contract.php
          php target/tests/s01-c02-1211053-quality-task-compact-contract.php
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-1211051-source-real-run-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo EXACT_TESTED_SOURCE=PASS

      - name: Rebuild exact package and prove rollback source
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/$ASSET_NAME" > evidence/package.json
          test "$(jq -r '.asset_bytes' evidence/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' evidence/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' evidence/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' evidence/package.json)" = "$EXPECTED_RUNTIME_FP"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          gh release download v1.21.1059 --repo "$TARGET_REPOSITORY" --pattern vf-tools-ops_V1.21.1059.zip --dir previous --clobber
          test "$(sha256sum previous/vf-tools-ops_V1.21.1059.zip | awk '{print $1}')" = "963fd85f7d42db21504a7793bc20d5607b1a21616e6cd56d1f9cd1669e1b9acc"
          gh release download v1.21.1060 --repo "$TARGET_REPOSITORY" --pattern vf-tools-ops_V1.21.1060.zip --dir previous --clobber
          test "$(sha256sum previous/vf-tools-ops_V1.21.1060.zip | awk '{print $1}')" = "28c3b50325aadf1cd83bb59723735820abddab5c5d8033c749d20cc8caa1d3ad"

      - name: Clean install, upgrade and rollback proof
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/s01-ops-1070"
          mkdir -p "$ROOT"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          chmod +x "$ROOT/wp"
          mysql -h127.0.0.1 -P3306 -uroot -pfixture-root -e 'CREATE DATABASE IF NOT EXISTS vf_ops_1070_clean CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          WP1="$ROOT/clean"; mkdir -p "$WP1"; wp1(){ php "$ROOT/wp" --path="$WP1" "$@"; }
          wp1 core download --version=7.0.2 --force >/dev/null
          wp1 config create --dbname=vf_ops_1070_clean --dbuser=root --dbpass=fixture-root --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp1 core install --url=http://127.0.0.1:18179 --title='Ops Clean 1060' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp1 plugin install "/tmp/$ASSET_NAME" --activate >/dev/null
          wp1 eval 'if(VF_OPS_VERSION!=="1.21.1070")throw new RuntimeException("CLEAN_VERSION");'
          WP2="$ROOT/upgrade"; mkdir -p "$WP2"; wp2(){ php "$ROOT/wp" --path="$WP2" "$@"; }
          wp2 core download --version=7.0.2 --force >/dev/null
          wp2 config create --dbname=vf_ops_1070_upgrade --dbuser=vf --dbpass=fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp2 core install --url=http://127.0.0.1:18180 --title='Ops Upgrade 1060' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp2 plugin install "$GITHUB_WORKSPACE/previous/$PREVIOUS_ASSET" --activate >/dev/null
          wp2 option update vf_ops_release_1061_sentinel preserve >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1069")throw new RuntimeException("BASE_VERSION");'
          wp2 plugin install "/tmp/$ASSET_NAME" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1070")throw new RuntimeException("UPGRADE_VERSION");if(get_option("vf_ops_release_1061_sentinel")!=="preserve")throw new RuntimeException("STATE_CHANGED");'
          wp2 plugin install "$GITHUB_WORKSPACE/previous/$PREVIOUS_ASSET" --force >/dev/null
          wp2 eval 'if(VF_OPS_VERSION!=="1.21.1069")throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_release_1061_sentinel")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");'
          mysql -h127.0.0.1 -P3306 -uroot -pfixture-root -e 'CREATE DATABASE IF NOT EXISTS vf_ops_1070_from1059 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          WP3="$ROOT/from1059"; mkdir -p "$WP3"; wp3(){ php "$ROOT/wp" --path="$WP3" "$@"; }
          wp3 core download --version=7.0.2 --force >/dev/null
          wp3 config create --dbname=vf_ops_1070_from1059 --dbuser=root --dbpass=fixture-root --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp3 core install --url=http://127.0.0.1:18181 --title='Ops From 1059' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp3 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1059.zip" --activate >/dev/null
          wp3 option update vf_ops_release_1061_from1059 preserve >/dev/null
          wp3 eval 'if(VF_OPS_VERSION!=="1.21.1059")throw new RuntimeException("BASE_1059");'
          wp3 plugin install "/tmp/$ASSET_NAME" --force >/dev/null
          wp3 eval 'if(VF_OPS_VERSION!=="1.21.1070"||get_option("vf_ops_release_1061_from1059")!=="preserve")throw new RuntimeException("UPGRADE_1059_TO_1061");'
          wp3 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1059.zip" --force >/dev/null
          wp3 eval 'if(VF_OPS_VERSION!=="1.21.1059"||get_option("vf_ops_release_1061_from1059")!=="preserve")throw new RuntimeException("ROLLBACK_1059");'

          mysql -h127.0.0.1 -P3306 -uroot -pfixture-root -e 'CREATE DATABASE IF NOT EXISTS vf_ops_1070_from1060 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          WP4="$ROOT/from1060"; mkdir -p "$WP4"; wp4(){ php "$ROOT/wp" --path="$WP4" "$@"; }
          wp4 core download --version=7.0.2 --force >/dev/null
          wp4 config create --dbname=vf_ops_1070_from1060 --dbuser=root --dbpass=fixture-root --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp4 core install --url=http://127.0.0.1:18182 --title='Ops From 1060' --admin_user=admin --admin_password=fixture-admin --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp4 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1060.zip" --activate >/dev/null
          wp4 option update vf_ops_release_1062_from1060 preserve >/dev/null
          wp4 eval 'if(VF_OPS_VERSION!=="1.21.1060")throw new RuntimeException("BASE_1060");'
          wp4 plugin install "/tmp/$ASSET_NAME" --force >/dev/null
          wp4 eval 'if(VF_OPS_VERSION!=="1.21.1070"||get_option("vf_ops_release_1062_from1060")!=="preserve")throw new RuntimeException("UPGRADE_1060_TO_1062");'
          wp4 plugin install "$GITHUB_WORKSPACE/previous/vf-tools-ops_V1.21.1060.zip" --force >/dev/null
          wp4 eval 'if(VF_OPS_VERSION!=="1.21.1060"||get_option("vf_ops_release_1062_from1060")!=="preserve")throw new RuntimeException("ROLLBACK_1060");'

      - name: Publish formal release
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 VF Tools Ops 1.21.1070

          Quality Center issue disclosure reliability fix following OWNER screenshot on Ops 1.21.1069:
          - "问题明细" with 3 items stopped responding while "高级信息" still expanded.
          - Root cause: imperative JS preventDefault and manually toggled native <details> state; plus soft-refresh clone retained data-attr bound marker, which skipped rebinding and left stale aria metadata.
          - Now BOTH disclosures use browser-native details/summary open/close and keyboard behavior with no custom click or keyboard interception, no synthetic expanded attributes.
          - Root boot now tracks actual DOM identity via WeakSet, not clone-inherited data attribute. Any cloned/soft-mounted Quality overview is safe.
          - Visible expanded/collapsed chevron and keyboard focus ring. Frozen Header/Menu, 2x2 Quality cards, Source/ZIP workflow unchanged.
          - Candidate 37772652029 PASS including exact JS/browser issue+advanced click by label and count, Enter, Space, no-JS fallback, soft-refresh and DOM clone; old 1058 browser regression revalidated and all prior Source/ZIP safety regressions PASS.
          - Main 730e53d1ee9b411edb6f6603482a1df0af8fd1b1; tested SHA 847eeb247ad11a795ac1067df7b55a3837968cf7, tree ff340a482c711402dfa4c3b9336bee67a7b10b63.
          - ZIP SHA256 9bc122a1923c5ebc0c7b59fcb355dbca22a0045942e8ee60b15d1c9ce69cbb65, 3533036 bytes.
          - Isolated WordPress clean install, 1069→1070 upgrade and rollback. No Production modification.
          Machine PASS does not mean Owner Product PASS, Production upgrade remains manual.
          EOF
          gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1070" --notes-file notes.md

      - name: Remote readback
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir -p readback evidence
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          jq -n --arg release_id "$RID" --arg asset_id "$AID" --arg sha "$EXPECTED_SHA256" --argjson bytes "$EXPECTED_BYTES" '{status:"PASS",release_id:$release_id,asset_id:$asset_id,asset_sha256:$sha,asset_bytes:$bytes,production:"NOT_TOUCHED",owner_product_pass:false}' > evidence/FINAL_RELEASE_EVIDENCE.json
          cat evidence/FINAL_RELEASE_EVIDENCE.json
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Upload formal release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211070-formal-release-evidence
          path: evidence/
          retention-days: 30
