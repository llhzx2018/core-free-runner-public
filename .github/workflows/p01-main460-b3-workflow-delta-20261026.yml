name: P01 460 B3 and Workflow Delta Proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-main460-b3-workflow-delta-20261026.yml'
permissions:
  contents: read
jobs:
  p01-delta:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-start
      TARGET_VERSION: 2.47.460
      TARGET_SHA: d0f532c3ffec874a3bffa624f99ad94a1ee1084e
      CANDIDATE_SHA: d0f532c3ffec874a3bffa624f99ad94a1ee1084e
    steps:
      - name: Checkout public Runner harness
        uses: actions/checkout@v4
      - name: Audit exact source identity before transient checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec .github/workflows/p01-main460-b3-workflow-delta-20261026.spec.json --input .github/workflows/p01-main460-b3-workflow-delta-20261026.yml
      - name: Prepare ephemeral PHP test environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Checkout exact private candidate transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo P01_DELTA_BLOCKED_SECRET; exit 11; }
          git init -q current
          git -C current remote add origin "https://x-access-token:$READ_TOKEN@github.com/$SOURCE_REPOSITORY.git"
          git -C current -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C current remote remove origin
          test "$(tr -d '\r\n ' < current/VERSION)" = "$TARGET_VERSION"
          echo "P01_DELTA_EXACT_SOURCE=$CANDIDATE_SHA"
      - name: PHP and JS syntax on changed surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in src/app/CourseCatalogPresentation.php src/app/ToolSceneDetail.php tests/course_learning_brief_regression.php tests/unit/tools_sticky_workflow_nav_v247205_contract.php; do
            php -l "current/$file"
          done
          node --check current/src/assets/tool-scene-detail.js
          echo P01_DELTA_PHP_JS_SYNTAX=PASS
      - name: B3 and toolbox focused behavioral regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            tests/course_learning_brief_regression.php \
            tests/unit/course_workspace_presentation_contract.php \
            tests/unit/course_catalog_pairing_runtime.php \
            tests/unit/tool_scene_detail_contract.php \
            tests/unit/tools_sticky_workflow_nav_v247205_contract.php \
            tests/unit/tool_scene_single_resource_surface_contract.php \
            tests/unit/tool_scene_explainability_contract.php; do
            echo "P01_DELTA_TEST_START=$file"
            php "current/$file"
          done
          echo P01_DELTA_BEHAVIORAL_7_OF_7=PASS
      - name: Erase transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d current ]; then
            git -C current remote remove origin 2>/dev/null || true
            rm -rf current
          fi
          test ! -e current
          echo P01_PRIVATE_SOURCE_CLEANUP=PASS
