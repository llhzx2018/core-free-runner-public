name: P07 release88 exact formal publication
on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc57/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-release88-formal-publish.yml'
permissions:
  contents: read
concurrency:
  group: p07-release88-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release88
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc57
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release88'
          test "$(cat "$care/VERSION")" = '0.1.0-rc57'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 0ff6afeb831c3b96074c89db6b965432f4224b45
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 8ec5063ce62772538aeec5eb58094b5d722dfe12
          test "$(git hash-object "$care/MANIFEST.gitblob")" = 6efb8dc9a392205d7f464550ce793a4a5636ee9c
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = 9d7ca1baacc8050a8da908aa74b9249cebad1d71
          test "$(git hash-object installers/p07.sh)" = 6a7f1852e483470f303a953808f2d6cf1d9a628b
          test "$(git hash-object installers/p07-toolbox.sh)" = becb7c51e31a1aeb341d51ebb79ceefdc2359b61
          test "$(git hash-object installers/p07-system-care.sh)" = 343f46cb74b55237d7ad309b374584d315cdc569
          grep -Fq 'EXPECTED_BLOB="9d7ca1baacc8050a8da908aa74b9249cebad1d71"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release88"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="0ff6afeb831c3b96074c89db6b965432f4224b45"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release88"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc57"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='6efb8dc9a392205d7f464550ce793a4a5636ee9c'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE88_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release88 · 正式网站数据工具与 System Care rc57' \
              --notes 'Exact source P07 release88 and System Care rc57; public candidate 26/26 CI PASS; isolated install, upgrade, idempotence, integrity failure and rollback gates PASS. New VPS CloudPanel, real backup/restore/migration and Owner Real Use NOT_RUN. Production, DNS and original server untouched.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE88_GITHUB_RELEASE_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 6a7f1852e483470f303a953808f2d6cf1d9a628b' 'installers/p07-final.sh 9d7ca1baacc8050a8da908aa74b9249cebad1d71' 'installers/p07-toolbox.sh becb7c51e31a1aeb341d51ebb79ceefdc2359b61' 'installers/p07-system-care.sh 343f46cb74b55237d7ad309b374584d315cdc569' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 0ff6afeb831c3b96074c89db6b965432f4224b45'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release88-remote
            test "$(git hash-object /tmp/p07-release88-remote)" = "$sha"
          done
          echo P07_RELEASE88_REMOTE_DISTRIBUTION_READBACK_PASS
