name: P01 Bootstrap Minimal Delta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-bootstrap-minimal-delta.yml'
      - 'requests/p01-bootstrap-minimal-delta-*.txt'

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 713f88637a05a4cebd3e7cf20bebf5d2a361e538
    steps:
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p01
      - name: Rebuild bootstrap from Production truth with two exact deltas
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          cd p01
          git show origin/main:src/app/bootstrap.php > src/app/bootstrap.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          pairs=[
            ("define('VF_VERSION', '2.21.14');", "define('VF_VERSION', '2.21.15');"),
            ("define('VF_UPDATE_MANIFEST_URL', 'https://updates.kewaro.com/manifests/apps/vf-start.json');\n", ""),
          ]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit(f'exact match failed: {old!r}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          php -l src/app/bootstrap.php >/dev/null
          test "$(git diff --numstat origin/main -- src/app/bootstrap.php | awk '{print $1":"$2}')" = '1:2'
          git diff --check origin/main -- src/app/bootstrap.php
          echo 'BOOTSTRAP_MINIMAL_DELTA=PASS'
      - name: Commit normalized bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add src/app/bootstrap.php
          git commit -m 'chore(update): normalize bootstrap to minimal delta'
          git push origin HEAD:develop
          echo "P01_NORMALIZED_HEAD=$(git rev-parse HEAD)"
