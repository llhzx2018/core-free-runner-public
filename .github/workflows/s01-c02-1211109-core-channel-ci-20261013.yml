name: S01 C02 Ops 1.21.1109 exact core updates channel validation
on:
  push:
    branches: [task/s01-c02-1211106-real-wp-tools-css-20261012]
    paths: [.github/workflows/s01-c02-1211109-core-channel-ci-20261013.yml]
permissions:
  contents: read
jobs:
  exact-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_REPO: llhzx2018/core-updates
      SOURCE_SHA: 42a784912ccfa6744785b78c82ecad4213bc89cf
      VERSION: '1.21.1109'
      ASSET_SHA: e6e2c0dbf566afc52b80709b53afb381827b2c2a824722006a6f97855b08e200
    steps:
      - name: Checkout exact private core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 42a784912ccfa6744785b78c82ecad4213bc89cf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: target
      - name: Execute original core channel CI and assert one-component delta
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$SOURCE_SHA"
          cd target
          python3 scripts/check_manifest_contract.py > "$RUNNER_TEMP/core-manifest-report.json"
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          m=json.loads(pathlib.Path("projects/S01-C02.json").read_text())
          assert m["target_version"]==os.environ["VERSION"]
          assert m["asset_sha256"]==os.environ["ASSET_SHA"]
          assert m["release_tag"]=="v1.21.1109"
          assert m["asset_bytes"]==3580162 and m["runtime_files"]==990
          assert m["plugin_file"]=="vf-ops/vf-ops.php"
          assert m["runtime_fingerprint"]=="ce571c62940befa2cf8f65c9fc8987bd3531217bc43c591ef4fb01de4155e99c"
          assert "1.21.1108" in m["from_versions"]
          assert m["schema_from"]==m["schema_to"]=="6.0.0"
          changed=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r","HEAD"],text=True).splitlines()
          assert changed==["projects/S01-C02.json"], changed
          meta={"result":"PASS","version":m["target_version"],"channel_commit":os.environ["SOURCE_SHA"],
                "manifest_sha256":hashlib.sha256(pathlib.Path("projects/S01-C02.json").read_bytes()).hexdigest(),
                "exact_release_asset_sha256":m["asset_sha256"],"core_schema":"PASS",
                "core_php_syntax":"PASS","core_php_regression":"PASS","only_ops_channel_changed":"PASS",
                "private_repository_native_ci":"FAILED_INFRA_NO_AVAILABLE_LOG",
                "production":"NOT_EXECUTED"}
          pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("S01_C02_EXACT_CHANNEL_PROOF.json").write_text(json.dumps(meta,indent=2))
          print("S01_C02_1109_EXACT_CORE_CHANNEL_CI_PASS")
          PY
      - name: Upload nonsecret validation proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1107-exact-channel-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/core-manifest-report.json
            ${{ runner.temp }}/S01_C02_EXACT_CHANNEL_PROOF.json
          if-no-files-found: error
          retention-days: 7
