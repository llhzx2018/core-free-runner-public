name: adpage-199-production-exact-source
on:
  pull_request:
    paths:
      - '.github/workflows/adpage-199-production-oneoff.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Public Runner baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read exact private GOV-DOC candidate in temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 470e28a829a4883867717e553b3d0e4d5f172810
          path: .private-gov
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install isolated browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-adpage
          .venv-adpage/bin/python -m pip install --disable-pip-version-check --quiet 'playwright==1.56.0'
          .venv-adpage/bin/python -m playwright install chromium
      - name: Exact-source regression and governance checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd .private-gov
          actual=$(git rev-parse HEAD)
          test "$actual" = '470e28a829a4883867717e553b3d0e4d5f172810'
          echo 'EXACT_SOURCE_CHECK=PASS'
          ../.venv-adpage/bin/python -B - <<'PY'
          import unittest
          import sys
          root='skills/skill-adpage/V1.1/scripts'
          suite=unittest.defaultTestLoader.discover(root,pattern='test_*.py')
          outcome=unittest.TextTestRunner(verbosity=1).run(suite)
          print('ADPAGE_TESTS_RUN='+str(outcome.testsRun))
          print('ADPAGE_TESTS_SKIPPED='+str(len(outcome.skipped)))
          if not outcome.wasSuccessful() or outcome.skipped or outcome.testsRun < 30:
              sys.exit(1)
          print('ADPAGE_PRODUCTION_GATES=PASS')
          PY
          ../.venv-adpage/bin/python -B governance/public-authority/tools/current_dependency_lint.py
          ../.venv-adpage/bin/python -B governance/public-authority/tools/global_closure_lint.py
          ../.venv-adpage/bin/python -B governance/catalog/tools/doc_structure_lint.py
          echo 'SCOPED_GOV_RULES=PASS'
      - name: Remove private source and virtualenv
        if: always()
        shell: bash
        run: |
          rm -rf -- .private-gov .venv-adpage
          echo 'PRIVATE_CHECKOUT_CLEANUP=ATTEMPTED'
