name: P01 V2.47.11 Update Recovery Patch Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v24711-update-recovery-patch.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24711-update-recovery-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'temp/p01-v24711-update-recovery-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-v24711-update-recovery-20260916
      EXPECTED_HEAD: 523fdeeadbac5f51730f62980034d866442bc352
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact product branch preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${PRODUCT_BRANCH}" --jq '.object.sha')" = "$EXPECTED_HEAD"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo P01_V24711_PATCH_PREFLIGHT=PASS

      - name: Checkout product work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Apply V2.47.11 recovery patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root=Path('vf-start')
          p=root/'src/app/UpdateManager.php'
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label,count=1):
              global s
              n=s.count(old)
              if n != count:
                  raise SystemExit(f'{label}: expected {count}, got {n}')
              s=s.replace(old,new,count)

          rep("require_once __DIR__ . '/CoreUpdates/GitHubClient.php';\n", "require_once __DIR__ . '/CoreUpdates/GitHubClient.php';\nrequire_once __DIR__ . '/UpdateCredentialStore.php';\n", 'credential require')

          rep("""        $manifest = $this->cachedManifest();
        $compat = $manifest ? $this->compatibility($manifest) : $this->emptyCompatibility();
        $latest = $manifest ? self::normalizeVersion((string)($manifest['target_version'] ?? '')) : '';
        $priority = $manifest ? $this->updatePriority($manifest) : 'normal';
""", """        $cachedManifest = $this->cachedManifest();
        $discoveryStale = $this->cachedManifestIsStale($cachedManifest);
        $lastKnownLatest = $cachedManifest ? self::normalizeVersion((string)($cachedManifest['target_version'] ?? '')) : '';
        $lastKnownCheck = $this->stateGet('last_success_at');
        $manifest = $discoveryStale ? null : $cachedManifest;
        $compat = $manifest ? $this->compatibility($manifest) : $this->emptyCompatibility();
        if ($discoveryStale) {
            $compat['reason'] = '本机版本已变化，上次更新检查结果已过期，请重新检查。';
        }
        $latest = $manifest ? self::normalizeVersion((string)($manifest['target_version'] ?? '')) : '';
        $priority = $manifest ? $this->updatePriority($manifest) : 'normal';
        $credentialStatus = $this->credentialStatus();
""", 'status stale prelude')

          rep("""            'latest_version' => $latest,
            'available' => (bool)$compat['available'],
""", """            'latest_version' => $latest,
            'last_known_latest_version' => $lastKnownLatest,
            'discovery_stale' => $discoveryStale,
            'available' => (bool)$compat['available'],
""", 'status stale fields')

          rep("""            'last_check_at' => $this->stateGet('last_success_at'),
            'last_attempt_at' => $this->stateGet('last_attempt_at'),
""", """            'last_check_at' => $discoveryStale ? '' : $lastKnownCheck,
            'last_known_check_at' => $lastKnownCheck,
            'last_attempt_at' => $this->stateGet('last_attempt_at'),
""", 'status check fields')

          rep("""            'credential_configured' => $this->credentialConfigured(),
            'signature_required' => false,
""", """            'credential_configured' => $this->credentialConfigured(),
            'credential_source' => (string)$credentialStatus['source'],
            'signature_required' => false,
""", 'status credential source')

          rep("""        $now = time();
        $next = strtotime($this->stateGet('next_update_check_at')) ?: 0;
        if ($next <= 0) {
""", """        $now = time();
        $discoveryStale = $this->cachedManifestIsStale($this->cachedManifest());
        $next = $discoveryStale ? 0 : (strtotime($this->stateGet('next_update_check_at')) ?: 0);
        if (!$discoveryStale && $next <= 0) {
""", 'autocheck stale bypass')

          rep("""                if ($result === 'success') {
                    $this->stateSet('last_update_at', (string)($data['completed_at'] ?? gmdate('c')));
                    $this->stateSet('last_error', '');
                }
""", """                if ($result === 'success') {
                    $this->stateSet('last_update_at', (string)($data['completed_at'] ?? gmdate('c')));
                    $this->stateSet('last_error', '');
                    foreach (['cached_release_manifest_json','cached_release_manifest_sha256','last_success_at','next_update_check_at','notice_seen_version'] as $stateKey) {
                        $this->stateSet($stateKey, '');
                    }
                }
""", 'journal cache invalidation')

          rep("""    private function readToken(): string
    {
        $value = getenv('VF_PRIVATE_READ_TOKEN');
        return is_string($value) ? trim($value) : '';
    }

    private function credentialConfigured(): bool
""", """    private function readToken(): string
    {
        $managed = (new VfUpdateCredentialStore($this->privateRoot))->managedToken();
        if ($managed !== '') return $managed;
        $value = getenv('VF_PRIVATE_READ_TOKEN');
        return is_string($value) ? trim($value) : '';
    }

    private function credentialStatus(): array
    {
        if (is_callable($this->manifestFetcher)) {
            return ['configured'=>true,'source'=>'test','managed'=>false,'environment_configured'=>false];
        }
        return (new VfUpdateCredentialStore($this->privateRoot))->status();
    }

    private function credentialConfigured(): bool
""", 'managed credential priority')

          rep("""    private function cachedManifest(): ?array
    {
        $cached = $this->stateGet('cached_release_manifest_json');
""", """    private function cachedManifest(): ?array
    {
        $cached = $this->stateGet('cached_release_manifest_json');
""", 'cached manifest anchor')
          cached_end="""        return $decoded;
    }

    private function assertReleaseFreshness(array $manifest, string $manifestSha): void
"""
          if cached_end not in s: raise SystemExit('cached manifest end anchor missing')
          s=s.replace(cached_end,"""        return $decoded;
    }

    private function cachedManifestIsStale(?array $manifest): bool
    {
        if (!$manifest) return false;
        $latest = self::normalizeVersion((string)($manifest['target_version'] ?? ''));
        return $latest !== '' && version_compare($latest, $this->currentVersion, '<');
    }

    private function assertReleaseFreshness(array $manifest, string $manifestSha): void
""",1)

          rep("""    private function publicError(string $message): string
    {
        $message = vf_clean_text($message, 600);
""", """    private function publicError(string $message): string
    {
        $message = vf_clean_text($message, 600);
        $lower = strtolower($message);
        if (str_contains($lower, 'http 401') || str_contains($lower, 'bad credentials')) {
            return '更新源只读授权已失效（VF_PRIVATE_READ_TOKEN）。当前版本保持不变；请在“更新授权”中重新连接。';
        }
        if (str_contains($lower, 'http 403')) {
            return '更新源只读授权权限不足（VF_PRIVATE_READ_TOKEN）。当前版本保持不变；请在“更新授权”中重新连接。';
        }
""", 'public error classifier')
          p.write_text(s,encoding='utf-8')

          js=root/'src/assets/update-core.js'
          s=js.read_text(encoding='utf-8')
          old="s=s||{};var priority=String(s.update_priority||'normal'),stableCurrent=!s.current_withdrawn&&currentAtOrBeyondLatest(s);"
          new="s=s||{};var priority=String(s.update_priority||'normal'),stableCurrent=!s.current_withdrawn&&!s.discovery_stale&&currentAtOrBeyondLatest(s);"
          if s.count(old)!=1: raise SystemExit('js stableCurrent anchor')
          s=s.replace(old,new,1)
          old="if(el('updateLatest'))el('updateLatest').textContent=s.latest_version?'V'+s.latest_version:'尚未取得';\n      if(el('updateLastCheck'))el('updateLastCheck').textContent=fmtTime(s.last_check_at);"
          new="if(el('updateLatest'))el('updateLatest').textContent=s.discovery_stale?'待重新检查':(s.latest_version?'V'+s.latest_version:'尚未取得');\n      if(el('updateLastCheck'))el('updateLastCheck').textContent=s.discovery_stale?'尚未重新检查':fmtTime(s.last_check_at);"
          if s.count(old)!=1: raise SystemExit('js stale labels anchor')
          s=s.replace(old,new,1)
          old="""      if(stableCurrent){
        clearTransientState();setDot('ok');if(el('updateState'))el('updateState').textContent='已是最新版本。';setInstallVisible(false,'');
"""
          new="""      if(s.discovery_stale){
        clearTransientState();setDot('warn');if(el('updateState'))el('updateState').textContent=String(s.reason||'本机版本已变化，上次更新检查结果已过期，请重新检查。');setInstallVisible(false,'');
      }else if(stableCurrent){
        clearTransientState();setDot('ok');if(el('updateState'))el('updateState').textContent='已是最新版本。';setInstallVisible(false,'');
"""
          if s.count(old)!=1: raise SystemExit('js stale branch anchor')
          s=s.replace(old,new,1)
          js.write_text(s,encoding='utf-8')

          up=root/'src/update.php'
          s=up.read_text(encoding='utf-8')
          old='''      <button class="btn" id="checkUpdate" type="button">检查更新</button>\n      <button class="btn primary" id="installUpdate" type="button" hidden>立即更新</button>'''
          new='''      <button class="btn" id="checkUpdate" type="button">检查更新</button>\n      <a class="btn" href="update-credential.php">更新授权</a>\n      <button class="btn primary" id="installUpdate" type="button" hidden>立即更新</button>'''
          if s.count(old)!=1: raise SystemExit('update page action anchor')
          s=s.replace(old,new,1).replace("assets/update.js?v=2478-csrf1","assets/update.js?v=24711-recovery1")
          up.write_text(s,encoding='utf-8')

          for rel in ['VERSION','src/VERSION.txt']:
              f=root/rel
              if f.read_text(encoding='utf-8').strip()!='2.47.10': raise SystemExit(rel+' unexpected')
              f.write_text('2.47.11\n',encoding='utf-8')
          boot=root/'src/app/bootstrap.php'
          s=boot.read_text(encoding='utf-8')
          if s.count("define('VF_VERSION','2.47.10');")!=1: raise SystemExit('bootstrap version anchor')
          boot.write_text(s.replace("define('VF_VERSION','2.47.10');","define('VF_VERSION','2.47.11');",1),encoding='utf-8')

          test=root/'tests/unit/update_recovery_v24711_contract.php'
          test.write_text(r'''<?php
          declare(strict_types=1);
          function t(bool $ok, string $m): void { if (!$ok) throw new RuntimeException($m); }
          $tmp=sys_get_temp_dir().'/vf-update-auth-'.bin2hex(random_bytes(4));
          @mkdir($tmp,0700,true);
          if (!defined('VF_PRIVATE_ROOT')) define('VF_PRIVATE_ROOT',$tmp);
          if (!function_exists('vf_write_storage_guards')) { function vf_write_storage_guards(string $dir): void { file_put_contents($dir.'/.htaccess',"Deny from all\n"); } }
          if (!function_exists('vf_write_exact_file')) { function vf_write_exact_file(string $path,string $data,int $mode=0600): void { if (file_put_contents($path,$data,LOCK_EX)===false) throw new RuntimeException('write'); chmod($path,$mode); } }
          require __DIR__.'/../../src/app/UpdateCredentialStore.php';
          putenv('VF_PRIVATE_READ_TOKEN=env_read_token_abcdefghijklmnopqrstuvwxyz123456');
          $store=new VfUpdateCredentialStore($tmp);
          t($store->status()['source']==='environment','environment fallback');
          $managed='github_pat_managed_read_ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890';
          $store->save($managed);
          $status=$store->status();
          t($status['source']==='managed' && $status['managed']===true,'managed priority');
          t(strpos(json_encode($status),$managed)===false,'secret leaked in status');
          $path=$tmp.'/update-auth/github-read-token';
          t(is_file($path) && !is_link($path),'managed file');
          if (DIRECTORY_SEPARATOR==='/') t((fileperms($path)&0777)===0600,'managed mode');
          $store->clear();
          t($store->status()['source']==='environment','clear fallback');
          $manager=file_get_contents(__DIR__.'/../../src/app/UpdateManager.php');
          $js=file_get_contents(__DIR__.'/../../src/assets/update-core.js');
          $page=file_get_contents(__DIR__.'/../../src/update-credential.php');
          t(strpos($manager,'cachedManifestIsStale')!==false,'stale classifier');
          t(strpos($manager,'更新源只读授权已失效')!==false,'401 classifier');
          t(strpos($manager,'new VfUpdateCredentialStore($this->privateRoot)')!==false,'managed store route');
          t(strpos($js,'s.discovery_stale')!==false && strpos($js,'待重新检查')!==false,'stale UI');
          t(strpos($page,"vf_is_admin()")!==false && strpos($page,"hash_equals($csrf")!==false,'admin csrf');
          t(strpos($page,'type="password"')!==false,'secret input');
          t(strpos($page,'VF_RELEASE_WRITE_TOKEN')!==false,'release token prohibition copy');
          putenv('VF_PRIVATE_READ_TOKEN');
          echo "P01_V24711_UPDATE_RECOVERY_CONTRACT=PASS\n";
          ?>
          ''',encoding='utf-8')

          doc=root/'docs/release/V2.47.11_RELEASE_GATE.md'
          doc.write_text('''# P01 · VF Start V2.47.11 Release Gate\n\nStatus: CANDIDATE\n\n## Scope\n\n- Invalidate stale cached discovery state when the installed version is newer than the last cached target.\n- Classify GitHub 401/403 as a read-authorization fault instead of presenting a false up-to-date state.\n- Add an authenticated admin-only Update Authorization page for the existing `VF_PRIVATE_READ_TOKEN` capability.\n- Managed authorization is stored only under the private runtime root with restrictive permissions; the value is never returned by status APIs.\n- `VF_RELEASE_WRITE_TOKEN` remains forbidden in Production.\n- Schema remains `2026090401`; migration: NONE.\n\n## Required Gates\n\n- INSTALL: REQUIRED\n- SECURITY: REQUIRED\n- TESTING: REQUIRED\n- UPGRADE 2.47.10 -> 2.47.11: REQUIRED\n- DATA_SCHEMA: REQUIRED\n- GIT: REQUIRED\n- UA_UI: REQUIRED\n- Production: NOT_PROVEN until a real installed instance upgrades.\n\n## Boundaries\n\nThis release does not make private update assets public and does not create a new credential class, runner, repository, or distribution authority.\n''',encoding='utf-8')
          PY
          echo P01_V24711_PATCH_APPLIED=PASS

      - name: Focused static and unit gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          for f in src/app/UpdateCredentialStore.php src/update-credential.php src/app/UpdateManager.php src/update.php tests/unit/update_recovery_v24711_contract.php; do php -l "$f"; done
          php tests/unit/update_recovery_v24711_contract.php
          test "$(tr -d '\r\n ' < VERSION)" = 2.47.11
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = 2.47.11
          grep -Fq "define('VF_VERSION','2.47.11');" src/app/bootstrap.php
          grep -Fq "Schema remains \`2026090401\`; migration: NONE." docs/release/V2.47.11_RELEASE_GATE.md
          ! git diff --name-only HEAD | grep -Eq '(^|/)(migrations|schema)(/|$)'
          echo P01_V24711_FOCUSED_GATE=PASS

      - name: Commit exact product candidate patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          git config user.name 'VF Development Bot'
          git config user.email 'vf-development@users.noreply.github.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php src/app/UpdateManager.php src/app/UpdateCredentialStore.php src/update-credential.php src/update.php src/assets/update-core.js tests/unit/update_recovery_v24711_contract.php docs/release/V2.47.11_RELEASE_GATE.md
          git diff --cached --check
          git commit -m 'fix(update): recover stale state and private read authorization'
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo P01_V24711_PRODUCT_PUSH=PASS

      - name: Final patch verdict
        run: |
          echo P01_V24711_PATCH_GATE=PASS
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start
