name: P08 R20 CloudPanel hyphen database real first install from FULL (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r20-cloudpanel-hyphen-full-once.yml'
permissions:
  contents: read
jobs:
  hyphen-full:
    name: P08 exact FULL install ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mariadb
            image: mariadb:11.8
          - engine: mysql
            image: mysql:8.4
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="if command -v mariadb-admin >/dev/null; then mariadb-admin ping --silent; else mysqladmin ping --silent; fi"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.engine }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
      P08_EXACT_SOURCE_SHA: 7fd6e072cde7fb861d50b1d2c74be42c2fac1d65
    steps:
      - name: Temporary checkout of exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 7fd6e072cde7fb861d50b1d2c74be42c2fac1d65
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Verify source identity, runtime and test input names
        run: |
          set -euo pipefail
          test "$(git -C private-product rev-parse HEAD)" = "$P08_EXACT_SOURCE_SHA"
          test "$(cat private-product/VERSION)" = "0.1.0"
          test ! -e private-product/.env
          grep -Fq "'p08_ci_kewaro-adops'" private-product/tests/test_install_cloudpanel_hyphen_e2e.php
          echo "P08_R20_TESTED_SOURCE=$P08_EXACT_SOURCE_SHA"
      - name: PHP and pinned Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Node for compiled frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and extract real sealed Clean FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r20-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r20-npm.log" 2>&1
          npm run build
          npm run typecheck
          php -l src/Installation/SetupGuard.php
          php -l src/Installation/OwnerWebInstaller.php
          php -l tests/test_install_cloudpanel_hyphen_e2e.php
          php tests/test_setup_guard.php
          python3 scripts/check_stack_contract.py --phase full
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/P08-0.1.0-CloudPanel-Hyphen-FULL-TRIAL.zip" --version 0.1.0 --source-sha "$P08_EXACT_SOURCE_SHA"
          mkdir "$RUNNER_TEMP/p08-r20-extracted"
          unzip -qq "$RUNNER_TEMP/P08-0.1.0-CloudPanel-Hyphen-FULL-TRIAL.zip" -d "$RUNNER_TEMP/p08-r20-extracted"
          test -f "$RUNNER_TEMP/p08-r20-extracted/CLOUDPANEL_INSTALL.txt"
          test ! -e "$RUNNER_TEMP/p08-r20-extracted/.env"
          echo "P08_R20_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/P08-0.1.0-CloudPanel-Hyphen-FULL-TRIAL.zip" | awk '{print $1}')"
          echo "P08_R20_FULL_BYTES=$(stat -c%s "$RUNNER_TEMP/P08-0.1.0-CloudPanel-Hyphen-FULL-TRIAL.zip")"
      - name: Install Owner into synthetic hyphenated local SQL database and user FROM extracted FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          php tests/test_install_cloudpanel_hyphen_e2e.php "$RUNNER_TEMP/p08-r20-extracted"
          echo P08_R20_HYPHEN_REAL_EXTRACTED_FULL_PASS=YES
      - name: Erase temporary private source and synthetic installed runtime
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r20-extracted"
          rm -f "$RUNNER_TEMP/P08-0.1.0-CloudPanel-Hyphen-FULL-TRIAL.zip" "$RUNNER_TEMP/p08-r20-composer.log" "$RUNNER_TEMP/p08-r20-npm.log"
