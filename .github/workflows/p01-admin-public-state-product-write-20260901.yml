name: P01 Admin Public State Product Write
on:
  push:
    branches: [temp/p01-admin-public-state-clarity-20260901]
    paths: [.github/workflows/p01-admin-public-state-product-write-20260901.yml]
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-admin-public-state-clarity-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-base guarded Product edit
        shell: bash
        env:
          EXPECTED_BASE: 5ee91a4e0c2ce66a5c22850ae09b1bd6c7cd8081
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git -C product status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('product')
          def replace(path, old, new, count=1):
              p=root/path
              s=p.read_text()
              if s.count(old) != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, got {s.count(old)}')
              p.write_text(s.replace(old,new,count))
          def append_once(path, marker, text):
              p=root/path; s=p.read_text()
              if marker not in s: p.write_text(s.rstrip()+"\n\n"+text.strip()+"\n")

          # 1) Functional preview helpers and route persistence.
          old="""function vf_fw_scope(bool $admin): string
          {
              if (!$admin) return 'public';
              $scope = strtolower(trim((string)($_GET['scope'] ?? 'all')));
              return in_array($scope, ['all', 'public', 'private'], true) ? $scope : 'all';
          }
          """
          new="""function vf_fw_public_preview_requested(): bool
          {
              return vf_is_admin() && (string)($_GET['public_view'] ?? '') === '1';
          }

          function vf_fw_preview_return_key(string $fallback = 'home'): string
          {
              $allowed = ['home','all','start','channels','watch','topics'];
              $raw = strtolower(trim((string)($_GET['preview_return'] ?? '')));
              if (in_array($raw, $allowed, true)) return $raw;
              return in_array($fallback, $allowed, true) ? $fallback : 'home';
          }

          function vf_fw_route_for_key(string $key): string
          {
              return match ($key) {
                  'all' => 'surfaces.php',
                  'start' => 'start.php',
                  'channels' => 'channels.php',
                  'watch' => 'watch.php',
                  'topics' => 'topics.php',
                  default => 'home.php',
              };
          }

          function vf_fw_preview_return_url(string $fallback = 'home'): string
          {
              return vf_fw_route_for_key(vf_fw_preview_return_key($fallback));
          }

          function vf_fw_public_preview_url(string $mode, ?string $returnKey = null): string
          {
              $return = $returnKey ?? $mode;
              $allowed = ['home','all','start','channels','watch','topics'];
              if (!in_array($return, $allowed, true)) $return = 'home';
              $target = $mode === 'home' ? 'start' : $mode;
              if (!in_array($target, ['all','start','channels','watch','topics'], true)) $target = 'start';
              return vf_fw_route_for_key($target) . '?' . http_build_query(['public_view'=>'1','preview_return'=>$return]);
          }

          function vf_fw_login_url(string $mode): string
          {
              $target = $mode === 'home' ? 'start' : $mode;
              if (!in_array($target, ['all','start','channels','watch','topics'], true)) $target = 'start';
              return 'index.php?login=1&next=' . rawurlencode(vf_fw_route_for_key($target));
          }

          function vf_fw_scope(bool $admin): string
          {
              if (!$admin) return 'public';
              $scope = strtolower(trim((string)($_GET['scope'] ?? 'all')));
              return in_array($scope, ['all', 'public', 'private'], true) ? $scope : 'all';
          }
          """
          replace('src/app/FunctionalWorkspaceCore.php',old,new)
          replace('src/app/FunctionalWorkspaceCore.php',"""    $params = $_GET;
              unset($params['page'], $params['classic']);
          ""","""    $params = $_GET;
              unset($params['page'], $params['classic']);
              if (!vf_fw_public_preview_requested()) unset($params['public_view'], $params['preview_return']);
          """)
          replace('src/app/FunctionalWorkspaceCore.php',"""    foreach ($extra as $key => $value) {
                  if ($value !== null && $value !== '') $params[$key] = $value;
              }
              $query = http_build_query($params);
          ""","""    foreach ($extra as $key => $value) {
                  if ($value !== null && $value !== '') $params[$key] = $value;
              }
              if (vf_fw_public_preview_requested()) {
                  $params['public_view'] = '1';
                  $params['preview_return'] = vf_fw_preview_return_key($mode);
              }
              $query = http_build_query($params);
          """)

          # 2) Shared Functional shell: explicit state + real public-preview/login actions.
          old="""function vf_fw_render_global_domain_nav(string $mode, bool $admin, string $scope): void
          {
              $items = [
                  ['home', '首页'],
                  ['start', '导航'],
                  ['channels', '频道'],
                  ['watch', '影视'],
                  ['topics', '专题'],
              ];
              ?>
          <nav class=\"vf-global-domain-nav\" aria-label=\"VF Start 资源域\">
            <div class=\"vf-global-domain-nav-inner\">
              <?php foreach($items as [$key,$label]):
                  $href = $key === 'home' ? 'home.php' : vf_fw_route_link($key, $admin ? $scope : 'public', 0);
              ?><a class=\"<?=$mode===$key?'active':''?>\" href=\"<?=$href?>\" aria-current=\"<?=$mode===$key?'page':'false'?>\"><?=vf_fw_h($label)?></a><?php endforeach; ?>
            </div>
          </nav>
          <?php
          }
          """
          new="""function vf_fw_render_global_domain_nav(string $mode, bool $admin, string $scope): void
          {
              $items = [
                  ['home', '首页'],
                  ['start', '导航'],
                  ['channels', '频道'],
                  ['watch', '影视'],
                  ['topics', '专题'],
              ];
              $preview = vf_fw_public_preview_requested();
              $returnKey = vf_fw_preview_return_key($mode === 'home' ? 'home' : $mode);
              if ($preview) {
                  $stateLabel = '公开视角';
                  $stateAction = '返回管理';
                  $stateHref = vf_fw_preview_return_url($mode);
              } elseif ($admin) {
                  $stateLabel = '管理员视角';
                  $stateAction = '查看公开版';
                  $stateHref = vf_fw_public_preview_url($mode, $mode === 'home' ? 'home' : $mode);
              } else {
                  $stateLabel = '公开视角';
                  $stateAction = '登录';
                  $stateHref = vf_fw_login_url($mode);
              }
              ?>
          <nav class=\"vf-global-domain-nav\" aria-label=\"VF Start 资源域\">
            <div class=\"vf-global-domain-nav-inner\">
              <?php foreach($items as [$key,$label]):
                  if ($key === 'home') {
                      $href = $preview ? vf_fw_public_preview_url('home', $returnKey) : ($admin ? 'home.php' : 'start.php');
                  } else {
                      $href = vf_fw_route_link($key, $admin ? $scope : 'public', 0);
                  }
              ?><a class=\"<?=$mode===$key?'active':''?>\" href=\"<?=$href?>\" aria-current=\"<?=$mode===$key?'page':'false'?>\"><?=vf_fw_h($label)?></a><?php endforeach; ?>
              <span class=\"vf-global-view-state<?= $preview ? ' is-preview' : ($admin ? ' is-admin' : ' is-public') ?>\" data-vf-view-state>
                <b><?=vf_fw_h($stateLabel)?></b><a href=\"<?=vf_fw_h($stateHref)?>\" data-vf-view-action><?=vf_fw_h($stateAction)?></a>
              </span>
            </div>
          </nav>
          <?php
          }
          """
          replace('src/app/FunctionalWorkspaceShell.php',old,new)

          # 3) Functional Workspace reads through anonymous authority while previewing.
          replace('src/app/FunctionalWorkspace.php',"""    $mode=vf_fw_mode();$admin=vf_is_admin();$scope=vf_fw_scope($admin);$db=vf_db();$baseRepo=new VfRepository($db);$surfaceRepo=new VfSurfaceRepository($db);$base=$baseRepo->bootstrap($admin);$categories=(array)$base['categories'];$allAssets=$surfaceRepo->allAssets($admin);
          ""","""    $mode=vf_fw_mode();$actualAdmin=vf_is_admin();$publicPreview=vf_fw_public_preview_requested();$admin=$actualAdmin&&!$publicPreview;$scope=vf_fw_scope($admin);$db=vf_db();$baseRepo=new VfRepository($db);$surfaceRepo=new VfSurfaceRepository($db);$base=$baseRepo->bootstrap($admin);$categories=(array)$base['categories'];$allAssets=$surfaceRepo->allAssets($admin);
          """)
          replace('src/app/FunctionalWorkspace.php',"""</head><body class=\"vf-surface-app vf-workspace-page vf-functional-workspace surface-<?=vf_fw_h($mode)?>\" data-vf-scope=\"<?=vf_fw_h($scope)?>\" data-vf-mode=\"<?=vf_fw_h($mode)?>\">
          ""","""</head><body class=\"vf-surface-app vf-workspace-page vf-functional-workspace surface-<?=vf_fw_h($mode)?>\" data-vf-scope=\"<?=vf_fw_h($scope)?>\" data-vf-mode=\"<?=vf_fw_h($mode)?>\" data-vf-public-preview=\"<?=$publicPreview?'1':'0'?>\">
          """)

          # 4) Start sends an authenticated preview into the real public navigator.
          replace('src/start.php',"""if (!vf_is_admin() || (string)($_GET['classic'] ?? '') === '1') {
          ""","""$publicPreview = vf_is_admin() && (string)($_GET['public_view'] ?? '') === '1';
          if (!vf_is_admin() || (string)($_GET['classic'] ?? '') === '1' || $publicPreview) {
          """)

          # 5) API bootstrap: preview is an anonymous read contract, not a logout.
          replace('src/api.php',"""        case 'bootstrap':
                      $admin = vf_is_admin();
                      $payload = $repo->bootstrap($admin);
          ""","""        case 'bootstrap':
                      $actualAdmin = vf_is_admin();
                      $publicPreview = $actualAdmin && (string)($_GET['public_view'] ?? '') === '1';
                      $admin = $actualAdmin && !$publicPreview;
                      $payload = $repo->bootstrap($admin);
          """)
          replace('src/api.php',"""                    'auth' => $admin,
                      'branding' => $repo->getBranding(),
          ""","""                    'auth' => $admin,
                      'publicPreview' => $publicPreview,
                      'branding' => $repo->getBranding(),
          """)

          # 6) Legacy public navigator: true preview + explicit state + safe login return.
          replace('src/index.php',"""if (vf_is_admin() && !defined('VF_START_CLASSIC_ENTRY')) {
              header('Location: home.php', true, 302);
              exit;
          }
          ""","""$actualAdmin = vf_is_admin();
          $publicPreview = $actualAdmin && (string)($_GET['public_view'] ?? '') === '1';
          if ($actualAdmin && !$publicPreview && !defined('VF_START_CLASSIC_ENTRY')) {
              header('Location: home.php', true, 302);
              exit;
          }
          """)
          replace('src/index.php',"""$isAdminView = vf_is_admin();
          $pluginHomeSummaries = [];
          ""","""$isAdminView = $actualAdmin && !$publicPreview;
          $previewReturnKey = strtolower(trim((string)($_GET['preview_return'] ?? 'home')));
          $previewReturnRoutes = ['home'=>'home.php','all'=>'surfaces.php','start'=>'start.php','channels'=>'channels.php','watch'=>'watch.php','topics'=>'topics.php'];
          if (!isset($previewReturnRoutes[$previewReturnKey])) $previewReturnKey = 'home';
          $previewReturnHref = $previewReturnRoutes[$previewReturnKey];
          $loginPrompt = (string)($_GET['login'] ?? '') === '1';
          $loginNext = trim((string)($_GET['next'] ?? ''));
          $allowedLoginNext = ['home.php','start.php','surfaces.php','channels.php','watch.php','topics.php'];
          if (!in_array($loginNext, $allowedLoginNext, true)) $loginNext = '';
          $pluginHomeSummaries = [];
          """)
          replace('src/index.php',"""$seoEnabled = !$isAdminView && !empty($settingsForSeo['seoEnabled']);
          ""","""$seoEnabled = !$actualAdmin && !$loginPrompt && !empty($settingsForSeo['seoEnabled']);
          """)
          replace('src/index.php',"""if ($isAdminView) {
              header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
              header('Pragma: no-cache');
              header('X-Robots-Tag: noindex, nofollow, noarchive');
          } else {
              header('Cache-Control: public, max-age=120, stale-while-revalidate=300');
          }
          ""","""if ($isAdminView || $publicPreview || $loginPrompt) {
              header('Cache-Control: no-store, no-cache, must-revalidate, max-age=0');
              header('Pragma: no-cache');
              header('X-Robots-Tag: noindex, nofollow, noarchive');
          } else {
              header('Cache-Control: public, max-age=120, stale-while-revalidate=300');
          }
          """)
          replace('src/index.php',"""<body>
          ""","""<body data-vf-public-preview=\"<?=$publicPreview?'1':'0'?>\" data-vf-preview-return-href=\"<?=htmlspecialchars($previewReturnHref,ENT_QUOTES,'UTF-8')?>\" data-vf-login-prompt=\"<?=$loginPrompt?'1':'0'?>\" data-vf-login-next=\"<?=htmlspecialchars($loginNext,ENT_QUOTES,'UTF-8')?>\">
          """)
          replace('src/index.php',"""        <button id=\"themeButton\" class=\"icon-btn\" aria-label=\"切换明暗模式\" title=\"切换明暗模式\">
          ""","""        <span id=\"viewState\" class=\"vf-view-state\" data-vf-view-state aria-live=\"polite\"></span>
                  <button id=\"themeButton\" class=\"icon-btn\" aria-label=\"切换明暗模式\" title=\"切换明暗模式\">
          """)
          replace('src/index.php',"""  var response = await fetch('/api.php?action=' + encodeURIComponent(action), request);
          ""","""  var endpoint = '/api.php?action=' + encodeURIComponent(action);
              if (action === 'bootstrap' && document.body.dataset.vfPublicPreview === '1') endpoint += '&public_view=1';
              var response = await fetch(endpoint, request);
          """)
          replace('src/index.php',"""function renderHeader() {
              var auth=!!(state.site&&state.site.auth),branding=(state.site&&state.site.branding)||{},mark=$('#brandMark'),copy=$('#brandCopy');
          ""","""function renderHeader() {
              var auth=!!(state.site&&state.site.auth),preview=!!(state.site&&state.site.publicPreview),branding=(state.site&&state.site.branding)||{},mark=$('#brandMark'),copy=$('#brandCopy');
          """)
          replace('src/index.php',"""  $('#loginButton').innerHTML=icon(auth?'logout':'login',15)+'<span>'+(auth?'退出':'登录')+'</span>';
              $$('.admin-only').forEach(function(node){if(node.id==='globalUpdateButton'){if(!auth)node.classList.add('hidden');return;}node.classList.toggle('hidden',!auth);});document.body.classList.toggle('is-admin',auth);
          ""","""  var stateNode=$('#viewState');if(stateNode){stateNode.textContent=preview?'公开视角':(auth?'管理员视角':'公开视角');stateNode.classList.toggle('is-admin',auth);stateNode.classList.toggle('is-preview',preview);}
              $('#loginButton').innerHTML=preview?(icon('arrowleft',15)+'<span>返回管理</span>'):(icon(auth?'logout':'login',15)+'<span>'+(auth?'退出':'登录')+'</span>');
              $$('.admin-only').forEach(function(node){if(node.id==='globalUpdateButton'){if(!auth)node.classList.add('hidden');return;}node.classList.toggle('hidden',!auth);});document.body.classList.toggle('is-admin',auth);document.body.classList.toggle('is-public-preview',preview);
          """)
          replace('src/index.php',"""  var submit=async function(){var password=$('[name=password]',root).value;try{await api('login',{method:'POST',body:{password:password},csrf:false});(root.closeModal?root.closeModal():(root.remove(),syncOverlayLock()));await load(false);toast('已进入管理模式');}catch(error){toast(error.message,'error');}};
          ""","""  var submit=async function(){var password=$('[name=password]',root).value;try{await api('login',{method:'POST',body:{password:password},csrf:false});(root.closeModal?root.closeModal():(root.remove(),syncOverlayLock()));var next=document.body.dataset.vfLoginNext||'';if(next){location.href=next;return;}await load(false);toast('已进入管理模式');}catch(error){toast(error.message,'error');}};
          """)
          replace('src/index.php',"""  $('#loginButton').addEventListener('click',async function(){if(state.site&&state.site.auth){if(!window.confirm('退出管理模式？'))return;try{await api('logout',{method:'POST',body:{}});state.mode='home';state.selected=0;history.pushState(null,'','#/');await load(false,{preserveScroll:false});toast('已退出管理模式');}catch(error){toast(error.message,'error');}}else openLogin();});
          ""","""  $('#loginButton').addEventListener('click',async function(){if(state.site&&state.site.publicPreview){location.href=document.body.dataset.vfPreviewReturnHref||'home.php';return;}if(state.site&&state.site.auth){if(!window.confirm('退出管理模式？'))return;try{await api('logout',{method:'POST',body:{}});state.mode='home';state.selected=0;history.pushState(null,'','#/');await load(false,{preserveScroll:false});toast('已退出管理模式');}catch(error){toast(error.message,'error');}}else openLogin();});
          """)
          replace('src/index.php',"""  $('#mobileCategories').addEventListener('click',openSidebar);$('#mobileSearch').addEventListener('click',openPalette);$('#mobileAccount').addEventListener('click',function(){if(state.site&&state.site.auth){location.href='manage.php';return;}openLogin();});
          ""","""  $('#mobileCategories').addEventListener('click',openSidebar);$('#mobileSearch').addEventListener('click',openPalette);$('#mobileAccount').addEventListener('click',function(){if(state.site&&state.site.publicPreview){location.href=document.body.dataset.vfPreviewReturnHref||'home.php';return;}if(state.site&&state.site.auth){location.href='manage.php';return;}openLogin();});
          """)
          replace('src/index.php',"""(function start(){var saved=vfStorage.getItem('vfnav-theme'),dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',saved||(dark?'dark':'light'));initEvents();load(true).catch(function(error){showBootError(error);toast(error.message,'error');});})();
          ""","""(function start(){var saved=vfStorage.getItem('vfnav-theme'),dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',saved||(dark?'dark':'light'));initEvents();load(true).then(function(){if(document.body.dataset.vfLoginPrompt==='1'&&!(state.site&&state.site.auth)&&!(state.site&&state.site.publicPreview))openLogin();}).catch(function(error){showBootError(error);toast(error.message,'error');});})();
          """)

          # 7) Shared state-control styles: compact and visible at both 390 / desktop.
          append_once('src/assets/workspace-domain-nav.css','P01 L2 · explicit admin/public view state · 2026-09-01',"""
          /* P01 L2 · explicit admin/public view state · 2026-09-01 */
          .vf-global-view-state{margin-left:auto;padding-left:8px;display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;min-width:max-content;background:color-mix(in srgb,var(--ws-panel) 96%,transparent)}
          .vf-global-view-state>b{display:inline-flex;align-items:center;gap:5px;color:var(--ws-muted);font-size:11px;font-weight:700;white-space:nowrap}
          .vf-global-view-state>b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ws-teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--ws-teal) 10%,transparent)}
          .vf-global-domain-nav .vf-global-view-state>a{min-height:28px;padding:0 8px;border:1px solid var(--ws-line);border-radius:6px;background:var(--ws-panel);color:var(--ws-text);font-size:11px;font-weight:650}
          .vf-global-domain-nav .vf-global-view-state>a:hover{border-color:var(--ws-line-strong);background:var(--ws-soft);color:var(--ws-teal)}
          .vf-global-view-state.is-preview>b{color:var(--ws-teal)}
          @media(max-width:760px){
            .vf-global-view-state{margin-left:3px;padding-left:4px;gap:4px}
            .vf-global-view-state>b{font-size:10.5px}
            .vf-global-domain-nav .vf-global-view-state>a{min-height:40px;padding:0 7px;border-top:0;border-bottom:0;border-radius:0;font-size:10.5px}
          }
          """)
          append_once('src/assets/frontend.css','P01 L2 explicit public/admin view state · 2026-09-01',"""
          /* P01 L2 explicit public/admin view state · 2026-09-01 */
          .vf-view-state{height:28px;padding:0 8px;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line,#d9e1e5);border-radius:999px;background:var(--surface,#fff);color:var(--muted,#667085);font-size:11px;font-weight:700;white-space:nowrap}
          .vf-view-state::before{content:"";width:6px;height:6px;border-radius:50%;background:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.09)}
          .vf-view-state.is-admin{color:#0f766e}
          .vf-view-state.is-preview{border-color:rgba(15,118,110,.28);background:rgba(15,118,110,.06);color:#0f766e}
          @media(max-width:760px){
            .top-actions .vf-view-state{height:32px;padding:0 7px;font-size:10.5px}
          }
          """)
          PY
          for f in product/src/app/FunctionalWorkspaceCore.php product/src/app/FunctionalWorkspaceShell.php product/src/app/FunctionalWorkspace.php product/src/start.php product/src/index.php product/src/api.php; do php -l "$f"; done
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
