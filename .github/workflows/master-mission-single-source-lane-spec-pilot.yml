name: Master Mission Single Source Lane Spec Pilot

on:
  push:
    branches:
      - work/master-mission-single-source-lane-spec-20260919
    paths:
      - '.github/workflows/master-mission-single-source-lane-spec-pilot.yml'
      - 'scripts/ephemeral_lane_spec.py'
      - 'tests/test_ephemeral_lane_spec.py'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Unit regression
        run: python3 -m unittest tests.test_ephemeral_lane_spec -v

      - name: Build and validate one P02 lane spec
        id: lane
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p02-lane.json <<'JSON'
          {
            "schema": "vf-ephemeral-lane-spec/v1",
            "lane_id": "p02-v2539-post-release-proof",
            "project_id": "P02",
            "repository": "llhzx2018/vf-library",
            "target_version": "2.5.39",
            "target_sha": "65a988761b9f398b7031ea889c51a8a054844099",
            "target_tree": "ebb9cbd935157860efbee41601d737dd965a70ba",
            "source_versions": ["2.5.35", "2.5.36", "2.5.37", "2.5.38"],
            "schema_version": "2401",
            "candidate_run": "35440232231",
            "previous_lane": {
              "target_version": "2.5.38",
              "target_sha": "8bf8471bc3e33613f26d0eddc0dfe11ab1ba9895",
              "target_tree": "ea2f9a563cddc333ca3cfbcebc32313adfbdbf8c"
            }
          }
          JSON
          python3 scripts/ephemeral_lane_spec.py validate --spec /tmp/p02-lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec /tmp/p02-lane.json >> "$GITHUB_OUTPUT"
          echo SINGLE_SOURCE_LANE_SPEC_VALIDATE=PASS

      - name: Checkout exact private P02 source from spec outputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.lane.outputs.repository }}
          ref: ${{ steps.lane.outputs.target_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Verify spec-bound exact source
        shell: bash
        env:
          TARGET_SHA: ${{ steps.lane.outputs.target_sha }}
          TARGET_VERSION: ${{ steps.lane.outputs.target_version }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "$TARGET_VERSION"
          echo SINGLE_SOURCE_P02_EXACT_CHECKOUT=PASS
