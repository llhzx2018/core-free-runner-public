name: TEMP S01-C03 Identity Reconciliation Gate

on:
  push:
    branches:
      - temp/s01-c02-owner-wordpress-runtime-gate-20260901

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-identity-reconciliation-gate
  cancel-in-progress: true

jobs:
  identity-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      C03_SHA: a12bf9975008217f145800722c5e0072fc11af6c
      PACKAGE_BEFORE_BLOB: 65c3e359e5d4051dbc06fbf92044b3fa85e3a76e
      MANIFEST_BEFORE_BLOB: 270ef7a9038577338e6c30af524f6b0e6162a386
      EVIDENCE_DIR: /tmp/s01-c03-identity-evidence

    steps:
      - name: Checkout exact C03 identity contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a12bf9975008217f145800722c5e0072fc11af6c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: c03

      - name: Verify exact pre-patch blobs and executable identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd c03
          test "$(git rev-parse HEAD)" = "$C03_SHA"
          test "$(git rev-parse HEAD:src/PACKAGE_PROFILE.json)" = "$PACKAGE_BEFORE_BLOB"
          test "$(git rev-parse HEAD:src/plugin-manifest.json)" = "$MANIFEST_BEFORE_BLOB"
          test "$(cat VERSION)" = "1.25.3"
          grep -Fq ' * Version: 1.25.3' src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_VERSION', '1.25.3')" src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_ROUND', 'R227')" src/vf-tool-m3u8.php
          test -z "$(git status --porcelain)"
          echo 'PREPATCH_IDENTITY=PASS'

      - name: Apply exact byte-preserving identity contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd c03
          python3 scripts/reconcile-identity-1.25.3.py | tee /tmp/identity-script-result.json

      - name: Enforce exact two-file six-field diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cd c03
          git diff --check
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          wanted_files = [
              'src/PACKAGE_PROFILE.json',
              'src/plugin-manifest.json',
          ]
          names = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          if names != wanted_files:
              raise SystemExit(f'FAIL changed files: {names!r}')

          numstat = subprocess.check_output(['git','diff','--numstat'], text=True).splitlines()
          if numstat != [
              '3\t3\tsrc/PACKAGE_PROFILE.json',
              '3\t3\tsrc/plugin-manifest.json',
          ]:
              raise SystemExit(f'FAIL numstat: {numstat!r}')

          patch = subprocess.check_output(['git','diff','--unified=0','--','src/PACKAGE_PROFILE.json','src/plugin-manifest.json'], text=True)
          removed, added = [], []
          for line in patch.splitlines():
              if line.startswith('---') or line.startswith('+++'):
                  continue
              if line.startswith('-'):
                  removed.append(line[1:])
              elif line.startswith('+'):
                  added.append(line[1:])

          wanted_removed = sorted([
              '  "pluginVersion": "1.25.2",',
              '  "version": "1.25.2",',
              '  "round": "R226",',
              '  "version": "1.25.2",',
              '  "round": "R226",',
              '  "pluginVersion": "1.25.2",',
          ])
          wanted_added = sorted([
              '  "pluginVersion": "1.25.3",',
              '  "version": "1.25.3",',
              '  "round": "R227",',
              '  "version": "1.25.3",',
              '  "round": "R227",',
              '  "pluginVersion": "1.25.3",',
          ])
          if sorted(removed) != wanted_removed:
              raise SystemExit(f'FAIL removed lines: {removed!r}')
          if sorted(added) != wanted_added:
              raise SystemExit(f'FAIL added lines: {added!r}')

          package = json.loads(Path('src/PACKAGE_PROFILE.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('src/plugin-manifest.json').read_text(encoding='utf-8'))
          identity = {
              'package.pluginVersion': package.get('pluginVersion'),
              'package.version': package.get('version'),
              'package.round': package.get('round'),
              'manifest.version': manifest.get('version'),
              'manifest.round': manifest.get('round'),
              'manifest.pluginVersion': manifest.get('pluginVersion'),
          }
          wanted_identity = {
              'package.pluginVersion': '1.25.3',
              'package.version': '1.25.3',
              'package.round': 'R227',
              'manifest.version': '1.25.3',
              'manifest.round': 'R227',
              'manifest.pluginVersion': '1.25.3',
          }
          if identity != wanted_identity:
              raise SystemExit(f'FAIL identity readback: {identity!r}')

          package_after_blob = subprocess.check_output(['git','hash-object','src/PACKAGE_PROFILE.json'], text=True).strip()
          manifest_after_blob = subprocess.check_output(['git','hash-object','src/plugin-manifest.json'], text=True).strip()
          payload = {
              'schema': 's01-c03-identity-reconciliation-gate/v1',
              'status': 'PASS',
              'sourceCommit': os.environ['C03_SHA'],
              'beforeBlobs': {
                  'packageProfile': os.environ['PACKAGE_BEFORE_BLOB'],
                  'pluginManifest': os.environ['MANIFEST_BEFORE_BLOB'],
              },
              'afterBlobs': {
                  'packageProfile': package_after_blob,
                  'pluginManifest': manifest_after_blob,
              },
              'changedFiles': names,
              'numstat': numstat,
              'removedIdentityLines': len(removed),
              'addedIdentityLines': len(added),
              'identity': identity,
              'privateSourcePersistedAsArtifact': False,
              'sourceWritebackPerformed': False,
              'releaseTagProductionTouched': False,
          }
          canonical = json.dumps(payload, sort_keys=True).encode()
          payload['sha256'] = hashlib.sha256(canonical).hexdigest()
          out = Path(os.environ['EVIDENCE_DIR']) / 'identity-gate-summary.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8')
          print('IDENTITY_RECONCILIATION_GATE=PASS')
          print('PACKAGE_AFTER_BLOB=' + package_after_blob)
          print('MANIFEST_AFTER_BLOB=' + manifest_after_blob)
          print('EVIDENCE_SHA256=' + payload['sha256'])
          PY

      - name: Upload public-safe identity gate summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c03-identity-reconciliation-${{ github.run_id }}
          path: /tmp/s01-c03-identity-evidence/identity-gate-summary.json
          if-no-files-found: warn
          retention-days: 14
