name: P04 V2.5.3 Hotfix Build Verify V4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-hotfix-build-verify-v4.yml'

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","sqlite3","curl","openssl","json","sodium"] as $x)if(!extension_loaded($x))exit(2);if(!class_exists("ZipArchive"))exit(3);echo "RUNTIME_GATE=PASS\n";'
      - name: Execute V2.5.3 hotfix with dynamic HTTP port
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          cp runner-tools/ops/p04/v253_hotfix_execute.sh "$RUNNER_TEMP/v253-exec.sh"
          python3 - "$RUNNER_TEMP/v253-exec.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old="PORT=18523; PASS='P04V253HotfixTest!'"
          new="PORT=$(python3 -c 'import socket;s=socket.socket();s.bind((\"127.0.0.1\",0));print(s.getsockname()[1]);s.close()'); PASS='P04V253HotfixTest!'"
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old="php -S 127.0.0.1:$PORT -t \"$SITE\" >\"$WORK/http.log\" 2>&1 & PID=$!\ntrap 'kill $PID 2>/dev/null || true; rm -rf \"$WORK\"' EXIT"
          new=old+"\nsleep .5\nif ! kill -0 $PID 2>/dev/null; then echo 'PHP_TEST_SERVER_START=FAIL'; cat \"$WORK/http.log\"; exit 1; fi\necho \"PHP_TEST_SERVER_START=PASS PORT=$PORT\""
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          bash "$RUNNER_TEMP/v253-exec.sh"
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools "$RUNNER_TEMP/v253-exec.sh"
