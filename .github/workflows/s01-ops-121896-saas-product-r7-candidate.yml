name: S01 Ops 1.21.896 SaaS Product R7 Candidate Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 6e51de97eedd62bccc26eabf956570c29ae9adad
      BASE_SHA: 38a4d71647950774863e675c4316c9e166c18a9c
      VERSION: 1.21.896
      PREVIOUS_TAG: v1.21.895
      PREVIOUS_ASSET: vf-tools-ops_V1.21.895.zip
      ASSET: vf-tools-ops_V1.21.896.zip

    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 6e51de97eedd62bccc26eabf956570c29ae9adad
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Identity scope and product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.896' ops/vf-ops.php
          grep -Fq 'S01-SAAS-PRODUCT-R7' ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md VERSION             assets/css/current/admin-s01-saas-product-r7.css             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121896-saas-product-r7-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update | wc -l)" = "0"
          php ops/tests/s01-c02-121896-saas-product-r7-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/assets/css/current/admin-s01-saas-product-r7.css
          echo PASS_IDENTITY_SCOPE_PRODUCT_CONTRACT

      - name: Build deterministic runtime-only package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); stage=Path('stage/vf-ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel in ('vf-ops.php','uninstall.php')
              return re.match(r'^(?:includes|assets|languages|config)/',rel) is not None
          files=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()),key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel):continue
              if p.is_symlink():raise SystemExit('runtime symlink forbidden: '+rel)
              data=p.read_bytes(); files.append((rel,data))
              q=stage/rel; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(data)
          canonical=b''.join(rel.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for rel,data in files)
          Path('/tmp/runtime_count').write_text(str(len(files)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          for out in ('dist/vf-tools-ops_V1.21.896.zip','dist/rebuild-vf-tools-ops_V1.21.896.zip'):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      info=zipfile.ZipInfo('vf-ops/'+rel,date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF)<<16
                      z.writestr(info,data)
          print('RUNTIME_FILES='+str(len(files)))
          print('RUNTIME_FINGERPRINT='+hashlib.sha256(canonical).hexdigest())
          PY
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.896'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-saas-product-r7.css'
          test "$(cat /tmp/runtime_count)" = "967"
          sha256sum "dist/$ASSET" | awk '{print $1}' >/tmp/asset_sha
          stat -c '%s' "dist/$ASSET" >/tmp/asset_bytes
          echo PASS_PACKAGE

      - name: Previous release compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(stat -c '%s' "previous/$PREVIOUS_ASSET")" = "3450443"
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "7a029a4ab353fc565aac5bbd7b5d8a7e86321eb13e7cc5450fc1e2397702cf1b"
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sort >/tmp/prev.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sort >/tmp/new.txt
          comm -13 /tmp/prev.txt /tmp/new.txt >/tmp/added.txt
          comm -23 /tmp/prev.txt /tmp/new.txt >/tmp/removed.txt
          test "$(cat /tmp/added.txt)" = 'vf-ops/assets/css/current/admin-s01-saas-product-r7.css'
          test ! -s /tmp/removed.txt
          echo PASS_COMPAT

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > dist/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          PRIMARY_PROTOTYPE=VERCEL_2026_DASHBOARD
          TABLE_REFERENCE=CLOUDFLARE_2026_DNS_UX
          SCHEMA=6.0.0_TO_6.0.0
          DATA_MIGRATION=NONE
          SHARED_UPDATER=UNCHANGED
          RESULT=PASS
          EOF
          cat dist/candidate-receipt.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121896-saas-product-r7-candidate
          path: |
            dist/vf-tools-ops_V1.21.896.zip
            dist/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14
