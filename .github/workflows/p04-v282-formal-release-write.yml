name: P04 V2.8.2 Formal Release Write

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v282-formal-release-write.yml'
      - 'requests/p04-v282-formal-release-write.txt'

permissions:
  contents: read

env:
  SOURCE_SHA: 'b54643f7c8e7072fac922e2d7759ea5a9419cb70'
  FULL_BYTES: '569511'
  FULL_SHA: '60cdb86a83c6dacbda625a70a514054e10fc6e8129c38262b9e7d1f56966f3c1'
  UPDATE_BYTES: '1232225'
  UPDATE_SHA: 'b66f468b4e4108779e621f1f8e4291d54ece08add1d0545ec705502ff3e7ec81'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Preflight exact publication identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.2'
          test "$(gh api repos/llhzx2018/vf-infra/branches/main --jq .commit.sha)" = "$SOURCE_SHA"
          ! gh release view v2.8.2 --repo llhzx2018/vf-infra >/dev/null 2>&1
          ! gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.2 >/dev/null 2>&1
          echo 'P04_V282_RELEASE_WRITE_PREFLIGHT=PASS'

      - name: Rebuild exact Candidate assets
        shell: bash
        run: |
          set -Eeuo pipefail
          R="$RUNNER_TEMP/runtime"; O="$RUNNER_TEMP/update"
          python3 scripts/build-release-tree.py "$R"
          python3 - "$R" "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          python3 scripts/build-v282-update-release.py --target-runtime "$R" --output "$O"
          cp "$O/VF_Infra_V2.8.2_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          php "$O/repair-v2.8.2.php" --self-test | grep -F 'ATOMIC_SELF_TEST_PASS target=2.8.2 schema=14'
          echo 'P04_V282_RELEASE_WRITE_ASSET_EXACT=PASS'

      - name: Publish tag Release and assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create v2.8.2 \
            "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip#VF Infra V2.8.2 FULL" \
            "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip#VF Infra V2.8.2 UPDATE" \
            --repo llhzx2018/vf-infra \
            --target "$SOURCE_SHA" \
            --title 'VF Infra V2.8.2' \
            --notes-file docs/operations/package/RELEASE_NOTES.md
          echo 'P04_V282_GITHUB_RELEASE_CREATE=PASS'

      - name: Remote exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/readback" evidence
          gh release download v2.8.2 --repo llhzx2018/vf-infra --dir "$RUNNER_TEMP/readback" --pattern 'VF_Infra_V2.8.2_*.zip'
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.8.2 > evidence/release.json
          gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.2 > evidence/tag.json
          test "$(jq -r .object.sha evidence/tag.json)" = "$SOURCE_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.2_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$RUNNER_TEMP/readback/VF_Infra_V2.8.2_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.2_FULL.zip")|.size' evidence/release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.2_UPDATE.zip")|.size' evidence/release.json)" = "$UPDATE_BYTES"
          echo 'P04_V282_FORMAL_RELEASE_REMOTE_READBACK=PASS'
          echo "RELEASE_ID=$(jq -r .id evidence/release.json)"
          jq -r '.assets[]|"ASSET_ID="+(.id|tostring)+" NAME="+.name+" BYTES="+(.size|tostring)' evidence/release.json
          echo 'TAG_SOURCE='"$SOURCE_SHA"
          echo 'FULL_SHA256='"$FULL_SHA"
          echo 'UPDATE_SHA256='"$UPDATE_SHA"
          echo 'PRODUCTION_WRITE=0'

      - name: Upload formal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.2-FORMAL-RELEASE-WRITE-EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
