name: S01 Theme 1.35.20 Bump Gate
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-theme-13520-bump-gate-20260907.yml]
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-theme
      BRANCH: work/s01-update-center-id-closure-20260907
      BASE_SHA: 6c30935c613802847d138097c63c3f73219ec02a
      CANDIDATE_SHA: ca3080bb6a257aba9495fabad16ce161acddb0d8
    steps:
      - name: Bump exact Theme identity after UX gate
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          grep -RIl --exclude='CHANGELOG.md' --exclude='README.md' --exclude='GIT_IMPORT_MANIFEST' --exclude='SOURCE_MANIFEST' '1.35.19' VERSION src tests | sort > /tmp/actual_identity
          printf '%s\n' VERSION src/style.css tests/update-refresh-policy-contract.php tests/visible-console-v2-contract.php tests/workbench-primary-action-contract.php | sort > /tmp/expected_identity
          diff -u /tmp/expected_identity /tmp/actual_identity
          python3 - <<'PY'
          from pathlib import Path
          p=Path('VERSION'); assert p.read_text()=='1.35.19\n'; p.write_text('1.35.20\n')

          p=Path('src/style.css'); s=p.read_text(); assert s.count('1.35.19')==2; s=s.replace('1.35.19','1.35.20'); old='V1.35.20_S01_FINAL_ADMIN_HUMAN_CLOSURE'; assert s.count(old)==1; s=s.replace(old,'V1.35.20_S01_UPDATE_CENTER_ID_CLOSURE',1); p.write_text(s)

          for fn in ['tests/update-refresh-policy-contract.php','tests/visible-console-v2-contract.php','tests/workbench-primary-action-contract.php']:
              p=Path(fn); s=p.read_text(); assert '1.35.19' in s; s=s.replace('1.35.19','1.35.20'); old='V1.35.20_S01_FINAL_ADMIN_HUMAN_CLOSURE'; assert old in s; s=s.replace(old,'V1.35.20_S01_UPDATE_CENTER_ID_CLOSURE'); p.write_text(s)
          PY
          test "$(cat VERSION)" = '1.35.20'
          grep -F 'Version: 1.35.20' src/style.css >/dev/null
          grep -F 'V1.35.20_S01_UPDATE_CENTER_ID_CLOSURE' src/style.css >/dev/null
          if grep -RIl --exclude='CHANGELOG.md' --exclude='README.md' --exclude='GIT_IMPORT_MANIFEST' --exclude='SOURCE_MANIFEST' '1.35.19' VERSION src tests | grep -q .; then echo 'STALE_VERSION_IDENTITY'; exit 1; fi
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/update-center-human-language-contract.php
          php tests/update-refresh-policy-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          ! grep -F '<span class="vf-update-component__id">' src/inc/update/class-vf-wp-update-admin-v1.php
          grep -F 'id="component-<?php echo esc_attr($view['"'"'id'"'"']); ?>"' src/inc/update/class-vf-wp-update-admin-v1.php >/dev/null
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual
          printf '%s\n' \
            VERSION \
            src/assets/css/admin/admin-update-center.css \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            src/style.css \
            tests/update-center-human-language-contract.php \
            tests/update-refresh-policy-contract.php \
            tests/visible-console-v2-contract.php \
            tests/workbench-primary-action-contract.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/style.css tests/update-refresh-policy-contract.php tests/visible-console-v2-contract.php tests/workbench-primary-action-contract.php
          git commit -m 'chore(S01-C01): bump update center ID closure to 1.35.20'
          git push -q origin HEAD:"$BRANCH"
          echo "THEME_13520_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C01_13520_BUMP_GATE'
