name: P01 Topics Cover-first R3 (one-shot exact candidate)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-topics-cover-gallery-r3.yml'
permissions:
  contents: read
jobs:
  topics-gallery-exact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_SHA: 1315ef9d4dcb868d69a206e4ab97192544ee9a67
    steps:
      - name: Ensure private read authorization
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN" || { echo "BLOCKED_PRIVATE_READ"; exit 78; }
      - name: Checkout exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate
      - name: Checkout latest V2.47.436 formal stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.436
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: stable
      - name: Configure PHP for exact release comparators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-sqlite3 php-curl php-mbstring php-gd php-zip unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
      - name: Syntax and focused Topics gallery contracts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test "$(cat VERSION)" = '2.47.436'
          php -l src/app/TopicLibraryPage.php
          php -l tests/unit/topics_cover_first_gallery_r3_contract.php
          php tests/unit/topics_cover_first_gallery_r3_contract.php
          php tests/unit/topics_page_full_polish_contract.php
          php tests/unit/topics_v247153_editorial_reference_index_contract.php
          php tests/unit/topics_v247150_terminal_library_contract.php
          php tests/unit/topics_v247154_production_density_contract.php
          php tests/unit/topics_v247156_wide_two_column_index_contract.php
          php tests/unit/topics_v247174_cover_legibility_r1_contract.php
          echo P01_TOPICS_R3_FOCUSED=PASS
      - name: Canonical regression all unit tests against V2.47.436
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt
          echo P01_TOPICS_R3_CANONICAL_FULL=PASS
      - name: Cleanup transient private checkout
        shell: bash
        if: always()
        run: |
          rm -rf candidate stable
          echo PRIVATE_SOURCE_PERSISTED=NO
