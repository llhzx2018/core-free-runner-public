name: TEMP S01-C02 Ops 1.21.809 Candidate Gate
on:
  push:
    branches: [temp/s01-c02-v121809-build-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-candidate-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_BRANCH: fix/s01-static-batch-label-compat-v121809
      TARGET_COMMIT: e4c5fc3dece349ca23f0fea361d55709d4b3f82c
      TARGET_TREE: ca276d4944c31dd9dd1f3f20a36b5db8fe03051f
      BASE_COMMIT: e827f42117002024b37c85b498eb8790c05110bf
      MAIN_COMMIT: e827f42117002024b37c85b498eb8790c05110bf
      DEVELOP_COMMIT: e827f42117002024b37c85b498eb8790c05110bf
      VERSION: 1.21.809
      ASSET_NAME: vf-tools-ops_V1.21.809.zip
    steps:
      - name: Checkout exact 1.21.809 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify live authority and exact change scope
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          read_branch() {
            local branch="$1"
            curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/heads/${branch}" | jq -r '.object.sha'
          }
          test "$(read_branch main)" = "$MAIN_COMMIT"
          test "$(read_branch develop)" = "$DEVELOP_COMMIT"
          test "$(read_branch fix/s01-static-batch-label-compat-v121809)" = "$TARGET_COMMIT"
          git -C ops diff --name-only "$BASE_COMMIT" "$TARGET_COMMIT" | sort >/tmp/changed.txt
          printf '%s\n' '.github/phase3/v121809-static-batch-label-compat.php' 'VERSION' 'includes/site-release/s01-static-boundary-reconciler.php' 'vf-ops.php' | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git -C ops diff "$BASE_COMMIT" "$TARGET_COMMIT" -- includes/site-release/s01-static-boundary-reconciler.php | grep '^+' | grep -v '^+++' >/tmp/reconciler-added.txt || true
          ! grep -E '(update_post_meta|delete_post_meta|wp_delete_post|wp_insert_post|DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE|vf_m3u8_|seed_migration|seed_can_delete)' /tmp/reconciler-added.txt
          grep -Fq 'vf_ops_s01_static_boundary_label_recoverable_v121809' /tmp/reconciler-added.txt
          grep -Fq "str_starts_with(\$label, '静态产物 ')" /tmp/reconciler-added.txt
          grep -Fq "str_starts_with(\$label, '静态发布 ')" /tmp/reconciler-added.txt
          echo SOURCE_IDENTITY_SCOPE_CONTRACT=PASS
      - name: PHP lint and focused compatibility regression
        run: |
          set -Eeuo pipefail
          find ops -path 'ops/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/php-lint.txt
          php ops/.github/phase3/v121809-static-batch-label-compat.php | tee /tmp/focused.txt
          grep -Fxq PASS_V121809_STATIC_BATCH_LABEL_COMPAT /tmp/focused.txt
          grep -Fq ' * Version: 1.21.809' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.809" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'STATIC-BATCH-LABEL-COMPAT-V1'" ops/vf-ops.php
          echo PHP_AND_FOCUSED_CONTRACT=PASS
      - name: Build deterministic candidate artifact and emit authority
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET_NAME'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          m={'asset_bytes':z.stat().st_size,'asset_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          print('ARTIFACT_AUTHORITY='+json.dumps(m,separators=(',',':')))
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          unzip -p "/tmp/release/$ASSET_NAME" vf-ops/vf-ops.php | grep -Fq ' * Version: 1.21.809'
          unzip -p "/tmp/release/$ASSET_NAME" vf-ops/includes/site-release/s01-static-boundary-reconciler.php | grep -Fq 'vf_ops_s01_static_boundary_label_recoverable_v121809'
          echo PASS_V121809_CANDIDATE_GATE
