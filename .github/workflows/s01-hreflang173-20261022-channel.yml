name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-hreflang173-20261022]
    paths: ['.github/workflows/s01-hreflang173-20261022-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.173
  TARGET_SHA: a04063727eacbd8c1c033c0a115f6a3b2cff4faf
  UPDATE_SHA: d6b3896569ab50b8ca83bb5f002412f43f30a8a5
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: d6b3896569ab50b8ca83bb5f002412f43f30a8a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='54dd502e45f6d254a80034b305e5264b5ffa854ee7a1bf9da04c70afc54545c2' and m['asset_bytes']==1973973
          assert m['runtime_files']==476 and '1.35.172' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
