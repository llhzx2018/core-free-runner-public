name: temp-s01-ops-121860-formal-release-v2-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-121860-formal-release-v2-20260908.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: 7a0948791a69f62f603de0d187e384c279215536
      TAG: v1.21.860
      ASSET: vf-tools-ops_V1.21.860.zip
      REPO: llhzx2018/vf-tools-ops
    steps:
      - name: Build verify publish and read back Ops 1.21.860 v2
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RELEASE_MODE=EXACT_MAIN PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO THEME_WRITE_USED=NO M3U8_WRITE_USED=NO'
          test "$(gh api repos/$REPO/branches/main --jq '.commit.sha')" = "$SHA"
          if gh api repos/$REPO/git/ref/tags/$TAG >/dev/null 2>&1; then echo TAG_ALREADY_EXISTS; exit 1; fi
          if gh api repos/$REPO/releases/tags/$TAG >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS; exit 1; fi
          rm -rf /tmp/ops-src "$RUNNER_TEMP/ops-a" "$RUNNER_TEMP/ops-b" "$RUNNER_TEMP/ops-r"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-src
          git -C /tmp/ops-src checkout -q "$SHA"
          test "$(git -C /tmp/ops-src rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < /tmp/ops-src/VERSION)" = '1.21.860'
          grep -F 'Version: 1.21.860' /tmp/ops-src/vf-ops.php >/dev/null
          grep -F "VF_OPS_VERSION', '1.21.860" /tmp/ops-src/vf-ops.php >/dev/null
          test -f /tmp/ops-src/assets/css/current/admin-s01-top-domains-v3.css
          grep -F "'vf-ops-admin-s01-top-domains-v3' => 'assets/css/current/admin-s01-top-domains-v3.css'" /tmp/ops-src/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php /tmp/ops-src/tests/top-domains-visible-ui-contract.php
          for t in dashboard-visible-ui-contract.php admin-human-language-contract.php system-components-human-language-contract.php update-refresh-policy-current-contract.php visible-console-v2-contract.php; do php "/tmp/ops-src/tests/$t"; done
          find /tmp/ops-src/includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l /tmp/ops-src/vf-ops.php >/dev/null
          mkdir -p "$RUNNER_TEMP/ops-a" "$RUNNER_TEMP/ops-b" "$RUNNER_TEMP/ops-r"
          python3 - <<'PY' > "$RUNNER_TEMP/ops-metrics.env"
          from pathlib import Path
          import hashlib,zipfile,os
          root=Path('/tmp/ops-src'); selected=[]
          for top in ('assets','includes'):
              selected.extend(p for p in (root/top).rglob('*') if p.is_file())
          selected.extend([root/'uninstall.php',root/'vf-ops.php'])
          rows=sorted([(p.relative_to(root).as_posix(),p.read_bytes()) for p in selected],key=lambda x:x[0])
          assert len(rows)==935, len(rows)
          runtime=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in rows).encode()
          runtime_fp=hashlib.sha256(runtime).hexdigest()
          def build(path):
              dirs={'vf-ops/'}
              for rel,_ in rows:
                  cur='vf-ops'
                  for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
              with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for d in sorted(dirs):
                      zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
                  for rel,data in rows:
                      zi=zipfile.ZipInfo('vf-ops/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
              blob=Path(path).read_bytes(); return len(rows),len(blob),hashlib.sha256(blob).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'ops-a'/os.environ['ASSET']); b=build(Path(os.environ['RUNNER_TEMP'])/'ops-b'/os.environ['ASSET']); assert a==b
          print(f'FILES={a[0]}'); print(f'BYTES={a[1]}'); print(f'SHA256={a[2]}'); print(f'RUNTIME_FP={runtime_fp}')
          PY
          cat "$RUNNER_TEMP/ops-metrics.env" >> "$GITHUB_ENV"; set -a; source "$RUNNER_TEMP/ops-metrics.env"; set +a
          cmp "$RUNNER_TEMP/ops-a/$ASSET" "$RUNNER_TEMP/ops-b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          p=os.environ['RUNNER_TEMP']+'/ops-a/'+os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert len(names)==935 and z.testzip() is None
              assert 'vf-ops/VERSION' not in names and not any(n.startswith('vf-ops/tests/') for n in names)
              assert 'vf-ops/assets/css/current/admin-s01-top-domains-v3.css' in names
              main=z.read('vf-ops/vf-ops.php'); assert b'Version: 1.21.860' in main
              loader=z.read('vf-ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php'); assert b'admin-s01-top-domains-v3.css' in loader
              css=z.read('vf-ops/assets/css/current/admin-s01-top-domains-v3.css')
              for token in [b'.vf-v13-publish-single',b'.vf-accept-product',b'.vf-site-release',b'@media (max-width:782px)']:
                  assert token in css, token
          PY
          created_tag=0; created_release=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then if [ "$created_release" -eq 1 ]; then gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes >/dev/null 2>&1||true; elif [ "$created_tag" -eq 1 ]; then gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1||true; fi; fi; exit "$rc"; }
          trap cleanup EXIT
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null; created_tag=1
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          cat > "$RUNNER_TEMP/ops-notes" <<EOF
          S01-C02 Top Daily Domains Visible UI Refinement.
          Exact main source: $SHA
          Visible Candidate Gate: 34221998807 PASS
          1.21.860 Bump Gate: 34222182803 PASS
          Post-push exact Bump Gate: 34222341521 PASS
          Static Publish, Site Acceptance and System & Integration now share one visible hierarchy: page identity, current task, compact evidence, one dominant action and secondary professional detail.
          Schema remains 6.0.0; physical locator remains vf-ops/vf-ops.php; locator cutover remains false.
          Production: NOT_RUN
          Static: NOT_RUN
          Online: NOT_RUN
          EOF
          gh release create "$TAG" "$RUNNER_TEMP/ops-a/$ASSET" --repo "$REPO" --title 'VF Tools Ops V1.21.860' --notes-file "$RUNNER_TEMP/ops-notes" --draft --verify-tag; created_release=1
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/ops-r"
          test "$(stat -c %s "$RUNNER_TEMP/ops-r/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/ops-r/$ASSET"|awk '{print $1}')" = "$SHA256"
          cmp "$RUNNER_TEMP/ops-a/$ASSET" "$RUNNER_TEMP/ops-r/$ASSET"
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/ops-final.json"
          test "$(jq -r '.draft' "$RUNNER_TEMP/ops-final.json")" = false
          test "$(jq -r '.prerelease' "$RUNNER_TEMP/ops-final.json")" = false
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.size' "$RUNNER_TEMP/ops-final.json")" = "$BYTES"
          digest="$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest // empty' "$RUNNER_TEMP/ops-final.json")"; if [ -n "$digest" ]; then test "$digest" = "sha256:$SHA256"; fi
          trap - EXIT
          echo "TAG_TARGET=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/ops-final.json")"
          echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/ops-final.json")"
          echo "REMOTE_BYTES=$BYTES"; echo "ASSET_SHA256=$SHA256"; echo "RUNTIME_FILES=$FILES"; echo "RUNTIME_FP=$RUNTIME_FP"
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
          echo 'PASS_S01_C02_121860_FORMAL_RELEASE_V2'
