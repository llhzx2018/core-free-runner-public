name: P01 V2.36.3 Main Authority Remote Closure
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-main-authority-remote-closure-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAIN_CLOSURE: e25f028044523b46bb3f75c26b19410e9d2b3f9c
      BASE_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      SYNC_COMMIT: a419017dd68caa16a90ac14b95a91d840c0e44fe
      AUTHORITY_TREE: aae7f815d35a738354a885746936e2b902b38bc2
      DEVELOP_CLOSURE: f0a54a43af8614426995dc3894ccedfd919be8ac
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      REMOTE_TRUTH_R2: '33504969865'
      DEVELOP_AUTHORITY_GATE: '33505729408'
      MAIN_PREP_R2: '33506063170'
      MAIN_GATE_R4: '33506613022'
      EVID: /tmp/p01-v2363-main-authority-remote-closure
    steps:
      - name: Checkout live product main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Checkout live core-updates main identity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_LIVE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core
      - name: Verify post-merge remote truth
        shell: bash
        env:
          RUNNER_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          exec > >(tee "$EVID/log.txt") 2>&1
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'

          echo 'phase=main-closure-identity'
          cd product
          test "$(git rev-parse HEAD)" = "$MAIN_CLOSURE"
          test "$(git rev-parse HEAD^{tree})" = "$AUTHORITY_TREE"
          test "$(git rev-parse HEAD^1)" = "$BASE_MAIN"
          test "$(git rev-parse HEAD^2)" = "$SYNC_COMMIT"
          test "$(git diff --name-only "$BASE_MAIN" "$MAIN_CLOSURE" | sort)" = "$expected"
          test -z "$(git diff --name-only "$BASE_MAIN" "$MAIN_CLOSURE" -- src)"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git rev-parse "$BASE_MAIN:src")" = "$RUNTIME_TREE"

          echo 'phase=remote-ref-fence'
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_CLOSURE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP_CLOSURE"
          test "$(git ls-remote origin refs/tags/v2.36.3 | awk '{print $1}')" = "$FORMAL"
          git fetch origin "$DEVELOP_CLOSURE" --quiet
          test "$(git rev-parse "$DEVELOP_CLOSURE^{tree}")" = "$AUTHORITY_TREE"
          for f in VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$MAIN_CLOSURE:$f")" = "$(git rev-parse "$DEVELOP_CLOSURE:$f")"
          done

          echo 'phase=authority-content'
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e '.production_version=="2.36.2" and .working_version=="2.36.3" and .target_release_version=="2.36.3"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.version=="2.36.3" and .published_release.tag=="v2.36.3" and .published_release.release_id==380449563' VF_PROJECT.json >/dev/null
          jq -e '.published_release.release_source=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .published_release.release_tree=="32e8afdd6d7cdd338c62fdafaedb200b127ca881" and .published_release.runtime_tree=="820724b585cb59864211f77c4fb33537b2345029"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.live_core_updates_commit=="650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf" and .published_release.live_online_next_hop=="2.36.3 / FROM 2.36.2"' VF_PROJECT.json >/dev/null
          jq -e '.current_change.production_write==false and .current_change.runner_main_write==false' VF_PROJECT.json >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/authority/CURRENT.md >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F 'Owner Production remains **V2.36.2**' docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md >/dev/null

          echo 'phase=core-updates-live'
          cd ../core
          test "$(git rev-parse HEAD)" = "$CORE_LIVE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CORE_LIVE"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' projects/P01.json >/dev/null

          echo 'phase=gate-chain-and-runner-boundary'
          export GH_TOKEN="$RUNNER_TOKEN"
          for run in "$REMOTE_TRUTH_R2" "$DEVELOP_AUTHORITY_GATE" "$MAIN_PREP_R2" "$MAIN_GATE_R4"; do
            conclusion="$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)"
            echo "runner-run=$run conclusion=$conclusion"
            test "$conclusion" = success
          done
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq .commit.sha)" = e569c491506e2a367d01a18cfa89a234a22abb79

          printf 'P01_V2363_MAIN_AUTHORITY_REMOTE_CLOSURE=PASS\nMAIN_CLOSURE=%s\nAUTHORITY_TREE=%s\nDEVELOP_CLOSURE=%s\nFORMAL_SOURCE=%s\nSRC_TREE=%s\nPUBLISHED_LATEST=2.36.3\nOWNER_PRODUCTION=2.36.2\nLIVE_ONLINE_FROM=2.36.2\nLIVE_ONLINE_NEXT_HOP=2.36.3\nCORE_UPDATES_MAIN=%s\nRUNNER_MAIN_UNCHANGED=YES\nOWNER_PRODUCTION_WRITE=NO\nNEXT_OWNER_ACTION=ONLINE_UPDATE_V2.36.2_TO_V2.36.3\n' "$MAIN_CLOSURE" "$AUTHORITY_TREE" "$DEVELOP_CLOSURE" "$FORMAL" "$RUNTIME_TREE" "$CORE_LIVE" | tee "$EVID/verdict.txt"
      - name: Upload remote closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-main-authority-remote-closure-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
