name: P04 V2.5.3 Hotfix Build Verify V6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-hotfix-build-verify-v6.yml'

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Execute with dynamic port and safe setup diagnostics
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          s=s.replace("PORT=18523; PASS='P04V253HotfixTest!'","PORT=$(python3 -c 'import socket;s=socket.socket();s.bind((\"127.0.0.1\",0));print(s.getsockname()[1]);s.close()'); PASS='P04V253HotfixTest!'",1)
          old="php -S 127.0.0.1:$PORT -t \"$SITE\" >\"$WORK/http.log\" 2>&1 & PID=$!\ntrap 'kill $PID 2>/dev/null || true; rm -rf \"$WORK\"' EXIT"
          s=s.replace(old,old+"\nsleep .5\nif ! kill -0 $PID 2>/dev/null; then echo PHP_TEST_SERVER_START_FAIL; cat \"$WORK/http.log\"; exit 1; fi\necho \"PHP_TEST_SERVER_START=PASS PORT=$PORT\"",1)
          s=s.replace("grep -Eq '^HTTP/.* 30[23]' \"$WORK/setup-post\"","if ! grep -Eq '^HTTP/.* 30[23]' \"$WORK/setup-post\"; then echo SETUP_POST_GATE_FAIL; sed -E 's/(password=)[^&[:space:]]+/\\1[REDACTED]/g' \"$WORK/setup-post\"; echo SERVER_LOG; cat \"$WORK/http.log\"; exit 1; fi",1)
          s=s.replace("grep -Eq '^HTTP/.* 30[23]' \"$WORK/login-post\"","if ! grep -Eq '^HTTP/.* 30[23]' \"$WORK/login-post\"; then echo LOGIN_POST_GATE_FAIL; sed -E 's/(password=)[^&[:space:]]+/\\1[REDACTED]/g' \"$WORK/login-post\"; echo SERVER_LOG; cat \"$WORK/http.log\"; exit 1; fi",1)
          p.write_text(s)
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
