name: temp-s01-m3u8-routine-surfaces-visible-candidate-gate-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-m3u8-routine-surfaces-visible-candidate-gate-20260908.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BASE: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
      HEAD: 3ad5754dd8f9ea80eb72fab1961d629fe4cfe628
      BRANCH: work/s01-m3u8-routine-surfaces-visible-refinement-20260908
    steps:
      - name: Exact candidate gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'GATE=S01_C03_ROUTINE_SURFACES_VISIBLE_REFINEMENT WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-candidate /tmp/m3u8-package-sim
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-candidate
          cd /tmp/m3u8-candidate
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" "refs/heads/${BRANCH}" | awk '{print $1}')" = "$HEAD"
          git checkout -q "$HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '1.25.30'
          echo 'EXACT_HEAD_AND_VERSION=PASS'

          mapfile -t changed < <(git diff --name-only "$BASE" "$HEAD" | sort)
          printf 'CHANGED=%s\n' "${changed[*]}"
          expected=(
            src/admin/admin-s01-uiux-polish.php
            src/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css
            tests/routine-surfaces-visible-ui-contract.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'CHANGE_SCOPE=PASS'

          php -l src/admin/admin-s01-uiux-polish.php >/dev/null
          php -l tests/routine-surfaces-visible-ui-contract.php >/dev/null
          php -l src/admin/pages/settings.php >/dev/null
          php -l src/admin/pages/preview.php >/dev/null
          php -l src/admin/pages/recovery.php >/dev/null
          php tests/routine-surfaces-visible-ui-contract.php
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          echo 'PHP_AND_UI_CONTRACTS=PASS'

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css')
          s=p.read_text()
          assert s.count('{')==s.count('}'), (s.count('{'),s.count('}'))
          for token in ['.vf-v510-settings','.vf-preview','.vf-recovery','@media (max-width:782px)',':focus-visible','prefers-reduced-motion']:
              assert token in s, token
          print('CSS_STRUCTURE=PASS')
          PY
          grep -F 'r78-routine-surfaces-visible-v4.css' src/admin/admin-s01-uiux-polish.php >/dev/null
          grep -F 'PHP_INT_MAX' src/admin/admin-s01-uiux-polish.php >/dev/null
          echo 'FINAL_OWNER_LOAD=PASS'

          # Formal M3U8 packaging consumes src/** into vf-tool-m3u8/. Prove this UI owner lives in delivered runtime scope.
          mkdir -p /tmp/m3u8-package-sim/vf-tool-m3u8
          cp -a src/. /tmp/m3u8-package-sim/vf-tool-m3u8/
          test -f /tmp/m3u8-package-sim/vf-tool-m3u8/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css
          test -f /tmp/m3u8-package-sim/vf-tool-m3u8/vf-tool-m3u8.php
          grep -F '.vf-preview__studio' /tmp/m3u8-package-sim/vf-tool-m3u8/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css >/dev/null
          echo 'DELIVERED_RUNTIME_SCOPE=PASS'

          grep -F 'Version: 1.25.30' src/vf-tool-m3u8.php >/dev/null
          ! git diff "$BASE" "$HEAD" -- VERSION src/vf-tool-m3u8.php src/includes/update | grep -E '^[+-].*(1\.3\.0|vf-tool-m3u8/vf-tool-m3u8\.php|locator|migration)' >/dev/null
          echo 'IDENTITY_SCHEMA_LOCATOR_MIGRATION_BOUNDARY=PASS'

          echo 'M3U8_SCHEMA=1.3.0 M3U8_LOCATOR=vf-tool-m3u8/vf-tool-m3u8.php M3U8_LOCATOR_CUTOVER=false M3U8_MIGRATION=CLOSED'
          echo 'PRODUCTION=NOT_RUN STATIC=NOT_RUN ONLINE=NOT_RUN FINAL_ONLINE_PASS=NOT_CLAIMED'
          echo 'PASS_S01_C03_ROUTINE_SURFACES_VISIBLE_CANDIDATE_GATE'
