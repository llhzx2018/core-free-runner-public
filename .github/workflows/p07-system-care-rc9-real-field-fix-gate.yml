name: P07 System Care RC9 Real Field Fix Gate

on:
  push:
    branches: [gate/p07-system-care-rc9-real-field-fix-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc9-real-field-fix-gate.yml'

permissions:
  contents: read

jobs:
  rc9-real-field-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact RC9 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 57fb3c3f5945e92a43463dedc2b81d9ffcdd1838
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "57fb3c3f5945e92a43463dedc2b81d9ffcdd1838"
          test "$(cat product/modules/system-care/VERSION)" = "0.1.0-rc9"
          echo P07_SYSTEM_CARE_RC9_EXACT_SOURCE=PASS

      - name: Static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh

      - name: Functional gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/functional_gate.sh

      - name: RC9 real-field markers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product/modules/system-care
          grep -Fq '服务器      %b需检查%b · 按 1 查看' vf-system-care.sh
          grep -Fq '网站安全    %b需查看%b' vf-system-care.sh
          grep -Fq 'P07 会优先读取 CloudPanel 已知站点' intrusion-evidence.sh
          grep -Fq 'SELECT domain_name, user FROM "site"' lib/intrusion_scan.py
          grep -Fq 'UnsupportedWordPressLayoutError' lib/intrusion_scan.py
          echo P07_SYSTEM_CARE_RC9_REAL_FIELD_UX_CONTRACT=PASS

      - name: Final marker
        shell: bash
        run: echo P07_SYSTEM_CARE_RC9_REAL_FIELD_FIX_MACHINE_GATE=PASS
