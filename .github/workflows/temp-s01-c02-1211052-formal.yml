name: S01-C02 V1.21.1052 Formal Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 2c904890eb3b74c0e3c47cc6da8e45fedfc590c8
      TARGET_VERSION: 1.21.1052
      TESTED_RUN_ID: 37583322227
      TESTED_SOURCE_SHA: cc600032a3c009788b28ee39971e0cf10feeadbf
      TESTED_SOURCE_TREE: 6a6104bf25243d55c2295cf29710b298d87f4fc6
      TESTED_ARTIFACT: s01-c02-1211052-quality-flat-evidence
      EXPECTED_BYTES: 3525797
      EXPECTED_SHA256: 784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: 142f101292f90ad95725a42fe89a7ad58478d03f0a45186c9510263f179db843
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .browser_flat_page=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/vf-tools-ops_V1.21.1052.zip" > /tmp/package.json
          test "$(jq -r '.asset_bytes' /tmp/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' /tmp/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' /tmp/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' /tmp/package.json)" = "$EXPECTED_RUNTIME_FP"
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo FORMAL_RELEASE_INPUT=PASS

      - name: Public Authority and rollback gate
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -e '.owner_delivery_policy.OWNER_PREVIEW_RUNTIME_APPLICABILITY=="N_A"' target/VF_PROJECT.json >/dev/null
          test -z "$(git -C target diff --name-only v1.21.1051 "$TARGET_SHA" -- includes/v6/schema.php includes/v6/upgrade-service.php includes/wp-update config | tr -d '\r\n')"
          mkdir -p previous
          gh release download v1.21.1051 --repo "$TARGET_REPOSITORY" --pattern vf-tools-ops_V1.21.1051.zip --dir previous --clobber
          test "$(sha256sum previous/vf-tools-ops_V1.21.1051.zip | awk '{print $1}')" = "3e2334cedacf8bab1d3b4c3d52ef6a3668b06a3448423af6b8ff4c18fb561e1b"
          unzip -tq previous/vf-tools-ops_V1.21.1051.zip >/dev/null
          echo INSTALL=N_A_UPDATE_ONLY
          echo SECURITY=REQUIRED_PASS
          echo TESTING=REQUIRED_PASS
          echo UPGRADE=REQUIRED_PASS
          echo DATA_SCHEMA=N_A_NO_SCHEMA_CHANGE
          echo OBSERVABILITY=REQUIRED_PASS
          echo GIT=REQUIRED_PASS
          echo UA_UI=REQUIRED_PASS
          echo ROLLBACK_TO_1211051=PASS

      - name: Publish formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1052

          质量中心单页功能收口
          - 质量域只保留一个 OWNER 页面“质量中心”。
          - 源站验收、线上验收、组件证据、结果与导出继续保留成熟 runtime / service / Nonce / Revision / mutex / write-readback，但改为质量中心同页任务区。
          - compatibility / legacy capability URL 只选择质量中心同页能力，不恢复第二 Shell、第二 H1 或第二 Page Identity。
          - 发布包 / Cloudflare 等真正属于“发布”域的动作继续进入发布中心。
          - 修复嵌入 Source Acceptance 后 R18/source.css 误隐藏质量中心 pagehead 的回归风险。
          - Shell / Header / Header Menu、Schema 6.0.0、Auth、Updater、Provider 与 Production 写入边界不变。
          - Candidate Run: 37583322227
          - exact promoted main: 2c904890eb3b74c0e3c47cc6da8e45fedfc590c8
          - tested source tree: 6a6104bf25243d55c2295cf29710b298d87f4fc6
          - SHA256: 784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37

          Production remains OWNER-manual; OWNER Product Acceptance remains post-Production.
          EOF
          if gh release view v1.21.1052 --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/v1.21.1052" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create v1.21.1052 /tmp/vf-tools-ops_V1.21.1052.zip --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1052" --notes-file notes.md
          fi

      - name: Remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/v1.21.1052")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.1052.zip")|.id' <<<"$J")"
          SIZE="$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.1052.zip")|.size' <<<"$J")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/v1.21.1052" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir -p readback evidence
          gh release download v1.21.1052 --repo "$TARGET_REPOSITORY" --pattern vf-tools-ops_V1.21.1052.zip --dir readback --clobber
          test "$(sha256sum readback/vf-tools-ops_V1.21.1052.zip | awk '{print $1}')" = "$EXPECTED_SHA256"
          jq -n --arg release_id "$RID" --arg asset_id "$AID" --arg sha "$EXPECTED_SHA256" --argjson bytes "$EXPECTED_BYTES" '{status:"PASS",release_id:$release_id,asset_id:$asset_id,asset_sha256:$sha,asset_bytes:$bytes,production:"NOT_TOUCHED",owner_product_pass:false}' > evidence/FINAL_RELEASE_EVIDENCE.json
          cat evidence/FINAL_RELEASE_EVIDENCE.json
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Upload formal release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211052-formal-release-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare distribution branch
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          UPDATES_REPO="llhzx2018/core-updates"
          UPDATES_BRANCH="dist/s01-c02-1211052"
          RAW="$(gh api "repos/$UPDATES_REPO/contents/projects/S01-C02.json?ref=$UPDATES_BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          printf '%s\n' "$RAW" > /tmp/S01-C02.json
          test "$(jq -r '.target_version' /tmp/S01-C02.json)" = "1.21.1051"
          test "$(jq -r '.asset_sha256' /tmp/S01-C02.json)" = "3e2334cedacf8bab1d3b4c3d52ef6a3668b06a3448423af6b8ff4c18fb561e1b"

          jq '
            .target_version="1.21.1052"
            | .from_versions = ((.from_versions + ["1.21.1051"]) | unique)
            | .release_tag="v1.21.1052"
            | .asset_name="vf-tools-ops_V1.21.1052.zip"
            | .asset_bytes=3525797
            | .asset_sha256="784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37"
            | .runtime_files=987
            | .runtime_fingerprint="142f101292f90ad95725a42fe89a7ad58478d03f0a45186c9510263f179db843"
            | .runtime_file_count=987
            | .runtime_fingerprint_sha256="142f101292f90ad95725a42fe89a7ad58478d03f0a45186c9510263f179db843"
            | .released_at="2026-10-07T07:19:16Z"
          ' /tmp/S01-C02.json > /tmp/S01-C02.next.json

          SHA="$(gh api "repos/$UPDATES_REPO/contents/projects/S01-C02.json?ref=$UPDATES_BRANCH" --jq '.sha')"
          CONTENT="$(base64 -w0 /tmp/S01-C02.next.json)"
          gh api --method PUT "repos/$UPDATES_REPO/contents/projects/S01-C02.json"             -f message="dist: advance S01-C02 channel to 1.21.1052"             -f content="$CONTENT"             -f sha="$SHA"             -f branch="$UPDATES_BRANCH" >/tmp/update-result.json
          test -n "$(jq -r '.commit.sha' /tmp/update-result.json)"
          echo DISTRIBUTION_BRANCH_PREPARED=PASS
