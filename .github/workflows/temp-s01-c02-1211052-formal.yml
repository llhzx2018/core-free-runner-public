name: S01-C02 V1.21.1052 Formal Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 2c904890eb3b74c0e3c47cc6da8e45fedfc590c8
      TARGET_VERSION: 1.21.1052
      TESTED_RUN_ID: 37583322227
      TESTED_SOURCE_SHA: cc600032a3c009788b28ee39971e0cf10feeadbf
      TESTED_SOURCE_TREE: 6a6104bf25243d55c2295cf29710b298d87f4fc6
      TESTED_ARTIFACT: s01-c02-1211052-quality-flat-evidence
      EXPECTED_BYTES: 3525797
      EXPECTED_SHA256: 784438bb387213f22defa2ba5c4b59f9b5bb59010c1cfbc095986da43b537a37
      EXPECTED_RUNTIME_FILES: 987
      EXPECTED_RUNTIME_FP: 142f101292f90ad95725a42fe89a7ad58478d03f0a45186c9510263f179db843
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .browser_flat_page=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/vf-tools-ops_V1.21.1052.zip" > /tmp/package.json
          test "$(jq -r '.asset_bytes' /tmp/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' /tmp/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' /tmp/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' /tmp/package.json)" = "$EXPECTED_RUNTIME_FP"
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo FORMAL_RELEASE_INPUT=PASS
