name: P01 D63 isolated legacy vs Laravel SQLite field-level parity
on:
  push:
    branches:
      - test/p01-d63-legacy-column-parity-20261113
permissions:
  contents: read

jobs:
  d63-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Exact test-only product lane and transient private source
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d63-legacy-column-parity-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D63_OFFLINE_ONLY=YES"
          echo "P01_D63_PRODUCTION_MIGRATION_OR_RELEASE=NO"
      - name: Checkout exact private candidate transiently, never persist credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9da41b0a1098a91e49d86b9de289cc999b1585b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Confirm exact immutable candidate and pinned legacy source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9da41b0a1098a91e49d86b9de289cc999b1585b4"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          echo "P01_D63_EXACT_SOURCE=9da41b0a1098a91e49d86b9de289cc999b1585b4"
      - name: Install isolated PHP SQLite extensions for real migration replay
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d63-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mbstring >> "$RUNNER_TEMP/d63-apt.txt" 2>&1
          php8.3 -m | grep -Fx pdo_sqlite
          php8.3 -m | grep -Fx sqlite3
          echo "P01_D63_ISOLATED_NATIVE_PHP_SQLITE=PASS"
      - name: Install exact locked Laravel 13 dependency in transient private workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins > "$RUNNER_TEMP/d63-composer.txt" 2>&1 || {
            grep -E '^Problem|^  -|^Your lock|^Installation failed' "$RUNNER_TEMP/d63-composer.txt" | head -n 25 || true
            exit 1
          }
          test -f candidate/src/app/next/vendor/autoload.php
          ln -s ../../../src/app/next/vendor candidate/tests/compatibility/laravel/vendor
          echo "P01_D63_LOCKED_LARAVEL13_COMPOSER=PASS"
      - name: Run genuine 20 old plus 10 new native SQLite migrations and field-level audit
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SnapshotAudit.php
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SchemaParity.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d63_old_new_schema_parity.php
          if ! P01_D63_SYNTHETIC_ONLY=YES php8.3 candidate/tests/compatibility/laravel/run_d63_old_new_schema_parity.php > "$RUNNER_TEMP/d63-report.txt" 2>&1; then
            grep -E '^P01_D63_|^PHP Fatal|^Fatal error|^Uncaught|^Stack trace:|^#0|D62_TEST_|D63 ' "$RUNNER_TEMP/d63-report.txt" | tail -n 55 || true
            exit 1
          fi
          grep -E '^P01_D63_' "$RUNNER_TEMP/d63-report.txt" | tail -n 70
          grep -Fx 'P01_D63_NO_LEGACY_BUSINESS_FIELDS_DROPPED=PASS' "$RUNNER_TEMP/d63-report.txt"
          grep -Fx 'P01_D63_EXACT_OLD37_NEW35_SCHEMA_FIELD_MATRIX=PASS' "$RUNNER_TEMP/d63-report.txt"
          grep -Fx 'P01_D63_OFFLINE_BOTH_SNAPSHOTS_UNCHANGED=PASS' "$RUNNER_TEMP/d63-report.txt"
          grep -Fx 'P01_D63_ACTUAL_OLD_TO_NEW_DATA_MIGRATION=NOT_PROVEN' "$RUNNER_TEMP/d63-report.txt"
          echo "P01_D63_EXACT_SCHEMA_MAPPING_ANALYSIS=PASS"
      - name: Always erase private candidate and synthetic test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/d63-apt.txt" "$RUNNER_TEMP/d63-composer.txt" "$RUNNER_TEMP/d63-report.txt"
          echo "P01_D63_PRIVATE_SOURCE_OR_DATA_PERSISTED=NO"
          echo "P01_D63_PUBLIC_ARTIFACTS=NONE"
