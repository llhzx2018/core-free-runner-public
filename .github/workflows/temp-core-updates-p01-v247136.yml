name: Core Updates P01 V2.47.136 Distribution Gate

on:
  push:
    branches:
      - test-core-updates-p01-v247136-20260930
    paths:
      - '.github/workflows/temp-core-updates-p01-v247136.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 85b77314643dacaebb207fc273fdb1331b7e10cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Manifest contract
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.135" and
            .target_version=="2.47.136" and
            .release_tag=="v2.47.136" and
            .release_id==400097432 and
            .product_identity=="981996bc7215404ee763d67aaff304623e455b5f" and
            .asset_name=="VF_Start_V2.47.136_UPDATE.zip" and
            .asset_bytes==2072625 and
            .asset_sha256=="52e0b577ac4184b1c12bda3492a149f9136434fb5b62a1db160376604c6b92a5"
          ' projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V247136_MANIFEST=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo CORE_UPDATES_P01_V247136_PHP_LINT=PASS

      - name: Update Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php update-core/php/tests/run.php
          echo CORE_UPDATES_P01_V247136_REGRESSION=PASS
