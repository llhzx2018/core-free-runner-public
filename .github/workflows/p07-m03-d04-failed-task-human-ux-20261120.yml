name: P07 M03 D04 failed 22site owner UX one-case exact private source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-failed-task-human-ux-20261120.yml'
permissions:
  contents: read
jobs:
  failed-task-human-ux:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      P07_PRODUCT_SHA: '1f01126d3c377b8eaaef39df92dfc515d197aeb6'
      P07_BASE_SHA: '1bf38aa07cc4a2a560da4cc73e4d622bdcdd5c71'
    steps:
      - name: Checkout public ephemeral runner source with credentials disabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read exact product PR373 source in temporary workspace only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1f01126d3c377b8eaaef39df92dfc515d197aeb6
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .product
      - name: Read current GOV code and naming contract only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov
      - name: Check exact-source module ownership, Bash syntax and Git actual architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = "$P07_PRODUCT_SHA"
          git -C .product cat-file -e "$P07_BASE_SHA^{commit}"
          bash -n .product/bin/vfops-migrate-ui \
            .product/components/p07-m03-failed-task-ux.sh \
            .product/components/p07-m03-migration-readiness.sh
          if ! python3 -B .product/.github/checks/architecture_gate.py \
              --manifest .product/.github/checks/code_architecture.json \
              --gov-root .gov --git-root .product \
              --base-sha "$P07_BASE_SHA" --head-sha "$P07_PRODUCT_SHA" \
              > "$RUNNER_TEMP/p07-m03-human-architecture.log" 2>&1; then
            echo P07_M03_D04_HUMAN_ARCHITECTURE=BLOCKED
            grep -E '^(PROJECT_ARCHITECTURE|SOURCE_NAMING)=' \
              "$RUNNER_TEMP/p07-m03-human-architecture.log" | cut -c1-175 || true
            exit 1
          fi
          (cd .product && python3 -B scripts/check_p07_modules.py) \
            > "$RUNNER_TEMP/p07-m03-human-modules.log" 2>&1 || {
            echo P07_M03_D04_HUMAN_MODULE_ISOLATION=BLOCKED; exit 1;
          }
          echo P07_M03_D04_HUMAN_EXACT_SOURCE_ARCH_MODULES=PASS
      - name: Run real status-aware terminal UX, Percona two-site conflict and SQL no-replay regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for suite in \
            test_p07_m03_failed_task_ux.py \
            test_p07_m03_d04_preparation_checklist.py \
            test_p07_m03_terminal_ux_v3.py \
            test_migration_no_overwrite_resume.py \
            test_p07_m03_release141_limited_engine_gate.py \
            test_p07_m03_d04_release_scope.py; do
            log="$RUNNER_TEMP/p07-m03-human-$suite.log"
            if (cd .product && python3 -B -m unittest discover -s tests -p "$suite" -q) \
               > "$log" 2>&1; then
              echo "P07_M03_D04_HUMAN_SUITE_PASS=$suite"
            else
              echo "P07_M03_D04_HUMAN_SUITE_BLOCKED=$suite"
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$log" \
                | cut -c1-165 | tail -n 12 || true
              exit 1
            fi
          done
          echo P07_M03_D04_HUMAN_22_2_20_NO_WRITE_AND_USER_FLOW=PASS
      - name: Verify P07 Terminal UX V3 seven scenario evidence and no synthetic action unlock
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! (cd .product && python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D04 \
            --changed-file bin/vfops-migrate-ui \
            --changed-file components/p07-m03-failed-task-ux.sh \
            --changed-file components/p07-m03-migration-readiness.sh \
            --evidence-file docs/ux-reviews/p07-m03-d04-failed-task-next-action-20261120.json) \
              > "$RUNNER_TEMP/p07-m03-human-ux-contract.log" 2>&1; then
            echo P07_M03_D04_HUMAN_UX_CONTRACT=BLOCKED
            grep -E 'BLOCKED|FAIL|ERROR' "$RUNNER_TEMP/p07-m03-human-ux-contract.log" | cut -c1-160 | head -n 10 || true
            exit 1
          fi
          echo P07_M03_D04_HUMAN_UX_V3=PASS
          echo P07_M03_D04_PRODUCTION_DATABASE_DNS_MIGRATION=NOT_TOUCHED
      - name: Remove transient private checkout and governance sources after proof
        if: always()
        shell: bash
        run: |
          rm -rf -- .product .gov
          echo P07_M03_D04_HUMAN_TEMP_PRIVATE_SOURCE_CLEANUP=PASS
