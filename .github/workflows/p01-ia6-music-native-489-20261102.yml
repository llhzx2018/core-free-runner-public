name: P01 IA6 music native exact source disposable browser
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p01-ia6-music-native-489-20261102.yml]
permissions:
  contents: read
jobs:
  music-native:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 0bea0b5bcd26c9c96bf0d31cb1971cd297d839dd
      PRODUCT_VERSION: 2.47.489
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-music-proof-20261102
      VF_IA6_DISPOSABLE_ACK: IA6-MUSIC-ONLY
      P01_TEST_ORIGIN: http://127.0.0.1:19334
      P01_TEST_PASSWORD: IA6DisposableMusicOwner2026!
    steps:
      - name: Checkout public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated PHP SQLite and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind exact private candidate without persistence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' <candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' <candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_MUSIC_EXACT_SOURCE=PASS
      - name: Syntax and targeted code contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/music-home.php
          php -l candidate/src/api.php
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          node --check candidate/src/assets/global-remote-music.js
          node --check candidate/src/assets/local-subsite-management.js
          node --check candidate/tests/integration/p01_ia6_music_unknown_native_browser.mjs
          node candidate/tests/unit/p01_ia5_remote_music_r30_contract.cjs
          node candidate/tests/unit/p01_ia6_music_unknown_write_dialog_guard_contract.cjs
          echo P01_IA6_MUSIC_SOURCE_CONTRACTS=PASS
      - name: Disposable actual HTTP Chromium at 1440 and 768
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VF_E2E_RUNTIME_ROOT" = /tmp/p01-ia6-music-proof-20261102
          test ! -e "$VF_E2E_RUNTIME_ROOT"
          mkdir -p "$VF_E2E_RUNTIME_ROOT"
          cp -a candidate/src/. "$VF_E2E_RUNTIME_ROOT/"
          php -S 127.0.0.1:19334 -t "$VF_E2E_RUNTIME_ROOT" >/tmp/p01-ia6-music-guard-server.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" >/dev/null 2>&1 || true
            rm -rf "$VF_E2E_RUNTIME_ROOT"
            rm -f /tmp/p01-ia6-music-guard-cookie /tmp/p01-ia6-music-guard-setup.html /tmp/p01-ia6-music-guard-installed.html /tmp/p01-ia6-music-guard-server.log
          }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-music-guard-cookie -b /tmp/p01-ia6-music-guard-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-music-guard-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-music-guard-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-music-guard-cookie -b /tmp/p01-ia6-music-guard-cookie -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Disposable Music" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" >/tmp/p01-ia6-music-guard-installed.html
          (cd "$VF_E2E_RUNTIME_ROOT" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node candidate/tests/integration/p01_ia6_music_unknown_native_browser.mjs
          echo P01_IA6_MUSIC_DISPOSABLE_BROWSER=PASS
      - name: Clean synthetic source runtime and cookies
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-ia6-music-proof-20261102
          rm -f /tmp/p01-ia6-music-guard-cookie /tmp/p01-ia6-music-guard-setup.html /tmp/p01-ia6-music-guard-installed.html /tmp/p01-ia6-music-guard-server.log
          echo P01_IA6_MUSIC_CLEANUP=PASS
