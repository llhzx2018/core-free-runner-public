name: P01 Selection Action Redundancy Diagnostic
on:
  push:
    branches: [diagnostic/p01-selection-action-redundancy-20260831]
    paths: [.github/workflows/p01-selection-action-redundancy-20260831.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: 8133e1982417bea1baa77c6e08c93db643f67350
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-selection-actions/evidence
      PORT: '18484'
      ADMIN_PASS: P01SelectionActionsDiag
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact develop truth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh setup and seed
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-selection-actions; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-selection-actions.pid
          COOKIE=/tmp/p01-selection-actions.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Selection Actions Diagnostic' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db();$repo=new VfRepository($db);
          $c=$repo->createCategory(['name'=>'诊断分类','description'=>'','parent_id'=>null,'is_private'=>true]);
          $repo->saveLink(null,['category_id'=>$c,'title'=>'Organized One','url'=>'https://organized-one.example/','is_private'=>1,'is_pending'=>0],'admin');
          $repo->saveLink(null,['category_id'=>$c,'title'=>'Pending One','url'=>'https://pending-one.example/','is_private'=>1,'is_pending'=>1],'admin');
          echo "SEED=PASS\n";
          PHP
      - name: Chromium selection-state action readback
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-selection-actions/pw; cd /tmp/p01-selection-actions/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18484/';
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:900}});
          const login=await c.request.post(base+'api.php?action=login',{data:{password:'P01SelectionActionsDiag'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
          const p=await c.newPage();
          const actions=()=>p.evaluate(()=>[...document.querySelectorAll('#batchBar [data-bulk]')].filter(x=>!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)).map(x=>({action:x.dataset.bulk,text:x.textContent.trim()})));
          const select=async t=>{const row=p.locator('tr').filter({hasText:t});await row.locator('input[data-select]').check();};
          const run=async width=>{await p.setViewportSize({width,height:844});await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});
            await select('Organized One');const organizedOnly=await actions();if(width===390)await p.screenshot({path:process.env.EVID+'/organized-mobile.png',fullPage:true});
            await p.locator('input[data-select]:checked').uncheck();await select('Pending One');const pendingOnly=await actions();if(width===390)await p.screenshot({path:process.env.EVID+'/pending-mobile.png',fullPage:true});
            await select('Organized One');const mixed=await actions();if(width===390)await p.screenshot({path:process.env.EVID+'/mixed-mobile.png',fullPage:true});
            return {organizedOnly,pendingOnly,mixed};};
          const desktop=await run(1440),mobile=await run(390);
          const redundant=desktop.organizedOnly.some(x=>x.action==='organized')&&desktop.pendingOnly.some(x=>x.action==='pending')&&mobile.organizedOnly.some(x=>x.action==='organized')&&mobile.pendingOnly.some(x=>x.action==='pending');
          fs.writeFileSync(process.env.EVID+'/state.json',JSON.stringify({desktop,mobile,redundant},null,2));
          console.log('P01_SELECTION_ACTION_REDUNDANCY='+String(redundant).toUpperCase());console.log(JSON.stringify({desktop,mobile}));await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node diag.cjs | tee "$EVID/diagnostic.txt"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-selection-action-redundancy-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-selection-actions.pid 2>/dev/null)" 2>/dev/null || true