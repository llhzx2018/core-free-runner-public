name: TEMP P07 RC4 final live anonymous toolbox selected upgrade
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-final-live-entry-20261126.yml
permissions:
  contents: read
jobs:
  live-entry:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-final-live-entry-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact merged public regression harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'c1bf042751f64acb61996f45c7f5eb5e3569b1dd'
          persist-credentials: false
      - name: Same supported Python 3.13 cache identity
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Actual live main anonymous entry and issued old/new archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = c1bf042751f64acb61996f45c7f5eb5e3569b1dd
          test "$(git hash-object tests/test_p07_m03_rc4_public_maintenance.py)" = 59f7f2d10de05361ad79f4e2f09c0ce883dec3a8
          root="$RUNNER_TEMP/p07-rc4-live"
          mkdir -m 700 "$root"
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          api=https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/assets
          fetch() { curl -q --proto '=https' --tlsv1.2 -fsSL --retry 1 --connect-timeout 10 --max-time 100 "$@"; }
          fetch https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o "$root/p07-toolbox.sh"
          fetch https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-m03-ownertrial147rc4-atomic.sh -o "$root/p07-m03-ownertrial147rc4-atomic.sh"
          test "$(git hash-object "$root/p07-toolbox.sh")" = 3cf8bc9e7727778e43a35262e58517d47526a7e1
          test "$(git hash-object "$root/p07-m03-ownertrial147rc4-atomic.sh")" = 688f83adbfed530583644f9e5ad2ae32f20fa483
          grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release146"' "$root/p07-toolbox.sh"
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc4"' "$root/p07-toolbox.sh"
          if ! fetch "$base/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip" -o "$root/old.zip"; then
            fetch -H 'Accept: application/octet-stream' "$api/781359770" -o "$root/old.zip"
          fi
          if ! fetch "$base/p07-m03-v0.1.0-release147-rc4-maintenance-20261125/P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip" -o "$root/new.zip"; then
            fetch -H 'Accept: application/octet-stream' "$api/793699101" -o "$root/new.zip"
          fi
          printf '%s  %s\n' '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d' "$root/old.zip" | sha256sum -c -
          printf '%s  %s\n' '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238' "$root/new.zip" | sha256sum -c -
          for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
            [[ ! -e "$p" && ! -L "$p" ]] || { echo P07_RC4_LIVE_HOST_NOT_EMPTY; exit 31; }
          done
          touch "$root/owned-sandbox"
          echo P07_RC4_LIVE_MAIN_ANONYMOUS_IDENTITY=PASS
          cat > "$root/live.py" <<'PY'
          import importlib.util,os,pathlib,sys,unittest
          file=pathlib.Path(sys.argv[1]).resolve()
          root=pathlib.Path(sys.argv[2]).resolve()
          spec=importlib.util.spec_from_file_location("published_exact_test",file)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.TOOLBOX=root/"p07-toolbox.sh"
          m.WRAPPER=root/"p07-m03-ownertrial147rc4-atomic.sh"
          class LiveEntry(m.RealEntry):
              def write_transport(self):
                  # Observe only destination URLs for the existing test assertions.
                  # The real system curl supplies EVERY response and exit status.
                  # No fixture response, token, alternate server or content substitution.
                  code='''#!/usr/bin/env python3
          import os,sys
          args=sys.argv[1:]
          url=next((x for x in args if x.startswith(("https://","file://"))),"")
          if url:
              with open(os.environ["VF_TEST_LOG"],"a") as f: f.write(url+"\\n")
          os.execv("/usr/bin/curl",["curl","-q",*args])
          '''
                  shim=self.shim/"curl"
                  shim.write_text(code)
                  shim.chmod(0o755)
                  for k in ("GH_TOKEN","GITHUB_TOKEN","GH_ENTERPRISE_TOKEN","VF_TEST_ZIP","VF_TEST_WRAPPER"):
                      self.env.pop(k,None)
              def entry(self,*args,**kwargs):
                  output=super().entry(*args,**kwargs)
                  for marker in ("独立维护程序已就绪","无须重新下载"):
                      if marker in output: print("LIVE_MARKER="+marker,flush=True)
                  return output
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite([LiveEntry("test_real_public_upgrade_legacy_caches_and_reentry")]))
          if not result.wasSuccessful() or result.testsRun!=1: sys.exit(32)
          print("P07_RC4_ACTUAL_LIVE_ANONYMOUS_UPGRADE_66_CACHES_AND_REENTRY=PASS")
          PY
          sudo env PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted P07_RC4_REAL_ENTRY=1 P07_RC3_ZIP="$root/old.zip" P07_RC4_ZIP="$root/new.zip" "$(command -v python3)" -B "$root/live.py" tests/test_p07_m03_rc4_public_maintenance.py "$root" >"$root/live.log" 2>&1 || { grep -E '^(LIVE_MARKER=|test_|FAIL:|ERROR:|AssertionError:|Ran [0-9]+ tests|FAILED)' "$root/live.log" | cut -c1-320; exit 32; }
          grep -E '^(LIVE_MARKER=|test_|Ran [0-9]+ tests|OK$|P07_RC4_ACTUAL)' "$root/live.log" | cut -c1-320
          grep -Fxq P07_RC4_ACTUAL_LIVE_ANONYMOUS_UPGRADE_66_CACHES_AND_REENTRY=PASS "$root/live.log"
      - name: Always verify ephemeral sandbox cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-rc4-live"
          rc=0
          if [[ -f "$root/owned-sandbox" ]]; then
            for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
              if [[ -e "$p" || -L "$p" ]]; then rc=1; sudo rm -rf -- "$p"; fi
            done
          fi
          rm -rf -- "$root"
          test "$rc" -eq 0
          echo P07_RC4_FINAL_LIVE_SANDBOX_CLEAN=PASS
