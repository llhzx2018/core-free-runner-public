name: R64 Focused Channel Provider Normalization Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r64-channel-provider-normalization.yml'

permissions:
  contents: read

jobs:
  r64-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 16b923f11729d1feb50fe62fd96cd52ac8c05de4
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 16b923f11729d1feb50fe62fd96cd52ac8c05de4
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_provider_normalization_contract.php
          php tests/unit/channel_provider_normalization_contract.php
          php tests/unit/channel_provider_context_facet_contract.php
          php tests/unit/channel_watch_search_context_contract.php
          echo R64_CHANNEL_PROVIDER_NORMALIZATION_PASS
          echo R64_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
