name: S01-C02 1.21.1058 Discovery Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_ops_discovery_1058
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Verify WordPress update discovery
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vf-ops-discovery-1058"
          WP="$ROOT/wordpress"
          mkdir -p "$WP" "$ROOT/release"

          gh release download v1.21.1057 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1057.zip --dir "$ROOT/release" --clobber
          test "$(sha256sum "$ROOT/release/vf-tools-ops_V1.21.1057.zip" | awk '{print $1}')" = "23c6763de53f5ea73fabefbf53502db14c192ac0b166ed7ea84e8faaaacc99e2"

          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          chmod +x "$ROOT/wp"
          wp(){ php "$ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_ops_discovery_1058 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18178 --title='Ops Discovery 1058' --admin_user=admin --admin_password='Fixture-Discovery-1058!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "$ROOT/release/vf-tools-ops_V1.21.1057.zip" --activate >/dev/null

          wp eval '$r=vf_ops_wp_update_manual_check_v1(); echo json_encode($r,JSON_UNESCAPED_SLASHES);' > "$ROOT/discovery.json"
          cat "$ROOT/discovery.json"

          jq -e '
            .ok==true
            and .status=="UPDATE_AVAILABLE"
            and .manifest.target_version=="1.21.1058"
            and .manifest.release_tag=="v1.21.1058"
            and .manifest.asset_name=="vf-tools-ops_V1.21.1058.zip"
            and .manifest.asset_bytes==3529411
            and .manifest.asset_sha256=="0a98e86b205ecb155c8fafbea791fb1312d64c47e708563eb092b47f93d22b11"
            and .release.target_version=="1.21.1058"
            and .release.asset_bytes==3529411
            and .release.asset_sha256=="0a98e86b205ecb155c8fafbea791fb1312d64c47e708563eb092b47f93d22b11"
          ' "$ROOT/discovery.json" >/dev/null

          echo WORDPRESS_DISCOVERY=PASS
