name: S01-C03 M3U8 WordPress Online Update Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-c03-m3u8-wp-online-update-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c03-m3u8-wp-online-update-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CANDIDATE_COMMIT: 641840273c1d1cd5d6b0fc2fad463faffb2e1588
      PUBLIC_EVIDENCE: ${{ github.workspace }}/evidence/s01-c03-m3u8-wp-online-update

    steps:
      - name: Checkout public execution shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require shared private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN is not configured.' >&2; exit 78; }
          echo 'PRIVATE_READ_TOKEN_PRESENT=YES'

      - name: Checkout exact private M3U8 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.1'
          test "$(git -C m3u8 rev-parse aeece9e2783bbadb0b431f2a531fd277646b8353^{commit})" = 'aeece9e2783bbadb0b431f2a531fd277646b8353'
          echo 'CANDIDATE_IDENTITY=PASS'

      - name: Provision PHP validation runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: fileinfo, sodium, zip
          coverage: none

      - name: Execute real WordPress Plugin_Upgrader fixture
        shell: bash
        working-directory: m3u8
        env:
          GITHUB_WORKSPACE_PRIVATE: ${{ github.workspace }}/m3u8
          VF_UPDATE_EVIDENCE_DIR: ${{ runner.temp }}/s01-c03-m3u8-private-evidence
        run: |
          set -Eeuo pipefail
          bash tests/wp-update/run.sh
          test -f "$VF_UPDATE_EVIDENCE_DIR/result.json"
          python3 - "$VF_UPDATE_EVIDENCE_DIR/result.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x.get('result')=='PASS'
          assert x.get('candidate_version')=='1.25.1'
          assert x.get('schema')=='1.2.0'
          assert x.get('fixture_semantics')=='SYNTHETIC_1.25.1_TO_1.25.2_NOT_PRODUCTION_PASS'
          assert all(v=='PASS' for v in x.get('checks',{}).values())
          print('WORDPRESS_PLUGIN_UPGRADER_FIXTURE=PASS')
          PY

      - name: Build redacted public evidence
        if: success()
        shell: bash
        env:
          PRIVATE_EVIDENCE: ${{ runner.temp }}/s01-c03-m3u8-private-evidence
        run: |
          set -Eeuo pipefail
          mkdir -p "$PUBLIC_EVIDENCE"
          python3 - "$PRIVATE_EVIDENCE/result.json" "$PUBLIC_EVIDENCE/result.json" "$CANDIDATE_COMMIT" <<'PY'
          import json,sys,datetime
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          out={'result':x['result'],'project_id':'S01','component_id':'S01-C03','component':'VF Tools M3U8','candidate_version':x['candidate_version'],'schema':x['schema'],'candidate_commit':sys.argv[3],'runtime_files':x['runtime_files'],'runtime_fingerprint':x['runtime_fingerprint'],'artifact':x['artifact'],'checks':x['checks'],'fixture_semantics':x['fixture_semantics'],'runner':'core-free-runner-public / GitHub Hosted ubuntu-24.04','evidence_privacy':'REDACTED_SUMMARY_ONLY_NO_SOURCE_NO_DB_NO_SESSION_NO_SECRET_NO_ZIP','observed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(out,open(sys.argv[2],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Public evidence privacy gate
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PUBLIC_EVIDENCE"
          if find "$PUBLIC_EVIDENCE" -type f \( -name '*.php' -o -name '*.js' -o -name '*.css' -o -name '*.sqlite' -o -name '*.db' -o -name '*.zip' -o -name '*.sql' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then echo 'Forbidden public evidence payload detected.' >&2; exit 91; fi
          if grep -RIlE 'VF_PRIVATE_READ_TOKEN[[:space:]]*[:=]|Bearer[[:space:]]+[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN [A-Z ]*PRIVATE KEY' "$PUBLIC_EVIDENCE" 2>/dev/null | grep -q .; then echo 'Potential credential payload detected.' >&2; exit 92; fi
          echo 'PUBLIC_EVIDENCE_PRIVACY=PASS'

      - name: Cleanup private source and raw evidence
        if: always()
        shell: bash
        run: |
          rm -rf m3u8 "$RUNNER_TEMP"/s01-c03-m3u8-private-evidence "$RUNNER_TEMP"/m3u8-wp-update-build || true
          echo 'PRIVATE_SOURCE_AND_RAW_EVIDENCE_CLEANUP=PASS'

      - name: Upload redacted candidate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-m3u8-wp-online-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/s01-c03-m3u8-wp-online-update/
          if-no-files-found: error
          retention-days: 30
