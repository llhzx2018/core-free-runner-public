name: P01 V2.36.1 Final Remote Online Update Gate
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths:
      - .github/workflows/p01-v2361-remote-online-final-20260901.yml
      - scripts/p01-v2361-remote-online-final.sh
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2361-final-owner
      PORT: '18761'
      ADMIN_PASS: 'P01V2361!FinalRemote'
      EVID: /tmp/p01-v2361-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout immutable V2.36.0 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.36.1 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.36.1 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 416cc8089b39349eb7ee62638b5267335d406320
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(git -C source rev-parse HEAD^{tree})" = 8af6d8ea6168fae52988cae8272a19073a0a7a2e
          test "$(git -C source rev-parse HEAD:src)" = ad3f96345ead330adffb20c7ecb3cdf6537036b6
          test "$(git -C target rev-parse HEAD)" = 23321270d79fc98d529c2c5a0ef07e0f1012835a
          test "$(git -C target rev-parse HEAD^{tree})" = 889d7662cf7907cc93d958c5df31f7824faa050a
          test "$(git -C target rev-parse HEAD:src)" = 91f92c5d3e7080469a7f5ab1497145454014c87a
          test "$(git -C updates rev-parse HEAD)" = 416cc8089b39349eb7ee62638b5267335d406320
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 416cc8089b39349eb7ee62638b5267335d406320
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 23321270d79fc98d529c2c5a0ef07e0f1012835a
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 23321270d79fc98d529c2c5a0ef07e0f1012835a
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.0 --jq .object.sha)" = 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.1 --jq .object.sha)" = 23321270d79fc98d529c2c5a0ef07e0f1012835a
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.1 --jq .id)" = 380234103
          for run in 33472637909 33472881503 33473351744 33473626306 33473995889 33474094279 33474210697; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          jq -e '.current_version=="2.36.0" and .target_version=="2.36.1" and .from_versions==["2.36.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.36.1" and .release_id==380234103 and .product_identity=="23321270d79fc98d529c2c5a0ef07e0f1012835a" and .asset_name=="VF_Start_V2.36.1_UPDATE.zip" and .asset_bytes==1391840 and .asset_sha256=="ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.1)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.36.1_UPDATE.zip")|.size' <<<"$REL")" = 1391840
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.36.1_UPDATE.zip")|.digest' <<<"$REL")" = sha256:ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf
          echo P01_V2361_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.36.1 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2361-remote-online-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2360_TO_V2361_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_SQLITE_INTEGRITY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_RUNTIME_DELTA_MATCH_TAG=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_SINGLE_SYSTEM_AUTH=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_LEGACY_QUERY_NO_EFFECT=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2361_LATEST_TERMINAL_STATE=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2360_TO_V2361_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2361_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2361_DATA_PRESERVATION=PASS
          P01_V2361_SQLITE_INTEGRITY=PASS
          P01_V2361_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2361_FIVE_DOMAIN_HTTP=PASS
          P01_V2361_RUNTIME_DELTA_MATCH_TAG=PASS
          P01_V2361_SINGLE_SYSTEM_AUTH=PASS
          P01_V2361_LEGACY_QUERY_NO_EFFECT=PASS
          P01_V2361_LATEST_TERMINAL_STATE=PASS
          P01_V2361_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2361-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2361-final-evidence
          if-no-files-found: warn
          retention-days: 90
