name: P01 D43 exact real FULL outer ZIP Ed25519 provenance isolated proof
on:
  push:
    branches:
      - test/p01-d43-signed-provenance-20261113

permissions:
  contents: read

jobs:
  signed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Scope and exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d43-signed-provenance-20261113"
          echo P01_D43_SCOPE=REAL_D37_FULL_SYNTHETIC_SIGNING_METADATA_ONLY
          echo P01_D43_PRODUCTION_WRITES=NO

      - name: Existing private source read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo P01_D43_PRIVATE_SOURCE_READ_CAPABILITY=PRESENT

      - name: Checkout exact private P01 candidate ephemerally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e218cc04c644bc1b459fe055696b4b064118493b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Prepare Laravel build PHP and Composer without database writes
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            php8.3-sqlite3 php8.3-mysql composer unzip >/dev/null
          php -r 'if(!extension_loaded("sodium")||!class_exists("ZipArchive")) exit(2);'
          node --version
          npm --version
          echo P01_D43_SIGN_VERIFY_AND_LOCKED_BUILD_DEPS=PASS

      - name: Exact Git source, strict PHP proof and independent source negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "e218cc04c644bc1b459fe055696b4b064118493b"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.515"
          php -l candidate/src/app/next/runtime/OfficialChannelReadiness.php
          php -l candidate/tests/unit/p01_d43_official_signed_release_gate_contract.php
          php -l candidate/tests/compatibility/laravel/http/p01_d43_signed_real_bundle_proof.php
          php candidate/tests/unit/p01_d43_official_signed_release_gate_contract.php
          python3 candidate/tests/architecture/test_p01_next_official_update_candidate.py
          python3 -m py_compile candidate/scripts/build_p01_next_official_update_candidate.py
          echo P01_D43_EXACT_SOURCE_NEGATIVES=PASS

      - name: Build verified genuine Laravel Composer Vite FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha e218cc04c644bc1b459fe055696b4b064118493b --output "$RUNNER_TEMP/p01-d43-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-d43-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d43-full.zip" \
            --output "$RUNNER_TEMP/p01-d43-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d43-cloudpanel.zip"
          echo P01_D43_EXACT_SOURCE_REAL_D37_CLOUDPANEL_FULL=PASS

      - name: Real FULL converted to unsigned official-shaped UPDATE and signed in-memory synthetic release checked
        shell: bash
        env:
          P01_D43_ISOLATED_PROOF: YES
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/p01-d43-private"
          candidate_file="$RUNNER_TEMP/p01-d43-private/VF_Start_Next_V2.47.515_UPDATE.zip"
          python3 candidate/scripts/build_p01_next_official_update_candidate.py build \
            --cloudpanel-full "$RUNNER_TEMP/p01-d43-cloudpanel.zip" \
            --from-version 2.47.514 \
            --from-source-sha 26478b89fc09cd2599e92211a06f6a56a6eca2fd \
            --output "$candidate_file"
          chmod 0600 "$candidate_file"
          python3 candidate/scripts/build_p01_next_official_update_candidate.py verify \
            --zip "$candidate_file"
          php candidate/tests/compatibility/laravel/http/p01_d43_signed_real_bundle_proof.php \
            "$candidate_file" 2.47.514 \
            26478b89fc09cd2599e92211a06f6a56a6eca2fd \
            e218cc04c644bc1b459fe055696b4b064118493b 2.47.515
          echo P01_D43_REAL_FULL_PACKAGE_BYTES_ED25519_OUTER_AND_INNER_DIGEST=PASS
          echo P01_D43_GENUINE_RELEASE_ASSET_AND_KEY=NOT_PUBLISHED
          echo P01_D43_OFFICIAL_INSTALLED_APPLY=NOT_CONNECTED

      - name: Private source and every generated ZIP cleaned
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -rf -- "$RUNNER_TEMP/p01-d43-private"
          rm -f -- "$RUNNER_TEMP/p01-d43-full.zip" "$RUNNER_TEMP/p01-d43-cloudpanel.zip"
          echo P01_D43_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_D43_TEST_ZIP_PERSISTED=NO
