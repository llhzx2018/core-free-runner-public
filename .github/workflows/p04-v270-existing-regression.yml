name: P04 V2.7 Existing Regression
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-existing-regression.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - name: Install browser runtime
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Existing regression
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/p04-result
          cd private
          printf 'VERSION=%s\n' "$(tr -d '\r\n' < VERSION)" > /tmp/p04-result/result.txt
          # Use the project's proven gate entrypoints when present. Only pass/fail names leave the runner.
          run_gate(){
            name="$1"; shift
            "$@" >/tmp/${name}.log 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then printf '%s=PASS\n' "$name" >> /tmp/p04-result/result.txt; else printf '%s=FAIL\n' "$name" >> /tmp/p04-result/result.txt; fi
            return $rc
          }
          overall=0
          if [ -f scripts/run-v258-browser-gate.sh ]; then run_gate V258_BROWSER bash scripts/run-v258-browser-gate.sh || overall=1; else printf 'V258_BROWSER=NOT_FOUND\n' >> /tmp/p04-result/result.txt; fi
          if [ -f tests/integration/backup_restore.php ]; then run_gate BACKUP_RESTORE php tests/integration/backup_restore.php || overall=1; else printf 'BACKUP_RESTORE=NOT_FOUND\n' >> /tmp/p04-result/result.txt; fi
          if [ -f tests/integration/domain_portfolio_contract_v258.php ]; then run_gate DOMAIN_CONTRACT php tests/integration/domain_portfolio_contract_v258.php || overall=1; else printf 'DOMAIN_CONTRACT=NOT_FOUND\n' >> /tmp/p04-result/result.txt; fi
          if [ -f tests/integration/provider_billing_pagination.php ]; then run_gate BILLING_PAGINATION php tests/integration/provider_billing_pagination.php || overall=1; else printf 'BILLING_PAGINATION=NOT_FOUND\n' >> /tmp/p04-result/result.txt; fi
          if [ $overall -eq 0 ]; then printf 'STATUS=PASS\n' >> /tmp/p04-result/result.txt; else printf 'STATUS=NEEDS_REVIEW\n' >> /tmp/p04-result/result.txt; fi
          exit 0
      - name: Publish safe result
        if: always()
        shell: bash
        run: |
          rm -rf private
          mkdir -p evidence
          cp /tmp/p04-result/result.txt evidence/p04-v270-existing-regression.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/p04-v270-existing-regression.txt
          git commit -m 'evidence(P04): V2.7 existing regression result' || exit 0
          git push origin HEAD:p04-v270-integration-gate
