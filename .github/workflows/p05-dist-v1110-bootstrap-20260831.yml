name: P05 V1.1.10 Public Distribution Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PUBLIC_TOKEN: ${{ github.token }}
      TAG: p05-dist-v1.1.10
      ASSET: VF_SEO_V1.1.10_FULL.zip
      EXPECTED_SHA256: 16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d
      EXPECTED_BYTES: '363138'
      SOURCE_COMMIT: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact private formal FULL
        run: |
          mkdir -p dist
          GH_TOKEN="$PRIVATE_TOKEN" gh release download v1.1.10 --repo llhzx2018/vf-seo --pattern "$ASSET" --dir dist
          test "$(stat -c %s "dist/$ASSET")" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  dist/$ASSET" | sha256sum -c -
      - name: Publish immutable public mirror
        run: |
          if GH_TOKEN="$PUBLIC_TOKEN" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            GH_TOKEN="$PUBLIC_TOKEN" gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir existing
            test "$(stat -c %s "existing/$ASSET")" = "$EXPECTED_BYTES"
            echo "$EXPECTED_SHA256  existing/$ASSET" | sha256sum -c -
          else
            GH_TOKEN="$PUBLIC_TOKEN" gh release create "$TAG" "dist/$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "P05 Public Distribution Mirror · v1.1.10" \
              --notes "Verified public distribution mirror for P05 VF SEO v1.1.10. Private source authority: llhzx2018/vf-seo@$SOURCE_COMMIT. Asset SHA-256: $EXPECTED_SHA256. This release is a distribution mirror only; it is not Source Truth or Production Truth."
          fi
      - name: Public anonymous readback
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          url='https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/tags/'+os.environ['TAG']
          req=urllib.request.Request(url, headers={'User-Agent':'VF-P05-Dist-Gate','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=20) as r: data=json.load(r)
          assert data['tag_name']==os.environ['TAG']
          asset=next(a for a in data['assets'] if a['name']==os.environ['ASSET'])
          assert int(asset['size'])==int(os.environ['EXPECTED_BYTES'])
          assert asset.get('digest')=='sha256:'+os.environ['EXPECTED_SHA256']
          print('P05_PUBLIC_DISTRIBUTION_V1110=PASS')
          print('P05_PUBLIC_DISTRIBUTION_ANONYMOUS_READBACK=PASS')
          PY
