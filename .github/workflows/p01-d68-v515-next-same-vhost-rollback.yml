name: P01 D68 same-HTTPS-host real old v515 to Laravel and back
on:
  push:
    branches:
      - test/p01-d68-actual-vhost-cutover-rollback-20261113
permissions:
  contents: read
jobs:
  official-to-next-native-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - name: Checkout exact private source only into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 337374140bb1421efeeb3fcba66415904ec26351
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact candidate source and synthetic runtime scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d68-actual-vhost-cutover-rollback-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "337374140bb1421efeeb3fcba66415904ec26351"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test -f candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          python3 -m py_compile candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py             candidate/tests/compatibility/laravel/http/run_d67_official_to_laravel_https.py
          echo "P01_D68_EXACT_PRODUCT_SOURCE=337374140bb1421efeeb3fcba66415904ec26351"
          echo "P01_D68_OFFICIAL_OLD_INPUT_REAL_USER_DATA=NONE"
      - name: Isolated native Nginx TLS PHP FPM and framework build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d68-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql             php8.3-mbstring php8.3-curl php8.3-xml php8.3-zip             composer openssl unzip >> "$RUNNER_TEMP/d68-apt.txt" 2>&1
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d67_seal_official_old_clone.php
          command -v nginx
          command -v php-fpm8.3
          command -v composer
          echo "P01_D68_REAL_NATIVE_FPM_READY=PASS"
      - name: Download OFFICIAL v2.47.515 FULL and validate authentic asset SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d68-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start             --pattern VF-Start-V2.47.515-FULL.zip             --dir "$RUNNER_TEMP/d68-official"             > "$RUNNER_TEMP/d68-download.txt" 2>&1
          file="$RUNNER_TEMP/d68-official/VF-Start-V2.47.515-FULL.zip"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D68_AUTHENTIC_OLD_GITHUB_RELEASE=PASS"
      - name: Rebuild real complete native Laravel 13 CloudPanel FULL from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha 337374140bb1421efeeb3fcba66415904ec26351             --output "$RUNNER_TEMP/d68-clean-full.zip" --composer composer             > "$RUNNER_TEMP/d68-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/d68-clean-full.zip"             > "$RUNNER_TEMP/d68-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build             --source-zip "$RUNNER_TEMP/d68-clean-full.zip"             --output "$RUNNER_TEMP/d68-cloudpanel-full.zip"             > "$RUNNER_TEMP/d68-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify             --zip "$RUNNER_TEMP/d68-cloudpanel-full.zip"             > "$RUNNER_TEMP/d68-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d68-cloudpanel-full.zip"
          echo "P01_D68_LARAVEL_13_FULL_REAL_PACKAGED=PASS"
      - name: Prepare locked Laravel library for D66 offline old-source converter
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev             --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins             > "$RUNNER_TEMP/d68-converter-composer.txt" 2>&1
          test -f candidate/src/app/next/vendor/autoload.php
          echo "P01_D68_D66_NATIVE_LARAVEL_OFFLINE_CONVERTER=READY"
      - name: Real old installer then native Next sealed session and failure recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES             python3 candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py               --release-full "$RUNNER_TEMP/d68-official/VF-Start-V2.47.515-FULL.zip"               --candidate-root candidate               --future-bundle "$RUNNER_TEMP/d68-cloudpanel-full.zip"               > "$RUNNER_TEMP/d68-results.txt" 2>&1; then
            grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d68-results.txt" | tail -n 60 || true
            exit 1
          fi
          grep '^P01_D[0-9][0-9]_' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D65_REAL_OLD_RELEASE_HTTP_CSRF_INSTALL_SETUP_LOCK=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D66_ACTUAL_INSTALLED_OLD_DATABASE_TO_NEW35_TABLE_CLONE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_INSTALLATION_SEALED_AFTER_REAL_OLD_CLONE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_OLD_OWNER_NO_RESET_NATIVE_CREDENTIAL_STORE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_OFFICIAL_OLD_OWNER_LOGIN_AND_PRIVATE_HTTP_READ=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_REAL_LARAVEL_AUTH_CSRF_AND_OLD_RECORD_NEW_WRITE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_CORRUPT_SEAL_FAIL_CLOSED_EXACT_RESTORE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_ORIGINAL_OFFICIAL_OLD_INSTALL_UNCHANGED=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_ACTUAL_OLD515_HTTPS_FPM=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D68_SAME_HOST_CUTOVER_TO_SEALED_NEXT=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D68_FAILURE_ROLLBACK_TO_SAME_OLD515_HTTPS_ROOT=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D68_SITE_ROOT_SWAP_TEST_IS_OWNER_ATOMIC=NO' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_COMPLETE_OLD_TO_NEXT_ISOLATED_HTTP_PHASE=PASS' "$RUNNER_TEMP/d68-results.txt"
          grep -Fx 'P01_D67_INSTALLED_REAL_ATOMIC_UPDATE_WITH_CODE_POINTER=NOT_PROVEN' "$RUNNER_TEMP/d68-results.txt"
          echo 'P01_D68_SAME_HOST_ROLLBACK_COMPLETE_SCOPED_GATE=PASS'
      - name: Always cleanup source, official asset, code package and synthetic state
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d68-official"
          rm -f -- "$RUNNER_TEMP"/d68-*.txt "$RUNNER_TEMP"/d68-*.zip
          echo "P01_D68_PRIVATE_SOURCE_ASSET_AND_USER_DATA_PERSISTED=NO"
          echo "P01_D68_PUBLIC_ARTIFACTS=NONE"
