name: P07 Fio Pin Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p07-nodebench-adoption-rc5
    paths:
      - .github/workflows/p07-fio-pin-probe.yml

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Compute exact YABS fio hashes
        shell: bash
        run: |
          set -euo pipefail
          commit='f8c6a48cd6ff85b54c5cd2504f0807462dc58938'
          for arch in x64 aarch64; do
            url="https://raw.githubusercontent.com/masonr/yet-another-bench-script/${commit}/bin/fio/fio_${arch}"
            curl -fL --retry 3 --connect-timeout 10 "$url" -o "fio_${arch}"
            chmod +x "fio_${arch}"
            sha256sum "fio_${arch}"
            file "fio_${arch}"
          done
          ./fio_x64 --version
