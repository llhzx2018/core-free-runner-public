name: P01 V2.36.4 Formal Staging Composite R7
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-staging-composite-r7-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      EXPECTED_DEVELOP: 5615d19b07303132e8fc2e374de1236a37f3cb16
      EXPECTED_MAIN: d35038c32b5a287636ee92d9fe074ea12c1469ef
      STRICT_RUN: '33521577888'
      STAGING_R4: '33522551434'
      AUTH_DIFF_RUN: '33523179319'
      STAGING_BRANCH: release/p01-v2364-formal-staging-r7-20260901
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Build exact composite release authority and push staging
        shell: bash
        env:
          RUNNER_TOKEN: ${{ github.token }}
          VF_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          for run in "$STRICT_RUN" "$STAGING_R4" "$AUTH_DIFF_RUN"; do test "$(GH_TOKEN="$RUNNER_TOKEN" gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          test "$(GH_TOKEN="$VF_TOKEN" gh api repos/llhzx2018/vf-start/pulls/188 --jq .state)" = closed
          test "$(GH_TOKEN="$VF_TOKEN" gh api repos/llhzx2018/vf-start/pulls/188 --jq .merged)" = false
          cd p01
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin "refs/heads/$STAGING_BRANCH" >/dev/null 2>&1; then echo UNEXPECTED_EXISTING_R7_BRANCH; exit 20; fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.4 >/dev/null 2>&1; then echo UNEXPECTED_V2364_TAG; exit 21; fi
          git fetch origin "$FORMAL_SOURCE" --quiet
          test "$(git rev-parse "$FORMAL_SOURCE^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"
          git show "$EXPECTED_DEVELOP:VF_PROJECT.json" > /tmp/develop-vf.json
          git show "$FORMAL_SOURCE:VF_PROJECT.json" > /tmp/formal-vf.json
          git switch -c "$STAGING_BRANCH" "$EXPECTED_DEVELOP"
          git checkout "$FORMAL_SOURCE" -- CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          python3 - <<'PY'
          import json
          D=json.load(open('/tmp/develop-vf.json'))
          F=json.load(open('/tmp/formal-vf.json'))
          for k in ('current_production_evidence','current_formal_release_evidence','current_l2_develop_evidence'):
              F['authority'][k]=D['authority'][k]
          F['owner_production_closure_evidence']=D['owner_production_closure_evidence']
          F['v2_36_3_release_chain']=D['v2_36_3_release_chain']
          with open('VF_PROJECT.json','w',encoding='utf-8') as h:
              json.dump(F,h,ensure_ascii=False,indent=2)
              h.write('\n')
          PY
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          EXPECTED_SCOPE='CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php '
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$EXPECTED_SCOPE"
          git diff --cached --check
          for f in CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php; do test "$(git hash-object "$f")" = "$(git rev-parse "$FORMAL_SOURCE:$f")"; done
          python3 - <<'PY'
          import json
          D=json.load(open('/tmp/develop-vf.json'))
          F=json.load(open('/tmp/formal-vf.json'))
          C=json.load(open('VF_PROJECT.json'))
          for k in ('current_production_evidence','current_formal_release_evidence','current_l2_develop_evidence'):
              F['authority'][k]=D['authority'][k]
          F['owner_production_closure_evidence']=D['owner_production_closure_evidence']
          F['v2_36_3_release_chain']=D['v2_36_3_release_chain']
          assert C == F
          assert C['production_version']=='2.36.3'
          assert C['working_version']=='2.36.4'
          assert C['target_release_version']=='2.36.4'
          assert C['v2_36_4_candidate_gate']['state']=='PASS'
          assert C['v2_36_4_release_candidate']['version']=='2.36.4'
          assert C['owner_production_closure_evidence']['version']=='2.36.3'
          assert C['v2_36_3_release_chain']['result']=='PASS'
          assert C['authority']['current_production_evidence']=='docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md'
          assert C['authority']['current_formal_release_evidence']=='docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md'
          assert C['authority']['current_l2_develop_evidence']=='docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md'
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'release(P01): stage V2.36.4 composite formal authority'
          STAGED=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do test "$(git rev-parse "$STAGED:$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"; done
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
          test "$(git ls-remote origin refs/heads/$STAGING_BRANCH | awk '{print $1}')" = "$STAGED"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          printf 'P01_V2364_FORMAL_STAGING_COMPOSITE_R7=PASS\nSTAGED=%s\nRUNTIME_TREE=%s\nBASE_DEVELOP=%s\nMAIN=%s\nFORMAL_SOURCE=%s\nVF_PROJECT_MODE=FORMAL_CANDIDATE_PLUS_V2363_CLOSURE_AUTHORITY\nPRESERVED_JSON=authority.current_production_evidence,authority.current_formal_release_evidence,authority.current_l2_develop_evidence,owner_production_closure_evidence,v2_36_3_release_chain\nSCOPE=CHANGELOG.md,VERSION,VF_PROJECT.json,src/VERSION.txt,src/app/bootstrap.php\nMAIN_WRITE=NO\nTAG_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$STAGED" "$RUNTIME_TREE" "$EXPECTED_DEVELOP" "$EXPECTED_MAIN" "$FORMAL_SOURCE" | tee /tmp/p01-v2364-formal-staging-composite-r7.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-formal-staging-composite-r7-${{ github.run_id }}
          path: /tmp/p01-v2364-formal-staging-composite-r7.txt
          if-no-files-found: error
          retention-days: 90
