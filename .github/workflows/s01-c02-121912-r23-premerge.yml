name: S01-C02 1.21.912 R23 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 0534d343b91aced412b2ad16a0f3135d50ad74f7
      BASE_SHA: bc80400be13c84d43096f94d413c72a09da0ee6a

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 0534d343b91aced412b2ad16a0f3135d50ad74f7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R23 exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.912"
          php ops/tests/s01-c02-121912-surface-density-consistency-r23-contract.php
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121912-surface-density-consistency-r23-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          page_files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
          ]
          forbidden=[
            '.vf-ops-v6-shell','.vf-v6-shell-header','.vf-v6-domain-nav',
            '.vf-v6-domain-mobile','.vf-v6-brand-mark','.vf-v6-brand-copy',
            '.vf-v8-current-domain',
          ]
          for name in page_files:
              s=(Path('ops/assets/css/current')/name).read_text(encoding='utf-8')
              assert s.count('{')==s.count('}'), name
              for needle in forbidden:
                  assert needle not in s, f'page owns shell: {name} {needle}'
              for token in [
                  'var(--vf-v6-page-bg)',
                  'var(--vf-v6-surface-border)',
                  'var(--vf-v6-surface-border-soft)',
                  'var(--vf-v6-surface-radius)',
                  'var(--vf-v6-section-title-size)',
              ]:
                  assert token in s, f'{name} missing {token}'
          print('PASS_R23_SURFACE_DENSITY')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"
          echo PASS_S01_C02_121912_R23_PREMERGE
