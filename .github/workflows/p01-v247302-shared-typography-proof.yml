name: P01 shared Backup typography source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247302-shared-typography-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 16028887c965370e09c606171dfc40914de8f649
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout prior official release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.301
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: PHP 8.3 and PDO SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Focused Backup shared type and functionality regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 16028887c965370e09c606171dfc40914de8f649
          php -l tests/unit/admin_backup_typography_readability_contract.php
          php tests/unit/admin_backup_typography_readability_contract.php
          php tests/unit/admin_data_safety_page8_polish_contract.php
          php tests/unit/backup_storage_capacity_readonly_contract.php
          php tests/unit/backup_upgrade_retention_preview_v247298_contract.php
          node --check src/assets/data-recovery.js
          node tests/browser/backup_missing_alert_v247297_smoke.cjs
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          echo P01_BACKUP_SHARED_TYPE_FOCUSED=PASS
      - name: Canonical zero-debt against stable
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_BACKUP_SHARED_TYPE_CANONICAL=PASS
