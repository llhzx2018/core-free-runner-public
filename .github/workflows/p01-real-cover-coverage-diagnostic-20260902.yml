name: P01 Real Cover Coverage Diagnostic
on:
  push:
    branches: [tmp/p01-cover-coverage-diagnostic-20260902]
    paths: [.github/workflows/p01-real-cover-coverage-diagnostic-20260902.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: 63916e73ac8a925a0b6d538b85d923db2f906794
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-real-cover/evidence
      PW: /tmp/p01-real-cover/pw
      PORT: '18555'
      ADMIN_PASS: P01RealCover2026
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence and fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-real-cover; mkdir -p "$EVID" "$PW"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'SOURCE=%s\nREMOTE_DEVELOP=%s\n' "$SOURCE" "$REMOTE" | tee "$EVID/source.txt"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-real-cover.pid
          COOKIE=/tmp/p01-real-cover.cookies
          for i in $(seq 1 60); do if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then break; fi; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Real Cover Coverage' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Seed real mixed URLs and refresh covers
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/refresh.txt"
          <?php
          declare(strict_types=1);
          require getenv('ROOT').'/app/bootstrap.php';
          require getenv('ROOT').'/app/Repository.php';
          require getenv('ROOT').'/app/SurfaceRepository.php';
          require getenv('ROOT').'/app/ResourceCoverCache.php';
          $db=vf_db(); $repo=new VfRepository($db); $surface=new VfSurfaceRepository($db); $cover=new VfResourceCoverCache($db);
          $cat=$repo->createCategory(['name'=>'Real Cover Diagnostic','parent_id'=>null,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>0]);
          $samples=[
            ['youtube-video','watch','YouTube Video','https://www.youtube.com/watch?v=dQw4w9WgXcQ','电影'],
            ['youtube-channel','channels','Google Developers Channel','https://www.youtube.com/@GoogleDevelopers','频道'],
            ['bilibili-video','watch','Bilibili Video','https://www.bilibili.com/video/BV1GJ411x7h7/','电影'],
            ['apple-podcast','channels','Apple Podcast','https://podcasts.apple.com/us/podcast/the-daily/id1200361736','播客'],
            ['wikipedia-film','watch','Wikipedia Film','https://en.wikipedia.org/wiki/Interstellar_(film)','电影'],
            ['no-cover','channels','No Cover Example','https://example.com/','频道'],
          ];
          $rows=[];
          foreach($samples as [$key,$domain,$title,$url,$kind]){
            $saved=$repo->saveLink(null,['category_id'=>$cat,'title'=>$title,'url'=>$url,'description'=>'real cover diagnostic','is_private'=>0],'manual');
            $id=(int)$saved['id'];
            $surface->upsertProfile($id,['surface'=>$domain,'resource_kind'=>$kind,'note'=>'','background_friendly'=>0,'media_year'=>'','media_status'=>'','source_kind'=>'remote_url','source_ref'=>'']);
            $start=microtime(true);
            try{$result=$cover->refreshOne($id,true);}catch(Throwable $e){$result=['id'=>$id,'success'=>false,'error'=>$e->getMessage()];}
            $result['key']=$key;$result['domain']=$domain;$result['title']=$title;$result['url']=$url;$result['elapsed_ms']=(int)round((microtime(true)-$start)*1000);$rows[]=$result;
            echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          file_put_contents(getenv('EVID').'/refresh.json',json_encode($rows,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          $assets=$surface->allAssets(true); $projection=[];
          foreach($assets as $a){if(in_array((string)$a['title'],array_column($samples,2),true))$projection[]=['id'=>$a['id'],'title'=>$a['title'],'surface'=>$a['surface'],'provider'=>$a['provider'],'cover_url'=>$a['cover_url']??'','cover_source'=>$a['cover_source']??''];}
          file_put_contents(getenv('EVID').'/projection.json',json_encode($projection,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());$fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));
          echo "INTEGRITY=$integrity\nFK=$fk\n"; if($integrity!=='ok'||$fk!==0)exit(3);
          $ytv=array_values(array_filter($rows,fn($x)=>$x['key']==='youtube-video'))[0]??[];
          $ytc=array_values(array_filter($rows,fn($x)=>$x['key']==='youtube-channel'))[0]??[];
          if(empty($ytv['success'])){fwrite(STDERR,"YOUTUBE_VIDEO_REQUIRED_SUCCESS\n");exit(4);}
          if(empty($ytc['success'])){fwrite(STDERR,"YOUTUBE_CHANNEL_REQUIRED_SUCCESS\n");exit(5);}
          PHP
        env:
          EVID: ${{ env.EVID }}
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PW"; npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install chromium
      - name: Public UI fallback and broken-image readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PW/ui.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,out=process.env.EVID;
          const browser=await chromium.launch({headless:true}); const reports=[];
          for(const route of ['channels.php','watch.php']){
            const page=await browser.newPage({viewport:{width:390,height:900}});const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('pageerror',e=>pageErrors.push(String(e)));
            const response=await page.goto(`${base}/${route}`,{waitUntil:'networkidle',timeout:30000});await page.waitForTimeout(300);
            const report=await page.evaluate(()=>{
              const imgs=[...document.images].map(img=>({src:img.getAttribute('src')||'',complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}));
              const broken=imgs.filter(x=>x.src&&x.complete&&x.naturalWidth===0);
              return {scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,bodyText:document.body.innerText,imgs,broken};
            });
            report.route=route;report.http=response?.status()||0;report.consoleErrors=consoleErrors;report.pageErrors=pageErrors;reports.push(report);
            await page.screenshot({path:`${out}/${route.replace('.php','')}-390.png`,fullPage:true});console.log(JSON.stringify({route,http:report.http,scrollWidth:report.scrollWidth,clientWidth:report.clientWidth,imgCount:report.imgs.length,broken:report.broken,consoleErrors,pageErrors}));
            if(report.http!==200||report.scrollWidth>report.clientWidth||report.broken.length||pageErrors.length)process.exit(6);
            if(consoleErrors.some(x=>x.includes('MIME type')))process.exit(7);
            if(route==='channels.php'&&(!report.bodyText.includes('Google Developers Channel')||!report.bodyText.includes('No Cover Example')))process.exit(8);
            if(route==='watch.php'&&!report.bodyText.includes('YouTube Video'))process.exit(9);
            await page.close();
          }
          fs.writeFileSync(`${out}/ui.json`,JSON.stringify(reports,null,2));await browser.close();console.log('P01_REAL_COVER_UI_READBACK=PASS');
          JS
          cd "$PW"; PORT="$PORT" EVID="$EVID" node ui.mjs | tee "$EVID/ui.txt"
      - name: Summarize coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$EVID/refresh.json" <<'PY' | tee "$EVID/coverage.txt"
          import json,sys
          rows=json.load(open(sys.argv[1],encoding='utf-8'))
          ok=[r for r in rows if r.get('success')]; fail=[r for r in rows if not r.get('success')]
          print(f'TOTAL={len(rows)} SUCCESS={len(ok)} FAILURE={len(fail)}')
          for r in rows: print(f"{r['key']}|{'PASS' if r.get('success') else 'FAIL'}|{r.get('provider','')}|{r.get('elapsed_ms')}ms|{r.get('source',r.get('error',''))}")
          PY
      - name: Boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'P01_REF_WRITE=NO\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' | tee "$EVID/boundary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-real-cover-coverage-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-real-cover.pid 2>/dev/null)" 2>/dev/null || true
