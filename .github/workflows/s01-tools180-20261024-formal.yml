name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-tools180-20261024]
    paths: ['.github/workflows/s01-tools180-20261024-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.180
  TARGET_SHA: 3c227bcf8cfed885ac1cb290a250eda91fcf1445
  TARGET_TREE: f877e613c7a0f4120056034f1a21f23b077695fa
  BASE_SHA: a3ba950ee11f0d6c37800787754940d8cfe2bb89
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3c227bcf8cfed885ac1cb290a250eda91fcf1445
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40052244469 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40052244469 --jq .head_sha)" = 7fdb7b6e0c51b75090dbaa62bc4f519ff86486e3
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40052244469 --repo llhzx2018/core-free-runner-public --name s01-home-40052244469 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-tools180-20261024/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='ecd4a1695d90e0e31eb81e4aadb3b064067a5298'
          phases={phase:json.loads((r/(phase+'-directory.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['write_requests']==[] and result['errors']==[]
              assert len(result['rows'])==4
              assert {(x['language'],x['width']) for x in result['rows']}=={(lang,width) for lang in ['en','zh'] for width in [1440,1024]}
              fixed=phase in ['upgrade','after']
              for row in result['rows']:
                  o=row['observed']
                  assert row['result']=='PASS' and o['overflow'] is False
                  assert o['version']==('1.35.180' if fixed else '1.35.179')
                  assert len(o['h1'])==len(o['canonical'])==1 and len(o['tools'])==11
                  if fixed:
                      assert o['groups']==[] and o['grids']==1 and o['recommendations']==0
                      assert o['customIntro']==0 and o['hero']['align']=='center'
                      assert all(x['tag']=='A' and x['nested']==0 and x['purpose']['align']==x['titleBox']['align']=='left' for x in o['cards'])
                      assert all(145<=x['box']['height']<245 for x in o['cards'])
                      assert len({round(x['box']['y']) for x in o['cards'][:3]})==1
                      assert all(not x['open'] and x['box']['height']<=x['summary']['height']+2 for x in o['questions'])
                      assert o['faq']['x']>o['faqHead']['right']+25 and o['grid']['y']<430
                  else:
                      assert len(o['groups'])==4 and o['recommendations']==1
              if phase in ['before','after']:
                  assert {x['language'] for x in result['interactions']}=={'en','zh'}
                  keys=['faq_keyboard','query_zero_escape','task_filter_reset','native_get_search_reset']
                  if fixed:keys+=['whole_card_keyboard','no_js_filter_search','empty_reset']
                  assert all(x[k]=='PASS' for x in result['interactions'] for k in keys)
                  for lang in ['en','zh']:
                      for width in [1440,1024]:assert (r/(phase+'-tools-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
          for before,after in zip(phases['before']['rows'],phases['after']['rows']):
              a,b=before['observed'],after['observed']
              for key in ['h1','canonical','hreflang','tools','shell']:assert a[key]==b[key]
              assert [(x['q'],x['a']) for x in a['questions']]==[(x['q'],x['a']) for x in b['questions']]
              assert b['bodyHeight']<a['bodyHeight']*.8
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='39bd2d187f51e8c2c0a9e140e02fa7bcad6fc555f635ff84699fc6c4b280db85' and new['bytes']==1983466
          coverage=json.loads(pathlib.Path('control/lanes/s01-tools180-20261024/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='ecd4a1695d90e0e31eb81e4aadb3b064067a5298' and coverage['tree']=='f877e613c7a0f4120056034f1a21f23b077695fa'
          assert coverage['owner_preview']=='N_A per unchanged Theme SSOT15'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40052244469'
          coverage['merged_source']='3c227bcf8cfed885ac1cb290a250eda91fcf1445'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.180 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.180 provider/vf-tools-theme_V1.35.180.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.180' --notes '按 OWNER 已确认的 Smallpdf/iLovePDF 整页原型重做中英文工具目录：单标题与简短介绍、集中搜索分类、连续三列工具网格、图标/名称/用途/箭头整卡链接，以及三条紧凑 FAQ。去除四段大分组、普遍可用徽章、重复按钮、卡片详情折叠和重复推荐步骤。自定义文案、真实工具 URL、Canonical H1/SEO、语言配对、历史配置和人工记录保留，后台选项及检查期望与实际输出一致。精确候选已在隔离 WordPress 完成 EN/ZH1440/1024、搜索零结果恢复、键盘整卡进入、无JS原生GET、干净安装与升级/回退/重装数据保护验证。476运行文件；M3U8保持1.25.94，Ops未改。Production由OWNER手工升级；手机实机暂缓，正式站最终人工验收仍待完成。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.180 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.180 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.180 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.180.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.180.zip remote/vf-tools-theme_V1.35.180.zip
          echo '39bd2d187f51e8c2c0a9e140e02fa7bcad6fc555f635ff84699fc6c4b280db85  remote/vf-tools-theme_V1.35.180.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.180.zip)" = 1983466
          gh release view v1.35.180 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
