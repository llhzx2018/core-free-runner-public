name: P01 509 official FULL Atomic release exact verified source
on:
  push:
    branches:
      - task/p01-509-official-release-20261109
permissions:
  contents: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT: llhzx2018/vf-start
      SHA: 5c8ae0e159187e20b6ff69c3c776480f6ceb805e
      TREE: 1858282e5da2191c00eb1f9bc418bc707919c05f
      BASE: 2.47.508
      TARGET: 2.47.509
      TAG: v2.47.509
      WORK: /tmp/p01-formal-509-20261109
    steps:
      - name: Checkout registered public release builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact merged private product transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p01-exact
      - name: Install isolated packaging prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-xml php-mbstring php-curl php-zip php-gd zip unzip jq >/dev/null
          test "$(git -C p01-exact rev-parse HEAD)" = "$SHA"
          test "$(git -C p01-exact rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat p01-exact/VERSION)" = "$TARGET"
          test "$(cat p01-exact/src/VERSION.txt)" = "$TARGET"
          grep -Fx "define('VF_VERSION', '2.47.509');" p01-exact/src/app/bootstrap.php
          echo P01_509_FINAL_MERGED_SOURCE=PASS
      - name: Build exact official FULL and one-file Atomic from published 507
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$WORK/download" "$WORK/baseline" "$WORK/prior" "$WORK/output"
          gh release download "v$BASE" -R "$PRODUCT" -D "$WORK/download" -p "VF-Start-V$BASE-FULL.zip" -p "VF_Start_V${BASE}_UPDATE.zip"
          echo 'e9d184f7527cd1f4c195df9992aae54be371d31a702c94258b4ebef34716b06d  '"$WORK"'/download/VF-Start-V2.47.508-FULL.zip' | sha256sum -c -
          echo '12114db75f4cd816a56055be59d1ef3a90384eb5336cc8abea08d82991824b26  '"$WORK"'/download/VF_Start_V2.47.508_UPDATE.zip' | sha256sum -c -
          unzip -q "$WORK/download/VF-Start-V$BASE-FULL.zip" -d "$WORK/baseline"
          unzip -q "$WORK/download/VF_Start_V${BASE}_UPDATE.zip" -d "$WORK/prior"
          python3 scripts/p01-maintenance-release.py --candidate p01-exact/src --baseline-full "$WORK/baseline" --baseline-repair "$WORK/prior/repair-v$BASE.php" --out "$WORK/output" --version "$TARGET" --source-version "$BASE" --target-sha "$SHA" --target-tree "$TREE" > "$WORK/receipt.json"
          jq -e --arg sha "$SHA" --arg tree "$TREE" --arg target "$TARGET" '.target_sha==$sha and .target_tree==$tree and .version==$target' "$WORK/receipt.json" >/dev/null
          full="$WORK/output/VF-Start-V$TARGET-FULL.zip"
          update="$WORK/output/VF_Start_V${TARGET}_UPDATE.zip"
          test -s "$full" && test -s "$update"
          unzip -t "$full" >/dev/null
          unzip -t "$update" >/dev/null
          test "$(unzip -Z1 "$update")" = "repair-v$TARGET.php"
          if unzip -Z1 "$full" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/|news-cache/)' >/dev/null; then echo P01_509_PRIVATE_DATA_IN_FULL=FAIL;exit 77;fi
          unzip -q "$update" -d "$WORK/test-repair"
          php -l "$WORK/test-repair/repair-v$TARGET.php" >/dev/null
          php "$WORK/test-repair/repair-v$TARGET.php" --self-test | grep -F '"ok":true' >/dev/null
          echo P01_509_EXACT_FORMAL_FULL_ATOMIC_BUILD=PASS
          echo "P01_509_FULL_SHA256=$(sha256sum "$full"|cut -d' ' -f1)"
          echo "P01_509_ATOMIC_SHA256=$(sha256sum "$update"|cut -d' ' -f1)"
          echo "P01_509_ATOMIC_BYTES=$(wc -c < "$update" | tr -d ' ')"
      - name: Create GitHub formal release only at exact verified main SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PRODUCT/git/ref/heads/main" --jq '.object.sha')" = "$SHA"
          test "$(gh api "repos/$PRODUCT/releases/latest" --jq '.tag_name')" = "v$BASE"
          if gh api "repos/$PRODUCT/git/ref/tags/$TAG" >/dev/null 2>&1; then echo P01_509_TAG_COLLISION;exit 48;fi
          if gh release view "$TAG" -R "$PRODUCT" >/dev/null 2>&1; then echo P01_509_RELEASE_EXISTS;exit 49;fi
          cat > "$WORK/RELEASE_NOTES.md" <<'EOT'
          # P01 VF Start 2.47.509 · 新闻订阅体验正式发布
          - 新闻第一批定制为 11 家不同网站，每网站一个选择开关；9 个只读 RSS/Atom 来源，仅手动点击才刷新所选，白鲸出海与联合早报 2 家官网直达，完全不抓取。
          - 重复文章按可信网址或短时相同长标题合并，保持不同日期报道；来源筛选可折叠，原位管理有搜索、已选/可同步数、保存回读与筛选。
          - 保留既有 Owner 私密缓存、收藏、Pending 收集箱、CAS 设置，游客不得读取任何未经授权的新闻标题/热点/私人选择，新闻源仅个人阅读，不取得公开转载许可。
          - 来源 9/9 真实 HTTPS/XML、Chromium 112、Canonical 810 项零新增回归、正式 v2.47.508→v2.47.509 Atomic+BackupManager 实际恢复及失败回滚通过。
          - 唯一受支持的当前来源是 2.47.508。FULL 只用于干净首次安装，已安装网站只使用 Atomic UPDATE，不能覆盖现有文件。
          - Owner 在升级 Production 前手工备份文件、SQLite/WAL/SHM、私有配置、媒体与恢复包，再从后台点击升级并亲自验收；本 Release 不触碰 Production。
          EOT
          gh release create "$TAG" "$WORK/output/VF-Start-V$TARGET-FULL.zip" "$WORK/output/VF_Start_V${TARGET}_UPDATE.zip" -R "$PRODUCT" --target "$SHA" --title "VF Start v$TARGET — News Private RSS UX" --notes-file "$WORK/RELEASE_NOTES.md"
          echo P01_509_GITHUB_FORMAL_RELEASE_CREATED=YES
      - name: Read back formal release tag and independently byte-verify downloaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$PRODUCT/releases/tags/$TAG" > "$WORK/formal.json"
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false and (.assets|length)==2' "$WORK/formal.json" >/dev/null
          test "$(gh api "repos/$PRODUCT/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          mkdir -p "$WORK/remote"
          gh release download "$TAG" -R "$PRODUCT" -D "$WORK/remote" -p "VF-Start-V$TARGET-FULL.zip" -p "VF_Start_V${TARGET}_UPDATE.zip"
          cmp "$WORK/output/VF-Start-V$TARGET-FULL.zip" "$WORK/remote/VF-Start-V$TARGET-FULL.zip"
          cmp "$WORK/output/VF_Start_V${TARGET}_UPDATE.zip" "$WORK/remote/VF_Start_V${TARGET}_UPDATE.zip"
          echo "P01_509_RELEASE_ID=$(jq -r .id "$WORK/formal.json")"
          echo "P01_509_RELEASED_AT=$(jq -r .published_at "$WORK/formal.json")"
          echo "P01_509_VERIFIED_ATOMIC_BYTES=$(wc -c < "$WORK/remote/VF_Start_V${TARGET}_UPDATE.zip" | tr -d ' ')"
          echo "P01_509_VERIFIED_ATOMIC_SHA256=$(sha256sum "$WORK/remote/VF_Start_V${TARGET}_UPDATE.zip"|cut -d' ' -f1)"
          echo "P01_509_VERIFIED_FULL_SHA256=$(sha256sum "$WORK/remote/VF-Start-V$TARGET-FULL.zip"|cut -d' ' -f1)"
          echo P01_509_FORMAL_REMOTE_ASSETS_BYTE_IDENTICAL=PASS
          echo P01_509_DISTRIBUTION_CHANGED=NO
          echo P01_509_PRODUCTION_WRITES=NONE
      - name: Clear private checkout and packaging scratch
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$WORK"
          echo P01_509_TRANSIENT_PRIVATE_CLEANUP=YES
