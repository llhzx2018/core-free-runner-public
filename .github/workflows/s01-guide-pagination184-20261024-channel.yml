name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guide-pagination184-20261024]
    paths: ['.github/workflows/s01-guide-pagination184-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.184
  TARGET_SHA: 832abfc4f0c8e32afdc6866484f34cb3db0edc81
  UPDATE_SHA: 8164d7909212c2dd86d216d1e22a09efb03b49f6
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 8164d7909212c2dd86d216d1e22a09efb03b49f6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='8baba87322b6221287748c73359794fa8686861017b849d9d0615a3d29f03c6e' and m['asset_bytes']==1986920
          assert m['runtime_files']==476 and '1.35.183' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
