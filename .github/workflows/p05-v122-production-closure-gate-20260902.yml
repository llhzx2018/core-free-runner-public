name: P05 V1.2.2 Production Closure Exact Authority Gate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-production-closure-gate-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  closure-authority:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-production-closure-gate-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      CANDIDATE: 939928ffe6c287d66a07f7ff659a0c2e6edf7504
      CANDIDATE_TREE: 51b739ab8e5612311b558eeb5185d2985355d12e
      RELEASE_ID: '380671190'
      RELEASE_TARGET: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      FULL_ID: '539843543'
      FULL_SHA256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297
      UPDATE_ID: '539856092'
      UPDATE_SHA256: 078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2
      REPAIR_ID: '539856093'
      REPAIR_SHA256: 5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901
      CORE_UPDATES_MAIN: e93f07c5ee84e114e0829ea65f217e768b21ce44
    steps:
      - name: Checkout exact P05 closure candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Bind exact four-file docs-only scope
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git cat-file -e "$BASE^{commit}"
          test "$(git diff --name-only "$BASE" "$CANDIDATE" | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md '
          git diff --check "$BASE" "$CANDIDATE"
          if git diff --name-only "$BASE" "$CANDIDATE" | grep -E '^(src|php|tests|scripts|package\.json|VERSION)(/|$)' ; then exit 1; fi
          echo P05_V122_CLOSURE_EXACT_FOUR_FILE_SCOPE=PASS

      - name: Validate Product closure authority content
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          v=json.load(open('VF_PROJECT.json'))
          assert v['version']==v['production_version']==v['target_version']==v['working_version']=='1.2.2'
          assert v['version_change'] is False
          assert v['status']=='V1.2.2_RELEASED / PRODUCTION_OWNER_OBSERVED_SCREENSHOT_VERIFIED / CLOSED'
          assert v['formal_release']=='v1.2.2' and v['formal_release_id']==380671190 and v['formal_release_asset_id']==539843543
          assert v['release_authorization']=='OWNER_AUTHORIZED_V1.2.2 / CONSUMED'
          assert v['production_deployment_authorization']=='OWNER_EXECUTED_VPS_SINGLE_PHP / CONSUMED'
          pc=v['production_closure_v1_2_2']
          assert pc['state']=='CLOSED' and pc['evidence_class']=='OWNER_OBSERVED_SCREENSHOT_VERIFIED'
          assert pc['machine_production_readback'] is False and pc['observed_version']=='1.2.2' and pc['observed_system_update_entry'] is True
          a=v['atomic_distribution_v1_2_2']
          assert a['source_version']=='1.2.1' and a['target_version']=='1.2.2'
          assert a['update_asset_id']==539856092 and a['update_sha256']=='078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2'
          assert a['repair_asset_id']==539856093 and a['repair_sha256']=='5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901'
          assert a['core_updates_main']=='e93f07c5ee84e114e0829ea65f217e768b21ce44'
          closure=open('docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md').read()
          assert 'Evidence class: **OWNER_OBSERVED / SCREENSHOT_VERIFIED**' in closure
          assert 'Machine Production Readback: **NOT CLAIMED**' in closure
          assert 'MACHINE_VERIFIED_PRODUCTION' in closure
          readme=open('README.md').read(); changelog=open('CHANGELOG.md').read()
          assert 'Current Formal Release: v1.2.2 · RELEASED' in readme
          assert 'Production: v1.2.2 · OWNER_OBSERVED / SCREENSHOT_VERIFIED' in readme
          assert '## 1.2.2 · Product v2 更新入口 Hotfix' in changelog
          print('P05_V122_CLOSURE_CONTENT=PASS')
          PY

      - name: Bind live Release Tag and asset truth
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-seo/branches/main > /tmp/product-main.json
          gh api repos/llhzx2018/vf-seo/releases/tags/v1.2.2 > /tmp/release.json
          gh api repos/llhzx2018/vf-seo/git/ref/tags/v1.2.2 > /tmp/tag.json
          python3 - <<'PY'
          import json,os
          pm=json.load(open('/tmp/product-main.json')); r=json.load(open('/tmp/release.json')); t=json.load(open('/tmp/tag.json'))
          assert pm['commit']['sha']==os.environ['BASE']
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']=='v1.2.2' and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert t['ref']=='refs/tags/v1.2.2' and t['object']['sha']==os.environ['RELEASE_TARGET']
          a={x['name']:x for x in r['assets']}
          assert a['VF_SEO_V1.2.2_FULL.zip']['id']==int(os.environ['FULL_ID']) and a['VF_SEO_V1.2.2_FULL.zip']['digest']=='sha256:'+os.environ['FULL_SHA256']
          assert a['VF_SEO_V1.2.2_UPDATE.zip']['id']==int(os.environ['UPDATE_ID']) and a['VF_SEO_V1.2.2_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          assert a['repair-v1.2.2.php']['id']==int(os.environ['REPAIR_ID']) and a['repair-v1.2.2.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V122_RELEASE_TAG_FIXED=PASS')
          PY

      - name: Bind live core-updates authority
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/core-updates/branches/main > /tmp/core-main.json
          gh api "repos/llhzx2018/core-updates/contents/projects/P05.json?ref=$CORE_UPDATES_MAIN" > /tmp/core-file.json
          python3 - <<'PY'
          import json,base64,os
          cm=json.load(open('/tmp/core-main.json')); cf=json.load(open('/tmp/core-file.json'))
          assert cm['commit']['sha']==os.environ['CORE_UPDATES_MAIN']
          m=json.loads(base64.b64decode(cf['content']).decode())
          assert m['current_version']=='1.2.1' and m['target_version']=='1.2.2' and m['from_versions']==['1.2.1'] and m['update_type']=='ATOMIC'
          assert m['release_id']==int(os.environ['RELEASE_ID']) and m['product_identity']==os.environ['RELEASE_TARGET']
          assert m['asset_sha256']==os.environ['UPDATE_SHA256'] and m['backup_required'] is True and m['rollback_supported'] is True
          print('P05_V122_CORE_UPDATES_LIVE=PASS')
          PY

      - name: Seal Production closure exact authority
        run: |
          echo P05_V122_PRODUCTION_CLOSURE_AUTHORITY_GATE=PASS
          echo P05_PRODUCTION_EVIDENCE_CLASS=OWNER_OBSERVED_SCREENSHOT_VERIFIED
          echo P05_MACHINE_PRODUCTION_READBACK=NOT_CLAIMED
          echo P05_PRODUCT_CODE_WRITE=0
          echo P05_TAG_WRITE=0
          echo P05_PRODUCTION_WRITE=0
