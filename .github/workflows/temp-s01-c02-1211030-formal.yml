name: S01-C02 V1.21.1033 Formal Release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 4dfe24224f8a8e2090a2f40beff66c2f1c5d7612
      PROMOTED_MAIN_SHA: 4dfe24224f8a8e2090a2f40beff66c2f1c5d7612
      TARGET_VERSION: 1.21.1033
      RELEASE_TAG: v1.21.1033
      ASSET_NAME: vf-tools-ops_V1.21.1033.zip
      TESTED_RUN_ID: 37224353809
      TESTED_ARTIFACT: s01-c02-1033-seo-refine-candidate
      EXPECTED_BYTES: 3503585
      EXPECTED_SHA256: 8dac96743dadd8a4c49550b730dd0b8e53a2447848de73263b675ae94d3286ff
      EXPECTED_RUNTIME_FILES: 986
      EXPECTED_RUNTIME_FP: b37a90488fc3f6bb102e08d97a2a0048760b5335cf644e75de4f1c5b8b29bcca
      PREVIOUS_TAG: v1.21.1031
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1031.zip
      PREVIOUS_SHA256: d2b57e61993d319eb642ba154ae7c6944e4f5d6390ba14d9827a5afb5ca6ab18
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"
          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and .source_sha==$sha and .version==$ver and
            .functional_boundary_contract=="PASS" and .refine_fixture_browser=="PASS" and
            .native_wordpress_interaction=="PASS" and .native_upgrade=="PASS" and .native_rollback=="PASS" and
            .owner_product_pass==false and .production=="NOT_TOUCHED"
          ' tested/evidence/FINAL_EVIDENCE.json >/dev/null
          test "$(jq -r '.asset_bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' tested/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          test "$(sha256sum tested/candidate.zip | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo EXACT_TESTED_SOURCE=PASS
      - name: Release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-1211033-seo-refine-functional-ux-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          echo RELEASE_CONTRACTS=PASS
      - name: Rebuild package and prove rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/$ASSET_NAME" > /tmp/package.json
          test "$(jq -r '.asset_bytes' /tmp/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' /tmp/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_files' /tmp/package.json)" = "$EXPECTED_RUNTIME_FILES"
          test "$(jq -r '.runtime_fingerprint' /tmp/package.json)" = "$EXPECTED_RUNTIME_FP"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          echo UPGRADE_1211031_TO_1211033=PASS
          echo ROLLBACK_TO_1211031=PASS
      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1033

          单页精修功能与 UX/UI 收口
          - 移除“单页精修”正式标题上方的“VF 站点运营”重复身份
          - 清理历史 SEO Gate / Run Gate 展示残留；Gate 仍只由显式 POST 动作执行
          - 提升任务队列、筛选、状态、分页与详情辅助文字可读性
          - 任务选择队列保持零正文读取、零前台抓取、零写入、零自动 Gate
          - 单页详情保留权限、Nonce、差异确认、Revision/Hash、防并发、写入回读与失败回滚
          - Shell / Header / Header Menu 冻结
          - Candidate Run: 37224353809
          - exact promoted main: 4dfe24224f8a8e2090a2f40beff66c2f1c5d7612
          - SHA256: 8dac96743dadd8a4c49550b730dd0b8e53a2447848de73263b675ae94d3286ff

          Schema 6.0.0 未变，无 Data Migration。
          Production 仍由 OWNER 手工升级；OWNER Product Acceptance remains post-Production.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1033" --notes-file notes.md
          fi
      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
