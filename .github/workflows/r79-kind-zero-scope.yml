name: R79 Subject Kind Zero Scope

on:
  pull_request:
    paths:
      - '.github/workflows/r79-kind-zero-scope.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: cc785aa6874fa0ce0034e3939a4959294babacac
    steps:
      - name: Checkout exact VF Start candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none
      - name: Exact candidate and focused contracts
        run: |
          set -euo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.0"
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/subject_kind_zero_scope_contract.php
          php tests/unit/subject_kind_zero_scope_contract.php
          php tests/unit/watch_cross_filter_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/uxui_round4_tools_identity_contract.php
          echo R79_SUBJECT_KIND_ZERO_SCOPE_PASS
          echo R79_EXACT_CANDIDATE_GATE_PASS
      - name: Cleanup private source
        if: always()
        run: rm -rf vf-start
