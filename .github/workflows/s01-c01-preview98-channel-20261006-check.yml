name: S01-C01 exact channel isolated regression
on:
  push:
    branches: [task/s01-c01-preview98-channel-20261006-check]
permissions:
  contents: read
  actions: read
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: 'dda92c52455e310dbe5a3966e15202764bfa8e32'
      TARGET_TREE: '17ebec157dbe0f37009c4f6da5abb2216bafa920'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Exact spec identity
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-preview98-channel-20261006/spec.json --template runner/lanes/s01-c01-preview98-channel-20261006/channel.template.yml --output /tmp/channel-check.yml >/dev/null
          cmp /tmp/channel-check.yml runner/.github/workflows/s01-c01-preview98-channel-20261006-check.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-preview98-channel-20261006/spec.json --input runner/.github/workflows/s01-c01-preview98-channel-20261006-check.yml > proof/identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 'llhzx2018/core-updates'
          ref: 'dda92c52455e310dbe5a3966e15202764bfa8e32'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Unchanged native CI and exact manifest
        working-directory: target
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'dda92c52455e310dbe5a3966e15202764bfa8e32'
          test "$(git rev-parse HEAD^{tree})" = '17ebec157dbe0f37009c4f6da5abb2216bafa920'
          test "$(git diff --name-only '5a15225476fe6a20ab6cd128cdeab7c75eee91f2' HEAD)" = projects/S01-C01.json
          test "$(cat VERSION)" = '1.3.0'
          git diff --exit-code '5a15225476fe6a20ab6cd128cdeab7c75eee91f2' HEAD -- .github/workflows/update-core-ci.yml update-core/php scripts/check_manifest_contract.py schemas
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import pathlib,json
          m=json.loads(pathlib.Path('projects/S01-C01.json').read_text())
          assert m['target_version']=='1.35.98' and m['asset_sha256']=='16a1277264baaa9a2fe54e5518850a08f5f991abcbd88a3ac724516caa1213b7' and m['asset_bytes']==1785584
          assert m['from_versions'][-1]=='1.35.97' and len(m['from_versions'])==len(set(m['from_versions']))==90
          assert m['backup_required'] and m['rollback_supported'] and m['schema_from']==m['schema_to']=='N/A'
          print('VF_CHANNEL_NATIVE_BEGIN')
          r={'status':'PASS','repository':'llhzx2018/core-updates','source_sha':'dda92c52455e310dbe5a3966e15202764bfa8e32','source_tree':'17ebec157dbe0f37009c4f6da5abb2216bafa920','native_ci_unmodified':'PASS','manifest_contract':'PASS','php_syntax':'PASS','update_core_regression':'PASS','scope_one_manifest':'PASS','production':'NOT_EXECUTED'}
          pathlib.Path('../proof/channel.json').write_text(json.dumps(r,indent=2));print(json.dumps(r))
          print('VF_CHANNEL_NATIVE_END')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-channel-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup transient target
        if: always()
        run: rm -rf target



