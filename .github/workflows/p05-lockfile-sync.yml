name: P05 Lockfile Sync

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - 'p05-lockfile-sync/triggers/**'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync only P05 package-lock identity
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet --branch maintenance/common-baseline-v1.0.1 --single-branch "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-seo.git" p05
          cd p05
          before="$(git rev-parse HEAD)"
          npm install --package-lock-only --ignore-scripts
          changed="$(git diff --name-only)"
          test "$changed" = 'package-lock.json'
          grep -q '"version": "1.0.1"' package-lock.json
          git config user.name 'VF Agent Runner'
          git config user.email 'vf-agent@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(P05): align lockfile with 1.0.1 maintenance'
          git push origin HEAD:maintenance/common-baseline-v1.0.1
          printf '%s\n%s\n' "$before" "$(git rev-parse HEAD)"
