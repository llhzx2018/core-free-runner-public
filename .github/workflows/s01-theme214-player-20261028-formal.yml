name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme214-player-20261028]
    paths: ['.github/workflows/s01-theme214-player-20261028-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.215
  TARGET_SHA: 012d4b637281a484073727f1e2c4c4610d3b4611
  TARGET_TREE: 1fa80a03f0bf2d3da6e7d4af480592728c4dc3b8
  BASE_SHA: 6995b0ab4f281a649ea7218ca7237a6f3ae48fce
  LANE_ID: s01-theme214-player-20261028
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme214-player-20261028/formal-spec.json --input control/.github/workflows/s01-theme214-player-20261028-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 012d4b637281a484073727f1e2c4c4610d3b4611
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40613988619 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40613988619 --jq .head_sha)" = 8af8fbfbe822cde6add0f616efdde83217da6414
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40613988619 --repo llhzx2018/core-free-runner-public --name s01-home-40613988619 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme214-player-20261028/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='9808ec1b232f712fc9902fc3ae7e0d0fe09fab8b'
          for name in ['hero-parity.json','clean-install.json','bootstrap.json','native-lifecycle.json','progress-navigation.json']:
              assert json.loads((r/name).read_text())['status']=='PASS'
          hero=json.loads((r/'hero-parity.json').read_text());assert hero['cases']==16 and hero['other_tool_hero']=='BYTE_IDENTICAL'
          after=json.loads((r/'after-results.json').read_text());assert after['status']=='PASS' and len(after['rows'])==6
          for lang in ['en','zh']:
              for width in [1440,1024]:assert (r/f'player-{lang}-{width}.png').stat().st_size>500
              assert (r/f'player-{lang}-playing.png').stat().st_size>500
          assert json.loads((r/'before-public.json').read_text())['pages']==json.loads((r/'after-public.json').read_text())['pages']
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='05c8736168f5e2dc1e22b1e43ee2a910a4992bae965780b32935264998ae8990' and new['bytes']==2023475
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme214-player-20261028/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='9808ec1b232f712fc9902fc3ae7e0d0fe09fab8b' and coverage['tree']=='1fa80a03f0bf2d3da6e7d4af480592728c4dc3b8'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40613988619'
          coverage['merged_source']='012d4b637281a484073727f1e2c4c4610d3b4611'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.215 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.215 provider/vf-tools-theme_V1.35.215.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.215' --notes '继承214已整合的播放器与诊断页改造，补齐播放器中文默认就绪提示去重，并隐藏默认空态不相关的WordPress技术说明；保留自定义文案和真实错误。根据Owner对213正式站截图的否决，参照HLSPlayer.net与Castr形成单一播放主线：链接输入连接完整视频区，历史收藏由Theme宿主入口展开，支持和流程使用原生展开区域，省略已有相关工具时的默认重复诊断CTA并保留定制内容。Provider原控件顺序、hidden规则、播放、数据与业务事件不变；Theme只拥有呈现展开状态。中英文1440/1024、展开/收起/键盘、历史20控件/重命名/收藏/删除/导出/刷新保留、真实错误可见、Pro/能力/内置示例/视频控件、自定义文案、SEO和八邻页保持、干净安装、214主线邻页保持、213升级回退重复安装及数据保护通过。476运行文件，正式包远端字节一致。手机暂缓，Production由Owner手工升级并最终验收。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.215 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.215 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.215 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.215.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.215.zip remote/vf-tools-theme_V1.35.215.zip
          echo '05c8736168f5e2dc1e22b1e43ee2a910a4992bae965780b32935264998ae8990  remote/vf-tools-theme_V1.35.215.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.215.zip)" = 2023475
          gh release view v1.35.215 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
