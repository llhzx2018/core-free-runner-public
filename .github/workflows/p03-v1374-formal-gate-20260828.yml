name: P03 V1.37.4 Formal Gate
on:
  push:
    branches: [task/p03-v1374-common-baseline-release-20260828]
    paths:
      - '.github/workflows/p03-v1374-formal-gate-20260828.yml'
      - 'scripts/p03-v1374-formal-gate.sh'
      - 'scripts/p03-v1374-formal-gate-v2.sh'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: b215f510a543ca5cf85af9e87257e2acb63d74ab
      BASE_MAIN: cc9a6da445240534016d08e148aa8a28c11be241
      OLD_SOURCE: 29580b62a0839ee3453ccf0cf8a4902bdf3cd8ec
      FIXTURE_PASS: VfM-2026-Test-Fixture!
      PHP_TEST_IMAGE: vf-forge-php84-v1374
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, sodium, fileinfo
          coverage: none
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: b215f510a543ca5cf85af9e87257e2acb63d74ab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Checkout exact V1.37.3 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: 29580b62a0839ee3453ccf0cf8a4902bdf3cd8ec
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old
      - name: Live main and exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C old rev-parse HEAD)" = "$OLD_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          test ! -d product/node_modules
          echo P03_V1374_LIVE_MAIN_FENCE=PASS
      - name: Install test utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip jq sqlite3
      - name: Build supported PHP 8.4 isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >"$RUNNER_TEMP/Dockerfile.vf-php" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev sqlite3 \
            && docker-php-ext-install zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.vf-php" "$RUNNER_TEMP"
          docker run --rm "$PHP_TEST_IMAGE" php -v
          docker run --rm "$PHP_TEST_IMAGE" php -m | grep -Ei 'PDO|pdo_sqlite|sqlite3|zip|fileinfo|sodium'
      - name: Run exact formal gate
        shell: bash
        run: bash scripts/p03-v1374-formal-gate-v2.sh
      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.37.4-FORMAL-RELEASE-SET
          path: product/build/v1374-a/*
          if-no-files-found: error
          retention-days: 30
