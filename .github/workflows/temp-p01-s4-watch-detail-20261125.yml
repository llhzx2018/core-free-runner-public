name: TEMP P01 S4 R11 real private movie detail and keyboard browser
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s4-watch-detail-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p01-s4-watch-detail-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  s4-movie-ui:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s4-watch-detail-')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact private source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 473d3471e7f672c9ce0301ea346c95bff150f7af
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Exact source, no installation route or real legacy data
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "473d3471e7f672c9ce0301ea346c95bff150f7af"
          test "$(cat private-src/VERSION)" = '0.1.0-dev'
          test ! -e private-src/storage/app/private/vf-startnew/installed.json
          node --check private-src/tests/browser/p01_s4_watch_detail_parity_browser.mjs
          echo 'P01_S4_R11_EXACT_SOURCE=PASS'
          echo 'P01_S4_R11_NO_OWNER_INSTALL_OR_REAL_LEGACY_INPUT=TRUE'
      - name: Prepare PHP8.4 and locked Laravel dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: PHP8.4 lint and locked composer, Vue TS and Vite
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! php -l tests/browser/p01_s4_seed_unsafe_saved_film.php >"$RUNNER_TEMP/s4r11-php.log" 2>&1; then
            echo 'P01_S4_R11_PHP_SYNTAX=FAIL'; exit 1
          fi
          echo 'P01_S4_R11_PHP_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/s4r11-composer.log" 2>&1; then
            echo 'P01_S4_R11_COMPOSER=FAIL'; exit 1
          fi
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/s4r11-npm.log" 2>&1; then
            echo 'P01_S4_R11_NPM=FAIL'; exit 1
          fi
          if ! npm run typecheck >"$RUNNER_TEMP/s4r11-ts.log" 2>&1; then
            grep 'error TS' "$RUNNER_TEMP/s4r11-ts.log" | sed -E 's/: error TS[0-9]+:.*/: TYPE_ERROR/' | head -12 || true
            echo 'P01_S4_R11_TYPECHECK=FAIL'; exit 1
          fi
          if ! npm run build >"$RUNNER_TEMP/s4r11-build.log" 2>&1; then
            echo 'P01_S4_R11_BUILD=FAIL'; exit 1
          fi
          if ! npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0 >"$RUNNER_TEMP/s4r11-playwright.log" 2>&1; then
            echo 'P01_S4_R11_PLAYWRIGHT=FAIL'; exit 1
          fi
          if ! npx playwright install --with-deps chromium >"$RUNNER_TEMP/s4r11-chrome.log" 2>&1; then
            echo 'P01_S4_R11_CHROME=FAIL'; exit 1
          fi
          echo 'P01_S4_R11_COMPILED_UI=PASS'
      - name: Run local Laravel real Chromium 390 768 1440 movie detail
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export APP_ENV=testing
          export APP_DEBUG=false
          export APP_URL=http://127.0.0.1:8777
          export VF_INSTALL_ALLOW_UNMARKED_DEV=true
          export VF_INSTALL_DEV_CLAIM_ENABLED=false
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$RUNNER_TEMP/p01-s3-watch-detail-ephemeral.sqlite"
          export SESSION_DRIVER=file
          export CACHE_STORE=array
          export QUEUE_CONNECTION=sync
          export P01_S3_SYNTH_PASS="$(openssl rand -hex 32)"
          export P01_S3_REAL_URL="$APP_URL"
          touch "$DB_DATABASE"
          if ! php artisan migrate --force --no-interaction >"$RUNNER_TEMP/s4r11-migrate.log" 2>&1; then
            echo 'P01_S4_R11_SCHEMA=FAIL'; exit 1
          fi
          test ! -e storage/app/private/vf-startnew/installed.json
          if ! php tests/browser/p01_s3_seed_synthetic.php >"$RUNNER_TEMP/s4r11-seed.log" 2>&1; then
            echo 'P01_S4_R11_OWNER_SEED=FAIL'; exit 1
          fi
          if ! php tests/browser/p01_s4_seed_unsafe_saved_film.php >>"$RUNNER_TEMP/s4r11-seed.log" 2>&1; then
            echo 'P01_S4_R11_BAD_RECORD_FIXTURE=FAIL'; exit 1
          fi
          echo 'P01_S4_R11_SYNTHETIC_FIXTURES=PASS'
          export APP_ENV=local
          php artisan serve --host=127.0.0.1 --port=8777 >"$RUNNER_TEMP/s4r11-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=no
          for i in $(seq 1 35); do
            if curl --noproxy '*' -s -o /dev/null "$APP_URL/login"; then READY=yes; break; fi
            sleep 1
          done
          test "$READY" = yes
          if node tests/browser/p01_s4_watch_detail_parity_browser.mjs >"$RUNNER_TEMP/s4r11-browser.log" 2>&1; then
            grep '^P01_S4_WATCH_DETAIL_' "$RUNNER_TEMP/s4r11-browser.log"
            grep -q '^P01_S4_WATCH_DETAIL_BROWSER=PASS$' "$RUNNER_TEMP/s4r11-browser.log"
          else
            grep -E 'AssertionError|TimeoutError|Error:|waiting for' "$RUNNER_TEMP/s4r11-browser.log" | head -10 || true
            echo 'P01_S4_R11_BROWSER=FAIL'; exit 1
          fi
          test ! -e storage/app/private/vf-startnew/installed.json
          echo 'P01_S4_R11_NO_INSTALL_MARKER=PASS'
      - name: Remove private code data and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/s4r11-*.log "$RUNNER_TEMP"/p01-s3-watch-detail-ephemeral.sqlite
          test ! -e private-src
          echo 'P01_S4_R11_PRIVATE_CLEANUP=PASS'
