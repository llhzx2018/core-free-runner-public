name: P07 M03 D04 release141 independent SQLite and no-DB real two-CloudPanel migration
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-independent-sqlite-nodb-141-20261119.yml'
permissions:
  contents: read
jobs:
  independent-real-two-CloudPanel:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    strategy:
      fail-fast: false
      matrix:
        kind: [SQLITE, NO_DB]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CASE_KIND: ${{ matrix.kind }}
    steps:
      - name: Checkout temporary public verified harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 PR368 candidate only in isolated workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3c82ed9597eb6aae4aa0fcda45dc7425376b9985
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-private-exact
      - name: Build exact release141 unpublished candidate from SHA-verified release140 official package
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 3c82ed9597eb6aae4aa0fcda45dc7425376b9985
          mkdir -m 0700 -p "$RUNNER_TEMP/p07-m03-141-independent"
          curl --retry 2 --connect-timeout 20 --max-time 180 -fsSLo "$RUNNER_TEMP/p07-m03-141-independent/release140.zip" \
            https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-all-ux-v0.1.0-20261118/P07-M03-0.1.0-release140.zip
          echo '8633631f76ca5ecd1a3c79e2edb64438eb920b6c5407fa5d5057611f9a7e77b8  '"$RUNNER_TEMP/p07-m03-141-independent/release140.zip" | sha256sum -c >/dev/null
          python3 -B .p07-private-exact/scripts/p07_m03_trial_from_official.py \
            --official-zip "$RUNNER_TEMP/p07-m03-141-independent/release140.zip" \
            --product-root .p07-private-exact --product-sha 3c82ed9597eb6aae4aa0fcda45dc7425376b9985 \
            --output "$RUNNER_TEMP/p07-m03-141-independent/release141-not-published.zip" \
            --build 0.1.0-release141 --formal-candidate \
            >"$RUNNER_TEMP/p07-m03-141-independent/builder.log"
          test "$(sha256sum "$RUNNER_TEMP/p07-m03-141-independent/release141-not-published.zip" | cut -d' ' -f1)" = 22c23818bc7268e6d3d95bc2552f42a5a3c12e97e387fdc542d59934c658b6d1
          python3 -B - "$RUNNER_TEMP/p07-m03-141-independent/release141-not-published.zip" \
            "$RUNNER_TEMP/p07-m03-141-independent/extracted" <<'PY'
          import pathlib,sys,zipfile
          out=pathlib.Path(sys.argv[2]);out.mkdir(mode=0o700)
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert len(z.infolist()) >= 113
              # Archive membership already passed the product's locked
              # read_trusted_official/runtime_entries before this extraction.
              z.extractall(out)
          root=out/'dist/p07/0.1.0/overlay'
          assert (root/'BUILD_ID').read_text().strip()=='0.1.0-release141'
          assert (root/'components/p07-m03-failed-task-ux.sh').is_file()
          assert (root/'lib/migration_php_site_template.py').is_file()
          PY
          echo P07_D04_INDEPENDENT_EXACT_141_RUNTIME_ZIP=PASS
      - name: Execute real two-QEMU CloudPanel migration for one independent single-site category
        shell: bash
        run: |
          set -Eeuo pipefail
          export P07_RELEASE141_OVERLAY="$RUNNER_TEMP/p07-m03-141-independent/extracted/dist/p07/0.1.0/overlay"
          bash -n tests/p07_m03_d04_independent_sqlite_nodb_141.sh
          bash tests/p07_m03_d04_independent_sqlite_nodb_141.sh
      - name: Always erase transient private checkout, archive, tests and VM disks
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-exact "$RUNNER_TEMP/p07-m03-141-independent"
          echo P07_D04_INDEPENDENT_PUBLIC_RUNNER_CLEANUP=PASS
