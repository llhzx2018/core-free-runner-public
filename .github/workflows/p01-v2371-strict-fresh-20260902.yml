name: P01 V2.37.1 Strict Fresh
on:
  push:
    branches: [release/p01-v2371-hotfix-20260902]
    paths: [.github/workflows/p01-v2371-strict-fresh-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2371-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Strict fresh frozen bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash runner/scripts/p01_v2371_strict_fresh.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2371-strict-fresh-evidence
          if-no-files-found: warn
          retention-days: 90
