name: P01 V2.47.267 Core Updates Exact Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247267-core-updates-exact.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin d753fd45aa984ca090430f24f5893e7cdc75f82a
          git -C candidate checkout -q --detach d753fd45aa984ca090430f24f5893e7cdc75f82a
          test "$(git -C candidate rev-parse HEAD)" = "d753fd45aa984ca090430f24f5893e7cdc75f82a"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Run canonical core-updates CI commands
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 manifest exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.266" and
            .target_version=="2.47.267" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.266"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.267" and
            .release_id==404424803 and
            .product_identity=="ec20bffbc9074f85acedc836134132467347905c" and
            .asset_name=="VF_Start_V2.47.267_UPDATE.zip" and
            .asset_bytes==2348080 and
            .asset_sha256=="b2552c422b0fa49eadb38d9ffcf3ac056613f85f9c68f46e601cb8cf274ebd56" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' candidate/projects/P01.json >/dev/null
          echo P01_V247267_MANIFEST_IDENTITY=PASS

      - name: Verify bounded distribution delta
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q origin main
          git -C candidate diff --name-only 4ac672aa628fee369147ae8458ea369d252ad138..d753fd45aa984ca090430f24f5893e7cdc75f82a | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "1"
          grep -Fx 'projects/P01.json' /tmp/changed.txt
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
