name: S01 advertising settings entry and real save regression
on:
  push:
    branches: [task/s01-ads-entry195-verified-20261026]
    paths: ['.github/workflows/s01-ads-entry195-20261026.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.195
  TARGET_SHA: 96dff717a824342b3bd6d76ec98d99580a1b3aad
  TARGET_TREE: ccf320632a030e73e143c04049c27c4d9eee2dbb
  BASE_SHA: a02c80efe12a65c0ee22ae87adfbd8130c735198
  SOURCE_VERSION: 1.35.194
  LANE_ID: s01-ads-entry195-20261026
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-ads-entry195-20261026/spec.json --input control/.github/workflows/s01-ads-entry195-20261026.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 96dff717a824342b3bd6d76ec98d99580a1b3aad
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-ads-entry195-20261026/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check target/tests/ads-entry-browser-check.cjs
          node --check target/src/assets/js/main.js
          gh release download v1.35.194 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.194.zip --dir provider
          echo '4ef757de6068654805a649085fb6a5aba3da0f905d9cd21adc81ea473ec1a4a3  provider/vf-tools-theme_V1.35.194.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Actual WordPress Guide Ad UX SEO upgrade rollback and data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-ads-entry195-20261026/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-ads-entry195-20261026/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
