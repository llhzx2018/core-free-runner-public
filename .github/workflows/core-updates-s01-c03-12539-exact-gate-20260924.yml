name: Core Updates S01-C03 1.25.39 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-updates-s01-c03-12539-exact-gate-20260924.yml'

permissions:
  contents: read

jobs:
  exact-core-updates-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: a9bf5d3cacbd5e3272e40e6fc0d279a10387a013
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: core-updates

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$TARGET_SHA"

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core V1 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
