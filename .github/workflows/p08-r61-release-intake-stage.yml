name: P08 R61 canonical distribution route and strict private asset intake (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r61-release-intake-stage.yml'
permissions:
  contents: read
jobs:
  guard-and-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout one-off Public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact original installed flat 0.1.0 privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-flat
      - name: Checkout exact P08 compatible 0.1.0 bridge privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 795ba67ac69a461e16084732d0e2ab2b441f576e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-bridge
      - name: Checkout exact new P08 0.1.1 work source privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: d0f1cd830ed61805a541b7ef1074bf476bad4689
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-target
      - name: Refuse unbound source, secret and enabled production signing
        run: |
          set -euo pipefail
          test "$(git -C private-p08-flat rev-parse HEAD)" = "55ecbc8461a4d90fe7241a00caffa55e557cde1c"
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "795ba67ac69a461e16084732d0e2ab2b441f576e"
          test "$(git -C private-p08-target rev-parse HEAD)" = "d0f1cd830ed61805a541b7ef1074bf476bad4689"
          test "$(cat private-p08-flat/VERSION)" = 0.1.0
          test "$(cat private-p08-bridge/VERSION)" = 0.1.0
          test "$(cat private-p08-target/VERSION)" = 0.1.1
          test ! -e private-p08-flat/.env
          test ! -e private-p08-bridge/.env
          test ! -e private-p08-target/.env
          grep -Fq 'PUBLIC_KEY_HEX = null' private-p08-target/src/Upgrade/UpdateAuthority.php
          grep -Fq 'PUBLIC_KEY_HEX = null' private-p08-bridge/src/Upgrade/UpdateAuthority.php
          echo P08_R61_EXACT_SOURCE_AND_DISABLED_SIGNER=PASS
      - name: Install isolated PHP 8.4 with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: zip, mbstring, intl, bcmath, dom, fileinfo, sodium, pdo_sqlite, sqlite3, pdo_mysql
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute R61 owner maintenance fail-closed regression and source tests
        run: |
          set -euo pipefail
          cd private-p08-target
          php -l src/Upgrade/OwnerUpgradeJob.php
          php -l src/Upgrade/UpgradeReadiness.php
          php -l tests/test_owner_upgrade_job.php
          php -l src/Upgrade/GitHubStableReleaseGate.php
          php -l tests/test_github_stable_release_gate.php
          php -l tests/test_github_channel_real_artifacts.php
          php -l src/Upgrade/GitHubStableAssetDownloader.php
          php -l tests/test_github_stable_asset_downloader.php
          php tests/test_github_stable_asset_downloader.php
          php -r 'require "src/Upgrade/GitHubStableReleaseGate.php"; if (VF\AdOps\Upgrade\GitHubStableReleaseGate::CORE_REPOSITORY!=="llhzx2018/core-updates") exit(2); echo "P08_R61_CANONICAL_CORE_UPDATES_REPOSITORY=PASS\n";'
          php tests/test_github_stable_release_gate.php
          php tests/test_github_stable_release_client.php
          php -l tests/test_owner_upgrade_worker_cron.php
          php tests/test_owner_upgrade_job.php
          php tests/test_versioned_fpm_runtime_identity.php
          php tests/test_owner_upgrade_worker_cron.php
          php tests/test_owner_upgrade_transport.php
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r61-source-tests.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/p08-r61-source-tests.log"; exit 1; }
          grep -F 'R1_LOCAL_SOURCE_TESTS=PASS' "$RUNNER_TEMP/p08-r61-source-tests.log"
          python3 scripts/check_stack_contract.py --phase mature
          echo P08_R61_ACTUAL_PHP_MAINTENANCE_SOURCE_TESTS=PASS
          echo P08_R61_OWNER_BROWSER_AND_SCHEDULED_CRON=NOT_PROVEN
      - name: Build genuine pinned Composer and Vite runtime for bridge and target
        run: |
          set -euo pipefail
          for d in private-p08-flat private-p08-bridge private-p08-target; do
            (
              cd "$d"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
              composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/$d-composer.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/$d-composer.log"; exit 1; }
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/$d-npm.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/$d-npm.log"; exit 1; }
              npm run build > "$RUNNER_TEMP/$d-vite.log" 2>&1 || { tail -n 20 "$RUNNER_TEMP/$d-vite.log"; exit 1; }
              npm run typecheck
              python3 scripts/check_stack_contract.py --phase full
            )
          done
          echo P08_R61_TWO_ACTUAL_LOCKED_APP_RUNTIMES=PASS
      - name: Produce and verify actual source-bound FULLs and code-only Atomic ZIP (ephemeral)
        run: |
          set -euo pipefail
          python3 private-p08-flat/scripts/build_full.py --source private-p08-flat --output "$RUNNER_TEMP/p08-r61-flat-full.zip" --version 0.1.0 --source-sha "55ecbc8461a4d90fe7241a00caffa55e557cde1c" > "$RUNNER_TEMP/p08-r61-flat-meta.json"
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r61-bridge-full.zip" --version 0.1.0 --source-sha "795ba67ac69a461e16084732d0e2ab2b441f576e" > "$RUNNER_TEMP/p08-r61-bridge-meta.json"
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r61-target-full.zip" --version 0.1.1 --source-sha "d0f1cd830ed61805a541b7ef1074bf476bad4689" > "$RUNNER_TEMP/p08-r61-target-meta.json"
          mkdir "$RUNNER_TEMP/p08-r61-flat-extracted" "$RUNNER_TEMP/p08-r61-bridge-extracted" "$RUNNER_TEMP/p08-r61-target-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r61-flat-full.zip" -d "$RUNNER_TEMP/p08-r61-flat-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r61-bridge-full.zip" -d "$RUNNER_TEMP/p08-r61-bridge-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r61-target-full.zip" -d "$RUNNER_TEMP/p08-r61-target-extracted"
          php -r 'require "private-p08-target/src/Installation/SetupGuard.php"; foreach(array_slice($argv,1) as $p) VF\AdOps\Installation\SetupGuard::package($p); echo "P08_R61_ACTUAL_FULL_EXTRACTION_VERIFIED=PASS\n";' "$RUNNER_TEMP/p08-r61-flat-extracted" "$RUNNER_TEMP/p08-r61-bridge-extracted" "$RUNNER_TEMP/p08-r61-target-extracted"
          oldsum=$(sha256sum "$RUNNER_TEMP/p08-r61-bridge-extracted/FULL_MANIFEST.json" | cut -d' ' -f1)
          python3 private-p08-target/scripts/build_atomic.py --source private-p08-target --output "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip" --source-version 0.1.0 --source-sha "795ba67ac69a461e16084732d0e2ab2b441f576e" --source-full-manifest-sha256 "$oldsum" --target-version 0.1.1 --target-sha "d0f1cd830ed61805a541b7ef1074bf476bad4689" > "$RUNNER_TEMP/p08-r61-atomic-meta.json"
          python3 - "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip" "795ba67ac69a461e16084732d0e2ab2b441f576e" "d0f1cd830ed61805a541b7ef1074bf476bad4689" <<'PY'
          import hashlib,json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              m=json.loads(z.read("ATOMIC_MANIFEST.json"))
              assert m["source_sha"]==sys.argv[2] and m["target_sha"]==sys.argv[3]
              assert m["schema_changes"] is False
              assert z.namelist() and all(not x.startswith("storage/") for x in z.namelist())
              assert all(hashlib.sha256(z.read(i["path"])).hexdigest()==i["sha256"] for i in m["files"])
          print("P08_R61_REAL_ATOMIC_ARCHIVE_SOURCE_BYTES=PASS")
          PY
          php private-p08-target/tests/test_github_channel_real_artifacts.php "$RUNNER_TEMP/p08-r61-flat-extracted" "$RUNNER_TEMP/p08-r61-bridge-extracted" "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip" "55ecbc8461a4d90fe7241a00caffa55e557cde1c" "795ba67ac69a461e16084732d0e2ab2b441f576e" "d0f1cd830ed61805a541b7ef1074bf476bad4689"
          echo P08_R61_PRIVATE_READ_TEST_CANONICAL_DISTRIBUTION_NOT_PUBLISHED=YES
          echo P08_R61_TARGET_ATOMIC_SHA256="$(sha256sum "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip" | cut -d' ' -f1)"
          echo P08_R61_TARGET_ATOMIC_BYTES="$(stat -c %s "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip")"
      - name: Sign test-only release offer and verify exact publisher binding
        run: |
          set -euo pipefail
          php -r '$pair=sodium_crypto_sign_seed_keypair(str_repeat(chr(77),SODIUM_CRYPTO_SIGN_SEEDBYTES));echo bin2hex(sodium_crypto_sign_secretkey($pair))."\n";' |
            php private-p08-target/scripts/sign_atomic_release_offer.php "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-r61-bridge-extracted/FULL_MANIFEST.json" "$(( $(date +%s) + 3600 ))" "$RUNNER_TEMP/p08-r61-signed" > "$RUNNER_TEMP/p08-r61-signed-meta.json"
          php -r '
            $raw=file_get_contents($argv[1]);$sig=hex2bin(trim(file_get_contents($argv[2])));
            $pair=sodium_crypto_sign_seed_keypair(str_repeat(chr(77),SODIUM_CRYPTO_SIGN_SEEDBYTES));
            if(!sodium_crypto_sign_verify_detached($sig,$raw,sodium_crypto_sign_publickey($pair)))throw new RuntimeException("R61_SYNTHETIC_SIGNATURE_INVALID");
            $x=json_decode($raw,true,16,JSON_THROW_ON_ERROR);
            if(($x["source_sha"]??null)!==$argv[3] || ($x["target_sha"]??null)!==$argv[4]
                || ($x["archive_sha256"]??null)!==hash_file("sha256",$argv[5]))
              throw new RuntimeException("R61_SIGNED_SOURCE_AND_ARCHIVE_MISMATCH");
            echo "P08_R61_SYNTHETIC_SIGNED_EXACT_ARCHIVE=PASS\n";
          ' "$RUNNER_TEMP/p08-r61-signed/approved-offer.json" "$RUNNER_TEMP/p08-r61-signed/approved-offer.sig" "795ba67ac69a461e16084732d0e2ab2b441f576e" "d0f1cd830ed61805a541b7ef1074bf476bad4689" "$RUNNER_TEMP/p08-r61-0.1.1-Atomic.zip"
          grep -Fq 'PUBLIC_KEY_HEX = null' private-p08-target/src/Upgrade/UpdateAuthority.php
          echo P08_R61_OFFICIAL_SIGNER_AND_DISTRIBUTION=NOT_CONFIGURED
      - name: Delete private worktrees, archives, test signatures and intermediate logs
        if: always()
        run: |
          rm -rf private-p08-flat private-p08-bridge private-p08-target
          rm -rf "$RUNNER_TEMP/p08-r61-"* "$RUNNER_TEMP/private-p08-"*
