name: P07 System Care RC12 Raw Main Final Gate

on:
  push:
    branches: [gate/p07-system-care-rc12-raw-main-final-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc12-raw-main-final-gate.yml'

permissions:
  contents: read

env:
  EXPECTED_MAIN: 797a3833dc3a052c8cdff171f73f277fa56d6a75
  RC11_MAIN: bce536f5e22e9509714ca16c7db12eed6f1ab048
  RC12_MANIFEST: 3c120333051561d7aa21c3a569d8a4d295593375
  SLOT3_BUILD: 0.1.0-rc3-guided-init6

jobs:
  raw-main-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify permanent main identities
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')"
          test "$actual" = "$EXPECTED_MAIN"
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o /tmp/toolbox.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/system-care.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/dist/p07/0.1.0-rc3/overlay/BUILD_ID -o /tmp/slot3-build
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/packages/p07-system-care/0.1.0-rc12/MANIFEST.gitblob -o /tmp/manifest
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init6"' /tmp/toolbox.sh
          test "$(cat /tmp/slot3-build)" = "$SLOT3_BUILD"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' /tmp/toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" /tmp/system-care.sh
          grep -Fq "MANIFEST_BLOB='$RC12_MANIFEST'" /tmp/system-care.sh
          test "$(git hash-object /tmp/manifest)" = "$RC12_MANIFEST"
          bash -n /tmp/toolbox.sh
          bash -n /tmp/system-care.sh
          echo P07_RC12_RAW_MAIN_IDENTITY=PASS
      - name: Fresh install from raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash /tmp/system-care.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo test -x /opt/vf-system-care/intrusion-evidence-entry.sh
          sudo test -f /opt/vf-system-care/lib/intrusion_discovery.py
          echo P07_RC12_RAW_MAIN_FRESH_INSTALL=PASS
      - name: Advice-only state does not alarm server health
        shell: bash
        run: |
          set -Eeuo pipefail
          summary=/tmp/p07-system-care-summary-0.cache
          intrusion=/tmp/p07-system-care-intrusion-0.cache
          sudo bash -c "printf '%s\n' 'STATUS=HEALTHY' 'SECURITY_ADVISORIES=2' > '$summary'; printf '%s\n' 'STATUS=NOT_ENABLED' 'EVENTS=0' 'SCHEDULER=none' > '$intrusion'"
          printf '0\n' | sudo script -qec "env NO_COLOR=1 /usr/local/bin/vf-system-care menu" /dev/null > /tmp/main-menu.out 2>&1
          grep -Fq '服务器      正常' /tmp/main-menu.out
          grep -Fq '安全建议    2 项 · 按 6 查看' /tmp/main-menu.out
          ! grep -Fq '服务器      需检查' /tmp/main-menu.out
          echo P07_RC12_RAW_MAIN_ADVICE_SPLIT=PASS
      - name: No-WordPress classify-first from raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=/tmp/raw-main-no-wp
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/db.sq3"; state="$tmp/state"; systemd="$tmp/systemd"; cron="$tmp/cron/p07"
          mkdir -p "$home/alice/htdocs/a.test" "$home/bob/htdocs/b.test" "$nginx" "$systemd" "$(dirname "$cron")"
          printf '%s\n' '<?php echo "php";' > "$home/alice/htdocs/a.test/index.php"
          printf '%s\n' '<?php echo "php";' > "$home/bob/htdocs/b.test/index.php"
          python3 - "$db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT, type TEXT)')
          c.executemany('INSERT INTO site(domain_name,user,type) VALUES(?,?,?)',[('a.test','alice','php'),('b.test','bob','php')]); c.commit(); c.close()
          PY
          printf '0\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' P07_IE_SYSTEMD_DIR='$systemd' P07_IE_CRON_FILE='$cron' P07_IE_ENTRY=/bin/true /usr/local/bin/vf-system-care evidence menu" /dev/null > /tmp/no-wp.out 2>&1
          grep -Fq 'CloudPanel   2 个网站' /tmp/no-wp.out
          grep -Fq 'WordPress    0 个' /tmp/no-wp.out
          grep -Fq '网站安全    当前不需要开启' /tmp/no-wp.out
          grep -Fq '1. 重新检测' /tmp/no-wp.out
          ! grep -Fq '1. 开启网站安全保护' /tmp/no-wp.out
          sudo test ! -e "$state/baseline.json"
          test ! -e "$systemd/vf-system-care-intrusion-evidence.timer"
          test ! -e "$cron"
          echo P07_RC12_RAW_MAIN_NO_WORDPRESS=PASS
      - name: WordPress classify-first from raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=/tmp/raw-main-wp
          home="$tmp/home"; nginx="$tmp/nginx"; db="$tmp/db.sq3"; state="$tmp/state"
          root="$home/alice/htdocs/wp.test/public"
          mkdir -p "$root/wp-content" "$nginx"
          printf '%s\n' '<?php // config' > "$root/wp-config.php"
          printf '%s\n' '<?php // core' > "$root/wp-settings.php"
          python3 - "$db" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.execute('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT, type TEXT)'); c.execute('INSERT INTO site(domain_name,user,type) VALUES(?,?,?)',('wp.test','alice','php')); c.commit(); c.close()
          PY
          cat > "$nginx/wp.test.conf" <<EOF
          server {
            server_name wp.test;
            root $root;
          }
          EOF
          printf '0\n' | sudo script -qec "env NO_COLOR=1 P07_IE_STATE_DIR='$state' P07_IE_DISCOVERY_HOME='$home' P07_IE_CLOUDPANEL_DB='$db' P07_IE_NGINX_SITES_DIR='$nginx' /usr/local/bin/vf-system-care evidence menu" /dev/null > /tmp/wp.out 2>&1
          grep -Fq 'CloudPanel   1 个网站' /tmp/wp.out
          grep -Fq 'WordPress    1 个' /tmp/wp.out
          grep -Fq '网站安全    未开启' /tmp/wp.out
          grep -Fq '1. 开启网站安全保护' /tmp/wp.out
          echo P07_RC12_RAW_MAIN_WORDPRESS_READY=PASS

  rc11-failed-residue-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reproduce RC11 failed enrollment residue
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${RC11_MAIN}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sudo bash /tmp/rc11.sh status >/dev/null
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          mkdir -p /tmp/empty-home
          set +e
          sudo env P07_IE_DISCOVERY_HOME=/tmp/empty-home python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline >/tmp/old.out 2>/tmp/old.err
          rc=$?
          set -e
          test "$rc" = 20
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          echo P07_RC12_RAW_MAIN_RC11_FAILED_REPRO=PASS
      - name: Upgrade failed residue via permanent raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/rc12.sh
          sudo bash /tmp/rc12.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/.lock
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test ! -e /var/lib/vf-system-care/intrusion-evidence/scan_state.json
          sudo test ! -e /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          echo P07_RC12_RAW_MAIN_FAILED_RESIDUE_UPGRADE=PASS

  rc11-valid-state-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create valid RC11 evidence state and scheduler bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${RC11_MAIN}/installers/p07-system-care.sh" -o /tmp/rc11.sh
          sudo bash /tmp/rc11.sh status >/dev/null
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence
          site=/tmp/valid-wp
          mkdir -p "$site/wp-content"
          printf '%s\n' '<?php // config' > "$site/wp-config.php"
          printf '%s\n' '<?php // core' > "$site/wp-settings.php"
          sudo python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline --site-root "$site" >/dev/null
          printf '%s\n' '[Unit]' 'Description=P07 fixture' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.service >/dev/null
          printf '%s\n' '[Timer]' 'OnCalendar=daily' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.timer >/dev/null
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer | sudo tee /tmp/before.sha >/dev/null
          echo P07_RC12_RAW_MAIN_RC11_VALID_READY=PASS
      - name: Upgrade valid RC11 state via permanent raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/rc12.sh
          sudo bash /tmp/rc12.sh status >/dev/null
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo sha256sum -c /tmp/before.sha
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence)" = 700
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/baseline.json)" = 600
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/scan_state.json)" = 600
          echo P07_RC12_RAW_MAIN_VALID_STATE_UPGRADE=PASS

  permanent-toolbox-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exercise permanent Toolbox option 4
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o /tmp/toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init6"' /tmp/toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' /tmp/toolbox.sh
          sudo rm -rf /opt/vf-system-care /opt/vf-system-care.previous /usr/local/bin/vf-system-care
          printf '4\n0\n0\n' | sudo script -qec "env NO_COLOR=1 bash /tmp/toolbox.sh" /dev/null > /tmp/toolbox.out 2>&1
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          grep -Fq 'P07 · 系统维护 / 安全' /tmp/toolbox.out
          echo P07_RC12_PERMANENT_TOOLBOX_ENTRY=PASS

  final:
    needs: [raw-main-fresh, rc11-failed-residue-upgrade, rc11-valid-state-upgrade, permanent-toolbox-entry]
    runs-on: ubuntu-24.04
    steps:
      - run: echo P07_SYSTEM_CARE_RC12_RAW_MAIN_FINAL_GATE=PASS
