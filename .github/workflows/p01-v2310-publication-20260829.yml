name: P01 V2.31 Publication
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths: [.github/workflows/p01-v2310-publication-20260829.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(gh api repos/llhzx2018/vf-start/contents/VERSION?ref=main --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.31.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256046377 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256106808 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.31.0 >/dev/null 2>&1; then echo 'v2.31.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.31.0 >/dev/null 2>&1; then echo 'v2.31.0 release already exists'; exit 3; fi
          echo P01_V2310_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2310-publish /tmp/p01-v2310-artifact.zip
          mkdir -p /tmp/p01-v2310-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9715831360/zip > /tmp/p01-v2310-artifact.zip
          unzip -q /tmp/p01-v2310-artifact.zip -d /tmp/p01-v2310-publish
          cd /tmp/p01-v2310-publish
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c%s VF-Start-V2.31.0-FULL.zip)" = 616027
          test "$(stat -c%s VF_Start_V2.31.0_UPDATE.zip)" = 1324509
          test "$(stat -c%s repair-v2.31.0.php)" = 3825261
          test "$(sha256sum VF-Start-V2.31.0-FULL.zip | awk '{print $1}')" = 51f2e34bc8c0ca160c4645824aaa56b994f679ea747fe3a7dec0170f4d071943
          test "$(sha256sum VF_Start_V2.31.0_UPDATE.zip | awk '{print $1}')" = 41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774
          test "$(sha256sum repair-v2.31.0.php | awk '{print $1}')" = 03d9bb3fa41cc497a2c9ad274fdcd44ed085d3f05d0e0c119597eab174f32492
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4" and .product_source=="d541b7bb18d40705ec03f951fad3ed661aa11991" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.31.0-FORMAL-METADATA.json >/dev/null
          echo P01_V2310_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.31.0 -f sha=0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4 >/tmp/p01-v2310-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2310-tag.json)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          cat >/tmp/p01-v2310-notes.md <<'EOF'
          VF Start V2.31.0 完成 V2.30 五域工作区上的日常添加体验收口。

          - 导航 / 频道 / 影视 / 专题的添加表单只展示当前资源域真正相关字段。
          - 具体资源域添加时自动继承当前域；全部资源仍支持跨域创建。
          - create/save 服务端增加资源域字段归一化，避免无关字段跨域残留。
          - “私人”恢复为正常受保护状态的 VF 青色语义，不改变 Public / Private 判定或匿名隔离。
          - 添加动作按资源域命名：添加资源 / 添加网址 / 添加频道 / 添加影视 / 添加专题。
          - Schema 保持 2026082901 不变，无 Migration。
          - 支持从 V2.30.0 Atomic 升级；正式 Artifact Gate 33256046377 PASS。
          - 本 Release 不自动写 Owner Production。
          EOF
          cd /tmp/p01-v2310-publish
          gh release create v2.31.0 \
            P01-V2.31.0-ARTIFACT-GATE.json \
            P01-V2.31.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.31.0-FULL.zip \
            VF-Start-V2.31.0-UPDATE.zip \
            VF_Start_V2.31.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.31.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.31.0' --notes-file /tmp/p01-v2310-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.31.0 > /tmp/p01-v2310-release.json
          test "$(jq -r .tag_name /tmp/p01-v2310-release.json)" = v2.31.0
          test "$(jq -r .draft /tmp/p01-v2310-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2310-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2310-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.31.0_UPDATE.zip")|.size' /tmp/p01-v2310-release.json)" = 1324509
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.31.0_UPDATE.zip")|.digest' /tmp/p01-v2310-release.json)" = sha256:41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.31.0-FULL.zip")|.digest' /tmp/p01-v2310-release.json)" = sha256:51f2e34bc8c0ca160c4645824aaa56b994f679ea747fe3a7dec0170f4d071943
          test "$(jq -r '.assets[]|select(.name=="repair-v2.31.0.php")|.digest' /tmp/p01-v2310-release.json)" = sha256:03d9bb3fa41cc497a2c9ad274fdcd44ed085d3f05d0e0c119597eab174f32492
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.31.0 --jq .object.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          echo P01_V2310_TAG_REMOTE_READBACK=PASS
          echo P01_V2310_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2310-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2310-tag.json
            /tmp/p01-v2310-release.json
          if-no-files-found: warn
