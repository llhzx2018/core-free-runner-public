name: P01 V247355 Core Updates Exact-Manifest CI (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247355-core-updates-ci.yml'
permissions:
  contents: read
jobs:
  core-updates-ci:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact distribution proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ed34ff67240f59e8898e4b79d2c801d0d4ebf017
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip
          coverage: none
      - name: Assert exact P01 distribution identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = ed34ff67240f59e8898e4b79d2c801d0d4ebf017
          jq -e '.project_id=="P01" and .current_version=="2.47.354" and .target_version=="2.47.355" and .release_tag=="v2.47.355" and .product_identity=="6c77d2ab082058c712991589c5a1541f0f6d724b" and .asset_bytes==2457987 and .asset_sha256=="48f6e48c10732bf01447f8d50a9be044eaa33426fc019293ddfb69e775d640b4" and .from_versions==["2.47.354"]' projects/P01.json >/dev/null
          echo P01_EXACT_UPDATE_MANIFEST_IDENTITY=PASS
      - name: Execute canonical manifest contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py | tee /tmp/p01-update-manifest-contract.json
          jq -e '.status=="PASS"' /tmp/p01-update-manifest-contract.json >/dev/null
          echo P01_UPDATE_MANIFEST_CONTRACT=PASS
      - name: Execute PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/tmp/p01-update-php-lint.log
          test -s /tmp/p01-update-php-lint.log
          echo P01_UPDATE_PHP_SYNTAX=PASS
      - name: Execute Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php update-core/php/tests/run.php | tee /tmp/p01-update-core-test.log
          echo P01_UPDATE_CORE_REGRESSION=PASS
