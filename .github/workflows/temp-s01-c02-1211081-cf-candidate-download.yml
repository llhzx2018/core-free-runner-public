name: S01 C02 isolated CF candidate build and HTTP download
on:
  push:
    branches: [test/s01-c02-1211081-cf-candidate-download]
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: cfqa
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 05474be4fa2236d0a6cdca532d95b79539ce9c59
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,pdo_mysql,zip,curl,mbstring
      - name: Execute WordPress candidate and HTTP E2E
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/s01-cf-qa"
          WP="$ROOT/site"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=cfqa --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=http://127.0.0.1:8765 --title=CFQA --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          cat > "$ROOT/cf-qa.php" <<'PHP'
          <?php
          $root=(string)($args[0]??'');
          if(!$root||!is_dir($root))throw new RuntimeException('Missing test root');
          $base=WP_PLUGIN_DIR.'/vf-ops/includes/release/';
          require_once $base.'infrastructure/class-release-zip.php';
          foreach(glob($base.'builders/class-candidate-*.php') as $file)require_once $file;
          require_once $base.'class-release-async-job.php';
          require_once WP_PLUGIN_DIR.'/vf-ops/includes/cf-static-downloads/templates.php';
          wp_set_current_user(1);
          $srcPath=$root.'/source.zip';$zip=new ZipArchive();
          if($zip->open($srcPath,ZipArchive::CREATE|ZipArchive::OVERWRITE)!==true)throw new RuntimeException('source ZIP fail');
          $zip->addFromString('index.html','<!doctype html><html><head><title>Home</title><link rel="canonical" href="https://fixture.invalid/"></head><body><h1>VF Static Home</h1><a href="/about/">About</a></body></html>');
          $zip->addFromString('about/index.html','<!doctype html><html><head><title>About</title></head><body><h1>About</h1></body></html>');
          $zip->addFromString('404.html','<!doctype html><html><head><meta name="robots" content="noindex"></head><body><h1>Not Found</h1></body></html>');
          $zip->addFromString('robots.txt',"User-agent: *\nAllow: /\n");
          $zip->addFromString('sitemap.xml','<?xml version="1.0" encoding="UTF-8"?><urlset></urlset>');
          $zip->addFromString('VERSION.txt','fixture-1');
          $zip->addFromString('release-health.json','{"status":"NOT_VERIFIED","finalOnlinePass":"NO"}');
          $zip->addFromString('static-release-report.json','{"status":"NOT_VERIFIED","finalOnlinePass":"NO"}');
          $zip->addFromString('wp-admin/private.php','<?php echo "secret";');
          $zip->close();
          $src=new ZipArchive();if($src->open($srcPath)!==true)throw new RuntimeException('ZIP reopen fail');
          $actions=['items'=>[],'sourceZip'=>'source.zip','sourceFiles'=>$src->numFiles];
          try{$result=VF_Ops_Release_Candidate_Zip_Builder::build($src,'CF_UPLOAD_CANDIDATE.zip','',false,'https://fixture.invalid','https://fixture.invalid',$actions,'source.zip');}finally{$src->close();}
          $candidate=(string)($result['path']??'');if(!is_file($candidate)||filesize($candidate)<1)throw new RuntimeException('Candidate was not generated');
          $out=new ZipArchive();if($out->open($candidate)!==true)throw new RuntimeException('Candidate ZIP invalid');
          foreach(['index.html','404.html','sitemap.xml','sitemap_index.xml','_headers','_redirects','release-health.json','static-release-report.json','candidate-actions.json'] as $name)if($out->locateName($name)===false)throw new RuntimeException('Missing root helper: '.$name);
          if($out->locateName('wp-admin/private.php')!==false)throw new RuntimeException('Private source leaked');
          if(strpos((string)$out->getFromName('index.html'),'VF Static Home')===false)throw new RuntimeException('HTML lost');
          $out->close();
          echo "PASS candidate generated by actual ZIP builder, helper files complete, private PHP filtered\n";
          $id='vf_candidate_e2e_1081';
          $job=['id'=>$id,'status'=>'DONE','job_mode'=>'candidate','candidate_path'=>$candidate,'download_name'=>'CF_UPLOAD_CANDIDATE.zip','steps'=>[['status'=>'PASS','key'=>'final_decision','note'=>'阻断项为 0']],'candidate_audit'=>['status'=>'PASS','failures'=>[]],'findings'=>['summary'=>['failures'=>0,'warnings'=>0]]];
          VF_Ops_Release_Async_Job::save($job);
          $saved=VF_Ops_Release_Async_Job::load($id);
          $allow=VF_Ops_Release_Async_Job::download_contract($saved);
          if(empty($allow['ready']))throw new RuntimeException('Candidate refused: '.json_encode($allow['reasons']??[]));
          foreach(['terminal','p0','missing','inspect'] as $mode){
            $v=$saved;$v['id']=$id.'_'.$mode;
            if($mode==='terminal')$v['status']='FAIL';
            if($mode==='p0')$v['candidate_audit']['failures']=['fixture-confirmed-P0'];
            if($mode==='missing')$v['candidate_path']=$root.'/missing.zip';
            if($mode==='inspect')$v['job_mode']='inspect_only';
            if(!empty(VF_Ops_Release_Async_Job::download_contract($v)['ready']))throw new RuntimeException('Unsafe allowed: '.$mode);
          }
          echo "PASS download contract and fail-closed terminal/P0/missing/inspect\n";
          file_put_contents($root.'/contract.json',wp_json_encode(['id'=>$id,'nonce'=>wp_create_nonce(VF_Ops_Release_Async_Job::nonce_action($id)),'sha256'=>hash_file('sha256',$candidate),'size'=>filesize($candidate)]));
          PHP
          wpqa eval-file "$ROOT/cf-qa.php" "$ROOT"
          cat > "$WP/isolated-download-test.php" <<'PHP'
          <?php
          require_once __DIR__.'/wp-load.php';
          require_once __DIR__.'/wp-content/plugins/vf-ops/includes/release/class-release-async-job.php';
          require_once __DIR__.'/wp-content/plugins/vf-ops/includes/cf-static-downloads/http.php';
          require_once __DIR__.'/wp-content/plugins/vf-ops/includes/backend-form-result-parts/02-download-helpers.php';
          if(!isset($_GET['nonadmin']))wp_set_current_user(1);
          VF_Ops_Release_Async_Job::download();
          PHP
          php -S 127.0.0.1:8765 -t "$WP" >"$ROOT/http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do if curl -s -o /dev/null http://127.0.0.1:8765/; then break; fi; sleep 1; done
          ID="$(jq -r .id "$ROOT/contract.json")"
          NONCE="$(jq -r .nonce "$ROOT/contract.json")"
          curl -sS -D "$ROOT/headers" -o "$ROOT/download.zip" "http://127.0.0.1:8765/isolated-download-test.php?job=$ID&_wpnonce=$NONCE"
          if ! grep -q "200 OK" "$ROOT/headers"; then tail -40 "$ROOT/http.log"; head -c 300 "$ROOT/download.zip"; exit 1; fi
          test "$(stat -c %s "$ROOT/download.zip")" = "$(jq -r .size "$ROOT/contract.json")"
          test "$(sha256sum "$ROOT/download.zip" | cut -d' ' -f1)" = "$(jq -r .sha256 "$ROOT/contract.json")"
          unzip -tq "$ROOT/download.zip"
          grep -qi 'X-VF-Ops-Release-Download-Contract: pass' "$ROOT/headers"
          echo 'PASS actual HTTP candidate ZIP byte-identical download'
          curl -fsS -o "$ROOT/preflight.json" "http://127.0.0.1:8765/isolated-download-test.php?job=$ID&_wpnonce=$NONCE&vf_ops_release_download_preflight=1"
          jq -e '.ok==true and .contract.ready==true' "$ROOT/preflight.json"
          echo 'PASS actual HTTP download preflight'
          curl -sS -D "$ROOT/nonce.headers" -o "$ROOT/invalid.json" "http://127.0.0.1:8765/isolated-download-test.php?job=$ID&_wpnonce=invalid"
          grep -q '403' "$ROOT/nonce.headers"
          jq -e '.ok==false' "$ROOT/invalid.json"
          echo 'PASS HTTP invalid nonce denied'
          curl -sS -D "$ROOT/access.headers" -o "$ROOT/guest.json" "http://127.0.0.1:8765/isolated-download-test.php?job=$ID&_wpnonce=$NONCE&nonadmin=1"
          grep -q '403' "$ROOT/access.headers"
          jq -e '.ok==false' "$ROOT/guest.json"
          echo 'PASS HTTP non-admin denied'
          echo 'ISOLATED_CF_CANDIDATE_DOWNLOAD_E2E=PASS'
