name: S01-C01 preview exact candidate
on:
  push:
    branches: [task/s01-c01-preview-13594-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.94'
      TARGET_SHA: '90be98aeb3b2bb6def21c0697a9da9ec4c88eaf3'
      TARGET_TREE: 'b91b283f1008946b22ff80ac72a123c43fdc5e9c'
      SOURCE_VERSION: '1.35.93'
      BASE_SHA: '4ed255c9b789dc095b02f09bf24d8b13375b4712'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-preview-13594 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/preview-human-language-followup-contract.php
          php target/tests/preview-workflow-v4-contract.php
          php target/tests/renderer-revision-bootstrap-contract.php
          node --check target/tests/preview-controls-browser-check.js
          node --check target/tests/preview-workflow-browser-check.js
          node --check target/tests/browser-probe-version-browser-check.js
          node --check target/src/assets/js/modules/browser-behavior-probe.js
          node --check target/src/assets/js/admin/admin-preview.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1781394'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = '8457c1031c03fdaea425db9fe7071864c9b6592bbb2bd8b9ed619c5b47d70ac6'
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        id: proof_artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-preview-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Read back actual uploaded evidence ZIP
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ARTIFACT_ID: ${{ steps.proof_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT_ID" > /tmp/public-proof-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ARTIFACT_ID/zip" > /tmp/public-proof-readback.zip
          python3 - <<'PYVERIFY'
          import json,hashlib,zipfile,pathlib,os,stat
          meta=json.loads(pathlib.Path('/tmp/public-proof-meta.json').read_text())
          data=pathlib.Path('/tmp/public-proof-readback.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['PROOF_ARTIFACT_ID'])
          assert meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert meta['size_in_bytes']==len(data) and meta['digest']==digest
          assert meta['expired'] is False
          with zipfile.ZipFile('/tmp/public-proof-readback.zip') as z:
              assert z.testzip() is None
              names=z.namelist()
              assert names and len(names)==len(set(names))
              for info in z.infolist():
                  p=pathlib.PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                  assert not stat.S_ISLNK(info.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json': json.loads(z.read(info))
              final=json.loads(z.read('FINAL_EVIDENCE.json'))
              assert final['status']=='PASS' and final['source_sha']==os.environ['TARGET_SHA'] and final['source_tree']==os.environ['TARGET_TREE']
          receipt={'status':'PASS','artifact_id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'runner_sha':os.environ['GITHUB_SHA'],'source_sha':os.environ['TARGET_SHA'],'source_tree':os.environ['TARGET_TREE'],'bytes':len(data),'digest':digest,'file_count':len(names),'crc':'PASS','safe_paths':'PASS','json_parse':'PASS'}
          print('VF_ARTIFACT_RECEIPT_BEGIN')
          print(json.dumps(receipt))
          print('VF_ARTIFACT_RECEIPT_END')
          PYVERIFY
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py /tmp/navigation-candidate.css /tmp/navigation-baseline.log
