name: TEMP S01-C02 v1.21.814 Candidate Gate
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-candidate-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a89aca6ea87e0bfabeab2cc414388ad3188bd9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Checkout exact gate script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/s01-c03-v12519-runtime-authority-probe-20260905
          persist-credentials: false
          path: runner
      - name: Fresh-read live Ops bases
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(live main)" = 'bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44'
          test "$(live develop)" = 'bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44'
          echo LIVE_BASES=PASS
      - name: Run exact Candidate Gate
        working-directory: ops
        run: bash ../runner/.github/scripts/temp-s01-c02-v121814-gate.sh
