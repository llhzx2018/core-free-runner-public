name: P02 V2.5.30 UI Exposure Release Identity Prep

on:
  push:
    paths:
      - '.github/workflows/p02-v2530-ui-exposure-release-identity-prep-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-24.04
    env:
      EXACT_SOURCE: 18d080f82c7cb67398a335c9212d3a0508d515dd
      BASE_SHA: 49c2bac2497ccc454c2134d3e491d76b2ff63d79
      PRODUCT_BRANCH: ui/p02-common-baseline-human-readable-v2530-20260828
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P02 UI source
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" p02 >/dev/null 2>&1
          cd p02
          git checkout "$PRODUCT_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.29'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_V2530_IDENTITY_SOURCE_FENCE=PASS

      - name: Promote release identity and refresh Source Manifest
        run: |
          set -Eeuo pipefail
          cd p02
          printf '2.5.30\n' > VERSION
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          test "$(jq -r '.version' SOURCE_MANIFEST.json)" = '2.5.30'
          grep -Fqx 'VF Library V2.5.30 CANDIDATE SOURCE_MANIFEST' SOURCE_MANIFEST.txt
          git diff --check
          git status --porcelain=v1 | cut -c4- | sort -u > /tmp/p02-v2530-identity-dirty.txt
          printf 'SOURCE_MANIFEST.json\nSOURCE_MANIFEST.txt\nVERSION\n' > /tmp/p02-v2530-identity-allowed.txt
          diff -u /tmp/p02-v2530-identity-allowed.txt /tmp/p02-v2530-identity-dirty.txt
          echo P02_V2530_IDENTITY_PREP=PASS

      - name: Commit and push V2.5.30 identity
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p02
          git add VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'release(P02): prepare V2.5.30 human baseline UI candidate'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:"$PRODUCT_BRANCH"
          git remote set-url origin https://github.com/llhzx2018/vf-library.git
          echo P02_V2530_IDENTITY_PUSH=PASS
