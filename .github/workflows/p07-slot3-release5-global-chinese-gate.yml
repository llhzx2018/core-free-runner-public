name: P07 Slot3 Release5 Global Chinese Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-slot3-release5-global-chinese-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 946e2ed066eade28bd829376ffa5fc0cde43cebd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "946e2ed066eade28bd829376ffa5fc0cde43cebd"
          test "$(cat VERSION)" = "0.1.0"
          test "$(cat BUILD_ID)" = "0.1.0-release5"
          test "$(NO_COLOR=1 bash bin/vfops-user --version)" = "VF Server Ops 0.1.0"
          test "$(NO_COLOR=1 bash bin/vfops-user --build-id)" = "0.1.0-release5"

      - name: Syntax
        working-directory: source
        run: |
          set -Eeuo pipefail
          find bin lib -type f \( -name '*.sh' -o -path 'bin/vfops*' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.py) ;;
              *) bash -n "$f" ;;
            esac
          done
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in ("lib","scripts","tests"):
              for p in Path(root).rglob("*.py"):
                  py_compile.compile(str(p), doraise=True)
          PY

      - name: Release5 focused regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh
          python3 -m unittest -q             tests.test_p07_integration_manifest             tests.test_terminal_ui_color_contract             tests.test_storage_onboarding_ux             tests.test_user_entry             tests.test_cloudpanel_ui_complete             tests.test_auto_backup             tests.test_server_migration             tests.test_secret_scan

      - name: Chinese-first user surface checks
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq 'P07 · VF 服务器运维' bin/vfops-user
          grep -Fq '高级命令说明' bin/vfops
          grep -Fq '项目：P07 · VF 服务器运维' bin/vfops
          grep -Fq '目标服务器 IP（输入 0 返回）：' bin/vfops-migrate-ui
          grep -Fq '源服务器 IP（输入 0 返回）：' bin/vfops-storage-setup
          grep -Fq 'P07 远程存储：已配置' bin/vfops-storage-setup
          grep -Fq 'Google 加密远程' bin/vfops-auto-backup
          grep -Fq '网站公开目录：' lib/cloudpanel_ui_common.sh
          grep -Fq '资源清单：' lib/cloudpanel_ui_admin.sh
          ! grep -Fq 'Usage: vfops-site-ui' bin/vfops-site-ui
          ! grep -Fq 'P07 · VF Server Ops' bin/vfops-user

      - name: Machine and secret boundaries
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release5'
          python3 scripts/secret_scan.py --root .

      - name: Result
        if: always()
        run: |
          echo "P07_SLOT3_RELEASE5_SOURCE=946e2ed066eade28bd829376ffa5fc0cde43cebd"
          echo "P07_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P07_PRODUCTION_MUTATION=NOT_RUN"
