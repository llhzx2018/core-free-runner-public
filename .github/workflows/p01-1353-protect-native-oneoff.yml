name: p01-1353-protect-native-oneoff

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-1353-protect-native-oneoff.yml'

permissions:
  contents: read

jobs:
  isolated-protection-regression:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P01 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4bb64618ffd96ae9290ee2e99883065c906272d5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Prepare native PHP / SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Verify immutable source and run synthetic security regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "4bb64618ffd96ae9290ee2e99883065c906272d5"
          test "$(cat VERSION)" = "2.47.505"
          test "$(cat src/VERSION.txt)" = "2.47.505"
          php -l src/app/DisasterRecovery.php >/dev/null
          php -l tests/unit/p01_disaster_protect_guard_native.php >/dev/null
          php tests/unit/backup_retention_delete_fault_matrix_native.php
          php tests/unit/p01_disaster_protect_guard_native.php
          echo P01_1353_NATIVE_PROTECT_GUARD_EXACT_HEAD=PASS

      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate
