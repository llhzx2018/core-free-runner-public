name: TEMP P01 Subsite Shell V2.47.106 exact gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-subsite-shell-v247106-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-subsite-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 9413a24ee1b0a6f1a66c49882cfb3d89cb030149
      BASELINE_SHA: 63b34c1b36ff88dae8e1b223473aed7f154ad2fa
      VERSION: 2.47.106
    steps:
      - name: Checkout verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_SUBSITE_SHELL_RUNTIME=PASS

      - name: Resolve exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/p01-subsite-candidate /tmp/p01-subsite-baseline
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-subsite-candidate
          git -C /tmp/p01-subsite-candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C /tmp/p01-subsite-candidate checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-subsite-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < /tmp/p01-subsite-candidate/VERSION)" = "$VERSION"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-subsite-baseline
          git -C /tmp/p01-subsite-baseline fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C /tmp/p01-subsite-baseline checkout -q --detach FETCH_HEAD
          echo P01_SUBSITE_SHELL_EXACT_SOURCE=PASS

      - name: Focused shell contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-subsite-candidate
          php -l src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l src/app/FunctionalWorkspace.php >/dev/null
          php -l src/app/FunctionalHome.php >/dev/null
          php -l src/app/SubjectPageChrome.php >/dev/null
          php tests/unit/frontend_subsite_shell_v247106_contract.php
          php tests/unit/frontend_global_shell_r1_contract.php
          php tests/unit/public_global_nav_contract.php
          php tests/unit/brand_shell_r79_contract.php
          php tests/unit/mobile_account_nav_r2_contract.php
          php tests/unit/subject_domain_nav_shell_contract.php
          python3 - <<'PY'
          from pathlib import Path
          for path in ['src/assets/subsite-shell.css','src/assets/frontend-mature.css']:
              s=Path(path).read_text(encoding='utf-8')
              depth=0
              for c in s:
                  if c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth<0: raise SystemExit(path+':CSS_BRACE_UNDERFLOW')
              if depth!=0: raise SystemExit(path+':CSS_BRACE_UNBALANCED')
          print('P01_SUBSITE_SHELL_CSS_STRUCTURE=PASS')
          PY
          echo P01_SUBSITE_SHELL_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-subsite-candidate
          bash tests/canonical_release_regression.sh /tmp/p01-subsite-candidate /tmp/p01-subsite-baseline --require-zero-debt | tee /tmp/p01-subsite-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-subsite-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-subsite-canonical.txt
          echo P01_SUBSITE_SHELL_EXACT_GATE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/p01-subsite-candidate /tmp/p01-subsite-baseline /tmp/p01-subsite-canonical.txt
