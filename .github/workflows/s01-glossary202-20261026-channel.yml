name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-glossary202-candidate-20261026]
    paths: ['.github/workflows/s01-glossary202-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.202
  TARGET_SHA: d6d158b5a3db47d058fd525af28d4ea430564179
  UPDATE_SHA: 7ef88c78bc30f84408edb3621c57eeabcae5b8f9
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 7ef88c78bc30f84408edb3621c57eeabcae5b8f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary202-20261026/channel-spec.json --input control/.github/workflows/s01-glossary202-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 38c09a73162018e88d8dc54ebab4b5b94f232b38 7ef88c78bc30f84408edb3621c57eeabcae5b8f9)" = projects/S01-C01.json
          git -C source diff --exit-code 38c09a73162018e88d8dc54ebab4b5b94f232b38 7ef88c78bc30f84408edb3621c57eeabcae5b8f9 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='62e322437cce9b4f393cc87f0be0605db10f822ed0634eee5a508c82dc50d719' and m['asset_bytes']==2009032
          assert m['runtime_files']==476 and '1.35.201' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
