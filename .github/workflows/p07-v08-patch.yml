name: P07 OneShot v0.8 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v08-patch.yml
      - experiments/p07-v08-patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.8 patch
        run: python3 experiments/p07-v08-patch.py
      - name: Validate v0.8
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F '0.8.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          ./experiments/p07-bench.sh --demo >/tmp/demo
          grep -F 'P07 Enhanced Bench' /tmp/demo
          grep -F 'Cloudflare Edge' experiments/p07-bench.sh
          grep -F 'FALLBACK' experiments/p07-bench.sh
          grep -F 'speed.cloudflare.com/__down' experiments/p07-bench.sh
          grep -F 'speed.cloudflare.com/__up' experiments/p07-bench.sh
      - name: Commit v0.8 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git commit -m 'feat(p07-bench): add Cloudflare fallback v0.8'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
