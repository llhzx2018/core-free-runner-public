name: TEMP P07 M03 D04 official146 and native catalog proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-d04-official146-native-20261123.yml'
permissions:
  contents: read
jobs:
  bounded-proof:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-d04-release146-native-catalog-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_SHA: '6179ceb71a05d7bb99c8d13facc951120e69015d'
      SOURCE_BASE: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact private product source without persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private-product
      - name: Verify genuine official146 runtime archive and module identities
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          product="$GITHUB_WORKSPACE/.p07-private-product"
          [[ "$(git -C "$product" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -f "$product/lib/migration_cloudpanel_sql_probe.py" ]]
          curl -fLsS --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 190 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release146-20261122/P07-M03-0.1.0-release146.zip' \
            -o "$RUNNER_TEMP/p07-release146.zip"
          echo '7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321  '"$RUNNER_TEMP/p07-release146.zip" | sha256sum -c - >/dev/null
          python3 -B - "$RUNNER_TEMP/p07-release146.zip" "$product" "$SOURCE_BASE" <<'PY'
          import hashlib, pathlib, subprocess, sys, zipfile
          zip_path=pathlib.Path(sys.argv[1])
          product=pathlib.Path(sys.argv[2])
          base_sha=sys.argv[3]
          prefix="dist/p07/0.1.0/overlay/"
          with zipfile.ZipFile(zip_path) as archive:
              manifest=archive.read(prefix+"RUNTIME.gitblob")
              build=archive.read(prefix+"BUILD_ID")
              assert build==b"0.1.0-release146\n"
              blob=lambda data: hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert blob(manifest)=="78caa4b85edc5441039483117e3f9660cf6e3af6"
              rows=[x.split("  ",1) for x in manifest.decode().splitlines()]
              names=set()
              for digest,name in rows:
                  assert name not in names
                  names.add(name)
                  assert blob(archive.read(prefix+name))==digest
              essential={"lib/migration_safe_batch_io.py",
                         "lib/migration_cloudpanel_sql_probe.py",
                         "lib/migration_native_datadir_guard.py",
                         "components/p07-m03-safe-batch-ui.sh"}
              present=essential&names
              print("OFFICIAL146_HASH_AND_RUNTIME=PASS")
              print("OFFICIAL146_NATIVE_CATALOG_FILES="+str(len(present))+"/"+str(len(essential)))
              for name in sorted(essential):
                  print("OFFICIAL146_RUNTIME_"+name.split("/")[-1]+"="+("PRESENT" if name in names else "ABSENT"))
                  if name in names:
                      result=subprocess.run(["git","-C",str(product),"show",base_sha+":"+name],
                                            capture_output=True,check=True)
                      official=blob(archive.read(prefix+name))
                      baseline=blob(result.stdout)
                      print("OFFICIAL146_BASELINE_"+name.split("/")[-1]+"="+
                            ("MATCH" if official==baseline else "DIFFERENT"))
          PY
      - name: Read active governance in transient runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .p07-governance
      - name: Verify official146-to-unpublished-147rc genuine candidate archive
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          product="$GITHUB_WORKSPACE/.p07-private-product"
          cd "$product"
          python3 -B -m unittest -q tests.test_p07_m03_trial_builder_142 tests.test_p07_m03_trial_builder_146
          echo RELEASE146_CANDIDATE_TESTS=PASS
          python3 -B scripts/p07_m03_trial_from_official.py \
            --official-zip "$RUNNER_TEMP/p07-release146.zip" --product-root "$product" \
            --output "$RUNNER_TEMP/p07-release147-rc1.zip" --product-sha "$SOURCE_SHA" \
            --build 0.1.0-release147-rc1 --official-build 0.1.0-release146
          python3 -B - "$RUNNER_TEMP/p07-release146.zip" "$RUNNER_TEMP/p07-release147-rc1.zip" "$product" <<'PY'
          import hashlib, pathlib, subprocess, sys, zipfile
          oldpath,newpath,product=map(pathlib.Path,sys.argv[1:])
          pfx="dist/p07/0.1.0/overlay/"
          patches={
              "components/p07-m03-safe-batch-ui.sh",
              "lib/migration_safe_batch_io.py",
              "lib/migration_native_datadir_guard.py",
              "lib/migration_cloudpanel_sql_probe.py",
          }
          blob=lambda data: hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          with zipfile.ZipFile(oldpath) as old,zipfile.ZipFile(newpath) as new:
              orig={row.split("  ",1)[1]:row.split("  ",1)[0]
                    for row in old.read(pfx+"RUNTIME.gitblob").decode().splitlines()}
              latest={row.split("  ",1)[1]:row.split("  ",1)[0]
                      for row in new.read(pfx+"RUNTIME.gitblob").decode().splitlines()}
              assert set(latest)-set(orig)==patches-set(orig)
              assert set(orig)-set(latest)==set()
              for name in latest:
                  raw=new.read(pfx+name)
                  assert blob(raw)==latest[name]
                  if name in patches:
                      assert raw==(product/name).read_bytes()
                  elif name!="BUILD_ID":
                      assert latest[name]==orig[name]
              assert new.read(pfx+"BUILD_ID")==b"0.1.0-release147-rc1\n"
              orig_installer=old.read("installers/p07-final.sh")
              new_installer=new.read("installers/p07-final.sh")
              assert orig_installer!=new_installer
              assert new_installer.count(b'EXPECTED_BUILD_ID="0.1.0-release147-rc1"')==1
              assert new_installer.count(b'RUNTIME_MANIFEST_BLOB="'+blob(new.read(pfx+"RUNTIME.gitblob")).encode()+b'"')==1
              subprocess.run(["bash","-n"],input=new_installer,check=True)
          print("GENUINE146_TO_147RC_PACKAGE=PASS")
          print("UNCHANGED_146_RUNTIME_PRESERVED=PASS")
          print("EXACT_FOUR_PATCH_FILES=PASS")
          print("CANDIDATE_ONLY_NOT_PUBLISHED=YES")
          PY
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/.p07-governance" \
            --git-root . --base-sha "$SOURCE_BASE" --head-sha "$SOURCE_SHA" \
            > "$RUNNER_TEMP/p07-archive-scope.log"
          echo ARCHITECTURE=PASS
          python3 -B scripts/check_p07_modules.py > "$RUNNER_TEMP/p07-module-scope.log"
          echo MODULE_ISOLATION=PASS
          python3 -B scripts/secret_scan.py --root . > "$RUNNER_TEMP/p07-secret-scope.log"
          echo SECRET_SCAN=PASS
      - name: Always clean synthetic database container and private checkout
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter "name=p07-native-catalog-$GITHUB_RUN_ID" | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private-product" "$GITHUB_WORKSPACE/.p07-governance"
          rm -f -- "$RUNNER_TEMP/p07-release146.zip" "$RUNNER_TEMP/p07-release147-rc1.zip" \
            "$RUNNER_TEMP/p07-archive-scope.log" "$RUNNER_TEMP/p07-module-scope.log" \
            "$RUNNER_TEMP/p07-secret-scope.log" "$RUNNER_TEMP/clpctl-fixture"
          echo EPHEMERAL_PRIVATE_CLEANUP=COMPLETE
