name: TEMP P07 M03 D04 official146 and native catalog proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-d04-official146-native-20261123.yml'
permissions:
  contents: read
jobs:
  bounded-proof:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-d04-release146-native-catalog-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SOURCE_SHA: 'd9bf9e78bb436437c2cc5cf4ef99d2d6bd91371f'
      SOURCE_BASE: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout exact private product source without persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private-product
      - name: Verify genuine official146 runtime archive and module identities
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          product="$GITHUB_WORKSPACE/.p07-private-product"
          [[ "$(git -C "$product" rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -f "$product/lib/migration_cloudpanel_sql_probe.py" ]]
          curl -fLsS --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 20 --max-time 190 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release146-20261122/P07-M03-0.1.0-release146.zip' \
            -o "$RUNNER_TEMP/p07-release146.zip"
          echo '7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321  '"$RUNNER_TEMP/p07-release146.zip" | sha256sum -c - >/dev/null
          python3 -B - "$RUNNER_TEMP/p07-release146.zip" "$product" "$SOURCE_BASE" <<'PY'
          import hashlib, pathlib, subprocess, sys, zipfile
          zip_path=pathlib.Path(sys.argv[1])
          product=pathlib.Path(sys.argv[2])
          base_sha=sys.argv[3]
          prefix="dist/p07/0.1.0/overlay/"
          with zipfile.ZipFile(zip_path) as archive:
              manifest=archive.read(prefix+"RUNTIME.gitblob")
              build=archive.read(prefix+"BUILD_ID")
              assert build==b"0.1.0-release146\n"
              blob=lambda data: hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert blob(manifest)=="78caa4b85edc5441039483117e3f9660cf6e3af6"
              rows=[x.split("  ",1) for x in manifest.decode().splitlines()]
              names=set()
              for digest,name in rows:
                  assert name not in names
                  names.add(name)
                  assert blob(archive.read(prefix+name))==digest
              essential={"lib/migration_safe_batch_io.py",
                         "lib/migration_cloudpanel_sql_probe.py",
                         "lib/migration_native_datadir_guard.py",
                         "components/p07-m03-safe-batch-ui.sh"}
              present=essential&names
              print("OFFICIAL146_HASH_AND_RUNTIME=PASS")
              print("OFFICIAL146_NATIVE_CATALOG_FILES="+str(len(present))+"/"+str(len(essential)))
              for name in sorted(essential):
                  print("OFFICIAL146_RUNTIME_"+name.split("/")[-1]+"="+("PRESENT" if name in names else "ABSENT"))
                  if name in names:
                      result=subprocess.run(["git","-C",str(product),"show",base_sha+":"+name],
                                            capture_output=True,check=True)
                      official=blob(archive.read(prefix+name))
                      baseline=blob(result.stdout)
                      print("OFFICIAL146_BASELINE_"+name.split("/")[-1]+"="+
                            ("MATCH" if official==baseline else "DIFFERENT"))
          PY
      - name: Run safe local Percona 8.4 read-only SQL catalog probe
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo -n apt-get update -qq >/dev/null
          sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq default-mysql-client >/dev/null
          docker pull -q percona/percona-server:8.4.11 >/dev/null
          name="p07-native-catalog-$GITHUB_RUN_ID"
          password='p07-only-synthetic-local-8_4'
          docker run -d --rm --name "$name" -e MYSQL_ROOT_PASSWORD="$password" \
            -p 127.0.0.1:33306:3306 percona/percona-server:8.4.11 >/dev/null
          ready=0
          for i in $(seq 1 75); do
            if MYSQL_PWD="$password" mysql --no-defaults --protocol=tcp --host=127.0.0.1 \
              --port=33306 --user=root --connect-timeout=2 --batch --skip-column-names \
              --execute 'SELECT 1' >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          [[ "$ready" -eq 1 ]] || { echo PERCONA_SERVER_START=FAIL; exit 1; }
          MYSQL_PWD="$password" mysql --no-defaults --protocol=tcp --host=127.0.0.1 \
              --port=33306 --user=root --execute 'CREATE DATABASE p07_synthetic_occupied' >/dev/null
          fixture="$RUNNER_TEMP/clpctl-fixture"
          cat > "$fixture" <<'SH'
          #!/usr/bin/env bash
          [[ "$1" == "db:show:master-credentials" ]] || exit 13
          cat <<'TABLE'
          +-----------+------------------------------+
          | Name      | Value                        |
          +-----------+------------------------------+
          | Host      | 127.0.0.1                    |
          | User Name | root                         |
          | Password  | p07-only-synthetic-local-8_4 |
          | Port      | 33306                        |
          +-----------+------------------------------+
          TABLE
          SH
          chmod 700 "$fixture"
          sudo -n env P07_PRODUCT="$GITHUB_WORKSPACE/.p07-private-product" P07_CLPCTL="$fixture" \
            /usr/bin/python3 -B - <<'PY'
          import os, pathlib, sys
          from unittest import mock
          sys.path.insert(0,str(pathlib.Path(os.environ["P07_PRODUCT"])/"lib"))
          import migration_cloudpanel_sql_probe as probe
          import migration_safe_batch_io as io
          assert os.geteuid()==0
          fixture=os.environ["P07_CLPCTL"]
          def which(name):
              if name=="clpctl": return fixture
              if name in ("mysql","mariadb"): return "/usr/bin/mysql"
              return None
          os.environ["MYSQL_PWD"]="wrong-inherited-secret-is-ignored"
          with mock.patch.object(probe.shutil,"which",side_effect=which):
              live=io.live_sql_database_names()
              assert live is not None, "LIVE_SQL_CATALOG_UNVERIFIED"
              assert {"information_schema","mysql","p07_synthetic_occupied"}.issubset(live), "OCCUPIED_DATABASE_MISSING"
              datadir=probe.readonly_sql_from_cloudpanel("SELECT @@datadir","/usr/bin/mysql")
              assert datadir is not None and datadir.startswith("/"), "LIVE_SQL_DATADIR_UNVERIFIED"
          print("REAL_PERCONA84_METADATA_SQL=PASS")
          print("REAL_CLOUDPANEL_FORMAT_FIXTURE=PASS")
          print("REAL_DB_OCCUPANCY_DETECTION=PASS")
          print("LIVE_CLOUDPANEL_INSTALL=NOT_RUN")
          print("DUAL_CLOUDPANEL_MIGRATION=NOT_RUN")
          PY
      - name: Always clean synthetic database container and private checkout
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter "name=p07-native-catalog-$GITHUB_RUN_ID" | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private-product"
          rm -f -- "$RUNNER_TEMP/p07-release146.zip" "$RUNNER_TEMP/clpctl-fixture"
          echo EPHEMERAL_PRIVATE_CLEANUP=COMPLETE
