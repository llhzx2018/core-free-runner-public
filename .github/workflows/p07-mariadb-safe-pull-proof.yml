name: P07 MariaDB 10.11 Pull Safety Full Regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'candidates/p07-mariadb-1011-safe-pull/**'
      - '.github/workflows/p07-mariadb-safe-pull-proof.yml'
permissions:
  contents: read
jobs:
  mariadb-safe-pull-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact source, no production scripts, and complete migration regression
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg=candidates/p07-mariadb-1011-safe-pull
          test "$(git hash-object "$pkg/lib/server_migration.py")" = 5972f94a8957f436c3fe80d47748ad9a280c08dd
          test "$(git hash-object "$pkg/lib/server_migration_pull.py")" = 80f8d5ec8af6265ef1f33d981da665f64b7f403b
          test "$(git hash-object "$pkg/bin/vfops-init-ui")" = ebc414c1aaa3aaf82d4fe71b408b78cbdb653b30
          test "$(git hash-object "$pkg/tests/test_server_migration.py")" = 59b3ec26d4215542456dbed69b98948e89ffe94b
          test "$(git hash-object "$pkg/tests/test_mariadb_owner_policy.py")" = 3a094e024dc0237413eb235d915264d0fbfd2a6a
          test "$(git hash-object "$pkg/tests/test_server_migration_pull.py")" = 6bbbe7dc77ceee8417c4118bd414140afb251129
          bash -n "$pkg/bin/vfops-init-ui"
          python3 -m py_compile "$pkg/lib/server_migration.py" "$pkg/lib/server_migration_pull.py" "$pkg/tests/test_mariadb_owner_policy.py"
          mkdir -p "$RUNNER_TEMP/p07"
          cp -a dist/p07/0.1.0/overlay/. "$RUNNER_TEMP/p07/"
          cp "$pkg/lib/server_migration.py" "$RUNNER_TEMP/p07/lib/"
          cp "$pkg/lib/server_migration_pull.py" "$RUNNER_TEMP/p07/lib/"
          cp "$pkg/bin/vfops-init-ui" "$RUNNER_TEMP/p07/bin/"
          cp "$pkg/tests/test_server_migration.py" "$RUNNER_TEMP/p07/tests/"
          cp "$pkg/tests/test_server_migration_pull.py" "$RUNNER_TEMP/p07/tests/"
          cp "$pkg/tests/test_mariadb_owner_policy.py" "$RUNNER_TEMP/p07/tests/"
          cd "$RUNNER_TEMP/p07"
          PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull
          echo P07_MARIADB_PULL_EXACT_SOURCE_MACHINE_PASS
