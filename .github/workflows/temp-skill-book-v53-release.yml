name: TEMP skill-book V5.3 exact-release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v53-exact-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: c7c32f9294ebf8fe4aade9b0668103407e8a520f
      TAG: skill-book-v5.3-candidate-20260828
      ZIP_NAME: skill-book_V5.3_CANDIDATE_20260828.zip
      ZIP_SHA256: fefb93eaab47255b33e1c4cd21800daab3bcfb4d70b9b92043b1a0a1c11767d8
      ZIP_BYTES: '346582'
      RUNTIME_CONTRACT_ID: SB53-RUNTIME-CONTRACT-A73E19C4
    steps:
      - name: Checkout exact V5.3 source commit
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: c7c32f9294ebf8fe4aade9b0668103407e8a520f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$SOURCE_COMMIT"
          ROOT="$GITHUB_WORKSPACE/gov/skills/skill-book/V5.3"
          test -d "$ROOT"
          test "$(cat "$ROOT/VERSION" | tr -d '\r\n')" = '5.3'
          python - <<'PY'
          import json, pathlib
          r=pathlib.Path('gov/skills/skill-book/V5.3')
          m=json.loads((r/'MANIFEST.json').read_text())
          assert m['version']=='5.3'
          assert m['runtime_contract_id']=='SB53-RUNTIME-CONTRACT-A73E19C4'
          assert len([p for p in r.rglob('*') if p.is_file()])==86
          assert not [p for p in r.rglob('*') if p.name in {'.pytest_cache','__pycache__'} or p.suffix=='.pyc']
          PY
          cd "$ROOT"
          sha256sum -c SHA256SUMS.txt

      - name: Python syntax 35 of 35
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/gov/skills/skill-book/V5.3"
          python - <<'PY'
          import pathlib, py_compile
          r=pathlib.Path('gov/skills/skill-book/V5.3'); fs=sorted(r.rglob('*.py')); assert len(fs)==35, len(fs)
          for p in fs: py_compile.compile(str(p), doraise=True)
          print('PYTHON_SYNTAX_PASS=35/35')
          PY
          find "$ROOT" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$ROOT" -type f -name '*.pyc' -delete

      - name: Release exact-source regression 86 of 86
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/gov/skills/skill-book/V5.3"
          cd "$ROOT"
          python -m pip install -q pytest
          python -m pytest --collect-only -q > /tmp/collect.txt
          grep -Eq '86 tests collected' /tmp/collect.txt
          python -m pytest -q
          rm -rf .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Build exact deterministic Candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, zipfile
          root=pathlib.Path('gov/skills/skill-book/V5.3')
          out=pathlib.Path('/tmp/skill-book_V5.3_CANDIDATE_20260828.zip')
          prefix='skill-book_V5.3_CANDIDATE'
          files=sorted((p for p in root.rglob('*') if p.is_file()), key=lambda p:p.relative_to(root).as_posix())
          assert len(files)==86, len(files)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in files:
                  zi=zipfile.ZipInfo(f'{prefix}/{p.relative_to(root).as_posix()}',(1980,1,1,0,0,0))
                  zi.compress_type=zipfile.ZIP_STORED; zi.create_system=3; zi.external_attr=(0o100644&0xffff)<<16
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes(); h=hashlib.sha256(b).hexdigest()
          print('ZIP_BYTES='+str(len(b))); print('ZIP_SHA256='+h)
          assert len(b)==346582, len(b)
          assert h=='fefb93eaab47255b33e1c4cd21800daab3bcfb4d70b9b92043b1a0a1c11767d8', h
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              infos=z.infolist(); assert len(infos)==86 and len({i.filename for i in infos})==86
              assert all(i.compress_type==0 and i.date_time==(1980,1,1,0,0,0) and (i.external_attr>>16)==0o100644 for i in infos)
          PY
          printf '%s  %s\n' "$ZIP_SHA256" "$ZIP_NAME" > "/tmp/$ZIP_NAME.sha256"
          (cd /tmp && sha256sum -c "$ZIP_NAME.sha256")

      - name: Ensure V5.3 release identity is unused
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/llhzx2018/gov-doc/releases/tags/$TAG" >/tmp/existing.json 2>/dev/null; then
            echo 'Release already exists; refusing to overwrite.' >&2
            cat /tmp/existing.json >&2
            exit 1
          fi
          if gh api "repos/llhzx2018/gov-doc/git/ref/tags/$TAG" >/tmp/tag.json 2>/dev/null; then
            echo 'Tag already exists; refusing to retarget.' >&2
            cat /tmp/tag.json >&2
            exit 1
          fi

      - name: Create V5.3 Candidate prerelease and upload exact assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          skill-book V5.3 Candidate — NOT CURRENT.

          Source Current remains skill-book V3.5. V5.3 closes the Fresh V5.2 A1 defect family around Book-Promise Responsibility Depth, FIRST_FREEZE / holdout ordering, and standalone holdout deadlock. A frozen deterministic local holdout is explicitly LOCAL_FROZEN_NON_OPAQUE evidence and does not masquerade as an external opaque evaluator.

          Exact-source regression: 86/86 PASS. Python syntax: 35/35 PASS. Deterministic Candidate ZIP: 346582 bytes, SHA-256 fefb93eaab47255b33e1c4cd21800daab3bcfb4d70b9b92043b1a0a1c11767d8.

          Real Reader Evidence: NOT_RUN. Backend-installed V5.3 Runtime: NOT_RUN. Current Promotion: NOT_AUTHORIZED.
          EOF
          gh release create "$TAG" "/tmp/$ZIP_NAME" "/tmp/$ZIP_NAME.sha256" \
            --repo llhzx2018/gov-doc \
            --title 'skill-book V5.3 Candidate' \
            --notes-file /tmp/release-notes.md \
            --target "$SOURCE_COMMIT" \
            --prerelease

      - name: Read back stable release and asset identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/gov-doc/releases/tags/$TAG" > /tmp/release.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['prerelease'] is True
          assert r['tag_name']=='skill-book-v5.3-candidate-20260828'
          assert r['target_commitish']=='c7c32f9294ebf8fe4aade9b0668103407e8a520f'
          a={x['name']:x for x in r['assets']}
          z=a['skill-book_V5.3_CANDIDATE_20260828.zip']
          s=a['skill-book_V5.3_CANDIDATE_20260828.zip.sha256']
          assert z['size']==346582, z['size']
          d=z.get('digest')
          if d is not None: assert d=='sha256:fefb93eaab47255b33e1c4cd21800daab3bcfb4d70b9b92043b1a0a1c11767d8', d
          print('RELEASE_ID='+str(r['id']))
          print('ZIP_ASSET_ID='+str(z['id']))
          print('SHA_ASSET_ID='+str(s['id']))
          PY
          echo "release_id=$(python -c "import json; print(json.load(open('/tmp/release.json'))['id'])")" >> "$GITHUB_OUTPUT"
          echo "zip_asset_id=$(python -c "import json; r=json.load(open('/tmp/release.json')); print(next(x['id'] for x in r['assets'] if x['name']=='skill-book_V5.3_CANDIDATE_20260828.zip'))")" >> "$GITHUB_OUTPUT"
          echo "sha_asset_id=$(python -c "import json; r=json.load(open('/tmp/release.json')); print(next(x['id'] for x in r['assets'] if x['name']=='skill-book_V5.3_CANDIDATE_20260828.zip.sha256'))")" >> "$GITHUB_OUTPUT"

      - name: Remote download readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/readback && mkdir /tmp/readback
          gh release download "$TAG" --repo llhzx2018/gov-doc --dir /tmp/readback --pattern "$ZIP_NAME" --pattern "$ZIP_NAME.sha256"
          cd /tmp/readback
          sha256sum -c "$ZIP_NAME.sha256"
          test "$(stat -c%s "$ZIP_NAME")" = '346582'
          test "$(sha256sum "$ZIP_NAME" | awk '{print $1}')" = "$ZIP_SHA256"
          python - <<'PY'
          import zipfile
          p='/tmp/readback/skill-book_V5.3_CANDIDATE_20260828.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              infos=z.infolist(); assert len(infos)==86; assert len({i.filename for i in infos})==86
              assert all(not ('__pycache__' in i.filename or i.filename.endswith('.pyc') or '.pytest_cache' in i.filename) for i in infos)
          print('REMOTE_DOWNLOAD_READBACK=PASS')
          PY
          echo "V53_RELEASE_GATE=PASS"
