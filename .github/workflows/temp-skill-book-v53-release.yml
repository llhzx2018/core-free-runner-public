name: TEMP skill-book V5.3 governance reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  v53-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: c7c32f9294ebf8fe4aade9b0668103407e8a520f
      EXPECTED_CURRENT_DIST_BLOB: ae60b9363dfc23ff0e6721f805b6619846f28ff7
      TAG: skill-book-v5.3-candidate-20260828
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@v4

      - name: Checkout locked GOV-DOC main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0

      - name: Guard main, release and Current Distribution
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C gov ls-tree HEAD -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json | awk '{print $3}')" = "$EXPECTED_CURRENT_DIST_BLOB"
          test ! -e gov/mother-specs/skill-book/V5.3
          test ! -e gov/distribution/skills/candidates/skill-book/V5.3
          gh api "repos/llhzx2018/gov-doc/releases/tags/$TAG" > /tmp/release.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/release.json'))
          assert r['id']==378678631
          assert r['prerelease'] is True
          assert r['target_commitish']=='c7c32f9294ebf8fe4aade9b0668103407e8a520f'
          a={x['name']:x for x in r['assets']}
          z=a['skill-book_V5.3_CANDIDATE_20260828.zip']; s=a['skill-book_V5.3_CANDIDATE_20260828.zip.sha256']
          assert z['id']==534177144 and s['id']==534177145
          assert z['size']==346582
          assert z.get('digest')=='sha256:fefb93eaab47255b33e1c4cd21800daab3bcfb4d70b9b92043b1a0a1c11767d8'
          PY

      - name: Apply V5.3 governance reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python .temp/v53/reconcile_v53.py gov
          test -z "$(git -C gov diff --name-only -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)"
          grep -F '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' gov/CURRENT.md
          grep -F '`V5.3` 为最新 Candidate' gov/CURRENT.md
          grep -F '`skill-book V5.3` 是最新 `CANDIDATE / NOT CURRENT`' gov/distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -F '| skill-book | V3.5 | `skill-book_V3.5_INSTALL_20260825.zip`' gov/distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md

      - name: Commit and push governance reconciliation
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          git -C gov fetch origin main
          test "$(git -C gov rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git -C gov ls-tree origin/main -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json | awk '{print $3}')" = "$EXPECTED_CURRENT_DIST_BLOB"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md mother-specs/skill-book/V5.3 distribution/skills/candidates/skill-book/V5.3
          CHANGED="$(git -C gov diff --cached --name-only | sort)"
          echo "$CHANGED"
          test "$(printf '%s\n' "$CHANGED" | sed '/^$/d' | wc -l)" = '5'
          test -z "$(printf '%s\n' "$CHANGED" | grep -F 'CURRENT_SKILL_DISTRIBUTION.json' || true)"
          git -C gov commit -m 'skill-book: publish V5.3 candidate governance'
          COMMIT="$(git -C gov rev-parse HEAD)"
          git -C gov push origin HEAD:main
          echo "governance_commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "GOVERNANCE_COMMIT=$COMMIT"

      - name: Remote governance readback
        shell: bash
        run: |
          set -euo pipefail
          git -C gov fetch origin main
          test "$(git -C gov rev-parse origin/main)" = "${{ steps.reconcile.outputs.governance_commit }}"
          test "$(git -C gov ls-tree origin/main -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json | awk '{print $3}')" = "$EXPECTED_CURRENT_DIST_BLOB"
          git -C gov show origin/main:CURRENT.md | grep -F '`V5.3` 为最新 Candidate'
          git -C gov show origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md | grep -F '`skill-book V5.3` 是最新 `CANDIDATE / NOT CURRENT`'
          git -C gov show origin/main:mother-specs/skill-book/V5.3/SKILL_BOOK_V5.3_CANDIDATE_OVERLAY.md | grep -F 'Release ID: `378678631`'
          git -C gov show origin/main:distribution/skills/candidates/skill-book/V5.3/README.md | grep -F 'Latest Candidate：`V5.3`'
          git -C gov show origin/main:distribution/skills/candidates/skill-book/V5.3/RUNTIME_ZIP_MIRROR_STATUS.md | grep -F 'PENDING_FINAL_CLOSE / MUST NOT MERGE'
          echo 'V53_GOVERNANCE_RECONCILIATION=PASS'
