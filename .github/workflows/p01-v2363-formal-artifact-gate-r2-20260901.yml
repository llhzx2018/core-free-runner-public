name: P01 V2.36.3 Formal Artifact Gate R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-formal-artifact-gate-r2-20260901.yml]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      FORMAL_RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      MAIN_EXPECTED: 896723136e7535aa94d8d23deef39b892fd2f643
      DEVELOP_EXPECTED: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      SOURCE: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      SOURCE_TREE: 0f0e5329098ad5a87a4a72dbd368c88d7a44b339
      SOURCE_RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      VERSION: 2.36.3
      SOURCE_VERSION: 2.36.2
      SCHEMA: '2026082901'
      CANDIDATE_GATE: '33501907010'
      CANDIDATE_ARTIFACT: '9798055642'
      CANDIDATE_DIGEST: 39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa
      OUT: /tmp/p01-v2363-formal-artifacts
      EVID: /tmp/p01-v2363-formal-evidence
      UPGRADE: /tmp/p01-v2363-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2363-candidate-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 71c0ddf946974a6d6ac75bc629ffc07256eb9e4f
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Generate fenced formal gates
        run: python3 runner/scripts/p01_v2363_formal_gate_generate.py
      - name: Exact formal fence
        run: bash /tmp/p01-v2363-formal-generated/01-exact.sh
      - name: Build deterministic formal release artifacts
        run: bash /tmp/p01-v2363-formal-generated/02-build.sh
      - name: Actual formal V2.36.2 to V2.36.3 upgrade
        run: bash /tmp/p01-v2363-formal-generated/03-atomic.sh
      - name: Final formal verdict
        shell: bash
        run: |
          printf 'P01_V2363_FORMAL_ARTIFACT_GATE_R2=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nMIGRATION=NONE\nCANDIDATE_GATE=%s/PASS\nFORMAL_R1=HARNESS_ONLY_MISSING_ENV\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$CANDIDATE_GATE" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2363-formal-artifacts-r2-${{ github.run_id }}
          path: |
            /tmp/p01-v2363-formal-artifacts
            /tmp/p01-v2363-formal-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2363-formal.pid 2>/dev/null)" 2>/dev/null || true
