name: S01 Theme 1.35.26 Update Center Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4

      - name: Resolve governed Theme read credential
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          choose=''
          for candidate_name in VF_PRIVATE_READ_TOKEN VF_RELEASE_WRITE_TOKEN; do
            candidate="${!candidate_name:-}"
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $candidate" https://api.github.com/repos/llhzx2018/vf-tools-theme || true)"
            if [ "$code" = "200" ]; then
              choose="$candidate_name"
              break
            fi
          done
          [ -n "$choose" ] || { echo 'No governed token can read Theme repo' >&2; exit 1; }
          echo "token_name=$choose" >> "$GITHUB_OUTPUT"
          echo "PASS governed credential available: $choose"

      - name: Checkout exact Theme candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.auth.outputs.token_name }}" = "VF_PRIVATE_READ_TOKEN" ]; then TOKEN="$VF_PRIVATE_READ_TOKEN"; else TOKEN="$VF_RELEASE_WRITE_TOKEN"; fi
          rm -rf theme
          mkdir theme
          cd theme
          git init -q
          git remote add origin https://github.com/llhzx2018/vf-tools-theme.git
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/work/s01-v6-update-center-uxui-20260917:refs/remotes/origin/candidate
          git checkout --detach refs/remotes/origin/candidate
          test "$(git rev-parse HEAD)" = "f63ddfa8322ab7e9e53c28398c5e7672f96a77fe"
          test "$(git rev-parse refs/remotes/origin/main)" = "9eaaa558323613f4d688b7c50a27fdf120fa6f48"
          echo "PASS exact private Theme refs fetched"

      - name: Exact source identity and five-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          actual="$(git diff --name-only refs/remotes/origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            src/assets/css/admin/admin-update-center.css \
            src/style.css \
            tests/update-center-human-language-contract.php \
            tests/update-refresh-policy-contract.php | sort)"
          test "$actual" = "$expected"
          echo "PASS exact SHA + five-file scope"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l theme/src/inc/update/class-vf-wp-update-admin-v1.php
          php -l theme/tests/update-center-human-language-contract.php
          php -l theme/tests/update-refresh-policy-contract.php
          echo "PASS PHP syntax"

      - name: Update center contracts
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/update-center-human-language-contract.php
          php tests/update-refresh-policy-contract.php

      - name: Version and round identity
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          test "$(cat VERSION)" = "1.35.26"
          grep -Fq 'Version: 1.35.26' src/style.css
          grep -Fq 'V1.35.26_S01_UPDATE_CENTER_MATURE_ADMIN_UI' src/style.css
          echo "PASS version identity"

      - name: Mature admin visual and ownership fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          css=src/assets/css/admin/admin-update-center.css
          admin=src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq -- '--vf-accent: #0891b2;' "$css"
          grep -Fq 'background: transparent;' "$css"
          grep -Fq '.vf-update-components {' "$css"
          grep -Fq 'display: block;' "$css"
          grep -Fq ':focus-visible' "$css"
          ! grep -Fq 'border-radius: 20px;' "$css"
          ! grep -Fq 'linear-gradient(135deg, #f3f9fe 0%, #ffffff 62%)' "$css"
          ! grep -Fq 'repeat(auto-fit, minmax(300px, 1fr))' "$css"
          grep -Fq "apply_filters('vf_wp_update_components_v1'" "$admin"
          test "$(grep -Fc "add_management_page(" "$admin")" = "1"
          grep -Fq 'private const RECEIPT_TTL = 600;' "$admin"
          ! grep -Fq "'token' =>" "$admin"
          ! grep -Fq "'authorization' =>" "$admin"
          echo "PASS mature admin UI + single-owner update-center fence"
