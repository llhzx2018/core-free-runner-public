name: TEMP S01-C02 Ops 1.21.847 Production Readback 2
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-production-readback-2.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      BASE: https://www3.m3u8.one/wp-json/vf-ops/v1
    steps:
      - name: Poll exact V1.21.847 recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$BASE/s01-static-candidate-readiness" -o /tmp/static.json
            echo "=== SAMPLE $i ==="
            jq -c '{pluginVersion,sourceArtifactAvailable,manualSourceUploadRequired,candidatePackageReady,finalOnlinePass,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,activeStaticJobFailureClass,activeStaticJobFailureCodes,sourceRecoveryRootPrepareStatus,sourceRecoveryRootPrepareCode,sourceRecoveryRootPrepareOldBuildOffset,sourceRecoveryRootPrepareOldBuildTotal,sourceRecoveryRootPrepareCandidateStatus,sourceRecoveryRootPrepareCandidateCurrentStage,sourceRecoveryRootPrepareCandidateAuditFailureCount,sourceRecoveryRootPrepareCandidateFailureClass,sourceRecoveryRootPrepareCandidateBuildOffset,sourceRecoveryRootPrepareCandidateBuildTotal,sourceRecoveryRootPrepareCandidateHelperPhase,sourceRecoveryRootPrepareCandidateHelpersWritten,sourceRecoveryRootPrepareCandidateCompletenessStatus}' /tmp/static.json
            if [ "$i" != 8 ]; then sleep 5; fi
          done
      - name: Verify fixed Production boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.pluginVersion=="1.21.847" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false' /tmp/static.json >/dev/null
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_PRODUCTION_READBACK_2
