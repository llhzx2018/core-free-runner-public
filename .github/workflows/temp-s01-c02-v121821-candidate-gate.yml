name: TEMP S01-C02 v1.21.821 Candidate Gate
on:
  push:
    branches: [temp/s01-c02-production-readback-20260904-current]
    paths: ['.github/workflows/temp-s01-c02-v121821-candidate-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: 562827263f4d8fe93aee3ea6fb445164cfa5242a
      CANDIDATE_SHA: 696fb2d936210a2a179dec5fea4a2c6594d65df6
      CANDIDATE_TREE: 28c459d52596108c942d92e04c182b32dbdb3969
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Gate exact scope behavior and deterministic artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-list --count "$BASE_SHA..$CANDIDATE_SHA")" = 1
          test "$(git rev-list --count "$CANDIDATE_SHA..$BASE_SHA")" = 0
          test "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort | tr '\n' ' ')" = '.github/phase3/v121821-candidate-worker-resilience.php VERSION assets/js/admin-publish-zip.js vf-ops.php '
          test -z "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- includes/release includes/site-release includes/publish-o10)"
          test "$(cat VERSION)" = '1.21.821'
          grep -q 'Version: 1.21.821' vf-ops.php
          grep -q "define('VF_OPS_VERSION', '1.21.821')" vf-ops.php
          grep -q "CANDIDATE-WORKER-RESILIENCE-V1" vf-ops.php
          node --check assets/js/admin-publish-zip.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/admin-publish-zip.js').read_text()
          checks={
            'bounded_retry':'var attempts=0,maxAttempts=6;' in s,
            'passive_status':"vf_ops_release_job_status" in s and 'async function passiveJobStatus()' in s,
            'retry_timeout':'error.timeout' in s,
            'retry_network':'Failed to fetch|NetworkError|Load failed' in s,
            'retry_backoff':'Math.pow(2,attempts-1)' in s,
            'loop_uses_recovery':'var data=await runStageWithRecovery();updateJob(data);' in s,
            'explicit_pause':"action==='pause'" in s and 'vf_ops_release_job_pause' in s,
            'permanent_throw':'if(!jobTransientError(error)||attempts>=maxAttempts)throw error;' in s,
            'status_terminal':'if(statusData&&statusData.terminal)return statusData;' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          assert not bad,bad
          assert "var data=await jobCall('vf_ops_release_job_run');updateJob(data);" not in s
          print('PASS_V121821_WORKER_RECOVERY_BEHAVIOR')
          PY
          grep -q 'acquire_run_lock_v121305' includes/release/async-job-parts/03-job-state-trait.php
          grep -q 'release_run_lock_v121305' includes/release/async-job-parts/03-job-state-trait.php
          grep -q 'data-vf-publish-autostart' includes/admin-v13/views/publish_zip.php
          grep -q 'finalOnlinePass' includes/site-release/s01-static-candidate-readiness.php
          ! git diff "$BASE_SHA" "$CANDIDATE_SHA" -- | grep -Ei 'm3u8.*(delete|drop|reset|migrat)|seed.*hold.*(off|release)|wpvivid.*(remove|delete)|jd\.gg.*(remove|delete)|dns.*(write|update)' >/dev/null
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('.'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          fp=hashlib.sha256()
          for rel,b in runtime: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/vf-tools-ops_V1.21.821.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          print('RUNTIME_FILES='+str(len(runtime)))
          print('RUNTIME_FP='+fp.hexdigest())
          print('ASSET_BYTES='+str(z.stat().st_size))
          print('ASSET_SHA='+hashlib.sha256(z.read_bytes()).hexdigest())
          assert len(runtime)==905
          PY
          echo PASS_V121821_CANDIDATE_GATE
