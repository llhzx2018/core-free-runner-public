name: S01 C03 M3U8 12581 Native WordPress Update Discovery
on:
  push:
    branches: [task/s01-c03-playlist12581-native-20261011]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CHANNEL_SHA: 'bd1dfa998aa4ea6b518bcdf6299522e0b4944ac5'
      PRODUCT_SHA: '37729257ab9f453728b5d434708e8e7a2a7c1fa6'
      PRODUCT_TREE: 'dd67c0bc40b6bdbe5442c5a8161829cbb699dd7d'
      PRODUCT_FP: 'e8ed020f381baa8d2725289e552df9ab9fe0df8a8385877ed1af2fa4b75a482f'
      SOURCE_VERSION: '1.25.80'
      TARGET_VERSION: '1.25.81'
      ASSET_SHA: '353a784c59fef8b14e47df7b2ab2e76bb51cc5a1e4150fc9032f31d2ee4c4c3f'
    steps:
      - name: Checkout public test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact distributed channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CHANNEL_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Checkout formally released product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Validate published channel and native WordPress install
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          cp -a runner/lanes/s01-c03-playlist12581-native lane
          bash -n lane/native.sh
          php -l lane/discovery.php
          bash lane/native.sh
      - name: Upload public-safe native receipts
        if: success()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-native12581-${{ github.run_id }}
          path: |
            proof/channel.json
            proof/native.json
            proof/installed.json
            proof/FINAL_DISCOVERY.json
          if-no-files-found: error
          retention-days: 30
      - name: Remote readback native receipts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" >/tmp/native-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >/tmp/native-archive.zip
          python3 - <<'PY'
          import pathlib,json,os,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text())
          blob=pathlib.Path('/tmp/native-archive.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert m['digest']=='sha256:'+hashlib.sha256(blob).hexdigest() and m['size_in_bytes']==len(blob)
          with zipfile.ZipFile('/tmp/native-archive.zip') as z:
           assert z.testzip() is None
           names={'channel.json','native.json','installed.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           assert json.loads(z.read('FINAL_DISCOVERY.json'))['status']=='PASS'
          print('S01_C03_PUBLIC_NATIVE_READBACK_PASS',m['id'],m['digest'])
          PY
      - name: Destroy transient private source
        if: always()
        run: rm -rf channel product lane /tmp/source-12580.zip /tmp/target-12581.zip /tmp/channel-12581.json /tmp/s01-wp-cli.phar
