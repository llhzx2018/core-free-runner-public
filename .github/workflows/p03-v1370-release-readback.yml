name: P03 V1.37.0 Release Readback

on:
  workflow_run:
    workflows: ['P03 V1.37.0 Formal Release Bridge R2']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  CORE_UPDATES_REPOSITORY: llhzx2018/core-updates
  SOURCE_COMMIT: 11909e07b682765346d4ef890402b4ce00b91291
  RELEASE_TAG: v1.37.0
  ASSET_NAME: VF_Forge_V1.37.0_UPDATE.zip

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require existing release credential
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"

      - name: Verify main tag release asset and core-updates independently
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          repo="https://x-access-token:${RELEASE_TOKEN}@github.com/${P03_REPOSITORY}.git"
          main=$(git ls-remote "$repo" refs/heads/main | awk '{print $1}')
          tag=$(git ls-remote "$repo" "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          test "$main" = "$SOURCE_COMMIT"
          test "$tag" = "$SOURCE_COMMIT"
          code=$(curl -sS -o "$RUNNER_TEMP/version.json" -w '%{http_code}' -H "Authorization: Bearer $RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$P03_REPOSITORY/contents/VERSION?ref=main")
          test "$code" = '200'
          python3 - "$RUNNER_TEMP/version.json" <<'PY'
          import json,base64,sys
          d=json.load(open(sys.argv[1])); assert base64.b64decode(d['content']).decode().strip()=='1.37.0'
          PY
          rm -rf "$RUNNER_TEMP/release"; mkdir -p "$RUNNER_TEMP/release"
          gh release download "$RELEASE_TAG" --repo "$P03_REPOSITORY" --pattern "$ASSET_NAME" --dir "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$ASSET_NAME"
          sha=$(sha256sum "$RUNNER_TEMP/release/$ASSET_NAME" | awk '{print $1}')
          bytes=$(stat -c%s "$RUNNER_TEMP/release/$ASSET_NAME")
          git clone --depth=1 "https://x-access-token:${RELEASE_TOKEN}@github.com/${CORE_UPDATES_REPOSITORY}.git" "$RUNNER_TEMP/core-updates" >/dev/null 2>&1
          python3 - "$RUNNER_TEMP/core-updates/projects/P03.json" "$sha" "$bytes" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1])); sha=sys.argv[2]; b=int(sys.argv[3])
          assert d['version']=='1.37.0'
          assert d['source_commit']=='11909e07b682765346d4ef890402b4ce00b91291'
          assert d['tag']=='v1.37.0'
          assert d['asset']=='VF_Forge_V1.37.0_UPDATE.zip'
          assert d['sha256']==sha and int(d['bytes'])==b
          assert d['schema_from']==30 and d['schema_to']==30
          assert d['from_versions']==['1.36.2']
          assert d['backup_required'] is True and d['rollback_supported'] is True
          print('REMOTE_RELEASE_READBACK=PASS')
          PY
          echo "$sha" >"$RUNNER_TEMP/sha"
          echo "$bytes" >"$RUNNER_TEMP/bytes"

      - name: Checkout public runner main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          token: ${{ github.token }}
          persist-credentials: true
          path: runner

      - name: Publish final RELEASE_READY receipt to public main
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runner/ops/p03/release
          {
            echo '# P03 V1.37.0 RELEASE READY'
            echo
            echo 'RESULT=PASS'
            echo 'PROJECT=P03 · VF Forge'
            echo 'PRODUCTION_INSTALLED=1.36.2'
            echo 'AVAILABLE_VERSION=1.37.0'
            echo 'SOURCE_COMMIT=11909e07b682765346d4ef890402b4ce00b91291'
            echo 'TAG=v1.37.0'
            echo 'ASSET=VF_Forge_V1.37.0_UPDATE.zip'
            echo "ASSET_SHA256=$(cat "$RUNNER_TEMP/sha")"
            echo "ASSET_BYTES=$(cat "$RUNNER_TEMP/bytes")"
            echo 'SCHEMA_FROM=30'
            echo 'SCHEMA_TO=30'
            echo 'MIGRATION=NONE'
            echo 'FROM_VERSIONS=1.36.2'
            echo 'CORE_UPDATES=REMOTE_READBACK_PASS'
            echo 'GITHUB_RELEASE=REMOTE_READBACK_PASS'
            echo 'PRODUCTION_WRITE=NO'
          } > runner/ops/p03/release/P03_V1370_RELEASE_READY.md
          cd runner
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/p03/release/P03_V1370_RELEASE_READY.md
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(P03): V1.37.0 final release readback'
            git push origin HEAD:main
          fi
          echo 'P03_V1370_RELEASE_READY=PASS'
