name: P01 V2.22.0 Schema Diagnostic

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v222-schema-diagnostic-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 8827e5899984956d95e1b07743040c9be3d5c454
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Fresh setup and print migration state
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v222-diag /tmp/p01-v222-diag.cookies
          cp -a p01/src /tmp/p01-v222-diag
          cd /tmp/p01-v222-diag
          php -S 127.0.0.1:18222 -t . >/tmp/p01-v222-diag-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18222/setup.php -o /tmp/p01-v222-diag-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v222-diag.cookies -b /tmp/p01-v222-diag.cookies http://127.0.0.1:18222/setup.php -o /tmp/p01-v222-diag-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v222-diag-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v222-diag.cookies -b /tmp/p01-v222-diag.cookies -X POST http://127.0.0.1:18222/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V222 Schema Diagnostic' --data-urlencode 'admin_password=P01V222!DiagGate' --data-urlencode 'admin_password_confirm=P01V222!DiagGate' -o /tmp/p01-v222-diag-post.html
          php -r 'require "app/bootstrap.php"; echo json_encode((new VfMigrationRunner(vf_db()))->schemaState(),JSON_UNESCAPED_SLASHES),PHP_EOL; foreach((new VfMigrationRunner(vf_db()))->status() as $r){echo $r["version"]," ",$r["status"]," ",$r["migration_sha256"],PHP_EOL;}'
          php -r 'require "app/bootstrap.php"; echo "PROFILE_TABLE=",(int)(bool)vf_db()->query("SELECT name FROM sqlite_master WHERE type='"'"'table'"'"' AND name='"'"'resource_surface_profiles'"'"'")->fetchColumn(),PHP_EOL;'
