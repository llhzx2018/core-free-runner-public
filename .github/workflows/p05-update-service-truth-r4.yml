name: P05 Update Service Truth Exact Gate R4

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-update-service-truth-r4.yml'

permissions:
  contents: read

jobs:
  exact-source-r4:
    if: github.head_ref == 'tmp/p05-update-service-truth-gate-r4-20260902'
    runs-on: ubuntu-24.04
    env:
      P05_BASE: c251d95c2bdca5e5738604df1b23d29c51057410
      P05_CANDIDATE: 03aac231446ba2f46d8e903ee8e183e876803ec4
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 03aac231446ba2f46d8e903ee8e183e876803ec4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Bind exact source and three-file scope
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          git cat-file -e "$P05_BASE^{commit}"
          test "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" | sort | tr '\n' ' ')" = 'src/client/UpdateShortcut.tsx tests/unit/product-simple-update-ux-truth.test.ts tests/unit/update-shortcut-initialization.test.ts '
          git diff --check "$P05_BASE" "$P05_CANDIDATE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          echo P05_UPDATE_TRUTH_EXACT_SCOPE_R4=PASS

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Prepare exact database authority
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          npm run verify:schema
          echo P05_UPDATE_TRUTH_DATABASE_R4=PASS

      - name: Product and engineering regression
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run security:gate
          echo P05_UPDATE_TRUTH_ENGINEERING_R4=PASS

      - name: Truthful state and browser-secret boundary
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('fs');
          const ui = fs.readFileSync('src/client/UpdateShortcut.tsx', 'utf8');
          const routes = fs.readFileSync('php/src/RuntimeOpsRoutesTrait.php', 'utf8');
          const updater = fs.readFileSync('php/src/PhpUpdater.php', 'utf8');
          const required = [
            '更新服务尚未初始化',
            '完成一次安装环境初始化后即可自动检查版本',
            'serviceUninitialized',
            "status.channel === 'CREDENTIAL_REQUIRED'",
            "status.channel === 'UPDATE_CREDENTIAL_NOT_CONFIGURED'",
            '/api/system/update/status',
            '/api/system/update/apply'
          ];
          for (const token of required) {
            if (!ui.includes(token)) throw new Error(`missing UI truth token: ${token}`);
          }
          const forbidden = [
            '/api/system/update/credential',
            'credentialToken',
            'stepUpPassword',
            'type="password"',
            'localStorage',
            'sessionStorage',
            'GitHub',
            'core-updates',
            'runtime.env',
            '管理员密码',
            '更新读取凭据',
            '稍后再试即可，不需要额外配置'
          ];
          for (const token of forbidden) {
            if (ui.includes(token)) throw new Error(`browser-secret/truth boundary violated: ${token}`);
          }
          if (!routes.includes("'/api/system/update/credential'")) throw new Error('server credential route missing');
          if (!routes.includes('$updater->saveCredential($token)')) throw new Error('server credential save boundary missing');
          if (!routes.includes('STEP_UP_REQUIRED')) throw new Error('server recent-auth boundary missing');
          if (!updater.includes('VF_PRIVATE_READ_TOKEN')) throw new Error('server token authority missing');
          if (!updater.includes('fetchValidatedManifest($token)')) throw new Error('manifest verification missing');
          if (!updater.includes('assertReleaseIdentity($manifest, $found)')) throw new Error('release verification missing');
          if (!updater.includes('writeRuntimeEnvValue(self::TOKEN_ENV, $token)')) throw new Error('private server persistence missing');
          console.log('P05_UPDATE_TRUTH_BROWSER_SECRET_BOUNDARY_R4=PASS');
          NODE

      - name: Seal exact candidate
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          test -z "$(git status --porcelain)"
          echo "P05_UPDATE_TRUTH_EXACT_SHA_R4=$(git rev-parse HEAD)"
          echo "P05_UPDATE_TRUTH_EXACT_TREE_R4=$(git rev-parse HEAD^{tree})"
          echo P05_UPDATE_TRUTH_GATE_R4=PASS
