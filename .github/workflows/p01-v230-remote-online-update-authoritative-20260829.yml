name: P01 V2.30 Authoritative Remote Online Update Gate
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-remote-online-update-authoritative-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v230-authoritative-owner
      PORT: '18630'
      ADMIN_PASS: 'P01V230!Authoritative'
      SOURCE_SHA: aa9070bb810064df2e965a793b999ac8bde5734e
      FORMAL_SOURCE: 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
      FORMAL_TREE: 771125988f07c01740e4b3dc3863ff90ebcdc5dd
      PRODUCT_SOURCE: 426740ee3e36d207581dddf9b3fe5d62fd8d1808
      PRODUCT_TREE: 73ebd54d3113b6c2123af74d6a301294689855c8
      CORE_UPDATES_MAIN: 53fc02ebd99007793877a281e53238a591e7e485
      UPDATE_SHA: 65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0
      UPDATE_BYTES: '1328072'
      RELEASE_ID: '378891859'
      SCHEMA: '2026082901'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.29.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 53fc02ebd99007793877a281e53238a591e7e485
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates

      - name: Independent publication and discovery truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v230-authoritative-evidence && mkdir -p /tmp/p01-v230-authoritative-evidence
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = 2.29.0
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_MAIN"
          jq -e '
            .schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.29.0" and .target_version=="2.30.0" and .update_type=="ATOMIC" and
            .from_versions==["2.29.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.30.0" and
            .release_id==378891859 and .product_identity=="40b2d5239c557ab6c7b9aaaa092acffa9fb926f9" and
            .asset_name=="VF_Start_V2.30.0_UPDATE.zip" and .asset_bytes==1328072 and
            .asset_sha256=="65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-29T06:01:41Z" and .minimum_php=="8.0.0"
          ' updates/projects/P01.json >/dev/null
          test "$(git -C production ls-remote origin refs/tags/v2.30.0 | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.30.0)
          test "$(jq -r .id <<<"$R")" = "$RELEASE_ID"
          test "$(jq -r .tag_name <<<"$R")" = v2.30.0
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          test "$(jq -r .published_at <<<"$R")" = '2026-08-29T06:01:41Z'
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.30.0_UPDATE.zip")' <<<"$R")
          test -n "$A"
          test "$(jq -r .size <<<"$A")" = "$UPDATE_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          gh release download v2.30.0 -R llhzx2018/vf-start -p VF_Start_V2.30.0_UPDATE.zip -D /tmp/p01-v230-authoritative-evidence
          test "$(sha256sum /tmp/p01-v230-authoritative-evidence/VF_Start_V2.30.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s /tmp/p01-v230-authoritative-evidence/VF_Start_V2.30.0_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(unzip -Z1 /tmp/p01-v230-authoritative-evidence/VF_Start_V2.30.0_UPDATE.zip | wc -l)" = 1
          unzip -Z1 /tmp/p01-v230-authoritative-evidence/VF_Start_V2.30.0_UPDATE.zip | grep -Fx repair-v2.30.0.php >/dev/null
          unzip -p /tmp/p01-v230-authoritative-evidence/VF_Start_V2.30.0_UPDATE.zip repair-v2.30.0.php >/tmp/repair-v2.30.0.php
          php -l /tmp/repair-v2.30.0.php >/dev/null
          printf '%s\n' "$R" > /tmp/p01-v230-authoritative-evidence/release.json
          cp updates/projects/P01.json /tmp/p01-v230-authoritative-evidence/P01.json
          echo P01_V230_AUTHORITATIVE_REMOTE_TRUTH=PASS

      - name: Build isolated Owner-like V2.29 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-authoritative.cookies
          cp -a production/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-authoritative-pre.log 2>&1 &
          echo $! >/tmp/p01-v230-authoritative.pid
          COOKIE=/tmp/p01-v230-authoritative.cookies
          for i in $(seq 1 30); do
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v230-authoritative-setup.html && break || sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v230-authoritative-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V230 Authoritative Owner' \
            --data-urlencode "admin_password=$ADMIN_PASS" \
            --data-urlencode "admin_password_confirm=$ADMIN_PASS" \
            -o /tmp/p01-v230-authoritative-setup-post.html
          test -f "$ROOT/app/.runtime.php"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.29.0
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v230-authoritative-evidence/pre-verify.txt | grep -Fx VERIFY_PASS=YES
          echo P01_V230_AUTHORITATIVE_V229_INSTALL=PASS

      - name: Seed representative Public Private domain data
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-authoritative-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());
          $s=new VfSurfaceRepository(vf_db());
          $pub=$r->createCategory(['name'=>'公开导航','description'=>'V230 public','is_private'=>false,'sort_order'=>100]);
          $priv=$r->createCategory(['name'=>'私人导航','description'=>'V230 private','is_private'=>true,'sort_order'=>90]);
          $ids=['pub_cat'=>$pub,'priv_cat'=>$priv,'favorite'=>0];
          for($i=1;$i<=12;$i++){
            $x=$r->saveLink(null,['category_id'=>$pub,'title'=>'公开导航资源 '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://public-nav-'.$i.'.example.com','description'=>'preserve','tags'=>'authority,公开','is_private'=>false,'is_favorite'=>$i===1],'manual');
            if($i===1)$ids['favorite']=(int)$x['id'];
          }
          for($i=1;$i<=3;$i++){
            $r->saveLink(null,['category_id'=>$priv,'title'=>'私人导航资源 '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://private-nav-'.$i.'.example.com','description'=>'private','tags'=>'authority,私人','is_private'=>true],'manual');
          }
          foreach([['channels','频道','公开频道','私人频道'],['watch','电影','公开影视','私人影视'],['topics','AI','公开专题','私人专题']] as $cfg){
            [$domain,$kind,$pubTitle,$privTitle]=$cfg;
            for($i=1;$i<=3;$i++){
              $x=$r->saveLink(null,['category_id'=>$pub,'title'=>$pubTitle.' '.$i,'url'=>'https://'.$domain.'-public-'.$i.'.example.com','description'=>'public domain','tags'=>'authority,公开','is_private'=>false],'manual');
              $profile=['surface'=>$domain,'resource_kind'=>$kind,'note'=>'public-'.$domain.'-'.$i];
              if($domain==='channels')$profile['background_friendly']=true;
              if($domain==='watch'){ $profile['media_year']=2020+$i; $profile['media_status']='want'; }
              if($domain==='topics'){ $profile['source_kind']='remote_url'; $profile['source_ref']='https://'.$domain.'-public-'.$i.'.example.com'; }
              $s->upsertProfile((int)$x['id'],$profile);
            }
            for($i=1;$i<=2;$i++){
              $x=$r->saveLink(null,['category_id'=>$priv,'title'=>$privTitle.' '.$i,'url'=>'https://'.$domain.'-private-'.$i.'.example.com','description'=>'private domain','tags'=>'authority,私人','is_private'=>true],'manual');
              $profile=['surface'=>$domain,'resource_kind'=>$kind,'note'=>'private-'.$domain.'-'.$i];
              if($domain==='channels')$profile['background_friendly']=true;
              if($domain==='watch'){ $profile['media_year']=2010+$i; $profile['media_status']='favorite'; }
              if($domain==='topics'){ $profile['source_kind']='remote_url'; $profile['source_ref']='https://'.$domain.'-private-'.$i.'.example.com'; }
              $s->upsertProfile((int)$x['id'],$profile);
            }
          }
          $db=vf_db();
          $counts=$s->counts(true);
          $before=[
            'links'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn(),
            'categories'=>(int)$db->query("SELECT COUNT(*) FROM categories WHERE lifecycle_state='active'")->fetchColumn(),
            'favorites'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_favorite=1")->fetchColumn(),
            'profiles'=>(int)$db->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn(),
            'schema'=>(string)$db->query("SELECT MAX(version) FROM schema_migrations WHERE status='success'")->fetchColumn(),
            'surface_counts'=>$counts
          ];
          if($before['links']!==30||$before['categories']!==2||$before['favorites']!==1||$before['profiles']!==15||$before['schema']!=='2026082901')throw new RuntimeException('seed counts '.json_encode($before));
          foreach(['start'=>15,'channels'=>5,'watch'=>5,'topics'=>5,'total'=>30] as $k=>$v){if((int)($counts[$k]??-1)!==$v)throw new RuntimeException('surface '.$k);}
          file_put_contents('/tmp/p01-v230-authoritative-before.json',json_encode($before,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          file_put_contents('/tmp/p01-v230-authoritative-ids.json',json_encode($ids,JSON_THROW_ON_ERROR));
          echo "P01_V230_AUTHORITATIVE_SEED=PASS\n";
          PHP
          php /tmp/p01-v230-authoritative-seed.php | tee /tmp/p01-v230-authoritative-evidence/seed.txt | grep -Fx P01_V230_AUTHORITATIVE_SEED=PASS
          cp /tmp/p01-v230-authoritative-before.json /tmp/p01-v230-authoritative-evidence/before.json

      - name: Execute real V2.29 VfUpdateManager remote check prepare install
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-authoritative-update.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/UpdateManager.php';
          $m=new VfUpdateManager(vf_db(),['root'=>$root,'private_root'=>VF_PRIVATE_ROOT,'current_version'=>'2.29.0']);
          $check=$m->check(true);
          if(($check['ok']??false)!==true||($check['current_version']??'')!=='2.29.0'||($check['latest_version']??'')!=='2.30.0'||($check['available']??false)!==true||($check['can_update']??false)!==true)throw new RuntimeException('check '.json_encode($check,JSON_UNESCAPED_UNICODE));
          $req=$check['requirements']??[];
          if(($req['schema']['current']??'')!=='2026082901'||($req['schema']['from']??'')!=='2026082901'||($req['schema']['target']??'')!=='2026082901'||($req['schema']['ok']??false)!==true)throw new RuntimeException('schema '.json_encode($req,JSON_UNESCAPED_UNICODE));
          $prep=$m->prepare();
          if(($prep['ok']??false)!==true||($prep['from_version']??'')!=='2.29.0'||($prep['to_version']??'')!=='2.30.0'||($prep['release_tag']??'')!=='v2.30.0'||($prep['asset_name']??'')!=='VF_Start_V2.30.0_UPDATE.zip'||(int)($prep['update_package_bytes']??0)!==1328072||($prep['update_package_sha256']??'')!=='65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0')throw new RuntimeException('prepare '.json_encode($prep,JSON_UNESCAPED_UNICODE));
          foreach(['manifest_identity','release_tag','release_asset','bytes','sha256','atomic_self_test','recovery_point'] as $k)if(($prep['checks'][$k]??'')!=='pass')throw new RuntimeException('prepare check '.$k);
          $install=$m->install((string)$prep['operation_id']);
          if(($install['ok']??false)!==true||($install['updated']??false)!==true||($install['from_version']??'')!=='2.29.0'||($install['to_version']??'')!=='2.30.0')throw new RuntimeException('install '.json_encode($install,JSON_UNESCAPED_UNICODE));
          foreach(['release_identity','atomic_handoff','activation','cleanup'] as $k)if(($install['checks'][$k]??'')!=='pass')throw new RuntimeException('install check '.$k);
          file_put_contents('/tmp/p01-v230-authoritative-evidence/update.json',json_encode(['check'=>$check,'prepare'=>$prep,'install'=>$install],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V229_TO_V230_UPDATE_MANAGER=PASS\n";
          PHP
          php /tmp/p01-v230-authoritative-update.php | tee /tmp/p01-v230-authoritative-evidence/update.txt | grep -Fx P01_V229_TO_V230_UPDATE_MANAGER=PASS

      - name: Verify upgraded version schema data and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.30.0
          grep -Fx "define('VF_VERSION', '2.30.0');" "$ROOT/app/bootstrap.php" >/dev/null
          test -f "$ROOT/assets/workspace-domain-nav.css"
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v230-authoritative-evidence/post-verify.txt | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-v230-authoritative-post.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          $before=json_decode((string)file_get_contents('/tmp/p01-v230-authoritative-before.json'),true,512,JSON_THROW_ON_ERROR);
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/SurfaceRepository.php';
          $db=vf_db(); $s=new VfSurfaceRepository($db);
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());
          $fk=$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);
          $schema=(string)$db->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn();
          $after=['links'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn(),'categories'=>(int)$db->query("SELECT COUNT(*) FROM categories WHERE lifecycle_state='active'")->fetchColumn(),'favorites'=>(int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_favorite=1")->fetchColumn(),'profiles'=>(int)$db->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn(),'schema'=>$schema,'integrity'=>$integrity,'fk'=>count($fk),'surface_counts'=>$s->counts(true)];
          if($integrity!=='ok'||count($fk)!==0||$schema!=='2026082901')throw new RuntimeException('database');
          foreach(['links','categories','favorites','profiles'] as $k)if($after[$k]!==$before[$k])throw new RuntimeException('preserve '.$k);
          foreach($before['surface_counts'] as $k=>$v)if((int)($after['surface_counts'][$k]??-1)!==(int)$v)throw new RuntimeException('surface '.$k);
          $r=new VfRepository($db);
          $post=$r->saveLink(null,['category_id'=>(int)json_decode((string)file_get_contents('/tmp/p01-v230-authoritative-ids.json'),true)['pub_cat'],'title'=>'升级后新增专题','url'=>'https://post-v230-topic.example.com','description'=>'post','tags'=>'升级后','is_private'=>false],'manual');
          $s->upsertProfile((int)$post['id'],['surface'=>'topics','resource_kind'=>'AI','source_kind'=>'remote_url','source_ref'=>'https://post-v230-topic.example.com']);
          if((int)$s->collection('topics',true)['count']!==6)throw new RuntimeException('post mutation');
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok'||count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))!==0)throw new RuntimeException('post integrity');
          file_put_contents('/tmp/p01-v230-authoritative-evidence/post.json',json_encode($after,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V230_DATA_SCHEMA_INTEGRITY=PASS\n";
          PHP
          php /tmp/p01-v230-authoritative-post.php | tee /tmp/p01-v230-authoritative-evidence/post.txt | grep -Fx P01_V230_DATA_SCHEMA_INTEGRITY=PASS

      - name: Anonymous Public Private HTTP boundary after remote upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f /tmp/p01-v230-authoritative.pid; then kill "$(cat /tmp/p01-v230-authoritative.pid)" || true; fi
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-authoritative-post-http.log 2>&1 &
          echo $! >/tmp/p01-v230-authoritative.pid
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:${PORT}/start.php" -o /tmp/p01-v230-start.html && break || sleep 1; done
          grep -F '2.30.0' /tmp/p01-v230-start.html >/dev/null
          grep -F '公开导航资源 01' /tmp/p01-v230-start.html >/dev/null
          ! grep -F '私人导航资源 01' /tmp/p01-v230-start.html >/dev/null
          for p in channels watch topics; do curl -fsS "http://127.0.0.1:${PORT}/${p}.php" -o "/tmp/p01-v230-${p}.html"; done
          grep -F '公开频道 1' /tmp/p01-v230-channels.html >/dev/null
          ! grep -F '私人频道 1' /tmp/p01-v230-channels.html >/dev/null
          grep -F '公开影视 1' /tmp/p01-v230-watch.html >/dev/null
          ! grep -F '私人影视 1' /tmp/p01-v230-watch.html >/dev/null
          grep -F '公开专题 1' /tmp/p01-v230-topics.html >/dev/null
          ! grep -F '私人专题 1' /tmp/p01-v230-topics.html >/dev/null
          cp /tmp/p01-v230-start.html /tmp/p01-v230-authoritative-evidence/start-anonymous.html
          cp /tmp/p01-v230-channels.html /tmp/p01-v230-authoritative-evidence/channels-anonymous.html
          cp /tmp/p01-v230-watch.html /tmp/p01-v230-authoritative-evidence/watch-anonymous.html
          cp /tmp/p01-v230-topics.html /tmp/p01-v230-authoritative-evidence/topics-anonymous.html
          echo P01_V230_ANONYMOUS_PUBLIC_PRIVATE_HTTP=PASS

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v230-browser && cd /tmp/p01-v230-browser
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Desktop Mobile browser validation after remote upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v230-browser/gate.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const base='http://127.0.0.1:18630', pass='P01V230!Authoritative';
          const browser=await chromium.launch({headless:true});
          const anon=await browser.newContext({viewport:{width:1440,height:960}});
          const ap=await anon.newPage();
          await ap.goto(base+'/start.php',{waitUntil:'networkidle'});
          const at=await ap.locator('body').innerText();
          if(!at.includes('公开导航资源 01')||at.includes('私人导航资源 01'))throw new Error('anonymous privacy');
          if(await ap.locator('.vf-global-domain-nav a').count()!==5)throw new Error('anon global nav');
          await anon.close();

          const desktop=await browser.newContext({viewport:{width:1440,height:960}});
          let lr=await desktop.request.post(base+'/api.php?action=login',{data:{password:pass}}); if(!lr.ok())throw new Error('desktop login');
          const p=await desktop.newPage();
          for(const [path,publicText,privateText] of [['start.php','公开导航资源 01','私人导航资源 01'],['channels.php','公开频道 1','私人频道 1'],['watch.php','公开影视 1','私人影视 1'],['topics.php','公开专题 1','私人专题 1']]){
            await p.goto(base+'/'+path,{waitUntil:'networkidle'});
            const body=await p.locator('body').innerText();
            if(!body.includes(publicText)||!body.includes(privateText))throw new Error(path+' admin data');
            if(await p.locator('.vf-global-domain-nav a').count()!==5)throw new Error(path+' nav count');
            if(await p.locator('.vf-global-domain-nav a.active').count()!==1)throw new Error(path+' active');
            if(await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1)throw new Error(path+' desktop overflow');
          }
          await p.goto(base+'/start.php',{waitUntil:'networkidle'});
          if(await p.locator('.vf-asset-row').count()<15)throw new Error('navigation density');
          await p.screenshot({path:'/tmp/p01-v230-authoritative-evidence/desktop-start.png',fullPage:true});
          await p.goto(base+'/channels.php',{waitUntil:'networkidle'}); await p.screenshot({path:'/tmp/p01-v230-authoritative-evidence/desktop-channels.png',fullPage:true});
          await p.goto(base+'/watch.php',{waitUntil:'networkidle'}); await p.screenshot({path:'/tmp/p01-v230-authoritative-evidence/desktop-watch.png',fullPage:true});
          await p.goto(base+'/topics.php',{waitUntil:'networkidle'}); await p.screenshot({path:'/tmp/p01-v230-authoritative-evidence/desktop-topics.png',fullPage:true});
          await desktop.close();

          const mobile=await browser.newContext({viewport:{width:390,height:844}});
          lr=await mobile.request.post(base+'/api.php?action=login',{data:{password:pass}}); if(!lr.ok())throw new Error('mobile login');
          const m=await mobile.newPage();
          await m.goto(base+'/start.php',{waitUntil:'networkidle'});
          await m.locator('.vf-mobile-command-row').waitFor({state:'visible'});
          const trigger=m.locator('.vf-mobile-category-trigger'); await trigger.waitFor({state:'visible'}); await trigger.click();
          const overlay=m.locator('.vf-mobile-category-overlay'); await overlay.waitFor({state:'visible'});
          await overlay.locator('input[type=search]').fill('私人导航');
          if(await overlay.locator('[data-category-picker-item]',{hasText:'私人导航'}).count()!==1)throw new Error('mobile category picker');
          await m.keyboard.press('Escape').catch(()=>{});
          if(await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1)throw new Error('mobile start overflow');
          await m.screenshot({path:'/tmp/p01-v230-authoritative-evidence/mobile-start.png',fullPage:true});
          for(const path of ['channels.php','watch.php','topics.php']){
            await m.goto(base+'/'+path,{waitUntil:'networkidle'});
            if(await m.locator('.vf-global-domain-nav a').count()!==5)throw new Error(path+' mobile nav');
            if(await m.locator('.vf-global-domain-nav a.active').count()!==1)throw new Error(path+' mobile active');
            if(await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1)throw new Error(path+' mobile overflow');
          }
          await m.screenshot({path:'/tmp/p01-v230-authoritative-evidence/mobile-topics.png',fullPage:true});
          await mobile.close(); await browser.close();
          fs.writeFileSync('/tmp/p01-v230-authoritative-evidence/browser-verdict.txt','P01_V230_DESKTOP_MOBILE_BROWSER=PASS\n');
          JS
          cd /tmp/p01-v230-browser && node gate.mjs
          grep -Fx P01_V230_DESKTOP_MOBILE_BROWSER=PASS /tmp/p01-v230-authoritative-evidence/browser-verdict.txt

      - name: Final authoritative verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-v230-authoritative-evidence/verdict.txt <<EOF
          SOURCE_VERSION=2.29.0
          TARGET_VERSION=2.30.0
          SOURCE_SCHEMA=$SCHEMA
          TARGET_SCHEMA=$SCHEMA
          FORMAL_SOURCE=$FORMAL_SOURCE
          FORMAL_TREE=$FORMAL_TREE
          PRODUCT_SOURCE=$PRODUCT_SOURCE
          PRODUCT_TREE=$PRODUCT_TREE
          CORE_UPDATES_MAIN=$CORE_UPDATES_MAIN
          RELEASE_ID=$RELEASE_ID
          UPDATE_SHA256=$UPDATE_SHA
          UPDATE_BYTES=$UPDATE_BYTES
          P01_V229_TO_V230_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V230_DATA_PRESERVATION=PASS
          P01_V230_PUBLIC_PRIVATE_HTTP=PASS
          P01_V230_DESKTOP_MOBILE_BROWSER=PASS
          P01_V230_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat /tmp/p01-v230-authoritative-evidence/verdict.txt

      - name: Upload authoritative evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-remote-online-update-evidence
          path: /tmp/p01-v230-authoritative-evidence
          if-no-files-found: error
          retention-days: 30
