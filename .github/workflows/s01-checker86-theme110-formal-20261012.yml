name: S01 Checker86 Theme110 exact candidate gated private formal release
on:
  push:
    branches: [task/s01-checker86-theme110-formal-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.110'
      TARGET_SHA: '029439879c817c505d8d6049ee58e6c49b7196cf'
      TARGET_TREE: '210ac8321f2a59669d955c33147cc5b54f1ea9cb'
      TARGET_MAIN_SHA: 'e1bc13e252289b3994186fd6e4f9fe4429a9ef28'
      SOURCE_VERSION: '1.35.109'
      BASE_SHA: '3a6209730515fe04081963a8c22b797f324bc95f'
      M3_VERSION: '1.25.86'
      M3_SHA: 'f909407ce5434b0a1a928bb0574586fef88231ae'
      M3_TREE: 'e10905d4f1b360949e08c4128de07723bfe65a65'
      M3_MAIN_SHA: '4a3f738b1babbfbf74e0589dca825a9daccb7cc2'
      M3_SOURCE_VERSION: '1.25.85'
      CANDIDATE_RUN: '38264022480'
      CANDIDATE_SHA: 'e2d1db6ccf847184854d23be6e4ad0ae3e4a7b87'
      CANDIDATE_ARTIFACT: '11753663004'
      CANDIDATE_DIGEST: 'sha256:a0b7badaf451c03711396b35a49a3fb6b445c4c8ba1b1c9ab39e3271e0d4a8cb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker86-theme110-formal-20261012/spec.json --template runner/lanes/s01-checker86-theme110-formal-20261012/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-checker86-theme110-formal-20261012.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker86-theme110-formal-20261012/spec.json --input runner/.github/workflows/s01-checker86-theme110-formal-20261012.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-checker86-theme110-formal-20261012 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic dual rebuild and asset equality
        run: bash lane/build.sh
      - name: Publish authorized private formal releases and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: s01-checker-components-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['theme-FINAL_RELEASE.json','m3u8-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PASS dual formal public-safe receipt reverse readback')
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip

