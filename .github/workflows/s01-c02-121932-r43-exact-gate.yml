name: S01-C02 1.21.932 R43 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121932-r43-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 548abbd67d8e09d67edaf36b89628314104d15c7
      EXPECTED_VERSION: 1.21.932
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" vf-ops.php
          grep -Fq "S01-NAVIGATION-ROLE-REBASELINE-R43" vf-ops.php
          echo "EXACT_SOURCE_IDENTITY=PASS"

      - name: Install PHP CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find target -type f -name '*.php' -not -path '*/vendor/*' -print0 |
            xargs -0 -n1 php -l > php-lint.log
          echo "PHP_FILES_LINTED=$(wc -l < php-lint.log | tr -d ' ')"
          echo "PHP_LINT=PASS"

      - name: R43 exact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php | tee r43-contract.log
          grep -Fq "R43 contract PASS" r43-contract.log
          echo "R43_CONTRACT=PASS"

      - name: Build minimum evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          target=Path("target")
          actual=subprocess.check_output(["git","-C","target","rev-parse","HEAD"],text=True).strip() if (target/".git").exists() else ""
          version=(target/"VERSION").read_text(encoding="utf-8").strip() if (target/"VERSION").exists() else ""
          lint=Path("php-lint.log").read_text(encoding="utf-8") if Path("php-lint.log").exists() else ""
          contract=Path("r43-contract.log").read_text(encoding="utf-8") if Path("r43-contract.log").exists() else ""
          payload={
            "schema":"vf-runner/s01-c02-r43-exact-gate-v1",
            "target_repository":os.environ["TARGET_REPOSITORY"],
            "expected_sha":os.environ["TARGET_SHA"],
            "actual_sha":actual,
            "version":version,
            "exact_source_identity":actual==os.environ["TARGET_SHA"] and version==os.environ["EXPECTED_VERSION"],
            "php_lint_pass":"No syntax errors detected" in lint,
            "php_files_linted":sum(1 for x in lint.splitlines() if x.strip()),
            "r43_contract_pass":"R43 contract PASS" in contract,
            "private_source_persisted":False,
            "secret_values_persisted":False
          }
          raw=json.dumps(payload,sort_keys=True,ensure_ascii=False).encode()
          payload["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-c02-r43-exact-gate.json").write_text(json.dumps(payload,indent=2,sort_keys=True,ensure_ascii=False),encoding="utf-8")
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Upload minimum evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-r43-exact-${{ github.run_id }}
          path: evidence/s01-c02-r43-exact-gate.json
          if-no-files-found: error
          retention-days: 14
