name: P07 menu 2 V2.2.7 formal native stream
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-menu2-v227-one-shot.yml'
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): menu2 native V2.2.7'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical public distribution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact release provenance and nine synthetic checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'ea3e1d4d692cf57dc556ba2d37a6e33670844a6f'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          file='experiments/p07-vps-audit-v227-r1.sh'
          bash -n "$file"
          test "$(bash "$file" --build-id)" = '2.2.7-rc1-full-native-stream'
          test "$(bash "$file" --version | awk '{print $NF}')" = 'V2.2.7'
          test "$(sha256sum "$file" | awk '{print $1}')" = '07ed44258743aae4446ec94c07bb75cfe9ef53a6c9045ece6cdc4cbf3e8fe807'
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.2.7"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.2.7-rc1-full-native-stream"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_SHA256="07ed44258743aae4446ec94c07bb75cfe9ef53a6c9045ece6cdc4cbf3e8fe807"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/f58f4527f0276eee80f67ff41734f5a4fad01802/experiments/p07-vps-audit-v227-r1.sh"' installers/p07-toolbox.sh
          grep -Fq 'NO_COLOR=1 timeout --signal=TERM --kill-after=5s 720s bash "$BASE" 2>&1 | tee "$OUT"' "$file"
          grep -Fq '首先显示服务器基础配置' <(bash "$file" --help)
          for id in 37742822796 37742822779 37742822714 37742822781 37742822807 37742822826 37742822890 37742823042 37742822820; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = 'f095d1d6c34616ebd10251e9ad63eddb293a4683'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_MENU2_V227_FORMAL_GATE=PASS
      - name: Publish formal v227 restored owner layout
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-menu2-v227'
          target='ea3e1d4d692cf57dc556ba2d37a6e33670844a6f'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 服务器性能检测原版显示修复 V2.2.7' \
              --notes '修复 V2.2.6 将原有 VPS 完整验机的服务器配置及测速表格隐藏成简短进度提示的问题。V2.2.7 保留原版顺序：先服务器配置，随后 CPU、磁盘、全球/大陆网络测速，再增强 fio、三网回程及完整报告。全部原始数据实时显示，不截断；12 分钟超时保护和安静期间进度提示仍保留。一级菜单和 Source build release84 均未更改。公共隔离 Machine Gate 9/9 PASS，真实生产 OWNER 验收仍须以用户界面为准。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_MENU2_V227_FORMAL_RELEASE=PASS
