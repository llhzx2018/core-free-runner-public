name: TEMP S01-C02 Ops 1.21.844 Failure Shape Trace
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-failure-shape-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 38be815bd77ae62548fe763b106bfec0b937d2c7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace Final Audit failure representations
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(git rev-parse HEAD)" = '38be815bd77ae62548fe763b106bfec0b937d2c7'
          echo '=== TARGET LEAF ==='
          git grep -n -C 12 -F '最终候选包无法打开，不能标记可上传。' -- '*.php' || true
          echo '=== TERMINAL EVIDENCE ==='
          git grep -n -C 12 -E 'from_record_terminal_evidence|candidate_audit|failures.*issue|issue.*failures' -- '*.php' || true
          echo '=== FINAL DECISION / AUDIT ASSIGNMENTS ==='
          git grep -n -C 10 -E "final_decision|candidate_audit.*=|\['candidate_audit'\]|\['failures'\]" -- 'includes/**/*.php' || true
          echo TRACE_V121844_FAILURE_SHAPE=PASS
