name: P08 R130 real HTTPS Owner SQL two DB onefile (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r130-owner-https-sql-temp.yml]
permissions:
  contents: read
jobs:
  owner-rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pSyntheticP08Only123 --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: SyntheticP08Only123
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_R129_DRIVER: ${{ matrix.driver }}
      P08_R129_SQL_HOST: 127.0.0.1
      P08_R129_SQL_USER: root
      P08_R129_SQL_PASSWORD: SyntheticP08Only123
      P08_R129_ISOLATED: "YES"
      P08_R130_ISOLATED: "YES"
      P08_R130_BROWSER: "YES"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
    steps:
      - name: Setup PHP8.4 Composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,sqlite3,pdo_sqlite,pdo_mysql,posix,mbstring,dom,curl
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Disposable native MariaDB MySQL CLI clients
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          command -v mariadb-dump
          command -v mysql
      - name: Transient private target candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f1d73d9b4fafd2c125a2060d11abdbce371c093f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Build exact source unissued v0.1.4 dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-source rev-parse HEAD)" = f1d73d9b4fafd2c125a2060d11abdbce371c093f
          test "$(cat p08-source/VERSION)" = '0.1.4'
          cd p08-source
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-r130-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r130-node.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-r130-node.log" 2>&1
          php -l src/Recovery/InstalledRuntimeVersion.php
          php tests/test_r130_installed_runtime_version.php
          php -l src/Upgrade/R130Official013ForwardActivation.php
          php -l scripts/r130_owner_forward_once.php
          php -l scripts/R130OwnerWorkerFragment.php
          python3 -B -m py_compile scripts/build_r130_onefile.py
          echo P08_R130_SOURCE_BUILD_LOCKED=PASS
      - name: Read exact genuine prior 0.1.2 and installed 0.1.3 FULL bytes
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/p08-r130-old012.zip"
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-r130-old012.zip" | sha256sum --check --status
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r130-old013.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r130-old013.zip" | sha256sum --check --status
          echo P08_R130_GENUINE_PUBLISHED_012_013_ASSET_BYTES=PASS
      - name: Candidate full Atomic ZIP and onefile builder in isolated-only mode
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          cd p08-source
          python3 -B - <<'PY'
          import os,hashlib,json,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from build_full import write_full
          from build_atomic import write_atomic
          from build_r130_onefile import create
          base=Path(os.environ['RUNNER_TEMP'])
          full=base/'p08-r130-candidate-full.zip'
          atom=base/'p08-r130-candidate-atomic.zip'
          old=base/'p08-r130-old013.zip'
          target=os.environ['P08_R130_TARGET_SHA']
          with zipfile.ZipFile(old) as z:
              digest=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          write_full(Path('.'),full,'0.1.4',target)
          write_atomic(Path('.'),atom,source_version='0.1.3',
              source_sha='44d504185f0ac8cf4be552dc5adada989a08b40e',
              source_full_manifest_sha256=digest,target_version='0.1.4',
              target_sha=target)
          out=base/'p08-owner-forward-once.php'
          receipt=create(Path('scripts/r130_owner_forward_once.php'),atom,old,target,
              out,issued_next=None,issued_next_sha=None,isolated=True)
          assert receipt['status']=='ISOLATED_NOT_DISTRIBUTABLE'
          assert receipt['target_sha']==target
          (base/'p08-r130-atomic-sha.txt').write_text(hashlib.sha256(atom.read_bytes()).hexdigest())
          print('P08_R130_UNRELEASED_CANDIDATE_FULL_ATOMIC_ONEFILE_DETERMINISTIC_INPUT=PASS')
          PY
          php -l "$RUNNER_TEMP/p08-owner-forward-once.php"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          content=(t/'p08-owner-forward-once.php').read_bytes()
          atomic=(t/'p08-r130-candidate-atomic.zip').read_bytes()
          marker=b'__halt_compiler();'
          assert content.count(marker)==1
          assert content[content.index(marker)+len(marker):]==atomic
          assert b'@@' not in content[:content.index(marker)]
          print('P08_R130_EMBEDDED_ONEFILE_OFFICIAL_SOURCE_BOUND_ZIP_OFFSET=PASS')
          PY
        env:
          P08_R130_TARGET_SHA: f1d73d9b4fafd2c125a2060d11abdbce371c093f
      - name: Genuine published v0.1.3 fixture and temporary synthetic Owner
        env:
          P08_R130_TARGET_SHA: f1d73d9b4fafd2c125a2060d11abdbce371c093f
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-r129-real-issued-r130-$P08_R129_DRIVER"
          mkdir -m 0700 "$site" "$site/releases"
          unzip -q "$RUNNER_TEMP/p08-r130-old012.zip" -d "$site"
          mkdir -m 0700 "$site/releases/44d504185f0ac8cf4be552dc5adada989a08b40e"
          unzip -q "$RUNNER_TEMP/p08-r130-old013.zip" -d "$site/releases/44d504185f0ac8cf4be552dc5adada989a08b40e"
          php p08-source/tests/compatibility/r129_real_issued_013_history.php "$site"
          test "$(readlink "$site/current")" = releases/44d504185f0ac8cf4be552dc5adada989a08b40e
          install -m 0600 "$RUNNER_TEMP/p08-owner-forward-once.php" "$site/public/p08-owner-forward-once.php"
          P08_R130_BROWSER_SITE="$site" php <<'PHP'
          <?php
          $site=(string)getenv('P08_R130_BROWSER_SITE');
          if (!in_array(getenv('P08_R129_DRIVER'),['mysql','mariadb'],true))exit(1);
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=p08_r129_disposable;charset=utf8mb4',
             'root','SyntheticP08Only123',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $pdo->exec('CREATE TABLE users (id INTEGER PRIMARY KEY, password VARCHAR(255) NOT NULL)');
          $stmt=$pdo->prepare('INSERT INTO users(id,password) VALUES (41,?)');
          $stmt->execute([password_hash('R130OwnerFixtureOnly_123!',PASSWORD_BCRYPT)]);
          if (file_put_contents($site.'/.env','APP_URL="https://127.0.0.1:18511"'.PHP_EOL,FILE_APPEND)===false)exit(1);
          echo "P08_R130_ISSUED_013_SYNTHETIC_OWNER=PASS\n";
          PHP
      - name: Real HTTPS PHP web, Chromium Owner password and onefile CLI
        env:
          P08_R130_TARGET_SHA: f1d73d9b4fafd2c125a2060d11abdbce371c093f
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-r129-real-issued-r130-$P08_R129_DRIVER"
          w="$RUNNER_TEMP/p08-r130-browser-https"
          mkdir -m 0700 "$w"
          php_pid=""; tls_pid=""
          cleanup() {
            rc=$?
            trap - EXIT
            [[ -z "$php_pid" ]] || kill "$php_pid" >/dev/null 2>&1 || true
            [[ -z "$tls_pid" ]] || kill "$tls_pid" >/dev/null 2>&1 || true
            if [[ $rc != 0 ]]; then
              python3 - "$site/storage/app/private/adops/owner-forward-once/worker.log" <<'PY'
          import sys,re
          from pathlib import Path
          p=Path(sys.argv[1]);data=p.read_text(errors='replace')[-18000:] if p.is_file() else ''
          print('P08_R130_BROWSER_SAFE_CODES='+','.join(sorted(set(re.findall(r'\b(?:R\d{2,3}|P08|RECOVERY|ATOMIC)_[A-Z0-9_]{4,90}\b',data)))[-12:]))
          PY
            fi
            exit "$rc"
          }
          trap cleanup EXIT
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$w/tls.key" -out "$w/tls.crt" \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' >/dev/null 2>&1
          cat >"$w/prepend.php" <<'PHP'
          <?php
          $_SERVER['HTTPS']='on';
          $_SERVER['SERVER_PORT']='443';
          PHP
          cat >"$w/router.php" <<'PHP'
          <?php
          $path=parse_url((string)($_SERVER['REQUEST_URI']??''),PHP_URL_PATH);
          if ($path==='/p08-owner-forward-once.php')return false;
          $entry=getenv('P08_R130_GATEWAY');
          if (!is_string($entry)||!is_file($entry)){http_response_code(503);exit;}
          require $entry;
          PHP
          P08_R130_GATEWAY="$site/public/index.php" php \
            -d "auto_prepend_file=$w/prepend.php" \
            -S 127.0.0.1:19511 -t "$site/public" "$w/router.php" >"$w/php.log" 2>&1 &
          php_pid=$!
          for i in $(seq 1 60); do
            (echo >/dev/tcp/127.0.0.1/19511) >/dev/null 2>&1 && break || sleep 0.2
          done
          kill -0 "$php_pid"
          node "$GITHUB_WORKSPACE/p08-source/tests/compatibility/r110_tls_front.mjs" \
            "$w/tls.crt" "$w/tls.key" >"$w/tls.log" 2>&1 &
          tls_pid=$!
          for i in $(seq 1 60); do
            grep -Fxq R110_REAL_HTTPS_FRONT=READY "$w/tls.log" && break || sleep 0.2
          done
          kill -0 "$tls_pid"
          cd p08-source
          npx playwright install --with-deps chromium >"$w/browser-install.log" 2>&1
          P08_TEST_BASE_URL=https://127.0.0.1:18511 \
            npx playwright test tests/e2e/r130-owner-onefile-forward.spec.ts --workers=1 --reporter=line
          test "$(readlink "$site/current")" = "releases/$P08_R130_TARGET_SHA"
          php -r '$j=json_decode(file_get_contents($argv[1]),true);exit(($j["status"]??"")==="SUCCEEDED"?0:1);' \
            "$site/storage/app/private/adops/owner-forward-once/state.json"
          test -f "$site/storage/app/private/adops/upgrade-history/v013-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/owner-job.json"
          P08_R130_BROWSER_SITE="$site" php <<'PHP'
          <?php
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=p08_r129_disposable;charset=utf8mb4',
             'root','SyntheticP08Only123',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if ($pdo->query('SELECT message FROM r129_preserved WHERE id=1')->fetchColumn()
                 !== 'original-issued-site'
              || (int)$pdo->query('SELECT count(*) FROM users WHERE id=41')->fetchColumn()!==1)
                 exit(1);
          echo "P08_R130_SQL_USER_AND_BUSINESS_DATA_PRESERVED=PASS\n";
          PHP
          echo P08_R130_REAL_HTTPS_PASSWORD_TWO_CLICKS_INDEPENDENT_CLI_ATOMIC=PASS
      - name: Erase transient private source packages and synthetic Owner
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-r129-real-issued-r130-* \
            "$RUNNER_TEMP"/p08-r130-* "$RUNNER_TEMP/p08-owner-forward-once.php"
