name: P01 507 corrected existing import contract only
on:
  push:
    branches:
      - task/p01-security-507-reconciled-safe-units-20261109
permissions:
  contents: read
jobs:
  exact-static-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P01 security candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3678caa355a6f9893f08458d006afa49038c2dcc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Exact source and import unknown-result no-write static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = 3678caa355a6f9893f08458d006afa49038c2dcc
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.507
          node --check p01-exact/src/assets/local-subsite-management.js
          node p01-exact/tests/unit/p01_ia5_global_import_r17_contract.cjs
          node p01-exact/tests/unit/p01_import_unknown_exit_draft_guard_contract.cjs
          echo P01_507_NATIVE_PLUGIN_IMPORT_STATIC_GUARD=PASS
          echo P01_507_PREVIOUS_CANONICAL_808_TO_810_BYTE_UNCHANGED=YES
          echo P01_HIGH_RISK_REAL_CHROMIUM_IMPORT=NOT_RUN
          echo P01_REAL_DISASTER_RESTART=NOT_RUN
          echo P01_PRODUCTION_WRITES=NONE
      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact
          echo P01_PRIVATE_SOURCE_PERSISTED=NO
