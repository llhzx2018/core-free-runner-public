name: P01 507 reconciled source safe units only (no high-risk runtime)
on:
  push:
    branches:
      - task/p01-security-507-reconciled-safe-units-20261109
permissions:
  contents: read
concurrency:
  group: p01-507-reconciled-safe-units-20261109
  cancel-in-progress: false
jobs:
  exact-scoped-units:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: e1911dcf949494c1b0d4c7be2764b1209ad4d43d
      MERGED_NEWS_MAIN: 64edb79b1d54474e9f4907e19f562a8b8fa155d0
    steps:
      - name: Checkout registered public runner only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install minimal isolated PHP CLI and SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fxi PDO_SQLITE
      - name: Checkout exact private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e1911dcf949494c1b0d4c7be2764b1209ad4d43d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-candidate
          persist-credentials: false
      - name: Checkout officially published v506 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.506
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-v506-baseline
          persist-credentials: false
      - name: Checkout merged main News UX source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 64edb79b1d54474e9f4907e19f562a8b8fa155d0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news-main
          persist-credentials: false
      - name: Verify 507 identity, News preservation, safety-only scope and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-news-main rev-parse HEAD)" = "$MERGED_NEWS_MAIN"
          test "$(tr -d '\r\n ' < p01-candidate/VERSION)" = "2.47.507"
          test "$(tr -d '\r\n ' < p01-candidate/src/VERSION.txt)" = "2.47.507"
          grep -Fx "define('VF_VERSION', '2.47.507');" p01-candidate/src/app/bootstrap.php
          for f in src/app/NewsFeedPage.php src/assets/news-feed.js src/assets/news-feed.css src/app/NewsFeedService.php tests/browser/p01_news_r4_chromium.cjs docs/authority/ACCEPTANCE_MATRIX.md; do
            cmp "p01-news-main/$f" "p01-candidate/$f"
          done
          php -l p01-candidate/src/app/bootstrap.php >/dev/null
          php -l p01-candidate/src/app/DisasterRecovery.php >/dev/null
          php -l p01-candidate/src/app/ChannelLibraryPage.php >/dev/null
          node --check p01-candidate/src/assets/local-subsite-management.js
          node --check p01-candidate/tests/unit/p01_import_unknown_exit_draft_guard_contract.cjs
          echo P01_507_NEWS_SOURCE_BYTE_PRESERVED=PASS
      - name: Official 506 baseline versus 507 merged-source canonical regression
        shell: bash
        timeout-minutes: 16
        run: |
          set -Eeuo pipefail
          bash p01-candidate/tests/canonical_release_regression.sh p01-candidate p01-v506-baseline --require-zero-debt | tee /tmp/p01-507-canonical.log
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-507-canonical.log
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-507-canonical.log
          echo P01_507_SAFE_CANONICAL=PASS
      - name: Static import unknown receipt and isolated channel contract
        shell: bash
        run: |
          set -Eeuo pipefail
          node p01-candidate/tests/unit/p01_import_unknown_exit_draft_guard_contract.cjs
          node p01-candidate/tests/unit/p01_ia5_global_import_r17_contract.cjs
          php p01-candidate/tests/unit/p01_channels_video_independent_pagination_native.php
          php p01-candidate/tests/unit/channels_guest_readonly_layout_v247390_contract.php
          echo P01_507_IMPORT_AND_CHANNEL_SYNTHETIC_CONTRACT=PASS
          echo P01_REJECTED_REAL_BROWSER_IMPORT=NOT_RUN
          echo P01_REJECTED_DISASTER_RESTART_RECOVERY=NOT_RUN
          echo P01_507_FORMAL_RELEASE=NOT_RUN
          echo P01_PRODUCTION_WRITES=NONE
      - name: Delete all transient private checkouts
        if: always()
        shell: bash
        run: |
          rm -rf p01-candidate p01-v506-baseline p01-news-main
          echo P01_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_RUNNER=NO
