name: P05 V1.1.3 Publish Release

on:
  push:
    branches:
      - gate/p05-v113-login-repair-20260830
    paths:
      - '.github/workflows/p05-v1.1.3-publish-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN: '33305765333'
      ARTIFACT_NAME: P05_V1.1.3_MAIN_RELEASE
      RELEASE_TAG: v1.1.3
      RELEASE_TITLE: P05 · VF SEO v1.1.3 · Login Runtime Repair
      RELEASE_ASSET: VF_SEO_V1.1.3_FULL.zip
      RECEIPT_ASSET: VF_SEO_V1.1.3_RELEASE_RECEIPT.txt
      P05_MAIN_SHA: 5e85172e86ab511849ab5f215378f2cfa8f26355
      EXPECTED_SHA256: 3fe69e0fe308cee05ec6eae456c28f423a54e37a7228163faad84792a1dcd253
      EXPECTED_BYTES: '234536'
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release write token
        run: test -n "$RELEASE_WRITE_TOKEN"

      - name: Download exact main release artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v113-publish"
          mkdir -p "$OUT"
          gh run download "$SOURCE_RUN" -R llhzx2018/core-free-runner-public -n "$ARTIFACT_NAME" -D "$OUT"
          test -f "$OUT/$RELEASE_ASSET"
          test -f "$OUT/$RECEIPT_ASSET"
          test "$(sha256sum "$OUT/$RELEASE_ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c %s "$OUT/$RELEASE_ASSET")" = "$EXPECTED_BYTES"
          grep -Fxq "P05_V113_MAIN_RELEASE_MACHINE=PASS" "$OUT/$RECEIPT_ASSET"
          grep -Fxq "P05_EXACT_MAIN=$P05_MAIN_SHA" "$OUT/$RECEIPT_ASSET"
          grep -Fxq "P05_LEGACY_LOGIN_REPAIR=PASS" "$OUT/$RECEIPT_ASSET"
          echo P05_V113_PUBLISH_ARTIFACT_IDENTITY=PASS

      - name: Publish GitHub Release v1.1.3
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v113-publish"
          if gh release view "$RELEASE_TAG" -R llhzx2018/vf-seo >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.txt" <<'EOF'
          P05 v1.1.3 fixes the real owner-login INTERNAL_ERROR observed after v1.1.2 on an existing P05 private database.

          The PHP login path now safely repairs an incompatible legacy session store after valid credential verification, while preserving administrator and product data. It also normalizes private SQLite permissions where possible and returns explicit storage errors instead of a generic INTERNAL_ERROR when the database cannot be written.

          Browser-first installation remains unchanged: upload FULL ZIP → extract → open domain → /setup for a fresh install. Existing private data under the site user's HOME is preserved; this hotfix does not require deleting the old SQLite database.

          Distribution remains FULL_ONLY, Schema remains VF-SEO-SCHEMA@1 / 1, and Production remains NOT_DEPLOYED.
          EOF
          gh release create "$RELEASE_TAG" \
            "$OUT/$RELEASE_ASSET#$RELEASE_ASSET" \
            "$OUT/$RECEIPT_ASSET#$RECEIPT_ASSET" \
            -R llhzx2018/vf-seo \
            --target "$P05_MAIN_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"
          echo P05_V113_GITHUB_RELEASE_WRITE=PASS

      - name: Final remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG)"
          test "$(jq -r .tag_name <<<"$JSON")" = "$RELEASE_TAG"
          test "$(jq -r .target_commitish <<<"$JSON")" = "$P05_MAIN_SHA"
          test "$(jq -r .draft <<<"$JSON")" = false
          test "$(jq -r .prerelease <<<"$JSON")" = false
          FULL="$(jq -c --arg n "$RELEASE_ASSET" '.assets[] | select(.name==$n)' <<<"$JSON")"
          RECEIPT="$(jq -c --arg n "$RECEIPT_ASSET" '.assets[] | select(.name==$n)' <<<"$JSON")"
          test -n "$FULL"
          test -n "$RECEIPT"
          test "$(jq -r .size <<<"$FULL")" = "$EXPECTED_BYTES"
          test "$(jq -r .digest <<<"$FULL")" = "sha256:$EXPECTED_SHA256"
          echo "P05_V113_RELEASE_ID=$(jq -r .id <<<"$JSON")"
          echo "P05_V113_FULL_ASSET_ID=$(jq -r .id <<<"$FULL")"
          echo "P05_V113_RECEIPT_ASSET_ID=$(jq -r .id <<<"$RECEIPT")"
          echo "P05_V113_PUBLISHED_AT=$(jq -r .published_at <<<"$JSON")"
          echo P05_V113_RELEASE_REMOTE_READBACK=PASS
