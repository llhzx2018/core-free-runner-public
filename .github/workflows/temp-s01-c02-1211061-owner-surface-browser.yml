name: S01-C02 1.21.1061 Source owner surface browser closure
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality-source-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a12642d24f435b1e677fa062ab56c76e618244ff
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - name: Exact source and browser suite
        run: |
          set -Eeuo pipefail
          mkdir -p evidence /tmp/source-node
          test "$(git -C target rev-parse HEAD)" = "a12642d24f435b1e677fa062ab56c76e618244ff"
          test "$(git -C target rev-parse HEAD^{tree})" = "2bcac5111167b345a4de5b0bc7da4e5497d8a61d"
          test "$(cat target/VERSION)" = "1.21.1061"
          cd /tmp/source-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/source-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node tests/temp-s01-c02-1211061-source-owner-surface-browser.js | tee evidence/owner-surface-browser.txt
          grep -F '"pass":true' evidence/owner-surface-browser.txt >/dev/null
          node target/tests/s01-c02-1211059-source-start-browser-proof.js > evidence/start-proof.json
          node target/tests/s01-c02-1211058-quality-disclosure-browser-proof.js > evidence/disclosure-proof.json
          jq -e '.pass==true' evidence/start-proof.json
          jq -e '.pass==true' evidence/disclosure-proof.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211061-owner-surface-browser-evidence
          path: evidence/
          retention-days: 30
