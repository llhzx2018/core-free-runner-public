name: P01 V2.36.0 Bind Candidate PASS
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-bind-candidate-pass-20260901.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: 92c461c2ce2f1a8b6b1f5a09e2e54bad2408bef9
      CANDIDATE_TREE: 19bbda0dfdfbaaa990dcffd9006a7e2a602b5c95
      CANDIDATE_RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      GATE_RUN: '33420047480'
      GATE_ARTIFACT: '9768538195'
      GATE_DIGEST: aa4b234d12fdf2fbefbcfe295d3bda77ece8f7d7a184d6915b0193124e66290d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.0-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - name: Bind candidate PASS without runtime mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C formal rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C formal rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C formal rev-parse HEAD:src)" = "$CANDIDATE_RUNTIME_TREE"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('formal/VF_PROJECT.json'); d=json.loads(p.read_text())
          assert d['production_version']=='2.35.3'
          assert d['candidate_version']=='2.36.0'
          assert d['schema_version']=='2026082901'
          rc=d['v2_36_0_release_candidate']
          assert rc['schema_change'] is False and rc['migration'] is None
          d['status']='V2.35.3 PRODUCTION CLOSURE PASS / V2.36.0 CANDIDATE PASS'
          d['current_phase']='V2.36.0 CANDIDATE PASS / FORMAL ARTIFACT PENDING'
          d['candidate_state']='PASS'
          d['formal_release_state']='V2.35.3 PUBLISHED / V2.36.0 FORMAL ARTIFACT PENDING'
          d['develop_state']='V2.36.0 FORMAL SOURCE PREPARED / NOT MERGED / NOT RELEASED'
          d['current_authority']='Owner Production V2.35.3 / Published Latest V2.35.3 / V2.36.0 Candidate Readiness PASS'
          d['next_action']='Run V2.36.0 Formal Artifact Gate on this exact formal source; only after PASS continue Strict Fresh and later release gates. Do not write main, Tag, GitHub Release, core-updates or Owner Production before their separate gates.'
          d['v2_36_0_candidate_gate']={
            'run':int(os.environ['GATE_RUN']),
            'result':'PASS',
            'source':os.environ['CANDIDATE'],
            'tree':os.environ['CANDIDATE_TREE'],
            'runtime_tree':os.environ['CANDIDATE_RUNTIME_TREE'],
            'artifact':int(os.environ['GATE_ARTIFACT']),
            'digest':'sha256:'+os.environ['GATE_DIGEST'],
            'schema':'2026082901',
            'migration':None,
            'atomic_upgrade':'2.35.3 -> 2.36.0 / PASS',
            'fresh_install':'PASS',
            'sqlite_integrity_fk':'PASS',
            'owner_production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool formal/VF_PROJECT.json >/dev/null
          git -C formal diff --check
          test "$(git -C formal diff --name-only)" = VF_PROJECT.json
          test "$(git -C formal rev-parse HEAD:src)" = "$CANDIDATE_RUNTIME_TREE"
          git -C formal config user.name VictorForge
          git -C formal config user.email llhzx2018@gmail.com
          git -C formal add VF_PROJECT.json
          git -C formal commit -m 'release(P01): bind V2.36.0 candidate PASS'
          test "$(git -C formal rev-parse HEAD:src)" = "$CANDIDATE_RUNTIME_TREE"
          git -C formal push origin HEAD:release/v2.36.0-formal-source-20260901
          printf 'FORMAL_SOURCE=%s\nFORMAL_TREE=%s\nFORMAL_RUNTIME_TREE=%s\n' "$(git -C formal rev-parse HEAD)" "$(git -C formal rev-parse HEAD^{tree})" "$(git -C formal rev-parse HEAD:src)"
