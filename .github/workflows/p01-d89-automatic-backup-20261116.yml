name: P01 D89 real three-engine isolated encrypted automatic backup and job isolation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-d89-automatic-backup-20261116.yml'
permissions:
  contents: read
concurrency:
  group: p01-d89-20261116
  cancel-in-progress: false
jobs:
  exact-three-db-job-parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports: ["3306:3306"]
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports: ["3307:3306"]
    env:
      PRODUCT_SHA: 0acc11551358e445265bc4ee2bcb2d4d43cdf476
    steps:
      - name: Restrict to exact one-off Runner branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-d89-three-engine-automatic-backup-20261116"
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_D89_ONLY_SYNTHETIC_ISOLATED_TESTS=YES
      - name: Checkout approved exact private product without persisting token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout shared source rules for project architecture gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-doc
          persist-credentials: false
      - name: Exact source identity and changed code syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for n in ("d79_job_crash_recovery.py","d84_backup_file_audit.py",
                        "d86_schedule_owner_controls.py","d87_side_effect_failure.py",
                        "d89_owner_backup_cli.py"):
              ast.parse((Path("candidate/tests/compatibility/laravel/http")/n).read_text())
          print("P01_D89_JOB_PYTHON_SYNTAX=PASS")
          PY
          echo P01_D89_EXACT_PRODUCT_SOURCE=PASS
      - name: Install only isolated machine dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-d89-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >> "$RUNNER_TEMP/p01-d89-apt.log" 2>&1
          php8.3 -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(3);'
          for name in src/app/next/runtime/OwnerIsolatedBackupJob.php src/app/next/bin/p01-owner-isolated-backup.php tests/compatibility/laravel/http/d89_owner_backup_restore_clone.php src/app/next/OwnerJobRuntime.php src/app/next/OwnerJobScheduleControl.php src/app/next/D2OwnerJobRepository.php src/app/next/http/OwnerHttpRoutes.php tests/compatibility/laravel/D2OwnerJobRepositoryProbe.php; do
              php8.3 -l "candidate/$name" >/dev/null
          done
          echo P01_D89_REAL_PHP_SYNTAX_AND_NATIVE_DATABASE_DRIVERS=PASS
      - name: Project source architecture and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B candidate/.github/checks/test_architecture_gate.py > "$RUNNER_TEMP/p01-d89-arch-tests.log" 2>&1
          python3 -B candidate/.github/checks/architecture_gate.py --manifest candidate/.github/checks/code_architecture.json --gov-root gov-doc --base-sha c377dc3e0696585b207561081f6dc462108c904f --head-sha "$PRODUCT_SHA" --git-root candidate > "$RUNNER_TEMP/p01-d89-architecture.log" 2>&1
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-d89-architecture.log" >/dev/null
          echo P01_D89_ACTUAL_DIFF_ARCHITECTURE_NAMING_NEGATIVES=PASS
      - name: Build real exact-source Laravel Clean FULL and CloudPanel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/p01-d89-clean-full.zip" --composer composer > "$RUNNER_TEMP/p01-d89-build.log" 2>&1 || { tail -n 12 "$RUNNER_TEMP/p01-d89-build.log"; exit 1; }
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-d89-clean-full.zip" >/dev/null
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-d89-clean-full.zip" --output "$RUNNER_TEMP/p01-d89-cloudpanel.zip" >/dev/null
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-d89-cloudpanel.zip" >/dev/null
          echo P01_D89_REAL_EXACT_SOURCE_SELF_CONTAINED_FULL=PASS
      - name: D89 real installed 3DB automatic backup CLI and canonical job audit
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"candidate/tests/compatibility/laravel/http")
          from run_cloudpanel_fpm_full_stage import Site,require
          from d89_owner_backup_cli import verify_isolated_backup
          # The canonical Site.run invokes D77 -> D78 -> D79/D81/D82/D83/D84
          # exactly once. Re-invoking these probes pollutes the clean job ledger.
          bundle=Path(__import__("os").environ["RUNNER_TEMP"])/"p01-d89-cloudpanel.zip"
          for engine in ("sqlite","mariadb","mysql"):
              with tempfile.TemporaryDirectory(prefix="p01-d14-stage-") as temporary:
                  site=Site(Path(temporary),engine,bundle)
                  try:
                      site.start()
                      site.run()
                      verify_isolated_backup(site)
                      print("P01_D89_"+engine.upper()+"_HTTPS_AND_ISOLATED_BACKUP_EXECUTION=PASS",flush=True)
                  finally:
                      site.stop()
          print("P01_D89_THREE_REAL_ENGINES_AUTOMATIC_ENCRYPTED_BACKUP_AND_JOB_ISOLATION=PASS")
          PY
      - name: Cleanup all transient private product, data and build input
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate gov-doc
          rm -f -- "$RUNNER_TEMP"/p01-d89-*
          test ! -e candidate && test ! -e gov-doc
          echo P01_D89_PUBLIC_RUNNER_PRIVATE_SOURCE_AND_TEST_DATA_PERSISTENCE=NONE
