name: P08 R18 Official CloudPanel Laravel13 Vhost Compatibility (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r18-cloudpanel-vhost-oneoff.yml'

permissions:
  contents: read

jobs:
  cloudpanel-offline:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      P08_SOURCE_SHA: 3d6d620fcac1340ad33a6f172ac1c27bef1d969b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Confirm existing ephemeral private checkout capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN" || { echo P08_R18_PRIVATE_READ_MISSING; exit 78; }
          echo P08_R18_EXISTING_PRIVATE_READ_CAPABILITY_PASS

      - name: Checkout exact private P08 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-lander
          ref: 3d6d620fcac1340ad33a6f172ac1c27bef1d969b
          path: product
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact official CloudPanel vhost-template source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cloudpanel-io/vhost-templates
          ref: 54e151641e2b5ad6da62ba08bf64db865f0fd6d8
          path: official
          persist-credentials: false
          fetch-depth: 1

      - name: Verify both Git exact sources and changed-scope syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$P08_SOURCE_SHA"
          test "$(git -C official rev-parse HEAD)" = '54e151641e2b5ad6da62ba08bf64db865f0fd6d8'
          test "$(git -C official hash-object 'v2/Laravel/Laravel 13')" = 'b2b0c584a257060ad72da23e05f6c7c7bda218c3'
          python3 -m py_compile product/backend/bin/cloudpanel-vhost-candidate.py
          python3 -m py_compile product/backend/tests/ops/cloudpanel-official-vhost-proof.py
          echo P08_R18_EXACT_PRIVATE_AND_UPSTREAM_SOURCE_IDENTITY_PASS

      - name: Install Nginx for isolated non-CloudPanel HTTPS runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
          command -v nginx && command -v openssl && command -v curl
          echo P08_R18_LOCAL_NGINX_AVAILABLE

      - name: Test official upstream derived guarded config over actual Nginx TLS
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 backend/tests/ops/cloudpanel-official-vhost-proof.py \
            "$GITHUB_WORKSPACE/official/v2/Laravel/Laravel 13"
          echo P08_R18_REGISTERED_RUNNER_PROOF_PASS

      - name: Remove private checkout, official sources and synthetic keys
        shell: bash
        if: always()
        run: |
          set +e
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          echo P08_R18_EPHEMERAL_SOURCE_AND_TLS_CLEANUP_ATTEMPTED
          echo P08_R18_PUBLIC_ARTIFACTS_NONE
