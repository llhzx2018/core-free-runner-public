name: GOV-DOC #187 all-portfolio reactivation gate proof (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/gov187-reactivation-proof.yml'

permissions:
  contents: read

jobs:
  gov187-exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      startsWith(github.head_ref, 'maintenance/gov187-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Checkout exact private GOV-DOC candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 9cb029ad444fc29cf933e22b5304912d382b807e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-src
      - name: Validate exact source and future reactivation positive/negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C gov-src rev-parse HEAD)" = 9cb029ad444fc29cf933e22b5304912d382b807e
          echo 'GOV187_SOURCE=9cb029ad444fc29cf933e22b5304912d382b807e'
          python3 -B -m unittest discover -s gov-src/governance/agent -p test_repository_source_adoption_gate.py > "$RUNNER_TEMP/gov187-adoption.log" 2>&1 || { echo 'GOV187_ADOPTION=FAIL'; tail -n 65 "$RUNNER_TEMP/gov187-adoption.log"; exit 1; }
          grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov187-adoption.log" || true
          echo 'GOV187_ADOPTION=PASS'
          python3 -B -m unittest discover -s gov-src/governance/agent -p test_portfolio_coverage_gate.py > "$RUNNER_TEMP/gov187-portfolio.log" 2>&1 || { echo 'GOV187_DENOMINATOR=FAIL'; tail -n 65 "$RUNNER_TEMP/gov187-portfolio.log"; exit 1; }
          grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov187-portfolio.log" || true
          echo 'GOV187_DENOMINATOR=PASS'
          if python3 -B gov-src/governance/agent/portfolio_coverage_gate.py --gov-root gov-src --scope active-software --claimed P01 --claimed P02 --claimed P07 --claimed P08 --claimed S01-C01 --claimed S01-C02 --claimed S01-C03 > "$RUNNER_TEMP/gov187-reject-seven.log" 2>&1; then
            echo 'GOV187_SEVEN_ONLY_UNEXPECTED_PASS'
            exit 1
          fi
          grep -q '"P04"' "$RUNNER_TEMP/gov187-reject-seven.log" && grep -q '"P05"' "$RUNNER_TEMP/gov187-reject-seven.log" || { echo 'GOV187_SEVEN_ONLY_MISSING_P04_P05_NOT_DETECTED'; exit 1; }
          echo 'GOV187_SEVEN_ONLY_BLOCKED=PASS'
      - name: Check existing Current/architecture/source regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for suite in test_repository_entry.py test_code_architecture_lint.py; do
            python3 -B -m unittest discover -s gov-src/governance/agent -p "$suite" > "$RUNNER_TEMP/gov187-$suite.log" 2>&1 || { echo "GOV187_REGRESSION=FAIL:$suite"; tail -n 40 "$RUNNER_TEMP/gov187-$suite.log"; exit 1; }
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/gov187-$suite.log" || true
          done
          python3 -B gov-src/governance/catalog/tools/doc_structure_lint.py --root gov-src > "$RUNNER_TEMP/gov187-doc.log" 2>&1 || { echo 'GOV187_DOC_STRUCTURE=FAIL'; exit 1; }
          echo 'GOV187_DOC_STRUCTURE=PASS'
          python3 -B gov-src/governance/public-authority/tools/global_closure_lint.py --root gov-src > "$RUNNER_TEMP/gov187-closure.log" 2>&1 || { echo 'GOV187_GLOBAL_CLOSURE=FAIL'; exit 1; }
          echo 'GOV187_GLOBAL_CLOSURE=PASS'
          python3 -B gov-src/governance/public-authority/tools/current_dependency_lint.py --root gov-src > "$RUNNER_TEMP/gov187-current.log" 2>&1 || { echo 'GOV187_CURRENT=FAIL'; exit 1; }
          echo 'GOV187_CURRENT=PASS'
          echo 'GOV187_REGRESSION=PASS'
      - name: Validate actual Git diff and Public Authority impact without sealed edits
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL, UPGRADE, SECURITY, TESTING, GIT, UA_UI, DATA_SCHEMA
            IMPACT_REASON: Repository entry template adds safe current-policy adoption for retired and newly created repositories without editing existing sealed public authority files or publication gates.
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B gov-src/governance/public-authority/tools/global_closure_lint.py --root gov-src --git-base 4bac826de506bc2c857cb42cfd9645e70227273b --git-head 9cb029ad444fc29cf933e22b5304912d382b807e > "$RUNNER_TEMP/gov187-git-closure.log" 2>&1 || { echo 'GOV187_GIT_CLOSURE=FAIL'; exit 1; }
          echo 'GOV187_GIT_CLOSURE=PASS'
          python3 -B gov-src/governance/public-authority/tools/current_dependency_lint.py --root gov-src --git-base 4bac826de506bc2c857cb42cfd9645e70227273b --git-head 9cb029ad444fc29cf933e22b5304912d382b807e > "$RUNNER_TEMP/gov187-git-current.log" 2>&1 || { echo 'GOV187_GIT_CURRENT=FAIL'; exit 1; }
          echo 'GOV187_GIT_CURRENT=PASS'
      - name: Remove temporary private checkout/logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-src
          rm -f "$RUNNER_TEMP"/gov187-*
