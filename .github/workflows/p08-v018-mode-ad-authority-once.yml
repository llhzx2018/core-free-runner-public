name: P08 Mode AD exact authority proof only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-v018-mode-ad-authority-once.yml'
permissions:
  contents: read
jobs:
  authority:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p08-v018-mode-ad-authority-once-20261128' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact GOV candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: cbd8ee82808a932802b6019322b774d5b5af21e6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Existing affected source and negative gates
        shell: bash
        working-directory: gov
        env:
          GOV_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          python3 -B - <<'PY'
          import os, json, subprocess, urllib.request
          head="cbd8ee82808a932802b6019322b774d5b5af21e6"
          base="cf6d84ab4efcaee16566a56744d7a363692dfab4"
          tree="cbf79341e5de175066c9f8adf04f56e94d0d6762"
          def git(*a):
              return subprocess.check_output(["git",*a],text=True,stderr=subprocess.DEVNULL,timeout=30).strip()
          def need(ok,code):
              if not ok: raise SystemExit(code)
          need(git("rev-parse","HEAD")==head and git("rev-parse","HEAD^{tree}")==tree,"EXACT_GOV_SOURCE_NOT_PROVEN")
          token=os.environ.pop("GOV_READ","")
          need(bool(token),"READ_CAPABILITY_MISSING")
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/llhzx2018/gov-doc/"+path,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","User-Agent":"VF-Authority-Readback"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      return json.load(res)
              except Exception:
                  raise SystemExit("LIVE_PR_READ_NOT_PROVEN") from None
          pr=api("pulls/223")
          need(pr["state"]=="open" and pr["head"]["sha"]==head and pr["base"]["ref"]=="main" and pr["base"]["sha"]==base and api("git/ref/heads/main")["object"]["sha"]==base,"LIVE_GOV_PR_CHANGED")
          del token
          expected={"CURRENT.md","skills/README.md","skills/skill-release/V3.30/SKILL.md","governance/release/cases/P08_ADOPS_V018_CLEAN_FULL_ONLY_POST_RELEASE_OWNER_MANUAL_20261128.md"}
          need(set(git("diff","--name-only",base,head).splitlines())==expected,"AUTHORITY_DIFF_SCOPE")
          print("GOV_EXACT_SOURCE_AND_DIFF=PASS",flush=True)
          env=dict(os.environ,PR_BODY=pr["body"],PYTHONDONTWRITEBYTECODE="1")
          commands=[
            ["governance/public-authority/tools/current_dependency_lint.py","--git-base",base,"--git-head",head],
            ["governance/public-authority/tools/global_closure_lint.py","--git-base",base,"--git-head",head],
            ["governance/public-authority/tools/public_authority_skill_bridge_lint.py"],
            ["governance/catalog/tools/doc_structure_lint.py"],
            ["-m","unittest","discover","-s","governance/public-authority/tools","-p","test_current_dependency_lint.py","-v"],
            ["-m","unittest","discover","-s","governance/public-authority/tools","-p","test_global_closure_lint.py","-v"],
            ["-m","unittest","discover","-s","governance/public-authority/tools","-p","test_public_authority_skill_bridge_lint.py","-v"],
            ["-m","unittest","discover","-s","governance/catalog/tools","-p","test_doc_structure_lint.py","-v"],
          ]
          for i,command in enumerate(commands,1):
              result=subprocess.run(["python3","-B",*command],env=env,capture_output=True,text=True,timeout=70)
              print("GOV_ORIGINAL_CHECK_"+str(i)+"_EXIT="+str(result.returncode),flush=True)
              if result.returncode:
                  # Emit only simple static checker reason codes, never arbitrary private text.
                  import re
                  for line in (result.stdout+"\n"+result.stderr).splitlines():
                      if re.fullmatch(r"[A-Z][A-Z0-9_]{5,100}(?:=[A-Z0-9_]{1,100})?",line):
                          print(line)
                  raise SystemExit("GOV_ORIGINAL_CHECK_FAILED")
          need(not git("status","--porcelain","--untracked-files=all"),"GOV_WORKTREE_CHANGED")
          print("GOV_MODE_AD_AUTHORITY_MACHINE=PASS",flush=True)
          PY
      - name: Erase transient private checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- gov
          test ! -e gov
          echo GOV_PRIVATE_CHECKOUT_CLEANUP=PASS
