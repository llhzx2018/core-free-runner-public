name: S01 C02 1211102 Formal Release
on:
  push:
    branches: [task/s01-c02-1211102-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1102'
      TARGET_SHA: '65ec2109e35ff10adf94f494955dac5808101b01'
      MAIN_SHA: '94617aad0228e6462b7a83d54705c39860440d39'
      TARGET_TREE: '404d8c49904a961069a5455f26bad9da938cc52a'
      RELEASE_TAG: 'v1.21.1102'
      RUN_ID: '38197305479'
      ARTIFACT_ID: '11724021601'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Validate the final release lane identity
        run: |
          python3 runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/s01-c02-1211102/formal-spec.json
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c02-1211102/formal-spec.json --input runner/.github/workflows/s01-c02-1211102-formal-release.yml
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 65ec2109e35ff10adf94f494955dac5808101b01
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211102/formal-release.sh
          bash runner/lanes/s01-c02-1211102/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211102-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30

