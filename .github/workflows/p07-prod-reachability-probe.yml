name: P07 Production Reachability Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-prod-reachability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe TCP ports and HTTPS origin
        shell: bash
        run: |
          set -Eeuo pipefail
          host=24.199.108.229
          for port in 22 80 443 8443; do
            if timeout 5 bash -lc "exec 3<>/dev/tcp/$host/$port"; then
              echo "P07_PROD_TCP_${port}=OPEN"
            else
              echo "P07_PROD_TCP_${port}=CLOSED_OR_TIMEOUT"
            fi
          done

          code="$(curl -k -sS -o /tmp/origin-body \
            --connect-timeout 5 --max-time 12 \
            --resolve start.kewaro.com:443:$host \
            -w '%{http_code}' https://start.kewaro.com/ || true)"
          echo "P07_PROD_ORIGIN_HTTPS_STATUS=$code"

          panel_code="$(curl -k -sS -o /tmp/panel-body \
            --connect-timeout 5 --max-time 12 \
            -w '%{http_code}' https://$host:8443/ || true)"
          echo "P07_PROD_PANEL_HTTPS_STATUS=$panel_code"
