name: S01-C02 1.21.853 Core Update External Gate

on:
  push:
    branches: [temp/s01-c02-121853-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-c02-121853-core-update-gate-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: 81f4aefa9a50a3150fe8c26229f338d3d57afe7b
      CORE_HEAD: 1af8dc3838f28072ebdda9bea3c598b04f38e6dd
      OPS_SHA: c20aaaa0d80a20d103c337babe50bd65d110d154
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact one-manifest delta and canonical validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          test "$(git -C core diff --name-only "$CORE_BASE..$CORE_HEAD")" = 'projects/S01-C02.json'
          cd core
          python3 -m json.tool projects/S01-C02.json >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'EXACT_ONE_MANIFEST_DELTA=PASS'
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: S01-C02 semantic boundary
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('projects/S01-C02.json'))
          assert c['target_version']=='1.21.853'
          assert c['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852']
          assert c['plugin_file']=='vf-ops/vf-ops.php'
          assert c['physical_locator']=='vf-ops/vf-ops.php'
          assert c['canonical_locator']=='vf-tools-ops/vf-tools-ops.php'
          assert c['locator_cutover'] is False
          assert c['schema_from']=='6.0.0' and c['schema_to']=='6.0.0'
          assert c['release_tag']=='v1.21.853'
          assert c['asset_name']=='vf-tools-ops_V1.21.853.zip'
          assert c['asset_bytes']==3336689
          assert c['asset_sha256']=='9e3504776d1ded2fb8a897acf062553f4f644ade37bf5e3155927fbf6e2fb50e'
          assert c['runtime_files']==934 and c['runtime_file_count']==934
          assert c['runtime_fingerprint']=='c1d4b2a67a17cc7fc2aed51d7c1790f3f2d73165f7409b1b869f1684a70a64b5'
          assert c['runtime_fingerprint_sha256']==c['runtime_fingerprint']
          assert '34092488100 PASS' in c['notes']
          assert '34092654272 PASS' in c['notes']
          print('S01_C02_SEMANTIC_BOUNDARY=PASS')
          PY

      - name: Exact formal Release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.853 > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.853.zip' '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = '3336689'
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.853.zip' '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = 'sha256:9e3504776d1ded2fb8a897acf062553f4f644ade37bf5e3155927fbf6e2fb50e'
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.853 | jq -r '.object.sha')" = "$OPS_SHA"
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')" = "$OPS_SHA"
          echo 'EXACT_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_C02_121853_CORE_UPDATE_EXTERNAL_GATE=PASS'
