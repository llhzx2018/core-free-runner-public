name: P03 V1.37.5 Post-Release Authority Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-post-release-authority-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P03_AUTH_SOURCE: e41a7b6e48b25ce73f8b023e6a9373bc37f369a0
      P03_AUTH_BASE: fdacc51c5ee652144490cfd963f57d2198dceb65
      RELEASE_SOURCE: f2865c97f80bd8052dd47d76ef08c626c044e669
      RELEASE_TAG: v1.37.5
      RELEASE_ID: '378390441'
      CORE_UPDATES_MAIN: 4dbc9a0e4e81149a7db8f90c6e5b652d9fa09287
      CORE_UPDATES_EXACT: 0cc0fbd48a3c47a15df1af991192f09d82e917c3
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P03 Authority source and fence scope
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-forge.git" p03 >/dev/null 2>&1
          cd p03
          git fetch --no-tags origin "$P03_AUTH_SOURCE"
          git checkout --detach "$P03_AUTH_SOURCE"
          test "$(git rev-parse HEAD)" = "$P03_AUTH_SOURCE"
          test "$(git rev-parse HEAD^1)" = "$P03_AUTH_BASE"
          test "$(git diff --name-only "$P03_AUTH_BASE".."$P03_AUTH_SOURCE")" = 'VF_PROJECT.json'
          test "$(cat VERSION)" = '1.37.5'
          echo P03_V1375_POST_RELEASE_AUTHORITY_SOURCE_FENCE=PASS
      - name: Validate current Authority truth
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('p03/VF_PROJECT.json').read_text())
          assert d['project_id']=='P03'
          assert d['status']=='V1.37.5 RELEASED / HUMAN-READABLE COMMON BASELINE UI / PRODUCTION UPGRADE PENDING'
          assert d['project_status']=='RELEASED_PRODUCTION_UPGRADE_PENDING'
          assert d['lifecycle']=='RELEASED'
          assert d['production_version']=='1.37.4'
          assert d['working_version']==d['candidate_version']=='1.37.5'
          assert d['schema_version']==30 and d['migration']=='NONE'
          pi=d['product_identity']
          assert pi['candidate_source_commit']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert pi['release_tag']=='v1.37.5'
          r=d['release']
          assert r['installed_production_version']=='1.37.4'
          assert r['candidate_version']=='1.37.5'
          assert r['release_ready']=='PUBLISHED / OWNER_UPGRADE_PENDING'
          assert r['release_tag']=='v1.37.5'
          assert '4dbc9a0e4e81149a7db8f90c6e5b652d9fa09287' in r['core_updates']
          assert r['owner_upgrade_authorized'] is True
          assert r['owner_upgrade_completed'] is False
          assert r['production_write'] is False
          cv=d['verification']['current_release_verification']
          assert cv['formal_gate_result']=='PASS' and cv['formal_gate_run_id']==33160320928 and cv['formal_gate_job_id']==98812936218
          assert cv['product_exact_source']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert cv['core_updates_first_manifest_gate_run_id']==33160709416
          assert cv['core_updates_manifest_gate_run_id']==33161847134 and cv['core_updates_manifest_gate_result']=='PASS'
          assert cv['core_updates_final_exact_source']=='0cc0fbd48a3c47a15df1af991192f09d82e917c3'
          assert cv['core_updates_main']=='4dbc9a0e4e81149a7db8f90c6e5b652d9fa09287'
          assert cv['production_version']=='1.37.4' and cv['production_upgrade']=='PENDING_OWNER'
          ar=d['authority_reconciliation']
          assert ar['status']=='POST_RELEASE_RECONCILED'
          assert ar['stale_candidate_source_commit']=='95a16f988631b2ac19c3cdb24341296616aa03bf'
          assert ar['correct_release_source_commit']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert d['next_action'].startswith('OWNER UPGRADE PRODUCTION V1.37.4 -> V1.37.5')
          print('P03_V1375_AUTHORITY_TRUTH=PASS')
          print('P03_PRODUCTION_STILL_V1374=PASS')
          PY
      - name: Verify immutable Release and published core-updates truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-forge/git/ref/tags/$RELEASE_TAG --jq .object.sha)" = "$RELEASE_SOURCE"
          test "$(gh api repos/llhzx2018/vf-forge/releases/tags/$RELEASE_TAG --jq .id)" = "$RELEASE_ID"
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" updates >/dev/null 2>&1
          cd updates
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_MAIN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('projects/P03.json').read_text())
          assert d['target_version']=='1.37.5' and d['from_versions']==['1.37.4']
          assert d['product_identity']=='f2865c97f80bd8052dd47d76ef08c626c044e669'
          assert d['release_tag']=='v1.37.5' and d['release_id']==378390441
          assert d['asset_name']=='VF_Forge_V1.37.5_UPDATE.zip'
          assert d['asset_bytes']==851575
          assert d['asset_sha256']=='e90e2ef73abc13634213ee9fd8e166c99866c9b133d9837ec0f7939be51e8150'
          print('P03_V1375_CORE_UPDATES_PUBLISHED_TRUTH=PASS')
          PY
          echo P03_V1375_IMMUTABLE_RELEASE_TRUTH=PASS
      - name: Final result
        run: |
          echo P03_V1375_POST_RELEASE_AUTHORITY_EXACT_SOURCE_GATE=PASS
          echo PRODUCTION_WRITE=NO
