name: P01 VF Music Native Continuous Audio Exact Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-music-native-v247427-20261022.yml']
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/p01-music-native-v247427-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: PHP SQLite native music runtime
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Fetch private exact P01 candidate transiently
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --no-checkout \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin c1d147eebb6c3aa87981521c9f25903a01e18f3c
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C candidate rev-parse HEAD)" = c1d147eebb6c3aa87981521c9f25903a01e18f3c
          test "$(tr -d '\r\n ' <candidate/VERSION)" = '2.47.427'
          test "$(tr -d '\r\n ' <candidate/src/VERSION.txt)" = '2.47.427'
          test -z "$(git -C candidate status --porcelain)"
          echo P01_NATIVE_EXACT_SOURCE=PASS
      - name: Focused PHP JS URL security and browser-ended queue contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in candidate/src/app/MusicSource.php candidate/src/app/MusicDemoCatalog.php candidate/src/music-home.php candidate/src/app/bootstrap.php; do php -l "$f"; done
          (cd candidate && php tests/unit/music_native_source_contract.php)
          node candidate/tests/unit/music_player_fallback_contract.js
          (cd candidate && for f in tests/unit/consolidated_product_acceptance_contract.php tests/unit/engineering_consistency_r80_contract.php tests/unit/public_global_nav_contract.php tests/unit/public_home_owner_shell_unified_v247390_contract.php tests/unit/workspace_view_catalog_contract.php; do php "$f"; done)
          echo P01_MUSIC_NATIVE_CLIENT_QUEUE_SECURITY=PASS
      - name: Real owner-only PHP+SQLite HTTP and CSP
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_NATIVE_HTTP_SECURITY=PASS
      - name: Verify source CDN actually serves OGG range in this environment
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            'https://upload.wikimedia.org/wikipedia/commons/4/43/Smells_Like_Rain.ogg'
            'https://upload.wikimedia.org/wikipedia/commons/6/65/Mission1.ogg'
            'https://upload.wikimedia.org/wikipedia/commons/e/e2/Domenico.Scarlatti.Sonata.b.minor.Kirkpatrick.87.ogg'
            'https://upload.wikimedia.org/wikipedia/commons/c/c7/Mendelssohn.Venetianisches.Gondellied.opus.30.6.ogg'
          )
          for i in "${!files[@]}"; do
            echo "P01_MUSIC_CDN_TEST_INDEX=$i"
            curl -fLsS --range 0-1023 --connect-timeout 12 --max-time 35 --retry 1 \
              -A 'VF-Music-ReadOnly-StreamCheck/1.0 (contact: https://kewaro.com)' \
              --output /tmp/vf-music-audio-range "${files[$i]}"
            test -s /tmp/vf-music-audio-range
            echo "P01_MUSIC_CDN_AUDIO_RANGE_$i=PASS"
          done
          echo P01_MUSIC_CDN_HTTP_READ=PASS
      - name: Cleanup all private sources and temporary audio bytes
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/vf-music-audio-range
          echo P01_MUSIC_NATIVE_EPHEMERAL_CLEANUP=PASS
