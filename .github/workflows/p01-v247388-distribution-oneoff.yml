name: P01 V2.47.388 Distribution Native Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247388-distribution-oneoff.yml'
permissions:
  contents: read
concurrency:
  group: p01-v247388-channel-oneoff
  cancel-in-progress: false
jobs:
  channel-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout disposable public verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact core-updates manifest candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: c944f2325213d783ff1c61229dee904c23e31ebd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source, manifests and native updater tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = c944f2325213d783ff1c61229dee904c23e31ebd
          cd channel
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-php-lint.txt
          php update-core/php/tests/run.php
          jq -e '.schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and .current_version=="2.47.387" and .target_version=="2.47.388" and .update_type=="ATOMIC" and .from_versions==["2.47.387"] and .schema_from=="2026090401" and .schema_to=="2026090401" and .product_identity=="280ff1d18e1e9a72351cd7361223d31f1ffb5c7c" and .release_tag=="v2.47.388" and .release_id==416252596 and .asset_name=="VF_Start_V2.47.388_UPDATE.zip" and .asset_bytes==2565375 and .asset_sha256=="0da2b3ce78bd4ae9e1d63901a68808a2eac9fa293e910f282edd95312fc5cdbd" and .backup_required==true and .rollback_supported==true' projects/P01.json >/dev/null
          echo P01_CHANNEL_NATIVE_CONTRACT_AND_UPDATER=PASS
      - name: Independent published release identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.388 > /tmp/p01-release.json
          jq -e '.id==416252596 and .tag_name=="v2.47.388" and .draft==false and .prerelease==false and (.assets | any(.name=="VF_Start_V2.47.388_UPDATE.zip" and .size==2565375 and .digest=="sha256:0da2b3ce78bd4ae9e1d63901a68808a2eac9fa293e910f282edd95312fc5cdbd"))' /tmp/p01-release.json >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.388 --jq '.object.sha')" = 280ff1d18e1e9a72351cd7361223d31f1ffb5c7c
          echo P01_CHANNEL_GITHUB_ASSET_REMOTE_IDENTITY=PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf channel
