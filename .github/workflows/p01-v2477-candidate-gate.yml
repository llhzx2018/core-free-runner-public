name: P01 V2.47.7 Candidate Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2477-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2477-candidate-gate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2477-candidate-gate-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      ENGINEERING_SHA: 37f771993b479831a1366c4aefa9062e52953b3d
      TARGET_BRANCH: release/v2.47.7-candidate-20260911
      SOURCE_TAG: v2.47.6
      SOURCE_SHA: 67ffe44e67909ef5f172f3ba54e4e54da412d41b
      SOURCE_VERSION: 2.47.6
      TARGET_VERSION: 2.47.7
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and release intake
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then echo BLOCK=TARGET_TAG_ALREADY_EXISTS; exit 81; fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_PREVIEW_REASON='Owner explicitly specified exact restoration of existing account actions; no new product/auth/data semantics; backend one-hop update is the practical owner preview path.'
          echo P01_V2477_INTAKE=PASS

      - name: Checkout release candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: vf-start

      - name: Create exact V2.47.7 candidate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINEERING_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '${SOURCE_VERSION}');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old=f"define('VF_VERSION', '{os.environ['SOURCE_VERSION']}');"
          new=f"define('VF_VERSION', '{os.environ['TARGET_VERSION']}');"
          if s.count(old)!=1: raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          mkdir -p docs/release
          cat > docs/release/V2.47.7_RELEASE_GATE.md <<'EOF'
          # P01 · V2.47.7 Release Gate

          ## Owner Preview Applicability

          `OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A`

          Reason: R22 is a bounded restoration/relocation of existing Login / Settings / Logout actions to the persistent top-right account area after R21 removed the page-local sidebars that previously exposed them. The Owner explicitly specified this exact placement. The change introduces no new account role, authentication protocol, data model, schema, migration, credential, or permission semantics. The existing installed-product online updater is the practical Owner preview path, so a separate pre-release runtime preview would duplicate the same reversible one-hop update path rather than reduce product ambiguity.

          This N_A does not waive machine evidence or Production separation. Exact Candidate browser login/logout, responsive placement, FULL install, one-hop UPDATE, data preservation, backup/rollback, security and remote byte readback remain required.

          ## Public Authority Applicability

          | Domain | State | Release obligation |
          |---|---|---|
          | INSTALL | REQUIRED | Clean FULL, first request/setup/admin init/login/setup lock |
          | SECURITY | REQUIRED | auth/session boundary unchanged; package hash/asset safety; login/logout runtime proof |
          | TESTING | REQUIRED | syntax, contract, runtime, browser, install and update evidence |
          | UPGRADE | REQUIRED | strict 2.47.6 → 2.47.7 Atomic update, preflight/backup/rollback/readback |
          | DATA_SCHEMA | REQUIRED | persistent SQLite preserved; schema 2026090401 unchanged; no user data in packages |
          | API_PROVIDER | N_A | no provider/API capability change |
          | SEO | N_A | no public indexing/metadata change |
          | CRON_JOB | N_A | no scheduler/background-job change |
          | NOTIFICATION | N_A | no notification capability change |
          | OBSERVABILITY | N_A | no Production write in this release gate |
          | PERFORMANCE | N_A | no performance/capacity-sensitive capability change |
          | GIT | REQUIRED | exact source, branch/tag/release/remote readback |
          | UA_UI | REQUIRED | global account actions pinned top-right; Navigation sidebar de-duplicated; desktop/mobile/anonymous/authenticated browser proof |

          ## Stable Product Boundary

          - Schema: `2026090401 → 2026090401`
          - Migration: `NONE`
          - Canonical data/storage authority: unchanged
          - Update route: strict one-hop `2.47.6 → 2.47.7`
          - Production: separate; not claimed by Release/Distribution PASS
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          old=p.read_text(encoding='utf-8')
          entry='''# V2.47.7\n\n- R22：将全站账户操作统一到右上角固定区域。匿名状态保持“登录”；登录后固定显示“设置 / 退出”。\n- 导航页继续保留分类侧栏，但移除侧栏底部重复的登录/设置/退出入口。\n- 顶部业务入口与账户区拆分：业务入口可横向滚动，账户区不被挤出视口；桌面/手机均保持可达。\n- 不改变认证协议、权限、数据模型、Schema 或 Migration。Schema 仍为 `2026090401`，Migration `NONE`。\n- V2.47.7 只支持正式验证的 `2.47.6 → 2.47.7` 单跳在线更新。\n\n'''
          if old.startswith('# V2.47.7'):
              raise SystemExit('changelog entry already exists')
          p.write_text(entry+old,encoding='utf-8')
          PY
          git config user.name 'VictorForge Release'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php CHANGELOG.md docs/release/V2.47.7_RELEASE_GATE.md
          git commit -m 'release(P01): prepare V2.47.7 candidate'
          git push origin HEAD:"$TARGET_BRANCH"
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" | tee /tmp/p01-v2477-candidate.env
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Candidate identity and bounded diff
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA=$(git rev-parse HEAD)
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          mapfile -t changed < <(git diff --name-only "$ENGINEERING_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" >/tmp/p01-v2477-changed.txt
          cat >/tmp/p01-v2477-expected.txt <<'EOF'
          CHANGELOG.md
          VERSION
          docs/release/V2.47.7_RELEASE_GATE.md
          src/VERSION.txt
          src/app/bootstrap.php
          EOF
          diff -u /tmp/p01-v2477-expected.txt /tmp/p01-v2477-changed.txt
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.7_RELEASE_GATE.md
          grep -Fq 'UPGRADE | REQUIRED' docs/release/V2.47.7_RELEASE_GATE.md
          grep -Fq 'UA_UI | REQUIRED' docs/release/V2.47.7_RELEASE_GATE.md
          echo P01_V2477_IDENTITY_SCOPE=PASS

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Static and R22 contract
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v2477-php-lint.log
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php -l tests/unit/global_account_actions_contract.php
          php tests/unit/global_account_actions_contract.php | tee /tmp/p01-v2477-r22-contract.log
          grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS' /tmp/p01-v2477-r22-contract.log
          echo P01_V2477_STATIC_TESTING=PASS

      - name: Fresh install, setup lock, and authenticated browser
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2477-runtime /tmp/p01-v2477-pw
          cp -a src /tmp/p01-v2477-runtime
          cd /tmp/p01-v2477-runtime
          php -S 127.0.0.1:18127 -t . >/tmp/p01-v2477-server.log 2>&1 & echo $! >/tmp/p01-v2477-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v2477.cookies -b /tmp/p01-v2477.cookies http://127.0.0.1:18127/setup.php -o /tmp/p01-v2477-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2477-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2477x"; printf '%s' "$PASS" >/tmp/p01-v2477.password
          curl -fsS -L -c /tmp/p01-v2477.cookies -b /tmp/p01-v2477.cookies -X POST http://127.0.0.1:18127/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2477 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2477-post.html
          test -f app/.runtime.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          code=$(curl -sS -o /tmp/p01-v2477-revisit -D /tmp/p01-v2477-revisit.h -w '%{http_code}' http://127.0.0.1:18127/setup.php); test "$code" = 302
          tr -d '\r' </tmp/p01-v2477-revisit.h | grep -Eiq '^Location: /$'
          cd /tmp
          mkdir -p /tmp/p01-v2477-pw && cd /tmp/p01-v2477-pw
          npm init -y >/dev/null 2>&1; npm install --no-save playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18127/';const password=fs.readFileSync('/tmp/p01-v2477.password','utf8');const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1291,height:797}});const p=await ctx.newPage();await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-global-account-actions');
          let a=await p.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect();return{labels:[...c.querySelectorAll('a')].map(x=>x.textContent.trim()),right:r.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(a.labels.join('|')!=='登录'||a.right<1260||a.right>1291.5||a.overflow>1)throw new Error('anon '+JSON.stringify(a));
          await p.click('[data-vf-auth-login]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          const inspect=async(path)=>{await p.goto(base+path,{waitUntil:'networkidle'});return await p.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect(),ss=document.querySelector('.vf-sidebar-bottom>a[href="settings.php"]'),sl=document.querySelector('.vf-sidebar-bottom>a[data-vf-auth-logout]');return{labels:[...c.querySelectorAll('a')].map(x=>x.textContent.trim()),right:r.right,sidebarSettings:ss?getComputedStyle(ss).display:null,sidebarLogout:sl?getComputedStyle(sl).display:null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}})};
          const start=await inspect('start.php');if(start.labels.join('|')!=='设置|退出'||start.right<1260||start.right>1291.5||start.sidebarSettings!=='none'||start.sidebarLogout!=='none'||start.overflow>1)throw new Error('start '+JSON.stringify(start));
          const watch=await inspect('watch.php');if(watch.labels.join('|')!=='设置|退出'||watch.overflow>1)throw new Error('watch '+JSON.stringify(watch));
          const settings=await p.goto(base+'settings.php',{waitUntil:'networkidle'});if(settings.status()!==200)throw new Error('settings status '+settings.status());
          await p.goto(base+'watch.php',{waitUntil:'networkidle'});await p.click('[data-vf-auth-logout]');await p.waitForSelector('.vf-global-account-actions [data-vf-auth-login]',{timeout:15000});
          const mctx=await browser.newContext({viewport:{width:390,height:844}});const mp=await mctx.newPage();await mp.goto(base+'watch.php',{waitUntil:'networkidle'});const ma=await mp.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,login:!!document.querySelector('.vf-global-account-actions [data-vf-auth-login]')}));if(ma.overflow>1||!ma.login)throw new Error('mobile '+JSON.stringify(ma));
          console.log('P01_V2477_BROWSER='+JSON.stringify({anonymous:a,start,watch,mobile:ma}));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v2477-browser.log
          grep -F 'P01_V2477_BROWSER=' /tmp/p01-v2477-browser.log
          echo P01_V2477_INSTALL_SECURITY_UAUI=PASS

      - name: Final candidate verdict
        run: |
          set -Eeuo pipefail
          CANDIDATE_SHA=$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')
          echo "P01_V2477_CANDIDATE_SHA=$CANDIDATE_SHA"
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PENDING_ARTIFACT_GATE
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PENDING_ARTIFACT_GATE
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V2477_CANDIDATE_GATE=PASS
          echo FORMAL_RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v2477-server.pid; then kill "$(cat /tmp/p01-v2477-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v2477-*