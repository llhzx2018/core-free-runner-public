name: P04 Common Baseline V2 Authority Closure
on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p04-common-baseline-v2-authority-closure.yml'
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 0099218fa147c2645adf580958b695db556fa9e4
      RUNTIME_VERIFIED_SOURCE: 0099218fa147c2645adf580958b695db556fa9e4
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260828
      VERIFIED_AT: 2026-08-27T18:19:52Z
      RUN_ID: '33102840333'
      JOB_ID: '98624805744'
    steps:
      - name: Checkout exact P04 working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p04
      - name: Close V1 V2 authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p04
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.9'
          test ! -e docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('docs/authority')
          v1p=root/'VF_COMMON_PRODUCT_BASELINE_ADOPTION.json'
          cp=root/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json'
          currentp=root/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          v1=json.loads(v1p.read_text(encoding='utf-8'))
          cand=json.loads(cp.read_text(encoding='utf-8'))
          exact=os.environ['RUNTIME_VERIFIED_SOURCE']
          verified=os.environ['VERIFIED_AT']
          run_id=int(os.environ['RUN_ID']); job_id=int(os.environ['JOB_ID'])
          assert v1['state']=='CURRENT',v1
          assert cand['state']=='MACHINE_VERIFICATION_PENDING',cand
          assert cand['machine_verification']['state']=='PENDING',cand
          v1['state']='SUPERSEDED_BY_V2'
          v1['superseded_by']='docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          v1['superseded_at']=verified
          machine={
            'state':'PASS','run_id':run_id,'job_id':job_id,'exact_source_sha':exact,
            'php_runtime':'8.4.25','existing_v289_regression':'PASS','fresh_install':'PASS',
            'session_defaults':'PASS','periodic_session_rotation_removed':'PASS','atomic_step_up':'PASS',
            'resolver_pass_count':30,'resolver_exception_count':3,'resolver_drift_count':0,
            'resolver_unknown_count':0,'resolver_n_a_count':1,'system_surfaces':'PASS',
            'csp_console_errors':0,'page_errors':0,'bad_responses':0
          }
          cand['state']='VERIFIED_SUPERSEDED_BY_CURRENT'
          cand['machine_verification']=machine
          cand['superseded_by']='docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          cand['verified_at']=verified
          current={
            'schema':'vf-common-product-baseline-adoption/v2','state':'CURRENT',
            'project_id':'P04','project_name':'VF Infra','repository':'llhzx2018/vf-infra',
            'baseline_id':'VF-COMMON-PRODUCT-BASELINE@2.0','baseline_version':'2.0',
            'profile':'PERSONAL_SINGLE_ADMIN','authority_repository':'llhzx2018/gov-doc','authority_ref':'main',
            'assessed_base_sha':cand['assessed_base_sha'],'runtime_verified_source_sha':exact,
            'runtime_resolver':cand['runtime_resolver'],'baseline_surface':cand['baseline_surface'],
            'system_info_surface':cand['system_info_surface'],'machine_verification':{
              'state':'PASS','run_id':run_id,'job_id':job_id,'exact_source_sha':exact,'php_runtime':'8.4.25',
              'existing_v289_regression':'PASS','fresh_install':'PASS','session_defaults':'PASS',
              'periodic_session_rotation_removed':'PASS','atomic_step_up':'PASS','system_surfaces':'PASS',
              'csp_surface_contract':'PASS','resolver':{
                'pass_count':30,'exception_count':3,'drift_count':0,'unknown_count':0,'n_a_count':1,'full_pass':True
              }
            },
            'conditional_existing_install_exception':cand['conditional_existing_install_exception'],
            'explicit_exceptions':cand['explicit_exceptions'],
            'adoption_semantics':'RUNTIME_DERIVED / READ_ONLY_SYSTEM_BASELINE / NO_SHADOW_TRUTH / EXPLICIT_EXCEPTION_PRESERVED',
            'version_changed':False,'schema_changed':False,'release_executed':False,'production_changed':False,
            'verified_at':verified
          }
          for path,data in ((v1p,v1),(cp,cand),(currentp,current)):
            path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          python3 - <<'PY'
          import json,pathlib,os
          r=pathlib.Path('docs/authority')
          v1=json.loads((r/'VF_COMMON_PRODUCT_BASELINE_ADOPTION.json').read_text())
          c=json.loads((r/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json').read_text())
          v2=json.loads((r/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json').read_text())
          exact=os.environ['RUNTIME_VERIFIED_SOURCE']
          assert v1['state']=='SUPERSEDED_BY_V2'
          assert c['state']=='VERIFIED_SUPERSEDED_BY_CURRENT' and c['machine_verification']['state']=='PASS'
          assert c['machine_verification']['exact_source_sha']==exact
          assert v2['state']=='CURRENT' and v2['runtime_verified_source_sha']==exact
          assert v2['machine_verification']['resolver']=={'pass_count':30,'exception_count':3,'drift_count':0,'unknown_count':0,'n_a_count':1,'full_pass':True}
          assert v2['version_changed'] is False and v2['schema_changed'] is False
          print('P04_V2_AUTHORITY_STATIC=PASS')
          PY
          test -z "$(git diff --name-only "$EXPECTED_HEAD" -- VERSION database)"
          mapfile -t changed < <(git status --short | sed 's/^...//')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | sort | diff -u - <(printf '%s\n' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json | sort)
      - name: Commit authority closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p04
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          git diff --cached --quiet && { echo P04_AUTHORITY_NO_CHANGES; exit 2; }
          git commit -m 'docs(P04): close Common Product Baseline V2 authority [release:no][production:no]'
          git push origin HEAD:$TARGET_BRANCH
          echo P04_V2_AUTHORITY_HEAD=$(git rev-parse HEAD)
