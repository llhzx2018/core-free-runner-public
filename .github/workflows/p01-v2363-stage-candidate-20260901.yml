name: P01 V2.36.3 Stage Candidate
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-stage-candidate-20260901.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.3-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Stage exact V2.36.3 versioned candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '0b2890fed3153086be1c77fe2a3f119264dc24a2'
          python3 - <<'PY'
          from pathlib import Path
          import json

          Path('VERSION').write_text('2.36.3\n')
          Path('src/VERSION.txt').write_text('2.36.3\n')

          b=Path('src/app/bootstrap.php')
          t=b.read_text()
          t2=t.replace("define('VF_VERSION', '2.36.2');","define('VF_VERSION', '2.36.3');",1)
          if t2==t: raise SystemExit('VF_VERSION source drift')
          b.write_text(t2)

          c=Path('CHANGELOG.md')
          old=c.read_text()
          block='''## V2.36.3 · Patch Release Candidate · 2026-09-01\n\n- 修复 V2.36.2 的 P0 双前台回归：匿名与登录用户统一进入同一个 Functional Workspace；登录只改变数据可见性与管理能力，不再切换到旧 Public Navigator。\n- `index.php` 成为统一 canonical frontend entry；`start.php` 仅作为兼容入口；导航 / 频道 / 影视 / 专题保持同一全局域导航。\n- 保留公开 Start 的 title / description / canonical / OpenGraph / JSON-LD，并保持 Start 与各 Surface HTML 的 CSP 安全基线。\n- 一并收录已验证的共享 sticky 筛选条修复：背景改为不透明 `var(--ws-bg)`，桌面移除 8px 漏缝，避免滚动内容从筛选条下穿透。\n- ONE FRONTEND R3：Run `33499913594` PASS / Artifact `9797277341`；390 + 1440 匿名 → 登录 → Home/Start/Channels/Watch/Topics → 退出同壳 PASS。\n- Sticky Fix Gate：Run `33491546225` PASS；四域 390 + 1440 mid/deep scroll、SQLite/FK、无横向溢出 PASS。\n- Schema 保持 `2026082901`，无 Migration；不修改 Owner 数据。\n- Candidate 版本推进为 `2.36.3`；在后续 Release Gate 通过前不修改 `main` / Tag / GitHub Release / core-updates / Owner Production。\n\n'''
          if not old.startswith('## V2.36.3 · Patch Release Candidate'):
              c.write_text(block+old)

          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text())
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          pub=d.get('published_release') or {}
          if pub.get('version')!='2.36.2' or pub.get('release_source')!='4fd25a5ce4383dc456e755fc2e031a861d6ff655':
              raise SystemExit('published V2.36.2 authority drift')

          d['status']='V2.36.2 OWNER PRODUCTION / KNOWN P0 DUAL-SHELL DEFECT / V2.36.3 CANDIDATE PREP'
          d['production_version']='2.36.2'
          d['working_version']='2.36.3'
          d['target_release_version']='2.36.3'
          d['current_phase']='V2.36.3 VERSIONED PATCH CANDIDATE / READINESS PENDING'
          d['candidate_version']='2.36.3'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='VERSIONED PATCH CANDIDATE / READINESS PENDING'
          d['formal_release_state']='V2.36.2 PUBLISHED + OWNER INSTALLED / KNOWN P0 DEFECT / V2.36.3 NOT YET RELEASED'
          d['develop_state']='V2.36.3 PATCH SOURCE PREPARED / READINESS PENDING / NOT RELEASED'
          d['current_authority']='Owner Production V2.36.2 / Published Latest V2.36.2 / V2.36.2 has known P0 dual-shell defect / ONE FRONTEND correction + sticky fix merged to develop / V2.36.3 candidate prepared'
          d['next_action']='Run V2.36.3 Candidate Readiness on exact versioned source. Do not promote main, publish Tag/Release, mutate core-updates or write Owner Production before subsequent gates pass.'

          production=dict(pub)
          production['core_updates_commit']='3ddf344872744ba4e9e407c99fe704b90a4cda97'
          production['release_state']='PUBLISHED / OWNER INSTALLED / PRODUCT CLOSURE BLOCKED BY KNOWN P0 DUAL-SHELL DEFECT'
          production['assistant_production_write']=False
          production['owner_production_runtime']='2.36.2'
          production['owner_production_schema']='2026082901'
          production['owner_production_upgrade']='2.36.1 -> 2.36.2 / SUCCESS'
          production['owner_version_readback']='Current V2.36.2 / Latest V2.36.2 / history 2.36.1 -> 2.36.2 success'
          production['owner_browser_footer_readback']='V2.36.2 / PASS'
          production['owner_terminal_ui_last_check']='2026-09-01 18:12:28'
          production['production_closure']='BLOCKED / KNOWN P0 DUAL-SHELL DEFECT'
          d['production_release']=production

          pub['live_core_updates_commit']='3ddf344872744ba4e9e407c99fe704b90a4cda97'
          pub['live_online_next_hop']='2.36.2 / OWNER CURRENT / NO NEWER PATCH YET'
          pub['manifest_candidate_state']='PROMOTED / OWNER UPGRADED TO V2.36.2'
          pub['release_state']='PUBLISHED / OWNER INSTALLED / KNOWN P0 DUAL-SHELL DEFECT'
          d['published_release']=pub

          d['current_change']={
            'change_id':'P01-V2363-ONE-FRONTEND-P0-PATCH-20260901',
            'type':'PATCH RELEASE / P0 PRODUCT ARCHITECTURE BUG + SHARED UX BUG',
            'base_develop':'0b2890fed3153086be1c77fe2a3f119264dc24a2',
            'result':'VERSIONED CANDIDATE PREPARED / READINESS PENDING / NOT RELEASED',
            'scope':['src/app/FunctionalWorkspace.php','src/index.php','src/start.php','src/surface.php','src/assets/workspace-domain-nav.css'],
            'schema_change':False,
            'migration':None,
            'version_change':True,
            'one_frontend_product_pr':179,
            'one_frontend_product_merge':'14f45785074cd456989c07210a426075cd0fbb66',
            'one_frontend_r3_run':33499913594,
            'one_frontend_r3_artifact':9797277341,
            'one_frontend_r3_artifact_sha256':'1c4222918553f10128f53aac296144f485d342072b243a3d8000c881e655c519',
            'sticky_product_pr':176,
            'sticky_product_merge':'bd7f08b3fde91e4a20b0970deb5fec325e869159',
            'sticky_fix_gate':33491546225,
            'authority_pr':180,
            'authority_merge':'0b2890fed3153086be1c77fe2a3f119264dc24a2',
            'main_write':False,
            'production_write':False,
            'runner_main_write':False
          }

          d['v2_36_3_release_candidate']={
            'base_develop':'0b2890fed3153086be1c77fe2a3f119264dc24a2',
            'version':'2.36.3',
            'production_version':'2.36.2',
            'published_predecessor_version':'2.36.2',
            'predecessor_tag':'v2.36.2',
            'predecessor_source':'4fd25a5ce4383dc456e755fc2e031a861d6ff655',
            'schema_version':'2026082901',
            'schema_change':False,
            'migration':None,
            'scope':'PATCH / ONE FRONTEND P0 CORRECTION + SHARED STICKY OVERLAP FIX',
            'one_frontend_product_pr':179,
            'one_frontend_product_merge':'14f45785074cd456989c07210a426075cd0fbb66',
            'one_frontend_gate':33499913594,
            'one_frontend_artifact':9797277341,
            'sticky_product_pr':176,
            'sticky_product_merge':'bd7f08b3fde91e4a20b0970deb5fec325e869159',
            'sticky_gate':33491546225,
            'state':'VERSIONED PATCH CANDIDATE PREPARATION / NOT RELEASED',
            'main_write':False,
            'core_updates_write':False,
            'owner_production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 5
          printf '%s\n' "${changed[@]}" | sort >/tmp/actual
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(cat VERSION)" = '2.36.3'
          test "$(cat src/VERSION.txt)" = '2.36.3'
          grep -Fx "define('VF_VERSION', '2.36.3');" src/app/bootstrap.php >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.36.3 patch candidate'
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo "CANDIDATE_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.3-formal-source-20260901
