name: TEMP S01 Pre-Release Runtime Trace

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902

permissions:
  contents: read

concurrency:
  group: temp-s01-release-prep-trace-20260902
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_owner
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_SHA: 9a486f5a3431bb0777b722e0c0bb2954a1278c46
      M3U8_SHA: a51bf0bfbd0cacf9479bf8ee734398d94fba9b4f
      M3U8_LEGACY_SHA: 2e636cf580b77116c02048b19b36894b0295851b
      THEME_SHA: a293009567c932310d19a310a8ea6361a2ef71c8
      WP_VERSION: 7.0.2
      WP_PATH: /tmp/vf-s01-owner-wp
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: owner
      EVIDENCE_DIR: /tmp/vf-s01-pre-release-trace
    steps:
      - name: Checkout proven runner harness snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5534828d9070b5c9a6f171a50a115ef4b7ddca6c
          fetch-depth: 1
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops release-prep source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9a486f5a3431bb0777b722e0c0bb2954a1278c46
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Checkout exact M3U8 release-prep source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a51bf0bfbd0cacf9479bf8ee734398d94fba9b4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8
      - name: Checkout exact legacy M3U8 migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 2e636cf580b77116c02048b19b36894b0295851b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8-legacy
      - name: Checkout exact Theme source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a293009567c932310d19a310a8ea6361a2ef71c8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: theme
      - name: Patch proven harness expectations in workspace only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path('runner/scripts/temp-s01-c02-owner-runtime-v2.sh')
          s=runtime.read_text()
          s=s.replace('1.21.791','1.21.792').replace('1.25.3','1.25.4')
          legacy="test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.4'"
          s=s.replace(legacy,"test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.3'",1)
          s=s.replace(r'1\.21\.791',r'1\.21\.792').replace(r'1\.25\.3',r'1\.25\.4')
          runtime.write_text(s)
          browser=Path('runner/scripts/temp-s01-c02-owner-browser-v2.js')
          b=browser.read_text().replace("fresh.ops === '1.21.791'","fresh.ops === '1.21.792'").replace("fresh.m3u8 === '1.25.3'","fresh.m3u8 === '1.25.4'")
          browser.write_text(b)
          PY
      - name: Trace isolated WordPress release candidate gate
        shell: bash
        run: bash -x runner/scripts/temp-s01-c02-owner-runtime-v2.sh
      - name: Upload trace evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-pre-release-trace-${{ github.run_id }}
          path: /tmp/vf-s01-pre-release-trace/
          if-no-files-found: warn
          retention-days: 7
