# Owner 2026-11-14 authorized only M01/M02 official distribution. No Owner VPS writes.
name: P07 M01 M02 UX2 official Toolbox release assets and isolated upgrade
on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'tests/test_p07_m01_m02_ux2_distribution.py'
      - 'tests/p07_m01_m02_ux2_official_distribution_gate.py'
      - 'docs/ux-reviews/p07-m01-m02-original-ux2-formal-toolbox.json'
      - '.github/workflows/p07-m01-m02-ux2-public-toolbox-final-gate.yml'
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-m01-m02-ux2-public-toolbox-final-gate.yml'
permissions:
  contents: read
  actions: read
jobs:
  official-m01-m02-toolbox:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OFFICIAL_TAG: p07-m01-m02-v0.1.0-original-ux2-20261114
      OFFICIAL_M01_SHA: c689f35182da90200c7f12dffa1108c76cc22e394699261b5f4c0366017191ce
      OFFICIAL_M02_SHA: 18a7a7dc401772fda7344845b952bc307a46f05443d086ec5e38a1954308587d
    steps:
      - name: Checkout exact reviewed public Toolbox and all prior release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert only authorized M01 M02 pin/update paths changed
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_m02_ux2_distribution.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_m02_original_versions.py' -q
          test "$(grep '^M05_BUILD_EXPECTED=' installers/p07-toolbox.sh)" = 'M05_BUILD_EXPECTED="0.1.0-m05-official-db-choice-ux6"'
          test "$(grep '^VF_SERVER_OPS_BUILD_EXPECTED=' installers/p07-toolbox.sh)" = 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release136"'
          test "$(grep '^VF_NODE_EXPECTED=' installers/p07-toolbox.sh)" = 'VF_NODE_EXPECTED="0.1.0-ux2"'
          test "$(grep '^VPS_AUDIT_BUILD_EXPECTED=' installers/p07-toolbox.sh)" = 'VPS_AUDIT_BUILD_EXPECTED="2.1.1-ux2"'
          test "$(git show 'b0fb4c253958de46c4fc207f8872af9b78b77ab0:installers/p07-vf-node-independent-ux2-candidate.sh' | git hash-object --stdin)" = 0919751da9038b6db51a88c7052195becc152e32
          (cd packages/p07-network-node/0.1.0-ux2 && sha256sum -c MANIFEST.sha256)
          echo P07_M01_M02_OFFICIAL_TOOLBOX_SOURCE_IDENTITY=PASS
      - name: Check REAL official GitHub Release assets and independent SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repo='llhzx2018/core-free-runner-public'
          if ! gh release view "$OFFICIAL_TAG" -R "$repo" >/dev/null 2>&1; then
            echo P07_M01_M02_OFFICIAL_RELEASE_NOT_YET_VISIBLE
            gh api "repos/$repo/actions/workflows/p07-m01-m02-original-ux2-formal-publish.yml/runs?branch=main&per_page=5" \
              --jq '.workflow_runs[]|"\(.id) \(.head_sha) \(.status) \(.conclusion)"' || true
            exit 78
          fi
          test "$(gh api "repos/$repo/releases/tags/$OFFICIAL_TAG" --jq '.assets|length')" = 4
          test "$(gh api "repos/$repo/git/ref/tags/$OFFICIAL_TAG" --jq '.object.sha')" = 8f4b307a16fa84ed23c895641a823d75e0f89e69
          dir="$RUNNER_TEMP/p07-m01-m02-official"
          mkdir -p "$dir"
          gh release download "$OFFICIAL_TAG" -R "$repo" --dir "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          test "$(sha256sum "$dir/P07-M01-0.1.0-ux2.zip" | cut -d' ' -f1)" = "$OFFICIAL_M01_SHA"
          test "$(sha256sum "$dir/P07-M02-2.1.1-ux2.sh" | cut -d' ' -f1)" = "$OFFICIAL_M02_SHA"
          python3 - "$dir" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest=json.loads((root/"P07-M01-M02-UX2-RELEASE.json").read_text(encoding="utf-8"))
          assert manifest["tag"]=="p07-m01-m02-v0.1.0-original-ux2-20261114"
          assert manifest["public_source_sha"]=="b0fb4c253958de46c4fc207f8872af9b78b77ab0"
          assert manifest["other_modules"]=="P07-M03/M04/M05 UNTOUCHED"
          with zipfile.ZipFile(root/"P07-M01-0.1.0-ux2.zip") as z:
              assert len(z.namelist())==11
              for info in z.infolist():
                  assert not info.is_dir() and ".." not in Path(info.filename).parts
              assert z.read("p07-m01/MANIFEST.sha256")==Path("packages/p07-network-node/0.1.0-ux2/MANIFEST.sha256").read_bytes()
              assert z.read("p07-m01/vf-node.sh")==Path("packages/p07-network-node/0.1.0-ux2/vf-node.sh").read_bytes()
          assert (root/"P07-M02-2.1.1-ux2.sh").read_bytes()==Path("experiments/p07-vps-audit-v21-ux2.sh").read_bytes()
          print("P07_M01_M02_REAL_OFFICIAL_RELEASE_ASSET_BYTES=PASS")
          PY
          echo P07_M01_M02_RELEASE_TAG_AND_REMOTE_SHA256=PASS
      - name: Exercise EXACT official public Toolbox UX1 to UX2 real TTY, rollback and reapply
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e /opt/vfops-modules
          sudo -n env GITHUB_ACTIONS=true P07_UX2_DISPOSABLE_RUNNER=YES PATH="$PATH" \
            python3 -B tests/p07_m01_m02_ux2_official_distribution_gate.py
          echo P07_M01_M02_OFFICIAL_TOOLBOX_REAL_ATOMIC_AND_ROLLBACK=PASS
          echo P07_M03_M04_M05_RUNTIME=UNCHANGED
      - name: Verify public main bytes only after distribution merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'P07 M01 M02 UX2 public toolbox distribute')
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' \
            -o "$RUNNER_TEMP/p07-owner-final-toolbox.sh"
          cmp "$RUNNER_TEMP/p07-owner-final-toolbox.sh" installers/p07-toolbox.sh
          echo P07_M01_M02_OFFICIAL_PUBLIC_OWNER_TOOLBOX_MAIN_BYTES=PASS
          echo P07_FORMAL_DISTRIBUTION=PASS
          echo P07_PRODUCTION_MIGRATION_DNS=NOT_RUN
      - name: Remove isolated test artifacts
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$RUNNER_TEMP/p07-m01-m02-official" "$RUNNER_TEMP/p07-owner-final-toolbox.sh"
          echo P07_OWNER_VPS_PRODUCTION_DNS_MIGRATION=NOT_RUN
