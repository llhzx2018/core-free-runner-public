name: P08 0.1.1 One-off Official Release - SHA256 verified and Owner manual Production
on:
  push:
    branches: [release/p08-v011-official-20261113]
permissions:
  contents: read
concurrency:
  group: p08-v011-formal-release-one-case
  cancel-in-progress: false
jobs:
  formal-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.ref == 'refs/heads/release/p08-v011-official-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact private VF AdOps main with runtime READ token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: main
          path: source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout current shared GOV-DOC rules (no publication rights)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring,ctype,dom,xml,zip,curl,sodium,pdo_sqlite,pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Formal source, governance, bridge, negative-test and old-site scope gate
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(cat VERSION)" = 0.1.1
          git merge-base --is-ancestor dd1ad4d881ae232ec5e817d05402ce1753b640e7 HEAD
          git cat-file -e 55ecbc8461a4d90fe7241a00caffa55e557cde1c^{commit}
          grep -Fq '| skill-release | V3.10 |' ../gov/CURRENT.md
          grep -Fq '### Mode K · ONE_CASE_P08_ADOPS_011_P01_P02_SHA256' ../gov/skills/skill-release/V3.10/SKILL.md
          python3 scripts/check_stack_contract.py --phase foundation
          python3 -m unittest tests.test_stack_contract tests.test_full_builder -q
          python3 scripts/check_bridge_runtime_parity.py
          python3 tests/test_bridge_runtime_parity.py
          php tests/test_github_stable_release_gate.php
          php tests/test_owner_upgrade_preparation.php
          php tests/test_owner_upgrade_job.php
          php tests/test_official_github_sha256_job.php
          echo P08_FORMAL_011_SOURCE_AND_NEGATIVES=PASS
      - name: Real twice-built Bridge FULL, 0.1.1 FULL, Atomic bytes and source-gate tests
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          A="$RUNNER_TEMP/p08-011-artifacts"
          B="$RUNNER_TEMP/p08-011-second-build"
          python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha 9c7f76434fe2d064f2f1ac15c58a760f778cf055 --output-dir "$A"
          python3 scripts/verify_owner_atomic_pair.py "$A" dd1ad4d881ae232ec5e817d05402ce1753b640e7 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha 9c7f76434fe2d064f2f1ac15c58a760f778cf055 --output-dir "$B"
          python3 scripts/verify_owner_atomic_pair.py "$B" dd1ad4d881ae232ec5e817d05402ce1753b640e7 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          for name in VF_AdOps_V0.1.0_BRIDGE_FULL.zip VF_AdOps_V0.1.1_FULL.zip VF_AdOps_V0.1.1_UPDATE.zip; do
            cmp "$A/$name" "$B/$name"
          done
          # Python test/build bytecode may leave ephemeral untracked files.
          # Clean only this disposable checkout; never touch any real owner site.
          git diff --quiet && git diff --cached --quiet
          git clean -fd -q
          test -z "$(git status --porcelain --untracked-files=all)"
          # -B is essential: importing build_full itself creates new Python bytecode
          # and invalidates the canonical zero-dirty-source check.
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_full import verify_canonical_full_contract
          src=Path.cwd()
          out=Path(os.environ["RUNNER_TEMP"])/"p08-011-artifacts"/"VF_AdOps_V0.1.1_FULL.zip"
          gov=src.parent/"gov"
          verify_canonical_full_contract(src,out,"9c7f76434fe2d064f2f1ac15c58a760f778cf055",gov,"resolve")
          verify_canonical_full_contract(src,out,"9c7f76434fe2d064f2f1ac15c58a760f778cf055",gov,"delivery")
          PY
          echo P08_FORMAL_011_DOUBLE_BUILD_AND_PUBLIC_AUTHORITY=PASS
      - name: Genuine old 0.1.0 flat install source provenance, no migration
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          OLD="$RUNNER_TEMP/p08-011-original-flat-src"
          mkdir "$OLD"
          git archive --format=tar 55ecbc8461a4d90fe7241a00caffa55e557cde1c | tar -xf - -C "$OLD"
          test "$(cat "$OLD/VERSION")" = 0.1.0
          (
            cd "$OLD"
            composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
            npm ci --no-audit --no-fund >/dev/null
            npm run build >/dev/null
          )
          python3 "$OLD/scripts/build_full.py" --source "$OLD" --output "$RUNNER_TEMP/p08-011-old-flat.zip" --version 0.1.0 --source-sha 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          echo P08_FORMAL_011_REAL_PREDECESSOR=PASS
      - name: Create immutable source and SHA256 manifests from actual ZIP bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, json, hashlib, zipfile
          temp=Path(os.environ['RUNNER_TEMP'])
          art=temp/'p08-011-artifacts'
          names=['VF_AdOps_V0.1.0_BRIDGE_FULL.zip','VF_AdOps_V0.1.1_FULL.zip','VF_AdOps_V0.1.1_UPDATE.zip']
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def inner(p,key):
              with zipfile.ZipFile(p) as z: return hashlib.sha256(z.read(key)).hexdigest()
          files={n:{'bytes':(art/n).stat().st_size,'sha256':sha(art/n)} for n in names}
          meta={'type':'P08_OFFICIAL_GITHUB_SHA256_RELEASE_PROVENANCE_V1','project_id':'P08','repository':'llhzx2018/vf-adops','tag':'v0.1.1','version':'0.1.1',
             'flat_source_sha':'55ecbc8461a4d90fe7241a00caffa55e557cde1c',
             'flat_full_manifest_sha256':inner(temp/'p08-011-old-flat.zip','FULL_MANIFEST.json'),
             'bridge_source_sha':'dd1ad4d881ae232ec5e817d05402ce1753b640e7',
             'bridge_full_manifest_sha256':inner(art/names[0],'FULL_MANIFEST.json'),
             'target_source_sha':'9c7f76434fe2d064f2f1ac15c58a760f778cf055',
             'target_full_manifest_sha256':inner(art/names[1],'FULL_MANIFEST.json'),
             'schema_changes':False,'signature_required':False,
             'integrity_model':'official-github-release+exact-asset-bytes+sha256',
             'owner_manual_bridge_required':True,'production_auto_apply':False,'artifacts':files}
          (art/'RELEASE_PROVENANCE.json').write_text(json.dumps(meta,sort_keys=True,ensure_ascii=False,indent=2)+'\n')
          with (art/'SHA256SUMS').open('w') as out:
              for n in [*names,'RELEASE_PROVENANCE.json']:out.write(sha(art/n)+'  '+n+'\n')
          assert all(x['bytes']>1024 and len(x['sha256'])==64 for x in files.values())
          print('P08_FORMAL_RELEASE_PROVENANCE_AND_SUMS=PASS')
          PY
          cd "$RUNNER_TEMP/p08-011-artifacts"
          sha256sum -c SHA256SUMS
      - name: Credential capability preflight and prevent existing Release collisions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P08_RELEASE_WRITE_SECRET_MISSING; exit 11; }
          gh api repos/llhzx2018/vf-adops --jq '.full_name' | grep -Fx llhzx2018/vf-adops
          gh api repos/llhzx2018/core-updates --jq '.full_name' | grep -Fx llhzx2018/core-updates
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          if gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.1 >/dev/null 2>&1; then
            echo P08_OFFICIAL_RELEASE_ALREADY_EXISTS_REFUSE_TO_CLOBBER
            exit 12
          fi
          if gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main >/dev/null 2>&1; then
            echo P08_STABLE_ADOPS_CHANNEL_ALREADY_EXISTS_REFUSE_TO_OVERWRITE
            exit 13
          fi
          if gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 >/dev/null 2>&1; then
            test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          fi
          echo P08_FORMAL_WRITE_CAPABILITY_PREFLIGHT=PASS
      - name: Create source-locked official GitHub tag and DRAFT Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG=v0.1.1
          REPO=llhzx2018/vf-adops
          ART="$RUNNER_TEMP/p08-011-artifacts"
          if ! gh api repos/$REPO/git/ref/tags/$TAG >/dev/null 2>&1; then
            gh api -X POST repos/$REPO/git/refs -f ref=refs/tags/$TAG -f sha=9c7f76434fe2d064f2f1ac15c58a760f778cf055 >/dev/null
          fi
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          cat > "$RUNNER_TEMP/p08-011-release-notes.md" <<'EOF'
          # VF AdOps 0.1.1
          正式发行：独立安装的 Laravel 13 + Vue 3 系统；可选 MariaDB、MySQL、SQLite 和 GitHub 只读更新 Token。
          升级：P01/P02 式独立更新频道 + 官方 GitHub Release SHA-256 + 私有备份 + Atomic + 回滚，无需另外设置 Ed25519。
          - VF_AdOps_V0.1.1_FULL.zip：仅供全新空站首次安装，禁止覆盖已安装网站。
          - VF_AdOps_V0.1.0_BRIDGE_FULL.zip：仅供经过来源核对、停写和备份的旧 0.1.0 站点由 Owner 手工离线安全启用。
          - VF_AdOps_V0.1.1_UPDATE.zip：只供完成 0.1.0 Bridge 的后台 Owner 点击原子升级，禁止直接上传覆盖旧 flat 安装。
          - SHA256SUMS、RELEASE_PROVENANCE.json：官方包与源码身份校验。
          已有安装数据、数据库和密钥绝不自动清空。此次仅 GitHub 正式发布与更新频道；Production 保持 Owner 手工操作。
          EOF
          gh release create "$TAG" "$ART/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" "$ART/VF_AdOps_V0.1.1_FULL.zip" "$ART/VF_AdOps_V0.1.1_UPDATE.zip" "$ART/SHA256SUMS" "$ART/RELEASE_PROVENANCE.json" -R "$REPO" --title "VF AdOps v0.1.1" --notes-file "$RUNNER_TEMP/p08-011-release-notes.md" --verify-tag --draft
          gh api repos/$REPO/releases/tags/$TAG > "$RUNNER_TEMP/p08-011-draft-release.json"
          jq -e '.draft==true and .prerelease==false and (.assets|length)==5' "$RUNNER_TEMP/p08-011-draft-release.json" >/dev/null
          echo P08_OFFICIAL_TAG_DRAFT_AND_FIVE_ASSETS=PASS
      - name: Independently download GitHub Release assets and check exact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REM="$RUNNER_TEMP/p08-011-remote"
          mkdir "$REM"
          gh release download v0.1.1 -R llhzx2018/vf-adops -D "$REM" -p '*.zip' -p 'SHA256SUMS' -p 'RELEASE_PROVENANCE.json'
          cd "$REM"
          sha256sum -c SHA256SUMS
          cmp SHA256SUMS "$RUNNER_TEMP/p08-011-artifacts/SHA256SUMS"
          cmp RELEASE_PROVENANCE.json "$RUNNER_TEMP/p08-011-artifacts/RELEASE_PROVENANCE.json"
          for f in *.zip; do cmp "$f" "$RUNNER_TEMP/p08-011-artifacts/$f"; done
          echo P08_FORMAL_OFFICIAL_REMOTE_ASSET_BYTES_SHA256=PASS
      - name: Publish official Release and prepare exact live channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release edit v0.1.1 -R llhzx2018/vf-adops --draft=false --prerelease=false
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.1 > "$RUNNER_TEMP/p08-011-published-release.json"
          jq -e '.draft==false and .prerelease==false and (.assets|length)==5' "$RUNNER_TEMP/p08-011-published-release.json" >/dev/null
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          meta=json.loads((tmp/'p08-011-artifacts/RELEASE_PROVENANCE.json').read_text())
          release=json.loads((tmp/'p08-011-published-release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          names=meta['artifacts']
          for name, expected in names.items():
              actual=assets[name]
              assert actual['state']=='uploaded' and actual['size']==expected['bytes']
              assert actual['content_type']=='application/zip'
              assert actual['digest']=='sha256:'+expected['sha256']
          update='VF_AdOps_V0.1.1_UPDATE.zip'
          full='VF_AdOps_V0.1.1_FULL.zip'
          channel={
           'schema_version':'1.0','project_id':'P08','component_id':'APP',
           'repository':'llhzx2018/vf-adops','project_slug':'vf-adops',
           'enabled':True,'update_type':'ATOMIC','channel':'stable',
           'backup_required':True,'rollback_supported':True,
           'signature_required':False,'signature_algorithm':None,
           'from_versions':['0.1.0'],'target_version':'0.1.1',
           'flat_source_sha':meta['flat_source_sha'],
           'flat_full_manifest_sha256':meta['flat_full_manifest_sha256'],
           'source_sha':meta['bridge_source_sha'],
           'source_full_manifest_sha256':meta['bridge_full_manifest_sha256'],
           'target_sha':meta['target_source_sha'],'asset_sha256':names[update]['sha256'],
           'schema_from':'1.0','schema_to':'1.0','release_tag':'v0.1.1',
           'release_id':release['id'],
           'asset_name':update,'asset_bytes':names[update]['bytes'],
           'full_asset_id':assets[full]['id'],'full_asset_sha256':names[full]['sha256'],
           'minimum_php':'8.4.1','production_auto_apply':False,
           'owner_bridge_activation':'MANUAL_OFFLINE_BACKUP_FIRST',
           'notes':'VF AdOps 0.1.1 正式发行；旧 flat 0.1.0 必须先手工停写、备份和精确来源核对后安全启用 Bridge；新版 FULL 仅供新建空站，正式站 Owner 手动点击 Atomic，不自动生产升级。'
          }
          (tmp/'p08-011-channel.json').write_text(json.dumps(channel,ensure_ascii=False,indent=2)+'\n')
          print('P08_FINAL_OFFICIAL_RELEASE_AND_CHANNEL_METADATA=PASS')
          PY
          php -r '
          require "source/src/Upgrade/GitHubStableReleaseGate.php";
          $m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $r=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);
          $g=new VF\AdOps\Upgrade\GitHubStableReleaseGate();
          $v=$g->validate($m,$r,"0.1.0",$m["flat_source_sha"],$m["flat_full_manifest_sha256"]);
          if(($v["status"]??"")!=="RELEASE_METADATA_VERIFIED_PACKAGE_NOT_DOWNLOADED")exit(16);
          $g->validateDownloadedArchive($v,$argv[3]);
          echo "P08_OFFICIAL_CHANNEL_AND_DOWNLOADED_ARCHIVE_GATE=PASS\n";
          ' "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-published-release.json" "$RUNNER_TEMP/p08-011-remote/VF_AdOps_V0.1.1_UPDATE.zip"
      - name: Distribute only new P08-ADOPS stable channel, never legacy P08.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO=llhzx2018/core-updates
          FILE=projects/P08-ADOPS.json
          if gh api "repos/$REPO/contents/$FILE?ref=main" >/dev/null 2>&1; then
            echo P08_CHANNEL_COLLISION_REFUSED
            exit 18
          fi
          jq -n --arg text "$(base64 -w 0 "$RUNNER_TEMP/p08-011-channel.json")"             '{message:"release(p08): publish official v0.1.1 stable SHA256 Atomic channel",content:$text,branch:"main"}' > "$RUNNER_TEMP/p08-011-channel-write.json"
          gh api -X PUT "repos/$REPO/contents/$FILE" --input "$RUNNER_TEMP/p08-011-channel-write.json" > "$RUNNER_TEMP/p08-011-channel-write-response.json"
          test "$(jq -r '.content.path' "$RUNNER_TEMP/p08-011-channel-write-response.json")" = "$FILE"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/$FILE?ref=main" > "$RUNNER_TEMP/p08-011-channel-readback.json"
          cmp "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-channel-readback.json"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          echo P08_011_FORMAL_RELEASE_ASSETS_AND_STABLE_DISTRIBUTION=PASS
          echo P08_011_PRODUCTION_AUTO_APPLY=NO
      - name: Clean all ephemeral private source, credentials and artifact copies
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf source gov "$RUNNER_TEMP/p08-011-artifacts" "$RUNNER_TEMP/p08-011-second-build" "$RUNNER_TEMP/p08-011-original-flat-src" "$RUNNER_TEMP/p08-011-remote"
          rm -f "$RUNNER_TEMP/p08-011-old-flat.zip" "$RUNNER_TEMP/p08-011-release-notes.md" "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-channel-write.json" "$RUNNER_TEMP/p08-011-channel-readback.json" "$RUNNER_TEMP/p08-011-channel-write-response.json" "$RUNNER_TEMP/p08-011-draft-release.json" "$RUNNER_TEMP/p08-011-published-release.json"
          echo P08_FORMAL_PUBLIC_RUNNER_PRIVATE_SOURCE_AND_ARTIFACT_PERSISTENCE=NO
