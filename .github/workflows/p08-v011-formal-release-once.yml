name: P08 0.1.1 Finalize exact SHA256-verified DRAFT and independent stable channel
on:
  push:
    branches: [release/p08-v011-official-20261113]
permissions:
  contents: read
concurrency:
  group: p08-v011-formal-release-one-case
  cancel-in-progress: false
jobs:
  finalize-draft-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.ref == 'refs/heads/release/p08-v011-official-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: main
          path: source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          path: gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip,curl,mbstring,pdo_sqlite,pdo_mysql
      - name: Confirm exact approved main, Mode K, draft ID, tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          grep -Fq '| skill-release | V3.10 |' gov/CURRENT.md
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          if gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main >/dev/null 2>&1; then
            echo P08_FINALIZE_EXISTING_DISTRIBUTION_REFUSED
            exit 12
          fi
          gh api repos/llhzx2018/vf-adops/releases/444076625 > "$RUNNER_TEMP/p08-011-draft.json"
          jq -e '.id==444076625 and .tag_name=="v0.1.1" and .draft==true and .prerelease==false and (.assets|length)==5' "$RUNNER_TEMP/p08-011-draft.json" >/dev/null
          echo P08_OFFICIAL_DRAFT_ID_TAG_SOURCE_CHANNEL_PREFLIGHT=PASS
      - name: Independently download every exact asset via private GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p08-011-remote-assets"
          mkdir -m 700 "$OUT"
          for name in VF_AdOps_V0.1.0_BRIDGE_FULL.zip VF_AdOps_V0.1.1_FULL.zip VF_AdOps_V0.1.1_UPDATE.zip RELEASE_PROVENANCE.json SHA256SUMS; do
            id="$(jq -er --arg name "$name" '.assets[] | select(.name==$name) | .id' "$RUNNER_TEMP/p08-011-draft.json")"
            curl -fsSL --retry 2 -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" -o "$OUT/$name"
          done
          echo P08_DRAFT_ALL_FIVE_REMOTE_ASSETS_DOWNLOADED=PASS
      - name: Release ZIP byte identity, source, code-only schema, and SHA256 negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import os, hashlib, json, zipfile, subprocess
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          root=t/'p08-011-remote-assets'
          release=json.loads((t/'p08-011-draft.json').read_text())
          names=[
             ('VF_AdOps_V0.1.0_BRIDGE_FULL.zip',743175524,'07bc7b324b7e37c6bcbfb1e3eb5633ae6e795617969ab75a88f230bdb08def3f'),
             ('VF_AdOps_V0.1.1_FULL.zip',743175534,'d6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba'),
             ('VF_AdOps_V0.1.1_UPDATE.zip',743175523,'329a2bbbd1bd7bc0dae5412891c06085b7b304d3a701454ac53e1a44ba12155c'),
             ('RELEASE_PROVENANCE.json',743175527,'11050dbb0044f36fd5582c31e5ffb5edb0bc819e9dfb9ab9a4bbc58faa457f4e'),
             ('SHA256SUMS',743175530,'2ceec91bd1d0c65de4350344fa3afee70d6f6abbcf0f03887513a7ef2f5ef4dc'),
          ]
          assert len(release['assets'])==len(names)
          assets={x['name']:x for x in release['assets']}
          for name,id,want in names:
              p=root/name
              data=p.read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              a=assets[name]
              assert a['id']==id and a['name']==name and a['state']=='uploaded'
              assert a['size']==len(data) and digest==want and a.get('digest')=='sha256:'+want
              if name.endswith('.zip'):
                  assert a['content_type']=='application/zip'
          subprocess.run(['sha256sum','--check','SHA256SUMS'],cwd=root,check=True)
          prov=json.loads((root/'RELEASE_PROVENANCE.json').read_text())
          assert prov['repository']=='llhzx2018/vf-adops' and prov['project_id']=='P08'
          assert prov['target_source_sha']=='9c7f76434fe2d064f2f1ac15c58a760f778cf055'
          assert prov['bridge_source_sha']=='dd1ad4d881ae232ec5e817d05402ce1753b640e7'
          assert prov['flat_source_sha']=='55ecbc8461a4d90fe7241a00caffa55e557cde1c'
          assert prov['schema_changes'] is False and prov['production_auto_apply'] is False
          for name,id,digest in names[:3]:
              assert prov['artifacts'][name]['sha256']==digest
              assert prov['artifacts'][name]['bytes']==(root/name).stat().st_size
          def archive(name):
              with zipfile.ZipFile(root/name) as z:
                  assert z.testzip() is None
                  listed=z.namelist()
                  assert len(set(listed))==len(listed)
                  assert not any(n.startswith('/') or '\\' in n or n.startswith('storage/') or '..' in n.split('/') for n in listed)
                  assert '.env' not in listed
                  manifest='ATOMIC_MANIFEST.json' if 'UPDATE.zip' in name else 'FULL_MANIFEST.json'
                  return json.loads(z.read(manifest)),hashlib.sha256(z.read(manifest)).hexdigest(),listed
          bridge,bhash,blist=archive(names[0][0])
          full,fhash,flist=archive(names[1][0])
          atomic,_,alist=archive(names[2][0])
          assert bridge['source_sha']==prov['bridge_source_sha'] and bridge['target_version']=='0.1.0'
          assert full['source_sha']==prov['target_source_sha'] and full['target_version']=='0.1.1'
          assert bhash==prov['bridge_full_manifest_sha256'] and fhash==prov['target_full_manifest_sha256']
          assert atomic['source_sha']==prov['bridge_source_sha'] and atomic['target_sha']==prov['target_source_sha']
          assert atomic['source_full_manifest_sha256']==bhash and atomic['schema_changes'] is False
          assert 'public/setup.php' in blist and 'public/setup.php' in flist and 'public/setup.php' not in alist
          assert not any(n.startswith('database/migrations/') for n in alist)
          with (t/'p08-011-valid-draft-release.json').open('w') as output:
              simulated={**release,'draft':False}
              json.dump(simulated,output)
          print('P08_FINAL_REMOTE_BYTES_FIVE_HARDCODED_DIGEST_AND_ZIP_MANIFEST=PASS')
          PY
      - name: Prepublication official PHP update gate with candidate state only
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import os,json
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          p=json.loads((t/'p08-011-remote-assets/RELEASE_PROVENANCE.json').read_text())
          r=json.loads((t/'p08-011-valid-draft-release.json').read_text())
          assets={a['name']:a for a in r['assets']}
          update='VF_AdOps_V0.1.1_UPDATE.zip'
          full='VF_AdOps_V0.1.1_FULL.zip'
          m={'schema_version':'1.0','project_id':'P08','component_id':'APP',
              'repository':'llhzx2018/vf-adops','project_slug':'vf-adops',
              'enabled':True,'update_type':'ATOMIC','channel':'stable',
              'backup_required':True,'rollback_supported':True,
              'signature_required':False,'signature_algorithm':None,
              'from_versions':['0.1.0'],'target_version':'0.1.1',
              'flat_source_sha':p['flat_source_sha'],
              'flat_full_manifest_sha256':p['flat_full_manifest_sha256'],
              'source_sha':p['bridge_source_sha'],
              'source_full_manifest_sha256':p['bridge_full_manifest_sha256'],
              'target_sha':p['target_source_sha'],
              'asset_sha256':p['artifacts'][update]['sha256'],
              'schema_from':'1.0','schema_to':'1.0',
              'release_tag':'v0.1.1','release_id':r['id'],
              'asset_name':update,'asset_bytes':p['artifacts'][update]['bytes'],
              'full_asset_id':assets[full]['id'],
              'full_asset_sha256':p['artifacts'][full]['sha256'],
              'minimum_php':'8.4.1',
              'production_auto_apply':False,
              'owner_bridge_activation':'MANUAL_OFFLINE_BACKUP_FIRST',
              'notes':'VF AdOps 0.1.1 正式更新。旧 flat 0.1.0 先由 Owner 手工停写备份、来源核对并安全启用 Bridge，后台再点击 Atomic。FULL 只能用于新建空站，正式站不会自动改动。'}
          (t/'p08-011-channel.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          PY
          php -r '
          require "source/src/Upgrade/GitHubStableReleaseGate.php";
          $m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $r=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);
          $g=new VF\AdOps\Upgrade\GitHubStableReleaseGate();
          $c=$g->validate($m,$r,"0.1.0",$m["flat_source_sha"],$m["flat_full_manifest_sha256"]);
          if(($c["status"]??"")!=="RELEASE_METADATA_VERIFIED_PACKAGE_NOT_DOWNLOADED")exit(18);
          $g->validateDownloadedArchive($c,$argv[3]);
          echo "P08_FORMAL_PREPUBLISH_REAL_PHP_GATE=PASS\n";
          ' "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-valid-draft-release.json" "$RUNNER_TEMP/p08-011-remote-assets/VF_AdOps_V0.1.1_UPDATE.zip"
      - name: Publish only verified original DRAFT release id 444076625
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api -X PATCH repos/llhzx2018/vf-adops/releases/444076625 -F draft=false -F prerelease=false >/dev/null
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.1 > "$RUNNER_TEMP/p08-011-published.json"
          jq -e '.id==444076625 and .tag_name=="v0.1.1" and .draft==false and .prerelease==false and (.assets|length)==5' "$RUNNER_TEMP/p08-011-published.json" >/dev/null
          php -r '
          require "source/src/Upgrade/GitHubStableReleaseGate.php";
          $m=json_decode(file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
          $r=json_decode(file_get_contents($argv[2]),true,512,JSON_THROW_ON_ERROR);
          $g=new VF\AdOps\Upgrade\GitHubStableReleaseGate();
          $c=$g->validate($m,$r,"0.1.0",$m["flat_source_sha"],$m["flat_full_manifest_sha256"]);
          $g->validateDownloadedArchive($c,$argv[3]);
          echo "P08_REAL_OFFICIAL_RELEASE_PUBLISHED_AND_PHP_GATE=PASS\n";
          ' "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-published.json" "$RUNNER_TEMP/p08-011-remote-assets/VF_AdOps_V0.1.1_UPDATE.zip"
      - name: Publish only independent P08-ADOPS stable channel and confirm raw readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO=llhzx2018/core-updates
          FILE=projects/P08-ADOPS.json
          if gh api "repos/$REPO/contents/$FILE?ref=main" >/dev/null 2>&1; then
            echo P08_ADOPS_CHANNEL_COLLISION_REJECTED
            exit 19
          fi
          jq -n --arg content "$(base64 -w0 "$RUNNER_TEMP/p08-011-channel.json")"             '{message:"release(p08): 0.1.1 verified SHA256 update channel",content:$content,branch:"main"}' > "$RUNNER_TEMP/p08-011-put.json"
          gh api --method PUT "repos/$REPO/contents/$FILE" --input "$RUNNER_TEMP/p08-011-put.json" > "$RUNNER_TEMP/p08-011-write-result.json"
          test "$(jq -r '.content.path' "$RUNNER_TEMP/p08-011-write-result.json")" = "$FILE"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/$FILE?ref=main" > "$RUNNER_TEMP/p08-011-channel-readback.json"
          cmp "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-channel-readback.json"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.1 --jq '.object.sha')" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          echo P08_011_OFFICIAL_RELEASE_ASSET_AND_CHANNEL_READBACK=PASS
          echo P08_011_PRODUCTION_AUTO_APPLY=NO
      - name: Always delete the private checkout and remote asset copies
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf source gov "$RUNNER_TEMP/p08-011-remote-assets"
          rm -f "$RUNNER_TEMP/p08-011-draft.json" "$RUNNER_TEMP/p08-011-valid-draft-release.json" "$RUNNER_TEMP/p08-011-channel.json" "$RUNNER_TEMP/p08-011-published.json" "$RUNNER_TEMP/p08-011-put.json" "$RUNNER_TEMP/p08-011-write-result.json" "$RUNNER_TEMP/p08-011-channel-readback.json"
          echo P08_FORMAL_PRIVATE_SOURCE_ASSET_CLEANUP=PASS
