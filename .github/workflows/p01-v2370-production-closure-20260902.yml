name: P01 V2.37.0 Production Closure
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2370-production-closure-20260902.yml]
permissions:
  contents: read
  actions: read
jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: docs/p01-v2370-production-closure-20260902
      FORMAL: 5172a497f7a2c9065880ae0d1257a15469917621
      FORMAL_TREE: eac2a8c76c49925bffbca9c23314ef90aec6f3bd
      RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      RELEASE_ID: '380868714'
      CORE_HEAD: 7a365c1aacb2c8047aa5f47127b02c1a3cca7072
      MANIFEST_BLOB: 1cc1f3d64bc82f61fd4c3676d5ab0c47d08ea61d
      SCREEN_SHA: 72a811ff12c5e632fbeb4dba1b60af8760d661edb1f04269e3cb6c9ab3be5607
    steps:
      - name: Fresh remote truth fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)" = "$FORMAL"
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/v2.37.0 --jq .object.sha)" = "$FORMAL"
          rel=$(gh api repos/$PRODUCT_REPO/releases/tags/v2.37.0)
          test "$(jq -r .id <<<"$rel")" = "$RELEASE_ID"
          test "$(jq -r .draft <<<"$rel")" = false
          test "$(jq -r .prerelease <<<"$rel")" = false
          test "$(jq '.assets|length' <<<"$rel")" = 8
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_HEAD"
          live=$(gh api 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' --jq .content | tr -d '\n' | base64 -d)
          test "$(jq -r .current_version <<<"$live")" = 2.36.5
          test "$(jq -r .target_version <<<"$live")" = 2.37.0
          test "$(jq -r '.from_versions|join(",")' <<<"$live")" = 2.36.5
          test "$(jq -r .release_id <<<"$live")" = "$RELEASE_ID"
          test "$(jq -r .product_identity <<<"$live")" = "$FORMAL"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
      - name: Exact closure base fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$FORMAL"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.37.0
          test "$(cat src/VERSION.txt)" = 2.37.0
      - name: Write docs-only Production Closure authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          import json

          marker='<!-- P01_V2370_OWNER_PRODUCTION_CLOSURE -->'
          section=f'''{marker}\n## V2.37.0 Owner Production Closure · 2026-09-02\n\n- Final Owner Readback：Current `V2.37.0` = Latest `V2.37.0`，状态 `已是最新版本。`，Footer `V2.37.0`，历史 `2.36.5 → 2.37.0 / success`，Last Check `2026-09-02 12:14:11`，Update Completed `2026-09-02 12:14:15`。\n- Final Screenshot：`1319×641` / SHA-256 `72a811ff12c5e632fbeb4dba1b60af8760d661edb1f04269e3cb6c9ab3be5607`。\n- Formal Source `5172a497f7a2c9065880ae0d1257a15469917621` / Formal Tree `eac2a8c76c49925bffbca9c23314ef90aec6f3bd` / Runtime Tree `057fbba8822950f163aa322d99b889ed3ab24842` / Release ID `380868714` / Schema `2026082901`。\n- Stage R3 `33567057091`、Candidate Readiness `33567195059`、Formal Bind `33567294699`、Formal Artifact `33567419784`、Strict Fresh R3 `33567802392`、Release Publish R3 `33568217603`、core-updates Manifest Gate `33568357809`：**PASS**。\n- live core-updates main `7a365c1aacb2c8047aa5f47127b02c1a3cca7072`；P01 manifest blob `1cc1f3d64bc82f61fd4c3676d5ab0c47d08ea61d`；严格单跳 `V2.36.5 → V2.37.0`。\n- Verdict：**OWNER PRODUCTION V2.37.0 / PRODUCTION CLOSURE PASS**；Assistant direct Production write `NO`。\n- Runtime：回到 **L2 Product Optimization / Fresh Owner feedback**；不自动创建下一版本，不重复已 PASS Release Gate。\n\n> 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Production Authority。\n\n'''
          for fn,title in [('docs/authority/CURRENT.md','# P01 · VF Start · Current Authority\n\n'),('docs/handoff/CURRENT_STATE.md','# CURRENT STATE · P01 VF Start\n\n')]:
              p=Path(fn); s=p.read_text(encoding='utf-8')
              if marker not in s:
                  if not s.startswith(title): raise SystemExit(f'unexpected header {fn}')
                  s=title+section+s[len(title):]
                  p.write_text(s,encoding='utf-8')

          evidence=Path('docs/evidence/P01_V2.37.0_OWNER_PRODUCTION_CLOSURE_20260902.md')
          evidence.write_text('''# P01 · V2.37.0 Owner Production Closure · 2026-09-02\n\n## Verdict\n\n`PASS / OWNER PRODUCTION V2.37.0 / CURRENT = LATEST / TERMINAL UI READBACK PASS`\n\nOwner 已通过 VF Start 正式在线升级完成 `V2.36.5 → V2.37.0`。Assistant 没有直接写 Owner Production。\n\n## Final Owner Evidence\n\n```text\nCurrent Version: V2.37.0\nLatest Version: V2.37.0\nUpdate State: 已是最新版本。\nFooter: VF Start · V2.37.0\nLast Check: 2026-09-02 12:14:11\nUpdate History: 2.36.5 -> 2.37.0 / success\nUpdate Completed At: 2026-09-02 12:14:15\nScreenshot Size: 1319 x 641\nScreenshot SHA256: 72a811ff12c5e632fbeb4dba1b60af8760d661edb1f04269e3cb6c9ab3be5607\nAssistant Production Write: NO\n```\n\n## Published Release Binding\n\n```text\nVersion: 2.37.0\nTag: v2.37.0\nGitHub Release ID: 380868714\nFormal Source: 5172a497f7a2c9065880ae0d1257a15469917621\nFormal Tree: eac2a8c76c49925bffbca9c23314ef90aec6f3bd\nRuntime Tree: 057fbba8822950f163aa322d99b889ed3ab24842\nSchema: 2026082901\nMigration: NONE\nFULL Bytes: 601163\nFULL SHA256: 0a7e74750fa22a68ec26a0a4e14e7852e8ad2bb5514ba8c262c804d40eda609b\nUPDATE Asset: VF_Start_V2.37.0_UPDATE.zip\nUPDATE Bytes: 1270761\nUPDATE SHA256: c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29\nrepair Bytes: 3689853\nrepair SHA256: 085c205c32ba0c4b4e0d2153f808964f4c301c123baec85ec0a9f11870c04154\n```\n\nRelease chain: Stage R3 `33567057091` PASS; Candidate Readiness `33567195059` PASS; Formal Bind `33567294699` PASS; Formal Artifact `33567419784` PASS; Strict Fresh Formal R3 `33567802392` PASS; Release Publish R3 `33568217603` PASS. Earlier Stage / Strict Fresh / Publication harness failures remain retained as harness-only evidence; frozen product bytes were not invalidated.\n\n## core-updates Closure\n\n`core-updates` PR `#39` promoted the exact single-hop `V2.36.5 → V2.37.0` manifest after Manifest Gate `33568357809` PASS.\n\n```text\ncore-updates main: 7a365c1aacb2c8047aa5f47127b02c1a3cca7072\nP01 manifest blob: 1cc1f3d64bc82f61fd4c3676d5ab0c47d08ea61d\nOnline contract: 2.36.5 -> 2.37.0\n```\n\n## Production Boundary\n\n```text\nOwner Production Runtime: V2.37.0 / PASS\nOwner Production Schema: 2026082901 (release/Atomic contract; no migration)\nPublished Latest: V2.37.0\nCurrent = Latest: YES\nTerminal UI Readback: PASS\nProduction Closure: PASS\nAssistant Production Write: NO\nProduct runtime mutation in closure docs step: NO\nTag/Release mutation in closure docs step: NO\ncore-updates mutation in closure docs step: NO\n```\n\nV2.37.0 Production Closure is complete. Runtime returns to L2 Product Optimization from Fresh Owner feedback and preserved develop working truth.\n''',encoding='utf-8')

          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          release={
            'version':'2.37.0','tag':'v2.37.0','release_id':380868714,
            'release_source':'5172a497f7a2c9065880ae0d1257a15469917621',
            'release_tree':'eac2a8c76c49925bffbca9c23314ef90aec6f3bd',
            'runtime_tree':'057fbba8822950f163aa322d99b889ed3ab24842',
            'schema_version':'2026082901','live_core_updates_commit':'7a365c1aacb2c8047aa5f47127b02c1a3cca7072',
            'live_online_next_hop':'2.37.0 / FROM 2.36.5',
            'online_asset':'VF_Start_V2.37.0_UPDATE.zip','online_asset_bytes':1270761,
            'online_asset_sha256':'c416486d5ea1d68b87c1bdfebcc7de42729f1ff7655e3ded49ebd5a88d1e3b29',
            'full_asset':'VF-Start-V2.37.0-FULL.zip','full_asset_bytes':601163,
            'full_asset_sha256':'0a7e74750fa22a68ec26a0a4e14e7852e8ad2bb5514ba8c262c804d40eda609b',
            'repair_asset':'repair-v2.37.0.php','repair_asset_bytes':3689853,
            'repair_asset_sha256':'085c205c32ba0c4b4e0d2153f808964f4c301c123baec85ec0a9f11870c04154',
            'release_state':'PUBLISHED / OWNER INSTALLED / PRODUCTION CLOSURE PASS',
            'assistant_production_write':False,'stage_r3':33567057091,
            'candidate_readiness':33567195059,'formal_bind_gate':33567294699,
            'formal_artifact_gate':33567419784,'strict_fresh_formal_r3':33567802392,
            'release_publish_gate':33568217603,'core_updates_manifest_gate':33568357809,
            'owner_production_runtime':'2.37.0','owner_production_schema':'2026082901',
            'production_closure':'PASS','owner_production_upgrade':'2.36.5 -> 2.37.0 / SUCCESS',
            'owner_version_readback':'Current V2.37.0 / Latest V2.37.0 / history 2.36.5 -> 2.37.0 success',
            'owner_browser_footer_readback':'V2.37.0 / PASS','owner_terminal_ui_last_check':'2026-09-02 12:14:11',
            'owner_terminal_ui_screenshot_sha256':'72a811ff12c5e632fbeb4dba1b60af8760d661edb1f04269e3cb6c9ab3be5607',
            'owner_terminal_ui_screenshot_size':'1319x641','owner_online_state':'CURRENT=LATEST / NO UPDATE AVAILABLE',
            'p01_manifest_promotion_commit':'7a365c1aacb2c8047aa5f47127b02c1a3cca7072',
            'core_updates_repository_head_at_closure':'7a365c1aacb2c8047aa5f47127b02c1a3cca7072',
            'p01_manifest_blob_at_closure':'1cc1f3d64bc82f61fd4c3676d5ab0c47d08ea61d'
          }
          d['status']='V2.37.0 OWNER PRODUCTION / PUBLISHED / PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'
          d['production_version']='2.37.0'; d['working_version']='2.37.0'; d['target_release_version']='2.37.0'
          d['current_phase']='V2.37.0 OWNER PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'
          d['production_release']=release; d['published_release']=dict(release)
          if isinstance(d.get('current_change'),dict):
              d['current_change']['main_write']=True
              d['current_change']['production_write']=False
              d['current_change']['release_completed']=True
              d['current_change']['production_closure']='PASS'
          d.setdefault('authority',{})['current_production_evidence']='docs/evidence/P01_V2.37.0_OWNER_PRODUCTION_CLOSURE_20260902.md'
          d['authority']['current_formal_release_evidence']='docs/evidence/P01_V2.37.0_OWNER_PRODUCTION_CLOSURE_20260902.md'
          d['candidate_version']='2.37.0'; d['candidate_schema_version']='2026082901'
          d['candidate_state']='RELEASED / OWNER PRODUCTION CLOSURE PASS'
          d['formal_release_state']='V2.37.0 PUBLISHED / OWNER PRODUCTION CLOSURE PASS'
          d['develop_state']='L2 WORKING TRUTH / PRESERVE DEVELOP AUTHORITY / NEXT OWNER FEEDBACK'
          d['current_authority']='Owner Production V2.37.0 / Published Latest V2.37.0 / Production Closure PASS / L2 Product Optimization'
          d['next_action']='Continue L2 Product Optimization from Fresh Owner feedback and preserved develop working truth. Do not auto-release the next version.'
          d['owner_production_activation_evidence']={
            'version':'2.37.0','schema':'2026082901','final_screenshot_sha256':'72a811ff12c5e632fbeb4dba1b60af8760d661edb1f04269e3cb6c9ab3be5607',
            'screenshot_size':'1319x641','current':'2.37.0','latest':'2.37.0','footer':'2.37.0','state':'已是最新版本。',
            'history':'2.36.5 -> 2.37.0 / success','last_check':'2026-09-02 12:14:11','update_completed_at':'2026-09-02 12:14:15',
            'terminal_ui_visual_closure':'PASS','assistant_production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Docs-only exact boundary gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.37.0
          test "$(cat src/VERSION.txt)" = 2.37.0
          mapfile -t files < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${files[@]}" > /tmp/p01-v2370-closure-files.txt
          expected=$(printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.37.0_OWNER_PRODUCTION_CLOSURE_20260902.md docs/handoff/CURRENT_STATE.md | sort)
          actual=$(printf '%s\n' "${files[@]}" | sort)
          test "$actual" = "$expected"
          jq -e '.production_version=="2.37.0" and .production_release.version=="2.37.0" and .published_release.version=="2.37.0" and .schema_version=="2026082901" and .production_release.production_closure=="PASS" and .owner_production_activation_evidence.current=="2.37.0" and .owner_production_activation_evidence.latest=="2.37.0"' VF_PROJECT.json >/dev/null
          grep -F '<!-- P01_V2370_OWNER_PRODUCTION_CLOSURE -->' docs/authority/CURRENT.md >/dev/null
          grep -F '<!-- P01_V2370_OWNER_PRODUCTION_CLOSURE -->' docs/handoff/CURRENT_STATE.md >/dev/null
      - name: Commit and push closure candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.37.0_OWNER_PRODUCTION_CLOSURE_20260902.md
          git commit -m 'docs(P01): close V2.37.0 Owner Production'
          git push origin HEAD:$PRODUCT_BRANCH
          printf 'P01_V2370_PRODUCTION_CLOSURE_CANDIDATE=PASS\nOWNER_CURRENT=2.37.0\nOWNER_LATEST=2.37.0\nHISTORY=2.36.5_TO_2.37.0_SUCCESS\nSCREEN_SHA=%s\nASSISTANT_PRODUCTION_WRITE=NO\n' "$SCREEN_SHA" | tee /tmp/p01-v2370-production-closure.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-production-closure-${{ github.run_id }}
          path: |
            /tmp/p01-v2370-closure-files.txt
            /tmp/p01-v2370-production-closure.txt
          if-no-files-found: warn
          retention-days: 90
