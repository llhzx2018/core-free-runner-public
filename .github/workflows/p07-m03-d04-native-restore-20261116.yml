name: P07 M03 D04 independent native SQL backup and target restore proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-native-restore-20261116.yml']
permissions:
  contents: read
jobs:
  mysql-restore-drill:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Public one-off workflow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P07 source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 807dda65132ca4a0e7b2559f9e18b1c2e922fa5f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Transient GOV-DOC current architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-doc
      - name: MySQL 8.4 true source-to-independent-target export, import, data parity and failure retention
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          P07_MYSQL_NATIVE_CI: '1'
          P07_NATIVE_DB_ENGINE: 'MYSQL_8.4'
          P07_NATIVE_DB_CONTAINER: 'p07-restore-mysql84'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "807dda65132ca4a0e7b2559f9e18b1c2e922fa5f"
          for role in source target; do
            docker run -d --rm --name "p07-restore-mysql84-$role" -e MYSQL_ROOT_PASSWORD=SYNTHETIC_ci_root_2026 mysql:8.4 >/dev/null
          done
          for role in source target; do
            for i in $(seq 1 75); do
              if docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "p07-restore-mysql84-$role" mysqladmin --protocol=tcp -h127.0.0.1 -uroot ping >/dev/null 2>&1; then break; fi
              sleep 2
            done
            docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "p07-restore-mysql84-$role" mysql --no-defaults --protocol=tcp -h127.0.0.1 -uroot -N -e 'SELECT VERSION();' | grep -E '^8[.]4[.]'
          done
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /home/p07native /home/p07native/htdocs /home/p07native/htdocs/native.example.invalid
          cd .p07-private
          export PYTHONPATH="$PWD/lib:$PWD/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_native_restore_drill.py -v
          echo P07_D04_MYSQL84_REAL_SOURCE_TO_TARGET_RESTORE_AND_FAIL_RECOVERY=PASS
      - name: MariaDB 11.8 true source-to-independent-target export, import, data parity and failure retention
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          P07_MYSQL_NATIVE_CI: '1'
          P07_NATIVE_DB_ENGINE: 'MARIADB_11.8'
          P07_NATIVE_DB_CONTAINER: 'p07-restore-mariadb118'
        run: |
          set -Eeuo pipefail
          for role in source target; do
            docker run -d --rm --name "p07-restore-mariadb118-$role" -e MARIADB_ROOT_PASSWORD=SYNTHETIC_ci_root_2026 mariadb:11.8 >/dev/null
          done
          for role in source target; do
            for i in $(seq 1 75); do
              if docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "p07-restore-mariadb118-$role" mariadb-admin --protocol=tcp -h127.0.0.1 -uroot ping >/dev/null 2>&1; then break; fi
              sleep 2
            done
            docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 "p07-restore-mariadb118-$role" mariadb --no-defaults --protocol=tcp -h127.0.0.1 -uroot -N -e 'SELECT VERSION();' | grep -E '^11[.]8[.]'
          done
          cd .p07-private
          export PYTHONPATH="$PWD/lib:$PWD/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_native_restore_drill.py -v
          echo P07_D04_MARIADB118_REAL_SOURCE_TO_TARGET_RESTORE_AND_FAIL_RECOVERY=PASS
      - name: Core safety gates and GOV-DOC canonical architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-doc"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_mysql_online_private_snapshot.py -q
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_final_sync_guard.py -q
          python3 -B .github/checks/test_architecture_gate.py -q
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py --manifest "$PRIVATE/.github/checks/code_architecture.json" --gov-root "$GOV" --git-root "$PRIVATE" --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81 --head-sha 807dda65132ca4a0e7b2559f9e18b1c2e922fa5f
          echo P07_D04_INDEPENDENT_SCRATCH_NATIVE_RESTORE_ARCH_AND_SAFETY=PASS
          echo P07_D04_CLOUDPANEL_REAL_TWO_VPS_HTTP=NOT_RUN
          echo P07_D04_CROSS_ENGINE_D05=NOT_RUN
          echo P07_D04_FINAL_ALL_SOURCE_WRITERS_FENCED=NOT_PROVEN
          echo P07_D04_PRODUCTION_OLD_VPS_CP2_DNS=UNCHANGED
      - name: Always remove private source and synthetic SQL source/target machines
        if: always()
        shell: bash
        run: |
          set +e
          for engine in mysql84 mariadb118; do
            for role in source target; do
              docker rm -f "p07-restore-$engine-$role" >/dev/null 2>&1
            done
          done
          rm -rf -- .p07-private .gov-doc
          test ! -e .p07-private
          test ! -e .gov-doc
          echo P07_D04_NATIVE_RESTORE_PUBLIC_PRIVATE_CLEANUP=PASS
