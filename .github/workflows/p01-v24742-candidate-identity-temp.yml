name: p01-v24742-candidate-identity-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24742-candidate-identity-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 3ad4a26244701fad325a8ffc5479084f5f75fd24
      TARGET_SHA: 3c6d509ab6100f43de767f1dc4610a8916697edd
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"; done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_V24742_IDENTITY_EXACT_SOURCE=PASS

      - name: Verify candidate identity and bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat current/VERSION)" = "2.47.42"
          test "$(cat current/src/VERSION.txt)" = "2.47.42"
          grep -F "define('VF_VERSION', '2.47.42');" current/src/app/bootstrap.php >/dev/null
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo P01_V24742_IDENTITY_BOUNDED_DIFF=PASS

      - name: Focused engineering consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/tests/unit/engineering_consistency_r80_contract.php
          php current/tests/unit/engineering_consistency_r80_contract.php | tee /tmp/identity.txt
          grep -q '^P01_ENGINEERING_CONSISTENCY_R80_CONTRACT=PASS$' /tmp/identity.txt
          echo P01_V24742_IDENTITY_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_V24742_IDENTITY_CANONICAL=PASS