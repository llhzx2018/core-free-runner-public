name: TEMP P08 R43 genuine issued v016 to exact current v017 native compatibility
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-r43-v016-v017-native-20261125.yml
permissions:
  contents: read
concurrency:
  group: temp-p08-r43-v016-v017-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  issued-old-client:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-v016-v017-old-client-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      database:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-r43-issued-test-only
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-r43-issued-test-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_ISSUED_016_TEST: 'YES'
      P08_R43_ISSUED_ENGINE: ${{ matrix.engine }}
      P08_R43_ISSUED_DB_PASSWORD: isolated-r43-issued-test-only
    steps:
      - name: Private source exact developer bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure native backup/restore SQL CLI available without unbounded apt
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if command -v mysqldump >/dev/null && command -v mysql >/dev/null; then
            echo P08_R43_ISSUED_NATIVE_SQL_CLIENT=PASS
          elif command -v mariadb-dump >/dev/null && command -v mariadb >/dev/null; then
            echo P08_R43_ISSUED_NATIVE_SQL_CLIENT=PASS
          else
            timeout 75s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-issued-apt.log" 2>&1 || { echo P08_R43_ISSUED_NATIVE_CLIENT_NETWORK=BLOCKED; exit 1; }
            timeout 90s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-issued-apt.log" 2>&1 || { echo P08_R43_ISSUED_NATIVE_CLIENT_INSTALL=FAIL; exit 1; }
          fi
          (command -v mysqldump || command -v mariadb-dump) >/dev/null
          (command -v mysql || command -v mariadb) >/dev/null
          echo P08_R43_ISSUED_BACKUP_RESTORE_NATIVE_CLIENT=PASS
      - name: Fetch immutable OFFICIAL original v0.1.16 FULL artifact and check exact public SHA/size
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff'
          test "$(cat private-p08-bridge/VERSION)" = '0.1.17'
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-issued-private"
          gh release download v0.1.16 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.16_FULL.zip --dir "$RUNNER_TEMP/p08-r43-issued-private" > "$RUNNER_TEMP/p08-r43-issued-gh-download.log" 2>&1 || { echo P08_R43_ORIGINAL_ISSUED_ASSET_DOWNLOAD=BLOCKED; exit 1; }
          oldZip="$RUNNER_TEMP/p08-r43-issued-private/VF_AdOps_V0.1.16_FULL.zip"
          test -f "$oldZip" && test ! -L "$oldZip"
          test "$(stat -c %s "$oldZip")" = '8378356' || { echo P08_R43_IMMUTABLE_ISSUED_SIZE=FAIL; exit 1; }
          test "$(sha256sum "$oldZip" | cut -d' ' -f1)" = '7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f' || { echo P08_R43_IMMUTABLE_ISSUED_SHA=FAIL; exit 1; }
          unzip -p "$oldZip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r43-issued-full-manifest.json"
          python3 - "$RUNNER_TEMP/p08-r43-issued-full-manifest.json" <<'PY'
          import json,sys
          z=json.load(open(sys.argv[1]))
          assert z['type']=='CLEAN_FULL_ONLY' and z['source_sha']=='ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          assert z['target_version']=='0.1.16' and z['project_id']=='P08'
          print('P08_R43_AUTHENTIC_PUBLISHED_V016_FULL_BYTES_AND_MANIFEST=PASS')
          PY
      - name: Build exact source-bound v017 code-only Atomic FROM genuine official v016 FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          d=private-p08-bridge
          mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
          (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-issued-composer.log" 2>&1) || { echo P08_R43_V017_LOCKED_DEPENDENCIES=FAIL; exit 1; }
          (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-issued-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-issued-vite.log" 2>&1) || { echo P08_R43_V017_VITE_BUILD=FAIL; exit 1; }
          manifest="$RUNNER_TEMP/p08-r43-issued-full-manifest.json"
          hash="$(sha256sum "$manifest" | awk '{print $1}')"
          python3 "$d/scripts/build_atomic.py" --source "$d" --output "$RUNNER_TEMP/p08-r43-dev-v017-update.zip" --source-version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --source-full-manifest-sha256 "$hash" --previous-full-manifest "$manifest" --target-version 0.1.17 --target-sha '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff' > "$RUNNER_TEMP/p08-r43-issued-atomic.log" 2>&1 || { echo P08_R43_ISSUED_FULL_TO_BRIDGE_ATOMIC=FAIL; grep -E 'ATOMIC_REJECTED|ATOMIC_BUILD_BLOCKED' "$RUNNER_TEMP/p08-r43-issued-atomic.log" | head -n 6 || true; exit 1; }
          php -l "$d/tests/compatibility/r43_issued016_native_codeonly.php" > "$RUNNER_TEMP/p08-r43-issued-syntax.log" 2>&1 || { echo P08_R43_ISSUED_TEST_SYNTAX=FAIL; exit 1; }
          echo P08_R43_REAL_PUBLISHED_FULL_SCHEMA_MATCHES_DEV_017_ATOMIC=PASS
      - name: Install authentic original v016 FULL and Owner, then validate original client ZIP refusal and code-only backup+pointer
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-issued-site-${{ matrix.engine }}"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-issued-private/VF_AdOps_V0.1.16_FULL.zip" -d "$site"
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("P08_R43_ISSUED_DB_PASSWORD")); $p->exec("CREATE DATABASE p08_ci_r43_issued_".getenv("P08_R43_ISSUED_ENGINE"));' > "$RUNNER_TEMP/p08-r43-issued-create-db.log" 2>&1 || { echo P08_R43_ORIGINAL_NATIVE_DB_FIXTURE=FAIL; exit 1; }
          t=private-p08-bridge/tests/compatibility/r43_issued016_native_codeonly.php
          update="$RUNNER_TEMP/p08-r43-dev-v017-update.zip"
          php "$t" setup "$site" "$update" '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff' > "$RUNNER_TEMP/p08-r43-issued-owner-install.log" 2>&1 || { echo P08_R43_REAL_ISSUED_OWNER_FIRST_INSTALL=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-issued-owner-install.log" | tail -n 12 || true; exit 1; }
          grep -q '^P08_R43_ACTUAL_OFFICIAL_V016_FULL_OWNER_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-issued-owner-install.log"
          php "$t" bad-archive "$site" "$update" '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff' > "$RUNNER_TEMP/p08-r43-issued-bad-zip.log" 2>&1 || { echo P08_R43_REAL_ISSUED_ARCHIVE_NEGATIVE=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-issued-bad-zip.log" | tail -n 12 || true; exit 1; }
          grep -q '^P08_R43_ISSUED_CLIENT_BAD_ZIP_SHA_AND_TARGET_REFUSED=PASS' "$RUNNER_TEMP/p08-r43-issued-bad-zip.log"
          php "$t" apply "$site" "$update" '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff' > "$RUNNER_TEMP/p08-r43-issued-atomic-apply.log" 2>&1 || { echo P08_R43_REAL_ISSUED_ATOMIC=FAIL; grep -E 'R43_|ATOMIC_|R26_|R66_|R25_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-issued-atomic-apply.log" | tail -n 14 || true; exit 1; }
          grep -q '^P08_R43_UNMODIFIED_ISSUED_016_NATIVE_CODEONLY_STAGE_BACKUP_POINTER=PASS' "$RUNNER_TEMP/p08-r43-issued-atomic-apply.log"
          php "$t" verify "$site" "$update" '7ed1bf09655ea3b2a5c2d720bc73435e70c6a3ff' > "$RUNNER_TEMP/p08-r43-issued-atomic-readback.log" 2>&1 || { echo P08_R43_REAL_ISSUED_ATOMIC_INDEPENDENT_READBACK=FAIL; grep -E 'R43_|ATOMIC_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-issued-atomic-readback.log" | tail -n 14 || true; exit 1; }
          grep -q '^P08_R43_ISSUED_016_TO_DEV_017_NATIVE_ATOMIC_READBACK=PASS' "$RUNNER_TEMP/p08-r43-issued-atomic-readback.log"
          echo P08_R43_AUTHENTIC_ISSUED_016_OLD_PHP_NATIVE_CODEONLY_ATOMIC=PASS engine=${{ matrix.engine }}
      - name: Wipe isolated private old FULL and bridge source, credentials and backup data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge "$RUNNER_TEMP"/p08-r43-issued-private "$RUNNER_TEMP"/p08-r43-issued-site-*
          rm -f -- "$RUNNER_TEMP"/p08-r43-dev-v017-update.zip "$RUNNER_TEMP"/p08-r43-issued-*.log "$RUNNER_TEMP"/p08-r43-issued-full-manifest.json
          test ! -e private-p08-bridge && test ! -e "$RUNNER_TEMP/p08-r43-issued-private"
          echo P08_R43_AUTHENTIC_ISSUED_PRIVATE_ARTIFACT_CLEANUP=PASS
