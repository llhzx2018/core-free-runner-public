name: TEMP S01-C02 Ops 1.21.809 Build
on:
  push:
    branches: [temp/s01-c02-v121809-build-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO: llhzx2018/vf-tools-ops
      BRANCH: fix/s01-static-batch-label-compat-v121809
      BASE: e827f42117002024b37c85b498eb8790c05110bf
      OLD_B64: 
      NEW_B64: 
      TEST_B64: 
    steps:
      - name: Patch exact 1.21.808 source
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"; test -n "$W"
          git clone -q --branch "$BRANCH" "https://x-access-token:${R}@github.com/${REPO}.git" ops
          cd ops
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          p=Path('includes/site-release/s01-static-boundary-reconciler.php')
          s=p.read_text()
          old=base64.b64decode(os.environ['OLD_B64']).decode()
          new=base64.b64decode(os.environ['NEW_B64']).decode()
          if s.count(old)!=1: raise SystemExit('predicate anchor mismatch')
          p.write_text(s.replace(old,new))
          p=Path('vf-ops.php')
          s=p.read_text()
          replacements=[
              (' * Version: 1.21.808',' * Version: 1.21.809'),
              ("VF_OPS_VERSION', '1.21.808'","VF_OPS_VERSION', '1.21.809'"),
              ("VF_OPS_ROUND', 'STATIC-RECONCILER-RECOVERY-V1'","VF_OPS_ROUND', 'STATIC-BATCH-LABEL-COMPAT-V1'"),
          ]
          for a,b in replacements:
              if s.count(a)!=1: raise SystemExit('version anchor mismatch: '+a)
              s=s.replace(a,b)
          p.write_text(s)
          Path('VERSION').write_text('1.21.809\n')
          Path('.github/phase3/v121809-static-batch-label-compat.php').write_bytes(base64.b64decode(os.environ['TEST_B64']))
          PY
          php .github/phase3/v121809-static-batch-label-compat.php | grep -Fxq PASS_V121809_STATIC_BATCH_LABEL_COMPAT
          git diff --check
          git status --short
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION vf-ops.php includes/site-release/s01-static-boundary-reconciler.php .github/phase3/v121809-static-batch-label-compat.php
          git commit -m 'fix(S01-C02): accept proven legacy static batch labels'
          git remote set-url origin "https://x-access-token:${W}@github.com/${REPO}.git"
          git push -q origin "HEAD:${BRANCH}"
          echo BUILD_V121809=PASS
