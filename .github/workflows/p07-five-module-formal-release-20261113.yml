name: P07 五模块正式发行 - 精确资产审查与公开分发
on:
  push:
    branches:
      - feat/p07-unified-independent-module-router-20261112
    paths:
      - .github/workflows/p07-five-module-formal-release-20261113.yml
permissions:
  contents: write
jobs:
  publish-reviewed-runtime:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/feat/p07-unified-independent-module-router-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public release control only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out exact private product main for approved runtime publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7c6cc38f48972367f5b9a88c3a182d70baa44463
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product
      - name: Confirm release-source identity and prior machine-proof equivalence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 7c6cc38f48972367f5b9a88c3a182d70baa44463
          git -C product cat-file -e deb9efbbcfe1fd99f976ad867e9bbee8c1424fc7^{commit}
          git -C product diff --exit-code deb9efbbcfe1fd99f976ad867e9bbee8c1424fc7 7c6cc38f48972367f5b9a88c3a182d70baa44463 -- \
            bin/vfops-init-core bin/vfops-init-entry bin/vfops-init-ui lib/ \
            scripts/build_p07_m05_bundle.py scripts/install_p07_m05_bundle.py
          printf 'P07_RELEASE_EXACT_M05_RUNTIME_SOURCE=PASS\n'
      - name: Build five immutable module assets and perform source/secret/path review
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p07-release"
          python3 product/scripts/build_p07_m05_bundle.py \
            --output "$RUNNER_TEMP/p07-release/P07-M05-0.1.0-m05-candidate2.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess, urllib.request, zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-release"
          public="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/"
          tag="p07-v0.1.0-five-modules-20261113"
          source="7c6cc38f48972367f5b9a88c3a182d70baa44463"
          assets=[
            ("P07-M01","网络代理节点（V2Ray）","0.1.0-rc13","P07-M01-0.1.0-rc13-installer.sh",
             "adf4d8cc0db69255fb4a6aff58857561a0652bf6/installers/p07-vf-node-independent-rc13.sh",
             "8313adef7dd235b645fc815a7bded933fc289f82","git_blob"),
            ("P07-M02","服务器性能检测（VPS 验机）","2.1.0-rc7-field","P07-M02-2.1.0-rc7-field.sh",
             "0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh",
             "d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d","sha256"),
            ("P07-M03","网站与数据","0.1.0-release115","P07-M03-0.1.0-release115-installer.sh",
             "1986fc0526f583a3a152d92980e21519926bc926/installers/p07.sh",
             "c49b26eb900960eeaf3992eaa95f3d3a9a4feb31","git_blob"),
            ("P07-M04","服务器维护与安全","0.1.0-rc83","P07-M04-0.1.0-rc83-installer.sh",
             "75c7336b8467114f8bc3396dc06144e48275a39a/installers/p07-system-care-rc83-isolated.sh",
             "d39cef5d0915a99753d688f10fb1dbe74c0dac98","git_blob"),
            ("P07-M05","新服务器初始化","0.1.0-m05-candidate2","P07-M05-0.1.0-m05-candidate2.zip",
             None,"835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb","sha256")
          ]
          def digest(data): return hashlib.sha256(data).hexdigest()
          def blob(data): return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          for mid,name,build,filename,ref,expected,kind in assets:
            p=root/filename
            if ref:
              with urllib.request.urlopen(urllib.request.Request(public+ref,headers={"User-Agent":"P07-Formal-Release"}),timeout=50) as response:
                data=response.read()
              if not data or len(data)>8*1024*1024: raise RuntimeError("unexpected module size: "+mid)
              p.write_bytes(data)
            data=p.read_bytes()
            if (digest(data) if kind=="sha256" else blob(data))!=expected:
              raise RuntimeError("immutable module asset mismatch: "+mid)
            if filename.endswith(".sh"):
              subprocess.run(["bash","-n",str(p)],check=True)
          archive=root/"P07-M05-0.1.0-m05-candidate2.zip"
          patterns={
            "private_key":re.compile(rb"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----"),
            "github_token":re.compile(rb"(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})"),
            "aws_key":re.compile(rb"(?:AKIA|ASIA)[A-Z0-9]{16}"),
            "credential_url":re.compile(rb"https?://[A-Za-z0-9._-]+:[^/@\s]+@[A-Za-z0-9.-]+"),
            "production_ip":re.compile(rb"(?:45\.76\.171\.57|45\.63\.52\.90)")
          }
          with zipfile.ZipFile(archive) as z:
            info=z.infolist()
            if len(info)!=88 or len(set(x.filename for x in info))!=88:
              raise RuntimeError("unexpected M05 ZIP contents/count")
            for entry in info:
              name=entry.filename
              if not name.startswith("p07-m05/") or name.endswith("/") or ".." in pathlib.PurePosixPath(name).parts:
                raise RuntimeError("M05 unsafe file path")
              rel=name[len("p07-m05/"):]
              allowed=rel in {
                "bin/vfops-init-core","bin/vfops-init-entry","bin/vfops-init-ui",
                "VERSION","BUILD_ID","MODULE_ID","MODULE_BUILD_ID","MODULE_MANIFEST.json"
              } or (rel.startswith("lib/") and pathlib.PurePosixPath(rel).suffix in {".py",".sh",".json"})
              if not allowed or stat.S_ISLNK(entry.external_attr>>16):
                raise RuntimeError("M05 unexpected asset type: "+rel)
              data=z.read(entry)
              if len(data)>8*1024*1024: raise RuntimeError("M05 oversize member: "+rel)
              for label,regex in patterns.items():
                if regex.search(data): raise RuntimeError("M05 sensitive-pattern review failed: "+label+" in "+rel)
            if z.read("p07-m05/MODULE_BUILD_ID")!=b"0.1.0-m05-candidate2\n":
              raise RuntimeError("M05 build identity mismatch")
            if z.testzip() is not None: raise RuntimeError("M05 archive CRC failure")
          records=[]
          for mid,name,build,filename,ref,expected,kind in assets:
            data=(root/filename).read_bytes()
            records.append({"module_id":mid,"name":name,"build":build,"asset":filename,
                            "sha256":digest(data),"bytes":len(data),
                            "source_ref":ref,"source_hash":expected})
          manifest={"schema":"vf.p07.five-module-formal-release.v1","tag":tag,
             "product_repo":"llhzx2018/vf-server-ops","product_main_sha":source,
             "public_release_repo":"llhzx2018/core-free-runner-public",
             "owner_approved_public_runtime_only":True,
             "other_private_sources_or_data_published":False,
             "production_executed":False,
             "machine_evidence":{
              "m05_debian13_cloudpanel":"https://github.com/llhzx2018/vf-server-ops/runs/131671979315",
              "independent_upgrade_rollback":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/43359410382"},
             "assets":records}
          (root/"P07-FIVE-MODULES-RELEASE.json").write_text(
            json.dumps(manifest,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          files=sorted(p for p in root.iterdir() if p.is_file())
          (root/"SHA256SUMS").write_text(
            "".join(digest(p.read_bytes())+"  "+p.name+"\n" for p in files),encoding="utf-8")
          print("P07_RELEASE_SECURITY_PATH_AND_COMMON_SECRET_SCAN=PASS")
          print("P07_RELEASE_FIVE_MODULE_ASSETS=5")
          print("P07_RELEASE_M05_EXACT_ZIP_SHA256=835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb")
          print("P07_RELEASE_OWNER_PRODUCTION=UNTOUCHED")
          PY
      - name: Publish exact formal product Release and public distribution assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_WRITE_CAPABILITY_MISSING'; exit 13; }
          tag=p07-v0.1.0-five-modules-20261113
          package_dir="$RUNNER_TEMP/p07-release"
          printf '%s\n' 'P07 五模块独立发行；安装/升级/回滚均保留模块边界。' \
            '正式产品源码：vf-server-ops@7c6cc38f48972367f5b9a88c3a182d70baa44463' \
            'M05 公共运行包经 OWNER 授权；不包含私有测试输入或生产数据。' \
            '来源为旧版 M03 release115 与五模块独立候选；生产安装、迁移、DNS 均未执行。' \
            '新手安装入口仍使用 core-free-runner-public/main/installers/p07-toolbox.sh，必须另外回读公共 main 才算 Distribution PASS。' \
            >"$RUNNER_TEMP/p07-release-notes.md"
          for repo in llhzx2018/vf-server-ops llhzx2018/core-free-runner-public; do
            if [[ "$repo" == llhzx2018/vf-server-ops ]]; then
              target=7c6cc38f48972367f5b9a88c3a182d70baa44463
            else
              target=4c415dc2b25bd80ad4d0bbfc540ea44f5bca9c98
            fi
            if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
              echo "P07_RELEASE_ALREADY_EXISTS_REQUIRES_EXACT_REMOTE_CHECK=$repo"
            else
              gh release create "$tag" "$package_dir"/* --repo "$repo" --target "$target" \
                --title "P07 五模块独立发行 0.1.0" \
                --notes-file "$RUNNER_TEMP/p07-release-notes.md" --latest=false
            fi
            dir="$RUNNER_TEMP/verify-$(basename "$repo")"
            mkdir -p "$dir"
            gh release download "$tag" --repo "$repo" --dir "$dir" --clobber
            (cd "$dir" && sha256sum -c SHA256SUMS --status)
            cmp "$package_dir/P07-FIVE-MODULES-RELEASE.json" "$dir/P07-FIVE-MODULES-RELEASE.json"
            echo "P07_RELEASE_REMOTE_ASSETS_EXACT_READBACK=PASS:$repo"
          done
      - name: Cleanup private product source and staged release bytes
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product "$RUNNER_TEMP/p07-release" "$RUNNER_TEMP/verify-vf-server-ops" \
            "$RUNNER_TEMP/verify-core-free-runner-public"
          echo P07_PRIVATE_SOURCE_PUBLIC_RUNNER_PERSISTED=NO
