name: p01-ia6-exact-six-surface-governance-and-source-credentials

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-six-surface-governance-proof.yml'

permissions:
  contents: read

jobs:
  owner-synthetic-safe-proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: 80034c1f5d7c248ae705a0ee6170c09ba769d2ad
    steps:
      - name: Prepare PHP and lock product SHA
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-curl php-zip php-gd php-xml >/dev/null
          test -n "$READ_TOKEN"
          url="https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git"
          branch="refs/heads/feat/ia-v6-frontstage-admin-parity-system-jobs-r1"
          test "$(git ls-remote "$url" "$branch" | awk '{print $1}')" = "$TARGET_SHA"
          git clone -q --no-checkout "$url" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.486"
          echo P01_IA6_EXACT_SOURCE=PASS

      - name: Disposable six-surface governance real SQLite transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d /tmp/p01-ia6-six-domain-XXXXXXXX)"
          cp -a candidate/src/. "$root/"
          echo "$root" > /tmp/p01-ia6-proof-root-path
          ( cd "$root"; php -S 127.0.0.1:18964 -t . >/tmp/p01-ia6-six-server.log 2>&1 ) &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root" candidate /tmp/p01-ia6-proof-root-path /tmp/p01-ia6-six-*' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS -c /tmp/p01-ia6-six-cookie -b /tmp/p01-ia6-six-cookie http://127.0.0.1:18964/setup.php -o /tmp/p01-ia6-six-setup.html 2>/dev/null; then break; fi
            sleep 1
          done
          setup_csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-six-setup.html').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m, 'No disposable installer CSRF'
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-six-cookie -b /tmp/p01-ia6-six-cookie -X POST http://127.0.0.1:18964/setup.php \
            --data-urlencode "setup_csrf=$setup_csrf" --data-urlencode "site_title=IA6 Six-domain Synthetic" \
            --data-urlencode "admin_password=P01Gov!18964" --data-urlencode "admin_password_confirm=P01Gov!18964" \
            -o /tmp/p01-ia6-six-installed.html
          ( cd "$root"; php cli/verify.php ) | grep -Fx VERIFY_PASS=YES
          VF_SYNTHETIC_ROOT="$root" php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('VF_SYNTHETIC_ROOT');
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/SurfaceRepository.php';
          require_once $root.'/app/FullSurfaceGovernance.php';
          require_once $root.'/app/UpdateCredentialStore.php';
          $db=vf_db();
          $repo=new VfRepository($db);
          $profiles=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'IA6 Synthetic Six','description'=>'',
             'icon'=>'','is_private'=>0,'sort_order'=>0]);
          $surfaces=['start','channels','watch','topics','books','projects'];
          foreach($surfaces as $name){
            $row=$repo->saveLink(null,[
              'surface'=>$name,'category_id'=>$cat,'title'=>'IA6_FLOW_'.$name,
              'url'=>'https://example.org/ia6-'.$name.'-proof-18964',
              'description'=>'IA6_BEFORE','tags'=>['ia6-synthetic'],
              'is_private'=>1,'is_pending'=>0,'force_duplicate'=>1
            ]);
            $id=(int)($row['id']??0);
            if($id<=0)throw new RuntimeException('Seed id failed');
            if($name!=='start')$profiles->upsertProfile($id,['surface'=>$name,'resource_kind'=>'article']);
          }
          $service=new VfFullSurfaceGovernance($db);
          $before=$service->exportCsv();
          foreach($surfaces as $name)
            if(!str_contains($before,'IA6_FLOW_'.$name))throw new RuntimeException('Missing exported '.$name);
          $edited=str_replace('IA6_BEFORE','IA6_AFTER',$before);
          $review=$service->previewCsv($edited);
          if((int)($review['invalid']??-1)!==0 || (int)($review['changedRows']??-1)!==6
            ||(int)($review['changeItemsTruncated']??-1)!==0)
            throw new RuntimeException('Incomplete six-domain review');
          $token=(string)($review['reviewToken']??'');
          if(strlen($token)!==64)throw new RuntimeException('No bindable review token');
          echo "P01_IA6_SIX_DOMAIN_PREVIEW=PASS\n";
          $denied=false;
          try{$service->applyCsv($edited,str_repeat('0',64));}catch(Throwable $ex){$denied=true;}
          if(!$denied||substr_count($service->exportCsv(),'IA6_BEFORE')!==6)
            throw new RuntimeException('Invalid review allowed mutation');
          echo "P01_IA6_WRONG_REVIEW_ZERO_WRITE=PASS\n";
          $receipt=$service->applyCsv($edited,$token);
          if((int)($receipt['updatedResources']??-1)!==6
            ||trim((string)($receipt['backup']??''))==='')
            throw new RuntimeException('No complete protected receipt');
          $after=$service->exportCsv();
          if(substr_count($after,'IA6_AFTER')!==6 || str_contains($after,'IA6_BEFORE'))
            throw new RuntimeException('Six-domain apply not reflected in actual DB');
          foreach($surfaces as $name)
            if(!str_contains($after,'https://example.org/ia6-'.$name.'-proof-18964'))
              throw new RuntimeException('Immutable URL identity changed: '.$name);
          echo "P01_IA6_PROTECTED_SIX_DOMAIN_APPLY_READBACK=PASS\n";
          $up=new VfUpdateCredentialStore(null,'update');
          $t=new VfUpdateCredentialStore(null,'gov-topic');
          $b=new VfUpdateCredentialStore(null,'gov-book');
          $up->save('IA6SyntheticUpdateToken_18964');
          $t->save('IA6SyntheticTopicToken_18964');
          $b->save('IA6SyntheticBookToken_18964');
          if($t->managedToken()===$b->managedToken())throw new RuntimeException('Shared credential');
          echo "P01_IA6_THREE_DISTINCT_TOKEN_STORES=PASS\n";
          PHP
          python3 <<'PY'
          import http.cookiejar,urllib.request,urllib.parse,urllib.error,re,json
          origin='http://127.0.0.1:18964/'
          owner=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          guest=urllib.request.build_opener()
          def req(path,data=None,client=owner,accept=False):
              h={'Accept':'application/json'} if accept else {}
              if path=='api.php?action=login':h['Content-Type']='application/json'
              r=urllib.request.Request(origin+path,data=data,headers=h)
              try: out=client.open(r,timeout=15)
              except urllib.error.HTTPError as e: out=e
              with out:return out.status,out.read().decode('utf-8','replace')
          status,_=req('api.php?action=login',json.dumps({'password':'P01Gov!18964'}).encode())
          assert status==200,('Owner login status',status)
          status,html=req('home.php')
          assert status==200
          m=re.search(r'<meta[^>]+name="csrf-token"[^>]+content="([^"]+)"',html)
          assert m,'Owner page has no CSRF meta'
          csrf=m.group(1)
          for path in ['gov-topic-sync.php','gov-book-sync.php']:
              def post(values,client=owner):
                  return req(path,urllib.parse.urlencode(values).encode(),client,True)
              assert post({'mode':'revoke','frontstage_ajax':'1','csrf':csrf,'confirm':'WRONG'})[0]==409
              assert post({'mode':'revoke','frontstage_ajax':'1','csrf':'wrong','confirm':'REVOKE_SOURCE_TOKEN'})[0]==419
              assert post({'mode':'revoke','frontstage_ajax':'1','csrf':csrf,'confirm':'REVOKE_SOURCE_TOKEN'},guest)[0] in (401,403)
              code,text=post({'mode':'authorize','frontstage_ajax':'1','csrf':csrf,
                  'gov_topic_read':'short','gov_book_read':'short'})
              assert code==409 and 'short' not in text,'Invalid credential accepted or echoed'
              code,text=post({'mode':'revoke','frontstage_ajax':'1','csrf':csrf,'confirm':'REVOKE_SOURCE_TOKEN'})
              assert code==200 and json.loads(text)['ok'] is True,(path,code)
              print('P01_IA6_SOURCE_HTTP_GUARD_AND_REVOKE_'+path.split('.')[0].upper()+'=PASS')
          print('P01_IA6_SOURCE_HTTP_OWNER_GUEST_CSRF_INVALID=PASS')
          PY
          VF_SYNTHETIC_ROOT="$root" php <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('VF_SYNTHETIC_ROOT').'/app/bootstrap.php';
          require_once getenv('VF_SYNTHETIC_ROOT').'/app/UpdateCredentialStore.php';
          if((new VfUpdateCredentialStore(null,'update'))->managedToken()!=='IA6SyntheticUpdateToken_18964'
            ||(new VfUpdateCredentialStore(null,'gov-topic'))->managedToken()!==''
            ||(new VfUpdateCredentialStore(null,'gov-book'))->managedToken()!=='')
            throw new RuntimeException('Isolated token revoke affected updater');
          echo "P01_IA6_UPDATE_TOKEN_UNCHANGED_AFTER_SOURCE_REVOKE=PASS\n";
          PHP
          echo P01_IA6_EXACT_SIX_DOMAIN_REAL_FLOW=PASS
