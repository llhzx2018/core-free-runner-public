name: S01-C02 1.21.935 R47 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121935-r47-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 952ea19447158a727fc90f5a9f323fe3a44a9c65
      EXPECTED_VERSION: 1.21.935
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-SURFACE-CAPABILITY-INTEGRATION-R47" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l target/vf-ops.php
          php -l target/includes/admin-v13/route-contract.php
          php -l target/includes/admin-v13/tab-controller.php
          php -l target/includes/admin-v13/views/content_articles.php
          php -l target/includes/admin-v13/views/content_workflow_v6.php
          php -l target/includes/admin-v13/views/seo_keywords.php
          php -l target/includes/admin-v13/views/acceptance_overview.php
          php -l target/includes/admin-v13/views/publish_zip_v6.php
          php -l target/includes/admin-v13/views/integrations.php
          php -l target/tests/s01-c02-121935-product-surface-r46-contract.php
          php -l target/tests/s01-c02-121935-surface-capability-r47-contract.php
          echo "PHP_SYNTAX=PASS"

      - name: Product lineage contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-121935-product-surface-r46-contract.php
          php target/tests/s01-c02-121935-surface-capability-r47-contract.php
          echo "R43_R47_LINEAGE=PASS"

      - name: Surface and capability source checks
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          route=Path("target/includes/admin-v13/route-contract.php").read_text()
          ctrl=Path("target/includes/admin-v13/tab-controller.php").read_text()
          required=[
              "content_core","content_briefs","content_ai","content_status","content_media",
              "seo_planner","seo_languages","acceptance_source","acceptance_online",
              "acceptance_components","acceptance_export","system_site_release","ads",
          ]
          assert "function vf_ops_v13_absorbed_capability_request_v121936" in route
          assert "function vf_ops_v13_absorbed_capability_route_v121936" in route
          assert "function vf_ops_v13_effective_route_v121936" in ctrl
          for key in required:
              assert ("'"+key+"'") in route, key
          print("ABSORBED_CAPABILITY_SOURCE=PASS")
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121935-r47-focused-${{ github.run_id }}
          path: target/VERSION
          retention-days: 7
