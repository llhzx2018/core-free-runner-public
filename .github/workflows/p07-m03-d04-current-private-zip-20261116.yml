name: P07 M03 D04 current source private ZIP true installer and rollback
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-current-private-zip-20261116.yml']
permissions:
  contents: read
jobs:
  native-real-zip-isolated:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout short-lived public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient checkout immutable private product trial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 65f22d1dbc2aa5ef80d717852dc675a01f1e90e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-trial
      - name: Offline negative tests on exact private candidate adapter
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-trial rev-parse HEAD)" = "65f22d1dbc2aa5ef80d717852dc675a01f1e90e7"
          (cd .p07-private-trial && python3 -B -m unittest discover -s tests -p test_p07_m03_trial_atomic.py -q)
          echo P07_D04_TRIAL_LAB_NEGATIVE_TESTS=PASS
      - name: True private saved ZIP plus official release136 isolated native install upgrade rollback
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          umask 077
          PRIVATE="$PWD/.p07-private-trial"
          ZIP="$PRIVATE/owner-trials/p07-m03-d04-20261116/vfops-p07-m03-d04-trial-c824a0d0.zip"
          test -f "$ZIP"
          echo '5f31b595becebfbe99c280caef7a273835177b465fd4e9839ad7462a434ea718  '"$ZIP" | sha256sum -c - >/dev/null
          python3 -B - "$PRIVATE" "$ZIP" <<'PY'
          import hashlib,json,pathlib,subprocess,sys,zipfile
          root=pathlib.Path(sys.argv[1]); artifact=pathlib.Path(sys.argv[2])
          manifest=json.loads((root/'owner-trials/p07-m03-d04-20261116/TRIAL_MANIFEST.json').read_text())
          source='c824a0d0fee0301c656e8ab228e10ae68e459f0f'
          assert manifest['source_commit']==source and manifest['archive_entries']==146
          assert manifest['zip_bytes']==artifact.stat().st_size
          assert manifest['zip_sha256']==hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert manifest['formal_release'] is False and manifest['production_approved'] is False
          paths=subprocess.check_output(['git','-C',str(root),'ls-tree','-r','--name-only',source,'bin','lib','scripts','components'],text=True).splitlines()
          assert len(paths)==142
          with zipfile.ZipFile(artifact) as z:
              names=z.namelist()
              assert len(names)==146 and len(set(names))==146 and z.testzip() is None
              assert set(names)=={'vfops/'+p for p in paths}|{'vfops/BUILD_ID','vfops/VERSION','vfops/TRIAL_CANDIDATE.json','vfops/OWNER_TRIAL_README.txt'}
              for path in paths:
                  data=z.read('vfops/'+path)
                  actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()
                  expected=subprocess.check_output(['git','-C',str(root),'rev-parse',source+':'+path],text=True).strip()
                  assert actual==expected, 'SOURCE_FILE_NOT_IDENTICAL'
              meta=json.loads(z.read('vfops/TRIAL_CANDIDATE.json'))
              assert meta['source_commit']==source and meta['formal_release'] is False
              assert z.read('vfops/BUILD_ID').strip()==b'0.1.0-d04-trial-c824a0d0'
          print('P07_D04_ALL_142_ARCHIVED_FILES_MATCH_EXACT_GIT_BLOBS=PASS')
          print('P07_D04_CURRENT_TRIAL_ZIP_SHA256_AND_CRC=PASS')
          PY
          python3 -B "$PRIVATE/scripts/p07_m03_trial_atomic.py" verify --zip "$ZIP"
          BASE_DIR="$(mktemp -d -t p07-m03-release136-XXXXXXXX)"
          LAB="$(mktemp -d -t p07-m03-trial-XXXXXXXX)"
          trap 'rm -rf -- "$LAB" "$BASE_DIR"' EXIT
          printf 'P07_M03_OFFLINE_LAB_ONLY_V1\n' > "$LAB/.p07-m03-trial-lab"
          for m in m01 m02 m03 m04 m05 data; do
            mkdir -p "$LAB/$m"
            if [ "$m" != m03 ]; then
              printf 'never-write-%s\n' "$m" > "$LAB/$m/sentinel"
            fi
          done
          RELEASE_URL="https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-ux4-20261114/P07-M03-0.1.0-release136.zip"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             --connect-timeout 10 --max-time 120 "$RELEASE_URL" -o "$BASE_DIR/release136.zip"
          echo '1505875e7713c45b19cfa28a241a838c134d5df960df8703c36ea3ed27d0e392  '"$BASE_DIR/release136.zip" | sha256sum -c - >/dev/null
          mkdir "$BASE_DIR/contents"
          unzip -qq "$BASE_DIR/release136.zip" -d "$BASE_DIR/contents"
          bash -n "$BASE_DIR/contents/installers/p07-final.sh"
          P07_INSTALL_DIR="$LAB/m03/current"           P07_PREVIOUS_DIR="$LAB/m03/previous"           P07_BIN_LINK="$LAB/vfops"           P07_PUBLIC_ROOT="file://$BASE_DIR/contents"           P07_ALLOW_NONROOT=1           P07_NO_EXEC=1             bash "$BASE_DIR/contents/installers/p07-final.sh" >/dev/null
          test "$(cat "$LAB/m03/current/BUILD_ID")" = "0.1.0-release136"
          python3 -B - "$PRIVATE" "$LAB" <<'PY'
          import pathlib,sys
          private=pathlib.Path(sys.argv[1])
          root=pathlib.Path(sys.argv[2])
          sys.path.insert(0,str(private/'scripts'))
          import p07_m03_trial_atomic as a
          a.validate_baseline(root/'m03'/'current')
          assert (root/'vfops').is_symlink()
          print('P07_M03_OFFICIAL_RELEASE136_NATIVE_ROOTLESS_INSTALL=PASS')
          PY
          python3 -B - "$PRIVATE" "$ZIP" "$LAB" <<'PY'
          import pathlib,sys
          private=pathlib.Path(sys.argv[1]); archive=pathlib.Path(sys.argv[2]); root=pathlib.Path(sys.argv[3])
          sys.path.insert(0,str(private/'scripts'))
          import p07_m03_trial_atomic as a
          baseline=a.fingerprints(root)
          try:
              a.install_lab(root,archive,fail_after_backup=True)
          except a.TrialBlocked:
              pass
          else:
              raise AssertionError('injected fault was not rejected')
          a.validate_baseline(root/'m03'/'current')
          assert not (root/'m03'/'previous').exists()
          assert a.fingerprints(root)==baseline
          print('P07_M03_CURRENT_ZIP_FAULT_AFTER_BACKUP_RECOVERY=PASS')
          PY
          python3 -B "$PRIVATE/scripts/p07_m03_trial_atomic.py" install-lab --zip "$ZIP" --lab-root "$LAB"
          test "$(cat "$LAB/m03/current/BUILD_ID")" = "0.1.0-d04-trial-c824a0d0"
          test "$(cat "$LAB/m03/previous/BUILD_ID")" = "0.1.0-release136"
          test "$(NO_COLOR=1 bash "$LAB/m03/current/bin/vfops-user" --build-id)" = "0.1.0-d04-trial-c824a0d0"
          echo P07_M03_CURRENT_PRIVATE_ZIP_ISOLATED_UPGRADE=PASS
          python3 -B "$PRIVATE/scripts/p07_m03_trial_atomic.py" rollback-lab --lab-root "$LAB"
          test "$(cat "$LAB/m03/current/BUILD_ID")" = "0.1.0-release136"
          test "$(cat "$LAB/m03/previous/BUILD_ID")" = "0.1.0-d04-trial-c824a0d0"
          python3 -B - "$PRIVATE" "$LAB" <<'PY'
          import pathlib,sys
          sys.path.insert(0,str(pathlib.Path(sys.argv[1])/'scripts'))
          import p07_m03_trial_atomic as a
          root=pathlib.Path(sys.argv[2])
          a.validate_baseline(root/'m03'/'current')
          a.verify_trial(root/'m03'/'previous')
          print('P07_M03_CURRENT_PRIVATE_ZIP_ISOLATED_ROLLBACK=PASS')
          print('P07_M03_OTHER_FOUR_MODULES_AND_DATA_CANARIES_UNCHANGED=PASS')
          print('P07_M03_ACTUAL_CLOUDPANEL_PRODUCTION_INSTALL=NOT_RUN')
          PY
      - name: Always remove transient private source, ZIP and test cache
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-trial
          test ! -e .p07-private-trial
          echo P07_M03_PRIVATE_ZIP_PUBLIC_WORKSPACE_REMOVED=PASS
