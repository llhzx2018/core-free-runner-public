name: P08 v0.1.12 Mode T exact governance and project authority proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-v012-mode-t-authority-oneoff.yml'
jobs:
  mode-t-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - name: Checkout temporary public proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact candidate Governance without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f18760781a4a9f4eef9712e366633229cf41b2e6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Checkout exact P08 RP-07T project-only rule candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: a5109deae156d5fbb6e39a0320ab50d3ed3c1ffd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Run real current-dependency and negative governance fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = f18760781a4a9f4eef9712e366633229cf41b2e6
          test "$(git -C p08 rev-parse HEAD)" = a5109deae156d5fbb6e39a0320ab50d3ed3c1ffd
          python3 -B gov/governance/public-authority/tools/current_dependency_lint.py
          (cd gov && python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v)
          python3 - <<'PY'
          from pathlib import Path
          a=Path('gov/CURRENT.md').read_text()
          b=Path('gov/skills/README.md').read_text()
          skill=Path('gov/skills/skill-release/V3.19/SKILL.md').read_text()
          case=Path('gov/governance/release/cases/P08_ADOPS_012_PR75_ATOMIC_LINEAGE_POST_RELEASE_OWNER_MANUAL_20261119.md').read_text()
          project=Path('p08/docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert '| skill-release | V3.19 |' in a
          assert '| skill-release | V3.19 | V2.6 |' in b
          assert '### Mode T ·' in skill and 'Modes A–S' in skill
          assert 'RP-07T' in project and 'RP-07T' in Path('p08/AGENTS.md').read_text()
          assert 'efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9' in case
          assert 'ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110' in case
          assert 'PRODUCTION_AUTO_APPLY=NO' in case
          assert 'OWNER_REAL_USE=POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS' in project
          assert Path('p08/VERSION').read_text().strip()=='0.1.12'
          print('P08_MODE_T_EFFECTIVE_CANDIDATE_STRUCTURE=PASS')
          PY
      - name: Clean ephemeral private source checkouts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- gov p08
          test ! -e gov && test ! -e p08
          echo P08_MODE_T_PRIVATE_WORKSPACE_CLEANED=PASS
