name: TEMP S01-C02 1.21.923 Quality Final Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ea75e6209dc61eced9ee4e0978ab8b9724341c48
      BASE_SHA: 6fbb43ee302a5c88c2d446c0f8860ff0835b9de0

    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ea75e6209dc61eced9ee4e0978ab8b9724341c48
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Assert exact source and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.923"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/v13/acceptance/overview.css \
            tests/s01-c02-121923-quality-final-convergence-r34-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/v6 includes/wp-update docs/authority includes/admin-v13/services | wc -l)" = "0"

      - name: PHP syntax and R34 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/tests/s01-c02-121923-quality-final-convergence-r34-contract.php
          php product/tests/s01-c02-121923-quality-final-convergence-r34-contract.php

      - name: Independent Quality family selector proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("product")
          pairs=[
            ("acceptance_overview","includes/admin-v13/views/acceptance_overview.php","assets/css/v13/acceptance/overview.css",
             ["vf-v6-quality-page","vf-v9-pagebar","vf-v9-toolbar","vf-v9-priority","vf-v9-section","vf-v9-table","vf-v9-issue-list","vf-v9-details"]),
            ("acceptance_source","includes/admin-v13/views/acceptance_source.php","assets/css/v13/acceptance/source.css",
             ["vf-source-page","vf-source-head","vf-source-decision","vf-source-runner"]),
            ("acceptance_online","includes/admin-v13/views/acceptance_online.php","assets/css/v13/acceptance/online.css",
             ["vf-online-page","vf-online-head","vf-online-current-task","vf-online-workspace"]),
            ("acceptance_components","includes/admin-v13/views/acceptance_components.php","assets/css/v13/acceptance/components.css",
             ["vf-component-page","vf-component-page-head","vf-component-verdict","vf-component-workspace"]),
            ("acceptance_export","includes/admin-v13/views/acceptance_export.php","assets/css/v13/acceptance/export.css",
             ["vf-export-page","vf-export-page-head","vf-export-verdict","vf-export-domains"]),
          ]
          for key,vp,cp,classes in pairs:
              v=(root/vp).read_text(encoding="utf-8")
              c=(root/cp).read_text(encoding="utf-8")
              for cls in classes:
                  assert cls in v, (key,"view",cls)
                  assert "."+cls in c, (key,"css",cls)
              assert c.count("{")==c.count("}"), key
          overview=(root/"assets/css/v13/acceptance/overview.css").read_text(encoding="utf-8")
          assert ".vf-accept-product" not in overview
          assert "--vf-v6-page-title-size" in overview
          assert "--vf-v6-brand" in overview
          assert "@media(max-width:782px)" in overview
          print("S01-C02 1.21.923 Quality family View/CSS proof PASS")
          PY

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf product

# synchronize proof
