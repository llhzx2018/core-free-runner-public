name: P07 Server Ops RC3 Toolbox Smoke

on:
  push:
    branches: [main, work/p07-guided-init9-cloudpanel-foundation, work/p07-guided-init9-real-gate-ux]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-toolbox-smoke.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare isolated Toolbox environment
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-toolbox-smoke
          mkdir -p /tmp/p07-toolbox-smoke/fakebin
          cat >/tmp/p07-toolbox-smoke/fakebin/rclone <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/p07-toolbox-smoke/fakebin/rclone
          bash -n installers/p07.sh
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-rc3-candidate.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init9"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BLOB="92e5f0079294ca22bc77b7e7f48d64d779de263d"' installers/p07.sh
          test "$(git hash-object installers/p07-rc3-candidate.sh)" = '92e5f0079294ca22bc77b7e7f48d64d779de263d'
          grep -Fq '测试中' installers/p07-toolbox.sh
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init9'

      - name: Install Slot3 through stable p07.sh
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-toolbox-smoke/bin/vfops
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/fakebin:$PATH"
          bash installers/p07.sh
          ROOT=/tmp/p07-toolbox-smoke/opt/vf-server-ops
          test "$(/tmp/p07-toolbox-smoke/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(cat "$ROOT/BUILD_ID")" = '0.1.0-rc3-guided-init9'
          test -x "$ROOT/bin/vfops-site-ui"
          test -x "$ROOT/bin/vfops-migrate-ui"
          test -x "$ROOT/bin/vfops-cloudpanel-ui"
          test -x "$ROOT/bin/vfops-auto-backup"
          test -f "$ROOT/lib/restore_as.py"
          test -f "$ROOT/lib/restore_as_verified.py"
          test -f "$ROOT/lib/cloudpanel.py"
          test -f "$ROOT/lib/site_lifecycle.py"
          grep -Fq 'P07_RESTORE_AS_VERIFIED=' "$ROOT/bin/vfops-site-ui"
          grep -Fq 'P07_RESTORE_EVIDENCE=' "$ROOT/bin/vfops-site-ui"
          grep -Fq '/var/lib/vf-server-ops/evidence/restore-as' "$ROOT/bin/vfops-site-ui"
          ! grep -Fq 'REAL_PASS' "$ROOT/bin/vfops-site-ui"

      - name: Toolbox Slot3 routes to installed init9 without reinstall
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/bin:/tmp/p07-toolbox-smoke/fakebin:$PATH"
          printf '3\n0\n0\n' | script -qec 'NO_COLOR=1 bash installers/p07-toolbox.sh' /dev/null > /tmp/p07-toolbox-smoke/tty.log
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '1. 服务器 / 网站概览' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '2. 备份网站' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '3. 恢复网站' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '4. 迁移网站到新服务器' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '5. 自动备份 / 远程灾备' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '6. CloudPanel 网站工具' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '下载并校验 P07 RC2 基础包' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '安装 P07 RC3 Candidate' /tmp/p07-toolbox-smoke/tty.log

      - name: Single ordinary-user entry and closed Menu4 contract
        run: |
          set -euo pipefail
          test "$(NO_COLOR=1 bash installers/p07-toolbox.sh --version)" = 'P07 Toolbox V0.1.0'
          NO_COLOR=1 bash installers/p07-toolbox.sh --help > /tmp/p07-help.txt
          grep -Fq '3. CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-help.txt
          grep -Fq '（测试中）' /tmp/p07-help.txt
          grep -Fq '4. 系统维护 / 安全' /tmp/p07-help.txt
          grep -Fq '（可用）' /tmp/p07-help.txt
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh"' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_TOOLBOX_ROUTE_SMOKE=PASS'
