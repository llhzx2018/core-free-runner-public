name: P07 Server Ops RC3 Toolbox Smoke

on:
  push:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-candidate.sh'
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-toolbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Static identity and syntax
        run: |
          set -euo pipefail
          bash -n installers/p07.sh
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-rc3-candidate.sh
          grep -Fq 'VF_SERVER_OPS_EXPECTED="VF Server Ops 0.1.0 RC3"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init5"' installers/p07-toolbox.sh
          grep -Fq 'local_server_ops_build' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init5"' installers/p07-rc3-candidate.sh
          grep -Fq 'VF_SERVER_OPS_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07.sh"' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'Google 实时：' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq 'B2 实时：' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq '下一步：' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq '自动备份返回格式异常' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq '失败运行不会执行本地自动清理' dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup
          grep -Fq 'GUIDED_DEVICE_OAUTH_FRESH' dist/p07/0.1.0-rc3/overlay/lib/storage_setup.py
          grep -Fq 'DEFAULT_MACHINE_ID = Path("/etc/machine-id")' dist/p07/0.1.0-rc3/overlay/lib/storage_setup.py
          grep -Fq 'host_binding' dist/p07/0.1.0-rc3/overlay/lib/storage_setup.py
          expected="$(sed -n 's/^EXPECTED_BLOB="\([0-9a-f]*\)"$/\1/p' installers/p07.sh)"
          actual="$(python3 - <<'PY'
          import hashlib
          p='installers/p07-rc3-candidate.sh'
          data=open(p,'rb').read()
          print(hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest())
          PY
          )"
          test "$expected" = "$actual"
          test "$(cat dist/p07/0.1.0-rc3/overlay/BUILD_ID)" = '0.1.0-rc3-guided-init5'

      - name: Install through stable p07.sh
        env:
          P07_PUBLIC_ROOT: https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${{ github.sha }}
          P07_ALLOW_NONROOT: '1'
          P07_SKIP_APT: '1'
          P07_SKIP_INVENTORY_SELFTEST: '1'
          P07_NO_EXEC: '1'
          P07_INSTALL_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops
          P07_PREVIOUS_DIR: /tmp/p07-toolbox-smoke/opt/vf-server-ops.previous
          P07_BIN_LINK: /tmp/p07-toolbox-smoke/bin/vfops
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-toolbox-smoke
          mkdir -p /tmp/p07-toolbox-smoke/fakebin
          cat >/tmp/p07-toolbox-smoke/fakebin/rclone <<'SH'
          #!/usr/bin/env bash
          exit 0
          SH
          chmod +x /tmp/p07-toolbox-smoke/fakebin/rclone
          export PATH="/tmp/p07-toolbox-smoke/fakebin:$PATH"
          bash installers/p07.sh
          test "$(/tmp/p07-toolbox-smoke/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(cat /tmp/p07-toolbox-smoke/opt/vf-server-ops/BUILD_ID)" = '0.1.0-rc3-guided-init5'
          grep -Fq 'Google 实时：' /tmp/p07-toolbox-smoke/opt/vf-server-ops/bin/vfops-auto-backup
          grep -Fq '下一步：' /tmp/p07-toolbox-smoke/opt/vf-server-ops/bin/vfops-auto-backup
          grep -Fq '自动备份返回格式异常' /tmp/p07-toolbox-smoke/opt/vf-server-ops/bin/vfops-auto-backup
          grep -Fq '失败运行不会执行本地自动清理' /tmp/p07-toolbox-smoke/opt/vf-server-ops/bin/vfops-auto-backup
          grep -Fq 'GUIDED_DEVICE_OAUTH_FRESH' /tmp/p07-toolbox-smoke/opt/vf-server-ops/lib/storage_setup.py
          grep -Fq 'host_binding' /tmp/p07-toolbox-smoke/opt/vf-server-ops/lib/storage_setup.py

      - name: Toolbox Slot 3 uses installed latest RC3 without reinstall
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/bin:/tmp/p07-toolbox-smoke/fakebin:$PATH"
          printf '3\n0\n0\n' | script -qec 'NO_COLOR=1 bash installers/p07-toolbox.sh' /dev/null > /tmp/p07-toolbox-smoke/tty.log
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-toolbox-smoke/tty.log
          grep -Fq '5. 自动备份（本地 + Google + B2）' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '下载并校验 P07 RC2 基础包' /tmp/p07-toolbox-smoke/tty.log
          ! grep -Fq '安装 P07 RC3 Candidate' /tmp/p07-toolbox-smoke/tty.log

      - name: Same-version stale RC3 auto-upgrades by BUILD_ID
        run: |
          set -euo pipefail
          export PATH="/tmp/p07-toolbox-smoke/bin:/tmp/p07-toolbox-smoke/fakebin:$PATH"
          rm -f /tmp/p07-toolbox-smoke/opt/vf-server-ops/BUILD_ID
          test "$(/tmp/p07-toolbox-smoke/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test ! -f /tmp/p07-toolbox-smoke/opt/vf-server-ops/BUILD_ID
          printf '3\n0\n' | env \
            P07_PUBLIC_ROOT="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${GITHUB_SHA}" \
            P07_ALLOW_NONROOT=1 \
            P07_SKIP_APT=1 \
            P07_SKIP_INVENTORY_SELFTEST=1 \
            P07_NO_EXEC=1 \
            P07_INSTALL_DIR=/tmp/p07-toolbox-smoke/opt/vf-server-ops \
            P07_PREVIOUS_DIR=/tmp/p07-toolbox-smoke/opt/vf-server-ops.previous \
            P07_BIN_LINK=/tmp/p07-toolbox-smoke/bin/vfops \
            script -qec 'NO_COLOR=1 bash installers/p07-toolbox.sh' /dev/null > /tmp/p07-toolbox-smoke/stale-upgrade.log
          grep -Fq '安装 P07 RC3 Candidate' /tmp/p07-toolbox-smoke/stale-upgrade.log
          test "$(cat /tmp/p07-toolbox-smoke/opt/vf-server-ops/BUILD_ID)" = '0.1.0-rc3-guided-init5'
          test "$(/tmp/p07-toolbox-smoke/bin/vfops --version)" = 'VF Server Ops 0.1.0 RC3'

      - name: Single public entry contract
        run: |
          set -euo pipefail
          test "$(NO_COLOR=1 bash installers/p07-toolbox.sh --version)" = 'P07 Toolbox V0.1.0'
          NO_COLOR=1 bash installers/p07-toolbox.sh --help > /tmp/p07-help.txt
          grep -Fq '3. CloudPanel 备份 / 恢复 / 迁移' /tmp/p07-help.txt
          grep -Fq '（测试中）' /tmp/p07-help.txt
          grep -Fq 'BUILD_ID="0.1.0-preview15"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc7"' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_TOOLBOX_ROUTE_SMOKE=PASS'
