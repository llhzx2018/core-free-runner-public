name: P07 private dual-original preservation exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-private-preservation.yml'
      - 'experiments/p07-private-preservation/**'
permissions:
  contents: read
jobs:
  private-preservation-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind product source and stage only synthetic inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-private-preservation/lib/private_conflict_preservation.py)" = fd59c4bebc8e4793fb259c6f96208ea226b06e1d
          test "$(git hash-object experiments/p07-private-preservation/tests/test_private_conflict_preservation.py)" = cd7649d77254dbf3528246ac302d74ce42b99c30
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-private-preserve"
          for p in lib/private_conflict_preservation.py tests/test_private_conflict_preservation.py; do
            cp "experiments/p07-private-preservation/$p" "$RUNNER_TEMP/p07-private-preserve/$p"
          done
          cd "$RUNNER_TEMP/p07-private-preserve"
          python3 -m py_compile lib/private_conflict_preservation.py tests/test_private_conflict_preservation.py
          echo P07_PRIVATE_PRESERVATION_EXACT_SOURCE_PASS
      - name: Prove both originals preserved and unsafe paths rejected
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-private-preserve"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_private_conflict_preservation \
            tests.test_migration_recovery_rehearsal \
            tests.test_migration_conflict_recovery
          echo P07_PRIVATE_PRESERVATION_SYNTHETIC_REGRESSIONS_PASS
      - name: Verify original migration DB writers unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-private-preserve"
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/server_migration.py lib/server_migration_pull.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_PRIVATE_PRESERVATION_DB_WRITERS_UNCHANGED_PASS
