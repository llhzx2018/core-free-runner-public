name: P06 V0.1.15 Human UI Exact Source Gate R4

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-human-ui-exact-source-gate-r4-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P06 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: 561e59a82f035e2622c4567710bec06a1c50dab3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p06
      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 >/dev/null
      - name: Execute observable login contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/p06-v0115-exact-gate.sh "$RUNNER_TEMP/gate-r4.sh"
          python3 - "$RUNNER_TEMP/gate-r4.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          s=s.replace('PORT=19059\n', 'echo P06_HTTP_STAGE=START\nPORT="$(python3 -c \'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()\')"\necho "P06_HTTP_PORT=$PORT"\n', 1)
          s=s.replace('PID=$!\n', 'PID=$!\necho "P06_HTTP_PID=$PID"\n', 1)
          s=s.replace('for _ in $(seq 1 100); do curl -fsS "http://127.0.0.1:$PORT/health" >"$ROOT/health.json" 2>/dev/null && break; sleep .1; done\n', 'READY=0\nfor _ in $(seq 1 100); do if curl -fsS "http://127.0.0.1:$PORT/health" >"$ROOT/health.json" 2>"$ROOT/health.err"; then READY=1; break; fi; sleep .1; done\necho "P06_HTTP_READY=$READY"\ncat "$ROOT/health.json" 2>/dev/null || true\necho\ntest "$READY" = 1\n', 1)
          s=s.replace('curl -fsS -c "$ROOT/cookies" "$BASE/login" >"$ROOT/login"\n', 'curl -fsS -c "$ROOT/cookies" "$BASE/login" >"$ROOT/login"\necho P06_LOGIN_GET=PASS\ngrep -Fq \'name="_csrf"\' "$ROOT/login"\necho P06_LOGIN_CSRF_FORM=PASS\n', 1)
          s=s.replace('CSRF="$(csrf "$ROOT/login")"\n', 'CSRF="$(csrf "$ROOT/login")"\necho P06_LOGIN_CSRF_EXTRACT=PASS\n', 1)
          needle='  --data-urlencode "_csrf=$CSRF" --data-urlencode username=human-owner --data-urlencode "password=$PASS"\n'
          repl=needle+'echo P06_LOGIN_POST=COMPLETE\ncat "$ROOT/login.h"\n'
          s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          bash "$RUNNER_TEMP/gate-r4.sh" p06
