name: P01 V2.47.135 Icon Maintenance UI Gate

on:
  push:
    branches:
      - test-p01-v247135-icon-ui-polish-20260930
    paths:
      - '.github/workflows/temp-p01-v247135-icon-ui-polish.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8c2d38eec883e5d05164d5592e0eb1ca5ad1cc00
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: candidate

      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4629d9d353ddc7dfae0379ee677bcb344e141da9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate/VERSION)" = "2.47.135"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.135"
          grep -F "define('VF_VERSION', '2.47.135');" candidate/src/app/bootstrap.php
          php -l candidate/src/icons.php
          php -l candidate/tests/unit/admin_icon_maintenance_polish_v247135_contract.php
          node --check candidate/src/assets/icons.js
          echo P01_V247135_ICON_UI_SYNTAX=PASS

      - name: Focused UI and favicon contracts
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php tests/unit/admin_icon_maintenance_polish_v247135_contract.php
          php tests/unit/admin_icon_rebuild_progress_v247134_contract.php
          php tests/unit/admin_icon_maintenance_v247133_contract.php
          php tests/unit/admin_backend_coverage_r60_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/navigation_v247126_rail_icon_fix_contract.php
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247127_favicon_provider_privacy_contract.php
          php tests/unit/navigation_v247127_safe_svg_favicon_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          php tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247135_ICON_UI_FOCUSED=PASS

      - name: Release delta boundary
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git diff --name-only 4629d9d353ddc7dfae0379ee677bcb344e141da9..8c2d38eec883e5d05164d5592e0eb1ca5ad1cc00 > /tmp/release-files.txt
          cat /tmp/release-files.txt
          if grep -E '(^|/)(migrations?|schema)(/|\.|$)' /tmp/release-files.txt; then
            echo P01_V247135_SCHEMA_BOUNDARY=FAIL
            exit 1
          fi
          echo P01_V247135_SCHEMA_BOUNDARY=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -euo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline
          echo P01_V247135_ICON_UI_CANONICAL=PASS
