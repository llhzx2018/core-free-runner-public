name: P01 V2.47.7 Candidate Gate R2

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2477-candidate-gate-r2.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2477-candidate-gate-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      ENGINEERING_SHA: 37f771993b479831a1366c4aefa9062e52953b3d
      CANDIDATE_SHA: 83842ab78406f7887f9fefdd55d6567ee4cd6e75
      TARGET_BRANCH: release/v2.47.7-candidate-20260911
      SOURCE_TAG: v2.47.6
      SOURCE_SHA: 67ffe44e67909ef5f172f3ba54e4e54da412d41b
      TARGET_VERSION: 2.47.7
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact authority
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V2477_R2_AUTHORITY=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact identity and static contracts
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          mapfile -t changed < <(git diff --name-only "$ENGINEERING_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" >/tmp/changed
          printf '%s\n' CHANGELOG.md VERSION docs/release/V2.47.7_RELEASE_GATE.md src/VERSION.txt src/app/bootstrap.php >/tmp/expected
          diff -u /tmp/expected /tmp/changed
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/unit/global_account_actions_contract.php | grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS'
          echo P01_V2477_R2_STATIC=PASS

      - name: Fresh install and setup lock
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2477-r2-runtime /tmp/p01-v2477-r2-pw
          cp -a src /tmp/p01-v2477-r2-runtime
          cd /tmp/p01-v2477-r2-runtime
          php -S 127.0.0.1:18128 -t . >/tmp/p01-v2477-r2-server.log 2>&1 & echo $! >/tmp/p01-v2477-r2-server.pid
          for i in $(seq 1 30); do if curl -fsS -c /tmp/p01-v2477-r2.cookies -b /tmp/p01-v2477-r2.cookies http://127.0.0.1:18128/setup.php -o /tmp/p01-v2477-r2-setup.html; then break; fi; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2477-r2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2477R2x"; printf '%s' "$PASS" >/tmp/p01-v2477-r2.password
          curl -fsS -L -c /tmp/p01-v2477-r2.cookies -b /tmp/p01-v2477-r2.cookies -X POST http://127.0.0.1:18128/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2477 R2' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2477-r2-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          code=$(curl -sS -o /tmp/revisit -D /tmp/revisit.h -w '%{http_code}' http://127.0.0.1:18128/setup.php); test "$code" = 302
          tr -d '\r' </tmp/revisit.h | grep -Eiq '^Location: /$'
          echo P01_V2477_R2_INSTALL=PASS

      - name: Real login settings logout desktop mobile
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2477-r2-pw && cd /tmp/p01-v2477-r2-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18128/',password=fs.readFileSync('/tmp/p01-v2477-r2.password','utf8');
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1291,height:797}});const p=await ctx.newPage();
          await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-global-account-actions');
          const anon=await p.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect();return{labels:[...c.querySelectorAll('a')].map(a=>a.textContent.trim()),right:r.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(anon.labels.join('|')!=='登录'||anon.right<1260||anon.right>1291.5||anon.overflow>1)throw new Error('anon '+JSON.stringify(anon));
          await p.click('.vf-global-account-actions [data-vf-auth-login]');await p.waitForSelector('[data-vf-auth-dialog][open]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          const inspect=async path=>{await p.goto(base+path,{waitUntil:'networkidle'});return p.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect(),ss=document.querySelector('.vf-sidebar-bottom>a[href="settings.php"]'),sl=document.querySelector('.vf-sidebar-bottom>a[data-vf-auth-logout]');return{labels:[...c.querySelectorAll('a')].map(a=>a.textContent.trim()),right:r.right,ss:ss?getComputedStyle(ss).display:null,sl:sl?getComputedStyle(sl).display:null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}})};
          const start=await inspect('start.php');if(start.labels.join('|')!=='设置|退出'||start.right<1260||start.right>1291.5||start.ss!=='none'||start.sl!=='none'||start.overflow>1)throw new Error('start '+JSON.stringify(start));
          const watch=await inspect('watch.php');if(watch.labels.join('|')!=='设置|退出'||watch.overflow>1)throw new Error('watch '+JSON.stringify(watch));
          const resp=await p.goto(base+'settings.php',{waitUntil:'networkidle'});if(resp.status()!==200)throw new Error('settings '+resp.status());
          await p.goto(base+'watch.php',{waitUntil:'networkidle'});await p.click('.vf-global-account-actions [data-vf-auth-logout]');await p.waitForSelector('.vf-global-account-actions [data-vf-auth-login]',{timeout:15000});
          await p.click('.vf-global-account-actions [data-vf-auth-login]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          const m=await browser.newContext({viewport:{width:390,height:844}});await m.addCookies(await ctx.cookies());const mp=await m.newPage();await mp.goto(base+'watch.php',{waitUntil:'networkidle'});const mobile=await mp.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect();return{labels:[...c.querySelectorAll('a')].map(a=>a.textContent.trim()),right:r.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(mobile.labels.join('|')!=='设置|退出'||mobile.right<375||mobile.right>390.5||mobile.overflow>1)throw new Error('mobile '+JSON.stringify(mobile));
          console.log('P01_V2477_R2_BROWSER='+JSON.stringify({anon,start,watch,mobile}));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v2477-r2-browser
          grep -F 'P01_V2477_R2_BROWSER=' /tmp/p01-v2477-r2-browser
          echo P01_V2477_R2_BROWSER_GATE=PASS

      - name: Final verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PENDING_ARTIFACT_GATE
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PENDING_ARTIFACT_GATE
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V2477_CANDIDATE_GATE=PASS
          echo FORMAL_RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v2477-r2-server.pid; then kill "$(cat /tmp/p01-v2477-r2-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v2477-r2-* /tmp/changed /tmp/expected /tmp/php-lint