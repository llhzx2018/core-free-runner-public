name: P01 frontend role layout and privacy test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-frontend-unity-test-only.yml']
permissions:
  contents: read
jobs:
  frontend-unity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c661b198d88cf51b7c27d6d004b437ba422484ff
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,openssl
          coverage: none
      - name: Actual role/private badge helper and prior page contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "c661b198d88cf51b7c27d6d004b437ba422484ff"
          for s in FunctionalWorkspaceCore.php FunctionalWorkspaceShell.php ChannelLibraryPage.php WatchMediaLibraryPage.php TopicLibraryPage.php CourseLibraryPage.php ProjectActionCenterPage.php; do
            php -l "product/src/app/$s"
          done
          for t in \
            frontend_shared_owner_guest_visibility_v247390_contract.php \
            channels_private_badge_sparse_state_v247390_contract.php \
            channels_guest_readonly_layout_v247390_contract.php \
            channels_page_full_polish_contract.php \
            channel_card_action_hierarchy_contract.php \
            watch_public_privacy_density_v247390_contract.php \
            watch_page_filter_hierarchy_contract.php \
            watch_page_full_polish_contract.php \
            watch_status_context_badge_contract.php \
            topics_public_date_privacy_v247390_contract.php \
            topics_page_context_closure_contract.php \
            topics_v247158_inline_metadata_contract.php \
            course_guest_owner_storage_contract.php \
            courses_page_full_polish_contract.php \
            course_markdown_reader_contract.php \
            projects_guest_zero_public_scope_v247390_contract.php \
            project_page_context_closure_contract.php \
            projects_dashboard_reframe_v247181_contract.php \
            project_state_language_contract.php \
            project_github_sync_v247177_contract.php \
            public_global_nav_contract.php \
            navigation_page_visual_closure_contract.php \
            navigation_visibility_search_context_v247390_contract.php; do
            php "product/tests/unit/$t"
          done
          python3 - <<'PY'
          from pathlib import Path
          css=Path('product/src/assets/frontend-mature.css').read_text()
          assert css.count('{')==css.count('}')
          assert ':is(.vf-subject-page,.vf-functional-workspace) .vf-visibility-badge{' in css
          print('P01_UNIFIED_FRONTEND_BADGE_CSS=PASS')
          PY
          echo P01_FRONTEND_UNITY_EXACT_SOURCE=PASS
      - name: Erase temporary P01 source
        if: always()
        shell: bash
        run: rm -rf product
