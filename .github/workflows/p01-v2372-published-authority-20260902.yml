name: P01 V2.37.2 Published Authority
on:
  push:
    branches: [release/p01-v2372-hotfix-20260902]
    paths: [.github/workflows/p01-v2372-published-authority-20260902.yml]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 1f5a16796511620760a45cb81b3c8019b91e505b
      RUNTIME_TREE: 70b627513327aee0a37fae245b0f4042ad69b5a4
      PRODUCT_BRANCH: docs/p01-v2372-published-checkpoint-20260902
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2372-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git -C product rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat product/VERSION)" = 2.37.2
          test "$(cat product/src/VERSION.txt)" = 2.37.2
          test "$(git -C product status --porcelain)" = ''
      - name: Apply published authority
        run: python3 runner/scripts/p01_v2372_published_authority.py
      - name: Exact docs-only gate and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.37.2
          test "$(cat src/VERSION.txt)" = 2.37.2
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}" | tee /tmp/p01-v2372-authority-files.txt
          expected=$(cat <<'EOF'
          CHANGELOG.md
          README.md
          VF_PROJECT.json
          docs/README.md
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.37.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          docs/handoff/CURRENT_STATE.md
          EOF
          )
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(src/|VERSION$|database/|migrations/)'; then echo 'runtime/version/schema scope violation' >&2; exit 21; fi
          jq -e '.production_version=="2.37.1" and .published_release.version=="2.37.2" and .published_release.release_id==381010644 and .published_release.release_source=="1f5a16796511620760a45cb81b3c8019b91e505b" and .published_release.runtime_tree=="70b627513327aee0a37fae245b0f4042ad69b5a4" and .published_release.core_updates_manifest_gate==33597620743 and .published_release.production_closure=="PENDING OWNER UPDATE"' VF_PROJECT.json >/dev/null
          grep -F 'V2.37.1 -> V2.37.2 ONLY' README.md >/dev/null
          grep -F 'V2.37.1 → V2.37.2 ONLY' docs/README.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/CURRENT.md docs/evidence/P01_V2.37.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): record V2.37.2 published checkpoint'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:$PRODUCT_BRANCH
          printf 'P01_V2372_PUBLISHED_AUTHORITY=PASS\nCOMMIT=%s\nRUNTIME_TREE=%s\nFILES=7\nOWNER_PRODUCTION=2.37.1\nPUBLISHED_LATEST=2.37.2\nONLINE_UPDATE=2.37.1_TO_2.37.2_ONLY\nOWNER_PRODUCTION_WRITE=NO\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD:src)" | tee /tmp/p01-v2372-authority-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2372-published-authority-${{ github.run_id }}
          path: |
            /tmp/p01-v2372-authority-files.txt
            /tmp/p01-v2372-authority-verdict.txt
          if-no-files-found: warn
          retention-days: 90
