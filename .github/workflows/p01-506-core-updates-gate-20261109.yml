name: P01 506 exact core-updates manifest and PHP regression
on:
  push:
    branches:
      - task/p01-506-channel-fallback-20261109
permissions:
  contents: read
jobs:
  p01-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact core-updates candidate temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 09c45a8680b5928a2788b4ecc059f1481de83b54
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
      - name: Manifest contract + real PHP regression (same native commands)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip jq >/dev/null
          test "$(git -C channel rev-parse HEAD)" = "09c45a8680b5928a2788b4ecc059f1481de83b54"
          (cd channel && python3 scripts/check_manifest_contract.py)
          (cd channel && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd channel && php update-core/php/tests/run.php)
          jq -e '.project_id=="P01" and .current_version=="2.47.505" and .target_version=="2.47.506" and .release_tag=="v2.47.506" and .product_identity=="69a300e7c234bba91ebad36191360343536fd990" and .from_versions==["2.47.505"] and .asset_name=="VF_Start_V2.47.506_UPDATE.zip" and .backup_required==true and .rollback_supported==true' channel/projects/P01.json
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.506 --jq '.id')" = "438730865"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.506 --jq '.object.sha')" = "69a300e7c234bba91ebad36191360343536fd990"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.506 | jq -e --slurpfile manifest channel/projects/P01.json '.assets|map(select(.name==$manifest[0].asset_name and .size==$manifest[0].asset_bytes and .digest==("sha256:"+$manifest[0].asset_sha256)))|length==1'
          echo P01_CORE_UPDATES_506_EXACT_RELEASE_SHA_MANIFEST_PHP=PASS
          echo P01_PRODUCTION_WRITES=NONE
      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf channel
          echo P01_CORE_UPDATES_TEMP_CHECKOUT_CLEANED=YES
