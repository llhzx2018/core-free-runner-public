name: P07 Server Ops RC3 Guarded Auto Backup

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-guarded-auto-backup.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-guarded-auto-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build current RC3 combined runtime tree
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-rc3
          mkdir -p /tmp/p07-rc3
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-rc3/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-rc3/
          chmod +x /tmp/p07-rc3/bin/vfops-auto-backup /tmp/p07-rc3/bin/vfops-storage-setup
          test -f /tmp/p07-rc3/lib/cloudpanel.py
          test -f /tmp/p07-rc3/lib/package.py
          test -f /tmp/p07-rc3/lib/backup_frontend.py
          test "$(cat /tmp/p07-rc3/BUILD_ID)" = '0.1.0-rc3-guided-init15'

      - name: Syntax
        run: |
          set -euo pipefail
          bash -n /tmp/p07-rc3/bin/vfops-auto-backup
          bash -n /tmp/p07-rc3/bin/vfops-storage-setup
          python3 -m py_compile \
            /tmp/p07-rc3/lib/auto_backup.py \
            /tmp/p07-rc3/lib/storage_setup.py \
            /tmp/p07-rc3/lib/google_device_oauth.py \
            /tmp/p07-rc3/lib/package_core.py \
            /tmp/p07-rc3/lib/package.py \
            /tmp/p07-rc3/lib/backup_frontend.py \
            /tmp/p07-rc3/lib/diagnostics.py \
            /tmp/p07-rc3/lib/cloudpanel.py \
            /tmp/p07-rc3/tests/test_google_device_oauth.py \
            /tmp/p07-rc3/tests/test_storage_onboarding_ux.py \
            dist/p07/0.1.0-rc3/tests/test_backup_frontend.py \
            dist/p07/0.1.0-rc3/tests/test_auto_backup_run_now_ux.py

      - name: Guarded scheduler unit gate
        env:
          PYTHONPATH: /tmp/p07-rc3/lib
        run: |
          set -euo pipefail
          python3 dist/p07/0.1.0-rc3/tests/test_auto_backup.py -v

      - name: Real database backup compatibility gate
        env:
          PYTHONPATH: /tmp/p07-rc3/lib
        run: |
          set -euo pipefail
          python3 dist/p07/0.1.0-rc3/tests/test_backup_frontend.py -v
          python3 - <<'PY'
          import backup_frontend, package, package_core
          assert package.build_backup is backup_frontend.build_backup_with_discovery
          assert callable(package_core.build_backup)
          assert package_core.build_backup is not package.build_backup
          PY

      - name: Immediate backup result UX gate
        env:
          P07_RC3_RUNTIME: /tmp/p07-rc3
        run: |
          set -euo pipefail
          sudo -E python3 dist/p07/0.1.0-rc3/tests/test_auto_backup_run_now_ux.py -v

      - name: Storage and guided onboarding gate
        env:
          PYTHONPATH: /tmp/p07-rc3/lib
        run: |
          set -euo pipefail
          python3 dist/p07/0.1.0-rc3/tests/test_storage_setup.py -v
          cd /tmp/p07-rc3
          python3 tests/test_google_device_oauth.py -v
          python3 tests/test_storage_onboarding_ux.py -v

      - name: One-step SOURCE import smoke
        run: |
          set -euo pipefail
          WORK=/tmp/p07-import-smoke
          FAKE="$WORK/fakebin"
          mkdir -p "$FAKE" "$WORK/source" "$WORK/target/root/.config/rclone" "$WORK/target/etc/vf-server-ops"

          cat > "$WORK/source/rclone.conf" <<'EOF'
          [google]
          type = drive
          token = SECRET_TOKEN_MUST_NOT_PRINT
          [google-crypt]
          type = crypt
          remote = google:VF-Server-Ops
          password = SECRET_CRYPT_MUST_NOT_PRINT
          [b2]
          type = b2
          account = test
          key = SECRET_B2_MUST_NOT_PRINT
          [b2-crypt]
          type = crypt
          remote = b2:bucket/VF-Server-Ops
          password = SECRET_CRYPT2_MUST_NOT_PRINT
          EOF
          cat > "$WORK/source/storage.json" <<'EOF'
          {"schema":"vf-server-ops.storage-config.v1","google_pool":[],"backblaze_b2":{}}
          EOF

          cat > "$FAKE/ssh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          args="$*"
          if [[ "$args" == *'printf P07_SOURCE_READY'* ]]; then printf 'P07_SOURCE_READY'; exit 0; fi
          if [[ "$args" == *'rclone config file'* ]]; then printf '/root/.config/rclone/rclone.conf\n'; exit 0; fi
          if [[ "$args" == *'test -s'* ]]; then exit 0; fi
          exit 0
          EOF

          cat > "$FAKE/scp" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          src="${@: -2:1}"
          dst="${@: -1}"
          if [[ "$src" == *'rclone.conf' ]]; then cp "$P07_TEST_SOURCE/rclone.conf" "$dst"; else cp "$P07_TEST_SOURCE/storage.json" "$dst"; fi
          EOF

          cat > "$FAKE/rclone" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == 'config' && "${2:-}" == 'file' ]]; then
            printf 'Configuration file is stored at:\n%s\n' "$P07_TEST_TARGET_RCLONE"
            exit 0
          fi
          exit 0
          EOF
          chmod +x "$FAKE/ssh" "$FAKE/scp" "$FAKE/rclone"

          mv /tmp/p07-rc3/bin/vfops /tmp/p07-rc3/bin/vfops.real
          cat > /tmp/p07-rc3/bin/vfops <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == 'storage' ]]; then
            cfg="${3:-}"
            if [[ "${P07_TEST_POST_FAIL:-0}" == '1' && "$cfg" == "$VFOPS_STORAGE_CONFIG" ]]; then exit 12; fi
            cat <<'JSON'
          {"accounts":[{"provider":"google","enabled":true,"health":"OK"},{"provider":"b2","enabled":true,"health":"OK"}]}
          JSON
            exit 0
          fi
          exec /tmp/p07-rc3/bin/vfops.real "$@"
          EOF
          chmod +x /tmp/p07-rc3/bin/vfops

          TARGET_RCLONE="$WORK/target/root/.config/rclone/rclone.conf"
          TARGET_STORAGE="$WORK/target/etc/vf-server-ops/storage.json"

          printf '3\n192.0.2.10\n\n0\n' | sudo env \
            PATH="$FAKE:$PATH" P07_TEST_SOURCE="$WORK/source" P07_TEST_TARGET_RCLONE="$TARGET_RCLONE" \
            VFOPS_STORAGE_CONFIG="$TARGET_STORAGE" \
            bash /tmp/p07-rc3/bin/vfops-storage-setup > "$WORK/success.out" 2>&1

          sudo cmp "$WORK/source/rclone.conf" "$TARGET_RCLONE"
          sudo cmp "$WORK/source/storage.json" "$TARGET_STORAGE"
          grep -Fq '远程备份配置继承完成' "$WORK/success.out"
          grep -Fq 'Google：READY' "$WORK/success.out"
          grep -Fq 'B2：READY' "$WORK/success.out"
          ! grep -Fq 'SECRET_TOKEN_MUST_NOT_PRINT' "$WORK/success.out"
          ! grep -Fq 'SECRET_B2_MUST_NOT_PRINT' "$WORK/success.out"

          printf 'OLD_RCLONE\n' | sudo tee "$TARGET_RCLONE" >/dev/null
          printf 'OLD_STORAGE\n' | sudo tee "$TARGET_STORAGE" >/dev/null
          printf '3\n192.0.2.10\n\n0\n' | sudo env \
            PATH="$FAKE:$PATH" P07_TEST_SOURCE="$WORK/source" P07_TEST_TARGET_RCLONE="$TARGET_RCLONE" \
            VFOPS_STORAGE_CONFIG="$TARGET_STORAGE" P07_TEST_POST_FAIL=1 \
            bash /tmp/p07-rc3/bin/vfops-storage-setup > "$WORK/rollback.out" 2>&1 || true

          sudo grep -Fxq 'OLD_RCLONE' "$TARGET_RCLONE"
          sudo grep -Fxq 'OLD_STORAGE' "$TARGET_STORAGE"
          grep -Fq '正在恢复安装前配置' "$WORK/rollback.out"
          ! grep -Fq 'SECRET_TOKEN_MUST_NOT_PRINT' "$WORK/rollback.out"
          ! grep -Fq 'SECRET_B2_MUST_NOT_PRINT' "$WORK/rollback.out"
          sudo rm -rf "$WORK/target"
          mv /tmp/p07-rc3/bin/vfops.real /tmp/p07-rc3/bin/vfops

      - name: Contract guard
        run: |
          set -euo pipefail
          ENGINE=/tmp/p07-rc3/lib/auto_backup.py
          MENU=/tmp/p07-rc3/bin/vfops-auto-backup
          SETUP=/tmp/p07-rc3/bin/vfops-storage-setup
          HELPER=/tmp/p07-rc3/lib/storage_setup.py
          OAUTH=/tmp/p07-rc3/lib/google_device_oauth.py
          BACKUP_FRONTEND=/tmp/p07-rc3/lib/backup_frontend.py
          PACKAGE=/tmp/p07-rc3/lib/package.py
          PACKAGE_CORE=/tmp/p07-rc3/lib/package_core.py
          DIAGNOSTICS=/tmp/p07-rc3/lib/diagnostics.py
          grep -Fq 'REMOTE_TARGETS = ["google", "b2"]' "$ENGINE"
          grep -Fq 'SKIPPED_BUSY' "$ENGINE"
          grep -Fq 'P07_AUTO_BACKUP_ALREADY_RUNNING' "$ENGINE"
          grep -Fq 'BACKUP_RESTORE_MIGRATION_OR_STORAGE_ACTIVE' "$ENGINE"
          grep -Fq 'refusing to overwrite a cron file not owned by P07' "$ENGINE"
          grep -Fq 'refusing to remove a cron file not owned by P07' "$ENGINE"
          grep -Fq 'schedule-check' "$ENGINE"
          grep -Fq 'P07 已建议错峰' "$MENU"
          grep -Fq '1. 设置 / 检查 Google + B2' "$MENU"
          grep -Fq '当前网站：已重新读取 CloudPanel 全部站点' "$MENU"
          grep -Fq '首次启用定时备份前，当前全部 CloudPanel 网站必须先完成一次真实双远程备份验证' "$MENU"
          grep -Fq '旧 PASS 不会覆盖新站点' "$MENU"
          grep -Fq '1. 已准备好，一键初始化 Google + B2' "$SETUP"
          grep -Fq '2. 查看准备教程' "$SETUP"
          grep -Fq '3. 从已有 P07 服务器导入' "$SETUP"
          grep -Fq 'Recovery Key：P07 自动生成，无需提前准备' "$SETUP"
          grep -Fq 'secrets.token_urlsafe(48)' "$SETUP"
          ! grep -Fq 'Client Secret（输入不回显）' "$SETUP"
          ! grep -Fq '"client_secret": client_secret' "$OAUTH"
          grep -Fq 'storage_health_pass' "$SETUP"
          grep -Fq 'RCLONE_CONFIG=' "$SETUP"
          grep -Fq 'scope\0drive.file\0' "$SETUP"
          grep -Fq 'TARGET 安装后复核失败，正在恢复安装前配置' "$SETUP"
          grep -Fq 'config", "redacted"' "$HELPER"
          grep -Fq 'secrets_written_to_p07_config' "$HELPER"
          grep -Fq 'PROVENANCE_FRESH = "GUIDED_DEVICE_OAUTH_FRESH"' "$HELPER"
          grep -Fq 'DEFAULT_MACHINE_ID = Path("/etc/machine-id")' "$HELPER"
          grep -Fq 'host_binding' "$HELPER"
          grep -Fq 'setup_provenance' "$HELPER"
          grep -Fq 'https://oauth2.googleapis.com/device/code' "$OAUTH"
          grep -Fq 'https://oauth2.googleapis.com/token' "$OAUTH"
          grep -Fq 'https://www.googleapis.com/auth/drive.file' "$OAUTH"
          grep -Fq 'build_backup_with_discovery' "$PACKAGE"
          grep -Fq 'package_core' "$PACKAGE"
          grep -Fq 'wp-config.php' "$BACKUP_FRONTEND"
          grep -Fq 'DATABASE_URL' "$BACKUP_FRONTEND"
          grep -Fq 'MAX_SCAN_DEPTH = 4' "$BACKUP_FRONTEND"
          grep -Fq '0o600' "$BACKUP_FRONTEND"
          grep -Fq 'portable database recovery credentials unavailable' "$PACKAGE_CORE"
          grep -Fq 'DB_RECOVERY_DISCOVERY_FAILED' "$DIAGNOSTICS"
          grep -Fq 'DB_EXPORT_FAILED' "$DIAGNOSTICS"

      - name: Safety guard
        run: |
          set -euo pipefail
          ENGINE=/tmp/p07-rc3/lib/auto_backup.py
          MENU=/tmp/p07-rc3/bin/vfops-auto-backup
          SETUP=/tmp/p07-rc3/bin/vfops-storage-setup
          HELPER=/tmp/p07-rc3/lib/storage_setup.py
          OAUTH=/tmp/p07-rc3/lib/google_device_oauth.py
          BACKUP_FRONTEND=/tmp/p07-rc3/lib/backup_frontend.py
          ! grep -Eq 'cloudflare|dns.*(write|update|change)|rm[[:space:]]+-rf[[:space:]]+/home' "$ENGINE" "$MENU" "$SETUP" "$HELPER" "$OAUTH" "$BACKUP_FRONTEND"
          ! grep -Eq 'config show|config dump' "$SETUP" "$HELPER"
          ! grep -Fq 'rclone authorize drive' "$SETUP"
          ! grep -Fq 'crypt-recovery.key' "$SETUP"
          ! grep -Eq 'rclone[[:space:]]+config[[:space:]]*$' "$SETUP"
          ! grep -Eq 'eval\(|exec\(|shell=True' "$BACKUP_FRONTEND"
          grep -Fq 'dns_changed' "$ENGINE"
          grep -Fq 'source_deleted' "$ENGINE"
          grep -Fq 'manual_backups_protected' "$ENGINE"
          grep -Fq 'SKIPPED_ON_FAILURE' "$ENGINE"
          grep -Fq 'scp -q -p' "$SETUP"

      - name: RC2/current core regression syntax
        run: |
          set -euo pipefail
          bash -n /tmp/p07-rc3/bin/vfops
          bash -n /tmp/p07-rc3/bin/vfops-auto-backup
          bash -n /tmp/p07-rc3/bin/vfops-storage-setup
          find /tmp/p07-rc3/lib -maxdepth 1 -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_GUARDED_AUTO_BACKUP_GATE=PASS'
