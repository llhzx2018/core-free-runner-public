name: P07 Server Ops RC3 Guarded Auto Backup

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/**'
      - '.github/workflows/p07-server-ops-rc3-guarded-auto-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build RC3 combined runtime tree
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-rc3
          mkdir -p /tmp/p07-rc3
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-rc3/
          mkdir -p /tmp/p07-rc3/bin /tmp/p07-rc3/lib
          cp dist/p07/0.1.0-rc3/overlay/bin/vfops-auto-backup /tmp/p07-rc3/bin/
          cp dist/p07/0.1.0-rc3/overlay/bin/vfops-storage-setup /tmp/p07-rc3/bin/
          cp dist/p07/0.1.0-rc3/overlay/lib/auto_backup.py /tmp/p07-rc3/lib/
          cp dist/p07/0.1.0-rc3/overlay/lib/storage_setup.py /tmp/p07-rc3/lib/
          chmod +x /tmp/p07-rc3/bin/vfops-auto-backup /tmp/p07-rc3/bin/vfops-storage-setup

      - name: Syntax
        run: |
          set -euo pipefail
          bash -n /tmp/p07-rc3/bin/vfops-auto-backup
          bash -n /tmp/p07-rc3/bin/vfops-storage-setup
          python3 -m py_compile /tmp/p07-rc3/lib/auto_backup.py /tmp/p07-rc3/lib/storage_setup.py

      - name: Guarded scheduler unit gate
        env:
          PYTHONPATH: /tmp/p07-rc3/lib
        run: |
          set -euo pipefail
          python3 dist/p07/0.1.0-rc3/tests/test_auto_backup.py -v

      - name: No-secret storage setup gate
        env:
          PYTHONPATH: /tmp/p07-rc3/lib
        run: |
          set -euo pipefail
          python3 dist/p07/0.1.0-rc3/tests/test_storage_setup.py -v

      - name: Contract guard
        run: |
          set -euo pipefail
          ENGINE=/tmp/p07-rc3/lib/auto_backup.py
          MENU=/tmp/p07-rc3/bin/vfops-auto-backup
          SETUP=/tmp/p07-rc3/bin/vfops-storage-setup
          HELPER=/tmp/p07-rc3/lib/storage_setup.py
          grep -Fq 'REMOTE_TARGETS = ["google", "b2"]' "$ENGINE"
          grep -Fq 'SKIPPED_BUSY' "$ENGINE"
          grep -Fq 'P07_AUTO_BACKUP_ALREADY_RUNNING' "$ENGINE"
          grep -Fq 'BACKUP_RESTORE_MIGRATION_OR_STORAGE_ACTIVE' "$ENGINE"
          grep -Fq 'refusing to overwrite a cron file not owned by P07' "$ENGINE"
          grep -Fq 'refusing to remove a cron file not owned by P07' "$ENGINE"
          grep -Fq 'schedule-check' "$ENGINE"
          grep -Fq 'P07 已建议错峰' "$MENU"
          grep -Fq '1. 设置 / 检查 Google + B2' "$MENU"
          grep -Fq 'Google OAuth / B2 Key / crypt 密码只在 rclone 自己的界面处理' "$SETUP"
          grep -Fq 'config", "redacted"' "$HELPER"
          grep -Fq 'secrets_written_to_p07_config' "$HELPER"

      - name: Safety guard
        run: |
          set -euo pipefail
          ENGINE=/tmp/p07-rc3/lib/auto_backup.py
          MENU=/tmp/p07-rc3/bin/vfops-auto-backup
          SETUP=/tmp/p07-rc3/bin/vfops-storage-setup
          HELPER=/tmp/p07-rc3/lib/storage_setup.py
          ! grep -Eq 'cloudflare|dns.*(write|update|change)|rm[[:space:]]+-rf[[:space:]]+/home' "$ENGINE" "$MENU" "$SETUP" "$HELPER"
          ! grep -Eq 'config show|config dump' "$SETUP" "$HELPER"
          grep -Fq 'dns_changed' "$ENGINE"
          grep -Fq 'source_deleted' "$ENGINE"
          grep -Fq 'manual_backups_protected' "$ENGINE"
          grep -Fq 'SKIPPED_ON_FAILURE' "$ENGINE"

      - name: RC2 core regression syntax
        run: |
          set -euo pipefail
          bash -n /tmp/p07-rc3/bin/vfops
          python3 -m py_compile \
            /tmp/p07-rc3/lib/package.py \
            /tmp/p07-rc3/lib/storage.py \
            /tmp/p07-rc3/lib/restore_new.py \
            /tmp/p07-rc3/lib/migrate.py \
            /tmp/p07-rc3/lib/runtime.py \
            /tmp/p07-rc3/lib/transport.py

      - name: Result
        run: echo 'P07_SERVER_OPS_RC3_GUARDED_AUTO_BACKUP_GATE=PASS'
