name: P07 M03 release141 owner one-command trial installer proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-oneclick-owner-trial-proof-20261119.yml'
permissions:
  contents: read
jobs:
  owner-trial-launcher:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout public test workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private Owner trial package and launcher transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: b85eaef142f7e7d25747a60b9136029c0e9c4299
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .private-trial
      - name: Prove exact launcher identity and source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          p=".private-trial/owner-trials/p07-m03-d04/20261119/install-trial.sh"
          test "$(git -C .private-trial rev-parse HEAD)" = "b85eaef142f7e7d25747a60b9136029c0e9c4299"
          python3 -B - "$p" <<'PY'
          import hashlib,sys
          data=open(sys.argv[1],'rb').read()
          sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert sha=="a8e913e97bebadc75f3290c6f164a205348d0089", sha
          PY
          bash -n "$p"
          printf '%s  %s\n' 'b0a060e74515bae377bb12b967d39fee96b9519d0b532dd1eb995574616b119c' \
             '.private-trial/owner-trials/p07-m03-d04/20261119/P07-M03-D04-OWNER-TRIAL-release141.zip' | sha256sum -c - >/dev/null
          echo P07_M03_OWNER_ONECLICK_SOURCE_AND_BIN_IDENTITY=PASS
      - name: Exercise refusals and real isolated trial installation via GitHub private API
        shell: bash
        run: |
          set -Eeuo pipefail
          p="$PWD/.private-trial/owner-trials/p07-m03-d04/20261119/install-trial.sh"
          d="$RUNNER_TEMP/p07-m03-owner-oneclick"
          mkdir -p "$d"
          # The owner can inspect a source BEFORE installing CloudPanel on
          # the genuinely fresh test receiver; no dummy clpctl required.
          test ! -e /usr/local/bin/clpctl
          # Noninteractive invocation must stop before installation.
          if sudo --preserve-env=GH_TOKEN bash "$p" </dev/null > "$d/non-tty.log" 2>&1; then
            echo P07_OWNER_TRIAL_NON_TTY_DENIAL=FAIL
            exit 13
          fi
          test ! -e /opt/vf-server-ops-p07-m03-trial-141
          echo P07_OWNER_TRIAL_NON_TTY_DENIAL=PASS
          # Existing receiver assets refuse even before the interactive prompt.
          sudo mkdir -p /home/p07-proof-guard-user/htdocs/existing.site
          if sudo --preserve-env=GH_TOKEN bash "$p" </dev/null > "$d/occupied.log" 2>&1; then
            echo P07_OWNER_TRIAL_OCCUPIED_RECEIVER_DENIAL=FAIL
            exit 13
          fi
          test ! -e /opt/vf-server-ops-p07-m03-trial-141
          sudo rmdir /home/p07-proof-guard-user/htdocs/existing.site
          sudo rmdir /home/p07-proof-guard-user/htdocs
          sudo rmdir /home/p07-proof-guard-user
          echo P07_OWNER_TRIAL_OCCUPIED_RECEIVER_DENIAL=PASS
          # Allocate a PTY, confirmation is user text, run as root.
          printf 'TEST-EMPTY\n' | script -e -q -c "sudo --preserve-env=GH_TOKEN bash '$p'" /dev/null > "$d/install.log" 2>&1 || {
            python3 -B - "$d/install.log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          markers=("私有仓","构建版本","SH A","SHA-256","未开始安装","试用包","脚本","下载失败","环境","检测到","程序安装","确认","仅在独立","gh:","sudo:","not found","unknown flag","API")
          for line in text.splitlines()[-35:]:
              if ("[P07 试用]" in line or any(k in line for k in markers)) and len(line)<300:
                  print("P07_OWNER_TRIAL_SAFE_DIAGNOSTIC="+re.sub(r"\\x1b\\[[0-9;]*m","",line)[:210])
          PY
            echo P07_OWNER_TRIAL_REAL_INSTALL=BLOCKED
            exit 13
          }
          if ! test -L /usr/local/bin/vfops-p07-m03-trial; then
            grep -F '[P07 试用]' "$d/install.log" | cut -c1-205 | tail -n 12 || true
            echo P07_OWNER_TRIAL_INSTALL_PATH=ABSENT
            exit 13
          fi
          test "$(sudo NO_COLOR=1 /usr/local/bin/vfops-p07-m03-trial --build-id)" = '0.1.0-release141'
          test -f /opt/vf-server-ops-p07-m03-trial-141/.runtime-manifest.gitblob
          test ! -e /opt/vf-server-ops
          test ! -e /usr/local/bin/vfops
          echo P07_OWNER_TRIAL_REAL_ISOLATED_INSTALL=PASS
          # Verify idempotent rejection on second attempt, not replacing files.
          if sudo --preserve-env=GH_TOKEN bash "$p" </dev/null > "$d/repeat.log" 2>&1; then
            echo P07_OWNER_TRIAL_REINSTALL_GUARD=FAIL
            exit 13
          fi
          test "$(sudo NO_COLOR=1 /usr/local/bin/vfops-p07-m03-trial --build-id)" = '0.1.0-release141'
          echo P07_OWNER_TRIAL_REINSTALL_GUARD=PASS
          echo P07_OWNER_TRIAL_REAL_CLOUDPANEL_SITE_CREATE=NOT_RUN
          echo P07_OWNER_TRIAL_OWNER_PRODUCTION=NOT_TOUCHED
      - name: Erase temporary private checkout and owned isolated fixture
        if: always()
        shell: bash
        run: |
          sudo rm -rf -- /opt/vf-server-ops-p07-m03-trial-141 /opt/vf-server-ops-p07-m03-trial-141.previous /opt/vf-server-ops-p07-m03-trial-141.new
          sudo rm -f -- /usr/local/bin/vfops-p07-m03-trial
          rm -rf -- .private-trial "$RUNNER_TEMP/p07-m03-owner-oneclick"
          echo P07_OWNER_TRIAL_PRIVATE_BYTES_AND_FIXTURES_CLEANED=PASS
