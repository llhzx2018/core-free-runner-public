name: P03 Project Intelligence Exact Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-project-intelligence-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-project-intelligence-verify.yml'
      - 'ops/p03/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: f01974aacdff1057a5cf1daf7bc1ed414a646778
  FIXTURE_PASS: VfM-2026-Test-Fixture!
  PHP_TEST_IMAGE: vf-forge-pi-php84

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact private P03 develop source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p03

      - name: Verify exact source identity and repository privacy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          test "$(git remote get-url origin)" = "https://github.com/${P03_REPOSITORY}"
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          EXPECTED_SCHEMA="$(tr -d '\r\n' < database/schema/SCHEMA_VERSION)"
          test "$EXPECTED_VERSION" = '1.36.2'
          test "$EXPECTED_SCHEMA" = '30'
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert p['project_id']=='P03'
          assert p['repository']=='llhzx2018/vf-forge'
          assert p['production_version']=='1.36.2'
          assert p['working_version']=='UNVERSIONED_NEXT'
          assert p['candidate_version']=='NONE'
          assert p['schema_version']==30
          assert p['production_write']=='NO'
          assert p['permanent_boundaries']['project_asset_storage']=='NONE'
          assert p['current_phase']=='PROJECT INTELLIGENCE VERIFICATION'
          print('P03_CURRENT_TRUTH=PASS')
          PY
          python3 scripts/repo_health.py .

      - name: Prepare host analysis tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","curl","sodium","zip"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "HOST_RUNTIME_DEPS=PASS\n";'
          node --version
          python3 --version
          sqlite3 --version

      - name: Build supported PHP 8.4 isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >"$RUNNER_TEMP/Dockerfile.p03-pi" <<'EOF'
          FROM php:8.4-cli-bookworm
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev sqlite3 curl \
            && docker-php-ext-install pdo_sqlite zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build \
            --build-arg "HOST_UID=$(id -u)" \
            --build-arg "HOST_GID=$(id -g)" \
            -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-pi" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "PHP84_RUNTIME=PASS\n";'

      - name: Source schema syntax and Project Intelligence contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          python3 tests/integration/source_integrity_test.py
          python3 tests/unit/schema_contract_test.py
          python3 tests/unit/project_intelligence_contract_test.py
          python3 tests/integration/schema_sqlite_test.py
          find src public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$RUNNER_TEMP/p03-php-lint.log"
          echo "PHP_LINT=PASS count=$(wc -l <"$RUNNER_TEMP/p03-php-lint.log")"
          node --check public/assets/app.js
          node --check public/assets/experience.js
          node --check public/assets/project-intelligence.js
          echo 'JAVASCRIPT_SYNTAX=PASS'
          python3 scripts/build_runtime.py "$RUNNER_TEMP/p03-runtime-requirements" >/dev/null
          test -f "$RUNNER_TEMP/p03-runtime-requirements/intelligence-api.php"
          test -f "$RUNNER_TEMP/p03-runtime-requirements/assets/project-intelligence.js"
          test -f "$RUNNER_TEMP/p03-runtime-requirements/assets/project-intelligence.css"
          test -f "$RUNNER_TEMP/p03-runtime-requirements/app/ProjectIntelligenceService.php"
          docker run --rm -v "$RUNNER_TEMP/p03-runtime-requirements:/app" -w /app "$PHP_TEST_IMAGE" php cli/check-requirements.php
          echo 'RUNTIME_BUILD=PASS'

      - name: Fresh install data security backup restore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          EXPECTED_VERSION="$(tr -d '\r\n' < VERSION)"
          cp tests/maintenance/current_reverify.sh "$RUNNER_TEMP/p03-current-reverify.sh"
          python3 - "$RUNNER_TEMP/p03-current-reverify.sh" "$EXPECTED_VERSION" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); version=sys.argv[2]
          s=p.read_text(encoding='utf-8')
          old="assert d['ok'] and d['version']=='1.35.0'"
          new=f"assert d['ok'] and d['version']=='{version}'"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p03-current-reverify.sh"
          echo 'FRESH_INSTALL_BACKUP_RESTORE=PASS'

      - name: Browser E2E Project Intelligence responsive regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          RUNTIME="$RUNNER_TEMP/p03-browser-runtime"
          DATA_ROOT="$RUNNER_TEMP/p03-browser-private"
          COOKIE="$RUNNER_TEMP/p03-browser-cookies"
          BASE='http://127.0.0.1:18081'
          rm -rf "$RUNTIME" "$DATA_ROOT" "$COOKIE"
          mkdir -p "$DATA_ROOT"
          python3 scripts/build_runtime.py "$RUNTIME" >/dev/null
          docker rm -f p03-pi-browser >/dev/null 2>&1 || true
          docker run -d --rm --name p03-pi-browser -p 18081:18081 \
            -v "$RUNTIME:/app" -v "$DATA_ROOT:$DATA_ROOT" -w /app "$PHP_TEST_IMAGE" \
            php -S 0.0.0.0:18081 -t /app >/dev/null
          trap 'docker logs p03-pi-browser 2>/dev/null || true; docker rm -f p03-pi-browser >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 80); do
            if curl -fsS "$BASE/setup.php" >/dev/null 2>&1; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" = '1'
          curl -fsS -c "$COOKIE" "$BASE/setup.php" -o "$RUNNER_TEMP/p03-browser-setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/p03-browser-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -i -b "$COOKIE" -c "$COOKIE" \
            -H "Origin: $BASE" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF Forge Browser Fixture' \
            --data-urlencode "data_root=$DATA_ROOT" \
            --data-urlencode "password=$FIXTURE_PASS" \
            --data-urlencode "password_confirm=$FIXTURE_PASS" \
            "$BASE/setup.php" >"$RUNNER_TEMP/p03-browser-setup-post.txt"
          grep -Eq '^HTTP/.* 302|^HTTP/.* 303' "$RUNNER_TEMP/p03-browser-setup-post.txt"
          test "$(sqlite3 "$DATA_ROOT/database/"*.sqlite 'pragma integrity_check;')" = 'ok'
          FIXTURE_PASS="$FIXTURE_PASS" node tests/maintenance/browser_reverify.mjs
          docker rm -f p03-pi-browser >/dev/null
          trap - EXIT
          echo 'BROWSER_E2E_RESPONSIVE=PASS'

      - name: Public-safe final evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          echo 'P03_PROJECT_INTELLIGENCE_EXACT_VERIFY=PASS'
          echo "P03_COMMIT=$P03_COMMIT"
          echo "VERSION=$(cat VERSION)"
          echo "SCHEMA=$(cat database/schema/SCHEMA_VERSION)"
          echo 'PRIVATE_SOURCE_PUBLISHED=NO'
          echo 'PRODUCTION_WRITE=NO'
