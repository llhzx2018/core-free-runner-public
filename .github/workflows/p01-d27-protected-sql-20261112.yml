name: P01 D27 installed MariaDB MySQL pre-upgrade snapshot + code switch (temporary)
on:
  push:
    branches:
      - test/p01-d27-protected-sql-20261112
permissions:
  contents: read
jobs:
  p01-d19-real-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Verify registered public-safe runner and fixture identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d27-protected-sql-20261112"
          echo P01_D20_INPUT=SYNTHEIC_ONLY
      - name: Probe private checkout capability without exposing secret
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo P01_D20_PRIVATE_READ=AVAILABLE
      - name: Checkout baseline immutable Laravel private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f9edb978eb9c969bf3460444fd177d7bfb6663af
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout independent candidate immutable Laravel private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8803ca6868ee60e473d6a629d5175e269d5b151b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source, D19 contract, and native parser
        run: |
          set -Eeuo pipefail
          test "$(git -C before rev-parse HEAD)" = "f9edb978eb9c969bf3460444fd177d7bfb6663af"
          test "$(git -C candidate rev-parse HEAD)" = "8803ca6868ee60e473d6a629d5175e269d5b151b"
          test "$(cat before/VERSION)" = "2.47.515"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -l candidate/src/app/next/runtime/ImmutableReleasePrivateLayout.php
          php -l candidate/src/app/next/runtime/InstalledRuntime.php
          php -l candidate/src/app/next/runtime/LaravelBootAuthority.php
          php -l candidate/src/app/next/runtime/CloudPanelSiteActivation.php
          php -l candidate/src/app/next/runtime/CloudPanelFrontControllerPreflight.php
          php -l candidate/src/app/next/runtime/IsolatedRealLaravelRollout.php
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          php -l candidate/tests/compatibility/p01_d20_sql_shared_installed_switch.php
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/tests/compatibility/p01_d27_protected_switch.php
          python3 -m py_compile candidate/tests/compatibility/p01_d20_sql_shared_installed_state.py
          php -l candidate/tests/compatibility/p01_d19_shared_installed_switch.php
          python3 -m py_compile candidate/tests/compatibility/p01_d20_sql_shared_installed_state.py
          php candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          echo P01_D20_EXACT_TWO_SOURCE_SHA=f9edb978eb9c969bf3460444fd177d7bfb6663af:8803ca6868ee60e473d6a629d5175e269d5b151b
      - name: Prepare build-only Composer and PHP runtime
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql")?0:1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          fi
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite")?0:1);'
          echo P01_D20_COMPOSER_ONLY_IN_BUILD=YES
      - name: Pin Node22 for self-contained Vite build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/src/app/next/frontend/package-lock.json
      - name: Two genuine MariaDB and MySQL installed Owner sites across exact-source Laravel code switch
        run: |
          set -Eeuo pipefail
          umask 077
          cleanup() { rm -f -- /tmp/p01-d20-before.zip /tmp/p01-d20-candidate.zip; }
          trap cleanup EXIT
          python3 before/scripts/build_p01_next_clean_full.py build --source-sha f9edb978eb9c969bf3460444fd177d7bfb6663af --output /tmp/p01-d20-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py build --source-sha 8803ca6868ee60e473d6a629d5175e269d5b151b --output /tmp/p01-d20-candidate.zip
          python3 before/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d20-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d20-candidate.zip
          for entry in 'mariadb 3307 p01_d1_test_maria_20261111' 'mysql 3306 p01_d1_test_mysql_20261111'; do
            read -r engine port dbname <<< "$entry"
            # Real service SELECT VERSION + a genuinely clean target schema,
            # no DB creation or destructive cleanup in the migration code.
            ready=NO
            for n in $(seq 1 40); do
              if php -r '
                try {
                  $db=new PDO("mysql:host=127.0.0.1;port=".$argv[1].";dbname=".$argv[2],
                    "root","p01-only-synthetic-test");
                  $v=(string)$db->query("SELECT VERSION()")->fetchColumn();
                  if(($argv[3]==="mariadb")!==str_contains(strtolower($v),"mariadb"))exit(1);
                  $count=(int)$db->query("SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=".$db->quote($argv[2]))->fetchColumn();
                  exit($count===0?0:1);
                }catch(Throwable $e){exit(1);}
              ' "$port" "$dbname" "$engine"; then
                ready=YES;break
              fi
              sleep 1
            done
            test "$ready" = YES
            site="/tmp/p01-d19-sandbox-$(openssl rand -hex 10)"
            mkdir -m 0700 -- "$site" "$site/private" "$site/releases"
            mkdir -m 0700 -- "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af" "$site/releases/8803ca6868ee60e473d6a629d5175e269d5b151b"
            python3 -m zipfile -e /tmp/p01-d20-before.zip "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af"
            python3 -m zipfile -e /tmp/p01-d20-candidate.zip "$site/releases/8803ca6868ee60e473d6a629d5175e269d5b151b"
            test -f "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af/vf-start-next/app/vendor/autoload.php"
            test -f "$site/releases/8803ca6868ee60e473d6a629d5175e269d5b151b/vf-start-next/app/vendor/autoload.php"
            echo "P01_D20_REAL_${engine}_BOTH_EXACT_LARAVEL_ZIPS=VERIFIED"
            P01_D27_PROTECTED_SWITCH=1 python3 candidate/tests/compatibility/p01_d20_sql_shared_installed_state.py \
              "$site" "f9edb978eb9c969bf3460444fd177d7bfb6663af" "8803ca6868ee60e473d6a629d5175e269d5b151b" \
              "$PWD/candidate/tests/compatibility/p01_d20_sql_shared_installed_switch.php" \
              "$engine" "$port" "$dbname"
            echo "P01_D20_REAL_${engine}_SAME_INSTALLED_OWNER_CODE_SWITCH=PASS"
            echo "P01_D27_REAL_${engine}_INSTALLED_PROTECTED_SNAPSHOT_CODE_SWITCH=PASS"
            rm -rf -- "$site"
          done
          echo P01_D20_PHYSICAL_TWO_SQL_ENGINES=PASS
          echo P01_D20_CLOUDPANEL_REAL_VHOST=NOT_PROVEN
          echo P01_D20_SCHEMA_MIGRATION_RESTORE_ATOMIC=NOT_PROVEN
          echo P01_D27_THREE_ENGINE_INSTALL_AND_ATOMIC=NOT_PROVEN
      - name: Re-run D15 D17 D19 safety contracts on current exact source
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d15_write_gate_contract.php
          php candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
          echo P01_D20_EXISTING_RECOVERY_GUARDS=PASS
      - name: Existing Laravel boot, cloud site and full-stack contract regression
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/p01_d10_front_controller_preflight_contract.php
          php tests/unit/p01_d10_deployment_binding_contract.php
          php tests/unit/p01_d10_cli_activation_contract.php
          php tests/unit/p01_d11_laravel_boot_contract.php
          php tests/unit/p01_d11_runtime_source_parse_contract.php
          python3 scripts/check_p01_fullstack_contract.py --database-adapter --database-schema
          python3 -m unittest discover -s tests/architecture -p test_p01_next_full_bundle.py -q
          set +e
          python3 scripts/check_p01_fullstack_contract.py --database-install >/tmp/p01-d19-full-gate.log 2>&1
          full_status=$?
          set -e
          test "$full_status" -ne 0
          rm -f /tmp/p01-d19-full-gate.log
          echo P01_D20_RELATED_BOOT_BUILDER_CONTRACT_REGRESSION=PASS
          echo P01_D20_FORMAL_FULL_GATE=EXPECTED_FAIL_NOT_READY
      - name: Cleanup private source and test records
        if: always()
        run: |
          rm -rf -- before candidate
          echo P01_D20_PRIVATE_SOURCE_PERSISTED=NO
