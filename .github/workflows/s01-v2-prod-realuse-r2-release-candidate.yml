name: S01 V2 Production Real-use R2 Release Candidate

on:
  push:
    branches:
      - task/s01-v2-prod-realuse-r2-gate
    paths:
      - .github/workflows/s01-v2-prod-realuse-r2-release-candidate.yml

permissions:
  contents: read

jobs:
  candidate:
    name: R2 RC (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: aba8b2484dce2209b35adf3fdadc00b395d84461
            head: b51409584d1e8fe80a49d51acc298135986a120d
            version: 1.21.948
            test: tests/s01-c02-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            allowed: includes/admin-v13/views/dashboard.php,assets/css/current/admin-s01-page-body-system-v2.css,tests/s01-c02-page-body-v2-production-realuse-r2-contract.php,VERSION,vf-ops.php,CHANGELOG.md
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: bba828726f96d53f8a73bed58f197e862e10f5a2
            head: 340380cce1fc509a0b0b1fdac068e337cb829002
            version: 1.35.50
            test: tests/s01-c01-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            allowed: src/assets/css/admin/admin-s01-page-body-system-v2.css,tests/s01-c01-page-body-v2-production-realuse-r2-contract.php,VERSION,src/inc/runtime-constants.php,src/style.css,src/theme.json,CHANGELOG.md
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 64efdb3e07e161a25107179613824bce78bbc226
            head: 0dff6b80f85a51353cf9b23541886dba28af29c6
            version: 1.25.53
            test: tests/s01-c03-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            allowed: src/admin/ui-v4/pages/v6-playground.js,src/admin/ui-v4/admin-s01-page-body-system-v2.css,tests/s01-c03-page-body-v2-production-realuse-r2-contract.php,VERSION,src/vf-tool-m3u8.php,CHANGELOG.md

    steps:
      - name: Credential
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact candidate + bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          rm -rf /tmp/src /tmp/src.tar.gz; mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          echo "SOURCE_DIR=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_ENV"

      - name: Identity + contracts
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "$VERSION"
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"
          case "$COMPONENT" in
            OPS)
              grep -F "Version: $VERSION" "$SOURCE_DIR/vf-ops.php"
              grep -F "VF_OPS_VERSION', '$VERSION'" "$SOURCE_DIR/vf-ops.php"
              python3 "$SOURCE_DIR/.github/release/build-ops-package.py" --source "$SOURCE_DIR" --output /tmp/package.zip > /tmp/meta.json
              ;;
            THEME)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/style.css"
              grep -F "VF_THEME_VERSION', '$VERSION'" "$SOURCE_DIR/src/inc/runtime-constants.php"
              ;;
            M3U8)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              grep -F "VF_TOOL_M3U8_VERSION', '$VERSION'" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php "$SOURCE_DIR/tests/unit/package-physical-locator-contract.php"
              php "$SOURCE_DIR/tests/unit/update-schema-authority-contract.php"
              ;;
          esac
          echo "R2_RELEASE_CANDIDATE=PASS"
