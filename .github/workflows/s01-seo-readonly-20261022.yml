name: S01 Theme SEO readonly targeted proof
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-seo-readonly-20261022.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7d9743a0d1fb3bbdffc4b35167fa0aaccc768f35
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact Git identity and targeted source contract
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = 7d9743a0d1fb3bbdffc4b35167fa0aaccc768f35
          php -l target/src/inc/admin/admin-seo-actions.php
          php -l target/tests/seo-workflow-v4-contract.php
          php -l target/src/inc/admin/views/seo.php
          node --check target/src/assets/js/admin/admin-seo.js
          php target/tests/seo-workflow-v4-contract.php
          php target/tests/seo-reference-prototype-v3-contract.php
      - name: Real PHP verify handler auth nonce revision fail-closed zero-write
        run: |
          set -euo pipefail
          php control/lanes/s01-seo-readonly-20261022/server-check.php
      - name: Chromium verifies real SEO admin JavaScript semantics
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          NODE_PATH="$PWD/node_modules" node control/lanes/s01-seo-readonly-20261022/browser.cjs
      - name: Remove private checkout
        if: always()
        run: rm -rf target
