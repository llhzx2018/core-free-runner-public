name: P01 V2.34 Publication
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths: [.github/workflows/p01-v2340-publication-20260830.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api 'repos/llhzx2018/vf-start/contents/VERSION?ref=main' --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.34.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33315452296 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33315524945 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33315611859 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.34.0 >/dev/null 2>&1; then echo 'v2.34.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0 >/dev/null 2>&1; then echo 'v2.34.0 release already exists'; exit 3; fi
          echo P01_V2340_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2340-publish /tmp/p01-v2340-artifact.zip
          mkdir -p /tmp/p01-v2340-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9733294835/zip > /tmp/p01-v2340-artifact.zip
          unzip -q /tmp/p01-v2340-artifact.zip -d /tmp/p01-v2340-publish
          cd /tmp/p01-v2340-publish
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="518d10f446ea85445d1110a3defafc5bcbece473" and .release_tree=="90ffab51a20640a4e3f6f07122a8e6e147592f64" and .runtime_tree=="f3eeb66fbce3949ef50483ac4c5a821edbd15d35" and .source_version=="2.33.0" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.34.0-FORMAL-METADATA.json >/dev/null
          FULL_SHA=$(jq -r .full.sha256 P01-V2.34.0-FORMAL-METADATA.json)
          UPDATE_SHA=$(jq -r .update.sha256 P01-V2.34.0-FORMAL-METADATA.json)
          REPAIR_SHA=$(jq -r .repair.sha256 P01-V2.34.0-FORMAL-METADATA.json)
          test "$(sha256sum VF-Start-V2.34.0-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum VF_Start_V2.34.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum VF-Start-V2.34.0-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum repair-v2.34.0.php | awk '{print $1}')" = "$REPAIR_SHA"
          stat -c '%n %s' VF-Start-V2.34.0-FULL.zip VF_Start_V2.34.0_UPDATE.zip repair-v2.34.0.php | tee /tmp/p01-v2340-asset-sizes.txt
          printf 'FULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\n' "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee /tmp/p01-v2340-publish-sha.env
          echo P01_V2340_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          . /tmp/p01-v2340-publish-sha.env
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.34.0 -f sha=518d10f446ea85445d1110a3defafc5bcbece473 >/tmp/p01-v2340-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2340-tag.json)" = 518d10f446ea85445d1110a3defafc5bcbece473
          cat >/tmp/p01-v2340-notes.md <<'EOF'
          VF Start V2.34.0 聚焦 400+ 资源规模下的日常管理效率。

          - 全局搜索真正跨资源域与分类，不再被当前局部筛选隐式限制。
          - 支持筛选结果跨页全选，并复用统一批量操作链；批量可见范围 Authority 完成收敛。
          - 补齐批量标签、收藏 / Recent 使用效率，以及 Recent 7 / 30 / 90 / 全部时间窗。
          - 中宽度分类搜索与移动端搜索/快捷入口可达性完成收口。
          - Schema 保持 2026082901，无 Migration。
          - 已通过 Product Complete、Unified Candidate、Final Metadata、Formal Artifact、Strict Fresh Install 与 Main Promotion Gate。
          - 支持从 V2.33.0 Atomic 升级；本 Release 不自动写 Owner Production。
          EOF
          cd /tmp/p01-v2340-publish
          gh release create v2.34.0 \
            P01-V2.34.0-ARTIFACT-GATE.json \
            P01-V2.34.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.34.0-FULL.zip \
            VF-Start-V2.34.0-UPDATE.zip \
            VF_Start_V2.34.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.34.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.34.0' --notes-file /tmp/p01-v2340-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0 > /tmp/p01-v2340-release.json
          test "$(jq -r .tag_name /tmp/p01-v2340-release.json)" = v2.34.0
          test "$(jq -r .draft /tmp/p01-v2340-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2340-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2340-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.digest' /tmp/p01-v2340-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.34.0-UPDATE.zip")|.digest' /tmp/p01-v2340-release.json)" = "sha256:${UPDATE_SHA}"
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.34.0-FULL.zip")|.digest' /tmp/p01-v2340-release.json)" = "sha256:${FULL_SHA}"
          test "$(jq -r '.assets[]|select(.name=="repair-v2.34.0.php")|.digest' /tmp/p01-v2340-release.json)" = "sha256:${REPAIR_SHA}"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.34.0 --jq .object.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          jq -r '.id, (.assets[] | [.name,.size,.digest] | @tsv)' /tmp/p01-v2340-release.json | tee /tmp/p01-v2340-publication-readback.txt
          echo P01_V2340_TAG_REMOTE_READBACK=PASS
          echo P01_V2340_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2340-tag.json
            /tmp/p01-v2340-release.json
            /tmp/p01-v2340-asset-sizes.txt
            /tmp/p01-v2340-publish-sha.env
            /tmp/p01-v2340-publication-readback.txt
          if-no-files-found: warn
          retention-days: 90
