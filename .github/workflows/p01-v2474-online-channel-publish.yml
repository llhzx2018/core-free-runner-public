name: P01 V2.47.4 Online Channel Publish

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2474-online-channel-publish.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2474-online-channel-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'temp/p01-v2474-online-channel-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P01_REPO: llhzx2018/vf-start
      P01_MAIN_BEFORE: 1a47650a43be773bd28ec0ee43db7d3020ebb6cf
      PREVIEW_SHA: daa25f55922f9db3b4f47d35dc4794029927c1bf
      PREVIEW_TAG: v2.47.4-preview.1
      STABLE_TAG: v2.47.4
      CORE_REPO: llhzx2018/core-updates
      CORE_MAIN_BEFORE: 624b6fc54f220605a31d3158fbb2a8865fa6194e
      UPDATE_NAME: VF_Start_V2.47.4_UPDATE.zip
      UPDATE_BYTES: '1817545'
      UPDATE_SHA256: d0d50657c3b7069054f51d92e73ecec263f7de6441fefeeeacffcbbcb4e81562
      FULL_NAME: VF-Start-V2.47.4-FULL.zip
      FULL_BYTES: '852772'
      FULL_SHA256: b9a2d27a91544c7cd00d5b2f57c9824a6d8b76a67e82c6056743bfc148eb174e
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and preview identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$P01_MAIN_BEFORE"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/release/v2.47.4-preview-20260910" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$CORE_MAIN_BEFORE"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" >/tmp/stable-tag.json 2>/dev/null; then
            echo 'PUBLISH_BLOCK=STABLE_TAG_ALREADY_EXISTS'
            exit 81
          fi
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/p01-channel-before.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p01-channel-before.json',encoding='utf-8'))
          assert p['project_id']=='P01'
          assert p['current_version']=='2.47.2'
          assert p['target_version']=='2.47.3'
          assert p['release_tag']=='v2.47.3'
          assert p['product_identity']=='62c3edc7178a01b1204811856a8fb7ca2b19ae21'
          assert p['asset_name']=='VF_Start_V2.47.3_UPDATE.zip'
          assert p['asset_sha256']=='666fddaf306e2ef594f9c4609581ac68179f92ccde23f8612e115812d2fd472e'
          print('P01_V2474_CHANNEL_SOURCE_AUTHORITY=PASS')
          PY
          echo P01_V2474_EXACT_AUTHORITY=PASS

      - name: Checkout exact verified preview candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PREVIEW_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: vf-start

      - name: Promote exact candidate to main with current changelog
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
          test "$(git rev-parse HEAD^)" = "$P01_MAIN_BEFORE"
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.4'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.4'
          grep -Fq "define('VF_VERSION', '2.47.4');" src/app/bootstrap.php
          git diff --name-only "$P01_MAIN_BEFORE" "$PREVIEW_SHA" | sort >/tmp/p01-v2474-candidate-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort >/tmp/p01-v2474-candidate-expected
          diff -u /tmp/p01-v2474-candidate-expected /tmp/p01-v2474-candidate-files
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='<!-- P01_V2474_FORMAL_RELEASE_20260910:BEGIN -->'
          if marker in s:
              raise SystemExit('V2.47.4 changelog entry already exists unexpectedly')
          entry='''<!-- P01_V2474_FORMAL_RELEASE_20260910:BEGIN -->
          ## V2.47.4 · 第二层 UX/UI 全局收口 · 2026-09-10

          - 完成 Channels / Watch / Topics / Courses / Projects / Tools / Software 第二层连续 UX/UI 精修与全局一致性收口。
          - 频道、专题、项目、工具、软件的筛选 / 排序 / 搜索 / 当前上下文 / 空状态进一步统一；移动触控与键盘焦点保持可用。
          - Projects 继续只展示可解释、可行动的真实事实，不生成健康度或进度百分比；Tools / Software 继续从 Start canonical data 确定性派生，不形成第二 Data Authority。
          - R20 全局审计为 0-code PASS；发布前纠正 4 个 stale test contracts，产品行为未为测试而改变。
          - Schema `2026090401 -> 2026090401`；Migration `NONE`；在线更新严格单跳 `V2.47.3 -> V2.47.4`。
          - Preview Candidate `daa25f55922f9db3b4f47d35dc4794029927c1bf`；Runner `34534080205` 已通过 changed contracts、核心 integration、Fresh Install、九入口 HTTP smoke、确定性 FULL/UPDATE 打包及远端字节回读。
          - Formal Release / core-updates 发布不代表 Production 已升级；Production 仍需 Owner 在现有后台执行在线更新后另行验证。
          <!-- P01_V2474_FORMAL_RELEASE_20260910:END -->

          '''
          p.write_text(entry+s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = 'CHANGELOG.md'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'release(P01): publish V2.47.4 changelog'
          FORMAL_SHA="$(git rev-parse HEAD)"
          test "$(git diff --name-only "$PREVIEW_SHA" "$FORMAL_SHA")" = 'CHANGELOG.md'
          git push origin "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:${P01_MAIN_BEFORE}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          echo "FORMAL_SHA=$FORMAL_SHA" >> "$GITHUB_ENV"
          echo "P01_V2474_FORMAL_SHA=$FORMAL_SHA"
          echo P01_V2474_MAIN_PROMOTION=PASS

      - name: Download and verify exact preview artifacts
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2474-assets
          mkdir -p /tmp/p01-v2474-assets
          gh release download "$PREVIEW_TAG" --repo "$P01_REPO" --dir /tmp/p01-v2474-assets
          cd /tmp/p01-v2474-assets
          test "$(stat -c '%s' "$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c '%s' "$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA256"
          sha256sum -c "${UPDATE_NAME}.sha256"
          sha256sum -c "${FULL_NAME}.sha256"
          printf '%s  %s\n%s  %s\n' "$FULL_SHA256" "$FULL_NAME" "$UPDATE_SHA256" "$UPDATE_NAME" > SHA256SUMS.txt
          echo P01_V2474_FORMAL_ASSET_FREEZE=PASS

      - name: Create exact formal release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2474-assets
          cat >"$ASSETS/P01-V2.47.4-RELEASE-NOTES.md" <<EOF
          # P01 · VF Start V2.47.4

          发布日期：2026-09-10

          本版完成 R13-R20 第二层 UX/UI 全局收口，重点统一频道、影视、专题、课程、项目、工具、软件的浏览上下文、筛选、排序、空状态、移动触控与键盘可用性。

          - Schema：2026090401 → 2026090401
          - Migration：NONE
          - 支持在线升级：V2.47.3 → V2.47.4
          - FULL：用于全新安装
          - UPDATE：用于现有 V2.47.3 后台在线升级
          - Backup required：true
          - Rollback supported：true
          - Preview Candidate：${PREVIEW_SHA}
          - Formal Source：${FORMAL_SHA}
          - Machine Gate：Runner 34534080205 PASS
          - Production：NOT VERIFIED；发布更新通道不代表线上站点已经升级

          SHA-256：见 SHA256SUMS.txt 及逐资产 .sha256 文件。
          EOF
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          obj={
            'schema':'p01-formal-release/v1',
            'project_id':'P01',
            'version':'2.47.4',
            'formal_source':os.environ['FORMAL_SHA'],
            'preview_candidate':os.environ['PREVIEW_SHA'],
            'machine_gate_run':'34534080205',
            'schema_from':'2026090401','schema_to':'2026090401','migration':'NONE',
            'from_versions':['2.47.3'],
            'backup_required':True,'rollback_supported':True,
            'full_asset':{'name':os.environ['FULL_NAME'],'bytes':int(os.environ['FULL_BYTES']),'sha256':os.environ['FULL_SHA256']},
            'update_asset':{'name':os.environ['UPDATE_NAME'],'bytes':int(os.environ['UPDATE_BYTES']),'sha256':os.environ['UPDATE_SHA256']},
            'production':'NOT_VERIFIED'
          }
          Path('/tmp/p01-v2474-assets/P01-V2.47.4-FORMAL.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          echo P01_V2474_FORMAL_METADATA=PASS

      - name: Publish stable tag and GitHub Formal Release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2474-assets
          gh api --method POST "repos/${P01_REPO}/git/refs" -f ref="refs/tags/${STABLE_TAG}" -f sha="$FORMAL_SHA" >/tmp/p01-v2474-stable-tag.json
          test "$(gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          gh release create "$STABLE_TAG" \
            "$ASSETS/$FULL_NAME" \
            "$ASSETS/${FULL_NAME}.sha256" \
            "$ASSETS/$UPDATE_NAME" \
            "$ASSETS/${UPDATE_NAME}.sha256" \
            "$ASSETS/SHA256SUMS.txt" \
            "$ASSETS/P01-V2.47.4-RELEASE-NOTES.md" \
            "$ASSETS/P01-V2.47.4-FORMAL.json" \
            --repo "$P01_REPO" --title 'VF Start V2.47.4' --notes-file "$ASSETS/P01-V2.47.4-RELEASE-NOTES.md" --verify-tag
          gh api "repos/${P01_REPO}/releases/tags/${STABLE_TAG}" >/tmp/p01-v2474-release.json
          test "$(jq -r '.draft' /tmp/p01-v2474-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v2474-release.json)" = false
          echo "RELEASE_ID=$(jq -r '.id' /tmp/p01-v2474-release.json)" >> "$GITHUB_ENV"
          echo "RELEASED_AT=$(jq -r '.published_at' /tmp/p01-v2474-release.json)" >> "$GITHUB_ENV"
          echo P01_V2474_FORMAL_RELEASE_PUBLISHED=PASS

      - name: Independent stable release remote byte readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          gh api "repos/${P01_REPO}/releases/tags/${STABLE_TAG}" >/tmp/p01-v2474-release-readback.json
          test "$(jq -r '.id' /tmp/p01-v2474-release-readback.json)" = "$RELEASE_ID"
          test "$(jq -r '.prerelease' /tmp/p01-v2474-release-readback.json)" = false
          rm -rf /tmp/p01-v2474-remote
          mkdir -p /tmp/p01-v2474-remote
          gh release download "$STABLE_TAG" --repo "$P01_REPO" --dir /tmp/p01-v2474-remote
          test "$(stat -c '%s' "/tmp/p01-v2474-remote/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "/tmp/p01-v2474-remote/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c '%s' "/tmp/p01-v2474-remote/$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "/tmp/p01-v2474-remote/$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA256"
          UPDATE_ASSET_ID="$(jq -r --arg n "$UPDATE_NAME" '.assets[]|select(.name==$n)|.id' /tmp/p01-v2474-release-readback.json)"
          test -n "$UPDATE_ASSET_ID"
          echo "UPDATE_ASSET_ID=$UPDATE_ASSET_ID" >> "$GITHUB_ENV"
          echo P01_V2474_FORMAL_REMOTE_READBACK=PASS

      - name: Checkout exact core-updates channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_MAIN_BEFORE }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: core-updates

      - name: Publish P01 V2.47.4 backend online update channel
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_MAIN_BEFORE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('projects/P01.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          assert obj['project_id']=='P01'
          assert obj['current_version']=='2.47.2'
          assert obj['target_version']=='2.47.3'
          assert obj['release_tag']=='v2.47.3'
          assert obj['asset_sha256']=='666fddaf306e2ef594f9c4609581ac68179f92ccde23f8612e115812d2fd472e'
          obj.update({
            'current_version':'2.47.3',
            'target_version':'2.47.4',
            'update_type':'ATOMIC',
            'from_versions':['2.47.3'],
            'schema_from':'2026090401','schema_to':'2026090401',
            'repository':'llhzx2018/vf-start',
            'release_tag':'v2.47.4',
            'release_id':int(os.environ['RELEASE_ID']),
            'product_identity':os.environ['FORMAL_SHA'],
            'asset_name':os.environ['UPDATE_NAME'],
            'asset_bytes':int(os.environ['UPDATE_BYTES']),
            'asset_sha256':os.environ['UPDATE_SHA256'],
            'backup_required':True,
            'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],
            'minimum_php':'8.0.0',
            'notes':'P01 · VF Start V2.47.4 第二层 UX/UI 全局收口正式在线升级通道。严格只允许 V2.47.3 → V2.47.4；Schema 2026090401 不变，Migration NONE。Preview Candidate '+os.environ['PREVIEW_SHA']+' / Formal Source '+os.environ['FORMAL_SHA']+'；changed contracts、核心 integration、Fresh Install、九入口 HTTP smoke、确定性 FULL/UPDATE 打包和 GitHub Release 远端字节回读均 PASS（Runner 34534080205 / 当前发布 Gate '+os.environ['GITHUB_RUN_ID']+'）。canonical UPDATE 为 '+os.environ['UPDATE_NAME']+'，Asset ID '+os.environ['UPDATE_ASSET_ID']+'，'+os.environ['UPDATE_BYTES']+' bytes，sha256:'+os.environ['UPDATE_SHA256']+'。backup_required=true，rollback_supported=true。Formal Release / Channel Published 不代表 Production 已升级。'
          })
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'projects/P01.json'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git add projects/P01.json
          git commit -m 'dist(P01): publish V2.47.4 online update channel'
          CHANNEL_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:${CORE_MAIN_BEFORE}"
          echo "CHANNEL_SHA=$CHANNEL_SHA" >> "$GITHUB_ENV"
          echo "P01_V2474_CHANNEL_SHA=$CHANNEL_SHA"
          echo P01_V2474_CORE_UPDATES_PUBLISHED=PASS

      - name: Independent remote channel readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$CHANNEL_SHA"
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/p01-channel-after.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/p01-channel-after.json',encoding='utf-8'))
          assert p['enabled'] is True
          assert p['current_version']=='2.47.3'
          assert p['target_version']=='2.47.4'
          assert p['from_versions']==['2.47.3']
          assert p['schema_from']=='2026090401' and p['schema_to']=='2026090401'
          assert p['release_tag']=='v2.47.4'
          assert p['release_id']==int(os.environ['RELEASE_ID'])
          assert p['product_identity']==os.environ['FORMAL_SHA']
          assert p['asset_name']==os.environ['UPDATE_NAME']
          assert p['asset_bytes']==int(os.environ['UPDATE_BYTES'])
          assert p['asset_sha256']==os.environ['UPDATE_SHA256']
          assert p['backup_required'] is True and p['rollback_supported'] is True
          print('P01_V2474_BACKEND_UPDATE_CHANNEL_READBACK=PASS')
          PY
          echo P01_V2474_ONLINE_CHANNEL_GATE=PASS
          echo PRODUCTION_WRITE=false

      - name: Final verdict
        run: |
          echo P01_V2474_FORMAL_RELEASE=PASS
          echo P01_V2474_BACKEND_UPDATE_PUBLISHED=PASS
          echo OWNER_CAN_NOW_CHECK_UPDATE=true
          echo PRODUCTION_UPGRADE=NOT_PERFORMED

      - name: Cleanup
        if: always()
        run: rm -rf vf-start core-updates /tmp/p01-v2474-* /tmp/p01-channel-*.json
