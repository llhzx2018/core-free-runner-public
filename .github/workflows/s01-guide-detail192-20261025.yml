name: S01 guide detail desktop presentation
on:
  push:
    branches: [task/s01-guide-detail192-final-20261025]
    paths: ['.github/workflows/s01-guide-detail192-20261025.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.192
  TARGET_SHA: f8794897bb3ae090b7c06fd846f0aa2a0ce7d256
  TARGET_TREE: c58f6115942f47df1a61fd6aa950b88d7144531e
  BASE_SHA: 427eb34ef03f93887028df1865eabe2241f9ad33
  SOURCE_VERSION: 1.35.191
  LANE_ID: s01-guide-detail192-20261025
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-detail192-20261025/spec.json --input control/.github/workflows/s01-guide-detail192-20261025.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f8794897bb3ae090b7c06fd846f0aa2a0ce7d256
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-guide-detail192-20261025/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check target/tests/guide-detail-desktop-browser-check.cjs
          node --check target/src/assets/js/main.js
          gh release download v1.35.191 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.191.zip --dir provider
          echo '97f3a8186bd4d69bb16cd882586c42933a7dfd92c722ae8e2afd84e1b821ac22  provider/vf-tools-theme_V1.35.191.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Actual WordPress Guide UX SEO upgrade rollback and data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-guide-detail192-20261025/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-guide-detail192-20261025/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
