name: P07 OneShot v1.0 RC2 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - experiments/p07-v10-rc2-patch.py
      - .github/workflows/p07-v10-rc2-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply RC2 patch
        run: python3 experiments/p07-v10-rc2-patch.py
      - name: Validate RC2
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F '1.0.0-rc2'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          P07_BENCH_DEMO_BACKEND_REASON=RATE_LIMITED ./experiments/p07-bench.sh --demo >/tmp/demo
          grep -F 'US West' /tmp/demo
          grep -F 'US Central' /tmp/demo
          grep -F 'US East' /tmp/demo
          grep -F 'Europe' /tmp/demo
          grep -F 'Asia South' /tmp/demo
          grep -F 'Tokyo' /tmp/demo
          grep -F 'Cloudflare Edge' /tmp/demo
          grep -F 'SUPPLEMENTAL' /tmp/demo
          grep -F -- '--duration 2 --concurrent 2 --chunks 12 --upload-size 512' experiments/p07-bench.sh
          grep -F 'Bangalore, India' experiments/p07-bench.sh
      - name: Commit RC2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): refine global fallback pools v1.0-rc2'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
