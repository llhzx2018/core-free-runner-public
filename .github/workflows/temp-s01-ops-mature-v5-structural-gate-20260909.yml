name: temp-s01-ops-mature-v5-structural-gate-20260909
on:
  push:
    branches:
      - temp/s01-mature-admin-v5-gates-20260909
    paths:
      - .github/workflows/temp-s01-ops-mature-v5-structural-gate-20260909.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      SHA: d497f8da7be3180b15b1c9bf44ce2ad20eef15a6
    steps:
      - name: Gate exact Ops mature V5 structural candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'GATE_MODE=READ_ONLY_EXACT_CANDIDATE MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops-v5
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-v5
          git -C /tmp/ops-v5 checkout -q "$SHA"
          test "$(git -C /tmp/ops-v5 rev-parse HEAD)" = "$SHA"
          test "$(git -C /tmp/ops-v5 merge-base HEAD origin/main)" = 7a0948791a69f62f603de0d187e384c279215536
          php -l /tmp/ops-v5/includes/admin-v13/views/acceptance_source.php >/dev/null
          php -l /tmp/ops-v5/includes/admin-v13/views/seo-keyword-map.php >/dev/null
          php -l /tmp/ops-v5/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php /tmp/ops-v5/tests/mature-product-v5-contract.php
          php /tmp/ops-v5/tests/dashboard-visible-ui-contract.php
          php /tmp/ops-v5/tests/top-domains-visible-ui-contract.php
          php /tmp/ops-v5/tests/admin-human-language-contract.php
          php /tmp/ops-v5/tests/system-components-human-language-contract.php
          php /tmp/ops-v5/tests/update-refresh-policy-current-contract.php
          grep -F "'vf-ops-admin-mature-data-workspaces-v5'" /tmp/ops-v5/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          grep -F 'data-vf-v5-structure="source-acceptance"' /tmp/ops-v5/includes/admin-v13/views/acceptance_source.php >/dev/null
          grep -F 'data-vf-v5-structure="keyword-map"' /tmp/ops-v5/includes/admin-v13/views/seo-keyword-map.php >/dev/null
          grep -F 'vf-source-path-table vf-v5-data-table' /tmp/ops-v5/includes/admin-v13/views/acceptance_source.php >/dev/null
          grep -F 'vf-keyword-map-table vf-v5-data-table' /tmp/ops-v5/includes/admin-v13/views/seo-keyword-map.php >/dev/null
          grep -F 'wp_nonce_field(' /tmp/ops-v5/includes/admin-v13/views/acceptance_source.php >/dev/null
          grep -F 'vf_ops_keyword_map_unassign' /tmp/ops-v5/includes/admin-v13/views/seo-keyword-map.php >/dev/null
          echo 'OPS_SOURCE_ACCEPTANCE_STRUCTURE=PASS'
          echo 'OPS_KEYWORD_MAP_STRUCTURE=PASS'
          echo 'OPS_RUNTIME_HOOKS_PRESERVED=PASS'
          echo 'PASS_S01_OPS_MATURE_V5_STRUCTURAL_GATE'
