name: P01 V2.39.1 Unified Groups Acceptance R2

on:
  push:
    branches:
      - gate/p01-v2391-unified-groups-20260903-r1
    paths:
      - '.github/workflows/p01-v2391-unified-groups-acceptance-r2.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2391-unified-groups-acceptance-r2
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_P01_HEAD: 91bc24a1bc9e635f3d52655298012b7e3c47397b
      P01_REF: product/p01-v2391-unified-groups-production-acceptance-20260903
    steps:
      - name: Require private checkout credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'PRIVATE_CHECKOUT_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact private P01 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Bind exact candidate head
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git -C p01 rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_P01_HEAD"
          echo "P01_EXACT_HEAD=$ACTUAL"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            p01/src/app/ProjectResource.php \
            p01/src/workspace-create.php \
            p01/src/workspace-save.php \
            p01/src/surface-open.php \
            p01/src/workspace-action.php \
            p01/tests/integration/p01_v2391_resource_groups_acceptance.php; do
            php -l "$file"
          done
          echo 'P01_V2391_PHP_LINT=PASS'

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check p01/src/assets/workspace-create-bundle.js
          echo 'P01_V2391_JS_SYNTAX=PASS'

      - name: Five-group authority guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('p01/src/app/SurfaceRepository.php').read_text(encoding='utf-8')
          match=re.search(r"public\s+const\s+SURFACES\s*=\s*\[([^\]]+)\]",p)
          assert match, 'SURFACES authority missing'
          values=re.findall(r"'([^']+)'",match.group(1))
          assert values == ['start','channels','watch','topics','projects'], values
          changed=[
              'src/app/ProjectResource.php','src/workspace-create.php','src/workspace-save.php',
              'src/surface-open.php','src/workspace-action.php','src/assets/workspace-create-bundle.js',
              'tests/integration/p01_v2391_resource_groups_acceptance.php',
          ]
          for rel in changed:
              text=Path('p01',rel).read_text(encoding='utf-8').lower()
              assert "surface'=>'books'" not in text and '"books"' not in text, f'illegal sixth group leaked into {rel}'
          print('P01_V2391_FIVE_GROUP_AUTHORITY=PASS')
          PY

      - name: Unified resource groups integration acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          php p01/tests/integration/p01_v2391_resource_groups_acceptance.php

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf p01
          test ! -e p01
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
