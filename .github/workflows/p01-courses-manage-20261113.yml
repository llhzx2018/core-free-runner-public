name: P01 Courses ZIP Management Exact Source 20261113
on:
  push:
    branches:
      - test/p01-courses-manage-20261113-acdf

permissions:
  contents: read

jobs:
  courses-zip-management:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check registered temporary public-safe lane
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-courses-manage-20261113-acdf"
          test -n "$PRIVATE_READ"
          echo "P01_TASK=COURSE_CREATE_ZIP_CAS_READBACK_AND_SECURITY"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Transient checkout exact private product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: acdf7469ee6e2778e9560f50a23c06092f9ea151
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate identity and required source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "acdf7469ee6e2778e9560f50a23c06092f9ea151"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/frontend/src/OwnerCoursesManage.vue
          test -f candidate/tests/p01_d55_courses_manage.php
          echo "P01_COURSES_EXACT_SOURCE=acdf7469ee6e2778e9560f50a23c06092f9ea151"
      - name: Setup isolated Laravel PHP runtime and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite")&&class_exists("ZipArchive")&&extension_loaded("fileinfo") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-zip php8.3-mbstring >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          php -r 'exit(extension_loaded("pdo_sqlite")&&class_exists("ZipArchive")&&extension_loaded("fileinfo") ? 0 : 1);'
          for f in candidate/src/app/next/OwnerCoursesWorkspace.php candidate/src/app/next/http/OwnerHttpRoutes.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/tests/p01_d55_courses_manage.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          echo "P01_D55_PHP_SYNTAX=PASS"
      - name: Install exact locked Laravel dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next
          composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          echo "P01_D55_LARAVEL_LOCKED_DEPENDENCIES=PASS"
      - name: Exercise real SQLite Course ZIP import replacement and rollback-safe readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d55_courses_manage.php > "$RUNNER_TEMP/p01-d55.txt" 2>&1; then
            echo "P01_D55_COURSE_BUSINESS=FAIL"
            grep -E 'P01 D55 FAIL|P01 D55 UNSAFE|Fatal error|Uncaught|Error|Exception' "$RUNNER_TEMP/p01-d55.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 20 || true
            exit 1
          fi
          grep '^P01_D55_.*=PASS$' "$RUNNER_TEMP/p01-d55.txt"
          echo "P01_D55_COURSE_BUSINESS=PASS"
          if ! php candidate/tests/p01_d53_news_courses.php > "$RUNNER_TEMP/p01-d53.txt" 2>&1; then
            echo "P01_D53_NEWS_COURSE_CONSTRUCTOR_REGRESSION=FAIL"
            grep -E 'D53 FAIL|Uncaught|Fatal error|Exception' "$RUNNER_TEMP/p01-d53.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 18 || true
            exit 1
          fi
          echo "P01_D53_NEWS_COURSE_CONSTRUCTOR_REGRESSION=PASS"
      - name: Vue TS Vitest and Vite production build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D55_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|OwnerCourses|courses-management|App.vue' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 28 || true
            exit 1
          fi
          echo "P01_D55_VUE_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D55_VITEST=FAIL"
            grep -E ' FAIL |Tests |Test Files|AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 22 || true
            exit 1
          fi
          echo "P01_D55_VITEST=PASS"
          if ! npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1; then
            echo "P01_D55_BUILD=FAIL"
            grep -E 'error|failed|Error:' "$RUNNER_TEMP/p01-build.txt" | tail -n 15 || true
            exit 1
          fi
          test -f ../public/build/.vite/manifest.json
          echo "P01_D55_VITE_BUILD=PASS"
      - name: Chromium full workspace E2E and 390 768 1440 screens
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-playwright.txt" 2>&1; then
            echo "P01_D55_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|failed|passed' "$RUNNER_TEMP/p01-playwright.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 38 || true
            exit 1
          fi
          echo "P01_D55_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always clean private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_ARTIFACTS_CREATED=NO"

  courses-final-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Validate temporary exact-source private capability
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-courses-manage-20261113-acdf"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=D55_FRONTEND_FINAL_AFTER_PLAYWRIGHT_TEST_TYPE_IMPORT"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Checkout final private exact source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 327fe7407919d397301fc4d353927f1c48c7f192
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify source and npm lock
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "327fe7407919d397301fc4d353927f1c48c7f192"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test -f candidate/src/app/next/frontend/tests/courses-management.spec.ts
          echo "P01_EXACT_SOURCE=327fe7407919d397301fc4d353927f1c48c7f192"
      - name: Typecheck, unit tests, production Vite compile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D55_FINAL_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|OwnerCourses|courses-management' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 25 || true
            exit 1
          fi
          echo "P01_D55_FINAL_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D55_FINAL_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 20 || true
            exit 1
          fi
          echo "P01_D55_FINAL_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D55_FINAL_VITE_BUILD=PASS"
      - name: Chromium full regression at 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D55_FINAL_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 35 || true
            exit 1
          fi
          echo "P01_D55_FINAL_CHROMIUM_FULL_SUITE=PASS"
      - name: Clean all private test source and temporary files
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PUBLIC_PRIVATE_ARTIFACTS=NONE"
