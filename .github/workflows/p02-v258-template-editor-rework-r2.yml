name: P02 V2.5.8 Template Editor Rework R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v258-template-editor-rework-r2.yml'

permissions:
  contents: read

jobs:
  implement-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUDIT_PASSWORD: P02-V258-TEMPLATE-R2!
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: cd5f5b468c8b65e21e4c8f9b3da4915564fa3dad
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Apply corrected template model
        working-directory: p02
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/app.js'); s=p.read_text(encoding='utf-8')
          a=s.index('const PRESET_CONTENT_TEMPLATES={'); b=s.index('function escapeRegExp',a)
          block=r'''const PRESET_CONTENT_TEMPLATES={
            quick:[
              {id:'todo',title:'待办清单',description:'任务、采购、待处理事项',content:['## 待办','','- [ ] ','- [ ] ','- [ ] ','','## 备注',''].join('\n')},
              {id:'quick-capture',title:'快速记录',description:'临时想法、电话记录、突然想到的事情',content:['## 重点','','','## 补充','','','## 下一步','','- [ ] ',''].join('\n')},
              {id:'steps',title:'步骤清单',description:'安装步骤、操作流程、临时流程',content:['## 目标','','','## 步骤','','1. ','2. ','3. ','','## 结果',''].join('\n')},
              {id:'daily',title:'每日记录',description:'当天重点、待处理和随手记录',content:['## 今天','','','## 待处理','','- [ ] ','','## 记录',''].join('\n')}
            ],
            article:[
              {id:'general',title:'普通整理',description:'最通用的资料与长文整理',content:['> 一句话说明这篇资料是什么。','','## 概述','','','## 正文','','','## 补充',''].join('\n')},
              {id:'howto',title:'教程 / 操作说明',description:'安装、设置、使用方法和操作教程',content:['## 目的','','','## 准备','','','## 操作步骤','','### 1. ','','### 2. ','','### 3. ','','## 验证','','','## 注意事项',''].join('\n')},
              {id:'research',title:'资料整理',description:'收藏资料、网页内容和信息归纳',content:['## 来源','','','## 核心内容','','','## 重点','','- ','','## 我的备注','','','## 相关资料',''].join('\n')},
              {id:'learning',title:'学习 / 课程笔记',description:'课程、视频、文章学习后的长期笔记',content:['## 本节内容','','','## 核心知识','','','## 示例','','','## 易错点','','- ','','## 小结',''].join('\n')}
            ]
          };
          function presetTemplateCardMarkup(kind,template){return '<button type="button" class="preset-template-card" data-preset-kind="'+kind+'" data-preset-template="'+template.id+'"><strong>'+esc(template.title)+'</strong><span>'+esc(template.description)+'</span><small>'+esc(String(template.content||'').split('\n').filter(Boolean).slice(0,3).join('  ·  '))+'</small></button>';}
          function openContentKindPicker(){const body='<div class="preset-kind-grid"><button type="button" class="preset-kind-card" data-preset-kind-choice="quick"><strong>便签</strong><span>快速记录、待办、步骤和每日记录</span></button><button type="button" class="preset-kind-card" data-preset-kind-choice="article"><strong>文章</strong><span>普通整理、教程、资料和学习笔记</span></button></div>';const root=modal('新建内容',body,'<button class="btn secondary" type="button" data-close>取消</button>',{small:true,variant:'preset-kind-dialog'});$$('[data-preset-kind-choice]',root).forEach(button=>button.onclick=()=>{const kind=button.dataset.presetKindChoice==='article'?'article':'quick';const close=$('[data-close]',root);if(close)close.click();openEditor(null,{forceContentMode:kind,forceContentFormat:'markdown'});});}
          function openNewContent(kind){if(kind==='article'||kind==='quick'){openEditor(null,{forceContentMode:kind,forceContentFormat:'markdown'});return;}openContentKindPicker();}
          function normalizedPresetContent(content){return String(content||'').replace(/\\n/g,'\n').replace(/\r\n/g,'\n');}
          function insertPresetTemplateInto(textarea,template){if(!textarea||!template)return;const form=textarea.closest('form');const format=form?form.querySelector('[name="content_format"]'):null;if(format&&format.value!=='markdown'){format.value='markdown';format.dispatchEvent(new Event('change',{bubbles:true}));}const content=normalizedPresetContent(template.content).replace(/\s+$/,'');const value=String(textarea.value||'');const start=Number.isFinite(textarea.selectionStart)?textarea.selectionStart:value.length;const end=Number.isFinite(textarea.selectionEnd)?textarea.selectionEnd:start;const before=value.slice(0,start),after=value.slice(end);const lead=before?(before.endsWith('\n\n')?'':before.endsWith('\n')?'\n':'\n\n'):'';const tail=after?(after.startsWith('\n\n')?'':after.startsWith('\n')?'\n':'\n\n'):'';const inserted=lead+content+tail;textarea.value=before+inserted+after;const contentStart=before.length+lead.length;const firstGap=content.indexOf('\n\n');const cursor=firstGap>=0?contentStart+firstGap+2:contentStart+content.length;textarea.setSelectionRange(cursor,cursor);textarea.dispatchEvent(new Event('input',{bubbles:true}));textarea.focus({preventScroll:true});}
          function openPresetInsertPicker(kind,textarea){kind=kind==='article'?'article':'quick';const label=kind==='article'?'文章':'便签';const cards=PRESET_CONTENT_TEMPLATES[kind].map(template=>presetTemplateCardMarkup(kind,template)).join('');const body='<div class="preset-template-intro"><p>选择一个常用结构，插入到当前光标位置。模板只是 Markdown 骨架，插入后可以任意修改。</p></div><div class="preset-template-grid">'+cards+'</div>';const root=modal('插入'+label+'模板',body,'<button class="btn secondary" type="button" data-close>取消</button>',{variant:'preset-template-dialog'});$$('[data-preset-template]',root).forEach(button=>button.onclick=()=>{const template=PRESET_CONTENT_TEMPLATES[kind].find(entry=>entry.id===button.dataset.presetTemplate);const close=$('[data-close]',root);if(close)close.click();if(template)insertPresetTemplateInto(textarea,template);});}
          window.VfLibraryOpenPresetInsertPicker=openPresetInsertPicker;
          '''
          s=s[:a]+block+s[b:]; p.write_text(s,encoding='utf-8')

          p=Path('public/assets/editor-enhancements.js'); s=p.read_text(encoding='utf-8')
          old="""    if (action === 'font-smaller') return writeSize(readSize() - STEP);\n    if (action === 'font-larger') return writeSize(readSize() + STEP);\n"""
          new="""    if (action === 'template') {\n      const form = textarea.closest('form');\n      const mode = form ? form.querySelector('[name=\"content_mode\"]') : null;\n      const kind = textarea.id === 'articleSource' || (mode && mode.value === 'article') ? 'article' : 'quick';\n      if (typeof window.VfLibraryOpenPresetInsertPicker === 'function') return window.VfLibraryOpenPresetInsertPicker(kind, textarea);\n      return;\n    }\n    if (action === 'font-smaller') return writeSize(readSize() - STEP);\n    if (action === 'font-larger') return writeSize(readSize() + STEP);\n"""
          assert s.count(old)==1,s.count(old); s=s.replace(old,new)
          old="""    return '<div class=\"vf-editor-toolbar\" role=\"toolbar\" aria-label=\"正文编辑工具\">' +\n      '<div class=\"vf-editor-toolbar-group vf-editor-font-control\" role=\"group\" aria-label=\"编辑显示字号\">' +\n"""
          new="""    return '<div class=\"vf-editor-toolbar\" role=\"toolbar\" aria-label=\"正文编辑工具\">' +\n      '<div class=\"vf-editor-toolbar-group vf-editor-template-control\" role=\"group\" aria-label=\"模板\">' +\n        button('template', '模板⌄', '插入常用模板', ' class=\"vf-template-button\"') +\n      '</div>' +\n      '<span class=\"vf-editor-toolbar-sep\" aria-hidden=\"true\"></span>' +\n      '<div class=\"vf-editor-toolbar-group vf-editor-font-control\" role=\"group\" aria-label=\"编辑显示字号\">' +\n"""
          assert s.count(old)==1,s.count(old); s=s.replace(old,new); p.write_text(s,encoding='utf-8')
          PY
          cat >> public/assets/editor-enhancements.css <<'CSS'

          /* V2.5.8 · template insertion lives in the editor */
          .vf-editor-template-control{flex:0 0 auto}
          .vf-editor-toolbar .vf-template-button{font-weight:650;padding-inline:10px;color:var(--teal,#0f766e)}
          CSS
          printf '2.5.8\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8'); entry='''# VF Library V2.5.8 · Editor Template Insert Model · Candidate · 2026-08-19\n\n- 顶部“新增”恢复为简单的“便签 / 文章”二选一，不在新建入口选择模板。\n- 预设模板入口移动到正文编辑工具栏，可在编辑过程中按当前内容类型插入模板。\n- 修复模板换行转义错误，不再在正文中显示字面 `\\n`。\n- 继续保持 4 个便签 + 4 个文章个人高频预设，不增加凑数模板。\n- 模板插入后就是普通 Markdown，可继续自由编辑；Schema 2401，无 Migration。\n\n'''; p.write_text(entry+s,encoding='utf-8')
          PY
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js

      - name: Manifest and repository gates
        working-directory: p02
        run: |
          set -Eeuo pipefail
          DEP="$RUNNER_TEMP/deploy258"; bash scripts/build-deploy-tree.sh "$DEP" >/dev/null
          python3 - "$DEP" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          dep=Path(sys.argv[1]); repo=Path.cwd(); old=json.loads((repo/'SOURCE_MANIFEST.json').read_text(encoding='utf-8')); mapping={e['full_path']:e['repo_path'] for e in old['entries']}; out=[]
          for f in sorted(x for x in dep.rglob('*') if x.is_file()):
              rel=f.relative_to(dep).as_posix(); assert rel in mapping,rel; rp=repo/mapping[rel]; b=f.read_bytes(); rb=rp.read_bytes(); h=lambda x:hashlib.sha256(x).hexdigest(); out.append({'full_path':rel,'repo_path':mapping[rel],'bytes':len(b),'sha256':h(b),'repo_sha256':h(rb)})
          (repo/'SOURCE_MANIFEST.json').write_text(json.dumps({'project':'P02 · VF Library','version':'2.5.8','schema':2401,'source_baseline_full_sha256':'PENDING_FORMAL_CANDIDATE_ARTIFACT','mapping_contract':'Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.8 candidate deploy tree. Formal release identity is not assigned by this candidate manifest.','runtime_source_file_count':len(out),'entries':out},ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
          python3 scripts/repository-gates.py
          test "$(cat VERSION)" = 2.5.8

      - name: Fresh install and Chrome regression
        working-directory: p02
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/v258"; SITE="$ROOT/site"; mkdir -p "$SITE"; bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S 127.0.0.1:18279 -t "$SITE" >/dev/null 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18279/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18279/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18279' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18279/setup.php)" = 303
          npm install --no-save playwright-core@1.55.0 >/dev/null
          cat > .verify258.mjs <<'JS'
          import {chromium} from 'playwright-core';
          const b=await chromium.launch({channel:'chrome',headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));
          await p.goto('http://127.0.0.1:18279/',{waitUntil:'networkidle'});let sess=await p.evaluate(async()=>await(await fetch('/api.php?action=session')).json());if(!sess.site.auth){await p.locator('[data-open-login]').click();await p.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await p.locator('#loginSubmit').click();await p.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json()).site.auth));}
          async function chooseKind(kind){await p.locator('#addContentBtn').click();const m=p.locator('.modal.preset-kind-dialog');await m.waitFor();if(await m.locator('[data-preset-kind-choice]').count()!==2)throw Error('kind chooser mismatch');if(await m.locator('[data-preset-template]').count())throw Error('template leaked into create chooser');await m.locator('[data-preset-kind-choice="'+kind+'"]').click();const e=p.locator('.content-editor');await e.waitFor();return e;}
          let e=await chooseKind('quick');if((await e.inputValue())!=='')throw Error('quick not blank');let t=e.locator('xpath=..').locator('[data-vf-editor-action="template"]');await t.click();let m=p.locator('.modal.preset-template-dialog');await m.waitFor();if(await m.locator('[data-preset-template]').count()!==4)throw Error('quick template count');await m.locator('[data-preset-template="quick-capture"]').click();let v=await e.inputValue();if(!v.includes('## 重点\n\n')||v.includes('\\n'))throw Error('quick literal slash-n');await e.fill('已有内容');await e.evaluate(el=>el.setSelectionRange(el.value.length,el.value.length));await t.click();await p.locator('.modal.preset-template-dialog [data-preset-template="todo"]').click();v=await e.inputValue();if(!v.startsWith('已有内容\n\n## 待办\n\n- [ ]'))throw Error('cursor insertion');
          await p.locator('#editorCancel').evaluate(el=>el.click());await p.waitForTimeout(150);if(await p.locator('.system-dialog').count())await p.locator('.system-dialog [data-dialog-confirm]').click();await p.waitForTimeout(200);
          e=await chooseKind('article');if((await e.inputValue())!=='')throw Error('article not blank');const mode=await p.locator('#contentForm [name="content_mode"]').inputValue();if(mode!=='article')throw Error('article content_mode mismatch');t=e.locator('xpath=..').locator('[data-vf-editor-action="template"]');await t.click();m=p.locator('.modal.preset-template-dialog');await m.waitFor();if(!(await m.locator('text=教程 / 操作说明').count()))throw Error('article templates not selected');await m.locator('[data-preset-template="howto"]').click();v=await e.inputValue();if(!v.includes('## 操作步骤\n\n### 1. ')||v.includes('\\n'))throw Error('article literal slash-n');if(await p.locator('#addContentMenuBtn').isVisible())throw Error('redundant add dropdown visible');if(errs.length)throw Error(errs.join(' | '));
          console.log('V258_KIND_ONLY_CREATE=PASS');console.log('V258_TEMPLATE_TOOLBAR=PASS');console.log('V258_QUICK_ARTICLE_PRESETS=PASS');console.log('V258_LITERAL_BACKSLASH_N=ABSENT');console.log('V258_CURSOR_INSERT=PASS');await b.close();
          JS
          node .verify258.mjs
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.8" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$(cat "$ROOT/pid")"
          echo V258_R2_BROWSER=PASS
          echo PRODUCTION_WRITE=NO

      - name: Push verified candidate
        working-directory: p02
        env:
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          git config user.name 'VF Release Bot'; git config user.email 'vf-release-bot@users.noreply.github.com'
          git add public/assets/app.js public/assets/editor-enhancements.js public/assets/editor-enhancements.css VERSION CHANGELOG.md SOURCE_MANIFEST.json
          git diff --cached --check
          git commit -m 'fix(v2.5.8): move presets into editor insertion flow'
          gh auth setup-git
          git push https://github.com/llhzx2018/vf-library.git HEAD:task/v2.5.8-template-editor-rework
          echo PRODUCT_CANDIDATE_COMMIT=$(git rev-parse HEAD)
          echo PRODUCTION_WRITE=NO
