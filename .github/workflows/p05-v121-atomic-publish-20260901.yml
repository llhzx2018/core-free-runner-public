name: P05 V1.2.1 Atomic Asset Publication

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v121-atomic-publish-20260901.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v121-atomic-publish-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATOMIC_RUN: '33528399760'
      ATOMIC_JOB: '99925003655'
      ATOMIC_ARTIFACT_ID: '9808669255'
      ATOMIC_ARTIFACT_NAME: P05_V1.2.1_VPS_ATOMIC_ffe287bbfbeaaa23503253a6382b89c210348098
      RELEASE_ID: '380637362'
      RELEASE_TAG: v1.2.1
      RELEASE_TARGET: 295cce5530f65b60365c2231258f4cb3823a3dc9
      FULL_NAME: VF_SEO_V1.2.1_FULL.zip
      FULL_SHA256: e52cc497bd225cd24d2bd31075166c43cc9707527e3653c59943b7c6906bff20
      UPDATE_SHA256: 0495d8fa29aa4438511d932c246cea0516287873662f117134bd43e218149823
      UPDATE_BYTES: '1161793'
      REPAIR_SHA256: de823b2a592e2a6096ed29b28d8eef754685e59038c3e6b734ac5a2fc2ab1908
      REPAIR_BYTES: '3646962'
      SELFTEST_SHA256: 9320a49fc71a87fe9d1d89484776a074941dee07bf3aa5a921e7b2124e8c59d8
    steps:
      - name: Bind exact Atomic PASS and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ATOMIC_ARTIFACT_ID" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); art=json.load(open('/tmp/artifact.json'))
          assert run['id']==int(os.environ['ATOMIC_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['ATOMIC_JOB']) and job['run_id']==int(os.environ['ATOMIC_RUN']) and job['conclusion']=='success' and job['name']=='atomic'
          assert art['id']==int(os.environ['ATOMIC_ARTIFACT_ID']) and art['name']==os.environ['ATOMIC_ARTIFACT_NAME'] and not art['expired']
          print('P05_V121_ATOMIC_EVIDENCE_BINDING=PASS')
          PY

      - name: Download exact Atomic evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic
          gh run download "$ATOMIC_RUN" --repo llhzx2018/core-free-runner-public --name "$ATOMIC_ARTIFACT_NAME" --dir /tmp/p05-atomic
          find /tmp/p05-atomic -maxdepth 2 -type f -printf '%f\n' | sort

      - name: Verify exact six Atomic assets
        run: |
          set -Eeuo pipefail
          cd /tmp/p05-atomic
          for f in repair-v1.2.1.php VF_SEO_V1.2.1_UPDATE.zip atomic-self-test.json P05-V1.2.1-ATOMIC-METADATA.json P05-V1.2.1-ATOMIC-GATE.json SHA256SUMS.txt; do test -s "$f"; done
          test "$(sha256sum VF_SEO_V1.2.1_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c%s VF_SEO_V1.2.1_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum repair-v1.2.1.php | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(stat -c%s repair-v1.2.1.php)" = "$REPAIR_BYTES"
          test "$(sha256sum atomic-self-test.json | awk '{print $1}')" = "$SELFTEST_SHA256"
          python3 - <<'PY'
          import json
          gate=json.load(open('P05-V1.2.1-ATOMIC-GATE.json'))
          meta=json.load(open('P05-V1.2.1-ATOMIC-METADATA.json'))
          assert gate['project_id']=='P05' and gate['source_version']=='1.1.12' and gate['target_version']=='1.2.1' and gate['result']=='PASS'
          for k in ['self_test','actual_upgrade','data_preservation','idempotence','rollback','interruption_recovery','browser_single_php','proxy_https_same_origin']:
              assert gate[k]=='PASS', (k,gate.get(k))
          assert gate['production_write']==0 and gate['distribution_revision']=='R2'
          assert meta['source_version']=='1.1.12' and meta['target_version']=='1.2.1' and meta['status']=='FORMAL_ATOMIC_ARTIFACT_GATE_PASS'
          assert meta['proxy_https_same_origin']=='PASS' and meta['distribution_revision']=='R2' and meta['production_write']==0
          print('P05_V121_ATOMIC_SIX_ASSETS_LOCAL=PASS')
          PY
          sha256sum repair-v1.2.1.php VF_SEO_V1.2.1_UPDATE.zip atomic-self-test.json P05-V1.2.1-ATOMIC-METADATA.json P05-V1.2.1-ATOMIC-GATE.json SHA256SUMS.txt > /tmp/local-six.sha256
          cat /tmp/local-six.sha256

      - name: Verify formal Release before supplemental write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          forbidden=['repair-v1.2.1.php','VF_SEO_V1.2.1_UPDATE.zip','atomic-self-test.json','P05-V1.2.1-ATOMIC-METADATA.json','P05-V1.2.1-ATOMIC-GATE.json','SHA256SUMS.txt']
          assert all(x not in a for x in forbidden), [x for x in forbidden if x in a]
          print('P05_V121_RELEASE_PRE_SUPPLEMENT=PASS')
          PY

      - name: Publish exact Atomic assets to v1.2.1 Release
        working-directory: /tmp/p05-atomic
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" --repo llhzx2018/vf-seo \
            VF_SEO_V1.2.1_UPDATE.zip \
            repair-v1.2.1.php \
            atomic-self-test.json \
            P05-V1.2.1-ATOMIC-METADATA.json \
            P05-V1.2.1-ATOMIC-GATE.json \
            SHA256SUMS.txt
          echo 'P05_V121_ATOMIC_RELEASE_UPLOAD=PASS'

      - name: Remote readback all v1.2.1 Release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os,hashlib,pathlib
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.1.php','VF_SEO_V1.2.1_UPDATE.zip','atomic-self-test.json','P05-V1.2.1-ATOMIC-METADATA.json','P05-V1.2.1-ATOMIC-GATE.json','SHA256SUMS.txt']
          for name in names:
              p=pathlib.Path('/tmp/p05-atomic')/name
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert a[name]['digest']=='sha256:'+digest, (name,a[name].get('digest'),digest)
              assert a[name]['size']==p.stat().st_size
              print(f'P05_ASSET_{name}_ID={a[name]["id"]}')
          assert a['VF_SEO_V1.2.1_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          assert a['repair-v1.2.1.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V121_ATOMIC_RELEASE_REMOTE_READBACK=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY
