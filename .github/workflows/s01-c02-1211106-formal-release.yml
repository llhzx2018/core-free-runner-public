name: S01 C02 1211106 Formal Release
on:
  push:
    branches: [task/s01-c02-1211106-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1106'
      TARGET_SHA: '8d71933d5a200b22ea50ffdb928e806e888cbe3e'
      MAIN_SHA: '5504f3bbe1527ce0daf5eed4e2362a5847481816'
      TARGET_TREE: '96a5f022c1a7036f95532a0feb1b341ef20cae10'
      RELEASE_TAG: 'v1.21.1106'
      RUN_ID: '38231711880'
      ARTIFACT_ID: '11739590666'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Validate the final release lane identity
        run: |
          python3 runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/s01-c02-1211106/formal-spec.json
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c02-1211106/formal-spec.json --input runner/.github/workflows/s01-c02-1211106-formal-release.yml
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8d71933d5a200b22ea50ffdb928e806e888cbe3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211106/formal-release.sh
          bash runner/lanes/s01-c02-1211106/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211106-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30

