name: TEMP S01-C02 Ops 1.21.800 Discovery Cache Gate

on:
  push:
    branches:
      - temp/s01-c02-v121800-discovery-cache-gate-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121800-discovery-cache-gate.yml'

permissions:
  contents: read

jobs:
  discovery-cache-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BASE_ASSET_ID: '543854527'
      BASE_ASSET_BYTES: '3202939'
      BASE_ASSET_SHA256: e2d96560a2bc9dfb2779e07d6754cd3fa21bbf74ad23ebbe4de3a5ec975e0510
      TARGET_ASSET_ID: '544086359'
      TARGET_VERSION: '1.21.801'
      WP_PATH: /tmp/vf-ops-v121800-discovery-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121800-discovery-evidence

    steps:
      - name: Install WordPress 7.1
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Discovery Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1

      - name: Download and install exact Production 1.21.800 release ZIP
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          curl -fsSL -L --retry 3 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${BASE_ASSET_ID}" \
            -o /tmp/vf-tools-ops_V1.21.800.zip
          test "$(stat -c '%s' /tmp/vf-tools-ops_V1.21.800.zip)" = "$BASE_ASSET_BYTES"
          test "$(sha256sum /tmp/vf-tools-ops_V1.21.800.zip | awk '{print $1}')" = "$BASE_ASSET_SHA256"
          unzip -tq /tmp/vf-tools-ops_V1.21.800.zip >/dev/null
          unzip -q /tmp/vf-tools-ops_V1.21.800.zip -d "$WP_PATH/wp-content/plugins"
          wp plugin activate vf-ops --path="$WP_PATH"
          test "$(wp plugin get vf-ops --field=version --path="$WP_PATH")" = '1.21.800'
          echo EXACT_PRODUCTION_1_21_800=PASS

      - name: Prove forced manifest read sees released 1.21.801
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            $r=vf_ops_wp_update_manual_check_v1();
            $out=["credential"=>VF_WP_Update_Credential_V1::redacted_status(),"ok"=>!empty($r["ok"]),"status"=>(string)($r["status"]??""),"target"=>(string)($r["manifest"]["target_version"]??""),"from"=>(array)($r["manifest"]["from_versions"]??[]),"tag"=>(string)($r["manifest"]["release_tag"]??""),"asset"=>(string)($r["manifest"]["asset_name"]??""),"asset_api"=>(string)($r["release"]["asset_api_url"]??"")];
            echo json_encode($out);' > "$EVIDENCE_DIR/forced-manifest.json"
          cat "$EVIDENCE_DIR/forced-manifest.json"
          jq -e --arg aid "$TARGET_ASSET_ID" '.credential.configured==true and .ok==true and .status=="UPDATE_AVAILABLE" and .target=="1.21.801" and .from==["1.21.800"] and .tag=="v1.21.801" and .asset=="vf-tools-ops_V1.21.801.zip" and (.asset_api|endswith("/releases/assets/"+$aid))' "$EVIDENCE_DIR/forced-manifest.json" >/dev/null
          echo REMOTE_1_21_801_DISCOVERY=PASS

      - name: Prove stale VF manifest cache suppresses normal WordPress offer
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            $stale=["enabled"=>true,"target_version"=>"1.21.800","from_versions"=>["1.21.799"],"minimum_php"=>"8.2","minimum_wordpress"=>"6.5"];
            set_site_transient("vf_s01_c02_update_manifest_v1",$stale,900);
            delete_site_transient("update_plugins");
            wp_update_plugins();
            $t=get_site_transient("update_plugins");
            $key=VF_Ops_Update_Contract_V1::PLUGIN_FILE;
            $offered=is_object($t)&&isset($t->response[$key]);
            echo json_encode(["offered"=>$offered,"key"=>$key,"cachedTarget"=>(string)(get_site_transient("vf_s01_c02_update_manifest_v1")["target_version"]??"")]);' > "$EVIDENCE_DIR/stale.json"
          cat "$EVIDENCE_DIR/stale.json"
          jq -e '.offered==false and .key=="vf-ops/vf-ops.php" and .cachedTarget=="1.21.800"' "$EVIDENCE_DIR/stale.json" >/dev/null
          echo STALE_VF_CACHE_SUPPRESSES_OFFER=PASS

      - name: Prove clearing both cache layers rebuilds native 1.21.801 offer
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            delete_site_transient("update_plugins");
            VF_Ops_Update_Client_V1::clear_cache();
            wp_update_plugins();
            $t=get_site_transient("update_plugins");
            $key=VF_Ops_Update_Contract_V1::PLUGIN_FILE;
            $item=(is_object($t)&&isset($t->response[$key]))?$t->response[$key]:null;
            echo json_encode(["offered"=>is_object($item),"key"=>$key,"new_version"=>is_object($item)?(string)($item->new_version??""):"","package"=>is_object($item)?(string)($item->package??""):"","status"=>VF_Ops_Update_Client_V1::status()]);' > "$EVIDENCE_DIR/refreshed.json"
          cat "$EVIDENCE_DIR/refreshed.json"
          jq -e --arg aid "$TARGET_ASSET_ID" '.offered==true and .key=="vf-ops/vf-ops.php" and .new_version=="1.21.801" and (.package|endswith("/releases/assets/"+$aid)) and .status.last_attempt.stage=="DISCOVERY" and .status.last_attempt.result=="UPDATE_AVAILABLE"' "$EVIDENCE_DIR/refreshed.json" >/dev/null
          echo BOTH_CACHE_LAYERS_REFRESHED=PASS
          echo PASS_V121800_TO_V121801_DISCOVERY_CACHE_GATE | tee "$EVIDENCE_DIR/final.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121800-discovery-cache-gate
          path: /tmp/vf-ops-v121800-discovery-evidence/
          retention-days: 14
