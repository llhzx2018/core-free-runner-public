name: P02 V2.5.18 Final Candidate Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REF: 687e9006050d409aa00829e86fb6082547c4e570
    steps:
      - name: Require registered private capability
        env:
          READ_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$READ_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and static UX contract
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = 2.5.18
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.18
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74
          test "$(jq -r .repo_sha256 SOURCE_MANIFEST.json)" = "$(sha256sum SOURCE_MANIFEST.txt|awk '{print $1}')"
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          assert len(m['entries'])==74
          for e in m['entries']:
              b=pathlib.Path(e['repo_path']).read_bytes(); h=hashlib.sha256(b).hexdigest()
              assert len(b)==e['bytes'], e['repo_path']
              assert h==e['sha256']==e['repo_sha256'], e['repo_path']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          PY
          node --check public/assets/v254-common-branding.js
          node --check public/assets/scratch-tabs.js
          grep -q 'V2.5.18_SCRATCH_TAB_OVERFLOW_UX' public/assets/v254-common-branding.js
          grep -q "tabsScroll.addEventListener('wheel'" public/assets/scratch-tabs.js
          grep -q "scrollIntoView({block:'nearest',inline:'nearest'})" public/assets/scratch-tabs.js
          echo SOURCE_EXACT=PASS
          echo STATIC_TAB_UX_CONTRACT=PASS

      - name: Build and real Chromium tab overflow regression
        working-directory: product
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/final2518"; mkdir -p "$ROOT/site/candidate"
          bash scripts/build-deploy-tree.sh "$ROOT/site" >/dev/null
          test "$(cat "$ROOT/site/VERSION.txt")" = 2.5.18
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          cat > "$ROOT/site/candidate/index.html" <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/assets/app.css"></head><body data-vftb-version="2.5.18"><header class="topbar"><div class="topbar-inner"><div class="top-actions"><div id="addContentSplit" class="add-content-split"></div></div></div></header><main style="padding:24px">Scratch overflow fixture</main><script src="/assets/v254-common-branding.js"></script></body></html>
          HTML
          php -S 127.0.0.1:18738 -t "$ROOT/site" >"$RUNNER_TEMP/php2518.log" 2>&1 & PID=$!; trap 'kill $PID || true' EXIT; sleep 1
          cat > "$RUNNER_TEMP/check2518.cjs" <<'JS'
          const {chromium}=require('playwright');
          const tabs=Array.from({length:16},(_,i)=>({id:i+1,title:`临时页签 ${String(i+1).padStart(2,'0')} · 较长标题`,content:`内容 ${i+1}\n第二行`,cursor_pos:0,scroll_top:0,is_pinned:i<2?1:0,sort_order:(i+1)*100}));
          async function mock(page){
            await page.route('**/api.php?action=session',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,csrf:'test-csrf',site:{auth:true}})}));
            await page.route('**/scratch-action.php?action=list',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,data:{open:tabs,closed:[],open_count:tabs.length,closed_count:0}})}));
            await page.route('**/scratch-action.php?action=*',async r=>{const u=new URL(r.request().url());const action=u.searchParams.get('action');if(action==='list')return;const body=r.request().postDataJSON?.()||{};const id=Number(body.id||1);const tab=tabs.find(x=>x.id===id)||tabs[0];return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,tab,open_count:tabs.length,closed_count:0})});});
            await page.route('**/favicon-action.php?action=status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,favicon:{exists:false}})}));
          }
          async function openScratch(page){
            await page.goto('http://127.0.0.1:18738/candidate/index.html',{waitUntil:'networkidle'});
            await page.waitForSelector('#scratchLaunchV259',{state:'visible'});
            await page.click('#scratchLaunchV259');
            await page.waitForSelector('.scratch-workspace-v259');
            await page.waitForSelector('[data-scratch-tab-scroll="next"]');
            await page.waitForTimeout(180);
          }
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1180,height:820}});let errors=[];p.on('pageerror',e=>errors.push(String(e)));
            await mock(p);await openScratch(p);
            const initial=await p.evaluate(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),prev=document.querySelector('[data-scratch-tab-scroll="prev"]'),next=document.querySelector('[data-scratch-tab-scroll="next"]');return{overflow:s.scrollWidth>s.clientWidth+3,left:s.scrollLeft,prevHidden:prev.hidden,nextHidden:next.hidden,prevDisabled:prev.disabled,nextDisabled:next.disabled};});
            if(!initial.overflow||initial.prevHidden||initial.nextHidden||!initial.prevDisabled||initial.nextDisabled)throw Error('INITIAL_OVERFLOW_CONTROLS_'+JSON.stringify(initial));
            await p.click('[data-scratch-tab-scroll="next"]');await p.waitForTimeout(260);let afterClick=await p.$eval('.scratch-tabs-scroll-v259',e=>e.scrollLeft);if(afterClick<=initial.left+20)throw Error('NEXT_BUTTON_DID_NOT_SCROLL');
            const beforeWheel=afterClick;await p.$eval('.scratch-tabs-scroll-v259',e=>e.dispatchEvent(new WheelEvent('wheel',{deltaY:180,bubbles:true,cancelable:true})));await p.waitForTimeout(100);const afterWheel=await p.$eval('.scratch-tabs-scroll-v259',e=>e.scrollLeft);if(afterWheel<=beforeWheel+10)throw Error('WHEEL_AUXILIARY_SCROLL_FAILED');
            await p.$eval('.scratch-tabs-scroll-v259',e=>{e.scrollLeft=80;});await p.waitForTimeout(60);const beforeDrag=await p.$eval('.scratch-tabs-scroll-v259',e=>e.scrollLeft);await p.$eval('.scratch-tabs-scroll-v259',e=>{const r=e.getBoundingClientRect();e.dispatchEvent(new DragEvent('dragover',{clientX:r.right-2,bubbles:true,cancelable:true}));});await p.waitForTimeout(60);const afterDrag=await p.$eval('.scratch-tabs-scroll-v259',e=>e.scrollLeft);if(afterDrag<=beforeDrag)throw Error('DRAG_EDGE_AUTO_SCROLL_FAILED');
            await p.$eval('.scratch-tabs-scroll-v259',e=>e.scrollLeft=0);await p.waitForTimeout(80);await p.evaluate(()=>document.querySelector('[data-scratch-tab="16"]').click());await p.waitForTimeout(360);const reveal=await p.evaluate(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),a=document.querySelector('.scratch-tab-v259.active'),sr=s.getBoundingClientRect(),ar=a.getBoundingClientRect();return{id:a.dataset.scratchTab,left:s.scrollLeft,visible:ar.left>=sr.left-1&&ar.right<=sr.right+1};});if(reveal.id!=='16'||reveal.left<50||!reveal.visible)throw Error('ACTIVE_TAB_NOT_REVEALED_'+JSON.stringify(reveal));
            for(let i=0;i<12;i++){const next=p.locator('[data-scratch-tab-scroll="next"]');if(await next.isDisabled())break;await next.click();await p.waitForTimeout(90);}const right=await p.evaluate(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),n=document.querySelector('[data-scratch-tab-scroll="next"]'),p=document.querySelector('[data-scratch-tab-scroll="prev"]');return{left:s.scrollLeft,max:s.scrollWidth-s.clientWidth,nextDisabled:n.disabled,prevDisabled:p.disabled};});if(!right.nextDisabled||right.prevDisabled||Math.abs(right.max-right.left)>4)throw Error('RIGHT_BOUNDARY_STATE_'+JSON.stringify(right));
            await p.evaluate(()=>{const root=document.querySelector('[data-scratch-tabs]');Array.from(root.children).slice(2).forEach(x=>x.remove());});await p.waitForTimeout(220);const compact=await p.evaluate(()=>{const s=document.querySelector('.scratch-tabs-scroll-v259'),p=document.querySelector('[data-scratch-tab-scroll="prev"]'),n=document.querySelector('[data-scratch-tab-scroll="next"]');return{overflow:s.scrollWidth>s.clientWidth+3,prevHidden:p.hidden,nextHidden:n.hidden};});if(compact.overflow||!compact.prevHidden||!compact.nextHidden)throw Error('NON_OVERFLOW_CONTROLS_NOT_HIDDEN_'+JSON.stringify(compact));
            if(errors.length)throw Error('PAGE_ERRORS_'+errors.join('|'));
            const m=await b.newPage({viewport:{width:390,height:844}});await mock(m);await openScratch(m);const mobile=await m.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,nextVisible:!!document.querySelector('[data-scratch-tab-scroll="next"]')&&!document.querySelector('[data-scratch-tab-scroll="next"]').hidden,barWidth:document.querySelector('.scratch-bar-v259').getBoundingClientRect().width}));if(mobile.overflow>1||!mobile.nextVisible||mobile.barWidth>391)throw Error('MOBILE_390_'+JSON.stringify(mobile));
            await b.close();console.log('TAB_OVERFLOW_CONTROLS=PASS');console.log('LEFT_RIGHT_BOUNDARIES=PASS');console.log('ACTIVE_TAB_AUTO_REVEAL=PASS');console.log('WHEEL_AUXILIARY_SCROLL=PASS');console.log('DRAG_EDGE_AUTO_SCROLL=PASS');console.log('NON_OVERFLOW_HIDE=PASS');console.log('MOBILE_390_OVERFLOW=NONE');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/check2518.cjs"
          echo REAL_CHROMIUM_TAB_OVERFLOW_UX=PASS
          echo FINAL_CANDIDATE_VERIFY=PASS
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO
