name: P01 2.47.413 Channels Toolbar Distribution One-shot Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247413-channels-distribution.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 04cd7046947baa2146aac4457d570518ee978cd8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update candidate in ephemeral checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-413-distribution"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_413_DIST_EXACT_SOURCE=PASS
      - name: Full core-updates contract and exact P01 release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.413'
          assert m['current_version']=='2.47.412'
          assert m['from_versions']==['2.47.412']
          assert m['release_tag']=='v2.47.413'
          assert m['release_id']==420189993
          assert m['product_identity']=='6a7e0f6c9b8c46c569fc145b30ae925f1a74a029'
          assert m['asset_name']=='VF_Start_V2.47.413_UPDATE.zip'
          assert m['asset_bytes']==2670582
          assert m['asset_sha256']=='ebb25947c034b2dd16458b84933edaf67d9f41ddaea1e270fb789f7e1c0a5ff2'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['update_type']=='ATOMIC'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_413_DISTRIBUTION_COORDINATES=PASS')
          PY
          echo P01_413_DISTRIBUTION_EQUIVALENT_CI=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_413_DIST_EPHEMERAL=PASS
