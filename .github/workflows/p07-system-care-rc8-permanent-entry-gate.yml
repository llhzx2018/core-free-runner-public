name: P07 System Care RC8 Permanent Entry Gate

on:
  push:
    branches: [gate/p07-system-care-rc8-permanent-entry-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc8-permanent-entry-gate.yml'

permissions:
  contents: read

jobs:
  permanent-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify permanent Toolbox main link
        shell: bash
        run: |
          set -Eeuo pipefail
          toolbox=/tmp/p07-toolbox.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o "$toolbox"
          bash -n "$toolbox"
          help="$(NO_COLOR=1 bash "$toolbox" --help)"
          grep -Fq 'P07 · VF Server Ops V0.1.0' <<<"$help"
          grep -Fq '4. 系统维护 / 安全' <<<"$help"
          grep -Fq '测试中' <<<"$help"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc8"' "$toolbox"
          echo P07_RC8_PERMANENT_TOOLBOX_LINK=PASS

      - name: Verify permanent RC8 installer and exact package
        shell: bash
        run: |
          set -Eeuo pipefail
          installer=/tmp/p07-system-care.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o "$installer"
          bash -n "$installer"
          grep -Fq "VERSION='0.1.0-rc8'" "$installer"
          grep -Fq "MANIFEST_BLOB='b0a4a012de4489dc1ed67a7bd1e7e290be1d181f'" "$installer"
          grep -Fq 'evidence refresh-cache' "$installer"

          manifest=/tmp/MANIFEST.gitblob
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/packages/p07-system-care/0.1.0-rc8/MANIFEST.gitblob -o "$manifest"
          bytes="$(wc -c < "$manifest" | tr -d '[:space:]')"
          actual="$( { printf 'blob %s\0' "$bytes"; cat "$manifest"; } | sha1sum | awk '{print $1}')"
          test "$actual" = b0a4a012de4489dc1ed67a7bd1e7e290be1d181f
          test "$(wc -l < "$manifest" | tr -d '[:space:]')" = 15
          echo P07_RC8_PERMANENT_PACKAGE_IDENTITY=PASS

      - name: Fresh install through permanent main installer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash /tmp/p07-system-care.sh status >/tmp/p07-rc8-status.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc8
          test -x /opt/vf-system-care/intrusion-evidence.sh
          test -f /opt/vf-system-care/lib/intrusion_evidence.py
          grep -Fq '服务器      %b需处理%b · 按 1 查看原因' /opt/vf-system-care/vf-system-care.sh
          grep -Fq '网站安全   %b正常%b' /opt/vf-system-care/intrusion-evidence.sh
          grep -Fq 'refresh-cache) refresh_cache' /opt/vf-system-care/intrusion-evidence.sh
          echo P07_RC8_PERMANENT_INSTALL=PASS

      - name: Verify post-install evidence cache refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence refresh-cache
          cache=/tmp/p07-system-care-intrusion-0.cache
          sudo test -f "$cache"
          sudo grep -Fq 'STATUS=NOT_ENABLED' "$cache"
          sudo grep -Fq 'SCHEDULER=none' "$cache"
          echo P07_RC8_POST_INSTALL_CACHE_REFRESH=PASS

      - name: Verify plain-language parent UX from cached state
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash -c 'cat >/tmp/p07-system-care-summary-0.cache <<EOF
STATUS=ATTENTION
EOF
cat >/tmp/p07-system-care-intrusion-0.cache <<EOF
STATUS=ATTENTION
EVENTS=2
SCHEDULER=systemd
EOF
chmod 600 /tmp/p07-system-care-summary-0.cache /tmp/p07-system-care-intrusion-0.cache'
          printf '0\n' | sudo script -qec 'NO_COLOR=1 /usr/local/bin/vf-system-care menu' /dev/null >/tmp/p07-rc8-parent-menu.txt
          grep -Fq '服务器      需处理 · 按 1 查看原因' /tmp/p07-rc8-parent-menu.txt
          grep -Fq '网站安全    需处理 · 2 条异常 · 按 7 查看' /tmp/p07-rc8-parent-menu.txt
          grep -Fq '自动检查    已开启' /tmp/p07-rc8-parent-menu.txt
          if grep -Fq '状态   需关注' /tmp/p07-rc8-parent-menu.txt; then
            echo 'FAIL: ambiguous RC7 parent status leaked into RC8 UX' >&2
            exit 1
          fi
          echo P07_RC8_PLAIN_LANGUAGE_PARENT_UX=PASS

      - name: Verify actionable evidence status wording
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -f /tmp/p07-system-care-intrusion-0.cache
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence status >/tmp/p07-rc8-evidence-status.txt
          grep -Fq '网站安全   未开启' /tmp/p07-rc8-evidence-status.txt
          grep -Fq '下一步     选择 1 开启一次；以后每天会自动检查' /tmp/p07-rc8-evidence-status.txt
          echo P07_RC8_ACTIONABLE_EVIDENCE_STATUS=PASS

      - name: Final owner-test entry marker
        shell: bash
        run: echo P07_SYSTEM_CARE_RC8_OWNER_TEST_ENTRY_READY=PASS
