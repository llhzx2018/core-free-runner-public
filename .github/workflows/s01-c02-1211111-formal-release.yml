name: S01 Ops 1.21.1111 formal release exact main
on:
  push:
    branches: [task/s01-ops1111-publish-20261013]
    paths: [.github/workflows/s01-c02-1211111-formal-release.yml]
permissions:
  contents: read
jobs:
  ops-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a93d19dd9e920470b7244308189e45cedab8ed98
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify merged Git tree equals tested PR candidate, version and gate result
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = a93d19dd9e920470b7244308189e45cedab8ed98
          test "$(git -C source rev-parse HEAD^{tree})" = 080b3439021f64e0350546b80e3460ea707b80e2
          test "$(cat source/VERSION)" = 1.21.1111
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq .commit.sha)" = a93d19dd9e920470b7244308189e45cedab8ed98
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38387030205 --jq .conclusion)" = success
          if gh release view v1.21.1111 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then echo "FORMAL_TAG_EXISTS_FAIL_CLOSED"; exit 1; fi
          echo S01_OPS_1111_SOURCE_AND_TESTED_TREE_MATCH_PASS
      - name: Rebuild and verify exact candidate fingerprint
        run: |
          set -Eeuo pipefail
          mkdir -p release
          python3 source/.github/release/build-ops-package.py --source source --output release/vf-tools-ops_V1.21.1111.zip > release/meta.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('release/vf-tools-ops_V1.21.1111.zip')
          m=json.loads(pathlib.Path('release/meta.json').read_text())
          assert m['version']=='1.21.1111' and m['asset_bytes']==3581602
          assert m['runtime_files']==990
          assert m['runtime_fingerprint']=='19c13b587d8b9086a0487137c9383cd14cbff7c8c0a3013d22052400e5fd6d80'
          assert m['asset_sha256']=='38e6a096a387b4a8d7b687e33bc963907aa781ae9d3410e0bf07a2987c578dee'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['asset_sha256']
          print('S01_OPS_1111_CANDIDATE_BYTE_EXACT_PASS')
          PY
      - name: Publish Release tag and actual ZIP, then remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v1.21.1111 release/vf-tools-ops_V1.21.1111.zip --repo llhzx2018/vf-tools-ops --target a93d19dd9e920470b7244308189e45cedab8ed98 --title "VF Tools Ops 1.21.1111" --notes "S01 Ops 1.21.1111: security fix PR #413 rejects missing, array or malformed six daily settings revisions instead of coercing to 1. Real WordPress/MariaDB admin/subscriber HTTP POST with nonce, permission, stale optimistic lock, six field save/readback and authorized restoration PASS (56 checks Runner #38386508547). Candidate deterministic ZIP and isolated Ops 1.21.1110→1111→1110→1111 upgrade/rollback with M3U8 1.25.90 and Theme 1.35.112 PASS (Runner #38387030205). Original stale PR #407 closed superseded; destructive Restore PR #357 still unmerged. Production only OWNER manual."
          mkdir -p remote
          gh release download v1.21.1111 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1111.zip --dir remote
          cmp release/vf-tools-ops_V1.21.1111.zip remote/vf-tools-ops_V1.21.1111.zip
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.1111 --jq .object.sha)" = a93d19dd9e920470b7244308189e45cedab8ed98
          test "$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.1111 --jq '.assets[0].digest')" = sha256:38e6a096a387b4a8d7b687e33bc963907aa781ae9d3410e0bf07a2987c578dee
          echo S01_OPS_1111_FORMAL_REMOTE_TAG_AND_ZIP_PASS
      - name: Cleanup temporary source and asset bytes
        if: always()
        run: rm -rf source release remote
