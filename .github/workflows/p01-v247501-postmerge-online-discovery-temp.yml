name: p01-v247501-postmerge-real-online-upgrade
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247501-postmerge-online-discovery-temp.yml'
      - 'scripts/p01-v247501-live-online-discovery-temp.py'
permissions:
  contents: read
jobs:
  p01-exact-published-online-500-to-501:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CHANNEL_REPO: llhzx2018/core-updates
      CHANNEL_MAIN_SHA: edbd9b19246c9cb799a001ef73f6487efc6b906b
      WORK: /tmp/p01-v247501-online-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare synthetic PHP/SQLite read+apply environment
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK/release"
          python3 -m py_compile scripts/p01-v247501-live-online-discovery-temp.py scripts/p01-v247501-channel-live-synthetic-helper-temp.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          echo P01_V501_INSTALLED_SOURCE_SYNTHETIC_RUNTIME=PASS
      - name: Independently retrieve live main channel, official release and exact v500 base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/$CHANNEL_REPO.git" refs/heads/main | awk '{print $1}')"
          test "$remote" = "$CHANNEL_MAIN_SHA"
          gh api "repos/$CHANNEL_REPO/contents/projects/P01.json?ref=main" --jq .content | base64 -d > "$WORK/live-channel.json"
          python3 - "$WORK/live-channel.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['target_version']=='2.47.501' and m['current_version']=='2.47.500'
          assert m['from_versions']==['2.47.500'] and m['update_type']=='ATOMIC'
          assert m['release_tag']=='v2.47.501' and m['release_id']==437504679
          assert m['product_identity']=='11d2fe8554fb45c3365c771ab686343207dcde81'
          assert m['asset_name']=='VF_Start_V2.47.501_UPDATE.zip'
          assert m['asset_bytes']==3788274 and m['asset_sha256']=='658faa9c1e30b10ae7932f04a68f50a777e23a2115e0fd3d602c66ad64e02fa8'
          assert m['schema_from']==m['schema_to']=='2026102201'
          print('P01_V501_LIVE_CANONICAL_CHANNEL_RELEASE_EXACT=PASS')
          PY
          test "$(gh api repos/$PRODUCT_REPO/git/ref/tags/v2.47.501 --jq .object.sha)" = 11d2fe8554fb45c3365c771ab686343207dcde81
          test "$(gh api repos/$PRODUCT_REPO/releases/tags/v2.47.501 --jq .id)" = 437504679
          gh release download v2.47.500 -R "$PRODUCT_REPO" -D "$WORK/release" -p VF-Start-V2.47.500-FULL.zip
          printf '%s  %s\n' \
            9a712e7cc1202babb2518670377171b0f2a7705286bdd1dc8ebbb7b55be59227 "$WORK/release/VF-Start-V2.47.500-FULL.zip" | sha256sum -c -
          echo P01_V501_OFFICIAL500_SOURCE_READY_REAL_CHANNEL=PASS
      - name: Installed real v500 UpdateManager discovers online 501, downloads and applies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-v247501-live-online-discovery-temp.py \
            --source-full "$WORK/release/VF-Start-V2.47.500-FULL.zip" --work "$WORK"
          echo P01_V501_PRODUCT_NATIVE_REMOTE_CHANNEL_FULL_PATH=PASS
      - name: Cleanup private synthetic data and source
        if: always()
        shell: bash
        run: |
          echo P01_V501_DISTRIBUTION_REMOTE_READBACK_PRODUCTION_WRITE=NONE
          echo P01_V501_PUBLIC_PRIVATE_ARTIFACT=NONE
          case "$WORK" in /tmp/p01-v247501-online-*) rm -rf -- "$WORK";; *) exit 79;; esac
