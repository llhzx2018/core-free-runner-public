name: P02 V2.5.102 Whole Product Final Audit

on:
  push:
    branches:
      - run/p02-v25102-whole-product-final-audit-20260923
    paths:
      - '.github/workflows/p02-v25102-whole-product-final-audit.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0f643374f82dd47338ec307db9ca56bc2f0979df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source source and unit
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "0f643374f82dd47338ec307db9ca56bc2f0979df"
          test "$(cat VERSION)" = "2.5.102"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node --check public/assets/scratch-tabs.js
          node tests/unit/p02_v25102_whole_product_final_audit.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25102_WHOLE_PRODUCT_SOURCE=PASS
      - name: Maintenance baseline
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V25102-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v25102-whole-product
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V25102_WHOLE_PRODUCT_MAINTENANCE=PASS
      - name: Focused Chromium whole-product audit
        working-directory: product
        env:
          VF_UX_FOCUSED_WHOLE_PRODUCT_FINAL_AUDIT: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V25102-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 240s bash scripts/ux-browser-reverify.sh
          echo P02_V25102_WHOLE_PRODUCT_BROWSER_GATE=PASS
