name: P05 V1.2.3 Core Updates Manifest Gate

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v123-core-updates-manifest-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  manifest:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v123-core-updates-manifest-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_BASE: e93f07c5ee84e114e0829ea65f217e768b21ce44
      CORE_UPDATES_HEAD: 92d70b7352b22ce857422912219183efa4e1ea89
      PRODUCT_SOURCE: 66a56dafdfba2ca7243d1984791ecbe0fd7382ae
      RELEASE_ID: '380755611'
      ASSET_ID: '540017020'
      ASSET_NAME: VF_SEO_V1.2.3_UPDATE.zip
      ASSET_BYTES: '1173998'
      ASSET_SHA256: 0de26614f5269ba5d1f6ace343b6853a82a4fb3e3bcbe5be85e3ad683f48588d
      REPAIR_ID: '540017025'
      REPAIR_SHA256: 378c1ed64e86eb2ac79a8e40ca5feaa3bd7f3cd2ff41b05bf1daedead0e5ff63
      ATOMIC_RUN: '33548178743'
      ATOMIC_JOB: '99990780962'
      SUPPLEMENT_RUN: '33548646163'
      SUPPLEMENT_JOB: '99992321450'
    steps:
      - name: Checkout disposable runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bind Atomic and supplemental publication PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/a-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/a-job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$SUPPLEMENT_RUN" > /tmp/s-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$SUPPLEMENT_JOB" > /tmp/s-job.json
          python3 - <<'PY'
          import json,os
          ar=json.load(open('/tmp/a-run.json')); aj=json.load(open('/tmp/a-job.json'))
          sr=json.load(open('/tmp/s-run.json')); sj=json.load(open('/tmp/s-job.json'))
          assert ar['id']==int(os.environ['ATOMIC_RUN']) and ar['conclusion']=='success'
          assert aj['id']==int(os.environ['ATOMIC_JOB']) and aj['conclusion']=='success' and aj['name']=='atomic'
          assert sr['id']==int(os.environ['SUPPLEMENT_RUN']) and sr['conclusion']=='success'
          assert sj['id']==int(os.environ['SUPPLEMENT_JOB']) and sj['conclusion']=='success' and sj['name']=='publish-atomic-assets'
          print('P05_V123_CHANNEL_EVIDENCE_BINDING=PASS')
          PY

      - name: Checkout exact private core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core-updates

      - name: Bind exact one-file core-updates scope
        working-directory: core-updates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_HEAD"
          git cat-file -e "$CORE_UPDATES_BASE^{commit}"
          test "$(git diff --name-only "$CORE_UPDATES_BASE" "$CORE_UPDATES_HEAD")" = 'projects/P05.json'
          git diff --check "$CORE_UPDATES_BASE" "$CORE_UPDATES_HEAD"
          echo P05_V123_CORE_UPDATES_EXACT_SCOPE=PASS

      - name: Validate manifest against V1 schema
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,datetime,pathlib
          root=pathlib.Path('core-updates')
          m=json.loads((root/'projects/P05.json').read_text()); s=json.loads((root/'schemas/update-manifest-v1.schema.json').read_text())
          allowed=set(s['properties']); required=set(s['required'])
          assert required <= set(m), required-set(m)
          assert set(m) <= allowed, set(m)-allowed
          assert m['schema_version']=='1.0'
          assert m['project_id']=='P05' and m['component_id']=='APP' and m['enabled'] is True
          assert m['current_version']=='1.2.2' and m['target_version']=='1.2.3'
          assert m['update_type']=='ATOMIC' and m['from_versions']==['1.2.2']
          assert m['schema_from']=='1' and m['schema_to']=='1'
          assert m['repository']=='llhzx2018/vf-seo' and m['release_tag']=='v1.2.3'
          assert m['release_id']==380755611
          assert m['product_identity']=='66a56dafdfba2ca7243d1984791ecbe0fd7382ae'
          assert m['asset_name']=='VF_SEO_V1.2.3_UPDATE.zip' and m['asset_bytes']==1173998
          assert m['asset_sha256']=='0de26614f5269ba5d1f6ace343b6853a82a4fb3e3bcbe5be85e3ad683f48588d'
          assert m['backup_required'] is True and m['rollback_supported'] is True and m['minimum_php']=='8.2'
          assert re.fullmatch(r'[0-9a-f]{40}',m['product_identity']) and re.fullmatch(r'[0-9a-f]{64}',m['asset_sha256'])
          datetime.datetime.fromisoformat(m['released_at'].replace('Z','+00:00'))
          assert 'Production v1.2.3 尚未' in m['notes']
          print('P05_V123_CORE_UPDATES_SCHEMA=PASS')
          PY

      - name: Verify formal Release UPDATE and repair identities
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p05-release
          gh api repos/llhzx2018/vf-seo/releases/tags/v1.2.3 > /tmp/p05-release/release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/p05-release/release.json'))
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']=='v1.2.3' and r['target_commitish']==os.environ['PRODUCT_SOURCE']
          a={x['name']:x for x in r['assets']}; u=a[os.environ['ASSET_NAME']]; rp=a['repair-v1.2.3.php']
          assert u['id']==int(os.environ['ASSET_ID']) and u['size']==int(os.environ['ASSET_BYTES']) and u.get('digest')=='sha256:'+os.environ['ASSET_SHA256']
          assert rp['id']==int(os.environ['REPAIR_ID']) and rp.get('digest')=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V123_RELEASE_CHANNEL_ASSETS=PASS')
          PY
          gh release download v1.2.3 -R llhzx2018/vf-seo -p "$ASSET_NAME" -D /tmp/p05-release
          test "$(stat -c '%s' "/tmp/p05-release/$ASSET_NAME")" = "$ASSET_BYTES"
          test "$(sha256sum "/tmp/p05-release/$ASSET_NAME" | awk '{print $1}')" = "$ASSET_SHA256"
          test "$(unzip -Z1 "/tmp/p05-release/$ASSET_NAME" | wc -l)" -eq 1
          unzip -Z1 "/tmp/p05-release/$ASSET_NAME" | grep -Fx 'repair-v1.2.3.php' >/dev/null
          echo P05_V123_UPDATE_BYTES=PASS

      - name: Exercise manifest through Update Core V1
        run: |
          set -euo pipefail
          find core-updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core-updates/update-core/php/tests/run.php
          php -r '
          require "core-updates/update-core/php/src/UpdateAdapter.php";
          require "core-updates/update-core/php/src/UpdateCore.php";
          $m=json_decode(file_get_contents("core-updates/projects/P05.json"),true,512,JSON_THROW_ON_ERROR);
          $p="/tmp/p05-release/VF_SEO_V1.2.3_UPDATE.zip";
          $c=new CoreUpdates\UpdateCore("P05","APP");
          if (($c->check("1.2.2","1",$m)["status"]??null)!=="AVAILABLE") exit(21);
          if (($c->check("1.2.1","1",$m)["status"]??null)!=="BLOCKED_SOURCE_VERSION") exit(22);
          if (($c->check("1.2.3","1",$m)["status"]??null)!=="UP_TO_DATE") exit(23);
          if (($c->verifyPackage($p,$m)["status"]??null)!=="VERIFIED") exit(24);
          echo "P05_V123_UPDATE_CORE_RUNTIME=PASS\n";
          '

      - name: Seal v1.2.3 manifest gate
        run: |
          echo P05_V123_CORE_UPDATES_MANIFEST_GATE=PASS
          echo P05_CORE_UPDATES_HEAD="$CORE_UPDATES_HEAD"
          echo P05_UPDATE_ASSET_ID="$ASSET_ID"
          echo P05_UPDATE_SHA256="$ASSET_SHA256"
          echo P05_REPAIR_ASSET_ID="$REPAIR_ID"
          echo P05_PRODUCTION_WRITE=0