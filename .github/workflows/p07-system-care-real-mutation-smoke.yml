name: P07 System Care Real Mutation Smoke

on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc4/**'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-system-care-real-mutation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install exact RC4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo NO_COLOR=1 bash installers/p07-system-care.sh status | tee /tmp/p07-install-status.txt
          test "$(sudo NO_COLOR=1 /usr/local/bin/vf-system-care --version)" = 'P07 System Care 0.1.0-rc4'
          grep -q '^P07_SYSTEM_CARE_STATUS=' /tmp/p07-install-status.txt

      - name: Prepare protected sentinels
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo mkdir -p /home/p07-cloudpanel-sentinel/htdocs /etc/p07-cloudpanel-sentinel
          printf 'P07_PROTECTED_HOME\n' | sudo tee /home/p07-cloudpanel-sentinel/htdocs/KEEP >/dev/null
          printf 'P07_PROTECTED_ETC\n' | sudo tee /etc/p07-cloudpanel-sentinel/KEEP >/dev/null
          cat /proc/sys/kernel/random/boot_id > /tmp/boot-id.before
          if [[ -f /etc/ssh/sshd_config ]]; then sudo sha256sum /etc/ssh/sshd_config > /tmp/sshd.before; fi

      - name: Real APT metadata refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 180 sudo NO_COLOR=1 bash /opt/vf-system-care/updates.sh refresh | tee /tmp/p07-update-refresh.txt
          grep -q '^可更新' /tmp/p07-update-refresh.txt
          grep -q '^安全更新' /tmp/p07-update-refresh.txt

      - name: Real APT cache cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '1\n' | script -qec "sudo NO_COLOR=1 bash /opt/vf-system-care/cleanup.sh apt" /tmp/p07-clean-apt.typescript
          grep -Fq 'APT 缓存已清理' /tmp/p07-clean-apt.typescript

      - name: Real journal cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '1\n' | script -qec "sudo NO_COLOR=1 bash /opt/vf-system-care/cleanup.sh journal" /tmp/p07-clean-journal.typescript
          grep -Fq 'systemd journal 清理完成' /tmp/p07-clean-journal.typescript

      - name: Destructive upgrade cancel path
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '0\n' | script -qec "sudo NO_COLOR=1 bash /opt/vf-system-care/updates.sh all" /tmp/p07-upgrade-cancel.typescript
          grep -Fq '已取消' /tmp/p07-upgrade-cancel.typescript

      - name: Protected-boundary readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat /home/p07-cloudpanel-sentinel/htdocs/KEEP)" = 'P07_PROTECTED_HOME'
          test "$(cat /etc/p07-cloudpanel-sentinel/KEEP)" = 'P07_PROTECTED_ETC'
          test "$(cat /proc/sys/kernel/random/boot_id)" = "$(cat /tmp/boot-id.before)"
          if [[ -f /tmp/sshd.before ]]; then sudo sha256sum -c /tmp/sshd.before; fi
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care status | tee /tmp/p07-final-status.txt
          grep -q '^P07_SYSTEM_CARE_STATUS=' /tmp/p07-final-status.txt
          echo 'P07_SYSTEM_CARE_REAL_MUTATION_SMOKE=PASS'
