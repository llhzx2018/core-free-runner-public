name: P01 V2.36.0 Release Authority Sync
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-release-authority-sync-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_BASE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      AUTH_BRANCH: authority/p01-v2360-release-closure-20260901
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.AUTH_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Update exact Current Authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$AUTH_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          p=root/'VF_PROJECT.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V2.35.3 OWNER PRODUCTION / V2.36.0 PUBLISHED / REMOTE ONLINE UPDATE PASS'
          d['working_version']='2.36.0'
          d['target_release_version']='2.36.0'
          d['current_phase']='V2.36.0 PUBLISHED / OWNER PRODUCTION UPGRADE READY'
          d['published_release']={
            'version':'2.36.0','tag':'v2.36.0','release_id':380209550,
            'release_source':'225780b1ed56bbcc8e62ba465b1129e1c22ee60a',
            'release_tree':'8af6d8ea6168fae52988cae8272a19073a0a7a2e',
            'runtime_tree':'ad3f96345ead330adffb20c7ecb3cdf6537036b6',
            'schema_version':'2026082901',
            'core_updates_commit':'447e5f97bfaef078c31b752126f3b5bd0284a5ee',
            'online_asset':'VF_Start_V2.36.0_UPDATE.zip','online_asset_bytes':1404941,
            'online_asset_sha256':'26daa0fefff8a867a554750fbd4a92106fb2f9b1f68014cf8dd214d837fe0ee6',
            'full_asset':'VF-Start-V2.36.0-FULL.zip','full_asset_bytes':648612,
            'full_asset_sha256':'eef5dcdb1c5eaa680146345a33ff2886c5205ea16612be4465356f4076fe9839',
            'release_state':'PUBLISHED / REMOTE ONLINE UPDATE PASS / OWNER PRODUCTION UPGRADE READY',
            'assistant_production_write':False
          }
          d['formal_release_state']='V2.36.0 PUBLISHED / REMOTE ONLINE UPDATE PASS / OWNER PRODUCTION V2.35.3'
          d['develop_state']='V2.36.0 RELEASE CLOSURE PASS / CURRENT RELEASE SOURCE PUBLISHED'
          d['current_authority']='Owner Production V2.35.3 / Published Latest V2.36.0 / Remote Online Update PASS'
          d['next_action']='Owner may upgrade Production V2.35.3 -> V2.36.0 from the VF Start backend update page. Assistant must not write Owner Production.'
          d['v2_36_0_tag_state']='PUBLISHED / CLOSED'
          d['core_updates_v2_36_0_state']='PUBLISHED / REMOTE ONLINE UPDATE PASS'
          d['v2_36_0_release_chain']={
            'candidate_readiness_gate':33420047480,
            'formal_artifact_gate':33420558251,
            'formal_artifact_id':9768724456,
            'formal_artifact_sha256':'ee31e7afe5fd4a7a69b50cec385fb0cfb8f4a2744e360b894940dc005c46e1b5',
            'strict_fresh_gate':33420751341,
            'strict_fresh_artifact':9768803424,
            'strict_fresh_artifact_sha256':'518e33187b07a8d505867c3f20dc9e10b518e9947ea6cb223d0979311b96eedb',
            'main_promotion_readiness_gate':33420959848,
            'main_promotion_gate':33469243080,
            'main_promotion_artifact':9785932406,
            'main_promotion_artifact_sha256':'6ca873c14ca66a70b4f042743d0bcf39274eb9a53a66b7cbb567abf5b96758dc',
            'publication_gate':33469318027,
            'publication_artifact':9785958265,
            'publication_artifact_sha256':'bd6877512515243bb73febbc1707cbe342c6b41acb26f3a955580edb5733df4f',
            'core_updates_gate':33469427557,
            'core_updates_artifact':9785992829,
            'core_updates_artifact_sha256':'7e879dc51787a7cb7b1c1a88e4e220d83b752bf7afa9b3e1132e219ec4e024b2',
            'remote_online_update_gate':33469554421,
            'remote_online_update_artifact':9786039151,
            'remote_online_update_artifact_sha256':'73fffeb960bd6a6a7caf293f0eeb2fb3377d6f2f1e6782269b89cbc1527a0566',
            'owner_production_write':False,
            'result':'PASS'
          }
          auth=d.setdefault('authority',{})
          auth['current_formal_release_evidence']='docs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme=root/'README.md'
          t=readme.read_text(encoding='utf-8')
          block='''## Current Truth\n\n```text\nOwner Production: V2.35.3\nOwner Schema: 2026082901\nPublished Latest: V2.36.0\nFormal Release Source: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a\nFormal Release Tree: 8af6d8ea6168fae52988cae8272a19073a0a7a2e\nRuntime src Tree: ad3f96345ead330adffb20c7ecb3cdf6537036b6\nTag: v2.36.0\nGitHub Release ID: 380209550\ncore-updates: 447e5f97bfaef078c31b752126f3b5bd0284a5ee\nFinal Remote Online Update Gate: 33469554421 / PASS\nOwner Production Write: NO\n```\n\nV2.36.0 已正式发布并通过 `V2.35.3 -> V2.36.0` Remote Online Update Gate；当前真实 Owner Production 仍保持 V2.35.3，下一步由 Owner 在后台执行升级。\n'''
          if re.search(r'## Current Truth\n.*?(?=\n## )',t,flags=re.S):
              t=re.sub(r'## Current Truth\n.*?(?=\n## )',block.rstrip(),t,count=1,flags=re.S)
          else:
              lines=t.splitlines(); t=lines[0]+'\n\n'+block+'\n'+'\n'.join(lines[1:])
          readme.write_text(t.rstrip()+'\n',encoding='utf-8')

          marker='<!-- P01_V2360_RELEASE_CLOSURE -->'
          current_block=f'''{marker}\n## V2.36.0 Release Closure · 2026-09-01\n\n- Owner Production：`V2.35.3` / Schema `2026082901`。\n- Published Latest：`V2.36.0`。\n- Formal Source：`225780b1ed56bbcc8e62ba465b1129e1c22ee60a`。\n- Tag / Release：`v2.36.0` / `380209550`。\n- core-updates：`447e5f97bfaef078c31b752126f3b5bd0284a5ee`。\n- Remote Online Update Gate：`33469554421` = **PASS**。\n- 真实验证：V2.35.3 → V2.36.0 远程发现、Release 下载、Atomic 安装、数据保留、SQLite/FK、公开/私密、五域 HTTP、Runtime delta、Current=Latest 全 PASS。\n- Owner Production Write：**NO**。\n- Next：Owner 可在 VF Start 后台执行 V2.35.3 → V2.36.0 升级。\n\n> 以下旧段落保留历史证据，不覆盖本段 Current Truth。\n'''
          for rel in ['docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md']:
              q=root/rel; s=q.read_text(encoding='utf-8')
              if marker in s:
                  s=re.sub(re.escape(marker)+r'.*?(?=\n#|\n##|\Z)',current_block.rstrip(),s,count=1,flags=re.S)
              else:
                  lines=s.splitlines()
                  if lines and lines[0].startswith('#'):
                      s=lines[0]+'\n\n'+current_block+'\n'+'\n'.join(lines[1:])
                  else:
                      s=current_block+'\n'+s
              q.write_text(s.rstrip()+'\n',encoding='utf-8')

          evidence=root/'docs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md'
          evidence.write_text('''# P01 · VF Start · V2.36.0 Release Closure Evidence\n\n## Verdict\n\n**PASS / PUBLISHED / OWNER PRODUCTION UPGRADE READY**\n\nOwner Production remains **V2.35.3**. This closure did **not** write Owner Production.\n\n## Exact Release Identity\n\n- Formal Source: `225780b1ed56bbcc8e62ba465b1129e1c22ee60a`\n- Formal Tree: `8af6d8ea6168fae52988cae8272a19073a0a7a2e`\n- Runtime Tree: `ad3f96345ead330adffb20c7ecb3cdf6537036b6`\n- Schema: `2026082901`\n- Migration: `NONE`\n- Tag: `v2.36.0`\n- GitHub Release ID: `380209550`\n- core-updates: `447e5f97bfaef078c31b752126f3b5bd0284a5ee`\n\n## Release Assets\n\n- `VF-Start-V2.36.0-FULL.zip`: `648612` bytes / `sha256:eef5dcdb1c5eaa680146345a33ff2886c5205ea16612be4465356f4076fe9839`\n- `VF_Start_V2.36.0_UPDATE.zip`: `1404941` bytes / `sha256:26daa0fefff8a867a554750fbd4a92106fb2f9b1f68014cf8dd214d837fe0ee6`\n- `repair-v2.36.0.php`: `4025845` bytes / `sha256:8f47717399159faffcccab2ca3d5d86e9e550cd821d3568cbbd70e1915595536`\n\n## Gate Chain\n\n- Candidate Readiness `33420047480` — PASS\n- Formal Artifact `33420558251` — PASS\n- Strict Fresh `33420751341` — PASS\n- Main Promotion Readiness `33420959848` — PASS\n- Main Promotion `33469243080` — PASS\n- Publication `33469318027` — PASS\n- core-updates `33469427557` — PASS\n- Final Remote Online Update `33469554421` — PASS\n\n## Final Remote Online Update Evidence\n\nArtifact `9786039151` / `sha256:73fffeb960bd6a6a7caf293f0eeb2fb3377d6f2f1e6782269b89cbc1527a0566`.\n\nThe isolated Owner-like V2.35.3 runtime discovered V2.36.0 through the published core-updates manifest, downloaded the exact GitHub Release asset, executed Atomic install, preserved representative links/categories/favorites/private state/domain profiles, retained Schema `2026082901`, passed SQLite integrity and foreign-key checks, matched every changed/added runtime byte against tag `v2.36.0`, preserved anonymous public/private boundaries and five-domain HTTP, and converged to Current=Latest=V2.36.0.\n\n## Production Boundary\n\n- Owner Production before/after this closure: `V2.35.3`\n- Assistant Owner Production write: `NO`\n- Owner may now perform the backend upgrade to V2.36.0.\n''',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=$'README.md\nVF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          ! printf '%s\n' "${changed[@]}" | grep '^src/'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.0_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.36.0 release chain'
          git push origin HEAD:"$AUTH_BRANCH"
          printf 'P01_V2360_RELEASE_AUTHORITY_SYNC=PASS\nAUTH_BRANCH=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$AUTH_BRANCH"
