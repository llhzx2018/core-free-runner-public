name: P01 V2.27 Workspace Productization Screenshot Audit
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-workspace-productization-screenshot-audit-20260828.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: 91e0153fc08161aca1c96b598cfb15d0b12f0df6
      TREE: 7a1f37b45cdaa818ce470cdd02a264b90202ce49
      ROOT: /tmp/p01-v227-shot
      PORT: '18329'
      COOKIE: /tmp/p01-v227-shot.cookies
      SHOTS: /tmp/p01-v227-shots
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact source and fresh representative runtime
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$SOURCE"
          test "$(git -C p01 rev-parse HEAD^{tree})" = "$TREE"
          find p01/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check p01/src/assets/workspace.js
          rm -rf "$ROOT" "$COOKIE" "$SHOTS"; mkdir -p "$SHOTS"; cp -a p01/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v227-shot.log 2>&1 & echo $! >/tmp/p01-v227-shot.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/shot-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/shot-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V227 UI Audit' --data-urlencode 'admin_password=P01V227!Audit' --data-urlencode 'admin_password_confirm=P01V227!Audit' -o /tmp/shot-post.html
          cat >/tmp/v227-shot-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-shot/app/bootstrap.php';require_once '/tmp/p01-v227-shot/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$cats=[];
          foreach(['开发与 API','服务器与运维','AI 与自动化','资源与工具','影视与片源','生活与效率'] as $n)$cats[$n]=$r->createCategory(['name'=>$n,'description'=>'','is_private'=>false]);
          $titles=['GitHub','Cloudflare Dashboard','Vercel','Notion','ChatGPT','Archivebate','WildAI','AdsPower','PingMe','Hubstudio','Xesim','GoLogin','Linken Sphere','Hushed','Multilogin','BrowserScan','NameSilo','Dynadot','Vultr','Linode','CloudPanel','Uptime Kuma','Plausible','Sentry'];
          for($i=0;$i<96;$i++){ $name=$titles[$i%count($titles)].' '.($i>=count($titles)?(intdiv($i,count($titles))+1):'');$c=array_values($cats)[$i%count($cats)];$r->saveLink(null,['category_id'=>$c,'title'=>trim($name),'url'=>'https://site-'.$i.'.example.com','description'=>'高密度真实收藏库审计说明，用来验证列表扫描、信息层级、hover 操作和分页。','tags'=>$i%4===0?'工具,常用':'工具','click_count'=>220-$i,'is_favorite'=>$i<10,'is_private'=>false],'import'); }
          foreach([['硅谷101','科技 / 商业','科技与商业长期内容源'],['蜉蝣天地 Meanders','访谈 / 社会','适合后台收听的长访谈'],['大问题 Dialectic','哲学 / 思想','长期思考型频道'],['小约翰可汗','历史 / 社会','历史与社会叙事'],['疯投圈','投资 / 商业','商业与投资播客'],['枫言枫语','科技 / 互联网','科技访谈与播客'],['自说自话的总裁','历史 / 世界','长篇叙事频道'],['脑洞乌托邦','案件 / 调查','案例与调查内容'],['食贫道','纪录 / 社会','长篇纪录内容']] as $idx=>$x){$z=$r->saveLink(null,['category_id'=>$cats['资源与工具'],'title'=>$x[0],'url'=>'https://www.youtube.com/@channel'.$idx,'description'=>$x[2],'tags'=>'频道,长期内容源','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$idx%2===0,'note'=>$x[1]]);}
          foreach([['奥本海默','2023','want'],['信条','2020','watched'],['布达佩斯大饭店','2014','favorite'],['流浪地球 2','2023','want'],['盗梦空间','2010','watched'],['无间道','2002','favorite'],['宇宙探索编辑部','2023','want'],['沙丘 2','2024','want'],['银翼杀手 2049','2017','watched'],['星际穿越','2014','favorite']] as $idx=>$x){$z=$r->saveLink(null,['category_id'=>$cats['影视与片源'],'title'=>$x[0],'url'=>'https://watch-'.$idx.'.example.com','description'=>'私人影视索引','tags'=>'电影','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>$x[1],'media_status'=>$x[2]]);}
          foreach([['Anh Tung 5566','https://www.youtube.com/@pending1'],['Keihidupan Aviasi','https://www.youtube.com/@pending2'],['Raja Video Shorts ID','https://www.youtube.com/@pending3'],['村花胡胡','https://www.youtube.com/@pending4'],['DailyMotion Film','https://dailymotion.com/pending5']] as $x)$r->saveLink(null,['category_id'=>$cats['影视与片源'],'title'=>$x[0],'url'=>$x[1],'description'=>'等待归属建议','is_private'=>true],'manual');
          PHP
          php /tmp/v227-shot-seed.php
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V227!Audit"}' | jq -e '.ok==true' >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | grep -Fx 'MULTI_SURFACE_PASS=YES'
      - name: Prepare authenticated audit pages
        run: |
          set -Eeuo pipefail
          BASE="http://127.0.0.1:$PORT"
          for spec in 'all:surfaces.php' 'cards:surfaces.php?layout=cards' 'start:start.php' 'channels:channels.php' 'watch:watch.php' 'inbox:surface-manager.php'; do name=${spec%%:*};url=${spec#*:};curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/$url" -o "$ROOT/audit-$name.html";grep -F 'workspace.js' "$ROOT/audit-$name.html" >/dev/null;done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/p01-v227-shot')
          s=(root/'audit-all.html').read_text()
          add=s.replace('class="vf-workspace-overlay" data-workspace-overlay hidden','class="vf-workspace-overlay open" data-workspace-overlay').replace('class="vf-workspace-dialog vf-add-dialog" data-panel="add" hidden','class="vf-workspace-dialog vf-add-dialog" data-panel="add"')
          (root/'audit-add.html').write_text(add)
          detail=s.replace('class="vf-workspace-overlay" data-workspace-overlay hidden','class="vf-workspace-overlay open" data-workspace-overlay').replace('class="vf-detail-drawer" data-panel="detail" hidden','class="vf-detail-drawer" data-panel="detail"').replace('data-detail-title>收藏详情','data-detail-title>Cloudflare Dashboard').replace('data-detail-domain></small>','data-detail-domain>cloudflare.com</small>')
          (root/'audit-detail.html').write_text(detail)
          bulk=s.replace('class="vf-bulkbar" data-bulkbar hidden','class="vf-bulkbar" data-bulkbar').replace('<span data-selected-count>0</span>','<span data-selected-count>3</span>')
          (root/'audit-bulk.html').write_text(bulk)
          PY
      - name: Capture desktop and mobile
        run: |
          set -Eeuo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser); test -n "$BROWSER"
          for name in all cards start channels watch inbox add detail bulk; do "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1365,768 --screenshot="$SHOTS/${name}-1365x768.png" "http://127.0.0.1:$PORT/audit-${name}.html"; done
          for name in all channels watch add detail; do "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot="$SHOTS/${name}-390x844.png" "http://127.0.0.1:$PORT/audit-${name}.html"; done
          test "$(find "$SHOTS" -type f -name '*.png' -size +10k | wc -l)" -eq 14
          printf 'SOURCE=%s\nTREE=%s\nDESKTOP=1365x768\nMOBILE=390x844\n' "$SOURCE" "$TREE" >"$SHOTS/MANIFEST.txt"
      - name: Static visual contract assertions
        run: |
          set -Eeuo pipefail
          for f in "$ROOT"/audit-{all,cards,start,channels,watch,inbox}.html; do grep -F 'vf-app-sidebar' "$f" >/dev/null;grep -F '搜索标题、网址、分类或标签' "$f" >/dev/null;grep -F 'data-open-add' "$f" >/dev/null;! grep -F '你的互联网，从这里继续。' "$f";done
          grep -F 'vf-asset-actions' "$ROOT/audit-all.html" >/dev/null
          grep -F 'vf-card-grid' "$ROOT/audit-cards.html" >/dev/null
          grep -F 'vf-watch-grid' "$ROOT/audit-watch.html" >/dev/null
          grep -F 'data-accept-suggestion' "$ROOT/audit-inbox.html" >/dev/null
          grep -F 'vf-detail-drawer' "$ROOT/audit-detail.html" >/dev/null
          grep -F 'vf-bulkbar' "$ROOT/audit-bulk.html" >/dev/null
          echo P01_V227_SCREENSHOT_CONTRACT=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v227-workspace-productization-ui-${{ env.SOURCE }}
          path: /tmp/p01-v227-shots
          if-no-files-found: error
          retention-days: 7
      - name: Verdict
        run: |
          echo P01_V227_WORKSPACE_SCREENSHOT_AUDIT=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v227-shot.pid 2>/dev/null)" 2>/dev/null || true
