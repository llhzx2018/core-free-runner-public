# TEMP one-use P02 exact matrix -> real Clean FULL; close without merge. Existing free public Runner only.
name: TEMP P02 matrix environment to Clean FULL continuous proof
on:
  pull_request:
    branches: [main]
    types: [opened]
    paths: ['.github/workflows/p02-pr9-matrix-full-continuous-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-pr9-matrix-full-once
  cancel-in-progress: false
jobs:
  real-matrix-to-full:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-pr9-env-isolation-continuous-20261125' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MYSQL_DATABASE: vfdoc_ci}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pvfdoc_lock_synthetic_only" --health-interval=10s --health-timeout=5s --health-retries=18
      mariadb:
        image: mariadb:11.8
        env: {MARIADB_ROOT_PASSWORD: vfdoc_lock_synthetic_only, MARIADB_DATABASE: vfdoc_ci}
        ports: ['3307:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: fbe3ff8572b9869d0261d017e0f72831253967bf
          path: control
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo', tools: 'composer:v2', coverage: none}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo', tools: 'composer:v2', coverage: none}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - name: Verify exact source, shell, positive and negative test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C control rev-parse HEAD)" = fbe3ff8572b9869d0261d017e0f72831253967bf
          test "$(git -C control rev-parse HEAD^{tree})" = 4860af78373fe671ec820ea750a6cdc625b4c8c8
          test "$(git -C target rev-parse HEAD)" = b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          test "$(git -C target rev-parse HEAD^{tree})" = d524c7c4e34b7348e24c344c4c6696f86884743f
          bash -n control/scripts/p02-hyperv-exact-native.sh
          echo P02_TARGETED_BASH_SYNTAX=PASS
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status=0
          (cd control && python3 -B -m unittest discover -s tests -p 'test_*.py' -v) >"$output" 2>&1 || status="$?"
          count="$(grep -E '^Ran [0-9]+ tests? in [0-9.]+s$' "$output" | tail -1 | awk '{print $2}' || true)"
          printf 'P02_TARGETED_PYTHON_TEST_COUNT=%s\n' "$count"
          if test "$status" -ne 0 || ! [[ "$count" =~ ^[0-9]+$ ]] || test "$count" -lt 68 || ! grep -qx OK "$output"; then
            echo P02_TARGETED_PYTHON_TESTS=FAIL
            grep -E '^FAIL: test_[A-Za-z0-9_]+|^ERROR: test_[A-Za-z0-9_]+' "$output" | head -8 || true
            exit 1
          fi
          echo P02_TARGETED_PYTHON_TESTS=PASS
          if (cd control && python3 -B scripts/check_p02_hyperv_workflow_safety.py) >"$output" 2>&1; then
            echo P02_TARGETED_NATIVE_SAFETY=PASS
          else
            echo P02_TARGETED_NATIVE_SAFETY=FAIL
            grep -Eo 'P02_NATIVE_COMMENT_STATIC=FAIL:[A-Z_]+' "$output" | tail -1 || true
            exit 1
          fi
      - name: Execute EXACT six-combo native function then full real HTTP install on three DBs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          pids=""
          cleanup_children() { for pid in $pids; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup_children EXIT
          original_path="$PATH"
          mysql_name="$(docker ps --filter ancestor=mysql:8.4 --format '{{.Names}}' | head -1)"
          maria_name="$(docker ps --filter ancestor=mariadb:11.8 --format '{{.Names}}' | head -1)"
          test -n "$mysql_name" && test -n "$maria_name" || { echo P02_TARGETED_DB_VISIBILITY=FAIL; exit 1; }
          echo P02_TARGETED_DB_VISIBILITY=PASS
          python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path('control/scripts/p02-hyperv-exact-native.sh').read_text()
          a=re.search(r'(?ms)^php_versions_and_engines\(\) \(\n.*?^\)\ncheck_matrix_env_isolation\(\) \{\n.*?^\}\n(?=build_full\(\) \{)',s)
          b=re.search(r'(?ms)^build_full\(\) \{\n.*?^\}\n(?=full_recovery_and_browser\(\) \{)',s)
          assert a is not None and b is not None
          p=pathlib.Path('control/.p02-scoped-matrix-functions.sh')
          p.write_text(a.group(0)+'\n'+b.group(0)+'\n')
          p.chmod(0o600)
          PY
          source control/.p02-scoped-matrix-functions.sh
          php_versions_and_engines
          check_matrix_env_isolation
          build_full
          base="$RUNNER_TEMP/vfdoc-full-lab"
          php -r '$x=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","vfdoc_lock_synthetic_only");$x->exec("CREATE DATABASE ".chr(96)."vfdoc-ci".chr(96));' >"$base/hyphen-mysql.log" 2>&1
          php -r '$x=new PDO("mysql:host=127.0.0.1;port=3307;charset=utf8mb4","root","vfdoc_lock_synthetic_only");$x->exec("CREATE DATABASE ".chr(96)."vfdoc-ci".chr(96));' >"$base/hyphen-mariadb.log" 2>&1
          echo P02_TARGETED_HYPHEN_DATABASES=PASS
          for engine in sqlite mysql mariadb; do
            case "$engine" in
              sqlite) port=8131; dbport=3306;;
              mysql) port=8132; dbport=3306;;
              mariadb) port=8133; dbport=3307;;
            esac
            mkdir -p "$base/$engine"
            unzip -q "$base/full.zip" -d "$base/$engine"
            printf '%s\n' '<?php' '$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);' 'if(is_file(__DIR__."/public".$p))return false;' 'require __DIR__."/public/index.php";' >"$base/$engine/router.php"
            php -S "127.0.0.1:$port" -t "$base/$engine/public" "$base/$engine/router.php" >"$base/server-$engine.log" 2>&1 &
            pids="$pids $!"
            ready=0
            for n in $(seq 1 40); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$port/setup.php" 2>/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" -eq 1 || { printf 'P02_TARGETED_HTTP_START_%s=FAIL\n' "$engine"; exit 1; }
            if python3 target/tests/e2e/full_install_probe.py --root "$base/$engine" --base "http://127.0.0.1:$port" --engine "$engine" --db-port "$dbport" --db-name "vfdoc-ci" --mode clean >"$base/clean-$engine.log" 2>&1; then
              grep -qx 'P02_STAGE4_ACTUAL_FULL_INSTALL_LOGIN=PASS' "$base/clean-$engine.log" || { printf 'P02_TARGETED_AUTH_WORKSPACE_%s=FAIL\n' "$engine"; exit 1; }
              http="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/login" 2>/dev/null || true)"
              printf 'P02_TARGETED_LOGIN_GET_%s_HTTP=%s\n' "$engine" "$http"
              test "$http" = 200 || exit 1
              printf 'P02_TARGETED_AUTH_WORKSPACE_%s=PASS\n' "$engine"
            else
              printf 'P02_TARGETED_AUTH_WORKSPACE_%s=FAIL\n' "$engine"
              python3 -B control/scripts/p02_clean_full_diagnostics.py --engine "$engine" --probe-log "$base/clean-$engine.log" --server-log "$base/server-$engine.log" --output "$base/safe-$engine.log" || true
              exit 1
            fi
          done
          echo P02_TARGETED_MATRIX_THEN_REAL_FULL_3DB=PASS
      - name: Always remove private source, FULL and synthetic logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/vfdoc-full-lab" "$RUNNER_TEMP/p02-runtime-bin"
          rm -f -- "$RUNNER_TEMP/p02-frozen-php.log" "$RUNNER_TEMP/vfdoc-full-build.log"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/vfdoc-full-lab"
          echo P02_TARGETED_PRIVATE_CLEAN=PASS
