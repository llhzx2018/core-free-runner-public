name: P07 System Care Smoke

on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-system-care-smoke.yml'
  pull_request:
    paths:
      - 'packages/p07-system-care/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-system-care-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          bash -n installers/p07-system-care.sh
          for f in "$pkg"/*.sh "$pkg"/lib/*.sh; do
            bash -n "$f"
          done

      - name: Exact package blob manifest
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          while read -r expected path; do
            test -n "$expected"
            test -n "$path"
            actual="$(git hash-object "$pkg/$path")"
            test "$actual" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          grep -Fq 'PACKAGE_BYTES_MATCH_PRIVATE_SOURCE=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'ZERO_WORK_MENU_CONTRACT=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'BUILTIN_MENU_HOT_PATH=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'UPDATE_PREFLIGHT_GUARD=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'CLOUDPANEL_RUNTIME_PACKAGE_GUARD=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'DOWNGRADE_REMOVAL_GUARD=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'PREFLIGHT_SCOPE_PROPAGATION_FIX=YES' "$pkg/SOURCE_IDENTITY"
          grep -Fq 'OWNER_RC4_SECURITY_UPDATE_FIELD=PASS' "$pkg/SOURCE_IDENTITY"

      - name: Menu hot path must avoid external forks
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          shim="$(mktemp -d)"
          marker="$(mktemp)"
          rm -f "$marker"
          for cmd in apt apt-get systemctl df du journalctl sshd ss ufw firewall-cmd nft fail2ban-client clear awk cat dirname; do
            printf '#!/usr/bin/env bash\necho %s >> %q\nexit 98\n' "$cmd" "$marker" > "$shim/$cmd"
            chmod +x "$shim/$cmd"
          done

          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/status.sh" quick | tee /tmp/quick.txt
          test ! -e "$marker"
          grep -q '^P07_SYSTEM_CARE_STATUS=UNKNOWN$' /tmp/quick.txt

          printf '0\n' | PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" menu | tee /tmp/updates-menu.txt
          test ! -e "$marker"
          grep -Fq '1. 检查更新' /tmp/updates-menu.txt
          grep -Fq '4. 安装可用更新（安全模式）' /tmp/updates-menu.txt

          printf '0\n' | PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/cleanup.sh" menu | tee /tmp/cleanup-menu.txt
          test ! -e "$marker"
          grep -Fq '1. 扫描可清理空间' /tmp/cleanup-menu.txt

          grep -Fq 'menu hot paths use Bash builtins + cache reads only' "$pkg/vf-system-care.sh"
          ! grep -Eq 'bash[[:space:]]+"\$SCRIPT_DIR/status\.sh"[[:space:]]+quick|^[[:space:]]*clear([[:space:]]|$)' "$pkg/vf-system-care.sh"
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' "$pkg/updates.sh" "$pkg/cleanup.sh"
          rm -rf "$shim" "$marker"

      - name: Guard exact owner downgrade failure class
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          shim="$(mktemp -d)"
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          The following packages will be DOWNGRADED:
            sgml-base
          0 upgraded, 0 newly installed, 1 downgraded, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/apt-get"
          set +e
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight > /tmp/downgrade.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 91
          grep -Fq '检测到降级或移除包计划' /tmp/downgrade.txt
          rm -rf "$shim"

      - name: Guard CloudPanel runtime packages
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          shim="$(mktemp -d)"
          cat > "$shim/clpctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          Inst php8.4-cli [8.4.1] (8.4.2 vendor:stable [amd64])
          1 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/clpctl" "$shim/apt-get"
          set +e
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight > /tmp/cloudpanel.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 92
          grep -Fq 'CloudPanel / 网站运行栈相关包' /tmp/cloudpanel.txt
          grep -Fq 'php8.4-cli' /tmp/cloudpanel.txt
          rm -rf "$shim"

      - name: Allow safe non-panel upgrade plan
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          shim="$(mktemp -d)"
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          Inst bash [5.2] (5.2.1 Debian:stable [amd64])
          1 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/apt-get"
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight | tee /tmp/safe.txt
          grep -Fq '升级安全预检通过' /tmp/safe.txt
          rm -rf "$shim"

      - name: Read-only action smoke
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          test "$(NO_COLOR=1 bash "$pkg/vf-system-care.sh" --version)" = 'P07 System Care 0.1.0-rc6'
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" status | tee /tmp/status.txt
          grep -q '^P07_SYSTEM_CARE_STATUS=' /tmp/status.txt
          grep -q '^P07_SYSTEM_CARE_ROOT_DISK_PCT=' /tmp/status.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" audit | tee /tmp/audit.txt
          grep -Fq 'P07 · 一键系统体检' /tmp/audit.txt
          grep -Fq 'CloudPanel' /tmp/audit.txt
          grep -Fq '不会被修改' /tmp/audit.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" cleanup scan | tee /tmp/cleanup.txt
          grep -Fq '不会删除网站' /tmp/cleanup.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" security | tee /tmp/security.txt
          grep -Fq '只检查，不修改 SSH' /tmp/security.txt

      - name: Internal bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          sudo NO_COLOR=1 bash installers/p07-system-care.sh audit | tee /tmp/bootstrap-audit.txt
          test "$(sudo NO_COLOR=1 /usr/local/bin/vf-system-care --version)" = 'P07 System Care 0.1.0-rc6'
          sudo NO_COLOR=1 bash /opt/vf-system-care/status.sh quick | grep -q '^P07_SYSTEM_CARE_STATUS='
          grep -Fq 'CloudPanel' /tmp/bootstrap-audit.txt

      - name: Mutation boundary static checks
        shell: bash
        run: |
          set -euo pipefail
          pkg='packages/p07-system-care/0.1.0-rc6'
          ! grep -REn --include='*.sh' 'rm[[:space:]]+-rf[[:space:]]+/(var|home|etc|tmp|root)([ /]|$)' "$pkg"
          ! grep -REn --include='*.sh' '(ufw[[:space:]]+(enable|allow|deny|delete)|firewall-cmd.*--add|nft[[:space:]]+(add|delete)|iptables[[:space:]]+-[AIDF])' "$pkg"
          ! grep -REn --include='*.sh' '(sed|perl|python).*sshd_config' "$pkg"
          ! grep -REn --include='*.sh' '/home/[^ ]+/htdocs|/etc/nginx/sites|/etc/php|/etc/mysql' "$pkg"
          ! grep -Fq -- '--allow-downgrades' "$pkg/updates.sh"
          grep -Fq 'journalctl --vacuum-time=14d' "$pkg/cleanup.sh"
          grep -Fq 'apt-get clean' "$pkg/cleanup.sh"
          grep -Fq '不会自动重启' "$pkg/updates.sh"
