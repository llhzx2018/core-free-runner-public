name: P07 System Care Smoke

on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-system-care-smoke.yml'
  pull_request:
    paths:
      - 'packages/p07-system-care/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-system-care-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          persist-credentials: false

      - name: Resolve current System Care package route
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^VERSION='\\([^']*\\)'/\\1/p" installers/p07-system-care.sh | head -n1)"
          test -n "$version"
          pkg="packages/p07-system-care/$version"
          test -f "$pkg/VERSION"
          test "$(tr -d '\r\n' < "$pkg/VERSION")" = "$version"
          manifest_blob="$(sed -n "s/^MANIFEST_BLOB='\\([0-9a-f]\\{40\\}\\)'/\\1/p" installers/p07-system-care.sh | head -n1)"
          test -n "$manifest_blob"
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = "$manifest_blob"
          echo "P07_SYSTEM_CARE_VERSION=$version" >> "$GITHUB_ENV"
          echo "P07_SYSTEM_CARE_PKG=$pkg" >> "$GITHUB_ENV"
          echo "P07_SYSTEM_CARE_MANIFEST_BLOB=$manifest_blob" >> "$GITHUB_ENV"

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          bash -n installers/p07-system-care.sh
          for f in "$pkg"/*.sh "$pkg"/lib/*.sh; do
            bash -n "$f"
          done

      - name: Exact package blob manifest
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          while read -r expected path; do
            test -n "$expected"
            test -n "$path"
            actual="$(git hash-object "$pkg/$path")"
            test "$actual" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          test "$(tr -d '\r\n' < "$pkg/VERSION")" = "$P07_SYSTEM_CARE_VERSION"
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = "$P07_SYSTEM_CARE_MANIFEST_BLOB"
          grep -Fq 'PACKAGE_PATH="packages/p07-system-care/${VERSION}"' installers/p07-system-care.sh
          grep -Fq "VERSION='${P07_SYSTEM_CARE_VERSION}'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='${P07_SYSTEM_CARE_MANIFEST_BLOB}'" installers/p07-system-care.sh

      - name: Menu hot path must avoid external forks
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          shim="$(mktemp -d)"
          marker="$(mktemp)"
          rm -f "$marker"
          for cmd in apt apt-get systemctl df du journalctl sshd ss ufw firewall-cmd nft fail2ban-client clear awk cat dirname; do
            printf '#!/usr/bin/env bash\necho %s >> %q\nexit 98\n' "$cmd" "$marker" > "$shim/$cmd"
            chmod +x "$shim/$cmd"
          done

          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/status.sh" quick | tee /tmp/quick.txt
          test ! -e "$marker"
          grep -q '^P07_SYSTEM_CARE_STATUS=UNKNOWN$' /tmp/quick.txt

          printf '0\n' | PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" menu | tee /tmp/updates-menu.txt
          test ! -e "$marker"
          grep -Fq '1. 检查更新' /tmp/updates-menu.txt
          grep -Fq '4. 安装可用更新（安全模式）' /tmp/updates-menu.txt

          printf '0\n' | PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/cleanup.sh" menu | tee /tmp/cleanup-menu.txt
          test ! -e "$marker"
          grep -Fq '1. 扫描可清理空间' /tmp/cleanup-menu.txt

          grep -Fq 'menu hot paths use Bash builtins + cache reads only' "$pkg/vf-system-care.sh"
          ! grep -Eq 'bash[[:space:]]+"\$SCRIPT_DIR/status\.sh"[[:space:]]+quick|^[[:space:]]*clear([[:space:]]|$)' "$pkg/vf-system-care.sh"
          ! grep -Eq '^[[:space:]]*clear([[:space:]]|$)' "$pkg/updates.sh" "$pkg/cleanup.sh"
          rm -rf "$shim" "$marker"

      - name: Guard exact owner downgrade failure class
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          shim="$(mktemp -d)"
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          The following packages will be DOWNGRADED:
            sgml-base
          0 upgraded, 0 newly installed, 1 downgraded, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/apt-get"
          set +e
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight > /tmp/downgrade.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 91
          grep -Fq '检测到降级或移除包计划' /tmp/downgrade.txt
          rm -rf "$shim"

      - name: Guard CloudPanel runtime packages
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          shim="$(mktemp -d)"
          cat > "$shim/clpctl" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          Inst php8.4-cli [8.4.1] (8.4.2 vendor:stable [amd64])
          1 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/clpctl" "$shim/apt-get"
          set +e
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight > /tmp/cloudpanel.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 92
          grep -Fq 'CloudPanel / 网站运行栈相关包' /tmp/cloudpanel.txt
          grep -Fq 'php8.4-cli' /tmp/cloudpanel.txt
          rm -rf "$shim"

      - name: Allow safe non-panel upgrade plan
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          shim="$(mktemp -d)"
          cat > "$shim/apt-get" <<'EOF'
          #!/usr/bin/env bash
          if [[ " $* " == *" -s "* ]]; then
            cat <<'OUT'
          Inst bash [5.2] (5.2.1 Debian:stable [amd64])
          1 upgraded, 0 newly installed, 0 to remove and 0 not upgraded.
          OUT
            exit 0
          fi
          exit 97
          EOF
          chmod +x "$shim/apt-get"
          PATH="$shim:$PATH" NO_COLOR=1 bash "$pkg/updates.sh" preflight | tee /tmp/safe.txt
          grep -Fq '升级安全预检通过' /tmp/safe.txt
          rm -rf "$shim"

      - name: Read-only action smoke
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          test "$(NO_COLOR=1 bash "$pkg/vf-system-care.sh" --version)" = "P07 System Care $P07_SYSTEM_CARE_VERSION"
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" status | tee /tmp/status.txt
          grep -q '^P07_SYSTEM_CARE_STATUS=' /tmp/status.txt
          grep -q '^P07_SYSTEM_CARE_ROOT_DISK_PCT=' /tmp/status.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" audit | tee /tmp/audit.txt
          grep -Fq 'P07 · 一键系统体检' /tmp/audit.txt
          grep -Fq 'CloudPanel' /tmp/audit.txt
          grep -Fq '不会被修改' /tmp/audit.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" cleanup scan | tee /tmp/cleanup.txt
          grep -Fq '不会删除网站' /tmp/cleanup.txt
          NO_COLOR=1 bash "$pkg/vf-system-care.sh" security | tee /tmp/security.txt
          grep -Fq '只检查，不修改 SSH' /tmp/security.txt

      - name: Resource profile engine
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          python3 -m py_compile "$pkg/lib/resource_profile.py" "$pkg/lib/resource_apply.py"
          python3 tests/test_p07_resource_profile.py
          python3 tests/test_p07_resource_apply.py
          NO_COLOR=1 bash "$pkg/resource-profile.sh" matrix --mode balanced | tee /tmp/resource-matrix.txt
          grep -Fq 'P07 Resource Profile Matrix · balanced' /tmp/resource-matrix.txt
          grep -Fq 'READ_ONLY_RECOMMENDATION' "$pkg/resource-profile.sh"
          NO_COLOR=1 bash "$pkg/resource-apply.sh" plan | tee /tmp/resource-safe-plan.txt
          grep -Fq 'PREVIEW_ONLY_BLOCKED' /tmp/resource-safe-plan.txt
          grep -Fq 'CAP-ONLY' "$pkg/resource-apply.sh"
          grep -Fq '6. Safe Plan / Apply / Rollback（会写配置，需确认）' "$pkg/resource-profile.sh"
          grep -Fq 'apply / rollback = PRODUCTION_HIGH_RISK_EXPLICIT_CONFIRMATION' "$pkg/resource-profile.sh"
          grep -Fq '8. 资源优化 / 配置推荐' "$pkg/vf-system-care.sh"

      - name: Current routed System Care bootstrap smoke
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "SYSTEM_CARE_EXPECTED=\"${P07_SYSTEM_CARE_VERSION}\"" installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_INSTALLER="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh"' installers/p07-toolbox.sh
          grep -Fq "VERSION='${P07_SYSTEM_CARE_VERSION}'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='${P07_SYSTEM_CARE_MANIFEST_BLOB}'" installers/p07-system-care.sh
          source_ref="${{ github.event.pull_request.head.sha || github.sha }}"
          sudo env NO_COLOR=1 P07_SYSTEM_CARE_SOURCE_REF="$source_ref" bash installers/p07-system-care.sh audit | tee /tmp/bootstrap-audit.txt
          test "$(sudo NO_COLOR=1 /usr/local/bin/vf-system-care --version)" = "P07 System Care $P07_SYSTEM_CARE_VERSION"
          sudo NO_COLOR=1 bash /opt/vf-system-care/status.sh quick | grep -q '^P07_SYSTEM_CARE_STATUS='
          grep -Fq 'CloudPanel' /tmp/bootstrap-audit.txt
          test -x /opt/vf-system-care/intrusion-evidence.sh
          test -x /opt/vf-system-care/intrusion-evidence-entry.sh
          test -f /opt/vf-system-care/lib/intrusion_evidence.py
          test -x /opt/vf-system-care/resource-profile.sh
          test -f /opt/vf-system-care/lib/resource_profile.py
          test -x /opt/vf-system-care/resource-apply.sh
          test -f /opt/vf-system-care/lib/resource_apply.py
          grep -Fq '7. 网站入侵留证' /opt/vf-system-care/vf-system-care.sh
          grep -Fq '8. 资源优化 / 配置推荐' /opt/vf-system-care/vf-system-care.sh
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care resources matrix --mode balanced | grep -Fq 'P07 Resource Profile Matrix · balanced'
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care resources plan | grep -Fq 'PREVIEW_ONLY_BLOCKED'

      - name: Mutation boundary static checks
        shell: bash
        run: |
          set -euo pipefail
          pkg="$P07_SYSTEM_CARE_PKG"
          ! grep -REn --include='*.sh' 'rm[[:space:]]+-rf[[:space:]]+/(var|home|etc|tmp|root)([ /]|$)' "$pkg"
          ! grep -REn --include='*.sh' '(ufw[[:space:]]+(enable|allow|deny|delete)|firewall-cmd.*--add|nft[[:space:]]+(add|delete)|iptables[[:space:]]+-[AIDF])' "$pkg"
          ! grep -REn --include='*.sh' '(sed|perl|python).*sshd_config' "$pkg"
          ! grep -REn --include='*.sh' '/home/[^ ]+/htdocs|/etc/nginx/sites|/etc/php|/etc/mysql' "$pkg"
          ! grep -Fq -- '--allow-downgrades' "$pkg/updates.sh"
          grep -Fq 'journalctl --vacuum-time=14d' "$pkg/cleanup.sh"
          grep -Fq 'apt-get clean' "$pkg/cleanup.sh"
          grep -Fq '不会自动重启' "$pkg/updates.sh"
