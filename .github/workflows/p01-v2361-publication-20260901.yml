name: P01 V2.36.1 Publication
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-publication-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      FORMAL_TREE: 889d7662cf7907cc93d958c5df31f7824faa050a
      RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      FORMAL_RUN: '33473351744'
      FORMAL_ARTIFACT: p01-v2361-formal-artifacts-33473351744
      FORMAL_DIGEST: sha256:1077d964e0f8e3e9a0f4f363f89c15f83e03d6d97b217697534f629d858c1080
      STRICT_RUN: '33473626306'
      PROMOTION_RUN: '33473995889'
      DOWNLOAD: /tmp/p01-v2361-publish-download
      ROUNDTRIP: /tmp/p01-v2361-release-roundtrip
      EVID: /tmp/p01-v2361-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Publish exact tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.1-FULL.zip' -print -quit)
          test -n "$FULL"
          PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PROMOTION_RUN --jq .conclusion)" = success
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FORMAL_SOURCE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.1 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.36.1 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/sha256-check.txt"
          jq -e '.formal_source=="23321270d79fc98d529c2c5a0ef07e0f1012835a" and .formal_tree=="889d7662cf7907cc93d958c5df31f7824faa050a" and .runtime_tree=="91f92c5d3e7080469a7f5ab1497145454014c87a" and .version=="2.36.1" and .source_version=="2.36.0" and .schema=="2026082901" and .migration==null and .owner_production_write==false' P01-V2.36.1-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF-Start-V2.36.1-FULL.zip | awk '{print $1}')" = ea8abae0f971ad34568626848f620e7dc8debf1241dc981dd3ebb76f4a16f492
          test "$(stat -c %s VF-Start-V2.36.1-FULL.zip)" = 646776
          test "$(sha256sum VF_Start_V2.36.1_UPDATE.zip | awk '{print $1}')" = ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf
          test "$(stat -c %s VF_Start_V2.36.1_UPDATE.zip)" = 1391840
          test "$(sha256sum repair-v2.36.1.php | awk '{print $1}')" = b63904bfda876b97e63a899affc0d39845fe31d4e38b830ed9c5df2738cf2c74
          test "$(stat -c %s repair-v2.36.1.php)" = 4011889
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.36.1"
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.1 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          gh release create v2.36.1 "$PACK"/* --repo llhzx2018/vf-start --verify-tag --title 'VF Start V2.36.1' --notes 'V2.36.1 是 V2.36.0 的产品语义修复补丁：撤销误引入的“管理员视角 / 公开预览”双视角模型，恢复 VF Start 原本的单一前台登录模型。匿名访问仍只看到公开内容；管理员登录后在同一前台直接看到公开 + 私人内容，并保留管理入口，不再需要在两套视角之间切换。旧 public_view / preview_return 查询参数不再改变登录后的真实权限与前台状态。Schema 仍为 2026082901，无 Migration。Candidate Readiness 33472637909 PASS；Formal Artifact 33473351744 PASS；Strict Fresh R2 33473626306 PASS；Main Promotion 33473995889 PASS。Strict Fresh R1 33473521462 属于 HARNESS ONLY：将“匿名不可见”错误写成“匿名 DOM 不存在”，未触发 Product 字节修改。Owner Production 不由 Assistant 写入。'
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.1 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.1
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.36.1 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$PACK"/*; do
            n=$(basename "$f")
            test -f "$ROUNDTRIP/$n"
            test "$(sha256sum "$f"|awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n"|awk '{print $1}')"
            test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"
          done
          UPDATE_SHA=$(sha256sum "$ROUNDTRIP/VF_Start_V2.36.1_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c %s "$ROUNDTRIP/VF_Start_V2.36.1_UPDATE.zip")
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2361_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nUPDATE_ASSET=VF_Start_V2.36.1_UPDATE.zip\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2361-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
