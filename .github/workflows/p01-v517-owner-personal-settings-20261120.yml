name: P01 v517 exact-source Owner personal settings native HTTPS
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  one-shot-owner-preferences:
    if: github.head_ref == 'test/p01-v517-verified-personal-settings-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Scope synthetic and no private real Owner bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_REAL_OWNER_PRIVATE_SOURCE=NOT_SUPPLIED
          echo P01_TEST_SOURCE=SYNTHETIC_ONLY
          echo P01_PRODUCTION_AND_DNS=UNTOUCHED
      - name: Transient exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 89da4d4143eff6cb943c7c2008b96b0c315e3c64
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact candidate and synthetic scenario
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "89da4d4143eff6cb943c7c2008b96b0c315e3c64"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py
          grep -q "verifyPersonalSettings" candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          echo P01_OWNER_PREFERENCE_CANDIDATE_SHA_AND_SOURCE=PASS
      - name: Native Nginx PHP SQLite ZIP Composer dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx openssl curl unzip composer php8.3-cli php8.3-fpm \
            php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >/dev/null
          php -l candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          php -r 'if(!in_array("sqlite",PDO::getAvailableDrivers(),true)||!class_exists("ZipArchive"))exit(2);'
          echo P01_OWNER_PREFERENCE_PHP_SQLITE_ZIP=PASS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build real lockfile-based Laravel FULL and CloudPanel staging ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 89da4d4143eff6cb943c7c2008b96b0c315e3c64 \
            --output /tmp/p01-preferences-clean.zip
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip /tmp/p01-preferences-clean.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip /tmp/p01-preferences-clean.zip \
            --output /tmp/p01-preferences-cloudpanel.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip /tmp/p01-preferences-cloudpanel.zip
          echo P01_OWNER_PREFERENCE_VUE_AND_FULL_BUILD=PASS
      - name: Actual installed Owner HTTPS preferences recovery tamper/negative and 5 media SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle /tmp/p01-preferences-cloudpanel.zip \
            --engine sqlite --only-owner-media-restore
          echo P01_OWNER_PREFERENCE_REAL_HTTPS_COMPLETE=PASS
      - name: Always clean private transient source and packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-preferences-clean.zip /tmp/p01-preferences-cloudpanel.zip
          echo P01_TRANSIENT_PRIVATE_SOURCE_AND_PACKAGES_REMOVED=YES
