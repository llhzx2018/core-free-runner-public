name: TEMP S01-C02 Ops 1.21.840 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121835-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121835-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 6f8df5f3825172a4a3ee6b4ba763341d92461dca
      UPDATE_CANDIDATE: 08e8d7a431107bca10d2685622511b2b51505c16
      PRODUCT_COMMIT: ff318550ca92a61d34ddef549af2054faa911db7
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.840.zip
      BYTES: '3287320'
      SHA256: 0961aff1b5d25e9a48dcf049b58afae02c7a1530e3b2fa9e485f79c3fffe2a3e
      FP: 874d218f5a0f9d864722b2237650647638697d5041f803eaa81525f0928f09e2
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.840" and .from_versions==["1.21.839"] and .release_tag=="v1.21.840" and .asset_name=="vf-tools-ops_V1.21.840.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==922 and .runtime_file_count==922 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-05T22:49:27Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.840' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.tag_name=="v1.21.840" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.839" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.839" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobNonAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobFailureSegmentCounts.candidate_processing==1 and .activeStaticJobFailureSubtypeLeafCount==1 and .activeStaticJobFailureSubtypeKnownCount==0 and .activeStaticJobFailureSubtypeOtherCount==1 and .activeStaticJobFailureSubtypeCounts.other==1 and .activeStaticJobInternalLinkFailureLeafCount==0 and .activeStaticJobInternalLinkUniqueTargetCount==0' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121840_UPDATE_CHANNEL_GATE
