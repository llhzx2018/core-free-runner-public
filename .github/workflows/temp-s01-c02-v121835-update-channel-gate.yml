name: TEMP S01-C02 Ops 1.21.839 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121835-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121835-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: d648b37b7871e2f3ed0a64a6ff777dc2f379ddf1
      UPDATE_CANDIDATE: 6f8df5f3825172a4a3ee6b4ba763341d92461dca
      PRODUCT_COMMIT: 6d35cf298edd8b4d0acad02cf47e5222fc66586d
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.839.zip
      BYTES: '3285039'
      SHA256: 604d7673c28043fea510614735d7da1a9135c4e1b14d49956e41d364b05dde34
      FP: 613d81b8111d37a77684b5895f7db3296e008695131ddd742b57ba5c92b40df5
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.839" and .from_versions==["1.21.838"] and .release_tag=="v1.21.839" and .asset_name=="vf-tools-ops_V1.21.839.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==921 and .runtime_file_count==921 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-05T22:27:37Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.839' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.tag_name=="v1.21.839" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.838" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.838" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRootItemStatus=="running" and .sourceRecoveryRootItemCode=="root_item_fresh_candidate_created" and .sourceRecoveryRootItemCandidateStatus=="running" and .sourceRecoveryRootItemCandidateCurrentStage==0 and .sourceRecoveryRootItemCandidateAuditFailureCount==0 and .sourceRecoveryRootItemCandidateBuildOffset==0 and .sourceRecoveryRootItemCandidateBuildTotal==0 and .sourceRecoveryRootItemCandidateHelperPhase=="" and .sourceRecoveryRootItemCandidateHelpersWritten==false' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121839_UPDATE_CHANNEL_GATE
