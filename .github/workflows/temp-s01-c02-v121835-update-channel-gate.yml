name: TEMP S01-C02 Ops 1.21.837 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121835-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121835-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: a8444f4a1c733cab313d5a250ae82ffe204780b9
      UPDATE_CANDIDATE: a4f26604aaa92df54ad2c0851deddc5450b951c4
      PRODUCT_COMMIT: d7c9a4bf8dd7e252f6f7897d9865d29be7da14d8
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.837.zip
      BYTES: '3277256'
      SHA256: 5da67c1d791bdd55ba922daba321e26da7bd5ebcd5ffcb7649683aa902541825
      FP: 54e5c1e46ab825711a0f53328962e9f0ee9975260475e564c08f27977413c558
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.837" and .from_versions==["1.21.836"] and .release_tag=="v1.21.837" and .asset_name=="vf-tools-ops_V1.21.837.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==919 and .runtime_file_count==919 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-05T21:57:01Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.837' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.tag_name=="v1.21.837" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.836" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.836" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryBuildCheckpointCandidateStatus=="fail" and .sourceRecoveryBuildCheckpointCandidateCurrentStage==4 and .sourceRecoveryBuildCheckpointCandidateBuildOffset==231 and .sourceRecoveryBuildCheckpointCandidateBuildTotal==231 and .sourceRecoveryBuildCheckpointCandidateHelperPhase=="helper_write" and .sourceRecoveryBuildCheckpointCandidateHelpersWritten==false and .sourceRecoveryBuildCheckpointCandidateCompletenessStatus=="pass" and .sourceRecoveryBuildCheckpointCandidateFailureClass=="candidate_helper_write_failed"' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121837_UPDATE_CHANNEL_GATE
