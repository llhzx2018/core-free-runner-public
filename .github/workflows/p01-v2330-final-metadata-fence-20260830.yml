name: P01 V2.33.0 Final Metadata Fence
on:
  push:
    branches: [task/p01-v2330-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2330-final-metadata-fence-20260830.yml
permissions:
  contents: read
jobs:
  fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: bfc122fe61bf629984583304fff37f7feaa0a294
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Final docs-bound exact-source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          EVID=/tmp/p01-v2330-final-metadata-fence
          rm -rf "$EVID" && mkdir -p "$EVID"
          test "$(git rev-parse HEAD)" = bfc122fe61bf629984583304fff37f7feaa0a294
          test "$(git rev-parse HEAD^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          git diff --name-only da430cf426915a11198cfb9c6aa5335da391402f...HEAD | sort > "$EVID/actual-docs-delta.txt"
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md | sort > "$EVID/expected-docs-delta.txt"
          diff -u "$EVID/expected-docs-delta.txt" "$EVID/actual-docs-delta.txt"
          test -z "$(git diff --name-only da430cf426915a11198cfb9c6aa5335da391402f...HEAD -- src)"
          test "$(cat VERSION)" = 2.33.0
          test "$(cat src/VERSION.txt)" = 2.33.0
          grep -Fx "define('VF_VERSION', '2.33.0');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .candidate_version VF_PROJECT.json)" = 2.33.0
          test "$(jq -r .candidate_schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .candidate_state VF_PROJECT.json)" = READY_FOR_L3_RELEASE_GATE
          test "$(jq -r .current_change.gates.candidate_readiness VF_PROJECT.json)" = 33268162412
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'NOT_STARTED / CANDIDATE ONLY'
          test "$(jq -r .v2_33_tag_state VF_PROJECT.json)" = NOT_CREATED
          test "$(jq -r .core_updates_v2_33_state VF_PROJECT.json)" = NOT_PUBLISHED
          grep -F 'PASS / READY_FOR_L3_RELEASE_GATE' docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md >/dev/null
          grep -F 'Unified Gate Run: 33268162412 / PASS' docs/evidence/P01_V2.33.0_CANDIDATE_READINESS_20260830.md >/dev/null
          git fetch origin main --quiet
          test "$(git rev-parse refs/remotes/origin/main)" = b63b6605a723e4e8d34dfb3368e0e7dd993558a6
          if git ls-remote --exit-code --tags origin refs/tags/v2.33.0 >/dev/null 2>&1; then echo 'UNEXPECTED_V233_TAG'; exit 1; fi
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2330_FINAL_METADATA_FENCE=PASS
          FINAL_CANDIDATE_SOURCE=bfc122fe61bf629984583304fff37f7feaa0a294
          FINAL_CANDIDATE_TREE=db5a6e2b6a852e6925727b974fb7130359e3cdf8
          RUNTIME_TREE=febc1b01a5b59963bc974cdc6455cfa824c0adc3
          VERSION=2.33.0
          SCHEMA=2026082901
          CANDIDATE_STATE=READY_FOR_L3_RELEASE_GATE
          UNIFIED_CANDIDATE_GATE=33268162412 PASS
          MAIN=b63b6605a723e4e8d34dfb3368e0e7dd993558a6
          V2_33_TAG=ABSENT
          CORE_UPDATES_V2_33=NOT_PUBLISHED
          OWNER_PRODUCTION_WRITE=NO
          FORMAL_RELEASE=NOT_STARTED
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final metadata fence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-final-metadata-fence-${{ github.run_id }}
          path: /tmp/p01-v2330-final-metadata-fence
          if-no-files-found: warn
          retention-days: 30
