name: TEMP V4.8 Final Closure Simple

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-v48-final-closure-simple.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run V4.8 final governance closure
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 .github/scripts/temp_v48_final_governance_closure.py
