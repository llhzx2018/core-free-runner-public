name: P02 V2.5.120 Premerge Proof

on:
  push:
    branches: [run/p02-v25120-hash-20260925]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ui/p02-v25120-backup-security-closure-20260925
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source and focused unit
        run: |
          cd product
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          node tests/unit/p02_v25120_backup_security_closure.mjs
          bash scripts/verify-repository.sh
          echo P02_V25120_PREMERGE_PROOF=PASS
