name: P02 v2.5.127 exact-source FORMAL RELEASE publication (Owner approved)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v25127-formal-release-publication.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.head_ref == 'test/p02-v25127-release-last-gates-20261112' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify exact immutable private source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Independent formal release prepublication machine + Release/Channel/Production source gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(cat product/VERSION)" = 2.5.127
          test -n "${GH_TOKEN:-}"
          test "$(gh api repos/llhzx2018/vf-library/branches/main --jq .commit.sha)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          for run in 43134717031 43129516583 43137739165 36252951505; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          echo P02_FORMAL_SOURCE_MACHINE_PROOFS=PASS
          gh api repos/llhzx2018/vf-library/releases/442384094 > "${RUNNER_TEMP}/p02-draft.json"
          gh api repos/llhzx2018/core-updates/contents/projects/P02.json?ref=main > "${RUNNER_TEMP}/p02-previous-channel.json"
          python3 - <<'PY'
          import json,base64,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          draft=json.loads((tmp/'p02-draft.json').read_text())
          assert draft['id']==442384094 and draft['draft'] is True and draft['prerelease'] is True and draft['published_at'] is None
          assert draft['tag_name']=='v2.5.127' and draft['target_commitish']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          expect={
           'repair-v2.5.127.php':(960328,'f59cd74c6d332448c8e9987cf3ed487ab2b7d03358c00f538e26b3b1eb5c1d23'),
           'SHA256SUMS.txt':(683,'c1651a6921a7c027b6088899c4c100527d69cdebab570634d7633e313f8da9b0'),
           'VF_Library_V2.5.127_ATOMIC.zip':(723519,'078a988b85a185e805c1d37c67b0f5849b7b1fb26d37a67db63585946e392358'),
           'VF_Library_V2.5.127_FULL.zip':(532870,'bd90624278e570d4b01013f84dffce31367c601eaf785051d12db9d3dbf4d596'),
           'VF_Library_V2.5.127_RELEASE_MANIFEST.json':(2785,'61a4f4fd9f14b6c21763f9691b3cb0c1f92419eb78b5ba0dfc4c52b10e647213'),
           'VF_Library_V2.5.127_RELEASE_NOTES.md':(396,'66fbc0cc6b1aa4ff7c79fb4b9b3497c7e346a61a61a22a36fce878ebb002ab09'),
           'VF_Library_V2.5.127_SOURCE.zip':(1157469,'ff7f50d7a475a5a46a63fb82d35de7e400c65b1890eebb88ac974e2e59e71946'),
           'VF_Library_V2.5.127_UPDATE.zip':(487266,'ce9f89d0df3690652edb3d1fca7e267529dd578a2bc33e25b4a68c228253d24f'),
          }
          assets={a['name']:a for a in draft['assets']}
          assert set(assets)==set(expect)
          for name,(size,sha) in expect.items():
            assert assets[name]['state']=='uploaded' and assets[name]['size']==size
            assert assets[name].get('digest')=='sha256:'+sha
          chanFile=json.loads((tmp/'p02-previous-channel.json').read_text())
          channel=json.loads(base64.b64decode(chanFile['content']))
          assert channel['target_version']=='2.5.124' and channel['release_id']==397288166 and channel['release_tag']=='v2.5.124'
          assert channel['asset_sha256']=='4ea859ebb2343a8b12920e086f789af159b27faa5831cbf86720c70cfc5e13ae'
          assert channel['schema_from']=='2401' and channel['schema_to']=='2401'
          assert len(channel['from_versions'])==18 and channel['from_versions'][-1]=='2.5.122'
          print('P02_FORMAL_PREPUB_RELEASE_ASSET_INTEGRITY=PASS')
          print('P02_FORMAL_PREPUB_DISTRIBUTION_SOURCE_SET=PASS')
          PY
          # Latest Owner-authenticated 2026-09-26 v2.5.124 evidence was
          # recorded in run 36252951505, not a fresh authenticated session.
          # Fresh unauthenticated static-file readback is a separate corroboration.
          live="$(curl -fsSL --max-time 12 --proto '=https' https://lib.kewaro.com/VERSION.txt | tr -d '\r\n')"
          test "$live" = '2.5.124' || { echo P02_FORMAL_PRODUCTION_SOURCE_DRIFT_STOP; exit 1; }
          echo P02_FORMAL_PUBLIC_VERSION_CORROBORATES_LAST_AUTHENTICATED_25124=PASS
          echo P02_FORMAL_FRESH_AUTHENTICATED_ADMIN_SESSION=NOT_PROVEN
          if gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.127 >/dev/null 2>&1; then
             echo P02_FORMAL_TAG_EXISTED_BEFORE_PUBLICATION_STOP
             exit 1
          fi
      - name: Promote existing byte-verified PRIVATE Draft to formal v2.5.127 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api --method PATCH repos/llhzx2018/vf-library/releases/442384094 -F draft=false -F prerelease=false > "${RUNNER_TEMP}/p02-published.json"
          gh api repos/llhzx2018/vf-library/releases/442384094 > "${RUNNER_TEMP}/p02-published-readback.json"
          gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.127 > "${RUNNER_TEMP}/p02-tag-readback.json"
          python3 - <<'PY'
          from pathlib import Path
          import os,json
          tmp=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((tmp/'p02-published-readback.json').read_text())
          tag=json.loads((tmp/'p02-tag-readback.json').read_text())
          assert r['id']==442384094 and r['tag_name']=='v2.5.127'
          assert r['draft'] is False and r['prerelease'] is False and r['published_at']
          assert r['target_commitish']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert tag['ref']=='refs/tags/v2.5.127'
          assert tag['object']['type']=='commit' and tag['object']['sha']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          before=json.loads((tmp/'p02-draft.json').read_text())
          first={a['name']:(a['id'],a['size'],a.get('digest')) for a in before['assets']}
          after={a['name']:(a['id'],a['size'],a.get('digest')) for a in r['assets']}
          assert first==after and len(after)==8
          print('P02_FORMAL_TAG_IDENTITY=PASS')
          print('P02_FORMAL_RELEASE_REMOTE_ASSETS_8_OF_8=PASS')
          print('P02_FORMAL_RELEASE_PUBLISHED=YES')
          print('P02_FORMAL_RELEASE_ID='+str(r['id']))
          print('P02_FORMAL_PUBLISHED_AT='+str(r['published_at']))
          print('P02_FORMAL_RELEASE_URL='+str(r['html_url']))
          PY
      - name: Purge private transient product
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_PRODUCT_PERSISTED_PUBLIC=NO
