name: P02 R34 Resizer Ownership Retirement Write
on:
  push:
    branches: [run/p02-r34-resizer-ownership-retire-write]
permissions:
  contents: read
jobs:
  retire:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 412eaccaf333884adfffe66005f1bb027d37a703
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Retire obsolete editing three-column ownership
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('public/assets/app.css')
          css=p.read_text(encoding='utf-8')
          start=css.index('/* V2.5.32 R27 consolidated source: v253-hotfix.css */')
          end=css.index('/* V2.5.32 R27 consolidated source: v254-common-branding.css */',start)
          block=css[start:end]
          selectors=[
            '.notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus){',
            '.notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-list-pane{',
            '.notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-resizer{',
            '.notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-detail-scroll{',
          ]
          for selector in selectors:
              if block.count(selector)!=1:
                  raise SystemExit(f'expected one legacy V2.5.3 selector: {selector} count={block.count(selector)}')
          import re
          for selector in selectors:
              pattern=re.escape(selector)+r'\n(?:.|\n)*?\n  \}'
              block,n=re.subn(pattern,'',block,count=1)
              if n!=1:
                  raise SystemExit(f'failed removing {selector}')
          old_intro=('/* VF Library V2.5.3 notebook resizer hotfix.\n'
                     ' * V2.5.2 restored the Document List in Edit/Split mode, but the legacy\n'
                     ' * .notebook-editing rule still forced a one-column grid. The resizer JS was\n'
                     ' * updating --notebook-list-width correctly, yet the grid no longer consumed\n'
                     ' * that variable, so dragging had no visible effect.\n'
                     ' */')
          new_intro=('/* VF Library V2.5.3 notebook resizer history, narrowed in V2.5.32.\n'
                     ' * The old Edit/Split three-column ownership is retired because V2.5.32\n'
                     ' * gives editing modes the full detail workspace. The general resizer hit\n'
                     ' * target remains for notebook states that still expose the boundary.\n'
                     ' */')
          if block.count(old_intro)!=1:
              raise SystemExit('V2.5.3 historical intro missing')
          block=block.replace(old_intro,new_intro,1)
          while '\n\n\n' in block:
              block=block.replace('\n\n\n','\n\n')
          css=css[:start]+block+css[end:]
          p.write_text(css,encoding='utf-8')

          identity_path=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          identity=json.loads(identity_path.read_text(encoding='utf-8'))
          identity['convergence']['legacy_editor_three_column_rule_retired']=True
          identity['next_gate']='RERUN_REAL_CHROMIUM_VISUAL_AND_TASK_FLOW_THEN_CONTINUE_RUNTIME_STYLE_CONVERGENCE_AUDIT'
          identity_path.write_text(json.dumps(identity,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lines=[
            "import fs from 'node:fs';",
            "import assert from 'node:assert/strict';",
            "const css=fs.readFileSync('public/assets/app.css','utf8');",
            "const start=css.indexOf('/* V2.5.32 R27 consolidated source: v253-hotfix.css */');",
            "const end=css.indexOf('/* V2.5.32 R27 consolidated source: v254-common-branding.css */',start);",
            "assert.ok(start>=0&&end>start,'V2.5.3 consolidated block missing');",
            "const block=css.slice(start,end);",
            "assert.ok(!block.includes('.notebook-layout.notebook-editing:not(.notebook-list-collapsed):not(.notebook-focus)'),'obsolete editing three-column ownership remains');",
            "assert.ok(block.includes('.notebook-resizer::after'),'general resizer hit target must remain');",
            "assert.ok(block.includes('.notebook-resizer .notebook-pane-collapse'),'collapse control z-index guard must remain');",
            "assert.ok(css.includes('.notebook-layout.notebook-mode-edit,.notebook-layout.notebook-mode-split{grid-template-columns:minmax(0,1fr)!important'),'V2.5.32 editing full-width rule missing');",
            "console.log('P02_EDITOR_GRID_OWNERSHIP_RETIREMENT=PASS');",
          ]
          Path('tests/unit/p02_editor_grid_ownership_retirement.mjs').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          ev=[
            '# P02 Editor Grid Ownership Retirement · 2026-08-31','',
            '## Finding','',
            'R33 real Chromium proved the list pane and resizer were hidden after R32, but `#notebookDetailScroll` stayed at 902px inside a 1196px notebook layout.','',
            'The historical V2.5.3 resizer block still forced `.notebook-editing` to three grid tracks and pinned the detail pane to column 3. Hidden first/second children did not retire those explicit grid tracks.','',
            '## Fix','',
            'Retire the four V2.5.3 rules that own the Edit/Split three-column grid. Keep only the general resizer hit-area and collapse-control stacking helpers for notebook states that still expose a resizer.','',
            'This removes obsolete ownership rather than adding another override layer.','',
            '## Boundary','',
            'No schema, API, content model, main, tag, release, update-channel, or production change.'
          ]
          Path('docs/evidence/P02_EDITOR_GRID_OWNERSHIP_RETIREMENT_20260831.md').write_text('\n'.join(ev)+'\n',encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py

      - name: Verify all contracts and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = '2.5.32'
          for t in tests/unit/p02_*.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==72
          assert c['candidate_version']=='2.5.32' and c['runtime_source_file_count']==72
          assert c['production_version']=='2.5.31'
          assert c['convergence']['legacy_editor_three_column_rule_retired'] is True
          print('P02_R34_EDITOR_GRID_OWNERSHIP_GATES=PASS')
          PY

      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(P02): retire obsolete V2.5.3 editor grid ownership'
          git push origin HEAD:develop
          git remote set-url origin "https://github.com/llhzx2018/vf-library"
          echo P02_DEVELOP_WRITE=PASS
          echo P02_MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
