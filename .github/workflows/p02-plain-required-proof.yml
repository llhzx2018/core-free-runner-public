name: P02 existing plain REQUIRED public rules exact proof (temporary)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p02-plain-required-proof.yml]

permissions:
  contents: read

jobs:
  p02-public-rules:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/p02-plain-required-exact-proof-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      GOV_SHA: cfb49d47123e22205d35a4f1a9af40f293eb31bf
      P02_SHA: ca58235dbbac5ee32fe95cc85ac74a0f234fd4d8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Exact canonical shared tool candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov

      - name: Exact P02 live stable authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02

      - name: Validate exact source and real unchanged P02 matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C p02 rev-parse HEAD)" = "$P02_SHA"
          test -z "$(git -C p02 status --porcelain --untracked-files=all)"
          echo P02_EXACT_SOURCES=PASS
          python3 - "$RUNNER_TEMP/receipt.json" "$P02_SHA" <<'PY'
          import json, sys
          receipt = {
            "schema": "vf.public-authority.task-delivery-check.v1",
            "project": "P02",
            "source": sys.argv[2],
            "project_authority": {
              "agents": "AGENTS.md",
              "current": "docs/authority/CURRENT.md",
              "acceptance": "docs/authority/RPD.md",
              "applicability": "docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers": [
              "单管理员、私人优先、长期积累",
              "一个工作区、一个内容对象"
            ],
            "required_domains": [
              "INSTALL", "UPGRADE", "SECURITY", "TESTING",
              "DATA_SCHEMA", "API_PROVIDER", "CRON_JOB",
              "NOTIFICATION", "OBSERVABILITY", "GIT", "UA_UI"
            ],
            "task_capabilities": ["formal_development", "source_change"],
            "delivery": {
              "profile": "web_full_zip",
              "entrypoint": "public/setup.php",
              "requires_git": False,
              "requires_manual_source_copy": False
            }
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(receipt, output, ensure_ascii=False)
          PY
          if python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
             --phase resolve --receipt "$RUNNER_TEMP/receipt.json" \
             --project-root p02 --artifact-root "$RUNNER_TEMP" \
             --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json \
             > "$RUNNER_TEMP/p02-positive.log" 2>&1; then
            grep -q '^CONTRACT_CHECK=RULES_RESOLVED$' "$RUNNER_TEMP/p02-positive.log"
            echo P02_PLAIN_REQUIRED_REAL_MATRIX=PASS
          else
            grep -E '^CONTRACT_(CHECK|REASON)=' "$RUNNER_TEMP/p02-positive.log" || true
            echo P02_PLAIN_REQUIRED_REAL_MATRIX=NOT_PROVEN
            exit 1
          fi

          python3 - "$RUNNER_TEMP/receipt.json" "$RUNNER_TEMP/negative.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              receipt = json.load(f)
          receipt["required_domains"].remove("NOTIFICATION")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              json.dump(receipt, f, ensure_ascii=False)
          PY
          if python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
             --phase resolve --receipt "$RUNNER_TEMP/negative.json" \
             --project-root p02 --artifact-root "$RUNNER_TEMP" \
             --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json \
             > "$RUNNER_TEMP/p02-negative.log" 2>&1; then
            echo P02_NEGATIVE_OMISSION_WAS_ACCEPTED=UNSAFE
            exit 1
          fi
          grep -q '^CONTRACT_REASON=PROJECT_REQUIRED_DOMAIN_OMITTED$' "$RUNNER_TEMP/p02-negative.log"
          echo P02_MISSING_REQUIRED_NEGATIVE=PASS
          echo P02_FORMAL_RELEASE_OR_PRODUCTION=NOT_PROVEN

      - name: Discard transient project sources and receipts
        if: always()
        shell: bash
        run: |
          rm -rf gov p02
          rm -f "$RUNNER_TEMP"/{receipt,negative}.json "$RUNNER_TEMP"/{p02-positive,p02-negative}.log
          echo P02_TRANSIENT_PRIVATE_SOURCE_CLEANUP=ATTEMPTED
