name: TEMP S01-C03 1.25.5 Core Updates Publication Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-core-updates-gate.yml'

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-1255-core-updates-publication-gate
  cancel-in-progress: true

env:
  CORE_UPDATES_BASE: 0658e0ffc605882b014ddae5c4396549abdbd467
  CORE_UPDATES_SHA: 8f99d1419574b8c00935542989ce680b2a0567e3
  M3U8_SHA: d7b67319ae3c0b077d39d0f84df3facd38a2c44d
  M3U8_ASSET_SHA256: f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399
  M3U8_ASSET_BYTES: '3529023'
  M3U8_RUNTIME_FILES: '550'
  M3U8_RUNTIME_FP: 973bf2da0adfc4729923c8fccf6e3f8b095eb769168fbf6cfb910f6fbc9cb483

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core-updates

      - name: Checkout exact M3U8 released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: v1.25.5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8

      - name: Verify exact base candidate and single-file boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(git -C core-updates merge-base "$CORE_UPDATES_BASE" "$CORE_UPDATES_SHA")" = "$CORE_UPDATES_BASE"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq '.commit.sha')" = "$CORE_UPDATES_BASE"
          git -C core-updates diff --name-only "$CORE_UPDATES_BASE" "$CORE_UPDATES_SHA" > /tmp/changed.txt
          printf '%s\n' projects/S01-C03.json > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(git -C core-updates diff --numstat "$CORE_UPDATES_BASE" "$CORE_UPDATES_SHA" | awk '{a+=$1;d+=$2} END{print a ":" d}')" = '13:13'
          git -C core-updates diff --check "$CORE_UPDATES_BASE" "$CORE_UPDATES_SHA"
          echo 'CANDIDATE_BOUNDARY=PASS'

      - name: Validate manifest identity and runtime fingerprint
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.load(open('core-updates/projects/S01-C03.json'))
          assert m['schema_version']=='wp-component-1.0'
          assert m['project_id']=='S01' and m['component_id']=='S01-C03'
          assert m['package_id']=='vf-tools-m3u8' and m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert m['target_version']=='1.25.5' and m['from_versions']==['1.25.4']
          assert m['release_tag']=='v1.25.5' and m['asset_name']=='vf-tools-m3u8_V1.25.5.zip'
          assert m['asset_bytes']==3529023
          assert m['asset_sha256']=='f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399'
          assert m['schema_from']=='1.3.0' and m['schema_to']=='1.3.0'
          assert m['runtime_files']==550 and m['runtime_file_count']==550
          assert m['runtime_fingerprint']=='973bf2da0adfc4729923c8fccf6e3f8b095eb769168fbf6cfb910f6fbc9cb483'
          assert m['runtime_fingerprint_sha256']==m['runtime_fingerprint']
          assert m['released_at']=='2026-09-02T14:46:58Z'
          root=Path('m3u8/src')
          files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          canon=b''.join(p.encode()+b'\0'+hashlib.sha256(b).hexdigest().encode()+b'\n' for p,b in sorted(files.items()))
          fp=hashlib.sha256(canon).hexdigest()
          assert len(files)==550 and fp=='973bf2da0adfc4729923c8fccf6e3f8b095eb769168fbf6cfb910f6fbc9cb483'
          evidence={
            'status':'PASS',
            'core_updates_base':'0658e0ffc605882b014ddae5c4396549abdbd467',
            'core_updates_candidate':'8f99d1419574b8c00935542989ce680b2a0567e3',
            'changed_files':['projects/S01-C03.json'],
            'm3u8_release_source':'d7b67319ae3c0b077d39d0f84df3facd38a2c44d',
            'target_version':'1.25.5',
            'from_versions':['1.25.4'],
            'schema':'1.3.0_TO_1.3.0',
            'asset_bytes':3529023,
            'asset_sha256':'f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399',
            'runtime_files':550,
            'runtime_fingerprint':'973bf2da0adfc4729923c8fccf6e3f8b095eb769168fbf6cfb910f6fbc9cb483',
            'core_updates_main_promotion':False,
            'production_write':False
          }
          Path('/tmp/s01-c03-1255-core-updates-gate.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
          echo 'MANIFEST_RUNTIME_IDENTITY=PASS'

      - name: Validate formal GitHub Release and exact asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rel="$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.5)"
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$M3U8_SHA"
          test "$(jq -r '.draft,.prerelease' <<<"$rel" | tr '\n' ' ')" = "false false "
          test "$(jq -r '[.assets[] | select(.name=="vf-tools-m3u8_V1.25.5.zip")] | length' <<<"$rel")" = '1'
          id="$(jq -r '.assets[] | select(.name=="vf-tools-m3u8_V1.25.5.zip") | .id' <<<"$rel")"
          test "$(jq -r '.assets[] | select(.name=="vf-tools-m3u8_V1.25.5.zip") | .size' <<<"$rel")" = "$M3U8_ASSET_BYTES"
          digest="$(jq -r '.assets[] | select(.name=="vf-tools-m3u8_V1.25.5.zip") | .digest // empty' <<<"$rel")"
          [ -z "$digest" ] || test "$digest" = "sha256:$M3U8_ASSET_SHA256"
          gh api -H 'Accept: application/octet-stream' "repos/llhzx2018/vf-tools-m3u8/releases/assets/$id" > /tmp/m3u8.zip
          test "$(stat -c%s /tmp/m3u8.zip)" = "$M3U8_ASSET_BYTES"
          test "$(sha256sum /tmp/m3u8.zip | awk '{print $1}')" = "$M3U8_ASSET_SHA256"
          echo 'FORMAL_RELEASE_ASSET=PASS'

      - name: Seal update-channel evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/S01_C03_1255_CORE_UPDATES_GATE.txt <<EOF
          S01_C03_1255_CORE_UPDATES_GATE=PASS
          CORE_UPDATES_BASE=$CORE_UPDATES_BASE
          CORE_UPDATES_CANDIDATE=$CORE_UPDATES_SHA
          M3U8_TARGET=1.25.5
          M3U8_FROM=1.25.4
          M3U8_RELEASE_MAIN=$M3U8_SHA
          M3U8_ASSET_SHA256=$M3U8_ASSET_SHA256
          M3U8_RUNTIME_FILES=$M3U8_RUNTIME_FILES
          M3U8_RUNTIME_FINGERPRINT=$M3U8_RUNTIME_FP
          M3U8_SCHEMA=1.3.0_TO_1.3.0
          CORE_UPDATES_MAIN_PROMOTION=NO
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload public-safe gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: s01-c03-1255-core-updates-gate-${{ github.run_id }}
          path: |
            /tmp/S01_C03_1255_CORE_UPDATES_GATE.txt
            /tmp/s01-c03-1255-core-updates-gate.json
          retention-days: 14
