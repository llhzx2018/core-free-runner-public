name: TEMP S01 Core Updates Release Channel Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_SHA: 6112d4ad68e13980f0dec70469f60351b22679cf
      OPS_SHA: a1eda8f80f8a7969b3b4d580b4b822c804c24984
      M3U8_SHA: e0bae05a97b5f1369ce1233438b3baed13ac503e
      OPS_ASSET_SHA256: 9205d54e9d285734596b6cacf7537dcefb2277ce6dfc4aaa5ef26a3e194dad51
      M3U8_ASSET_SHA256: 797ee12ea864219880792d7c23530d1df15a609f6792f7bb5fa79361fbbe1c84
    steps:
      - name: Checkout exact core-updates develop candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 6112d4ad68e13980f0dec70469f60351b22679cf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: core-updates

      - name: Checkout exact Ops released tag
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: v1.21.792
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8 released tag
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: v1.25.4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8

      - name: Validate manifest identity and runtime fingerprints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          c=Path('core-updates/projects')
          o=json.load(open(c/'S01-C02.json'))
          m=json.load(open(c/'S01-C03.json'))
          assert o['schema_version']=='wp-component-1.0'
          assert o['component_id']=='S01-C02' and o['package_id']=='vf-tools-ops' and o['plugin_file']=='vf-ops/vf-ops.php'
          assert o['target_version']=='1.21.792' and o['from_versions']==['1.21.791']
          assert o['release_tag']=='v1.21.792' and o['asset_name']=='vf-tools-ops_V1.21.792.zip'
          assert o['asset_bytes']==3182264 and o['asset_sha256']=='9205d54e9d285734596b6cacf7537dcefb2277ce6dfc4aaa5ef26a3e194dad51'
          assert o['schema_from']=='6.0.0' and o['schema_to']=='6.0.0'
          assert o['runtime_file_count']==890 and o['runtime_files']==890
          assert o['runtime_fingerprint_sha256']=='d185c0745598146d41301c72e5bc5d286c96e594114889d148dbe2e598ef31ab'
          assert o['runtime_fingerprint']==o['runtime_fingerprint_sha256']
          assert m['schema_version']=='wp-component-1.0'
          assert m['component_id']=='S01-C03' and m['package_id']=='vf-tools-m3u8' and m['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert m['target_version']=='1.25.4' and m['from_versions']==['1.25.3']
          assert m['release_tag']=='v1.25.4' and m['asset_name']=='vf-tools-m3u8_V1.25.4.zip'
          assert m['asset_bytes']==3524539 and m['asset_sha256']=='797ee12ea864219880792d7c23530d1df15a609f6792f7bb5fa79361fbbe1c84'
          assert m['schema_from']=='1.2.0' and m['schema_to']=='1.3.0'
          assert m['runtime_file_count']==549 and m['runtime_files']==549
          assert m['runtime_fingerprint_sha256']=='f358058578d6485b732c8725d44216d2a3cfed9be4f9f3b8a0a252243a9d1603'
          assert m['runtime_fingerprint']==m['runtime_fingerprint_sha256']
          def fp(files):
              return hashlib.sha256(b''.join(p.encode()+b'\0'+hashlib.sha256(b).hexdigest().encode()+b'\n' for p,b in sorted(files.items()))).hexdigest()
          ops=Path('ops')
          def ops_runtime(rel):
              p=rel.as_posix().lstrip('/'); parts=p.split('/')
              if not p or '..' in parts:return False
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
              if '/' not in p:return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          of={p.relative_to(ops).as_posix():p.read_bytes() for p in ops.rglob('*') if p.is_file() and not p.is_symlink() and ops_runtime(p.relative_to(ops))}
          mr=Path('m3u8/src')
          mf={p.relative_to(mr).as_posix():p.read_bytes() for p in mr.rglob('*') if p.is_file() and not p.is_symlink()}
          assert len(of)==o['runtime_file_count'] and fp(of)==o['runtime_fingerprint_sha256']
          assert len(mf)==m['runtime_file_count'] and fp(mf)==m['runtime_fingerprint_sha256']
          Path('/tmp/s01-core-updates-gate.json').write_text(json.dumps({'status':'PASS','core_updates_sha':'6112d4ad68e13980f0dec70469f60351b22679cf','ops':o,'m3u8':m},indent=2)+'\n')
          PY

      - name: Validate formal GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ops_json="$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.792)"
          m3_json="$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.4)"
          test "$(jq -r '.target_commitish' <<<"$ops_json")" = "$OPS_SHA"
          test "$(jq -r '.draft,.prerelease' <<<"$ops_json" | tr '\n' ' ')" = "false false "
          test "$(jq -r '.target_commitish' <<<"$m3_json")" = "$M3U8_SHA"
          test "$(jq -r '.draft,.prerelease' <<<"$m3_json" | tr '\n' ' ')" = "false false "
          ops_id="$(jq -r '.assets[] | select(.name=="vf-tools-ops_V1.21.792.zip") | .id' <<<"$ops_json")"
          m3_id="$(jq -r '.assets[] | select(.name=="vf-tools-m3u8_V1.25.4.zip") | .id' <<<"$m3_json")"
          test -n "$ops_id"; test -n "$m3_id"
          gh api -H 'Accept: application/octet-stream' "repos/llhzx2018/vf-tools-ops/releases/assets/$ops_id" > /tmp/ops.zip
          gh api -H 'Accept: application/octet-stream' "repos/llhzx2018/vf-tools-m3u8/releases/assets/$m3_id" > /tmp/m3.zip
          test "$(stat -c%s /tmp/ops.zip)" = "3182264"
          test "$(sha256sum /tmp/ops.zip | awk '{print $1}')" = "$OPS_ASSET_SHA256"
          test "$(stat -c%s /tmp/m3.zip)" = "3524539"
          test "$(sha256sum /tmp/m3.zip | awk '{print $1}')" = "$M3U8_ASSET_SHA256"

      - name: Seal update channel evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/S01_CORE_UPDATES_GATE.txt <<EOF
          S01_CORE_UPDATES_GATE=PASS
          CORE_UPDATES_DEVELOP=$CORE_UPDATES_SHA
          OPS_TARGET=1.21.792
          OPS_FROM=1.21.791
          OPS_RELEASE_MAIN=$OPS_SHA
          OPS_ASSET_SHA256=$OPS_ASSET_SHA256
          OPS_RUNTIME_FILES=890
          OPS_RUNTIME_FINGERPRINT=d185c0745598146d41301c72e5bc5d286c96e594114889d148dbe2e598ef31ab
          M3U8_TARGET=1.25.4
          M3U8_FROM=1.25.3
          M3U8_RELEASE_MAIN=$M3U8_SHA
          M3U8_ASSET_SHA256=$M3U8_ASSET_SHA256
          M3U8_RUNTIME_FILES=549
          M3U8_RUNTIME_FINGERPRINT=f358058578d6485b732c8725d44216d2a3cfed9be4f9f3b8a0a252243a9d1603
          M3U8_SCHEMA=1.2.0_TO_1.3.0
          PRODUCTION_READ=NO
          PRODUCTION_WRITE=NO
          EOF

      - name: Upload public-safe gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: s01-core-updates-gate-${{ github.run_id }}
          path: |
            /tmp/S01_CORE_UPDATES_GATE.txt
            /tmp/s01-core-updates-gate.json
          retention-days: 14
