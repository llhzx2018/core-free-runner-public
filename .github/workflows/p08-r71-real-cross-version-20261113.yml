name: P08 R71 real flat 0.1.0 to Bridge signed synthetic Owner Atomic 0.1.1 isolated E2E
on:
  push:
    branches: [test/p08-r71-real-flat-bridge-owner-20261113]

permissions:
  contents: read

jobs:
  real-installed-sqlite-0-1-0-to-0-1-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_R71_REAL_ZIP_TEST: YES
    steps:
      - name: Check independent machine/test-site scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r71-real-flat-bridge-owner-20261113
          echo 'P08_R71_PUBLIC_SAFE_SYNTHETIC_FIXTURE=YES'
          echo 'P08_R71_PRODUCTION_AND_FORMAL_RELEASE=NO'
      - name: Read the EXACT P08 PR22 private commit and both predecessor source commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 03b291fdf65609d5ea4ec90e878549a39578876d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Native PHP 8.4 Composer/SQLite/ZIP/sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source identities and test script syntax
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 03b291fdf65609d5ea4ec90e878549a39578876d
          test "$(cat VERSION)" = 0.1.1
          git cat-file -e ed71631fea3eb22bf73661e290b6d5e67e81aa2b^{commit}
          git cat-file -e 55ecbc8461a4d90fe7241a00caffa55e557cde1c^{commit}
          php -l tests/compatibility/p08_r71_real_flat_bridge_atomic.php
          echo 'P08_R71_EXACT_P08_SOURCE_AND_OLD_BRIDGE_HISTORY=PASS'
      - name: Actual two FULL + Atomic from locked Composer/Vite Git sources
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py \
            --repo "$PWD" \
            --target-sha 03b291fdf65609d5ea4ec90e878549a39578876d \
            --output-dir "$RUNNER_TEMP/p08-r71-real-artifacts"
          python3 scripts/verify_owner_atomic_pair.py \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            ed71631fea3eb22bf73661e290b6d5e67e81aa2b 03b291fdf65609d5ea4ec90e878549a39578876d
          echo 'P08_R71_REAL_BRIDGE_TARGET_UPDATE_PACKAGE_PAIR=PASS'
      - name: Independently build true historical flat 0.1.0 Owner FULL
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          mkdir "$RUNNER_TEMP/p08-r71-flat-src"
          git archive --format=tar 55ecbc8461a4d90fe7241a00caffa55e557cde1c | \
            tar -xf - -C "$RUNNER_TEMP/p08-r71-flat-src"
          test "$(cat "$RUNNER_TEMP/p08-r71-flat-src/VERSION")" = 0.1.0
          cd "$RUNNER_TEMP/p08-r71-flat-src"
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --classmap-authoritative >/dev/null
          npm ci --no-audit --no-fund >/dev/null
          npm run build >/dev/null
          cd "$GITHUB_WORKSPACE/source"
          # Use the immutable legacy 0.1.0 builder, not the newer 0.1.1
          # builder whose added runtime cache member did not yet exist in 0.1.0.
          # This is a true old-source FULL, not a fabricated metadata patch.
          python3 "$RUNNER_TEMP/p08-r71-flat-src/scripts/build_full.py" \
            --source "$RUNNER_TEMP/p08-r71-flat-src" \
            --output "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            --version 0.1.0 \
            --source-sha 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          echo 'P08_R71_GENUINE_PRE_BRIDGE_FLAT_0_1_0_FULL=PASS'
      - name: Install actual old and Bridge FULL bytes in two disposable root instances
        shell: bash
        run: |
          set -Eeuo pipefail
          for x in p08-r71-site-success p08-r71-site-fault p08-r71-bridge; do
            mkdir "$RUNNER_TEMP/$x"
          done
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-success"
          unzip -q "$RUNNER_TEMP/p08-r71-old-flat-full.zip" -d "$RUNNER_TEMP/p08-r71-site-fault"
          unzip -q "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.0_BRIDGE_FULL.zip" -d "$RUNNER_TEMP/p08-r71-bridge"
          echo 'P08_R71_OLD_SITE_AND_BRIDGE_REAL_FULL_EXTRACTED=PASS'
      - name: Real old Owner install offline Bridge signed synthetic offer and separate native CLI worker
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            55ecbc8461a4d90fe7241a00caffa55e557cde1c \
            ed71631fea3eb22bf73661e290b6d5e67e81aa2b \
            03b291fdf65609d5ea4ec90e878549a39578876d success | tee "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R71_ACTUAL_FLAT_TO_COMPATIBLE_BRIDGE_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R71_REAL_ATOMIC_STAGED_SIGNED_EPHEMERAL_TEST_KEY_NO_SWITCH=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R71_REAL_OWNER_SUBMIT_INDEPENDENT_CLI_WORKER_TO_0_1_1=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          grep -Fxq 'P08_R71_NATIVE_SQLITE_OWNER_LANDING_ENV_AND_PRIVATE_HTML_PRESERVED=PASS' "$RUNNER_TEMP/p08-r71-success-output.txt"
          echo 'P08_R71_TRUE_SIGNED_TEST_KEY_OWNER_WORKER=PASS'
      - name: Actual HTTP request to upgraded stable Laravel 0.1.1 gateway, setup must stay locked
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:18871 \
            -t "$RUNNER_TEMP/p08-r71-site-success/public" \
            "$RUNNER_TEMP/p08-r71-site-success/public/index.php" \
            > "$RUNNER_TEMP/p08-r71-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          status="$(curl -sS -o "$RUNNER_TEMP/p08-r71-health-body" -w '%{http_code}' http://127.0.0.1:18871/up)"
          test "$status" = 200 || { echo "P08_R71_HTTP_HEALTH_BLOCKED=$status"; exit 8; }
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18871/setup.php)"
          test "$status" = 503 || { echo "P08_R71_SETUP_LOCK_BLOCKED=$status"; exit 8; }
          echo 'P08_R71_REAL_STABLE_HTTP_0_1_1_HEALTH_AND_SETUP_LOCK=PASS'
      - name: Separate actual old Owner instance with fault-after-swap and no data loss
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/compatibility/p08_r71_real_flat_bridge_atomic.php \
            "$RUNNER_TEMP/p08-r71-site-fault" \
            "$RUNNER_TEMP/p08-r71-bridge" \
            "$RUNNER_TEMP/p08-r71-real-artifacts/VF_AdOps_V0.1.1_UPDATE.zip" \
            55ecbc8461a4d90fe7241a00caffa55e557cde1c \
            ed71631fea3eb22bf73661e290b6d5e67e81aa2b \
            03b291fdf65609d5ea4ec90e878549a39578876d fault-after-swap | tee "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_ACTUAL_FLAT_TO_COMPATIBLE_BRIDGE_AND_PRIVATE_DATA=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_REAL_ATOMIC_STAGED_SIGNED_EPHEMERAL_TEST_KEY_NO_SWITCH=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_REAL_TARGET_POINTER_FAULT_AND_AUTOMATIC_CODE_ROLLBACK=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          grep -Fxq 'P08_R71_NATIVE_SQLITE_OWNER_LANDING_ENV_AND_PRIVATE_HTML_PRESERVED=PASS' "$RUNNER_TEMP/p08-r71-fault-output.txt"
          echo 'P08_R71_ACTUAL_NATIVE_SQLITE_BACKUP_FRESH_AND_FAULT_ROLLBACK=PASS'
      - name: Remove all unshipped private code, credentials and transient ZIPs
        if: always()
        shell: bash
        run: |
          rm -rf source \
            "$RUNNER_TEMP/p08-r71-flat-src" \
            "$RUNNER_TEMP/p08-r71-real-artifacts" \
            "$RUNNER_TEMP/p08-r71-site-success" \
            "$RUNNER_TEMP/p08-r71-site-fault" \
            "$RUNNER_TEMP/p08-r71-bridge"
          rm -f "$RUNNER_TEMP/p08-r71-old-flat-full.zip" \
            "$RUNNER_TEMP/r71-offer-success.json" "$RUNNER_TEMP/r71-sig-success.txt" \
            "$RUNNER_TEMP/r71-offer-fault-after-swap.json" "$RUNNER_TEMP/r71-sig-fault-after-swap.txt" \
            "$RUNNER_TEMP/p08-r71-http.log" "$RUNNER_TEMP/p08-r71-health-body" \
            "$RUNNER_TEMP/p08-r71-success-output.txt" "$RUNNER_TEMP/p08-r71-fault-output.txt"
          echo 'P08_R71_PUBLIC_PRIVATE_SOURCE_AND_SITE_DATA_PERSISTED=NO'
