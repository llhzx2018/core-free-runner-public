name: P01 V2.47.250 Wide Desktop Layout Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247250-wide-desktop-layout.yml"
      - "proof-triggers/p01-v247250-wide-desktop-layout.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 3879c3b335ad68b0e448a2353f9baee401e1eef0
          git -C candidate checkout -q --detach 3879c3b335ad68b0e448a2353f9baee401e1eef0
          test "$(git -C candidate rev-parse HEAD)" = "3879c3b335ad68b0e448a2353f9baee401e1eef0"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.250"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.250"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 8b2ec7e02b2c53c5c74460997739681802374c44
          git -C baseline checkout -q --detach 8b2ec7e02b2c53c5c74460997739681802374c44
          echo P01_V247250_EXACT_SOURCE=PASS

      - name: Wide Desktop focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/frontend_wide_desktop_layout_contract.php
          php candidate/tests/unit/frontend_global_shell_r1_contract.php
          php candidate/tests/unit/subject_domain_nav_shell_contract.php
          php candidate/tests/unit/frontend_home_portal_contract.php
          php candidate/tests/unit/navigation_production_r7_contract.php
          php candidate/tests/unit/course_markdown_reader_contract.php
          grep -Fq '@media (min-width:1440px)' candidate/src/assets/desktop-wide-layout.css
          grep -Fq -- '--vf-wide-shell:min(1440px,calc(100vw - 40px))' candidate/src/assets/desktop-wide-layout.css
          grep -Fq 'left:var(--vf-wide-edge)!important' candidate/src/assets/desktop-wide-layout.css
          grep -Fq 'max-width:1320px' candidate/src/assets/desktop-wide-layout.css
          echo P01_V247250_WIDE_DESKTOP=PASS
          echo P01_V247250_EXISTING_SHELLS_PRESERVED=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/FunctionalHome.php
          php -l candidate/src/app/FunctionalWorkspace.php
          php -l candidate/src/app/SubjectPageChrome.php
          php -l candidate/src/app/bootstrap.php
          echo P01_V247250_SYNTAX=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247250_CANONICAL=PASS

      - name: Prove no release or production mutation
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
