name: P01 V2.29 Version Identity Fix

on:
  push:
    branches:
      - task/p01-v229-version-identity-fix-20260829

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact P01 candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-functional-contract-rebaseline-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch only VF_VERSION identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "e83fea4966327c786c82db7cd33ceefd2d07d6f8"
          test "$(tr -d '\r\n' < VERSION)" = "2.29.0"
          test "$(grep -Fc "define('VF_VERSION', '2.28.0');" src/app/bootstrap.php)" = "1"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.28.0');"
          new="define('VF_VERSION', '2.29.0');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l src/app/bootstrap.php >/dev/null
          test "$(grep -Fc "define('VF_VERSION', '2.29.0');" src/app/bootstrap.php)" = "1"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "src/app/bootstrap.php"
          git diff --check
          echo 'P01_V229_VERSION_IDENTITY_PATCH=PASS'

      - name: Commit and push exact one-file patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/bootstrap.php
          git diff --cached --name-only | grep -Fx 'src/app/bootstrap.php'
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "1"
          git commit -m 'P01: align runtime VF_VERSION with V2.29 candidate'
          git push origin HEAD:feature/p01-functional-contract-rebaseline-20260829
          echo "P01_V229_PATCH_COMMIT=$(git rev-parse HEAD)"
