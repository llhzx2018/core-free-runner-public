name: TEMP S01-C02 Ops 1.21.847 Link Pipeline Source Trace
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-link-pipeline-source-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace internal-link audit and repair call chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          echo '=== AUDIT CALL SITES ==='
          rg -n -C 5 'vf_toolsite_cf_release_final_audit_add_link_issue|目标不存在|entry_exists|internal.*link|internal.*url' ops/includes/release ops/includes/site-release | head -500 || true
          echo '=== ROUTE REPAIR CALL SITES ==='
          rg -n -C 5 'repair_html\(|inventory_from_source\(|unique_safe_relocation|missing_archive_link_unlinked|internal_route_rewritten' ops/includes | head -400 || true
          echo '=== URL EXTRACTORS ==='
          rg -n -C 5 'preg_match_all.*href|hrefs|srcs|internal.*path|normalize.*url' ops/includes/release | head -500 || true
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_LINK_PIPELINE_SOURCE_TRACE
