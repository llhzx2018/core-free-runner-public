name: S01-C02 Ops 1.21.856 Dashboard Selector Hit Gate
on:
  push:
    branches:
      - temp/s01-c02-dashboard-selector-hit-gate-121856-20260907
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential boundary
        run: |
          test -n "$READ_TOKEN"
          test -z "${VF_RELEASE_WRITE_TOKEN:-}"
          echo 'READ_ONLY_CREDENTIAL=YES'
          echo 'RELEASE_WRITE_USED=NO'
      - name: Checkout exact Ops candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ux/s01-c02-dashboard-selector-hit-121856-20260907
          token: ${{ env.READ_TOKEN }}
          path: ops
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Ops candidate
        run: |
          cd ops
          test "$(git rev-parse HEAD)" = "c7fcac34cead4cf9aedd00b26f1527d03542e2cc"
      - name: Exact eight-file UX fence
        run: |
          cd ops
          git diff --name-only 371b64c66c6daca48c86af5bdf11a8022b444868..HEAD | sort > /tmp/changed
          cat >/tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-console-v2.css
          includes/admin-v13/views/dashboard.php
          tests/admin-human-language-contract.php
          tests/dashboard-selector-hit-contract.php
          tests/update-refresh-policy-current-contract.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          ! grep -E '(^|/)(schema|migration|wp-update|site-release)/' /tmp/changed
      - name: Full PHP syntax gate
        run: |
          cd ops
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
      - name: Dashboard selector hit contract
        run: |
          cd ops
          php tests/dashboard-selector-hit-contract.php
      - name: Human language regression
        run: |
          cd ops
          php tests/admin-human-language-contract.php
      - name: Update policy regression
        run: |
          cd ops
          php tests/update-refresh-policy-current-contract.php
      - name: Visible Console V2 regression
        run: |
          cd ops
          php tests/visible-console-v2-contract.php
      - name: Real DOM visual-owner boundary
        run: |
          cd ops
          grep -q 'vf-v658-hero' includes/admin-v13/views/dashboard.php
          grep -q 'vf-v658-hero' assets/css/current/admin-s01-console-v2.css
          grep -q 'vf-v658-focus' assets/css/current/admin-s01-console-v2.css
          grep -q 'vf-v658-status-strip' assets/css/current/admin-s01-console-v2.css
          grep -q 'vf-v658-queue-row' assets/css/current/admin-s01-console-v2.css
          ! git diff --name-only 371b64c66c6daca48c86af5bdf11a8022b444868..HEAD | grep -E '^includes/(wp-update|site-release)/'
      - name: Post checkout exact Ops candidate
        run: |
          cd ops
          test "$(git rev-parse HEAD)" = "c7fcac34cead4cf9aedd00b26f1527d03542e2cc"
