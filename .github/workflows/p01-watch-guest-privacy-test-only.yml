name: P01 Watch guest privacy exact-source test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-watch-guest-privacy-test-only.yml']
permissions:
  contents: read
jobs:
  watch-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: dd633b83ea07cea8c59703bf69383078c6588708
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip,openssl,gd
          coverage: none
      - name: Exact-source public Watch privacy and UX regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "dd633b83ea07cea8c59703bf69383078c6588708"
          php -l product/src/app/WatchMediaLibraryPage.php
          php -l product/tests/unit/watch_public_privacy_density_v247390_contract.php
          for f in \
            watch_public_privacy_density_v247390_contract.php \
            watch_page_filter_hierarchy_contract.php \
            watch_page_full_polish_contract.php \
            watch_card_action_hierarchy_contract.php \
            watch_facet_context_contract.php \
            watch_cross_filter_count_contract.php \
            watch_kind_facet_context_contract.php \
            watch_page_context_count_contract.php \
            watch_status_context_badge_contract.php \
            watch_year_genre_zero_result_contract.php \
            watch_mobile_density_r6_contract.php \
            watch_v247148_default_random_contract.php \
            watch_v247149_broken_poster_fallback_contract.php \
            watch_v247159_action_menu_open_state_contract.php \
            watch_add_status_context_contract.php \
            channel_watch_search_context_contract.php; do
            php "product/tests/unit/$f"
          done
          echo P01_WATCH_GUEST_PRIVACY_EXACT_SOURCE=PASS
      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf product
