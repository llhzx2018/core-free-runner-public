name: P01 V2.36.2 Bind Candidate PASS
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-bind-candidate-pass-20260901.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P01 formal-source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.2-formal-source-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Bind exact Candidate Readiness PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '67b00fd8cdb20c18cd6dedf3b412aa007854fabe'
          test "$(git rev-parse HEAD:src)" = '55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('candidate_version')!='2.36.2': raise SystemExit('candidate version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          if d.get('production_version')!='2.36.0': raise SystemExit('owner production drift')
          rc=d.get('v2_36_2_release_candidate') or {}
          if rc.get('base_develop')!='0fd80ff3996e31abec24e85199f171769460fa3d': raise SystemExit('release base drift')
          if rc.get('product_pr')!=170 or rc.get('authority_pr')!=171: raise SystemExit('product/authority PR drift')
          d['current_phase']='V2.36.2 CANDIDATE READINESS PASS / FORMAL BIND GATE PENDING'
          d['candidate_state']='CANDIDATE READINESS PASS / FORMAL BIND GATE PENDING'
          d['develop_state']='V2.36.2 FORMAL PATCH SOURCE CANDIDATE PASS / NOT YET STAGED TO DEVELOP'
          d['formal_release_state']='V2.36.1 PUBLISHED / V2.36.2 CANDIDATE PASS / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.1 / V2.36.2 Candidate Readiness PASS / Formal Bind pending'
          d['next_action']='Run independent V2.36.2 Formal Bind Gate, then create develop-only formal-source PR if PASS. Do not write main, Tag, GitHub Release, core-updates or Owner Production.'
          d['v2_36_2_candidate_gate']={
            'state':'PASS',
            'candidate':'67b00fd8cdb20c18cd6dedf3b412aa007854fabe',
            'candidate_tree':'5c72bb983a8e420898820a958fbc10f8ceca80c1',
            'runtime_tree':'55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424',
            'predecessor':'23321270d79fc98d529c2c5a0ef07e0f1012835a',
            'predecessor_version':'2.36.1',
            'schema':'2026082901',
            'schema_change':False,
            'migration':None,
            'runtime_delta_count':6,
            'runtime_changed':['VERSION.txt','app/FunctionalWorkspaceShell.php','app/bootstrap.php','assets/workspace-rebaseline.css','index.php'],
            'runtime_added':['assets/auth-controls.js'],
            'runtime_removed':[],
            'candidate_readiness_run':33478737169,
            'artifact':9789120412,
            'artifact_sha256':'42c39e68648784c56cbd443258f40346966573d0da4baa0fcb6217719bf2dde3',
            'full_zip_sha256':'2ac81cb8fba0815e006170a897017ea14ca8a6c77e41dfcfe0332f64c4604870',
            'update_zip_sha256':'8ab1a12d23ad50276e26ae773bcf97feac0bb97198ab65b3e68c93889362e121',
            'repair_php_sha256':'af5bd5f9c9585f418067f31fa9b0da94202adc359a3d05cfbe7deb95afe34a2d',
            'candidate_json_sha256':'7354030bf6b8a40474ce37ff97e58d468ee0725be6482248168ab16b3fdf67d8',
            'deterministic_artifacts':'PASS',
            'atomic_upgrade':'V2.36.1 -> V2.36.2 PASS',
            'data_preservation':'PASS',
            'fresh_install':'PASS',
            'fresh_data_zero':'PASS',
            'visible_auth_entry':'390 + 1440 / REAL LOGIN + LOGOUT / PASS',
            'anonymous_private_leak':'NONE',
            'sqlite_integrity':'PASS',
            'foreign_key_check':'0',
            'product_gate_run':33477309212,
            'product_gate_artifact':9788634718,
            'product_gate_artifact_sha256':'a6f2c0188601de958a533b1f63d941c83873277880dc5ff932d934a6045966ec',
            'harness_r1_non_product_failure':33478627748,
            'harness_r1_classification':'HARNESS-ONLY / incorrect added-file assertion',
            'release_published':False,
            'main_write':False,
            'core_updates_write':False,
            'owner_production_write':False
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = 'VF_PROJECT.json '
          test "$(git rev-parse HEAD:src)" = '55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.36.2 candidate PASS'
          echo "BOUND_SOURCE=$(git rev-parse HEAD)"
          echo "BOUND_TREE=$(git rev-parse HEAD^{tree})"
          echo "BOUND_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.2-formal-source-20260901
