name: P02 V2.5.82 Distribution Discovery Readback

on:
  push:
    branches:
      - run/p02-v2582-discovery-readback-20260922
    paths:
      - '.github/workflows/p02-v2582-discovery-readback.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P02 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0411c3fbf36a896f0aaaa693e7f077ac9acfb143
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Install PHP cURL
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl

      - name: Runtime discovery and release identity readback
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php -d display_errors=1 <<'PHP'
          <?php
          require 'product/src/app/CoreUpdates/GitHubClient.php';
          require 'product/src/app/CoreUpdates/UpdateCore.php';

          $publicClient=new \CoreUpdates\GitHubClient('');
          $manifest=$publicClient->fetchProjectManifest('llhzx2018/core-free-runner-public','P02.json','main');

          $token=(string)getenv('VF_PRIVATE_READ_TOKEN');
          if($token==='')throw new RuntimeException('VF_PRIVATE_READ_TOKEN missing');
          $privateClient=new \CoreUpdates\GitHubClient($token);
          $canonical=$privateClient->fetchProjectManifest('llhzx2018/core-updates','P02.json','main');

          if($manifest!==$canonical)throw new RuntimeException('public mirror differs from canonical core-updates');
          if(($manifest['target_version']??'')!=='2.5.82')throw new RuntimeException('target version mismatch');
          if(($manifest['product_identity']??'')!=='0411c3fbf36a896f0aaaa693e7f077ac9acfb143')throw new RuntimeException('product identity mismatch');
          if((int)($manifest['release_id']??0)!==393476342)throw new RuntimeException('release id mismatch');

          $core=new \CoreUpdates\UpdateCore('P02','APP');
          $expected=[
            ['2.5.80','AVAILABLE'],
            ['2.5.81','AVAILABLE'],
            ['2.5.82','UP_TO_DATE'],
          ];
          foreach($expected as [$version,$status]){
            $result=$core->check($version,'2401',$manifest);
            if(($result['status']??'')!==$status)throw new RuntimeException($version.' discovery expected '.$status.' got '.($result['status']??'UNKNOWN'));
            echo 'DISCOVERY_'.$version.'='.$status,PHP_EOL;
          }

          $release=$privateClient->fetchReleaseMetadata((string)$manifest['repository'],(string)$manifest['release_tag']);
          if((int)($release['id']??0)!==393476342)throw new RuntimeException('release readback id mismatch');
          if(($release['target_commitish']??'')!=='0411c3fbf36a896f0aaaa693e7f077ac9acfb143')throw new RuntimeException('release target mismatch');
          $asset=null;
          foreach((array)$release['assets'] as $candidate){
            if(is_array($candidate)&&($candidate['name']??'')===$manifest['asset_name']){$asset=$candidate;break;}
          }
          if(!is_array($asset))throw new RuntimeException('UPDATE asset missing');
          if((int)($asset['size']??0)!==(int)$manifest['asset_bytes'])throw new RuntimeException('UPDATE asset bytes mismatch');
          if(($asset['digest']??'')!=='sha256:'.$manifest['asset_sha256'])throw new RuntimeException('UPDATE asset digest mismatch');

          echo "P02_V2582_PUBLIC_MIRROR_EQUAL_CANONICAL=PASS\n";
          echo "P02_V2582_RELEASE_ASSET_IDENTITY=PASS\n";
          echo "P02_V2582_DISTRIBUTION_DISCOVERY=PASS\n";
          PHP
