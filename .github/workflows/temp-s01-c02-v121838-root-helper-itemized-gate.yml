name: TEMP S01-C02 Ops 1.21.840 Final Audit Other Classifier Gate
on:
  push:
    branches:
      - temp/s01-c02-v121838-root-helper-itemized-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121838-root-helper-itemized-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_COMMIT: ff318550ca92a61d34ddef549af2054faa911db7
      PRODUCT_TREE: 6a09c4ab809058bedf00d1b50778e2c7e3e400fe
      PRODUCT_BASE: 6d35cf298edd8b4d0acad02cf47e5222fc66586d
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact four-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.840
          php -l ops/includes/site-release/s01-static-final-audit-other-classifier-v121840.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121840-final-audit-other-classifier.php >/dev/null
          php ops/.github/phase3/v121840-final-audit-other-classifier.php | grep -Fxq PASS_V121840_FINAL_AUDIT_OTHER_CLASSIFIER
          mapfile -t files < <(git -C ops diff --name-only "$PRODUCT_BASE" "$PRODUCT_COMMIT" | sort)
          expected=(
            .github/phase3/v121840-final-audit-other-classifier.php
            VERSION
            includes/site-release/s01-static-final-audit-other-classifier-v121840.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
      - name: Verify classifier is privacy-safe and read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/includes/site-release/s01-static-final-audit-other-classifier-v121840.php
          grep -Fq 'vf_ops_s01_static_failure_subtype_key_v121824($failure)' "$f"
          grep -Fq 'sourceRecoveryFinalAuditOtherPrimaryClass' "$f"
          grep -Fq 'sourceRecoveryFinalAuditOtherClassCounts' "$f"
          grep -Fq 'candidate_processing_unclassified' "$f"
          grep -Fq 'candidate_package_contract' "$f"
          ! grep -Eq 'wp_insert_post|wp_update_post|wp_delete_post|update_option|add_option|delete_option|TRUNCATE|DROP TABLE|DELETE FROM' "$f"
          ! grep -Eq 'prepare_candidate|create_candidate|run_next_stage|Async_Job::save|Async_Job::sync_record' "$f"
          ! grep -Eq 'candidatePackageReady.*true|finalOnlinePass.*PASS' "$f"
          ! grep -Eq 'source_path|candidate_path|candidateJobId|oldCandidateJobId|expectedSha' "$f"
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_BASE"
      - name: Verify Production 1.21.839 single Final Audit other truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.839" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.839" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobNonAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobFailureSegmentCounts.candidate_processing==1 and .activeStaticJobFailureSubtypeLeafCount==1 and .activeStaticJobFailureSubtypeKnownCount==0 and .activeStaticJobFailureSubtypeOtherCount==1 and .activeStaticJobFailureSubtypeCounts.other==1 and .activeStaticJobInternalLinkFailureLeafCount==0 and .activeStaticJobInternalLinkUniqueTargetCount==0' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121840_FINAL_AUDIT_OTHER_CLASSIFIER_GATE
