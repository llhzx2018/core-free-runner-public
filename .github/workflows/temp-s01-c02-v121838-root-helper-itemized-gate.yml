name: TEMP S01-C02 Ops 1.21.839 Candidate Worker Durable Kick Gate
on:
  push:
    branches:
      - temp/s01-c02-v121838-root-helper-itemized-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121838-root-helper-itemized-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_COMMIT: 6d35cf298edd8b4d0acad02cf47e5222fc66586d
      PRODUCT_TREE: 1ac2d16124ae510b5df147e054a87e81a69ed20e
      PRODUCT_BASE: 01b69d35a5186a091690ffa6c4b272f8fbfd1436
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact four-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.839
          php -l ops/includes/site-release/s01-static-candidate-worker-durable-kick-v121839.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121839-candidate-worker-durable-kick.php >/dev/null
          php ops/.github/phase3/v121839-candidate-worker-durable-kick.php | grep -Fxq PASS_V121839_CANDIDATE_WORKER_DURABLE_KICK
          mapfile -t files < <(git -C ops diff --name-only "$PRODUCT_BASE" "$PRODUCT_COMMIT" | sort)
          expected=(
            .github/phase3/v121839-candidate-worker-durable-kick.php
            VERSION
            includes/site-release/s01-static-candidate-worker-durable-kick-v121839.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
      - name: Verify durable kick adopts existing Candidate and remains fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/includes/site-release/s01-static-candidate-worker-durable-kick-v121839.php
          grep -Fq 'DURABLE_KICK_CANDIDATE_ADOPTED' "$f"
          grep -Fq 'vf_ops_s01_static_root_item_state_v121838' "$f"
          grep -Fq 'VF_Ops_Release_Async_Job::run_next_stage' "$f"
          grep -Fq 'VF_Ops_Release_Async_Job::load($candidateId)' "$f"
          grep -Fq "add_action('init','vf_ops_s01_static_durable_kick_pulse_v121839',99)" "$f"
          grep -Fq 'wp_schedule_single_event' "$f"
          grep -Fq 'DURABLE_KICK_CANDIDATE_TERMINAL' "$f"
          ! grep -Fq 'vf_ops_publish_release_prepare_candidate_v121771(' "$f"
          ! grep -Fq 'create_candidate_from_inspection_v121761(' "$f"
          ! grep -Eq 'wp_insert_post|wp_update_post|TRUNCATE|DROP TABLE' "$f"
          ! grep -Eq "candidatePackageReady.*true|finalOnlinePass.*PASS" "$f"
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_BASE"
      - name: Verify Production 1.21.838 stalled Candidate truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.838" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.838" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .sourceRecoveryRootItemStatus=="running" and .sourceRecoveryRootItemCode=="root_item_fresh_candidate_created" and .sourceRecoveryRootItemCandidateStatus=="running" and .sourceRecoveryRootItemCandidateCurrentStage==0 and .sourceRecoveryRootItemCandidateAuditFailureCount==0 and .sourceRecoveryRootItemCandidateBuildOffset==0 and .sourceRecoveryRootItemCandidateBuildTotal==0 and .sourceRecoveryRootItemCandidateHelperPhase=="" and .sourceRecoveryRootItemCandidateHelpersWritten==false' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121839_CANDIDATE_WORKER_DURABLE_KICK_GATE
