name: TEMP S01-C02 Ops 1.21.838 Root Helper Itemized Gate
on:
  push:
    branches:
      - temp/s01-c02-v121838-root-helper-itemized-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121838-root-helper-itemized-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_COMMIT: 01b69d35a5186a091690ffa6c4b272f8fbfd1436
      PRODUCT_TREE: 6b08c0147fd1b8d3375740daa63a1a2ec66d5ed3
      PRODUCT_BASE: d7c9a4bf8dd7e252f6f7897d9865d29be7da14d8
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact seven-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.838
          php -l ops/includes/release/builders/class-candidate-helper-writer.php >/dev/null
          php -l ops/includes/release/builders/class-candidate-batch-builder.php >/dev/null
          php -l ops/includes/site-release/s01-static-candidate-build-failure-readback-v121830.php >/dev/null
          php -l ops/includes/site-release/s01-static-root-helper-itemized-retry-v121838.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php ops/.github/phase3/v121838-root-helper-itemized-closure.php | grep -Fxq PASS_V121838_ROOT_HELPER_ITEMIZED_CLOSURE
          mapfile -t files < <(git -C ops diff --name-only "$PRODUCT_BASE" "$PRODUCT_COMMIT" | sort)
          expected=(
            .github/phase3/v121838-root-helper-itemized-closure.php
            VERSION
            includes/release/builders/class-candidate-batch-builder.php
            includes/release/builders/class-candidate-helper-writer.php
            includes/site-release/s01-static-candidate-build-failure-readback-v121830.php
            includes/site-release/s01-static-root-helper-itemized-retry-v121838.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
      - name: Verify itemized root helper closure remains fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'prepare_root_helpers' ops/includes/release/builders/class-candidate-helper-writer.php
          grep -Fq 'write_prepared_root_item' ops/includes/release/builders/class-candidate-helper-writer.php
          grep -Fq "foreach (['sitemaps','social'] as \$segment)" ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq "helper_root_prepare" ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq "helper_root_' . \$rootItem . '_open" ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq "helper_root_' . \$rootItem . '_write" ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq "helper_root_' . \$rootItem . '_close" ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq 'ROOT_ITEM_FRESH_CANDIDATE_CREATED' ops/includes/site-release/s01-static-root-helper-itemized-retry-v121838.php
          grep -Fq 'hash_file' ops/includes/site-release/s01-static-root-helper-itemized-retry-v121838.php
          ! grep -Eq 'wp_insert_post|wp_update_post|TRUNCATE|DROP TABLE' ops/includes/site-release/s01-static-root-helper-itemized-retry-v121838.php
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_BASE"
      - name: Verify Production 1.21.837 root-helper boundary truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.837" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.837" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .sourceRecoveryHelperSegmentStatus=="fail" and .sourceRecoveryHelperSegmentCandidateStatus=="fail" and .sourceRecoveryHelperSegmentCandidateCurrentStage==4 and .sourceRecoveryHelperSegmentCandidateAuditFailureCount==0 and .sourceRecoveryHelperSegmentCandidateFailureClass=="candidate_helper_root_write_failed" and .sourceRecoveryHelperSegmentCandidateBuildOffset==231 and .sourceRecoveryHelperSegmentCandidateBuildTotal==231 and .sourceRecoveryHelperSegmentCandidateHelperPhase=="helper_root_write" and .sourceRecoveryHelperSegmentCandidateHelpersWritten==false and .sourceRecoveryHelperSegmentCandidateCompletenessStatus=="pass"' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121838_ROOT_HELPER_ITEMIZED_GATE
