name: TEMP S01-C02 Ops 1.21.833 Exact Process Probe Gate
on:
  push:
    branches:
      - temp/s01-c02-v121833-exact-process-probe-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121833-exact-process-probe-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      BASE: 02fb592cc6aacfcf8c0a39c9a648a08977820b44
      COMMIT: b87c30f039c495122a59888b9c01d3b4431643d6
      TREE: efc2a1558b288b9e4851e8c9779f83fed3443e8e
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax and exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.833'
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/site-release/s01-static-candidate-exact-process-probe-v121833.php >/dev/null
          php ops/.github/phase3/v121833-exact-process-probe.php | grep -Fxq PASS_V121833_EXACT_PROCESS_PROBE
          mapfile -t changed < <(git -C ops diff --name-only "$BASE" "$COMMIT" | sort)
          expected=(
            .github/phase3/v121833-exact-process-probe.php
            VERSION
            includes/site-release/s01-static-candidate-exact-process-probe-v121833.php
            vf-ops.php
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 4
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          ! grep -Eq 'update_option\(|wp_schedule_|addFromString\(|file_put_contents\(|rename\(|unlink\(' ops/includes/site-release/s01-static-candidate-exact-process-probe-v121833.php
      - name: Verify Product authority before promotion
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$J")" = "$BASE"
          done
      - name: Verify Production remains 1.21.832 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          test "$(jq -r .pluginVersion <<<"$J")" = '1.21.832'
          test "$(jq -r .activeStaticJobStatus <<<"$J")" = 'FAIL'
          test "$(jq -r .activeStaticJobMode <<<"$J")" = 'candidate'
          test "$(jq -r .activeStaticJobFirstFailedStep <<<"$J")" = 'candidate_build'
          test "$(jq -r .sourceRecoveryCandidateCurrentStage <<<"$J")" = '4'
          test "$(jq -r .sourceRecoveryCandidateBuildOffset <<<"$J")" = '225'
          test "$(jq -r .sourceRecoveryCandidateBuildTotal <<<"$J")" = '231'
          test "$(jq -r .sourceRecoveryCandidateTailProbeStatus <<<"$J")" = 'pass'
          test "$(jq -r .sourceRecoveryCandidateTailProbeCheckedCount <<<"$J")" = '6'
          test "$(jq -r .sourceRecoveryCandidateTailProbeRuntimeStatus <<<"$J")" = 'ready'
          test "$(jq -r .candidatePackageReady <<<"$J")" = 'false'
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = 'false'
          test "$(jq -r .finalOnlinePass <<<"$J")" = 'NO'
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = "$RUNNER_MAIN"
      - name: Seal result
        shell: bash
        run: echo PASS_V121833_EXACT_PROCESS_PROBE_GATE
