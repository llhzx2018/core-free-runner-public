name: R71 Tool Scene Facet Context

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r71-tool-scene-facet-context.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 6805d7b8d5130d03fcd2f5a7fbba3bceb7d83010
    steps:
      - name: Checkout exact VF Start candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 6805d7b8d5130d03fcd2f5a7fbba3bceb7d83010
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact candidate and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.0"
          php -l src/app/ToolSceneDetail.php
          php -l tests/unit/tool_scene_facet_context_contract.php
          php tests/unit/tool_scene_facet_context_contract.php
          php tests/unit/default_sort_result_route_contract.php
          php tests/unit/derived_sort_route_continuity_contract.php
          php tests/unit/smart_view_sort_reset_contract.php
          echo R71_TOOL_SCENE_FACET_CONTEXT_PASS
          echo R71_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
