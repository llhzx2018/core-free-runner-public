name: R71 Focused Tool Scene Facet Context Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  r71-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P01 candidate transiently
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/p01-r71
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" /tmp/p01-r71
          cd /tmp/p01-r71
          git checkout --detach 6805d7b8d5130d03fcd2f5a7fbba3bceb7d83010
          test "$(git rev-parse HEAD)" = "6805d7b8d5130d03fcd2f5a7fbba3bceb7d83010"
          test "$(tr -d '[:space:]' < VERSION)" = "2.47.0"
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Exact source and focused contracts
        run: |
          set -euo pipefail
          cd /tmp/p01-r71
          php -l src/app/ToolSceneDetail.php
          php tests/unit/tool_scene_facet_context_contract.php
          php tests/unit/default_sort_result_route_contract.php
          php tests/unit/smart_view_sort_reset_contract.php
          echo "R71_EXACT_CANDIDATE_GATE_PASS"
      - name: Cleanup transient private source
        if: always()
        run: rm -rf /tmp/p01-r71
