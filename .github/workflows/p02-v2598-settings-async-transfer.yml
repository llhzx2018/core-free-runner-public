name: P02 V2.5.98 Settings Async Transfer

on:
  push:
    branches:
      - run/p02-v2598-settings-async-transfer-20260923
    paths:
      - '.github/workflows/p02-v2598-settings-async-transfer.yml'

permissions:
  contents: read

jobs:
  settings-async-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: dd34cc12a100f3168a42175f0e7f0abb63b289d9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source source and unit gate
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "dd34cc12a100f3168a42175f0e7f0abb63b289d9"
          test "$(cat VERSION)" = "2.5.98"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node tests/unit/p02_v2598_settings_async_transfer_ownership.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2598_SETTINGS_ASYNC_TRANSFER_SOURCE=PASS
      - name: Maintenance baseline
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2598-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2598-settings-async-transfer
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V2598_SETTINGS_ASYNC_TRANSFER_MAINTENANCE=PASS
      - name: Focused Chromium settings async transfer
        working-directory: product
        env:
          VF_UX_FOCUSED_SETTINGS_ASYNC_TRANSFER: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2598-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
          echo P02_V2598_SETTINGS_ASYNC_TRANSFER_BROWSER_GATE=PASS
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2598-settings-async-transfer
          path: ${{ runner.temp }}/p02-v2598-settings-async-transfer
          if-no-files-found: ignore
          retention-days: 7
