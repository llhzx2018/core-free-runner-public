name: P02 V2.5.111 Discovery Verify

on:
  push:
    branches:
      - run/p02-v25111-settings-batch-release-20260924
    paths:
      - '.github/workflows/p02-v25111-discovery-verify.yml'
      - 'requests/p02-v25111-discovery-verify.sh'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact merged P02 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: a4d55bd24824e7ca61e2fb79cd0d0e20e708279c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Install PHP runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli curl

      - name: Verify public stable discovery
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25111-discovery-verify.sh
