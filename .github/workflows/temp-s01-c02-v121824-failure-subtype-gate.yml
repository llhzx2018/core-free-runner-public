name: TEMP S01-C02 Ops 1.21.824 Failure Subtype Gate
on:
  push:
    branches:
      - temp/s01-c02-v121824-failure-subtype-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121824-failure-subtype-gate.yml'
permissions:
  contents: read
jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_SHA: 25deaea4d922e2042dc835204db0e1908b6e7e34
      BASE_SHA: e4bf4735f881fe733b04f309f9db517ebae71a34
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify exact identity and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          git -C ops cat-file -e "$BASE_SHA^{commit}"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.824'
          grep -Fq ' * Version: 1.21.824' ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.824')" ops/vf-ops.php
          grep -Fq "define('VF_OPS_ROUND', 'STATIC-CANDIDATE-FAILURE-SUBTYPE-READBACK-V1')" ops/vf-ops.php
          grep -Fq "s01-static-candidate-failure-subtypes-v121824.php" ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-candidate-failure-subtypes-v121824.php
          php -l ops/.github/phase3/v121824-candidate-failure-subtype-readback.php
          php -l ops/includes/site-release/s01-static-inspection-failure-segment-runtime-v121818.php
      - name: Run current and adjacent contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121824-candidate-failure-subtype-readback.php | tee /tmp/v121824.txt
          grep -Fxq 'PASS_V121824_CANDIDATE_FAILURE_SUBTYPE_READBACK' /tmp/v121824.txt
          php ops/.github/phase3/v121823-candidate-failure-segment-readback.php | tee /tmp/v121823.txt
          grep -Fxq 'PASS_V121823_CANDIDATE_FAILURE_SEGMENT_READBACK' /tmp/v121823.txt
          php ops/.github/phase3/v121817-inspection-failure-segment-readback.php | tee /tmp/v121817.txt
          grep -Fxq 'PASS_V121817_INSPECTION_FAILURE_SEGMENT_READBACK' /tmp/v121817.txt
      - name: Verify bounded read-only diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git -C ops diff --name-only "$BASE_SHA".."$OPS_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          for expected in \
            .github/phase3/v121824-candidate-failure-subtype-readback.php \
            VERSION \
            includes/site-release/s01-static-candidate-failure-subtypes-v121824.php \
            vf-ops.php; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          runtime=ops/includes/site-release/s01-static-candidate-failure-subtypes-v121824.php
          if grep -En 'update_option\(|delete_option\(|add_option\(|update_site_option\(|delete_site_option\(|wp_insert|wp_update|unlink\(|rename\(|copy\(' "$runtime"; then
            echo 'FORBIDDEN_STATE_WRITE_IN_READBACK' >&2
            exit 1
          fi
          if grep -En 'candidatePackageReady[[:space:]]*=|finalOnlinePass[[:space:]]*=|final_decision[[:space:]]*=|generation_result[[:space:]]*=' "$runtime"; then
            echo 'FORBIDDEN_GATE_RELAXATION' >&2
            exit 1
          fi
          grep -Fq "activeStaticJobFailureSubtypeCounts" "$runtime"
          grep -Fq "'other'=>0" "$runtime"
          echo PASS_BOUNDED_READ_ONLY_DIFF
      - name: Seal result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'S01_C02_V121824_FAILURE_SUBTYPE_GATE=PASS'
          echo "OPS_SHA=$OPS_SHA"
          echo 'PUBLIC_FAILURE_TEXT_EXPOSURE=NO_CHANGE'
          echo 'CANDIDATE_VERDICT_CHANGE=NO'
          echo 'PACKAGE_READINESS_CHANGE=NO'
          echo 'UNKNOWN_SUBTYPE_FAIL_CLOSED=PASS'
          echo 'PRODUCTION_WRITE=NO'
          echo 'RUNNER_MAIN_WRITE=NO'
          echo 'FINAL_ONLINE_PASS=NO'
