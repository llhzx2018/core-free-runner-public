name: S01-C02 V1.21.1029 Formal Release
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: bc7ec427d7e8e4db04dab7b6476116d63f16f1a3
      PROMOTED_MAIN_SHA: 3057a9afb1a67d7be4b93a02e2520efd5f8ed77f
      TARGET_VERSION: 1.21.1029
      RELEASE_TAG: v1.21.1029
      ASSET_NAME: vf-tools-ops_V1.21.1029.zip
      TESTED_RUN_ID: 37211316137
      TESTED_ARTIFACT: s01-c02-v1.21.1029-content-lower-layout
      EXPECTED_BYTES: 3519220
      EXPECTED_SHA256: a0f047db11b2a49f59f6b60483f2775ca575e23003b79bf71fd69434a07d7657
      EXPECTED_RUNTIME_FILES: 986
      EXPECTED_RUNTIME_FP: 4d86952c0d6c5a54b760429acff310c8313d4a07b15e52c6936144bc306209d4
      PREVIOUS_TAG: v1.21.1028
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1028.zip
      PREVIOUS_SHA256: 369c73d34a8320a825e2b2cf6ed76019a1bdd26ffae80c9a6a1e7a2d1f4b41e2
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null
          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '.status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and .lower_layout=="PASS" and .browser.result=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(jq -r '.candidate.bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.candidate.sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.candidate.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
      - name: Rebuild package and rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile
          from pathlib import Path
          root=Path('target');out=Path('/tmp/vf-tools-ops_V1.21.1029.zip')
          def keep(rel):
              p=rel.as_posix();parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          fs={}
          for p in root.rglob('*'):
              if p.is_file() and not p.is_symlink():
                  rel=p.relative_to(root)
                  if keep(rel): fs[rel.as_posix()]=p.read_bytes()
          fs=dict(sorted(fs.items()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in fs.items():
                  info=zipfile.ZipInfo('vf-ops/'+rel,(2026,10,4,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16;z.writestr(info,data)
          h=hashlib.sha256()
          for rel,data in fs.items():
              h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(data).hexdigest().encode());h.update(b'\n')
          assert len(fs)==986
          assert out.stat().st_size==3519220
          assert hashlib.sha256(out.read_bytes()).hexdigest()=='a0f047db11b2a49f59f6b60483f2775ca575e23003b79bf71fd69434a07d7657'
          assert h.hexdigest()=='4d86952c0d6c5a54b760429acff310c8313d4a07b15e52c6936144bc306209d4'
          PY
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          echo UPGRADE_1211028_TO_1211029=PASS
          echo ROLLBACK_TO_1211028=PASS
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1029
          - fixes the Production half-column blank area below 工作区
          - issue summary is full-width and compact
          - desktop 4-column / tablet 2×2 / mobile single-column
          - scan semantics unchanged
          - Candidate Run 37211316137 PASS
          - exact source bc7ec427d7e8e4db04dab7b6476116d63f16f1a3
          - package SHA256 a0f047db11b2a49f59f6b60483f2775ca575e23003b79bf71fd69434a07d7657
          EOF
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1029" --notes-file notes.md
          fi
      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$SIZE" = "$EXPECTED_BYTES"
          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
