name: P01 V2.27 Finalize Version Source
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-finalize-version-source-20260828.yml']
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 09f5d962a561721a456b3e454e498759c41df99c
      PRODUCT_BRANCH: feature/p01-v2.27.0-workspace-productization-20260828
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact head and patch version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(cat VERSION)" = '2.26.0'
          test "$(cat src/VERSION.txt)" = '2.26.0'
          test "$(grep -c "define('VF_VERSION', '2.26.0');" src/app/bootstrap.php)" -eq 1
          printf '2.27.0\n' > VERSION
          printf '2.27.0\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.26.0');"
          new="define('VF_VERSION', '2.27.0');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          test "$(cat VERSION)" = '2.27.0'
          test "$(cat src/VERSION.txt)" = '2.27.0'
          grep -F "define('VF_VERSION', '2.27.0');" src/app/bootstrap.php >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only | grep -Fx VERSION
          git diff --name-only | grep -Fx src/VERSION.txt
          git diff --name-only | grep -Fx src/app/bootstrap.php
      - name: Commit and push final candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'P01 V2.27: finalize version identity'
          NEW_HEAD=$(git rev-parse HEAD)
          NEW_TREE=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:$PRODUCT_BRANCH"
          echo "P01_V227_FINAL_SOURCE=$NEW_HEAD"
          echo "P01_V227_FINAL_TREE=$NEW_TREE"
          echo P01_V227_VERSION_IDENTITY=PASS
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
