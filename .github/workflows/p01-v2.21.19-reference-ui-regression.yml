name: P01 V2.21.19 Reference UI Regression
on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p01-v2.21.19-reference-ui-regression.yml'
permissions:
  contents: write
concurrency:
  group: p01-v2.21.19-reference-ui-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ADMIN_PASS: Reference-P01-22119!Strong
    steps:
      - name: Checkout current UI source and prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product rev-parse HEAD >/tmp/source-sha
          git -C product rev-parse HEAD^{tree} >/tmp/source-tree
          test "$(tr -d '\r\n' < product/VERSION)" = '2.21.18'
          test -f product/src/assets/reference-ui.css
          test -f product/src/assets/reference-ui.js
          grep -F 'assets/reference-ui.css?v=22119' product/src/index.php >/dev/null
          grep -F 'assets/reference-ui.js?v=22119' product/src/index.php >/dev/null
          grep -F "vf_admin_asset_url('assets/reference-ui.css')" product/src/app/AdminShell.php >/dev/null
          grep -F "vf_admin_asset_url('assets/reference-ui.js')" product/src/app/AdminShell.php >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml php-mbstring sqlite3 >/dev/null
          command -v google-chrome >/dev/null
          mkdir -p "$RUNNER_TEMP/p01-node";cd "$RUNNER_TEMP/p01-node";npm init -y >/dev/null 2>&1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
          find "$GITHUB_WORKSPACE/product/src" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check "$GITHUB_WORKSPACE/product/src/assets/reference-ui.js"
      - name: Fresh setup and synthetic fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a product/src /tmp/p01-ui
          php -S 127.0.0.1:18219 -t /tmp/p01-ui >/tmp/p01-ui-server.log 2>&1 & echo $! >/tmp/p01-ui.pid
          for i in $(seq 1 40);do curl -fsS -c /tmp/p01-ui.cookies http://127.0.0.1:18219/setup.php -o /tmp/p01-ui-setup && break||sleep 1;done
          csrf=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ui-setup',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsSL -b /tmp/p01-ui.cookies -c /tmp/p01-ui.cookies -X POST http://127.0.0.1:18219/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=VF Start Reference UI' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          php -r '
          require "/tmp/p01-ui/app/bootstrap.php";$r=new VfRepository(vf_db());
          $groups=[["工作工具","日常工作与站点维护"],["AI 与开发","AI、代码与部署"],["内容与资料","阅读、出版与资料"],["运营服务","域名、账单与平台"]];$ids=[];
          foreach($groups as $i=>$g){$ids[]=$r->createCategory(["name"=>$g[0],"description"=>$g[1],"is_private"=>0,"sort_order"=>100-$i]);}
          $links=[[0,"GitHub","https://github.com/","代码仓库与 Release Authority"],[0,"Cloudflare","https://www.cloudflare.com/","域名与网络服务"],[0,"CloudPanel","https://www.cloudpanel.io/","网站运行环境"],[1,"OpenAI","https://openai.com/","AI 工具与开发文档"],[1,"Vercel","https://vercel.com/","Preview 与部署"],[1,"MDN","https://developer.mozilla.org/","Web 标准参考"],[2,"Leanpub","https://leanpub.com/","电子书出版与销售"],[2,"Wikipedia","https://www.wikipedia.org/","背景资料查询"],[2,"Internet Archive","https://archive.org/","历史数字资料"],[3,"Dynadot","https://www.dynadot.com/","域名注册与续费"],[3,"PayPal","https://www.paypal.com/","支付与账单"],[3,"Stripe","https://stripe.com/","支付基础设施"]];
          foreach($links as $i=>$x){$r->saveLink(null,["category_id"=>$ids[$x[0]],"title"=>$x[1],"url"=>$x[2],"description"=>$x[3],"is_private"=>0,"is_favorite"=>($i<4?1:0),"sort_order"=>100-$i]);}
          $private=$r->createCategory(["name"=>"私人工作","description"=>"仅管理员可见","is_private"=>1,"sort_order"=>50]);$r->saveLink(null,["category_id"=>$private,"title"=>"Private Console","url"=>"https://example.com/private","description"=>"Synthetic private fixture","is_private"=>1,"sort_order"=>50]);
          $d=vf_db();if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);echo "FIXTURE=PASS\n";'
          php /tmp/p01-ui/cli/verify.php | grep -q 'VERIFY_PASS=YES'
      - name: Chrome desktop mobile and admin UA gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/p01-node/e2e.mjs" <<'JS'
          import{chromium}from'playwright-core';import fs from'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const result={front:{},admin:{},widths:{}};
          const context=await browser.newContext({viewport:{width:1440,height:900}});const p=await context.newPage();
          await p.goto('http://127.0.0.1:18219/',{waitUntil:'domcontentloaded',timeout:15000});await p.waitForSelector('.home-page',{timeout:12000});await p.waitForSelector('html[data-vf-reference-ui="2"]',{timeout:5000});await p.waitForTimeout(250);
          result.front=await p.evaluate(()=>({ref:document.documentElement.dataset.vfReferenceUi||'',css:[...document.styleSheets].some(x=>(x.href||'').includes('reference-ui.css')),commandHero:document.querySelector('.command-hero')?getComputedStyle(document.querySelector('.command-hero')).display:'missing',categories:document.querySelectorAll('.ref-home-categories').length,roots:document.querySelectorAll('.ref-home-categories .root-card').length,quick:document.querySelectorAll('.quick-link').length}));
          if(result.front.ref!=='2'||!result.front.css||!['none','missing'].includes(result.front.commandHero)||result.front.categories!==1||result.front.roots<4)throw new Error('FRONT_GATE '+JSON.stringify(result.front));
          for(const w of [1920,1440,1280,768,480,390]){await p.setViewportSize({width:w,height:w<=700?844:900});await p.waitForTimeout(140);const v=await p.evaluate(()=>({client:document.documentElement.clientWidth,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,search:document.querySelector('.top-search')?.getBoundingClientRect().width||0,bottom:document.querySelector('.mobile-bottom-nav')?getComputedStyle(document.querySelector('.mobile-bottom-nav')).display:'none'}));if(v.html>w+1||v.body>w+1)throw new Error('FRONT_OVERFLOW '+w+' '+JSON.stringify(v));if(w<=700&&v.search>44)throw new Error('MOBILE_SEARCH '+w+' '+JSON.stringify(v));result.widths['front_'+w]=v;}
          await p.setViewportSize({width:1440,height:900});await p.goto('http://127.0.0.1:18219/login.php',{waitUntil:'domcontentloaded',timeout:15000});await p.locator('input[type=password]').fill(process.env.ADMIN_PASS);await p.locator('button[type=submit],input[type=submit]').first().click();await p.waitForTimeout(500);await p.goto('http://127.0.0.1:18219/links-admin.php',{waitUntil:'domcontentloaded',timeout:15000});await p.waitForSelector('#linksBody tr',{timeout:12000});await p.waitForSelector('html[data-vf-reference-ui="2"]',{timeout:5000});
          result.admin=await p.evaluate(()=>({rails:document.querySelectorAll('.vf-admin-rail').length,css:[...document.styleSheets].some(x=>(x.href||'').includes('reference-ui.css')),rows:document.querySelectorAll('#linksBody tr').length,batch:getComputedStyle(document.getElementById('batchBar')).display,page:document.body.dataset.vfPage||''}));
          if(result.admin.rails!==1||!result.admin.css||result.admin.rows<8||result.admin.batch!=='none'||result.admin.page!=='links-admin')throw new Error('ADMIN_GATE '+JSON.stringify(result.admin));
          const checks=p.locator('#linksBody input[type=checkbox]');if(await checks.count()>=2){await checks.nth(0).check();await checks.nth(1).check();await p.waitForTimeout(100);const visible=await p.locator('#batchBar').evaluate(el=>getComputedStyle(el).display!=='none');if(!visible)throw new Error('BATCH_GATE');}
          for(const w of [1440,1024,768,480,390]){await p.setViewportSize({width:w,height:w<=700?844:900});await p.waitForTimeout(140);const v=await p.evaluate(()=>({client:document.documentElement.clientWidth,html:document.documentElement.scrollWidth,body:document.body.scrollWidth,rails:document.querySelectorAll('.vf-admin-rail').length}));if(v.html>w+1||v.body>w+1)throw new Error('ADMIN_OVERFLOW '+w+' '+JSON.stringify(v));if(v.rails!==1)throw new Error('ADMIN_RAIL '+w);result.widths['admin_'+w]=v;}
          await browser.close();fs.writeFileSync('/tmp/browser.json',JSON.stringify(result,null,2));console.log('REFERENCE_UI_CHROME=PASS');
          JS
          cd "$RUNNER_TEMP/p01-node";ADMIN_PASS="$ADMIN_PASS" node e2e.mjs
      - name: Publish evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_DRIVEN_UI_RUNTIME_REGRESSION','status':'SUCCESS','pass':True,'source_sha':open('/tmp/source-sha').read().strip(),'source_tree':open('/tmp/source-tree').read().strip(),'production_version':'2.21.18','schema_version':'2026080902','browser':json.load(open('/tmp/browser.json')),'private_data_persisted_publicly':False,'workflow_run_id':os.environ.get('GITHUB_RUN_ID','')}
          open('/tmp/result.json','w').write(json.dumps(q,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git evidence
          mkdir -p evidence/vf-agent/results;cp /tmp/result.json evidence/vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json
          git -C evidence config user.name VictorForge;git -C evidence config user.email llhzx2018@gmail.com;git -C evidence add vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json;git -C evidence commit -q -m 'evidence(P01): seal V2.21.19 reference UI browser gate'
          for i in 1 2 3;do git -C evidence pull -q --rebase origin vf-agent-operations-v1 && git -C evidence push -q origin HEAD:vf-agent-operations-v1 && exit 0||sleep 2;done;exit 1
      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/p01-ui.pid ]&&kill "$(cat /tmp/p01-ui.pid)" 2>/dev/null||true
          rm -rf product evidence /tmp/p01-ui* "$RUNNER_TEMP/p01-node" || true
