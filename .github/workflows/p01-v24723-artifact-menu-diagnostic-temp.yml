name: p01-v24723-artifact-menu-diagnostic-temp

on:
  push:
    branches:
      - diag/p01-v24723-artifact-menu

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Git source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: d8e73266cd36119e59b42a8f1fafd15e4298713a
          token: ${{ env.READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Download formal release assets
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download v2.47.23 --repo llhzx2018/vf-start --dir release
          unzip -q release/VF-Start-V2.47.23-FULL.zip -d full
          unzip -q release/VF_Start_V2.47.23_UPDATE.zip -d update

      - name: Inspect atomic repair deployment contract
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPAIR=$(find update -type f -name 'repair-v2.47.23.php' | head -n1)
          echo '--- deployment/url markers ---'
          grep -nE 'FULL|full|release|download|extract|rename|copy|opcache|VERSION|manifest|target|source|atomic|rollback' "$REPAIR" | head -220
          echo '--- source fingerprint presence ---'
          grep -n '43df6c3468ea6a1260c6c37a0f2d48c54b7af18cf573adc1a22c61e0239c37be' "$REPAIR" || true
          echo '--- legacy/current route markers in repair payload ---'
          grep -n 'surface-manager.php' "$REPAIR" | head -30 || true
          grep -n '系统收件箱' "$REPAIR" || true
          echo P01_V24723_REPAIR_INSPECTION=PASS

      - name: Compare AdminShell across Git FULL UPDATE
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(sha256sum source/src/app/AdminShell.php | awk '{print $1}')"
          FULL_FILE=$(find full -path '*/app/AdminShell.php' -o -path '*/src/app/AdminShell.php' | head -n1)
          echo "FULL_FILE=$FULL_FILE"
          test -n "$FULL_FILE"
          echo "FULL_SHA=$(sha256sum "$FULL_FILE" | awk '{print $1}')"
          cmp -s source/src/app/AdminShell.php "$FULL_FILE"
          echo GIT_FULL_ADMINSHELL_IDENTICAL=YES

          echo '--- Git forbidden legacy labels ---'
          ! grep -F '系统收件箱' source/src/app/AdminShell.php
          ! grep -F '资源库' source/src/app/AdminShell.php
          ! grep -F '业务分类' source/src/app/AdminShell.php
          echo GIT_LEGACY_LABELS=ABSENT

          echo '--- FULL forbidden legacy labels ---'
          ! grep -F '系统收件箱' "$FULL_FILE"
          ! grep -F '资源库' "$FULL_FILE"
          ! grep -F '业务分类' "$FULL_FILE"
          echo FULL_LEGACY_LABELS=ABSENT

          echo '--- UPDATE package listing ---'
          find update -maxdepth 3 -type f -print | sort | head -200
          REPAIR=$(find update -type f -name 'repair-v2.47.23.php' | head -n1)
          test -n "$REPAIR"
          grep -n "AdminShell.php" "$REPAIR" || true
          grep -n "system.php" "$REPAIR" || true
          grep -n "resources.php" "$REPAIR" || true
          echo P01_V24723_ARTIFACT_MENU_DIAGNOSTIC=PASS
