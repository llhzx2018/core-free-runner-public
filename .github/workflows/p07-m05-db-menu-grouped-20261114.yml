# Temporary low-latency source/UX guard complement to full KVM; no public assets.
name: P07-M05 新服务器初始化 MariaDB MySQL 分组 UX 精确源码机验
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m05-db-menu-grouped-20261114.yml']
permissions:
  contents: read
jobs:
  guard-and-ux:
    if: github.head_ref == 'test/p07-m05-db-menu-grouped-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout pinned private P07 M05 exact source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 6ee5574a55107abfa828f38d0c13438e5f2bac4b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Actual seven UX Shell and old-data safety cases plus independent M05 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = 6ee5574a55107abfa828f38d0c13438e5f2bac4b
          bash -n source/bin/vfops-init-ui
          python3 -B -m py_compile source/lib/m05_environment_guard.py source/tests/test_p07_m05_vultr_terminal_ux.py
          (cd source && python3 -B scripts/check_p07_modules.py)
          (cd source && python3 -B scripts/check_p07_terminal_ux.py --module P07-M05 --changed-file bin/vfops-init-ui --evidence-file docs/ux-reviews/p07-m05-official-cloudpanel-db-choice-ux6-20261114.json)
          (cd source && python3 -B -m unittest discover -s tests -p 'test_p07_m05_*.py' -q)
          # Shared OS/bootstrap source feeds the isolated M05 bundle and M03.
          (cd source && python3 -B -m unittest discover -s tests -p 'test_server_migration.py' -q)
          (cd source && PYTHONPATH=lib python3 -B -m unittest discover -s tests -p 'test_server_migration_pull.py' -k FreshCloudPanelDatabaseChoiceTests -q)
          echo P07_M05_OFFICIAL_DB_CHOICES_BACKEND_M03_COMPATIBILITY=PASS
          mkdir -p "$RUNNER_TEMP/m05"
          python3 -B source/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/a.zip" >/dev/null
          python3 -B source/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/b.zip" >/dev/null
          cmp "$RUNNER_TEMP/m05/a.zip" "$RUNNER_TEMP/m05/b.zip"
          echo "P07_M05_UX6_VULTR_STOCK_VS_DAEMON_NEGATIVES_AND_SHELL_UX=PASS"
          echo "P07_M05_UX6_DETERMINISTIC_ZIP=PASS"
          # Render the actual terminal helper in a disposable, NO_COLOR shell:
          # no CloudPanel/database/network write and no Owner VPS interaction.
          {
            printf '#!/usr/bin/env bash\nset -Eeuo pipefail\nROOT_DIR=%q\nsource "$ROOT_DIR/lib/terminal_ui.sh"\n' "$PWD/source"
            sed -n '/^select_cloudpanel_db_engine() {/,/^}$/p' source/bin/vfops-init-ui
            cat <<'MENU'
          payload='{"status":"READY","os_id":"debian","version_id":"13","writes_performed":false,"db_engine_options":["MARIADB_11.8","MYSQL_8.4","MARIADB_12.3","MYSQL_8.0"],"recommended_db_engine":"MARIADB_11.8"}'
          P07_SELECTED_DB_ENGINE=''
          select_cloudpanel_db_engine "$payload"
          printf '\\nVERIFIED_OWNER_ENGINE=%s\\n' "$P07_SELECTED_DB_ENGINE"
          MENU
          } > "$RUNNER_TEMP/m05/render-menu.sh"
          printf '2\ny\n' | NO_COLOR=1 bash "$RUNNER_TEMP/m05/render-menu.sh" > "$RUNNER_TEMP/m05/menu.out"
          grep -Fxq 'MariaDB' "$RUNNER_TEMP/m05/menu.out"
          grep -Fxq 'MySQL' "$RUNNER_TEMP/m05/menu.out"
          grep -Fq '  1. MariaDB 11.8' "$RUNNER_TEMP/m05/menu.out"
          grep -Fq '  2. MariaDB 12.3' "$RUNNER_TEMP/m05/menu.out"
          grep -Fq '  3. MySQL 8.4' "$RUNNER_TEMP/m05/menu.out"
          grep -Fq '  4. MySQL 8.0' "$RUNNER_TEMP/m05/menu.out"
          grep -Fq '已选：MariaDB 12.3' "$RUNNER_TEMP/m05/menu.out"
          grep -Fxq 'VERIFIED_OWNER_ENGINE=MARIADB_12.3' "$RUNNER_TEMP/m05/menu.out"
          if grep -q 
          echo "P07_OWNER_VPS_PRODUCTION=UNTOUCHED"
      - name: Always remove transient private source and test package
        if: always()
        shell: bash
        run: |
          rm -rf -- source "$RUNNER_TEMP/m05"
          echo P07_M05_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
\\033' "$RUNNER_TEMP/m05/menu.out"; then echo NO_COLOR_BROKEN; exit 42; fi
          echo P07_M05_REAL_SHELL_GROUPED_MENU_MARIADB_MYSQL=PASS

          echo "P07_OWNER_VPS_PRODUCTION=UNTOUCHED"
      - name: Always remove transient private source and test package
        if: always()
        shell: bash
        run: |
          rm -rf -- source "$RUNNER_TEMP/m05"
          echo P07_M05_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
