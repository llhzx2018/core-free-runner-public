name: TEMP S01-C02 Ops 1.21.797 SEO Keyword Authority Bridge Gate R2

on:
  push:
    branches:
      - temp/s01-c02-v121797-seo-keyword-authority-bridge-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121797-seo-keyword-authority-bridge-gate-r2.yml'

permissions:
  contents: read

jobs:
  seo-keyword-authority-bridge-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_BASE_SHA: 86e0664f193a6d76198e55756c938c64672416db
      OPS_CANDIDATE_SHA: 81036e250ceef81bb0b0547f517e300076ce68e1
      WP_PATH: /tmp/vf-ops-v121797-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121797-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-candidate
      - name: Verify exact source, scope, and standalone contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops-base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops-base/VERSION)" = 1.21.796
          test "$(tr -d '\r\n' < ops-candidate/VERSION)" = 1.21.797
          for f in contract.php validation.php repository.php audit.php manifest.php scanner.php service.php migration.php; do
            cmp "ops-base/includes/content-workflow/$f" "ops-candidate/includes/content-workflow/$f"
          done
          cmp ops-base/includes/seo-data/keyword-research-service.php ops-candidate/includes/seo-data/keyword-research-service.php
          cmp ops-base/includes/seo-data/keyword-map-service.php ops-candidate/includes/seo-data/keyword-map-service.php
          php -l ops-candidate/vf-ops.php
          php -l ops-candidate/includes/seo-data/keyword-planner-bridge-service.php
          php -l ops-candidate/.github/phase3/v121797-seo-keyword-authority-bridge.php
          php ops-candidate/.github/phase3/v121797-seo-keyword-authority-bridge.php | tee "$EVIDENCE_DIR/standalone.txt"
          grep -Fxq PASS_V121797_SEO_KEYWORD_AUTHORITY_BRIDGE "$EVIDENCE_DIR/standalone.txt"
          echo PASS_V121797_UNRELATED_CONTENT_WORKFLOW_BYTE_STABILITY > "$EVIDENCE_DIR/scope.txt"
      - name: Install WordPress 7.1
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1
          mariadb -h127.0.0.1 -P3306 -uvf -pvf -Nse 'SELECT VERSION()' vf_ops_gate | tee "$EVIDENCE_DIR/mariadb.txt"
          grep -q '^11\.4\.' "$EVIDENCE_DIR/mariadb.txt"
      - name: Install exact 1.21.796 and seed isolated formal SEO authority
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WP_PATH/wp-content/plugins/vf-ops"
          rsync -a --delete --exclude=.git ops-base/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp plugin activate vf-ops --path="$WP_PATH"
          wp eval --path="$WP_PATH" '
            global $wpdb; $now=current_time("mysql");
            $post=wp_insert_post(["post_title"=>"Tools Gate","post_content"=>str_repeat("tool ",150),"post_status"=>"publish","post_type"=>"page","post_name"=>"tools"]); if(is_wp_error($post)||$post<1) exit(2);
            $family=vf_ops_seo_table_name_v121439("page_family"); $member=vf_ops_seo_table_name_v121439("page_member"); $assign=vf_ops_seo_table_name_v121439("keyword_assignment");
            $wpdb->insert($family,["family_key"=>"tools","family_name"=>"Tools","family_type"=>"language_specific","core_task"=>"Use M3U8 tools","family_status"=>"active","owner_id"=>1,"created_at"=>$now,"updated_at"=>$now]); $fid=(int)$wpdb->insert_id; if($fid<1) exit(3);
            $wpdb->insert($member,["family_id"=>$fid,"post_id"=>$post,"language"=>"en","locale"=>"en_US","url"=>home_url("/tools/"),"url_path"=>"/tools/","page_type"=>"page","user_task"=>"Use M3U8 tools","primary_search_intent"=>"transactional","primary_keyword"=>"m3u8 tools","content_status"=>"publish","member_status"=>"active","created_at"=>$now,"updated_at"=>$now]); $mid=(int)$wpdb->insert_id; if($mid<1) exit(4);
            $common=["research_job_id"=>0,"query_language"=>"en","target_language"=>"en","locale"=>"en_US","country"=>"US","source"=>"manual_entry","source_date"=>"2026-09-03","page_family_id"=>$fid,"page_member_id"=>$mid,"search_intent"=>"transactional","page_type"=>"page","target_url"=>home_url("/tools/"),"candidate_status"=>"accepted","confidence"=>"high","owner_id"=>1,"status"=>"active","notes"=>"isolated runner fixture","created_at"=>$now,"updated_at"=>$now];
            $primary=wp_generate_uuid4();
            $wpdb->insert($assign,array_merge($common,["assignment_id"=>$primary,"keyword"=>"m3u8 tools","normalized_keyword"=>"m3u8 tools","role"=>"primary"]));
            $wpdb->insert($assign,array_merge($common,["assignment_id"=>wp_generate_uuid4(),"keyword"=>"m3u8 channel list editor","normalized_keyword"=>"m3u8 channel list editor","role"=>"long_tail"]));
            $wpdb->insert($assign,["assignment_id"=>wp_generate_uuid4(),"research_job_id"=>0,"keyword"=>"m3u8 url not working","normalized_keyword"=>"m3u8 url not working","query_language"=>"en","target_language"=>"en","locale"=>"en_US","country"=>"US","source"=>"manual_entry","source_date"=>"2026-09-03","search_intent"=>"troubleshooting","role"=>"long_tail","candidate_status"=>"accepted","confidence"=>"low","owner_id"=>1,"status"=>"active","notes"=>"unassigned must not project","created_at"=>$now,"updated_at"=>$now]);
            update_option("vf_ops_seo_gate_evidence_v1",["status"=>"PASS","stale"=>true],false); update_option("vf_ops_seo_gsc_insights_v1",["rows"=>7,"stale"=>true],false); update_option("vf_gate_primary_assignment",$primary,false);
            echo json_encode(["post"=>$post,"family"=>$fid,"member"=>$mid,"plannerRows"=>count((array)vf_ops_seo_plan_readback()["keywordMap"])]);' > "$EVIDENCE_DIR/base.json"
          jq -e '.post>0 and .family>0 and .member>0 and .plannerRows==0' "$EVIDENCE_DIR/base.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-before.json"
      - name: Upgrade exact 1.21.797 and verify bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --delete --exclude=.git ops-candidate/ "$WP_PATH/wp-content/plugins/vf-ops/"
          wp eval --path="$WP_PATH" '
            $l=vf_ops_lifecycle_apply_version_v121377("gate"); if(empty($l["ok"])) {echo json_encode(["lifecycle"=>$l]); exit(7);} $before=vf_ops_seo_plan_readback(); $r=vf_ops_keyword_planner_bridge_reconcile_v121797("gate"); $after=vf_ops_seo_plan_readback(); $marker=get_option("vf_ops_keyword_planner_bridge_v1",[]);
            echo json_encode(["installed"=>$l["state"]["installed_version"]??"","previous"=>$l["state"]["previous_version"]??"","bridge"=>$r,"beforeRevision"=>$before["revision"]??0,"afterRevision"=>$after["revision"]??0,"keywordMap"=>$after["keywordMap"]??[],"gateExists"=>get_option("vf_ops_seo_gate_evidence_v1",null)!==null,"gscExists"=>get_option("vf_ops_seo_gsc_insights_v1",null)!==null,"marker"=>$marker,"hookPriority"=>has_action("admin_init","vf_ops_keyword_planner_bridge_maybe_sync_v121797")]); if(empty($r["ok"])) exit(8);' > "$EVIDENCE_DIR/upgrade.json"
          jq -e '.installed=="1.21.797" and .previous=="1.21.796" and .bridge.ok==true and .bridge.changed==true and (.keywordMap|length)==1 and .keywordMap[0].pageFamilyId=="tools" and .keywordMap[0].primaryKeyword=="m3u8 tools" and (.keywordMap[0].longTailKeywords|length)==1 and .keywordMap[0].longTailKeywords[0]=="m3u8 channel list editor" and .gateExists==false and .gscExists==false and .marker.authorityActive==true and .marker.authority=="vfseo_keyword_assignment" and .hookPriority==2' "$EVIDENCE_DIR/upgrade.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-after.json"
          cmp "$EVIDENCE_DIR/plugins-before.json" "$EVIDENCE_DIR/plugins-after.json"
      - name: Verify long-tail non-promotion, clear and idempotence
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            global $wpdb; $assign=vf_ops_seo_table_name_v121439("keyword_assignment"); $primary=(string)get_option("vf_gate_primary_assignment",""); $wpdb->update($assign,["candidate_status"=>"rejected","updated_at"=>current_time("mysql")],["assignment_id"=>$primary]);
            $r=vf_ops_keyword_planner_bridge_reconcile_v121797("gate-unassign"); $plan=vf_ops_seo_plan_readback(); $revision=(int)($plan["revision"]??0); $r2=vf_ops_keyword_planner_bridge_reconcile_v121797("gate-idempotent"); $plan2=vf_ops_seo_plan_readback(); echo json_encode(["clear"=>$r,"rows"=>count((array)($plan["keywordMap"]??[])),"revision"=>$revision,"second"=>$r2,"secondRevision"=>(int)($plan2["revision"]??0)]); if(empty($r["ok"])||empty($r2["ok"])) exit(9);' > "$EVIDENCE_DIR/clear.json"
          jq -e '.clear.changed==true and .rows==0 and .second.changed==false and .secondRevision==.revision' "$EVIDENCE_DIR/clear.json" >/dev/null
          echo PASS_V121797_WORDPRESS_SEO_KEYWORD_AUTHORITY_BRIDGE_GATE | tee "$EVIDENCE_DIR/final.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121797-seo-keyword-authority-bridge-gate-r2
          path: /tmp/vf-ops-v121797-evidence/
          if-no-files-found: warn
          retention-days: 14
