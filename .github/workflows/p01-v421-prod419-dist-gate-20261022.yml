name: P01 V421 Owner Version Distribution Gate (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v421-prod419-dist-gate-20261022.yml'
permissions:
  contents: read
jobs:
  bridge:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify staged P01 bridge channel and exact Release
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" /tmp/update-source
          git -C /tmp/update-source fetch -q origin e7982e703db9c847e5a03751d295a5c869a89f36
          git -C /tmp/update-source checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/update-source rev-parse HEAD)" = "e7982e703db9c847e5a03751d295a5c869a89f36"
          unset READ_TOKEN
          cd /tmp/update-source
          php -l update-core/php/src/UpdateCore.php
          php update-core/php/tests/run.php
          php -r '
            require "update-core/php/src/UpdateCore.php";
            $m=json_decode(file_get_contents("projects/P01.json"),true,512,JSON_THROW_ON_ERROR);
            if($m["target_version"]!=="2.47.421"||$m["from_versions"]!==["2.47.419"]||$m["product_identity"]!=="c6a50710db2f824f33a5ac1a8bb8db8eafb4d000")exit(3);
            $c=new \CoreUpdates\UpdateCore("P01","APP");
            if($c->check("2.47.419","2026090401",$m)["status"]!=="AVAILABLE")exit(4);
            foreach(["2.47.418","2.47.417","2.47.416","2.47.417","2.47.418","2.47.419"] as $v)
                if($c->check($v,"2026090401",$m)["status"]==="AVAILABLE")exit(5);
            if($c->check("2.47.419","99999",$m)["status"]==="AVAILABLE")exit(6);
            echo "P01_421_SOURCE_AND_SCHEMA_GATES=PASS\n";
          '
          mkdir /tmp/p01-release
          gh release download v2.47.421 -R llhzx2018/vf-start -D /tmp/p01-release -p VF_Start_V2.47.421_UPDATE.zip
          test "$(stat -c%s /tmp/p01-release/VF_Start_V2.47.421_UPDATE.zip)" = 2688316
          echo 'dbb2c390c2d0635b02a9b7ada2419f741d9ba2edc81e995deedd2cf04e3dc376  /tmp/p01-release/VF_Start_V2.47.421_UPDATE.zip' | sha256sum -c
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.421 --jq '.id')" = 420441388
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.421 --jq '.assets[] | select(.name=="VF_Start_V2.47.421_UPDATE.zip") | .size')" = 2688316
          echo P01_421_DISTRIBUTION=PASS
