name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-header178-20261023]
    paths: ['.github/workflows/s01-header178-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.178
  TARGET_SHA: abf8b798a5da1f4e7a29fe7d6a17fa3c8edb8cca
  UPDATE_SHA: fa5d25c8da8a3d47e3a086abe3fb595c6f8fe691
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: fa5d25c8da8a3d47e3a086abe3fb595c6f8fe691
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='b1c3cde230e80b25a30b549f09daa96eeec32c86931c0af64b0b38de781418fd' and m['asset_bytes']==1977722
          assert m['runtime_files']==476 and '1.35.177' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
