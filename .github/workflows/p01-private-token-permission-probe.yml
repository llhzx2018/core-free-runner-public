name: P01 Private Repo Token Permission Probe

on:
  pull_request:
    paths:
      - 'requests/p01-private-token-probe-*.txt'

permissions:
  contents: read

jobs:
  probe:
    if: startsWith(github.head_ref, 'agent/p01-private-token-probe-')
    runs-on: ubuntu-24.04
    steps:
      - name: Probe configured tokens without exposing secrets
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          probe() {
            name="$1" token="$2"
            test -n "$token" || { echo "${name}_PRESENT=NO"; return; }
            set +e
            data=$(GH_TOKEN="$token" gh api repos/llhzx2018/vf-start 2>/dev/null)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "${name}_PRIVATE_REPO_ACCESS=NO"
              return
            fi
            push=$(printf '%s' "$data" | jq -r '.permissions.push // false')
            admin=$(printf '%s' "$data" | jq -r '.permissions.admin // false')
            maintain=$(printf '%s' "$data" | jq -r '.permissions.maintain // false')
            echo "${name}_PRIVATE_REPO_ACCESS=YES"
            echo "${name}_PUSH=${push}"
            echo "${name}_MAINTAIN=${maintain}"
            echo "${name}_ADMIN=${admin}"
          }
          probe RELEASE_TOKEN "$RELEASE_TOKEN"
          probe READ_TOKEN "$READ_TOKEN"
