name: One-Time S01-C03 V1.25.1 Release Asset Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_one-time-s01-c03-v1251-release-asset-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASSET_API: https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/assets/516513016
      ASSET_NAME: vf-tools-m3u8_V1.25.1.zip
      EXPECTED_BYTES: '3520019'
      EXPECTED_SHA256: 61c09336d6fece2807f223b40a4eae59db06b4edae0f4524a916a072af03f220
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Download exact formal GitHub Release Asset
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          out="$RUNNER_TEMP/$ASSET_NAME"
          curl --fail-with-body -sS -L \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$ASSET_API" -o "$out"
          test "$(stat -c %s "$out")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$out" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -t "$out" >/dev/null
          echo "RELEASE_ASSET_BYTES=$(stat -c %s "$out")"
          echo "RELEASE_ASSET_SHA256=$(sha256sum "$out" | awk '{print $1}')"
          echo 'RELEASE_ASSET_EXACT=PASS'

      - name: Export exact bytes without rebuild
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vf-tools-m3u8_V1.25.1-release-asset
          path: ${{ runner.temp }}/vf-tools-m3u8_V1.25.1.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
