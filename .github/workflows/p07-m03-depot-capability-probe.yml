name: P07 M03 Depot isolated cloud-machine capability probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-depot-capability-probe.yml']
permissions:
  contents: read
jobs:
  depot-probe:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Verify actual Depot machine, root and isolated containers
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P07_DEPOT_RUNNER_JOB_STARTED=YES
          uname -sm
          sed -n '1,7p' /etc/os-release
          echo "P07_DEPOT_MEMORY_KIB=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)"
          echo "P07_DEPOT_CPU_COUNT=$(nproc)"
          if sudo -n true; then echo P07_DEPOT_SUDO=YES; else echo P07_DEPOT_SUDO=NO; fi
          if command -v ssh >/dev/null 2>&1; then echo P07_DEPOT_SSH_CLIENT=YES; else echo P07_DEPOT_SSH_CLIENT=NO; fi
          if command -v rsync >/dev/null 2>&1; then echo P07_DEPOT_RSYNC=YES; else echo P07_DEPOT_RSYNC=NO; fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo P07_DEPOT_DOCKER_DAEMON=YES
            docker run --rm --pull=missing alpine:3.20 sh -c 'printf "P07_DEPOT_CONTAINER_ISOLATION=PASS\\n"'
          else
            echo P07_DEPOT_DOCKER_DAEMON=NO
          fi
          if [ -e /dev/kvm ]; then echo P07_DEPOT_NESTED_KVM=YES; else echo P07_DEPOT_NESTED_KVM=NO; fi
          if [ -d /run/systemd/system ]; then echo P07_DEPOT_HOST_SYSTEMD=YES; else echo P07_DEPOT_HOST_SYSTEMD=NO; fi
          echo P07_DEPOT_REAL_TWO_CLOUDPANEL_HOSTS=NOT_PROVEN
