name: temp-s01-m3u8-12530-identity-inventory-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-identity-inventory-20260908.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      SHA: b986fb485a3d08828e3926472076aae29aaf469f
    steps:
      - name: Read exact candidate version identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INVENTORY_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-inventory
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-inventory
          git -C /tmp/m3u8-inventory checkout -q "$SHA"
          test "$(git -C /tmp/m3u8-inventory rev-parse HEAD)" = "$SHA"
          cd /tmp/m3u8-inventory
          echo 'VERSION_FILE='"$(tr -d '\r\n' < VERSION)"
          echo 'IDENTITY_MATCHES_BEGIN'
          rg -n --hidden --glob '!.git/**' --glob '!node_modules/**' --glob '!vendor/**' '1\.25\.29|R253|ERROR_RECOVERY|VF_TOOL_M3U8_VERSION' | head -n 300 || true
          echo 'IDENTITY_MATCHES_END'
          echo 'PASS_S01_C03_12530_IDENTITY_INVENTORY'
