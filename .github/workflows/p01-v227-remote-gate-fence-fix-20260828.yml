name: P01 V2.27 Remote Gate Fence Fix
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-remote-gate-fence-fix-20260828.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Patch only incorrect core-updates commit fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --branch task/p01-v222-multi-surface-gate-20260828 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" repo
          cd repo
          F=.github/workflows/p01-v227-remote-online-update-gate-20260828.yml
          grep -F 'CORE_UPDATES_COMMIT: 4da2ad06331f7b2940cd767545612707635835d6' "$F" >/dev/null
          sed -i 's/CORE_UPDATES_COMMIT: 4da2ad06331f7b2940cd767545612707635835d6/CORE_UPDATES_COMMIT: e6fbcb7e330035ff65f6ed759bec133bf1c5bc38/' "$F"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "$F"
          git diff --cached --check
          test "$(git diff --cached --numstat | awk '{a+=$1;d+=$2} END{print a+0,d+0}')" = '1 1'
          git commit -m 'runner: correct P01 V2.27 remote gate manifest commit fence'
          git push origin HEAD:task/p01-v222-multi-surface-gate-20260828
          echo P01_V227_GATE_FENCE_FIX=PASS
