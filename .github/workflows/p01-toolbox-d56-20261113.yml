name: P01 Tools Canonical Management D56 Exact Source
on:
  push:
    branches:
      - test/p01-toolbox-20261113-d56-ff5c

permissions:
  contents: read

jobs:
  p01-tools-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate registered public-safe private proof
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-toolbox-20261113-d56-ff5c"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=TOOLS_CANONICAL_WORKFLOW_AND_URL_PLACEMENT_D56"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Checkout private exact candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ff5c7ca5ce3e2c029e62a07d7eeec72c48145bd4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify product identity and new tools code
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "ff5c7ca5ce3e2c029e62a07d7eeec72c48145bd4"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/OwnerToolboxManager.php
          test -f candidate/src/app/next/frontend/src/OwnerToolsManage.vue
          test -f candidate/tests/p01_d56_tools_manage.php
          echo "P01_EXACT_SOURCE=ff5c7ca5ce3e2c029e62a07d7eeec72c48145bd4"
      - name: Prepare isolated PHP SQLite engine and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-mbstring >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);'
          for f in candidate/src/app/next/OwnerToolboxManager.php candidate/src/app/next/OwnerPersonalCatalog.php candidate/src/app/next/OwnerDataRuntime.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/src/app/next/http/OwnerHttpRoutes.php candidate/tests/p01_d56_tools_manage.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          echo "P01_D56_PHP_SYNTAX=PASS"
      - name: Install pinned Laravel PHP dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next
          composer install --no-dev --no-interaction --no-scripts --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          echo "P01_D56_LARAVEL_LOCKED=PASS"
      - name: Actual canonical SQLite workflows and Owner safety integration
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d56_tools_manage.php > "$RUNNER_TEMP/p01-d56.txt" 2>&1; then
            echo "P01_D56_TOOLBOX_SQLITE=FAIL"
            grep -E 'P01 D56 FAIL|P01 D56 UNSAFE|Fatal error|Uncaught|Error|Exception' "$RUNNER_TEMP/p01-d56.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 15 || true
            exit 1
          fi
          grep '^P01_D56_.*=PASS$' "$RUNNER_TEMP/p01-d56.txt"
          echo "P01_D56_TOOLBOX_SQLITE=PASS"
      - name: Typecheck unit tests and production Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D56_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|OwnerToolsManage|toolbox-manage' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 30 || true
            exit 1
          fi
          echo "P01_D56_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D56_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 20 || true
            exit 1
          fi
          echo "P01_D56_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D56_VITE_BUILD=PASS"
      - name: Chromium all workspaces 390 768 1440 and unknown save
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D56_CHROMIUM=FAIL"
            grep -E '^  [0-9]+\)|Error:|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 35 || true
            exit 1
          fi
          echo "P01_D56_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always remove private checkout and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_PUBLIC_ARTIFACTS=NONE"
