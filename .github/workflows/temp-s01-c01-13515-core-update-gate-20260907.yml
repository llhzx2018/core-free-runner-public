name: S01-C01 1.35.15 Core Update External Gate

on:
  push:
    branches: [temp/s01-c01-13515-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-c01-13515-core-update-gate-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: ec6c7fd1ae58d144f55df46772c750b5c7ca2d00
      CORE_HEAD: b3e807a5dd767720fbb07ac670aa1cdc28e53029
      THEME_SHA: dac85683e5e826c343f7d6502f50394b6126ee73
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact one-manifest delta and canonical validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          test "$(git -C core diff --name-only "$CORE_BASE..$CORE_HEAD")" = 'projects/S01-C01.json'
          cd core
          python3 -m json.tool projects/S01-C01.json >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'EXACT_ONE_MANIFEST_DELTA=PASS'
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: S01-C01 semantic boundary
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('projects/S01-C01.json'))
          assert c['target_version']=='1.35.15'
          assert c['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14']
          assert c['release_tag']=='v1.35.15'
          assert c['asset_name']=='vf-tools-theme_V1.35.15.zip'
          assert c['asset_bytes']==1804088
          assert c['asset_sha256']=='f3815cff87d139b8e21308ad98226d6b11fd7828b2157450218d4a3e76319949'
          assert c['runtime_files']==445
          assert c['runtime_fingerprint']=='47b7471a7b1a27064cf7febc1275f2eb63946ca8d1e4ae08a90189e32f41b74c'
          assert c['schema_from']=='N/A' and c['schema_to']=='N/A'
          assert 'does not claim Production' in c['notes']
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))
          assert c2['target_version']=='1.21.852'
          assert c3['target_version']=='1.25.24'
          print('S01_C01_SEMANTIC_BOUNDARY=PASS')
          print('C02_C03_UNCHANGED=PASS')
          PY

      - name: Exact formal Release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.15 > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r --arg a 'vf-tools-theme_V1.35.15.zip' '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = '1804088'
          test "$(jq -r --arg a 'vf-tools-theme_V1.35.15.zip' '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = 'sha256:f3815cff87d139b8e21308ad98226d6b11fd7828b2157450218d4a3e76319949'
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.15 | jq -r '.object.sha')" = "$THEME_SHA"
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-theme/branches/main | jq -r '.commit.sha')" = "$THEME_SHA"
          echo 'EXACT_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_C01_13515_CORE_UPDATE_EXTERNAL_GATE=PASS'
