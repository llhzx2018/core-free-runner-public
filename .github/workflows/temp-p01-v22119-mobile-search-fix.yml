name: TEMP P01 V22119 Mobile Search Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-mobile-search-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Patch exact maintenance source
        shell: bash
        run: |
          set -Eeuo pipefail;test -n "$READ_TOKEN";test -n "$WRITE_TOKEN"
          git clone -q --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse HEAD)" = 'a6e017e2400c8202ee763a5831f01595d5b30c9e'
          python3 - <<'PY'
          p='product/src/assets/reference-ui.css';s=open(p,encoding='utf-8').read();old='body:not([data-vf-admin-shell]) .top-search{width:40px;max-width:40px;height:38px;flex:0 0 40px;border-radius:9px}';new='body:not([data-vf-admin-shell]) .top-search{width:40px;min-width:40px;max-width:40px;height:38px;flex:0 0 40px;box-sizing:border-box;padding-inline:0!important;border-radius:9px}'
          assert s.count(old)==1,(s.count(old),old);s=s.replace(old,new,1);open(p,'w',encoding='utf-8',newline='\n').write(s)
          PY
          git -C product config user.name VictorForge;git -C product config user.email llhzx2018@gmail.com;git -C product add src/assets/reference-ui.css;git -C product commit -q -m 'fix(P01): constrain mobile search to icon width';git -C product push -q origin HEAD:maintenance/reference-driven-ui-2.21.19-20260819
          git -C product rev-parse HEAD >/tmp/newsha;git -C product rev-parse HEAD^{tree} >/tmp/newtree
          echo NEW_SHA=$(cat /tmp/newsha);echo NEW_TREE=$(cat /tmp/newtree)
      - name: Publish patch evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail;python3 - <<'PY'
          import json,os
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'MOBILE_SEARCH_WIDTH_FIX','status':'SUCCESS','pass':True,'source_sha':open('/tmp/newsha').read().strip(),'source_tree':open('/tmp/newtree').read().strip(),'root_cause':'content-box sizing inherited padding made nominal 40px control render about 54px at 480px viewport','fix':'explicit border-box, min/max/width 40px and zero inline padding','private_data_persisted_publicly':False,'workflow_run_id':os.environ['GITHUB_RUN_ID']};open('/tmp/e.json','w').write(json.dumps(q,indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-MOBILE-SEARCH-FIX.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-MOBILE-SEARCH-FIX.json;git -C out commit -q -m 'evidence(P01): seal V2.21.19 mobile search fix';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1
