name: S01 Page Body V2 Release Candidate Gate

on:
  push:
    branches:
      - task/s01-page-body-v2-exact-gate
    paths:
      - .github/workflows/s01-page-body-v2-release-candidate-gate.yml

permissions:
  contents: read

jobs:
  candidate:
    name: V2 RC Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: c0159b3cb58cfa6cc0d1bfc36e29ab8271d5e29b
            head: 84ae8ac5ebab3508663cd93cb77b0e7aefaf55ad
            version: 1.21.946
            allowed: assets/css/current/admin-s01-page-body-system-v2.css,includes/views/admin-style-helpers/admin-s01-uiux-polish.php,tests/s01-c02-page-body-system-v2-full-surface-contract.php,VERSION,vf-ops.php,CHANGELOG.md
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: d80e1681d0b69bfd3a9da915befb161273bce747
            head: 7e3c33b11ed00d22824709e938c976f61c51a272
            version: 1.35.48
            allowed: src/assets/css/admin/admin-s01-page-body-system-v2.css,src/inc/admin/admin-s01-uiux-polish.php,src/inc/admin/admin-router.php,tests/s01-c01-page-body-system-v2-full-surface-contract.php,VERSION,src/inc/runtime-constants.php,src/style.css,src/theme.json,CHANGELOG.md
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 1a86645b2677c75f196843eb82fdfb8b1f54990e
            head: 2871e0959a8b071176929e4cb216a60408bdfeac
            version: 1.25.51
            allowed: src/admin/ui-v4/admin-s01-page-body-system-v2.css,src/admin/admin-s01-uiux-polish.php,src/admin/Controller/class-v6-provider-fixtures-controller.php,tests/s01-c03-page-body-system-v2-full-surface-contract.php,VERSION,src/vf-tool-m3u8.php,CHANGELOG.md

    steps:
      - name: Credential and authority gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo "PUBLIC_AUTHORITY_APPLICABILITY=UA_UI,TESTING,UPGRADE,SECURITY,GIT"
          echo "OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A"
          echo "OWNER_REAL_USE=POST_PRODUCTION_REQUIRED"
          echo "CREDENTIAL_GATE=PASS"

      - name: Exact-source bounded diff
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/commits/$HEAD" -o /tmp/head.json
          test "$(jq -r '.sha' /tmp/head.json)" = "$HEAD"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          echo "EXACT_BOUNDED_DIFF=PASS"

      - name: Fetch exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          HEAD: ${{ matrix.head }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Version and V2 contracts
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "$VERSION"
          case "$COMPONENT" in
            OPS)
              grep -F "Version: $VERSION" "$SOURCE_DIR/vf-ops.php"
              grep -F "VF_OPS_VERSION', '$VERSION'" "$SOURCE_DIR/vf-ops.php"
              php -l "$SOURCE_DIR/vf-ops.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v2-full-surface-contract.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c02-page-body-system-v1-phase3-residue-contract.php"
              ;;
            THEME)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/style.css"
              grep -F "VF_THEME_VERSION', '$VERSION'" "$SOURCE_DIR/src/inc/runtime-constants.php"
              grep -F "V1.35.48_S01_PAGE_BODY_V2_FULL_SURFACE" "$SOURCE_DIR/src/inc/runtime-constants.php"
              php -l "$SOURCE_DIR/src/inc/runtime-constants.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v2-full-surface-contract.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c01-page-body-system-v1-phase3-residue-contract.php"
              ;;
            M3U8)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              grep -F "VF_TOOL_M3U8_VERSION', '$VERSION'" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              grep -F "VF_TOOL_M3U8_ROUND', 'R273'" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php -l "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php -l "$SOURCE_DIR/src/admin/Controller/class-v6-provider-fixtures-controller.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v2-full-surface-contract.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-contract.php"
              php "$SOURCE_DIR/tests/s01-c03-page-body-system-v1-phase3-residue-contract.php"
              php "$SOURCE_DIR/tests/unit/package-physical-locator-contract.php"
              php "$SOURCE_DIR/tests/unit/update-schema-authority-contract.php"
              ;;
          esac
          echo "VERSION_AND_V2_CONTRACTS=PASS"

      - name: Build deterministic package and runtime authority
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/out
          if [ "$COMPONENT" = "OPS" ]; then
            python3 "$SOURCE_DIR/.github/release/build-ops-package.py"               --source "$SOURCE_DIR"               --output "/tmp/out/vf-tools-ops_V$VERSION.zip" > /tmp/meta.json
          else
            python3 - "$SOURCE_DIR" "$COMPONENT" "$VERSION" <<'PY'
          import hashlib,json,re,sys,zipfile
          from pathlib import Path
          repo=Path(sys.argv[1]); component=sys.argv[2]; version=sys.argv[3]
          epoch=(1980,1,1,0,0,0)
          if component=="THEME":
              src=repo/"src"; top="vf-tools-theme"; main="style.css"; asset=Path(f"/tmp/out/vf-tools-theme_V{version}.zip")
              def runtime(rel):
                  p=rel.split("/")
                  return (len(p)==1 and (rel=="style.css" or rel.lower().endswith(".php"))) or (len(p)>1 and p[0] in {"inc","assets","config","languages","template-parts","templates"})
          else:
              src=repo/"src"; top="vf-tool-m3u8"; main="vf-tool-m3u8.php"; asset=Path(f"/tmp/out/vf-tools-m3u8_V{version}.zip")
              def runtime(rel):
                  base=rel.split("/")[-1].lower(); p=rel.split("/")
                  if base in {"readme.md","changelog.md","license","license.txt","package_profile.json"}: return False
                  if re.search(r"\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$",rel,re.I): return False
                  return (len(p)==1 and rel in {"vf-tool-m3u8.php","uninstall.php","plugin-manifest.json","tool-settings.schema.json"}) or (len(p)>1 and p[0] in {"admin","config","includes","public","templates","tools"})
          files=[]
          for p in sorted(src.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(src).as_posix()
              if p.is_symlink(): raise SystemExit("symlink:"+rel)
              if re.search(r"(^|/)(\.git|\.github|tests?|docs?|evidence|private)(/|$)",rel,re.I): raise SystemExit("dev:"+rel)
              if re.search(r"\.(sql|sqlite|sqlite3|db|log|tar|gz)$",rel,re.I) or re.search(r"(^|/)\.env(?:\.|$)|(^|/)wp-config\.php$",rel,re.I): raise SystemExit("forbidden:"+rel)
              files.append((rel,p.read_bytes()))
          with zipfile.ZipFile(asset,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in files:
                  zi=zipfile.ZipInfo(f"{top}/{rel}",epoch); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16
                  z.writestr(zi,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(asset) as z:
              names=[n for n in z.namelist() if not n.endswith("/")]
              if not names or any(not n.startswith(top+"/") for n in names): raise SystemExit("root")
              if f"{top}/{main}" not in names: raise SystemExit("main")
              if any(n.startswith(top+"/"+top+"/") for n in names): raise SystemExit("double")
          rows=[(rel,hashlib.sha256(data).hexdigest()) for rel,data in files if runtime(rel)]
          canonical="".join(f"{p}\0{h}\n" for p,h in sorted(rows)).encode()
          d={"version":version,"asset_name":asset.name,"asset_bytes":asset.stat().st_size,"asset_sha256":hashlib.sha256(asset.read_bytes()).hexdigest(),"runtime_files":len(rows),"runtime_fingerprint":hashlib.sha256(canonical).hexdigest(),"package_slug":top,"root_contract":"PASS_SINGLE_ROOT"}
          Path("/tmp/meta.json").write_text(json.dumps(d,sort_keys=True)+"\n")
          print(json.dumps(d,sort_keys=True))
          PY
          fi
          jq -e '.asset_bytes>0 and (.asset_sha256|length)==64 and .runtime_files>0 and (.runtime_fingerprint|length)==64' /tmp/meta.json
          unzip -tq "/tmp/out/$(jq -r '.asset_name' /tmp/meta.json)" >/dev/null
          cat /tmp/meta.json
          echo "PACKAGE_RUNTIME_AUTHORITY=PASS"

      - name: Release candidate summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "FULL_SURFACE_DENOMINATOR=34"
          echo "NO_REQUIRED_GATE_MISSING=YES"
          echo "NO_UNKNOWN_APPLICABILITY=YES"
          echo "V2_RELEASE_CANDIDATE_GATE=PASS"
