name: TEMP S01-C02 Ops 1.21.829 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121829-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121829-update-channel-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_BASE: 54918d338b88c71897f6d937e35815441b9ec286
      UPDATE_COMMIT: 6c2c05a78b565b1fd44c6a9ab5ef84722d460231
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_COMMIT: c02a0d9bec85207669192ea242d44ad756c96fa4
      PRODUCT_TREE: be2d1c90f63e047232a44f9d12724f071aea36bd
      ASSET: vf-tools-ops_V1.21.829.zip
      SHA256: af259746eda2041e434428c4d5c60ea2a214691a30035c73d876abc92b9486fa
      BYTES: '3254024'
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$UPDATE_REPO/compare/$UPDATE_BASE...$UPDATE_COMMIT")"
          test "$(jq -r .status <<<"$C")" = ahead
          test "$(jq '.files|length' <<<"$C")" = 1
          test "$(jq -r '.files[0].filename' <<<"$C")" = projects/S01-C02.json
          M=updates/projects/S01-C02.json
          test "$(jq -r .target_version "$M")" = 1.21.829
          test "$(jq -r '.from_versions|join(",")' "$M")" = 1.21.828
          test "$(jq -r .release_tag "$M")" = v1.21.829
          test "$(jq -r .asset_name "$M")" = "$ASSET"
          test "$(jq -r .asset_bytes "$M")" = "$BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$SHA256"
          test "$(jq -r .runtime_files "$M")" = 911
          test "$(jq -r .runtime_fingerprint "$M")" = 65507717f28ed34b5459c19e54e5a72383531d6aef1d04ba41369820362f4f4e
          REL="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/v1.21.829")"
          test "$(jq -r .target_commitish <<<"$REL")" = "$PRODUCT_COMMIT"
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq -r '.assets[]|select(.name==env.ASSET)|.size' <<<"$REL")" = "$BYTES"
          test "$(jq -r '.assets[]|select(.name==env.ASSET)|.digest' <<<"$REL")" = "sha256:$SHA256"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$PRODUCT_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$PRODUCT_TREE"
          done
      - name: Verify direct Production remains 1.21.828 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness)"
          test "$(jq -r .pluginVersion <<<"$J")" = 1.21.828
          test "$(jq -r .sourceRecoveryJobStatus <<<"$J")" = done
          test "$(jq -r .sourceRecoveryJobMode <<<"$J")" = inspect_only
          test "$(jq -r .sourceRecoveryJobInspectionComplete <<<"$J")" = true
          test "$(jq -r .candidatePackageReady <<<"$J")" = false
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = false
          test "$(jq -r .sourceArtifactAvailable <<<"$J")" = true
          test "$(jq -r .finalOnlinePass <<<"$J")" = NO
      - name: Verify update authority and runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          U="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$UPDATE_REPO/git/ref/heads/main")"
          test "$(jq -r .object.sha <<<"$U")" = "$UPDATE_BASE"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      - name: Seal result
        run: echo PASS_V121829_UPDATE_CHANNEL_GATE
