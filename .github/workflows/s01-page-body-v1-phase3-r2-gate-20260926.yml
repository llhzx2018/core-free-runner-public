name: S01 Page Body V1 Phase 3 R2 Residue Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-phase3-r2-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-phase3-r2-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: f2f67272b747769afd93360fa8ebb73399f53efa
      THEME_SHA: c86befea8e183ffd6d2eb91a3e15245cbe52786a
      M3U8_SHA: 26a2eea5c21bdea964576f6aee87803d2f44a13a
    steps:
      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Exact SHAs
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"

      - name: Phase 3 residue contracts
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-page-body-system-v1-phase3-residue-contract.php
          php theme/tests/s01-c01-page-body-system-v1-phase3-residue-contract.php
          php m3u8/tests/s01-c03-page-body-system-v1-phase3-residue-contract.php

      - name: Phase 3 R1 regressions
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-page-body-system-v1-phase3-contract.php
          php theme/tests/s01-c01-page-body-system-v1-phase3-contract.php
          php m3u8/tests/s01-c03-page-body-system-v1-phase3-contract.php

      - name: Full Page Body regressions
        run: |
          set -Eeuo pipefail
          for f in ops/tests/s01-c02-page-body-system-v1-*.php; do php "$f"; done
          for f in theme/tests/s01-c01-page-body-system-v1-*.php; do php "$f"; done
          for f in m3u8/tests/s01-c03-page-body-system-v1-*.php; do php "$f"; done
