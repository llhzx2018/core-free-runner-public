name: S01-C02 1.21.1055 Quality visual candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 73df70bde5a3004b8eb91299faf163241e1e3b0c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sodium, mbstring

      - name: Exact source and structural contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "73df70bde5a3004b8eb91299faf163241e1e3b0c"
          test "$(cat target/VERSION)" = "1.21.1055"
          grep -F "Version: 1.21.1055" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211054-quality-center-visual-hierarchy-contract.php
          php target/tests/s01-c02-1211053-quality-task-compact-contract.php
          php target/tests/s01-c02-1211052-quality-center-flat-contract.php
          php target/tests/s01-c02-1211051-source-real-run-contract.php
          php target/tests/s01-c02-1211050-source-production-visual-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l > evidence/php-lint.txt
          printf '%s\n' "$(git -C target rev-parse HEAD^{tree})" > evidence/source-tree.txt
          echo SOURCE_CONTRACTS=PASS

      - name: Browser visual hierarchy proof
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/quality-node
          cd /tmp/quality-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/quality-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211054-quality-center-visual-hierarchy-browser-proof.js > evidence/quality-visual-browser.json
          node target/tests/s01-c02-1211053-quality-task-compact-browser-proof.js > evidence/quality-compact-browser.json
          cat evidence/quality-visual-browser.json
          cat evidence/quality-compact-browser.json
          jq -e '.pass==true' evidence/quality-visual-browser.json
          jq -e '.pass==true' evidence/quality-compact-browser.json

      - name: Build candidate package
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1055.zip" > evidence/package.json
          unzip -tq "$RUNNER_TEMP/vf-tools-ops_V1.21.1055.zip" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('evidence/package.json').read_text())
          assert p.get('asset_sha256')
          assert p.get('asset_bytes',0)>0
          assert p.get('runtime_files',0)>0
          print('PACKAGE=PASS')
          PY

      - name: Write evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def readj(p):
              p=Path(p)
              if not p.exists(): return {}
              try:return json.loads(p.read_text())
              except Exception:return {}
          v=readj('evidence/quality-visual-browser.json')
          c=readj('evidence/quality-compact-browser.json')
          pkg=readj('evidence/package.json')
          proof={
            'schema':'vf-s01-c02-quality-final-proof/v1',
            'source_sha':'73df70bde5a3004b8eb91299faf163241e1e3b0c',
            'source_tree':Path('evidence/source-tree.txt').read_text().strip() if Path('evidence/source-tree.txt').exists() else '',
            'version':'1.21.1055',
            'contracts':'PASS' if Path('evidence/php-lint.txt').exists() else 'NOT_PROVEN',
            'browser_visual_hierarchy':'PASS' if v.get('pass') is True else 'NOT_PROVEN',
            'browser_compact_task':'PASS' if c.get('pass') is True else 'NOT_PROVEN',
            'asset_sha256':pkg.get('asset_sha256',''),
            'asset_bytes':pkg.get('asset_bytes',0),
            'runtime_files':pkg.get('runtime_files',0),
            'runtime_fingerprint':pkg.get('runtime_fingerprint',''),
            'production':'NOT_TOUCHED',
            'owner_product_pass':False
          }
          proof['status']='PASS' if all(proof[k]=='PASS' for k in ['contracts','browser_visual_hierarchy','browser_compact_task']) and proof['asset_sha256'] else 'FAIL'
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          if proof['status']!='PASS': raise SystemExit(1)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211055-quality-final-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
