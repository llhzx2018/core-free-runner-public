name: P04 VF Infra V2.5.8 Probe Manifest Prep

on:
  push:
    paths:
      - '.github/workflows/p04-v258-probe-manifest-prep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VF_RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Download sealed expected Production Source Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_TOKEN"
          OUT="$RUNNER_TEMP/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/517422532 -o "$OUT"
          test -s "$OUT"
      - name: Upload sealed manifest before validation
        uses: actions/upload-artifact@v4
        with:
          name: P04-V258-Sealed-Production-Source-Manifest
          path: ${{ runner.temp }}/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt
          if-no-files-found: error
          retention-days: 1
      - name: Validate sealed expected Production Source Manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt"
          test "$(stat -c %s "$OUT")" = '16475'
          test "$(sha256sum "$OUT" | awk '{print $1}')" = '8d0a17c66afd142bfcde69e861d77c9e59487bdc835f4735db9224d7ae6d22b2'
          grep -Fq $'# version\t2.5.8' "$OUT"
          grep -Fq $'# schema\t14' "$OUT"
          grep -Fq $'# file_count\t163' "$OUT"
          grep -Fq $'# manifest_sha256\t4b4b52a5b0651aeca41433730fa53bbd96392524b6face44940f2405cf864203' "$OUT"
          echo 'P04_V258_SEALED_MANIFEST_VALIDATION_PASS'
