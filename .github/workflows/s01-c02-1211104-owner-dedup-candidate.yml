name: S01 C02 Recovery Owner Diagnostic Dedup Candidate
on:
  push:
    branches: [task/s01-c02-1211104-owner-dedup-20261012]
permissions:
  contents: read
jobs:
  owner-dedup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 2fcf6f96ea895a971bced46f0960585b167e342d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact origin and PHP contracts
        run: |
          test "$(git -C product rev-parse HEAD)" = 2fcf6f96ea895a971bced46f0960585b167e342d
          test "$(cat product/VERSION)" = 1.21.1103
          php -l product/includes/recovery/service.php
          php -l product/includes/admin-v13/views/system_recovery.php
          php -l product/tests/s01-c02-1211104-recovery-owner-issue-dedup-proof.php
          php product/tests/s01-c02-1211104-recovery-owner-issue-dedup-proof.php
      - name: Provision disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Existing recovery, diagnostics and dangerous dialog regressions
        working-directory: product
        run: |
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          node tests/s01-c02-1211100-recovery-dialog-layout-browser-proof.js
          php tests/s01-c02-1211103-recovery-seed-verified-model-proof.php
          echo S01_C02_RECOVERY_OWNER_ISSUE_DEDUP_CANDIDATE_PASS
