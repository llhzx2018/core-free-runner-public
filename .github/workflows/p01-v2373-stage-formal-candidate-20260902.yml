name: P01 V2.37.3 Stage Formal Candidate
on:
  push:
    branches: [release/p01-v2373-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2373-stage-formal-candidate-20260902.yml
      - scripts/p01-v2373-stage-formal-candidate-20260902.sh
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2373-formal-candidate-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2373-hotfix-20260902
          path: runner
      - name: Stage candidate
        shell: bash
        run: bash runner/scripts/p01-v2373-stage-formal-candidate-20260902.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2373-stage-${{ github.run_id }}
          path: |
            /tmp/p01-v2373-stage-verdict.txt
            /tmp/p01-v2373-stage-files.txt
          if-no-files-found: warn
          retention-days: 90
