name: P04 Cross Detail Human Language Audit

on:
  push:
    branches:
      - audit/p04-cross-detail-human-language-20260830

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: 8c9a2fdb9c159b0b4550a2b2ad89f122204bf827
      EVIDENCE: ${{ github.workspace }}/evidence-cross-detail-language
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify private read
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P04 Current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify exact source and install Chromium
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.8.11'
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Fresh-install cross-detail human-language probe
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          WEB="$RUNNER_TEMP/p04-cross-detail-language-runtime"
          python3 product/scripts/build-release-tree.py "$WEB" >"$EVIDENCE/build.json"
          PORT=19054
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$EVIDENCE/php-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .1; done
          EVIDENCE="$EVIDENCE" CANDIDATE="$CANDIDATE" WEB_ROOT="$WEB" PRODUCT_ROOT="$GITHUB_WORKSPACE/product" VF_E2E_BASE_URL="http://127.0.0.1:$PORT" node scripts/p04-cross-detail-human-language-audit-20260830.mjs
          grep -Fq '"status": "PASS"' "$EVIDENCE/P04_CROSS_DETAIL_HUMAN_LANGUAGE_AUDIT.json"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P04-CROSS-DETAIL-HUMAN-LANGUAGE-AUDIT-${{ env.CANDIDATE }}
          path: evidence-cross-detail-language/
          if-no-files-found: warn
          retention-days: 7
