name: P05 V1.1.1 Candidate Metadata Write

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.1-candidate-metadata-write.yml'

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: llhzx2018/vf-seo
      TARGET_BRANCH: fix/p05-v1.1.1-cloudpanel-root-entry-20260830
      TARGET_VERSION: 1.1.1
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release write token
        shell: bash
        run: test -n "$GH_TOKEN" || { echo TOKEN_MISSING; exit 78; }

      - name: Checkout P05 candidate branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update candidate authority metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('VF_PROJECT.json')
          p=json.loads(path.read_text())
          p['status']='V1.1.1_RELEASE_CANDIDATE / CLOUDPANEL_ROOT_FIX / PRODUCTION_NOT_DEPLOYED'
          p['version']='1.1.1'
          p['target_version']='1.1.1'
          p['working_version']='1.1.1'
          p['version_change']=True
          p['working_branch']='fix/p05-v1.1.1-cloudpanel-root-entry-20260830'
          p['candidate_authorization']='CONTINUOUS_CHAIN_AUTHORIZED'
          p['release_authorization']='PENDING_MACHINE_GATE'
          p['production_deployment_authorization']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          p['next_action']='V1.1.1 CLOUDPANEL ROOT-ENTRY FIX -> EXACT SOURCE MACHINE GATE -> FORMAL PATCH RELEASE; PRODUCTION REMAINS NOT_DEPLOYED'
          p['v1_1_1_cloudpanel_root_fix']={
            'state':'RELEASE_CANDIDATE',
            'reported_issue':'V1.1.0 FULL extracted at CloudPanel site root had no root index.php',
            'root_entry':'index.php',
            'root_assets':'assets/',
            'hardened_root':'php/public',
            'runtime_version_authority':'VERSION',
            'runtime_config':'$HOME/.config/vf-seo/runtime.env',
            'private_data':'$HOME/.local/share/vf-seo',
            'production_state':'NOT_DEPLOYED'
          }
          path.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          if git diff --cached --quiet; then
            echo P05_V111_METADATA_NOOP=PASS
          else
            git commit -m 'fix(P05): stage V1.1.1 CloudPanel release metadata'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo P05_V111_METADATA_WRITE=PASS
