name: TEMP S01-C02 Ops 1.21.810 Candidate Gate
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121810-candidate-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_COMMIT: f07006b4314f77365994a1cb34f8fa5009ed9205
      TARGET_TREE: 66f26050c2c9b4495297a684895f8ae1c6a715ff
      BASE_COMMIT: e4c5fc3dece349ca23f0fea361d55709d4b3f82c
      VERSION: 1.21.810
      ASSET_NAME: vf-tools-ops_V1.21.810.zip
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f07006b4314f77365994a1cb34f8fa5009ed9205
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify live authority and exact scope
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          for b in main develop; do
            sha="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$TARGET_REPOSITORY/branches/$b" | jq -r '.commit.sha')"
            test "$sha" = "$BASE_COMMIT"
          done
          git -C ops diff --name-only "$BASE_COMMIT" "$TARGET_COMMIT" | sort >/tmp/changed.txt
          printf '%s\n' '.github/phase3/v121810-static-source-pointer-recovery.php' 'VERSION' 'includes/site-release/s01-static-boundary-reconciler.php' 'vf-ops.php' | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git -C ops diff "$BASE_COMMIT" "$TARGET_COMMIT" -- includes/site-release/s01-static-boundary-reconciler.php | grep '^+' | grep -v '^+++' >/tmp/runtime-added.txt || true
          ! grep -E '(update_post_meta|delete_post_meta|wp_insert_post|wp_delete_post|activate_plugin|deactivate_plugins|create_candidate_from_inspection|vf_m3u8_|seed_migration|seed_can_delete|wpvivid|jd\.gg|dns_write|update_option\([^,]*plugin)' /tmp/runtime-added.txt
          grep -Fq "current_user_can('manage_options')" /tmp/runtime-added.txt
          grep -Fq "'project_id'] ?? '') !== 'S01'" /tmp/runtime-added.txt
          grep -Fq "'component_id'] ?? '') !== 'S01-C02'" /tmp/runtime-added.txt
          grep -Fq "'authorityFinalHost'] ?? '') !== 'https://ilovem3u8.com'" /tmp/runtime-added.txt
          grep -Fq "ACTIVE_JOB_NOT_FAILED_CANDIDATE" /tmp/runtime-added.txt
          grep -Fq "AMBIGUOUS_TRUSTED_INSPECTION_SOURCE" /tmp/runtime-added.txt
          grep -Fq "SOURCE_HASH_AUTHORITY_MISSING" /tmp/runtime-added.txt
          grep -Fq "SOURCE_POINTER_READBACK_MISMATCH" /tmp/runtime-added.txt
          grep -Fq "vf_ops_s01_static_source_pointer_option_names_v121810(200)" /tmp/runtime-added.txt
          echo SOURCE_IDENTITY_SCOPE_CONTRACT=PASS
      - name: PHP lint and focused recovery regression
        run: |
          set -Eeuo pipefail
          find ops -path 'ops/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/php-lint.txt
          php ops/.github/phase3/v121810-static-source-pointer-recovery.php | tee /tmp/focused.txt
          grep -Fxq PASS_V121810_STATIC_SOURCE_POINTER_RECOVERY /tmp/focused.txt
          grep -Fq ' * Version: 1.21.810' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.810" ops/vf-ops.php
          grep -Fq "VF_OPS_ROUND', 'STATIC-SOURCE-POINTER-RECOVERY-V1'" ops/vf-ops.php
          echo PHP_AND_FOCUSED_CONTRACT=PASS
      - name: Build deterministic candidate artifact and emit authority
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET_NAME'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          m={'asset_bytes':z.stat().st_size,'asset_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          print('ARTIFACT_AUTHORITY='+json.dumps(m,separators=(',',':')))
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          unzip -p "/tmp/release/$ASSET_NAME" vf-ops/vf-ops.php | grep -Fq ' * Version: 1.21.810'
          unzip -p "/tmp/release/$ASSET_NAME" vf-ops/includes/site-release/s01-static-boundary-reconciler.php | grep -Fq 'vf_ops_s01_static_source_pointer_recover_v121810'
          echo PASS_V121810_CANDIDATE_GATE
