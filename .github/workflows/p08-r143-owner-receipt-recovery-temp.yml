name: P08 R143 old Owner receipt 966KiB rootless recovery (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r143-owner-receipt-recovery-temp.yml]
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: PHP8.4 source-compatible rootless CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: posix,mbstring,zip,sqlite3,pdo_sqlite,pdo_mysql
          coverage: none
      - name: Transient exact private P08 R143 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 7452ccadb06aa0554487fe6c683f6ddfffff8519
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Original test suite with realistic big receipt and tamper negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = "7452ccadb06aa0554487fe6c683f6ddfffff8519"
          test "$(id -u)" -ne 0
          php -l p08/src/Upgrade/R127OwnerCycleHandoff.php >/dev/null
          php -l p08/tests/test_r127_owner_cycle_handoff.php >/dev/null
          php p08/tests/test_r127_owner_cycle_handoff.php > "$RUNNER_TEMP/p08-r143-php.log" 2>&1 || { tail -n 22 "$RUNNER_TEMP/p08-r143-php.log"; exit 1; }
          grep -Fxq 'P08_R143_966K_RECEIPT_AND_HISTORY=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          grep -Fxq 'P08_R143_OVERSIZE_REFUSED_BEFORE_WRITE=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          grep -Fxq 'P08_R143_TAMPERED_REFUSED_BEFORE_WRITE=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          grep -Fxq 'P08_R127_LOSSLESS_HISTORY_AND_BACKUP_PRESERVATION=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          grep -Fxq 'P08_R127_BUSY_MAINTENANCE_BACKUP_TAMPER_AND_REPLAY_REFUSED=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          grep -Fxq 'P08_R127_AFTER_RENAME_CRASH_EXPLICIT_RECOVERY=PASS' "$RUNNER_TEMP/p08-r143-php.log"
          echo P08_R143_ROOTLESS_966K_AND_2M_BOUNDS_HASH_BACKUP_CRASH=PASS
      - name: Always purge transient private source and fixtures
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$RUNNER_TEMP/p08-r143-php.log"
