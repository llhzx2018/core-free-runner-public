name: S01-C02 1.21.918 R29 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 270ea9f63b64f22772da850dfe268ea9a855d171
      BASE_SHA: d1ea6fc9459340a3592d8510403b51c2271e33f2

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 270ea9f63b64f22772da850dfe268ea9a855d171
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R29 surface transparency
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.918"
          grep -Fq 'S01-FINAL-SURFACE-TRANSPARENCY-R29' ops/vf-ops.php
          php ops/tests/s01-c02-121918-final-surface-transparency-r29-contract.php
          php -l ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php >/dev/null
          php -l ops/includes/s01/v6-landing-shell.php >/dev/null
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-v6-shell-r1.css             includes/s01/v6-landing-shell.php             includes/views/admin-shell-tabs-parts/02-shell-navigation.php             tests/s01-c02-121918-final-surface-transparency-r29-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          nav=Path('ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php').read_text(encoding='utf-8')
          css=Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8')
          assert nav.count('vf_ops_v13_render_compat_route_directory_v121918($route)') >= 1
          assert 'migration_evidence' in nav
          assert '兼容 / 历史入口' in nav
          assert css.count('{')==css.count('}')
          assert 'R29 · Compatibility surface transparency' in css
          assert '.vf-v13-compat-directory' in css
          print('PASS_R29_SURFACE_TRANSPARENCY')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"
          echo PASS_S01_C02_121918_R29_PREMERGE
