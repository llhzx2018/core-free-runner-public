name: P08 R128 official forward metadata exact private source (temporary)
on:
  pull_request:
    paths: [.github/workflows/p08-r128-forward-temp.yml]
permissions:
  contents: read
jobs:
  source-bound:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: PHP 8.4 tests with posix
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: posix,sqlite3,pdo_sqlite
      - name: Transient read-only checkout exact private PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: bbc3753e188befc33bec074a1c86f97ff231e90a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Readonly next Release and existing history fault regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-source"' EXIT
          cd p08-source
          test "$(git rev-parse HEAD)" = bbc3753e188befc33bec074a1c86f97ff231e90a
          php -l src/Upgrade/R128OfficialForwardMetadata.php
          php -l src/Upgrade/R128OfficialForwardDiscovery.php
          php -l src/Upgrade/OwnerReleaseDiscovery.php
          php -l tests/test_r128_official_forward_metadata.php
          php tests/test_r128_official_forward_metadata.php
          php tests/test_r127_owner_cycle_handoff.php
          php tests/test_r126_installed_013_source.php
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_owner_release_discovery_controller.php
          # Architecture gate requires a separate GOV-DOC root and exact base/head.
          # It is intentionally not claimed by this isolated PHP fixture runner.
          echo P08_R128_SOURCE_BOUND_NEXT_RELEASE_AND_FORWARD_ROUTE=PASS
      - name: Always purge private sources
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-source"
