name: P07 Release18 Authority Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release18-authority-readback.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7b9a72068066cc2fe92e3ae14c93e7ebd10d7b4d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release18 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7b9a72068066cc2fe92e3ae14c93e7ebd10d7b4d'
          test "$(cat BUILD_ID)" = '0.1.0-release18'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null
          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release18' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = f618aad35da7df05fb298455be186691d4b5362b' docs/authority/CURRENT.md
          grep -Fq 'Release18 Distribution Gate           36813781522 PASS' docs/authority/CURRENT.md
          grep -Fq '| B50 | Restore-As Target Nginx Listener Discovery |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE18_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md
          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release18'
          assert slot3['source_main_commit']=='26e9235edd92d34d4837abe3a1876a8d78a2e555'
          assert slot3['nginx_listener_contract']=='TARGET_SERVER_BLOCK_ACTUAL_LISTENERS_V1'
          release=p['release']
          assert release['slot3_build']=='0.1.0-release18'
          assert release['public_distribution_commit']=='f618aad35da7df05fb298455be186691d4b5362b'
          assert release['runtime_manifest_blob']=='a7ae163c8c6ddbe402ad04797098e321d8f42e64'
          assert release['overlay_manifest_blob']=='4cce8bcf9b91452359dba6c5175f8fc1582ed6fe'
          assert release['final_installer_blob']=='3e5e6bf4cfbbf1232d3a28f9696efb29430d234c'
          assert release['stable_installer_blob']=='e5c38062d6c4d821e303c4caebfb103c6517d085'
          assert release['toolbox_blob']=='143e5fbc28adfa05c61248829e5f56540823643b'
          prod=p['production']
          assert prod['slot3_build']=='0.1.0-release14'
          assert prod['release17_restore_evidence']['status']=='REAL_FAIL_FIXED_LOOPBACK_HTTP_ROUTE'
          assert prod['release18_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert prod['release18_owner_real_use']=='PENDING'
          assert prod['migration_executed'] is False
          assert prod['dns_write'] is False
          assert prod['source_delete'] is False
          assert 'source_candidate' not in p
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE18_AUTHORITY_SOURCE=7b9a72068066cc2fe92e3ae14c93e7ebd10d7b4d'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
