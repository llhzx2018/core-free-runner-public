name: P07 System Care RC12 Final Freeze Gate

on:
  push:
    branches:
      - gate/p07-system-care-rc12-final-freeze-20260909
    paths:
      - '.github/workflows/p07-system-care-rc12-final-freeze.yml'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout freeze gate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact RC12 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30d7e55582fa94f419c2d74bface117896751c9e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Lock identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 30d7e55582fa94f419c2d74bface117896751c9e
          test "$(cat product/modules/system-care/VERSION)" = 0.1.0-rc12
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='3c120333051561d7aa21c3a569d8a4d295593375'" installers/p07-system-care.sh
          echo P07_SYSTEM_CARE_RC12_FREEZE_IDENTITY=PASS

      - name: Verify package equals exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg=packages/p07-system-care/0.1.0-rc12
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 3c120333051561d7aa21c3a569d8a4d295593375
          test "$(wc -l < "$pkg/MANIFEST.gitblob" | tr -d '[:space:]')" = 17
          while read -r expected path; do
            test -n "$expected"
            test -n "$path"
            test -f "$pkg/$path"
            test -f "product/modules/system-care/$path"
            test "$(git hash-object "$pkg/$path")" = "$expected"
            test "$(git -C product hash-object "modules/system-care/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          echo P07_SYSTEM_CARE_RC12_EXACT_SOURCE_PACKAGE=PASS

      - name: Re-run exact source static and functional gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh
          bash modules/system-care/tests/functional_gate.sh
          echo P07_SYSTEM_CARE_RC12_SOURCE_REGRESSION=PASS

      - name: Fresh install from permanent raw main
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/p07-system-care.sh
          grep -Fq "VERSION='0.1.0-rc12'" /tmp/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='3c120333051561d7aa21c3a569d8a4d295593375'" /tmp/p07-system-care.sh
          sudo bash /tmp/p07-system-care.sh status >/tmp/status.out
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc12
          sudo test -x /opt/vf-system-care/intrusion-evidence-entry.sh
          sudo test -f /opt/vf-system-care/lib/intrusion_discovery.py
          echo P07_SYSTEM_CARE_RC12_RAW_MAIN_FRESH_INSTALL=PASS

      - name: Permanent Toolbox route smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o /tmp/p07-toolbox.sh
          bash -n /tmp/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' /tmp/p07-toolbox.sh
          grep -Fq '4. 系统维护 / 安全' /tmp/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init6"' /tmp/p07-toolbox.sh
          echo P07_SYSTEM_CARE_RC12_PERMANENT_TOOLBOX_ROUTE=PASS

      - name: Read-only smoke after install
        shell: bash
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 /usr/local/bin/vf-system-care --help >/tmp/help.out
          grep -Fq 'evidence [menu|status|enable|scan|report|rebaseline|disable|refresh-cache]' /tmp/help.out
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care audit >/tmp/audit.out
          grep -Fq 'P07 · 一键系统体检' /tmp/audit.out
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care security >/tmp/security.out
          grep -Fq '只检查，不修改 SSH' /tmp/security.out
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence status >/tmp/evidence.out || true
          grep -Eq '网站安全   (未开启|正常|需查看|检查失败)' /tmp/evidence.out
          echo P07_SYSTEM_CARE_RC12_READ_ONLY_SMOKE=PASS

      - name: Freeze boundary assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'DNS automatic mutation' product/modules/system-care/vf-system-care.sh || true
          if grep -REn --exclude-dir=tests --include='*.sh' '(ufw[[:space:]]+(enable|allow|deny|delete)|systemctl[[:space:]]+reboot|^[[:space:]]*reboot([[:space:]]|$))' product/modules/system-care; then
            echo 'FAIL: automatic firewall/reboot mutation found' >&2
            exit 1
          fi
          echo P07_SYSTEM_CARE_RC12_FREEZE_BOUNDARY=PASS

      - name: Final freeze marker
        shell: bash
        run: |
          echo P07_SYSTEM_CARE_RC12_FINAL_FREEZE_GATE=PASS
