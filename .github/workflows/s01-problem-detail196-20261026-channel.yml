name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-problem-detail196-channel-20261026]
    paths: ['.github/workflows/s01-problem-detail196-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.196
  TARGET_SHA: dbd8152792fd5a064d148672d5e415e088b7c38f
  UPDATE_SHA: f7241416315bf47be6d1ea6cf98eb71a479a8ab3
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: f7241416315bf47be6d1ea6cf98eb71a479a8ab3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-problem-detail196-20261026/channel-spec.json --input control/.github/workflows/s01-problem-detail196-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 690cf4d8603bebe752047b3583cdd4fbc5a5bec1 f7241416315bf47be6d1ea6cf98eb71a479a8ab3)" = projects/S01-C01.json
          git -C source diff --exit-code 690cf4d8603bebe752047b3583cdd4fbc5a5bec1 f7241416315bf47be6d1ea6cf98eb71a479a8ab3 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='c0c7df3116b7a2cb3fdd8b90a7e5940aad172aade9b24016fb4ec8341feaebd3' and m['asset_bytes']==2001488
          assert m['runtime_files']==476 and '1.35.195' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
