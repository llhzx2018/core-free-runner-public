name: P01 V2.25 Main Authority Reconcile
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-main-authority-reconcile-20260828.yml']
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      REPO: llhzx2018/vf-start
      BRANCH: release/p01-v2.25.0-20260828
      OLD_RELEASE: 92c68ceae9af9e802017043478d37c5512cb3941
      OLD_TREE: 5db9ee2c6a7e58d44e40772cd5658fe4b85a87c1
      MAIN: 6f1cb9c3606d7ca4c92276852391d55280622d66
      OLD_MAIN: c299c313559bbb4f58d9a7180fb482fae7ced67a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.REPO }}
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify docs-only main closure
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_RELEASE"
          test "$(git rev-parse HEAD^{tree})" = "$OLD_TREE"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git diff --name-only "$OLD_MAIN..$MAIN" | sort | paste -sd, -)" = 'VF_PROJECT.json,docs/authority/CURRENT.md'
          test -z "$(git diff --name-only "$OLD_MAIN..$MAIN" -- src)"
      - name: Reconcile ancestry without runtime or candidate-authority drift
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          set +e
          git merge --no-ff --no-commit "$MAIN"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            git checkout "$OLD_RELEASE" -- VF_PROJECT.json docs/authority/CURRENT.md
            git add VF_PROJECT.json docs/authority/CURRENT.md
          else
            git checkout "$OLD_RELEASE" -- VF_PROJECT.json docs/authority/CURRENT.md
            git add VF_PROJECT.json docs/authority/CURRENT.md
          fi
          test -z "$(git diff --cached "$OLD_RELEASE" -- src)"
          test -z "$(git diff --cached "$OLD_RELEASE" -- VF_PROJECT.json docs/authority/CURRENT.md)"
          git commit -m 'merge(P01): reconcile V2.24 production authority into V2.25 release ancestry'
          NEW=$(git rev-parse HEAD); TREE=$(git rev-parse HEAD^{tree})
          test "$TREE" = "$OLD_TREE"
          git merge-base --is-ancestor "$MAIN" "$NEW"
          git merge-base --is-ancestor "$OLD_RELEASE" "$NEW"
          git push origin HEAD:"$BRANCH"
          echo "P01_V225_RECONCILED_RELEASE=$NEW"
          echo "P01_V225_RECONCILED_TREE=$TREE"
      - name: Verdict
        run: |
          echo P01_V225_MAIN_AUTHORITY_RECONCILE=PASS
          echo RUNTIME_DRIFT=NO
          echo TREE_DRIFT=NO
