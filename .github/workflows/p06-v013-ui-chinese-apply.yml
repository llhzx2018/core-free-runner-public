name: P06 VF Press V0.1.3 Chinese UI Apply

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v013-ui-chinese-apply.txt

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private working branch with registered write capability
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: fix/v013-chinese-ui
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Apply Chinese-first presentation layer
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def patch(path, replacements):
              p=Path(path); s=p.read_text(encoding='utf-8'); old=s
              for a,b in replacements:
                  if a not in s:
                      print(f'WARN missing in {path}: {a[:90]}')
                  s=s.replace(a,b)
              if s==old:
                  raise SystemExit(f'No changes applied: {path}')
              p.write_text(s,encoding='utf-8')

          patch('public/index.php', [
            ('VF Press runtime is not installed.', 'VF Press 运行文件尚未安装。'),
