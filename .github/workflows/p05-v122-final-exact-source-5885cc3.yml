name: P05 V1.2.2 Final Exact Source Gate R2
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-final-exact-source-5885cc3.yml']
permissions:
  contents: read
jobs:
  p05-v122-final-exact-source-r2:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-final-exact-source-5885cc3-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: 5885cc37147ea9450cd648e408c9b2e1ffb4b848
      P05_BASE_MAIN: 909287571f3321ba805d553ebec18887103c2549
      P05_EXACT_TREE: 0822f722244724c666d7aa660634e247436f1c12
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 v1.2.2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source tree and five-file release scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          test "$(git rev-list --count "$P05_BASE_MAIN".."$P05_EXACT_SOURCE")" = 5
          test "$(git rev-list --count "$P05_EXACT_SOURCE".."$P05_BASE_MAIN")" = 0
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE"
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.2_CANDIDATE.md package.json src/client/ProductApp.tsx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          test "$(cat VERSION)" = '1.2.2'
          node - <<'NODE'
          const pkg=require('./package.json');
          const p=require('./VF_PROJECT.json');
          if(pkg.version!=='1.2.2') process.exit(1);
          if(p.project_id!=='P05'||p.version!=='1.2.2'||p.target_version!=='1.2.2'||p.working_version!=='1.2.2') process.exit(1);
          if(p.production_deployment_authorization!=='NOT_AUTHORIZED / OWNER_REQUESTED_VPS_UPDATE_FILE_ONLY') process.exit(1);
          NODE
          grep -F 'P05 · Product Optimization · v1.2.2' src/client/ProductApp.tsx >/dev/null
          grep -F 'RELEASE_AUTHORIZED / FINAL_EXACT_SOURCE_GATE_PENDING / PRODUCTION_DEPLOYMENT_NOT_AUTHORIZED' docs/authority/RELEASE_V1.2.2_CANDIDATE.md >/dev/null
          echo 'P05_V122_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Full Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_V122_ENGINEERING=PASS'
      - name: Update-entry hotfix and cumulative Product truth
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test \
            tests/unit/product-simple-update-ux-truth.test.ts \
            tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-site-load-race-truth.test.ts \
            tests/unit/product-login-workspace-read-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-data-source-capability-truth.test.ts \
            tests/unit/product-search-query-evidence-routing-truth.test.ts \
            tests/unit/product-keyword-page-drilldown-truth.test.ts \
            tests/unit/product-aeo-blocker-page-evidence-truth.test.ts \
            tests/unit/product-settings-truth.test.ts
          node --import tsx --test tests/contract/backend-online-update-v2.test.ts
          npm run test:php-product-parity
          grep -F "document.querySelector('.secondary-nav, .p05v2-secondary')" src/client/UpdateShortcut.tsx >/dev/null
          grep -F 'className="p05v2-secondary"' src/client/ProductApp.tsx >/dev/null
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_V122_PRODUCT_TRUTH=PASS'
      - name: PHP CloudPanel browser and release-package staging
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = '1.2.2'
          node - <<'NODE'
          const p=require('./build/vf-seo-php-release/VF_PROJECT.json');
          if(p.version!=='1.2.2'||p.target_version!=='1.2.2'||p.working_version!=='1.2.2') process.exit(1);
          NODE
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          echo 'P05_V122_PHP_BROWSER_STAGING=PASS'
      - name: Source dependency and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_V122_SOURCE_SECURITY=PASS'
      - name: Seal exact source without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = '1.2.2'
          echo 'P05_V122_FINAL_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo "P05_EXACT_TREE=$P05_EXACT_TREE"
          echo 'P05_RELEASE_AUTHORIZATION=OWNER_AUTHORIZED_V1.2.2'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_TAG_WRITE=0'
          echo 'P05_CORE_UPDATES_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
