name: P01 missing historical backup audit exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247303-missing-audit-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact product source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d2171074ec488d993e49fd03ec59444853c5044d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout previous official source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.302
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Prepare PHP 8.3 and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Focused read-only capacity and preserved backup operations
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = d2171074ec488d993e49fd03ec59444853c5044d
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          node --check src/assets/data-recovery.js
          VF_ISOLATED_TEST_ONLY=1 php tests/unit/backup_missing_history_readonly_audit_native.php
          php tests/unit/backup_storage_capacity_readonly_contract.php
          php tests/unit/backup_status_truth_v247296_contract.php
          php tests/unit/backup_missing_alert_v247297_contract.php
          php tests/unit/backup_upgrade_retention_preview_v247298_contract.php
          php tests/unit/admin_backup_typography_readability_contract.php
          node tests/browser/backup_missing_alert_v247297_smoke.cjs
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          echo P01_BACKUP_MISSING_AUDIT_FOCUSED=PASS
      - name: Canonical exact-source zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_BACKUP_MISSING_AUDIT_CANONICAL=PASS
