name: S01 Theme M3U8 Interaction Distribution Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-theme-m3u8-interaction-distribution-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-theme-m3u8-interaction-distribution-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_MAIN_SHA: a0e045b4be3a8e2eb519cd7183a693e60a5d2db3
      THEME_BRANCH: release/s01-c01-theme-13543-20260925
      THEME_CANDIDATE_SHA: abbec7a87869a8bede245f876c7706be7d4fa70b
      THEME_SOURCE_SHA: df30cc32f3bf44fff320a32a44b6190b355458f8
      M3_BRANCH: release/s01-c03-m3u8-12547-20260925
      M3_CANDIDATE_SHA: 5cf9987c58385a04f3d4e3ac38d2674cdeff93f6
      M3_SOURCE_SHA: aa42bba5ee2b1ff898eed9ebdf41a9707239952f
    steps:
      - name: Credential presence
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"

      - name: Resolve core-updates credential
        id: auth
        shell: bash
        run: |
          set -Eeuo pipefail
          choose=''
          for candidate_name in VF_PRIVATE_READ_TOKEN VF_RELEASE_WRITE_TOKEN; do
            candidate="${!candidate_name:-}"
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $candidate" https://api.github.com/repos/llhzx2018/core-updates || true)"
            if [ "$code" = '200' ]; then choose="$candidate_name"; break; fi
          done
          [ -n "$choose" ] || exit 1
          echo "token_name=$choose" >> "$GITHUB_OUTPUT"

      - name: Fetch exact core-updates refs
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.auth.outputs.token_name }}" = 'VF_PRIVATE_READ_TOKEN' ]; then TOKEN="$VF_PRIVATE_READ_TOKEN"; else TOKEN="$VF_RELEASE_WRITE_TOKEN"; fi
          rm -rf core-updates && mkdir core-updates && cd core-updates
          git init -q
          git remote add origin https://github.com/llhzx2018/core-updates.git
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin             refs/heads/main:refs/remotes/origin/main             refs/heads/$THEME_BRANCH:refs/remotes/origin/theme             refs/heads/$M3_BRANCH:refs/remotes/origin/m3
          test "$(git rev-parse refs/remotes/origin/main)" = "$CORE_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/theme)" = "$THEME_CANDIDATE_SHA"
          test "$(git rev-parse refs/remotes/origin/m3)" = "$M3_CANDIDATE_SHA"

      - name: Exact Theme one-file scope and manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only refs/remotes/origin/main...refs/remotes/origin/theme)" = 'projects/S01-C01.json'
          git checkout --detach refs/remotes/origin/theme
          python3 - <<'PY'
          import json
          p=json.load(open('projects/S01-C01.json',encoding='utf-8'))
          assert p['target_version']=='1.35.43'
          assert p['from_versions']==[f'1.35.{n}' for n in range(8,43)]
          assert p['release_tag']=='v1.35.43'
          assert p['asset_name']=='vf-tools-theme_V1.35.43.zip'
          assert p['asset_bytes']==1742433
          assert p['asset_sha256']=='2cda044f36044e50750a457e4c77aab976d8994736bbc03762d51aa020940b05'
          assert p['runtime_files']==460
          assert p['runtime_fingerprint']=='8463a7a28649d14bd3bdef303e40f585e81445935b82bbc6b337a12988b8a600'
          assert p['released_at']=='2026-09-25T14:38:12Z'
          print('PASS Theme manifest')
          PY
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php

      - name: Exact M3U8 one-file scope and manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only refs/remotes/origin/main...refs/remotes/origin/m3)" = 'projects/S01-C03.json'
          git checkout --detach refs/remotes/origin/m3
          python3 - <<'PY'
          import json
          p=json.load(open('projects/S01-C03.json',encoding='utf-8'))
          assert p['target_version']=='1.25.47'
          assert p['from_versions']==[f'1.25.{n}' for n in range(20,47)]
          assert p['release_tag']=='v1.25.47'
          assert p['asset_name']=='vf-tools-m3u8_V1.25.47.zip'
          assert p['asset_bytes']==3567285
          assert p['asset_sha256']=='6074ba2ec5e77e2e1956d68cce4d70265c06ac77944f353855e967515234daf0'
          assert p['schema_from']=='1.3.0' and p['schema_to']=='1.3.0'
          assert p['runtime_files']==564
          assert p['runtime_fingerprint']=='c0d387a774ae0e5e1c10a51d533bb8d56c27230245b7bd0b211a959959867ca8'
          assert p['runtime_file_count']==564
          assert p['runtime_fingerprint_sha256']==p['runtime_fingerprint']
          assert p['released_at']=='2026-09-25T14:38:50Z'
          print('PASS M3U8 manifest')
          PY
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php

      - name: Live Release metadata matches manifests
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          THEME_JSON="$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.43)"
          M3_JSON="$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.47)"
          python3 - "$THEME_JSON" "$M3_JSON" <<'PY'
          import json,sys
          theme=json.loads(sys.argv[1]); m3=json.loads(sys.argv[2])
          assert theme['target_commitish']=='df30cc32f3bf44fff320a32a44b6190b355458f8'
          assert theme['published_at']=='2026-09-25T14:38:12Z'
          a=[x for x in theme['assets'] if x['name']=='vf-tools-theme_V1.35.43.zip']; assert len(a)==1
          assert a[0]['size']==1742433 and a[0]['digest']=='sha256:2cda044f36044e50750a457e4c77aab976d8994736bbc03762d51aa020940b05'
          assert m3['target_commitish']=='aa42bba5ee2b1ff898eed9ebdf41a9707239952f'
          assert m3['published_at']=='2026-09-25T14:38:50Z'
          a=[x for x in m3['assets'] if x['name']=='vf-tools-m3u8_V1.25.47.zip']; assert len(a)==1
          assert a[0]['size']==3567285 and a[0]['digest']=='sha256:6074ba2ec5e77e2e1956d68cce4d70265c06ac77944f353855e967515234daf0'
          print('PASS live Release metadata')
          PY

      - name: Public manifest secret fence
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          git checkout --detach refs/remotes/origin/theme
          ! grep -RInE '(ghp_|github_pat_|Authorization:[[:space:]]*Bearer|VF_PRIVATE_READ_TOKEN[[:space:]]*=|VF_RELEASE_WRITE_TOKEN[[:space:]]*=)' projects/S01-C01.json
          git checkout --detach refs/remotes/origin/m3
          ! grep -RInE '(ghp_|github_pat_|Authorization:[[:space:]]*Bearer|VF_PRIVATE_READ_TOKEN[[:space:]]*=|VF_RELEASE_WRITE_TOKEN[[:space:]]*=)' projects/S01-C03.json
