name: TEMP P08 S5 Kuma grouped report three-engine regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s5-kuma-grouped-3db-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-s5-kuma-grouped-3db-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: e41d5646c21a6872072f6b459a2d601ec50fac1d
  TARGET_TREE: 71506be97c5542bc4e5e0784df69b58c03860a7a
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s5-kuma-grouped-3db-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source identity and one-off workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s5-kuma-grouped-3db-20261125.json --input .github/workflows/temp-p08-s5-kuma-grouped-3db-20261125.yml > "$RUNNER_TEMP/p08-s5-grouped-audit.log"
          echo P08_S5_KUMA_GROUPED_SPEC_PREFLIGHT=PASS
  grouped-three-databases:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s5-kuma-grouped-3db-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, mysql, mariadb]
    services:
      database:
        image: ${{ matrix.engine == 'mariadb' && 'mariadb:11.8' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: p08_s5_breakdown_disposable_2026
          MYSQL_DATABASE: p08_ci_s5_breakdown
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      GITHUB_ACTIONS: 'true'
      CI: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_KUMA_R21_ENGINE: ${{ matrix.engine }}
      APP_ENV: testing
      APP_KEY: 'base64:UVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVFRUVE='
      DB_HOST: '127.0.0.1'
      DB_PORT: '3306'
      DB_DATABASE: p08_ci_s5_breakdown
      DB_USERNAME: root
      DB_PASSWORD: p08_s5_breakdown_disposable_2026
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Exact transient private S9 candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e41d5646c21a6872072f6b459a2d601ec50fac1d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: transient-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate same real S5 grouped Kuma stats
        shell: bash
        working-directory: transient-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          for file in app/Http/Controllers/TrackerKumaBreakdownController.php app/Modules/Tracker/Actions/SimpleKumaReadAdapter.php app/Http/Controllers/TrackerCenterController.php; do
            php -l "$file" > "$RUNNER_TEMP/p08-s5-grouped-php.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_PHP_LINT=FAIL; exit 1; }
          done
          php -l routes/web.php > "$RUNNER_TEMP/p08-s5-grouped-route.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_ROUTE_LINT=FAIL; exit 1; }
          php -l tests/Feature/TrackerKumaBreakdownTest.php > "$RUNNER_TEMP/p08-s5-grouped-test-lint.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_TEST_LINT=FAIL; exit 1; }
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-s5-grouped-composer.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_COMPOSER=FAIL; exit 1; }
          echo P08_S5_KUMA_GROUPED_LOCKED_COMPOSER=PASS
          # Real Laravel Owner GET requires the Vite manifest on ALL engines.
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-s5-grouped-npm.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_NPM=FAIL; exit 1; }
          npm run typecheck > "$RUNNER_TEMP/p08-s5-grouped-ts.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_TYPECHECK=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-s5-grouped-vite.log" 2>&1 || { echo P08_S5_KUMA_GROUPED_VITE=FAIL; exit 1; }
          echo P08_S5_KUMA_GROUPED_VUE_TYPECHECK_VITE=PASS
          php vendor/bin/phpunit --no-coverage --colors=never --log-junit "$RUNNER_TEMP/p08-s5-grouped-junit.xml" tests/Feature/TrackerKumaBreakdownTest.php > "$RUNNER_TEMP/p08-s5-grouped-feature.log" 2>&1 || {
            echo P08_S5_KUMA_GROUPED_FEATURE=FAIL
            grep -E '^P08_S5_(WORKSPACE_STATUS|BASELINE_HTTP)=' "$RUNNER_TEMP/p08-s5-grouped-feature.log" | head -8 || true
            python3 -c 'import sys,re,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); c=list(r.iter("testcase")); f=[(x.attrib.get("name","UNKNOWN"),next((y for y in x if y.tag in ("failure","error")),None)) for x in c if x.find("failure") is not None or x.find("error") is not None]; print("P08_S5_TEST_COUNTS="+str(len(c))+";failed="+str(len(f))); [print("P08_S5_FAILED_TEST="+n[:90]+";type="+v.attrib.get("type","UNKNOWN")[:90]+";source_line="+(m.group(1) if (m:=re.search(r"TrackerKumaBreakdownTest\.php:(\d+)",v.text or "")) else "UNKNOWN")) for n,v in f[:8]]' "$RUNNER_TEMP/p08-s5-grouped-junit.xml" || echo P08_S5_TEST_DETAILS=NOT_CAPTURED
            exit 1
          }
          echo P08_S5_KUMA_GROUPED_FEATURE=PASS
          if [[ "$P08_KUMA_R21_ENGINE" == sqlite ]]; then
            for test in TrackerCenterWorkflowTest BeMobTrackerWorkflowTest; do
              php vendor/bin/phpunit --no-coverage --colors=never --log-junit "$RUNNER_TEMP/p08-s5-grouped-old-$test.xml" "tests/Feature/$test.php" > "$RUNNER_TEMP/p08-s5-grouped-old-$test.log" 2>&1 || {
                echo "P08_S5_OLD_TRACKER_TEST=$test;status=FAIL"
                python3 -c 'import sys,re,xml.etree.ElementTree as E; root=E.parse(sys.argv[1]).getroot(); cases=list(root.iter("testcase")); failures=[(e.attrib.get("name","UNKNOWN"),next(z for z in e if z.tag in ("failure","error"))) for e in cases if e.find("failure") is not None or e.find("error") is not None]; print("P08_S5_OLD_TEST_COUNTS="+str(len(cases))+";failed="+str(len(failures))); [print("P08_S5_OLD_FAILED_TEST="+name[:85]+";type="+node.attrib.get("type","UNKNOWN")[:80]+";test_line="+(m.group(1) if (m:=re.search(r"Tracker(?:CenterWorkflow|BeMobTrackerWorkflow)Test\\.php:(\\d+)",node.text or "")) else "UNKNOWN")) for name,node in failures[:6]]' "$RUNNER_TEMP/p08-s5-grouped-old-$test.xml" || echo P08_S5_OLD_TEST_DETAILS=NOT_CAPTURED
                exit 1
              }
              echo "P08_S5_OLD_TRACKER_TEST=$test;status=PASS"
            done
            echo P08_S5_EXISTING_TRACKER_REGRESSIONS=PASS
          fi
          echo P08_S5_KUMA_GROUPED_NO_REAL_PROVIDER_OR_PRODUCTION=PASS
      - name: Remove private checkout and synthetic logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- transient-p08
          rm -f -- "$RUNNER_TEMP"/p08-s5-grouped-*.log "$RUNNER_TEMP"/p08-s5-grouped-*.xml
          test ! -e transient-p08
          echo P08_S5_KUMA_GROUPED_PRIVATE_CLEANUP=PASS
