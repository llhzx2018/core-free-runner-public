name: P08 v013 exact candidate source and official v012 origin proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v013-candidate-source.yml
permissions:
  contents: read
jobs:
  source-and-origin:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-candidate-source-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Ephemeral exact P08 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 11f1ca58849e4baf8283c33659863416e48b9c5d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Prepare PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,zip,pdo_sqlite,pdo_mysql,curl,dom
          tools: composer:v2
          coverage: none
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source-exact PHP/Vue TypeScript and build tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = 11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(cat p08/VERSION)" = 0.1.13
          cd p08
          php -l app/Http/Controllers/OwnerFutureUpdateController.php
          php -l src/Upgrade/OwnerFutureAtomicService.php
          php tests/run.php
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 scripts/check_stack_contract.py --phase full
          test -z "$(git diff --name-only)"
          echo P08_V013_EXACT_SOURCE_BASIC=PASS
      - name: Genuine unmodified issued v0.1.12 FULL manifest source readback
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          file="$(mktemp /tmp/p08-v012-official-XXXXXX.zip)"
          mf="$(mktemp /tmp/p08-v012-manifest-XXXXXX.json)"
          trap 'rm -f "$file" "$mf"' EXIT
          curl -fsSL --retry 2 --max-time 90 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/766931640' -o "$file"
          test "$(stat -c %s "$file")" -eq 8363606
          test "$(sha256sum "$file" | cut -d' ' -f1)" = 721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6
          unzip -p "$file" FULL_MANIFEST.json > "$mf"
          python3 - "$mf" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);raw=p.read_bytes();d=json.loads(raw)
          assert d.get('target_version')=='0.1.12',d.get('target_version')
          assert d.get('source_sha')=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
          assert d.get('project_id')=='P08'
          print('P08_OFFICIAL_012_FULL_MANIFEST_SHA256='+hashlib.sha256(raw).hexdigest())
          print('P08_OFFICIAL_012_FULL_SOURCE=VERIFIED_REAL_REMOTE_BYTES')
          PY
      - name: Delete ephemeral private source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
          echo P08_V013_PRIVATE_SOURCE_CLEANUP=PASS
