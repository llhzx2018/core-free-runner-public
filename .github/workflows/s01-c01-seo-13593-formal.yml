name: S01-C01 SEO formal release
on:
  push:
    branches: [task/s01-c01-seo-13593-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.93'
      TARGET_SHA: '50992788a5b306f23d57eac7e478eea99ba4324b'
      TARGET_TREE: '9ddf5a49ea3f915e6f623902a401b9c174bedb3b'
      SOURCE_VERSION: '1.35.92'
      BASE_SHA: '9b45ab43f24b1aea76420060522f0fda96e8c6ca'
      CANDIDATE_RUN: '37409091252'
      CANDIDATE_SHA: '6833e19b00d2c837689dfd6de5ca6b2064c5e715'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-seo-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .shell_header_structure_menu_ia=="PASS" and .header_responsive_fix=="PASS" and .header_navigation=="PASS" and .header_page_cases==24 and .header_boundary_cases==11 and .seo_native_cases==6 and .public_width_cases==6 and .seo_controls=="PASS" and .seo_draft_preservation=="PASS" and .seo_persistence=="PASS" and .seo_csrf=="PASS" and .seo_revision_conflict=="PASS" and .seo_invalid_contract=="PASS" and .seo_keyboard=="PASS" and .seo_alignment=="PASS" and .seo_disclosures=="PASS" and .seo_network_failure=="PASS" and .seo_busy_lock=="PASS" and .seo_native_post=="PASS" and .seo_true_blocked_state=="PASS" and .actual_seo_consumers=="PASS" and .complete_save_readback=="PASS" and .seo_legacy_upgrade_repair=="PASS" and .seo_known_value_repair=="PASS" and .seo_repair_rollback=="PASS" and .seo_initial_state=="PASS" and .seo_front_preview=="PASS" and .seo_modal_background=="PASS" and .polylang_actual_pairing=="PASS" and .bounded_performance=="PASS" and .tool_sitemap_policy=="PASS" and .tool_sitemap_policy_cases==10 and .sitemap_diagnostics_refresh=="PASS" and .save_toast_state=="PASS" and .clean_install=="PASS" and .recovery_data=="PASS" and .recovery_checks>=42 and .function_cases>=70 and .public_function_cases>=19' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-seo-13593 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          技术 SEO 与路由遗留修复：中等宽度提前采用已有窄屏菜单，消除 1024 导航文字挤压。修复窄屏菜单被头部裁切、鼠标点不到维护子菜单的问题。现有菜单组件补齐外部点击、Esc、焦点恢复与选择后关闭；维护子菜单保持父菜单打开，关闭父菜单时清理子菜单状态。
          保留已批准的 Shell/Header 结构、菜单项目/顺序、颜色/字号/行高和本页正文；本次明确修复响应式阈值及窄屏菜单交互。权限、nonce、签名、Schema、Updater、Provider协议与跨Owner数据不变。
          Exact candidate Run: $CANDIDATE_RUN。全部70项后台操作、19项实际前台/Polylang、10项工具Sitemap消费者、本页六宽度、共享头部八页三宽度和11个切换边界场景，以及干净安装、42项恢复、$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。
          Assistant读取最终实际截图。功能与UX/UI工程复验按本页范围通过；Production安装和OWNER真实使用不伪装成已完成。Production由OWNER手工升级；独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-seo-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
