name: P07 PR237 SQL advisory evidence exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr237-sql-evidence-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-pr237-sql-evidence-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: e9f4cda370a2bce33f247fb506e4080f997172cf
    steps:
      - name: Require configured private source read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact P07 private PR237 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e9f4cda370a2bce33f247fb506e4080f997172cf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Verify source identity and redacted diagnostic regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = '0.1.0-release101'
          bash -n bin/vfops
          bash bin/vfops --help | grep -F 'vfops server-migrate diagnose-sql --migration-id ID --domain DOMAIN'
          export PYTHONPATH="$PWD/lib:$PWD"
          for test_file in test_sql_diff_evidence.py test_sql_diff_command.py test_cross_engine_sql_format.py test_server_migration_pull.py test_verify.py test_mariadb_owner_policy.py test_secret_scan.py; do
            python3 -B -m unittest discover -s tests -p "$test_file" -v
          done
          git diff --exit-code
          echo P07_PR237_ADVISORY_SQL_DIAGNOSTIC_EXACT_SOURCE_PASS
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          if [ -d p07-private ]; then rm -rf -- p07-private; fi
          echo P07_PRIVATE_CHECKOUT_CLEANUP_DONE
