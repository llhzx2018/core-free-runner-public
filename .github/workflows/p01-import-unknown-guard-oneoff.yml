name: p01-import-unknown-guard-oneoff

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-import-unknown-guard-oneoff.yml'

permissions:
  contents: read

jobs:
  isolated-import-guard:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 source via registered runtime secret
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a782deb8b76b3cd2b28466b72536a6ce83b302a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Prepare PHP for existing import contract
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Verify exact source and focused import/export behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "a782deb8b76b3cd2b28466b72536a6ce83b302a5"
          test "$(cat VERSION)" = "2.47.505"
          node --check src/assets/local-subsite-management.js
          node --check tests/unit/p01_import_unknown_exit_draft_guard_contract.cjs
          node tests/unit/p01_import_unknown_exit_draft_guard_contract.cjs
          node tests/unit/p01_ia5_global_import_r17_contract.cjs
          node tests/unit/p01_ia6_full_transfer_export_r19_contract.cjs
          php tests/unit/transfer_preview_race_v247295_contract.php
          echo P01_IMPORT_UNKNOWN_EXIT_EXACT_HEAD=PASS

      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate
