name: temp-s01-ops-121858-runtime-algorithm-confirm-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121858-runtime-algorithm-confirm-20260908.yml
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ASSET: vf-tools-ops_V1.21.858.zip
      EXPECTED_FP: e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a
    steps:
      - name: Recompute old delivered runtime fingerprint
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'CONFIRM_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops858 && mkdir -p /tmp/ops858
          gh release download v1.21.858 --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/ops858
          python3 - <<'PY'
          import zipfile,hashlib,os
          p='/tmp/ops858/'+os.environ['ASSET']
          expected=os.environ['EXPECTED_FP']
          with zipfile.ZipFile(p) as z:
              rows=[]
              for n in sorted(x for x in z.namelist() if not x.endswith('/')):
                  rel=n.split('/',1)[1]
                  h=hashlib.sha256(z.read(n)).hexdigest()
                  rows.append((rel,h))
              canonical=''.join(f'{rel}\0{h}\n' for rel,h in rows).encode()
              fp=hashlib.sha256(canonical).hexdigest()
              print('RUNTIME_FILES='+str(len(rows)))
              print('RUNTIME_FP='+fp)
              assert len(rows)==934
              assert fp==expected, (fp,expected)
          PY
          echo 'PASS_S01_C02_RUNTIME_ALGORITHM_CONFIRMED'
