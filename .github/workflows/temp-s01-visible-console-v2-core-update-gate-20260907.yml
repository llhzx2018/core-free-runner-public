name: S01 Visible Console V2 Core Update External Gate

on:
  push:
    branches: [temp/s01-visible-console-v2-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-visible-console-v2-core-update-gate-20260907.yml'

permissions:
  contents: read

concurrency:
  group: s01-visible-console-v2-core-update-gate-20260907
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: 3a46df46c2aed352cce11d2e721330413bbd76b1
      CORE_HEAD: 62c2e1c5ded2545fa2d95ce46a47b372b8c9e3bc
      THEME_SHA: de57f823e2d91963305b64a3c75fb1daaf93b9ba
      OPS_SHA: 0956117c8d56aa82e13b5f658c8d51ba41eaee55
      M3U8_SHA: fda320e63e135489a3d46aed1c107aa48114ee86

    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact-head and three-manifest delta gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          git -C core cat-file -e "$CORE_BASE^{commit}"
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','core','diff','--name-only',os.environ['CORE_BASE']+'..'+os.environ['CORE_HEAD']],text=True).splitlines())
          expected={'projects/S01-C01.json','projects/S01-C02.json','projects/S01-C03.json'}
          assert got==expected,(got,expected)
          print('EXACT_THREE_MANIFEST_DELTA=PASS')
          PY

      - name: Run canonical Update Core validation
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: S01 manifest semantic boundary gate
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c1=json.load(open('projects/S01-C01.json'))
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))

          assert c1['target_version']=='1.35.14'
          assert c1['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13']
          assert c1['schema_from']=='N/A' and c1['schema_to']=='N/A'
          assert c1['asset_name']=='vf-tools-theme_V1.35.14.zip'
          assert c1['asset_bytes']==1804066
          assert c1['asset_sha256']=='9613deeba25f74e5d7b89c27ae543b41fc16abc1b653055ae0e92dfb7fb2d75b'
          assert c1['runtime_files']==445 and c1['runtime_fingerprint']=='da718132127365ae0943340efb6ca49012821b50d82845019497154524f84ead'

          assert c2['target_version']=='1.21.852'
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851']
          assert c2['plugin_file']=='vf-ops/vf-ops.php' and c2['physical_locator']=='vf-ops/vf-ops.php'
          assert c2['locator_cutover'] is False
          assert c2['schema_from']=='6.0.0' and c2['schema_to']=='6.0.0'
          assert c2['asset_name']=='vf-tools-ops_V1.21.852.zip'
          assert c2['asset_bytes']==3336509
          assert c2['asset_sha256']=='c2d07eaaf3759e41c07eebe640755ea70a2895593615997cd4f8f56e021c4063'
          assert c2['runtime_files']==934 and c2['runtime_fingerprint']=='c4a3a41ae8a069000e028b4a38b693a48c2fdea37e266dc4268e676ce25c807c'

          assert c3['target_version']=='1.25.23'
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22']
          assert c3['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php' and c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c3['locator_cutover'] is False
          assert c3['schema_from']=='1.3.0' and c3['schema_to']=='1.3.0'
          assert c3['asset_name']=='vf-tools-m3u8_V1.25.23.zip'
          assert c3['asset_bytes']==3575659
          assert c3['asset_sha256']=='1a7abfc60f0dee6e62e455efc9c01a1c80a14e27f482f9bc59c42c8acb787d2f'
          assert c3['runtime_files']==558 and c3['runtime_fingerprint']=='2479902df812942acc24e93aecc503023f5a6ce30c15d6af0ff61bb614ea8af8'
          assert 'migration remains CLOSED' in c3['notes']
          print('S01_MANIFEST_SEMANTIC_BOUNDARY=PASS')
          PY

      - name: Exact formal Release metadata readback
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          check_release(){
            repo="$1" tag="$2" source="$3" asset="$4" bytes="$5" digest="$6" release_id="$7" asset_id="$8"
            curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
            test "$(jq -r '.id' /tmp/release.json)" = "$release_id"
            test "$(jq -r '.draft' /tmp/release.json)" = false
            test "$(jq -r '.prerelease' /tmp/release.json)" = false
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.id' /tmp/release.json)" = "$asset_id"
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = "$bytes"
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = "sha256:$digest"
            test "$(curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/git/ref/tags/$tag" | jq -r '.object.sha')" = "$source"
            test "$(curl --fail-with-body -sS "${auth[@]}" "https://api.github.com/repos/$repo/branches/main" | jq -r '.commit.sha')" = "$source"
          }
          check_release llhzx2018/vf-tools-theme v1.35.14 "$THEME_SHA" vf-tools-theme_V1.35.14.zip 1804066 9613deeba25f74e5d7b89c27ae543b41fc16abc1b653055ae0e92dfb7fb2d75b 383837285 548184923
          check_release llhzx2018/vf-tools-ops v1.21.852 "$OPS_SHA" vf-tools-ops_V1.21.852.zip 3336509 c2d07eaaf3759e41c07eebe640755ea70a2895593615997cd4f8f56e021c4063 383837289 548184946
          check_release llhzx2018/vf-tools-m3u8 v1.25.23 "$M3U8_SHA" vf-tools-m3u8_V1.25.23.zip 3575659 1a7abfc60f0dee6e62e455efc9c01a1c80a14e27f482f9bc59c42c8acb787d2f 383837303 548184973
          echo 'EXACT_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_VISIBLE_CONSOLE_V2_CORE_UPDATE_EXTERNAL_GATE=PASS'
