name: TEMP P08 v014 exact-source formal preflight two independent gates
on:
  pull_request:
    paths:
      - .github/workflows/p08-v014-formal-preflight-temp.yml
permissions:
  contents: read
jobs:
  gov-doc-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private GOV-DOC candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify governance source identity, current skill and negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov-source
          test "$(git rev-parse HEAD)" = '9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb'
          python3 -B governance/agent/takeover_context_budget_lint.py
          python3 -B -m unittest discover -s governance/agent -p 'test_takeover_context_budget_lint.py' -v
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_skill_bridge_lint.py' -v
          python3 -B governance/catalog/tools/doc_structure_lint.py
          python3 -B -m unittest discover -s governance/catalog/tools -p 'test_doc_structure_lint.py' -v
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_router_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_task_delivery_contract_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_first_release_upgrade_evidence.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_task_rule_read_order_lint.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_task_scope_action_lint.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_module_boundary_lint.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_code_architecture_lint.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_project_evolvability_gate.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_entry.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_portfolio_coverage_gate.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_source_adoption_gate.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_project_test_install_receipt_gate.py' -v
          python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_system_install_upgrade_contract_lint.py' -v
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py --resolve-trigger bootstrap
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo P08_V014_GOV_FULL_NEGATIVE_MACHINE=PASS
      - name: Verify exact PR191 impact using actual Git diff and live PR body
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          cd gov-source
          expected="9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb"
          test "$(git rev-parse HEAD)" = "$expected"
          # The linked GitHub connector verified PR191's three impact fields
          # live. Public Runner read token has no PR API (403). Do NOT claim
          # this static impact snapshot is a live PR-body fetch; actual Git
          # diff is still verified by the two canonical guards.
          export PR_BODY='PUBLIC_AUTHORITY_IMPACT: UPDATED
AFFECTED_DOMAINS: INSTALL, SECURITY, TESTING, UPGRADE, DATA_SCHEMA, API_PROVIDER, CRON_JOB, OBSERVABILITY, PERFORMANCE, GIT, UA_UI
IMPACT_REASON: Add ONLY v0.1.4 P08 version-scoped human acceptance timing after existing full exact-source 13-domain release machines; no authority normative bodies or previous single-case modes changed, no Production write.'
          test -n "$PR_BODY"
          base="d1f5d18a5efd475131d39bf83cfb17178af82da3"
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$base" --git-head "$expected"
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$base" --git-head "$expected"
          echo P08_V014_GOV_PR191_REAL_DIFF_IMPACT=PASS
          echo P08_V014_MODE_N_GOV_CURRENT_MACHINE=PASS
      - name: Purge GOV private source
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/gov-source"
  p08-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Setup PHP8.4 and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,mbstring,posix,dom,curl
          tools: composer:v2
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact private P08 final chain HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1c97553fa52610950a7cfc5791bf94283a2010f0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          fetch-depth: 0
          persist-credentials: false
      - name: Source SHA PHP/Python/Composer/Vite and complete R1 tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08-source
          test "$(git rev-parse HEAD)" = '1c97553fa52610950a7cfc5791bf94283a2010f0'
          test "$(cat VERSION)" = 0.1.4
          php -v | head -n 2
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          php tests/test_r130_installed_runtime_version.php
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-v014-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-v014-node.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-v014-node.log" 2>&1
          bash scripts/dev_check.sh
          echo P08_V014_FINAL_CHAIN_SOURCE_MACHINE=PASS
      - name: Purge all private product source
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-v014-*
