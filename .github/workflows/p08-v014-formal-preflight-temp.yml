name: TEMP P08 v014 exact-source formal preflight two independent gates
on:
  pull_request:
    paths:
      - .github/workflows/p08-v014-formal-preflight-temp.yml
permissions:
  contents: read
jobs:
  gov-doc-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact private GOV-DOC candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify governance source identity, current skill and negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov-source
          test "$(git rev-parse HEAD)" = '9574e7a849c5a56cad4b7aef18b2b1f0cb4e0fcb'
          python3 -B governance/agent/takeover_context_budget_lint.py
          python3 -B -m unittest discover -s governance/agent -p 'test_takeover_context_budget_lint.py' -v
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_skill_bridge_lint.py' -v
          python3 -B governance/catalog/tools/doc_structure_lint.py
          python3 -B -m unittest discover -s governance/catalog/tools -p 'test_doc_structure_lint.py' -v
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_router_lint.py' -v
          echo P08_V014_MODE_N_GOV_CURRENT_MACHINE=PASS
      - name: Purge GOV private source
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/gov-source"
  p08-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Setup PHP8.4 and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,mbstring,posix,dom,curl
          tools: composer:v2
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact private P08 final chain HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: c48db8ce006cb5861c4f66d308661acf6bc6ae54
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          fetch-depth: 0
          persist-credentials: false
      - name: Source SHA PHP/Python/Composer/Vite and complete R1 tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08-source
          test "$(git rev-parse HEAD)" = 'c48db8ce006cb5861c4f66d308661acf6bc6ae54'
          test "$(cat VERSION)" = 0.1.4
          php -v | head -n 2
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          php tests/test_r130_installed_runtime_version.php
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-v014-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-v014-node.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-v014-node.log" 2>&1
          bash scripts/dev_check.sh
          echo P08_V014_FINAL_CHAIN_SOURCE_MACHINE=PASS
      - name: Purge all private product source
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-v014-*
