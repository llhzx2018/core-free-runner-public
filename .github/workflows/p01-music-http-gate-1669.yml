name: P01 VF Music Portable HTTP and Combined Regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-music-http-gate-1669.yml'
permissions:
  contents: read
jobs:
  music-http-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 794b0d34063dbfc12f627b275e957c5b8b908a63
      BASELINE_SHA: a1df560fcb0815accad15f9a5320e3c562590509
    steps:
      - name: Configure native PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Exact private candidate and baseline checkout in ephemeral runner
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'BLOCKED_PRIVATE_READ_SECRET'; exit 11; }
          for entry in "candidate $CANDIDATE_SHA" "baseline $BASELINE_SHA"; do
            set -- $entry
            dest="$1"
            wanted="$2"
            git init -q "$dest"
            git -C "$dest" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$SOURCE_REPO.git"
            git -C "$dest" -c advice.detachedHead=false fetch -q --depth 1 origin "$wanted"
            git -C "$dest" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dest" rev-parse HEAD)" = "$wanted"
            git -C "$dest" remote remove origin
          done
          echo "P01_MUSIC_HTTP_EXACT_CANDIDATE=$CANDIDATE_SHA"
      - name: Native Music owner HTTP export and multipart import
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.444"
          bash -n candidate/tests/integration/music_portable_http_roundtrip.sh
          bash candidate/tests/integration/music_portable_http_roundtrip.sh candidate
          echo P01_MUSIC_OWNER_HTTP_EXACT_SOURCE=PASS
      - name: Music existing HTTP smoke and IA V2 combined contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_fresh_http.sh candidate
          php candidate/tests/unit/p01_ia_v2_r3_frontstage_contract.php
          php candidate/tests/unit/p01_r2_frontstage_panel_lifecycle_contract.php
          echo P01_MUSIC_IA_V2_COMBINED_FOCUSED_REGRESSION=PASS
      - name: Canonical product unit regression after both merges
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt
          echo P01_MUSIC_POST_MERGE_CANONICAL_UNIT_GATE=PASS
      - name: Remove private checkouts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for dest in candidate baseline; do
            if [ -d "$dest" ]; then
              git -C "$dest" remote remove origin 2>/dev/null || true
              rm -rf "$dest"
            fi
            test ! -e "$dest"
          done
          echo P01_MUSIC_HTTP_PRIVATE_SOURCE_CLEANUP=PASS
