name: P01 IA6 exact source credentials parity (test-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-487-source-credentials-once.yml'
permissions:
  contents: read
jobs:
  source-credential-scope:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 8a50ea243d0196eee79107972450208d2692c740
      PRODUCT_VERSION: 2.47.487
      P01_TEST_ORIGIN: http://127.0.0.1:19127
      P01_TEST_PASSWORD: SyntheticP01SourceOwner2026!
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-source-auth-20261031
      VF_IA6_DISPOSABLE_ACK: IA6-SOURCE-AUTH-ONLY
    steps:
      - name: Checkout registered public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated PHP/Node
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
      - name: Clone exact private product candidate read-only
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          echo P01_IA6_SOURCE_CREDENTIAL_EXACT_SHA=PASS
      - name: JS state machine and targeted source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/frontstage-source-credentials.js
          node --check candidate/tests/unit/p01_ia6_source_credential_uncertain_reentry_contract.cjs
          bash -n candidate/tests/integration/p01_ia6_specialist_sources_credential_http.sh
          php -l candidate/src/gov-topic-sync.php
          php -l candidate/src/gov-book-sync.php
          (cd candidate && node tests/unit/p01_ia6_sources_governance_native_closure_contract.cjs &&
            node tests/unit/p01_ia6_source_credential_uncertain_reentry_contract.cjs)
          echo P01_IA6_SOURCE_CREDENTIAL_STATE_MACHINE=PASS
      - name: Fresh installed Owner synthetic localhost only
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$VF_E2E_RUNTIME_ROOT"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:19127 -t . >/tmp/p01-ia6-source-auth-server.log 2>&1 & echo $! >/tmp/p01-ia6-source-auth-pid)
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-source-auth-cookie -b /tmp/p01-ia6-source-auth-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-source-auth-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          value=open('/tmp/p01-ia6-source-auth-setup.html',encoding='utf8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',value)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-source-auth-cookie -b /tmp/p01-ia6-source-auth-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 isolated source credentials" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-source-auth-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_IA6_SOURCE_CREDENTIAL_DISPOSABLE_INSTALL=PASS
      - name: Negative test - refuse non-disposable runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          if VF_E2E_RUNTIME_ROOT=/opt/p01-user-site bash candidate/tests/integration/p01_ia6_specialist_sources_credential_http.sh \
              >/tmp/p01-source-auth-refusal.log 2>&1; then
            echo NONDISPOSABLE_SOURCE_TEST_WAS_ALLOWED >&2;exit 1
          fi
          grep -F IA6_SYNTHETIC_RUNTIME_REQUIRED /tmp/p01-source-auth-refusal.log
          echo P01_IA6_SOURCE_CREDENTIAL_NONDISPOSABLE_REFUSED=PASS
      - name: Owner Guest CSRF bad token and isolated revoke real HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/p01_ia6_specialist_sources_credential_http.sh
          echo P01_IA6_SOURCE_CREDENTIAL_HTTP_PARITY=PASS
      - name: Always cleanup exact private clone and disposable fixture
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-source-auth-pid; then kill "$(cat /tmp/p01-ia6-source-auth-pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-source-auth-20261031 candidate
          echo P01_IA6_SOURCE_CREDENTIAL_CLEANUP=PASS
