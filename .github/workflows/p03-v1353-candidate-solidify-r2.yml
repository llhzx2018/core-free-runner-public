name: P03 V1.35.3 Candidate Identity Solidification R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1353-candidate-solidify-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p03-v1353-candidate-solidify-r2
  cancel-in-progress: false

jobs:
  solidify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ENGINEERING_HEAD: 4452f7caa8c6914bfb89c13cbd6f86478d0fd92e
      TARGET_BRANCH: work/p03-v1.35.3-post-seal-health-ui
    steps:
      - name: Require scoped private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 78; }
          echo 'SCOPED_PRIVATE_WRITE_CREDENTIAL=PASS'

      - name: Checkout public solidifier harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: runner

      - name: Checkout exact engineering branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: work/p03-v1.35.3-post-seal-health-ui
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p03

      - name: Assert exact pre-solidification identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p03 rev-parse HEAD)" = "$ENGINEERING_HEAD"
          test "$(tr -d '\r\n' < p03/VERSION)" = '1.35.2'
          grep -Fq "define('VFAB_VERSION', '1.35.2');" p03/src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.35.2'" p03/scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.35.1']" p03/scripts/build_atomic.py
          echo 'PRE_SOLIDIFICATION_IDENTITY=PASS'

      - name: Apply deterministic candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cp runner/scripts/p03_v1353_solidify.py p03/.p03-v1353-solidify.py
          cd p03
          python3 .p03-v1353-solidify.py
          rm .p03-v1353-solidify.py
          python3 tests/integration/source_integrity_test.py
          python3 scripts/repo_health.py .
          python3 tests/unit/schema_contract_test.py
          python3 tests/integration/schema_sqlite_test.py
          node --check public/assets/app.js
          node --check public/assets/forge-ui.js
          test "$(tr -d '\r\n' < VERSION)" = '1.35.3'
          grep -Fq "define('VFAB_VERSION', '1.35.3');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.35.3'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.35.2']" scripts/build_atomic.py
          test "$(python3 -c 'import json;print(json.load(open("VF_PROJECT.json"))["candidate_version"])')" = '1.35.3'
          echo 'CANDIDATE_SOLIDIFICATION_STATIC_GATE=PASS'

      - name: Commit and fast-forward scoped candidate branch
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION src/app/bootstrap.php scripts/build_atomic.py CHANGELOG.md VF_PROJECT.json \
            docs/authority/RPD.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md \
            docs/handoff/CURRENT_STATE.md docs/decisions/SOURCE_MANIFEST.txt
          test -n "$(git status --porcelain)"
          git commit -m 'chore(candidate): solidify VF Forge V1.35.3 identity'
          CANDIDATE_COMMIT=$(git rev-parse HEAD)
          CANDIDATE_TREE=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:$TARGET_BRANCH"
          echo "CANDIDATE_PRODUCT_COMMIT=$CANDIDATE_COMMIT"
          echo "CANDIDATE_PRODUCT_TREE=$CANDIDATE_TREE"
          echo 'NON_FORCE_FAST_FORWARD_PUSH=PASS'
