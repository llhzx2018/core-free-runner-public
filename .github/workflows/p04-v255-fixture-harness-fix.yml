name: P04 V2.5.5 Fixture Harness Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p04-v255-fixture-harness-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v255-candidate-fixture.sh');s=p.read_text()
          old='$DATA/state/update/pending-handoff-v1.json';new='$DATA/update/pending-handoff-v1.json'
          assert s.count(old)==2,s.count(old)
          p.write_text(s.replace(old,new))
          PY
          bash -n scripts/p04-v255-candidate-fixture.sh
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add scripts/p04-v255-candidate-fixture.sh
          git commit -m 'test(P04): use authoritative handoff state path'
          git push origin main
