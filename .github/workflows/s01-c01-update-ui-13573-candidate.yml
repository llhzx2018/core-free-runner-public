name: S01-C01 update center exact candidate
on:
  push:
    branches: [task/s01-c01-update-ui-13573-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.73'
      TARGET_SHA: 'a1d6a801818818577881abd2a2943c526f05516e'
      TARGET_TREE: 'd333fc1189479a3020d3340094bac86d245bb85e'
      SOURCE_VERSION: '1.35.72'
      BASE_SHA: '6513fce8a7729697389bb1202a7a17edc5f4ea0b'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-update-ui-13573 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/update-center-human-language-contract.php
          php target/tests/update-center-credential-native-offer-runtime.php
          node --check target/tests/update-center-v8-browser-proof.js
          node --check target/tests/update-center-controls-browser-check.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1754000'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = '960ca60ed1c95abb44b8cfa8923a01f3edf1788ed5c8dca0a019833b1c804078'
      - name: Browser dependencies and 54 source-render cases
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          mkdir wp-css
          for f in common forms; do curl -fsSL "https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-admin/css/$f.css" -o "wp-css/$f.css"; done
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-includes/css/buttons.css -o wp-css/buttons.css
          cp target/src/inc/update/class-vf-wp-update-admin-v1.php /tmp/update-candidate.php
          cp target/src/assets/css/admin/admin-update-center.css /tmp/update-candidate.css
          git -C target show "$BASE_SHA:src/inc/update/class-vf-wp-update-admin-v1.php" > target/src/inc/update/class-vf-wp-update-admin-v1.php
          git -C target show "$BASE_SHA:src/assets/css/admin/admin-update-center.css" > target/src/assets/css/admin/admin-update-center.css
          export NODE_PATH="$PWD/node_modules" V8_WP_CSS="$PWD/wp-css" V8_PROOF_DIR="$PWD/proof/fixture"
          if node target/tests/update-center-v8-browser-proof.js > /tmp/update-baseline.log 2>&1; then echo 'old mixed settings unexpectedly met group contract'; exit 1; fi
          grep -Fq 'three independent update groups required' /tmp/update-baseline.log
          mv /tmp/update-candidate.php target/src/inc/update/class-vf-wp-update-admin-v1.php
          mv /tmp/update-candidate.css target/src/assets/css/admin/admin-update-center.css
          node target/tests/update-center-v8-browser-proof.js
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-update-ui-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
            proof/fixture/*.json
            proof/fixture/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py /tmp/update-candidate.php /tmp/update-candidate.css /tmp/update-baseline.log
