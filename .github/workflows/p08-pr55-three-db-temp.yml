name: P08 PR55 exact-source 3DB and rootless Worker regression (temp)
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-pr55-three-db-temp.yml]
permissions:
  contents: read
jobs:
  sql-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pSyntheticP08Only123 --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: SyntheticP08Only123
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_full_restore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: SyntheticP08Only123
    steps:
      - name: Exact private P08 PR55 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 73a2be5fd4015685fb525276881425f2b6565ce5
          path: p08-test-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 + needed database drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - name: Native dump clients for isolated database backups
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          command -v mariadb-dump
      - name: Real 3DB install backup restore and updater fault regression
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-test-source"' EXIT
          cd "$GITHUB_WORKSPACE/p08-test-source"
          test "$(git rev-parse HEAD)" = 73a2be5fd4015685fb525276881425f2b6565ce5
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress >/dev/null
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_job.php
          php tests/test_owner_upgrade_worker_cron.php
          php tests/fixtures/create_ci_databases.php
          php tests/test_install_mysql_e2e.php
          php tests/test_recovery_sql_e2e.php
          echo P08_PR55_SQL_REAL_INSTALL_BACKUP_RESTORE_AND_WORKER=PASS
      - name: Purge private source regardless of result
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-test-source"
  sqlite-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      P08_ISOLATED_INSTALL_TEST: "YES"
    steps:
      - name: Exact private P08 PR55 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 73a2be5fd4015685fb525276881425f2b6565ce5
          path: p08-test-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP 8.4 + SQLite and backup extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - name: Real SQLite clean install WAL backup restore and rootless Worker regression
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-test-source"' EXIT
          cd "$GITHUB_WORKSPACE/p08-test-source"
          test "$(git rev-parse HEAD)" = 73a2be5fd4015685fb525276881425f2b6565ce5
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress >/dev/null
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_job.php
          php tests/test_install_sqlite_e2e.php
          php tests/test_recovery_sqlite_e2e.php
          echo P08_PR55_SQLITE_REAL_INSTALL_WAL_BACKUP_RESTORE_WORKER=PASS
      - name: Purge private source regardless of result
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-test-source"
