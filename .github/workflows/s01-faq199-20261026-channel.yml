name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-faq199-channel-20261026]
    paths: ['.github/workflows/s01-faq199-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.199
  TARGET_SHA: 3af1db5b5f5d20fb26f52614b668a31960653b72
  UPDATE_SHA: 1e7a4bacb5c6be973a07b62f9bdae51d633f7524
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 1e7a4bacb5c6be973a07b62f9bdae51d633f7524
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq199-20261026/channel-spec.json --input control/.github/workflows/s01-faq199-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only a780c804a211f25e5baee1dc92ee835f8279b2a2 1e7a4bacb5c6be973a07b62f9bdae51d633f7524)" = projects/S01-C01.json
          git -C source diff --exit-code a780c804a211f25e5baee1dc92ee835f8279b2a2 1e7a4bacb5c6be973a07b62f9bdae51d633f7524 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='058a2636b1f454b3c23543fd859722051893bf794db3dd4004c538f7996b257c' and m['asset_bytes']==2003653
          assert m['runtime_files']==476 and '1.35.198' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
