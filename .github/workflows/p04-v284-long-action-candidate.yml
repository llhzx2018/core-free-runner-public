name: P04 V2.8.4 Long Action Candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v284-long-action-candidate.yml'
      - 'requests/p04-v284-long-action-candidate.txt'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-infra
      SOURCE_COMMIT: 165fd09f591dddbf6c5e1337734fcd31b09a47ae
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Verify V2.8.4 long-action UX and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cd candidate && git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = '2.8.4'
          node --check candidate/public/assets/v284-long-action-feedback.js
          php -l candidate/public/index.php
          python3 -m py_compile candidate/scripts/build-v284-update-release.py
          grep -Fq 'provider_accounts_sync_all' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'provider_billings_sync_all' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'run_due_checks' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'domain_check' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'stopImmediatePropagation' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'MutationObserver' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq '650' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'aria-busy' candidate/public/assets/v284-long-action-feedback.js
          grep -Fq 'v284-indeterminate' candidate/public/assets/v284-long-action-feedback.css
          grep -Fq 'v284-long-action-feedback.js' candidate/public/index.php
          grep -Fq 'v284-long-action-feedback.css' candidate/public/index.php
          R="$RUNNER_TEMP/runtime"; O="$RUNNER_TEMP/update"
          python3 candidate/scripts/build-release-tree.py "$R" --source-root candidate
          test "$(tr -d '\r\n' < "$R/VERSION.txt")" = '2.8.4'
          test -f "$R/assets/v284-long-action-feedback.js"
          test -f "$R/assets/v284-long-action-feedback.css"
          python3 candidate/scripts/build-v284-update-release.py --target-runtime "$R" --output "$O"
          php "$O/repair-v2.8.4.php" --self-test | tee "$RUNNER_TEMP/selftest.log"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.4 schema=14' "$RUNNER_TEMP/selftest.log"
          for v in 2.7.9 2.8.0 2.8.1 2.8.2 2.8.3; do grep -Fq "$v" "$O/repair-v2.8.4.php"; done
          grep -Fq 'ReleaseManifestIntegrityVerifier::verify(__DIR__,VF_INFRA_ATOMIC_TARGET)' "$O/repair-v2.8.4.php"
          mkdir -p "$RUNNER_TEMP/private"; chmod 700 "$RUNNER_TEMP/private"
          cat > "$R/config.php" <<PHP
          <?php
          return ['app_name'=>'VF Infra Candidate','base_url'=>'http://localhost','allowed_hosts'=>['localhost'],'host_mode'=>'serve_all','trusted_proxy_ips'=>[],'rdap_allow_http'=>false,'data_path'=>'$RUNNER_TEMP/private','timezone'=>'Asia/Shanghai','app_key'=>'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef','session_name'=>'vf284'];
          PHP
          chmod 600 "$R/config.php"
          php candidate/tests/integration/common_branding_contract_v279.php "$R" 2.8.4 | tee "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS logo_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS favicon_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'P04_COMMON_BRANDING_CONTRACT_PASS version=2.8.4' "$RUNNER_TEMP/branding.log"
          python3 - "$R" "$RUNNER_TEMP/VF_Infra_V2.8.4_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name != 'config.php'):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          cp "$O/VF_Infra_V2.8.4_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.4_UPDATE.zip"
          python3 - <<'PY'
          import hashlib,os,pathlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']); f=t/'VF_Infra_V2.8.4_FULL.zip'; u=t/'VF_Infra_V2.8.4_UPDATE.zip'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          print('P04_V284_LONG_ACTION_CANDIDATE=PASS')
          print('SOURCE_SHA='+os.environ['SOURCE_COMMIT'])
          print('FULL_BYTES='+str(f.stat().st_size)); print('FULL_SHA256='+sha(f))
          print('UPDATE_BYTES='+str(u.stat().st_size)); print('UPDATE_SHA256='+sha(u))
          print('LONG_ACTION_IMMEDIATE_BUSY=PASS')
          print('DUPLICATE_GUARD=PASS')
          print('GENERIC_SLOW_POST_FALLBACK=PASS')
          print('PRODUCTION_WRITE=0'); print('RELEASE_WRITE=0')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.4-LONG-ACTION-CANDIDATE
          path: |
            ${{ runner.temp }}/VF_Infra_V2.8.4_FULL.zip
            ${{ runner.temp }}/VF_Infra_V2.8.4_UPDATE.zip
            ${{ runner.temp }}/selftest.log
            ${{ runner.temp }}/branding.log
          retention-days: 14
