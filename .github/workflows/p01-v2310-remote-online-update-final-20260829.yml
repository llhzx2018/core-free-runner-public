name: P01 V2.31 Final Remote Online Update Gate
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths:
      - .github/workflows/p01-v2310-remote-online-update-final-20260829.yml
      - scripts/p01-v2310-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2310-final-owner
      PORT: '18645'
      ADMIN_PASS: 'P01V2310!FinalRemote'
      EVID: /tmp/p01-v2310-final-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.30.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C production rev-parse HEAD)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$(git -C production rev-parse HEAD^{tree})" = 771125988f07c01740e4b3dc3863ff90ebcdc5dd
          test "$(git -C updates rev-parse HEAD)" = 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.31.0 --jq .object.sha)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.31.0 --jq .id)" = 379001173
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256046377 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256106808 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256138858 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33256195631 --jq .conclusion)" = success
          jq -e '.current_version=="2.30.0" and .target_version=="2.31.0" and .from_versions==["2.30.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.31.0" and .release_id==379001173 and .product_identity=="0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4" and .asset_name=="VF_Start_V2.31.0_UPDATE.zip" and .asset_bytes==1324509 and .asset_sha256=="41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.31.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.31.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774
          echo P01_V2310_FINAL_REMOTE_TRUTH_FENCE=PASS
      - name: Real remote update plus data HTTP desktop mobile gate
        shell: bash
        run: bash runner/scripts/p01-v2310-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V230_TO_V2310_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2310_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2310_DATA_PRESERVATION=PASS
          P01_V2310_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2310_CONTEXTUAL_CREATE_FORM=PASS
          P01_V2310_PRIVATE_STATE_SEMANTIC=PASS
          P01_V2310_CONTEXTUAL_ACTION_COPY=PASS
          P01_V2310_SERVER_DOMAIN_NORMALIZATION=PASS
          P01_V2310_DESKTOP_MOBILE_BROWSER=PASS
          P01_V2310_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2310-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2310-final-evidence
          if-no-files-found: warn
          retention-days: 30
