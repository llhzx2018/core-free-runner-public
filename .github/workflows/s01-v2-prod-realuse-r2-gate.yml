name: S01 V2 Production Real-use R2 Gate

on:
  push:
    branches:
      - task/s01-v2-prod-realuse-r2-gate
    paths:
      - .github/workflows/s01-v2-prod-realuse-r2-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: R2 Exact (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: aba8b2484dce2209b35adf3fdadc00b395d84461
            head: 795b675be6561d52a07c3d4b7fe7961785c01dbc
            test: tests/s01-c02-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            allowed: includes/admin-v13/views/dashboard.php,assets/css/current/admin-s01-page-body-system-v2.css,tests/s01-c02-page-body-v2-production-realuse-r2-contract.php
            phpfiles: includes/admin-v13/views/dashboard.php,tests/s01-c02-page-body-v2-production-realuse-r2-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: bba828726f96d53f8a73bed58f197e862e10f5a2
            head: af3a7e311b06c0d3b6efaaa96e21c53bf629327e
            test: tests/s01-c01-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            allowed: src/assets/css/admin/admin-s01-page-body-system-v2.css,tests/s01-c01-page-body-v2-production-realuse-r2-contract.php
            phpfiles: tests/s01-c01-page-body-v2-production-realuse-r2-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 64efdb3e07e161a25107179613824bce78bbc226
            head: 50643948ac8f097f92a47a7b206d15d8afd67b00
            test: tests/s01-c03-page-body-v2-production-realuse-r2-contract.php
            full: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            allowed: src/admin/ui-v4/pages/v6-playground.js,src/admin/ui-v4/admin-s01-page-body-system-v2.css,tests/s01-c03-page-body-v2-production-realuse-r2-contract.php
            phpfiles: tests/s01-c03-page-body-v2-production-realuse-r2-contract.php

    steps:
      - name: Credential
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact source and bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")
          rm -rf /tmp/src /tmp/src.tar.gz; mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          echo "SOURCE_DIR=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_ENV"

      - name: Syntax and contracts
        env:
          PHPFILES: ${{ matrix.phpfiles }}
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
        run: |
          set -Eeuo pipefail
          IFS=',' read -r -a FILES <<< "$PHPFILES"
          for rel in "${FILES[@]}"; do php -l "$SOURCE_DIR/$rel"; done
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"
          echo "R2_EXACT_GATE=PASS"
