name: P07 PR293 exact-source versioned Laravel synthetic proof
on:
  pull_request:
    paths:
      - '.github/workflows/p07-pr293-versioned-laravel-synthetic.yml'
permissions:
  contents: read
jobs:
  p07-source-regression:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify registered private-read capability is present
        env:
          TOKEN_AVAILABLE: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$TOKEN_AVAILABLE" || { echo 'PRIVATE_READ_CAPABILITY_MISSING'; exit 78; }
          echo 'P07_EXACT_SOURCE_CAPABILITY_PRESENT'
      - name: Checkout exact P07 candidate in temporary private-only runner directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f043982ad5d04ce309e71098d991d1d55f38458c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Run bounded Python compile, application and migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = f043982ad5d04ce309e71098d991d1d55f38458c
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for path in (
              'lib/app_config.py',
              'lib/server_migration.py',
              'lib/server_migration_pull.py',
              'tests/test_migration_versioned_laravel_p07.py',
          ):
              ast.parse(Path(path).read_text(encoding='utf-8'), filename=path)
          print('P07_293_SYNTAX_PASS')
          PY
          python3 -B -m unittest -q \
            tests.test_app_config \
            tests.test_migration_versioned_laravel_p07 \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull
          echo 'P07_293_SYNTHETIC_EXACT_SOURCE_PASS'
      - name: Remove temporary private checkout even on failure
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_293_PRIVATE_WORKSPACE_CLEANUP_DONE'
