name: TEMP S01-C02 1.21.928 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: d914746887f1c6142f5200c16f26cec8d4af35fa
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.928
      ASSET: vf-tools-ops_V1.21.928.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: d914746887f1c6142f5200c16f26cec8d4af35fa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.928"
          assert m["release_tag"]=="v1.21.928"
          assert m["asset_name"]=="vf-tools-ops_V1.21.928.zip"
          assert m["asset_bytes"]==3476334
          assert m["asset_sha256"]=="29cc456525b052de0dcd0b164c2003db70ae6cff703ba2b41030502ae38304ee"
          assert m["runtime_files"]==975
          assert m["runtime_fingerprint"]=="87d6aa0c14eb2514612f0a796b171ff41a7c08e60cc5c1539c27c7eea95cda1f"
          assert "1.21.927" in m["from_versions"]
          assert m["schema_from"]=="6.0.0"
          assert m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 1.21.928 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "94165c3685dcbaa14949225a3d40d580a74a52cc"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3476334"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:29cc456525b052de0dcd0b164c2003db70ae6cff703ba2b41030502ae38304ee"
          echo "S01-C02 1.21.928 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
