name: P07 MariaDB Future Bootstrap Fallback Proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'candidates/p07-mariadb-1011/**'
      - '.github/workflows/p07-mariadb-1011-fallback.yml'
permissions:
  contents: read
jobs:
  isolated-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read-only P07 future MariaDB bootstrap policy
        env:
          PYTHONPATH: candidates/p07-mariadb-1011/lib:dist/p07/0.1.0/overlay/lib
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n candidates/p07-mariadb-1011/bin/vfops-init-ui
          python3 -m py_compile candidates/p07-mariadb-1011/lib/server_migration.py candidates/p07-mariadb-1011/lib/server_migration_pull.py candidates/p07-mariadb-1011/tests/test_mariadb_owner_policy.py
          python3 -m unittest discover -s candidates/p07-mariadb-1011/tests -p 'test_*.py' -v
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' candidates/p07-mariadb-1011/lib/server_migration.py
          ! grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MYSQL_8.4"' candidates/p07-mariadb-1011/lib/server_migration.py
          echo 'P07_MARIADB_1011_FALLBACK_PROOF_PASS'
