name: P07 M03 official SHA pinned ZIP public raw mirror once
on:
  push:
    branches: [fix/p07-m03-m04-owner-field-20261114]
    paths: ['.github/workflows/p07-m03-public-official-asset-mirror-once.yml']
permissions:
  contents: read
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Mirror previously public immutable official M03 ZIP into public Git raw transport
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo P07_PUBLIC_WRITE_TOKEN_NOT_AVAILABLE; exit 78; }
          repo=llhzx2018/core-free-runner-public
          branch=fix/p07-m03-m04-owner-field-20261114
          test "$GITHUB_REPOSITORY" = "$repo"
          current="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA" || { echo P07_M03_BRANCH_ADVANCED_REFUSE_STALE_WRITE; exit 79; }
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          src='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-v0.1.0-five-modules-ux3-20261113/P07-M03-0.1.0-release135.zip'
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --connect-timeout 15 --max-time 120 "$src" -o "$tmp/official.zip"
          echo "2e5509bf7f2d36c5bc9f4ec9e2e05016e9e30f94cff546880e93e441af8af866  $tmp/official.zip" | sha256sum -c -
          python3 - "$tmp/official.zip" "$tmp/blob.json" <<'PY'
          import base64,json,sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert len(names)>55 and "dist/p07/0.1.0/overlay/RUNTIME.gitblob" in names
          Path(sys.argv[2]).write_text(json.dumps({"content":base64.b64encode(p.read_bytes()).decode(),"encoding":"base64"}))
          PY
          blob="$(gh api -X POST "repos/$repo/git/blobs" --input "$tmp/blob.json" --jq '.sha')"
          oldtree="$(gh api "repos/$repo/git/commits/$current" --jq '.tree.sha')"
          python3 - "$tmp/tree.json" "$oldtree" "$blob" <<'PY'
          import json,sys
          target,base,blob=sys.argv[1:]
          with open(target,"w") as f:
              json.dump({"base_tree":base,"tree":[{"path":"dist/p07/0.1.0-release135/P07-M03-0.1.0-release135.zip","mode":"100644","type":"blob","sha":blob}]},f)
          PY
          tree="$(gh api -X POST "repos/$repo/git/trees" --input "$tmp/tree.json" --jq '.sha')"
          python3 - "$tmp/commit.json" "$tree" "$current" <<'PY'
          import json,sys
          with open(sys.argv[1],"w") as f:
              json.dump({"message":"fix(p07-m03): public raw transport for previously released immutable SHA256-pinned ZIP","tree":sys.argv[2],"parents":[sys.argv[3]]},f)
          PY
          next="$(gh api -X POST "repos/$repo/git/commits" --input "$tmp/commit.json" --jq '.sha')"
          printf '{"sha":"%s","force":false}\n' "$next" > "$tmp/ref.json"
          gh api -X PATCH "repos/$repo/git/refs/heads/$branch" --input "$tmp/ref.json" --jq '.object.sha'
          echo "P07_M03_PUBLIC_RAW_MIRROR_SHA=$next"
          echo P07_M03_OFFICIAL_SAME_SHA256_BYTES_STORED_PUBLICLY=PASS
          echo P07_PRIVATE_SOURCE_PERSISTENCE=NO_NEW_CONTENT_ALSO_RELEASED_PREVIOUSLY
          echo P07_OWNER_PRODUCTION=NOT_RUN
