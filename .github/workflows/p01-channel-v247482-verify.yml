name: p01-channel-v247482-verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-v247482-verify.yml'

permissions:
  contents: read

jobs:
  channel-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: fa281ab684e7e0dbb2fda9a00e27e73b7a49aea6
      PRODUCT_SHA: 2f2869c4cdaa0408e8fec38f20cd297d7b421cfa
      UPDATE_SHA256: f2cea1ab91e871e4f490bd949c5b93e65c079ced1f4a9e02b97386789a8d6c7f
    steps:
      - name: Checkout one-off public verification lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify one-off lane only adds this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch -q origin main
          mapfile -t changes < <(git diff --name-only origin/main "${{ github.event.pull_request.head.sha }}")
          test "${#changes[@]}" -eq 1
          test "${changes[0]}" = '.github/workflows/p01-channel-v247482-verify.yml'
          echo P01_CHANNEL_LANE_SCOPE=PASS
      - name: Verify exact private manifest in transient worktree
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf channel-check' EXIT
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" channel-check
          git -C channel-check fetch -q --depth 1 origin "$SOURCE_SHA"
          git -C channel-check checkout -q --detach FETCH_HEAD
          test "$(git -C channel-check rev-parse HEAD)" = "$SOURCE_SHA"
          jq -e --arg id "$PRODUCT_SHA" --arg hash "$UPDATE_SHA256" '
            .project_id=="P01" and .enabled==true and .current_version=="2.47.481" and
            .target_version=="2.47.482" and .from_versions==["2.47.481"] and
            .schema_from==.schema_to and .update_type=="ATOMIC" and
            .release_tag=="v2.47.482" and .release_id==427517451 and
            .product_identity==$id and .asset_name=="VF_Start_V2.47.482_UPDATE.zip" and
            .asset_bytes==3319717 and .asset_sha256==$hash and
            .backup_required==true and .rollback_supported==true
          ' channel-check/projects/P01.json >/dev/null
          python3 channel-check/scripts/check_manifest_contract.py
          php -v | head -1
          find channel-check/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php channel-check/update-core/php/tests/run.php
          echo P01_CHANNEL_MANIFEST_AND_UPDATE_CORE=PASS
      - name: Match published Release tag, exact source and asset metadata
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          headers=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json')
          curl -fsSL "${headers[@]}" https://api.github.com/repos/llhzx2018/vf-start/git/ref/tags/v2.47.482 -o /tmp/p01-tag.json
          jq -e --arg id "$PRODUCT_SHA" '.object.sha==$id' /tmp/p01-tag.json >/dev/null
          curl -fsSL "${headers[@]}" https://api.github.com/repos/llhzx2018/vf-start/releases/tags/v2.47.482 -o /tmp/p01-release.json
          jq -e --arg id "$PRODUCT_SHA" --arg digest "sha256:$UPDATE_SHA256" '
            .id==427517451 and .tag_name=="v2.47.482" and .draft==false and .prerelease==false and
            any(.assets[]; .name=="VF_Start_V2.47.482_UPDATE.zip" and .size==3319717 and .digest==$digest) and
            (.body | contains($id))
          ' /tmp/p01-release.json >/dev/null
          echo P01_CHANNEL_EXACT_RELEASE_ASSET=PASS
