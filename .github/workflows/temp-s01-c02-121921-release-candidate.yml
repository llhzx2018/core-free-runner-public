name: TEMP S01-C02 1.21.921 Release candidate proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c37dc1cc4754a3792926f8f4a40e04e48fb36ad4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "c37dc1cc4754a3792926f8f4a40e04e48fb36ad4"
          test "$(tr -d '\r\n' < source/VERSION)" = "1.21.921"
          grep -Fq 'Version: 1.21.921' source/vf-ops.php
          grep -Fq 'S01-PUBLISH-COMPAT-VISUAL-CLOSURE-R32' source/vf-ops.php

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l source/vf-ops.php
          php -l source/includes/admin-v13/route-contract.php
          php -l source/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l source/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l source/tests/s01-c02-121921-publish-compat-visual-r32-contract.php

      - name: R32 exact-source contract
        shell: bash
        run: |
          set -euo pipefail
          php source/tests/s01-c02-121921-publish-compat-visual-r32-contract.php

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf source

# PR synchronize trigger
