name: P07 release116 Owner private trial package (NOT FORMAL)
on:
  push:
    branches:
      - task/p07-owner116-private-trial-20261109
permissions:
  contents: read
concurrency:
  group: p07-owner116-private-trial-20261109
  cancel-in-progress: false
jobs:
  private-trial-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      WORK: /tmp/p07-owner116-private-trial-20261109
      PRODUCT_SHA: 97a7e726f87f15305fd85fa567b5c91e434f933c
      PUBLIC_SHA: 7c3f685465b0da9a4414a13b629ea599006019ae
      PRODUCT_BUILD: 0.1.0-release116
      TRIAL_TAG: trial/p07-0.1.0-release116-20261109
      FILE: p07-release116-rc293-owner-test.tar.gz
    steps:
      - name: Checkout public builder workflow without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact PRIVATE P07 source into short-lived workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 97a7e726f87f15305fd85fa567b5c91e434f933c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Checkout immutable PUBLIC release115 base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7c3f685465b0da9a4414a13b629ea599006019ae
          persist-credentials: false
          fetch-depth: 1
          path: public
      - name: Build exact complete nonformal Owner preview
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C public rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(tr -d '\r\n ' < product/BUILD_ID)" = "$PRODUCT_BUILD"
          mkdir -p "$WORK/output"
          python3 -B product/scripts/p07-owner-prebuilt116-package.py \
            --product-root "$PWD/product" \
            --public-root "$PWD/public" \
            --product-sha "$PRODUCT_SHA" \
            --output-dir "$WORK/output" > "$WORK/build-receipt.txt"
          grep -Fqx 'P07_OWNER_PACKAGE_CREATED=YES' "$WORK/build-receipt.txt"
          grep -Fqx 'P07_OWNER_PACKAGE_UPLOADED=NO' "$WORK/build-receipt.txt"
          grep -Fqx 'P07_OWNER_PACKAGE_FORMAL_RELEASE=NO' "$WORK/build-receipt.txt"
          test -s "$WORK/output/$FILE"
          test -s "$WORK/output/$FILE.sha256"
          (cd "$WORK/output" && sha256sum -c "$FILE.sha256")
          python3 -B - "$WORK/output/$FILE" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,sys,tarfile
          p,sha=sys.argv[1:3]
          with tarfile.open(p,"r:gz") as a:
              members=a.getmembers()
              assert len(members) > 100
              assert all(m.name == "candidate" or m.name.startswith("candidate/") for m in members)
              assert all(m.isdir() or m.isfile() for m in members)
              data=a.extractfile("candidate/candidate_attestation.json").read()
              d=json.loads(data)
              assert d["product_source_sha"] == sha, d
              assert d["product_build"] == "0.1.0-release116"
              assert d["status"] == "FORMAL_STAGING_NOT_PUBLISHED"
              required={"candidate/installers/p07.sh","candidate/installers/p07-final.sh",
                        "candidate/dist/p07/0.1.0/overlay/RUNTIME.gitblob",
                        "candidate/dist/p07/0.1.0/overlay/bin/vfops",
                        "candidate/dist/p07/0.1.0/overlay/bin/vfops-migrate-ui"}
              assert required <= set(a.getnames()), required-set(a.getnames())
          PY
          printf '%s\n' \
            'P07_OWNER_TRIAL_BUILD_AND_HASH=PASS' \
            'P07_PUBLIC_ARTIFACT_UPLOAD=NO' \
            'P07_FORMAL_RELEASE=NO' \
            'P07_EXISTING_VPS_CHANGES=NONE'
      - name: Publish package to PRIVATE product prerelease only (not formal)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-server-ops --jq '.private')" = true
          if gh api "repos/llhzx2018/vf-server-ops/git/ref/tags/$TRIAL_TAG" >/dev/null 2>&1; then
            echo 'P07_OWNER_TRIAL_ALREADY_EXISTS_STOP'; exit 8
          fi
          if gh api "repos/llhzx2018/vf-server-ops/releases/tags/$TRIAL_TAG" >/dev/null 2>&1; then
            echo 'P07_OWNER_TRIAL_RELEASE_ALREADY_EXISTS_STOP'; exit 8
          fi
          gh api --method POST repos/llhzx2018/vf-server-ops/git/refs \
            -f "ref=refs/tags/$TRIAL_TAG" -f "sha=$PRODUCT_SHA" > /dev/null
          test "$(gh api "repos/llhzx2018/vf-server-ops/git/ref/tags/$TRIAL_TAG" --jq '.object.sha')" = "$PRODUCT_SHA"
          cat > "$WORK/notes.md" <<'NOTES'
          # P07 0.1.0-release116 · Owner 私有手工试用候选（非正式版）
          This release is PRIVATE and for OWNER-led manual trial only.
          It is NOT the Formal Release, not core-updates distribution, not a production update.
          No VPS has been modified, no database has been imported and DNS was not changed.
          Target CP2 with PREPARE_FAILED / existing sites or DB must not be overwritten.
          Candidate includes an offline complete install tree and SHA-256 receipt.
          Source: 97a7e726f87f15305fd85fa567b5c91e434f933c
          Baseline: 7c3f685465b0da9a4414a13b629ea599006019ae
          NOT_PROVEN: full real two-CloudPanel-VPS migration and original 18-site cutover.
          NOTES
          gh release create "$TRIAL_TAG" \
            "$WORK/output/$FILE" "$WORK/output/$FILE.sha256" \
            -R llhzx2018/vf-server-ops --prerelease --verify-tag \
            --title "P07 release116 OWNER TRIAL — NOT FORMAL" \
            --notes-file "$WORK/notes.md"
          gh api "repos/llhzx2018/vf-server-ops/releases/tags/$TRIAL_TAG" > "$WORK/release.json"
          test "$(jq -r '.prerelease' "$WORK/release.json")" = true
          test "$(jq -r '.draft' "$WORK/release.json")" = false
          test "$(jq '.assets | length' "$WORK/release.json")" -eq 2
          mkdir -p "$WORK/readback"
          gh release download "$TRIAL_TAG" -R llhzx2018/vf-server-ops \
            -D "$WORK/readback" -p "$FILE" -p "$FILE.sha256"
          cmp "$WORK/output/$FILE" "$WORK/readback/$FILE"
          cmp "$WORK/output/$FILE.sha256" "$WORK/readback/$FILE.sha256"
          echo 'P07_PRIVATE_OWNER_TRIAL_REMOTE_READBACK=PASS'
          echo 'P07_PUBLIC_RUNNER_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_FORMAL_RELEASE_PERFORMED=NO'
          echo 'P07_CORE_UPDATES_MODIFIED=NO'
          echo 'P07_PRODUCTION_MODIFIED=NO'
      - name: Cleanup PRIVATE transient source and candidate (always)
        if: always()
        shell: bash
        run: |
          rm -rf -- product public "$WORK"
          echo 'P07_PUBLIC_WORKSPACE_PRIVATE_MATERIAL_RETAINED=NO'
