name: P07 D04 CloudPanel static ingress real two VM proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-cloudpanel-ingress-20261116.yml'
      - 'tests/p07_m03_d04_cloudpanel_ingress_20261116.sh'
permissions:
  contents: read
jobs:
  cloudpanel-source-ingress:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout public synthetic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P07 product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: c7e70337c4632bd1e147c8665998e113df00588d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Real two CloudPanel source-side static ingress and restoration
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = c7e70337c4632bd1e147c8665998e113df00588d
          bash -n tests/p07_m03_d04_cloudpanel_ingress_20261116.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_cloudpanel_ingress_20261116.sh
      - name: Always remove private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_CP_INGRESS_PRIVATE_SOURCE_CLEAN=PASS
