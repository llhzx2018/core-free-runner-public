name: P01 V247357 Browser Helper Chromium Modal Proof (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247357-browser-helper-chromium-proof.yml'
      - '.github/scripts/p01_v247357_browser_modal_chromium.py'
permissions:
  contents: read
jobs:
  real-chromium:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact product main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 903af33de73fe7a9211b68e785e65836e2566918
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout isolated test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: test-runner
          persist-credentials: false
      - name: Exact version gate, no release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 903af33de73fe7a9211b68e785e65836e2566918
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.357
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.357
          grep -Fq "define('VF_VERSION', '2.47.357');" product/src/app/bootstrap.php
          node --check product/src/assets/browser-helper.js
          python3 -m py_compile test-runner/.github/scripts/p01_v247357_browser_modal_chromium.py
          echo P01_247357_CHROMIUM_EXACT_SOURCE=PASS
      - name: Set up disposable local Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet --break-system-packages 'playwright==1.55.0'
          python3 -m playwright install --with-deps chromium >/dev/null
      - name: Exact product JavaScript real-browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 test-runner/.github/scripts/p01_v247357_browser_modal_chromium.py | tee /tmp/p01-v247357-chromium.log
          for marker in \
            P01_247357_CHROMIUM_ESCAPE_AFTER_COPY_WIPES=PASS \
            P01_247357_CHROMIUM_UNCOPIED_CANCEL_PRESERVES=PASS \
            P01_247357_CHROMIUM_UNCOPIED_CONFIRM_WIPES=PASS \
            P01_247357_CHROMIUM_NATIVE_CLOSE_WIPES=PASS \
            P01_247357_CHROMIUM_DONE_BUTTON_WIPES=PASS \
            P01_247357_REAL_CHROMIUM_NO_DEPLOYMENT=PASS; do
            grep -Fx "$marker" /tmp/p01-v247357-chromium.log
          done
          echo P01_247357_BROWSER_SECURITY_BEHAVIOR=PASS
