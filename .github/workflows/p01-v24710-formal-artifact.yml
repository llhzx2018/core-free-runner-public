name: P01 V2.47.10 Formal Artifact and Publish

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v24710-formal-artifact.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24710-formal-artifact
  cancel-in-progress: false

jobs:
  artifact:
    if: github.head_ref == 'temp/p01-v24710-formal-artifact-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: 972541fd06c66044105ec1b19cf7738c340c90c1
      CANDIDATE_BRANCH: release/v2.47.10-candidate-20260915
      SOURCE_TAG: v2.47.9
      SOURCE_SHA: 89df52cede9f03c88627396e66afe97325214353
      SOURCE_VERSION: 2.47.9
      TARGET_VERSION: 2.47.10
      TARGET_TAG: v2.47.10
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35066284358'
      BIND_PR: '760'
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact formal authority and authorized credential route
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${CANDIDATE_BRANCH}" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then echo BLOCK=TARGET_TAG_ALREADY_EXISTS; exit 81; fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo READ_CREDENTIAL_ROUTE=VF_RELEASE_WRITE_TOKEN
          echo P01_V24710_FORMAL_AUTHORITY=PASS

      - name: Checkout exact formal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.9 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Rebuild deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' vf-start/docs/release/V2.47.10_RELEASE_GATE.md
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v24710-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v24710-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['FORMAL_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['FORMAL_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR='+os.environ['BIND_PR']),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V24710_RELEASE_CHAIN_20260915'),
            ('V2470','V24710'),('v2470','v24710')]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4',os.environ['SOURCE_VERSION']).replace('__TARGET__',os.environ['TARGET_VERSION'])
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.9 之后 Resource Quality + Global Header UX 收口的正式发布版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v24710-artifact-gate.sh
          bash /tmp/p01-v24710-artifact-gate.sh | tee /tmp/p01-v24710-artifact.log
          grep -Fx 'P01_V24710_FORMAL_ARTIFACT_GATE=PASS' /tmp/p01-v24710-artifact.log
          echo P01_V24710_REAL_UPGRADE=PASS

      - name: Stable package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24710-formal-artifacts
          FULL="$ASSETS/VF-Start-V2.47.10-FULL.zip"
          UPDATE="$ASSETS/VF_Start_V2.47.10_UPDATE.zip"
          for f in "$FULL" "$FULL.sha256" "$UPDATE" "$UPDATE.sha256"; do test -f "$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.10-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.10_UPDATE.zip.sha256)
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n ')" = "$TARGET_VERSION"
          unzip -p "$FULL" release-manifest.json >/tmp/p01-v24710-release-manifest.json
          jq -e --arg t "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg schema "$EXPECTED_SCHEMA" '.version==$t and .source_version==$s and .schema_version==$schema and .source_schema_version==$schema and .schema_change==false and (.schema_migrations|length)==0 and .runtime_data_included==false and .seed_user_business_data_included==false and .update.backup_required==true and .update.rollback_supported==true and .update.single_hop==true and (.update.supported_from==[$s])' /tmp/p01-v24710-release-manifest.json >/dev/null
          test "$(unzip -Z1 "$UPDATE" | wc -l | tr -d ' ')" = 1
          unzip -Z1 "$UPDATE" | grep -Fxq repair-v2.47.10.php
          php "$ASSETS/repair-v2.47.10.php" --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          ! unzip -Z1 "$FULL" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V24710_PACKAGE_CONTRACT=PASS

      - name: Create stable tag and release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24710-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TARGET_TAG}" -f sha="$FORMAL_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          cat >/tmp/p01-v24710-notes.md <<EOF
          # P01 · VF Start V2.47.10

          - R25：Pending 保持系统 Inbox Authority，不进入 Navigation / Tools / Software 等正式日常 presentation 与统计；确定性 URL 结构优先于陈旧分类历史，并加强 canonical intake / 全局 URL identity 去重。
          - R26：全局账户/管理动作收口到右上角；设置/退出保持直达，资源管理/回收站进入可访问的“···”菜单；匿名登录区去掉登录态专属偏移与阴影。
          - Exact Formal Source / Candidate: ${FORMAL_SHA}
          - Previous Stable: ${SOURCE_TAG} / ${SOURCE_SHA}
          - Schema: ${EXPECTED_SCHEMA} unchanged; Migration: NONE.
          - Fresh Install / focused R25-R26 contracts / authenticated+anonymous desktop and 390px Header+Pending browser proof: PASS on Candidate Run ${CANDIDATE_RUN}.
          - Strict 2.47.9→2.47.10 Atomic Update / existing-data preservation / backup+rollback / Security / package contract: PASS on Formal Run ${GITHUB_RUN_ID}.
          - OWNER_PREVIEW_RUNTIME_APPLICABILITY: N_A with reason recorded in docs/release/V2.47.10_RELEASE_GATE.md.
          - Formal Release / Distribution do not imply Production upgraded.
          EOF
          gh release create "$TARGET_TAG" "$ASSETS/VF-Start-V2.47.10-FULL.zip" "$ASSETS/VF-Start-V2.47.10-FULL.zip.sha256" "$ASSETS/VF_Start_V2.47.10_UPDATE.zip" "$ASSETS/VF_Start_V2.47.10_UPDATE.zip.sha256" --repo "$PRODUCT_REPO" --title 'VF Start V2.47.10' --notes-file /tmp/p01-v24710-notes.md --verify-tag
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.prerelease')" = false
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.draft')" = false
          echo P01_V24710_STABLE_RELEASE=PASS

      - name: Independent remote byte readback
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24710-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          rm -rf /tmp/p01-v24710-remote
          mkdir -p /tmp/p01-v24710-remote
          gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24710-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v24710-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']);r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.10-FULL.zip','VF-Start-V2.47.10-FULL.zip.sha256','VF_Start_V2.47.10_UPDATE.zip','VF_Start_V2.47.10_UPDATE.zip.sha256']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest();hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'FORMAL_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24710_REMOTE_BYTES=PASS')
          PY

      - name: Final formal verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS_FROM_CANDIDATE_RUN_35066284358
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PASS
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS_FROM_CANDIDATE_RUN_35066284358
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V24710_FORMAL_RELEASE_GATE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template proven formal candidate /tmp/p01-v24710-*