name: P07 private SQL branch-shape diagnostic exact-source synthetic gate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-sql-guard-shapes-once.yml]
permissions:
  contents: read
jobs:
  exact-shapes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact P07 private source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 36761a4ed245671f7e83dcf3fc3e0b75cede50a1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: _p07_private_sql_shape
      - name: Assert exact source and run only synthetic SQL, menu and baseline negative tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _p07_private_sql_shape rev-parse HEAD)" = 36761a4ed245671f7e83dcf3fc3e0b75cede50a1
          cd _p07_private_sql_shape
          test "$(cat BUILD_ID)" = "0.1.0-release114"
          bash -n bin/vfops-migrate-ui
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ("lib/sql_diff_evidence.py","tests/test_sql_guard_private_shapes.py"):
              ast.parse(Path(name).read_text(encoding="utf-8"),filename=name)
          print("P07_PRIVATE_SQL_SHAPE_PYTHON_SYNTAX_PASS")
          PY
          python3 -B -m unittest -v \
            tests.test_sql_guard_private_shapes \
            tests.test_migration_safe_session_guard \
            tests.test_sql_diff_evidence \
            tests.test_sql_diff_command
          git diff --exit-code 46014482feadb8db61cff71928326eb35791b192..HEAD -- \
            lib/verify.py lib/server_migration_pull.py lib/migration_sql_failure_retention.py
          echo P07_PRIVATE_SQL_SHAPE_EXACT_SOURCE_FAIL_CLOSED_SYNTHETIC_PASS
      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- _p07_private_sql_shape
          echo P07_PRIVATE_SQL_SHAPE_TRANSIENT_SOURCE_CLEANED
