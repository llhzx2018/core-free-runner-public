name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-history162-20261022]
    paths: ['.github/workflows/s01-history162-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.162
  TARGET_SHA: 2be0168bce3d4ba4e9880f06bff532479a3c5ad0
  UPDATE_SHA: 03329e5adda0cd978d28f5f87b54bfc2d4c9b74f
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 03329e5adda0cd978d28f5f87b54bfc2d4c9b74f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='3ad005de80b78d3cf703695aa67690d7a79b5a5f87104592d3e1b2e0f18db844' and m['asset_bytes']==1976859
          assert m['runtime_files']==476 and '1.35.161' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
