name: P07 OneShot v0.5 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - experiments/p07-v05-patch.py
      - .github/workflows/p07-v05-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05
      - name: Apply v0.5 patch
        run: python3 experiments/p07-v05-patch.py
      - name: Validate v0.5
        env:
          NO_COLOR: '1'
          XDG_STATE_HOME: /tmp/p07-v05-state
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F 'P07 Enhanced Bench 0.5.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          ./experiments/p07-bench.sh --demo > /tmp/p07-v05-demo.txt
          grep -F 'Speedtest.net' /tmp/p07-v05-demo.txt | grep -F 'PASS'
          grep -F 'China Unicom, CN' /tmp/p07-v05-demo.txt | grep -F 'PASS'
          grep -F 'China Telecom, CN' /tmp/p07-v05-demo.txt | grep -F 'PASS'
          grep -F 'Carrier Speed' /tmp/p07-v05-demo.txt
          grep -F 'Evidence Quality' /tmp/p07-v05-demo.txt | grep -F 'GOOD'
          grep -F 'Outbound Verdict' /tmp/p07-v05-demo.txt | grep -F 'NORMAL'
          grep -F 'Mainland -> VPS' /tmp/p07-v05-demo.txt | grep -F 'NOT_RUN'
          grep -F 'fallback-only evidence cannot produce NORMAL' experiments/p07-bench.sh
          grep -F 'speed_node_retry' experiments/p07-bench.sh
      - name: Commit v0.5 candidate
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): field-driven network resilience v0.5'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
