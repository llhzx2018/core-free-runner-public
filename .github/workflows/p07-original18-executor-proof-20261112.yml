name: P07 original18 executor source-bound synthetic proof
on:
  push:
    branches:
      - task/p07-original18-executor-proof-20261112-62ea2f
permissions:
  contents: read
concurrency:
  group: p07-original18-executor-proof-20261112-62ea2f
  cancel-in-progress: false
jobs:
  exact-source-frozen-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P07_EXACT_SHA: 62ea2f138b83f8bd85f3362bcb74f64498ad2bf9
    steps:
      - name: Checkout private product only into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 62ea2f138b83f8bd85f3362bcb74f64498ad2bf9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact Git identity and compile original18 executor
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/VERSION)" = "0.1.0"
          test "$(cat product/BUILD_ID)" = "0.1.0-release143"
          python3 -B -m py_compile product/lib/migration_original_18_data_switch.py product/lib/migration_original_18_frozen_pipeline.py product/tests/test_p07_original_18_data_switch.py product/tests/test_p07_original_18_frozen_pipeline.py
          echo P07_ORIGINAL18_EXACT_SOURCE_COMPILE=PASS
      - name: Run focused synthetic frozen recovery and rollback tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_data_switch tests.test_p07_original_18_frozen_pipeline tests.test_p07_original_18_owner_window tests.test_p07_original_18_protected_preparation)
          echo P07_ORIGINAL18_FROZEN_ROLLBACK_SYNTHETIC=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Remove exact private source from public runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_PRODUCT_SOURCE_CLEANED=YES
