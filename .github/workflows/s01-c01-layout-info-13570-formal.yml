name: S01-C01 layout professional information formal release
on:
  push:
    branches: [task/s01-c01-layout-info-13570-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.70'
      TARGET_SHA: '9ba3d15eb9503175e61451001d416ddb2067b4fa'
      TARGET_TREE: 'af3b73dd789b0d07874653251b36b804d43911c1'
      SOURCE_VERSION: '1.35.69'
      BASE_SHA: '1b8c8ec94fb5f180c17a2e122939407add60d745'
      CANDIDATE_RUN: '37007580574'
      CANDIDATE_SHA: '7abbc366a6afc762a42f1b1ac32f3ef1d6a6d5bc'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-layout-v8-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .fixture_browser=="PASS" and .brand_persistence=="PASS" and .brand_csrf=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .choice_controls=="PASS" and .recovery_controls=="PASS" and .number_controls=="PASS" and .preview_controls=="PASS" and .preview_scroll=="PASS" and .advanced_controls=="PASS" and .advanced_interactions=="PASS" and .layout_browser=="PASS" and .layout_cases==120 and .layout_persistence=="PASS" and .layout_csrf=="PASS" and .layout_modal_keyboard=="PASS" and .layout_information_hierarchy=="PASS" and .layout_save_no_occlusion=="PASS" and .layout_module_affordance=="PASS" and .layout_module_provenance=="PASS" and .layout_module_enable=="PASS" and .layout_controls_runtime_identity=="PASS" and .layout_controls_reused==true and .layout_all_controls=="PASS" and .layout_control_cases==40 and .layout_control_checks>1000 and .layout_section_isolation=="PASS" and .layout_mouse_wheel=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-layout-info-13570 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          页面布局：专业信息按“配置来源”“功能与前台对应”“模块与前台对应”分为默认收起的说明组，避免展开后重复铺满功能和模块标题。保存状态直接可见，原有信息和检查入口按需查看。模块对应区隐藏排序操作提示，说明层级与编辑区清楚区分。
          原生说明组支持点击及键盘展开；窄屏保持可读，说明组不改变编辑分区或输入。
          Exact candidate Run: $CANDIDATE_RUN。20 页型 × 6 宽度的实际 WordPress 布局回归，以及 69→70 原生升级、恢复 69、重新应用 70 和既有回归通过。
          本轮 OWNER 验收范围为 UX/UI；机器检查不替代升级后的 OWNER 视觉裁决。发布前独立 Preview Runtime 按项目 SSOT 为 N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-layout-v8-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
