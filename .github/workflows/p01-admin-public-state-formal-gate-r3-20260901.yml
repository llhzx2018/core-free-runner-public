name: P01 Admin Public State Formal Gate R3
on:
  push:
    branches: [temp/p01-admin-public-state-clarity-20260901]
    paths: [.github/workflows/p01-admin-public-state-formal-gate-r3-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: aeee995f8a4b10f330938151bbc05b9fe5c74e82
      BASE: 5ee91a4e0c2ce66a5c22850ae09b1bd6c7cd8081
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-admin-public-state-gate/evidence
      PORT: 18541
      ADMIN_PASS: P01StateClarityGate2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-admin-public-state-clarity-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: aeee995f8a4b10f330938151bbc05b9fe5c74e82
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Execute exact formal gate scripts with mobile selector fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('runner/.github/workflows/p01-admin-public-state-formal-gate-20260901.yml').read_text().splitlines()
          targets=[
            'Exact source, scope and syntax fence',
            'Fresh Runtime',
            'Seed public and private resources',
            'Chromium role, preview, login and security gate',
            'SQLite integrity and FK',
          ]
          out=[]
          for i,name in enumerate(targets,1):
              marker=f'      - name: {name}'
              try: start=src.index(marker)
              except ValueError: raise SystemExit(f'missing gate step: {name}')
              run=None
              for j in range(start+1,len(src)):
                  if j>start+1 and src[j].startswith('      - '): break
                  if src[j].strip()=='run: |': run=j+1; break
              if run is None: raise SystemExit(f'missing run block: {name}')
              body=[]
              for j in range(run,len(src)):
                  line=src[j]
                  if line.startswith('      - '): break
                  body.append(line[10:] if line.startswith('          ') else line)
              text='\n'.join(body)+'\n'
              if name=='Chromium role, preview, login and security gate':
                  old="await p.locator('#loginButton').click();await p.waitForURL(u=>u.pathname.endsWith('/start.php')&&!u.searchParams.has('public_view'));"
                  new="await p.locator(width===390?'#mobileAccount':'#loginButton').click();await p.waitForURL(u=>u.pathname.endsWith('/start.php')&&!u.searchParams.has('public_view'));"
                  if text.count(old)!=1: raise SystemExit(f'mobile selector patch fence failed: {text.count(old)}')
                  text=text.replace(old,new,1)
              p=Path(f'/tmp/p01-state-gate-step-{i}.sh');p.write_text(text);out.append(str(p))
          Path('/tmp/p01-state-gate-steps.txt').write_text('\n'.join(out)+'\n')
          PY
          while IFS= read -r step; do echo "== RUN $step =="; bash "$step"; done </tmp/p01-state-gate-steps.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-admin-public-state-gate-r3-${{ github.run_id }}
          path: /tmp/p01-admin-public-state-gate/evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-admin-public-state-gate.pid 2>/dev/null)" 2>/dev/null || true
