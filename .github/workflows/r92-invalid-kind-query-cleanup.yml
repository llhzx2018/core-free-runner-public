name: R92 Focused Invalid Kind Query Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r92-invalid-kind-query-cleanup.yml'

permissions:
  contents: read

jobs:
  r92-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ea3cb43b13e1c15318e8d5c8b06d7057230c8c5f
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ea3cb43b13e1c15318e8d5c8b06d7057230c8c5f
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/subject_invalid_kind_query_contract.php
          php tests/unit/subject_invalid_kind_query_contract.php
          php tests/unit/subject_filter_reset_contract.php
          php tests/unit/topic_course_search_chip_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          echo R92_SUBJECT_INVALID_KIND_QUERY_PASS
          echo R92_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
