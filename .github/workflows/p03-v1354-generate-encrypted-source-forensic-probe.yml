name: P03 V1.35.4 Generate Encrypted Source Forensic Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-generate-encrypted-source-forensic-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-generate-encrypted-source-forensic-probe
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORRECTIVE_BRANCH: repair/v1.35.4-source-exact-reconcile
      CORRECTIVE_HEAD: b37b98d118f6fea4fad5af825b0606eb14e90854
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      EXPECTED_PRODUCT_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      EXPECTED_RUNTIME_FINGERPRINT: 2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083
      EXPECTED_MEMORY_SHA: 1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7
      EXPECTED_MEMORY_BYTES: '4497'
      MINIMAL_GATE_RUN: '31998054021'
      MINIMAL_GATE_JOB: '95293201793'
      PHP_IMAGE: php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7

    steps:
      - name: Checkout public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout corrective tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CORRECTIVE_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: corrective

      - name: Checkout Frozen V1.35.4 Product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.FROZEN_PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Verify exact source identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C corrective rev-parse HEAD)" = "$CORRECTIVE_HEAD"
          test "$(git -C product rev-parse HEAD)" = "$FROZEN_PRODUCT_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -f corrective/scripts/corrective/finalize_v1354_source_forensic_probe.py
          echo 'CORRECTIVE_GIT_IDENTITY=PASS'
          echo 'FROZEN_PRODUCT_GIT_IDENTITY=PASS'

      - name: Build exact Frozen Runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf runtime formal secure-out
          mkdir -p runtime formal secure-out
          python3 product/scripts/build_runtime.py runtime >/dev/null
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          s=importlib.util.spec_from_file_location('scope',Path('corrective/scripts/corrective/v1354_source_exact_scope.py'))
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          o=m.assert_frozen_runtime(Path('runtime'))
          assert o['runtime_files']==42
          assert o['runtime_fingerprint']=='2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083'
          assert o['source_manifest_sha256']=='07103a75ce7841cb2ede11cd30a822830cf255f991195eb05391282e6e50ec47'
          assert o['memory_api_bytes']==4497
          assert o['memory_api_sha256']=='1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7'
          print('FROZEN_RUNTIME_IDENTITY=PASS')
          PY

      - name: Generate unique formal forensic Probe
        id: formal
        shell: bash
        run: |
          set -Eeuo pipefail
          SUFFIX="$(openssl rand -hex 6)"
          NAME="vf-forge-v1354-source-forensic-${SUFFIX}.php"
          python3 corrective/scripts/corrective/finalize_v1354_source_forensic_probe.py \
            --runtime-root runtime --output-dir formal --filename "$NAME" > formal/build-metadata.json
          python3 - <<'PY' > formal/env.out
          import hashlib,json,re
          from pathlib import Path
          m=json.loads(Path('formal/build-metadata.json').read_text())
          name=m['filename']; p=Path('formal')/name; raw=p.read_bytes()
          assert re.fullmatch(r'vf-forge-v1354-source-forensic-[0-9a-f]{12}\.php',name)
          assert len(raw)==m['bytes']
          assert hashlib.sha256(raw).hexdigest()==m['sha256']
          assert m['get_only'] is True and m['csrf']=='NOT_APPLICABLE' and m['self_cleanup'] is False
          assert m['production_write']==0 and m['db_write']==0 and m['provider_write']==0 and m['migration']==0
          assert m['product_commit']=='af34b84a3135333cf05077b3eb64e22ef6b3afef'
          assert m['product_tree']=='08eee7e8c891a57c357553dd5de20c1a7bd79849'
          assert m['runtime_files']==42
          assert m['runtime_fingerprint']=='2fd3ebbbebfd7155371fe44664715cbe34f63cfb98dfeb691bba90d4864ca083'
          assert m['memory_api_bytes']==4497
          assert m['memory_api_sha256']=='1c9b784d0a1c8cb8f9245c4c9bc7af6511c55006de5fd3fefa796b1ec438a9b7'
          print('filename='+name)
          print('bytes='+str(len(raw)))
          print('sha256='+hashlib.sha256(raw).hexdigest())
          PY
          cat formal/env.out
          while IFS='=' read -r k v; do echo "$k=$v" >> "$GITHUB_OUTPUT"; done < formal/env.out
          echo 'FORMAL_PROBE_SHA=LOCKED'

      - name: PHP 8.4 syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$PWD/formal:/formal:ro" "$PHP_IMAGE" \
            php -l "/formal/${{ steps.formal.outputs.filename }}"
          echo 'PHP_SYNTAX=PASS'

      - name: Static GET-only and no-write gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "formal/${{ steps.formal.outputs.filename }}" <<'PY'
          from pathlib import Path
          import re,sys
          text=Path(sys.argv[1]).read_text()
          banned=['file_put_contents','fopen(','rename(','unlink(','copy(','mkdir(','chmod(','touch(',
                  'vfab_require_admin(','vfab_require_csrf(','vfab_csrf_token(','vfab_db(']
          for token in banned:
              assert token not in text, f'BANNED_WRITE_TOKEN:{token}'
          assert not re.search(r"['\"]\s*(UPDATE|INSERT|DELETE|ALTER|CREATE|DROP|REPLACE)\b",text,re.I)
          assert "REQUEST_METHOD']??'GET')!=='GET'" in text
          assert "'METHOD_NOT_ALLOWED'" in text
          assert 'PRAGMA query_only=ON' in text
          assert 'PRAGMA integrity_check' in text
          assert 'PRAGMA foreign_key_check' in text
          assert 'session_abort()' in text
          assert "if($rel==='app/.runtime.php')continue;" in text
          print('GET_ONLY_STATIC=PASS')
          print('NO_POST=PASS')
          print('NO_CSRF_REQUIREMENT=PASS')
          print('NO_WRITE_STATIC_SCAN=PASS')
          PY

      - name: Encrypt Probe with ephemeral sandbox public key
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > secure-out/recipient-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA8TQP59InNlwWA+tWWN/B
          E7cPE5k+iLiFknhuUP0PR44Wrpr0FsrjIJY6pbplhX7Nb6EEHghIU9ZwOWjHa9JA
          MF0QJG51DUF5FHhj5u/VCFFT5dxm3zZrBLtrsxk1X3T4aC4MY139sXuZnpBGoV8k
          U6jboMGe3/gQ+uQuztz5M1/usGJRPHSYVGcv7n7FatUJANIuoJbDUf1lTvPDly13
          N7Trqphi/WC1xJ7aMoxCtANNzqYuU2niezRT9BHDnU380HLsE1+gW4xEqryOAL2p
          ONDJLvVN+HgyTEbmX+/WHPHLLgcXMsoO/w0wFI4/o0sganejHJvRi3Vr7nkoDfAY
          eLr1osTfL70lXablyS6vpmBLOuPqKR2p7ttAUy4/NjD6Er3liT6rYV71DoAcJuU0
          lfnheUuCx8rsvE5P2uO3bCtKg4TdmSwCXw1ErSDlZEOSRG2EGUdQbbcg5stkBZYb
          oiFxrVBo52Z/3THUvop2pSIQQTj30Z1FqsxXNEGjJR0vAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          openssl rand 32 > secure-out/aes.key
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:secure-out/aes.key \
            -in "formal/${{ steps.formal.outputs.filename }}" \
            -out secure-out/probe.php.enc
          openssl pkeyutl -encrypt -pubin -inkey secure-out/recipient-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in secure-out/aes.key -out secure-out/aes.key.rsa
          cp formal/build-metadata.json secure-out/build-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('secure-out/build-metadata.json'); m=json.loads(p.read_text())
          m.update({
            'php_syntax':'PASS',
            'minimal_gate_run':31998054021,
            'minimal_gate_job':95293201793,
            'minimal_gate':'PASS',
            'get_only_static':'PASS',
            'no_post':'PASS',
            'no_csrf_requirement':'PASS',
            'no_write_static_scan':'PASS',
            'encrypted_bridge':'RSA_OAEP_SHA256_PLUS_AES256_CBC_PBKDF2',
            'public_artifact_contains_plaintext':False,
            'production_write':0,
            'db_write':0,
            'provider_write':0,
            'migration':'NOT_EXECUTED',
            'm030':'NOT_RERUN',
            'self_cleanup':'NO',
            'main_promotion':'NOT_EXECUTED',
            'v1_35_5':'NOT_CREATED'
          })
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum secure-out/probe.php.enc secure-out/aes.key.rsa secure-out/build-metadata.json > secure-out/ENCRYPTED_SHA256SUMS.txt
          shred -u secure-out/aes.key
          shred -u "formal/${{ steps.formal.outputs.filename }}"
          test ! -e "formal/${{ steps.formal.outputs.filename }}"
          echo 'PLAINTEXT_PROBE_AFTER_ENCRYPTION=0'

      - name: Upload encrypted forensic artifact only
        uses: actions/upload-artifact@v4
        with:
          name: P03_V1.35.4_PRODUCTION_SOURCE_FORENSIC_PROBE_ENCRYPTED
          path: |
            secure-out/probe.php.enc
            secure-out/aes.key.rsa
            secure-out/build-metadata.json
            secure-out/ENCRYPTED_SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

      - name: Verify plaintext absent
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "formal/${{ steps.formal.outputs.filename }}"
          test ! -e secure-out/aes.key
          test -f secure-out/probe.php.enc
          test -f secure-out/aes.key.rsa
          echo 'PUBLIC_ARTIFACT_PLAINTEXT=0'
          echo 'PRODUCTION_WRITE=0'
          echo 'PRODUCTION_DB_WRITE=0'
          echo 'PROVIDER_WRITE=0'
          echo 'MIGRATION=NOT_EXECUTED'
          echo 'M030=NOT_RERUN'
          echo 'SELF_CLEANUP=NO'

      - name: Final verdict
        shell: bash
        run: |
          echo 'FORMAL_PRODUCTION_FORENSIC_PROBE=GENERATED_AND_ENCRYPTED'
          echo 'FILENAME=${{ steps.formal.outputs.filename }}'
          echo 'BYTES=${{ steps.formal.outputs.bytes }}'
          echo 'SHA256=${{ steps.formal.outputs.sha256 }}'
          echo 'PHP_SYNTAX=PASS'
          echo 'GET_ONLY=PASS'
          echo 'NO_POST=PASS'
          echo 'NO_CSRF_REQUIREMENT=PASS'
          echo 'NO_WRITE_STATIC_SCAN=PASS'
          echo 'PUBLIC_ARTIFACT_PLAINTEXT=0'
          echo 'NEXT=DOWNLOAD_DECRYPT_VERIFY_AND_STOP_FOR_SINGLE_USER_ACTION'
