name: P04 V2.8.5 Settings Single Page and Route Scroll Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v285-settings-scroll-candidate.yml'
      - 'requests/p04-v285-settings-scroll.txt'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      P04_REPOSITORY: llhzx2018/vf-infra
      EXPECTED_BASE: 53ab528e0f8ec26d4f6f1f071e8ce268c364607d
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 develop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P04_REPOSITORY }}
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3
          ini-file: production

      - name: Patch V2.8.5 UX
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise SystemExit(f'{label}_SENTINEL count={s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          shell=Path('public/assets/v271-unified-shell.js')
          s=shell.read_text(encoding='utf-8')
          old="    section = allowed.has(section) ? section : 'basic';"
          new="    section = allowed.has(section) ? section : 'basic';\n    if (section === 'backup') section = 'data';\n    if (section === 'diagnostics') section = 'system';"
          if s.count(old)!=1: raise SystemExit('V285_SETTINGS_ALIAS_SENTINEL')
          s=s.replace(old,new,1)
          old="    else if (section === 'data') body = renderData(payload);"
          new="    else if (section === 'data') body = renderData(payload) + renderBackup(payload);"
          if s.count(old)!=1: raise SystemExit('V285_DATA_COMBINE_SENTINEL')
          s=s.replace(old,new,1)
          old="    else if (section === 'system') body = renderSystem(payload);"
          new="    else if (section === 'system') body = renderSystem(payload) + renderDiagnostics(payload);"
          if s.count(old)!=1: raise SystemExit('V285_SYSTEM_COMBINE_SENTINEL')
          s=s.replace(old,new,1)
          old="    const sub = ['data','backup','security'].includes(section) ? settingsSubtabs([['data','导入导出'],['backup','备份恢复'],['security','账号与安全']], section) : ['update','system','diagnostics'].includes(section) ? settingsSubtabs([['update','系统更新'],['system','系统信息'],['diagnostics','诊断']], section) : '';"
          if s.count(old)!=1: raise SystemExit('V285_SUBTAB_SENTINEL')
          s=s.replace(old,"    const sub = '';",1)
          shell.write_text(s,encoding='utf-8')

          nav=Path('public/assets/v280-navigation-simplify.js')
          s=nav.read_text(encoding='utf-8')
          old="    reconcileNestedNav(routeRoot.querySelector('.v271-settings-content'), section);"
          new="    routeRoot.querySelector('.v280-settings-subnav')?.remove();"
          if s.count(old)!=1: raise SystemExit('V285_NESTED_TAB_SENTINEL')
          s=s.replace(old,new,1)
          nav.write_text(s,encoding='utf-8')

          scroll=Path('public/assets/v278-route-scroll-reset.js')
          scroll.write_text(r"""(() => {
            'use strict';

            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

            const app = document.getElementById('v270-app');
            let pendingRouteReset = true;
            let pendingRaw = (location.hash || '#overview').slice(1);
            let settleTimer = null;

            function resetScrollPosition() {
              document.documentElement.scrollTop = 0;
              document.body.scrollTop = 0;
              window.scrollTo(0, 0);
              const workspace = document.querySelector('.v270-workspace');
              if (workspace) workspace.scrollTop = 0;
              if (app) app.scrollTop = 0;
            }

            function settleReset() {
              resetScrollPosition();
              requestAnimationFrame(() => {
                resetScrollPosition();
                requestAnimationFrame(resetScrollPosition);
              });
              clearTimeout(settleTimer);
              settleTimer = window.setTimeout(resetScrollPosition, 120);
            }

            function expectRouteReset() {
              pendingRouteReset = true;
              pendingRaw = (location.hash || '#overview').slice(1);
              settleReset();
            }

            function routeRendered() {
              if (!pendingRouteReset || !app) return false;
              const route = app.querySelector('[data-v271-route]');
              if (!route) return false;
              const renderedRaw = String(route.dataset.v271Route || '');
              if (renderedRaw !== pendingRaw) return false;
              pendingRouteReset = false;
              settleReset();
              return true;
            }

            window.addEventListener('hashchange', expectRouteReset, true);
            window.addEventListener('popstate', expectRouteReset, true);
            document.addEventListener('click', (event) => {
              if (!event.target.closest('[data-v270-nav]')) return;
              pendingRouteReset = true;
              queueMicrotask(() => {
                pendingRaw = (location.hash || '#overview').slice(1);
                settleReset();
                routeRendered();
              });
            }, true);

            if (app) {
              new MutationObserver(() => routeRendered()).observe(app, { childList: true, subtree: true });
            }
            settleReset();
            routeRendered();
          })();
          """,encoding='utf-8')

          Path('VERSION').write_text('2.8.5\n',encoding='utf-8')

          tree=Path('scripts/build-release-tree.py')
          s=tree.read_text(encoding='utf-8')
          old="'2.8.0','2.8.1','2.8.2','2.8.3'}"
          new="'2.8.0','2.8.1','2.8.2','2.8.3','2.8.4','2.8.5'}"
          if s.count(old)!=1: raise SystemExit('V285_RELEASE_TREE_MAINTENANCE_SENTINEL')
          s=s.replace(old,new,1)
          old="if version=='2.8.3':\n    version_note='V2.8.3 fixes the Atomic post-repair integrity gate so target-file verification is independent from the stale in-process bootstrap version constant, while retaining full Source Exact Reconciliation, rollback, Schema 14 and read-only-first Provider authority.'"
          new="if version=='2.8.5':\n    version_note='V2.8.5 keeps the primary Settings sidebar while removing nested content tabs: Data Management now shows Import/Export and Backup/Restore in one continuous page, System Information shows System Information and Diagnostics in one continuous page, and async top-level route rendering now resets scroll only on route entry so Provider opens at the page top without disrupting same-page refresh position.'\nelif version=='2.8.3':\n    version_note='V2.8.3 fixes the Atomic post-repair integrity gate so target-file verification is independent from the stale in-process bootstrap version constant, while retaining full Source Exact Reconciliation, rollback, Schema 14 and read-only-first Provider authority.'"
          if s.count(old)!=1: raise SystemExit('V285_RELEASE_NOTE_SENTINEL')
          tree.write_text(s.replace(old,new,1),encoding='utf-8')

          parent=Path('scripts/build-v284-update-release.py').read_text(encoding='utf-8')
          v285=parent.replace('2.8.4','2.8.5').replace('V284','V285').replace('v284','v285')
          old="ALLOWED_SOURCES = ['2.7.9', '2.8.0', '2.8.1', '2.8.2', '2.8.3']"
          new="ALLOWED_SOURCES = ['2.7.9', '2.8.0', '2.8.1', '2.8.2', '2.8.3', '2.8.4']"
          if v285.count(old)!=1: raise SystemExit('V285_ALLOWED_SOURCE_TOP_SENTINEL')
          v285=v285.replace(old,new,1)
          old="new_allowed = \"const VF_INFRA_ATOMIC_ALLOWED_SOURCES_JSON='[\\\"{SOURCE}\\\",\\\"2.8.0\\\",\\\"2.8.1\\\",\\\"2.8.2\\\",\\\"2.8.3\\\"]';\""
          new="new_allowed = \"const VF_INFRA_ATOMIC_ALLOWED_SOURCES_JSON='[\\\"{SOURCE}\\\",\\\"2.8.0\\\",\\\"2.8.1\\\",\\\"2.8.2\\\",\\\"2.8.3\\\",\\\"2.8.4\\\"]';\""
          if v285.count(old)!=1: raise SystemExit('V285_ALLOWED_SOURCE_REPAIR_SENTINEL')
          v285=v285.replace(old,new,1)
          v285=v285.replace("package_manifest['release_kind'] = 'long_action_ux_source_exact_runtime_safe_verify'","package_manifest['release_kind'] = 'settings_single_page_route_scroll_source_exact_runtime_safe_verify'")
          v285=v285.replace("package_manifest['long_action_feedback_contract'] = 'V285_IMMEDIATE_BUSY_INDETERMINATE_PROGRESS_DUPLICATE_GUARD_GENERIC_SLOW_POST'","package_manifest['long_action_feedback_contract'] = 'V284_IMMEDIATE_BUSY_INDETERMINATE_PROGRESS_DUPLICATE_GUARD_GENERIC_SLOW_POST'")
          Path('scripts/build-v285-update-release.py').write_text(v285,encoding='utf-8')

          notes=Path('docs/operations/package/RELEASE_NOTES.md')
          n=notes.read_text(encoding='utf-8')
          prefix="""# VF Infra V2.8.5\n\n- 设置保留左侧主分栏，不再在右侧增加二级 TAB。\n- 数据管理同页连续显示“导入导出 → 备份恢复”。\n- 系统信息同页连续显示“系统信息 → 诊断”。\n- 进入服务商等一级页面时，在异步页面真正渲染完成后回到页面顶部；同页刷新/同步不强制改变当前位置。\n- 保留 V2.8.4 长耗时操作 Busy/进度提示、防重复点击，以及 Source Exact、备份、回滚和 Schema 14。\n\n"""
          if not n.startswith('# VF Infra V2.8.5'):
              notes.write_text(prefix+n,encoding='utf-8')

          changelog=Path('CHANGELOG.md')
          c=changelog.read_text(encoding='utf-8')
          prefix="""## V2.8.5\n\n- Settings：保留左侧分栏，取消右侧嵌套 TAB；数据管理和系统信息改成各自单页连续内容。\n- Navigation：修复服务商等异步一级路由进入后继承中段滚动位置的问题，仅在路由进入时复位到顶部。\n- Schema 14，无 Migration，无 Provider 写权限变化。\n\n"""
          if not c.startswith('## V2.8.5'):
              changelog.write_text(prefix+c,encoding='utf-8')
          PY

      - name: Candidate gates
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v278-route-scroll-reset.js
          node --check public/assets/v280-navigation-simplify.js
          node --check public/assets/v284-long-action-feedback.js
          php -l public/index.php >/dev/null
          python3 -m py_compile scripts/build-release-tree.py scripts/build-v285-update-release.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/assets/v271-unified-shell.js').read_text(encoding='utf-8')
          checks={
            'left_sidebar_retained':'v271-settings-layout' in s and 'settingsNav(section)' in s,
            'data_combined':"body = renderData(payload) + renderBackup(payload);" in s,
            'system_combined':"body = renderSystem(payload) + renderDiagnostics(payload);" in s,
            'legacy_backup_maps_parent':"if (section === 'backup') section = 'data';" in s,
            'legacy_diagnostics_maps_parent':"if (section === 'diagnostics') section = 'system';" in s,
            'nested_subtabs_disabled':"const sub = '';" in s,
          }
          nav=Path('public/assets/v280-navigation-simplify.js').read_text(encoding='utf-8')
          checks['v280_nested_nav_not_inserted']="reconcileNestedNav(routeRoot.querySelector('.v271-settings-content'), section);" not in nav
          sc=Path('public/assets/v278-route-scroll-reset.js').read_text(encoding='utf-8')
          checks['post_render_route_reset']='MutationObserver' in sc and 'routeRendered()' in sc and 'pendingRouteReset' in sc
          checks['no_same_page_refresh_forced']='provider_accounts_sync_all' not in sc and 'fetch' not in sc
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('V285_UX_GATE_FAIL '+','.join(bad))
          print('V285_UX_CONTRACT_PASS', checks)
          PY
          rm -rf "$RUNNER_TEMP/v285-runtime" "$RUNNER_TEMP/v285-update"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v285-runtime" | tee "$RUNNER_TEMP/release-tree.json"
          test "$(cat "$RUNNER_TEMP/v285-runtime/VERSION.txt")" = '2.8.5'
          jq -e '.version=="2.8.5" and .target_schema==14 and .release_kind=="maintenance_release"' "$RUNNER_TEMP/v285-runtime/release-manifest.json" >/dev/null
          python3 scripts/build-v285-update-release.py --target-runtime "$RUNNER_TEMP/v285-runtime" --output "$RUNNER_TEMP/v285-update" | tee "$RUNNER_TEMP/update-build.json"
          php "$RUNNER_TEMP/v285-update/repair-v2.8.5.php" --self-test | tee "$RUNNER_TEMP/atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.5 schema=14' "$RUNNER_TEMP/atomic-self-test.txt"
          jq -e '.version=="2.8.5" and .allowed_source_versions==["2.7.9","2.8.0","2.8.1","2.8.2","2.8.3","2.8.4"] and .release_kind=="settings_single_page_route_scroll_source_exact_runtime_safe_verify"' "$RUNNER_TEMP/v285-update/PACKAGE_MANIFEST.json" >/dev/null
          unzip -t "$RUNNER_TEMP/v285-update/VF_Infra_V2.8.5_UPDATE.zip" >/dev/null
          test "$(unzip -Z1 "$RUNNER_TEMP/v285-update/VF_Infra_V2.8.5_UPDATE.zip" | wc -l | tr -d ' ')" = 1
          test "$(unzip -Z1 "$RUNNER_TEMP/v285-update/VF_Infra_V2.8.5_UPDATE.zip")" = 'repair-v2.8.5.php'
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          d=Path(os.environ['RUNNER_TEMP'])/'v285-update'
          runtime=Path(os.environ['RUNNER_TEMP'])/'v285-runtime'
          update=d/'VF_Infra_V2.8.5_UPDATE.zip'
          report={
            'status':'PASS','version':'2.8.5','schema':14,
            'left_settings_sidebar':'RETAINED',
            'nested_settings_tabs':'REMOVED',
            'data_management':'IMPORT_EXPORT_PLUS_BACKUP_RESTORE_ONE_PAGE',
            'system_information':'SYSTEM_INFO_PLUS_DIAGNOSTICS_ONE_PAGE',
            'owned_route_post_render_scroll_reset':'PASS',
            'same_page_refresh_scroll_preservation_contract':'PASS',
            'allowed_sources':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4'],
            'runtime_file_count':json.loads((runtime/'release-manifest.json').read_text())['file_count']+1,
            'source_manifest_sha256':hashlib.sha256((d/'PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt').read_bytes()).hexdigest(),
            'update_bytes':update.stat().st_size,
            'update_sha256':hashlib.sha256(update.read_bytes()).hexdigest(),
            'production_write':0,
          }
          Path(os.environ['GITHUB_WORKSPACE'],'evidence','P04_V285_CANDIDATE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - name: Commit exact tested candidate to develop
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION CHANGELOG.md docs/operations/package/RELEASE_NOTES.md scripts/build-release-tree.py scripts/build-v285-update-release.py public/assets/v271-unified-shell.js public/assets/v278-route-scroll-reset.js public/assets/v280-navigation-simplify.js
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(P04): simplify settings pages and reset owned-route scroll'
          git push origin HEAD:develop
          echo "P04_V285_CANDIDATE_SOURCE=$(git rev-parse HEAD)" | tee -a "$GITHUB_WORKSPACE/evidence/identity.txt"
          echo 'PRODUCTION_WRITE=0' | tee -a "$GITHUB_WORKSPACE/evidence/identity.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.5-CANDIDATE-EVIDENCE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
