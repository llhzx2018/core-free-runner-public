name: TEMP S01-C02 Ops 1.21.809 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121809-build-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATES_REPO: llhzx2018/core-updates
      UPDATES_BASE: af6bf84d28596463cbe0ff90343e872b55d0326d
      UPDATES_CANDIDATE: 037749a9a6f0d57dfa029eb953038dda06953713
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_COMMIT: e4c5fc3dece349ca23f0fea361d55709d4b3f82c
      OPS_TREE: ca276d4944c31dd9dd1f3f20a36b5db8fe03051f
      TAG: v1.21.809
      ASSET: vf-tools-ops_V1.21.809.zip
      BYTES: '3212888'
      SHA256: 16e25d8dabc18e1b0f50e16f10dc78c57f05e141ecb7d6fdcbb1d00f4261efdf
      FILES: '898'
      FP: 79b8508366c378a14c3c70b43b6d093ed5fe80b090da7eeb1d486db333a75ca5
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify manifest source scope and formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_CANDIDATE"
          git -C updates diff --name-only "$UPDATES_BASE" "$UPDATES_CANDIDATE" | sort >/tmp/changed.txt
          printf '%s\n' 'projects/S01-C02.json' >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          M=updates/projects/S01-C02.json
          jq -e --arg sha "$SHA256" --arg fp "$FP" '.target_version=="1.21.809" and .from_versions==["1.21.808"] and .release_tag=="v1.21.809" and .asset_name=="vf-tools-ops_V1.21.809.zip" and .asset_bytes==3212888 and .asset_sha256==$sha and .runtime_files==898 and .runtime_file_count==898 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$M" >/dev/null
          grep -Fq 'Production Upgrade is NOT EXECUTED' "$M"
          grep -Fq 'Existing Static Source artifacts remain reusable' "$M"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$J")" = "$TAG"
          test "$(jq -r .draft <<<"$J")" = false
          test "$(jq -r .prerelease <<<"$J")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$J")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$J")" = "sha256:$SHA256"
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$OPS_COMMIT"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$OPS_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$OPS_TREE"
          done
          echo FORMAL_RELEASE_ASSET=PASS
      - name: Verify direct Production source authority
        run: |
          set -Eeuo pipefail
          OUT=/tmp/domain.json
          CODE="$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$OUT" -w '%{http_code}' 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          test "$CODE" = 200
          jq -e '.pluginVersion=="1.21.808" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' "$OUT" >/dev/null
          echo DIRECT_SOURCE_1_21_808_ONLY=PASS
          echo PASS_V121809_UPDATE_CHANNEL_GATE
