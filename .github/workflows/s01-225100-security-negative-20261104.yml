name: S01 225-100 exact M3U8 security and recovery negative gates
on:
  push:
    branches: [test/s01-three-component-225-100-candidates-20261104]
    paths: ['.github/workflows/s01-225100-security-negative-20261104.yml']
permissions: {contents: read}
jobs:
  exact-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 20f5ce58567c5380843229c6e737a7d1f0a498e7
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: m3u8
      - name: Exact current M3U8 source and release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = 20f5ce58567c5380843229c6e737a7d1f0a498e7
          test "$(cat m3u8/VERSION)" = 1.25.100
          grep -Fq "Version: 1.25.100" m3u8/src/vf-tool-m3u8.php
          echo S01_225100_EXACT_M3U8_SECURITY_SOURCE=PASS
      - name: Run real source negative security and protected recovery tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd m3u8
          node tests/browser-stream-safety.node.cjs
          node tests/r8-backup-default-snapshot-order.node.cjs
          node tests/r8-backup-rollback-failclosed.node.cjs
          node tests/r8-v6-runtime-asset-seal.node.cjs
          node tests/r8-production-bundle-parity.node.cjs
          node tests/vod-required-init-segment.node.cjs
          node tests/r3-output-and-cancel.node.cjs
          echo S01_225100_SEALED_RUNTIME_SIGNED_URL_PRIVACY_BACKUP_FAILURE_AND_CANCEL=PASS
      - name: Clear private source
        if: always()
        run: rm -rf m3u8
