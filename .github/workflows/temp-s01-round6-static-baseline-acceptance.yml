name: TEMP S01 Round6 Static Baseline Acceptance

on:
  push:
    branches:
      - temp/s01-c02-v121798-production-readback-20260903
    paths:
      - '.github/workflows/temp-s01-round6-static-baseline-acceptance.yml'

permissions:
  contents: read

jobs:
  static-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Crawl current Pages baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/evidence
          python3 - <<'PY'
          import json, re, subprocess, urllib.parse, xml.etree.ElementTree as ET, pathlib
          base='https://ilovem3u8.pages.dev'
          def curl(url):
              p=subprocess.run(['curl','-LsS','--max-time','20','--retry','1','-D','/tmp/h','-o','/tmp/b','-w','%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}',url],capture_output=True,text=True)
              body=pathlib.Path('/tmp/b').read_text(errors='replace') if pathlib.Path('/tmp/b').exists() else ''
              return p.returncode,(p.stdout.strip().split('\t')+['','','',''])[:4],body,p.stderr.strip()
          rc,meta,sitemap,err=curl(base+'/sitemap.xml')
          if rc or meta[0]!='200': raise SystemExit('sitemap fetch failed: '+str((rc,meta,err)))
          root=ET.fromstring(sitemap)
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text.strip() for x in root.findall('.//s:loc',ns) if x.text]
          if not urls:
              urls=[x.text.strip() for x in root.findall('.//loc') if x.text]
          rows=[]
          internal_links=set()
          domain_refs={'pages_dev_canonical':0,'final_domain_canonical':0,'source_domain_canonical':0,'other_canonical':0}
          for url in urls[:150]:
              rc,meta,body,err=curl(url)
              low=body.lower()
              m=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',body,re.I)
              if not m: m=re.search(r'<link[^>]+href=["\']([^"\']+)["\'][^>]+rel=["\']canonical["\']',body,re.I)
              canonical=m.group(1).strip() if m else ''
              if canonical.startswith('https://ilovem3u8.pages.dev'): domain_refs['pages_dev_canonical']+=1
              elif canonical.startswith('https://ilovem3u8.com') or canonical.startswith('https://www.ilovem3u8.com'): domain_refs['final_domain_canonical']+=1
              elif canonical.startswith('https://www3.m3u8.one'): domain_refs['source_domain_canonical']+=1
              elif canonical: domain_refs['other_canonical']+=1
              for href in re.findall(r'href=["\']([^"\'#]+)',body,re.I):
                  absolute=urllib.parse.urljoin(url,href)
                  if absolute.startswith(base+'/') or absolute==base: internal_links.add(absolute)
              rows.append({'url':url,'curl_rc':rc,'http':meta[0],'effective':meta[1],'content_type':meta[2],'bytes':meta[3],'title':bool(re.search(r'<title[^>]*>.+?</title>',body,re.I|re.S)),'canonical':canonical,'h1':len(re.findall(r'<h1(?:\s|>)',body,re.I)),'noindex':bool(re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',body,re.I)),'stderr':err[:200]})
          broken=[]
          for url in sorted(internal_links)[:300]:
              p=subprocess.run(['curl','-LsS','--max-time','15','-o','/dev/null','-w','%{http_code}\t%{url_effective}',url],capture_output=True,text=True)
              parts=(p.stdout.strip().split('\t')+[''])[:2]
              try: code=int(parts[0])
              except: code=0
              if code<200 or code>=400: broken.append({'url':url,'http':code,'effective':parts[1],'rc':p.returncode})
          _,rmeta,robots,_=curl(base+'/robots.txt')
          _,nmeta,notfound,_=curl(base+'/this-route-must-not-exist-vf-s01-acceptance-20260903')
          summary={
            'sitemap_url_count':len(urls),'pages_checked':len(rows),'page_2xx':sum(1 for r in rows if r['http'].startswith('2')),
            'missing_title':sum(1 for r in rows if not r['title']),'missing_canonical':sum(1 for r in rows if not r['canonical']),
            'multi_or_missing_h1':sum(1 for r in rows if r['h1']!=1),'noindex_pages':sum(1 for r in rows if r['noindex']),
            'internal_links_unique':len(internal_links),'internal_links_checked':min(len(internal_links),300),'broken_internal_count':len(broken),
            'canonical_domains':domain_refs,'robots_http':rmeta[0],'robots_has_user_agent':'user-agent:' in robots.lower(),
            'notfound_http':nmeta[0],'notfound_has_title':bool(re.search(r'<title[^>]*>.+?</title>',notfound,re.I|re.S))
          }
          pathlib.Path('/tmp/evidence/pages.json').write_text(json.dumps(rows,indent=2)+'\n')
          pathlib.Path('/tmp/evidence/broken.json').write_text(json.dumps(broken,indent=2)+'\n')
          pathlib.Path('/tmp/evidence/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if broken: print('BROKEN_SAMPLE',json.dumps(broken[:20],indent=2))
          PY
          echo STATIC_BASELINE_ACCEPTANCE=COMPLETE
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-round6-static-baseline-acceptance
          path: /tmp/evidence/
          if-no-files-found: warn
          retention-days: 14
