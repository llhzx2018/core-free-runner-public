name: P02 V2.5.103 Formal Release Publish

on:
  push:
    branches:
      - run/p02-v25103-release-gate-20260924
    paths:
      - '.github/workflows/p02-v25103-formal-release.yml'
      - 'requests/p02-v25103-formal-release.sh'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact merged P02 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 2c8a75f4fbe391a3beddafe977ebca33ddfd8e1a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install release runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip
          gh --version

      - name: Publish and remote-readback V2.5.103
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25103-formal-release.sh
