name: P06 V0.1.14 Conflict Inspection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-v014-conflict-inspection-20260828.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN_SOURCE: 44def40930019b1c597e404fa49c98d4ceb2ac42
      RELEASE_SOURCE: cec5ecd28b3cdc585d1b7cac17a9e2167d520ea1
    steps:
      - uses: actions/checkout@v4
      - name: Print conflict hunks and semantic signatures
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-press.git" p06 >/dev/null 2>&1
          cd p06
          git checkout "$MAIN_SOURCE"
          git config user.name 'VictorForge Inspect'
          git config user.email 'inspect@invalid.local'
          git config merge.conflictstyle diff3
          set +e
          git merge --no-commit --no-ff "$RELEASE_SOURCE" >/dev/null 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          test "${#conflicts[@]}" -eq 8
          for f in "${conflicts[@]}"; do
            echo "===== CONFLICT_FILE $f ====="
            echo "--- STAGE_STATS ---"
            for stage in 1 2 3; do
              if git show ":$stage:$f" >/tmp/stage 2>/dev/null; then
                printf 'STAGE_%s_LINES=%s SHA256=%s\n' "$stage" "$(wc -l </tmp/stage)" "$(sha256sum /tmp/stage|awk '{print $1}')"
              else
                echo "STAGE_${stage}=ABSENT"
              fi
            done
            echo "--- CONFLICT_HUNKS ---"
            awk '
              /^<<<<<<< /{p=1; n=0}
              p{print; n++}
              /^>>>>>>> /{p=0; print "---END_HUNK---"}
            ' "$f"
            echo "===== END_FILE $f ====="
          done

          echo '===== ROUTE/SIGNATURE INVENTORY ====='
          for side in "$MAIN_SOURCE" "$RELEASE_SOURCE"; do
            echo "--- SIDE=$side ---"
            for f in public/index.php src/Http/Studio/OperationsController.php src/Http/Studio/QualityController.php composer.json bin/operations-ui-self-test.php; do
              echo "FILE=$f"
              git show "$side:$f" 2>/dev/null | grep -E "CommonBaselineV2|SystemBaseline|system/baseline|system/health|system/info|maintenance|operations|quality|publishing|job-self-test|operations-ui-self-test|backoffice-self-test|require|autoload|scripts" | head -n 120 || true
            done
          done
          git merge --abort
          test "$(git rev-parse HEAD)" = "$MAIN_SOURCE"
          echo P06_V014_CONFLICT_INSPECTION=PASS
