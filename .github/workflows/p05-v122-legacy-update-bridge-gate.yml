name: P05 V1.2.2 Legacy Update Bridge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-v122-legacy-update-bridge-gate.yml'
      - 'scripts/p05-v122-legacy-update-bridge-builder.py'
      - 'scripts/p05-v122-legacy-update-bridge-gate.sh'

permissions:
  contents: read

jobs:
  bridge:
    if: github.head_ref == 'test/p05-v122-legacy-update-bridge-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      SOURCE_FULL_SHA256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297
    steps:
      - name: Verify registered shared private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'P05_BRIDGE_REGISTERED_SHARED_TOKEN=PASS'

      - name: Checkout disposable bridge gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip unzip >/dev/null
          php -v
          php -r 'foreach(["pdo_sqlite","curl","sodium"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing $e\n");exit(1);}} if(!class_exists("ZipArchive")) exit(2);'

      - name: Download and bind formal v1.2.2 FULL
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-bridge/full /tmp/p05-bridge/extracted /tmp/p05-bridge/out
          gh release download v1.2.2 -R llhzx2018/vf-seo -p 'VF_SEO_V1.2.2_FULL.zip' -D /tmp/p05-bridge/full
          test "$(sha256sum /tmp/p05-bridge/full/VF_SEO_V1.2.2_FULL.zip | awk '{print $1}')" = "$SOURCE_FULL_SHA256"
          unzip -q /tmp/p05-bridge/full/VF_SEO_V1.2.2_FULL.zip -d /tmp/p05-bridge/extracted
          echo 'P05_BRIDGE_FORMAL_V122_FULL=PASS'

      - name: Build one-time Legacy Update Bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-v122-legacy-update-bridge-builder.py \
            --full-root /tmp/p05-bridge/extracted \
            --out /tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php | tee /tmp/p05-bridge/build.log
          php -l /tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php
          ! grep -Fq -- "$VF_PRIVATE_READ_TOKEN" /tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php
          echo 'P05_BRIDGE_ARTIFACT_SECRET_FREE=PASS'

      - name: Run exact isolated Bridge Machine Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p05-v122-legacy-update-bridge-gate.sh \
            /tmp/p05-bridge/extracted \
            /tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php | tee /tmp/p05-bridge/gate.log

      - name: Build public-safe bridge receipt
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          BRIDGE=/tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path('/tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php')
          raw=p.read_bytes()
          receipt={
            'schema':'p05-legacy-update-bridge-evidence/v1',
            'project':'P05',
            'source_version':'1.2.2',
            'target_version':'1.2.3',
            'source_full_sha256':os.environ['SOURCE_FULL_SHA256'],
            'bridge_name':p.name,
            'bridge_bytes':len(raw),
            'bridge_sha256':hashlib.sha256(raw).hexdigest(),
            'admin_auth_required':True,
            'recovery_point_required':True,
            'sealed_runtime_secret_relay':True,
            'browser_secret':False,
            'version_changed':False,
            'schema_changed':False,
            'formal_upgrade_executed':False,
            'production_write':False,
            'run_id':os.environ.get('GITHUB_RUN_ID',''),
            'status':'PASS',
          }
          Path('/tmp/p05-bridge/out/P05_V1.2.2_BRIDGE_GATE.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('P05_BRIDGE_RECEIPT=PASS')
          print('BRIDGE_BYTES='+str(receipt['bridge_bytes']))
          print('BRIDGE_SHA256='+receipt['bridge_sha256'])
          PY

      - name: Upload secret-free Bridge artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: P05_V1.2.2_LEGACY_UPDATE_BRIDGE_${{ github.sha }}
          path: |
            /tmp/p05-bridge/out/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php
            /tmp/p05-bridge/out/P05_V1.2.2_BRIDGE_GATE.json
          if-no-files-found: error
          retention-days: 7
