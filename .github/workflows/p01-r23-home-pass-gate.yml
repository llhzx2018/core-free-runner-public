name: P01 R23 Home PASS Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-r23-home-pass-gate.yml'

permissions:
  contents: read

jobs:
  home:
    if: github.head_ref == 'temp/p01-r23-home-workbench-pass-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 10b5946e63b4ab3f48f5c7abd7b5decb065312d0
      HEAD_SHA: 241388f7bfc9e4141ee325ff7c68d7f8adc1e91a
      TARGET_BRANCH: work/p01-r23-home-workbench-20260911
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact authority and 3-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$HEAD_SHA"
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename' | sort >/tmp/files
          printf '%s\n' src/app/FunctionalHome.php src/assets/workspace-home.css tests/unit/home_page_full_polish_contract.php >/tmp/expected
          diff -u /tmp/expected /tmp/files
          echo P01_R23_AUTHORITY=PASS

      - name: Checkout exact R23 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.HEAD_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Contracts Fresh Install and canonical seed
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/app/FunctionalHome.php
          php tests/unit/home_page_full_polish_contract.php | grep -Fx 'P01_HOME_PAGE_FULL_POLISH_CONTRACT=PASS'
          php tests/unit/home_recent_operations_signal_contract.php | grep -Fx 'P01_HOME_RECENT_OPERATIONS_SIGNAL_CONTRACT=PASS'
          php tests/unit/global_account_actions_contract.php | grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS'
          rm -rf /tmp/r23 && cp -a src /tmp/r23 && cd /tmp/r23
          php -S 127.0.0.1:18128 -t . >/tmp/r23-server.log 2>&1 & echo $! >/tmp/r23-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/r23.cookies -b /tmp/r23.cookies http://127.0.0.1:18128/setup.php -o /tmp/r23-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/r23-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}R23x"; printf '%s' "$PASS" >/tmp/r23.password
          curl -fsS -L -c /tmp/r23.cookies -b /tmp/r23.cookies -X POST http://127.0.0.1:18128/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start R23 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/r23-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php -r 'require "app/bootstrap.php"; require "app/SurfaceRepository.php"; $r=new VfRepository(vf_db()); $r->createCategory(["name"=>"R23 Gate Category","is_private"=>true,"sort_order"=>0]); $x=$r->savePendingCapture(["url"=>"https://example.com/r23-home-gate","title"=>"R23 Home Gate Resource"],"mobile-quick-save"); if(empty($x["id"])) exit(2); echo "P01_R23_SEED=PASS\n";'
          echo P01_R23_INSTALL=PASS

      - name: Authenticated Home geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/r23-pw && mkdir -p /tmp/r23-pw && cd /tmp/r23-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18128/',password=fs.readFileSync('/tmp/r23.password','utf8');
          const browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1291,height:797}}),p=await ctx.newPage();
          await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.locator('.vf-global-account-actions [data-vf-auth-login]').click();await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]');
          await p.goto(base+'home.php',{waitUntil:'networkidle'});await p.waitForSelector('#vfHomeModulesTitle');
          const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],r=s=>q(s)?.getBoundingClientRect()||null,mods=qa('.vf-home-module').map(x=>x.getBoundingClientRect()),account=q('.vf-global-account-actions')?.getBoundingClientRect();return{h1:q('.vf-home-command-head h1')?.textContent.trim(),summary:qa('.vf-home-summary>a').map(x=>x.textContent.replace(/\s+/g,'')),quick:qa('.vf-home-quick-grid>a,.vf-home-quick-grid>button').length,mods:mods.map(x=>({top:x.top,width:x.width})),focus:r('.vf-home-focus')?.width,quickW:r('.vf-home-quick')?.width,modulesTop:r('.vf-home-modules')?.top,activityTop:r('.vf-home-activity-section')?.top,accountRight:account?.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
          const row=d.mods.filter(x=>Math.abs(x.top-d.mods[0].top)<2).length;
          if(d.h1!=='今天从这里开始'||d.summary.length!==3||!d.summary[0].includes('1全部资源')||!d.summary[1].includes('1待整理')||d.quick!==4||d.mods.length!==8||row!==4||d.focus<=d.quickW||d.modulesTop>610||d.activityTop>820||d.accountRight<1260||d.overflow>1)throw new Error('desktop '+JSON.stringify(d));
          await p.setViewportSize({width:390,height:844});await p.goto(base+'home.php',{waitUntil:'networkidle'});
          const m=await p.evaluate(()=>{const qa=s=>[...document.querySelectorAll(s)],mods=qa('.vf-home-module').map(x=>x.getBoundingClientRect()),account=document.querySelector('.vf-global-account-actions')?.getBoundingClientRect();return{mods:mods.map(x=>({top:x.top,width:x.width})),touch:qa('.vf-home-mobile-command form,.vf-home-mobile-command>a').map(x=>x.getBoundingClientRect().height),accountRight:account?.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
          const mrow=m.mods.filter(x=>Math.abs(x.top-m.mods[0].top)<2).length;
          if(mrow!==2||m.touch.length<2||m.touch.some(h=>h<43.5)||m.accountRight<360||m.overflow>1)throw new Error('mobile '+JSON.stringify(m));
          console.log('P01_R23_BROWSER='+JSON.stringify({desktop:d,mobile:m}));await browser.close();
          JS
          node verify.mjs | tee /tmp/r23-browser.log
          grep -F 'P01_R23_BROWSER=' /tmp/r23-browser.log
          echo P01_R23_UA_UI=PASS

      - name: Final verdict
        run: |
          echo P01_R23_HOME_WORKBENCH_GATE=PASS
          echo TESTING_GATE=PASS
          echo INSTALL_GATE=PASS
          echo UA_UI_MACHINE=PASS
          echo DATA_SCHEMA_CHANGE=NONE
          echo RELEASE_WRITE=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: |
          test ! -f /tmp/r23-server.pid || kill "$(cat /tmp/r23-server.pid)" 2>/dev/null || true
          rm -rf vf-start /tmp/r23 /tmp/r23-*
