name: S01 Ops 1.21.875 R7 OWNER Golden Path Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 8c0447eb246d1f376a3b0ab52e2dd60c9e99a7ba
      BASE_SHA: d5b9737d5334f0f9afb19672bb76cbc678987930
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8c0447eb246d1f376a3b0ab52e2dd60c9e99a7ba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat ops/VERSION)" = "1.21.875"
          grep -Fq 'Version: 1.21.875' ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R7-OWNER-GOLDEN-PATH" ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            vf-ops.php \
            assets/css/current/admin-s01-v6-dashboard-r7.css \
            assets/css/current/admin-s01-v6-tools-r2.css \
            includes/admin-v13/views/dashboard.php \
            includes/s01/tool-workbench.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-v6-r7-owner-golden-path-contract.php | sort)"
          test "$actual" = "$expected"
          echo OPS_121875_SCOPE=PASS

      - name: V6 contracts and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for test_file in \
            ops/tests/s01-v6-r1-shell-foundation-contract.php \
            ops/tests/s01-v6-r2-tools-workbench-contract.php \
            ops/tests/s01-v6-r3-quality-overview-contract.php \
            ops/tests/s01-v6-r4-content-seo-contract.php \
            ops/tests/s01-v6-r41-content-seo-closure-contract.php \
            ops/tests/s01-v6-r5-publish-system-contract.php \
            ops/tests/s01-v6-r6-global-shell-closure-contract.php \
            ops/tests/s01-v6-r7-owner-golden-path-contract.php
          do
            php "$test_file"
          done
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find ops -type f -name '*.php' -print0 | sort -z)
          echo OPS_121875_V6_CONTRACTS_AND_PHP=PASS

      - name: Ownership and secret boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- \
            includes/wp-update \
            includes/v6 \
            includes/site-release \
            includes/publish-workflow \
            includes/system-governance | wc -l)" = "0"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ops/includes/s01 \
            ops/includes/admin-v13/views/dashboard.php \
            ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            ops/vf-ops.php
          ! grep -Fq 'update_option(' ops/includes/s01/tool-workbench.php
          ! grep -Fq 'add_option(' ops/includes/s01/tool-workbench.php
          ! grep -Fq 'delete_option(' ops/includes/s01/tool-workbench.php
          grep -Fq 'm3u8_settings_readback()' ops/includes/s01/tool-workbench.php
          grep -Fq 'vf_m3u8_save_settings_transaction($input, $expectedRevision' ops/includes/s01/tool-workbench.php
          echo OPS_121875_BOUNDARY=PASS

      - name: Result
        run: echo PASS_S01_OPS_121875_R7_OWNER_GOLDEN_PATH_GATE
