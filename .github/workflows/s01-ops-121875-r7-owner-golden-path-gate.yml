name: S01 Ops 1.21.879 Mature Admin V6 Candidate Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 17d939df8c2ace13c4a8135004c5b81eaa116498
      BASE_SHA: d5b9737d5334f0f9afb19672bb76cbc678987930
      VERSION: 1.21.879
      PREVIOUS_VERSION: 1.21.874
      PREVIOUS_TAG: v1.21.874
      ASSET: vf-tools-ops_V1.21.879.zip
      PREVIOUS_ASSET: vf-tools-ops_V1.21.874.zip
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 17d939df8c2ace13c4a8135004c5b81eaa116498
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.879' ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R11-DAILY-LEGIBILITY-CLOSURE" ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            RELEASE.md \
            VERSION \
            VF_PROJECT.json \
            assets/css/current/admin-s01-v6-content-seo-r4.css \
            assets/css/current/admin-s01-v6-dashboard-r7.css \
            assets/css/current/admin-s01-v6-publish-system-r5.css \
            assets/css/current/admin-s01-v6-quality-r3.css \
            assets/css/current/admin-s01-v6-shell-r1.css \
            assets/css/current/admin-s01-v6-tools-r2.css \
            assets/js/admin-s01-domain-shell-r1.js \
            docs/authority/ACCEPTANCE_MATRIX.md \
            docs/evidence/S01_C02_R11_RELEASE_INTAKE_20260918.md \
            docs/evidence/S01_C02_R7_RELEASE_INTAKE_20260918.md \
            includes/admin-v13/views/acceptance_overview.php \
            includes/admin-v13/views/content_workflow_v6.php \
            includes/admin-v13/views/dashboard.php \
            includes/admin-v13/views/publish_zip_v6.php \
            includes/admin-v13/views/seo_today_v6.php \
            includes/admin-v13/views/system_site_release_v6.php \
            includes/s01/tool-workbench.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-121879-release-authority-contract.php \
            tests/s01-v6-r10-task-rhythm-closure-contract.php \
            tests/s01-v6-r11-daily-legibility-closure-contract.php \
            tests/s01-v6-r7-owner-golden-path-contract.php \
            tests/s01-v6-r8-owner-language-closure-contract.php \
            tests/s01-v6-r9-accessibility-closure-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          echo PASS_EXACT_IDENTITY_AND_SCOPE

      - name: Current contracts and full PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-v6-r11-daily-legibility-closure-contract.php
          php ops/tests/s01-121879-release-authority-contract.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find ops -type f -name '*.php' -print0 | sort -z)
          echo PASS_CURRENT_CONTRACTS_AND_PHP

      - name: R7-R10 cumulative regression assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ops')
          def t(p): return (root/p).read_text(encoding='utf-8')
          dashboard=t('includes/admin-v13/views/dashboard.php')
          tools=t('includes/s01/tool-workbench.php')
          loader=t('includes/views/admin-style-helpers/admin-s01-uiux-polish.php')
          dcss=t('assets/css/current/admin-s01-v6-dashboard-r7.css')
          tcss=t('assets/css/current/admin-s01-v6-tools-r2.css')
          shelljs=t('assets/js/admin-s01-domain-shell-r1.js')
          shellcss=t('assets/css/current/admin-s01-v6-shell-r1.css')
          content=t('includes/admin-v13/views/content_workflow_v6.php')
          seo=t('includes/admin-v13/views/seo_today_v6.php')
          quality=t('includes/admin-v13/views/acceptance_overview.php')
          publish=t('includes/admin-v13/views/publish_zip_v6.php')
          system=t('includes/admin-v13/views/system_site_release_v6.php')
          cscss=t('assets/css/current/admin-s01-v6-content-seo-r4.css')
          pscss=t('assets/css/current/admin-s01-v6-publish-system-r5.css')

          for s in ['data-vf-v6-dashboard','vf-v6-dashboard-hero','vf-v6-dashboard-primary','vf-v6-dashboard-metrics','vf-v6-dashboard-queue','vf-v6-dashboard-details']:
              assert s in dashboard, s
          assert 'vf_ops_s01_v6_render_landing_open_v1(\'dashboard\'' in dashboard
          assert 'vf_ops_render_admin_open(' not in dashboard
          assert 'admin-s01-v6-dashboard-r7.css' in loader
          assert all(x in dcss for x in ['@media (max-width: 960px)','@media (max-width: 782px)','@media (max-width: 520px)','@media (prefers-reduced-motion: reduce)','@media (forced-colors: active)'])
          assert ':root' not in dcss

          assert 'vf_ops_s01_m3u8_daily_settings_v3' in tools
          assert 'm3u8_settings_readback()' in tools
          assert 'vf_m3u8_save_settings_transaction($input, $expectedRevision' in tools
          assert all(x not in tools for x in ['update_option(','add_option(','delete_option('])
          assert 'function buildToolShell(' not in shelljs
          assert 'vf-console-header-v11415' not in shelljs
          assert "dataset.vfS01AdminShell = 'mature-admin-v6'" in shelljs
          assert all(x in shelljs for x in ['projectExistingShell(page);','projectSidebar(page);','projectAdminBar();'])

          assert '6 项常用设置' in tools and 'M3U8 工具组件当前不可用' in tools
          assert 'name="vf_s01_settings_revision"' in tools
          assert 'Provider 状态' in tools and 'Provider 原始记录' in tools
          assert '当前配置已读取 · 普通打开不自动检查' in content
          assert 'name="vf_ops_content_revision"' in content
          assert 'Search Console、站点索引状态与发布检查' in seo
          assert '最终上线结论仍以正式验收记录为准' in quality
          assert '<dt>FINAL_ONLINE_PASS</dt>' in publish
          assert 'name="revision"' in system and 'name="expected_config_hash"' in system

          for s in [
              '.vf-ops-v6-shell :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible',
              '@media (prefers-reduced-motion: reduce)',
              '@media (forced-colors: active)',
              'outline-color: Highlight !important;'
          ]:
              assert s in shellcss, s
          assert ':root' not in shellcss

          assert '<details class="vf-v6-ps-details vf-v6-ps-workspaces">' in system
          assert '<details class="vf-v6-ps-details vf-v6-ps-workspaces" open' not in system
          for route in ['system_plugins','integrations','system_recovery','system_search_analytics']:
              assert "$routeUrl('"+route+"')" in system, route
          assert '.vf-v6-tools-primary-action .button' in tcss and 'overflow-wrap: anywhere;' in tcss
          assert '.vf-v6-cs-primary-actions .button { width: 100%; }' in cscss
          assert '.vf-v6-ps-primary-action .button,' in pscss and '.vf-v6-ps-upload-recovery .button' in pscss and 'overflow-wrap: anywhere;' in pscss
          print('PASS_R7_R10_CUMULATIVE_REGRESSION')
          PY

      - name: Ownership security and release-authority boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- \
            includes/wp-update \
            includes/v6 \
            includes/site-release \
            includes/publish-workflow \
            includes/system-governance | wc -l)" = "0"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ops/includes/s01 ops/includes/admin-v13/views ops/assets/js ops/assets/css ops/vf-ops.php
          grep -Fq 'OWNER Continuous Delivery Policy' ops/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'Machine PASS != OWNER PASS' ops/RELEASE.md
          grep -Fq 'P3-004: DEFERRED / UNVERIFIED' ops/CHANGELOG.md
          echo PASS_BOUNDARY_AND_AUTHORITY

      - name: Build deterministic Runtime Authority package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist
          mkdir -p stage1/vf-ops stage2/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,shutil
          src=Path('ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel: return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)', rel, re.I): return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$', rel, re.I): return False
              if '/' not in rel: return rel in {'vf-ops.php','uninstall.php'}
              return rel.startswith(('includes/','assets/','languages/','config/'))
          rows=[]
          for p in sorted((x for x in src.rglob('*') if x.is_file()), key=lambda x:x.relative_to(src).as_posix()):
              rel=p.relative_to(src).as_posix()
              if not runtime(rel): continue
              if p.is_symlink(): raise SystemExit('runtime symlink forbidden: '+rel)
              b=p.read_bytes()
              rows.append((rel,hashlib.sha256(b).hexdigest()))
              for stage in (Path('stage1/vf-ops'),Path('stage2/vf-ops')):
                  q=stage/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q)
          if 'vf-ops.php' not in {r for r,_ in rows}: raise SystemExit('plugin main missing')
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/runtime_count').write_text(str(len(rows)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          Path('/tmp/runtime_files.txt').write_text('\n'.join(r for r,_ in rows)+'\n')
          print('RUNTIME_FILES='+str(len(rows)))
          print('RUNTIME_FINGERPRINT='+hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-ops)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-ops)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-ops"
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.879'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/asset_sha
          stat -c '%s' "dist/$ASSET" > /tmp/asset_bytes
          echo PASS_DETERMINISTIC_RUNTIME_PACKAGE

      - name: Previous release compatibility and rollback gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.874'
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sed 's#^vf-ops/##' | sort > /tmp/prev_files.txt
          sort /tmp/runtime_files.txt > /tmp/new_files.txt
          comm -13 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/added.txt
          comm -23 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/removed.txt
          test "$(cat /tmp/added.txt)" = "assets/css/current/admin-s01-v6-dashboard-r7.css"
          test ! -s /tmp/removed.txt
          test "$(wc -l < /tmp/new_files.txt | tr -d ' ')" = "$(( $(wc -l < /tmp/prev_files.txt | tr -d ' ') + 1 ))"
          echo "ROLLBACK_ASSET=$PREVIOUS_TAG/$PREVIOUS_ASSET"
          echo PASS_PREVIOUS_RELEASE_COMPATIBILITY_AND_ROLLBACK

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=$PREVIOUS_TAG
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RUNTIME_ADDED=assets/css/current/admin-s01-v6-dashboard-r7.css
          RUNTIME_REMOVED=NONE
          SCHEMA=6.0.0_UNCHANGED
          DATA_MIGRATION=NONE
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          P3_004=DEFERRED_UNVERIFIED
          RESULT=PASS
          EOF
          cat /tmp/candidate-receipt.txt
          echo PASS_S01_OPS_121879_CANDIDATE_GATE

      - name: Upload exact tested candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121879-candidate-${{ github.run_id }}
          path: |
            dist/vf-tools-ops_V1.21.879.zip
            /tmp/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14
