name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-tools179-20261023]
    paths: ['.github/workflows/s01-tools179-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.179
  TARGET_SHA: a3ba950ee11f0d6c37800787754940d8cfe2bb89
  UPDATE_SHA: f26c175be028caa386220af22d34a79457944ec8
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: f26c175be028caa386220af22d34a79457944ec8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='8291181be2e15b7ccf72b7d775a4ff597b4fff4e9dede4c5cbba90349ef6d2f4' and m['asset_bytes']==1979683
          assert m['runtime_files']==476 and '1.35.178' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
