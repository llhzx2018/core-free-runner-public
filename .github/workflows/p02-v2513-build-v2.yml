name: P02 V2.5.13 Build V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-build-v2.yml'
      - 'scripts/p02-v2513-build.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private write capability
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: feature/v2.5.13-personal-workflow-refinement
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: true
      - name: Patch and verify private candidate
        run: |
          python3 scripts/p02-v2513-build.py product
          cd product
          php -l src/app/ScratchTabsService.php
          php -l public/scratch-action.php
          php -l public/scratch/index.php
          node --check public/assets/app.js
          node --check public/assets/scratch-tabs.js
          bash scripts/verify-source-package.sh
          bash scripts/repository-gates.sh
          git diff --check
      - name: Push private candidate branch
        run: |
          cd product
          git config user.name 'VF Agent Runner'
          git config user.email 'vf-agent@users.noreply.github.com'
          git add VERSION CHANGELOG.md public/assets/app.js public/assets/app.css public/assets/scratch-tabs.js public/assets/scratch-tabs.css public/scratch-action.php public/scratch/index.php src/app/ScratchTabsService.php
          git commit -m 'VF Library V2.5.13 · personal workflow refinement'
          git push origin HEAD:feature/v2.5.13-personal-workflow-refinement
          echo PRODUCT_COMMIT=$(git rev-parse HEAD)
          echo PRODUCT_VERSION=$(cat VERSION)
          echo PRODUCT_WRITE=FEATURE_BRANCH_ONLY
          echo PRODUCTION_WRITE=NO
