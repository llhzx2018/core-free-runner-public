name: P05 V1.2.3 Version Lock Writer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-v123-version-lock-writer.yml'

permissions:
  contents: read

jobs:
  write-version-lock:
    if: github.event.pull_request.head.ref == 'tmp/p05-v123-version-lock-writer-20260902'
    runs-on: ubuntu-24.04
    env:
      P05_REPO: llhzx2018/vf-seo
      P05_BRANCH: release/p05-v1.2.3-readiness-20260902
      P05_BASE: f19f2b9c0819acf2fa19adb5d2b403a68b5d9352
      P05_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact private P05 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.P05_REPO }}
          ref: ${{ env.P05_BRANCH }}
          token: ${{ env.P05_WRITE_TOKEN }}
          fetch-depth: 0

      - name: Bind exact pre-release truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md > /tmp/v122-candidate.hash
          git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md > /tmp/v122-closure.hash
          echo P05_V123_VERSION_LOCK_BASE=PASS

      - name: Write exact v1.2.3 release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          BASE='f19f2b9c0819acf2fa19adb5d2b403a68b5d9352'
          RUNTIME_BASE='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          RUNTIME_TREE='a467ab0a90656312bd297dfd5ecb51da396990b6'

          Path('VERSION').write_text('1.2.3\n')

          pkg=Path('package.json')
          p=json.loads(pkg.read_text())
          assert p['version']=='1.2.2'
          p['version']='1.2.3'
          pkg.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n')

          app=Path('src/client/ProductApp.tsx')
          s=app.read_text()
          old='P05 · Product Optimization · v1.2.2'
          new='P05 · Product Optimization · v1.2.3'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          assert old not in s
          app.write_text(s)

          vf=Path('VF_PROJECT.json')
          d=json.loads(vf.read_text())
          assert d['version']=='1.2.2'
          assert d['production_version']=='1.2.2'
          assert d['formal_release']=='v1.2.2'
          d['status']='V1.2.3_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / PRODUCTION_V1.2.2_OWNER_OBSERVED'
          d['version']='1.2.3'
          d['production_version']='1.2.2'
          d['target_version']='1.2.3'
          d['working_version']='1.2.3'
          d['version_change']=True
          d['working_branch']='release/p05-v1.2.3-readiness-20260902'
          d['candidate_authorization']='RELEASE_READINESS / OWNER_AUTHORIZED_V1.2.3'
          d['release_authorization']='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          d['production_deployment_authorization']='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING'
          d['next_action']='V1.2.3 FINAL EXACT SOURCE GATE → MAIN PROMOTION → FORMAL FULL/TAG/RELEASE → V1.2.2→V1.2.3 ATOMIC → CORE-UPDATES → PRODUCTION CLOSURE'
          d['deployment_readiness']='V1.2.3_CANDIDATE_FINAL_GATE_PENDING / PRODUCTION_BASELINE_V1.2.2_OWNER_OBSERVED'
          d['authority']['release_candidate']='docs/authority/RELEASE_V1.2.3_CANDIDATE.md'
          q=d['post_v1_2_2_update_service']
          assert q['recommended_patch_release']=='v1.2.3'
          q['release_authorization']='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          q['production_adoption']='V1.2.3_RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / EXECUTION_PENDING'
          q['machine_production_readback']='NOT_CLAIMED'
          d['release_closure_authorization_20260902']={
            'version':'v1.2.3',
            'state':'OWNER_AUTHORIZED',
            'scope':'VERSION_LOCK → FINAL_EXACT_SOURCE → FORMAL_FULL_TAG_RELEASE → DIRECT_V1.2.2_TO_V1.2.3_ATOMIC → CORE_UPDATES → PRODUCTION_CLOSURE',
            'production_execution':'AUTHORIZED_BUT_OWNER_VPS_ACTION_MAY_BE_REQUIRED_IF_NO_MACHINE_CHANNEL_EXISTS',
            'frozen_pre_release_main':BASE,
            'runtime_code_baseline':RUNTIME_BASE,
            'runtime_code_tree':RUNTIME_TREE
          }
          vf.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          Path('docs/authority/RELEASE_V1.2.3_CANDIDATE.md').write_text(f'''# P05 · VF SEO v1.2.3 Release Candidate

Status: `RELEASE_AND_PRODUCTION_CLOSURE_AUTHORIZED / FINAL_EXACT_SOURCE_GATE_PENDING`

## Release basis

- Frozen pre-release `main`: `{BASE}`
- Post-release runtime code baseline after PR #139: `{RUNTIME_BASE}`
- Runtime baseline tree: `{RUNTIME_TREE}`
- Current formal Product Release: `v1.2.2`
- Owner-observed Production baseline: `v1.2.2`
- Target candidate: `v1.2.3`
- Schema: `VF-SEO-SCHEMA@1 / 1` (unchanged)
- Default database: SQLite (unchanged)

## Patch scope already merged and machine-verified

### PR #138 · Truthful uninitialized update state

Production v1.2.2 can expose `系统与更新`, but a missing server-side update credential must not be translated into a browser-facing request for a GitHub Secret or administrator password. PR #138 keeps browser secret collection forbidden and reports the state truthfully as update service not initialized.

Exact Source R4: Run `33540256003` / Job `99964446091` = PASS.

### PR #139 · Server-side update bootstrap

PR #139 adds `php/bin/init-update-service.php` as a CLI-only, server-side-only initializer. It reads the global `VF_PRIVATE_READ_TOKEN` only from the server process environment, reuses `PhpUpdater::saveCredential()` to verify private `core-updates` plus P05 Release identity, then persists the verified credential into Runtime Pointer-bound private `runtime.env` with restrictive permissions. The Secret is never returned to the Product browser.

Native VF SEO CI: Run `33541470290` / Job `99968501815` = PASS.  
Final Exact Source R2: Run `33541894604` / Job `99969918142` = PASS.

PR #140 and PR #141 only synchronized Current Truth and corrected moving-main terminology; they do not add Product runtime behavior.

## Version authority

- `VERSION` is locked to `1.2.3`.
- `package.json` mirrors `VERSION`.
- `package-lock.json` remains dependency-graph authority and is intentionally unchanged.
- Product visible release label is `v1.2.3`.
- Formal Release and Production remain `v1.2.2` until publication/deployment actually completes.

## Security / update authority

- Browser GitHub Secret collection remains `FORBIDDEN_LOCKED`.
- Update read authority remains the global server-side `VF_PRIVATE_READ_TOKEN`.
- `llhzx2018/core-updates` remains the private Online Update Manifest Authority.
- No third/project-specific GitHub Token is introduced.

## Owner authorization

On 2026-09-02 the Owner explicitly authorized the complete v1.2.3 closure chain:

`Version Lock → Final Exact Source Gate → Formal FULL / Tag / Release → v1.2.2→v1.2.3 Atomic → core-updates → Production Closure`.

This authorization permits Release/Tag/core-updates/Production closure actions required for v1.2.3. Production PASS still requires real runtime evidence; no machine Production readback may be fabricated.

## Release contract

1. Run native full VF SEO CI on the exact Version Lock candidate.
2. Run Final Exact Source Machine Gate bound to candidate SHA/tree and frozen base.
3. Promote only the exact PASS candidate to `main`.
4. Publish deterministic `v1.2.3` FULL/Tag/Release from exact promoted source.
5. Build and machine-gate the direct `v1.2.2 → v1.2.3` Atomic bridge from formal Release bytes.
6. Publish canonical Atomic assets and then `core-updates` channel truth.
7. Deploy Production through an already-proven execution channel if one exists. If the only proven channel is Owner VPS single-PHP, stop only at that irreducible Owner action and provide the minimum exact instruction.
8. After real Production evidence, close Current Truth without repointing the immutable v1.2.3 Tag.
''')
          PY

          test "$(cat VERSION)" = '1.2.3'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.3') process.exit(1)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_CANDIDATE.md)" = "$(cat /tmp/v122-candidate.hash)"
          test "$(git hash-object docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md)" = "$(cat /tmp/v122-closure.hash)"
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json'))
          assert p['version']=='1.2.3'
          assert p['production_version']=='1.2.2'
          assert p['formal_release']=='v1.2.2'
          assert p['release_authorization']=='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING'
          assert p['production_deployment_authorization']=='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING'
          assert p['post_v1_2_2_update_service']['browser_secret_collection']=='FORBIDDEN_LOCKED'
          assert p['post_v1_2_2_update_service']['update_read_token']=='GLOBAL_VF_PRIVATE_READ_TOKEN_SERVER_SIDE_ONLY'
          assert p['post_v1_2_2_update_service']['third_project_token']=='FORBIDDEN_BY_CURRENT_GOVERNANCE'
          assert p['authority']['release_candidate']=='docs/authority/RELEASE_V1.2.3_CANDIDATE.md'
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.3_CANDIDATE.md package.json src/client/ProductApp.tsx '
          git diff --check
          echo P05_V123_VERSION_LOCK_MUTATION=PASS

      - name: Commit and push exact private candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION package.json VF_PROJECT.json src/client/ProductApp.tsx docs/authority/RELEASE_V1.2.3_CANDIDATE.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.3_CANDIDATE.md package.json src/client/ProductApp.tsx '
          git commit -m 'release(P05): lock v1.2.3 release authority'
          git push origin "HEAD:${P05_BRANCH}"
          echo "P05_V123_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "P05_V123_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_V123_VERSION_LOCK_WRITER=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
