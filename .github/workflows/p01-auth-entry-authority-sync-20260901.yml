name: P01 Auth Entry Authority Sync
on:
  push:
    branches: [temp/p01-auth-entry-authority-sync-20260901]
    paths: [.github/workflows/p01-auth-entry-authority-sync-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P01 authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-auth-entry-fix-authority-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Update exact authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          p=root/'VF_PROJECT.json'
          data=json.loads(p.read_text(encoding='utf-8'))
          data['status']='V2.36.0 OWNER PRODUCTION / V2.36.1 PUBLISHED / V2.36.2 AUTH ENTRY PATCH PREP'
          data['working_version']='2.36.1'
          data['target_release_version']='2.36.2'
          data['current_phase']='V2.36.2 PATCH PREP / AUTH ENTRY FIX MERGED + MACHINE PASS'
          data['current_change']={
            'change_id':'P01-AUTH-ENTRY-VISIBILITY-FIX-20260901',
            'base':'develop e29e5f56ad74cb98841d01764d73b680bd8913ba',
            'result':'MERGED TO DEVELOP / FORMAL GATE PASS / V2.36.2 PATCH PREP',
            'schema_change':False,
            'migration':None,
            'latest_merge_pr':170,
            'develop_merge':'cd87a40e8e7d445b36c77f670a8a2e1a50257c05',
            'runtime_product_source':'cd87a40e8e7d445b36c77f670a8a2e1a50257c05',
            'runtime_product_tree':'88785e65b25f12db176ed58a2a5cdb688e23d599',
            'repository_tree':'a0376ca4cabd9b4906592985918c8df6ade2da1b',
            'latest_product_candidate':'0c0f7d46e25d77b82d106984de64b7c16cb23715',
            'machine_gate':33477309212,
            'evidence_artifact':9788634718,
            'evidence_artifact_sha256':'a6f2c0188601de958a533b1f63d941c83873277880dc5ff932d934a6045966ec',
            'browser_gate':'390 + 1440 / REAL LOGIN + LOGOUT CLICK FLOW / PASS',
            'sqlite_integrity_fk':'PASS',
            'auth_model':'ONE FRONTEND; ANONYMOUS=PUBLIC ONLY+VISIBLE LOGIN; AUTHENTICATED=PUBLIC+PRIVATE+MANAGEMENT+VISIBLE LOGOUT',
            'management_entry':['links-admin.php','settings.php'],
            'dual_view_model':'REVERTED / NOT PRODUCT CONTRACT',
            'main_write':False,
            'production_write':False,
            'runner_main_write':False
          }
          data['candidate_version']='2.36.2'
          data['candidate_schema_version']='2026082901'
          data['candidate_state']='AUTH ENTRY PATCH MERGED / MACHINE PASS / RELEASE PREP'
          data['formal_release_state']='V2.36.1 PUBLISHED / V2.36.2 PATCH NOT YET RELEASED'
          data['develop_state']='AUTH ENTRY FIX MERGED / MACHINE PASS / V2.36.2 PATCH PREP'
          data['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.1 / Auth-entry fix merged to develop and Machine PASS / V2.36.2 patch prep'
          data['next_action']='Prepare and gate V2.36.2 patch release for the visible Login/Logout fix. Do not write Owner Production automatically.'
          data.setdefault('authority',{})['current_l2_develop_evidence']='docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          section='''<!-- P01_AUTH_ENTRY_VISIBILITY_FIX -->\n## 登录 / 退出可见入口修复 · 2026-09-01\n\n- Owner Production：`V2.36.0`；Published Latest：`V2.36.1`；本修复当前仅在 `develop`。\n- Product PR：`#170` 已合并；develop merge：`cd87a40e8e7d445b36c77f670a8a2e1a50257c05`。\n- Exact Candidate：`0c0f7d46e25d77b82d106984de64b7c16cb23715`；Runtime Tree：`88785e65b25f12db176ed58a2a5cdb688e23d599`。\n- 真实缺口：移动公开导航把登录行为标成“管理”且显式“登录”被隐藏；Functional Workspace 缺少完整可见登录 / 退出入口。\n- 正式交互：匿名 = 公开内容 + 可见“登录”；登录后 = 公开 + 私人 + `资源管理 / 系统设置 / 退出`。仍然只有一个前台，不恢复双视角。\n- Formal Gate R2：`33477309212` = **PASS**；Artifact `9788634718`；Digest `sha256:a6f2c0188601de958a533b1f63d941c83873277880dc5ff932d934a6045966ec`。\n- Gate 真实执行 390 / 1440：点击登录 → 输入密码 → 私人内容出现 → 管理入口与退出出现 → 点击退出 → 私人内容消失 → 登录重新出现；匿名私人内容无泄露；无横向溢出；SQLite/FK PASS。\n- Schema / Migration：**UNCHANGED**。\n- `main` / Tag / Release / core-updates / Owner Production：**NO WRITE**。\n- V2.36.1 Production Closure：因该已知 UX/Product 缺口保持暂停；Next = `V2.36.2` Patch Release。\n\n> 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Product Authority。\n\n'''
          for rel,title in [('docs/authority/CURRENT.md','# P01 · VF Start · Current Authority\n'),('docs/handoff/CURRENT_STATE.md','# CURRENT STATE · P01 VF Start\n')]:
            f=root/rel; txt=f.read_text(encoding='utf-8')
            if '<!-- P01_AUTH_ENTRY_VISIBILITY_FIX -->' not in txt:
              assert txt.startswith(title), rel
              txt=title+'\n'+section+txt[len(title):].lstrip('\n')
              f.write_text(txt,encoding='utf-8')

          ev=root/'docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md'
          et=ev.read_text(encoding='utf-8')
          add='''\n\n## Follow-up · Visible Login / Logout Entry Contract\n\nOwner feedback exposed a separate usability defect after the single-system auth model was restored: the auth model was correct, but the visible entry/exit affordances were incomplete across the two existing frontend rendering paths.\n\n```text\nProduct PR: #170 / MERGED\nBase develop: e29e5f56ad74cb98841d01764d73b680bd8913ba\nCandidate: 0c0f7d46e25d77b82d106984de64b7c16cb23715\nDevelop merge: cd87a40e8e7d445b36c77f670a8a2e1a50257c05\nRuntime tree: 88785e65b25f12db176ed58a2a5cdb688e23d599\nChanged files: 4\nSchema/Migration/Version: unchanged\nFormal Gate R2: 33477309212 / PASS\nArtifact: 9788634718\nDigest: sha256:a6f2c0188601de958a533b1f63d941c83873277880dc5ff932d934a6045966ec\n```\n\nValidated with real 390px and 1440px browser clicks: anonymous visible Login; password login; public+private after authentication; Resource Management / Settings / Logout; real Logout returning to public-only state; no anonymous private leak; no horizontal overflow; SQLite integrity `ok`; FK `0`.\n\nThis follow-up remains **develop-only** until the separately gated V2.36.2 patch release. V2.36.1 Production Closure remains paused.\n'''
          if '## Follow-up · Visible Login / Logout Entry Contract' not in et:
            ev.write_text(et.rstrip()+add+'\n',encoding='utf-8')
          PY
          git status --short
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Commit and push authority sync
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md
          git commit -m 'docs(P01): record visible auth entry fix'
          git push origin HEAD:docs/p01-auth-entry-fix-authority-20260901
