name: P07 v1.0 中文界面终检

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v10-zh-ui-finalize.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05

      - name: 清理终端残留英文
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/p07-bench.sh')
          s=p.read_text(encoding='utf-8')

          repl={
          '''      "$YELLOW" "$name" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "PASS" "$RESET" '-' ''':
          '''      "$YELLOW" "$(zh_name "$name")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "正常" "$RESET" '-' ''',
          '''      "$YELLOW" "$name" "$RESET" '-' '-' '-' "$RED" "$state" "$RESET" "$YELLOW" "$reason" "$RESET"''':
          '''      "$YELLOW" "$(zh_name "$name")" "$RESET" '-' '-' '-' "$RED" "$(zh_state "$state")" "$RESET" "$YELLOW" "$(zh_reason "$reason")" "$RESET"''',
          '''        "$YELLOW" "$display" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "PASS" "$RESET" '-' ''':
          '''        "$YELLOW" "$(zh_name "$display")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" "正常" "$RESET" '-' ''',
          '''    "$YELLOW" "$display" "$RESET" '-' '-' '-' "$RED" "FAIL" "$RESET" "$YELLOW" "$best_reason" "$RESET"''':
          '''    "$YELLOW" "$(zh_name "$display")" "$RESET" '-' '-' '-' "$RED" "失败" "$RESET" "$YELLOW" "$(zh_reason "$best_reason")" "$RESET"''',
          '''      "$YELLOW" "$display" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" 'PASS' "$RESET" 'LIBRESPEED' ''':
          '''      "$YELLOW" "$(zh_name "$display")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" '正常' "$RESET" '备用测速' ''',
          '''        "$YELLOW" "$display" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" 'PASS' "$RESET" 'LIBRESPEED' ''':
          '''        "$YELLOW" "$(zh_name "$display")" "$RESET" "$GREEN" "$up Mbps" "$RESET" "$RED" "$down Mbps" "$RESET" "$BLUE" "$lat ms" "$RESET" "$GREEN" '正常' "$RESET" '备用测速' ''',
          '''    "$YELLOW" "$display" "$RESET" '-' '-' '-' "$RED" 'FAIL' "$RESET" "$YELLOW" 'LIBRESPEED_UNAVAILABLE' "$RESET"''':
          '''    "$YELLOW" "$(zh_name "$display")" "$RESET" '-' '-' '-' "$RED" '失败' "$RESET" "$YELLOW" '备用测速节点不可用' "$RESET"''',
          "printf ' Swap               : %s  （已用 %s）\\n' \"$SWAP_TOTAL\" \"$SWAP_USED\"":
          "printf ' 交换分区           : %s  （已用 %s）\\n' \"$SWAP_TOTAL\" \"$SWAP_USED\"",
          "printf ' 运行时间           : %s\\n' \"$UPTIME\"":
          "printf ' 运行时间           : %s\\n' \"$(sed -e 's/weeks\\?/周/g' -e 's/days\\?/天/g' -e 's/hours\\?/小时/g' -e 's/minutes\\?/分钟/g' -e 's/seconds\\?/秒/g' <<<\"$UPTIME\")\"",
          }
          missing=[]
          for old,new in repl.items():
              if old not in s:
                  missing.append(old[:80])
              else:
                  s=s.replace(old,new,1)
          if missing:
              raise SystemExit('missing anchors:\n'+'\n'.join(missing))

          # Display-side region mapper also accepts already-localized regional names.
          anchor="""    'US West') printf '美国西部' ;;
              'US Central') printf '美国中部' ;;
              'US East') printf '美国东部' ;;
              'Europe') printf '欧洲' ;;
              'Asia South') printf '亚洲南部' ;;"""
          localized="""    'US West'|'美国西部') printf '美国西部' ;;
              'US Central'|'美国中部') printf '美国中部' ;;
              'US East'|'美国东部') printf '美国东部' ;;
              'Europe'|'欧洲') printf '欧洲' ;;
              'Asia South'|'亚洲南部') printf '亚洲南部' ;;"""
          if anchor in s:
              s=s.replace(anchor,localized,1)

          p.write_text(s,encoding='utf-8')
          PY

          bash -n experiments/p07-bench.sh

      - name: 中文正常路径与限流备用路径终检
        shell: bash
        run: |
          set -euo pipefail
          normal="$(experiments/p07-bench.sh --demo)"
          fallback="$(P07_BENCH_DEMO_BACKEND_REASON=RATE_LIMITED experiments/p07-bench.sh --demo)"
          printf '%s\n' '===== 正常路径 =====' "$normal"
          printf '%s\n' '===== 限流备用路径 =====' "$fallback"

          for text in "$normal" "$fallback"; do
            grep -q 'P07 VPS 一键验机' <<<"$text"
            grep -q '节点/地区' <<<"$text"
            grep -q '上传' <<<"$text"
            grep -q '下载' <<<"$text"
            grep -q '延迟' <<<"$text"
            grep -q '中国大陆访问评估' <<<"$text"
            grep -q '建议' <<<"$text"
          done

          # Normal user output must not leak internal English status/reason/node labels.
          banned='Speedtest\.net|Los Angeles, US|Dallas, US|Montreal, CA|Paris, FR|Amsterdam, NL|China Unicom, CN|China Telecom, CN|Hong Kong, CN|Singapore, SG|Taipei, CN|Tokyo, JP|[[:space:]]PASS[[:space:]]|[[:space:]]FAIL[[:space:]]|RATE_LIMITED|BACKEND_UNAVAILABLE|BACKEND_FAILURE|NODE_UNAVAILABLE|LIBRESPEED_UNAVAILABLE|SUPPLEMENTAL'
          ! grep -Eq "$banned" <<<"$normal"
          ! grep -Eq "$banned" <<<"$fallback"

          grep -q '美国西部·洛杉矶' <<<"$normal"
          grep -q '中国联通' <<<"$normal"
          grep -q '中国香港' <<<"$normal"
          grep -q '新加坡' <<<"$normal"
          grep -q '日本·东京' <<<"$normal"

          grep -q '测速平台限流' <<<"$fallback"
          grep -q '全球备用测速' <<<"$fallback"
          grep -q '美国西部' <<<"$fallback"
          grep -q '美国东部' <<<"$fallback"
          grep -q '欧洲' <<<"$fallback"
          grep -q '备用测速' <<<"$fallback"
          grep -q 'Cloudflare 边缘基准' <<<"$fallback"

      - name: 提交终检版本
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): remove English leakage from Chinese UI'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
