name: P01 L2 Search To Save
on:
  push:
    branches: [run/p01-search-to-save-20260902]
    paths: [.github/workflows/p01-l2-search-to-save-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-search-to-save-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-search-to-save-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = bb1b9723919841fe5ae2148ab47c042b09258b9a
          test "$(git -C product rev-parse origin/develop)" = bb1b9723919841fe5ae2148ab47c042b09258b9a
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_search_to_save_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/FunctionalWorkspace.php >/dev/null
          node --check src/assets/workspace-create-bundle.js
          git diff --check
          grep -F "\$searchUrlCandidate=vf_validate_url(\$q)" src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'data-prefill-url="<?=vf_fw_h($searchUrlCandidate)?>"' src/app/FunctionalWorkspace.php >/dev/null
          grep -F '保存这个网址 →' src/app/FunctionalWorkspace.php >/dev/null
          grep -F '在 Google 搜索' src/app/FunctionalWorkspace.php >/dev/null
          grep -F "event.target.closest?.('[data-prefill-url]')" src/assets/workspace-create-bundle.js >/dev/null
          grep -F "surface.value='start'" src/assets/workspace-create-bundle.js >/dev/null
          grep -F '.vf-search-fallback-actions' src/assets/workspace-rebaseline.css >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/FunctionalWorkspace.php src/assets/workspace-create-bundle.js src/assets/workspace-rebaseline.css | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'SEARCH TO SAVE PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspace.php src/assets/workspace-create-bundle.js src/assets/workspace-rebaseline.css
          git commit -m 'feat(P01): turn missing URL search into save action'
          git push origin HEAD:product/p01-search-to-save-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
