name: P01 2.47.516 authenticated major staging exact-source proof
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  major-stage-guard-machine:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 8e115762a6d3927f15713bf5cdb90ca2fe328896
    steps:
      - name: Checkout public lane validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact source before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-247516-major-stage-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-major-stage.json >"$RUNNER_TEMP/p01-major-stage-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-major-stage.json --input .github/workflows/p01-247516-major-stage-oneoff.yml >"$RUNNER_TEMP/p01-major-stage-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-major-stage-audit.txt" >/dev/null
          echo P01_MAJOR_STAGE_EXACT_LANE_AUDIT=PASS
      - name: Checkout exact private P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact identity and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-major-stage-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-curl php8.3-zip >>"$RUNNER_TEMP/p01-major-stage-apt.txt" 2>&1
          php8.3 -l candidate/src/app/next/runtime/MajorTrustedOwnerReleaseGate.php >"$RUNNER_TEMP/p01-major-stage-lint.txt" 2>&1
          php8.3 -l candidate/tests/compatibility/laravel/http/p01_major_official_origin_gate.php >>"$RUNNER_TEMP/p01-major-stage-lint.txt" 2>&1
          echo P01_MAJOR_STAGE_PHP83_SYNTAX=PASS
      - name: Old Owner HMAC and one-use claim rejection
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php8.3 candidate/tests/compatibility/laravel/http/p01_major_official_origin_gate.php >"$RUNNER_TEMP/p01-major-stage-proof.txt" 2>&1; then
            grep -Eo '(MAJOR_[A-Z0-9_]{6,100}|Fatal error|TypeError)' "$RUNNER_TEMP/p01-major-stage-proof.txt" | sort -u | head -n 12 || true
            exit 1
          fi
          grep -Fx 'P01_MAJOR_STAGE_FAIL_CLOSED_PRENETWORK=PASS' "$RUNNER_TEMP/p01-major-stage-proof.txt"
          grep -Fx 'P01_MAJOR_OWNER_HMAC_UNTRUSTED_STAGE_AND_REPLAY_BLOCKED=PASS' "$RUNNER_TEMP/p01-major-stage-proof.txt"
          echo P01_MAJOR_STAGE_OFFLINE_NEGATIVE_MACHINE=PASS
          echo P01_MAJOR_LIVE_OFFICIAL_ASSET_AND_CLOUDPANEL_CUTOVER=NOT_PROVEN
      - name: Clean exact private checkout and test outputs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-major-stage-*.txt
          echo P01_PRIVATE_SOURCE_AND_ARTIFACT_PERSISTENCE=NONE
