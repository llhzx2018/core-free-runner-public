name: Server Tools Release41 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc20/**'
      - '.github/workflows/p07-release41-distribution-gate.yml'
      - '.github/workflows/p07-toolbox-smoke.yml'
      - '.github/workflows/p07-system-care-smoke.yml'
      - '.github/workflows/p07-beginner-menu-gate.yml'

permissions:
  contents: read

# release41: hardware sizing is advisory; compatibility and safety checks remain fail-closed.

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release41 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release41'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release41"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release41"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="f143bd9a769ef32ffa3d594a7e71b9b99f09ee43"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="4a4848b0017aef61a0d7f3e01fba9e81cb75f0b0"' installers/p07.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc20"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc20'" installers/p07-system-care.sh

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              seen=set()
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip(): continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          PY

      - name: Beginner naming and grouped IA
        run: |
          set -Eeuo pipefail
          ui='dist/p07/0.1.0/overlay/bin/vfops-init-ui'
          migration='dist/p07/0.1.0/overlay/bin/vfops-migrate-ui'
          user='dist/p07/0.1.0/overlay/bin/vfops-user'
          toolbox='installers/p07-toolbox.sh'
          systemcare='packages/p07-system-care/0.1.0-rc20/vf-system-care.sh'

          grep -Fq '服务器工具箱' "$toolbox"
          grep -Eq '网络代理节点.*V2Ray代理' "$toolbox"
          grep -Eq '服务器性能检测.*VPS验机' "$toolbox"
          grep -Eq '网站与数据.*网站/数据库/备份' "$toolbox"
          grep -Eq '日常维护与安全.*系统更新/清理' "$toolbox"
          grep -Eq '新服务器初始化.*更新/面板/优化' "$toolbox"
          ! grep -Fq 'P07 · VF 服务器运维' "$toolbox"
          grep -Fq 'run_server_init' "$toolbox"
          grep -Fq 'ensure_system_care_current' "$toolbox"
          grep -Fq 'P07_SYSTEM_CARE_ROOT=/opt/vf-system-care' "$toolbox"
          grep -Fq "printf '请选择 [0-5]：'" "$toolbox"
          grep -Fq 'exec bash "$INIT_UI"' "$user"
          grep -Fq -- '--init' "$user"

          grep -Fq '一键初始化服务器（推荐）' "$ui"
          grep -Fq '基础设置（时区 / Swap）' "$ui"
          grep -Fq 'CloudPanel 状态 / 安装' "$ui"
          grep -Fq '确认开始一键初始化？[y/N]' "$ui"
          grep -Fq '1/5 基础设置' "$ui"
          grep -Fq '2/5 系统更新' "$ui"
          grep -Fq '3/5 CloudPanel' "$ui"
          grep -Fq '4/5 性能配置' "$ui"
          grep -Fq '5/5 最终检查' "$ui"
          grep -Fq '首次空服务器会自动安装系统更新' "$ui"
          grep -Fq 'CloudPanel 已安装的服务器只检查更新' "$ui"
          grep -Fq '性能配置会按 CPU / 内存自动生成方案' "$ui"
          grep -Fq '本次初始化执行清单' "$ui"
          grep -Fq 'resource_block_reason_cn' "$ui"
          grep -Fq 'resource_result_complete' "$ui"
          grep -Fq '当前 MySQL 配置结构与已校准模板不同' "$ui"
          grep -Fq '当前资源方案不能安全自动写入' "$ui"
          grep -Fq '资源方案已校准，但本机安全检查阻止了自动调整' "$ui"
          grep -Fq '性能配置未闭环' "$ui"
          grep -Fq 'resource_profile.py' "$ui"
          grep -Fq 'resource_apply.py' "$ui"
          grep -Fq '检测到已有网站运行配置' "$ui"
          grep -Fq '初始化只给资源建议，不自动改现有站点参数' "$ui"
          grep -Fq '空服务器安全检查未通过' "$ui"
          ! grep -Fq '重新执行初始化检查（推荐）' "$ui"
          ! grep -Fq '初始化 / 重新初始化服务器（推荐）' "$ui"
          ! grep -Fq 'CloudPanel 尚未安装，确认现在安装？[y/N]' "$ui"
          grep -Fq '服务器初始化完成' "$ui"
          grep -Fq '确认补齐缺少的基础设置？[y/N]' "$ui"
          grep -Fq '确认安装 CloudPanel？[y/N]' "$ui"
          ! grep -Fq '输入 APPLY_BASELINE' "$ui"
          ! grep -Fq '输入 INSTALL_CLOUDPANEL' "$ui"
          grep -Fq '/^SwapTotal:/' "$ui"
          grep -Fq 'CPU / 内存 / 磁盘配置只做提示，不作为禁止安装或迁移的条件。' "$ui"
          grep -Fq '是否继续由你决定；服务器工具箱不会因为低配而拒绝安装。' "$ui"
          pull='dist/p07/0.1.0/overlay/lib/server_migration_pull.py'
          grep -Fq 'hardware_baseline_is_advisory' "$pull"
          grep -Fq 'MEMORY_BELOW_CLOUDPANEL_PUBLISHED_BASELINE' "$pull"
          ! grep -Fq 'raise PullMigrationError("memory is below CloudPanel minimum")' "$pull"
          grep -Fq 'show_bootstrap_blocker' "$ui"
          grep -Fq '检测到这台服务器已经存在网站或数据库环境' "$ui"
          grep -Fq '这不是低配限制' "$ui"
          ! grep -Fq '当前服务器不满足自动安装 CloudPanel 的条件。' "$ui"
          grep -Fq 'existing_environment' "$pull"
          grep -Fq 'current server is not empty enough for automatic CloudPanel install: ' "$pull"
          grep -Fq 'environment_advisories' "$pull"
          grep -Fq 'STALE_CONFIG_DIR:' "$pull"
          grep -Fq '检测到残留目录 /etc/apache2，但未发现 Apache 程序；只提示，不阻止安装。' "$ui"
          grep -Fq '检测到残留目录 /etc/nginx，但未发现 Nginx 程序；只提示，不阻止安装。' "$ui"
          grep -Fq '完整初始化：更新 / 时区 / Swap / CloudPanel / 性能配置' "$ui"
          grep -Fq '一键初始化可以安全重复执行；已正确的项目会跳过，CloudPanel 已健康时不会重复安装。' "$ui"
          grep -Fq '基础设置已经完成，无需重复修改' "$ui"
          grep -Fq '不会重复安装；一键初始化仍可继续检查系统更新、基础设置和性能配置。' "$ui"
          grep -Fq 'DNS 未修改；旧服务器未删除；网站迁移未执行；网站 Nginx 未自动停止或重启。' "$ui"
          grep -Fq 'render_indeterminate_bar' "$ui"
          grep -Fq '1/3 安装前安全检查已通过' "$ui"
          grep -Fq '2/3 [%s] 正在安装 CloudPanel · 已耗时 %s' "$ui"
          grep -Fq '3/3 安装后检查通过' "$ui"
          ! grep -Fq '新服务器第一次使用时在这里完成基础设置' "$ui"

          grep -Fq '请返回一级菜单 → 5. 初始化服务器' "$migration"
          grep -Fq '迁移流程本身不再负责安装或初始化服务器' "$migration"
          ! grep -Fq 'BOOTSTRAP_LOCAL_CLOUDPANEL' "$migration"
          grep -Fq '迁入整台旧服务器' "$migration"
          grep -Fq '迁入一个网站' "$migration"
          grep -Fq '旧服务器网站开关' "$migration"
          grep -Fq '确认开启？[y/N]' "$migration"
          grep -Fq '确认停止？[y/N]' "$migration"
          ! grep -Fq 'ui_confirm_exact 开启' "$migration"
          ! grep -Fq 'ui_confirm_exact 停止' "$migration"

          grep -Fq "1 '服务器健康检查'" "$systemcare"
          grep -Fq "4 '工具检查 / 修复'" "$systemcare"
          grep -Fq "5 '最近操作'" "$systemcare"
          ! grep -Fq '新服务器初始化' "$systemcare"
          grep -Fq '初始化服务器已独立放在一级菜单 5' "$systemcare"

          site='dist/p07/0.1.0/overlay/bin/vfops-cloudpanel-ui'
          grep -Eq '面板账号与安全.*面板账户' "$user"
          grep -Fq "管理已有网站" "$site"
          grep -Fq "创建新网站" "$site"
          grep -Fq "ui_menu_info 3 '数据库'" "$site"
          grep -Fq "ui_menu_info 4 '网站证书（HTTPS）'" "$site"
          grep -Fq "ui_menu_warn 5 '权限与缓存'" "$site"

      - name: Ordinary surfaces hide project code and machine tokens
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
              Path('dist/p07/0.1.0/overlay/bin/vfops-user'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-site-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-migrate-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-cloudpanel-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-auto-backup'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-init-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-diagnostics-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-selfcheck-ui'),
              Path('dist/p07/0.1.0/overlay/bin/vfops-history-ui'),
              Path('packages/p07-system-care/0.1.0-rc20/vf-system-care.sh'),
              Path('packages/p07-system-care/0.1.0-rc20/resource-apply.sh'),
          ]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          assert 'P07 ·' not in text
          for token in ('输入 CUTOVER', '输入 DISABLE-AUTOBACKUP', '输入 APPLY_RESOURCE_PROFILE', '输入 ROLLBACK_RESOURCE_PROFILE', '输入“修复”继续'):
              assert token not in text, token
          PY

      - name: System-care rc20 package integrity
        run: |
          set -Eeuo pipefail
          root='packages/p07-system-care/0.1.0-rc20'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('packages/p07-system-care/0.1.0-rc20')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for line in (root/'MANIFEST.gitblob').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              expected, rel=line.split('  ',1)
              path=root/rel
              assert path.is_file(), rel
              assert blob(path)==expected, (rel, blob(path), expected)
          PY
          bash -n "$root/vf-system-care.sh"

      - name: Syntax and targeted tests
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops-user"
          bash -n "$root/bin/vfops-migrate-ui"
          bash -n "$root/bin/vfops-init-ui"
          cd "$root"
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_menu3_modular             tests.test_cloudpanel_ui_complete             tests.test_release11_beginner_ia             tests.test_server_migration_pull             tests.test_p07_integration_manifest             tests.test_user_entry

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release41'
          test -x "$tmp/install/bin/vfops-init-ui"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E 'systemctl[[:space:]]+(start|stop|restart)[[:space:]]+clp-nginx' "$root/bin" "$root/lib"
          grep -Fq 'DNS 不自动修改' "$root/bin/vfops-migrate-ui"
          grep -Fq '旧服务器永不自动删除' "$root/bin/vfops-migrate-ui"

      - name: Result
        if: always()
        run: |
          echo 'SERVER_TOOLS_RELEASE41_DISTRIBUTION_GATE=COMPLETE'
          echo 'PRODUCTION_WRITE=NOT_RUN'
          echo 'SERVER_INITIALIZATION=NOT_RUN'
