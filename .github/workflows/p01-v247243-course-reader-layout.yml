name: P01 V2.47.243 Course Reader Layout Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247243-course-reader-layout.yml"
      - "proof-triggers/p01-v247243-course-reader-layout.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin d9912fa7feca7c1d0e9452081359ca49c529d27b
          git -C candidate checkout -q --detach d9912fa7feca7c1d0e9452081359ca49c529d27b
          test "$(git -C candidate rev-parse HEAD)" = "d9912fa7feca7c1d0e9452081359ca49c529d27b"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.243"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.243"
          grep -Fq "define('VF_VERSION', '2.47.243');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 995e37e8efd8da82a5c94e86a705e9a4f4ac82a1
          git -C baseline checkout -q --detach 995e37e8efd8da82a5c94e86a705e9a4f4ac82a1
          echo P01_V247243_EXACT_SOURCE=PASS

      - name: Reader layout contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/tests/unit/course_markdown_reader_contract.php
          php candidate/tests/unit/course_markdown_reader_contract.php | tee /tmp/course-reader.txt
          grep -Fx 'P01_COURSE_MARKDOWN_READER=PASS' /tmp/course-reader.txt
          grep -Fq 'grid-template-columns:320px minmax(0,1fr)' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:2;' candidate/src/assets/course-study.css
          grep -Fq 'grid-column:1;' candidate/src/assets/course-study.css
          grep -Fq 'overflow:visible;' candidate/src/assets/course-study.css
          echo P01_V247243_LEFT_CATALOG=PASS
          echo P01_V247243_SINGLE_DESKTOP_SCROLLBAR=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247243_CANONICAL=PASS

      - name: Prove no release or production mutation
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
