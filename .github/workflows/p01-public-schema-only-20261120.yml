name: P01 upstream native schema-only retrieval for private local proof
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  schema-only:
    if: github.head_ref == 'test/p01-public-schema-transport-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read earlier public-safe schema-only job logs; write DDL only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --max-time 80 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/jobs/136119876814/logs" \
            -o /tmp/p01-public-schema-job.log
          mkdir -p /tmp/p01-upstream-schema-only
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,zlib,hashlib,json
          log=Path('/tmp/p01-public-schema-job.log').read_text(errors='replace')
          a={}
          for m in re.finditer(r'P01_NATIVE_DDL_CHUNK_(\d{3})=([A-Za-z0-9+/=]+)',log):
              a[int(m.group(1))]=m.group(2)
          if sorted(a)!=list(range(8)):raise SystemExit('MISSING_NATIVE_SCHEMA_CHUNK')
          raw=zlib.decompress(base64.b64decode(''.join(a[i] for i in sorted(a))))
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='c5d5126cdc96e55021dc6fabee1b1bb194da56e3a5e8d66223317bcdb5772fe0':
              raise SystemExit('NATIVE_SCHEMA_SHA_MISMATCH')
          data=json.loads(raw)
          if data.get('table_count')!=35 or not isinstance(data.get('sql'),list):
              raise SystemExit('NATIVE_SCHEMA_EXPECTED_35_TABLES')
          Path('/tmp/p01-upstream-schema-only/native-laravel-ddl.json').write_bytes(raw)
          print('P01_ACTUAL_LARAVEL_PUBLIC_SAFE_DDL_HASH_MATCH=PASS')
          print('P01_PUBLIC_SCHEMA_ONLY_NO_OWNER_DATA=PASS')
          PY
          rm -f /tmp/p01-public-schema-job.log
      - name: Upload one-day schema-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: p01-public-schema-only-35-tables
          path: /tmp/p01-upstream-schema-only/native-laravel-ddl.json
          retention-days: 1
