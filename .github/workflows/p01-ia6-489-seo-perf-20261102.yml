name: P01 IA6 489 real SEO indexability and capacity comparison
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-489-seo-perf-20261102.yml']
permissions:
  contents: read
jobs:
  seo-capacity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: a9b9a97f39dc7a74d8a4c0f84ebf3b0f40e44968
      TARGET_SHA: a9b9a97f39dc7a74d8a4c0f84ebf3b0f40e44968
      TARGET_VERSION: 2.47.489
      BASE_SHA: fa8d39851a4db9b4e779831aba0dbc4ba51a9153
    steps:
      - name: Checkout public-safe Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated SQLite PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml >/dev/null
      - name: Target-owned preflight identity audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          Path('/tmp/p01-ia6-seo-spec.json').write_text(json.dumps({
            'schema':'vf-ephemeral-lane-spec/v1','lane_id':'p01-ia6-489-seo-perf',
            'project_id':'P01','repository':os.environ['PRODUCT_REPO'],
            'target_version':os.environ['TARGET_VERSION'],'target_sha':os.environ['TARGET_SHA'],
            'target_tree':'','source_versions':['2.47.488'],'schema_version':'',
            'candidate_run':'','previous_lane':{},'extra':{}
          }))
          PY
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec /tmp/p01-ia6-seo-spec.json --input .github/workflows/p01-ia6-489-seo-perf-20261102.yml
      - name: Exact candidate and formal baseline in transient private checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          current="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$current" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$TARGET_VERSION"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" baseline
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(tr -d '\r\n ' < baseline/VERSION)" = 2.47.488
          test "$(git -C candidate hash-object src/app/Seo.php)" = "$(git -C baseline hash-object src/app/Seo.php)"
          grep -Fq "X-Robots-Tag: noindex, nofollow, noarchive" candidate/src/ia5-source-status.php
          echo P01_SEO_EXACT_PUBLIC_GENERATOR_UNCHANGED=PASS
      - name: Build synthetic SEO actual generated-page exercise
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-ia6-seo-fixture.php <<'PHP'
          <?php
          declare(strict_types=1);
          $src=(string)($argv[1]??'');
          $label=(string)($argv[2]??'');
          if(!in_array($src,['baseline','candidate'],true)||
             !preg_match('/^[a-z0-9]{2,12}$/',$label)||
             !is_file($src.'/src/app/Seo.php'))throw new RuntimeException('FIXTURE_IDENTITY_REJECTED');
          $root='/tmp/p01-ia6-seo-'.$src.'-'.$label;
          if(file_exists($root)||!mkdir($root,0750,true))throw new RuntimeException('FIXTURE_DIRECTORY_NOT_FRESH');
          define('VF_ROOT',$root);
          function vf_write_exact_file(string $p,string $v,int $mode=0644):void{
            if(file_put_contents($p,$v)!==strlen($v))throw new RuntimeException('SHORT_WRITE');
            chmod($p,$mode);
          }
          require $src.'/src/app/Seo.php';
          $db=new PDO('sqlite::memory:');
          $db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
          $db->setAttribute(PDO::ATTR_DEFAULT_FETCH_MODE,PDO::FETCH_ASSOC);
          $db->exec('CREATE TABLE categories(id INTEGER PRIMARY KEY,parent_id INTEGER,name TEXT,description TEXT,icon TEXT,is_private INTEGER,sort_order INTEGER,legacy_position INTEGER,updated_at TEXT,lifecycle_state TEXT)');
          $db->exec('CREATE TABLE links(id INTEGER PRIMARY KEY,category_id INTEGER,title TEXT,url TEXT,description TEXT,icon TEXT,sort_order INTEGER,legacy_position INTEGER,updated_at TEXT,lifecycle_state TEXT,is_private INTEGER,is_pending INTEGER,sensitive_detected INTEGER,url_protected INTEGER)');
          $c=$db->prepare('INSERT INTO categories VALUES(?,?,?,?,?,?,?,?,?,?)');
          foreach([[1,null,'Public Root',0],[2,1,'Public Child',0],
                   [3,null,'PRIVATE_PARENT_MARKER',1],[4,3,'INHERITED_PRIVATE_MARKER',0]] as $r){
            $c->execute([$r[0],$r[1],$r[2],'Test','',$r[3],0,0,'2026-11-02','active']);
          }
          $a=$db->prepare('INSERT INTO links VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
          for($i=0;$i<500;$i++)$a->execute([1000+$i,1+$i%2,'Public item '.$i,'https://public.example.test/'.$i,
            'Public synthetic description','',0,0,'2026-11-02','active',0,0,0,0]);
          foreach([[3001,1,'PRIVATE_MARKER',1,0,0,0,'active'],
                   [3002,1,'PENDING_MARKER',0,1,0,0,'active'],
                   [3003,1,'SENSITIVE_MARKER',0,0,1,0,'active'],
                   [3004,1,'PROTECTED_MARKER',0,0,0,1,'active'],
                   [3005,4,'INHERITED_MARKER',0,0,0,0,'active'],
                   [3006,1,'ARCHIVED_MARKER',0,0,0,0,'archived']] as $r){
            $a->execute([$r[0],$r[1],$r[2],'https://secret.example.test/'.$r[0],
              $r[2],'',0,0,'2026-11-02',$r[7],$r[3],$r[4],$r[5],$r[6]]);
          }
          $start=hrtime(true);
          $s=vf_seo_public_snapshot($db);
          $snapshotMs=(hrtime(true)-$start)/1e6;
          if(count($s['links'])!==500||count($s['categories'])!==2)throw new RuntimeException('PUBLIC_PROJECTION_INCORRECT');
          $start=hrtime(true);
          $result=vf_seo_rebuild($db,['site_title'=>'VF Start'],['seoEnabled'=>true],
            'https://start.example.test','2.47.489');
          $rebuildMs=(hrtime(true)-$start)/1e6;
          if($result['links']!==500||$result['categories']!==2||$result['pages']!==503||
             $result['sitemap']!==503)throw new RuntimeException('SEO_COUNT_MISMATCH');
          $xml=(string)file_get_contents($root.'/sitemap.xml');
          $robots=(string)file_get_contents($root.'/robots.txt');
          $pub=(string)file_get_contents($root.'/site/1000/index.html');
          if(!str_contains($robots,"Allow: /\n")||!str_contains($robots,"Disallow: /api.php\n")||
             !str_contains($robots,'https://start.example.test/sitemap.xml')||
             !str_contains($pub,'rel="canonical"')||!str_contains($pub,'content="index,follow,')||
             !str_contains($xml,'https://start.example.test/site/1000/')||
             !is_file($root.'/category/1/index.html'))throw new RuntimeException('SEO_PUBLIC_INDEXABILITY_FAILED');
          $parsed=simplexml_load_string($xml);
          if($parsed===false||count($parsed->url)!==503)throw new RuntimeException('SITEMAP_XML_INVALID');
          foreach([3001,3002,3003,3004,3005,3006] as $id){
            if(is_file($root.'/site/'.$id.'/index.html')||str_contains($xml,'/site/'.$id.'/'))
              throw new RuntimeException('PRIVATE_OR_NONPUBLIC_SITEMAP_LEAK');
          }
          if(is_dir($root.'/category/3')||is_dir($root.'/category/4'))
            throw new RuntimeException('PRIVATE_CATEGORY_EXPOSED');
          $disabled=vf_seo_rebuild($db,['site_title'=>'VF Start'],['seoEnabled'=>false],
            'https://start.example.test','2.47.489');
          if($disabled['enabled']!==false||is_dir($root.'/site')||is_dir($root.'/category')||
             is_file($root.'/sitemap.xml')||
             !str_contains((string)file_get_contents($root.'/robots.txt'),"Disallow: /\n"))
            throw new RuntimeException('DISABLED_SEO_NOT_FAIL_CLOSED');
          vf_seo_recursive_remove($root);
          echo "P01_SEO_500_PUBLIC_PRIVATE_PENDING_PROTECTED=PASS\n";
          echo 'P01_SEO_PERF_METRIC '.json_encode(['source'=>$src,'run'=>$label,
            'snapshot_ms'=>round($snapshotMs,3),'rebuild_ms'=>round($rebuildMs,3),
            'public_links'=>500],JSON_THROW_ON_ERROR)."\n";
          PHP
          php -l /tmp/p01-ia6-seo-fixture.php
      - name: Run six actual snapshots and generation under equal synthetic load
        shell: bash
        run: |
          set -Eeuo pipefail
          : >/tmp/p01-ia6-seo-perf.log
          for cycle in 1 2 3; do
            php /tmp/p01-ia6-seo-fixture.php baseline "b$cycle" | tee -a /tmp/p01-ia6-seo-perf.log
            php /tmp/p01-ia6-seo-fixture.php candidate "c$cycle" | tee -a /tmp/p01-ia6-seo-perf.log
          done
          test "$(grep -Fc 'P01_SEO_500_PUBLIC_PRIVATE_PENDING_PROTECTED=PASS' /tmp/p01-ia6-seo-perf.log)" = 6
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines=Path('/tmp/p01-ia6-seo-perf.log').read_text().splitlines()
          data=[json.loads(x.split('P01_SEO_PERF_METRIC ',1)[1]) for x in lines
                if x.startswith('P01_SEO_PERF_METRIC ')]
          assert len(data)==6
          for key in ['snapshot_ms','rebuild_ms']:
              base=sorted(x[key] for x in data if x['source']=='baseline')
              new=sorted(x[key] for x in data if x['source']=='candidate')
              assert len(base)==len(new)==3
              print('P01_IA6_CAPACITY_OBSERVED_'+key.upper()+'='+json.dumps({
                'base_median_ms':base[1],'candidate_median_ms':new[1],
                'candidate_max_ms':new[2],'candidate_to_base_median_ratio':round(new[1]/base[1],3) if base[1]>0 else None,
                'repetitions':3,'public_links':500},sort_keys=True))
          PY
          echo P01_SEO_REAL_GENERATION_AND_INDEX_PRIVACY=PASS
          echo P01_PERF_COMPARABLE_500_LINK_METRICS_RECORDED=PASS
      - name: Remove ephemeral private sources and fixtures
        if: always()
        shell: bash
        run: |
          rm -rf candidate baseline /tmp/p01-ia6-seo-*
          echo P01_IA6_SEO_PERF_PRIVATE_CLEANUP=PASS
