name: S01-C02 v1073 Publish isolated
on:
  push:
    branches: [test/s01-c02-1211073-publish-full-page-20261009]
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3d8dddb75237bbf30b7b9ba13cabf426400976c5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install isolated PHP and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-zip zip
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax and exact version
        run: |
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l tests/s01-c02-1211073-publish-preflight-locked-fixture.php
          node --check assets/js/admin-publish-zip.js
          node --check tests/s01-c02-1211073-publish-preflight-browser.js
          test "$(cat VERSION)" = "1.21.1073"
      - name: Publish preflight and entire page browser
        run: node tests/s01-c02-1211073-publish-preflight-browser.js
      - name: Previous publish gate and disclosure
        run: node tests/s01-c02-1211072-publish-gate-focus-browser.js
      - name: ZIP upload with retry and fail closed
        run: node tests/s01-c02-1211067-zip-input-browser-e2e.js
      - name: Saved task pause and resume
        run: node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: Quality native issue disclosures
        run: node tests/s01-c02-1211070-quality-native-disclosure-browser.js
      - name: Build exact package after tested flows
        run: |
          mkdir -p /tmp/s01-c02-v1073
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-v1073/vf-tools-ops_V1.21.1073.zip > /tmp/s01-c02-v1073/manifest.json
          unzip -tq /tmp/s01-c02-v1073/vf-tools-ops_V1.21.1073.zip
          cat /tmp/s01-c02-v1073/manifest.json
      - name: Archive candidate and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1073-candidate
          path: /tmp/s01-c02-v1073/
          retention-days: 30
