name: P04 V2.7.9 Release Workflow Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v279-release-workflow-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant config-dependent branding re-test
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=.github/workflows/p04-v279-formal-release.yml
          grep -Fq 'php candidate/tests/integration/common_branding_contract_v279.php "$TARGET_RT"' "$FILE"
          sed -i '/php candidate\/tests\/integration\/common_branding_contract_v279.php/d' "$FILE"
          git config user.name vf-runner
          git config user.email vf-runner@users.noreply.github.com
          git add "$FILE"
          git commit -m 'ci(P04): rely on sealed V2.7.9 branding gate during release build'
          git push origin HEAD:main
