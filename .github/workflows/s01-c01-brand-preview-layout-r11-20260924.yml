name: S01 C01 Brand Preview Layout R11 Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c01-brand-preview-layout-r11-20260924.yml'

permissions:
  contents: read

jobs:
  m3u8-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      TARGET_SHA: 91f8c87145c8f7892cb087210c8706ffb9fac138
      RUN_ID: S01-C03-R13-${{ github.run_id }}-${{ github.run_attempt }}
      VF_HTTP_PORT: '18081'
    steps:
      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Host PHP availability
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'exit(version_compare(PHP_VERSION,"8.2.0",">=")?0:1);'

      - name: M3U8 R1 + R2 + R3 + R4 + R5 source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd m3u8
          php -l tests/s01-c03-admin-shell-alignment-r1-contract.php
          php -l tests/s01-c03-local-nav-alignment-r2-contract.php
          php -l tests/s01-c03-content-alignment-r3-contract.php
          php -l tests/s01-c03-special-surface-r4-contract.php
          php -l tests/s01-c03-page-visual-closure-r5-contract.php
          php tests/s01-c03-admin-shell-alignment-r1-contract.php
          grep -Fq 'R10.1 · Full responsive shell parity with Theme / OPS' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R10.2 · defeat the older v7.1 component-workspace active-indicator color' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R11 · OPS-exact single disclosure indicator' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R13 · OWNER Production desktop shell gutter parity' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'body.wp-admin.vf-m3u8-admin-ui-v4 #wpcontent' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'padding-left:20px!important' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq '"file":"admin/dist/dashboard.css"' src/config/admin-performance-bundles.php
          ! grep -Fq 'dashboard-phase4.css' src/config/admin-performance-bundles.php
          test ! -e src/admin/dist/dashboard-phase4.css
          grep -Fq 'vf_tool_m3u8_admin_ui_v4_enqueue_phase4_component_workspace' src/admin/ui-v4/admin-ui-assets.php
          grep -Fq 'vf-v6-domain-menu-chevron" aria-hidden="true">⌄</span>' src/admin/Presentation/Components/class-admin-components.php
          ! grep -Fq 'content: "⌄";' src/admin/ui-v4/phase4-component-workspace.css
          ! grep -Fq 'content: "⌃";' src/admin/ui-v4/phase4-component-workspace.css
          grep -Fq 'R9 · OWNER Production screenshot header pixel closure' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'min-width:36px!important' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'height:66px!important' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'display:block!important' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
            grep -Fq 'vf-v6-domain-flyout is-wide' src/admin/Presentation/Components/class-admin-components.php
            grep -Fq 'box-shadow:0 14px 34px rgba(15,38,48,.14)!important' src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          php tests/s01-c03-local-nav-alignment-r2-contract.php
          php tests/s01-c03-content-alignment-r3-contract.php
          php tests/s01-c03-special-surface-r4-contract.php
          php tests/s01-c03-page-visual-closure-r5-contract.php

      - name: Install CJK font
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null

      - name: Execute exact M3U8 shell browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd m3u8
          ROOT="$PWD"
          EVIDENCE_DIR="$ROOT/evidence/shell-browser/$RUN_ID"
          mkdir -p "$EVIDENCE_DIR/logs"
          printf '[]\n' > "$EVIDENCE_DIR/checks.json"

          NET="vf-m3-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DB="vf-m3-shell-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WP="vf-m3-shell-wp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VOL="vf-m3-shell-vol-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            set +e
            docker logs "$WP" >"$EVIDENCE_DIR/logs/wordpress-container.log" 2>&1 || true
            docker logs "$DB" >"$EVIDENCE_DIR/logs/mariadb-container.log" 2>&1 || true
            docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true
            docker volume rm "$VOL" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull mariadb:11.8.8 >/dev/null
          docker pull wordpress:7.0.2-php8.4-apache >/dev/null
          docker pull wordpress:cli-2.12.0-php8.4 >/dev/null
          docker network create "$NET" >/dev/null
          docker volume create "$VOL" >/dev/null
          docker run -d --name "$DB" --network "$NET"             -e MARIADB_DATABASE=vf_test             -e MARIADB_USER=vf_runner             -e MARIADB_PASSWORD=vf_runner_pass             -e MARIADB_ROOT_PASSWORD=vf_root_pass             mariadb:11.8.8 >/dev/null

          for _ in $(seq 1 120); do
            if docker exec "$DB" mariadb -h127.0.0.1 -P3306 -N -uvf_runner -pvf_runner_pass vf_test -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$DB" mariadb -h127.0.0.1 -P3306 -N -uvf_runner -pvf_runner_pass vf_test -e 'SELECT 1' >/dev/null

          docker run -d --name "$WP" --network "$NET" -p "${VF_HTTP_PORT}:80" -v "$VOL:/var/www/html"             -e WORDPRESS_DB_HOST="$DB:3306"             -e WORDPRESS_DB_USER=vf_runner             -e WORDPRESS_DB_PASSWORD=vf_runner_pass             -e WORDPRESS_DB_NAME=vf_test             wordpress:7.0.2-php8.4-apache >/dev/null

          for _ in $(seq 1 90); do
            docker exec "$WP" test -f /var/www/html/wp-config.php >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$WP" test -f /var/www/html/wp-config.php

          wpcli() {
            docker run --rm --network "$NET" --volumes-from "$WP" --user 33:33               -e WORDPRESS_DB_HOST="$DB:3306"               -e WORDPRESS_DB_USER=vf_runner               -e WORDPRESS_DB_PASSWORD=vf_runner_pass               -e WORDPRESS_DB_NAME=vf_test               wordpress:cli-2.12.0-php8.4 wp "$@" --path=/var/www/html
          }

          wpcli core install             --url="http://127.0.0.1:${VF_HTTP_PORT}"             --title='VF M3U8 Shell Browser'             --admin_user=admin             --admin_password='vf_shell_admin_pass'             --admin_email='shell@example.invalid'             --skip-email >/dev/null
          wpcli config set VF_TOOLS_OPS_COMPONENT_ID S01-C02 --type=constant >/dev/null

          docker exec "$WP" mkdir -p /var/www/html/wp-content/plugins/vf-tool-m3u8
          docker cp "$ROOT/src/." "$WP:/var/www/html/wp-content/plugins/vf-tool-m3u8/"
          docker exec "$WP" chown -R www-data:www-data /var/www/html/wp-content/plugins/vf-tool-m3u8

          wpcli plugin activate vf-tool-m3u8 >/dev/null
          test "$(wpcli plugin get vf-tool-m3u8 --field=version | tr -d '\r')" = "1.25.41"
          test "$(wpcli option get vf_tools_m3u8_v6_schema_version | tr -d '\r')" = "1.3.0"

          wpcli core is-installed
          sleep 5
          WP="$WP" HTTP_PORT="$VF_HTTP_PORT" EVIDENCE_DIR="$EVIDENCE_DIR" ROOT="$ROOT" bash "$ROOT/scripts/phase3-browser-e2e.sh"
          echo "M3U8_SHELL_BROWSER_GATE=PASS"

      - name: Upload M3U8 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-shell-browser-${{ github.run_id }}
          path: m3u8/evidence/shell-browser/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf m3u8

  theme-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      TARGET_SHA: 44e62870dcfb4c5ff0c0618fb5cb52a565af2bc6
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Host PHP availability
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'exit(version_compare(PHP_VERSION,"8.2.0",">=")?0:1);'

      - name: Theme R1 + R2 + R3 + R4 + R5 source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd theme
          php -l src/inc/admin/admin-shell.php
          php -l tests/s01-c01-admin-shell-alignment-r1-contract.php
          php -l tests/s01-c01-local-nav-alignment-r2-contract.php
          php -l tests/s01-c01-content-alignment-r3-contract.php
          php -l tests/s01-c01-special-surface-r4-contract.php
          php -l tests/s01-c01-page-visual-closure-r5-contract.php
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          grep -Fq 'R9 · OWNER Production screenshot header pixel closure' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R10 · OWNER Production desktop shell gutter parity' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'body.vf-theme-admin-screen #wpcontent' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'padding-left:20px!important' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R11 · OWNER Production brand preview rail closure' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'minmax(360px,400px)!important' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq '@media(min-width:901px) and (max-width:1180px)' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'display:block!important' src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          php tests/s01-c01-local-nav-alignment-r2-contract.php
          php tests/s01-c01-content-alignment-r3-contract.php
          php tests/s01-c01-special-surface-r4-contract.php
          php tests/s01-c01-page-visual-closure-r5-contract.php

      - name: Install CJK font
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null

      - name: Execute exact Theme shell browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd theme
          ROOT="$PWD"
          RUN_ID="S01-C01-R13-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          EVIDENCE_DIR="$ROOT/evidence/shell-browser/$RUN_ID"
          mkdir -p "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/dom" "$EVIDENCE_DIR/logs"

          NET="vf-theme-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          DB="vf-theme-shell-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WP="vf-theme-shell-wp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VOL="vf-theme-shell-vol-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PORT="18082"

          cleanup() {
            set +e
            docker logs "$WP" >"$EVIDENCE_DIR/logs/wordpress-container.log" 2>&1 || true
            docker logs "$DB" >"$EVIDENCE_DIR/logs/mariadb-container.log" 2>&1 || true
            docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true
            docker volume rm "$VOL" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull mariadb:11.8.8 >/dev/null
          docker pull wordpress:7.0.2-php8.4-apache >/dev/null
          docker pull wordpress:cli-2.12.0-php8.4 >/dev/null
          docker network create "$NET" >/dev/null
          docker volume create "$VOL" >/dev/null
          docker run -d --name "$DB" --network "$NET"             -e MARIADB_ROOT_PASSWORD=rootpass             -e MARIADB_DATABASE=wordpress             -e MARIADB_USER=wordpress             -e MARIADB_PASSWORD=wordpress             mariadb:11.8.8 >/dev/null

          for _ in $(seq 1 120); do
            if docker exec "$DB" mariadb -h127.0.0.1 -P3306 -N -uwordpress -pwordpress wordpress -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$DB" mariadb -h127.0.0.1 -P3306 -N -uwordpress -pwordpress wordpress -e 'SELECT 1' >/dev/null

          docker run -d --name "$WP" --network "$NET" -p "${PORT}:80" -v "$VOL:/var/www/html"             -e WORDPRESS_DB_HOST="$DB:3306"             -e WORDPRESS_DB_USER=wordpress             -e WORDPRESS_DB_PASSWORD=wordpress             -e WORDPRESS_DB_NAME=wordpress             wordpress:7.0.2-php8.4-apache >/dev/null

          for _ in $(seq 1 90); do
            docker exec "$WP" test -f /var/www/html/wp-config.php >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$WP" test -f /var/www/html/wp-config.php

          wpcli() {
            docker run --rm --network "$NET" --volumes-from "$WP" --user 33:33               -e WORDPRESS_DB_HOST="$DB:3306"               -e WORDPRESS_DB_USER=wordpress               -e WORDPRESS_DB_PASSWORD=wordpress               -e WORDPRESS_DB_NAME=wordpress               wordpress:cli-2.12.0-php8.4 wp "$@" --path=/var/www/html
          }

          wpcli core install             --url="http://127.0.0.1:${PORT}"             --title='VF Theme Shell Browser'             --admin_user=admin             --admin_password='vf_theme_shell_admin_pass'             --admin_email='theme-shell@example.invalid'             --skip-email >/dev/null

          docker exec "$WP" mkdir -p /var/www/html/wp-content/themes/vf-tools-theme
          docker cp "$ROOT/src/." "$WP:/var/www/html/wp-content/themes/vf-tools-theme/"
          docker exec "$WP" chown -R www-data:www-data /var/www/html/wp-content/themes/vf-tools-theme
          wpcli theme activate vf-tools-theme >/dev/null
          test "$(wpcli theme get vf-tools-theme --field=version | tr -d '\r')" = "1.35.38"

          TOKEN="vf-theme-shell-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MU="$RUNNER_TEMP/vf-theme-shell-browser.php"
          cat > "$MU" <<'PHP'
          <?php
          add_action('init', function () {
              if (!isset($_GET['vf_shell_login']) || !hash_equals('__TOKEN__', (string)$_GET['vf_shell_login'])) { return; }
              wp_set_current_user(1);
              wp_set_auth_cookie(1, true);
              wp_safe_redirect(admin_url('themes.php?page=vf-theme-modules&tab=overview'));
              exit;
          });
          add_action('admin_footer', function () {
              ?>
              <script>
              (() => {
                const root=document.documentElement;
                const shell=document.querySelector('.vf-admin-one-row-shell');
                const mark=document.querySelector('.vf-admin-brand-mark');
                const title=document.querySelector('.vf-admin-page-head-copy h1');
                const active=document.querySelector('.vf-admin-topbar-pill[aria-current="page"],.vf-admin-topbar-pill.is-active');
                const content=document.querySelector('.vf-theme-admin');
                const panel=document.querySelector('.vf-workbench-v5141__workspace,.vf-brand-card,.vf-layout-card,.vf-navigation-card,.vf-render-card,.vf-seo-section,.vf-preview-v510__panel,.vf-recovery-section');
                const contentStyle=content?getComputedStyle(content):null;
                const panelStyle=panel?getComputedStyle(panel):null;
                root.dataset.vfContentBrand=contentStyle?contentStyle.getPropertyValue('--vf-content-brand').trim():'';
                root.dataset.vfContentPanelShadow=panelStyle?panelStyle.boxShadow:'';
                root.dataset.vfContentPanelRadius=panelStyle?panelStyle.borderRadius:'';
                let special='na';
                const seoDock=document.querySelector('.vf-seo-save-dock');
                const previewAction=document.querySelector('.vf-preview-v510__run-action');
                const recoveryWorkflow=document.querySelector('.vf-recovery-workflow');
                if(seoDock){
                  const s=getComputedStyle(seoDock);
                  special=(s.boxShadow==='none'&&s.borderRadius==='10px')?'pass':'seo:'+s.boxShadow+':'+s.borderRadius;
                }else if(previewAction){
                  const s=getComputedStyle(previewAction);
                  special=(s.boxShadow==='none'&&s.borderRadius==='10px'&&s.borderLeftColor==='rgb(11, 129, 153)')?'pass':'preview:'+s.boxShadow+':'+s.borderRadius+':'+s.borderLeftColor;
                }else if(recoveryWorkflow){
                  const ws=getComputedStyle(recoveryWorkflow);
                  const task=document.querySelector('.vf-recovery-task:not([hidden]),.vf-recovery-task');
                  const ts=task?getComputedStyle(task):null;
                  special=(ws.boxShadow==='none'&&ts&&ts.borderRadius==='10px')?'pass':'recovery:'+ws.boxShadow+':'+(ts?ts.borderRadius:'missing');
                }
                root.dataset.vfSpecialSurface=special;
                const viewport=Math.round(window.innerWidth);
                const offenders=[...document.querySelectorAll('body *')].map((el)=>{
                  const r=el.getBoundingClientRect();
                  return {el,right:Math.round(r.right),left:Math.round(r.left),width:Math.round(r.width)};
                }).filter((x)=>x.right>viewport+2||x.left<-2).sort((a,b)=>(b.right-viewport)-(a.right-viewport)).slice(0,8);
                root.dataset.vfShellViewport=String(viewport);
                root.dataset.vfShellOverflow=String(Math.max(0,root.scrollWidth-root.clientWidth));
                root.dataset.vfShellOffenders=offenders.map((x)=>((x.el.id?'#'+x.el.id:x.el.className&&typeof x.el.className==='string'?'.'+x.el.className.trim().replace(/\s+/g,'.'):x.el.tagName)+'@'+x.left+':'+x.right+':'+x.width)).join('|');
                const brandCopy=document.querySelector('.vf-admin-brand-copy strong');
                const navItem=document.querySelector('.vf-admin-topbar-main .vf-admin-topbar-pill');
                const pageHead=document.querySelector('.vf-admin-page-head');
                const shellStyle=shell?getComputedStyle(shell):null;
                const navStyle=navItem?getComputedStyle(navItem):null;
                root.dataset.vfShellHeight=shell?String(Math.round(shell.getBoundingClientRect().height)):'0';
                root.dataset.vfShellWidth=shell?String(Math.round(shell.getBoundingClientRect().width)):'0';
                root.dataset.vfShellBrandWidth=mark?String(Math.round(mark.getBoundingClientRect().width)):'0';
                root.dataset.vfShellBrandText=(brandCopy&&getComputedStyle(brandCopy).display!=='none'&&brandCopy.getBoundingClientRect().width>20)?'1':'0';
                root.dataset.vfShellNavHeight=navItem?String(Math.round(navItem.getBoundingClientRect().height)):'0';
                root.dataset.vfShellNavFont=navStyle?navStyle.fontSize:'0';
                root.dataset.vfShellRadius=shellStyle?shellStyle.borderRadius:'';
                root.dataset.vfPageHeadWidth=pageHead?String(Math.round(pageHead.getBoundingClientRect().width)):'0';
                root.dataset.vfShellTitleSize=title?getComputedStyle(title).fontSize:'0';
                root.dataset.vfShellActive=active?'1':'0';
                const activeAfter=active?getComputedStyle(active,'::after'):null;
                root.dataset.vfShellActiveAfterDisplay=activeAfter?activeAfter.display:'';
                root.dataset.vfShellActiveAfterVisibility=activeAfter?activeAfter.visibility:'';
                root.dataset.vfShellActiveAfterOpacity=activeAfter?activeAfter.opacity:'';
                root.dataset.vfShellActiveAfterHeight=activeAfter?activeAfter.height:'';
                root.dataset.vfShellActiveAfterBackground=activeAfter?activeAfter.backgroundColor:'';
              })();
              </script>
              <?php
          }, PHP_INT_MAX);
          PHP
          sed -i "s/__TOKEN__/$TOKEN/g" "$MU"
          docker exec "$WP" mkdir -p /var/www/html/wp-content/mu-plugins
          docker cp "$MU" "$WP:/var/www/html/wp-content/mu-plugins/vf-theme-shell-browser.php"
          docker exec "$WP" chown www-data:www-data /var/www/html/wp-content/mu-plugins/vf-theme-shell-browser.php

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          "$CHROME" --version > "$EVIDENCE_DIR/browser-version.txt"
          PROFILE="$RUNNER_TEMP/$RUN_ID-profile"
          mkdir -p "$PROFILE"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --user-data-dir="$PROFILE" --window-size=1440,1000 --virtual-time-budget=1500             --dump-dom "http://127.0.0.1:${PORT}/?vf_shell_login=${TOKEN}" >/dev/null 2>"$EVIDENCE_DIR/logs/login.log"

          TABS=(overview brand layout navigation render seo preview recovery)
          : > "$EVIDENCE_DIR/checks.tsv"
          for width in 1440 768 390; do
            height=1000
            test "$width" != 390 || height=844
            for tab in "${TABS[@]}"; do
              url="http://127.0.0.1:${PORT}/wp-admin/themes.php?page=vf-theme-modules&tab=${tab}"
              dom="$EVIDENCE_DIR/dom/${tab}-${width}.html"
              shot="$EVIDENCE_DIR/screenshots/${tab}-${width}.png"
              "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars                 --user-data-dir="$PROFILE" --window-size="${width},${height}" --virtual-time-budget=1800                 --dump-dom "$url" > "$dom" 2>>"$EVIDENCE_DIR/logs/browser.log"
              grep -q 'vf-theme-admin' "$dom"
              grep -q 'vf-admin-one-row-shell' "$dom"
              grep -q 'VF Tools Theme' "$dom"
              grep -q 'vf-admin-page-head' "$dom"
              grep -q 'data-vf-shell-active="1"' "$dom"
              grep -q 'data-vf-shell-active-after-display="block"' "$dom"
              grep -q 'data-vf-shell-active-after-visibility="visible"' "$dom"
              grep -q 'data-vf-shell-active-after-opacity="1"' "$dom"
              grep -q 'data-vf-shell-active-after-height="2px"' "$dom"
              grep -q 'data-vf-shell-active-after-background="rgb(11, 129, 153)"' "$dom"
              ! grep -q 'wp-login.php' "$dom"
              "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
                --user-data-dir="$PROFILE" --window-size="${width},${height}" --virtual-time-budget=1800 \
                --screenshot="$shot" "$url" >/dev/null 2>>"$EVIDENCE_DIR/logs/browser.log"
              test -s "$shot"

              viewport="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-viewport="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              offenders="$(python3 - "$dom" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-offenders="([^"]*)"',s)
          print(html.unescape(m.group(1)) if m else '')
          PY
              )"
              overflow="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-overflow="([0-9]+)"',s)
          print(m.group(1) if m else '9999')
          PY
              )"
              brand="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-brand-width="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              shell_width="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-width="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              shell_height="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-height="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              brand_text="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-brand-text="([01])"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              nav_height="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-nav-height="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              nav_font="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-nav-font="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
              )"
              shell_radius="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-radius="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
              )"
              pagehead_width="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-page-head-width="([0-9]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              title_size="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-shell-title-size="([^"]+)"',s)
          print(m.group(1) if m else '0')
          PY
              )"
              content_brand="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-content-brand="([^"]*)"',s)
          print(m.group(1) if m else '')
          PY
              )"
              panel_shadow="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-content-panel-shadow="([^"]*)"',s)
          print(m.group(1) if m else '')
          PY
              )"
              panel_radius="$(python3 - "$dom" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-content-panel-radius="([^"]*)"',s)
          print(m.group(1) if m else '')
          PY
              )"
              special_surface="$(python3 - "$dom" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'data-vf-special-surface="([^"]*)"',s)
          print(html.unescape(m.group(1)) if m else '')
          PY
              )"
              printf 'tab=%s requested=%s viewport=%s overflow=%s offenders=%s title=%s brand=%s content_brand=%s panel_shadow=%s panel_radius=%s special=%s\n' "$tab" "$width" "$viewport" "$overflow" "$offenders" "$title_size" "$brand" "$content_brand" "$panel_shadow" "$panel_radius" "$special_surface"
              if test "$width" -ge 768; then
                test "$viewport" -eq "$width"
              else
                test "$viewport" -le 500
              fi
              test "$overflow" -le 2
              test "$brand" -eq 36
              test "$brand_text" = "1"
              if test "$width" = 1440; then
                test "$shell_width" -ge 1158
                test "$shell_width" -le 1162
                test "$shell_height" -ge 65
                test "$shell_height" -le 67
                test "$nav_height" -eq 42
                test "$nav_font" = "13px"
                test "$shell_radius" = "12px"
                test "$pagehead_width" -ge 1158
                test "$pagehead_width" -le 1162
              fi
              test "$content_brand" = "#0b8199"
              test "$panel_shadow" = "none"
              test "$panel_radius" = "10px"
              case "$tab" in
                seo|preview|recovery) test "$special_surface" = "pass" ;;
                *) test "$special_surface" = "na" ;;
              esac
              if test "$width" -ge 768; then test "$title_size" = "30px"; fi
              if test "$width" = 390; then test "$title_size" = "28px"; fi

              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\tPASS\n' "$tab" "$width" "$overflow" "$brand" "$title_size" "$content_brand" "$panel_shadow" "$panel_radius" "$special_surface" >> "$EVIDENCE_DIR/checks.tsv"
            done
          done

          python3 - "$EVIDENCE_DIR/checks.tsv" "$EVIDENCE_DIR/result.json" "$TARGET_SHA" <<'PY'
          import json,sys
          src,out,sha=sys.argv[1:]
          rows=[]
          for line in open(src,encoding='utf-8'):
              tab,width,overflow,brand,title,content_brand,panel_shadow,panel_radius,special_surface,status=line.rstrip('\n').split('\t')
              rows.append({'tab':tab,'width':int(width),'overflow_px':int(overflow),'brand_width_px':int(brand),'title_size':title,'content_brand':content_brand,'panel_shadow':panel_shadow,'panel_radius':panel_radius,'special_surface':special_surface,'status':status})
          result={
            'status':'PASS' if len(rows)==24 and all(r['status']=='PASS' for r in rows) else 'FAIL',
            'component_id':'S01-C01','candidate_sha':sha,'candidate_version':'1.35.38',
            'page_count':8,'viewport_count':3,'checks':rows,
            'screenshots':24,'production_write':False
          }
          json.dump(result,open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          if result['status']!='PASS': raise SystemExit(1)
          PY
          echo "THEME_SHELL_BROWSER_GATE=PASS"

      - name: Upload Theme browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-shell-browser-${{ github.run_id }}
          path: theme/evidence/shell-browser/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf theme
