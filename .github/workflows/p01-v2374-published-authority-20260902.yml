name: P01 V2.37.4 Published Authority
on:
  push:
    branches: [release/p01-v2374-hotfix-20260902]
    paths: [.github/workflows/p01-v2374-published-authority-20260902.yml]
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 4532e6443805cefe141efc1f70f1689e532450b9
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Create published authority checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          git checkout -b docs/p01-v2374-published-20260902
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          vf=root/'VF_PROJECT.json'
          d=json.loads(vf.read_text())
          d['status']='V2.37.3 OWNER PRODUCTION OBSERVED / V2.37.4 PUBLISHED / ONLINE UPDATE AVAILABLE'
          d['production_version']='2.37.3'
          d['working_version']='2.37.4'
          d['target_release_version']='2.37.4'
          d['current_phase']='V2.37.4 PUBLISHED / OWNER PRODUCTION UPDATE PENDING'
          d['published_release']={
            'version':'2.37.4','tag':'v2.37.4','release_id':381061019,
            'release_source':'4532e6443805cefe141efc1f70f1689e532450b9',
            'runtime_tree':'369f24a5c1731ec83188b2ca6a7ddb36147901a3',
            'schema_version':'2026082901','live_core_updates_commit':'4e75fcde3d15c41fabaec5b3c417f5c07bda5e72',
            'live_online_next_hop':'2.37.4 / FROM 2.37.3',
            'online_asset':'VF_Start_V2.37.4_UPDATE.zip','online_asset_bytes':1271825,
            'online_asset_sha256':'6937373fefbdf6f1f8b7b52cf715db4f61bbdbca36c8032cd6db67ba41084c69',
            'release_state':'PUBLISHED / OWNER PRODUCTION PENDING','assistant_production_write':False,
            'focused_gate':33603844441,'stage_gate':33604150610,'candidate_readiness':33604312715,
            'formal_bind_gate':33604457692,'formal_artifact_gate':33604600209,
            'strict_fresh_r1':33604708581,'strict_fresh_r1_classification':'HARNESS_ONLY_OLD_SHA_ASSERTION',
            'strict_fresh_gate':33604805298,'release_publish_gate':33605042241,
            'core_updates_manifest_gate':33605229551,'core_updates_promotion_commit':'4e75fcde3d15c41fabaec5b3c417f5c07bda5e72',
            'production_closure':'PENDING OWNER UPDATE AND REAL IYF COVER VERIFICATION'
          }
          d['candidate_state']='NONE / V2.37.4 PUBLISHED'
          d['formal_release_state']='V2.37.4 PUBLISHED / ONLINE UPDATE AVAILABLE / OWNER PRODUCTION PENDING'
          d['current_authority']='Owner Production V2.37.3 OBSERVED / Published Latest V2.37.4 / Online Update Available'
          d['next_action']='Owner updates Production V2.37.3 → V2.37.4, then verify real IYF cards before Production Closure.'
          if isinstance(d.get('current_change'),dict):
              d['current_change']['release_completed']=True
              d['current_change']['main_write']=True
              d['current_change']['production_write']=False
              d['current_change']['release_publish_gate']=33605042241
              d['current_change']['core_updates_manifest_gate']=33605229551
          d.setdefault('authority',{})['current_formal_release_evidence']='docs/evidence/P01_V2.37.4_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md'
          vf.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          block='''> **Current Published Truth · 2026-09-02**\n> V2.37.4 已正式发布并开放严格单跳 `V2.37.3 → V2.37.4` 在线更新；Owner Production 当前仍为 V2.37.3。V2.37.4 Production Closure 必须等待 Owner 升级后真实 IYF 封面验证，不以机器 Gate 代替。\n\n'''
          for p in ['README.md','docs/README.md','docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md']:
              f=root/p; f.write_text(block+f.read_text())
          ch=root/'CHANGELOG.md'; ch.write_text('''## V2.37.4 · Published / Owner Production Pending\n\n- IYF 远程封面内容协商 Hotfix：不再声明后端无法安全验证的 AVIF，仅协商 WebP/PNG/JPEG/GIF。\n- 浏览器自动封面失败缓存 revision 升至 v5，升级后立即重新尝试。\n- Strict Fresh R2 `33604805298` PASS；Release Publish `33605042241` PASS；Manifest Gate `33605229551` PASS。\n- GitHub Release `381061019`；在线更新严格只允许 V2.37.3 → V2.37.4；Schema `2026082901` 不变，无 Migration。\n- Owner Production 尚未升级；IYF 真实卡片未通过前不得 Production Closure。\n\n'''+ch.read_text())
          ev=root/'docs/evidence/P01_V2.37.4_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md'
          ev.write_text('''# P01 · VF Start V2.37.4 Published / Owner Production Pending\n\n- Formal Source: `4532e6443805cefe141efc1f70f1689e532450b9`\n- Runtime Tree: `369f24a5c1731ec83188b2ca6a7ddb36147901a3`\n- Formal Artifact Gate: `33604600209` PASS\n- Strict Fresh R2: `33604805298` PASS\n- Release Publish: `33605042241` PASS\n- GitHub Release ID: `381061019`\n- UPDATE: `VF_Start_V2.37.4_UPDATE.zip` / `1271825` bytes / SHA-256 `6937373fefbdf6f1f8b7b52cf715db4f61bbdbca36c8032cd6db67ba41084c69`\n- Manifest Gate: `33605229551` PASS\n- core-updates promotion: `4e75fcde3d15c41fabaec5b3c417f5c07bda5e72`\n- Live hop: `V2.37.3 → V2.37.4 ONLY`\n- Schema: `2026082901 → 2026082901`; Migration: none\n- Owner Production: V2.37.3 observed\n- Production Closure: PENDING real Owner upgrade + IYF visual verification\n- Assistant Production Write: NO\n''')
          PY
          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = 7
          test -z "$(git status --porcelain | grep -E '(^.. src/|VERSION$|migrations|schema)' || true)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git add README.md docs/README.md CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.37.4_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          git -c user.name=VictorForge -c user.email=llhzx2018@gmail.com commit -m 'docs(P01): record V2.37.4 published checkpoint'
          git push origin HEAD:docs/p01-v2374-published-20260902
          printf 'P01_V2374_PUBLISHED_AUTHORITY=PASS\nFILES=7\nRUNTIME_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n'
