name: P07 original18 growing-source exact-source synthetic proof
on:
  push:
    branches:
      - task/p07-original18-growing-source-proof-20261112-a1
permissions:
  contents: read
concurrency:
  group: p07-original18-growing-source-20261112-a1
  cancel-in-progress: false
jobs:
  exact-source-18site-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P07_EXACT_SHA: 2f186783a38ed4b114b1028bbd1ad5ab365bfe95
    steps:
      - name: Checkout exact private source only to transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 2f186783a38ed4b114b1028bbd1ad5ab365bfe95
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify exact source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/VERSION)" = "0.1.0"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          python3 -B -m py_compile product/lib/migration_original_18_prepare_recovery.py product/lib/migration_original_18_file_warm_stage.py product/tests/test_p07_original_18_prepare_recovery.py product/tests/test_p07_original_18_file_warm_stage.py
          echo P07_GROWING_SOURCE_COMPILE=PASS
      - name: Test original 18 ownership with additional sites and no final arm
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_prepare_recovery tests.test_p07_original_18_file_warm_stage tests.test_p07_original_18_final_window tests.test_p07_original_18_protected_preparation)
          echo P07_GROWING_SOURCE_SYNTHETIC=PASS
          echo P07_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_RELEASE=NO
      - name: Remove private source and any test files from public runner
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_SOURCE_CLEANED=YES
