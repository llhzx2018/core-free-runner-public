name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guide-detail192-formal-20261025]
    paths: ['.github/workflows/s01-guide-detail192-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.192
  TARGET_SHA: 63f06a94a38fb124bf67af8e81bd2e1180ba925d
  TARGET_TREE: c58f6115942f47df1a61fd6aa950b88d7144531e
  BASE_SHA: 427eb34ef03f93887028df1865eabe2241f9ad33
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-detail192-20261025/formal-spec.json --input control/.github/workflows/s01-guide-detail192-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 63f06a94a38fb124bf67af8e81bd2e1180ba925d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40203948010 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40203948010 --jq .head_sha)" = 345bf83eda3c63c365caca20d66966cc86dbacf2
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40203948010 --repo llhzx2018/core-free-runner-public --name s01-home-40203948010 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guide-detail192-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='f8794897bb3ae090b7c06fd846f0aa2a0ce7d256'
          for phase,count in [('before',8),('after',8),('smoke',2)]:
              result=json.loads((r/('guide-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==count
              assert result['errors']==[] and result['writes']==[]
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for mode in ['inline','sidebar']:
                      stem=lang+'-'+str(width)+'-'+mode
                      baseline=json.loads((r/('guide-baseline-'+stem+'.json')).read_text())
                      after=json.loads((r/('guide-after-'+stem+'.json')).read_text())
                      assert after['padding']=='24px' and abs(after['hero']['x']-after['reading']['x'])<2
                      assert abs(min(after['toc']['y'] if after['toc'] else after['reading']['y'],after['reading']['y'])-after['meta']['bottom']-24)<2
                      for key in ['title','h1','description','canonical','hreflang','robots','schema','body','header','footer','nav']: assert after[key]==baseline[key],key
                      for kind in ['top','end']: assert (r/('guide-'+stem+'-'+kind+'.png')).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='38e16a2399e860c204d6dbd7ec10378eae04bb8b94233edeb4f79ae95dce3c8a' and new['bytes']==1998283
          coverage=json.loads(pathlib.Path('control/lanes/s01-guide-detail192-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='f8794897bb3ae090b7c06fd846f0aa2a0ce7d256' and coverage['tree']=='c58f6115942f47df1a61fd6aa950b88d7144531e'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40203948010'
          coverage['merged_source']='63f06a94a38fb124bf67af8e81bd2e1180ba925d'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.192 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.192 provider/vf-tools-theme_V1.35.192.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.192' --notes '指南详情桌面精修：关闭侧栏时统一居中阅读列，标题、正文与后续入口保持同一基线；使用作者摘要与准备条件，移除重复阅读提示和步骤，相关工具不再混入FAQ，目录兜底入口不冒充相关文章。保留正文、SEO、真实中英文链接、设置和自定义文案，文章191复验结果补录到后台历史。精确候选中英文桌面/平板8组、目录跳转、无脚本导航、文章回归、干净安装、191升级192/回退/重复安装与数据保护通过。476运行文件，Production由Owner手工升级；指南最终人工验收和手机测试待确认。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.192 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.192 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.192 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.192.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.192.zip remote/vf-tools-theme_V1.35.192.zip
          echo '38e16a2399e860c204d6dbd7ec10378eae04bb8b94233edeb4f79ae95dce3c8a  remote/vf-tools-theme_V1.35.192.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.192.zip)" = 1998283
          gh release view v1.35.192 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
