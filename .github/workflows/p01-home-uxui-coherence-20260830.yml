name: P01 Home UXUI Coherence Gate

on:
  push:
    branches:
      - task/p01-home-uxui-coherence-20260830
    paths:
      - .github/workflows/p01-home-uxui-coherence-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EVID: /tmp/p01-home-uxui
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner

      - name: Checkout exact P01 UXUI source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: db77a646da2aa077e670d9897032c0c6f107ff45
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Exact source and CSS-only fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C p01 rev-parse HEAD)" = db77a646da2aa077e670d9897032c0c6f107ff45
          git -C p01 cat-file -e 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436^{commit}
          git -C p01 diff --name-only 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436..HEAD | sort > "$EVID/actual-files.txt"
          cat > "$EVID/expected-files.txt" <<'EOF'
          src/assets/workspace-domain-nav.css
          src/assets/workspace-home.css
          EOF
          sort -o "$EVID/expected-files.txt" "$EVID/expected-files.txt"
          diff -u "$EVID/expected-files.txt" "$EVID/actual-files.txt"
          echo P01_HOME_UXUI_SOURCE_FENCE=PASS | tee "$EVID/source-fence.txt"

      - name: Prepare visual fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > p01/src/ux-fixture.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="assets/surface-workspace.css">
          <link rel="stylesheet" href="assets/workspace-domain-nav.css">
          <link rel="stylesheet" href="assets/workspace-home.css">
          <title>P01 UXUI Fixture</title></head>
          <body class="vf-surface-app vf-functional-workspace surface-home">
          <nav class="vf-global-domain-nav"><div class="vf-global-domain-nav-inner"><a class="active" href="#">首页</a><a href="#">导航</a><a href="#">频道</a><a href="#">影视</a><a href="#">专题</a></div></nav>
          <aside class="vf-app-sidebar"><a class="vf-app-brand" href="#"><span class="vf-brand-mark">S</span><span><strong>VF Start</strong><small>P01 · 个人互联网资产</small></span></a><nav class="vf-secondary-nav"><a href="#"><span>▣</span><b>全部资源</b><em>406</em></a><a href="#"><span>☆</span><b>我的收藏</b><em>4</em></a><a href="#"><span>◷</span><b>最近使用</b><em>229</em></a></nav><div class="vf-sidebar-bottom"><a href="#">资源管理</a><a href="#">系统设置</a><small>VF Start · V2.34.0</small></div></aside>
          <main class="vf-app-stage"><div class="vf-app-topbar vf-domain-subbar"><form class="vf-global-search"><span>⌕</span><input value="" placeholder="搜索全部资源"><kbd>⌘ K</kbd></form><div class="vf-top-actions"><button class="vf-context-action vf-new-action">＋ 添加资源</button></div></div>
          <div class="vf-shell-main"><section class="vf-home-command"><header class="vf-home-command-head"><div><span class="vf-home-kicker">HOME</span><h1>首页</h1><p>先看需要处理的内容，再从最近使用或资源域继续。全部数据都来自当前 VF Start 资源库。</p></div><div class="vf-home-head-actions"><a class="vf-home-secondary" href="#">查看全部资源</a></div></header>
          <nav class="vf-home-status-grid"><a href="#"><span>归属建议</span><strong>0</strong><small>当前没有归属建议</small></a><a href="#"><span>最近使用</span><strong>229</strong><small>有真实打开记录的资源</small></a><a href="#"><span>我的收藏</span><strong>4</strong><small>已标记收藏的资源</small></a><a href="#"><span>全部资源</span><strong>406</strong><small>进入完整资源工作区</small></a></nav>
          <div class="vf-home-layout"><div class="vf-home-main-column"><section class="vf-home-section"><header><div><span>继续</span><h2>最近使用</h2><p>最近打开过的资源。</p></div><a href="#">查看全部 →</a></header><div class="vf-home-recent-list">
          <article class="vf-home-recent-item"><span class="vf-home-recent-icon">我</span><a class="vf-home-recent-copy" href="#"><strong>我的团长我的团</strong><small>影视 · movie · 1 分钟前</small></a><i class="vf-home-private">私人</i><button class="vf-icon-button">✎</button></article>
          <article class="vf-home-recent-item"><span class="vf-home-recent-icon">T</span><a class="vf-home-recent-copy" href="#"><strong>TVBAnywhere 北美官方频道</strong><small>影视 · movie · 1 分钟前</small></a><button class="vf-icon-button">✎</button></article>
          <article class="vf-home-recent-item"><span class="vf-home-recent-icon">▣</span><a class="vf-home-recent-copy" href="#"><strong>幽默油条哥割清一色 - YouTube</strong><small>频道 · youtube · 1 分钟前</small></a><i class="vf-home-private">私人</i><button class="vf-icon-button">✎</button></article>
          </div></section></div>
          <aside class="vf-home-rail"><section class="vf-home-section vf-home-domain-section"><header><div><span>资源域</span><h2>从哪里继续</h2><p>按资源类型继续浏览和管理。</p></div></header><div class="vf-home-domain-list"><a href="#"><span><b>导航</b><small>网站、工具与普通网址</small></span><strong>349</strong></a><a href="#"><span><b>频道</b><small>创作者、内容源与后台听</small></span><strong>15</strong></a><a href="#"><span><b>影视</b><small>电影、剧集与观看状态</small></span><strong>41</strong></a><a href="#"><span><b>专题</b><small>学习、研究与托管专题</small></span><strong>1</strong></a></div></section></aside></div>
          </section></div></main></body></html>
          EOF
          python3 -m http.server 8123 --directory p01/src >/tmp/p01-home-ui-http.log 2>&1 & echo $! > /tmp/p01-home-ui-http.pid

      - name: Chromium visual and computed-style gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/p01-home-ui-gate.cjs <<'EOF'
          const { chromium } = require('/tmp/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:8123/ux-fixture.html',{waitUntil:'networkidle'});
            const desktop=await page.evaluate(()=>{
              const css=s=>getComputedStyle(document.querySelector(s));
              return {
                navBg:css('.vf-global-domain-nav').backgroundColor,
                navActive:css('.vf-global-domain-nav a.active').color,
                statusDecoration:css('.vf-home-status-grid>a').textDecorationLine,
                recentDecoration:css('.vf-home-recent-copy').textDecorationLine,
                domainDecoration:css('.vf-home-domain-list>a').textDecorationLine,
                sectionCopySize:parseFloat(css('.vf-home-section header p').fontSize),
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              };
            });
            if(desktop.navBg==='rgb(75, 78, 74)')throw new Error('legacy dark domain strip remains');
            for(const key of ['statusDecoration','recentDecoration','domainDecoration'])if(desktop[key]!=='none')throw new Error(`${key}=${desktop[key]}`);
            if(desktop.sectionCopySize<10.5)throw new Error(`section copy too small: ${desktop.sectionCopySize}`);
            if(desktop.overflow>1)throw new Error(`desktop horizontal overflow ${desktop.overflow}`);
            fs.writeFileSync(process.env.EVID+'/desktop.json',JSON.stringify(desktop,null,2));
            await page.screenshot({path:process.env.EVID+'/home-1440.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'networkidle'});
            const mobile=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,statusColumns:getComputedStyle(document.querySelector('.vf-home-status-grid')).gridTemplateColumns,navHeight:getComputedStyle(document.querySelector('.vf-global-domain-nav')).height}));
            if(mobile.overflow>1)throw new Error(`mobile horizontal overflow ${mobile.overflow}`);
            fs.writeFileSync(process.env.EVID+'/mobile.json',JSON.stringify(mobile,null,2));
            await page.screenshot({path:process.env.EVID+'/home-390.png',fullPage:true});
            fs.writeFileSync(process.env.EVID+'/verdict.txt','P01_HOME_UXUI_COHERENCE=PASS\nSOURCE=db77a646da2aa077e670d9897032c0c6f107ff45\n');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          EVID="$EVID" node /tmp/p01-home-ui-gate.cjs

      - name: Upload UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-home-uxui-coherence-${{ github.run_id }}
          path: ${{ env.EVID }}
          retention-days: 30
