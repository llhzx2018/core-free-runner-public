name: P08 v015 original issued v014 PHP LIVE official channel preflight
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-real-online-old-client.yml
      - tests/p08_v015_live_original_v014_php_channel.php
permissions:
  contents: read
jobs:
  genuine-v014-php-live-online:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-live-old-v014-php-channel-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public read-only live-channel acceptance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact original v014 shipped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6fae792864a594465e4b3224bd6d73abde976f12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old
      - name: PHP8.4 real curl crypto and ZIP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,zip,openssl,mbstring,posix,fileinfo
          coverage: none
      - name: Download official v015 UPDATE by immutable asset ID and execute original v014 PHP against LIVE GitHub channel
        shell: bash
        env:
          P08_CHANNEL_TEST_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C old rev-parse HEAD)" = 6fae792864a594465e4b3224bd6d73abde976f12
          test -n "$P08_CHANNEL_TEST_TOKEN"
          test "$(php -r 'echo PHP_MAJOR_VERSION,".",PHP_MINOR_VERSION;')" = 8.4
          php -l tests/p08_v015_live_original_v014_php_channel.php
          php -l old/src/Upgrade/OwnerNextReleaseGateway.php
          composer --working-dir=old install --no-dev --no-scripts --prefer-dist \
            --no-interaction --no-progress --optimize-autoloader
          test -f old/vendor/autoload.php
          root="$RUNNER_TEMP/p08-v015-live-online-only"
          mkdir -m 700 "$root"
          archive="$root/VF_AdOps_V0.1.15_UPDATE.zip"
          curl -fsSL --retry 2 --max-time 120 \
            -H "Authorization: Bearer $P08_CHANNEL_TEST_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/774232507" \
            -o "$archive"
          test "$(stat -c %s "$archive")" = 8356933
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = \
            e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f
          echo P08_V015_REAL_REMOTE_ISSUED_ATOMIC_BYTES=PASS
          php tests/p08_v015_live_original_v014_php_channel.php "$archive"
      - name: Always dispose all private original code, token-independent fixture and downloaded ZIP
        if: always()
        shell: bash
        run: |
          rm -rf -- old "$RUNNER_TEMP/p08-v015-live-online-only"
          test ! -e old
          test ! -e "$RUNNER_TEMP/p08-v015-live-online-only"
          echo P08_V015_LIVE_OLD_PHP_ONLINE_ALL_PRIVATE_CLEANUP=PASS
