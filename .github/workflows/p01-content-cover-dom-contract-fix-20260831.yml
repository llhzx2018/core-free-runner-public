name: P01 Content Cover DOM Contract Fix
on:
  push:
    branches: [gate/p01-content-kinds-auto-covers-r2-20260831]
    paths: [.github/workflows/p01-content-cover-dom-contract-fix-20260831.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-content-kinds-auto-covers-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact candidate guard and one-line patch
        shell: bash
        env:
          EXPECTED: f578ca9306ee0ace4d851ad10a1049e66c7708e2
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/assets/workspace.js')
          s=p.read_text()
          old='document.querySelectorAll(`.vf-watch-poster[data-edit-id="${id}"],.vf-asset-icon[data-edit-id="${id}"]`).forEach(el=>{el.innerHTML=`<img src="${String(url).replace(/"/g,\'&quot;\')}" alt="" loading="lazy">`});'
          new='document.querySelectorAll(`[data-asset-row="${id}"] .vf-watch-poster,[data-asset-row="${id}"] .vf-asset-icon`).forEach(el=>{el.innerHTML=`<img src="${String(url).replace(/"/g,\'&quot;\')}" alt="" loading="lazy">`});'
          assert s.count(old)==1, f'target count={s.count(old)}'
          p.write_text(s.replace(old,new))
          PY
          node --check product/src/assets/workspace.js
          git -C product diff --check
          test "$(git -C product diff --name-only | tr -d '\r')" = "src/assets/workspace.js"
          grep -F '[data-asset-row="${id}"] .vf-watch-poster,[data-asset-row="${id}"] .vf-asset-icon' product/src/assets/workspace.js >/dev/null
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/assets/workspace.js
          git -C product commit -m 'fix(P01): keep auto cover hydration on stable asset rows'
          git -C product push origin HEAD:product/p01-content-kinds-auto-covers-20260831
          git -C product rev-parse HEAD
