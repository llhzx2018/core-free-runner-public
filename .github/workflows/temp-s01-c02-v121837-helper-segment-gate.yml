name: TEMP S01-C02 Ops 1.21.837 Helper Segment Gate
on:
  push:
    branches:
      - temp/s01-c02-v121837-helper-segment-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121837-helper-segment-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: faa87ef7c5073ce5f776d7b10a9f54cf9a63a8c3
      CANDIDATE: d7c9a4bf8dd7e252f6f7897d9865d29be7da14d8
      TREE: 106a52f9a11ff3257d2731ab1c6075a4e2420ceb
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact seven-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.837
          php -l ops/includes/release/builders/class-candidate-helper-writer.php >/dev/null
          php -l ops/includes/release/builders/class-candidate-batch-builder.php >/dev/null
          php -l ops/includes/site-release/s01-static-candidate-build-failure-readback-v121830.php >/dev/null
          php -l ops/includes/site-release/s01-static-helper-segmented-retry-v121837.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121837-helper-write-segmented-closure.php >/dev/null
          php ops/.github/phase3/v121837-helper-write-segmented-closure.php | grep -Fxq PASS_V121837_HELPER_SEGMENTED_CLOSURE
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$CANDIDATE" | sort)
          expected=(
            .github/phase3/v121837-helper-write-segmented-closure.php
            VERSION
            includes/release/builders/class-candidate-batch-builder.php
            includes/release/builders/class-candidate-helper-writer.php
            includes/site-release/s01-static-candidate-build-failure-readback-v121830.php
            includes/site-release/s01-static-helper-segmented-retry-v121837.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          git -C ops diff --check "$BASE" "$CANDIDATE"
      - name: Verify segmented helper closure remains fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          b=ops/includes/release/builders/class-candidate-batch-builder.php
          h=ops/includes/release/builders/class-candidate-helper-writer.php
          r=ops/includes/site-release/s01-static-helper-segmented-retry-v121837.php
          grep -Fq 'public static function write_segment(' "$h"
          grep -Fq "foreach (['sitemaps','social','root'] as \$segment)" "$b"
          grep -Fq "'helper_' . \$segment . '_open'" "$b"
          grep -Fq "'helper_' . \$segment . '_write'" "$b"
          grep -Fq "'helper_' . \$segment . '_close'" "$b"
          grep -Fq 'HELPER_SEGMENT_PRIOR_BOUNDARY_NOT_CURRENT' "$r"
          grep -Fq 'candidate_helper_write_failed' "$r"
          grep -Fq 'HELPER_SEGMENT_SOURCE_MISMATCH' "$r"
          grep -Fq 'HELPER_SEGMENT_FRESH_CANDIDATE_CREATED' "$r"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ops/includes/site-release/s01-static-helper-segmented-retry-v121837.php').read_text()
          for bad in ['wp_insert_post','wp_update_post','TRUNCATE','DROP TABLE','candidatePackageReady = true','finalOnlinePass = "YES"']:
              assert bad not in s
          PY
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
      - name: Verify Production 1.21.836 helper boundary truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.836" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.836" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryBuildCheckpointCandidateStatus=="fail" and .sourceRecoveryBuildCheckpointCandidateCurrentStage==4 and .sourceRecoveryBuildCheckpointCandidateBuildOffset==231 and .sourceRecoveryBuildCheckpointCandidateBuildTotal==231 and .sourceRecoveryBuildCheckpointCandidateHelperPhase=="helper_write" and .sourceRecoveryBuildCheckpointCandidateHelpersWritten==false and .sourceRecoveryBuildCheckpointCandidateCompletenessStatus=="pass" and .sourceRecoveryBuildCheckpointCandidateFailureClass=="candidate_helper_write_failed"' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121837_HELPER_SEGMENT_GATE
