name: S01-C01 preview formal release
on:
  push:
    branches: [task/s01-c01-preview-13594-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.94'
      TARGET_SHA: '1597a2f2b3985bdaca2e2156739bea3bf0464c39'
      TARGET_TREE: 'b91b283f1008946b22ff80ac72a123c43fdc5e9c'
      SOURCE_VERSION: '1.35.93'
      BASE_SHA: '4ed255c9b789dc095b02f09bf24d8b13375b4712'
      CANDIDATE_RUN: '37417555197'
      CANDIDATE_SHA: '90be98aeb3b2bb6def21c0697a9da9ec4c88eaf3'
      CANDIDATE_RUNNER_SHA: '32f11e03b842b025dfa2860d0bd829986912c5a6'
      CANDIDATE_ARTIFACT_ID: '11391098968'
      CANDIDATE_ARTIFACT_DIGEST: 'sha256:398baf2475a74822daefaa50124db15547878e8732a68ee3be9a333d1a9272e1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Target-owned formal lane identity preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c01-preview-13594/formal-spec.json --template runner/lanes/s01-c01-preview-13594/formal.template.yml --output /tmp/preview-formal-rendered.yml >/dev/null
          cmp /tmp/preview-formal-rendered.yml runner/.github/workflows/s01-c01-preview-13594-formal.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c01-preview-13594/formal-spec.json --input runner/.github/workflows/s01-c01-preview-13594-formal.yml > proof/formal-lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .head_sha)" = "$CANDIDATE_RUNNER_SHA"
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/tested-artifact-meta.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/tested-artifact.zip
          python3 - <<'PYARTIFACT'
          import os,json,pathlib,hashlib,zipfile,stat
          meta=json.loads(pathlib.Path('/tmp/tested-artifact-meta.json').read_text())
          data=pathlib.Path('/tmp/tested-artifact.zip').read_bytes()
          assert meta['id']==int(os.environ['CANDIDATE_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['CANDIDATE_RUN'])
          assert meta['workflow_run']['head_sha']==os.environ['CANDIDATE_RUNNER_SHA'] and not meta['expired']
          assert meta['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST']=='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/tested-artifact.zip') as z:
              assert z.testzip() is None
              names=z.namelist();assert len(names)==len(set(names))
              for entry in z.infolist():
                  p=pathlib.PurePosixPath(entry.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in entry.filename and not stat.S_ISLNK(entry.external_attr>>16)
                  assert p.suffix in ['.json','.png']
                  if p.suffix=='.json':json.loads(z.read(entry))
              z.extractall('tested')
          PYARTIFACT
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .preview_controls=="PASS" and .preview_tabs=="PASS" and .preview_picker=="PASS" and .preview_actual_job=="PASS" and .preview_page_matrix=="PASS" and .preview_download=="PASS" and .preview_csrf=="PASS" and .preview_revision_conflict=="PASS" and .preview_network_failure=="PASS" and .preview_pause_resume_stop=="PASS" and .preview_signed_preview=="PASS" and .preview_profile_revision=="PASS" and .preview_revoke=="PASS" and .preview_workflow=="PASS" and .probe_version=="PASS" and .six_modes=="PASS" and .terminal_state=="PASS" and .scope_restoration=="PASS" and .matrix_selected_preview=="PASS" and .clean_install=="PASS" and .recovery_data=="PASS" and .preview_native_cases==6 and .workflow_cases>=15 and .state_cases>=30 and .recovery_checks>=42' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-preview-13594 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          视觉验收功能与 UX/UI 修复：切换目标、语言和自定义 URL 后清除旧预览；完整页面矩阵完成后返回所选目标；成功、暂停、停止及失败均恢复设备宽度；重载恢复已验证任务范围。
          长矩阵采集增加已认证且绑定任务代际的心跳，防止实际采集被误判中断；旧心跳或旧浏览器上传不能恢复暂停、停止、失败或完成任务。完成的非浏览器模式 JSON 运行状态与服务器完成态保持一致。运行探针识别当前 Theme 及兼容前缀，同时保留真实版本不一致阻断。
          Exact candidate Run: $CANDIDATE_RUN。六种真实模式、六宽度控件、20页型×3断点、暂停/继续/停止、网络恢复、Revision冲突、签名与权限边界、干净安装、42项恢复、$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。
          保持已批准的 Shell/Header/Menu 结构和现有权限、nonce、签名、Schema、Updater、Provider 协议。实际站点内容和运行探针发现的问题仍如实显示，不把诊断 FAIL 改成 PASS。
          Assistant读取最终实际截图。功能与 UX/UI 工程复验限于本页；Production 由 OWNER 手工升级，OWNER真实使用为后置验收，独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        id: receipt_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-preview-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error

      - name: Read back actual formal receipt ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ARTIFACT_ID: ${{ steps.receipt_artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID" > /tmp/formal-receipt-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECEIPT_ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PYRECEIPT'
          import os,json,pathlib,hashlib,zipfile
          meta=json.loads(pathlib.Path('/tmp/formal-receipt-meta.json').read_text())
          data=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          digest='sha256:'+hashlib.sha256(data).hexdigest()
          assert meta['id']==int(os.environ['RECEIPT_ARTIFACT_ID']) and meta['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID'])
          assert meta['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not meta['expired'] and meta['digest']==digest and meta['size_in_bytes']==len(data)
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None and z.namelist()==['RELEASE_RECEIPT.json']
              actual=json.loads(z.read('RELEASE_RECEIPT.json'))
              expected=json.loads(pathlib.Path('proof/RELEASE_RECEIPT.json').read_text())
              assert actual==expected and actual['source_sha']==os.environ['TARGET_SHA'] and actual['source_tree']==os.environ['TARGET_TREE'] and actual['formal_release']==actual['remote_readback']=='PASS'
          print('VF_FORMAL_AUDIT_BEGIN')
          print(pathlib.Path('proof/formal-lane-identity-audit.json').read_text())
          print('VF_FORMAL_AUDIT_END')
          print('VF_FORMAL_RECEIPT_BEGIN')
          print(json.dumps(actual))
          print('VF_FORMAL_RECEIPT_END')
          print('VF_FORMAL_ARTIFACT_BEGIN')
          print(json.dumps({'status':'PASS','id':meta['id'],'run_id':int(os.environ['GITHUB_RUN_ID']),'bytes':len(data),'digest':digest,'crc':'PASS','json_readback':'PASS'}))
          print('VF_FORMAL_ARTIFACT_END')
          PYRECEIPT
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
