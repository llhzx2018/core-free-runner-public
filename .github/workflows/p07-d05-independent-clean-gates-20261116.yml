name: P07 D05 independent clean PR architecture and machine (TEMP)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-d05-independent-clean-gates-20261116.yml']
permissions:
  contents: read
jobs:
  d05-independent:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact private P07 clean source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3fa2361fbf7b4c4d2a97d4264c32cf1857734e28
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .private-p07-d05
      - name: Current GOV-DOC project architecture authority checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .private-gov-d05
      - name: Exact-source cumulative architecture, module isolation and UX gates
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .private-p07-d05 rev-parse HEAD)" = 3fa2361fbf7b4c4d2a97d4264c32cf1857734e28
          cd .private-p07-d05
          export PYTHONPATH="$PWD/lib"
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.private-gov-d05 \
            --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha 3fa2361fbf7b4c4d2a97d4264c32cf1857734e28
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：与 D04 服务器迁移彻底分离' \
            --changed-file bin/vfops_db_convert_plan.py \
            --changed-file lib/db_engine_conversion.py \
            --changed-file lib/db_engine_conversion_collation_audit.py \
            --affected P07-M03-D05 \
            --shared-reason '独立 D05 不修改 D04 运行代码'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops_db_convert_plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-collation-audit-v1.json
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops_db_convert_business_sandbox.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-rich-objects-v1.json
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          dirty = subprocess.check_output([
              "git","diff","--name-only","a6da82f35fdbd06020a7e65c8cbd5717f617f2f3","3fa2361fbf7b4c4d2a97d4264c32cf1857734e28"
          ],text=True).splitlines()
          restricted = (
              "lib/server_migration_pull.py",
              "lib/migration_matched_engine.py",
              "tests/test_p07_m03_d04_matched_engine.py",
          )
          assert not any(p in dirty for p in restricted), "D04 runtime changed"
          assert not any(p.startswith(("lib/migration_","lib/server_migration"))
                         for p in dirty), "D04 execution module changed"
          print("P07_D05_CLEAN_D04_CODE_ISOLATION=PASS")
          PY
          echo P07_D05_FULL_ARCHITECTURE_AND_UX=PASS
      - name: D05 unit and security regression on exact source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .private-p07-d05
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d05_*.py' -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_db_conversion_plan.py -v
          python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -v
          echo P07_D05_CLEAN_UNIT_SECURITY=PASS
      - name: Scoped native MariaDB 11.8 and MySQL 8.4 metadata proof
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .private-p07-d05
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=10s 240s \
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_collation_native.py -v
          echo P07_D05_CLEAN_NATIVE_METADATA=PASS
      - name: Always destroy temporary private checkout and test resources
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .private-p07-d05 .private-gov-d05
          test ! -e .private-p07-d05
          test ! -e .private-gov-d05
          echo P07_D05_CLEAN_PRIVATE_ASSET_CLEANUP=PASS
