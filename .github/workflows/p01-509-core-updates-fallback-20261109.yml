name: P01 509 core-updates fallback exact manifest contract
on:
  push:
    branches:
      - task/p01-509-core-updates-manifest-test-20261109
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      MANIFEST_COMMIT: 1610912b762abdac84dc9eecb185f8f9dd55af61
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout core-updates PR exact source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.MANIFEST_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: core-updates-test
          persist-credentials: false
      - name: Run unmodified canonical Update Core native checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates-test rev-parse HEAD)" = "$MANIFEST_COMMIT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-xml php-mbstring php-sqlite3 python3 >/dev/null
          cd core-updates-test
          python3 scripts/check_manifest_contract.py > /tmp/core-updates-509-manifest-audit.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/core-updates-509-manifest-audit.json"))
          assert p["status"]=="PASS",p
          m=json.load(open("projects/P01.json"))
          assert m["target_version"]=="2.47.509",m
          assert m["from_versions"]==["2.47.508"]
          assert m["release_id"]==439048241
          assert m["product_identity"]=="5c8ae0e159187e20b6ff69c3c776480f6ceb805e"
          assert m["asset_bytes"]==3870732
          assert m["asset_sha256"]=="7a37ef885b69d29a599eb284c65c289081628bdee12b6ff433d0bcda4b5e42b7"
          print("P01_509_CORE_MANIFEST_AND_SUPPORTED_FROM=PASS")
          PY
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo P01_509_CORE_UPDATES_NATIVE_CONTRACT=PASS
      - name: Remove checkout and test artifact
        if: always()
        shell: bash
        run: |
          rm -rf core-updates-test /tmp/core-updates-509-manifest-audit.json
          echo P01_509_CORE_UPDATES_TRANSIENT_CLEANUP=YES
