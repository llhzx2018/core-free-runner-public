name: P05 Single Product Handoff Snapshot 20260902

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-handoff-snapshot-20260902.yml'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'handoff/p05-single-product-snapshot-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact P05 current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: cdf194b9a88d29ecda4cd48523d67eb240f0fe7c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p05
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GOV-DOC current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ca156cc08387c516af09dae3033cc6b1c3e3b29e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-doc
          fetch-depth: 1
          persist-credentials: false

      - name: Build handoff source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "cdf194b9a88d29ecda4cd48523d67eb240f0fe7c"
          test "$(git -C gov-doc rev-parse HEAD)" = "ca156cc08387c516af09dae3033cc6b1c3e3b29e"
          ROOT="$RUNNER_TEMP/P05_V1.2.3_SINGLE_PRODUCT_HANDOFF_SOURCE_20260902"
          mkdir -p "$ROOT/09_SOURCE_REPO" "$ROOT/11_GOV_DOC"
          rsync -a --exclude='.git' p05/ "$ROOT/09_SOURCE_REPO/vf-seo/"
          cat > "$ROOT/REMOTE_TRUTH.json" <<'JSON'
          {
            "generated_for": "P05 Single Product Consolidation handoff",
            "p05_repository": "llhzx2018/vf-seo",
            "p05_main": "cdf194b9a88d29ecda4cd48523d67eb240f0fe7c",
            "p05_tree": "a778ff94cbe20c567d940bb77ac3f88c2e2fbd73",
            "p05_formal_release": "v1.2.3",
            "p05_production": "v1.2.3",
            "phase1_pr": 144,
            "phase1_native_ci_run": 33566043063,
            "phase1_native_ci_job": 100049332754,
            "phase1_exact_gate_run": 33566137741,
            "phase1_exact_gate_job": 100049632413,
            "gov_doc_repository": "llhzx2018/gov-doc",
            "gov_doc_main": "ca156cc08387c516af09dae3033cc6b1c3e3b29e",
            "gov_doc_tree": "b544a24f7a7fffa98431cd3c6b0cb2244664815c",
            "production_write": 0
          }
          JSON
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, os
          src=Path('gov-doc')
          dst=Path(os.environ['RUNNER_TEMP'])/'P05_V1.2.3_SINGLE_PRODUCT_HANDOFF_SOURCE_20260902'/'11_GOV_DOC'
          terms=[
              re.compile(r'VF-COMMON-PRODUCT-BASELINE@2\.0',re.I),
              re.compile(r'Legacy Update Bridge',re.I),
              re.compile(r'PUBLIC_AUTHORITY',re.I),
              re.compile(r'Common Product Baseline',re.I),
              re.compile(r'在线升级|统一升级|升级规范|公共产品基线'),
          ]
          hits=[]
          for p in src.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.stat().st_size>2_000_000: continue
              if p.suffix.lower() not in {'.md','.json','.txt','.yml','.yaml'}: continue
              try: text=p.read_text('utf-8')
              except Exception: continue
              if any(rx.search(text) for rx in terms): hits.append((str(p.relative_to(src)),p))
          hits=hits[:80]
          for rel,p in hits:
              out=dst/rel; out.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,out)
          (dst/'GOV_DOC_SELECTED_INDEX.txt').write_text('\n'.join(rel for rel,_ in hits)+'\n',encoding='utf-8')
          PY
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SNAPSHOT_SHA256SUMS.txt)
          echo "P05_HANDOFF_SOURCE_SNAPSHOT=PASS"
          echo "P05_SOURCE_FILES=$(find "$ROOT/09_SOURCE_REPO/vf-seo" -type f | wc -l)"
          echo "GOV_DOC_SELECTED_FILES=$(find "$ROOT/11_GOV_DOC" -type f | wc -l)"

      - name: Upload exact handoff source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P05_SINGLE_PRODUCT_HANDOFF_SOURCE_20260902_${{ github.run_id }}
          path: ${{ runner.temp }}/P05_V1.2.3_SINGLE_PRODUCT_HANDOFF_SOURCE_20260902
          if-no-files-found: error
          retention-days: 14
