name: S01-C03 1.25.24 Core Update External Gate

on:
  push:
    branches: [temp/s01-c03-12524-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-c03-12524-core-update-gate-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: 7bda9014b0dae19ea5ce77e6023e7dc019d848dd
      CORE_HEAD: 36198d20aff21f094cd9e714ef7f6f1e1036dcac
      M3U8_SHA: 9a6997418b339c88a61501f43337a461a8ff1dbb
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact one-manifest delta and canonical validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          test "$(git -C core diff --name-only "$CORE_BASE..$CORE_HEAD")" = 'projects/S01-C03.json'
          cd core
          python3 -m json.tool projects/S01-C03.json >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'EXACT_ONE_MANIFEST_DELTA=PASS'
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: S01-C03 semantic boundary
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('projects/S01-C03.json'))
          assert c['target_version']=='1.25.24'
          assert c['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23']
          assert c['plugin_file']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c['canonical_locator']=='vf-tools-m3u8/vf-tools-m3u8.php'
          assert c['locator_cutover'] is False
          assert c['schema_from']=='1.3.0' and c['schema_to']=='1.3.0'
          assert c['release_tag']=='v1.25.24'
          assert c['asset_name']=='vf-tools-m3u8_V1.25.24.zip'
          assert c['asset_bytes']==3575703
          assert c['asset_sha256']=='6cb5f41d7c0a44cada05d79efac83188c381ed2bc41a8c039ac87f0fec19fd25'
          assert c['runtime_files']==558 and c['runtime_file_count']==558
          assert c['runtime_fingerprint']=='5f55aee00458d3a2c004ba101ac386833aba3c0c9919ec62fcfb29be10913a63'
          assert c['runtime_fingerprint_sha256']==c['runtime_fingerprint']
          assert 'M3U8 migration remains CLOSED' in c['notes']
          print('S01_C03_SEMANTIC_BOUNDARY=PASS')
          PY

      - name: Exact formal Release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.24 > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r --arg a 'vf-tools-m3u8_V1.25.24.zip' '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = '3575703'
          test "$(jq -r --arg a 'vf-tools-m3u8_V1.25.24.zip' '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = 'sha256:6cb5f41d7c0a44cada05d79efac83188c381ed2bc41a8c039ac87f0fec19fd25'
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-m3u8/git/ref/tags/v1.25.24 | jq -r '.object.sha')" = "$M3U8_SHA"
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-m3u8/branches/main | jq -r '.commit.sha')" = "$M3U8_SHA"
          echo 'EXACT_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_C03_12524_CORE_UPDATE_EXTERNAL_GATE=PASS'
