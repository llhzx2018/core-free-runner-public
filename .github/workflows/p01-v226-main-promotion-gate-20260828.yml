name: P01 V2.26.0 Main Promotion Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-main-promotion-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE: c97a362fc574cd80349526fca016f9e0e6a9c472
      TREE: 784fbbb4b3612145cdfa424659ddc6e843d3694b
      MAIN: 3e147ee33f027086bd48cd2900ad05a7109ac728
      DEVELOP: 66c3b69527c3273c8dc923c88b3d5bfee8eda3ce
      RELEASE_GATE: '33163415785'
      ARTIFACT_GATE: '33163565368'
      ARTIFACT_ID: '9682627944'
      PR: '35'
    steps:
      - name: Readback refs PR and PASS evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN"
          test "$(git -C product rev-parse origin/develop)" = "$DEVELOP"
          test "$(git -C product rev-parse origin/release/p01-v2.26.0-20260828)" = "$RELEASE"
          test "$(git -C product rev-parse origin/promotion/p01-v2.26.0-main-20260828)" = "$RELEASE"
          test "$(git -C product rev-parse "$RELEASE^{tree}")" = "$TREE"
          git -C product merge-base --is-ancestor "$MAIN" "$RELEASE"
          git -C product merge-base --is-ancestor "$DEVELOP" "$RELEASE"
          test "$(git -C product show "$RELEASE:VERSION"|tr -d '\r\n')" = 2.26.0
          PRJ=$(gh api "repos/llhzx2018/vf-start/pulls/$PR")
          test "$(jq -r '.state' <<<"$PRJ")" = open
          test "$(jq -r '.head.sha' <<<"$PRJ")" = "$RELEASE"
          test "$(jq -r '.base.sha' <<<"$PRJ")" = "$MAIN"
          test "$(jq -r '.base.ref' <<<"$PRJ")" = main
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID" | jq -e '.name=="p01-v226-formal-artifacts-c97a362fc574cd80349526fca016f9e0e6a9c472" and .expired==false' >/dev/null
          echo P01_V226_MAIN_PROMOTION=PASS
