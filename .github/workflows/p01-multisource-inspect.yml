name: P01 Atomic Alternate Source Contract Inspect (One Shot)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-multisource-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect structure of existing private signed atomic repair without publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/multisource"
          gh release download v2.47.407 -R llhzx2018/vf-start -D "$RUNNER_TEMP/multisource" -p 'VF_Start_V2.47.407_UPDATE.zip'
          cd "$RUNNER_TEMP/multisource"
          unzip -q VF_Start_V2.47.407_UPDATE.zip
          python3 - <<'PY'
          import re, pathlib, json
          s=pathlib.Path('repair-v2.47.407.php').read_text()
          m=list(re.finditer(r'SOURCE_ALTERNATES',s))
          result={'source_alternates_defined':len(m)>1,
                  'source_alternates_mentions':len(m),
                  'has_source_manifest':bool(re.search(r'const SOURCE_MANIFEST=',s)),
                  'has_source_version':bool(re.search(r'const SOURCE_VERSION=',s)),
                  'source_alternates_use':[]}
          for ref in m[1:]:
              block=s[max(0,ref.start()-500):min(len(s),ref.end()+700)]
              # Parse control-flow vocabulary only; never emit private source text,
              # encoded manifest, payload, video data or URLs.
              result['source_alternates_use'].append({
                  'uses_version_variable':bool(re.search(r'\$\w*[Vv]ersion\w*',block)),
                  'uses_array_key':bool(re.search(r'\[[^\]]+\]',block)),
                  'uses_version_map':bool(re.search(r'SOURCE_ALTERNATES\s*\[',block)),
                  'calls_array_key_exists': 'array_key_exists' in block,
                  'uses_source_manifest': 'SOURCE_MANIFEST' in block,
                  'mentions_validate': 'verify' in block.lower() or 'manifest' in block.lower(),
                  'uses_hash_equals': 'hash_equals' in block,
                  'uses_in_array': 'in_array' in block,
                  'alt_keys':sorted(set(re.findall(r"\[['\"]([A-Za-z_]{3,26})['\"]\]",block)))[:30],
                  'branch_words':sorted(set(w for w in ('isset','is_array','array_key_exists','if','foreach','return','manifest','SOURCE_VERSION','SOURCE_MANIFEST','SOURCE_ALTERNATES') if w in block))
              })
          # Describe the non-secret alternate-entry shape via syntax only.
          block=s[m[-1].start():m[-1].start()+6500]
          result['all_alt_literal_keys']=sorted(set(re.findall(r"\\[['\\\"]([A-Za-z_]{3,35})['\\\"]\\]",block)))
          result['alt_loop_headings']=[x.strip() for x in re.findall(r'foreach\\s*\\(([^)]*SOURCE_ALTERNATES[^)]*)\\)',block)][:3]
          result['index_by_version']=bool(re.search(r'\\$[a-zA-Z_]+\\[\\$[a-zA-Z_]*version[a-zA-Z_]*\\]',block,re.I))
          result['is_map_hash_manifest']='hash_file' in block and 'foreach' in block
          result['uses_keys']=sorted(set(re.findall(r'array_keys\\s*\\(\\$([A-Za-z_]+)\\)',block)))
          result['uses_manifest_compare']=('hash_equals' in block or 'hash(' in block)
          print('P01_ATOMIC_ALTERNATE_CONTRACT='+json.dumps(result,sort_keys=True))
          assert result['source_alternates_defined']
          PY
          php -l repair-v2.47.407.php
          php repair-v2.47.407.php --self-test | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok"); print("P01_BASE_ATOMIC_SELFTEST=PASS")'
          rm -rf "$RUNNER_TEMP/multisource"
