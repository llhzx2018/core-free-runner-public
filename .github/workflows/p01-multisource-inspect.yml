name: P01 One-time Multi-Source Atomic Gate (NO PUBLISH)

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-multisource-inspect.yml']

permissions:
  contents: read

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted public builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP with real extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl,mbstring,sqlite3,pdo_sqlite,SimpleXML,zip
          coverage: none
      - name: Download verified formal source versions and create temporary 408
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ROOT="$RUNNER_TEMP/p01-multisource-proof"
          echo "P01_WORK=$ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          for v in 2.47.405 2.47.406 2.47.407; do
            mkdir -p "$ROOT/$v/full" "$ROOT/$v/repair"
            gh release download "v$v" -R llhzx2018/vf-start -D "$ROOT/$v" -p "VF-Start-V$v-FULL.zip" -p "VF_Start_V${v}_UPDATE.zip"
            unzip -q "$ROOT/$v/VF-Start-V$v-FULL.zip" -d "$ROOT/$v/full"
            unzip -q "$ROOT/$v/VF_Start_V${v}_UPDATE.zip" -d "$ROOT/$v/repair"
            test -f "$ROOT/$v/repair/repair-v$v.php"
          done
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/product"
          git -C "$ROOT/product" remote set-url origin "https://github.com/llhzx2018/vf-start.git"
          test "$(cat "$ROOT/product/src/VERSION.txt")" = 2.47.407
          echo 2.47.408 > "$ROOT/product/src/VERSION.txt"
          sed -i "s/define('VF_VERSION', '2.47.407');/define('VF_VERSION', '2.47.408');/" "$ROOT/product/src/app/bootstrap.php"
          mkdir -p "$ROOT/out"
          python3 scripts/p01-maintenance-release.py --candidate "$ROOT/product/src" --baseline-full "$ROOT/2.47.405/full" --baseline-repair "$ROOT/2.47.405/repair/repair-v2.47.405.php" --out "$ROOT/out" --version 2.47.408 --source-version 2.47.405 --target-sha 0000000000000000000000000000000000000000 --target-tree 0000000000000000000000000000000000000000 > "$ROOT/build.txt"
          unzip -q "$ROOT/out/VF_Start_V2.47.408_UPDATE.zip" -d "$ROOT/out"
          echo 'P01_MULTISOURCE_BASE405_BUILD=PASS'
      - name: Bind each legacy byte hash as alternate source for common files only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$P01_WORK" <<'PY'
          import re,base64,json,pathlib,sys,hashlib
          root=pathlib.Path(sys.argv[1])
          repair=root/'out/repair-v2.47.408.php'
          php=repair.read_text()
          b=root/'2.47.405/repair/repair-v2.47.405.php'
          match=re.search(r"private const TARGET_MANIFEST='([^']+)';",b.read_text())
          assert match
          baseline=json.loads(base64.b64decode(match.group(1)))
          assert len(baseline)>100
          alternate={}
          for rel,prior in baseline.items():
              hashes=[]
              for v in ('2.47.406','2.47.407'):
                  p=root/v/'full'/rel
                  if p.is_file():
                      digest=hashlib.sha256(p.read_bytes()).hexdigest()
                      if digest!=prior and digest not in hashes:hashes.append(digest)
              if hashes:alternate[rel]=hashes
          assert alternate
          encoded=base64.b64encode(json.dumps(alternate,sort_keys=True,separators=(',',':')).encode()).decode()
          php,n=re.subn(r"(private const SOURCE_ALTERNATES=)'[^']*';",lambda m:m.group(1)+"'"+encoded+"';",php)
          assert n==1
          repair.write_text(php)
          print('P01_ALT_BY_PATH_COUNT='+str(len(alternate)))
          print('P01_ALTERNATES_BASE405=PASS')
          PY
          php -l "$P01_WORK/out/repair-v2.47.408.php" >/dev/null
      - name: Verify old source byte fingerprints and apply to disposable copies
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$P01_WORK"
          REPAIR="$ROOT/out/repair-v2.47.408.php"
          fail=0
          for v in 2.47.405 2.47.406 2.47.407; do
            cp -a "$ROOT/$v/full" "$ROOT/upgrade-$v"
            if php "$REPAIR" "--verify-source=$ROOT/upgrade-$v" >"$ROOT/verify-$v.json" 2>&1; then
              echo "P01_MULTISOURCE_VERIFY_$v=PASS"
              echo "owner-sentinel-$v" > "$ROOT/upgrade-$v/owner-sentinel.txt"
              cp "$REPAIR" "$ROOT/upgrade-$v/repair-v2.47.408.php"
              if php "$ROOT/upgrade-$v/repair-v2.47.408.php" "--run=$ROOT/upgrade-$v" > "$ROOT/install-$v.json" 2>&1; then
                test "$(cat "$ROOT/upgrade-$v/VERSION.txt")" = 2.47.408
                test "$(cat "$ROOT/upgrade-$v/owner-sentinel.txt")" = "owner-sentinel-$v"
                echo "P01_MULTISOURCE_APPLY_$v=PASS"
              else
                echo "P01_MULTISOURCE_APPLY_$v=FAIL"
                python3 - "$ROOT/install-$v.json" <<'PY'
          import json,sys,re
          try:
              d=json.load(open(sys.argv[1]))
              print('P01_MULTISOURCE_APPLY_KEYS='+','.join(sorted(d.keys()))[:100])
              err=str(d.get('error') or d.get('message') or d.get('reason') or d.get('errors') or 'unspecified')
              err=re.sub(r'(?:/[^/\\s]+){2,}','[path]',err)
              print('P01_MULTISOURCE_APPLY_ERROR='+err[:180])
          except Exception:
              print('P01_MULTISOURCE_APPLY_ERROR=non_json')
          PY
                fail=1
              fi
            else
              echo "P01_MULTISOURCE_VERIFY_$v=FAIL"
              python3 - "$ROOT/verify-$v.json" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              e=d.get('errors') or []
              print('P01_ALT_ERRORS='+str(len(e))+':'+','.join(str(x).split(':')[-1] for x in e[:3])[:100])
          except Exception:
              print('P01_ALT_ERRORS=unparsed')
          PY
              fail=1
            fi
          done
          test "$fail" -eq 0
          echo 'P01_MULTISOURCE_BYTE_GUARD_AND_APPLY=PASS'
      - name: Remove all product bytes and artifacts
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_WORK:-}" ]; then rm -rf -- "$P01_WORK"; fi
          echo P01_MULTISOURCE_EPHEMERAL=PASS
