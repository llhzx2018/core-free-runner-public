name: P01 Atomic Alternate Source Contract Inspect (One Shot)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-multisource-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect structure of existing private signed atomic repair without publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/multisource"
          gh release download v2.47.407 -R llhzx2018/vf-start -D "$RUNNER_TEMP/multisource" -p 'VF_Start_V2.47.407_UPDATE.zip'
          cd "$RUNNER_TEMP/multisource"
          unzip -q VF_Start_V2.47.407_UPDATE.zip
          python3 - <<'PY'
          import re, pathlib, json
          s=pathlib.Path('repair-v2.47.407.php').read_text()
          m=list(re.finditer(r'SOURCE_ALTERNATES',s))
          result={'source_alternates_defined':len(m)>1,
                  'source_alternates_mentions':len(m),
                  'has_source_manifest':bool(re.search(r'const SOURCE_MANIFEST=',s)),
                  'has_source_version':bool(re.search(r'const SOURCE_VERSION=',s)),
                  'source_alternates_use':[]}
          for ref in m[1:]:
              block=s[max(0,ref.start()-500):min(len(s),ref.end()+700)]
              # Parse control-flow vocabulary only; never emit private source text,
              # encoded manifest, payload, video data or URLs.
              result['source_alternates_use'].append({
                  'uses_version_variable':bool(re.search(r'\$\w*[Vv]ersion\w*',block)),
                  'uses_array_key':bool(re.search(r'\[[^\]]+\]',block)),
                  'uses_version_map':bool(re.search(r'SOURCE_ALTERNATES\s*\[',block)),
                  'calls_array_key_exists': 'array_key_exists' in block,
                  'uses_source_manifest': 'SOURCE_MANIFEST' in block,
                  'mentions_validate': 'verify' in block.lower() or 'manifest' in block.lower(),
                  'uses_hash_equals': 'hash_equals' in block,
                  'uses_in_array': 'in_array' in block,
                  'alt_keys':sorted(set(re.findall(r"\[['\"]([A-Za-z_]{3,26})['\"]\]",block)))[:30],
                  'branch_words':sorted(set(w for w in ('isset','is_array','array_key_exists','if','foreach','return','manifest','SOURCE_VERSION','SOURCE_MANIFEST','SOURCE_ALTERNATES') if w in block))
              })
          # Describe the non-secret alternate-entry shape via syntax only.
          block=s[m[-1].start():m[-1].start()+6500]
          result['all_alt_literal_keys']=sorted(set(re.findall(r"\\[['\\\"]([A-Za-z_]{3,35})['\\\"]\\]",block)))
          result['alt_loop_headings']=[x.strip() for x in re.findall(r'foreach\\s*\\(([^)]*SOURCE_ALTERNATES[^)]*)\\)',block)][:3]
          result['index_by_version']=bool(re.search(r'\\$[a-zA-Z_]+\\[\\$[a-zA-Z_]*version[a-zA-Z_]*\\]',block,re.I))
          result['is_map_hash_manifest']='hash_file' in block and 'foreach' in block
          result['uses_keys']=sorted(set(re.findall(r'array_keys\\s*\\(\\$([A-Za-z_]+)\\)',block)))
          result['uses_manifest_compare']=('hash_equals' in block or 'hash(' in block)
          print('P01_ATOMIC_ALTERNATE_CONTRACT='+json.dumps(result,sort_keys=True))
          assert result['source_alternates_defined']
          PY
          php -l repair-v2.47.407.php
          php repair-v2.47.407.php --self-test | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok"); print("P01_BASE_ATOMIC_SELFTEST=PASS")'
          echo "P01_ALT_STRUCTURAL_INSPECTION=PASS"

      - name: Black-box test of exact formal 405/406 alternate compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p01-multisource-405"
          mkdir -p "$ROOT"
          for v in 2.47.405 2.47.406 2.47.407; do
            mkdir -p "$ROOT/$v/full" "$ROOT/$v/repair"
            gh release download "v$v" -R llhzx2018/vf-start -D "$ROOT/$v" -p "VF-Start-V$v-FULL.zip" -p "VF_Start_V${v}_UPDATE.zip"
            unzip -q "$ROOT/$v/VF-Start-V$v-FULL.zip" -d "$ROOT/$v/full"
            unzip -q "$ROOT/$v/VF_Start_V${v}_UPDATE.zip" -d "$ROOT/$v/repair"
            test -f "$ROOT/$v/repair/repair-v$v.php"
          done
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/source"
          git -C "$ROOT/source" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(tr -d '\\r\\n ' < "$ROOT/source/src/VERSION.txt")" = 2.47.407
          echo 2.47.408 > "$ROOT/source/src/VERSION.txt"
          mkdir -p "$ROOT/out"
          python3 scripts/p01-maintenance-release.py --candidate "$ROOT/source/src" --baseline-full "$ROOT/2.47.407/full" --baseline-repair "$ROOT/2.47.407/repair/repair-v2.47.407.php" --out "$ROOT/out" --version 2.47.408 --source-version 2.47.407 --target-sha 0000000000000000000000000000000000000000 --target-tree 0000000000000000000000000000000000000000 > /dev/null
          unzip -q "$ROOT/out/VF_Start_V2.47.408_UPDATE.zip" -d "$ROOT/out"
          python3 - "$ROOT" <<'PY'
          import re,base64,json,pathlib,sys,hashlib
          root=pathlib.Path(sys.argv[1])
          target=root/'out/repair-v2.47.408.php'
          php=target.read_text()
          versions=('2.47.405','2.47.406')
          manifests=[]
          for v in versions:
              older=(root/v/'repair'/f'repair-v{v}.php').read_text()
              m=re.search(r"private const TARGET_MANIFEST='([^']+)';",older)
              assert m
              manifest=json.loads(base64.b64decode(m.group(1)))
              assert isinstance(manifest,dict) and len(manifest)>0
              for rel,expected in manifest.items():
                  p=root/v/'full'/rel
                  assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected
              manifests.append(manifest)
          val=base64.b64encode(json.dumps(manifests,separators=(',',':'),sort_keys=True).encode()).decode()
          php,n=re.subn(r"(private const SOURCE_ALTERNATES=)'[^']*';",lambda m:m.group(1)+"'"+val+"';",php)
          assert n==1
          target.write_text(php)
          print('P01_ALT_MANIFESTS_VERIFIED=PASS')
          PY
          php -l "$ROOT/out/repair-v2.47.408.php" >/dev/null
          for v in 2.47.405 2.47.406 2.47.407; do
            if php "$ROOT/out/repair-v2.47.408.php" "--verify-source=$ROOT/$v/full" > "$ROOT/verify-$v.json" 2>&1; then
              echo "P01_ATOMIC_SOURCE_$v=PASS"
            else
              echo "P01_ATOMIC_SOURCE_$v=FAIL"
              python3 - "$ROOT/verify-$v.json" <<'PY'
          import json,sys
          try:
              d=json.load(open(sys.argv[1]))
              import re
              cause=str(d.get('error') or d.get('message') or d.get('code') or d.get('error_code') or d.get('reason') or 'unspecified')
              cause=re.sub(r'(?:/[^/\s]+){2,}','[path]',cause)
              print('P01_ALT_VERIFY_ERROR_KIND='+cause[:180])
              print('P01_ALT_VERIFY_KEYS='+','.join(sorted(d.keys()))[:120])
          except Exception:
              print('P01_ALT_VERIFY_ERROR_KIND=non_json')
          PY
            fi
          done
          rm -rf "$ROOT"

