name: P01 V2.30 Final Remote Online Update Gate
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-remote-online-update-final-20260829.yml
      - scripts/p01-v230-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v230-final-owner
      PORT: '18634'
      ADMIN_PASS: 'P01V230!FinalRemote'
      EVID: /tmp/p01-v230-final-evidence
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.29.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 53fc02ebd99007793877a281e53238a591e7e485
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C production rev-parse HEAD)" = aa9070bb810064df2e965a793b999ac8bde5734e
          test "$(git -C updates rev-parse HEAD)" = 53fc02ebd99007793877a281e53238a591e7e485
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.30.0 --jq .object.sha)" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.30.0 --jq .id)" = 378891859
          jq -e '.current_version=="2.29.0" and .target_version=="2.30.0" and .from_versions==["2.29.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.30.0" and .release_id==378891859 and .product_identity=="40b2d5239c557ab6c7b9aaaa092acffa9fb926f9" and .asset_name=="VF_Start_V2.30.0_UPDATE.zip" and .asset_bytes==1328072 and .asset_sha256=="65869be49eb094d2be97609aa4fd588aeed737b97695882fc3b216eaf20edcb0"' updates/projects/P01.json >/dev/null
          echo P01_V230_FINAL_REMOTE_TRUTH_FENCE=PASS
      - name: Real remote update plus data HTTP desktop mobile gate
        shell: bash
        run: bash runner/scripts/p01-v230-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V229_TO_V230_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V230_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V230_DATA_PRESERVATION=PASS
          P01_V230_PUBLIC_PRIVATE_HTTP=PASS
          P01_V230_DESKTOP_MOBILE_BROWSER=PASS
          P01_V230_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v230-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v230-final-evidence
          if-no-files-found: warn
          retention-days: 30
# trigger-existing-workflow: 1
