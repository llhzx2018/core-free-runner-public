name: P07 Network Node Real Install Gate

on:
  push:
    paths:
      - 'release-triggers/p07-network-node-real-install.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-ubuntu-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read exact private source identity
        id: source
        run: |
          set -euo pipefail
          test -f release-triggers/p07-network-node-real-install.json
          SHA="$(python3 -c 'import json; print(json.load(open("release-triggers/p07-network-node-real-install.json"))["source_sha"])')"
          test "${#SHA}" = 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private network-node source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          SRC_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}" \
            -o "${TMP}/source.tar.gz"
          mkdir -p .p07-network-node-source
          tar -xzf "${TMP}/source.tar.gz" -C "${TMP}"
          SRC_DIR="$(find "${TMP}" -mindepth 1 -maxdepth 1 -type d -name 'llhzx2018-vf-server-ops-*' | head -n1)"
          test -n "$SRC_DIR"
          test -f "$SRC_DIR/modules/network-node/tests/ephemeral_install_gate.sh"
          cp -a "$SRC_DIR/." .p07-network-node-source/

      - name: Preflight exact source and syntax gates
        run: |
          set -euo pipefail
          cd .p07-network-node-source
          bash modules/network-node/tests/static_gate.sh
          bash modules/network-node/tests/upstream_patch_gate.sh

      - name: Run disposable Ubuntu 24.04 install gate
        run: |
          set -euo pipefail
          cd .p07-network-node-source
          sudo env NO_COLOR=1 VF_NODE_GATE_PORT=31535 \
            bash modules/network-node/tests/ephemeral_install_gate.sh

      - name: Emit exact real-install markers
        env:
          SRC_SHA: ${{ steps.source.outputs.sha }}
        run: |
          echo "P07_NETWORK_NODE_REAL_INSTALL_SOURCE_SHA=${SRC_SHA}"
          echo 'P07_NETWORK_NODE_EPHEMERAL_UBUNTU_2404=PASS'
