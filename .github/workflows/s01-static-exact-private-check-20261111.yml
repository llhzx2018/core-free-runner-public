name: S01 exact private source static-first contract proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-static-exact-private-check-20261111.yml'

permissions:
  contents: read

jobs:
  exact-source:
    name: ${{ matrix.name }} private source & denial fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Theme
            repository: llhzx2018/vf-tools-theme
            tested_sha: bf7068d8c983de908920dd41b59191156c0fa2a6
          - name: Ops
            repository: llhzx2018/vf-tools-ops
            tested_sha: f86af898e5ed72c916f9b0e9f82d38705f243561
          - name: M3U8
            repository: llhzx2018/vf-tools-m3u8
            tested_sha: 5a7b577a889cee175a9bf2d71afe58552a199fad
    steps:
      - name: Verify registered private-read capability (no secret disclosure)
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if test -z "$PRIVATE_READ"; then echo BLOCKED_PRIVATE_READ_CAPABILITY; exit 78; fi
          echo REGISTERED_PRIVATE_READ_CAPABILITY=PRESENT
      - name: Temporarily fetch exact private product source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.tested_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and real runnable Python syntax
        working-directory: product
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.tested_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -m py_compile scripts/check_s01_static_modernization.py tests/unit/test_s01_static_modernization.py
          echo S01_EXACT_SOURCE_AND_SYNTAX=PASS
      - name: Verify static-first/WordPress runtime source constraints
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_s01_static_modernization.py --phase auto
      - name: Run real positive and negative fixture tests
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/unit -p test_s01_static_modernization.py -v
      - name: Cleanup temporary private source without publishing artifacts
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
