name: P07 release114 exact-source 17-site file rollback sandbox
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release114-file-batch-gate.yml'
permissions:
  contents: read
jobs:
  exact-source-private-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P07 candidate into transient runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 08c092377e2372df71d6b48e96a4ae83e60ac1f7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: _private_p07_candidate

      - name: Assert exact product SHA and execute only isolated synthetic proof
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _private_p07_candidate rev-parse HEAD)" = \
            "08c092377e2372df71d6b48e96a4ae83e60ac1f7"
          cd _private_p07_candidate
          test "$(cat BUILD_ID)" = "0.1.0-release114"
          bash -n bin/vfops-migrate-ui bin/vfops-init-ui bin/vfops-user bin/vfops
          python3 -B -m py_compile \
            lib/migration_chain_file_batch.py \
            lib/migration_chain_final_saga.py \
            lib/migration_three_site_window.py \
            lib/migration_chain_asset_audit.py \
            lib/migration_chain_private_resource_stage.py \
            lib/migration_chain_source_pause.py \
            lib/migration_chain_paused_sql.py \
            lib/migration_chain_three_owner_shadow.py \
            lib/migration_fresh_cp2.py \
            lib/migration_sql_failure_retention.py \
            lib/diagnostics.py \
            lib/migration_chain_frozen_files.py \
            lib/server_migration_pull.py \
            tests/test_p07_17site_delivery.py \
            tests/test_p07_source_pause.py \
            tests/test_p07_paused_sql.py \
            tests/test_migration_chain_three_owner_shadow.py \
            tests/test_migration_fresh_cp2.py \
            tests/test_p07_fresh_menu.py \
            tests/test_migration_sql_failure_retention.py \
            tests/test_migration_sql_adopted_resume.py \
            tests/test_p07_mariadb_init_skip.py \
            tests/test_migration_chain_private_resource_stage.py \
            tests/test_migration_chain_resource_bindings.py \
            tests/test_migration_chain_file_batch.py \
            tests/test_migration_chain_final_saga.py \
            tests/test_migration_three_site_window.py
          python3 -B -m unittest -v \
            tests.test_migration_chain_file_batch \
            tests.test_migration_chain_final_saga \
            tests.test_migration_three_site_window \
            tests.test_migration_chain_resource_bindings \
            tests.test_migration_chain_private_resource_stage \
            tests.test_p07_17site_delivery \
            tests.test_p07_source_pause \
            tests.test_p07_paused_sql \
            tests.test_migration_chain_three_owner_shadow \
            tests.test_migration_fresh_cp2 \
            tests.test_p07_fresh_menu \
            tests.test_migration_sql_failure_retention \
            tests.test_migration_sql_adopted_resume \
            tests.test_migration_safe_session_guard \
            tests.test_p07_mariadb_init_skip \
            tests.test_p07_bundle_identity
          PYTHONPATH=lib python3 -B - <<'PY'
          import tempfile
          from pathlib import Path
          from migration_chain_frozen_files import mirrored_tree_hash, FrozenFilesBlocked
          with tempfile.TemporaryDirectory(prefix="p07-frozen-files-synthetic-") as tmp:
              root=Path(tmp)
              left=root/"original"
              right=root/"private"
              left.mkdir(mode=0o700)
              right.mkdir(mode=0o700)
              (left/"assets").mkdir(mode=0o700)
              (right/"assets").mkdir(mode=0o700)
              for folder in (left,right):
                  file=folder/"assets"/"part.txt"
                  file.write_bytes(b"source-fixed-data")
                  file.chmod(0o600)
              (left/"wp-config.php").write_text("secret config not copied")
              result1=mirrored_tree_hash(left,excludes=("wp-config.php",))
              result2=mirrored_tree_hash(right,excludes=("wp-config.php",))
              assert result1["tree_sha256"]==result2["tree_sha256"]
              assert result1["file_count"]==1
              (right/"assets"/"part.txt").write_bytes(b"drift")
              assert (mirrored_tree_hash(right,excludes=("wp-config.php",))["tree_sha256"] != result1["tree_sha256"])
              (right/"assets"/"link.txt").symlink_to("part.txt")
              try:
                  mirrored_tree_hash(right,excludes=("wp-config.php",))
              except FrozenFilesBlocked:
                  pass
              else:
                  raise AssertionError("source symlink must be rejected")
          print("P07_UNWIRED_FROZEN_FILE_HASH_SYNTAX_PARITY_DRIFT_SYMLINK=PASS")
          PY
          echo P07_EXACT_PRODUCT_SHA_ISOLATED_17_SITE_ROLLBACK_SYNTHETIC_PASS
      - name: P07 release114 remaining baseline and secret gates on same exact source
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        timeout-minutes: 6
        run: |
          set -Eeuo pipefail
          cd _private_p07_candidate
          test "$(git rev-parse HEAD)" = "08c092377e2372df71d6b48e96a4ae83e60ac1f7"
          bash tests/smoke.sh
          python3 -B scripts/secret_scan.py --root .
          PYTHONPATH=lib python3 -B -m unittest -v \
            tests.test_cloudpanel tests.test_cloudpanel_site \
            tests.test_cloudpanel_integration tests.test_cloudpanel_ui_complete \
            tests.test_site_lifecycle tests.test_restore_as \
            tests.test_restore_as_verified tests.test_restore_as_real_db_compat \
            tests.test_restore_as_machine_e2e tests.test_menu3_modular \
            tests.test_inventory tests.test_backup tests.test_storage \
            tests.test_restore tests.test_restore_apply tests.test_restore_new \
            tests.test_runtime tests.test_verify tests.test_migrate \
            tests.test_migrate_new tests.test_transport tests.test_cli_transport \
            tests.test_server_migration tests.test_app_config tests.test_cutover \
            tests.test_policy tests.test_ux tests.test_diagnostics \
            tests.test_cli_diagnostics tests.test_ops_diagnostics \
            tests.test_auto_backup tests.test_auto_backup_run_now_ux \
            tests.test_site_overview_alignment tests.test_secret_scan \
            tests.test_cli_menu tests.test_release11_beginner_ia \
            tests.test_main_menu_routes tests.test_storage_onboarding_ux \
            tests.test_release78_contextual_menus
          echo P07_EXACT_SOURCE_REMAINING_PRODUCT_BASELINE_AND_SECRET_GATES_PASS
      - name: Actual isolated MariaDB 11.8 three-owner cron/DB rollback
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          cd _private_p07_candidate
          python3 -B -m py_compile tests/test_migration_final_db_real_engine.py
          PYTHONPATH=lib python3 -B -m unittest -v tests.test_server_migration_pull
          python3 -B -m unittest -v tests.test_migration_final_db_shadow
          python3 -B -m unittest -v tests.test_migration_final_db_real_engine
          echo P07_THREE_OWNER_REAL_MARIADB_SHADOW_CRON_ROLLBACK_PASS

      - name: Checkout pinned public P07 installer baseline into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 2d976eac5d4e44f0e588d3adfa2810aaf5d920e1
          persist-credentials: false
          path: _public_p07_baseline

      - name: Build and verify private exact-source release114 offline installation candidate
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _private_p07_candidate rev-parse HEAD)" = \
            "08c092377e2372df71d6b48e96a4ae83e60ac1f7"
          test "$(git -C _public_p07_baseline rev-parse HEAD)" = \
            "2d976eac5d4e44f0e588d3adfa2810aaf5d920e1"
          python3 -B _private_p07_candidate/scripts/p07_candidate_bundle.py \
            --product-root _private_p07_candidate \
            --public-root _public_p07_baseline \
            --output _candidate_release114 \
            --product-sha 08c092377e2372df71d6b48e96a4ae83e60ac1f7 \
            --build 0.1.0-release114 \
            --care 0.1.0-rc81
          bash -n _candidate_release114/installers/p07-final.sh \
            _candidate_release114/installers/p07.sh \
            _candidate_release114/installers/p07-toolbox.sh \
            _candidate_release114/installers/p07-system-care.sh
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path("_candidate_release114")
          stage = base / "dist/p07/0.1.0/overlay"
          attest = json.loads((base / "candidate_attestation.json").read_text())
          def blob(payload):
              return hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          def assert_manifest(path):
              lines = path.read_text().splitlines()
              assert lines
              for line in lines:
                  sha, filename = line.split("  ", 1)
                  actual = path.parent / filename
                  assert actual.is_file() and blob(actual.read_bytes()) == sha
              return [line.split("  ", 1)[1] for line in lines]
          runtime = assert_manifest(stage / "RUNTIME.gitblob")
          total = assert_manifest(stage / "MANIFEST.gitblob")
          assert attest["schema"] == "p07.release-candidate.offline.v1"
          assert attest["status"] == "FORMAL_STAGING_NOT_PUBLISHED"
          assert attest["product_source_sha"] == "08c092377e2372df71d6b48e96a4ae83e60ac1f7"
          assert attest["product_build"] == "0.1.0-release114"
          assert attest["system_care_build"] == "0.1.0-rc81"
          assert "lib/migration_chain_private_file_stage.py" in runtime
          assert "lib/migration_chain_private_resource_stage.py" in runtime
          assert "lib/migration_chain_source_pause.py" in runtime
          assert "lib/migration_chain_paused_sql.py" in runtime
          assert "lib/migration_chain_three_owner_shadow.py" in runtime
          assert "lib/migration_fresh_cp2.py" in runtime
          assert "lib/migration_sql_failure_retention.py" in runtime
          assert "lib/migration_chain_final_saga.py" in runtime
          assert "lib/migration_final_db_shadow.py" in runtime
          assert "lib/migration_final_db_batch.py" in runtime
          assert "lib/server_migration_pull.py" in runtime
          assert "tests/test_migration_chain_final_saga.py" in total
          assert "tests/test_p07_17site_delivery.py" in total
          assert "tests/test_p07_source_pause.py" in total
          assert "tests/test_p07_paused_sql.py" in total
          assert "tests/test_migration_chain_three_owner_shadow.py" in total
          assert "tests/test_migration_fresh_cp2.py" in total
          assert "tests/test_p07_fresh_menu.py" in total
          assert "tests/test_migration_sql_failure_retention.py" in total
          assert "tests/test_migration_sql_adopted_resume.py" in total
          assert "tests/test_p07_mariadb_init_skip.py" in total
          assert len(total) >= len(runtime)
          assert attest["runtime_manifest_blob"] == blob(
              (stage / "RUNTIME.gitblob").read_bytes())
          assert attest["overlay_manifest_blob"] == blob(
              (stage / "MANIFEST.gitblob").read_bytes())
          assert attest["negative"] == {
              "vps_modified": False, "production_modified": False,
              "public_main_modified": False, "source_deleted": False,
              "dns_modified": False,
          }
          print("P07_RELEASE114_EXACT_OFFLINE_INSTALLER_BUILD=PASS")
          print("P07_INSTALLER_MANIFEST_FULL_READBACK=PASS")
          print("P07_RELEASE_OR_SERVER_DEPLOYMENT=NOT_ATTEMPTED")
          PY

      - name: Real local isolated install, 113-to-114 upgrade, failed-install rollback and no-op
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          P07_ALLOW_NONROOT: "1"
          P07_NO_EXEC: "1"
        run: |
          set -Eeuo pipefail
          sandbox="$(mktemp -d -t p07-local-install.XXXXXX)"
          trap 'rm -rf -- "$sandbox"' EXIT
          export P07_INSTALL_DIR="$sandbox/installed"
          export P07_PREVIOUS_DIR="$sandbox/previous"
          export P07_BIN_LINK="$sandbox/vfops"
          export P07_PUBLIC_ROOT="file://$GITHUB_WORKSPACE/_public_p07_baseline"
          bash _public_p07_baseline/installers/p07-final.sh >"$sandbox/install113.log" 2>&1
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release113"
          test -f "$P07_INSTALL_DIR/.runtime-manifest.gitblob"
          mkdir "$sandbox/invalid-bin-link"
          export P07_PUBLIC_ROOT="file://$GITHUB_WORKSPACE/_candidate_release114"
          # Force a post-swap path activation failure in a TEMP directory.
          # A real failed install must restore the exact old runtime.
          if P07_BIN_LINK="$sandbox/invalid-bin-link" \
              bash _candidate_release114/installers/p07-final.sh \
              >"$sandbox/failure-injection.log" 2>&1; then
            echo P07_ROLLBACK_NEGATIVE_CASE_UNEXPECTEDLY_SUCCEEDED >&2
            exit 1
          fi
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release113"
          test ! -e "$P07_PREVIOUS_DIR"
          # Now do an ordinary candidate upgrade and verify the old backup.
          bash _candidate_release114/installers/p07-final.sh >"$sandbox/upgrade114.log" 2>&1
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release114"
          test "$(NO_COLOR=1 bash "$P07_PREVIOUS_DIR/bin/vfops-user" --build-id)" = \
            "0.1.0-release113"
          installed_sha="$(sha256sum "$P07_INSTALL_DIR/.runtime-manifest.gitblob")"
          bash _candidate_release114/installers/p07-final.sh >"$sandbox/no-op.log" 2>&1
          test "$(sha256sum "$P07_INSTALL_DIR/.runtime-manifest.gitblob")" = \
            "$installed_sha"
          test "$(NO_COLOR=1 "$P07_BIN_LINK" --build-id)" = "0.1.0-release114"
          test "$(NO_COLOR=1 bash "$P07_PREVIOUS_DIR/bin/vfops-user" --build-id)" = \
            "0.1.0-release113"
          test -f "$P07_INSTALL_DIR/bin/vfops-migrate-ui" || test -f "$P07_INSTALL_DIR/bin/vfops-user"
          grep -Fq 'mariadb_tuning_safe_skip' "$P07_INSTALL_DIR/bin/vfops-init-ui"
          grep -Fq 'fresh-17site preview' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          grep -Fq 'fresh-17site prepare' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          grep -Fq 'server-migrate diagnose-sql --migration-id' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          grep -Fq 'resume-verified-adoption' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          grep -Fq 'resume-verified-adoption' "$P07_INSTALL_DIR/bin/vfops"
          grep -Fq 'retain_failed_import' "$P07_INSTALL_DIR/lib/server_migration_pull.py"
          grep -Fq 'SQL_CONDITIONAL_DDL_UNPROVEN' "$P07_INSTALL_DIR/lib/diagnostics.py"
          test -f "$P07_INSTALL_DIR/lib/migration_sql_failure_retention.py"
          grep -Fq '数据库验证被安全拦截；不能直接续跑或重新导入' "$P07_INSTALL_DIR/bin/vfops-migrate-ui"
          NO_COLOR=1 "$P07_BIN_LINK" fresh-17site --help >"$sandbox/fresh-cli-help.log"
          grep -Fq "PREPARE_FRESH_CP2_17_SITES" "$sandbox/fresh-cli-help.log" || true
          grep -Fq -- "--source-ip" "$sandbox/fresh-cli-help.log"
          NO_COLOR=1 "$P07_BIN_LINK" server-migrate chain-17site-delivery --help >"$sandbox/17site-cli-help.log"
          grep -Fq 'private-prestage' "$sandbox/17site-cli-help.log"
          grep -Fq 'verify-private' "$sandbox/17site-cli-help.log"
          grep -Fq 'pause-preview' "$sandbox/17site-cli-help.log"
          grep -Fq 'paused-db-copy' "$sandbox/17site-cli-help.log"
          grep -Fq 'verify-paused-dbs' "$sandbox/17site-cli-help.log"
          echo P07_INSTALLED_REAL_17SITE_DELIVERY_ENTRY=PASS
          echo P07_LOCAL_OFFLINE_INSTALL_UPGRADE_FAILED_SWAP_ROLLBACK_NOOP=PASS
          echo P07_REAL_CLOUDPANEL_OR_PRODUCTION_INSTALL=NOT_ATTEMPTED

      - name: Always remove private source and offline candidate from temporary workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          for private_path in _private_p07_candidate _candidate_release114 _public_p07_baseline; do
            if [ -d "$private_path" ]; then
              rm -rf -- "$private_path"
            fi
          done
          echo P07_PRIVATE_SOURCE_AND_OFFLINE_CANDIDATE_CLEANED
