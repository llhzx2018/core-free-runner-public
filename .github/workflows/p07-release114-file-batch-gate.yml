name: P07 release114 exact-source 17-site file rollback sandbox
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release114-file-batch-gate.yml'
permissions:
  contents: read
jobs:
  exact-source-private-checkout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private P07 candidate into transient runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 89ce926b5ea6d1e8777131bf7ea5eb04f4a2a2f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: _private_p07_candidate

      - name: Assert exact product SHA and execute only isolated synthetic proof
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _private_p07_candidate rev-parse HEAD)" = \
            "89ce926b5ea6d1e8777131bf7ea5eb04f4a2a2f9"
          cd _private_p07_candidate
          test "$(cat BUILD_ID)" = "0.1.0-release114"
          python3 -B -m py_compile \
            lib/migration_chain_file_batch.py \
            lib/migration_chain_final_saga.py \
            tests/test_migration_chain_file_batch.py \
            tests/test_migration_chain_final_saga.py
          python3 -B -m unittest -v \
            tests.test_migration_chain_file_batch \
            tests.test_migration_chain_final_saga \
            tests.test_p07_bundle_identity
          echo P07_EXACT_PRODUCT_SHA_ISOLATED_17_SITE_ROLLBACK_SYNTHETIC_PASS

      - name: Always remove private source from temporary public-runner workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d _private_p07_candidate ]; then
            rm -rf -- _private_p07_candidate
          fi
          echo P07_PRIVATE_SOURCE_WORKSPACE_CLEANED
