name: P01 GOV-BOOK Admin Shell Integration Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p01-v247363-front-sync-back-auth.yml'
permissions:
  contents: read
jobs:
  backend:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-v247363-front-sync-back-auth-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact VF Start candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1f2d0fb299854cab2cc53f902ab7e9ff17b69173
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: PHP native prerequisites
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,mbstring,gd,zip,pdo_sqlite,sqlite3
          coverage: none
      - name: Real backend source and control contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 1f2d0fb299854cab2cc53f902ab7e9ff17b69173
          test "$(cat VERSION)" = 2.47.363
          for p in src/gov-book-manager.php src/gov-book-sync.php src/app/CourseLibraryPage.php src/app/AdminShell.php tests/unit/gov_book_backend_shell_contract.php tests/unit/gov_book_sync_contract_native.php tests/unit/gov_book_private_auth_isolation_native.php; do
            php -l "$p"
          done
          php tests/unit/gov_book_backend_shell_contract.php | tee /tmp/shell-contract.txt
          php tests/unit/gov_book_sync_contract_native.php
          php tests/unit/gov_book_private_auth_isolation_native.php
          php tests/unit/admin_update_credential_r27_contract.php
          php tests/integration/gov_book_sync_local_ownership_native.php
          grep -Fx 'P01_GOVBOOK_SINGLE_BACKEND_AUTH=PASS' /tmp/shell-contract.txt
          grep -Fx 'P01_GOVBOOK_FRONTEND_SYNC_ADMIN_ONLY=PASS' /tmp/shell-contract.txt
          grep -Fx 'P01_GOVBOOK_ACTION_ROUTING_AND_CSRF=PASS' /tmp/shell-contract.txt
          grep -Fx 'P01_GOVBOOK_SCOPED_TOKEN_GUIDANCE=PASS' /tmp/shell-contract.txt
          echo P01_GOVBOOK_V247363_EXACT_FRONT_BACK_SPLIT_GATE=PASS
