name: P04 V2.8.0 Formal Release

on:
  pull_request:
    branches: [main]

jobs:
  publish:
    if: contains(github.head_ref, 'p04-v280-formal-release')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 7009c10ea1d588ca54d76b0860b9834fc9a8f2c5
      EXPECTED_FULL_BYTES: '566107'
      EXPECTED_FULL_SHA: 2092c8c43c50363444a645245c248bac8b9b4a25c46ff3fc41fec409250ed4e1
      EXPECTED_UPDATE_BYTES: '42318'
      EXPECTED_UPDATE_SHA: 33bdb59d904bb2f98fe36ba91222e4398bad07001ee0211a61672f490ac723f8
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 7009c10ea1d588ca54d76b0860b9834fc9a8f2c5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0

      - name: Preflight publication identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '2.8.0'
          if gh release view v2.8.0 --repo llhzx2018/vf-infra >/dev/null 2>&1; then
            echo 'V280_RELEASE_ALREADY_EXISTS_FAIL_CLOSED' >&2
            exit 20
          fi
          if gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.0 >/dev/null 2>&1; then
            echo 'V280_TAG_ALREADY_EXISTS_FAIL_CLOSED' >&2
            exit 21
          fi
          echo 'V280_PUBLICATION_PREFLIGHT=PASS'

      - name: Rebuild exact formal assets
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET="$RUNNER_TEMP/v280-release-tree"
          OUT="$RUNNER_TEMP/v280-update"
          python3 scripts/build-release-tree.py "$TARGET"
          python3 - "$TARGET" "$RUNNER_TEMP/VF_Infra_V2.8.0_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          python3 scripts/build-v280-update-release.py --target-runtime "$TARGET" --output "$OUT"
          cp "$OUT/VF_Infra_V2.8.0_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.0_UPDATE.zip"
          php "$OUT/repair-v2.8.0.php" --self-test
          python3 - "$RUNNER_TEMP/VF_Infra_V2.8.0_FULL.zip" "$RUNNER_TEMP/VF_Infra_V2.8.0_UPDATE.zip" <<'PY'
          import hashlib,pathlib,sys,os
          full=pathlib.Path(sys.argv[1]); upd=pathlib.Path(sys.argv[2])
          vals=[('FULL',full,int(os.environ['EXPECTED_FULL_BYTES']),os.environ['EXPECTED_FULL_SHA']),('UPDATE',upd,int(os.environ['EXPECTED_UPDATE_BYTES']),os.environ['EXPECTED_UPDATE_SHA'])]
          for label,p,size,sha in vals:
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert p.stat().st_size==size,(label,p.stat().st_size,size)
              assert got==sha,(label,got,sha)
              print(f'V280_{label}_EXACT_CANDIDATE_MATCH=PASS')
          PY

      - name: Publish tag release and assets
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create v2.8.0 \
            "$RUNNER_TEMP/VF_Infra_V2.8.0_FULL.zip#VF Infra V2.8.0 FULL" \
            "$RUNNER_TEMP/VF_Infra_V2.8.0_UPDATE.zip#VF Infra V2.8.0 UPDATE" \
            --repo llhzx2018/vf-infra \
            --target "$SOURCE_SHA" \
            --title 'VF Infra V2.8.0' \
            --notes-file docs/operations/package/RELEASE_NOTES.md
          echo 'V280_GITHUB_RELEASE_CREATE=PASS'

      - name: Remote readback exact assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/readback" evidence
          gh release download v2.8.0 --repo llhzx2018/vf-infra --dir "$RUNNER_TEMP/readback" --pattern 'VF_Infra_V2.8.0_*.zip'
          gh api repos/llhzx2018/vf-infra/releases/tags/v2.8.0 > evidence/release.json
          gh api repos/llhzx2018/vf-infra/git/ref/tags/v2.8.0 > evidence/tag.json
          python3 - "$RUNNER_TEMP/readback" evidence/release.json evidence/tag.json <<'PY'
          import hashlib,json,pathlib,sys,os
          root=pathlib.Path(sys.argv[1]); release=json.load(open(sys.argv[2])); tag=json.load(open(sys.argv[3]))
          assert release['tag_name']=='v2.8.0' and release['name']=='VF Infra V2.8.0',release
          assert tag['object']['sha']==os.environ['SOURCE_SHA'],tag
          expected={
            'VF_Infra_V2.8.0_FULL.zip':(int(os.environ['EXPECTED_FULL_BYTES']),os.environ['EXPECTED_FULL_SHA']),
            'VF_Infra_V2.8.0_UPDATE.zip':(int(os.environ['EXPECTED_UPDATE_BYTES']),os.environ['EXPECTED_UPDATE_SHA']),
          }
          assets={a['name']:a for a in release['assets']}
          for name,(size,sha) in expected.items():
              assert name in assets,name
              p=root/name; got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert assets[name]['size']==size,(name,assets[name]['size'],size)
              assert p.stat().st_size==size,(name,p.stat().st_size,size)
              assert got==sha,(name,got,sha)
          report={
            'status':'PASS','version':'2.8.0','source_sha':os.environ['SOURCE_SHA'],'release_id':release['id'],
            'tag_target':tag['object']['sha'],'assets':{n:{'asset_id':assets[n]['id'],'bytes':s,'sha256':h} for n,(s,h) in expected.items()},
            'production_write':0
          }
          pathlib.Path('evidence/V280_FORMAL_RELEASE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,sort_keys=True))
          print('P04_V280_FORMAL_RELEASE_REMOTE_READBACK_PASS')
          PY

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.0-FORMAL-RELEASE-EVIDENCE
          path: evidence/
          if-no-files-found: error
          retention-days: 30
