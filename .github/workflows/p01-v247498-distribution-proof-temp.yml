name: p01-v247498-distribution-exact-proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247498-distribution-proof-temp.yml']
permissions:
  contents: read
jobs:
  exact-manifest-and-asset:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHANNEL_REPO: llhzx2018/core-updates
      CHANNEL_BRANCH: dist/p01-v247498-tmdb-menu-20261106
      CHANNEL_SHA: f233fbe777cfee211e61d087b262a69b5ffb7fc0
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_SHA: 738b245dfaeeabaaf3d4dc3cfbe6985500634710
      RELEASE_TAG: v2.47.498
      RELEASE_ID: '436306942'
      UPDATE_NAME: VF_Start_V2.47.498_UPDATE.zip
      UPDATE_BYTES: '3777065'
      UPDATE_SHA256: 6e512018bb31dbf989e5cbbf13581c75f3d67ee342cb7102b0a5a0754709cbf3
    steps:
      - name: Checkout trusted public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact channel manifest and live official asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN" && test -n "$GH_TOKEN"
          WORK="$(mktemp -d /tmp/p01-channel498-XXXXXXXX)"
          trap 'case "$WORK" in /tmp/p01-channel498-*) rm -rf -- "$WORK";; esac' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq unzip >/dev/null
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$CHANNEL_REPO.git" "refs/heads/$CHANNEL_BRANCH" | awk '{print $1}')"
          test "$remote" = "$CHANNEL_SHA"
          git clone -q --depth 1 --branch "$CHANNEL_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$CHANNEL_REPO.git" "$WORK/channel"
          test "$(git -C "$WORK/channel" rev-parse HEAD)" = "$CHANNEL_SHA"
          git -C "$WORK/channel" remote set-url origin "https://github.com/$CHANNEL_REPO.git"
          unset READ_TOKEN
          cd "$WORK/channel"
          echo "P01_DISTRIBUTION_EXACT_SOURCE_SHA=$CHANNEL_SHA"
          jq -e '.schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and .current_version=="2.47.497" and .target_version=="2.47.498" and .update_type=="ATOMIC" and .from_versions==["2.47.497"] and .schema_from=="2026102201" and .schema_to=="2026102201" and .release_tag=="v2.47.498" and .release_id==436306942 and .product_identity=="738b245dfaeeabaaf3d4dc3cfbe6985500634710" and .asset_name=="VF_Start_V2.47.498_UPDATE.zip" and .asset_bytes==3777065 and .asset_sha256=="6e512018bb31dbf989e5cbbf13581c75f3d67ee342cb7102b0a5a0754709cbf3" and .backup_required==true and .rollback_supported==true' projects/P01.json >/dev/null
          echo P01_DISTRIBUTION_P01_ATOMIC_CONTRACT=PASS
          python3 scripts/check_manifest_contract.py > "$WORK/manifest-audit.json"
          jq -e '.status=="PASS"' "$WORK/manifest-audit.json" >/dev/null
          echo P01_DISTRIBUTION_ALL_MANIFEST_SCHEMA=PASS
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php > "$WORK/php-tests.txt" 2>&1 || {
            tail -60 "$WORK/php-tests.txt"; exit 1;
          }
          tail -25 "$WORK/php-tests.txt" | sed -E 's/[[:cntrl:]]//g'
          echo P01_DISTRIBUTION_UPDATE_CORE_NATIVE_PHP=PASS
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$PRODUCT_SHA"
          gh api "repos/$PRODUCT_REPO/releases/tags/$RELEASE_TAG" > "$WORK/release.json"
          jq -e --argjson id "$RELEASE_ID" --arg sha "$UPDATE_SHA256" --arg name "$UPDATE_NAME" --argjson size "$UPDATE_BYTES" '.id==$id and .draft==false and .prerelease==false and (.assets|any(.name==$name and .size==$size and .digest==("sha256:"+$sha)))' "$WORK/release.json" >/dev/null
          mkdir "$WORK/assets"
          gh release download "$RELEASE_TAG" -R "$PRODUCT_REPO" -p "$UPDATE_NAME" -D "$WORK/assets"
          test "$(stat -c %s "$WORK/assets/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$WORK/assets/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          unzip -t "$WORK/assets/$UPDATE_NAME" >/dev/null
          echo P01_DISTRIBUTION_REMOTE_ASSET_BYTES_SHA256=PASS
          echo P01_DISTRIBUTION_EXACT_CANDIDATE=PASS
      - name: Public/private and Production boundary
        if: always()
        shell: bash
        run: |
          echo P01_DISTRIBUTION_PRODUCT_REPO_WRITES=NONE
          echo P01_DISTRIBUTION_PRODUCTION_CHANGED=NO
          echo P01_DISTRIBUTION_PUBLIC_PRIVATE_SOURCE_ARTIFACT=NONE
          echo P01_DISTRIBUTION_CLOSE_RUNNER_PR_UNMERGED=YES
