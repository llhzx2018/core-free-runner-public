          Formal assets:

          - `VF-Start-V2.46.3-FULL.zip` — 767250 bytes — `74e409fbbeee3750f8e683e7f737f34587a1afaf94393b2e8bfce3acdac69573`
          - `VF_Start_V2.46.3_UPDATE.zip` — 1609058 bytes — `b17da14ff7b0a0b598d55b0fc968a3cf1137e2e62fa73a3e99d109965c86a5ff`
