          }
          a = d.setdefault('authority', {})
          a['current_production_evidence'] = evidence
          a['current_formal_release_evidence'] = evidence
          a['current_v2463_production_evidence'] = evidence
          d['candidate_version'] = '2.46.3'
          d['candidate_schema_version'] = '2026090401'
          d['candidate_state'] = 'PUBLISHED / OWNER PRODUCTION ACTIVATED'
