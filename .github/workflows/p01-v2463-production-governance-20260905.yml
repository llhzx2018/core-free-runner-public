            'published_at':'2026-09-05T04:00:31Z','formal_bind_gate':33927388236,'formal_bind_pr':373,
            'formal_artifact_gate':33927571940,'publication_gate':33943377740,
            'online_readiness_gate':33943530905,'post_merge_online_readback_gate':33943638830,
