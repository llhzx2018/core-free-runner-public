          ## Next action

          Complete the minimal Owner-session page smoke. If it passes, update this evidence to `PRODUCTION CLOSURE PASS`, update `VF_PROJECT.json` phase/next action, and return P01 to normal L2 Product Optimization.
          EOF
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only | sort)" = $'VF_PROJECT.json\ndocs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md'
