          cat > docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md <<'EOF'
          # P01 · VF Start V2.46.3 Owner Production Activation

          Date: 2026-09-05

          State: **OWNER PRODUCTION ACTIVATION PASS / FINAL OWNER PAGE SMOKE PENDING**

          ## Owner Production evidence

          Owner supplied the post-upgrade VF Start Online Update screen. The screen proves:

