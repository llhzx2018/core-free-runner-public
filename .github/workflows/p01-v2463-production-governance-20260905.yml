name: P01 V2.46.3 Production Governance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-v2463-production-governance-20260905.yml

permissions:
  contents: read

jobs:
  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_BRANCH: docs/p01-v2463-production-closure-20260905
      FORMAL_SOURCE: 494b7a9a497fed050885f27ccad3a280ba53b0ce
      RELEASE_ID: '383126819'
      RELEASE_TAG: v2.46.3
      CORE_UPDATES_MAIN: ccecf180742724abed7e85d1561c905cee7b0e85
      SCREENSHOT_SHA: c02170c12f00f72d8ebc4461b95afb39c8551043d5ddd5a23015d52f4288c8e5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Rebaseline production governance
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fq "define('VF_VERSION', '2.46.3');" src/app/bootstrap.php
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('VF_PROJECT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          evidence = 'docs/evidence/P01_V2.46.3_OWNER_PRODUCTION_ACTIVATION_20260905.md'
          d['status'] = 'V2.46.3 PRODUCTION / PUBLISHED'
          d['production_version'] = '2.46.3'
          d['working_version'] = '2.46.3'
          d['target_release_version'] = '2.46.3'
          d['schema_version'] = '2026090401'
          d['working_schema_version'] = '2026090401'
          d['current_working_branch'] = 'main'
          d['current_phase'] = 'ROUND 10 PRODUCTION ACTIVATION PASS / FINAL OWNER PAGE SMOKE PENDING'
