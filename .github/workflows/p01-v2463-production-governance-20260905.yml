            'observed_date':'2026-09-05',
            'current_version':'V2.46.3',
            'latest_version':'V2.46.3',
            'footer_version':'V2.46.3',
            'state':'已是最新版本。',
            'history':'2.46.1 -> 2.46.3 / success',
