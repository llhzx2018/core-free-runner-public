name: P04 Detail Technical Language Exact-Source Gate

on:
  push:
    branches:
      - candidate/p04-detail-technical-language-gate-20260830

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: eb3ecaa0343129bb389e290dd5ab2bbd3915c023
      BASE_DEVELOP: 8c9a2fdb9c159b0b4550a2b2ad89f122204bf827
      TARGET_BRANCH: fix/p04-detail-technical-language-cleanup-20260830
      EVIDENCE: ${{ github.workspace }}/evidence-detail-language

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || { echo 'RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }

      - name: Checkout exact P04 detail-language candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Exact source fence and static contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C product rev-parse origin/$TARGET_BRANCH)" = "$CANDIDATE"
          test "$(git -C product merge-base "$BASE_DEVELOP" "$CANDIDATE")" = "$BASE_DEVELOP"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.8.11'
          mapfile -t changed < <(git -C product diff --name-only "$BASE_DEVELOP" "$CANDIDATE")
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fxq 'public/assets/daily-server-ux-polish.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'public/assets/daily-provider-ux-polish.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'tests/unit/ui_detail_technical_language_contract.php'
          git -C product diff --quiet "$BASE_DEVELOP" "$CANDIDATE" -- database config src VERSION VF_PROJECT.json public/index.php public/assets/v270-reference-lock.js public/assets/v271-unified-shell.js
          cd product
          python3 scripts/repository-health-gate.py
          python3 scripts/check-migrations.py
          find src public tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          node --check public/assets/v270-reference-lock.js
          node --check public/assets/v271-unified-shell.js
          node --check public/assets/v280-navigation-simplify.js
          node --check public/assets/v2811-human-baseline.js
          node --check public/assets/daily-ux-polish.js
          node --check public/assets/daily-server-ux-polish.js
          node --check public/assets/daily-provider-ux-polish.js
          php tests/unit/ui_detail_technical_language_contract.php .
          php tests/unit/ui_domain_detail_human_language_contract.php .
          php tests/unit/ui_global_search_current_contract.php .
          php tests/unit/ui_contract_v280.php .
          php tests/unit/ui_daily_ux_polish_contract.php .
          php tests/unit/ui_daily_server_ux_polish_contract.php .
          php tests/unit/ui_daily_provider_ux_polish_contract.php .
          php tests/unit/maintenance_ui_contract_v288.php .
          php tests/unit/domain_attention_group_management_ui_v289.php .
          echo P04_DETAIL_TECHNICAL_LANGUAGE_STATIC_GATE=PASS

      - name: Install browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Fresh-install detail technical-language browser gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          WEB="$RUNNER_TEMP/p04-detail-language-runtime"
          python3 product/scripts/build-release-tree.py "$WEB" >"$EVIDENCE/build.json"
          test -f "$WEB/assets/daily-server-ux-polish.js"
          test -f "$WEB/assets/daily-provider-ux-polish.js"
          PORT=19055
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$EVIDENCE/php-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .1; done
          EVIDENCE="$EVIDENCE" CANDIDATE="$CANDIDATE" WEB_ROOT="$WEB" PRODUCT_ROOT="$GITHUB_WORKSPACE/product" VF_E2E_BASE_URL="http://127.0.0.1:$PORT" node scripts/p04-detail-technical-language-gate-20260830.mjs
          grep -Fq '"status": "PASS"' "$EVIDENCE/P04_DETAIL_TECHNICAL_LANGUAGE_REPORT.json"
          if grep -Ev 'JIT is incompatible with third party extensions that override zend_execute_ex\(\)\. JIT disabled\.' "$EVIDENCE/php-server.log" | grep -Eqi 'PHP (Fatal error|Parse error|Warning):|Uncaught (Error|Exception)'; then cat "$EVIDENCE/php-server.log"; exit 1; fi
          echo P04_DETAIL_TECHNICAL_LANGUAGE_BROWSER_GATE=PASS

      - name: Seal public-safe evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['EVIDENCE']); report=root/'P04_DETAIL_TECHNICAL_LANGUAGE_REPORT.json'
          payload={
            'schema':'p04-detail-technical-language-public-evidence/v1',
            'source_sha':os.environ['CANDIDATE'],
            'base_develop_sha':os.environ['BASE_DEVELOP'],
            'private_source_persisted':False,
            'production_actions_executed':False,
            'synthetic_test_data_only':True,
          }
          if report.exists():
              detail=json.loads(report.read_text(encoding='utf-8'))
              payload.update({'status':detail.get('status'),'server':detail.get('server'),'provider':detail.get('provider'),'mobile':detail.get('mobile'),'page_error_count':len(detail.get('page_errors',[])),'console_error_count':len(detail.get('console_errors',[]))})
          else: payload['status']='BLOCKED_BEFORE_BROWSER_REPORT'
          raw=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode(); payload['sha256']=hashlib.sha256(raw).hexdigest()
          (root/'PUBLIC_EVIDENCE.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P04-DETAIL-TECHNICAL-LANGUAGE-${{ env.CANDIDATE }}
          path: |
            evidence-detail-language/PUBLIC_EVIDENCE.json
            evidence-detail-language/P04_DETAIL_TECHNICAL_LANGUAGE_REPORT.json
            evidence-detail-language/01-server-detail-desktop.png
            evidence-detail-language/02-provider-detail-desktop.png
            evidence-detail-language/03-server-detail-mobile-390.png
            evidence-detail-language/04-provider-detail-mobile-390.png
          if-no-files-found: warn
          retention-days: 14
