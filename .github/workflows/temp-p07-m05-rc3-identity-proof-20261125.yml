name: TEMP P07-M05 exact official RC3 directory recognition
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m05-rc3-identity-proof-20261125.yml'
permissions:
  contents: read
jobs:
  official-rc3:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-rc3-identity-proof-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact P07 M05 published source privately in ephemeral runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '2bf8fb645fee1d813520329dcd7748bee2225376'
          path: transient-private-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Reconstruct published P07-M03 RC3 in an isolated temporary directory
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RC3_URL: 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip'
          RC3_SHA: '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d'
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$(git -C transient-private-p07 rev-parse HEAD)" == '2bf8fb645fee1d813520329dcd7748bee2225376' ]]
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 95 "$RC3_URL" -o "$RUNNER_TEMP/p07-rc3-official.zip"
          echo "$RC3_SHA  $RUNNER_TEMP/p07-rc3-official.zip" | sha256sum -c - >/dev/null
          echo P07_M03_RC3_OFFICIAL_ZIP_DIGEST=PASS
          python3 -B - <<'PY'
          import pathlib,sys,os,zipfile,tempfile,shutil,json
          sys.path.insert(0,str(pathlib.Path('transient-private-p07/lib').absolute()))
          from m05_owner_trial_guard import verified_p07_trial_runtime,TRIAL_ENTRY,REQUIRED_DIRS,REQUIRED_FILES
          from m05_toolbox_backup_guard import _verify_runtime_manifest
          z=zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/p07-rc3-official.zip')
          names=set(z.namelist())
          source='dist/p07/0.1.0/overlay/'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'vf-server-ops-ownertrial147rc3'
          root.mkdir(mode=0o700)
          for name in REQUIRED_DIRS:
              (root/name).mkdir(mode=0o700)
          for name in sorted(names):
              if not name.startswith(source):
                  continue
              rel=name[len(source):]
              if rel=='RUNTIME.gitblob':
                  rel='.runtime-manifest.gitblob'
              if rel.startswith('../') or not rel:
                  raise ValueError('archive member')
              dest=root/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(z.read(name))
          (root/'VERSION').write_text('0.1.0\n',encoding='ascii')
          print('P07_M05_OFFICIAL_RC3_BUILD_ID_MATCH='+str((root/'BUILD_ID').read_text().strip()=='0.1.0-release147-rc3'))
          print('P07_M05_OFFICIAL_RC3_ROOT_SHAPE_MATCH='+str({p.name for p in root.iterdir()}==REQUIRED_DIRS|REQUIRED_FILES))
          print('P07_M05_OFFICIAL_RC3_RUNTIME_MANIFEST='+str(_verify_runtime_manifest(root,root.stat().st_uid)))
          print('P07_M05_OFFICIAL_RC3_IDENTITY='+('PASS' if verified_p07_trial_runtime(root) else 'FAIL'))
          if not verified_p07_trial_runtime(root):
              raise SystemExit(13)
          (root/'lib'/'untrusted-business.py').write_text('untrusted')
          assert not verified_p07_trial_runtime(root)
          print('P07_M05_RC3_EXTRA_BUSINESS_FILE_REJECT=PASS')
          PY
      - name: Remove all transient private checkout and RC3 archive
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-private-p07" "$RUNNER_TEMP/vf-server-ops-ownertrial147rc3"
          rm -f -- "$RUNNER_TEMP/p07-rc3-official.zip"
          test ! -e "$GITHUB_WORKSPACE/transient-private-p07"
          echo P07_M05_TRANSIENT_SOURCE_CLEANUP=PASS
