name: P02 V2.5.39 Hotfix Candidate Gate

on:
  push:
    branches:
      - run/p02-v2539-hotfix-20260919
    paths:
      - '.github/workflows/p02-v2539-hotfix-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact P02 hotfix candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4ce46b088ef03a3a181ff3c9bcab6bc949cc9eb5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install PHP and browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact source and repository contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "4ce46b088ef03a3a181ff3c9bcab6bc949cc9eb5"
          test "$(tr -d '\r\n' < VERSION)" = "2.5.39"
          bash scripts/verify-repository.sh
          node tests/unit/p02_inkstone_shell_parity.mjs
          node tests/unit/p02_candidate_version_identity_contract.mjs
          echo P02_V2539_SOURCE_GATE=PASS

      - name: Real Chromium UX regression
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          bash scripts/ux-browser-reverify.sh
          echo P02_V2539_BROWSER_GATE=PASS
          echo P02_V2539_CANDIDATE_GATE=PASS
