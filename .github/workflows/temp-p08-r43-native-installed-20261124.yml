name: TEMP P08 R43 native real installed FULL schema and SIGKILL 3DB closure
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-r43-native-installed-20261124.yml
permissions:
  contents: read
concurrency:
  group: p08-r43-native-installed-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-installed-schema-transaction:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-installed-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 71d94d722b175547d611cfd640637af681a19c29
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8d645d498fec5271434f4756c8b483d455575ed4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native SQL backup client on disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if command -v mysqldump >/dev/null && command -v mysql >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MYSQL_CLIENT=PASS
          elif command -v mariadb-dump >/dev/null && command -v mariadb >/dev/null; then
            echo P08_R43_NATIVE_PREINSTALLED_MARIADB_CLIENT=PASS
          else
            timeout 75s sudo apt-get -o Acquire::Retries=0 update -qq > "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_APT_NETWORK=BLOCKED; exit 1; }
            timeout 85s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-r43-apt.log" 2>&1 || { echo P08_R43_NATIVE_CLIENT_INSTALL=FAIL; exit 1; }
          fi
          (command -v mariadb-dump || command -v mysqldump) >/dev/null || { echo P08_R43_NATIVE_DUMP_CLIENT_MISSING; exit 1; }
          (command -v mariadb || command -v mysql) >/dev/null || { echo P08_R43_NATIVE_RESTORE_CLIENT_MISSING; exit 1; }
          echo P08_R43_NATIVE_BACKUP_CLIENT_PRESENT=PASS
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = '71d94d722b175547d611cfd640637af681a19c29'
          test "$(git -C private-p08-target rev-parse HEAD)" = '8d645d498fec5271434f4756c8b483d455575ed4'
          test "$(cat private-p08-bridge/VERSION)" = '0.1.17'
          test "$(cat private-p08-target/VERSION)" = '0.1.18'
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version 0.1.17 --source-sha '71d94d722b175547d611cfd640637af681a19c29' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; grep -E 'FULL_BLOCKED|CONTRACT_REASON=' "$RUNNER_TEMP/p08-r43-bridge-builder.log" | head -n 7 || true; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version 0.1.18 --source-sha '8d645d498fec5271434f4756c8b483d455575ed4' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; grep -E 'FULL_BLOCKED|CONTRACT_REASON=' "$RUNNER_TEMP/p08-r43-target-builder.log" | head -n 7 || true; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Set up separate empty synthetic native databases and 3 independent real Owner FULL installations
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -r '$c=new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("P08_R43_NATIVE_DB_PASSWORD"), [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); foreach(["native","restored"] as $prefix) foreach(["success","fault","kill"] as $mode) {$n="p08_ci_r43_".$prefix."_".$mode; $c->exec("CREATE DATABASE ".$n." CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");}' > "$RUNNER_TEMP/p08-r43-db-create.log" 2>&1 || { echo P08_R43_NATIVE_FIXTURE_DB_CREATE=FAIL; exit 1; }
          for mode in success fault kill; do
            site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
            php private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-setup-$mode.log" 2>&1 || { echo P08_R43_NATIVE_OWNER_INSTALL=FAIL_$mode; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-setup-$mode.log" | tail -n 10 || true; exit 1; }
            grep -q '^P08_R43_NATIVE_REAL_FULL_017_OWNER_FIRST_INSTALL=PASS' "$RUNNER_TEMP/p08-r43-native-setup-$mode.log"
          done
          echo P08_R43_NATIVE_THREE_REAL_FULL_OWNER_INSTALLS=PASS engine=${{ matrix.engine }}
      - name: Actual installed native Owner schema + source-pointer upgrade success and independent scratch restore
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-success"
          t="private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php"
          php "$t" success "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-success.log" 2>&1 || { echo P08_R43_NATIVE_INSTALLED_SUCCESS=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-success.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_REAL_INSTALLED_SOURCE_AND_SCHEMA_COMMIT=PASS' "$RUNNER_TEMP/p08-r43-native-success.log" || { echo P08_R43_NATIVE_INSTALLED_SUCCESS_SENTINEL_MISSING; exit 1; }
          php "$t" verify-success "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-readback.log" 2>&1 || { echo P08_R43_NATIVE_SUCCESS_READBACK=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-readback.log" | tail -n 10 || true; exit 1; }
          php "$t" restore-scratch "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-restore-success.log" 2>&1 || { echo P08_R43_NATIVE_SUCCESS_INDEPENDENT_RESTORE=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-restore-success.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_INDEPENDENT_DB_AND_MEDIA_RESTORE=PASS' "$RUNNER_TEMP/p08-r43-native-restore-success.log"
          echo P08_R43_NATIVE_INSTALLED_SCHEMA_POINTER_AND_RESTORE=PASS engine=${{ matrix.engine }}
      - name: Real native failure after third migration returns old Owner and permits independent restore
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-fault"
          t="private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php"
          php "$t" fault "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-fault.log" 2>&1 || { echo P08_R43_NATIVE_FAULT=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-fault.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_FAULT_3_ROLLBACK_TO_OLD_SITE=PASS' "$RUNNER_TEMP/p08-r43-native-fault.log"
          php "$t" verify-rollback "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-fault-readback.log" 2>&1 || { echo P08_R43_NATIVE_FAULT_READBACK=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-fault-readback.log" | tail -n 10 || true; exit 1; }
          php "$t" restore-scratch "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-restore-fault.log" 2>&1 || { echo P08_R43_NATIVE_FAULT_RESTORE=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-restore-fault.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_INDEPENDENT_DB_AND_MEDIA_RESTORE=PASS' "$RUNNER_TEMP/p08-r43-native-restore-fault.log"
          echo P08_R43_NATIVE_FAULT_ROLLBACK_AND_RESTORE=PASS engine=${{ matrix.engine }}
      - name: Genuine SIGKILL 137 after code-pointer switch then independent new-process SQL and media recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-${{ matrix.engine }}-kill"
          t="private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php"
          set +e
          php "$t" kill "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-kill.log" 2>&1
          killed=$?
          set -e
          test "$killed" -eq 137 || { echo "P08_R43_NATIVE_SIGKILL_EXIT_INVALID=$killed"; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-kill.log" | tail -n 10 || true; exit 1; }
          test "$(readlink "$site/current")" = 'releases/8d645d498fec5271434f4756c8b483d455575ed4'
          test -f "$site/storage/app/private/adops/maintenance/maintenance.json"
          php "$t" recover "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-recover.log" 2>&1 || { echo P08_R43_NATIVE_KILL_RECOVERY=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-recover.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_REAL_SIGKILL_NEW_PROCESS_RECOVERED=PASS' "$RUNNER_TEMP/p08-r43-native-recover.log"
          php "$t" verify-rollback "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-kill-readback.log" 2>&1 || { echo P08_R43_NATIVE_KILL_READBACK=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-kill-readback.log" | tail -n 10 || true; exit 1; }
          php "$t" restore-scratch "$site" "$RUNNER_TEMP/p08-r43-target-extract" '71d94d722b175547d611cfd640637af681a19c29' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-native-restore-kill.log" 2>&1 || { echo P08_R43_NATIVE_KILL_RESTORE=FAIL; grep -E 'R43_|Fatal error|Error:' "$RUNNER_TEMP/p08-r43-native-restore-kill.log" | tail -n 10 || true; exit 1; }
          grep -q '^P08_R43_NATIVE_INDEPENDENT_DB_AND_MEDIA_RESTORE=PASS' "$RUNNER_TEMP/p08-r43-native-restore-kill.log"
          echo P08_R43_NATIVE_REAL_SIGKILL_INDEPENDENT_RESTORE=PASS engine=${{ matrix.engine }}
      - name: Remove confidential source, synthetic installation and backup/restore data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP"/p08-r43-site-* "$RUNNER_TEMP"/p08-r43-native-restored-*
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log
          test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_CONFIDENTIAL_CLEANUP=PASS
