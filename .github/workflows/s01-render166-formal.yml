name: S01 Theme render166 exact formal release
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-render166-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.166
  TARGET_SHA: aab3b56765a9bdf5a8771a04adb134ff63933db4
  TARGET_TREE: 13c82d65cb2ca9df72e0ec19509792c2cbe93f1a
  TEST_CANDIDATE_SHA: fae79f8d0cabdbe6bb3f517907e683a67042b9e1
  EXPECTED_PACKAGE_SHA256: 7137becd6745016296979977daced6cb0b457c06f1eaf3c4b135da7cebbd1d5a
  EXPECTED_PACKAGE_BYTES: 1970217
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: aab3b56765a9bdf5a8771a04adb134ff63933db4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact tested tree and machine gate receipts
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target rev-parse $TEST_CANDIDATE_SHA^{tree})" = "$TARGET_TREE"
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39715681598 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39714405736 --jq .conclusion)" = success
          python3 control/lanes/s01-render166/package.py
          echo "$EXPECTED_PACKAGE_SHA256  provider/vf-tools-theme_V1.35.166.zip" | sha256sum -c
          test "$(stat -c %s provider/vf-tools-theme_V1.35.166.zip)" = "$EXPECTED_PACKAGE_BYTES"
          echo MERGED_TREE_AND_TESTED_PACKAGE_EQUAL_PASS
      - name: Formal GitHub Release exact verified bytes only
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.166 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.166 provider/vf-tools-theme_V1.35.166.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.166' --notes '工具页渲染：已保存配置检查改为只读，不再误触保存；首装默认配置可明确保存，失败提示分清检查与保存，视觉预览入口命名准确。源树与候选相同；公共独立 PHP/Chromium 定向检查和原生 WordPress 安装、165→166 升级、回退、重复安装与数据保护通过。M3U8 保持1.25.94，Production 由 Owner 手工升级，手机测试暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.166 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.166 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Remote authenticated release ZIP bytes exactly match tested ZIP
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.166 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.166.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.166.zip remote/vf-tools-theme_V1.35.166.zip
          echo "$EXPECTED_PACKAGE_SHA256  remote/vf-tools-theme_V1.35.166.zip" | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.166.zip)" = "$EXPECTED_PACKAGE_BYTES"
          gh release view v1.35.166 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_166_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-render166-formal
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider remote
