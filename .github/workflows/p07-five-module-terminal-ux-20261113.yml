name: P07 五模块 Terminal UX V3 · 精确源码机器验收
on:
  push:
    branches: [test/p07-five-module-terminal-ux-20261113]
    paths:
      - .github/workflows/p07-five-module-terminal-ux-20261113.yml
permissions:
  contents: read
jobs:
  check-five-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout m01 exact scoped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: c507dd91cb4c48f445a10fbad4b744dd3b7ef64c
          persist-credentials: false
          path: test-m01
      - name: Checkout m02 exact scoped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 5a967fddedc12a8ae302a1a109aa80f0aa82259c
          persist-credentials: false
          path: test-m02
      - name: Checkout m03 exact scoped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 07551fa097345e9d4078bed74a9a3bad1410ec03
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: test-m03
      - name: Checkout m04 exact scoped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0a26339ae4d0651ace9ce60e985de3128830bf37
          persist-credentials: false
          path: test-m04
      - name: Checkout m05 exact scoped source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8fbb881c12d685ed1aae1360206585e3c835fbca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: test-m05
      - name: Verify five exact SHAs and direct module UX flows
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test "$(git -C test-m01 rev-parse HEAD)" = c507dd91cb4c48f445a10fbad4b744dd3b7ef64c
          test "$(git -C test-m02 rev-parse HEAD)" = 5a967fddedc12a8ae302a1a109aa80f0aa82259c
          test "$(git -C test-m03 rev-parse HEAD)" = 07551fa097345e9d4078bed74a9a3bad1410ec03
          test "$(git -C test-m04 rev-parse HEAD)" = 0a26339ae4d0651ace9ce60e985de3128830bf37
          test "$(git -C test-m05 rev-parse HEAD)" = 8fbb881c12d685ed1aae1360206585e3c835fbca
          bash -n test-m01/packages/p07-network-node/0.1.0-ux1/vf-node.sh
          bash -n test-m02/experiments/p07-vps-audit-v21-ux1.sh
          bash -n test-m03/bin/vfops-migrate-ui
          bash -n test-m04/packages/p07-system-care/0.1.0-ux2/vf-system-care.sh
          bash -n test-m05/bin/vfops-init-ui
          (cd test-m01 && python3 -B -m unittest discover -s tests -p 'test_p07_m01_terminal_ux_v3.py' -q)
          echo P07_M01_NETWORK_NODE_UX=PASS
          (cd test-m02 && python3 -B -m unittest discover -s tests -p 'test_p07_m02_terminal_ux_v3.py' -q)
          echo P07_M02_VPS_AUDIT_UX=PASS
          (cd test-m03 && python3 -B -m unittest discover -s tests -p 'test_p07_m03_terminal_ux_v3.py' -q)
          (cd test-m03 && python3 -B scripts/check_p07_terminal_ux.py --module P07-M03-D04 --changed-file bin/vfops-migrate-ui --evidence-file docs/ux-reviews/p07-m03-d04-migration-v3.json)
          (cd test-m03 && python3 -B -m unittest discover -s tests -p 'test_p07_m03_parent_terminal_ux_v3.py' -q)
          (cd test-m03 && python3 -B scripts/check_p07_terminal_ux.py --module P07-M03 --changed-file bin/vfops-user --evidence-file docs/ux-reviews/p07-m03-parent-menu-v3.json)
          echo P07_M03_SITE_DATA_UX=PASS
          (cd test-m04 && python3 -B -m unittest discover -s tests -p 'test_p07_m04_terminal_ux_v3_rc83.py' -q)
          (cd test-m04 && python3 -B scripts/check_p07_public_terminal_ux.py)
          echo P07_M04_CURRENT_OFFICIAL_BASELINE=0.1.0-rc83
          echo P07_M04_SYSTEM_CARE_UX=PASS
          (cd test-m05 && python3 -B -m unittest discover -s tests -p 'test_p07_m05_host_write_gate.py' -q)
          (cd test-m05 && python3 -B scripts/check_p07_terminal_ux.py --module P07-M05 --changed-file bin/vfops-init-ui --evidence-file docs/ux-reviews/p07-m05-server-initialization-v3.json)
          echo P07_M05_NEW_SERVER_INIT_UX=PASS
          echo P07_FIVE_MODULE_UX_EXACT_SOURCE=PASS
          echo P07_OWNER_PRODUCTION=NOT_RUN
      - name: Always securely clean temporary private source
        if: always()
        shell: bash
        run: |
          rm -rf -- test-m01 test-m02 test-m03 test-m04 test-m05
          echo P07_PRIVATE_SOURCE_PERSISTED=NO
