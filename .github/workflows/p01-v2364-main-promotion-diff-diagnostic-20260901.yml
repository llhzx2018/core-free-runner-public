name: P01 V2.36.4 Main Promotion Diff Diagnostic
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-main-promotion-diff-diagnostic-20260901.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN: d35038c32b5a287636ee92d9fe074ea12c1469ef
      DEVELOP: 48da73b3d69279de507d21c9f095094f5b8948da
      DEVELOP_TREE: 0c790c1580078813c47e5c0f56f1ced9bd3d66cc
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact endpoint tree diff and composite authority diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$DEVELOP"
          test "$(git rev-parse HEAD^{tree})" = "$DEVELOP_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.4 >/dev/null 2>&1; then echo UNEXPECTED_V2364_TAG; exit 20; fi
          git fetch origin "$MAIN" "$FORMAL" --quiet
          git diff --name-status "$MAIN" "$DEVELOP" | tee /tmp/p01-v2364-main-develop-endpoint-diff.txt
          echo '--- CLOSURE DOC BLOB IDENTITY ---' | tee -a /tmp/p01-v2364-main-develop-endpoint-diff.txt
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            A=$(git rev-parse "$MAIN:$f"); B=$(git rev-parse "$DEVELOP:$f"); printf '%s MAIN=%s DEVELOP=%s\n' "$f" "$A" "$B" | tee -a /tmp/p01-v2364-main-develop-endpoint-diff.txt; test "$A" = "$B";
          done
          git show "$MAIN:VF_PROJECT.json" > /tmp/main-vf.json
          git show "$FORMAL:VF_PROJECT.json" > /tmp/formal-vf.json
          git show "$DEVELOP:VF_PROJECT.json" > /tmp/develop-vf.json
          python3 - <<'PY' | tee -a /tmp/p01-v2364-main-develop-endpoint-diff.txt
          import json
          M=json.load(open('/tmp/main-vf.json'))
          F=json.load(open('/tmp/formal-vf.json'))
          D=json.load(open('/tmp/develop-vf.json'))
          for k in ('current_production_evidence','current_formal_release_evidence','current_l2_develop_evidence'):
              F['authority'][k]=M['authority'][k]
          F['owner_production_closure_evidence']=M['owner_production_closure_evidence']
          F['v2_36_3_release_chain']=M['v2_36_3_release_chain']
          assert D == F
          assert D['production_version']=='2.36.3'
          assert D['working_version']=='2.36.4'
          assert D['v2_36_4_candidate_gate']['state']=='PASS'
          assert D['owner_production_closure_evidence']['version']=='2.36.3'
          assert D['v2_36_3_release_chain']['result']=='PASS'
          print('VF_PROJECT_COMPOSITE=PASS')
          PY
          for f in CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php; do test "$(git rev-parse "$DEVELOP:$f")" = "$(git rev-parse "$FORMAL:$f")"; done
          test "$(git rev-parse "$DEVELOP:src")" = "$(git rev-parse "$FORMAL:src")"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP"
          printf 'DIRECT_ENDPOINT_DIFF=PASS\nDEVELOP_TREE=%s\nRUNTIME_TREE=%s\nFORMAL_RUNTIME_IDENTITY=PASS\nCLOSURE_DOCS_MAIN_DEVELOP_IDENTITY=PASS\nREMOTE_WRITE=NO\n' "$DEVELOP_TREE" "$RUNTIME_TREE" | tee -a /tmp/p01-v2364-main-develop-endpoint-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-main-promotion-diff-diagnostic-${{ github.run_id }}
          path: /tmp/p01-v2364-main-develop-endpoint-diff.txt
          if-no-files-found: error
          retention-days: 90
