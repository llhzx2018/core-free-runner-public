name: p01-v24739-formal-publish-temp

on:
  push:
    branches:
      - release/p01-v24739-publish

permissions:
  actions: read
  contents: read

concurrency:
  group: p01-v24739-formal-publish
  cancel-in-progress: false

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      RUNNER_REPO: llhzx2018/core-free-runner-public
      FORMAL_SHA: 761fb624c62e9ec16fe33e5f2f1e9f2c27738963
      SOURCE_TAG: v2.47.38
      SOURCE_SHA: 3394e056ce9c0f6ba3667a67a8bc5ae1c4c513b0
      SOURCE_VERSION: 2.47.38
      TARGET_VERSION: 2.47.39
      TARGET_TAG: v2.47.39
      PREVIEW_TAG: v2.47.39-preview.1
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35575932207'
      PREVIEW_ARTIFACT_RUN: '35576238284'
      BACKEND_GATE_RUN: '35575018642'
      BIND_PR: '898'
      OWNER_COMMENT_ID: '5757517728'
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact formal authority and owner acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/git/ref/tags/$SOURCE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/git/ref/tags/$PREVIEW_TAG" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/releases/tags/$PREVIEW_TAG" --jq '.prerelease')" = true
          if GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/git/ref/tags/$TARGET_TAG" >/dev/null 2>&1; then
            echo BLOCK=FORMAL_TAG_ALREADY_EXISTS
            exit 81
          fi
          test "$(GH_TOKEN="${{ github.token }}" gh api "repos/$RUNNER_REPO/actions/runs/$CANDIDATE_RUN" --jq '.conclusion')" = success
          test "$(GH_TOKEN="${{ github.token }}" gh api "repos/$RUNNER_REPO/actions/runs/$PREVIEW_ARTIFACT_RUN" --jq '.conclusion')" = success
          test "$(GH_TOKEN="${{ github.token }}" gh api "repos/$RUNNER_REPO/actions/runs/$BACKEND_GATE_RUN" --jq '.conclusion')" = success
          GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/issues/comments/$OWNER_COMMENT_ID" --jq '.body' >/tmp/owner-attestation.txt
          grep -Fq 'OWNER_PREVIEW_ACCEPTANCE_ATTESTATION = PASS' /tmp/owner-attestation.txt
          grep -Fq 'FORMAL_RELEASE_CHAIN_AUTHORIZED = YES' /tmp/owner-attestation.txt
          grep -Fq 'PRODUCTION_WRITE_AUTHORIZED = NO' /tmp/owner-attestation.txt
          echo P01_V24739_OWNER_RELEASE_ACCEPTANCE=PASS
          echo OWNER_REAL_USE_INDEPENDENT_RUNTIME_EVIDENCE=NOT_PROVIDED

      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source and stable authority closure checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '$TARGET_VERSION');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = REQUIRED' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'OWNER_PREVIEW_RUNTIME = PENDING' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'OWNER_REAL_USE = PENDING' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'FORMAL_RELEASE_READY = NO' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          find vf-start/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find vf-start/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          php vf-start/tests/unit/release_authority_r44_contract.php
          php vf-start/tests/unit/readme_runtime_authority_r75_contract.php
          php vf-start/tests/unit/admin_visual_batch_r74_contract.php
          php vf-start/tests/unit/navigation_mobile_list_r73_contract.php
          echo P01_V24739_EXACT_FORMAL_SOURCE=PASS
          echo OWNER_GATE_RESOLUTION=EXTERNAL_OWNER_ATTESTATION_COMMENT_$OWNER_COMMENT_ID

      - name: Freeze exact preview artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          FROZEN=/tmp/p01-v24739-frozen
          rm -rf "$FROZEN"
          mkdir -p "$FROZEN"
          GH_TOKEN="$READ_TOKEN" gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir "$FROZEN"
          test "$(find "$FROZEN" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          FULL="$FROZEN/VF-Start-V2.47.39-FULL.zip"
          UPDATE="$FROZEN/VF_Start_V2.47.39_UPDATE.zip"
          test -f "$FULL"
          test -f "$FULL.sha256"
          test -f "$UPDATE"
          test -f "$UPDATE.sha256"
          test -f "$FROZEN/SHA256SUMS.txt"
          test "$(stat -c%s "$FULL")" = 887229
          test "$(stat -c%s "$UPDATE")" = 1893816
          test "$(sha256sum "$FULL" | awk '{print $1}')" = 0397edacf8d53226ad9a79ebe1980c5e0182da4e3ae5ac209d356ff1e5613b58
          test "$(sha256sum "$UPDATE" | awk '{print $1}')" = d064f5a63bfed7043914607997280129e2a01c06d510646c647614f56de2c7c8
          test "$(sha256sum "$FROZEN/SHA256SUMS.txt" | awk '{print $1}')" = 7f2fa75079972562d6924cc8d949a0e11a7d2fda7d5081df1c4af06e4ba144ab
          (cd "$FROZEN" && sha256sum -c VF-Start-V2.47.39-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.39_UPDATE.zip.sha256)
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n ')" = "$TARGET_VERSION"
          unzip -p "$FULL" release-manifest.json >/tmp/p01-v24739-release-manifest.json
          jq -e --arg t "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg schema "$EXPECTED_SCHEMA" '.version==$t and .source_version==$s and .schema_version==$schema and .source_schema_version==$schema and .schema_change==false and (.schema_migrations|length)==0 and .runtime_data_included==false and .seed_user_business_data_included==false and .update.backup_required==true and .update.rollback_supported==true and .update.single_hop==true and (.update.supported_from==[$s])' /tmp/p01-v24739-release-manifest.json >/dev/null
          test "$(unzip -Z1 "$UPDATE" | wc -l | tr -d ' ')" = 1
          unzip -Z1 "$UPDATE" | grep -Fxq repair-v2.47.39.php
          unzip -p "$UPDATE" repair-v2.47.39.php >/tmp/repair-v2.47.39.php
          php /tmp/repair-v2.47.39.php --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          ! unzip -Z1 "$FULL" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V24739_FROZEN_PREVIEW_ARTIFACTS=PASS

      - name: Create formal tag and GitHub Release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          FROZEN=/tmp/p01-v24739-frozen
          gh api --method POST "repos/$PRODUCT_REPO/git/refs" -f ref="refs/tags/$TARGET_TAG" -f sha="$FORMAL_SHA" >/dev/null
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TARGET_TAG" --jq '.object.sha')" = "$FORMAL_SHA"
          cat >/tmp/p01-v24739-formal-notes.md <<EOF
          # P01 · VF Start V2.47.39

          Formal stable release of the post-V2.47.38 Admin Product Experience Closure.

          Exact Formal Source: $FORMAL_SHA
          Previous Stable: $SOURCE_TAG / $SOURCE_SHA
          Schema: $EXPECTED_SCHEMA unchanged; Migration: NONE.
          Merged-main Candidate Gate: $CANDIDATE_RUN PASS.
          Merged-main backend readiness: $BACKEND_GATE_RUN PASS.
          Frozen Preview Artifact Gate: $PREVIEW_ARTIFACT_RUN PASS.
          Preview prerelease: $PREVIEW_TAG — exact same source and exact frozen release bytes.
          OWNER Release Acceptance: PR #$BIND_PR comment $OWNER_COMMENT_ID.
          OWNER explicitly instructed direct preview acceptance and continuous automatic release.
          Independent Owner runtime-interaction evidence was not provided; this limitation is preserved in the acceptance record rather than hidden.
          Strict $SOURCE_VERSION → $TARGET_VERSION Atomic UPDATE / data preservation / backup+rollback / runtime-cache handoff / package safety were proven in the frozen Preview Artifact Gate.
          Stable Distribution Channel is a separate next gate.
          Production is NOT WRITTEN by this Formal Release.
          EOF
          gh release create "$TARGET_TAG"             "$FROZEN/VF-Start-V2.47.39-FULL.zip"             "$FROZEN/VF-Start-V2.47.39-FULL.zip.sha256"             "$FROZEN/VF_Start_V2.47.39_UPDATE.zip"             "$FROZEN/VF_Start_V2.47.39_UPDATE.zip.sha256"             "$FROZEN/SHA256SUMS.txt"             --repo "$PRODUCT_REPO" --title 'VF Start V2.47.39' --notes-file /tmp/p01-v24739-formal-notes.md --verify-tag
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$TARGET_TAG" --jq '.prerelease')" = false
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$TARGET_TAG" --jq '.draft')" = false
          echo P01_V24739_FORMAL_RELEASE_CREATED=PASS

      - name: Independent formal remote byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          FROZEN=/tmp/p01-v24739-frozen
          REMOTE=/tmp/p01-v24739-formal-remote
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/git/ref/tags/$TARGET_TAG" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/releases/tags/$TARGET_TAG" --jq '.prerelease')" = false
          rm -rf "$REMOTE"
          mkdir -p "$REMOTE"
          GH_TOKEN="$READ_TOKEN" gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir "$REMOTE"
          LOCAL="$FROZEN" REMOTE="$REMOTE" python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.39-FULL.zip','VF-Start-V2.47.39-FULL.zip.sha256','VF_Start_V2.47.39_UPDATE.zip','VF_Start_V2.47.39_UPDATE.zip.sha256','SHA256SUMS.txt']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'FORMAL_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24739_FORMAL_REMOTE_BYTES=PASS')
          PY

      - name: Final formal verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_ID="$(GH_TOKEN="$READ_TOKEN" gh api "repos/$PRODUCT_REPO/releases/tags/$TARGET_TAG" --jq '.id')"
          test -n "$RELEASE_ID"
          echo OWNER_PREVIEW_ACCEPTANCE_ATTESTATION=PASS
          echo OWNER_REAL_USE_INDEPENDENT_RUNTIME_EVIDENCE=NOT_PROVIDED
          echo FORMAL_RELEASE_ID="$RELEASE_ID"
          echo EXACT_FORMAL_SOURCE="$FORMAL_SHA"
          echo PREVIEW_BYTES_REUSED_EXACTLY=YES
          echo P01_V24739_FORMAL_RELEASE_GATE=PASS
          echo FORMAL_RELEASE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start /tmp/p01-v24739-* /tmp/repair-v2.47.39.php /tmp/owner-attestation.txt
