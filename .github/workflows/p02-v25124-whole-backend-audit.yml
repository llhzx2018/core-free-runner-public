name: P02 V2.5.124 Final Backend UX Closure Gate

on:
  push:
    branches:
      - run/p02-v25124-settings-functional-content-20260926
    paths:
      - '.github/workflows/p02-v25124-whole-backend-audit.yml'
      - 'requests/p02-v25124-whole-backend-audit.sh'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: f6cd8f054bcc8d8d6a2b89e391ebe5fae16376cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "f6cd8f054bcc8d8d6a2b89e391ebe5fae16376cc"
          test "$(git show -s --format=%T HEAD)" = "854dc956aa3611ca268ae2ac95e897e3b7e205fd"
          test "$(cat VERSION)" = "2.5.124"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          echo P02_V25124_FINAL_SOURCE_UNIT=PASS

      - name: Whole-backend browser closure
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25124-whole-backend-audit.sh

      - name: Closure marker
        run: |
          cat <<'EOF'
          TESTING=PASS
          UI_UX=PASS
          DATA_SCHEMA=PASS
          GIT=PASS
          RELEASE=N_A_NOT_AUTHORIZED
          PRODUCTION=N_A_NOT_AUTHORIZED
          P02_V25124_BACKEND_UX_CLOSURE=PASS
          EOF
