name: S01 player 95 native update discovery
on:
  push:
    branches: [task/s01-converter-i18n-proof-20261030]
    paths: ['.github/workflows/s01-converter-plugin-discovery-20261030.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-m3u8
  TARGET_VERSION: 1.25.96
  TARGET_SHA: 506467df8bdf7eb4584800b31ef3334a8ffd30ce
  TARGET_TREE: ad171a63549a2afe25c84446c2c614a7c0dab8d2
  LANE_ID: s01-player95-20261028
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Download exact prior version
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          gh release download v1.25.94 --repo "$TARGET_REPO" --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          php -l control/lanes/s01-converter-plugin-discovery-20261030/discover.php
      - name: Native WordPress update readback
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash control/lanes/s01-converter-plugin-discovery-20261030/discovery.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-player95-discovery-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf provider
