name: p01-v24773-owner-preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24773-owner-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p01-v24773-owner-preview-20260925
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      TARGET_TREE: 9e6fe0e775e95dfb237471a569f604062f267218
      TARGET_VERSION: 2.47.73
      PREVIEW_PORT: '18490'
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5a90fa61b0e446444b49f8de58438d2de5e9acda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate and prepare clean runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < product/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd curl openssl >/dev/null
          rm -rf /tmp/p01-v24773-owner-preview
          cp -a product/src /tmp/p01-v24773-owner-preview
          echo P01_V24773_PREVIEW_EXACT_SOURCE=PASS

      - name: Install isolated preview instance
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          root=/tmp/p01-v24773-owner-preview
          cookie=/tmp/p01-v24773-preview-cookie.txt
          pass="$(openssl rand -hex 18)"
          printf '%s' "$pass" >/tmp/p01-v24773-preview-password
          (
            cd "$root"
            php -S 127.0.0.1:"$PREVIEW_PORT" -t . >/tmp/p01-v24773-preview-php.log 2>&1 &
            echo $! >/tmp/p01-v24773-preview-php.pid
          )
          for i in $(seq 1 40); do
            if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$PREVIEW_PORT/setup.php" -o /tmp/p01-v24773-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
import re
t=open('/tmp/p01-v24773-setup.html',encoding='utf-8').read()
m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t)
assert m
print(m.group(1))
PY
)"
          curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$PREVIEW_PORT/setup.php"             --data-urlencode "setup_csrf=$csrf"             --data-urlencode "site_title=VF Start V2.47.73 Owner Preview"             --data-urlencode "admin_password=$pass"             --data-urlencode "admin_password_confirm=$pass"             -o /tmp/p01-v24773-setup-post.html
          (cd "$root" && php cli/verify.php) | tee /tmp/p01-v24773-preview-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24773-preview-verify.txt
          body="$(php -r 'echo json_encode(["password"=>$argv[1]], JSON_UNESCAPED_SLASHES);' "$pass")"
          curl -fsS -c "$cookie" -b "$cookie" -H 'Content-Type: application/json' --data "$body"             "http://127.0.0.1:$PREVIEW_PORT/api.php?action=login" >/tmp/p01-v24773-preview-login.json
          grep -Fq '"ok":true' /tmp/p01-v24773-preview-login.json
          curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$PREVIEW_PORT/jobs.php" -o /tmp/p01-v24773-preview-jobs.html
          grep -Fq '计划任务' /tmp/p01-v24773-preview-jobs.html
          unset pass body
          echo P01_V24773_PREVIEW_RUNTIME_LOCAL=PASS

      - name: Start explicitly authorized temporary Quick Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod 700 /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$PREVIEW_PORT" --logfile /tmp/p01-v24773-cloudflared.log --loglevel info >/tmp/p01-v24773-cloudflared.stdout 2>&1 &
          echo $! >/tmp/p01-v24773-cloudflared.pid
          url=""
          for i in $(seq 1 60); do
            url="$(grep -hEo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/p01-v24773-cloudflared.log /tmp/p01-v24773-cloudflared.stdout 2>/dev/null | tail -1 || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 1
          done
          test -n "$url"
          curl -fsS --retry 5 --retry-delay 2 "$url/" -o /tmp/p01-v24773-preview-external.html
          printf '%s' "$url" >/tmp/p01-v24773-preview-url
          echo P01_V24773_OWNER_PREVIEW_RUNTIME=READY

      - name: Encrypt Preview access handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          url="$(cat /tmp/p01-v24773-preview-url)"
          pass="$(cat /tmp/p01-v24773-preview-password)"
          cat >/tmp/P01_V24773_PREVIEW_ACCESS.txt <<EOF
          PREVIEW_URL=$url/jobs.php
          LOGIN_PASSWORD=$pass
          VERSION=$TARGET_VERSION
          EXACT_SOURCE=$TARGET_SHA
          PRODUCTION_WRITE=NO
          TAG_RELEASE_CHANNEL_WRITE=NO
          EOF
          cat >/tmp/p01-preview-public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAvbgmRIMXrp/a8FmNa14l
hLUWU8+aDYr55HO3xnQfC4hICKOSznq4C7N3RYVkbGzQXNEBokZasBPYXUdooBHy
VYTZMjZLTF/BylRlkk8O+How2ibNx9AJEpYSb+ORMpk9mSBL1+LMEtt9jNs6T0CB
6//3p5sbpdFANfYlBy0m0e8UJc+NbeJcK1Uj0uxwCVfjJuscXTtgPGV7gvsXSLGR
TcEq8ubAjN5wvsnJ+oA/Cp/Vr824IW0Vl9iMVl5uXZH7r1QzOaNr9bBRriaMKMaX
/RwSG6+vuwlFdguGRUnLrnqn27pDESISxzkpHUDsaZ9d6DbI9p9W2qJqRkA8bPWQ
YnhfbR8i+3hFkMgJsqMoCxcxGbO8KfRmPFzj+zP9UaNuohjurUcBsb6fsS0KIRom
ttQXFTMXXICQxC16noYA4L/Wuk0xpoY1v45jx14vfsLDVfqNTT5qolQnq7JtuMUn
moANQp7u167moFZLVe9PkVszchaanBYC6sVVs6ijMj58sAMW96N10MYxtBsom9VH
/T+XtoEu5im0oMJdSynoJI1LX9wHow8WYgsbqyNqqOGTkvNx34MXn7dBbzWB7J9b
Q5v7qHbRq/GS7I5z+BXD1U/wJrEOJvHhA2PlJOJnHidpHyypt8eVTsiORx7Rmn+L
+x78+75V16uUan+MCrrJ3l0CAwEAAQ==
-----END PUBLIC KEY-----
PEM
          openssl pkeyutl -encrypt -pubin -inkey /tmp/p01-preview-public.pem             -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256             -in /tmp/P01_V24773_PREVIEW_ACCESS.txt             -out /tmp/P01_V24773_PREVIEW_ACCESS.enc
          rm -f /tmp/P01_V24773_PREVIEW_ACCESS.txt /tmp/p01-v24773-preview-password /tmp/p01-preview-public.pem
          unset url pass
          test -s /tmp/P01_V24773_PREVIEW_ACCESS.enc
          echo P01_V24773_PREVIEW_ACCESS_ENCRYPTED=PASS

      - name: Upload encrypted access capsule
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24773-preview-access-encrypted
          path: /tmp/P01_V24773_PREVIEW_ACCESS.enc
          if-no-files-found: error
          retention-days: 1

      - name: Keep preview available for Owner real use
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s /tmp/p01-v24773-cloudflared.pid
          test -s /tmp/p01-v24773-preview-php.pid
          for i in $(seq 1 90); do
            kill -0 "$(cat /tmp/p01-v24773-cloudflared.pid)"
            kill -0 "$(cat /tmp/p01-v24773-preview-php.pid)"
            sleep 60
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          [[ -s /tmp/p01-v24773-cloudflared.pid ]] && kill "$(cat /tmp/p01-v24773-cloudflared.pid)" >/dev/null 2>&1 || true
          [[ -s /tmp/p01-v24773-preview-php.pid ]] && kill "$(cat /tmp/p01-v24773-preview-php.pid)" >/dev/null 2>&1 || true
          rm -rf /tmp/p01-v24773-owner-preview /tmp/p01-v24773-preview-cookie.txt /tmp/p01-v24773-setup.html /tmp/p01-v24773-setup-post.html /tmp/p01-v24773-preview-login.json /tmp/p01-v24773-preview-jobs.html /tmp/P01_V24773_PREVIEW_ACCESS.enc
          echo P01_V24773_PREVIEW_RUNTIME_CLEANUP=PASS
