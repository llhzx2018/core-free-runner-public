name: P04 V2.5.5 Candidate Fixture
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v255-candidate-fixture.yml'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Ensure runtime dependencies
        run: |
          set -Eeuo pipefail
          php -v
          php -m | grep -qi pdo_sqlite || { sudo apt-get update -qq; sudo apt-get install -y php-sqlite3; }
          php -m | grep -qi zip || { sudo apt-get update -qq; sudo apt-get install -y php-zip; }
          php -m | grep -qi curl || { sudo apt-get update -qq; sudo apt-get install -y php-curl; }
          php -m | grep -qi sodium
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: hotfix/p04-v2.5.5-online-handoff-contract
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target-src
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 68fd396a45ba1eaea34db5ac15cce42791965e49
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: prior-src
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 2391834b2d904ca76fca23c94c835a38cec0e6e5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: v254-src
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          path: runner
      - name: Verify hotfix source boundary
        run: |
          set -Eeuo pipefail
          cd target-src
          test "$(cat VERSION)" = '2.5.5'
          git diff --check
          git diff --name-only 9e54e2d4932d6c7635cdb928979e5c32e6fcbeea...HEAD | tee "$RUNNER_TEMP/v255-diff.txt"
          python3 - "$RUNNER_TEMP/v255-diff.txt" <<'PY'
          import pathlib,sys
          x=set(pathlib.Path(sys.argv[1]).read_text().splitlines())
          allowed={'VERSION','scripts/build-release-tree.py','scripts/build-v251-maintenance-release.py','scripts/build-v255-update-release.py','scripts/validate-online-atomic-package.py'}
          assert x==allowed,(x,allowed)
          print('MINIMAL_HOTFIX_SOURCE_BOUNDARY=PASS')
          PY
      - name: Exact Online Handoff / Atomic candidate fixture
        run: |
          set -Eeuo pipefail
          bash runner/scripts/p04-v255-candidate-fixture.sh target-src prior-src v254-src | tee "$RUNNER_TEMP/p04-v255-fixture.log"
      - name: Preserve hash-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04_V255_CANDIDATE_HASH_ONLY_EVIDENCE
          path: |
            ${{ runner.temp }}/p04-v255-fixture/candidate-evidence.json
            ${{ runner.temp }}/p04-v255-fixture/target-build.json
            ${{ runner.temp }}/p04-v255-fixture/candidate-build.json
            ${{ runner.temp }}/p04-v255-fixture/business-before.json
          if-no-files-found: error
          retention-days: 30
