name: P05 V1.1.8 VF Project Closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P05 authority branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: docs/p05-v1.1.8-vf-project-closure-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify starting source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ee4ef673959ef821e0fc8b311dc81769188b8bae'
          test "$(cat VERSION)" = '1.1.8'
          test "$(node -p "require('./VF_PROJECT.json').status")" = 'V1.1.8_RELEASE_CANDIDATE / MACHINE_GATE_PENDING / PRODUCTION_NOT_DEPLOYED'

      - name: Reconcile release authority JSON
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('VF_PROJECT.json')
          p=json.loads(path.read_text(encoding='utf-8'))

          p['status']='V1.1.8_RELEASED_CURRENT / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          p['formal_release']='v1.1.8'
          p['formal_release_state']='RELEASED_CURRENT'
          p['formal_release_candidate_commit']='c01b1ccbbb0f220b84241ba60fbf7472c1d5db52'
          p['formal_release_candidate_tree']='0066972cafd25778930f4032b4aa9863ee279ed4'
          p['formal_release_asset']='VF_SEO_V1.1.8_FULL.zip'
          p['formal_release_asset_files']=46
          p['formal_release_asset_bytes']=244656
          p['formal_release_asset_sha256']='f8435555dc7c656a65c55481209bf75c499906d2334f446552e310b0a27e7c0e'
          p['runtime_recovery_candidate']='V1.1.8_SITE_INSTANCE_PASS_CLOSED'
          p['runtime_recovery_release']='RELEASED_V1.1.8'
          p['production_runtime_acceptance']='V1.1.8_FORMAL_RELEASE_PASS_REAL_ENDPOINT_NOT_PROVEN'
          p['working_branch']='main'
          p['owner_real_use_review']='V1.1.7_REAL_FAIL_V1.1.8_REAL_ENDPOINT_NOT_PROVEN'
          p['owner_real_use_pass']='NOT_PROVEN_FOR_V1.1.8'
          p['release_authorization']='PASS_RELEASED_V1.1.8'
          p['product_failure']=None
          p['runtime_evidence']='docs/evidence/V1.1.8_SITE_INSTANCE_FRESH_INSTALL_20260830.md'
          p['next_action']='V1.1.8 FORMAL RELEASE CLOSED; PRODUCTION REMAINS SEPARATE OWNER GATE'
          p['deployment_readiness']='PASS_V1.1.8_RELEASED'
          p['formal_release_id']=379280299
          p['formal_release_asset_id']=536610358
          p['formal_release_source']='998e8c793ad6c3e306f522fd47271284d672471f'
          p['formal_release_tree']='0066972cafd25778930f4032b4aa9863ee279ed4'
          p['release_publication']={
            'tag':'v1.1.8',
            'release_id':379280299,
            'release_name':'P05 · VF SEO v1.1.8 · Site Instance Fresh Install Fix',
            'target_commit':'998e8c793ad6c3e306f522fd47271284d672471f',
            'target_tree':'0066972cafd25778930f4032b4aa9863ee279ed4',
            'published_at':'2026-08-30T12:49:39Z',
            'full_asset':'VF_SEO_V1.1.8_FULL.zip',
            'full_asset_id':536610358,
            'full_bytes':244656,
            'full_sha256':'f8435555dc7c656a65c55481209bf75c499906d2334f446552e310b0a27e7c0e',
            'receipt_asset':'VF_SEO_V1.1.8_RELEASE_RECEIPT.txt',
            'receipt_asset_id':536610359,
            'exact_candidate_source':'c01b1ccbbb0f220b84241ba60fbf7472c1d5db52',
            'exact_candidate_run':33312373840,
            'exact_candidate_job':99259629056,
            'publication_run':33312497774,
            'publication_job':99259957924,
            'state':'PASS_CLOSED',
            'real_endpoint':'NOT_PROVEN_V1.1.8',
            'production':'NOT_DEPLOYED'
          }

          v=p['v1_1_8_site_instance_fresh_install_fix']
          v['state']='RELEASED'
          v['final_candidate_source']='c01b1ccbbb0f220b84241ba60fbf7472c1d5db52'
          v['final_candidate_tree']='0066972cafd25778930f4032b4aa9863ee279ed4'
          v['final_candidate_gate_run']=33312373840
          v['final_candidate_gate_job']=99259629056
          v['formal_release']='v1.1.8'
          v['release_source']='998e8c793ad6c3e306f522fd47271284d672471f'
          v['release_tree']='0066972cafd25778930f4032b4aa9863ee279ed4'
          v['release_id']=379280299
          v['full_asset_id']=536610358
          v['full_asset_bytes']=244656
          v['full_asset_sha256']='f8435555dc7c656a65c55481209bf75c499906d2334f446552e310b0a27e7c0e'
          v['publication_run']=33312497774
          v['publication_job']=99259957924
          v['real_endpoint_deployment']='NOT_PROVEN'
          v['production_state']='NOT_DEPLOYED'

          path.write_text(json.dumps(p, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Verify exact mutation scope and values
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          node - <<'NODE'
          const p=require('./VF_PROJECT.json');
          if (p.status !== 'V1.1.8_RELEASED_CURRENT / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED') process.exit(1);
          if (p.formal_release !== 'v1.1.8' || p.formal_release_state !== 'RELEASED_CURRENT') process.exit(1);
          if (p.formal_release_source !== '998e8c793ad6c3e306f522fd47271284d672471f') process.exit(1);
          if (p.formal_release_asset_sha256 !== 'f8435555dc7c656a65c55481209bf75c499906d2334f446552e310b0a27e7c0e') process.exit(1);
          if (p.production_deployment !== 'NOT_DEPLOYED' || p.production_write !== 0) process.exit(1);
          if (p.v1_1_8_site_instance_fresh_install_fix.state !== 'RELEASED') process.exit(1);
          console.log('P05_VF_PROJECT_V118_RELEASE_AUTHORITY=PASS');
          NODE

      - name: Commit and push authority closure
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VF_PROJECT.json
          git commit -m 'docs(P05): close VF_PROJECT on V1.1.8 formal release'
          git push origin HEAD:docs/p05-v1.1.8-vf-project-closure-20260830

      - name: Receipt
        run: |
          echo 'P05_VF_PROJECT_V118_RELEASE_AUTHORITY=PASS'
          echo 'P05_PRODUCT_CODE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
