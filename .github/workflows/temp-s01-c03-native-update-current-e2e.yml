name: TEMP S01-C03 Native Update Current E2E

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-native-update-current-e2e.yml'

permissions:
  contents: read

jobs:
  native-update-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      VF_UPDATE_EVIDENCE_DIR: ${{ github.workspace }}/evidence/wp-update-current
    steps:
      - name: Checkout exact private M3U8 1.25.6
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Adapt legacy E2E fixture locally to current contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[Path('product/tests/wp-update/build_packages.py'),Path('product/tests/wp-update/run.sh'),Path('product/tests/wp-update/wp_fixture.php')]
          pairs=[
            ('1.25.3-fail','1.25.8-fail'),
            ('1.25.2','1.25.7'),
            ('1.25.1','1.25.6'),
            ('R226-FIXTURE','R231-FIXTURE'),
            ('1.2.0','1.3.0'),
            ('wordpress:7.0.2-php8.4-apache','wordpress:7.1-php8.4-apache'),
            ('mariadb:11.8.8','mariadb:11.4'),
          ]
          table_map={
            'wp_vf_capabilities':'wp_vf_m3u8_capabilities',
            'wp_vf_capability_contracts':'wp_vf_m3u8_capability_contracts',
            'wp_vf_pipelines':'wp_vf_m3u8_pipelines',
            'wp_vf_pipeline_revisions':'wp_vf_m3u8_pipeline_revisions',
            'wp_vf_pipeline_steps':'wp_vf_m3u8_pipeline_steps',
            'wp_vf_pipeline_edges':'wp_vf_m3u8_pipeline_edges',
            'wp_vf_provider_fixtures':'wp_vf_m3u8_provider_fixtures',
            'wp_vf_provider_fixture_revisions':'wp_vf_m3u8_provider_fixture_revisions',
            'wp_vf_provider_fixture_runs':'wp_vf_m3u8_provider_fixture_runs',
            'wp_vf_runtime_bundles':'wp_vf_m3u8_runtime_bundles',
            'wp_vf_runtime_bundle_assets':'wp_vf_m3u8_runtime_bundle_assets',
            'wp_vf_provider_operation_runs':'wp_vf_m3u8_provider_operation_runs',
            'wp_vf_provider_snapshots':'wp_vf_m3u8_provider_snapshots',
            'wp_vf_provider_snapshot_items':'wp_vf_m3u8_provider_snapshot_items',
          }
          for p in files:
              s=p.read_text(encoding='utf-8')
              for a,b in pairs: s=s.replace(a,b)
              if p.name=='run.sh':
                  for a,b in sorted(table_map.items(), key=lambda x:-len(x[0])): s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')
          PY
          grep -Fq "test \"\$(tr -d '\\r\\n' < \"\$ROOT/VERSION\")\" = 1.25.6" product/tests/wp-update/run.sh
          grep -Fq "schema_from':'1.3.0'" product/tests/wp-update/run.sh
          grep -Fq 'wordpress:7.1-php8.4-apache' product/tests/wp-update/run.sh
          grep -Fq 'mariadb:11.4' product/tests/wp-update/run.sh
          echo 'CURRENT_FIXTURE_ADAPTATION=PASS'

      - name: Run real WordPress Plugin_Upgrader E2E
        shell: bash
        env:
          GITHUB_WORKSPACE_PRIVATE: ${{ github.workspace }}/product
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_UPDATE_EVIDENCE_DIR"
          bash product/tests/wp-update/run.sh

      - name: Seal current Native Update result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_UPDATE_EVIDENCE_DIR"
          {
            echo "S01_C03_NATIVE_UPDATE_CURRENT_E2E=${{ job.status }}"
            echo 'SOURCE_VERSION=1.25.6'
            echo 'TARGET_FIXTURE=1.25.7'
            echo 'PROVIDER_SCHEMA=1.3.0'
            echo 'WORDPRESS=7.1'
            echo 'MARIADB=11.4'
            echo "PRODUCT_SHA=$PRODUCT_SHA"
          } > "$VF_UPDATE_EVIDENCE_DIR/CURRENT_E2E_SEAL.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c03-native-update-current-e2e-${{ github.run_id }}
          path: evidence/wp-update-current/
          if-no-files-found: warn
          retention-days: 7
