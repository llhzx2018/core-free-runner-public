name: S01-C02 1.21.854 Core Update External Gate

on:
  push:
    branches: [temp/s01-c02-121854-core-update-gate-20260907]
    paths:
      - '.github/workflows/temp-s01-c02-121854-core-update-gate-20260907.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: 4120f7c5211df19de1c8a89ea4f30520fc5c464d
      CORE_HEAD: 0ea625bc51232e65fd6d11a7c18e8baf8abd47de
      OPS_SHA: 569b0845fd22ab50b67130b6a1bc3e6da36e83d4
    steps:
      - name: Credential boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false

      - name: Exact one-manifest delta and canonical validation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_HEAD"
          test "$(git -C core diff --name-only "$CORE_BASE..$CORE_HEAD")" = 'projects/S01-C02.json'
          cd core
          python3 -m json.tool projects/S01-C02.json >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo 'EXACT_ONE_MANIFEST_DELTA=PASS'
          echo 'CANONICAL_UPDATE_CORE_VALIDATION=PASS'

      - name: S01-C02 semantic boundary
        working-directory: core
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          c=json.load(open('projects/S01-C02.json'))
          assert c['target_version']=='1.21.854'
          assert c['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853']
          assert c['plugin_file']=='vf-ops/vf-ops.php'
          assert c['physical_locator']=='vf-ops/vf-ops.php'
          assert c['canonical_locator']=='vf-tools-ops/vf-tools-ops.php'
          assert c['locator_cutover'] is False
          assert c['schema_from']=='6.0.0' and c['schema_to']=='6.0.0'
          assert c['release_tag']=='v1.21.854'
          assert c['asset_name']=='vf-tools-ops_V1.21.854.zip'
          assert c['asset_bytes']==3336767
          assert c['asset_sha256']=='ea7c25a66278d637af6fd8a12f105d292ae9033101673b0855a825c4175c5e53'
          assert c['runtime_files']==934 and c['runtime_file_count']==934
          assert c['runtime_fingerprint']=='6c980e545c2a05a1fc8a61980c064e1c8ff53ec4b2242d5eafc721b54d403852'
          assert c['runtime_fingerprint_sha256']==c['runtime_fingerprint']
          assert '34093429209 PASS' in c['notes']
          assert '34093562168 PASS' in c['notes']
          print('S01_C02_SEMANTIC_BOUNDARY=PASS')
          PY

      - name: Exact formal Release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          auth=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.854 > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.854.zip' '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = '3336767'
          test "$(jq -r --arg a 'vf-tools-ops_V1.21.854.zip' '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = 'sha256:ea7c25a66278d637af6fd8a12f105d292ae9033101673b0855a825c4175c5e53'
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.854 | jq -r '.object.sha')" = "$OPS_SHA"
          test "$(curl --fail-with-body -sS "${auth[@]}" https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')" = "$OPS_SHA"
          echo 'EXACT_FORMAL_RELEASE_METADATA_READBACK=PASS'
          echo 'S01_C02_121854_CORE_UPDATE_EXTERNAL_GATE=PASS'
