name: S01 C02 1211095 System Update Blocker Exact Source
on:
  push:
    branches: [task/s01-c02-1211095-system-update-blocker-regression-20261011]
permissions:
  contents: read
jobs:
  exact-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: f9947ad1245acf8426b48ce0836a07eaf1284ace
    steps:
      - name: Checkout isolated regression workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch only scoped private source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          for p in \
            includes/admin-v13/services/system_plugins.php \
            includes/admin-v13/views/system_plugins.php \
            assets/css/current/admin-s01-system-one-page-r1.css \
            tests/s01-c02-1211095-system-update-blocker-visibility.php; do
            mkdir -p "exact/$(dirname "$p")"
            gh api -H "Accept: application/vnd.github.raw+json" "repos/llhzx2018/vf-tools-ops/contents/$p?ref=$SOURCE_SHA" > "exact/$p"
            test -s "exact/$p"
          done
      - name: PHP syntax and fail-closed regression
        run: |
          set -Eeuo pipefail
          cd exact
          php -l includes/admin-v13/services/system_plugins.php
          php -l includes/admin-v13/views/system_plugins.php
          php -l tests/s01-c02-1211095-system-update-blocker-visibility.php
          php tests/s01-c02-1211095-system-update-blocker-visibility.php
          echo S01_C02_1211095_EXACT_SOURCE_MACHINE_PASS
