name: P06 Whole-Site Refoundation Exact Source Gate

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-whole-site-refoundation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-whole-site-refoundation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: db545d4d35eb9e0a576159b4e7b718af54e7a15c
      SOURCE_TREE: 9aecf5e17b6f2a11eca53dd0b4fc16534cf12c0c
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.10'
          test "$(jq -r .version VF_PROJECT.json)" = '0.1.10'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'WHOLE_SITE_REFOUNDATION_V1_IMPLEMENTATION'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'EXACT_SOURCE_WHOLE_SITE_REFOUNDATION_REGRESSION'
          grep -Fq 'OWNER LOCKED / RUNTIME IMPLEMENTATION AUTHORIZED' docs/reference/P06_WHOLE_SITE_REFOUNDATION_REFERENCE_CANDIDATE_20260824.md
          echo SOURCE_IDENTITY=PASS
          echo AUTHORITY_GATE=PASS
          echo VERSION_BUMP=0
          echo PRODUCTION_WRITE=0

      - name: Composer and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Fresh migration and complete product regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | tee /tmp/p06-migration
          grep -Fq MIGRATION_PASS /tmp/p06-migration
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | tee /tmp/p06-markdown
          grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS /tmp/p06-markdown
          grep -Fq CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-markdown
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/reader-ux-self-test.php | grep -Fq READER_UX_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/whole-site-refoundation-self-test.php | tee /tmp/p06-whole-site
          grep -Fq WHOLE_SITE_REFOUNDATION_SELF_TEST=PASS /tmp/p06-whole-site
          grep -Fq LIBRARY_TO_BOOK_WORKSPACE_IA=PASS /tmp/p06-whole-site
          grep -Fq TWO_COLUMN_MANUSCRIPT=PASS /tmp/p06-whole-site
          grep -Fq READER_BOOK_CONTINUITY=PASS /tmp/p06-whole-site
          grep -Fq PUBLISHING_OPTIONAL_DOWNSTREAM=PASS /tmp/p06-whole-site
          php bin/book-outline-self-test.php | tee /tmp/p06-outline
          grep -Fq OWNER_ACCEPT_REJECT=PASS /tmp/p06-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-outline
          php bin/demo-data-self-test.php | grep -Fq DEMO_DATA_SELF_TEST=PASS
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3); echo "SQLITE_INTEGRITY=PASS\nSCHEMA=3 PASS\n";'
          echo FULL_REGRESSION=PASS

      - name: Whole-site product contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "'continue' => ['label'=>'继续'" src/Http/Studio/AdminShell.php
          grep -Fq "'books' => ['label'=>'书籍'" src/Http/Studio/AdminShell.php
          grep -Fq "'research' => ['label'=>'研究库'" src/Http/Studio/AdminShell.php
          grep -Fq "'settings' => ['label'=>'设置'" src/Http/Studio/AdminShell.php
          ! grep -Fq "'quality' =>" src/Http/Studio/AdminShell.php
          ! grep -Fq "'publishing' =>" src/Http/Studio/AdminShell.php
          grep -Fq 'class="book-workspace-nav"' src/Http/Studio/BookController.php
          grep -Fq 'class="book-progress"' src/Http/Studio/BookController.php
          grep -Fq 'class="manuscript-context-drawer"' src/Http/Studio/PublicationController.php
          grep -Fq 'class="reader-edit-link"' src/Http/Preview/PublisherReaderPreviewController.php
          grep -Fq 'AI Provider 未配置' src/Http/Studio/BookController.php
          grep -Fq 'AI Candidate 不会覆盖已接受的 Canonical Markdown' src/Http/Studio/BookController.php
          echo LIBRARY_SHELL=PASS
          echo BOOK_WORKSPACE=PASS
          echo MANUSCRIPT_FOCUS=PASS
          echo READER_CONTINUITY=PASS
          echo CANONICAL_CANDIDATE_ISOLATION=PASS
          echo PROVIDER_OPTIONAL=PASS

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_DATA_PERSISTED=NO
          echo FORMAL_RELEASE=NOT_EXECUTED
          echo PRODUCTION_WRITE=NOT_EXECUTED
