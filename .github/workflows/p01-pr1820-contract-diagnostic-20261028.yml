name: P01 PR1820 one-time failed Unit contract diagnostics
on:
  push:
    branches: [task/p01-pr1820-contract-diagnostic-20261028]
    paths: ['.github/workflows/p01-pr1820-contract-diagnostic-20261028.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-start
  TARGET_SHA: 8dbda6c30710734dd037403d2bd03aa73df01245
  TARGET_VERSION: 2.47.466
  LANE_ID: p01-pr1820-contract-diagnostic-20261028
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Audit exact source intent
        run: |
          set -euo pipefail
          python3 control/scripts/ephemeral_lane_spec.py validate --spec "control/lanes/$LANE_ID/spec.json"
          python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec "control/lanes/$LANE_ID/spec.json" --input "control/.github/workflows/p01-pr1820-contract-diagnostic-20261028.yml"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8dbda6c30710734dd037403d2bd03aa73df01245
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Show bounded PHP test assertion failures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          cd target
          count=0
          for name in category_picker_sort_dialog_r13_contract.php p01_frontstage_local_management_r3_contract.php p01_frontstage_local_management_r4_contract.php p01_frontstage_local_management_r5_contract.php p01_frontstage_local_management_r6_contract.php p01_local_management_r1_contract.php p01_local_management_r6_task_focus_contract.php project_health_retry_action_contract.php; do
            if php "tests/unit/$name" >"$RUNNER_TEMP/p01-assert-output" 2>&1; then
              echo "DIAG_UNEXPECTED_PASS=$name"
            else
              count=$((count+1))
              echo "DIAG_FAIL_TEST=$name"
              grep -E '^(PHP Fatal error:|PROJECT_HEALTH_RETRY_ACTION_FAIL:|Fatal error:|Uncaught|Stack trace:)' "$RUNNER_TEMP/p01-assert-output" | head -n 3 || true
            fi
          done
          echo "P01_DIAGNOSTIC_FAIL_COUNT=$count"
          test "$count" -eq 8
      - name: Destroy transient private checkout
        if: always()
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/target" ]; then
            test "$(realpath "$GITHUB_WORKSPACE/target")" = "$GITHUB_WORKSPACE/target"
            rm -rf -- "$GITHUB_WORKSPACE/target"
          fi
