name: P01 V2.23 Develop Exact Source Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v223-develop-exact-source-gate-20260828.yml']
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SHA: a421248b38e2dcbf2fe2769cbddc1fcb899f4059
      SCHEMA: '2026082801'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Identity and cleanup
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/develop|awk '{print $1}')" = "$SHA"
          gh api --method DELETE repos/llhzx2018/vf-start/git/refs/heads/_noop >/dev/null 2>&1 || true
          echo P01_V223_DEVELOP_IDENTITY=PASS
      - name: Syntax and fresh runtime
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          rm -rf /tmp/p01-v223-dev /tmp/p01-v223-dev.cookies /tmp/p01-v223-admin.cookies
          cp -a src /tmp/p01-v223-dev; cd /tmp/p01-v223-dev
          php -S 127.0.0.1:18235 -t . >/tmp/p01-v223-dev.log 2>&1 & echo $! >/tmp/p01-v223-dev.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18235/setup.php -o /tmp/setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v223-dev.cookies -b /tmp/p01-v223-dev.cookies http://127.0.0.1:18235/setup.php -o /tmp/setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v223-dev.cookies -b /tmp/p01-v223-dev.cookies -X POST http://127.0.0.1:18235/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V223 Dev' --data-urlencode 'admin_password=P01V223!Develop' --data-urlencode 'admin_password_confirm=P01V223!Develop' >/tmp/setup-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | tee /tmp/surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/surface.txt; grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/surface.txt
          php cli/baseline-verify.php | tee /tmp/base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18235/api.php?action=login' --data '{"password":"P01V223!Develop"}' | jq -e '.ok==true' >/dev/null
          test "$(curl -sS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -o /dev/null -w '%{http_code}' http://127.0.0.1:18235/)" = 302
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18235/surfaces.php | grep -F 'vf-dashboard-columns' >/dev/null
          test "$(curl -sS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies -o /tmp/start.html -w '%{http_code}' http://127.0.0.1:18235/start.php)" = 200
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18235/channels.php | grep -F 'vf-app-sidebar' >/dev/null
          curl -fsS -c /tmp/p01-v223-admin.cookies -b /tmp/p01-v223-admin.cookies http://127.0.0.1:18235/watch.php | grep -F 'vf-app-sidebar' >/dev/null
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v223-dev.pid)" 2>/dev/null || true
          echo P01_V223_DEVELOP_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V223_DEVELOP_EXACT_SOURCE=$SHA
          echo P01_V223_DEVELOP_MACHINE=PASS
          echo PRODUCTION=NO
