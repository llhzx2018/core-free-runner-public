name: P04 V2.5.4 E2E Action Scope Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-action-scope-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scope primary action selectors to page header
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          repl={
            "const newProject = page.getByRole('button', { name: '新增项目' });":"const newProject = page.locator('#page-actions [data-action=\"new-project\"]');",
            "const newDomain = page.getByRole('button', { name: '新增域名' });":"const newDomain = page.locator('#page-actions [data-action=\"new-domain\"]');",
          }
          for old,new in repl.items():
            if s.count(old)!=1: raise SystemExit(f'action selector sentinel mismatch: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): scope V2.5.4 primary action selectors'
          git push origin HEAD:main
