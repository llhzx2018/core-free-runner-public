name: TEMP S01-C02 Ops 1.21.810 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121810-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPO: llhzx2018/vf-tools-ops
      SHA: f07006b4314f77365994a1cb34f8fa5009ed9205
      VERSION: 1.21.810
      TAG: v1.21.810
      ASSET: vf-tools-ops_V1.21.810.zip
      EXPECTED_BYTES: '3215361'
      EXPECTED_SHA256: a66784f6c0a95c102932a0d42344a38f585ac14b4eca68d75015ec8161b7ae70
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f07006b4314f77365994a1cb34f8fa5009ed9205
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Rebuild exact release asset
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$SHA"
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in sorted(files.items()):
                  i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          assert z.stat().st_size==int(os.environ['EXPECTED_BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest()==os.environ['EXPECTED_SHA256']
          PY
      - name: Create formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS; exit 1; fi
          gh release create "$TAG" "/tmp/release/$ASSET" --repo "$REPO" --target "$SHA" --title "$TAG" --notes "S01-C02 VF Tools Ops 1.21.810 — Static Source Pointer Recovery. Candidate Gate 33922352340 PASS. Recovers only a trusted, SHA-matched completed inspect_only source after a terminal failed candidate loses its source pointer. No new Simply Static upload; no M3U8/content/plugin/Seed HOLD/DNS mutation; Production activation is not performed by this Release."
          gh release view "$TAG" --repo "$REPO" --json tagName,targetCommitish,isDraft,isPrerelease | jq -e --arg t "$TAG" --arg s "$SHA" '.tagName==$t and .targetCommitish==$s and (.isDraft|not) and (.isPrerelease|not)' >/dev/null
          echo FORMAL_RELEASE=PASS
