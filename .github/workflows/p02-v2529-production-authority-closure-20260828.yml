name: P02 V2.5.29 Production Authority Closure
on:
  push:
    branches: [task/p02-v2529-production-closure-20260828]
    paths: ['.github/workflows/p02-v2529-production-authority-closure-20260828.yml']
permissions: {contents: read}
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P02 closure branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: closure/v2.5.29-production-20260828
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product
      - name: Patch dynamic production authority only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = e02551fc21a8dfab2d08b77eac0a3eb383cecc62
          git fetch origin main
          test "$(git rev-parse origin/main)" = e02551fc21a8dfab2d08b77eac0a3eb383cecc62
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P02'
          assert d['production_truth']['current_version']=='2.5.28'
          d['status']='V2.5.29_PRODUCTION_VERIFIED_CLOSED'
          d['as_of']='2026-08-28T06:32:00+08:00'
          d['production_truth'].update({
            'current_version':'2.5.29','latest_version':'2.5.29','current_schema':2401,
            'evidence':'OWNER_AUTHENTICATED_SYSTEM_UPDATE_SCREENSHOT_2026_08_28_0632',
            'evidence_observed_at':'2026-08-28T06:32:00+08:00','update_status':'UP_TO_DATE',
            'authenticated_admin_session':'PASS','application_shell':'PASS',
            'system_update_page':'PASS_CURRENT_EQUALS_LATEST_V2.5.29',
            'version_footer':'PASS_V2.5.29','upgrade_executor':'OWNER','production_write_by_agent':'NO'})
          d['formal_product_source'].update({
            'version':'2.5.29','source_commit':'387655e222c1fed0b6e4559b66d254dba5d3c8e4',
            'source_tree':'aac3c6d27a33dbbf9f036720c0f2b66d6dbae5f5','source_manifest_runtime_files':81,
            'source_exact':'PASS','schema':2401,'migration':False,'tag':'v2.5.29'})
          d['candidate_verification']={
