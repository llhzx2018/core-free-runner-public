          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'authority(P02): close V2.5.29 production'
          git push origin HEAD:closure/v2.5.29-production-20260828
          echo P02_V2529_PRODUCTION_AUTHORITY_WRITE=PASS
