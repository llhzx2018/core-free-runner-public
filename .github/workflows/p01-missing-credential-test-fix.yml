name: P01 Missing Credential Test Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-missing-credential-test-fix.yml'
      - 'requests/p01-missing-credential-test-fix-*.txt'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace only invalid injected-transport credential test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p01-formal-candidate-gates-v2.sh')
          s=p.read_text(encoding='utf-8')
          start=s.index('# Missing credential is fail-closed in the real P01 adapter.')
          end=s.index("echo 'P01_V2.21.15_FORMAL_CANDIDATE_V2=PASS'", start)
          new=r'''# Missing credential must fail closed on the real adapter path: no transport callback,
# no fake discovery capability and no network request is allowed before the credential gate.
cat >/tmp/p01-missing-credential-test.php <<'PHP'
<?php
declare(strict_types=1);
require '/tmp/p01-fresh/app/bootstrap.php';
putenv('VF_PRIVATE_READ_TOKEN');
$u=new VfUpdateManager(vf_db());
$r=$u->check(false);
$s=$u->status();
$encoded=json_encode([$r,$s],JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
if(($r['ok']??true)!==false || ($s['credential_configured']??true)!==false || strpos((string)$encoded,'VF_PRIVATE_READ_TOKEN')===false){fwrite(STDERR,(string)$encoded);exit(1);}echo "MISSING_CREDENTIAL_FAIL_CLOSED=PASS\n";
PHP
php /tmp/p01-missing-credential-test.php

'''
          p.write_text(s[:start]+new+s[end:],encoding='utf-8',newline='\n')
          PY
          bash -n scripts/p01-formal-candidate-gates-v2.sh
          grep -Fq "new VfUpdateManager(vf_db());" scripts/p01-formal-candidate-gates-v2.sh
          if grep -Fq "manifest_fetcher" scripts/p01-formal-candidate-gates-v2.sh; then
            echo 'Invalid injected transport remains in missing credential test.' >&2
            exit 1
          fi
          echo 'MISSING_CREDENTIAL_TEST_FIX=PASS'

      - name: Commit test-only correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add scripts/p01-formal-candidate-gates-v2.sh
          git diff --cached --check
          git commit -m 'test(p01): verify missing credential on real adapter path'
          git push origin HEAD:main
          echo "TEST_FIX_COMMIT=$(git rev-parse HEAD)"
