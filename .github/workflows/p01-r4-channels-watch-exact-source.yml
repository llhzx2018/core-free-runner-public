name: P01 R4 Channels and Watch atomic frontstage exact-source regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r4-channels-watch-exact-source.yml'
permissions:
  contents: read
jobs:
  p01-r4-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: d65d3744e0f0ad189f06c8f5d7f76ac3d012d6f9
      BASELINE_SHA: a1df560fcb0815accad15f9a5320e3c562590509
    steps:
      - name: Prepare PHP, SQLite and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Fetch pinned private sources into ephemeral runner only
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'BLOCKED_SECRET_MISSING'; exit 11; }
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git init -q stable
          git -C stable remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C stable -c advice.detachedHead=false fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C stable rev-parse HEAD)" = "$BASELINE_SHA"
          git -C candidate remote remove origin
          git -C stable remote remove origin
          echo P01_R4_EXACT_SOURCE_CHECKOUT=PASS
      - name: Focused R4 syntax, lifecycle, atomic attachment, privacy contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.444"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "2.47.444"
          for p in src/app/SubjectPageChrome.php src/app/ChannelLibraryPage.php src/app/WatchMediaLibraryPage.php src/app/SurfaceShell.php src/workspace-create.php src/workspace-save.php tests/unit/p01_ia_v2_r4_channels_watch_frontstage_contract.php tests/unit/workspace_atomic_form_routing_contract.php tests/unit/attachment_error_visibility_contract.php; do php -l "$p" >/dev/null; done
          php tests/unit/p01_ia_v2_r4_channels_watch_frontstage_contract.php
          php tests/unit/workspace_atomic_form_routing_contract.php
          php tests/unit/attachment_error_visibility_contract.php
          php tests/unit/watch_card_action_hierarchy_contract.php
          php tests/unit/channel_card_action_hierarchy_contract.php
          php tests/unit/watch_public_privacy_density_v247390_contract.php
          php tests/unit/p01_r2_frontstage_panel_lifecycle_contract.php
          node --check src/assets/workspace.js
          node --check src/assets/frontstage-panel-controller.js
          node tests/unit/p01_r2_frontstage_panel_behavior.cjs
          echo P01_R4_FOCUSED_CONTRACT=PASS
      - name: Synthetic owner and guest HTTP plus real atomic cover and status mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src
          php -S 127.0.0.1:18484 -t . >/tmp/p01-r4-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-r4-cookies -b /tmp/p01-r4-cookies http://127.0.0.1:18484/setup.php -o /tmp/p01-r4-setup.html; then break; fi
            sleep 1
          done
          setup_csrf=$(python3 -c 'import re; s=open("/tmp/p01-r4-setup.html").read(); m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",s); assert m; print(m.group(1))')
          curl -fsS -c /tmp/p01-r4-cookies -b /tmp/p01-r4-cookies -X POST http://127.0.0.1:18484/setup.php \
            --data-urlencode "setup_csrf=$setup_csrf" \
            --data-urlencode 'site_title=P01 R4 Synthetic Gate' \
            --data-urlencode 'admin_password=R4!Synthetic18484' \
            --data-urlencode 'admin_password_confirm=R4!Synthetic18484' \
            -o /tmp/p01-r4-setup-post.html
          curl -fsS http://127.0.0.1:18484/channels.php -o /tmp/p01-r4-guest-channels.html
          curl -fsS http://127.0.0.1:18484/watch.php -o /tmp/p01-r4-guest-watch.html
          ! grep -Fq 'file=frontstage-panel-controller.js' /tmp/p01-r4-guest-channels.html
          ! grep -Fq 'file=frontstage-panel-controller.js' /tmp/p01-r4-guest-watch.html
          ! grep -Fq 'id="vf-workspace-data"' /tmp/p01-r4-guest-watch.html
          guest_create=$(curl -sS -o /tmp/p01-r4-guest-create.json -w '%{http_code}' -d 'title=GuestWrite&surface=watch' http://127.0.0.1:18484/workspace-create.php)
          test "$guest_create" = 401
          curl -fsS -c /tmp/p01-r4-cookies -b /tmp/p01-r4-cookies \
            -H 'Content-Type: application/json' -d '{"password":"R4!Synthetic18484"}' \
            'http://127.0.0.1:18484/api.php?action=login' -o /tmp/p01-r4-login.json
          grep -Fq '"ok":true' /tmp/p01-r4-login.json
          curl -fsS -b /tmp/p01-r4-cookies 'http://127.0.0.1:18484/channels.php' -o /tmp/p01-r4-owner-channels.html
          curl -fsS -b /tmp/p01-r4-cookies 'http://127.0.0.1:18484/watch.php' -o /tmp/p01-r4-owner-watch.html
          grep -Fq 'file=frontstage-panel-controller.js' /tmp/p01-r4-owner-channels.html
          grep -Fq 'file=frontstage-panel-controller.js' /tmp/p01-r4-owner-watch.html
          grep -Fq 'file=frontstage-panels.css' /tmp/p01-r4-owner-channels.html
          grep -Fq 'data-detail-form' /tmp/p01-r4-owner-watch.html
          csrf=$(python3 -c 'import re,json,html; s=open("/tmp/p01-r4-owner-channels.html").read(); m=re.search(r"<script type=\"application/json\" id=\"vf-workspace-data\">(.*?)</script>",s,re.S); assert m,"owner csrf JSON"; print(json.loads(html.unescape(m.group(1)))["csrf"])')
          bad_csrf=$(curl -sS -o /tmp/p01-r4-badcsrf.json -w '%{http_code}' -b /tmp/p01-r4-cookies -d 'csrf=wrong' -d 'surface=watch' http://127.0.0.1:18484/workspace-create.php)
          test "$bad_csrf" = 419
          curl -fsS -b /tmp/p01-r4-cookies -d "csrf=$csrf" -d 'surface=channels' -d 'title=R4 Synthetic Channel' -d 'url=https://example.com/r4-channel' -d 'source_kind=remote_url' -d 'background_friendly=1' -d 'is_private=1' http://127.0.0.1:18484/workspace-create.php -o /tmp/p01-r4-channel-create.json
          channel_id=$(python3 -c 'import json; r=json.load(open("/tmp/p01-r4-channel-create.json")); assert r.get("ok"),r; print(r["id"])')
          curl -fsS -b /tmp/p01-r4-cookies -d "csrf=$csrf" -d 'surface=watch' -d 'title=R4 Synthetic Film' -d 'url=https://example.com/r4-film' -d 'source_kind=remote_url' -d 'media_status=want' -d 'is_private=1' http://127.0.0.1:18484/workspace-create.php -o /tmp/p01-r4-watch-create.json
          watch_id=$(python3 -c 'import json; r=json.load(open("/tmp/p01-r4-watch-create.json")); assert r.get("ok"),r; print(r["id"])')
          curl -fsS -b /tmp/p01-r4-cookies -d "csrf=$csrf" -d "id=$watch_id" -d 'surface=watch' -d 'media_status=watched' http://127.0.0.1:18484/workspace-save.php -o /tmp/p01-r4-watch-save.json
          grep -Fq '"ok":true' /tmp/p01-r4-watch-save.json
          php -r 'require "app/bootstrap.php";$db=vf_db();$a=$db->query("SELECT COUNT(*) FROM resource_domain_profiles WHERE domain_key=\"channels\" AND background_friendly=1")->fetchColumn();$b=$db->query("SELECT COUNT(*) FROM resource_domain_profiles WHERE domain_key=\"watch\" AND media_status=\"watched\"")->fetchColumn();if($a<1||$b<1)exit(32);echo "P01_R4_REAL_STATUS_PERSISTENCE=PASS\n";'
          php -r '$i=imagecreatetruecolor(96,96);$c=imagecolorallocate($i,18,164,107);imagefill($i,0,0,$c);imagepng($i,"/tmp/p01-r4-cover.png");imagedestroy($i);'
          curl -fsS -b /tmp/p01-r4-cookies -F "csrf=$csrf" -F "id=$watch_id" -F 'surface=watch' -F 'cover=@/tmp/p01-r4-cover.png;type=image/png' http://127.0.0.1:18484/workspace-save.php -o /tmp/p01-r4-cover-save.json
          echo "P01_R4_COVER_SAVE_REPLY=$(head -c 300 /tmp/p01-r4-cover-save.json)"
          grep -Fq '"ok":true' /tmp/p01-r4-cover-save.json
          echo P01_R4_COVER_JSON_OK
          echo "P01_R4_COVER_ROW_COUNT=$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")"
          test "$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")" = 1
          echo 'bad attachment' >/tmp/p01-r4-invalid.png
          bad_file=$(curl -sS -b /tmp/p01-r4-cookies -o /tmp/p01-r4-invalid-response.json -w '%{http_code}' -F "csrf=$csrf" -F "id=$watch_id" -F 'surface=watch' -F 'title=INVALID SHOULD ROLLBACK' -F 'cover=@/tmp/p01-r4-invalid.png;type=image/png' http://127.0.0.1:18484/workspace-save.php)
          echo "P01_R4_INVALID_UPLOAD_STATUS=$bad_file"
          test "$bad_file" = 422
          echo "P01_R4_INVALID_UPLOAD_ROW_COUNT=$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")"
          test "$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")" = 1
          curl -fsS -b /tmp/p01-r4-cookies -d "csrf=$csrf" -d "id=$watch_id" -d 'surface=watch' -d 'remove_cover=1' http://127.0.0.1:18484/workspace-save.php -o /tmp/p01-r4-cover-delete.json
          echo "P01_R4_COVER_DELETE_REPLY=$(head -c 300 /tmp/p01-r4-cover-delete.json)"
          grep -Fq '"ok":true' /tmp/p01-r4-cover-delete.json
          echo "P01_R4_COVER_DELETE_ROW_COUNT=$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")"
          test "$(php -r 'require "app/bootstrap.php";$q=vf_db()->prepare("SELECT COUNT(*) FROM resource_asset_files WHERE link_id=? AND asset_kind=?");$q->execute([(int)$argv[1],"cover"]);echo $q->fetchColumn();' "$watch_id")" = 0
          curl -fsS -b /tmp/p01-r4-cookies 'http://127.0.0.1:18484/channels.php?view=list' -o /tmp/p01-r4-channel-card.html
          curl -fsS -b /tmp/p01-r4-cookies http://127.0.0.1:18484/watch.php -o /tmp/p01-r4-watch-card.html
          echo "P01_R4_RENDER_COUNTS channel_asset=$(grep -Fc 'R4 Synthetic Channel' /tmp/p01-r4-channel-card.html || true) channel_action=$(grep -Fc 'data-focus-field="background_friendly"' /tmp/p01-r4-channel-card.html || true) watch_asset=$(grep -Fc 'R4 Synthetic Film' /tmp/p01-r4-watch-card.html || true) watch_cover=$(grep -Fc 'data-focus-field="cover"' /tmp/p01-r4-watch-card.html || true) watch_status=$(grep -Fc 'data-focus-field="media_status"' /tmp/p01-r4-watch-card.html || true) watch_watched=$(grep -Fc '看过' /tmp/p01-r4-watch-card.html || true)"
          grep -Fq 'data-focus-field="background_friendly"' /tmp/p01-r4-channel-card.html
          grep -Fq 'data-focus-field="cover"' /tmp/p01-r4-watch-card.html
          grep -Fq 'data-focus-field="media_status"' /tmp/p01-r4-watch-card.html
          grep -Fq '看过' /tmp/p01-r4-watch-card.html
          ! grep -Fq 'R4 Synthetic Film' /tmp/p01-r4-guest-watch.html
          echo P01_R4_OWNER_GUEST_ATOMIC_CRUD_COVER_ROLLBACK=PASS
      - name: Canonical full unit regression against current main baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R4_CANONICAL_REGRESSION=PASS
      - name: Verify private source never persists in public runner
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R4_PRIVATE_SOURCE_CLEANUP=PASS
