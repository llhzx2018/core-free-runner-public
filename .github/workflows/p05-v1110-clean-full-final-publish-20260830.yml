name: P05 V1.1.10 Clean FULL Final Publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_MAIN_SOURCE: 5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00
      P05_VERIFIED_TREE: 9d653d36c51e87420b4f9932e777294ca4d300a8
      P05_EXACT_SOURCE: c4fe3d5cf49fd33d0214f58244ccc112279944a5
      P05_FINAL_GATE_RUN: 33318245543
      P05_FINAL_GATE_JOB: 99275513101
      VERSION: 1.1.10
      ASSET: VF_SEO_V1.1.10_FULL.zip
      RECEIPT: VF_SEO_V1.1.10_RELEASE_RECEIPT.txt
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05
      - name: Verify exact main and tree-equivalent promotion
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(git rev-parse "$P05_EXACT_SOURCE^{tree}")" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json'), v=require('./VF_PROJECT.json');
          const x=process.env.VERSION;
          if(p.version!==x||l.version!==x||l.packages[''].version!==x) process.exit(1);
          if(v.version!==x||v.target_version!==x||v.working_version!==x) process.exit(1);
          if(v.production_deployment!=='NOT_DEPLOYED'||v.production_write!==0) process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e .vf-seo-site-instance.json
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Complete engineering release-source and security regression
        working-directory: p05
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
      - name: PHP compatibility and pointer-bound CLI regression
        working-directory: p05
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -euo pipefail
          php -v
          php -r 'if (!extension_loaded("pdo_sqlite")) { fwrite(STDERR,"missing php extension: pdo_sqlite\n"); exit(1); }'
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e php/src/FreshInstallRecovery.php
      - name: Build formal test staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.vf-seo-site-instance.json"
          test -z "$(find "$S" \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' \) -print -quit)"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          find "$S" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/test-staging-before.sha
      - name: Browser pointer dirty-state CLI and Chrome regression
        working-directory: p05
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
      - name: Prove formal test staging remained byte-identical
        working-directory: p05
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          find "$S" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/test-staging-after.sha
          cmp /tmp/test-staging-before.sha /tmp/test-staging-after.sha
      - name: Rebuild pristine release staging after all tests
        working-directory: p05
        run: |
          set -euo pipefail
          S=build/vf-seo-php-release
          rm -rf "$S" dist/client
          npm run build:php-release
          npm run php:release:gate
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.vf-seo-site-instance.json"
          test ! -e "$S/.env"
          test ! -e "$S/php/src/FreshInstallRecovery.php"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -iname '*.wal' -o -iname '*.shm' \) | grep -q .; then
            echo 'runtime database leaked into release staging' >&2
            exit 1
          fi
          if find "$S" -type f \( -name 'setup.lock.json' -o -name 'runtime.env' -o -name 'VF_INSTALL_INSTANCE.json' -o -name '.vf-seo-site-instance.json' \) | grep -q .; then
            echo 'runtime pointer/config leaked into release staging' >&2
            exit 1
          fi
          find "$S" -type f | sort > /tmp/release-staging-files.txt
          while IFS= read -r file; do sha256sum "$file"; done < /tmp/release-staging-files.txt > /tmp/release-staging.sha
      - name: Deterministic pristine FULL build
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release')
          asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0))
                      mode=p.stat().st_mode & 0o777
                      info.external_attr=(mode & 0xFFFF) << 16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a')
          build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"
          rm "../$ASSET.b"
          python3 - <<'PY'
          from zipfile import ZipFile
          import os
          asset='../'+os.environ['ASSET']
          forbidden={'VF_INSTALL_INSTANCE.json','.vf-seo-site-instance.json','.env'}
          with ZipFile(asset) as z:
              names=z.namelist()
              assert not forbidden.intersection(names), forbidden.intersection(names)
              assert not any(n.endswith(('.sqlite','.sqlite3','.db','.wal','.shm')) for n in names)
              assert not any(n.endswith('/setup.lock.json') or n.endswith('/runtime.env') for n in names)
              assert 'php/src/FreshInstallRecovery.php' not in names
          print('P05_FINAL_ZIP_RUNTIME_MARKERS=ABSENT')
          PY
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c '%s' "../$ASSET")"
          files="$(find build/vf-seo-php-release -type f | wc -l | tr -d ' ')"
          zip_files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          test "$files" = "$zip_files"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_EXACT_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nINSTALL_IDENTITY_AUTHORITY=WEBROOT_RUNTIME_POINTER\nPOINTERLESS_CLI_FAIL_CLOSED=PASS\nPOINTER_BOUND_CLI_MAINTENANCE=PASS\nCLOUDPANEL_ROOT_STAGING_PRISTINE=PASS\nDIRTY_STATE_FULL_DELETE_REINSTALL=PASS\nFORMAL_TEST_STAGING_IMMUTABLE=PASS\nPOST_TEST_PRISTINE_REBUILD=PASS\nCHROME_E2E=PASS\nPRIVATE_CI=BLOCKED_INFRA_RUNNER_ID_0\nPRODUCTION=NOT_DEPLOYED\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_EXACT_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd p05
          test -f "../$ASSET"
          test -f "../$RECEIPT"
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo llhzx2018/vf-seo \
            --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.1.10 · Runtime Pointer Contract Closure' \
            --notes 'V1.1.10 closes the fresh-install and runtime-identity model around a single webroot Runtime Pointer. A missing pointer is always a fresh install; historical HOME state and process storage-path environment variables cannot silently adopt old data. Browser Setup creates private sibling storage and commits the pointer only after successful initialization. CLI maintenance is pointer-bound and fails closed before installation. CloudPanel root tests now initialize only isolated copies, preserving formal release staging byte-for-byte. The final FULL is rebuilt from exact main after all tests and contains no runtime pointer, database, setup lock, runtime.env, or historical recovery helper. Public Exact Source Gate passed; private CI was BLOCKED_INFRA because no runner was assigned. Production remains NOT_DEPLOYED.' \
            "../$ASSET" "../$RECEIPT"
      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          assets={a['name']:a for a in r['assets']}
          a=assets[os.environ['ASSET']]
          receipt=assets[os.environ['RECEIPT']]
          assert int(a['size'])==int(os.environ['P05_BYTES'])
          digest=a.get('digest')
          if digest is not None:
              assert digest=='sha256:'+os.environ['P05_SHA256'], (digest,os.environ['P05_SHA256'])
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_ASSET_ID='+str(a['id']))
          print('P05_RECEIPT_ASSET_ID='+str(receipt['id']))
          print('P05_REMOTE_DIGEST='+str(digest))
          print('P05_V1110_RELEASE_REMOTE_READBACK=PASS')
          PY
      - name: Machine receipt
        run: |
          echo 'P05_V1110_FORMAL_RELEASE=PASS'
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo "P05_VERIFIED_TREE=$P05_VERIFIED_TREE"
          echo "P05_FILES=$P05_FILES"
          echo "P05_BYTES=$P05_BYTES"
          echo "P05_SHA256=$P05_SHA256"
          echo 'POINTERLESS_CLI_FAIL_CLOSED=PASS'
          echo 'POINTER_BOUND_CLI_MAINTENANCE=PASS'
          echo 'CLOUDPANEL_ROOT_STAGING_PRISTINE=PASS'
          echo 'DIRTY_STATE_REINSTALL=PASS'
          echo 'FORMAL_TEST_STAGING_IMMUTABLE=PASS'
          echo 'POST_TEST_PRISTINE_REBUILD=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'PRIVATE_CI=BLOCKED_INFRA_RUNNER_ID_0'
          echo 'PRODUCTION_WRITE=0'
