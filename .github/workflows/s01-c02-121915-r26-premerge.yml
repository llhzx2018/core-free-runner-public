name: S01-C02 1.21.915 R26 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: 43ebf2cba6b2f9040e185041f322c961b1494eee
      BASE_SHA: d2fec6cd857f744642f48090b40b650fb11c2ca2

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 43ebf2cba6b2f9040e185041f322c961b1494eee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact R26 scope and contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.915"
          grep -Fq 'Version: 1.21.915' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.915'" ops/vf-ops.php
          grep -Fq 'S01-FINAL-UXUI-CLOSURE-R26' ops/vf-ops.php
          php ops/tests/s01-c02-121915-final-uxui-r26-contract.php
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121915-final-uxui-r26-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          shell=Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8')
          dash=Path('ops/assets/css/current/admin-s01-dashboard-r14.css').read_text(encoding='utf-8')
          quality=Path('ops/assets/css/current/admin-s01-quality-r17.css').read_text(encoding='utf-8')

          for s,name in [(shell,'shell'),(dash,'dashboard'),(quality,'quality')]:
              assert s.count('{')==s.count('}'), name

          for needle in [
              '.vf-v6-domain-nav > a.is-current:hover',
              '.vf-v6-domain-nav > a.is-current:focus-visible',
              'background:transparent!important',
          ]:
              assert needle in shell, needle

          for s,name in [(dash,'dashboard'),(quality,'quality')]:
              for needle in [
                  'R26 · Final Page Header state normalization',
                  'border:0!important',
                  'border-radius:0!important',
                  'background:transparent!important',
                  'box-shadow:none!important',
                  'var(--vf-v6-header-state-dot)',
              ]:
                  assert needle in s, f'{name}: {needle}'

          # Preserve prior R21 single-shell invariant for current page authorities.
          page_files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
          ]
          forbidden=[
            '.vf-ops-v6-shell','.vf-v6-shell-header','.vf-v6-domain-nav',
            '.vf-v6-domain-mobile','.vf-v6-brand-mark','.vf-v6-brand-copy',
            '.vf-v8-current-domain',
          ]
          # R26 intentionally references .vf-ops-v6-shell only as a high-specificity parent
          # in Dashboard/Quality. Other global shell selectors remain forbidden.
          for name in page_files:
              s=(Path('ops/assets/css/current')/name).read_text(encoding='utf-8')
              for needle in forbidden[1:]:
                  assert needle not in s, f'{name} reintroduced shell ownership: {needle}'
          print('PASS_R26_FINAL_UXUI')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"
          echo PASS_S01_C02_121915_R26_PREMERGE
