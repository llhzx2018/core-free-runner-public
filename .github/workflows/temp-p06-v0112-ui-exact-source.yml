name: P06 V0.1.12 Whole-Site UI Exact Source Gate

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-v0112-ui-exact-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v0112-ui-exact-source
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: bb43964adbb85f1a50c6deb7875fb3a4587df3b5
      SOURCE_TREE: 8988af9ada7806a93a9c30cf15ecd86fedbb6212
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.12'
          test "$(jq -r .version VF_PROJECT.json)" = '0.1.12'
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .lifecycle VF_PROJECT.json)" = 'CANDIDATE'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'WHOLE_SITE_UI_REDEVELOPMENT_V0_1_12_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'WHOLE_SITE_UI_REDEVELOPMENT_V0_1_12_EXACT_SOURCE'
          test "$(jq -r .release_gates.owner_formal_release_approval VF_PROJECT.json)" = 'PASS'
          test "$(jq -r .release_gates.owner_real_use_after_production_update VF_PROJECT.json)" = 'FAIL_V0_1_11_WHOLE_SITE_UI_NOT_MATERIALLY_REFOUND'
          grep -Fq 'OWNER Real Use V0.1.11 | FAIL' docs/authority/ACCEPTANCE_MATRIX.md
          echo SOURCE_IDENTITY=PASS
          echo AUTHORITY_DRIFT_GATE=PASS
          echo SCHEMA_MIGRATION=NOT_REQUIRED
          echo PRODUCTION_WRITE=0

      - name: Composer PHP and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | tee /tmp/p06-markdown
          grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS /tmp/p06-markdown
          grep -Fq CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-markdown
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/reader-ux-self-test.php | grep -Fq READER_UX_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/whole-site-refoundation-self-test.php | grep -Fq WHOLE_SITE_REFOUNDATION_SELF_TEST=PASS
          php bin/whole-site-ui-redevelopment-self-test.php | tee /tmp/p06-ui
          grep -Fq WHOLE_SITE_UI_REDEVELOPMENT_SELF_TEST=PASS /tmp/p06-ui
          grep -Fq UNIFIED_LIBRARY_AND_BOOK_WORKSPACE=PASS /tmp/p06-ui
          grep -Fq BRIEF_OUTLINE_SEPARATION=PASS /tmp/p06-ui
          grep -Fq MANUSCRIPT_FOCUS_COMPOSITION=PASS /tmp/p06-ui
          grep -Fq READER_DESKTOP_MOBILE_CONTINUITY=PASS /tmp/p06-ui
          php bin/book-outline-self-test.php | tee /tmp/p06-outline
          grep -Fq OWNER_ACCEPT_REJECT=PASS /tmp/p06-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-outline
          php bin/demo-data-self-test.php | grep -Fq DEMO_DATA_SELF_TEST=PASS
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3);'
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo SQLITE_INTEGRITY=PASS
          echo SCHEMA=3_PASS

      - name: Whole-site UI replacement contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'class="ops-nav-label"' src/Http/Studio/AdminShell.php
          grep -Fq 'class="ops-owner-chip"' src/Http/Studio/AdminShell.php
          grep -Fq 'ops-book-context' src/Http/Studio/AdminShell.php
          grep -Fq '?tab=brief' src/Http/Studio/BookController.php
          grep -Fq '?tab=outline' src/Http/Studio/BookController.php
          ! grep -Fq '?tab=plan#brief' src/Http/Studio/BookController.php
          grep -Fq 'grid-template-columns:264px minmax(0,1fr)' public/assets/manuscript.css
          grep -Fq 'class="reader-desktop-toc"' src/Http/Preview/PublisherReaderPreviewController.php
          grep -Fq 'reader-font-19 reader-line-185 reader-width-700' src/Http/Preview/PublisherReaderPreviewController.php
          ! grep -Fq 'Whole-Site Refoundation V1' public/assets/operations.css
          ! grep -Fq 'legacy center-specific layouts cannot' public/assets/operations.css
          grep -Fq 'AI 候选不会覆盖已接受的 Canonical Markdown' src/Http/Studio/BookController.php
          echo LEGACY_ACCUMULATED_CSS_REMOVED=PASS
          echo LIBRARY_AND_BOOK_WORKSPACE_SHELL=PASS
          echo BRIEF_AND_OUTLINE_SEPARATE=PASS
          echo MANUSCRIPT_TWO_COLUMN_FOCUS=PASS
          echo READER_LONG_FORM_LAYOUT=PASS
          echo CANONICAL_CANDIDATE_ISOLATION=PASS

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_DATA_PERSISTED=NO
          echo FORMAL_RELEASE=NOT_EXECUTED
          echo PRODUCTION_WRITE=NOT_EXECUTED
