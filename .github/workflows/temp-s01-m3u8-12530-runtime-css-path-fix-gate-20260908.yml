name: temp-s01-m3u8-12530-runtime-css-path-fix-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-runtime-css-path-fix-gate-20260908.yml
permissions:
  contents: read
jobs:
  fix-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: work/s01-m3u8-12530-runtime-css-path-fix-20260908
      BASE_SHA: 8f2b64914cc670e78a9357552b2c084d5de3210e
    steps:
      - name: Move dashboard rules into canonical runtime CSS owner and gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'CORRECTION_MODE=CANDIDATE_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_WRITE_USED=NO'
          rm -rf /tmp/m3u8-fix "$RUNNER_TEMP/m3u8-fix-zip"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-fix
          git -C /tmp/m3u8-fix checkout -q "$BRANCH"
          test "$(git -C /tmp/m3u8-fix rev-parse HEAD)" = "$BASE_SHA"
          cd /tmp/m3u8-fix
          test "$(tr -d '\r\n' < VERSION)" = '1.25.30'
          test -s admin/ui-v4/phase4-component-workspace.css
          test -s src/admin/ui-v4/phase4-component-workspace.css
          grep -F '.vf-m3u8-v6-dashboard__hero' admin/ui-v4/phase4-component-workspace.css >/dev/null
          if grep -F '.vf-m3u8-v6-dashboard__hero' src/admin/ui-v4/phase4-component-workspace.css >/dev/null; then echo 'dashboard rules already present in runtime CSS unexpectedly' >&2; exit 1; fi
          printf '\n\n/* S01 1.25.30 Provider Dashboard visible UX closure. */\n' >> src/admin/ui-v4/phase4-component-workspace.css
          cat admin/ui-v4/phase4-component-workspace.css >> src/admin/ui-v4/phase4-component-workspace.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/provider-dashboard-visible-ui-contract.php')
          s=p.read_text()
          old="$repo.'/admin/ui-v4/phase4-component-workspace.css'"
          new="$repo.'/src/admin/ui-v4/phase4-component-workspace.css'"
          if old not in s: raise SystemExit('old test CSS path missing')
          p.write_text(s.replace(old,new,1))
          PY
          git rm admin/ui-v4/phase4-component-workspace.css
          php -l tests/provider-dashboard-visible-ui-contract.php >/dev/null
          php -l src/admin/Controller/class-v6-provider-operations-controller.php >/dev/null
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          for f in tests/unit/*.php; do php "$f"; done
          grep -F "'file'=>'admin/ui-v4/phase4-component-workspace.css'" src/admin/ui-v4/admin-ui-assets.php >/dev/null
          grep -F '.vf-m3u8-v6-dashboard__hero' src/admin/ui-v4/phase4-component-workspace.css >/dev/null
          test ! -e admin/ui-v4/phase4-component-workspace.css
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'admin/ui-v4/phase4-component-workspace.css src/admin/ui-v4/phase4-component-workspace.css tests/provider-dashboard-visible-ui-contract.php '
          git diff --exit-code -- VERSION src/vf-tool-m3u8.php src/config src/database src/migrations docs/authority/CURRENT.md
          mkdir -p "$RUNNER_TEMP/m3u8-fix-zip"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,os
          root=Path('src'); out=Path(os.environ['RUNNER_TEMP'])/'m3u8-fix-zip'/'vf-tools-m3u8_V1.25.30.zip'
          rows=sorted([(p.relative_to(root).as_posix(),p.read_bytes()) for p in root.rglob('*') if p.is_file()],key=lambda x:x[0])
          assert len(rows)==561, len(rows)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              dirs={'vf-tool-m3u8/'}
              for rel,_ in rows:
                  cur='vf-tool-m3u8'
                  for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
              for d in sorted(dirs):
                  zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
              for rel,data in rows:
                  zi=zipfile.ZipInfo('vf-tool-m3u8/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
          with zipfile.ZipFile(out) as z:
              names=set(z.namelist())
              assert 'vf-tool-m3u8/vf-tool-m3u8.php' in names
              assert 'vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css' in names
              css=z.read('vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css')
              assert b'.vf-m3u8-v6-dashboard__hero' in css
              assert z.testzip() is None
          print('RUNTIME_FILES='+str(len(rows)))
          print('PACKAGE_VISIBLE_DASHBOARD_CSS=PASS')
          PY
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/admin/ui-v4/phase4-component-workspace.css tests/provider-dashboard-visible-ui-contract.php
          git commit -m 'fix(S01): package M3U8 Provider dashboard visible CSS'
          fixed="$(git rev-parse HEAD)"
          git push -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "FIXED_CANDIDATE_SHA=$fixed"
          echo 'VERSION=1.25.30 RUNTIME_FILES=561'
          echo 'SCHEMA_LOCATOR_MIGRATION_BOUNDARY=UNCHANGED'
          echo 'PASS_S01_C03_M3U8_12530_RUNTIME_CSS_PATH_FIX_GATE'
