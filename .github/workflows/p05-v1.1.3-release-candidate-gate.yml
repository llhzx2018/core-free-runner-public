name: P05 V1.1.3 Release Candidate Gate

on:
  push:
    branches:
      - gate/p05-v113-login-repair-20260830
    paths:
      - '.github/workflows/p05-v1.1.3-release-candidate-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SHA: 22d3df51a26203d40e94908684a081353530f6dd
      P05_VERSION: 1.1.3
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$P05_VERSION"
          test "$(jq -r .version package.json)" = "$P05_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .target_version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .working_version VF_PROJECT.json)" = "$P05_VERSION"
          echo P05_V113_IDENTITY=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Full regression and security gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo P05_V113_NODE=PASS

      - name: PHP login compatibility gate
        shell: bash
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SQLITE_PATH: /tmp/vf-seo-v113-candidate.sqlite3
          VF_BACKUP_DIR: /tmp/vf-seo-v113-candidate-backups
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -euo pipefail
          npm run php:lint
          rm -f "$VF_SQLITE_PATH" "$VF_SQLITE_PATH-wal" "$VF_SQLITE_PATH-shm"
          rm -rf "$VF_BACKUP_DIR"
          php php/bin/migrate.php
          php php/bin/bootstrap-admin.php
          bash php/tests/http-smoke.sh
          bash php/tests/login-session-compat-smoke.sh
          echo P05_V113_LOGIN_COMPAT=PASS

      - name: Clean FULL browser-first regression
        shell: bash
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_EXACT_SHA }}
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          echo P05_V113_BROWSER_FIRST=PASS

      - name: Candidate receipt
        run: |
          echo P05_V113_CANDIDATE_MACHINE=PASS
          echo P05_EXACT_SOURCE=$P05_EXACT_SHA
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0
