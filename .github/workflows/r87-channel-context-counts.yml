name: R87 Focused Channel Context Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r87-channel-context-counts.yml'

permissions:
  contents: read

jobs:
  r87-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 86cd8519cf39a0afabcc5442451c454ec223a0f4
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 86cd8519cf39a0afabcc5442451c454ec223a0f4
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/channel_type_context_count_contract.php
          php tests/unit/channel_type_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/channel_provider_facet_context_contract.php
          php tests/unit/channel_provider_normalization_contract.php
          php tests/unit/channel_provider_zero_result_contract.php
          echo R87_CHANNEL_TYPE_CONTEXT_COUNT_PASS
          echo R87_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
