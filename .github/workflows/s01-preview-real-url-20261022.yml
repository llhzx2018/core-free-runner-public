name: S01 Theme Preview no phantom route focused gate
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-preview-real-url-20261022.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 8f6e24bf1d3b69f60faeac2785056d204ae33563
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: theme
          persist-credentials: false
      - name: Exact Theme candidate and scope syntax
        run: |
          set -euo pipefail
          test "$(git -C theme rev-parse HEAD)" = 8f6e24bf1d3b69f60faeac2785056d204ae33563
          test "$(git -C theme rev-parse HEAD^{tree})" = 9370599c9127075d7cbfb60f43eef5b4fbecccf7
          php -l theme/src/inc/admin/views/preview.php
          php -l theme/tests/preview-real-target-failclosed-contract.php
          node --check theme/src/assets/js/admin/admin-preview.js
          php theme/tests/preview-real-target-failclosed-contract.php
          php theme/tests/preview-workflow-v4-contract.php
          php theme/tests/preview-human-language-followup-contract.php
          echo PREVIEW_NO_GHOST_ROUTE_TARGETED_GATE_PASS
      - name: Cleanup target
        if: always()
        run: rm -rf theme
