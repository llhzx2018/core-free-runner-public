name: R72 Focused Tool Scene Context Total Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r72-tool-scene-context-total.yml'

permissions:
  contents: read

jobs:
  r72-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: a190736310032b21b2220a3358df861dd0e560a4
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: a190736310032b21b2220a3358df861dd0e560a4
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/ToolSceneDetail.php
          php -l tests/unit/tool_scene_context_total_contract.php
          php tests/unit/tool_scene_context_total_contract.php
          php tests/unit/tool_scene_facet_context_contract.php
          php tests/unit/default_sort_result_route_contract.php
          echo R72_TOOL_SCENE_CONTEXT_TOTAL_PASS
          echo R72_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
