name: TEMP S01-C02 Ops 1.21.830 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121830-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121830-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 729eeb29a4b99a26c124c9f6969332fab75896f2
      TREE: 319d71f3ed736faa658444f7dc4771eec09ceb6a
      TAG: v1.21.830
      ASSET: vf-tools-ops_V1.21.830.zip
      BYTES: '3256589'
      SHA256: aad94f016ebaf1c284c6cab832fd7f336885d8b341763f5982ebb17cf79e12c2
      FILES: '912'
      FP: 9865b8bc54c06ea609619af79d6c03c0092b2bf1f07d5d44f6b09392e9c94818
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$release_code" = 404
          tag_code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$tag_code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.830 adds privacy-safe classification for the proven recovered Candidate Stage-4 build failure.

          - Focused Gate 33986420131 PASS on exact source 729eeb29a4b99a26c124c9f6969332fab75896f2 / tree 319d71f3ed736faa658444f7dc4771eec09ceb6a; deterministic Artifact Identity 33986469931 PASS.
          - Public readback exposes only an allowlisted Candidate build failure class plus aggregate large-build progress/state booleans and counts.
          - It does NOT expose raw error text, job identity, local paths, filenames, URLs or source SHA.
          - The layer is read-only: no retry, no Source ZIP mutation/upload, no WordPress content mutation and no Candidate/package/finalOnline PASS forcing.
          - Existing V1.21.826 route normalization, V1.21.827 source rebind, V1.21.828 recovery runtime closure and V1.21.829 recovery continuation remain unchanged.
          - Production pre-release truth remains a new recovery Candidate terminal FAIL at Stage 4 candidate_build with zero Final Audit failures because Final Audit has not started; Source remains reusable and manualSourceUploadRequired=false.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.830.zip; 3256589 bytes; SHA256 aad94f016ebaf1c284c6cab832fd7f336885d8b341763f5982ebb17cf79e12c2; runtime files 912; fingerprint 9865b8bc54c06ea609619af79d6c03c0092b2bf1f07d5d44f6b09392e9c94818.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.830' --notes-file /tmp/release-notes.md
