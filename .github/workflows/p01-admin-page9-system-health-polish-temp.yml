name: p01-admin-page9-system-health-polish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-admin-page9-system-health-polish-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 073a4507637a655441c2cf09861931f2a295a6d2
      TARGET_SHA: ea3d8ac41da738a7602ce7911c2961a9ab1a5387
    steps:
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          echo P01_ADMIN_PAGE9_EXACT_SOURCE=PASS

      - name: Verify bounded three-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/admin-consolidation.css
          src/system-health.php
          tests/unit/admin_system_health_page9_polish_contract.php
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.42"
          echo P01_ADMIN_PAGE9_BOUNDED_DIFF=PASS

      - name: Lint and focused System Health contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/system-health.php
          node --check current/src/assets/system.js
          tests=(
            tests/unit/admin_system_health_r18_contract.php
            tests/unit/admin_system_closure_contract.php
            tests/unit/admin_system_group_polish_r69_contract.php
            tests/unit/system_health_runtime_r7_contract.php
            tests/unit/admin_system_capabilities_r62_contract.php
            tests/unit/admin_system_health_page9_polish_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_ADMIN_PAGE9_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_ADMIN_PAGE9_CANONICAL=PASS
