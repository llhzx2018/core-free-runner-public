name: P04 V2.8.12 Final Git Closure

on:
  push:
    paths:
      - '.github/workflows/p04-v2812-final-git-closure-20260831.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOSURE_SOURCE: 21d1a84bef4d6bad3af56cf94d4cc1cdf98f1721
      BASE_CURRENT: 5f3e076887d98f7827c193d0a2dd3e3425d75d33
      CLOSURE_BRANCH: governance/p04-v2812-final-git-closure-20260831
      CORE_UPDATES_SOURCE: 99af2c7a323d7a07db0979bf071d9c891dffe51e
      RELEASE_ID: '379896011'
      TAG: v2.8.12
      FULL_ASSET_ID: '538235898'
      UPDATE_ASSET_ID: '538235899'
      FULL_BYTES: '624374'
      UPDATE_BYTES: '1338985'
      FULL_SHA256: a8144f46c78fea31e3c2508a1e34f2d122835e4fcf66a63d50ac95f861500634
      UPDATE_SHA256: 89e43645b1b434ce86f575c835517a15f29711ccbd586311ac5957d2e8ba4246

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact closure candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CLOSURE_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Checkout exact update manifest source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify final Git closure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git -C product rev-parse HEAD)" = "$CLOSURE_SOURCE"
          test "$(gh api repos/llhzx2018/vf-infra/branches/main --jq '.commit.sha')" = "$BASE_CURRENT"
          test "$(gh api repos/llhzx2018/vf-infra/branches/develop --jq '.commit.sha')" = "$BASE_CURRENT"
          test "$(gh api repos/llhzx2018/vf-infra/branches/$CLOSURE_BRANCH --jq '.commit.sha')" = "$CLOSURE_SOURCE"
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"

          mapfile -t changed < <(git -C product diff --name-only "$BASE_CURRENT" "$CLOSURE_SOURCE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'docs/evidence/P04_V2812_FINAL_GIT_CLOSURE_20260831.md'
          test "$(git -C product show "$CLOSURE_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.12'

          python3 - <<'PY'
          import json
          from pathlib import Path

          p=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          assert p['project_id']=='P04'
          assert p['version']=='2.8.12'
          assert p['status']=='V2.8.12 RELEASE CURRENT / V2.8.12 PRODUCTION'
          assert p['lifecycle']=='PRODUCTION_CURRENT'
          assert p['production_version']=='2.8.12'
          assert p['schema']==14 and p['schema_version_contract']==14
          assert p['technical_baseline']['provider_authority']=='READ_ONLY_FIRST'
          assert p['release']['published'] is True
          assert p['release']['tag']=='v2.8.12'
          assert p['release']['release_id']==379896011
          assert p['release']['formal_gate']=='PASS'
          assert p['release']['core_updates']['status']=='PUBLISHED_VERIFIED'
          assert p['production_truth']['installed_version']=='2.8.12'
          assert p['production_truth']['installed_schema']==14
          assert p['production_truth']['release_production_parity'] is True
          assert p['next_action']=='NONE_V2.8.12_PRODUCTION_CLOSED'

          u=json.load(open('updates/projects/P04.json',encoding='utf-8'))
          assert u['project_id']=='P04'
          assert u['target_version']=='2.8.12'
          assert u['from_versions']==['2.8.11']
          assert u['schema_from']=='14' and u['schema_to']=='14'
          assert u['release_id']==379896011
          assert u['asset_id']==538235899
          assert u['asset_bytes']==1338985
          assert u['asset_sha256']=='89e43645b1b434ce86f575c835517a15f29711ccbd586311ac5957d2e8ba4246'

          text=Path('product/docs/evidence/P04_V2812_FINAL_GIT_CLOSURE_20260831.md').read_text(encoding='utf-8')
          required=[
              'V2.8.12 Final Git Closure',
              'Final Closure：`SEALED`',
              'V2.8.12 至此正式封闭',
              'NONE_V2.8.12_PRODUCTION_CLOSED',
              '33409138217',
              '33413768617',
              '33414036836',
              '33414937216',
              '33415144395',
              '379896011',
              '538235898',
              '538235899',
              '5f3e076887d98f7827c193d0a2dd3e3425d75d33',
              'Force Push：`NO`',
              'History Rewrite：`NO`',
          ]
          for item in required:
              assert item in text, item
          assert 'PENDING' not in text
          PY

          RELEASE_JSON="$(gh api repos/llhzx2018/vf-infra/releases/tags/$TAG)"
          test "$(jq -r '.id' <<<"$RELEASE_JSON")" = "$RELEASE_ID"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.assets[]|select(.id=='"$FULL_ASSET_ID"')|.size' <<<"$RELEASE_JSON")" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.id=='"$FULL_ASSET_ID"')|.digest' <<<"$RELEASE_JSON")" = "sha256:$FULL_SHA256"
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.size' <<<"$RELEASE_JSON")" = "$UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.digest' <<<"$RELEASE_JSON")" = "sha256:$UPDATE_SHA256"

          echo P04_V2812_FINAL_GIT_CLOSURE_GATE=PASS
          echo CLOSURE_SOURCE="$CLOSURE_SOURCE"
          echo BASE_CURRENT="$BASE_CURRENT"
          echo FINAL_CLOSURE=SEALED
