name: P08 v013 Mode U exact GOV-DOC policy gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v013-mode-u-gov-verify.yml
permissions:
  contents: read
jobs:
  gov-p08-v013-u:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-gov-u-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact private GOV-DOC candidate (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 15ba19db941c66d17e8a5db81ee94d6423448b6e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Policy source exact gates and Git diff
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL, SECURITY, TESTING, UPGRADE, DATA_SCHEMA, API_PROVIDER, SEO, CRON_JOB, NOTIFICATION, OBSERVABILITY, PERFORMANCE, GIT, UA_UI
            IMPACT_REASON: This PR changes the normative release-skill human acceptance timing contract for one high-risk P08 updater release and is classified UPDATED; all 13 areas retain their safety gates while the sealed domain authority bodies stay unchanged.
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = 15ba19db941c66d17e8a5db81ee94d6423448b6e
          test -f gov/governance/release/cases/P08_ADOPS_013_PR78_PR79_RELEASE_FIRST_OWNER_MANUAL_20261119.md
          test -f gov/skills/skill-release/V3.20/SKILL.md
          test "$(git -C gov diff --name-only 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae HEAD | wc -l)" -eq 4
          python3 gov/governance/public-authority/tools/global_closure_lint.py --git-base 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae --git-head 15ba19db941c66d17e8a5db81ee94d6423448b6e
          python3 gov/governance/public-authority/tools/current_dependency_lint.py --git-base 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae --git-head 15ba19db941c66d17e8a5db81ee94d6423448b6e
          grep -F '| skill-release | V3.20 |' gov/CURRENT.md
          grep -F '| skill-release | V3.20 | V2.6 |' gov/skills/README.md
          grep -F 'v0.1.13' gov/governance/release/cases/P08_ADOPS_013_PR78_PR79_RELEASE_FIRST_OWNER_MANUAL_20261119.md
          grep -F 'Mode U' gov/skills/skill-release/V3.20/SKILL.md >/dev/null
          test -z "$(git -C gov status --porcelain --untracked-files=all)"
          echo P08_MODE_U_GOV_CASE_SOURCE=PASS
      - name: Destroy private GOV-DOC checkout
        if: always()
        run: |
          rm -rf -- gov
          test ! -e gov
          echo P08_GOV_TEMP_SOURCE_CLEANUP=PASS
