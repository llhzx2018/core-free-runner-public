name: Core Updates P01 V2.34 Corrected Readback
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths: [.github/workflows/core-updates-p01-v2340-corrected-readback-20260830.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify published core-updates truth without mutation
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN=$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)
          test "$MAIN" = 8db85499605c34c6b72e664778fa709aa40dc963
          gh api 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' --jq .content | tr -d '\n' | base64 -d > /tmp/P01.json
          jq -e '.current_version=="2.33.0" and .target_version=="2.34.0" and .release_tag=="v2.34.0" and .release_id==379298288 and .product_identity=="518d10f446ea85445d1110a3defafc5bcbece473" and .asset_name=="VF_Start_V2.34.0_UPDATE.zip" and .asset_bytes==1366286 and .asset_sha256=="0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58"' /tmp/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0)
          test "$(jq -r .id <<<"$REL")" = 379298288
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58
          rm -rf /tmp/p01-v2340-readback && mkdir -p /tmp/p01-v2340-readback
          gh release download v2.34.0 --repo llhzx2018/vf-start --pattern VF_Start_V2.34.0_UPDATE.zip --dir /tmp/p01-v2340-readback
          A=/tmp/p01-v2340-readback/VF_Start_V2.34.0_UPDATE.zip
          test "$(stat -c%s "$A")" = 1366286
          echo "0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.34.0.php >/dev/null
          echo CORE_UPDATES_P01_V2340_MAIN=8db85499605c34c6b72e664778fa709aa40dc963
          echo CORE_UPDATES_P01_V2340_CORRECTED_READBACK=PASS
          echo PREVIOUS_RUN_33315827599_CLASSIFICATION=POST_WRITE_HARNESS_FALSE_FAILURE
          echo OWNER_PRODUCTION_WRITE=NO
