name: P01 GOV-BOOK one-off private revisions native proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-govbook-transient-proof-20261015.yml'
permissions:
  contents: read
jobs:
  exact-native:
    if: >-
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare native PHP and ZIP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-gd unzip >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          php -m | grep -i -Fx zip
          php -m | grep -i -Fx curl
          echo NATIVE_RUNTIME=PASS
      - name: Checkout pinned private exact sources only in temporary runner workspace
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" p01
          git -C p01 checkout -q f1c5d8f3279742bd74b121621d8a1f0a0176b1d3
          test "$(git -C p01 rev-parse HEAD)" = "f1c5d8f3279742bd74b121621d8a1f0a0176b1d3"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-book.git" govbook
          git -C govbook checkout -q 847b07217b72524c9a4458a83612e0b683eb3dfa
          test "$(git -C govbook rev-parse HEAD)" = "847b07217b72524c9a4458a83612e0b683eb3dfa"
          test "$(tr -d '\r\n ' < p01/VERSION)" = "2.47.375"
          test "$(tr -d '\r\n ' < p01/src/VERSION.txt)" = "2.47.375"
          echo PINNED_PRIVATE_SOURCES=PASS
      - name: GOV-BOOK immutable reader assets + course links
        shell: bash
        run: |
          set -Eeuo pipefail
          cd govbook
          python3 tools/verify_p01_internal_revisions.py
          echo GOVBOOK_SOURCE_ASSETS=PASS
      - name: P01 exact-source PHP and native boundary regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          php -l src/app/GovBookSync.php
          php -l src/app/JobManager.php
          php -l src/app/CourseLibraryPage.php
          php -l tests/integration/gov_book_internal_reader_revision_native.php
          php -l tests/integration/gov_book_internal_revision_full_pipeline_native.php
          php tests/integration/gov_book_internal_reader_revision_native.php
          echo P01_REVISION_BOUNDARY=PASS
      - name: P01 native disposable SQLite complete sync pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          GOV_BOOK_EXACT_SOURCE="$GITHUB_WORKSPACE/govbook" php tests/integration/gov_book_internal_revision_full_pipeline_native.php
          echo P01_SQLITE_SYNC_PIPELINE=PASS
      - name: Public-safe exact-source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git -C p01 status --porcelain --untracked-files=no)"
          test -z "$(git -C govbook status --porcelain --untracked-files=no)"
          echo P01_EXACT_SHA=f1c5d8f3279742bd74b121621d8a1f0a0176b1d3
          echo GOVBOOK_EXACT_SHA=847b07217b72524c9a4458a83612e0b683eb3dfa
          echo P01_GOVBOOK_NATIVE_GATE=PASS
      - name: Remove all private checkouts and runtime data
        if: always()
        shell: bash
        run: |
          rm -rf p01 govbook
          echo PRIVATE_SOURCE_PERSISTED=NO
