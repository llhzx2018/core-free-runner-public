name: P03 V1.35.4 Temporary Tool Cleanup Minimal Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1354-temporary-tool-cleanup-minimal-gate.yml'
      - 'scripts/p03_v1354_temporary_tool_cleanup_gate.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-temporary-tool-cleanup-minimal-gate
  cancel-in-progress: false

jobs:
  cleanup-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CORRECTIVE_BRANCH: repair/v1.35.4-source-exact-reconcile
      FROZEN_PRODUCT_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      EXPECTED_PRODUCT_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      PHP_BASE_IMAGE: php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
      PHP_TEST_IMAGE: p03-v1354-cleanup-php84:local

    steps:
      - name: Checkout public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Require private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=PASS'

      - name: Checkout corrective branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CORRECTIVE_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: corrective

      - name: Checkout Frozen V1.35.4 Product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.FROZEN_PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Verify exact Git identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$FROZEN_PRODUCT_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -f corrective/scripts/corrective/finalize_v1354_same_version_reconcile_production.py
          test -f corrective/scripts/corrective/finalize_v1354_source_forensic_probe.py
          test -f corrective/scripts/corrective/finalize_v1354_temporary_tool_cleanup.py
          echo 'FROZEN_PRODUCT_GIT_IDENTITY=PASS'
          echo "CORRECTIVE_HEAD=$(git -C corrective rev-parse HEAD)"

      - name: Build PHP 8.4 Frozen setup test image
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/Dockerfile.p03-cleanup <<EOF
          FROM ${PHP_BASE_IMAGE}
          RUN apt-get update \
              && apt-get install -y --no-install-recommends libsqlite3-dev libzip-dev \
              && docker-php-ext-install pdo_sqlite zip \
              && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -f /tmp/Dockerfile.p03-cleanup -t "$PHP_TEST_IMAGE" /tmp
          docker run --rm "$PHP_TEST_IMAGE" php -r '
          $required=["pdo_sqlite","fileinfo","sodium","zip"];
          foreach($required as $extension){
              if(!extension_loaded($extension)){fwrite(STDERR,"MISSING_EXTENSION:$extension\n");exit(2);}
          }
          echo "PHP_FROZEN_SETUP_EXTENSIONS=PASS\n";
          '

      - name: Run minimal cleanup gate
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x harness/scripts/p03_v1354_temporary_tool_cleanup_gate.sh
          bash -x harness/scripts/p03_v1354_temporary_tool_cleanup_gate.sh

      - name: Final cleanup safety verdict
        shell: bash
        run: |
          echo 'TEMPORARY_TOOL_CLEANUP_MINIMAL_GATE=PASS'
          echo 'PRODUCT_RUNTIME_WRITE=0'
          echo 'MEMORY_API_WRITE=0'
          echo 'PRODUCTION_DB_WRITE=0'
          echo 'PROVIDER_WRITE=0'
          echo 'MIGRATION=NOT_EXECUTED'
          echo 'M030=NOT_RERUN'
          echo 'MAIN_PROMOTION=NOT_EXECUTED'
          echo 'V1.35.5=NOT_CREATED'
