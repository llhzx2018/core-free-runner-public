name: P01 News V2 private excerpts cards and article dialog exact Chromium proof
on:
  push:
    branches:
      - task/p01-news-v2-cards-preview-proof-20261109
permissions:
  contents: read
jobs:
  scoped-news-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P01_EXACT_SHA: 51adc1fac5c41d3d3c467562ecfd588de557d358
      VF_NEWS_VISUAL_CAPTURE: '1'
      VF_NEWS_TEST_ROOT: p01-exact
      VF_NEWS_BROWSER_MODULE: /tmp/p01-news-v2-playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-v2-browsers
    steps:
      - name: Checkout registered Public Runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-source private P01 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Exact identity and PHP JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.511
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip nodejs npm fonts-wqy-microhei >/dev/null
          for file in p01-exact/src/app/NewsFeedPage.php p01-exact/src/app/NewsLocalManagementPanel.php p01-exact/src/app/NewsFeedService.php p01-exact/src/app/NewsFeedNormalizer.php; do php -l "$file"; done
          for file in p01-exact/src/assets/news-feed.js p01-exact/src/assets/news-preferences.js p01-exact/tests/browser/p01_news_r4_chromium.cjs; do node --check "$file"; done
          echo P01_NEWS_V2_EXACT_SYNTAX=PASS
      - name: Run News security source and navigation unit contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          # Public synthetic media fixture only; temporary diagnostic before exact unit tests.
          php <<'P01_MEDIA_PROBE'
          <?php
          define('VF_PRIVATE_ROOT', sys_get_temp_dir());
          require 'p01-exact/src/app/NewsFeedService.php';
          $xml = '<?xml version="1.0"?><rss version="2.0" xmlns:media="http://search.yahoo.com/mrss/"><channel><item><title>Publisher photo</title><link>https://www.ithome.com/0/2026/example.html</link><media:thumbnail url="https://img.ithome.com/photos/example.webp"/></item></channel></rss>';
          $root = simplexml_load_string($xml);
          $node = $root->channel->item[0]->children('http://search.yahoo.com/mrss/');
          echo 'P01_MEDIA_XML=', (string)$node->thumbnail[0]['url'], PHP_EOL;
          echo 'P01_MEDIA_URL=', var_export(VfNewsFeedNormalizer::sourceImageUrl('https://img.ithome.com/photos/example.webp','https://www.ithome.com/0/2026/example.html'), true), PHP_EOL;
          echo 'P01_MEDIA_PARSED=', json_encode(VfNewsFeedService::parseRss('ithome-tech',$xml,1794110400),JSON_UNESCAPED_SLASHES), PHP_EOL;
          P01_MEDIA_PROBE
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_release_surface_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          php p01-exact/tests/unit/p01_news_cross_source_dedup_native.php
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          node p01-exact/tests/unit/p01_ia6_update_oneclick_modal_return_native.cjs
          echo P01_NEWS_V2_SCOPED_CONTRACTS=PASS
      - name: One-time public RSS source media census (aggregated counts only)
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request, urllib.error, tempfile, os, re
          from concurrent.futures import ThreadPoolExecutor
          from xml.etree import ElementTree as ET
          from urllib.parse import urlsplit
          source_php = """require 'p01-exact/src/app/NewsFeedService.php';
            $r=(new ReflectionClass('VfNewsFeedService'))->getReflectionConstant('SOURCES');
            foreach($r->getValue() as $id=>$s)if(isset($s['feed']))echo json_encode(['id'=>$id,'url'=>$s['feed']],JSON_UNESCAPED_SLASHES),"\n";"""
          fetched = subprocess.run(['php','-r',source_php],capture_output=True,text=True,check=True).stdout
          feeds = [json.loads(s) for s in fetched.splitlines()]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          parse_php="""require 'p01-exact/src/app/NewsFeedService.php';
            $items=VfNewsFeedService::parseRss($argv[1],file_get_contents($argv[2]),1794110400);
            echo json_encode(['items'=>count($items),'with_image'=>count(array_filter($items,static fn($row)=>!empty($row['image_url'])))],JSON_UNESCAPED_SLASHES);"""
          def examine(feed):
              id,url=feed['id'],feed['url']
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'VF Start News/1 (+source headlines only)','Accept':'application/rss+xml, application/atom+xml, application/xml, text/xml'})
                  with opener.open(req,timeout=8) as response:
                      status=response.status
                      raw=response.read(393217)
                  if status!=200: return id,'HTTP_'+str(status),0,0,0,0
                  if len(raw)>393216: return id,'OVERSIZE',0,0,0,0
                  with tempfile.NamedTemporaryFile(prefix='rss-census-',suffix='.xml',delete=False) as tmp:
                      tmp.write(raw); path=tmp.name
                  try:
                      # Parsed coverage is measured using the ACTUAL P01 PHP parser.
                      p=subprocess.run(['php','-r',parse_php,id,path],capture_output=True,text=True,timeout=9)
                      if p.returncode: return id,'PARSE_ERROR',0,0,0,0
                      counts=json.loads(p.stdout)
                      root=ET.fromstring(raw)
                      media=sum(1 for el in root.iter() if el.tag.rsplit('}',1)[-1] in ('thumbnail','enclosure'))
                      html=sum(len(re.findall(br'<img\b',text,re.I)) for text in raw.split(b'<![CDATA[')[1:][::1])
                      return id,'OK',counts['items'],counts['with_image'],media,html
                  finally: os.unlink(path)
              except urllib.error.HTTPError as exc:
                  return id,'HTTP_'+str(exc.code),0,0,0,0
              except Exception as exc:
                  return id,type(exc).__name__,0,0,0,0
          with ThreadPoolExecutor(max_workers=5) as pool:
              results=list(pool.map(examine,feeds))
          print('P01_REAL_PUBLIC_RSS_CENSUS=FINISHED,NO_NEWS_CONTENT_OR_IMAGES_PERSISTED')
          for sid,status,items,images,media,html in results:
              print(f'P01_RSS_SOURCE={sid} STATUS={status} PARSED_ITEMS={items} ACCEPTED_IMAGES={images} MEDIA_NODES={media} HTML_IMAGE_HINTS={html}')
          print('P01_RSS_TOTAL_OK='+str(sum(1 for r in results if r[1]=='OK')))
          print('P01_RSS_TOTAL_PARSED='+str(sum(r[2] for r in results)))
          print('P01_RSS_TOTAL_IMAGE_ACCEPTED='+str(sum(r[3] for r in results)))
          PY
      - name: Install headless Chromium and exercise native management and owner reading
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          # The installed application and generated source bytes remain exact.
          # Only the transient synthetic Chromium *test* receives screenshot calls.
          mkdir -p /tmp/p01-news-visual-preview
          python3 - <<'PY'
          from pathlib import Path
          p=Path('p01-exact/tests/browser/p01_news_r4_chromium.cjs')
          src=p.read_text()
          anchor=" check(await owner.locator('.vf-news-row').count()===18,'owner-deduped-personal-headlines-retained');"
          assert src.count(anchor)==1, "synthetic preview test anchor drift"
          extra="""
          await owner.screenshot({path:'/tmp/p01-news-visual-preview/01-news-cards-1440.png',animations:'disabled'});
          await owner.locator('[data-vf-news-layout-button="list"]').click();
          await owner.screenshot({path:'/tmp/p01-news-visual-preview/02-news-list-1440.png',animations:'disabled'});
          await owner.locator('[data-vf-news-layout-button="cards"]').click();
          await owner.locator('[data-vf-news-preview]').first().click();
          await owner.screenshot({path:'/tmp/p01-news-visual-preview/03-owner-article-preview-1440.png',animations:'disabled'});
          await owner.keyboard.press('Escape');
          await owner.setViewportSize({width:768,height:900});
          await owner.screenshot({path:'/tmp/p01-news-visual-preview/04-news-768.png',animations:'disabled'});
          await owner.setViewportSize({width:390,height:844});
          await owner.screenshot({path:'/tmp/p01-news-visual-preview/05-news-390.png',animations:'disabled'});
          await owner.setViewportSize({width:1440,height:900});
          """
          p.write_text(src.replace(anchor,anchor+extra))
          PY
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news-v2-browser.log
          grep -E '^P01_NEWS_R4_CHROMIUM=PASS checks=[0-9]+$' /tmp/p01-news-v2-browser.log
          echo P01_NEWS_V2_REAL_CHROMIUM=PASS
      - name: Publish public-safe SYNTHETIC visual preview only
        uses: actions/upload-artifact@v4
        with:
          name: P01-News-V2-Visual-Preview-SYNTHETIC-NO-PRIVATE-DATA
          path: /tmp/p01-news-visual-preview/*.png
          if-no-files-found: error
          retention-days: 3
      - name: Clean transient private source and browser files
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH" /tmp/p01-news-v2-browser.log /tmp/p01-news-visual-preview
          echo P01_NEWS_V2_CLEANUP=YES
