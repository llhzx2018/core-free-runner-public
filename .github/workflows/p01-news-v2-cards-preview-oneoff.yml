name: P01 News exact candidate canonical zero-debt source regression
on:
  push:
    branches:
      - task/p01-news-v2-cards-preview-proof-20261109
permissions:
  contents: read
jobs:
  scoped-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_EXACT_SHA: f0941a14e701c381d6764e36b26ac9eeba091faf
      FORMAL_BASE_SHA: 2856343e4a4b40ea1bcc1c3e408a726e4056bf0c
    steps:
      - name: Checkout public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-source P01 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Transient exact formal-main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-main
          persist-credentials: false
      - name: Canonical zero-new-debt regression relative to formal baseline
        shell: bash
        timeout-minutes: 24
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_EXACT_SHA"
          test "$(git -C p01-main rev-parse HEAD)" = "$FORMAL_BASE_SHA"
          test "$(cat p01-exact/VERSION)" = '2.47.511'
          test "$(cat p01-main/VERSION)" = '2.47.510'
          if ! command -v php >/dev/null 2>&1 || ! php -m | grep -qi pdo_sqlite || ! php -m | grep -qi simplexml; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip >/dev/null
          fi
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-main --require-zero-debt
          echo P01_511_EXACT_CANONICAL_ZERO_DEBT=PASS
      - name: Securely cleanup transient private product source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p01-exact p01-main
          test ! -e p01-exact && test ! -e p01-main
          echo P01_511_TEMP_SOURCE_CLEANED=YES
