name: P01 News 2.47.511 disposable candidate FULL Atomic proof
on:
  push:
    branches:
      - task/p01-news-v2-cards-preview-proof-20261109
permissions:
  contents: read
jobs:
  candidate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P01_EXACT_SHA: f0941a14e701c381d6764e36b26ac9eeba091faf
    steps:
      - name: Checkout registered Public Runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-source private P01 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Verify runtime and pin candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = '2.47.511'
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = '2.47.511'
          if ! command -v php >/dev/null 2>&1 || ! php -m | grep -qi pdo_sqlite || ! php -m | grep -qi simplexml; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip >/dev/null
          fi
          php -m | grep -qi pdo_sqlite
          command -v gh
          python3 -m py_compile scripts/p01-maintenance-release.py
          echo P01_511_CANDIDATE_RUNTIME=PASS
      - name: Disposable 510 to 511 FULL Atomic and rollback lifecycle
        timeout-minutes: 23
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          TMP="$(mktemp -d /tmp/p01-511-candidate-gate.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          export VF_R5_SCRIPT_PATH="$TMP/r5-510-to-511.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          original=Path('p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh').read_text()
          replacements={
             'FROM=2.47.505':'FROM=2.47.510',
             'CANDIDATE_VERSION=2.47.506':'CANDIDATE_VERSION=2.47.511',
             '2.47.506':'2.47.511',
             'news.php news-feed.php news-preferences.php app/NewsFeedService.php':'news.php news-feed.php news-preferences.php news-read-state.php app/NewsReadState.php app/NewsFeedService.php'
          }
          for old,new in replacements.items():
             if old not in original: raise RuntimeError('historical R5 gate contract changed: '+old)
             original=original.replace(old,new)
          Path(os.environ['VF_R5_SCRIPT_PATH']).write_text(original)
          # .510 already contains news.php; do not assert it vanishes after rollback.
          helper=Path('p01-exact/tests/integration/p01_news_r5_lifecycle_native.php')
          src=helper.read_text()
          old="news_r5_assert(!is_file($resolved.'/news.php'),'new-news-route-removed-after-failed-atomic');"
          new=("news_r5_assert(is_file($resolved.'/news.php'),'existing-news-route-retained-after-rollback');\n"
               "    news_r5_assert(!is_file($resolved.'/news-read-state.php'),'candidate-read-state-route-removed-after-rollback');")
          if src.count(old)!=1: raise RuntimeError('historical rollback contract changed')
          helper.write_text(src.replace(old,new))
          PY
          echo P01_511_CANDIDATE_BASELINE=v2.47.510
          echo P01_511_CANDIDATE_TARGET=v2.47.511
          echo P01_511_CANDIDATE_ARTIFACT_MODE=DISPOSABLE_NOT_PUBLISHED
          VF_NEWS_R5_SANDBOX=1 VF_NEWS_R5_TARGET_VERSION=2.47.511 PRODUCT_SHA="$P01_EXACT_SHA" bash "$VF_R5_SCRIPT_PATH"
          echo P01_511_CANDIDATE_BASELINE_510_EXACT_FULL_ATOMIC_ROLLBACK=PASS
      - name: Clean transient private P01 checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p01-exact
          test ! -e p01-exact
          echo P01_511_CANDIDATE_PRIVATE_SOURCE_CLEANED=YES
