name: P01 News 2.47.511 disposable candidate FULL Atomic proof
on:
  push:
    branches:
      - task/p01-news-v2-cards-preview-proof-20261109
permissions:
  contents: read
jobs:
  candidate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P01_EXACT_SHA: f0941a14e701c381d6764e36b26ac9eeba091faf
    steps:
      - name: Checkout registered Public Runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-source private P01 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Verify runtime and pin candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = '2.47.511'
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = '2.47.511'
          if ! command -v php >/dev/null 2>&1 || ! php -m | grep -qi pdo_sqlite || ! php -m | grep -qi simplexml; then
            timeout 150s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip >/dev/null
          fi
          php -m | grep -qi pdo_sqlite
          command -v gh
          python3 -m py_compile scripts/p01-maintenance-release.py
          echo P01_511_CANDIDATE_RUNTIME=PASS
      - name: Prove actual read-state backup restoration inside exact 510 to 511 atomic lifecycle
        timeout-minutes: 23
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(git -C p01-exact rev-parse HEAD)" = "$P01_EXACT_SHA"
          TMP="$(mktemp -d /tmp/p01-511-candidate-gate.XXXXXX)"
          trap 'rm -rf -- "$TMP"' EXIT
          export VF_R5_SCRIPT_PATH="$TMP/r5-510-to-511.sh"
          python3 - <<'PY'
          from pathlib import Path
          import os
          original=Path('p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh').read_text()
          replacements={
             'FROM=2.47.505':'FROM=2.47.510',
             'CANDIDATE_VERSION=2.47.506':'CANDIDATE_VERSION=2.47.511',
             '2.47.506':'2.47.511',
             'news.php news-feed.php news-preferences.php app/NewsFeedService.php':'news.php news-feed.php news-preferences.php news-read-state.php app/NewsReadState.php app/NewsFeedService.php'
          }
          for old,new in replacements.items():
             if old not in original: raise RuntimeError('historical R5 gate contract changed: '+old)
             original=original.replace(old,new)
          Path(os.environ['VF_R5_SCRIPT_PATH']).write_text(original)
          # .510 already contains news.php; do not assert it vanishes after rollback.
          helper=Path('p01-exact/tests/integration/p01_news_r5_lifecycle_native.php')
          src=helper.read_text()
          old="news_r5_assert(!is_file($resolved.'/news.php'),'new-news-route-removed-after-failed-atomic');"
          new=("news_r5_assert(is_file($resolved.'/news.php'),'existing-news-route-retained-after-rollback');\n"
               "    news_r5_assert(!is_file($resolved.'/news-read-state.php'),'candidate-read-state-route-removed-after-rollback');")
          if src.count(old)!=1: raise RuntimeError('historical rollback contract changed')
          # Canonical preferences normalize selected sources to the source
          # catalog order. The former R5 test assumed request-array order.
          src=src.replace(old,new)
          ordered="news_r5_assert($prefs['followed']===['solidot-tech'] && $prefs['enabled']===['cn-live','solidot-tech'],'preferences-retained');"
          setwise=("news_r5_assert($prefs['followed']===['solidot-tech'] "
                   "&& count($prefs['enabled'])===2 "
                   "&& in_array('cn-live',$prefs['enabled'],true) "
                   "&& in_array('solidot-tech',$prefs['enabled'],true),"
                   "'preferences-retained');")
          if src.count(ordered)!=1: raise RuntimeError('old preference order proof changed')
          src=src.replace(ordered,setwise)
          # Extend the same real BackupManager restore drill to the only new
          # persisted 2.47.511 data: private URL-hash reading marks.
          marker="echo 'P01_NEWS_R5_ATOMIC_AND_BACKUP_RESTORE=PASS'.PHP_EOL;"
          extra=r'''
          require_once dirname(__DIR__,2).'/src/app/NewsReadState.php';
          $readKey=VfNewsReadState::keyForUrl('https://news.example.org/r5-cache');
          news_r5_assert(is_string($readKey) && strlen($readKey)===64,'read-mark-hash-valid');
          $beforeRead=VfNewsReadState::read($db);
          news_r5_assert($beforeRead['version']==='defaults','read-mark-default-after-510-upgrade');
          $marked=VfNewsReadState::update($db,[$readKey],$beforeRead['version'],'mark');
          news_r5_assert($marked['read']===[$readKey],'read-mark-persisted-before-protected-backup');
          $markBackup=(new VfBackupManager($db))->create('P01 511 isolated read-state checkpoint','pre-update',true);
          news_r5_assert((string)($markBackup['backup_key']??'')!=='','read-mark-protected-backup-created');
          $cleared=VfNewsReadState::update($db,[$readKey],$marked['version'],'unmark');
          news_r5_assert($cleared['read']===[],'read-mark-clear-creates-actual-data-difference');
          $db=null;vf_close_db();
          $recovered=VfBackupManager::performRestore((string)$markBackup['backup_key']);
          news_r5_assert(($recovered['restored']??false)===true && ($recovered['integrity']??'')==='ok','read-mark-core-restore-success');
          $db=vf_db();
          $afterRead=VfNewsReadState::read($db);
          news_r5_assert($afterRead['read']===[$readKey]&&$afterRead['version']===$marked['version'],'read-mark-restored-exactly');
          news_r5_assert((string)$db->query('PRAGMA integrity_check')->fetchColumn()==='ok','read-mark-restore-sqlite-integrity');
          news_r5_assert(count($db->query('PRAGMA foreign_key_check')->fetchAll())===0,'read-mark-restore-foreign-key-integrity');
          echo 'P01_511_PRIVATE_READ_STATE_ACTUAL_BACKUP_RESTORE=PASS'.PHP_EOL;
          '''
          if src.count(marker)!=1: raise RuntimeError('restore insertion anchor changed')
          helper.write_text(src.replace(marker,extra+"\n"+marker))
          PY
          echo P01_511_CANDIDATE_BASELINE=v2.47.510
          echo P01_511_CANDIDATE_TARGET=v2.47.511
          echo P01_511_CANDIDATE_ARTIFACT_MODE=DISPOSABLE_NOT_PUBLISHED
          VF_NEWS_R5_SANDBOX=1 VF_NEWS_R5_TARGET_VERSION=2.47.511 PRODUCT_SHA="$P01_EXACT_SHA" bash "$VF_R5_SCRIPT_PATH"
          echo P01_511_CANDIDATE_BASELINE_510_EXACT_FULL_ATOMIC_ROLLBACK=PASS
      - name: Clean transient private P01 checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p01-exact
          test ! -e p01-exact
          echo P01_511_CANDIDATE_PRIVATE_SOURCE_CLEANED=YES
