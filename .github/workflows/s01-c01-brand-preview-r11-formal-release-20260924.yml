name: S01 Theme 1.35.38 Brand Preview Layout R11 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  theme-release:
    if: github.head_ref == 'task/s01-c01-brand-preview-r11-formal-release-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-theme
      SHA: 2ba8f5efdb751b5363978650f017b54047342cdd
      VERSION: 1.35.38
      TAG: v1.35.38
      ASSET: vf-tools-theme_V1.35.38.zip
      PREVIOUS_TAG: v1.35.37
      PREVIOUS_ASSET: vf-tools-theme_V1.35.37.zip
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact Theme main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2ba8f5efdb751b5363978650f017b54047342cdd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Verify Theme exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.38' theme/src/style.css
          grep -Fq 'V1.35.38_S01_BRAND_PREVIEW_LAYOUT_R11' theme/src/style.css
          grep -Fq "VF_THEME_VERSION', '1.35.38'" theme/src/inc/runtime-constants.php
          grep -Fq "VF_THEME_ROUND', 'V1.35.38_S01_BRAND_PREVIEW_LAYOUT_R11'" theme/src/inc/runtime-constants.php
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          php theme/tests/s01-c01-local-nav-alignment-r2-contract.php
          php theme/tests/s01-c01-content-alignment-r3-contract.php
          php theme/tests/s01-c01-special-surface-r4-contract.php
          php theme/tests/s01-c01-page-visual-closure-r5-contract.php
          grep -Fq 'R10 · OWNER Production desktop shell gutter parity' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'body.vf-theme-admin-screen #wpcontent' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'padding-left:20px!important' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R11 · OWNER Production brand preview rail closure' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'minmax(360px,400px)!important' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq '@media(min-width:901px) and (max-width:1180px)' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' theme/docs/authority/SSOT.md
          grep -Fq 'Post-release OWNER REAL USE = REQUIRED_FOR_FINAL_UX_CLOSURE' theme/docs/authority/SSOT.md
          python3 - <<'PY'
          import json
          d=json.load(open('theme/src/theme.json'))
          assert d['version']==3
          assert d['settings']['custom']['vfThemeVersion']=='1.35.38'
          assert d['settings']['custom']['vfPackageSyncRound']=='V1.35.38_S01_BRAND_PREVIEW_LAYOUT_R11'
          PY

      - name: Build and verify Theme package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tools-theme stage2/vf-tools-theme dist previous
          cp -a theme/src/. stage1/vf-tools-theme/
          cp -a theme/src/. stage2/vf-tools-theme/
          rm -f stage1/vf-tools-theme/README.md stage1/vf-tools-theme/CHANGELOG.md
          rm -f stage2/vf-tools-theme/README.md stage2/vf-tools-theme/CHANGELOG.md
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage1/vf-tools-theme -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('stage1/vf-tools-theme')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              base=Path(rel).name.lower()
              if base in {'readme.md','changelog.md','license','license.txt'}:return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel=='style.css' or rel.lower().endswith('.php')
              return re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel) is not None
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/theme_runtime_count').write_text(str(len(rows)))
          Path('/tmp/theme_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tools-theme)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tools-theme)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "dist/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.38'
          unzip -p "dist/$ASSET" vf-tools-theme/inc/runtime-constants.php | grep -Fq "VF_THEME_VERSION', '1.35.38'"
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/theme_sha
          stat -c '%s' "dist/$ASSET" > /tmp/theme_bytes

      - name: Previous Theme release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.37'

      - name: Publish and read back Theme release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/theme-notes.md <<EOF
          # VF Tools Theme V1.35.38
          S01-C01 Brand Preview Layout R11.
          - OWNER Production screenshots confirm the shared OPS / M3U8 / Theme top shell is aligned; this release leaves that shell geometry unchanged.
          - Fixes the Theme Brand page preview/save rail that was squeezed by a later compact page rule, restoring a readable 360–400px desktop rail and a two-row preview header.
          - Exact Theme Browser Gate 35993308825 PASS across 8 Theme admin pages × 390 / 768 / 1440; follow-up exact Theme job 107612794667 in run 35993471910 PASS with computed Brand preview geometry assertions.
          - Presentation-only; no Theme settings, Theme Mods, renderer, updater protocol, data or schema migration.
          - Post-release OWNER Production visual/use verification remains REQUIRED_FOR_FINAL_UX_CLOSURE.
          - Rollback source: $PREVIOUS_TAG.
          - OWNER explicitly instructed direct completion through release/production without further intermediate confirmation.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools Theme $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/theme-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/theme_bytes)"
          lsha="$(cat /tmp/theme_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/theme-readback && mkdir -p /tmp/theme-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/theme-readback --clobber
          test "$(sha256sum "/tmp/theme-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/theme-readback/$ASSET"
          cat > /tmp/theme-release-receipt.json <<EOF
          {"component_id":"S01-C01","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/theme_runtime_count),"runtime_fingerprint":"$(cat /tmp/theme_runtime_fp)","owner_direct_release_authorization":"YES","remote_readback":"PASS"}
          EOF

      - name: Upload Theme release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13538-formal-release-${{ github.run_id }}
          path: /tmp/theme-release-receipt.json
          if-no-files-found: error
          retention-days: 30

