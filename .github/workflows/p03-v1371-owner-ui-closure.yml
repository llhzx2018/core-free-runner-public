name: P03 V1.37.1 Owner UI Closure Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1371-owner-ui-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: c7bc5216af5363b4524611595418e8e67edb55e6

jobs:
  ui-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private V1.37.1 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p03

      - name: Chromium owner screenshot closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > owner-ui-closure.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const css=['public/assets/experience.css','public/assets/project-intelligence.css','public/assets/project-intelligence-shell.css'].map(p=>fs.readFileSync(p,'utf8')).join('\n');
          const browser=await chromium.launch({headless:true});

          // Screenshot 1: dense desktop sidebar at the exact reported viewport size.
          const p1=await browser.newPage({viewport:{width:1319,height:652}});
          const projects=Array.from({length:16},(_,i)=>`<button class="nav-item project-shortcut"><span>P${i+1} · Project ${i+1}</span></button>`).join('');
          await p1.setContent(`<!doctype html><style>${css}</style><div class="app-shell"><aside class="sidebar"><button class="brand"><strong>VF Forge</strong></button><nav class="primary-nav"><button class="nav-item">概览</button><button class="nav-item">项目</button><button class="nav-item">关注</button><button class="nav-item">动态</button><button class="nav-item">关系</button></nav><div class="sidebar-divider"></div><div class="sidebar-label">当前项目</div><div id="projectShortcuts">${projects}</div><div class="sidebar-spacer"></div><button class="nav-item settings-entry">设置</button><div class="runtime-card"><span>Runtime</span><strong>V1.37.1</strong><small>Schema 30 · Storage NONE</small></div><button class="nav-item logout-entry">退出</button></aside><main class="main-shell"></main></div>`);
          const before=await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts'),r=document.querySelector('.runtime-card').getBoundingClientRect(),s=document.querySelector('.settings-entry').getBoundingClientRect(),l=document.querySelector('.logout-entry').getBoundingClientRect(),n=document.querySelector('.primary-nav').getBoundingClientRect();return{client:x.clientHeight,scroll:x.scrollHeight,top:x.scrollTop,runtimeBottom:r.bottom,settingsTop:s.top,logoutBottom:l.bottom,navTop:n.top,overflow:getComputedStyle(x).overflowY}});
          if(before.overflow!=='auto'||before.scroll<=before.client||before.runtimeBottom>652.5||before.logoutBottom>652.5)throw new Error('sidebar precondition '+JSON.stringify(before));
          await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts');x.scrollTop=x.scrollHeight});
          await p1.waitForTimeout(30);
          const after=await p1.evaluate(()=>{const x=document.querySelector('#projectShortcuts'),r=document.querySelector('.runtime-card').getBoundingClientRect(),s=document.querySelector('.settings-entry').getBoundingClientRect(),l=document.querySelector('.logout-entry').getBoundingClientRect(),n=document.querySelector('.primary-nav').getBoundingClientRect();return{top:x.scrollTop,runtimeBottom:r.bottom,settingsTop:s.top,logoutBottom:l.bottom,navTop:n.top}});
          if(after.top<=0||after.runtimeBottom>652.5||after.logoutBottom>652.5||Math.abs(after.navTop-before.navTop)>.5||Math.abs(after.settingsTop-before.settingsTop)>.5)throw new Error('sidebar scroll '+JSON.stringify(after));
          console.log('OWNER_SCREENSHOT_1_SIDEBAR=PASS',JSON.stringify({before,after}));

          // Screenshot 2: a real project context can have zero Authority rows.
          const p2=await browser.newPage({viewport:{width:1319,height:652}}); const errors=[]; p2.on('pageerror',e=>errors.push(String(e.message||e)));
          await p2.setContent(`<!doctype html><body><div id="toast"></div><div id="app"><button data-route="overview">概览</button><button data-route="projects"><b id="navProjectCount"></b></button><button data-route="attention"><b id="navAttentionCount"></b></button><button data-route="activity">动态</button><button data-route="relations">关系</button><button data-route="search">搜索</button><button id="toolsite" data-open-project="7">VF ToolSite</button><div id="breadcrumb"></div><div id="view" tabindex="-1"></div></div></body>`);
          await p2.evaluate(()=>{const json=(body,status=200)=>Promise.resolve(new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}}));window.fetch=(url)=>{const u=new URL(String(url),'http://forge.local/'),a=u.searchParams.get('action');if(a==='portfolio')return json({ok:true,data:{projects:[],attention:[],recent_activity:[]}});if(a==='project')return json({ok:true,data:{context:{project:{id:7,code:'S01',name:'VF ToolSite',description:'无 Authority 项目'},production:null,current_state:'正常项目上下文',requires_user:false,block:'',health_attention:{}},sources:[],truth:{truth:{}},decisions:[],relations:[],activity:[],declaration:{schema_version:30,lifecycle:'STABLE_OPERATIONS'}}});if(a==='activity')return json({ok:true,events:[]});if(a==='relations')return json({ok:true,relations:[]});return json({ok:true,results:[]})}});
          await p2.addScriptTag({path:path.resolve('public/assets/project-intelligence.js')});
          await p2.waitForTimeout(850); await p2.click('#toolsite'); await p2.waitForTimeout(200);
          const state=await p2.evaluate(()=>({crumb:document.querySelector('#breadcrumb')?.textContent||'',text:document.querySelector('#view')?.textContent||'',toast:document.querySelector('#toast')?.textContent||'',cls:document.querySelector('#toast')?.className||''}));
          if(errors.length)throw new Error('pageerror '+errors.join(' | '));
          if(!state.crumb.includes('VF ToolSite')||!state.text.includes('VF ToolSite')||state.text.includes('无法恢复项目上下文')||state.toast.includes('canonical_url')||state.cls.includes('error'))throw new Error('null Authority '+JSON.stringify(state));
          if(state.text.includes('打开 Production')||state.text.includes('GitHub ↗'))throw new Error('missing Authority link rendered');
          console.log('OWNER_SCREENSHOT_2_NULL_AUTHORITY=PASS',JSON.stringify(state));
          await browser.close();
          EOF
          node owner-ui-closure.mjs

      - name: Final owner UI evidence
        shell: bash
        run: |
          echo 'P03_V1371_OWNER_UI_CLOSURE=PASS'
          echo "P03_COMMIT=$P03_COMMIT"
          echo 'VIEWPORT=1319x652'
          echo 'PROJECT_SHORTCUT_SCROLL=PASS'
          echo 'SETTINGS_RUNTIME_LOGOUT_FIXED=PASS'
          echo 'NULL_AUTHORITY_SAFE_DEGRADE=PASS'
          echo 'PRODUCTION_WRITE=NO'
