name: TEMP P01 Home R8 V2.47.107 exact gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-home-r8-v247107-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-home-r8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: bbee4392184261ac664fb1eb0c44a9dd789071fb
      BASELINE_SHA: 321fc5a4395fe397c5a2ab5ee516de93d8c0cbb9
      VERSION: 2.47.107
    steps:
      - name: Checkout verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_HOME_R8_RUNTIME=PASS

      - name: Resolve exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/p01-home-r8-candidate /tmp/p01-home-r8-baseline
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-r8-candidate
          git -C /tmp/p01-home-r8-candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C /tmp/p01-home-r8-candidate checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-home-r8-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < /tmp/p01-home-r8-candidate/VERSION)" = "$VERSION"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-r8-baseline
          git -C /tmp/p01-home-r8-baseline fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C /tmp/p01-home-r8-baseline checkout -q --detach FETCH_HEAD
          echo P01_HOME_R8_EXACT_SOURCE=PASS

      - name: Focused Home R8 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-r8-candidate
          php -l src/app/FunctionalHome.php >/dev/null
          php tests/unit/frontend_home_r8_douban_contract.php
          php tests/unit/home_page_full_polish_contract.php
          php tests/unit/frontend_home_navigation_r2_contract.php
          php tests/unit/home_recent_operations_signal_contract.php
          php tests/unit/frontend_subsite_shell_v247106_contract.php
          php tests/unit/public_global_nav_contract.php
          python3 - <<'PY'
          from pathlib import Path
          for path in ['src/assets/frontend-home-r8.css','src/assets/frontend-mature.css']:
              s=Path(path).read_text(encoding='utf-8')
              depth=0
              for c in s:
                  if c=='{': depth+=1
                  elif c=='}': depth-=1
                  if depth<0: raise SystemExit(path+':CSS_BRACE_UNDERFLOW')
              if depth!=0: raise SystemExit(path+':CSS_BRACE_UNBALANCED')
          print('P01_HOME_R8_CSS_STRUCTURE=PASS')
          PY
          echo P01_HOME_R8_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-r8-candidate
          bash tests/canonical_release_regression.sh /tmp/p01-home-r8-candidate /tmp/p01-home-r8-baseline --require-zero-debt | tee /tmp/p01-home-r8-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-home-r8-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-home-r8-canonical.txt
          echo P01_HOME_R8_EXACT_GATE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/p01-home-r8-candidate /tmp/p01-home-r8-baseline /tmp/p01-home-r8-canonical.txt
