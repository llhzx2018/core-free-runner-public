name: S01 Theme 1.35.20 Core Candidate
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-theme-13520-core-candidate-20260907.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BRANCH: work/s01-theme-13520-distribution-20260907
      CORE_BASE: 9e2f1fd8b7a7d384ea183aabe98fbd807e5f7e5b
      THEME_SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
    steps:
      - name: Prepare exact C01 distribution candidate
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${CORE_REPO}.git" core
          cd core
          git checkout -q "$CORE_BRANCH"
          test "$(git rev-parse HEAD)" = "$CORE_BASE"
          test "$(git rev-parse origin/main)" = "$CORE_BASE"
          test "$(git hash-object projects/S01-C01.json)" = '356ab3d7deaeed9c55886ec8e3f6e2d82e87aa60'
          test "$(git hash-object projects/S01-C02.json)" = '2896cb2d284d3c1d3ded8cd189b20049bef15d5a'
          test "$(git hash-object projects/S01-C03.json)" = '5d27495f15ceb92581eb1cd227770b2d02158d4b'
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.20 --jq '.object.sha')" = "$THEME_SHA"
          gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.20 >/tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r '.id' /tmp/release.json)" = '384474577'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.id' /tmp/release.json)" = '549951469'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.size' /tmp/release.json)" = '1806453'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.digest' /tmp/release.json)" = 'sha256:779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('projects/S01-C01.json')
          c=json.loads(p.read_text())
          assert c['target_version']=='1.35.19'
          assert c['release_tag']=='v1.35.19'
          assert c['asset_sha256']=='89c3217ded3fb220caa1a934cbc37cea5187edbb69f7b254b3fc1adb794f4f22'
          assert c['runtime_files']==446
          assert c['runtime_fingerprint']=='9113186c89e972aa668cb5c0fb52960a9dfd0302969f3a67ed750455fb9685d6'
          old=c['target_version']
          if old not in c['from_versions']: c['from_versions'].append(old)
          c.update({
            'target_version':'1.35.20',
            'release_tag':'v1.35.20',
            'asset_name':'vf-tools-theme_V1.35.20.zip',
            'asset_bytes':1806453,
            'asset_sha256':'779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1',
            'runtime_files':446,
            'runtime_fingerprint':'ec60d9d98b6a7406ff17d91367c03918034ac438970bc441b74b90b589508e3c',
            'released_at':'2026-09-08T05:51:05Z',
            'notes':'S01-C01 1.35.20 UNIFIED UPDATE CENTER INTERNAL-ID CLOSURE. Exact released source 1447c67febf1d3d456ca0e51d2c7c78063f79ae7. The single Tools → VF 在线更新 entry no longer exposes internal S01-C01/S01-C02/S01-C03 component IDs in default-visible card chrome; human-facing theme/plugin type badges remain, while internal component registry IDs and component-* anchors are preserved for routing and bookmark compatibility. Updater mechanics, token storage, recovery behavior, public rendering and component boundaries remain unchanged. Candidate Gate 34191846183 PASS; Identity Inventory 34191939034 PASS; Bump Gate 34191979590 PASS; Formal Release 34192183819 PASS. Release ID 384474577; asset ID 549951469; delivered asset 1806453 bytes / SHA256 779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1. Delivered Runtime Authority probe 34192255496 PASS: 446 files / ec60d9d98b6a7406ff17d91367c03918034ac438970bc441b74b90b589508e3c. Direct upgrade eligibility from 1.35.8 through 1.35.19 is preserved. Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS.'
          })
          assert c['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14','1.35.15','1.35.16','1.35.17','1.35.18','1.35.19']
          assert c['schema_from']==c['schema_to']=='N/A'
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          jq -e . projects/S01-C01.json >/dev/null
          python3 scripts/check_manifest_contract.py >/tmp/contract.json
          jq -e '.status=="PASS"' /tmp/contract.json >/dev/null
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          test "$(git hash-object projects/S01-C02.json)" = '2896cb2d284d3c1d3ded8cd189b20049bef15d5a'
          test "$(git hash-object projects/S01-C03.json)" = '5d27495f15ceb92581eb1cd227770b2d02158d4b'
          git diff --name-only "$CORE_BASE" | sort >/tmp/actual
          printf '%s\n' projects/S01-C01.json >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/S01-C01.json
          git commit -m 'S01: stage Theme 1.35.20 update channel'
          git push -q origin HEAD:"$CORE_BRANCH"
          echo "CORE_C01_13520_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C01_13520_CORE_CANDIDATE'
