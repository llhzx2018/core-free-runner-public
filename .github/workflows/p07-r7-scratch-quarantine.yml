name: P07 R7 scratch-only guarded SQL quarantine exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-r7-scratch-quarantine.yml'
      - 'experiments/p07-r7/**'
permissions:
  contents: read
jobs:
  r7-scratch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact R7 product candidate code bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release111"
          test "$(git hash-object experiments/p07-r7/lib/scratch_guard_quarantine.py)" = e7f79925db850765677c8f3e7cc55fe7cf9069a7
          test "$(git hash-object experiments/p07-r7/lib/native_scratch_restore.py)" = 679133d30387c4a7c35369a591139a8d508c3992
          test "$(git hash-object experiments/p07-r7/lib/server_migration_pull.py)" = fd9a3cd7e366f0914e86a71a062fe16be6e46398
          test "$(git hash-object experiments/p07-r7/tests/test_scratch_guard_quarantine.py)" = b0cef8c061aa152f9d1f174505736c469db1d47c
          test "$(git hash-object experiments/p07-r7/lib/private_recovery_gate.py)" = f28aedfba4caf1788d7e6266a809141601228025
          test "$(git hash-object experiments/p07-r7/lib/restore_sql_preflight.py)" = d8b976616842685a43338fcbb47d22fb47e0664d
          test "$(git hash-object experiments/p07-r7/lib/migration_remainder.py)" = 36c4166d5b06c0ef2491d60ae9c5ed134352d351
          test "$(git hash-object experiments/p07-r7/lib/isolated_db_restore.py)" = 5335e38db04e1653027076ce8399c946ea824465
          test "$(git hash-object experiments/p07-r7/tests/test_native_scratch_restore.py)" = 781922e62dd7040de2a25f51480456c34ac91932
          test "$(git hash-object experiments/p07-r7/tests/test_private_recovery_gate.py)" = 47bf70e75587c7816918bc60a8156f7e4fdcbaea
          test "$(git hash-object experiments/p07-r7/tests/test_restore_sql_preflight.py)" = 268c8dbb435796cfc14f0e11d590bad2e299d89e
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-r7"
          for path in lib/scratch_guard_quarantine.py lib/native_scratch_restore.py lib/server_migration_pull.py lib/private_recovery_gate.py lib/restore_sql_preflight.py lib/migration_remainder.py lib/isolated_db_restore.py tests/test_scratch_guard_quarantine.py tests/test_native_scratch_restore.py tests/test_private_recovery_gate.py tests/test_restore_sql_preflight.py; do
            cp "experiments/p07-r7/$path" "$RUNNER_TEMP/p07-r7/$path"
          done
          cd "$RUNNER_TEMP/p07-r7"
          python3 -m py_compile lib/scratch_guard_quarantine.py lib/native_scratch_restore.py lib/server_migration_pull.py tests/test_scratch_guard_quarantine.py
          echo P07_R7_EXACT_SOURCE_PASS
      - name: Quarantine grammar, immutable backup, no cutover tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r7"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_scratch_guard_quarantine.R7QuarantineTests \
            tests.test_restore_sql_preflight \
            tests.test_native_scratch_restore.NativeRestoreContractTests \
            tests.test_private_recovery_gate
          echo P07_R7_QUARANTINE_SAFETY_PASS
      - name: Real native scratch import after removing guarded SQL from stdin ONLY
        shell: bash
        env:
          P07_R7_NATIVE_QUARANTINE_ENGINE: "1"
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-server mariadb-client >/dev/null
          cd "$RUNNER_TEMP/p07-r7"
          PYTHONPATH=lib python3 -m unittest -v tests.test_scratch_guard_quarantine.R7ScratchNativeIntegration
          sudo env PYTHONPATH=lib P07_R7_NATIVE_QUARANTINE_ENGINE=1 python3 -m unittest -v tests.test_scratch_guard_quarantine.R7ScratchNativeIntegration
          test -z "$(find /tmp -maxdepth 1 -type d -name 'vfops-r5-*' -print -quit)"
          echo P07_R7_NATIVE_QUARANTINED_IMPORT_CLEANUP_PASS
      - name: Old restore and production SQL guards remain unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r7"
          PYTHONPATH=lib python3 -m unittest -v tests.test_migration_no_overwrite_resume tests.test_sql_pk_conflict_evidence
          for path in lib/cloudpanel.py lib/restore_apply_core.py lib/verify.py lib/package_core.py lib/server_migration.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$path")" = "$(git hash-object "$path")"
          done
          echo P07_R7_ORIGINAL_DB_WRITERS_UNCHANGED_PASS
