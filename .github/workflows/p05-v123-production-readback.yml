name: P05 V1.2.3 Production Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-v123-production-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    if: github.head_ref == 'test/p05-v123-production-readback-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read Production health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --connect-timeout 10 --max-time 20 https://seo.kewaro.com/api/health > /tmp/health.json
          php -r '$v=json_decode(file_get_contents($argv[1]),true,32,JSON_THROW_ON_ERROR); if(($v["ok"]??false)!==true) exit(1); if(($v["version"]??"")!=="1.2.3") exit(2); if((string)($v["schema"]??"")!=="1") exit(3); if(($v["database"]??"")!=="READY") exit(4); if(($v["process"]??"")!=="READY") exit(5);' /tmp/health.json
          echo 'P05_PRODUCTION_VERSION=1.2.3'
          echo 'P05_PRODUCTION_SCHEMA=1'
          echo 'P05_PRODUCTION_DATABASE=READY'
          echo 'P05_PRODUCTION_PROCESS=READY'

      - name: Confirm legacy bridge cleaned
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/bridge.out -w '%{http_code}' --connect-timeout 10 --max-time 20 https://seo.kewaro.com/P05_V1.2.2_TO_UNIFIED_UPDATE_BRIDGE.php)"
          test "$code" = "404"
          echo 'P05_LEGACY_BRIDGE_CLEANED=PASS'

      - name: Confirm public site responds
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 https://seo.kewaro.com/)"
          test "$code" = "200"
          echo 'P05_PRODUCTION_ROOT_HTTP=200'
          echo 'P05_PRODUCTION_WRITE=0'
