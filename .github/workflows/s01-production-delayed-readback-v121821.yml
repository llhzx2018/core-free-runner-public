name: S01 delayed production readback v1.21.821
on:
  push:
    branches:
      - temp/s01-c02-production-readback-20260904-current
    paths:
      - '.github/workflows/s01-production-delayed-readback-v121821.yml'
jobs:
  delayed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for browser worker recovery window and read Production
        shell: bash
        run: |
          set -euo pipefail
          echo 'WAITING_110_SECONDS_FOR_V121821_RECOVERY_WINDOW'
          sleep 110
          for item in \
            'domain|https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' \
            'static|https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness'; do
            name="${item%%|*}"; url="${item#*|}"; out="/tmp/${name}.json"
            code="$(curl -sS --retry 2 --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' "$url")"
            echo "${name}_HTTP=${code}"
            test "$code" = 200
            jq -e . "$out" >/dev/null
            echo "--- ${name} ---"
            jq -c . "$out"
          done
          echo PASS_DELAYED_V121821_PRODUCTION_READBACK
