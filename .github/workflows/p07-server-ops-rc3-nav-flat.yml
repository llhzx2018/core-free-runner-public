name: P07 Server Ops RC3 Navigation Flattening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_common.sh'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_ui_complete.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - '.github/workflows/p07-server-ops-rc3-nav-flat.yml'
  pull_request:
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_common.sh'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_ui_complete.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - '.github/workflows/p07-server-ops-rc3-nav-flat.yml'

permissions:
  contents: read

jobs:
  navigation-flat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build guided-init13 combined runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-nav-flat
          mkdir -p /tmp/p07-nav-flat
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-nav-flat/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-nav-flat/
          mkdir -p /tmp/p07-nav-flat/tests
          cp dist/p07/0.1.0-rc3/tests/test_cloudpanel_ui_complete.py /tmp/p07-nav-flat/tests/
          cp dist/p07/0.1.0-rc3/tests/test_menu3_modular.py /tmp/p07-nav-flat/tests/
          test "$(cat /tmp/p07-nav-flat/BUILD_ID)" = '0.1.0-rc3-guided-init13'

      - name: Verify source-exact navigation identities
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/p07-nav-flat/BUILD_ID)" = '2d34fdf9e3fc99310e7ff2d56396c422f72593b9'
          test "$(git hash-object /tmp/p07-nav-flat/bin/vfops-user)" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui)" = '378412db5abba18dd6bc8f6f7125fa1098d765d8'
          test "$(git hash-object /tmp/p07-nav-flat/lib/cloudpanel_ui_common.sh)" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object /tmp/p07-nav-flat/tests/test_cloudpanel_ui_complete.py)" = 'fdbbe854461765ef55bc40b39d1865f294611c95'
          test "$(git hash-object /tmp/p07-nav-flat/tests/test_menu3_modular.py)" = '3901f11e58d8f0f7ed8265fa8ff66a5a4ed4b1a9'

      - name: Shell syntax and static navigation tests
        run: |
          set -euo pipefail
          bash -n /tmp/p07-nav-flat/bin/vfops-user
          bash -n /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui
          bash -n /tmp/p07-nav-flat/lib/cloudpanel_ui_common.sh
          cd /tmp/p07-nav-flat
          python3 tests/test_cloudpanel_ui_complete.py -v
          python3 tests/test_menu3_modular.py -v

      - name: Prove selected site is reused until explicit change
        run: |
          set -euo pipefail
          cp /tmp/p07-nav-flat/bin/vfops /tmp/p07-nav-flat/bin/vfops.real
          cat >/tmp/p07-nav-flat/bin/vfops <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == inventory ]]; then
            cat <<'JSON'
          {"sites":[{"domain":"one.example.test","site_user":"siteone","site_root":"/home/siteone/htdocs/one.example.test","document_root":"/home/siteone/htdocs/one.example.test","runtime":{"type":"php","version":"8.4"},"mysql_databases":["dbone"],"sqlite_paths":[],"ssl":{"configured":true,"days_remaining":30}},{"domain":"two.example.test","site_user":"sitetwo","site_root":"/home/sitetwo/htdocs/two.example.test","document_root":"/home/sitetwo/htdocs/two.example.test","runtime":{"type":"php","version":"8.4"},"mysql_databases":[],"sqlite_paths":[],"ssl":{"configured":false,"days_remaining":"UNKNOWN"}}]}
          JSON
            exit 0
          fi
          exec "$(dirname "$0")/vfops.real" "$@"
          SH
          chmod +x /tmp/p07-nav-flat/bin/vfops

          printf '1\n1\n\n3\n\n0\n' | bash /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui site > /tmp/site-reuse.txt
          test "$(grep -Fc '请选择网站' /tmp/site-reuse.txt)" -eq 1
          grep -Fq '当前网站：one.example.test' /tmp/site-reuse.txt
          grep -Fq '域名：one.example.test' /tmp/site-reuse.txt
          grep -Fq 'dbone' /tmp/site-reuse.txt

          printf '1\n98\n2\n0\n' | bash /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui site > /tmp/site-change.txt
          test "$(grep -Fc '请选择网站' /tmp/site-change.txt)" -eq 2
          grep -Fq '当前网站：two.example.test' /tmp/site-change.txt

      - name: Verify direct Slot3 routing and safety boundary
        run: |
          set -euo pipefail
          printf '0\n' | bash /tmp/p07-nav-flat/bin/vfops-user > /tmp/slot3.txt
          grep -Fq '6. 网站管理' /tmp/slot3.txt
          grep -Fq '7. CloudPanel 管理' /tmp/slot3.txt
          grep -Fq '请选择 [0-7]' /tmp/slot3.txt
          grep -Fq 'run_module "$CLOUDPANEL_UI" site' /tmp/p07-nav-flat/bin/vfops-user
          grep -Fq 'run_module "$CLOUDPANEL_UI" admin' /tmp/p07-nav-flat/bin/vfops-user
          for forbidden in 'site:delete' 'db:delete' 'user:delete' 'REAL_PASS'; do
            ! grep -Fq "$forbidden" /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui
          done
          grep -Fq '不自动修改 DNS' /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui
          grep -Fq '不删除 SOURCE' /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui
          grep -Fq '不覆盖已有 TARGET' /tmp/p07-nav-flat/bin/vfops-cloudpanel-ui

      - name: Result
        run: echo 'P07_RC3_NAVIGATION_FLATTENING_MACHINE=PASS'
