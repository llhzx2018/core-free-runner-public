name: TEMP skill-book V4.6 Governance Reconcile V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v46-governance-reconcile-v2.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Reconcile exact V4.6 pointers and read back
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          git clone --depth 1 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" gov
          cd gov
          python3 - <<'PY'
          from pathlib import Path

          p=Path('CURRENT.md')
          s=p.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4` 为保留的历史 Candidate，`V4.5` 为最新 Candidate；六者均未晋升 Source Current，也未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5` 为保留的历史 Candidate，`V4.6` 为最新 Candidate；七者均未晋升 Source Current。V4.6 已进入 Candidate Distribution，但未进入 Current Distribution。'
          assert s.count(old)==1, f'CURRENT old pointer count={s.count(old)}'
          s=s.replace(old,new)
          assert '| skill-book | V3.5 | V4.5 CANDIDATE（非 Current） |' in s
          p.write_text(s,encoding='utf-8')

          p=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          s=p.read_text(encoding='utf-8')
          marker='## Candidate（不改变 Current）'
          assert s.count(marker)==1, f'candidate marker count={s.count(marker)}'
          head=s.split(marker,1)[0]
          block="""## Candidate（不改变 Current）

`skill-book V4.6` 是最新 `CANDIDATE / NOT CURRENT`；Source Current 仍为 V3.5，且 V4.6 不包含在 Current 总包中。Installed Runtime Observation 在用户实际更新前仍为 V4.5。

- [直接下载 skill-book V4.6 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v4.6-candidate-20260827/skill-book_V4.6_CANDIDATE_20260827.zip)
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/skill-book-v4.6-candidate-20260827/skill-book_V4.6_CANDIDATE_20260827.zip.sha256)
- [查看 V4.6 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/skill-book-v4.6-candidate-20260827)
- [查看 V4.6 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.6)
- [查看 V4.6 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md)
- [查看 V4.6 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.6/README.md)

Published Distribution Identity：

- Bytes：`57864`
- SHA-256：`edb4c3a25a46f652424787888bad8bb2e02e615c58c9684a38aba46b981049a3`
- Release ID：`377727178`
- Remote Asset ID：`532119477`
- SHA Asset ID：`532119475`
- Exact Source Commit：`27ca368b9f7bc8d6160ff5049562c74cb440144b`
- Runner Run：`33062040916`
- Runner Job：`98482926278`
- Unit Tests：`27/27 PASS`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Status：`PUBLISHED_REMOTE_VERIFIED`

发布前本地构建 SHA `aa7909d64928dfe59ec0aee8383d3d1efd89ad67aa92ffaf847a2ce9e43b5d4e` 只保留为 pre-release local build identity；正式 Candidate Distribution 以远端回读验证通过的 `edb4c3a25a46f652424787888bad8bb2e02e615c58c9684a38aba46b981049a3` 为 Authority。

历史 Candidate：

- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
"""
          p.write_text(head+block,encoding='utf-8')
          PY
          changed="$(git diff --name-only | sort)"
          test "$changed" = "$(printf '%s\n%s' 'CURRENT.md' 'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')"
          grep -Fq '`V4.6` 为最新 Candidate' CURRENT.md
          grep -Fq 'edb4c3a25a46f652424787888bad8bb2e02e615c58c9684a38aba46b981049a3' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          git config user.name 'VF Release Automation'
          git config user.email 'release@kewaro.com'
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          git commit -m 'skill-book: reconcile V4.6 candidate distribution authority'
          commit="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/llhzx2018/gov-doc.git"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$commit"
          git show 'origin/main:CURRENT.md' | grep -Fq '`V4.6` 为最新 Candidate'
          git show 'origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md' | grep -Fq 'edb4c3a25a46f652424787888bad8bb2e02e615c58c9684a38aba46b981049a3'
          echo "V46_GOV_DOC_RECONCILE_COMMIT=$commit"
          echo 'V46_GOVERNANCE_REMOTE_READBACK=PASS'
