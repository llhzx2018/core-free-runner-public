name: P07 M03 release142 published clean first install independent proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-142-clean-install-proof-20261120.yml'
permissions:
  contents: read
jobs:
  final-first-install:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      P07_RELEASE: 'p07-m03-v0.1.0-release142-20261120'
      P07_PACKAGE: 'P07-M03-0.1.0-release142.zip'
      P07_PACKAGE_SHA: 'dc6978463e8e73a224e7cccb2bdffe9710bc3bb478076b670703bbb164bda87e'
      P07_WRAPPER_BLOB: '1f10b7ce1d87b4b806cdd78455bfdbcf17276876'
      P07_RUNTIME_BLOB: 'cc3d90839bf71ea9139f5fc0d1c6cb12403b58e0'
      P07_PROVEN_PUBLIC_MAIN: 'd9e24d24a69b11505fb32db550d785b01e1d72e4'
    steps:
      - name: Checkout public code without credential retention
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind already-merged public main and unchanged release pins
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "$P07_PROVEN_PUBLIC_MAIN^{commit}"
          test "$(git cat-file blob "$P07_PROVEN_PUBLIC_MAIN:installers/p07-m03-release142-atomic.sh" | git hash-object --stdin)" = "$P07_WRAPPER_BLOB"
          python3 -B - <<'PY'
          import hashlib,pathlib,re,subprocess
          src=pathlib.Path("installers/p07-toolbox.sh").read_text()
          signed=pathlib.Path("installers/p07-m03-release142-atomic.sh").read_bytes()
          def blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          assert blob(signed)=="1f10b7ce1d87b4b806cdd78455bfdbcf17276876"
          assert 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release142"' in src
          assert 'VF_SERVER_OPS_INSTALLER_BLOB="1f10b7ce1d87b4b806cdd78455bfdbcf17276876"' in src
          assert 'VF_SERVER_OPS_MANIFEST_BLOB="cc3d90839bf71ea9139f5fc0d1c6cb12403b58e0"' in src
          for needle in ('M03_OFFICIAL141_BUILD="0.1.0-release141"',
                         'M03_OFFICIAL140_BUILD="0.1.0-release140"'):
              assert needle in src
          previous=subprocess.check_output(
              ["git","show","2e13f53bcda48a1ea069eb4386331d5af908d136:installers/p07-toolbox.sh"],text=True)
          for key in ("VF_NODE_EXPECTED","VPS_AUDIT_BUILD_EXPECTED",
                      "M04_BUILD_EXPECTED","M05_BUILD_EXPECTED",
                      "P07_M01_ZIP_SHA256","P07_M02_ZIP_SHA256","P07_M04_ZIP_SHA256",
                      "M05_INSTALLER_BLOB"):
              old=re.search("^"+key+r"=(.*)$",previous,re.M)
              now=re.search("^"+key+r"=(.*)$",src,re.M)
              assert old and now and old.group(1)==now.group(1),key
          print("P07_M03_142_PUBLIC_MAIN_AND_FOUR_OTHER_MODULE_PINS=PASS")
          PY
          bash -n installers/p07-toolbox.sh installers/p07-m03-release142-atomic.sh
      - name: Verify actual anonymous public toolbox bytes and official ZIP without token
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-142-clean-first"; mkdir -p "$w"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --connect-timeout 10 --max-time 90 \
            'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' -o "$w/public-toolbox.sh"
          cmp -s installers/p07-toolbox.sh "$w/public-toolbox.sh"
          bash -n "$w/public-toolbox.sh"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --connect-timeout 10 --max-time 120 \
            "https://github.com/llhzx2018/core-free-runner-public/releases/download/$P07_RELEASE/$P07_PACKAGE" -o "$w/published.zip"
          echo "$P07_PACKAGE_SHA  $w/published.zip" | sha256sum -c -
          echo P07_M03_142_ANONYMOUS_MAIN_TOOLBOX_AND_REAL_ZIP=PASS
      - name: Two truly empty isolated installations from signed public142 and canary preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-142-clean-first"
          for trial in fresh-one fresh-two; do
            root="$w/$trial"
            mkdir -p "$root/canaries"
            for module in m01 m02 m04 m05 website database dns; do
              printf 'keep-%s\n' "$module" > "$root/canaries/$module"
            done
            test ! -e "$root/current" && test ! -e "$root/previous"
            P07_INSTALL_DIR="$root/current" P07_PREVIOUS_DIR="$root/previous" \
            P07_BIN_LINK="$root/bin/vfops" P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
              bash installers/p07-m03-release142-atomic.sh install \
                > "$w/$trial.log" 2>&1 || {
                  echo "P07_M03_142_CLEAN_INSTALL=BLOCKED:$trial"
                  grep -E 'P07-M03|错误阶段|失败|拒绝' "$w/$trial.log" | tail -n 9 | cut -c1-160 || true
                  exit 1
                }
            test "$(cat "$root/current/BUILD_ID")" = 0.1.0-release142
            test ! -e "$root/previous" && test ! -e "$root/current.new"
            test "$(NO_COLOR=1 "$root/bin/vfops" --build-id)" = 0.1.0-release142
            test "$(NO_COLOR=1 "$root/bin/vfops" --version)" = "VF Server Ops 0.1.0"
            python3 -B - "$root/current" "$P07_RUNTIME_BLOB" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]);expected=sys.argv[2]
          blob=lambda raw:hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          manifest=root/".runtime-manifest.gitblob"
          assert manifest.is_file() and not manifest.is_symlink()
          assert blob(manifest.read_bytes())==expected
          names=set()
          for row in manifest.read_text().splitlines():
              want,rel=row.split("  ",1)
              assert rel not in names and ".." not in pathlib.PurePosixPath(rel).parts
              names.add(rel)
              path=root/rel
              assert path.is_file() and not path.is_symlink() and blob(path.read_bytes())==want
          assert "bin/vfops-migrate-ui" in names
          assert "components/p07-m03-migration-readiness.sh" in names
          assert len(names)>50
          print("P07_M03_142_REAL_FIRST_INSTALL_RUNTIME_MANIFEST=PASS")
          PY
            for module in m01 m02 m04 m05 website database dns; do
              test "$(cat "$root/canaries/$module")" = "keep-$module"
            done
            echo "P07_M03_142_FIRST_INSTALL=PASS:$trial"
          done
          echo P07_M03_142_NO_PRODUCTION_SQL_DNS_OR_OTHER_MODULE_CHANGES=PASS
      - name: Confirm bad inputs and occupied recovery fail closed on clean install
        shell: bash
        run: |
          set -Eeuo pipefail
          w="$RUNNER_TEMP/p07-142-clean-first"
          empty="$w/empty-bad-input";mkdir -p "$empty"
          if P07_ALLOW_NONROOT=1 P07_INSTALL_DIR="$empty/current" \
            P07_PREVIOUS_DIR="$empty/previous" P07_BIN_LINK="$empty/bin/vfops" \
            bash installers/p07-m03-release142-atomic.sh > "$w/bad-verb.log" 2>&1; then
            echo P07_M03_142_MISSING_INSTALL_VERB_ACCEPTED; exit 1
          fi
          test ! -e "$empty/current" && test ! -e "$empty/previous"
          blocked="$w/occupied-recovery";mkdir -p "$blocked/previous"
          printf 'untrusted\n' > "$blocked/previous/OWNER_CANARY"
          if P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 \
            P07_INSTALL_DIR="$blocked/current" P07_PREVIOUS_DIR="$blocked/previous" \
            P07_BIN_LINK="$blocked/bin/vfops" \
            bash installers/p07-m03-release142-atomic.sh install \
              > "$w/occupied.log" 2>&1; then
            echo P07_M03_142_UNVERIFIED_RECOVERY_ACCEPTED; exit 1
          fi
          test ! -e "$blocked/current"
          test "$(cat "$blocked/previous/OWNER_CANARY")" = untrusted
          echo P07_M03_142_EMPTY_INSTALL_NEGATIVE_AND_UNKNOWN_RECOVERY=PASS
      - name: Cleanup transient runtime and published ZIP
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p07-142-clean-first"
          echo P07_M03_142_CLEAN_INSTALL_WORKSPACE_CLEANED=YES
