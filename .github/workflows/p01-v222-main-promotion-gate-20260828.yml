name: P01 V2.22.0 Main Promotion Gate

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v222-main-promotion-gate-20260828.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      RELEASE_BRANCH: release/p01-v2.22.0-multi-surface-20260828
      CANDIDATE: 2c159b4b7ecfc03e79eff2e6103f7e2c768ded08
      CANDIDATE_TREE: 9116fe6cfc24d9a5a0a7070fb6af3f31bb079392
      CURRENT_MAIN: c8928cc68c41a42d7debc6e9074df7a95f2551ce
      ARTIFACT_GATE_RUN: '33142761396'
    steps:
      - name: Promotion identity fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse origin/main)" = "$CURRENT_MAIN"
          test "$(git -C product rev-parse origin/$RELEASE_BRANCH)" = "$CANDIDATE"
          test "$(git -C product rev-parse $CANDIDATE^{tree})" = "$CANDIDATE_TREE"
          git -C product merge-base --is-ancestor "$CURRENT_MAIN" "$CANDIDATE"
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:VERSION"))" = '2.22.0'
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:src/VERSION.txt"))" = '2.22.0'
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/${ARTIFACT_GATE_RUN}" >/tmp/p01-v222-artifact-run.json
          test "$(jq -r '.status' /tmp/p01-v222-artifact-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v222-artifact-run.json)" = success
          echo P01_V222_MAIN_PROMOTION_GATE=PASS
