name: TEMP S01-C02 Ops 1.21.823 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121823-update-channel-gate-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121823-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATES_REPO: llhzx2018/core-updates
      UPDATES_BASE: 2a67ee28080e562f2bb559f459b03905cc1a975e
      UPDATES_CANDIDATE: 098599b71c81c54b5c5a715455790c1c056831d9
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_COMMIT: e4bf4735f881fe733b04f309f9db517ebae71a34
      OPS_TREE: ce5818b23b5c1ba81959a4029c1b48647ec70fa7
      TAG: v1.21.823
      ASSET: vf-tools-ops_V1.21.823.zip
      BYTES: '3236216'
      SHA256: e3676c52243ba7f4d90972313ff12e8648221dadc821f1bb5ebd5b0d9577faca
      FILES: '905'
      FP: 2d28c59c35ae8257e1f29e7718f85076e70ffef259b9b22eb3cee0a0d8feb01a
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates

      - name: Verify manifest source scope and formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$R"
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_CANDIDATE"
          test "$(git -C updates merge-base "$UPDATES_BASE" "$UPDATES_CANDIDATE")" = "$UPDATES_BASE"
          git -C updates diff --name-only "$UPDATES_BASE" "$UPDATES_CANDIDATE" | sort >/tmp/changed.txt
          printf '%s\n' 'projects/S01-C02.json' >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

          M=updates/projects/S01-C02.json
          jq -e --arg sha "$SHA256" --arg fp "$FP" '.target_version=="1.21.823" and .from_versions==["1.21.822"] and .release_tag=="v1.21.823" and .asset_name=="vf-tools-ops_V1.21.823.zip" and .asset_bytes==3236216 and .asset_sha256==$sha and .runtime_files==905 and .runtime_file_count==905 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$M" >/dev/null
          grep -Fq 'Production Upgrade is NOT EXECUTED' "$M"
          grep -Fq 'no Candidate recreation or repeat Source ZIP upload is authorized' "$M"

          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$J")" = "$TAG"
          test "$(jq -r .draft <<<"$J")" = false
          test "$(jq -r .prerelease <<<"$J")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$J")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$J")" = "sha256:$SHA256"
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$OPS_COMMIT"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$OPS_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$OPS_TREE"
          done
          echo FORMAL_RELEASE_ASSET=PASS

      - name: Verify direct Production source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/domain.json
          CODE="$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$OUT" -w '%{http_code}' 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          test "$CODE" = 200
          jq -e '.pluginVersion=="1.21.822" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' "$OUT" >/dev/null
          echo DIRECT_SOURCE_1_21_822_ONLY=PASS
          echo PASS_V121823_UPDATE_CHANNEL_GATE
