name: P01 Current Develop Five Domain Visual Sweep
on:
  push:
    branches: [task/p01-current-develop-visual-sweep-20260831]
    paths: [.github/workflows/p01-current-develop-visual-sweep-20260831.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: d6372e9103a6a8b8fb6f4596c14a90bd5cc6bea2
      TREE: 13401c579b11ea78592826fed943036b06c9fa71
      ROOT: /tmp/p01-current-sweep
      EVID: /tmp/p01-current-sweep-evid
      PORT: '18431'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact current develop source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.35.0'
          php -l product/src/app/FunctionalHome.php >/dev/null
          echo P01_CURRENT_SWEEP_SOURCE=PASS
      - name: Fresh five-domain fixture with actionable Home health
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-current-sweep.cookies
          mkdir -p "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-current-sweep.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-current-sweep.cookies -b /tmp/p01-current-sweep.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-current-sweep-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-current-sweep-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-current-sweep.cookies -b /tmp/p01-current-sweep.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Current Develop Sweep' --data-urlencode 'admin_password=CurrentSweep2026' --data-urlencode 'admin_password_confirm=CurrentSweep2026' -o /tmp/p01-current-sweep-post.html
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          cat >/tmp/p01-current-sweep-seed.php <<'PHP'
          <?php
          require '/tmp/p01-current-sweep/app/bootstrap.php';
          require_once '/tmp/p01-current-sweep/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$ids=[];
          $ca=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $cb=$r->createCategory(['name'=>'常用服务','description'=>'','is_private'=>false]);
          for($i=1;$i<=8;$i++){$x=$r->saveLink(null,['category_id'=>$i%2?$ca:$cb,'title'=>'导航资源 '.$i,'url'=>'https://example.com/start-current-'.$i,'description'=>'日常使用的导航资源','tags'=>'工具,验证','is_private'=>$i===8,'is_favorite'=>$i<=2],'manual');$ids[]=(int)$x['id'];}
          foreach(['技术频道','商业频道','效率频道','设计频道','叙事频道','研究频道'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$ca,'title'=>$title,'url'=>'https://example.com/channel-current-'.$i,'description'=>'长期订阅频道','tags'=>'频道','is_private'=>$i===5,'is_favorite'=>$i===0],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>$i<3?'技术':'知识','surface_note'=>'适合持续关注','background_friendly'=>$i%2===0]);}
          foreach(['山海剧集','城市电影','历史纪录片','科幻剧集','喜剧电影','人物纪录片'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$cb,'title'=>$title,'url'=>'https://example.com/watch-current-'.$i,'description'=>'影视条目','tags'=>'影视','is_private'=>$i===5,'is_favorite'=>$i===1],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>$i%3===2?'纪录片':($i%2?'电影':'剧集'),'media_year'=>2021+$i,'media_status'=>$i%2?'watched':'watching','surface_note'=>'视觉验证条目']);}
          foreach(['独立网站出海指南','VPS 迁移专题','Web 安全学习路线','SEO 赚钱完整指南'] as $i=>$title){$x=$r->saveLink(null,['category_id'=>$ca,'title'=>$title,'url'=>'https://example.com/topic-current-'.$i,'description'=>'长期专题知识页','tags'=>'专题,指南','is_private'=>$i===3,'is_favorite'=>$i===0],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>$i%2?'学习路线':'指南','surface_note'=>'长期维护']);}
          $db=vf_db();$now=gmdate('c');$ins=$db->prepare("INSERT INTO link_health(link_id,status,http_status,last_checked_at,updated_at,ignore_auto) VALUES(?,?,?,?,?,0)");
          foreach([[$ids[0],'confirmed',410],[$ids[1],'suspected',404],[$ids[2],'temporary',503],[$ids[3],'restricted',403]] as [$id,$st,$code])$ins->execute([$id,$st,$code,$now,$now]);
          $hs=(new VfLinkHealth($db))->status();if((int)$hs['needsAction']!==3||(int)$hs['restrictedReview']!==1)exit(4);
          echo "P01_CURRENT_SWEEP_SEED=PASS\n";
          PHP
          php /tmp/p01-current-sweep-seed.php | grep -Fx P01_CURRENT_SWEEP_SEED=PASS
      - name: Capture 20 stable frames
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-current-sweep-pw
          cd /tmp/p01-current-sweep-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >audit.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:1000}});const login=await c.request.post('http://127.0.0.1:18431/api.php?action=login',{data:{password:'CurrentSweep2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');const p=await c.newPage(),routes=[['home','home.php'],['start','start.php'],['channels','channels.php'],['watch','watch.php'],['topics','topics.php']],metrics={};const read=()=>p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,nav:!!document.querySelector('.vf-global-domain-nav'),stage:Math.round(document.querySelector('.vf-app-stage')?.getBoundingClientRect().width||0),homeFirst:document.querySelector('.vf-home-status-grid>a')?.innerText.replace(/\s+/g,' ').trim()||'',homeRailFirst:document.querySelector('.vf-home-rail>.vf-home-section')?.className||''}));
          for(const [name,route] of routes){metrics[name]={};for(const [w,h,size] of [[1440,1000,'1440'],[390,844,'390']]){await p.setViewportSize({width:w,height:h});await p.goto('http://127.0.0.1:18431/'+route,{waitUntil:'networkidle'});await p.waitForTimeout(140);for(const theme of ['light','dark']){await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(80);const m=await read();if(m.overflow>1||!m.nav)throw Error(`${name}-${size}-${theme} ${JSON.stringify(m)}`);if(name==='home'&&(!m.homeFirst.startsWith('网址健康 3')||!m.homeRailFirst.includes('vf-home-health-section')))throw Error(`home-priority-${size}-${theme} ${JSON.stringify(m)}`);metrics[name][`${size}-${theme}`]=m;await p.screenshot({path:`${process.env.EVID}/${name}-${size}-${theme}.png`,fullPage:true});}}}
          fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));fs.writeFileSync(process.env.EVID+'/verdict.txt',`P01_CURRENT_DEVELOP_VISUAL_SWEEP=PASS\nSOURCE=${process.env.SOURCE}\nTREE=${process.env.TREE}\n`);await b.close();console.log('P01_CURRENT_DEVELOP_VISUAL_SWEEP=PASS');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" TREE="$TREE" node audit.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_CURRENT_DEVELOP_VISUAL_SWEEP=PASS "$EVID/result.txt"
      - name: Regression and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface-verify.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          cat >/tmp/p01-current-sweep-dbcheck.php <<'PHP'
          <?php
          require '/tmp/p01-current-sweep/app/bootstrap.php';$db=vf_db();if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')exit(2);if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_CURRENT_SWEEP_SQLITE=PASS\n";
          PHP
          php /tmp/p01-current-sweep-dbcheck.php | tee "$EVID/sqlite.txt" | grep -Fx P01_CURRENT_SWEEP_SQLITE=PASS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-current-develop-visual-sweep-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-current-sweep.pid 2>/dev/null)" 2>/dev/null || true
