name: P01 V2.35.1 Exact Candidate Prep
on:
  push:
    branches: [task/p01-current-develop-visual-sweep-20260831]
    paths: [.github/workflows/p01-current-develop-visual-sweep-20260831.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: d6372e9103a6a8b8fb6f4596c14a90bd5cc6bea2
      BASE_TREE: 13401c579b11ea78592826fed943036b06c9fa71
      BRANCH: release/v2.35.1-candidate-r2-20260831
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.1-candidate-r2-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Exact frozen develop fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test "$(cat VERSION)" = '2.35.0'
          test "$(cat src/VERSION.txt)" = '2.35.0'
          grep -Fx "define('VF_VERSION', '2.35.0');" src/app/bootstrap.php >/dev/null
      - name: Write V2.35.1 version triple only
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2.35.1\n' > VERSION
          printf '2.35.1\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php');s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.35.0');";new="define('VF_VERSION', '2.35.1');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          test "$(cat VERSION)" = '2.35.1'
          test "$(cat src/VERSION.txt)" = '2.35.1'
          grep -Fx "define('VF_VERSION', '2.35.1');" src/app/bootstrap.php >/dev/null
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          php -l src/app/bootstrap.php >/dev/null
      - name: Commit exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.35.1 exact candidate'
          git push origin HEAD:refs/heads/$BRANCH
          printf 'P01_V2351_CANDIDATE=%s\n' "$(git rev-parse HEAD)"
          printf 'P01_V2351_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'P01_V2351_RUNTIME_TREE=%s\n' "$(git rev-parse HEAD:src)"
