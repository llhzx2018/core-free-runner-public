name: P07 r99 exact-source SQL guard verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-r99-sql-guard-gate.yml'
permissions:
  contents: read
jobs:
  exact-source-sql:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P07_SOURCE_SHA: ba2ca090912fe2eaf0699c8d29bb19b6ae08c6d2
    steps:
      - name: Check registered private read capability
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'P07_PRIVATE_READ_CAPABILITY_UNAVAILABLE'; exit 78; }
      - name: Checkout exact immutable private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ba2ca090912fe2eaf0699c8d29bb19b6ae08c6d2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-p07-private
      - name: Verify source identity and SQL/continuation regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd transient-p07-private
          export PYTHONPATH="$PWD/lib"
          test "$(git rev-parse HEAD)" = "$P07_SOURCE_SHA"
          test "$(cat BUILD_ID)" = '0.1.0-release98'
          python3 -m compileall -q lib/verify.py lib/server_migration_pull.py
          python3 -m unittest discover -s tests -p 'test_cross_engine_sql_format.py' -v
          python3 -m unittest discover -s tests -p 'test_server_migration_pull.py' -v
          python3 -m unittest discover -s tests -p 'test_server_migration.py' -v
          echo P07_R99_EXACT_SOURCE_SQL_GUARD_PASS
      - name: Clear transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf transient-p07-private
