name: S01 C02 1211100 Formal Release
on:
  push:
    branches: [task/s01-c02-1211100-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1100'
      TARGET_SHA: '11a5e1b3732dc2f421097e87f27e8cd211f2d554'
      MAIN_SHA: '494d2635b178cdbe21f328514057e4db0d1a7fa1'
      TARGET_TREE: '39f4406829c1b710f29320503f51bd6c84fef591'
      RELEASE_TAG: 'v1.21.1100'
      RUN_ID: '38194834043'
      ARTIFACT_ID: '11722912795'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 11a5e1b3732dc2f421097e87f27e8cd211f2d554
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211100/formal-release.sh
          bash runner/lanes/s01-c02-1211100/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211100-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
