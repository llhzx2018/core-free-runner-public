name: P02 Daily UX Flow R2 Manifest Reseal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-daily-ux-flow-reseal-r2.yml'

permissions:
  contents: read

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_BASE: 08cc096e7293579e0fc7f6de3965759e10ceb4ec
      DEVELOP_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require develop write capability
        run: |
          set -Eeuo pipefail
          test -n "$DEVELOP_WRITE_TOKEN"
          echo DEVELOP_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: ${{ env.DEVELOP_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Verify exact product and contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.30'
          python3 scripts/repository-gates.py
          node tests/unit/p02_daily_ux_micro_refinement.mjs
          node tests/unit/p02_daily_ux_flow_refinement.mjs
          grep -F 'p02_daily_ux_flow_refinement.mjs' .github/workflows/repository-health.yml
          test -z "$(git status --porcelain)"
          echo R2_CONTRACTS_AT_EXACT_BASE=PASS

      - name: Regenerate and verify source manifests
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 scripts/generate-source-manifest.py
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))['runtime_source_file_count'])
          PY
          )" = '82'
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          echo "MANIFEST_RESEAL_CHANGED_FILES<<EOF"
          echo "$ACTUAL"
          echo "EOF"
          BAD="$(printf '%s\n' "$ACTUAL" | grep -Ev '^(SOURCE_MANIFEST\.json|SOURCE_MANIFEST\.txt)?$' || true)"
          test -z "$BAD"
          git diff --check
          python3 scripts/verify-source-manifest.py
          echo R2_MANIFEST_RESEAL_SCOPE=PASS

      - name: Commit manifest reseal only when needed
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          if test -z "$(git status --porcelain)"; then
            echo SOURCE_MANIFEST_RESEAL=NOOP_ALREADY_DETERMINISTIC
            echo "PRODUCT_DEVELOP_SHA=$PRODUCT_BASE"
            exit 0
          fi
          git config user.name 'VF Develop Runner'
          git config user.email 'vf-develop-runner@users.noreply.github.com'
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'chore(P02): reseal UX flow source manifest'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:develop
          echo "PRODUCT_DEVELOP_SHA=$NEW_SHA"
          echo SOURCE_MANIFEST_RESEAL_WRITE=PASS

      - name: Protected boundaries
        if: always()
        run: |
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo TAG_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
