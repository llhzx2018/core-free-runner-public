name: P02 Daily UX Task Continuity R3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-daily-ux-flow-reseal-r2.yml'

permissions:
  contents: read

jobs:
  develop-r3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_BASE: 08cc096e7293579e0fc7f6de3965759e10ceb4ec
      DEVELOP_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require develop write capability
        run: |
          set -Eeuo pipefail
          test -n "$DEVELOP_WRITE_TOKEN"
          echo DEVELOP_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: ${{ env.DEVELOP_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Verify exact R2 base
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.30'
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          node tests/unit/p02_daily_ux_micro_refinement.mjs
          node tests/unit/p02_daily_ux_flow_refinement.mjs
          test -z "$(git status --porcelain)"
          echo R2_BASE_EXACT=PASS

      - name: Apply R3 task continuity refinement
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_path=Path('public/assets/app.js')
          app=app_path.read_text(encoding='utf-8')

          old="function syncArticleModeSelection(mode){mode=normalizeArticleMode(mode);$$('[data-workspace-command=\"read\"],[data-workspace-command=\"edit\"],[data-workspace-command=\"split\"]').forEach(button=>{const command=button.dataset.workspaceCommand;const active=command==='edit'?(mode==='edit'||mode==='split'):command===mode;button.classList.toggle('active',active);button.setAttribute('aria-selected',active?'true':'false');button.setAttribute('aria-pressed',active?'true':'false');});}"
          new="function syncArticleModeSelection(mode){mode=normalizeArticleMode(mode);$$('[data-workspace-command=\"read\"],[data-workspace-command=\"edit\"],[data-workspace-command=\"split\"]').forEach(button=>{const command=button.dataset.workspaceCommand;const active=command===mode;button.classList.toggle('active',active);button.setAttribute('aria-selected',active?'true':'false');button.setAttribute('aria-pressed',active?'true':'false');});}"
          if old not in app: raise SystemExit('syncArticleModeSelection contract not found')
          app=app.replace(old,new,1)

          pattern=r"function workspaceModeSwitchMarkup\(mode\)\{.*?\}\nfunction workspaceMoreMarkup"
          replacement="""function workspaceModeSwitchMarkup(mode){mode=normalizeArticleMode(mode);return '<div class=\"workspace-mode-switch\" role=\"tablist\" aria-label=\"资料主模式\"><button type=\"button\" data-workspace-command=\"read\" class=\"'+(mode==='read'?'active':'')+'\" aria-selected=\"'+(mode==='read'?'true':'false')+'\" aria-pressed=\"'+(mode==='read'?'true':'false')+'\" title=\"阅读\">'+icon('eye',14)+'<span>阅读</span></button><button type=\"button\" data-workspace-command=\"edit\" class=\"'+(mode==='edit'?'active':'')+'\" aria-selected=\"'+(mode==='edit'?'true':'false')+'\" aria-pressed=\"'+(mode==='edit'?'true':'false')+'\" title=\"编辑\">'+icon('edit',14)+'<span>编辑</span></button><button type=\"button\" data-workspace-command=\"split\" class=\"'+(mode==='split'?'active':'')+'\" aria-selected=\"'+(mode==='split'?'true':'false')+'\" aria-pressed=\"'+(mode==='split'?'true':'false')+'\" title=\"分栏预览：左侧编辑，右侧预览\">'+icon('split',14)+'<span>分栏</span></button></div>';}
          function workspaceMoreMarkup"""
          app,n=re.subn(pattern,replacement,app,count=1,flags=re.S)
          if n!=1: raise SystemExit('workspaceModeSwitchMarkup contract not found')

          app,n=re.subn(r"  else\{if\(split\)html\+=.*?;if\(ctrl\.cancel\)","  else{if(ctrl.cancel)",app,count=1,flags=re.S)
          if n!=1: raise SystemExit('duplicate split command contract not found')

          old="sort:state.sort,page:state.page};let pref=String(state.settings.search_scope||'all');"
          new="sort:state.sort,page:state.page,scrollTop:currentScrollTop(),contentView:state.contentView};let pref=String(state.settings.search_scope||'all');"
          if old not in app: raise SystemExit('searchReturn snapshot contract not found')
          app=app.replace(old,new,1)

          old="async function clearSearch(){if(!await editorLeaveAllowed())return;clearEditorState();state.readerItem=null;state.readerReturn=null;state.query='';$('#globalSearch').value='';$('#clearSearch').classList.add('hidden');if(state.searchReturn){state.mode=state.searchReturn.mode;state.status=state.searchReturn.status;state.categoryId=state.searchReturn.categoryId;state.sort=state.searchReturn.sort;state.page=state.searchReturn.page;state.searchReturn=null;}else state.page=1;persistView();loadList({scrollTop:0});$('#globalSearch').focus();}"
          new="async function clearSearch(){if(!await editorLeaveAllowed())return;const returnView=state.searchReturn;const returnScroll=returnView?Number(returnView.scrollTop||0):0;clearEditorState();state.readerItem=null;state.readerReturn=null;state.query='';$('#globalSearch').value='';$('#clearSearch').classList.add('hidden');if(returnView){state.mode=returnView.mode;state.status=returnView.status;state.categoryId=returnView.categoryId;state.sort=returnView.sort;state.page=returnView.page;if(returnView.contentView)state.contentView=returnView.contentView==='notebook'?'notebook':'list';state.searchReturn=null;}else state.page=1;persistView();loadList({scrollTop:returnScroll});$('#globalSearch').focus();}"
          if old not in app: raise SystemExit('clearSearch contract not found')
          app=app.replace(old,new,1)
          app_path.write_text(app,encoding='utf-8')

          js_path=Path('public/assets/v2521-context-ux.js')
          js=js_path.read_text(encoding='utf-8')
          old="  function enhance(){enhanceSearchToolbar();enhanceReaderPage();}"
          new="""  function enhanceEmptySearch(){
            const empty=document.querySelector('.empty-state');
            if(!empty||!state.query||Number((state.pagination||{}).total||0)!==0)return;
            empty.classList.add('is-search-empty-contextual');
            const title=empty.querySelector('h2');
            if(title)title.textContent='没有找到“'+String(state.query||'')+'”';
            const origin=originLabel(state.searchReturn);
            const copy=empty.querySelector('p');
            if(copy)copy.textContent='当前搜索没有结果。可以修改关键词，或返回'+origin+'继续浏览。';
            const clear=document.getElementById('emptyClear');
            if(!clear)return;
            clear.textContent='返回'+origin;
            clear.classList.remove('secondary');
            clear.classList.add('primary');
            let actions=empty.querySelector('.empty-search-actions');
            if(!actions){
              actions=document.createElement('div');
              actions.className='empty-search-actions';
              clear.parentNode.insertBefore(actions,clear);
              const edit=document.createElement('button');
              edit.type='button';
              edit.className='btn secondary';
              edit.dataset.emptySearchEdit='1';
              edit.textContent='修改关键词';
              edit.onclick=()=>{const input=document.getElementById('globalSearch');if(input){input.focus();input.select();}};
              actions.appendChild(edit);
              actions.appendChild(clear);
            }
          }
          function enhanceReaderOriginContext(){
            const page=document.querySelector('.reader-page');
            const doc=page&&page.querySelector('.reader-page-document');
            if(!doc||doc.querySelector('.reader-origin-context'))return;
            const info=readerReturnInfo();
            const detail=String(info.detail||'返回资料列表').replace(/^返回/,'');
            const note=document.createElement('div');
            note.className='reader-origin-context';
            note.textContent='打开自'+detail+' · 返回后恢复原位置';
            doc.insertBefore(note,doc.firstChild);
          }
          function enhance(){enhanceSearchToolbar();enhanceEmptySearch();enhanceReaderPage();enhanceReaderOriginContext();}"""
          if old not in js: raise SystemExit('context UX enhance hook not found')
          js=js.replace(old,new,1)
          js_path.write_text(js,encoding='utf-8')

          css_path=Path('public/assets/v2521-context-ux.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* P02 · Daily UX task continuity R3 · post V2.5.30 develop */'
          if marker in css: raise SystemExit('R3 CSS already present')
          css += """

/* P02 · Daily UX task continuity R3 · post V2.5.30 develop */
.workspace-mode-switch{
  display:inline-grid;
  grid-template-columns:repeat(3,minmax(58px,auto));
  align-items:center;
}
.workspace-mode-switch button{
  min-height:32px;
  min-width:0;
  justify-content:center;
}
.reader-origin-context{
  display:flex;
  align-items:center;
  min-height:30px;
  margin:0 0 18px;
  padding:6px 10px;
  border:1px solid color-mix(in srgb,var(--primary) 14%,var(--border));
  border-radius:9px;
  background:color-mix(in srgb,var(--primary) 4%,var(--surface));
  color:var(--muted);
  font-size:11.5px;
  font-weight:650;
}
.empty-state.is-search-empty-contextual{max-width:620px}
.empty-search-actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:14px;
}
@media(max-width:620px){
  .workspace-mode-switch{
    width:min(100%,252px);
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .workspace-mode-switch button{min-height:40px;padding-inline:7px}
  .workspace-mode-switch button span{font-size:11.5px}
  .reader-origin-context{
    margin:-2px 0 14px;
    min-height:28px;
    padding:5px 8px;
    font-size:11px;
  }
  .empty-search-actions{display:grid;grid-template-columns:1fr;max-width:280px;margin:14px auto 0}
  .empty-search-actions .btn{width:100%;min-height:42px}
}
"""
          css_path.write_text(css,encoding='utf-8')
          PY

          cat > tests/unit/p02_daily_ux_task_continuity.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const app=fs.readFileSync('public/assets/app.js','utf8');
          const js=fs.readFileSync('public/assets/v2521-context-ux.js','utf8');
          const css=fs.readFileSync('public/assets/v2521-context-ux.css','utf8');
          const evidence=fs.readFileSync('docs/evidence/P02_DAILY_UX_TASK_CONTINUITY_20260830.md','utf8');
          assert.ok(app.includes('scrollTop:currentScrollTop(),contentView:state.contentView'));
          assert.ok(app.includes('const returnScroll=returnView?Number(returnView.scrollTop||0):0'));
          assert.ok(app.includes('loadList({scrollTop:returnScroll})'));
          assert.ok(app.includes('const active=command===mode'));
          assert.ok(app.includes('data-workspace-command="split"'));
          assert.ok(app.includes('<span>分栏</span>'));
          assert.ok(js.includes('function enhanceEmptySearch()'));
          assert.ok(js.includes('dataset.emptySearchEdit'));
          assert.ok(js.includes("clear.textContent='返回'+origin"));
          assert.ok(js.includes('function enhanceReaderOriginContext()'));
          assert.ok(js.includes("note.className='reader-origin-context'"));
          assert.ok(css.includes('Daily UX task continuity R3'));
          assert.ok(css.includes('grid-template-columns:repeat(3'));
          assert.ok(css.includes('.empty-search-actions'));
          assert.ok(css.includes('.reader-origin-context'));
          assert.ok(evidence.includes('Search → empty-result recovery → original scroll position'));
          assert.ok(evidence.includes('Read → Edit → Split'));
          console.log('P02_DAILY_UX_TASK_CONTINUITY=PASS');
          EOF

          cat > docs/evidence/P02_DAILY_UX_TASK_CONTINUITY_20260830.md <<'EOF'
          # P02 · Daily UX Task Continuity R3 · 2026-08-30

          ## Boundary

          Develop-only continuity refinement on top of verified R2 (`08cc096e7293579e0fc7f6de3965759e10ceb4ec`).

          No database schema, migration, content model, API endpoint, persistence semantics, Release, Tag, update-channel or Production change.

          ## User paths

          - `Search → empty-result recovery → original scroll position`.
          - `Read → Edit → Split → Read` as one visible three-state workspace.
          - Mobile list/search → reader → action/mode switch → return without losing source context.

          ## Findings

          R2 made search origin and reader origin visible, but the search snapshot did not include list scroll position. Clearing search restored mode/category/page but loaded the list at the top. The workspace also treated Read/Edit as the visible primary switch while Split lived in More, so the same document felt like two primary modes plus one hidden mode.

          ## Implemented

          - search origin snapshot now includes `scrollTop` and `contentView`;
          - clearing search restores the captured list position instead of forcing scroll top 0;
          - zero-result search state names the query, offers Modify keyword, and names the exact range returned to by clearing search;
          - reader shows a quiet origin note explaining that Back restores the prior position;
          - Read / Edit / Split are now three visible peer modes using the existing workspace controller and existing per-mode scroll preservation;
          - mobile renders the same three-mode control as an equal-width touch target group.

          ## Release boundary

          Develop only. Main / Tag / Release / update channel / Production remain unchanged.
          EOF

      - name: Verify R3 before manifest generation
        working-directory: product
        run: |
          set -Eeuo pipefail
          node tests/unit/p02_daily_ux_micro_refinement.mjs
          node tests/unit/p02_daily_ux_flow_refinement.mjs
          node tests/unit/p02_daily_ux_task_continuity.mjs
          git diff --check
          python3 scripts/repository-gates.py
          echo R3_CONTRACTS=PASS

      - name: Regenerate and verify runtime source manifests
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 scripts/generate-source-manifest.py
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))['runtime_source_file_count'])
          PY
          )" = '82'
          python3 scripts/verify-source-manifest.py
          git diff --check
          echo R3_MANIFEST=PASS

      - name: Enforce develop-only changed-file boundary
        working-directory: product
        run: |
          set -Eeuo pipefail
          git status --short
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          test -n "$ACTUAL"
          BAD="$(printf '%s\n' "$ACTUAL" | grep -Ev '^(SOURCE_MANIFEST\.json|SOURCE_MANIFEST\.txt|docs/evidence/P02_DAILY_UX_TASK_CONTINUITY_20260830\.md|public/assets/app\.js|public/assets/v2521-context-ux\.css|public/assets/v2521-context-ux\.js|tests/unit/p02_daily_ux_task_continuity\.mjs)$' || true)"
          test -z "$BAD"
          echo R3_CHANGED_FILE_BOUNDARY=PASS

      - name: Commit R3 to P02 develop
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          git config user.name 'VF Develop Runner'
          git config user.email 'vf-develop-runner@users.noreply.github.com'
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt public/assets/app.js public/assets/v2521-context-ux.css public/assets/v2521-context-ux.js tests/unit/p02_daily_ux_task_continuity.mjs docs/evidence/P02_DAILY_UX_TASK_CONTINUITY_20260830.md
          git commit -m 'ui(P02): preserve task continuity across search and workspace modes'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:develop
          echo "PRODUCT_DEVELOP_SHA=$NEW_SHA"
          echo R3_DEVELOP_WRITE=PASS

      - name: Protected boundaries
        if: always()
        run: |
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo TAG_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
