name: S01-C02 V1.21.1113 independent channel contract proof
on:
  push:
    branches: [test/s01-c02-v1211113-channel-20261027]
    paths:
      - '.github/workflows/s01-c02-v1211113-channel-proof.yml'
permissions:
  contents: read
jobs:
  channel-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact public channel candidate, never publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 2601e7acf91fa39c675285e1d0dfbaa749150004
          fetch-depth: 2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact staged source and single allowed manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2601e7acf91fa39c675285e1d0dfbaa749150004
          git diff --name-only HEAD^ HEAD | tee /tmp/s01-c02-files.txt
          test "$(wc -l < /tmp/s01-c02-files.txt)" -eq 1
          test "$(cat /tmp/s01-c02-files.txt)" = "projects/S01-C02.json"
          m=projects/S01-C02.json
          jq -e '.project_id=="S01" and .component_id=="S01-C02" and .package_id=="vf-tools-ops" and .package_slug=="vf-ops" and .plugin_file=="vf-ops/vf-ops.php" and .enabled == true and .backup_required == true and .rollback_supported == true and .schema_from == "6.0.0" and .schema_to == "6.0.0" and .target_version == "1.21.1113" and .release_tag == "v1.21.1113" and .repository == "llhzx2018/vf-tools-ops" and .asset_name == "vf-tools-ops_V1.21.1113.zip" and .asset_bytes == 3581874 and .asset_sha256 == "f090dda558a5c2bdec107fe27ee73cecc0da94eff7b56880cb8d76d49ba221e3" and (.from_versions | index("1.21.1111") != null) and .runtime_files == 990 and .runtime_file_count == 990' "$m" >/dev/null
          echo CHANNEL_CANDIDATE_IDENTITY_PASS
      - name: Run complete native channel contract/PHP regression, independent machine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py >/tmp/s01-c02-manifest-audit.json
          jq -e '.status=="PASS"' /tmp/s01-c02-manifest-audit.json >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/s01-c02-phplint.txt
          php update-core/php/tests/run.php
          echo S01_C02_CORE_UPDATES_NATIVE_TESTS_PASS
      - name: Verify exact private GitHub Release and download asset readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.1113 >/tmp/s01-c02-release.json
          jq -e '.tag_name=="v1.21.1113" and .draft==false and .prerelease==false and (.assets | map(select(.name=="vf-tools-ops_V1.21.1113.zip" and .size==3581874))|length==1)' /tmp/s01-c02-release.json >/dev/null
          mkdir -p /tmp/s01-c02-channel
          gh release download v1.21.1113 -R llhzx2018/vf-tools-ops -D /tmp/s01-c02-channel -p vf-tools-ops_V1.21.1113.zip
          test "$(stat -c %s /tmp/s01-c02-channel/vf-tools-ops_V1.21.1113.zip)" -eq 3581874
          echo "f090dda558a5c2bdec107fe27ee73cecc0da94eff7b56880cb8d76d49ba221e3  /tmp/s01-c02-channel/vf-tools-ops_V1.21.1113.zip" | sha256sum --check
          python3 - <<'PY'
          import zipfile
          p='/tmp/s01-c02-channel/vf-tools-ops_V1.21.1113.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert len(names)==990
              assert len(names)==len(set(names))
              assert 'vf-ops/vf-ops.php' in names
              assert 'vf-ops/plugin-manifest.json' not in names
              assert all(n.split('/')[1] in ('vf-ops.php','uninstall.php','assets','includes','languages','config') for n in names)
              assert z.testzip() is None
              assert all(n.startswith('vf-ops/') and '..' not in n.split('/') for n in names)
          print('S01_C02_DISTRIBUTION_ASSET_AND_ZIP_PASS')
          PY
          {
            echo 'S01_C02_INDEPENDENT_CHANNEL_GATE=PASS'
            echo 'CHANNEL_PR=917'
            echo 'CHANNEL_SHA=2601e7acf91fa39c675285e1d0dfbaa749150004'
            echo 'PRODUCT_RELEASE=v1.21.1113'
            echo 'ASSET_SHA256=f090dda558a5c2bdec107fe27ee73cecc0da94eff7b56880cb8d76d49ba221e3'
            echo 'Production not modified. Core-updates main not modified.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Delete transient binary
        if: always()
        shell: bash
        run: |
          rm -f /tmp/s01-c02-channel/vf-tools-ops_V1.21.1113.zip
