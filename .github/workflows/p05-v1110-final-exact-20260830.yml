name: P05 V1.1.10 Final Exact Source Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P05_EXACT_SOURCE: e65d59e89487cd0748cfd5e9ad714b3a4c19c03f
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05
      - name: Verify exact source and candidate authority
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.10'
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e .vf-seo-site-instance.json
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          if(p.version!=='1.1.10'||l.version!=='1.1.10'||l.packages[''].version!=='1.1.10') process.exit(1);
          NODE
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['version']==d['target_version']==d['working_version']=='1.1.10'
          assert d['status'].startswith('V1.1.10_RELEASE_CANDIDATE')
          assert d['formal_release']=='v1.1.9'
          x=d['v1_1_10_runtime_pointer_install_fix']
          assert x['mechanism_gate']=='PASS'
          assert x['pointer_created']=='AFTER_SUCCESSFUL_SETUP_ONLY'
          assert x['private_state_isolation']=='POINTER_BOUND_RANDOM_SIBLING'
          assert x['fresh_install_uses_home'] is False
          assert x['fresh_install_uses_environment_storage_paths'] is False
          assert d['production_deployment']=='NOT_DEPLOYED' and d['production_write']==0
          PY
          grep -Fq 'FINAL_EXACT_SOURCE_GATE_PENDING' docs/authority/RELEASE_V1.1.10_CANDIDATE.md
          grep -Fq 'write pointer last' php/README.md
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Engineering regression contract
        working-directory: p05
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
      - name: PHP syntax and path authority gates
        working-directory: p05
        run: |
          set -euo pipefail
          php -l php/src/SiteInstance.php
          php -l php/src/RuntimePaths.php
          php -l php/src/Config.php
          php -l php/src/Installer.php
          php -l php/src/setup-bootstrap.php
          php -l php/src/bootstrap.php
          test ! -e php/src/FreshInstallRecovery.php
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
      - name: Build formal FULL staging and package gate
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-site-instance.json
          test ! -e build/vf-seo-php-release/.vf-seo-installing.lock
          test -z "$(find build/vf-seo-php-release \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name '*.wal' -o -name '*.shm' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' \) -print -quit)"
          find build/vf-seo-php-release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/staging-before.sha
      - name: Browser pointer-last install smoke
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
      - name: Full-delete reinstall with dirty historical state
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh
      - name: Real Google Chrome E2E
        working-directory: p05
        run: |
          set -euo pipefail
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
      - name: Prove formal staging remained byte-identical
        working-directory: p05
        run: |
          set -euo pipefail
          find build/vf-seo-php-release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/staging-after.sha
          cmp /tmp/staging-before.sha /tmp/staging-after.sha
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test -z "$(find build/vf-seo-php-release \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' \) -print -quit)"
      - name: Pristine post-test rebuild from exact source
        working-directory: p05
        run: |
          set -euo pipefail
          rm -rf build/vf-seo-php-release
          npm run build:php-release
          npm run php:release:gate
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test -z "$(find build/vf-seo-php-release \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' \) -print -quit)"
          cd build
          zip -qr VF_SEO_V1.1.10_FULL_CANDIDATE.zip vf-seo-php-release
          sha256sum VF_SEO_V1.1.10_FULL_CANDIDATE.zip | tee /tmp/candidate-zip.sha256
          test -s VF_SEO_V1.1.10_FULL_CANDIDATE.zip
      - name: Machine receipt
        run: |
          set -euo pipefail
          cat /tmp/candidate-zip.sha256
          echo 'P05_V1110_FINAL_EXACT_SOURCE=PASS'
          echo "EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'ENGINEERING_REGRESSION=PASS'
          echo 'PHP_PACKAGE_GATE=PASS'
          echo 'POINTER_LAST_BROWSER_SETUP=PASS'
          echo 'DIRTY_STATE_FULL_DELETE_REINSTALL=PASS'
          echo 'POISONED_HOME_ENV_ISOLATION=PASS'
          echo 'GOOGLE_CHROME_E2E=PASS'
          echo 'FORMAL_STAGING_IMMUTABLE=PASS'
          echo 'PRISTINE_POST_TEST_REBUILD=PASS'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
