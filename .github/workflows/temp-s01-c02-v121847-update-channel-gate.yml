name: TEMP S01-C02 Ops 1.21.847 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 1cbae32a0be0b3e21e12d98605c7e302105d885b
      UPDATE_CANDIDATE: 7701a8db8a46ad71e194e32e55c241a75eeb1cf3
      UPDATE_TREE: efb88c716d0d1b47337ca82eb7bdad4dd4198445
      PRODUCT_COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      PRODUCT_TREE: de14a4ff27d8eda30a20ea7e7afa730f6ebe3c7c
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.847.zip
      BYTES: '3319022'
      SHA256: f88136193770a21d4a4a0b2e5d47c3089b7fc2fa293a8931e0f2e1ccd94c59b2
      FP: a9fd2ef209a5b06890e48e1274f005c2efd402c0bfecc8d041aabe046a632207
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          test "$(git -C updates rev-parse HEAD^{tree})" = "$UPDATE_TREE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.847" and .from_versions==["1.21.846"] and .release_tag=="v1.21.847" and .asset_name=="vf-tools-ops_V1.21.847.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==929 and .runtime_file_count==929 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-06T04:33:34Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.847' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.id==383464683 and .tag_name=="v1.21.847" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.id==546728485 and .name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$PRODUCT_COMMIT --jq .tree.sha)" = "$PRODUCT_TREE"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.846" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="candidate_build" and .activeStaticJobFailureCount==1 and .activeStaticJobNonAuditFailureCount==1 and .activeStaticJobAuditFailureCount==0 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryStructuralRetryStatus=="fail" and .sourceRecoveryStructuralRetryCode=="structural_retry_fresh_candidate_terminal" and .sourceRecoveryStructuralRetryCandidateCurrentStage==4 and .sourceRecoveryStructuralRetryCandidateBuildOffset==231 and .sourceRecoveryStructuralRetryCandidateBuildTotal==231 and .sourceRecoveryStructuralRetryCandidateHelperPhase=="helper_root_prepare" and .sourceRecoveryStructuralRetryCandidateHelpersWritten==false and .sourceRecoveryStructuralRetryCandidateCompletenessStatus=="pass" and .sourceRecoveryStructuralRetryCandidateAuditFailureCount==0' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git -C updates rev-parse origin/develop)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121847_UPDATE_CHANNEL_GATE
