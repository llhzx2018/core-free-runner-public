name: P01 V2.21.18 Final Regression Observer

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p01-v2.21.18-final-run-observer.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RESULT_ID: P01-V2.21.18-FINAL-RUN-OBSERVER
  TARGET_WORKFLOW: p01-v2.21.18-targeted-regression-final.yml

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe final regression workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          workflow=os.environ['TARGET_WORKFLOW']
          token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=vf-agent-operations-v1&per_page=10'
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r:data=json.load(r)
          runs=[]
          for x in data.get('workflow_runs',[]):
              runs.append({'id':x.get('id'),'status':x.get('status'),'conclusion':x.get('conclusion'),'event':x.get('event'),'head_sha':x.get('head_sha'),'created_at':x.get('created_at'),'updated_at':x.get('updated_at'),'run_attempt':x.get('run_attempt')})
          open('/tmp/observed.json','w').write(json.dumps({'total_count':data.get('total_count',0),'runs':runs},indent=2,sort_keys=True)+'\n')
          print(json.dumps({'total_count':data.get('total_count',0),'runs':runs[:3]},indent=2))
          PY

      - name: Publish sanitized observation
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          token=os.environ['VF_RELEASE_WRITE_TOKEN']
          try: observed=json.load(open('/tmp/observed.json'))
          except: observed={'total_count':0,'runs':[]}
          payload={'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.18','gate':'FINAL_REGRESSION_RUN_OBSERVER','observed_workflow':os.environ['TARGET_WORKFLOW'],**observed}
          content=json.dumps(payload,indent=2,sort_keys=True)+'\n'
          path=f"vf-agent/results/{os.environ['RESULT_ID']}.json"
          api=f"https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/{path}"
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
              req=urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          body={'message':'evidence(P01): observe V2.21.18 final regression run','content':base64.b64encode(content.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**headers,'Content-Type':'application/json'})
          urllib.request.urlopen(req,timeout=20).read()
          PY
