name: S01 C02 Recovery Dialog Geometry Candidate
on:
  push:
    branches: [task/s01-c02-1211100-recovery-dialog-layout-20261012]
permissions:
  contents: read
jobs:
  dialog-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: da5ee7c33e3efd010658b63bbb45f49f34693b57
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact source and PHP / JS syntax
        run: |
          test "$(git -C product rev-parse HEAD)" = da5ee7c33e3efd010658b63bbb45f49f34693b57
          test "$(cat product/VERSION)" = 1.21.1099
          php -l product/includes/admin-v13/views/system_recovery.php
          node --check product/assets/js/v13/system/recovery.js
          node --check product/tests/s01-c02-1211100-recovery-dialog-layout-browser-proof.js
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: All Recovery dialogs on four viewport sizes
        working-directory: product
        run: |
          node tests/s01-c02-1211100-recovery-dialog-layout-browser-proof.js
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          echo S01_C02_1211100_RECOVERY_DIALOG_GEOMETRY_PASS
