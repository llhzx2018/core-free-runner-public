name: TEMP P07 private SQL canonical-class diagnostic evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-sql-canon-v2-proof.yml'

permissions:
  contents: read

jobs:
  safe-sql-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require already-configured private-source capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo PRIVATE_SOURCE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact private P07 diagnostic candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d2e900bbbb639c8b31d9fdc89bea0779f8c9d268
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Syntax and targeted DB comparison tests (synthetic data only)
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'd2e900bbbb639c8b31d9fdc89bea0779f8c9d268'
          python3 -m compileall -q lib/verify.py lib/server_migration_pull.py tests/test_cross_engine_sql_format.py
          PYTHONPATH=lib python3 -m unittest -v tests.test_cross_engine_sql_format tests.test_server_migration_pull tests.test_server_migration
          echo P07_SQL_CANON_V2_REDACTED_EVIDENCE_PASS
      - name: Strict privacy and fail-closed static contracts
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          verify = Path('lib/verify.py').read_text()
          pull = Path('lib/server_migration_pull.py').read_text()
          assert 'def sql_cross_engine_known_format_diagnostic' in verify
          assert 'SQL_CANON_V2' in verify
          assert 'sql_cross_engine_known_format_diagnostic' in pull
          assert re.search(r'raise PullMigrationError\(f"MySQL verification failed', pull)
          assert 'PRIVATE_CHANGE_MARKER' not in verify
          print('P07_PRIVACY_STATIC_CONTRACT_PASS')
          PY
