name: P01 Hosted Field Visibility Fix

on:
  push:
    branches:
      - task/p01-v229-hosted-field-visibility-fix-20260829

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-domain-taxonomy-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch source field visibility
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "4098fc5c2f0d070e2b1b7dfb28f1c3b01234fcfb"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/assets/workspace.js');s=p.read_text(encoding='utf-8')
          old="if(urlField)urlField.hidden=hosted;if(url)url.required=!hosted;const htmlField=$('[data-html-field]',form);if(htmlField)htmlField.hidden=!hosted;"
          new="if(urlField){urlField.hidden=hosted;urlField.style.display=hosted?'none':''}if(url)url.required=!hosted;const htmlField=$('[data-html-field]',form);if(htmlField){htmlField.hidden=!hosted;htmlField.style.display=hosted?'':'none'};"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check src/assets/workspace.js
          git diff --check
          test "$(git diff --name-only)" = "src/assets/workspace.js"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/assets/workspace.js
          git commit -m 'P01 V2.29 · Fix hosted source field visibility'
          git push origin HEAD:feature/p01-domain-taxonomy-20260829
          echo P01_HOSTED_FIELD_VISIBILITY=PASS
