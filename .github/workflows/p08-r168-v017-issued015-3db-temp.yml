name: P08 R168 exact v017 official v015 FULL three-engine non-release proof
on:
  pull_request:
    paths: [.github/workflows/p08-r168-v017-issued015-3db-temp.yml]
permissions:
  contents: read
jobs:
  exact-full-https:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Required PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: posix,curl,zip,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,sodium
          coverage: none
      - name: Checkout exact current P08 v0.1.5 PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout governance authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f9577f976eef884d76058372f7701275b8324d42
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: Node 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source-bound disposable FULL and exercise HTTPS Owner first install
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          P08_TARGET: cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5
          P08_SOURCE: 75fdcab08f84e5bb7e4edb1a3f42098096907598
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5
          test "$(cat p08/VERSION)" = 0.1.7
          test "$(git -C p08 rev-parse HEAD^{tree})" = 003c3633ae277498ed23c99f591dcd5750da822e
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.5 --jq '.object.sha')" = "$P08_SOURCE"
          gh release download v0.1.5 -R llhzx2018/vf-adops \
            -p VF_AdOps_V0.1.5_FULL.zip -D "$RUNNER_TEMP" >/dev/null
          mv "$RUNNER_TEMP/VF_AdOps_V0.1.5_FULL.zip" "$RUNNER_TEMP/official-v015.zip"
          echo "a3e54e5fc4d8abad083a222761b9ae4cfac24d5a170b640baca6816971133f30  $RUNNER_TEMP/official-v015.zip" | sha256sum -c --status
          unzip -p "$RUNNER_TEMP/official-v015.zip" FULL_MANIFEST.json > "$RUNNER_TEMP/official-v015-manifest.json"
          python3 -B - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'official-v015-manifest.json'
          m=json.loads(p.read_text())
          assert m['source_sha']==os.environ['P08_SOURCE'] and m['target_version']=='0.1.5'
          assert m['type']=='CLEAN_FULL_ONLY'
          print('R168_OFFICIAL_V015_SOURCE_ZIP_SHA256=PASS')
          print('R168_OFFICIAL_V015_MANIFEST_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

          php -l p08/scripts/owner-first-update-recovery.php
          php -l p08/tests/test_owner_first_update_recovery.php
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES php p08/tests/test_owner_first_update_recovery.php
          echo P08_R168_NATIVE_ONEFILE_REAL_PROJECT_REGRESSIONS=PASS
          root="$RUNNER_TEMP/p08-r168-issued015-preload"
          mkdir -p "$root/releases/$P08_SOURCE"
          unzip -q "$RUNNER_TEMP/official-v015.zip" -d "$root/releases/$P08_SOURCE"
          ln -s "releases/$P08_SOURCE" "$root/current"
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES P08_R168_SITE="$root" php -r '
            define("P08_R168_TEST_HARNESS",true);
            require "p08/scripts/owner-first-update-recovery.php";
            r168VerifyFullBeforeAutoload(getenv("P08_R168_SITE"));
            echo "P08_R168_GENUINE_OFFICIAL_V015_FULL_PRELOAD=PASS\n";
          '
          printf '\n// R168 simulated tamper\n' >> "$root/releases/$P08_SOURCE/vendor/autoload.php"
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES P08_R168_SITE="$root" php -r '
            define("P08_R168_TEST_HARNESS",true);
            require "p08/scripts/owner-first-update-recovery.php";
            try { r168VerifyFullBeforeAutoload(getenv("P08_R168_SITE")); exit(81); }
            catch (RuntimeException $e) {
              if ($e->getMessage()!=="SETUP_FULL_MEMBER_INVALID") throw $e;
              echo "P08_R168_GENUINE_ISSUED_FULL_TAMPER_REFUSED=PASS\n";
            }
          '
          rm -rf -- "$root"
          python3 -B -m unittest discover -s p08/tests -p test_atomic_builder.py
          python3 -B -m unittest discover -s p08/tests -p test_stack_contract.py
          php p08/tests/test_upgrade_throttle_isolation.php
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --base-sha dfe477e7dab2760d4bb9c5b6eefb9e6ec893a43a --head-sha cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5 \
            --git-root p08
          php p08/tests/test_site_domain_portability.php
          php p08/tests/test_setup_guard.php
          php p08/tests/test_clean_full_versioned_bootstrap.php
          php -l p08/src/Upgrade/OwnerFutureAtomicStore.php
          php -l p08/src/Upgrade/OwnerFutureAtomicService.php
          php -l p08/src/Upgrade/OwnerFutureInterruptedRecovery.php
          php -l p08/src/Upgrade/OwnerFutureSiteDispatcher.php
          php -l p08/src/Upgrade/future-owner-upgrade-worker.php
          php -l p08/app/Http/Controllers/OwnerFutureUpdateController.php
          php -l p08/app/Http/Middleware/MaintenanceWriteGuard.php
          php -l p08/public/index.php
          php -l p08/tests/test_owner_future_repeat_cycle.php
          php p08/tests/test_owner_future_repeat_cycle.php
          php p08/tests/test_owner_future_atomic_status.php
          php p08/tests/test_owner_next_release_gateway.php
          composer --working-dir=p08 install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader --no-scripts
          (cd p08 && composer check-platform-reqs --no-dev)
          php -r 'require "p08/vendor/autoload.php"; echo "P08_R169_REAL_COMPOSER_BOOTSTRAP_PHP84=PASS\\n";'
          npm --prefix p08 ci --ignore-scripts --no-audit --no-fund
          npm --prefix p08 run typecheck
          npm --prefix p08 run build
          npm --prefix p08 run test:unit
          php p08/tests/run.php
          python3 -B p08/scripts/check_stack_contract.py --phase full --root p08
          # Scope the 13 canonical public authorities to the exact v0.1.5
          # installer/Owner updater release. Eleven domain bodies are REQUIRED
          # (including performance-sensitive backup/lock) and two have no
          # changed SEO/notification capability triggers. All 13 bodies are
          # verified at the current pinned governance source.
          python3 -B - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('gov').resolve()
          source=subprocess.check_output(['git','-C','p08','rev-parse','HEAD'],text=True).strip()
          d=json.loads((root/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())
          canonical=d['domains']
          assert len(canonical)==13 and len(set(canonical))==13, 'R158_ROUTER_13_NAMES_CHANGED'
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER',
                    'CRON_JOB','OBSERVABILITY','PERFORMANCE','GIT','UA_UI']
          conditional=['SEO','NOTIFICATION']
          assert set(required+conditional)==set(canonical)
          for domain in sorted(canonical):
              p=root/canonical[domain]['authority']
              assert p.is_file() and not p.is_symlink() and p.read_text().strip(),domain
              print('P08_R158_AUTHORITY_'+domain+'='+('REQUIRED' if domain in required else 'CONDITIONAL_NOT_TRIGGERED'))
          receipt={
            'schema':'vf.public-authority.task-delivery-check.v1',
            'project':'P08','source':source,
            'project_authority':{
              'agents':'AGENTS.md','current':'docs/authority/CURRENT.md',
              'acceptance':'docs/authority/ACCEPTANCE_MATRIX.md',
              'applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md',
            },
            'acceptance_markers':['v0.1.5 · Clean FULL','Future update PASS'],
            'required_domains':required,
            'task_capabilities':['deployable_web_app','installer','admin','release','atomic',
              'backup','credentials','background_job','upgrade_visibility',
              'release_source','installer_ui','performance_sensitive_release'],
            'delivery':{
              'profile':'web_full_zip','entrypoint':'public/index.php',
              'requires_git':False,'requires_manual_source_copy':False,
              'artifact':'v017-full.zip','sha256':'0'*64,
            },
          }
          pathlib.Path('p08-r158-receipt.json').write_text(json.dumps(receipt))
          print('P08_R158_THIRTEEN_DOMAIN_BODIES_READ_11_REQUIRED_2_CONDITIONAL=PASS')
          PY
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase resolve --receipt p08-r158-receipt.json \
            --project-root p08 --artifact-root "$RUNNER_TEMP" \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          echo P08_R158_CANONICAL_13_DOMAIN_RESOLVE=PASS
          site="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-browser"
          mkdir -p "$site"
          python3 -B p08/scripts/build_full.py \
            --source "$GITHUB_WORKSPACE/p08" \
            --output "$RUNNER_TEMP/v017-full.zip" \
            --version 0.1.7 \
            --source-sha cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5 \
            --governance-root "$GITHUB_WORKSPACE/gov"
          python3 -B - <<'PY'
          import json,hashlib,pathlib,os
          p=pathlib.Path('p08-r158-receipt.json')
          data=json.loads(p.read_text())
          artifact=pathlib.Path(os.environ['RUNNER_TEMP'])/'v017-full.zip'
          data['delivery']['sha256']=hashlib.sha256(artifact.read_bytes()).hexdigest()
          p.write_text(json.dumps(data))
          print('P08_R158_REAL_FULL_BYTES='+str(artifact.stat().st_size))
          PY
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery --receipt p08-r158-receipt.json \
            --project-root p08 --artifact-root "$RUNNER_TEMP" \
            --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          echo P08_R158_CANONICAL_13_DOMAIN_REAL_ZIP_STRUCTURE=PASS
          # Identical locked dependencies / source / parameters must result
          # in an identical FULL zip; this second build is never published.
          python3 -B p08/scripts/build_full.py \
            --source "$GITHUB_WORKSPACE/p08" \
            --output "$RUNNER_TEMP/v017-full-repeat.zip" \
            --version 0.1.7 \
            --source-sha cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5 \
            --governance-root "$GITHUB_WORKSPACE/gov"
          cmp "$RUNNER_TEMP/v017-full.zip" "$RUNNER_TEMP/v017-full-repeat.zip"
          echo P08_R158_REAL_FULL_IDENTICAL_TWO_BUILDS=PASS
          unzip -q "$RUNNER_TEMP/v017-full.zip" -d "$site"
          mkdir -p "$site/database"
          touch "$site/database/$(printf 'a%.0s' {1..32}).sqlite"
          chmod 0600 "$site/database/$(printf 'a%.0s' {1..32}).sqlite"
          cat > "$RUNNER_TEMP/r150-router.php" <<'PHP'
          <?php
          $_SERVER['HTTPS']='on';
          $_SERVER['SERVER_PORT']=443;
          $_SERVER['HTTP_HOST']='127.0.0.1:18479';
          $_SERVER['SERVER_NAME']='127.0.0.1';
          $root=getenv('P08_R150_SITE');
          $path=parse_url((string)($_SERVER['REQUEST_URI']??'/'),PHP_URL_PATH);
          // Match the real vhost: publicly built Vite assets are served as
          // immutable static bytes, never dispatched through Laravel.
          $static=is_string($path)?realpath($root.'/public'.$path):false;
          if ($static!==false && is_string($static) && $path!=='/'
              && str_starts_with($static,$root.'/public/')
              && is_file($static) && !str_ends_with($static,'.php')) {
              return false;
          }
          if ($path==='/setup.php') {
              if (($_SERVER['REQUEST_METHOD']??'')==='POST') {
                  error_log('R150_SAFE_POST_HOST='.($_SERVER['HTTP_HOST']??'')
                      .' ORIGIN='.($_SERVER['HTTP_ORIGIN']??'')
                      .' HTTPS='.($_SERVER['HTTPS']??''));
              }
              $_SERVER['SCRIPT_NAME']='/setup.php';
              $_SERVER['PHP_SELF']='/setup.php';
              require $root.'/public/setup.php';
          } else {
              $_SERVER['SCRIPT_NAME']='/index.php';
              $_SERVER['PHP_SELF']='/index.php';
              require $root.'/public/index.php';
          }
          PHP
          cat > "$RUNNER_TEMP/r150-proxy.py" <<'PY'
          import http.client, http.server, ssl, sys
          cert, key = sys.argv[1:3]
          class Handler(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"
              def relay(self):
                  content_len = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(content_len) if content_len else None
                  if self.path == "/setup.php" and self.command == "POST":
                      print("R150_SAFE_EDGE_HOST=",self.headers.get("Host"),
                            "ORIGIN=",self.headers.get("Origin"),flush=True)
                  conn = http.client.HTTPConnection("127.0.0.1", 18079, timeout=120)
                  headers = {k: v for k, v in self.headers.items() if k.lower()
                             not in ("connection", "transfer-encoding", "proxy-connection")}
                  conn.request(self.command, self.path, body=body, headers=headers)
                  resp = conn.getresponse()
                  data = resp.read()
                  self.send_response(resp.status)
                  for k,v in resp.getheaders():
                      if k.lower() not in ("connection","content-length","transfer-encoding","date","server"):
                          self.send_header(k,v)
                  self.send_header("Content-Length",str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)
                  conn.close()
              do_GET = do_POST = do_PUT = do_DELETE = relay
              def log_message(self,*args):
                  pass
          server=http.server.ThreadingHTTPServer(("127.0.0.1",18479),Handler)
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain(cert,key)
          server.socket=ctx.wrap_socket(server.socket,server_side=True)
          server.serve_forever()
          PY
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$RUNNER_TEMP/r150-key.pem" -out "$RUNNER_TEMP/r150-cert.pem" \
            -subj /CN=127.0.0.1 -days 1 >/dev/null 2>&1
          P08_R150_SITE="$site" php -S 127.0.0.1:18079 -t "$site/public" \
            "$RUNNER_TEMP/r150-router.php" > "$RUNNER_TEMP/r150-php.log" 2>&1 &
          php_pid=$!
          python3 "$RUNNER_TEMP/r150-proxy.py" "$RUNNER_TEMP/r150-cert.pem" \
            "$RUNNER_TEMP/r150-key.pem" > "$RUNNER_TEMP/r150-edge.log" 2>&1 &
          tls_pid=$!
          trap 'kill "$php_pid" "$tls_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl -k -fsS --max-time 4 https://127.0.0.1:18479/setup.php \
              -o "$RUNNER_TEMP/r150-setup.html"; then break; fi
            sleep 1
          done
          grep -q '第一次安装' "$RUNNER_TEMP/r150-setup.html"
          ( cd p08
            python3 -B - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/owner-v015-first-update-browser.spec.ts')
          t=p.read_text()
          assert '0.1.5' in t
          p.write_text(t.replace('0.1.5','0.1.7'))
          PY
            npx playwright install chromium >/dev/null
            if ! GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES \
              P08_R150_BROWSER=YES P08_TEST_BASE_URL=https://127.0.0.1:18479 \
                npx playwright test tests/e2e/owner-v015-first-update-browser.spec.ts \
                --config playwright.config.ts --workers=1 --reporter=line
            then
              echo 'P08_R150_BROWSER_FAILED=TRUE'
              grep -E 'R150_SAFE_POST_HOST|R150_SAFE_EDGE_HOST' \
                "$RUNNER_TEMP/r150-php.log" "$RUNNER_TEMP/r150-edge.log" || true
              exit 1
            fi
          )
          echo P08_R150_EXACT_FULL_HTTPS_OWNER_BROWSER=PASS
          # Real, issued official baseline, not a fake same-version UPDATE.
          original=$(sha256sum "$RUNNER_TEMP/official-v015-manifest.json" | cut -d' ' -f1)
          python3 -B p08/scripts/build_atomic.py \
            --source "$GITHUB_WORKSPACE/p08" --output "$RUNNER_TEMP/v017-real-update.zip" \
            --source-version 0.1.5 --source-sha "$P08_SOURCE" \
            --source-full-manifest-sha256 "$original" \
            --previous-full-manifest "$RUNNER_TEMP/official-v015-manifest.json" \
            --target-version 0.1.7 --target-sha "$P08_TARGET"
          python3 -B p08/scripts/build_atomic.py \
            --source "$GITHUB_WORKSPACE/p08" --output "$RUNNER_TEMP/v017-real-update-repeat.zip" \
            --source-version 0.1.5 --source-sha "$P08_SOURCE" \
            --source-full-manifest-sha256 "$original" \
            --previous-full-manifest "$RUNNER_TEMP/official-v015-manifest.json" \
            --target-version 0.1.7 --target-sha "$P08_TARGET"
          cmp -s "$RUNNER_TEMP/v017-real-update.zip" "$RUNNER_TEMP/v017-real-update-repeat.zip"
          python3 -B - <<'PY'
          import os,json,pathlib,zipfile,hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v017-real-update.zip'
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            m=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert m['source_version']=='0.1.5' and m['source_sha']==os.environ['P08_SOURCE']
            assert m['target_version']=='0.1.7' and m['target_sha']==os.environ['P08_TARGET']
            assert m['schema_changes'] is False
          print('R168_REAL_SOURCE_TO_TARGET_SCHEMA_PARITY_TWO_ZIPS=PASS')
          print('R168_UPDATE_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          python3 -B - <<'PY'
          from pathlib import Path
          import os
          p=Path('p08/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php')
          s=p.read_text()
          assert s.count("str_repeat('1',40)")==1
          # R154 is intentionally historical (v015->v016->v017). On this
          # disposable Runner, adapt only its version fixture literals to
          # v015->v017->v018; keep production source and original test intact.
          assert s.count("'0.1.6'")==2
          assert s.count("'0.1.7'")==2
          s=s.replace("'0.1.7'","'0.1.8'").replace("'0.1.6'","'0.1.7'")
          s=s.replace("str_repeat('1',40)","'"+os.environ['P08_TARGET']+"'")
          p.write_text(s)
          PY
          php -l p08/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php
          sqlite="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite"
          mkdir -p "$sqlite/tests/compatibility"
          unzip -q "$RUNNER_TEMP/official-v015.zip" -d "$sqlite"
          cp p08/tests/test_install_sqlite_e2e.php "$sqlite/tests/"
          cp p08/tests/compatibility/r101_complete_schema.php "$sqlite/tests/compatibility/"
          P08_ISOLATED_INSTALL_TEST=YES php "$sqlite/tests/test_install_sqlite_e2e.php"
          tok="$sqlite/storage/app/private/adops/upgrade/github-read-token"
          test "$(cat "$tok")" = "github_pat_$(printf 's%.0s' {1..42})"
          rm -- "$tok"
          GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES P08_R154_NATIVE=YES \
            php p08/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php \
              first "$sqlite" "$P08_SOURCE" "$RUNNER_TEMP/v017-real-update.zip"
          test "$(cat "$sqlite/current/VERSION")" = 0.1.7
          next=$(sha256sum "$sqlite/current/FULL_MANIFEST.json" | cut -d' ' -f1)
          printf '0.1.8\n' > p08/VERSION
          python3 -B p08/scripts/build_atomic.py \
            --source "$GITHUB_WORKSPACE/p08" --output "$RUNNER_TEMP/v018-synthetic.zip" \
            --source-version 0.1.7 --source-sha "$P08_TARGET" \
            --source-full-manifest-sha256 "$next" \
            --previous-full-manifest "$sqlite/current/FULL_MANIFEST.json" \
            --target-version 0.1.8 --target-sha 2222222222222222222222222222222222222222
          set +e
          GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES P08_R154_NATIVE=YES P08_R131_DISPOSABLE=YES \
            php p08/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php \
              kill "$sqlite" "$P08_TARGET" "$RUNNER_TEMP/v018-synthetic.zip"
          ec=$?
          set -e
          test "$ec" -eq 137
          GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES P08_R154_NATIVE=YES \
            php p08/tests/compatibility/r154_clean_full_to_two_native_atomic_cycles.php \
              recover "$sqlite" "$P08_TARGET" "$RUNNER_TEMP/v018-synthetic.zip"
          echo R168_SQLITE_OFFICIAL_015_TO_REAL_016_AND_SIGKILL_RECOVERY=PASS
          # Native SQL backup/restore uses a real local system SQL client,
          # never the Owner's VPS. This is a disposable GitHub-hosted runner.
          sudo apt-get -qq update >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -y install mariadb-client >/dev/null
          command -v mariadb-dump >/dev/null
          command -v mariadb >/dev/null
          # Same verified FULL bytes must also install into genuine local
          # MySQL 8.4 and MariaDB 11.8, with dirty-database refusal.
          for engine in mysql mariadb; do
            if [ "$engine" = mysql ]; then image=mysql:8.4; client=mysql
            else image=mariadb:11.8; client=mariadb; fi
            docker pull "$image" >/dev/null
            docker run --detach --rm --name "p08-r153-$engine" \
              -e MYSQL_ROOT_PASSWORD=R153SyntheticOnly123 \
              -e MARIADB_ROOT_PASSWORD=R153SyntheticOnly123 \
              -p 127.0.0.1:3306:3306 "$image" >/dev/null
            ready=NO
            for i in $(seq 1 80); do
              if docker exec "p08-r153-$engine" "$client" -uroot \
                -pR153SyntheticOnly123 -e 'SELECT 1' >/dev/null 2>&1; then
