name: P08 R174 exact official v0.1.7 FULL Atomic onefile publication and isolated rescue
on:
  pull_request:
    types: [reopened, synchronize]
    paths:
      - .github/workflows/p08-r168-v017-issued015-3db-temp.yml
      - scripts/p08_r174_release_once.py
      - scripts/p08_r174_real_rescue_smoke.php
permissions:
  contents: read
concurrency:
  group: p08-r174-v017-official-issued015
  cancel-in-progress: false
jobs:
  formal-v017:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.number == 4171 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Exact public proof-lane sources (not Production)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged P08 main source checkout (private, ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Exact merged GOV-DOC Mode P source checkout (private, ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5bf99b73afc70a976ec6753ed5c71554b9f36a13
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated PHP 8.4 Composer and Node 22
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revalidate exact source, all passed required machine proof, and double-build real issued-015 FULL and Atomic
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          test "$(git -C gov rev-parse HEAD)" = 5bf99b73afc70a976ec6753ed5c71554b9f36a13
          git -C p08 diff --quiet c535cfbff212f193809064733bb85c184bf4afa4 aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          test "$(cat p08/VERSION)" = 0.1.7
          grep -q '| skill-release | V3.15 |' gov/CURRENT.md
          grep -q 'RP-07P' p08/docs/authority/ACCEPTANCE_MATRIX.md
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = 5bf99b73afc70a976ec6753ed5c71554b9f36a13
          for proof in 44241615238 44257494291 44259196727 44259928372 44260299070; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$proof" --jq .conclusion)" = success || {
              if test "$proof" = 44257494291; then
                # Two actual first-install jobs passed in this aggregate; the
                # obsolete HTTP job failed. Validate those exact two jobs below.
                continue
              fi
              echo P08_R174_REQUIRED_PROOF_MISSING; exit 41
            }
          done
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/44257494291/jobs?per_page=100 > "$RUNNER_TEMP/p08-r171-jobs.json"
          python3 - <<'PY'
          import json,os
          j=json.load(open(os.environ["RUNNER_TEMP"]+"/p08-r171-jobs.json"))
          jobs={x["name"]:x["conclusion"] for x in j["jobs"]}
          assert jobs["sqlite-first-install-equivalent"]=="success"
          assert jobs["mysql-first-install-equivalent"]=="success"
          print("P08_R174_REUSED_NATIVE_SQLITE_MYSQL84_JOBS_AND_OTHER_MACHINE_PROOFS=PASS")
          PY
          composer --working-dir=p08 install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm --prefix p08 ci --ignore-scripts --no-audit --no-fund
          npm --prefix p08 run build
          (cd p08 && composer check-platform-reqs --no-dev)
          test -z "$(git -C p08 status --porcelain)"
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r174"
          gh release download v0.1.5 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.5_FULL.zip -D "$RUNNER_TEMP/p08-r174"
          echo "a3e54e5fc4d8abad083a222761b9ae4cfac24d5a170b640baca6816971133f30  $RUNNER_TEMP/p08-r174/VF_AdOps_V0.1.5_FULL.zip" | sha256sum -c --status
          unzip -p "$RUNNER_TEMP/p08-r174/VF_AdOps_V0.1.5_FULL.zip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r174/old-full-manifest.json"
          echo "cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46  $RUNNER_TEMP/p08-r174/old-full-manifest.json" | sha256sum -c --status
          for slot in A B; do
            python3 -B p08/scripts/build_full.py --source p08 \
              --output "$RUNNER_TEMP/p08-r174/full-$slot.zip" \
              --version 0.1.7 --source-sha aad233c72213d2fcb3e2400ee1316bb7d8e9f071 --governance-root gov
            python3 -B p08/scripts/build_atomic.py --source p08 \
              --output "$RUNNER_TEMP/p08-r174/atomic-$slot.zip" \
              --source-version 0.1.5 --source-sha 75fdcab08f84e5bb7e4edb1a3f42098096907598 \
              --source-full-manifest-sha256 cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46 \
              --previous-full-manifest "$RUNNER_TEMP/p08-r174/old-full-manifest.json" \
              --target-version 0.1.7 --target-sha aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          done
          cmp "$RUNNER_TEMP/p08-r174/full-A.zip" "$RUNNER_TEMP/p08-r174/full-B.zip"
          cmp "$RUNNER_TEMP/p08-r174/atomic-A.zip" "$RUNNER_TEMP/p08-r174/atomic-B.zip"
          cp "$RUNNER_TEMP/p08-r174/full-A.zip" "$RUNNER_TEMP/p08-r174/VF_AdOps_V0.1.7_FULL.zip"
          cp "$RUNNER_TEMP/p08-r174/atomic-A.zip" "$RUNNER_TEMP/p08-r174/VF_AdOps_V0.1.7_UPDATE.zip"
          php -l p08/scripts/owner-first-update-recovery.php
          echo "66072b0d26064f855647e0f10ceb5241adc88e016c291630e85277d419ded53a  p08/scripts/owner-first-update-recovery.php" | sha256sum -c --status
          cp p08/scripts/owner-first-update-recovery.php "$RUNNER_TEMP/p08-r174/P08_v0.1.7_Recovery_Once.php"
          python3 - <<'PY'
          import json,hashlib,os,pathlib,zipfile
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"p08-r174"
          full="VF_AdOps_V0.1.7_FULL.zip";update="VF_AdOps_V0.1.7_UPDATE.zip"
          recovery="P08_v0.1.7_Recovery_Once.php"
          target="aad233c72213d2fcb3e2400ee1316bb7d8e9f071"
          with zipfile.ZipFile(d/full) as z:
              j=json.loads(z.read("FULL_MANIFEST.json"))
              assert j["source_sha"]==target and j["target_version"]=="0.1.7"
              assert j["type"]=="CLEAN_FULL_ONLY"
              assert all(not n.startswith("storage/") and n!=".env" for n in z.namelist())
          with zipfile.ZipFile(d/update) as z:
              j=json.loads(z.read("ATOMIC_MANIFEST.json"))
              assert j["source_sha"]=="75fdcab08f84e5bb7e4edb1a3f42098096907598"
              assert j["target_sha"]==target and j["source_version"]=="0.1.5"
              assert j["target_version"]=="0.1.7" and j["schema_changes"] is False
              assert j["source_full_manifest_sha256"]=="cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46"
              assert all(not n.startswith("database/") and not n.startswith("storage/") and n!=".env" for n in z.namelist())
          names=[full,update,recovery]
          meta={
              "schema":"p08.v0.1.7.formal-release.v1","repository":"llhzx2018/vf-adops",
              "project_id":"P08","version":"0.1.7","target_sha":target,
              "governance_sha":"5bf99b73afc70a976ec6753ed5c71554b9f36a13",
              "previous_sha":"75fdcab08f84e5bb7e4edb1a3f42098096907598",
              "previous_version":"0.1.5",
              "source_full_manifest_sha256":"cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46",
              "schema_changes":False,"production_auto_apply":False,
              "assets":{n:{"sha256":hashlib.sha256((d/n).read_bytes()).hexdigest(),
                          "bytes":(d/n).stat().st_size} for n in names},
              "evidence_runs":[44241615238,44259196727,44259928372,44260299070]
          }
          (d/"RELEASE_PROVENANCE.json").write_text(json.dumps(meta,indent=2,sort_keys=True)+"\n")
          names.append("RELEASE_PROVENANCE.json")
          (d/"SHA256SUMS").write_text("".join(hashlib.sha256((d/n).read_bytes()).hexdigest()+"  "+n+"\n" for n in names))
          print("P08_R174_GENUINE_MERGED_MAIN_DOUBLE_BUILT_015_TO_017_AND_ONEFILE=PASS")
          PY
          cat > "$RUNNER_TEMP/p08-r174/RELEASE_NOTES.md" <<'NOTES'
          P08 VF AdOps v0.1.7 — Official first installed-update recovery

          Official assets:
          - VF_AdOps_V0.1.7_FULL.zip: only for clean fresh installation.
          - VF_AdOps_V0.1.7_UPDATE.zip: code-only Atomic only from exact officially issued v0.1.5 FULL, not v0.1.6.
          - P08_v0.1.7_Recovery_Once.php: separately SHA-indexed site-user CLI helper for the specific installed v0.1.5 PREPARE failure (NEEDS_RECOVERY / missing status). Never a web endpoint.

          For the impacted installation: Owner first performs a manual off-site backup. Verify the official onefile SHA256 from SHA256SUMS and its source/provenance, place it outside public web root, then as the site's non-root user run php P08_v0.1.7_Recovery_Once.php --inspect /absolute/site/root; if identity is exact, explicitly run --prepare with that same root. Only the authenticated Owner may subsequently click Apply in the existing Update page. Do not copy a FULL over the installed website. No automatic Production, CloudPanel or DNS changes.

          Human Owner Preview / Real Use remains pending per GOV-DOC Mode P (single case).
          NOTES
          echo P08_R174_PREPUBLICATION_FINAL_MERGED_SOURCE_AND_ASSET_GATE=PASS
      - name: Publish official GitHub release and update only P08 stable channel with CAS + asset remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/p08_r174_release_once.py
      - name: Actual official online failed-PREPARE rescue on a disposable v0.1.5 SQLite installation (no Apply)
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          P08_R174_ISOLATED: YES
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          SITE="$RUNNER_TEMP/p08-r174-site"
          mkdir -m 700 "$SITE"
          unzip -q "$RUNNER_TEMP/p08-r174/VF_AdOps_V0.1.5_FULL.zip" -d "$SITE"
          php scripts/p08_r174_real_rescue_smoke.php seed "$SITE"
          php "$RUNNER_TEMP/p08-r174/P08_v0.1.7_Recovery_Once.php" --inspect "$SITE"
          php "$RUNNER_TEMP/p08-r174/P08_v0.1.7_Recovery_Once.php" --prepare "$SITE"
          php scripts/p08_r174_real_rescue_smoke.php verify "$SITE"
          echo P08_R174_OFFICIAL_ONLINE_RESCUE_PREPARED_OWNER_APPLY_SEPARATE=PASS
      - name: Always delete private source, Owner synthetic site, credentials, official packages and transient material
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r174" "$RUNNER_TEMP/p08-r174-site" "$RUNNER_TEMP/p08-r171-jobs.json"
          test ! -e p08 && test ! -e gov && test ! -e "$RUNNER_TEMP/p08-r174" && test ! -e "$RUNNER_TEMP/p08-r174-site"
