name: P08 R175 published v0.1.7 official rescue exact isolated last-hop (READ ONLY)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r168-v017-issued015-3db-temp.yml
      - scripts/p08_r174_real_rescue_smoke.php
permissions:
  contents: read
jobs:
  official-online-rescue-readonly:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.number == 4171 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Exact reviewed isolated test (no product source or release writes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP 8.4 and SQLite native recovery
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Verify original and newly published private official immutable assets and exact P08 channel
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.7 --jq .object.sha)" = aad233c72213d2fcb3e2400ee1316bb7d8e9f071
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.7 --jq .id)" = 449685536
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main --header 'Accept: application/vnd.github.raw+json' --jq '.target_version')" = 0.1.7
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r175-assets"
          gh release download v0.1.5 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.5_FULL.zip -D "$RUNNER_TEMP/p08-r175-assets"
          gh release download v0.1.7 -R llhzx2018/vf-adops -p P08_v0.1.7_Recovery_Once.php -D "$RUNNER_TEMP/p08-r175-assets"
          echo "a3e54e5fc4d8abad083a222761b9ae4cfac24d5a170b640baca6816971133f30  $RUNNER_TEMP/p08-r175-assets/VF_AdOps_V0.1.5_FULL.zip" | sha256sum --status -c
          echo "66072b0d26064f855647e0f10ceb5241adc88e016c291630e85277d419ded53a  $RUNNER_TEMP/p08-r175-assets/P08_v0.1.7_Recovery_Once.php" | sha256sum --status -c
          php -l scripts/p08_r174_real_rescue_smoke.php
          php -l "$RUNNER_TEMP/p08-r175-assets/P08_v0.1.7_Recovery_Once.php"
          echo P08_R175_OFFICIAL_RELEASE_REAL_ASSET_SHA256_AND_CHANNEL_READBACK=PASS
      - name: Execute genuine installed v0.1.5 failed-PREPARE to actual official v0.1.7 PREPARED only
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          P08_R174_ISOLATED: YES
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p08-r174-site"
          mkdir -m 700 "$SITE"
          unzip -q "$RUNNER_TEMP/p08-r175-assets/VF_AdOps_V0.1.5_FULL.zip" -d "$SITE"
          php scripts/p08_r174_real_rescue_smoke.php seed "$SITE"
          php "$RUNNER_TEMP/p08-r175-assets/P08_v0.1.7_Recovery_Once.php" --inspect "$SITE"
          php "$RUNNER_TEMP/p08-r175-assets/P08_v0.1.7_Recovery_Once.php" --prepare "$SITE"
          php scripts/p08_r174_real_rescue_smoke.php verify "$SITE"
          echo P08_R175_TRUE_ISSUED_V015_NEEDS_RECOVERY_OFFICIAL_V017_PREPARED_OWNER_CLICK_PENDING=PASS
      - name: Always delete synthetic site and all temporary downloaded private files
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p08-r174-site" "$RUNNER_TEMP/p08-r175-assets"
          test ! -e "$RUNNER_TEMP/p08-r174-site" && test ! -e "$RUNNER_TEMP/p08-r175-assets"
