name: P08 R170 exact release-governance Mode P and rescue asset isolated gate
on:
  pull_request:
    paths:
      - .github/workflows/p08-r168-v017-issued015-3db-temp.yml
permissions:
  contents: read
jobs:
  p08-release-preflight-no-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: PHP 8.4 and Python environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,posix
          coverage: none
      - name: Exact P08 PR65 source checkout (no persisted token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: bbf78582fd88448fbbb816613193488c7f7bac02
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          fetch-depth: 0
          persist-credentials: false
      - name: Exact GOV-DOC Mode P candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 9612dbd4a4aad3ccca685c48b8058602cf07f828
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable executable tree, Mode P only and gated onefile source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = bbf78582fd88448fbbb816613193488c7f7bac02
          test "$(git -C gov rev-parse HEAD)" = 9612dbd4a4aad3ccca685c48b8058602cf07f828
          test "$(cat p08/VERSION)" = 0.1.7
          test "$(git -C p08 hash-object scripts/owner-first-update-recovery.php)" = 7bddd873b481d1657698285cd1352c1a71242ed4
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path("p08")
          g=Path("gov")
          files=subprocess.check_output(
              ["git","-C","p08","diff","--name-only",
               "cc83587859c8d8e6b0cd8f3afd2dd6156b6522f5","HEAD"],text=True).splitlines()
          allowed={"AGENTS.md","docs/authority/ACCEPTANCE_MATRIX.md",
                   "docs/authority/CURRENT.md","docs/authority/RPD.md",
                   "docs/evidence/R168_V017_FIRST_UPGRADE_RECOVERY_NATIVE_BOUNDED_20261118.md"}
          assert set(files)==allowed,("P08_EXECUTABLE_DRIFT",files)
          updates=subprocess.check_output(["git","-C","gov","diff","--name-only",
              "f9577f976eef884d76058372f7701275b8324d42","HEAD"],text=True).splitlines()
          assert set(updates)=={
            "CURRENT.md",
            "skills/skill-release/V3.15/SKILL.md",
            "governance/release/cases/P08_ADOPS_017_PR65_FAILED_PREPARE_RESCUE_POST_RELEASE_OWNER_MANUAL_20261118.md",
          },("GOV_CASE_SCOPE_DRIFT",updates)
          curr=(g/"CURRENT.md").read_text()
          old=(g/"skills/skill-release/V3.14/SKILL.md").read_text()
          skill=(g/"skills/skill-release/V3.15/SKILL.md").read_text()
          case=(g/"governance/release/cases/P08_ADOPS_017_PR65_FAILED_PREPARE_RESCUE_POST_RELEASE_OWNER_MANUAL_20261118.md").read_text()
          acceptance=(p/"docs/authority/ACCEPTANCE_MATRIX.md").read_text()
          assert "| skill-release | V3.15 |" in curr
          assert "### Mode P" in skill and "### Mode O" in skill
          assert "V3.14 · ONLY P08 v0.1.5 / PR #60" in skill
          assert len(skill)>len(old)
          assert "RP-07P" in curr and "RP-07P" in acceptance
          assert "PREVIOUS_SOURCE_SHA=75fdcab08f84e5bb7e4edb1a3f42098096907598" in case
          assert "TARGET_VERSION=0.1.7" in case
          assert "13-domain" in case and "zero-step" in case
          assert "PRODUCTION_AUTO_APPLY=NO" in case
          assert "OWNER_PRODUCT_ACCEPTANCE=PENDING" in case
          for bad in ("PRODUCTION_AUTO_APPLY=YES","OWNER_PRODUCT_ACCEPTANCE=PASS",
                      "OWNER_PREVIEW_RUNTIME=PASS"):
              assert bad not in case
          print("P08_R170_SCOPE_AUTHORITY_CASE_BOUND_AND_ONLY_HUMAN_TIMING=PASS")
          PY
          php -l p08/scripts/owner-first-update-recovery.php
          php -l p08/tests/test_owner_first_update_recovery.php
          GITHUB_ACTIONS=true P08_R168_ISOLATED_TEST=YES php p08/tests/test_owner_first_update_recovery.php
          echo P08_R170_EXISTING_RESCUE_REGRESSION=PASS
          cp p08/scripts/owner-first-update-recovery.php "$RUNNER_TEMP/VF_AdOps_V0.1.7_OWNER_RESCUE.php"
          test "$(git hash-object "$RUNNER_TEMP/VF_AdOps_V0.1.7_OWNER_RESCUE.php")" = 7bddd873b481d1657698285cd1352c1a71242ed4
          php -l "$RUNNER_TEMP/VF_AdOps_V0.1.7_OWNER_RESCUE.php"
          sha256sum "$RUNNER_TEMP/VF_AdOps_V0.1.7_OWNER_RESCUE.php"
          echo P08_R170_SEPARATE_ONEFILE_ASSET_SOURCE_AND_SHA256_VERIFIED=PASS
      - name: Test existing governance and project architecture gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -m unittest discover -s gov/governance/public-authority/tools -p 'test_*' -q
          python3 -B -m unittest discover -s gov/governance/agent -p 'test_*' -q
          python3 -B -m unittest discover -s p08/.github/checks -p test_architecture_gate.py -q
          python3 -B -m unittest discover -s p08/.github/checks -p test_gov_doc_ci.py -q
          python3 -B p08/.github/checks/architecture_gate.py \
            --manifest p08/.github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --git-root p08 --base-sha dfe477e7dab2760d4bb9c5b6eefb9e6ec893a43a \
            --head-sha bbf78582fd88448fbbb816613193488c7f7bac02
          echo P08_R170_EXACT_GOV_PROJECT_ARCHITECTURE=PASS
      - name: Delete private source and temporary single-file candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/VF_AdOps_V0.1.7_OWNER_RESCUE.php"
          test ! -e p08 && test ! -e gov
