name: P08 R173 v017 prepublication genuine FULL Atomic onefile identity proof
on:
  pull_request:
    paths: [.github/workflows/p08-r168-v017-issued015-3db-temp.yml]
permissions:
  contents: read
jobs:
  final-three-asset-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: PHP 8.4 build dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,sqlite3,pdo_sqlite,pdo_mysql,openssl,posix
          coverage: none
      - name: Get exact private P08 PR65 source (ephemeral, no persisted auth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: c535cfbff212f193809064733bb85c184bf4afa4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
          fetch-depth: 0
      - name: Get candidate canonical 13-domain governance (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 8e0f714412934038a6b227e9f9d52e33a8f74628
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: Node 22 source frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source official v0.1.5 -> two identical v0.1.7 FULL/Atomic build and rescue bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = c535cfbff212f193809064733bb85c184bf4afa4
          test "$(git -C gov rev-parse HEAD)" = 8e0f714412934038a6b227e9f9d52e33a8f74628
          test "$(cat p08/VERSION)" = 0.1.7
          test -z "$(git -C p08 status --porcelain)"
          composer --working-dir=p08 install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist --optimize-autoloader
          npm --prefix p08 ci --ignore-scripts --no-audit --no-fund
          npm --prefix p08 run build
          (cd p08 && composer check-platform-reqs --no-dev)
          test -z "$(git -C p08 status --porcelain)"
          mkdir -p "$RUNNER_TEMP/p08-r173"
          gh release download v0.1.5 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.5_FULL.zip -D "$RUNNER_TEMP/p08-r173"
          echo "a3e54e5fc4d8abad083a222761b9ae4cfac24d5a170b640baca6816971133f30  $RUNNER_TEMP/p08-r173/VF_AdOps_V0.1.5_FULL.zip" | sha256sum -c --status
          unzip -p "$RUNNER_TEMP/p08-r173/VF_AdOps_V0.1.5_FULL.zip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r173/old-full-manifest.json"
          echo "cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46  $RUNNER_TEMP/p08-r173/old-full-manifest.json" | sha256sum -c --status
          python3 -B - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"p08-r173/old-full-manifest.json"
          j=json.loads(p.read_bytes())
          assert j["type"]=="CLEAN_FULL_ONLY" and j["project_id"]=="P08"
          assert j["source_sha"]=="75fdcab08f84e5bb7e4edb1a3f42098096907598"
          assert j["target_version"]=="0.1.5"
          print("P08_R173_ACTUAL_ISSUED_OFFICIAL_015_FULL_SOURCE_AND_MANIFEST=PASS")
          PY
          for key in A B; do
            python3 -B p08/scripts/build_full.py --source p08 \
              --output "$RUNNER_TEMP/p08-r173/full-$key.zip" \
              --version 0.1.7 --source-sha c535cfbff212f193809064733bb85c184bf4afa4 \
              --governance-root gov
            python3 -B p08/scripts/build_atomic.py --source p08 \
              --output "$RUNNER_TEMP/p08-r173/atomic-$key.zip" \
              --source-version 0.1.5 --source-sha 75fdcab08f84e5bb7e4edb1a3f42098096907598 \
              --source-full-manifest-sha256 cda5fbe9523dbdb5d35d0a1ef5ea4e55e45d3ad19de1a82b259f7ed2edc1de46 \
              --previous-full-manifest "$RUNNER_TEMP/p08-r173/old-full-manifest.json" \
              --target-version 0.1.7 --target-sha c535cfbff212f193809064733bb85c184bf4afa4
          done
          cmp "$RUNNER_TEMP/p08-r173/full-A.zip" "$RUNNER_TEMP/p08-r173/full-B.zip"
          cmp "$RUNNER_TEMP/p08-r173/atomic-A.zip" "$RUNNER_TEMP/p08-r173/atomic-B.zip"
          php -l p08/scripts/owner-first-update-recovery.php
          test "$(git -C p08 hash-object scripts/owner-first-update-recovery.php)" = 7bddd873b481d1657698285cd1352c1a71242ed4
          echo "66072b0d26064f855647e0f10ceb5241adc88e016c291630e85277d419ded53a  p08/scripts/owner-first-update-recovery.php" | sha256sum -c --status
          python3 -B - <<'PY'
          import json,os,pathlib,zipfile
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"p08-r173"
          with zipfile.ZipFile(base/"full-A.zip") as z:
              m=json.loads(z.read("FULL_MANIFEST.json"))
              assert m["source_sha"]=="c535cfbff212f193809064733bb85c184bf4afa4"
              assert m["target_version"]=="0.1.7" and m["type"]=="CLEAN_FULL_ONLY"
              assert not any(p.startswith("storage/app/private/") or p==".env" for p in z.namelist())
          with zipfile.ZipFile(base/"atomic-A.zip") as z:
              m=json.loads(z.read("ATOMIC_MANIFEST.json"))
              assert m["source_version"]=="0.1.5" and m["target_version"]=="0.1.7"
              assert m["source_sha"]=="75fdcab08f84e5bb7e4edb1a3f42098096907598"
              assert m["target_sha"]=="c535cfbff212f193809064733bb85c184bf4afa4"
              assert m["schema_changes"] is False
              assert not any(p.startswith("database/") or p.startswith("storage/") or p==".env" for p in z.namelist())
          print("P08_R173_ACTUAL_FINAL_PR_SOURCE_REAL_FULL_ATOMIC_MANIFESTS=PASS")
          PY
          sha256sum "$RUNNER_TEMP/p08-r173/full-A.zip" "$RUNNER_TEMP/p08-r173/atomic-A.zip" p08/scripts/owner-first-update-recovery.php
          echo P08_R173_REPRODUCIBLE_FULL_ATOMIC_AND_HASHED_RESCUE_SOURCE=PASS
          echo P08_R173_PUBLICATION=NO_PREPUBLICATION_ONLY
      - name: Wipe all private source and build output
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r173"
          test ! -e p08 && test ! -e gov && test ! -e "$RUNNER_TEMP/p08-r173"
