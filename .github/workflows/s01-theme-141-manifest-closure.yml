name: S01-C01 1.35.141 distribution premerge
on:
  push:
    branches: [task/s01-blog-article-audit-20261019]
    paths: ['.github/workflows/s01-theme-141-manifest-closure.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.141
  TARGET_SHA: 127d9b7d7431f3ceab167318db44f4fb4b719907
  DIST_SHA: 185e0ffc879aac48b261288f380015ce917861d0
  EXPECTED_SHA256: c7dc1ee1c50caccd2cadbf8952b5bfe70b987f5f890c43ce0a9a9fef9da71526
  EXPECTED_BYTES: '1956345'
jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 185e0ffc879aac48b261288f380015ce917861d0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Exact manifest and registered native CI equivalent
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$DIST_SHA"
          (cd updates && python3 scripts/check_manifest_contract.py > /tmp/manifest-audit.json)
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.txt
          php updates/update-core/php/tests/run.php
          python3 - <<'PY'
          import json,os
          a=json.load(open('/tmp/manifest-audit.json'));assert a['status']=='PASS'
          m=json.load(open('updates/projects/S01-C01.json'));v=os.environ['TARGET_VERSION']
          assert m['target_version']==v and m['release_tag']=='v'+v
          assert m['asset_name']==f'vf-tools-theme_V{v}.zip'
          assert m['repository']==os.environ['TARGET_REPO']
          assert m['asset_sha256']==os.environ['EXPECTED_SHA256']
          assert m['asset_bytes']==int(os.environ['EXPECTED_BYTES'])
          assert m['runtime_files']==476 and '1.35.140' in m['from_versions']
          print('DISTRIBUTION_EXACT_MANIFEST_SCHEMA=PASS')
          PY
      - name: Verify published release exact bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "v$TARGET_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V$TARGET_VERSION.zip"
          echo "$EXPECTED_SHA256  vf-tools-theme_V$TARGET_VERSION.zip" | sha256sum -c
          test "$(stat -c%s "vf-tools-theme_V$TARGET_VERSION.zip")" = "$EXPECTED_BYTES"
          echo 'DISTRIBUTION_RELEASE_BYTES=PASS'
      - name: Cleanup
        if: always()
        run: rm -rf updates vf-tools-theme_V*.zip
