name: P07 release102 package closure exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release102-package-closure-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-release102-package-closure-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 82b96cb76e418c6730adb47d349a2aa2efe1be71
    steps:
      - name: Require configured private source read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout public distribution baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P07 release102 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 82b96cb76e418c6730adb47d349a2aa2efe1be71
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Verify exact source and package closure regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = '0.1.0-release102'
          bash -n bin/vfops
          bash bin/vfops --help | grep -F 'vfops server-migrate diagnose-sql --migration-id ID --domain DOMAIN'
          python3 -B -m py_compile lib/server_migration_pull.py lib/sql_diff_evidence.py scripts/p07_candidate_bundle.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for test_file in test_sql_diff_evidence.py test_sql_diff_command.py test_cross_engine_sql_format.py test_server_migration_pull.py test_verify.py test_mariadb_owner_policy.py test_secret_scan.py test_p07_bundle_identity.py; do
            python3 -B -m unittest discover -s tests -p "$test_file" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_RELEASE102_PACKAGE_CLOSURE_EXACT_SOURCE_PASS
      - name: Stage isolated release102 package from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B p07-private/scripts/p07_candidate_bundle.py --product-root p07-private --public-root . --output "$RUNNER_TEMP/p07-release102-candidate" --product-sha "$PRODUCT_SHA" --build 0.1.0-release102 --care 0.1.0-rc71
          test "$(grep -c '  lib/sql_diff_evidence.py' "$RUNNER_TEMP/p07-release102-candidate/dist/p07/0.1.0/overlay/RUNTIME.gitblob")" = 1
          test "$(grep -c '  tests/test_sql_diff_evidence.py' "$RUNNER_TEMP/p07-release102-candidate/dist/p07/0.1.0/overlay/MANIFEST.gitblob")" = 1
          echo P07_RELEASE102_ISOLATED_PACKAGE_PASS
      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: |
          if [ -d p07-private ]; then rm -rf -- p07-private; fi
          echo P07_PRIVATE_CHECKOUT_CLEANUP_DONE
