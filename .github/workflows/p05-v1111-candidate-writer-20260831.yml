name: P05 V1.1.11 Candidate Writer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  write-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      P05_BRANCH: fix/p05-php-online-update-20260831
      EXPECTED_HEAD: 180423d18e21615aeb776633c51f82d8567d5e68
      VERSION: 1.1.11
      MECHANISM_RUN: '33324381888'
      MECHANISM_JOB: '99291824138'
    steps:
      - name: Checkout exact P05 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - name: Write candidate identity and authority
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version=os.environ['VERSION']
          Path('VERSION').write_text(version+'\n')
          p=Path('package.json')
          data=json.loads(p.read_text())
          data['version']=version
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('package-lock.json')
          data=json.loads(p.read_text())
          data['version']=version
          data['packages']['']['version']=version
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('VF_PROJECT.json')
          data=json.loads(p.read_text())
          data.update({
            'status':'V1.1.11_RELEASE_CANDIDATE / MACHINE_GATE_PENDING / PRODUCTION_NOT_DEPLOYED',
            'version':version,
            'target_version':version,
            'working_version':version,
            'version_change':True,
            'working_branch':os.environ['P05_BRANCH'],
            'runtime_recovery_candidate':'V1.1.11_PHP_ONLINE_UPDATE_CANDIDATE',
            'candidate_authorization':'PENDING_MACHINE_GATE_V1.1.11',
            'release_authorization':'NOT_YET_AUTHORIZED_V1.1.11',
            'next_action':'RUN_V1.1.11_EXACT_SOURCE_GATE_THEN_RELEASE_GATE',
            'deployment_readiness':'V1.1.11_CANDIDATE_MACHINE_GATE_PENDING',
            'production_deployment':'NOT_DEPLOYED',
            'production_write':0,
            'owner_real_use_pass':'NOT_PROVEN_FOR_V1.1.11',
          })
          data.setdefault('authority',{})['release_candidate']='docs/authority/RELEASE_V1.1.11_CANDIDATE.md'
          data['v1_1_11_php_online_update']={
            'state':'CANDIDATE_MACHINE_GATE_PENDING',
            'candidate_branch':os.environ['P05_BRANCH'],
            'mechanism_source':os.environ['EXPECTED_HEAD'],
            'mechanism_gate_run':int(os.environ['MECHANISM_RUN']),
            'mechanism_gate_job':int(os.environ['MECHANISM_JOB']),
            'runtime':'PHP_NATIVE_CLOUDPANEL',
            'status_endpoint':'/api/system/update/status',
            'apply_endpoint':'/api/system/update/apply',
            'distribution_authority':'PUBLIC_VERIFIED_MIRROR_CORE_FREE_RUNNER_PUBLIC',
            'server_private_token_required':False,
            'update_type':'ATOMIC_FULL',
            'automatic_sqlite_backup':True,
            'runtime_pointer_preserved':True,
            'private_sqlite_preserved':True,
            'rollback_tree_preserved':True,
            'opcache_runtime_detection':True,
            'opcache_fail_closed':True,
            'normal_update_requires_shell':False,
            'final_manual_update_baseline':'V1.1.10_TO_V1.1.11',
            'future_update_mode':'BACKEND_SYSTEM_AND_UPDATE',
            'production_state':'NOT_DEPLOYED'
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir -p docs/authority docs/evidence
          cat > docs/authority/RELEASE_V1.1.11_CANDIDATE.md <<'EOF'
          # P05 · VF SEO v1.1.11 Release Candidate

          Status: `MACHINE_GATE_PENDING`

          v1.1.11 establishes the PHP-native backend online-update baseline for CloudPanel installs.

          Candidate contract:
          - visible `系统与更新` entry;
          - PHP `/api/system/update/status` and `/api/system/update/apply`;
          - public verified distribution mirror; no private GitHub token on the server;
          - formal FULL SHA-256 verification before extraction;
          - automatic SQLite backup;
          - sibling staging and atomic webroot swap;
          - preserve `VF_INSTALL_INSTANCE.json` and private SQLite state;
          - rollback code tree retained;
          - active OPcache detection and fail-closed reset handling;
          - no SSH/CLI required for normal future updates.

          v1.1.10 → v1.1.11 is intended to be the final manual CloudPanel update. From v1.1.11 forward, formal later versions are intended to be installed through the backend update center.

          Production: `NOT_DEPLOYED`.
          EOF
          cat > docs/evidence/V1.1.11_PHP_ONLINE_UPDATE_MECHANISM_20260831.md <<EOF
          # V1.1.11 PHP Online Update Mechanism Evidence

          Final mechanism source before version freeze: \`$EXPECTED_HEAD\`

          Public Runner mechanism Gate:
          - Run: \`$MECHANISM_RUN\`
          - Job: \`$MECHANISM_JOB\`
          - Result: \`PASS\`

          The Gate performed a real public-distribution update smoke: download, GitHub SHA-256 verification, SQLite backup, staging, atomic webroot switch, runtime pointer preservation, private SQLite/data preservation, rollback-tree preservation, and OPcache production-path contract checks.

          Release write: `0` during mechanism Gate.
          Production write: `0`.
          EOF
          test "$(cat VERSION)" = "$VERSION"
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),v=require('./VF_PROJECT.json'); if(p.version!='$VERSION'||l.version!='$VERSION'||l.packages[''].version!='$VERSION'||v.version!='$VERSION') process.exit(1)"
          git diff --name-only
      - name: Commit candidate freeze
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name "VF Public Runner"
          git config user.email "actions@users.noreply.github.com"
          git add VERSION package.json package-lock.json VF_PROJECT.json docs/authority/RELEASE_V1.1.11_CANDIDATE.md docs/evidence/V1.1.11_PHP_ONLINE_UPDATE_MECHANISM_20260831.md
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git commit -m "release(P05): freeze v1.1.11 online update candidate"
          git push origin "HEAD:$P05_BRANCH"
          echo "P05_V1111_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo "P05_PRODUCTION_WRITE=0"
