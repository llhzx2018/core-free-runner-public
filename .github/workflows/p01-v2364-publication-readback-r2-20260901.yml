name: P01 V2.36.4 Publication Readback R2
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-publication-readback-r2-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      MAIN_EXPECTED: 8fedb0d1dab25d23e598029bd39c0cbea50916b0
      DEVELOP_EXPECTED: 48da73b3d69279de507d21c9f095094f5b8948da
      COMPOSITE_TREE: 0c790c1580078813c47e5c0f56f1ced9bd3d66cc
      FORMAL_RUN: '33520819304'
      FORMAL_ARTIFACT: p01-v2364-formal-artifacts-r4-33520819304
      FORMAL_ARTIFACT_ID: '9805594341'
      FORMAL_DIGEST: sha256:3fd26ca5c07f43955566466501b8f2232e80974f96588ff5a01d19963c03ac4f
      PUBLICATION_R1: '33524823393'
      PUBLICATION_R1_ARTIFACT: '9807217703'
      PUBLICATION_R1_DIGEST: sha256:3c719cf43116e3f29192735655a4b589ddf81c6e6a5cea120661c1344730cd10
      RELEASE_ID: '380614937'
      DOWNLOAD: /tmp/p01-v2364-publication-r2-formal
      ROUNDTRIP: /tmp/p01-v2364-publication-r2-roundtrip
      EVID: /tmp/p01-v2364-publication-r2-evidence
    steps:
      - name: Confirm R1 classification in runner authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_R1 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_R1/artifacts --jq ".artifacts[] | select(.id==$PUBLICATION_R1_ARTIFACT) | .digest")" = "$PUBLICATION_R1_DIGEST"
      - name: Download exact Formal Artifact R4 bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Read back existing immutable publication only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf "$ROUNDTRIP" "$EVID"; mkdir -p "$ROUNDTRIP" "$EVID"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.4-FULL.zip' -print -quit)
          test -n "$FULL"
          PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          find "$PACK" -maxdepth 1 -type f -printf '%f\n' | sort | tee "$EVID/formal-pack-files.txt"
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/formal-sha256-check.txt"
          test "$(sha256sum VF-Start-V2.36.4-FULL.zip | awk '{print $1}')" = 552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24
          test "$(stat -c %s VF-Start-V2.36.4-FULL.zip)" = 587272
          test "$(sha256sum VF_Start_V2.36.4_UPDATE.zip | awk '{print $1}')" = ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
          test "$(stat -c %s VF_Start_V2.36.4_UPDATE.zip)" = 1237066
          test "$(sha256sum repair-v2.36.4.php | awk '{print $1}')" = cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee
          test "$(stat -c %s repair-v2.36.4.php)" = 3592809

          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.4 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEV=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$MAIN_EXPECTED"
          test "$DEV" = "$DEVELOP_EXPECTED"
          git fetch origin "$MAIN" "$DEV" --quiet
          test "$(git rev-parse "$MAIN^{tree}")" = "$COMPOSITE_TREE"
          test "$(git rev-parse "$DEV^{tree}")" = "$COMPOSITE_TREE"
          test "$(git rev-parse "$MAIN:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$MAIN"

          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.4 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.4
          test "$(jq -r .name "$EVID/release.json")" = 'VF Start V2.36.4'
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          TARGET_COMMITISH=$(jq -r .target_commitish "$EVID/release.json")
          test "$TARGET_COMMITISH" = main
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort | tee "$EVID/release-assets.tsv"

          gh release download v2.36.4 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          test "$(find "$ROUNDTRIP" -maxdepth 1 -type f | wc -l)" = 8
          for f in "$PACK"/*; do
            n=$(basename "$f")
            test -f "$ROUNDTRIP/$n"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n" | awk '{print $1}')"
            test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"
          done
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2364_PUBLICATION_READBACK_R2=PASS\nTAG=v2.36.4\nTAG_SOURCE=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nTARGET_COMMITISH=%s\nTARGET_COMMITISH_AUTHORITY=INFORMATIONAL_ONLY\nSOURCE_AUTHORITY=TAG_REF_EXACT_FORMAL_SOURCE\nASSET_COUNT=8\nFULL_BYTES=587272\nFULL_SHA256=552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24\nUPDATE_ASSET=VF_Start_V2.36.4_UPDATE.zip\nUPDATE_BYTES=1237066\nUPDATE_SHA256=ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b\nREPAIR_BYTES=3592809\nREPAIR_SHA256=cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nMAIN=%s\nDEVELOP=%s\nCOMPOSITE_TREE=%s\nR1_FAILURE=POST_PUBLICATION_TARGET_COMMITISH_HARNESS_ONLY\nR1_ARTIFACT=%s\nR1_ARTIFACT_DIGEST=%s\nRELEASE_WRITE=NO\nTAG_WRITE=NO\nCORE_UPDATES_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$TARGET_COMMITISH" "$FORMAL_SOURCE" "$FORMAL_TREE" "$RUNTIME_TREE" "$MAIN" "$DEV" "$COMPOSITE_TREE" "$PUBLICATION_R1_ARTIFACT" "$PUBLICATION_R1_DIGEST" | tee "$EVID/verdict.txt"
      - name: Upload publication readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-publication-readback-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
