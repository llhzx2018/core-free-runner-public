name: P04 V2.5.5 Patch Escape Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p04-v255-patch-escape-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: hotfix/p04-v2.5.5-online-handoff-contract
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: p04
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          path: runner
      - run: |
          set -Eeuo pipefail
          python3 runner/scripts/p04-v255-apply-hotfix.py p04
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('p04/scripts/build-v251-maintenance-release.py').read_text(encoding='utf-8')
          a=s.index("php=f'''"); b=s.index("'''",a+8)
          block=s[a:b]
          for m in re.finditer(r'(?<!\\)\\[A-Z]',block):
              print('SINGLE_BACKSLASH_AT',m.start(),repr(block[max(0,m.start()-120):m.start()+240]))
          PY
          python3 -m py_compile p04/scripts/build-v251-maintenance-release.py
