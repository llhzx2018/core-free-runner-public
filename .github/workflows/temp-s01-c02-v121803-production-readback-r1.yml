name: TEMP S01-C02 Ops 1.21.803 Production Readback R1
on:
  push:
    branches: [temp/s01-c02-v121803-production-readback-20260904-r1]
    paths: ['.github/workflows/temp-s01-c02-v121803-production-readback-r1.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Public Production REST readback
        shell: bash
        run: |
          set -Eeuo pipefail
          fetch_json() {
            local name="$1" url="$2" out="/tmp/${name}.json"
            code="$(curl -sS -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$out" -w '%{http_code}' "$url")"
            echo "${name}_HTTP=${code}"
            test "$code" = "200"
            jq empty "$out"
            echo "${name}_JSON=$(jq -c . "$out")"
          }
          fetch_json DOMAIN 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          fetch_json SEO 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          fetch_json STATIC 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness'
          jq -e '.pluginVersion=="1.21.803"' /tmp/STATIC.json >/dev/null
          echo 'PRODUCTION_PLUGIN_VERSION_1_21_803=PASS'
          echo 'PASS_V121803_PRODUCTION_PUBLIC_READBACK'
