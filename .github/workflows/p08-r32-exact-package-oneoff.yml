name: P08 0.1.1 exact-source FULL Atomic build proof (one-off; NOT RELEASE)
on:
  push:
    branches:
      - task/p08-r32-package-proof-20261109

permissions:
  contents: read

concurrency:
  group: p08-r32-exact-package-proof-20261109
  cancel-in-progress: false

jobs:
  p08-verified-candidate-build:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_only_password
          MARIADB_DATABASE: vf_lander_ci
          MARIADB_USER: vf_lander_ci
          MARIADB_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      P08_MARIADB_CI_ONLY: '1'
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      P08_SOURCE_SHA: 6606cffa12ea082e746f0c722963144613a2f68e
      P08_ORIGINAL_SOURCE: ccf3b1569b16287350a4dd09672dcd6eab3db67a
    steps:
      - name: Transient checkout of exact P08 candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-lander
          ref: 6606cffa12ea082e746f0c722963144613a2f68e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p08-private-source

      - name: Restore actual PHP and Node build tools
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, xml, curl, pdo_mysql, pdo_sqlite, sqlite3, fileinfo, zip
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact source and isolated build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private-source
          test "$(git rev-parse HEAD)" = "$P08_SOURCE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = 0.1.1
          test "$(git show "$P08_ORIGINAL_SOURCE":VERSION)" = 0.1.0
          test -z "$(git status --porcelain --untracked-files=all)"
          for program in git php composer npm python3 tar sha256sum; do
            command -v "$program" >/dev/null
          done
          bash -n backend/bin/build-p08-release-candidates.sh
          bash -n backend/bin/publish-p08-verified-release.sh
          echo P08_R32_PUBLIC_RUNNER_EXACT_SOURCE_AND_TOOLS=PASS

      - name: Build real exact-source 0.1.1 FULL Atomic and CloudPanel FULL locally
        shell: bash
        working-directory: p08-private-source
        run: |
          set -Eeuo pipefail
          set +x
          output="$RUNNER_TEMP/p08-r32-exact-source-artifacts"
          log="$RUNNER_TEMP/p08-r32-build.log"
          if ! bash backend/bin/build-p08-release-candidates.sh "$output" >"$log" 2>&1; then
            echo P08_R32_REAL_FULL_ATOMIC_BUILD=FAIL
            grep -E '^P08_RELEASE_BUILD_BLOCKED=[A-Z0-9_]+$|^P08_R28_PACKAGE_BLOCKED=[A-Z0-9_]+$|^FULL_CANDIDATE_.*(PASS|FAIL|BLOCKED)$' "$log" | tail -15 || true
            exit 1
          fi
          for name in vf-lander-0.1.1-FULL.tar.gz vf-lander-0.1.1-ATOMIC.tar.gz vf-lander-0.1.1-CLOUDPANEL-FULL.tar.gz; do
            test -s "$output/$name"
          done
          (cd "$output" && sha256sum -c --status SHA256SUMS)
          echo P08_R32_REAL_FULL_ATOMIC_CLOUDPANEL_PACKAGE_SHA256=PASS
          echo P08_R32_PACKAGES_PRIVATE_TEMP_ONLY=YES
          echo P08_R32_NOT_OFFICIAL_RELEASE=YES

      - name: Install disposable MariaDB and nginx test clients
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client nginx >/dev/null
          echo P08_R32_MARIADB_AND_NGINX_TOOLS=PASS

      - name: Isolated MariaDB 11.8 FULL CloudPanel recovery and Atomic rollback
        shell: bash
        working-directory: p08-private-source
        run: |
          set -Eeuo pipefail
          set +x
          buildlog="$RUNNER_TEMP/p08-r32-recovery-full.log"
          if ! bash backend/tests/ops/build-full-candidate.sh >"$buildlog" 2>&1; then
            echo P08_R32_RECOVERY_FULL_BUILD=FAIL
            grep -E '^FULL_CANDIDATE_[A-Z0-9_]+(=PASS|_PASS)        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/p08-private-source" "$RUNNER_TEMP/p08-r32-exact-source-artifacts" "$RUNNER_TEMP/p08-r32-build.log" "$RUNNER_TEMP/p08-r32-recovery-full.log" "$RUNNER_TEMP/p08-r32-recovery-proof.log" "$RUNNER_TEMP/p08-r32-browser.log" "$RUNNER_TEMP/p08-artifacts"
          echo P08_R32_PRIVATE_SOURCE_AND_ASSETS_CLEANUP_ATTEMPTED
          echo P08_R32_PUBLIC_ARTIFACT_UPLOAD=NO
          echo P08_R32_PRODUCTION_WRITES=NO
 "$buildlog" || true
            exit 1
          fi
          prooflog="$RUNNER_TEMP/p08-r32-recovery-proof.log"
          if ! bash backend/tests/ops/cloudpanel-full-layout-proof.sh >"$prooflog" 2>&1; then
            echo P08_R32_REAL_MARIADB_SHARED_ATOMIC_PROOF=FAIL
            grep -E '^P08_R2[3-8]_[A-Z0-9_]+(=PASS|_PASS)        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/p08-private-source" "$RUNNER_TEMP/p08-r32-exact-source-artifacts" "$RUNNER_TEMP/p08-r32-build.log"
          echo P08_R32_PRIVATE_SOURCE_AND_ASSETS_CLEANUP_ATTEMPTED
          echo P08_R32_PUBLIC_ARTIFACT_UPLOAD=NO
          echo P08_R32_PRODUCTION_WRITES=NO
 "$prooflog" | tail -18 || true
            exit 1
          fi
          for marker in             P08_R26_REAL_MARIADB_BACKUP_EMPTY_SCRATCH_RESTORE_AND_FULL_READBACK_PASS             P08_R26_REAL_SHARED_PRIVATE_CONFIG_AND_STATIC_SCRATCH_READBACK_PASS             P08_R27_ACTUAL_CODE_SWITCH_BACKUP_PROOF_LINEAGE_AND_DOCTOR_PASS             P08_R28_REAL_ATOMIC_CANDIDATE_BYTES_MANIFEST_FROM_SOURCE_AND_BUILD_PASS; do
            grep -Fxq "$marker" "$prooflog"
          done
          echo P08_R32_MARIADB_11_8_BACKUP_MEDIA_ATOMIC_RECOVERY=PASS

      - name: Exact-source Chromium Owner UI and static delivery regression
        shell: bash
        working-directory: p08-private-source
        run: |
          set -Eeuo pipefail
          set +x
          log="$RUNNER_TEMP/p08-r32-browser.log"
          if ! bash backend/tests/browser/run-owner-ui.sh --ci-delivery >"$log" 2>&1; then
            echo P08_R32_CHROMIUM_OWNER_BROWSER=FAIL
            grep -E '^P08_BROWSER_STAGE=|^BROWSER_E2E_(PASS|FAILED)|^EXISTING_OWNER_REINSTALL_GUARD_(PASS|FAILED)' "$log" | tail -12 || true
            exit 1
          fi
          grep -Eq '^BROWSER_E2E_PASS' "$log"
          echo P08_R32_EXACT_HEAD_CHROMIUM_OWNER_AND_DELIVERY=PASS

      - name: Delete private source, build logs, and private candidate bytes
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/p08-private-source" "$RUNNER_TEMP/p08-r32-exact-source-artifacts" "$RUNNER_TEMP/p08-r32-build.log"
          echo P08_R32_PRIVATE_SOURCE_AND_ASSETS_CLEANUP_ATTEMPTED
          echo P08_R32_PUBLIC_ARTIFACT_UPLOAD=NO
          echo P08_R32_PRODUCTION_WRITES=NO
