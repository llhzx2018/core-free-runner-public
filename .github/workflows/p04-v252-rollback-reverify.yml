name: P04 V2.5.2 Rollback Reverify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v252-rollback-reverify.yml'
  workflow_dispatch:

permissions:
  contents: read

# Triggered after the workflow exists on the default branch.
jobs:
  reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PROD_COMMIT: bc23fcaca79f20f91f058b5de164a4a42c73bae6
      CANDIDATE_COMMIT: b74ed09a838f5eb9894ed030193f58eca5951586
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.PROD_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: prod
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Exact identity
        run: |
          set -Eeuo pipefail
          test "$(git -C prod rev-parse HEAD)" = "$PROD_COMMIT"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - name: Runtime dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl php-mbstring sqlite3 curl unzip
      - name: Build exact runtimes and package
        run: |
          set -Eeuo pipefail
          python3 prod/scripts/build-release-tree.py "$RUNNER_TEMP/v251"
          python3 candidate/scripts/build-release-tree.py "$RUNNER_TEMP/v252"
          python3 candidate/scripts/build-v252-update-release.py --target-runtime "$RUNNER_TEMP/v252" --output "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum -c SHA256SUMS.txt
          cmp VF_Infra_V2.5.2_ATOMIC.zip VF_Infra_V2.5.2_UPDATE.zip
          php repair-v2.5.2.php --self-test
      - name: Proven-boundary Atomic E2E
        working-directory: candidate
        env:
          BASE_RUNTIME: ${{ runner.temp }}/v251
          RELEASE_DIR: ${{ runner.temp }}/release
        run: bash tests/maintenance/v252_atomic_e2e.sh
      - name: Cleanup
        if: always()
        run: |
          rm -rf prod candidate "$RUNNER_TEMP/v251" "$RUNNER_TEMP/v252" "$RUNNER_TEMP/release" "$RUNNER_TEMP/p04-v252-"* || true
          echo CLEANUP_PASS
