name: S01-C01 v1.35.139 core-updates manifest premerge proof
on:
  push:
    branches: [task/s01-guide-reading-v135139-20261019]
    paths: ['.github/workflows/s01-theme-v135139-manifest-20261019.yml']
permissions:
  contents: read
jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 443e2fb326a682a39bce058630d8752851a74dfb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Exact manifest source and full registry schema
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 443e2fb326a682a39bce058630d8752851a74dfb
          (cd updates && python3 scripts/check_manifest_contract.py > /tmp/s01-manifest-audit.json)
          python3 - <<'PY'
          import json, pathlib
          z=json.load(open('/tmp/s01-manifest-audit.json'))
          assert z['status']=='PASS',z
          m=json.loads(pathlib.Path('updates/projects/S01-C01.json').read_text())
          assert m['target_version']=='1.35.139'
          assert m['release_tag']=='v1.35.139'
          assert m['asset_name']=='vf-tools-theme_V1.35.139.zip'
          assert m['asset_bytes']==1955140
          assert m['asset_sha256']=='f28c185805c2cf244c3c9711b377144d673e69676424644a840a59887c82669a'
          assert m['runtime_files']==476
          assert '1.35.138' in m['from_versions']
          assert 'runtime_fingerprint' not in m
          print('CORE_UPDATES_MANIFEST_139_CONTRACT=PASS')
          PY
      - name: Compare manifest to exact published private Release ZIP
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v1.35.139 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.139.zip
          echo 'f28c185805c2cf244c3c9711b377144d673e69676424644a840a59887c82669a  vf-tools-theme_V1.35.139.zip' | sha256sum -c
          test "$(stat -c%s vf-tools-theme_V1.35.139.zip)" = 1955140
          echo 'CORE_UPDATES_PRIVATE_RELEASE_IDENTITY=PASS'
      - name: Cleanup
        if: always()
        run: rm -rf updates vf-tools-theme_V1.35.139.zip
