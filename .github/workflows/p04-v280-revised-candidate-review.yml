name: P04 V280 Revised Candidate Review

on:
  pull_request:
    branches: [main]

jobs:
  p04-v280-review:
    if: contains(github.head_ref, 'p04-v280-review')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P04 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 74db86e038f141fc1801bf57d9b8d39b9e0eacca
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null
      - name: Run exact V280 candidate gate
        shell: bash
        env:
          VF_V280_TESTED_RUNTIME_COMMIT: 74db86e038f141fc1801bf57d9b8d39b9e0eacca
          VF_V280_EVIDENCE_DIR: ${{ github.workspace }}/evidence-v280-navigation
        run: bash scripts/run-v280-navigation-simplify-gate.sh
      - name: Upload V280 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V280-REVISED-CANDIDATE-REVIEW
          path: evidence-v280-navigation/
          if-no-files-found: error
          retention-days: 30
