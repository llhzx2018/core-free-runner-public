name: TEMP S01-C02 v1.21.813 Update Channel Gate
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121813-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_BASE: 7856c85bdb8e62edeaf36d4110821ad32cc07052
      CORE_CANDIDATE: 9a4939f5432347051b112201bce0755d760c1869
      OPS_SOURCE: bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44
      ASSET_SHA: a00f9bbe58569fde49a25156335b1ac50c731570e528018815d54ca76e5d3397
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Verify exact channel scope and manifest
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')"
          test "$live" = "$CORE_BASE"
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")" = 'projects/S01-C02.json'
          jq -e '.target_version=="1.21.813" and .from_versions==["1.21.812"] and .release_tag=="v1.21.813" and .asset_name=="vf-tools-ops_V1.21.813.zip" and .asset_bytes==3220322 and .asset_sha256=="a00f9bbe58569fde49a25156335b1ac50c731570e528018815d54ca76e5d3397" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .runtime_files==900 and .runtime_fingerprint=="c04b47b446c814f067177280c9af420a6816bea235b0bb7530311162267a1854"' core/projects/S01-C02.json >/dev/null
          grep -Fq '551 files / fingerprint 361eb3263b689bbe7a117d1628e51f069358697a3d85fd7e3c1faf2e7afcf113' core/projects/S01-C02.json
          echo EXACT_UPDATE_CHANNEL=PASS
      - name: Verify formal release and promoted source
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          branch(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(branch main)" = "$OPS_SOURCE"
          test "$(branch develop)" = "$OPS_SOURCE"
          j="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.813)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SOURCE"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.813.zip")|.size' <<<"$j")" = '3220322'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.813.zip")|.digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo RELEASE_AND_SOURCE=PASS
      - name: Production current source sanity
        run: |
          set -Eeuo pipefail
          p="$(curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          echo "$p" | jq -e '.pluginVersion=="1.21.812" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com"' >/dev/null
          echo PRODUCTION_OPS_1_21_812=PASS
          echo PASS_V121813_UPDATE_CHANNEL_GATE
