name: P02 PR269 architecture exact-source one-off
on:
  pull_request:
    paths:
      - '.github/workflows/p02-pr269-architecture-oneoff.yml'
permissions:
  contents: read
jobs:
  exact-architecture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-pr269-arch-20261114' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify read-only authoritative GOV-DOC snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-doc
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Verify exact private P02 snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ea002c05962c53a460c84b1fce9bbc7fe38db1f2
          path: vf-library
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Real GOV authority bridge, tests, and full diff architecture check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          [[ "$(git -C gov-doc rev-parse HEAD)" == "64c8a874210f2fa89fee07c7283ffce2bbe6b36c" ]]
          [[ "$(git -C vf-library rev-parse HEAD)" == "ea002c05962c53a460c84b1fce9bbc7fe38db1f2" ]]
          git -C vf-library cat-file -e "4630ff5d69a1a4d176386b4ea614b2e901a6f02f^{commit}"
          echo "P02_ARCH_SOURCE_IDENTITY=PASS"
          python3 -B -m unittest discover -s gov-doc/governance/agent -p 'test_code_architecture_lint.py' -q > "$RUNNER_TEMP/gov-tests.txt" 2>&1 || { echo "GOV_POLICY_TESTS=FAIL"; exit 1; }
          echo "GOV_POLICY_TESTS=PASS"
          (
            cd vf-library
            python3 -B .github/checks/check_gov_doc_ci.py --project-root . --gov-root ../gov-doc --project-id P02 --profile web_existing --workflow .github/workflows/repository-health.yml --require-git
          ) > "$RUNNER_TEMP/gov-bridge.txt" 2>&1 || { echo "P02_GOV_BRIDGE=FAIL"; exit 1; }
          echo "P02_GOV_BRIDGE=PASS"
          python3 -B vf-library/.github/checks/architecture_gate.py --manifest vf-library/.github/checks/code_architecture.json --gov-root gov-doc --git-root vf-library --base-sha 4630ff5d69a1a4d176386b4ea614b2e901a6f02f --head-sha ea002c05962c53a460c84b1fce9bbc7fe38db1f2 > "$RUNNER_TEMP/arch.txt" 2>&1 || {
            awk -F: '/^PROJECT_ARCHITECTURE=BLOCKED:/ {print "P02_ARCH_FAIL_CODE=" $2}' "$RUNNER_TEMP/arch.txt" | head -1
            echo "P02_FULL_ARCHITECTURE=FAIL"; exit 1;
          }
          echo "P02_FULL_ARCHITECTURE=PASS"
          echo "P02_PRODUCT_SHA=ea002c05962c53a460c84b1fce9bbc7fe38db1f2"
          echo "GOV_DOC_SHA=64c8a874210f2fa89fee07c7283ffce2bbe6b36c"
          echo "EVIDENCE_SCOPE=STRUCTURE_ONLY_NOT_RUNTIME_RELEASE_OR_PRODUCTION"
      - name: Remove temporary private checkouts and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- gov-doc vf-library
          rm -f -- "$RUNNER_TEMP/gov-tests.txt" "$RUNNER_TEMP/gov-bridge.txt" "$RUNNER_TEMP/arch.txt"
