name: P01 V2.35.2 Candidate Metadata Reconcile

on:
  push:
    branches: [task/p01-v2352-release-prep-20260831]
    paths: [.github/workflows/p01-v2352-release-prep-20260831.yml]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 46f618b7cdb2b0331ac3bc9c17b8180b44faba32
      RELEASE_BRANCH: release/v2.35.2-candidate-20260831
    steps:
      - name: Checkout exact existing candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Reconcile VF_PROJECT candidate metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$BASE"
          REMOTE=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')
          test "$REMOTE" = "$BASE"
          test "$(cat VERSION)" = '2.35.2'
          test "$(cat src/VERSION.txt)" = '2.35.2'
          grep -Fx "define('VF_VERSION', '2.35.2');" src/app/bootstrap.php >/dev/null
          git switch -c local-v2352-meta
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['production_version']=='2.35.1'
          assert d['production_release']['version']=='2.35.1'
          assert d['published_release']['version']=='2.35.1'
          assert d['schema_version']=='2026082901'
          d['status']='V2.35.1 OWNER PRODUCTION / V2.35.1 PUBLISHED / V2.35.2 PATCH RELEASE CANDIDATE'
          d['working_version']='2.35.2'
          d['target_release_version']='2.35.2'
          d['current_phase']='V2.35.2 PATCH RELEASE CANDIDATE / FORMAL GATES PENDING'
          d['current_change']={'change_id':'P01-V2352-ONLINE-UPDATE-TERMINAL-STATE-HOTFIX-20260831','base':'V2.35.1 OWNER PRODUCTION / V2.35.1 PUBLISHED','result':'V2.35.2 PATCH RELEASE CANDIDATE','target_version':'2.35.2','schema_change':False,'migration':None,'product_source':'de9cd603c20227423093ce6f60f08b64aa4472f0','develop_source':'e27e04f4cede748c3f7969d526fc390d8ffc6f6f','machine_gate':33344132874,'machine_result':'PASS','assistant_production_write':False}
          d['candidate_version']='2.35.2'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='PATCH RELEASE CANDIDATE / GATES PENDING'
          d['formal_release_state']='V2.35.1 PUBLISHED / V2.35.2 NOT YET PUBLISHED'
          d['develop_state']='V2.35.2 TERMINAL-STATE HOTFIX MERGED / RELEASE CANDIDATE PREPARED'
          d['current_authority']='Owner Production V2.35.1 / Published Latest V2.35.1 / V2.35.2 Candidate Pending Gates'
          d['next_action']='Run V2.35.2 Candidate Readiness, Formal Artifact, Strict Fresh, Promotion, Publication, core-updates and disposable Remote Online Update Gates. Owner Production remains NO AUTO WRITE.'
          d['v2_35_2_tag_state']='ABSENT / CANDIDATE ONLY'
          d['core_updates_v2_35_2_state']='NOT PUBLISHED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .published_release.version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .candidate_version VF_PROJECT.json)" = '2.35.2'
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(P01): reconcile V2.35.2 candidate metadata'
          CANDIDATE=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          RUNTIME_TREE=$(git rev-parse HEAD:src)
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          printf 'CANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\n' "$CANDIDATE" "$TREE" "$RUNTIME_TREE" | tee /tmp/p01-v2352-candidate-meta.txt

      - name: Upload candidate identity
        uses: actions/upload-artifact@v4
        with:
          name: P01-V2.35.2-CANDIDATE-METADATA
          path: /tmp/p01-v2352-candidate-meta.txt
          if-no-files-found: error
          retention-days: 7
