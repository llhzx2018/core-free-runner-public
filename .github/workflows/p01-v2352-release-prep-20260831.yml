name: P01 V2.35.2 Release Candidate Prep

on:
  push:
    branches: [task/p01-v2352-release-prep-20260831]
    paths: [.github/workflows/p01-v2352-release-prep-20260831.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: e27e04f4cede748c3f7969d526fc390d8ffc6f6f
      RELEASE_BRANCH: release/v2.35.2-20260831
      VERSION: 2.35.2
      SCHEMA: '2026082901'
    steps:
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Prepare exact release candidate metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(cat VERSION)" = '2.35.1'
          test "$(cat src/VERSION.txt)" = '2.35.1'
          grep -Fx "define('VF_VERSION', '2.35.1');" src/app/bootstrap.php >/dev/null
          git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1 && { echo 'release branch already exists'; exit 20; } || true
          git switch -c "$RELEASE_BRANCH"
          printf '%s\n' "$VERSION" > VERSION
          printf '%s\n' "$VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.35.1');"
          new="define('VF_VERSION', '2.35.2');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          entry="""## V2.35.2 · Patch Release Candidate · 2026-08-31

- 修复在线升级终态语义：Current >= Latest 时安装动作进入不可用终态，稳定最新态清理旧错误/步骤；prepare 精确返回“当前已经是最新版本。”时收敛为绿色最新态。
- 真正的 prepare / download / SHA-256 / Atomic 错误继续保持失败语义；存在新版本时安装动作继续正常可用。
- Product hotfix 仅 `src/assets/update-core.js`；PR #132 已合入 develop；Authoritative Machine Gate `33344132874` PASS。
- V2.35.2 仅做 Patch Release 元数据与正式发布闭环，不夹带其它产品/UI 修改。
- Schema 保持 `2026082901`，无 Migration；Owner Production 保持 V2.35.1，Assistant 不执行 Production Write。

"""
          assert not s.startswith('## V2.35.2')
          p.write_text(entry+s,encoding='utf-8',newline='\n')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['production_version']=='2.35.1'
          assert d['published_release']['version']=='2.35.1'
          assert d['schema_version']=='2026082901'
          d['status']='V2.35.1 OWNER PRODUCTION / V2.35.1 PUBLISHED / V2.35.2 PATCH RELEASE CANDIDATE'
          d['working_version']='2.35.2'
          d['target_release_version']='2.35.2'
          d['current_phase']='V2.35.2 PATCH RELEASE CANDIDATE / FORMAL GATES PENDING'
          d['current_change']={
            'change_id':'P01-V2352-ONLINE-UPDATE-TERMINAL-STATE-HOTFIX-20260831',
            'base':'V2.35.1 OWNER PRODUCTION / V2.35.1 PUBLISHED',
            'result':'V2.35.2 PATCH RELEASE CANDIDATE',
            'target_version':'2.35.2',
            'schema_change':False,
            'migration':None,
            'product_source':'de9cd603c20227423093ce6f60f08b64aa4472f0',
            'develop_source':'e27e04f4cede748c3f7969d526fc390d8ffc6f6f',
            'machine_gate':33344132874,
            'machine_result':'PASS',
            'assistant_production_write':False
          }
          d['candidate_version']='2.35.2'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='PATCH RELEASE CANDIDATE / GATES PENDING'
          d['formal_release_state']='V2.35.1 PUBLISHED / V2.35.2 NOT YET PUBLISHED'
          d['develop_state']='V2.35.2 TERMINAL-STATE HOTFIX MERGED / RELEASE CANDIDATE PREPARED'
          d['current_authority']='Owner Production V2.35.1 / Published Latest V2.35.1 / V2.35.2 Candidate Pending Gates'
          d['next_action']='Run V2.35.2 Candidate Readiness, Formal Artifact, Strict Fresh, Promotion, Publication, core-updates and disposable Remote Online Update Gates. Owner Production remains NO AUTO WRITE.'
          d['v2_35_2_tag_state']='ABSENT / CANDIDATE ONLY'
          d['core_updates_v2_35_2_state']='NOT PUBLISHED'
          assert d['production_version']=='2.35.1'
          assert d['production_release']['version']=='2.35.1'
          assert d['published_release']['version']=='2.35.1'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > docs/evidence/P01_V2.35.2_RELEASE_START_20260831.md <<'EOF'
          # P01 · V2.35.2 Patch Release Start · 2026-08-31

          ## Boundary

          ```text
          Owner Production: V2.35.1 / Schema 2026082901 / CLOSED
          Published Latest: V2.35.1 / immutable
          Develop: e27e04f4cede748c3f7969d526fc390d8ffc6f6f
          Hotfix Product Source: de9cd603c20227423093ce6f60f08b64aa4472f0
          Hotfix File: src/assets/update-core.js
          PR #132: MERGED
          Authoritative Machine Gate: 33344132874 / PASS
          Target: V2.35.2
          Schema change: NO
          Migration: NONE
          Production write: NO
          ```

          This release starts only to publish the already-verified Online Update terminal-state hotfix. No unrelated product or UI change is authorized in this Patch Release.
          EOF
          python3 -m json.tool VF_PROJECT.json >/dev/null
          grep -Fx "define('VF_VERSION', '2.35.2');" src/app/bootstrap.php >/dev/null
          test "$(cat VERSION)" = "$VERSION"
          test "$(cat src/VERSION.txt)" = "$VERSION"
          test "$(jq -r .production_version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .published_release.version VF_PROJECT.json)" = '2.35.1'
          test "$(jq -r .candidate_version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .schema_version VF_PROJECT.json)" = "$SCHEMA"
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=$'CHANGELOG.md\nVERSION\nVF_PROJECT.json\ndocs/evidence/P01_V2.35.2_RELEASE_START_20260831.md\nsrc/VERSION.txt\nsrc/app/bootstrap.php'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json docs/evidence/P01_V2.35.2_RELEASE_START_20260831.md src/VERSION.txt src/app/bootstrap.php
          git commit -m 'chore(release): prepare V2.35.2 candidate'
          CANDIDATE=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          RUNTIME_TREE=$(git rev-parse HEAD:src)
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          printf 'CANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\n' "$CANDIDATE" "$TREE" "$RUNTIME_TREE" | tee /tmp/p01-v2352-release-prep.txt

      - name: Upload release-prep identity
        uses: actions/upload-artifact@v4
        with:
          name: P01-V2.35.2-RELEASE-PREP
          path: /tmp/p01-v2352-release-prep.txt
          if-no-files-found: error
          retention-days: 7
