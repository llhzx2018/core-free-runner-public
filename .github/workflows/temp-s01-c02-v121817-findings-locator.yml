name: TEMP S01-C02 v1.21.817 Findings Locator
on:
  push:
    branches: [temp/s01-c02-v121817-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121817-findings-locator.yml']
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 7df4c09dfcbd99d6fee0bd2e96c648aac87c919d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Locate findings classifier and dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- FUNCTION LOCATIONS ---'
          grep -RIn --include='*.php' 'function vf_ops_publish_zip_findings_v121423' ops || true
          echo '--- REFERENCES ---'
          grep -RIn --include='*.php' 'vf_ops_publish_zip_findings_v121423' ops || true
          echo '--- CLASS LOCATIONS ---'
          grep -RIn --include='*.php' 'class VF_Ops_Release_Findings' ops || true
          files=$(grep -Rl --include='*.php' 'function vf_ops_publish_zip_findings_v121423\|class VF_Ops_Release_Findings' ops || true)
          for f in $files; do
            echo "--- FILE $f ---"
            sed -n '1,260p' "$f"
          done
          echo PASS_FINDINGS_LOCATOR
