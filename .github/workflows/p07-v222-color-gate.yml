name: P07 VPS Audit V2.2.2 Semantic Color Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-v222-color-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p07-vps-semantic-color-v222
          persist-credentials: false
          fetch-depth: 1

      - name: Syntax and identity
        run: |
          set -Eeuo pipefail
          bash -n experiments/p07-vps-audit-v22.sh
          test "$(NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --version)" = "P07 VPS 一键验机 V2.2.2"
          test "$(NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --build-id)" = "2.2.2-rc1-semantic-color"

      - name: Verdict and threshold regression
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --self-test | tee /tmp/self-test.txt
          grep -Fq 'P07_VPS_VALUE_VERDICT_SELF_TEST=PASS' /tmp/self-test.txt
          NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --reference | tee /tmp/reference.txt
          grep -Fq '强      >= 900 MB/s' /tmp/reference.txt
          grep -Fq '>= 1000 IOPS' /tmp/reference.txt

      - name: PTY color preservation contract
        run: |
          set -Eeuo pipefail
          command -v script
          grep -Fq "script -qefc \"bash '\$BASE'\"" experiments/p07-vps-audit-v22.sh
          grep -Fq "s/V2\\.1\\.0/V2.2.2/g" experiments/p07-vps-audit-v22.sh

      - name: Semantic ANSI color smoke
        run: |
          set -Eeuo pipefail
          script -qefc "bash experiments/p07-vps-audit-v22.sh --color-demo" /dev/null > /tmp/color-demo.bin
          python3 -c "from pathlib import Path; d=Path('/tmp/color-demo.bin').read_bytes(); assert b'\\x1b[' in d, 'ANSI_COLOR_MISSING'; t=d.decode('utf-8', errors='replace'); [(_ for _ in ()).throw(AssertionError(x)) for x in ['P07 使用价值判断','偏弱','良好','判定参考线'] if x not in t]; print('P07_VPS_SEMANTIC_COLOR=PASS')"

      - name: SHA256
        run: sha256sum experiments/p07-vps-audit-v22.sh
