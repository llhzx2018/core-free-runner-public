name: P01 V2.22.0 Artifact Readback
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v222-artifact-readback-20260828.yml']
jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/33142761396 >/tmp/run.json
          test "$(jq -r .conclusion /tmp/run.json)" = success
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/33142761396/artifacts >/tmp/artifacts.json
          AID="$(jq -r '.artifacts[]|select(.name=="P01-V2.22.0-FORMAL-ARTIFACTS")|.id' /tmp/artifacts.json)"
          test -n "$AID"; test "$AID" != null
          echo ARTIFACT_ID="$AID"
          echo P01_V222_ARTIFACT_READBACK=PASS
