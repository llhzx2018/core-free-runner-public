name: P01 channels guest empty actions test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channels-guest-actions-test-only.yml'
permissions:
  contents: read
jobs:
  channels-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout registered Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout P01 private exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3453cf48361ec8def718442be5a57b600b3e1742
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Exact guest and owner channel UX/privacy regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "3453cf48361ec8def718442be5a57b600b3e1742"
          php -l product/src/app/ChannelLibraryPage.php
          php -l product/tests/unit/channels_guest_readonly_layout_v247390_contract.php
          for t in \
            channels_guest_readonly_layout_v247390_contract.php \
            channels_private_badge_sparse_state_v247390_contract.php \
            channel_card_action_hierarchy_contract.php \
            channels_v247142_context_columns_contract.php \
            channels_v247143_adaptive_density_contract.php \
            channels_v247137_terminal_ownership_contract.php \
            channels_page_full_polish_contract.php \
            channel_page_full_polish_contract.php \
            channel_kind_facet_context_contract.php \
            channel_provider_context_facet_contract.php \
            channel_provider_normalization_contract.php \
            channel_provider_zero_result_contract.php \
            channel_watch_search_context_contract.php \
            channel_mobile_first_content_r4_contract.php; do
            php "product/tests/unit/$t"
          done
          python3 - <<'PY'
          from pathlib import Path
          css=Path('product/src/assets/channel-library.css').read_text()
          assert css.count('{')==css.count('}')
          assert '.is-guest-readonly.is-adaptive-columns' in css
          print('P01_CHANNELS_GUEST_CSS=PASS')
          PY
          echo P01_CHANNELS_GUEST_EXACT_SOURCE=PASS
      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf product
