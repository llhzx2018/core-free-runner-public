# Owner 2026-11-14 authorized P07-M01 网络代理节点 and P07-M02 服务器性能检测 UX2 Formal Release.
# PR stages and checks the exact existing public sources; only authorized main squash publishes.
# M03/M04/M05, Production, DNS and Migration remain untouched.
name: P07 M01 M02 original-author UX2 standalone Formal Release
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p07-m01-m02-original-ux2-formal-publish.yml]
  push:
    branches: [main]
    paths: [.github/workflows/p07-m01-m02-original-ux2-formal-publish.yml]
permissions:
  contents: read
jobs:
  exact-m01-m02-formal:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      P07_PUBLIC_SOURCE: b0fb4c253958de46c4fc207f8872af9b78b77ab0
      P07_PRODUCT_SOURCE: 905599e8ca6ac6fd766856c35301328388b3eb81
      P07_GOV_SOURCE: 7b60a8b36795cf1b5c5e49d24f258b5a6a141ce4
      P07_UX2_TAG: p07-m01-m02-v0.1.0-original-ux2-20261114
      P07_M01_ASSET: P07-M01-0.1.0-ux2.zip
      P07_M02_ASSET: P07-M02-2.1.1-ux2.sh
      P07_M01_MANIFEST_SHA: 1f66f642769848e5be0c9a25ccb58a60e97e40fe2eb58a088233a5c129f1cb90
      P07_M02_SCRIPT_SHA: 18a7a7dc401772fda7344845b952bc307a46f05443d086ec5e38a1954308587d
    steps:
      - name: Checkout exact immutable public M01 M02 released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: b0fb4c253958de46c4fc207f8872af9b78b77ab0
          persist-credentials: false
          path: source
      - name: Checkout private P07 authority and exact public governance transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 905599e8ca6ac6fd766856c35301328388b3eb81
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Checkout exact GOV-DOC Public Authority task delivery gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 7b60a8b36795cf1b5c5e49d24f258b5a6a141ce4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Prove frozen source, old formal baselines and unchanged sibling modules
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$P07_PUBLIC_SOURCE"
          test "$(git -C product rev-parse HEAD)" = "$P07_PRODUCT_SOURCE"
          test "$(git -C gov rev-parse HEAD)" = "$P07_GOV_SOURCE"
          test "$(cat product/VERSION)" = '0.1.0'
          test "$(cat source/packages/p07-network-node/0.1.0-ux2/VERSION)" = '0.1.0-ux2'
          test "$(sha256sum source/packages/p07-network-node/0.1.0-ux2/MANIFEST.sha256 | cut -d' ' -f1)" = "$P07_M01_MANIFEST_SHA"
          (cd source/packages/p07-network-node/0.1.0-ux2 && sha256sum -c MANIFEST.sha256)
          test "$(NO_COLOR=1 bash source/experiments/p07-vps-audit-v21-ux2.sh --build-id)" = '2.1.1-ux2'
          test "$(sha256sum source/experiments/p07-vps-audit-v21-ux2.sh | cut -d' ' -f1)" = "$P07_M02_SCRIPT_SHA"
          test "$(git -C source hash-object installers/p07-vf-node-independent-ux2-candidate.sh)" = 0919751da9038b6db51a88c7052195becc152e32
          test "$(sha256sum source/experiments/p07-vps-audit-v21-ux1.sh | cut -d' ' -f1)" = 7b083e4cf105d40b04b4cbe898fb6b9e1bb7f1ef3385bc1d20829796f6852013
          test "$(cat source/packages/p07-network-node/0.1.0-ux1/VERSION)" = '0.1.0-ux1'
          (cd source/packages/p07-network-node/0.1.0-ux1 && sha256sum -c MANIFEST.sha256)
          bash -n source/installers/p07-vf-node-independent-ux2-candidate.sh source/packages/p07-network-node/0.1.0-ux2/vf-node.sh source/experiments/p07-vps-audit-v21-ux2.sh
          test "$(sha256sum source/installers/p07-toolbox.sh | cut -d' ' -f1)" = "$(git -C source show "$P07_PUBLIC_SOURCE:installers/p07-toolbox.sh" | sha256sum | cut -d' ' -f1)"
          test "$(grep '^M05_BUILD_EXPECTED=' source/installers/p07-toolbox.sh)" = 'M05_BUILD_EXPECTED="0.1.0-m05-official-db-choice-ux6"'
          echo P07_M01_M02_EXACT_MODULE_SOURCE_AND_OLD_FORMAL=PASS
          echo P07_M03_M04_M05_FORMAL_BASELINE=UNCHANGED
      - name: Build reproducible independent M01 ZIP and M02 script plus signed-by-SHA256 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p07-m01-m02-formal"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil,stat,zipfile
          base=Path(os.environ["RUNNER_TEMP"])/"p07-m01-m02-formal"
          m01=Path("source/packages/p07-network-node/0.1.0-ux2")
          m02=Path("source/experiments/p07-vps-audit-v21-ux2.sh")
          names=[n.strip().split("  ",1)[1] for n in (m01/"MANIFEST.sha256").read_text().splitlines()]
          assert len(names)==10 and len(names)==len(set(names))
          assert all(re.fullmatch(r"(?:lib/)?[A-Za-z0-9._-]+",n) for n in names)
          assert set(names)==set(f.relative_to(m01).as_posix() for f in m01.rglob("*") if f.is_file())-{"MANIFEST.sha256"}
          def bundle(output):
              with zipfile.ZipFile(output,"x",compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=False) as z:
                  for n in sorted(names+["MANIFEST.sha256"]):
                      file=m01/n
                      assert file.is_file() and not file.is_symlink()
                      data=file.read_bytes()
                      assert b"-----BEGIN PRIVATE KEY-----" not in data
                      assert b"github_pat_" not in data and b"PRIVATE DATA - BEGIN" not in data
                      info=zipfile.ZipInfo("p07-m01/"+n,(2026,1,1,0,0,0))
                      info.create_system=3
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(stat.S_IFREG|(0o755 if n.endswith(".sh") else 0o644))<<16
                      z.writestr(info,data)
              return hashlib.sha256(output.read_bytes()).hexdigest()
          asset1=os.environ["P07_M01_ASSET"];asset2=os.environ["P07_M02_ASSET"]
          digest1=bundle(base/asset1)
          assert digest1==bundle(base/("second-"+asset1))
          (base/("second-"+asset1)).unlink()
          shutil.copyfile(m02,base/asset2)
          digest2=hashlib.sha256((base/asset2).read_bytes()).hexdigest()
          assert digest2==os.environ["P07_M02_SCRIPT_SHA"]
          with zipfile.ZipFile(base/asset1) as z:
              assert len(z.namelist())==11
              assert z.read("p07-m01/MANIFEST.sha256")==(m01/"MANIFEST.sha256").read_bytes()
              assert z.read("p07-m01/vf-node.sh")== (m01/"vf-node.sh").read_bytes()
          record={
              "schema":"p07.m01-m02.original-author-ux2.formal.v1",
              "modules":{"P07-M01 网络代理节点（V2Ray）":{"build":"0.1.0-ux2","asset":asset1,"sha256":digest1,"previous_formal":"0.1.0-ux1"},
                         "P07-M02 服务器性能检测（VPS 验机）":{"build":"2.1.1-ux2","asset":asset2,"sha256":digest2,"previous_formal":"2.1.1-ux1"}},
              "tag":os.environ["P07_UX2_TAG"],"public_source_sha":os.environ["P07_PUBLIC_SOURCE"],
              "product_authority_sha":os.environ["P07_PRODUCT_SOURCE"],
              "proof":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/43587560843",
              "other_modules":"P07-M03/M04/M05 UNTOUCHED",
              "owner_vps":"NOT_RUN","production":"OWNER_MANUAL_ONLY","dns":"NOT_RUN","migration":"NOT_RUN"}
          meta=base/"P07-M01-M02-UX2-RELEASE.json"
          meta.write_text(json.dumps(record,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          digest3=hashlib.sha256(meta.read_bytes()).hexdigest()
          (base/"SHA256SUMS").write_text(
              f"{digest1}  {asset1}\n{digest2}  {asset2}\n{digest3}  {meta.name}\n",encoding="ascii")
          print("P07_M01_NEW_ZIP_SHA256="+digest1)
          print("P07_M02_NEW_SCRIPT_SHA256="+digest2)
          print("P07_M01_M02_REPRODUCIBLE_ASSET_BYTES=PASS")
          PY
          (cd "$RUNNER_TEMP/p07-m01-m02-formal" && sha256sum -c SHA256SUMS)
      - name: Public Authority task-delivery structural gates on actual new module assets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"p07-m01-m02-formal"
          source=os.environ["P07_PRODUCT_SOURCE"]
          common={
            "schema":"vf.public-authority.task-delivery-check.v1","project":"P07",
            "source":source,
            "project_authority":{
              "agents":"AGENTS.md","current":"docs/authority/CURRENT.md",
              "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
              "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"},
            "acceptance_markers":["P07-M01 网络代理节点（V2Ray）","P07-M02 服务器性能检测（VPS 验机）"],
            "required_domains":["INSTALL","UPGRADE","SECURITY","TESTING","DATA_SCHEMA","GIT"],
            "task_capabilities":["installer","update","source_change"],
          }
          for m,profile,entry in [
            ("P07-M01-0.1.0-ux2.zip","static_bundle_zip","p07-m01/vf-node.sh"),
            ("P07-M02-2.1.1-ux2.sh","cli_one_command","P07-M02-2.1.1-ux2.sh")]:
            item=dict(common)
            item["delivery"]={
              "profile":profile,"entrypoint":entry,"artifact":m,
              "sha256":hashlib.sha256((root/m).read_bytes()).hexdigest(),
              "requires_git":False,"requires_manual_source_copy":False}
            (root/(m+".receipt.json")).write_text(json.dumps(item,ensure_ascii=False),encoding="utf-8")
          PY
          for file in P07-M01-0.1.0-ux2.zip P07-M02-2.1.1-ux2.sh; do
            python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
              --phase delivery --project-root product \
              --artifact-root "$RUNNER_TEMP/p07-m01-m02-formal" \
              --receipt "$RUNNER_TEMP/p07-m01-m02-formal/$file.receipt.json" \
              --public-router gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          done
          echo P07_M01_M02_ACTUAL_DELIVERY_CONTRACT=STRUCTURAL_PASS
      - name: Verify exact original-author UX and real UX1-to-UX2 TTY module upgrade and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd source && python3 -B -m unittest discover -s tests -p 'test_p07_m01_m02_original_versions.py' -q)
          test ! -e /opt/vfops-modules
          sudo -n env GITHUB_ACTIONS=true P07_UX2_DISPOSABLE_RUNNER=YES PATH="$PATH" \
            python3 -B source/tests/p07_m01_m02_ux2_real_upgrade_gate.py "$P07_PUBLIC_SOURCE"
          echo P07_M01_M02_FORMAL_OLD_TO_NEW_ATOMIC_ROLLBACK=PASS
          echo P07_M03_M04_M05_ISOLATED=PASS
      - name: Reuse registered independent machine proof exact module files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for run in 43586322785 43587560843; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success || exit 78
          done
          echo P07_M01_M02_REUSED_VALID_UX_AND_UPGRADE_PROOF=PASS
      - name: Publish BOTH immutable source tag and official M01 M02 artifacts only after approved main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'P07 M01 M02 UX2 formal publish')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          private_repo='llhzx2018/vf-server-ops'
          public_repo='llhzx2018/core-free-runner-public'
          tag="$P07_UX2_TAG"
          test "$(gh api "repos/$private_repo/git/ref/heads/main" --jq '.object.sha')" = "$P07_PRODUCT_SOURCE" || { echo P07_PRODUCT_SOURCE_DRIFT; exit 78; }
          test "$(gh api "repos/$public_repo/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_PUBLIC_SOURCE_DRIFT; exit 78; }
          if gh release view "$tag" -R "$private_repo" >/dev/null 2>&1; then
            test "$(gh api "repos/$private_repo/git/ref/tags/$tag" --jq '.object.sha')" = "$P07_PRODUCT_SOURCE" || exit 81
          else
            if gh api "repos/$private_repo/git/ref/tags/$tag" >/dev/null 2>&1; then exit 81; fi
            gh release create "$tag" -R "$private_repo" --target "$P07_PRODUCT_SOURCE" \
              --title 'P07-M01 网络代理节点／M02 服务器性能检测 · 原作者版本 UX2 正式源码' \
              --notes 'Owner 2026-11-14 授权 M01/M02 UX2 单模块正式发行，运行包及 SHA 在公共仓正式 Release；M03/M04/M05 与 Production 均未操作。'
          fi
          if gh release view "$tag" -R "$public_repo" >/dev/null 2>&1; then
            test "$(gh api "repos/$public_repo/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA" || exit 81
            test "$(gh api "repos/$public_repo/releases/tags/$tag" --jq '.assets|length')" = 4 || exit 81
          else
            if gh api "repos/$public_repo/git/ref/tags/$tag" >/dev/null 2>&1; then exit 81; fi
            gh release create "$tag" -R "$public_repo" --target "$GITHUB_SHA" \
              --title 'P07-M01 网络代理节点／M02 服务器性能检测 · UX2 正式独立更新包' \
              --notes '仅 M01 0.1.0-ux2、M02 2.1.1-ux2 两个独立正式资产，官方 SHA256SUMS 与 Release Manifest。原作者版本只读查询，旧 UX1→UX2 完整升级/回滚机器 PASS。其它三模块与 Production 不变。'
            gh release upload "$tag" -R "$public_repo" \
              "$RUNNER_TEMP/p07-m01-m02-formal/$P07_M01_ASSET" \
              "$RUNNER_TEMP/p07-m01-m02-formal/$P07_M02_ASSET" \
              "$RUNNER_TEMP/p07-m01-m02-formal/P07-M01-M02-UX2-RELEASE.json" \
              "$RUNNER_TEMP/p07-m01-m02-formal/SHA256SUMS"
          fi
          dir="$(mktemp -d)"
          trap 'rm -rf -- "$dir"' EXIT
          gh release download "$tag" -R "$public_repo" --dir "$dir"
          (cd "$dir" && sha256sum -c SHA256SUMS)
          for name in "$P07_M01_ASSET" "$P07_M02_ASSET" P07-M01-M02-UX2-RELEASE.json SHA256SUMS; do
            cmp "$dir/$name" "$RUNNER_TEMP/p07-m01-m02-formal/$name"
          done
          test "$(gh api "repos/$private_repo/git/ref/tags/$tag" --jq '.object.sha')" = "$P07_PRODUCT_SOURCE"
          echo P07_M01_M02_SOURCE_TAG_AND_OFFICIAL_ASSET_REMOTE_SHA256=PASS
          echo P07_M01_M02_FORMAL_RELEASE=PASS
          echo P07_M03_M04_M05=UNTOUCHED
          echo P07_PRODUCTION_DNS_MIGRATION=NOT_RUN
      - name: Remove transient private checkout, governance source and unsent packages
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- product gov source "$RUNNER_TEMP/p07-m01-m02-formal"
          echo P07_PRIVATE_SOURCE_AND_TEMP_ARTIFACTS_CLEANUP=YES
          echo P07_OWNER_PRODUCTION_DNS_MIGRATION=NOT_RUN
