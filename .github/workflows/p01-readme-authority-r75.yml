name: P01 README Authority R75

on:
  push:
    branches:
      - temp/p01-current-main-readiness-r44-20260920
    paths:
      - '.github/workflows/p01-readme-authority-r75.yml'

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      P01_SHA: bbcd53f42191039fceb4af66243744ecaf257200
      P01_BASE_SHA: 5d3336937994a999b20197286d22ad4e60dff582
    steps:
      - name: Checkout exact P01 authority fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact scope and authority contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$P01_SHA"
          mapfile -t changed < <(git -C target diff --name-only "$P01_BASE_SHA..$P01_SHA" | sort)
          test "${#changed[@]}" = 3
          printf '%s\n' "${changed[@]}" >/tmp/p01-r75-files
          grep -Fxq README.md /tmp/p01-r75-files
          grep -Fxq docs/README.md /tmp/p01-r75-files
          grep -Fxq tests/unit/readme_runtime_authority_r75_contract.php /tmp/p01-r75-files
          php target/tests/unit/readme_runtime_authority_r75_contract.php
          php target/tests/unit/release_authority_r44_contract.php
          php target/tests/unit/runner_authority_r51_contract.php
          grep -Fq 'README 不是 Runtime Authority' target/README.md
          grep -Fq 'README_NOT_RUNTIME_AUTHORITY = YES' target/docs/README.md
          ! grep -Eq 'Owner Production[：:] *V?[0-9]+' target/README.md
          ! grep -Eq 'Published Latest[：:] *V?[0-9]+' target/README.md
          ! grep -Eq 'Release ID[：:] *[0-9]+' target/README.md
          ! grep -Eq 'Owner Production[：:] *V?[0-9]+' target/docs/README.md
          ! grep -Eq 'Published Latest[：:] *V?[0-9]+' target/docs/README.md
          ! grep -Eq 'Release ID[：:] *[0-9]+' target/docs/README.md
          echo P01_README_AUTHORITY_R75_GATE=PASS
          echo RUNTIME_SOURCE_CHANGED=NO
          echo RELEASE=NO
          echo PRODUCTION=NO
