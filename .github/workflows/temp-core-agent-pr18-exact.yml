name: Temporary Core Agent PR18 Exact Source Verify

on:
  push:
    branches:
      - temp/core-agent-pr18-exact-20260907

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact core-agent source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          SRC_SHA='2debf02ab717f725be73d749b29baadccda92a70'
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-agent/tarball/${SRC_SHA}" \
            -o "${TMP}/source.tar.gz"
          mkdir -p "${TMP}/src"
          tar -xzf "${TMP}/source.tar.gz" -C "${TMP}/src"
          SRC_DIR="$(find "${TMP}/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          printf 'EXACT_SOURCE_SHA=%s\n' "$SRC_SHA"
          printf 'SOURCE_DIR=%s\n' "$SRC_DIR" >> "$GITHUB_ENV"

      - name: Full core-agent verification
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python scripts/verify.py

      - name: Live gov-doc Runtime Entry integration
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          PYTHONPATH=src python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          from core_agent.profiles.vf.runtime_bootstrap import VFRuntimeActivationState, VFRuntimeBootstrap

          token = os.environ['VF_PRIVATE_READ_TOKEN']
          repo = 'llhzx2018/gov-doc'

          def api(path: str):
              req = urllib.request.Request(
                  'https://api.github.com' + path,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'vf-runtime-bootstrap-pr18',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          class Reader:
              def head(self, repository: str, ref: str) -> str:
                  assert repository == repo and ref == 'main'
                  payload = api(f'/repos/{repo}/git/ref/heads/main')
                  return payload['object']['sha']

              def read_text(self, repository: str, path: str, ref: str) -> str:
                  assert repository == repo and ref == 'main'
                  encoded = urllib.parse.quote(path, safe='/')
                  payload = api(f'/repos/{repo}/contents/{encoded}?ref=main')
                  return base64.b64decode(payload['content']).decode('utf-8')

          activation = VFRuntimeBootstrap(Reader()).activate()
          assert activation.state is VFRuntimeActivationState.ACTIVE, activation.reason
          assert activation.runtime_path == 'governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.1.md', activation.runtime_path
          assert activation.runtime_version == 'V1.1', activation.runtime_version
          print('LIVE_RUNTIME_ENTRY_BOOTSTRAP=PASS')
          print('RUNTIME_PATH=' + str(activation.runtime_path))
          print('RUNTIME_VERSION=' + str(activation.runtime_version))
          PY
