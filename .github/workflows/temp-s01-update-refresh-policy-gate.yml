name: TEMP S01 Update Refresh Policy Candidate Gate
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-update-refresh-policy-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: fbdd766314d3f9abe8d1834343e8058d99167307
      OPS_BASE: 0709885120ca74588430a6d12850be0d77061bef
      M3U8_SHA: 44ff4a658ed87af8746d7fc81244df80f24aa5c3
      M3U8_BASE: af331956ebe3cf6847b0ef43209f84700c2c0dc3
      THEME_SHA: 2db7feab0fa975bcadf01867a044983b51b17145
      THEME_BASE: a293009567c932310d19a310a8ea6361a2ef71c8
    steps:
      - name: Checkout Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Checkout M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: m3u8
      - name: Checkout Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: theme
      - name: Verify live bases and exact change scopes
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live_branch(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$1/branches/$2" | jq -r '.commit.sha'; }
          test "$(live_branch llhzx2018/vf-tools-ops main)" = "$OPS_BASE"
          test "$(live_branch llhzx2018/vf-tools-ops develop)" = 'f07006b4314f77365994a1cb34f8fa5009ed9205'
          test "$(live_branch llhzx2018/vf-tools-m3u8 main)" = "$M3U8_BASE"
          test "$(live_branch llhzx2018/vf-tools-m3u8 develop)" = '9ec6983e4719ae76c88e49a25afb0f8bb7aff7d1'
          test "$(live_branch llhzx2018/vf-tools-theme main)" = "$THEME_BASE"
          test "$(live_branch llhzx2018/vf-tools-theme develop)" = '63eb30f4250951e9a2c3dfe0a43c7f18af6e1f81'
          printf '%s\n' '.github/phase3/v121811-update-refresh-policy.php' 'VERSION' 'includes/wp-update/bootstrap.php' 'includes/wp-update/class-vf-ops-update-admin-v1.php' 'includes/wp-update/class-vf-ops-update-source-v1.php' 'vf-ops.php' | sort >/tmp/ops.expected
          git -C ops diff --name-only "$OPS_BASE" "$OPS_SHA" | sort >/tmp/ops.actual
          diff -u /tmp/ops.expected /tmp/ops.actual
          printf '%s\n' 'VERSION' 'src/includes/update/bootstrap.php' 'src/includes/update/class-vf-m3u8-update-admin-v1.php' 'src/includes/update/class-vf-m3u8-update-source-v1.php' 'src/vf-tool-m3u8.php' 'tests/unit/update-refresh-policy-contract.php' | sort >/tmp/m3u8.expected
          git -C m3u8 diff --name-only "$M3U8_BASE" "$M3U8_SHA" | sort >/tmp/m3u8.actual
          diff -u /tmp/m3u8.expected /tmp/m3u8.actual
          if grep -E 'migration|schema-repair|provider-schema|seed' /tmp/m3u8.actual; then echo FAIL_M3U8_CLOSED_SCOPE; exit 1; fi
          printf '%s\n' 'VERSION' 'src/inc/update/class-vf-theme-update-source-v1.php' 'src/style.css' 'tests/update-refresh-policy-contract.php' | sort >/tmp/theme.expected
          git -C theme diff --name-only "$THEME_BASE" "$THEME_SHA" | sort >/tmp/theme.actual
          diff -u /tmp/theme.expected /tmp/theme.actual
          echo EXACT_SCOPES_AND_LIVE_BASES=PASS
      - name: PHP lint and focused contracts
        run: |
          set -Eeuo pipefail
          find ops -path 'ops/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/ops-lint
          find m3u8 -path 'm3u8/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/m3u8-lint
          find theme -path 'theme/.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/theme-lint
          php ops/.github/phase3/v121811-update-refresh-policy.php
          php m3u8/tests/unit/update-refresh-policy-contract.php
          php theme/tests/update-refresh-policy-contract.php
          grep -Fq 'private const CACHE_TTL=3600;' ops/includes/wp-update/class-vf-ops-update-source-v1.php
          grep -Fq 'CACHE_TTL=3600' m3u8/src/includes/update/class-vf-m3u8-update-source-v1.php
          grep -Fq 'private const CACHE_TTL = 3600;' theme/src/inc/update/class-vf-theme-update-source-v1.php
          echo PHP_AND_REFRESH_CONTRACTS=PASS
      - name: Build deterministic WordPress candidates
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, zipfile
          def emit(name, root, prefix, files):
              files=sorted(files,key=lambda x:x[0])
              fp=hashlib.sha256()
              for rel,b in files: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              z=Path('/tmp/release')/name
              with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
                  for rel,b in files:
                      i=zipfile.ZipInfo(prefix+'/'+rel,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
              print(name+'_AUTHORITY='+json.dumps({'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()},separators=(',',':')))
          # Ops runtime package policy inherited from prior formal releases.
          ops=[]
          for p in Path('ops').rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to('ops').as_posix(); parts=rel.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              ops.append((rel,p.read_bytes()))
          emit('vf-tools-ops_V1.21.811.zip',Path('ops'),'vf-ops',ops)
          m=[]
          for p in Path('m3u8/src').rglob('*'):
              if p.is_file() and not p.is_symlink(): m.append((p.relative_to('m3u8/src').as_posix(),p.read_bytes()))
          emit('vf-tools-m3u8_V1.25.20.zip',Path('m3u8/src'),'vf-tool-m3u8',m)
          t=[]
          for p in Path('theme/src').rglob('*'):
              if p.is_file() and not p.is_symlink(): t.append((p.relative_to('theme/src').as_posix(),p.read_bytes()))
          emit('vf-tools-theme_V1.35.9.zip',Path('theme/src'),'vf-tools-theme',t)
          PY
          unzip -tq /tmp/release/vf-tools-ops_V1.21.811.zip >/dev/null
          unzip -tq /tmp/release/vf-tools-m3u8_V1.25.20.zip >/dev/null
          unzip -tq /tmp/release/vf-tools-theme_V1.35.9.zip >/dev/null
          test "$(unzip -Z1 /tmp/release/vf-tools-m3u8_V1.25.20.zip | cut -d/ -f1 | sort -u)" = 'vf-tool-m3u8'
          test "$(unzip -Z1 /tmp/release/vf-tools-theme_V1.35.9.zip | cut -d/ -f1 | sort -u)" = 'vf-tools-theme'
          unzip -p /tmp/release/vf-tools-ops_V1.21.811.zip vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.811'
          unzip -p /tmp/release/vf-tools-m3u8_V1.25.20.zip vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.20'
          unzip -p /tmp/release/vf-tools-theme_V1.35.9.zip vf-tools-theme/style.css | grep -Fq 'Version: 1.35.9'
          echo PASS_S01_UPDATE_REFRESH_POLICY_CANDIDATE_GATE
