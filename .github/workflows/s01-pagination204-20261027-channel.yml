name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-pagination204-20261027]
    paths: ['.github/workflows/s01-pagination204-20261027-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.204
  TARGET_SHA: f7acf35d7d4898afb4d45e672089636fa5172336
  UPDATE_SHA: a676418d35901b1d16c129e79df4ba7edc4510f5
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: a676418d35901b1d16c129e79df4ba7edc4510f5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-pagination204-20261027/channel-spec.json --input control/.github/workflows/s01-pagination204-20261027-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 49e5feb79cdb3cff1374028e4a84c6142a4b64c5 a676418d35901b1d16c129e79df4ba7edc4510f5)" = projects/S01-C01.json
          git -C source diff --exit-code 49e5feb79cdb3cff1374028e4a84c6142a4b64c5 a676418d35901b1d16c129e79df4ba7edc4510f5 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='581c3142205e432d670438b92e34df678909408e92298348a018e2faaa0e1386' and m['asset_bytes']==2009064
          assert m['runtime_files']==476 and '1.35.203' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
