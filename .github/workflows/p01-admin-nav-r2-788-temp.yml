name: p01-admin-nav-r2-788-temp

on:
  push:
    branches:
      - run/p01-admin-nav-r2-788

permissions:
  contents: read

jobs:
  admin-nav-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 4f3acc439e080a5352e1fe6f3106595f89a83dc0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source and syntax
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "4f3acc439e080a5352e1fe6f3106595f89a83dc0"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_ADMIN_NAV_R2_SYNTAX=PASS

      - name: Focused admin navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/data_recovery_desktop_disclosure_contract.php
          php tests/unit/admin_visual_system_r3_contract.php
          php tests/unit/shared_admin_detail_language_contract.php
          echo P01_ADMIN_NAV_R2_CONTRACTS=PASS

      - name: Fresh install and Common Baseline
        shell: bash
        run: |
          set -euo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-admin-nav-r2
          cp -a vf-start/src /tmp/p01-admin-nav-r2
          cd /tmp/p01-admin-nav-r2
          php -S 127.0.0.1:18102 -t . >/tmp/p01-admin-nav-r2-server.log 2>&1 &
          echo $! >/tmp/p01-admin-nav-r2.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-admin-nav-r2.cookies -b /tmp/p01-admin-nav-r2.cookies http://127.0.0.1:18102/setup.php -o /tmp/p01-admin-nav-r2-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-admin-nav-r2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-admin-nav-r2.cookies -b /tmp/p01-admin-nav-r2.cookies -X POST http://127.0.0.1:18102/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=VF Admin Nav R2'             --data-urlencode "admin_password=$TEST_PASSWORD"             --data-urlencode "admin_password_confirm=$TEST_PASSWORD"             -o /tmp/p01-admin-nav-r2-setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-admin-nav-r2-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-admin-nav-r2-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-admin-nav-r2-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-admin-nav-r2-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-admin-nav-r2-baseline.txt
          echo P01_ADMIN_NAV_R2_FRESH_BASELINE=PASS

      - name: Authenticated HTTP structure smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:18102
          python3 - <<'PY' >/tmp/p01-admin-nav-r2-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-admin-nav-r2.cookies -b /tmp/p01-admin-nav-r2.cookies             -H 'Content-Type: application/json' -X POST "$BASE/api.php?action=login"             --data-binary @/tmp/p01-admin-nav-r2-login.json             -o /tmp/p01-admin-nav-r2-login-result.json
          grep -F '"ok":true' /tmp/p01-admin-nav-r2-login-result.json >/dev/null

          for page in manage.php resources.php data.php system.php settings.php update.php system-health.php; do
            curl -fsS -c /tmp/p01-admin-nav-r2.cookies -b /tmp/p01-admin-nav-r2.cookies "$BASE/$page" -o "/tmp/p01-admin-nav-r2-$page.html"
          done

          # Global rail: five direct items, no nested submenu.
          grep -F '>概览<' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          grep -F '>资源<' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          grep -F '>数据<' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          grep -F '>系统<' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          grep -F '>设置<' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          test "$(grep -o 'class="vf-rail-item' /tmp/p01-admin-nav-r2-manage.php.html | wc -l | tr -d ' ')" = "5"
          ! grep -F 'vf-rail-submenu' /tmp/p01-admin-nav-r2-manage.php.html >/dev/null
          ! grep -F 'vf-admin-eyebrow' /tmp/p01-admin-nav-r2-update.php.html >/dev/null

          # Module homes own their child tasks.
          grep -F '<h1>资源</h1>' /tmp/p01-admin-nav-r2-resources.php.html >/dev/null
          grep -F 'href="surface-manager.php"' /tmp/p01-admin-nav-r2-resources.php.html >/dev/null
          grep -F 'href="links-admin.php"' /tmp/p01-admin-nav-r2-resources.php.html >/dev/null
          grep -F '<h1>数据</h1>' /tmp/p01-admin-nav-r2-data.php.html >/dev/null
          grep -F 'href="transfer.php"' /tmp/p01-admin-nav-r2-data.php.html >/dev/null
          grep -F 'href="data-safety.php"' /tmp/p01-admin-nav-r2-data.php.html >/dev/null
          grep -F '<h1>系统</h1>' /tmp/p01-admin-nav-r2-system.php.html >/dev/null
          grep -F 'href="system-health.php"' /tmp/p01-admin-nav-r2-system.php.html >/dev/null
          grep -F 'href="update.php"' /tmp/p01-admin-nav-r2-system.php.html >/dev/null
          grep -F 'href="plugins.php"' /tmp/p01-admin-nav-r2-system.php.html >/dev/null
          grep -F '<h1>运行健康</h1>' /tmp/p01-admin-nav-r2-system-health.php.html >/dev/null
          echo P01_ADMIN_NAV_R2_HTTP=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-admin-nav-r2.pid ]; then kill "$(cat /tmp/p01-admin-nav-r2.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-admin-nav-r2 /tmp/p01-admin-nav-r2*
