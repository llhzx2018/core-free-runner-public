name: P07 Server Ops RC3 Restore Preflight Smoke

on:
  push:
    branches: [main, work/p07-cloudpanel-foundation-complete]
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore.py'
      - 'dist/p07/0.1.0-rc3/tests/test_backup.py'
      - 'installers/p07-rc3-candidate.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - '.github/workflows/p07-server-ops-rc3-restore-preflight-smoke.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore.py'
      - 'dist/p07/0.1.0-rc3/tests/test_backup.py'
      - 'installers/p07-rc3-candidate.sh'
      - 'installers/p07-rc3-cloudpanel-complete.sh'
      - '.github/workflows/p07-server-ops-rc3-restore-preflight-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build RC3 guided-init10 combined runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-restore-gate
          mkdir -p /tmp/p07-restore-gate
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-restore-gate/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-restore-gate/
          mkdir -p /tmp/p07-restore-gate/tests
          cp dist/p07/0.1.0-rc3/tests/test_restore.py /tmp/p07-restore-gate/tests/test_restore.py
          cp dist/p07/0.1.0-rc3/tests/test_backup.py /tmp/p07-restore-gate/tests/test_backup.py
          chmod +x /tmp/p07-restore-gate/bin/vfops
          test "$(cat /tmp/p07-restore-gate/BUILD_ID)" = '0.1.0-rc3-guided-init10'

      - name: Restore planner syntax and contract
        run: |
          set -euo pipefail
          python3 -m py_compile /tmp/p07-restore-gate/lib/restore.py /tmp/p07-restore-gate/tests/test_restore.py /tmp/p07-restore-gate/tests/test_backup.py
          grep -Fq 'TARGET_SITE_ALREADY_EXISTS' /tmp/p07-restore-gate/lib/restore.py
          grep -Fq 'existing_site_overwrite_allowed' /tmp/p07-restore-gate/lib/restore.py
          grep -Fq 'os.path.lexists' /tmp/p07-restore-gate/lib/restore.py
          ! grep -Fq 'gates.append("OWNER_OVERWRITE_GATE_REQUIRED")' /tmp/p07-restore-gate/lib/restore.py
          grep -Fq 'new-site restore refuses overwrite' /tmp/p07-restore-gate/lib/restore_new.py

      - name: Restore plan zero-write behavioral gate
        env:
          PYTHONPATH: /tmp/p07-restore-gate/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-restore-gate
          python3 tests/test_restore.py RestorePlanTest -v

      - name: Safety boundary
        run: |
          set -euo pipefail
          ! grep -Eiq 'cloudflare|dns.*(write|update|change)|rm[[:space:]]+-rf[[:space:]]+/home' /tmp/p07-restore-gate/lib/restore.py
          grep -Fq 'existing_site_overwrite_allowed": False' /tmp/p07-restore-gate/lib/restore.py

      - name: Result
        run: echo 'P07_RC3_RESTORE_PREFLIGHT_ZERO_WRITE=PASS'
