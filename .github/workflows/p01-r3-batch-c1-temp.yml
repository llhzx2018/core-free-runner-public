name: p01-r3-batch-c1-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r3-batch-c1-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 30278cd7bac0ecbd41240af03870b6471db9bb9a
      TARGET_SHA: 125854c8c3eb2db370b36b123b188d50a6324a2e
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"; done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R3_C1_EXACT_SOURCES=PASS
      - name: Focused replacement guards
        shell: bash
        run: |
          set -Eeuo pipefail
          cd current
          tests=(
            tests/unit/course_canonical_surface_label_contract.php
            tests/unit/course_state_coherence_contract.php
            tests/unit/default_sort_result_route_contract.php
            tests/unit/derived_search_recommend_sort_contract.php
            tests/unit/derived_sort_route_continuity_contract.php
            tests/unit/kind_toolbar_reset_contract.php
            tests/unit/mobile_filter_context_count_contract.php
            tests/unit/smart_view_sort_reset_contract.php
            tests/unit/subject_clear_filter_sort_contract.php
            tests/unit/subject_filter_reset_contract.php
            tests/unit/subject_global_search_context_contract.php
            tests/unit/subject_kind_zero_scope_contract.php
            tests/unit/tag_search_count_context_contract.php
            tests/unit/pending_domain_suggestion_scope_contract.php
            tests/unit/pending_focus_isolation_contract.php
            tests/unit/pending_focus_manual_domain_contract.php
            tests/unit/pending_list_action_continuity_contract.php
            tests/unit/resource_action_visibility_contract.php
            tests/unit/resource_image_delivery_contract.php
            tests/unit/resource_manager_save_continuity_contract.php
            tests/unit/software_os_context_count_contract.php
            tests/unit/tool_scene_context_total_contract.php
            tests/unit/tool_scene_recommended_sort_contract.php
            tests/unit/tools_facet_context_count_contract.php
            tests/unit/topic_course_search_chip_count_contract.php
            tests/unit/topic_quick_context_contract.php
            tests/unit/watch_page_context_count_contract.php
            tests/unit/watch_status_context_badge_contract.php
            tests/unit/watch_year_genre_zero_result_contract.php
            tests/unit/quick_save_continuous_capture_contract.php
            tests/unit/project_action_hierarchy_contract.php
            tests/unit/project_activity_source_label_contract.php
            tests/unit/project_card_lifecycle_badge_contract.php
            tests/unit/project_critical_card_border_contract.php
            tests/unit/project_recent_checks_lifecycle_contract.php
            tests/unit/project_repair_accessible_label_contract.php
            tests/unit/project_retired_entry_fact_contract.php
            tests/unit/project_retired_url_requirement_contract.php
          )
          test "${#tests[@]}" -eq 38
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_R3_C1_REPLACEMENT_GUARDS=PASS
      - name: Canonical debt comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_BASELINE_FAILURE_COUNT=60$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=22$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_TEST_COUNT=38$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_RESOLVED_DEBT_COUNT=38$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          echo P01_R3_C1_CANONICAL=PASS
      - name: Runtime source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --exit-code "$BASE_SHA" "$TARGET_SHA" -- src
          test "$(cat current/VERSION)" = "2.47.41"
          test -z "$(git -C current status --porcelain --untracked-files=no)"
          echo P01_R3_C1_RUNTIME_UNCHANGED=PASS
