name: P05 V1.2.2 VF_PROJECT Sync
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-vfproject-sync-45823b5.yml']
permissions:
  contents: read
jobs:
  sync-vfproject:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-vfproject-sync-45823b5-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact P05 release branch with release write authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: release/p05-v1.2.2-readiness-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact branch head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '45823b553a3c3dcf17a32a2bb485d35a2555b11f'
          test -z "$(git status --porcelain)"
      - name: Synchronize only VF_PROJECT v1.2.2 release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('VF_PROJECT.json')
          data = json.loads(p.read_text())
          assert data.get('project_id') == 'P05'
          data['version'] = '1.2.2'
          data['target_version'] = '1.2.2'
          data['working_version'] = '1.2.2'
          if 'production_version' in data:
              data['production_version'] = '1.2.1'
          if 'status' in data:
              data['status'] = 'V1.2.2_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / RELEASE_AUTHORIZED / PRODUCTION_V1.2.1_OWNER_OBSERVED'
          if 'version_change' in data:
              data['version_change'] = True
          if 'candidate_authorization' in data:
              data['candidate_authorization'] = 'RELEASE_READINESS / OWNER_AUTHORIZED_V1.2.2'
          if 'release_authorization' in data:
              data['release_authorization'] = 'OWNER_AUTHORIZED_V1.2.2'
          if 'production_deployment_authorization' in data:
              data['production_deployment_authorization'] = 'NOT_AUTHORIZED / OWNER_REQUESTED_VPS_UPDATE_FILE_ONLY'
          if 'owner_real_use_review' in data:
              data['owner_real_use_review'] = 'V1.2.1_OWNER_OBSERVED_RUNNING / UPDATE_ENTRY_REGRESSION_CONFIRMED'
          if 'owner_real_use_pass' in data:
              data['owner_real_use_pass'] = 'PARTIAL / PRODUCT_RUNNING / UPDATE_ENTRY_REGRESSION_FIXED_IN_V1.2.2_CANDIDATE'
          if 'next_action' in data:
              data['next_action'] = 'V1.2.2 FINAL EXACT SOURCE GATE → MAIN PROMOTION → FORMAL RELEASE/TAG → DIRECT V1.2.1→V1.2.2 VPS UPDATE; PRODUCTION_WRITE=0'
          if 'deployment_readiness' in data:
              data['deployment_readiness'] = 'V1.2.2_CANDIDATE_FINAL_GATE_PENDING'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          node - <<'NODE'
          const p=require('./VF_PROJECT.json');
          if(p.project_id!=='P05'||p.version!=='1.2.2'||p.target_version!=='1.2.2'||p.working_version!=='1.2.2') process.exit(1);
          NODE
          git diff --check
      - name: Commit exact one-file authority sync
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = 'VF_PROJECT.json'
          git commit -m 'chore(P05): sync VF_PROJECT for v1.2.2 release gate'
          git push origin HEAD:release/p05-v1.2.2-readiness-20260902
          echo "P05_V122_VFPROJECT_SYNC_COMMIT=$(git rev-parse HEAD)"
          echo 'P05_V122_VFPROJECT_SYNC=PASS'
          echo 'P05_PRODUCTION_WRITE=0'
