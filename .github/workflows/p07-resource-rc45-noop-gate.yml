name: P07 rc45 no-change truth and safety gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc45/**'
      - 'tests/test_p07_resource_noop_truth.py'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-resource-rc45-noop-gate.yml'
permissions:
  contents: read
jobs:
  no-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify immutable published candidate and frozen unrelated menus
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc45'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc45'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '5f6780059491b80af11665103ec868428146ce58'
          (cd "$pkg" && while read -r sha path; do test "$(git hash-object "$path")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object "$pkg/lib/resource_apply.py")" = '0eef659e7a7edc0395a1e680cdaf77521bb3aa59'
          test "$(git hash-object "$pkg/lib/resource_brief.py")" = 'ee41f62775a17fbfcd90059f332d092e56a6dc99'
          grep -Fq "VERSION='0.1.0-rc47'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='44e39f47baf34f4d49feefcac0e95acf58854402'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc47"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          bash -n "$pkg/vf-system-care.sh" "$pkg/resource-apply.sh"
          python3 -m py_compile "$pkg/lib/resource_apply.py" "$pkg/lib/resource_brief.py"
          echo P07_RC45_EXACT_SOURCE=PASS
      - name: No-op must never write or reload and must not invite Apply
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_p07_resource_noop_truth.py -v
          grep -Fq 'UNCHANGED_VERIFIED' packages/p07-system-care/0.1.0-rc45/lib/resource_apply.py
          grep -Fq 'return 4' packages/p07-system-care/0.1.0-rc45/lib/resource_brief.py
          grep -Fq 'no_runtime_changes' packages/p07-system-care/0.1.0-rc45/lib/resource_apply.py
          echo P07_RC45_NOOP_FAIL_CLOSED=PASS
