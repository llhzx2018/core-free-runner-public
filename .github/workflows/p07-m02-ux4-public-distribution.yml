name: P07 M02 UX4 public distribution
on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-m02-ux4-owner-route.py'
      - 'tests/test_p07_m02_ux4_public_distribution.py'
      - '.github/workflows/p07-m02-ux4-public-distribution.yml'
  push:
    branches: [main]
    paths:
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-m02-ux4-public-distribution.yml'
permissions:
  contents: read
jobs:
  public-m02:
    if: github.repository == 'llhzx2018/core-free-runner-public' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact M02 route and unaffected module pins
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n installers/p07-toolbox.sh
          python3 -B scripts/check_p07_public_install_contract.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_install_contract.py' -q
          python3 -B scripts/check_p07_public_terminal_ux.py --base-ref '84095d11b08bd1d905fb4ab4d6dccb0fa8505344'
          python3 -B - <<'PY'
          import re, subprocess
          from pathlib import Path
          old=subprocess.check_output(["git","show","84095d11b08bd1d905fb4ab4d6dccb0fa8505344:installers/p07-toolbox.sh"],text=True)
          new=Path("installers/p07-toolbox.sh").read_text()
          def other(s):
              return [x for x in s.splitlines() if re.match(r'^(VF_NODE_|M01_|M03_|VF_SERVER_OPS_|M04_|M05_|P07_THREE_|P07_M01_|P07_M04_)',x)]
          assert other(old)==other(new)
          assert 'VPS_AUDIT_BUILD_EXPECTED="2.1.1-ux4"' in new
          assert 'P07_M02_ZIP_SHA256="1cae35bf31f119ae1ad891df4846503bbea45745ad8ac55678b666a35aaa35ad"' in new
          assert subprocess.check_output(["git","hash-object","installers/p07-m02-ux4-owner-route.py"],text=True).strip()=="a610db186403eebfdb27eaf1ab72948357417fe0"
          print("M02_ONLY_PINS_AND_ADAPTER=PASS")
          PY
      - name: Actual issued archive installation and upgrade via public toolbox
        if: github.event_name == 'pull_request'
        shell: bash
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT python3 -B tests/test_p07_m02_ux4_public_distribution.py
      - name: Anonymous live public main readback after merge
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          # This gate is scoped to the current M02 release, not a future version.
          if ! grep -Fxq 'VPS_AUDIT_BUILD_EXPECTED="2.1.1-ux4"' installers/p07-toolbox.sh; then
            echo 'M02 UX4 no longer selected; historical gate not applicable'
            exit 0
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 90 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o "$work/toolbox"
          cmp installers/p07-toolbox.sh "$work/toolbox"
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 90 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/033c289d652e26e4908cc89b0d14ca7c538bc3d8/installers/p07-m02-ux4-owner-route.py -o "$work/route"
          test "$(git hash-object "$work/route")" = a610db186403eebfdb27eaf1ab72948357417fe0
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 90 https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m02-v2.1.1-ux4-20261128/P07-M02-2.1.1-ux4.zip -o "$work/asset.zip"
          echo "1cae35bf31f119ae1ad891df4846503bbea45745ad8ac55678b666a35aaa35ad  $work/asset.zip" | sha256sum -c -
          echo 'M02_PUBLIC_MAIN_READBACK=PASS'
