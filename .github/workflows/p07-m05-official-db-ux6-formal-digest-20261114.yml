# One-shot no-public-artifact reproducibility preflight, closes without merge.
name: P07-M05 新服务器初始化 official-db-ux6 exact ZIP digest
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m05-official-db-ux6-formal-digest-20261114.yml']
permissions:
  contents: read
jobs:
  digest:
    if: github.head_ref == 'test/p07-m05-official-db-ux6-formal-digest-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact private P07-M05 source checkout in disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 651794c501d45253f77798337e4054da60e1c64d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private_m05
      - name: Build twice, scan paths and print only safe ZIP digest and count
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private_m05 rev-parse HEAD)" = 651794c501d45253f77798337e4054da60e1c64d
          grep -Fxq 'BUILD_ID = "0.1.0-m05-official-db-choice-ux6"' private_m05/scripts/build_p07_m05_bundle.py
          mkdir -p "$RUNNER_TEMP/m05"
          python3 -B private_m05/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/first.zip" >/dev/null
          python3 -B private_m05/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/second.zip" >/dev/null
          cmp "$RUNNER_TEMP/m05/first.zip" "$RUNNER_TEMP/m05/second.zip"
          python3 - "$RUNNER_TEMP/m05/first.zip" <<'PY'
          import hashlib, json, pathlib, stat, sys, zipfile
          p=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              infos=z.infolist(); names=[i.filename for i in infos]
              assert len(infos)>=90 and len(names)==len(set(names))
              assert "p07-m05/MODULE_MANIFEST.json" in names
              guard=z.read("p07-m05/lib/m05_environment_guard.py")
              assert b"PHP CLI is a base-image" in guard
              options=z.read("p07-m05/lib/m05_db_options.py")
              ui=z.read("p07-m05/bin/vfops-init-ui")
              assert b"def grouped_menu_options" in options
              assert b'ui_title "$family"' in ui
              assert b"CloudPanel" in ui
              assert b"systemd-resolved.service" in guard
              for item in infos:
                  name=pathlib.PurePosixPath(item.filename)
                  assert len(name.parts)>1 and name.parts[0]=="p07-m05"
                  assert not name.is_absolute() and ".." not in name.parts
                  assert not item.is_dir() and (item.external_attr >> 16 & 0o170000)!=stat.S_IFLNK
                  assert not any(part in {".git",".github",".env","__pycache__"} for part in name.parts)
                  assert not name.name.endswith((".pem",".key",".pyc"))
                  assert b"-----BEGIN PRIVATE KEY-----" not in z.read(item)
              obj=json.loads(z.read("p07-m05/MODULE_MANIFEST.json"))
              assert obj["module_build_id"]=="0.1.0-m05-official-db-choice-ux6"
          print("P07_M05_UX6_EXACT_SOURCE=651794c501d45253f77798337e4054da60e1c64d")
          print("P07_M05_UX6_STANDALONE_ZIP_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          print("P07_M05_UX6_STANDALONE_ZIP_BYTES="+str(p.stat().st_size))
          print("P07_M05_UX6_STANDALONE_ZIP_FILES="+str(len(infos)))
          print("P07_M05_UX6_REPRODUCIBLE_ZIP_AND_SENSITIVE_SCAN=PASS")
          print("P07_OWNER_PRODUCTION=NOT_RUN")
          PY
      - name: Remove private source and ZIP on both PASS and failure
        if: always()
        shell: bash
        run: |
          rm -rf -- private_m05 "$RUNNER_TEMP/m05"
          echo P07_M05_PRIVATE_CHECKOUT_AND_BUNDLE_CLEANUP=YES
