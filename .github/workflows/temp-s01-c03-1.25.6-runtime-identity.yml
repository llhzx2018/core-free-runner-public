name: TEMP S01-C03 1.25.6 Runtime Identity

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-1.25.6-runtime-identity.yml'

permissions:
  contents: read

jobs:
  runtime-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Compute exact Runtime Authority identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('src')
          allowed_root={'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
          excluded_base={'readme.md','changelog.md','license','license.txt','package_profile.json'}
          excluded_dirs={'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'}
          runtime={}
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix()
              parts=rel.split('/')
              if any(part.lower() in excluded_dirs for part in parts[:-1]): continue
              if parts[-1].lower() in excluded_base: continue
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  ok=rel in allowed_root
              else:
                  ok=parts[0] in {'admin','config','includes','public','templates','tools'}
              if not ok: continue
              runtime[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          runtime=dict(sorted(runtime.items()))
          canonical=''.join(f'{path}\0{sha}\n' for path,sha in runtime.items()).encode()
          out={'component_id':'S01-C03','version':'1.25.6','runtime_contract':'VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1','file_count':len(runtime),'fingerprint_sha256':hashlib.sha256(canonical).hexdigest()}
          Path('/tmp/runtime-identity.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-1.25.6-runtime-identity-${{ github.run_id }}
          path: /tmp/runtime-identity.json
          if-no-files-found: error
          retention-days: 14
