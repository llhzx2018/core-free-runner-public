name: P01 upgrade recovery age observations source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247305-upgrade-age-proof.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2b49b8288992c57ba14cdf3278c40755aade247d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout formal stable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.304
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: PHP 8.3 SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Native isolated age partition and focused backups
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2b49b8288992c57ba14cdf3278c40755aade247d
          php -l src/app/BackupManager.php
          php -l tests/unit/backup_upgrade_age_readonly_native.php
          node --check src/assets/data-recovery.js
          node --check tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          php tests/unit/backup_upgrade_age_readonly_native.php
          php tests/unit/backup_upgrade_retention_preview_v247298_contract.php
          php tests/unit/backup_missing_history_readonly_audit_native.php
          php tests/unit/backup_storage_capacity_readonly_contract.php
          php tests/unit/admin_backup_typography_readability_contract.php
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          node tests/browser/backup_missing_alert_v247297_smoke.cjs
          echo P01_UPGRADE_AGE_FOCUSED=PASS
      - name: Canonical zero-debt baseline comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_UPGRADE_AGE_CANONICAL=PASS
