name: S01 native WP updater discovers final tool fixes
on:
  push:
    branches: [task/s01-tools88-theme111-native-20261013]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: 'cddebc5f66f21f05b7adc91bd46f7064981f69fb'
      TARGET_TREE: '6c503c135af4a8d05c1aa876912d3cd295ab36b5'
      CHANNEL_SHA: 'cddebc5f66f21f05b7adc91bd46f7064981f69fb'
      THEME_SOURCE_VERSION: '1.35.110'
      THEME_LEGACY_SOURCE_VERSION: '1.35.109'
      THEME_VERSION: '1.35.111'
      THEME_SHA: '64f27394d98a21db0816146216afa045b31ca5fc'
      THEME_TREE: '3e78a91ac2fe1074d1d42cfeaad6dbaaa4c06c40'
      THEME_ASSET_SHA: '4587f95fe006606adf059e03c6452436fc79f8cfc616097f80657e9dc5091bd9'
      M3_SOURCE_VERSION: '1.25.87'
      M3_VERSION: '1.25.88'
      M3_SHA: 'fe2fca80f0ebdcdd95562758849c1b9807ee904f'
      M3_TREE: '4a3b793ae64aea662c40860f19c454f438d7b926'
      M3_ASSET_SHA: 'f3beacffa7fbd893e1b4aba9a497565d697c8e72b967b0c645ad55de0fb8e6f1'
      THEME_BASE_BYTES: '1793771'
      THEME_BASE_SHA256: '17e54882cff8ab4e755ba33a851e343d6db69290389851a2e0c45c9c49ce0c53'
      M3_BASE_BYTES: '3576140'
      M3_BASE_SHA256: '95e72cb7e00d221dbdb5d625e5230f427fbe7d7e3d11f715fb73ce3b293f6da6'
      THEME_LEGACY_BYTES: '1793240'
      THEME_LEGACY_SHA256: '67af8f8feafaac4555aed8707d3befe206a72dc45ef4738c32a9c13618e6eda7'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact one-spec discovery audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-tools88-theme111-native-20261013/spec.json --template runner/lanes/s01-tools88-theme111-native-20261013/discovery.template.yml --output /tmp/discovery-render.yml >/dev/null
          cmp /tmp/discovery-render.yml runner/.github/workflows/s01-tools88-theme111-native-20261013.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-tools88-theme111-native-20261013/spec.json --input runner/.github/workflows/s01-tools88-theme111-native-20261013.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-tools88-theme111-native-20261013 lane
          bash -n lane/native.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Original Core CI on the exact merged distribution source
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cd target
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010-discovery
          persist-credentials: false
          path: historic-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed78-20261010-discovery
          persist-credentials: false
          path: historic-m3
      - name: Real WordPress old-install native update discovery and exact asset download
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lane/native.sh
      - name: Public-safe discovery receipts only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-native-discovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Uploaded public-safe receipt reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/native-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/native-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import os,json,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text());b=pathlib.Path('/tmp/native-receipt.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert m['size_in_bytes']==len(b) and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/native-receipt.zip') as z:
           assert z.testzip() is None
           names={'lane-identity.json','native-theme-current.json','native-theme-legacy.json','native-m3.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:
            assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           final=json.loads(z.read('FINAL_DISCOVERY.json'))
           assert final['status']=='PASS' and len(final['component_checks'])==2
          print('PUBLIC_SAFE_NATIVE_READBACK',json.dumps({'status':'PASS','artifact_id':m['id'],'digest':m['digest'],'bytes':len(b)}))
          PY
      - name: Remove private checkout and synthetic artifacts
        if: always()
        run: rm -rf target historic-theme historic-m3 /tmp/vf-s01-wpcli.phar /tmp/theme-source.zip /tmp/theme-legacy-source.zip /tmp/m3-source.zip /tmp/theme-channel.json /tmp/m3-channel.json

