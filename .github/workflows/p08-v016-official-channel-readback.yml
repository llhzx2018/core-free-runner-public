name: P08 v016 official stable channel original issued old-client readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-official-channel-readback.yml
permissions:
  contents: read
jobs:
  exact-official-channel:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-official-channel-readback-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CHANNEL_STAGE: 'pre'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ephemeral public-safe readback
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP 8.4 old-client native runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,openssl,posix
          coverage: none
      - name: Official v015 source manifest and current v016 Release/provenance
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "${CHANNEL_STAGE}" = pre || test "${CHANNEL_STAGE}" = post
          temp="$RUNNER_TEMP/p08-v016-channel-readback"
          test ! -e "$temp"
          mkdir -m 700 "$temp"
          gh release download v0.1.15 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.15_FULL.zip -D "$temp" >/dev/null
          printf '%s  %s\n' 538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73 "$temp/VF_AdOps_V0.1.15_FULL.zip" | sha256sum -c --status
          unzip -p "$temp/VF_AdOps_V0.1.15_FULL.zip" FULL_MANIFEST.json > "$temp/old.json"
          python3 - "$temp/old.json" <<'PY'
          import json,hashlib,sys
          raw=open(sys.argv[1],'rb').read()
          j=json.loads(raw)
          assert j['type']=='CLEAN_FULL_ONLY' and j['target_version']=='0.1.15'
          assert j['source_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          print('P08_V016_ISSUED_V015_FULL_MANIFEST_SHA256='+hashlib.sha256(raw).hexdigest())
          PY
          gh release download v0.1.16 -R llhzx2018/vf-adops -p RELEASE_PROVENANCE.json -D "$temp" >/dev/null
          python3 - "$temp/RELEASE_PROVENANCE.json" "$temp/old.json" <<'PY'
          import hashlib,json,sys
          p=json.load(open(sys.argv[1]))
          old=hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest()
          assert p['source_version']=='0.1.15' and p['target_version']=='0.1.16'
          assert p['source_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          assert p['target_sha']=='ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          assert p['source_full_manifest_sha256']==old
          assert p['final_full_sha256']=='7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f'
          assert p['final_update_sha256']=='6cd533631c3651117f09ffce3829a565d16d945f7f1e4938c27d678c75e3c399'
          assert p['normal_unbridged_v015_supported'] is False
          print('P08_V016_OFFICIAL_PREISSUE_ASSET_PROVENANCE_AND_OLD_SOURCE=PASS')
          PY
          if [[ "$CHANNEL_STAGE" == post ]]; then
            gh release download v0.1.16 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.16_FULL.zip -p VF_AdOps_V0.1.16_UPDATE.zip -D "$temp" >/dev/null
            printf '%s  %s\n' 7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f "$temp/VF_AdOps_V0.1.16_FULL.zip" | sha256sum -c --status
            printf '%s  %s\n' 6cd533631c3651117f09ffce3829a565d16d945f7f1e4938c27d678c75e3c399 "$temp/VF_AdOps_V0.1.16_UPDATE.zip" | sha256sum -c --status
            gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main --jq '.content' | base64 -d > "$temp/channel.json"
            python3 - "$temp/channel.json" "$temp/old.json" <<'PY'
          import hashlib,json,sys
          c=json.load(open(sys.argv[1]))
          old=hashlib.sha256(open(sys.argv[2],'rb').read()).hexdigest()
          assert c['target_version']=='0.1.16' and c['release_tag']=='v0.1.16'
          assert c['from_versions']==[]
          assert c['source_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          assert c['source_full_manifest_sha256']==old
          assert c['target_sha']=='ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          assert c['release_id']==453771143 and c['asset_id']==775936905
          assert c['full_asset_id']==775936908
          assert c['asset_sha256']=='6cd533631c3651117f09ffce3829a565d16d945f7f1e4938c27d678c75e3c399'
          assert c['full_asset_sha256']=='7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f'
          assert c['production_auto_apply'] is False
          assert c['backup_required'] is True and c['rollback_supported'] is True
          assert c['enabled'] is True
          print('P08_V016_OFFICIAL_POSTCHANNEL_NO_UNBRIDGED_V015_COMPATIBILITY=PASS')
          PY
            mkdir -m 700 "$temp/oldsite"
            unzip -q "$temp/VF_AdOps_V0.1.15_FULL.zip" -d "$temp/oldsite"
            export P08_ORIGINAL_015_ROOT="$temp/oldsite"
            export P08_CHANNEL_V015_MANIFEST="$temp/old.json"
            php scripts/p08_v016_official_old_php_live_channel.php
            echo P08_V016_ORIGINAL_ISSUED_OLD_PHP_REAL_GITHUB_HTTPS_CHANNEL=PASS
          fi
          echo P08_V016_CHANNEL_STAGE_COMPLETE_PASS
      - name: Erase old FULL, provenance, token-free channel, and scratch
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNNER_TEMP/p08-v016-channel-readback"
          test ! -e "$RUNNER_TEMP/p08-v016-channel-readback"
          echo P08_V016_OFFICIAL_CHANNEL_READBACK_CLEANUP=PASS
