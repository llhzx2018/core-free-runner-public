name: P08 v015 source proof prior issued v014 true Atomic-installed native 3DB
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-issued-v014-atomic-lineage-3db.yml
      - lanes/p08-v015-issued-v014-atomic-lineage-3db-20261121.json
permissions:
  contents: read
jobs:
  old-official-atomic-origin-3db:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-issued-v014-atomic-lineage-3db-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-v015-origin-isolated-only
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-v015-origin-isolated-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=18
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
      TARGET_TREE: 5d3fa9d901a699815e826065f3f27a83afb9ad9f
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-v015-origin-isolated-only
      P08_TEST_DB_CLEAN: p08_ci_v015_origin
      P08_TEST_DB_DIRTY: p08_ci_v015_origin_dirty
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout ephemeral public-safe origin proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify original lane v015 target identity before old-issued source calls
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ephemeral_lane_spec.py validate --spec lanes/p08-v015-issued-v014-atomic-lineage-3db-20261121.json
          python3 -B scripts/ephemeral_lane_spec.py audit-rendered --spec lanes/p08-v015-issued-v014-atomic-lineage-3db-20261121.json --input .github/workflows/p08-v015-issued-v014-atomic-lineage-3db.yml
      - name: Exact original officially issued v014 source tests (transient private checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6fae792864a594465e4b3224bd6d73abde976f12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old014
      - name: PHP native original issued v014 dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,bcmath,fileinfo
          coverage: none
      - name: Native dump/database clients for old Atomic origin
        if: matrix.kind != 'sqlite'
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client
          command -v mariadb
      - name: Download immutable genuine issued old Full and 014 Atomic with exact hashes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C old014 rev-parse HEAD)" = 6fae792864a594465e4b3224bd6d73abde976f12
          work="$RUNNER_TEMP/p08-014-atomic-origin-${{ matrix.kind }}"
          test ! -e "$work"
          mkdir -m 700 "$work"
          gh release download v0.1.13 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.13_FULL.zip -D "$work"
          gh release download v0.1.14 -R llhzx2018/vf-adops -p VF_AdOps_V0.1.14_UPDATE.zip -p VF_AdOps_V0.1.14_FULL.zip -D "$work"
          printf 'f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec  %s\n' "$work/VF_AdOps_V0.1.13_FULL.zip" | sha256sum -c --status
          printf '7177496dc9322ded6c3fa53aa2c0a7eb5ac1f015531516b829d7c4d71e6e80af  %s\n' "$work/VF_AdOps_V0.1.14_UPDATE.zip" | sha256sum -c --status
          printf '2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b  %s\n' "$work/VF_AdOps_V0.1.14_FULL.zip" | sha256sum -c --status
          unzip -p "$work/VF_AdOps_V0.1.13_FULL.zip" FULL_MANIFEST.json > "$work/v013-full-manifest.json"
          unzip -p "$work/VF_AdOps_V0.1.14_FULL.zip" FULL_MANIFEST.json > "$work/v014-full-manifest.json"
          python3 - "$work" <<'PY'
          import hashlib,sys,json,zipfile
          from pathlib import Path
          t=Path(sys.argv[1])
          a=(t/'v013-full-manifest.json').read_bytes()
          b=(t/'v014-full-manifest.json').read_bytes()
          assert hashlib.sha256(a).hexdigest()=='c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d'
          assert hashlib.sha256(b).hexdigest()=='efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b'
          with zipfile.ZipFile(t/'VF_AdOps_V0.1.14_UPDATE.zip') as z:
            m=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert m['source_version']=='0.1.13'
            assert m['source_sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e'
            assert m['source_full_manifest_sha256']==hashlib.sha256(a).hexdigest()
            assert m['target_version']=='0.1.14'
            assert m['target_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['schema_changes'] is False
          print('P08_V015_OFFICIAL_V014_ATOMIC_AND_PRIOR_013_FULL_MANIFEST=PASS')
          PY
      - name: Install genuine issued v013 FULL, then original PHP applies official issued v014 Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          work="$RUNNER_TEMP/p08-014-atomic-origin-${{ matrix.kind }}"
          site="$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-issued014"
          test ! -e "$site"
          mkdir -m 700 "$site"
          unzip -q "$work/VF_AdOps_V0.1.13_FULL.zip" -d "$site"
          mkdir -p "$site/tests/compatibility" "$site/tests/fixtures"
          cp old014/tests/test_install_sqlite_e2e.php old014/tests/test_install_mysql_e2e.php "$site/tests/"
          cp old014/tests/fixtures/create_ci_databases.php "$site/tests/fixtures/"
          cp old014/tests/compatibility/r101_complete_schema.php "$site/tests/compatibility/"
          if [ "${{ matrix.kind }}" = sqlite ]; then
            php "$site/tests/test_install_sqlite_e2e.php"
          else
            php "$site/tests/fixtures/create_ci_databases.php"
            php "$site/tests/test_install_mysql_e2e.php"
          fi
          test "$(readlink "$site/current")" = releases/8b385fecd132a02ac79f5b67e670783e98997c3e
          # Existing fixture optional read token is known synthetic, never a real secret.
          token="$site/storage/app/private/adops/upgrade/github-read-token"
          if [ -f "$token" ]; then
            test ! -L "$token"
            test "$(cat "$token")" = "github_pat_$(printf 's%.0s' {1..42})"
            rm -- "$token"
          fi
          mkdir -p "$(dirname "$token")"
          printf 'github_pat_%045d\n' 0 > "$token"
          chmod 0600 "$token"
          media="$site/storage/app/private/adops/r202-media-proof.bin"
          printf 'P08_SYNTHETIC_ORIGIN_v013_TO_v014_%s\n' "${{ matrix.kind }}" > "$media"
          chmod 0600 "$media"
          original_token="$(sha256sum "$token" | cut -d' ' -f1)"
          original_media="$(sha256sum "$media" | cut -d' ' -f1)"
          P08_R205_CHAINED=YES php old014/tests/compatibility/r205_chained_atomic_apply.php \
            "$site" 8b385fecd132a02ac79f5b67e670783e98997c3e \
            c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d \
            "$work/VF_AdOps_V0.1.14_UPDATE.zip" \
            6fae792864a594465e4b3224bd6d73abde976f12 0.1.14
          test "$(readlink "$site/current")" = releases/6fae792864a594465e4b3224bd6d73abde976f12
          test "$(cat "$site/current/VERSION")" = 0.1.14
          cmp "$site/current/FULL_MANIFEST.json" "$work/v014-full-manifest.json"
          test "$(sha256sum "$token" | cut -d' ' -f1)" = "$original_token"
          test "$(sha256sum "$media" | cut -d' ' -f1)" = "$original_media"
          test ! -e "$site/storage/app/private/adops/maintenance/maintenance.json"
          test "$(find "$site/storage/app/private/adops/recovery" -type f -name manifest.json | wc -l)" -ge 1
          echo "P08_V015_OFFICIAL_V014_ATOMIC_INSTALLED_SOURCE_${{ matrix.kind }}=PASS"
          echo "P08_V015_OFFICIAL_V014_ATOMIC_INSTALLED_EQUALS_ORIGINAL_FULL_MANIFEST_${{ matrix.kind }}=PASS"
      - name: Always erase immutable private source and synthetic database/credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- old014 "$RUNNER_TEMP/p08-014-atomic-origin-${{ matrix.kind }}" \
            "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-issued014"
          test ! -e old014
          echo "P08_V015_OFFICIAL_V014_ISSUED_ATOMIC_ORIGIN_${{ matrix.kind }}_CLEANUP=PASS"
