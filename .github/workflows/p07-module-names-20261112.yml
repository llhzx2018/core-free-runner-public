name: P07 Chinese module contracts exact-source
on:
  push:
    branches:
      - task/p07-module-names-20261112
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  chinese-module-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P07_SOURCE_SHA: 9d98ec0319c2e73713439af2e98011eaf88daf7c
    steps:
      - name: Exact transient P07 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9d98ec0319c2e73713439af2e98011eaf88daf7c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Check module naming and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_SOURCE_SHA"
          python3 -B -m compileall -q product/scripts/check_p07_modules.py product/tests/test_p07_module_contract.py
          (cd product && python3 -B scripts/check_p07_modules.py)
          (cd product && python3 -B -m unittest -v tests.test_p07_module_contract)
          (cd product && python3 -B scripts/check_p07_modules.py --module P07-M03-D04 --pr-title "P07-M03-D04 服务器迁移：完整业务名称检查" --changed-file lib/server_migration_pull.py)
          echo P07_MODULE_CHINESE_LABELS=PASS
          echo P07_CROSS_MODULE_NEGATIVE_TESTS=PASS
          echo P07_MIGRATION_REAL_TEST=NOT_RUN
          echo P07_RELEASE=NO
      - name: Always clean private source
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_SOURCE_CLEANUP=YES
