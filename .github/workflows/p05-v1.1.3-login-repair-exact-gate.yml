name: P05 V1.1.3 Login Repair Exact Gate

on:
  push:
    branches:
      - gate/p05-v113-login-repair-20260830
    paths:
      - '.github/workflows/p05-v1.1.3-login-repair-exact-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SHA: 91a02794395fbd216a595e08b7ded6f06fc4c23d
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact P05 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SHA"
          echo P05_LOGIN_REPAIR_EXACT_SOURCE=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Full Node regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo P05_LOGIN_REPAIR_NODE=PASS

      - name: PHP runtime and legacy login repair
        shell: bash
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SQLITE_PATH: /tmp/vf-seo-v113-login.sqlite3
          VF_BACKUP_DIR: /tmp/vf-seo-v113-login-backups
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || !extension_loaded("pdo_sqlite")) exit(1);'
          php -l index.php
          npm run php:lint
          php php/tests/security-interop.php
          rm -f "$VF_SQLITE_PATH" "$VF_SQLITE_PATH-wal" "$VF_SQLITE_PATH-shm"
          rm -rf "$VF_BACKUP_DIR"
          php php/bin/migrate.php
          php php/bin/bootstrap-admin.php
          bash php/tests/http-smoke.sh
          bash php/tests/login-session-compat-smoke.sh
          echo P05_LEGACY_LOGIN_RUNTIME=PASS

      - name: Clean FULL and browser install regression
        shell: bash
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_EXACT_SHA }}
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          echo P05_LOGIN_REPAIR_CLEAN_FULL=PASS

      - name: Machine receipt
        shell: bash
        run: |
          set -euo pipefail
          echo P05_V113_LOGIN_REPAIR_MACHINE=PASS
          echo P05_EXACT_SOURCE=$P05_EXACT_SHA
          echo P05_PRODUCTION_WRITE=0
