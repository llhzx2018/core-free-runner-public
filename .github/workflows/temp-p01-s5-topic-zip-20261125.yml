name: TEMP P01 S5 Topic Markdown ZIP scoped 3DB and Vue compile
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s5-topic-zip-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p01-s5-topic-zip-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  topic-zip-3db:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s5-filter-regression-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: p01_s5_zip
          MYSQL_USER: vf_s5_fixture
          MYSQL_PASSWORD: synthetic_only_local_db_password
          MYSQL_ROOT_PASSWORD: synthetic_only_local_root_password
        ports: [ '33584:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: p01_s5_zip
          MARIADB_USER: vf_s5_fixture
          MARIADB_PASSWORD: synthetic_only_local_db_password
          MARIADB_ROOT_PASSWORD: synthetic_only_local_root_password
        ports: [ '33585:3306' ]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: b36dc446d76fae68b447e853a93567c5a1afba12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source and new-only first-install exclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "b36dc446d76fae68b447e853a93567c5a1afba12"
          test "$(cat private-src/VERSION)" = '0.1.0-dev'
          test ! -e private-src/storage/app/private/vf-startnew/installed.json
          echo 'P01_S5_ZIP_EXACT_SOURCE=PASS'
      - name: Prepare PHP 8.4 native SQLite MySQL MariaDB and Zip
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Lint and install locked PHP project dependencies
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -r 'exit(class_exists("ZipArchive") ? 0 : 2);'
          php -l app/Modules/Topics/Application/TopicNotesZipExchange.php > "$RUNNER_TEMP/p01-zip-lint.log" 2>&1
          php -l app/Modules/Topics/Presentation/TopicController.php >> "$RUNNER_TEMP/p01-zip-lint.log" 2>&1
          php -l tests/Feature/TopicMarkdownWorkflowTest.php >> "$RUNNER_TEMP/p01-zip-lint.log" 2>&1
          echo 'P01_S5_ZIP_PHP84_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --no-ansi > "$RUNNER_TEMP/p01-zip-composer.log" 2>&1; then
            echo 'P01_S5_ZIP_COMPOSER=FAIL'; exit 1
          fi
          echo 'P01_S5_ZIP_COMPOSER=PASS'
      - name: Real scoped S5 ZIP and topic regression in each native DB
        working-directory: private-src
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          VF_INSTALL_ALLOW_UNMARKED_DEV: 'true'
          VF_INSTALL_DEV_CLAIM_ENABLED: 'false'
          DB_HOST: '127.0.0.1'
          DB_DATABASE: p01_s5_zip
          DB_USERNAME: vf_s5_fixture
          DB_PASSWORD: synthetic_only_local_db_password
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test ! -e storage/app/private/vf-startnew/installed.json
          for engine in sqlite mysql mariadb; do
            export DB_CONNECTION="$engine"
            if [[ "$engine" = sqlite ]]; then
              export DB_DATABASE=':memory:'
              unset DB_PORT
            else
              export DB_DATABASE='p01_s5_zip'
              if [[ "$engine" = mysql ]]; then export DB_PORT=33584
              else export DB_PORT=33585; fi
              php -r '$d=getenv("DB_CONNECTION");$p=(int)getenv("DB_PORT");$c=new PDO("mysql:host=127.0.0.1;port=$p;dbname=p01_s5_zip","vf_s5_fixture",getenv("DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$v=strtolower((string)$c->query("select version()")->fetchColumn());if (($d==="mysql" && str_contains($v,"mariadb"))||($d==="mariadb" && !str_contains($v,"mariadb"))) exit(47);'
            fi
            printf 'P01_S5_ZIP_%s_NATIVE_ENGINE=PASS\n' "$engine"
            if php artisan test tests/Feature/TopicMarkdownWorkflowTest.php tests/Feature/TopicsModuleTest.php tests/Feature/TopicRecycleBinTest.php --no-ansi >"$RUNNER_TEMP/p01-zip-$engine.log" 2>&1; then
              printf 'P01_S5_ZIP_%s_LARAVEL=PASS\n' "$engine"
              grep -E 'Tests:|[0-9]+ assertions' "$RUNNER_TEMP/p01-zip-$engine.log" | tail -2 | cut -c 1-180 || true
            else
              printf 'P01_S5_ZIP_%s_LARAVEL=FAIL\n' "$engine"
              python3 - "$RUNNER_TEMP/p01-zip-$engine.log" <<'PY'
          import sys,pathlib,re
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for line in lines[-100:]:
              if re.search(r'FAIL|Error|Expected|Assertion|Tests:|SQLSTATE|Exception',line,re.I):
                  print('P01_S5_ZIP_SAFE_FAILURE='+line.strip()[:180])
          PY
              exit 1
            fi
          done
          test ! -e storage/app/private/vf-startnew/installed.json
          echo 'P01_S5_ZIP_THREE_NATIVE_ENGINES=PASS'
          echo 'P01_S5_ZIP_NO_OWNER_INSTALL=PASS'
      - name: Vue TS and Vite compile at same locked product source
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/p01-zip-npm.log" 2>&1; then
            echo 'P01_S5_ZIP_NPM=FAIL'; exit 1
          fi
          if ! npm run typecheck >"$RUNNER_TEMP/p01-zip-ts.log" 2>&1; then
            grep -E 'error TS|error:' "$RUNNER_TEMP/p01-zip-ts.log" | head -12 | cut -c 1-180 || true
            echo 'P01_S5_ZIP_TYPESCRIPT=FAIL'; exit 1
          fi
          echo 'P01_S5_ZIP_TYPESCRIPT=PASS'
          if ! npm run build >"$RUNNER_TEMP/p01-zip-vite.log" 2>&1; then
            echo 'P01_S5_ZIP_VITE=FAIL'; exit 1
          fi
          echo 'P01_S5_ZIP_VITE=PASS'
      - name: Always erase ephemeral private checkout and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-zip-"*".log"
          test ! -e private-src
          echo 'P01_S5_ZIP_PRIVATE_CLEANUP=PASS'
