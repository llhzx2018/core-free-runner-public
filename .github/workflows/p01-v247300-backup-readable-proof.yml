name: P01 V247300 backup page readability exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247300-backup-readable-proof.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 Owner screenshot fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: cea68d4295fbd2d17e4c5fda1cd5bc5f9a005b1e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout previous formal release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.299
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: PHP8.3 SQLite and Node runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Exact source and focused UX/backup regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = cea68d4295fbd2d17e4c5fda1cd5bc5f9a005b1e
          test "$(tr -d '\r\n ' < VERSION)" = 2.47.299
          php -l tests/unit/admin_backup_typography_readability_contract.php
          php tests/unit/admin_backup_typography_readability_contract.php
          php tests/unit/admin_data_safety_page8_polish_contract.php
          php tests/unit/backup_upgrade_retention_preview_v247298_contract.php
          node --check src/assets/data-recovery.js
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          echo P01_V247300_BACKUP_PAGE_FOCUSED=PASS
      - name: Canonical zero-debt against formal production source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_V247300_BACKUP_CANONICAL=PASS
