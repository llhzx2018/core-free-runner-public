name: P01 V2.35.0 Runtime Metadata Write

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-runtime-metadata-write-20260831.yml]

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 runtime metadata branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.0-runtime-metadata-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact base fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "792475f66e69fbfff37da3e21150c70342729e78"
          test "$(cat product/VERSION)" = "2.35.0"
          test "$(cat product/src/VERSION.txt)" = "2.34.0"
          grep -Fx "define('VF_VERSION', '2.34.0');" product/src/app/bootstrap.php >/dev/null
          echo P01_V2350_RUNTIME_METADATA_BASE=PASS

      - name: Close runtime version and candidate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2.35.0\n' > product/src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          b=Path('product/src/app/bootstrap.php')
          s=b.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.34.0');"
          new="define('VF_VERSION', '2.35.0');"
          assert s.count(old)==1
          b.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('product/VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P01'
          assert d['production_version']=='2.34.0'
          d['status']='V2.34.0 OWNER PRODUCTION / V2.35.0 RELEASE CANDIDATE'
          d['working_version']='2.35.0'
          d['target_release_version']='2.35.0'
          d['current_phase']='V2.35.0 FORMAL RELEASE CANDIDATE / PRODUCTION UNCHANGED'
          d['candidate_version']='2.35.0'
          d['candidate_schema_version']='2026082901'
          d['candidate_state']='CANDIDATE / FORMAL RELEASE GATE'
          d['formal_release_state']='V2.35.0 NOT YET PUBLISHED'
          d['current_authority']='Owner Production V2.34.0 / V2.35.0 Candidate Pending'
          d['next_action']='Run V2.35.0 Candidate Readiness and Formal Release Gate. Owner Production remains V2.34.0 until owner upgrade.'
          d['v2_35_tag_state']='NOT_CREATED'
          d['core_updates_v2_35_state']='NOT_PUBLISHED'
          d['current_change']={
            'change_id':'P01-V235-UXUI-CLOSURE-20260831',
            'base':'V2.34.0 OWNER PRODUCTION',
            'result':'RELEASE CANDIDATE / GATE PENDING',
            'product_develop_source':'cc2ee6e819e911021e7fb6e18b1f33e8a00443e0',
            'product_develop_tree':'fd722846bd280459466ab1650afc5f4958f6e934',
            'candidate_closure_source':'792475f66e69fbfff37da3e21150c70342729e78',
            'schema_change':False,
            'migration':None,
            'uxui_consistency':True,
            'drawer_hierarchy':True,
            'sidebar_productization':True,
            'feedback_semantics':True,
            'private_protected_state':True,
            'mobile_command_row':True,
            'desktop_bulkbar':True,
            'dark_watch_states':True,
            'topics_dark_tokens':True,
            'final_visual_sweep':{
              'run':33330543623,
              'artifact_id':9737517140,
              'digest':'sha256:ea032cdc1e43a912f2d8058670de904c2f2c265d3fcdbf802aeea263770a773d',
              'frames':20,
              'result':'PASS'
            }
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git -C product diff --check
          test "$(cat product/src/VERSION.txt)" = "2.35.0"
          grep -Fx "define('VF_VERSION', '2.35.0');" product/src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='2.34.0'
          assert d['working_version']=='2.35.0'
          assert d['target_release_version']=='2.35.0'
          assert d['candidate_version']=='2.35.0'
          assert d['v2_35_tag_state']=='NOT_CREATED'
          assert d['core_updates_v2_35_state']=='NOT_PUBLISHED'
          print('P01_V2350_RUNTIME_METADATA_AUTHORITY=PASS')
          PY

      - name: Commit runtime metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/VERSION.txt src/app/bootstrap.php VF_PROJECT.json
          test "$(git -C product diff --cached --name-only | sort)" = $'VF_PROJECT.json\nsrc/VERSION.txt\nsrc/app/bootstrap.php'
          git -C product commit -m 'chore(P01): close V2.35.0 runtime version authority'
          git -C product push origin HEAD:release/v2.35.0-runtime-metadata-20260831
          echo "P01_V2350_RUNTIME_METADATA_SOURCE=$(git -C product rev-parse HEAD)"
          echo "P01_V2350_RUNTIME_METADATA_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "P01_V2350_RUNTIME_TREE=$(git -C product rev-parse HEAD:src)"
          echo P01_V2350_RUNTIME_METADATA_WRITE=PASS
