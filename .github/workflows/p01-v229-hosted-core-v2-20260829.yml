name: P01 Hosted Core V2

on:
  push:
    branches:
      - task/p01-v229-hosted-core-v2-20260829

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-domain-taxonomy-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "dc5e649a04ef739e7f8df9b6f73c3aaeedd7f779"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/SurfaceRepository.php');s=p.read_text(encoding='utf-8')
          a="if (!in_array($sourceKind, ['remote_url','hosted_html'], true)) throw new InvalidArgumentException('资源来源无效。');"
          b=a+"\n        if ($sourceKind === 'hosted_html' && $surface !== 'topics') throw new InvalidArgumentException('上传 HTML 只适用于专题资源。');"
          assert s.count(a)==1 and "上传 HTML 只适用于专题资源" not in s
          s=s.replace(a,b,1)
          a="$sourceRef = vf_clean_text((string)($data['source_ref'] ?? ''), 240);"
          b=a+"\n        if ($surface !== 'topics') { $sourceKind = 'remote_url'; $sourceRef = ''; }"
          assert s.count(a)==1;s=s.replace(a,b,1)
          start=s.index('    public function recordOpen(int $linkId): string');end=s.rfind('\n}')
          lines=["    public function recordOpen(int $linkId): string","    {","        $linkId = max(1, $linkId);","        $stmt = $this->db->prepare(\"SELECT l.url,p.domain_key,p.source_kind FROM links l LEFT JOIN resource_domain_profiles p ON p.link_id=l.id WHERE l.id=? AND l.lifecycle_state='active'\");","        $stmt->execute([$linkId]);","        $row = $stmt->fetch(PDO::FETCH_ASSOC);","        if (!$row) throw new RuntimeException('资源不存在。');","        $target = (string)($row['url'] ?? '');","        if ((string)($row['domain_key'] ?? '') === 'topics' && (string)($row['source_kind'] ?? '') === 'hosted_html') {","            if (!(new VfResourceAssetStore($this->db))->htmlRecord($linkId)) throw new RuntimeException('专题 HTML 文件不存在，请重新上传。');","            $target = 'resource-html.php?id=' . $linkId;","        } elseif ($target === '' || preg_match('/[\\\\r\\\\n]/', $target) || !preg_match('#^https?://#i', $target)) {","            throw new RuntimeException('网址不存在或跳转目标无效。');","        }","        $now = gmdate('c');","        if ($this->tableExists('resource_domain_profiles')) {","            $update = $this->db->prepare('UPDATE resource_domain_profiles SET last_opened_at=?,updated_at=? WHERE link_id=?');","            $update->execute([$now, $now, $linkId]);","        }","        return $target;","    }",""]
          s=s[:start]+'\n'.join(lines)+s[end:];p.write_text(s,encoding='utf-8')
          p=Path('src/app/FunctionalWorkspaceCore.php');s=p.read_text(encoding='utf-8')
          old="return $admin ? 'surface-open.php?id=' . (int)$asset['id'] : vf_fw_h((string)$asset['url']);"
          new="\n".join(["$hosted = (string)($asset['surface'] ?? '') === 'topics' && (string)($asset['source_kind'] ?? '') === 'hosted_html' && trim((string)($asset['html_url'] ?? '')) !== '';","    if ($hosted) return $admin ? 'surface-open.php?id=' . (int)$asset['id'] : vf_fw_h((string)$asset['html_url']);","    return $admin ? 'surface-open.php?id=' . (int)$asset['id'] : vf_fw_h((string)$asset['url']);"])
          assert s.count(old)==1;s=s.replace(old,new,1);p.write_text(s,encoding='utf-8')
          PY
          php -l src/app/SurfaceRepository.php >/dev/null
          php -l src/app/FunctionalWorkspaceCore.php >/dev/null
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/SurfaceRepository.php src/app/FunctionalWorkspaceCore.php
          git commit -m 'P01 V2.29 · Route hosted HTML Topics safely'
          git push origin HEAD:feature/p01-domain-taxonomy-20260829
          echo P01_HOSTED_CORE_V2=PASS
