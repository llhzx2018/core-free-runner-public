name: P01 V2.37.2 Candidate Readiness
on:
  push:
    branches: [release/p01-v2372-hotfix-20260902]
    paths: [.github/workflows/p01-v2372-candidate-readiness-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 750b56958d935638791151b0d99d5e588fd92d95
      CANDIDATE_TREE: 7c5a7408b243d599c757068e0cd4a3bcb3abcf8e
      CANDIDATE_RUNTIME_TREE: 70b627513327aee0a37fae245b0f4042ad69b5a4
      HOTFIX: a63bba083dc6f2bde8c7692392afebb093b370a4
      MAIN: 2d429e08131311063fa9edf01b167d6617035fe2
      SOURCE: 0838e47ec49bb961131da81b0b314ebf77f1e126
      SOURCE_TREE: bd61c31288dce1e0bf7de28b6980cd075ebc0381
      SOURCE_RUNTIME_TREE: 37f3be264892224e2f3041564844c2aebd471064
      VERSION: 2.37.2
      SOURCE_VERSION: 2.37.1
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2372-candidate-artifacts
      EVID: /tmp/p01-v2372-candidate-evidence
      UPGRADE: /tmp/p01-v2372-upgrade
      FRESH: /tmp/p01-v2372-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2372-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Verify prior hotfix evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33595996317 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33596050361 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33596187097 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33596726377 --jq .conclusion)" = success
          printf 'DIAG_R1=HARNESS_ONLY\nDIAG_R2=PASS\nHOTFIX_GATE=PASS\nSTAGE=PASS\n' | tee "$EVID/prior-gates.txt"
      - name: Generate readiness gates
        run: python3 runner/scripts/p01_v2372_candidate_readiness_generate.py
      - name: Exact source fence
        run: bash /tmp/p01-v2372-generated/01-exact.sh
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2372-generated/02-build.sh
      - name: Actual V2.37.1 to V2.37.2 Atomic upgrade
        run: bash /tmp/p01-v2372-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2372-generated/04-fresh.sh
      - name: IYF mobile fallback contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD:src/app/ResourceCoverCache.php)" = c3312e1e504d041778ab579100a0eb9e07c30623
          test "$(git -C candidate rev-parse HEAD:src/assets/workspace.js)" = 8d881e4573bc2a33badca12ef2ee12fd4bcc91ee
          grep -F "mview.iyf.tv" candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F "https://www.iyf.tv" candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F 'vf-cover-retry:v3:' candidate/src/assets/workspace.js >/dev/null
          TOKEN='27Qr2mVwuzJ'
          M="https://mview.iyf.tv/play/${TOKEN}"
          W="https://www.iyf.tv/play/${TOKEN}"
          curl -fsSL --max-time 20 -A 'VF-Start/2.37.2 CoverCache' "$M" -o /tmp/iyf-m.html
          curl -fsSL --max-time 20 -A 'VF-Start/2.37.2 CoverCache' "$W" -o /tmp/iyf-w.html
          test "$(grep -oi 'og:image' /tmp/iyf-m.html | wc -l)" = 0
          test "$(grep -oi 'og:image' /tmp/iyf-w.html | wc -l)" -ge 1
          php -r "require 'candidate/src/app/ResourceCoverCache.php'; \$c=VfResourceCoverCache::extractCoverCandidates(file_get_contents('/tmp/iyf-w.html'),'$W'); if(!isset(\$c[0])||!str_contains(\$c[0],'static.iyf.tv')){var_export(\$c);exit(21);} echo \$c[0],PHP_EOL;" | tee "$EVID/iyf-first.txt"
          POSTER="$(tail -n1 "$EVID/iyf-first.txt")"
          curl -fsSL --max-time 20 -A 'VF-Start/2.37.2 CoverCache' "$POSTER" -o /tmp/iyf-poster.bin
          file --mime-type -b /tmp/iyf-poster.bin | grep -Eq '^image/(jpeg|png|webp|gif)$'
          printf 'HOTFIX_BLOBS_EXACT=PASS\nIYF_SAME_TOKEN=PASS\nIYF_POSTER_DOWNLOAD=PASS\n' | tee "$EVID/provider-contract.txt"
      - name: Final candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.2
          jq -e '.production_version=="2.37.1" and .published_release.version=="2.37.1" and .candidate_version=="2.37.2" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2372_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSOURCE=%s\nSCHEMA=%s\nATOMIC_2371_TO_2372=PASS\nFRESH_INSTALL=PASS\nIYF_SAME_TOKEN=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2372-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2372-candidate-artifacts
            /tmp/p01-v2372-candidate-evidence
          if-no-files-found: warn
          retention-days: 90
