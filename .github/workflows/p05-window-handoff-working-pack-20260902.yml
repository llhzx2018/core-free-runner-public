name: P05 Window Handoff Working Branch Pack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-window-handoff-working-pack-20260902.yml'

permissions:
  contents: read

jobs:
  pack:
    if: github.head_ref == 'test/p05-window-handoff-working-pack-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P05 working branch candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 36d8659168e711c1ca9cb664da172e2c4fa48d95
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p05-working

      - name: Build exact working snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05-working rev-parse HEAD)" = '36d8659168e711c1ca9cb664da172e2c4fa48d95'
          rm -rf /tmp/p05-working-handoff
          mkdir -p /tmp/p05-working-handoff/P05_WORKING_BRANCH_SNAPSHOT
          rsync -a --exclude='.git' p05-working/ /tmp/p05-working-handoff/P05_WORKING_BRANCH_SNAPSHOT/
          printf '%s\n' 'product/single-product-consolidation-phase1-20260902' > /tmp/p05-working-handoff/WORKING_BRANCH.txt
          printf '%s\n' '36d8659168e711c1ca9cb664da172e2c4fa48d95' > /tmp/p05-working-handoff/WORKING_BRANCH_EXACT_COMMIT.txt
          printf '%s\n' 'a778ff94cbe20c567d940bb77ac3f88c2e2fbd73' > /tmp/p05-working-handoff/WORKING_BRANCH_EXACT_TREE.txt
          (cd /tmp/p05-working-handoff && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          echo 'P05_HANDOFF_WORKING_BRANCH_PACK=PASS'
          echo 'P05_PRODUCT_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'

      - name: Upload exact working branch artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P05_WINDOW_HANDOFF_WORKING_36d86591
          path: /tmp/p05-working-handoff
          if-no-files-found: error
          retention-days: 7
