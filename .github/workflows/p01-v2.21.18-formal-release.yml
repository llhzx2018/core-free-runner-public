name: P01 V2.21.18 Formal Release
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['vf-agent/triggers/P01-V2.21.18-FORMAL-RELEASE.json']
permissions:
  contents: read
concurrency:
  group: p01-v2.21.18-formal-release
  cancel-in-progress: false
env:
  PRODUCT_REPO: llhzx2018/vf-start
  CORE_REPO: llhzx2018/core-updates
  CANDIDATE: a501d2394502319b0af9caaf1c171bdf94940a9d
  CANDIDATE_TREE: 6188bb34ed5f5175b2d96468f8f495ea0bd1b5ca
  PRODUCTION: 24c91ac9d76ac10780403bc2b326793c7c67c2ed
  DEVELOP_BEFORE: 13941632f8b11384cf0fd7c8d5469751bd2ba21d
  VERSION: 2.21.18
  SOURCE_VERSION: 2.21.17
  SCHEMA: 2026080902
  UPDATE_SHA: 7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425
  UPDATE_BYTES: '1052694'
  FULL_SHA: 0096a17f8aa2e11d353e8bb4ccbc4b879d2c450dd434d80c2abef7347109c76c
  FULL_BYTES: '482270'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Registered capability and formal gate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN";test -n "$WRITE_TOKEN"
          python3 - <<'PY'
          import json,urllib.request
          u='https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/vf-agent-operations-v1/vf-agent/results/P01-V2.21.18-FORMAL-ARTIFACT-GATE-V2.json'
          x=json.load(urllib.request.urlopen(u));assert x['pass'] is True and x['status']=='SUCCESS',x
          assert x['candidate_sha']=='a501d2394502319b0af9caaf1c171bdf94940a9d' and x['candidate_tree']=='6188bb34ed5f5175b2d96468f8f495ea0bd1b5ca',x
          assert x['production_sha']=='24c91ac9d76ac10780403bc2b326793c7c67c2ed',x
          a=x['artifacts'];assert a['VF_Start_V2.21.18_UPDATE.zip']['sha256']=='7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425' and a['VF_Start_V2.21.18_UPDATE.zip']['bytes']==1052694,a
          assert a['VF_Start_V2.21.18_FULL.zip']['sha256']=='0096a17f8aa2e11d353e8bb4ccbc4b879d2c450dd434d80c2abef7347109c76c' and a['VF_Start_V2.21.18_FULL.zip']['bytes']==482270,a
          PY
      - name: Checkout exact product authorities and runner builder
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://github.com/llhzx2018/core-free-runner-public.git runner
          git clone -q --branch candidate/v2.21.18-20260819 "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git clone -q --branch main "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" production
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE";test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$PRODUCTION"
          test "$(git -C production rev-parse origin/develop)" = "$DEVELOP_BEFORE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION";test "$(tr -d '\r\n' < candidate/src/VERSION.txt)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION";test "$(tr -d '\r\n' < production/src/VERSION.txt)" = "$SOURCE_VERSION"
      - name: Deterministically rebuild immutable release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p01-release";rm -rf "$OUT";mkdir -p "$OUT"
          python3 runner/scripts/p01-build-maintenance-candidate-v22118.py --candidate candidate/src --production production/src --out "$OUT" --candidate-commit "$CANDIDATE" --candidate-tree "$CANDIDATE_TREE" --production-commit "$PRODUCTION" >/tmp/build.json
          (cd "$OUT"&&sha256sum -c SHA256SUMS.txt >/dev/null)
          test "$(sha256sum "$OUT/VF_Start_V2.21.18_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA";test "$(stat -c '%s' "$OUT/VF_Start_V2.21.18_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$OUT/VF_Start_V2.21.18_FULL.zip"|awk '{print $1}')" = "$FULL_SHA";test "$(stat -c '%s' "$OUT/VF_Start_V2.21.18_FULL.zip")" = "$FULL_BYTES"
          docker run --rm -v "$OUT:/work:ro" -w /work php:8.0-cli php -l repair-v2.21.18.php >/dev/null
          php "$OUT/repair-v2.21.18.php" --self-test >/tmp/selftest.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/selftest.json'));assert x['ok'] is True and x['global_barrier'] is True and x['interruption_recovery'] is True,x
          PY
      - name: Pre-publication authority drift gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main|awk '{print $1}')" = "$PRODUCTION"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop|awk '{print $1}')" = "$DEVELOP_BEFORE"
          rm -rf core-old;git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/${CORE_REPO}.git" core-old
          python3 - <<'PY'
          import json
          x=json.load(open('core-old/projects/P01.json'));assert x['target_version']=='2.21.17' and x['release_tag']=='v2.21.17',x
          PY
          if gh release view "v$VERSION" --repo "$PRODUCT_REPO" >/dev/null 2>&1;then
            target=$(gh release view "v$VERSION" --repo "$PRODUCT_REPO" --json targetCommitish --jq .targetCommitish);test "$target" = "$CANDIDATE"
          fi
      - name: Publish immutable private GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/p01-release"
          if ! gh release view "v$VERSION" --repo "$PRODUCT_REPO" >/dev/null 2>&1;then
            gh release create "v$VERSION" \
              "$OUT/VF_Start_V2.21.18_UPDATE.zip" "$OUT/VF_Start_V2.21.18_ATOMIC.zip" "$OUT/VF_Start_V2.21.18_FULL.zip" "$OUT/VF_Start_V2.21.18_SOURCE.zip" \
              "$OUT/repair-v2.21.18.php" "$OUT/VF_Start_V2.21.18_RELEASE_NOTES.md" "$OUT/VF_Start_V2.21.18_RELEASE_MANIFEST.json" "$OUT/SHA256SUMS.txt" \
              --repo "$PRODUCT_REPO" --target "$CANDIDATE" --title "VF Start V2.21.18" \
              --notes "V2.21.17 → V2.21.18 maintenance release. Stabilizes manual navigation order, preserves category context across Public/Private scope switches, cache-busts the updated runtime loader, and retains Schema 2026080902 with Browser Helper 1.6.4 unchanged."
          fi
          gh release view "v$VERSION" --repo "$PRODUCT_REPO" --json databaseId,tagName,targetCommitish,isDraft,isPrerelease,publishedAt > /tmp/release.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/release.json'));assert x['tagName']=='v2.21.18' and x['targetCommitish']=='a501d2394502319b0af9caaf1c171bdf94940a9d' and not x['isDraft'] and not x['isPrerelease'],x
          assert int(x['databaseId'])>0,x
          PY
          rm -rf /tmp/release-readback;mkdir /tmp/release-readback
          gh release download "v$VERSION" --repo "$PRODUCT_REPO" --dir /tmp/release-readback --pattern 'VF_Start_V2.21.18_UPDATE.zip' --pattern 'VF_Start_V2.21.18_FULL.zip'
          test "$(sha256sum /tmp/release-readback/VF_Start_V2.21.18_UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA";test "$(stat -c '%s' /tmp/release-readback/VF_Start_V2.21.18_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum /tmp/release-readback/VF_Start_V2.21.18_FULL.zip|awk '{print $1}')" = "$FULL_SHA";test "$(stat -c '%s' /tmp/release-readback/VF_Start_V2.21.18_FULL.zip)" = "$FULL_BYTES"
      - name: Promote Working Truth to exact released candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          current=$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop|awk '{print $1}');test "$current" = "$DEVELOP_BEFORE"
          git -C candidate remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git -C candidate push -q origin "$CANDIDATE:refs/heads/develop"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop|awk '{print $1}')" = "$CANDIDATE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main|awk '{print $1}')" = "$PRODUCTION"
      - name: Publish core-updates P01 2.21.18 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASE_ID=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["databaseId"])')
          RELEASED_AT=$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["publishedAt"])')
          rm -rf core;git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${CORE_REPO}.git" core
          python3 - "$RELEASE_ID" "$RELEASED_AT" <<'PY'
          import json,sys
          p='core/projects/P01.json';x=json.load(open(p));assert x['target_version']=='2.21.17' and x['release_tag']=='v2.21.17',x
          x.update({'schema_version':'1.0','project_id':'P01','component_id':'APP','enabled':True,'target_version':'2.21.18','update_type':'ATOMIC','from_versions':['2.21.17'],'schema_from':'2026080902','schema_to':'2026080902','repository':'llhzx2018/vf-start','release_tag':'v2.21.18','asset_name':'VF_Start_V2.21.18_UPDATE.zip','asset_bytes':1052694,'asset_sha256':'7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425','release_id':int(sys.argv[1]),'release_identity':'v2.21.18@a501d2394502319b0af9caaf1c171bdf94940a9d','backup_required':True,'rollback_supported':True,'released_at':sys.argv[2],'minimum_php':'8.0.0'})
          open(p,'w').write(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
          git -C core config user.name VictorForge;git -C core config user.email llhzx2018@gmail.com;git -C core add projects/P01.json;git -C core commit -q -m 'release(P01): publish VF Start V2.21.18';git -C core push -q origin main
          git -C core rev-parse HEAD >/tmp/core-updates-sha
      - name: Online discovery and package preparation E2E from exact 2.21.17
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq;sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          rm -rf /tmp/p01-online;cp -a production/src /tmp/p01-online
          php -S 127.0.0.1:18218 -t /tmp/p01-online >/tmp/online.log 2>&1 & echo $! >/tmp/online.pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/online.c http://127.0.0.1:18218/setup.php -o /tmp/online.s&&break||sleep 1;done
          csrf=$(python3 - <<'PY'
          import re
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/online.s').read()).group(1))
          PY
          )
          curl -fsSL -b /tmp/online.c -c /tmp/online.c -X POST http://127.0.0.1:18218/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=VF Start Online Gate' --data-urlencode 'admin_password=Online-P01-22117!Strong' --data-urlencode 'admin_password_confirm=Online-P01-22117!Strong' >/dev/null
          VF_PRIVATE_READ_TOKEN="$READ_TOKEN" php -r 'require "/tmp/p01-online/app/bootstrap.php";$m=new VfUpdateManager(vf_db());$r=$m->check(true);if(empty($r["ok"])||$r["current_version"]!=="2.21.17"||$r["latest_version"]!=="2.21.18"||empty($r["available"])||empty($r["can_update"]))throw new Exception(json_encode($r));$p=$m->prepare();if(empty($p["ok"])||$p["from_version"]!=="2.21.17"||$p["to_version"]!=="2.21.18"||$p["update_package_sha256"]!=="7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425"||(int)$p["update_package_bytes"]!==1052694)throw new Exception(json_encode($p));echo json_encode(["check"=>$r,"prepare"=>$p],JSON_UNESCAPED_SLASHES);' >/tmp/online-e2e.json
          kill "$(cat /tmp/online.pid)" 2>/dev/null||true
      - name: Final remote readback and publish release evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,urllib.request,time,os,base64,urllib.error
          url='https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P01.json';x=None
          for _ in range(12):
            try:
              x=json.load(urllib.request.urlopen(url+'?t='+str(time.time()),timeout=10))
              if x.get('target_version')=='2.21.18':break
            except:pass
            time.sleep(2)
          assert x and x['target_version']=='2.21.18' and x['from_versions']==['2.21.17'],x
          assert x['asset_sha256']=='7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425' and x['asset_bytes']==1052694,x
          rel=json.load(open('/tmp/release.json'));online=json.load(open('/tmp/online-e2e.json'))
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.18','source_version':'2.21.17','gate':'FORMAL_RELEASE_AND_ONLINE_CHANNEL','status':'SUCCESS','pass':True,'candidate_sha':'a501d2394502319b0af9caaf1c171bdf94940a9d','candidate_tree':'6188bb34ed5f5175b2d96468f8f495ea0bd1b5ca','production_main_sha':'24c91ac9d76ac10780403bc2b326793c7c67c2ed','develop_sha':'a501d2394502319b0af9caaf1c171bdf94940a9d','schema_version':'2026080902','release_id':int(rel['databaseId']),'release_tag':'v2.21.18','release_target':rel['targetCommitish'],'update_asset':{'name':'VF_Start_V2.21.18_UPDATE.zip','bytes':1052694,'sha256':'7890e1c0dfad88e87e88f572b9f9c7a6076f5b8f109cf1824ff967c387628425'},'full_asset':{'name':'VF_Start_V2.21.18_FULL.zip','bytes':482270,'sha256':'0096a17f8aa2e11d353e8bb4ccbc4b879d2c450dd434d80c2abef7347109c76c'},'core_updates_sha':open('/tmp/core-updates-sha').read().strip(),'core_updates_target':'2.21.18','online_discovery':{'current_version':online['check']['current_version'],'latest_version':online['check']['latest_version'],'available':online['check']['available'],'can_update':online['check']['can_update'],'prepare_ok':online['prepare']['ok'],'backup_recovery_key_created':bool(online['prepare'].get('recovery_key'))},'production_upgrade_executed':False,'private_data_persisted_publicly':False,'workflow_run_id':os.environ.get('GITHUB_RUN_ID','')}
          t=os.environ['WRITE_TOKEN'];path='vf-agent/results/P01-V2.21.18-FORMAL-RELEASE-ONLINE.json';api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/'+path;h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as r:sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          body={'message':'evidence(P01): seal V2.21.18 formal release and online channel','content':base64.b64encode((json.dumps(q,indent=2,sort_keys=True)+'\n').encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:body['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/online.pid ]&&kill "$(cat /tmp/online.pid)" 2>/dev/null||true
          rm -rf candidate production core core-old /tmp/p01-online /tmp/release-readback "$RUNNER_TEMP/p01-release" || true
