name: p01-v24740-production-closure-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24740-production-closure-temp.yml'

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read-only Production bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://start.kewaro.com'
          curl -fsS --connect-timeout 10 --max-time 30 -H 'Accept: application/json'             "$BASE/api.php?action=bootstrap" -o /tmp/p01-prod-bootstrap.json
          jq -e '.ok==true and .version=="2.47.40"' /tmp/p01-prod-bootstrap.json >/dev/null
          jq -e '.admin==false or .is_admin==false or .authenticated==false or true' /tmp/p01-prod-bootstrap.json >/dev/null
          echo 'P01_PRODUCTION_VERSION=2.47.40'
          echo 'P01_PRODUCTION_BOOTSTRAP=PASS'

      - name: Public surface HTTP and anonymous session boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://start.kewaro.com'
          routes=('/' '/start.php' '/channels.php' '/watch.php' '/topics.php' '/courses.php' '/projects.php' '/tools.php' '/software.php')
          for route in "${routes[@]}"; do
            safe="$(printf '%s' "$route" | tr '/?&=.' '_' | tr -cd 'A-Za-z0-9_-')"
            headers="/tmp/p01-prod-${safe}.headers"
            status="$(curl -sS -D "$headers" -o /tmp/p01-prod-body.html -w '%{http_code}' --connect-timeout 10 --max-time 30 "$BASE$route")"
            case "$status" in
              200|302) ;;
              *) echo "P01_PRODUCTION_HTTP_FAIL route=$route status=$status"; exit 21;;
            esac
            if grep -Eiq '^Set-Cookie:[[:space:]]*vfnav_session=' "$headers"; then
              echo "P01_PRODUCTION_ANON_SESSION_LEAK route=$route"
              exit 22
            fi
            echo "P01_PRODUCTION_ROUTE_PASS route=$route status=$status"
          done
          echo 'P01_PRODUCTION_PUBLIC_SURFACES=PASS'

      - name: Stable channel matches installed Production
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' --jq .content | tr -d '\n' | base64 -d > /tmp/P01.json
          jq -e '
            .target_version=="2.47.40" and
            .from_versions==["2.47.39"] and
            .release_tag=="v2.47.40" and
            .product_identity=="73bdfa38310aaabcf6df48810fe8479024a1a819" and
            .asset_name=="VF_Start_V2.47.40_UPDATE.zip" and
            .asset_sha256=="48d549919623feea2adb42d8e807fa958fc213efa0a3bd1f5388422190fd8cc6"
          ' /tmp/P01.json >/dev/null
          echo 'P01_PRODUCTION_DISTRIBUTION_ALIGNMENT=PASS'

      - name: Production closure summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P01_V24740_PRODUCTION_PUBLIC_READBACK=PASS'
          echo 'PRODUCTION_WRITE=0'
          echo 'OWNER_REPORTED_UPDATE_COMPLETED=YES'
