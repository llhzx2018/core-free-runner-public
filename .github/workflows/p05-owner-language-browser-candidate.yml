name: P05 Owner Language Browser Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-owner-language-browser-candidate.yml'

permissions:
  contents: read

jobs:
  exact-owner-language-browser:
    if: github.event.pull_request.head.ref == 'test/p05-owner-language-browser-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 8e672d1e5685a665e9db6f798e74c614514e9c42
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and presentation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '8e672d1e5685a665e9db6f798e74c614514e9c42'
          test "$(git rev-parse HEAD^{tree})" = 'ffece47e95c28e9b4da3b2c1f373795da8d07d32'
          test "$(cat VERSION)" = '1.2.3'
          grep -Fq '刷新数据状态' src/client/ProductSiteViews.tsx
          grep -Fq '最近可用数据' src/client/ProductSiteViews.tsx
          grep -Fq '重新运行网站检查' src/client/ProductSiteViews.tsx
          grep -Fq "providerRecovery !== 'READY'" src/client/ProductSiteViews.tsx
          grep -Fq "auditCapability !== 'READY'" src/client/ProductSiteViews.tsx
          echo 'P05_OWNER_LANGUAGE_EXACT_SOURCE=PASS'

      - name: Setup Node 24 and build
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Focused truth and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --experimental-strip-types --test tests/unit/product-data-source-capability-truth.test.ts tests/unit/product-audit-capability-rerun-truth.test.ts tests/unit/product-audit-page-evidence-drilldown-truth.test.ts
          npm run typecheck
          npm run build

      - name: Browser verify Owner language on Data Sources and Site Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='OwnerLanguagePass-2026!' npm run bootstrap:admin
          PORT=18192 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-owner-language-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, shutil, subprocess, sys, time, urllib.request, urllib.error
          BASE='http://127.0.0.1:18192'; DRIVER_PORT=9519; PASSWORD='OwnerLanguagePass-2026!'
          def fail(msg): print('P05_OWNER_LANGUAGE_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(method,url,payload=None,headers=None,timeout=25):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers or {})
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read().decode()
              except urllib.error.HTTPError as e: fail(f'http {e.code} {url}: {e.read().decode(errors="replace")[:500]}')
              return json.loads(raw) if raw else {}
          def wait_http(url,timeout=25):
              end=time.time()+timeout
              while time.time()<end:
                  try:
                      with urllib.request.urlopen(url,timeout=1) as r:
                          if r.status<500:return
                  except Exception: time.sleep(.15)
              fail('server not ready '+url)
          def wd(method,path,payload=None):
              r=http(method,f'http://127.0.0.1:{DRIVER_PORT}{path}',payload); v=r.get('value')
              if isinstance(v,dict) and v.get('error'): fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          def sv(s,m,p,payload=None): return wd(m,f'/session/{s}{p}',payload)['value']
          def eid(v): return v['element-6066-11e4-a52e-4f735466cecf']
          def find(s,css): return eid(sv(s,'POST','/element',{'using':'css selector','value':css}))
          def text(s,e): return str(sv(s,'GET',f'/element/{e}/text'))
          def body(s): return text(s,find(s,'body'))
          def send(s,e,value):
              sv(s,'POST',f'/element/{e}/clear',{})
              sv(s,'POST',f'/element/{e}/value',{'text':value,'value':list(value)})
          def execute(s,script): return sv(s,'POST','/execute/sync',{'script':script,'args':[]})
          def wait(pred,label,timeout=25):
              end=time.time()+timeout; last=None
              while time.time()<end:
                  try:
                      last=pred()
                      if last:return last
                  except Exception as e:last=repr(e)
                  time.sleep(.15)
              fail(f'timeout {label}: {last!r}')
          def has(s,x): return x in body(s)
          def click_text(s,label):
              js='''const label=%s;const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()===label);if(!b||b.disabled)return false;b.click();return true;''' % json.dumps(label,ensure_ascii=False)
              return bool(execute(s,js))
          def assert_terms(surface,text_value,required,forbidden):
              missing=[x for x in required if x not in text_value]
              leaked=[x for x in forbidden if x in text_value]
              if missing: fail(surface+' missing '+json.dumps(missing,ensure_ascii=False))
              if leaked: fail(surface+' leaked '+json.dumps(leaked,ensure_ascii=False))
              print('P05_OWNER_LANGUAGE_'+surface+'=PASS')
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome: fail('Chrome/ChromeDriver unavailable')
          log=open('/tmp/p05-owner-language-chromedriver.log','wb')
          proc=subprocess.Popen([driver,f'--port={DRIVER_PORT}','--allowed-ips=127.0.0.1'],stdout=log,stderr=subprocess.STDOUT)
          session=None
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DRIVER_PORT}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              v=r['value']; session=str(v.get('sessionId') or r.get('sessionId') or '')
              if not session: fail('missing webdriver session')
              sv(session,'POST','/url',{'url':BASE+'/'})
              wait(lambda: execute(session,"return !!document.querySelector(\"input[autocomplete='username']\")"),'login form')
              send(session,find(session,"input[autocomplete='username']"),'owner')
              send(session,find(session,"input[autocomplete='current-password']"),PASSWORD)
              click_text(session,'登录') or fail('login button missing')
              wait(lambda: has(session,'Site Portfolio'),'portfolio')
              wait(lambda: '载入 Demo Dataset →' in body(session),'demo load action')
              click_text(session,'载入 Demo Dataset →') or fail('demo load button missing')
              wait(lambda: has(session,'Kewaro Guide') and has(session,'WordPress Lab'),'demo sites',30)
              click_text(session,'数据源') or fail('Data Sources nav unavailable')
              wait(lambda: has(session,'数据源决定其他结论能不能信'),'Data Sources surface')
              ds=body(session)
              assert_terms('DATA_SOURCES',ds,
                  ['数据源决定其他结论能不能信','刷新数据状态','最近可用数据','最近同步','计划重试','建议动作'],
                  ['Runtime capability','Provider Recovery','Provider Worker','OAuth Fixture','FIXTURE_ONLY','OPTIONAL_NODE','Production-ready','Data Source ID','Raw state','Owner action','TRUTH QUALITY'])
              click_text(session,'网站检查') or fail('Site Audit nav unavailable')
              wait(lambda: has(session,'先修根问题，再看受影响页面'),'Site Audit surface')
              audit=body(session)
              assert_terms('SITE_AUDIT',audit,
                  ['网站健康度','严重问题','开放问题','优先修复','先修根问题，再看受影响页面','重新运行网站检查'],
                  ['Audit Crawler','OPTIONAL_NODE','当前 Runtime','FIX FIRST','Site Health'])
              print('P05_OWNER_LANGUAGE_BROWSER=PASS')
          finally:
              if session:
                  try: wd('DELETE',f'/session/{session}')
                  except Exception: pass
              proc.terminate()
              try: proc.wait(timeout=5)
              except Exception: proc.kill()
              log.close()
          PY

      - name: Read-only exact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '8e672d1e5685a665e9db6f798e74c614514e9c42'
          test "$(git rev-parse HEAD^{tree})" = 'ffece47e95c28e9b4da3b2c1f373795da8d07d32'
          test -z "$(git status --porcelain)"
          echo 'P05_PRODUCT_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
