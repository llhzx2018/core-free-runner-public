name: TEMP P07 M04 M05 actual installed use
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m04-m05-installed-use-temporary.yml']
permissions:
  contents: read
jobs:
  m05-installed:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-m04-m05-installed-use-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: 5734f7e26abf23dd0e85e9970f2c3dbd2a298367
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5734f7e26abf23dd0e85e9970f2c3dbd2a298367
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m05-source
      - name: Build and install exact candidate and use real installed terminal
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd m05-source
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = 4415fb5f3dde304b2d963d60e204bd31bd4d061f
          test -z "$(git status --porcelain)"
          test ! -e /opt/vfops-modules/m05
          work=$(mktemp -d "$RUNNER_TEMP/p07-m05-actual.XXXXXX")
          printf '%s\n' "$work" > "$RUNNER_TEMP/p07-m05-owned-$GITHUB_RUN_ID"
          python3 -B scripts/build_p07_m05_bundle.py --output "$work/m05.zip" > "$work/build.log"
          digest=$(sha256sum "$work/m05.zip" | cut -d' ' -f1)
          sudo -n python3 -B scripts/install_p07_m05_bundle.py --archive "$work/m05.zip" --sha256 "$digest" > "$work/install.log"
          root=/opt/vfops-modules/m05/current
          test "$(sudo -n git hash-object "$root/bin/vfops-init-ui")" = 87b54071463d773969a114076545c4011a3d078b
          sudo -n bash "$root/bin/vfops-init-entry" --version
          echo "P07_M05_EXACT_SOURCE=$SOURCE; DEV_ZIP_SHA256=$digest; ACTUAL_INSTALL=PASS"
          sudo -n sha256sum /etc/fstab /etc/passwd /var/lib/dpkg/status > "$work/before"
          sudo -n python3 -B "$root/lib/m05_environment_guard.py" --inspect > "$work/guard.json"
          state=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1]));assert d["read_only"] and not d["destructive_actions"];print(d["status"])' "$work/guard.json")
          echo "P07_M05_REAL_HOST_GUARD=$state"
          for width in 40 80; do
            printf '0\n' | sudo -n script -qfec "stty cols $width rows 24; env NO_COLOR=1 TERM=dumb bash '$root/bin/vfops-init-entry'" "$work/menu-$width.tty" > "$work/menu-$width.log" 2>&1
            grep -Fq '请选择 [0-2]' "$work/menu-$width.log"
            echo "P07_M05_INSTALLED_MENU_RETURN_$width=PASS"
          done
          if [[ "$state" != CLEAN ]]; then
            set +e
            sudo -n bash "$root/bin/vfops-init-core" server-migrate target-status --bootstrap-preflight > "$work/preflight.log" 2>&1
            rc=$?
            set -e
            test "$rc" = 13
            grep -Eq 'P07_M05_HOST_OCCUPIED|P07_M05_HOST_UNVERIFIED' "$work/preflight.log"
            echo P07_M05_REAL_OCCUPIED_OR_UNVERIFIED_REFUSAL=PASS
          fi
          echo P07_M05_REAL_CLEAN_HOST_CLOUDPANEL_INSTALL=NOT_RUN
          sudo -n sha256sum -c "$work/before" >/dev/null
          echo P07_M05_HOST_CONFIG_AND_DPKG_UNCHANGED=PASS
      - name: Always clean candidate and private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          f="$RUNNER_TEMP/p07-m05-owned-$GITHUB_RUN_ID"
          if [[ -f "$f" && ! -L "$f" ]]; then
            read -r work < "$f"
            [[ "$work" == "$RUNNER_TEMP"/p07-m05-actual.* && -d "$work" && ! -L "$work" ]]
            if [[ -L /opt/vfops-modules/m05/current ]]; then
              test "$(readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-ux16-runtime-identity-catalog
              sudo -n rm -rf -- /opt/vfops-modules/m05
            fi
            sudo -n rm -rf -- "$work"
            test ! -e "$work"
            rm -- "$f"
          fi
          test ! -e /opt/vfops-modules/m05
          p="$GITHUB_WORKSPACE/m05-source"
          [[ ! -L "$p" ]]
          rm -rf -- "$p"
          test ! -e "$p"
          echo P07_M05_OWNED_CANDIDATE_PRIVATE_CHECKOUT_CLEANUP=PASS
