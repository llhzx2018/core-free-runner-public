name: P02 Daily UX Flow R2 Final Readonly

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-daily-ux-flow-final-r2.yml'

permissions:
  contents: read

jobs:
  final-readonly-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REF: 08cc096e7293579e0fc7f6de3965759e10ceb4ec
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require private read capability
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Final exact-source verification
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.30'
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          node tests/unit/p02_daily_ux_micro_refinement.mjs
          node tests/unit/p02_daily_ux_flow_refinement.mjs
          grep -F 'p02_daily_ux_flow_refinement.mjs' .github/workflows/repository-health.yml
          git diff --check
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))['runtime_source_file_count'])
          PY
          )" = '82'
          cp SOURCE_MANIFEST.json /tmp/source-manifest.json
          cp SOURCE_MANIFEST.txt /tmp/source-manifest.txt
          python3 scripts/generate-source-manifest.py
          cmp /tmp/source-manifest.json SOURCE_MANIFEST.json
          cmp /tmp/source-manifest.txt SOURCE_MANIFEST.txt
          test -z "$(git status --porcelain)"
          echo SOURCE_MANIFEST_JSON_REGEN_IDENTITY=PASS
          echo SOURCE_MANIFEST_TXT_REGEN_IDENTITY=PASS
          echo P02_DAILY_UX_FLOW_REFINEMENT_FINAL_GATE=PASS

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo PRODUCT_WRITE=NO
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo TAG_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
