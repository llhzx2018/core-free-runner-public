name: p01-system-health-owner-ui-oneoff
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-system-health-owner-oneoff.yml'
permissions:
  contents: read
concurrency:
  group: p01-system-health-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-and-health-ui:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      P01_SHA: 26239d249deeb85b97aabe2f6a7dbcbee5f087eb
    steps:
      - name: Checkout public disposable control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision native PHP and SQLite extensions
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          echo P01_SYSTEM_HEALTH_NATIVE_RUNTIME=PASS
      - name: Checkout exact private P01 UI candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 26239d249deeb85b97aabe2f6a7dbcbee5f087eb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout prior formal source without private persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.385
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
          fetch-depth: 1
      - name: Validate owner-view HTML JS and maintenance guard in real Node VM
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$P01_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = 2.47.385
          php -l candidate/src/system-health.php
          node --check candidate/src/assets/system.js
          node --check candidate/tests/browser/system_health_owner_ui_smoke.cjs
          node candidate/tests/browser/system_health_owner_ui_smoke.cjs
          php candidate/tests/unit/system_health_manual_refresh_v247282_contract.php
          echo P01_SYSTEM_HEALTH_EXACT_OWNER_UI=PASS
      - name: Canonical unit delta against current stable release
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-system-health-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-system-health-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-system-health-canonical.txt
          echo P01_SYSTEM_HEALTH_CANONICAL_ZERO_DEBT=PASS
      - name: Remove private exact source and fixtures
        if: always()
        shell: bash
        run: rm -rf candidate stable
