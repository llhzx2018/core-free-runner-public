name: S01 Theme Maintenance Topline R17 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c01-maintenance-topline-r17-gate-20260925.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-c01-maintenance-topline-r17-gate-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      THEME_SHA: ff657ef11068237b5c63b86e6a33e51bdb9e0105
    steps:
      - name: Checkout exact Theme candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Exact source and R17 contract
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "1.35.43"
          php -l tests/s01-c01-admin-shell-alignment-r1-contract.php
          php tests/s01-c01-admin-shell-alignment-r1-contract.php
          grep -Fq 'R17 · Maintenance trigger top-line reset' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'border-top:0!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'border-block-start:0!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'outline:0!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq 'outline-offset:0!important' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq '.vf-theme-maintenance-menu::before' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq '.vf-theme-maintenance-menu>summary::before' src/assets/css/admin/admin-s01-shell-header-final-r12.css
          grep -Fq '.vf-theme-maintenance-menu.is-current>summary::after' src/assets/css/admin/admin-s01-shell-header-final-r12.css

      - name: Adjacent Header regression
        working-directory: theme
        run: |
          set -Eeuo pipefail
          php tests/visible-console-v2-contract.php
          php tests/final-admin-human-closure-contract.php
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
