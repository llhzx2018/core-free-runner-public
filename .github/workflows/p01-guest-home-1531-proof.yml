name: P01 guest-home exact-source UX proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-guest-home-1531-proof.yml'
permissions:
  contents: read
jobs:
  guest-home:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact P01 candidate in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5409364451818b7e4215a8dfc6bb158404387609
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Configure native PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Verify exact head and PHP template syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "5409364451818b7e4215a8dfc6bb158404387609"
          php -l src/index.php
          php -l tests/integration/p01_public_home_layout_acceptance.php
          node --check src/assets/surface-home.js
          echo P01_GUEST_HOME_SOURCE_LINT=PASS
      - name: Focused guest homepage layout/privacy regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/p01_public_home_layout_acceptance.php
          php tests/integration/p01_content_first_shell_acceptance.php
          echo P01_GUEST_HOME_FOCUSED_CONTRACT=PASS
      - name: Ensure unchanged authority and candidate-only version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\\r\\n ' < VERSION)" = '2.47.390'
          test "$(tr -d '\\r\\n ' < src/VERSION.txt)" = '2.47.390'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/index.php').read_text()
          css=Path('src/assets/uxui-home-root.css').read_text()
          assert 'if (vf_is_admin()) { require __DIR__ . \'/home.php\'; exit; }' in s
          assert s.count('class="vf-public-home-path"')==3
          assert 'vf-public-home-dashboard' not in s
          assert 'vf-public-home-quick' not in s
          assert 'vf-public-home-more' in s
          assert css.count('{')==css.count('}')
          assert '.vf-public-home .vf-public-home-paths' in css
          print('P01_GUEST_HOME_SCOPE_GUARD=PASS')
          PY
