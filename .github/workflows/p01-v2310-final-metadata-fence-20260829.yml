name: P01 V2.31.0 Final Metadata Fence
on:
  push:
    branches: [task/p01-v2310-final-candidate-gate-20260829]
    paths: [.github/workflows/p01-v2310-final-metadata-fence-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT: ${{ github.workspace }}/product
      EVID: /tmp/p01-v2310-final-metadata-evidence
      DOCS_HEAD: 4d6e3e8cfbeeb451a7d428e5e2ee2ce17954a887
      DOCS_TREE: f568820198afde57fe3c1522820f45bbbf6e0c96
      PRODUCT_SOURCE: d541b7bb18d40705ec03f951fad3ed661aa11991
      MAIN_SOURCE: 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 4d6e3e8cfbeeb451a7d428e5e2ee2ce17954a887
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact docs-bound source and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          cd "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$DOCS_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$DOCS_TREE"
          test "$(git rev-parse origin/main)" = "$MAIN_SOURCE"
          git diff --name-only "$PRODUCT_SOURCE"...HEAD | sort >"$EVID/actual-docs-diff.txt"
          cat >"$EVID/expected-docs-diff.txt" <<'EOF'
          CHANGELOG.md
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.31.0_CANDIDATE_READINESS_20260829.md
          docs/handoff/CURRENT_STATE.md
          EOF
          sort -o "$EVID/expected-docs-diff.txt" "$EVID/expected-docs-diff.txt"
          diff -u "$EVID/expected-docs-diff.txt" "$EVID/actual-docs-diff.txt"
          test -z "$(git diff --name-only "$PRODUCT_SOURCE"...HEAD -- src/)"
          printf '%s\n' 'P01_V2310_DOCS_HEAD=PASS' 'P01_V2310_DOCS_ONLY_SCOPE=PASS' 'P01_V2310_PRODUCT_BYTES_UNCHANGED_AFTER_GATE=PASS' 'P01_V2310_MAIN_STILL_V230=PASS' | tee "$EVID/scope.txt"
      - name: Candidate identity and authority consistency
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PRODUCT"
          test "$(tr -d '\r\n' < VERSION)" = 2.31.0
          test "$(tr -d '\r\n' < src/VERSION.txt)" = 2.31.0
          grep -Fx "define('VF_VERSION', '2.31.0');" src/app/bootstrap.php >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          python3 -m json.tool VF_PROJECT.json >"$EVID/vf-project.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('VF_PROJECT.json').read_text())
          assert p['production_version']=='2.30.0'
          assert p['working_version']=='2.31.0'
          assert p['target_release_version']=='2.31.0'
          assert p['schema_version']=='2026082901'
          assert p['working_schema_version']=='2026082901'
          assert p['candidate_state']=='PASS / READY_FOR_L3_RELEASE_GATE'
          assert p['formal_release_state']=='NOT_STARTED'
          assert p['v2_31_tag_state']=='ABSENT'
          assert p['core_updates_v2_31_state']=='NOT_PUBLISHED'
          assert p['current_change']['candidate_product_exact_source']=='d541b7bb18d40705ec03f951fad3ed661aa11991'
          assert p['current_change']['candidate_product_exact_tree']=='7e5eaed15187f48686ae3eb67ff91a63085ca003'
          assert p['current_change']['gates']['candidate_readiness_v2']==33239989166
          assert p['current_change']['candidate_readiness_artifact']['id']==9711050672
          PY
          grep -F 'V2.30.0 OWNER PRODUCTION / V2.31.0 CANDIDATE READY_FOR_L3' docs/authority/CURRENT.md >/dev/null
          grep -F 'V2.30.0 OWNER PRODUCTION / V2.31.0 CANDIDATE READY_FOR_L3' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F 'Public Runner: 33239989166' docs/evidence/P01_V2.31.0_CANDIDATE_READINESS_20260829.md >/dev/null
          grep -F 'V2.31 READY_FOR_L3_RELEASE_GATE: YES' docs/evidence/P01_V2.31.0_CANDIDATE_READINESS_20260829.md >/dev/null
          head -n 1 CHANGELOG.md | grep -Fx '## V2.31.0 · Candidate / Not Released · 2026-08-29'
          grep -F '## V2.30.0 · Formal Release · 2026-08-29' CHANGELOG.md >/dev/null
          ! git show-ref --verify --quiet refs/tags/v2.31.0
          printf '%s\n' 'P01_V2310_VERSION_TRIPLE_BINDING=PASS' 'P01_V2310_AUTHORITY_DOCS=PASS' 'P01_V2310_PROJECT_REGISTRY=PASS' 'P01_V2310_CHANGELOG=PASS' 'P01_V2310_TAG_ABSENT=PASS' | tee "$EVID/authority.txt"
      - name: Final verdict
        shell: bash
        run: |
          cat >"$EVID/verdict.txt" <<'EOF'
          P01_V2310_PRODUCT_EXACT_SOURCE=d541b7bb18d40705ec03f951fad3ed661aa11991
          P01_V2310_PRODUCT_EXACT_TREE=7e5eaed15187f48686ae3eb67ff91a63085ca003
          P01_V2310_DOCS_BOUND_SOURCE=4d6e3e8cfbeeb451a7d428e5e2ee2ce17954a887
          P01_V2310_DOCS_BOUND_TREE=f568820198afde57fe3c1522820f45bbbf6e0c96
          P01_V2310_CANDIDATE_READINESS_RUN=33239989166
          P01_V2310_CANDIDATE_STATUS=READY_FOR_L3_RELEASE_GATE
          P01_V2310_SCHEMA=2026082901
          V231_TAG=ABSENT
          V231_GITHUB_RELEASE=NOT_STARTED
          V231_CORE_UPDATES=NOT_PUBLISHED
          OWNER_PRODUCTION=V2.30.0_UNCHANGED
          OWNER_PRODUCTION_WRITE=NO
          FINAL_METADATA_FENCE=PASS
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2310-final-metadata-evidence-${{ github.run_id }}
          path: /tmp/p01-v2310-final-metadata-evidence
          if-no-files-found: warn
          retention-days: 30
