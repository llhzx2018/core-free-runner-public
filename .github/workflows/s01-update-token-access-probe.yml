name: S01 Update Token Access Probe

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe safe HTTP access matrix
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local token="$1" url="$2"
            curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $token" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$url" || true
          }
          for name in PRIVATE RELEASE; do
            if [ "$name" = PRIVATE ]; then T="$VF_PRIVATE_READ_TOKEN"; else T="$VF_RELEASE_WRITE_TOKEN"; fi
            test -n "$T"
            USER=$(probe "$T" https://api.github.com/user)
            CORE=$(probe "$T" 'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C01.json?ref=main')
            THEME=$(probe "$T" https://api.github.com/repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.25)
            OPS=$(probe "$T" https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.871)
            M3U8=$(probe "$T" https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.31)
            echo "${name}_USER=$USER" >> "$GITHUB_OUTPUT"
            echo "${name}_CORE=$CORE" >> "$GITHUB_OUTPUT"
            echo "${name}_THEME=$THEME" >> "$GITHUB_OUTPUT"
            echo "${name}_OPS=$OPS" >> "$GITHUB_OUTPUT"
            echo "${name}_M3U8=$M3U8" >> "$GITHUB_OUTPUT"
          done
      - name: Publish safe access receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/body <<EOF
          S01 updater credential access probe (safe HTTP codes only)

          | Credential | /user | core-updates C01 | Theme 1.35.25 | Ops 1.21.871 | M3U8 1.25.31 |
          |---|---:|---:|---:|---:|---:|
          | VF_PRIVATE_READ_TOKEN | ${{ steps.probe.outputs.PRIVATE_USER }} | ${{ steps.probe.outputs.PRIVATE_CORE }} | ${{ steps.probe.outputs.PRIVATE_THEME }} | ${{ steps.probe.outputs.PRIVATE_OPS }} | ${{ steps.probe.outputs.PRIVATE_M3U8 }} |
          | VF_RELEASE_WRITE_TOKEN | ${{ steps.probe.outputs.RELEASE_USER }} | ${{ steps.probe.outputs.RELEASE_CORE }} | ${{ steps.probe.outputs.RELEASE_THEME }} | ${{ steps.probe.outputs.RELEASE_OPS }} | ${{ steps.probe.outputs.RELEASE_M3U8 }} |

          No token values are logged or persisted.
          EOF
          gh pr comment 881 --repo llhzx2018/core-free-runner-public --body-file /tmp/body
