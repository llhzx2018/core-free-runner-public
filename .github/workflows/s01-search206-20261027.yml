name: S01 search excerpt and navigation with native zh_CN locale
on:
  push:
    branches: [task/s01-search206-20261027]
    paths: ['.github/workflows/s01-search206-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.206
  TARGET_SHA: 1ef3ff70569f97c53917f5818a1e41a7f0adb582
  TARGET_TREE: 947f13af224a1944bc70261d6582d217d876a419
  BASE_SHA: 8804cd0b3db69440b204bf8b07879a29b9e93df2
  SOURCE_VERSION: 1.35.205
  LANE_ID: s01-search206-20261027
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-search206-20261027/spec.json --input control/.github/workflows/s01-search206-20261027.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1ef3ff70569f97c53917f5818a1e41a7f0adb582
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-search206-20261027/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check control/lanes/s01-search206-20261027/search-check.cjs
          node --check target/src/assets/js/main.js
          php target/tests/targeted/test-nav-current-external.php
          gh release download v1.35.205 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.205.zip --dir provider
          echo '219b5d1e2c8f186afed49078bea357111f5e03ae8b48ec2cf3ff9125113f65d6  provider/vf-tools-theme_V1.35.205.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Actual WordPress search states and data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-search206-20261027/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-search206-20261027/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
