name: P01 V2.37.1 Formal Bind
on:
  push:
    branches: [release/p01-v2371-hotfix-20260902]
    paths: [.github/workflows/p01-v2371-formal-bind-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: release/v2.37.1-formal-source-20260902
      CANDIDATE: de5d8cadbfb8a5d289c5fbeb7293e25f097989a8
      CANDIDATE_TREE: 7767528d379070722c7adc1ad8804dc2b677cf6e
      RUNTIME_TREE: 37f3be264892224e2f3041564844c2aebd471064
      READINESS_RUN: '33593775142'
      READINESS_R1: '33593631445'
    steps:
      - name: Gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_R1 --jq .conclusion)" = failure
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Bind exact readiness evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['production_version']=='2.37.0'
          assert d['published_release']['version']=='2.37.0'
          d['formal_release_state']='V2.37.1 CANDIDATE READINESS PASS / FORMAL SOURCE BOUND / NOT PUBLISHED'
          d['candidate_state']='V2.37.1 CANDIDATE READINESS PASS / FORMAL SOURCE BOUND'
          d['next_action']='Generate and freeze V2.37.1 Formal Artifact; run Strict Fresh against frozen bytes; publish only after PASS.'
          d['v2_37_1_release_candidate']['candidate_readiness_run']=33593775142
          d['v2_37_1_release_candidate']['candidate_readiness_r1']=33593631445
          d['v2_37_1_release_candidate']['candidate_readiness_r1_classification']='HARNESS_ONLY_EVIDENCE_DIRECTORY'
          d['v2_37_1_release_candidate']['candidate_readiness']='PASS'
          d['v2_37_1_release_candidate']['candidate_source']='de5d8cadbfb8a5d289c5fbeb7293e25f097989a8'
          d['v2_37_1_release_candidate']['candidate_tree']='7767528d379070722c7adc1ad8804dc2b677cf6e'
          d['v2_37_1_release_candidate']['runtime_tree']='37f3be264892224e2f3041564844c2aebd471064'
          d['v2_37_1_release_candidate']['state']='FORMAL SOURCE BIND / NOT PUBLISHED'
          d['current_change']['candidate_readiness_run']=33593775142
          d['current_change']['candidate_readiness']='PASS'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only)" = VF_PROJECT.json
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'release(P01): bind V2.37.1 candidate PASS'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:$PRODUCT_BRANCH
          printf 'P01_V2371_FORMAL_BIND=PASS\nFORMAL_SOURCE=%s\nTREE=%s\nRUNTIME_TREE=%s\nREADINESS_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)" "$READINESS_RUN" | tee /tmp/p01-v2371-formal-bind.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2371-formal-bind.txt
          if-no-files-found: warn
          retention-days: 90
