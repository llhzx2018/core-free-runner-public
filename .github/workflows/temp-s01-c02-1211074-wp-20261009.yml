name: S01-C02 1074 Real WP Publish isolated
on:
  push:
    branches: [test/s01-c02-1211074-publish-real-wordpress-20261009]
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1074
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Exact product checkout
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b2406b8b988d356c9c1eac67a6742ed334099a4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP with database and ZIP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo_mysql, zip, curl, mbstring
          coverage: none
      - name: Source validation and PHP syntax
        run: |
          test "$(cat VERSION)" = "1.21.1074"
          php -l includes/release/async-job-parts/06-response-download-trait.php
          php -l includes/release/async-job-parts/04-stage-pipeline-trait.php
          php -l tests/s01-c02-1211074-publish-wordpress-backend.php
          grep -q '无需重新上传' includes/release/async-job-parts/06-response-download-trait.php
      - name: Isolated WordPress real DB and publish jobs
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1074"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1074 --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211074-publish-wordpress-backend.php"
      - name: Deterministic formally releasable ZIP
        run: |
          mkdir -p /tmp/s01-c02-v1074
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-v1074/vf-tools-ops_V1.21.1074.zip > /tmp/s01-c02-v1074/manifest.json
          unzip -tq /tmp/s01-c02-v1074/vf-tools-ops_V1.21.1074.zip
          cat /tmp/s01-c02-v1074/manifest.json
      - name: Seal tested artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v1.21.1074-wp-tested
          path: /tmp/s01-c02-v1074/
          retention-days: 30
