name: P01 Native Transfer Category Path Regression
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/p01-transfer-category-canonical-native.yml'
permissions:
  contents: read
jobs:
  isolated-transfer-native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-transfer-category-canonical-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 draft source without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2a4bca2c9d737ab1f7ed9bc61dbc143fe5ae6b24
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Prepare PHP native SQLite runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,mbstring
          coverage: none
      - name: Verify exact source, lint and scoped native contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = '2a4bca2c9d737ab1f7ed9bc61dbc143fe5ae6b24'
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.357'
          php -l src/app/DataTransfer.php
          php -l tests/unit/transfer_category_identity_canonical_native.php
          php tests/unit/transfer_category_identity_canonical_native.php | tee /tmp/p01-category-canonical.txt
          grep -Fx 'P01_TRANSFER_CANONICAL_CATEGORY_IDENTITY=PASS' /tmp/p01-category-canonical.txt
          grep -Fx 'P01_TRANSFER_LONG_CATEGORY_REIMPORT_DEDUP=PASS' /tmp/p01-category-canonical.txt
          grep -Fx 'P01_TRANSFER_BOOKMARK_FOLDER_IDENTITY=PASS' /tmp/p01-category-canonical.txt
          php tests/unit/transfer_csv_category_slash_native.php | tee /tmp/p01-category-slash.txt
          grep -Fx 'P01_TRANSFER_CSV_SLASH_CATEGORY_NATIVE=PASS' /tmp/p01-category-slash.txt
          php tests/unit/transfer_bookmark_href_quote_native.php | tee /tmp/p01-bookmark-quote.txt
          grep -Fx 'P01_TRANSFER_BOOKMARK_HREF_NATIVE=PASS' /tmp/p01-bookmark-quote.txt
          php tests/unit/transfer_six_domain_roundtrip_native.php | tee /tmp/p01-transfer-six.txt
          grep -Fx 'P01_TRANSFER_ALL_SIX_SURFACES_CSV_HTML=PASS' /tmp/p01-transfer-six.txt
          php tests/unit/transfer_preview_infile_duplicates_native.php | tee /tmp/p01-transfer-preview.txt
          grep -Fx 'P01_TRANSFER_PREVIEW_READ_ONLY=PASS' /tmp/p01-transfer-preview.txt
          echo P01_TRANSFER_CATEGORY_IDENTITY_EXACT_DRAFT=PASS
