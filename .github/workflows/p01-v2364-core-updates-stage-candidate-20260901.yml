name: P01 V2.36.4 Core Updates Stage Candidate
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-core-updates-stage-candidate-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE: 0a700ad89ca1d2d6e05ccca3d7005afb8769f112
      CANDIDATE_BRANCH: release/p01-v2364-manifest-candidate-20260901
      REMOTE_TRUTH_RUN: '33525222295'
      REMOTE_TRUTH_ARTIFACT: '9807380555'
      REMOTE_TRUTH_DIGEST: sha256:528882825dd1f39fa0b21799a965d6d30b910ee1f874ab26e9ef174e6e136983
      PRODUCT_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      RELEASE_ID: '380614937'
      ASSET_NAME: VF_Start_V2.36.4_UPDATE.zip
      ASSET_BYTES: '1237066'
      ASSET_SHA256: ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
      RELEASED_AT: '2026-09-01T15:17:48Z'
      EVID: /tmp/p01-v2364-core-updates-stage
    steps:
      - name: Runner remote truth prerequisite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_TRUTH_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_TRUTH_RUN/artifacts --jq ".artifacts[] | select(.id==$REMOTE_TRUTH_ARTIFACT) | .digest")" = "$REMOTE_TRUTH_DIGEST"
      - name: Checkout exact live core-updates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Stage strict 2.36.3 to 2.36.4 manifest candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          cd updates
          test "$(git rev-parse HEAD)" = "$CORE_BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CORE_BASE"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then echo UNEXPECTED_EXISTING_CANDIDATE_BRANCH; exit 20; fi
          M=projects/P01.json
          jq -e '.enabled==true and .current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' "$M" >/dev/null
          git switch -c "$CANDIDATE_BRANCH" "$CORE_BASE"
          cat > "$M" <<'JSON'
          {
            "schema_version": "1.0",
            "project_id": "P01",
            "component_id": "APP",
            "enabled": true,
            "current_version": "2.36.3",
            "target_version": "2.36.4",
            "update_type": "ATOMIC",
            "from_versions": [
              "2.36.3"
            ],
            "schema_from": "2026082901",
            "schema_to": "2026082901",
            "repository": "llhzx2018/vf-start",
            "release_tag": "v2.36.4",
            "release_id": 380614937,
            "product_identity": "6b321422bce5a834521786d8233149c7624aa014",
            "asset_name": "VF_Start_V2.36.4_UPDATE.zip",
            "asset_bytes": 1237066,
            "asset_sha256": "ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b",
            "backup_required": true,
            "rollback_supported": true,
            "released_at": "2026-09-01T15:17:48Z",
            "minimum_php": "8.0.0",
            "notes": "P01 · VF Start V2.36.4 是 V2.36.3 的 Patch Release，修复共享匿名资源页在未登录状态下仍继承管理员选择列 Grid 模板、但实际没有选择框节点而造成的卡片列错位。ONE FRONTEND 模型保持不变；Schema 2026082901 保持不变，无 Migration。Formal Artifact R4 33520819304 PASS；Strict Fresh R2 33521577888 PASS；Composite Main Promotion 33524444884 PASS；Publication Readback R2 33525031995 PASS；Remote Release Truth 33525222295 PASS。GitHub Release 380614937 已绑定 v2.36.4@6b321422bce5a834521786d8233149c7624aa014；正式在线升级资产 VF_Start_V2.36.4_UPDATE.zip = 1237066 bytes / sha256:ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b。该 Atomic 严格只支持 V2.36.3 → V2.36.4；Owner Production 不由 Assistant 写入。"
          }
          JSON
          jq -e . "$M" >/dev/null
          jq -e '.project_id=="P01" and .component_id=="APP" and .enabled==true and .current_version=="2.36.3" and .target_version=="2.36.4" and .update_type=="ATOMIC" and .from_versions==["2.36.3"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .repository=="llhzx2018/vf-start" and .release_tag=="v2.36.4" and .release_id==380614937 and .product_identity=="6b321422bce5a834521786d8233149c7624aa014" and .asset_name=="VF_Start_V2.36.4_UPDATE.zip" and .asset_bytes==1237066 and .asset_sha256=="ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b" and .backup_required==true and .rollback_supported==true and .released_at=="2026-09-01T15:17:48Z" and .minimum_php=="8.0.0"' "$M" >/dev/null
          test "$(git diff --name-only)" = projects/P01.json
          git diff --check
          cp "$M" "$EVID/P01-candidate.json"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "$M"
          git commit -m 'release(P01): stage V2.36.4 update manifest candidate'
          CANDIDATE=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$CORE_BASE"
          test "$(git diff --name-only "$CORE_BASE" "$CANDIDATE")" = projects/P01.json
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          test "$(git ls-remote origin refs/heads/$CANDIDATE_BRANCH | awk '{print $1}')" = "$CANDIDATE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$CORE_BASE"
          printf 'P01_V2364_CORE_UPDATES_STAGE=PASS\nCORE_BASE=%s\nCANDIDATE=%s\nCANDIDATE_BRANCH=%s\nDIFF=projects/P01.json\nSUPPORTED_FROM=2.36.3\nTARGET=2.36.4\nPRODUCT_SOURCE=%s\nRELEASE_ID=%s\nASSET=%s\nASSET_BYTES=%s\nASSET_SHA256=%s\nSCHEMA_CHANGE=NO\nCORE_UPDATES_MAIN_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$CORE_BASE" "$CANDIDATE" "$CANDIDATE_BRANCH" "$PRODUCT_SOURCE" "$RELEASE_ID" "$ASSET_NAME" "$ASSET_BYTES" "$ASSET_SHA256" | tee "$EVID/verdict.txt"
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-core-updates-stage-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
