name: TEMP skill-book V5.4 governance reconciliation gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout V5.4 governance reconciliation branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: governance/skill-book-v54-candidate-reconciliation-20260828
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0

      - name: Patch latest Candidate pointer only
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('CURRENT.md')
          s=p.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2` 为保留的历史 Candidate，`V5.3` 为最新 Candidate；十四个 Candidate 版本均未晋升 Source Current。V5.3 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2/V5.3` 为保留的历史 Candidate，`V5.4` 为最新 Candidate；十五个 Candidate 版本均未晋升 Source Current。V5.4 已进入 Candidate Distribution，但未进入 Current Distribution。'
          assert s.count(old)==1, s.count(old)
          assert new not in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('CURRENT_POINTER_PATCH_PASS')
          PY

      - name: Governance boundary validation
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          BASE=410824e318513aed0df3bb95c460ffaf146289ee
          test -f mother-specs/skill-book/V5.4/SKILL_BOOK_V5.4_CANDIDATE_OVERLAY.md
          test -f distribution/skills/candidates/skill-book/V5.4/README.md
          test -f distribution/skills/candidates/skill-book/V5.4/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -q 'Latest Candidate：`V5.4`' distribution/skills/candidates/skill-book/V5.4/README.md
          grep -q 'Source Current：`skill-book V3.5`' distribution/skills/candidates/skill-book/V5.4/README.md
          grep -q 'V5.4.*最新 Candidate' CURRENT.md
          git diff --exit-code "$BASE" -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          test "$(git diff --name-only "$BASE" | sort | wc -l)" -eq 4
          git diff --name-only "$BASE" | sort
          echo 'CURRENT_DISTRIBUTION_ZERO_DIFF_PASS'

      - name: Commit reconciliation pointer to isolated branch
        shell: bash
        working-directory: gov
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CURRENT.md
          git commit -m 'governance: reconcile skill-book V5.4 published candidate'
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/gov-doc.git"
          git push origin HEAD:refs/heads/governance/skill-book-v54-candidate-reconciliation-20260828
          echo "GOVERNANCE_BRANCH_HEAD=$(git rev-parse HEAD)"

      - name: Final isolated-branch boundary readback
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          BASE=410824e318513aed0df3bb95c460ffaf146289ee
          git diff --exit-code "$BASE" -- distribution/skills/CURRENT_SKILL_DISTRIBUTION.json distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          test "$(git diff --name-only "$BASE" | sort | wc -l)" -eq 4
          grep -q 'V5.4.*最新 Candidate' CURRENT.md
          echo 'GOVERNANCE_RECONCILIATION_BRANCH_PASS'
