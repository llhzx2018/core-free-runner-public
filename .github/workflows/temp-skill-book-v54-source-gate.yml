name: TEMP skill-book V5.4 release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOV_REPO: llhzx2018/gov-doc
      SOURCE_COMMIT: 410824e318513aed0df3bb95c460ffaf146289ee
      TAG: skill-book-v5.4-candidate-20260828
      ZIP_NAME: skill-book_V5.4_CANDIDATE_20260828.zip
      ZIP_SHA: 3182c1914c8d5d9a1dc129af856982bf1bea7eb05193989d968c36630aa3d58c
      ZIP_BYTES: '398654'
    steps:
      - name: Checkout exact V5.4 source commit
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 410824e318513aed0df3bb95c460ffaf146289ee
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: gov
          fetch-depth: 0

      - name: Exact source and release preflight
        shell: bash
        working-directory: gov
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -d skills/skill-book/V5.4
          test "$(cat skills/skill-book/V5.4/VERSION)" = "5.4"
          grep -q 'SB54-RUNTIME-CONTRACT-C91D4E72' skills/skill-book/V5.4/SOURCE_PACKAGE_IDENTITY.md
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "BLOCK: tag already exists before release gate"
            exit 1
          fi
          if gh api "repos/$GOV_REPO/releases/tags/$TAG" >/tmp/existing-release.json 2>/dev/null; then
            echo "BLOCK: release already exists before release gate"
            cat /tmp/existing-release.json
            exit 1
          fi
          echo 'PRE_RELEASE_ABSENCE_CONFIRMED'

      - name: Python syntax 37/37
        shell: bash
        working-directory: gov/skills/skill-book/V5.4
        run: |
          set -euo pipefail
          python - <<'PY'
          import py_compile
          from pathlib import Path
          fs=sorted(list(Path('scripts').glob('*.py'))+list(Path('tests').glob('*.py')))
          assert len(fs)==37, len(fs)
          for p in fs:
              py_compile.compile(str(p),doraise=True)
          print('PYTHON_SYNTAX_PASS 37/37')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Install pinned test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Release exact-source regression 96/96
        shell: bash
        working-directory: gov/skills/skill-book/V5.4
        run: |
          set -euo pipefail
          python -m pytest -q
          rm -rf .pytest_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Verify internal source checksums
        shell: bash
        working-directory: gov/skills/skill-book/V5.4
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 93
          test "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) | wc -l)" -eq 0
          test "$(find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) | wc -l)" -eq 0

      - name: Rebuild exact release ZIP
        shell: bash
        working-directory: gov/skills/skill-book/V5.4
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_STORED
          import hashlib, stat, os
          root=Path('.')
          out=Path('/tmp')/os.environ['ZIP_NAME']
          base='skill-book_V5.4_CANDIDATE'
          fs=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts and p.suffix not in {'.pyc','.pyo'})
          assert len(fs)==93, len(fs)
          with ZipFile(out,'w',compression=ZIP_STORED) as z:
              for p in fs:
                  zi=ZipInfo(f'{base}/{p.as_posix()}',(2026,8,28,0,0,0))
                  zi.compress_type=ZIP_STORED
                  zi.create_system=3
                  zi.external_attr=(stat.S_IFREG|0o644)<<16
                  z.writestr(zi,p.read_bytes())
          b=out.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          assert len(b)==int(os.environ['ZIP_BYTES']), len(b)
          assert sha==os.environ['ZIP_SHA'], sha
          print('RELEASE_ZIP_IDENTITY_PASS',len(b),sha)
          PY
          printf '%s  %s\n' "$ZIP_SHA" "$ZIP_NAME" > "/tmp/$ZIP_NAME.sha256"
          cd /tmp
          sha256sum -c "$ZIP_NAME.sha256"
          unzip -t "$ZIP_NAME" >/tmp/unzip-test.txt
          tail -n 2 /tmp/unzip-test.txt

      - name: Create immutable Candidate prerelease
        shell: bash
        working-directory: gov
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # skill-book V5.4 Candidate

          Status: **CANDIDATE / NOT CURRENT**

          V5.4 is a runtime-authority and phase-depth-preservation bug-closure Candidate built from the V5.3 field-test findings. It strengthens phase-depth preservation, runtime authority fidelity, and fail-closed execution without weakening evidence truth.

          Validation before release:
          - Exact Source Commit: `410824e318513aed0df3bb95c460ffaf146289ee`
          - Runtime Contract ID: `SB54-RUNTIME-CONTRACT-C91D4E72`
          - Python syntax: `37/37 PASS`
          - Release exact-source regression: `96/96 PASS`
          - Deterministic ZIP: `398654 bytes`
          - ZIP SHA-256: `3182c1914c8d5d9a1dc129af856982bf1bea7eb05193989d968c36630aa3d58c`

          Authority boundary:
          - Source Current remains `skill-book V3.5`.
          - This release only makes V5.4 the latest published Candidate after governance reconciliation.
          - Backend-installed V5.4 runtime evidence: `NOT_RUN`.
          - Fresh V5.4 standalone book benchmark: `NOT_RUN`.
          - Real Reader READ / LEARN / TRAIN evidence: `NOT_RUN`.
          - Current Promotion: `NOT_AUTHORIZED`.
          EOF
          gh release create "$TAG" \
            --repo "$GOV_REPO" \
            --target "$SOURCE_COMMIT" \
            --title "skill-book V5.4 Candidate · 2026-08-28" \
            --notes-file /tmp/release-notes.md \
            --prerelease \
            "/tmp/$ZIP_NAME" \
            "/tmp/$ZIP_NAME.sha256"

      - name: Release metadata and tag readback
        shell: bash
        working-directory: gov
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GOV_REPO/releases/tags/$TAG" > /tmp/release.json
          python - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']==os.environ['TAG']
          assert r['prerelease'] is True
          assert r['draft'] is False
          assert r['target_commitish']==os.environ['SOURCE_COMMIT'], r['target_commitish']
          assets={a['name']:a for a in r['assets']}
          zn=os.environ['ZIP_NAME']; sn=zn+'.sha256'
          assert set(assets)=={zn,sn}, list(assets)
          assert assets[zn]['size']==int(os.environ['ZIP_BYTES']), assets[zn]['size']
          print('RELEASE_ID',r['id'])
          print('ZIP_ASSET_ID',assets[zn]['id'])
          print('SHA_ASSET_ID',assets[sn]['id'])
          PY
          gh api "repos/$GOV_REPO/git/ref/tags/$TAG" > /tmp/tag-ref.json
          python - <<'PY'
          import json, os
          x=json.load(open('/tmp/tag-ref.json'))['object']
          assert x['type']=='commit', x
          assert x['sha']==os.environ['SOURCE_COMMIT'], x
          print('TAG_TARGET_PASS',x['sha'])
          PY

      - name: Remote asset download readback
        shell: bash
        working-directory: gov
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release-readback /tmp/release-extract
          mkdir -p /tmp/release-readback /tmp/release-extract
          gh release download "$TAG" --repo "$GOV_REPO" --dir /tmp/release-readback --pattern "$ZIP_NAME" --pattern "$ZIP_NAME.sha256"
          cd /tmp/release-readback
          test "$(stat -c%s "$ZIP_NAME")" = "$ZIP_BYTES"
          test "$(sha256sum "$ZIP_NAME" | awk '{print $1}')" = "$ZIP_SHA"
          test "$(cat "$ZIP_NAME.sha256")" = "$ZIP_SHA  $ZIP_NAME"
          sha256sum -c "$ZIP_NAME.sha256"
          unzip -t "$ZIP_NAME" >/tmp/release-readback-unzip.txt
          unzip -q "$ZIP_NAME" -d /tmp/release-extract
          cd /tmp/release-extract/skill-book_V5.4_CANDIDATE
          sha256sum -c SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 93
          test "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) | wc -l)" -eq 0
          test "$(find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) | wc -l)" -eq 0
          echo 'REMOTE_RELEASE_DOWNLOAD_READBACK_PASS'
