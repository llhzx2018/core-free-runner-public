name: One-shot P01 Topics Reading Index R1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-topics-readable-index-r1.yml'
permissions:
  contents: read
jobs:
  focused-topics-reading:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXACT_SHA: 641dd6dc18d6f00a5907d88d72d7f7a6a9f9c75c
    steps:
      - name: Ensure private exact source read exists
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo BLOCKED_PRIVATE_READ; exit 78; }
      - name: Checkout pinned private P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p01-temporary
      - name: Focused PHP contract and CSS guard
        working-directory: p01-temporary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          php -l src/app/TopicLibraryPage.php
          php -l tests/unit/topics_page_full_polish_contract.php
          php tests/unit/topics_page_full_polish_contract.php
          python3 - <<'PY'
          import re
          from pathlib import Path
          css=Path('src/assets/topic-library.css').read_text()
          def style(sel):
              m=re.search(re.escape(sel)+r'\s*\{([^}]*)\}', css, re.S)
              assert m,sel
              return m.group(1)
          assert '-webkit-line-clamp:1' in style('body.surface-topics .vf-topic-library-body p')
          assert 'flex-wrap:nowrap!important' in style('body.surface-topics .vf-topic-library-meta')
          assert 'min-width:0!important' in style('body.surface-topics .vf-topic-library-tags')
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))!important;' in css
          print('P01_TOPICS_READING_DENSITY_SOURCE=PASS')
          PY
          echo TOPICS_READABLE_INDEX_R1_EXACT=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          rm -rf p01-temporary
          echo PRIVATE_SOURCE_PERSISTED=NO
