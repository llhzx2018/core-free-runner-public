name: P03 V1.37.2 Fast Exact Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1372-fast-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.2-project-intelligence-integrity

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private V1.37.2 work
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03
      - name: Seal and verify exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          php -m | grep -qiE '^pdo_sqlite$'
          python3 scripts/finalize_v1372.py
          test "$(cat VERSION)" = '1.37.2'
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find src public -type f -name '*.php' -print0)
          node --check public/assets/project-intelligence.js
          node --check public/assets/project-intelligence-v1372.js
          python3 tests/unit/schema_contract_test.py
          python3 tests/unit/project_intelligence_contract_test.py
          python3 tests/unit/project_intelligence_mcp_contract_test.py
          python3 tests/unit/project_intelligence_v1372_contract_test.py
          php tests/integration/project_intelligence_v1372_read_model_test.php
          rm -rf "$RUNNER_TEMP/base" "$RUNNER_TEMP/base-runtime" "$RUNNER_TEMP/target-runtime" "$RUNNER_TEMP/atomic"
          git worktree add --detach "$RUNNER_TEMP/base" v1.37.1 >/dev/null
          python3 "$RUNNER_TEMP/base/scripts/build_runtime.py" "$RUNNER_TEMP/base-runtime" >/dev/null
          python3 scripts/build_runtime.py "$RUNNER_TEMP/target-runtime" >/dev/null
          test "$(cat "$RUNNER_TEMP/target-runtime/VERSION" 2>/dev/null || true)" = '' || true
          grep -Fq "define('VFAB_VERSION', '1.37.2');" "$RUNNER_TEMP/target-runtime/app/bootstrap.php"
          test -f "$RUNNER_TEMP/target-runtime/app/ProjectIntelligenceReadModel.php"
          test -f "$RUNNER_TEMP/target-runtime/assets/project-intelligence-v1372.css"
          test -f "$RUNNER_TEMP/target-runtime/assets/project-intelligence-v1372.js"
          ! find "$RUNNER_TEMP/target-runtime" -type f | grep -E '(/database/|\.sqlite3?$|\.db$|/PRIVATE_DATA/|/uploads/|/session/|/logs/|/tmp/)'
          python3 scripts/build_atomic.py --base-runtime "$RUNNER_TEMP/base-runtime" --target-runtime "$RUNNER_TEMP/target-runtime" --output "$RUNNER_TEMP/atomic" >/dev/null
          cd "$RUNNER_TEMP/atomic"
          sha256sum -c SHA256SUMS.txt
          test "$(unzip -Z1 VF_Forge_V1.37.2_Atomic_Upgrade.zip)" = 'repair-v1.37.2.php'
          unzip -p VF_Forge_V1.37.2_Atomic_Upgrade.zip repair-v1.37.2.php > repair.php
          grep -Fq "const VFF_ATOMIC_TARGET='1.37.2';" repair.php
          grep -Fq 'const VFF_ATOMIC_ALLOWED=["1.37.1"];' repair.php
          SHA=$(sha256sum VF_Forge_V1.37.2_Atomic_Upgrade.zip | awk '{print $1}')
          SRC=$(python3 -c 'import json;print(json.load(open("PACKAGE_MANIFEST.json"))["source_manifest_sha256"])')
          COUNT=$(python3 -c 'import json;print(json.load(open("PACKAGE_MANIFEST.json"))["source_file_count"])')
          echo "P03_V1372_ATOMIC_SHA=$SHA"
          echo "P03_V1372_SOURCE_MANIFEST_SHA=$SRC"
          echo "P03_V1372_SOURCE_FILES=$COUNT"
          cd "$GITHUB_WORKSPACE/p03"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION CHANGELOG.md src/app/bootstrap.php src/app/AuthorityMemoryService.php src/app/ProjectIntelligenceReadModel.php scripts/build_atomic.py public/assets/project-intelligence.js
          if ! git diff --cached --quiet; then
            git commit -m 'release(P03): seal V1.37.2 exact integrity candidate'
            git push origin HEAD:${P03_BRANCH}
          fi
          echo "P03_V1372_EXACT_CANDIDATE=$(git rev-parse HEAD)"
          echo 'P03_V1372_FAST_EXACT_CANDIDATE=PASS'
          echo 'PRODUCTION_WRITE=NO'
