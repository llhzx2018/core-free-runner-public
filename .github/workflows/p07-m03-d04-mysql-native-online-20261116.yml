name: P07 M03 D04 native MySQL 8.4 private online source snapshot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-mysql-native-online-20261116.yml']
permissions:
  contents: read
jobs:
  source-sql-online:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Public one-off harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private exact P07 code transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 840bda1778175455c0d23cd52d49c76da7dc8e01
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: GOV-DOC transient current architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-doc
      - name: Run exact-source SQL private backup and no-overwrite safety tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-doc"
          test "$(git -C "$PRIVATE" rev-parse HEAD)" = "840bda1778175455c0d23cd52d49c76da7dc8e01"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_mysql_online_private_snapshot.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -q
          python3 -B lib/server_migration_pull.py _stage-prepared-mysql-online --help >/dev/null
          python3 -B lib/server_migration_pull.py _stage-prepared-static-online --help >/dev/null
          python3 -B lib/server_migration_pull.py _stage-prepared-sqlite-online --help >/dev/null
          echo P07_D04_SQL_ONLINE_NO_IMPORT_NEGATIVE_TESTS=PASS
      - name: Native MySQL 8.4 real engine source-only export test
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          P07_MYSQL_NATIVE_CI: '1'
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name p07-native-mysql8-source -e MYSQL_ROOT_PASSWORD=SYNTHETIC_ci_root_2026 mysql:8.4 >/dev/null
          for i in $(seq 1 75); do
            if docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 p07-native-mysql8-source mysqladmin --protocol=tcp -h127.0.0.1 -uroot ping >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec -e MYSQL_PWD=SYNTHETIC_ci_root_2026 p07-native-mysql8-source mysql --no-defaults --protocol=tcp -h127.0.0.1 -uroot -N -e "SELECT VERSION();" | grep -E '^8[.]4[.]'
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /home/p07native /home/p07native/htdocs /home/p07native/htdocs/native.example.invalid
          PRIVATE="$PWD/.p07-private"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_mysql_native_source_export.py -v
          echo P07_D04_MYSQL_84_NATIVE_SINGLE_TRANSACTION_EXPORT=PASS
      - name: Canonical GOV naming architecture modules and UX
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-doc"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B .github/checks/test_architecture_gate.py -q
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py --manifest "$PRIVATE/.github/checks/code_architecture.json" --gov-root "$GOV" --git-root "$PRIVATE" --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81 --head-sha 840bda1778175455c0d23cd52d49c76da7dc8e01
          echo P07_D04_MYSQL_ONLINE_GOV_ARCH_NAMING=PASS
          echo P07_D04_MYSQL_CROSS_ENGINE_MIGRATION=NOT_PROVEN
          echo P07_D04_FINAL_SOURCE_ALL_WRITERS_FENCED=NOT_PROVEN
          echo P07_D04_OLD_VPS_CP2_DNS_PRODUCTION=UNCHANGED
      - name: Always remove synthetic SQL container and all transient private workspaces
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f p07-native-mysql8-source >/dev/null 2>&1
          rm -rf -- .p07-private .gov-doc
          test ! -e .p07-private
          test ! -e .gov-doc
          echo P07_D04_MYSQL_PUBLIC_PRIVATE_WORKSPACE_REMOVED=PASS
