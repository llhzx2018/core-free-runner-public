name: S01 C02 Verified Seed Readback Candidate
on:
  push:
    branches: [task/s01-c02-1211103-verified-scan-readback-20261012]
permissions:
  contents: read
jobs:
  verified-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: d05cc04af945e3d6f0271fb253a7480ad7230394
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Check source and real Production hash regression
        run: |
          test "$(git -C product rev-parse HEAD)" = d05cc04af945e3d6f0271fb253a7480ad7230394
          test "$(cat product/VERSION)" = 1.21.1102
          php -l product/includes/recovery/service.php
          php -l product/tests/s01-c02-1211103-recovery-seed-verified-model-proof.php
          php product/tests/s01-c02-1211103-recovery-seed-verified-model-proof.php
      - name: Provision disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recovery UI and safe scan regression
        working-directory: product
        run: |
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          node tests/s01-c02-1211100-recovery-dialog-layout-browser-proof.js
          php tests/s01-c02-1211101-seed-scan-truth-contract.php
          echo S01_C02_VERIFIED_SEED_PAGE_MODEL_MACHINE_PASS
