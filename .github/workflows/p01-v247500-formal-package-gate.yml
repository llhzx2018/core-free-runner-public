name: p01-v247500-formal-package-gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247500-formal-package-gate.yml'
      - 'tests/lanes/p01-v247500-formal-package-gate.json'
      - 'scripts/p01-v247500-formal-negative-perf.py'
      - 'scripts/p01-v247500-formal-updater-release.py'
      - 'scripts/p01-v247500-formal-owner-browser.py'
      - 'release-requests/P01-V247500.json'
permissions:
  contents: read
jobs:
  p01-formal-exact-assets-and-browser-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: main
      TARGET_VERSION: 2.47.500
      TARGET_SHA: e8b13aeb13f5fbc9c3f2808acccab69fd05e542a
      TARGET_TREE: b16fa3d9e9c83649ef988f494ef49f1982c7495e
      SOURCE_VERSION: 2.47.499
      WORK: /tmp/p01-247500-final-gate-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact lane audit and native dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"/{source-release,prior-full,prior-repair,out}
          python3 scripts/ephemeral_lane_spec.py validate --spec tests/lanes/p01-v247500-formal-package-gate.json >/dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec tests/lanes/p01-v247500-formal-package-gate.json \
            --input .github/workflows/p01-v247500-formal-package-gate.yml
          python3 -m py_compile scripts/p01-v247500-formal-updater-release.py scripts/p01-v247500-formal-negative-perf.py
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-sqlite3 php-curl php-zip php-mbstring php-gd unzip >/dev/null
          python3 -m venv "$WORK/browser-venv"
          "$WORK/browser-venv/bin/python" -m pip -q install selenium
          echo P01_247500_FOCUSED_GATE_ENVIRONMENT=PASS
      - name: Transient official source and exact product identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$WORK/candidate"
          git -C "$WORK/candidate" fetch -q --depth 2 origin "$TARGET_SHA"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C "$WORK/candidate" rev-parse HEAD:src)" = 620c4254cefaacff4de4e906f70d9ed4a457dc8e
          test "$(git -C "$WORK/candidate" rev-parse HEAD^)" = 44c17a904077be70bae01c01d5fa657de4699e16
          test "$(git -C "$WORK/candidate" diff --name-only HEAD^ HEAD)" = docs/authority/ACCEPTANCE_MATRIX.md
          echo P01_247500_DOCS_ONLY_PROMOTION_RUNTIME_BYTES_IDENTICAL=PASS
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < "$WORK/candidate/src/VERSION.txt")" = "$TARGET_VERSION"
          gh release download "v${SOURCE_VERSION}" -R "$PRODUCT_REPO" -D "$WORK/source-release" \
            -p "VF-Start-V${SOURCE_VERSION}-FULL.zip" -p "VF_Start_V${SOURCE_VERSION}_UPDATE.zip"
          printf '%s  %s\n' \
            eb8752f5ba448c2588fb1981e6a71ffa16b4cd8004bb55b0512c978784352904 "$WORK/source-release/VF-Start-V2.47.499-FULL.zip" \
            85e0a112e2ef3baf13bbada4089165c490576d72f8fa7837005dfc26fcfaf209 "$WORK/source-release/VF_Start_V2.47.499_UPDATE.zip" \
            | sha256sum -c -
          unzip -qq "$WORK/source-release/VF-Start-V${SOURCE_VERSION}-FULL.zip" -d "$WORK/prior-full"
          unzip -qq "$WORK/source-release/VF_Start_V${SOURCE_VERSION}_UPDATE.zip" -d "$WORK/prior-repair"
          echo P01_247500_EXACT_SOURCE_AND_OFFICIAL499=PASS
      - name: Build and verify exact formal-candidate archive bytes twice
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-v247500-formal-updater-release.py \
            --candidate "$WORK/candidate/src" \
            --baseline-full "$WORK/prior-full" \
            --baseline-repair "$WORK/prior-repair/repair-v${SOURCE_VERSION}.php" \
            --out "$WORK/out" --version "$TARGET_VERSION" --source-version "$SOURCE_VERSION" \
            --target-sha "$TARGET_SHA" --target-tree "$TARGET_TREE" >/dev/null
          mkdir -p "$WORK/out2"
          python3 scripts/p01-v247500-formal-updater-release.py \
            --candidate "$WORK/candidate/src" \
            --baseline-full "$WORK/prior-full" \
            --baseline-repair "$WORK/prior-repair/repair-v${SOURCE_VERSION}.php" \
            --out "$WORK/out2" --version "$TARGET_VERSION" --source-version "$SOURCE_VERSION" \
            --target-sha "$TARGET_SHA" --target-tree "$TARGET_TREE" >/dev/null
          cmp "$WORK/out/VF-Start-V2.47.500-FULL.zip" "$WORK/out2/VF-Start-V2.47.500-FULL.zip"
          cmp "$WORK/out/VF_Start_V2.47.500_UPDATE.zip" "$WORK/out2/VF_Start_V2.47.500_UPDATE.zip"
          echo P01_247500_FORMAL_CANDIDATE_DETERMINISTIC=PASS
          python3 - "$WORK/out/VF-Start-V2.47.500-FULL.zip" <<'PY'
          import json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
           m=json.loads(z.read('release-manifest.json'))
           assert m['version']=='2.47.500' and m['source_commit']=='e8b13aeb13f5fbc9c3f2808acccab69fd05e542a'
           assert m['release_type']=='formal-updater-safety-fix' and m['stage']=='FORMAL_RELEASE_ARTIFACT'
           assert m['update']['from_versions']==['2.47.499'] and m['updater_safety_fix']['production_auto_apply'] is False
           assert 'NOT PUBLISHED' not in z.read('FULL-PACKAGE-NOTES.txt').decode('utf8')
          print('P01_247500_FORMAL_PACKAGE_MANIFEST_METADATA=PASS')
          PY
      - name: Exact Atomic bad-source/symlink/package and HTTP timeout negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-v247500-formal-negative-perf.py \
            --work "$WORK" \
            --full499 "$WORK/source-release/VF-Start-V2.47.499-FULL.zip" \
            --atomic500 "$WORK/out/VF_Start_V2.47.500_UPDATE.zip"
      - name: Final formal bytes - first FULL Owner browser, historical warning and real Atomic negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          "$WORK/browser-venv/bin/python" scripts/p01-v247500-formal-owner-browser.py \
            --work "$WORK" \
            --source-full "$WORK/source-release/VF-Start-V2.47.499-FULL.zip" \
            --candidate-full "$WORK/out/VF-Start-V2.47.500-FULL.zip" \
            --candidate-update "$WORK/out/VF_Start_V2.47.500_UPDATE.zip"
          echo P01_247500_FORMAL_ASSET_OWNER_BROWSER_NEGATIVE_GATE=PASS
      - name: Cleanup ephemeral private code and synthetic data
        if: always()
        shell: bash
        run: |
          echo P01_247500_FORMAL_RELEASE=NOT_EXECUTED
          echo P01_247500_DISTRIBUTION=UNCHANGED
          echo P01_247500_PRODUCTION=UNCHANGED
          echo P01_247500_PUBLIC_ARTIFACT_PRIVATE_SOURCE=NONE
          case "$WORK" in /tmp/p01-247500-final-gate-*) rm -rf -- "$WORK";; *) exit 66;; esac

  publish-formal-release:
    needs: p01-formal-exact-assets-and-browser-gate
    if: >-
      github.event.pull_request.number == 3579 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/p01-v247500-formal-updater524-20261107' &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'release(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      WORK: /tmp/p01-v247500-publish-${{ github.run_id }}
      PRODUCT_REPO: llhzx2018/vf-start
      TAG: v2.47.500
      SOURCE_SHA: e8b13aeb13f5fbc9c3f2808acccab69fd05e542a
      SOURCE_TREE: b16fa3d9e9c83649ef988f494ef49f1982c7495e
    steps:
      - name: Checkout exact Owner-armed request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify owner-case, current governance, exact prior machine PASS and PR scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          git fetch -q origin main
          python3 - <<'PY'
          import json,subprocess
          expected={
            '.github/workflows/p01-v247500-formal-package-gate.yml',
            'scripts/p01-v247500-formal-updater-release.py',
            'scripts/p01-v247500-formal-synthetic-helper.py',
            'scripts/p01-v247500-formal-owner-browser.py',
            'scripts/p01-v247500-formal-negative-perf.py',
            'tests/lanes/p01-v247500-formal-package-gate.json',
            'release-requests/P01-V247500.json'
          }
          current=set(subprocess.check_output(['git','diff','--name-only','origin/main','HEAD'],text=True).splitlines())
          if current!=expected:raise SystemExit('unknown change in v500 formal release PR')
          r=json.load(open('release-requests/P01-V247500.json'))
          if not (r['schema']=='p01-owner-one-case-formal-release/v1' and
                  r['armed'] is True and r['version']=='2.47.500' and
                  r['source_version']=='2.47.499' and
                  r['target_sha']=='e8b13aeb13f5fbc9c3f2808acccab69fd05e542a' and
                  r['target_tree']=='b16fa3d9e9c83649ef988f494ef49f1982c7495e' and
                  r['runtime_src_tree']=='620c4254cefaacff4de4e906f70d9ed4a457dc8e' and
                  r['from_versions']==['2.47.499'] and
                  r['preview']=='POST_RELEASE_REQUIRED_NOT_PASS' and
                  r['real_use']=='POST_PRODUCTION_REQUIRED_NOT_PASS' and
                  r['production_auto_apply'] is False and
                  len(r['public_authority_required'])==11 and
                  len(r['public_authority_na'])==2 and
                  'approved GOV-DOC #143 and P01 #1938' in r['owner_adopted_approval']):
              raise SystemExit('Owner-armed scope/mode/gate mismatch')
          print('P01_V500_OWNER_ARMED_EXACT_PR_SCOPE=PASS')
          PY
          for id in 42331565048 42331887583 42346154512 42349697565 42353519500 42355062864 42355842008; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success ||
              { echo "MISSING_REQUIRED_MACHINE_PASS:$id"; exit 71; }
          done
          gh api "repos/llhzx2018/gov-doc/contents/CURRENT.md?ref=main" --jq .content | base64 -d > /tmp/p01-v500-gov
          grep -Fq '| skill-release | V3.4 |' /tmp/p01-v500-gov
          echo P01_V500_EFFECTIVE_OWNER_ADOPTED_GOV_AND_REQUIRED_MACHINE=PASS
      - name: Fetch only exact P01 main and signed old v499 assets
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          test -n "$GH_TOKEN"
          mkdir -p "$WORK"/{old,prior-full,prior-repair,out,remote}
          live="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" refs/heads/main | awk '{print $1}')"
          test "$live" = "$SOURCE_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$WORK/source"
          git -C "$WORK/source" fetch -q --depth 2 origin "$SOURCE_SHA"
          git -C "$WORK/source" checkout -q --detach "$SOURCE_SHA"
          git -C "$WORK/source" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          test "$(git -C "$WORK/source" rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C "$WORK/source" rev-parse HEAD:src)" = 620c4254cefaacff4de4e906f70d9ed4a457dc8e
          test "$(git -C "$WORK/source" rev-parse HEAD^)" = 44c17a904077be70bae01c01d5fa657de4699e16
          test "$(git -C "$WORK/source" diff --name-only HEAD^ HEAD)" = docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq '| RP-07H |' "$WORK/source/docs/authority/ACCEPTANCE_MATRIX.md"
          test "$(tr -d '\r\n ' < "$WORK/source/VERSION")" = 2.47.500
          test "$(tr -d '\r\n ' < "$WORK/source/src/VERSION.txt")" = 2.47.500
          gh release download v2.47.499 -R "$PRODUCT_REPO" -D "$WORK/old" \
            -p VF-Start-V2.47.499-FULL.zip -p VF_Start_V2.47.499_UPDATE.zip
          printf '%s  %s\n' \
            eb8752f5ba448c2588fb1981e6a71ffa16b4cd8004bb55b0512c978784352904 "$WORK/old/VF-Start-V2.47.499-FULL.zip" \
            85e0a112e2ef3baf13bbada4089165c490576d72f8fa7837005dfc26fcfaf209 "$WORK/old/VF_Start_V2.47.499_UPDATE.zip" |
            sha256sum -c -
          unzip -qq "$WORK/old/VF-Start-V2.47.499-FULL.zip" -d "$WORK/prior-full"
          unzip -qq "$WORK/old/VF_Start_V2.47.499_UPDATE.zip" -d "$WORK/prior-repair"
          echo P01_V500_FORMAL_SOURCE_OLD_SIGNED_RELEASE=PASS
      - name: Rebuild tested exact formal assets; prove metadata before Tag
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-v247500-formal-updater-release.py \
            --candidate "$WORK/source/src" \
            --baseline-full "$WORK/prior-full" \
            --baseline-repair "$WORK/prior-repair/repair-v2.47.499.php" \
            --out "$WORK/out" --version 2.47.500 --source-version 2.47.499 \
            --target-sha "$SOURCE_SHA" --target-tree "$SOURCE_TREE" > "$WORK/built-receipt.json"
          unzip -t "$WORK/out/VF-Start-V2.47.500-FULL.zip" >/dev/null
          unzip -t "$WORK/out/VF_Start_V2.47.500_UPDATE.zip" >/dev/null
          unzip -p "$WORK/out/VF-Start-V2.47.500-FULL.zip" release-manifest.json |
            jq -e '.source_commit=="e8b13aeb13f5fbc9c3f2808acccab69fd05e542a" and .stage=="FORMAL_RELEASE_ARTIFACT" and .release_type=="formal-updater-safety-fix" and .update.from_versions==["2.47.499"] and .updater_safety_fix.production_auto_apply==false' >/dev/null
          test "$(unzip -Z1 "$WORK/out/VF_Start_V2.47.500_UPDATE.zip")" = repair-v2.47.500.php
          unzip -p "$WORK/out/VF_Start_V2.47.500_UPDATE.zip" repair-v2.47.500.php > "$WORK/repair.php"
          php -l "$WORK/repair.php" >/dev/null
          php "$WORK/repair.php" --self-test | grep -Fq '"ok":true'
          python3 - "$WORK/out" "$WORK/built-receipt.json" <<'PY'
          import hashlib,json,sys,pathlib,zipfile
          p=pathlib.Path(sys.argv[1]);r=json.load(open(sys.argv[2]))
          for prefix,name in [('full','VF-Start-V2.47.500-FULL.zip'),('update','VF_Start_V2.47.500_UPDATE.zip')]:
              b=(p/name).read_bytes()
              if len(b)!=r[prefix+'_bytes'] or hashlib.sha256(b).hexdigest()!=r[prefix+'_sha256']:raise SystemExit('release bytes not reproducible')
          with zipfile.ZipFile(p/'VF-Start-V2.47.500-FULL.zip') as z:
              files=z.namelist()
              if any(x.startswith('/') or '../' in x or x.endswith(('.sqlite','.db','.log','.env')) for x in files):raise SystemExit('unsafe FULL entry')
          print('P01_V500_FINAL_FORMAL_ASSET_IDENTITY_AND_BYTE_GATE=PASS')
          PY
      - name: Create only authorized v500 formal Tag and GitHub Release, verify remote bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" > "$WORK/tag.json" 2>/dev/null; then
            test "$(jq -r .object.sha "$WORK/tag.json")" = "$SOURCE_SHA"
          else
            gh api --method POST "repos/$PRODUCT_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" > "$WORK/tag.json"
            test "$(jq -r .object.sha "$WORK/tag.json")" = "$SOURCE_SHA"
          fi
          if gh release view "$TAG" -R "$PRODUCT_REPO" >/dev/null 2>&1; then
            echo P01_RELEASE_ALREADY_EXISTS_NO_OVERWRITE
            exit 75
          fi
          cat > "$WORK/release-notes.md" <<'NOTES'
          # VF Start V2.47.500 · Atomic 524 安全修复

          修复在线升级期间全局维护锁无界等待导致的 Cloudflare 524 类阻断。
          更晚成功的 Atomic 操作只有在版本、时间、摘要、原子结果和 SQLite 历史独立匹配时，才能将历史中断记录判为已被后续成功覆盖；原始日志始终保留。

          - 唯一可直接在线升级的来源版本：2.47.499。
          - FULL 仅用于全新安装。不能覆盖已有站点或用户数据库。
          - Schema 2026102201 不变，保留私有 SQLite、配置和文件。
          - 精确正式源码 e8b13aeb13f5fbc9c3f2808acccab69fd05e542a；tree b16fa3d9e9c83649ef988f494ef49f1982c7495e。
          - GOV-DOC skill-release V3.4 Mode H / P01 RP-07H 经 Owner 本版授权；独立 Canonical 803/803、实际 FULL、Atomic、浏览器、权限、故障回滚和中断恢复测试通过。
          - Owner Preview 和 Production 真实体验尚未进行，不冒充验收 PASS。正式网站仅由 Owner 手工升级；必须先备份完整文件、SQLite/WAL 与配置，并确认回滚能力。
          NOTES
          gh release create "$TAG" \
            "$WORK/out/VF-Start-V2.47.500-FULL.zip" \
            "$WORK/out/VF_Start_V2.47.500_UPDATE.zip" \
            -R "$PRODUCT_REPO" --title "VF Start V2.47.500" \
            --notes-file "$WORK/release-notes.md" --verify-tag
          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" > "$WORK/release.json"
          test "$(jq -r .tag_name "$WORK/release.json")" = "$TAG"
          test "$(jq -r .draft "$WORK/release.json")" = false
          test "$(jq -r .prerelease "$WORK/release.json")" = false
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$SOURCE_SHA"
          gh release download "$TAG" -R "$PRODUCT_REPO" -D "$WORK/remote" \
            -p VF-Start-V2.47.500-FULL.zip -p VF_Start_V2.47.500_UPDATE.zip
          cmp "$WORK/out/VF-Start-V2.47.500-FULL.zip" "$WORK/remote/VF-Start-V2.47.500-FULL.zip"
          cmp "$WORK/out/VF_Start_V2.47.500_UPDATE.zip" "$WORK/remote/VF_Start_V2.47.500_UPDATE.zip"
          echo P01_V500_RELEASE_ID="$(jq .id "$WORK/release.json")"
          echo P01_V500_FULL_BYTES="$(stat -c %s "$WORK/remote/VF-Start-V2.47.500-FULL.zip")"
          echo P01_V500_FULL_SHA256="$(sha256sum "$WORK/remote/VF-Start-V2.47.500-FULL.zip" | cut -d' ' -f1)"
          echo P01_V500_UPDATE_BYTES="$(stat -c %s "$WORK/remote/VF_Start_V2.47.500_UPDATE.zip")"
          echo P01_V500_UPDATE_SHA256="$(sha256sum "$WORK/remote/VF_Start_V2.47.500_UPDATE.zip" | cut -d' ' -f1)"
          echo P01_V500_TAG_ASSETS_REMOTE_SHA256=PASS
      - name: Delete transient private checkout and packages
        if: always()
        shell: bash
        run: |
          echo P01_V500_PRODUCTION_WRITE=NONE
          echo P01_V500_CORE_UPDATES_NOT_WRITTEN_BY_THIS_JOB=YES
          case "$WORK" in /tmp/p01-v247500-publish-*) rm -rf -- "$WORK";; *) exit 83;; esac
