name: P01 Content Kinds Auto Covers Gate R2
on:
  push:
    branches: [gate/p01-content-kinds-auto-covers-r2-20260831]
    paths: [.github/workflows/p01-content-kinds-auto-covers-gate-r2-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE: f578ca9306ee0ace4d851ad10a1049e66c7708e2
      BASE: a429d2660c165feae51a46f2144f8de6bda3961f
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-content-covers-r2/evidence
      PORT: '18518'
      ADMIN_PASS: P01ContentCoversPass2026
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and product fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-content-covers-r2; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse "$SOURCE^")" = "$BASE"
          git -C product diff --name-only "$BASE" "$SOURCE" | sort | tee "$EVID/changed-files.txt"
          cat >/tmp/expected.txt <<'EOF'
          src/app/FunctionalWorkspace.php
          src/app/FunctionalWorkspaceShell.php
          src/app/ResourceCoverCache.php
          src/app/ResourceMetadata.php
          src/app/SurfaceRepository.php
          src/app/SurfaceShell.php
          src/assets/workspace.js
          src/resource-cover-refresh.php
          EOF
          diff -u /tmp/expected.txt "$EVID/changed-files.txt"
          test -z "$(grep '^src/migrations/' "$EVID/changed-files.txt" || true)"
          git -C product diff --check "$BASE" "$SOURCE"
          for f in product/src/app/FunctionalWorkspace.php product/src/app/FunctionalWorkspaceShell.php product/src/app/ResourceCoverCache.php product/src/app/ResourceMetadata.php product/src/app/SurfaceRepository.php product/src/app/SurfaceShell.php product/src/resource-cover-refresh.php; do php -l "$f"; done | tee "$EVID/php-lint.txt"
          node --check product/src/assets/workspace.js
          ! grep -F "\$kind = 'YouTube'" product/src/app/SurfaceRepository.php
          test -z "$(git -C product status --porcelain)"
      - name: Fresh setup and synthetic poster
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import struct,zlib,binascii
          w,h=120,180;rows=[]
          for y in range(h):
              r=bytearray([0])
              for x in range(w): r.extend(((20+x)%256,(110+y//2)%256,125))
              rows.append(bytes(r))
          def c(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(b''.join(rows),9))+c(b'IEND',b'')
          open('/tmp/p01-content-covers-r2/poster.png','wb').write(png)
          PY
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-content-covers-r2.pid
          COOKIE=/tmp/p01-content-covers-r2.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Content Covers R2' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Deterministic taxonomy cover and override contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" IMG=/tmp/p01-content-covers-r2/poster.png EVID="$EVID" php runner/scripts/p01_content_kinds_auto_covers_gate.php | tee "$EVID/php-contract.txt"
      - name: Browser taxonomy hydration and privacy gate
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"; "$CHROME" --version | tee "$EVID/chrome.txt"
          mkdir -p /tmp/p01-content-covers-r2/pw; cd /tmp/p01-content-covers-r2/pw; npm init -y >/dev/null 2>&1; npm install playwright-core@1.55.0 >/dev/null 2>&1
          CHROME="$CHROME" SOURCE="$SOURCE" BASE="$BASE" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" node "$GITHUB_WORKSPACE/runner/scripts/p01_content_kinds_auto_covers_browser.cjs" | tee "$EVID/browser.txt"
      - name: SQLite integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/db.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();$i=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn());$fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));echo "INTEGRITY=$i\nFK=$fk\n";if($i!=='ok'||$fk!==0)exit(1);
          PHP
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-content-kinds-auto-covers-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-content-covers-r2.pid 2>/dev/null)" 2>/dev/null || true
