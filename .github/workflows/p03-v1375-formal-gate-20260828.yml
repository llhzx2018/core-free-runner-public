name: P03 V1.37.5 Human Baseline UI Formal Gate

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-formal-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: f2865c97f80bd8052dd47d76ef08c626c044e669
      BASE_MAIN: 07b48eea3d43fb3bc93d1a7037137b6c9d5520e0
      OLD_SOURCE: b215f510a543ca5cf85af9e87257e2acb63d74ab
      FIXTURE_PASS: VfM-2026-Test-Fixture!
      PHP_TEST_IMAGE: vf-forge-php84-v1375
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, sodium, fileinfo
          coverage: none
      - name: Checkout exact V1.37.5 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: f2865c97f80bd8052dd47d76ef08c626c044e669
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Checkout exact formal V1.37.4 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: b215f510a543ca5cf85af9e87257e2acb63d74ab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old
      - name: Exact source and live main fence
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C old rev-parse HEAD)" = "$OLD_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          test "$(cat product/VERSION)" = '1.37.5'
          test "$(cat old/VERSION)" = '1.37.4'
          echo P03_V1375_SOURCE_FENCE=PASS
      - name: Install test utilities
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip jq sqlite3
      - name: Build supported PHP 8.4 isolated runtime
        run: |
          set -Eeuo pipefail
          cat >"$RUNNER_TEMP/Dockerfile.vf-php" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev sqlite3 \
            && docker-php-ext-install zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.vf-php" "$RUNNER_TEMP"
          docker run --rm "$PHP_TEST_IMAGE" php -v
      - name: Materialize and adapt proven V1.37.4 formal gate
        run: |
          set -Eeuo pipefail
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/891c54772f4c6e40ed83dc205cc7f8f3cbc51664/scripts/p03-v1374-formal-gate.sh -o scripts/p03-v1375-formal-gate.sh
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/891c54772f4c6e40ed83dc205cc7f8f3cbc51664/scripts/p03-v1374-formal-gate-v3.sh -o scripts/p03-v1375-formal-gate-v3.sh
          python3 - <<'PY'
          from pathlib import Path
          new='f2865c97f80bd8052dd47d76ef08c626c044e669'
          old='b215f510a543ca5cf85af9e87257e2acb63d74ab'
          base='07b48eea3d43fb3bc93d1a7037137b6c9d5520e0'
          old_candidate='b215f510a543ca5cf85af9e87257e2acb63d74ab'
          old_source='29580b62a0839ee3453ccf0cf8a4902bdf3cd8ec'
          old_base='cc9a6da445240534016d08e148aa8a28c11be241'
          for name in ['scripts/p03-v1375-formal-gate.sh','scripts/p03-v1375-formal-gate-v3.sh']:
              p=Path(name);s=p.read_text(encoding='utf-8')
              s=s.replace(old_candidate,'__CANDIDATE__')
              s=s.replace(old_source,old)
              s=s.replace('__CANDIDATE__',new)
              s=s.replace(old_base,base)
              s=s.replace('1.37.4','__TARGET_VERSION__')
              s=s.replace('1.37.3','1.37.4')
              s=s.replace('__TARGET_VERSION__','1.37.5')
              s=s.replace('P03_V1374','P03_V1375').replace('p03-v1374','p03-v1375').replace('V1374','V1375').replace('v1374','v1375')
              p.write_text(s,encoding='utf-8')
          p=Path('scripts/p03-v1375-formal-gate-v3.sh');s=p.read_text(encoding='utf-8')
          s=s.replace('cp scripts/p03-v1375-formal-gate.sh "$TMP"','cp scripts/p03-v1375-formal-gate.sh "$TMP"',1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/p03-v1375-formal-gate.sh');s=p.read_text(encoding='utf-8')
          old_scope="""printf '%s\\n' CHANGELOG.md VERSION VF_PROJECT.json scripts/build_atomic.py src/app/bootstrap.php >\"$RUNNER_TEMP/expected-files\""" 
          new_scope="""printf '%s\\n' CHANGELOG.md VERSION VF_PROJECT.json public/assets/app.js public/diagnose.php public/system-baseline.php public/system-info.php scripts/build_atomic.py src/app/bootstrap.php tests/unit/common_baseline_ui_exposure_contract_test.py >\"$RUNNER_TEMP/expected-files\""" 
          if old_scope not in s: raise SystemExit('scope block changed')
          s=s.replace(old_scope,new_scope,1)
          marker="python3 tests/unit/schema_contract_test.py"
          s=s.replace(marker,marker+"\npython3 tests/unit/common_baseline_ui_exposure_contract_test.py",1)
          p.write_text(s,encoding='utf-8')
          PY
          bash -n scripts/p03-v1375-formal-gate.sh
          bash -n scripts/p03-v1375-formal-gate-v3.sh
          echo P03_V1375_FORMAL_GATE_ADAPTATION=PASS
      - name: Run exact V1.37.5 formal gate
        run: bash scripts/p03-v1375-formal-gate-v3.sh
      - name: Upload verified V1.37.5 release set
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.37.5-HUMAN-BASELINE-FORMAL-RELEASE-SET
          path: product/build/v1375-a/*
          if-no-files-found: error
          retention-days: 30
