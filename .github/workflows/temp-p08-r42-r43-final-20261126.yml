name: TEMP P08 R42/R43 bounded remaining DEV proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r42-r43-final-20261126.yml'
permissions:
  contents: read
concurrency:
  group: p08-s9-core-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 1c9a3f087190647aaf5a9289a6382ea52b8ac422
  TARGET_TREE: 7d53882f2e553f94c7ca90153f1f12d9f7395620
  GOV_SHA: 4223ce80b2cf7945cff485ba9ff598d1ceef6a3b
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-r42-r43-final-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r42-r43-final-20261126.json --input .github/workflows/temp-p08-r42-r43-final-20261126.yml
  remaining-product-business:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-r42-r43-final-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Ephemeral read-only P08 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Exact source and package lock
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-p08 rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat private-p08/VERSION)" = "$TARGET_VERSION"
          test -s private-p08/composer.lock && test -s private-p08/package-lock.json
          echo P08_R42_SOURCE=PASS
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax and locked application dependencies
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          find app src routes database tests/Feature -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > "$RUNNER_TEMP/p08-php-lint.log" 2>&1 || { echo P08_R42_PHP_LINT=FAIL; exit 1; }
          echo P08_R42_PHP_LINT=PASS
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer.log" 2>&1 || { echo P08_R42_COMPOSER=FAIL; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p08-npm.log" 2>&1 || { echo P08_R42_NPM=FAIL; exit 1; }
          echo P08_R42_DEPENDENCIES=PASS
      - name: Required compiled assets and new R43 source safety
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          npm run build > "$RUNNER_TEMP/p08-build.log" 2>&1 || { echo P08_REQUIRED_ASSETS=FAIL; exit 1; }
          php tests/compatibility/r43_migration_identity.php > "$RUNNER_TEMP/p08-r43-refusal.log" 2>&1 || { echo P08_R43_REFUSALS=FAIL; exit 1; }
          grep -qx 'P08_R43_MIGRATION_IDENTITY_CHECKS=13;PASS' "$RUNNER_TEMP/p08-r43-refusal.log"
          php tests/test_r43_migration_source_inventory.php > "$RUNNER_TEMP/p08-r43-inventory.log" 2>&1 || { echo P08_R43_INVENTORY=FAIL; exit 1; }
          grep -qx 'P08_R43_ACTUAL_SOURCE_INVENTORY=PASS;15+8=23;READ_ONLY' "$RUNNER_TEMP/p08-r43-inventory.log"
          echo P08_R43_REFUSALS_AND_SOURCE_INVENTORY=PASS
      - name: Independent business HTTP tests, bounded synthetic test summaries
        if: ${{ !cancelled() }}
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php vendor/bin/phpunit --no-coverage --colors=never --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky --log-junit "$RUNNER_TEMP/p08-junit.xml" tests/Feature/AdReviewDraftWorkflowTest.php tests/Feature/AdsCenterWorkflowTest.php tests/Feature/AutomationRuleWorkflowTest.php tests/Feature/AutomationSafetyWorkflowTest.php tests/Feature/BeMobCatalogPaginationTest.php tests/Feature/BeMobReportPreviewTest.php tests/Feature/BeMobTrackerWorkflowTest.php tests/Feature/DomainCenterWorkflowTest.php tests/Feature/GoogleAdsHierarchyWorkflowTest.php tests/Feature/LandingAssetWorkflowTest.php tests/Feature/LandingCrashRecoveryTest.php tests/Feature/LandingHistoryPreviewTest.php tests/Feature/LandingVariantsWorkflowTest.php tests/Feature/MetaAdsWorkflowTest.php tests/Feature/MonitoringLocalWorkflowTest.php tests/Feature/MonitoringReadModelTest.php tests/Feature/PopAdsWorkflowTest.php tests/Feature/R101IntegratedWorkspaceTest.php tests/Feature/StaticBundleArchiveDownloadTest.php tests/Feature/StaticLandingHandoffTest.php tests/Feature/StaticPagesWorkflowTest.php tests/Feature/TikTokAdsWorkflowTest.php tests/Feature/TrackerAttributionReadinessTest.php tests/Feature/TrackerCatalogBindingsTest.php tests/Feature/TrackerCenterWorkflowTest.php tests/Feature/TrackerCredentialRotationTest.php tests/Feature/TrackerKumaBreakdownTest.php tests/Feature/VpsStaticWorkflowTest.php > "$RUNNER_TEMP/p08-phpunit.log" 2>&1 || {
            echo P08_R42_BUSINESS_PHPUNIT=FAIL
            exit 1
          }
          grep -E '^OK \(' "$RUNNER_TEMP/p08-phpunit.log" | tail -n 1 || true
          echo P08_R42_BUSINESS_PHPUNIT=PASS
      - name: Wipe transient private source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-*.log "$RUNNER_TEMP/p08-junit.xml" "$RUNNER_TEMP/p08-r42-schema.sqlite" "$RUNNER_TEMP/p08-r42-schema.sqlite-wal" "$RUNNER_TEMP/p08-r42-schema.sqlite-shm"
          test ! -e private-p08
          echo P08_R42_PRIVATE_CLEANUP=PASS

  actual-clean-full-three-engines:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-r42-r43-final-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_ISOLATED_INSTALL_TEST: 'YES'
    steps:
      - name: Ephemeral read-only P08 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Canonical GOV-DOC exact authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, curl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical development FULL, not a release
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test "$(git -C "$GITHUB_WORKSPACE/gov-proof" rev-parse HEAD)" = "$GOV_SHA"
          test ! -e .env
          composer install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer.log" 2>&1 || { echo P08_FULL_COMPOSER=FAIL; exit 1; }
          composer check-platform-reqs --format=json --no-dev > "$RUNNER_TEMP/p08-platform.log" 2>&1 || { echo P08_FULL_PLATFORM=FAIL; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p08-npm.log" 2>&1 || { echo P08_FULL_NPM=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-build.log" 2>&1 || { echo P08_FULL_ASSETS=FAIL; exit 1; }
          git diff --exit-code HEAD -- > "$RUNNER_TEMP/p08-diff.log" 2>&1 || { echo P08_FULL_SOURCE_CHANGED=FAIL; exit 1; }
          python3 scripts/build_full.py --source . --output "$RUNNER_TEMP/p08-dev-full.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root "$GITHUB_WORKSPACE/gov-proof" > "$RUNNER_TEMP/p08-full.log" 2>&1 || { echo P08_CANONICAL_DEV_FULL=FAIL; exit 1; }
          sha256sum "$RUNNER_TEMP/p08-dev-full.zip" | cut -d' ' -f1 | sed 's/^/P08_DEV_FULL_SHA256=/'
          echo P08_CANONICAL_DEV_FULL=PASS
      - name: Real FULL extracted into fresh isolated sites per engine
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          failed=0
          cid=''
          clean_container() { if test -n "$cid"; then docker rm -f -v "$cid" >/dev/null 2>&1; cid=''; fi; }
          trap clean_container EXIT
          export P08_R43_DB_HOST=127.0.0.1 P08_R43_DB_NAME=p08_r43_new_main P08_R43_DB_USER=root P08_R43_DB_PASSWORD=p08_r43_disposable_only_2026
          for engine in sqlite mysql mariadb; do
            site="$RUNNER_TEMP/p08-r43-clean-full-$engine"
            test ! -e "$site"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/p08-dev-full.zip" -d "$site"
            export P08_R43_ENGINE="$engine"
            if test "$engine" != sqlite; then
              if test "$engine" = mysql; then image=mysql:8.4; prefix=MYSQL; else image=mariadb:11.8; prefix=MARIADB; fi
              if ! cid=$(docker run --rm -d --label "vf-p08-dev-run=$GITHUB_RUN_ID" -p 127.0.0.1:3306:3306 -e "${prefix}_ROOT_PASSWORD=$P08_R43_DB_PASSWORD" -e "${prefix}_ROOT_HOST=%" -e "${prefix}_DATABASE=$P08_R43_DB_NAME" "$image" 2>"$RUNNER_TEMP/p08-container.log"); then echo "P08_DB_START_$engine=FAIL"; failed=1; continue; fi
              ready=0
              for _ in $(seq 1 45); do
                if php -r 'try{$p=new PDO("mysql:host=127.0.0.1;port=3306;dbname=".getenv("P08_R43_DB_NAME"),"root",getenv("P08_R43_DB_PASSWORD"));$v=strtolower((string)$p->query("SELECT VERSION()")->fetchColumn());$e=getenv("P08_R43_ENGINE");exit(($e==="mysql"&&str_starts_with($v,"8.4.")&&!str_contains($v,"mariadb"))||($e==="mariadb"&&str_starts_with($v,"11.8.")&&str_contains($v,"mariadb"))?0:2);}catch(Throwable $e){exit(1);}' > /dev/null 2>&1; then ready=1; break; fi
                sleep 2
              done
              if test "$ready" != 1; then echo "P08_DB_READY_$engine=FAIL"; failed=1; clean_container; continue; fi
            fi
            if php private-p08/tests/native/r43_clean_full_three_engines.php > "$RUNNER_TEMP/p08-install-$engine.log" 2>&1 && grep -qx "P08_R43_REAL_018_${engine}_23_MIGRATIONS_S9_OWNER=PASS" "$RUNNER_TEMP/p08-install-$engine.log" && grep -qx 'P08_R43_REAL_018_FRESH_FULL_SOURCE_AND_INSTALL=PASS' "$RUNNER_TEMP/p08-install-$engine.log" && grep -qx 'P08_R43_REAL_018_LANDING_REVISION_AND_REINSTALL_REFUSAL=PASS' "$RUNNER_TEMP/p08-install-$engine.log" && grep -qx 'P08_R43_REAL_018_NO_TOKEN_AND_NO_REMOTE_PROVIDER=PASS' "$RUNNER_TEMP/p08-install-$engine.log"; then
              echo "P08_ACTUAL_CLEAN_FULL_$engine=PASS"
            else
              echo "P08_ACTUAL_CLEAN_FULL_$engine=FAIL"
              failed=1
            fi
            clean_container
          done
          test -z "$(docker ps -aq --filter "label=vf-p08-dev-run=$GITHUB_RUN_ID")"
          echo P08_DEV_DB_CLEANUP=PASS
          test "$failed" = 0
          echo P08_ACTUAL_CLEAN_FULL_THREE_ENGINES=PASS
      - name: Erase transient source, packages and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for cid in $(docker ps -aq --filter "label=vf-p08-dev-run=$GITHUB_RUN_ID"); do docker rm -f -v "$cid" >/dev/null; done
          test -z "$(docker ps -aq --filter "label=vf-p08-dev-run=$GITHUB_RUN_ID")"
          rm -rf -- private-p08 gov-proof "$RUNNER_TEMP"/p08-r43-clean-full-*
          rm -f -- "$RUNNER_TEMP"/p08-*.log "$RUNNER_TEMP/p08-dev-full.zip"
          test ! -e private-p08 && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-dev-full.zip"
          echo P08_DEV_FULL_WORKSPACE_CLEANUP=PASS
