name: P07 M05 UX7 exact offline module install rollback and safety gates
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-ux-five-m05-ux7-preflight-20261118.yml']
permissions:
  contents: read
jobs:
  real-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: '4bbab98c1ee2ac2761e2db35bd99319203d46e76'
      PRODUCT_BASE: '9f3433f391d00c7272cc0ef97957d1c50dedf076'
      M05_BUILD: '0.1.0-m05-ux7-terminal-design'
      OLD_BUILD: '0.1.0-m05-official-db-choice-ux6'
      OLD_URL: 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-official-db-ux6-20261114/P07-M05-0.1.0-m05-official-db-choice-ux6.zip'
      OLD_SHA: 'bdaf59039d63bada13317e874e7653f728d8c64ae77b38f0857ddeb6dcbc26a5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 4bbab98c1ee2ac2761e2db35bd99319203d46e76
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - name: Exact product UX7 identity and no-write safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat .p07-private/BUILD_ID)" = '0.1.0-release139'
          python3 -B .p07-private/.github/checks/architecture_gate.py --manifest .p07-private/.github/checks/code_architecture.json --gov-root .gov-current --git-root .p07-private --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          (cd .p07-private && python3 -B scripts/check_p07_modules.py && python3 -B scripts/check_p07_terminal_ux.py --base-ref "$PRODUCT_BASE")
          (cd .p07-private && python3 -B tests/test_p07_m05_host_write_gate.py -q)
          (cd .p07-private && python3 -B tests/test_p07_m05_isolated_module.py -q)
          (cd .p07-private && python3 -B tests/test_p07_m05_dirty_host_guard.py -q)
          echo P07_M05_UX7_CANDIDATE_SOURCE_AND_SAFETY=PASS
      - name: Build deterministic exact-source UX7 bundle and obtain real official UX6
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/p07-ux7-preflight"; mkdir -p "$out"
          python3 -B .p07-private/scripts/build_p07_m05_bundle.py --output "$out/new.zip" > "$out/receipt.json"
          python3 -B .p07-private/scripts/build_p07_m05_bundle.py --output "$out/new-again.zip" > "$out/receipt-again.json"
          cmp "$out/new.zip" "$out/new-again.zip"
          python3 -B - "$out/new.zip" "$M05_BUILD" <<'PY'
          import hashlib,json,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              items=z.namelist()
              assert all(i.startswith("p07-m05/") for i in items)
              meta=json.loads(z.read("p07-m05/MODULE_MANIFEST.json"))
              assert meta["module_id"]=="P07-M05"
              assert meta["module_build_id"]==sys.argv[2]
              assert meta["installation_isolation"]=="P07-M05_ONLY"
              assert z.read("p07-m05/BUILD_ID")==sys.argv[2].encode()+b"\n"
          print("P07_M05_UX7_DETERMINISTIC_COMPLETE_BUNDLE=PASS")
          PY
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 120 "$OLD_URL" -o "$out/old.zip"
          test "$(sha256sum "$out/old.zip" | cut -d' ' -f1)" = "$OLD_SHA"
          echo "P07_M05_UX7_CANDIDATE_ZIP_SHA256=$(sha256sum "$out/new.zip" | cut -d' ' -f1)"
          echo P07_M05_UX6_OFFICIAL_BASELINE_BYTES_VERIFIED=PASS
      - name: Real isolated UX6 to UX7 Atomic, tamper reject, interrupted swap and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/p07-ux7-preflight"
          sudo env NO_COLOR=1 M05_TEST_BASE="$out/isolation" OLD="$out/old.zip" NEW="$out/new.zip" OLD_SHA="$OLD_SHA" OLD_BUILD="$OLD_BUILD" NEW_BUILD="$M05_BUILD" python3 -B - <<'PY'
          import hashlib,importlib.util,os,pathlib,subprocess
          from unittest.mock import patch
          P=pathlib.Path
          base=P(os.environ["M05_TEST_BASE"])
          source=P("installers/p07-m05-atomic.py")
          spec=importlib.util.spec_from_file_location("m05_atomic",source)
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          mod.BASE=base
          base.mkdir(parents=True)
          for module in ("m01","m02","m03","m04"):
              (base/module).mkdir()
              (base/module/"CANARY").write_text("keep-"+module)
          def side():
              return {m: hashlib.sha256((base/m/"CANARY").read_bytes()).hexdigest() for m in ("m01","m02","m03","m04")}
          before=side()
          old=P(os.environ["OLD"]); new=P(os.environ["NEW"])
          oldsum=os.environ["OLD_SHA"]; newsum=hashlib.sha256(new.read_bytes()).hexdigest()
          oldname=os.environ["OLD_BUILD"]; newname=os.environ["NEW_BUILD"]
          assert mod.install(old,oldsum)==oldname
          current=base/"m05/current"
          assert os.readlink(current)=="releases/"+oldname
          data=new.read_bytes()
          bad=new.with_name("broken.zip")
          bad.write_bytes(data+b"broken package")
          try:
              mod.install(bad,newsum)
              raise AssertionError("tamper accepted")
          except mod.Unsafe:
              pass
          assert os.readlink(current)=="releases/"+oldname
          orig_replace=os.replace
          def fault(src,dst):
              if str(dst)==str(current):
                  raise OSError("simulated power loss before current swap")
              return orig_replace(src,dst)
          with patch.object(mod.os,"replace",side_effect=fault):
              try: mod.install(new,newsum)
              except OSError: pass
              else: raise AssertionError("fault injection was not blocked")
          assert os.readlink(current)=="releases/"+oldname
          assert mod.install(new,newsum)==newname
          assert os.readlink(current)=="releases/"+newname
          assert mod.install(new,newsum)==newname
          proc=subprocess.run(["bash",str(current/"bin/vfops-init-entry"),"--version"],capture_output=True,text=True,timeout=15)
          assert proc.returncode==0 and proc.stdout.strip()=="P07-M05 新服务器初始化 "+newname,(proc.stdout,proc.stderr)
          assert mod.rollback(oldname,"P07-M05:"+oldname)==oldname
          assert os.readlink(current)=="releases/"+oldname
          assert side()==before
          assert not (base/"m05"/"nonexistent").exists()
          print("P07_M05_UX7_REAL_ISOLATED_ATOMIC_IDEMPOTENCE_TAMPER_FAULT_ROLLBACK=PASS")
          print("P07_M05_UX7_OTHER_FOUR_MODULES_CANARY_SHA_IDENTICAL=PASS")
          print("P07_M05_CLOUDPANEL_OWNER_DNS_MIGRATION=NOT_RUN")
          PY
      - name: Remove transient private checkout and unpublished bundles
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private .gov-current
          sudo rm -rf -- "$RUNNER_TEMP/p07-ux7-preflight"
          echo P07_M05_UX7_TRANSIENT_CLEANUP=PASS
