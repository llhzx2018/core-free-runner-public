name: P01 V2.47.6 Owner Preview Candidate R3

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2476-preview-candidate-r3.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2476-owner-preview-candidate-r3
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2476-preview-candidate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      GOV_REPO: llhzx2018/gov-doc
      GOV_SHA: 3a64aea66c5e7d10b682327bafa6e540fe3b31d2
      BASE_SHA: 7b848c45c7e4b99812535b449a230ea77fc356f0
      SOURCE_TAG: v2.47.5
      SOURCE_SHA: 4a5d2a4ddccdfb0e3ea70d62af83c7a664563fb5
      SOURCE_VERSION: 2.47.5
      TARGET_VERSION: 2.47.6
      TARGET_BRANCH: release/v2.47.6-preview-20260910
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Preview-only truth
        run: |
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          echo OWNER_PREVIEW_RUNTIME=NOT_RUN
          echo OWNER_REAL_USE=NOT_RUN
          echo FORMAL_RELEASE_ALLOWED=false

      - name: Exact authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${GOV_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$GOV_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo P01_V2476_R3_EXACT_AUTHORITY=PASS

      - name: Checkout exact P01 base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact V2.47.6 bind and bounded scope
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse "$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '$SOURCE_VERSION');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.5');"; new="define('VF_VERSION', '2.47.6');"
          if s.count(old) != 1: raise SystemExit('VF_VERSION anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          git diff --name-only "$SOURCE_TAG" "$BASE_SHA" | sort >/tmp/p01-v2476-r3-files
          printf '%s\n' src/assets/prototype-density.css src/assets/workspace-domain-nav-base.css src/assets/workspace-domain-nav.css tests/unit/prototype_density_contract.php | sort >/tmp/p01-v2476-r3-expected
          diff -u /tmp/p01-v2476-r3-expected /tmp/p01-v2476-r3-files
          test -z "$(git diff --name-only "$SOURCE_TAG" "$BASE_SHA" -- src/migrations VF_PROJECT.json src/app/UpdateManager.php src/update.php src/app/Auth.php src/app/SecurityManager.php src/app/Repository.php)"
          php tests/unit/prototype_density_contract.php | grep -Fx 'P01_R21_PROTOTYPE_DENSITY_CONTRACT=PASS'
          echo P01_V2476_R3_SCOPE=PASS

      - name: Fresh install and exact setup revisit contract
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-v2476-r3-runtime
          rm -rf "$RUNTIME"; cp -a src "$RUNTIME"; cd "$RUNTIME"
          php -S 127.0.0.1:18126 -t . >/tmp/p01-v2476-r3-server.log 2>&1 &
          echo $! >/tmp/p01-v2476-r3-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v2476-r3.cookies -b /tmp/p01-v2476-r3.cookies http://127.0.0.1:18126/setup.php -o /tmp/p01-v2476-r3-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2476-r3-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2476x"
          curl -fsS -L -c /tmp/p01-v2476-r3.cookies -b /tmp/p01-v2476-r3.cookies -X POST http://127.0.0.1:18126/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.47.6 Preview' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2476-r3-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-v2476-r3-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v2476-r3-verify.txt
          php cli/surface-verify.php | tee /tmp/p01-v2476-r3-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v2476-r3-surface.txt
          STATUS=$(curl -sS -D /tmp/p01-v2476-r3-revisit.headers -o /dev/null -w '%{http_code}' http://127.0.0.1:18126/setup.php)
          echo "SETUP_REVISIT_STATUS=$STATUS"
          cat /tmp/p01-v2476-r3-revisit.headers
          test "$STATUS" = 302
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/p01-v2476-r3-revisit.headers').read_text(encoding='utf-8',errors='replace').replace('\r','').splitlines()
          locations=[line.split(':',1)[1].strip() for line in lines if line.lower().startswith('location:')]
          if locations != ['/']:
              raise SystemExit(f'unexpected setup revisit location: {locations!r}')
          print('SETUP_REVISIT_LOCATION=/')
          PY
          for p in start.php channels.php watch.php topics.php courses.php projects.php tools.php software.php; do test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18126/$p")" = 200; done
          echo P01_V2476_SETUP_REVISIT_PROTECTION=PASS
          echo P01_V2476_R3_FRESH_INSTALL=PASS

      - name: Authenticated Chromium geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2476-r3-pw && cd /tmp/p01-v2476-r3-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          const base='http://127.0.0.1:18126/'; const browser=await chromium.launch({headless:true}); const context=await browser.newContext({viewport:{width:1291,height:797}});
          const raw=fs.readFileSync('/tmp/p01-v2476-r3.cookies','utf8').split(/\r?\n/),cookies=[]; for(let line of raw){if(!line)continue;if(line.startsWith('#HttpOnly_'))line=line.slice(10);else if(line.startsWith('#'))continue;const p=line.split('\t');if(p.length>=7)cookies.push({name:p[5],value:p[6],url:base});} if(!cookies.length)throw new Error('cookies missing'); await context.addCookies(cookies);
          const page=await context.newPage(); const overflow=()=>page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          await page.goto(base+'start.php',{waitUntil:'networkidle'}); const nav=await page.evaluate(()=>{const s=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage');const r=document.createElement('article');r.className='vf-asset-row';r.innerHTML='<span class="vf-asset-select"></span><span class="vf-asset-icon">A</span><span class="vf-asset-copy"><strong>Readable title</strong><small>domain · category</small></span>';document.querySelector('.vf-shell-main').append(r);return{side:getComputedStyle(s).display,sw:s.getBoundingClientRect().width,left:stage.getBoundingClientRect().left,rh:r.getBoundingClientRect().height,ts:parseFloat(getComputedStyle(r.querySelector('strong')).fontSize),ms:parseFloat(getComputedStyle(r.querySelector('small')).fontSize)}}); if(nav.side==='none'||nav.sw<200||nav.left<200||nav.rh<54||nav.ts<13||nav.ms<11||await overflow()>1)throw new Error('Navigation '+JSON.stringify(nav));
          const cases=[['watch.php','vf-watch-library-grid',6],['topics.php','vf-topic-library-grid',4],['courses.php','vf-course-grid',2],['channels.php','vf-channel-grid',3],['projects.php','vf-project-action-grid',2],['tools.php','vf-tool-scene-grid',4],['software.php','vf-software-common-grid',6]]; const out={navigation:nav,subjects:{}};
          for(const [path,klass,want] of cases){await page.goto(base+path,{waitUntil:'networkidle'});const r=await page.evaluate(({klass})=>{const side=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage'),main=document.querySelector('.vf-shell-main'),grid=document.createElement('div');grid.className=klass;grid.innerHTML='<i></i>'.repeat(8);main.append(grid);return{side:getComputedStyle(side).display,left:stage.getBoundingClientRect().left,mw:main.getBoundingClientRect().width,cols:getComputedStyle(grid).gridTemplateColumns.split(' ').filter(Boolean).length}}, {klass});if(r.side!=='none'||Math.abs(r.left)>1||r.mw<1180||r.cols!==want||await overflow()>1)throw new Error(path+' '+JSON.stringify(r));out.subjects[path]=r;}
          const mc=await browser.newContext({viewport:{width:390,height:844}});await mc.addCookies(cookies);const m=await mc.newPage();for(const path of ['start.php','watch.php','topics.php','courses.php','channels.php','projects.php','tools.php','software.php']){await m.goto(base+path,{waitUntil:'networkidle'});const d=await m.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(d>1)throw new Error(path+' mobile overflow '+d)} console.log('P01_V2476_R3_BROWSER='+JSON.stringify(out)); await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v2476-r3-browser.log
          grep -F 'P01_V2476_R3_BROWSER=' /tmp/p01-v2476-r3-browser.log
          echo P01_V2476_R3_UA_UI_MACHINE=PASS

      - name: Publish exact preview candidate branch
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git switch -C "$TARGET_BRANCH" "$BASE_SHA"
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): bind V2.47.6 owner-preview candidate'
          CANDIDATE_SHA=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA"
          echo P01_V2476_PREVIEW_CANDIDATE_PUBLISHED=PASS

      - name: Final preview-only verdict
        run: |
          echo P01_V2476_PREVIEW_CANDIDATE_GATE=PASS
          echo MACHINE_TESTING=PASS
          echo UA_UI_MACHINE=PASS
          echo OWNER_PREVIEW_RUNTIME=NOT_RUN
          echo OWNER_REAL_USE=NOT_RUN
          echo FORMAL_RELEASE=BLOCKED_OWNER_PREVIEW
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v2476-r3-server.pid; then kill "$(cat /tmp/p01-v2476-r3-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v2476-r3-*