name: P02 V2.5.17 View-Agnostic Browser Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-browser-gate-v3.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: maintenance/v2.5.17-library-model-convergence
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Build and fresh install
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip sqlite3 >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = 2.5.17
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.17
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          python3 - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'));assert len(m['entries'])==74==m['runtime_source_file_count']
          for e in m['entries']:
              b=pathlib.Path(e['repo_path']).read_bytes();h=hashlib.sha256(b).hexdigest();assert len(b)==e['bytes'] and h==e['sha256']==e['repo_sha256'],e['repo_path']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          PY
          SITE="$RUNNER_TEMP/p02-v2517-site";mkdir -p "$SITE";bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.17
          php -S 127.0.0.1:18740 -t "$SITE" >"$RUNNER_TEMP/php.log" 2>&1 & echo $! > "$RUNNER_TEMP/php.pid"
          sleep 1
          curl -fsS -c "$RUNNER_TEMP/cookies" http://127.0.0.1:18740/setup.php > "$RUNNER_TEMP/setup.html"
          CSRF="$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);print(m.group(1) if m else '')
          PY
          )"; test -n "$CSRF"
          curl -sS -D "$RUNNER_TEMP/setup.headers" -o /dev/null -b "$RUNNER_TEMP/cookies" \
            -H 'Origin: http://127.0.0.1:18740' -H 'Referer: http://127.0.0.1:18740/setup.php' \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'password=P02-V2517-Test-Only!' --data-urlencode 'password_confirm=P02-V2517-Test-Only!' \
            http://127.0.0.1:18740/setup.php
          grep -Eq '^HTTP/.* 303' "$RUNNER_TEMP/setup.headers"
          echo FRESH_INSTALL=PASS
      - name: Real Chromium semantics in actual view mode
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          PID="$(cat "$RUNNER_TEMP/php.pid")";trap 'kill "$PID" || true; echo "--- PHP LOG ---"; tail -180 "$RUNNER_TEMP/php.log" || true' EXIT
          npm -g ls playwright >/dev/null 2>&1 || npm i -g playwright@1.55.0 >/dev/null
          playwright install chromium >/dev/null
          cat > "$RUNNER_TEMP/test.cjs" <<'JS'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const base='http://127.0.0.1:18740';
            const openItem=async id=>{
              const list=page.locator(`[data-open="${id}"]`);
              if(await list.count()){await list.first().click();return 'list';}
              const notebook=page.locator(`[data-notebook-item="${id}"]`);
              if(await notebook.count()){await notebook.first().click();return 'notebook';}
              throw new Error('ITEM_TRIGGER_NOT_FOUND_'+id);
            };
            const openMore=async id=>{
              const list=page.locator(`[data-item-more="${id}"]`);
              if(await list.count()){await list.first().click();return 'list';}
              const notebook=page.locator(`[data-notebook-more="${id}"]`);
              if(await notebook.count()){await notebook.first().click();return 'notebook';}
              throw new Error('ITEM_MORE_NOT_FOUND_'+id);
            };
            const recent=()=>page.evaluate(()=>fetch('/api.php?action=content_list&mode=recent&status=active&page=1&page_size=20').then(r=>r.json()));
            await page.goto(base+'/',{waitUntil:'networkidle'});
            await page.click('[data-open-login]');await page.fill('input[name="password"]','P02-V2517-Test-Only!');await page.click('#loginSubmit');
            await page.waitForFunction(()=>document.querySelector('#accountBtn')?.textContent.includes('退出'));
            const ia=await page.evaluate(()=>({q:getComputedStyle(document.querySelector('.side-item[data-mode="quick"]')).display,a:getComputedStyle(document.querySelector('.side-item[data-mode="article"]')).display,all:document.querySelector('.side-item[data-mode="all"]')?.innerText||'',fav:document.querySelector('.side-item[data-mode="favorite"]')?.innerText||'',recent:document.querySelector('.side-item[data-mode="recent"]')?.innerText||''}));
            assert(ia.q==='none'&&ia.a==='none','LEGACY_PRIMARY_NAV_VISIBLE');assert(ia.all.includes('全部内容')&&ia.fav.includes('我的收藏')&&ia.recent.includes('最近使用'),'PRIMARY_IA_MISSING');
            for(const legacy of ['quick','article']){await page.evaluate(v=>localStorage.setItem('vftb-mode',v),legacy);await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>localStorage.getItem('vftb-mode')==='all');}
            const c=await page.evaluate(async()=>{const s=await fetch('/api.php?action=session').then(r=>r.json()),csrf=s.csrf;const post=async(a,b)=>{const r=await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)}),j=await r.json();if(!r.ok||j.ok===false)throw Error(a+JSON.stringify(j));return j};const cat=await post('category_save',{name:'V2517 浏览器验证'}),base={category_id:cat.id,description:'',tags:'',aliases:'',is_favorite:false,is_pinned:false,status:'active',attachment_ids:[]};const q=await post('content_save',{...base,title:'V2517 普通资料',content:'普通资料正文',content_mode:'quick',content_format:'plain',primary_action:'copy'}),a=await post('content_save',{...base,title:'V2517 长文资料',content:'# 长文资料\n\n真实阅读测试。',content_mode:'article',content_format:'markdown',primary_action:'read'}),e=await post('content_save',{...base,title:'V2517 编辑资料',content:'编辑测试',content_mode:'quick',content_format:'plain',primary_action:'copy'});const boot=await fetch('/api.php?action=app_bootstrap').then(r=>r.json()),recent=await fetch('/api.php?action=content_list&mode=recent&status=active&page=1&page_size=20').then(r=>r.json());return{q:q.id,a:a.id,e:e.id,setting:Number(boot.data.settings.article_open_counts_recent||0),total:Number(recent.data.pagination.total||0)}});
            assert(c.setting===0,'LEGACY_ARTICLE_OPEN_SETTING_NOT_ZERO');assert(c.total===0,'RECENT_NOT_EMPTY_INITIAL');
            await page.reload({waitUntil:'networkidle'});const qView=await openItem(c.q);await sleep(950);let r=await recent();assert(Number(r.data.pagination.total)===1&&Number(r.data.items[0].id)===Number(c.q)&&r.data.items[0].last_opened_at,'QUICK_OPEN_RECENT_FAIL');
            await sleep(1100);await page.goto(base+'/',{waitUntil:'networkidle'});const aView=await openItem(c.a);await sleep(950);r=await recent();assert(Number(r.data.pagination.total)===2&&Number(r.data.items[0].id)===Number(c.a)&&r.data.items[0].last_opened_at,'ARTICLE_OPEN_RECENT_FAIL');
            await sleep(1100);await page.goto(base+'/',{waitUntil:'networkidle'});const eView=await openMore(c.e);await page.locator('[data-edit]').first().click();await page.waitForSelector('#contentForm',{state:'visible'});await sleep(950);const hidden=await page.evaluate(()=>{const s=document.querySelector('select[name="content_mode"]');return !!(s&&s.closest('.field')&&s.closest('.field').hidden)});assert(hidden,'CONTENT_MODE_VISIBLE');r=await recent();assert(Number(r.data.pagination.total)===3&&Number(r.data.items[0].id)===Number(c.e),'EDIT_RECENT_FAIL');
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>Number(document.querySelector('#recentCount')?.textContent||0)===3);await page.click('.side-item[data-mode="recent"]');await page.waitForFunction(()=>document.body.innerText.includes('最近打开、阅读、编辑、复制或调用过的资料'));
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.click('#addContentMenuBtn');await sleep(120);const text=await page.evaluate(()=>document.body.innerText);assert(text.includes('新建资料')&&text.includes('新建长文'),'CREATE_LABEL_CONVERGENCE_FAIL');
            const mobile=await browser.newPage({viewport:{width:390,height:844}});await mobile.goto(base+'/',{waitUntil:'networkidle'});const overflow=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);assert(overflow<=1,'MOBILE_OVERFLOW_'+overflow);const mi=await mobile.evaluate(()=>({q:getComputedStyle(document.querySelector('.side-item[data-mode="quick"]')).display,a:getComputedStyle(document.querySelector('.side-item[data-mode="article"]')).display}));assert(mi.q==='none'&&mi.a==='none','MOBILE_LEGACY_NAV_VISIBLE');
            await browser.close();
            console.log('ACTUAL_QUICK_VIEW='+qView);console.log('ACTUAL_ARTICLE_VIEW='+aView);console.log('ACTUAL_EDIT_VIEW='+eView);
            console.log('PRIMARY_LIBRARY_IA=PASS');console.log('LEGACY_MODE_FALLBACK=PASS');console.log('QUICK_OPEN_RECENT=PASS');console.log('ARTICLE_OPEN_RECENT_SETTING_OFF=PASS');console.log('EDIT_RECENT=PASS');console.log('RECENT_ORDERING=PASS');console.log('VISIBLE_TERMINOLOGY_CONVERGENCE=PASS');console.log('MOBILE_390_OVERFLOW=NONE');console.log('REAL_CHROMIUM_V2517=PASS');
          })().catch(e=>{console.error(e&&e.stack||e);process.exit(1)});
          JS
          NODE_PATH="$(npm root -g)" node "$RUNNER_TEMP/test.cjs"
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO
