name: P01 V2.37.3 Manifest Gate
on:
  push:
    branches: [release/p01-v2373-strict-publish-20260902]
    paths: [.github/workflows/p01-v2373-manifest-gate-20260902.yml]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 58e3b69c1ecab7af2de26bcffdcd66eb08bf89f3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: live
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 162536f8a0fc67b4c04ba0739c4eb3e570c2c1ca
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact manifest boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 162536f8a0fc67b4c04ba0739c4eb3e570c2c1ca
          test "$(git -C candidate rev-parse HEAD^)" = 58e3b69c1ecab7af2de26bcffdcd66eb08bf89f3
          test "$(git -C candidate diff --name-only HEAD^ HEAD)" = projects/P01.json
          jq -e '.current_version=="2.37.1" and .target_version=="2.37.2" and .from_versions==["2.37.1"]' live/projects/P01.json >/dev/null
          jq -e '.enabled==true and .current_version=="2.37.2" and .target_version=="2.37.3" and .from_versions==["2.37.2"] and .update_type=="ATOMIC" and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.37.3" and .release_id==381039491 and .product_identity=="cec95e310771feb6813a51c7ee3340884295ee38" and .asset_name=="VF_Start_V2.37.3_UPDATE.zip" and .asset_bytes==1271655 and .asset_sha256=="8042c324e59136a70893b9cc839569f3fbcbbaa7184c3855e0b81c37b9556e75"' candidate/projects/P01.json >/dev/null
          ! jq -e '.from_versions|index("2.37.1")' candidate/projects/P01.json >/dev/null
      - name: Release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(gh api repos/llhzx2018/vf-start/releases/381039491)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.3
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.37.3_UPDATE.zip")|.id' <<<"$REL")"
          curl -L --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-start/releases/assets/$ID" -o /tmp/update.zip
          test "$(stat -c%s /tmp/update.zip)" = 1271655
          test "$(sha256sum /tmp/update.zip | cut -d' ' -f1)" = 8042c324e59136a70893b9cc839569f3fbcbbaa7184c3855e0b81c37b9556e75
          printf 'P01_V2373_MANIFEST_GATE=PASS\nSTRICT_HOP=2.37.2_TO_2.37.3\nCROSS_VERSION=NO\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\nRELEASE_ID=381039491\nUPDATE_BYTES=1271655\nUPDATE_SHA256=8042c324e59136a70893b9cc839569f3fbcbbaa7184c3855e0b81c37b9556e75\nOWNER_PRODUCTION_WRITE=NO\n'
