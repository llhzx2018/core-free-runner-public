name: P08 v016 Mode X GOV-DOC exact-source premerge checks
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-gov-mode-x.yml
permissions:
  contents: read
jobs:
  p08-v016-gov-doc:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-gov-mode-x-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ephemeral public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private GOV-DOC PR head with no saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 76c48af0f0dc46b102b86881b323a6e18df2bdba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
          fetch-depth: 0
      - name: Validate actual GOV-DOC exact SHA, pointer and allowed one-case changes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          test "$(git rev-parse HEAD)" = 76c48af0f0dc46b102b86881b323a6e18df2bdba
          test -z "$(git status --porcelain)"
          git diff --name-only 3c25384caeed4d14b09637321dbc3379008d92ce HEAD > "$RUNNER_TEMP/gov-pr-filelist"
          python3 -B - <<'PY'
          import pathlib
          actual=set(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'gov-pr-filelist').read_text().splitlines())
          expected={'CURRENT.md','skills/README.md','skills/skill-release/V3.23/SKILL.md',
             'governance/release/cases/P08_ADOPS_V016_PR94_PRIVATE_MEDIA_BACKUP_POST_RELEASE_OWNER_MANUAL_20261121.md'}
          assert actual==expected,(actual,expected)
          skill=pathlib.Path('skills/skill-release/V3.23/SKILL.md').read_text()
          current=pathlib.Path('CURRENT.md').read_text()
          case=pathlib.Path('governance/release/cases/P08_ADOPS_V016_PR94_PRIVATE_MEDIA_BACKUP_POST_RELEASE_OWNER_MANUAL_20261121.md').read_text()
          assert '| skill-release | V3.23 |' in current
          assert 'Mode X' in current and 'aa2613425dcb5848d9d45befa17a5b8fbc8224d0' in current
          assert 'Mode X' in skill and 'SIGKILL' in skill and 'landing-assets' in skill
          assert 'NO TAG / NO RELEASE / NO CORE-UPDATES' in case
          print('P08_V016_GOV_ONE_CASE_SCOPE_AND_POINTER=PASS')
          PY
      - name: Canonical governance current dependency and closure lints
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL,SECURITY,TESTING,UPGRADE,DATA_SCHEMA,API_PROVIDER,SEO,CRON_JOB,NOTIFICATION,OBSERVABILITY,PERFORMANCE,GIT,UA_UI
            IMPACT_REASON: New skill-release V3.23 Mode X has one-case normative release applicability across all thirteen domains without editing any sealed domain body; all existing machine/security/media/rollback requirements stay mandatory and older cases remain unchanged.
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 3c25384caeed4d14b09637321dbc3379008d92ce --git-head 76c48af0f0dc46b102b86881b323a6e18df2bdba
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 3c25384caeed4d14b09637321dbc3379008d92ce --git-head 76c48af0f0dc46b102b86881b323a6e18df2bdba
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo 'P08_V016_GOV_CLOSURE_AND_NEGATIVE_FIXTURES=PASS'
      - name: Always erase transient private GOV source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- gov "$RUNNER_TEMP/gov-pr-filelist"
          test ! -e gov
          echo 'P08_V016_GOV_PRIVATE_CLEANUP=PASS'
