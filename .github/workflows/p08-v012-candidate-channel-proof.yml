name: P08 v0.1.12 candidate channel genuine v010 PHP trust and schema proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-v012-candidate-channel-proof.yml'
permissions:
  contents: read
jobs:
  old-client-official-release-and-channel-candidate:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v012-legacy-channel-candidate-20261119' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Exact old issued v010 PHP checkout without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Exact proposed core-updates commit with schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 9b0b84be98e2a715bc51f08a16f15387605ab78b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: PHP 8.4 official old client
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Exact channel schema, official immutable actual remote release and Owner legacy source proof
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          P08_R145_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(git -C channel rev-parse HEAD)" = 9b0b84be98e2a715bc51f08a16f15387605ab78b
          python3 -B channel/scripts/check_manifest_contract.py > "$RUNNER_TEMP/r213-schema.json"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/r213-schema.json'))
          assert data['status']=='PASS',data['status']
          p=next(x for x in data['results'] if x['path']=='projects/P08-ADOPS.json')
          assert not p['failures']
          assert 'LEGACY_COMPAT_FIELD:source_full_manifest_sha256' in p['warnings']
          print('P08_R213_EXISTING_P08_PATH_SCOPED_SCHEMA_AND_GLOBAL_CONTRACT=PASS')
          PY
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.12 > "$RUNNER_TEMP/official-release.json"
          gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.12 > "$RUNNER_TEMP/official-tag.json"
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.11 --jq .id)" = 450980192
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/OwnerNextReleaseGateway.php';
          $ch=file_get_contents('channel/projects/P08-ADOPS.json');
          $rel=file_get_contents((string)getenv('RUNNER_TEMP').'/official-release.json');
          $tag=file_get_contents((string)getenv('RUNNER_TEMP').'/official-tag.json');
          $c=json_decode($ch,true,64,JSON_THROW_ON_ERROR);
          $r=json_decode($rel,true,64,JSON_THROW_ON_ERROR);
          $t=json_decode($tag,true,64,JSON_THROW_ON_ERROR);
          if($c['target_version']!=='0.1.12'||$c['from_versions']!==['0.1.10']
             ||$c['source_full_manifest_sha256']!=='efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9'
             ||$c['released_at']!==$r['published_at']
             ||$c['asset_sha256']!=='9a80f880a9cfbd22efce35383ee933766100e936fc6f99f89272237dd4e0ab56'
             ||$c['target_sha']!=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
             ||$t['object']['sha']!==$c['target_sha']
             ||$r['id']!==$c['release_id']||$r['tag_name']!=='v0.1.12'
             ||$r['draft']||$r['prerelease'])throw new RuntimeException('P08_R213_CANDIDATE_IDENTITY_FAIL');
          $assets=[];foreach($r['assets'] as $a)$assets[$a['name']]=$a;
          foreach([['asset','VF_AdOps_V0.1.12_UPDATE.zip'],['full_asset','VF_AdOps_V0.1.12_FULL.zip']] as [$key,$name]){
            $a=$assets[$name]??[];
            if(($a['id']??null)!==$c[$key.'_id']
                ||($a['size']??null)!==$c[$key.'_bytes']
                ||($a['digest']??null)!=='sha256:'.$c[$key.'_sha256'])
               throw new RuntimeException('P08_R213_OFFICIAL_ASSET_MISMATCH');
          }
          $transport=static function(string $url,string $accept)use($ch,$rel,$tag):array{
            if(str_contains($url,'contents/projects/P08-ADOPS.json'))return [200,$ch];
            if(str_contains($url,'releases/tags/v0.1.12'))return [200,$rel];
            if(str_contains($url,'git/ref/tags/v0.1.12'))return [200,$tag];
            throw new RuntimeException('P08_R213_UNKNOWN_NETWORK_SOURCE_DENIED');
          };
          $gw=new VF\AdOps\Upgrade\OwnerNextReleaseGateway($transport);
          $token='github_pat_'.str_repeat('X',40);
          $old=['version'=>'0.1.10',
            'source_sha'=>'ef78dcb21117c822e2756360280f2418f794704f',
            'source_full_manifest_sha256'=>'efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9'];
          $result=$gw->check($token,$old);
          if(($result['status']??'')!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
            ||($result['target_sha']??'')!==$c['target_sha']
            ||($result['asset_sha256']??'')!==$c['asset_sha256'])
             throw new RuntimeException('P08_R213_TRUE_OLD_PHP_PREMERGE_OFFER_REJECTED');
          echo "P08_R213_SHIPPED_OLD_PHP_CANDIDATE_OFFICIAL_RELEASE=PASS\n";
          foreach(['source_sha'=>str_repeat('f',40),
             'source_full_manifest_sha256'=>'ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110'] as $field=>$value){
              $other=$old;$other[$field]=$value;
              try{$gw->check($token,$other);throw new RuntimeException('P08_R213_WRONG_SOURCE_ACCEPTED');}
              catch(RuntimeException $e){
                if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
              }
          }
          $current=$old;$current['version']='0.1.12';$current['source_sha']=$c['target_sha'];
          if(($gw->check($token,$current)['status']??'')!=='OFFICIAL_VERSION_CURRENT')throw new RuntimeException('P08_R213_REPEAT_NOT_REJECTED');
          echo "P08_R213_CLEAN_FULL_UNKNOWN_OR_SAME_VERSION_DENIED=PASS\n";
          echo "P08_R213_CANDIDATE_ONLY_NO_CHANNEL_WRITE_NO_PRODUCTION=PASS\n";
          PHP
      - name: Remove ephemeral private checkouts and official metadata
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 channel "$RUNNER_TEMP/official-release.json" "$RUNNER_TEMP/official-tag.json"
          test ! -e p08 && test ! -e channel
          echo P08_R213_EPHEMERAL_CLEANUP=PASS
