name: TEMP S01-C02 Ops 1.21.848 URL Contract Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121848-url-contract-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
      TREE: ec87762e5a40e879857fa6e55d262343fabdabb7
      BASE: 8e4127d67d27df90d56f96ccdd86d545877d70df
      CORE_UPDATES: 7701a8db8a46ad71e194e32e55c241a75eeb1cf3
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source and Phase3
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.848'
          php -l ops/includes/release/builders/class-candidate-route-normalizer.php >/dev/null
          php -l ops/includes/release/builders/class-candidate-helper-writer.php >/dev/null
          php -l ops/includes/site-release/s01-static-final-audit-url-contract-retry-v121848.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121848-final-audit-url-contract-repair.php >/dev/null
          php ops/.github/phase3/v121848-final-audit-url-contract-repair.php | grep -Fxq 'PASS_V121848_FINAL_AUDIT_URL_CONTRACT_REPAIR'
      - name: Verify narrow diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$COMMIT")
          test "${#files[@]}" = 6
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121848-final-audit-url-contract-repair.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/release/builders/class-candidate-helper-writer.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/release/builders/class-candidate-route-normalizer.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-final-audit-url-contract-retry-v121848.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Verify Engineering authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$CORE_UPDATES"
      - name: Verify Production 1.21.847 real Final Audit boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.847" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.847" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==202 and .activeStaticJobNonAuditFailureCount==0 and .activeStaticJobInternalLinkFailureLeafCount==195 and .activeStaticJobInternalLinkUniqueTargetCount==28 and .activeStaticJobInternalLinkParsedLeafCount==195 and .activeStaticJobInternalLinkUnparsedLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobFailureSubtypeStatus=="CURRENT" and .activeStaticJobFailureSubtypeLeafCount==202 and .activeStaticJobFailureSubtypeKnownCount==202 and .activeStaticJobFailureSubtypeOtherCount==0 and .activeStaticJobFailureSubtypeCounts.internal_link_missing==195 and .activeStaticJobFailureSubtypeCounts.seo_noindex_in_sitemap==5 and .activeStaticJobFailureSubtypeCounts.seo_canonical_non_self==2' /tmp/static.json >/dev/null
          jq -e '([.activeStaticJobFailureSubtypeCounts | to_entries[] | select(.key!="internal_link_missing" and .key!="seo_noindex_in_sitemap" and .key!="seo_canonical_non_self") | .value] | add)==0' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobInternalLinkTargetFamilyCounts.known_safe_replacement.leaves==0 and .activeStaticJobInternalLinkTargetFamilyCounts.known_safe_replacement.uniqueTargets==0 and .activeStaticJobInternalLinkTargetFamilyCounts.about.leaves==0 and .activeStaticJobInternalLinkTargetFamilyCounts.about.uniqueTargets==0 and .activeStaticJobInternalLinkTargetFamilyCounts.zh.leaves==9 and .activeStaticJobInternalLinkTargetFamilyCounts.zh.uniqueTargets==9 and .activeStaticJobInternalLinkTargetFamilyCounts.archive.leaves==70 and .activeStaticJobInternalLinkTargetFamilyCounts.archive.uniqueTargets==2 and .activeStaticJobInternalLinkTargetFamilyCounts.core_tool.leaves==10 and .activeStaticJobInternalLinkTargetFamilyCounts.core_tool.uniqueTargets==2 and .activeStaticJobInternalLinkTargetFamilyCounts.blog_prefix.leaves==1 and .activeStaticJobInternalLinkTargetFamilyCounts.blog_prefix.uniqueTargets==1 and .activeStaticJobInternalLinkTargetFamilyCounts.guides_prefix.leaves==2 and .activeStaticJobInternalLinkTargetFamilyCounts.guides_prefix.uniqueTargets==2 and .activeStaticJobInternalLinkTargetFamilyCounts.other.leaves==103 and .activeStaticJobInternalLinkTargetFamilyCounts.other.uniqueTargets==12' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRootPrepareStatus=="blocked" and .sourceRecoveryRootPrepareCode=="root_prepare_active_pointer_changed" and .sourceRecoveryZeroWriteRetryStatus=="fail" and .sourceRecoveryZeroWriteRetryCode=="zero_write_retry_candidate_terminal" and .sourceRecoveryZeroWriteRetryCandidateCurrentStage==6 and .sourceRecoveryZeroWriteRetryCandidateAuditFailureCount==202' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121848_FOCUSED_GATE
