name: V5.8 Candidate Seal Builder

on:
  push:
    branches: [work/v58-manifest-regression-20260829]
    paths: ['.github/workflows/v58-manifest-regression.yml']

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOV_SHA: dfb087e412bc9c89960ee2c7c5e2af0385f5ece0
      V58_ROOT: gov/skills/skill-book/V5.8
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Build candidate identity bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          rm -rf results/v58-candidate && mkdir -p results/v58-candidate
          cat > "$V58_ROOT/SOURCE_PACKAGE_IDENTITY.md" <<'EOF'
          # skill-book V5.8 Candidate Source Package Identity

          - Version: `5.8`
          - Status: `CANDIDATE / NOT CURRENT`
          - Runtime Contract ID: `SB58-RUNTIME-CONTRACT-BF41D2E7`
          - Base Source Current: `skill-book V5.7`
          - Base gov-doc commit: `c261d7df99ebcbbe4ccd20fb69cd0f97e8c8f4df`
          - Development baseline source commit: `6555f0829f2606b493f26cf2c6b1374903108489`
          - Development baseline closure commit: `dfb087e412bc9c89960ee2c7c5e2af0385f5ece0`
          - Candidate branch: `work/skill-book-v58-reader-first-rebalance`
          - Scope: `Reader-First Rebalance / Full-Book Substance / Continuous Reading / Product Packaging`
          - Candidate Authorization: `AUTHORIZED_FOR_PRERELEASE`
          - V5.8 Candidate Release: `PENDING_PUBLICATION`
          - V5.8 Standalone A1: `NOT_RUN`
          - Fresh Isolated Blind Proxy: `NOT_RUN`
          - Real Reader Evidence: `NOT_RUN`
          - Source Current Promotion: `NOT_AUTHORIZED`
          - Current Distribution Promotion: `NOT_AUTHORIZED`
          - Historical Canonical boundary: `FIRST_FREEZE+ evaluator-only; never generation template`

          This Candidate identity is authorized only for prerelease packaging and installed-runtime testing. It does not inherit V5.7 reader evidence and does not authorize Source Current or Current Distribution promotion.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ['V58_ROOT'])
          excluded={'MANIFEST.json','SHA256SUMS.txt'}
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel in excluded: continue
              b=p.read_bytes(); rows.append((rel,len(b),hashlib.sha256(b).hexdigest()))
          basis=''.join(f'{p}  {h}\n' for p,_,h in rows)
          tree=hashlib.sha256(basis.encode()).hexdigest()
          (root/'SHA256SUMS.txt').write_text(basis,encoding='utf-8')
          m={
            'artifact_id':'SKILL-BOOK-V5.8-CANDIDATE','version':'5.8','status':'CANDIDATE_NOT_CURRENT','build_date':'2026-08-29',
            'method_lineage':'V5.7 Source Current -> V5.8 Reader-First Rebalance Candidate',
            'source_current_skill':'5.7','runtime_contract_id':'SB58-RUNTIME-CONTRACT-BF41D2E7',
            'candidate_authorization':'AUTHORIZED_FOR_PRERELEASE',
            'package_identity':{'non_manifest_file_count':len(rows),'sha256sums_path':'SHA256SUMS.txt','sha256sums_authority':'AUTHORITATIVE_FILE_INDEX','source_non_manifest_tree_sha256':tree,'source_non_manifest_tree_basis':'sorted path + two spaces + sha256 + LF; excludes MANIFEST.json and SHA256SUMS.txt'},
            'validation':{'development_baseline':'PASS','development_baseline_source_commit':'6555f0829f2606b493f26cf2c6b1374903108489','candidate_byte_regression':'PENDING_THIS_BUILD','candidate_python_compile':'PENDING_THIS_BUILD','v58_candidate_release':'PENDING_PUBLICATION','v58_standalone_a1':'NOT_RUN','fresh_isolated_blind_proxy':'NOT_RUN','real_reader_evidence':'NOT_RUN'},
            'current_promotion':'NOT_AUTHORIZED','current_distribution_promotion':'NOT_AUTHORIZED','backend_installed_runtime':'NOT_RUN','real_reader_evidence':'NOT_RUN','historical_canonical_policy':'FIRST_FREEZE_PLUS_EVALUATOR_ONLY_NOT_GENERATION_TEMPLATE'
          }
          (root/'MANIFEST.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CANDIDATE_TREE_SHA256='+tree)
          print('CANDIDATE_NON_MANIFEST_FILES='+str(len(rows)))
          PY
      - name: Candidate exact-byte regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$V58_ROOT"
          python3 -m unittest discover -s tests -p 'test_*.py' -v > "$GITHUB_WORKSPACE/results/v58-candidate/UNITTEST.txt" 2>&1
          python3 -m compileall -q scripts tests
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          grep -q 'Ran 100 tests' "$GITHUB_WORKSPACE/results/v58-candidate/UNITTEST.txt"
          grep -q '^OK$' "$GITHUB_WORKSPACE/results/v58-candidate/UNITTEST.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('MANIFEST.json'); m=json.loads(p.read_text())
          m['validation']['candidate_byte_regression']='100/100 PASS'
          m['validation']['candidate_python_compile']='PASS'
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Verify and package candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          root=Path(os.environ['V58_ROOT']); out=Path('results/v58-candidate')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel in {'MANIFEST.json','SHA256SUMS.txt'}: continue
              rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          basis=''.join(f'{p}  {h}\n' for p,h in rows); tree=hashlib.sha256(basis.encode()).hexdigest()
          assert (root/'SHA256SUMS.txt').read_text()==basis
          m=json.loads((root/'MANIFEST.json').read_text())
          assert m['artifact_id']=='SKILL-BOOK-V5.8-CANDIDATE'
          assert m['status']=='CANDIDATE_NOT_CURRENT'
          assert m['runtime_contract_id']=='SB58-RUNTIME-CONTRACT-BF41D2E7'
          assert m['package_identity']['source_non_manifest_tree_sha256']==tree
          assert m['validation']['candidate_byte_regression']=='100/100 PASS'
          assert m['validation']['v58_standalone_a1']=='NOT_RUN'
          assert m['validation']['fresh_isolated_blind_proxy']=='NOT_RUN'
          assert m['real_reader_evidence']=='NOT_RUN'
          for name in ['SOURCE_PACKAGE_IDENTITY.md','MANIFEST.json','SHA256SUMS.txt']:
              (out/name).write_bytes((root/name).read_bytes())
          z=out/'skill-book_V5.8_CANDIDATE_20260829.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as zz:
              for p in sorted(x for x in root.rglob('*') if x.is_file()): zz.write(p,p.relative_to(root).as_posix())
          zh=hashlib.sha256(z.read_bytes()).hexdigest()
          (out/(z.name+'.sha256')).write_text(f'{zh}  {z.name}\n')
          receipt={'input_source_commit':os.environ['GOV_SHA'],'tree_sha256':tree,'non_manifest_file_count':len(rows),'zip_bytes':z.stat().st_size,'zip_sha256':zh,'candidate_regression':'100/100 PASS','compile':'PASS','standalone_a1':'NOT_RUN','fresh_blind_proxy':'NOT_RUN','real_reader':'NOT_RUN'}
          (out/'CANDIDATE_BUILD_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Commit candidate builder evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Runner'; git config user.email 'vf-runner@users.noreply.github.com'
          git add results/v58-candidate
          git commit -m 'build: V5.8 candidate seal bytes' || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: skill-book-v58-candidate-20260829
          path: |
            results/v58-candidate/skill-book_V5.8_CANDIDATE_20260829.zip
            results/v58-candidate/skill-book_V5.8_CANDIDATE_20260829.zip.sha256
            results/v58-candidate/CANDIDATE_BUILD_RECEIPT.json
