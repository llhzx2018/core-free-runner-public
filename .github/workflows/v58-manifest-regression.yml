name: V5.8 Final Identity + Regression Verify

on:
  push:
    branches:
      - work/v58-manifest-regression-20260829
    paths:
      - '.github/workflows/v58-manifest-regression.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOV_SHA: 6555f0829f2606b493f26cf2c6b1374903108489
      V58_ROOT: gov/skills/skill-book/V5.8
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require registered read capability
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }

      - name: Checkout runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout exact GOV-DOC source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Verify final package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf results/v58-final && mkdir -p results/v58-final
          cd "$V58_ROOT"
          test "$(git rev-parse HEAD)" = "$GOV_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, sys
          root=Path('.')
          excluded={'MANIFEST.json','SHA256SUMS.txt'}
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              rel=p.relative_to(root).as_posix()
              if rel in excluded: continue
              rows.append((rel, hashlib.sha256(p.read_bytes()).hexdigest()))
          basis=''.join(f'{p}  {h}\n' for p,h in rows)
          tree=hashlib.sha256(basis.encode()).hexdigest()
          checked=(root/'SHA256SUMS.txt').read_text(encoding='utf-8')
          m=json.loads((root/'MANIFEST.json').read_text(encoding='utf-8'))
          checks={
            'sha256sums_exact': checked == basis,
            'file_count': len(rows) == 108,
            'tree_sha': tree == '415f2f8b166b097e149890a9cd67cbcc32014db29cb1f8fd37773b4df6c31da4',
            'manifest_version': m.get('version') == '5.8',
            'manifest_artifact': m.get('artifact_id') == 'SKILL-BOOK-V5.8-CANDIDATE-DEVELOPMENT',
            'runtime_contract': m.get('runtime_contract_id') == 'SB58-RUNTIME-CONTRACT-BF41D2E7',
            'manifest_tree': m.get('package_identity',{}).get('source_non_manifest_tree_sha256') == tree,
            'manifest_file_count': m.get('package_identity',{}).get('non_manifest_file_count') == 108,
            'candidate_release_not_run': m.get('validation',{}).get('v58_candidate_release') == 'NOT_RUN',
            'standalone_not_run': m.get('validation',{}).get('v58_standalone_a1') == 'NOT_RUN',
            'blind_proxy_not_run': m.get('validation',{}).get('fresh_isolated_blind_proxy') == 'NOT_RUN',
            'real_reader_not_run': m.get('real_reader_evidence') == 'NOT_RUN',
            'promotion_not_authorized': m.get('current_promotion') == 'NOT_AUTHORIZED'
          }
          result={'gov_sha':os.environ['GOV_SHA'],'non_manifest_file_count':len(rows),'tree_sha256':tree,'checks':checks,'identity_pass':all(checks.values())}
          out=Path(os.environ['GITHUB_WORKSPACE'])/'results/v58-final/IDENTITY.json'
          out.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Run final V5.8 unittest regression
        shell: bash
        run: |
          set +e
          cd "$V58_ROOT"
          python3 -m unittest discover -s tests -p 'test_*.py' -v > "$GITHUB_WORKSPACE/results/v58-final/UNITTEST.txt" 2>&1
          RC=$?
          echo "$RC" > "$GITHUB_WORKSPACE/results/v58-final/UNITTEST_EXIT_CODE.txt"
          tail -n 8 "$GITHUB_WORKSPACE/results/v58-final/UNITTEST.txt"
          exit 0

      - name: Compile final V5.8 Python
        shell: bash
        run: |
          set +e
          python3 -m compileall -q "$V58_ROOT/scripts" "$V58_ROOT/tests" > results/v58-final/COMPILE.txt 2>&1
          RC=$?
          echo "$RC" > results/v58-final/COMPILE_EXIT_CODE.txt
          exit 0

      - name: Commit final verifier evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Runner'
          git config user.email 'vf-runner@users.noreply.github.com'
          git add results/v58-final
          git commit -m "verify: final V5.8 identity and regression for ${GOV_SHA}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce final result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat results/v58-final/UNITTEST_EXIT_CODE.txt)" = '0'
          test "$(cat results/v58-final/COMPILE_EXIT_CODE.txt)" = '0'
          grep -q '"identity_pass": true' results/v58-final/IDENTITY.json
          echo 'V58_FINAL_IDENTITY_AND_REGRESSION=PASS'
