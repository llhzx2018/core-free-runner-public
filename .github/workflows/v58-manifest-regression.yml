name: V5.8 Candidate Prerelease Publisher

on:
  push:
    branches: [work/v58-manifest-regression-20260829]
    paths: ['.github/workflows/v58-manifest-regression.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOV_REPO: llhzx2018/gov-doc
      SOURCE_RUNNER_REPO: llhzx2018/core-free-runner-public
      SOURCE_RUN_ID: '33292968009'
      SOURCE_ARTIFACT: skill-book-v58-candidate-20260829-authorized
      V58_CANDIDATE_SOURCE: 02afc3ad57f04cf466d79664721c677571ca65b4
      RELEASE_TAG: skill-book-v5.8-candidate-20260829
      RELEASE_TITLE: skill-book V5.8 Candidate · 2026-08-29
      ZIP_NAME: skill-book_V5.8_CANDIDATE_20260829.zip
      ZIP_BYTES: '194440'
      ZIP_SHA256: f36bf528c373a90eb83e7e7c7b7dd00482bb75d395d7d7cd1573efe509dbe6ec
      TREE_SHA256: 5ecf2a401f3f297913c7bf52b7e2a3d1babaf2d372383c00ea7be7092ef019f1
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require release capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"

      - name: Download exact successful Candidate artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir artifact
          GH_TOKEN="$RUNNER_GITHUB_TOKEN" gh run download "$SOURCE_RUN_ID" --repo "$SOURCE_RUNNER_REPO" --name "$SOURCE_ARTIFACT" --dir artifact
          test -f "artifact/$ZIP_NAME"
          test -f "artifact/$ZIP_NAME.sha256"
          test -f "artifact/CANDIDATE_BUILD_RECEIPT.json"
          test -f "artifact/CANDIDATE_SOURCE_COMMIT.txt"
          test "$(cat artifact/CANDIDATE_SOURCE_COMMIT.txt)" = "$V58_CANDIDATE_SOURCE"
          test "$(stat -c %s "artifact/$ZIP_NAME")" = "$ZIP_BYTES"
          got="$(sha256sum "artifact/$ZIP_NAME" | awk '{print $1}')"
          test "$got" = "$ZIP_SHA256"
          grep -qx "$ZIP_SHA256  $ZIP_NAME" "artifact/$ZIP_NAME.sha256"
          python3 - <<'PY'
          import json,os
          d=json.load(open('artifact/CANDIDATE_BUILD_RECEIPT.json'))
          assert d['authorization_source_commit']=='c3efb873d5795ba65f71b99d1894c124bcb257cf'
          assert d['tree_sha256']==os.environ['TREE_SHA256']
          assert d['non_manifest_file_count']==108
          assert d['zip_bytes']==int(os.environ['ZIP_BYTES'])
          assert d['zip_sha256']==os.environ['ZIP_SHA256']
          assert d['candidate_regression']=='100/100 PASS'
          assert d['compile']=='PASS'
          assert d['standalone_a1']=='NOT_RUN'
          assert d['fresh_blind_proxy']=='NOT_RUN'
          assert d['real_reader']=='NOT_RUN'
          print('V58_RELEASE_ARTIFACT_IDENTITY=PASS')
          PY

      - name: Verify exact Candidate source and package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh api "repos/$GOV_REPO/commits/$V58_CANDIDATE_SOURCE" --jq '.sha')" = "$V58_CANDIDATE_SOURCE"
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh api "repos/$GOV_REPO/contents/skills/skill-book/V5.8/MANIFEST.json?ref=$V58_CANDIDATE_SOURCE" --jq '.content' | tr -d '\n' | base64 -d > /tmp/manifest.json
          python3 - <<'PY'
          import json,os
          m=json.load(open('/tmp/manifest.json'))
          assert m['artifact_id']=='SKILL-BOOK-V5.8-CANDIDATE'
          assert m['version']=='5.8'
          assert m['status']=='CANDIDATE_NOT_CURRENT'
          assert m['runtime_contract_id']=='SB58-RUNTIME-CONTRACT-BF41D2E7'
          assert m['candidate_authorization']=='AUTHORIZED_FOR_PRERELEASE'
          assert m['package_identity']['source_non_manifest_tree_sha256']==os.environ['TREE_SHA256']
          assert m['validation']['candidate_byte_regression']=='100/100 PASS'
          assert m['validation']['candidate_python_compile']=='PASS'
          assert m['validation']['v58_candidate_release']=='PENDING_PUBLICATION'
          assert m['validation']['v58_standalone_a1']=='NOT_RUN'
          assert m['validation']['fresh_isolated_blind_proxy']=='NOT_RUN'
          assert m['real_reader_evidence']=='NOT_RUN'
          assert m['current_promotion']=='NOT_AUTHORIZED'
          assert m['current_distribution_promotion']=='NOT_AUTHORIZED'
          print('V58_RELEASE_SOURCE_IDENTITY=PASS')
          PY

      - name: Guard against duplicate release
        shell: bash
        run: |
          set -Eeuo pipefail
          if GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release view "$RELEASE_TAG" --repo "$GOV_REPO" >/dev/null 2>&1; then
            echo 'V58_RELEASE_TAG_ALREADY_EXISTS_BLOCK'
            exit 9
          fi

      - name: Publish V5.8 Candidate prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          skill-book V5.8 Candidate · Reader-First Rebalance

          Candidate scope:
          - FULL_BOOK substance before shell metrics
          - continuous reading value across the whole book
          - READ / LEARN / TRAIN / DO closure
          - reader-facing product packaging before evidence presentation

          Candidate engineering evidence:
          - exact Candidate package identity: PASS
          - exact Candidate regression: 100/100 PASS
          - exact Candidate Python compile: PASS
          - Candidate ZIP identity: PASS

          Authority boundary:
          - V5.8 SEALED Standalone Forward: NOT_RUN
          - Fresh Isolated Blind Proxy: NOT_RUN
          - Real Reader Evidence: NOT_RUN
          - Source Current remains V5.7
          - Source Current promotion: NOT_AUTHORIZED
          - Current Distribution promotion: NOT_AUTHORIZED

          This prerelease authorizes installation and fresh V5.8 runtime testing only. Engineering PASS does not constitute Reader Outcome PASS.
          EOF
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release create "$RELEASE_TAG" \
            --repo "$GOV_REPO" \
            --target "$V58_CANDIDATE_SOURCE" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/notes.md \
            --prerelease \
            "artifact/$ZIP_NAME" \
            "artifact/$ZIP_NAME.sha256"
          echo 'V58_CANDIDATE_PRERELEASE_CREATED=PASS'

      - name: Remote release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          GH_TOKEN="$VF_RELEASE_WRITE_TOKEN" gh release view "$RELEASE_TAG" --repo "$GOV_REPO" --json tagName,name,isPrerelease,targetCommitish,assets > /tmp/release.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/release.json'))
          assert d['tagName']==os.environ['RELEASE_TAG']
          assert d['name']==os.environ['RELEASE_TITLE']
          assert d['isPrerelease'] is True
          assert d['targetCommitish']==os.environ['V58_CANDIDATE_SOURCE']
          names={a['name']:a for a in d['assets']}
          z=os.environ['ZIP_NAME']
          assert z in names and z+'.sha256' in names
          assert int(names[z]['size'])==int(os.environ['ZIP_BYTES'])
          print('V58_RELEASE_REMOTE_READBACK=PASS')
          print('V58_RELEASE_ZIP_ASSET_ID='+str(names[z].get('id','UNKNOWN')))
          print('V58_RELEASE_SHA_ASSET_ID='+str(names[z+'.sha256'].get('id','UNKNOWN')))
          PY
