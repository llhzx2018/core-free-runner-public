name: TEMP S01-C02 Ops 1.21.848 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121848-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
      TREE: ec87762e5a40e879857fa6e55d262343fabdabb7
      TAG: v1.21.848
      ASSET: vf-tools-ops_V1.21.848.zip
      BYTES: '3325498'
      SHA256: 930adaf339fc1e47dfb84c056d548f5ca818cf5233eefc60d71c48b26570bfdc
      FILES: '930'
      FP: 9303955a7d048b61603c300aa202fecb81bb97c346127dcfbd690bfe44d81b8c
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.848
          php ops/.github/phase3/v121848-final-audit-url-contract-repair.php | grep -Fxq PASS_V121848_FINAL_AUDIT_URL_CONTRACT_REPAIR
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.848 repairs the genuine Production Stage-6 Final Audit URL-contract failures exposed after the bounded Candidate successfully completed its full build.

          - Focused Gate 34013107690 PASS on exact source 7f0f6808c7a9fa076c58cf87776666fbdf38be6d / tree ec87762e5a40e879857fa6e55d262343fabdabb7.
          - Deterministic Artifact Identity 34013136587 PASS.
          - Production V1.21.847 proves the active Candidate reached Stage 6 and failed only Final Audit with 202 known failures: 195 internal-link leaves over 28 unique targets, 5 noindex pages included in sitemap, and 2 non-self canonicals; all other failure subtypes are zero.
          - Candidate URL repair now covers the same route-bearing HTML/SEO/JSON-LD surfaces audited by Final Audit. Missing internal page targets are uniquely relocated when provable; otherwise invalid clickable links are safely unlinked and invalid optional metadata URLs are removed. Missing core-tool routes are never guessed or redirected to another tool.
          - Page identity is normalized from the actual output entry so canonical and page-scoped OG/JSON-LD URLs are self-consistent with the final Candidate route.
          - Sitemap generation filters noindex HTML from actual Candidate ZIP bytes in the real closed-and-reopened helper lifecycle, instead of blindly including every index.html entry.
          - Recovery activates only on the exact terminal Stage-6 Production signature: 202 total audit failures, 195 internal-link failures, 5 noindex-in-sitemap failures, 2 non-self canonical failures, exact target-family counts, zero unknown subtypes, trusted inspection lineage and immutable Source SHA.
          - Existing failed Candidate is never reset or reused. Only after proof is the record rebound to the trusted inspect-only job and a distinct fresh Candidate created and delegated to the existing bounded worker.
          - Static Source is not uploaded or mutated. Final Audit, candidatePackageReady, DNS and finalOnline remain normal downstream gates and are never forced.
          - M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid and content governance remain untouched.
          - Asset vf-tools-ops_V1.21.848.zip; 3325498 bytes; SHA256 930adaf339fc1e47dfb84c056d548f5ca818cf5233eefc60d71c48b26570bfdc; runtime files 930; fingerprint 9303955a7d048b61603c300aa202fecb81bb97c346127dcfbd690bfe44d81b8c.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.848' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121848=PASS
