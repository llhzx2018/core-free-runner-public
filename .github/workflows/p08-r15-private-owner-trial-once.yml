name: P08 private Git owner-trial FULL delivery (not a Release)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r15-private-owner-trial-once.yml'
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 2989ddd1a32aeb2d85e73dc13ccdda0eb98cb15c
      EXPECTED_SHA256: 4ede13676a26552a4e2c49789c310178337988cc3934bdaf647626654e800b84
      TRIAL_BRANCH: owner-trial/p08-0.1.0-first-full-20261111
      PRODUCT_REPO: llhzx2018/vf-adops
    steps:
      - name: Read exact source in temporary checkout, never public artifact
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-adops
          ref: 2989ddd1a32aeb2d85e73dc13ccdda0eb98cb15c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Verify tested exact candidate and private repo identity
        run: |
          set -euo pipefail
          test "$(git -C private-product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat private-product/VERSION)" = "0.1.0"
          python3 - <<'PY'
          import json
          d=json.load(open('private-product/VF_PROJECT.json'))
          assert d['project_id']=='P08' and d['repository']=='llhzx2018/vf-adops'
          PY
      - name: PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild EXACT source-bound private trial ZIP
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-owner-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-owner-npm.log" 2>&1
          npm run build
          python3 scripts/check_stack_contract.py --phase full
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip" --version 0.1.0 --source-sha "$SOURCE_SHA"
          actual="$(sha256sum "$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "P08_OWNER_TRIAL_REBUILD_SAME_SHA256=PASS"
      - name: Publish ONLY to a non-main branch of the existing PRIVATE product repo
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          cat > "$RUNNER_TEMP/p08-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf 'x-access-token';;
            *Password*) printf '%s' "$VF_RELEASE_WRITE_TOKEN";;
            *) exit 1;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/p08-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/p08-askpass.sh" GIT_TERMINAL_PROMPT=0
          remote="https://github.com/$PRODUCT_REPO.git"
          if [ -n "$(git ls-remote "$remote" "refs/heads/$TRIAL_BRANCH")" ]; then
            echo P08_OWNER_TRIAL_BRANCH_ALREADY_EXISTS_NO_OVERWRITE
            exit 1
          fi
          trial="$RUNNER_TEMP/p08-private-trial"
          mkdir "$trial"
          cd "$trial"
          git init -q --initial-branch=private-trial-build
          git config user.name "VF AdOps Trial Builder"
          git config user.email "noreply@kewaro.com"
          cp "$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip" .
          printf '%s  %s\n' "$EXPECTED_SHA256" "P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip" > SHA256SUMS
          cat > README.md <<'NOTES'
          # P08 VF AdOps 0.1.0 — Owner manual trial ONLY

          This branch contains a real, independently built Clean FULL ZIP.
          It is NOT a GitHub Release, updater channel, Atomic package, or
          approved Production deployment. Private source only, no user data.
          Clean NEW CloudPanel site only. Do NOT overwrite an installed site.

          Git source tested: 2989ddd1a32aeb2d85e73dc13ccdda0eb98cb15c
          SHA-256 (ZIP): 4ede13676a26552a4e2c49789c310178337988cc3934bdaf647626654e800b84
          P08 candidate PR: https://github.com/llhzx2018/vf-adops/pull/20

          Verified in isolated PHP/SQLite/Chromium and direct three-DB snapshot
          tests. CloudPanel HTTPS site first-install and Atomic are still
          separate, unproven user/environment gates. Owner chooses whether
          to manually try this isolated candidate.
          NOTES
          git add -- P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip SHA256SUMS README.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -qm "trial(P08): sealed private 0.1.0 FULL Owner manual install candidate"
          git push "$remote" "HEAD:refs/heads/$TRIAL_BRANCH"
          echo "P08_PRIVATE_OWNER_TRIAL_COMMIT=$(git rev-parse HEAD)"
          echo "P08_PRIVATE_OWNER_TRIAL_DELIVERED=YES"
      - name: Clean private source and temporary package on every result
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-private-trial"
          rm -f "$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-OWNER-TRIAL.zip" "$RUNNER_TEMP/p08-owner-composer.log" "$RUNNER_TEMP/p08-owner-npm.log" "$RUNNER_TEMP/p08-askpass.sh"
