name: TEMP S01-C03 Export Exact v1.25.6 ZIP

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-export-v1.25.6.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      RELEASE_ASSET_API: https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/assets/541518805
      EXPECTED_BYTES: '3529423'
      EXPECTED_SHA256: 9debe63077c3b8b939795d29e5cab9649149247c13feb99f3d96f1f6a3ea2106
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Download immutable formal Release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          curl --fail --silent --show-error --location --max-time 120 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_ASSET_API" \
            -o vf-tools-m3u8_V1.25.6.zip

      - name: Assert exact formal Release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BYTES=$(stat -c '%s' vf-tools-m3u8_V1.25.6.zip)
          SHA=$(sha256sum vf-tools-m3u8_V1.25.6.zip | awk '{print $1}')
          FILES=$(unzip -Z1 vf-tools-m3u8_V1.25.6.zip | sed '/\/$/d' | wc -l | tr -d ' ')
          test "$BYTES" = "$EXPECTED_BYTES"
          test "$SHA" = "$EXPECTED_SHA256"
          test "$FILES" = '550'
          printf 'file_count=%s\nbytes=%s\nsha256=%s\nsource=%s\nasset_id=541518805\n' "$FILES" "$BYTES" "$SHA" "$PRODUCT_SHA" > zip-identity.txt
          echo 'FORMAL_ZIP_EXACT_IDENTITY=PASS'

      - name: Upload exact manual-upgrade ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vf-tools-m3u8_V1.25.6-manual-upgrade
          path: |
            vf-tools-m3u8_V1.25.6.zip
            zip-identity.txt
          if-no-files-found: error
          retention-days: 7
