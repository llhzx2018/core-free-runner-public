name: TEMP S01-C03 Export Exact v1.25.6 ZIP

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-export-v1.25.6.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      EXPECTED_BYTES: '3529423'
      EXPECTED_SHA256: 9debe63077c3b8b939795d29e5cab9649149247c13feb99f3d96f1f6a3ea2106
    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Build deterministic formal ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, stat, zipfile
          src = pathlib.Path('product/src')
          out = pathlib.Path('vf-tools-m3u8_V1.25.6.zip')
          fixed = (2026, 9, 2, 0, 0, 0)
          files = sorted(p for p in src.rglob('*') if p.is_file())
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9, allowZip64=True) as z:
              for p in files:
                  rel = p.relative_to(src).as_posix()
                  zi = zipfile.ZipInfo('vf-tool-m3u8/' + rel, fixed)
                  zi.create_system = 3
                  zi.external_attr = (stat.S_IFREG | 0o644) << 16
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  with p.open('rb') as fh:
                      z.writestr(zi, fh.read(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          b = out.stat().st_size
          s = hashlib.sha256(out.read_bytes()).hexdigest()
          print(f'FILE_COUNT={len(files)}')
          print(f'ZIP_BYTES={b}')
          print(f'ZIP_SHA256={s}')
          pathlib.Path('zip-identity.txt').write_text(f'file_count={len(files)}\nbytes={b}\nsha256={s}\n', encoding='utf-8')
          PY

      - name: Assert exact formal Release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BYTES=$(stat -c '%s' vf-tools-m3u8_V1.25.6.zip)
          SHA=$(sha256sum vf-tools-m3u8_V1.25.6.zip | awk '{print $1}')
          test "$BYTES" = "$EXPECTED_BYTES"
          test "$SHA" = "$EXPECTED_SHA256"
          echo 'FORMAL_ZIP_EXACT_IDENTITY=PASS'

      - name: Upload exact manual-upgrade ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vf-tools-m3u8_V1.25.6-manual-upgrade
          path: |
            vf-tools-m3u8_V1.25.6.zip
            zip-identity.txt
          if-no-files-found: error
          retention-days: 7
