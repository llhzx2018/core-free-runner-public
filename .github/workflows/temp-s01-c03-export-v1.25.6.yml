name: TEMP S01-C03 Export Exact v1.25.6 ZIP

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-export-v1.25.6.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 595f5b65ee1eb4ad75ed3a880a733e1f765060ed
      EXPECTED_BYTES: '3529423'
      EXPECTED_SHA256: 9debe63077c3b8b939795d29e5cab9649149247c13feb99f3d96f1f6a3ea2106
    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Build with canonical deterministic package helper
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/m3u8-package"
          python3 product/tests/wp-update/build_packages.py --repo "$GITHUB_WORKSPACE/product" --out "$RUNNER_TEMP/m3u8-package" > "$RUNNER_TEMP/package-meta.json"
          mv "$RUNNER_TEMP/m3u8-package/vf-tools-m3u8_V1.25.1.zip" vf-tools-m3u8_V1.25.6.zip
          rm -f "$RUNNER_TEMP/m3u8-package/vf-tools-m3u8_V1.25.2-fixture.zip"
          BYTES=$(stat -c '%s' vf-tools-m3u8_V1.25.6.zip)
          SHA=$(sha256sum vf-tools-m3u8_V1.25.6.zip | awk '{print $1}')
          FILES=$(unzip -Z1 vf-tools-m3u8_V1.25.6.zip | sed '/\/$/d' | wc -l | tr -d ' ')
          printf 'file_count=%s\nbytes=%s\nsha256=%s\nsource=%s\n' "$FILES" "$BYTES" "$SHA" "$PRODUCT_SHA" > zip-identity.txt
          echo "FILE_COUNT=$FILES"
          echo "ZIP_BYTES=$BYTES"
          echo "ZIP_SHA256=$SHA"

      - name: Assert exact formal Release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          BYTES=$(stat -c '%s' vf-tools-m3u8_V1.25.6.zip)
          SHA=$(sha256sum vf-tools-m3u8_V1.25.6.zip | awk '{print $1}')
          test "$BYTES" = "$EXPECTED_BYTES"
          test "$SHA" = "$EXPECTED_SHA256"
          echo 'FORMAL_ZIP_EXACT_IDENTITY=PASS'

      - name: Upload exact manual-upgrade ZIP
        uses: actions/upload-artifact@v4
        with:
          name: vf-tools-m3u8_V1.25.6-manual-upgrade
          path: |
            vf-tools-m3u8_V1.25.6.zip
            zip-identity.txt
          if-no-files-found: error
          retention-days: 7
