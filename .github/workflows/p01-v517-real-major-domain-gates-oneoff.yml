name: P01 517 authentic v516 worker fail closed and final native 3DB domain gates
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  d60-real-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm original P01 and public-safe transient source lane
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-v517-real-major-domain-gates-20261119"
          test -n "$PRIVATE_READ"
          echo "P01_D60_SCOPE=THREE_REAL_DATABASE_SELECTED_ENGINE_FULL_LARAVEL_OWNER_CANONICAL_HTTP"
          echo "P01_PRODUCTION_OR_RELEASE_WRITES=NONE"
      - name: Exact PRIVATE source in temporary self-cleaning workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c00f54bed0fa3521a3c57bfcd591745fb45db776
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify source and native HTTP probe syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "c00f54bed0fa3521a3c57bfcd591745fb45db776"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          test -f candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d4[5-9]*_http.py candidate/tests/compatibility/laravel/http/run_d50_owner_projects_http.py
          php -l candidate/src/app/next/OwnerResourceCenter.php > "$RUNNER_TEMP/d60-lint.txt"
          php -l candidate/src/app/next/http/OwnerHttpRoutes.php > "$RUNNER_TEMP/d60-route-lint.txt"
          echo "P01_D60_EXACT_SOURCE=c00f54bed0fa3521a3c57bfcd591745fb45db776"
          echo "P01_D60_SYNTAX_AND_TARGET_IDENTITY=PASS"
      - name: Install real native TLS Nginx PHP-FPM plus locked Composer environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d60-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            composer openssl unzip >> "$RUNNER_TEMP/d60-apt.txt" 2>&1
          command -v php-fpm8.3
          command -v nginx
          command -v composer
          echo "P01_D60_NATIVE_HTTPS_FPM_RUNTIME_READY=PASS"
      - name: Single genuine complete Composer plus Vite packaged CloudPanel FULL, source-bound
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha c00f54bed0fa3521a3c57bfcd591745fb45db776 \
            --output "$RUNNER_TEMP/d60-full.zip" --composer composer \
            > "$RUNNER_TEMP/d60-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/d60-full.zip" \
            > "$RUNNER_TEMP/d60-build-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/d60-full.zip" \
            --output "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d60-cloudpanel.zip"
          echo "P01_D60_ONE_COMPLETE_CLOUDPANEL_FULL_PACKAGE=PASS"
      - name: Genuine published v516 FULL to verified v517 official-shaped FULL and MAJOR stage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api 'repos/llhzx2018/vf-start/git/ref/tags/v2.47.516' --jq '.object.sha')" = ab49e83c4715cc9246c4333679fc5388e554cc98
          gh api 'repos/llhzx2018/vf-start/releases/tags/v2.47.516' > "$RUNNER_TEMP/p01-v516-release.json"
          jq -e '.id==450865608 and .tag_name=="v2.47.516" and .draft==false and .prerelease==false' "$RUNNER_TEMP/p01-v516-release.json" >/dev/null
          jq -e '.assets | any(.id==766156722 and .name=="VF-Start-V2.47.516-FULL.zip" and .size==1874648 and .digest=="sha256:016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce")' "$RUNNER_TEMP/p01-v516-release.json" >/dev/null
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP" -p 'VF-Start-V2.47.516-FULL.zip' > "$RUNNER_TEMP/v516-download.txt" 2>&1
          test "$(sha256sum "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip" | cut -d' ' -f1)" = 016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce
          test "$(stat -c %s "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip")" = 1874648
          echo P01_V517_STAGING_USES_GENUINE_RELEASED_516_FULL_IDENTITY=PASS
          STAGE="/tmp/p01-major-release-stage-$(openssl rand -hex 10)"
          mkdir -m 700 "$STAGE"
          trap 'rm -rf -- "$STAGE"' EXIT
          P01_MAJOR_RELEASE_STAGE_ISOLATED=YES php -r '
            require "candidate/src/app/next/runtime/MajorUnsignedReleaseStage.php";
            $r=VfNextMajorUnsignedReleaseStage::stage($argv[1],$argv[2],$argv[3],$argv[4]);
            if(($r["status"]??null)!=="UNSIGNED_MAJOR_CANDIDATE_SEALED_NOT_EXECUTABLE"
              ||($r["owner_execution_authorized"]??true)!==false
              ||($r["production_modified"]??true)!==false
              ||($r["github_release_asset_verified"]??true)!==false)exit(42);
            echo "P01_V517_STAGED_FULL_AND_MAJOR_SOURCE_LEDGER=PASS\n";
          ' "$RUNNER_TEMP/d60-cloudpanel.zip" "$STAGE" "c00f54bed0fa3521a3c57bfcd591745fb45db776" 016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce
          cp -- "$STAGE/UNSIGNED-CLOUDPANEL-LARAVEL-FULL.zip" "$RUNNER_TEMP/d60-official-full.zip"
          php -r '
            require "candidate/src/app/next/runtime/MajorInnerFullIntegrity.php";
            require "candidate/src/app/next/runtime/CloudPanelPackageIdentity.php";
            $z=new ZipArchive();if($z->open($argv[1],ZipArchive::RDONLY)!==true)exit(51);
            $raw=$z->getFromName("BUILD-MANIFEST.json");$z->close();
            if(!is_string($raw))exit(52);
            $m=json_decode($raw,true,64,JSON_THROW_ON_ERROR);
            $check=VfNextMajorInnerFullIntegrity::verify($argv[1],$argv[2],hash("sha256",$raw));
            if(!VfNextCloudPanelPackageIdentity::trustedReadiness($m)
              ||($check["readiness"]??null)!=="OFFICIAL_SIGNED_FULL_STAGED"
              ||($check["source_sha"]??null)!==$argv[2]
              ||($check["owner_execute_enabled"]??true)!==false)exit(53);
            echo "P01_V517_OFFICIAL_SHAPED_FULL_ALL_MEMBERS_AND_RUNTIME_IDENTITY=PASS\n";
          ' "$RUNNER_TEMP/d60-official-full.zip" "c00f54bed0fa3521a3c57bfcd591745fb45db776"
          php candidate/tests/unit/p01_d37_official_full_readiness_native.php
          echo 'P01_OFFICIAL_FULL_ISOLATED_HTTP=YES' >> "$GITHUB_ENV"
          echo P01_V517_RELEASE_STAGE_ONLY_NO_PUBLICATION_OR_CUTOVER=PASS
      - name: Checkout one-off public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: test/p01-v517-real-major-domain-gates-20261119
          persist-credentials: false
          path: runner-harness
      - name: Verify source and executable isolated test probes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = c00f54bed0fa3521a3c57bfcd591745fb45db776
          python3 -B -m py_compile \
            runner-harness/scripts/ephemeral/p01_v516_official_worker_failclosed.py \
            runner-harness/scripts/ephemeral/p01_v517_three_engine_domain_gate.py
          test -f "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip"
          test -f "$RUNNER_TEMP/d60-official-full.zip"
          echo P01_V517_EXACT_FINAL_SOURCE_AND_ISSUED_516=PASS
      - name: Actual issued 516 FULL Owner installed, unauthorized MAJOR CLI fail closed
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            runner-harness/scripts/ephemeral/p01_v516_official_worker_failclosed.py \
            > "$RUNNER_TEMP/p01-516-worker-denial.txt" 2>&1 || {
              grep -E '^(AssertionError:|Traceback|P01_|Error:)' \
                "$RUNNER_TEMP/p01-516-worker-denial.txt" | tail -n 35 || true
              exit 1
            }
          grep '^P01_.*=PASS$' "$RUNNER_TEMP/p01-516-worker-denial.txt"
          grep -Fx P01_ISSUED_V516_ACTUAL_INSTALLED_APPLY_WORKER_FAIL_CLOSED=PASS \
            "$RUNNER_TEMP/p01-516-worker-denial.txt"
          grep -Fx P01_ISSUED_V516_OLD_DB_OWNER_AND_RUNTIME_SURVIVE_NO_RELEASE=PASS \
            "$RUNNER_TEMP/p01-516-worker-denial.txt"
      - name: Three true databases HTTPS private SEO provider RSS SSRF jobs crash schedules
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 \
            runner-harness/scripts/ephemeral/p01_v517_three_engine_domain_gate.py \
            > "$RUNNER_TEMP/p01-v517-domains.txt" 2>&1 || {
              grep -E '^RuntimeError:|^Traceback|^P01_|^[A-Za-z]+Error:' \
                "$RUNNER_TEMP/p01-v517-domains.txt" | tail -n 75 || true
              exit 1
            }
          grep '^P01_.*=PASS$' "$RUNNER_TEMP/p01-v517-domains.txt" | tail -n 90
          for engine in SQLITE MARIADB MYSQL; do
            grep -Fx \
              "P01_V517_$(echo "$engine")_PRIVATE_SEO_PROVIDER_SSRF_JOBS_CRASH_SCHEDULE_OBSERVABILITY=PASS" \
              "$RUNNER_TEMP/p01-v517-domains.txt"
            grep -Fx \
              "P01_V517_$(echo "$engine")_RSS_OWNER_CSRF_ESCROW_NATIVE_JOB_BACKUP_NO_REPLAY=PASS" \
              "$RUNNER_TEMP/p01-v517-domains.txt"
          done
          grep -Fx P01_V517_THREE_ENGINES_RELEASE_DOMAIN_MACHINE_PROOF_SCOPED=PASS \
            "$RUNNER_TEMP/p01-v517-domains.txt"
          echo P01_V517_REAL_NATIVE_THREE_DB_DOMAIN_SAFETY=PASS
      - name: Final source and mandatory no-release no-Production assertion
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = c00f54bed0fa3521a3c57bfcd591745fb45db776
          echo P01_V517_OFFICIAL_RELEASE_ASSET_NOT_VERIFIED_BY_THIS_RUN=YES
          echo P01_V517_ISSUED_MAJOR_APPLY_NOT_RUN_BY_THIS_TEST=YES
          echo P01_V517_PRODUCTION_CLOUDPANEL_DNS_USER_DATA=UNCHANGED
      - name: Always clean private checkout and isolated packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate runner-harness "$RUNNER_TEMP/p01-issued-516-failclosed"
          rm -f -- "$RUNNER_TEMP"/d60-*.zip "$RUNNER_TEMP"/d60-*.txt \
            "$RUNNER_TEMP"/p01-*.txt "$RUNNER_TEMP"/p01-*.html "$RUNNER_TEMP"/p01-*.pid
          rm -f -- "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip" \
            "$RUNNER_TEMP/p01-v516-release.json" "$RUNNER_TEMP/v516-download.txt"
          echo P01_V517_PRIVATE_SOURCE_SECRETS_ASSETS_PERSISTED=NO
