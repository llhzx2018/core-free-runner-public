name: P01 D69 authentic v515 FULL exact private whole-site archive and negative gates
on:
  push:
    branches:
      - test/p01-d69-official-whole-site-safe-archive-20261113
permissions:
  contents: read
jobs:
  old-release-installed-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate exact one-off scope and private source access
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d69-official-whole-site-safe-archive-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D65_REAL_OWNER_OR_PRODUCTION_FILES=NONE"
      - name: Checkout exact candidate source ephemeral only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4d803bee0f0a95e718ad468e5d870b36975c395a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Prove source and test runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "4d803bee0f0a95e718ad468e5d870b36975c395a"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py
          echo "P01_D69_CANDIDATE_EXACT_SOURCE=4d803bee0f0a95e718ad468e5d870b36975c395a"
      - name: Install PHP 8.3 and native SQLite for authentic old installer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d69-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-curl php8.3-zip             >> "$RUNNER_TEMP/d69-apt.txt" 2>&1
          php8.3 -m | grep -Fxi pdo_sqlite
          php8.3 -m | grep -Fxi sqlite3
          php8.3 -m | grep -Fxi curl
          echo "P01_D65_NATIVE_HTTP_INSTALL_RUNTIME=PASS"
      - name: Download and authenticate ACTUAL released v2.47.515 FULL bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d69-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start             --pattern VF-Start-V2.47.515-FULL.zip             --dir "$RUNNER_TEMP/d69-official"             > "$RUNNER_TEMP/d69-release-fetch.txt" 2>&1
          file="$RUNNER_TEMP/d69-official/VF-Start-V2.47.515-FULL.zip"
          test -f "$file"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D65_V247515_OFFICIAL_GITHUB_ASSET_SHA256=PASS"
      - name: Install locked candidate Laravel 13 dependency for isolated conversion
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=candidate/src/app/next --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins > "$RUNNER_TEMP/d69-composer.txt" 2>&1
          test -f candidate/src/app/next/vendor/autoload.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticLegacyFullSiteArchive.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d69_official_full_site_archive.php
          echo "P01_D66_LOCKED_LARAVEL_13_DEPS_READY=PASS"
      - name: REAL old HTTP setup, authentic Owner data and D66 old-to-new clone with recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES               python3 candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py                 --release-full "$RUNNER_TEMP/d69-official/VF-Start-V2.47.515-FULL.zip"                 --candidate-root candidate --archive-full-old-site > "$RUNNER_TEMP/d69-report.txt" 2>&1; then
            grep -E '^P01_D(65|66|69)_' "$RUNNER_TEMP/d69-report.txt" | tail -n 35 || true
            exit 1
          fi
          grep -E '^P01_D(65|66|69)_' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_OFFICIAL_FULL_ASSET_HASH_SIZE_AND_LAYOUT=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_REAL_OLD_RELEASE_HTTP_CSRF_INSTALL_SETUP_LOCK=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_REAL_OLD_RUNTIME_DB_CONFIG_ARGON2ID_OWNER=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_REAL_OLD_INSTALLED_OWNER_BUSINESS_AND_MEDIA=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_FAULT_INJECTED_ARCHIVE_PUBLISH_ROLLBACK=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_UNTRUSTED_LINKED_OLD_PRIVATE_FILES_REJECTED=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_REAL_OLD_FULL_CODE_CONFIG_DATABASE_SEVEN_PRIVATE_DIRS=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_STALE_SOURCE_AND_CORRUPTED_BACKUP_FAIL_CLOSED=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_OFFICIAL_OLD_OWNER_CONFIG_SQLITE_AND_MEDIA_UNTOUCHED=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_COMPLETE_SCOPE_ARCHIVE_AND_NEGATIVES=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D69_OWNER_CLICK_LARAVEL_ATOMIC_READY=NO' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_ACTUAL_RELEASE_INSTALLED_DB_OFFLINE_D62_AUDIT=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_ACTUAL_OLD_SITE_CODE_DATA_CONFIG_MEDIA_RESTORED=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D66_OFFICIAL_RELEASE_TO_LARAVEL_PRECOMMIT_ROLLBACK=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D66_ACTUAL_INSTALLED_OLD_DATABASE_TO_NEW35_TABLE_CLONE=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D66_EXACT_OFFICIAL_OWNER_ARGON2ID_VERIFIER_PRESERVED=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D66_ACTUAL_OLD_MEDIA_SHA_AND_FAULT_ROLLBACK=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D66_INSTALLED_OWNER_SEALED_CONFIG_AND_ATOMIC=NOT_PROVEN' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_REAL_OLD_RELEASE_INSTALL_AND_RESTORE_STAGE=PASS' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_OLD_TO_LARAVEL_OWNER_ATOMIC_UPGRADE=NOT_PROVEN' "$RUNNER_TEMP/d69-report.txt"
          grep -Fx 'P01_D65_PRODUCTION_OR_REAL_OWNER_DATA_TOUCHED=NO' "$RUNNER_TEMP/d69-report.txt"
          echo "P01_D69_OFFICIAL_WHOLE_SITE_ARCHIVE_PHASE=PASS"
      - name: Always remove actual source, asset, and synthetic private credentials
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d69-official" "$RUNNER_TEMP/d69-apt.txt"              "$RUNNER_TEMP/d69-report.txt" "$RUNNER_TEMP/d69-release-fetch.txt" "$RUNNER_TEMP/d69-composer.txt"
          echo "P01_D69_PUBLIC_RUNNER_PRIVATE_SOURCE_OR_DATA_PERSISTED=NO"
          echo "P01_D69_PUBLIC_ARTIFACT_UPLOAD=NONE"
