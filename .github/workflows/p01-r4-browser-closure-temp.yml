name: p01-r4-browser-closure-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r4-browser-closure-temp.yml'
      - 'requests/p01-r4-browser-closure-20260922.json'

permissions:
  contents: read

jobs:
  browser-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-r4-browser-closure-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/r4-lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/r4-lane.json >/dev/null

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Checkout exact P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          echo 'P01_R4_EXACT_IDENTITY=PASS'

      - name: Fresh runtime and deterministic browser fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_r4_prepare_runtime.sh

      - name: Real Chromium desktop mobile and auth recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/p01_r4_browser.mjs

      - name: R4 summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_R4_SOURCE_SHA=$target_sha"
          echo "P01_R4_SOURCE_TREE=$target_tree"
          echo 'P01_R4_SCOPE=REAL_CHROMIUM_DESKTOP_MOBILE_AUTH_MUTATION_HOSTED_HTML'
          echo 'P01_R4_MACHINE_BROWSER_CLOSURE=PASS'
