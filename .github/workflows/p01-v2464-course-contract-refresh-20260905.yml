name: P01 V2.46.4 Course Contract Refresh

on:
  push:
    branches:
      - gate/p01-v2464-candidate-version-bump-20260905
    paths:
      - .github/workflows/p01-v2464-course-contract-refresh-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: fix/p01-course-contract-current-chrome-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,mbstring
          coverage: none
      - name: Verify test-only semantic refresh
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only origin/main...HEAD | sort)" = 'tests/unit/course_experience_source_contract.php'
          php tests/unit/course_experience_source_contract.php
          php tests/unit/uxui_round3_course_identity_contract.php
          php tests/unit/consolidated_product_acceptance_contract.php
          php -l tests/unit/course_experience_source_contract.php
          echo P01_COURSE_CONTRACT_REFRESH=PASS
          echo RUNTIME_MUTATION=NO
          echo VERSION_MUTATION=NO
          echo SCHEMA_MUTATION=NO
          echo PRODUCTION_MUTATION=NO
