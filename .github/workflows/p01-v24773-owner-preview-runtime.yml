name: P01 V2.47.73 Owner Preview Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24773-owner-preview-runtime.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24773-owner-preview-runtime
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      TARGET_TREE: 9e6fe0e775e95dfb237471a569f604062f267218
      TARGET_VERSION: 2.47.73
      PREVIEW_PORT: '18490'
    steps:
      - name: Checkout temporary preview carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5a90fa61b0e446444b49f8de58438d2de5e9acda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact candidate and prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < product/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd curl openssl >/dev/null
          rm -rf /tmp/p01-v24773-owner-preview
          cp -a product/src /tmp/p01-v24773-owner-preview
          echo P01_V24773_PREVIEW_EXACT_SOURCE=PASS

      - name: Clean install isolated preview
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          root=/tmp/p01-v24773-owner-preview
          cookie=/tmp/p01-v24773-preview-cookie.txt
          pass="$(openssl rand -hex 18)"
          printf '%s' "$pass" >/tmp/p01-v24773-preview-password
          (
            cd "$root"
            php -S 127.0.0.1:"$PREVIEW_PORT" -t . >/tmp/p01-v24773-preview-php.log 2>&1 &
            echo $! >/tmp/p01-v24773-preview-php.pid
          )
          for i in $(seq 1 40); do
            if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$PREVIEW_PORT/setup.php" -o /tmp/p01-v24773-setup.html; then break; fi
            sleep 1
          done
          csrf="$(sed -n 's/.*name="setup_csrf"[[:space:]]*value="\([^"]*\)".*/\1/p' /tmp/p01-v24773-setup.html | head -n1)"
          test -n "$csrf"
          curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$PREVIEW_PORT/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=VF Start V2.47.73 Owner Preview" \
            --data-urlencode "admin_password=$pass" \
            --data-urlencode "admin_password_confirm=$pass" \
            -o /tmp/p01-v24773-setup-post.html
          (cd "$root" && php cli/verify.php) | tee /tmp/p01-v24773-preview-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24773-preview-verify.txt
          body="$(php -r 'echo json_encode(["password"=>$argv[1]], JSON_UNESCAPED_SLASHES);' "$pass")"
          curl -fsS -c "$cookie" -b "$cookie" -H 'Content-Type: application/json' --data "$body" \
            "http://127.0.0.1:$PREVIEW_PORT/api.php?action=login" >/tmp/p01-v24773-preview-login.json
          grep -Fq '"ok":true' /tmp/p01-v24773-preview-login.json
          curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$PREVIEW_PORT/jobs.php" -o /tmp/p01-v24773-preview-jobs.html
          grep -Fq '计划任务' /tmp/p01-v24773-preview-jobs.html
          echo P01_V24773_PREVIEW_RUNTIME_LOCAL=PASS

      - name: Start authorized temporary Quick Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod 700 /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --protocol http2 --url "http://127.0.0.1:$PREVIEW_PORT" \
            --logfile /tmp/p01-v24773-cloudflared.log --loglevel info >/tmp/p01-v24773-cloudflared.stdout 2>&1 &
          echo $! >/tmp/p01-v24773-cloudflared.pid
          url=""
          for i in $(seq 1 60); do
            url="$(grep -hEo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/p01-v24773-cloudflared.log /tmp/p01-v24773-cloudflared.stdout 2>/dev/null | tail -1 || true)"
            [[ -n "$url" ]] && break
            sleep 1
          done
          test -n "$url"
          ready=0
          for i in $(seq 1 30); do
            code="$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/p01-v24773-preview-external.html -w '%{http_code}' "$url/" || true)"
            if [[ "$code" = 200 || "$code" = 302 || "$code" = 303 ]]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          printf '%s' "$url" >/tmp/p01-v24773-preview-url
          echo P01_V24773_PREVIEW_EXTERNAL_ROUTE=PASS
          echo P01_V24773_OWNER_PREVIEW_RUNTIME=READY

      - name: Encrypt preview access
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          url="$(cat /tmp/p01-v24773-preview-url)"
          pass="$(cat /tmp/p01-v24773-preview-password)"
          printf 'PREVIEW_URL=%s/jobs.php\nLOGIN_PASSWORD=%s\nVERSION=%s\nEXACT_SOURCE=%s\nEXACT_TREE=%s\nPRODUCTION_WRITE=NO\nTAG_RELEASE_CHANNEL_WRITE=NO\n' \
            "$url" "$pass" "$TARGET_VERSION" "$TARGET_SHA" "$TARGET_TREE" >/tmp/P01_V24773_PREVIEW_ACCESS.txt
          printf '%s' '' | base64 -d >/tmp/p01-preview-public.pem
          openssl pkeyutl -encrypt -pubin -inkey /tmp/p01-preview-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/P01_V24773_PREVIEW_ACCESS.txt \
            -out /tmp/P01_V24773_PREVIEW_ACCESS.enc
          rm -f /tmp/P01_V24773_PREVIEW_ACCESS.txt /tmp/p01-v24773-preview-password /tmp/p01-preview-public.pem
          test -s /tmp/P01_V24773_PREVIEW_ACCESS.enc
          echo P01_V24773_PREVIEW_ACCESS_ENCRYPTED=PASS

      - name: Upload encrypted access capsule
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24773-preview-access-encrypted
          path: /tmp/P01_V24773_PREVIEW_ACCESS.enc
          if-no-files-found: error
          retention-days: 1

      - name: Keep preview available for Owner real use
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_V24773_PREVIEW_WINDOW_MINUTES=60
          for i in $(seq 1 60); do
            kill -0 "$(cat /tmp/p01-v24773-cloudflared.pid)"
            kill -0 "$(cat /tmp/p01-v24773-preview-php.pid)"
            sleep 60
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          [[ -s /tmp/p01-v24773-cloudflared.pid ]] && kill "$(cat /tmp/p01-v24773-cloudflared.pid)" >/dev/null 2>&1 || true
          [[ -s /tmp/p01-v24773-preview-php.pid ]] && kill "$(cat /tmp/p01-v24773-preview-php.pid)" >/dev/null 2>&1 || true
          rm -rf /tmp/p01-v24773-owner-preview /tmp/p01-v24773-preview-cookie.txt /tmp/p01-v24773-setup.html /tmp/p01-v24773-setup-post.html /tmp/p01-v24773-preview-login.json /tmp/p01-v24773-preview-jobs.html /tmp/P01_V24773_PREVIEW_ACCESS.enc
          echo P01_V24773_PREVIEW_RUNTIME_CLEANUP=PASS
