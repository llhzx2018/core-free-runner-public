name: core-agent V0.11 Project Run Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-v0.11-project-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_AGENT_SOURCE_SHA: f77cf69ac6397b4bdd1d5805624619761ca1c445
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require registered VF read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'REGISTERED_CAPABILITY_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          echo 'REGISTERED_VF_READ_CAPABILITY=PASS'

      - name: Checkout exact core-agent V0.11 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SOURCE_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py

      - name: Run real durable project run pilot
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
          VF_PRIVATE_READ_TOKEN: ${{ env.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/pilot_v11_project_run.py

      - name: Build public-safe V0.11 evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          machine_path=Path('.evidence/verification.json')
          pilot_path=Path('.evidence/v11-project-run.json')
          out=Path('.evidence/v11-public-evidence.json')
          payload={'schema':'core-agent-public-evidence/v11','version':'0.11.0','source_sha':os.environ['VF_SOURCE_SHA'],'private_source_persisted':False,'raw_skill_instructions_persisted':False,'write_actions':0,'main_write_actions':0,'production_actions':0,'release_actions':0,'token_exposed':False}
          if machine_path.exists():
              raw=machine_path.read_bytes(); machine=json.loads(raw.decode('utf-8')); payload.update({'machine_status':machine.get('status'),'machine_evidence_sha256':hashlib.sha256(raw).hexdigest(),'check_exit_codes':[i.get('exit_code') for i in machine.get('checks',[])]})
          else: payload['machine_status']='MISSING'
          if pilot_path.exists():
              raw=pilot_path.read_bytes(); pilot=json.loads(raw.decode('utf-8'))
              for key in ('status','selected_repository','selected_mode','execution_phase','authority_proof_count','skill_identities','run_id_sha256','run_state','context_sha256','checkpoint_created','new_window_resume','same_run_id','same_context','same_skill_authority','current_pointer_changes','raw_skill_instructions_persisted','user_manual_test_required','new_runner_required','new_credential_required'):
                  payload['pilot_'+key if key=='status' else key]=pilot.get(key)
              payload['pilot_evidence_sha256']=hashlib.sha256(raw).hexdigest()
          else: payload['pilot_status']='MISSING'
          payload['status']='PASS' if (
              payload.get('machine_status')=='PASS'
              and payload.get('pilot_status')=='PASS'
              and payload.get('checkpoint_created') is True
              and payload.get('new_window_resume') is True
              and payload.get('same_run_id') is True
              and payload.get('same_context') is True
              and payload.get('same_skill_authority') is True
              and payload.get('raw_skill_instructions_persisted') is False
              and payload.get('user_manual_test_required') is False
              and payload.get('new_runner_required') is False
              and payload.get('new_credential_required') is False
          ) else 'FAIL'
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode('utf-8'); payload['sha256']=hashlib.sha256(canonical).hexdigest(); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}")
          print(f"SELECTED_REPOSITORY={payload.get('selected_repository') or 'NONE'}")
          print(f"NEW_WINDOW_RESUME={'YES' if payload.get('new_window_resume') else 'NO'}")
          print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          if payload['status']!='PASS': raise SystemExit(1)
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-agent-v0.11-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: source/.evidence/v11-public-evidence.json
          if-no-files-found: error
          retention-days: 14
