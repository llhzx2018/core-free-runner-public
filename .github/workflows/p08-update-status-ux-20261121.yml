name: P08 isolated Updates status UX regression DEV only
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-update-status-ux-20261121.yml
permissions:
  contents: read
jobs:
  p08-update-status-ux:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-update-status-ux-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private P08 UX source into ephemeral runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: a111af83d961e48c678ea8ce1be6337961635f43
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08-private
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source local Vue status UI feedback regression + build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-private rev-parse HEAD)" = a111af83d961e48c678ea8ce1be6337961635f43
          test "$(cat p08-private/VERSION)" = 0.1.14
          cd p08-private
          npm ci --ignore-scripts --no-fund --no-audit
          npm run typecheck
          npx vitest run tests/js/future-update-check-feedback.test.ts --reporter=dot
          npm run test:unit
          npm run build
          git diff --exit-code
          echo P08_STATUS_UX_VUE_TYPES_REGRESSION_FULL_VITEST_VITE_BUILD=PASS
      - name: Exact task boundary and absence of passive upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-private rev-parse HEAD)" = a111af83d961e48c678ea8ce1be6337961635f43
          p=p08-private/resources/js/modules/updates/FutureOwnerUpdatePanel.vue
          grep -Fq "api('one-click', true)" "$p"
          grep -Fq "shouldRetryExistingOwnerTaskStatus(task.value.status, syncFailures)" "$p"
          grep -Fq "最近一次升级记录：" "$p"
          ! grep -Fq 'void oneClick()' "$p"
          ! grep -Fq 'onMounted(() => { void check()' "$p"
          test "$(cat p08-private/VERSION)" = 0.1.14
          echo P08_STATUS_UX_ZERO_AUTO_POST_ZERO_VERSION_BUMP=PASS
      - name: Remove all temporary private sources
        if: always()
        shell: bash
        run: |
          rm -rf -- p08-private
          test ! -e p08-private
          echo P08_STATUS_UX_PRIVATE_CLEANUP=PASS
