name: R67 Focused Smart View Sort Reset Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r67-smart-view-sort.yml'

permissions:
  contents: read

jobs:
  r67-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 25763581db0da03b14a12f9f50a5ee956d48bbe6
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 25763581db0da03b14a12f9f50a5ee956d48bbe6
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/FunctionalWorkspaceCore.php
          php -l tests/unit/smart_view_sort_reset_contract.php
          php tests/unit/smart_view_sort_reset_contract.php
          php tests/unit/start_favorite_sort_reset_contract.php
          php tests/unit/derived_sort_route_continuity_contract.php
          echo R67_SMART_VIEW_SORT_RESET_PASS
          echo R67_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
