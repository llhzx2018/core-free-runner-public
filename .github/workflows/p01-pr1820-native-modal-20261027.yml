name: P01 PR1820 native modal one-off exact-source proof
on:
  push:
    branches: [task/p01-pr1820-native-modal-20261027]
    paths: ['.github/workflows/p01-pr1820-native-modal-20261027.yml']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-pr1820-native-modal-20261027.yml'
      - 'lanes/p01-pr1820-native-modal-20261027/spec.json'
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-start
  TARGET_VERSION: 2.47.466
  TARGET_SHA: 6adf21b4d64ce0309976626cdff00e92e156620a
  BASE_SHA: 03ea17d4c8e106b1f2f641c038868a57a0875f5e
  LANE_ID: p01-pr1820-native-modal-20261027
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public control (no credentials persisted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Audit exact source identity against one-off spec
        run: |
          set -euo pipefail
          python3 control/scripts/ephemeral_lane_spec.py validate --spec "control/lanes/$LANE_ID/spec.json" >/dev/null
          python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec "control/lanes/$LANE_ID/spec.json" --input "control/.github/workflows/p01-pr1820-native-modal-20261027.yml"
      - name: Transient checkout of P01 exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6adf21b4d64ce0309976626cdff00e92e156620a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Source identity, PHP lint and frontstage JS syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < target/src/VERSION.txt)" = "$TARGET_VERSION"
          git -C target merge-base --is-ancestor "$BASE_SHA" "$TARGET_SHA"
          command -v php >/dev/null || { echo 'BLOCKED_TOOLING:php'; exit 1; }
          command -v node >/dev/null || { echo 'BLOCKED_TOOLING:node'; exit 1; }
          php_count=0
          js_count=0
          while IFS= read -r changed; do
            case "$changed" in
              *.php)
                if ! php -l "target/$changed" >/dev/null 2>&1; then
                  echo "PHP_LINT_FAIL:$changed"
                  exit 1
                fi
                php_count=$((php_count+1))
                ;;
              *.js|*.cjs)
                if ! node --check "target/$changed" >/dev/null 2>&1; then
                  echo "NODE_SYNTAX_FAIL:$changed"
                  exit 1
                fi
                js_count=$((js_count+1))
                ;;
            esac
          done < <(git -C target diff --name-only "$BASE_SHA" "$TARGET_SHA")
          test "$php_count" -ge 1
          test "$js_count" -ge 8
          echo "EXACT_SOURCE_IDENTITY=PASS"
          echo "PHP_LINT_FILES=$php_count"
          echo "NODE_SYNTAX_FILES=$js_count"
      - name: Canonical same-page modal and scoped management contracts
        shell: bash
        run: |
          set -euo pipefail
          cd target
          for test_case in \
            tests/browser/local_management_p02_modal_hub_contract.cjs \
            tests/browser/local_management_bulk_search_scope_contract.cjs \
            tests/browser/local_management_inbox_popover_contract.cjs; do
            if ! node "$test_case" >/dev/null 2>&1; then
              echo "FOCUSED_CONTRACT_FAIL:$test_case"
              exit 1
            fi
            echo "FOCUSED_CONTRACT_PASS:$test_case"
          done
          echo 'FOCUSED_CONTRACTS=3/3_PASS'
      - name: Public-safe bounded proof metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          printf '{"schema":"vf-p01-pr1820-independent-proof/v1","scope":"exact-source-identity/php-lint/node-syntax/three-focused-contracts","result":"PASS_FOCUSED","target_repo":"%s","target_sha":"%s","base_sha":"%s","target_version":"%s","run_id":"%s"}\n' "$TARGET_REPO" "$TARGET_SHA" "$BASE_SHA" "$TARGET_VERSION" "$GITHUB_RUN_ID" > proof/metadata.json
      - name: Public-safe metadata artifact only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p01-pr1820-focused-${{ github.run_id }}
          path: proof/metadata.json
          retention-days: 14
      - name: Remove transient private P01 checkout
        if: always()
        shell: bash
        run: |
          if [ -d target ]; then
            rm -rf -- target
          fi
