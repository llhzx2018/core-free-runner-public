name: P01 D23 future Owner Vue/Vite exact-source isolated proof (temporary)
on:
  push:
    branches:
      - test/p01-d23-owner-vite-20261112
permissions:
  contents: read
jobs:
  p01-d23-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify public-safe task and registered runner identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d23-owner-vite-20261112"
          echo P01_D23_PUBLIC_SANDBOX=YES
      - name: Checkout exact private P01 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3b4f3318633af2b77d723f47aa7be37b47f186ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source, PHP syntax, Owner security and architecture negatives
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "3b4f3318633af2b77d723f47aa7be37b47f186ed"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -v | head -n 2
          for f in candidate/src/app/next/runtime/ViteAssetManifest.php \
                   candidate/src/app/next/runtime/ImmutablePublicAssetStage.php \
                   candidate/src/app/next/runtime/OwnerWorkbenchAssets.php \
                   candidate/src/app/next/http/OwnerWorkbenchRoutes.php \
                   candidate/src/app/next/routes/web.php \
                   candidate/tests/unit/p01_d23_owner_workbench_contract.php; do
            php -l "$f"
          done
          php candidate/tests/unit/p01_d22_immutable_public_assets_contract.php
          php candidate/tests/unit/p01_d22_vite_asset_manifest_contract.php
          php candidate/tests/unit/p01_d23_owner_workbench_contract.php
          python3 -m unittest discover -s candidate/tests/architecture -p test_p01_fullstack_contract.py -q
          python3 -m unittest discover -s candidate/tests/architecture -p test_p01_next_full_bundle.py -q
          echo P01_D23_PHP_AND_BUILD_CONTRACTS=PASS
      - name: Use pinned Node 22 build runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/src/app/next/frontend/package-lock.json
      - name: Exact-source npm lock, Vue TypeScript, unit tests and actual Vite build
        working-directory: candidate/src/app/next/frontend
        run: |
          set -Eeuo pipefail
          node -v
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run test:unit
          npm run build
          test -s ../public/build/.vite/manifest.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('../public/build')
          manifest=json.loads((p/'.vite/manifest.json').read_text())
          entry=manifest.get('src/main.ts')
          assert isinstance(entry,dict) and entry.get('isEntry') is True
          assert isinstance(entry.get('file'),str) and (p/entry['file']).is_file()
          assert len(entry.get('css',[]))>=1
          for css in entry['css']:
              assert (p/css).is_file()
          print('P01_D23_REAL_VITE_MANIFEST_JS_CSS=PASS')
          PY
          echo P01_D23_REAL_VUE_TYPESCRIPT_VITEST_VITE_BUILD=PASS
      - name: Isolated Chromium 390 768 1440 on-click and failure UX
        working-directory: candidate/src/app/next/frontend
        run: |
          set -Eeuo pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e
          echo P01_D23_CHROMIUM_390_768_1440_ONCLICK=PASS
          echo P01_D23_LARAVEL_FULL_SESSION_END_TO_END=NOT_PROVEN
      - name: Verify exact-source self-contained future developer ZIP after build
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          fi
          umask 077
          python3 candidate/scripts/build_p01_next_clean_full.py build \
            --source-sha 3b4f3318633af2b77d723f47aa7be37b47f186ed --output /tmp/p01-d23-isolated-full.zip
          python3 candidate/scripts/build_p01_next_clean_full.py verify \
            --zip /tmp/p01-d23-isolated-full.zip
          rm -f /tmp/p01-d23-isolated-full.zip
          echo P01_D23_BUNDLE_SOURCE_INTEGRITY=PASS
          echo P01_D23_CLOUDPANEL_FULL_INSTALL=NOT_PROVEN
      - name: Cleanup checked-out private source and ephemeral test artifacts
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-d23-isolated-full.zip
          echo P01_D23_PRIVATE_SOURCE_PERSISTED=NO
