name: P03 VF Forge V1.35.4 Formal Artifact Pre-Gate

on:
  push:
    branches: [main]
    paths:
      - 'requests/p03-v1354-formal-artifact-pre-gate-*.txt'

permissions:
  contents: read
  actions: read

concurrency:
  group: p03-v1354-formal-artifact-pre-gate
  cancel-in-progress: false

jobs:
  formal-artifact-pre-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_COMMIT: af34b84a3135333cf05077b3eb64e22ef6b3afef
      CANDIDATE_TREE: 08eee7e8c891a57c357553dd5de20c1a7bd79849
      AUTHORITY_HEAD: 9b5bfacd052176104b44db00d1098d8021f6b7be
      PRODUCTION_COMMIT: 263c4d8f7e38bff58db5680a6845ceb5a576d6ae
      FIXTURE_PASS: VfP03-Formal-1354-2026!
      PHP_TEST_IMAGE: vf-forge-v1354-formal-php84
      GATE_ROOT: /tmp/p03-v1354-formal-artifact-pre-gate

    steps:
      - name: Checkout public harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: harness

      - name: Require ephemeral private read credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN missing' >&2; exit 78; }
          echo 'PRIVATE_READ_CREDENTIAL=PASS'
          echo 'PRIVATE_SOURCE_MODE=EPHEMERAL_ONLY'

      - name: Checkout exact frozen Product Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.CANDIDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p03

      - name: Checkout exact Authority-only HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.AUTHORITY_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Checkout exact Production 1.35.3 baseline
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.PRODUCTION_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production

      - name: Prepare PHP 8.4 SQLite Zip cURL runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 curl unzip >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.p03-v1354-formal" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev libcurl4-openssl-dev sqlite3 \
            && docker-php-ext-install zip pdo_sqlite curl \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-v1354-formal" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","sqlite3","zip","curl","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo PHP_VERSION," FORMAL_RUNTIME_PASS\n";'

      - name: Execute Formal Artifact Pre-Gate
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 harness/scripts/p03_v1354_formal_builder_normalize.py harness/scripts/p03_v1354_formal_builder.py
          grep -Fq "'memory-api.php'" harness/scripts/p03_v1354_formal_builder.py
          chmod +x harness/scripts/p03_v1354_formal_artifact_pre_gate.sh
          bash -n harness/scripts/p03_v1354_formal_artifact_pre_gate.sh
          python3 -m py_compile harness/scripts/p03_v1354_formal_builder.py
          bash harness/scripts/p03_v1354_formal_artifact_pre_gate.sh

      - name: Verify zero public artifacts and cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker rm -f p03-v1354-full-fresh p03-v1354-upgrade >/dev/null 2>&1 || true
          rm -rf p03 authority production /tmp/p03-v1354-formal-artifact-pre-gate "$RUNNER_TEMP/Dockerfile.p03-v1354-formal"
          test ! -e p03 && test ! -e authority && test ! -e production
          RESP=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          COUNT=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])' <<<"$RESP")
          test "$COUNT" = 0
          echo 'UPLOADED_ACTIONS_ARTIFACTS=0'
          echo 'PRIVATE_SOURCE_PERSISTED=NO'
          echo 'FORMAL_PACKAGES_PERSISTED_PUBLICLY=NO'
          echo 'EPHEMERAL_CLEANUP=PASS'

      - name: Formal Artifact Pre-Gate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'FORMAL_ARTIFACT_PRE_GATE=PASS_COMPLETE'
          echo 'CANDIDATE=V1.35.4_VERIFIED'
          echo 'PRODUCT_FAILURE=NONE'
          echo 'PROJECT_BLOCK=NONE'
          echo 'TAG=NOT_CREATED RELEASE=NOT_CREATED CORE_UPDATES=NOT_WRITTEN PRODUCTION_WRITE=0'
          echo 'NEXT=STOP_FOR_MASTER'
