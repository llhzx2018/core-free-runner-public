name: P01 V2.47.132 Favicon Success Generation Gate

on:
  push:
    branches:
      - test-p01-v247132-favicon-success-generation-20260930
    paths:
      - '.github/workflows/temp-p01-v247132-favicon-success-generation.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 47dc8011629adee2b730afd80ea3da2e3a876378
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/src/app/IconCache.php
          node --check product/src/assets/workspace.js
          php -l product/tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          echo P01_V247132_FAVICON_SUCCESS_GENERATION_SYNTAX=PASS

      - name: Focused favicon contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          echo P01_V247132_FAVICON_SUCCESS_GENERATION_FOCUSED=PASS
