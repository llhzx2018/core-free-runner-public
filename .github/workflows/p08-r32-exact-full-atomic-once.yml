name: P08 R32 exact source 0.1.0 bridge to 0.1.1 self-contained FULL Atomic (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r32-exact-full-atomic-once.yml'
permissions:
  contents: read
jobs:
  extracted-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      P08_BRIDGE_SHA: ea22abd39ab1e8905bce903ca170aac56e3651ce
      P08_TARGET_SHA: 5b421aa13c47cf05e6e4805ddda7f25e3d7436aa
    steps:
      - name: Exact private P08 0.1.0 bridge checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: ea22abd39ab1e8905bce903ca170aac56e3651ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-bridge
      - name: Exact private P08 0.1.1 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 5b421aa13c47cf05e6e4805ddda7f25e3d7436aa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-target
      - name: Verify source and target identity, no Owner data
        run: |
          set -euo pipefail
          test "$(git -C private-bridge rev-parse HEAD)" = "$P08_BRIDGE_SHA"
          test "$(git -C private-target rev-parse HEAD)" = "$P08_TARGET_SHA"
          test "$(cat private-bridge/VERSION)" = "0.1.0"
          test "$(cat private-target/VERSION)" = "0.1.1"
          test ! -e private-bridge/.env
          test ! -e private-target/.env
          echo "P08_R32_BRIDGE_SOURCE=$P08_BRIDGE_SHA"
          echo "P08_R32_TARGET_SOURCE=$P08_TARGET_SHA"
      - name: Install PHP 8.4 Composer and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real pinned Composer/Vite for both exact source versions
        run: |
          set -euo pipefail
          for d in private-bridge private-target; do
            (
              cd "$d"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
              composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/$d-composer.log" 2>&1
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/$d-npm.log" 2>&1
              npm run build
              npm run typecheck
              python3 scripts/check_stack_contract.py --phase full
            )
          done
      - name: Genuine extracted bridge FULL, new target FULL, and code-only Atomic ZIP
        run: |
          set -euo pipefail
          python3 private-bridge/scripts/build_full.py --source private-bridge --output "$RUNNER_TEMP/p08-bridge-full.zip" --version 0.1.0 --source-sha "$P08_BRIDGE_SHA"
          python3 private-target/scripts/build_full.py --source private-target --output "$RUNNER_TEMP/p08-target-full.zip" --version 0.1.1 --source-sha "$P08_TARGET_SHA"
          mkdir "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          unzip -qq "$RUNNER_TEMP/p08-bridge-full.zip" -d "$RUNNER_TEMP/p08-bridge-installed"
          unzip -qq "$RUNNER_TEMP/p08-target-full.zip" -d "$RUNNER_TEMP/p08-target-extracted"
          SOURCE_MANIFEST_SHA=$(sha256sum "$RUNNER_TEMP/p08-bridge-installed/FULL_MANIFEST.json" | cut -d' ' -f1)
          php -r 'require "private-bridge/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[1]); VF\AdOps\Installation\SetupGuard::package($argv[2]); echo "P08_R32_DUAL_EXTRACTED_FULL_VERIFIED=PASS\n";' "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          python3 private-target/scripts/build_atomic.py --source private-target --output "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" --source-version 0.1.0 --source-sha "$P08_BRIDGE_SHA" --source-full-manifest-sha256 "$SOURCE_MANIFEST_SHA" --target-version 0.1.1 --target-sha "$P08_TARGET_SHA" > "$RUNNER_TEMP/p08-atomic-metadata.json"
          echo "P08_R32_TARGET_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-target-full.zip" | cut -d' ' -f1)"
          echo "P08_R32_TARGET_FULL_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-target-full.zip")"
          echo "P08_R32_ATOMIC_SHA256=$(sha256sum "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" | cut -d' ' -f1)"
          echo "P08_R32_ATOMIC_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-0.1.1-Atomic.zip")"
          echo "P08_R32_BRIDGE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA"
      - name: Stage actual ZIP with PHP and verify Python/PHP source-bound seal readback
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p08-bridge-installed"
          mkdir -p "$ROOT/storage/app/private/adops/installation"
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite"}' > "$ROOT/storage/app/private/adops/installation/installed.json"
          export P08_ROOT="$ROOT"
          export P08_ARCHIVE="$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          export P08_EXPECT_SHA="$(sha256sum "$P08_ARCHIVE" | cut -d' ' -f1)"
          export P08_TARGET_SHA
          php -r 'require "private-target/src/Installation/SetupGuard.php"; require "private-target/src/Upgrade/AtomicPackageStage.php"; $result=(new VF\AdOps\Upgrade\AtomicPackageStage())->prepare(getenv("P08_ROOT"),getenv("P08_ARCHIVE"),getenv("P08_EXPECT_SHA"),getenv("P08_TARGET_SHA")); file_put_contents(getenv("RUNNER_TEMP")."/p08-stage-id", $result["id"]); echo "P08_R32_REAL_ZIP_PHP_STAGE=".$result["target_version"]."\n";'
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          obj=json.loads((temp/"p08-atomic-metadata.json").read_text())
          stage_id=(temp/"p08-stage-id").read_text()
          stage=pathlib.Path(os.environ["P08_ROOT"])/"storage/app/private/adops/upgrade"/stage_id/"STAGE_RECEIPT.json"
          assert stage.is_file()
          assert hashlib.sha256(stage.read_bytes()).hexdigest()==obj["stage_receipt_sha256"]
          assert obj["sha256"]==os.environ["P08_EXPECT_SHA"]
          assert obj["source_sha"]==os.environ["P08_BRIDGE_SHA"]
          assert obj["target_sha"]==os.environ["P08_TARGET_SHA"]
          print("P08_R32_REAL_ZIP_PHP_PYTHON_SIGNED_SEAL_MATCH=PASS")
          print("P08_R32_REAL_STAGE_RECEIPT_SHA256="+obj["stage_receipt_sha256"])
          PY
      - name: Remove private workspace, archives and install fixture after evidence
        if: always()
        run: |
          rm -rf private-bridge private-target "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          rm -f "$RUNNER_TEMP/p08-bridge-full.zip" "$RUNNER_TEMP/p08-target-full.zip" "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-atomic-metadata.json" "$RUNNER_TEMP/p08-stage-id"
          rm -f "$RUNNER_TEMP"/private-bridge-composer.log "$RUNNER_TEMP"/private-bridge-npm.log "$RUNNER_TEMP"/private-target-composer.log "$RUNNER_TEMP"/private-target-npm.log
