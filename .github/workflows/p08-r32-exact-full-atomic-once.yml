name: P08 R32 exact PR source FULL and atomic real PHP build (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r32-exact-full-atomic-once.yml'
permissions:
  contents: read
jobs:
  exact-full-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P08_EXACT_SOURCE_SHA: 362ef8075068200604c8904c365f2fced78c5fab
    steps:
      - name: Checkout exact private P08 source into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 362ef8075068200604c8904c365f2fced78c5fab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Verify exact source, identity and setup contract
        run: |
          set -euo pipefail
          test "$(git -C private-product rev-parse HEAD)" = "$P08_EXACT_SOURCE_SHA"
          test "$(cat private-product/VERSION)" = "0.1.0"
          test ! -e private-product/.env
          echo "P08_R32_EXACT_HEAD=$P08_EXACT_SOURCE_SHA"
      - name: Install real PHP 8.4 extensions and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium
      - name: Node 22 from pinned product npm lock
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build genuine self-contained Laravel and Vite runtime
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r32-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r32-npm.log" 2>&1
          npm run build
          npm run typecheck
          python3 scripts/check_stack_contract.py --phase full
          php -l src/Upgrade/OwnerUpgradeJob.php
          php -l src/Upgrade/AtomicReleasePointer.php
      - name: Execute real R23-R31 PHP and Python atomic regression
        working-directory: private-product
        run: |
          set -euo pipefail
          python3 tests/test_atomic_stage_seal.py
          python3 -m unittest discover -s tests -p 'test_atomic_builder.py' -v
          php tests/test_owner_upgrade_job.php
          php tests/test_atomic_release_pointer.php
          php tests/test_atomic_release_materializer.php
          php tests/test_flat_layout_bridge_prepare.php
          php tests/test_flat_layout_bridge_activation.php
      - name: Build and extract real R31 0.1.0 compatibility bridge FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r32-bridge-0.1.0.zip" --version 0.1.0 --source-sha "$P08_EXACT_SOURCE_SHA"
          mkdir "$RUNNER_TEMP/p08-r32-bridge-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r32-bridge-0.1.0.zip" -d "$RUNNER_TEMP/p08-r32-bridge-extracted"
          ROOT="$RUNNER_TEMP/p08-r32-bridge-extracted" php -r 'require getcwd()."/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package(getenv("ROOT")); echo "P08_R32_EXTRACTED_FULL_INTEGRITY=PASS\n";'
          echo "P08_R32_BRIDGE_FULL_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-r32-bridge-0.1.0.zip")"
          echo "P08_R32_BRIDGE_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-r32-bridge-0.1.0.zip" | cut -d' ' -f1)"
          echo "P08_R32_BRIDGE_SOURCE_MANIFEST_SHA256=$(sha256sum "$RUNNER_TEMP/p08-r32-bridge-extracted/FULL_MANIFEST.json" | cut -d' ' -f1)"
          test ! -e "$RUNNER_TEMP/p08-r32-bridge-extracted/.env"
          test ! -e "$RUNNER_TEMP/p08-r32-bridge-extracted/storage/app/private/adops/installation/installed.json"
      - name: Erase temporary private code, logs and FULL ZIP
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r32-bridge-extracted"
          rm -f "$RUNNER_TEMP/p08-r32-bridge-0.1.0.zip" "$RUNNER_TEMP/p08-r32-composer.log" "$RUNNER_TEMP/p08-r32-npm.log"
