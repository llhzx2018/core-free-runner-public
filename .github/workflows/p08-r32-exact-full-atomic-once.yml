name: P08 R35 actual original flat 0.1.0 to bridge and 0.1.1 Atomic (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r32-exact-full-atomic-once.yml'
permissions:
  contents: read
jobs:
  extracted-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      P08_ORIGINAL_SHA: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
      P08_BRIDGE_SHA: 87f6074953e25767797a4679dcc95bd1368c7b13
      P08_TARGET_SHA: 0c2fc7533dbc8ad5016410af0a5a658cfc58c9e0
    steps:
      - name: Checkout temporary public-safe PHP harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact original flat 0.1.0 source checkout (R21 Owner trial)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 55ecbc8461a4d90fe7241a00caffa55e557cde1c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-flat
      - name: Exact private P08 0.1.0 bridge checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 87f6074953e25767797a4679dcc95bd1368c7b13
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-bridge
      - name: Exact private P08 0.1.1 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 0c2fc7533dbc8ad5016410af0a5a658cfc58c9e0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-target
      - name: Verify source and target identity, no Owner data
        run: |
          set -euo pipefail
          test "$(git -C private-flat rev-parse HEAD)" = "$P08_ORIGINAL_SHA"
          test "$(cat private-flat/VERSION)" = "0.1.0"
          test ! -e private-flat/.env
          test "$(git -C private-bridge rev-parse HEAD)" = "$P08_BRIDGE_SHA"
          test "$(git -C private-target rev-parse HEAD)" = "$P08_TARGET_SHA"
          test "$(cat private-bridge/VERSION)" = "0.1.0"
          test "$(cat private-target/VERSION)" = "0.1.1"
          test ! -e private-bridge/.env
          test ! -e private-target/.env
          echo "P08_R32_BRIDGE_SOURCE=$P08_BRIDGE_SHA"
          echo "P08_R32_TARGET_SOURCE=$P08_TARGET_SHA"
      - name: Install PHP 8.4 Composer and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real pinned Composer/Vite for both exact source versions
        run: |
          set -euo pipefail
          for d in private-flat private-bridge private-target; do
            (
              cd "$d"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
              composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/$d-composer.log" 2>&1
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/$d-npm.log" 2>&1
              npm run build
              npm run typecheck
              python3 scripts/check_stack_contract.py --phase full
            )
          done
      - name: Extract actual original flat FULL, trusted bridge FULL, 0.1.1 FULL and real Atomic
        run: |
          set -euo pipefail
          python3 private-flat/scripts/build_full.py --source private-flat --output "$RUNNER_TEMP/p08-flat-full.zip" --version 0.1.0 --source-sha "$P08_ORIGINAL_SHA"
          python3 private-bridge/scripts/build_full.py --source private-bridge --output "$RUNNER_TEMP/p08-bridge-full.zip" --version 0.1.0 --source-sha "$P08_BRIDGE_SHA"
          python3 private-target/scripts/build_full.py --source private-target --output "$RUNNER_TEMP/p08-target-full.zip" --version 0.1.1 --source-sha "$P08_TARGET_SHA"
          mkdir "$RUNNER_TEMP/p08-original-flat-installed" "$RUNNER_TEMP/p08-bridge-extracted" "$RUNNER_TEMP/p08-target-extracted"
          unzip -qq "$RUNNER_TEMP/p08-flat-full.zip" -d "$RUNNER_TEMP/p08-original-flat-installed"
          unzip -qq "$RUNNER_TEMP/p08-bridge-full.zip" -d "$RUNNER_TEMP/p08-bridge-extracted"
          unzip -qq "$RUNNER_TEMP/p08-target-full.zip" -d "$RUNNER_TEMP/p08-target-extracted"
          SOURCE_MANIFEST_SHA=$(sha256sum "$RUNNER_TEMP/p08-bridge-extracted/FULL_MANIFEST.json" | cut -d' ' -f1)
          php -r 'require "private-bridge/src/Installation/SetupGuard.php"; foreach (array_slice($argv,1) as $root) VF\AdOps\Installation\SetupGuard::package($root); echo "P08_R35_TRIPLE_REAL_EXTRACTED_FULL_INTEGRITY=PASS\n";' "$RUNNER_TEMP/p08-original-flat-installed" "$RUNNER_TEMP/p08-bridge-extracted" "$RUNNER_TEMP/p08-target-extracted"
          python3 private-target/scripts/build_atomic.py --source private-target --output "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" --source-version 0.1.0 --source-sha "$P08_BRIDGE_SHA" --source-full-manifest-sha256 "$SOURCE_MANIFEST_SHA" --target-version 0.1.1 --target-sha "$P08_TARGET_SHA" > "$RUNNER_TEMP/p08-atomic-metadata.json"
          echo "P08_R35_ORIGINAL_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-flat-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_COMPAT_BRIDGE_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-bridge-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_TARGET_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-target-full.zip" | cut -d' ' -f1)"
          echo "P08_R35_TARGET_ATOMIC_SHA256=$(sha256sum "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" | cut -d' ' -f1)"
          echo "P08_R35_TRUSTED_BRIDGE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA"
      - name: Execute real R28 flat preparation, R29 offline activation and native SQLite Atomic
        run: |
          set -euo pipefail
          php -l harness/p08-r35-original-flat-upgrade-once.php
          php -l private-bridge/src/Upgrade/FlatLayoutBridgeActivation.php
          php -l private-bridge/src/Upgrade/FlatLayoutBridgePrepare.php
          ROOT="$RUNNER_TEMP/p08-original-flat-installed"
          ZIP="$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          ZIP_SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          php harness/p08-r35-original-flat-upgrade-once.php "$ROOT" "$RUNNER_TEMP/p08-bridge-extracted" "$P08_ORIGINAL_SHA" "$P08_BRIDGE_SHA" "$P08_TARGET_SHA" "$ZIP" "$ZIP_SHA"
          export P08_ROOT="$ROOT"
          export P08_EXPECT_SHA="$ZIP_SHA"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          offer=json.loads((temp/"p08-atomic-metadata.json").read_text())
          folder=pathlib.Path(os.environ["P08_ROOT"])/"storage/app/private/adops/upgrade"
          receipts=list(folder.glob("*/STAGE_RECEIPT.json"))
          assert len(receipts)==1
          assert hashlib.sha256(receipts[0].read_bytes()).hexdigest()==offer["stage_receipt_sha256"]
          assert offer["sha256"]==os.environ["P08_EXPECT_SHA"]
          print("P08_R35_REAL_ORIGINAL_TO_SIGNABLE_STAGE_SEAL=PASS")
          PY
      - name: Serve actual upgraded Laravel through stable PHP HTTP entry
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p08-original-flat-installed"
          mkdir -p "$ROOT/storage/framework/cache/data" "$ROOT/storage/framework/sessions" "$ROOT/storage/framework/views" "$ROOT/storage/logs"
          # R34 product bootstrap must select private, per-release Laravel cache automatically.
          php -S 127.0.0.1:18880 -t "$ROOT/public" "$ROOT/public/index.php" > "$RUNNER_TEMP/p08-r33-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          LOGIN=$(curl -sS --max-time 10 -o "$RUNNER_TEMP/p08-r33-login.html" -w '%{http_code}' http://127.0.0.1:18880/login)
          APP=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18880/app)
          SETUP=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18880/setup.php)
          echo "P08_R33_HTTP_STATUS_LOGIN=$LOGIN APP=$APP SETUP=$SETUP"
          echo "P08_R33_HTTP_LOGIN=$LOGIN"
          echo "P08_R33_HTTP_GUEST_APP=$APP"
          echo "P08_R33_HTTP_SETUP=$SETUP"
          if [ "$LOGIN" != 200 ] || [ "$APP" != 302 ] || [ "$SETUP" != 503 ]; then
            echo "P08_R33_REAL_HTTP_MISMATCH"
            # Synthetic CI only; never print app config, user credentials or request bodies.
            echo P08_R33_HTTP_FIRST_ERROR_LINES
            head -n 36 "$RUNNER_TEMP/p08-r33-http.log" | sed -E 's/(APP_KEY|DB_PASSWORD|PASSWORD)=([^[:space:]]+)/\1=[REDACTED]/g' || true
            echo P08_R33_LARAVEL_LOG_HEAD
            LOG="$ROOT/storage/logs/laravel.log"
            if [ -f "$LOG" ]; then grep -m 3 -E 'ERROR|Exception|exception' "$LOG" | cut -c1-400 || true; fi
            exit 1
          fi
          test -s "$RUNNER_TEMP/p08-r33-login.html"
          echo "P08_R33_UPGRADED_LARAVEL_REAL_HTTP_LOGIN_200=PASS"
          echo "P08_R33_UPGRADED_LARAVEL_AUTH_REDIRECT_302=PASS"
          echo "P08_R33_UPGRADED_LARAVEL_SETUP_CLOSED_503=PASS"
          php "$ROOT/artisan" list --raw > "$RUNNER_TEMP/p08-r34-cli.txt"
          grep -Fq 'route:list' "$RUNNER_TEMP/p08-r34-cli.txt"
          echo "P08_R34_UPGRADED_STABLE_ARTISAN_COMMANDS=PASS"
          ROOT="$ROOT" php -r 'require "private-target/src/Upgrade/AtomicReleasePointer.php"; $v=(new VF\AdOps\Upgrade\AtomicReleasePointer())->verifyActiveRelease(getenv("ROOT"), getenv("P08_TARGET_SHA")); if ($v["status"] !== "VERIFIED_ACTIVE_FULL") throw new RuntimeException("R34_IMMUTABLE_RELEASE_CHANGED_AFTER_HTTP"); echo "P08_R34_IMMUTABLE_FULL_UNMODIFIED_BY_HTTP=PASS\\n";'
          test -d "$ROOT/storage/app/private/adops/bootstrap-cache/$P08_TARGET_SHA"
          test -f "$ROOT/storage/app/private/adops/bootstrap-cache/$P08_TARGET_SHA/packages.php"
          test -f "$ROOT/storage/app/private/adops/bootstrap-cache/$P08_TARGET_SHA/services.php"
          ROOT="$ROOT" python3 - <<'PY'
          import json, os, pathlib
          release=pathlib.Path(os.environ["ROOT"])/"releases"/os.environ["P08_TARGET_SHA"]
          manifest=json.loads((release/"FULL_MANIFEST.json").read_text())
          indexed={item["path"] for item in manifest["files"]}
          present=set()
          for p in release.rglob("*"):
              if p.is_symlink():
                  raise AssertionError("R34_UNEXPECTED_RELEASE_SYMLINK")
              if p.is_file():
                  present.add(p.relative_to(release).as_posix())
          additions=present-indexed-{"FULL_MANIFEST.json"}
          if additions:
              raise AssertionError("R34_UNINDEXED_RUNTIME_RELEASE_FILES:"+",".join(sorted(additions)[:10]))
          print("P08_R34_NO_UNINDEXED_RELEASE_FILES_AFTER_HTTP=PASS")
          PY
          echo "P08_R34_RUNTIME_CACHE_IS_PRIVATE_AND_NOT_IN_RELEASE=PASS"
      - name: Erase private checkout, temporary synthesized Owner data, ZIPs and logs
        if: always()
        run: |
          rm -rf private-flat private-bridge private-target "$RUNNER_TEMP/p08-original-flat-installed" "$RUNNER_TEMP/p08-bridge-extracted" "$RUNNER_TEMP/p08-target-extracted"
          rm -f "$RUNNER_TEMP/p08-flat-full.zip" "$RUNNER_TEMP/p08-bridge-full.zip" "$RUNNER_TEMP/p08-target-full.zip" "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-atomic-metadata.json" "$RUNNER_TEMP/p08-r33-http.log" "$RUNNER_TEMP/p08-r33-login.html" "$RUNNER_TEMP/p08-r34-cli.txt"
          rm -f "$RUNNER_TEMP"/private-flat-composer.log "$RUNNER_TEMP"/private-flat-npm.log "$RUNNER_TEMP"/private-bridge-composer.log "$RUNNER_TEMP"/private-bridge-npm.log "$RUNNER_TEMP"/private-target-composer.log "$RUNNER_TEMP"/private-target-npm.log
