name: P08 R32 exact source 0.1.0 bridge to 0.1.1 self-contained FULL Atomic (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r32-exact-full-atomic-once.yml'
permissions:
  contents: read
jobs:
  extracted-atomic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      P08_BRIDGE_SHA: 87f6074953e25767797a4679dcc95bd1368c7b13
      P08_TARGET_SHA: 0c2fc7533dbc8ad5016410af0a5a658cfc58c9e0
    steps:
      - name: Checkout temporary public-safe PHP harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exact private P08 0.1.0 bridge checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 87f6074953e25767797a4679dcc95bd1368c7b13
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-bridge
      - name: Exact private P08 0.1.1 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 0c2fc7533dbc8ad5016410af0a5a658cfc58c9e0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-target
      - name: Verify source and target identity, no Owner data
        run: |
          set -euo pipefail
          test "$(git -C private-bridge rev-parse HEAD)" = "$P08_BRIDGE_SHA"
          test "$(git -C private-target rev-parse HEAD)" = "$P08_TARGET_SHA"
          test "$(cat private-bridge/VERSION)" = "0.1.0"
          test "$(cat private-target/VERSION)" = "0.1.1"
          test ! -e private-bridge/.env
          test ! -e private-target/.env
          echo "P08_R32_BRIDGE_SOURCE=$P08_BRIDGE_SHA"
          echo "P08_R32_TARGET_SOURCE=$P08_TARGET_SHA"
      - name: Install PHP 8.4 Composer and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, sodium
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real pinned Composer/Vite for both exact source versions
        run: |
          set -euo pipefail
          for d in private-bridge private-target; do
            (
              cd "$d"
              mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
              composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/$d-composer.log" 2>&1
              npm ci --no-audit --no-fund > "$RUNNER_TEMP/$d-npm.log" 2>&1
              npm run build
              npm run typecheck
              python3 scripts/check_stack_contract.py --phase full
            )
          done
      - name: Genuine extracted bridge FULL, new target FULL, and code-only Atomic ZIP
        run: |
          set -euo pipefail
          python3 private-bridge/scripts/build_full.py --source private-bridge --output "$RUNNER_TEMP/p08-bridge-full.zip" --version 0.1.0 --source-sha "$P08_BRIDGE_SHA"
          python3 private-target/scripts/build_full.py --source private-target --output "$RUNNER_TEMP/p08-target-full.zip" --version 0.1.1 --source-sha "$P08_TARGET_SHA"
          mkdir "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          unzip -qq "$RUNNER_TEMP/p08-bridge-full.zip" -d "$RUNNER_TEMP/p08-bridge-installed"
          unzip -qq "$RUNNER_TEMP/p08-target-full.zip" -d "$RUNNER_TEMP/p08-target-extracted"
          SOURCE_MANIFEST_SHA=$(sha256sum "$RUNNER_TEMP/p08-bridge-installed/FULL_MANIFEST.json" | cut -d' ' -f1)
          php -r 'require "private-bridge/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[1]); VF\AdOps\Installation\SetupGuard::package($argv[2]); echo "P08_R32_DUAL_EXTRACTED_FULL_VERIFIED=PASS\n";' "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          python3 private-target/scripts/build_atomic.py --source private-target --output "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" --source-version 0.1.0 --source-sha "$P08_BRIDGE_SHA" --source-full-manifest-sha256 "$SOURCE_MANIFEST_SHA" --target-version 0.1.1 --target-sha "$P08_TARGET_SHA" > "$RUNNER_TEMP/p08-atomic-metadata.json"
          echo "P08_R32_TARGET_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-target-full.zip" | cut -d' ' -f1)"
          echo "P08_R32_TARGET_FULL_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-target-full.zip")"
          echo "P08_R32_ATOMIC_SHA256=$(sha256sum "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" | cut -d' ' -f1)"
          echo "P08_R32_ATOMIC_BYTES=$(stat -c%s "$RUNNER_TEMP/p08-0.1.1-Atomic.zip")"
          echo "P08_R32_BRIDGE_MANIFEST_SHA256=$SOURCE_MANIFEST_SHA"
      - name: Stage actual ZIP with PHP and verify Python/PHP source-bound seal readback
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p08-bridge-installed"
          mkdir -p "$ROOT/storage/app/private/adops/installation"
          printf '%s\n' '{"status":"INSTALLED","project_id":"P08","database_driver":"sqlite"}' > "$ROOT/storage/app/private/adops/installation/installed.json"
          export P08_ROOT="$ROOT"
          export P08_ARCHIVE="$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          export P08_EXPECT_SHA="$(sha256sum "$P08_ARCHIVE" | cut -d' ' -f1)"
          export P08_TARGET_SHA
          php -r 'require "private-bridge/src/Installation/SetupGuard.php"; require "private-bridge/src/Upgrade/AtomicPackageStage.php"; $result=(new VF\AdOps\Upgrade\AtomicPackageStage())->prepare(getenv("P08_ROOT"),getenv("P08_ARCHIVE"),getenv("P08_EXPECT_SHA"),getenv("P08_TARGET_SHA")); file_put_contents(getenv("RUNNER_TEMP")."/p08-stage-id", $result["id"]); echo "P08_R32_REAL_ZIP_PHP_STAGE=".$result["target_version"]."\n";'
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          obj=json.loads((temp/"p08-atomic-metadata.json").read_text())
          stage_id=(temp/"p08-stage-id").read_text()
          stage=pathlib.Path(os.environ["P08_ROOT"])/"storage/app/private/adops/upgrade"/stage_id/"STAGE_RECEIPT.json"
          assert stage.is_file()
          assert hashlib.sha256(stage.read_bytes()).hexdigest()==obj["stage_receipt_sha256"]
          assert obj["sha256"]==os.environ["P08_EXPECT_SHA"]
          assert obj["source_sha"]==os.environ["P08_BRIDGE_SHA"]
          assert obj["target_sha"]==os.environ["P08_TARGET_SHA"]
          print("P08_R32_REAL_ZIP_PHP_PYTHON_SIGNED_SEAL_MATCH=PASS")
          print("P08_R32_REAL_STAGE_RECEIPT_SHA256="+obj["stage_receipt_sha256"])
          PY
      - name: Actual converted FULL with native SQLite backup, bridge arm, materializer and Atomic swap
        run: |
          set -euo pipefail
          php -l private-bridge/src/Upgrade/AtomicPackageStage.php
          php -l private-bridge/src/Upgrade/AtomicUpgradeArm.php
          php private-target/tests/test_stable_runtime_gateway.php
          php -l harness/p08-r33-extracted-offline-once.php
          php private-bridge/tests/test_atomic_upgrade_arm.php
          ROOT="$RUNNER_TEMP/p08-bridge-installed"
          ZIP="$RUNNER_TEMP/p08-0.1.1-Atomic.zip"
          ZIP_SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          php harness/p08-r33-extracted-offline-once.php "$ROOT" "$RUNNER_TEMP/p08-bridge-full.zip" "$ZIP" "$ZIP_SHA" "$P08_TARGET_SHA" "$P08_BRIDGE_SHA"
      - name: Serve actual upgraded Laravel through stable PHP HTTP entry
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/p08-bridge-installed"
          mkdir -p "$ROOT/storage/framework/cache/data" "$ROOT/storage/framework/sessions" "$ROOT/storage/framework/views" "$ROOT/storage/logs"
          # R34 product bootstrap must select private, per-release Laravel cache automatically.
          php -S 127.0.0.1:18880 -t "$ROOT/public" "$ROOT/public/index.php" > "$RUNNER_TEMP/p08-r33-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1
          LOGIN=$(curl -sS --max-time 10 -o "$RUNNER_TEMP/p08-r33-login.html" -w '%{http_code}' http://127.0.0.1:18880/login)
          APP=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18880/app)
          SETUP=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18880/setup.php)
          echo "P08_R33_HTTP_STATUS_LOGIN=$LOGIN APP=$APP SETUP=$SETUP"
          echo "P08_R33_HTTP_LOGIN=$LOGIN"
          echo "P08_R33_HTTP_GUEST_APP=$APP"
          echo "P08_R33_HTTP_SETUP=$SETUP"
          if [ "$LOGIN" != 200 ] || [ "$APP" != 302 ] || [ "$SETUP" != 503 ]; then
            echo "P08_R33_REAL_HTTP_MISMATCH"
            # Synthetic CI only; never print app config, user credentials or request bodies.
            echo P08_R33_HTTP_FIRST_ERROR_LINES
            head -n 36 "$RUNNER_TEMP/p08-r33-http.log" | sed -E 's/(APP_KEY|DB_PASSWORD|PASSWORD)=([^[:space:]]+)/\1=[REDACTED]/g' || true
            echo P08_R33_LARAVEL_LOG_HEAD
            LOG="$ROOT/storage/logs/laravel.log"
            if [ -f "$LOG" ]; then grep -m 3 -E 'ERROR|Exception|exception' "$LOG" | cut -c1-400 || true; fi
            exit 1
          fi
          test -s "$RUNNER_TEMP/p08-r33-login.html"
          echo "P08_R33_UPGRADED_LARAVEL_REAL_HTTP_LOGIN_200=PASS"
          echo "P08_R33_UPGRADED_LARAVEL_AUTH_REDIRECT_302=PASS"
          echo "P08_R33_UPGRADED_LARAVEL_SETUP_CLOSED_503=PASS"
          php "$ROOT/artisan" list --raw > "$RUNNER_TEMP/p08-r34-cli.txt"
          grep -Fq 'route:list' "$RUNNER_TEMP/p08-r34-cli.txt"
          echo "P08_R34_UPGRADED_STABLE_ARTISAN_COMMANDS=PASS"
          ROOT="$ROOT" php -r 'require "private-target/src/Upgrade/AtomicReleasePointer.php"; $v=(new VF\AdOps\Upgrade\AtomicReleasePointer())->verifyActiveRelease(getenv("ROOT"), getenv("P08_TARGET_SHA")); if ($v["status"] !== "VERIFIED_ACTIVE_FULL") throw new RuntimeException("R34_IMMUTABLE_RELEASE_CHANGED_AFTER_HTTP"); echo "P08_R34_IMMUTABLE_FULL_UNMODIFIED_BY_HTTP=PASS\\n";'
          test -d "$ROOT/storage/app/private/adops/bootstrap-cache/$P08_TARGET_SHA"
          test ! -d "$ROOT/releases/$P08_TARGET_SHA/bootstrap/cache"
          echo "P08_R34_RUNTIME_CACHE_IS_PRIVATE_AND_NOT_IN_RELEASE=PASS"
      - name: Remove private workspace, archives and install fixture after evidence
        if: always()
        run: |
          rm -rf private-bridge private-target "$RUNNER_TEMP/p08-bridge-installed" "$RUNNER_TEMP/p08-target-extracted"
          rm -f "$RUNNER_TEMP/p08-r34-cli.txt" "$RUNNER_TEMP/p08-r33-http.log" "$RUNNER_TEMP/p08-r33-login.html" "$RUNNER_TEMP/p08-bridge-full.zip" "$RUNNER_TEMP/p08-target-full.zip" "$RUNNER_TEMP/p08-0.1.1-Atomic.zip" "$RUNNER_TEMP/p08-atomic-metadata.json" "$RUNNER_TEMP/p08-stage-id"
          rm -f "$RUNNER_TEMP"/private-bridge-composer.log "$RUNNER_TEMP"/private-bridge-npm.log "$RUNNER_TEMP"/private-target-composer.log "$RUNNER_TEMP"/private-target-npm.log
