name: p01-1939-channel-bounded-frontend-proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-1939-channel-freeze-proof-temp.yml
permissions:
  contents: read
jobs:
  channel-source-fix-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 2f58fcefb74c35f64c4462fce249e2892b6518b1
      WORK: /tmp/p01-channel-freeze-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact-source ephemeral private product checkout
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$VF_PRIVATE_READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$WORK"
          git -C "$WORK" fetch -q --depth 8 origin "$SOURCE_SHA"
          git -C "$WORK" checkout -q --detach "$SOURCE_SHA"
          git -C "$WORK" remote set-url origin "https://github.com/llhzx2018/vf-start.git"
          test "$(git -C "$WORK" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$WORK" merge-base --is-ancestor e8b13aeb13f5fbc9c3f2808acccab69fd05e542a "$SOURCE_SHA"; echo $?)" = 0
          test "$(git -C "$WORK" diff --name-only e8b13aeb13f5fbc9c3f2808acccab69fd05e542a "$SOURCE_SHA")" = "$(printf 'src/assets/global-remote-channels.js\nsrc/assets/local-subsite-management.js\ntests/unit/p01_ia5_remote_channels_r34_contract.cjs')"
          echo P01_CHANNEL_EXACT_SOURCE_AND_3_FILE_SCOPE=PASS
      - name: Targeted Node VM contract and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK"
          node --check src/assets/global-remote-channels.js
          node --check src/assets/local-subsite-management.js
          node --check tests/unit/p01_ia5_remote_channels_r34_contract.cjs
          node tests/unit/p01_ia5_remote_channels_r34_contract.cjs
          # channel-youtube-updates.js and its older batch VM harness are
          # outside this 3-file change. The older harness lacks window in
          # its own VM context; do not misclassify that as this fix failing.
          echo P01_CHANNEL_FIX_NODE_CANCELLATION_AND_SEQUENTIAL_REGRESSION=PASS
      - name: Cleanup all transient source
        if: always()
        shell: bash
        run: |
          echo P01_CHANNEL_PRODUCTION_WRITE=NONE
          echo P01_CHANNEL_PUBLIC_PRIVATE_SOURCE_ARTIFACT=NONE
          case "$WORK" in /tmp/p01-channel-freeze-*) rm -rf -- "$WORK";; *) exit 68;; esac
