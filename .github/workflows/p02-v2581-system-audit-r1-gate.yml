name: P02 V2.5.81 System Audit R1 Gate

on:
  push:
    branches:
      - run/p02-v2581-system-audit-r1-20260922
    paths:
      - '.github/workflows/p02-v2581-system-audit-r1-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 669d19bd8d8a7686a13f26f7f3cf0693d7d78d11
      TARGET_VERSION: 2.5.81
      TARGET_SCHEMA: "2401"
    steps:
      - name: Checkout exact private P02 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact source and repository contracts
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          python3 - <<'PY'
          import json
          x=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          assert x['version']=='2.5.81', x
          assert int(x['schema'])==2401, x
          print('SOURCE_MANIFEST_IDENTITY=PASS')
          PY
          bash scripts/verify-repository.sh
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find public tests scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          git diff --check
          echo P02_V2581_SYSTEM_AUDIT_R1_SOURCE_GATE=PASS

      - name: Security maintenance and browser regression
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-AUDIT-R1-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2581-system-audit-r1
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          grep -q 'LEGACY_CATEGORY_DELETE_RECENT_AUTH_BOUNDARY=PASS' "$EVIDENCE_DIR/legacy-category-delete-recent-auth.txt"
          grep -q 'LEGACY_CATEGORY_DELETE_AFTER_REAUTH=PASS' "$EVIDENCE_DIR/legacy-category-delete-recent-auth.txt"
          echo P02_V2581_SYSTEM_AUDIT_R1_SECURITY_GATE=PASS

      - name: Final bounded result
        shell: bash
        run: |
          echo P02_V2581_SYSTEM_AUDIT_R1_GATE=PASS
