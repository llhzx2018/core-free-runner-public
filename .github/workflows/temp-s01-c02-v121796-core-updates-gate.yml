name: TEMP S01-C02 1.21.796 Core Updates Gate

on:
  push:
    branches:
      - temp/s01-c02-v121796-core-updates-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121796-core-updates-gate.yml'

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 0fc8c5a63b02fe0619d900951a569d8cc5697361
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 0fc8c5a63b02fe0619d900951a569d8cc5697361
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo 'UPDATE_CORE_REGRESSION=PASS'

      - name: Verify S01-C02 manifest and released asset readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .target_version=="1.21.796" and .from_versions==["1.21.795"] and .release_tag=="v1.21.796" and .asset_name=="vf-tools-ops_V1.21.796.zip" and .asset_bytes==3188206 and .asset_sha256=="8f8fddd9f52ccd61e792d73585c45b1631220ca715c7ddf4d766225cfdfa38ff" and .runtime_files==891 and .runtime_fingerprint=="a3c76192110f330da58c0631aab46203822b556028b62156066aafc55ec460a4" and .runtime_file_count==891 and .runtime_fingerprint_sha256=="a3c76192110f330da58c0631aab46203822b556028b62156066aafc55ec460a4" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .backup_required==true and .rollback_supported==true and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$FILE" >/dev/null
          REL="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.796')"
          test "$(jq -r '.id' <<<"$REL")" = 382344596
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.796.zip")|.id' <<<"$REL")" = 543371017
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.796.zip")|.size' <<<"$REL")" = 3188206
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.796.zip")|.digest' <<<"$REL")" = 'sha256:8f8fddd9f52ccd61e792d73585c45b1631220ca715c7ddf4d766225cfdfa38ff'
          TAG="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.796')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = 86e0664f193a6d76198e55756c938c64672416db
          echo 'S01_C02_1_21_796_CHANNEL_IDENTITY=PASS'
