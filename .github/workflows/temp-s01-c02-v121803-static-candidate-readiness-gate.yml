name: TEMP S01-C02 Ops 1.21.803 Static Candidate Readiness Gate

on:
  push:
    branches:
      - temp/s01-c02-v121803-static-candidate-readiness-gate-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121803-static-candidate-readiness-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BASE_SHA: 11163b7833ec4908b9593ddf424c9bfe39db4975
      CANDIDATE_SHA: 3d30c5e0f9a8dd5af9d3842adbba71976812307e
      CANDIDATE_TREE: d528e279e487944f954dd9fa6365ae548f99c00e
      BASE_ASSET_ID: '544183183'
      BASE_BYTES: '3204127'
      BASE_SHA256: a03549a39a7eceaf90a4c3e7d53d9fa942d945ef456e6df97c05f2db0ab79cea
      CANDIDATE_ZIP: /tmp/vf-tools-ops_V1.21.803.zip
      WP_PATH: /tmp/vf803-wp
      EVIDENCE: /tmp/vf803-evidence
    steps:
      - name: Checkout exact Candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify bounded source and focused contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.803
          git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort > "$EVIDENCE/changed-files.txt"
          printf '%s\n' '.github/phase3/v121803-static-candidate-readiness.php' 'VERSION' 'includes/site-release/s01-static-candidate-readiness.php' 'vf-ops.php' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt "$EVIDENCE/changed-files.txt"
          php -l ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-candidate-readiness.php
          php ops/.github/phase3/v121803-static-candidate-readiness.php | tee "$EVIDENCE/focused.txt"
          grep -Fxq PASS_V121803_STATIC_CANDIDATE_READINESS "$EVIDENCE/focused.txt"
          grep -Fq "Version: 1.21.803" ops/vf-ops.php
          grep -Fq "s01-static-candidate-readiness.php" ops/vf-ops.php
          cmp <(git -C ops show "$BASE_SHA:includes/seo-data/keyword-authority-closure-service.php") ops/includes/seo-data/keyword-authority-closure-service.php
          cmp <(git -C ops show "$BASE_SHA:includes/seo-data/keyword-planner-bridge-service.php") ops/includes/seo-data/keyword-planner-bridge-service.php
          cmp <(git -C ops show "$BASE_SHA:includes/site-release/final-domain-authority.php") ops/includes/site-release/final-domain-authority.php
          echo SOURCE_SCOPE=PASS

      - name: Build deterministic Candidate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re,hashlib,zipfile,json,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
            p=rel.as_posix(); parts=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return parts[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); assert len(files)==897,len(files)
          fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path(os.environ['CANDIDATE_ZIP'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              i=zipfile.ZipInfo('vf-ops/'+r,(2026,9,4,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          m={'target_commit':os.environ['CANDIDATE_SHA'],'target_tree':os.environ['CANDIDATE_TREE'],'asset_bytes':z.stat().st_size,'asset_sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'runtime_files':len(files),'runtime_fingerprint':fp.hexdigest()}
          Path(os.environ['EVIDENCE']+'/candidate-artifact.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
          unzip -tq "$CANDIDATE_ZIP" >/dev/null
          unzip -Z1 "$CANDIDATE_ZIP" | grep -Fxq 'vf-ops/includes/site-release/s01-static-candidate-readiness.php'
          echo PACKAGED_CANDIDATE=PASS

      - name: Download exact formal 1.21.802 base ZIP
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -L --retry 3 -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${BASE_ASSET_ID}" -o /tmp/base.zip
          test "$(stat -c '%s' /tmp/base.zip)" = "$BASE_BYTES"
          test "$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_SHA256"
          unzip -tq /tmp/base.zip >/dev/null
          echo EXACT_BASE_RELEASE=PASS

      - name: Install WordPress 7.1 fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1

      - name: Exact packaged 1.21.802 to 1.21.803 REST upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base "$WP_PATH/wp-content/plugins/vf-ops"; mkdir -p /tmp/base
          unzip -q /tmp/base.zip -d /tmp/base
          mv /tmp/base/vf-ops "$WP_PATH/wp-content/plugins/vf-ops"
          wp plugin activate vf-ops --path="$WP_PATH"
          test "$(wp eval --path="$WP_PATH" 'echo VF_OPS_VERSION;')" = 1.21.802
          nohup wp --path="$WP_PATH" server --host=127.0.0.1 --port=8080 >/tmp/wp-server-base.log 2>&1 &
          server_pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8080/?rest_route=/' >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then echo WP_BASE_SERVER_EXITED_BEFORE_READY; cat /tmp/wp-server-base.log || true; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          echo WP_BASE_SERVER_READY=PASS
          curl -fsS 'http://127.0.0.1:8080/?rest_route=/' -o /tmp/base-index.json
          jq empty /tmp/base-index.json
          if jq -e '.routes | has("/vf-ops/v1/s01-static-candidate-readiness")' /tmp/base-index.json >/dev/null; then echo BASE_ROUTE_UNEXPECTEDLY_PRESENT; exit 1; fi
          echo BASE_ROUTE_ABSENT=PASS
          base_control_code="$(curl -sS -o /tmp/base-domain.json -w '%{http_code}' 'http://127.0.0.1:8080/?rest_route=/vf-ops/v1/s01-domain-authority')"
          echo "BASE_CONTROL_ROUTE_CODE=$base_control_code"
          if [ "$base_control_code" != 200 ]; then cat /tmp/base-domain.json || true; cat /tmp/wp-server-base.log || true; exit 1; fi
          jq -e '.pluginVersion=="1.21.802"' /tmp/base-domain.json >/dev/null
          echo BASE_CONTROL_ROUTE=PASS

          rm -rf /tmp/candidate "$WP_PATH/wp-content/plugins/vf-ops"; mkdir -p /tmp/candidate
          unzip -q "$CANDIDATE_ZIP" -d /tmp/candidate
          mv /tmp/candidate/vf-ops "$WP_PATH/wp-content/plugins/vf-ops"
          test "$(wp eval --path="$WP_PATH" 'echo VF_OPS_VERSION;')" = 1.21.803
          wp eval --path="$WP_PATH" '$r=rest_get_server()->get_routes(); echo "domain=".(isset($r["/vf-ops/v1/s01-domain-authority"])?"1":"0")." static=".(isset($r["/vf-ops/v1/s01-static-candidate-readiness"])?"1":"0");' | tee "$EVIDENCE/cli-routes.txt"
          grep -Fxq 'domain=1 static=1' "$EVIDENCE/cli-routes.txt"
          echo CANDIDATE_CLI_ROUTE_REGISTRY=PASS

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          for i in $(seq 1 10); do if ! curl -sS 'http://127.0.0.1:8080/?rest_route=/' >/dev/null 2>&1; then break; fi; sleep 1; done
          nohup wp --path="$WP_PATH" server --host=127.0.0.1 --port=8080 >/tmp/wp-server-candidate.log 2>&1 &
          candidate_server_pid=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8080/?rest_route=/' >/dev/null; then ready=1; break; fi
            if ! kill -0 "$candidate_server_pid" 2>/dev/null; then echo WP_CANDIDATE_SERVER_EXITED_BEFORE_READY; cat /tmp/wp-server-candidate.log || true; exit 1; fi
            sleep 1
          done
          test "$ready" = 1
          echo WP_CANDIDATE_SERVER_READY=PASS
          candidate_control_code="$(curl -sS -o /tmp/candidate-domain.json -w '%{http_code}' 'http://127.0.0.1:8080/?rest_route=/vf-ops/v1/s01-domain-authority')"
          echo "CANDIDATE_CONTROL_ROUTE_CODE=$candidate_control_code"
          if [ "$candidate_control_code" != 200 ]; then cat /tmp/candidate-domain.json || true; cat /tmp/wp-server-candidate.log || true; exit 1; fi
          jq empty /tmp/candidate-domain.json
          candidate_control_plugin_version="$(jq -r '.pluginVersion // "UNKNOWN"' /tmp/candidate-domain.json)"
          echo "CANDIDATE_CONTROL_PLUGIN_VERSION=$candidate_control_plugin_version"
          echo CANDIDATE_CONTROL_ROUTE=PASS

          code="$(curl -sS -o "$EVIDENCE/rest.json" -w '%{http_code}' 'http://127.0.0.1:8080/?rest_route=/vf-ops/v1/s01-static-candidate-readiness')"
          echo "CANDIDATE_ROUTE_CODE=$code"
          if [ "$code" != 200 ]; then cat "$EVIDENCE/rest.json" || true; cat /tmp/wp-server-candidate.log || true; exit 1; fi
          jq empty "$EVIDENCE/rest.json"
          jq -e '.pluginVersion=="1.21.803" and .finalOnlinePass=="NO" and has("seoCandidateReady") and has("releaseBatchReady") and has("sourceInspectionComplete") and has("manualSourceUploadRequired") and has("nextBoundary")' "$EVIDENCE/rest.json" >/dev/null
          ! grep -Eq 'source_path|privatePath|download_url|keyword|targetUrl' "$EVIDENCE/rest.json"
          echo PACKAGED_WORDPRESS_REST_UPGRADE=PASS

      - name: Protected-scope source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | grep -Ev '^(.github/phase3/v121803-static-candidate-readiness.php|VERSION|includes/site-release/s01-static-candidate-readiness.php|vf-ops.php)$' && exit 1 || true
          echo NO_M3U8_SEED_POST_PLUGIN_GOVERNANCE_WRITE_SCOPE=PASS
          cat "$EVIDENCE/candidate-artifact.json"
          echo PASS_V121803_STATIC_CANDIDATE_READINESS_GATE

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121803-static-candidate-readiness-gate
          path: ${{ env.EVIDENCE }}/
          retention-days: 14
