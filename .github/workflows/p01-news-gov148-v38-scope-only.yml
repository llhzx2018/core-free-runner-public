name: P01 News GOV148 V3.8 and RP-07J eight Chinese source only

on:
  push:
    branches:
      - test/p01-news-gov148-v38-rp07j-20261109

permissions:
  contents: read

concurrency:
  group: p01-news-gov148-v38-scope-review
  cancel-in-progress: false

jobs:
  exact-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOV_HEAD: 339e9772cbfbf41607f5ad7af37b721d3b237eef
      GOV_BASE: 0ed37e13cccd4c959c59fcce4e7b13d3ba0f7694
      P01_HEAD: 55461247bf6a0b2241d0ba9317913daa0b6fba64
    steps:
      - name: Checkout registered public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact governance candidate only transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 5
          path: gov
          persist-credentials: false
      - name: Checkout exact P01 stable authority candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 2
          path: p01
          persist-credentials: false
      - name: Exact source governance and prior Mode A-I invariants
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "$GOV_HEAD"
          test "$(git -C p01 rev-parse HEAD)" = "$P01_HEAD"
          test "$(cat p01/VERSION)" = 2.47.505
          test "$(cat p01/src/VERSION.txt)" = 2.47.505
          test "$(git -C gov rev-parse "$GOV_BASE^{commit}")" = "$GOV_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          g=Path('gov'); p=Path('p01')
          def show(directory, rev, path):
              return subprocess.check_output(['git','-C',str(directory),'show',f'{rev}:{path}'],text=True)
          def files(directory,base):
              return subprocess.check_output(['git','-C',str(directory),'diff','--name-only',base,'HEAD'],text=True).splitlines()
          assert set(files(g,'0ed37e13cccd4c959c59fcce4e7b13d3ba0f7694'))=={
              'CURRENT.md',
              'skills/skill-release/V3.8/SKILL.md',
              'governance/release/cases/P01_NEWS_EIGHT_CHINESE_SOURCES_SCOPE_DELTA_REVIEW_20261109.md'}
          assert files(p,'HEAD^')==['docs/authority/ACCEPTANCE_MATRIX.md']
          original=(g/'skills/skill-release/V3.7/SKILL.md').read_text()
          assert original==show(g,'0ed37e13cccd4c959c59fcce4e7b13d3ba0f7694','skills/skill-release/V3.7/SKILL.md')
          current=(g/'skills/skill-release/V3.8/SKILL.md').read_text()
          def modes(value):
              return {m.group(1):m.group(0) for m in re.finditer(
                  r'(?ms)^### Mode ([A-J]) .*?(?=^### Mode [A-J] |^## 2\.|\Z)',value)}
          before,after=modes(original),modes(current)
          assert set(before)==set(after)==set('ABCDEFGHIJ'),(list(before),list(after))
          for mode in 'ABCDEFGHI':
              assert before[mode]==after[mode],f'sealed Mode {mode} modified'
          assert 'version: "3.8"' in current and 'previous_version: "3.7"' in current
          assert '#148' in after['J'] and '#147' in after['J']
          for content in (
              'EIGHT_CHINESE_UNLICENSED_RSS_SOURCE_ITEMS_GUEST_FAIL_CLOSED = PASS',
              'www.chinanews.com.cn','www.ithome.com','www.solidot.org','sspai.com',
              'eight fixed Chinese RSS channels','public_items_licensed=false',
              'News-first requires','Do NOT reroute denied equivalent',
              'REAL_BACKUP_RESTORE_INTERRUPTION_AND_FAULT_ROLLBACK = PASS',
              'RELEASE_PUBLIC_AUTHORITY_13_DOMAINS_RESOLVED_NO_UNKNOWN = PASS',
              'SECURITY_PR_1949_V506_FIRST_OR_SEPARATELY_APPROVED_NEWS_FIRST_SEQUENCE = PASS',
              'PRODUCTION_AUTO_APPLY = NO'):
              assert content in after['J'],content
          assert 'SIX_UNLICENSED_PUBLIC_RSS_SOURCE_ITEMS' in before['J']
          assert 'SIX_UNLICENSED_PUBLIC_RSS_SOURCE_ITEMS' not in after['J']
          v38=(g/'CURRENT.md').read_text()
          assert '| skill-release | V3.8 |' in v38
          assert 'Runtime Entry                -> governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.7.md' in v38
          assert 'GOV-DOC #147 human-preview timing and #148' in v38
          reviewed=(g/'governance/release/cases/P01_NEWS_EIGHT_CHINESE_SOURCES_SCOPE_DELTA_REVIEW_20261109.md').read_text()
          assert 'OWNER_INDEPENDENT_GOV148_SCOPE_ADOPTION_APPROVED' in reviewed
          assert 'OWNER_DELTA_ADOPTION=APPROVED' in reviewed
          previous=show(p,'HEAD^','docs/authority/ACCEPTANCE_MATRIX.md').splitlines()
          candidate=(p/'docs/authority/ACCEPTANCE_MATRIX.md').read_text().splitlines()
          assert len(previous)==len(candidate)
          differences=[(a,b) for a,b in zip(previous,candidate) if a!=b]
          assert len(differences)==1 and differences[0][0].startswith('| RP-07J |')
          assert differences[0][1].startswith('| RP-07J |')
          for line in previous:
              if line.startswith('| RP-07I |'):
                  assert line in candidate
                  break
          else:
              raise AssertionError('Missing RP-07I')
          rp=differences[0][1]
          for must in ('GOV-DOC #147 与 #148','skill-release V3.8+',
                       'www.chinanews.com.cn','www.ithome.com','www.solidot.org','sspai.com',
                       'public_items_licensed=false','Guest','真实保护备份恢复',
                       '13 个 Public Authority','安全 PR #1949','全部发布前条件 PASS',
                       'Production'):
              assert must in rp,must
          print('P01_GOV148_RELEASE_MODES_A_I_BYTE_IDENTICAL=PASS')
          print('P01_GOV148_MODEJ_EIGHT_CHINESE_FOUR_HOSTS=PASS')
          print('P01_GOV148_GUEST_DENY_PROVIDER_RIGHTS=PASS')
          print('P01_GOV148_SECURITY_506_FIRST_AND_13_DOMAIN_UNCHANGED=PASS')
          print('P01_GOV148_CURRENT_V38_RUNTIME_V17=PASS')
          print('P01_GOV148_RP07J_ONLY_MATRIX_CHANGE=PASS')
          print('P01_GOV148_OWNER_ADOPTION_SCOPE_BOUND=PASS')
          print('P01_GOV148_PRODUCT_RELEASE=NOT_EXECUTED')
          print('P01_GOV148_PRODUCTION_WRITE=NONE')
          PY
      - name: Remove temporary governance and P01 source
        if: always()
        shell: bash
        run: |
          rm -rf gov p01
          echo P01_GOV148_PRIVATE_SOURCE_CLEANUP=COMPLETE
