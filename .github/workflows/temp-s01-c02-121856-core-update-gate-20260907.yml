name: S01-C02 Ops 1.21.856 Core Update Gate
on:
  push:
    branches:
      - temp/s01-c02-121856-core-update-gate-20260907
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_HEAD: a146afc9127ed30992dcf7f08ae11d55a74b1f93
      CORE_BASE: 26b84430e6ad7f696db7b4d9d2525d2f248975de
      OPS_SHA: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
      RELEASE_ID: '383935659'
      ASSET_ID: '548447508'
      ASSET_BYTES: '3339486'
      ASSET_SHA256: 7989e1814051de7e7e5236b0b530836d2812a85482be8f6e7b0ec7a799ca9b96
    steps:
      - name: Credential boundary
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -z "${VF_RELEASE_WRITE_TOKEN:-}"
          echo 'READ_ONLY_CREDENTIAL=YES'
          echo 'RELEASE_WRITE_USED=NO'
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_HEAD }}
          token: ${{ env.READ_TOKEN }}
          path: core
          fetch-depth: 0
          persist-credentials: false
      - name: Exact one-manifest fence
        run: |
          set -Eeuo pipefail
          cd core
          test "$(git rev-parse HEAD)" = "$CORE_HEAD"
          test "$(git diff --name-only "$CORE_BASE"..HEAD)" = 'projects/S01-C02.json'
          echo 'EXACT_ONE_MANIFEST_DELTA=PASS'
      - name: Manifest JSON and canonical contract
        run: |
          set -Eeuo pipefail
          cd core
          python3 -m json.tool projects/S01-C02.json >/dev/null
          python3 scripts/check_manifest_contract.py
      - name: Update Core PHP regression
        run: |
          set -Eeuo pipefail
          cd core
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
      - name: Exact C02 semantics and sibling preservation
        run: |
          set -Eeuo pipefail
          cd core
          python3 - <<'PY'
          import json
          c1=json.load(open('projects/S01-C01.json'))
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))
          assert c1['target_version']=='1.35.16', c1['target_version']
          assert c3['target_version']=='1.25.25', c3['target_version']
          assert c2['target_version']=='1.21.856'
          assert c2['release_tag']=='v1.21.856'
          assert c2['asset_name']=='vf-tools-ops_V1.21.856.zip'
          assert c2['asset_bytes']==3339486
          assert c2['asset_sha256']=='7989e1814051de7e7e5236b0b530836d2812a85482be8f6e7b0ec7a799ca9b96'
          assert c2['runtime_files']==934 and c2['runtime_file_count']==934
          assert c2['runtime_fingerprint']==c2['runtime_fingerprint_sha256']=='f8a2ff5201f29ee4b5d3860041ba6eb89ac04e1fec56d310e263056ff1d2e0b4'
          assert c2['schema_from']==c2['schema_to']=='6.0.0'
          assert c2['physical_locator']=='vf-ops/vf-ops.php'
          assert c2['locator_cutover'] is False
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853','1.21.854','1.21.855']
          assert 'Production' in c2['notes'] and 'does not claim' in c2['notes']
          print('C02_EXACT_SEMANTICS=PASS')
          print('C01_C03_PRESERVED=PASS')
          PY
      - name: Live formal Release authority readback
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          REPO='llhzx2018/vf-tools-ops'
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$OPS_SHA"
          test "$(gh api "repos/$REPO/git/ref/tags/v1.21.856" --jq '.object.sha')" = "$OPS_SHA"
          gh api "repos/$REPO/releases/tags/v1.21.856" > /tmp/release.json
          test "$(jq -r '.id' /tmp/release.json)" = "$RELEASE_ID"
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.856.zip")|.id' /tmp/release.json)" = "$ASSET_ID"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.856.zip")|.size' /tmp/release.json)" = "$ASSET_BYTES"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.856.zip")|.digest' /tmp/release.json)" = "sha256:$ASSET_SHA256"
          echo 'LIVE_RELEASE_AUTHORITY=PASS'
      - name: Final exact candidate
        run: |
          cd core
          test "$(git rev-parse HEAD)" = "$CORE_HEAD"
          echo 'S01_C02_121856_CORE_UPDATE_GATE=PASS'
