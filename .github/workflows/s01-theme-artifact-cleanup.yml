name: S01-C01 private artifact retention cleanup
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-artifact-cleanup.yml']
permissions:
  contents: read
  actions: write
jobs:
  purge:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete wrongly retained private-theme public artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method DELETE repos/llhzx2018/core-free-runner-public/actions/artifacts/12133336652
          echo PRIVATE_ARTIFACT_12133336652_DELETE_API=PASS
      - name: Remote readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          code=$(gh api -i repos/llhzx2018/core-free-runner-public/actions/artifacts/12133336652 2>&1 | grep -m1 'HTTP/' || true)
          if gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/12133336652 >/dev/null 2>&1; then
            echo 'PRIVATE_ARTIFACT_STILL_PRESENT';exit 1
          fi
          echo 'PRIVATE_ARTIFACT_REMOTE_GONE=PASS'
