name: P02 W1 browser bundle repair and private build (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-w1-real-browser-20261112.yml']
permissions:
  contents: read
jobs:
  rebuild-private:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: fe9d7303ac9e66ae629a892aba46d13b3193e5a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Real locked Vue production build for exact P02 source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'fe9d7303ac9e66ae629a892aba46d13b3193e5a2'
          test "$(cat product/VERSION)" = '2.5.127'
          cd product/frontend/w1-search
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          test "$(wc -c < ../../public/assets/w1/w1-search.js)" -gt 10000
          grep -q 'mountW1Search' ../../public/assets/w1/w1-search.js
          if grep -q 'process.env.NODE_ENV' ../../public/assets/w1/w1-search.js; then
            echo P02_W1_BROWSER_NODE_ENV_LEAK=FAIL
            exit 1
          fi
          echo P02_W1_BROWSER_NODE_ENV_LEAK=NONE
      - name: Write verified compiled JS/CSS into P02 private development branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_W1_PRIVATE_DEV_WRITE_UNAVAILABLE; exit 78; }
          branch='p02/w1-real-browser-e2e-20261112'
          repo='llhzx2018/vf-library'
          expected='fe9d7303ac9e66ae629a892aba46d13b3193e5a2'
          live="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
          test "$live" = "$expected" || { echo P02_W1_PRIVATE_HEAD_DRIFT; exit 78; }
          for file in public/assets/w1/w1-search.js public/assets/w1/w1-search.css; do
            localfile="product/$file"
            test -s "$localfile"
            sha="$(gh api "repos/$repo/contents/$file?ref=$branch" --jq '.sha')"
            request_json="$(mktemp)"
            python3 - "$localfile" "$sha" "$branch" "$request_json" <<'PY'
          import sys,json,base64
          from pathlib import Path
          filename,sha,branch,target=sys.argv[1:]
          Path(target).write_text(json.dumps({
            'branch':branch,'sha':sha,
            'message':'build(P02 W1): browser-safe compiled Vue '+Path(filename).name,
            'content':base64.b64encode(Path(filename).read_bytes()).decode('ascii'),
          }))
          PY
            gh api --method PUT "repos/$repo/contents/$file" --input "$request_json" >/dev/null
            rm -f "$request_json"
            echo "P02_W1_COMPILED_PRIVATE_ASSET=$(basename "$file")"
          done
          echo P02_W1_PRIVATE_BROWSER_MODULE_REBUILT=PASS
      - name: Clean transient private product tree
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
