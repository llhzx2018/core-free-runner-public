name: S01 Fine Polish Full R1 Gate

on:
  push:
    branches:
      - task/s01-fine-polish-full-r1-gate
    paths:
      - .github/workflows/s01-fine-polish-full-r1-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: Fine Polish Exact (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 04787336f03b4f02c66a66d9dd159b37032b7af2
            head: 021edba982924f5e9fe7dd7ba4eb43195eba47d9
            test: tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            loader: includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            css: assets/css/current/admin-s01-page-body-fine-polish-r1.css
            allowed: assets/css/current/admin-s01-page-body-fine-polish-r1.css,includes/views/admin-style-helpers/admin-s01-uiux-polish.php,tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 80a271c01e066c30ced8aae4a877b36f9690bec3
            head: 7ced0b5575998d9410a44d4b28336709fdfe1aef
            test: tests/s01-c01-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            loader: src/inc/admin/admin-s01-uiux-polish.php
            css: src/assets/css/admin/admin-s01-page-body-fine-polish-r1.css
            allowed: src/assets/css/admin/admin-s01-page-body-fine-polish-r1.css,src/inc/admin/admin-s01-uiux-polish.php,tests/s01-c01-page-body-v2-fine-polish-r1-full-surface-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: fa9706d191fec8de88cf53dcb483ce5a83738b1b
            head: 143f024f4c94ee2d5e0836ef117ad2008d81223a
            test: tests/s01-c03-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            loader: src/admin/admin-s01-uiux-polish.php
            css: src/admin/ui-v4/admin-s01-page-body-fine-polish-r1.css
            allowed: src/admin/ui-v4/admin-s01-page-body-fine-polish-r1.css,src/admin/admin-s01-uiux-polish.php,tests/s01-c03-page-body-v2-fine-polish-r1-full-surface-contract.php

    steps:
      - name: Credential gate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact candidate and bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"

          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")

          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: PHP syntax + coverage contracts
        env:
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
          LOADER: ${{ matrix.loader }}
        run: |
          set -Eeuo pipefail
          php -l "$SOURCE_DIR/$LOADER"
          php -l "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"

      - name: Frozen boundary and detail gates
        env:
          COMPONENT: ${{ matrix.component }}
          CSS: ${{ matrix.css }}
        run: |
          set -Eeuo pipefail
          css="$SOURCE_DIR/$CSS"
          test -s "$css"
          ! grep -F '.vf-v6-shell-header' "$css"
          ! grep -F '.vf-v6-domain-nav' "$css"
          case "$COMPONENT" in
            OPS)
              ! grep -F '.vf-v6-domain-menu' "$css"
              grep -F 'data-vf-page-archetype="a1"' "$css"
              grep -F 'data-vf-page-archetype="a7"' "$css"
              ;;
            THEME)
              ! grep -F '.vf-theme-admin-header' "$css"
              for id in THM-DASH-001 THM-BRAND-001 THM-LAYOUT-001 THM-NAV-001 THM-RENDER-001 THM-SEO-001 THM-PREVIEW-001 THM-BACKUP-001; do
                grep -F "data-vf-page-id=\"$id\"" "$css"
              done
              ;;
            M3U8)
              ! grep -F '.vf-m3u8-console-head' "$css"
              ! grep -F '.vf-m3u8-primary-nav' "$css"
              for a in a1 a2 a3 a4 a5 a6 a7; do grep -F "data-vf-page-archetype=\"$a\"" "$css"; done
              ;;
          esac
          grep -F 'focus-visible' "$css"
          grep -F 'prefers-reduced-motion' "$css"
          grep -F 'max-width:782px' "$css"
          echo "FINE_POLISH_DETAIL_GATE=PASS"

      - name: Coverage summary
        run: |
          echo "FULL_SURFACE_DENOMINATOR=34"
          echo "OPS=14"
          echo "THEME=8"
          echo "M3U8=12"
          echo "SOURCE_FINE_POLISH_COVERAGE=PASS"
          echo "PRODUCTION_VISUAL_EVIDENCE=PENDING_AFTER_RELEASE"
