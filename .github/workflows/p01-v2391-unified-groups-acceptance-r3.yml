name: P01 V2.39.1 Unified Groups Acceptance R3

on:
  push:
    branches:
      - gate/p01-v2391-unified-groups-20260903-r1
    paths:
      - '.github/workflows/p01-v2391-unified-groups-acceptance-r3.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2391-unified-groups-acceptance-r3
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_P01_HEAD: 8b95ad32df3cce969490efd28d2e93c2dafe6b11
      P01_REF: product/p01-v2391-unified-groups-production-acceptance-20260903
    steps:
      - name: Require private checkout credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'PRIVATE_CHECKOUT_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact private P01 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Bind exact candidate head
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git -C p01 rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_P01_HEAD"
          echo "P01_EXACT_HEAD=$ACTUAL"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l p01/src/app/SurfaceRepository.php
          php -l p01/src/app/ProjectResource.php
          php -l p01/src/workspace-create.php
          php -l p01/src/workspace-save.php
          php -l p01/src/surface-open.php
          php -l p01/src/workspace-action.php
          php -l p01/tests/integration/p01_v2391_resource_groups_acceptance.php
          echo 'P01_V2391_PHP_LINT=PASS'

      - name: JavaScript syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check p01/src/assets/workspace-create-bundle.js
          echo 'P01_V2391_JS_SYNTAX=PASS'

      - name: Five-group and project-order authority guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          surface=Path('p01/src/app/SurfaceRepository.php').read_text(encoding='utf-8')
          action=Path('p01/src/workspace-action.php').read_text(encoding='utf-8')
          exact="public const SURFACES = ['start', 'channels', 'watch', 'topics', 'projects'];"
          assert exact in surface, 'five-group SURFACES authority drifted'
          assert 'project_sort_order' in surface, 'project-local dormant order missing'
          block=action.split("if ($action === 'project_reorder')",1)[1].split("if ($action === 'project_delete')",1)[0]
          assert 'UPDATE links SET sort_order' not in block, 'project reorder still mutates canonical link order'
          assert 'project_sort_order' in block, 'project reorder does not write group-local order'
          changed=[
              Path('p01/src/app/SurfaceRepository.php'),
              Path('p01/src/app/ProjectResource.php'),
              Path('p01/src/workspace-create.php'),
              Path('p01/src/workspace-save.php'),
              Path('p01/src/surface-open.php'),
              Path('p01/src/workspace-action.php'),
              Path('p01/src/assets/workspace-create-bundle.js'),
              Path('p01/tests/integration/p01_v2391_resource_groups_acceptance.php'),
          ]
          for path in changed:
              text=path.read_text(encoding='utf-8').lower()
              assert "surface'=>'books'" not in text and "'books'" not in text, f'illegal sixth group leaked into {path}'
          print('P01_V2391_FIVE_GROUP_AND_PROJECT_ORDER_AUTHORITY=PASS')
          PY

      - name: Unified resource groups integration acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          php p01/tests/integration/p01_v2391_resource_groups_acceptance.php

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf p01
          test ! -e p01
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
