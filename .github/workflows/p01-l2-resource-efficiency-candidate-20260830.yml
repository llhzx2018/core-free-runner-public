name: P01 L2 Resource Efficiency Exact Candidate Gate

on:
  push:
    branches: [task/p01-l2-resource-efficiency-candidate-20260830]
    paths:
      - .github/workflows/p01-l2-resource-efficiency-candidate-20260830.yml
      - .github/scripts/p01-l2-resource-efficiency-candidate-20260830.sh
      - scripts/p01-l2-resource-efficiency-browser-v2.mjs

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 25dd705582a6f2c0c06a3f52c32c780c2268b5fa
      TREE: d44882648a101e314ba66a66eb8b7f72ec67b283
      BASELINE: 2733f9687a9f72d740b6289d938a9f0e01e62e4f
      ROOT: /tmp/p01-l2-resource-efficiency
      COOKIE: /tmp/p01-l2-resource-efficiency.cookies
      EVIDENCE: /tmp/p01-l2-resource-efficiency-evidence
      PORT: '18342'

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact source, fresh runtime and machine regression
        run: bash runner/.github/scripts/p01-l2-resource-efficiency-candidate-20260830.sh

      - name: Browser interaction and responsive UI gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-l2-ui "$EVIDENCE"
          cd /tmp/p01-l2-ui
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
          cp "$GITHUB_WORKSPACE/runner/scripts/p01-l2-resource-efficiency-browser-v2.mjs" ./gate.mjs
          node gate.mjs | tee "$EVIDENCE/browser-console.txt"
          grep -Fx 'P01_L2_BROWSER=PASS' "$EVIDENCE/browser-result.txt"

      - name: Verify bulk visibility mutation and final database integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-l2-final-db.php <<'PHP'
          <?php
          declare(strict_types=1);
          require '/tmp/p01-l2-resource-efficiency/app/bootstrap.php';
          $db = vf_db();
          $total = (int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn();
          $public = (int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_private=0")->fetchColumn();
          if ($total !== 423 || $public !== 423) {
              fwrite(STDERR, "total={$total} public={$public}\n");
              exit(1);
          }
          if (strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()) !== 'ok') exit(2);
          if ($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC)) exit(3);
          echo "P01_L2_BULK_VISIBILITY=PASS\n";
          PHP
          php -l /tmp/p01-l2-final-db.php >/dev/null
          php /tmp/p01-l2-final-db.php | tee "$EVIDENCE/database-result.txt"
          grep -Fx 'P01_L2_BULK_VISIBILITY=PASS' "$EVIDENCE/database-result.txt"

      - name: Record exact candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo 'P01_L2_RESOURCE_EFFICIENCY_CANDIDATE=PASS'
            echo "SOURCE=$SOURCE"
            echo "TREE=$TREE"
            echo 'VERSION=2.33.0'
            echo 'SCHEMA=2026082901'
            echo 'RELEASE=NO'
            echo 'PRODUCTION=NO'
          } | tee "$EVIDENCE/verdict.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P01-L2-resource-efficiency-candidate-evidence-${{ github.run_id }}
          path: /tmp/p01-l2-resource-efficiency-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-l2-server.pid 2>/dev/null)" 2>/dev/null || true
