name: P02 Post-Seal UI Audit V3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-post-seal-ui-audit-v3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - env: {PRIVATE_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: f69346f00719a253a0f7c94121b7af2a975b74ee
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          persist-credentials: false
      - name: Install runtime
        working-directory: p02
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Install isolated site
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-UI3-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-ui3"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -d display_errors=0 -S 127.0.0.1:18146 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:18146/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18146/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18146' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18146/setup.php)" = 303
      - name: Three-column responsive and editor audit
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-UI3-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          cat > .audit-ui-v3.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error'&&!/409 \(Conflict\)/.test(m.text()))errors.push(m.text())});
          await page.goto('http://127.0.0.1:18146/',{waitUntil:'networkidle'});
          let sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());
          if(!sess?.site?.auth){await page.locator('[data-open-login]').first().click();await page.locator('#loginForm input[name="password"]').fill(process.env.AUDIT_PASSWORD);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session',{cache:'no-store'})).json())?.site?.auth));sess=await page.evaluate(async()=>await(await fetch('/api.php?action=session',{cache:'no-store'})).json());}
          const csrf=sess.csrf;const post=async(a,b)=>page.evaluate(async({a,b,csrf})=>await(await fetch('/api.php?action='+a,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(b)})).json(),{a,b,csrf});
          const c=await post('category_save',{name:'UI Audit V3',description:'',icon:'folder'});if(!c.ok)throw new Error('category');const cid=Number(c.id);
          const i=await post('content_save',{category_id:cid,title:'Long Editor Audit',content:'# 审计\n\n'+('## Section\nLong UTF-8 内容 ✓\n\n'.repeat(600)),content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'});if(!i.ok)throw new Error('item');const iid=Number(i.id);
          await page.reload({waitUntil:'networkidle'});
          const viewProbe=await page.evaluate(async cid=>{await setContentView('notebook');const n1=state.contentView;await selectCategory(cid);const n2=state.contentView;await setContentView('list');const l1=state.contentView;await selectCategory(cid);const l2=state.contentView;return {n1,n2,l1,l2}},cid);
          if(JSON.stringify(viewProbe)!==JSON.stringify({n1:'notebook',n2:'notebook',l1:'list',l2:'list'}))throw new Error('view persistence '+JSON.stringify(viewProbe));
          await page.evaluate(async({cid,iid})=>{await setContentView('notebook');await selectCategory(cid);await openReader(iid,true)},{cid,iid});await page.waitForTimeout(350);
          const responsive=[];
          for(const [w,h] of [[1920,1080],[1600,1000],[1440,900],[1318,900],[1024,820],[768,900],[390,844]]){await page.setViewportSize({width:w,height:h});await page.waitForTimeout(180);const x=await page.evaluate(()=>({w:innerWidth,htmlClient:document.documentElement.clientWidth,htmlScroll:document.documentElement.scrollWidth,bodyOverflow:getComputedStyle(document.body).overflowY,mainOverflow:getComputedStyle(document.querySelector('.main')).overflowY,detail:Boolean(document.querySelector('#notebookDetailScroll'))}));if(x.htmlScroll>x.htmlClient+3)throw new Error('horizontal '+w+' '+JSON.stringify(x));responsive.push(x);}
          await page.setViewportSize({width:1440,height:720});await page.evaluate(async()=>{if(!state.workspaceController)throw new Error('workspace controller missing');await state.workspaceController.setMode('edit',true)});await page.waitForTimeout(250);
          if(await page.locator('#articleTitleInput').count()!==1||await page.locator('#articleSource').count()!==1)throw new Error('editor DOM missing');
          const measure=()=>page.evaluate(()=>{const t=document.querySelector('#articleSource'),d=document.querySelector('#notebookDetailScroll');return {tc:t.clientHeight,ts:t.scrollHeight,to:getComputedStyle(t).overflowY,dc:d.clientHeight,ds:d.scrollHeight,do:getComputedStyle(d).overflowY,htmlClient:document.documentElement.clientWidth,htmlScroll:document.documentElement.scrollWidth}});
          const small=await measure();await page.setViewportSize({width:1920,height:1080});await page.waitForTimeout(350);const large=await measure();
          if(large.htmlScroll>large.htmlClient+3)throw new Error('maximize horizontal');if(/auto|scroll/.test(large.to)&&large.ts>large.tc+5)throw new Error('nested editor scrollbar '+JSON.stringify(large));if(large.tc<Math.min(520,Math.max(0,large.dc-240)))throw new Error('editor maximize height '+JSON.stringify({small,large}));
          await page.evaluate(async()=>await state.workspaceController.setMode('split',true));await page.waitForTimeout(250);const split=await measure();if(/auto|scroll/.test(split.to)&&split.ts>split.tc+5)throw new Error('split nested editor scrollbar '+JSON.stringify(split));
          await page.evaluate(async()=>await state.workspaceController.setMode('edit',true));const title='Saved UI State '+Date.now();await page.locator('#articleTitleInput').fill(title);await page.locator('#articleSource').fill('saved state body');await page.locator('[data-workspace-command="save"]').last().click();await page.waitForFunction(t=>state.readerItem?.title===t&&state.editorItem?.title===t&&!state.editorDirty,title,{timeout:10000});const saved=await page.evaluate(t=>({reader:state.readerItem?.title,editor:state.editorItem?.title,dirty:state.editorDirty,visible:(document.body.innerText||'').includes(t)}),title);if(!saved.visible)throw new Error('saved title not visible '+JSON.stringify(saved));
          console.log('P02_UI_V3='+JSON.stringify({viewProbe,responsive,small,large,split,saved,errors}));if(errors.length)throw new Error(errors.join(' | '));await browser.close();
          JS
          node .audit-ui-v3.mjs
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-ui3/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-ui3/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-ui3" .audit-ui-v3.mjs node_modules package.json package-lock.json || true
