name: TEMP S01-C03 M3U8 1.25.27 Product Gate

on:
  push:
    branches:
      - temp/s01-c03-m3u8-12527-gate-20260907

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-m3u8-12527-gate
  cancel-in-progress: false

jobs:
  product-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 04648ef580d8d33609584b7878ffc4d8566adfc5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "04648ef580d8d33609584b7878ffc4d8566adfc5"
          git cat-file -e c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb^{commit}
          git diff --name-only c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb...04648ef580d8d33609584b7878ffc4d8566adfc5 | sort > /tmp/actual-scope.txt
          cat > /tmp/expected-scope.txt <<'EOF'
          VERSION
          src/admin/console-bootstrap.php
          src/vf-tool-m3u8.php
          tests/unit/dashboard-human-language-contract.php
          tests/unit/host-recovery-human-language-contract.php
          EOF
          sort -o /tmp/expected-scope.txt /tmp/expected-scope.txt
          diff -u /tmp/expected-scope.txt /tmp/actual-scope.txt
          echo 'EXACT_SCOPE=PASS'

      - name: PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/admin/console-bootstrap.php
          php -l src/vf-tool-m3u8.php
          php -l tests/unit/dashboard-human-language-contract.php
          php -l tests/unit/host-recovery-human-language-contract.php
          echo 'PHP_LINT=PASS'

      - name: Human language and regression contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          php tests/unit/package-physical-locator-contract.php
          echo 'M3U8_CONTRACTS=PASS'

      - name: Boundary checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n' < VERSION)" = '1.25.27'
          grep -Fq 'Version: 1.25.27' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R251'" src/vf-tool-m3u8.php
          grep -Fq 'R251_S01_HUMAN_RECOVERY_LANGUAGE' src/vf-tool-m3u8.php
          ! git diff c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb...04648ef580d8d33609584b7878ffc4d8566adfc5 -- src/includes/v6-provider-schema-repair-admin.php src/includes/v6-provider-controlled-migration-admin.php src/includes/v6-provider-post-migration-readonly.php src/includes/update src/public src/tools src/tool-settings.schema.json | grep -q '^[-+]'
          echo 'MIGRATION_SCHEMA_UPDATE_PUBLIC_BOUNDARY=PASS'

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/s01
          cat > evidence/s01/S01_C03_M3U8_12527_PRODUCT_GATE.txt <<'EOF'
          PROJECT=S01-C03
          COMPONENT=VF_TOOLS_M3U8
          CANDIDATE_VERSION=1.25.27
          CANDIDATE_SHA=04648ef580d8d33609584b7878ffc4d8566adfc5
          BASE_SHA=c6d0bbb0392dfa59ab91b3b98d8a0258ca95f9bb
          EXACT_SCOPE=PASS
          PHP_LINT=PASS
          M3U8_CONTRACTS=PASS
          MIGRATION_SCHEMA_UPDATE_PUBLIC_BOUNDARY=PASS
          PRODUCT_GATE=PASS
          MIGRATION=CLOSED_UNCHANGED
          PRODUCTION_GATE=NOT_RUN
          PRODUCTION_WRITE=NO
          USER_MANUAL_EXECUTION_REQUIRED=NO
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c03-m3u8-12527-product-gate-${{ github.run_id }}
          path: evidence/s01/S01_C03_M3U8_12527_PRODUCT_GATE.txt
          if-no-files-found: error
          retention-days: 14
