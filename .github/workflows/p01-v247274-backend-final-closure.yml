name: P01 V2.47.274 Backend Final Closure

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247274-backend-final-closure.yml"

permissions:
  contents: read

jobs:
  closure:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'audit(P01): V2.47.274 backend final closure')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact main and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 4679a5e5a1a154782b04eacfc5b94988ea856f27
          git -C candidate checkout -q --detach 4679a5e5a1a154782b04eacfc5b94988ea856f27
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.274"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.274"
          grep -F "define('VF_VERSION', '2.47.274');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 7541bbf2ad2d3d06646f4fd101bf53727ee7f471
          git -C baseline checkout -q --detach 7541bbf2ad2d3d06646f4fd101bf53727ee7f471
          echo P01_BACKEND_FINAL_EXACT_MAIN=PASS

      - name: Surface inventory and ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,re,json
          root=pathlib.Path("candidate/src")
          expected_shell={
            "manage.php","surface-manager.php","links-admin.php","toolbox-manager.php",
            "health.php","duplicates.php","icons.php","recycle-bin.php",
            "transfer.php","data-safety.php","system-health.php","jobs.php","plugins.php",
            "browser-helper.php","update.php","settings.php","full-governance.php",
            "system-info.php","system-baseline.php","diagnose.php","update-credential.php","workbench.php"
          }
          expected_compat={
            "resources.php":"surface-manager.php?advanced=1",
            "data.php":"transfer.php",
            "system.php":"system-health.php",
            "governance.php":"surface-manager.php",
            "security.php":"settings.php?section=account",
            "tags.php":"links-admin.php?notice=tags-retired",
            "affiliate.php":"links-admin.php?notice=affiliate-retired",
          }
          actual=set()
          for p in root.glob("*.php"):
              s=p.read_text(encoding="utf-8",errors="replace")
              if "vf_admin_shell_begin" in s:
                  actual.add(p.name)
          hidden=sorted(actual-expected_shell)
          missing=sorted(expected_shell-actual)
          print("ADMIN_SHELL_FILE_COUNT="+str(len(actual)))
          print("HIDDEN_CURRENT="+json.dumps(hidden,ensure_ascii=False))
          print("MISSING_EXPECTED="+json.dumps(missing,ensure_ascii=False))
          if hidden or missing:
              raise SystemExit("BACKEND_SURFACE_FILES=FAIL")

          for name,target in expected_compat.items():
              s=(root/name).read_text(encoding="utf-8",errors="replace")
              if "vf_admin_shell_begin" in s or target not in s:
                  raise SystemExit("COMPAT_ROUTE_FAIL:"+name)
          shell=(root/"app/AdminShell.php").read_text(encoding="utf-8")
          for needle in [
              "['key'=>'overview','label'=>'概览'",
              "['key'=>'resources','label'=>'资源'",
              "['key'=>'data','label'=>'数据'",
              "['key'=>'system','label'=>'系统'",
              "['key'=>'browser','label'=>'浏览器助手'",
              "['key'=>'update','label'=>'在线升级'",
              "['key'=>'settings','label'=>'设置'",
              "['href'=>'surface-manager.php','label'=>'待整理']",
              "['href'=>'surface-manager.php?advanced=1','label'=>'全部资源']",
              "['href'=>'links-admin.php','label'=>'导航分类']",
              "['href'=>'toolbox-manager.php','label'=>'工具箱管理']",
              "['href'=>'health.php','label'=>'资源维护'",
              "['href'=>'transfer.php','label'=>'导入导出']",
              "['href'=>'data-safety.php','label'=>'备份与恢复']",
              "['href'=>'system-health.php','label'=>'运行健康']",
              "['href'=>'jobs.php','label'=>'计划任务']",
              "['href'=>'plugins.php','label'=>'RSS 与扩展']",
          ]:
              if needle not in shell:
                  raise SystemExit("NAV_OWNERSHIP_FAIL:"+needle)
          for contextual in ["full-governance.php","system-info.php","system-baseline.php","diagnose.php","update-credential.php","workbench.php"]:
              if contextual in shell:
                  raise SystemExit("CONTEXTUAL_PERSISTENT_NAV_FAIL:"+contextual)

          settings=(root/"settings.php").read_text(encoding="utf-8")
          for needle in ["'brand'=>'站点与品牌'","'display'=>'显示与浏览'","'covers'=>'影视封面'","'seo'=>'公开与 SEO'","'account'=>'管理员账号'"]:
              if needle not in settings:
                  raise SystemExit("SETTINGS_TASK_FAIL:"+needle)
          if "'home'=>'浏览现场'" in settings:
              raise SystemExit("SETTINGS_SIXTH_TASK_FAIL")

          pending=(root/"surface-manager.php").read_text(encoding="utf-8")
          if "full-governance.php?from=pending" not in pending:
              raise SystemExit("AI_GOVERNANCE_ENTRY_FAIL")
          health=(root/"system-health.php").read_text(encoding="utf-8")
          for route in ["system-info.php","system-baseline.php","diagnose.php"]:
              if route not in health:
                  raise SystemExit("DIAGNOSTIC_ENTRY_FAIL:"+route)
          plugins=(root/"assets/plugins-admin.js").read_text(encoding="utf-8")
          if "workbench.php?route=" not in plugins:
              raise SystemExit("WORKBENCH_ENTRY_FAIL")
          update=(root/"update.php").read_text(encoding="utf-8")
          if 'href="update-credential.php"' not in update:
              raise SystemExit("UPDATE_CREDENTIAL_ENTRY_FAIL")

          # 22 shell files expand to 27 real UI surfaces:
          # surface-manager = 2 tasks; settings = 5 tasks.
          active_ui=22+1+4
          compat=len(expected_compat)
          denominator=active_ui+compat
          print("ACTIVE_UI_SURFACES="+str(active_ui))
          print("COMPATIBILITY_SURFACES="+str(compat))
          print("BACKEND_SURFACE_DENOMINATOR="+str(denominator))
          if denominator != 34:
              raise SystemExit("BACKEND_DENOMINATOR_FAIL")
          print("P01_BACKEND_SURFACE_COVERAGE=PASS")
          PY

      - name: Admin source visual authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path("candidate/src")
          shell_files=[]
          for p in root.glob("*.php"):
              s=p.read_text(encoding="utf-8",errors="replace")
              if "vf_admin_shell_begin" in s:
                  shell_files.append(p)
                  # diagnose.php has a pre-install standalone diagnostic style,
                  # but its installed admin branch uses AdminShell.
                  if p.name!="diagnose.php" and re.search(r'<style(?:\s|>)',s,re.I):
                      raise SystemExit("INLINE_STYLE_TAG_FAIL:"+p.name)
                  if re.search(r'\sstyle\s*=\s*["\']',s,re.I):
                      raise SystemExit("INLINE_STYLE_ATTR_FAIL:"+p.name)
          shell=(root/"app/AdminShell.php").read_text(encoding="utf-8")
          order=[
            "assets/admin-pages.css",
            "assets/admin-shell.css",
            "assets/reference-ui.css",
            "assets/admin-consolidation.css",
          ]
          positions=[shell.find(x) for x in order]
          if any(x<0 for x in positions) or positions != sorted(positions):
              raise SystemExit("SHARED_VISUAL_AUTHORITY_ORDER_FAIL")
          print("VISUALLY_MANAGED_SHELL_FILES="+str(len(shell_files)))
          print("P01_BACKEND_SHARED_VISUAL_AUTHORITY=PASS")
          PY

      - name: Canonical full regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_BACKEND_FINAL_CANONICAL=PASS

      - name: Final closure boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo ROUND1_TO_ROUND6_SOURCE=PASS
          echo ROUND7_SOURCE_COVERAGE=PASS
          echo FULL_BACKEND_SOURCE_CLOSURE=PASS
          echo OWNER_PRODUCTION_UI_PASS=PENDING
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
