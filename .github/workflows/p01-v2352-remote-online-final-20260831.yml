name: P01 V2.35.2 Final Remote Online Update Gate
on:
  push:
    branches: [release/p01-v2352-remote-online-20260831]
    paths:
      - .github/workflows/p01-v2352-remote-online-final-20260831.yml
      - scripts/p01-v2352-remote-online-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2352-final-owner
      PORT: '18752'
      ADMIN_PASS: 'P01V2352!FinalRemote'
      EVID: /tmp/p01-v2352-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - name: Checkout immutable V2.35.1 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.35.2 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.35.2 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: d9cdc90149be9c04701d6853b60f9c5a3c8a66a7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(git -C source rev-parse HEAD^{tree})" = 00aca451804db5ebf9260d8101dfe829789c4f24
          test "$(git -C source rev-parse HEAD:src)" = 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
          test "$(git -C target rev-parse HEAD)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(git -C target rev-parse HEAD^{tree})" = 5d179443e215879259e3b5560c5e3c0342c2149b
          test "$(git -C target rev-parse HEAD:src)" = f000f39c1a2cf48296a4c165726323dabaf5e37c
          test "$(git -C updates rev-parse HEAD)" = d9cdc90149be9c04701d6853b60f9c5a3c8a66a7
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = d9cdc90149be9c04701d6853b60f9c5a3c8a66a7
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1 --jq .object.sha)" = eb36fd19d269aed4ef4246c2c18f172b2c761bde
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.2 --jq .object.sha)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.2 --jq .id)" = 379457325
          for run in 33344132874 33347168167 33347322224 33347594730 33347651122 33347698664 33347846821; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.35.1" and .target_version=="2.35.2" and .from_versions==["2.35.1"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.35.2" and .release_id==379457325 and .product_identity=="3c9239be8bba34637411110f7fdb43f6e494c880" and .asset_name=="VF_Start_V2.35.2_UPDATE.zip" and .asset_bytes==1377507 and .asset_sha256=="0b518b5393a0fdefdd98924429ef16e2e0f85af366887fa8c8b5cb4b9bc73505"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.2)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.2_UPDATE.zip")|.size' <<<"$REL")" = 1377507
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.2_UPDATE.zip")|.digest' <<<"$REL")" = sha256:0b518b5393a0fdefdd98924429ef16e2e0f85af366887fa8c8b5cb4b9bc73505
          echo P01_V2352_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.35.2 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2352-remote-online-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2351_TO_V2352_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_SQLITE_INTEGRITY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_RUNTIME_FEATURE_BYTES=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2352_LATEST_TERMINAL_STATE=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2351_TO_V2352_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2352_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2352_DATA_PRESERVATION=PASS
          P01_V2352_SQLITE_INTEGRITY=PASS
          P01_V2352_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2352_FIVE_DOMAIN_HTTP=PASS
          P01_V2352_RUNTIME_FEATURE_BYTES=PASS
          P01_V2352_LATEST_TERMINAL_STATE=PASS
          P01_V2352_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2352-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2352-final-evidence
          if-no-files-found: warn
          retention-days: 90
