name: P01 actual issued 516 PHP disaster generated and Laravel 517 native preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  true-516-to-517-native-disaster:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Synthetic-only public safe boundary
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_OWNER_REAL_ARCHIVE=NOT_PRESENT
          echo P01_PRODUCTION_AND_RELEASE_WRITE=NONE
      - name: Exact candidate temporary private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8b3abea1f6dcb428f50bd5a541bedab22bac2ff8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Native PHP tar generation and source-bound Python syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 8b3abea1f6dcb428f50bd5a541bedab22bac2ff8
          test "$(cat candidate/VERSION)" = 2.47.517
          python3 -m py_compile candidate/tests/compatibility/laravel/http/issued_v516_php_disaster.py
          php -l candidate/src/app/next/runtime/OwnerLegacyDisasterArchive.php
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl unzip >/dev/null
          php -r 'foreach(["pdo_sqlite","zip","Phar","gd"] as $x)if(!extension_loaded($x))exit(3);'
          echo P01_ISSUED_V516_GENERATOR_NATIVE_PHP_DEPENDENCIES=PASS
      - name: Obtain genuine published v2.47.516 FULL with immutable SHA256
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/issued-516"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/issued-516" -p VF-Start-V2.47.516-FULL.zip
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/issued-516/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
          echo P01_ISSUED_V516_GITHUB_RELEASE_BYTES=PASS
      - name: Install genuine old PHP FULL and create real issued DisasterRecovery tar.gz
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/issued_v516_php_disaster.py \
            --official-v516-full "$RUNNER_TEMP/issued-516/VF-Start-V2.47.516-FULL.zip" \
            --candidate candidate
          echo P01_TRUE_V516_PHP_PHARDATA_TO_NEW_LARAVEL_NATIVE_GATE=PASS
      - name: No old site files or private artifacts retained
        if: always()
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/issued-516"
          echo P01_TEST_ORIGINAL_PRIVATE_DATA=NONE
          echo P01_TEST_ISSUED_FULL_OR_TAR_ARTIFACT_RETAINED=NO
          echo P01_PRODUCTION_CLOUDPANEL_RELEASE_CHANNEL_WRITES=NONE
