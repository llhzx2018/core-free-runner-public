name: P01 issued v516 PHP genuine full disaster to Laravel 517 HTTPS recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  actual-old-php-generator-to-new-https:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    steps:
      - name: Public runner synthetic-only scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_OWNER_PRIVATE_DISASTER_DATA=NOT_PROVIDED
          echo P01_PRODUCTION_RELEASE_OR_DNS_WRITE=NONE
      - name: Exact P01 v517 transient private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6e5f1c7792fd314e070f2131af1d8b27f86afdd6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Native PHP 8.3 nginx and Composer dependencies
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "6e5f1c7792fd314e070f2131af1d8b27f86afdd6"
          test "$(cat candidate/VERSION)" = 2.47.517
          python3 -m py_compile candidate/tests/compatibility/laravel/http/issued_v516_php_disaster.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_disaster_restore_https.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >/dev/null
          php -r 'foreach(["zip","pdo_sqlite","Phar","fileinfo"] as $x)if(!extension_loaded($x))exit(3);'
          php -l candidate/src/app/next/runtime/OwnerLegacyDisasterArchive.php
          echo P01_ISSUED_PHP_V516_NEW_LARAVEL_V517_NATIVE_DEPS=PASS
      - name: Actual native PHP whole-TAR protected escrow regressions
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/http/OwnerLegacyDisasterRoutes.php
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path("candidate/tests/architecture").resolve()))
          import test_p01_legacy_disaster_escrow as test
          test.test_disaster_escrow_precedes_any_database_mutation()
          test.test_native_escrow_keeps_full_tar_with_inert_plugin_and_refuses_replay()
          print("P01_NEW_DELTA_NATIVE_WHOLE_DISASTER_ESCROW_PLUGIN_REPLAY=PASS")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download exact issued P01 v2.47.516 FULL and hash pin
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/issued-v516"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/issued-v516" -p VF-Start-V2.47.516-FULL.zip
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/issued-v516/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
          echo P01_ACTUAL_RELEASE_V516_SOURCE_FULL_SHA256=PASS
      - name: Issued v516 Owner HTTP failure vs rootless verified repair and rollback
        run: |
          set -Eeuo pipefail
          python3 -m py_compile candidate/tests/compatibility/laravel/http/test_p01_issued_v516_major_owner_api.py
          python3 candidate/tests/compatibility/laravel/http/test_p01_issued_v516_major_owner_api.py \
            --official-full "$RUNNER_TEMP/issued-v516/VF-Start-V2.47.516-FULL.zip" \
            --candidate-root candidate
          echo P01_ISSUED_V516_OWNER_ROUTE_REPAIR_ISOLATED_HTTP=PASS
      - name: Old issued PHP full installs and generates genuine private original TAR
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 -p "$RUNNER_TEMP/p01-issued-tar-private"
          python3 candidate/tests/compatibility/laravel/http/issued_v516_php_disaster.py \
            --official-v516-full "$RUNNER_TEMP/issued-v516/VF-Start-V2.47.516-FULL.zip" \
            --candidate candidate \
            --transient-archive-output "$RUNNER_TEMP/p01-issued-tar-private/generated-v516.tar.gz"
          test -f "$RUNNER_TEMP/p01-issued-tar-private/generated-v516.tar.gz"
          echo P01_PHP_516_REAL_DISASTER_GENERATOR_AND_NEW_NATIVE_PREFLIGHT=PASS
      - name: Build genuine candidate FULL and CloudPanel layout exact source
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha 6e5f1c7792fd314e070f2131af1d8b27f86afdd6 --output "$RUNNER_TEMP/p01-issued-bridge-clean.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-issued-bridge-clean.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-issued-bridge-clean.zip" --output "$RUNNER_TEMP/p01-issued-bridge-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-issued-bridge-cloudpanel.zip"
          echo P01_ISSUED_REAL_OLD_TO_NEW_EXACT_FULL_BUNDLES=PASS
      - name: Exact issued v516 FULL to v517 signed major preflight bad digest negatives
        env:
          P01_MAJOR_REAL_FULL_ISOLATED_TEST: 'YES'
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/LegacyMajorSignedReleasePreflight.php
          php -l candidate/src/app/next/runtime/MajorSignedReleasePreflight.php
          php -l candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php
          php candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php \
            --developer-full "$RUNNER_TEMP/p01-issued-bridge-cloudpanel.zip" \
            --bridge-full "$RUNNER_TEMP/issued-v516/VF-Start-V2.47.516-FULL.zip"
          echo P01_V517_ISSUED_516_SIGNED_SOURCE_SHA256_SHAPE_NATIVE=PASS
      - name: Real TLS nginx/php-fpm Laravel Owner direct TAR restore, all six bytes
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle "$RUNNER_TEMP/p01-issued-bridge-cloudpanel.zip" --engine sqlite \
            --only-owner-disaster-direct \
            --issued-516-disaster "$RUNNER_TEMP/p01-issued-tar-private/generated-v516.tar.gz"
          echo P01_ISSUED_516_PHP_REAL_DISASTER_TO_517_HTTPS_OWNER_RECOVERY=PASS
      - name: Destroy all old/new temp source and generated TAR
        if: always()
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/issued-v516" "$RUNNER_TEMP/p01-issued-tar-private"
          rm -f -- "$RUNNER_TEMP/p01-issued-bridge-clean.zip" "$RUNNER_TEMP/p01-issued-bridge-cloudpanel.zip"
          echo P01_OWNER_REAL_DISASTER_USED=NO
          echo P01_GENERATED_PHP_OLD_TAR_PERSISTED=NO
          echo P01_PRIVATE_SOURCE_RETAINED=NO
          echo P01_CLOUDPANEL_PRODUCTION_DNS_RELEASE_WRITE=NONE
