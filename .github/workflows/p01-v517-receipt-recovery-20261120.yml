name: P01 issued v516 merged-final exact ZIP original full update and rescue recovery gates
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-negative-gates:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact maintenance and released-old installer regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: maintenance
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5d1ae89fd4e73d508de21ae5bf94f1cf86451053
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old-tests
      - name: Exact merged GOV-DOC V3.25 Code Authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: bdd46247791a0db81f2fc04379f33470957dd50f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: merged-governance
      - name: Verify exact two merged main commits and source blob, not merely PR
        run: |
          set -Eeuo pipefail
          test "$(git -C maintenance rev-parse HEAD)" = "158c3d75378c235720727fe9f29fb28e02e7b6c9"
          test "$(git -C merged-governance rev-parse HEAD)" = "bdd46247791a0db81f2fc04379f33470957dd50f"
          test "$(cat maintenance/VERSION)" = "2.47.516"
          test "$(cat maintenance/src/VERSION.txt)" = "2.47.516"
          grep -Fq '| RP-07Z |' maintenance/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq '| skill-release | V3.25 |' merged-governance/CURRENT.md
          grep -Fq 'Mode Z' merged-governance/skills/skill-release/V3.25/SKILL.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("maintenance/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          x=hashlib.sha1(b"blob "+str(len(p)).encode()+b"\0"+p).hexdigest()
          assert x=="fa581ea3583768c46e8e43c9c5ba92be4ec27ba8",x
          for f in ("maintenance/docs/authority/ACCEPTANCE_MATRIX.md","merged-governance/CURRENT.md"):
              assert x in Path(f).read_text(),f
          print("P01_V516_ISSUED_RESCUE_EXACT_MERGED_SOURCE_AND_GOV=PASS")
          PY
      - name: PHP 8.3 clean issued v516 setup and official FULL digest
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip unzip >/dev/null
          mkdir -p "$RUNNER_TEMP/issued"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/issued" -p VF-Start-V2.47.516-FULL.zip
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/issued" -p VF_Start_V2.47.516_UPDATE.zip
          printf '%s  %s\n' '962a3b084b5bf2294baa092bb1098b6ea8f52b999bf24dcb92a0064ddad325a8' "$RUNNER_TEMP/issued/VF_Start_V2.47.516_UPDATE.zip" | sha256sum -c -
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/issued/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
      - name: Rootless verified source and durable receipt unit security regressions
        run: |
          set -Eeuo pipefail
          test "$(git -C maintenance rev-parse HEAD)" = "158c3d75378c235720727fe9f29fb28e02e7b6c9"
          python3 -m py_compile maintenance/scripts/p01_v516_owner_major_route_repair.py maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py
          python3 -m unittest discover -s maintenance/tests/compatibility -p 'test_p01_v516_owner_major_receipt_security.py' -v
          echo P01_V516_CORRECTED_RECEIPT_UNIT_SECURITY=PASS
      - name: Negative hardlink symlink modified source manifest version receipt and wrong owner
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/zip"
          python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$PWD/maintenance" --output "$RUNNER_TEMP/zip/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          mkdir -p "$RUNNER_TEMP/zip2"
          python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$PWD/maintenance" --output "$RUNNER_TEMP/zip2/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          cmp "$RUNNER_TEMP/zip/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip" "$RUNNER_TEMP/zip2/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          echo P01_V516_CORRECTED_ZIP_REPRODUCIBLE=PASS
          python3 - <<'PY'
          import hashlib, json, os, pwd, shutil, stat, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path("old-tests/tests/compatibility/laravel/http").resolve()))
          import issued_v516_php_disaster as old
          artifact=Path(os.environ["RUNNER_TEMP"])/"zip/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          require=lambda v,n: v or (_ for _ in ()).throw(AssertionError(n))
          actual=hashlib.sha256(artifact.read_bytes()).hexdigest()
          require(actual=="2a5d25a88a18f352056d13f41a069f57d73290840cdad7001939246b200ff764","FINAL_MERGED_ASSET_SHA256_DRIFT")
          print("P01_V516_CORRECTED_FINAL_ZIP_SHA256="+actual,flush=True)
          with tempfile.TemporaryDirectory(prefix="p01-patch-security-") as t:
              root=Path(t); root.chmod(0o700)
              original=root/"issued";original.mkdir(mode=0o700)
              old.install_old(original,Path(os.environ["RUNNER_TEMP"])/"issued/VF-Start-V2.47.516-FULL.zip")
              src=(original/"app/LegacyMajorOwnerApiActions.php").read_bytes()
              helper=root/"repair.py"
              with zipfile.ZipFile(artifact) as z: helper.write_bytes(z.read("p01_v516_owner_major_route_repair.py"))
              helper.chmod(0o644)
              def run(action,site,auth=False):
                  argv=[sys.executable,str(helper),action,"--site",str(site)]
                  if auth:argv+=["--confirm","I_APPROVE_P01_V516_ROOTLESS_MAJOR_ROUTE_REPAIR"]
                  return subprocess.run(argv,capture_output=True,text=True,timeout=15)
              require(run("inspect",original).returncode==0,"ORIGINAL_MUST_INSPECT")
              def clone(name):
                  site=root/name;shutil.copytree(original,site);return site
              s=clone("symlink-site")
              link=root/"symlink-alias"; link.symlink_to(s,target_is_directory=True)
              require(run("inspect",link).returncode!=0,"SYMLINK_SITE_REFUSAL")
              s=clone("symlink-class")
              f=s/"app/LegacyMajorOwnerApiActions.php";f.unlink();f.symlink_to(original/"app/LegacyMajorOwnerApiActions.php")
              require(run("inspect",s).returncode!=0,"SYMLINK_CLASS_REFUSAL")
              s=clone("hardlink-class")
              f=s/"app/LegacyMajorOwnerApiActions.php";os.link(f,root/"other-hardlink")
              require(run("inspect",s).returncode!=0,"HARDLINK_CLASS_REFUSAL")
              s=clone("group-writable")
              f=s/"app/LegacyMajorOwnerApiActions.php";f.chmod(0o666)
              require(run("inspect",s).returncode!=0,"WEAK_PERMISSIONS_REFUSAL")
              s=clone("tampered-program")
              f=s/"app/LegacyMajorOwnerApiActions.php";f.write_bytes(src+b"#")
              require(run("inspect",s).returncode!=0,"UNKNOWN_SCRIPT_REFUSAL")
              s=clone("old-manifest-drift")
              f=s/"release-manifest.json"
              doc=json.loads(f.read_text());doc["runtime_files"]["app/LegacyMajorOwnerApiActions.php"]="0"*64
              f.write_text(json.dumps(doc))
              require(run("inspect",s).returncode!=0,"MANIFEST_DRIFT_REFUSAL")
              s=clone("wrong-version");(s/"VERSION.txt").write_text("2.47.517")
              require(run("inspect",s).returncode!=0,"VERSION_CHANGED_REFUSAL")
              s=clone("unapproved-write")
              require(run("apply",s).returncode!=0 and
                      (s/"app/LegacyMajorOwnerApiActions.php").read_bytes()==src,"NON_AUTH_WRITE_REFUSAL")
              s=clone("forged-receipt")
              require(run("apply",s,auth=True).returncode==0,"VALID_SYNTHETIC_PATCH_FOR_RECEIPT_NEGATIVE")
              private=(Path(pwd.getpwuid(os.geteuid()).pw_dir)/".vf-start-v516-owner-major-repair"/
                      ("site-"+hashlib.sha256(str(s).encode()).hexdigest()[:20]))
              record=private/"receipt.json";old_receipt=record.read_bytes()
              forged=json.loads(old_receipt);forged["source_sha256"]="f"*64
              record.write_text(json.dumps(forged))
              inspect=run("inspect",s)
              require(inspect.returncode!=0,"FORGED_RECEIPT_INSPECT_ACCEPTED")
              rollback=run("rollback",s,auth=True)
              require(rollback.returncode!=0,"FORGED_RECEIPT_ROLLBACK_ACCEPTED")
              record.write_bytes(old_receipt);record.chmod(0o600)
              require(run("rollback",s,auth=True).returncode==0 and
                      (s/"app/LegacyMajorOwnerApiActions.php").read_bytes()==src,
                      "RECOVER_VALID_PRIVATE_RECEIPT")
              require(private.is_dir() and private.name.startswith("site-"),"PRIVATE_CLEANUP_IDENTITY")
              shutil.rmtree(private)
          print("P01_V516_EXTRACTED_OFFICIAL_SOURCE_BOUND_SECURITY_NEGATIVES=PASS",flush=True)
          PY
      - name: Real native old-v516 Owner HTTP and two actual SIGKILL recoveries from corrected final ZIP
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          z=Path(os.environ["RUNNER_TEMP"])/"zip/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          dst=Path("old-tests/scripts/p01_v516_owner_major_route_repair.py")
          with zipfile.ZipFile(z) as f:
              raw=f.read("p01_v516_owner_major_route_repair.py")
          assert raw==Path("maintenance/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          dst.write_bytes(raw)
          dst.chmod(0o644)
          PY
          python3 old-tests/tests/compatibility/laravel/http/test_p01_issued_v516_major_owner_api.py --official-full "$RUNNER_TEMP/issued/VF-Start-V2.47.516-FULL.zip" --candidate-root old-tests
          echo P01_V516_CORRECTED_EXTRACTED_ZIP_NATIVE_OWNER_HTTP_AND_SIGKILL=PASS
      - name: Cleanup old PHP and all private test source
        if: always()
        run: |
          rm -rf -- merged-governance maintenance old-tests "$RUNNER_TEMP/zip" "$RUNNER_TEMP/zip2" "$RUNNER_TEMP/issued"
          echo P01_V516_NEGATIVE_SCOPE_RELEASE_PRODUCTION_WRITES=NONE
