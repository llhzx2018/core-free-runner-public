name: P01 Mode Z exact-source GOV-DOC current and closure acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gov-doc-p01-onecase-mode-z:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Public-safe synthetic-only governance scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_OLD_RELEASE_CHANNEL_PRODUCTION_WRITE=NONE
      - name: Checkout exact private GOV-DOC Mode Z candidate with full Git ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 8d03a87547a4200b2518e86b25c48ac1379b2498
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Actual exact base-to-head Git diff and source current checks
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT,INSTALL,UPGRADE,SECURITY,TESTING,DATA_SCHEMA
            IMPACT_REASON: One case changes when human preview is completed but inherits all source install upgrade security test and data machine hard gates.
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "8d03a87547a4200b2518e86b25c48ac1379b2498"
          git -C gov cat-file -e "80ab251e15e63fc01a4e587e93054b0f6d0179a5^{commit}"
          git -C gov diff --name-status 80ab251e15e63fc01a4e587e93054b0f6d0179a5 8d03a87547a4200b2518e86b25c48ac1379b2498
          python3 -B gov/governance/public-authority/tools/current_dependency_lint.py --root "$PWD/gov" --git-base 80ab251e15e63fc01a4e587e93054b0f6d0179a5 --git-head 8d03a87547a4200b2518e86b25c48ac1379b2498
          python3 -B gov/governance/public-authority/tools/global_closure_lint.py --root "$PWD/gov" --git-base 80ab251e15e63fc01a4e587e93054b0f6d0179a5 --git-head 8d03a87547a4200b2518e86b25c48ac1379b2498
          echo P01_MODE_Z_GOV_CURRENT_EXACT_DIFF_AND_CLOSURE=PASS
      - name: Existing governance source dependency and closure negative fixtures
        run: |
          set -Eeuo pipefail
          cd gov
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo P01_MODE_Z_GOV_NEGATIVE_FIXTURES=PASS
      - name: No private source artifacts or issuance
        if: always()
        run: |
          rm -rf -- gov
          echo P01_GOV_MODE_Z_OLD_RELEASE_TAG_ATOMIC=UNCHANGED
          echo P01_GOV_MODE_Z_OWNER_REAL_DATA_USED=NO
          echo P01_GOV_MODE_Z_PUBLISHED_RELEASE=NO
