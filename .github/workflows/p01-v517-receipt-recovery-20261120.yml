name: P01 issued v516 one-time repaired route native HTTPS TLS prepublication gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-v516-genuine-old-php-tls-owner:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Public-safe one-case HTTPS proof only
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_V516_REAL_OWNER_DATA_USED=NO
          echo P01_V516_HTTPS_PROXY_ONLY_SYNTHETIC_OFFICIAL_FULL=YES
      - name: Exact bounded public-synthetic TLS harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact merged and immutable P01 patch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 158c3d75378c235720727fe9f29fb28e02e7b6c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: maintenance
      - name: Exact old installed PHP Owner regression source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5d1ae89fd4e73d508de21ae5bf94f1cf86451053
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old-tests
      - name: Native PHP and TLS dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip openssl unzip >/dev/null
          python3 -m py_compile scripts/p01-v516-https-old-owner-test.py
          test "$(git -C maintenance rev-parse HEAD)" = "158c3d75378c235720727fe9f29fb28e02e7b6c9"
          test "$(cat maintenance/VERSION)" = 2.47.516
          echo P01_V516_NATIVE_TLS_TEST_DEPENDENCIES=PASS
      - name: Actual original issued FULL download and immutable source SHA
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/issued" "$RUNNER_TEMP/final"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/issued" -p VF-Start-V2.47.516-FULL.zip
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/issued/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
          python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$PWD/maintenance" --output "$RUNNER_TEMP/final/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          printf '%s  %s\n' '2a5d25a88a18f352056d13f41a069f57d73290840cdad7001939246b200ff764' "$RUNNER_TEMP/final/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile,os,hashlib
          from pathlib import Path
          pkg=Path(os.environ["RUNNER_TEMP"])/"final/VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          with zipfile.ZipFile(pkg) as z:
            data=z.read("p01_v516_owner_major_route_repair.py")
          assert data==Path("maintenance/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          old=Path("old-tests/scripts/p01_v516_owner_major_route_repair.py")
          old.write_bytes(data);old.chmod(0o644)
          print("P01_V516_TLS_ACTUAL_MERGED_ZIP_SCRIPT=PASS")
          PY
      - name: Official v516 Owner Guest CSRF old action over cert-pinned real TLS
        run: |
          set -Eeuo pipefail
          python3 scripts/p01-v516-https-old-owner-test.py --old-test-root "$PWD/old-tests" --official-full "$RUNNER_TEMP/issued/VF-Start-V2.47.516-FULL.zip"
          echo P01_V516_REAL_TLS_ISSUED_OLD_OWNER_ACTION=PASS
      - name: Clean all temporary checkout and issued ZIP; never publish
        if: always()
        run: |
          rm -rf -- maintenance old-tests "$RUNNER_TEMP/issued" "$RUNNER_TEMP/final"
          echo P01_V516_OFFICIAL_TAG_RELEASE_CHANNEL_PRODUCTION_WRITE=NONE
          echo P01_V516_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
