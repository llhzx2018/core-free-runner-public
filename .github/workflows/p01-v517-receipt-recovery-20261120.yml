name: P01 exact-head Owner one-file disaster TAR direct native HTTPS gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  original-disaster-one-click:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Public-safe synthetic scope only
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_ORIGINAL_OWNER_ARCHIVE=NOT_UPLOADED
          echo P01_PRODUCTION_OR_RELEASE_MUTATION=NONE
      - name: Transient exact-head product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1a6c33a3857d5e2ce874957217824902cfdd06b8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: PHP archive security syntax and true source identity
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "1a6c33a3857d5e2ce874957217824902cfdd06b8"
          test "$(cat candidate/VERSION)" = 2.47.517
          for path in candidate/src/app/next/runtime/OwnerLegacyDisasterArchive.php candidate/src/app/next/runtime/OwnerSqliteUpload.php candidate/src/app/next/http/OwnerLegacyDisasterRoutes.php candidate/src/app/next/http/OwnerSqliteRecoveryRoutes.php; do php -l "$path"; done
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_disaster_restore_https.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          python3 -m py_compile candidate/tests/architecture/test_p01_disaster_unpack.py
          echo P01_ONE_FILE_DISASTER_EXACT_HEAD_PHP_AND_PY_SYNTAX=PASS
      - name: Real isolated native PHP-FPM nginx Composer SQLite
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >/dev/null
          php -r 'foreach(["zip","pdo_sqlite","fileinfo"] as $ext)if(!extension_loaded($ext))exit(2);'
          echo P01_ONE_FILE_DISASTER_NATIVE_PHP_DEPENDENCIES=PASS
      - name: Native PHP original tar security/negative fixtures
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/architecture/test_p01_disaster_unpack.py
          echo P01_NATIVE_PHP_COMPLETE_DISASTER_PREFLIGHT_AND_NEGATIVES=PASS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact Vue typecheck and self-contained FULL
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund
          npm run typecheck
          cd ../../../../
          python3 scripts/build_p01_next_clean_full.py build --source-sha 1a6c33a3857d5e2ce874957217824902cfdd06b8 --output "$RUNNER_TEMP/p01-owner-disaster-clean.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-owner-disaster-clean.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-owner-disaster-clean.zip" --output "$RUNNER_TEMP/p01-owner-disaster-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-owner-disaster-cloudpanel.zip"
          echo P01_ONE_FILE_DISASTER_VUE_AND_FULL_BUNDLE=PASS
      - name: Real installed HTTPS direct original TAR Owner one-click restore and readback
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle "$RUNNER_TEMP/p01-owner-disaster-cloudpanel.zip" --engine sqlite \
            --only-owner-disaster-direct
          echo P01_ONE_FILE_TARGZ_SQLITE_ALL_MEDIA_HTTPS_APPLY_READBACK=PASS
      - name: Remove private checkout, archive and ZIPs
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-owner-disaster-clean.zip" "$RUNNER_TEMP/p01-owner-disaster-cloudpanel.zip"
          echo P01_PUBLIC_RUNNER_ORIGINAL_OWNER_BYTES=NONE
          echo P01_PUBLIC_RUNNER_PRIVATE_SOURCE_RETAINED=NO
          echo P01_RELEASE_CHANNEL_PRODUCTION_WRITES=NONE
