name: P01 exact-head interrupted Owner receipt native HTTPS gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  one-shot-restore-receipt:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Synthetic fixture only, private Owner data never supplied
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_PRIVATE_OWNER_INPUT=NOT_SUPPLIED
      - name: Checkout private exact source transiently without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9597f3accbceb7a0b78adf67e3c9ec43588288a4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact HEAD and focused fail-closed case
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9597f3accbceb7a0b78adf67e3c9ec43588288a4"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py
          grep -q 'RESTORE_READBACK_INCOMPLETE_ATTEMPT_REVIEW_REQUIRED' candidate/src/app/next/runtime/OwnerSqliteRecovery.php
          grep -q 'P01_OWNER_INTERRUPTED_RECEIPT_FAIL_CLOSED' candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py
      - name: Native PHP and Nginx dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx openssl curl unzip composer \
            php8.3-cli php8.3-fpm php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip >/dev/null
          php -l candidate/src/app/next/runtime/OwnerSqliteRecovery.php
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build exact real Laravel 13 code and verified CloudPanel candidate FULL
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha 9597f3accbceb7a0b78adf67e3c9ec43588288a4 --output /tmp/p01-receipt-clean.zip
          python3 scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-receipt-clean.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip /tmp/p01-receipt-clean.zip --output /tmp/p01-receipt-cloudpanel.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip /tmp/p01-receipt-cloudpanel.zip
      - name: Actual Laravel HTTPS missing-receipt and restored-readback safety negatives
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle /tmp/p01-receipt-cloudpanel.zip --engine sqlite --only-owner-sqlite-restore
          echo P01_INTERRUPTED_RECEIPT_EXACT_HEAD_NATIVE_HTTPS=PASS
      - name: Always remove transient private checkout and packages
        if: always()
        run: |
          rm -rf -- candidate
          rm -f /tmp/p01-receipt-clean.zip /tmp/p01-receipt-cloudpanel.zip
          echo P01_TEMP_PRIVATE_SOURCE_REMOVED=YES
