name: P01 v517 original disaster archive private preparation safety gate
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify-original-archive-offline:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Confirm public synthetic-only scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_ORIGINAL_OWNER_BACKUP_IN_RUNNER=NO
          echo P01_PRODUCTION_OR_OLD_SITE_WRITES=NO
      - name: Checkout exact private P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e927b306654bc556687a991afe35f30b3204b558
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Exact identity and script syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "e927b306654bc556687a991afe35f30b3204b558"
          test "$(cat candidate/VERSION)" = "2.47.517"
          python3 -m py_compile candidate/scripts/prepare_p01_legacy_disaster_restore.py
          python3 -m py_compile candidate/scripts/build_p01_legacy_owner_media_archive.py
          python3 -m py_compile candidate/tests/architecture/test_p01_disaster_unpack.py
          python3 -m py_compile candidate/tests/architecture/test_p01_owner_media_export.py
          echo P01_DISASTER_CONVERTER_EXACT_SOURCE_AND_SYNTAX=PASS
      - name: Native PHP SQLite ZIP test dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip php8.3-mbstring php8.3-gd >/dev/null
          php -r 'foreach(["zip","pdo_sqlite","fileinfo"] as $ext)if(!extension_loaded($ext))exit(2);'
          echo P01_ORIGINAL_ARCHIVE_NATIVE_PHP_DEPS=PASS
      - name: Existing old-site resource exporter parity and PHP importer roundtrip
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/architecture/test_p01_owner_media_export.py
          echo P01_OLD_SITE_RESOURCE_EXPORT_FULL_ASSET_MATRIX=PASS
      - name: New original complete tar.gz converter and failure negatives
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/architecture/test_p01_disaster_unpack.py
          echo P01_OLD_DISASTER_TARGZ_TO_SQLITE_AND_MEDIA_ZIP=PASS
      - name: Remove private checkout and prohibit artifacts
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_PRIVATE_CHECKOUT_RETAINED=NO
          echo P01_PRIVATE_OWNER_BYTES_USED=NO
          echo P01_RUNNER_ARTIFACT_UPLOAD=NONE
          echo P01_RELEASE_OR_PRODUCTION_WRITE=NONE
