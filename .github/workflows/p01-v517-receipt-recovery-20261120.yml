name: P01 v517 exact-source preissue FULL and MAJOR package integrity
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  one-shot-517-package:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - name: No private Owner data, official release write or Production operation
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_OWNER_PRIVATE_BYTES=NOT_SUPPLIED
          echo P01_PUBLIC_RUNNER_SCOPE=PREISSUE_SYNTHETIC_SHAPE_ONLY
      - name: Checkout exact P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3cc53841b971a976b4254b4b9687bb7d115e5f80
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Bind P01 exact source and required package entrypoints
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "3cc53841b971a976b4254b4b9687bb7d115e5f80"
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          test -f candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php
          test -f candidate/src/app/next/runtime/MajorUnsignedReleaseStage.php
          test -f candidate/src/app/next/runtime/CloudPanelPackageIdentity.php
          echo P01_PREISSUE_EXACT_SOURCE_BOUND=PASS
      - name: Native package dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-mysql >/dev/null
          php -r 'if(!extension_loaded("zip")||!extension_loaded("sodium"))exit(2);'
          php -l candidate/src/app/next/runtime/MajorUnsignedReleaseStage.php
          php -l candidate/src/app/next/runtime/CloudPanelPackageIdentity.php
          php -l candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build exact-source verified Laravel 13 developer FULL and CloudPanel layout
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha 3cc53841b971a976b4254b4b9687bb7d115e5f80 --output "$RUNNER_TEMP/p01-preissue-clean.zip"
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-preissue-clean.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-preissue-clean.zip" --output "$RUNNER_TEMP/p01-preissue-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-preissue-cloudpanel.zip"
          echo P01_V517_PREISSUE_REAL_FULL_BUILT_AND_VERIFIED=PASS
      - name: Independently download actual issued P01 v2.47.516 FULL and pin release bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP" -p VF-Start-V2.47.516-FULL.zip
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip")" = "1874648"
          php -r '$z=new ZipArchive();if($z->open($argv[1])!==true)exit(2);if(trim((string)$z->getFromName("VERSION.txt"))!=="2.47.516")exit(3);$z->close();' "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip"
          echo P01_REAL_ISSUED_V516_RELEASE_FULL_SHA256=PASS
      - name: Native staging and GitHub-release SHA identity negative matrix on actual candidate FULL
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d37_official_full_readiness_native.php
          P01_MAJOR_REAL_FULL_ISOLATED_TEST=YES php candidate/tests/compatibility/laravel/run_major_signed_real_full_contract.php \
            --developer-full "$RUNNER_TEMP/p01-preissue-cloudpanel.zip" \
            --bridge-full "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip"
          echo P01_V517_PREISSUE_REAL_V516_TO_V517_FULL_SIGNED_SHAPE_NEGATIVES=PASS
          echo P01_517_REAL_GITHUB_V517_ISSUED_RELEASE=NOT_CLAIMED
      - name: Remove transient private source, packages and local synthetic stage
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-preissue-clean.zip" "$RUNNER_TEMP/p01-preissue-cloudpanel.zip" "$RUNNER_TEMP/VF-Start-V2.47.516-FULL.zip"
          echo P01_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_TEST_PACKAGES_PERSISTED=NO
          echo P01_RELEASE_CHANNEL_PRODUCTION_WRITE=NONE
