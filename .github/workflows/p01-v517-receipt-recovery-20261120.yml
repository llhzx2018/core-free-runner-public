name: P01 corrected v516 exact GOV Mode Z and project architecture gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-v516-current-exact-source-gates:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: One case public-safe scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_ORIGINAL_PRODUCTION_ASSET_WRITE=NONE
      - name: Exact corrected private P01 product source with Git base ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: dcc8a88fba769b58811bc7afbd1ffbc44543c66b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Exact corrected GOV-DOC Mode Z proposal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 54b193201dfb674666b52f5ce5990d898cc80dba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Exact two-repo source identity and corrected security pin
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "dcc8a88fba769b58811bc7afbd1ffbc44543c66b"
          test "$(git -C gov rev-parse HEAD)" = "54b193201dfb674666b52f5ce5990d898cc80dba"
          test "$(cat product/VERSION)" = 2.47.516
          test "$(cat product/src/VERSION.txt)" = 2.47.516
          git -C product cat-file -e ab49e83c4715cc9246c4333679fc5388e554cc98^{commit}
          git -C gov cat-file -e 80ab251e15e63fc01a4e587e93054b0f6d0179a5^{commit}
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          raw=Path("product/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert sha=="fa581ea3583768c46e8e43c9c5ba92be4ec27ba8",sha
          for f in ("product/docs/authority/ACCEPTANCE_MATRIX.md",
                    "gov/CURRENT.md",
                    "gov/skills/skill-release/V3.25/SKILL.md",
                    "gov/governance/release/cases/P01_V516_ISSUED_OWNER_MAJOR_ROUTE_ONEFILE_REPAIR_POST_RELEASE_OWNER_MANUAL_20261121.md"):
              assert sha in Path(f).read_text(),f
          assert "read_receipt" in raw.decode()
          print("P01_V516_CORRECTED_SOURCE_PIN_AND_TWO_AUTHORITIES=PASS")
          PY
      - name: Real P01 base-to-head architecture naming and target gate
        run: |
          set -Eeuo pipefail
          git -C product diff --name-status ab49e83c4715cc9246c4333679fc5388e554cc98 dcc8a88fba769b58811bc7afbd1ffbc44543c66b
          git -C product diff --name-only ab49e83c4715cc9246c4333679fc5388e554cc98 dcc8a88fba769b58811bc7afbd1ffbc44543c66b > "$RUNNER_TEMP/p01-changed.txt"
          python3 product/.github/checks/architecture_gate.py --manifest "$PWD/product/.github/checks/code_architecture.json" --gov-root "$PWD/gov" --git-root "$PWD/product" --base-sha ab49e83c4715cc9246c4333679fc5388e554cc98 --head-sha dcc8a88fba769b58811bc7afbd1ffbc44543c66b
          python3 product/scripts/check_p01_fullstack_contract.py --root "$PWD/product" --changed-files-file "$RUNNER_TEMP/p01-changed.txt"
          echo P01_V516_CORRECTED_PRODUCT_ARCHITECTURE_AND_TARGET=PASS
      - name: Exact GOV-DOC diff current source and public authority closure
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT,INSTALL,UPGRADE,SECURITY,TESTING,DATA_SCHEMA
            IMPACT_REASON: Case-only post-release human timing, restores corrected forged receipt source identity and keeps all public authority hard gates.
        run: |
          set -Eeuo pipefail
          git -C gov diff --name-status 80ab251e15e63fc01a4e587e93054b0f6d0179a5 54b193201dfb674666b52f5ce5990d898cc80dba
          python3 -B gov/governance/public-authority/tools/current_dependency_lint.py --root "$PWD/gov" --git-base 80ab251e15e63fc01a4e587e93054b0f6d0179a5 --git-head 54b193201dfb674666b52f5ce5990d898cc80dba
          python3 -B gov/governance/public-authority/tools/global_closure_lint.py --root "$PWD/gov" --git-base 80ab251e15e63fc01a4e587e93054b0f6d0179a5 --git-head 54b193201dfb674666b52f5ce5990d898cc80dba
          echo P01_V516_CORRECTED_GOV_MODE_Z_ACTUAL_DIFF_AND_CLOSURE=PASS
      - name: Only rootless synthetic source; no public artifact and no release
        if: always()
        run: |
          rm -rf -- product gov
          echo P01_V516_FORMAL_RELEASE_STOP_ALREADY_RECORDED=YES
          echo P01_V516_TAG_RELEASE_CHANNEL_PRODUCTION_WRITE=NONE
