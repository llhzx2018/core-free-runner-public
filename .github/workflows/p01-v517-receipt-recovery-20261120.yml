name: P01 issued v516 one-file rescue exact final ZIP preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-v516-onefile-source-package-and-real-http:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Public-safe scope, no private artifact persistence
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_OWNER_REAL_PRIVATE_TAR_USED=NO
          echo P01_PRODUCTION_RELEASE_DNS_CHANGED=NO
      - name: Exact private P01 isolated maintenance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c025b4e4966a82fab7c6c96e0c8713d72f369acf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: maintenance
      - name: Exact previously proven issued-v516 HTTP harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5d1ae89fd4e73d508de21ae5bf94f1cf86451053
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: old-http-harness
      - name: Exact one-case GOV-DOC candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ac948af948b3cddf6102ae324a343c368be324a8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-onecase
      - name: Verify exact source, Mode Z only, same version, isolated delivery
        run: |
          set -Eeuo pipefail
          test "$(git -C maintenance rev-parse HEAD)" = "c025b4e4966a82fab7c6c96e0c8713d72f369acf"
          test "$(git -C old-http-harness rev-parse HEAD)" = "5d1ae89fd4e73d508de21ae5bf94f1cf86451053"
          test "$(git -C gov-onecase rev-parse HEAD)" = "ac948af948b3cddf6102ae324a343c368be324a8"
          test "$(cat maintenance/VERSION)" = 2.47.516
          test "$(cat maintenance/src/VERSION.txt)" = 2.47.516
          grep -q '^| RP-07Z |' maintenance/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q '^| skill-release | V3.25 |' gov-onecase/CURRENT.md
          grep -q '^## Mode Z ' gov-onecase/skills/skill-release/V3.25/SKILL.md
          grep -q '^## Mode Y ' gov-onecase/skills/skill-release/V3.25/SKILL.md
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path("maintenance/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          b=Path("old-http-harness/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          assert a == b
          assert hashlib.sha1(b"blob " + str(len(a)).encode() + b"\0" + a).hexdigest() == "9d6de3435755d75d303a56c50d1d83da10b11280"
          print("P01_V516_PATCH_SCRIPT_BLOB_EQUIVALENT_TO_MACHINE_PROVEN=PASS")
          PY
      - name: Native PHP 8.3 old-installed Owner HTTP dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip unzip >/dev/null
          php -r 'if(!extension_loaded("pdo_sqlite"))exit(4);'
          python3 -m py_compile maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py
          python3 -m py_compile maintenance/scripts/p01_v516_owner_major_route_repair.py
          python3 -m py_compile old-http-harness/tests/compatibility/laravel/http/test_p01_issued_v516_major_owner_api.py
      - name: Download unchanged original issued v516 FULL with real GitHub asset
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p01-old-issued"
          gh release download v2.47.516 -R llhzx2018/vf-start -D "$RUNNER_TEMP/p01-old-issued" -p VF-Start-V2.47.516-FULL.zip
          printf '%s  %s\n' '016edb85c7cfa48bf939d69fce1f0925f6f50647fded286a5b6df3789ca580ce' "$RUNNER_TEMP/p01-old-issued/VF-Start-V2.47.516-FULL.zip" | sha256sum -c -
          echo P01_V516_ORIGINAL_ISSUED_FULL_REMOTE_BYTES=PASS
      - name: Build final candidate twice; digest and allowlist; reject mutated script and symlink
        run: |
          set -Eeuo pipefail
          asset='VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip'
          mkdir -p "$RUNNER_TEMP/p01-patch-a" "$RUNNER_TEMP/p01-patch-b" "$RUNNER_TEMP/p01-patch-bad"
          python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$PWD/maintenance" --output "$RUNNER_TEMP/p01-patch-a/$asset"
          python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$PWD/maintenance" --output "$RUNNER_TEMP/p01-patch-b/$asset"
          cmp "$RUNNER_TEMP/p01-patch-a/$asset" "$RUNNER_TEMP/p01-patch-b/$asset"
          cp -a maintenance "$RUNNER_TEMP/p01-patch-bad/mutated"
          printf '%s\n' '# attacker drift' >> "$RUNNER_TEMP/p01-patch-bad/mutated/scripts/p01_v516_owner_major_route_repair.py"
          if python3 maintenance/scripts/build_p01_v516_owner_major_route_repair_asset.py --source-root "$RUNNER_TEMP/p01-patch-bad/mutated" --output "$RUNNER_TEMP/p01-patch-bad/$asset"; then echo UNAPPROVED_PATCH_MUTATION_ACCEPTED; exit 2; fi
          python3 - <<'PY'
          import json, os, zipfile, hashlib
          from pathlib import Path
          z=Path(os.environ["RUNNER_TEMP"])/"p01-patch-a"/"VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          with zipfile.ZipFile(z) as f:
              assert f.namelist()==["p01_v516_owner_major_route_repair.py","PROVENANCE.json"]
              raw=f.read("p01_v516_owner_major_route_repair.py")
              meta=json.loads(f.read("PROVENANCE.json"))
              assert meta["approved_source_blob_sha1"]=="9d6de3435755d75d303a56c50d1d83da10b11280"
              assert meta["repair_script_sha256"]==hashlib.sha256(raw).hexdigest()
              assert meta["target_installed_version"]=="2.47.516"
              assert meta["normal_atomic_upgrade"] is False
              assert meta["publication_status"]=="VERIFY_AGAINST_LIVE_GITHUB_RELEASE_API"
              assert raw==Path("maintenance/scripts/p01_v516_owner_major_route_repair.py").read_bytes()
          print("P01_V516_FINAL_ZIP_DETERMINISTIC_SOURCE_ALLOWLIST_NEGATIVE=PASS",flush=True)
          print("P01_V516_FINAL_ZIP_SHA256="+hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Test actual extracted maintenance ZIP against real issued PHP Owner HTTP and SIGKILL
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          z=Path(os.environ["RUNNER_TEMP"])/"p01-patch-a"/"VF_Start_v2.47.516_Owner_Major_Route_Repair_1.zip"
          output=Path("old-http-harness/scripts/p01_v516_owner_major_route_repair.py")
          with zipfile.ZipFile(z) as f:
              raw=f.read("p01_v516_owner_major_route_repair.py")
          output.write_bytes(raw)
          output.chmod(0o644)
          PY
          python3 old-http-harness/tests/compatibility/laravel/http/test_p01_issued_v516_major_owner_api.py \
            --official-full "$RUNNER_TEMP/p01-old-issued/VF-Start-V2.47.516-FULL.zip" \
            --candidate-root old-http-harness
          echo P01_V516_FINAL_EXTRACTED_ASSET_ISSUED_PHP_OWNER_HTTP_SIGKILL_ROLLBACK=PASS
      - name: Destroy all ephemeral source and ZIP; no artifacts uploaded
        if: always()
        run: |
          rm -rf -- maintenance old-http-harness gov-onecase "$RUNNER_TEMP/p01-old-issued" "$RUNNER_TEMP/p01-patch-a" "$RUNNER_TEMP/p01-patch-b" "$RUNNER_TEMP/p01-patch-bad"
          echo P01_V516_ONEFILE_PUBLISH=NOT_PERFORMED
          echo P01_V516_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          echo P01_V516_OLD_RELEASE_TAG_ATOMIC_PRODUCTION_DNS=UNCHANGED
