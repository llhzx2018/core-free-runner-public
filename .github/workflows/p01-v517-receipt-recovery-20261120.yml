name: P01 v517 synthetic original disaster to native HTTPS Laravel Owner recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  original-full-to-real-https:
    if: github.head_ref == 'test/p01-v517-interrupted-receipt-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Strict public synthetic-only scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_ORIGINAL_OWNER_BACKUP_IN_RUNNER=NO
          echo P01_OLD_OR_PRODUCTION_SITE_WRITES=NO
      - name: Checkout exact product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 31ec0179a39a1c91f2c92efaa3920f265620eacb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact source and whole disaster bridge static syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "31ec0179a39a1c91f2c92efaa3920f265620eacb"
          test "$(cat candidate/VERSION)" = 2.47.517
          test "$(cat candidate/src/VERSION.txt)" = 2.47.517
          python3 -m py_compile candidate/scripts/prepare_p01_legacy_disaster_restore.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_disaster_restore_https.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_media_restore_https.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo P01_ORIGINAL_DISASTER_TO_HTTPS_EXACT_CODE_SYNTAX=PASS
      - name: Isolated real PHP-FPM Nginx Composer dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >/dev/null
          php -r 'foreach(["zip","pdo_sqlite","fileinfo"] as $ext)if(!extension_loaded($ext))exit(2);'
          command -v nginx; command -v php-fpm8.3; command -v openssl
          echo P01_ORIGINAL_DISASTER_REAL_HTTPS_DEPS=PASS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact-source bundled Laravel FULL and CloudPanel layout
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha 31ec0179a39a1c91f2c92efaa3920f265620eacb --output "$RUNNER_TEMP/p01-disaster-clean.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-disaster-clean.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-disaster-clean.zip" --output "$RUNNER_TEMP/p01-disaster-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-disaster-cloudpanel.zip"
          echo P01_ORIGINAL_DISASTER_EXACT_FULL_CLOUDPANEL_BUNDLE=PASS
      - name: Real isolated Nginx HTTPS first-install original disaster through Owner API
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle "$RUNNER_TEMP/p01-disaster-cloudpanel.zip" --engine sqlite \
            --only-owner-disaster-restore
          echo P01_OLD_DISASTER_TO_LARAVEL_SQLITE_MEDIA_NATIVE_HTTPS=PASS
      - name: No archive, secret, private source or generated ZIP artifact retained
        if: always()
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-disaster-clean.zip" "$RUNNER_TEMP/p01-disaster-cloudpanel.zip"
          echo P01_PRIVATE_CHECKOUT_RETAINED=NO
          echo P01_TEST_ARCHIVE_ARTIFACT_RETAINED=NO
          echo P01_REAL_OWNER_BACKUP_BYTES_USED=NO
          echo P01_PRODUCTION_RELEASE_CHANNEL_WRITE=NONE
