name: P01 Round 4 Tools Home Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-round4-tools-home-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REF: feature/p01-tools-home-task-search-20260905
      EXPECTED_SHA: 6877918ed26a8bcaeda80f52bcca229fa8279769
      BASE_SHA: 2b09fe2440eafd4a098e6765e9c532168158a9af
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Verify exact source and no-schema boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          tested="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested}"
          test "${tested}" = "${EXPECTED_SHA}"
          test "$(cat VERSION)" = "2.46.1"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then
            echo "Version, schema, migration or runtime bootstrap changed unexpectedly." >&2
            exit 1
          fi

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          cd product
          for file in \
            src/tools.php \
            src/app/ToolTaskIntent.php \
            src/app/ToolWorkspaceHome.php \
            tests/unit/tool_task_intent_contract.php \
            tests/unit/tool_home_source_contract.php
          do
            php -l "$file"
          done

      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/tool_task_intent_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
