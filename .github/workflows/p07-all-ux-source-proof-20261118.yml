name: P07 all terminal UX scoped exact-source tests
on:
  pull_request:
    paths: ['.github/workflows/p07-all-ux-source-proof-20261118.yml']
permissions:
  contents: read
jobs:
  scoped-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: '9b977e8d4c16bbc3799aef8ac7f598b9ec234b33'
      D04_SHA: '77704dcc1ecce70290cbdc6f7dc041be048316da'
      SITE_SHA: '242a62d0d262c4f2956b6cc652dfed9878fd353b'
      M05_SHA: '30cc3697e72d9363ce9ee10ced9267487ada6b10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 77704dcc1ecce70290cbdc6f7dc041be048316da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d04
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 242a62d0d262c4f2956b6cc652dfed9878fd353b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-site
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30cc3697e72d9363ce9ee10ced9267487ada6b10
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-m05
      - name: Exact private source identities and read-only project UX contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d04 rev-parse HEAD)" = "$D04_SHA"
          test "$(git -C .p07-site rev-parse HEAD)" = "$SITE_SHA"
          test "$(git -C .p07-m05 rev-parse HEAD)" = "$M05_SHA"
          for folder in .p07-d04 .p07-site .p07-m05; do
            test "$(cat "$folder/BUILD_ID")" = '0.1.0-release139'
            (cd "$folder" && python3 -B scripts/check_p07_modules.py && python3 -B scripts/check_p07_terminal_ux.py --base-ref "$BASE_SHA")
          done
          echo P07_ALL_UI_SOURCE_AND_MODULE_GATES=PASS
      - name: Exact source/architecture and real Bash/PTY/NO_COLOR UX tests
        shell: bash
        run: |
          set -Eeuo pipefail
          for folder in .p07-d04 .p07-site .p07-m05; do
            head_sha="$(git -C "$folder" rev-parse HEAD)"
            python3 -B "$folder/.github/checks/architecture_gate.py" \
              --manifest "$folder/.github/checks/code_architecture.json" \
              --gov-root .gov-current --git-root "$folder" \
              --base-sha "$BASE_SHA" --head-sha "$head_sha"
          done
          bash -n .p07-d04/bin/vfops-migrate-ui .p07-d04/components/p07-m03-migration-readiness.sh
          bash -n .p07-site/bin/vfops-user .p07-site/bin/vfops-site-ui
          bash -n .p07-m05/bin/vfops-init-ui
          (cd .p07-d04 && python3 -B tests/test_p07_m03_d04_preparation_checklist.py -q)
          (cd .p07-site && python3 -B tests/test_p07_m03_site_ux_v3.py -q)
          (cd .p07-m05 && python3 -B tests/test_p07_m05_host_write_gate.py -q)
          echo P07_D04_M03_M05_REAL_ISOLATED_TERMINAL_UX_TESTS=PASS
          echo P07_OWNER_CP2_M05_MIGRATION=NOT_TOUCHED
      - name: Erase ephemeral private source
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-d04 .p07-site .p07-m05 .gov-current
          echo P07_UX_PRIVATE_CHECKOUT_CLEANUP=PASS
