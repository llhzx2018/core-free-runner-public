name: P07 D05 bounded variable-table kernel exact-source TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-bounded-rows-exact-20261117.yml'
permissions:
  contents: read
jobs:
  exact-d05-bounded-rows:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout temporary Public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 D05 source into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d72f5d4d020c1d7d285fdeb9935c55a0623a554d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout existing GOV architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-gov
      - name: Exact new kernel unit and complete PR architecture checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = d72f5d4d020c1d7d285fdeb9935c55a0623a554d
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in ("lib/db_engine_conversion_bounded_stage.py",
                       "tests/test_p07_m03_d05_bounded_stage.py",
                       "tests/test_p07_m03_d05_bounded_native.py"):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("P07_D05_BOUNDED_AST_NO_PYC=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_bounded_stage.py -v
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha d72f5d4d020c1d7d285fdeb9935c55a0623a554d
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output([
              "git", "diff", "--name-only",
              "fdbffcae2d13f3987ff3263c824a609874b373d7",
              "d72f5d4d020c1d7d285fdeb9935c55a0623a554d"
          ], text=True).splitlines()
          allowed = {"lib/db_engine_conversion_bounded_stage.py",
                     "tests/test_p07_m03_d05_bounded_stage.py",
                     "tests/test_p07_m03_d05_bounded_native.py"}
          assert set(changed) == allowed, "D05_SCOPE_DRIFT"
          print("P07_D05_BOUNDED_D04_AND_OTHER_MODULES_UNCHANGED=PASS")
          PY
          echo P07_D05_BOUNDED_UNIT_ARCH_SCOPE=PASS
      - name: Execute bounded variable-table stage on actual independent MySQL MariaDB engines
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=30s 1200s \
            python3 -B -m unittest discover -s tests \
            -p test_p07_m03_d05_bounded_native.py -v
          echo P07_D05_BOUNDED_NEW_NATIVE_TWO_DIRECTIONS=PASS
      - name: Clean exact private/GOV workspaces and owned lab containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter name='^/p07-d05-' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
