name: P04 V2.7 Final UI Candidate Gate V7
on:
  push:
    branches: [p04-v270-final-ui-candidate-gate-tmp]
    paths: [.github/workflows/p04-v270-final-ui-candidate-gate-v7.yml]
permissions:
  contents: write
jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_HEAD: cf4f26a506dbc2ab81e113519ee38906a42c1c1a
      AUTHORITY_HEAD: 2b9209fb5c5a8d5ec4f7ea770fa473962fdccb9c
      PRODUCT_VERSION: 2.7.0
      PRODUCT_SCHEMA: '14'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Publish run locator
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Candidate Gate Runner'; git config user.email 'actions@users.noreply.github.com'
          printf '{"status":"STARTING","run_id":"%s","product_head":"%s","version":"2.7.0","schema":14,"production_write":0}\n' "$GITHUB_RUN_ID" "$PRODUCT_HEAD" > p04-v270-final-ui-candidate-gate-run.json
          git add p04-v270-final-ui-candidate-gate-run.json && git commit -m 'chore(P04): locate candidate gate v7 [skip ci]' || true
          git push origin HEAD:p04-v270-final-ui-candidate-gate-tmp
      - name: Require private read authority
        env: {TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: test -n "$TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: cf4f26a506dbc2ab81e113519ee38906a42c1c1a
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          fetch-depth: 0
          persist-credentials: false
          path: vf-src
      - name: Run reference-locked V2.7 gate
        shell: bash
        run: bash .github/scripts/p04-v270-final-ui-candidate-gate-v7.sh
      - name: Upload exact browser visual evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.0-FINAL-UI-CANDIDATE-GATE
          path: vf-src/evidence-final-ui
          if-no-files-found: error
          retention-days: 30
      - name: Record outcome
        if: always()
        env: {JOB_STATUS: '${{ job.status }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Candidate Gate Runner'; git config user.email 'actions@users.noreply.github.com'
          s=FAILED; [ "$JOB_STATUS" = success ] && s=TESTED_READY_FOR_PIXEL_REVIEW
          printf '{"status":"%s","run_id":"%s","job_status":"%s","product_head":"%s","version":"2.7.0","schema":14,"production_write":0}\n' "$s" "$GITHUB_RUN_ID" "$JOB_STATUS" "$PRODUCT_HEAD" > p04-v270-final-ui-candidate-gate-run.json
          git add p04-v270-final-ui-candidate-gate-run.json && git commit -m 'chore(P04): record candidate gate v7 result [skip ci]' || true
          git push origin HEAD:p04-v270-final-ui-candidate-gate-tmp
