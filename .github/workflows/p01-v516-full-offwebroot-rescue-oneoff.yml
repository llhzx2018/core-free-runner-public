name: P01 v516 real installed full off-webroot recovery point and restore
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRIDGE_SHA: ab49e83c4715cc9246c4333679fc5388e554cc98
      SOURCE_TAG: v2.47.515
      BRIDGE_VERSION: 2.47.516
      TARGET_VERSION: 2.47.516
      TARGET_SHA: ab49e83c4715cc9246c4333679fc5388e554cc98
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate ephemeral lane contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-247516-lock-inode-20261117"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-v516-full-offwebroot-rescue.json >"$RUNNER_TEMP/p01-bridge-lane.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-v516-full-offwebroot-rescue.json --input .github/workflows/p01-v516-full-offwebroot-rescue-oneoff.yml >>"$RUNNER_TEMP/p01-bridge-lane.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-bridge-lane.txt" >/dev/null
          echo P01_PHP_BRIDGE_SAFE_ONEOFF_LANE=PASS
      - name: Checkout bridge from exact immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: bridge-src
          fetch-depth: 0
      - name: Checkout current GOV-DOC canonical architecture rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc-src
          fetch-depth: 1
      - name: Actual source Diff architecture/naming 13-domain and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C bridge-src rev-parse origin/main)" = "ab49e83c4715cc9246c4333679fc5388e554cc98"
          test "$(git -C bridge-src rev-parse HEAD^{tree})" = "20820cabb6c018e7e2f34bfa04dcc7e604835de3"
          test "$(git -C bridge-src rev-parse HEAD^1)" = "b261c0f856a2e056c37f44dae2c24fc5caaf17cb"
          test "$(git -C bridge-src rev-parse HEAD^2)" = "bb0946716d9c4b84de6b3cbc919c55ffeec1ec9f"
          echo P01_V516_FINAL_MERGED_MAIN_IDENTICAL_TESTED_GIT_TREE=PASS
          # Source architecture checker demands an ancestor base, while the
          # live main advanced once by the already-approved doc-only RP-07S.
          test "$(git -C bridge-src diff --name-only c377dc3e0696585b207561081f6dc462108c904f b261c0f856a2e056c37f44dae2c24fc5caaf17cb)" = "docs/authority/ACCEPTANCE_MATRIX.md"
          test "$(git -C bridge-src show b261c0f856a2e056c37f44dae2c24fc5caaf17cb:docs/authority/ACCEPTANCE_MATRIX.md | git -C bridge-src hash-object --stdin)" = "$(git -C bridge-src rev-parse "$BRIDGE_SHA:docs/authority/ACCEPTANCE_MATRIX.md")"
          git -C bridge-src merge-base --is-ancestor c377dc3e0696585b207561081f6dc462108c904f "$BRIDGE_SHA"
          echo P01_V516_CURRENT_MAIN_DOC_ONLY_RP07S_SOURCE_COMPAT=PASS
          test -f gov-doc-src/governance/agent/VF_CODE_ARCHITECTURE_QUALITY_CONTRACT_V1.md
          test -f gov-doc-src/governance/agent/code_architecture_lint.py
          PYTHONDONTWRITEBYTECODE=1 python3 bridge-src/.github/checks/test_architecture_gate.py >"$RUNNER_TEMP/p01-architecture-negative.txt" 2>&1 || {
            grep -E 'FAIL|ERROR|Traceback|AssertionError' "$RUNNER_TEMP/p01-architecture-negative.txt" | tail -n 15 || true
            exit 1
          }
          PYTHONDONTWRITEBYTECODE=1 python3 bridge-src/.github/checks/architecture_gate.py \
            --manifest bridge-src/.github/checks/code_architecture.json \
            --gov-root gov-doc-src --git-root bridge-src \
            --base-sha c377dc3e0696585b207561081f6dc462108c904f \
            --head-sha "$BRIDGE_SHA" >"$RUNNER_TEMP/p01-architecture-real-diff.txt" 2>&1 || {
              grep -E 'PROJECT_ARCHITECTURE=|ARCH_' "$RUNNER_TEMP/p01-architecture-real-diff.txt" | tail -n 15 || true
              exit 1
            }
          test -z "$(git -C bridge-src status --porcelain --untracked-files=all)"
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-architecture-real-diff.txt"
          grep -F 'RUNTIME_TESTS=SEPARATE' "$RUNNER_TEMP/p01-architecture-real-diff.txt"
          echo P01_V516_ARCH_NAMING_REAL_GIT_DIFF=PASS
          echo P01_V516_ARCH_NAMING_NEGATIVE_FIXTURES=PASS
      - name: PHP extensions and exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(cat bridge-src/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat bridge-src/src/VERSION.txt)" = "$BRIDGE_VERSION"
          test "$(grep -Foc "define('VF_VERSION', '2.47.516');" bridge-src/src/app/bootstrap.php)" = 1
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-zip php8.3-mbstring php8.3-sqlite3 php8.3-gd php8.3-xml unzip curl >> "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          php8.3 -l bridge-src/src/app/LegacyMajorWriteFreeze.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorFullRestorePoint.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorMigrationReadiness.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorOwnerHandoff.php >/dev/null
          php8.3 -l bridge-src/src/api.php >/dev/null
          php8.3 -l bridge-src/src/app/UpdateManager.php >/dev/null
          php8.3 -l bridge-src/src/app/CoreUpdates/GitHubClient.php >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile bridge-src/scripts/build_p01_247516_legacy_atomic.py
          # Latest current main was merged into this bridge candidate, not the
          # reverse. The real v515 baseline, complete DB contract and RP-07S
          # source-scoped human-preview rule must all survive the merge.
          git -C bridge-src merge-base --is-ancestor 8a670132c5b3020e5e2d91bce3b0b92d78eda0df HEAD
          git -C bridge-src merge-base --is-ancestor 545b5ae7655dbffadfb5e2ed8e15d79bfc97ca7a HEAD
          test "$(git -C bridge-src cat-file -p 545b5ae7655dbffadfb5e2ed8e15d79bfc97ca7a | sed -n 's/^parent //p' | paste -sd' ' -)" = "7583754655c3f68f3f54553e91043b2847fb0d5b c377dc3e0696585b207561081f6dc462108c904f"
          git -C bridge-src diff --name-only 8a670132c5b3020e5e2d91bce3b0b92d78eda0df..HEAD | sort >"$RUNNER_TEMP/p01-v516-bounded-diff.txt"
          printf '%s\n' scripts/build_p01_247516_legacy_atomic.py scripts/p01_bridge_legacy_security.py src/api.php src/app/BrandUpload.php src/app/FunctionalWorkspaceShell.php src/app/LegacyMajorOwnerApiActions.php src/assets/update-core.js >"$RUNNER_TEMP/p01-v516-allowed-bounded-diff.txt"
          cmp "$RUNNER_TEMP/p01-v516-allowed-bounded-diff.txt" "$RUNNER_TEMP/p01-v516-bounded-diff.txt"
          php8.3 -l bridge-src/src/api.php >/dev/null
          php8.3 -l bridge-src/src/app/BrandUpload.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorOwnerApiActions.php >/dev/null
          php8.3 -l bridge-src/src/app/FunctionalWorkspaceShell.php >/dev/null
          node --check bridge-src/src/assets/update-core.js
          grep -Fq '"app/FunctionalWorkspaceShell.php"' bridge-src/scripts/build_p01_247516_legacy_atomic.py
          grep -Fq '"app/BrandUpload.php", "app/LegacyMajorOwnerApiActions.php"' bridge-src/scripts/build_p01_247516_legacy_atomic.py
          test -f bridge-src/scripts/p01_bridge_legacy_security.py
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import sys,pathlib
          sys.path.insert(0,'bridge-src/scripts')
          from p01_bridge_legacy_security import verify_major_owner_api
          root=pathlib.Path('bridge-src/src')
          route=(root/'api.php').read_bytes()
          handler=(root/'app/LegacyMajorOwnerApiActions.php').read_bytes()
          verify_major_owner_api(route,handler)
          probes=(
            ('NO_DISPATCH',route.replace(b'VfLegacyMajorOwnerApiActions::dispatch($action,$method,$updates);',b'',1),handler),
            ('NO_ADMIN',route,handler.replace(b'vf_require_admin();',b'',1)),
            ('NO_CSRF',route,handler.replace(b'vf_require_csrf();',b'',1)),
            ('NO_RECENT_AUTH',route,handler.replace(b'vf_require_recent_auth();',b'',1)),
            ('NO_STAGE_WORKER',route,handler.replace(b'VfLegacyMajorPackageStage::launchInstalledWorker(',b'',1)),
            ('NO_FINAL_CONSENT',route,handler.replace(b'VfLegacyMajorFinalOwnerConsent::issue(',b'',1)),
            ('NO_UNKNOWN_ACTION_REJECTION',route,handler.replace(b'MAJOR_OWNER_ACTION_UNKNOWN',b'',1)),
          )
          for name,r,h in probes:
            assert r!=route or h!=handler,name
            try:verify_major_owner_api(r,h)
            except ValueError: pass
            else:raise AssertionError('MAJOR_SECURITY_NEGATIVE_NOT_DENIED:'+name)
          print('P01_V516_EXTRACTED_OWNER_API_SEVEN_AUTH_DENY_NEGATIVES=PASS')
          PY
          test "$(git -C bridge-src hash-object src/app/LegacyMajorOwnerApiActions.php)" = 8dcc03149fdf325d712fc4683dd365f51afa522a
          test "$(git -C bridge-src hash-object src/app/BrandUpload.php)" = bc6b8b8d352b9838f920b54f72cf5b82cdbe6ad5
          echo P01_V516_SHARED_517_OWNER_API_AND_BRAND_HELPER_EXACT_BYTES=PASS
          test "$(wc -l <bridge-src/scripts/build_p01_247516_legacy_atomic.py)" -le 400
          echo P01_V516_BOUNDED_SAFE_ROUTER_REFACTOR_AND_PACKAGE_ALLOWLIST=PASS
          test -f bridge-src/config/p01-fullstack-target.json
          grep -F '| DB-10 |' bridge-src/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F '| TECH-08 |' bridge-src/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F '| RP-07S |' bridge-src/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          echo P01_V516_MERGED_CURRENT_MAIN_AND_PRESERVED_3DB_RP07S=PASS
          echo P01_BRIDGE_EXACT_SOURCE_AND_PHP83_SYNTAX=PASS
      - name: Download official immutable v515 FULL and UPDATE assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          mkdir -p "$BASE/full" "$BASE/repair"
          gh release download v2.47.515 -R llhzx2018/vf-start -D "$BASE" -p 'VF-Start-V2.47.515-FULL.zip' -p 'VF_Start_V2.47.515_UPDATE.zip' >"$RUNNER_TEMP/p01-bridge-download.txt" 2>&1
          test "$(sha256sum "$BASE/VF-Start-V2.47.515-FULL.zip" | cut -d' ' -f1)" = 5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778
          test "$(sha256sum "$BASE/VF_Start_V2.47.515_UPDATE.zip" | cut -d' ' -f1)" = 3a5e6528e8ef1204ef1fc4f6d4568aad0634dced649200f5744df5cb9c082556
          unzip -q "$BASE/VF-Start-V2.47.515-FULL.zip" -d "$BASE/full"
          unzip -q "$BASE/VF_Start_V2.47.515_UPDATE.zip" -d "$BASE/repair"
          test -f "$BASE/repair/repair-v2.47.515.php"
          echo P01_BRIDGE_REAL_OLD_RELEASE_FULL_UPDATE_SHA=PASS
      - name: Build bounded bridge FULL and journal capable Atomic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          PYTHONDONTWRITEBYTECODE=1 python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$BASE/full" --baseline-repair "$BASE/repair/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "$BRIDGE_SHA" --output-dir "$RUNNER_TEMP/p01-bridge-out" >"$RUNNER_TEMP/p01-bridge-build.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,96}|BridgeError|Traceback|RuntimeError)' "$RUNNER_TEMP/p01-bridge-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          test -f "$RUNNER_TEMP/p01-bridge-out/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip"
          test -f "$RUNNER_TEMP/p01-bridge-out/VF-Start-V2.47.516-FULL-DEV-ONLY.zip"
          test "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/p01-bridge-out/bridge-candidate-receipt.json")" = DEVELOPER_ISOLATED_ONLY
          echo P01_BRIDGE_516_DEVELOPER_ATOMIC_FULL_ARTIFACTS=PASS
      - name: Prove reproducible official-named 516 package content without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          for dir in A B; do
            PYTHONDONTWRITEBYTECODE=1 python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py \
              --candidate bridge-src/src --baseline-full-dir "$BASE/full" \
              --baseline-repair "$BASE/repair/repair-v2.47.515.php" \
              --runner-atomic-engine scripts/p01-build-release-v2.py \
              --target-sha "$BRIDGE_SHA" --prepare-official-content \
              --output-dir "$RUNNER_TEMP/p01-bridge-official-$dir" \
              >"$RUNNER_TEMP/p01-bridge-official-$dir.log" 2>&1
          done
          python3 - <<'PY'
          import hashlib,json,os,zipfile,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          a=root/'p01-bridge-official-A'
          b=root/'p01-bridge-official-B'
          r=json.loads((a/'bridge-candidate-receipt.json').read_text())
          s=json.loads((b/'bridge-candidate-receipt.json').read_text())
          assert r['status']==s['status']=='OFFICIAL_CONTENT_PREPARED_NOT_PUBLISHED'
          assert r['source_git_sha']==s['source_git_sha']==os.environ['BRIDGE_SHA']
          assert r['real_github_release_or_channel_verified'] is False
          assert r['owner_prod_installable'] is False
          assert r['can_publish'] is False
          for k in ('full','atomic'):
            assert r[k]==s[k], 'NONDETERMINISTIC_OFFICIAL_'+k
            p=a/r[k]['filename']; q=b/s[k]['filename']
            assert p.read_bytes()==q.read_bytes()
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r[k]['sha256']
            assert r[k]['bytes']>10000
          with zipfile.ZipFile(a/r['full']['filename']) as z:
            m=json.loads(z.read('release-manifest.json'))
            assert m['stage']=='OFFICIAL_ARTIFACT_CONTENT'
            assert m['source_commit']==r['source_git_sha']
            assert m['deployable'] is True and not m['runtime_data_included']
            assert m['bridge']['production_authorized'] is False
            assert m['schema_change'] is False
            assert not any('/.env' in x or x.endswith('.sqlite') for x in z.namelist())
          with zipfile.ZipFile(a/r['atomic']['filename']) as z:
            assert z.namelist()==['repair-v2.47.516.php']
          print('P01_V516_OFFICIAL_NAMED_FULL_AND_ATOMIC_REPRODUCIBLE=PASS')
          print('P01_V516_OFFICIAL_CANDIDATE_NOT_YET_ISSUED=PASS')
          print('P01_V516_OFFICIAL_CONTENT_FULL_SHA256='+r['full']['sha256'])
          print('P01_V516_OFFICIAL_CONTENT_ATOMIC_SHA256='+r['atomic']['sha256'])
          PY
      - name: Real old v515 install then v516 Atomic success and interrupted rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          export BASE="$RUNNER_TEMP/p01-bridge-base" OUT="$RUNNER_TEMP/p01-bridge-out" WORK="$RUNNER_TEMP/p01-bridge-work"
          mkdir -p "$WORK"/{upgrade,rollback,repair}
          unzip -q "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip" -d "$WORK/repair"
          REPAIR="$WORK/repair/repair-v2.47.516.php"
          test "$(unzip -Z1 "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip")" = repair-v2.47.516.php
          php8.3 -l "$REPAIR" >/dev/null
          php8.3 "$REPAIR" --self-test >"$RUNNER_TEMP/p01-bridge-selftest.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-selftest.txt"
          test -z "$(unzip -Z1 "$OUT/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)' || true)"
          cp -a "$BASE/full/." "$WORK/upgrade/"
          cp -a "$BASE/full/." "$WORK/rollback/"
          install_old() {
            local dir="$1" port="$2"
            (cd "$dir" && php8.3 -S 127.0.0.1:"$port" -t . > "$RUNNER_TEMP/p01-bridge-http-$port.txt" 2>&1 & echo $! > "$RUNNER_TEMP/p01-bridge-http-$port.pid")
            local cookie="$RUNNER_TEMP/p01-bridge-cookie-$port.txt"
            local ready=0
            for i in $(seq 1 35); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" > "$RUNNER_TEMP/p01-bridge-page-$port.html" 2>/dev/null; then ready=1;break;fi
              sleep 1
            done
            test "$ready" -eq 1
            local csrf
            csrf="$(python3 - "$RUNNER_TEMP/p01-bridge-page-$port.html" <<'PY'
          import re,sys
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open(sys.argv[1],encoding="utf-8").read())
          assert m, "missing old setup csrf"
          print(m.group(1))
          PY
          )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=Bridge Test" --data-urlencode "admin_password=BridgePassword-2026!" --data-urlencode "admin_password_confirm=BridgePassword-2026!" > "$RUNNER_TEMP/p01-bridge-setup-$port.html"
            (cd "$dir" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
            kill "$(cat "$RUNNER_TEMP/p01-bridge-http-$port.pid")" || true
          }
          install_old "$WORK/upgrade" 19416
          install_old "$WORK/rollback" 19417
          cp "$REPAIR" "$WORK/upgrade/repair-v2.47.516.php"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --verify-source="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --run="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-success.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-success.txt"
          test "$(cat "$WORK/upgrade/VERSION.txt")" = 2.47.516
          (cd "$WORK/upgrade" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          php8.3 -r 'require $argv[1]."/app/bootstrap.php"; $m=new VfUpdateManager(vf_db()); $x=$m->status(); if(($x["major_migration"]["from_version"]??"")!=="2.47.516"||($x["major_migration"]["to_version"]??"")!=="2.47.517"||($x["major_migration"]["can_execute"]??true)!==false) exit(33); echo "P01_BRIDGE_MAJOR_STATUS_NOT_EXECUTABLE=PASS\n";' "$WORK/upgrade"
          echo P01_BRIDGE_OLD_515_TO_516_REAL_ATOMIC_INSTALL=PASS
          cp "$REPAIR" "$WORK/rollback/repair-v2.47.516.php"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php8.3 "$WORK/rollback/repair-v2.47.516.php" --run="$WORK/rollback" >"$RUNNER_TEMP/p01-bridge-failure.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          test "$(cat "$WORK/rollback/VERSION.txt")" = 2.47.515
          (cd "$WORK/rollback" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_BRIDGE_FAILURE_INJECTION_ROLLBACK=PASS
      - name: Real installed PHP v516 Owner HTTP availability and no guest stage
        shell: bash
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/p01-bridge-work/upgrade"
          test "$(cat "$SITE/VERSION.txt")" = "2.47.516"
          php8.3 -S 127.0.0.1:19425 -t "$SITE" >"$RUNNER_TEMP/p01-bridge-http-stage.txt" 2>&1 &
          echo $! >"$RUNNER_TEMP/p01-bridge-http-stage.pid"
          ready=0
          for attempt in $(seq 1 35); do
            if curl --noproxy '*' -fsS 'http://127.0.0.1:19425/api.php?action=health' >/dev/null; then ready=1;break;fi
            sleep 1
          done
          test "$ready" -eq 1
          guest="$(curl --noproxy '*' -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' 'http://127.0.0.1:19425/api.php?action=update_major_stage')"
          case "$guest" in 401|403) ;; *) echo 'P01_MAJOR_STAGE_GUEST_AUTH=FAIL'; exit 1;; esac
          cookies="$RUNNER_TEMP/p01-bridge-stage.cookie"
          curl --noproxy '*' -fsS -b "$cookies" -c "$cookies"             -X POST -H 'Content-Type: application/json'             --data '{"password":"BridgePassword-2026!"}'             'http://127.0.0.1:19425/api.php?action=login'             >"$RUNNER_TEMP/p01-bridge-stage-login.json"
          csrf="$(python3 -c 'import json,sys;r=json.load(open(sys.argv[1]));assert r.get("ok") and r.get("csrf");print(r["csrf"])' "$RUNNER_TEMP/p01-bridge-stage-login.json")"
          curl --noproxy '*' -fsS -b "$cookies" -c "$cookies"             -X POST -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json'             --data '{}'             'http://127.0.0.1:19425/api.php?action=update_major_available'             >"$RUNNER_TEMP/p01-bridge-stage-available.json"
