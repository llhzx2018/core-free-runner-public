                  window.__p01Requests.push({url:url,method:String((opts&&opts.method)||'GET')});
                }
                return old.apply(this,arguments);
              };
              """)
              driver.find_element(By.ID,"checkUpdate").click()
              WebDriverWait(driver,30).until(lambda d:any(
                  "update_major_available" in x["url"] for x in d.execute_script('return window.__p01Requests')))
              WebDriverWait(driver,30).until(lambda d:not d.execute_script('return !!window.vfUpdateBusy'))
              requests=[x["url"] for x in driver.execute_script('return window.__p01Requests')]
              assert any("update_major_available" in x for x in requests)
              assert not any(t in url for url in requests for t in
                  ("update_install","update_major_intent","update_major_stage","update_major_final_consent")),requests
              assert not driver.find_element(By.ID,"installUpdate").is_displayed()
              print('P01_V516_CHROME_MISSING_OFFICIAL_MAJOR_FAIL_CLOSED_NO_INTENT=PASS')

          finally:
              driver.quit()
          PY
          "$RUNNER_TEMP/p01-v516-selenium/bin/python" "$RUNNER_TEMP/p01-v516-browser.py"
      - name: Cleanup all private source and FULL/UPDATE and old-site SQLite
        if: always()
        shell: bash
        run: |
          for path in "$RUNNER_TEMP"/p01-bridge-http-*.pid; do
            [ ! -f "$path" ] || kill "$(cat "$path")" 2>/dev/null || true
          done
          rm -rf -- bridge-src gov-doc-src baseline-src "$RUNNER_TEMP/p01-bridge-clean-full" "$RUNNER_TEMP/p01-v516-selenium" "$RUNNER_TEMP/p01-bridge-base" "$RUNNER_TEMP/p01-bridge-out" "$RUNNER_TEMP/p01-bridge-work"
          rm -f -- "$RUNNER_TEMP"/p01-bridge-*.json "$RUNNER_TEMP"/p01-bridge-*.cookie "$RUNNER_TEMP"/p01-bridge-*.txt "$RUNNER_TEMP"/p01-bridge-*.html "$RUNNER_TEMP"/p01-bridge-*.pid
          echo P01_BRIDGE_PRIVATE_SOURCE_AND_DATA_PERSISTENCE=NONE
