name: P01 V2.36.3 Main Authority Sync Prep
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-main-authority-sync-prep-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      DEVELOP_CLOSURE: f0a54a43af8614426995dc3894ccedfd919be8ac
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      BRANCH: docs/p01-v2363-main-authority-sync-20260901
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      AUTHORITY_GATE: '33505729408'
      EVID: /tmp/p01-v2363-main-authority-sync-prep
    steps:
      - name: Checkout exact product main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Copy exact closure files onto main base
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git rev-parse HEAD)" = "$PRODUCT_MAIN"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$DEVELOP_CLOSURE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$AUTHORITY_GATE --jq .conclusion)" = success
          git fetch origin "$DEVELOP_CLOSURE" --quiet
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          snapshot_diff="$(git diff --name-only "$PRODUCT_MAIN" "$DEVELOP_CLOSURE" | sort)"
          test "$snapshot_diff" = "$expected"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then echo "target branch already exists"; exit 1; fi
          git switch -c "$BRANCH"
          git checkout "$DEVELOP_CLOSURE" -- VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          test "$(git diff --cached --name-only | sort)" = "$expected"
          test -z "$(git diff --cached --name-only -- src)"
          git commit -m "docs(P01): sync V2.36.3 release authority to main"
          test "$(git rev-parse HEAD^:src)" = "$RUNTIME_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin "$BRANCH"
          printf 'P01_V2363_MAIN_AUTHORITY_SYNC_PREP=PASS\nBASE_MAIN=%s\nDEVELOP_CLOSURE=%s\nSYNC_COMMIT=%s\nSRC_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$PRODUCT_MAIN" "$DEVELOP_CLOSURE" "$(git rev-parse HEAD)" "$RUNTIME_TREE" | tee "$EVID/verdict.txt"
      - name: Upload prep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-main-authority-sync-prep-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
