name: P01 V2.29 Domain Media Gate

on:
  push:
    branches:
      - task/p01-v229-domain-media-gate-20260829

permissions:
  contents: read

env:
  SOURCE_SHA: 03244e101fdc037954e7f7bc8054066439d53ba0
  ROOT: /tmp/p01-v229-domain
  PORT: '18429'
  ADMIN_PASS: 'P01Domain!2026'

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Exact source syntax migration and fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = "2.29.0"
          grep -F "define('VF_VERSION', '2.29.0');" source/src/app/bootstrap.php
          grep -F "'version' => '2026082901'" source/src/migrations/2026082901_v229_resource_domains.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find source/src -type f -name '*.php' -print0)
          node --check source/src/assets/workspace.js
          node --check source/src/assets/workspace-rebaseline.js
          echo P01_DOMAIN_SYNTAX=PASS

          cat >/tmp/p01-domain-migration.php <<'PHP'
          <?php
          declare(strict_types=1);
          $db=new PDO('sqlite::memory:');$db->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);$db->exec('PRAGMA foreign_keys=ON');
          $db->exec('CREATE TABLE links(id INTEGER PRIMARY KEY)');
          $db->exec("CREATE TABLE resource_surface_profiles(link_id INTEGER PRIMARY KEY,surface TEXT NOT NULL,resource_kind TEXT NOT NULL DEFAULT '',note TEXT NOT NULL DEFAULT '',background_friendly INTEGER NOT NULL DEFAULT 0,media_year INTEGER,media_status TEXT NOT NULL DEFAULT '',last_opened_at TEXT NOT NULL DEFAULT '',created_at TEXT NOT NULL,updated_at TEXT NOT NULL,FOREIGN KEY(link_id) REFERENCES links(id) ON DELETE CASCADE)");
          $db->exec("INSERT INTO links(id) VALUES(9)");
          $db->exec("INSERT INTO resource_surface_profiles(link_id,surface,resource_kind,note,background_friendly,media_year,media_status,last_opened_at,created_at,updated_at) VALUES(9,'channels','旅行生活','legacy',1,NULL,'','','2026-01-01T00:00:00Z','2026-01-01T00:00:00Z')");
          $m=include getenv('SRC').'/src/migrations/2026082901_v229_resource_domains.php';($m['up'])($db);
          $r=$db->query('SELECT * FROM resource_domain_profiles WHERE link_id=9')->fetch(PDO::FETCH_ASSOC);if(!$r||$r['domain_key']!=='channels'||$r['resource_kind']!=='旅行生活'||(int)$r['background_friendly']!==1)throw new RuntimeException('legacy profile migration failed');
          if((int)$db->query("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='resource_asset_files'")->fetchColumn()!==1)throw new RuntimeException('asset table missing');
          echo "P01_DOMAIN_LEGACY_MIGRATION=PASS\n";
          PHP
          SRC="$PWD/source" php /tmp/p01-domain-migration.php | grep -Fx P01_DOMAIN_LEGACY_MIGRATION=PASS

          rm -rf "$ROOT" /tmp/p01-domain-* || true
          cp -a source/src "$ROOT"
          php -d display_errors=1 -d log_errors=1 -d error_reporting=E_ALL -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-domain-server.log 2>&1 &
          echo $! >/tmp/p01-domain-server.pid
          COOKIE=/tmp/p01-domain-setup.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-domain-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-domain-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Domain Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-domain-setup-post.html
          php "$ROOT/cli/verify.php" | tee /tmp/p01-domain-verify.txt | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-domain-schema.php <<'PHP'
          <?php
          declare(strict_types=1);$r=getenv('ROOT');require $r.'/app/bootstrap.php';$db=vf_db();foreach(['resource_domain_profiles','resource_asset_files'] as $t){$s=$db->prepare("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name=?");$s->execute([$t]);if((int)$s->fetchColumn()!==1)throw new RuntimeException($t);}echo "P01_DOMAIN_FRESH_SCHEMA=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-domain-schema.php | grep -Fx P01_DOMAIN_FRESH_SCHEMA=PASS

      - name: Seed domain privacy and favicon truth
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-domain-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$db=vf_db();
          $publicCat=$r->createCategory(['name'=>'公开网址','is_private'=>false,'sort_order'=>100]);
          $privateCat=$r->createCategory(['name'=>'私人网址','is_private'=>true,'sort_order'=>90]);
          $save=function(string $title,string $url,int $cat,bool $private=false)use($r):int{return (int)$r->saveLink(null,['category_id'=>$cat,'title'=>$title,'url'=>$url,'description'=>'domain fixture','is_private'=>$private],'manual')['id'];};
          $startPublic=$save('导航 Favicon','https://nav.example.com',$publicCat,false);
          $startPrivateCat=$save('导航 私人分类','https://private-start.example.com',$privateCat,false);
          $channel=$save('频道 旅行生活','https://channel.example.com',$privateCat,true);$s->upsertProfile($channel,['surface'=>'channels','resource_kind'=>'旅行生活','background_friendly'=>true]);
          $channel2=$save('频道 科技','https://tech-channel.example.com',$publicCat,false);$s->upsertProfile($channel2,['surface'=>'channels','resource_kind'=>'科技']);
          $watch=$save('影视 犯罪片','https://movie.example.com',$privateCat,false);$s->upsertProfile($watch,['surface'=>'watch','resource_kind'=>'电影','media_year'=>'2025','media_status'=>'want']);
          $topic=$save('专题 赚钱研究','https://topic.example.com',$privateCat,false);$s->upsertProfile($topic,['surface'=>'topics','resource_kind'=>'赚钱研究']);
          $topicPrivate=$save('专题 私人','https://topic-private.example.com',$publicCat,true);$s->upsertProfile($topicPrivate,['surface'=>'topics','resource_kind'=>'私人研究']);
          if(!is_dir(VF_USER_ICON_DIR))mkdir(VF_USER_ICON_DIR,0750,true);$file='gate-favicon.png';$png=base64_decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=');file_put_contents(VF_USER_ICON_DIR.'/'.$file,$png);$hash=hash('sha256',$png);$stmt=$db->prepare('INSERT INTO user_link_icons(link_id,file_name,file_hash,mime_type,byte_size,width,height,updated_at) VALUES(?,?,?,?,?,?,?,?)');$stmt->execute([$startPublic,$file,$hash,'image/png',strlen($png),1,1,gmdate('c')]);
          $admin=$s->allAssets(true);$by=[];foreach($admin as $a)$by[(int)$a['id']]=$a;if(($by[$startPublic]['icon_cache_status']??'')!=='user'||empty($by[$startPublic]['icon_cache_url']))throw new RuntimeException('favicon regression');
          $public=$s->allAssets(false);$pub=[];foreach($public as $a)$pub[(int)$a['id']]=$a;foreach([$startPublic,$watch,$topic,$channel2] as $id)if(!isset($pub[$id]))throw new RuntimeException('public domain missing '.$id);foreach([$startPrivateCat,$channel,$topicPrivate] as $id)if(isset($pub[$id]))throw new RuntimeException('private leak '.$id);
          file_put_contents('/tmp/p01-domain-fixture.json',json_encode(compact('publicCat','privateCat','startPublic','startPrivateCat','channel','channel2','watch','topic','topicPrivate'),JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE));
          echo "P01_DOMAIN_SEED=PASS\n";
          PHP
          ROOT="$ROOT" php /tmp/p01-domain-seed.php | grep -Fx P01_DOMAIN_SEED=PASS

      - name: Domain HTTP privacy isolation gate
        shell: bash
        run: |
          set -Eeuo pipefail
          COOKIE=/tmp/p01-domain-admin.cookies
          LOGIN=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:${PORT}/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}")
          jq -e '.ok==true' <<<"$LOGIN" >/dev/null;CSRF=$(jq -r '.csrf' <<<"$LOGIN")
          PRIVATE_CAT=$(jq -r '.privateCat' /tmp/p01-domain-fixture.json);CHANNEL=$(jq -r '.channel' /tmp/p01-domain-fixture.json);START_PRIVATE=$(jq -r '.startPrivateCat' /tmp/p01-domain-fixture.json)
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/start.php?category=${PRIVATE_CAT}" -o /tmp/start.html
          grep -F '网址分类' /tmp/start.html; ! grep -Fq '频道分类' /tmp/start.html
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/channels.php?category=${PRIVATE_CAT}&kind=%E7%A7%91%E6%8A%80" -o /tmp/channels.html
          grep -F '频道分类' /tmp/channels.html; grep -F '频道 科技' /tmp/channels.html; ! grep -Fq '频道 旅行生活' /tmp/channels.html; ! grep -Fq '网址分类' /tmp/channels.html
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/watch.php?category=${PRIVATE_CAT}" -o /tmp/watch.html
          grep -F '内容类型' /tmp/watch.html; grep -F '影视 犯罪片' /tmp/watch.html; ! grep -Fq '网址分类' /tmp/watch.html
          curl -fsS -b "$COOKIE" "http://127.0.0.1:${PORT}/topics.php?category=${PRIVATE_CAT}" -o /tmp/topics.html
          grep -F '专题分类' /tmp/topics.html; grep -F '专题 赚钱研究' /tmp/topics.html; ! grep -Fq '网址分类' /tmp/topics.html
          CODE=$(curl -sS -o /tmp/channel-public.json -w '%{http_code}' -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-visibility-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode "ids=[$CHANNEL]" --data-urlencode 'visibility=public');test "$CODE" = 200;jq -e '.ok==true and .visibility=="public"' /tmp/channel-public.json >/dev/null
          CODE=$(curl -sS -o /tmp/start-public.json -w '%{http_code}' -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-visibility-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode "ids=[$START_PRIVATE]" --data-urlencode 'visibility=public');test "$CODE" = 422;jq -e '.ok==false' /tmp/start-public.json >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/channels.php" -o /tmp/channels-public.html;grep -F '频道 旅行生活' /tmp/channels-public.html
          echo P01_DOMAIN_HTTP=PASS

      - name: Real browser cover compression and UX gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,struct,zlib
          w,h=1600,1000
          raw=bytearray()
          rng=os.urandom
          for _ in range(h):raw.extend(b'\x00'+rng(w*3))
          def chunk(t,d):
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),6))+chunk(b'IEND',b'')
          open('/tmp/p01-domain-large.png','wb').write(png)
          print(len(png))
          PY
          mkdir -p /tmp/p01-domain-browser && cd /tmp/p01-domain-browser
          npm init -y >/dev/null 2>&1;npm install playwright@1.55.0 --no-save >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat >gate.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='http://127.0.0.1:18429';const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1440,height:900}});const login=await ctx.request.post(base+'/api.php?action=login',{data:{password:'P01Domain!2026'}});if(!login.ok())throw new Error('login');const p=await ctx.newPage();
          await p.goto(base+'/topics.php?scope=public',{waitUntil:'networkidle'});if(await p.getByText('专题',{exact:true}).count()<1)throw new Error('Chinese topic label missing');if(await p.getByText('专题分类',{exact:true}).count()<1)throw new Error('topic classification missing');if(await p.getByText('网址分类',{exact:true}).count()>0)throw new Error('Start categories leaked into topics');
          await p.locator('[data-open-add]').click();const f=p.locator('[data-add-form]');if(await f.locator('select[name="surface"]').inputValue()!=='topics')throw new Error('topic add context');await f.locator('input[name="url"]').fill('https://generated-topic.example.com');await f.locator('input[name="title"]').fill('浏览器压缩专题');await f.locator('input[name="resource_kind"]').fill('学习决策');await f.locator('input[name="tags"]').fill('AI, 对比');await f.locator('input[name="cover"]').setInputFiles('/tmp/p01-domain-large.png');await f.locator('button[type="submit"]:not([data-add-continue])').click();await p.waitForLoadState('networkidle');await p.getByText('浏览器压缩专题',{exact:true}).waitFor();
          const card=p.locator('.vf-topic-card').filter({hasText:'浏览器压缩专题'});if(await card.count()!==1)throw new Error('topic card missing');const src=await card.locator('.vf-topic-cover img').getAttribute('src');if(!src?.includes('resource-cover.php'))throw new Error('cover not rendered');await p.screenshot({path:'/tmp/p01-v229-topics-desktop.png',fullPage:true});
          await p.setViewportSize({width:390,height:844});await p.goto(base+'/channels.php?scope=public',{waitUntil:'networkidle'});if(await p.getByText('频道分类',{exact:true}).count()<1)throw new Error('mobile channel classification');if(await p.getByText('网址分类',{exact:true}).count()>0)throw new Error('mobile category leak');const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);await p.screenshot({path:'/tmp/p01-v229-channel-mobile.png',fullPage:true});await browser.close();console.log('P01_DOMAIN_BROWSER=PASS');
          JS
          node gate.mjs | grep -Fx P01_DOMAIN_BROWSER=PASS
          cat >/tmp/p01-domain-cover-check.php <<'PHP'
          <?php
          declare(strict_types=1);$root=getenv('ROOT');require $root.'/app/bootstrap.php';$db=vf_db();$row=$db->query("SELECT raf.*,l.id,l.is_private FROM resource_asset_files raf JOIN links l ON l.id=raf.link_id WHERE l.title='浏览器压缩专题' AND raf.asset_kind='cover'")->fetch(PDO::FETCH_ASSOC);if(!$row)throw new RuntimeException('cover row missing');if((int)$row['byte_size']>1200*1024)throw new RuntimeException('cover too large');if((int)$row['width']>960||(int)$row['height']>960)throw new RuntimeException('cover dimensions not compressed');if(!in_array($row['mime_type'],['image/webp','image/jpeg'],true))throw new RuntimeException('cover not browser compressed');if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')throw new RuntimeException('integrity');if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))throw new RuntimeException('fk');echo 'P01_DOMAIN_COVER_DB=PASS'.PHP_EOL;
          PHP
          ROOT="$ROOT" php /tmp/p01-domain-cover-check.php | grep -Fx P01_DOMAIN_COVER_DB=PASS
          ID=$(ROOT="$ROOT" php -r 'require getenv("ROOT")."/app/bootstrap.php";echo (int)vf_db()->query("SELECT id FROM links WHERE title=\"浏览器压缩专题\"")->fetchColumn();')
          CODE=$(curl -sS -o /tmp/public-cover.bin -w '%{http_code}' "http://127.0.0.1:${PORT}/resource-cover.php?id=${ID}");test "$CODE" = 200;test -s /tmp/public-cover.bin
          echo P01_DOMAIN_COVER_PUBLIC=PASS

      - name: Final verdict and evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo P01_V229_DOMAIN_MEDIA_GATE=PASS
          mkdir -p /tmp/p01-domain-evidence
          cp /tmp/p01-domain-verify.txt /tmp/p01-v229-topics-desktop.png /tmp/p01-v229-channel-mobile.png /tmp/p01-domain-evidence/
          printf '%s\n' "SOURCE_SHA=$SOURCE_SHA" "VERSION=2.29.0" "SCHEMA=2026082901" "DOMAIN_ISOLATION=PASS" "FAVICON=PASS" "COVER_BROWSER_COMPRESSION=PASS" "PRIVACY=PASS" "SQLITE=PASS" > /tmp/p01-domain-evidence/verdict.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-domain-media-evidence
          path: /tmp/p01-domain-evidence
          if-no-files-found: error
          retention-days: 14
