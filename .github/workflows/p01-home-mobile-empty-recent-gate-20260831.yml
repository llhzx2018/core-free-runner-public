name: P01 Home Mobile Empty Recent Density Gate
on:
  push:
    branches: [task/p01-home-mobile-empty-recent-gate-20260831]
    paths: [.github/workflows/p01-home-mobile-empty-recent-gate-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 8595da6ca62b900a577618abaf5cce4514a7cd56
      TREE: 6e0c0b8d695cae1dd8897b47eb9680857a18d53b
      BASE: f083a7f96714896f2f1d9d4f28b0513ad94e9df5
      ROOT: /tmp/p01-home-empty-recent
      EVID: /tmp/p01-home-empty-recent-evid
      PORT: '18421'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and one-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD)" = src/assets/workspace-home.css
          test "$(cat product/VERSION)" = '2.35.0'
          grep -F 'mobile Home empty recent density' product/src/assets/workspace-home.css >/dev/null
          echo P01_HOME_EMPTY_RECENT_SOURCE_FENCE=PASS
      - name: Fresh Home fixture with favorites and no recent use
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-home-empty.cookies
          mkdir -p "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-home-empty.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-home-empty.cookies -b /tmp/p01-home-empty.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-home-empty-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-home-empty-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-home-empty.cookies -b /tmp/p01-home-empty.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Home Empty Recent Gate' --data-urlencode 'admin_password=HomeEmpty2026' --data-urlencode 'admin_password_confirm=HomeEmpty2026' -o /tmp/p01-home-empty-post.html
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          cat >/tmp/p01-home-empty-seed.php <<'PHP'
          <?php
          require '/tmp/p01-home-empty-recent/app/bootstrap.php';
          require_once '/tmp/p01-home-empty-recent/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'常用资源','description'=>'','is_private'=>false]);
          foreach(['常用导航','技术频道','独立专题'] as $i=>$title){
            $x=$r->saveLink(null,['category_id'=>$c,'title'=>$title,'url'=>'https://example.com/home-empty-'.$i,'description'=>'首页移动密度验证','tags'=>'首页,验证','is_private'=>false,'is_favorite'=>true],'manual');
            if($i===1)$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'技术','surface_note'=>'长期订阅']);
            if($i===2)$s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>'指南','surface_note'=>'长期维护']);
          }
          echo "P01_HOME_EMPTY_RECENT_SEED=PASS\n";
          PHP
          php /tmp/p01-home-empty-seed.php | grep -Fx P01_HOME_EMPTY_RECENT_SEED=PASS
      - name: Chromium empty density and non-empty preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-home-empty-pw && cd /tmp/p01-home-empty-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:390,height:844}});
            const login=await c.request.post('http://127.0.0.1:18421/api.php?action=login',{data:{password:'HomeEmpty2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const p=await c.newPage(),metrics={};
            const read=()=>p.evaluate(()=>{
              const section=document.querySelector('.vf-home-main-column>.vf-home-section:first-child'),empty=section?.querySelector('.vf-home-empty'),fav=document.querySelectorAll('.vf-home-main-column>.vf-home-section')[1],list=section?.querySelector('.vf-home-recent-list');
              const er=empty?.getBoundingClientRect(),sr=section?.getBoundingClientRect(),fr=fav?.getBoundingClientRect(),cs=empty?getComputedStyle(empty):null;
              return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,empty:!!empty,list:!!list,emptyHeight:er?Math.round(er.height):0,sectionHeight:sr?Math.round(sr.height):0,favoriteTop:fr?Math.round(fr.top):0,display:cs?.display||'',gridColumns:cs?.gridTemplateColumns||'',textAlign:cs?.textAlign||'',recentItems:section?.querySelectorAll('.vf-home-recent-item').length||0};
            });
            await p.goto('http://127.0.0.1:18421/home.php',{waitUntil:'networkidle'});await p.waitForTimeout(160);
            for(const theme of ['light','dark']){
              await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(80);const m=await read();
              if(m.overflow>1||!m.empty||m.list||m.emptyHeight>58||m.sectionHeight>150||m.display!=='grid'||m.textAlign!=='left')throw Error(`empty-${theme} ${JSON.stringify(m)}`);
              metrics[`empty-${theme}`]=m;await p.screenshot({path:`${process.env.EVID}/home-empty-390-${theme}.png`,fullPage:true});
            }
            const mark=await c.request.post('http://127.0.0.1:18421/api.php?action=track_open',{data:{id:1}});if(!mark.ok())throw Error('track-open-http');
            await p.goto('http://127.0.0.1:18421/home.php',{waitUntil:'networkidle'});await p.waitForTimeout(140);
            for(const theme of ['light','dark']){
              await p.evaluate(t=>document.documentElement.setAttribute('data-theme',t),theme);await p.waitForTimeout(80);const m=await read();
              if(m.overflow>1||m.empty||!m.list||m.recentItems<1)throw Error(`recent-${theme} ${JSON.stringify(m)}`);
              metrics[`recent-${theme}`]=m;await p.screenshot({path:`${process.env.EVID}/home-recent-390-${theme}.png`,fullPage:true});
            }
            await p.setViewportSize({width:1440,height:900});await p.goto('http://127.0.0.1:18421/home.php',{waitUntil:'networkidle'});await p.waitForTimeout(120);
            const desktop=await read();if(desktop.overflow>1||desktop.empty||desktop.recentItems<1)throw Error(`desktop ${JSON.stringify(desktop)}`);metrics.desktop=desktop;await p.screenshot({path:`${process.env.EVID}/home-recent-1440-light.png`,fullPage:true});
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));fs.writeFileSync(process.env.EVID+'/verdict.txt',`P01_HOME_EMPTY_RECENT_DENSITY=PASS\nSOURCE=${process.env.SOURCE}\n`);await b.close();console.log('P01_HOME_EMPTY_RECENT_DENSITY=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_HOME_EMPTY_RECENT_DENSITY=PASS "$EVID/result.txt"
      - name: Regression and SQLite through application authority
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface-verify.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          cat >/tmp/p01-home-empty-dbcheck.php <<'PHP'
          <?php
          require '/tmp/p01-home-empty-recent/app/bootstrap.php';$db=vf_db();if((string)$db->query('PRAGMA integrity_check')->fetchColumn()!=='ok')exit(2);if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_HOME_EMPTY_RECENT_SQLITE=PASS\n";
          PHP
          php /tmp/p01-home-empty-dbcheck.php | tee "$EVID/sqlite.txt" | grep -Fx P01_HOME_EMPTY_RECENT_SQLITE=PASS
          echo P01_HOME_EMPTY_RECENT_REGRESSION=PASS | tee "$EVID/regression.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-home-mobile-empty-recent-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-home-empty.pid 2>/dev/null)" 2>/dev/null || true
