name: TEMP S01-C01 v1.35.10 Formal Release
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-c01-v13510-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: cae5a32961c067d1336635610154b2f009a6bd03
      DEVELOP_SHA: 63eb30f4250951e9a2c3dfe0a43c7f18af6e1f81
      ASSET_BYTES: '1776173'
      ASSET_SHA: 2dcf9ab10e29c2f5fac6274e53c7a76e32e1c279e95760f41070bc535bfd2e64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Verify promoted source and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          main="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-theme/branches/main | jq -r '.commit.sha')"
          develop="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-theme/branches/develop | jq -r '.commit.sha')"
          test "$main" = "$SOURCE_SHA"
          test "$develop" = "$DEVELOP_SHA"
          ! gh release view v1.35.10 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1
          echo SOURCE_AND_RELEASE_ABSENCE=PASS
      - name: Rebuild exact Candidate artifact
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          files=[]
          for p in Path('theme/src').rglob('*'):
              if p.is_file() and not p.is_symlink(): files.append((p.relative_to('theme/src').as_posix(),p.read_bytes()))
          files.sort(key=lambda x:x[0])
          z=Path('/tmp/release/vf-tools-theme_V1.35.10.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in files:
                  i=zipfile.ZipInfo('vf-tools-theme/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          print(z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
          test "$(stat -c '%s' /tmp/release/vf-tools-theme_V1.35.10.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/release/vf-tools-theme_V1.35.10.zip|awk '{print $1}')" = "$ASSET_SHA"
          unzip -tq /tmp/release/vf-tools-theme_V1.35.10.zip >/dev/null
          php theme/tests/private-asset-bulk-bridge-contract.php
          echo EXACT_ARTIFACT_AND_BRIDGE=PASS
      - name: Create formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v1.35.10 /tmp/release/vf-tools-theme_V1.35.10.zip \
            --repo llhzx2018/vf-tools-theme \
            --target "$SOURCE_SHA" \
            --title 'VF Tools Theme v1.35.10' \
            --notes 'S01-C01 Private Asset Bulk Bridge V1. Fixes WordPress Theme_Upgrader AJAX/bulk contexts that omit hook_extra.type: exact vf-tools-theme requests are normalized to type=theme and delegated to the authenticated private GitHub Release Asset download path. Foreign theme/host/path contexts remain fail-closed. Retains 60-minute automatic manifest cache and immediate OWNER manual refresh. Theme develop remains intentionally untouched because it diverges from main. No Production activation or content/data write is performed by publication.'
      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          j="$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.10)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$SOURCE_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.10.zip")|.size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.10.zip")|.digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo PASS_THEME_V13510_FORMAL_RELEASE
