name: P01 V2.36.3 Strict Fresh R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths:
      - .github/workflows/p01-v2363-strict-fresh-r2-20260901.yml
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FORMAL_RUN: '33502799058'
      FORMAL_ARTIFACT: p01-v2363-formal-artifacts-r2-33502799058
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      FORMAL_RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      SCHEMA: '2026082901'
      FULL_SHA: 6580700355c8a0127b030f6217a106260f0d8867fd3c3fd6db04fbd048fe46df
      UPDATE_SHA: 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
      REPAIR_SHA: b76504cd122ab333815d44140ac7a1420451ed03cf63ced7013fc879044be231
      DOWNLOAD: /tmp/p01-v2363-strict-r2-download
      FRESH: /tmp/p01-v2363-strict-r2-fresh
      EVID: /tmp/p01-v2363-strict-r2-evidence
      COOKIE: /tmp/p01-v2363-strict-r2.cookies
      PORT: '18593'
      ADMIN_PASS: V2363StrictFreshR2OneFrontend
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Checkout exact runner harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 706ac68b70ce603f6074e53bbe26ac13e453d812
          path: runner
      - name: Compile strict browser harness
        run: python -m py_compile runner/scripts/p01_v2363_strict_browser.py
      - name: Formal bytes fresh install zero data and seed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID/screens"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.3-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          test "$(stat -c%s "$ART_DIR/VF-Start-V2.36.3-FULL.zip")" = 587176
          test "$(stat -c%s "$ART_DIR/VF_Start_V2.36.3_UPDATE.zip")" = 1236976
          test "$(stat -c%s "$ART_DIR/repair-v2.36.3.php")" = 3591557
          test "$(sha256sum "$ART_DIR/VF-Start-V2.36.3-FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$ART_DIR/VF_Start_V2.36.3_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ART_DIR/repair-v2.36.3.php"|awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .formal_tree=="32e8afdd6d7cdd338c62fdafaedb200b127ca881" and .runtime_tree=="820724b585cb59864211f77c4fb33537b2345029" and .schema=="2026082901" and .migration==null and .added==[] and .removed==[] and (.changed|length)==7' "$ART_DIR/P01-V2.36.3-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.3
          grep -Fx "define('VF_VERSION', '2.36.3');" "$FRESH/app/bootstrap.php" >/dev/null
          grep -F "require_once __DIR__ . '/app/FunctionalWorkspace.php';" "$FRESH/index.php" >/dev/null
          grep -F "require __DIR__ . '/index.php';" "$FRESH/start.php" >/dev/null
          grep -F 'vf_security_headers(true);' "$FRESH/index.php" >/dev/null
          grep -F 'background:var(--ws-bg)' "$FRESH/assets/workspace-domain-nav.css" >/dev/null
          ! grep -F 'frontend-legacy.css' "$FRESH/index.php" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >"$EVID/js-syntax.txt"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2363-strict-r2.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2363 Strict Fresh R2' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/data.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';require getenv('ROOT').'/app/SurfaceRepository.php';$d=vf_db();
          foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}
          $r=new VfRepository($d);$s=new VfSurfaceRepository($d);$cat=$r->createCategory(['name'=>'StrictFresh','description'=>'','icon'=>'','is_private'=>0,'sort_order'=>0]);
          $save=function($t,$u,$p)use($r,$cat){return (int)$r->saveLink(null,['category_id'=>$cat,'title'=>$t,'url'=>$u,'description'=>'','is_private'=>$p],'manual')['id'];};
          $save('严格公开导航','https://example.com/strict-public',0);$save('严格私人导航','https://example.com/strict-private',1);
          for($i=1;$i<=60;$i++)$save('严格滚动资源 '.$i,'https://example.com/strict-scroll-'.$i,0);
          $c1=$save('严格公开频道','https://www.youtube.com/@strict-public',0);$c2=$save('严格私人频道','https://www.youtube.com/@strict-private',1);
          $s->upsertProfile($c1,['surface'=>'channels','resource_kind'=>'频道']);$s->upsertProfile($c2,['surface'=>'channels','resource_kind'=>'频道']);
          if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2363_STRICT_R2_DATA=PASS\n";
          PHP
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Packaged ONE FRONTEND browser gate R2
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile runner/scripts/p01_v2363_strict_browser.py
          python runner/scripts/p01_v2363_strict_browser.py | tee "$EVID/browser-r2.txt"
          grep -Fx P01_V2363_STRICT_BROWSER_R2=PASS "$EVID/browser-r2.txt"
      - name: Final SQLite and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$FRESH" EVID="$EVID" php <<'PHP'
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();if((string)$d->query('PRAGMA integrity_check')->fetchColumn()!=='ok')exit(1);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(2);file_put_contents(getenv('EVID').'/db-final.txt',"INTEGRITY=ok\nFK=0\n");
          PHP
          grep -Fx P01_V2363_STRICT_R2_DATA=PASS "$EVID/data.txt"
          grep -Fx P01_V2363_STRICT_BROWSER_R2=PASS "$EVID/browser-r2.txt"
          printf 'P01_V2363_STRICT_FRESH_R2=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nFORMAL_RUN=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nONE_FRONTEND_390_1440=PASS\nSTICKY=PASS\nCSP=PASS\nSEO=PASS\nPRIVACY=PASS\nSQLITE=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$FORMAL_RUN" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2363-strict-fresh-r2-${{ github.run_id }}
          path: /tmp/p01-v2363-strict-r2-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2363-strict-r2.pid 2>/dev/null)" 2>/dev/null || true
