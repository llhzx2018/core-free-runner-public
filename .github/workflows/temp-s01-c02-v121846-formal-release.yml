name: TEMP S01-C02 Ops 1.21.846 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121846-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: b6745c09ecaa7a27deed3c970f683d86425fcc35
      TREE: c7338359ba9db173e57749ba6bbbc94ec7ef0491
      TAG: v1.21.846
      ASSET: vf-tools-ops_V1.21.846.zip
      BYTES: '3313202'
      SHA256: a847d50c2b8d865f3ea845646f5e4db37fa1203b2322781c6d67190dc75e54f7
      FILES: '928'
      FP: 150f64b642066f24895dc56286cb3ae1ccff755313196c23429c2519b6d94f64
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.846
          php ops/.github/phase3/v121846-structural-final-audit-retry.php | grep -Fxq PASS_V121846_STRUCTURAL_FINAL_AUDIT_RETRY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.846 replaces fragile Final Audit failure-text matching with a structural contamination proof on the current Production V1.21.845 boundary.

          - Focused Gate 34010596457 PASS on exact source b6745c09ecaa7a27deed3c970f683d86425fcc35 / tree c7338359ba9db173e57749ba6bbbc94ec7ef0491.
          - Deterministic Artifact Identity 34010618367 PASS.
          - Production V1.21.845 is current before OWNER upgrade with reusable Static Source, manualSourceUploadRequired=false, candidatePackageReady=false, finalOnlinePass=NO and zero internal-link failure leaves.
          - V1.21.845 correctly failed closed at runtime_suffix_final_audit_boundary_changed. Source tracing proved that Async Job load may reconstruct terminal audit failures from mutable release-record candidate_audit, cf_upload_check_summary and candidate_async_error; comparing the reconstructed leaf byte-for-byte was therefore the wrong authority layer.
          - Production privacy-safe classifiers independently prove exactly one current failure: other -> candidate_package_contract -> candidate_package_contract_unclassified, with all other candidate-package subclasses zero.
          - V1.21.846 does not widen punctuation or substring matching. It requires the Candidate's sole failure and the persistent async_job_sync_record_failure blocker's sole failure to be byte-identical, and requires both the direct classifier chain and the public classifier snapshot to match the exact structural class above.
          - All existing safety gates remain required: trusted DONE inspection, immutable Source SHA, exact inspection lineage, terminal Candidate at impossible current_stage=1 with failed final_decision, durable-kick terminal boundary, release-record active/candidate pointers, record Source hashes and blocker job identity.
          - Only after proof does it rebind to the trusted inspect-only job, rely on the V1.21.844 PARTIAL record-isolation filter to verify no terminal carry, create a distinct RUNNING Stage-0 Candidate with zero inherited audit failures and exact Source SHA, then delegate bounded execution to the existing V1.21.834 worker.
          - Static Source is not uploaded or mutated; the old failed Candidate is not reset or mutated; Final Audit, candidatePackageReady, DNS and finalOnline are never forced.
          - M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid and content governance remain untouched.
          - Asset vf-tools-ops_V1.21.846.zip; 3313202 bytes; SHA256 a847d50c2b8d865f3ea845646f5e4db37fa1203b2322781c6d67190dc75e54f7; runtime files 928; fingerprint 150f64b642066f24895dc56286cb3ae1ccff755313196c23429c2519b6d94f64.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.846' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121846=PASS
