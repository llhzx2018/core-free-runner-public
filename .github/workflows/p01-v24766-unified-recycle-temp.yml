name: p01-v24766-unified-recycle-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24766-unified-recycle-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 5ca5a25bc16c7cccc2a358c04189b2ea461db456
      STABLE_SHA: 617f21d753d43fe7bc4e89f24aeb287f2a9d57af
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact candidate and stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in candidate stable; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C candidate fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C stable fetch -q --depth 1 origin "${STABLE_SHA}"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.66"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.66"
          echo P01_V24766_UNIFIED_RECYCLE_EXACT_SOURCE=PASS

      - name: Verify presentation-only release surface
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only "$STABLE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/allowed.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          src/assets/admin-consolidation.css
          src/assets/recycle-bin.js
          src/recycle-bin.php
          tests/unit/admin_recycle_bin_page6_polish_contract.php
          tests/unit/admin_recycle_bin_r11_contract.php
          tests/unit/engineering_consistency_r80_contract.php
          tests/unit/recycle_archive_unified_view_contract.php
          tests/unit/recycle_mobile_card_labels_contract.php
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt
          ! git -C candidate diff "$STABLE_SHA" "$TARGET_SHA" -- src/api.php src/app/DataSafety.php | grep -q .
          echo P01_V24766_UNIFIED_RECYCLE_PRESENTATION_ONLY=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/recycle-bin.php >/dev/null
          node --check candidate/src/assets/recycle-bin.js
          tests=(
            tests/unit/recycle_archive_unified_view_contract.php
            tests/unit/admin_recycle_bin_page6_polish_contract.php
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/recycle_bin_admin_return_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "candidate/${t}" >/dev/null
            php "candidate/${t}"
          done
          echo P01_V24766_UNIFIED_RECYCLE_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V24766_UNIFIED_RECYCLE_CANONICAL=PASS
