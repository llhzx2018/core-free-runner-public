name: P07 M03 D05 isolated exact-source source QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d05-source-qa-20261115.yml'
permissions:
  contents: read
jobs:
  source-qa:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public harness identity only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact-private-P07 checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5218267210ebdffb5a6d04aaeb12ed6869e4bb00
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-d05
      - name: D05 source, module and UX tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-d05 rev-parse HEAD)" = 5218267210ebdffb5a6d04aaeb12ed6869e4bb00
          cd .p07-private-d05
          python3 -B -m unittest discover -s tests -p test_p07_m03_db_conversion_plan.py -v
          python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：拆分模块安全只读路线' \
            --changed-file lib/db_engine_conversion.py \
            --changed-file bin/vfops-db-convert-plan.py \
            --changed-file scripts/check_p07_modules.py \
            --affected P07-M03-D05 --shared-reason '新子模块登记所需校验器适配'
          python3 -B scripts/check_p07_terminal_ux.py
          echo P07_M03_D05_EXACT_SOURCE_QA=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-d05
          test ! -e .p07-private-d05
          echo P07_M03_D05_PRIVATE_SOURCE_REMOVED=YES
