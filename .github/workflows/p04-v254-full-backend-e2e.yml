name: P04 V2.5.4 Full Backend Browser E2E

on:
  push:
    paths:
      - '.github/workflows/p04-v254-full-backend-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Runner
        uses: actions/checkout@v4

      - name: Checkout P04 V2.5.4 working source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: vf-infra

      - name: Install real runtime and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-zip sqlite3
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
          php -v
          node --version
          sqlite3 --version

      - name: Static product and scope gates
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '2.5.4'
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = '14'
          git diff --exit-code 68fd396a45ba1eaea34db5ac15cce42791965e49 -- database/migrations
          git diff --exit-code 68fd396a45ba1eaea34db5ac15cce42791965e49 -- \
            src/app/Core/Update/UpdateContract.php \
            src/app/Core/Update/UpdateManifestService.php \
            src/app/Core/Update/UpdateRepositoryClient.php \
            src/app/Core/Update/OnlineUpdateService.php \
            src/app/Core/MaintenanceUpdateService.php
          changed="$(git diff --name-only 68fd396a45ba1eaea34db5ac15cce42791965e49...HEAD)"
          printf '%s\n' "$changed" > "$RUNNER_TEMP/p04-v254-changed.txt"
          if printf '%s\n' "$changed" | grep -E '^src/app/Core/(Provider|Domain|AssetQuery|Billing|Rdap|Cron|Credential|Compute|Dns)' | grep -v '^src/app/Core/Update/'; then
            echo 'BUSINESS_CORE_SCOPE_DRIFT=FAIL'
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '^database/migrations/'; then
            echo 'SCHEMA_MIGRATION_DRIFT=FAIL'
            exit 1
          fi
          test "$(stat -c%s public/assets/v254-ui.js)" -lt 50000
          test "$(stat -c%s public/assets/v254-ui.css)" -lt 50000
          ! grep -R --line-number "unsafe-inline" public/index.php public/assets/v254-ui.* public/login.php public/maintenance.php
          ! grep -R --line-number -E 'window\.confirm\(|[^A-Za-z]confirm\(' public/assets/v254-ui.js
          php -l public/api.php
          php -l public/index.php
          php -l public/login.php
          php -l public/maintenance.php
          php -l src/app/Core/Update/UpdateHistoryService.php
          node --check public/assets/app.js
          node --check public/assets/v254-ui.js
          python3 -m py_compile scripts/build-release-tree.py
          git diff --check 68fd396a45ba1eaea34db5ac15cce42791965e49...HEAD
          echo 'STATIC_SCOPE_GATE=PASS'

      - name: Build exact V2.5.4 isolated runtime
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/p04-v254-site"
          mkdir -p "$SITE"
          python3 scripts/build-release-tree.py "$SITE/htdocs" | tee "$RUNNER_TEMP/p04-v254-build.json"
          test "$(cat "$SITE/htdocs/VERSION.txt")" = '2.5.4'
          python3 - <<'PY'
          import json, os, pathlib
          site=pathlib.Path(os.environ['RUNNER_TEMP'])/'p04-v254-site'/'htdocs'
          m=json.loads((site/'release-manifest.json').read_text())
          assert m['version']=='2.5.4'
          assert m['target_schema']==14
          assert m['release_kind']=='maintenance_release'
          assert m['phase_status']=='CANDIDATE'
          paths={x['path'] for x in m['files']}
          assert 'assets/v254-ui.css' in paths and 'assets/v254-ui.js' in paths
          print('RUNTIME_FILE_COUNT='+str(m['file_count']+1))
          print('RUNTIME_FINGERPRINT='+m['source_fingerprint'])
          PY
          find "$SITE/htdocs" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p04-v254-php-syntax.txt
          echo 'RUNTIME_BUILD_GATE=PASS'

      - name: Start isolated VF Infra runtime
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          PORT="$(python3 - <<'PY'
          import socket
          s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()
          PY
          )"
          echo "P04_PORT=$PORT" >> "$GITHUB_ENV"
          echo "BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          echo "DB_PATH=$RUNNER_TEMP/p04-v254-site/.vfinfra-data/database/vf-domain.sqlite" >> "$GITHUB_ENV"
          echo "SCREENSHOT_DIR=$RUNNER_TEMP/p04-v254-browser-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/p04-v254-browser-evidence"
          export VF_PRIVATE_READ_TOKEN
          php -S "127.0.0.1:$PORT" -t "$RUNNER_TEMP/p04-v254-site/htdocs" >"$RUNNER_TEMP/p04-v254-php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/p04-v254-php-server.pid"
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null; then break; fi
            sleep .25
          done
          curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null
          echo 'ISOLATED_RUNTIME_BOOT=PASS'

      - name: Full backend Chromium E2E and screenshots
        shell: bash
        env:
          ADMIN_PASSWORD: VfInfraE2E2549
        run: |
          set -euo pipefail
          node scripts/p04-v254-browser-e2e.mjs
          test -f "$SCREENSHOT_DIR/1440-dashboard.png"
          test -f "$SCREENSHOT_DIR/settings-update.png"
          test -f "$SCREENSHOT_DIR/responsive-1024-domains.png"
          test -f "$SCREENSHOT_DIR/state-full-error.png"
          test -f "$SCREENSHOT_DIR/state-partial-error.png"
          echo 'BROWSER_SCREENSHOT_GATE=PASS'

      - name: Runtime regression and privacy gate
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          DB="$DB_PATH"
          test -f "$DB"
          test "$(sqlite3 "$DB" 'PRAGMA integrity_check;')" = 'ok'
          test -z "$(sqlite3 "$DB" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB" "SELECT COALESCE(MAX(version),0) FROM schema_migrations WHERE status='success';")" = '14'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM domains WHERE archived_at IS NULL;")" = '65'
          test "$(sqlite3 "$DB" "SELECT COUNT(*) FROM update_history;")" = '2'
          ! grep -R --binary-files=without-match -E 'VF_PRIVATE_READ_TOKEN|VF_RELEASE_WRITE_TOKEN|ghp_[A-Za-z0-9]|github_pat_' "$RUNNER_TEMP/p04-v254-browser-evidence" "$RUNNER_TEMP/p04-v254-site/htdocs"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p04-v254-site'/'htdocs'
          m=json.loads((root/'release-manifest.json').read_text())
          forbidden=['config.php','.env','database/vf-domain.sqlite','backups/','logs/','cache/','sessions/']
          paths=[x['path'] for x in m['files']]
          for f in forbidden:
              assert not any(p==f or p.startswith(f) for p in paths), f
          out={
            'version':m['version'],'schema':m['target_schema'],'runtime_file_count':m['file_count']+1,
            'source_fingerprint':m['source_fingerprint'],'release_kind':m['release_kind'],
            'browser_e2e':'PASS','schema_migration':'NONE','production':'UNCHANGED_2.5.3'
          }
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'p04-v254-candidate-evidence.json'
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
          echo 'REGRESSION_PRIVACY_GATE=PASS'

      - name: Upload browser and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04_V254_BROWSER_E2E_EVIDENCE
          path: |
            ${{ runner.temp }}/p04-v254-browser-evidence
            ${{ runner.temp }}/p04-v254-candidate-evidence.json
            ${{ runner.temp }}/p04-v254-build.json
            ${{ runner.temp }}/p04-v254-changed.txt
            ${{ runner.temp }}/p04-v254-php-server.log
            /tmp/p04-v254-php-syntax.txt
          if-no-files-found: warn
          retention-days: 30
