name: P01 V2.47.453 independent core-updates channel gate (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247453-channel-once.yml'

permissions:
  contents: read

jobs:
  channel-proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247453-channel-readback-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact core-updates PR 882 SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 442e3c0cd46012c2c4ac2c0fa42995bc50db3775
          path: channel
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Exact commit one-file manifest and upgrade-safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = 442e3c0cd46012c2c4ac2c0fa42995bc50db3775
          test "$(git -C channel diff-tree --no-commit-id --name-only -r HEAD)" = projects/P01.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('channel/projects/P01.json').read_text())
          expected={
            'schema_version':'1.0','project_id':'P01','component_id':'APP',
            'enabled':True,'current_version':'2.47.452','target_version':'2.47.453',
            'update_type':'ATOMIC','from_versions':['2.47.452'],
            'schema_from':'2026102201','schema_to':'2026102201',
            'repository':'llhzx2018/vf-start','release_tag':'v2.47.453',
            'release_id':423184886,
            'product_identity':'3e73804b553fb6a501c0a8dc00417b0a223aa663',
            'asset_name':'VF_Start_V2.47.453_UPDATE.zip','asset_bytes':2990867,
            'asset_sha256':'d320b8156adf1a9bdad4dff3062866b9ca1fe4dc5a6fb7000e9ed931b6705f86',
            'backup_required':True,'rollback_supported':True,
            'minimum_php':'8.0.0','released_at':'2026-10-25T06:19:09Z'
          }
          for key,value in expected.items():
              assert m.get(key)==value, (key,m.get(key),value)
          print('P01_453_CHANNEL_EXACT_MANIFEST_AND_SAFETY=PASS')
          PY

      - name: Canonical Update Core manifest contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 channel/scripts/check_manifest_contract.py > /tmp/p01-453-manifest-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p01-453-manifest-audit.json'))
          assert r['status']=='PASS', r
          p=[v for v in r['results'] if v['path']=='projects/P01.json']
          assert len(p)==1 and not p[0]['failures'], p
          print('CORE_UPDATES_ALL_MANIFEST_CONTRACTS=PASS count='+str(r['manifest_count']))
          PY

      - name: Native channel PHP syntax and Update Core regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          find channel/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/p01-453-channel-php-lint.txt
          echo CORE_UPDATES_PHP_LINT=PASS
          (cd channel && php update-core/php/tests/run.php)
          echo CORE_UPDATES_PHP_REGRESSION=PASS

      - name: Exact remote Release Tag and Asset bytes digest readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.453 > /tmp/p01-453-release.json
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.453 > /tmp/p01-453-tag.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p01-453-release.json'))
          t=json.load(open('/tmp/p01-453-tag.json'))
          assert r['tag_name']=='v2.47.453' and r['draft'] is False and r['prerelease'] is False
          assert r['id']==423184886
          assert t['object']['sha']=='3e73804b553fb6a501c0a8dc00417b0a223aa663'
          a={x['name']:x for x in r['assets']}
          for name,size,sha in [
            ('VF_Start_V2.47.453_UPDATE.zip',2990867,'d320b8156adf1a9bdad4dff3062866b9ca1fe4dc5a6fb7000e9ed931b6705f86'),
            ('VF-Start-V2.47.453-FULL.zip',1371748,'1d3b94b64633252027e61ed3cbfc67eb58e6d4b228ca91fda1139aa95823a17e')
          ]:
              assert a[name]['size']==size
              assert a[name]['digest']=='sha256:'+sha
          print('P01_453_REMOTE_TAG_RELEASE_ASSETS_METADATA=PASS')
          PY
          mkdir -p /tmp/p01-453-asset-readback
          gh release download v2.47.453 -R llhzx2018/vf-start -D /tmp/p01-453-asset-readback -p VF_Start_V2.47.453_UPDATE.zip
          test "$(stat -c %s /tmp/p01-453-asset-readback/VF_Start_V2.47.453_UPDATE.zip)" = 2990867
          test "$(sha256sum /tmp/p01-453-asset-readback/VF_Start_V2.47.453_UPDATE.zip | awk '{print $1}')" = d320b8156adf1a9bdad4dff3062866b9ca1fe4dc5a6fb7000e9ed931b6705f86
          unzip -t /tmp/p01-453-asset-readback/VF_Start_V2.47.453_UPDATE.zip >/dev/null
          echo P01_453_REMOTE_UPDATE_BYTES_SHA_AND_ZIP=PASS
