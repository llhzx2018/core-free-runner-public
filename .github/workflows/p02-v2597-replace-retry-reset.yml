name: P02 V2.5.97 Replace Retry Reset

on:
  push:
    branches:
      - run/p02-v2597-replace-retry-reset-20260923
    paths:
      - '.github/workflows/p02-v2597-replace-retry-reset.yml'

permissions:
  contents: read

jobs:
  replace-retry-reset:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 6dff18a317d351d52ed6588d71bf53dd9ba1b734
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source source and unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "6dff18a317d351d52ed6588d71bf53dd9ba1b734"
          test "$(cat VERSION)" = "2.5.97"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node tests/unit/p02_v2597_replace_retry_reset_parity.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2597_REPLACE_RETRY_RESET_SOURCE=PASS
      - name: Maintenance baseline
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2597-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2597-replace-retry-reset
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V2597_REPLACE_RETRY_RESET_MAINTENANCE=PASS
      - name: Focused Chromium replace retry reset
        shell: bash
        working-directory: product
        env:
          VF_UX_FOCUSED_REPLACE_RETRY_RESET: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2597-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
          echo P02_V2597_REPLACE_RETRY_RESET_BROWSER_GATE=PASS
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2597-replace-retry-reset
          path: ${{ runner.temp }}/p02-v2597-replace-retry-reset
          if-no-files-found: ignore
          retention-days: 7
