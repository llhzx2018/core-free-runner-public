name: P01 V247350 Schedule Execution Truth Candidate Proof (Test Only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247350-protection-preflight.yml'

permissions:
  contents: read

jobs:
  candidate-schedule-truth:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private candidate without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: b29727c440482da135aa66f2e82b130c97a54d5f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact untouched main as canonical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: c7acc9757ae7eb29272ca9454b3cdac2fe35746a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: PHP native SQLite, Node and syntax prerequisites
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, gd
          coverage: none
      - name: Bind exact immutable source and prove native SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = b29727c440482da135aa66f2e82b130c97a54d5f
          test "$(git -C stable rev-parse HEAD)" = c7acc9757ae7eb29272ca9454b3cdac2fe35746a
          test "$(tr -d '\r\n' < VERSION)" = '2.47.350'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.47.350'
          grep -F "define('VF_VERSION', '2.47.350');" src/app/bootstrap.php
          php -m | grep -Fx PDO
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi sqlite3
          php -v | head -1
          echo P01_247350_NATIVE_SQLITE_PREREQUISITES=PASS
      - name: PHP and JS syntax exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.php' -type f -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check >/dev/null
          php -l tests/unit/job_schedule_execution_truth_native.php
          echo P01_247350_SOURCE_SYNTAX=PASS
      - name: Isolated SQLite schedule outcome and existing backlog tests
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/job_schedule_execution_truth_native.php
          php tests/unit/admin_scheduled_tasks_center_contract.php
          php tests/unit/jobs_backup_dispatch_truth_native.php
          echo P01_247350_SCHEDULE_EXECUTION_SQLITE_POSITIVE_NEGATIVE=PASS
      - name: Exact source canonical zero debt versus prior main
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_247350_CANONICAL_NONPUBLISHING=PASS
      - name: Confirm immutable safety and no publishing step
        shell: bash
        run: |
          set -Eeuo pipefail
          # Canonical test inventory may create isolated/untracked receipts.
          # Enforce immutability of the exact tracked candidate and baseline,
          # rather than treating harmless untracked receipts as product drift.
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          git -C stable diff --quiet --exit-code
          git -C stable diff --cached --quiet --exit-code
          echo P01_247350_EXACT_TRACKED_SOURCE_UNCHANGED=PASS
          echo P01_247350_TEST_ONLY_NONPUBLISHING=PASS
