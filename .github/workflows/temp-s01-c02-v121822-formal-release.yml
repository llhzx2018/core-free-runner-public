name: TEMP S01-C02 v1.21.822 Formal Release
on:
  push:
    branches: [temp/s01-c02-production-readback-20260904-current]
    paths: ['.github/workflows/temp-s01-c02-v121822-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 711512a2fdbdb1a136dc1e2e60c9dad3052c1a62
      OPS_TREE: 9aa8a999c194a35ad76d431a9e781d1de7b7221f
      CANDIDATE_GATE_RUN: '33962482116'
      CANDIDATE_GATE_HEAD: edd8231f9c965b025a5fc8bd1cc8cec49b8dbb3f
      ASSET_NAME: vf-tools-ops_V1.21.822.zip
      ASSET_BYTES: '3236021'
      ASSET_SHA: 30b2e201c9bb66969fc9269dd7108665c18a6bdc70b384d8de50d41fd8a1b847
      RUNTIME_FILES: '905'
      RUNTIME_FP: d942d3d24148827d9697d1a05a1b8b55a076f5c63536ad688f00a5bb0381c02b
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify promoted source Gate and exact artifact
        shell: bash
        env:
          R: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gate=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_GATE_RUN")
          test "$(jq -r '.conclusion' <<<"$gate")" = success
          test "$(jq -r '.head_sha' <<<"$gate")" = "$CANDIDATE_GATE_HEAD"
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"
          test "$develop" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$OPS_TREE"
          node --check ops/assets/js/admin-publish-zip.js
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          fp=hashlib.sha256()
          for rel,b in runtime: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/vf-tools-ops_V1.21.822.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          assert len(runtime)==905
          assert fp.hexdigest()=='d942d3d24148827d9697d1a05a1b8b55a076f5c63536ad688f00a5bb0381c02b'
          assert z.stat().st_size==3236021
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='30b2e201c9bb66969fc9269dd7108665c18a6bdc70b384d8de50d41fd8a1b847'
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo RELEASE_AUTHORITY=PASS
          echo EXACT_ARTIFACT=PASS
      - name: Create and read back Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.822 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.822 "/tmp/release/$ASSET_NAME" \
            --repo llhzx2018/vf-tools-ops \
            --target "$OPS_SHA" \
            --title 'VF Tools Ops v1.21.822' \
            --notes 'S01-C02 Publish Runtime Generation V1. Fixes the proven stale browser-runtime takeover defect after plugin upgrades and SaaS soft navigation. Route scripts were already cache-busted by filemtime, but the 1.21.821 publish script immediately returned whenever window.vfOpsPublishZipRuntime already existed, allowing an older closure to survive and preventing the new Candidate recovery loop from taking control. v1.21.822 versions the publish runtime generation: the same generation safely rebinds; a stale generation triggers one bounded hard reload of the current admin route, clearing old closures/listeners, after which the current RUNNING Candidate automatically resumes under the current runtime. The existing 1.21.821 bounded transient worker recovery remains intact. Server worker code, per-job execution locks, Candidate Audit, Preflight, Source Inspection, final online freeze, M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid, content and DNS are unchanged. The existing Production RUNNING Candidate job and recovered Source are preserved; no Candidate recreation and no repeat Source ZIP upload are authorized.'
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.822)
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$j")"
          echo "ASSET_ID=$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")"
          echo PASS_V121822_FORMAL_RELEASE
