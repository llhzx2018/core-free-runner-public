name: P08 R142 read-only real stable v0.1.4 update discovery (TEMP reuse)
on:
  pull_request:
    paths: [.github/workflows/p08-r140-v014-official-release-temp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read-only final P08 exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f342be52b786b0cfd222f3650818e650f61a010d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
      - name: Read-only exact official stable channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 1c284782fa7508a481ce92e817a99e0263d5a4fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: updates
          persist-credentials: false
      - name: PHP 8.4 strict native GitHub cURL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,mbstring,json,openssl
          coverage: none
      - name: Actual v013 installed to v014 stable channel and Release live read-only discovery
        shell: bash
        env:
          P08_R142_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = f342be52b786b0cfd222f3650818e650f61a010d
          test "$(git -C updates rev-parse HEAD)" = 1c284782fa7508a481ce92e817a99e0263d5a4fc
          test "$(cat p08/VERSION)" = 0.1.4
          php -l p08/src/Upgrade/R128OfficialForwardDiscovery.php >/dev/null
          php -l p08/src/Upgrade/R128OfficialForwardMetadata.php >/dev/null
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/R126Installed013Source.php';
          require 'p08/src/Upgrade/R128OfficialForwardMetadata.php';
          require 'p08/src/Upgrade/R128OfficialForwardDiscovery.php';
          $token=(string)getenv('P08_R142_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('R142_TOKEN_MISSING');
          $channel=json_decode(file_get_contents('updates/projects/P08-ADOPS.json'),true,32,JSON_THROW_ON_ERROR);
          $installed=['source_version'=>'0.1.3',
            'source_sha'=>'44d504185f0ac8cf4be552dc5adada989a08b40e',
            'source_manifest_sha256'=>'d8eb32b7df2f593141992819e0ea47c465c0dd83476dce40b28a111fbbdf88a2',
            'mode'=>'UPGRADED_012_TO_013_HISTORY_SEALED'];
          $gate=new VF\AdOps\Upgrade\R128OfficialForwardMetadata();
          $offline=$gate->check($channel,null,$installed);
          if(($offline['status']??'')!=='NEXT_RELEASE_METADATA_NOT_PUBLISHED'
           ||($offline['can_install']??true)!==false)throw new RuntimeException('R142_OFFLINE_GATE');
          echo "P08_R142_CURRENT_CHANNEL_V014_EVIDENCE_IDENTITY_BEFORE_RELEASE=PASS\n";
          $discovery=new VF\AdOps\Upgrade\R128OfficialForwardDiscovery();
          $found=$discovery->check($token,$installed);
          if(($found['status']??'')!=='OFFICIAL_NEXT_METADATA_VERIFIED_NOT_STAGED'
            ||($found['target_version']??'')!=='0.1.4'
            ||($found['target_sha']??'')!=='f342be52b786b0cfd222f3650818e650f61a010d'
            ||($found['can_install']??true)!==false)
            throw new RuntimeException('R142_REAL_GITHUB_OFFICIAL_DISCOVERY_NOT_VERIFIED');
          echo "P08_R142_REAL_GITHUB_PHP_013_TO_014_DISCOVERY_NO_AUTO_APPLY=PASS\n";
          // Negative cases use LIVE official asset metadata: do not fake success when source/hash mismatches.
          $h=curl_init('https://api.github.com/repos/llhzx2018/vf-adops/releases/tags/v0.1.4');
          curl_setopt_array($h,[CURLOPT_RETURNTRANSFER=>true,CURLOPT_FOLLOWLOCATION=>false,
           CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
           CURLOPT_CONNECTTIMEOUT=>5,CURLOPT_TIMEOUT=>14,
           CURLOPT_HTTPHEADER=>['Authorization: Bearer '.$token,'Accept: application/vnd.github+json','User-Agent: VF-R142']]);
          $raw=curl_exec($h);$status=(int)curl_getinfo($h,CURLINFO_RESPONSE_CODE);curl_close($h);
          if($status!==200||!is_string($raw)||strlen($raw)>262144)throw new RuntimeException('R142_REAL_RELEASE_INPUT_FAIL');
          $release=json_decode($raw,true,32,JSON_THROW_ON_ERROR);
          if(($release['id']??null)!==447992904||($release['draft']??true)!==false||count($release['assets']??[])!==6)throw new RuntimeException('R142_RELEASE_CHANGED');
          $mustReject=function(array $changed,string $message)use($gate,$installed,$release):void {
            try{$gate->check($changed,$release,$installed);}
            catch(RuntimeException $e){return;}
            throw new RuntimeException('R142_UNSAFE_CHANNEL_ACCEPTED_'.$message);
          };
          foreach(['source_sha','source_full_manifest_sha256','target_sha','asset_sha256','asset_id','release_id','from_versions'] as $key){
           $bad=$channel;
           if($key==='target_sha')$bad[$key]=$installed['source_sha'];
          else if($key==='source_sha')$bad[$key]=str_repeat('0',40);
           else if(in_array($key,['source_full_manifest_sha256','asset_sha256'],true))$bad[$key]=str_repeat('0',64);
           else if(in_array($key,['asset_id','release_id'],true))$bad[$key]=1;
           else $bad[$key]=['0.1.2'];
           $mustReject($bad,$key);
          }
          echo "P08_R142_LIVE_RELEASE_NEGATIVE_SOURCE_HASH_ID_VERSION_GATES=PASS\n";
          // Keep current-channel compatibility defined by original R128; no writes and no staging.
          $current=$channel;
          $current['target_version']='0.1.3';$current['target_sha']=$installed['source_sha'];
          $current['release_tag']='v0.1.3';$current['from_versions']=['0.1.2'];
          $current['asset_name']='VF_AdOps_V0.1.3_UPDATE.zip';
          $out=$gate->check($current,null,$installed);
          if(($out['status']??null)!=='CURRENT_VERSION_NO_NEWER_RELEASE'||($out['can_install']??true)!==false)throw new RuntimeException('R142_CURRENT_GUARD');
          echo "P08_R142_OLDER_CHANNEL_NO_DOWNGRADE_FAILCLOSED=PASS\n";
          PHP
          echo P08_R142_REAL_NONPRODUCTION_OFFICIAL_DISCOVERY_ALL_CHECKS_PASS=YES
      - name: Always purge temporary private source and channel
        if: always()
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/updates"
