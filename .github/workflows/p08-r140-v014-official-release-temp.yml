name: P08 R140 resume approved v0.1.4 official draft asset proof (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r140-v014-official-release-temp.yml]
permissions:
  contents: read
jobs:
  release:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P08_FINAL: f342be52b786b0cfd222f3650818e650f61a010d
      GOV_FINAL: 5aeb01605290e2170c98efda79afffb1cff7a206
    steps:
      - name: Transient exact P08 source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f342be52b786b0cfd222f3650818e650f61a010d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.4 official one-PHP verifier
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,mbstring,sqlite3,pdo_sqlite,pdo_mysql,posix,curl
          coverage: none
      - name: Recover authentic pre-issued draft, prove strict compatibility, finish real release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_RELEASE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN"
          test "$(git -C p08 rev-parse HEAD)" = "$P08_FINAL"
          test "$(cat p08/VERSION)" = 0.1.4
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = "$P08_FINAL"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 --jq .object.sha)" = "$P08_FINAL"
          for commit in 802b79eedb22600eea71a19de2d5286b71fea25e cb3364d80c4dcd76ed78d170553be54c822b4c16 f1d73d9b4fafd2c125a2060d11abdbce371c093f; do
            git -C p08 merge-base --is-ancestor "$commit" "$P08_FINAL"
          done
          for run in 44002478597 44001590171 44000376429 44000376970 44000376289 44000376280 44001134508 43995599978 43995760311; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq .conclusion)" = success
          done
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/jobs/133771770399 --jq '.steps[]|select(.name|startswith("Fail closed identity"))|.conclusion')" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/jobs/133771770399 --jq '.steps[]|select(.name|startswith("Build actual final main package"))|.conclusion')" = success
          t="$RUNNER_TEMP"
          gh api repos/llhzx2018/vf-adops/releases/447992904 > "$t/p08-r140-draft.json"
          python3 -B - <<'PY'
          from pathlib import Path
          import os,json
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'p08-r140-draft.json').read_text())
          expected={'VF_AdOps_V0.1.4_FULL.zip':(757302248,8317356,'27a7b59a1495a5da5e9dc9413a3c423c34a6df0665df05e529e9a478a69c652e'),
                    'VF_AdOps_V0.1.4_UPDATE.zip':(757302247,8292676,'6dac53efa196121d8d5df3eaf890a0b686f4e4094009f7bfe986c0151ad8c018')}
          assert r['id']==447992904 and r['tag_name']=='v0.1.4' and r['draft'] is True and r['prerelease'] is False
          assert r['published_at'] is None
          assert r['url']=='https://api.github.com/repos/llhzx2018/vf-adops/releases/447992904'
          assert len(r['assets'])==2 and {x['name'] for x in r['assets']}==set(expected)
          for a in r['assets']:
            ident,size,digest=expected[a['name']]
            assert a['id']==ident and a['size']==size and a['digest']=='sha256:'+digest
            assert a['state']=='uploaded' and a['content_type']=='application/zip'
          print('P08_R140_DRAFT_ID_AND_IMMUTABLE_TWO_ASSETS=PASS')
          PY
          echo P08_R140_MAIN_FINAL_3PRS_9_RUNS_PREVIOUS_FINAL_ZIP_BUILD=REUSE_VERIFIED
          for entry in \
            "VF_AdOps_V0.1.4_FULL.zip 757302248 8317356 27a7b59a1495a5da5e9dc9413a3c423c34a6df0665df05e529e9a478a69c652e" \
            "VF_AdOps_V0.1.4_UPDATE.zip 757302247 8292676 6dac53efa196121d8d5df3eaf890a0b686f4e4094009f7bfe986c0151ad8c018" \
            "p08-r140-issued-v013-full.zip 753599121 8294042 80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527"; do
            read -r name id size digest <<< "$entry"
            curl -fLsS --retry 2 --max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" -o "$t/$name"
            test "$(wc -c < "$t/$name")" -eq "$size"
            printf '%s  %s\n' "$digest" "$t/$name" | sha256sum -c --status
          done
          echo P08_R140_THREE_REAL_GITHUB_ISSUED_ZIP_BYTES=PASS
          cd p08
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          python3 -B - <<'PY'
          from pathlib import Path
          import os,sys,hashlib,copy
          t=Path(os.environ['RUNNER_TEMP']);root=Path.cwd()
          original=(root/'scripts/r132_live_release_proof.py').read_text()
          old='API + "/releases/tags/v0.1.4"'
          assert original.count(old)==2
          shim=t/'p08-r140-draft-api-shim';shim.mkdir(mode=0o700)
          changed=original.replace(old,'API + "/releases/447992904"')
          assert changed.replace('API + "/releases/447992904"',old)==original
          (shim/'r132_live_release_proof.py').write_text(changed)
          sys.path.insert(0,str(shim));sys.path.insert(1,str(root/'scripts'))
          import r132_live_release_proof as proof
          from build_r130_onefile import create
          f=t/'VF_AdOps_V0.1.4_FULL.zip';a=t/'VF_AdOps_V0.1.4_UPDATE.zip'
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          target=os.environ['P08_FINAL'];token=os.environ['P08_RELEASE_READ_TOKEN']
          real=proof.require_official_next_release
          def exact_draft(*args):
            x=real(*args)
            if x!={'release_id':447992904,'full_asset_id':757302248,'update_asset_id':757302247,'tag_sha':target,'draft':True}:
              raise ValueError('R140_OFFICIAL_DRAFT_ID_OR_ASSET_ID_REFUSED')
            return x
          proof.require_official_next_release=exact_draft
          assert exact_draft(target,sha(f),f.stat().st_size,sha(a),a.stat().st_size)['draft'] is True
          release=proof._fetch(proof.API+'/releases/447992904',token)
          tag=proof._fetch(proof.API+'/git/ref/tags/v0.1.4',token)
          for change in ('hash','tag','asset'):
            r=copy.deepcopy(release);g=copy.deepcopy(tag)
            if change=='hash':r['assets'][0]['digest']='sha256:'+'f'*64
            if change=='tag':g['object']['sha']='0'*40
            if change=='asset':r['assets'][1]['id']=9;r['assets'][1]['url']=proof.API+'/releases/assets/9'
            try:
              observed=proof.verify_metadata(r,g,target,sha(f),f.stat().st_size,sha(a),a.stat().st_size)
              if change=='asset' and observed['update_asset_id']!=757302247:
                raise ValueError('R140_EXACT_ASSET_ID_NEGATIVE_REJECTED')
            except ValueError: pass
            else: raise RuntimeError('R140_DRAFT_NEGATIVE_GATE_FAILED_'+change)
          one=t/'p08-owner-forward-once.php'
          assert not one.exists()
          receipt=create(root/'scripts/r130_owner_forward_once.php',a,t/'p08-r140-issued-v013-full.zip',
            target,one,issued_next=f,issued_next_sha=sha(f),isolated=False)
          raw=one.read_bytes();mark=b'__halt_compiler();'
          assert receipt['status']=='OFFICIAL_NEXT_ONEFILE_BUILT' and receipt['target_sha']==target
          assert raw.count(mark)==1 and raw.split(mark,1)[1]==a.read_bytes()
          assert receipt['sha256']==sha(one)
          print('P08_R140_OFFICIAL_ONEPHP_VERIFIED_DRAFT_ID_TWO_REAL_ASSETS_AND_NEGATIVES=PASS')
          PY
          cd ..
          php -l "$t/p08-owner-forward-once.php" > "$t/p08-r140-php-lint.log"
          cat > "$t/CHANGELOG.md" <<'CHANGELOG'
          # VF AdOps v0.1.4 · stable
          - Rootless v0.1.3 to v0.1.4 code-only Atomic with Owner first activation.
          - SQLite, MySQL 8.4, MariaDB 11.8; backup and forced interruption recovery.
          - Real HTTPS Owner login and 390/768/1440 no-overflow tests.
          - Owner manually upgrades Production; no automatic VPS change.
          CHANGELOG
          python3 -B - <<'PY'
          from pathlib import Path
          import os,json,zipfile,hashlib
          t=Path(os.environ['RUNNER_TEMP']);sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          full=t/'VF_AdOps_V0.1.4_FULL.zip';old=t/'p08-r140-issued-v013-full.zip'
          with zipfile.ZipFile(full) as z: new_m=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          with zipfile.ZipFile(old) as z: old_m=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          files=['VF_AdOps_V0.1.4_FULL.zip','VF_AdOps_V0.1.4_UPDATE.zip','p08-owner-forward-once.php','CHANGELOG.md']
          meta={'schema':'p08-adops-release-provenance/v1','project_id':'P08','repository':'llhzx2018/vf-adops',
           'tag':'v0.1.4','target_version':'0.1.4','target_sha':os.environ['P08_FINAL'],
           'source_version':'0.1.3','source_sha':'44d504185f0ac8cf4be552dc5adada989a08b40e',
           'source_full_manifest_sha256':old_m,'target_full_manifest_sha256':new_m,
           'previous_official_full_asset_id':753599121,
           'previous_official_full_sha256':'80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527',
           'governance_sha':os.environ['GOV_FINAL'],'mode':'P08_ADOPS_014_PR55_56_57_ONLY',
           'schema_changes':False,'production_auto_apply':False,
           'owner_preview':'POST_RELEASE_REQUIRED','owner_real_use':'POST_PRODUCTION_REQUIRED',
           'machine_runs':[44002478597,44001590171,44000376429,44000376970,44000376289,
            44000376280,44001134508,43995599978,43995760311],
           'actual_final_build':{'run':44003103972,'job':133771770399,'stage':'SUCCESS'},
           'assets':{n:{'sha256':sha(t/n),'bytes':(t/n).stat().st_size} for n in files}}
          (t/'RELEASE_PROVENANCE.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n')
          files.append('RELEASE_PROVENANCE.json')
          (t/'SHA256SUMS').write_text(''.join(sha(t/n)+'  '+n+'\n' for n in files))
          print('P08_R140_SIX_ASSET_MANIFEST_PROVENANCE=PASS')
          PY
          (cd "$t" && sha256sum --check --status SHA256SUMS)
          for name in p08-owner-forward-once.php RELEASE_PROVENANCE.json SHA256SUMS CHANGELOG.md; do
            curl --fail --silent --show-error --max-time 90 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$t/$name" \
              "https://uploads.github.com/repos/llhzx2018/vf-adops/releases/447992904/assets?name=$name" \
              -o "$t/p08-r140-upload-$name.json"
            python3 -B - "$name" <<'PY'
          from pathlib import Path
          import os,json,hashlib,sys
          t=Path(os.environ['RUNNER_TEMP']);name=sys.argv[1]
          x=json.loads((t/('p08-r140-upload-'+name+'.json')).read_text());p=t/name
          assert x['name']==name and x['id']>0 and x['state']=='uploaded'
          assert x['size']==p.stat().st_size and x['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print('P08_R140_DRAFT_ASSET_UPLOAD_VERIFIED='+name)
          PY
          done
          gh api repos/llhzx2018/vf-adops/releases/447992904 > "$t/p08-r140-final-draft.json"
          python3 -B - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          t=Path(os.environ['RUNNER_TEMP']);r=json.loads((t/'p08-r140-final-draft.json').read_text())
          names={'VF_AdOps_V0.1.4_FULL.zip','VF_AdOps_V0.1.4_UPDATE.zip',
           'p08-owner-forward-once.php','RELEASE_PROVENANCE.json','SHA256SUMS','CHANGELOG.md'}
          assert r['id']==447992904 and r['draft'] is True and len(r['assets'])==6
          assert {a['name'] for a in r['assets']}==names
          for a in r['assets']:
            p=t/a['name'];sha=hashlib.sha256(p.read_bytes()).hexdigest()
            assert a['id']>0 and a['size']==p.stat().st_size
            assert a['digest']=='sha256:'+sha and a['state']=='uploaded'
            if a['name'].endswith('.zip'):assert a['content_type']=='application/zip'
          (t/'p08-r140-remote-receipts.txt').write_text(''.join(
            a['name']+' '+str(a['id'])+' '+str(a['size'])+' '+a['digest'][7:]+'\n'
            for a in r['assets']))
          print('P08_R140_OFFICIAL_DRAFT_SIX_ASSETS_REMOTE_SHA256=PASS')
          PY
          mkdir -m 0700 "$t/p08-r140-remote"
          while IFS=' ' read -r name id size digest; do
            curl -fLsS --retry 2 --max-time 90 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/$id" \
              -o "$t/p08-r140-remote/$name"
            test "$(wc -c < "$t/p08-r140-remote/$name")" -eq "$size"
            printf '%s  %s\n' "$digest" "$t/p08-r140-remote/$name" | sha256sum -c --status
            cmp -s "$t/$name" "$t/p08-r140-remote/$name"
          done < "$t/p08-r140-remote-receipts.txt"
          (cd "$t/p08-r140-remote" && sha256sum -c --status SHA256SUMS)
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 --jq .object.sha)" = "$P08_FINAL"
          echo P08_R140_OFFICIAL_SIX_ACTUAL_REMOTE_BYTES_SHA256=PASS
          gh api -X PATCH repos/llhzx2018/vf-adops/releases/447992904 -F draft=false -F prerelease=false >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/releases/447992904 --jq .draft)" = false
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq .id)" = 447992904
          echo P08_R140_OFFICIAL_V014_SIX_ASSETS_PUBLISHED=PASS
          echo P08_R140_CORE_UPDATES_PENDING_PRODUCTION_UNCHANGED=YES
      - name: Always clean synthetic and private source
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$RUNNER_TEMP"/p08-r140-*
          rm -f -- "$RUNNER_TEMP/VF_AdOps_V0.1.4_FULL.zip" "$RUNNER_TEMP/VF_AdOps_V0.1.4_UPDATE.zip"
          rm -f -- "$RUNNER_TEMP/p08-owner-forward-once.php" "$RUNNER_TEMP/CHANGELOG.md" "$RUNNER_TEMP/RELEASE_PROVENANCE.json" "$RUNNER_TEMP/SHA256SUMS"
