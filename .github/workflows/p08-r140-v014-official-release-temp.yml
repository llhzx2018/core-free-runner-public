name: P08 R140 exact merged main approved v0.1.4 official Release (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r140-v014-official-release-temp.yml]
permissions:
  contents: read
jobs:
  release:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P08_FINAL: f342be52b786b0cfd222f3650818e650f61a010d
      GOV_FINAL: 5aeb01605290e2170c98efda79afffb1cff7a206
      P08_R132_ISOLATED: "YES"
      P08_R130_ISOLATED: "YES"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
    steps:
      - name: Checkout exact merged private P08 main transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f342be52b786b0cfd222f3650818e650f61a010d
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08
          persist-credentials: false
      - name: Checkout exact effective GOV-DOC main transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5aeb01605290e2170c98efda79afffb1cff7a206
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
      - name: PHP8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,zip,sqlite3,pdo_sqlite,pdo_mysql,fileinfo,curl,posix,dom
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed identity, 13 current domains and 9 independent machine runs before any Tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = "$P08_FINAL"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_FINAL"
          test "$(cat p08/VERSION)" = "0.1.4"
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq '.object.sha')" = "$P08_FINAL"
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq '.object.sha')" = "$GOV_FINAL"
          grep -Fq 'P08_RP07N_CASE=P08_ADOPS_014_PR55_56_57_ONLY' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'V3.13 · ONLY P08 v0.1.4 / PR #55/#56/#57 Mode N' gov/skills/skill-release/V3.13/SKILL.md
          # Exact merged PR heads are immutable ancestors; GitHub PR metadata was independently verified.
          # Do not downgrade to a token requiring unavailable Pull Requests read permission.
          for commit in 802b79eedb22600eea71a19de2d5286b71fea25e cb3364d80c4dcd76ed78d170553be54c822b4c16 f1d73d9b4fafd2c125a2060d11abdbce371c093f; do
            git -C p08 merge-base --is-ancestor "$commit" "$P08_FINAL" || { echo P08_R140_REQUIRED_PR_HEAD_NOT_ANCESTOR; exit 78; }
          done
          test "$(gh api "repos/llhzx2018/vf-adops/git/commits/$P08_FINAL" --jq '.tree.sha')" = "$(gh api repos/llhzx2018/vf-adops/git/commits/f1d73d9b4fafd2c125a2060d11abdbce371c093f --jq '.tree.sha')" || { echo P08_R140_TESTED_EXECUTABLE_TREE_DRIFT; exit 78; }
          test -z "$(git -C p08 diff --name-only f1d73d9b4fafd2c125a2060d11abdbce371c093f "$P08_FINAL" -- app src public resources routes config database composer.json composer.lock package.json package-lock.json scripts tests)"
          for run in 44002478597 44001590171 44000376429 44000376970 44000376289 44000376280 44001134508 43995599978 43995760311; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success || { echo "P08_R140_REQUIRED_MACHINE_NOT_PASS_RUN=$run"; exit 78; }
          done
          if gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 >/dev/null 2>&1 || gh release view v0.1.4 -R llhzx2018/vf-adops >/dev/null 2>&1; then
            echo P08_R140_V014_OFFICIAL_ID_ALREADY_EXISTS_STOP
            exit 78
          fi
          python3 -B - <<'PY'
          from pathlib import Path
          import json
          gov=Path('gov');p=Path('p08')
          items=json.loads((gov/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())['domains']
          required={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','OBSERVABILITY','GIT','UA_UI'}
          conditional={'NOTIFICATION','PERFORMANCE'}
          not_applicable={'SEO'}
          assert set(items)==required|conditional|not_applicable
          for k,v in items.items():
            assert (gov/v['authority']).is_file() and (gov/v['authority']).stat().st_size>0,k
            assert '| '+k+' |' in (p/'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text(),k
          print('P08_R140_13_DOMAIN_FINAL_MAIN_CURRENT_AUTHORITY_READ=PASS')
          PY
          echo P08_R140_FINAL_MAIN_RP07N_3PR_9_REAL_MACHINE_GATES_VERIFIED=PASS
      - name: Build actual final main package twice, negative tamper, canonical FULL and Atomic delivery
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r140-issued-v013-full.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r140-issued-v013-full.zip" | sha256sum --check --status
          test "$(wc -c < "$RUNNER_TEMP/p08-r140-issued-v013-full.zip")" -eq 8294042
          cd p08
          test ! -e .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-r140-composer.log" 2>&1 || { echo P08_R140_COMPOSER_LOCKED_BUILD_FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r140-npm.log" 2>&1 || { echo P08_R140_NPM_LOCKED_BUILD_FAIL; exit 1; }
          npm run build >> "$RUNNER_TEMP/p08-r140-npm.log" 2>&1 || { echo P08_R140_VITE_BUILD_FAIL; exit 1; }
          python3 -B - <<'PY'
          import os,sys,zipfile,hashlib,json
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);root=Path('.')
          sys.path.insert(0,str(root/'scripts'))
          from build_full import write_full
          from build_atomic import write_atomic
          with zipfile.ZipFile(t/'p08-r140-issued-v013-full.zip') as old:
              oldhash=hashlib.sha256(old.read('FULL_MANIFEST.json')).hexdigest()
          (t/'p08-r140-old-manifest.txt').write_text(oldhash)
          final=os.environ['P08_FINAL']
          write_full(root,t/'VF_AdOps_V0.1.4_FULL.zip','0.1.4',final)
          write_atomic(root,t/'VF_AdOps_V0.1.4_UPDATE.zip',
           source_version='0.1.3',source_sha='44d504185f0ac8cf4be552dc5adada989a08b40e',
           source_full_manifest_sha256=oldhash,target_version='0.1.4',target_sha=final)
          print('P08_R140_FINAL_MAIN_REAL_OFFICIAL_CANDIDATE_FULL_ATOMIC_CREATED=PASS')
          PY
          python3 -B tests/compatibility/r132_candidate_package_gate.py \
            --full "$RUNNER_TEMP/VF_AdOps_V0.1.4_FULL.zip" \
            --atomic "$RUNNER_TEMP/VF_AdOps_V0.1.4_UPDATE.zip" \
            --old "$RUNNER_TEMP/p08-r140-issued-v013-full.zip" \
            --source . --sha "$P08_FINAL"
          test -f "$RUNNER_TEMP/p08-owner-forward-once.php"
          rm -- "$RUNNER_TEMP/p08-owner-forward-once.php"
          cd ..
          python3 -B - <<'PY'
          import os,sys,subprocess,json,hashlib
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);gov=Path('gov').resolve()
          root=Path('p08').resolve();final=os.environ['P08_FINAL']
          clean=t/'p08-r140-clean-git-source'
          subprocess.run(['git','clone','--quiet','--local',str(root),str(clean)],check=True)
          assert subprocess.check_output(['git','-C',str(clean),'rev-parse','HEAD'],text=True).strip()==final
          assert not subprocess.check_output(['git','-C',str(clean),'status','--porcelain'],text=True).strip()
          sys.path.insert(0,str(root/'scripts'))
          from build_full import verify_canonical_full_contract
          full=t/'VF_AdOps_V0.1.4_FULL.zip';atomic=t/'VF_AdOps_V0.1.4_UPDATE.zip'
          for phase in ('resolve','delivery'):
              verify_canonical_full_contract(clean,full,final,gov,phase)
              print('P08_R140_CANONICAL_FULL_'+phase.upper()+'=PASS')
          tool=gov/'governance/public-authority/tools/task_delivery_contract_lint.py'
          router=gov/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json'
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','OBSERVABILITY','GIT','UA_UI']
          caps=['source_change','full_package','installer_ui','auth','database','online_upgrade','external_api','background_job','release_visibility']
          paths={'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/RPD.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'}
          for profile,asset in [('web_full_zip',full),('web_atomic_zip',atomic)]:
              data={'schema':'vf.public-authority.task-delivery-check.v1','project':'P08','source':final,
                'project_authority':paths,'acceptance_markers':['WordPress-simple','CloudPanel'],
                'required_domains':required,'task_capabilities':caps,
                'delivery':{'profile':profile,'entrypoint':'public/index.php','requires_git':False,
                  'requires_manual_source_copy':False,'artifact':asset.name,'sha256':hashlib.sha256(asset.read_bytes()).hexdigest()}}
              receipt=t/('p08-r140-'+profile+'.json')
              receipt.write_text(json.dumps(data))
              for phase in ('resolve','delivery'):
                 proc=subprocess.run([sys.executable,'-B',str(tool),'--phase',phase,'--receipt',str(receipt),
                     '--project-root',str(clean),'--artifact-root',str(t),'--public-router',str(router)],
                     capture_output=True,text=True)
                 if proc.returncode:raise RuntimeError('P08_R140_TASK_DELIVERY_'+profile+'_'+phase+':'+proc.stdout[-400:])
                 print('P08_R140_'+profile.upper()+'_'+phase.upper()+'=PASS')
          print('P08_R140_FINAL_MAIN_REAL_ZIP_CANONICAL_FULL_ATOMIC=PASS')
          PY
      - name: Issue v0.1.4 official private draft assets, validate actual official onefile, publish and independently read back
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$GH_TOKEN" || { echo P08_R140_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq '.object.sha')" = "$P08_FINAL"
          test "$(git -C p08 rev-parse HEAD)" = "$P08_FINAL"
          for run in 44002478597 44001590171 44000376429 44000376970 44000376289 44000376280 44001134508 43995599978 43995760311; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" --jq '.conclusion')" = success || { echo P08_R140_RELEASE_REQUIRED_MACHINE_MOVED; exit 78; }
          done
          if gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 >/dev/null 2>&1 || gh release view v0.1.4 -R llhzx2018/vf-adops >/dev/null 2>&1; then
           echo P08_R140_OFFICIAL_ID_RESERVED_UNEXPECTED; exit 78
          fi
          t="$RUNNER_TEMP"
          test -s "$t/VF_AdOps_V0.1.4_FULL.zip" && test -s "$t/VF_AdOps_V0.1.4_UPDATE.zip"
          cat > "$t/RELEASE_NOTES.md" <<'NOTE'
          # VF AdOps v0.1.4 · stable
          Clean FULL for new SQLite / MySQL 8.4 / MariaDB 11.8 installations.
          Code-only Atomic UPDATE from genuine official v0.1.3 only; no schema changes.
          Owner on existing v0.1.3 must use the separately validated single-PHP first
          activation as needed, then explicitly check, prepare backup and click upgrade.
          Rootless independent site-owned worker preserves database, media and history.
          Strong write/backup locks, real SIGKILL137 recovery, HTTPS Owner authentication
          and responsive 390/768/1440 tested on disposable machines.
          Owner human preview/real-use acceptance remains AFTER official distribution.
          Production never auto-upgrades, and no CloudPanel/VPS/DNS change is performed.
          Source exactly P08 PR #55/#56/#57 merged main; GOV Mode N V3.13.
          NOTE
          cat > "$t/CHANGELOG.md" <<'CHANGELOG'
          # VF AdOps v0.1.4
          - Implements site-user rootless v0.1.3 to v0.1.4 code-only forward Atomic, Owner
            explicit first activation, background wake, safe history archive and retries.
          - Improves Current-page Owner update workflow and isolated recovery observability.
          - Preserves selected SQLite, MySQL8.4 and MariaDB11.8; no data schema changes.
          - Independent real GitHub-hosted machine tests cover latest exact source:
            FULL/Atomic parity, native backup, SIGKILL, rollback and HTTPS Chromium.
          - Owner performs Production upgrade and real-use acceptance manually.
          CHANGELOG
          gh api -X POST repos/llhzx2018/vf-adops/git/refs \
            -f ref=refs/tags/v0.1.4 -f "sha=$P08_FINAL" >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 --jq '.object.sha')" = "$P08_FINAL"
          echo P08_R140_REAL_GIT_TAG_014_EXACT_FINAL_MAIN=PASS
          gh release create v0.1.4 \
            "$t/VF_AdOps_V0.1.4_FULL.zip" \
            "$t/VF_AdOps_V0.1.4_UPDATE.zip" \
            -R llhzx2018/vf-adops --verify-tag --draft --title "VF AdOps v0.1.4" \
            --notes-file "$t/RELEASE_NOTES.md" >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.draft')" = true
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.assets|length')" -eq 2
          echo P08_R140_OFFICIAL_DRAFT_FULL_ATOMIC_ASSETS_ISSUED=PASS
          cd p08
          P08_RELEASE_READ_TOKEN="$GH_TOKEN" python3 -B - <<'PY'
          import os,sys,hashlib,zipfile,json
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP']);root=Path.cwd()
          sys.path.insert(0,str(root/'scripts'))
          from build_r130_onefile import create
          f=t/'VF_AdOps_V0.1.4_FULL.zip';a=t/'VF_AdOps_V0.1.4_UPDATE.zip'
          target=os.environ['P08_FINAL'];one=t/'p08-owner-forward-once.php'
          assert not one.exists()
          receipt=create(root/'scripts/r130_owner_forward_once.php',a,t/'p08-r140-issued-v013-full.zip',
           target,one,issued_next=f,issued_next_sha=hashlib.sha256(f.read_bytes()).hexdigest(),isolated=False)
          assert receipt['status']=='OFFICIAL_NEXT_ONEFILE_BUILT'
          assert receipt['target_sha']==target
          blob=one.read_bytes()
          anchor=b'__halt_compiler();'
          assert blob.count(anchor)==1 and blob.split(anchor,1)[1]==a.read_bytes()
          print('P08_R140_OFFICIAL_DRAFT_ISSUED_ONEFILE_AUTHENTICATED_ASSET_ID_BYTES_SHA256=PASS')
          PY
          cd ..
          php -l "$t/p08-owner-forward-once.php" > "$t/p08-r140-onefile-lint.log" 2>&1
          python3 -B - <<'PY'
          from pathlib import Path
          import os,hashlib,json,zipfile
          t=Path(os.environ['RUNNER_TEMP'])
          files=['VF_AdOps_V0.1.4_FULL.zip','VF_AdOps_V0.1.4_UPDATE.zip','p08-owner-forward-once.php','CHANGELOG.md']
          with zipfile.ZipFile(t/'VF_AdOps_V0.1.4_FULL.zip') as z:
           full_manifest=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          old_manifest=(t/'p08-r140-old-manifest.txt').read_text().strip()
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          meta={'schema':'p08-adops-release-provenance/v1','project_id':'P08',
           'repository':'llhzx2018/vf-adops','tag':'v0.1.4','target_version':'0.1.4',
           'target_sha':os.environ['P08_FINAL'],'source_version':'0.1.3',
           'source_sha':'44d504185f0ac8cf4be552dc5adada989a08b40e',
           'source_full_manifest_sha256':old_manifest,'target_full_manifest_sha256':full_manifest,
           'previous_official_full_asset_id':753599121,
           'previous_official_full_sha256':'80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527',
           'governance_sha':os.environ['GOV_FINAL'],'mode':'P08_ADOPS_014_PR55_56_57_ONLY',
           'schema_changes':False,'production_auto_apply':False,
           'owner_preview':'POST_RELEASE_REQUIRED','owner_real_use':'POST_PRODUCTION_REQUIRED',
           'machine_runs':[44002478597,44001590171,44000376429,44000376970,
             44000376289,44000376280,44001134508,43995599978,43995760311],
           'assets':{n:{'sha256':sha(t/n),'bytes':(t/n).stat().st_size} for n in files}}
          (t/'RELEASE_PROVENANCE.json').write_text(json.dumps(meta,sort_keys=True,indent=2)+'\n')
          files.append('RELEASE_PROVENANCE.json')
          (t/'SHA256SUMS').write_text(''.join(sha(t/n)+'  '+n+'\n' for n in files))
          print('P08_R140_OLD_V013_FULL_MANIFEST_SHA256='+old_manifest)
          print('P08_R140_FINAL_MAIN_SOURCE_BOUND_SIX_ASSET_PROVENANCE=PASS')
          PY
          (cd "$t" && sha256sum --check --status SHA256SUMS)
          gh release upload v0.1.4 \
           "$t/p08-owner-forward-once.php" "$t/RELEASE_PROVENANCE.json" \
           "$t/SHA256SUMS" "$t/CHANGELOG.md" \
           -R llhzx2018/vf-adops >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.draft')" = true
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.assets|length')" -eq 6
          mkdir -m 0700 "$t/p08-r140-remote"
          gh release download v0.1.4 -R llhzx2018/vf-adops --dir "$t/p08-r140-remote" >/dev/null
          for f in VF_AdOps_V0.1.4_FULL.zip VF_AdOps_V0.1.4_UPDATE.zip p08-owner-forward-once.php RELEASE_PROVENANCE.json SHA256SUMS CHANGELOG.md; do
            cmp -s "$t/$f" "$t/p08-r140-remote/$f" || { echo P08_R140_OFFICIAL_REMOTE_BYTE_MISMATCH; exit 78; }
          done
          (cd "$t/p08-r140-remote" && sha256sum --check --status SHA256SUMS)
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '[.assets[]|{id,name,size,digest,state,content_type}]' > "$t/p08-r140-remote-meta.json"
          python3 -B - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          t=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((t/'p08-r140-remote-meta.json').read_text())
          expected={'VF_AdOps_V0.1.4_FULL.zip','VF_AdOps_V0.1.4_UPDATE.zip',
           'p08-owner-forward-once.php','RELEASE_PROVENANCE.json','SHA256SUMS','CHANGELOG.md'}
          assert len(a)==6 and {x['name'] for x in a}==expected
          for x in a:
           p=t/x['name'];sha=hashlib.sha256(p.read_bytes()).hexdigest()
           assert x['id']>0 and x['size']==p.stat().st_size
           assert x['digest']=='sha256:'+sha and x['state']=='uploaded'
           if x['name'].endswith('.zip'):assert x['content_type']=='application/zip'
           print('P08_R140_OFFICIAL_ASSET='+x['name']+':'+str(x['id'])+':'+str(x['size'])+':'+sha)
          print('P08_R140_OFFICIAL_SIX_ASSET_REMOTE_IDS_AND_FULL_BYTES_PASS=YES')
          PY
          gh release edit v0.1.4 -R llhzx2018/vf-adops --draft=false --prerelease=false >/dev/null
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.draft')" = false
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.4 --jq '.prerelease')" = false
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.4 --jq '.object.sha')" = "$P08_FINAL"
          echo P08_R140_OFFICIAL_V014_GITHUB_RELEASE_REMOTE_FULL_ATOMIC_ONEFILE_6_ASSETS=PASS
          echo P08_R140_PRODUCTION_NOT_MODIFIED_CHANNEL_PENDING=YES
      - name: Always remove all private source, GOV, original and generated ZIPs, logs and synthetic bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08" "$GITHUB_WORKSPACE/gov" "$RUNNER_TEMP"/p08-r140-*
          rm -f -- "$RUNNER_TEMP/VF_AdOps_V0.1.4_FULL.zip" "$RUNNER_TEMP/VF_AdOps_V0.1.4_UPDATE.zip"
          rm -f -- "$RUNNER_TEMP/p08-owner-forward-once.php" "$RUNNER_TEMP/RELEASE_PROVENANCE.json" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/CHANGELOG.md" "$RUNNER_TEMP/RELEASE_NOTES.md"
