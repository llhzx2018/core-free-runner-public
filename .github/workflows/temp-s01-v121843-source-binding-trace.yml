name: TEMP S01 V1.21.843 Durable Source Binding Trace
on:
  push:
    branches:
      - temp/s01-v121843-production-readback-20260905
    paths:
      - '.github/workflows/temp-s01-v121843-source-binding-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 904a68e3a60aa58c5d7af8d725f3393f22e9be07
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace source artifact authority and durable bindings
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          echo '=== FUNCTION DEFINITIONS ==='
          rg -n --hidden --glob '!/.git/**' 'vf_ops_static_source_artifact_record_evidence_v121532|class[[:space:]]+VF_Ops_Static_Source_Artifact_Contract|function[[:space:]]+snapshot|sourceArtifactSha|source_artifact_sha|source_sha256|expected_sha256|source_recovery_expected_sha256|promoted_from_inspection_job' includes vf-ops.php || true
          echo '=== RECORD EVIDENCE CALLS ==='
          rg -n --hidden --glob '!/.git/**' 'source_artifact_record_evidence|Static_Source_Artifact_Contract::snapshot|sourceArtifact|source artifact|source_artifact' includes vf-ops.php || true
          echo '=== RECOVERY DURABLE STATE ==='
          rg -n --hidden --glob '!/.git/**' 'inspectionJobId|candidateId|expectedSha|expected_sha|sourceSha|source_sha|promoted_from' includes/site-release || true
          echo TRACE_COMPLETE=PASS
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
          echo RUNNER_MAIN_UNCHANGED=PASS
