name: P02 V2.5.10 Scratch UX UI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2510-scratch-uaui.yml'
      - 'scripts/p02-v2510-scratch-uaui.sh'

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require registered private capability
        env:
          READ_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.9
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Refine, verify and push candidate
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2510-scratch-uaui.sh')
          s=p.read_text(encoding='utf-8')
          old="if marker not in c: css.write_text(c.rstrip()+override+'\\n',encoding='utf-8')"
          new="if marker not in c: css.write_text((c.rstrip()+override).rstrip()+'\\n',encoding='utf-8')"
          assert old in s
          s=s.replace(old,new)
          s=s.replace('$RUNNER_TEMP/check.mjs','check-v2510.mjs')
          old_login="await page.locator('button[type=\"submit\"]').click();await page.waitForTimeout(350);await page.goto(base+'/');\nawait page.waitForSelector('#scratchLaunchV259',{timeout:12000});"
          new_login="await page.locator('button[type=\"submit\"]').click();await page.waitForTimeout(350);await page.goto(base+'/');\nawait page.evaluate(async pw=>{const r=await fetch('/api.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(!r.ok)throw new Error('login '+r.status);},pw);await page.reload({waitUntil:'networkidle'});\nawait page.waitForSelector('#scratchLaunchV259',{timeout:12000});"
          assert old_login in s
          s=s.replace(old_login,new_login)
          p.write_text(s,encoding='utf-8')
          PY
          bash scripts/p02-v2510-scratch-uaui.sh
