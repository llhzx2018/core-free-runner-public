name: P02 V2.5.10 Scratch UX UI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2510-scratch-uaui.yml'
      - 'scripts/p02-v2510-scratch-uaui.sh'

permissions:
  contents: read

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require registered private capability
        env:
          READ_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.9
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Refine, verify and push candidate
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2510-scratch-uaui.sh')
          s=p.read_text(encoding='utf-8')
          old="if marker not in c: css.write_text(c.rstrip()+override+'\\n',encoding='utf-8')"
          new="if marker not in c: css.write_text((c.rstrip()+override).rstrip()+'\\n',encoding='utf-8')"
          assert old in s
          s=s.replace(old,new).replace('$RUNNER_TEMP/check.mjs','check-v2510.mjs')
          old_boot='for _ in $(seq 1 80);do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1&&break;sleep .25;done\nnpm init -y >/dev/null 2>&1'
          new_boot='for _ in $(seq 1 80);do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1&&break;sleep .25;done\ncurl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"\nTOKEN=$(python3 -c '\''import re,html,sys;x=open(sys.argv[1],encoding="utf-8").read();m=re.search(r"name=\\\"setup_csrf\\\" value=\\\"([^\\\"]+)\\\"",x);assert m;print(html.unescape(m.group(1)))'\'' "$ROOT/setup")\ntest "$(curl -sS -o /dev/null -w '\''%{http_code}'\'' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303\nnpm init -y >/dev/null 2>&1'
          assert old_boot in s
          s=s.replace(old_boot,new_boot,1)
          old_browser="const page=await browser.newPage({viewport:{width:1365,height:768}});await page.goto(base+'/setup.php');\nawait page.locator('input[name=\"password\"]').fill(pw);await page.locator('input[name=\"password_confirm\"]').fill(pw);await page.locator('button[type=\"submit\"]').click();await page.waitForTimeout(350);await page.goto(base+'/');"
          new_browser="const page=await browser.newPage({viewport:{width:1365,height:768}});await page.goto(base+'/');"
          assert old_browser in s
          s=s.replace(old_browser,new_browser,1)
          login_anchor="await page.waitForSelector('#scratchLaunchV259',{timeout:12000});"
          login="await page.evaluate(async pw=>{const r=await fetch('/api.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(!r.ok)throw new Error('login '+r.status);},pw);await page.reload({waitUntil:'networkidle'});\n"+login_anchor
          assert login_anchor in s
          s=s.replace(login_anchor,login,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash scripts/p02-v2510-scratch-uaui.sh
