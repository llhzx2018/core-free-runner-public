name: P05 Runtime Baseline Label Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-runtime-baseline-label-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-label:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BASE: ad87db29a77544671c3e989240f3221e9db322e6
      P05_CANDIDATE: 0c407b4e4284da9782645f7b192713a8ccaceec8
      P05_TREE: 302fc5fec763f2b268692fe9790cbfce07be331d
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 0c407b4e4284da9782645f7b192713a8ccaceec8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact label correction
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_TREE"
          test "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md '
          git diff --check "$P05_BASE" "$P05_CANDIDATE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('VF_PROJECT.json').read_text())
          assert 'post_release_main_commit' not in p
          assert 'post_release_main_tree' not in p
          assert p['post_release_runtime_baseline_commit']=='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          assert p['post_release_runtime_baseline_tree']=='a467ab0a90656312bd297dfd5ecb51da396990b6'
          assert p['repository_main_authority']=='GITHUB_LIVE_MAIN_REF / MOVING_REF_NOT_SHA_PINNED_IN_CURRENT_TRUTH'
          assert p['version']=='1.2.2' and p['production_version']=='1.2.2' and p['formal_release']=='v1.2.2'
          assert p['post_v1_2_2_update_service']['release_authorization']=='PENDING_OWNER'

          r=Path('README.md').read_text()
          assert '## Post-release Runtime Baseline（未发布）' in r
          assert 'Runtime code baseline commit: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096' in r
          assert 'Current main:' not in r.split('## Current Truth',1)[0]
          assert '不冒充会继续移动的 GitHub `main` SHA' in r

          h=Path('docs/handoff/CURRENT_STATE.md').read_text()
          assert 'Post-release Runtime Baseline Commit: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096' in h
          assert 'Repository Main Authority: GitHub live `main` moving ref; SHA intentionally not pinned here' in h
          assert 'Current Working Main:' not in h
          assert 'Release Authorization: PENDING OWNER' in h
          PY
          test -z "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" -- src php database VERSION package.json docs/authority)"
          echo P05_RUNTIME_BASELINE_LABEL_EXACT=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0

      - name: Seal exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          echo "P05_RUNTIME_BASELINE_LABEL_SHA=$(git rev-parse HEAD)"
          echo "P05_RUNTIME_BASELINE_LABEL_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_RUNTIME_BASELINE_LABEL_GATE=PASS
