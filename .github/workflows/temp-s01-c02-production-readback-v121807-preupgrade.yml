name: TEMP S01-C02 Production Readback V1.21.807 Preupgrade
on:
  push:
    branches: [temp/s01-c02-production-readback-v121807-preupgrade-20260904]
    paths: ['.github/workflows/temp-s01-c02-production-readback-v121807-preupgrade.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public S01 endpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          probe() {
            local name="$1"
            local url="$2"
            local out="/tmp/${name}.json"
            local code
            code="$(curl -sS --retry 2 --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' "$url")"
            echo "${name}_HTTP=${code}"
            test "$code" = 200
            jq -e . "$out" >/dev/null
            echo "--- ${name} ---"
            jq -c . "$out"
          }
          probe domain 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          probe seo 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          probe static 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness'
          echo PASS_CURRENT_PRODUCTION_PUBLIC_READBACK_V121807_PREUPGRADE
# fresh readback trigger 2026-09-04T20:18Z
