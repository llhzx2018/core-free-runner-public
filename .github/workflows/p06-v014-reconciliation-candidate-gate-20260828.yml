name: P06 V0.1.14 Reconciliation Candidate Gate

on:
  push:
    paths:
      - '.github/workflows/p06-v014-reconciliation-candidate-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      MAIN_SOURCE: 44def40930019b1c597e404fa49c98d4ceb2ac42
      RELEASE_SOURCE: cec5ecd28b3cdc585d1b7cac17a9e2167d520ea1
      TARGET_VERSION: 0.1.14
      TARGET_BRANCH: release/p06-v0.1.14-reconcile-20260828
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip
          tools: composer:v2

      - name: Build semantic merge candidate
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-press.git" p06 >/dev/null 2>&1
          cd p06
          test "$(git rev-parse origin/main)" = "$MAIN_SOURCE"
          test "$(git rev-parse v0.1.13)" = "$RELEASE_SOURCE"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target reconciliation branch already exists; refusing history rewrite."
            exit 31
          fi
          git checkout "$MAIN_SOURCE"
          git switch -c "$TARGET_BRANCH"
          git config user.name 'VictorForge Runtime'
          git config user.email 'llhzx2018@gmail.com'
          git config merge.conflictstyle diff3

          set +e
          git merge --no-commit --no-ff "$RELEASE_SOURCE" >/tmp/p06-merge.out 2>&1
          MERGE_RC=$?
          set -e
          cat /tmp/p06-merge.out
          test "$MERGE_RC" -ne 0

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'CONFLICT=%s\n' "${conflicts[@]}"
          test "${#conflicts[@]}" -eq 8
          expected=(
            'bin/operations-ui-self-test.php'
            'composer.json'
            'docs/authority/ACCEPTANCE_MATRIX.md'
            'docs/authority/RPD.md'
            'docs/authority/SSOT.md'
            'public/index.php'
            'src/Http/Studio/OperationsController.php'
            'src/Http/Studio/QualityController.php'
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${conflicts[@]}" | grep -Fxq "$f"
          done

          # Preserve the release-line global quality queue under a distinct class;
          # current main keeps the object-level quality desk as the canonical controller.
          git show :3:src/Http/Studio/QualityController.php \
            | sed 's/final class QualityController/final class QualityQueueController/' \
            > src/Http/Studio/QualityQueueController.php

          # Latest owner-approved professional operations IA remains current for these conflicts.
          git checkout --ours bin/operations-ui-self-test.php
          git checkout --ours docs/authority/ACCEPTANCE_MATRIX.md
          git checkout --ours docs/authority/RPD.md
          git checkout --ours docs/authority/SSOT.md
          git checkout --ours public/index.php
          git checkout --ours src/Http/Studio/OperationsController.php
          git checkout --ours src/Http/Studio/QualityController.php

          # Composer scripts are additive: retain both the current backoffice/baseline gate
          # and all V0.1.13 product-line regression scripts.
          git show :2:composer.json >/tmp/composer-main.json
          git show :3:composer.json >/tmp/composer-release.json
          jq -s '.[0] as $a | .[1] as $b | ($a * $b) | .scripts = ($a.scripts + $b.scripts)' \
            /tmp/composer-main.json /tmp/composer-release.json > composer.json

          python3 - <<'PY'
          from pathlib import Path

          # Reconcile public/index.php around current professional backoffice + Baseline V2,
          # while restoring V0.1.13 Book/Reader controller signatures and routes.
          p = Path('public/index.php')
          s = p.read_text()
          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s = s.replace(old, new, 1)

          once('use VF\\Press\\Application\\Operations\\CommonBaselineV2;\n',
               'use VF\\Press\\Application\\Demo\\DemoDataService;\nuse VF\\Press\\Application\\Operations\\CommonBaselineV2;\nuse VF\\Press\\Application\\Publication\\BookGenerationService;\n',
               'imports-app')
          once('use VF\\Press\\Http\\Studio\\BackofficeCatalogController;\n',
               'use VF\\Press\\Http\\Studio\\AdminShell;\nuse VF\\Press\\Http\\Studio\\BackofficeCatalogController;\nuse VF\\Press\\Http\\Studio\\BookController;\n',
               'imports-studio')
          once('use VF\\Press\\Http\\Studio\\QualityController;\n',
               'use VF\\Press\\Http\\Studio\\QualityController;\nuse VF\\Press\\Http\\Studio\\QualityQueueController;\n',
               'imports-quality-queue')
          once('use VF\\Press\\Infrastructure\\Database\\ConnectionFactory;\n',
               'use VF\\Press\\Infrastructure\\Database\\ConnectionFactory;\nuse VF\\Press\\Infrastructure\\Jobs\\JobQueue;\n',
               'imports-jobs')

          init_line = "try{$pdo=ConnectionFactory::create($config);$guard=new StoragePathGuard($config->storagePath);if(!$guard->storageIsOutsidePublicRoot($basePath.'/public'))throw new RuntimeException('私人数据目录与公开网站目录发生重叠。');$session=new SessionManager();$session->start(($_SERVER['HTTPS']??'')==='on',$config->sessionIdleSeconds,$config->sessionAbsoluteSeconds,$config->sessionCookieSeconds,$config->serverSessionFloorSeconds);$csrf=new CsrfTokenManager($session);$audit=new AuditLogger($pdo);$rate=new LoginRateLimiter($pdo);$auth=new OwnerAuthService($pdo,$session,$rate,$audit);$manuscripts=new ManuscriptStore($config->storagePath);$markdown=new SafeMarkdownRenderer();$settings=new SettingsService($pdo,$audit,$config->storagePath);}catch(Throwable){http_response_code(503);header('Content-Type: text/plain; charset=utf-8');echo \"VF Press 暂时无法运行，请先完成数据库升级与环境检查。\\n\";exit;}"
          once(init_line, init_line + "\n$adminShell=new AdminShell($settings,$csrf,$runtimeVersion);", 'admin-shell-init')

          old_ops = "if(str_starts_with($path,'/studio/operations')){$recovery=new RecoveryService($pdo,$audit,$config->storagePath,$config->databasePath);$adapter=new VFPressUpdateAdapter($pdo,$config,$audit,$recovery);$updates=new OnlineUpdateService($pdo,$config,$audit,$adapter);$c=new OperationsController($pdo,$config,$audit,$settings,$recovery,$updates,$csrf,$session);if($method==='GET'&&$path==='/studio/operations'){if($runStudioModule($c,'operations'))exit;}elseif($c->handle($method,$path))exit;}"
          new_ops = "if(str_starts_with($path,'/studio/operations')||str_starts_with($path,'/studio/system/demo/')){$recovery=new RecoveryService($pdo,$audit,$config->storagePath,$config->databasePath);$adapter=new VFPressUpdateAdapter($pdo,$config,$audit,$recovery);$updates=new OnlineUpdateService($pdo,$config,$audit,$adapter);$demo=new DemoDataService($pdo,$audit,$manuscripts);$c=new OperationsController($pdo,$config,$audit,$settings,$recovery,$updates,$csrf,$session,$demo);if($method==='GET'&&$path==='/studio/operations'){if($runStudioModule($c,'operations'))exit;}elseif($c->handle($method,$path))exit;}"
          once(old_ops, new_ops, 'operations-route')

          book_route = "if(str_starts_with($path,'/studio/books')){$publicationService=new PublicationService($pdo,$audit,$manuscripts);$outlineProvider=OpenAIResponsesProvider::fromEnvironment();$c=new BookController($publicationService,new BookGenerationService($pdo,$publicationService,new JobQueue($pdo),$audit,$manuscripts),$adminShell,$csrf,$outlineProvider!==null);if($c->handle($method,$path))exit;}\n"
          anchor = "if(str_starts_with($path,'/studio/research')){$c=new ResearchController(new ResearchService($pdo,$audit),$csrf);if($runStudioModule($c,'research'))exit;}"
          once(anchor,
               book_route + "if(str_starts_with($path,'/studio/research')){$c=new ResearchController(new ResearchService($pdo,$audit),$adminShell,$csrf);if($c->handle($method,$path))exit;}",
               'book-research-routes')

          once("if(str_starts_with($path,'/studio/publications')){$c=new PublicationController(new PublicationService($pdo,$audit,$manuscripts),$csrf);if($runStudioModule($c,'publications'))exit;}",
               "if(str_starts_with($path,'/studio/publications')){$c=new PublicationController(new PublicationService($pdo,$audit,$manuscripts),$csrf,$runtimeVersion);if($runStudioModule($c,'publications'))exit;}",
               'publication-signature')
          once("if(str_starts_with($path,'/studio/publishing')){$ai=OpenAIResponsesProvider::fromEnvironment();$c=new PublishingController(new PublicationService($pdo,$audit,$manuscripts),new EditionService($pdo,$audit,$manuscripts),new ExportService($pdo,$audit,$manuscripts,$markdown,$config->storagePath),new DistributionService($pdo,$audit),$ai===null?null:new AIEditorialService($pdo,$audit,$ai),$csrf);if($runStudioModule($c,'publishing'))exit;}",
               "if(str_starts_with($path,'/studio/publishing')){$ai=OpenAIResponsesProvider::fromEnvironment();$c=new PublishingController(new PublicationService($pdo,$audit,$manuscripts),new EditionService($pdo,$audit,$manuscripts),new ExportService($pdo,$audit,$manuscripts,$markdown,$config->storagePath),new DistributionService($pdo,$audit),$ai===null?null:new AIEditorialService($pdo,$audit,$ai),$adminShell,$csrf);if($c->handle($method,$path))exit;}",
               'publishing-signature')
          once("if(str_starts_with($path,'/preview')){$c=new PublisherReaderPreviewController(new ReaderService($pdo,$manuscripts,$markdown));if($c->handle($method,$path))exit;}",
               "if(str_starts_with($path,'/preview')){$c=new PublisherReaderPreviewController(new ReaderService($pdo,$manuscripts,$markdown),$runtimeVersion);if($c->handle($method,$path))exit;}",
               'preview-signature')

          # Preserve the V0.1.13 cross-book quality queue without replacing the newer
          # object-level quality workspace.
          quality_anchor = "if(str_starts_with($path,'/studio/books'))"
          once(quality_anchor,
               "if($path==='/studio/quality'){$c=new QualityQueueController($pdo,$adminShell);if($c->handle($method,$path))exit;}\n" + quality_anchor,
               'quality-queue-route')
          p.write_text(s)

          # Current operations UI remains authoritative, but Demo V2 actions remain callable
          # through their historical controlled POST routes.
          p = Path('src/Http/Studio/OperationsController.php')
          s = p.read_text()
          if 'use VF\\Press\\Application\\Demo\\DemoDataService;' not in s:
              s = s.replace('use VF\\Press\\Application\\Operations\\OnlineUpdateService;\n',
                            'use VF\\Press\\Application\\Demo\\DemoDataService;\nuse VF\\Press\\Application\\Operations\\OnlineUpdateService;\n', 1)
          old = '        private readonly SessionManager $session,\n    ) {}'
          new = '        private readonly SessionManager $session,\n        private readonly DemoDataService $demo,\n    ) {}'
          if old not in s:
              raise SystemExit('missing operations constructor anchor')
          s = s.replace(old, new, 1)
          marker = '        return false;\n    }\n\n    private function renderIndex(): void'
          if marker not in s:
              raise SystemExit('missing operations handle return anchor')
          demo = r'''        if ($path === '/studio/system/demo/install' && $method === 'POST') {
            $this->requireCsrf();
            try {
                $result = $this->demo->install();
                $this->maintenanceFlash('success', sprintf('完整演示资料已安装：%d 本书、%d 项研究、%d 个章节。', $result['books'], $result['research'], $result['sections']));
            } catch (Throwable $exception) {
                $this->maintenanceFlash('error', '演示资料安装失败：' . $exception->getMessage());
            }
            $this->redirect('/studio/settings');
        }

        if ($path === '/studio/system/demo/refresh' && $method === 'POST') {
            $this->requireCsrf();
            try {
                $result = $this->demo->refresh();
                $this->maintenanceFlash('success', sprintf('演示资料已更新：%d 本书、%d 项研究、%d 个长文章节；真实资料未改变。', $result['books'], $result['research'], $result['sections']));
            } catch (Throwable $exception) {
                $this->maintenanceFlash('error', '演示资料更新失败：' . $exception->getMessage());
            }
            $this->redirect('/studio/settings');
        }

        if ($path === '/studio/system/demo/remove' && $method === 'POST') {
            $this->requireCsrf();
            if ($this->post('confirm') !== '清除演示资料') {
                $this->maintenanceFlash('error', '请输入“清除演示资料”后再执行。');
                $this->redirect('/studio/settings');
            }
            try {
                $this->demo->remove();
                $this->maintenanceFlash('success', '演示资料已整体清除；真实书籍、研究与 Canonical Markdown 未改变。');
            } catch (Throwable $exception) {
                $this->maintenanceFlash('error', '演示资料清除失败：' . $exception->getMessage());
            }
            $this->redirect('/studio/settings');
        }

'''
          s = s.replace(marker, demo + marker, 1)
          p.write_text(s)
          PY

          printf '%s\n' "$TARGET_VERSION" > VERSION
          jq --arg v "$TARGET_VERSION" '
            .version=$v
            | .lifecycle="CANDIDATE"
            | .current_phase="V0_1_14_RELEASE_LINE_RECONCILIATION_CANDIDATE"
            | .next_gate="EXACT_SOURCE_MACHINE_GATE_V0_1_14"
          ' VF_PROJECT.json >/tmp/VF_PROJECT.json
          mv /tmp/VF_PROJECT.json VF_PROJECT.json

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git status --short

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          cd p06
          composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax and full self-test regression
        run: |
          set -Eeuo pipefail
          cd p06
          find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
          mapfile -t scripts < <(jq -r '.scripts | keys[] | select(test("self-test$"))' composer.json)
          printf 'SELF_TEST_SCRIPT=%s\n' "${scripts[@]}"
          for script in "${scripts[@]}"; do
            echo "=== composer $script ==="
            composer run --no-interaction "$script"
          done

      - name: Reconciliation invariants
        run: |
          set -Eeuo pipefail
          cd p06
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(jq -r '.schema' VF_PROJECT.json)" = '3'
          test "$(jq -r '.version' VF_PROJECT.json)" = "$TARGET_VERSION"
          test -f database/schema/0003_ai_book_brief_outline.sql
          test -f src/Application/Operations/CommonBaselineV2.php
          test -f src/Http/Studio/SystemBaselineController.php
          test -f src/Application/Publication/BookGenerationService.php
          test -f src/Application/Demo/DemoDataService.php
          test -f src/Http/Studio/BookController.php
          test -f src/Http/Studio/QualityQueueController.php
          grep -Fq 'sessionIdleSeconds' public/index.php
          grep -Fq '/studio/system/baseline' public/index.php
          grep -Fq '/studio/system/health' public/index.php
          grep -Fq '/studio/books' public/index.php
          grep -Fq "'/studio/quality'" public/index.php
          php bin/common-baseline-v2-self-test.php
          echo P06_V014_RELEASE_LINE_RECONCILIATION=PASS
          echo RELEASE=NO
          echo TAG=NO
          echo PRODUCTION=NO

      - name: Commit and push candidate only after PASS
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p06
          git add -A
          git commit -m 'release: reconcile V0.1.13 line with Common Baseline V2 for V0.1.14'
          CANDIDATE="$(git rev-parse HEAD)"
          PARENT1="$(git rev-parse HEAD^1)"
          PARENT2="$(git rev-parse HEAD^2)"
          test "$PARENT1" = "$MAIN_SOURCE"
          test "$PARENT2" = "$RELEASE_SOURCE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo P06_V014_CANDIDATE_SOURCE="$CANDIDATE"
          echo P06_V014_PARENT_MAIN="$PARENT1"
          echo P06_V014_PARENT_RELEASE="$PARENT2"
          echo P06_V014_CANDIDATE_PUSH=PASS
