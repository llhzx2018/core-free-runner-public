name: p01-channels-503-full-owner-disposable
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channels-503-full-owner-temp.yml'
      - 'scripts/p01-channels-503-full-owner-test-temp.sh'
permissions:
  contents: read
jobs:
  p01-channels-503-exact-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      WORK: /tmp/p01-channels-503-${{ github.run_id }}
      PRODUCT_SHA: 2ef4383048bfd4a08d7bda01b21f0bfe2d8dcd7f
      PRODUCT_TREE: f6a13223a3922e824aecf3c1eb94a0d80569a3cb
    steps:
      - name: Checkout current public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PHP SQLite and JS verification dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi SimpleXML
          node --version
      - name: Checkout exact private P01 candidate and official v502 source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" refs/heads/feat/p01-channels-full-inventory-failure-readback-20261107 | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" "$WORK/candidate"
          git -C "$WORK/candidate" fetch -q --depth 30 origin "$PRODUCT_SHA" refs/tags/v2.47.502:refs/tags/v2.47.502
          git -C "$WORK/candidate" checkout -q --detach "$PRODUCT_SHA"
          git -C "$WORK/candidate" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          git -C "$WORK/candidate" worktree add -q --detach "$WORK/baseline" v2.47.502
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = '2.47.503'
          test "$(tr -d '\r\n ' < "$WORK/candidate/src/VERSION.txt")" = '2.47.503'
          test "$(tr -d '\r\n ' < "$WORK/baseline/VERSION")" = '2.47.502'
          echo P01_503_EXACT_SOURCE_TREE_AND_PREVIOUS_FORMAL=PASS
      - name: Exact source Node PHP canonical and synthetic HTTP 130+4 verification
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01-channels-503-full-owner-test-temp.sh
          echo P01_503_EXACT_SOURCE_MACHINE_PROOF=PASS
      - name: Remove private product and synthetic user data from Public Runner workspace
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_503_PUBLIC_ARTIFACT=NONE
          echo P01_503_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-channels-503-*) rm -rf -- "$WORK";; *) exit 66;; esac
