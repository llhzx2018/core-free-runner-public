name: P01 V2.27 Final Exact Head Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-final-exact-head-gate-20260828.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE: efd05e0fd8af1f2f0f5ff74e778621fcc1a62430
      TREE: 846a0cdc438519087fc42acb53b0fe7680bfcb2b
      ROOT: /tmp/p01-v227-final
      PORT: '18329'
      COOKIE: /tmp/p01-v227-final.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - name: Exact identity syntax and authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(cat product/VERSION)" = '2.27.0'
          test "$(cat product/src/VERSION.txt)" = '2.27.0'
          grep -F "define('VF_VERSION', '2.27.0');" product/src/app/bootstrap.php >/dev/null
          find product/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v227-final-php.txt
          find product/src -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/p01-v227-final-js.txt
          test -f product/src/workspace-action.php
          test -f product/src/assets/workspace.js
          test -f product/docs/evidence/P01_V2.27.0_WORKSPACE_PRODUCTIZATION_20260828.md
          grep -F 'V2.27.0 WORKSPACE PRODUCTIZATION CANDIDATE' product/docs/authority/CURRENT.md >/dev/null
          grep -F 'V2.26.0 OWNER PRODUCTION' product/docs/authority/CURRENT.md >/dev/null
          echo P01_V227_FINAL_IDENTITY_SYNTAX=PASS
      - name: Fresh install representative data and login
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE" /tmp/p01-v227-final-anon.cookies
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v227-final-server.log 2>&1 & echo $! >/tmp/p01-v227-final.pid
          READY=0
          for i in $(seq 1 30); do if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v227-final-setup.html; then READY=1; break; fi; sleep 1; done
          test "$READY" = 1
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-final-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V227 Final Gate' --data-urlencode 'admin_password=P01V227!Final' --data-urlencode 'admin_password_confirm=P01V227!Final' -o /tmp/p01-v227-final-setup-post.html
          test -f "$ROOT/app/.runtime.php"
          cat >/tmp/p01-v227-final-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-final/app/bootstrap.php'; require_once '/tmp/p01-v227-final/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $cats=[];foreach(['开发','AI','影视','稍后整理'] as $n){$cats[$n]=$r->createCategory(['name'=>$n,'description'=>'','is_private'=>false]);}
          for($i=1;$i<=40;$i++){$r->saveLink(null,['category_id'=>$cats['开发'],'title'=>'Tool '.$i,'url'=>'https://tool'.$i.'.example.com','description'=>'工具','tags'=>'工具','is_private'=>false,'is_favorite'=>$i%9===0],'manual');}
          for($i=1;$i<=5;$i++){$z=$r->saveLink(null,['category_id'=>$cats['AI'],'title'=>'Creator '.$i,'url'=>'https://youtube.com/@creator-final-'.$i,'description'=>'内容源','tags'=>'频道','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>true,'note'=>'长期内容源']);}
          for($i=1;$i<=5;$i++){$z=$r->saveLink(null,['category_id'=>$cats['影视'],'title'=>'Movie '.$i,'url'=>'https://movie-final-'.$i.'.example.com','description'=>'影视','tags'=>'电影','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2024','media_status'=>'want','note'=>'想看']);}
          for($i=1;$i<=3;$i++){$r->saveLink(null,['category_id'=>$cats['稍后整理'],'title'=>'Pending '.$i,'url'=>'https://pending-final-'.$i.'.example.com','description'=>'','is_private'=>true],'manual');}
          file_put_contents('/tmp/p01-v227-final-cat',(string)$cats['开发']);
          PHP
          php /tmp/p01-v227-final-seed.php
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V227!Final"}' | jq -e '.ok==true' >/dev/null
          echo P01_V227_FINAL_FRESH_LOGIN=PASS
      - name: Routes and real workspace mutations
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="http://127.0.0.1:$PORT"
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/surfaces.php" -o /tmp/p01-v227-final-all.html
          grep -F '<h1>全部收藏</h1>' /tmp/p01-v227-final-all.html >/dev/null
          grep -F 'data-open-add' /tmp/p01-v227-final-all.html >/dev/null
          grep -F 'data-bulkbar' /tmp/p01-v227-final-all.html >/dev/null
          grep -F 'workspace.js' /tmp/p01-v227-final-all.html >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/start.php" | grep -F '<h1>Start</h1>' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/channels.php" | grep -F '<h1>Channels</h1>' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/watch.php" | grep -F '<h1>Watch</h1>' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" "$BASE/surface-manager.php" | grep -F '<h1>待整理</h1>' >/dev/null
          curl -fsS -c /tmp/p01-v227-final-anon.cookies "$BASE/" -o /tmp/p01-v227-final-public.html
          ! grep -F 'vf-app-sidebar' /tmp/p01-v227-final-public.html
          CSRF=$(python3 - <<'PY'
          import re,json,html
          s=open('/tmp/p01-v227-final-all.html',encoding='utf-8').read();m=re.search(r'<script type="application/json" id="vf-workspace-data">(.*?)</script>',s,re.S);assert m;d=json.loads(html.unescape(m.group(1)));print(d['csrf'])
          PY
          )
          CAT=$(cat /tmp/p01-v227-final-cat)
          test "$(curl -sS -o /tmp/p01-v227-final-unauth.json -w '%{http_code}' -X POST "$BASE/workspace-action.php" --data 'action=favorite&id=1')" = 403
          test "$(curl -sS -o /tmp/p01-v227-final-badcsrf.json -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data 'csrf=bad&action=favorite&id=1')" = 403
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode 'action=create' --data-urlencode "category_id=$CAT" --data-urlencode 'title=Final Added' --data-urlencode 'url=https://final-added.example.com' --data-urlencode 'tags=新增,工具' --data-urlencode 'surface=start' --data-urlencode 'is_private=1' | tee /tmp/p01-v227-final-create.json | jq -e '.ok==true and .duplicate==false' >/dev/null
          ID=$(jq -r '.id' /tmp/p01-v227-final-create.json)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode 'action=favorite' --data-urlencode "id=$ID" --data-urlencode 'favorite=1' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode 'action=save' --data-urlencode "id=$ID" --data-urlencode "category_id=$CAT" --data-urlencode 'title=Final Edited' --data-urlencode 'url=https://final-added.example.com' --data-urlencode 'tags=编辑,工具' --data-urlencode 'surface=channels' --data-urlencode 'resource_kind=creator' --data-urlencode 'background_friendly=1' --data-urlencode 'is_private=1' --data-urlencode 'is_favorite=1' | jq -e '.ok==true' >/dev/null
          IDS=$(php -r 'require "/tmp/p01-v227-final/app/bootstrap.php"; $r=new VfRepository(vf_db()); $rows=$r->bootstrap(true)["links"]; echo json_encode([(int)$rows[0]["id"],(int)$rows[1]["id"]]);')
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode 'action=bulk_surface' --data-urlencode "ids=$IDS" --data-urlencode 'surface=channels' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "$BASE/workspace-action.php" --data-urlencode "csrf=$CSRF" --data-urlencode 'action=bulk_favorite' --data-urlencode "ids=$IDS" --data-urlencode 'favorite=1' | jq -e '.ok==true' >/dev/null
          php -r 'require "/tmp/p01-v227-final/app/bootstrap.php"; $db=vf_db(); $id=(int)$db->query("SELECT id FROM links WHERE url=\"https://final-added.example.com\"")->fetchColumn(); if($id<=0)exit(1); $r=$db->query("SELECT title,is_favorite FROM links WHERE id=$id")->fetch(PDO::FETCH_ASSOC); if(($r["title"]??"")!=="Final Edited"||(int)$r["is_favorite"]!==1)exit(2); $p=$db->query("SELECT surface,resource_kind,background_friendly FROM resource_surface_profiles WHERE link_id=$id")->fetch(PDO::FETCH_ASSOC); if(($p["surface"]??"")!=="channels"||($p["resource_kind"]??"")!=="creator"||(int)$p["background_friendly"]!==1)exit(3); echo "P01_V227_FINAL_MUTATION_DB=PASS\n";'
          echo P01_V227_FINAL_ROUTES_MUTATIONS=PASS
      - name: Regression baseline and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v227-final-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v227-final-verify.txt
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v227-final-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v227-final-surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v227-final-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v227-final-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v227-final-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v227-final-baseline.txt
          php -r 'require "/tmp/p01-v227-final/app/bootstrap.php"; $db=vf_db(); if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1); if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2); echo "P01_V227_FINAL_SQLITE=PASS\n";'
          echo P01_V227_FINAL_BASELINE=PASS
      - name: Verdict
        shell: bash
        run: |
          echo P01_V227_FINAL_SOURCE=$SOURCE
          echo P01_V227_FINAL_TREE=$TREE
          echo P01_V227_FINAL_EXACT_HEAD_GATE=PASS
          echo SCHEMA_CHANGE=NO
          echo RELEASE=NO
          echo PRODUCTION=NO
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-v227-final.pid 2>/dev/null)" 2>/dev/null || true
