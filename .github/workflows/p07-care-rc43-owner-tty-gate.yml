name: P07 care rc43 owner TTY and one-screen regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc43/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-care-rc43-owner-tty-gate.yml'
permissions:
  contents: read
jobs:
  bounded-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify unchanged functionality and exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-system-care/0.1.0-rc43'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc43'
          bash -n "$pkg/vf-system-care.sh"
          bash -n "$pkg/cleanup.sh"
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'b298fc798f53ac8370d1a61a2e2c6442a06f8a53'
          test "$(git hash-object "$pkg/vf-system-care.sh")" = '59321bf17c9590f2b9f0925e85b360e1eb5de66d'
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc43"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc43'" installers/p07-system-care.sh
          ! grep -Fq 'sed -u' "$pkg/vf-system-care.sh"
          ! grep -Fq 'plan_json=' "$pkg/vf-system-care.sh"
          grep -Fq 'resource-profile.sh preview --mode balanced' "$pkg/vf-system-care.sh"
          grep -Fq 'run_action_friendly resource-apply.sh apply' "$pkg/vf-system-care.sh"
          grep -Fq '按 Enter 返回；输入 A 申请安全应用' "$pkg/vf-system-care.sh"
          grep -Fq 'journalctl --vacuum-time=14d' "$pkg/cleanup.sh"
          grep -Fq 'apt-get clean' "$pkg/cleanup.sh"
          grep -Fq 'confirm_numeric' "$pkg/cleanup.sh"
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          echo P07_RC43_BOUNDARY_AND_SYNTAX=PASS
      - name: Isolated TTY no-newline prompt and Enter-return regression
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d -t p07-tty-rc43.XXXXXX)"
          trap 'rm -rf "$root"' EXIT
          pkg='packages/p07-system-care/0.1.0-rc43'
          cp "$pkg/vf-system-care.sh" "$root/vf-system-care.sh"
          mkdir -p "$root/lib"
          cp "$pkg/lib/common.sh" "$root/lib/common.sh"
          printf '0.1.0-rc43\n' >"$root/VERSION"
          cat >"$root/cleanup.sh" <<'STUB'
          #!/usr/bin/env bash
          printf '模拟清理需要确认？[y/N]：'
          read -r answer
          if [[ "$answer" == y ]]; then printf '\n模拟清理结束\n'; fi
          STUB
          cat >"$root/resource-profile.sh" <<'STUB'
          #!/usr/bin/env bash
          printf '模拟只读性能建议（唯一一份）\n'
          STUB
          cat >"$root/resource-apply.sh" <<'STUB'
          #!/usr/bin/env bash
          printf '模拟安全应用\n'
          printf '确认操作？[y/N]：'
          read -r answer
          [[ "$answer" == y ]]
          STUB
          chmod +x "$root"/*.sh
          printf '3\ny\n\n0\n' >"$root/input-cleanup"
          timeout 18s script -qfec "env NO_COLOR=1 P07_FORCE_INTERACTIVE=1 bash '$root/vf-system-care.sh' menu" /dev/null <"$root/input-cleanup" >"$root/cleanup-out" 2>&1
          grep -Fq '模拟清理需要确认？[y/N]：' "$root/cleanup-out"
          grep -Fq '模拟清理结束' "$root/cleanup-out"
          grep -Fq '按 Enter 返回...' "$root/cleanup-out"
          printf '4\n\n0\n' >"$root/input-profile"
          timeout 18s script -qfec "env NO_COLOR=1 P07_FORCE_INTERACTIVE=1 bash '$root/vf-system-care.sh' menu" /dev/null <"$root/input-profile" >"$root/profile-out" 2>&1
          test "$(grep -Fc '模拟只读性能建议（唯一一份）' "$root/profile-out")" -eq 1
          grep -Fq '按 Enter 返回；输入 A 申请安全应用' "$root/profile-out"
          ! grep -Fq '模拟安全应用' "$root/profile-out"
          echo P07_RC43_TERMINAL_PROMPT_AND_ENTER_RETURN=PASS
      - name: Single screen and no extra recurring submenu
        shell: bash
        run: |
          set -Eeuo pipefail
          p='packages/p07-system-care/0.1.0-rc43/vf-system-care.sh'
          for name in '服务器健康检查' '系统更新' '磁盘空间清理' '性能配置' '服务器登录安全' 'WordPress 网站安全' '工具检查 / 修复' '最近操作'; do
            grep -Fq "$name" "$p"
          done
          test "$(grep -c 'ui_note.*常驻数字菜单' "$p" || true)" -eq 0
          grep -Fq "case \"\${1:-menu}\" in" "$p"
          echo P07_RC43_ONE_SCREEN_MENU=PASS
