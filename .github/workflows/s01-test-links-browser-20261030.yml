name: S01 sample links WordPress browser proof
on:
  push:
    branches: [task/s01-test-links-current-proof-20261102]
    paths: ['.github/workflows/s01-test-links-browser-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a20c276a4ef18b3ed30fbfffc1a6d290eaec37e8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: cdbf800918ff2f1517d333ac52d2303ac13e85f8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: plugin-source
      - name: Verify exact source and setup
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = a20c276a4ef18b3ed30fbfffc1a6d290eaec37e8
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 7080a4629aa6298c73fce8799379d94b0488efdc
          git -C target diff --name-only 8d51892b55e3939fcaf6cb52d8784fc00b268b0a HEAD | sort > /tmp/changed
          printf '%s\n' VERSION CHANGELOG.md src/style.css src/inc/runtime-constants.php src/inc/seo-integration.php src/inc/services/frontend-page-progress-service.php src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css src/assets/css/public/vf-theme-public-runtime.css src/inc/bootstrap/public-runtime.php src/inc/frontend-seo-context.php src/inc/modules/module-faq.php src/inc/modules/module-steps.php src/inc/public-css-owner-registry.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          php -l target/src/inc/modules/module-faq.php
          php -l target/src/inc/seo-integration.php
          test "$(git -C plugin-source rev-parse HEAD)" = cdbf800918ff2f1517d333ac52d2303ac13e85f8
          test "$(git -C plugin-source rev-parse 'HEAD^{tree}')" = 7a5b239830dc15e2c952c350845f5d1e0cca6df7
          php -l plugin-source/src/includes/v510-copy.php
          node --check plugin-source/src/public/dist/test-links.js
          node --check control/lanes/s01-test-links-browser/check.cjs
          gh release download v1.25.98 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.98.zip --dir provider
          echo '8804951ff582ab02e237e12a3bdefeb167c115f08b095ff7927921c8f1bffaf9  provider/vf-tools-m3u8_V1.25.98.zip' | sha256sum -c
          python3 control/lanes/s01-test-links-browser/package.py
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: Bilingual WordPress workflow
        run: bash control/lanes/s01-test-links-browser/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-iptv-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private sources
        if: always()
        run: rm -rf target provider lane

