name: TEMP S01-C02 v1.21.818 Audit Family Locator
on:
  push:
    branches:
      - temp/s01-c02-v121818-audit-family-locator-20260905
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 2380c5cb29fbf60b3af3f99ae93ea6717dbc34dd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Locate candidate audit producers and failure families
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '--- candidate_audit references ---'
          grep -RIn --include='*.php' -E "candidate_audit|final_candidate_audit_result|cf_upload_check_summary" ops/includes ops/vf-ops.php || true
          echo '--- audit failure writes ---'
          grep -RIn --include='*.php' -E "failures\]\[\]|failures'\]|'failures'|\"failures\"" ops/includes/publish-o10 ops/includes/release-* ops/includes/site-release 2>/dev/null | head -n 500 || true
          echo '--- likely audit/validator files ---'
          find ops/includes -type f -name '*.php' | grep -Ei 'audit|candidate|static|release|zip|validator' | sort | head -n 300
          echo 'PASS_V121818_AUDIT_FAMILY_LOCATOR'
