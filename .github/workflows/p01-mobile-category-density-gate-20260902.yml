name: P01 Mobile Category Density Gate
on:
  push:
    branches: [tmp/p01-cover-coverage-diagnostic-20260902]
    paths: [.github/workflows/p01-mobile-category-density-gate-20260902.yml]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 839329a10b2dc036114a76ae8f7ca576664bfe02
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mobile-category-density/evidence
      PW: /tmp/p01-mobile-category-density/pw
      PORT: '18551'
      ADMIN_PASS: P01CategoryDensity2026
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence and fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mobile-category-density; mkdir -p "$EVID" "$PW"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'SOURCE=%s\nREMOTE_DEVELOP=%s\n' "$SOURCE" "$REMOTE" | tee "$EVID/source.txt"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mobile-category-density.pid
          COOKIE=/tmp/p01-mobile-category-density.cookies
          for i in $(seq 1 60); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then break; fi
            sleep .25
          done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mobile Category Density' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Seed 40 nested long-name categories
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/dataset.txt"
          <?php
          declare(strict_types=1);
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db(); $repo=new VfRepository($db); $count=0; $target=0;
          $roots=['工作与生产力工具集合','内容创作与媒体资源收藏','开发运维与基础设施服务','财务支付与网络业务资源'];
          foreach($roots as $ri=>$rootName){
            $root=$repo->createCategory(['name'=>$rootName.' · 长名称根分类 '.($ri+1),'parent_id'=>null,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$ri]); $count++;
            for($ci=1;$ci<=3;$ci++){
              $child=$repo->createCategory(['name'=>'子分类 '.$ci.' · 跨平台服务与长期收藏资源','parent_id'=>$root,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$ci]); $count++;
              for($gi=1;$gi<=2;$gi++){
                $name=($ri===3&&$ci===2&&$gi===2?'支付结算与虚拟卡长期资源':'深层分类 '.$gi.' · 真实工作流与参考资料').' · 超长分类名称';
                $grand=$repo->createCategory(['name'=>$name,'parent_id'=>$child,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>$gi]); $count++;
                $saved=$repo->saveLink(null,['category_id'=>$grand,'title'=>'分类样本 '.$count,'url'=>'https://example.com/category-density-'.$count,'description'=>'','is_private'=>0],'manual');
                if($ri===3&&$ci===2&&$gi===2)$target=$grand;
              }
            }
          }
          // Add more root categories so mobile picker has a genuinely long list.
          for($i=1;$i<=12;$i++){ $id=$repo->createCategory(['name'=>'补充分类 '.$i.' · 很长的日常网址与工具收藏名称','parent_id'=>null,'description'=>'','icon'=>'','is_private'=>0,'sort_order'=>100+$i]); $count++; $repo->saveLink(null,['category_id'=>$id,'title'=>'补充样本 '.$i,'url'=>'https://example.com/category-extra-'.$i,'description'=>'','is_private'=>0],'manual'); }
          echo "CATEGORY_COUNT=$count\nTARGET=$target\n";
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()); $fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));
          echo "INTEGRITY=$integrity\nFK=$fk\n"; if($count!==40||$target<=0||$integrity!=='ok'||$fk!==0) exit(2);
          PHP
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PW"; npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install chromium
      - name: 390 and 360 picker interaction readback
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET=$(awk -F= '/^TARGET=/{print $2}' "$EVID/dataset.txt")
          cat > "$PW/visual.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,out=process.env.EVID,target=process.env.TARGET;
          const browser=await chromium.launch({headless:true}); const reports=[];
          for(const width of [390,360]){
            const page=await browser.newPage({viewport:{width,height:844}}); const consoleErrors=[],pageErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e)));
            let response=await page.goto(base+'/start.php',{waitUntil:'networkidle',timeout:30000});
            const trigger=page.locator('.vf-mobile-category-trigger:visible'); await trigger.waitFor({state:'visible'});
            const top=await page.evaluate(()=>({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,triggerText:document.querySelector('.vf-mobile-category-trigger b')?.textContent||'',triggerBox:(()=>{const e=document.querySelector('.vf-mobile-category-trigger');const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}})()}));
            await trigger.click(); await page.locator('.vf-mobile-category-overlay.open').waitFor({state:'visible'});
            const open=await page.evaluate(()=>{const panel=document.querySelector('.vf-mobile-category-panel'),overlay=document.querySelector('.vf-mobile-category-overlay'),list=document.querySelector('.vf-mobile-category-list');const p=panel.getBoundingClientRect(),o=overlay.getBoundingClientRect(),l=list.getBoundingClientRect();return {bodyOverflow:getComputedStyle(document.body).overflow,panel:{x:Math.round(p.x),y:Math.round(p.y),w:Math.round(p.width),h:Math.round(p.height)},overlay:{w:Math.round(o.width),h:Math.round(o.height)},list:{h:Math.round(l.height),scrollHeight:list.scrollHeight},items:document.querySelectorAll('[data-category-picker-item]').length,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};});
            const search=page.locator('.vf-mobile-category-search input'); await search.fill('支付结算'); await page.waitForTimeout(80);
            const filtered=await page.evaluate(()=>[...document.querySelectorAll('[data-category-picker-item]')].filter(e=>!e.hidden).map(e=>({text:(e.textContent||'').trim(),href:e.getAttribute('href')})));
            if(filtered.length!==1||!filtered[0].text.includes('支付结算')) throw new Error('CATEGORY_SEARCH_RESULT_INVALID');
            await page.screenshot({path:`${out}/picker-${width}-filtered.png`,fullPage:false});
            const targetLink=page.locator(`[data-category-picker-item][href*="category=${target}"]`); await targetLink.click(); await page.waitForLoadState('networkidle');
            const selected=await page.evaluate(()=>({url:location.href,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,triggerText:document.querySelector('.vf-mobile-category-trigger b')?.textContent||'',context:(document.querySelector('.vf-context-path-chip')?.textContent||'').trim(),active:[...document.querySelectorAll('[data-category-picker-item].active')].map(e=>(e.textContent||'').trim())}));
            await page.screenshot({path:`${out}/picker-${width}-selected.png`,fullPage:false});
            await page.locator('.vf-mobile-category-trigger:visible').click(); await page.locator('.vf-mobile-category-overlay.open').waitFor({state:'visible'}); await page.keyboard.press('Escape'); await page.waitForTimeout(220);
            const closed=await page.evaluate(()=>({hidden:document.querySelector('.vf-mobile-category-overlay')?.hidden,bodyOpen:document.body.classList.contains('vf-mobile-category-open'),expanded:document.querySelector('.vf-mobile-category-trigger')?.getAttribute('aria-expanded')}));
            const report={width,status:response?.status()||0,top,open,filtered,selected,closed,consoleErrors,pageErrors}; reports.push(report); console.log(JSON.stringify(report)); await page.close();
            if(report.status!==200||top.scrollWidth>top.clientWidth||open.scrollWidth>open.clientWidth||selected.scrollWidth>selected.clientWidth||open.items!==41||open.panel.w!==width||open.list.scrollHeight<=open.list.h||!selected.url.includes(`category=${target}`)||!selected.triggerText.includes('支付结算')||!selected.context.includes('支付结算')||closed.hidden!==true||closed.bodyOpen||closed.expanded!=='false'||pageErrors.length) process.exit(4);
            if(consoleErrors.some(x=>x.includes('MIME type'))) process.exit(5);
          }
          fs.writeFileSync(`${out}/report.json`,JSON.stringify(reports,null,2)); await browser.close(); console.log('P01_MOBILE_CATEGORY_DENSITY_GATE=PASS');
          JS
          cd "$PW"; PORT="$PORT" EVID="$EVID" TARGET="$TARGET" node visual.mjs | tee "$EVID/machine.txt"
      - name: Boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'P01_REF_WRITE=NO\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' | tee "$EVID/boundary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-category-density-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-mobile-category-density.pid 2>/dev/null)" 2>/dev/null || true
