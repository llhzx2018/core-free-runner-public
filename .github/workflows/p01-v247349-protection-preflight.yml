name: P01 V247349 Backup Protection Candidate Proof (Test Only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247349-protection-preflight.yml'

permissions:
  contents: read

jobs:
  candidate-security:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private candidate without persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: 470c7fc7a98509a986cb72059982a1b61937233b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact untouched main as canonical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: 47fe4acb3f82741042a4c379101a789e1fe5f102
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: PHP native SQLite, Node and syntax prerequisites
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, gd
          coverage: none
      - name: Bind exact immutable source and prove native SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 470c7fc7a98509a986cb72059982a1b61937233b
          test "$(git -C stable rev-parse HEAD)" = 47fe4acb3f82741042a4c379101a789e1fe5f102
          test "$(tr -d '\r\n' < VERSION)" = '2.47.349'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.47.349'
          grep -F "define('VF_VERSION', '2.47.349');" src/app/bootstrap.php
          php -m | grep -Fx PDO
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi sqlite3
          php -v | head -1
          echo P01_247349_NATIVE_SQLITE_PREREQUISITES=PASS
      - name: PHP and JS syntax exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          find src -name '*.php' -type f -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check >/dev/null
          php -l tests/unit/backup_missing_protection_guard_native.php
          php -l tests/unit/backup_missing_protection_mock_pdo_native.php
          echo P01_247349_SOURCE_SYNTAX=PASS
      - name: Missing protected backup fail closed AND safe positive controls
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/backup_missing_protection_guard_native.php
          php tests/unit/backup_missing_protection_mock_pdo_native.php
          php tests/unit/backup_missing_history_readonly_audit_native.php
          php tests/unit/backup_automatic_retention_safety_readonly_native.php
          php tests/unit/backup_retention_root_symlink_readonly_native.php
          php tests/unit/backup_retention_inode_independence_native.php
          echo P01_247349_ISOLATED_SECURITY_POSITIVE_NEGATIVE=PASS
      - name: Exact source canonical zero debt versus prior main
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_247349_CANONICAL_NONPUBLISHING=PASS
      - name: Confirm immutable safety and no publishing step
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git -C stable status --porcelain)" = ""
          echo P01_247349_TEST_ONLY_NONPUBLISHING=PASS
