name: P01 V2.34 Final Remote Online Update Gate
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2340-remote-online-update-final-20260830.yml
      - scripts/p01-v2340-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2340-final-owner
      PORT: '18695'
      ADMIN_PASS: 'P01V2340!FinalRemote'
      EVID: /tmp/p01-v2340-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - name: Checkout immutable V2.33 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.33.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout published V2.34 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 8db85499605c34c6b72e664778fa709aa40dc963
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C production rev-parse HEAD)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C production rev-parse HEAD^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git -C production rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(git -C updates rev-parse HEAD)" = 8db85499605c34c6b72e664778fa709aa40dc963
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 8db85499605c34c6b72e664778fa709aa40dc963
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.34.0 --jq .object.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0 --jq .id)" = 379298288
          for run in 33313092778 33314444500 33314745327 33315452296 33315524945 33315611859 33315670683 33315793899 33315897887; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.33.0" and .target_version=="2.34.0" and .from_versions==["2.33.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.34.0" and .release_id==379298288 and .product_identity=="518d10f446ea85445d1110a3defafc5bcbece473" and .asset_name=="VF_Start_V2.34.0_UPDATE.zip" and .asset_bytes==1366286 and .asset_sha256=="0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.size' <<<"$REL")" = 1366286
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58
          echo P01_V2340_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.34 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2340-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2330_TO_V2340_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2340_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2340_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2340_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2340_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2330_TO_V2340_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2340_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2340_DATA_PRESERVATION=PASS
          P01_V2340_SQLITE_INTEGRITY=PASS
          P01_V2340_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2340_RUNTIME_FEATURE_BYTES=PASS
          P01_V2340_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2340-final-evidence
          if-no-files-found: warn
          retention-days: 90
