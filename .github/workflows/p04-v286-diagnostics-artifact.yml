name: P04 V2.8.6 Diagnostics Patch Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout runner patch
        uses: actions/checkout@v4
        with:
          path: runner
      - name: Checkout exact P04 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: hotfix/v2.8.6-diagnostics-run
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Patch exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test "$(git -C source rev-parse HEAD)" = '7542c023234d37823d12ea839cbafc476ca57474'
          python3 runner/scripts/p04-v286-patch.py source
          php -l source/src/app/SystemDiagnosticsService.php >/dev/null
          node --check source/public/assets/v284-long-action-feedback.js
          mkdir -p evidence/tree/src/app evidence/tree/public/assets evidence/tree/docs/operations/package evidence/tree/scripts
          cp source/VERSION evidence/tree/VERSION
          cp source/CHANGELOG.md evidence/tree/CHANGELOG.md
          cp source/docs/operations/package/RELEASE_NOTES.md evidence/tree/docs/operations/package/RELEASE_NOTES.md
          cp source/src/app/SystemDiagnosticsService.php evidence/tree/src/app/SystemDiagnosticsService.php
          cp source/public/assets/v284-long-action-feedback.js evidence/tree/public/assets/v284-long-action-feedback.js
          cp source/scripts/build-release-tree.py evidence/tree/scripts/build-release-tree.py
          git -C source diff -- VERSION CHANGELOG.md docs/operations/package/RELEASE_NOTES.md src/app/SystemDiagnosticsService.php public/assets/v284-long-action-feedback.js scripts/build-release-tree.py > evidence/V286.patch
          echo P04_V286_PATCH_ARTIFACT_PASS
          echo PRODUCTION_WRITE=0
      - name: Upload exact patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.6-DIAGNOSTICS-PATCH
          path: evidence/
          if-no-files-found: error
          retention-days: 30
