name: P01 Authority Sync Admin Public State
on:
  push:
    branches: [temp/p01-authority-sync-admin-public-state-20260901]
    paths: [.github/workflows/p01-authority-sync-admin-public-state-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_MERGE: 8b210c93f2d4c71126ff1aed6ec3d317abb51d15
      PRODUCT_TREE: c08166da380b3a4cae06be0a037f32fa7cf2b91e
      PRODUCT_CANDIDATE: aeee995f8a4b10f330938151bbc05b9fe5c74e82
      PRODUCT_PR: '159'
      MACHINE_GATE: '33418067027'
      ARTIFACT: '9767801096'
      ARTIFACT_SHA256: 84901f3d781f7a18c6103ebe744b7c467a5c8557dfcd2d13c61b68f956e4cb24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: authority/p01-l2-admin-public-state-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Authority-only mutation and fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_MERGE"
          test -z "$(git -C product status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('product')
          merge=os.environ['PRODUCT_MERGE']; tree=os.environ['PRODUCT_TREE']; cand=os.environ['PRODUCT_CANDIDATE']
          gate=int(os.environ['MACHINE_GATE']); artifact=int(os.environ['ARTIFACT']); digest=os.environ['ARTIFACT_SHA256']; pr=int(os.environ['PRODUCT_PR'])

          p=root/'VF_PROJECT.json'; data=json.loads(p.read_text())
          data['status']='V2.35.3 PRODUCTION CLOSURE PASS / L2 ADMIN + PUBLIC VIEW STATE PASS'
          data['current_change']={
            'change_id':'P01-L2-ADMIN-PUBLIC-VIEW-STATE-20260901',
            'base':'develop 5ee91a4e0c2ce66a5c22850ae09b1bd6c7cd8081',
            'result':'EXPLICIT ADMIN/PUBLIC VIEW STATE + SAFE AUTHENTICATED PUBLIC PREVIEW + SAFE LOGIN RETURN PASS / MERGED TO DEVELOP / NOT RELEASED',
            'schema_change':False,'migration':None,'latest_merge_pr':pr,
            'runtime_product_source':merge,'runtime_product_tree':tree,'latest_product_candidate':cand,
            'machine_gate':gate,'evidence_artifact':artifact,'evidence_artifact_sha256':digest,
            'browser_gate':'390 + 1440 / PASS','sqlite_integrity_fk':'PASS',
            'public_preview_authority':'ANONYMOUS READ AUTHORITY WHILE ADMIN SESSION REMAINS AUTHENTICATED',
            'preview_csrf':'SUPPRESSED / PASS','unsafe_return_routes':'ALLOWLISTED / PASS',
            'owner_production_write':False,'runner_main_write':False
          }
          data['develop_state']='L2 THROUGH PR #159 MERGED / ADMIN + PUBLIC VIEW STATE PASS / AHEAD OF MAIN / NOT RELEASED'
          data['current_authority']=f'Owner Production V2.35.3 Closure PASS / main Production Truth / develop runtime source {merge} tree {tree} / PR #159 explicit admin/public view state Gate {gate} PASS'
          data['next_action']='Current L2 admin/public view-state refinement is closed on develop. Continue only from new evidence-backed Product findings; do not promote to main, publish a Release, mutate core-updates or write Owner Production without a separate formal Release Gate.'
          data['l2_admin_public_view_state']={
            'pr':pr,'product_candidate':cand,'develop_product_merge':merge,'product_tree':tree,
            'machine_gate':gate,'evidence_artifact':artifact,'evidence_artifact_sha256':digest,
            'admin_state':'管理员视角 / 查看公开版','preview_state':'公开视角 / 返回管理','anonymous_state':'公开视角 / 登录',
            'preview_private_data_leak':'NONE / PASS','preview_workspace_payload':'SUPPRESSED / PASS','preview_csrf':'NULL / PASS',
            'login_return_allowlist':'PASS','preview_return_allowlist':'PASS','chromium_390_1440':'PASS','sqlite_integrity_fk':'PASS',
            'gate_r1':'HARNESS CHECKOUT ONLY','gate_r2':'HARNESS MOBILE SELECTOR ONLY','gate_r3':'PASS',
            'main_write':False,'production_write':False
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          marker='P01-L2-ADMIN-PUBLIC-VIEW-STATE-20260901'
          common=f'''\n\n## {marker}\n\n- Product PR: #{pr}\n- Product runtime source: `{merge}`\n- Product tree: `{tree}`\n- Exact Candidate: `{cand}`\n- Formal Machine Gate: `{gate}` — **PASS**\n- Evidence Artifact: `{artifact}`\n- Artifact SHA-256: `{digest}`\n- Runtime: Chromium 390 + 1440; `BROWSER_GATE=PASS`; SQLite `INTEGRITY=ok`; `FK=0`.\n- 管理员视角：明确显示“管理员视角 / 查看公开版”。\n- 登录管理员进入公开预览时：保留管理员 Session，但读取权限按匿名执行，明确显示“公开视角 / 返回管理”。\n- 公开预览不输出管理 Workspace Payload，不下发 CSRF，不显示管理操作；私人资源不可见。\n- 匿名 Functional 页面明确显示“公开视角 / 登录”，登录复用既有登录弹窗。\n- `preview_return` 与 `next` 均限同站白名单路由，外部/非法返回地址不会被接受。\n- Gate R1 为私有仓 checkout harness 问题；R2 为 390px 错点隐藏桌面按钮的 harness 问题；R3 对同一 Exact Candidate 完整 PASS。\n- Release / Tag / `main` / core-updates / Owner Production / Schema / Migration / Version：**NO WRITE**。\n'''
          files=[
            root/'docs/authority/CURRENT.md',
            root/'docs/handoff/CURRENT_STATE.md',
            root/'docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md',
          ]
          for f in files:
            s=f.read_text()
            if marker in s: raise SystemExit(f'duplicate marker: {f}')
            f.write_text(s.rstrip()+common+'\n')
          PY
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -C product diff --name-only | grep '^src/' || true)"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          git -C product commit -m 'docs(P01): record admin and public view state closure'
          git -C product push origin HEAD:authority/p01-l2-admin-public-state-20260901
          git -C product rev-parse HEAD
          git -C product rev-parse HEAD^{tree}
