name: P04 V258 Final Reconcile Transport Diagnostic
on:
  push:
    branches: [p04-v258-final-one-file-source-reconciliation-gate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print exact chunk identities
        shell: bash
        run: |
          set -Eeuo pipefail
          D=tools/p04/v258-final-reconcile
          for f in "$D"/finalrec.part*.b64; do
            echo "$(basename "$f") BYTES=$(wc -c < "$f") SHA256=$(sha256sum "$f" | awk '{print $1}')"
          done
          cat "$D"/finalrec.part*.b64 > "$RUNNER_TEMP/all.b64"
          echo "ALL BYTES=$(wc -c < "$RUNNER_TEMP/all.b64") SHA256=$(sha256sum "$RUNNER_TEMP/all.b64" | awk '{print $1}')"
          base64 -d "$RUNNER_TEMP/all.b64" > "$RUNNER_TEMP/tool.gz" || true
          echo "GZ BYTES=$(wc -c < "$RUNNER_TEMP/tool.gz") SHA256=$(sha256sum "$RUNNER_TEMP/tool.gz" | awk '{print $1}')"
          gzip -t "$RUNNER_TEMP/tool.gz" && echo GZIP_TEST=PASS || echo GZIP_TEST=FAIL
