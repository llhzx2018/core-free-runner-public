name: TEMP S01-C02 Ops 1.21.806 Avatar Classification Gate

on:
  push:
    branches:
      - temp/s01-c02-v121806-avatar-classification-gate-20260904

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: work/s01-c02-v121806-avatar-endpoint-classification-20260904
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-tools-ops
      - name: Candidate integrity and focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < vf-tools-ops/VERSION)" = '1.21.806'
          grep -Fq 'Version: 1.21.806' vf-tools-ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.806')" vf-tools-ops/vf-ops.php
          grep -Fq "define('VF_OPS_ROUND', 'AVATAR-ENDPOINT-CLASSIFICATION-V1')" vf-tools-ops/vf-ops.php
          grep -Fq "add_action('admin_bar_menu', 'vf_ops_bootstrap_admin_bar_menu_v121334', 85);" vf-tools-ops/vf-ops.php
          php -l vf-tools-ops/vf-ops.php
          php -l vf-tools-ops/includes/cf-release/checker-inspect-parts/03-links.php
          php -l vf-tools-ops/.github/phase3/v121806-avatar-endpoint-classification.php
          php vf-tools-ops/.github/phase3/v121806-avatar-endpoint-classification.php
          echo 'PASS_V121806_BOOTSTRAP_INTEGRITY'
          echo 'PASS_V121806_AVATAR_CLASSIFICATION_GATE'
