name: P01 Authority Sync Mobile Form No Change
on:
  push:
    branches: [temp/p01-authority-sync-mobile-form-no-change-20260831]
    paths:
      - .github/workflows/p01-authority-sync-mobile-form-no-change-20260831.yml
      - scripts/p01_sync_mobile_form_no_change_20260831.py
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTH_BASE: 3eddb4ceb20743528a386b98dfee72c217bc284d
      AUTH_BRANCH: authority/p01-l2-mobile-form-no-change-20260831
    steps:
      - name: Checkout runner script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: temp/p01-authority-sync-mobile-form-no-change-20260831
          path: runner
      - name: Checkout authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.AUTH_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Assert exact authority base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$AUTH_BASE"
          test -z "$(git -C product status --porcelain)"
      - name: Sync four authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/p01_sync_mobile_form_no_change_20260831.py product
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          git -C product diff --check
      - name: Authority changed-file fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C product diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          expected=(VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md docs/handoff/CURRENT_STATE.md)
          test "${#files[@]}" -eq 4
          for i in 0 1 2 3; do test "${files[$i]}" = "${expected[$i]}"; done
          test -z "$(git -C product diff --name-only | grep '^src/' || true)"
      - name: Commit authority branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md
          git -C product commit -m 'docs(P01): close mobile form usability as no-change'
          git -C product push origin HEAD:$AUTH_BRANCH
