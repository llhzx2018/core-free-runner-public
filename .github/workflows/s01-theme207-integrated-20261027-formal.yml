name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme207-integrated-20261027]
    paths: ['.github/workflows/s01-theme207-integrated-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.207
  TARGET_SHA: 19d47c311d8d85c6b9e6fbc1cdd38781c736c55b
  TARGET_TREE: abe0cc62d1f227b347780cf252a8973bebca180e
  BASE_SHA: d5e5a77f0626eb93d4b6ad7a4ce5565deaabee53
  LANE_ID: s01-theme207-integrated-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme207-integrated-20261027/formal-spec.json --input control/.github/workflows/s01-theme207-integrated-20261027-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 19d47c311d8d85c6b9e6fbc1cdd38781c736c55b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40463540213 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40463540213 --jq .head_sha)" = e94ddcc10c0aca0c5d4c5497623fc2228c466664
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40463540213 --repo llhzx2018/core-free-runner-public --name s01-home-40463540213 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme207-integrated-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='7efc0d02dedd82df8dd72bbe485f58cd56c82dea'
          assert json.loads((r/'results.json').read_text())['status']=='PASS'
          assert json.loads((r/'results.json').read_text())['checks']>=116
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          assert json.loads((r/'progress-navigation.json').read_text())['reviewSubjects']==22
          assert json.loads((r/'native-lifecycle.json').read_text())['status']=='PASS'
          assert 'S01_C01_FRONTEND_REVIEW_NAVIGATION_WORDPRESS_PASS' in (r/'navigation-smoke.txt').read_text()
          assert 'AUTHORED_HERO_AND_PAGE_TITLE_PRESERVED_PASS' in (r/'hero-check.txt').read_text()
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'404-{lang}-{width}.png').stat().st_size>500
                  geo=json.loads((r/f'geometry-{lang}-{width}.json').read_text())
                  assert abs(geo['hero']['x']+geo['hero']['width']/2-width/2)<2
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='eeaf5e4bb4794c6cd73525538d093119594fc00446039f848003fd65f3aadb0a' and new['bytes']==2010566
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme207-integrated-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='7efc0d02dedd82df8dd72bbe485f58cd56c82dea' and coverage['tree']=='abe0cc62d1f227b347780cf252a8973bebca180e'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40463540213'
          coverage['merged_source']='19d47c311d8d85c6b9e6fbc1cdd38781c736c55b'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.207 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.207 provider/vf-tools-theme_V1.35.207.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.207' --notes '前台页面总览增加可见的逐页优化/验收入口及每页关联，20类页型和公共页头/页尾复用既有记录，不新增菜单或自动写入人工通过。参照GOV.UK错误页精修中英文404：居中基线、简洁说明、站内搜索和真实恢复链接，移除重复编号/框线，保留自定义文案、操作、列数及开关；推荐摘要被动去除HTML与已注册短代码，不执行内容。最终207精确源码经116项双语Chromium1440/1024、原生目录22项记录链接、干净安装/登录/安装锁、206升级207/回退/重复安装及数据保护验证。476运行文件，正式ZIP远端字节一致；保存的文章、SEO、菜单及人工备注不覆盖。手机暂缓，Production仅由Owner手工升级，正式站人工验收仍待完成。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.207 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.207 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.207 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.207.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.207.zip remote/vf-tools-theme_V1.35.207.zip
          echo 'eeaf5e4bb4794c6cd73525538d093119594fc00446039f848003fd65f3aadb0a  remote/vf-tools-theme_V1.35.207.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.207.zip)" = 2010566
          gh release view v1.35.207 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
