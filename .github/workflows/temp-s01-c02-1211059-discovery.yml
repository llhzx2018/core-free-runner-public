name: S01-C02 1.21.1059 Discovery Verify
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_ops_discovery_1059
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Verify WordPress update discovery
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/vf-ops-discovery-1059"
          WP="$ROOT/wordpress"
          mkdir -p "$WP" "$ROOT/release"

          gh release download v1.21.1058 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1058.zip --dir "$ROOT/release" --clobber
          test "$(sha256sum "$ROOT/release/vf-tools-ops_V1.21.1058.zip" | awk '{print $1}')" = "0a98e86b205ecb155c8fafbea791fb1312d64c47e708563eb092b47f93d22b11"

          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          chmod +x "$ROOT/wp"
          wp(){ php "$ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_ops_discovery_1059 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18181 --title='Ops Discovery 1059' --admin_user=admin --admin_password='Fixture-Discovery-1059!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "$ROOT/release/vf-tools-ops_V1.21.1058.zip" --activate >/dev/null

          wp eval '$r=vf_ops_wp_update_manual_check_v1(); echo json_encode($r,JSON_UNESCAPED_SLASHES);' > "$ROOT/discovery.json"
          cat "$ROOT/discovery.json"

          jq -e '
            .ok==true
            and .status=="UPDATE_AVAILABLE"
            and .manifest.target_version=="1.21.1059"
            and .manifest.release_tag=="v1.21.1059"
            and .manifest.asset_name=="vf-tools-ops_V1.21.1059.zip"
            and .manifest.asset_bytes==3529869
            and .manifest.asset_sha256=="963fd85f7d42db21504a7793bc20d5607b1a21616e6cd56d1f9cd1669e1b9acc"
            and .release.target_version=="1.21.1059"
            and .release.asset_bytes==3529869
            and .release.asset_sha256=="963fd85f7d42db21504a7793bc20d5607b1a21616e6cd56d1f9cd1669e1b9acc"
          ' "$ROOT/discovery.json" >/dev/null

          echo WORDPRESS_DISCOVERY=PASS
