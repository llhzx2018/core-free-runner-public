name: P07 Release10 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release10-readback-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private readback candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 83154351cc67879751ee6a383faa6ab513ccffdb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Authority identity
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '83154351cc67879751ee6a383faa6ab513ccffdb'
          test "$(cat BUILD_ID)" = '0.1.0-release10'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null
          python3 -m unittest -v tests.test_p07_integration_manifest
          grep -Fq '0567d9cbfe8cd83cd3569f6bc37880bfca523cdd' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq '90217676ca343b0a64de3d072d824ece17f6bad2' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq 'release10 小白化中文菜单' docs/authority/CURRENT.md
          grep -Fq '36677009690' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq '36677155521' docs/authority/ACCEPTANCE_MATRIX.md

      - name: Full product regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release10'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE10_READBACK_SOURCE=83154351cc67879751ee6a383faa6ab513ccffdb'
          echo 'P07_RELEASE10_READBACK_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
