name: TEMP S01-C02 1.21.953 Distribution Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-s01-c02-121953-distribution-proof.yml'

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 05096615acdd13dd4b62ec17bc0f004e532cc319
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 2068e4b1435d28ab5333ca076f95f371a6559b95
      TAG: v1.21.953
      ASSET: vf-tools-ops_V1.21.953.zip
      ASSET_BYTES: '3405362'
      ASSET_SHA256: 69d0317e72cdd9723685eaa50ac10d7e3e393cba0551511c49ed96ab5793d928
      RUNTIME_FILES: '961'
      RUNTIME_FP: a4f71ac44e11c45bf90d26b4ccb38a7f2cf094034fdf8fcbf5f5526a67f3b07e

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.953"
          assert m["release_tag"]=="v1.21.953"
          assert m["asset_name"]=="vf-tools-ops_V1.21.953.zip"
          assert m["asset_bytes"]==3405362
          assert m["asset_sha256"]=="69d0317e72cdd9723685eaa50ac10d7e3e393cba0551511c49ed96ab5793d928"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="a4f71ac44e11c45bf90d26b4ccb38a7f2cf094034fdf8fcbf5f5526a67f3b07e"
          assert m["runtime_file_count"]==961
          assert m["runtime_fingerprint_sha256"]=="a4f71ac44e11c45bf90d26b4ccb38a7f2cf094034fdf8fcbf5f5526a67f3b07e"
          assert "1.21.952" in m["from_versions"]
          assert m["schema_from"]=="6.0.0"
          assert m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 1.21.953 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          echo "S01-C02 1.21.953 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
