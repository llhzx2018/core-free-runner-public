name: P01 YouTube Cover Modal One-shot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-youtube-covers-1563.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXACT_SHA: 504318b63bb59d67e4ab8930fe9a61a35e048d4a
      BASELINE: v2.47.403
    steps:
      - name: Checkout public test control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,simplexml,mbstring
          coverage: none
      - name: Get exact private test source ephemerally
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-cover-1563"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_TEST_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone --quiet --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          git clone -q --depth 1 --branch "$BASELINE" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/stable"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          echo 'P01_YOUTUBE_COVER_EXACT_SOURCE=PASS'
      - name: Native modal and existing YouTube focused checks
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_ROOT/candidate"
          php -m | grep -Fx curl
          php -m | grep -Fx SimpleXML
          php -m | grep -Fx mbstring
          node --check src/assets/channel-youtube-updates.js
          node --check tests/integration/youtube_modal_thumbnails_node.js
          node tests/integration/youtube_modal_thumbnails_node.js
          node tests/integration/youtube_batch_sequential_node.js
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          test ! -e src/app/YouTubeApiFallback.php
          echo 'P01_YOUTUBE_COVER_FOCUSED=PASS'
      - name: Baseline canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$P01_TEST_ROOT/candidate/tests/canonical_release_regression.sh" \
            "$P01_TEST_ROOT/candidate" "$P01_TEST_ROOT/stable" --require-zero-debt \
            | tee "$P01_TEST_ROOT/canonical.log"
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$P01_TEST_ROOT/canonical.log"
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' "$P01_TEST_ROOT/canonical.log"
          test -z "$(git -C "$P01_TEST_ROOT/candidate" status --porcelain)"
          echo 'P01_YOUTUBE_COVER_CANONICAL=PASS'
      - name: Remove temporary source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${P01_TEST_ROOT:-}" ]; then rm -rf -- "$P01_TEST_ROOT"; fi
          echo 'P01_YOUTUBE_COVER_EPHEMERAL=PASS'
