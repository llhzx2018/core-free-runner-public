name: P05 V1.2.2 Formal FULL Publication
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-formal-full-20260902.yml']
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-formal-full-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_MAIN_SOURCE: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      P05_VERIFIED_TREE: 0822f722244724c666d7aa660634e247436f1c12
      P05_EXACT_SOURCE: 5885cc37147ea9450cd648e408c9b2e1ffb4b848
      P05_FINAL_GATE_RUN: '33532743356'
      P05_FINAL_GATE_JOB: '99939619178'
      VERSION: 1.2.2
      PREVIOUS_PRODUCTION_VERSION: 1.2.1
      ASSET: VF_SEO_V1.2.2_FULL.zip
      RECEIPT: VF_SEO_V1.2.2_RELEASE_RECEIPT.txt
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Bind Final Exact Source PASS
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$P05_FINAL_GATE_RUN" > /tmp/final-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$P05_FINAL_GATE_JOB" > /tmp/final-job.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/final-run.json')); job=json.load(open('/tmp/final-job.json'))
          assert run['id']==int(os.environ['P05_FINAL_GATE_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['P05_FINAL_GATE_JOB']) and job['run_id']==int(os.environ['P05_FINAL_GATE_RUN']) and job['conclusion']=='success'
          assert job['name']=='p05-v122-final-exact-source-r2'
          print('P05_V122_FINAL_GATE_BINDING=PASS')
          PY
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05
      - name: Verify exact promotion and Owner-observed baseline
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(git rev-parse "$P05_EXACT_SOURCE^{tree}")" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'),v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.2') process.exit(1);
          if(v.version!=='1.2.2'||v.target_version!=='1.2.2'||v.working_version!=='1.2.2') process.exit(1);
          if(v.production_version!=='1.2.1') process.exit(1);
          if(v.production_deployment_authorization!=='NOT_AUTHORIZED / OWNER_REQUESTED_VPS_UPDATE_FILE_ONLY') process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          echo 'P05_V122_MAIN_TREE_EQUIVALENT=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm, cache-dependency-path: p05/package-lock.json }
      - name: Install dependencies and PHP runtime modules
        run: |
          set -Eeuo pipefail
          cd p05 && npm ci && cd ..
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl sqlite3
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e))exit(1);} if(!class_exists("ZipArchive"))exit(1);'
      - name: Complete engineering and security regression
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
      - name: PHP CloudPanel and browser regression
        working-directory: p05
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = "$VERSION"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' "$S/PHP_RELEASE_MANIFEST.json" >/dev/null
          ! grep -F 'core-free-runner-public' "$S/PHP_RELEASE_MANIFEST.json"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh
      - name: Rebuild pristine formal staging
        working-directory: p05
        run: |
          set -Eeuo pipefail
          rm -rf build/vf-seo-php-release dist/client
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.env"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -name runtime.env -o -name setup.lock.json \) | grep -q .; then exit 1; fi
      - name: Deterministic FULL build
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release'); asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix(); info=ZipInfo(rel,(1980,1,1,0,0,0)); info.external_attr=((p.stat().st_mode & 0o777)&0xFFFF)<<16; info.compress_type=ZIP_DEFLATED; z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a'); build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"; rm "../$ASSET.b"
          sha="$(sha256sum "../$ASSET"|awk '{print $1}')"; bytes="$(stat -c%s "../$ASSET")"
          files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_EXACT_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nUPDATE_AUTHORITY=core-updates:llhzx2018/core-updates/projects/P05.json\nBINARY_AUTHORITY=llhzx2018/vf-seo Release UPDATE.zip\nATOMIC_AUTHORITY=repair-v*.php\nPREVIOUS_PRODUCTION_VERSION=%s\nPRODUCTION_WRITE=0\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_EXACT_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" "$PREVIOUS_PRODUCTION_VERSION" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"; echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"; echo "P05_SHA256=$sha" >> "$GITHUB_ENV"
          echo "P05_V122_FULL_SHA256=$sha"
      - name: Publish private Product Release v1.2.2 FULL
        env: { GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}' }
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then echo "release v$VERSION already exists" >&2; exit 1; fi
          gh release create "v$VERSION" --repo llhzx2018/vf-seo --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.2.2 · Product v2 Update Entry Hotfix' \
            --notes 'V1.2.2 restores the existing System Update entry inside the Product v2 Global navigation. The updater backend, authentication, schema, dataset and data semantics are unchanged. The hotfix adds Product v2 .p05v2-secondary as a verified portal host while preserving classic .secondary-nav support. Native CI and a separate Final Exact Source Gate passed on the frozen release tree. Schema remains VF-SEO-SCHEMA@1/1 and SQLite remains the default database. This step publishes the formal FULL binary; the direct v1.2.1 → v1.2.2 Atomic UPDATE/repair and core-updates channel are gated separately. Production installation is not performed.' \
            "$ASSET" "$RECEIPT"
      - name: Remote readback FULL Release truth
        env: { GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}' }
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release.json')); a={x['name']:x for x in r['assets']}
          assert r['tag_name']=='v'+os.environ['VERSION']; assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          full=a[os.environ['ASSET']]; assert int(full['size'])==int(os.environ['P05_BYTES']); assert full.get('digest')=='sha256:'+os.environ['P05_SHA256']; assert os.environ['RECEIPT'] in a
          print('P05_RELEASE_ID='+str(r['id'])); print('P05_FULL_ASSET_ID='+str(full['id'])); print('P05_V122_FORMAL_FULL_PUBLICATION=PASS'); print('P05_CORE_UPDATES_WRITE=0'); print('P05_PRODUCTION_WRITE=0')
          PY
