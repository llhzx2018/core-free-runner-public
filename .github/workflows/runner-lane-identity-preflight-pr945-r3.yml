name: Runner Lane Identity Preflight PR945 R3

on:
  push:
    branches:
      - run/runner-lane-preflight-pr945-r3-20260919
    paths:
      - '.github/workflows/runner-lane-identity-preflight-pr945-r3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 57f20bc6191af94dc4a940d1d15bb1048aabf3a7
          persist-credentials: false
      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "57f20bc6191af94dc4a940d1d15bb1048aabf3a7"
          python3 -m unittest tests.test_ephemeral_lane_spec -v
          python3 -m py_compile scripts/ephemeral_lane_spec.py
          echo RUNNER_LANE_IDENTITY_PREFLIGHT_PR945_R3=PASS
