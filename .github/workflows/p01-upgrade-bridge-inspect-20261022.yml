name: P01 Upgrade Bridge Contract Inspection (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-upgrade-bridge-inspect-20261022.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect non-secret Atomic source matching contract
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir /tmp/p01-bridge
          gh release download v2.47.419 -R llhzx2018/vf-start -D /tmp/p01-bridge -p 'VF_Start_V2.47.419_UPDATE.zip'
          unzip -p /tmp/p01-bridge/VF_Start_V2.47.419_UPDATE.zip repair-v2.47.419.php >/tmp/p01-bridge/repair.php
          echo '=== Atomic source-alternate callsites ==='
          grep -n -B 8 -A 20 'self::SOURCE_ALTERNATES' /tmp/p01-bridge/repair.php | head -130
          echo '=== schema, expected patterns and source match functions ==='
          grep -n -E 'SOURCE_VERSION|SOURCE_ALTERNATES|SOURCE_MANIFEST|verifySource|resolveSource|sourceVersion|currentVersion' /tmp/p01-bridge/repair.php | head -65
          echo P01_ATOMIC_BRIDGE_INSPECT=PASS
