name: P01 YouTube diagnostics dialog real browser gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-youtube-dialog-hit-test.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: cb6a9efaaf2c589b8b5dd937817d5c3c13781041
    steps:
      - name: Prepare exact source PHP and JS runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-xml php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring|simplexml|curl'
          node --version
      - name: Checkout exact product candidate plus official baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git"
          live="$(git ls-remote "$remote" refs/heads/fix/p01-channel-youtube-dialog-click-20261021 | awk '{print $1}')"
          test "$live" = "$PRODUCT_SHA"
          git clone -q --no-checkout "$remote" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git clone -q --depth 1 --branch v2.47.399 "$remote" baseline
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < candidate/VERSION)" = "2.47.399"
          echo P01_YOUTUBE_DIALOG_EXACT_SOURCE=PASS
      - name: Focused PHP, CSS layering and Javascript contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_youtube_diagnostic_overlay_contract.php
          node --check src/assets/channel-youtube-updates.js
          node --check tests/e2e/channel_youtube_dialog_click.js
          php tests/unit/channel_youtube_diagnostic_overlay_contract.php
          php tests/unit/channel_card_action_hierarchy_contract.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          echo P01_YOUTUBE_DIALOG_FOCUSED=PASS
      - name: Install temporary browser test dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --prefix /tmp/p01-yt-browser --no-save --no-audit --no-fund playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-yt-chromium /tmp/p01-yt-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser hit-test, local dialog, external row and guest
        shell: bash
        run: |
          set -Eeuo pipefail
          NODE_PATH=/tmp/p01-yt-browser/node_modules PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-yt-chromium node candidate/tests/e2e/channel_youtube_dialog_click.js
      - name: Canonical full zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/p01-youtube-dialog-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-youtube-dialog-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-youtube-dialog-canonical.txt
          echo P01_YOUTUBE_DIALOG_CANONICAL=PASS
      - name: No Production or Release changes
        run: echo P01_YOUTUBE_DIALOG_PRODUCTION_UNCHANGED=PASS
