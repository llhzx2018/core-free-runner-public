name: P01 P0 private legacy v515 owner-only native HTTPS (temporary)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  private-515-native-https:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Ensure registered one-off test identity and private read capability
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d65-official-247515-install-restore-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_P0_PRIVATE_TEST_INPUTS=SYNTHETIC_ONLY"
      - name: Checkout exact private P01 draft source in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 787cede0f17749e51f03e120fd1ef3746699999c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Exact identity and PHP Python test syntax check
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "787cede0f17749e51f03e120fd1ef3746699999c"
          test "$(cat candidate/VERSION)" = "2.47.515"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.515"
          python3 -m py_compile candidate/tests/integration/p01_private_legacy_full_http.py
          echo "P01_P0_EXACT_SOURCE=787cede0f17749e51f03e120fd1ef3746699999c"
      - name: Prepare native isolated Nginx PHP-FPM and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-private-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mbstring \
            php8.3-curl php8.3-zip openssl curl \
            >> "$RUNNER_TEMP/p01-private-apt.txt" 2>&1
          php8.3 -l candidate/src/app/PrivateAccess.php
          php8.3 -l candidate/src/app/bootstrap.php
          php8.3 -l candidate/src/app/Seo.php
          php8.3 -l candidate/src/index.php
          php8.3 -l candidate/src/api.php
          php8.3 -l candidate/src/asset.php
          php8.3 -m | grep -Fxi pdo_sqlite
          command -v nginx
          command -v php-fpm8.3
          echo "P01_P0_NATIVE_HTTPS_AND_PHP_FPM=READY"
      - name: Verify source contracts and isolated Nginx static block baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/unit/p01_private_owner_gate_contract.php
          php8.3 candidate/tests/integration/p01_nine_entry_auth_shell_contract.php
          bash candidate/tests/integration/p01_private_nginx_static_contract.sh
          echo "P01_P0_PRIVATE_SOURCE_AND_NGINX_STATIC_CONTRACT=PASS"
      - name: Download and verify official released v2.47.515 FULL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p01-private-old-full"
          gh release download v2.47.515 --repo llhzx2018/vf-start \
            --pattern VF-Start-V2.47.515-FULL.zip \
            --dir "$RUNNER_TEMP/p01-private-old-full" \
            > "$RUNNER_TEMP/p01-private-release-fetch.txt" 2>&1
          file="$RUNNER_TEMP/p01-private-old-full/VF-Start-V2.47.515-FULL.zip"
          test -f "$file"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_P0_OFFICIAL_515_FULL_ASSET_DIGEST=PASS"
      - name: Actually install old Owner then verify #1967 Guest Owner plus real Nginx HTTPS historical static
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_PRIVATE_LEGACY_ISOLATED=YES python3 \
            candidate/tests/integration/p01_private_legacy_full_http.py \
            --release-full "$RUNNER_TEMP/p01-private-old-full/VF-Start-V2.47.515-FULL.zip" \
            --candidate-root candidate > "$RUNNER_TEMP/p01-private-results.txt" 2>&1; then
            grep -E '^P01_P0_' "$RUNNER_TEMP/p01-private-results.txt" | tail -n 12 || true
            exit 1
          fi
          grep -E '^P01_P0_' "$RUNNER_TEMP/p01-private-results.txt"
          for name in \
            P01_P0_AUTHENTIC_515_FULL_SYNTHETIC_OWNER_INSTALLED \
            P01_P0_LEGACY_RELEASE_PRIVATE_OVERLAY_NO_OWNER_DATA_WRITE \
            P01_P0_12_GUEST_DENIED_12_OWNER_WORKSPACES_REAL_HTTPS \
            P01_P0_STATIC_ARCHIVE_PRIVATE_DENY_REAL_NGINX_FPM \
            P01_P0_CANONICAL_OWNER_LOGIN_AND_API_SEPARATION \
            P01_P0_OFFICIAL_RELEASE_ISOLATED_REHEARSAL; do
              grep -Fx "$name=PASS" "$RUNNER_TEMP/p01-private-results.txt"
          done
          grep -Fx 'P01_P0_LIVE_CLOUDPANEL_EFFECTIVE_INCLUDE=NOT_PROVEN' "$RUNNER_TEMP/p01-private-results.txt"
          grep -Fx 'P01_P0_ROLLBACK_UNPATCHED_515_PUBLIC_READY=NO' "$RUNNER_TEMP/p01-private-results.txt"
          echo "P01_P0_OWNER_ONLY_REAL_OLD_515_HTTPS_STAGE=PASS"
      - name: Clear private source and official test asset
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/p01-private-old-full"
          rm -f -- "$RUNNER_TEMP/p01-private-apt.txt" \
            "$RUNNER_TEMP/p01-private-release-fetch.txt" "$RUNNER_TEMP/p01-private-results.txt"
          echo "P01_P0_PUBLIC_RUNNER_PRIVATE_SOURCE_ASSET_PERSISTED=NO"
          echo "P01_P0_PUBLIC_ARTIFACT_UPLOAD=NONE"
