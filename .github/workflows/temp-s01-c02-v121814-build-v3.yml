name: TEMP S01-C02 v1.21.814 Build V3
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121814-build-v3.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fix/s01-static-source-recovery-v2-v121814
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/s01-c03-v12519-runtime-authority-probe-20260905
          persist-credentials: false
          path: runner
      - name: Patch candidate
        working-directory: ops
        run: python3 ../runner/.github/scripts/temp-s01-c02-v121814-build-fix.py
      - name: Lint and focused contract
        working-directory: ops
        run: |
          set -Eeuo pipefail
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/v121814-php-lint.txt
          php .github/phase3/v121814-static-source-recovery-v2.php
          grep -Fq 'vf_ops_lifecycle_cleanup_volatile_v121377(true)' includes/content-model/lifecycle-service.php
          grep -Fq 'vf_ops_lifecycle_cleanup_volatile_v121377(false)' includes/content-model/lifecycle-service.php
          echo PHP_AND_FOCUSED_CONTRACT=PASS
      - name: Commit and push candidate
        working-directory: ops
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION vf-ops.php includes/content-model/lifecycle-service.php includes/release/async-job-parts/01-job-create-trait.php includes/release/async-job-parts/03-job-state-trait.php includes/site-release/s01-static-source-recovery-v2.php includes/site-release/s01-static-candidate-readiness.php .github/phase3/v121814-static-source-recovery-v2.php
          git diff --cached --check
          git commit -m 'fix(S01-C02): recover preserved Simply Static source safely'
          git push origin HEAD:fix/s01-static-source-recovery-v2-v121814
          echo CANDIDATE_SHA=$(git rev-parse HEAD)
          echo CANDIDATE_TREE=$(git rev-parse HEAD^{tree})
          echo PASS_V121814_BUILD
