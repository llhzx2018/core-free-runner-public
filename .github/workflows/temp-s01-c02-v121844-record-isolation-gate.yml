name: TEMP S01-C02 Ops 1.21.844 Record Isolation Gate
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-record-isolation-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 773f66141342886ae9fcf9ea765813239c60408d
      TREE: 0694ef55dfb40a3163116a05ad17af3a2be89694
      BASE: 904a68e3a60aa58c5d7af8d725f3393f22e9be07
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      CORE_UPDATES: b62e30a09c94c7b556910bd2d82944e727ed4ef1
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source and Phase3
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.844'
          php -l ops/includes/site-release/s01-static-record-isolation-retry-v121844.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121844-record-isolation-retry.php >/dev/null
          php ops/.github/phase3/v121844-record-isolation-retry.php | grep -Fxq 'PASS_V121844_RECORD_ISOLATION_RETRY'
      - name: Verify narrow diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$BASE" "$COMMIT")
          test "${#files[@]}" = 4
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121844-record-isolation-retry.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-record-isolation-retry-v121844.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Verify Engineering authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$CORE_UPDATES"
      - name: Verify Production 1.21.843 exact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.843" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.843" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRootItemStatus=="fail" and .sourceRecoveryRootItemCode=="root_item_candidate_terminal" and .sourceRecoveryRootItemCandidateStatus=="fail" and .sourceRecoveryRootItemCandidateCurrentStage==1 and .sourceRecoveryRootItemCandidateAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryDurableKickStatus=="blocked" and .sourceRecoveryDurableKickCode=="durable_kick_candidate_already_terminal"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryCanonicalFinalAuditRetryStatus=="not_run" and .sourceRecoveryCanonicalFinalAuditRetryCode=="canonical_final_audit_not_found" and .sourceRecoveryCanonicalFinalAuditRetryEligibleCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121844_FOCUSED_GATE
