name: TEMP VFTEST GOV213 exact-source closure review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-vftest-gov213-review.yml'
permissions:
  contents: read
jobs:
  gov-source:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'validation/vf-test-gov213-exact-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private GOV source only temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 09df22bb0a716867f6ec8fe45a4b8ef24b2f4d2e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: transient-gov-source
      - name: Check actual GOV candidate source scope and run existing authority gates
        shell: bash
        env:
          GOV_HEAD: 09df22bb0a716867f6ec8fe45a4b8ef24b2f4d2e
          GOV_BASE: e57edc475b44df7d682c857703dabc3d75fc8193
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-gov-source
          test "$(git rev-parse HEAD)" = "$GOV_HEAD" || { echo SOURCE_MISMATCH; exit 2; }
          test -z "$(git status --porcelain)" || { echo DIRTY_SOURCE; exit 2; }
          git cat-file -e "$GOV_BASE^{commit}"
          test "$(git -c core.quotepath=false diff --name-only "$GOV_BASE" "$GOV_HEAD" | sort)" = "$(printf '%s\n' CURRENT.md governance/agent/VF_AGENT_INFRA_AUTHORITY.md 中文文档导航.md | sort)" || { echo GOV_SCOPE_DRIFT; exit 2; }
          echo GOV_EXACT_SOURCE_SCOPE=PASS
          if python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" > /dev/null 2>&1; then
            echo GOV_GLOBAL_CLOSURE_LINT=PASS
          else
            echo GOV_GLOBAL_CLOSURE_LINT=FAIL
            exit 1
          fi
          if python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" > /dev/null 2>&1; then
            echo GOV_CURRENT_DEPENDENCY_LINT=PASS
          else
            echo GOV_CURRENT_DEPENDENCY_LINT=FAIL
            exit 1
          fi
          if python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' > /dev/null 2>&1; then
            echo GOV_GLOBAL_CLOSURE_REGRESSION=PASS
          else
            echo GOV_GLOBAL_CLOSURE_REGRESSION=FAIL
            exit 1
          fi
          echo GOV_EXACT_SOURCE_SHA="$GOV_HEAD"
          echo GOV_PUBLIC_SAFE_EVIDENCE_ONLY=YES
      - name: Remove private GOV source
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- transient-gov-source
          test ! -e transient-gov-source
          echo GOV_TRANSIENT_SOURCE_CLEANUP=PASS
