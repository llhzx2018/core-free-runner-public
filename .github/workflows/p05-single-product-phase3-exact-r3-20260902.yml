name: P05 Single Product Phase 3 Exact Gate R3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-phase3-exact-r3-20260902.yml'
      - 'scripts/p05_phase3_browser_journey_r3.py'

permissions:
  contents: read

jobs:
  gate:
    if: github.event.pull_request.head.ref == 'test/p05-single-product-phase3-exact-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 675cd9cd753a8420a50a81724d048e4d77a5b3ee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p05
      - name: Exact source seal
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '675cd9cd753a8420a50a81724d048e4d77a5b3ee'
          test "$(git rev-parse HEAD^{tree})" = '24cefc7f77a9d853a9c5e5c38e6557e0681c185c'
          test "$(cat VERSION)" = '1.2.3'
          test "$(grep -RIl '/api/system/update/apply' src/client --include='*.tsx' | wc -l | tr -d ' ')" = '1'
          ! grep -q '/api/system/update/apply' src/client/CommonSystemCenter.tsx
          echo 'P05_PHASE3_R3_EXACT_SOURCE=PASS'
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Build and targeted contracts
        working-directory: p05
        env:
          VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          set -Eeuo pipefail
          npm ci
          npm run typecheck
          npm run build
          node --import tsx --test tests/contract/single-product-shell.test.ts tests/contract/common-system-human-ui.test.ts tests/unit/product-simple-update-ux-truth.test.ts tests/unit/demo-dataset.test.ts tests/unit/product-metric-truth.test.ts
      - name: Real-use Chrome Product Journey R3
        working-directory: p05
        env:
          VF_DATABASE_PROVIDER: sqlite
          VF_SQLITE_PATH: /tmp/p05-phase3-browser-r3.sqlite3
          VF_BACKUP_DIR: /tmp/p05-phase3-browser-r3-backups
          VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          VF_ADMIN_USERNAME: phase3-owner
          VF_ADMIN_PASSWORD: Phase3BrowserPass-2026!
          PORT: '18189'
          NODE_ENV: test
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          P05_BASE_URL: http://127.0.0.1:18189
          P05_BROWSER_USERNAME: phase3-owner
          P05_BROWSER_PASSWORD: Phase3BrowserPass-2026!
        run: |
          set -Eeuo pipefail
          rm -f "$VF_SQLITE_PATH"
          rm -rf "$VF_BACKUP_DIR"
          npm run migrate
          npm run bootstrap:admin
          npm start >/tmp/p05-phase3-r3-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          python3 ../scripts/p05_phase3_browser_journey_r3.py
      - name: Terminal exact seal
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '675cd9cd753a8420a50a81724d048e4d77a5b3ee'
          test "$(git rev-parse HEAD^{tree})" = '24cefc7f77a9d853a9c5e5c38e6557e0681c185c'
          test "$(cat VERSION)" = '1.2.3'
          echo 'P05_PHASE3_R3_EXACT_SEAL=PASS'
          echo 'P05_PHASE3_RELEASE_WRITE=0'
          echo 'P05_PHASE3_PRODUCTION_WRITE=0'
