name: P04 VF Infra V2.5.8 Post-Upgrade Public Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v258-post-upgrade-public-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
      VF_INFRA_SSH_HOST: ${{ secrets.VF_INFRA_SSH_HOST }}
      VF_INFRA_SSH_USER: ${{ secrets.VF_INFRA_SSH_USER }}
      VF_INFRA_SSH_PRIVATE_KEY: ${{ secrets.VF_INFRA_SSH_PRIVATE_KEY }}
      P04_SSH_HOST: ${{ secrets.P04_SSH_HOST }}
      P04_SSH_USER: ${{ secrets.P04_SSH_USER }}
      P04_SSH_PRIVATE_KEY: ${{ secrets.P04_SSH_PRIVATE_KEY }}
      CLOUDPANEL_SSH_HOST: ${{ secrets.CLOUDPANEL_SSH_HOST }}
      CLOUDPANEL_SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
      CLOUDPANEL_SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
    steps:
      - name: Read public Production version
        shell: bash
        run: |
          set -Eeuo pipefail
          HTML="$RUNNER_TEMP/login.html"
          curl -fsSL --max-time 20 'https://infra.kewaro.com/login.php' -o "$HTML"
          grep -Fq 'VF Infra · V2.5.8' "$HTML"
          echo 'PRODUCTION_PUBLIC_VERSION=2.5.8'
          echo 'PRODUCTION_PUBLIC_VERSION_READBACK=PASS'

      - name: Confirm protected maintenance boundary remains authenticated
        shell: bash
        run: |
          set -Eeuo pipefail
          HEADERS="$RUNNER_TEMP/maintenance.headers"
          curl -sS --max-time 20 -D "$HEADERS" -o /dev/null 'https://infra.kewaro.com/maintenance.php'
          STATUS="$(awk 'toupper($1) ~ /^HTTP\// {s=$2} END {print s}' "$HEADERS")"
          LOCATION="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); print $2}' "$HEADERS" | tail -1)"
          test "$STATUS" = '302'
          printf '%s' "$LOCATION" | grep -Fq 'login.php?return=maintenance.php'
          echo 'MAINTENANCE_AUTH_BOUNDARY=PASS'

      - name: Probe known secure Production reconciliation channels
        shell: bash
        run: |
          set -Eeuo pipefail
          admin=0; ssh_host=0; ssh_user=0; ssh_key=0
          for name in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do
            [ -n "${!name:-}" ] && admin=1
          done
          for name in VF_INFRA_SSH_HOST P04_SSH_HOST CLOUDPANEL_SSH_HOST PRODUCTION_SSH_HOST; do
            [ -n "${!name:-}" ] && ssh_host=1
          done
          for name in VF_INFRA_SSH_USER P04_SSH_USER CLOUDPANEL_SSH_USER PRODUCTION_SSH_USER; do
            [ -n "${!name:-}" ] && ssh_user=1
          done
          for name in VF_INFRA_SSH_PRIVATE_KEY P04_SSH_PRIVATE_KEY CLOUDPANEL_SSH_PRIVATE_KEY PRODUCTION_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] && ssh_key=1
          done
          if [ "$admin" -eq 1 ]; then echo 'PRODUCTION_ADMIN_CHANNEL=AVAILABLE'; else echo 'PRODUCTION_ADMIN_CHANNEL=NONE'; fi
          if [ "$ssh_host" -eq 1 ] && [ "$ssh_user" -eq 1 ] && [ "$ssh_key" -eq 1 ]; then echo 'PRODUCTION_SSH_CHANNEL=COMPLETE'; else echo 'PRODUCTION_SSH_CHANNEL=INCOMPLETE'; fi
          if [ "$admin" -eq 0 ] && { [ "$ssh_host" -eq 0 ] || [ "$ssh_user" -eq 0 ] || [ "$ssh_key" -eq 0 ]; }; then
            echo 'EXACT_RECONCILIATION_CHANNEL=UNAVAILABLE'
          else
            echo 'EXACT_RECONCILIATION_CHANNEL=POTENTIALLY_AVAILABLE'
          fi

      - name: Write public-safe evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cat > "$RUNNER_TEMP/evidence/P04_V258_POST_UPGRADE_PUBLIC_RECONCILIATION.txt" <<'EOF'
          P04 · VF Infra V2.5.8 Post-Upgrade Public Reconciliation
          Production public version: 2.5.8 / PASS
          Maintenance authentication boundary: PASS
          Product runtime write: 0
          Database write: 0
          Schema write: 0
          Provider dangerous remote write: 0
          Production upgrade executed by this workflow: NO
          Production Source Exact: NOT PROVEN BY PUBLIC CHANNEL
          Business DB Preservation: NOT PROVEN BY PUBLIC CHANNEL
          Backup Exact Identity: NOT PROVEN BY PUBLIC CHANNEL
          EOF

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.5.8-Post-Upgrade-Public-Reconciliation
          path: ${{ runner.temp }}/evidence/P04_V258_POST_UPGRADE_PUBLIC_RECONCILIATION.txt
          retention-days: 14
