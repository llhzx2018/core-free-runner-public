name: P04 Production Post-Relay Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-production-post-relay-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public Production state without authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          base='https://infra.kewaro.com'
          version_code=$(curl -sS --max-time 20 -o /tmp/p04-version.txt -w '%{http_code}' "$base/VERSION.txt" || true)
          version=$(tr -d '\r\n' </tmp/p04-version.txt 2>/dev/null || true)
          echo "VERSION_HTTP=$version_code"
          if [ "$version" = '2.5.1' ] || [ "$version" = '2.5.2' ]; then echo "PRODUCTION_VERSION=$version"; else echo 'PRODUCTION_VERSION=UNREADABLE'; fi

          relay_code=$(curl -sS --max-time 20 -o /tmp/p04-relay.json -w '%{http_code}' "$base/P04_V2.5.1_TO_UNIFIED_UPDATE_BRIDGE.php?relay=info" || true)
          relay_status=$(python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/p04-relay.json',encoding='utf-8'))
              print(d.get('status','UNKNOWN'))
          except Exception:
              print('UNREADABLE')
          PY
          )
          echo "BRIDGE_RELAY_HTTP=$relay_code"
          echo "BRIDGE_RELAY_STATUS=$relay_status"

          repair_code=$(curl -sS --max-time 20 -o /tmp/p04-repair-body -w '%{http_code}' -D /tmp/p04-repair-headers "$base/repair-v2.5.2.php" || true)
          location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]+:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/p04-repair-headers || true)
          echo "REPAIR_HTTP=$repair_code"
          if [ -n "$location" ]; then echo "REPAIR_LOCATION=$location"; fi
          echo 'PRODUCTION_WRITE=NO'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/p04-version.txt /tmp/p04-relay.json /tmp/p04-repair-body /tmp/p04-repair-headers
