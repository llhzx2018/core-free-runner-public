name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-tools181-20261024]
    paths: ['.github/workflows/s01-tools181-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.181
  TARGET_SHA: 1f4e8f1917226e255724e185876459ee46e829db
  UPDATE_SHA: 9036eaf9571146402d8a4379bd8585c598e77cc5
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 9036eaf9571146402d8a4379bd8585c598e77cc5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='54c4886e13ea90ca07ab67d388a595fe2eb9e8f027cca8e327b2254f64a8f876' and m['asset_bytes']==1983477
          assert m['runtime_files']==476 and '1.35.180' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
