name: P02 V2.5.27 Source Manifest Reseal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2527-reseal.yml'

permissions:
  contents: read

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_BRANCH: maintenance/v2.5.27-update-continuity
    steps:
      - name: Require registered product-write capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Reseal and verify exact V2.5.27 working source
        run: |
          set -Eeuo pipefail
          cd product
          test "$(tr -d '\r\n' < VERSION)" = 2.5.27
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          node tests/unit/v2521_context_ux_contract.mjs
          node tests/unit/v2522_unified_library_workspace_contract.mjs
          node tests/unit/v2523_unified_content_workspace_contract.mjs
          node tests/unit/v2526_interaction_refresh_contract.mjs
          node tests/unit/v2527_update_continuity_contract.mjs
          php -l src/app/VfLibraryCoreUpdateAdapter.php >/dev/null
          python3 -m py_compile scripts/build-multisource-update.py
          git diff --check
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 76
          git config user.name vf-release-bot
          git config user.email vf-release-bot@users.noreply.github.com
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if git diff --cached --quiet; then
            echo SOURCE_MANIFEST_ALREADY_CURRENT=PASS
          else
            git commit -m "chore(manifest): reseal V2.5.27 runtime source"
            git push origin "HEAD:$PRODUCT_BRANCH"
            echo SOURCE_MANIFEST_RESEAL_PUSH=PASS
          fi

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_IN_RUNNER_REPO=NO
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
