name: S01 C02 1211097 Formal Release
on:
  push:
    branches: [task/s01-c02-1211097-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1097'
      TARGET_SHA: 'fa3417b7555f540877a29cb993d52ed89c53f088'
      MAIN_SHA: 'e811cfcebdf87676aa4138080267e350b6b707b0'
      TARGET_TREE: '5d1b53748d18d7b3ed777563d99e26d0f435db66'
      RELEASE_TAG: 'v1.21.1097'
      EXPECTED_BYTES: '3568281'
      EXPECTED_SHA: '9cb30e168082cc0b1921434ea8552b6d3016f0110dac41a27025a820d70cd979'
      EXPECTED_FILES: '989'
      EXPECTED_FINGERPRINT: 'a30b7ea9ff34563556b342d06e3ca0002785579d8d3535c1c6dcb654fc5a37d7'
      RUN_ID: '38188183505'
      ARTIFACT_ID: '11719614680'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fa3417b7555f540877a29cb993d52ed89c53f088
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211097/formal-release.sh
          bash runner/lanes/s01-c02-1211097/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211097-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
