name: R82 Focused Software OS Context Count Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r82-software-os-context-counts.yml'

permissions:
  contents: read

jobs:
  r82-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 88158b36e9b59f53462760090a04ac97d6838269
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 88158b36e9b59f53462760090a04ac97d6838269
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01-source
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/software_os_context_count_contract.php
          php tests/unit/software_os_context_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          echo R82_SOFTWARE_OS_CONTEXT_COUNT_PASS
          echo R82_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/p01-source"
