name: S01-C02 1079 Publish actual R14 R18 frame gate
on:
  push:
    branches: [test/s01-c02-1211079-publish-liveframe-20261009]
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1079
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 7ecdadf16eb2f68936685c183a6d64938fcb0c01
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,pdo_mysql,zip,curl,mbstring
          coverage: none
      - name: Install Chromium for real shared JS integration
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Source and PHP syntax
        run: |
          test "$(cat VERSION)" = 1.21.1079
          php -l includes/admin-v13/views/publish_zip_v6.php
          node --check tests/s01-c02-1211079-publish-actual-frame-browser.js
          node --check assets/js/admin-s01-page-frame-r14.js
          node --check assets/js/admin-s01-page-frame-r18.js
      - name: Real R14 R15 R18 + PHP + 10 CSS owner DOM and saved notice
        run: node tests/s01-c02-1211079-publish-actual-frame-browser.js
      - name: Preserve previous 1078 source verdict and ZIP controls
        run: |
          node tests/s01-c02-1211078-publish-severity-browser.js
          node tests/s01-c02-1211073-publish-preflight-browser.js
          node tests/s01-c02-1211067-zip-input-browser-e2e.js
          node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: WordPress MariaDB actual Publish CSS queue vs System route
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/wp1079"; mkdir -p "$ROOT"; WP="$ROOT/site"; mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$ROOT/wp"
          wpqa(){ php "$ROOT/wp" --path="$WP" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1079 --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          mkdir -p "$WP/wp-content/plugins/vf-ops"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$WP/wp-content/plugins/vf-ops/"
          wpqa plugin activate vf-ops
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" publish
          wpqa eval-file "$WP/wp-content/plugins/vf-ops/tests/s01-c02-1211075-publish-asset-wordpress.php" system
      - name: Deterministic exact ZIP
        run: |
          mkdir -p /tmp/s01-c02-1079
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-1079/vf-tools-ops_V1.21.1079.zip > /tmp/s01-c02-1079/manifest.json
          unzip -tq /tmp/s01-c02-1079/vf-tools-ops_V1.21.1079.zip
          cat /tmp/s01-c02-1079/manifest.json
      - name: Seal candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-v1.21.1079-publish-actual-frame-candidate
          path: /tmp/s01-c02-1079/
          retention-days: 30
