name: P01 V2.35.3 Update Terminal Closure Gate V3
on:
  push:
    branches: [task/p01-v2353-update-terminal-closure-gate-20260831]
    paths: [.github/workflows/p01-v2353-update-terminal-closure-gate-v3-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 0d5cd771d6db797fbe55f4cf6315c1c15e0300b7
      TREE: 284565acdc46ca46d80c62f0345bd5d30956776b
      BASE: 3c9239be8bba34637411110f7fdb43f6e494c880
      ROOT: /tmp/p01-v2353-terminal-v3
      EVID: /tmp/p01-v2353-terminal-v3-evid
      PORT: '18455'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD | sort)" = $'src/assets/admin-consolidation.css\nsrc/assets/update-core.js'
          test "$(cat product/VERSION)" = 2.35.2
          test "$(cat product/src/VERSION.txt)" = 2.35.2
          node --check product/src/assets/update-core.js
          echo P01_V2353_EXACT_SOURCE=PASS
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID" /tmp/p01-v2353-v3.cookies
          mkdir -p "$EVID" && cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2353-v3.pid
          for i in $(seq 1 60); do curl -fsS -c /tmp/p01-v2353-v3.cookies -b /tmp/p01-v2353-v3.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v2353-v3-setup.html && break; sleep .25; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2353-v3-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v2353-v3.cookies -b /tmp/p01-v2353-v3.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2353 Terminal Gate V3' --data-urlencode 'admin_password=V2353Terminal2026' --data-urlencode 'admin_password_confirm=V2353Terminal2026' -o /tmp/p01-v2353-v3-post.html
          php "$ROOT/cli/verify.php" | tee "$EVID/verify-before.txt" | grep -Fx VERIFY_PASS=YES
      - name: Chromium terminal closure matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2353-v3-pw && cd /tmp/p01-v2353-v3-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const base='http://127.0.0.1:18455/';
          const status=(current,latest,available=false,can=false,reason='当前已经是最新版本。')=>({ok:true,status:{current_version:current,latest_version:latest,available,can_update:can,reason,update_priority:'normal',last_check_at:'2026-08-31T04:55:00Z',history:[]}});
          (async()=>{
            const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:900}});
            const login=await c.request.post(base+'api.php?action=login',{data:{password:'V2353Terminal2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const read=p=>p.evaluate(()=>{const x=document.getElementById('installUpdate'),s=document.getElementById('updateSteps'),e=document.getElementById('updateError');return{current:document.getElementById('updateCurrent')?.textContent||'',latest:document.getElementById('updateLatest')?.textContent||'',state:document.getElementById('updateState')?.textContent||'',footer:document.querySelector('.vf-rail-footer')?.textContent||'',hidden:!!x?.hidden,disabled:!!x?.disabled,display:x?getComputedStyle(x).display:'',stepsHidden:!!s?.hidden,stepsDisplay:s?getComputedStyle(s).display:'',steps:s?.textContent||'',errorShown:!!e?.classList.contains('show'),error:e?.textContent||'',reload:!!window.vfUpdateHardReloadScheduled,asset:document.querySelector('meta[name="vf-asset-version"]')?.content||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});

            const stable=await c.newPage();await stable.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status('2.35.2','2.35.2'))}));await stable.goto(base+'update.php',{waitUntil:'networkidle'});await stable.waitForTimeout(120);let m=await read(stable);
            if(m.current!=='V2.35.2'||m.latest!=='V2.35.2'||m.footer!=='VF Start · V2.35.2'||!m.hidden||!m.disabled||m.display!=='none'||!m.stepsHidden||m.stepsDisplay!=='none'||m.errorShown||!m.state.includes('最新')||m.overflow>1)throw Error('stable '+JSON.stringify(m));
            await stable.evaluate(()=>{document.getElementById('installUpdate').style.display='flex';document.getElementById('updateSteps').style.display='grid';});m=await read(stable);if(m.display!=='none'||m.stepsDisplay!=='none')throw Error('legacy-display '+JSON.stringify(m));
            await stable.screenshot({path:`${process.env.EVID}/stable-1440.png`,fullPage:true});await stable.setViewportSize({width:390,height:844});await stable.waitForTimeout(50);m=await read(stable);if(m.display!=='none'||m.stepsDisplay!=='none'||m.overflow>1)throw Error('mobile '+JSON.stringify(m));await stable.screenshot({path:`${process.env.EVID}/stable-390.png`,fullPage:true});

            const stale=await c.newPage();await stale.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status('2.35.3','2.35.3'))}));await stale.goto(base+'update.php',{waitUntil:'networkidle'});await stale.waitForTimeout(120);m=await read(stale);if(m.current!=='V2.35.3'||m.latest!=='V2.35.3'||m.footer!=='VF Start · V2.35.3'||m.display!=='none'||m.errorShown)throw Error('stale '+JSON.stringify(m));

            const install=await c.newPage();let installed=false;await install.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(installed?status('2.35.3','2.35.3'):status('2.35.2','2.35.3',true,true,'测试可用更新'))}));await install.route('**/api.php?action=update_prepare',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,result:{operation_id:'op-v2353'}})}));await install.route('**/api.php?action=update_install',r=>{installed=true;return r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,result:{from_version:'2.35.2',to_version:'2.35.3'}})});});await install.goto(base+'update.php',{waitUntil:'networkidle'});await install.waitForTimeout(120);m=await read(install);if(m.hidden||m.disabled||m.display==='none')throw Error('available '+JSON.stringify(m));await install.click('#installUpdate');await install.waitForFunction(()=>window.vfUpdateHardReloadScheduled===true&&document.querySelector('.vf-rail-footer')?.textContent==='VF Start · V2.35.3'&&document.getElementById('installUpdate')?.hidden===true,null,{timeout:10000});m=await read(install);if(!m.reload||m.footer!=='VF Start · V2.35.3'||m.asset!=='2.35.3'||m.display!=='none'||!m.steps.includes('正在刷新页面以加载新版本资源')||m.steps.includes('不会自动刷新'))throw Error('terminal '+JSON.stringify(m));await install.screenshot({path:`${process.env.EVID}/terminal-before-reload.png`,fullPage:true});await install.waitForURL(u=>u.searchParams.has('vf_refresh'),{timeout:10000});await install.waitForTimeout(180);m=await read(install);if(m.current!=='V2.35.3'||m.latest!=='V2.35.3'||m.footer!=='VF Start · V2.35.3'||m.display!=='none'||m.errorShown)throw Error('reloaded '+JSON.stringify(m));

            const fail=await c.newPage();await fail.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status('2.35.2','2.35.3',true,true,'测试可用更新'))}));await fail.route('**/api.php?action=update_prepare',r=>r.fulfill({status:500,contentType:'application/json',body:JSON.stringify({ok:false,error:'模拟下载校验失败。'})}));await fail.goto(base+'update.php',{waitUntil:'networkidle'});await fail.waitForTimeout(120);await fail.click('#installUpdate');await fail.waitForFunction(()=>document.getElementById('updateState')?.textContent==='更新失败。',null,{timeout:10000});m=await read(fail);if(!m.errorShown||!m.error.includes('模拟下载校验失败')||m.reload||!m.steps.includes('更新已停止'))throw Error('failure '+JSON.stringify(m));
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify({stable:await read(stable),stale:await read(stale),reloaded:await read(install),failure:await read(fail)},null,2));await b.close();console.log('P01_V2353_UPDATE_TERMINAL_CLOSURE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_V2353_UPDATE_TERMINAL_CLOSURE=PASS "$EVID/result.txt"
      - name: Regression and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee "$EVID/verify-after.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          php -r 'require getenv("ROOT")."/app/bootstrap.php";$d=vf_db();if($d->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(2);if($d->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_V2353_SQLITE=PASS\n";' | tee "$EVID/sqlite.txt" | grep -Fx P01_V2353_SQLITE=PASS
          printf 'P01_V2353_MACHINE_GATE=PASS\nSOURCE=%s\nTREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$SOURCE" "$TREE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2353-update-terminal-closure-v3-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2353-v3.pid 2>/dev/null)" 2>/dev/null || true
