name: S01 R9 dual current channel WordPress native discovery and upgrade
on:
  push:
    branches: [test/s01-r9-dual-channel-discovery-20261104]
    paths: ['.github/workflows/s01-r9-dual-native-upgrade-20261104.yml']
permissions: {contents: read}
jobs:
  published-wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mariadb:
        image: mariadb:11.8
        env: {MARIADB_DATABASE: s01_r9, MARIADB_USER: vf, MARIADB_PASSWORD: vf, MARIADB_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only"
          --health-interval 10s --health-timeout 5s --health-retries 18
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli,mbstring,intl,zip,xml,curl', coverage: none}
      - name: Check published core-updates main and old formal rollback assets
        env: {GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = 1a47313b794e22370e1efb8bc54a8e5f69164069
          mkdir -p "$RUNNER_TEMP/official"
          gh release download v1.35.224 -R llhzx2018/vf-tools-theme -p vf-tools-theme_V1.35.224.zip -D "$RUNNER_TEMP/official"
          gh release download v1.25.99 -R llhzx2018/vf-tools-m3u8 -p vf-tools-m3u8_V1.25.99.zip -D "$RUNNER_TEMP/official"
          gh release download v1.21.1114 -R llhzx2018/vf-tools-ops -p vf-tools-ops_V1.21.1114.zip -D "$RUNNER_TEMP/official"
          echo "7d64ce96ac15c482b653666a54fd587437b8aa214a73eb82e6e6771eaa02a4de  $RUNNER_TEMP/official/vf-tools-theme_V1.35.224.zip" | sha256sum -c
          echo "7bd5c648fc1eb3513896404e8d433bc64044ce79928ddf7ed79f73b2fd2ba2a4  $RUNNER_TEMP/official/vf-tools-m3u8_V1.25.99.zip" | sha256sum -c
          echo "07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3  $RUNNER_TEMP/official/vf-tools-ops_V1.21.1114.zip" | sha256sum -c
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/S01-C01.json?ref=main' >"$RUNNER_TEMP/official/c01.json"
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/S01-C03.json?ref=main' >"$RUNNER_TEMP/official/c03.json"
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'official')
          for n,version,old,digest in [('c01','1.35.225','1.35.224','adc5413022a674e8256cc7f82bc04d1513036dbd483b1fb89c81b74de9a21c89'),('c03','1.25.100','1.25.99','d1c27b66d51440160321b31a12b7ede8cb418f7a5a89e4ad8f3cfb921af2544b')]:
           m=json.loads((root/(n+'.json')).read_text())
           assert m['target_version']==version and m['asset_sha256']==digest and old in m['from_versions']
           assert m['backup_required'] and m['rollback_supported']
          print('S01_R9_LIVE_TWO_CHANNELS_AND_ASSETS=PASS')
          PY
      - name: Clean WordPress 7.1.3 MariaDB old three-component baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/wp-cli-r9.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli-r9.phar /usr/local/bin/wp
          P="$RUNNER_TEMP/s01-r9-wp"; mkdir -p "$P"
          wp core download --path="$P" --version=7.1.3 --allow-root --quiet
          wp config create --path="$P" --dbname=s01_r9 --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check --allow-root >/dev/null
          wp config set --path="$P" FS_METHOD direct --type=constant --allow-root >/dev/null
          wp core install --path="$P" --url=http://127.0.0.1:18944 --title=S01R9 --admin_user=fixture --admin_password=fixture-only --admin_email=fixture@example.invalid --skip-email --allow-root >/dev/null
          wp theme install "$RUNNER_TEMP/official/vf-tools-theme_V1.35.224.zip" --activate --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/official/vf-tools-ops_V1.21.1114.zip" --activate --path="$P" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/official/vf-tools-m3u8_V1.25.99.zip" --activate --path="$P" --allow-root >/dev/null
          test "$(wp theme get vf-tools-theme --field=version --path="$P" --allow-root)" = 1.35.224
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$P" --allow-root)" = 1.25.99
          wp plugin is-active vf-tool-m3u8 --path="$P" --allow-root
          wp plugin is-active vf-ops --path="$P" --allow-root
          wp option update s01_r9_synthetic_canary retained --path="$P" --allow-root >/dev/null
          echo S01_R9_REAL_OLD_THREE_COMPONENTS_INSTALLED=PASS
      - name: Original WordPress native theme and plugin update offers on actual live channel
        env: {VF_PRIVATE_READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          P="$RUNNER_TEMP/s01-r9-wp"
          wp eval --path="$P" --allow-root '
            require_once ABSPATH."wp-includes/update.php";
            delete_site_transient("update_themes");delete_site_transient("update_plugins");
            if(class_exists("VF_Theme_Update_Client_V1"))VF_Theme_Update_Client_V1::clear_cache();
            if(class_exists("VF_M3U8_Update_Source_V1"))VF_M3U8_Update_Source_V1::clear_cache();
            wp_update_themes();wp_update_plugins();
            $t=get_site_transient("update_themes");$p=get_site_transient("update_plugins");
            $ta=$t->response["vf-tools-theme"]??null;
            $pa=$p->response["vf-tool-m3u8/vf-tool-m3u8.php"]??null;
            if(!is_array($ta)||($ta["new_version"]??"")!=="1.35.225"){echo "THEME_OFFER_MISSING\n";exit(31);}
            if(!is_object($pa)||($pa->new_version??"")!=="1.25.100"){echo "M3U8_OFFER_MISSING\n";exit(32);}
            if(empty($ta["package"])||empty($pa->package))exit(33);
            echo "S01_R9_LIVE_THEME_WORDPRESS_NATIVE_OFFER=PASS\n";
            echo "S01_R9_LIVE_M3U8_WORDPRESS_NATIVE_OFFER=PASS\n";
          '
      - name: Real native WordPress upgrade of published Theme and M3U8 release ZIP
        env: {VF_PRIVATE_READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          P="$RUNNER_TEMP/s01-r9-wp"
          wp theme update vf-tools-theme --path="$P" --allow-root
          test "$(wp theme get vf-tools-theme --field=version --path="$P" --allow-root)" = 1.35.225
          echo S01_R9_PUBLISHED_THEME_NATIVE_UPGRADE=PASS
          wp plugin update vf-tool-m3u8 --path="$P" --allow-root
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$P" --allow-root)" = 1.25.100
          wp plugin is-active vf-tool-m3u8 --path="$P" --allow-root
          wp plugin is-active vf-ops --path="$P" --allow-root
          test "$(wp option get s01_r9_synthetic_canary --path="$P" --allow-root)" = retained
          echo S01_R9_PUBLISHED_M3U8_NATIVE_UPGRADE=PASS
          echo S01_R9_PUBLISHED_BOTH_ACTIVATED_AND_CANARY_PRESERVED=PASS
      - name: Remove temporary synthetic WP and formal asset bytes
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/official" "$RUNNER_TEMP/s01-r9-wp" /tmp/wp-cli-r9.phar
