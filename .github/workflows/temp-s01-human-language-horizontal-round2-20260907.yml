name: S01 Human Language Horizontal Latest
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-human-language-horizontal-round2-20260907.yml]
permissions:
  contents: read
jobs:
  horizontal:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      C01_SHA: 83960c172dbe2f5a937f4d0c35a17e8fc252126c
      C02_SHA: cfd16e171ed97878a0c60a38805975480d2bf7bd
      C03_SHA: c457bd921a45442b60f2f4abac7e46cd8195c0dd
    steps:
      - name: Exact latest three-component presentation regression
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          cd c01 && git checkout -q "$C01_SHA" && test "$(git rev-parse HEAD)" = "$C01_SHA" && test "$(cat VERSION)" = '1.35.19'
          node --check src/assets/js/admin/admin-preview-human-language-final.js
          php tests/preview-human-language-followup-contract.php
          php tests/render-settings-human-language-contract.php
          php tests/recovery-human-language-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          cd ..
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          cd c02 && git checkout -q "$C02_SHA" && test "$(git rev-parse HEAD)" = "$C02_SHA" && test "$(cat VERSION)" = '1.21.857'
          php tests/system-components-human-language-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          cd ..
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          cd c03 && git checkout -q "$C03_SHA" && test "$(git rev-parse HEAD)" = "$C03_SHA" && test "$(cat VERSION)" = '1.25.27'
          node --check src/admin/admin-s01-human-language-final.js
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          echo 'PASS_S01_HUMAN_LANGUAGE_HORIZONTAL_LATEST'
