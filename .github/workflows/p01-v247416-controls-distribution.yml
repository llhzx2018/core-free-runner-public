name: P01 2.47.416 Shared Control Distribution One-shot Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247416-controls-distribution.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 44db5ea68a5035dd591e89dd644362caf4779665
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update candidate in ephemeral checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-416-distribution"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_416_DIST_EXACT_SOURCE=PASS
      - name: Full core-updates contract and exact P01 release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.416'
          assert m['current_version']=='2.47.415'
          assert m['from_versions']==['2.47.415']
          assert m['release_tag']=='v2.47.416'
          assert m['release_id']==420238548
          assert m['product_identity']=='3b849dc75a56355cb310487d1b6a31426bc52bd1'
          assert m['asset_name']=='VF_Start_V2.47.416_UPDATE.zip'
          assert m['asset_bytes']==2683231
          assert m['asset_sha256']=='854a8838409b8f57692a34236922727296e68922bd2c14f3aa28604fbee1876d'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['update_type']=='ATOMIC'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_416_DISTRIBUTION_COORDINATES=PASS')
          PY
          echo P01_416_DISTRIBUTION_EQUIVALENT_CI=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_416_DIST_EPHEMERAL=PASS
