name: S01 Theme 1.35.20 Distribution Gate
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-theme-13520-distribution-gate-20260907.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_BASE: 9e2f1fd8b7a7d384ea183aabe98fbd807e5f7e5b
      CORE_SHA: b3826bb9b5946bbb2b772822973e1d7efcb7453c
      THEME_SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
    steps:
      - name: Exact C01 distribution proof
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'WRITE_TOKEN_USED=NO PRODUCT_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" core
          git -C core checkout -q "$CORE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C core rev-parse origin/main)" = "$CORE_BASE"
          git -C core diff --name-only "$CORE_BASE" "$CORE_SHA" | sort >/tmp/actual
          printf '%s\n' projects/S01-C01.json >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git -C core hash-object projects/S01-C02.json)" = '2896cb2d284d3c1d3ded8cd189b20049bef15d5a'
          test "$(git -C core hash-object projects/S01-C03.json)" = '5d27495f15ceb92581eb1cd227770b2d02158d4b'
          jq -e . core/projects/S01-C01.json >/dev/null
          (cd core && python3 scripts/check_manifest_contract.py >/tmp/contract.json)
          jq -e '.status=="PASS"' /tmp/contract.json >/dev/null
          find core/update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core/update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          c1=json.load(open('core/projects/S01-C01.json'))
          c2=json.load(open('core/projects/S01-C02.json'))
          c3=json.load(open('core/projects/S01-C03.json'))
          assert c1['target_version']=='1.35.20'
          assert c1['release_tag']=='v1.35.20'
          assert c1['asset_name']=='vf-tools-theme_V1.35.20.zip'
          assert c1['asset_bytes']==1806453
          assert c1['asset_sha256']=='779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1'
          assert c1['runtime_files']==446
          assert c1['runtime_fingerprint']=='ec60d9d98b6a7406ff17d91367c03918034ac438970bc441b74b90b589508e3c'
          assert c1['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14','1.35.15','1.35.16','1.35.17','1.35.18','1.35.19']
          assert c1['schema_from']==c1['schema_to']=='N/A'
          assert 'does not claim Production' in c1['notes']
          assert c2['target_version']=='1.21.858' and c2['asset_sha256']=='9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a'
          assert c3['target_version']=='1.25.29' and c3['asset_sha256']=='faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890'
          assert c3['schema_from']==c3['schema_to']=='1.3.0' and c3['locator_cutover'] is False and 'migration remains CLOSED' in c3['notes']
          PY
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$THEME_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.20 --jq '.object.sha')" = "$THEME_SHA"
          gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.20 >/tmp/release.json
          test "$(jq -r '.id' /tmp/release.json)" = '384474577'
          test "$(jq -r '.draft' /tmp/release.json)" = false
          test "$(jq -r '.prerelease' /tmp/release.json)" = false
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.id' /tmp/release.json)" = '549951469'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.size' /tmp/release.json)" = '1806453'
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.20.zip")|.digest' /tmp/release.json)" = 'sha256:779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1'
          mkdir -p /tmp/r /tmp/u
          gh release download v1.35.20 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.20.zip --dir /tmp/r
          test "$(sha256sum /tmp/r/vf-tools-theme_V1.35.20.zip|awk '{print $1}')" = '779c48f2bbe450c5a50b01118b7cc9655e5184b41fbbcd45ca1a0158afa386b1'
          unzip -q /tmp/r/vf-tools-theme_V1.35.20.zip -d /tmp/u
          cat >/tmp/ta.php <<'PHP'
          <?php define('ABSPATH','/'); class WP_Error { public function __construct(...$x){} } require $argv[1].'/inc/update/class-vf-theme-runtime-authority-v1.php'; $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1]); echo $s['file_count'],' ', $s['fingerprint_sha256'],"\n";
          PHP
          test "$(php /tmp/ta.php /tmp/u/vf-tools-theme)" = '446 ec60d9d98b6a7406ff17d91367c03918034ac438970bc441b74b90b589508e3c'
          echo 'PASS_S01_C01_13520_DISTRIBUTION_GATE'
