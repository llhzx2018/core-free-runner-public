name: P01 V2.35.3 Strict Fresh Formal Bytes
on:
  push:
    branches: [release/p01-v2353-strict-fresh-20260831]
    paths: [.github/workflows/p01-v2353-strict-fresh-20260831.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33359124042'
      FORMAL_ARTIFACT: p01-v2353-formal-artifacts-33359124042
      FORMAL: 8f1073120f8096fc23554906615601752feb036d
      FORMAL_TREE: ece02ef928ad5b119e2b0237e7963a607865ddbb
      FORMAL_RUNTIME_TREE: 7f181909c7ccd3179491f21cfca426008de4295f
      VERSION: 2.35.3
      SOURCE_VERSION: 2.35.2
      SCHEMA: '2026082901'
      DOWNLOAD: /tmp/p01-v2353-formal-download
      FRESH: /tmp/p01-v2353-strict-fresh
      EVID: /tmp/p01-v2353-strict-fresh-evidence
      COOKIE: /tmp/p01-v2353-strict-fresh.cookies
      PORT: '18460'
      ADMIN_PASS: V2353StrictFresh2026
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Download exact Formal Artifact Gate bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"
          mkdir -p "$DOWNLOAD" "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.35.3-FULL.zip' -print -quit)
          test -n "$FULL"
          ART_DIR=$(dirname "$FULL")
          printf 'ART_DIR=%s\n' "$ART_DIR" | tee "$EVID/artifact-location.txt"
          for f in atomic-self-test.json P01-V2.35.3-ARTIFACT-GATE.json P01-V2.35.3-FORMAL-METADATA.json repair-v2.35.3.php SHA256SUMS.txt VF-Start-V2.35.3-FULL.zip VF-Start-V2.35.3-UPDATE.zip VF_Start_V2.35.3_UPDATE.zip; do test -f "$ART_DIR/$f"; done
          test "$(sha256sum "$ART_DIR/repair-v2.35.3.php"|awk '{print $1}')" = 485002ebe416c5a6f59d391515737d6636306c7d0a3683dfedb10f15fe91fa98
          test "$(sha256sum "$ART_DIR/SHA256SUMS.txt"|awk '{print $1}')" = 75e4fc20fad80a3389a47007c03857c582fea37dd48cf83572a16bbb736c11c3
          test "$(sha256sum "$ART_DIR/P01-V2.35.3-ARTIFACT-GATE.json"|awk '{print $1}')" = b3a721b0bb0c88231e10e93d014d5752f92ddd3932448e3e2e5ef8d4120cb2ff
          test "$(sha256sum "$ART_DIR/P01-V2.35.3-FORMAL-METADATA.json"|awk '{print $1}')" = c4919c4ebea1a489ddab7609d6f9b88ea0a3c9a1f88ae3fbe28f9293e1d66016
          test "$(sha256sum "$ART_DIR/VF-Start-V2.35.3-UPDATE.zip"|awk '{print $1}')" = ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9
          test "$(sha256sum "$ART_DIR/VF_Start_V2.35.3_UPDATE.zip"|awk '{print $1}')" = ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9
          test "$(sha256sum "$ART_DIR/atomic-self-test.json"|awk '{print $1}')" = cdde4a397c99197a7b77d631dc9f2c724a2998077b7e6dfde41a68e5fdfaf739
          test "$(sha256sum "$ART_DIR/VF-Start-V2.35.3-FULL.zip"|awk '{print $1}')" = e0197da4a4d3ca3d9e1fd1fec97712340c4045ed94ba33e22be64e4281d72aaf
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256-check.txt"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="8f1073120f8096fc23554906615601752feb036d" and .formal_tree=="ece02ef928ad5b119e2b0237e7963a607865ddbb" and .runtime_tree=="7f181909c7ccd3179491f21cfca426008de4295f" and .schema=="2026082901" and .migration==null' "$ART_DIR/P01-V2.35.3-ARTIFACT-GATE.json" >/dev/null
          jq -e '.formal_source=="8f1073120f8096fc23554906615601752feb036d" and .formal_tree=="ece02ef928ad5b119e2b0237e7963a607865ddbb" and .runtime_tree=="7f181909c7ccd3179491f21cfca426008de4295f" and .version=="2.35.3" and .source_version=="2.35.2" and .schema=="2026082901" and .migration==null' "$ART_DIR/P01-V2.35.3-FORMAL-METADATA.json" >/dev/null
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' "$ART_DIR/atomic-self-test.json" >/dev/null
          php -l "$ART_DIR/repair-v2.35.3.php" >/dev/null
          php "$ART_DIR/repair-v2.35.3.php" --self-test | tee "$EVID/repair-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          stat -c 'VF_Start_V2.35.3_UPDATE.zip bytes=%s' "$ART_DIR/VF_Start_V2.35.3_UPDATE.zip" | tee "$EVID/asset-size.txt"
          printf 'P01_V2353_FORMAL_BYTES=PASS\nFORMAL_RUN=%s\nFORMAL_ARTIFACT=%s\n' "$FORMAL_RUN" "$FORMAL_ARTIFACT" | tee "$EVID/formal-bytes-verdict.txt"
      - name: Extract exact FULL and verify package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.35.3-FULL.zip' -print -quit)
          mkdir -p "$FRESH"
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.3');" "$FRESH/app/bootstrap.php" >/dev/null
          unzip -p "$FULL" release-manifest.json > "$EVID/release-manifest.json"
          jq -e '.project_id=="P01" and .version=="2.35.3" and .source_version=="2.35.2" and .schema_version=="2026082901" and .source_schema_version=="2026082901" and .formal_source_commit=="8f1073120f8096fc23554906615601752feb036d" and .formal_source_tree=="ece02ef928ad5b119e2b0237e7963a607865ddbb" and .runtime_source_tree=="7f181909c7ccd3179491f21cfca426008de4295f" and .candidate_gate==33358914290 and .hotfix_machine_gate==33358556905 and .schema_change==false and .schema_migrations==[] and .runtime_data_included==false' "$EVID/release-manifest.json" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v2353-strict-php.txt
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -F '#installUpdate[hidden]' "$FRESH/assets/admin-consolidation.css" >/dev/null
          grep -F 'syncShellVersion' "$FRESH/assets/update-core.js" >/dev/null
          grep -F 'window.vfUpdateHardReloadScheduled' "$FRESH/assets/update-reload.js" >/dev/null
          echo P01_V2353_PACKAGE_IDENTITY=PASS | tee "$EVID/package-identity.txt"
      - name: Strict fresh setup and zero-data contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2353-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2353 Strict Fresh' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/database.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2353_FRESH_DATA_ZERO=PASS\nP01_V2353_SQLITE_INTEGRITY=PASS\n";
          PHP
          echo P01_V2353_STRICT_FRESH_RUNTIME=PASS | tee "$EVID/fresh-runtime.txt"
      - name: Authenticated routing and five-domain HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}" | tee "$EVID/login.json" | jq -e '.ok==true' >/dev/null
          curl -sS -D "$EVID/root.headers" -o /dev/null -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/"
          grep -Eq '^HTTP/1\.[01] 302' "$EVID/root.headers"
          grep -Eqi '^Location: ?home\.php\r?$' "$EVID/root.headers"
          for page in home.php start.php channels.php watch.php topics.php update.php; do code=$(curl -sS -o "$EVID/${page%.php}.html" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/$page"); test "$code" = 200; done
          printf 'P01_V2353_ROOT_ADMIN_REDIRECT=PASS\nP01_V2353_FIVE_DOMAIN_HTTP=PASS\nP01_V2353_UPDATE_HTTP=PASS\n' | tee "$EVID/http-verdict.txt"
      - name: Packaged Chromium terminal-state contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2353-strict-pw && cd /tmp/p01-v2353-strict-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const base='http://127.0.0.1:18460/';
          const response={ok:true,status:{current_version:'2.35.3',latest_version:'2.35.3',available:false,can_update:false,current_withdrawn:false,reason:'当前已经是最新版本。',update_priority:'normal',last_check_at:'2026-08-31T05:10:00Z',history:[],release_notes:{summary:'V2.35.3 strict fresh terminal state'}}};
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:900}});
            const login=await c.request.post(base+'api.php?action=login',{data:{password:'V2353StrictFresh2026'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const p=await c.newPage();
            await p.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(response)}));
            await p.goto(base+'update.php',{waitUntil:'networkidle'});await p.waitForTimeout(150);
            const read=()=>p.evaluate(()=>{const x=document.getElementById('installUpdate'),s=document.getElementById('updateSteps'),e=document.getElementById('updateError');return{current:document.getElementById('updateCurrent')?.textContent||'',latest:document.getElementById('updateLatest')?.textContent||'',state:document.getElementById('updateState')?.textContent||'',footer:document.querySelector('.vf-rail-footer')?.textContent||'',hidden:!!x?.hidden,disabled:!!x?.disabled,display:x?getComputedStyle(x).display:'',stepsHidden:!!s?.hidden,stepsDisplay:s?getComputedStyle(s).display:'',errorShown:!!e?.classList.contains('show'),error:e?.textContent||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth});
            let m=await read();
            if(m.current!=='V2.35.3'||m.latest!=='V2.35.3'||m.footer!=='VF Start · V2.35.3'||!m.hidden||!m.disabled||m.display!=='none'||!m.stepsHidden||m.stepsDisplay!=='none'||m.errorShown||!m.state.includes('最新')||m.overflow>1)throw Error('desktop '+JSON.stringify(m));
            await p.evaluate(()=>{document.getElementById('installUpdate').style.display='flex';document.getElementById('updateSteps').style.display='grid';});m=await read();if(m.display!=='none'||m.stepsDisplay!=='none')throw Error('legacy-display '+JSON.stringify(m));
            await p.screenshot({path:process.env.EVID+'/terminal-1440.png',fullPage:true});
            await p.setViewportSize({width:390,height:844});await p.waitForTimeout(80);m=await read();if(m.current!=='V2.35.3'||m.footer!=='VF Start · V2.35.3'||m.display!=='none'||m.stepsDisplay!=='none'||m.overflow>1)throw Error('mobile '+JSON.stringify(m));
            await p.screenshot({path:process.env.EVID+'/terminal-390.png',fullPage:true});
            fs.writeFileSync(process.env.EVID+'/terminal-metrics.json',JSON.stringify(m,null,2));await b.close();console.log('P01_V2353_TERMINAL_STATE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs 2>&1 | tee "$EVID/chromium.txt"
          grep -Fx P01_V2353_TERMINAL_STATE=PASS "$EVID/chromium.txt"
      - name: Final strict-fresh verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2353_FORMAL_BYTES=PASS "$EVID/formal-bytes-verdict.txt"
          grep -Fx P01_V2353_FRESH_DATA_ZERO=PASS "$EVID/database.txt"
          grep -Fx P01_V2353_SQLITE_INTEGRITY=PASS "$EVID/database.txt"
          grep -Fx P01_V2353_FIVE_DOMAIN_HTTP=PASS "$EVID/http-verdict.txt"
          grep -Fx P01_V2353_TERMINAL_STATE=PASS "$EVID/chromium.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2353_STRICT_FRESH=PASS
          P01_V2353_FORMAL_BYTES=PASS
          P01_V2353_FIVE_DOMAIN_HTTP=PASS
          P01_V2353_TERMINAL_STATE=PASS
          P01_V2353_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2353_READY_FOR_MAIN_PROMOTION=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload strict-fresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2353-strict-fresh-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2353-strict.pid 2>/dev/null)" 2>/dev/null || true
