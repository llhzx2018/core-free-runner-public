name: P01 IA V6 exact candidate native parity (test-only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-487-native-parity-once.yml']
permissions:
  contents: read
jobs:
  read-only-parity:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: c440ed8a9db88765270b36f93fc028f94aa6ceef
      PRODUCT_VERSION: 2.47.487
      P01_TEST_ORIGIN: http://127.0.0.1:18621
      P01_TEST_PASSWORD: P01Ia6SyntheticBrowser2026!
    steps:
      - name: Checkout registered public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Read exact private candidate source, never publish
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_487_EXACT_SOURCE=PASS
      - name: PHP JS syntax and focused scope contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          node --check candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          (cd candidate && for t in tests/unit/p01_ia6_*.cjs; do node "$t"; done)
          echo P01_IA6_487_FOCUSED_SOURCE=PASS
      - name: Fresh synthetic localhost installation
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-487-parity
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:18621 -t . >/tmp/p01-ia6-487-php.log 2>&1 & echo $! >/tmp/p01-ia6-487-php.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-487-cookie -b /tmp/p01-ia6-487-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-487-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          value=open('/tmp/p01-ia6-487-setup.html',encoding='utf-8').read()
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',value)
          assert match
          print(match.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-487-cookie -b /tmp/p01-ia6-487-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA V6 Browser Isolated Fixture" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-487-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_IA6_487_DISPOSABLE_INSTALL=PASS
      - name: Execute exact 27 legacy route and 11+1 tab browser smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          node candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
      - name: Clean synthetic fixture and private checkout
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-487-php.pid; then kill "$(cat /tmp/p01-ia6-487-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-487-parity candidate
          echo P01_IA6_487_CLEANUP=PASS
