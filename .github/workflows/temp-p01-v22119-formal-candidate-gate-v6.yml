name: TEMP P01 V2.21.19 Formal Candidate Gate V6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-formal-candidate-gate-v6.yml']
permissions:
  contents: write
env:
  CANDIDATE: 2784d8de583b016e78887b707e12ed0e89489a7d
  CANDIDATE_TREE: 64626d98737f1efdddd2230a636d7b13e6a36032
  PRODUCTION: a501d2394502319b0af9caaf1c171bdf94940a9d
  VERSION: 2.21.19
  SOURCE_VERSION: 2.21.18
  ADMIN_PASS: FormalCandidate-P01-22119!Strong
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, mbstring', coverage: none}
      - name: Execute corrected exact source formal gate
        env: {READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        shell: bash
        run: |
          set +e
          bash -Eeuo pipefail <<'RUN' >/tmp/formal.log 2>&1
          git clone -q --depth 1 --branch maintenance/reference-driven-ui-2.21.19-20260819 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git clone -q --depth 1 --branch v2.21.18 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" production
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/temp-p01-v22119-formal-gate.sh');s=p.read_text()
          old="test \"$rc\" -ne 0;grep -q 'app/AdminShell.php:sha' /tmp/tamper.out"
          new="test \"$rc\" -ne 0;jq -e '.ok==false and (.errors|index(\"app/AdminShell.php:sha\")!=null)' /tmp/tamper.out >/dev/null"
          assert old in s
          Path('/tmp/p01-formal-fixed.sh').write_text(s.replace(old,new,1))
          PY
          bash -x /tmp/p01-formal-fixed.sh
          RUN
          rc=$?;echo "$rc">/tmp/formal.rc;tail -180 /tmp/formal.log;exit 0
      - name: Publish formal candidate evidence
        if: always()
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -Eeuo pipefail;rc=$(cat /tmp/formal.rc 2>/dev/null||echo 999);status=FAILURE;[ "$rc" = 0 ]&&status=SUCCESS
          python3 - "$status" "$rc" <<'PY'
          import json,os,pathlib,sys
          st,rc=sys.argv[1],int(sys.argv[2]);build={}
          if pathlib.Path('/tmp/build.json').exists():build=json.load(open('/tmp/build.json'))
          tail='\n'.join(open('/tmp/formal.log',encoding='utf-8',errors='replace').read().splitlines()[-180:]) if pathlib.Path('/tmp/formal.log').exists() else ''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','source_version':'2.21.18','gate':'FORMAL_CANDIDATE_ARTIFACT_GATE','status':st,'pass':st=='SUCCESS','rc':rc,'source_sha':os.environ['CANDIDATE'],'source_tree':os.environ['CANDIDATE_TREE'],'production_sha':os.environ['PRODUCTION'],'schema_version':'2026080902','release_authorized':False,'production_changed':False,'private_data_persisted_publicly':False,'workflow_run_id':os.environ['GITHUB_RUN_ID'],'build':build,'log_tail':tail}
          open('/tmp/e.json','w').write(json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out;mkdir -p out/vf-agent/results;cp /tmp/e.json out/vf-agent/results/P01-V2.21.19-FORMAL-CANDIDATE-GATE.json;git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com;git -C out add vf-agent/results/P01-V2.21.19-FORMAL-CANDIDATE-GATE.json;git -C out commit -q -m 'evidence(P01): publish V2.21.19 formal candidate gate v6';git -C out pull -q --rebase origin vf-agent-operations-v1;git -C out push -q origin HEAD:vf-agent-operations-v1;test "$rc" = 0
