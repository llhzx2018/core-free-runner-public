name: P02 V2.5.112 Stable Discovery Verify

on:
  push:
    branches:
      - run/p02-v25112-release-20260924
    paths:
      - '.github/workflows/p02-v25112-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stable mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          path: stable

      - name: Checkout exact P02 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0f721794483789ac3b6b7f7510ee582f333cd614
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Verify stable discovery semantics
        run: |
          set -Eeuo pipefail
          php -r '
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $m=json_decode(file_get_contents("stable/projects/P02.json"),true,512,JSON_THROW_ON_ERROR);
            if (($m["target_version"]??"")!=="2.5.112") throw new RuntimeException("wrong stable target");
            if (($m["product_identity"]??"")!=="0f721794483789ac3b6b7f7510ee582f333cd614") throw new RuntimeException("wrong release identity");
            $c=new \CoreUpdates\UpdateCore("P02","APP");
            $from=$c->check("2.5.111","2401",$m);
            $target=$c->check("2.5.112","2401",$m);
            if (($from["status"]??"")!=="AVAILABLE") throw new RuntimeException("2.5.111 discovery not AVAILABLE: ".json_encode($from));
            if (($target["status"]??"")!=="UP_TO_DATE") throw new RuntimeException("2.5.112 discovery not UP_TO_DATE: ".json_encode($target));
            echo "P02_V25112_DISCOVERY_FROM_2_5_111=AVAILABLE\n";
            echo "P02_V25112_DISCOVERY_TARGET=UP_TO_DATE\n";
            echo "P02_V25112_STABLE_DISCOVERY=PASS\n";
          '
