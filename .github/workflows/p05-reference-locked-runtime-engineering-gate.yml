name: P05 Reference-Locked Runtime Engineering Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/triggers/p05-reference-runtime-engineering.txt'

permissions:
  contents: read

env:
  PRODUCT_REPOSITORY: llhzx2018/vf-seo
  EXPECTED_COMMIT: f1d74810582668c71d23dbd9a97ddc497813babe
  EXPECTED_TREE: 56f52f938b62215f24af6f1a56dc5d294b2e2b6c
  EXPECTED_VERSION: 1.0.0

jobs:
  engineering-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Existing private read credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'NEW_CREDENTIAL=NO'
          echo 'NEW_RUNNER=NO'

      - name: Checkout exact runtime recovery source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.EXPECTED_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(tr -d '\r\n' < product/VERSION)" = "$EXPECTED_VERSION"
          echo 'SOURCE_IDENTITY=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Install exact dependencies
        working-directory: product
        run: npm ci

      - name: Lint
        working-directory: product
        run: npm run lint

      - name: Typecheck
        working-directory: product
        run: npm run typecheck

      - name: Build
        working-directory: product
        run: npm run build

      - name: Runtime boundary gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < product/VERSION)" = '1.0.0'
          git -C product diff --exit-code
          echo 'ENGINEERING_GATE=PASS'
          echo 'RUNTIME_UI_CHANGE=YES'
          echo 'VERSION_CHANGE=NO'
          echo 'DATABASE_SCHEMA_PROVIDER_CHANGE=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'CANDIDATE=NOT_AUTHORIZED'
          echo 'RELEASE=NOT_AUTHORIZED'
          echo 'PRODUCTION_DEPLOYMENT=NOT_AUTHORIZED'
