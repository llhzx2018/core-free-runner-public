name: P05 Reference-Locked Runtime Engineering Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-reference-locked-runtime-engineering-gate.yml'

permissions:
  contents: write

env:
  PRODUCT_REPOSITORY: llhzx2018/vf-seo
  EXPECTED_COMMIT: f1d74810582668c71d23dbd9a97ddc497813babe
  EXPECTED_TREE: 56f52f938b62215f24af6f1a56dc5d294b2e2b6c
  EXPECTED_VERSION: 1.0.0
  EVIDENCE_PATH: evidence/p05-reference-locked-runtime/engineering-gate.txt

jobs:
  engineering-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - id: credential
        name: Existing private read credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_READ_CREDENTIAL=VF_PRIVATE_READ_TOKEN'
          echo 'NEW_CREDENTIAL=NO'
          echo 'NEW_RUNNER=NO'

      - id: checkout
        name: Checkout exact runtime recovery source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.EXPECTED_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - id: identity
        name: Exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(tr -d '\r\n' < product/VERSION)" = "$EXPECTED_VERSION"
          echo 'SOURCE_IDENTITY=PASS'

      - id: node
        name: Setup Node 24
        uses: actions/setup-node@1e60f620b9541dca1515407da4636679eb50b810
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: product/package-lock.json

      - id: install
        name: Install exact dependencies
        working-directory: product
        run: npm ci

      - id: lint
        name: Lint
        working-directory: product
        run: npm run lint

      - id: typecheck
        name: Typecheck
        working-directory: product
        run: npm run typecheck

      - id: build
        name: Build
        working-directory: product
        run: npm run build

      - id: boundary
        name: Runtime boundary gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < product/VERSION)" = '1.0.0'
          git -C product diff --exit-code
          echo 'RUNTIME_BOUNDARY=PASS'

      - name: Persist gate result for remote readback
        if: always()
        env:
          CREDENTIAL_OUTCOME: ${{ steps.credential.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cat > "$EVIDENCE_PATH" <<EOF
          WORKFLOW=P05 Reference-Locked Runtime Engineering Gate
          WORKFLOW_COMMIT=${GITHUB_SHA}
          RUN_ID=${GITHUB_RUN_ID}
          RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}
          PRODUCT_REPOSITORY=${PRODUCT_REPOSITORY}
          SOURCE_COMMIT=${EXPECTED_COMMIT}
          SOURCE_TREE=${EXPECTED_TREE}
          VERSION=${EXPECTED_VERSION}
          CREDENTIAL=${CREDENTIAL_OUTCOME}
          CHECKOUT=${CHECKOUT_OUTCOME}
          IDENTITY=${IDENTITY_OUTCOME}
          NODE24=${NODE_OUTCOME}
          NPM_CI=${INSTALL_OUTCOME}
          LINT=${LINT_OUTCOME}
          TYPECHECK=${TYPECHECK_OUTCOME}
          BUILD=${BUILD_OUTCOME}
          RUNTIME_BOUNDARY=${BOUNDARY_OUTCOME}
          RUNTIME_UI_CHANGE=YES
          VERSION_CHANGE=NO
          DATABASE_SCHEMA_PROVIDER_CHANGE=NO
          PRODUCTION_WRITE=NO
          CANDIDATE=NOT_AUTHORIZED
          RELEASE=NOT_AUTHORIZED
          PRODUCTION_DEPLOYMENT=NOT_AUTHORIZED
          EOF
          git config user.name 'VF Public Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add "$EVIDENCE_PATH"
          git commit -m "evidence(p05): reference runtime engineering gate ${GITHUB_RUN_ID}" || true
          git push origin HEAD:main

      - name: Final engineering verdict
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOUNDARY_OUTCOME: ${{ steps.boundary.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$LINT_OUTCOME" = success
          test "$TYPECHECK_OUTCOME" = success
          test "$BUILD_OUTCOME" = success
          test "$BOUNDARY_OUTCOME" = success
          echo 'ENGINEERING_GATE=PASS'
