name: P01 V2.38.0 Formal Bind Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2380-formal-bind-gate.yml'

permissions:
  contents: read

jobs:
  formal-bind:
    if: github.event.pull_request.head.ref == 'test/p01-v2380-formal-bind-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c7e47115dd88ed8f88589c0460f8a539bbda417b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Verify formal bind identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'c7e47115dd88ed8f88589c0460f8a539bbda417b'
          test "$(git rev-parse HEAD^{tree})" = '63f7e564c615e750f48a7a9608aa3a0c45548101'
          test "$(git rev-parse HEAD^)" = '2a43090dc77b5ffa76a75538f2b57c33f2aefc1f'
          test "$(cat VERSION)" = '2.38.0'
          ! git show-ref --verify --quiet refs/tags/v2.38.0
          git diff --name-only 2a43090dc77b5ffa76a75538f2b57c33f2aefc1f..HEAD | sort >/tmp/v2380-bind-files.txt
          printf '%s\n' docs/evidence/P01_V2.38.0_FORMAL_BIND_20260902.md >/tmp/v2380-bind-expected.txt
          diff -u /tmp/v2380-bind-expected.txt /tmp/v2380-bind-files.txt
          test "$(git rev-parse HEAD:src)" = "$(git rev-parse 2a43090dc77b5ffa76a75538f2b57c33f2aefc1f:src)"
          grep -Fq 'Candidate Readiness Run: `33619097529`' docs/evidence/P01_V2.38.0_FORMAL_BIND_20260902.md
          grep -Fq 'Candidate Readiness Result: `PASS`' docs/evidence/P01_V2.38.0_FORMAL_BIND_20260902.md
          grep -Fq 'Formal Release Authorization: `NOT YET GRANTED`' docs/evidence/P01_V2.38.0_FORMAL_BIND_20260902.md
          grep -Fq 'Production write: `NO`' docs/evidence/P01_V2.38.0_FORMAL_BIND_20260902.md
          php src/cli/verify.php | tee /tmp/v2380-bind-seed.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/v2380-bind-seed.txt
          echo P01_V2380_FORMAL_SOURCE_IDENTITY=PASS
          echo P01_V2380_RUNTIME_BYTES_UNCHANGED=PASS
          echo P01_V2380_FORMAL_BIND_DELTA=PASS
          echo P01_V2380_NO_PREMATURE_TAG=PASS

      - name: Final read-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'c7e47115dd88ed8f88589c0460f8a539bbda417b'
          test -z "$(git status --porcelain)"
          echo P01_V2380_MAIN_WRITE=0
          echo P01_V2380_RELEASE_WRITE=0
          echo P01_V2380_PRODUCTION_WRITE=0
          echo P01_V2380_FORMAL_BIND=PASS
