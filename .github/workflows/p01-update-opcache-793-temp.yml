name: p01-update-opcache-793-temp

on:
  push:
    branches:
      - run/p01-update-opcache-793

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 02d9b74830407bd1ffb6f14651e6196a8a06ec57
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source and syntax
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "02d9b74830407bd1ffb6f14651e6196a8a06ec57"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          php tests/unit/update_recovery_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          echo P01_UPDATE_OPCACHE_FOCUSED=PASS

      - name: Fresh install baseline
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$PASS"
          rm -rf /tmp/p01-opcache-gate
          cp -a vf-start/src /tmp/p01-opcache-gate
          cd /tmp/p01-opcache-gate
          php -S 127.0.0.1:18105 -t . >/tmp/p01-opcache-gate.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -rf /tmp/p01-opcache-gate*' EXIT
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-opcache.cookies -b /tmp/p01-opcache.cookies http://127.0.0.1:18105/setup.php -o /tmp/p01-opcache-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-opcache-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-opcache.cookies -b /tmp/p01-opcache.cookies -X POST http://127.0.0.1:18105/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=VF Opcache Gate'             --data-urlencode "admin_password=$PASS"             --data-urlencode "admin_password_confirm=$PASS"             -o /tmp/p01-opcache-setup-post.html
          php cli/verify.php | tee /tmp/p01-opcache-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-opcache-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-opcache-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-opcache-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-opcache-baseline.txt
          echo P01_UPDATE_OPCACHE_BASELINE=PASS

      - name: Static runtime cache contract
        working-directory: vf-start
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'private function refreshRuntimeCodeCache(): array' src/app/UpdateManager.php
          grep -Fq 'opcache_invalidate($path, true)' src/app/UpdateManager.php
          grep -Fq 'opcache_reset()' src/app/UpdateManager.php
          grep -Fq "'runtime_code_cache'=>'pass'" src/app/UpdateManager.php
          grep -Fq "$journal['runtime_cache'] = $runtimeCache;" src/app/UpdateManager.php
          echo P01_UPDATE_OPCACHE_CONTRACT=PASS

      - name: Verdict
        run: |
          echo P01_UPDATE_OPCACHE_EXACT_SOURCE_GATE=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN
