name: P01 V2.24.0 Publication Closure
on:
  push:
    paths:
      - '.github/workflows/p01-v2240-publication-closure-20260828.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_ID: '378353376'
      RELEASE_SOURCE: 867e3387b8efb70398287d05fd3652540efa77c8
      RELEASE_TREE: 5985dab8ee071c881fd1e425864ed363e3bdc905
      MAIN_SHA: c299c313559bbb4f58d9a7180fb482fae7ced67a
      SOURCE_SHA: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
      ASSET_NAME: VF_Start_V2.24.0_UPDATE.zip
      ASSET_BYTES: '1210247'
      ASSET_SHA: 7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca
      SCHEMA: '2026082801'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: updates
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Remote publication truth fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REL=$(gh api "repos/llhzx2018/vf-start/releases/$RELEASE_ID")
          test "$(jq -r '.tag_name' <<<"$REL")" = v2.24.0
          test "$(jq -r '.draft' <<<"$REL")" = false
          test "$(jq -r '.prerelease' <<<"$REL")" = false
          test "$(jq -r '.target_commitish' <<<"$REL")" = "$RELEASE_SOURCE"
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.24.0 | jq -r '.object.sha')
          test "$TAG" = "$RELEASE_SOURCE"
          MAIN=$(gh api repos/llhzx2018/vf-start/branches/main | jq -r '.commit.sha')
          test "$MAIN" = "$MAIN_SHA"
          MAIN_TREE=$(gh api repos/llhzx2018/vf-start/git/commits/$MAIN | jq -r '.tree.sha')
          test "$MAIN_TREE" = "$RELEASE_TREE"
          ASSET=$(jq -c --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)' <<<"$REL")
          test -n "$ASSET"
          test "$(jq -r '.size' <<<"$ASSET")" = "$ASSET_BYTES"
          test "$(jq -r '.digest' <<<"$ASSET")" = "sha256:$ASSET_SHA"
          jq -e --arg rid "$RELEASE_ID" --arg sha "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '
            .schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .target_version=="2.24.0" and .update_type=="ATOMIC" and .from_versions==["2.23.0"] and
            .schema_from=="2026082801" and .schema_to=="2026082801" and .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.24.0" and .asset_name=="VF_Start_V2.24.0_UPDATE.zip" and
            .asset_bytes==$ab and .asset_sha256==$ah and (.release_id|tostring)==$rid and
            .release_identity==("v2.24.0@"+$sha) and .backup_required==true and .rollback_supported==true and .minimum_php=="8.0.0"
          ' updates/projects/P01.json >/dev/null
          mkdir -p /tmp/p01-v2240-remote
          gh release download v2.24.0 -R llhzx2018/vf-start -p "$ASSET_NAME" -D /tmp/p01-v2240-remote
          test "$(stat -c %s /tmp/p01-v2240-remote/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/p01-v2240-remote/$ASSET_NAME|awk '{print $1}')" = "$ASSET_SHA"
          test "$(unzip -Z1 /tmp/p01-v2240-remote/$ASSET_NAME)" = 'repair-v2.24.0.php'
          echo P01_V2240_REMOTE_PUBLICATION_FENCE=PASS
      - name: Real V2.23 updater against published manifest and asset
        run: |
          set -Eeuo pipefail
          OWNER=/tmp/p01-v2240-published-owner
          COOKIE=/tmp/p01-v2240-published-owner.cookies
          rm -rf "$OWNER" "$COOKIE"
          cp -a source/src "$OWNER"
          php -S 127.0.0.1:18297 -t "$OWNER" >/tmp/p01-v2240-published-owner.log 2>&1 & PID=$!
          READY=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:18297/setup.php -o /tmp/p01-v2240-published-setup.html; then READY=1; break; fi; sleep 1; done
          test "$READY" = 1
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18297/setup.php -o /tmp/p01-v2240-published-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2240-published-setup.html',encoding='utf-8').read();print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18297/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Published V2240' --data-urlencode 'admin_password=P01V2240!Published' --data-urlencode 'admin_password_confirm=P01V2240!Published' >/tmp/p01-v2240-published-post.html
          kill "$PID" 2>/dev/null || true
          cat >/tmp/p01-v2240-published-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v2240-published-owner/app/bootstrap.php';
          $r=new VfRepository(vf_db());$c=$r->createCategory(['name'=>'Published Sentinel','is_private'=>false]);$l=$r->saveLink(null,['category_id'=>$c,'title'=>'Published Keep','url'=>'https://example.com/published-keep','is_private'=>false],'manual');file_put_contents('/tmp/p01-v2240-published-id',(string)$l['id']);
          PHP
          php /tmp/p01-v2240-published-seed.php
          cp updates/projects/P01.json /tmp/p01-v2240-published-manifest.json
          cat >/tmp/p01-v2240-published-update.php <<'PHP'
          <?php
          require '/tmp/p01-v2240-published-owner/app/bootstrap.php';
          $m=json_decode(file_get_contents('/tmp/p01-v2240-published-manifest.json'),true,512,JSON_THROW_ON_ERROR);$asset='/tmp/p01-v2240-remote/VF_Start_V2.24.0_UPDATE.zip';
          $u=new VfUpdateManager(vf_db(),['manifest_fetcher'=>fn()=>$m,'asset_downloader'=>function(array $x,string $d)use($asset){if(!copy($asset,$d))throw new RuntimeException('copy');return ['size'=>filesize($d)];},'backup_creator'=>fn(string $f,string $t)=>['backup_key'=>'published-'.$f.'-'.$t]]);
          $c=$u->check(true);if(empty($c['ok'])||empty($c['can_update'])||($c['latest_version']??'')!=='2.24.0')throw new RuntimeException('check '.json_encode($c,JSON_UNESCAPED_UNICODE));
          $p=$u->prepare();if(empty($p['ok'])||($p['from_version']??'')!=='2.23.0'||($p['to_version']??'')!=='2.24.0')throw new RuntimeException('prepare');
          $i=$u->install((string)$p['operation_id']);if(empty($i['ok'])||empty($i['updated'])||($i['to_version']??'')!=='2.24.0')throw new RuntimeException('install '.json_encode($i,JSON_UNESCAPED_UNICODE));
          echo "P01_V2240_PUBLISHED_UPDATER_INSTALL=PASS\n";
          PHP
          php /tmp/p01-v2240-published-update.php
          test "$(tr -d '\r\n' < "$OWNER/VERSION.txt")" = 2.24.0
          php "$OWNER/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$OWNER/cli/surface-verify.php" | tee /tmp/p01-v2240-published-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v2240-published-surface.txt
          grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/p01-v2240-published-surface.txt
          php "$OWNER/cli/baseline-verify.php" | tee /tmp/p01-v2240-published-base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v2240-published-base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v2240-published-base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v2240-published-base.txt
          php -r 'require "/tmp/p01-v2240-published-owner/app/bootstrap.php";$id=(int)file_get_contents("/tmp/p01-v2240-published-id");$s=vf_db()->prepare("SELECT title FROM links WHERE id=? AND lifecycle_state=\"active\"");$s->execute([$id]);if($s->fetchColumn()!=="Published Keep")exit(2);if(strtolower((string)vf_db()->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(3);if(count(vf_db()->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))!==0)exit(4);echo "P01_V2240_PUBLISHED_DATA=PASS\n";'
          echo P01_V2240_PUBLISHED_REAL_UPGRADE=PASS
      - name: Final publication verdict
        run: |
          echo P01_V2240_RELEASE_ID=$RELEASE_ID
          echo P01_V2240_RELEASE_SOURCE=$RELEASE_SOURCE
          echo P01_V2240_MAIN=$MAIN_SHA
          echo P01_V2240_UPDATE_ASSET_SHA=$ASSET_SHA
          echo P01_V2240_PUBLICATION_CLOSURE=PASS
          echo PRODUCTION=NO
