name: P07 VPS Audit RC5 Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p07-nodebench-adoption-rc5
    paths:
      - experiments/p07-vps-audit-v21-rc5.sh
      - .github/workflows/p07-vps-audit-rc5.yml

jobs:
  rc5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/experiments/p07-vps-audit-v21-rc5.sh" -o rc5.sh
          chmod +x rc5.sh

      - name: Syntax version and supply-chain contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n rc5.sh
          [[ "$(NO_COLOR=1 bash rc5.sh --version)" == *"2.1.0-rc5-zh" ]]
          grep -q 'f8c6a48cd6ff85b54c5cd2504f0807462dc58938' rc5.sh
          grep -q 'b511bda3b26b6d840698f543d63e956d7466b8512c10ff0ada8292d556c33fb1' rc5.sh
          grep -q 'e2942a26d4b249076486677c9c12cd7f1a572854a5e136597d1391e8ad75ffb0' rc5.sh
          ! grep -Eq '^[[:space:]]*(apt-get|apt|yum|dnf)[[:space:]]+(update|install)|^[[:space:]]*apk[[:space:]]+add' rc5.sh
          ! grep -Eq '^[[:space:]]*(curl|wget).*[|][[:space:]]*(bash|sh)([[:space:]]|$)' rc5.sh
          ! grep -q 'nb.util.eu.org' rc5.sh

      - name: Real pinned fio fallback and Markdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/disk"
          PATH_NO_FIO="$RUNNER_TEMP/no-fio-bin"
          mkdir -p "$PATH_NO_FIO"
          for cmd in bash awk sed grep cut tr wc df stat date mktemp rm mkdir chmod curl wget sha256sum shasum python3 uname id tail timeout; do
            p="$(command -v "$cmd" 2>/dev/null || true)"
            [[ -n "$p" ]] && ln -sf "$p" "$PATH_NO_FIO/$cmd"
          done
          set +e
          env PATH="$PATH_NO_FIO" \
            P07_RC5_SKIP_BASE=1 \
            P07_FIO_TEST_MIB=128 \
            P07_FIO_TIMEOUT_SEC=45 \
            P07_BENCH_DIR="$RUNNER_TEMP/disk" \
            P07_REPORT_DIR="$RUNNER_TEMP/reports" \
            NO_COLOR=1 \
            "$PATH_NO_FIO/bash" rc5.sh | tee rc5.out
          rc=${PIPESTATUS[0]}
          set -e
          [[ $rc -eq 0 ]]
          grep -q '校验版 fio 3.39（临时）' rc5.out
          grep -q '4k' rc5.out
          grep -q '64k' rc5.out
          grep -q '512k' rc5.out
          grep -q '1m' rc5.out
          grep -q '有效档位           : 4 / 4' rc5.out
          grep -q '增强磁盘判断' rc5.out
          grep -q 'Markdown 报告' rc5.out
          grep -q '最终验机结论' rc5.out
          grep -q '完整验机总耗时' rc5.out
          md="$(find "$RUNNER_TEMP/reports" -maxdepth 1 -type f -name '*.md' | head -n1)"
          [[ -s "$md" ]]
          grep -q '增强磁盘混合读写' "$md"
          grep -q '最终验机结论' "$md"
          grep -q '小文件/数据库' "$md"
          grep -q '证据边界' "$md"
          [[ -z "$(find "$RUNNER_TEMP/disk" -maxdepth 1 -name '.p07-fio-*' -print -quit)" ]]

      - name: User-facing UI contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'YABS|Backtrace|pastebin|RC5 增强说明' rc5.out
          ! grep -Eq '是否.*\(Y/n\)|请输入.*Y|请选择' rc5.out

      - name: Upload RC5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p07-vps-audit-rc5-gate
          path: |
            rc5.out
            ${{ runner.temp }}/reports/*.md
