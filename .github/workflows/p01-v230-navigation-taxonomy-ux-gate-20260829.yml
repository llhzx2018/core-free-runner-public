name: P01 V2.30 Navigation Taxonomy UX Gate
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-navigation-taxonomy-ux-gate-20260829.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_SHA: 5fed25739caf5e55f7f822db2f638ccb39566490
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
      PORT: '18583'
      ROOT: /tmp/p01-v230-nav-taxonomy
      ADMIN_PASS: 'P01V230!Taxonomy'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
          grep -F "select[aria-label=\"分类\"]" source/src/assets/workspace-rebaseline.js >/dev/null
          grep -F 'if ($count <= 0 && !$hasVisibleChild) continue;' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          echo P01_V230_NAV_TAXONOMY_SOURCE_FENCE=PASS
      - name: Patch complete taxonomy UX
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell=Path('source/src/app/FunctionalWorkspaceShell.php')
          text=shell.read_text(encoding='utf-8')
          old="""        $childIds = $children[$id] ?? [];
        $hasVisibleChild = false;
        foreach ($childIds as $childId) if ((int)($counts[(int)$childId] ?? 0) > 0) { $hasVisibleChild = true; break; }
        if ($count <= 0 && !$hasVisibleChild) continue;
"""
          new="""        $childIds = $children[$id] ?? [];
        $hasVisibleChild = !empty($childIds);
"""
          assert old in text
          shell.write_text(text.replace(old,new,1),encoding='utf-8')

          js=Path('source/src/assets/workspace-rebaseline.js')
          text=js.read_text(encoding='utf-8')
          old='const select=$(\'select[aria-label="分类"]\',filters);'
          new='const select=$(\'select[aria-label="网址分类"],select[aria-label="分类"]\',filters);'
          assert old in text
          js.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          node --check source/src/assets/workspace-rebaseline.js
          git -C source diff --check
          grep -F '$hasVisibleChild = !empty($childIds);' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'select[aria-label="网址分类"],select[aria-label="分类"]' source/src/assets/workspace-rebaseline.js >/dev/null
          echo P01_V230_NAV_TAXONOMY_PATCH=PASS
      - name: Fresh runtime and seed taxonomy truth
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-tax.cookies evidence
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-tax-server.log 2>&1 &
          COOKIE=/tmp/p01-v230-tax.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.30 Taxonomy' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/setup-post.html
          grep -F 'VF Start 安装完成' /tmp/setup-post.html >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login" -o /tmp/login.json
          jq -e '.ok==true' /tmp/login.json >/dev/null
          CSRF=$(jq -r '.csrf' /tmp/login.json)
          cat >/tmp/seed.py <<'PY'
          import json, subprocess
          base='http://127.0.0.1:18583'
          cookie='/tmp/p01-v230-tax.cookies'
          csrf=open('/tmp/csrf-value').read().strip()
          def post(action,payload):
              out=subprocess.check_output(['curl','-fsS','-c',cookie,'-b',cookie,'-H','Content-Type: application/json','-H',f'X-CSRF-Token: {csrf}','-d',json.dumps(payload,ensure_ascii=False),f'{base}/api.php?action={action}'])
              data=json.loads(out)
              assert data.get('ok') is True, data
              return data
          root=post('category_save',{'name':'开发工具','description':'公开根分类','is_private':False,'sort_order':100})['id']
          empty=post('category_save',{'name':'待拓展','description':'零网址分类','parent_id':root,'is_private':False,'sort_order':90})['id']
          private_root=post('category_save',{'name':'私人资料','description':'私人根分类','is_private':True,'sort_order':80})['id']
          private_child=post('category_save',{'name':'私有工具','description':'继承私人','parent_id':private_root,'is_private':False,'sort_order':70})['id']
          open('/tmp/taxonomy-ids','w').write(f'{root} {empty} {private_root} {private_child}')
          PY
          printf '%s' "$CSRF" >/tmp/csrf-value
          python3 /tmp/seed.py
          read ROOT_ID EMPTY_ID PRIVATE_ROOT PRIVATE_CHILD </tmp/taxonomy-ids
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$CSRF" -F "category_id=$ROOT_ID" -F 'surface=start' -F 'title=GitHub' -F 'url=https://github.com/' -F 'tags=开发,代码' -F 'is_private=0' -F 'source_kind=remote_url' -o /tmp/create-public.json
          jq -e '.ok==true' /tmp/create-public.json >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$CSRF" -F "category_id=$PRIVATE_CHILD" -F 'surface=start' -F 'title=Private Tool' -F 'url=https://example.com/private-tool' -F 'tags=私人' -F 'is_private=0' -F 'source_kind=remote_url' -o /tmp/create-private.json
          jq -e '.ok==true' /tmp/create-private.json >/dev/null
          cp /tmp/taxonomy-ids evidence/taxonomy-ids.txt
          echo P01_V230_NAV_TAXONOMY_RUNTIME=PASS
      - name: Install Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-playwright && cd /tmp/p01-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Desktop and mobile navigation UX gate
        shell: bash
        run: |
          set -Eeuo pipefail
          read ROOT_ID EMPTY_ID PRIVATE_ROOT PRIVATE_CHILD </tmp/taxonomy-ids
          export EMPTY_ID PRIVATE_CHILD
          cat >/tmp/p01-playwright/gate.js <<'JS'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{
            const base='http://127.0.0.1:18583',password='P01V230!Taxonomy';
            const emptyId=process.env.EMPTY_ID, privateChild=process.env.PRIVATE_CHILD;
            const browser=await chromium.launch({headless:true});

            const desktop=await browser.newContext({viewport:{width:1440,height:960},deviceScaleFactor:1});
            let r=await desktop.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('desktop login');
            const dp=await desktop.newPage();await dp.goto(base+'/start.php',{waitUntil:'networkidle'});
            const emptyNode=dp.locator('[data-category-node]',{hasText:'待拓展'});await emptyNode.waitFor({state:'visible'});
            if(!(await emptyNode.textContent()).includes('0'))throw new Error('desktop zero-count category missing count');
            await emptyNode.click();await dp.waitForLoadState('networkidle');
            if(new URL(dp.url()).searchParams.get('category')!==String(emptyId))throw new Error('desktop empty category route');
            await dp.locator('[data-open-add]').first().click();
            const add=dp.locator('[data-add-form]');await add.waitFor({state:'visible'});
            if(await add.locator('[name="category_id"]').inputValue()!==String(emptyId))throw new Error('desktop add category inheritance');
            await dp.locator('[data-add-dialog] [data-close-dialog], [data-add-dialog] button[type="button"]').first().click().catch(()=>{});
            await dp.goto(base+'/start.php?category='+privateChild,{waitUntil:'networkidle'});
            await dp.locator('[data-open-add]').first().click();await add.waitFor({state:'visible'});
            const hint=add.locator('[data-privacy-hint]');await hint.waitFor({state:'visible'});
            if(!(await hint.textContent()).includes('继承自分类'))throw new Error('inherited private hint');
            await dp.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/desktop-navigation.png',fullPage:true});
            await desktop.close();

            const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
            r=await mobile.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('mobile login');
            const mp=await mobile.newPage();await mp.goto(base+'/start.php',{waitUntil:'networkidle'});
            const trigger=mp.locator('.vf-mobile-category-trigger');await trigger.waitFor({state:'visible'});
            if(await mp.locator('select[aria-label="网址分类"]:visible').count())throw new Error('fallback category select still visible');
            await trigger.click();
            const overlay=mp.locator('.vf-mobile-category-overlay');await overlay.waitFor({state:'visible'});
            const search=overlay.locator('input[type="search"]');await search.fill('待拓展');
            const item=overlay.locator('[data-category-picker-item]',{hasText:'待拓展'});await item.waitFor({state:'visible'});
            if(!(await item.textContent()).includes('0'))throw new Error('mobile zero-count category missing');
            await item.click();await mp.waitForLoadState('networkidle');
            if(new URL(mp.url()).searchParams.get('category')!==String(emptyId))throw new Error('mobile empty category route');
            const addBtn=mp.locator('.vf-mobile-command-add');await addBtn.waitFor({state:'visible'});await addBtn.click();
            const madd=mp.locator('[data-add-form]');await madd.waitFor({state:'visible'});
            if(await madd.locator('[name="category_id"]').inputValue()!==String(emptyId))throw new Error('mobile add category inheritance');
            const overflow=await mp.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);
            await mp.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-navigation.png',fullPage:true});
            await mobile.close();await browser.close();
            fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_NAV_TAXONOMY_UX=PASS\n');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/p01-playwright && node gate.js
          echo P01_V230_NAV_TAXONOMY_BROWSER=PASS
      - name: Commit product branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git status --short | wc -l)" -eq 2
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/assets/workspace-rebaseline.js
          git commit -m "refine(P01): restore complete navigation taxonomy UX"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: P01-v230-navigation-taxonomy-evidence
          path: evidence
          retention-days: 7
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_V230_NAV_TAXONOMY_SOURCE=${PRODUCT_SHA}"
          echo "P01_V230_NAV_TAXONOMY_TREE=${PRODUCT_TREE}"
          echo P01_V230_NAV_TAXONOMY_GATE=PASS
