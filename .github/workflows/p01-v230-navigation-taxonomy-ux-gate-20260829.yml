name: P01 V2.30 Navigation Taxonomy Patch
on:
  push:
    branches:
      - task/p01-v230-domain-nav-shell-20260829
    paths:
      - .github/workflows/p01-v230-navigation-taxonomy-ux-gate-20260829.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 5fed25739caf5e55f7f822db2f638ccb39566490
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
      - name: Patch taxonomy UX
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("source/src/app/FunctionalWorkspaceShell.php"); s=p.read_text(encoding="utf-8"); old="        $childIds = $children[$id] ?? [];\n        $hasVisibleChild = false;\n        foreach ($childIds as $childId) if ((int)($counts[(int)$childId] ?? 0) > 0) { $hasVisibleChild = true; break; }\n        if ($count <= 0 && !$hasVisibleChild) continue;\n"; new="        $childIds = $children[$id] ?? [];\n        $hasVisibleChild = !empty($childIds);\n"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          python3 -c 'from pathlib import Path; p=Path("source/src/assets/workspace-rebaseline.js"); s=p.read_text(encoding="utf-8"); old="const select=$(\x27select[aria-label=\"分类\"]\x27,filters);"; new="const select=$(\x27select[aria-label=\"网址分类\"],select[aria-label=\"分类\"]\x27,filters);"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          node --check source/src/assets/workspace-rebaseline.js
          git -C source diff --check
          test "$(git -C source status --short | wc -l)" -eq 2
      - name: Commit product branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/assets/workspace-rebaseline.js
          git commit -m "refine(P01): restore complete navigation taxonomy UX"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_V230_NAV_TAXONOMY_SOURCE=${PRODUCT_SHA}"
          echo "P01_V230_NAV_TAXONOMY_TREE=${PRODUCT_TREE}"
          echo P01_V230_NAV_TAXONOMY_PATCH=PASS
