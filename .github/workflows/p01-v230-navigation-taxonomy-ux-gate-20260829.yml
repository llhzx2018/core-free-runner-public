name: P01 V2.30 Navigation Taxonomy Selector Patch
on:
  push:
    branches:
      - task/p01-v230-domain-nav-shell-20260829
    paths:
      - .github/workflows/p01-v230-navigation-taxonomy-ux-gate-20260829.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 237f0c954bb065a885d168d3b88fe8af4e918236
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          grep -F '.vf-mobile-functional-filters.is-picker-enhanced select[aria-label="分类"]{display:none}' source/src/assets/workspace-rebaseline.css >/dev/null
      - name: Patch selector compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -c 'from pathlib import Path; p=Path("source/src/assets/workspace-rebaseline.css"); s=p.read_text(encoding="utf-8"); old=".vf-mobile-functional-filters.is-picker-enhanced select[aria-label=\"分类\"]{display:none}"; new=".vf-mobile-functional-filters.is-picker-enhanced select[aria-label=\"网址分类\"],.vf-mobile-functional-filters.is-picker-enhanced select[aria-label=\"分类\"]{display:none}"; assert old in s; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          git -C source diff --check
          test "$(git -C source status --short | wc -l)" -eq 1
      - name: Commit product branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/assets/workspace-rebaseline.css
          git commit -m "fix(P01): keep mobile taxonomy picker single-control"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_V230_NAV_TAXONOMY_SOURCE=${PRODUCT_SHA}"
          echo "P01_V230_NAV_TAXONOMY_TREE=${PRODUCT_TREE}"
          echo P01_V230_NAV_TAXONOMY_SELECTOR_PATCH=PASS
