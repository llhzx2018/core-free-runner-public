name: S01-C02 Ops 1.21.855 Visible UI Gate
on:
  push:
    branches:
      - temp/s01-c02-visible-ui-gate-121855-20260907
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Credential boundary
        run: |
          test -z "${VF_RELEASE_WRITE_TOKEN:-}"
          test -z "${VF_PRIVATE_READ_TOKEN:-}"
      - name: Checkout exact Ops candidate
        run: |
          git clone --filter=blob:none https://github.com/llhzx2018/vf-tools-ops.git ops
          cd ops
          git checkout 490e30f8b7160791f02c9315dc67df423e8e7a77
          test "$(git rev-parse HEAD)" = "490e30f8b7160791f02c9315dc67df423e8e7a77"
      - name: Exact six-file UI fence
        run: |
          cd ops
          git diff --name-only 569b0845fd22ab50b67130b6a1bc3e6da36e83d4..HEAD | sort > /tmp/changed
          cat >/tmp/expected <<'EOF'
          VERSION
          assets/css/current/admin-s01-console-v2.css
          tests/admin-human-language-contract.php
          tests/update-refresh-policy-current-contract.php
          tests/visible-console-v2-contract.php
          vf-ops.php
          EOF
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          ! grep -E '(^|/)(schema|migration|wp-update|site-release)/' /tmp/changed
      - name: Full PHP syntax gate
        run: |
          cd ops
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
      - name: Human language regression
        run: |
          cd ops
          php tests/admin-human-language-contract.php
      - name: Update policy regression
        run: |
          cd ops
          php tests/update-refresh-policy-current-contract.php
      - name: Visible UI contract
        run: |
          cd ops
          php tests/visible-console-v2-contract.php
      - name: UI-only behavior boundary
        run: |
          cd ops
          git diff 569b0845fd22ab50b67130b6a1bc3e6da36e83d4..HEAD -- assets/css/current/admin-s01-console-v2.css | grep -q 'vf-pt-v2-status-strip'
          git diff --name-only 569b0845fd22ab50b67130b6a1bc3e6da36e83d4..HEAD | grep -q '^assets/css/current/admin-s01-console-v2.css$'
          test "$(git diff --name-only 569b0845fd22ab50b67130b6a1bc3e6da36e83d4..HEAD | wc -l)" -eq 6
      - name: Post Checkout exact Ops candidate
        run: |
          cd ops
          test "$(git rev-parse HEAD)" = "490e30f8b7160791f02c9315dc67df423e8e7a77"
