name: P02 V2.5.124 Release Preflight Gate

on:
  push:
    branches:
      - run/p02-v25124-release-preflight-20260926
    paths:
      - '.github/workflows/p02-v25121-release-gate.yml'
      - 'requests/p02-v25124-whole-backend-audit.sh'
      - 'requests/p02-v25121-upgrade-matrix.sh'

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.124 Engineering main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 913a8e38c9162c3455859e3b3f3db9095c44dd90
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install PHP SQLite and Chromium runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "913a8e38c9162c3455859e3b3f3db9095c44dd90"
          test "$(git show -s --format=%T HEAD)" = "854dc956aa3611ca268ae2ac95e897e3b7e205fd"
          test "$(cat VERSION)" = "2.5.124"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          bash -n scripts/verify-release-artifacts.sh
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25124_RELEASE_PREFLIGHT_EXACT_SOURCE=PASS

      - name: Clean FULL maintenance browser security gate
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25124-MAINT-${{ github.run_id }}!"
          EVIDENCE_DIR: "${{ runner.temp }}/p02-v25124-maintenance"
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V25124_RELEASE_PREFLIGHT_INSTALL_SECURITY=PASS

      - name: Whole-product browser closure
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25124-whole-backend-audit.sh
          echo P02_V25124_RELEASE_PREFLIGHT_UI_UX=PASS

      - name: Deterministic formal artifact preflight
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25124-RELEASE-${{ github.run_id }}!"
          VF_RELEASE_SOURCE_SHA: 913a8e38c9162c3455859e3b3f3db9095c44dd90
          VF_RELEASE_SOURCE_TREE: 854dc956aa3611ca268ae2ac95e897e3b7e205fd
          VF_RELEASE_SOURCE_REF: main
          VF_RELEASE_FROM_VERSIONS: "2.5.81 2.5.82 2.5.102 2.5.103 2.5.104 2.5.105 2.5.111 2.5.112 2.5.113 2.5.114 2.5.115 2.5.116 2.5.117 2.5.118 2.5.119 2.5.120 2.5.121 2.5.122"
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_V25124_DETERMINISTIC_RELEASE_PREFLIGHT=PASS

      - name: Real-data direct upgrade source-set matrix
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25121-upgrade-matrix.sh

      - name: Release-time Public Authority applicability marker
        run: |
          cat <<'EOF'
          INSTALL=PASS
          SECURITY=PASS
          TESTING=PASS
          UPGRADE=PASS
          DATA_SCHEMA=PASS
          API_PROVIDER=N_A_NO_PROVIDER_CHANGE
          SEO=N_A_PRIVATE_NOINDEX
          CRON_JOB=PASS
          NOTIFICATION=PASS
          OBSERVABILITY=PASS
          PERFORMANCE=N_A_NOT_TRIGGERED
          GIT=PASS
          UA_UI=PASS
          OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          NO_UNKNOWN_APPLICABILITY=YES
          RELEASE_WRITE=NOT_EXECUTED
          DISTRIBUTION_WRITE=NOT_EXECUTED
          PRODUCTION_WRITE=NOT_EXECUTED
          P02_V25124_RELEASE_PREFLIGHT_GATE=PASS
          EOF
