name: P02 V2.5.122 Settings Production Closure Gate

on:
  push:
    branches:
      - run/p02-v25122-settings-production-closure-20260925
    paths:
      - '.github/workflows/p02-v25121-release-gate.yml'
      - 'requests/p02-v25121-settings-browser.sh'
      - 'requests/p02-v25121-upgrade-matrix.sh'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.122 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 84f10f075b79f2287e2d1e116429761228f44efb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install PHP SQLite and Chromium runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "84f10f075b79f2287e2d1e116429761228f44efb"
          test "$(git show -s --format=%T HEAD)" = "85ee1e7f8f989a6050f357725ef7646a3d983dc9"
          test "$(cat VERSION)" = "2.5.122"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          bash -n scripts/verify-release-artifacts.sh
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25122_EXACT_SOURCE_UNIT_REPOSITORY=PASS

      - name: Clean FULL maintenance browser security gate
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25122-MAINT-${{ github.run_id }}!"
          EVIDENCE_DIR: "${{ runner.temp }}/p02-v25121-maintenance"
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V25122_MAINTENANCE_SECURITY_BROWSER=PASS

      - name: Nine-page Settings Production browser matrix
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25121-settings-browser.sh

      - name: Public authority release coverage marker
        run: |
          cat <<'EOF'
          INSTALL=PASS
          SECURITY=PASS
          TESTING=PASS
          UPGRADE=N_A_NO_RELEASE_WRITE
          DATA_SCHEMA=PASS
          GIT=PASS
          UA_UI=PASS
          OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          OBSERVABILITY=N_A_NO_PRODUCTION_WRITE
          NO_UNKNOWN_APPLICABILITY=YES
          P02_V25122_SETTINGS_PRODUCTION_CLOSURE_GATE=PASS
          EOF
