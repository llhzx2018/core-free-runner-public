name: TEMP P01 V2.47.278 Distribution Discovery Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-v247278-distribution-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.278 distribution discovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXPECTED_SOURCE: 2.47.277
      EXPECTED_TARGET: 2.47.278
      EXPECTED_RELEASE_ID: '406295713'
      EXPECTED_PRODUCT_IDENTITY: 3e367c082a28ede85d1ea61b105550893f5c2765
      EXPECTED_ASSET: VF_Start_V2.47.278_UPDATE.zip
      EXPECTED_ASSET_BYTES: '2359229'
      EXPECTED_ASSET_SHA256: d2da355290f6aa1d5814bb37570ff10143d345e187bb3d635b5b609fd22c083d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl jq >/dev/null

      - name: Execute installed-source discovery
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "v$EXPECTED_SOURCE" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" source
          READ_TOKEN="$READ_TOKEN" php -d display_errors=1 -r '
            require "source/src/app/CoreUpdates/UpdateCore.php";
            require "source/src/app/CoreUpdates/GitHubClient.php";
            $client=new \CoreUpdates\GitHubClient((string)getenv("READ_TOKEN"),"p01-v247278-discovery-proof");
            $m=$client->fetchProjectManifest("llhzx2018/core-updates","P01.json","main");
            $expected=[
              "current_version"=>"2.47.277","target_version"=>"2.47.278","update_type"=>"ATOMIC",
              "release_id"=>406295713,"product_identity"=>"3e367c082a28ede85d1ea61b105550893f5c2765",
              "asset_name"=>"VF_Start_V2.47.278_UPDATE.zip","asset_bytes"=>2359229,
              "asset_sha256"=>"d2da355290f6aa1d5814bb37570ff10143d345e187bb3d635b5b609fd22c083d",
              "released_at"=>"2026-10-08T00:59:52Z"
            ];
            foreach($expected as $k=>$v)if(!array_key_exists($k,$m)||$m[$k]!==$v){fwrite(STDERR,"MANIFEST_MISMATCH:$k\n");exit(10);}
            if(($m["from_versions"]??null)!==["2.47.277"]){fwrite(STDERR,"MANIFEST_MISMATCH:from_versions\n");exit(11);}
            $notes=(string)($m["notes"]??"");
            foreach(["Cron","Worker","self-drive","Production","Owner","Atomic","Release","Provider","Server","core-updates","success","failed","rolled_back"] as $bad){
              if(strpos($notes,$bad)!==false){fwrite(STDERR,"OWNER_NOTE_ENGLISH_LEAK:$bad\n");exit(13);}
            }
            foreach(["无需配置服务器定时器","下次使用时补跑","高级服务器后台运行方式"] as $must){
              if(strpos($notes,$must)===false){fwrite(STDERR,"OWNER_NOTE_MISSING:$must\n");exit(14);}
            }
            $core=new \CoreUpdates\UpdateCore("P01","APP");
            $result=$core->check("2.47.277","2026090401",$m);
            if(($result["status"]??"")!=="AVAILABLE"||($result["target_version"]??"")!=="2.47.278"||($result["from_version"]??"")!=="2.47.277"){
              fwrite(STDERR,"UPDATER_DISCOVERY_FAIL\n");exit(12);
            }
            echo "P01_UPDATER_DISCOVERY=PASS\nP01_UPDATER_STATUS=AVAILABLE\nP01_UPDATER_TARGET=2.47.278\nP01_OWNER_NOTES_CHINESE_FIRST=PASS\n";
          '

      - name: Remote release and asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$PRODUCT_REPO/releases/tags/v$EXPECTED_TARGET" > /tmp/release.json
          jq -e --argjson id "$EXPECTED_RELEASE_ID" --arg tag "v$EXPECTED_TARGET" '.id==$id and .tag_name==$tag and .draft==false and .prerelease==false' /tmp/release.json >/dev/null
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v$EXPECTED_TARGET" --jq '.object.sha')" = "$EXPECTED_PRODUCT_IDENTITY"
          jq -e --arg n "$EXPECTED_ASSET" --argjson s "$EXPECTED_ASSET_BYTES" --arg d "sha256:$EXPECTED_ASSET_SHA256" '.assets[]|select(.name==$n)|(.size==$s and .digest==$d)' /tmp/release.json >/dev/null
          rm -rf /tmp/p01 && mkdir /tmp/p01
          gh release download "v$EXPECTED_TARGET" -R "$PRODUCT_REPO" -D /tmp/p01 -p "$EXPECTED_ASSET"
          test "$(stat -c %s "/tmp/p01/$EXPECTED_ASSET")" = "$EXPECTED_ASSET_BYTES"
          test "$(sha256sum "/tmp/p01/$EXPECTED_ASSET" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          echo P01_RELEASE_IDENTITY_READBACK=PASS
          echo P01_ASSET_REMOTE_READBACK=PASS
          echo PRODUCTION_WRITE=NO
          echo P01_V247278_DISTRIBUTION_DISCOVERY=PASS
