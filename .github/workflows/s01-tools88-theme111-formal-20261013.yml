name: S01 three-tool final fixes exact candidate formal release
on:
  push:
    branches: [task/s01-tools88-theme111-formal-20261013]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.111'
      TARGET_SHA: '64f27394d98a21db0816146216afa045b31ca5fc'
      TARGET_TREE: '3e78a91ac2fe1074d1d42cfeaad6dbaaa4c06c40'
      TARGET_MAIN_SHA: 'd251a422a51e613ae762679021049baa292ad2de'
      SOURCE_VERSION: '1.35.110'
      BASE_SHA: '7e327288975cf6f31b08e90c1b083546d58a8376'
      M3_VERSION: '1.25.88'
      M3_SHA: 'fe2fca80f0ebdcdd95562758849c1b9807ee904f'
      M3_TREE: '4a3b793ae64aea662c40860f19c454f438d7b926'
      M3_MAIN_SHA: 'e7024395436249068677766c3e6d562bb9851768'
      M3_SOURCE_VERSION: '1.25.87'
      CANDIDATE_RUN: '38339114998'
      CANDIDATE_SHA: 'c36475951aea88bfbd04d4ac52d1cc3f777bff0e'
      CANDIDATE_ARTIFACT: '11786216704'
      CANDIDATE_DIGEST: 'sha256:2a41217da311267cb59ccd036287c5b92b34873dca42d839a47628b970607a85'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-tools88-theme111-formal-20261013/spec.json --template runner/lanes/s01-tools88-theme111-formal-20261013/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-tools88-theme111-formal-20261013.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-tools88-theme111-formal-20261013/spec.json --input runner/.github/workflows/s01-tools88-theme111-formal-20261013.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-tools88-theme111-formal-20261013 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic dual rebuild and asset equality
        run: bash lane/build.sh
      - name: Publish authorized private formal releases and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: s01-checker-components-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['theme-FINAL_RELEASE.json','m3u8-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PASS dual formal public-safe receipt reverse readback')
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip

