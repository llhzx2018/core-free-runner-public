name: P07 release84 formal delivery

on:
  push:
    branches: [main]
    paths:
      - 'release-requests/P07_RELEASE84.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact release84 distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release84"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc42"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc42'" installers/p07-system-care.sh
          test "$(git hash-object dist/p07/0.1.0/overlay/BUILD_ID)" = 'ecf5f8f65201797ab37d543442f1f6cbaa04f432'
          test "$(git hash-object installers/p07-final.sh)" = '9760c352ac71629902e2e317f39b71b323a02a79'
          test "$(git hash-object installers/p07.sh)" = '502b679955e1fadaf8a062de2ca1820c693a9ee2'
          test "$(git hash-object packages/p07-system-care/0.1.0-rc42/MANIFEST.gitblob)" = '80fdb57b28e37a5cd707d1f32028a479cff9525e'
          bash -n installers/p07.sh
          bash -n installers/p07-final.sh
          bash -n installers/p07-toolbox.sh
          bash -n installers/p07-system-care.sh
          echo 'P07_RELEASE84_FORMAL_BOUND=PASS'

      - name: Publish formal tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag='p07-v0.1.0-release84'
          repo='llhzx2018/core-free-runner-public'
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo 'P07_RELEASE84_ALREADY_EXISTS=TRUE'
          else
            gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" \
              --title 'P07 · VF Server Ops V0.1.0 · release84' \
              --notes-file release-requests/P07_RELEASE84.md --latest=false
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag="$(gh release view p07-v0.1.0-release84 --repo llhzx2018/core-free-runner-public --json tagName --jq .tagName)"
          test "$tag" = p07-v0.1.0-release84
          echo 'P07_RELEASE84_FORMAL_RELEASE=PASS'
