name: S01-C01 layout controls formal release
on:
  push:
    branches: [task/s01-c01-layout-controls-13569-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.69'
      TARGET_SHA: '79b0b8806a1aa8c9bfe4b3bcb436022989a4e292'
      TARGET_TREE: '98e2e5f7abc893e83e3136347802b00b211c7e10'
      BASE_SHA: 'a1fa4695fde9f50e1da3a8be1c02c7b09e9b2cf3'
      CANDIDATE_RUN: '36994402732'
      CANDIDATE_SHA: '6bc9973d474d469c8c9d5226aec0cc9fedecd6ef'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-layout-v8-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .fixture_browser=="PASS" and .brand_persistence=="PASS" and .brand_csrf=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .choice_controls=="PASS" and .recovery_controls=="PASS" and .number_controls=="PASS" and .preview_controls=="PASS" and .preview_scroll=="PASS" and .advanced_controls=="PASS" and .advanced_interactions=="PASS" and .layout_browser=="PASS" and .layout_cases==120 and .layout_persistence=="PASS" and .layout_csrf=="PASS" and .layout_modal_keyboard=="PASS" and .layout_information_hierarchy=="PASS" and .layout_save_no_occlusion=="PASS" and .layout_module_affordance=="PASS" and .layout_module_provenance=="PASS" and .layout_module_enable=="PASS" and .layout_all_controls=="PASS" and .layout_control_cases==40 and .layout_control_checks>1000 and .layout_section_isolation=="PASS" and .layout_mouse_wheel=="PASS"' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-layout-controls-13569 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          页面结构与布局：修复模块编辑弹窗内部卡片裁切，鼠标滚轮可到达最后一个字段；打开时聚焦可见控件。复选框使用原生勾选绘制。功能设置、模块编排、显示规则与阅读设置每次展开一个区域，切换保留输入并统一保存；模块编辑指向原来的功能工作区。按现有页型模块目录移除无效设置（工具目录不支持的步骤模块），补齐功能工作区原有模块字段的序列化，恢复顺序或停用后保留未启用模块的开关和值；补齐搜索空结果恢复已有“常搜关键词”开关的保存，开启与关闭均可回读。文章、指南、问题详情编辑入口按原有所有者目录进入对应设置，避免空编辑器。基础布局控制脚本加入版本缓存标识。保存端点、字段、权限和数据模型合同保持。
          Shell / Header / Header Menu 保持冻结。更新引擎、凭证、权限和设置语义保持原样。
          Exact candidate Run: $CANDIDATE_RUN。真实 WordPress 原生升级与源码恢复、20页型×6宽度布局回归，20页型×2宽度逐控件点击/标签/空格/全部下拉选项/输入/保存重载与字段隔离，真实滚轮、功能面板、弹窗和矮窗口、布局保存回读/冲突/安全负例、品牌24组源码渲染与6宽度回归已通过。
          发布前独立 Preview Runtime 按项目 SSOT 为 N_A；OWNER 生产真实使用验收仍待完成。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-layout-v8-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip

