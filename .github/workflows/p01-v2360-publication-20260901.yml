name: P01 V2.36.0 Publication
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-publication-20260901.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      FORMAL_TREE: 8af6d8ea6168fae52988cae8272a19073a0a7a2e
      RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      FORMAL_RUN: '33420558251'
      FORMAL_ARTIFACT: p01-v2360-formal-artifact-33420558251
      FORMAL_DIGEST: sha256:ee31e7afe5fd4a7a69b50cec385fb0cfb8f4a2744e360b894940dc005c46e1b5
      STRICT_RUN: '33420751341'
      PROMOTION_RUN: '33469243080'
      DOWNLOAD: /tmp/p01-v2360-publish-download
      ROUNDTRIP: /tmp/p01-v2360-release-roundtrip
      EVID: /tmp/p01-v2360-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.DOWNLOAD }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Publish exact tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.0-FULL.zip' -print -quit)
          test -n "$FULL"
          PACK=$(dirname "$FULL")
          test "$(find "$PACK" -maxdepth 1 -type f | wc -l)" = 8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PROMOTION_RUN --jq .conclusion)" = success
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$FORMAL_SOURCE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.0 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.36.0 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$PACK"
          sha256sum -c SHA256SUMS.txt | tee "$EVID/sha256-check.txt"
          jq -e '.formal_source=="225780b1ed56bbcc8e62ba465b1129e1c22ee60a" and .formal_tree=="8af6d8ea6168fae52988cae8272a19073a0a7a2e" and .runtime_tree=="ad3f96345ead330adffb20c7ecb3cdf6537036b6" and .version=="2.36.0" and .source_version=="2.35.3" and .schema=="2026082901" and .migration==null and .owner_production_write==false' P01-V2.36.0-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF-Start-V2.36.0-FULL.zip | awk '{print $1}')" = eef5dcdb1c5eaa680146345a33ff2886c5205ea16612be4465356f4076fe9839
          test "$(stat -c %s VF-Start-V2.36.0-FULL.zip)" = 648612
          test "$(sha256sum VF_Start_V2.36.0_UPDATE.zip | awk '{print $1}')" = 26daa0fefff8a867a554750fbd4a92106fb2f9b1f68014cf8dd214d837fe0ee6
          test "$(stat -c %s VF_Start_V2.36.0_UPDATE.zip)" = 1404941
          test "$(sha256sum repair-v2.36.0.php | awk '{print $1}')" = 8f47717399159faffcccab2ca3d5d86e9e550cd821d3568cbbd70e1915595536
          test "$(stat -c %s repair-v2.36.0.php)" = 4025845
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.36.0"
          TAG=$(git ls-remote --tags origin refs/tags/v2.36.0 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          gh release create v2.36.0 "$PACK"/* --repo llhzx2018/vf-start --verify-tag --title 'VF Start V2.36.0' --notes 'V2.36.0 收口 V2.35.3 Production 后完整 L2 Product Optimization：Home / 网址管理 / 后台 Shell / Browser Helper / 五域 Workspace 的日常效率、移动端可达性与状态语义统一；Pending 整理、移动分页、批量/筛选/模式选择安全与移动触控目标完成真实 Gate；新增 ResourceMetadata、ResourceCoverCache 与 resource-cover-refresh.php，实现资源内容类型/Provider 分离与自动本地封面缓存，同时保持单一 links/Data Authority；管理员、公开预览、匿名三种状态显式分离。Schema 仍为 2026082901，无 Migration。Candidate 33420047480 PASS；Formal Artifact 33420558251 PASS；Strict Fresh 33420751341 PASS；Main Promotion 33469243080 PASS。Owner Production 不由 Assistant 写入。'
          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.0 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.0
          test "$(jq -r .target_commitish "$EVID/release.json")" = v2.36.0 || true
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.36.0 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$PACK"/*; do
            n=$(basename "$f")
            test -f "$ROUNDTRIP/$n"
            test "$(sha256sum "$f"|awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n"|awk '{print $1}')"
            test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"
          done
          UPDATE_SHA=$(sha256sum "$ROUNDTRIP/VF_Start_V2.36.0_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c %s "$ROUNDTRIP/VF_Start_V2.36.0_UPDATE.zip")
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2360_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nUPDATE_ASSET=VF_Start_V2.36.0_UPDATE.zip\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2360-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
