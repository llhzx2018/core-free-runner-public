name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-preview-dialog169-20261022]
    paths: ['.github/workflows/s01-preview-dialog169-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.169
  TARGET_SHA: ee888dcb308cbc687ae52d33c258cc61a43ee4ee
  UPDATE_SHA: a1f7dea2348ed62f8a5b7e4dc7a4ad8d58cec483
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: a1f7dea2348ed62f8a5b7e4dc7a4ad8d58cec483
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='383f50900aeb9e006aad98e7b4c8419cb044a0cd08e45031eb9b8fb9bcd54fe3' and m['asset_bytes']==1971830
          assert m['runtime_files']==476 and '1.35.168' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
