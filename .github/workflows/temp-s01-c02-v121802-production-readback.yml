name: TEMP S01-C02 Ops 1.21.802 Production Readback

on:
  push:
    branches:
      - temp/s01-c02-v121802-production-readback-20260904
    paths:
      - '.github/workflows/temp-s01-c02-v121802-production-readback.yml'

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read public Production state
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/s01-prod-readback
          ROOT='https://www3.m3u8.one/'
          DOMAIN='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          SEO='https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          root_code="$(curl -sS -L --retry 3 -o /tmp/s01-prod-readback/root.html -w '%{http_code}' "$ROOT")"
          domain_code="$(curl -sS -L --retry 3 -o /tmp/s01-prod-readback/domain.json -w '%{http_code}' "$DOMAIN")"
          seo_code="$(curl -sS -L --retry 3 -o /tmp/s01-prod-readback/seo.json -w '%{http_code}' "$SEO")"
          test "$root_code" = 200
          test "$domain_code" = 200
          test "$seo_code" = 200
          jq empty /tmp/s01-prod-readback/domain.json
          jq empty /tmp/s01-prod-readback/seo.json
          jq '{pluginVersion,status,authorityFinalHost,configuredPublicBaseUrl,authorityMatch,revision}' /tmp/s01-prod-readback/domain.json > /tmp/s01-prod-readback/domain-safe.json
          jq '{pluginVersion,closureStatus,ownerActionRequired,formalPrimaryCount,ownerCandidateCount,plannerRows,plannerRevision,bridgeStatus,gateStatus,gateBlocking,gateWarnings,preflightStatus,preflightCode,readyForPublish,updatedAt}' /tmp/s01-prod-readback/seo.json > /tmp/s01-prod-readback/seo-safe.json
          echo 'DOMAIN_SAFE:'
          cat /tmp/s01-prod-readback/domain-safe.json
          echo 'SEO_SAFE:'
          cat /tmp/s01-prod-readback/seo-safe.json
          echo PUBLIC_PRODUCTION_READBACK=PASS
      - name: Upload safe readback evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121802-production-readback
          path: |
            /tmp/s01-prod-readback/domain-safe.json
            /tmp/s01-prod-readback/seo-safe.json
          retention-days: 14
