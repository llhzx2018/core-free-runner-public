name: p01-watch-pr1722-exact-once

# One-off public-safe machine proof. Do not merge into public Runner main.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-watch-pr1722-exact-once.yml'

permissions:
  contents: read

jobs:
  exact-watch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-watch-pr1722-exact-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare isolated PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip >/dev/null
          php -v
          php -m | grep -Fi 'pdo_sqlite'
          echo 'P01_WATCH_HOSTED_PHP_READY=PASS'

      - name: Checkout exact private Watch PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 57f9536a8d077a6bcd4a3dd7f8d784112d36eb4f
          path: candidate
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Validate source identity and focused Watch contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '57f9536a8d077a6bcd4a3dd7f8d784112d36eb4f'
          test "$(tr -d '\r\n ' < candidate/VERSION)" = '2.47.454'
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = '2.47.454'
          for file in \
            src/app/SubjectPageChrome.php \
            src/app/WatchMediaLibraryPage.php \
            tests/unit/frontend_channels_watch_r3_contract.php \
            tests/unit/watch_card_action_hierarchy_contract.php \
            tests/unit/watch_operable_subsite_ux_contract.php \
            tests/unit/watch_page_filter_hierarchy_contract.php \
            tests/unit/watch_public_privacy_density_v247390_contract.php \
            tests/unit/watch_v247145_shelf_fine_polish_contract.php; do
            php -l "candidate/$file" >/dev/null
          done
          cd candidate
          php tests/unit/frontend_channels_watch_r3_contract.php
          php tests/unit/watch_card_action_hierarchy_contract.php
          php tests/unit/watch_operable_subsite_ux_contract.php
          php tests/unit/watch_page_filter_hierarchy_contract.php
          php tests/unit/watch_public_privacy_density_v247390_contract.php
          php tests/unit/watch_v247145_shelf_fine_polish_contract.php
          echo 'P01_WATCH_PR1722_EXACT_CONTRACTS=PASS'

      - name: Fresh install and real anonymous and owner Watch HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          TESTROOT="$RUNNER_TEMP/p01-watch-pr1722-install"
          mkdir -p "$TESTROOT"
          cp -a candidate/src/. "$TESTROOT/"
          php -S 127.0.0.1:18672 -t "$TESTROOT" >"$RUNNER_TEMP/p01-watch-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT
          BASE=http://127.0.0.1:18672
          for _ in $(seq 1 40); do
            if curl -fsS "$BASE/setup.php" -o "$RUNNER_TEMP/watch-setup.html"; then break; fi
            sleep 1
          done
          CSRF=$(python3 -c 'import re,sys; t=open(sys.argv[1],encoding="utf-8").read(); m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",t); assert m; print(m.group(1))' "$RUNNER_TEMP/watch-setup.html")
          curl -fsS -X POST "$BASE/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=Watch Ephemeral Machine Gate" \
            --data-urlencode "admin_password=WatchGate!2026" \
            --data-urlencode "admin_password_confirm=WatchGate!2026" \
            -o "$RUNNER_TEMP/watch-install-response.html"
          (cd "$TESTROOT" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          GUEST_STATUS=$(curl -sS "$BASE/watch.php" -o "$RUNNER_TEMP/watch-guest.html" -w '%{http_code}')
          echo "P01_WATCH_GUEST_HTTP_STATUS=$GUEST_STATUS"
          echo "P01_WATCH_GUEST_BODY_BYTES=$(wc -c < "$RUNNER_TEMP/watch-guest.html")"
          test "$GUEST_STATUS" = '200'
          if ! grep -F 'data-vf-mode="watch"' "$RUNNER_TEMP/watch-guest.html" >/dev/null; then
            echo 'P01_WATCH_GUEST_BODY_MODE=ABSENT' >&2
            exit 1
          fi
          if grep -F 'id="vf-workspace-data"' "$RUNNER_TEMP/watch-guest.html" >/dev/null; then
            echo 'P01_WATCH_GUEST_PRIVATE_PAYLOAD_LEAK=FAIL' >&2
            exit 1
          fi
          curl -fsS "$BASE/watch.php?view=recent" -o "$RUNNER_TEMP/watch-guest-recent.html"
          grep -F 'data-vf-mode="watch"' "$RUNNER_TEMP/watch-guest-recent.html" >/dev/null
          curl -fsS -c "$RUNNER_TEMP/watch-owner.cookie" -b "$RUNNER_TEMP/watch-owner.cookie" \
            -H 'Content-Type: application/json' \
            --data '{"password":"WatchGate!2026"}' "$BASE/api.php?action=login" \
            | grep -F '"ok":true' >/dev/null
          curl -fsS -b "$RUNNER_TEMP/watch-owner.cookie" \
            "$BASE/watch.php?view=recent" -o "$RUNNER_TEMP/watch-owner-recent.html"
          grep -F 'data-vf-mode="watch"' "$RUNNER_TEMP/watch-owner-recent.html" >/dev/null
          echo 'P01_WATCH_PR1722_FRESH_INSTALL_GUEST_OWNER_HTTP=PASS'

      - name: Ephemeral private source cleanup; no public artifact
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d candidate ]; then
            rm -rf candidate
          fi
          echo 'P01_WATCH_PRIVATE_SOURCE_NOT_PERSISTED=PASS'
