name: TEMP S01-C02 Owner Tool Workbench Gate

on:
  push:
    branches:
      - temp/s01-c02-owner-tool-workbench-gate-20260901

permissions:
  contents: read

concurrency:
  group: temp-s01-c02-owner-tool-workbench-gate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Ops recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1fa6ac391b908ccbb7db62412bab17fac5ae0d40
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Exact source and scope gate
        shell: bash
        working-directory: ops
        env:
          VF_BASE_SHA: 8c2c0280ab44cff939f281281685bac225799b69
          VF_HEAD_SHA: 1fa6ac391b908ccbb7db62412bab17fac5ae0d40
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$VF_HEAD_SHA"
          git cat-file -e "$VF_BASE_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$VF_BASE_SHA" "$VF_HEAD_SHA" | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          expected=(
            'includes/admin-menu-service.php'
            'includes/s01/tool-workbench.php'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done
          forbidden='^(VERSION|RELEASE\.md|CHANGELOG\.md|dist/|release/|\.github/)'
          if printf '%s\n' "${changed[@]}" | grep -Eq "$forbidden"; then
            echo 'FORBIDDEN_SCOPE_CHANGE=FAIL'
            exit 1
          fi
          echo 'EXACT_SOURCE_SCOPE=PASS'

      - name: PHP syntax gate
        shell: bash
        working-directory: ops
        run: |
          set -Eeuo pipefail
          php -v
          php -l includes/admin-menu-service.php
          php -l includes/s01/tool-workbench.php
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/s01-c02-php-lint.txt
          echo "PHP_FILES_LINTED=$(wc -l </tmp/s01-c02-php-lint.txt)"
          echo 'PHP_SYNTAX=PASS'

      - name: OWNER and Provider boundary gate
        shell: bash
        working-directory: ops
        run: |
          set -Eeuo pipefail
          file='includes/s01/tool-workbench.php'
          grep -Fq "vf_m3u8_first_run_readiness" "$file"
          grep -Fq "vf_m3u8_first_run_initialize" "$file"
          grep -Fq "current_user_can('manage_options')" "$file"
          grep -Fq 'wp_verify_nonce' "$file"
          grep -Fq "'vf-toolsite-tools'" includes/admin-menu-service.php
          grep -Fq "['vf-toolsite-tools', '工具', '工具', 'vf_ops_s01_tool_workbench_render_v1']" includes/admin-menu-service.php
          grep -Fq "array_splice(\$slugs, 1, 0, ['vf-toolsite-tools'])" includes/admin-menu-service.php
          if grep -Eq '\b(update_option|delete_option|add_option|wp_insert_post|wp_update_post|wp_delete_post)\s*\(' "$file"; then
            echo 'OPS_DIRECT_PROVIDER_OR_PAGE_WRITE=FAIL'
            exit 1
          fi
          if grep -Eqi 'vf_theme_.*(render|provider)|template_redirect|the_content\s*\(' "$file"; then
            echo 'THEME_RENDERER_OWNERSHIP=FAIL'
            exit 1
          fi
          echo 'OWNER_PROVIDER_BOUNDARY=PASS'

      - name: Product-object link contract gate
        shell: bash
        working-directory: ops
        run: |
          set -Eeuo pipefail
          file='includes/s01/tool-workbench.php'
          grep -Fq "m3u8-download-record" "$file"
          grep -Fq "get_edit_post_link" "$file"
          grep -Fq "'seo_refine', ['post_id'=>\$flowPageId]" "$file"
          grep -Fq "vf-tool-m3u8-tools" "$file"
          grep -Fq "预览工具" "$file"
          grep -Fq "高级 · Provider 工程能力" "$file"
          echo 'PRODUCT_OBJECT_LINKS=PASS'

      - name: Build public-safe receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat > evidence/S01_C02_OWNER_TOOL_WORKBENCH_GATE.txt <<'EOF'
          S01_C02_OWNER_TOOL_WORKBENCH_GATE=PASS
          OPS_BASE_SHA=8c2c0280ab44cff939f281281685bac225799b69
          OPS_HEAD_SHA=1fa6ac391b908ccbb7db62412bab17fac5ae0d40
          OPS_PR=7
          EXACT_CHANGED_FILES=includes/admin-menu-service.php;includes/s01/tool-workbench.php
          EXACT_SOURCE_SCOPE=PASS
          PHP_SYNTAX=PASS
          OWNER_PROVIDER_BOUNDARY=PASS
          PRODUCT_OBJECT_LINKS=PASS
          RELEASE_WRITE=NO
          TAG_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          PRIVATE_SOURCE_PERSISTED=NO
          BROWSER_OWNER_ACCEPTANCE=PENDING
          EOF

      - name: Upload public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c02-owner-tool-workbench-gate-${{ github.run_id }}
          path: evidence/S01_C02_OWNER_TOOL_WORKBENCH_GATE.txt
          if-no-files-found: error
          retention-days: 14
