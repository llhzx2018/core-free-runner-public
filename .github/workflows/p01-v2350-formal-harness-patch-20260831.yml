name: P01 V2.35.0 Formal Harness Patch

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-formal-harness-patch-20260831.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2350-orchestrator-20260831
          fetch-depth: 0
      - name: Patch one Harness-only local binding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p01-v2350-formal-artifact-gate-20260831.yml')
          s=p.read_text(encoding='utf-8')
          old='            local root="$1" src="$2" port="$3" label="$4" cookie="$EVID/$label.cookies"\n'
          new='            local root="$1" src="$2" port="$3" label="$4"\n            local cookie="$EVID/$label.cookies"\n'
          if s.count(old)!=1:
              raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/p01-v2350-formal-artifact-gate-20260831.yml
          test "$(git diff --numstat -- .github/workflows/p01-v2350-formal-artifact-gate-20260831.yml)" = $'2\t1\t.github/workflows/p01-v2350-formal-artifact-gate-20260831.yml'
      - name: Commit Harness-only fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add .github/workflows/p01-v2350-formal-artifact-gate-20260831.yml
          git commit -m 'fix(P01): split formal gate cookie local binding'
          git push origin HEAD:release/p01-v2350-orchestrator-20260831
          echo P01_V2350_FORMAL_HARNESS_PATCH=PASS
