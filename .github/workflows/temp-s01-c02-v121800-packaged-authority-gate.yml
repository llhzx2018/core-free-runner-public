name: TEMP S01-C02 Ops 1.21.800 Packaged Authority Gate

on:
  push:
    branches:
      - temp/s01-c02-v121800-packaged-authority-gate-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121800-packaged-authority-gate.yml'

permissions:
  contents: read

jobs:
  packaged-authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_ops_gate
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_BASE_SHA: 4a04c70ba20ba7407230c8121aa6e5f11ac29743
      OPS_CANDIDATE_SHA: 7f7babb6a92ea297dc99e86ac632fcef22c96319
      OPS_CANDIDATE_TREE: 9585eee48c4fb19e5bae9eb605f8bb15d40bafb2
      BASE_RELEASE_ASSET_ID: '543806414'
      BASE_RELEASE_BYTES: '3202380'
      BASE_RELEASE_SHA256: f1ef9c80259578cd1f5243e570d34633685f7628a7c8b2549f1015644d635b9b
      WP_PATH: /tmp/vf-ops-v121800-wp
      EVIDENCE_DIR: /tmp/vf-ops-v121800-evidence
      CANDIDATE_ZIP: /tmp/vf-tools-ops_V1.21.800.zip
    steps:
      - name: Checkout exact base source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_BASE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-base

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops-candidate

      - name: Verify bounded source and packaged authority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C ops-base rev-parse HEAD)" = "$OPS_BASE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD)" = "$OPS_CANDIDATE_SHA"
          test "$(git -C ops-candidate rev-parse HEAD^{tree})" = "$OPS_CANDIDATE_TREE"
          test "$(tr -d '\r\n' < ops-base/VERSION)" = 1.21.799
          test "$(tr -d '\r\n' < ops-candidate/VERSION)" = 1.21.800
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def files(root):
              out={}
              for p in Path(root).rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      out[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          a,b=files('ops-base'),files('ops-candidate')
          changed=sorted(k for k in set(a)|set(b) if a.get(k)!=b.get(k))
          expected=sorted([
              '.github/phase3/v121800-packaged-domain-authority.php',
              'VERSION',
              'includes/site-release/s01-project-authority.runtime.json',
              'vf-ops.php',
          ])
          Path('/tmp/vf-ops-v121800-evidence/changed-files.txt').write_text('\n'.join(changed)+'\n')
          assert changed==expected,(changed,expected)
          PY
          cmp ops-base/includes/site-release/final-domain-authority.php ops-candidate/includes/site-release/final-domain-authority.php
          cmp ops-base/includes/seo-data/keyword-authority-closure-service.php ops-candidate/includes/seo-data/keyword-authority-closure-service.php
          cmp ops-base/includes/seo-data/keyword-planner-bridge-service.php ops-candidate/includes/seo-data/keyword-planner-bridge-service.php
          cmp ops-base/includes/s01/tool-workbench.php ops-candidate/includes/s01/tool-workbench.php
          php -l ops-candidate/vf-ops.php
          php ops-candidate/.github/phase3/v121800-packaged-domain-authority.php | tee "$EVIDENCE_DIR/source-contract.txt"
          grep -Fxq PASS_V121800_PACKAGED_DOMAIN_AUTHORITY "$EVIDENCE_DIR/source-contract.txt"
          ! grep -Eq 'vf_m3u8_|wp_update_post\(|update_post_meta\(|delete_post_meta\(|seed_hold|WPvivid|JD\.gg' ops-candidate/vf-ops.php
          echo SOURCE_SCOPE_AND_AUTHORITY_CONTRACT=PASS

      - name: Download exact installed 1.21.799 release asset
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -L --retry 3 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${BASE_RELEASE_ASSET_ID}" \
            -o /tmp/vf-tools-ops_V1.21.799.zip
          test "$(stat -c '%s' /tmp/vf-tools-ops_V1.21.799.zip)" = "$BASE_RELEASE_BYTES"
          test "$(sha256sum /tmp/vf-tools-ops_V1.21.799.zip | awk '{print $1}')" = "$BASE_RELEASE_SHA256"
          unzip -tq /tmp/vf-tools-ops_V1.21.799.zip >/dev/null
          ! unzip -Z1 /tmp/vf-tools-ops_V1.21.799.zip | grep -Fxq 'vf-ops/VF_PROJECT.json'
          ! unzip -Z1 /tmp/vf-tools-ops_V1.21.799.zip | grep -Fxq 'vf-ops/includes/site-release/s01-project-authority.runtime.json'
          echo EXACT_PRODUCTION_BASE_ARTIFACT=PASS

      - name: Build exact candidate runtime artifact with release filter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re, shutil, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops-candidate')
          files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for src in root.rglob('*'):
              if src.is_file() and not src.is_symlink():
                  rel=src.relative_to(root)
                  if ok(rel): files[rel.as_posix()]=src.read_bytes()
          files=dict(sorted(files.items()))
          assert 'VF_PROJECT.json' not in files
          assert 'includes/site-release/s01-project-authority.runtime.json' in files
          fp=hashlib.sha256()
          for rel,b in files.items():
              fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          zpath=Path(os.environ['CANDIDATE_ZIP'])
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,3,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
          meta={
              'target_commit':os.environ['OPS_CANDIDATE_SHA'],
              'target_tree':os.environ['OPS_CANDIDATE_TREE'],
              'version':'1.21.800',
              'asset_name':'vf-tools-ops_V1.21.800.zip',
              'asset_bytes':zpath.stat().st_size,
              'asset_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
              'runtime_files':len(files),
              'runtime_fingerprint':fp.hexdigest(),
              'root_vf_project_packaged':False,
              'packaged_authority_snapshot':True,
          }
          Path(os.environ['EVIDENCE_DIR']+'/candidate-artifact.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          unzip -tq "$CANDIDATE_ZIP" >/dev/null
          ! unzip -Z1 "$CANDIDATE_ZIP" | grep -Fxq 'vf-ops/VF_PROJECT.json'
          unzip -Z1 "$CANDIDATE_ZIP" | grep -Fxq 'vf-ops/includes/site-release/s01-project-authority.runtime.json'
          unzip -p "$CANDIDATE_ZIP" vf-ops/includes/site-release/s01-project-authority.runtime.json | jq -e '.project_id=="S01" and .component_id=="S01-C02" and .search_analytics.final_public_host=="https://ilovem3u8.com" and .generated_for=="1.21.800"' >/dev/null
          echo EXACT_PACKAGED_CANDIDATE=PASS

      - name: Install WordPress 7.1
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-mysql php-curl php-zip php-mbstring php-xml php-gd unzip curl jq mariadb-client rsync >/dev/null
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_ops_gate --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8080 --title='VF Gate' --admin_user=owner --admin_password='gate-only-not-production' --admin_email=owner@example.invalid --skip-email
          test "$(wp core version --path="$WP_PATH")" = 7.1
          mariadb -h127.0.0.1 -P3306 -uvf -pvf -Nse 'SELECT VERSION()' vf_ops_gate | tee "$EVIDENCE_DIR/mariadb.txt"
          grep -q '^11\.4\.' "$EVIDENCE_DIR/mariadb.txt"

      - name: Reproduce exact 1.21.799 packaged Production authority failure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-unzip "$WP_PATH/wp-content/plugins/vf-ops"
          mkdir -p /tmp/base-unzip "$WP_PATH/wp-content/plugins"
          unzip -q /tmp/vf-tools-ops_V1.21.799.zip -d /tmp/base-unzip
          mv /tmp/base-unzip/vf-ops "$WP_PATH/wp-content/plugins/vf-ops"
          wp plugin activate vf-ops --path="$WP_PATH"
          wp eval --path="$WP_PATH" '
            wp_set_current_user(1);
            require_once WP_PLUGIN_DIR."/vf-ops/includes/site-release/service.php";
            $life=vf_ops_lifecycle_apply_version_v121377("v121800-base");if(empty($life["ok"]))exit(2);
            $sr=vf_ops_site_release_readback_v121453();$sr["publicBaseUrl"]="https://ilovem3u8.pages.dev";$sr["previewBaseUrl"]="https://ilovem3u8.pages.dev";$sr["configHash"]=vf_ops_site_release_hash_v121453($sr);update_option("vf_ops_site_release",$sr,false);
            update_option("vf_toolsite_cf_static_release_records_v1",["status"=>"PASS","cf_public_base_url"=>"https://ilovem3u8.pages.dev","freeze_decision"=>"PASS","post_upload_home_result"=>"PASS","post_upload_sitemap_result"=>"PASS","integrity_result"=>"PASS","online_batch_id"=>"legacy-pages-batch","online_evidence_sha256"=>str_repeat("a",64),"note"=>"packaged production fixture"],false);
            $state=vf_ops_s01_domain_authority_state_v121799();echo json_encode(["installed"=>$life["state"]["installed_version"]??"","state"=>$state,"rootAuthorityExists"=>file_exists(WP_PLUGIN_DIR."/vf-ops/VF_PROJECT.json"),"runtimeAuthorityExists"=>file_exists(WP_PLUGIN_DIR."/vf-ops/includes/site-release/s01-project-authority.runtime.json")]);' > "$EVIDENCE_DIR/base-production.json"
          cat "$EVIDENCE_DIR/base-production.json"
          jq -e '.installed=="1.21.799" and .state.status=="AUTHORITY_MISSING" and .state.authorityFinalHost=="" and .state.configuredPublicBaseUrl=="https://ilovem3u8.pages.dev" and .rootAuthorityExists==false and .runtimeAuthorityExists==false' "$EVIDENCE_DIR/base-production.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-before.json"
          echo PACKAGED_1_21_799_PRODUCTION_FAILURE_REPRODUCED=PASS

      - name: Direct upgrade exact packaged 1.21.799 to exact packaged 1.21.800
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/candidate-unzip
          mkdir -p /tmp/candidate-unzip
          unzip -q "$CANDIDATE_ZIP" -d /tmp/candidate-unzip
          rsync -a --delete /tmp/candidate-unzip/vf-ops/ "$WP_PATH/wp-content/plugins/vf-ops/"
          test ! -e "$WP_PATH/wp-content/plugins/vf-ops/VF_PROJECT.json"
          test -f "$WP_PATH/wp-content/plugins/vf-ops/includes/site-release/s01-project-authority.runtime.json"
          wp eval --path="$WP_PATH" '
            wp_set_current_user(1);
            $life=vf_ops_lifecycle_apply_version_v121377("v121800-packaged-direct-upgrade");if(empty($life["ok"]))exit(4);
            $writeBefore=function_exists("vf_ops_save_site_release_transaction");$pre=vf_ops_s01_domain_authority_state_v121799();do_action("admin_init");$writeAfter=function_exists("vf_ops_save_site_release_transaction");$post=vf_ops_s01_domain_authority_state_v121799();$last=$GLOBALS["vf_ops_s01_domain_authority_last_v121799"]??[];$static=get_option("vf_toolsite_cf_static_release_records_v1",[]);$invalid=get_option("vf_ops_site_release_evidence_invalidation_v1",[]);
            do_action("rest_api_init");$req=new WP_REST_Request("GET","/vf-ops/v1/s01-domain-authority");$resp=rest_do_request($req);
            echo json_encode(["installed"=>$life["state"]["installed_version"]??"","previous"=>$life["state"]["previous_version"]??"","writeBefore"=>$writeBefore,"writeAfter"=>$writeAfter,"pre"=>$pre,"post"=>$post,"last"=>$last,"static"=>$static,"invalid"=>$invalid,"restStatus"=>$resp->get_status(),"rest"=>$resp->get_data(),"rootAuthorityExists"=>file_exists(WP_PLUGIN_DIR."/vf-ops/VF_PROJECT.json"),"runtimeAuthorityExists"=>file_exists(WP_PLUGIN_DIR."/vf-ops/includes/site-release/s01-project-authority.runtime.json")]);' > "$EVIDENCE_DIR/upgrade.json"
          cat "$EVIDENCE_DIR/upgrade.json"
          jq -e '.installed=="1.21.800" and .previous=="1.21.799" and .rootAuthorityExists==false and .runtimeAuthorityExists==true and .writeBefore==false and .writeAfter==true and .pre.status=="RECONCILIATION_PENDING" and .pre.authorityFinalHost=="https://ilovem3u8.com" and .post.status=="CURRENT" and .post.configuredPublicBaseUrl=="https://ilovem3u8.com" and .post.authorityMatch==true and .last.ok==true and .last.staticReleaseRecord.ok==true and .static.cf_public_base_url=="https://ilovem3u8.com" and .static.status=="NOT_VERIFIED" and .static.freeze_decision=="NOT_VERIFIED" and .static.online_batch_id=="" and .invalid.status=="INVALIDATED" and .invalid.finalOnlinePass=="NO" and .restStatus==200 and .rest.pluginVersion=="1.21.800" and .rest.status=="CURRENT" and .rest.authorityFinalHost=="https://ilovem3u8.com" and .rest.configuredPublicBaseUrl=="https://ilovem3u8.com" and .rest.authorityMatch==true' "$EVIDENCE_DIR/upgrade.json" >/dev/null
          wp option get vf_ops_plugins --path="$WP_PATH" --format=json | jq -cS . > "$EVIDENCE_DIR/plugins-after.json"
          cmp "$EVIDENCE_DIR/plugins-before.json" "$EVIDENCE_DIR/plugins-after.json"
          echo EXACT_PACKAGED_DIRECT_UPGRADE_DOMAIN_RECONCILIATION=PASS

      - name: Verify idempotence and SEO closure inheritance
        shell: bash
        run: |
          set -Eeuo pipefail
          wp eval --path="$WP_PATH" '
            wp_set_current_user(1);$before=vf_ops_site_release_readback_v121453();do_action("admin_init");$after=vf_ops_site_release_readback_v121453();$domain=vf_ops_s01_domain_authority_state_v121799();$seo=vf_ops_s01_seo_closure_public_readback_v121798();echo json_encode(["beforeRevision"=>$before["revision"],"afterRevision"=>$after["revision"],"domain"=>$domain,"seoPluginVersion"=>$seo["pluginVersion"]??""]);' > "$EVIDENCE_DIR/idempotent.json"
          cat "$EVIDENCE_DIR/idempotent.json"
          jq -e '.beforeRevision==.afterRevision and .domain.status=="CURRENT" and .domain.authorityMatch==true and .seoPluginVersion=="1.21.800"' "$EVIDENCE_DIR/idempotent.json" >/dev/null
          test "$(wp post list --path="$WP_PATH" --post_type=any --format=count)" -ge 0
          echo PASS_V121800_EXACT_PACKAGED_PRODUCTION_AUTHORITY_GATE | tee "$EVIDENCE_DIR/final.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121800-packaged-authority-gate
          path: /tmp/vf-ops-v121800-evidence/
          if-no-files-found: warn
          retention-days: 14
