name: P01 Mode Selection Context Gate
on:
  push:
    branches: [product/p01-mode-selection-context-gate-20260831]
    paths: [.github/workflows/p01-mode-selection-context-gate-20260831.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: 9e7f1767d472cc120435e82e0f8a23f07aae64b4
      BASE: fe152259bef2ad0e2c8f0eac81d02277ddab587e
      TREE: 0f5bdbf480641f8a6955d9df0fc90a8c7f6b5632
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mode-context/evidence
      PORT: '18483'
      ADMIN_PASS: P01ModeContextGate
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source and JS-only fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mode-context; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C product diff --name-only "$BASE"...HEAD)" = 'src/assets/links-admin.js'
          test "$(git -C product rev-parse "$BASE:src/assets/admin-consolidation.css")" = "$(git -C product rev-parse "HEAD:src/assets/admin-consolidation.css")"
          test "$(git -C product rev-parse "$BASE:src/links-admin.php")" = "$(git -C product rev-parse "HEAD:src/links-admin.php")"
          test "$(git -C product rev-parse "$BASE:src/api.php")" = "$(git -C product rev-parse "HEAD:src/api.php")"
          test "$(git -C product rev-parse "$BASE:src/app/Repository.php")" = "$(git -C product rev-parse "HEAD:src/app/Repository.php")"
          test "$(cat product/VERSION)" = 2.35.3
          test "$(cat product/src/VERSION.txt)" = 2.35.3
          grep -F 'if(cat&&selected.size){selected.clear();renderLinks()}' product/src/assets/links-admin.js >/dev/null
          node --check product/src/assets/links-admin.js
          find product/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-lint.txt"
          printf 'P01_MODE_CONTEXT_SCOPE=PASS\nP01_MODE_CONTEXT_SERVER_BYTES_UNCHANGED=PASS\n' | tee "$EVID/scope.txt"
      - name: Fresh install and seed
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mode-context.pid
          COOKIE=/tmp/p01-mode-context.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mode Context Gate' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$ROOT/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';
          $db=vf_db();$repo=new VfRepository($db);
          $a=$repo->createCategory(['name'=>'模式 A','description'=>'','parent_id'=>null,'is_private'=>true]);
          $b=$repo->createCategory(['name'=>'模式 B','description'=>'','parent_id'=>null,'is_private'=>true]);
          $repo->saveLink(null,['category_id'=>$a,'title'=>'Active Alpha','url'=>'https://mode-active-alpha.example/','is_private'=>1,'is_pending'=>0],'admin');
          $repo->saveLink(null,['category_id'=>$b,'title'=>'Active Beta','url'=>'https://mode-active-beta.example/','is_private'=>1,'is_pending'=>0],'admin');
          $repo->saveLink(null,['category_id'=>$a,'title'=>'Pending Alpha','url'=>'https://mode-pending-alpha.example/','is_private'=>1,'is_pending'=>1],'admin');
          $repo->saveLink(null,['category_id'=>$b,'title'=>'Pending Beta','url'=>'https://mode-pending-beta.example/','is_private'=>1,'is_pending'=>1],'admin');
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);
          echo "P01_MODE_CONTEXT_SEED=PASS\nP01_MODE_CONTEXT_SQLITE=PASS\n";
          PHP
          echo P01_MODE_CONTEXT_FRESH_RUNTIME=PASS | tee "$EVID/runtime.txt"
      - name: Chromium mode/filter/lifecycle regression
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-mode-context/pw; cd /tmp/p01-mode-context/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          const base='http://127.0.0.1:18483/';
          (async()=>{
            const b=await chromium.launch({headless:true});
            const c=await b.newContext({viewport:{width:1440,height:900}});
            const login=await c.request.post(base+'api.php?action=login',{data:{password:'P01ModeContextGate'}});if(!login.ok()||!(await login.json()).ok)throw Error('login');
            const p=await c.newPage();
            const read=()=>p.evaluate(()=>({hash:location.hash,linkMode:document.querySelector('#linkMode')?.classList.contains('active')||false,categoryMode:document.querySelector('#categoryMode')?.classList.contains('active')||false,batchShown:document.querySelector('#batchBar')?.classList.contains('show')||false,batchText:document.querySelector('#batchCount')?.textContent?.trim()||'',checked:document.querySelectorAll('[data-select]:checked').length,actions:[...document.querySelectorAll('#batchBar [data-bulk]')].filter(x=>!!(x.offsetWidth||x.offsetHeight||x.getClientRects().length)).map(x=>x.textContent.trim()),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            const selectTitle=async t=>{const row=p.locator('tr').filter({hasText:t});if(await row.count()!==1)throw Error('row '+t);await row.locator('input[data-select]').check();};
            async function modeCase(){await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});await selectTitle('Active Alpha');let before=await read();if(!before.batchShown||before.checked!==1)throw Error('mode before');await p.evaluate(()=>location.hash='#categories');await p.waitForTimeout(80);let category=await read();if(!category.categoryMode||category.batchShown||category.checked!==0||!/0/.test(category.batchText))throw Error('category clear '+JSON.stringify(category));await p.evaluate(()=>location.hash='');await p.waitForTimeout(80);let returned=await read();if(!returned.linkMode||returned.batchShown||returned.checked!==0||!/0/.test(returned.batchText))throw Error('return resurrect '+JSON.stringify(returned));return {before,category,returned};}
            async function filterRegression(){await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});await selectTitle('Active Alpha');await p.locator('#linkSearch').fill('Active Beta');await p.waitForTimeout(80);let m=await read();if(m.batchShown||m.checked!==0)throw Error('filter regression '+JSON.stringify(m));return m;}
            async function actionRegression(){await p.goto(base+'links-admin.php',{waitUntil:'networkidle'});await selectTitle('Active Alpha');let active=await read();let expectedActive=['移入待整理','标记已整理','移动分类','归档','移入回收站'];if(JSON.stringify(active.actions)!==JSON.stringify(expectedActive))throw Error('active actions '+JSON.stringify(active));await p.goto(base+'links-admin.php?view=pending',{waitUntil:'networkidle'});await p.locator('#selectPageMobile').check();let pending=await read();let expectedPending=['仅标记已整理','归类并完成','归档','移入回收站'];if(JSON.stringify(pending.actions)!==JSON.stringify(expectedPending))throw Error('pending actions '+JSON.stringify(pending));return {active,pending};}
            const desktop={mode:await modeCase(),filter:await filterRegression(),actions:await actionRegression()};
            await p.setViewportSize({width:390,height:844});
            const mobile={mode:await modeCase(),filter:await filterRegression(),actions:await actionRegression()};
            for(const group of [desktop,mobile])for(const part of [group.mode.before,group.mode.category,group.mode.returned,group.filter,group.actions.active,group.actions.pending])if(part.overflow>1)throw Error('overflow '+JSON.stringify(part));
            await p.screenshot({path:process.env.EVID+'/mobile-pending.png',fullPage:true});
            fs.writeFileSync(process.env.EVID+'/states.json',JSON.stringify({desktop,mobile},null,2));
            await b.close();console.log('P01_MODE_SELECTION_CONTEXT_CHROMIUM=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs | tee "$EVID/chromium.txt"
          grep -Fx P01_MODE_SELECTION_CONTEXT_CHROMIUM=PASS "$EVID/chromium.txt"
      - name: Final DB and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/post-db.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn()!==4)exit(21);
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active' AND is_pending=1")->fetchColumn()!==2)exit(22);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(23);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(24);
          echo "P01_MODE_CONTEXT_POST_DB=PASS\n";
          PHP
          grep -Fx P01_MODE_CONTEXT_SCOPE=PASS "$EVID/scope.txt"
          grep -Fx P01_MODE_CONTEXT_SERVER_BYTES_UNCHANGED=PASS "$EVID/scope.txt"
          grep -Fx P01_MODE_CONTEXT_FRESH_RUNTIME=PASS "$EVID/runtime.txt"
          grep -Fx P01_MODE_SELECTION_CONTEXT_CHROMIUM=PASS "$EVID/chromium.txt"
          grep -Fx P01_MODE_CONTEXT_POST_DB=PASS "$EVID/post-db.txt"
          printf 'P01_MODE_SELECTION_CONTEXT_GATE=PASS\nSOURCE=%s\nBASE=%s\nTREE=%s\nOWNER_PRODUCTION_WRITE=NO\nMAIN_DEVELOP_PRODUCT_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' "$SOURCE" "$BASE" "$TREE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mode-selection-context-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-mode-context.pid 2>/dev/null)" 2>/dev/null || true