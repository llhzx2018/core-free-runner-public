name: P07 release89 exact formal publication
on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc58/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-release89-formal-publish.yml'
permissions:
  contents: read
concurrency:
  group: p07-release89-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release89
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc58
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release89'
          test "$(cat "$care/VERSION")" = '0.1.0-rc58'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = d2943aa935fd5946b32bec4d63ca5072ee155249
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 880961af3212145912ca338e97a2f5869b35144d
          test "$(git hash-object "$care/MANIFEST.gitblob")" = ec1dd9531bbd25c099a7e697434093f7befe6972
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = e70b4a830f14f16ee758e701d48d2bd2291f9819
          test "$(git hash-object installers/p07.sh)" = b5e3deaedca7da62bb48b25a95f0382854c575da
          test "$(git hash-object installers/p07-toolbox.sh)" = 1f030345b503e76e442e009f01a74540afca2cc5
          test "$(git hash-object installers/p07-system-care.sh)" = 5cb346a8497b4279eba2d41fc94618f40b829008
          grep -Fq 'EXPECTED_BLOB="e70b4a830f14f16ee758e701d48d2bd2291f9819"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release89"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="d2943aa935fd5946b32bec4d63ca5072ee155249"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release89"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc58"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='ec1dd9531bbd25c099a7e697434093f7befe6972'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE89_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release89 · 正式网站数据工具与 System Care rc57' \
              --notes 'P07 release89 / System Care rc58. Exact private P07 source 45e3278a1cde884991096adfe9d57d1df7e57855; Public Runner 145/145 regression tests and candidate builder PASS, isolated clean install / previous release upgrade / idempotence / corruption fail-closed / rollback PASS. Production CP2 installation and real CP-to-CP2 migration NOT_RUN; old CP and DNS untouched.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE89_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release89-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release89-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release89-assets/$name"
            test "$(git hash-object "/tmp/p07-release89-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE89_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh b5e3deaedca7da62bb48b25a95f0382854c575da' 'installers/p07-final.sh e70b4a830f14f16ee758e701d48d2bd2291f9819' 'installers/p07-toolbox.sh 1f030345b503e76e442e009f01a74540afca2cc5' 'installers/p07-system-care.sh 5cb346a8497b4279eba2d41fc94618f40b829008' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob d2943aa935fd5946b32bec4d63ca5072ee155249'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release89-remote
            test "$(git hash-object /tmp/p07-release89-remote)" = "$sha"
          done
          echo P07_RELEASE89_REMOTE_DISTRIBUTION_READBACK_PASS
