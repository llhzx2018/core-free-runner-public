name: TEMP S01-C03 1.25.5 Formal Pre-Release Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - '.github/workflows/temp-s01-c03-1.25.5-pre-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-1-25-5-pre-release-gate-20260902
  cancel-in-progress: true

env:
  HARNESS_SHA: 510d03f92886f26d3000e797e8c400118c0d6fea
  OPS_SHA: a1eda8f80f8a7969b3b4d580b4b822c804c24984
  M3U8_BASE_SHA: b4d65798e6961e23370d2dff09e1a9ba8fca84a6
  M3U8_SHA: d7b67319ae3c0b077d39d0f84df3facd38a2c44d
  M3U8_LEGACY_SHA: 2e636cf580b77116c02048b19b36894b0295851b
  THEME_SHA: a293009567c932310d19a310a8ea6361a2ef71c8
  WP_VERSION: '7.1'
  WP_PATH: /tmp/vf-s01-owner-wp
  WP_URL: http://127.0.0.1:8080
  WP_ADMIN_USER: owner
  EVIDENCE_DIR: /tmp/vf-s01-1.25.5-pre-release-evidence

jobs:
  formal-pre-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_owner
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout exact proven S01 Gate harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.HARNESS_SHA }}
          fetch-depth: 1
          persist-credentials: false
          path: runner

      - name: Checkout exact current Ops formal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8 release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: m3u8

      - name: Checkout exact legacy M3U8 migration fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_LEGACY_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8-legacy

      - name: Checkout exact current Theme formal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: theme

      - name: Verify exact release identity and bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR" /tmp/vf-s01-release-packages
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(git -C m3u8-legacy rev-parse HEAD)" = "$M3U8_LEGACY_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C m3u8 merge-base "$M3U8_BASE_SHA" "$M3U8_SHA")" = "$M3U8_BASE_SHA"

          git -C m3u8 diff --name-only "$M3U8_BASE_SHA" "$M3U8_SHA" | sort > /tmp/m3u8-changed.txt
          printf '%s\n' VERSION src/PACKAGE_PROFILE.json src/plugin-manifest.json src/vf-tool-m3u8.php | sort > /tmp/m3u8-expected.txt
          diff -u /tmp/m3u8-expected.txt /tmp/m3u8-changed.txt
          test "$(git -C m3u8 diff --numstat "$M3U8_BASE_SHA" "$M3U8_SHA" | awk '{a+=$1;d+=$2} END{print a ":" d}')" = '11:11'
          git -C m3u8 diff --check "$M3U8_BASE_SHA" "$M3U8_SHA"

          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.792'
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.5'
          test "$(tr -d '\r\n' < m3u8-legacy/VERSION)" = '1.25.3'
          test "$(tr -d '\r\n' < theme/VERSION)" = '1.35.8'
          grep -Fq ' * Version: 1.25.5' m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_VERSION', '1.25.5')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_ROUND', 'R229')" m3u8/src/vf-tool-m3u8.php
          grep -Fq "return 'R229_PROVIDER_SCHEMA_DIAGNOSTIC_FIRST_RECOVERY';" m3u8/src/vf-tool-m3u8.php
          grep -Fq "return '1.3.0'" m3u8/src/includes/v6-provider-schema.php

          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          ev=Path('/tmp/vf-s01-1.25.5-pre-release-evidence'); out=Path('/tmp/vf-s01-release-packages'); m3=Path('m3u8')
          pp=json.load(open(m3/'src/PACKAGE_PROFILE.json')); pm=json.load(open(m3/'src/plugin-manifest.json'))
          assert (pp['pluginVersion'],pp['version'],pp['round'])==('1.25.5','1.25.5','R229')
          assert (pm['pluginVersion'],pm['version'],pm['round'])==('1.25.5','1.25.5','R229')
          assert pp['profile']=='R224 VF Tools M3U8 V7.1 Phase 2 security revalidated'
          assert pp['currentVerification']['version']=='1.25.0' and pp['currentVerification']['round']=='R222'
          root=m3/'src'; files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items()))
          assert 'vf-tool-m3u8.php' in files
          zpath=out/'vf-tool-m3u8_V1.25.5.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo(f'vf-tool-m3u8/{rel}',(2026,9,2,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
          with zipfile.ZipFile(zpath) as z:
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode(); assert main.count(' * Version: 1.25.5')==1; assert "define('VF_TOOL_M3U8_ROUND', 'R229')" in main
          data={'status':'PASS','release_write':False,'tag_write':False,'core_updates_write':False,'production_write':False,'m3u8':{'sha':'d7b67319ae3c0b077d39d0f84df3facd38a2c44d','base':'b4d65798e6961e23370d2dff09e1a9ba8fca84a6','version':'1.25.5','round':'R229','provider_schema':'1.3.0','diff_files':4,'diff_insertions':11,'diff_deletions':11,'zip_files':len(files),'zip_bytes':zpath.stat().st_size,'zip_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest()},'ops':{'sha':'a1eda8f80f8a7969b3b4d580b4b822c804c24984','version':'1.21.792'},'theme':{'sha':'a293009567c932310d19a310a8ea6361a2ef71c8','version':'1.35.8'}}
          (ev/'release-package-audit.json').write_text(json.dumps(data,indent=2)+'\n')
          zpath.unlink()
          PY

      - name: PHP syntax and diagnostic-first recovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v | tee "$EVIDENCE_DIR/php-version.txt"
          php -l m3u8/src/includes/v6-provider-schema-repair-admin.php | tee "$EVIDENCE_DIR/lint-repair.txt"
          php -l m3u8/tests/unit/schema-repair-contract.php | tee "$EVIDENCE_DIR/lint-contract.txt"
          php -l m3u8/src/vf-tool-m3u8.php | tee "$EVIDENCE_DIR/lint-loader.txt"
          php m3u8/tests/unit/schema-repair-contract.php | tee "$EVIDENCE_DIR/static-contract.txt"

      - name: Execute diagnostic-first recovery behavior matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/s01-c03-schema-recovery-behavior.php <<'PHP'
          <?php
          declare(strict_types=1);
          define('ABSPATH', '/tmp/wp/');
          $state=[];$removed=[];
          function is_admin():bool{return true;}
          function current_user_can(string $cap):bool{return true;}
          function add_action(string $hook,$callback,int $priority=10,int $accepted_args=1):bool{return true;}
          function remove_action(string $hook,$callback,int $priority=10):bool{global $removed;$removed[]=[$hook,$callback,$priority];return true;}
          function vf_tools_m3u8_v6_schema_version():string{return '1.3.0';}
          function vf_tools_m3u8_v6_private_schema_migration_option():string{return 'vf_tools_m3u8_v6_private_schema_migration';}
          function vf_tools_m3u8_v6_table_names():array{$keys=['capabilities','capability_contracts','pipelines','pipeline_revisions','pipeline_steps','pipeline_edges','fixtures','fixture_revisions','fixture_runs','runtime_bundles','runtime_bundle_assets','operation_runs','snapshots','snapshot_items'];$o=[];foreach($keys as $k){$o[$k]='wp_vf_m3u8_'.$k;}return $o;}
          function vf_tools_m3u8_v6_table_exists(string $table):bool{global $state;return $state['exists'][$table]??true;}
          function vf_tools_m3u8_v6_table_row_counts(array $tables):array{global $state;$o=[];foreach($tables as $k=>$table){$o[$k]=(int)($state['counts'][$k]??0);}return $o;}
          function vf_tools_m3u8_v6_private_schema_migration_complete():bool{global $state;return(bool)($state['marker']??false);}
          function vf_tools_m3u8_v6_schema_ready():bool{global $state;return(bool)($state['ready']??false);}
          function vf_tools_m3u8_v6_any_legacy_table_exists():bool{global $state;return(bool)($state['legacyPresent']??false);}
          function vf_tools_m3u8_v6_legacy_schema_compatible():bool{global $state;return(bool)($state['legacyCompat']??false);}
          function vf_tools_m3u8_v6_incompatible_legacy_has_m3u8_rows():bool{global $state;return(bool)($state['legacyRows']??false);}
          function get_option(string $name,$default=false){global $state;if($name==='vf_tools_m3u8_v6_private_schema_migration'){return!empty($state['marker'])?['status'=>'PASS','migrationVersion'=>'1.0.0']:[];}if($name==='vf_tools_m3u8_v6_schema_version')return(string)($state['stored']??'');return $default;}
          require getenv('GITHUB_WORKSPACE').'/m3u8/src/includes/v6-provider-schema-repair-admin.php';
          function rs(array $o=[]):void{global $state,$removed;$state=array_merge(['exists'=>[],'counts'=>[],'marker'=>false,'ready'=>false,'legacyPresent'=>false,'legacyCompat'=>true,'legacyRows'=>false,'stored'=>''],$o);$removed=[];}
          function must(bool $c,string $m):void{if(!$c){fwrite(STDERR,"FAIL: $m\n");exit(1);}}
          function guard(bool $expected,string $label):void{global $removed;vf_tools_m3u8_v6_schema_repair_guard_implicit_upgrade();$actual=count($removed)>0;must($actual===$expected,"$label guard");if($actual){must($removed[0]===['admin_init','vf_tools_m3u8_v6_schema_maybe_upgrade',-1100],"$label callback");}}
          rs(['marker'=>true,'ready'=>true,'stored'=>'1.3.0']);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='READY'&&!$d['repairAllowed'],'READY');guard(false,'READY');
          rs(['counts'=>['capabilities'=>2]]);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='PRIVATE_NAMESPACE_NONEMPTY_WITHOUT_CURRENT_PASS_MARKER'&&!$d['repairAllowed'],'PRIVATE BLOCK');guard(true,'PRIVATE');
          rs(['legacyPresent'=>true,'legacyCompat'=>false,'legacyRows'=>true]);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='INCOMPATIBLE_LEGACY_SCHEMA_WITH_PROVIDER_ROWS'&&!$d['repairAllowed'],'LEGACY BLOCK');guard(true,'LEGACY');
          $tables=vf_tools_m3u8_v6_table_names();$first=reset($tables);rs(['exists'=>[$first=>false]]);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='PRIVATE_SCHEMA_TABLES_MISSING'&&$d['repairAllowed'],'MISSING ELIGIBLE');guard(true,'MISSING');
          rs(['marker'=>false,'ready'=>false,'legacyCompat'=>true]);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='MIGRATION_MARKER_NOT_READY'&&$d['repairAllowed'],'MARKER ELIGIBLE');
          rs(['marker'=>true,'ready'=>true,'stored'=>'1.2.0']);$d=vf_tools_m3u8_v6_schema_repair_diagnostics();must($d['code']==='SCHEMA_VERSION_OPTION_STALE'&&$d['repairAllowed'],'STALE ELIGIBLE');guard(true,'STALE');
          echo "S01-C03 1.25.5 diagnostic-first behavior matrix PASS\n";
          PHP
          php -l /tmp/s01-c03-schema-recovery-behavior.php | tee "$EVIDENCE_DIR/lint-behavior-harness.txt"
          php /tmp/s01-c03-schema-recovery-behavior.php | tee "$EVIDENCE_DIR/behavior-matrix.txt"

      - name: Patch proven runtime and browser harness expectations in workspace only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path('runner/scripts/temp-s01-c02-owner-runtime-v2.sh')
          s=runtime.read_text()
          assert s.count('1.21.791')==3, s.count('1.21.791')
          assert s.count('1.25.3')==3, s.count('1.25.3')
          assert s.count(r'1\.21\.791')==1, s.count(r'1\.21\.791')
          assert s.count(r'1\.25\.3')==1, s.count(r'1\.25\.3')
          s=s.replace('1.21.791','1.21.792').replace('1.25.3','1.25.5')
          legacy="test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.5'"
          assert s.count(legacy)==1
          s=s.replace(legacy,"test \"$(tr -d '\\r\\n' < m3u8-legacy/VERSION)\" = '1.25.3'",1)
          s=s.replace(r'1\.21\.791',r'1\.21\.792').replace(r'1\.25\.3',r'1\.25\.5')
          assert s.count('1.21.791')==0
          assert s.count('1.25.3')==1
          assert s.count(r'1\.21\.791')==0
          assert s.count(r'1\.25\.3')==0
          runtime.write_text(s)

          browser=Path('runner/scripts/temp-s01-c02-owner-browser-v2.js')
          b=browser.read_text()
          assert b.count("fresh.ops === '1.21.791'")==1
          assert b.count("fresh.m3u8 === '1.25.3'")==1
          b=b.replace("fresh.ops === '1.21.791'","fresh.ops === '1.21.792'")
          b=b.replace("fresh.m3u8 === '1.25.3'","fresh.m3u8 === '1.25.5'")
          browser.write_text(b)

          migration=Path('runner/scripts/temp-s01-c03-private-schema-migration.sh')
          m=migration.read_text()
          legacy_assert='.version==\"1.25.3\" and .schema==\"1.2.0\"'
          recovery_assert='.version==\"1.25.3\" and .schema==\"1.3.0\"'
          assert m.count(legacy_assert)==1
          assert m.count(recovery_assert)==1
          m=m.replace(recovery_assert,'.version==\"1.25.5\" and .schema==\"1.3.0\"',1)
          assert m.count(legacy_assert)==1
          assert m.count('.version==\"1.25.5\" and .schema==\"1.3.0\"')==1
          migration.write_text(m)
          PY

      - name: Execute isolated WordPress release candidate gate
        shell: bash
        run: bash -x runner/scripts/temp-s01-c02-owner-runtime-v2.sh

      - name: Seal Formal Pre-Release Gate evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.ops=="1.21.792" and .m3u8=="1.25.5" and .theme=="1.35.8" and .schema=="1.3.0" and .migration.status=="PASS" and .readiness.status=="PASS" and .ownerState.status=="PASS"' "$EVIDENCE_DIR/final-runtime-readback.json" >/dev/null
          grep -Fq 'Schema recovery contract PASS' "$EVIDENCE_DIR/static-contract.txt"
          grep -Fq 'diagnostic-first behavior matrix PASS' "$EVIDENCE_DIR/behavior-matrix.txt"
          cat > "$EVIDENCE_DIR/S01_C03_1_25_5_FORMAL_PRE_RELEASE_GATE.txt" <<EOF
          S01_C03_1_25_5_FORMAL_PRE_RELEASE_GATE=PASS
          PR=15
          BASE_SHA=$M3U8_BASE_SHA
          M3U8_SHA=$M3U8_SHA
          M3U8_VERSION=1.25.5
          M3U8_ROUND=R229
          M3U8_PROVIDER_SCHEMA=1.3.0
          OPS_SHA=$OPS_SHA
          OPS_VERSION=1.21.792
          THEME_SHA=$THEME_SHA
          THEME_VERSION=1.35.8
          WORDPRESS=$WP_VERSION
          MARIADB=11.4
          EXACT_IDENTITY=PASS
          DIFF_BOUNDARY_4_FILES_11_11=PASS
          PACKAGE_AUDIT=PASS
          STATIC_RECOVERY_CONTRACT=PASS
          DIAGNOSTIC_BEHAVIOR_MATRIX=PASS
          LEGACY_SCHEMA_MIGRATION=PASS
          OWNER_GOLDEN_PATH=PASS
          RELEASE_PROMOTION=NO
          TAG_WRITE=NO
          GITHUB_RELEASE_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          NEW_RUNNER=NO
          NEW_SECRET=NO
          NEW_SSH=NO
          EOF

      - name: Upload public-safe Formal Pre-Release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-1.25.5-formal-pre-release-${{ github.run_id }}
          path: /tmp/vf-s01-1.25.5-pre-release-evidence/
          if-no-files-found: warn
          retention-days: 14
