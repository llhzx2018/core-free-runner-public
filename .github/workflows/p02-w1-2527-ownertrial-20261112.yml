name: P02 W1 2.5.127 isolated Owner Trial build and install proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-w1-2527-ownertrial-20261112.yml']
permissions:
  contents: read
jobs:
  w1-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PRIVATE P02 source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Read canonical GOV-DOC public delivery gate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 33b222f642ff18dd52a1ac7887443d91833edbb2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: governance
      - name: Check exact source and required extensions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(git -C governance rev-parse HEAD)" = '33b222f642ff18dd52a1ac7887443d91833edbb2'
          test "$(cat product/VERSION)" = '2.5.127'
          test -s product/public/assets/w1/w1-search.js
          test -s product/public/assets/w1/w1-search.css
          if ! php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'; then
            timeout 150s sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-zip
          fi
          php -r 'exit(PHP_VERSION_ID>=80300&&extension_loaded("pdo_sqlite")&&extension_loaded("sqlite3")&&extension_loaded("zip")?0:1);'
          cd product
          bash scripts/verify-repository.sh
          echo P02_W1_OWNER_TRIAL_EXACT_SOURCE=PASS
      - name: Build same candidate twice and verify package identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 scripts/build-candidate.py --out build/w1-2527-one --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-build-once.json"
          python3 scripts/build-candidate.py --out build/w1-2527-two --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-build-twice.json"
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          a=Path('build/w1-2527-one');b=Path('build/w1-2527-two')
          def meta(x):return (len(x.read_bytes()),hashlib.sha256(x.read_bytes()).hexdigest())
          assert {x.name:meta(x) for x in a.iterdir()}=={x.name:meta(x) for x in b.iterdir()},'NONDETERMINISTIC_CANDIDATE'
          p=json.loads((a/'VF_Library_V2.5.127_CANDIDATE_MANIFEST.json').read_text())
          assert p['source']['candidate_commit']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert p['version']=='2.5.127' and p['state']=='CANDIDATE'
          assert p['compatibility']['supported_from']==['2.5.122','2.5.124']
          assert p['compatibility']['schema_migration'] is False
          assert p['publication']['formal_tag'] is None and p['publication']['production_write'] is False
          assert p['build']['runtime_source_files']==73
          with zipfile.ZipFile(a/'VF_Library_V2.5.127_FULL_CANDIDATE.zip') as z:
              files=set(z.namelist());assert 'VERSION.txt' in files and 'setup.php' in files
              assert 'assets/w1/w1-search.js' in files and 'assets/w1/w1-search.css' in files
              assert json.loads(z.read('release-manifest.json'))['release_state']=='CANDIDATE'
              assert z.testzip() is None
              for f in files:
                  lower=f.lower();parts=set(lower.split('/'))
                  assert not ({'.git','private_data','vendor','node_modules','session','cache'} & parts),(f,'private')
                  assert not lower.endswith(('.db','.sqlite','.sqlite3','.log')),(f,'private')
          with zipfile.ZipFile(a/'VF_Library_V2.5.127_UPDATE_CANDIDATE.zip') as z:
              m=json.loads(z.read('atomic-manifest.json'))
              assert m['format_version']==2 and m['source_versions']==['2.5.122','2.5.124']
              assert m['target_version']=='2.5.127' and len(m['files'])==73
              assert z.testzip() is None
          with zipfile.ZipFile(a/'VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip') as z:
              assert z.namelist()==['repair-v2.5.127-candidate.php']
              assert z.testzip() is None
          lines=(a/'SHA256SUMS.txt').read_text().strip().splitlines()
          for line in lines:
              digest,name=line.split('  ',1)
              assert meta(a/name)[1]==digest
          print('P02_W1_CANDIDATE_DETERMINISM=PASS')
          print('P02_W1_CANDIDATE_FULL_UPDATE_ATOMIC_PRIVACY=PASS')
          print('P02_W1_CANDIDATE_SOURCE_SET=2.5.122,2.5.124')
          for name in ['VF_Library_V2.5.127_FULL_CANDIDATE.zip','VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip','VF_Library_V2.5.127_UPDATE_CANDIDATE.zip']:
              size,digest=meta(a/name);print('P02_W1_ARTIFACT='+name+';BYTES='+str(size)+';SHA256='+digest)
          PY
      - name: Real fresh FULL install of built package with synthetic-only localhost
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import http.cookiejar,html,json,pathlib,re,subprocess,tempfile,time,urllib.parse,urllib.request,urllib.error,zipfile
          from pathlib import Path
          root=Path.cwd()
          archive=root/'product/build/w1-2527-one/VF_Library_V2.5.127_FULL_CANDIDATE.zip'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args): return None
          with tempfile.TemporaryDirectory(prefix='p02-w1-candidate-') as tmp:
              site=Path(tmp)/'site';site.mkdir()
              with zipfile.ZipFile(archive) as z:z.extractall(site)
              assert not (site/'app/.runtime.php').exists()
              server=subprocess.Popen(['php','-S','127.0.0.1:18996','-t',str(site)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              base='http://127.0.0.1:18996'
              jar=http.cookiejar.CookieJar()
              session=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar),NoRedirect())
              try:
                  for i in range(40):
                      try: page=session.open(base+'/setup.php',timeout=2).read().decode();break
                      except Exception:time.sleep(0.15)
                  else:raise AssertionError('FULL_CANDIDATE_SETUP_NO_HTTP')
                  match=re.search(r'name="setup_csrf" value="([^"]+)"',page)
                  assert match,'NO_SETUP_CSRF'
                  form=urllib.parse.urlencode({'setup_csrf':html.unescape(match.group(1)),'password':'P02-SYNTHETIC-TRIAL-ONLY','password_confirm':'P02-SYNTHETIC-TRIAL-ONLY'}).encode()
                  request=urllib.request.Request(base+'/setup.php',form,headers={'Origin':base,'Content-Type':'application/x-www-form-urlencoded'},method='POST')
                  try:resp=session.open(request,timeout=20);code=resp.status
                  except urllib.error.HTTPError as e:code=e.code
                  assert code==303,('INSTALL_HTTP',code)
                  res=json.load(session.open(base+'/api.php?action=session',timeout=10))
                  assert res.get('ok') is True and res['site']['auth'] is True and res.get('version')=='2.5.127',res
                  assert (site/'assets/w1/w1-search.js').is_file()
                  assert 'process.env.NODE_ENV' not in (site/'assets/w1/w1-search.js').read_text()
                  print('P02_W1_CANDIDATE_REAL_CLEAN_FULL=PASS')
                  print('P02_W1_CANDIDATE_PHP_SQLITE_AUTH=PASS')
              finally:server.terminate();server.wait(timeout=10)
          PY
      - name: Required Public Authority task delivery structural check
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('product/build/w1-2527-one')
          domains=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','CRON_JOB','NOTIFICATION','OBSERVABILITY','GIT','UA_UI']
          base={'schema':'vf.public-authority.task-delivery-check.v1','project':'P02','source':'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2',
            'project_authority':{'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/ACCEPTANCE_MATRIX.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'},
            'acceptance_markers':['Source Manifest','W1_BROWSER_COMPAT'],
            'required_domains':domains,
            'task_capabilities':['full_package','clean_install','candidate','update','atomic','rollback','database','backup','external_api','scheduler','notification_center','operational_health','source_change','ui_change']}
          for label,profile,asset,entry in [
            ('full','web_full_zip','VF_Library_V2.5.127_FULL_CANDIDATE.zip','setup.php'),
            ('atomic','web_atomic_zip','VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip','repair-v2.5.127-candidate.php')]:
            receipt=dict(base)
            receipt['delivery']={'profile':profile,'entrypoint':entry,'artifact':asset,
              'sha256':hashlib.sha256((root/asset).read_bytes()).hexdigest(),'requires_git':False,'requires_manual_source_copy':False}
            Path(os.environ['RUNNER_TEMP'],f'p02-{label}-delivery.json').write_text(json.dumps(receipt))
          PY
          for profile in full atomic; do
            python3 governance/governance/public-authority/tools/task_delivery_contract_lint.py               --receipt "${RUNNER_TEMP}/p02-${profile}-delivery.json"               --project-root product --artifact-root product/build/w1-2527-one               --public-router governance/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json
          done
          echo P02_W1_TASK_DELIVERY_STRUCTURAL=PASS
      - name: Real 2.5.122 and 2.5.124 source FULL to candidate Atomic repair and rollback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_PRIVATE_RELEASE_READ_NOT_AVAILABLE; exit 78; }
          mkdir -p "${RUNNER_TEMP}/p02-official-sources"
          for old in 2.5.122 2.5.124; do
            gh release download "v${old}" -R llhzx2018/vf-library -p "VF_Library_V${old}_FULL.zip" -D "${RUNNER_TEMP}/p02-official-sources"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('product/build/w1-2527-one')
          assert root.joinpath('VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip').is_file()
          files={
            '2.5.122':('493073','79a9e2e2a8e5aa29946bbdbf47cf6d34429fc23a67689cc611ef8daebae82387'),
            '2.5.124':('496067','c30e9a5a5d8380443f564c0e56606c13edb31da3482c1704deecdcf9c1ff7a56'),
          }
          import os
          for v,(size,sha) in files.items():
            path=Path(os.environ['RUNNER_TEMP'],'p02-official-sources','VF_Library_V'+v+'_FULL.zip')
            assert path.is_file() and path.stat().st_size==int(size)
            assert hashlib.sha256(path.read_bytes()).hexdigest()==sha
          print('P02_W1_AUTHENTIC_PRIOR_FULL_ASSET_SHA=PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, tempfile, zipfile, re, json, html, os, time, http.cookiejar
          import urllib.request, urllib.parse, urllib.error, sqlite3
          prior=Path(os.environ['RUNNER_TEMP'],'p02-official-sources')
          artifacts=Path('product/build/w1-2527-one')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          def request(opener,url,data=None,headers=None):
              r=urllib.request.Request(url,data,headers or {},method='POST' if data is not None else 'GET')
              try:
                  resp=opener.open(r,timeout=35)
                  return resp.status,resp.read().decode('utf-8',errors='replace')
              except urllib.error.HTTPError as error:
                  return error.code,error.read().decode('utf-8',errors='replace')
          def marker(body,name):
              x=re.search(r'name="'+name+r'" value="([^"]+)"',body)
              if not x:raise RuntimeError('MISSING_HIDDEN_FIELD_'+name)
              return html.unescape(x.group(1))
          def do_post(opener,url,values,base):
              data=urllib.parse.urlencode(values).encode()
              return request(opener,url,data,{'Origin':base,'Content-Type':'application/x-www-form-urlencoded'})
          def post_json(opener,base,csrf,action,data):
              code,body=request(opener,base+'/api.php?action='+action,json.dumps(data).encode(),
                {'Origin':base,'Content-Type':'application/json','X-CSRF-Token':csrf})
              try:result=json.loads(body)
              except ValueError:raise RuntimeError('BAD_JSON_RESPONSE_'+action+':'+str(code))
              if code not in (200,201) or not result.get('ok'):raise RuntimeError('CANONICAL_API_POST_FAILED_'+action+':'+str(code))
              return result
          with tempfile.TemporaryDirectory(prefix='p02-real-upgrade-') as temp:
              folder=Path(temp)
              for n,old in enumerate(['2.5.122','2.5.124']):
                  site=folder/('source-'+old);site.mkdir()
                  with zipfile.ZipFile(prior/('VF_Library_V'+old+'_FULL.zip')) as z:z.extractall(site)
                  assert (site/'VERSION.txt').read_text().strip()==old
                  port=18971+n
                  base='http://127.0.0.1:'+str(port)
                  server=subprocess.Popen(['php','-S','127.0.0.1:'+str(port),'-t',str(site)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),NoRedirect())
                  try:
                      for _ in range(45):
                          try:
                              status,body=request(opener,base+'/setup.php')
                              if status==200:break
                          except Exception:pass
                          time.sleep(.1)
                      else:raise RuntimeError('OLD_INSTALL_HTTP_UNAVAILABLE')
                      csrf=marker(body,'setup_csrf')
                      status,body=do_post(opener,base+'/setup.php',{'setup_csrf':csrf,
                        'password':'P02-SYNTHETIC-OWNER-TRIAL-ONLY','password_confirm':'P02-SYNTHETIC-OWNER-TRIAL-ONLY'},base)
                      assert status==303,('OLD_INSTALL_FAILED',old,status)
                      status,body=request(opener,base+'/api.php?action=session')
                      auth=json.loads(body)
                      assert status==200 and auth.get('ok') is True and auth.get('site',{}).get('auth') is True
                      assert auth.get('version')==old
                      csrf=auth.get('csrf','')
                      category=post_json(opener,base,csrf,'category_save',{'name':'P02_W1_ONLY_SYNTHETIC','icon':'folder'})
                      item=post_json(opener,base,csrf,'content_save',{'category_id':category['id'],
                        'title':'P02_W1_PRESERVED_'+old,
                        'content':'Synthetic material remains after upgrade and failed injection.',
                        'content_mode':'article','content_format':'markdown',
                        'primary_action':'read','status':'active'})
                      itemid=int(item['id'])
                      sql=list(folder.rglob('textbox-*.sqlite'))
                      selected=[x for x in sql if x.parent.parent==folder or x.parent.parent==site.parent]
                      assert sql,'NO_SQLITE'
                      repair=artifacts/'repair-v2.5.127-candidate.php'
                      (site/repair.name).write_bytes(repair.read_bytes())
                      if old=='2.5.124':
                          stage=folder/'rollback-stage';stage.mkdir()
                          update=artifacts/'VF_Library_V2.5.127_UPDATE_CANDIDATE.zip'
                          with zipfile.ZipFile(update) as z:z.extractall(stage)
                          php=folder/'inject-rollback.php'
                          php.write_text("""<?php
          declare(strict_types=1);
          require $argv[1].'/app/bootstrap.php';
          $p=json_decode(file_get_contents($argv[2].'/atomic-manifest.json'),true);
          $map=[];
          foreach($p['files'] as $item)$map[$item['path']]=['bytes'=>$item['bytes'],'sha256'=>$item['sha256']];
          try{
            VfLibraryAtomicUpgradeService::fromCurrentRuntime()->upgrade('2.5.124','2.5.127',$argv[2].'/payload',$map,['source_schema'=>2401,'target_schema'=>2401,'fail_after_file'=>1]);
            fwrite(STDERR,'EXPECTED_FAULT_NOT_RAISED');exit(1);
          }catch(Throwable $e){
            if(strpos($e->getMessage(),'Atomic test fault: file replacement')===false){
              fwrite(STDERR,'UNEXPECTED_ATOMIC_FAULT_CLASS');exit(1);
            }
          }
          echo "P02_W1_REAL_PARTIAL_FILE_ROLLBACK=PASS\\n";
          """)
                          proc=subprocess.run(['php',str(php),str(site),str(stage)],capture_output=True,text=True,timeout=80)
                          assert proc.returncode==0,('ROLLBACK_ENGINE_TEST_FAILED',proc.stderr[-200:])
                          assert (site/'VERSION.txt').read_text().strip()==old
                          status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                          assert status==200 and json.loads(body).get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('ROLLBACK_DATA_LOSS',old)
                          print('P02_W1_REAL_PARTIAL_FILE_ROLLBACK=PASS')
                      status,body=request(opener,base+'/'+repair.name)
                      assert status==200,('REPAIR_LOGIN_READ',old,status)
                      form_csrf=marker(body,'csrf')
                      status,body=do_post(opener,base+'/'+repair.name,{'action':'upgrade','csrf':form_csrf},base)
                      assert status==200 and '升级完成' in body,('REAL_REPAIR_FAILED',old,status,body[-200:])
                      assert (site/'VERSION.txt').read_text().strip()=='2.5.127'
                      status,body=request(opener,base+'/api.php?action=content_get&id='+str(itemid))
                      after=json.loads(body)
                      assert status==200 and after.get('item',{}).get('title')=='P02_W1_PRESERVED_'+old,('UPDATE_DATA_LOSS',old)
                      assert 'Synthetic material remains' in after.get('item',{}).get('content','')
                      assert not (site/'app/.runtime.php').is_symlink()
                      db_files=list(folder.rglob('textbox-*.sqlite'))
                      assert db_files
                      db_file=[x for x in db_files if x.parent.as_posix().startswith(folder.as_posix())][-1]
                      with sqlite3.connect(db_file) as db:
                          assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
                          assert db.execute('PRAGMA foreign_key_check').fetchall()==[]
                      assert (site/'assets/w1/w1-search.js').is_file()
                      print('P02_W1_REAL_UPGRADE_FROM_'+old.replace('.','_')+'=PASS')
                      print('P02_W1_DATA_RETAINED_FROM_'+old.replace('.','_')+'=PASS')
                  finally:
                      server.terminate();server.wait(timeout=12)
          print('P02_W1_REAL_DIRECT_UPGRADE_SET=PASS')
          PY
      - name: Purge transient private source and synthetic package bytes
        if: always()
        shell: bash
        run: |
          rm -rf product governance
          echo PRIVATE_SOURCE_AND_CANDIDATE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
