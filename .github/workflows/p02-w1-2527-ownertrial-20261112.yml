name: P02 W1 2.5.127 exact proven candidate to PRIVATE DRAFT only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-w1-2527-ownertrial-20261112.yml']
permissions:
  contents: read
jobs:
  private-owner-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact prior-verified PRIVATE product
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Reproduce prior verified candidate bytes exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          test "$(cat VERSION)" = '2.5.127'
          python3 scripts/build-candidate.py --out build/w1-2527-ownertrial --source-version 2.5.122 --source-version 2.5.124 --source-commit 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --source-ref main > "${RUNNER_TEMP}/p02-exact-build.json"
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('build/w1-2527-ownertrial')
          expected={
              'VF_Library_V2.5.127_FULL_CANDIDATE.zip':(532839,'b7507df74dddc5777cc45d094ea758e0550e825f1484730a05c950ab34240170'),
              'VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip':(723438,'23b03f54b33ab2377ffd11e643af5b24b46b87ebc2d1803f7139e62440bbf3fc'),
              'VF_Library_V2.5.127_UPDATE_CANDIDATE.zip':(487213,'4c9b4896510a9af29b689f050d9756667cd6f67d5f0706a2f8fb969449ab3d90'),
          }
          for name,(size,digest) in expected.items():
              p=root/name
              assert p.is_file() and p.stat().st_size==size and hashlib.sha256(p.read_bytes()).hexdigest()==digest, name
          manifest=json.loads((root/'VF_Library_V2.5.127_CANDIDATE_MANIFEST.json').read_text())
          assert manifest['source']['candidate_commit']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          assert manifest['compatibility']['supported_from']==['2.5.122','2.5.124']
          assert manifest['publication']['formal_tag'] is None
          assert manifest['publication']['update_channel_published'] is False
          assert manifest['publication']['production_write'] is False
          for z in root.glob('*.zip'):
              with zipfile.ZipFile(z) as archive:assert archive.testzip() is None
          for line in (root/'SHA256SUMS.txt').read_text().strip().splitlines():
              digest,name=line.split('  ',1)
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          print('P02_W1_CANDIDATE_EXACT_PRIOR_VERIFIED_BYTES=PASS')
          print('P02_W1_CANDIDATE_DRAFT_ONLY_SOURCE_IDENTITY=PASS')
          PY
      - name: Create private unlisted DRAFT and validate every uploaded asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo P02_OWNER_TRIAL_PRIVATE_DRAFT_WRITE_UNAVAILABLE; exit 78; }
          repo='llhzx2018/vf-library'
          tag='web-w1-v2.5.127-owner-trial-c0cc9412'
          cd product/build/w1-2527-ownertrial
          exists="$(gh api "repos/$repo/releases?per_page=100" --jq "[.[] | select(.tag_name==\"$tag\")] | length")"
          test "$exists" = '0' || { echo P02_OWNER_TRIAL_DRAFT_EXISTS_REFUSE_REPLACEMENT; exit 78; }
          cat > "${RUNNER_TEMP}/p02-w1-ownertrial-notes.txt" <<'EOF'
          VF LIBRARY WEB W1 2.5.127 - PRIVATE OWNER TRIAL DRAFT ONLY.
          This is NOT a Formal Release, Git tag publication, stable update channel, or Production deployment.
          Exact source: c0cc9412a684aa463c3cbf3a63483ea0dacb25a2. Working Web Schema 2401, PHP 8.3 + SQLite, no data migration.
          The W1 Vue search is OPT-IN: append ?w1_preview=1 to the test installation home URL.
          Original P02 search remains available by default and as fallback.
          FULL_CANDIDATE.zip: CLEAN INSTALL ON AN EMPTY ISOLATED TEST SITE ONLY; NEVER overwrite a live P02 site with FULL.
          ATOMIC_CANDIDATE.zip: contains repair-v2.5.127-candidate.php; only for a TEST CLONE at verified 2.5.122 or 2.5.124/Schema 2401.
          UPDATE_CANDIDATE.zip: internal atomic payload; not a standalone site upload.
          Standalone repair PHP: uses existing P02 admin password, same-origin CSRF, pre-operation backup, lock, atomic verify and rollback.
          Before any test, independently back up DB and private attachments; do not apply unapproved candidate to Production.
          Synthetic-only independent tests: build/fresh install/structural PASS https://github.com/llhzx2018/core-free-runner-public/actions/runs/43130996117
          Real exact source old FULL->new Atomic and injected rollback PASS https://github.com/llhzx2018/core-free-runner-public/actions/runs/43131326744
          Real Chromium PHP/SQLite W1 390/768/1440 37/37 PASS https://github.com/llhzx2018/core-free-runner-public/actions/runs/43129516583
          Owner real CloudPanel install, actual production-version confirmation, permanent package distribution and production upgrade NOT_PROVEN.
          EOF
          gh release create "$tag" -R "$repo" --draft --prerelease --target 'c0cc9412a684aa463c3cbf3a63483ea0dacb25a2' --title 'VF Library Web W1 2.5.127 - PRIVATE OWNER TRIAL DRAFT' --notes-file "${RUNNER_TEMP}/p02-w1-ownertrial-notes.txt"
          gh release upload "$tag" -R "$repo"             VF_Library_V2.5.127_FULL_CANDIDATE.zip             VF_Library_V2.5.127_ATOMIC_CANDIDATE.zip             VF_Library_V2.5.127_UPDATE_CANDIDATE.zip             VF_Library_V2.5.127_SOURCE_CANDIDATE.zip             repair-v2.5.127-candidate.php             VF_Library_V2.5.127_CANDIDATE_MANIFEST.json             VF_Library_V2.5.127_CANDIDATE_NOTES.md             SHA256SUMS.txt
          gh api "repos/$repo/releases?per_page=100" > "${RUNNER_TEMP}/p02-draft-list.json"
          python3 - <<'PY'
          import json,hashlib,os,subprocess
          from pathlib import Path
          tag='web-w1-v2.5.127-owner-trial-c0cc9412'
          releases=json.loads(Path(os.environ['RUNNER_TEMP'],'p02-draft-list.json').read_text())
          matches=[r for r in releases if r['tag_name']==tag]
          assert len(matches)==1,'DRAFT_MISSING_OR_DUPLICATE'
          r=matches[0]
          assert r['draft'] is True and r['prerelease'] is True and r['published_at'] is None
          assert r['target_commitish']=='c0cc9412a684aa463c3cbf3a63483ea0dacb25a2'
          expected={p.name:(p.stat().st_size,'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()) for p in Path('.').iterdir() if p.is_file()}
          # exactly eight candidate files; no private staging or extra bytes.
          assert len(expected)==8,('UNEXPECTED_ARTIFACT_FILES',sorted(expected))
          assets={a['name']:a for a in r['assets']}
          assert set(assets)==set(expected),('DRAFT_ASSET_LIST_MISMATCH',sorted(assets),sorted(expected))
          for name,(size,digest) in expected.items():
              a=assets[name]
              assert a['state']=='uploaded' and a['size']==size and a.get('digest')==digest,('PRIVATE_DRAFT_ASSET_MISMATCH',name)
          print('P02_W1_OWNER_TRIAL_PRIVATE_DRAFT=PASS')
          print('P02_W1_OWNER_TRIAL_DRAFT_RELEASE_ID='+str(r['id']))
          print('P02_W1_OWNER_TRIAL_DRAFT_URL='+r['html_url'])
          for name in sorted(expected):
              print('P02_W1_PRIVATE_ASSET='+name+';ID='+str(assets[name]['id'])+';BYTES='+str(expected[name][0])+';SHA256='+expected[name][1][7:])
          print('P02_W1_FORMAL_RELEASE=NO')
          print('P02_W1_CORE_UPDATES_CHANGED=NO')
          print('P02_W1_PRODUCTION_CHANGED=NO')
          PY
      - name: Always remove transient PRIVATE source and binary data
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_AND_CANDIDATE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
