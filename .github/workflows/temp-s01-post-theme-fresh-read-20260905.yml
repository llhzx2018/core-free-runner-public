name: TEMP S01 Post Theme Fresh Read 20260905
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-post-theme-fresh-read-20260905.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read Production component and closure state
        run: |
          set -Eeuo pipefail
          echo '=== theme-style ==='
          curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-content/themes/vf-tools-theme/style.css' | sed -n '1,25p'
          echo '=== s01-domain-authority ==='
          curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' | jq -c .
          echo '=== s01-seo-closure ==='
          curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure' | jq -c .
          echo '=== s01-static-boundary-reconciliation ==='
          curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-boundary-reconciliation' | jq -c .
          echo '=== s01-static-candidate-readiness ==='
          curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' | jq -c .
          echo PASS_S01_POST_THEME_FRESH_READ
