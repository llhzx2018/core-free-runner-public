name: R81 Focused Software Platform Total Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r81-software-platform-total.yml'

permissions:
  contents: read

jobs:
  r81-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 95b68f9314bfd3cc13fb899b6748b8e4aff1ba5b
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 95b68f9314bfd3cc13fb899b6748b8e4aff1ba5b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-source
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01-source
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/SoftwareWorkspaceHome.php
          php -l tests/unit/software_platform_total_contract.php
          php tests/unit/software_platform_total_contract.php
          echo R81_SOFTWARE_PLATFORM_TOTAL_PASS
          echo R81_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/p01-source"
