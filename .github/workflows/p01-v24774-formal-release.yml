name: p01-v24774-formal-release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24774-formal-release.yml'
      - 'scripts/p01_build_v24774_release.py'
      - 'scripts/p01_v24774_release_gate.sh'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 97931667c7d8ecc961aba6e88581f74126b41bad
      TARGET_TREE: 9a529bb997350e24db6c6ff18e1e2e556afb813a
      BASE_TAG: v2.47.73
      BASE_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      VERSION: 2.47.74
      TAG: v2.47.74
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact product source and formal baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$GH_TOKEN"
          remote_main="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          mkdir -p /tmp/p01-rel73/full /tmp/p01-rel73/update
          gh release download "$BASE_TAG" -R "$PRODUCT_REPO" -D /tmp/p01-rel73 \
            -p 'VF-Start-V2.47.73-FULL.zip' \
            -p 'VF_Start_V2.47.73_UPDATE.zip'
          unzip -q /tmp/p01-rel73/VF-Start-V2.47.73-FULL.zip -d /tmp/p01-rel73/full
          unzip -q /tmp/p01-rel73/VF_Start_V2.47.73_UPDATE.zip -d /tmp/p01-rel73/update
          test "$(tr -d '\r\n ' < /tmp/p01-rel73/full/VERSION.txt)" = "2.47.73"
          test -f /tmp/p01-rel73/update/repair-v2.47.73.php
          tag_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/$BASE_TAG" | awk '{print $1}')"
          test "$tag_sha" = "$BASE_SHA"
          echo P01_V24774_RELEASE_SOURCE=PASS

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl

      - name: Build and verify formal artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24774_release_gate.sh
          receipt=/tmp/p01-v24774-artifacts/P01_V24774_ARTIFACT_RECEIPT.json
          jq -e --arg sha "$TARGET_SHA" --arg tree "$TARGET_TREE" '.version=="2.47.74" and .source_version=="2.47.73" and .source_sha==$sha and .source_tree==$tree and .schema=="2026090401"' "$receipt" >/dev/null
          echo P01_V24774_FORMAL_ARTIFACT=PASS

      - name: Publish exact Tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ART=/tmp/p01-v24774-artifacts
          FULL="$ART/VF-Start-V2.47.74-FULL.zip"
          UPDATE="$ART/VF_Start_V2.47.74_UPDATE.zip"
          FULL_SHA="$(sha256sum "$FULL" | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum "$UPDATE" | awk '{print $1}')"
          FULL_BYTES="$(stat -c %s "$FULL")"
          UPDATE_BYTES="$(stat -c %s "$UPDATE")"

          if gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" >/tmp/p01-v24774-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/p01-v24774-tag.json)" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$PRODUCT_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/tmp/p01-v24774-tag.json
            test "$(jq -r '.object.sha' /tmp/p01-v24774-tag.json)" = "$TARGET_SHA"
          fi

          cat >/tmp/p01-v24774-notes.md <<'EOF'
          # VF Start V2.47.74

          P01 · VF Start 系统组 Production UX/UI 可读性收口。

          - Exact Source: 97931667c7d8ecc961aba6e88581f74126b41bad
          - Exact Tree: 9a529bb997350e24db6c6ff18e1e2e556afb813a
          - Source Version: V2.47.73
          - Target Version: V2.47.74
          - Schema: 2026090401（不变）
          - 提升「系统 → 计划任务」Worker 状态、指标、计划表格、执行历史、折叠区和操作按钮的阅读尺度与行高。
          - 提升「系统 → 运行健康」结论、提醒、运行事实、Cron 提示和按需详情的阅读尺度。
          - 提升「系统 → RSS 与扩展」状态、说明、扩展列表和操作的阅读尺度。
          - 执行记录不再直接暴露 problems / unchecked / all 等工程 scope，统一显示中文产品语义。
          - 不改变计划任务执行语义、Schema、数据、Auth、Updater 或 Production 数据。
          - Focused UX Contracts、Canonical Zero-Debt、Clean FULL、V2.47.73 → V2.47.74 Atomic、Rollback、Data Sentinel、Idempotency：PASS。
          - Production 仍由 OWNER 后台手动升级。
          EOF

          if gh release view "$TAG" -R "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL" "$UPDATE" -R "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL" "$UPDATE" -R "$PRODUCT_REPO" --title "VF Start V2.47.74" --notes-file /tmp/p01-v24774-notes.md --verify-tag
          fi

          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" >/tmp/p01-v24774-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v24774-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v24774-release.json)"
          test "$(jq -r '.target_commitish' /tmp/p01-v24774-release.json)" = "$TARGET_SHA"
          test "$(jq -r '.draft' /tmp/p01-v24774-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v24774-release.json)" = false
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.47.74-FULL.zip")|.size' /tmp/p01-v24774-release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.47.74_UPDATE.zip")|.size' /tmp/p01-v24774-release.json)" = "$UPDATE_BYTES"

          rm -rf /tmp/p01-v24774-remote
          mkdir -p /tmp/p01-v24774-remote
          gh release download "$TAG" -R "$PRODUCT_REPO" -D /tmp/p01-v24774-remote \
            -p 'VF-Start-V2.47.74-FULL.zip' \
            -p 'VF_Start_V2.47.74_UPDATE.zip'
          test "$(sha256sum /tmp/p01-v24774-remote/VF-Start-V2.47.74-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v24774-remote/VF_Start_V2.47.74_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"

          jq -n \
            --argjson release_id "$RELEASE_ID" \
            --arg released_at "$RELEASED_AT" \
            --arg full_sha "$FULL_SHA" \
            --arg update_sha "$UPDATE_SHA" \
            --argjson full_bytes "$FULL_BYTES" \
            --argjson update_bytes "$UPDATE_BYTES" \
            '{release_id:$release_id,released_at:$released_at,product_identity:"97931667c7d8ecc961aba6e88581f74126b41bad",tree:"9a529bb997350e24db6c6ff18e1e2e556afb813a",version:"2.47.74",source_version:"2.47.73",full:{name:"VF-Start-V2.47.74-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.47.74_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha},production_changed:false}' >/tmp/P01_V24774_PUBLICATION_RECEIPT.json
          cat /tmp/P01_V24774_PUBLICATION_RECEIPT.json
          echo P01_V24774_GITHUB_RELEASE=PASS

      - name: Upload publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24774-publication-receipt
          path: |
            /tmp/P01_V24774_PUBLICATION_RECEIPT.json
            /tmp/p01-v24774-artifacts/P01_V24774_ARTIFACT_RECEIPT.json
          if-no-files-found: warn
          retention-days: 14
