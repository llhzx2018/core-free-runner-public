name: P02 V2.5.105 Final Inkstone Alignment

on:
  push:
    branches:
      - run/p02-v25105-final-alignment-20260924
    paths:
      - '.github/workflows/p02-v25105-final-alignment.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P02 V2.5.105 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 19679434023e77fc891fc6749d5ffc8feafabe27
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source contracts
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "19679434023e77fc891fc6749d5ffc8feafabe27"
          test "$(cat VERSION)" = "2.5.105"
          node tests/unit/p02_v2542_inkstone_reference_contract.mjs
          node tests/unit/p02_v2561_inkstone_macro_alignment.mjs
          node tests/unit/p02_v25103_inkstone_final_ux_convergence_r1.mjs
          node tests/unit/p02_v25103_inkstone_final_ux_convergence_r2.mjs
          node tests/unit/p02_v25103_inkstone_final_ux_convergence_r3.mjs
          node tests/unit/p02_v25104_rail_drag_bugfix.mjs
          node tests/unit/p02_v25105_workspace_geometry_closure.mjs
          node tests/unit/p02_v25105_settings_chrome_visual_closure.mjs
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          echo P02_V25105_EXACT_SOURCE=PASS

      - name: Launch clean V2.5.105 site
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25105-UX-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          SITE="${RUNNER_TEMP}/p02-v25105-site"
          COOKIE="${RUNNER_TEMP}/p02-v25105-cookie.txt"
          BASE="http://127.0.0.1:18115"
          bash scripts/build-deploy-tree.sh "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = "2.5.105"
          php -d display_errors=0 -S 127.0.0.1:18115 -t "$SITE" >"${RUNNER_TEMP}/p02-v25105-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/p02-v25105-server.pid"
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "${RUNNER_TEMP}/p02-v25105-setup.html"
          SETUP_CSRF="$(python3 -c 'import re,html,sys;s=open(sys.argv[1],encoding="utf-8").read();m=re.search(r"name=\"setup_csrf\" value=\"([^\"]+)\"",s);assert m;print(html.unescape(m.group(1)))' "${RUNNER_TEMP}/p02-v25105-setup.html")"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = "303"

      - name: Real Chromium final alignment
        working-directory: product
        env:
          VF_UX_E2E_BASE_URL: http://127.0.0.1:18115
          VF_UX_E2E_PASSWORD: "VF-P02-V25105-UX-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          node tests/e2e/p02_v25105_workspace_geometry_closure.mjs
          node tests/e2e/p02_v25105_settings_chrome_visual_closure.mjs
          echo P02_V25105_FINAL_INKSTONE_BROWSER=PASS

      - name: Stop clean site
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/p02-v25105-server.pid"; then
            kill "$(cat "${RUNNER_TEMP}/p02-v25105-server.pid")" 2>/dev/null || true
          fi
