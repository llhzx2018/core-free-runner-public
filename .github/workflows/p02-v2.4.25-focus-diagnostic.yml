name: P02 V2.4.25 Focus Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p02-v2.4.25-focus-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 30df45d478d3b284c6b64e5ceaa36c6cd7579b5f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          persist-credentials: false
      - name: Install
        working-directory: p02
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl curl >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose
        working-directory: p02
        shell: bash
        run: |
          set -Eeuo pipefail
          SITE="$RUNNER_TEMP/site"; COOKIE="$RUNNER_TEMP/cookie"; PORT=18134; BASE="http://127.0.0.1:$PORT"; PASS="Diag-${GITHUB_RUN_ID}!"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          php -S "127.0.0.1:$PORT" -t "$SITE" >"$RUNNER_TEMP/server.log" 2>&1 & PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .2; done
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$RUNNER_TEMP/setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/setup.html" <<'PY'
          import html,re,sys;s=open(sys.argv[1]).read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASS" --data-urlencode "password_confirm=$PASS" "$BASE/setup.php")" = 303
          cat > .diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1440,height:900}}),base=process.env.BASE_URL,password=process.env.TEST_PASSWORD;
          await p.goto(base+'/',{waitUntil:'networkidle'});let s=await p.evaluate(async()=>await (await fetch('/api.php?action=session')).json());if(!s?.site?.auth){await p.locator('[data-open-login]').first().click();await p.locator('#loginForm input[name="password"]').fill(password);await p.locator('#loginSubmit').click();await p.waitForFunction(async()=>Boolean((await (await fetch('/api.php?action=session')).json())?.site?.auth));}
          await p.evaluate(()=>openEditor(null,{forceContentMode:'quick',forceContentFormat:'plain'}));await p.locator('#contentForm').waitFor({state:'visible'});
          console.log('BEFORE='+JSON.stringify(await p.evaluate(()=>{const el=document.querySelector('#contentForm [data-attachment-library]');el.focus({preventScroll:true});return {active:document.activeElement===el,connected:el.isConnected,html:el.outerHTML}})));
          await p.evaluate(()=>document.querySelector('#contentForm [data-attachment-library]').click());await p.locator('[data-library-query]').waitFor({state:'visible'});await p.waitForFunction(()=>document.activeElement===document.querySelector('[data-library-query]'));
          console.log('IN_MODAL='+JSON.stringify(await p.evaluate(()=>({active:document.activeElement?.outerHTML,editor:!!document.querySelector('#contentForm'),openerConnected:!!document.querySelector('#contentForm [data-attachment-library]')}))));
          await p.keyboard.press('Escape');await p.locator('.attachment-modal-overlay').waitFor({state:'detached'});
          for(const ms of [0,20,100,500]){if(ms)await p.waitForTimeout(ms);console.log('AFTER_'+ms+'='+JSON.stringify(await p.evaluate(()=>{const op=document.querySelector('#contentForm [data-attachment-library]');return {activeTag:document.activeElement?.tagName,activeHtml:document.activeElement?.outerHTML?.slice(0,240),editor:!!document.querySelector('#contentForm'),openerExists:!!op,openerConnected:op?.isConnected,openerIsActive:op===document.activeElement};})));}
          await b.close();
          JS
          BASE_URL="$BASE" TEST_PASSWORD="$PASS" node .diag.mjs
      - if: always()
        run: rm -rf p02 "$RUNNER_TEMP/site" || true
