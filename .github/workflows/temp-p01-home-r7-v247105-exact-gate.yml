name: TEMP P01 Home R7 V2.47.105 exact gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-home-r7-v247105-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-home-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 979ba32b3fbfa04e6474ab9b37b2d1a29e5cecf6
      BASELINE_SHA: 2915164400a17538dd8c266a1c6f5a4a71f6f44f
      VERSION: 2.47.105
    steps:
      - name: Checkout verification control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_HOME_R7_RUNTIME=PASS

      - name: Resolve exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          rm -rf /tmp/p01-home-candidate /tmp/p01-home-baseline
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-candidate
          git -C /tmp/p01-home-candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C /tmp/p01-home-candidate checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-home-candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < /tmp/p01-home-candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < /tmp/p01-home-candidate/src/VERSION.txt)" = "$VERSION"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" /tmp/p01-home-baseline
          git -C /tmp/p01-home-baseline fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C /tmp/p01-home-baseline checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/p01-home-baseline rev-parse HEAD)" = "$BASELINE_SHA"
          echo P01_HOME_R7_EXACT_SOURCE=PASS

      - name: Home prototype contract and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-candidate
          php -l src/app/FunctionalHome.php >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          php tests/unit/frontend_home_r7_prototype_lock_v247105_contract.php | tee /tmp/p01-home-r7.txt
          grep -Fx 'P01_HOME_R7_PROTOTYPE_LOCK_V247105=PASS' /tmp/p01-home-r7.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/assets/frontend-home-r7.css').read_text(encoding='utf-8')
          depth=0
          for c in s:
              if c=='{': depth+=1
              elif c=='}': depth-=1
              if depth<0: raise SystemExit('CSS_BRACE_UNDERFLOW')
          if depth!=0: raise SystemExit('CSS_BRACE_UNBALANCED')
          print('P01_HOME_R7_CSS_STRUCTURE=PASS')
          PY

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-home-candidate
          bash tests/canonical_release_regression.sh /tmp/p01-home-candidate /tmp/p01-home-baseline --require-zero-debt | tee /tmp/p01-home-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-home-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-home-canonical.txt
          echo P01_HOME_R7_EXACT_GATE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf /tmp/p01-home-candidate /tmp/p01-home-baseline /tmp/p01-home-r7.txt /tmp/p01-home-canonical.txt
