name: S01 Page Body V1 A4 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a4-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a4-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      OPS_SHA: cad7e462ec1cdffb3b1660f198ced3bbb36748df
      M3U8_SHA: c92f68e8d76f1469bd0bee37d8725b3f6be25443
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A3 + A4 contracts
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l includes/admin-v13/views/seo_refine.php
          php -l includes/views/admin-content-tabs/content-refinement.php
          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l tests/s01-c02-page-body-system-v1-a3-contract.php
          php -l tests/s01-c02-page-body-system-v1-a4-contract.php
          php tests/s01-c02-page-body-system-v1-a3-contract.php
          php tests/s01-c02-page-body-system-v1-a4-contract.php
          grep -Fq 'data-vf-page-archetype="a4"' includes/admin-v13/views/seo_refine.php
          grep -Fq 'data-vf-page-archetype="a4"' includes/views/admin-content-tabs/content-refinement.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-ops-s01-shell' assets/css/current/admin-s01-page-body-system-v1.css

      - name: M3U8 A3 + A4 contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l src/admin/Controller/class-v6-provider-contracts-controller.php
          php -l src/admin/Controller/class-v6-provider-fixtures-controller.php
          php -l tests/s01-c03-page-body-system-v1-a3-contract.php
          php -l tests/s01-c03-page-body-system-v1-a4-contract.php
          php tests/s01-c03-page-body-system-v1-a3-contract.php
          php tests/s01-c03-page-body-system-v1-a4-contract.php
          test "$(grep -o 'data-vf-page-archetype="a4"' src/admin/Controller/class-v6-provider-contracts-controller.php | wc -l)" = "2"
          test "$(grep -o 'data-vf-page-archetype="a4"' src/admin/Controller/class-v6-provider-fixtures-controller.php | wc -l)" = "1"
          grep -Fq 'vf-m3u8-a4-lifecycle-actions' src/admin/Controller/class-v6-provider-contracts-controller.php
          grep -Fq 'vf-m3u8-a4-evidence' src/admin/Controller/class-v6-provider-fixtures-controller.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=path.read_text()
              assert c.count('{')==c.count('}'), path
          print('PASS_CSS_BALANCE')
          PY
