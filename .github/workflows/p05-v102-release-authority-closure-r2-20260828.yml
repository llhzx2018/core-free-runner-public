name: P05 V1.0.2 Release Authority Closure R2

on:
  push:
    paths:
      - '.github/workflows/p05-v102-release-authority-closure-r2-20260828.yml'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_MAIN: 461259dafd5f002733a402ec073bd8c618383a21
      BASE_TREE: c5b413f85236dd825895b72bcd0dc6c8300bc510
      BRANCH: governance/p05-v102-release-closure-20260828
      ASSET_BYTES: '478059'
      ASSET_SHA256: 7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267
      ASSET: VF_SEO_V1.0.2_FULL.zip

    steps:
      - uses: actions/checkout@v4

      - name: Checkout P05 closure branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05

      - name: Verify release asset and edit Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "$BASE_MAIN"
          test "$(git -C p05 rev-parse HEAD^{tree})" = "$BASE_TREE"
          ROOT="$RUNNER_TEMP/p05-v102-authority-r2"; mkdir -p "$ROOT"
          curl -fsSL "https://github.com/llhzx2018/vf-seo/releases/download/v1.0.2/$ASSET" -o "$ROOT/$ASSET"
          test "$(stat -c '%s' "$ROOT/$ASSET")" = "$ASSET_BYTES"
          test "$(sha256sum "$ROOT/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          FILES=$(unzip -Z1 "$ROOT/$ASSET" | grep -v '/$' | wc -l | tr -d ' ')
          export FILES
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('p05')
          path=root/'VF_PROJECT.json'
          p=json.loads(path.read_text(encoding='utf-8'))
          p['status']='V1.0.2_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          p['version']='1.0.2'
          p['production_version']=None
          p['target_version']='1.0.2'
          p['working_version']='1.0.2'
          p['version_change']=False
          h=p.setdefault('human_ui_exposure_v1_0_2',{})
          h['state']='RELEASED'
          h['candidate_source']='e1c4b3239bba89eaa2603ee61d7dafd5d89b946f'
          h['final_release_source']='461259dafd5f002733a402ec073bd8c618383a21'
          h['final_release_tree']='c5b413f85236dd825895b72bcd0dc6c8300bc510'
          h['final_machine_gate_run']=33166983612
          h['formal_publication_run']=33178461893
          h['production_state']='NOT_DEPLOYED'
          p['formal_release']='v1.0.2'
          p['formal_release_state']='RELEASED_CURRENT'
          p['formal_release_candidate_commit']='461259dafd5f002733a402ec073bd8c618383a21'
          p['formal_release_candidate_tree']='c5b413f85236dd825895b72bcd0dc6c8300bc510'
          p['formal_release_asset']='VF_SEO_V1.0.2_FULL.zip'
          p['formal_release_asset_files']=int(os.environ['FILES'])
          p['formal_release_asset_bytes']=478059
          p['formal_release_asset_sha256']='7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267'
          p['working_branch']='main'
          p['release_authorization']='PASS_RELEASED'
          p['next_action']='P05 RELEASE CLOSED; PRODUCTION REMAINS NOT_DEPLOYED; CONTINUE P06'
          p.setdefault('authority',{})['release']='docs/authority/RELEASE_V1.0.2_CURRENT.md'
          p['deployment_readiness']={'state':'PASS_V1.0.2_RELEASED','production_state':'NOT_DEPLOYED','production_verification':'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT','exact_source':'461259dafd5f002733a402ec073bd8c618383a21','product_tree':'c5b413f85236dd825895b72bcd0dc6c8300bc510','schema':1,'common_product_baseline':'VF-COMMON-PRODUCT-BASELINE@2.0','regression_evidence':{'repository':'llhzx2018/core-free-runner-public','run':33178461893,'job':98873154023,'state':'PASS'},'first_install_evidence':{'repository':'llhzx2018/core-free-runner-public','run':33178461893,'job':98873154023,'state':'PASS','first_install':'PASS','sqlite_migration':'PASS','admin_bootstrap':'PASS','pm2_server_worker':'PASS','health':'PASS'},'full_asset':{'name':'VF_SEO_V1.0.2_FULL.zip','files':int(os.environ['FILES']),'bytes':478059,'sha256':'7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267'},'update_asset':{'state':'NOT_PUBLISHED_FULL_ONLY'}}
          p['formal_release_id']=378526886
          p['formal_release_asset_id']=533886110
          p['release_publication']={'state':'PASS_V1.0.2_CURRENT','repository':'llhzx2018/core-free-runner-public','workflow':'.github/workflows/p05-v102-full-only-publication-20260828.yml','run':33178461893,'job':98873154023,'release_id':378526886,'tag':'v1.0.2','tag_source':'461259dafd5f002733a402ec073bd8c618383a21','tag_tree':'c5b413f85236dd825895b72bcd0dc6c8300bc510','full_asset_id':533886110,'full_asset_sha256':'7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267','distribution':'core-updates/projects/P05.json','distribution_commit':'115f26ce32e40e04a2497febd596dd253098b629','distribution_mode':'FULL_ONLY','from_versions':[],'production_state':'NOT_DEPLOYED','known_non_release_blocker':'FUTURE_ATOMIC_STAGED_BUILD_REQUIRES_SEPARATE_FOLLOW_UP'}
          path.write_text(json.dumps(p,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          authority_lines=[
              '# P05 · VF SEO · Release V1.0.2 Current Authority',
              '',
              '## Current Truth',
              '',
              '- Release: `v1.0.2`',
              '- State: `RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED`',
              '- Product Source: `461259dafd5f002733a402ec073bd8c618383a21`',
              '- Product Tree: `c5b413f85236dd825895b72bcd0dc6c8300bc510`',
              '- Schema: `1`（unchanged）',
              '- Distribution: `FULL_ONLY`',
              '- `from_versions`: `[]`',
              '- Production: `NOT_DEPLOYED`',
              '',
              '## Formal Asset',
              '',
              '- Release ID: `378526886`',
              '- Asset ID: `533886110`',
              '- Asset: `VF_SEO_V1.0.2_FULL.zip`',
              f"- Files: `{os.environ['FILES']}`",
              '- Bytes: `478059`',
              '- SHA-256: `7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267`',
              '',
              '## Machine Evidence',
              '',
              '- Human UI Final Exact Source Gate R2: `33166983612` = PASS',
              '- Formal FULL_ONLY Publication Gate: `33178461893 / 98873154023` = PASS',
              '- Main tree equals verified release tree: PASS',
              '- Regression / build: PASS',
              '- Deterministic FULL: PASS',
              '- Formal FULL first install: PASS',
              '- SQLite Schema 1: PASS',
              '- Admin bootstrap: PASS',
              '- PM2 server + worker: PASS',
              '- Health v1.0.2: PASS',
              '',
              '## Release Boundary',
              '',
              'V1.0.2 does **not** claim V1.0.1 → V1.0.2 Atomic online update support. `core-updates/projects/P05.json` remains `FULL_ONLY` with empty `from_versions`.',
              '',
              'A future Atomic staged-build issue was discovered during a synthetic V1.0.2 → V1.0.3 readiness experiment. It is not part of the V1.0.2 Release Contract and does not block the verified FULL release; it must be handled as a separate future task before any Atomic channel is enabled.',
              '',
              'No Production runtime exists for P05. Source / Release PASS must not be represented as Production PASS.',
              '',
              '## Closure',
              '',
              'P05 V1.0.2 Release is closed. The next portfolio task is P06; P05 Production remains explicitly `NOT_DEPLOYED` until a separate owner-authorized deployment task exists.',
              ''
          ]
          (root/'docs/authority/RELEASE_V1.0.2_CURRENT.md').write_text('\n'.join(authority_lines),encoding='utf-8')
          cp=root/'CHANGELOG.md'
          s=cp.read_text(encoding='utf-8')
          marker='- P05 仍无真实 Production Runtime，本版本 Release 后仍必须保持 `PRODUCTION_NOT_DEPLOYED`，不得将 Source / Release 验证冒充 Production PASS。\n'
          addition='- Formal Publication：`v1.0.2` / Release `378526886` / `VF_SEO_V1.0.2_FULL.zip` / 478059 bytes / SHA-256 `7537ae5d66d7e34b55ae0d99df09d7d87e0e10895edc47ee9ffeb4ef62332267`。\n- Distribution 保持 `FULL_ONLY`，`from_versions=[]`；不声明 V1.0.1 → V1.0.2 Atomic 在线升级。\n'
          if 'Release `378526886`' not in s:
              if marker not in s: raise SystemExit('CHANGELOG marker missing')
              cp.write_text(s.replace(marker,marker+addition,1),encoding='utf-8')
          PY
          python3 -m json.tool p05/VF_PROJECT.json >/dev/null
          grep -Fq 'V1.0.2_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED' p05/VF_PROJECT.json
          grep -Fq 'FULL_ONLY' p05/docs/authority/RELEASE_V1.0.2_CURRENT.md
          grep -Fq 'Release `378526886`' p05/CHANGELOG.md
          git -C p05 diff --check
          echo P05_V102_AUTHORITY_R2_EDIT=PASS

      - name: Commit and push exact closure scope
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VF_PROJECT.json CHANGELOG.md docs/authority/RELEASE_V1.0.2_CURRENT.md
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'
          git commit -m 'docs(P05): close V1.0.2 release authority'
          git push origin "HEAD:$BRANCH"
          echo P05_V102_AUTHORITY_R2_PUSH=PASS
