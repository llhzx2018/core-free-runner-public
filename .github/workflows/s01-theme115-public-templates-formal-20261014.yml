name: S01 Theme refinement approved public template formal release
on:
  push:
    branches: [task/s01-theme115-public-templates-formal-20261014]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.115'
      TARGET_SHA: '1c0d4966fe8207629386688dbb4ab12df7986c27'
      TARGET_TREE: '8864c679a1219f1cb3570d7184cc26016e0c7a0b'
      TARGET_MAIN_SHA: '1c0d4966fe8207629386688dbb4ab12df7986c27'
      SOURCE_VERSION: '1.35.114'
      BASE_SHA: 'ff421e8a537bd9e513f14ce8241d127ef497dbde'
      M3_VERSION: '1.25.91'
      M3_SHA: '2494010394a424112bd4cb7d70c60b0481e21313'
      M3_TREE: '0deab9d1df33922514d80b2eae65130b0acabd97'
      TESTED_SHA: 'd43838a3e81366eed9c8ea148fe23816bd2d66f2'
      M3_SOURCE_VERSION: '1.25.90'
      CANDIDATE_RUN: '38502190864'
      CANDIDATE_SHA: 'bff475654e363618e4bcb19862b6e8f63c6be21c'
      CANDIDATE_ARTIFACT: '11865804768'
      CANDIDATE_DIGEST: 'sha256:0c0d752ce45411b858023cb41d220cfaf150321b9b7f2596bf64a94216060a71'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme115-public-templates-formal-20261014/spec.json --template runner/lanes/s01-theme115-public-templates-formal-20261014/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-theme115-public-templates-formal-20261014.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme115-public-templates-formal-20261014/spec.json --input runner/.github/workflows/s01-theme115-public-templates-formal-20261014.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-theme115-public-templates-formal-20261014 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic Theme rebuild and tested asset equality
        run: bash lane/build.sh
      - name: Publish authorized Theme formal release and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: s01-theme-public-template-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['theme-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PUBLIC_SAFE_FORMAL_RECEIPT',json.dumps({'status':'PASS','id':m['id'],'bytes':len(b),'digest':m['digest']}))
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip
