name: S01-C01 render exact candidate
on:
  push:
    branches: [task/s01-c01-render-13576-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.76'
      TARGET_SHA: '6b044e2cd37116885c0645bbc64881d95652e0a2'
      TARGET_TREE: 'b63d5c9bc64a2640ddf0de1d8f51ff33fa370b79'
      SOURCE_VERSION: '1.35.75'
      BASE_SHA: '9aae092750bdbeaf2a99e16b99dd273ef32e0ef9'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-render-13576 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/render-page-refinement-contract.php
          php target/tests/render-settings-human-language-contract.php
          php target/tests/render-workflow-v4-contract.php
          node --check target/tests/render-controls-browser-check.js
          node --check target/src/assets/js/admin/admin-render.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1757357'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = '02ded0891696b6e32acd9cec643989126e56b799ca137a3f8867389db0385def'
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-render-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py /tmp/navigation-candidate.css /tmp/navigation-baseline.log
