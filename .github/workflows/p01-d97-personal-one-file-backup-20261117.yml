name: P01 D97 one personal encrypted backup file, three real engines
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-d97-personal-one-file-backup-20261117.yml'
permissions:
  contents: read
concurrency:
  group: p01-d97-20261117
  cancel-in-progress: false
jobs:
  exact-three-db-personal-one-file-backup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports: ["3306:3306"]
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports: ["3307:3306"]
    env:
      PRODUCT_SHA: c494272df86ee5b26b7acf95b2e81606147f5307
    steps:
      - name: Restrict to exact one-off Runner branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-d97-personal-one-file-backup-20261117"
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          echo P01_D97_ONLY_SYNTHETIC_ISOLATED_TESTS=YES
      - name: Checkout approved exact private product without persisting token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout shared source rules for project architecture gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-doc
          persist-credentials: false
      - name: Exact source identity and changed code syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for n in ("d97_personal_recovery_bundle.py","run_cloudpanel_fpm_full_stage.py"):
              ast.parse((Path("candidate/tests/compatibility/laravel/http")/n).read_text())
          print("P01_D97_JOB_PYTHON_SYNTAX=PASS")
          PY
          test "$(wc -l < candidate/src/app/next/OwnerJobRuntime.php)" -le 400
          echo P01_D97_EXACT_PRODUCT_SOURCE=PASS
      - name: Install only isolated machine dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-d97-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip php8.3-gd php8.3-intl composer openssl unzip >> "$RUNNER_TEMP/p01-d97-apt.log" 2>&1
          php8.3 -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(3);'
          for name in src/app/next/runtime/PersonalRecoveryBundle.php src/app/next/runtime/RecoveryBootstrapKit.php src/app/next/runtime/BackupScheduleStatus.php src/app/next/runtime/LegacyEscrowArchive.php src/app/next/runtime/IsolatedPluginArchive.php src/app/next/runtime/IsolatedRecoverySnapshot.php src/app/next/runtime/IsolatedRecoveryVerificationMethods.php src/app/next/runtime/OwnerIsolatedBackupJob.php tests/compatibility/laravel/http/d89_owner_backup_restore_clone.php src/app/next/OwnerRssPluginStore.php src/app/next/OwnerRssPluginRuntime.php src/app/next/OwnerRssFeedWorker.php src/app/next/OwnerRssPluginRoutes.php src/app/next/OwnerPluginInventory.php src/app/next/OwnerJobReplaySafety.php src/app/next/runtime/IsolatedRecoveryVerificationMethods.php src/app/next/runtime/OwnerIsolatedBackupJob.php src/app/next/bin/p01-owner-isolated-backup.php tests/compatibility/laravel/http/d89_owner_backup_restore_clone.php src/app/next/OwnerJobRuntime.php src/app/next/OwnerJobScheduleControl.php src/app/next/D2OwnerJobRepository.php src/app/next/http/OwnerHttpRoutes.php tests/compatibility/laravel/D2OwnerJobRepositoryProbe.php; do
              php8.3 -l "candidate/$name" >/dev/null
          done
          echo P01_D97_REAL_PHP_SYNTAX_AND_NATIVE_DATABASE_DRIVERS=PASS
      - name: Project source architecture and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B candidate/.github/checks/test_architecture_gate.py > "$RUNNER_TEMP/p01-d97-arch-tests.log" 2>&1
          python3 -B candidate/.github/checks/architecture_gate.py --manifest candidate/.github/checks/code_architecture.json --gov-root gov-doc --base-sha c377dc3e0696585b207561081f6dc462108c904f --head-sha "$PRODUCT_SHA" --git-root candidate > "$RUNNER_TEMP/p01-d97-architecture.log" 2>&1
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-d97-architecture.log" >/dev/null
          echo P01_D97_ACTUAL_DIFF_ARCHITECTURE_NAMING_NEGATIVES=PASS
      - name: Build real exact-source Laravel Clean FULL and CloudPanel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/p01-d97-clean-full.zip" --composer composer > "$RUNNER_TEMP/p01-d97-build.log" 2>&1 || { tail -n 12 "$RUNNER_TEMP/p01-d97-build.log"; exit 1; }
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-d97-clean-full.zip" >/dev/null
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-d97-clean-full.zip" --output "$RUNNER_TEMP/p01-d97-cloudpanel.zip" >/dev/null
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-d97-cloudpanel.zip" >/dev/null
          echo P01_D97_REAL_EXACT_SOURCE_SELF_CONTAINED_FULL=PASS
      - name: D97 one-file encrypted Owner backup and isolated password recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"candidate/tests/compatibility/laravel/http")
          from run_cloudpanel_fpm_full_stage import Site,require
          # Single personal encrypted recovery bundle, real existing D89 backup.
          # No D89-D96 unrelated business and restore test reruns.
          bundle=Path(__import__("os").environ["RUNNER_TEMP"])/"p01-d97-cloudpanel.zip"
          for engine in ("sqlite","mariadb","mysql"):
              with tempfile.TemporaryDirectory(prefix="p01-d14-stage-") as temporary:
                  site=Site(Path(temporary),engine,bundle)
                  try:
                      site.start()
                      site.run(only_personal_recovery_bundle=True)
                      print("P01_D97_"+engine.upper()+"_HTTPS_ONE_FILE_PERSONAL_RECOVERY=PASS",flush=True)
                  finally:
                      site.stop()
          print("P01_D97_THREE_REAL_ENGINES_ONE_FILE_PERSONAL_RECOVERY=PASS")
          PY
      - name: Cleanup all transient private product, data and build input
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate gov-doc
          rm -f -- "$RUNNER_TEMP"/p01-d97-*
          test ! -e candidate && test ! -e gov-doc
          echo P01_D97_PUBLIC_RUNNER_PRIVATE_SOURCE_AND_TEST_DATA_PERSISTENCE=NONE
