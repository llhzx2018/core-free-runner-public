name: GOV-DOC Public Authority Five-Layer Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gov-doc-public-authority-five-layer-exact-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact GOV-DOC candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: cdbbb26409af2923832e491a7342d929c038a7bd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-doc-candidate

      - name: Verify exact source identity
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="cdbbb26409af2923832e491a7342d929c038a7bd"
          test "$actual" = "$expected"
          echo "GOV_DOC_EXACT_SOURCE=$actual"

      - name: Verify source-only diff scope
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          base="99e08bb8c582525e224e92c0d6fbea5a2f72f2e8"
          git cat-file -e "$base^{commit}"
          git diff --name-only "$base" HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [line.strip() for line in Path('/tmp/changed.txt').read_text().splitlines() if line.strip()]
          exact = {
              'CURRENT.md',
              'skills/README.md',
              'mother-specs/agent-native-current/README.md',
              'governance/public-authority/PUBLIC_AUTHORITY_ROUTER_ADOPTION_CHECKLIST.md',
              'governance/public-authority/VF_PUBLIC_AUTHORITY_ADOPTION_PLAN_V1.0.md',
              'governance/public-authority/tools/public_authority_skill_adoption_lint.py',
          }
          patterns = [
              re.compile(r'^skills/skill-master/V1\.6/'),
              re.compile(r'^skills/skill-rpd/V3\.9/'),
              re.compile(r'^skills/skill-dev/V8\.7/'),
              re.compile(r'^skills/skill-audit/V1\.5/'),
              re.compile(r'^skills/skill-release/V2\.6/'),
              re.compile(r'^mother-specs/agent-native-current/skill-master/V1\.6/'),
              re.compile(r'^mother-specs/agent-native-current/skill-rpd/V3\.9/'),
              re.compile(r'^mother-specs/agent-native-current/skill-dev/V8\.7/'),
              re.compile(r'^mother-specs/agent-native-current/skill-audit/V1\.5/'),
              re.compile(r'^mother-specs/agent-native-current/skill-release/V2\.6/'),
          ]
          bad = [p for p in paths if p not in exact and not any(rx.match(p) for rx in patterns)]
          if bad:
              raise SystemExit('OUT_OF_SCOPE=' + ','.join(bad))
          if any(p.startswith('distribution/') for p in paths):
              raise SystemExit('DISTRIBUTION_WRITE_DETECTED')
          if any(p.startswith('projects/') for p in paths):
              raise SystemExit('PROJECT_WRITE_DETECTED')
          print(f'ALLOWED_CHANGED_FILES={len(paths)}')
          print('SOURCE_ONLY_SCOPE=PASS')
          PY

      - name: Validate Public Authority Router governance
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          python3 governance/public-authority/tools/public_authority_router_lint.py

      - name: Validate five-layer Source adoption
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          python3 governance/public-authority/tools/public_authority_skill_adoption_lint.py

      - name: Machine receipt
        run: |
          echo 'GOV_DOC_PUBLIC_AUTHORITY_FIVE_LAYER_MACHINE=PASS'
          echo 'GOV_DOC_EXACT_SOURCE=cdbbb26409af2923832e491a7342d929c038a7bd'
          echo 'SOURCE_CURRENT_PROMOTION=CANDIDATE_VERIFIED'
          echo 'DISTRIBUTION_WRITE=0'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
          echo 'P05_PRODUCT_REGRESSION=PENDING'
