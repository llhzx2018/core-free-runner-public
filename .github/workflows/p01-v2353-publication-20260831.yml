name: P01 V2.35.3 Publication Gate
on:
  push:
    branches: [release/p01-v2353-publication-20260831]
    paths: [.github/workflows/p01-v2353-publication-20260831.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 8f1073120f8096fc23554906615601752feb036d
      FORMAL_TREE: ece02ef928ad5b119e2b0237e7963a607865ddbb
      RUNTIME_TREE: 7f181909c7ccd3179491f21cfca426008de4295f
      FORMAL_RUN: '33359124042'
      FORMAL_ARTIFACT: p01-v2353-formal-artifacts-33359124042
      FORMAL_DIGEST: sha256:713eb2cfb3034a4e133d0cb841a5b1849f75c4bfe443b0206ccfb37dce3b6df8
      STRICT_RUN: '33360911751'
      PROMOTION_RUN: '33361025502'
      ART: /tmp/p01-v2353-publish-artifacts
      ROUNDTRIP: /tmp/p01-v2353-release-roundtrip
      EVID: /tmp/p01-v2353-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.ART }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}
      - name: Checkout exact formal source for Git write authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Publish tag and GitHub Release from exact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PROMOTION_RUN --jq .conclusion)" = success
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$FORMAL_SOURCE"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.35.3 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.35.3 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$ART"
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          jq -e '.formal_source=="8f1073120f8096fc23554906615601752feb036d" and .formal_tree=="ece02ef928ad5b119e2b0237e7963a607865ddbb" and .runtime_tree=="7f181909c7ccd3179491f21cfca426008de4295f" and .version=="2.35.3" and .source_version=="2.35.2" and .schema=="2026082901" and .migration==null and .owner_production_write==false' P01-V2.35.3-FORMAL-METADATA.json >/dev/null
          test "$(sha256sum VF_Start_V2.35.3_UPDATE.zip | awk '{print $1}')" = ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9
          test "$(stat -c %s VF_Start_V2.35.3_UPDATE.zip)" = 1378346
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"
          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.35.3"
          TAG=$(git ls-remote --tags origin refs/tags/v2.35.3 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"
          gh release create v2.35.3 "$ART"/* \
            --repo llhzx2018/vf-start \
            --verify-tag \
            --title 'VF Start V2.35.3' \
            --notes 'V2.35.3 是 V2.35.2 后的 Online Update Terminal-State Closure Patch。修复后台在线升级页中 hidden 状态被旧 display:grid/flex 规则重新显示的问题；升级成功后核心脚本即时同步版本与 footer，并以单一全局锁触发一次硬刷新，observer 仅保留 fallback，消除双刷新竞态。真实失败态仍保持红色失败语义，新版本可用时仍正常显示安装动作。Schema 保持 2026082901，无 Migration。Hotfix Machine 33358556905 PASS；Candidate 33358914290 PASS；Formal Artifact 33359124042 PASS；Strict Fresh 33360911751 PASS；Main Promotion 33361025502 PASS。Owner Production 不由 Assistant 自动修改。'
          gh api repos/llhzx2018/vf-start/releases/tags/v2.35.3 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.35.3
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.35.3 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$ART"/*; do n=$(basename "$f"); test -f "$ROUNDTRIP/$n"; test "$(sha256sum "$f"|awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n"|awk '{print $1}')"; test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"; done
          UPDATE_SHA=$(sha256sum "$ROUNDTRIP/VF_Start_V2.35.3_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c %s "$ROUNDTRIP/VF_Start_V2.35.3_UPDATE.zip")
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2353_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nUPDATE_ASSET=VF_Start_V2.35.3_UPDATE.zip\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2353-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
