name: TEMP P07-M05 UX16 final anonymous main readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux16-identity-dev-proof.yml
permissions:
  contents: read
jobs:
  final-readback:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux16-identity-dev-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Anonymous exact main bytes and reviewed installed-build pin
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          root="$RUNNER_TEMP/m05-ux16-final-main"
          mkdir -m 700 "$root"
          curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 60 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh' -o "$root/toolbox.sh"
          test "$(git hash-object "$root/toolbox.sh")" = 2b021ab7df93a339fd3cf9885a25ac9b91dc3768
          bash -n "$root/toolbox.sh"
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-ux16-runtime-identity-catalog"' "$root/toolbox.sh"
          grep -Fqx 'M05_PREVIOUS_OFFICIAL_BUILD="0.1.0-m05-ux15-rc4-runtime-compat"' "$root/toolbox.sh"
          grep -Fqx 'M05_BUNDLE_SHA256="5445a006327969ca9c3987680ae808def4a4991bd833a0ed176eeb5ab671c095"' "$root/toolbox.sh"
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc4"' "$root/toolbox.sh"
          grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release146"' "$root/toolbox.sh"
          curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 60 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-runtime-identities.json' -o "$root/catalog.json"
          test "$(git hash-object "$root/catalog.json")" = 83c3947e354005873408203975793f46b237bae7
          printf '%s  %s\n' 'ecef49d59325fec0d0eac8e56adada1bb77a748156f94afa64ed6ad6b12bef8a' "$root/catalog.json" | sha256sum -c -
          python3 -B - "$root/catalog.json" <<'PY'
          import json, pathlib, sys
          doc=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert doc["schema"]=="vf.p07.runtime-identities.v1" and len(doc["records"])==8
          assert any(r["build"]=="0.1.0-m05-ux16-runtime-identity-catalog" and r["source_sha"]=="908dfabaac86cf61eb8cf22c56b44a24cc7231ff" and r["artifact_sha256"]=="5445a006327969ca9c3987680ae808def4a4991bd833a0ed176eeb5ab671c095" for r in doc["records"])
          print("P07_M05_FINAL_ANONYMOUS_MAIN_ISSUED_CATALOG=PASS")
          PY
          echo P07_M05_FINAL_ANONYMOUS_MAIN_EXACT_TESTED_BYTES=PASS
      - name: Clean readback bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/m05-ux16-final-main"
          test ! -e "$RUNNER_TEMP/m05-ux16-final-main"
          echo P07_M05_FINAL_READBACK_CLEAN=PASS
