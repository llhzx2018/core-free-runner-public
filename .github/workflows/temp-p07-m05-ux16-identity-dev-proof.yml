name: TEMP P07 M05 UX16 runtime identity DEV proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux16-identity-dev-proof.yml
permissions:
  contents: read
jobs:
  p07-m05-identity:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux16-identity-dev-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: 'c54f92ca845921e87b2d26cc87e5f54fe1f36978'
      TARGET_TREE: 'fb4effd3035682e4e320675cde72f1abb48c15b7'
    steps:
      - name: Exact public installer and reusable proof utilities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'ceefc3cec3725916a0d9d482a150a3c7c3733bf0'
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Exact transient product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          path: transient-p07
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact transient GOV-DOC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '4223ce80b2cf7945cff485ba9ff598d1ceef6a3b'
          path: transient-gov
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact Git architecture module scope and public authority gates only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test "$(git -C ../transient-gov rev-parse HEAD)" = "4223ce80b2cf7945cff485ba9ff598d1ceef6a3b"
          base=51520a4422c87888f79e349b79914ca1f64826ef
          test "$(git merge-base "$base" HEAD)" = "$base"
          test -z "$(git status --porcelain)"
          test "$(git diff --name-only eec6fdb3bd50bdbe26e4ee492a74c07debb417b9 HEAD)" = "docs/ux-reviews/p07-m05-general-runtime-identity-20261126.json"
          echo P07_RUNTIME_BYTES_UNCHANGED=PASS
          log="$(mktemp "$RUNNER_TEMP/p07-gate.XXXXXX")"
          trap 'rm -f -- "$log"' EXIT
          failed=0
          gate() {
            local name="$1"
            shift
            if "$@" >"$log" 2>&1; then
              echo "P07_GATE=$name:PASS"
            else
              echo "P07_GATE=$name:FAIL"
              grep -E '^(PROJECT_ARCHITECTURE=BLOCKED:|GOV_DOC_PUBLIC_AUTHORITY_CI=BLOCKED|FAIL:|ERROR:|P07_MODULE_SCOPE=|P07_TERMINAL_UX)' "$log" | cut -c1-200 || true
              failed=1
            fi
          }
          gate module_scope python3 -B scripts/check_p07_modules.py --module P07-M05 --base-ref "$base" --affected P07-M05 --shared-reason "M05 read-only installed identity interface; no changes to other module installed bytes" --ux-evidence-file docs/ux-reviews/p07-m05-general-runtime-identity-20261126.json
          gate terminal_contract python3 -B scripts/check_p07_terminal_ux.py --base-ref "$base"
          gate terminal_behavior python3 -B -m unittest discover -s tests -p test_p07_m05_vultr_terminal_ux.py -q
          test "$failed" = 0
          echo P07_MISSING_UX_EVIDENCE_GATE=PASS
      - name: Always erase temporary private source
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_TRANSIENT_CLEAN=PASS
