name: TEMP P07 M05 UX16 runtime identity DEV proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux16-identity-dev-proof.yml
permissions:
  contents: read
jobs:
  p07-m05-identity:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux16-identity-dev-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_REPO: 'llhzx2018/vf-server-ops'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: '1a3a9a41938723fbf1c6c912d33894292097607d'
      TARGET_TREE: 'e26baf7235819a6cc99b115d982e05c13e99c96d'
    steps:
      - name: Exact public installer and reusable proof utilities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'ceefc3cec3725916a0d9d482a150a3c7c3733bf0'
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Exact transient product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          path: transient-p07
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Product exact identity and affected regression suites
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 700 "$RUNNER_TEMP/m05-identity"
          cd transient-p07
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test -z "$(git status --porcelain)"
          echo P07_EXACT_SOURCE_TREE=PASS
          failed=0
          for suite in test_p07_m05_runtime_identity.py test_p07_m05_isolated_module.py test_p07_m05_installed_root_guard.py test_p07_m05_dirty_host_guard.py test_p07_m05_trial_cache_guard.py test_p07_m05_host_write_gate.py; do
            log="$RUNNER_TEMP/m05-identity/$suite.log"
            if python3 -B -m unittest discover -s tests -p "$suite" >"$log" 2>&1; then
              grep -Eq '^Ran [1-9][0-9]* tests?' "$log"
              grep -Fxq OK "$log"
              grep -E '^Ran [0-9]+ tests?' "$log"
              echo "P07_SUITE=PASS:$suite"
            else
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$log" | cut -c1-150 || true
              echo "P07_SUITE=FAIL:$suite"
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Genuine published packages via anonymous HTTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/m05-identity"
          test -d "$root" || mkdir -m 700 "$root"
          unset GH_TOKEN GITHUB_TOKEN
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          asset() {
            curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 90 "$base/$1/$2" -o "$root/$3"
            printf '%s  %s\n' "$4" "$root/$3" | sha256sum -c - >/dev/null
          }
          asset p07-all-ux-v0.1.0-20261118 P07-M01-0.1.0-ux3.zip m01.zip 13e79e7c7a4f1170c74da24e783804c3c2bda06fe6c46b768497694e826b3ed7
          asset p07-all-ux-v0.1.0-20261118 P07-M02-2.1.1-ux3.zip m02.zip 88da5b8219fb7e04d606eb3de998d872747cb05153bdd93c7351b46f957164b4
          asset p07-all-ux-v0.1.0-20261118 P07-M04-0.1.0-ux5.zip m04.zip 2ff45c263f930e258a3c323b6c009e0973531d3f90a2e432a66aed704c9baa7d
          asset p07-m03-v0.1.0-release146-20261122 P07-M03-0.1.0-release146.zip stable.zip 7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321
          asset p07-m03-v0.1.0-release147-rc4-maintenance-20261125 P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip rc4.zip 85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238
          asset p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126 P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip ux15.zip fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99
          echo P07_SIX_ISSUED_ZIP_SHA256=PASS
      - name: Actual issued identity derivation and isolated real installed tree
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/m05-identity"
          cat > "$root/proof.py" <<'PY'
          import hashlib, importlib.util, json, os, pathlib, subprocess, sys, zipfile
          from unittest import mock
          root=pathlib.Path(sys.argv[1]); repo=pathlib.Path.cwd(); product=repo/"transient-p07"
          sys.path[:0]=[str(product/"lib"),str(product/"tests"),str(product/"scripts")]
          import m05_runtime_identity as identity
          from build_p07_runtime_identity import build_record
          from build_p07_m05_bundle import build_bundle, BUILD_ID
          from test_p07_m05_dirty_host_guard import FakeProbe
          import m05_environment_guard as guard
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          opt=root/"isolated-opt"; opt.mkdir()
          rows=[]
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
              return mod
          three=load("three",repo/"installers/p07-three-ux-atomic.py")
          five=load("five",repo/"installers/p07-m05-atomic.py")
          three.BASE=opt/"vfops-modules";five.BASE=three.BASE
          # Test-only records: exact archive bytes, issuer commit provenance for public
          # artifacts and exact verified private product source for UX15/RC4.
          # Never publish these records or label them as a released catalog.
          def module_record(slot,archive,source):
              with zipfile.ZipFile(archive) as z:
                  markers=[n for n in z.namelist() if n.endswith("/MODULE_MANIFEST.json")]
                  assert len(markers)==1
                  marker=markers[0];meta=json.loads(z.read(marker))
                  build=meta["module_build_id"];version=z.read(marker.removesuffix("MODULE_MANIFEST.json")+"VERSION").decode("ascii").strip()
              row=build_record(archive,sha(archive),path=f"vfops-modules/{slot}/releases/{build}",build=build,version=version,marker="MODULE_MANIFEST.json",archive_marker=marker,roles=["current"],source_sha=source)
              rows.append(row)
              return build
          for slot in ("m01","m02","m04"):
              archive=root/(slot+".zip")
              build=module_record(slot,archive,"cadbe0b84b9d39a70df7f6863ef6967449f90886")
              with mock.patch.object(three.os,"geteuid",return_value=0):
                  three.install(slot,archive,sha(archive))
              assert (three.BASE/slot/"current").resolve().name==build
          print("P07_M01_M02_M04_ISSUED_INSTALLED=PASS",flush=True)
          old=module_record("m05",root/"ux15.zip","51520a4422c87888f79e349b79914ca1f64826ef")
          with mock.patch.object(five.os,"geteuid",return_value=0):
              assert five.install(root/"ux15.zip",sha(root/"ux15.zip"))==old
          for label,build,source,path in (
              ("stable","0.1.0-release146","e77ed2fb85e325959b37dab5f0a5ec846817dc5d","vf-server-ops"),
              ("rc4","0.1.0-release147-rc4","54c46dfa862a5c4a39020c1bd80a129bd992077b","vf-server-ops-ownertrial147rc3")):
              archive=root/(label+".zip")
              with zipfile.ZipFile(archive) as z:
                  markers=[n for n in z.namelist() if n.endswith("/RUNTIME.gitblob")]
                  bases=[n for n in z.namelist() if n.endswith(".tar.gz")]
                  assert len(markers)==len(bases)==1
                  row=build_record(archive,sha(archive),path=path,build=build,version="0.1.0",marker=".runtime-manifest.gitblob",archive_marker=markers[0],base_tar=bases[0],roles=["current"],source_sha=source)
                  rows.append(row)
                  dst=root/label;dst.mkdir()
                  # Exact pinned official zip: reject all unsafe member names before extraction.
                  for n in z.namelist():
                      p=pathlib.PurePosixPath(n);assert not p.is_absolute() and ".." not in p.parts
                  z.extractall(dst)
              link=root/"links"/label;link.parent.mkdir(exist_ok=True)
              current=opt/path
              env={**os.environ,"P07_ALLOW_NONROOT":"1","P07_NO_EXEC":"1","P07_INSTALL_DIR":str(current),"P07_PREVIOUS_DIR":str(opt/(path+".previous")),"P07_BIN_LINK":str(link),"P07_PUBLIC_ROOT":dst.as_uri()}
              call=subprocess.run(["bash",str(dst/"installers/p07-final.sh")],env=env,cwd=root,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=100)
              assert call.returncode==0,"P07_ISSUED_M03_SANDBOX_INSTALL_FAILED_"+label
              assert (current/"BUILD_ID").read_text().strip()==build
          print("P07_M03_STABLE_RC4_ISSUED_INSTALLED=PASS",flush=True)
          def snapshot(p):
              return {x.relative_to(p).as_posix():(x.lstat().st_mode,os.readlink(x) if x.is_symlink() else sha(x) if x.is_file() else None) for x in p.rglob("*")}
          def session():
              parsed=identity.parse_catalog(json.dumps({"schema":identity.SCHEMA,"records":rows}).encode())
              return identity.CatalogSession(lambda:parsed,opt)
          before=snapshot(opt)
          s=session()
          for entry in ("vfops-modules","vf-server-ops","vf-server-ops-ownertrial147rc3"):
              assert s.classify(entry) is True,"P07_ISSUED_CATALOG_REJECTED_"+entry
          entries=["vfops-modules","vf-server-ops","vf-server-ops-ownertrial147rc3"]
          assert guard.inspect(FakeProbe(children={"/opt":entries}),identity_session=s).status=="CLEAN"
          for p in ("/var/lib/mysql","/home/clp","/var/lib/docker"):
              assert guard.inspect(FakeProbe(paths=(p,),children={"/opt":entries}),identity_session=s).status=="OCCUPIED"
          assert snapshot(opt)==before
          print("P07_ISSUED_CATALOG_CROSS_MODULE_READ_ONLY=PASS",flush=True)
          a=root/"candidate.zip";b=root/"candidate-repeat.zip"
          build_bundle(a,product);build_bundle(b,product)
          assert a.read_bytes()==b.read_bytes()
          assert module_record("m05",a,os.environ["TARGET_SHA"])==BUILD_ID
          unaffected={str(p):snapshot(p) for p in (three.BASE/"m01",three.BASE/"m02",three.BASE/"m04",opt/"vf-server-ops",opt/"vf-server-ops-ownertrial147rc3")}
          with mock.patch.object(five.os,"geteuid",return_value=0):
              assert five.install(a,sha(a))==BUILD_ID
              assert five.install(a,sha(a))==BUILD_ID
              assert session().classify("vfops-modules") is True
              try:five.install(a,"0"*64)
              except five.Unsafe:pass
              else:raise AssertionError("BAD_PACKAGE_ACCEPTED")
              assert five.rollback(old,"P07-M05:"+old)==old
          assert all(snapshot(pathlib.Path(p))==v for p,v in unaffected.items())
          assert session().classify("vfops-modules") is True
          print("P07_M05_UX16_DETERMINISTIC_ATOMIC_ROLLBACK_OTHER_MODULES=PASS",flush=True)
          print("P07_M05_DEV_CANDIDATE_SHA256="+sha(a),flush=True)
          PY
          if ! python3 -B "$root/proof.py" "$root" >"$root/proof.log" 2>&1; then
            grep -E '^P07_|^AssertionError:|^ValueError:|^TypeError:|^KeyError:|^AttributeError:' "$root/proof.log" | cut -c1-180 || true
            exit 22
          fi
          grep -E '^P07_' "$root/proof.log"
      - name: Always erase temporary private source and sandbox
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$RUNNER_TEMP/m05-identity"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$RUNNER_TEMP/m05-identity"
          echo P07_TRANSIENT_CLEAN=PASS
