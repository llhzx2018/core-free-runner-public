name: TEMP P07-M05 UX16 exact public entry and catalog upgrade
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux16-identity-dev-proof.yml
permissions:
  contents: read
jobs:
  actual-entry:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux16-identity-dev-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Genuine official UX15 and exact reviewed UX16 public entry and catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          test "$RUNNER_ENVIRONMENT" = github-hosted
          root="$RUNNER_TEMP/p07-m05-ux16-entry"
          mkdir -m 700 "$root"
          fetch() { curl -q --proto '=https' --tlsv1.2 -fsSL --max-time 100 "$@"; }
          fetch 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/b0f72cf310e7e58fa4411be534333ebff72ece1e/installers/p07-toolbox.sh' -o "$root/toolbox.sh"
          fetch 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/35e3fbcb1e8c40042558f9f163e4215570074793/installers/p07-m05-atomic.py' -o "$root/atomic.py"
          fetch 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126/P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip' -o "$root/old.zip"
          test "$(git hash-object "$root/toolbox.sh")" = 2b021ab7df93a339fd3cf9885a25ac9b91dc3768
          test "$(git hash-object "$root/atomic.py")" = 17e47121ac27f31162d93a72aa0b1dbea602ea01
          printf '%s  %s\n' 'fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99' "$root/old.zip" | sha256sum -c -
          fetch 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/b0f72cf310e7e58fa4411be534333ebff72ece1e/installers/p07-runtime-identities.json' -o "$root/catalog.json"
          printf '%s  %s\n' 'ecef49d59325fec0d0eac8e56adada1bb77a748156f94afa64ed6ad6b12bef8a' "$root/catalog.json" | sha256sum -c -
          fetch 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/54f1d300441b1b29921e08ba27d8cc1f6e05e729/installers/p07-toolbox.sh' -o "$root/baseline.sh"
          test "$(git hash-object "$root/baseline.sh")" = 44e582d516b84bf81215c8416c58c7b8f75af720
          python3 -B - "$root" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          a=(root/"baseline.sh").read_text();b=(root/"toolbox.sh").read_text()
          edits=[
              ('M05_BUILD_EXPECTED="0.1.0-m05-ux15-rc4-runtime-compat"','M05_BUILD_EXPECTED="0.1.0-m05-ux16-runtime-identity-catalog"'),
              ('M05_PREVIOUS_OFFICIAL_BUILD="0.1.0-m05-ux14-verified-pycache"','M05_PREVIOUS_OFFICIAL_BUILD="0.1.0-m05-ux15-rc4-runtime-compat"'),
              ('M05_UPGRADE_FROM20="0.1.0-m05-ux13-provider-neutral"','M05_UPGRADE_FROM20="0.1.0-m05-ux13-provider-neutral"\nM05_UPGRADE_FROM21="0.1.0-m05-ux14-verified-pycache"'),
              ('|"releases/$M05_UPGRADE_FROM20")','|"releases/$M05_UPGRADE_FROM20"|"releases/$M05_UPGRADE_FROM21")'),
              ('p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126/P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip','p07-m05-v0.1.0-ux16-runtime-identity-catalog-20261126/P07-M05-0.1.0-m05-ux16-runtime-identity-catalog.zip'),
              ('fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99','5445a006327969ca9c3987680ae808def4a4991bd833a0ed176eeb5ab671c095'),
          ]
          for x,y in edits:
              assert a.count(x)==1
              a=a.replace(x,y)
          assert a==b
          print("P07_M05_ONLY_PIN_DELTA_OTHER_FOUR_UNCHANGED=PASS")
          PY
          echo P07_M05_REAL_ENTRY_EXACT_INPUTS=PASS
      - name: Execute selected slot 5 real anonymous download only; no initialization
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-m05-ux16-entry"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/vfops-modules && test ! -L /opt/vfops-modules
          touch "$root/owns-sandbox"
          sudo -n mkdir -m 755 /opt/vfops-modules
          for slot in m01 m02 m03 m04; do
            sudo -n mkdir -m 755 "/opt/vfops-modules/$slot"
            printf '%s\n' "untouched-$slot" | sudo -n tee "/opt/vfops-modules/$slot/sentinel" >/dev/null
          done
          sudo -n python3 -B "$root/atomic.py" install "$root/old.zip" fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99
          test "$(sudo -n readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-ux15-rc4-runtime-compat
          cat > "$root/m05_entry_probe.py" <<'PY'
          import errno,os,pathlib,pty,select,signal,subprocess,sys,time
          script=pathlib.Path(sys.argv[1])
          master,slave=pty.openpty()
          proc=subprocess.Popen(["sudo","-n","env","NO_COLOR=1","TERM=dumb","PYTHONDONTWRITEBYTECODE=1","bash",str(script)],stdin=slave,stdout=slave,stderr=slave,start_new_session=True)
          os.close(slave)
          buf=b""
          phase=0
          patterns=[("请选择 [0-5]：","5\n"),("确认仅升级 P07-M05 新服务器初始化？[y/N]：","y\n"),("返回工具箱","0\n"),("请选择 [0-5]：","0\n")]
          deadline=time.monotonic()+150
          try:
              while time.monotonic()<deadline:
                  if proc.poll() is not None and not select.select([master],[],[],0)[0]: break
                  if not select.select([master],[],[],0.2)[0]: continue
                  try: data=os.read(master,65536)
                  except OSError as e:
                      if e.errno==errno.EIO: break
                      raise
                  if not data: break
                  buf+=data
                  if phase<len(patterns) and patterns[phase][0].encode() in buf:
                      print("P07_M05_MENU_PHASE="+str(phase+1),flush=True)
                      os.write(master,patterns[phase][1].encode())
                      phase+=1
                      buf=b""
                  if len(buf)>200000: raise AssertionError("EXCESSIVE_OUTPUT")
              assert proc.poll() is not None and proc.returncode==0 and phase==4, ("M05_TTY_STOP",phase,proc.poll(),buf[-300:].decode("utf8","replace"))
          finally:
              if proc.poll() is None:
                  os.killpg(proc.pid,signal.SIGKILL)
                  proc.wait(timeout=5)
              os.close(master)
          PY
          python3 -B "$root/m05_entry_probe.py" "$root/toolbox.sh"
          test "$(sudo -n readlink /opt/vfops-modules/m05/current)" = releases/0.1.0-m05-ux16-runtime-identity-catalog
          sudo -n bash /opt/vfops-modules/m05/current/bin/vfops-init-entry --version | grep -Fx 'P07-M05 新服务器初始化 0.1.0-m05-ux16-runtime-identity-catalog'
          sudo -n bash "$root/toolbox.sh" --modules | grep -F '0.1.0-m05-ux16-runtime-identity-catalog'
          for slot in m01 m02 m03 m04; do
            test "$(sudo -n cat "/opt/vfops-modules/$slot/sentinel")" = "untouched-$slot"
            test "$(sudo -n find "/opt/vfops-modules/$slot" -mindepth 1 -maxdepth 1 | wc -l)" = 1
          done
          test -d /opt/vfops-modules/m05/releases/0.1.0-m05-ux15-rc4-runtime-compat
          sudo -n python3 -B - "$root/catalog.json" <<'PY'
          import sys,pathlib
          sys.path.insert(0,"/opt/vfops-modules/m05/current/lib")
          from m05_runtime_identity import parse_catalog
          rows=parse_catalog(pathlib.Path(sys.argv[1]).read_bytes())
          assert len(rows)==8
          assert any(r.build=="0.1.0-m05-ux16-runtime-identity-catalog" and r.source_sha=="908dfabaac86cf61eb8cf22c56b44a24cc7231ff" for r in rows)
          print("P07_M05_INSTALLED_RUNTIME_READS_EXACT_ISSUED_CATALOG=PASS")
          PY
          echo P07_M05_ACTUAL_PUBLIC_ENTRY_UX15_TO_UX16=PASS
          echo P07_M05_OLD_RELEASE_AND_OTHER_FOUR_PRESERVED=PASS
      - name: Always clean only verified disposable sandbox
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-m05-ux16-entry"
          if [[ -f "$root/owns-sandbox" && "$RUNNER_ENVIRONMENT" = github-hosted ]]; then
            sudo -n rm -rf -- /opt/vfops-modules
          fi
          rm -rf -- "$root"
          echo P07_M05_LIVE_ENTRY_SANDBOX_CLEAN=PASS
