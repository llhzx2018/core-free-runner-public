name: TEMP P07 M05 UX16 issued anonymous artifact readback
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux16-identity-dev-proof.yml
permissions:
  contents: read
jobs:
  anonymous-issued:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux16-identity-dev-proof-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Anonymous published assets and exact public identity catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          root="$RUNNER_TEMP/p07-m05-ux16-anonymous"
          mkdir -m 700 "$root"
          trap 'rm -rf -- "$root"' EXIT
          cd "$root"
          url=https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux16-runtime-identity-catalog-20261126
          for name in P07-M05-0.1.0-m05-ux16-runtime-identity-catalog.zip P07-M05-UX16-FORMAL-RELEASE.json p07-runtime-identities.json SHA256SUMS; do
            curl -q --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 90 "$url/$name" -o "$name"
          done
          printf '%s  %s\n' '40106807b3c039378b51a0ef4d9c4dd452ff1b80c258e2281d064c9180fe4c46' SHA256SUMS | sha256sum -c -
          sha256sum -c SHA256SUMS
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("p07-runtime-identities.json")
          raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="ecef49d59325fec0d0eac8e56adada1bb77a748156f94afa64ed6ad6b12bef8a"
          doc=json.loads(raw)
          assert doc["schema"]=="vf.p07.runtime-identities.v1" and len(doc["records"])==8
          receipt=json.loads(pathlib.Path("P07-M05-UX16-FORMAL-RELEASE.json").read_bytes())
          assert receipt["source_commit"]=="908dfabaac86cf61eb8cf22c56b44a24cc7231ff"
          assert receipt["source_tree"]=="fb4effd3035682e4e320675cde72f1abb48c15b7"
          assert receipt["archive_sha256"]=="5445a006327969ca9c3987680ae808def4a4991bd833a0ed176eeb5ab671c095"
          assert receipt["catalog_sha256"]==hashlib.sha256(raw).hexdigest()
          assert any(r["build"]=="0.1.0-m05-ux16-runtime-identity-catalog" and r["source_sha"]==receipt["source_commit"] and r["artifact_sha256"]==receipt["archive_sha256"] for r in doc["records"])
          print("P07_ISSUED_ANONYMOUS_BYTES=PASS")
          print("P07_CATALOG_PUBLIC_BYTES_BEGIN")
          print(raw.decode("ascii"),end="")
          print("P07_CATALOG_PUBLIC_BYTES_END")
          PY
      - name: Cleanup verify
        if: always()
        shell: bash
        run: |
          test ! -e "$RUNNER_TEMP/p07-m05-ux16-anonymous"
          echo P07_ANONYMOUS_CLEANUP=PASS
