name: P01 Feedback Visual Gate V4

on:
  push:
    branches: [task/p01-feedback-visual-gate-20260831]
    paths:
      - .github/workflows/p01-feedback-visual-gate-v4-20260831.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE: af1d0518ece621d560491b230aae62f6ddd19fe7
      TREE: f63a5c45c0c4e511be1eb3ab2c505e0e4b2486c2
      BASE_SOURCE: 696a20f8754396e842f2ff905c0f1dde3911fcfc
      CSS_BLOB: 5cd06201e2daf93c28d0e5c52cf601177e7d46f1
      ROOT: /tmp/p01-feedback-v4
      PORT: '18352'
      EVID: /tmp/p01-feedback-v4-ui
      COOKIE: /tmp/p01-feedback-v4.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          test "$(git -C product rev-parse HEAD:src/assets/workspace-v228.css)" = "$CSS_BLOB"
          test "$(cat product/VERSION)" = '2.34.0'
          test "$(git -C product diff --name-only "$BASE_SOURCE"..HEAD)" = 'src/assets/workspace-v228.css'
          git -C product diff --check "$BASE_SOURCE"..HEAD
          echo P01_FEEDBACK_SOURCE=PASS

      - name: Fresh runtime fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-feedback-v4-server.log 2>&1 & echo $! >/tmp/p01-feedback-v4.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-feedback-v4-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-feedback-v4-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=Feedback Gate V4' \
            --data-urlencode 'admin_password=P01Feedback!Visual' \
            --data-urlencode 'admin_password_confirm=P01Feedback!Visual' \
            -o /tmp/p01-feedback-v4-setup-post.html
          cat >/tmp/p01-feedback-v4-seed.php <<'PHP'
          <?php
          require '/tmp/p01-feedback-v4/app/bootstrap.php';
          require_once '/tmp/p01-feedback-v4/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $channel=$r->createCategory(['name'=>'频道','description'=>'','is_private'=>false]);
          for($i=1;$i<=4;$i++){ $x=$r->saveLink(null,['category_id'=>$channel,'title'=>'Feedback Channel '.$i,'url'=>'https://youtube.com/@feedback-v4-'.$i,'description'=>'feedback test channel','tags'=>'频道','is_private'=>true],'manual'); $s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','surface_note'=>'feedback','background_friendly'=>true]); }
          echo "P01_FEEDBACK_V4_SEED=PASS\n";
          PHP
          php /tmp/p01-feedback-v4-seed.php | grep -Fx P01_FEEDBACK_V4_SEED=PASS
          echo P01_FEEDBACK_V4_RUNTIME=PASS

      - name: Chromium feedback surface coherence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-feedback-v4-playwright
          cd /tmp/p01-feedback-v4-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          const base='http://127.0.0.1:18352',evid=process.env.EVID;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post(base+'/api.php?action=login',{data:{password:'P01Feedback!Visual'}});
            if(!login.ok()||!(await login.json()).ok) throw new Error('login failed');
            const page=await context.newPage(),errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const inspectToast=async(sel)=>page.locator(sel).evaluate(el=>{const r=el.getBoundingClientRect(),before=getComputedStyle(el,'::before');return {top:r.top,left:r.left,right:r.right,width:r.width,height:r.height,bg:getComputedStyle(el).backgroundColor,color:getComputedStyle(el).color,borderLeft:getComputedStyle(el).borderLeftColor,borderLeftWidth:getComputedStyle(el).borderLeftWidth,before:before.content,beforeColor:before.color,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});

            await page.goto(base+'/channels.php',{waitUntil:'networkidle'}); await page.waitForTimeout(120);
            const topbarBottom=await page.locator('.vf-app-topbar.vf-domain-subbar').evaluate(el=>el.getBoundingClientRect().bottom);
            const domainBottom=await page.locator('.vf-global-domain-nav').evaluate(el=>el.getBoundingClientRect().bottom);
            await page.locator('[data-favorite-id]').first().click({force:true});
            const ok=page.locator('.vf-workspace-toast.show:not(.error)').first(); await ok.waitFor();
            const o=await inspectToast('.vf-workspace-toast.show:not(.error)');
            if(o.top<topbarBottom+8||o.borderLeftWidth!=='3px'||!o.before.includes('✓')||o.width<220||o.overflow>1) throw new Error('desktop success toast '+JSON.stringify({topbarBottom,domainBottom,o}));
            await page.screenshot({path:evid+'/desktop-success.png'});

            await page.route('**/workspace-action.php',route=>route.fulfill({status:500,contentType:'application/json',body:JSON.stringify({ok:false,error:'模拟失败提示'})}),{times:1});
            await page.locator('[data-favorite-id]').nth(1).click({force:true});
            const err=page.locator('.vf-workspace-toast.show.error').first(); await err.waitFor();
            const er=await inspectToast('.vf-workspace-toast.show.error');
            if(er.top<topbarBottom+8||er.borderLeftWidth!=='3px'||!er.before.includes('!')||er.borderLeft===o.borderLeft||er.bg===o.bg||er.overflow>1) throw new Error('desktop error toast '+JSON.stringify({o,er}));
            await page.screenshot({path:evid+'/desktop-success-error.png'});

            await page.evaluate(()=>document.documentElement.dataset.theme='dark'); await page.waitForTimeout(180);
            const dark=await inspectToast('.vf-workspace-toast.show.error');
            if(dark.bg===er.bg||dark.overflow>1) throw new Error('dark feedback did not adapt '+JSON.stringify({er,dark}));
            await page.screenshot({path:evid+'/desktop-dark-error.png'});

            await page.goto(base+'/channels.php?q=definitely-no-result',{waitUntil:'networkidle'}); await page.waitForTimeout(120);
            const empty=await page.locator('.vf-workspace-empty').evaluate(el=>{const r=el.getBoundingClientRect(),p=el.querySelector('p').getBoundingClientRect();return {height:r.height,pWidth:p.width,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            if(empty.height<180||empty.pWidth>430||empty.overflow>1) throw new Error('desktop empty state '+JSON.stringify(empty));
            await page.screenshot({path:evid+'/desktop-empty.png'});

            await page.setViewportSize({width:390,height:844}); await page.goto(base+'/channels.php',{waitUntil:'networkidle'}); await page.waitForTimeout(120);
            const mobileDomainBottom=await page.locator('.vf-global-domain-nav').evaluate(el=>el.getBoundingClientRect().bottom);
            await page.locator('[data-open-add].vf-mobile-command-add').click();
            const add=page.locator('[data-panel="add"]:not([hidden])'); await add.waitFor();
            const addHeaderBottom=await add.locator('header').first().evaluate(el=>el.getBoundingClientRect().bottom);
            await add.locator('input[name="url"]').fill('https://youtube.com/@feedback-mobile-created-v4');
            await add.locator('input[name="title"]').fill('Mobile feedback created');
            await add.locator('[data-add-continue]').click();
            const mok=page.locator('.vf-workspace-toast.show:not(.error)').first(); await mok.waitFor();
            const mo=await inspectToast('.vf-workspace-toast.show:not(.error)');
            if(mo.top<addHeaderBottom+8||mo.left<9||mo.right>381||mo.overflow>1) throw new Error('mobile overlay toast '+JSON.stringify({mobileDomainBottom,addHeaderBottom,mo}));
            await page.screenshot({path:evid+'/mobile-success-390.png'});

            await page.goto(base+'/channels.php?q=definitely-no-result',{waitUntil:'networkidle'}); await page.waitForTimeout(120);
            const me=await page.locator('.vf-workspace-empty').evaluate(el=>({height:el.getBoundingClientRect().height,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
            if(me.height<150||me.overflow>1) throw new Error('mobile empty '+JSON.stringify(me));
            await page.screenshot({path:evid+'/mobile-empty-390.png'});

            if(errors.length) throw new Error('page errors '+errors.join(' | '));
            fs.writeFileSync(evid+'/metrics.json',JSON.stringify({topbarBottom,domainBottom,success:o,error:er,dark,empty,mobileDomainBottom,addHeaderBottom,mobile:mo,mobileEmpty:me},null,2));
            fs.writeFileSync(evid+'/verdict.txt','P01_FEEDBACK_VISUAL=PASS\nSOURCE=af1d0518ece621d560491b230aae62f6ddd19fe7\n');
            await browser.close(); console.log('P01_FEEDBACK_UI=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs 2>&1 | tee "$EVID/result.txt"
          grep -Fx P01_FEEDBACK_UI=PASS "$EVID/result.txt"

      - name: Regression baseline and data integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-feedback-v4-baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-feedback-v4-baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-feedback-v4-baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-feedback-v4-baseline.txt
          php -r 'require "/tmp/p01-feedback-v4/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "P01_FEEDBACK_V4_SQLITE=PASS\n";' | grep -Fx P01_FEEDBACK_V4_SQLITE=PASS
          echo P01_FEEDBACK_V4_REGRESSION=PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-feedback-visual-v4-${{ github.run_id }}
          path: /tmp/p01-feedback-v4-ui
          if-no-files-found: error
          retention-days: 30

      - name: Verdict
        run: |
          echo P01_FEEDBACK_SOURCE=$SOURCE
          echo P01_FEEDBACK_TREE=$TREE
          echo P01_FEEDBACK_GATE=PASS
          echo PRODUCT_FILES_CHANGED=1
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO

      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-feedback-v4.pid 2>/dev/null)" 2>/dev/null || true
