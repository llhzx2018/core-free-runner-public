name: P05 Server Update Bootstrap Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-update-server-bootstrap-gate.yml'

permissions:
  contents: read

jobs:
  exact-bootstrap:
    if: github.head_ref == 'tmp/p05-update-server-bootstrap-gate-20260902'
    runs-on: ubuntu-24.04
    env:
      P05_BASE: bfd6ffb2f69069a0a7c8da13b30cca1e03a5af31
      P05_CANDIDATE: 4e3cb98c3dfa297078d2549418b12d35b3adb4f9
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 4e3cb98c3dfa297078d2549418b12d35b3adb4f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Bind exact source and five-file scope
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          git cat-file -e "$P05_BASE^{commit}"
          test "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" | sort | tr '\n' ' ')" = '.env.example install-cloudpanel-php.sh install-cloudpanel.sh php/bin/init-update-service.php tests/contract/update-service-server-bootstrap.test.ts '
          git diff --check "$P05_BASE" "$P05_CANDIDATE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          echo P05_UPDATE_SERVER_BOOTSTRAP_SCOPE=PASS

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies
        working-directory: p05
        run: npm ci

      - name: Prepare engineering database
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run migrate
          npm run verify:schema

      - name: Full Product engineering regression
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run security:gate
          echo P05_UPDATE_SERVER_BOOTSTRAP_ENGINEERING=PASS

      - name: Real server-side bootstrap against live private update authority
        working-directory: p05
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          INSTANCE_ID='0123456789abcdef0123456789abcdef'
          STORAGE="../.vfseo-data-${INSTANCE_ID}"
          ENV_PATH="${STORAGE}/config/runtime.env"
          trap 'rm -f VF_INSTALL_INSTANCE.json; rm -rf "../.vfseo-data-0123456789abcdef0123456789abcdef"' EXIT

          php -r '
            require_once "php/src/SiteInstance.php";
            require_once "php/src/RuntimePaths.php";
            $root = getcwd();
            $id = "0123456789abcdef0123456789abcdef";
            $paths = VfSeo\\PhpRuntime\\RuntimePaths::newInstancePaths($root, $id);
            foreach ([$paths["storageRoot"], $paths["configDir"], $paths["dataDir"], $paths["backupDir"]] as $dir) {
              if (!is_dir($dir) && !mkdir($dir, 0700, true) && !is_dir($dir)) exit(2);
              chmod($dir, 0700);
            }
            file_put_contents($paths["runtimeEnv"], "APP_ENV=development\nVF_DATABASE_PROVIDER=sqlite\nVF_TRUST_PROXY=true\nVF_SECURE_COOKIES=false\nVF_REQUIRE_HTTPS=false\nVF_DISPLAY_TIMEZONE=Asia/Shanghai\nVF_LOCALE=zh-CN\n", LOCK_EX);
            chmod($paths["runtimeEnv"], 0600);
            VfSeo\\PhpRuntime\\SiteInstance::writeInstalled($root, $id);
          '

          php php/bin/migrate.php >/dev/null
          INIT_OUTPUT="$(php php/bin/init-update-service.php)"
          grep -Fqx 'P05_UPDATE_SERVICE_INIT=PASS' <<<"$INIT_OUTPUT"
          grep -Fqx 'P05_UPDATE_SERVICE_AUTHORITY=CORE_UPDATES_V1' <<<"$INIT_OUTPUT"
          grep -Fqx 'P05_UPDATE_SERVICE_STORAGE=POINTER_BOUND_PRIVATE_RUNTIME_ENV' <<<"$INIT_OUTPUT"

          test -f "$ENV_PATH"
          test "$(stat -c '%a' "$ENV_PATH")" = '600'
          VF_RUNTIME_ENV_PATH="$ENV_PATH" php -r '
            $path = getenv("VF_RUNTIME_ENV_PATH");
            $secret = getenv("VF_PRIVATE_READ_TOKEN");
            $lines = file($path, FILE_IGNORE_NEW_LINES);
            if (!is_array($lines) || !is_string($secret) || $secret === "") exit(3);
            $found = [];
            foreach ($lines as $line) {
              if (!str_starts_with($line, "VF_PRIVATE_READ_TOKEN=")) continue;
              $found[] = substr($line, strlen("VF_PRIVATE_READ_TOKEN="));
            }
            if (count($found) !== 1 || !hash_equals($secret, $found[0])) exit(4);
          '

          ! grep -Fq "$VF_PRIVATE_READ_TOKEN" <<<"$INIT_OUTPUT"
          echo P05_UPDATE_SERVER_BOOTSTRAP_LIVE_AUTHORITY=PASS
          echo P05_UPDATE_SERVER_BOOTSTRAP_PRODUCTION_WRITE=0

      - name: Browser-secret and install inheritance boundary
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Fq '/api/system/update/credential' src/client/UpdateShortcut.tsx
          ! grep -Eq 'credentialToken|stepUpPassword|type="password"|localStorage|sessionStorage' src/client/UpdateShortcut.tsx
          grep -Fq "getenv('VF_PRIVATE_READ_TOKEN')" php/bin/init-update-service.php
          grep -Fq -- '->saveCredential($token)' php/bin/init-update-service.php
          ! grep -Eq '\$argv|STDIN|readline\(|fgets\(STDIN' php/bin/init-update-service.php
          grep -Fq 'php php/bin/init-update-service.php' install-cloudpanel-php.sh
          grep -Fq 'VF_PRIVATE_READ_TOKEN=%q' install-cloudpanel.sh
          echo P05_UPDATE_SERVER_BOOTSTRAP_SECRET_BOUNDARY=PASS

      - name: Seal exact Product candidate
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          test -z "$(git status --porcelain)"
          echo "P05_UPDATE_SERVER_BOOTSTRAP_SHA=$(git rev-parse HEAD)"
          echo "P05_UPDATE_SERVER_BOOTSTRAP_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_UPDATE_SERVER_BOOTSTRAP_GATE=PASS
