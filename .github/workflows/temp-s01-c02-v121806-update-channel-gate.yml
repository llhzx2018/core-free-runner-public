name: TEMP S01-C02 Ops 1.21.806 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121806-update-channel-gate-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121806-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 05f0bf255cefb7f8e23967423d62173d6a3fd2fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Verify manifest against formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          M=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.806" and .from_versions==["1.21.805"] and .release_tag=="v1.21.806" and .asset_name=="vf-tools-ops_V1.21.806.zip" and .asset_bytes==3210825 and .asset_sha256=="aa928e25e82459547a32df28f19436a1a5660c93c0b7f9f91858e90a7e081c91" and .runtime_files==898 and .runtime_fingerprint=="699ddf1414e583137f7b018c33c3859103011ca9d4c1f47dd89ab065f525d1ac" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php"' "$M" >/dev/null
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.806')"
          test "$(jq -r .tag_name <<<"$J")" = v1.21.806
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.806.zip")|.size' <<<"$J")" = 3210825
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.806.zip")|.digest' <<<"$J")" = 'sha256:aa928e25e82459547a32df28f19436a1a5660c93c0b7f9f91858e90a7e081c91'
          grep -Fq 'Production Upgrade is NOT EXECUTED' "$M"
          echo DIRECT_SOURCE_1_21_805_ONLY=PASS
          echo PASS_V121806_UPDATE_CHANNEL_GATE
