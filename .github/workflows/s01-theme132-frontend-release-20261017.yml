name: S01 Theme frontend V1 release candidate lifecycle
on:
  push:
    branches: [task/s01-theme132-frontend-release-20261017]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.132'
      TARGET_SHA: '933258f8df397bff5cae9c9825c78f572f3d3b02'
      TARGET_TREE: '432d4044a70d41cd51620bdeb5f51512200c7f64'
      BASE_SHA: 'e500bcb71ec1cd3f25b932e011663b08459f6324'
      SOURCE_VERSION: '1.35.131'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Exact lane identity
        run: |
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme132-frontend-release-20261017/spec.json --template runner/lanes/s01-theme132-frontend-release-20261017/candidate.template.yml --output /tmp/lane.yml
          cmp /tmp/lane.yml runner/.github/workflows/s01-theme132-frontend-release-20261017.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme132-frontend-release-20261017/spec.json --input runner/.github/workflows/s01-theme132-frontend-release-20261017.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-theme132-frontend-release-20261017 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source, package and PHP syntax
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          python3 lane/theme-build.py
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/php-lint.txt
          node --check lane/public-browser.cjs
      - name: Existing formal Theme and Provider packages
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir provider
          gh release download v${{ env.SOURCE_VERSION }} --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V${{ env.SOURCE_VERSION }}.zip --dir provider
          echo 'c0b1f65b612446b6efff8220b2e83f860be1db77f9fcfa2ee58b5bb66c18e210  provider/vf-tools-theme_V${{ env.SOURCE_VERSION }}.zip' | sha256sum -c
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Browser runtime
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real package installation, upgrade, rollback and recovery
        run: bash lane/native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: theme132-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
          retention-days: 14
      - name: Remove private source and packages
        if: always()
        run: rm -rf target provider proof/*.zip
