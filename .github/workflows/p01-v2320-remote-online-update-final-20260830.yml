name: P01 V2.32 Final Remote Online Update Gate
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2320-remote-online-update-final-20260830.yml
      - scripts/p01-v2320-remote-final.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2320-final-owner
      PORT: '18655'
      ADMIN_PASS: 'P01V2320!FinalRemote'
      EVID: /tmp/p01-v2320-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout immutable V2.31 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.31.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout published core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: e61b366d7d63faf19b895b8334c3b9900b83a7a8
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C production rev-parse HEAD)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(git -C production rev-parse HEAD^{tree})" = f568820198afde57fe3c1522820f45bbbf6e0c96
          test "$(git -C production rev-parse HEAD:src)" = 772d51ebbc9f8cd6791c0601d29f6b3b2a95a086
          test "$(git -C updates rev-parse HEAD)" = e61b366d7d63faf19b895b8334c3b9900b83a7a8
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = e61b366d7d63faf19b895b8334c3b9900b83a7a8
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0 --jq .object.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0 --jq .id)" = 379046260
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264371922 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264426723 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264522854 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264613957 --jq .conclusion)" = success
          jq -e '.current_version=="2.31.0" and .target_version=="2.32.0" and .from_versions==["2.31.0"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.32.0" and .release_id==379046260 and .product_identity=="120a42667fce7357fdaef03b64cb7ea41392040d" and .asset_name=="VF_Start_V2.32.0_UPDATE.zip" and .asset_bytes==1351066 and .asset_sha256=="262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.32.0_UPDATE.zip")|.size' <<<"$REL")" = 1351066
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.32.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          echo P01_V2320_FINAL_REMOTE_TRUTH_FENCE=PASS
      - name: Real remote online update and runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2320-remote-final.sh
      - name: Final verdict
        shell: bash
        run: |
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2310_TO_V2320_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2320_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2320_DATA_PRESERVATION=PASS
          P01_V2320_SQLITE_INTEGRITY=PASS
          P01_V2320_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2320_HOME_COMMAND_CENTER_REMOTE=PASS
          P01_V2320_HOME_DESKTOP_MOBILE=PASS
          P01_V2320_ALL_RESOURCES_SEPARATE=PASS
          P01_V2320_CANDIDATE_BROWSER_GATE_33263475338=BOUND_PASS
          P01_V2320_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2320-final-evidence
          if-no-files-found: warn
          retention-days: 90
