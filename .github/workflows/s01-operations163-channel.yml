name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-operations163-20261022]
    paths: ['.github/workflows/s01-operations163-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.163
  TARGET_SHA: c111556c137865d5d523fff2fbd52b57f9f77db3
  UPDATE_SHA: ddd3256d1cba5f09d91fc06c5e8f6db3ea627e2b
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ddd3256d1cba5f09d91fc06c5e8f6db3ea627e2b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='140bda041b11afc6946b2c88e67d599aaa4c91cd16be50bc7778b0a1861bc31a' and m['asset_bytes']==1975655
          assert m['runtime_files']==476 and '1.35.162' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
