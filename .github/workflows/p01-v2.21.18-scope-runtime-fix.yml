name: P03 Common Baseline V2 Resolver Truth Fix
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: e54f17f7798bd20630eae895b5e042c8f4c7e0ec
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply resolver truth fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/CommonBaseline.php');s=p.read_text(encoding='utf-8')
          old="    public static function resolve(PDO $db): array\n    {\n        $rows=[];"
          new="    public static function resolve(PDO $db): array\n    {\n        vfab_start_session();\n        $rows=[];"
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          s=s.replace("'Repository.php',function_exists('vfab_job_timeout_seconds')", "'Foundation.php',function_exists('vfab_job_timeout_seconds')")
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
          php -l src/app/CommonBaseline.php >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = '1.37.3'
          test "$(tr -d '\r\n' < database/schema/SCHEMA_VERSION)" = '30'
          git diff --quiet "$EXPECTED_HEAD" -- VERSION database
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/CommonBaseline.php
          git commit -m 'fix(P03): make baseline resolver CLI runtime-derived [release:no][production:no]'
          git push origin HEAD:$TARGET_BRANCH
          echo P03_RESOLVER_FIX_HEAD=$(git rev-parse HEAD)
