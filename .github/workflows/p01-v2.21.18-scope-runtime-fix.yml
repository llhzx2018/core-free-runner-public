name: P03 Common Baseline V2 Precise Runtime Patch
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 29580b62a0839ee3453ccf0cf8a4902bdf3cd8ec
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout patch harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: vf-agent-operations-v1
          persist-credentials: false
          path: harness
      - name: Checkout exact P03 working branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03
      - name: Assert source fence
        shell: bash
        working-directory: p03
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '1.37.3'
          test "$(tr -d '\r\n' < database/schema/SCHEMA_VERSION)" = '30'
          echo P03_SOURCE_FENCE_PASS
      - name: Apply exact patch and static verify
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/scripts/p03_common_baseline_v2_patch.py p03
          cd p03
          test "$(tr -d '\r\n' < VERSION)" = '1.37.3'
          test "$(tr -d '\r\n' < database/schema/SCHEMA_VERSION)" = '30'
          git diff --quiet "$EXPECTED_HEAD" -- VERSION database
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          node --check public/assets/experience.js
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          git status --short
          echo P03_V2_PATCH_STATIC_PASS
      - name: Commit and push P03 working branch
        shell: bash
        working-directory: p03
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/CommonBaseline.php src/app/Logging.php src/app/bootstrap.php src/app/Auth.php src/app/CoreUpdates/GitHubClient.php src/app/Repository.php src/app/UpdateService.php src/cli/baseline-verify.php public/api.php public/assets/experience.js public/maintenance.php public/system-info.php public/system-baseline.php docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json
          git diff --cached --quiet && { echo NO_PATCH_CHANGES >&2; exit 1; }
          git commit -m 'feat(P03): adopt Common Product Baseline V2 candidate runtime [release:no][production:no]'
          git push origin HEAD:$TARGET_BRANCH
          echo P03_PATCH_HEAD=$(git rev-parse HEAD)
