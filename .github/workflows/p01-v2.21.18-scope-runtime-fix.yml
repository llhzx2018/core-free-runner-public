name: P02 Common Baseline V2 Final Current Exact Source Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: 3252168e35009e122e8c82a08a6e354d4e7a027d
      BASE_HEAD: 00725827280fb9021b7124a915003de26533b69d
      BASE_URL: http://127.0.0.1:18102
    steps:
      - name: Checkout exact P02 final source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, openssl
          coverage: none
      - name: Exact source authority syntax and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet "$BASE_HEAD" "$EXPECTED_HEAD" -- VERSION src/app/SchemaMigration.php database
          bash scripts/verify-repository.sh
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"state": "SUPERSEDED_BY_V2"' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          grep -F '"state": "VERIFIED_SUPERSEDED_BY_CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          grep -F '"state": "CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"baseline_id": "VF-COMMON-PRODUCT-BASELINE@2.0"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"run_id": 33092057053' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          echo FINAL_SOURCE_AUTHORITY_PASS
      - name: Fresh install exact deploy tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p02-v2-final /tmp/p02-v2-final-cookies /tmp/p02-v2-final-sessions
          mkdir -p /tmp/p02-v2-final-sessions
          bash scripts/build-deploy-tree.sh /tmp/p02-v2-final
          test "$(tr -d '\r\n' < /tmp/p02-v2-final/VERSION.txt)" = '2.5.28'
          cd /tmp/p02-v2-final
          php -d display_errors=0 -d session.save_path=/tmp/p02-v2-final-sessions -S 127.0.0.1:18102 -t . >/tmp/p02-v2-final-server.log 2>&1 &
          echo $! >/tmp/p02-v2-final-server.pid
          for i in $(seq 1 40); do curl -fsS -c /tmp/p02-v2-final-cookies "$BASE_URL/setup.php" -o /tmp/p02-v2-final-setup.html && break; sleep 0.5; done
          grep -F '环境检查通过' /tmp/p02-v2-final-setup.html >/dev/null
          CSRF=$(python3 - <<'PY'
          import re,html
          s=open('/tmp/p02-v2-final-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf" value="([^"]+)"',s); assert m; print(html.unescape(m.group(1)))
          PY
          )
          STATUS=$(curl -sS -o /tmp/p02-v2-final-post.html -w '%{http_code}' -b /tmp/p02-v2-final-cookies -c /tmp/p02-v2-final-cookies -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'password=P02FinalBaseline!2026' --data-urlencode 'password_confirm=P02FinalBaseline!2026' "$BASE_URL/setup.php")
          test "$STATUS" = '303'
          php -d session.save_path=/tmp/p02-v2-final-sessions cli/verify.php | tee /tmp/p02-v2-final-cli.txt
          echo FINAL_FRESH_INSTALL_PASS
      - name: Session boundaries and step-up
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -b /tmp/p02-v2-final-cookies -c /tmp/p02-v2-final-cookies "$BASE_URL/api.php?action=session" -o /tmp/p02-v2-final-session.json
          python3 - <<'PY'
          import json,time
          d=json.load(open('/tmp/p02-v2-final-session.json',encoding='utf-8')); assert d['ok'] and d['site']['auth'] and d['version']=='2.5.28'
          rows=[]
          for raw in open('/tmp/p02-v2-final-cookies',encoding='utf-8').read().splitlines():
              if raw.startswith('#HttpOnly_'): raw=raw[len('#HttpOnly_'):]
              elif raw.startswith('#') or not raw: continue
              if '\tvftextbox_session\t' in raw: rows.append(raw)
          assert rows and int(rows[-1].split('\t')[4]) >= int(time.time())+29*86400
          PY
          cd /tmp/p02-v2-final
          php -d session.save_path=/tmp/p02-v2-final-sessions -r 'require "app/bootstrap.php"; session_id("P02FinalValid001"); vftb_start_session(); $n=time(); $_SESSION["vftextbox_admin"]=true; $_SESSION["vftextbox_login_at"]=$n-VfLibraryCommonBaseline::AUTH_ABSOLUTE_SECONDS+2; $_SESSION["vftextbox_last_seen"]=$n-VfLibraryCommonBaseline::AUTH_IDLE_SECONDS+2; $_SESSION["vftextbox_auth_epoch"]=vftb_auth_epoch_from_config(vftb_config()); if(!vftb_is_admin()) exit(2); session_destroy(); echo "FINAL_SESSION_VALID_PASS\n";'
          php -d session.save_path=/tmp/p02-v2-final-sessions -r 'require "app/bootstrap.php"; session_id("P02FinalIdle002"); vftb_start_session(); $n=time(); $_SESSION["vftextbox_admin"]=true; $_SESSION["vftextbox_login_at"]=$n-60; $_SESSION["vftextbox_last_seen"]=$n-VfLibraryCommonBaseline::AUTH_IDLE_SECONDS-2; $_SESSION["vftextbox_auth_epoch"]=vftb_auth_epoch_from_config(vftb_config()); if(vftb_is_admin()) exit(2); echo "FINAL_IDLE_EXPIRY_PASS\n";'
          php -d session.save_path=/tmp/p02-v2-final-sessions -r 'require "app/bootstrap.php"; session_id("P02FinalAbs003"); vftb_start_session(); $n=time(); $_SESSION["vftextbox_admin"]=true; $_SESSION["vftextbox_login_at"]=$n-VfLibraryCommonBaseline::AUTH_ABSOLUTE_SECONDS-2; $_SESSION["vftextbox_last_seen"]=$n-60; $_SESSION["vftextbox_auth_epoch"]=vftb_auth_epoch_from_config(vftb_config()); if(vftb_is_admin()) exit(2); echo "FINAL_ABSOLUTE_EXPIRY_PASS\n";'
          CSRF=$(python3 -c 'import json;print(json.load(open("/tmp/p02-v2-final-session.json"))["csrf"])')
          printf '%s' '{"filename":"nonexistent.sqlite","confirmation":"恢复"}' >/tmp/p02-v2-final-restore.json
          CODE=$(curl -sS -o /tmp/p02-v2-final-before.json -w '%{http_code}' -b /tmp/p02-v2-final-cookies -c /tmp/p02-v2-final-cookies -H "Origin: $BASE_URL" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/p02-v2-final-restore.json "$BASE_URL/api.php?action=backup_restore")
          test "$CODE" = '428'
          printf '%s' '{"password":"P02FinalBaseline!2026"}' >/tmp/p02-v2-final-reauth.json
          CODE=$(curl -sS -o /tmp/p02-v2-final-reauth-out.json -w '%{http_code}' -b /tmp/p02-v2-final-cookies -c /tmp/p02-v2-final-cookies -H "Origin: $BASE_URL" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/p02-v2-final-reauth.json "$BASE_URL/api.php?action=reauth")
          test "$CODE" = '200'
          NEW_CSRF=$(python3 -c 'import json;d=json.load(open("/tmp/p02-v2-final-reauth-out.json"));assert d["ok"];print(d["csrf"])')
          CODE=$(curl -sS -o /tmp/p02-v2-final-after.json -w '%{http_code}' -b /tmp/p02-v2-final-cookies -c /tmp/p02-v2-final-cookies -H "Origin: $BASE_URL" -H "X-CSRF-Token: $NEW_CSRF" -H 'Content-Type: application/json' --data-binary @/tmp/p02-v2-final-restore.json "$BASE_URL/api.php?action=backup_restore")
          test "$CODE" != '428'
          echo FINAL_SESSION_STEPUP_PASS
      - name: Full resolver and runtime surfaces
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p02-v2-final
          php -d session.save_path=/tmp/p02-v2-final-sessions cli/baseline-verify.php | tee /tmp/p02-v2-final-baseline.txt
          grep -Fx 'PASS_COUNT=70' /tmp/p02-v2-final-baseline.txt
          grep -Fx 'EXCEPTION_COUNT=0' /tmp/p02-v2-final-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p02-v2-final-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p02-v2-final-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p02-v2-final-baseline.txt
          grep -F 'CONNECT_TIMEOUT_SECONDS=5' app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F 'MAX_RETRY_COUNT=3' app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F 'retryDelaySeconds' app/JobService.php >/dev/null
          grep -F 'VfLibraryRuntimeLogger' app/Logging.php >/dev/null
          curl -fsS -b /tmp/p02-v2-final-cookies "$BASE_URL/system-info.php" -o /tmp/p02-v2-final-info.html
          curl -fsS -b /tmp/p02-v2-final-cookies "$BASE_URL/system-baseline.php" -o /tmp/p02-v2-final-baseline.html
          grep -F '系统信息' /tmp/p02-v2-final-info.html >/dev/null
          grep -F '系统基线' /tmp/p02-v2-final-baseline.html >/dev/null
          grep -F 'VF-COMMON-PRODUCT-BASELINE@2.0' /tmp/p02-v2-final-baseline.html >/dev/null
          echo FINAL_FULL_GATE_PASS
      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p02-v2-final-server.pid ]; then kill "$(cat /tmp/p02-v2-final-server.pid)" 2>/dev/null || true; fi
