name: P02 Common Baseline V2 Exact Source Full Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: 6cfc06bcc1911ad93f533c70f66f6d522bb46203
      BASE_HEAD: 00725827280fb9021b7124a915003de26533b69d
    steps:
      - name: Checkout exact P02 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, openssl
          coverage: none
      - name: Exact source syntax and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet "$BASE_HEAD" "$EXPECTED_HEAD" -- VERSION src/app/SchemaMigration.php database
          bash scripts/verify-repository.sh
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          echo SOURCE_SCOPE_PASS
      - name: Fresh install exact deploy tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p02-v2-gate /tmp/p02-v2-cookies /tmp/p02-v2-setup.html /tmp/p02-v2-post.html
          bash scripts/build-deploy-tree.sh /tmp/p02-v2-gate
          test "$(tr -d '\r\n' < /tmp/p02-v2-gate/VERSION.txt)" = '2.5.28'
          cd /tmp/p02-v2-gate
          php -d display_errors=0 -S 127.0.0.1:18102 -t . >/tmp/p02-v2-server.log 2>&1 &
          echo $! >/tmp/p02-v2-server.pid
          for i in $(seq 1 40); do curl -fsS -c /tmp/p02-v2-cookies http://127.0.0.1:18102/setup.php -o /tmp/p02-v2-setup.html && break; sleep 0.5; done
          grep -F '环境检查通过' /tmp/p02-v2-setup.html >/dev/null
          CSRF=$(python3 - <<'PY'
          import re,html
          s=open('/tmp/p02-v2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          assert m
          print(html.unescape(m.group(1)))
          PY
          )
          STATUS=$(curl -sS -o /tmp/p02-v2-post.html -w '%{http_code}' -b /tmp/p02-v2-cookies -c /tmp/p02-v2-cookies -H 'Origin: http://127.0.0.1:18102' --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'password=P02BaselineV2!2026' --data-urlencode 'password_confirm=P02BaselineV2!2026' http://127.0.0.1:18102/setup.php)
          test "$STATUS" = '303'
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p02-v2-cli-verify.txt
          echo FRESH_INSTALL_PASS
      - name: Session auth and runtime profile
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -b /tmp/p02-v2-cookies -c /tmp/p02-v2-cookies http://127.0.0.1:18102/api.php?action=session -o /tmp/p02-v2-session.json
          python3 - <<'PY'
          import json,time
          d=json.load(open('/tmp/p02-v2-session.json',encoding='utf-8'))
          assert d['ok'] is True and d['site']['auth'] is True
          assert d['version']=='2.5.28'
          jar=open('/tmp/p02-v2-cookies',encoding='utf-8').read().splitlines()
          rows=[r for r in jar if r and not r.startswith('#') and '\tvftextbox_session\t' in r]
          assert rows
          expiry=int(rows[-1].split('\t')[4])
          assert expiry >= int(time.time()) + 29*86400
          PY
          cd /tmp/p02-v2-gate
          grep -F 'AUTH_IDLE_SECONDS=604800' app/CommonBaseline.php >/dev/null
          grep -F 'AUTH_ABSOLUTE_SECONDS=2592000' app/CommonBaseline.php >/dev/null
          grep -F 'AUTH_COOKIE_SECONDS=2592000' app/CommonBaseline.php >/dev/null
          grep -F 'AUTH_SERVER_FLOOR_SECONDS=2592000' app/CommonBaseline.php >/dev/null
          grep -F 'STEP_UP_RECENT_AUTH_SECONDS=900' app/CommonBaseline.php >/dev/null
          ! grep -F 'now-$rotatedAt' app/Auth.php >/dev/null
          grep -F "action==='reauth'" api.php >/dev/null
          grep -F 'vftb_require_recent_auth' api.php >/dev/null
          php -d session.save_path=/tmp -r 'require "app/bootstrap.php"; vftb_start_session(); if((int)ini_get("session.gc_maxlifetime")<2592000) exit(2); $p=session_get_cookie_params(); if((int)$p["lifetime"]!==2592000) exit(3); echo "SESSION_PROFILE_PASS\n";'
      - name: Full Common Baseline resolver
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p02-v2-gate
          php cli/baseline-verify.php | tee /tmp/p02-v2-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p02-v2-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p02-v2-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p02-v2-baseline.txt
          php -r 'require "app/bootstrap.php"; $r=VfLibraryCommonBaseline::report(vftb_db()); if((int)$r["counts"]["DRIFT"]!==0||(int)$r["counts"]["UNKNOWN"]!==0) exit(2); echo "FULL_COUNTS=".json_encode($r["counts"],JSON_UNESCAPED_SLASHES).PHP_EOL;'
          echo BASELINE_RESOLVER_PASS
      - name: API Job logging and maintenance surface contract
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p02-v2-gate
          grep -F 'CONNECT_TIMEOUT_SECONDS=5' app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F 'REQUEST_TIMEOUT_SECONDS=15' app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F 'MAX_RETRY_COUNT=3' app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F "[429,502,503,504]" app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F "'retry-after'" app/CoreUpdates/GitHubClient.php >/dev/null
          grep -F 'retryDelaySeconds' app/JobService.php >/dev/null
          grep -F 'timeoutContract' app/JobService.php >/dev/null
          grep -F 'VfLibraryRuntimeLogger' app/Logging.php >/dev/null
          test -f system-info.php
          test -f system-baseline.php
          curl -fsS -b /tmp/p02-v2-cookies http://127.0.0.1:18102/system-info.php -o /tmp/p02-v2-system-info.html
          curl -fsS -b /tmp/p02-v2-cookies http://127.0.0.1:18102/system-baseline.php -o /tmp/p02-v2-system-baseline.html
          grep -F '系统信息' /tmp/p02-v2-system-info.html >/dev/null
          grep -F '系统基线' /tmp/p02-v2-system-baseline.html >/dev/null
          grep -F 'VF-COMMON-PRODUCT-BASELINE@2.0' /tmp/p02-v2-system-baseline.html >/dev/null
          echo RUNTIME_SURFACE_PASS
      - name: Stop isolated runtime
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p02-v2-server.pid ]; then kill "$(cat /tmp/p02-v2-server.pid)" 2>/dev/null || true; fi
