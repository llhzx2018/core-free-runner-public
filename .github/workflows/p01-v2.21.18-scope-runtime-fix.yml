name: P02 Common Baseline V2 Source Manifest Reseal
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 79ebd20ffaf2e436d6662a9a22a3b789ec8f1262
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Exact source and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet 00725827280fb9021b7124a915003de26533b69d "$EXPECTED_HEAD" -- VERSION src/app/SchemaMigration.php database
          echo RESEAL_SOURCE_GUARD_PASS
      - name: Regenerate canonical source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          python3 -m json.tool SOURCE_MANIFEST.json >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git status --short
          CHANGED=$(git status --short | awk '{print $2}' | sort)
          EXPECTED=$(printf '%s\n' SOURCE_MANIFEST.json SOURCE_MANIFEST.txt | sort)
          test "$CHANGED" = "$EXPECTED"
          echo SOURCE_MANIFEST_RESEAL_PASS
      - name: Commit and push resealed manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'governance(P02): reseal V2 candidate source manifest'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "P02_RESEALED_HEAD=$(git rev-parse HEAD)"
