name: P02 Common Baseline V2 Runtime Resolver Fix
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 6cfc06bcc1911ad93f533c70f66f6d522bb46203
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
      BASE_HEAD: 00725827280fb9021b7124a915003de26533b69d
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Exact source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet "$BASE_HEAD" "$EXPECTED_HEAD" -- VERSION src/app/SchemaMigration.php database
          echo P02_FIX_SOURCE_GUARD_PASS
      - name: Fix runtime session contract and resolver evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected one anchor, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          replace_once(
              'src/app/Auth.php',
              "if($loginAt<=0||$now-$loginAt>1209600||$lastSeen<=0||$now-$lastSeen>43200){vftb_session_clear();return false;}",
              "if($loginAt<=0||$now-$loginAt>VfLibraryCommonBaseline::AUTH_ABSOLUTE_SECONDS||$lastSeen<=0||$now-$lastSeen>VfLibraryCommonBaseline::AUTH_IDLE_SECONDS){vftb_session_clear();return false;}",
              'auth timeout alignment'
          )
          replace_once(
              'src/app/Auth.php',
              "    $rotatedAt=(int)($_SESSION['vftextbox_rotated_at']??$loginAt);\n    if($rotatedAt<=0||$now-$rotatedAt>1800){session_regenerate_id(true);$_SESSION['vftextbox_rotated_at']=$now;}\n",
              "",
              'periodic rotation removal'
          )

          p=Path('src/app/CommonBaseline.php'); s=p.read_text()
          replacements=[
              (
                  "self::row($r,'AUTH','idle_timeout_seconds',self::AUTH_IDLE_SECONDS,self::sourceHas('src/app/Auth.php','AUTH_IDLE_SECONDS')?self::AUTH_IDLE_SECONDS:null,'PROFILE_EXACT','Auth.php');",
                  "self::row($r,'AUTH','idle_timeout_seconds',self::AUTH_IDLE_SECONDS,self::sourceHas('src/app/Auth.php','VfLibraryCommonBaseline::AUTH_IDLE_SECONDS')?self::AUTH_IDLE_SECONDS:null,'PROFILE_EXACT','Auth.php runtime expiry');"
              ),
              (
                  "self::row($r,'AUTH','absolute_timeout_seconds',self::AUTH_ABSOLUTE_SECONDS,self::sourceHas('src/app/Auth.php','AUTH_ABSOLUTE_SECONDS')?self::AUTH_ABSOLUTE_SECONDS:null,'PROFILE_EXACT','Auth.php');",
                  "self::row($r,'AUTH','absolute_timeout_seconds',self::AUTH_ABSOLUTE_SECONDS,self::sourceHas('src/app/Auth.php','VfLibraryCommonBaseline::AUTH_ABSOLUTE_SECONDS')?self::AUTH_ABSOLUTE_SECONDS:null,'PROFILE_EXACT','Auth.php runtime expiry');"
              ),
              (
                  "self::row($r,'AUTH','step_up_reauth_high_risk',true,self::sourceHas('src/app/Auth.php','vftb_require_recent_auth')&&self::sourceHas('public/api.php','reauth_required')?true:null,'BOOLEAN_REQUIRED','Auth + API recent-auth');",
                  "self::row($r,'AUTH','step_up_reauth_high_risk',true,self::sourceHas('src/app/Auth.php','function vftb_require_recent_auth')&&self::sourceHas('public/api.php','vftb_require_recent_auth()')?true:null,'BOOLEAN_REQUIRED','Auth recent-auth primitive + high-risk API routes');"
              ),
              (
                  "self::row($r,'FILE_UPLOAD','archive_preflight_required',true,self::sourceHas('src/app/ImportService.php','numFiles')&&self::sourceHas('src/app/Archive.php','_is_symlink')?true:null,'BOOLEAN_REQUIRED','ZIP entry preflight');",
                  "self::row($r,'FILE_UPLOAD','archive_preflight_required',true,self::sourceHas('src/app/RecoveryService.php','$zip->numFiles')&&self::sourceHas('src/app/RecoveryService.php','getExternalAttributesIndex')&&self::sourceHas('src/app/RecoveryService.php','完整备份 ZIP 不允许加密条目')?true:null,'BOOLEAN_REQUIRED','RecoveryService portable-backup ZIP full preflight before extraction');"
              )
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'baseline resolver anchor mismatch: {old[:80]} count={s.count(old)}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -F 'VfLibraryCommonBaseline::AUTH_ABSOLUTE_SECONDS' src/app/Auth.php >/dev/null
          grep -F 'VfLibraryCommonBaseline::AUTH_IDLE_SECONDS' src/app/Auth.php >/dev/null
          ! grep -F '$now-$rotatedAt>1800' src/app/Auth.php >/dev/null
          grep -F "src/app/RecoveryService.php','$zip->numFiles'" src/app/CommonBaseline.php >/dev/null
          echo P02_RUNTIME_RESOLVER_FIX_APPLIED
      - name: Reseal source and verify repository
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet "$BASE_HEAD" -- VERSION src/app/SchemaMigration.php database
          git status --short
          echo P02_RESEAL_VERIFY_PASS
      - name: Commit and push P02 fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/Auth.php src/app/CommonBaseline.php SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git diff --cached --quiet && { echo P02_FIX_NO_CHANGE; exit 2; }
          git commit -m 'fix(P02): align V2 auth runtime and resolver evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "P02_FIXED_HEAD=$(git rev-parse HEAD)"
