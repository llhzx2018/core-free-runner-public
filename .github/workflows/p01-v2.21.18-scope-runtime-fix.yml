name: P02 Common Baseline V2 Final Source Manifest Reseal
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 3252168e35009e122e8c82a08a6e354d4e7a027d
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout exact P02 currentized source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, mbstring, openssl
          coverage: none
      - name: Reseal native source manifest and push
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet 00725827280fb9021b7124a915003de26533b69d HEAD -- VERSION src/app/SchemaMigration.php database
          python3 scripts/generate-source-manifest.py
          CHANGED=$(git status --porcelain | awk '{print $2}' | sort)
          test "$CHANGED" = $'SOURCE_MANIFEST.json\nSOURCE_MANIFEST.txt'
          bash scripts/verify-repository.sh
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'governance: reseal V2 current source manifest [release:no][production:no]'
          git push origin HEAD:$TARGET_BRANCH
          echo "FINAL_P02_HEAD=$(git rev-parse HEAD)"
