name: P03 Common Baseline V2 Final Current Exact Source Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXACT_SOURCE: 350cfa32a9e03b277ae0d53c674ace51af9b945e
      BASE_SOURCE: 29580b62a0839ee3453ccf0cf8a4902bdf3cd8ec
      RUNTIME_VERIFIED_SOURCE: 3c86809e97970added30aaa65d343d26fe920110
      RUNTIME_VERIFIED_RUN: '33098729384'
      FIXTURE_PASS: P03BaselineV2-2026!
      PHP_TEST_IMAGE: vf-forge-v2-php84
    steps:
      - name: Checkout public gate harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: vf-agent-operations-v1
          persist-credentials: false
          path: harness
      - name: Patch harness final authority assertion only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('harness/scripts/p03_common_baseline_v2_full_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='php -r \'$d=json_decode(file_get_contents("docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json"),true,512,JSON_THROW_ON_ERROR);if(($d["state"]??"")!=="MACHINE_VERIFICATION_PENDING"||($d["baseline_id"]??"")!=="VF-COMMON-PRODUCT-BASELINE@2.0")exit(2);echo "V2_CANDIDATE_AUTHORITY_PASS\\n";\''
          new='php -r \'$v1=json_decode(file_get_contents("docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json"),true,512,JSON_THROW_ON_ERROR);$c=json_decode(file_get_contents("docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json"),true,512,JSON_THROW_ON_ERROR);$v2=json_decode(file_get_contents("docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json"),true,512,JSON_THROW_ON_ERROR);if(($v1["state"]??"")!=="SUPERSEDED_BY_V2"||($c["state"]??"")!=="VERIFIED_SUPERSEDED_BY_CURRENT"||($v2["state"]??"")!=="CURRENT"||($v2["baseline_id"]??"")!=="VF-COMMON-PRODUCT-BASELINE@2.0"||($v2["machine_verification"]["state"]??"")!=="PASS"||($v2["machine_verification"]["run_id"]??0)!==33098729384||($v2["runtime_verified_source_sha"]??"")!=="3c86809e97970added30aaa65d343d26fe920110")exit(2);echo "V2_CURRENT_AUTHORITY_PASS\\n";\''
          if s.count(old)!=1: raise SystemExit(f'authority assertion fragment count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          bash -n harness/scripts/p03_common_baseline_v2_full_gate.sh
          echo HARNESS_FINAL_AUTHORITY_ASSERTION_PATCH_PASS
      - name: Checkout exact private P03 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p03
      - name: Prepare PHP 8.4 verification runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, fileinfo, sodium, curl, mbstring
          coverage: none
      - name: Build isolated PHP 8.4 Docker runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3 curl >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.p03-v2" <<'EOF'
          FROM php:8.4-cli-bookworm@sha256:5380a7dd17b978cd14fb2c84cd67ddc47adaf079b240f8138224bbadefae46f7
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev sqlite3 && docker-php-ext-install pdo_sqlite zip && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-v2" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","sqlite3","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo PHP_VERSION," P03_V2_RUNTIME_PASS\n";'
      - name: Exact source static and authority gate
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = '1.37.3'
          test "$(tr -d '\r\n' < database/schema/SCHEMA_VERSION)" = '30'
          git diff --quiet "$BASE_SOURCE" "$EXACT_SOURCE" -- VERSION database
          find src public -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          node --check public/assets/experience.js
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -Fq '"state": "SUPERSEDED_BY_V2"' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json
          grep -Fq '"state": "VERIFIED_SUPERSEDED_BY_CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json
          grep -Fq '"state": "CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          grep -Fq '"run_id": 33098729384' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          grep -Fq '"runtime_verified_source_sha": "3c86809e97970added30aaa65d343d26fe920110"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          echo P03_V2_FINAL_AUTHORITY_STATIC_PASS
      - name: Execute current regression plus V2 final contract gate
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          chmod +x ../harness/scripts/p03_common_baseline_v2_full_gate.sh
          bash ../harness/scripts/p03_common_baseline_v2_full_gate.sh
      - name: Final machine verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P03_FINAL_EXACT_SOURCE=$EXACT_SOURCE
          echo P03_RUNTIME_VERIFIED_SOURCE=$RUNTIME_VERIFIED_SOURCE
          echo P03_RUNTIME_VERIFIED_RUN=$RUNTIME_VERIFIED_RUN
          echo P03_COMMON_BASELINE_V2_FINAL_MACHINE_RESULT=PASS
          echo VERSION_CHANGED=NO
          echo SCHEMA_CHANGED=NO
          echo RELEASE=NO
          echo PRODUCTION=NO
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f vf-forge-current-http vf-forge-v2-gate-http >/dev/null 2>&1 || true
          rm -rf p03 "$RUNNER_TEMP/p03-v2-runtime" "$RUNNER_TEMP/p03-v2-private" "$RUNNER_TEMP/p03-v2-sessions" "$RUNNER_TEMP/Dockerfile.p03-v2"
