name: P02 Common Baseline V2 Adoption Currentization
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  currentize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: c1b79576b5adb88a635fb13e0b836432a04bbdf2
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
    steps:
      - name: Checkout exact P02 verified candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Exact source and no-release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git diff --quiet 00725827280fb9021b7124a915003de26533b69d "$EXPECTED_HEAD" -- VERSION src/app/SchemaMigration.php database
          echo CURRENTIZATION_SOURCE_GUARD_PASS
      - name: Currentize adoption authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('docs/authority')
          v1p=root/'VF_COMMON_PRODUCT_BASELINE_ADOPTION.json'
          cp=root/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json'
          outp=root/'VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          if outp.exists():
              raise SystemExit('formal V2 adoption already exists unexpectedly')

          v1=json.loads(v1p.read_text())
          if v1.get('state')!='CURRENT':
              raise SystemExit(f'V1 expected CURRENT, got {v1.get("state")}')
          v1['state']='SUPERSEDED_BY_V2'
          v1['superseded_by']='VF-COMMON-PRODUCT-BASELINE@2.0'
          v1['superseded_at']='2026-08-27T16:13:18Z'
          v1['superseded_reason']='P02 Common Product Baseline V2 runtime adoption machine verified and currentized.'
          v1p.write_text(json.dumps(v1,ensure_ascii=False,indent=2)+'\n')

          candidate=json.loads(cp.read_text())
          if candidate.get('state')!='CANDIDATE_MACHINE_VERIFICATION_PENDING':
              raise SystemExit(f'candidate state mismatch: {candidate.get("state")}')
          candidate['state']='VERIFIED_SUPERSEDED_BY_CURRENT'
          candidate['machine_verification']={
              'status':'PASS',
              'runner_repository':'llhzx2018/core-free-runner-public',
              'workflow':'P02 Common Baseline V2 Exact Source Full Gate',
              'run_id':33092057053,
              'exact_source':'c1b79576b5adb88a635fb13e0b836432a04bbdf2',
              'resolver_counts':{'PASS':70,'EXCEPTION':0,'DRIFT':0,'UNKNOWN':0,'N_A':0},
              'fresh_install':'PASS',
              'session_boundary':'PASS',
              'step_up_reauth':'PASS',
              'runtime_surfaces':'PASS'
          }
          candidate['superseded_by']='docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          cp.write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n')

          current={
              'schema':'vf-common-product-baseline-adoption/v2',
              'state':'CURRENT',
              'project_id':'P02',
              'project_name':'VF Library',
              'repository':'llhzx2018/vf-library',
              'baseline_id':'VF-COMMON-PRODUCT-BASELINE@2.0',
              'baseline_version':'2.0',
              'profile':'PERSONAL_SINGLE_ADMIN',
              'authority_repository':'llhzx2018/gov-doc',
              'authority_ref':'main',
              'authority_path':'governance/agent/VF_COMMON_PRODUCT_BASELINE_AUTHORITY.json',
              'authority_status':'CURRENT',
              'truth_model':'RUNTIME_DERIVED_READ_ONLY_NO_SHADOW_TRUTH',
              'assessed_runtime_source_sha':'c1b79576b5adb88a635fb13e0b836432a04bbdf2',
              'machine_verification':{
                  'status':'PASS',
                  'runner_repository':'llhzx2018/core-free-runner-public',
                  'workflow':'P02 Common Baseline V2 Exact Source Full Gate',
                  'run_id':33092057053,
                  'exact_source':'c1b79576b5adb88a635fb13e0b836432a04bbdf2',
                  'resolver_counts':{'PASS':70,'EXCEPTION':0,'DRIFT':0,'UNKNOWN':0,'N_A':0},
                  'source_manifest':'PASS',
                  'repository_gates':'PASS',
                  'php_syntax':'PASS',
                  'javascript_syntax':'PASS',
                  'fresh_install':'PASS',
                  'schema_2401':'PASS',
                  'sqlite_integrity':'PASS',
                  'session_profile_7d_30d':'PASS',
                  'idle_and_absolute_expiry_boundaries':'PASS',
                  'server_session_lifetime_floor':'PASS',
                  'high_risk_step_up_reauth':'PASS',
                  'api_job_logging_contract':'PASS',
                  'system_info_surface':'PASS',
                  'system_baseline_surface':'PASS'
              },
              'effective_contract':{
                  'auth_idle_timeout_seconds':604800,
                  'auth_absolute_timeout_seconds':2592000,
                  'auth_cookie_max_age_seconds':2592000,
                  'auth_server_session_lifetime_floor_seconds':2592000,
                  'periodic_rotation_required':False,
                  'step_up_recent_auth_window_seconds':900,
                  'system_timezone':'Asia/Shanghai',
                  'instant_storage_timezone':'UTC'
              },
              'runtime_evidence':[
                  'src/app/CommonBaseline.php',
                  'src/app/Auth.php',
                  'src/app/bootstrap.php',
                  'src/app/CoreUpdates/GitHubClient.php',
                  'src/app/JobService.php',
                  'src/app/Logging.php',
                  'src/app/RecoveryService.php',
                  'public/api.php',
                  'public/system-info.php',
                  'public/system-baseline.php',
                  'src/cli/baseline-verify.php'
              ],
              'version':'2.5.28',
              'schema_version':2401,
              'version_changed':False,
              'schema_changed':False,
              'release':False,
              'production':False,
              'currentized_at':'2026-08-27T16:13:18Z'
          }
          outp.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"state": "SUPERSEDED_BY_V2"' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          grep -F '"state": "VERIFIED_SUPERSEDED_BY_CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          grep -F '"state": "CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"run_id": 33092057053' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          echo ADOPTION_CURRENTIZATION_PASS
      - name: Scope guard and commit
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git status --short | awk '{print $2}' | sort)
          EXPECTED=$(printf '%s\n' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json | sort)
          test "$CHANGED" = "$EXPECTED"
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json
          git commit -m 'governance(P02): currentize Common Baseline V2 adoption'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "P02_CURRENTIZED_HEAD=$(git rev-parse HEAD)"
