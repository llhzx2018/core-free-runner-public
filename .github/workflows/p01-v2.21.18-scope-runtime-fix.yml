name: P02 Common Baseline V2 Patch Apply
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 00725827280fb9021b7124a915003de26533b69d
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260827
      PATCH_COMMIT: 3537eca18414f503fb7d0fd6aa5784ac787ceaea
    steps:
      - name: Checkout exact P02 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Exact source guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          echo P02_SOURCE_GUARD_PASS
      - name: Apply controlled V2 patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/${PATCH_COMMIT}/.github/scripts/p02_common_baseline_patch.py" -o /tmp/p02_common_baseline_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p02_common_baseline_patch.py')
          s=p.read_text()
          s=s.replace('gh,n=download_re.subn(download_new,gh,count=1)','gh,n=download_re.subn(lambda _m: download_new,gh,count=1)',1)
          p.write_text(s)
          PY
          python3 /tmp/p02_common_baseline_patch.py
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          git status --short
      - name: Detailed pre-commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '== PHP syntax =='
          while IFS= read -r -d '' f; do php -l "$f" || exit 21; done < <(find src public -type f -name '*.php' -print0)
          echo PHP_SYNTAX_PASS
          echo '== JS syntax =='
          while IFS= read -r -d '' f; do node --check "$f" || exit 22; done < <(find public -type f -name '*.js' -print0)
          echo JS_SYNTAX_PASS
          echo '== Candidate JSON =='
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null
          echo JSON_PASS
          grep -F 'VF-COMMON-PRODUCT-BASELINE@2.0-CANDIDATE' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json >/dev/null && echo BASELINE_ID_PASS
          grep -F '604800' src/app/CommonBaseline.php >/dev/null && echo IDLE_PASS
          grep -F '2592000' src/app/CommonBaseline.php >/dev/null && echo ABS_PASS
          grep -F "SYSTEM_TIMEZONE='Asia/Shanghai'" src/app/CommonBaseline.php >/dev/null && echo TZ_PASS
          echo PATCH_SMOKE_PASS
      - name: Commit and push P02 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src public docs
          git diff --cached --quiet && { echo 'PATCH_NO_CHANGE'; exit 2; }
          git commit -m 'feat(P02): adopt Common Product Baseline V2 candidate runtime'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "P02_PATCH_HEAD=$(git rev-parse HEAD)"
