name: P01 Common Baseline V2 Final Gate Stable
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-scope-runtime-fix.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: 89124cf27f0b1d74dffa73f94015de87e6a09433
    steps:
      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact source and adoption authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          grep -F '"state": "CURRENT"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"baseline_id": "VF-COMMON-PRODUCT-BASELINE@2.0"' docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          grep -F '"state": "SUPERSEDED_BY_V2"' docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json >/dev/null
          test "$(cat VERSION)" = '2.21.24'
          test "$(cat src/VERSION.txt)" = '2.21.24'
          echo SOURCE_AUTHORITY_PASS
      - name: Fresh install
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p01-final-v2
          cp -a src /tmp/p01-final-v2
          cd /tmp/p01-final-v2
          php -d upload_max_filesize=200M -d post_max_size=205M -S 127.0.0.1:18099 -t . >/tmp/p01-final-v2-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18099/setup.php -o /tmp/p01-final-v2-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-final-v2.cookies -b /tmp/p01-final-v2.cookies http://127.0.0.1:18099/setup.php -o /tmp/p01-final-v2-setup.html
          CSRF=$(python3 -c 'import re; t=open("/tmp/p01-final-v2-setup.html",encoding="utf-8").read(); m=re.search(r"name=\"setup_csrf\"\s+value=\"([^\"]+)\"",t); assert m; print(m.group(1))')
          curl -fsS -c /tmp/p01-final-v2.cookies -b /tmp/p01-final-v2.cookies -X POST http://127.0.0.1:18099/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Final V2 Gate' --data-urlencode 'admin_password=P01BaselineGate!2026' --data-urlencode 'admin_password_confirm=P01BaselineGate!2026' -o /tmp/p01-final-v2-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-final-v2-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-final-v2-verify.txt
          echo FRESH_INSTALL_PASS
      - name: Full baseline resolver
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/p01-final-v2
          php -d upload_max_filesize=200M -d post_max_size=205M cli/baseline-verify.php | tee /tmp/p01-final-v2-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-final-v2-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-final-v2-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-final-v2-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-final-v2-baseline.txt
          php -r 'require "app/bootstrap.php"; $r=VfCommonBaseline::report(vf_db()); if((int)$r["counts"]["DRIFT"]!==0||(int)$r["counts"]["UNKNOWN"]!==0) exit(2); if((int)$r["counts"]["EXCEPTION"]!==1) exit(3); echo "FULL_COUNTS=".json_encode($r["counts"],JSON_UNESCAPED_SLASHES).PHP_EOL;'
          echo BASELINE_FINAL_PASS
      - name: Runtime surfaces and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test -f src/system-info.php
          test -f src/system-baseline.php
          test -f src/update.php
          test -f src/system.php
          test -f src/data-safety.php
          test -f src/app/CommonBaseline.php
          grep -F "'title'=>'系统信息'" src/system-info.php >/dev/null
          grep -F "'title'=>'系统基线'" src/system-baseline.php >/dev/null
          grep -F "'title'=>'在线升级'" src/update.php >/dev/null
          grep -F "'title'=>'运行健康'" src/system.php >/dev/null
          test "$(cat VERSION)" = '2.21.24'
          echo RUNTIME_SURFACE_PASS
