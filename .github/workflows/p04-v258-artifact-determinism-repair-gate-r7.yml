name: P04 VF Infra V2.5.8 Artifact Determinism Repair Gate R7

on:
  push:
    paths:
      - '.github/workflows/p04-v258-artifact-determinism-repair-gate-r7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v258-artifact-determinism-repair-gate-r7
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: 4a18a61c21455184c67aa4a3e0957283674ae2d7
  TARGET_TREE: 89f322a309f8c51c9869864800a6980cb9bfbb94
  TARGET_VERSION: 2.5.8
  TARGET_SCHEMA: '14'
  SOURCE_VERSION: 2.5.7
  SEALED_FULL_BYTES: '445789'
  SEALED_FULL_SHA256: 554e7dd006631bfbd8c0564452e908b73fe31d5c1c5115679f3fa995e7943e98
  SEALED_UPDATE_BYTES: '93560'
  SEALED_UPDATE_SHA256: 4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129
  SEALED_ATOMIC_BYTES: '93560'
  SEALED_ATOMIC_SHA256: 4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129
  SEALED_REPAIR_BYTES: '250521'
  SEALED_REPAIR_SHA256: 23477a0d8475887d509a855bc8aaa1218333313a30df6fb9d9e3a627fffca7ad
  SEALED_PACKAGE_BYTES: '1661'
  SEALED_PACKAGE_SHA256: c4f2b87abd9b951eff9291c5e5dd4d4068e4a77f1fd5fca09b73942f472ace99
  SEALED_RUNTIME_FILES: '165'
  SEALED_RUNTIME_FINGERPRINT: 13e8eeaddf89837f2d370a2e15899e354402042d8bc0c27eccd130ec6ff2855a
  SEALED_PRODUCTION_SOURCE_MANIFEST_SHA256: 4b4b52a5b0651aeca41433730fa53bbd96392524b6face44940f2405cf864203

jobs:
  artifact-determinism-r7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact frozen V2.5.8 Product Candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Exact Product Commit Tree Version Schema
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "$TARGET_SCHEMA"
          test ! -e database/migrations/015_v258.sql
          echo 'P04_V258_R7_EXACT_FROZEN_PRODUCT_IDENTITY_PASS'

      - name: Build A from frozen Product Candidate
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          python3 scripts/build-v258-candidate-artifacts.py --output build/v258-candidate-a

      - name: Artifact Existence Gate A
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          required=(
            'build/v258-candidate-a/VF_Infra_V2.5.8_FULL.zip'
            'build/v258-candidate-a/V258_CANDIDATE_ARTIFACT_MANIFEST.json'
            'build/v258-candidate-a/update-set/VF_Infra_V2.5.8_UPDATE.zip'
            'build/v258-candidate-a/update-set/VF_Infra_V2.5.8_ATOMIC.zip'
            'build/v258-candidate-a/update-set/repair-v2.5.8.php'
            'build/v258-candidate-a/update-set/PACKAGE_MANIFEST.json'
            'build/v258-candidate-a/update-set/SHA256SUMS.txt'
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "R7_ARTIFACT_MISSING_A: $file" >&2
              exit 31
            fi
          done
          echo 'P04_V258_R7_ARTIFACT_EXISTENCE_A_PASS'

      - name: Build B from frozen Product Candidate
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          python3 scripts/build-v258-candidate-artifacts.py --output build/v258-candidate-b

      - name: Artifact Existence Gate B
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          required=(
            'build/v258-candidate-b/VF_Infra_V2.5.8_FULL.zip'
            'build/v258-candidate-b/V258_CANDIDATE_ARTIFACT_MANIFEST.json'
            'build/v258-candidate-b/update-set/VF_Infra_V2.5.8_UPDATE.zip'
            'build/v258-candidate-b/update-set/VF_Infra_V2.5.8_ATOMIC.zip'
            'build/v258-candidate-b/update-set/repair-v2.5.8.php'
            'build/v258-candidate-b/update-set/PACKAGE_MANIFEST.json'
            'build/v258-candidate-b/update-set/SHA256SUMS.txt'
          )
          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "R7_ARTIFACT_MISSING_B: $file" >&2
              exit 32
            fi
          done
          echo 'P04_V258_R7_ARTIFACT_EXISTENCE_B_PASS'

      - name: Direct A B SHA256 and byte comparison
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          sha(){ sha256sum "$1" | awk '{print $1}'; }
          compare(){
            local rel="$1" a="build/v258-candidate-a/$1" b="build/v258-candidate-b/$1"
            test -f "$a"; test -f "$b"
            local sa sb
            sa="$(sha "$a")"; sb="$(sha "$b")"
            if [[ "$sa" != "$sb" ]]; then
              echo "R7_SHA_MISMATCH: $rel A=$sa B=$sb" >&2
              exit 41
            fi
            cmp -s "$a" "$b" || { echo "R7_BYTE_MISMATCH: $rel" >&2; exit 42; }
            echo "R7_A_B_EXACT_PASS $rel $sa"
          }
          compare 'VF_Infra_V2.5.8_FULL.zip'
          compare 'V258_CANDIDATE_ARTIFACT_MANIFEST.json'
          compare 'update-set/VF_Infra_V2.5.8_UPDATE.zip'
          compare 'update-set/VF_Infra_V2.5.8_ATOMIC.zip'
          compare 'update-set/repair-v2.5.8.php'
          compare 'update-set/PACKAGE_MANIFEST.json'
          compare 'update-set/SHA256SUMS.txt'
          echo 'P04_V258_R7_DIRECT_A_B_EXACT_PASS'

      - name: UPDATE equals ATOMIC independently in A and B
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          for build in a b; do
            base="build/v258-candidate-${build}/update-set"
            test -f "$base/VF_Infra_V2.5.8_UPDATE.zip"
            test -f "$base/VF_Infra_V2.5.8_ATOMIC.zip"
            cmp -s "$base/VF_Infra_V2.5.8_UPDATE.zip" "$base/VF_Infra_V2.5.8_ATOMIC.zip" || {
              echo "R7_UPDATE_ATOMIC_BYTE_MISMATCH_BUILD_${build^^}" >&2
              exit 51
            }
            test "$(sha256sum "$base/VF_Infra_V2.5.8_UPDATE.zip" | awk '{print $1}')" = "$(sha256sum "$base/VF_Infra_V2.5.8_ATOMIC.zip" | awk '{print $1}')"
            echo "R7_UPDATE_ATOMIC_EXACT_PASS_BUILD_${build^^}"
          done

      - name: Lock sealed Candidate SHA and bytes
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          check(){
            local path="$1" expected_bytes="$2" expected_sha="$3"
            test -f "$path"
            local actual_bytes actual_sha
            actual_bytes="$(stat -c '%s' "$path")"
            actual_sha="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$actual_bytes" != "$expected_bytes" || "$actual_sha" != "$expected_sha" ]]; then
              echo "R7_SEALED_IDENTITY_MISMATCH $path bytes=$actual_bytes sha=$actual_sha" >&2
              exit 61
            fi
          }
          for build in a b; do
            root="build/v258-candidate-${build}"
            check "$root/VF_Infra_V2.5.8_FULL.zip" "$SEALED_FULL_BYTES" "$SEALED_FULL_SHA256"
            check "$root/update-set/VF_Infra_V2.5.8_UPDATE.zip" "$SEALED_UPDATE_BYTES" "$SEALED_UPDATE_SHA256"
            check "$root/update-set/VF_Infra_V2.5.8_ATOMIC.zip" "$SEALED_ATOMIC_BYTES" "$SEALED_ATOMIC_SHA256"
            check "$root/update-set/repair-v2.5.8.php" "$SEALED_REPAIR_BYTES" "$SEALED_REPAIR_SHA256"
            check "$root/update-set/PACKAGE_MANIFEST.json" "$SEALED_PACKAGE_BYTES" "$SEALED_PACKAGE_SHA256"
          done
          echo 'P04_V258_R7_SEALED_SHA_BYTES_PASS'

      - name: Package Manifest and Production Source Manifest contracts
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          for build in a b; do
            (cd "build/v258-candidate-${build}/update-set" && sha256sum -c SHA256SUMS.txt)
          done
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          expected_prod=os.environ['SEALED_PRODUCTION_SOURCE_MANIFEST_SHA256']
          expected_runtime_files=int(os.environ['SEALED_RUNTIME_FILES'])
          expected_runtime_fingerprint=os.environ['SEALED_RUNTIME_FINGERPRINT']
          expected_artifacts={
            'VF_Infra_V2.5.8_FULL.zip':(int(os.environ['SEALED_FULL_BYTES']),os.environ['SEALED_FULL_SHA256']),
            'VF_Infra_V2.5.8_UPDATE.zip':(int(os.environ['SEALED_UPDATE_BYTES']),os.environ['SEALED_UPDATE_SHA256']),
            'VF_Infra_V2.5.8_ATOMIC.zip':(int(os.environ['SEALED_ATOMIC_BYTES']),os.environ['SEALED_ATOMIC_SHA256']),
            'repair-v2.5.8.php':(int(os.environ['SEALED_REPAIR_BYTES']),os.environ['SEALED_REPAIR_SHA256']),
            'PACKAGE_MANIFEST.json':(int(os.environ['SEALED_PACKAGE_BYTES']),os.environ['SEALED_PACKAGE_SHA256']),
          }
          expected_changed=[
            'VERSION.txt','index.php','scope-summary.php','domain-portfolio.php',
            'assets/v258-ui.css','assets/v258-view.js','assets/v258-nav.js',
            'app/Core/ScopeSummaryService.php','app/Core/DomainPortfolioQueryService.php','release-manifest.json',
          ]
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          for build in ('a','b'):
            root=pathlib.Path(f'build/v258-candidate-{build}')
            pkg_path=root/'update-set/PACKAGE_MANIFEST.json'
            pkg=json.loads(pkg_path.read_text(encoding='utf-8'))
            assertions={
              'version':pkg.get('version')=='2.5.8',
              'schema':int(pkg.get('schema',0))==14,
              'allowed_source_versions':pkg.get('allowed_source_versions')==['2.5.7'],
              'changed_files':pkg.get('changed_files')==expected_changed,
              'payload_file_count':int(pkg.get('payload_file_count',-1))==len(expected_changed),
              'schema_change':pkg.get('schema_change') is False,
              'business_model_change':pkg.get('business_model_change') is False,
              'provider_write_authority_change':pkg.get('provider_write_authority_change') is False,
              'deterministic_zip':pkg.get('deterministic_zip') is True,
              'atomic_asset_name':pkg.get('atomic_asset_name')=='VF_Infra_V2.5.8_ATOMIC.zip',
              'update_asset_name':pkg.get('update_asset_name')=='VF_Infra_V2.5.8_UPDATE.zip',
              'atomic_sha256':pkg.get('atomic_sha256')==os.environ['SEALED_ATOMIC_SHA256'],
              'atomic_bytes':int(pkg.get('atomic_bytes',-1))==int(os.environ['SEALED_ATOMIC_BYTES']),
              'update_sha256':pkg.get('update_sha256')==os.environ['SEALED_UPDATE_SHA256'],
              'update_bytes':int(pkg.get('update_bytes',-1))==int(os.environ['SEALED_UPDATE_BYTES']),
              'update_and_atomic_bytes_identical':pkg.get('update_and_atomic_bytes_identical') is True,
              'online_handoff_gate':pkg.get('online_handoff_gate')=='PASS',
              'production_source_manifest_sha256':pkg.get('production_source_manifest_sha256')==expected_prod,
            }
            bad=[k for k,v in assertions.items() if not v]
            if bad:
              raise SystemExit(f'R7_PACKAGE_MANIFEST_CONTRACT_FAIL_{build.upper()}: '+','.join(bad))
            cand_path=root/'V258_CANDIDATE_ARTIFACT_MANIFEST.json'
            cand=json.loads(cand_path.read_text(encoding='utf-8'))
            if cand.get('version')!='2.5.8' or int(cand.get('schema',0))!=14 or cand.get('source_version')!='2.5.7':
              raise SystemExit(f'R7_CANDIDATE_MANIFEST_IDENTITY_FAIL_{build.upper()}')
            if int(cand.get('runtime_file_count',-1))!=expected_runtime_files:
              raise SystemExit(f'R7_RUNTIME_FILE_COUNT_FAIL_{build.upper()}')
            if cand.get('runtime_fingerprint')!=expected_runtime_fingerprint:
              raise SystemExit(f'R7_RUNTIME_FINGERPRINT_FAIL_{build.upper()}')
            if cand.get('production_source_manifest_sha256')!=expected_prod:
              raise SystemExit(f'R7_PRODUCTION_SOURCE_MANIFEST_FAIL_{build.upper()}')
            if cand.get('update_atomic_identical') is not True:
              raise SystemExit(f'R7_CANDIDATE_MANIFEST_UPDATE_ATOMIC_FAIL_{build.upper()}')
            artifacts=cand.get('artifacts',{})
            for name,(size,digest) in expected_artifacts.items():
              row=artifacts.get(name,{})
              if int(row.get('bytes',-1))!=size or row.get('sha256')!=digest:
                raise SystemExit(f'R7_CANDIDATE_MANIFEST_SEALED_ARTIFACT_FAIL_{build.upper()}:{name}')
          print('P04_V258_R7_PACKAGE_MANIFEST_CONTRACT_PASS')
          print('P04_V258_R7_PRODUCTION_SOURCE_MANIFEST_CONTRACT_PASS')
          PY

      - name: Build public-safe R7 evidence
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def meta(p):
            p=pathlib.Path(p)
            return {'exists':p.is_file(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          a=pathlib.Path('build/v258-candidate-a'); b=pathlib.Path('build/v258-candidate-b')
          pairs={
            'FULL':('VF_Infra_V2.5.8_FULL.zip','VF_Infra_V2.5.8_FULL.zip'),
            'CANDIDATE_MANIFEST':('V258_CANDIDATE_ARTIFACT_MANIFEST.json','V258_CANDIDATE_ARTIFACT_MANIFEST.json'),
            'UPDATE':('update-set/VF_Infra_V2.5.8_UPDATE.zip','update-set/VF_Infra_V2.5.8_UPDATE.zip'),
            'ATOMIC':('update-set/VF_Infra_V2.5.8_ATOMIC.zip','update-set/VF_Infra_V2.5.8_ATOMIC.zip'),
            'REPAIR':('update-set/repair-v2.5.8.php','update-set/repair-v2.5.8.php'),
            'PACKAGE_MANIFEST':('update-set/PACKAGE_MANIFEST.json','update-set/PACKAGE_MANIFEST.json'),
            'SHA256SUMS':('update-set/SHA256SUMS.txt','update-set/SHA256SUMS.txt'),
          }
          evidence={
            'project':'P04 · VF Infra','gate':'V2.5.8 Artifact Determinism Repair Gate R7',
            'frozen_product_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'frozen_product_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'version':'2.5.8','schema':14,'migration':'NONE',
            'r6_candidate_product_verification':'PASS_RETAINED',
            'r6_artifact_determinism':'HARNESS_FALSE_POSITIVE_SUPERSEDED_BY_R7',
            'artifacts':{},
            'update_equals_atomic_a':'PASS','update_equals_atomic_b':'PASS',
            'sealed_sha_bytes':'PASS','package_manifest_contract':'PASS',
            'production_source_manifest':'PASS','runtime_files':165,
            'runtime_fingerprint':os.environ['SEALED_RUNTIME_FINGERPRINT'],
            'production_source_manifest_sha256':os.environ['SEALED_PRODUCTION_SOURCE_MANIFEST_SHA256'],
            'formal_artifact_pre_gate':'PASS_COMPLETE_R7_VERIFIED','candidate':'VERIFIED',
            'product_failure':'NONE','project_block':'NONE','main_write':'NO',
            'develop_promotion':'NO','tag':'NOT_CREATED','release':'NOT_CREATED',
            'core_updates':'NOT_WRITTEN','production_write':0,'dangerous_provider_remote_write':0,
            'v2_5_9':'NOT_CREATED','next':'STOP_FOR_MASTER',
          }
          for label,(ra,rb) in pairs.items():
            ma,mb=meta(a/ra),meta(b/rb)
            evidence['artifacts'][label]={'a':ma,'b':mb,'a_equals_b':ma['sha256']==mb['sha256'] and ma['bytes']==mb['bytes']}
          out=pathlib.Path('/tmp/p04-v258-r7-evidence'); out.mkdir(parents=True,exist_ok=True)
          (out/'R7_ARTIFACT_DETERMINISM_EVIDENCE.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(evidence,ensure_ascii=False,sort_keys=True))
          PY

      - name: Remove all private source and Candidate package bytes
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra
          test ! -e private-vf-infra

      - name: Upload public-safe R7 evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.5.8-Artifact-Determinism-R7-Evidence
          path: /tmp/p04-v258-r7-evidence
          if-no-files-found: error
          retention-days: 14
