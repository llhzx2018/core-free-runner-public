name: P07 Release11 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release11-readback-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: cb5fc9e0e85c548d383be9a95979c7d70a3a201a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Authority and regression gate
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'cb5fc9e0e85c548d383be9a95979c7d70a3a201a'
          test "$(cat BUILD_ID)" = '0.1.0-release11'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null
          python3 -m unittest -v tests.test_p07_integration_manifest
          grep -Fq '3f5210fc8c4123fe168298d6a85abfc47845ecf0' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq '9e4df79c2c6918d6d61d7413b1e856ddb162bcda' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq '0.1.0-rc18' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq 'release11 菜单 3 / 4 重构与恢复可靠性' docs/authority/CURRENT.md
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          python3 scripts/secret_scan.py --root .

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE11_READBACK_SOURCE=cb5fc9e0e85c548d383be9a95979c7d70a3a201a'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
