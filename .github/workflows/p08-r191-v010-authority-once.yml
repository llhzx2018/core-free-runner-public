name: P08 R191 v0.1.10 Mode R cross-repo authority plus real package preflight
on:
  pull_request:
    paths:
      - .github/workflows/p08-r191-v010-authority-once.yml
permissions:
  contents: read
jobs:
  authority-and-final-package:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r191-v010-governance-final-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P08_ISOLATED_INSTALL_TEST: YES
    steps:
      - name: Exact GOV-DOC PR200 Mode R with full Git parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: dd14025520deeaa823e1b098a5838864a1172531
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Exact P08 PR70 RP-07R with full Git parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1a2249c4c3a3661a5766061f3edcd2b1df0d3129
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p08
      - name: PHP 8.4 available for source unit and final build
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 locked source
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Effective text and actual diffs - validate no downgrade
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL,SECURITY,TESTING,UPGRADE,DATA_SCHEMA,GIT,UA_UI
            IMPACT_REASON: Scoped release input for material P08 one-click updater change; all current safety and machine applicability retained.
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = dd14025520deeaa823e1b098a5838864a1172531
          test "$(git -C p08 rev-parse HEAD)" = 1a2249c4c3a3661a5766061f3edcd2b1df0d3129
          test "$(cat p08/VERSION)" = 0.1.10
          python3 -B gov/governance/public-authority/tools/current_dependency_lint.py --root gov --git-base fb935f96ab36e4a3bf2e719e452b7058fdb03b16 --git-head dd14025520deeaa823e1b098a5838864a1172531
          python3 -B gov/governance/public-authority/tools/test_current_dependency_lint.py
          python3 -B gov/governance/public-authority/tools/public_authority_skill_bridge_lint.py --root gov
          python3 -B gov/governance/public-authority/tools/test_public_authority_skill_bridge_lint.py
          grep -q '### Mode R · ONE_CASE_P08_ADOPS_010_ONE_CLICK_ATOMIC_POST_RELEASE_OWNER_MANUAL' gov/skills/skill-release/V3.17/SKILL.md
          grep -q '## RP-07R · v0.1.10 / merged PR #69' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q 'OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q 'PRODUCTION_AUTO_APPLY=NO' gov/governance/release/cases/P08_ADOPS_010_PR69_ONE_CLICK_POST_RELEASE_OWNER_MANUAL_20261118.md
          git -C p08 diff --name-only c773e26f438318d4f81a0087bd075aa69f281ef4 HEAD | tee "$RUNNER_TEMP/p08-r191-changed-paths.txt"
          python3 - "$RUNNER_TEMP/p08-r191-changed-paths.txt" <<'PY'
          import sys
          changed=set(open(sys.argv[1]).read().splitlines())
          expected={"docs/authority/ACCEPTANCE_MATRIX.md","docs/authority/CURRENT.md","AGENTS.md"}
          assert changed==expected,(changed,expected)
          print("P08_R191_P08_PR70_DOC_ONLY_EXACT_SCOPE=PASS")
          PY
          echo P08_R191_GOV_V317_MODE_R_P08_RP07R_DEFER_HUMAN_ONLY=PASS
      - name: Actual executable Owner security and one-click source tests
        shell: bash
        env:
          GITHUB_ACTIONS: true
          P08_R187_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          php -l p08/src/Upgrade/OwnerFutureAtomicService.php
          php -l p08/app/Http/Controllers/OwnerFutureUpdateController.php
          php p08/tests/test_owner_future_one_click.php
          php p08/tests/test_owner_future_atomic_status.php
          php p08/tests/test_upgrade_throttle_isolation.php
          php p08/tests/test_site_domain_portability.php
          php p08/tests/test_owner_next_release_gateway.php
          echo P08_R191_OWNER_CSRF_ANTIREPLAY_ONE_CLICK=PASS
      - name: Exact locked frontend and source package smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          composer install --working-dir=p08 --no-dev --no-interaction --no-progress --no-scripts --optimize-autoloader --prefer-dist
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix p08
          npm run test:unit --prefix p08
          npm run build --prefix p08
          (cd p08 && composer check-platform-reqs --no-dev)
          python3 -B p08/scripts/check_stack_contract.py --phase full --root p08
          python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/r191-final-full-A.zip" --version 0.1.10 --source-sha 1a2249c4c3a3661a5766061f3edcd2b1df0d3129 --governance-root gov
          python3 -B p08/scripts/build_full.py --source p08 --output "$RUNNER_TEMP/r191-final-full-B.zip" --version 0.1.10 --source-sha 1a2249c4c3a3661a5766061f3edcd2b1df0d3129 --governance-root gov
          cmp "$RUNNER_TEMP/r191-final-full-A.zip" "$RUNNER_TEMP/r191-final-full-B.zip"
          unzip -p "$RUNNER_TEMP/r191-final-full-A.zip" FULL_MANIFEST.json | python3 -c 'import json,sys; j=json.load(sys.stdin); assert j["source_sha"]=="1a2249c4c3a3661a5766061f3edcd2b1df0d3129"; assert j["target_version"]=="0.1.10"; assert j["data_included"] is False'
          sha256sum "$RUNNER_TEMP/r191-final-full-A.zip"
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R191_SOURCE_BOUND_REPRODUCIBLE_FULL_AND_VITE=PASS
      - name: Cleanup all transient private source and package
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov
          rm -f -- "$RUNNER_TEMP"/r191-final-full-{A,B}.zip "$RUNNER_TEMP/p08-r191-changed-paths.txt"
          test ! -e p08 && test ! -e gov
