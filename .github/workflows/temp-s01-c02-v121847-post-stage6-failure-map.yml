name: TEMP S01-C02 Ops 1.21.847 Post Stage6 Failure Map
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-post-stage6-failure-map.yml'
jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      URL: https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness
    steps:
      - name: Read classified Final Audit failure map
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$URL" -o /tmp/static.json
          jq -c '{pluginVersion,candidatePackageReady,finalOnlinePass,nextBoundary,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobFailureCount,activeStaticJobWarningCount,activeStaticJobAuditFailureCount,activeStaticJobNonAuditFailureCount,activeStaticJobFailureSegmentCounts,activeStaticJobFailureSegmentStatus,activeStaticJobClassifiedFailureCount,activeStaticJobFailureSubtypeStatus,activeStaticJobFailureSubtypeLeafCount,activeStaticJobFailureSubtypeKnownCount,activeStaticJobFailureSubtypeOtherCount,activeStaticJobFailureSubtypeCounts,activeStaticJobInternalLinkTargetStatus,activeStaticJobInternalLinkFailureLeafCount,activeStaticJobInternalLinkUniqueTargetCount,activeStaticJobInternalLinkParsedLeafCount,activeStaticJobInternalLinkUnparsedLeafCount,activeStaticJobInternalLinkTargetFamilyCounts,sourceRecoveryZeroWriteRetryStatus,sourceRecoveryZeroWriteRetryCode,sourceRecoveryZeroWriteRetryCandidateStatus,sourceRecoveryZeroWriteRetryCandidateCurrentStage,sourceRecoveryZeroWriteRetryCandidateAuditFailureCount}' /tmp/static.json
          test "$(jq -r .pluginVersion /tmp/static.json)" = '1.21.847'
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_POST_STAGE6_FAILURE_MAP
