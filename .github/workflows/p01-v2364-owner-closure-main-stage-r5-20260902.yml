name: P01 V2.36.4 Owner Closure Main Authority R5
on:
  push:
    branches: [tmp/p01-v2364-owner-closure-patch-20260902]
    paths: [.github/workflows/p01-v2364-owner-closure-main-stage-r5-20260902.yml]
permissions:
  contents: read
jobs:
  stage-main-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAIN_BASE: 7edb03c97e036a6b1b646e9ee863e327fa8984e8
      DEVELOP_CLOSURE: 1190cb655ed392ea57a2d921b4447b5ccc7b880b
      STAGE_BRANCH: production/p01-v2364-owner-closure-main-20260902
      OWNER_FINAL_SHA: 78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271
      OWNER_PRECLOSURE_SHA: dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0
      CORE_P01_PROMOTION: 135f66c4eca08819840001f28dcd89869770085c
      CORE_REPO_HEAD: 36d700db5b63e079c2ca725544fe9f7b8e9ff024
      CORE_P01_BLOB: de1c805d55a4dbb52298ecc45625d2b7e9f43578
      FIX_CANDIDATE: 2f6b290c1bc86b3d961ef48d17e844cd269242db
      FIX_DEVELOP_MERGE: 0b7aa173d51ee17239716242e3e6b6f375428d2c
      FIX_PR: '192'
      FIX_GATE: '33528457499'
      FIX_ARTIFACT: '9808693721'
      FIX_DIGEST: sha256:c487cfca3f35714a05871d68dd4e01fafb0b44e5b92c502b7b42f5552b11412e
      OUT: /tmp/p01-v2364-owner-main-r5
    steps:
      - name: Checkout exact P01 main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN_BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01-main
      - name: Checkout exact develop closure evidence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.DEVELOP_CLOSURE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: p01-develop
      - name: Generate main-specific Authority closure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          cd p01-main
          test "$(git rev-parse HEAD)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_BASE"
          ! git ls-remote --exit-code --heads origin "refs/heads/$STAGE_BRANCH" >/dev/null 2>&1
          cp ../p01-develop/docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md
          python3 - <<'PY'
          from pathlib import Path
          import copy, hashlib, json, os

          project = Path('VF_PROJECT.json')
          before = json.loads(project.read_text(encoding='utf-8'))
          p = copy.deepcopy(before)
          current_change_before = copy.deepcopy(before.get('current_change'))
          schema_before = before.get('schema_version')
          working_schema_before = before.get('working_schema_version')

          p['status'] = 'V2.36.4 OWNER PRODUCTION / PUBLISHED / PRODUCTION CLOSURE PASS / DEVELOP AHEAD'
          p['production_version'] = '2.36.4'
          p['current_phase'] = 'V2.36.4 OWNER PRODUCTION CLOSURE PASS / L2 DEVELOP AHEAD'

          pub = p['published_release']
          pub['release_state'] = 'PUBLISHED / OWNER INSTALLED / PRODUCTION CLOSURE PASS'
          pub['owner_production_runtime'] = '2.36.4'
          pub['owner_production_schema'] = '2026082901'
          pub['owner_production_upgrade'] = '2.36.3 -> 2.36.4 / SUCCESS'
          pub['owner_version_readback'] = 'Current V2.36.4 / Latest V2.36.4 / history 2.36.3 -> 2.36.4 success'
          pub['owner_browser_footer_readback'] = 'V2.36.4 / PASS'
          pub['owner_terminal_ui_last_check'] = '2026-09-02 00:01:38'
          pub['owner_terminal_ui_screenshot_sha256'] = os.environ['OWNER_FINAL_SHA']
          pub['owner_terminal_ui_screenshot_size'] = '1319x641'
          pub['owner_online_state'] = 'CURRENT=LATEST / NO UPDATE AVAILABLE'
          pub['p01_manifest_promotion_commit'] = os.environ['CORE_P01_PROMOTION']
          pub['core_updates_repository_head_at_closure'] = os.environ['CORE_REPO_HEAD']
          pub['p01_manifest_blob_at_closure'] = os.environ['CORE_P01_BLOB']
          pub['production_closure'] = 'PASS'
          p['production_release'] = copy.deepcopy(pub)

          p['authority']['current_production_evidence'] = 'docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md'
          p['candidate_state'] = 'CURRENT PUBLISHED BASELINE / NO NEW RELEASE CANDIDATE / DEVELOP AHEAD'
          p['formal_release_state'] = 'V2.36.4 PUBLISHED / OWNER PRODUCTION V2.36.4 / PRODUCTION CLOSURE PASS'
          p['develop_state'] = 'V2.36.4 OWNER PRODUCTION BASELINE / DEVELOP AHEAD WITH UNRELEASED PR #192 TERMINAL FIX'
          p['current_authority'] = 'Owner Production V2.36.4 / Published Latest V2.36.4 / Production Closure PASS / develop ahead with unreleased terminal-state fix'
          p['next_action'] = 'Resume L2 Product Optimization from Fresh Owner/Runtime evidence; do not auto release or create V2.36.5 solely for the terminal-state fix.'

          p['develop_unreleased_terminal_fix'] = {
              'change_id': 'P01-UPDATE-TERMINAL-RUNTIME-CONFIRM-20260902',
              'type': 'BUG FIX / ONLINE UPDATE TERMINAL STATE',
              'product_candidate': os.environ['FIX_CANDIDATE'],
              'product_pr': int(os.environ['FIX_PR']),
              'develop_merge': os.environ['FIX_DEVELOP_MERGE'],
              'scope': ['src/assets/update-core.js'],
              'machine_gate': int(os.environ['FIX_GATE']),
              'evidence_artifact': int(os.environ['FIX_ARTIFACT']),
              'evidence_artifact_sha256': os.environ['FIX_DIGEST'],
              'behavior': 'WAIT FOR update_status.current_version >= target before cache-busted reload',
              'release': False,
              'main_write': False,
              'production_write': False,
              'state': 'DEVELOP ONLY / NOT RELEASED'
          }

          p['owner_production_activation_evidence'] = {
              'version': '2.36.4',
              'schema': '2026082901',
              'final_screenshot_sha256': os.environ['OWNER_FINAL_SHA'],
              'screenshot_size': '1319x641',
              'current': '2.36.4',
              'latest': '2.36.4',
              'footer': '2.36.4',
              'install_control': 'ABSENT',
              'check_control': 'PRESENT',
              'state': '已是最新版本。',
              'history': '2.36.3 -> 2.36.4 / success',
              'last_check': '2026-09-02 00:01:38',
              'terminal_ui_visual_closure': 'PASS',
              'preclosure_screenshot_sha256': os.environ['OWNER_PRECLOSURE_SHA'],
              'preclosure_classification': 'REAL TERMINAL-STATE STALE-RUNTIME BUG / superseded by final screenshot',
              'assistant_production_write': False
          }
          p['v2_36_4_owner_production_closure'] = {
              'status': 'PASS',
              'evidence': 'docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md',
              'final_screenshot_sha256': os.environ['OWNER_FINAL_SHA'],
              'preclosure_screenshot_sha256': os.environ['OWNER_PRECLOSURE_SHA'],
              'core_updates_p01_manifest_blob': os.environ['CORE_P01_BLOB'],
              'assistant_production_write': False,
              'main_src_mutation': False,
              'automatic_next_release': False
          }

          assert p['current_change'] == current_change_before, 'main current_change must remain production release context'
          assert p['schema_version'] == schema_before == '2026082901'
          assert p['working_schema_version'] == working_schema_before == '2026082901'
          assert p['published_release']['version'] == '2.36.4'
          assert p['production_release']['version'] == '2.36.4'
          assert p['production_release']['release_source'] == '6b321422bce5a834521786d8233149c7624aa014'
          project.write_text(json.dumps(p, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          section = '''<!-- P01_V2364_OWNER_PRODUCTION_CLOSURE -->
          ## V2.36.4 Owner Production Closure · 2026-09-02

          - Final Owner Readback：Current `V2.36.4` = Latest `V2.36.4`，状态 `已是最新版本。`，Footer `V2.36.4`，历史 `2.36.3 → 2.36.4 / success`，Last Check `2026-09-02 00:01:38`。
          - Final Screenshot：`1319×641` / SHA-256 `78e6af3e3fb189994cfe11a63bdd91889747c081ea223ded3390030bc7407271`；此前 stale terminal screenshot `dd74207b93c45afa6e9277a49a875dc6cea01f8c0e31194d8b1e74df7c178cf0` 仅保留为历史 BUG 证据。
          - V2.36.4 Formal Source `6b321422bce5a834521786d8233149c7624aa014` / Runtime Tree `e1ee914a6d9e61bac7931b1f5363a8c7e24e925a` / Release ID `380614937` / Schema `2026082901` 保持不变。
          - core-updates P01 Manifest 仍为严格 `V2.36.3 → V2.36.4`，blob `de1c805d55a4dbb52298ecc45625d2b7e9f43578`；本次 main Authority sync 不修改该 Manifest。
          - Online Update Terminal-State BUG 已在 develop PR `#192` 修复并通过 Gate `33528457499`，但该修复 **DEVELOP ONLY / NOT RELEASED**，不得进入本次 main Production runtime。
          - Verdict：**OWNER PRODUCTION V2.36.4 / PRODUCTION CLOSURE PASS**；Assistant direct Production write `NO`；本次 main sync 仅 Authority，不发 V2.36.5。

          > 以下旧段落保留历史证据；如与本段冲突，以本段为 Current Production Authority。'''
          def dedent_block(s):
              lines=s.splitlines(); ns=[len(x)-len(x.lstrip()) for x in lines if x.strip()]; n=min(ns) if ns else 0
              return '\n'.join(x[n:] if x.strip() else '' for x in lines).strip()+'\n'
          section=dedent_block(section)
          for rel in [Path('docs/authority/CURRENT.md'), Path('docs/handoff/CURRENT_STATE.md')]:
              text=rel.read_text(encoding='utf-8')
              marker='<!-- P01_V2364_OWNER_PRODUCTION_CLOSURE -->'
              assert marker not in text, rel
              pos=text.find('\n'); assert pos>=0
              rel.write_text(text[:pos+1]+'\n'+section+'\n'+text[pos+1:], encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort | tee "$OUT/changed.txt"
          cat > "$OUT/expected.txt" <<'EOF'
          VF_PROJECT.json
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md
          docs/handoff/CURRENT_STATE.md
          EOF
          diff -u "$OUT/expected.txt" "$OUT/changed.txt"
          ! grep -E '^src/' "$OUT/changed.txt"
          git diff -- src/assets/update-core.js > "$OUT/update-core.diff"
          test ! -s "$OUT/update-core.diff"
          git show "$MAIN_BASE:src/assets/update-core.js" | sha256sum | awk '{print $1}' > "$OUT/update-core-before.sha"
          sha256sum src/assets/update-core.js | awk '{print $1}' > "$OUT/update-core-after.sha"
          diff -u "$OUT/update-core-before.sha" "$OUT/update-core-after.sha"
          printf 'P01_V2364_OWNER_MAIN_AUTHORITY_GENERATION=PASS\nBASE=%s\nFILES=4\nCURRENT_CHANGE_PRESERVED=YES\nSCHEMA_UNCHANGED=YES\nSRC_MUTATION=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$MAIN_BASE" | tee "$OUT/generation-verdict.txt"
      - name: Commit and push isolated main Authority branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01-main
          test "$(git rev-parse HEAD)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_BASE"
          git switch -c "$STAGE_BRANCH"
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.36.4_OWNER_PRODUCTION_CLOSURE_20260902.md
          git diff --cached --name-only | sort > "$OUT/staged.txt"
          diff -u "$OUT/expected.txt" "$OUT/staged.txt"
          ! grep -E '^src/' "$OUT/staged.txt"
          git diff --cached --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P01): sync V2.36.4 Owner Production closure to main'
          STAGED=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$MAIN_BASE"
          git push origin "HEAD:refs/heads/$STAGE_BRANCH"
          test "$(git ls-remote origin refs/heads/$STAGE_BRANCH | awk '{print $1}')" = "$STAGED"
          printf 'P01_V2364_OWNER_MAIN_AUTHORITY_STAGE=PASS\nBASE=%s\nSTAGED=%s\nBRANCH=%s\nMAIN_WRITE=NO\nSRC_MUTATION=NO\n' "$MAIN_BASE" "$STAGED" "$STAGE_BRANCH" | tee "$OUT/stage-verdict.txt"
      - name: Upload main Authority staging evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-owner-main-authority-r5-${{ github.run_id }}
          path: /tmp/p01-v2364-owner-main-r5
          if-no-files-found: error
          retention-days: 90
