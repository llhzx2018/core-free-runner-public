name: p01-all-resources-r7-final-polish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-all-resources-r7-final-polish-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 1f04c97472ee0597fd1238e993839322443629ce
      TARGET_SHA: b362a4b06c6e2cafd17a4d505124bf87064584b7
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C baseline fetch -q --depth 1 origin "${BASE_SHA}"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.49"
          echo P01_ALL_RESOURCES_R7_EXACT_SOURCE=PASS

      - name: Verify bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          src/assets/admin-resource-manager.css
          tests/unit/admin_all_resources_final_polish_r7_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_ALL_RESOURCES_R7_BOUNDED_DIFF=PASS

      - name: Focused All Resources contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/admin_all_resources_final_polish_r7_contract.php
            tests/unit/admin_all_resources_readability_r6_contract.php
            tests/unit/admin_all_resources_scanability_r5_contract.php
            tests/unit/admin_all_resources_column_lock_r4_contract.php
            tests/unit/admin_all_resources_visual_alignment_r3_contract.php
            tests/unit/admin_all_resources_alignment_r2_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/admin_resource_browse_edit_r5_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/${t}"
            php "current/${t}"
          done
          echo P01_ALL_RESOURCES_R7_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_ALL_RESOURCES_R7_CANONICAL=PASS
