name: P01 V2.35.2 Main Promotion Gate

on:
  push:
    branches: [release/p01-v2352-main-promotion-20260831]
    paths: [.github/workflows/p01-v2352-main-promotion-20260831.yml]

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 3c9239be8bba34637411110f7fdb43f6e494c880
      EXPECTED_MAIN: 9619492252cedd804b0b9aaf8e5377430b21eabb
      CANDIDATE_RUN: '33347168167'
      FORMAL_RUN: '33347322224'
      STRICT_RUN: '33347594730'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Exact Promotion Gate and fast-forward main
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.35.2 >/dev/null 2>&1; then echo UNEXPECTED_V2352_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" --quiet
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$FORMAL_SOURCE"
          test "$(cat VERSION)" = '2.35.2'
          test "$(cat src/VERSION.txt)" = '2.35.2'
          grep -Fx "define('VF_VERSION', '2.35.2');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = '2026082901'
          test "$(jq -r .production_version VF_PROJECT.json)" = '2.35.1'
          grep -F 'Candidate Readiness Run: 33347168167 / PASS' docs/evidence/P01_V2.35.2_CANDIDATE_READINESS_20260831.md >/dev/null
          git push origin "$FORMAL_SOURCE:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$FORMAL_SOURCE"
          test "$REMOTE_DEVELOP" = "$FORMAL_SOURCE"
          printf 'P01_V2352_MAIN_PROMOTION=PASS\nMAIN=%s\nDEVELOP=%s\nCANDIDATE_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_RUN=%s\nTAG=ABSENT\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$REMOTE_DEVELOP" "$CANDIDATE_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2352-main-promotion.txt

      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2352-main-promotion-${{ github.run_id }}
          path: /tmp/p01-v2352-main-promotion.txt
          if-no-files-found: error
          retention-days: 30
