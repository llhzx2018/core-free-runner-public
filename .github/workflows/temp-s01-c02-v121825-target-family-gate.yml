name: TEMP S01-C02 Ops 1.21.825 Target Family Gate
on:
  push:
    branches:
      - temp/s01-c02-v121825-target-family-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121825-target-family-gate.yml'
permissions:
  contents: read
jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPS_SHA: 28e979580704fb9f6936a0f02d478cf8871ad15d
      BASE_SHA: 029d9059b22a5dfd1354db27cdc88c7a516777c9
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify exact identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = '1.21.825'
          grep -Fq ' * Version: 1.21.825' ops/vf-ops.php
          grep -Fq "define('VF_OPS_VERSION', '1.21.825')" ops/vf-ops.php
          grep -Fq "STATIC-CANDIDATE-INTERNAL-LINK-TARGET-FAMILY-READBACK-V1" ops/vf-ops.php
          php -l ops/includes/site-release/s01-static-internal-link-target-families-v121825.php
          php -l ops/.github/phase3/v121825-internal-link-target-family-readback.php
      - name: Run current and adjacent contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/.github/phase3/v121825-internal-link-target-family-readback.php | tee /tmp/v121825.txt
          grep -Fxq 'PASS_V121825_INTERNAL_LINK_TARGET_FAMILY_READBACK' /tmp/v121825.txt
          php ops/.github/phase3/v121824-candidate-failure-subtype-readback.php | tee /tmp/v121824.txt
          grep -Fxq 'PASS_V121824_CANDIDATE_FAILURE_SUBTYPE_READBACK' /tmp/v121824.txt
          php ops/.github/phase3/v121823-candidate-failure-segment-readback.php | tee /tmp/v121823.txt
          grep -Fxq 'PASS_V121823_CANDIDATE_FAILURE_SEGMENT_READBACK' /tmp/v121823.txt
      - name: Verify bounded read-only diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git -C ops diff --name-only "$BASE_SHA".."$OPS_SHA")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          for expected in \
            .github/phase3/v121825-internal-link-target-family-readback.php \
            VERSION \
            includes/site-release/s01-static-internal-link-target-families-v121825.php \
            vf-ops.php; do
            printf '%s\n' "${changed[@]}" | grep -Fxq "$expected"
          done
          runtime=ops/includes/site-release/s01-static-internal-link-target-families-v121825.php
          if grep -En 'update_option\(|delete_option\(|add_option\(|update_site_option\(|delete_site_option\(|wp_insert|wp_update|unlink\(|rename\(|copy\(' "$runtime"; then
            echo FORBIDDEN_STATE_WRITE >&2; exit 1
          fi
          if grep -En 'candidatePackageReady[[:space:]]*=|finalOnlinePass[[:space:]]*=|final_decision[[:space:]]*=|generation_result[[:space:]]*=' "$runtime"; then
            echo FORBIDDEN_GATE_RELAXATION >&2; exit 1
          fi
          grep -Fq "activeStaticJobInternalLinkTargetFamilyCounts" "$runtime"
          grep -Fq "activeStaticJobInternalLinkUnparsedLeafCount" "$runtime"
          echo PASS_BOUNDED_READ_ONLY_DIFF
      - name: Seal result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'S01_C02_V121825_TARGET_FAMILY_GATE=PASS'
          echo "OPS_SHA=$OPS_SHA"
          echo 'PUBLIC_TARGET_TEXT_EXPOSURE=NO'
          echo 'FULL_CANDIDATE_AUDIT_INPUT=YES'
          echo 'UNKNOWN_PARSE_FAIL_CLOSED=PASS'
          echo 'CANDIDATE_VERDICT_CHANGE=NO'
          echo 'PACKAGE_READINESS_CHANGE=NO'
          echo 'PRODUCTION_WRITE=NO'
          echo 'RUNNER_MAIN_WRITE=NO'
          echo 'FINAL_ONLINE_PASS=NO'
