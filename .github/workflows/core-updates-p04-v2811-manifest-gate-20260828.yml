name: Core Updates P04 V2.8.11 Manifest Gate

on:
  push:
    paths:
      - '.github/workflows/core-updates-p04-v2811-manifest-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPDATES_SOURCE: 01bde0e169b3a1bcd774acb7ccc0f56742f77050
      RELEASE_SOURCE: d6f1e0660ba859d160bc3393cc281bcbe186c779
      PRODUCT_TREE: 7adeb8045fa027b9bdc2a9956343dea516c27efe
      RELEASE_ID: '378421906'
      UPDATE_ASSET_ID: '533660511'
      UPDATE_BYTES: '1303637'
      UPDATE_SHA256: c5b11d1985039a4defb75835e809400e994b46801a38b01ee0439b89fc4317ab
      TAG: v2.8.11

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact core-updates source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SOURCE }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify manifest against remote release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          python3 - <<'PY'
          import json
          p=json.load(open('updates/projects/P04.json',encoding='utf-8'))
          assert p['schema_version']=='1.0'
          assert p['project_id']=='P04' and p['component_id']=='APP' and p['enabled'] is True
          assert p['target_version']=='2.8.11' and p['update_type']=='ATOMIC'
          assert p['from_versions']==['2.8.10']
          assert p['schema_from']=='14' and p['schema_to']=='14'
          assert p['repository']=='llhzx2018/vf-infra'
          assert p['release_tag']=='v2.8.11' and p['release_name']=='VF Infra V2.8.11'
          assert p['release_id']==378421906
          assert p['release_product_commit']=='d6f1e0660ba859d160bc3393cc281bcbe186c779'
          assert p['release_product_tree']=='7adeb8045fa027b9bdc2a9956343dea516c27efe'
          assert p['asset_name']=='VF_Infra_V2.8.11_UPDATE.zip'
          assert p['asset_id']==533660511 and p['asset_bytes']==1303637
          assert p['asset_sha256']=='c5b11d1985039a4defb75835e809400e994b46801a38b01ee0439b89fc4317ab'
          assert p['backup_required'] is True and p['rollback_supported'] is True
          assert p['minimum_php']=='8.0.0'
          PY

          RELEASE_JSON="$(gh api repos/llhzx2018/vf-infra/releases/tags/$TAG)"
          test "$(jq -r '.id' <<<"$RELEASE_JSON")" = "$RELEASE_ID"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.prerelease' <<<"$RELEASE_JSON")" = false
          test "$(jq -r '.name' <<<"$RELEASE_JSON")" = 'VF Infra V2.8.11'
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.name' <<<"$RELEASE_JSON")" = 'VF_Infra_V2.8.11_UPDATE.zip'
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.size' <<<"$RELEASE_JSON")" = "$UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.id=='"$UPDATE_ASSET_ID"')|.digest' <<<"$RELEASE_JSON")" = "sha256:$UPDATE_SHA256"
          test "$(gh api repos/llhzx2018/vf-infra/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          test "$(gh api repos/llhzx2018/vf-infra/git/commits/$RELEASE_SOURCE --jq '.tree.sha')" = "$PRODUCT_TREE"

          mkdir -p "$RUNNER_TEMP/p04-v2811-manifest"
          gh release download "$TAG" -R llhzx2018/vf-infra -p 'VF_Infra_V2.8.11_UPDATE.zip' -D "$RUNNER_TEMP/p04-v2811-manifest"
          FILE="$RUNNER_TEMP/p04-v2811-manifest/VF_Infra_V2.8.11_UPDATE.zip"
          test "$(stat -c %s "$FILE")" = "$UPDATE_BYTES"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "$UPDATE_SHA256"

          echo CORE_UPDATES_P04_V2811_MANIFEST_GATE=PASS
          echo CORE_UPDATES_SOURCE="$CORE_UPDATES_SOURCE"
          echo RELEASE_SOURCE="$RELEASE_SOURCE"
          echo UPDATE_ASSET_ID="$UPDATE_ASSET_ID"
          echo UPDATE_SHA256="$UPDATE_SHA256"
