name: P01 V2.37.1 Watch Cover Hotfix Gate R2
on:
  push:
    branches: [run/p01-v2371-watch-cover-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2371-watch-cover-hotfix-gate-20260902.yml
      - scripts/p01-v2371-watch-cover-hotfix-gate-20260902.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: hotfix/v2371-watch-cover-hydration-20260902
      BASE: fe0aaef44b163c4b899d802e73faa69d06b0f285
    steps:
      - name: Fresh product fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/$PRODUCT_REPO/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/$PRODUCT_REPO/git/ref/heads/$PRODUCT_BRANCH --jq .object.sha)" = "$BASE"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: run/p01-v2371-watch-cover-hotfix-20260902
          path: runner
      - name: Execute hotfix gate
        shell: bash
        run: bash runner/scripts/p01-v2371-watch-cover-hotfix-gate-20260902.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-watch-cover-hotfix-r2-${{ github.run_id }}
          path: |
            /tmp/verdict.txt
            /tmp/real-verdict.txt
            /tmp/poster-url.txt
          if-no-files-found: warn
          retention-days: 90
