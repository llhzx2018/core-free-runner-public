name: P02 V2.4.26 Core Updates Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.26-core-updates-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_REF: eff8fd5e13c67eb13f611ba71e96bda384662b0d
      PRODUCT_REF: 9c62b0f348958777fdaba251316cd76a867358af
      RELEASE_ID: '372138026'
      UPDATE_NAME: VF_Library_V2.4.26_UPDATE.zip
      UPDATE_BYTES: '299595'
      UPDATE_SHA256: ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
    steps:
      - name: Require registered private read capability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }
          echo REGISTERED_PRIVATE_READ=PASS

      - name: Checkout exact core-updates manifest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Checkout exact V2.4.26 product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: v2.4.26
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product

      - name: Validate current update authority
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_REF"
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          python3 - <<'PY'
          import json,os
          m=json.load(open('updates/projects/P02.json',encoding='utf-8'))
          expected={
            'schema_version':'1.0','project_id':'P02','component_id':'APP','enabled':True,
            'current_version':'2.4.25','target_version':'2.4.26','update_type':'ATOMIC',
            'from_versions':['2.4.25'],'schema_from':'2401','schema_to':'2401',
            'repository':'llhzx2018/vf-library','release_tag':'v2.4.26','release_id':372138026,
            'product_identity':os.environ['PRODUCT_REF'],'asset_name':os.environ['UPDATE_NAME'],
            'asset_bytes':int(os.environ['UPDATE_BYTES']),'asset_sha256':os.environ['UPDATE_SHA256'],
            'backup_required':True,'rollback_supported':True,'released_at':'2026-08-18T06:44:09Z'
          }
          for k,v in expected.items(): assert m.get(k)==v,(k,m.get(k),v)
          print('CORE_UPDATES_AUTHORITY=PASS')
          PY

      - name: Remote GitHub Release and asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release view v2.4.26 --repo llhzx2018/vf-library --json databaseId,tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1])); assert int(x['databaseId'])==int(os.environ['RELEASE_ID']); assert x['tagName']=='v2.4.26' and not x['isDraft'] and not x['isPrerelease']
          assets={a['name']:a for a in x['assets']}; a=assets[os.environ['UPDATE_NAME']]; assert int(a['size'])==int(os.environ['UPDATE_BYTES'])
          print('REMOTE_RELEASE_METADATA=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/readback"
          gh release download v2.4.26 --repo llhzx2018/vf-library --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c %s "$RUNNER_TEMP/readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo REMOTE_UPDATE_BYTES_SHA256=PASS

      - name: UpdateCore availability and package verification
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/check.php" <<'PHP'
          <?php
          require getcwd().'/product/src/app/CoreUpdates/UpdateCore.php';
          $manifest=json_decode(file_get_contents(getcwd().'/updates/projects/P02.json'),true);
          $core=new \CoreUpdates\UpdateCore('P02','APP');
          $available=$core->check('2.4.25','2401',$manifest);
          $verified=$core->verifyPackage(getenv('RUNNER_TEMP').'/readback/'.getenv('UPDATE_NAME'),$manifest);
          $latest=$core->check('2.4.26','2401',$manifest);
          $wrongSchema=$core->check('2.4.25','9999',$manifest);
          echo json_encode(['available'=>$available,'verified'=>$verified,'latest'=>$latest,'wrong_schema'=>$wrongSchema],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE),"\n";
          if(($available['status']??'')!=='AVAILABLE')exit(2);
          if(($verified['status']??'')!=='VERIFIED')exit(3);
          if(($latest['status']??'')!=='UP_TO_DATE')exit(4);
          if(($wrongSchema['status']??'')!=='BLOCKED_SCHEMA')exit(5);
          PHP
          RUNNER_TEMP="$RUNNER_TEMP" UPDATE_NAME="$UPDATE_NAME" php "$RUNNER_TEMP/check.php"
          echo CORE_UPDATES_RUNTIME_READINESS=PASS

      - name: Public-safe readiness evidence
        if: always()
        run: |
          echo P02=VF_Library
          echo CURRENT=2.4.25
          echo TARGET=2.4.26
          echo CORE_UPDATES_REF=eff8fd5e13c67eb13f611ba71e96bda384662b0d
          echo RELEASE_ID=372138026
          echo UPDATE_BYTES=299595
          echo UPDATE_SHA256=ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
          echo PRODUCTION_WRITE=NO
          echo PRIVATE_SOURCE_PERSISTED=NO
