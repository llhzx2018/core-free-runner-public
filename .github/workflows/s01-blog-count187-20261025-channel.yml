name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-blog-count187-20261025]
    paths: ['.github/workflows/s01-blog-count187-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.187
  TARGET_SHA: 2823bc1b0a368094afc8589cb2c8437461f1f17d
  UPDATE_SHA: 9e40d2c48d104962121acb6234ea1b2bf2c564cc
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 9e40d2c48d104962121acb6234ea1b2bf2c564cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='464f4c42a0c9118234e08dbac26f54e15279e2e86b52758800239d8b87e98c16' and m['asset_bytes']==1991662
          assert m['runtime_files']==476 and '1.35.186' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
