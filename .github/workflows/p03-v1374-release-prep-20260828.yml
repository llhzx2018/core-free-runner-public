name: P03 V1.37.4 Release Prep
on:
  push:
    branches: [task/p03-v1374-common-baseline-release-20260828]
    paths: ['.github/workflows/p03-v1374-release-prep-20260828.yml']
permissions: {contents: read}
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout P03 release branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: release/p03-v1.37.4-common-baseline-v2-20260828
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product
      - name: Prepare V1.37.4 exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = cc9a6da445240534016d08e148aa8a28c11be241
          git fetch origin main
          test "$(git rev-parse origin/main)" = cc9a6da445240534016d08e148aa8a28c11be241
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          (root/'VERSION').write_text('1.37.4\n',encoding='utf-8')
          p=root/'src/app/bootstrap.php'; s=p.read_text(encoding='utf-8')
          assert "define('VFAB_VERSION', '1.37.3');" in s
          p.write_text(s.replace("define('VFAB_VERSION', '1.37.3');","define('VFAB_VERSION', '1.37.4');",1),encoding='utf-8')
          p=root/'scripts/build_atomic.py'; s=p.read_text(encoding='utf-8')
          assert "TARGET_VERSION='1.37.3'" in s and "ALLOWED_SOURCES=['1.37.2']" in s
          s=s.replace("TARGET_VERSION='1.37.3'","TARGET_VERSION='1.37.4'",1).replace("ALLOWED_SOURCES=['1.37.2']","ALLOWED_SOURCES=['1.37.3']",1)
          p.write_text(s,encoding='utf-8')
          c=root/'CHANGELOG.md'; s=c.read_text(encoding='utf-8')
          heading='## V1.37.4 - 2026-08-28\n'
          if not s.startswith(heading):
              block='''## V1.37.4 - 2026-08-28\n\n- 正式交付 Common Product Baseline V2：统一 System Info / System Baseline / Runtime Health / Online Update / Backup-Restore 运维语义。\n- 采用 PERSONAL_SINGLE_ADMIN 会话基线与高风险 Step-up，补齐 Logging / Health / Cache / Locale 等运行事实呈现。\n- 保持 Portfolio Intelligence Bootstrap、Project Intelligence、MCP 与现有资产边界不变；不建立第二套 Truth Store。\n- Schema 30 保持不变；Migration NONE；正式升级来源为 V1.37.3。\n\n'''
              c.write_text(block+s,encoding='utf-8')
          vf=root/'VF_PROJECT.json'; d=json.loads(vf.read_text(encoding='utf-8'))
          assert d['project_id']=='P03' and d['schema_version']==30
          d['status']='V1.37.3 PRODUCTION / V1.37.4 CANDIDATE / COMMON BASELINE V2 RELEASE'
          d['project_status']='CANDIDATE_VERIFICATION'; d['lifecycle']='CANDIDATE'
          d['production_version']='1.37.3'; d['working_version']='1.37.4'; d['candidate_version']='1.37.4'
          d['version_semantics'].update({'target':'1.37.4','change_class':'PATCH / COMMON PRODUCT BASELINE V2 RELEASE','allowed_source_versions':['1.37.3'],'schema_from':30,'schema_to':30,'database_migration':'NONE'})
          d['product_identity'].update({'installed_production_version':'1.37.3','candidate_version':'1.37.4','candidate_branch':'release/p03-v1.37.4-common-baseline-v2-20260828','candidate_source_commit':'PENDING_EXACT_SOURCE_AFTER_RELEASE_IDENTITY_COMMIT','release_tag':None,'release_asset':None,'meaning':'V1.37.3 remains Production Truth. V1.37.4 packages the already machine-verified Common Product Baseline V2 runtime changes for formal release.'})
          d['production_truth'].update({'installed_version':'1.37.3','installed_schema':30,'owner_real_use_status':'RUNNING / OWNER VERIFIED','remaining_issue':'COMMON_PRODUCT_BASELINE_V2_NOT_YET_RELEASED_TO_PRODUCTION','production_upgrade_to_1_37_4':'NOT_AUTHORIZED_YET','production_write':'NO'})
          d['verification'].update({'final_exact':'COMMON_BASELINE_V2_MAIN_PASS / RELEASE_IDENTITY_GATE_PENDING','atomic_from_version':'1.37.3','atomic_target_version':'1.37.4','atomic_schema':'30_TO_30','atomic_migration':'NONE','formal_release':'NOT_STARTED','core_updates':'NOT_STARTED','production_write':'NO','common_baseline_v2_runtime_gate_run_id':33098729384,'common_baseline_v2_final_gate_run_id':33099096264,'common_baseline_v2_current_main':'cc9a6da445240534016d08e148aa8a28c11be241'})
          d['release'].update({'installed_production_version':'1.37.3','candidate_version':'1.37.4','release_ready':'NO / FORMAL GATE PENDING','release_tag':None,'asset_name':None,'core_updates':'NOT_STARTED','owner_upgrade_authorized':False,'production_write':False})
          d['git_alignment'].update({'mode':'RELEASE CANDIDATE VERIFICATION','production_main_version':'1.37.3','working_candidate_version':'1.37.4','force_push':False,'history_rewrite':False})
          d['current_phase']='V1.37.4 FORMAL RELEASE VERIFICATION'; d['current_verdict']='CANDIDATE / FORMAL GATE PENDING'
          d['production_real_use_pass']='V1.37.3 RUNNING / OWNER VERIFIED'; d['runtime_change']='COMMON PRODUCT BASELINE V2 RELEASE CANDIDATE'; d['version_change']='1.37.3 -> 1.37.4 CANDIDATE'; d['production_write']='NO'; d['next_action']='RUN V1.37.4 EXACT SOURCE / FRESH INSTALL / ATOMIC / BROWSER / COMMON BASELINE V2 FORMAL GATE'
          vf.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          test "$(cat VERSION)" = 1.37.4
          grep -q "VFAB_VERSION', '1.37.4'" src/app/bootstrap.php
          grep -q "TARGET_VERSION='1.37.4'" scripts/build_atomic.py
          grep -q "ALLOWED_SOURCES=\['1.37.3'\]" scripts/build_atomic.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='1.37.3' and d['candidate_version']=='1.37.4'
          assert d['schema_version']==30 and d['production_write']=='NO'
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/app/bootstrap.php scripts/build_atomic.py CHANGELOG.md VF_PROJECT.json
          git commit -m 'release(P03): prepare V1.37.4 Common Baseline V2 source'
          git push origin HEAD:release/p03-v1.37.4-common-baseline-v2-20260828
          echo P03_V1374_RELEASE_PREP=PASS
