name: P07 Care rc47 WordPress safe summary formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc47-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): rc47 WordPress evidence owner UX closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified Public Distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact source, frozen menus and 16 completed machine gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '0f40b98b6d528d84b1e77459ed5d5bdd82592a5d'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc47'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc47'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '44e39f47baf34f4d49feefcac0e95acf58854402'
          test "$(git hash-object "$pkg/vf-system-care.sh")" = '41e358246be9351cac8134f1cdc7cd2618ae5e1c'
          test "$(git hash-object "$pkg/lib/intrusion_evidence.py")" = '25744863c157b4c58719bfed4dbe22457aff8aa7'
          (cd "$pkg" && while read -r sha path; do test "$(git hash-object "$path")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq "VERSION='0.1.0-rc47'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='44e39f47baf34f4d49feefcac0e95acf58854402'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc47"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'run_action intrusion-evidence-entry.sh menu' "$pkg/vf-system-care.sh"
          ! grep -Fq 'run_action intrusion-evidence-entry.sh direct' "$pkg/vf-system-care.sh"
          grep -Fq '5. 查看完整异常记录' "$pkg/intrusion-evidence.sh"
          grep -Fq 'helper report --summary' "$pkg/intrusion-evidence.sh"
          grep -Fq 'helper report --limit 20' "$pkg/intrusion-evidence.sh"
          for id in 37768278623 37768278440 37768278390 37768278311 37768278479 37768278569 37768278434 37768278360 37768278419 37768278425 37768278358 37768278513 37768278483 37768278368 37768278471 37768278506; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '45f9563aa0712beeec3bfadb15321ec9ea66c2a3'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_CARE_RC47_FORMAL_PRECONDITIONS=PASS
      - name: Publish formal immutable release and confirm remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc47-wp-evidence-summary'
          target='0f40b98b6d528d84b1e77459ed5d5bdd82592a5d'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · rc47 WordPress 网站安全状态与异常摘要' \
              --notes 'OWNER 提供了 18 条历史 WordPress 文件变更与重复关联请求，原菜单 4→6 一进入就执行扫描且输出全部事件、每项三条重复请求，严重破坏一屏可读性。rc47 将入口改为先显示已保存状态，不在打开页面时自动扫描；对人工立即扫描后的结果改为按网站和事件类型汇总，一屏最多显示 5 个网站并保留总数。独立原层级菜单 2 查看摘要、5 查看全部原始事件与请求关联，证据 JSON 与历史记录不删除、不篡改、不假定攻击已成立。提供明确警告：文件变化不等于已确认入侵，请求关联仅作线索；未经核实不可重建参考状态，仍需原有人工确认。后台定时任务与扫描防护逻辑未变。菜单1/2/3/5及菜单4其他已稳定功能冻结。16/16 隔离 Machine Gates PASS，Production 不自动修改，OWNER 实机验收独立。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_CARE_RC47_FORMAL_RELEASE=PASS
