name: TEMP P07 conditional SQL DDL exact-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-conditional-ddl-proof.yml'
permissions:
  contents: read
jobs:
  p07-sql-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate registered read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact private P07 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 16d71e4d63efedf48d0432c4b3fec91b930ee3d1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-p07-private
      - name: Check exact source and focused data safety regressions
        working-directory: transient-p07-private
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 16d71e4d63efedf48d0432c4b3fec91b930ee3d1
          test "$(cat BUILD_ID)" = 0.1.0-release91
          python3 -m py_compile lib/server_migration_pull.py tests/test_server_migration_pull.py
          PYTHONPATH=lib python3 -m unittest -v tests.test_server_migration_pull tests.test_verify tests.test_mariadb_owner_policy
          echo P07_CONDITIONAL_DDL_EXACT_SOURCE_PASS
      - name: Erase transient private code
        if: always()
        run: |
          rm -rf -- transient-p07-private
          echo P07_PRIVATE_RUNTIME_CLEANUP_DONE
