name: TEMP S01-C02 Ops 1.21.824 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121824-update-channel-gate-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121824-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATES_REPO: llhzx2018/core-updates
      UPDATES_BASE: 098599b71c81c54b5c5a715455790c1c056831d9
      UPDATES_CANDIDATE: cf46456a7e594c5a57459b16c13fae21219f8a41
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_COMMIT: 029d9059b22a5dfd1354db27cdc88c7a516777c9
      OPS_TREE: 0ecd0ab40a980d34d329ab3c18a76417a0d998b8
      TAG: v1.21.824
      ASSET: vf-tools-ops_V1.21.824.zip
      BYTES: '3239835'
      SHA256: a6f1caa2fa3c78c2b859f600eea629f40a25b6172566eee6a02a2d938a3bed0e
      FILES: '906'
      FP: cf9c7eb0e6424da09ab8794026783da04c9af37496e54319bb6850fc14dab691
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates

      - name: Verify manifest source scope and formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$R"
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_CANDIDATE"
          git -C updates diff --name-only "$UPDATES_BASE" "$UPDATES_CANDIDATE" | sort >/tmp/changed.txt
          printf '%s\n' 'projects/S01-C02.json' >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          M=updates/projects/S01-C02.json
          jq -e --arg sha "$SHA256" --arg fp "$FP" '.target_version=="1.21.824" and .from_versions==["1.21.823"] and .release_tag=="v1.21.824" and .asset_name=="vf-tools-ops_V1.21.824.zip" and .asset_bytes==3239835 and .asset_sha256==$sha and .runtime_files==906 and .runtime_file_count==906 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$M" >/dev/null
          grep -Fq 'Production Upgrade is NOT EXECUTED' "$M"
          grep -Fq 'read-only observability' "$M"
          grep -Fq 'Candidate verdict, final_decision, package readiness and final online freeze are unchanged' "$M"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$J")" = "$TAG"
          test "$(jq -r .draft <<<"$J")" = false
          test "$(jq -r .prerelease <<<"$J")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$J")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$J")" = "sha256:$SHA256"
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$OPS_COMMIT"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$OPS_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$OPS_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$OPS_TREE"
          done
          echo FORMAL_RELEASE_ASSET=PASS

      - name: Verify direct Production source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          D=/tmp/domain.json
          CODE="$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$D" -w '%{http_code}' 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          test "$CODE" = 200
          jq -e '.pluginVersion=="1.21.823" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' "$D" >/dev/null
          S=/tmp/static.json
          CODE="$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -o "$S" -w '%{http_code}' 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          test "$CODE" = 200
          jq -e '.pluginVersion=="1.21.823" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .candidatePackageReady==false and .manualSourceUploadRequired==false and .finalOnlinePass=="NO"' "$S" >/dev/null
          echo DIRECT_SOURCE_1_21_823_ONLY=PASS
          echo PASS_V121824_UPDATE_CHANNEL_GATE
