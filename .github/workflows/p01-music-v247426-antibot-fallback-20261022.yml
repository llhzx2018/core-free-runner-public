name: P01 Music V2.47.426 YouTube Anti-bot Fallback HTTP
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-music-v247426-antibot-fallback-20261022.yml']
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/p01-music-v247426-antibot-fallback-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: PHP SQLite isolated runtime
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Fetch P01 exact Music front-entry candidate
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          git clone -q --depth 1 --no-checkout \
            "https://x-access-token:${PRIVATE_READ}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin 3a33eaa466c9c79393581916ed2d5fa2e0a4de67
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C candidate rev-parse HEAD)" = 3a33eaa466c9c79393581916ed2d5fa2e0a4de67
          test -z "$(git -C candidate status --porcelain)"
          test "$(tr -d '\\r\\n ' <candidate/VERSION)" = '2.47.426'
          test "$(tr -d '\\r\\n ' <candidate/src/VERSION.txt)" = '2.47.426'
          echo P01_MUSIC_FRONT_EXACT_SOURCE=PASS
      - name: Lint and real HTTP owner/guest/CSP/nav/playlist contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for p in src/music-home.php src/app/WorkspaceViewCatalog.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/app/SurfaceShell.php src/app/MusicDemoCatalog.php; do
            php -l "candidate/$p"
          done
          (cd candidate && for contract in \
            tests/unit/consolidated_product_acceptance_contract.php \
            tests/unit/engineering_consistency_r80_contract.php \
            tests/unit/public_global_nav_contract.php \
            tests/unit/public_home_owner_shell_unified_v247390_contract.php \
            tests/unit/workspace_view_catalog_contract.php; do php "$contract"; done)
          echo P01_MUSIC_FIVE_CANONICAL_REGRESSION_GATES=PASS
          grep -F 'body.vf-music-listening-subsite .vf-app-stage{' candidate/src/assets/music-home.css
          grep -F 'margin-left:0!important;' candidate/src/assets/music-home.css
          node candidate/tests/unit/music_player_fallback_contract.js
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_FRONT_REAL_HTTP_GATE=PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_MUSIC_FRONT_PRIVATE_CLEANUP=PASS
