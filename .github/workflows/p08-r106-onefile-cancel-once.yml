name: P08 R106 onefile build and offline foreign bridge cancellation once
on:
  pull_request:
    paths: [.github/workflows/p08-r106-onefile-cancel-once.yml]
permissions:
  contents: read
jobs:
  onefile-and-preactivation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R106_EXACT_SOURCE: 74be1ea6673efd87af5df08ff46be0ddff79a634
    steps:
      - name: Exact temporary private source from registered read capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 74be1ea6673efd87af5df08ff46be0ddff79a634
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Canonical shared delivery source exact governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Native PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Locked Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax and negative non-root onefile contract
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "$P08_R106_EXACT_SOURCE"
          test "$(git -C gov-current rev-parse HEAD)" = 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          for file in src/Upgrade/FlatLayoutBridgePrepare.php \
            src/Upgrade/FlatLayoutBridgeActivation.php \
            src/Upgrade/R102CloudPanelOfflineGuard.php \
            src/Upgrade/R106Installed012Source.php \
            src/Upgrade/r106-offline-bootstrap-cli.php \
            tests/compatibility/r106_official012_to_updater_bridge.php; do
            php -l "p08-private/$file" > "$RUNNER_TEMP/r106-lint.log" 2>&1 || {
              echo R106_ONEFILE_PHP_SYNTAX=FAIL; exit 1;
            }
          done
          bash -n p08-private/scripts/r106_cloudpanel_bridge012_once.sh
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          path=Path('p08-private/scripts/build_r106_onefile.py')
          ast.parse(path.read_text(), filename=path.as_posix())
          PY
          echo R106_ONEFILE_SOURCE_PHP_BASH_PYTHON_SYNTAX=PASS
      - name: Independently build genuine indexed updater bridge runtime from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          build="$RUNNER_TEMP/p08-r106-onefile-build-tree"
          mkdir -m 0700 "$build"
          git -C p08-private archive HEAD | tar -x -C "$build"
          cd "$build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r106-composer.log" 2>&1 || {
            echo R106_ONEFILE_COMPOSER_LOCKED_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_NPM_LOCKED_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r106-full.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-onefile-build-tree'
          full=Path(os.environ['RUNNER_TEMP'])/'r106-onefile-bridge-full.zip'
          gov=Path('gov-current').resolve()
          sha=os.environ['P08_R106_EXACT_SOURCE']
          verify_canonical_full_contract(source,full,sha,gov,'resolve')
          write_full(built,full,'0.1.2',sha)
          verify_canonical_full_contract(source,full,sha,gov,'delivery')
          PY
            echo R106_ONEFILE_CANONICAL_FULL_GATE=FAIL
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r106-full.log'
          raw=p.read_text(errors='replace') if p.exists() else ''
          codes=sorted(set(re.findall(r'\b(?:FULL|CONTRACT|P08|R106)_[A-Z0-9_]{4,90}\b',raw)))
          print("R106_ONEFILE_SAFE_CODES="+",".join(codes[-12:]))
          reasons=re.findall(r'CONTRACT_REASON=([A-Z][A-Z0-9_]{2,100})',raw)
          print("R106_ONEFILE_GATE_REASON="+(reasons[-1] if reasons else "NOT_PROVEN"))
          if not codes:
              print("R106_ONEFILE_EXEC_EXCEPTION="+("PYTHON_EXCEPTION" if 'Traceback' in raw else 'OTHER'))
          PY
            exit 1;
          }
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          echo R106_ONEFILE_DISTINCT_BRIDGE_CANONICAL_FULL=PASS
      - name: Full official 0.1.2 real bytes and safe cancellation under offline proof
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r106-onefile-official.zip"
          test "$(wc -c < "$RUNNER_TEMP/r106-onefile-official.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r106-onefile-official.zip" | sha256sum --check --status
          site="$RUNNER_TEMP/p08-r106-official-012-site-cancel"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-official.zip" -d "$site"
          if ! php p08-private/tests/compatibility/r106_official012_to_updater_bridge.php \
            cancel "$site" "$RUNNER_TEMP/p08-r106-updater-bridge-onefile" "$P08_R106_EXACT_SOURCE" \
            > "$RUNNER_TEMP/r106-cancel.log" 2>&1; then
            echo R106_ONEFILE_OFFLINE_CANCEL_TEST=FAIL
            grep -E '^R106_BRIDGE_FAILURE=' "$RUNNER_TEMP/r106-cancel.log" | tail -1 || true
            exit 1
          fi
          grep -Fxq 'R106_ISSUED_012_EXTERNAL_BRIDGE_OFFLINE_CANCEL_OWNER_PRESERVED=PASS' "$RUNNER_TEMP/r106-cancel.log"
          echo R106_ONEFILE_OWNER_OFFLINE_CANCEL_AND_DATA_INTACT=PASS
      - name: Build exact self-contained onefile twice and verify deterministic digest and missing-root refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 0700 "$RUNNER_TEMP/r106-onefile-a" "$RUNNER_TEMP/r106-onefile-b"
          python3 -B p08-private/scripts/build_r106_onefile.py \
            --bridge-full-zip "$RUNNER_TEMP/r106-onefile-bridge-full.zip" \
            --output-dir "$RUNNER_TEMP/r106-onefile-a" \
            > "$RUNNER_TEMP/r106-a.log" 2>&1 || {
              echo R106_ONEFILE_PRIMARY_BUILD=FAIL; exit 1;
            }
          python3 -B p08-private/scripts/build_r106_onefile.py \
            --bridge-full-zip "$RUNNER_TEMP/r106-onefile-bridge-full.zip" \
            --output-dir "$RUNNER_TEMP/r106-onefile-b" \
            > "$RUNNER_TEMP/r106-b.log" 2>&1 || {
              echo R106_ONEFILE_REPEAT_BUILD=FAIL; exit 1;
            }
          shaA="$(sha256sum "$RUNNER_TEMP/r106-onefile-a/r106_cloudpanel_bridge012_once.sh" | cut -d' ' -f1)"
          shaB="$(sha256sum "$RUNNER_TEMP/r106-onefile-b/r106_cloudpanel_bridge012_once.sh" | cut -d' ' -f1)"
          test "$shaA" = "$shaB"
          test "$(wc -c < "$RUNNER_TEMP/r106-onefile-a/r106_cloudpanel_bridge012_once.sh")" -gt 1000000
          if bash "$RUNNER_TEMP/r106-onefile-a/r106_cloudpanel_bridge012_once.sh" \
            --activate --ack-global-service-outage /home/kewaro-adops/htdocs/adops.kewaro.com \
            kewaro-adops 8.4 > "$RUNNER_TEMP/r106-negative.log" 2>&1; then
            echo R106_ONEFILE_NONROOT_GUARD=FAIL; exit 1
          fi
          grep -Fxq 'R106_CLOUDPANEL=BLOCKED:EXPLICIT_ROOT_AND_GLOBAL_OUTAGE_ACK_REQUIRED' "$RUNNER_TEMP/r106-negative.log"
          grep -Fxq 'R106_OWNER_INSTALL_AUTHORIZED=NO' "$RUNNER_TEMP/r106-a.log"
          echo R106_ONEFILE_BUILD_DETERMINISM_AND_NONROOT_REFUSAL=PASS
          echo R106_ONEFILE_OWNER_READY=NO
          echo R106_REAL_CLOUDPANEL_SUPERVISOR_POSITIVE=NOT_PROVEN
      - name: Always purge private transient sources and synthetic Owner data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private gov-current "$RUNNER_TEMP"/p08-r106-onefile-build-tree "$RUNNER_TEMP"/p08-r106-updater-bridge-onefile "$RUNNER_TEMP"/p08-r106-official-012-site-cancel "$RUNNER_TEMP"/r106-onefile-a "$RUNNER_TEMP"/r106-onefile-b
          rm -f -- "$RUNNER_TEMP"/r106-*.zip "$RUNNER_TEMP"/r106-*.log
          echo R106_ONEFILE_PRIVATE_ARTIFACT_AND_FIXTURES_PURGED=YES
