name: P01 Content Kinds Auto Covers Patch R2
on:
  push:
    branches: [temp/p01-content-kinds-auto-covers-20260831]
    paths:
      - .github/workflows/p01-content-kinds-auto-covers-patch-r2-20260831.yml
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE: a429d2660c165feae51a46f2144f8de6bda3961f
      TARGET_BRANCH: product/p01-content-kinds-auto-covers-20260831
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Assert exact base and prepare deterministic duplicate hint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test -z "$(git -C product status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/app/SurfaceShell.php');s=p.read_text(encoding='utf-8')
          old='<span>封面 <small>可选 · 选择后自动压缩</small></span>'
          if s.count(old)!=2: raise SystemExit(f'expected 2 cover hints, got {s.count(old)}')
          first=s.find(old);second=s.find(old,first+1)
          s=s[:second]+s[second:].replace(old,'<span>封面 <small>可上传新图替换</small></span>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply product patch
        run: python3 runner/scripts/p01_content_kinds_auto_covers_20260831.py
      - name: Syntax and semantic contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in product/src/app/ResourceMetadata.php product/src/app/ResourceCoverCache.php product/src/app/SurfaceRepository.php product/src/app/SurfaceShell.php product/src/app/FunctionalWorkspace.php product/src/app/FunctionalWorkspaceShell.php product/src/resource-cover-refresh.php; do php -l "$f"; done
          node --check product/src/assets/workspace.js
          ! grep -R "\$kind = 'YouTube'" product/src/app/SurfaceRepository.php
      - name: Exact changed-file fence including new files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git add -N src/app/ResourceCoverCache.php src/app/ResourceMetadata.php src/resource-cover-refresh.php
          git diff --check
          git diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          src/app/FunctionalWorkspace.php
          src/app/FunctionalWorkspaceShell.php
          src/app/ResourceCoverCache.php
          src/app/ResourceMetadata.php
          src/app/SurfaceRepository.php
          src/app/SurfaceShell.php
          src/assets/workspace.js
          src/resource-cover-refresh.php
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git diff --name-only | grep '^src/migrations/' || true)"
      - name: Commit Product branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/app/ResourceCoverCache.php src/app/ResourceMetadata.php src/app/SurfaceRepository.php src/app/SurfaceShell.php src/assets/workspace.js src/resource-cover-refresh.php
          git commit -m 'feat(P01): separate content kinds and auto-cache covers'
          git push origin HEAD:${TARGET_BRANCH}
