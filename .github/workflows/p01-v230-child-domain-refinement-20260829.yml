name: P01 V2.30 Child Domain Refinement
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-child-domain-refinement-20260829.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 394c510a26fd28b5749594ae36270f9d784e43c1
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
      PORT: '18575'
      ROOT: /tmp/p01-v230-child
      ADMIN_PASS: 'P01V230!Child'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
      - name: Refine child-domain shell
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          shell=Path('source/src/app/FunctionalWorkspaceShell.php')
          s=shell.read_text(encoding='utf-8')
          old='    <div class="vf-nav-section"><span>快捷入口</span></div>\n    <nav class="vf-secondary-nav vf-quick-nav" aria-label="快捷入口">'
          new='    <?php if($mode===\'all\'): ?>\n    <div class="vf-nav-section"><span>快捷入口</span></div>\n    <nav class="vf-secondary-nav vf-quick-nav" aria-label="快捷入口">'
          assert old in s
          s=s.replace(old,new,1)
          old='    </nav>\n\n    <?php if($admin): ?>\n    <section class="vf-sidebar-scope-section" aria-label="可见范围">'
          new='    </nav>\n    <?php endif; ?>\n\n    <?php if($admin): ?>\n    <section class="vf-sidebar-scope-section" aria-label="可见范围">'
          assert old in s
          s=s.replace(old,new,1)
          assert '>网址管理</span></a>' in s
          s=s.replace('>网址管理</span></a>','>资源管理</span></a>',1)
          old='<?php if($admin): ?><span class="vf-context-chip <?=$scope===\'private\'?\'private\':\'\'?>"><?=vf_fw_scope_label($scope)?></span><?php endif; ?>'
          new='<?php if($admin&&$scope!==\'all\'): ?><span class="vf-context-chip <?=$scope===\'private\'?\'private\':\'\'?>"><?=vf_fw_scope_label($scope)?></span><?php endif; ?>'
          assert old in s
          s=s.replace(old,new,1)
          old='  </div>\n</section>\n<?php\n}\n\nfunction vf_fw_render_mobile_filters'
          new='  </div>\n  <?php if($admin): ?><button type="button" class="vf-mobile-add-action" data-open-add>＋ 添加</button><?php endif; ?>\n</section>\n<?php\n}\n\nfunction vf_fw_render_mobile_filters'
          assert old in s
          s=s.replace(old,new,1)
          shell.write_text(s,encoding='utf-8')

          workspace=Path('source/src/app/FunctionalWorkspace.php')
          s=workspace.read_text(encoding='utf-8')
          old='placeholder="搜索标题、网址、分类或标签" autocomplete="off"'
          new='placeholder="<?=vf_fw_h($mode===\'start\'?\'搜索标题、网址、分类或标签\':\'搜索标题、分类或标签\')?>" autocomplete="off"'
          assert old in s
          workspace.write_text(s.replace(old,new,1),encoding='utf-8')

          css=Path('source/src/assets/workspace-domain-nav.css')
          s=css.read_text(encoding='utf-8')
          assert '.vf-mobile-add-action' not in s
          s=s.replace('.vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px);padding:4px 0;border-left:0;border-right:0;border-radius:0;background:transparent}', '.vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px);padding:4px 0;border-left:0;border-right:0;border-radius:0;background:transparent}\n.vf-mobile-add-action{display:none}',1)
          old='  .vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + 58px);padding-inline:0}\n}'
          new='  .vf-functional-workspace .vf-app-topbar.vf-domain-subbar{display:none}\n  .vf-functional-workspace .vf-workspace-toolbar{top:var(--ws-domain-nav);padding-inline:0}\n  .vf-mobile-add-action{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border:1px solid var(--ws-teal);border-radius:7px;background:var(--ws-teal);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}\n}'
          assert old in s
          css.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l source/src/app/FunctionalWorkspace.php >/dev/null
          git -C source diff --check
          grep -F "if(\$mode==='all')" source/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F '资源管理' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'vf-mobile-add-action' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          echo P01_V230_CHILD_REFINEMENT_PATCH=PASS
      - name: Fresh authenticated smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v230-child.cookies
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-child-server.log 2>&1 &
          COOKIE=/tmp/p01-v230-child.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v230-child-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v230-child-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V230 Child UX' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-v230-child-setup-post.html
          grep -F 'VF Start 安装完成' /tmp/p01-v230-child-setup-post.html >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login" -o /tmp/p01-v230-child-login.json
          jq -e '.ok==true' /tmp/p01-v230-child-login.json >/dev/null
          for page in start.php channels.php watch.php topics.php; do
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/${page}" -o "/tmp/${page}.html"
            ! grep -F '<span>快捷入口</span>' "/tmp/${page}.html" >/dev/null
            grep -F '资源管理' "/tmp/${page}.html" >/dev/null
            grep -F 'vf-mobile-add-action' "/tmp/${page}.html" >/dev/null
            ! grep -F '>全部</span></div>' "/tmp/${page}.html" >/dev/null || true
          done
          curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/surfaces.php" -o /tmp/surfaces.php.html
          grep -F '<span>快捷入口</span>' /tmp/surfaces.php.html >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          echo P01_V230_CHILD_REFINEMENT_RUNTIME=PASS
      - name: Commit product branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/app/FunctionalWorkspace.php src/assets/workspace-domain-nav.css
          git commit -m 'refine(P01): simplify V2.30 child domain navigation'
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "P01_V230_CHILD_SOURCE=$(git rev-parse HEAD)"
          echo "P01_V230_CHILD_TREE=$(git rev-parse HEAD^{tree})"
          echo P01_V230_CHILD_REFINEMENT_GATE=PASS
