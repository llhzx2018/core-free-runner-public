name: P01 V2.23.0 Main Promotion Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v230-main-promotion-gate-20260828.yml']
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
      TREE: 8bc7b4c2f643566d3688ecdeda74a47c320cbc2f
      MAIN: 45503b3a6483ea89a6b076822b3661a9b32bcbf4
      DEVELOP: a421248b38e2dcbf2fe2769cbddc1fcb899f4059
      RELEASE_GATE: '33147285602'
      ARTIFACT_GATE: '33147403831'
      ARTIFACT_ID: '9676306756'
    steps:
      - name: Readback refs and PASS evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN"
          test "$(git -C product rev-parse origin/develop)" = "$DEVELOP"
          git -C product cat-file -e "$RELEASE^{commit}"
          test "$(git -C product rev-parse "$RELEASE^{tree}")" = "$TREE"
          git -C product merge-base --is-ancestor "$DEVELOP" "$RELEASE"
          test "$(git -C product show "$RELEASE:VERSION"|tr -d '\r\n')" = 2.23.0
          for run in "$RELEASE_GATE" "$ARTIFACT_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID" | jq -e '.name=="P01-V2.23.0-FORMAL-ARTIFACTS" and .expired==false' >/dev/null
          echo P01_V230_MAIN_PROMOTION=PASS
          echo PRODUCTION=NO
