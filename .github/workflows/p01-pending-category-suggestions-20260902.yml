name: P01 L2 Pending Category Suggestions
on:
  push:
    branches: [run/p01-pending-category-suggestions-20260902]
    paths: [.github/workflows/p01-pending-category-suggestions-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-pending-category-suggestions-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-pending-category-suggestions-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product fetch origin develop
          test "$(git -C product rev-parse HEAD)" = e04529d80bd2f50eed617331441eb337a11f3e93
          test "$(git -C product rev-parse origin/develop)" = e04529d80bd2f50eed617331441eb337a11f3e93
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_pending_category_suggestions_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/SurfaceRepository.php >/dev/null
          php -l src/surface-manager.php >/dev/null
          php -l src/app/FunctionalWorkspace.php >/dev/null
          php -l src/app/FunctionalHome.php >/dev/null
          git diff --check
          grep -F 'public function categorySuggestions' src/app/SurfaceRepository.php >/dev/null
          grep -F "(int)(\$asset['is_pending'] ?? 0) !== 1" src/app/SurfaceRepository.php >/dev/null
          grep -F '同一网站过去 ' src/app/SurfaceRepository.php >/dev/null
          grep -F '系统只建议，不会自动移动' src/surface-manager.php >/dev/null
          grep -F "bulkLinks([\$id],'organize',\$categoryId)" src/surface-manager.php >/dev/null
          grep -F '<h2>待整理网址</h2>' src/surface-manager.php >/dev/null
          grep -F '<h2>资源域归属建议</h2>' src/surface-manager.php >/dev/null
          grep -F '不等同于“待整理”' src/surface-manager.php >/dev/null
          grep -F "(int)(\$asset['is_pending']??0)===1" src/app/FunctionalWorkspace.php >/dev/null
          grep -F "(int)(\$asset['is_pending'] ?? 0) === 1" src/app/FunctionalHome.php >/dev/null
          grep -F '<b>待整理</b>' src/app/FunctionalHome.php >/dev/null
          ! grep -F '$surfaceRepo->suggestions(300):[];$pending=' src/app/FunctionalWorkspace.php >/dev/null
          ! grep -F '$suggestions = $surfaceRepo->suggestions(300);' src/app/FunctionalHome.php >/dev/null
          ! grep -E 'apply(Category|category).*Suggestion|auto.*category' src/surface-manager.php src/app/SurfaceRepository.php >/dev/null
          grep -F '.vf-inbox-category-select' src/assets/surface-workspace.css >/dev/null
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          test -z "$(git diff --name-only -- VERSION src/VERSION.txt VF_PROJECT.json database src/migrations)"
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/SurfaceRepository.php src/assets/surface-workspace.css src/surface-manager.php | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Verify deterministic suggestion behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php <<'PHP'
          <?php
          require 'src/app/SurfaceRepository.php';
          $ref=new ReflectionClass(VfSurfaceRepository::class);$repo=$ref->newInstanceWithoutConstructor();
          $categories=[
            ['id'=>1,'parent_id'=>null,'name'=>'工具','depth'=>0],
            ['id'=>2,'parent_id'=>1,'name'=>'AI','depth'=>1],
            ['id'=>3,'parent_id'=>1,'name'=>'开发','depth'=>1],
            ['id'=>9,'parent_id'=>null,'name'=>'待整理','depth'=>0],
          ];
          $assets=[
            ['id'=>1,'surface'=>'start','is_pending'=>0,'category_id'=>2,'category_name'=>'AI','title'=>'ChatGPT','url'=>'https://chatgpt.com/a','description'=>'','tags'=>[]],
            ['id'=>2,'surface'=>'start','is_pending'=>0,'category_id'=>2,'category_name'=>'AI','title'=>'ChatGPT Docs','url'=>'https://chatgpt.com/b','description'=>'','tags'=>[]],
            ['id'=>3,'surface'=>'start','is_pending'=>0,'category_id'=>2,'category_name'=>'AI','title'=>'ChatGPT Team','url'=>'https://chatgpt.com/c','description'=>'','tags'=>[]],
            ['id'=>10,'surface'=>'start','is_pending'=>1,'category_id'=>9,'category_name'=>'待整理','title'=>'ChatGPT Pricing','url'=>'https://www.chatgpt.com/pricing','description'=>'','tags'=>[]],
            ['id'=>11,'surface'=>'start','is_pending'=>1,'category_id'=>9,'category_name'=>'待整理','title'=>'AI Search','url'=>'https://example.com/ai','description'=>'','tags'=>['AI']],
            ['id'=>12,'surface'=>'start','is_pending'=>0,'category_id'=>3,'category_name'=>'开发','title'=>'Ignore','url'=>'https://ignore.test','description'=>'','tags'=>[]],
          ];
          $rows=$repo->categorySuggestions($assets,$categories,50);$by=[];foreach($rows as $row)$by[$row['link_id']]=$row;
          if(($by[10]['category_id']??0)!==2||($by[10]['confidence']??0)!==97)exit(21);
          if(($by[11]['category_id']??0)!==2||($by[11]['confidence']??0)!==88)exit(22);
          if(isset($by[12]))exit(23);
          echo "CATEGORY SUGGESTIONS PASS\n";
          PHP
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/SurfaceRepository.php src/assets/surface-workspace.css src/surface-manager.php
          git commit -m 'feat(P01): make Pending a real classification inbox'
          git push origin HEAD:product/p01-pending-category-suggestions-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
