name: P01 V2.33 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2330-formal-artifact-gate-20260830.yml
      - scripts/p01-v2330-build-formal-artifacts.py
      - scripts/p01-v2330-formal-gate.sh
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout V2.33 formal release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 8c819c8bfd055d16b3ac367cef15f723431d9a42
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout V2.32 immutable production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.32.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Bind release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git -C candidate rev-parse HEAD^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git -C candidate rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          test "$(git -C production rev-parse HEAD)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(git -C production rev-parse HEAD^{tree})" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          git -C candidate fetch origin main --quiet
          test "$(git -C candidate rev-parse refs/remotes/origin/main)" = b63b6605a723e4e8d34dfb3368e0e7dd993558a6
          if git -C candidate ls-remote --exit-code --tags origin refs/tags/v2.33.0 >/dev/null 2>&1; then echo UNEXPECTED_V233_TAG; exit 1; fi
          echo P01_V2330_MAIN_PREPROMOTION_AUTHORITY=PASS
          echo P01_V2330_TAG_ABSENT=PASS
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Exact source and formal artifact gate
        shell: bash
        run: bash runner/scripts/p01-v2330-formal-gate.sh
      - name: Assemble immutable formal artifact contract
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC=/tmp/p01-v2330-formal-artifacts
          EVID=/tmp/p01-v2330-formal-evidence
          OUT=/tmp/p01-v2330-formal-contract
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/VF-Start-V2.33.0-FULL.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.33.0_UPDATE.zip" "$OUT/"
          cp "$SRC/VF_Start_V2.33.0_UPDATE.zip" "$OUT/VF-Start-V2.33.0-UPDATE.zip"
          cp "$SRC/repair-v2.33.0.php" "$OUT/"
          cp "$EVID/repair-self-test.json" "$OUT/atomic-self-test.json"
          cp "$SRC/P01-V2.33.0-FORMAL-GATE.json" "$OUT/P01-V2.33.0-ARTIFACT-GATE.json"
          FULL_SHA=$(sha256sum "$OUT/VF-Start-V2.33.0-FULL.zip" | awk '{print $1}')
          UPDATE_SHA=$(sha256sum "$OUT/VF_Start_V2.33.0_UPDATE.zip" | awk '{print $1}')
          REPAIR_SHA=$(sha256sum "$OUT/repair-v2.33.0.php" | awk '{print $1}')
          FULL_BYTES=$(stat -c%s "$OUT/VF-Start-V2.33.0-FULL.zip")
          UPDATE_BYTES=$(stat -c%s "$OUT/VF_Start_V2.33.0_UPDATE.zip")
          REPAIR_BYTES=$(stat -c%s "$OUT/repair-v2.33.0.php")
          jq -n --arg project_id P01 --arg version 2.33.0 --arg source_version 2.32.0 \
            --arg release_source 8c819c8bfd055d16b3ac367cef15f723431d9a42 \
            --arg release_tree db5a6e2b6a852e6925727b974fb7130359e3cdf8 \
            --arg product_source faf853ab897c9e9b080dd365ab54df7698a8428c \
            --arg product_tree f81d776da1fa92d04acd31ccbe6444cb1d9f0d43 \
            --arg runtime_tree febc1b01a5b59963bc974cdc6455cfa824c0adc3 \
            --arg source_commit 120a42667fce7357fdaef03b64cb7ea41392040d --arg schema 2026082901 \
            --arg full_sha "$FULL_SHA" --arg update_sha "$UPDATE_SHA" --arg repair_sha "$REPAIR_SHA" \
            --argjson full_bytes "$FULL_BYTES" --argjson update_bytes "$UPDATE_BYTES" --argjson repair_bytes "$REPAIR_BYTES" \
            '{project_id:$project_id,version:$version,source_version:$source_version,release_source:$release_source,release_tree:$release_tree,product_source:$product_source,product_tree:$product_tree,runtime_tree:$runtime_tree,source_commit:$source_commit,source_schema:$schema,schema:$schema,schema_change:false,schema_migrations:[],formal_artifact_gate:"PASS",actual_upgrade:"PASS",data_preservation:"PASS",idempotence:"PASS",rollback:"PASS",interruption_recovery:"PASS",fresh_install:"PASS",health_triage_gate:"33267181746 PASS",candidate_readiness_gate:"33268162412 PASS",remote_online_update_http:"PENDING_AFTER_PUBLICATION",release_published:false,owner_production_write:false,full:{name:"VF-Start-V2.33.0-FULL.zip",bytes:$full_bytes,sha256:$full_sha},update:{name:"VF_Start_V2.33.0_UPDATE.zip",bytes:$update_bytes,sha256:$update_sha,inner:"repair-v2.33.0.php"},repair:{name:"repair-v2.33.0.php",bytes:$repair_bytes,sha256:$repair_sha}}' > "$OUT/P01-V2.33.0-FORMAL-METADATA.json"
          (cd "$OUT" && sha256sum P01-V2.33.0-ARTIFACT-GATE.json P01-V2.33.0-FORMAL-METADATA.json VF-Start-V2.33.0-FULL.zip VF-Start-V2.33.0-UPDATE.zip VF_Start_V2.33.0_UPDATE.zip atomic-self-test.json repair-v2.33.0.php > SHA256SUMS.txt)
          test "$(find "$OUT" -maxdepth 1 -type f | wc -l)" = 8
          php -l "$OUT/repair-v2.33.0.php" >/dev/null
          unzip -Z1 "$OUT/VF_Start_V2.33.0_UPDATE.zip" | grep -Fx repair-v2.33.0.php >/dev/null
          echo "FORMAL_FULL_SHA256=$FULL_SHA"
          echo "FORMAL_FULL_BYTES=$FULL_BYTES"
          echo "FORMAL_UPDATE_SHA256=$UPDATE_SHA"
          echo "FORMAL_UPDATE_BYTES=$UPDATE_BYTES"
          echo "FORMAL_REPAIR_SHA256=$REPAIR_SHA"
          echo "FORMAL_REPAIR_BYTES=$REPAIR_BYTES"
          echo P01_V2330_FORMAL_ARTIFACT_CONTRACT=PASS
      - name: Upload formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-formal-artifacts-8c819c8bfd055d16b3ac367cef15f723431d9a42
          path: /tmp/p01-v2330-formal-contract
          if-no-files-found: error
          retention-days: 90
      - name: Upload upgrade evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2330-formal-evidence-8c819c8bfd055d16b3ac367cef15f723431d9a42
          path: /tmp/p01-v2330-formal-evidence
          if-no-files-found: error
          retention-days: 30
      - name: Verdict
        shell: bash
        run: |
          echo P01_V2330_FORMAL_RELEASE_SOURCE=8c819c8bfd055d16b3ac367cef15f723431d9a42
          echo P01_V2330_FORMAL_RELEASE_TREE=db5a6e2b6a852e6925727b974fb7130359e3cdf8
          echo P01_V2330_RUNTIME_TREE=febc1b01a5b59963bc974cdc6455cfa824c0adc3
          echo P01_V2330_FORMAL_ARTIFACT_GATE=PASS
          echo P01_V2330_READY_FOR_MAIN_PROMOTION=YES
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
