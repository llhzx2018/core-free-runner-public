name: P04 V2.8.1 Formal Candidate Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v281-formal-candidate.yml'
      - 'requests/p04-v281-formal-candidate.txt'

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '01a6027c7730db64a64ca7f7de4553498c1672e8'
  TARGET_VERSION: '2.8.1'
  SCHEMA: '14'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_SOURCE_CREDENTIAL=PASS'

      - name: Checkout exact V2.8.1 Candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Exact source health and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$TARGET_VERSION"
          python3 candidate/scripts/repository-health-gate.py
          python3 candidate/scripts/check-migrations.py
          python3 -m py_compile candidate/scripts/build-release-tree.py candidate/scripts/build-v281-update-release.py
          find candidate/src candidate/public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find candidate/public/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo 'P04_V281_SOURCE_HEALTH=PASS'

      - name: Build deterministic runtime and FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          R1="$RUNNER_TEMP/p04-v281-runtime-a"
          R2="$RUNNER_TEMP/p04-v281-runtime-b"
          python3 candidate/scripts/build-release-tree.py "$R1" --source-root candidate | tee "$RUNNER_TEMP/p04-v281-build-a.log"
          python3 candidate/scripts/build-release-tree.py "$R2" --source-root candidate | tee "$RUNNER_TEMP/p04-v281-build-b.log"
          diff -ru "$R1" "$R2"
          test "$(tr -d '\r\n' < "$R1/VERSION.txt")" = '2.8.1'
          python3 - "$R1/release-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['version']=='2.8.1'
          assert m['target_schema']==14
          assert m['release_kind']=='maintenance_release'
          assert m['file_count']==len(m['files'])
          print('P04_V281_RELEASE_MANIFEST=PASS')
          print('RUNTIME_FINGERPRINT='+m['source_fingerprint'])
          PY
          python3 - "$R1" "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          cp "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL.zip" "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL_A.zip"
          python3 - "$R2" "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL_B.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel=p.relative_to(root).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          cmp "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL_A.zip" "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL_B.zip"
          echo "RUNTIME=$R1" >> "$GITHUB_ENV"
          echo 'P04_V281_FULL_DETERMINISTIC=PASS'

      - name: Build deterministic dual-source Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          O1="$RUNNER_TEMP/p04-v281-update-a"
          O2="$RUNNER_TEMP/p04-v281-update-b"
          python3 candidate/scripts/build-v281-update-release.py --target-runtime "$RUNTIME" --output "$O1" | tee "$RUNNER_TEMP/p04-v281-update-a.log"
          python3 candidate/scripts/build-v281-update-release.py --target-runtime "$RUNTIME" --output "$O2" | tee "$RUNNER_TEMP/p04-v281-update-b.log"
          cmp "$O1/VF_Infra_V2.8.1_UPDATE.zip" "$O2/VF_Infra_V2.8.1_UPDATE.zip"
          cmp "$O1/VF_Infra_V2.8.1_ATOMIC.zip" "$O1/VF_Infra_V2.8.1_UPDATE.zip"
          php "$O1/repair-v2.8.1.php" --self-test | tee "$RUNNER_TEMP/p04-v281-selftest.log"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.1 schema=14' "$RUNNER_TEMP/p04-v281-selftest.log"
          python3 - "$O1/PACKAGE_MANIFEST.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['version']=='2.8.1'
          assert m['schema']==14
          assert m['allowed_source_versions']==['2.7.9','2.8.0']
          assert m['release_kind']=='branding_compatibility_bugfix'
          assert m['schema_change'] is False
          assert m['provider_write_authority_change'] is False
          print('P04_V281_DUAL_SOURCE_PACKAGE=PASS')
          PY
          cp "$O1/VF_Infra_V2.8.1_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.1_UPDATE.zip"
          cp "$O1/PACKAGE_MANIFEST.json" "$RUNNER_TEMP/V281_PACKAGE_MANIFEST.json"
          cp "$O1/SHA256SUMS.txt" "$RUNNER_TEMP/V281_SHA256SUMS.txt"
          echo "UPDATE_DIR=$O1" >> "$GITHUB_ENV"
          echo 'P04_V281_UPDATE_DETERMINISTIC=PASS'

      - name: Download immutable source FULL baselines
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v279" "$RUNNER_TEMP/v280"
          gh release download v2.7.9 -R llhzx2018/vf-infra --pattern 'VF_Infra_V2.7.9_FULL.zip' --dir "$RUNNER_TEMP/v279"
          gh release download v2.8.0 -R llhzx2018/vf-infra --pattern 'VF_Infra_V2.8.0_FULL.zip' --dir "$RUNNER_TEMP/v280"
          test -s "$RUNNER_TEMP/v279/VF_Infra_V2.7.9_FULL.zip"
          test -s "$RUNNER_TEMP/v280/VF_Infra_V2.8.0_FULL.zip"
          echo 'SOURCE_FULL_BASELINES=PASS'

      - name: Source-exact 2.7.9 to 2.8.1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/scripts/full-runtime-vs-update-result-source-exact-gate.py \
            --baseline-full "$RUNNER_TEMP/v279/VF_Infra_V2.7.9_FULL.zip" \
            --candidate-full "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL.zip" \
            --candidate-update "$RUNNER_TEMP/VF_Infra_V2.8.1_UPDATE.zip" \
            --expected-source-version 2.7.9 \
            --expected-target-version 2.8.1
          echo 'P04_V279_TO_V281_SOURCE_EXACT=PASS'

      - name: Source-exact 2.8.0 to 2.8.1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/scripts/full-runtime-vs-update-result-source-exact-gate.py \
            --baseline-full "$RUNNER_TEMP/v280/VF_Infra_V2.8.0_FULL.zip" \
            --candidate-full "$RUNNER_TEMP/VF_Infra_V2.8.1_FULL.zip" \
            --candidate-update "$RUNNER_TEMP/VF_Infra_V2.8.1_UPDATE.zip" \
            --expected-source-version 2.8.0 \
            --expected-target-version 2.8.1
          echo 'P04_V280_TO_V281_SOURCE_EXACT=PASS'

      - name: Real Branding write-read-reset on exact runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p04-v281-private"
          chmod 700 "$RUNNER_TEMP/p04-v281-private"
          cat > "$RUNTIME/config.php" <<PHP
          <?php
          return [
            'app_name'=>'VF Infra Candidate',
            'base_url'=>'http://localhost',
            'allowed_hosts'=>['localhost'],
            'host_mode'=>'serve_all',
            'trusted_proxy_ips'=>[],
            'rdap_allow_http'=>false,
            'data_path'=>'$RUNNER_TEMP/p04-v281-private',
            'timezone'=>'Asia/Shanghai',
            'app_key'=>'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef',
            'session_name'=>'vf_infra_v281_candidate',
          ];
          PHP
          chmod 600 "$RUNTIME/config.php"
          php candidate/tests/integration/common_branding_contract_v279.php "$RUNTIME" | tee "$RUNNER_TEMP/p04-v281-branding.log"
          grep -Fxq 'PASS logo_1024_square_accepted' "$RUNNER_TEMP/p04-v281-branding.log"
          grep -Fxq 'PASS favicon_1024_square_accepted' "$RUNNER_TEMP/p04-v281-branding.log"
          grep -Fxq 'PASS reset_to_default' "$RUNNER_TEMP/p04-v281-branding.log"
          grep -Fxq 'P04_V281_COMMON_BRANDING_CONTRACT_PASS' "$RUNNER_TEMP/p04-v281-branding.log"
          echo 'P04_V281_REAL_BRANDING_E2E=PASS'

      - name: Emit candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,os,pathlib,json
          full=pathlib.Path(os.environ['RUNNER_TEMP'])/'VF_Infra_V2.8.1_FULL.zip'
          upd=pathlib.Path(os.environ['RUNNER_TEMP'])/'VF_Infra_V2.8.1_UPDATE.zip'
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          print('P04_V281_FORMAL_CANDIDATE_GATE=PASS')
          print('SOURCE_SHA='+os.environ['SOURCE_COMMIT'])
          print('FULL_BYTES='+str(full.stat().st_size))
          print('FULL_SHA256='+sha(full))
          print('UPDATE_BYTES='+str(upd.stat().st_size))
          print('UPDATE_SHA256='+sha(upd))
          print('SCHEMA=14')
          print('ALLOWED_SOURCES=2.7.9,2.8.0')
          print('PRODUCTION_WRITE=0')
          print('RELEASE_WRITE=0')
          PY

      - name: Upload exact candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.1-FORMAL-CANDIDATE
          path: |
            ${{ runner.temp }}/VF_Infra_V2.8.1_FULL.zip
            ${{ runner.temp }}/VF_Infra_V2.8.1_UPDATE.zip
            ${{ runner.temp }}/V281_PACKAGE_MANIFEST.json
            ${{ runner.temp }}/V281_SHA256SUMS.txt
            ${{ runner.temp }}/p04-v281-*.log
          if-no-files-found: warn
          retention-days: 14
