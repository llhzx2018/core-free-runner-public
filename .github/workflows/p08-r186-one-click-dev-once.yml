name: P08 R186 one-click Atomic developer regression exact private source
on:
  pull_request:
    paths:
      - .github/workflows/p08-r186-one-click-dev-once.yml
permissions:
  contents: read
jobs:
  developer-one-click-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r186-one-click-dev-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout ephemeral public runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private P08 exact PR69 candidate runtime checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 326873f2e574f07b63b392670498f05af26e86ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Source SHA and version frozen
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 326873f2e574f07b63b392670498f05af26e86ae
          test "$(cat p08/VERSION)" = 0.1.10
          echo P08_R186_EXACT_PRIVATE_SOURCE=PASS
      - name: PHP 8.4 full platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: curl,zip,mbstring,pdo_sqlite,pdo_mysql,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 locked frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Exact source PHP syntax, Owner status negative gates and one-click route
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l p08/src/Upgrade/OwnerFutureAtomicService.php
          php -l p08/app/Http/Controllers/OwnerFutureUpdateController.php
          php -l p08/routes/web.php
          php -l p08/tests/test_owner_future_atomic_status.php
          php -l p08/tests/test_upgrade_throttle_isolation.php
          php p08/tests/test_owner_future_atomic_status.php
          php p08/tests/test_upgrade_throttle_isolation.php
          php p08/tests/test_owner_future_repeat_cycle.php
          php p08/tests/test_site_domain_portability.php
          echo P08_R186_OWNER_INTENT_SOURCE_NEGATIVE_AND_PHP=PASS
      - name: Exact source TypeScript Vue and browser bundle checks
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix p08 --ignore-scripts --no-audit --no-fund
          npm run typecheck --prefix p08
          npm run test:unit --prefix p08
          npm run build --prefix p08
          echo P08_R186_VUE_ONE_CLICK_UX_AND_NO_DISABLED_STATUS=PASS
      - name: Locked Composer native runtime and mature stack gates
        shell: bash
        run: |
          set -Eeuo pipefail
          composer --working-dir=p08 install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader
          (cd p08 && composer check-platform-reqs --no-dev)
          php p08/tests/run.php
          python3 -B p08/scripts/check_stack_contract.py --phase full --root p08
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R186_LOCKED_RUNTIME_AND_STACK_GATES=PASS
      - name: Always clear transient private P08 source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
