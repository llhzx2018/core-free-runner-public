name: S01 navigation footer exact bounded validation
on:
  push:
    branches: [task/s01-nav-footer165-20261022]
    paths: ['.github/workflows/s01-nav-footer165.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.165
  TARGET_SHA: e10edd5390a27228c249aacc1986b6fec505985c
  TARGET_TREE: e656113c1461d1bdd6af5802fad598469e9b90b3
  BASE_SHA: 6142d47bf4f8409ae9d5e7888e5772b669fceee2
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e10edd5390a27228c249aacc1986b6fec505985c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package syntax and stable predecessor
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-nav-footer165-20261022/browser.cjs lane/article-reading.cjs
          cp control/lanes/s01-nav-footer165-20261022/clean.cjs lane/warm-admin.cjs
          cp control/lanes/s01-nav-footer165-20261022/seed.php lane/operations-seed.php
          cp control/lanes/s01-nav-footer165-20261022/review-snapshot.php lane/review-snapshot.php
          node --check lane/article-reading.cjs
          node --check target/src/assets/js/admin/admin-navigation.js
          node --check target/src/assets/js/admin/admin-navigation-page-refinement-v1.js
          git -C target diff --name-only "$BASE_SHA" "$TARGET_SHA" -- '*.php' | while IFS= read -r p; do php -l "target/$p"; done
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          gh release download v1.35.164 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.164.zip --dir provider
          echo '7e15c3528911a00b18ccd4b6237c5a540eca399b1d15ee2b4593e5d9eb9441ed  provider/vf-tools-theme_V1.35.164.zip' | sha256sum -c
          python3 control/lanes/s01-nav-footer165-20261022/package.py
          php target/tests/navigation-page-refinement-contract.php
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native clean setup upgrade rollback read-only comparison then real edit flows
        run: |
          set -euo pipefail
          python3 - <<'PYLANE'
          from pathlib import Path
          s=Path('lane/native.sh').read_text().replace('provider/vf-tools-m3u8_V1.25.91.zip','provider/vf-tools-m3u8_V1.25.94.zip')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert s.count(installer)==1
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          marker='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert s.count(marker)==1
          s=s.replace(marker,'docker cp lane/operations-seed.php "$WP:/tmp/operations-seed.php";cli eval-file /tmp/operations-seed.php >/dev/null\n'+marker)
          s=s.replace('cli eval-file /tmp/snapshot.php > proof/state-before.sha256','docker cp lane/review-snapshot.php "$WP:/tmp/review-snapshot.php";cli eval-file /tmp/review-snapshot.php > proof/review-before.sha256\ncli eval-file /tmp/snapshot.php > proof/state-before.sha256')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert s.count(marker)==1
          s=s.split(marker)[0]+"""
          docker cp provider/vf-tools-theme_V1.35.164.zip "$WP:/tmp/theme-old.zip"
          docker cp provider/vf-tools-theme_V1.35.165.zip "$WP:/tmp/theme-new.zip"
          version_check(){ test "$(cli theme get vf-tools-theme --field=version)" = "$1"; test "$(cli plugin get vf-tool-m3u8 --field=version)" = "1.25.94"; echo INSTALLED_VERSION_PASS="$1"; }
          version_check 1.35.165
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.164
          node lane/article-reading.cjs baseline
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.165
          node lane/article-reading.cjs
          cli theme install /tmp/theme-old.zip --force >/dev/null
          version_check 1.35.164
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.165
          cli theme install /tmp/theme-new.zip --force >/dev/null
          version_check 1.35.165
          cli eval-file /tmp/snapshot.php > proof/state-after.sha256
          cmp proof/state-before.sha256 proof/state-after.sha256
          cli eval-file /tmp/review-snapshot.php > proof/review-after.sha256
          cmp proof/review-before.sha256 proof/review-after.sha256
          echo NATIVE_INSTALL_UPGRADE_ROLLBACK_REPEAT_PROTECTED_DATA_PASS
          node lane/article-reading.cjs flows
          cli eval-file /tmp/snapshot.php > proof/state-after-intentional-save.json
          cli eval-file /tmp/review-snapshot.php > proof/review-after-intentional-save.json
          cmp proof/review-before.sha256 proof/review-after-intentional-save.json
          python3 - <<'PYPROTECT'
          import json,pathlib
          p=pathlib.Path('proof')
          a=json.loads((p/'state-before.sha256').read_text());b=json.loads((p/'state-after-intentional-save.json').read_text())
          changed=[k for k in a['sections'] if a['sections'][k]!=b['sections'][k]]
          assert set(changed)<={'vf_theme_navigation'},changed
          (p/'save-protection.json').write_text(json.dumps({'status':'PASS','changed_sections':changed,'scope':'explicit synthetic navigation saves only; all other sections and review records byte-identical'}))
          print('NAVIGATION_SAVE_OTHER_DATA_PROTECTED_PASS')
          PYPROTECT
          """
          Path('lane/editor.sh').write_text(s)
          PYLANE
          bash lane/editor.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-nav-footer-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private runtime
        if: always()
        run: rm -rf target provider lane
