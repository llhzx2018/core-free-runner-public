name: P08 R116 v0.1.3 exact main architecture naming reconciliation
on:
  pull_request:
    paths: [.github/workflows/p08-r116-v013-architecture-integration.yml]
permissions:
  contents: read
jobs:
  reconciled-architecture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P08_MAIN: 7220ae4a12dc9472b391a8c40a38ac538d92e654
      P08_CANDIDATE: 9ea4bbf18b5fe6dd32afbc4b682e132d544518da
      P08_MERGE: 9c3feddd46392a197332592573eb06112753afef
      P08_INTEGRATION: 494b29750636ad77845074fa33352cd386d27758
      GOV_SHA: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
    steps:
      - name: Fetch exact private candidate via read-only ephemeral token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 494b29750636ad77845074fa33352cd386d27758
          path: p08
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Fetch exact public governance policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
          path: gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact inherited main arch, plus bounded UI refactor and one regression test
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = "$P08_INTEGRATION"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(cat p08/VERSION)" = 0.1.3
          test "$(git -C p08 rev-list --parents -n1 "$P08_MERGE")" = "$P08_MERGE $P08_CANDIDATE $P08_MAIN"
          test "$(git -C p08 merge-base "$P08_MAIN" "$P08_INTEGRATION")" = "$P08_MAIN"
          test "$(git -C p08 merge-base "$P08_CANDIDATE" "$P08_INTEGRATION")" = "$P08_CANDIDATE"
          for f in .github/checks/architecture_gate.py .github/checks/test_architecture_gate.py .github/checks/code_architecture.json; do
            test "$(git -C p08 rev-parse "$P08_MAIN:$f")" = "$(git -C p08 rev-parse "$P08_INTEGRATION:$f")"
          done
          python3 -B - <<'PY'
          import os,subprocess
          root='p08'
          a=os.environ['P08_CANDIDATE']
          b=os.environ['P08_INTEGRATION']
          output=subprocess.check_output(['git','-C',root,'diff','--name-only',a,b],text=True).splitlines()
          expected={
            '.github/checks/architecture_gate.py',
            '.github/checks/code_architecture.json',
            '.github/checks/test_architecture_gate.py',
            'AGENTS.md',
            'docs/authority/CURRENT.md',
            'docs/authority/P08_BACKEND_ATOMIC_MAINLINE.md',
            'docs/evidence/R114_REAL_V013_CANDIDATE_NATIVE_OWNER_HTTPS_20261116.md',
            'docs/evidence/R115_REAL_013_CLEAN_FULL_3DB_OWNER_HTTPS_20261116.md',
            'resources/js/modules/updates/UpdatePanel.vue',
            'resources/js/modules/updates/updateReleaseFeedback.ts',
            'tests/js/update-release-feedback.test.ts'
          }
          assert set(output)==expected, 'R116_UNEXPECTED_CODE_CHANGE'
          assert '## 源码命名与目录 AI 执行门禁' in open(root+'/AGENTS.md').read()
          old=__import__('subprocess').check_output(['git','-C',root,'show',a+':resources/js/modules/updates/UpdatePanel.vue'],text=True).splitlines()
          new=open(root+'/resources/js/modules/updates/UpdatePanel.vue').read().splitlines()
          assert len(new) <= len(old), 'R116_LEGACY_UI_GROWTH'
          assert len(new) < 400+100, 'R116_UI_NOT_BOUNDED'
          print('R116_EXACT_SOURCE_MAIN_NAMING_PLUS_ONE_UI_REFACTOR=PASS')
          PY
      - name: Project positive negative naming unit and exact Git architecture gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          python3 -B .github/checks/test_architecture_gate.py > "$RUNNER_TEMP/r116-positive-negative.log" 2>&1 || {
            echo R116_NAMING_AND_LAYER_UNIT=FAIL
            exit 1
          }
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" \
            --git-root "$GITHUB_WORKSPACE/p08" \
            --base-sha "$P08_MAIN" --head-sha "$P08_INTEGRATION" \
            > "$RUNNER_TEMP/r116-arch.log" 2>&1 || {
            echo R116_REAL_DIFF_ARCH_NAMING=FAIL
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:[A-Z0-9_]+(:[A-Za-z0-9_./-]+)?$' "$RUNNER_TEMP/r116-arch.log" | head -5 || true
            exit 1
          }
          grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS;' "$RUNNER_TEMP/r116-arch.log"
          echo R116_EXACT_SOURCE_ARCHITECTURE_AND_NAMING_UNIT=PASS
      - name: Locked Node dependencies, typecheck, Vite build and all Update UI unit consumers
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Vue TypeScript and Vitest regression on exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r116-npm.log" 2>&1 || {
            echo R116_NPM_CI=FAIL; exit 1;
          }
          npm run typecheck > "$RUNNER_TEMP/r116-types.log" 2>&1 || {
            echo R116_VUE_TYPES=FAIL; exit 1;
          }
          npm run test:unit > "$RUNNER_TEMP/r116-unit.log" 2>&1 || {
            echo R116_VITEST=FAIL; exit 1;
          }
          npm run build > "$RUNNER_TEMP/r116-vite.log" 2>&1 || {
            echo R116_VITE=FAIL; exit 1;
          }
          echo R116_VUE_TYPES_UNIT_BUILD=PASS
      - name: Purge temporary private checkout and log
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08 gov
          rm -f -- "$RUNNER_TEMP"/r116-*.log
          echo R116_PRIVATE_SOURCE_PURGED=YES
