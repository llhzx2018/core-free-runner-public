name: P08 R116 exact v0.1.3 main architecture reconciliation
on:
  pull_request:
    paths: [.github/workflows/p08-r116-v013-architecture-integration.yml]
permissions:
  contents: read
jobs:
  reconciliation:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P08_MAIN: 7220ae4a12dc9472b391a8c40a38ac538d92e654
      P08_CANDIDATE: 9ea4bbf18b5fe6dd32afbc4b682e132d544518da
      P08_MERGE: 9c3feddd46392a197332592573eb06112753afef
      P08_INTEGRATION: 494b29750636ad77845074fa33352cd386d27758
      GOV_SHA: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
    steps:
      - name: Exact source temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 494b29750636ad77845074fa33352cd386d27758
          path: p08
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact shared governance temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
          path: gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact project and bounded source change verification
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = "$P08_INTEGRATION"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(cat p08/VERSION)" = 0.1.3
          test "$(git -C p08 rev-list --parents -n1 "$P08_MERGE")" = "$P08_MERGE $P08_CANDIDATE $P08_MAIN"
          test "$(git -C p08 merge-base "$P08_MAIN" "$P08_INTEGRATION")" = "$P08_MAIN"
          test "$(git -C p08 merge-base "$P08_CANDIDATE" "$P08_INTEGRATION")" = "$P08_CANDIDATE"
          for f in .github/checks/architecture_gate.py .github/checks/test_architecture_gate.py .github/checks/code_architecture.json; do
            test "$(git -C p08 rev-parse "$P08_MAIN:$f")" = "$(git -C p08 rev-parse "$P08_INTEGRATION:$f")"
          done
          python3 -B - <<'PY'
          import os,subprocess
          root='p08'
          source=os.environ['P08_CANDIDATE']
          target=os.environ['P08_INTEGRATION']
          changed=set(subprocess.check_output(['git','-C',root,'diff','--name-only',source,target],text=True).splitlines())
          expected={'.github/checks/architecture_gate.py',
            '.github/checks/code_architecture.json',
            '.github/checks/test_architecture_gate.py',
            'AGENTS.md','docs/authority/CURRENT.md',
            'docs/authority/P08_BACKEND_ATOMIC_MAINLINE.md',
            'docs/evidence/R114_REAL_V013_CANDIDATE_NATIVE_OWNER_HTTPS_20261116.md',
            'docs/evidence/R115_REAL_013_CLEAN_FULL_3DB_OWNER_HTTPS_20261116.md',
            'resources/js/modules/updates/UpdatePanel.vue',
            'resources/js/modules/updates/updateReleaseFeedback.ts',
            'tests/js/update-release-feedback.test.ts'}
          assert changed==expected,'R116_UNEXPECTED_CHANGED_FILES'
          old=subprocess.check_output(['git','-C',root,'show',source+':resources/js/modules/updates/UpdatePanel.vue'],text=True).splitlines()
          new=open(root+'/resources/js/modules/updates/UpdatePanel.vue').read().splitlines()
          assert len(new)<len(old) and len(new)<=496,'R116_UI_GROWTH'
          print('R116_EXACT_11_FILE_SCOPE_AND_MERGE_IDENTITY=PASS')
          PY
      - name: Node 22 for Vue component and unit checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Types, all Vitest consumers and Vite from final source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r116-npm.log" 2>&1 || { echo R116_NPM=FAIL; exit 1; }
          npm run typecheck > "$RUNNER_TEMP/r116-types.log" 2>&1 || { echo R116_TYPES=FAIL; exit 1; }
          npm run test:unit > "$RUNNER_TEMP/r116-unit.log" 2>&1 || { echo R116_UNIT=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/r116-build.log" 2>&1 || { echo R116_BUILD=FAIL; exit 1; }
          echo R116_TYPES_UNIT_VITE=PASS
          # Revert build-generated files ONLY in this disposable exact-source checkout.
          # Shared architecture lint requires a completely clean git worktree.
          git reset --hard "$P08_INTEGRATION" >/dev/null
          git clean -fd >/dev/null
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R116_POST_BUILD_CLEAN_SOURCE_VERIFIED=PASS
      - name: Architecture unit and scoped naming source check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          python3 -B .github/checks/test_architecture_gate.py > "$RUNNER_TEMP/r116-arch-unit.log" 2>&1 || {
            echo R116_ARCH_UNIT=FAIL; exit 1;
          }
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" --git-root "$GITHUB_WORKSPACE/p08" \
            --base-sha "$P08_CANDIDATE" --head-sha "$P08_INTEGRATION" \
            > "$RUNNER_TEMP/r116-scoped.log" 2>&1 || {
            echo R116_SCOPED_ARCH=FAIL
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:[A-Z0-9_]+(:[A-Za-z0-9_./-]+)?$' "$RUNNER_TEMP/r116-scoped.log" | head -4 || true
            exit 1
          }
          grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS;' "$RUNNER_TEMP/r116-scoped.log"
          echo R116_SCOPED_ARCH_AND_NAMING=PASS
      - name: Full main to candidate release architecture acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" --git-root "$GITHUB_WORKSPACE/p08" \
            --base-sha "$P08_MAIN" --head-sha "$P08_INTEGRATION" \
            > "$RUNNER_TEMP/r116-release.log" 2>&1 || {
            echo R116_FULL_RELEASE_ARCH=BLOCKED
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:[A-Z0-9_]+(:[A-Za-z0-9_./-]+)?$' "$RUNNER_TEMP/r116-release.log" | head -4 || true
            exit 1
          }
          grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS;' "$RUNNER_TEMP/r116-release.log"
          echo R116_FULL_RELEASE_ARCH=PASS
      - name: Purge private source and test logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08 gov
          rm -f -- "$RUNNER_TEMP"/r116-*.log
          echo R116_PRIVATE_SOURCE_PURGED=YES
