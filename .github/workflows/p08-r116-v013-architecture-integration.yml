name: P08 R117 eight-source release architecture and regression gates
on:
  pull_request:
    paths: [.github/workflows/p08-r116-v013-architecture-integration.yml]
permissions:
  contents: read
jobs:
  full-preflight:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P08_MAIN: 7220ae4a12dc9472b391a8c40a38ac538d92e654
      P08_EXACT: be83779623be2768a2ed7223f948645a0d2b9030
      GOV_EXACT: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Exact privately pinned P08 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: be83779623be2768a2ed7223f948645a0d2b9030
          path: p08
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact GOV source architecture contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 4c091d5ece34bac8ca9e87e012010f4c6c5e9e2d
          path: gov
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 and all supported extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl, sodium
          tools: composer:v2
      - name: Source identity and all eight original file budgets
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = "$P08_EXACT"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_EXACT"
          test "$(cat p08/VERSION)" = 0.1.3
          git -C p08 merge-base --is-ancestor "$P08_MAIN" "$P08_EXACT"
          test "$(git -C p08 rev-parse "$P08_MAIN:.github/checks/code_architecture.json")" = "$(git -C p08 rev-parse "$P08_EXACT:.github/checks/code_architecture.json")"
          python3 -B - <<'PY'
          import os,subprocess
          p='p08'; a=os.environ['P08_MAIN'];b=os.environ['P08_EXACT']
          files={
            'resources/js/types/workspace.ts':400,
            'src/Upgrade/FlatLayoutBridgeActivation.php':400,
            'src/Upgrade/FlatLayoutBridgePrepare.php':400,
            'src/Upgrade/OwnerUpgradeJob.php':400,
            'scripts/p08_prepare_owner_onefile_on_site.py':400,
            'scripts/r110_owner_atomic_once.php':400,
            'src/Upgrade/R105OfficialNextRelease.php':400,
            'src/Upgrade/R109AppLocal012Activation.php':400
          }
          for path,cap in files.items():
              raw=subprocess.check_output(['git','-C',p,'show',b+':'+path])
              prior=subprocess.run(['git','-C',p,'show',a+':'+path],
                  capture_output=True,check=False)
              old_len=len(prior.stdout.splitlines()) if prior.returncode==0 else 0
              maximum=old_len if old_len>cap else cap
              assert len(raw.splitlines())<=maximum,'R117_OVERSIZED_'+path
          for path in ('scripts/R110OwnerWorkerFragment.php',
                       'scripts/p08_owner_site_build_helpers.py',
                       'src/Upgrade/R109AppLocal012Recovery.php',
                       'src/Upgrade/OwnerUpgradeOfferValidation.php'):
              raw=subprocess.check_output(['git','-C',p,'show',b+':'+path])
              assert len(raw.splitlines())<=400,'R117_NEW_FILE_OVERSIZED'
          print('R117_ALL_EIGHT_GROWTH_BUDGETS_NO_WAIVERS=PASS')
          PY
      - name: Python standalone bootstrap pinned-helper and other negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          python3 -B -m compileall -q scripts/p08_prepare_owner_onefile_on_site.py scripts/p08_owner_site_build_helpers.py scripts/build_r110_onefile.py
          python3 -B -m unittest discover -s tests/compatibility -p 'test_r110_*.py' > "$RUNNER_TEMP/r117-python.log" 2>&1 || {
            echo R117_PINNED_HELPER_AND_REDIRECTS=FAIL; exit 1;
          }
          echo R117_PINNED_HELPER_HASH_REDIRECT_AND_NODE_NEGATIVES=PASS
      - name: PHP changed-source syntax and local atomic negative regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          git diff --name-only "$P08_MAIN" "$P08_EXACT" -- '*.php' |
            while IFS= read -r f; do
              if test -f "$f"; then php -l "$f" >/dev/null || exit 1; fi
            done
          php tests/compatibility/r105_official_next_release.php > "$RUNNER_TEMP/r117-official-read.log" 2>&1 || {
            echo R117_OFFICIAL_SOURCE_NEGATIVES=FAIL; exit 1;
          }
          php tests/compatibility/r110_bootstrap_state_recovery.php > "$RUNNER_TEMP/r117-once-state.log" 2>&1 || {
            echo R117_ONEFILE_STATE=FAIL; exit 1;
          }
          php tests/compatibility/r105_same_release_activation.php > "$RUNNER_TEMP/r117-bridge.log" 2>&1 || {
            echo R117_OLD_BRIDGE_COMPATIBILITY=FAIL; exit 1;
          }
          echo R117_PHP_SYNTAX_OFFER_BRIDGE_AND_ONEFILE_STATE=PASS
      - name: Node 22 locked Vue build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck full Vitest and Vite, keep same owner UI
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r117-npm.log" 2>&1 || { echo R117_NPM=FAIL;exit 1; }
          npm run typecheck > "$RUNNER_TEMP/r117-types.log" 2>&1 || { echo R117_TYPES=FAIL;exit 1; }
          npm run test:unit > "$RUNNER_TEMP/r117-unit.log" 2>&1 || { echo R117_VITEST=FAIL;exit 1; }
          npm run build > "$RUNNER_TEMP/r117-build.log" 2>&1 || { echo R117_VITE=FAIL;exit 1; }
          git reset --hard "$P08_EXACT" >/dev/null
          git clean -fd >/dev/null
          test -z "$(git status --porcelain --untracked-files=all)"
          echo R117_TYPES_VITEST_VITE_AND_CLEAN_TREE=PASS
      - name: Final exact main diff naming architecture positive-negative
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          python3 -B .github/checks/test_architecture_gate.py > "$RUNNER_TEMP/r117-arch-unit.log" 2>&1 || {
            echo R117_ARCH_NEGATIVE_FIXTURES=FAIL; exit 1;
          }
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root "$GITHUB_WORKSPACE/gov" --git-root "$GITHUB_WORKSPACE/p08" \
            --base-sha "$P08_MAIN" --head-sha "$P08_EXACT" \
            > "$RUNNER_TEMP/r117-arch.log" 2>&1 || {
            echo R117_MAIN_TO_FINAL_ARCH=BLOCKED
            grep -E '^PROJECT_ARCHITECTURE=BLOCKED:[A-Z0-9_]+(:[A-Za-z0-9_./-]+)?$' "$RUNNER_TEMP/r117-arch.log" | head -5 || true
            exit 1
          }
          grep -q '^PROJECT_ARCHITECTURE=STRUCTURAL_PASS;' "$RUNNER_TEMP/r117-arch.log"
          echo R117_MAIN_TO_FINAL_ARCH_NAMING_AND_NEGATIVE_TESTS=PASS
      - name: Always purge private code and package logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08 gov
          rm -f -- "$RUNNER_TEMP"/r117-*.log
          echo R117_PRIVATE_SOURCE_AND_TEST_LOGS_PURGED=YES
