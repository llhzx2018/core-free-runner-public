name: P05 Post-v1.2.2 Current Truth Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-post-v122-current-truth-gate.yml'

permissions:
  contents: read

jobs:
  exact-current-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_BASE: 5f1deb37a7f8b3828bd9617b6a0a14f045a3e096
      P05_CANDIDATE: 33b375738b0c4a007e6ebded983379fd695a763a
      P05_TREE: 25c7d03d9930cc129dc3ad7723df792f62064e21
    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 33b375738b0c4a007e6ebded983379fd695a763a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact four-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_TREE"
          git cat-file -e "$P05_BASE^{commit}"
          test "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" | sort | tr '\n' ' ')" = 'CHANGELOG.md README.md VF_PROJECT.json docs/handoff/CURRENT_STATE.md '
          git diff --check "$P05_BASE" "$P05_CANDIDATE"
          test "$(cat VERSION)" = '1.2.2'
          node -e "const p=require('./package.json'); if(p.version!=='1.2.2') process.exit(1)"
          echo P05_POST_V122_CURRENT_TRUTH_SCOPE=PASS

      - name: Verify current truth authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('VF_PROJECT.json').read_text())
          assert p['version']=='1.2.2'
          assert p['production_version']=='1.2.2'
          assert p['target_version']=='1.2.2'
          assert p['working_version']=='1.2.2'
          assert p['formal_release']=='v1.2.2'
          assert p['post_release_main_commit']=='5f1deb37a7f8b3828bd9617b6a0a14f045a3e096'
          assert p['post_release_main_tree']=='a467ab0a90656312bd297dfd5ecb51da396990b6'
          q=p['post_v1_2_2_update_service']
          assert q['state']=='MERGED_MAIN_MACHINE_VERIFIED_NOT_RELEASED'
          assert q['formal_release_remains']=='v1.2.2'
          assert q['production_remains']=='v1.2.2_OWNER_OBSERVED_SCREENSHOT_VERIFIED'
          assert q['recommended_patch_release']=='v1.2.3'
          assert q['release_authorization']=='PENDING_OWNER'
          assert q['browser_secret_collection']=='FORBIDDEN_LOCKED'
          assert q['update_read_token']=='GLOBAL_VF_PRIVATE_READ_TOKEN_SERVER_SIDE_ONLY'
          assert q['third_project_token']=='FORBIDDEN_BY_CURRENT_GOVERNANCE'
          assert q['machine_production_readback']=='NOT_CLAIMED'
          assert q['server_side_bootstrap_exact_gate_run']==33541894604
          assert q['server_side_bootstrap_exact_gate_job']==99969918142
          assert 'OWNER_RELEASE_AUTHORIZATION_REQUIRED' in p['next_action']
          assert 'POST_RELEASE_MAIN_AHEAD_OF_FORMAL_RELEASE' in p['deployment_readiness']

          readme=Path('README.md').read_text()
          assert 'Post-release Working Main（未发布）' in readme
          assert 'Recommended patch: v1.2.3 · OWNER RELEASE AUTHORIZATION PENDING' in readme
          assert '当前 Production v1.2.2 尚未包含 #138/#139' in readme

          changelog=Path('CHANGELOG.md').read_text()
          assert '## Unreleased · Post-v1.2.2 Update Service Bootstrap' in changelog
          assert 'Release 尚未获得 Owner 授权' in changelog

          handoff=Path('docs/handoff/CURRENT_STATE.md').read_text()
          assert 'Current Formal Release: v1.2.2 · RELEASED' in handoff
          assert 'Production: v1.2.2 · OWNER_OBSERVED / SCREENSHOT_VERIFIED' in handoff
          assert 'Recommended Next Patch: v1.2.3' in handoff
          assert 'Release Authorization: PENDING OWNER' in handoff
          assert 'Production v1.2.2 尚未部署 #138/#139' in handoff
          PY
          echo P05_POST_V122_CURRENT_TRUTH_AUTHORITY=PASS

      - name: Verify historical v1.2.2 authority unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in docs/authority/RELEASE_V1.2.2_PRODUCTION_CLOSURE.md docs/authority/RELEASE_V1.2.2_CANDIDATE.md; do
            test "$(git rev-parse "$P05_BASE:$f")" = "$(git rev-parse "$P05_CANDIDATE:$f")"
          done
          test -z "$(git diff --name-only "$P05_BASE" "$P05_CANDIDATE" -- src php database package.json VERSION docs/authority)"
          echo P05_POST_V122_HISTORICAL_AUTHORITY=PASS
          echo P05_RELEASE_WRITE=0
          echo P05_PRODUCTION_WRITE=0

      - name: Seal exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_TREE"
          test -z "$(git status --porcelain)"
          echo "P05_POST_V122_CURRENT_TRUTH_SHA=$(git rev-parse HEAD)"
          echo "P05_POST_V122_CURRENT_TRUTH_TREE=$(git rev-parse HEAD^{tree})"
          echo P05_POST_V122_CURRENT_TRUTH_GATE=PASS
