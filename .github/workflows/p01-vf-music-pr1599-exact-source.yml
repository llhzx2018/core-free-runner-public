name: p01-vf-music-v247423-formal-release
# One-off public-safe verification lane. NEVER persist private product source
# in public Git, artifact, cache, output, or logs.
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-vf-music-pr1599-exact-source.yml']
permissions:
  contents: read
jobs:
  verify-p01-music:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-vf-music-pr1599-exact-20261022' &&
      startsWith(github.event.pull_request.title, 'release(P01):') &&
      github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: llhzx2018/vf-start
      BASE_SHA: 3e77210f148270c8ac5909694b525b587ecebdbb
      TARGET_SHA: 19b81c7f653027e0bbe0f8459dc4253403f44bd8
      VERSION: 2.47.423
      SOURCE_VERSION: 2.47.422
    steps:
      - name: Read only public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert one-file one-use lane
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch -q origin main
          mapfile -t files < <(git diff --name-only origin/main HEAD)
          test "${#files[@]}" -eq 3
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/p01-vf-music-pr1599-exact-source.yml'
          printf '%s\n' "${files[@]}" | grep -Fx 'scripts/p01-music-schema-feature-probe.py'
          printf '%s\n' "${files[@]}" | grep -Fx 'scripts/p01-music-schema-atomic-probe.sh'
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo PUBLIC_LANE_SCOPE=PASS
      - name: Provision PHP SQLite runtime
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip
          coverage: none
      - name: Validate runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          node --version
          echo PUBLIC_MUSIC_RUNTIME=PASS
      - name: Checkout exact private candidate transiently
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout --depth 1 "https://x-access-token:${READ_TOKEN}@github.com/${TARGET_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate fetch -q --depth 1 origin "$BASE_SHA"
          git -C candidate worktree add -q --detach ../baseline "$BASE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          git -C candidate remote set-url origin "https://github.com/${TARGET_REPO}.git"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C candidate status --porcelain)"
          echo P01_MUSIC_EXACT_SOURCE=PASS
      - name: Run bounded P01 music contracts on synthetic data
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/music_candidate_smoke.sh > /tmp/music-check.log 2>&1 || {
            tail -n 70 /tmp/music-check.log
            exit 1
          }
          grep -Fx 'P01_VF_MUSIC_IMPORT_CANDIDATE_SMOKE=PASS' /tmp/music-check.log
          grep -Fx 'P01_VF_MUSIC_SQLITE_INTEGRATION=PASS' /tmp/music-check.log
          grep -Fx 'P01_VF_MUSIC_SECURITY_STATIC=PASS' /tmp/music-check.log
          git diff --exit-code >/dev/null
          echo P01_MUSIC_SYNTHETIC_SQLITE_AND_SECURITY=PASS
      - name: Fresh-install real HTTP security and owner CRUD
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_HTTP_INSTALL_GATE=PASS
      - name: Real P01 existing-install native migration and snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/music_existing_upgrade.sh candidate baseline
          echo P01_MUSIC_REAL_UPGRADE_GATE=PASS
      - name: Build test-only schema-aware FULL and Atomic UPDATE
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p /tmp/p01-music-packages/base-full /tmp/p01-music-packages/base-update
          gh release download "v$SOURCE_VERSION" -R "$TARGET_REPO" \
            -D /tmp/p01-music-packages -p "VF-Start-V$SOURCE_VERSION-FULL.zip" -p "VF_Start_V${SOURCE_VERSION}_UPDATE.zip"
          unzip -q "/tmp/p01-music-packages/VF-Start-V$SOURCE_VERSION-FULL.zip" \
            -d /tmp/p01-music-packages/base-full
          unzip -q "/tmp/p01-music-packages/VF_Start_V${SOURCE_VERSION}_UPDATE.zip" \
            -d /tmp/p01-music-packages/base-update
          TARGET_TREE="$(git -C candidate rev-parse HEAD^{tree})"
          python3 scripts/p01-music-schema-feature-probe.py \
            --candidate candidate/src --baseline-full /tmp/p01-music-packages/base-full \
            --baseline-repair "/tmp/p01-music-packages/base-update/repair-v$SOURCE_VERSION.php" \
            --out /tmp/p01-music-packages/probe \
            --version "$VERSION" --source-version "$SOURCE_VERSION" \
            --target-sha "$TARGET_SHA" --target-tree "$TARGET_TREE"
          test -f "/tmp/p01-music-packages/probe/VF-Start-V$VERSION-FULL.zip"
          test -f "/tmp/p01-music-packages/probe/VF_Start_V${VERSION}_UPDATE.zip"
          echo P01_MUSIC_SCHEMA_ARTIFACT_BUILD=PASS
      - name: Prove Atomic UPDATE, failure rollback and FULL installation
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL="/tmp/p01-music-packages/probe/VF-Start-V$VERSION-FULL.zip" \
          UPDATE="/tmp/p01-music-packages/probe/VF_Start_V${VERSION}_UPDATE.zip" \
          SOURCE_FULL="/tmp/p01-music-packages/VF-Start-V$SOURCE_VERSION-FULL.zip" \
          bash scripts/p01-music-schema-atomic-probe.sh
          echo P01_MUSIC_SCHEMA_ARTIFACT_TEST=PASS
      - name: Publish exact formal GitHub tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" && test -n "$READ_TOKEN"
          TAG="v$VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' <candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' <candidate/src/VERSION.txt)" = "$VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/releases/latest" --jq '.tag_name')" = "v$SOURCE_VERSION"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/pulls/1599" --jq '.merged')" = true
          GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/pulls/1599" --jq '.body' | grep -F "OWNER_WAIVED_PRE_RELEASE_ONCE" >/dev/null
          FULL="/tmp/p01-music-packages/probe/VF-Start-V$VERSION-FULL.zip"
          UPDATE="/tmp/p01-music-packages/probe/VF_Start_V$VERSION""_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          FULL_SHA="$(sha256sum "$FULL" | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum "$UPDATE" | awk '{print $1}')"
          FULL_SIZE="$(stat -c %s "$FULL")"
          UPDATE_SIZE="$(stat -c %s "$UPDATE")"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n ')" = "$VERSION"
          if GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" >/tmp/p01-music-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/p01-music-tag.json)" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$TARGET_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/tmp/p01-music-tag.json
            test "$(jq -r '.object.sha' /tmp/p01-music-tag.json)" = "$TARGET_SHA"
          fi
          cat >/tmp/p01-music-release-notes.md <<EOF
          # VF Start V$VERSION · VF Music
          新增 P01 私人音乐中心、歌单/歌曲/收藏 CRUD、歌单导入和官方播放器。
          - Previous Formal Release: v$SOURCE_VERSION
          - Exact merged source: $TARGET_SHA
          - Additive schema: 2026090401 → 2026102201
          - Delivery: FULL + verified schema-aware Atomic UPDATE.
          - Machine gates: SQLite, HTTP Auth/CSRF/CSP, Install, Migration, Backup, Atomic rollback = PASS.
          - Owner preview: OWNER_WAIVED_PRE_RELEASE_ONCE (NOT PASS).
          - Owner real use: POST_PRODUCTION_REQUIRED (NOT PASS).
          - Production: NOT MODIFIED. OWNER upgrades manually.
          - YouTube availability still depends on platform/browser restrictions.
          EOF
          if GH_TOKEN="$READ_TOKEN" gh release view "$TAG" -R "$TARGET_REPO" >/dev/null 2>&1; then
            GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/releases/tags/$TAG" >/tmp/p01-music-release.json
          else
            gh release create "$TAG" "$FULL" "$UPDATE" -R "$TARGET_REPO" \
              --title "VF Start V$VERSION · VF Music" \
              --notes-file /tmp/p01-music-release-notes.md --verify-tag
            GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/releases/tags/$TAG" >/tmp/p01-music-release.json
          fi
          test "$(jq -r '.tag_name' /tmp/p01-music-release.json)" = "$TAG"
          test "$(jq -r '.draft' /tmp/p01-music-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-music-release.json)" = false
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(jq -r --arg n "VF-Start-V$VERSION-FULL.zip" '.assets[]|select(.name==$n)|.size' /tmp/p01-music-release.json)" = "$FULL_SIZE"
          test "$(jq -r --arg n "VF_Start_V$VERSION""_UPDATE.zip" '.assets[]|select(.name==$n)|.size' /tmp/p01-music-release.json)" = "$UPDATE_SIZE"
          mkdir -p /tmp/p01-music-release-readback
          GH_TOKEN="$READ_TOKEN" gh release download "$TAG" -R "$TARGET_REPO" -D /tmp/p01-music-release-readback \
            -p "VF-Start-V$VERSION-FULL.zip" -p "VF_Start_V$VERSION""_UPDATE.zip"
          test "$(sha256sum "/tmp/p01-music-release-readback/VF-Start-V$VERSION-FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "/tmp/p01-music-release-readback/VF_Start_V$VERSION""_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          jq -n --arg tag "$TAG" --arg version "$VERSION" --arg prev "$SOURCE_VERSION" \
            --arg sha "$TARGET_SHA" --arg fullsha "$FULL_SHA" --arg updatesha "$UPDATE_SHA" \
            --argjson fullbytes "$FULL_SIZE" --argjson updatebytes "$UPDATE_SIZE" \
            --argjson id "$(jq -r '.id' /tmp/p01-music-release.json)" \
            --arg published "$(jq -r '.published_at' /tmp/p01-music-release.json)" \
            '{tag:$tag,version:$version,source_version:$prev,sha:$sha,
              full_sha256:$fullsha,update_sha256:$updatesha,
              full_bytes:$fullbytes,update_bytes:$updatebytes,
              release_id:$id,released_at:$published,production_changed:false}' >/tmp/P01_MUSIC_FORMAL_RECEIPT.json
          cat /tmp/P01_MUSIC_FORMAL_RECEIPT.json
          echo P01_MUSIC_FORMAL_GITHUB_RELEASE=PASS
      - name: Remove private checkout and logs
        if: always()
        shell: bash
        run: |
          rm -rf candidate baseline /tmp/music-check.log /tmp/p01-music-packages /tmp/p01-music-release-readback /tmp/p01-music-release-notes.md /tmp/p01-music-tag.json /tmp/p01-music-release.json
          echo PUBLIC_RUNNER_PRIVATE_SOURCE_CLEANUP=PASS
