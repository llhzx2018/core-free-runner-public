name: P01 V2.39.2 Exact Formal Bind R1

on:
  push:
    branches:
      - gate/p01-v2392-formal-bind-20260903-r1
    paths:
      - '.github/workflows/p01-v2392-formal-bind-r1.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2392-formal-bind-r1
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_P01_PARENT: f639a9dee3120e688d9faf96d29ea3e230cdb59b
      TARGET_PRIVATE_BRANCH: release/p01-v2392-formal-bind-20260903
    steps:
      - name: Require private release credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'PRIVATE_RELEASE_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact P01 engineering main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_P01_PARENT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Verify exact parent and branch absence
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_P01_PARENT"
          if git ls-remote --exit-code "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${TARGET_PRIVATE_BRANCH}" >/dev/null 2>&1; then
            echo 'TARGET_PRIVATE_BRANCH_ALREADY_EXISTS' >&2
            exit 81
          fi
          echo "P01_FORMAL_PARENT=$EXPECTED_P01_PARENT"
          echo 'TARGET_PRIVATE_BRANCH_ABSENT=PASS'

      - name: Build exact V2.39.2 formal bind content
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          import json
          from pathlib import Path

          project_path = Path('VF_PROJECT.json')
          data = json.loads(project_path.read_text(encoding='utf-8'))

          assert data['production_version'] == '2.39.1'
          assert data['published_release']['version'] == '2.39.1'
          assert data['production_release']['version'] == '2.39.1'
          assert data['schema_version'] == '2026090201'
          assert data['working_schema_version'] == '2026090201'

          frozen_production_release = json.dumps(data['production_release'], ensure_ascii=False, sort_keys=True)
          frozen_published_release = json.dumps(data['published_release'], ensure_ascii=False, sort_keys=True)
          frozen_product_model = json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True)
          frozen_owner_activation = json.dumps(data.get('owner_production_activation_evidence'), ensure_ascii=False, sort_keys=True)

          data['status'] = 'V2.39.2 RELEASE CANDIDATE / OWNER AUTHORIZED / PRODUCTION V2.39.1'
          data['working_version'] = '2.39.2'
          data['target_release_version'] = '2.39.2'
          data['current_phase'] = 'V2.39.2 FORMAL RELEASE PREP / PRODUCTION V2.39.1 PRESERVED'
          data['current_change'] = {
              'change_id': 'P01-V2392-UNIFIED-GROUPS-PRODUCTION-ACCEPTANCE-20260903',
              'type': 'PATCH / UNIFIED GROUPS + MANAGED PROJECTS PRODUCTION ACCEPTANCE FIXES',
              'published_base_version': '2.39.1',
              'product_main_merge': 'f639a9dee3120e688d9faf96d29ea3e230cdb59b',
              'candidate_pr': 235,
              'superseded_draft_pr': 234,
              'candidate_gate_run': 33664600898,
              'runner_provenance_pr': 627,
              'schema_change': False,
              'source_schema': '2026090201',
              'target_schema': '2026090201',
              'migration': None,
              'version_change': True,
              'release_authorized_by_owner': True,
              'main_write': True,
              'production_write': False,
              'runner_main_write': False,
              'release_completed': False,
              'owner_production_activation': False,
              'production_closure_complete': False
          }
          data['candidate_version'] = '2.39.2'
          data['candidate_schema_version'] = '2026090201'
          data['candidate_state'] = 'V2.39.2 OWNER-AUTHORIZED RELEASE CANDIDATE / FORMAL ARTIFACT PENDING'
          data['formal_release_state'] = 'V2.39.2 FORMAL RELEASE PENDING MACHINE GATES / PRODUCTION V2.39.1'
          data['current_authority'] = 'Owner Production V2.39.1 OBSERVED / Published Latest V2.39.1 / V2.39.2 Release Authorized'
          data['next_action'] = 'Run V2.39.2 Formal Artifact + Strict Fresh + atomic 2.39.1 -> 2.39.2 no-schema-change gate. No Production write.'

          assert json.dumps(data['production_release'], ensure_ascii=False, sort_keys=True) == frozen_production_release
          assert json.dumps(data['published_release'], ensure_ascii=False, sort_keys=True) == frozen_published_release
          assert json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True) == frozen_product_model
          assert json.dumps(data.get('owner_production_activation_evidence'), ensure_ascii=False, sort_keys=True) == frozen_owner_activation
          assert data['production_version'] == '2.39.1'
          assert data['schema_version'] == '2026090201'

          project_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('VERSION').write_text('2.39.2\n', encoding='utf-8')
          Path('src/VERSION.txt').write_text('2.39.2\n', encoding='utf-8')

          bootstrap = Path('src/app/bootstrap.php')
          text = bootstrap.read_text(encoding='utf-8')
          old = "define('VF_VERSION', '2.39.1');"
          new = "define('VF_VERSION', '2.39.2');"
          assert text.count(old) == 1, 'bootstrap version authority drifted'
          bootstrap.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('docs/evidence/P01_V2.39.2_FORMAL_BIND_20260903.md').write_text('''# P01 · V2.39.2 · Formal Bind · 2026-09-03

Status: `FORMAL SOURCE / MACHINE VERIFICATION PENDING`

## Bound Product Authority

- Product Main Source: `f639a9dee3120e688d9faf96d29ea3e230cdb59b`
- Promotion PR: `#235`
- Superseded Draft Evidence PR: `#234`
- Unified Groups Acceptance R5: `33664600898 / PASS`
- Runner Provenance: `core-free-runner-public #627 / CLOSED WITHOUT MERGE`
- Release Version: `2.39.2`
- Source Schema: `2026090201`
- Target Schema: `2026090201`
- Migration: `NONE`
- Owner Production at bind time: `2.39.1`
- Published Latest at bind time: `2.39.1`
- Assistant Production Write: `NO`
- Runner Main Write: `NO`

V2.39.2 is a no-schema-change patch that closes the machine-found Unified Resource Groups / Managed Projects production-acceptance gaps before real Owner acceptance. It preserves one canonical link identity, group-local dormant metadata, cover and Hosted Topic HTML durability, Projects-only ordering, URL-less retired-project boundaries, and the explicit/idempotent Kewaro P01–P06 conversion contract.
''', encoding='utf-8')

          Path('docs/evidence/P01_V2.39.2_RELEASE_CANDIDATE_20260903.md').write_text('''# P01 · V2.39.2 · Release Candidate · 2026-09-03

Status: `OWNER AUTHORIZED / FORMAL ARTIFACT PENDING`

This candidate packages the exact R5-PASS Unified Groups + Managed Projects acceptance fixes promoted by PR #235.

Release contract:
- exact hop `2.39.1 -> 2.39.2`
- schema `2026090201 -> 2026090201`
- no migration
- backup + Atomic rollback remain mandatory
- Production activation remains Owner-controlled
- real five-group round trip, Projects CRUD and Kewaro conversion remain post-deployment Owner acceptance gates
- no Kewaro site/repository retirement is authorized by this release
''', encoding='utf-8')
          PY

          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php
          test "$(cat VERSION)" = '2.39.2'
          test "$(cat src/VERSION.txt)" = '2.39.2'

          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            'VERSION'
            'VF_PROJECT.json'
            'docs/evidence/P01_V2.39.2_FORMAL_BIND_20260903.md'
            'docs/evidence/P01_V2.39.2_RELEASE_CANDIDATE_20260903.md'
            'src/VERSION.txt'
            'src/app/bootstrap.php'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'P01_V2392_FORMAL_BIND_SCOPE=PASS'

      - name: Commit exact formal source and push private release branch only
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php docs/evidence/P01_V2.39.2_FORMAL_BIND_20260903.md docs/evidence/P01_V2.39.2_RELEASE_CANDIDATE_20260903.md
          git commit -m 'release(P01): bind V2.39.2 formal source'
          FORMAL_SOURCE="$(git rev-parse HEAD)"
          FORMAL_PARENT="$(git rev-parse HEAD^)"
          FORMAL_TREE="$(git rev-parse HEAD^{tree})"
          test "$FORMAL_PARENT" = "$EXPECTED_P01_PARENT"
          test "$(git diff --name-only HEAD^ HEAD | sort | wc -l)" -eq 6
          git push "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "HEAD:refs/heads/${TARGET_PRIVATE_BRANCH}"
          REMOTE="$(git ls-remote "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${TARGET_PRIVATE_BRANCH}" | awk '{print $1}')"
          test "$REMOTE" = "$FORMAL_SOURCE"
          echo "P01_V2392_FORMAL_SOURCE=$FORMAL_SOURCE"
          echo "P01_V2392_FORMAL_PARENT=$FORMAL_PARENT"
          echo "P01_V2392_FORMAL_TREE=$FORMAL_TREE"
          echo 'P01_V2392_PRIVATE_RELEASE_BRANCH_PUSH=PASS'
          echo 'P01_V2392_RUNNER_MAIN_WRITE=NO'

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf p01
          test ! -e p01
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
