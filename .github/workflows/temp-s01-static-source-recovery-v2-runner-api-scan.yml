name: TEMP S01 Static Source Recovery V2 Runner API Scan
on:
  push:
    branches: [temp/s01-c03-v12519-runtime-authority-probe-20260905]
    paths: ['.github/workflows/temp-s01-static-source-recovery-v2-runner-api-scan.yml']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: bd2fb0f84a39cbbbdc0c4d999397c4c7c0f82f44
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Print async public APIs
        run: |
          set -Eeuo pipefail
          grep -RIn --exclude-dir=.git -E 'public static function ' includes/release/async-job-parts includes/release/class-release-async-job.php || true
          echo '=== JOB RUN CALLS ==='
          grep -RIn --exclude-dir=.git -E 'run_job|run_steps|process_job|process_step|advance|execute|tick|handle_run|run_chunk|job_run|run_v' includes/release/async-job-parts includes/release/class-release-async-job.php | head -n 300 || true
          echo PASS_STATIC_SOURCE_RECOVERY_V2_RUNNER_API_SCAN
