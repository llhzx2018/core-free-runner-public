name: P01 D62 exact legacy 2.47.515 SQLite read-only compatibility gate
on:
  push:
    branches:
      - test/p01-d62-v515-offline-gate-20261113
permissions:
  contents: read

jobs:
  d62-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Exact test-only product lane and transient private source
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d62-v515-offline-gate-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D62_OFFLINE_ONLY=YES"
          echo "P01_D62_PRODUCTION_MIGRATION_OR_RELEASE=NO"
      - name: Checkout exact private candidate transiently, never persist credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 62f4ecf2f15aab4b242647ada7774ed23e0e13a8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Confirm exact immutable candidate and pinned legacy source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "62f4ecf2f15aab4b242647ada7774ed23e0e13a8"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          echo "P01_D62_EXACT_SOURCE=62f4ecf2f15aab4b242647ada7774ed23e0e13a8"
      - name: Install isolated PHP SQLite extensions for real migration replay
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d62-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-mbstring >> "$RUNNER_TEMP/d62-apt.txt" 2>&1
          php8.3 -m | grep -Fx pdo_sqlite
          php8.3 -m | grep -Fx sqlite3
          echo "P01_D62_ISOLATED_NATIVE_PHP_SQLITE=PASS"
      - name: Run genuine 20 legacy SQLite migrations, read-only scanner and negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 -l candidate/src/app/next/runtime/LegacyV247515SnapshotAudit.php
          php8.3 -l candidate/tests/compatibility/laravel/run_legacy_247515_snapshot_audit.php
          if ! P01_D62_SYNTHETIC_ONLY=YES php8.3 candidate/tests/compatibility/laravel/run_legacy_247515_snapshot_audit.php > "$RUNNER_TEMP/d62-report.txt" 2>&1; then
            grep -E '^P01_D62_|^PHP Fatal|^Fatal error|^Uncaught|^Stack trace:|^#0|D62_TEST_|D62 ' "$RUNNER_TEMP/d62-report.txt" | tail -n 45 || true
            exit 1
          fi
          grep '^P01_D62_' "$RUNNER_TEMP/d62-report.txt"
          grep -Fx 'P01_D62_SYNTHETIC_OFFICIAL_LINEAGE_READONLY=PASS' "$RUNNER_TEMP/d62-report.txt"
          grep -Fx 'P01_D62_OLD_SCHEMA_TAMPER_WAL_HARDLINK_EXTRA_NEGATIVES=PASS' "$RUNNER_TEMP/d62-report.txt"
          grep -Fx 'P01_D62_LEGACY_TO_LARAVEL_ATOMIC_READY=NO' "$RUNNER_TEMP/d62-report.txt"
          echo "P01_D62_COMPLETE_SCOPED_READONLY_GATE=PASS"
      - name: Always erase private candidate and synthetic test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/d62-apt.txt" "$RUNNER_TEMP/d62-report.txt"
          echo "P01_D62_PRIVATE_SOURCE_OR_DATA_PERSISTED=NO"
          echo "P01_D62_PUBLIC_ARTIFACTS=NONE"
