name: P04 V2.7.9 Release Dispatch Observer

on:
  pull_request:
    branches: [main]
    paths:
      - 'requests/p04-v279-release-dispatch-*.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Dispatch formal release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run p04-v279-formal-release.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 4
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow p04-v279-formal-release.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt,status --jq '[.[] | select(.createdAt >= "'"$BEFORE"'")][0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != null
          echo "DISPATCHED_RUN_ID=$RUN_ID"
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,url
