name: R54 Derived Search Public Runner Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r54-derived-search-public-gate.yml'

permissions:
  contents: read

jobs:
  r54-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 6f98080184dcf3f5880d4864e4a7ec68f278ad9b
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 6f98080184dcf3f5880d4864e4a7ec68f278ad9b
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat vf-start/VERSION)" = '2.47.0'
          echo R54_EXACT_SOURCE_BOUND

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Focused source and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          php -l src/app/ToolProductPage.php
          php -l src/app/SoftwareWorkspaceDetail.php
          php tests/unit/derived_search_recommend_sort_contract.php
          php tests/unit/contextual_product_relevance_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/tool_scene_explainability_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          php tests/unit/software_group_explainability_contract.php
          echo R54_PUBLIC_SOURCE_REGRESSION_PASS

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Build real-source URL fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > vf-start/_r54_fixture.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once __DIR__ . '/src/app/ToolProductPage.php';
          require_once __DIR__ . '/src/app/SoftwareWorkspaceDetail.php';
          $q = trim((string)($_GET['q'] ?? ''));
          $scope = trim((string)($_GET['scope'] ?? 'all'));
          $platform = trim((string)($_GET['os'] ?? 'all'));
          $recommendSort = $q !== '' ? 'default' : null;
          $toolMethod = new ReflectionMethod(VfToolProductPage::class, 'url');
          $softwareMethod = new ReflectionMethod(VfSoftwareWorkspaceDetail::class, 'url');
          $toolRecommend = (string)$toolMethod->invoke(null, ['view'=>null,'sort'=>$recommendSort,'page'=>null], $scope, false);
          $toolRelevance = (string)$toolMethod->invoke(null, ['sort'=>'relevance','page'=>null], $scope, false);
          $toolTitle = (string)$toolMethod->invoke(null, ['view'=>null,'sort'=>'title','page'=>null], $scope, false);
          $softwareRecommend = (string)$softwareMethod->invoke(null, ['view'=>null,'sort'=>$recommendSort,'page'=>null], $scope, $platform);
          $softwareRelevance = (string)$softwareMethod->invoke(null, ['sort'=>'relevance','page'=>null], $scope, $platform);
          $softwareTitle = (string)$softwareMethod->invoke(null, ['sort'=>'title','view'=>null,'page'=>null], $scope, $platform);
          $h = static fn(string $v): string => htmlspecialchars($v, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
          header('Content-Type: text/html; charset=utf-8');
          ?><!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R54</title></head><body>
          <nav id="tools"><a id="tool-recommend" href="<?=$h($toolRecommend)?>">推荐</a><a id="tool-relevance" href="<?=$h($toolRelevance)?>">相关度</a><a id="tool-title" href="<?=$h($toolTitle)?>">A–Z</a></nav>
          <nav id="software"><a id="software-recommend" href="<?=$h($softwareRecommend)?>">推荐</a><a id="software-relevance" href="<?=$h($softwareRelevance)?>">相关度</a><a id="software-title" href="<?=$h($softwareTitle)?>">A–Z</a></nav>
          </body></html>
          PHP
          php -l vf-start/_r54_fixture.php

      - name: Real Chromium desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          (cd vf-start && php -S 127.0.0.1:8770 -t . >"$RUNNER_TEMP/r54-php.log" 2>&1) &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8770/_r54_fixture.php' >/dev/null; then break; fi
            sleep 0.5
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = (c,m)=>{ if(!c) throw new Error(m); };
          const params = href => Object.fromEntries(new URL(href,'http://127.0.0.1:8770/').searchParams.entries());
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const width of [1280,390]) {
              const page = await browser.newPage({viewport:{width,height:900}});
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:8770/_r54_fixture.php?q=pdf&scope=private&page=4&view=favorite&os=windows&kind=%E5%BC%80%E5%8F%91');
              assert(errors.length===0,'pageerror search '+width+': '+errors.join(' | '));
              const tr=params(await page.locator('#tool-recommend').getAttribute('href'));
              assert(tr.q==='pdf'&&tr.scope==='private'&&tr.sort==='default','tool recommendation did not switch search to default '+width+': '+JSON.stringify(tr));
              assert(!('page' in tr)&&!('view' in tr),'tool recommendation kept stale page/view '+width+': '+JSON.stringify(tr));
              const sr=params(await page.locator('#software-recommend').getAttribute('href'));
              assert(sr.q==='pdf'&&sr.scope==='private'&&sr.os==='windows'&&sr.kind==='开发'&&sr.sort==='default','software recommendation lost search/platform/kind or default sort '+width+': '+JSON.stringify(sr));
              assert(!('page' in sr)&&!('view' in sr),'software recommendation kept stale page/view '+width+': '+JSON.stringify(sr));
              const trel=params(await page.locator('#tool-relevance').getAttribute('href')); assert(trel.sort==='relevance'&&trel.q==='pdf','tool relevance action broken '+width);
              const srel=params(await page.locator('#software-relevance').getAttribute('href')); assert(srel.sort==='relevance'&&srel.q==='pdf','software relevance action broken '+width);
              const taz=params(await page.locator('#tool-title').getAttribute('href')); assert(taz.sort==='title'&&taz.q==='pdf','tool A-Z action broken '+width);
              const saz=params(await page.locator('#software-title').getAttribute('href')); assert(saz.sort==='title'&&saz.q==='pdf','software A-Z action broken '+width);
              await page.goto('http://127.0.0.1:8770/_r54_fixture.php?scope=private&sort=title&page=3&view=recent&os=windows&kind=%E5%BC%80%E5%8F%91');
              const trNoQ=params(await page.locator('#tool-recommend').getAttribute('href'));
              assert(!('sort' in trNoQ)&&!('page' in trNoQ)&&!('view' in trNoQ)&&trNoQ.scope==='private','tool no-query recommendation must keep clean default URL '+width+': '+JSON.stringify(trNoQ));
              const srNoQ=params(await page.locator('#software-recommend').getAttribute('href'));
              assert(!('sort' in srNoQ)&&!('page' in srNoQ)&&!('view' in srNoQ)&&srNoQ.scope==='private'&&srNoQ.os==='windows'&&srNoQ.kind==='开发','software no-query recommendation must keep clean default URL '+width+': '+JSON.stringify(srNoQ));
              await page.close();
            }
            await browser.close();
            console.log('R54_REAL_BROWSER_DERIVED_SEARCH_RECOMMEND_SORT_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf vf-start
          rm -f "$RUNNER_TEMP/r54-php.log"
