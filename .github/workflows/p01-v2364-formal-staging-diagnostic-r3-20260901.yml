name: P01 V2.36.4 Formal Staging Diagnostic R3
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-staging-diagnostic-r3-20260901.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      EXPECTED_MAIN: d35038c32b5a287636ee92d9fe074ea12c1469ef
      EXPECTED_DEVELOP: 5615d19b07303132e8fc2e374de1236a37f3cb16
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Diagnose every formal staging fence without push
        shell: bash
        run: |
          set -Eeuxo pipefail
          cd p01
          echo MARKER_01_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEVELOP"
          echo MARKER_02_REMOTE_HEADS
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          echo MARKER_03_FETCH_FORMAL
          git fetch origin "$FORMAL_SOURCE" --quiet
          test "$(git rev-parse "$FORMAL_SOURCE^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"
          echo MARKER_04_NINE_FILE_SNAPSHOT_DIFF
          git diff --name-only "$EXPECTED_DEVELOP" "$FORMAL_SOURCE" | sort | tee /tmp/p01-v2364-r3-all.txt
          ACTUAL_ALL=$(git diff --name-only "$EXPECTED_DEVELOP" "$FORMAL_SOURCE" | sort | tr '\n' ' ')
          EXPECTED_ALL='CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php '
          printf 'ACTUAL_ALL=<%s>\nEXPECTED_ALL=<%s>\n' "$ACTUAL_ALL" "$EXPECTED_ALL"
          test "$ACTUAL_ALL" = "$EXPECTED_ALL"
          echo MARKER_05_LOCAL_BRANCH
          git switch -c diagnostic/p01-v2364-formal-staging-r3 "$EXPECTED_DEVELOP"
          echo MARKER_06_CHECKOUT_RELEASE_FILES
          git checkout "$FORMAL_SOURCE" -- CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          echo MARKER_07_STATUS_AFTER_CHECKOUT
          git status --short
          git diff --name-only | sort | tee /tmp/p01-v2364-r3-release.txt
          ACTUAL_RELEASE=$(git diff --name-only | sort | tr '\n' ' ')
          EXPECTED_RELEASE='CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php '
          printf 'ACTUAL_RELEASE=<%s>\nEXPECTED_RELEASE=<%s>\n' "$ACTUAL_RELEASE" "$EXPECTED_RELEASE"
          test "$ACTUAL_RELEASE" = "$EXPECTED_RELEASE"
          echo MARKER_08_DIFF_CHECK
          git diff --check
          echo MARKER_09_FORMAL_BLOB_IDENTITIES
          for f in CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php; do
            GOT=$(git hash-object "$f")
            WANT=$(git rev-parse "$FORMAL_SOURCE:$f")
            printf 'FORMAL_BLOB %s GOT=%s WANT=%s\n' "$f" "$GOT" "$WANT"
            test "$GOT" = "$WANT"
          done
          echo MARKER_10_PROTECTED_AUTHORITY_IDENTITIES
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            GOT=$(git hash-object "$f")
            WANT=$(git rev-parse "$EXPECTED_DEVELOP:$f")
            printf 'PROTECTED_BLOB %s GOT=%s WANT=%s\n' "$f" "$GOT" "$WANT"
            test "$GOT" = "$WANT"
          done
          echo MARKER_11_LOCAL_COMMIT
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): stage V2.36.4 formal patch source [diagnostic only]'
          STAGED=$(git rev-parse HEAD)
          printf 'LOCAL_STAGED=%s\nLOCAL_TREE=%s\nLOCAL_RUNTIME_TREE=%s\n' "$STAGED" "$(git rev-parse HEAD^{tree})" "$(git rev-parse HEAD:src)"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          echo MARKER_12_VERSION_AUTHORITY
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.3
          test "$(jq -r .candidate_version VF_PROJECT.json)" = 2.36.4
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          echo MARKER_13_REMAINING_FORMAL_DIFF
          git diff --name-only "$STAGED" "$FORMAL_SOURCE" | sort | tee /tmp/p01-v2364-r3-remain.txt
          REMAIN=$(git diff --name-only "$STAGED" "$FORMAL_SOURCE" | sort | tr '\n' ' ')
          EXPECTED_REMAIN='docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md '
          printf 'REMAIN=<%s>\nEXPECTED_REMAIN=<%s>\n' "$REMAIN" "$EXPECTED_REMAIN"
          test "$REMAIN" = "$EXPECTED_REMAIN"
          echo MARKER_14_PROTECTED_STAGED_IDENTITIES
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$STAGED:$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"
          done
          echo MARKER_15_NO_REMOTE_WRITE
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code --heads origin refs/heads/release/p01-v2364-formal-staging-20260901 >/dev/null 2>&1; then echo UNEXPECTED_REMOTE_STAGING_BRANCH; exit 30; fi
          printf 'P01_V2364_FORMAL_STAGING_DIAGNOSTIC_R3=PASS\nLOCAL_STAGED=%s\nRUNTIME_TREE=%s\nREMAINING_FORMAL_DIFF=PROTECTED_AUTHORITY_ONLY\nREMOTE_WRITE=NO\n' "$STAGED" "$RUNTIME_TREE" | tee /tmp/p01-v2364-formal-staging-diagnostic-r3.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-formal-staging-diagnostic-r3-${{ github.run_id }}
          path: |
            /tmp/p01-v2364-formal-staging-diagnostic-r3.txt
            /tmp/p01-v2364-r3-all.txt
            /tmp/p01-v2364-r3-release.txt
            /tmp/p01-v2364-r3-remain.txt
          if-no-files-found: warn
          retention-days: 90
