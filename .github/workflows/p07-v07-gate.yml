name: P07 OneShot Bench v0.7 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v07-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git show 0b61919574f944e538af89ffd9c1522ae2c28c9e:experiments/p07-bench.sh > /tmp/p07-bench-v07.sh
          chmod +x /tmp/p07-bench-v07.sh
          grep -F 'VERSION="0.7.0"' /tmp/p07-bench-v07.sh
      - name: Syntax and self-test
        shell: bash
        run: |
          set -euo pipefail
          bash -n /tmp/p07-bench-v07.sh
          /tmp/p07-bench-v07.sh --version | grep -F '0.7.0'
          /tmp/p07-bench-v07.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: One-shot demo contract
        shell: bash
        run: |
          set -euo pipefail
          /tmp/p07-bench-v07.sh --demo >/tmp/demo
          grep -F 'P07 Enhanced Bench' /tmp/demo
          grep -F 'Speedtest.net' /tmp/demo
          grep -F 'Evidence Quality' /tmp/demo
          ! grep -q '请选择\|Select option' /tmp/demo
      - name: Backend fail-fast contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RATE_LIMITED' /tmp/p07-bench-v07.sh
          grep -F 'BACKEND_UNAVAILABLE' /tmp/p07-bench-v07.sh
          grep -F 'Speedtest backend preflight failed' /tmp/p07-bench-v07.sh
          grep -F 'Remaining node tests skipped' /tmp/p07-bench-v07.sh
      - name: Same-shell wrapper contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'output="$(speed_node ' /tmp/p07-bench-v07.sh
          grep -F 'speed_node "$id" "$name" >"$out"' /tmp/p07-bench-v07.sh
          grep -F 'speed_node "$id" "$label" >"$out"' /tmp/p07-bench-v07.sh
          grep -F 'Lifecycle Pool' /tmp/p07-bench-v07.sh
      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'curl .*--insecure|curl .* -k|wget .*--no-check-certificate' /tmp/p07-bench-v07.sh
          ! grep -E 'sysctl -w|systemctl restart|reboot|shutdown' /tmp/p07-bench-v07.sh
          grep -F 'sha256sum' /tmp/p07-bench-v07.sh
