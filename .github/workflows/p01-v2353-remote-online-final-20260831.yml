name: P01 V2.35.3 Final Remote Online Update Gate
on:
  push:
    branches: [release/p01-v2353-remote-online-20260831]
    paths:
      - .github/workflows/p01-v2353-remote-online-final-20260831.yml
      - scripts/p01-v2353-remote-online-final.sh
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v2353-final-owner
      PORT: '18753'
      ADMIN_PASS: 'P01V2353!FinalRemote'
      EVID: /tmp/p01-v2353-final-evidence
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout immutable V2.35.2 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source
      - name: Checkout immutable V2.35.3 target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout published V2.35.3 core-updates authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: f4425f51ef9cc1db92d4e801771b111fd2f8a66d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact publication and discovery fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C source rev-parse HEAD)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(git -C source rev-parse HEAD^{tree})" = 5d179443e215879259e3b5560c5e3c0342c2149b
          test "$(git -C source rev-parse HEAD:src)" = f000f39c1a2cf48296a4c165726323dabaf5e37c
          test "$(git -C target rev-parse HEAD)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(git -C target rev-parse HEAD^{tree})" = ece02ef928ad5b119e2b0237e7963a607865ddbb
          test "$(git -C target rev-parse HEAD:src)" = 7f181909c7ccd3179491f21cfca426008de4295f
          test "$(git -C updates rev-parse HEAD)" = f4425f51ef9cc1db92d4e801771b111fd2f8a66d
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = f4425f51ef9cc1db92d4e801771b111fd2f8a66d
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.2 --jq .object.sha)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.3 --jq .object.sha)" = 8f1073120f8096fc23554906615601752feb036d
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.3 --jq .id)" = 379531423
          for run in 33356120668 33358556905 33358914290 33359124042 33360911751 33361025502 33361158545 33361332817; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success; done
          jq -e '.current_version=="2.35.2" and .target_version=="2.35.3" and .from_versions==["2.35.2"] and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.35.3" and .release_id==379531423 and .product_identity=="8f1073120f8096fc23554906615601752feb036d" and .asset_name=="VF_Start_V2.35.3_UPDATE.zip" and .asset_bytes==1378346 and .asset_sha256=="ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9"' updates/projects/P01.json >/dev/null
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.3)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.3_UPDATE.zip")|.size' <<<"$REL")" = 1378346
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.3_UPDATE.zip")|.digest' <<<"$REL")" = sha256:ca128a49c56901fe4ea7c108b7b78bde25584973362bf22e6fdc874782b390c9
          echo P01_V2353_FINAL_REMOTE_TRUTH_FENCE=PASS | tee "$EVID/truth-fence.txt"
      - name: Real remote online update and V2.35.3 runtime gate
        shell: bash
        run: bash runner/scripts/p01-v2353-remote-online-final.sh
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2352_TO_V2353_REMOTE_ONLINE_UPDATE=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_REMOTE_DISCOVERY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_REMOTE_RELEASE_DOWNLOAD=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_DATA_PRESERVATION=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_SQLITE_INTEGRITY=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_PUBLIC_PRIVATE_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_FIVE_DOMAIN_HTTP=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_RUNTIME_FEATURE_BYTES=PASS "$EVID/runtime-verdict.txt"
          grep -Fx P01_V2353_LATEST_TERMINAL_STATE=PASS "$EVID/runtime-verdict.txt"
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2352_TO_V2353_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V2353_SCHEMA_UNCHANGED_2026082901=PASS
          P01_V2353_DATA_PRESERVATION=PASS
          P01_V2353_SQLITE_INTEGRITY=PASS
          P01_V2353_PUBLIC_PRIVATE_HTTP=PASS
          P01_V2353_FIVE_DOMAIN_HTTP=PASS
          P01_V2353_RUNTIME_FEATURE_BYTES=PASS
          P01_V2353_LATEST_TERMINAL_STATE=PASS
          P01_V2353_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"
      - name: Upload final remote evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2353-final-remote-evidence-${{ github.run_id }}
          path: /tmp/p01-v2353-final-evidence
          if-no-files-found: warn
          retention-days: 90
