name: S01 R8 V6 sealed runtime contract and legacy preservation
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-v6-seal-20261103.yml'
      - 'lanes/s01-r8-v6-20261103/**'
permissions:
  contents: read
jobs:
  v6-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: c1a69da4c5c6c40954a3319cc0976065324c77ed
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - name: Verify exact V6 sealed contract and historical MariaDB immutability
        shell: bash
        run: bash control/lanes/s01-r8-v6-20261103/validate.sh
      - name: Delete isolated fixture and private checked-out source
        if: always()
        shell: bash
        run: rm -rf candidate /tmp/s01-r8-v6-wp /tmp/s01-r8-v6-old.json /tmp/s01-r8-wpcli.phar
