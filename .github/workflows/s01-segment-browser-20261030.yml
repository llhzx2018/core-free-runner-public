name: S01 segment viewer WordPress browser proof
on:
  push:
    branches: [task/s01-segment-current-proof-20261031]
    paths: ['.github/workflows/s01-segment-browser-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 814e695d515319b9252440dc5cac405609c27bda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7c211543436cc5e03089b1fb9bcab255be9dc2ec
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: plugin-source
      - name: Verify exact source and setup
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = 814e695d515319b9252440dc5cac405609c27bda
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 5b6c1803fb9806a6c683a4819da6847626d796bb
          git -C target diff --name-only 2c89b3ee3fa09a8bce43d9ef3c2f0d605eb2944d HEAD | sort > /tmp/changed
          printf '%s\n' VERSION CHANGELOG.md src/style.css src/inc/runtime-constants.php src/inc/services/frontend-page-progress-service.php src/inc/seo-flow/seo-flow-content.php src/inc/seo-flow/seo-flow-related.php src/inc/modules/module-steps.php src/inc/seo-integration.php src/inc/frontend-seo-context.php src/inc/bootstrap/public-runtime.php src/inc/public-css-owner-registry.php src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css src/assets/css/public/vf-theme-public-runtime.css | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          php -l target/src/inc/seo-flow/seo-flow-content.php
          php -l target/src/inc/seo-flow/seo-flow-related.php
          php -l target/src/inc/modules/module-steps.php
          php -l target/src/inc/seo-integration.php
          test "$(git -C plugin-source rev-parse HEAD)" = 7c211543436cc5e03089b1fb9bcab255be9dc2ec
          test "$(git -C plugin-source rev-parse 'HEAD^{tree}')" = 5ef7d56490472d8a5ef61a2eb425c764cb9a7aaa
          php -l plugin-source/src/includes/i18n.php
          php plugin-source/tests/segment-i18n-markup-contract.php
          php plugin-source/tests/converter-i18n-markup-contract.php
          php plugin-source/tests/browser-stream-i18n-markup-contract.php
          node --check control/lanes/s01-segment-browser/check.cjs
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir provider
          echo 'd84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f  provider/vf-tools-m3u8_V1.25.97.zip' | sha256sum -c
          python3 control/lanes/s01-segment-browser/package.py
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: Bilingual WordPress workflow
        run: bash control/lanes/s01-segment-browser/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-segment-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private sources
        if: always()
        run: rm -rf target provider lane

# Inspect route language identity during SEO verification.

# Package count includes the non-runtime manifest.
