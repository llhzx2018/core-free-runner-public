name: S01 segment viewer WordPress browser proof
on:
  push:
    branches: [task/s01-segment-php-20261030]
    paths: ['.github/workflows/s01-segment-browser-20261030.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1b11ab59ae6249ad4a1ff48414c416ca4092ad1a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify exact source and setup
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = 1b11ab59ae6249ad4a1ff48414c416ca4092ad1a
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 29b3d641922ab5c99ec1c05e08be6eb72c84661e
          git -C target diff --name-only 25f956f608b18f6c61ef73ca861b3a984f02b8c7 HEAD | sort > /tmp/changed
          printf '%s\n' src/inc/seo-flow/seo-flow-content.php src/inc/seo-flow/seo-flow-related.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          php -l target/src/inc/seo-flow/seo-flow-content.php
          php -l target/src/inc/seo-flow/seo-flow-related.php
          node --check control/lanes/s01-segment-browser/check.cjs
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: Bilingual WordPress workflow
        run: bash control/lanes/s01-segment-browser/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-segment-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private sources
        if: always()
        run: rm -rf target provider lane
