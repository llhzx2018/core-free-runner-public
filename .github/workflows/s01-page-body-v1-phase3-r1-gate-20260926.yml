name: S01 Page Body V1 Phase 3 R1 Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-phase3-r1-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-phase3-r1-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: fa1bcb06553b4c4395baa84332740b1956513616
      THEME_SHA: 4863a453c766cfda5e34d48f369fccde0312c998
      M3U8_SHA: d1e6d582a908fffbc9fd66ccb565d80c18a3b947
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: Exact SHAs
        run: |
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"

      - name: Phase 3 R1 contracts
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-page-body-system-v1-phase3-contract.php
          php theme/tests/s01-c01-page-body-system-v1-phase3-contract.php
          php m3u8/tests/s01-c03-page-body-system-v1-phase3-contract.php

      - name: Existing Page Body regressions
        run: |
          set -Eeuo pipefail
          for f in ops/tests/s01-c02-page-body-system-v1-*.php; do php "$f"; done
          for f in theme/tests/s01-c01-page-body-system-v1-*.php; do php "$f"; done
          for f in m3u8/tests/s01-c03-page-body-system-v1-*.php; do php "$f"; done

      - name: Frozen Header selector fence
        run: |
          set -Eeuo pipefail
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-s01-shell-header' ops/assets/css/current/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' theme/src/assets/css/admin/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [
              Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
              Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=p.read_text()
              assert c.count('{')==c.count('}'), p
          print('PASS_CSS_BALANCE')
          PY

      - name: PHP syntax boundary
        run: |
          set -Eeuo pipefail
          find ops/includes theme/src/inc/admin m3u8/src/admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
