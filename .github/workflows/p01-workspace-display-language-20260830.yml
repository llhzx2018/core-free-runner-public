name: P01 Workspace Display Language Build Gate

on:
  push:
    branches:
      - task/p01-workspace-display-language-20260830
    paths:
      - .github/workflows/p01-workspace-display-language-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gate:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EVID: /tmp/p01-workspace-display-language
    steps:
      - name: Checkout runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 8f934157aa2215f7fedf12797c5add7b47c8e70a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Apply display-only convergence patch
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/files"
          python3 - <<'PY'
          from pathlib import Path

          root = Path('p01/src/app')

          core = root / 'FunctionalWorkspaceCore.php'
          s = core.read_text()
          old = """function vf_fw_kind_label(string $mode): string
          {
              return match ($mode) {
                  'channels' => '频道分类',
                  'watch' => '内容类型',
                  'topics' => '专题分类',
                  default => '主分类',
              };
          }
          """
          new = old + """
          function vf_fw_kind_display_label(string $mode, string $kind): string
          {
              $raw = trim($kind);
              if ($raw === '') return '';
              $key = strtolower($raw);
              $labels = match ($mode) {
                  'channels' => [
                      'youtube' => 'YouTube',
                      'podcast' => '播客',
                      'bilibili' => '哔哩哔哩',
                  ],
                  'watch' => [
                      'movie' => '电影',
                      'series' => '剧集',
                      'documentary' => '纪录片',
                      'variety' => '综艺',
                      'anime' => '动漫',
                  ],
                  default => [],
              };
              return $labels[$key] ?? $raw;
          }
          """
          if s.count(old) != 1: raise SystemExit('Core anchor mismatch')
          core.write_text(s.replace(old, new, 1))

          home = root / 'FunctionalHome.php'
          s = home.read_text()
          old = """function vf_home_asset_class(array $asset): string
          {
              $surface = (string)($asset['surface'] ?? 'start');
              if ($surface === 'start') return trim((string)($asset['category_name'] ?? ''));

              $raw = trim((string)($asset['resource_kind'] ?? ''));
              if ($raw === '') return '';
              $key = strtolower($raw);
              $labels = match ($surface) {
                  'channels' => [
                      'youtube' => 'YouTube',
                      'podcast' => '播客',
                      'bilibili' => '哔哩哔哩',
                  ],
                  'watch' => [
                      'movie' => '电影',
                      'series' => '剧集',
                      'documentary' => '纪录片',
                      'variety' => '综艺',
                      'anime' => '动漫',
                  ],
                  default => [],
              };
              return $labels[$key] ?? $raw;
          }
          """
          new = """function vf_home_asset_class(array $asset): string
          {
              $surface = (string)($asset['surface'] ?? 'start');
              if ($surface === 'start') return trim((string)($asset['category_name'] ?? ''));
              return vf_fw_kind_display_label($surface, (string)($asset['resource_kind'] ?? ''));
          }
          """
          if s.count(old) != 1: raise SystemExit('Home anchor mismatch')
          home.write_text(s.replace(old, new, 1))

          shell = root / 'FunctionalWorkspaceShell.php'
          s = shell.read_text()
          old = """function vf_fw_render_kind_nodes(array $counts, string $mode, string $selectedKind): void
          {
              foreach ($counts as $name => $count) {
                  $name = (string)$name;
                  $active = $selectedKind === $name;
                  echo '<a class=\"vf-category-node' . ($active ? ' active' : '') . '\" data-category-node data-label=\"' . vf_fw_h(mb_strtolower($name, 'UTF-8')) . '\" href=\"' . vf_fw_link($mode, ['kind'=>$name]) . '\"><span>' . vf_fw_h($name) . '</span><em>' . number_format((int)$count) . '</em></a>';
              }
          }
          """
          new = """function vf_fw_render_kind_nodes(array $counts, string $mode, string $selectedKind): void
          {
              foreach ($counts as $name => $count) {
                  $name = (string)$name;
                  $display = vf_fw_kind_display_label($mode, $name);
                  $active = $selectedKind === $name;
                  $searchLabel = mb_strtolower(trim($display . ' ' . $name), 'UTF-8');
                  echo '<a class=\"vf-category-node' . ($active ? ' active' : '') . '\" data-category-node data-label=\"' . vf_fw_h($searchLabel) . '\" href=\"' . vf_fw_link($mode, ['kind'=>$name]) . '\"><span>' . vf_fw_h($display) . '</span><em>' . number_format((int)$count) . '</em></a>';
              }
          }
          """
          if s.count(old) != 1: raise SystemExit('Kind node anchor mismatch')
          s = s.replace(old, new, 1)

          old = "<?php if($kind!==''): ?><span class=\"vf-context-chip\"><?=vf_fw_h($kindLabel)?>：<?=vf_fw_h($kind)?></span><?php endif; ?>"
          new = "<?php if($kind!==''): ?><span class=\"vf-context-chip\"><?=vf_fw_h($kindLabel)?>：<?=vf_fw_h(vf_fw_kind_display_label($mode,$kind))?></span><?php endif; ?>"
          if s.count(old) != 1: raise SystemExit('Context chip anchor mismatch')
          s = s.replace(old, new, 1)

          old = "<?=$kind===(string)$name?'selected':''?>><?=vf_fw_h((string)$name)?> · <?=number_format((int)$count)?>"
          new = "<?=$kind===(string)$name?'selected':''?>><?=vf_fw_h(vf_fw_kind_display_label($mode,(string)$name))?> · <?=number_format((int)$count)?>"
          if s.count(old) != 1: raise SystemExit('Mobile filter anchor mismatch')
          s = s.replace(old, new, 1)

          old = "$surface=(string)($asset['surface']??'start');$domain=(string)(parse_url((string)$asset['url'],PHP_URL_HOST)?:'');$isFav=(int)($asset['is_favorite']??0)===1;$private=vf_fw_is_private($asset);$class=$surface==='start'?(string)($asset['category_name']??''):(string)($asset['resource_kind']??'');"
          new = "$surface=(string)($asset['surface']??'start');$domain=(string)(parse_url((string)$asset['url'],PHP_URL_HOST)?:'');$isFav=(int)($asset['is_favorite']??0)===1;$private=vf_fw_is_private($asset);$class=$surface==='start'?(string)($asset['category_name']??''):vf_fw_kind_display_label($surface,(string)($asset['resource_kind']??''));"
          if s.count(old) != 1: raise SystemExit('Row class anchor mismatch')
          s = s.replace(old, new, 1)

          old = "<?=vf_fw_h((string)($asset['resource_kind']?:'未分类'))?>"
          new_watch = "<?=vf_fw_h(vf_fw_kind_display_label('watch',(string)($asset['resource_kind']??'')) ?: '未分类')?>"
          if s.count(old) != 2: raise SystemExit(f'Card resource kind anchor mismatch: {s.count(old)}')
          s = s.replace(old, new_watch, 1)
          new_topic = "<?=vf_fw_h(vf_fw_kind_display_label('topics',(string)($asset['resource_kind']??'')) ?: '未分类')?>"
          s = s.replace(old, new_topic, 1)
          shell.write_text(s)
          PY

          git -C p01 diff --check
          git -C p01 diff --name-only 8f934157aa2215f7fedf12797c5add7b47c8e70a | sort | tee "$EVID/changed-files.txt"
          cat > "$EVID/expected-files.txt" <<'EOF'
          src/app/FunctionalHome.php
          src/app/FunctionalWorkspaceCore.php
          src/app/FunctionalWorkspaceShell.php
          EOF
          sort -o "$EVID/expected-files.txt" "$EVID/expected-files.txt"
          diff -u "$EVID/expected-files.txt" "$EVID/changed-files.txt"

      - name: PHP and render contract gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l p01/src/app/FunctionalWorkspaceCore.php
          php -l p01/src/app/FunctionalWorkspaceShell.php
          php -l p01/src/app/FunctionalHome.php

          php -r '
            require "p01/src/app/FunctionalHome.php";
            $cases=[
              ["channels","youtube","YouTube"],
              ["channels","podcast","播客"],
              ["channels","bilibili","哔哩哔哩"],
              ["watch","movie","电影"],
              ["watch","series","剧集"],
              ["watch","documentary","纪录片"],
              ["watch","variety","综艺"],
              ["watch","anime","动漫"],
              ["watch","自定义类型","自定义类型"],
              ["topics","研究","研究"],
            ];
            foreach($cases as [$m,$k,$want]){ $got=vf_fw_kind_display_label($m,$k); if($got!==$want){fwrite(STDERR,json_encode([$m,$k,$want,$got],JSON_UNESCAPED_UNICODE)."\n");exit(1);} }
            if(vf_home_asset_class(["surface"=>"watch","resource_kind"=>"movie"])!=="电影") exit(2);

            $_GET=[];
            ob_start(); vf_fw_render_kind_nodes(["movie"=>2,"series"=>1,"自定义类型"=>1],"watch","movie"); $html=ob_get_clean();
            foreach([">电影<",">剧集<",">自定义类型<","kind=movie"] as $needle){if(strpos($html,$needle)===false){fwrite(STDERR,"kind-node missing: $needle\n");exit(3);}}
            if(strpos($html,">movie<")!==false || strpos($html,">series<")!==false) exit(4);

            ob_start(); vf_fw_render_head(["title"=>"影视","scope"=>"all","admin"=>true,"category_name"=>"","kind"=>"movie","kind_label"=>"内容类型","q"=>"","total"=>2,"range_start"=>1,"range_end"=>2,"mode"=>"watch","category_id"=>0]); $head=ob_get_clean();
            if(strpos($head,"内容类型：电影")===false || strpos($head,"value=\"movie\"")===false) exit(5);

            ob_start(); vf_fw_render_mobile_filters("watch",true,"all",[],[],0,["movie"=>2],"movie"); $mobile=ob_get_clean();
            if(strpos($mobile,"电影 · 2")===false || strpos($mobile,"kind=movie")===false) exit(6);

            $asset=["id"=>1,"surface"=>"watch","url"=>"https://example.com/a","title"=>"测试电影","resource_kind"=>"movie","is_favorite"=>0,"is_private"=>0,"tags"=>[]];
            ob_start(); vf_fw_render_row($asset,false,true); $row=ob_get_clean(); if(strpos($row,"example.com · 电影")===false) exit(7);
            ob_start(); vf_fw_render_watch_card($asset,false); $card=ob_get_clean(); if(strpos($card,">电影<")===false) exit(8);
            echo "P01_WORKSPACE_DISPLAY_LANGUAGE=PASS\n";
          ' | tee "$EVID/render-contract.txt"

      - name: Package candidate files and hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID/files/src/app"
          cp p01/src/app/FunctionalWorkspaceCore.php "$EVID/files/src/app/"
          cp p01/src/app/FunctionalWorkspaceShell.php "$EVID/files/src/app/"
          cp p01/src/app/FunctionalHome.php "$EVID/files/src/app/"
          sha256sum "$EVID/files/src/app/"*.php | tee "$EVID/sha256.txt"
          git -C p01 diff 8f934157aa2215f7fedf12797c5add7b47c8e70a -- src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/app/FunctionalHome.php > "$EVID/candidate.diff"
          printf 'BASE=8f934157aa2215f7fedf12797c5add7b47c8e70a\nRESULT=PASS\n' > "$EVID/verdict.txt"

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-workspace-display-language-${{ github.run_id }}
          path: ${{ env.EVID }}
          retention-days: 30
