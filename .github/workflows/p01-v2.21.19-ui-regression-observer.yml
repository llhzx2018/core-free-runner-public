name: P01 V2.21.19 UI Regression Observer
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.19-ui-regression-observer.yml']
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 15
          gh api repos/llhzx2018/core-free-runner-public/actions/workflows/p01-v2.21.19-reference-ui-regression.yml/runs -f branch=vf-agent-operations-v1 -f per_page=3 >/tmp/runs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'));runs=[{k:r.get(k) for k in ['id','status','conclusion','run_attempt','head_sha','created_at','updated_at']} for r in x.get('workflow_runs',[])[:3]]
          open('/tmp/out.json','w').write(json.dumps({'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_UI_REGRESSION_OBSERVER','runs':runs},indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git repo
          mkdir -p repo/vf-agent/results;cp /tmp/out.json repo/vf-agent/results/P01-V2.21.19-UI-REGRESSION-OBSERVER.json
          git -C repo config user.name VictorForge;git -C repo config user.email llhzx2018@gmail.com;git -C repo add vf-agent/results/P01-V2.21.19-UI-REGRESSION-OBSERVER.json
          git -C repo commit -q -m 'evidence(P01): observe V2.21.19 UI regression'||true
          for i in 1 2 3;do git -C repo pull -q --rebase origin vf-agent-operations-v1&&git -C repo push -q origin HEAD:vf-agent-operations-v1&&exit 0||sleep 2;done;exit 1
