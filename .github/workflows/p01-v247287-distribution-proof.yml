name: P01 temporary Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247287-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: c4ff1705f499118d2ff8745b484792a3c2251754
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Canonical distribution validation
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.286'
          assert p['target_version']=='2.47.287'
          assert p['from_versions']==['2.47.286']
          assert p['product_identity']=='98d5ab25109dc5c696a91343e6170455a1c92ee3'
          assert p['asset_sha256']=='e8d19d28fa9d192326df4b0592687e1910dbbd69210238e3fcc3d882bc03335c'
          assert p['asset_bytes']==2362531
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_DISTRIBUTION_CANONICAL=PASS
