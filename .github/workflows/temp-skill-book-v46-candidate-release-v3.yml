name: TEMP skill-book V4.6 Candidate Release V3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v46-candidate-release-v3.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v46-candidate-release-v3
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: llhzx2018/gov-doc
  SOURCE_COMMIT: '27ca368b9f7bc8d6160ff5049562c74cb440144b'
  SOURCE_PATH: skills/skill-book/V4.6
  TARGET_VERSION: '4.6'
  SOURCE_CURRENT: '3.5'
  TAG: skill-book-v4.6-candidate-20260827
  ASSET_NAME: skill-book_V4.6_CANDIDATE_20260827.zip
  SHA_NAME: skill-book_V4.6_CANDIDATE_20260827.zip.sha256

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Registered release capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -n "$RELEASE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN_MISSING' >&2; exit 78; }
          echo 'REGISTERED_RELEASE_CAPABILITIES=PASS'

      - name: Checkout exact GOV-DOC Candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source

      - name: Exact source preflight and tests
        shell: bash
        working-directory: source/skills/skill-book/V4.6
        run: |
          set -Eeuo pipefail
          test "$(git -C ../../.. rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          jq -e '.version=="4.6" and .status=="CANDIDATE_NOT_CURRENT" and .source_current_skill=="3.5" and .validation.python_unit_tests=="27/27 PASS" and .current_promotion=="NOT_AUTHORIZED"' MANIFEST.json >/dev/null
          grep -Fq 'SEALED_STANDALONE_FORWARD' SKILL.md
          grep -Fq 'BOOK-GATE-PRACTICAL-ASSET-ADEQUACY' SKILL.md
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/v46-tests.txt"
          grep -Eq 'Ran 27 tests' "$RUNNER_TEMP/v46-tests.txt"
          grep -Eq '^OK$' "$RUNNER_TEMP/v46-tests.txt"
          python -m compileall -q scripts tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          echo 'EXACT_SOURCE_AND_27_TESTS=PASS'

      - name: Build deterministic Candidate ZIP twice
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v46-build-a" "$RUNNER_TEMP/v46-build-b" "$RUNNER_TEMP/v46-release"
          mkdir -p "$RUNNER_TEMP/v46-build-a" "$RUNNER_TEMP/v46-build-b" "$RUNNER_TEMP/v46-release"
          SOURCE_FILE_COUNT="$(find "source/$SOURCE_PATH" -type f ! -path '*/__pycache__/*' ! -name '*.pyc' | wc -l | tr -d ' ')"
          test "$SOURCE_FILE_COUNT" -gt 0
          for out in "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-build-b/$ASSET_NAME"; do
            SRC="source/$SOURCE_PATH" OUT="$out" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          src=Path(os.environ['SRC']); out=Path(os.environ['OUT']); prefix='skill-book_V4.6_CANDIDATE'
          files=sorted(p for p in src.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in files:
                  rel=p.relative_to(src).as_posix()
                  info=zipfile.ZipInfo(f'{prefix}/{rel}',date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3; info.external_attr=(0o100644<<16)
                  z.writestr(info,p.read_bytes())
          PY
          done
          cmp "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-build-b/$ASSET_NAME"
          cp "$RUNNER_TEMP/v46-build-a/$ASSET_NAME" "$RUNNER_TEMP/v46-release/$ASSET_NAME"
          ASSET="$RUNNER_TEMP/v46-release/$ASSET_NAME" SOURCE_FILE_COUNT="$SOURCE_FILE_COUNT" SRC_ROOT="source/$SOURCE_PATH" python3 - <<'PY'
          from pathlib import Path
          import json, os, zipfile
          p=Path(os.environ['ASSET']); prefix='skill-book_V4.6_CANDIDATE/'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
              file_names=[n for n in names if not n.endswith('/')]
              assert len(file_names)==int(os.environ['SOURCE_FILE_COUNT'])
              manifest=json.loads((Path(os.environ['SRC_ROOT'])/'MANIFEST.json').read_text(encoding='utf-8'))
              for item in manifest.get('files',[]):
                  assert names.count(prefix+item['path'])==1, item['path']
          print('ZIP_STRUCTURE_MANIFEST_PATHS=PASS')
          PY
          ASSET_BYTES="$(stat -c%s "$RUNNER_TEMP/v46-release/$ASSET_NAME")"
          ASSET_SHA256="$(sha256sum "$RUNNER_TEMP/v46-release/$ASSET_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$ASSET_SHA256" "$ASSET_NAME" > "$RUNNER_TEMP/v46-release/$SHA_NAME"
          {
            echo "ASSET_BYTES=$ASSET_BYTES"
            echo "ASSET_SHA256=$ASSET_SHA256"
            echo "SOURCE_FILE_COUNT=$SOURCE_FILE_COUNT"
          } >> "$GITHUB_ENV"
          echo "ASSET_BYTES=$ASSET_BYTES"
          echo "ASSET_SHA256=$ASSET_SHA256"
          echo 'DETERMINISTIC_BUILD_TWICE=PASS'

      - name: Create exact Candidate tag and prerelease
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source config user.name 'VF Release Automation'
          git -C source config user.email 'release@kewaro.com'
          if git -C source show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git -C source rev-list -n1 "$TAG")" = "$SOURCE_COMMIT"
          else
            git -C source tag -a "$TAG" "$SOURCE_COMMIT" -m 'skill-book V4.6 Candidate'
            git -C source remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${SOURCE_REPOSITORY}.git"
            git -C source push origin "refs/tags/$TAG"
          fi
          cat > "$RUNNER_TEMP/v46-release/release-notes.md" <<EOF
          skill-book V4.6 Candidate / NOT CURRENT.

          Source authority: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}
          Source path: ${SOURCE_PATH}
          Source Current remains: skill-book V${SOURCE_CURRENT}
          Unit tests: 27/27 PASS
          Reader Outcome Doctrine: READ / LEARN / TRAIN / DO
          Added: complexity-calibrated depth, practical-asset adequacy, training-instrument strength, sealed standalone forward + post-draft baseline differential.
          Real Reader Forward Evidence: NOT_RUN
          Current Promotion: NOT_AUTHORIZED
          EOF
          if gh release view "$TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/v46-release/$ASSET_NAME#$ASSET_NAME" "$RUNNER_TEMP/v46-release/$SHA_NAME#$SHA_NAME" --repo "$SOURCE_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/v46-release/$ASSET_NAME#$ASSET_NAME" "$RUNNER_TEMP/v46-release/$SHA_NAME#$SHA_NAME" --repo "$SOURCE_REPOSITORY" --title 'skill-book V4.6 Candidate' --notes-file "$RUNNER_TEMP/v46-release/release-notes.md" --prerelease --verify-tag
          fi
          echo 'V46_CANDIDATE_PRERELEASE_CREATED=PASS'

      - name: Remote Release Asset readback and verification
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/v46-readback" && mkdir -p "$RUNNER_TEMP/v46-readback"
          gh release download "$TAG" --repo "$SOURCE_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$SHA_NAME" --dir "$RUNNER_TEMP/v46-readback"
          test "$(stat -c%s "$RUNNER_TEMP/v46-readback/$ASSET_NAME")" = "$ASSET_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/v46-readback/$ASSET_NAME" | awk '{print $1}')" = "$ASSET_SHA256"
          grep -Fq "$ASSET_SHA256  $ASSET_NAME" "$RUNNER_TEMP/v46-readback/$SHA_NAME"
          ASSET="$RUNNER_TEMP/v46-readback/$ASSET_NAME" python3 - <<'PY'
          from pathlib import Path
          import os, zipfile
          p=Path(os.environ['ASSET'])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist(); assert len(names)==len(set(names))
              assert not any(n.startswith('/') or '..' in Path(n).parts for n in names)
              assert not any('__pycache__' in n or n.endswith('.pyc') for n in names)
          print('REMOTE_ASSET_SHA_CRC_PATHS=PASS')
          PY

      - name: Capture final remote release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG")"
          RELEASE_ID="$(jq -r '.id' <<<"$release_json")"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          SHA_ASSET_ID="$(jq -r --arg n "$SHA_NAME" '.assets[]|select(.name==$n)|.id' <<<"$release_json")"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$release_json")"
          test "$REMOTE_DIGEST" = "sha256:$ASSET_SHA256"
          {
            echo "RELEASE_ID=$RELEASE_ID"
            echo "ASSET_ID=$ASSET_ID"
            echo "SHA_ASSET_ID=$SHA_ASSET_ID"
          } >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/V46_RELEASE_EVIDENCE.txt" <<EOF
          SKILL=skill-book
          VERSION=4.6
          STATUS=CANDIDATE_NOT_CURRENT
          SOURCE_COMMIT=$SOURCE_COMMIT
          SOURCE_CURRENT=$SOURCE_CURRENT
          UNIT_TESTS=27/27_PASS
          SOURCE_FILE_COUNT=$SOURCE_FILE_COUNT
          RELEASE_TAG=$TAG
          RELEASE_ID=$RELEASE_ID
          ASSET_NAME=$ASSET_NAME
          ASSET_ID=$ASSET_ID
          ASSET_BYTES=$ASSET_BYTES
          ASSET_SHA256=$ASSET_SHA256
          SHA_ASSET_ID=$SHA_ASSET_ID
          REMOTE_DOWNLOAD_READBACK=PASS
          ZIP_CRC=PASS
          UNSAFE_PATH=0
          DUPLICATE_PATH=0
          PYCACHE_PYC=0
          PRODUCTION_WRITE=0
          CURRENT_PROMOTION=NOT_AUTHORIZED
          EOF
          cat "$RUNNER_TEMP/V46_RELEASE_EVIDENCE.txt"

      - name: Reconcile GOV-DOC Candidate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf gov-live
          git clone --depth 1 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" gov-live
          cd gov-live
          SOURCE_COMMIT="$SOURCE_COMMIT" RELEASE_ID="$RELEASE_ID" ASSET_ID="$ASSET_ID" SHA_ASSET_ID="$SHA_ASSET_ID" ASSET_BYTES="$ASSET_BYTES" ASSET_SHA256="$ASSET_SHA256" RUN_ID="$GITHUB_RUN_ID" JOB_ID="${{ job.status }}" python3 - <<'PY'
          from pathlib import Path
          import os
          source=os.environ['SOURCE_COMMIT']; rid=os.environ['RELEASE_ID']; aid=os.environ['ASSET_ID']; sid=os.environ['SHA_ASSET_ID']; b=os.environ['ASSET_BYTES']; sha=os.environ['ASSET_SHA256']; run=os.environ['RUN_ID']
          tag='skill-book-v4.6-candidate-20260827'; asset='skill-book_V4.6_CANDIDATE_20260827.zip'
          mirror=Path('distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md')
          mirror.write_text(f'''# Runtime ZIP Mirror Status · skill-book V4.6

状态：`PUBLISHED_REMOTE_VERIFIED`

V4.6 Candidate 已通过 `core-free-runner-public` 临时机器 Release Gate 完成远端 Candidate Asset 发布；临时 Workflow 只用于本次发布验证，不进入 Public Runner Current。

## Published Distribution Authority

- Release：`skill-book V4.6 Candidate`（prerelease）
- Tag：`{tag}`
- Release ID：`{rid}`
- File：`{asset}`
- Remote Asset ID：`{aid}`
- Bytes：`{b}`
- SHA-256：`{sha}`
- SHA Asset ID：`{sid}`
- Source Commit：`{source}`
- Runner Run：`{run}`
- Unit Tests：`27/27 PASS`
- Remote download readback：PASS
- ZIP CRC：PASS
- Unsafe Path：0
- Duplicate Path：0
- pycache/pyc：0
- Production Write：0

下载地址：

`https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset}`

SHA 文件：

`https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset}.sha256`

## Authority Boundary

- Source：`skills/skill-book/V4.6/`
- Mother Overlay：`mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md`
- Source Current：`skill-book V3.5`
- V4.6：`CANDIDATE / NOT CURRENT`
- Installed Runtime Observation：`skill-book V4.5 Candidate`
- Real Reader Forward Evidence：`NOT_RUN`
- Backend V4.6 Runtime Forward Test：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`

发布前本地 ZIP `SHA-256=aa7909d64928dfe59ec0aee8383d3d1efd89ad67aa92ffaf847a2ce9e43b5d4e` 只保留为 pre-release local build identity；远端下载回读验证通过的 `{sha}` 为 Published Distribution Authority。
''',encoding='utf-8')

          readme=Path('distribution/skills/candidates/skill-book/V4.6/README.md')
          readme.write_text(f'''# skill-book V4.6 Candidate · Source Distribution

> 状态：`CANDIDATE / NOT CURRENT`  
> Distribution：`PUBLISHED_REMOTE_VERIFIED`  
> Source Authority：`skills/skill-book/V4.6/`  
> Candidate Mother Overlay：`mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md`  
> Source Current保持：`skill-book V3.5`

## Candidate Purpose

V4.6保留V4.5已经验证有效的Reader-facing Cleanliness、Pedagogical Rhythm Diversity、Feedback Closure与独立DO Evidence边界，并新增Adequacy Closure：Complexity-Calibrated Chapter Depth、Practical Asset Adequacy、Training Instrument Strength、SEALED_STANDALONE_FORWARD、Post-Draft Baseline Differential。

其目标不是让书更长，而是阻止“读起来更自然，但复杂任务和关键工具仍被系统性写薄”的假成功。

## Source Validation

- Source Commit：`{source}`
- Python unit tests：`27/27 PASS`
- Python syntax：`PASS`
- Real Reader Forward Evidence：`NOT_RUN`
- Backend V4.6 Runtime Forward Test：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`

## Published Candidate ZIP

- Tag：`{tag}`
- Release ID：`{rid}`
- File：`{asset}`
- Bytes：`{b}`
- SHA-256：`{sha}`
- Asset ID：`{aid}`
- SHA Asset ID：`{sid}`
- Runner Run：`{run}`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`

直接下载：`https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset}`

V4.6 仍为 `CANDIDATE / NOT CURRENT`。Source Current 保持 V3.5；Installed Runtime Observation 在用户实际更新前仍为 V4.5。真人 READ / LEARN / TRAIN Evidence 与后台 V4.6 SEALED Runtime 测试尚未执行，因此不得晋升 Current。
''',encoding='utf-8')

          p=Path('CURRENT.md'); s=p.read_text(encoding='utf-8')
          old='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4` 为保留的历史 Candidate，`V4.5` 为最新 Candidate；六者均未晋升 Source Current，也未进入 Current Distribution。'
          new='`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5` 为保留的历史 Candidate，`V4.6` 为最新 Candidate；七者均未晋升 Source Current。V4.6 已进入 Candidate Distribution，但未进入 Current Distribution。'
          if old in s: s=s.replace(old,new)
          else: assert new in s
          assert '| skill-book | V3.5 | V4.5 CANDIDATE（非 Current） |' in s
          p.write_text(s,encoding='utf-8')

          p=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md'); s=p.read_text(encoding='utf-8'); marker='## Candidate（不改变 Current）'; assert marker in s; head=s.split(marker,1)[0]
          block=f'''## Candidate（不改变 Current）

`skill-book V4.6` 是最新 `CANDIDATE / NOT CURRENT`；Source Current 仍为 V3.5，且 V4.6 不包含在 Current 总包中。Installed Runtime Observation 在用户实际更新前仍为 V4.5。

- [直接下载 skill-book V4.6 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset})
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset}.sha256)
- [查看 V4.6 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/{tag})
- [查看 V4.6 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.6)
- [查看 V4.6 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.6/SKILL_BOOK_V4.6_CANDIDATE_OVERLAY.md)
- [查看 V4.6 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.6/README.md)

Published Distribution Identity：

- Bytes：`{b}`
- SHA-256：`{sha}`
- Release ID：`{rid}`
- Remote Asset ID：`{aid}`
- SHA Asset ID：`{sid}`
- Exact Source Commit：`{source}`
- Runner Run：`{run}`
- Unit Tests：`27/27 PASS`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Status：`PUBLISHED_REMOTE_VERIFIED`

发布前本地构建 SHA `aa7909d64928dfe59ec0aee8383d3d1efd89ad67aa92ffaf847a2ce9e43b5d4e` 只保留为 pre-release local build identity；正式 Candidate Distribution 以远端回读验证通过的 `{sha}` 为 Authority。

历史 Candidate：

- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)
'''
          p.write_text(head+block,encoding='utf-8')
          PY
          changed="$(git diff --name-only | sort)"
          test "$changed" = "$(printf '%s\n%s\n%s\n%s' 'CURRENT.md' 'distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md' 'distribution/skills/candidates/skill-book/V4.6/README.md' 'distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md' | sort)"
          git config user.name 'VF Release Automation'
          git config user.email 'release@kewaro.com'
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.6/README.md distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md
          git commit -m 'skill-book: reconcile V4.6 published candidate authority'
          GOV_COMMIT="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/llhzx2018/gov-doc.git"
          git push origin HEAD:main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GOV_COMMIT"
          git show 'origin/main:CURRENT.md' | grep -Fq '`V4.6` 为最新 Candidate'
          git show 'origin/main:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md' | grep -Fq "$ASSET_SHA256"
          git show 'origin/main:distribution/skills/candidates/skill-book/V4.6/RUNTIME_ZIP_MIRROR_STATUS.md' | grep -Fq 'PUBLISHED_REMOTE_VERIFIED'
          echo "V46_GOV_DOC_RECONCILE_COMMIT=$GOV_COMMIT" >> "$GITHUB_ENV"
          echo 'V46_GOVERNANCE_REMOTE_READBACK=PASS'

      - name: Upload public-safe release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SKILL-BOOK-V4.6-CANDIDATE-RELEASE-EVIDENCE
          path: ${{ runner.temp }}/V46_RELEASE_EVIDENCE.txt
          if-no-files-found: error
          retention-days: 30
