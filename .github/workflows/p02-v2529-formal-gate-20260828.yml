name: P02 V2.5.29 Formal Gate
on:
  push:
    branches: [task/p02-v2529-common-baseline-release-20260828]
    paths:
      - '.github/workflows/p02-v2529-formal-gate-20260828.yml'
      - 'scripts/p02-v2529-formal-gate.sh'
      - 'scripts/p02-v2529-patch-repair-driver.py'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: 387655e222c1fed0b6e4559b66d254dba5d3c8e4
      BASE: a3e42bfecd1214f68e59eb20eba498f0e8ae0dca
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 387655e222c1fed0b6e4559b66d254dba5d3c8e4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Checkout exact V2.5.28 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.28
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old
      - name: Live main fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C old rev-parse HEAD)" = 7861999d99a8de385bdd73f7892477e197c4559c
          test "$(git -C product rev-parse origin/main)" = "$BASE"
          echo P02_LIVE_MAIN_FENCE=PASS
      - name: Install utility dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip jq sqlite3
      - name: Apply repair browser-driver harness compatibility
        shell: bash
        run: python3 scripts/p02-v2529-patch-repair-driver.py
      - name: Run exact formal gate
        shell: bash
        run: bash scripts/p02-v2529-formal-gate.sh
      - name: Upload verified release set
        uses: actions/upload-artifact@v4
        with:
          name: P02-V2.5.29-FORMAL-RELEASE-SET
          path: |
            product/build/v2529-a/*
            evidence/P02-V2.5.29-FORMAL-GATE.env
          if-no-files-found: error
          retention-days: 30
