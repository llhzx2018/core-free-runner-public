name: P04 Personal Infra V2 High-fi Evidence

on:
  push:
    branches:
      - p04-personal-infra-v2-flow-gate

permissions:
  contents: read

env:
  PRODUCT_REF: prototype/p04-personal-infra-v2

jobs:
  highfi-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private VF Infra prototype
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Start static prototype server
        run: |
          cd product
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/p04-highfi-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/prototype/p04-personal-infra-v2/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p04-highfi-http.log
          exit 1

      - name: Capture browser and responsive evidence
        env:
          P04_PROTO_URL: http://127.0.0.1:4173/prototype/p04-personal-infra-v2/index.html
          P04_SCREENSHOT_DIR: p04-highfi-evidence
        run: node product/tests/e2e/p04-personal-infra-v2-highfi-evidence.mjs

      - name: Print responsive summary
        if: always()
        run: |
          if [ -f p04-highfi-evidence/responsive-report.json ]; then
            cat p04-highfi-evidence/responsive-report.json
          fi

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-personal-infra-v2-highfi-evidence
          path: p04-highfi-evidence
          if-no-files-found: error
