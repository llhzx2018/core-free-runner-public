name: TEMP S01-C02 Ops 1.21.830 Builder Source Trace
on:
  push:
    branches:
      - temp/s01-c02-v121830-candidate-build-failure-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121830-builder-source-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 729eeb29a4b99a26c124c9f6969332fab75896f2
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace Candidate entry processing dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== DEFINITIONS ==='
          grep -RInE 'function (vf_toolsite_cf_release_repair_html_for_static_package|vf_toolsite_cf_release_repair_text_asset_for_static_package|vf_toolsite_cf_release_candidate_text_final_autoscrub|vf_toolsite_cf_release_candidate_analyze_text_change|vf_ops_content_residue_detect_text|vf_toolsite_cf_release_public_static_asset_entry|vf_toolsite_cf_release_should_skip_public_static_asset|vf_toolsite_cf_release_normalize_zip_entry|vf_toolsite_cf_release_candidate_actions_bump)' ops/includes ops/vf-ops.php || true
          echo '=== THROW/ERROR SURFACE IN BUILDERS + CF RELEASE ==='
          grep -RInE 'throw new |ValueError|Error\(|RuntimeException|Pipeline_Exception|json_last_error|preg_last_error|mb_|DOMDocument|libxml|htmlspecialchars|parse_url|random_bytes' ops/includes/release/builders ops/includes/cf-release | head -1200 || true
          echo '=== CALL SITES ==='
          grep -RInE 'repair_html_for_static_package|repair_text_asset_for_static_package|candidate_text_final_autoscrub|candidate_analyze_text_change|content_residue_detect_text|public_static_asset_entry|should_skip_public_static_asset|normalize_zip_entry|candidate_actions_bump' ops/includes | head -1200 || true
          echo 'PASS_V121830_BUILDER_SOURCE_TRACE'
