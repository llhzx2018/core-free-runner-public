name: P07 all five Toolbox slots final isolation candidate
on:
  push:
    branches:
      - task/p07-five-slot-proof-final-20261112
  pull_request:
    branches:
      - feat/p07-toolbox-m05-isolated-20261112
permissions:
  contents: read
jobs:
  exact-public-five-slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Run five-slot and M05 dispatch tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-toolbox.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_*_isolation.py' -v
          echo P07_FIVE_SLOT_NO_CROSS_INSTALL_DISPATCH=PASS
          echo P07_FIVE_PHYSICAL_INSTALLERS_UPGRADE=NOT_PROVEN
          echo P07_RELEASE=NO
