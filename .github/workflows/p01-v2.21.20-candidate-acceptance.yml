name: P01 V2.21.20 Candidate Acceptance
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-candidate-acceptance.yml']
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact candidate / syntax / fresh install
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/sidebar-density-2.21.20-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" c
          cd c;H=$(git rev-parse HEAD);echo "$H">/tmp/sha;test "$H" = 393ac2fafa56cbde66767b7e1afed78742c12c9d;git rev-parse HEAD^{tree}>/tmp/tree
          test "$(cat VERSION)" = 2.21.20;test "$(cat src/VERSION.txt)" = 2.21.20;grep -q "define('VF_VERSION', '2.21.20')" src/app/bootstrap.php
          find src -name '*.php' -print0|xargs -0 -n1 php -l >/dev/null;find src -name '*.js' -print0|xargs -0 -n1 node --check >/dev/null
          grep -q 'reference-ui.js?v=22120' src/index.php;grep -q 'sidebar-refinement.css?v=22120' src/assets/reference-ui.js
          sudo apt-get update -qq;sudo apt-get install -y -qq php-sqlite3 sqlite3 >/dev/null
          cp -a src /tmp/p;cd /tmp/p;php -S 127.0.0.1:18093 -t . >/tmp/server.log 2>&1 & echo $! >/tmp/pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/c http://127.0.0.1:18093/setup.php -o /tmp/s&&break||sleep 1;done
          CSRF=$(python3 - <<'PY'
          import re
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/s').read()).group(1))
          PY
          )
          curl -fsSL -c /tmp/c -b /tmp/c -X POST http://127.0.0.1:18093/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode site_title=VF --data-urlencode 'admin_password=Runner-P01-22120!Strong' --data-urlencode 'admin_password_confirm=Runner-P01-22120!Strong' >/dev/null
          php cli/verify.php|tee /tmp/v;grep -q VERIFY_PASS=YES /tmp/v;DB=$(php -r "require 'app/bootstrap.php';echo VF_DB_FILE;");test "$(sqlite3 "$DB" 'PRAGMA integrity_check;')" = ok;test -z "$(sqlite3 "$DB" 'PRAGMA foreign_key_check;')"
          mkdir -p "$RUNNER_TEMP/n";cd "$RUNNER_TEMP/n";npm init -y >/dev/null 2>&1;PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
      - name: Real Chrome product + sidebar acceptance
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/n/a.mjs" <<'JS'
          import{chromium}from'playwright-core';const br=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});try{const p=await br.newPage({viewport:{width:1440,height:900}}),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:18093/',{waitUntil:'networkidle'});await p.click('#loginButton');await p.fill('[name=password]','Runner-P01-22120!Strong');await p.click('#loginSubmit');await p.waitForFunction(()=>document.documentElement.dataset.vfNavigationStability==='3'&&document.documentElement.dataset.vfReferenceUi==='4'&&document.querySelector('link[data-vf-sidebar-refinement]'));
          const order=await p.evaluate(()=>{const keep={links:state.links,recent:state.recent};state.links=[{id:101,title:'A',url:'https://a.example',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:30,legacy_position:1,click_count:0,tags:[]},{id:102,title:'B',url:'https://b.example',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:20,legacy_position:2,click_count:999,tags:[]},{id:103,title:'C',url:'https://c.example',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:10,legacy_position:3,click_count:5000,tags:[]}];state.recent=[];const before=topLinks(3).map(x=>x.id),o=window.open;window.open=()=>({opener:null});openLink(state.links[1]);window.open=o;const after=topLinks(3).map(x=>x.id),recent=state.recent[0]?.id;state.links=keep.links;state.recent=keep.recent;return{before,after,recent}});if(JSON.stringify(order.before)!=='[101,102,103]'||JSON.stringify(order.after)!=='[101,102,103]'||order.recent!==102)throw Error('stable order '+JSON.stringify(order));
          await p.evaluate(()=>{state.categories=[{id:91001,parent_id:null,name:'Runner Category',description:'x',sort_order:1,legacy_position:1,effective_private:0,is_private:0}];state.links=[{id:92001,title:'Public',url:'https://p.example',category_id:91001,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:1,legacy_position:1,click_count:0,tags:[]}];state.mode='category';state.selected=91001;state.privacyScope='public';state.sidebarScope='public';render()});await p.click('[data-sidebar-scope="private"]');const scope=await p.evaluate(()=>({mode:state.mode,id:+state.selected,p:state.privacyScope,s:state.sidebarScope,h:location.hash,n:filteredAndSortedLinks().length,home:!!document.querySelector('.home-page')}));if(scope.mode!=='category'||scope.id!==91001||scope.p!=='private'||scope.s!=='private'||scope.h!=='#/private/category/91001'||scope.n!==0||scope.home)throw Error('scope '+JSON.stringify(scope));
          await p.evaluate(()=>{state.mode='home';state.selected=0;state.privacyScope='';render()});const home=await p.evaluate(()=>({n:document.querySelector('.home-quick-section .section-head p')?.textContent||'',i:document.querySelector('.home-intro .page-subtitle')?.textContent||'',pa:document.querySelector('.home-workspace')?.nextElementSibling?.id==='pluginHomeSummary'}));if(!home.n.includes('稳定手动顺序')||home.n.includes('自动推荐')||!home.i.includes('搜索与分类优先')||!home.pa)throw Error('home '+JSON.stringify(home));
          await p.evaluate(()=>{document.body.classList.add('is-admin');const h=document.createElement('div');h.id='candidateSidebarContract';h.className='sidebar-group';const row=(name,count,active)=>`<div class="category-node category-node--child"><span class="category-guide"></span><div class="category-row category-row--child category-nav-row child${active?' active':''}"><button class="category-nav-main"><span class="nav-label">${name}</span></button><span class="nav-count">${count}</span><span class="category-actions"><span class="nav-drag" draggable="true">⋮⋮</span><button class="nav-more">•••</button></span></div></div>`;h.innerHTML=row('浏览器、设备与环境',13,true)+row('账号、邮箱与身份管理',18,false);document.querySelector('#categoryNavSection').appendChild(h)});await p.waitForTimeout(180);const sg=await p.evaluate(()=>{const rs=[...document.querySelectorAll('#candidateSidebarContract .category-row--child')],r=rs[0],l=rs[1],a=r.querySelector('.nav-label'),b=l.querySelector('.nav-label'),ra=r.querySelector('.category-nav-main'),x=r.querySelector('.category-actions'),st=getComputedStyle(r),bf=getComputedStyle(r,'::before');return{sidebar:document.querySelector('.sidebar').getBoundingClientRect().width,button:ra.getBoundingClientRect().width,aO:a.scrollWidth-a.clientWidth,bO:b.scrollWidth-b.clientWidth,pos:getComputedStyle(x).position,bg:st.backgroundColor,rail:bf.width}});if(sg.sidebar<258||sg.sidebar>262||sg.button<145||sg.aO>1||sg.bO>1||sg.pos!=='absolute'||sg.bg!=='rgb(247, 247, 247)'||Math.abs(parseFloat(sg.rail)-2)>.2)throw Error('sidebar '+JSON.stringify(sg));
          for(const w of [390,480,640,768,1024,1280,1440,1920]){await p.setViewportSize({width:w,height:900});await p.waitForTimeout(150);const d=await p.evaluate(()=>Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth));if(d>1)throw Error(`overflow ${w}:${d}`)}if(errs.length)throw Error(errs.join('|'));console.log('P01_V22120_CANDIDATE_CHROME=PASS')}finally{await br.close()}
          JS
          cd "$RUNNER_TEMP/n";node a.mjs
      - name: Backup restore regression
        shell: bash
        run: |
          cd /tmp/p;php <<'PHP'
          <?php require 'app/bootstrap.php';$d=vf_db();$r=new VfRepository($d);$r->createCategory(['name'=>'Sentinel','description'=>'r','is_private'=>1]);$m=new VfBackupManager($d);$b=$m->create('r','regression',true);$k=$b['backup_key'];if(($m->verify($k)['validation_status']??'')!=='valid')throw new Exception('verify');$r->createCategory(['name'=>'Transient','description'=>'r','is_private'=>1]);VfBackupManager::performRestore($k);$d=vf_db();$q=$d->prepare('SELECT COUNT(*) FROM categories WHERE name=?');$q->execute(['Sentinel']);if((int)$q->fetchColumn()!==1)throw new Exception('sentinel');$q->execute(['Transient']);if((int)$q->fetchColumn()!==0)throw new Exception('transient');echo "BACKUP_RESTORE=PASS\n";
          PHP
      - name: Publish evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          def r(p):
            try:return open(p).read().strip()
            except:return''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','source_version':'2.21.19','gate':'CANDIDATE_ACCEPTANCE','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_sha':r('/tmp/sha'),'source_tree':r('/tmp/tree'),'workflow_run_id':os.environ['RID'],'schema_version':'2026080902','browser_helper':'1.6.4 / UNCHANGED','production_changed':False,'private_data_persisted_publicly':False};c=json.dumps(q,indent=2)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-CANDIDATE-ACCEPTANCE.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): publish V2.21.20 candidate acceptance','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
      - if: always()
        run: if [ -f /tmp/pid ];then kill $(cat /tmp/pid) 2>/dev/null||true;fi
