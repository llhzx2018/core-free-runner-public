name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-home174-20261023]
    paths: ['.github/workflows/s01-home174-20261023-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.174
  TARGET_SHA: 79de071c0afb48c60abad6b6c5ec71cdea7a4cc5
  TARGET_TREE: adc81f6254f2087a8a276d53461d65d16f541dab
  BASE_SHA: a04063727eacbd8c1c033c0a115f6a3b2cff4faf
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 79de071c0afb48c60abad6b6c5ec71cdea7a4cc5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39888066237 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39888066237 --jq .head_sha)" = 02e80da71fd8ae9d7f4b556d457f5027f38ae61d
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39888066237 --repo llhzx2018/core-free-runner-public --name s01-home-39888066237 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-home174-20261023/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='25c808d2b5d4dddddd276c1deac2a55a872dc3ab'
          phases={phase:json.loads((r/(phase+'-home.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['write_requests']==[]
              assert len(result['rows'])==8
              assert {x['language'] for x in result['rows']}=={'en','zh'}
              assert {x['width'] for x in result['rows']}=={1920,1440,1319,1024}
              for row in result['rows']:
                  assert row['result']=='PASS' and row['observed']['overflow'] is False
                  fixed=phase in ['upgrade','after']
                  assert row['marker_matches'] is fixed
                  assert all((v>=4.5) if fixed else (v<4.5) for v in row['contrast'])
          for before,after in zip(phases['before']['rows'],phases['after']['rows']):
              for key in ['hrefs','h1','canonical']:assert before['observed'][key]==after['observed'][key]
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='b5c3a1e3a72635c21aaa40ab88e67d9796e44063fc58b7fc40adc8d3d9a2d45a' and new['bytes']==1974083
          coverage=json.loads(pathlib.Path('control/lanes/s01-home174-20261023/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='25c808d2b5d4dddddd276c1deac2a55a872dc3ab' and coverage['tree']=='adc81f6254f2087a8a276d53461d65d16f541dab'
          assert coverage['owner_preview']=='N_A per unchanged Theme SSOT15'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='39888066237'
          coverage['merged_source']='79de071c0afb48c60abad6b6c5ec71cdea7a4cc5'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.174 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.174 provider/vf-tools-theme_V1.35.174.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.174' --notes '首页快捷入口改用现有语义文字色，修正现有绿色/白底下普通文字对比度不足；默认页尾标识复用已有共享标识样式，与页头保持一致。保留自定义品牌、图片、菜单、页面内容与全部工具功能。中英文×四档桌面宽度完成旧版复现、升级、回退复现与重复安装；链接/H1/Canonical、设置、菜单、语言关系、历史验收记录与Provider数据保护通过。干净ZIP首次运行、后台登录/初始化与安装重访锁定通过。476个运行文件；M3U8保持1.25.94，Ops未修改。Production由Owner手工升级，本轮未自动修改正式站；机器验证不等于Owner最终使用验收，手机测试按Owner要求暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.174 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.174 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.174 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.174.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.174.zip remote/vf-tools-theme_V1.35.174.zip
          echo 'b5c3a1e3a72635c21aaa40ab88e67d9796e44063fc58b7fc40adc8d3d9a2d45a  remote/vf-tools-theme_V1.35.174.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.174.zip)" = 1974083
          gh release view v1.35.174 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
