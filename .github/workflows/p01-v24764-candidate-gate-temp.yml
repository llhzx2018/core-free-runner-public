name: p01-v24764-candidate-gate-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24764-candidate-gate-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 9bc08fabac6d009d8c2faa303f4b12337128d1ad
      STABLE_SHA: 2777b269d4eba0409bda3082b6d71abdfa028f32
      PRODUCT_BASE_SHA: dada6d20ac0aa1d4c1e67f93f2ff7c2c1a8850c4
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact candidate and stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in candidate stable; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C candidate fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C stable fetch -q --depth 1 origin "${STABLE_SHA}"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.64"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.64"
          echo P01_V24764_CANDIDATE_EXACT_SOURCE=PASS

      - name: Candidate identity diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_BASE_SHA"
          git -C candidate diff --name-only "$PRODUCT_BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_V24764_CANDIDATE_IDENTITY_DIFF=PASS

      - name: Focused UI and identity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/admin_url_health_page5_polish_contract.php
            tests/unit/admin_duplicates_r21_contract.php
            tests/unit/health_desktop_action_hierarchy_contract.php
            tests/unit/health_row_action_hierarchy_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do php "candidate/${t}"; done
          echo P01_V24764_CANDIDATE_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V24764_CANDIDATE_CANONICAL=PASS
