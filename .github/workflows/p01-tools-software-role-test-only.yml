name: P01 Tools Software role parity test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-tools-software-role-test-only.yml']
permissions:
  contents: read
jobs:
  tools-software-role:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3b8835f91c8cae2f140587d5a5c06a7583970dc6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip,openssl
          coverage: none
      - name: Exact source Tools/Software privacy and interaction regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "3b8835f91c8cae2f140587d5a5c06a7583970dc6"
          for p in app/ToolWorkspaceHome.php app/ToolSceneDetail.php app/ToolProductPage.php app/SoftwareWorkspaceHome.php app/SoftwareWorkspaceDetail.php app/SoftwareProductPage.php; do php -l "product/src/$p"; done
          php -l product/tests/unit/tools_software_role_badges_v247390_contract.php
          node --check product/src/assets/software-workspace.js
          node --check product/tests/unit/software_owner_guest_install_profiles_native.js
          (cd product && node tests/unit/software_owner_guest_install_profiles_native.js)
          for t in \
            tools_software_role_badges_v247390_contract.php \
            frontend_shared_owner_guest_visibility_v247390_contract.php \
            tools_one_page_v247194_contract.php \
            tools_single_page_directory_v247189_contract.php \
            tools_true_one_page_v247190_contract.php \
            tools_page_context_closure_contract.php \
            tools_page_full_polish_contract.php \
            tool_scene_context_consistency_contract.php \
            tool_shared_search_context_contract.php \
            software_onepage_r2_contract.php \
            software_page_context_closure_contract.php \
            software_page_full_polish_contract.php \
            software_detail_context_contract.php \
            software_os_context_count_contract.php \
            tool_software_sort_context_contract.php; do
            php "product/tests/unit/$t"
          done
          python3 - <<'PY'
          from pathlib import Path
          x=Path('product/src/assets/frontend-mature.css').read_text()
          assert x.count('{')==x.count('}')
          assert '.vf-tool-product-identity .vf-visibility-badge' in x
          assert '.vf-software-app-copy .vf-visibility-badge' in x
          print('P01_TOOL_SOFTWARE_BADGE_CSS=PASS')
          PY
          echo P01_TOOLS_SOFTWARE_ROLE_EXACT_SOURCE=PASS
      - name: Clear temporary product checkout
        if: always()
        shell: bash
        run: rm -rf product
