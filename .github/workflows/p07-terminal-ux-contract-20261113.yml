name: P07 全五模块企业级 Terminal UX V3 精确源码检查
on:
  push:
    branches: [test/p07-terminal-ux-contract-20261113]
    paths:
      - .github/workflows/p07-terminal-ux-contract-20261113.yml
permissions:
  contents: read
jobs:
  p07-ux-standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public registered Runner without storing token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Temporary read-only checkout of exact P07 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: aa77e4ec381193d9559711c4d4a8cbda8e878033
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact source and mandatory nine-module UX V3 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = aa77e4ec381193d9559711c4d4a8cbda8e878033
          test "$(cat product/VERSION)" = 0.1.0
          export PYTHONDONTWRITEBYTECODE=1
          (
            cd product
            python3 -B -m py_compile scripts/check_p07_terminal_ux.py scripts/check_p07_modules.py
            python3 -B scripts/check_p07_terminal_ux.py
            python3 -B scripts/check_p07_modules.py
            python3 -B -m unittest discover -s tests -p 'test_p07_terminal_ux_contract.py' -q
            python3 -B -m unittest discover -s tests -p 'test_p07_module_contract.py' -q
            if python3 -B scripts/check_p07_terminal_ux.py --module P07-M05 --changed-file bin/vfops-init-ui >/dev/null 2>&1; then
              echo P07_UX_MISSING_REVIEW_NOT_BLOCKED
              exit 13
            fi
            if python3 -B scripts/check_p07_modules.py --module P07-M05 --changed-file bin/vfops-init-ui >/dev/null 2>&1; then
              echo P07_MODULE_UX_MISSING_REVIEW_NOT_BLOCKED
              exit 13
            fi
            echo P07_UX_V3_ALL_NINE_MODULES=PASS
            echo P07_UX_V3_PR_NEGATIVE_GATE=PASS
          )
      - name: Always remove private checkout and Python caches
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC=NO
