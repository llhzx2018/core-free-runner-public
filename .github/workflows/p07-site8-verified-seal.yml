name: P07 site8 verified backup seal exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-site8-verified-seal.yml'
      - 'experiments/p07-site8-verified-seal/**'
permissions:
  contents: read
jobs:
  verified-snapshot-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pin exact bytes and stage synthetic-only latest product modules
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-site8-verified-seal/lib/private_sql_literal_reconcile.py)" = 19ddfab465e27767c56e7abf6a853fddd4684cdd
          test "$(git hash-object experiments/p07-site8-verified-seal/lib/private_conflict_preservation.py)" = 8ab17d9d8bb1ca66f3574acc1f056c675c405a81
          test "$(git hash-object experiments/p07-site8-verified-seal/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          test "$(git hash-object experiments/p07-site8-verified-seal/tests/test_private_sql_literal_reconcile.py)" = 1fee1cc5522f75a884ba3a11a9cf5bc7bd773765
          test "$(git hash-object experiments/p07-site8-verified-seal/tests/test_private_verified_sql_snapshot.py)" = 36127efe6d47a23cbca418b3a0634d553dc2d1df
          test "$(git hash-object experiments/p07-site8-verified-seal/tests/test_private_conflict_preservation.py)" = cd7649d77254dbf3528246ac302d74ce42b99c30
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-sealed-proof"
          for p in lib/private_sql_literal_reconcile.py lib/private_conflict_preservation.py lib/migration_recovery_rehearsal.py tests/test_private_sql_literal_reconcile.py tests/test_private_verified_sql_snapshot.py tests/test_private_conflict_preservation.py; do
            cp "experiments/p07-site8-verified-seal/$p" "$RUNNER_TEMP/p07-sealed-proof/$p"
          done
          cd "$RUNNER_TEMP/p07-sealed-proof"
          python3 -m py_compile lib/private_sql_literal_reconcile.py lib/private_conflict_preservation.py tests/test_private_verified_sql_snapshot.py
          echo P07_SITE8_BACKUP_SEALED_EXACT_SOURCE_PASS
      - name: Verify dual-backup copy identity and mutation rejection
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-sealed-proof"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_private_verified_sql_snapshot \
            tests.test_private_sql_literal_reconcile \
            tests.test_private_conflict_preservation
          echo P07_SITE8_BACKUP_SEALED_SYNTHETIC_PASS
      - name: Preserve pre-existing integrity guards and unchanged DB writers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-sealed-proof"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_private_recovery_gate \
            tests.test_sql_pk_conflict_evidence \
            tests.test_sql_row_evidence \
            tests.test_migration_no_overwrite_resume
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/server_migration.py lib/server_migration_pull.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_SITE8_BACKUP_DB_WRITERS_UNCHANGED_PASS
