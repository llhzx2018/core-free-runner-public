name: P07 release86 MariaDB / Care rc55 Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc55/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-mariadb-release86-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact identity, server/MariaDB policy and legacy migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          d=dist/p07/0.1.0/overlay
          pkg=packages/p07-system-care/0.1.0-rc55
          test "$(cat "$d/BUILD_ID")" = "0.1.0-release86"
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' "$d/lib/server_migration.py"
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' "$d/lib/server_migration_pull.py"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release86'" "$pkg/vf-system-care.sh"
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release86"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc55"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc55'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='2b9ba0e4b98457a81bfd1b2dd70a94746307fb94'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = 3eb66ee76eb278ce478774199f99467f78c6d644
          test "$(git hash-object "$d/RUNTIME.gitblob")" = 'b6bef5d07e9dccfaa72aa599add9aceaef7ecb8d'
          test "$(git hash-object "$d/MANIFEST.gitblob")" = '20ca384068ed618f72cd4352a8faa195fdbd2938'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'ca90c397ed139d0d74e3f70f8653efd220082e93'
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          for script in installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh "$d/bin/vfops-init-ui" "$pkg/vf-system-care.sh"; do bash -n "$script"; done
          (cd "$d" && PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          echo P07_RELEASE86_MARIADB_AND_CARE54_MACHINE_GATE_PASS
