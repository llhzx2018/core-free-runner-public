name: P07 release87 MariaDB / Care rc56 Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc56/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-mariadb-release87-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact identity, server/MariaDB policy and legacy migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          d=dist/p07/0.1.0/overlay
          pkg=packages/p07-system-care/0.1.0-rc56
          test "$(cat "$d/BUILD_ID")" = "0.1.0-release87"
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' "$d/lib/server_migration.py"
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' "$d/lib/server_migration_pull.py"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release87'" "$pkg/vf-system-care.sh"
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release87"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc56"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc56'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='097a60416fc84856e5f0220441fa967e7c3a8688'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = 6cd0cdf36d8b2384b553793e0ef1006221c052d5
          test "$(git hash-object "$d/RUNTIME.gitblob")" = '5cbbd927920be86d4e42d39a15abcbb445531a4d'
          test "$(git hash-object "$d/MANIFEST.gitblob")" = 'aecbf8129dc432764fc914a4d1ba75b8e3627dd4'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '30c17c1cf7781fdfcc52dddf19720e0ae15bb542'
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          for script in installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh "$d/bin/vfops-init-ui" "$pkg/vf-system-care.sh"; do bash -n "$script"; done
          (cd "$d" && PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          echo P07_RELEASE87_MARIADB_AND_CARE56_MACHINE_GATE_PASS
