name: P07 release85 MariaDB / Care rc54 Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc54/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-mariadb-release85-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact identity, server/MariaDB policy and legacy migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          d=dist/p07/0.1.0/overlay
          pkg=packages/p07-system-care/0.1.0-rc54
          test "$(cat "$d/BUILD_ID")" = "0.1.0-release85"
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' "$d/lib/server_migration.py"
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' "$d/lib/server_migration_pull.py"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release85'" "$pkg/vf-system-care.sh"
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release85"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc54"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc54'" installers/p07-system-care.sh
          test "$(git hash-object "$d/RUNTIME.gitblob")" = '929db8209957c3ad8c742360ebf15fdb3605071f'
          test "$(git hash-object "$d/MANIFEST.gitblob")" = '492a8eccf87635953f418bfa6fc737c947ea9090'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'e9ccedae9232d345ebbe945ee37197f030ce2ea5'
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          for script in installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh "$d/bin/vfops-init-ui" "$pkg/vf-system-care.sh"; do bash -n "$script"; done
          (cd "$d" && PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          echo P07_RELEASE85_MARIADB_AND_CARE54_MACHINE_GATE_PASS
