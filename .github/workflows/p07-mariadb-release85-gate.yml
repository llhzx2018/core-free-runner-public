name: P07 release85 MariaDB / Care rc54 Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0/overlay/**'
      - 'packages/p07-system-care/0.1.0-rc54/**'
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-system-care.sh'
      - '.github/workflows/p07-mariadb-release85-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact identity, server/MariaDB policy and legacy migration regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          d=dist/p07/0.1.0/overlay
          pkg=packages/p07-system-care/0.1.0-rc54
          test "$(cat "$d/BUILD_ID")" = "0.1.0-release85"
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' "$d/lib/server_migration.py"
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' "$d/lib/server_migration_pull.py"
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release85'" "$pkg/vf-system-care.sh"
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release85"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc54"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc54'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='0b0b72f7ff6933dc7cb59881d1becadc40566ee7'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = e62f9def82703fb8019c73a8745f65157af2cfe2
          test "$(git hash-object "$d/RUNTIME.gitblob")" = '929db8209957c3ad8c742360ebf15fdb3605071f'
          test "$(git hash-object "$d/MANIFEST.gitblob")" = '492a8eccf87635953f418bfa6fc737c947ea9090'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'e9ccedae9232d345ebbe945ee37197f030ce2ea5'
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$d" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          for script in installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh "$d/bin/vfops-init-ui" "$pkg/vf-system-care.sh"; do bash -n "$script"; done
          (cd "$d" && PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          echo P07_RELEASE85_MARIADB_AND_CARE54_MACHINE_GATE_PASS

      - name: Exact source R1 guarded MariaDB and SQL structure test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate=candidates/p07-r1-mariadb-parity
          root="$RUNNER_TEMP/p07-r1-exact-source"
          cp -a dist/p07/0.1.0/overlay "$root"
          test "$(git hash-object "$candidate/bin/vfops-init-ui")" = 'a3f9390f233a8a9f8287f332b9a52dcc9c3f2d3b'
          cp "$candidate/bin/vfops-init-ui" "$root/bin/vfops-init-ui"
          test "$(git hash-object "$candidate/lib/server_migration_pull.py")" = '8623dedaad18f9ba807326cd2aeb070455e9b914'
          cp "$candidate/lib/server_migration_pull.py" "$root/lib/server_migration_pull.py"
          test "$(git hash-object "$candidate/lib/verify.py")" = '8bbe5f548ef9cec472307150e66988f2bbbcec76'
          cp "$candidate/lib/verify.py" "$root/lib/verify.py"
          test "$(git hash-object "$candidate/tests/test_mariadb_owner_policy.py")" = '263059773ad92b5ee3e4f6e1fc2fdd69ba9713e8'
          cp "$candidate/tests/test_mariadb_owner_policy.py" "$root/tests/test_mariadb_owner_policy.py"
          test "$(git hash-object "$candidate/tests/test_server_migration_pull.py")" = 'fe555ffe5a5a06276acc453cc17652c28c5088e8'
          cp "$candidate/tests/test_server_migration_pull.py" "$root/tests/test_server_migration_pull.py"
          test "$(git hash-object "$candidate/tests/test_verify.py")" = '6706552f10cd60b66221047dd2c52faeaf53069b'
          cp "$candidate/tests/test_verify.py" "$root/tests/test_verify.py"
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release85'
          bash -n "$root/bin/vfops-init-ui"
          (cd "$root" && python3 -m compileall -q lib tests && PYTHONPATH=lib python3 -m unittest -v tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull tests.test_verify)
          echo P07_R1_EXACT_SOURCE_MARIADB_PARITY_MACHINE_PASS

      - name: Exact-source R2 release85 authority and recorded Owner acceptance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate=candidates/p07-r2-authority
          root="$RUNNER_TEMP/p07-r1-exact-source"
          test "$(git hash-object "$candidate/README.md")" = 'bd79ef8b82dc5207ba49f075edf74a9e01f3b451'
          cp "$candidate/README.md" "$root/README.md"
          test "$(git hash-object "$candidate/docs/authority/P07_INTEGRATION_MANIFEST.json")" = '5cb3cc8c061f1f30c60109385180b0dd3c24993d'
          cp "$candidate/docs/authority/P07_INTEGRATION_MANIFEST.json" "$root/docs/authority/P07_INTEGRATION_MANIFEST.json"
          test "$(git hash-object "$candidate/tests/test_p07_integration_manifest.py")" = '3ae30f462e35c0b7fe8a08df673ddc88dba4eece'
          cp "$candidate/tests/test_p07_integration_manifest.py" "$root/tests/test_p07_integration_manifest.py"
          test "$(git hash-object "$candidate/docs/authority/USER_ACCEPTANCE.md")" = '15058c348d9d59e576c99fdd51959ef35f7c5866'
          cp "$candidate/docs/authority/USER_ACCEPTANCE.md" "$root/docs/authority/USER_ACCEPTANCE.md"
          test "$(git hash-object "$candidate/docs/authority/ACCEPTANCE_MATRIX.md")" = 'f6ffb52cbd743dc9d1cf10d0b1f7a8e0dd5d86ca'
          cp "$candidate/docs/authority/ACCEPTANCE_MATRIX.md" "$root/docs/authority/ACCEPTANCE_MATRIX.md"
          (cd "$root" && python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null && PYTHONPATH=lib python3 -m unittest -v tests.test_p07_integration_manifest)
          echo P07_R2_EXACT_SOURCE_RELEASE85_AUTHORITY_MACHINE_PASS

      - name: R3 exact source release86 candidate full product regression
        shell: bash
        timeout-minutes: 14
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-release86-candidate"
          cp -a dist/p07/0.1.0/overlay "$root"
          cp candidates/p07-r1-mariadb-parity/bin/vfops-init-ui "$root/bin/vfops-init-ui"
          cp candidates/p07-r1-mariadb-parity/lib/server_migration_pull.py "$root/lib/server_migration_pull.py"
          cp candidates/p07-r1-mariadb-parity/lib/verify.py "$root/lib/verify.py"
          cp candidates/p07-r1-mariadb-parity/tests/test_mariadb_owner_policy.py "$root/tests/test_mariadb_owner_policy.py"
          cp candidates/p07-r1-mariadb-parity/tests/test_server_migration_pull.py "$root/tests/test_server_migration_pull.py"
          cp candidates/p07-r1-mariadb-parity/tests/test_verify.py "$root/tests/test_verify.py"
          cp candidates/p07-r2-authority/README.md "$root/README.md"
          cp candidates/p07-r2-authority/docs/authority/USER_ACCEPTANCE.md "$root/docs/authority/USER_ACCEPTANCE.md"
          cp candidates/p07-r2-authority/docs/authority/ACCEPTANCE_MATRIX.md "$root/docs/authority/ACCEPTANCE_MATRIX.md"
          test "$(git hash-object "candidates/p07-r3-release86/BUILD_ID")" = 'cd1e38de6daf61ce0d2942c17666dc412f291159'
          cp "candidates/p07-r3-release86/BUILD_ID" "$root/BUILD_ID"
          test "$(git hash-object "candidates/p07-r3-release86/docs/authority/P07_INTEGRATION_MANIFEST.json")" = '8a9aecad039094e2743adc00b51a4720a91ec8ec'
          cp "candidates/p07-r3-release86/docs/authority/P07_INTEGRATION_MANIFEST.json" "$root/docs/authority/P07_INTEGRATION_MANIFEST.json"
          test "$(git hash-object "candidates/p07-r3-release86/tests/test_p07_integration_manifest.py")" = '36e65a9e1aa25d268bab5644277aa8ba0715df25'
          cp "candidates/p07-r3-release86/tests/test_p07_integration_manifest.py" "$root/tests/test_p07_integration_manifest.py"
          test "$(git hash-object "candidates/p07-r3-release86/tests/test_first_verify_before_scheduler.py")" = '8f5a1c0af49b619c06e1e3422db440078cd69d62'
          cp "candidates/p07-r3-release86/tests/test_first_verify_before_scheduler.py" "$root/tests/test_first_verify_before_scheduler.py"
          test "$(git hash-object "candidates/p07-r3-release86/tests/test_ops_console_r9.py")" = '61109298b0f14f529306101f783597a9c7857444'
          cp "candidates/p07-r3-release86/tests/test_ops_console_r9.py" "$root/tests/test_ops_console_r9.py"
          test "$(git hash-object "candidates/p07-r3-release86/tests/test_terminal_ui_color_contract.py")" = 'ab6f5874681135f5f529841715d15641cb5f372b'
          cp "candidates/p07-r3-release86/tests/test_terminal_ui_color_contract.py" "$root/tests/test_terminal_ui_color_contract.py"
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release86'
          bash -n "$root/bin/vfops-init-ui"
          python3 -m json.tool "$root/docs/authority/P07_INTEGRATION_MANIFEST.json" >/dev/null
          (cd "$root" && python3 -m compileall -q lib tests && PYTHONPATH=lib python3 -m unittest discover -s tests -v)
          echo P07_RELEASE86_EXACT_SOURCE_FULL_PRODUCT_MACHINE_PASS
