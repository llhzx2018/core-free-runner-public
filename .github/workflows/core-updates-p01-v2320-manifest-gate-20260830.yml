name: Core Updates P01 V2.32 Manifest Gate
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths: [.github/workflows/core-updates-p01-v2320-manifest-gate-20260830.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: e61b366d7d63faf19b895b8334c3b9900b83a7a8
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = e61b366d7d63faf19b895b8334c3b9900b83a7a8
          test "$(git -C updates merge-base 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5 HEAD)" = 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          test "$(git -C updates diff --name-only 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5...HEAD)" = projects/P01.json
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.31.0" and .target_version=="2.32.0" and
            .update_type=="ATOMIC" and .from_versions==["2.31.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.32.0" and
            .release_id==379046260 and
            .product_identity=="120a42667fce7357fdaef03b64cb7ea41392040d" and
            .asset_name=="VF_Start_V2.32.0_UPDATE.zip" and
            .asset_bytes==1351066 and
            .asset_sha256=="262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-29T17:01:36Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0)
          test "$(jq -r .object.sha <<<"$TAG")" = 120a42667fce7357fdaef03b64cb7ea41392040d
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0)
          test "$(jq -r .id <<<"$REL")" = 379046260
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.32.0_UPDATE.zip")|.size' <<<"$REL")" = 1351066
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.32.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          rm -rf /tmp/p01-v2320-manifest-asset && mkdir -p /tmp/p01-v2320-manifest-asset
          gh release download v2.32.0 --repo llhzx2018/vf-start --pattern VF_Start_V2.32.0_UPDATE.zip --dir /tmp/p01-v2320-manifest-asset
          A=/tmp/p01-v2320-manifest-asset/VF_Start_V2.32.0_UPDATE.zip
          test "$(stat -c%s "$A")" = 1351066
          echo "262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.32.0.php >/dev/null
          cp "$M" /tmp/P01-V2.32.0-manifest.json
          jq -n --arg candidate e61b366d7d63faf19b895b8334c3b9900b83a7a8 --arg base 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5 --arg asset_sha 262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a '{candidate:$candidate,base:$base,manifest_gate:"PASS",release_id:379046260,tag:"v2.32.0",asset_bytes:1351066,asset_sha256:$asset_sha,owner_production_write:false}' >/tmp/P01-V2.32.0-manifest-gate.json
          echo CORE_UPDATES_P01_V2320_MANIFEST_GATE=PASS
          echo READY_FOR_CORE_UPDATES_MAIN_PROMOTION=YES
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-core-updates-manifest-${{ github.run_id }}
          path: |
            /tmp/P01-V2.32.0-manifest.json
            /tmp/P01-V2.32.0-manifest-gate.json
          if-no-files-found: error
          retention-days: 90
