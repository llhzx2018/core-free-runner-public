name: P07 merged diagnostic-only main exact-source contract proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-diagnostic-only-unit-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-diagnostic-only-proof-20261030' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_SHA: 27758b4d257f27f0d6046126489a71440c2d786f
    steps:
      - name: Require private read token
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact P07 draft
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 27758b4d257f27f0d6046126489a71440c2d786f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Check affected source helper and cross-engine gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          bash -n bin/vfops-init-ui
          python3 -B -m py_compile lib/server_migration_pull.py lib/verify.py lib/sql_diff_evidence.py lib/cloudpanel.py
          # This is the merged diagnostic-only main, NOT the draft bidirectional
          # target-engine installation or resume/cutover helper-refresh path.
          python3 -B - <<'PY'
          from pathlib import Path
          text = Path("lib/server_migration_pull.py").read_text()
          assert "def diagnose_sql_difference(" in text
          assert "expected_source_tables" in text
          assert "def source_export_helper_matches_current(" in text
          assert "def require_pinned_migration_engine_pair(" not in text
          assert "def ensure_current_source_export_helper(" not in text
          assert "SOURCE_SQL_STAGING_SYMLINK_BLOCKED" not in text
          print("P07_DIAGNOSTIC_ONLY_SCOPE_PASS")
          PY
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_sql_diff_command.py test_sql_diff_evidence.py test_server_migration_pull.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_SOURCE_EXPORT_HELPER_EXACT_SOURCE_PASS
      - name: Cleanup confidential checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
