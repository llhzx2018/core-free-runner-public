name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  pull_request:
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi
      - name: Checkout current core-agent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: main
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Read back exact core-agent source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "CORE_AGENT_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py
      - name: Build public-safe evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source=Path('.evidence/verification.json'); out=Path('.evidence/current-public-evidence.json')
          payload={'schema':'core-agent-public-evidence/current-v2','source_sha':os.environ.get('VF_SOURCE_SHA',''),'private_source_persisted':False}
          if source.exists():
              raw=source.read_bytes(); detail=json.loads(raw.decode('utf-8'))
              payload.update({'status':detail.get('status'),'private_evidence_sha256':hashlib.sha256(raw).hexdigest(),'check_exit_codes':[item.get('exit_code') for item in detail.get('checks',[])],'runner':detail.get('runner')})
          else: payload['status']='BLOCKED_BEFORE_VERIFICATION'
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode('utf-8'); payload['sha256']=hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          PY
      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-agent-current-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: source/.evidence/current-public-evidence.json
          if-no-files-found: error
          retention-days: 14

  p01_project_context_heading_exact:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P01_SHA: 0aa1e8de839af1c114b6a3e9b4a6b25a4f499be7
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p01
      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$P01_SHA"
          test "$(tr -d '\r\n' < p01/VERSION)" = "2.47.1"
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - name: Run focused project heading contract
        shell: bash
        working-directory: p01
        run: |
          set -Eeuo pipefail
          php -l src/app/ProjectActionCenterPage.php
          php -l tests/unit/subject_list_heading_context_contract.php
          php tests/unit/subject_list_heading_context_contract.php
      - name: Run current project and subject regressions
        shell: bash
        working-directory: p01
        run: |
          set -Eeuo pipefail
          php tests/unit/project_state_facet_context_contract.php
          php tests/unit/subject_kind_count_search_context_contract.php
          php tests/unit/summary_semantics_consistency_contract.php
          php tests/unit/subject_request_context_sanitization_contract.php
          php tests/unit/channel_kind_facet_context_contract.php
          php tests/unit/watch_facet_context_contract.php
          php tests/unit/watch_kind_facet_context_contract.php
          php tests/unit/software_detail_context_contract.php
          php tests/unit/tool_shared_search_context_contract.php
          php tests/unit/navigation_search_context_contract.php
      - name: Final exact candidate gate
        shell: bash
        working-directory: p01
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SHA"
          git diff --exit-code
