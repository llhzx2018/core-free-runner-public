name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  pull_request:
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"; exit 78; fi
      - name: Checkout current core-agent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: main
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Read back exact core-agent source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"; test -n "$SOURCE_SHA"
          echo "CORE_AGENT_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"; echo "CORE_AGENT_CURRENT_SOURCE_SHA=$SOURCE_SHA"
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Run machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py
      - name: Build public-safe evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source=Path('.evidence/verification.json'); out=Path('.evidence/current-public-evidence.json')
          payload={'schema':'core-agent-public-evidence/current-v2','source_sha':os.environ.get('VF_SOURCE_SHA',''),'private_source_persisted':False}
          if source.exists():
              raw=source.read_bytes(); detail=json.loads(raw.decode('utf-8'))
              payload.update({'status':detail.get('status'),'private_evidence_sha256':hashlib.sha256(raw).hexdigest(),'check_exit_codes':[i.get('exit_code') for i in detail.get('checks',[])],'runner':detail.get('runner')})
          else: payload['status']='BLOCKED_BEFORE_VERIFICATION'
          canonical=json.dumps(payload,ensure_ascii=False,sort_keys=True).encode('utf-8'); payload['sha256']=hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True),encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}"); print(f"PUBLIC_EVIDENCE_SOURCE_SHA={payload['source_sha']}"); print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          PY
      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-agent-current-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: source/.evidence/current-public-evidence.json
          if-no-files-found: error
          retention-days: 14

  p01_subject_mobile_filter_reset_exact:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P01_SHA: 89c32182ca2f519c15aeb8a1b78f0f60ad07a680
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SHA"; test "$(cat VERSION)" = "2.47.1"
          echo P01_SUBJECT_MOBILE_FILTER_RESET_EXACT_SOURCE=PASS
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none
      - name: Run focused Subject mobile-reset contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/subject_kind_count_search_context_contract.php
          php tests/unit/subject_kind_count_search_context_contract.php
      - name: Run current product context regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for t in \
            tests/unit/tool_shared_search_context_contract.php \
            tests/unit/tool_scene_context_consistency_contract.php \
            tests/unit/software_detail_context_contract.php \
            tests/unit/project_state_facet_context_contract.php \
            tests/unit/project_normal_state_search_context_contract.php \
            tests/unit/home_project_signal_authority_contract.php \
            tests/unit/channel_kind_facet_context_contract.php \
            tests/unit/watch_kind_facet_context_contract.php \
            tests/unit/watch_facet_context_contract.php \
            tests/unit/navigation_category_facet_recovery_contract.php \
            tests/unit/navigation_search_context_contract.php \
            tests/unit/navigation_favorite_count_context_contract.php \
            tests/unit/summary_semantics_consistency_contract.php; do test -f "$t"; php -l "$t"; php "$t"; done
      - name: Final exact candidate gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P01_SHA"; test "$(cat VERSION)" = "2.47.1"
          echo P01_SUBJECT_MOBILE_FILTER_RESET_EXACT_PASS
