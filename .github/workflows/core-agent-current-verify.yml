name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout current core-agent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-agent
          ref: main
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Read back exact core-agent source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "CORE_AGENT_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CORE_AGENT_CURRENT_SOURCE_SHA=$SOURCE_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py

      - name: Build public-safe evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('.evidence/verification.json')
          out = Path('.evidence/current-public-evidence.json')
          payload = {
              'schema': 'core-agent-public-evidence/current-v2',
              'source_sha': os.environ.get('VF_SOURCE_SHA', ''),
              'private_source_persisted': False,
          }
          if source.exists():
              raw = source.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              payload.update({
                  'status': detail.get('status'),
                  'private_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'check_exit_codes': [item.get('exit_code') for item in detail.get('checks', [])],
                  'runner': detail.get('runner'),
              })
          else:
              payload['status'] = 'BLOCKED_BEFORE_VERIFICATION'
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode('utf-8')
          payload['sha256'] = hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}")
          print(f"PUBLIC_EVIDENCE_SOURCE_SHA={payload['source_sha']}")
          print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: core-agent-current-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: source/.evidence/current-public-evidence.json
          if-no-files-found: error
          retention-days: 14
