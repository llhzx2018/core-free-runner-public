name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'requests/p04-v279-production-readback-*.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
      PROD_URL: https://infra.kewaro.com/
      TARGET_VERSION: '2.7.9'
      TARGET_SCHEMA: '14'
      ASSET_ID: '520238891'
      ASSET_BYTES: '53649'
      ASSET_SHA256: '4f904395176b232b6e4d367db965a730da2f1bf4362f98b8bbe884a25bd04baf'
    steps:
      - name: Ensure Python HTTP client and registered read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          python3 - <<'PY' || python3 -m pip install --quiet requests
          import requests
          print('REQUESTS_READY')
          PY
          echo 'PRIVATE_READ_CAPABILITY=PASS'

      - name: Authenticated P04 V2.7.9 Production closure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import io,json,os,re,zipfile
          from urllib.parse import urljoin
          import requests

          base=os.environ['PROD_URL']
          target=os.environ['TARGET_VERSION']
          schema=int(os.environ['TARGET_SCHEMA'])
          read_token=os.environ['PRIVATE_READ_TOKEN']
          password=''
          for name in ['VF_INFRA_ADMIN_PASSWORD','P04_ADMIN_PASSWORD','P04_PRODUCTION_ADMIN_PASSWORD','VF_PRODUCTION_ADMIN_PASSWORD','VF_INFRA_PRODUCTION_PASSWORD']:
              if os.environ.get(name):
                  password=os.environ[name]
                  break
          if not password:
              print('P04_PRODUCTION_ADMIN_CREDENTIAL=UNAVAILABLE')
              raise SystemExit(78)
          print('P04_PRODUCTION_ADMIN_CREDENTIAL=AVAILABLE')

          def csrf(text):
              m=re.search(r'name=["\']csrf["\'][^>]*value=["\']([^"\']+)',text,re.I)
              if not m:
                  m=re.search(r'value=["\']([^"\']+)["\'][^>]*name=["\']csrf["\']',text,re.I)
              if not m: raise RuntimeError('CSRF_NOT_FOUND')
              return m.group(1)

          def jget(s,action,**params):
              r=s.get(urljoin(base,'api.php'),params={'action':action,**params},timeout=30); r.raise_for_status(); d=r.json()
              if not d.get('ok'): raise RuntimeError('API_'+action+'_NOT_OK')
              return d

          def jpost(s,action,token,data=None):
              r=s.post(urljoin(base,'api.php'),params={'action':action},data=data or {},headers={'Origin':base.rstrip('/'),'Referer':base,'X-CSRF-Token':token},timeout=60); r.raise_for_status(); d=r.json()
              if not d.get('ok'): raise RuntimeError('API_'+action+'_NOT_OK')
              return d

          # Exact formal UPDATE and source-manifest contract.
          a=requests.get(f"https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/{os.environ['ASSET_ID']}",headers={'Authorization':f'Bearer {read_token}','Accept':'application/octet-stream','X-GitHub-Api-Version':'2022-11-28'},timeout=90,allow_redirects=True)
          a.raise_for_status(); pkg=a.content
          import hashlib
          if len(pkg)!=int(os.environ['ASSET_BYTES']) or hashlib.sha256(pkg).hexdigest()!=os.environ['ASSET_SHA256']:
              raise RuntimeError('FORMAL_ASSET_IDENTITY_MISMATCH')
          with zipfile.ZipFile(io.BytesIO(pkg),'r') as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              if names!=['repair-v2.7.9.php']: raise RuntimeError('REPAIR_MEMBER_MISMATCH')
              repair=z.read(names[0]).decode('utf-8')
          m=re.search(r"const\s+VF_INFRA_ATOMIC_SOURCE_MANIFEST_SHA256\s*=\s*'([a-f0-9]{64})'\s*;",repair)
          if not m: raise RuntimeError('SOURCE_MANIFEST_CONTRACT_MISSING')
          expected_manifest=m.group(1)
          print('P04_FORMAL_UPDATE_IDENTITY=PASS')

          s=requests.Session(); s.headers.update({'User-Agent':'P04-V279-PublicSafe-Closure/1.0'})
          login=s.get(urljoin(base,'login.php'),timeout=30); login.raise_for_status()
          versions=re.findall(r'·\s*V([0-9]+(?:\.[0-9]+){2})',login.text)
          current=versions[-1] if versions else ''
          if current!=target: raise RuntimeError('PRODUCTION_VERSION_DRIFT_'+current)
          c=csrf(login.text)
          lr=s.post(urljoin(base,'login.php'),data={'return':'maintenance.php','csrf':c,'password':password},headers={'Origin':base.rstrip('/'),'Referer':urljoin(base,'login.php')},timeout=30,allow_redirects=False)
          if lr.status_code not in (302,303): raise RuntimeError('AUTH_FAILED')
          print('P04_AUTHENTICATED_SESSION=PASS')

          maint=s.get(urljoin(base,'maintenance.php'),timeout=30); maint.raise_for_status()
          if f'V{target}' not in maint.text or f'Schema {schema}' not in maint.text: raise RuntimeError('MAINTENANCE_IDENTITY_MISMATCH')
          print('P04_PRODUCTION_VERSION=2.7.9')
          print('P04_PRODUCTION_SCHEMA=14')
          print('P04_MAINTENANCE_IDENTITY=PASS')

          boot=jget(s,'bootstrap')
          if str(boot.get('version',''))!=target: raise RuntimeError('BOOTSTRAP_VERSION_MISMATCH')
          token=str(boot.get('csrf',''))
          if not token: raise RuntimeError('API_CSRF_MISSING')
          for action,params in [
              ('domains',{'page':1,'per_page':1}),
              ('compute_instances',{'page':1,'per_page':1}),
              ('provider_workspace',{}),
              ('diagnostics',{}),
          ]:
              jget(s,action,**params)
          print('P04_CORE_API_SMOKE=PASS')

          sm=s.get(urljoin(base,'maintenance.php'),params={'action':'source-manifest'},timeout=60); sm.raise_for_status()
          live=(sm.headers.get('X-VF-Source-Manifest-SHA256') or '').lower()
          if live!=expected_manifest: raise RuntimeError('SOURCE_EXACT_MISMATCH')
          print('P04_SOURCE_EXACT=PASS')
          print('P04_SOURCE_MANIFEST_SHA256='+live)

          # OWNER-authorized closure write: refresh update cache only; no Atomic, data mutation, main, release, secret, or destructive write.
          chk=jpost(s,'update_check',token,{})
          upd=chk.get('update') or chk.get('state') or chk
          status=str(upd.get('status','')); latest=str(upd.get('latest_version','')); can=bool(upd.get('can_update',False))
          if status!='up_to_date' or latest!=target or can:
              raise RuntimeError(f'ONLINE_STATE_BAD_{status}_{latest}_{can}')
          print('P04_ONLINE_STATUS=up_to_date')
          print('P04_LATEST_VERSION=2.7.9')
          print('P04_CAN_UPDATE=false')
          print('P04_ONLINE_UPDATE_STATE=PASS')
          print('P04_ATOMIC_EXECUTED=NO_ALREADY_CURRENT')
          print('P04_PRODUCTION_WRITE=UPDATE_CACHE_REFRESH_ONLY')
          print('P04_FINAL_ONLINE_PASS=PASS')
          PY

      - name: Closure verdict
        shell: bash
        run: |
          echo 'P04_V279_PRODUCTION_CLOSURE=PASS'
          echo 'P04_RUNTIME_MUTATION=NO'
          echo 'P04_ATOMIC_EXECUTED=NO_ALREADY_CURRENT'
