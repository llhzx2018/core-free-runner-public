name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  pull_request:
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi

      - name: Checkout current core-agent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-agent
          ref: main
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Read back exact core-agent source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test -n "$SOURCE_SHA"
          echo "CORE_AGENT_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CORE_AGENT_CURRENT_SOURCE_SHA=$SOURCE_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 Node24
        with:
          python-version: '3.11'

      - name: Run machine verification
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        run: python scripts/verify.py

      - name: Build public-safe evidence
        if: always()
        working-directory: source
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SOURCE_SHA }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('.evidence/verification.json')
          out = Path('.evidence/current-public-evidence.json')
          payload = {
              'schema': 'core-agent-public-evidence/current-v2',
              'source_sha': os.environ.get('VF_SOURCE_SHA', ''),
              'private_source_persisted': False,
          }
          if source.exists():
              raw = source.read_bytes()
              detail = json.loads(raw.decode('utf-8'))
              payload.update({
                  'status': detail.get('status'),
                  'private_evidence_sha256': hashlib.sha256(raw).hexdigest(),
                  'check_exit_codes': [item.get('exit_code') for item in detail.get('checks', [])],
                  'runner': detail.get('runner'),
              })
          else:
              payload['status'] = 'BLOCKED_BEFORE_VERIFICATION'
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode('utf-8')
          payload['sha256'] = hashlib.sha256(canonical).hexdigest()
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True), encoding='utf-8')
          print(f"PUBLIC_EVIDENCE_STATUS={payload['status']}")
          print(f"PUBLIC_EVIDENCE_SOURCE_SHA={payload['source_sha']}")
          print(f"PUBLIC_EVIDENCE_SHA256={payload['sha256']}")
          PY

      - name: Upload public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: core-agent-current-public-evidence-${{ env.CORE_AGENT_SOURCE_SHA }}
          path: source/.evidence/current-public-evidence.json
          if-no-files-found: error
          retention-days: 14

  p01_v2471_encrypted_formal_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      FORMAL_SHA: 656b48a6481ac620efbae5a6e143ae67c1c43e42
      BIND_CANDIDATE_SHA: 8e12d8cd02f68b6bd19522becb6fe32b173404d5
      BASELINE_SHA: 7f3492f70276d83efed371296d69709c1e991350
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact V2.47.1 Formal Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-start
          ref: 656b48a6481ac620efbae5a6e143ae67c1c43e42
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: formal

      - name: Checkout exact passed V2.47.1 Bind Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-start
          ref: 8e12d8cd02f68b6bd19522becb6fe32b173404d5
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Checkout exact V2.47.0 Formal baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-start
          ref: 7f3492f70276d83efed371296d69709c1e991350
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven V2.47.0 artifact helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Adapt proven V2.47.0 Formal Artifact Gate to exact V2.47.1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2471-formal-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/p01-v2471-formal-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('7f3492f70276d83efed371296d69709c1e991350','656b48a6481ac620efbae5a6e143ae67c1c43e42'),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9','8e12d8cd02f68b6bd19522becb6fe32b173404d5'),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e','7f3492f70276d83efed371296d69709c1e991350'),
            ('33993725218','34053714092'),
            ('BIND_PR=416','BIND_PR=511'),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2471_UI_REFINEMENT_RELEASE_20260907'),
            ('V2470','V2471'),
            ('v2470','v2471'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing V2.47.0 gate anchor: '+old)
              s=s.replace(old,new)
          s=s.replace('2.47.0','__P01_TARGET__').replace('2.46.4','2.47.0').replace('__P01_TARGET__','2.47.1')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s:
              raise SystemExit('release type anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.0 之后 L2 Product / UX / UI 精修的维护发布。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2471-formal-artifact-gate.sh
          grep -Fq 'FORMAL_SHA=656b48a6481ac620efbae5a6e143ae67c1c43e42' /tmp/p01-v2471-formal-artifact-gate.sh
          grep -Fq 'CANDIDATE_SHA=8e12d8cd02f68b6bd19522becb6fe32b173404d5' /tmp/p01-v2471-formal-artifact-gate.sh
          grep -Fq 'SOURCE_SHA=7f3492f70276d83efed371296d69709c1e991350' /tmp/p01-v2471-formal-artifact-gate.sh
          grep -Fq "test \"\$(cat formal/VERSION)\" = '2.47.1'" /tmp/p01-v2471-formal-artifact-gate.sh
          grep -Fq "test \"\$(cat baseline/VERSION)\" = '2.47.0'" /tmp/p01-v2471-formal-artifact-gate.sh
          ! grep -Fq "'release_type':'minor'" /tmp/p01-v2471-formal-artifact-gate.sh
          echo P01_V2471_GATE_ADAPTATION=PASS

      - name: Run exact V2.47.1 Formal Artifact Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash /tmp/p01-v2471-formal-artifact-gate.sh
          test "$(find /tmp/p01-v2471-formal-artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          jq -e '.version=="2.47.1" and .source_version=="2.47.0" and .schema=="2026090401" and .source_schema=="2026090401" and .formal_source=="656b48a6481ac620efbae5a6e143ae67c1c43e42"' /tmp/p01-v2471-formal-artifacts/P01-V2.47.1-FORMAL.json >/dev/null
          sha256sum -c /tmp/p01-v2471-formal-artifacts/VF-Start-V2.47.1-FULL.zip.sha256 --ignore-missing
          sha256sum -c /tmp/p01-v2471-formal-artifacts/VF_Start_V2.47.1_UPDATE.zip.sha256 --ignore-missing
          sha256sum -c /tmp/p01-v2471-formal-artifacts/repair-v2.47.1.php.sha256 --ignore-missing
          echo P01_V2471_FORMAL_ARTIFACT_EXACT=PASS

      - name: Encrypt verified formal assets for private handback
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-v2471-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEApUQSpU1bRGvOMhfbdIYJ
          mvfkMN/zNOD8OEQiGGy7XG02wL3aBW8mSgs686QK3cLgZLmOyHsGMvslPApSfsZK
          pb6AKWDS3SE3GeTbdqPrLOTV+q26FlP+6+YFBKUJ72kFinFSGRhJKf++4VFHHYX7
          iC55SK9Qyuzjz3dGbyjrW5QM1dv2Z8PCixdYH58p0IaxLQVAHLoQsfVqiBsLQ5YH
          rXB50MOTWAyYKnf9lTcKD507i2F4cAaSH6zcnXrXC9S9fTF+ef/BpjQMzhH88LAt
          agKBiB+DaIpBNIDIYjNtU8pMEYRsIzI2l0KdN8xm9+C+ssmdrG3oWTFY+lJ3sTjm
          OQpxl0Vl883Una9kljH9J0u1fQjNpDbYO+bfz1E7FjfYv+LoB/e7ooDCC6j1FD/O
          q+prKupGyBzwcSkI+ZQYWTQRTkSWA/SD2oNxrXh8WVZEaX05Yqm7eqrM4gsdo9tH
          gZ39wZYnfyUU8sW2ohXPqJqFMAF5t+9lzPtbXfdlK+ozAgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          tar -C /tmp -czf /tmp/p01-v2471-formal-assets.tar.gz p01-v2471-formal-artifacts
          openssl rand 32 > /tmp/p01-v2471-key.bin
          openssl rand 16 > /tmp/p01-v2471-iv.bin
          KEY_HEX="$(xxd -p -c 256 /tmp/p01-v2471-key.bin)"
          IV_HEX="$(xxd -p -c 256 /tmp/p01-v2471-iv.bin)"
          openssl enc -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in /tmp/p01-v2471-formal-assets.tar.gz -out /tmp/p01-v2471-payload.bin
          openssl pkeyutl -encrypt -pubin -inkey /tmp/p01-v2471-public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/p01-v2471-key.bin -out /tmp/p01-v2471-key.enc
          rm -rf /tmp/p01-v2471-encrypted-handback
          mkdir -p /tmp/p01-v2471-encrypted-handback
          mv /tmp/p01-v2471-payload.bin /tmp/p01-v2471-key.enc /tmp/p01-v2471-iv.bin /tmp/p01-v2471-encrypted-handback/
          {
            echo 'schema=p01-encrypted-formal-handback-v1'
            echo 'version=2.47.1'
            echo 'formal_source=656b48a6481ac620efbae5a6e143ae67c1c43e42'
            echo 'public_key_sha256=ec0fe5a328d6e7fabfe9e5843835ebbb7045438c3996b6da80eb2f777022ef54'
            echo "plaintext_tar_sha256=$(sha256sum /tmp/p01-v2471-formal-assets.tar.gz | awk '{print $1}')"
            echo "payload_sha256=$(sha256sum /tmp/p01-v2471-encrypted-handback/p01-v2471-payload.bin | awk '{print $1}')"
          } > /tmp/p01-v2471-encrypted-handback/MANIFEST.txt
          rm -f /tmp/p01-v2471-key.bin /tmp/p01-v2471-formal-assets.tar.gz
          rm -rf formal candidate baseline helper template
          echo P01_V2471_ENCRYPTED_HANDBACK=PASS

      - name: Upload encrypted formal handback only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: P01-V2.47.1-ENCRYPTED-FORMAL-HANDBACK
          path: /tmp/p01-v2471-encrypted-handback/*
          if-no-files-found: error
          retention-days: 1
