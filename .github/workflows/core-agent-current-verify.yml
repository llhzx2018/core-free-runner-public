name: core-agent Current Independent Machine Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/core-agent-current-verify.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'requests/p04-v279-production-readback-*.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      PROD_URL: https://infra.kewaro.com
      SOURCE_VERSION: '2.7.8'
      TARGET_VERSION: '2.7.9'
      ASSET_ID: '520238891'
      ASSET_BYTES: '53649'
      ASSET_SHA256: '4f904395176b232b6e4d367db965a730da2f1bf4362f98b8bbe884a25bd04baf'
    steps:
      - name: Verify registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'RUNNER_INFRASTRUCTURE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          echo 'PRIVATE_READ_CAPABILITY=PASS'

      - name: Live P04 Production version readback
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$PROD_URL/login.php" -o "$RUNNER_TEMP/p04-login.html"
          python3 - <<'PY'
          import os,re,pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP']+'/p04-login.html').read_text(encoding='utf-8',errors='replace')
          versions=re.findall(r'·\s*V([0-9]+(?:\.[0-9]+){2})', text)
          current=versions[-1] if versions else ''
          print('P04_PRODUCTION_VERSION='+current)
          if current not in {os.environ['SOURCE_VERSION'], os.environ['TARGET_VERSION']}:
              raise SystemExit('P04_PRODUCTION_VERSION_ELIGIBILITY=FAIL_CLOSED')
          print('P04_PRODUCTION_VERSION_ELIGIBILITY=PASS')
          print('P04_ATOMIC_ELIGIBLE=' + ('YES' if current==os.environ['SOURCE_VERSION'] else 'NO_ALREADY_CURRENT'))
          if 'name="csrf"' not in text or 'name="password"' not in text:
              raise SystemExit('P04_LOGIN_CONTRACT=FAIL')
          print('P04_LOGIN_CONTRACT=PASS')
          PY

      - name: Verify maintenance authentication boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          headers="$RUNNER_TEMP/p04-maintenance.headers"
          code=$(curl --silent --show-error --max-time 20 --output /dev/null --dump-header "$headers" --write-out '%{http_code}' "$PROD_URL/maintenance.php")
          location=$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/\r$/,"",$0); print substr($0,index($0,":")+2); exit}' "$headers")
          echo "P04_MAINTENANCE_UNAUTH_HTTP=$code"
          case "$code" in 301|302|303|307|308) ;; *) echo 'P04_MAINTENANCE_AUTH_BOUNDARY=FAIL'; exit 1;; esac
          printf '%s' "$location" | grep -Fq 'login.php?return=maintenance.php'
          echo 'P04_MAINTENANCE_AUTH_BOUNDARY=PASS'

      - name: Re-download exact formal V2.7.9 UPDATE asset
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/VF_Infra_V2.7.9_UPDATE.zip"
          curl --fail --silent --show-error --location --max-time 90 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $PRIVATE_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/$ASSET_ID" -o "$out"
          bytes=$(stat -c '%s' "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          test "$bytes" = "$ASSET_BYTES"
          test "$sha" = "$ASSET_SHA256"
          test "$(unzip -Z1 "$out" | wc -l | tr -d ' ')" = '1'
          test "$(unzip -Z1 "$out")" = 'repair-v2.7.9.php'
          echo "P04_FORMAL_UPDATE_BYTES=$bytes"
          echo "P04_FORMAL_UPDATE_SHA256=$sha"
          echo 'P04_FORMAL_UPDATE_IDENTITY=PASS'

      - name: Public-safe readback verdict
        shell: bash
        run: |
          echo 'P04_V279_PUBLIC_SAFE_READBACK=PASS'
          echo 'P04_PRODUCTION_WRITE_EXECUTED=0'
