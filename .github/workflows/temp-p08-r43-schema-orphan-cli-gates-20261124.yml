name: TEMP P08 R43 orphan schema journal blocks real Owner HTTP and CLI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-schema-orphan-cli-gates-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 0b50cc7f2d21311b53055634aa197558ef38ff38
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-orphan-cli-gates-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-schema-orphan-cli-gates-20261124.json --input .github/workflows/temp-p08-r43-schema-orphan-cli-gates-20261124.yml
  sqlite-independent-guardian:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-orphan-cli-gates-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Install genuine v017 SQLite Owner from verified FULL and verify dev-only PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for f in src/Upgrade/R43SqliteIndependentGuardianDrill.php tests/compatibility/r43_sqlite_independent_guardian_drill.php tests/compatibility/r43_isolated_installed_transaction.php; do
            php -l "private-p08-bridge/$f" >> "$RUNNER_TEMP/p08-r43-guardian-lint.log" 2>&1 || { echo P08_R43_GUARDIAN_PHP_SYNTAX=FAIL; exit 1; }
          done
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          test ! -e "$site"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/p08-r43-guardian-owner.log" 2>&1 || { echo P08_R43_GUARDIAN_OLD_OWNER_INSTALL=FAIL; exit 1; }
          grep -qx 'P08_R43_REAL_EXTRACTED_FULL_017_OWNER_INSTALL_AND_PRIVATE_FIXTURE=PASS' "$RUNNER_TEMP/p08-r43-guardian-owner.log"
          test "$(readlink "$site/current")" = "releases/$BRIDGE_SHA"
          test "$(find "$site/database" -maxdepth 1 -type f -name '*.sqlite' | wc -l)" -eq 1
          echo P08_R43_SQLITE_GUARDIAN_REAL_V017_FULL_OWNER=PASS
      - name: Real installed Owner orphan schema journal forces HTTP and all CLI entrypoints closed
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          target="$RUNNER_TEMP/p08-r43-target-extract"
          t="private-p08-bridge/tests/compatibility/r43_orphan_schema_journal_entrypoints.php"
          for f in artisan src/Upgrade/R43UnmanagedWriterAdmission.php src/Upgrade/R43OwnerSchemaPreparation.php src/Upgrade/R43OwnerSchemaPrepareDispatcher.php src/Upgrade/r43-owner-schema-prepare-worker.php tests/compatibility/r43_orphan_schema_journal_entrypoints.php; do
            php -l "private-p08-bridge/$f" >> "$RUNNER_TEMP/r43-orphan-lint.log" 2>&1 || { echo P08_R43_ORPHAN_SYNTAX=FAIL; exit 1; }
          done
          run_phase() {
            phase="$1"
            if ! php -d disable_functions=proc_open "$t" "$phase" "$site" "$target" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-orphan-$phase.log" 2>&1; then
              echo "P08_R43_ORPHAN_PHASE_$phase=FAIL"
              grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/r43-orphan-$phase.log" | tail -1 || true
              exit 1
            fi
          }
          run_phase seed
          grep -qx 'P08_R43_ORPHAN_SCHEMA_JOURNAL_VALID_INTENT_REACHES_DISABLED_LAUNCH_BEFORE_JOURNAL=PASS' "$RUNNER_TEMP/r43-orphan-seed.log"
          grep -qx 'P08_R43_ORPHAN_SCHEMA_JOURNAL_MAINTENANCE_MARKER_ABSENT_WHILE_SCHEMA_JOURNAL_ACTIVE=PASS' "$RUNNER_TEMP/r43-orphan-seed.log"
          php -S 127.0.0.1:41734 -t "$site/public" > "$RUNNER_TEMP/r43-orphan-web.log" 2>&1 &
          server=$!
          trap 'kill "$server" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do curl -s -o /dev/null --max-time 2 http://127.0.0.1:41734/up && break; sleep .2; done
          get="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:41734/up)"
          post="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 -X POST -d phase=recover http://127.0.0.1:41734/app/system/update/next/wake)"
          test "$get" = 503 && test "$post" = 503 || { echo "P08_R43_ORPHAN_HTTP_NOT_CLOSED=$get/$post"; exit 1; }
          echo P08_R43_ORPHAN_REAL_HTTP_AND_LEGACY_WAKE_POST_503_NO_MARKER=PASS
          set +e
          php "$site/artisan" about > "$RUNNER_TEMP/r43-orphan-artisan.log" 2>&1
          a=$?
          php "$site/releases/$BRIDGE_SHA/src/Upgrade/r43-owner-schema-prepare-worker.php" "$site" > "$RUNNER_TEMP/r43-orphan-worker.log" 2>&1
          b=$?
          set -e
          test "$a" = 2 && test "$b" = 2 || { echo "P08_R43_ORPHAN_CLI_UNSAFE=$a/$b"; exit 1; }
          grep -qx R27_STABLE_CLI_MAINTENANCE_OR_LAYOUT_INVALID "$RUNNER_TEMP/r43-orphan-artisan.log"
          test ! -s "$RUNNER_TEMP/r43-orphan-worker.log"
          echo P08_R43_ORPHAN_STABLE_ARTISAN_AND_DIRECT_OWNER_CLI_EXIT2_BEFORE_BOOT=PASS
          run_phase audit
          grep -qx 'P08_R43_ORPHAN_SCHEMA_JOURNAL_OWNER_PREPARE_DISPATCH_REFUSES_ORPHAN_JOURNAL=PASS' "$RUNNER_TEMP/r43-orphan-audit.log"
          grep -qx 'P08_R43_ORPHAN_SCHEMA_JOURNAL_OWNER_PREPARE_SERVICE_REFUSES_BEFORE_NETWORK_OR_DATA_WRITE=PASS' "$RUNNER_TEMP/r43-orphan-audit.log"
          echo P08_R43_ORPHAN_DISPATCH_PREPARE_NO_NETWORK_OR_DB_WRITE=PASS
          run_phase cleanup
          grep -qx 'P08_R43_ORPHAN_SCHEMA_JOURNAL_ALL_EIGHT_PINNED_LOCAL_ENTRYPOINTS_VERIFIED_EXTERNAL_WRITERS_STILL_BLOCKED=PASS' "$RUNNER_TEMP/r43-orphan-cleanup.log"
          health="$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 http://127.0.0.1:41734/up)"
          test "$health" = 200 || { echo "P08_R43_ORPHAN_RECOVERED_OWNER_NOT_200=$health"; exit 1; }
          echo P08_R43_ORPHAN_REAL_OWNER_RESUMED_ONLY_AFTER_SAFE_TEST_CLEANUP=PASS
          echo P08_R43_SHIPPING_ALL_UNMANAGED_WRITERS_STOP=BLOCKED
      - name: Cleanup transient private source and disposable SQLite Owner
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- private-p08-bridge private-p08-target gov-proof "$RUNNER_TEMP/p08-r43-site-app-gate" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP"/r43-orphan-*.log
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e "$RUNNER_TEMP/p08-r43-site-app-gate"; then
            echo P08_R43_ORPHAN_PRIVATE_SOURCE_DISPOSABLE_CLEANUP=PASS
          else
            echo P08_R43_ORPHAN_PRIVATE_SOURCE_DISPOSABLE_CLEANUP=FAIL
            exit 1
          fi
