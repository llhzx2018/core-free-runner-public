name: TEMP P08 S3 real OpenSSH and Nginx strict TLS sandbox

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s3-real-ssh-nginx-tls-20261123.yml'
      - 'scripts/temp_p08_s3_real_ssh_nginx.sh'
      - 'scripts/temp_p08_s3_real_ssh_nginx.php'

permissions:
  contents: read

jobs:
  isolated-real-openssh-nginx-tls:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s3-real-ssh-nginx-tls-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      P08_SOURCE_SHA: 00a62c8c8e991c10344255511efc6d45174c1e1c
      P08_ISOLATED_SSH_TEST: 'YES'
    steps:
      - name: Transient public-safe synthetic test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: public-harness
      - name: Transient exact private P08 source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 00a62c8c8e991c10344255511efc6d45174c1e1c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Source identity and synthetic harness static syntax gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = "$P08_SOURCE_SHA"
          bash -n public-harness/scripts/temp_p08_s3_real_ssh_nginx.sh
          test -f private-p08/app/Modules/StaticDeployment/Actions/OpenSshRemoteExecutor.php
          test -s private-p08/composer.lock
          echo "P08_S3_TRANSPORT_EXACT_SOURCE_AND_BASH=PASS"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, zip, mbstring, dom, fileinfo
      - name: Real private PHP syntax and locked Composer dependencies
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          php -l "$GITHUB_WORKSPACE/public-harness/scripts/temp_p08_s3_real_ssh_nginx.php" >/dev/null
          php -l app/Modules/StaticDeployment/Actions/OpenSshRemoteExecutor.php >/dev/null
          php -l app/Modules/StaticDeployment/Actions/VpsAtomicGateway.php >/dev/null
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if ! composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-s3-composer.log" 2>&1; then echo "P08_S3_NATIVE_SSH_COMPOSER=FAIL"; exit 1; fi
          test -s vendor/autoload.php
          echo "P08_S3_NATIVE_SSH_PHP_COMPOSER=PASS"
      - name: Native OpenSSH key auth, tar and Nginx trusted TLS atomic deployment + rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash public-harness/scripts/temp_p08_s3_real_ssh_nginx.sh
      - name: Purge private checkout, public harness, and any temporary logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08 public-harness
          rm -f -- "$RUNNER_TEMP/p08-s3-composer.log"
          test ! -e private-p08
          echo "P08_S3_PRIVATE_CHECKOUT_PURGED=PASS"
