name: P01 V2.21.25 Publication

on:
  push:
    branches:
      - task/p01-v22125-release-candidate-prep-20260828
    paths:
      - '.github/workflows/p01-v22125-publication-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  UPDATES_REPO: llhzx2018/core-updates
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: task/p01-v22125-release-candidate-prep-20260828
  MAIN_COMMIT: 9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed
  CANDIDATE: 6bc09cd152210183972dcb3f2c361eb65a4cadab
  CANDIDATE_TREE: 56ab66918e394477faad175e5ce9656eb0bc7b3f
  SOURCE_COMMIT: 7363949d18f44652458ec7ef0f7c67c9cae1bbb4
  VERSION: 2.21.25
  SOURCE_VERSION: 2.21.24
  SCHEMA: '2026080902'
  TAG: v2.21.25
  ARTIFACT_GATE_RUN_ID: '33119946804'
  ARTIFACT_ID: '9666046878'
  FULL_SHA: 4aba35b11e7522d3218bd232ee47eeb518d1c700b82ea140031a6a68f78838df
  UPDATE_SHA: 9845ce644463de5fb151c2aeb024378ec405b9a845d735b92ae7430650ba2dce
  REPAIR_SHA: e35212329c9754c3dcec50d9772613c3db318f8c07227deb9a2f3ae7479af382

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Exact release source and main-tree readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product checkout -q "$MAIN_COMMIT"
          test "$(git -C product rev-parse HEAD)" = "$MAIN_COMMIT"
          test "$(git -C product rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git -C product cat-file -e "$CANDIDATE^{commit}"
          test "$(git -C product rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          test "$(git -C product rev-parse origin/main)" = "$MAIN_COMMIT"
          test "$(tr -d '\r\n' < product/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < product/src/VERSION.txt)" = "$VERSION"
          python3 - <<'PY'
          import json
          x=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          assert x['working_version']=='2.21.25',x
          assert x['candidate_version']=='2.21.25',x
          assert str(x['schema_version'])=='2026080902',x
          assert x['component_versions']['browser_helper']=='1.6.4',x
          PY
          echo P01_PUBLICATION_SOURCE_FENCE=PASS

      - name: Fetch exact PASS artifact and verify bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${RUNNER_REPO}/actions/runs/${ARTIFACT_GATE_RUN_ID}" > /tmp/p01-v22125-gate-run.json
          test "$(jq -r '.status' /tmp/p01-v22125-gate-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v22125-gate-run.json)" = success
          test "$(jq -r '.head_sha' /tmp/p01-v22125-gate-run.json)" = bd65d72007fe3255ab82657e1cdf5005316d0ee8
          rm -rf /tmp/p01-v22125-release /tmp/p01-v22125-artifact.zip
          mkdir -p /tmp/p01-v22125-release
          gh api --method GET "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/p01-v22125-artifact.zip
          unzip -q /tmp/p01-v22125-artifact.zip -d /tmp/p01-v22125-release
          FULL="$(find /tmp/p01-v22125-release -type f -name 'VF-Start-V2.21.25-FULL.zip' -print -quit)"
          UPDATE="$(find /tmp/p01-v22125-release -type f -name 'VF-Start-V2.21.25-UPDATE.zip' -print -quit)"
          REPAIR="$(find /tmp/p01-v22125-release -type f -name 'server-update-v2.21.25-repair.php' -print -quit)"
          RESULT="$(find /tmp/p01-v22125-release -type f -name 'P01-V2.21.25-ARTIFACT-GATE.json' -print -quit)"
          test -f "$FULL" && test -f "$UPDATE" && test -f "$REPAIR" && test -f "$RESULT"
          test "$(sha256sum "$FULL" | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$UPDATE" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$REPAIR" | awk '{print $1}')" = "$REPAIR_SHA"
          jq -e --arg c "$CANDIDATE" --arg t "$CANDIDATE_TREE" --arg s "$SOURCE_COMMIT" '.status=="BUILD_PASS" and .version=="2.21.25" and .source_version=="2.21.24" and .candidate==$c and .candidate_tree==$t and .source_commit==$s and .schema=="2026080902"' "$RESULT" >/dev/null
          FULL_BYTES="$(stat -c %s "$FULL")"
          UPDATE_BYTES="$(stat -c %s "$UPDATE")"
          REPAIR_BYTES="$(stat -c %s "$REPAIR")"
          printf 'FULL_PATH=%s\nUPDATE_PATH=%s\nREPAIR_PATH=%s\nFULL_BYTES=%s\nUPDATE_BYTES=%s\nREPAIR_BYTES=%s\n' "$FULL" "$UPDATE" "$REPAIR" "$FULL_BYTES" "$UPDATE_BYTES" "$REPAIR_BYTES" >> "$GITHUB_ENV"
          echo P01_EXACT_PASS_ARTIFACTS=PASS

      - name: Create exact tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" > /tmp/p01-v22125-tag.json 2>/tmp/p01-v22125-tag.err
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            test "$(jq -r '.object.sha' /tmp/p01-v22125-tag.json)" = "$CANDIDATE"
          else
            gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$CANDIDATE" > /tmp/p01-v22125-tag.json
            test "$(jq -r '.object.sha' /tmp/p01-v22125-tag.json)" = "$CANDIDATE"
          fi
          cat > /tmp/p01-v22125-notes.md <<'EOF'
          VF Start V2.21.25 将已完成治理闭环的 Common Product Baseline V2 正式交付到生产升级通道。

          - 统一 System Info / System Baseline / Runtime Health / Online Update / Backup-Restore 运维语义。
          - PERSONAL_SINGLE_ADMIN：Idle 7 天；Absolute / Cookie / Server Session Floor 30 天；高风险 Step-up Recent Auth 900 秒。
          - 保留 P01 已验证的恢复工件 FILE_UPLOAD 显式例外；No Shadow Truth；Required DRIFT=0、UNKNOWN=0。
          - Schema 2026080902 不变；Browser Helper 1.6.4 不变。
          - 支持从 V2.21.24 原子升级；已验证全新安装、升级、幂等与故障回滚。
          - Exact Source Machine Gate：33119783158 PASS。
          - Formal Artifact Gate：33119946804 PASS。
          - 本 Release 仅完成发布；实际 Production 升级需在 VF Start 后台执行后再确认。
          EOF
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL_PATH" "$UPDATE_PATH" "$REPAIR_PATH" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL_PATH" "$UPDATE_PATH" "$REPAIR_PATH" --repo "$PRODUCT_REPO" --title 'VF Start V2.21.25' --notes-file /tmp/p01-v22125-notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v22125-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v22125-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v22125-release.json)"
          test "$(jq -r '.draft' /tmp/p01-v22125-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v22125-release.json)" = false
          test "$(jq -r '.target_commitish' /tmp/p01-v22125-release.json)" = "$TAG" -o "$(jq -r '.tag_name' /tmp/p01-v22125-release.json)" = "$TAG"
          test "$(jq -r --arg n 'VF-Start-V2.21.25-FULL.zip' '.assets[]|select(.name==$n)|.size' /tmp/p01-v22125-release.json)" = "$FULL_BYTES"
          test "$(jq -r --arg n 'VF-Start-V2.21.25-UPDATE.zip' '.assets[]|select(.name==$n)|.size' /tmp/p01-v22125-release.json)" = "$UPDATE_BYTES"
          test "$(jq -r --arg n 'server-update-v2.21.25-repair.php' '.assets[]|select(.name==$n)|.size' /tmp/p01-v22125-release.json)" = "$REPAIR_BYTES"
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\n' "$RELEASE_ID" "$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_GITHUB_RELEASE=PASS

      - name: Remote release asset byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v22125-remote && mkdir -p /tmp/p01-v22125-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v22125-remote \
            --pattern 'VF-Start-V2.21.25-FULL.zip' \
            --pattern 'VF-Start-V2.21.25-UPDATE.zip' \
            --pattern 'server-update-v2.21.25-repair.php'
          test "$(sha256sum /tmp/p01-v22125-remote/VF-Start-V2.21.25-FULL.zip | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v22125-remote/VF-Start-V2.21.25-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v22125-remote/server-update-v2.21.25-repair.php | awk '{print $1}')" = "$REPAIR_SHA"
          echo P01_REMOTE_RELEASE_ASSETS=PASS

      - name: Publish core-updates P01 channel
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('updates/projects/P01.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          current=str(d.get('target_version',''))
          if current not in {'2.21.24','2.21.25'}:
              raise SystemExit('unexpected P01 update channel target: '+current)
          d.update({
            'target_version':'2.21.25',
            'update_type':'ATOMIC',
            'from_versions':['2.21.24'],
            'schema_from':'2026080902',
            'schema_to':'2026080902',
            'repository':'llhzx2018/vf-start',
            'release_tag':'v2.21.25',
            'asset_name':'VF-Start-V2.21.25-UPDATE.zip',
            'asset_bytes':int(os.environ['UPDATE_BYTES']),
            'asset_sha256':os.environ['UPDATE_SHA'],
            'release_id':int(os.environ['RELEASE_ID']),
            'release_identity':'v2.21.25@6bc09cd152210183972dcb3f2c361eb65a4cadab',
            'backup_required':True,
            'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],
            'minimum_php':'8.0.0'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then git -C updates commit -m 'release(P01): publish VF Start V2.21.25 update channel'; fi
          for i in 1 2 3; do
            if git -C updates push origin main; then break; fi
            git -C updates pull --rebase origin main
            test "$i" -lt 3
          done
          git -C updates pull --ff-only origin main
          jq -e --arg sha "$UPDATE_SHA" --argjson bytes "$UPDATE_BYTES" --argjson rid "$RELEASE_ID" '.target_version=="2.21.25" and .from_versions==["2.21.24"] and .schema_from=="2026080902" and .schema_to=="2026080902" and .release_tag=="v2.21.25" and .asset_name=="VF-Start-V2.21.25-UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .release_id==$rid and .release_identity=="v2.21.25@6bc09cd152210183972dcb3f2c361eb65a4cadab"' updates/projects/P01.json >/dev/null
          CORE_UPDATES_COMMIT="$(git -C updates rev-parse HEAD)"
          echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT" >> "$GITHUB_ENV"
          echo P01_CORE_UPDATES=PASS

      - name: Persist publication evidence
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf evidence
          git clone -q --depth 1 --branch "$RUNNER_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${RUNNER_REPO}.git" evidence
          mkdir -p evidence/vf-agent/results
          jq -n \
            --argjson release_id "$RELEASE_ID" \
            --arg released_at "$RELEASED_AT" \
            --arg core_updates_commit "$CORE_UPDATES_COMMIT" \
            --argjson full_bytes "$FULL_BYTES" \
            --argjson update_bytes "$UPDATE_BYTES" \
            --argjson repair_bytes "$REPAIR_BYTES" \
            '{schema:"vf-public-runner-result/v1",project_id:"P01",gate:"V2.21.25_FORMAL_RELEASE",status:"SUCCESS",pass:true,version:"2.21.25",source_version:"2.21.24",candidate_source_sha:"6bc09cd152210183972dcb3f2c361eb65a4cadab",candidate_source_tree:"56ab66918e394477faad175e5ce9656eb0bc7b3f",product_main_merge_sha:"9fa7e86307f79d9535a9d522c7a6bff7a11fd4ed",prior_formal_source_sha:"7363949d18f44652458ec7ef0f7c67c9cae1bbb4",schema_version:"2026080902",schema_changed:false,browser_helper:"1.6.4",exact_source_machine_gate:{run_id:33119783158,status:"PASS"},formal_artifact_gate:{run_id:33119946804,artifact_id:9666046878,status:"PASS"},tag:"v2.21.25",release_id:$release_id,released_at:$released_at,assets:{full:{name:"VF-Start-V2.21.25-FULL.zip",bytes:$full_bytes,sha256:"4aba35b11e7522d3218bd232ee47eeb518d1c700b82ea140031a6a68f78838df"},update:{name:"VF-Start-V2.21.25-UPDATE.zip",bytes:$update_bytes,sha256:"9845ce644463de5fb151c2aeb024378ec405b9a845d735b92ae7430650ba2dce"},repair:{name:"server-update-v2.21.25-repair.php",bytes:$repair_bytes,sha256:"e35212329c9754c3dcec50d9772613c3db318f8c07227deb9a2f3ae7479af382"}},core_updates:{commit:$core_updates_commit,target_version:"2.21.25",from_versions:["2.21.24"]},production:{changed_by_publication:false,status:"UPGRADE_REQUIRED"}}' > evidence/vf-agent/results/P01-V2.21.25-FORMAL-RELEASE.json
          git -C evidence config user.name VictorForge
          git -C evidence config user.email llhzx2018@gmail.com
          git -C evidence add vf-agent/results/P01-V2.21.25-FORMAL-RELEASE.json
          if ! git -C evidence diff --cached --quiet; then
            git -C evidence commit -m 'evidence(P01): record V2.21.25 formal release'
            for i in 1 2 3; do
              if git -C evidence push origin "$RUNNER_BRANCH"; then break; fi
              git -C evidence pull --rebase origin "$RUNNER_BRANCH"
              test "$i" -lt 3
            done
          fi
          echo P01_PUBLICATION_EVIDENCE=PASS

      - name: Final remote publication truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_REMOTE="$(gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')"
          TAG_REMOTE="$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$MAIN_REMOTE" = "$MAIN_COMMIT"
          test "$TAG_REMOTE" = "$CANDIDATE"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v22125-final-release.json
          test "$(jq -r '.draft' /tmp/p01-v22125-final-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v22125-final-release.json)" = false
          test "$(jq -r '.assets|length' /tmp/p01-v22125-final-release.json)" -eq 3
          rm -rf final-updates
          git clone -q --depth 1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${UPDATES_REPO}.git" final-updates
          jq -e --arg sha "$UPDATE_SHA" '.target_version=="2.21.25" and .from_versions==["2.21.24"] and .release_tag=="v2.21.25" and .asset_name=="VF-Start-V2.21.25-UPDATE.zip" and .asset_sha256==$sha and .release_identity=="v2.21.25@6bc09cd152210183972dcb3f2c361eb65a4cadab"' final-updates/projects/P01.json >/dev/null
          echo P01_V2_21_25_PUBLICATION=PASS
          echo RELEASE=YES
          echo TAG=YES
          echo UPDATE_CHANNEL=2.21.25
          echo PRODUCTION=UPGRADE_REQUIRED
