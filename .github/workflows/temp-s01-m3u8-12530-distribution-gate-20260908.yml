name: temp-s01-m3u8-12530-distribution-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12530-distribution-gate-20260908.yml
permissions:
  contents: read
jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      UPDATES_REPO: llhzx2018/core-updates
      CANDIDATE_BRANCH: work/s01-c03-m3u8-12530-distribution-20260908
      EXPECTED_CANDIDATE: c8eb6318c20d3221bf8cbb7c79965e2e27c7cc67
      EXPECTED_BASE: f1d2b8cac02b85bd1f8a335310aea70da6af7036
      C01_BLOB: fac7996168ae4b5e2d34bcc619a20981b9610271
      C02_BLOB: ad257e7d30c50f7ab84d15118dbb56bd15bc741d
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      RELEASE_TAG: v1.25.30
      ASSET: vf-tools-m3u8_V1.25.30.zip
      ASSET_BYTES: '3583558'
      ASSET_SHA: 8426926e2781603ff0be1d5cd6b5352606be507150d808f2dc156834c5ec1711
      SOURCE_SHA: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
      RUNTIME_FILES: '559'
      RUNTIME_FP: 041b21c5f40bf62ac524f0847f43cdfd077e57cf23c5f14fa5bbff1e0ae29ddd
    steps:
      - name: Gate exact C03 distribution and delivered asset authority
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo 'DISTRIBUTION_GATE_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          rm -rf /tmp/core-updates-c03 "$RUNNER_TEMP/c03-release"; mkdir -p "$RUNNER_TEMP/c03-release"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${UPDATES_REPO}.git" /tmp/core-updates-c03
          git -C /tmp/core-updates-c03 checkout -q "$CANDIDATE_BRANCH"
          test "$(git -C /tmp/core-updates-c03 rev-parse HEAD)" = "$EXPECTED_CANDIDATE"
          test "$(git -C /tmp/core-updates-c03 rev-parse origin/main)" = "$EXPECTED_BASE"
          cd /tmp/core-updates-c03
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"..HEAD | tr '\n' ' ')" = 'projects/S01-C03.json '
          test "$(git rev-parse HEAD:projects/S01-C01.json)" = "$C01_BLOB"
          test "$(git rev-parse HEAD:projects/S01-C02.json)" = "$C02_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE":projects/S01-C01.json)" = "$C01_BLOB"
          test "$(git rev-parse "$EXPECTED_BASE":projects/S01-C02.json)" = "$C02_BLOB"
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C03" and .component_type=="PLUGIN"' projects/S01-C03.json >/dev/null
          jq -e '.target_version=="1.25.30" and .release_tag=="v1.25.30" and .asset_name=="vf-tools-m3u8_V1.25.30.zip"' projects/S01-C03.json >/dev/null
          jq -e '.asset_bytes==3583558 and .asset_sha256=="8426926e2781603ff0be1d5cd6b5352606be507150d808f2dc156834c5ec1711"' projects/S01-C03.json >/dev/null
          jq -e '.schema_from=="1.3.0" and .schema_to=="1.3.0" and .physical_locator=="vf-tool-m3u8/vf-tool-m3u8.php" and .plugin_file=="vf-tool-m3u8/vf-tool-m3u8.php" and .canonical_locator=="vf-tools-m3u8/vf-tools-m3u8.php" and .locator_cutover==false' projects/S01-C03.json >/dev/null
          jq -e '.runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and .runtime_files==559 and .runtime_file_count==559 and .runtime_fingerprint=="041b21c5f40bf62ac524f0847f43cdfd077e57cf23c5f14fa5bbff1e0ae29ddd" and .runtime_fingerprint_sha256=="041b21c5f40bf62ac524f0847f43cdfd077e57cf23c5f14fa5bbff1e0ae29ddd"' projects/S01-C03.json >/dev/null
          jq -e '.released_at=="2026-09-08T10:28:42Z"' projects/S01-C03.json >/dev/null
          jq -e '.from_versions == ["1.25.20","1.25.21","1.25.22","1.25.23","1.25.24","1.25.25","1.25.26","1.25.27","1.25.28","1.25.29"]' projects/S01-C03.json >/dev/null
          jq -e '.notes|contains("34213950152 PASS") and contains("34214808700 PASS") and contains("34214890836 PASS") and contains("34215445943 PASS") and contains("34215065916 PASS") and contains("34215628208 PASS") and contains("34215774368 PASS") and contains("Production, Static, Online")' projects/S01-C03.json >/dev/null
          test "$(gh api repos/$M3U8_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$SOURCE_SHA"
          release_json="$(gh api repos/$M3U8_REPO/releases/tags/$RELEASE_TAG)"
          test "$(printf '%s' "$release_json"|jq -r '.id')" = '384636069'
          test "$(printf '%s' "$release_json"|jq -r '.draft')" = false
          test "$(printf '%s' "$release_json"|jq -r '.prerelease')" = false
          test "$(printf '%s' "$release_json"|jq -r '.published_at')" = '2026-09-08T10:28:42Z'
          test "$(printf '%s' "$release_json"|jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id')" = '550298780'
          test "$(printf '%s' "$release_json"|jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.size')" = "$ASSET_BYTES"
          test "$(printf '%s' "$release_json"|jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest')" = "sha256:$ASSET_SHA"
          gh release download "$RELEASE_TAG" --repo "$M3U8_REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/c03-release"
          asset="$RUNNER_TEMP/c03-release/$ASSET"
          test "$(stat -c %s "$asset")" = "$ASSET_BYTES"
          test "$(sha256sum "$asset"|awk '{print $1}')" = "$ASSET_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile,os
          p=Path(os.environ['RUNNER_TEMP'])/'c03-release'/os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert len(names)==561, len(names)
              assert 'vf-tool-m3u8/vf-tool-m3u8.php' in names
              assert 'vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css' in names
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php')
              assert b'Version: 1.25.30' in main and b'R254_S01_PROVIDER_DASHBOARD_VISIBLE_UI_CLOSURE' in main
              css=z.read('vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css')
              for token in [b'.vf-m3u8-v6-dashboard__hero',b'.vf-m3u8-v6-next-step',b'.vf-m3u8-v6-summary-grid',b'@media (max-width:782px)']:
                  assert token in css, token
              controller=z.read('vf-tool-m3u8/admin/Controller/class-v6-provider-operations-controller.php')
              assert 'Provider 工作台'.encode() in controller and '当前下一步'.encode() in controller
              rows=[]
              for n in sorted(names):
                  if not n.startswith('vf-tool-m3u8/'): continue
                  rel=n[len('vf-tool-m3u8/'):]; parts=rel.split('/'); low=[x.lower() for x in parts]; bn=parts[-1].lower()
                  if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
                  if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): continue
                  ok=(rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}
                  if ok: rows.append((rel,z.read(n)))
              rows.sort(); h=hashlib.sha256()
              for rel,b in rows: h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              assert len(rows)==int(os.environ['RUNTIME_FILES']),len(rows)
              assert h.hexdigest()==os.environ['RUNTIME_FP'],h.hexdigest()
              print('DELIVERED_ZIP_FILES=561')
              print('DELIVERED_RUNTIME_FILES='+str(len(rows)))
              print('DELIVERED_RUNTIME_FP='+h.hexdigest())
          PY
          echo 'C01_BLOB_LOCK=PASS C02_BLOB_LOCK=PASS C03_ONLY_CHANGE=PASS'
          echo 'PRODUCTION=NOT_RUN STATIC=NOT_RUN ONLINE=NOT_RUN'
          echo 'PASS_S01_C03_M3U8_12530_DISTRIBUTION_GATE'
