name: P04 VF Infra V2.5.8 Assemble Runtime

on:
  push:
    paths:
      - '.github/workflows/p04-v258-assemble-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v258-assemble-runtime
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_BRANCH: feature/v2.5.8-personal-console-precision
  INPUT_COMMIT: 2b7d42302b3ad6316bc1c788536a7e2e715cfec2
  EXPECTED_VIEW_SHA256: 2e7b3a8efc3694556c128332e46b0ddaf0624611be3e827e3871855370095efa

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private V2.5.8 worktree
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.INPUT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: private-vf-infra

      - name: Verify exact input identity
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$INPUT_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.8'
          test -f scripts/.v258-view.part00
          test -f scripts/.v258-view.part01
          test -f scripts/.v258-view.part02
          test -f scripts/.v258-view.part03
          echo 'P04_V258_ASSEMBLY_INPUT_IDENTITY_PASS'

      - name: Assemble and verify exact V2.5.8 view runtime
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          cat scripts/.v258-view.part00 scripts/.v258-view.part01 scripts/.v258-view.part02 scripts/.v258-view.part03 > "$RUNNER_TEMP/v258-view.js.gz.b64"
          base64 -d "$RUNNER_TEMP/v258-view.js.gz.b64" | gzip -d > public/assets/v258-view.js
          ACTUAL_SHA="$(sha256sum public/assets/v258-view.js | cut -d' ' -f1)"
          test "$ACTUAL_SHA" = "$EXPECTED_VIEW_SHA256"
          node --check public/assets/v258-view.js
          test "$(git hash-object public/assets/v258-view.js)" = '40ccb81d645f952ed10d4afd1a80e6493866806e'
          echo 'P04_V258_VIEW_EXACT_SHA_AND_SYNTAX_PASS'

      - name: Remove all temporary transport and blocked private workflow files
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          rm -f scripts/.v258-view.part00 scripts/.v258-view.part01 scripts/.v258-view.part02 scripts/.v258-view.part03
          rm -f scripts/.v258-view.js.gz.b64
          rm -f .github/workflows/v258-assemble-view.yml
          test ! -e scripts/.v258-view.part00
          test ! -e scripts/.v258-view.js.gz.b64
          test ! -e .github/workflows/v258-assemble-view.yml
          echo 'P04_V258_TEMP_TRANSPORT_CLEANUP_PASS'

      - name: Commit exact runtime source and push feature branch non-force
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Runtime Assembler'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-status
          git commit -m 'feat(P04): assemble exact V2.5.8 precision view runtime'
          OUTPUT_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$TARGET_BRANCH"
          printf '%s\n' "$OUTPUT_COMMIT" > "$RUNNER_TEMP/p04-v258-output-commit.txt"
          echo 'P04_V258_NON_FORCE_PUSH_PASS'

      - name: Remote exact readback
        shell: bash
        working-directory: private-vf-infra
        run: |
          set -Eeuo pipefail
          OUTPUT_COMMIT="$(cat "$RUNNER_TEMP/p04-v258-output-commit.txt")"
          REMOTE_COMMIT="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_COMMIT" = "$OUTPUT_COMMIT"
          test "$(sha256sum public/assets/v258-view.js | cut -d' ' -f1)" = "$EXPECTED_VIEW_SHA256"
          cat > "$RUNNER_TEMP/p04-v258-assembly-evidence.txt" <<EOF
          P04 · VF Infra V2.5.8 Exact Runtime Assembly
          Result: PASS
          Input Commit: $INPUT_COMMIT
          Output Commit: $OUTPUT_COMMIT
          Branch: $TARGET_BRANCH
          v258-view.js SHA-256: $EXPECTED_VIEW_SHA256
          v258-view.js Git Blob: 40ccb81d645f952ed10d4afd1a80e6493866806e
          Temporary Transport: CLEANED
          Private Blocked Workflow: CLEANED
          Push: NON-FORCE
          EOF
          echo 'P04_V258_ASSEMBLY_REMOTE_READBACK_PASS'

      - name: Remove private worktree before public-safe evidence upload
        if: always()
        shell: bash
        run: |
          rm -rf private-vf-infra "$RUNNER_TEMP/v258-view.js.gz.b64"

      - name: Upload public-safe assembly evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.5.8-Assembly-Evidence
          path: ${{ runner.temp }}/p04-v258-assembly-evidence.txt
          if-no-files-found: error
          retention-days: 14
