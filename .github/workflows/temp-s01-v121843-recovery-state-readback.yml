name: TEMP S01 V1.21.843 Recovery State Readback
on:
  push:
    branches:
      - temp/s01-v121843-production-readback-20260905
    paths:
      - '.github/workflows/temp-s01-v121843-recovery-state-readback.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Read recovery fields
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.843"' /tmp/static.json >/dev/null
          echo '--- recovery ---'
          jq -c 'with_entries(select(.key|test("^sourceRecovery")))' /tmp/static.json
          echo '--- active ---'
          jq -c '{activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,sourceArtifactAvailable,manualSourceUploadRequired,candidatePackageReady,finalOnlinePass}' /tmp/static.json
          echo RECOVERY_STATE_READBACK=PASS
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
          echo RUNNER_MAIN_UNCHANGED=PASS
