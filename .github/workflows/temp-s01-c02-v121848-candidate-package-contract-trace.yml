name: TEMP S01-C02 Ops 1.21.848 Candidate Package Contract Trace
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121848-candidate-package-contract-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      COMMIT: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
    steps:
      - name: Checkout exact Product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace package readiness and download surface
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== CANDIDATE_READY_DEFS ==='
          grep -RIn --include='*.php' -E "candidateReady|candidate_ready|candidate_path|candidate_zip|download.*candidate|candidate.*download|admin_post.*download" ops/includes ops/vf-ops.php | head -260 || true
          echo '=== PACKAGE_FILE_CHECKS ==='
          grep -RIn --include='*.php' -E "is_file\(|is_readable\(|filesize\(|ZipArchive|candidate.*path|package.*path" ops/includes/release ops/includes/admin* ops/includes/site-release 2>/dev/null | grep -E "candidate|package|zip" | head -260 || true
          echo PASS_V121848_CANDIDATE_PACKAGE_CONTRACT_TRACE
