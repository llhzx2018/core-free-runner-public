name: P07 System Care RC12 Owner Package

on:
  push:
    branches: [gate/p07-system-care-rc12-zero-attention-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc12-owner-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gate/p07-system-care-rc12-zero-attention-20260908
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout exact RC12 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 30d7e55582fa94f419c2d74bface117896751c9e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Re-run exact source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 30d7e55582fa94f419c2d74bface117896751c9e
          test "$(cat product/modules/system-care/VERSION)" = 0.1.0-rc12
          cd product
          bash modules/system-care/tests/static_gate.sh
          bash modules/system-care/tests/functional_gate.sh
          echo P07_RC12_OWNER_SOURCE_GATE=PASS

      - name: Build exact runtime package
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/product/modules/system-care"
          pkg="$GITHUB_WORKSPACE/packages/p07-system-care/0.1.0-rc12"
          rm -rf "$pkg"
          mkdir -p "$pkg/lib"
          files=(
            VERSION
            vf-system-care.sh
            status.sh
            audit.sh
            updates.sh
            cleanup.sh
            memory.sh
            services.sh
            security-audit.sh
            intrusion-evidence.sh
            intrusion-evidence-entry.sh
            lib/common.sh
            lib/intrusion_evidence.py
            lib/intrusion_logs.py
            lib/intrusion_scan.py
            lib/intrusion_state.py
            lib/intrusion_discovery.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$pkg/$(dirname "$path")"
            cp "$src/$path" "$pkg/$path"
          done
          find "$pkg" -type d -name __pycache__ -prune -exec rm -rf {} +
          : > "$pkg/MANIFEST.gitblob"
          for path in "${files[@]}"; do
            printf '%s  %s\n' "$(git -C product hash-object "modules/system-care/$path")" "$path" >> "$pkg/MANIFEST.gitblob"
          done
          manifest_blob="$(git hash-object "$pkg/MANIFEST.gitblob")"
          echo "$manifest_blob" > /tmp/rc12-manifest-blob
          test "$(wc -l < "$pkg/MANIFEST.gitblob" | tr -d '[:space:]')" = 17
          while read -r expected path; do
            test "$(git hash-object "$pkg/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          echo "P07_RC12_OWNER_MANIFEST_BLOB=$manifest_blob"
          echo P07_RC12_OWNER_EXACT_BYTES=PASS

      - name: Update permanent installers in candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_blob="$(cat /tmp/rc12-manifest-blob)"
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh \
            -o installers/p07-system-care.sh
          python3 - "$manifest_blob" <<'PY'
          import re, sys
          from pathlib import Path
          manifest=sys.argv[1]
          p=Path('installers/p07-system-care.sh')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r"^VERSION='[^']+'$", "VERSION='0.1.0-rc12'", text, count=1, flags=re.M)
          if n != 1: raise SystemExit('version anchor missing')
          text,n=re.subn(r"^MANIFEST_BLOB='[^']+'$", f"MANIFEST_BLOB='{manifest}'", text, count=1, flags=re.M)
          if n != 1: raise SystemExit('manifest anchor missing')
          p.write_text(text, encoding='utf-8')

          toolbox=Path('installers/p07-toolbox.sh')
          t=toolbox.read_text(encoding='utf-8')
          t,n=re.subn(r'^SYSTEM_CARE_EXPECTED="[^"]+"$', 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"', t, count=1, flags=re.M)
          if n != 1: raise SystemExit('toolbox System Care anchor missing')
          toolbox.write_text(t, encoding='utf-8')
          PY
          bash -n installers/p07-system-care.sh
          bash -n installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc12'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='$manifest_blob'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          echo P07_RC12_OWNER_INSTALLERS=PASS

      - name: Commit owner candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add packages/p07-system-care/0.1.0-rc12 installers/p07-system-care.sh installers/p07-toolbox.sh
          git commit -m 'test(P07): publish System Care RC12 owner-test candidate'
          git push origin HEAD:gate/p07-system-care-rc12-zero-attention-20260908
          echo P07_RC12_OWNER_PACKAGE_COMMIT=PASS
