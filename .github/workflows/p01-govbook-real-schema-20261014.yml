name: P01 GOV-BOOK Real SQLite Nine-Book Pipeline
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p01-govbook-real-schema-20261014.yml'
permissions:
  contents: read
jobs:
  bounded-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-govbook-real-schema-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 candidate, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 131be42e296dadab13a3cc1b79baff42a5002efc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p01
      - name: Checkout GOV-BOOK canonical immutable assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-book
          ref: a2877dd00d0a2b2db0fc4e47f9c8fca625783898
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-book
      - name: PHP exact SQLite, GD, ZipArchive
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,mbstring,gd,pdo_sqlite,sqlite3,curl
          coverage: none
      - name: Real P01 migrations and full 9-book import with manual book sentinel
        shell: bash
        env:
          GOV_BOOK_EXACT_SOURCE: ${{ github.workspace }}/gov-book
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = 131be42e296dadab13a3cc1b79baff42a5002efc
          test "$(git -C gov-book rev-parse HEAD)" = a2877dd00d0a2b2db0fc4e47f9c8fca625783898
          php -l p01/tests/integration/gov_book_sync_full_pipeline_native.php
          php p01/tests/integration/gov_book_sync_full_pipeline_native.php | tee /tmp/vf-govbook-acceptance.txt
          for signal in \
            P01_GOVBOOK_REAL_SCHEMA_NINE_BOOK_SYNC \
            P01_GOVBOOK_REAL_SCHEMA_MANUAL_COURSE_UNTOUCHED \
            P01_GOVBOOK_REAL_SCHEMA_THREE_PULSE_IDEMPOTENCY \
            P01_GOVBOOK_REAL_SCHEMA_ZIP_COVER_READER; do
            grep -Fx "$signal=PASS" /tmp/vf-govbook-acceptance.txt
          done
          echo P01_GOVBOOK_REAL_SQLITE_PIPELINE_EXACT=PASS
