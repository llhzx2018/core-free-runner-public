name: temp-s01-ops-m3u8-admin-surface-inventory-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-m3u8-admin-surface-inventory-20260908.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      M3U8_SHA: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
    steps:
      - name: Build exact admin surface map
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INVENTORY_MODE=READ_ONLY WRITE_USED=NO'
          rm -rf /tmp/ops-map /tmp/m3u8-map
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${OPS_REPO}.git" /tmp/ops-map
          git -C /tmp/ops-map checkout -q "$OPS_SHA"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${M3U8_REPO}.git" /tmp/m3u8-map
          git -C /tmp/m3u8-map checkout -q "$M3U8_SHA"
          test "$(git -C /tmp/ops-map rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C /tmp/m3u8-map rev-parse HEAD)" = "$M3U8_SHA"

          echo '===== OPS MENU CONTRACT DEFINITIONS ====='
          cd /tmp/ops-map
          grep -RInE --include='*.php' --exclude-dir=.git 'function[[:space:]]+vf_ops_v13_menu_contract_v121391|vf_ops_v13_menu_contract_v121391[[:space:]]*\(' . | head -n 80 || true
          echo '===== OPS MENU + ROUTE REGISTRATIONS ====='
          grep -RInE --include='*.php' --exclude-dir=.git 'add_(menu_page|submenu_page|management_page|options_page|plugins_page)[[:space:]]*\(|vf-toolsite-ops|admin_page_v13|current-tab|data-vf-current-tab' includes vf-ops.php | head -n 500 || true
          echo '===== OPS ADMIN VIEW FILES ====='
          find includes -type f \( -path '*/views/*.php' -o -path '*/views/*/*.php' -o -iname '*page*.php' -o -iname '*dashboard*.php' \) | sort | head -n 500
          echo '===== OPS CURRENT CSS FILES ====='
          find assets/css/current -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort
          echo '===== OPS CSS ENQUEUE / OWNER MAP ====='
          grep -RInE --include='*.php' --exclude-dir=.git 'assets/css/current|wp_enqueue_style|admin-current-|admin-s01-console-v2|PHP_INT_MAX' includes vf-ops.php | head -n 500 || true
          echo '===== OPS HUMAN TITLES / TAB KEYS ====='
          grep -RInE --include='*.php' --exclude-dir=.git "'(dashboard|content|seo|static|acceptance|system|pages|tools|settings|integration|publish|health|release|audit)'[[:space:]]*=>|<h1|<h2|page_title|menu_title" includes/admin-v13 includes 2>/dev/null | head -n 700 || true

          echo '===== M3U8 MENU / ROUTE REGISTRATIONS ====='
          cd /tmp/m3u8-map
          grep -RInE --include='*.php' --exclude-dir=.git 'add_(menu_page|submenu_page|management_page|options_page|plugins_page)[[:space:]]*\(|remove_submenu_page|page=|vf-m3u8|m3u8' src/admin src/includes src/vf-tool-m3u8.php 2>/dev/null | head -n 700 || true
          echo '===== M3U8 ADMIN CONTROLLERS / VIEWS ====='
          find src/admin -type f \( -name '*.php' -o -name '*.css' -o -name '*.js' \) | sort | head -n 900
          echo '===== M3U8 PAGE ROOTS / HEADINGS / NAV ====='
          grep -RInE --include='*.php' --exclude-dir=.git 'class="[^"]*(wrap|vf-|dashboard)|<h1|<h2|nav-tab|Provider 工作台|设置|诊断|日志|历史|规则|来源|配置|监控|队列|验证|预览' src/admin | head -n 900 || true
          echo '===== M3U8 CSS OWNER / ENQUEUE MAP ====='
          grep -RInE --include='*.php' --exclude-dir=.git 'wp_enqueue_style|ui-v4|phase4-component-workspace|admin-s01-console-v2|PHP_INT_MAX' src/admin src/includes | head -n 500 || true
          echo 'PASS_S01_OPS_M3U8_ADMIN_SURFACE_INVENTORY'
