name: S01 C01/C02 exact-source entry link proof

on:
  push:
    branches:
      - test/s01-c01-c02-entry-link-proof-20261027
    paths:
      - '.github/workflows/s01-entry-link-private-exact-proof.yml'

permissions:
  contents: read

env:
  THEME_SOURCE_SHA: 17c9512fa885c7718ca165b8e3e904077e570b9c
  OPS_SOURCE_SHA: 6fd8a720df2b50994f34df2af53aab83da093288

jobs:
  ops-entry-links:
    name: Ops targeted PHP and update blocker regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify registered transient private checkout capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "BLOCKED_RUNNER_INFRA_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-ops
      - name: Confirm exact private source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-ops rev-parse HEAD)" = "$OPS_SOURCE_SHA"
          echo "S01_C02_EXACT_SOURCE=$OPS_SOURCE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint changed PHP
        working-directory: private-ops
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l includes/admin-v13/views/system_plugins.php
          php -l tests/s01-c02-1211095-system-update-blocker-visibility.php
      - name: Execute targeted no-update navigation regression
        working-directory: private-ops
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/s01-c02-1211095-system-update-blocker-visibility.php
          echo "S01_C02_ENTRY_LINK_MACHINE_PASS=$OPS_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  theme-entry-links:
    name: Theme isolated WordPress frontend review smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: wordpress-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Verify registered transient private checkout capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_READ_TOKEN" ]; then
            echo "BLOCKED_RUNNER_INFRA_PRIVATE_READ_TOKEN_MISSING"
            exit 78
          fi
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-theme
      - name: Confirm exact private source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-theme rev-parse HEAD)" = "$THEME_SOURCE_SHA"
          echo "S01_C01_EXACT_SOURCE=$THEME_SOURCE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, zip
          coverage: none
      - name: Lint changed PHP and focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l private-theme/src/inc/admin/views/frontend-pages.php
          php -l private-theme/tests/frontend-pages-wordpress-check.php
          php -l private-theme/tests/s01-pr-frontend-navigation-wordpress-smoke.php
      - name: Prepare throwaway WordPress and database fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/s01-wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          mkdir -p /tmp/s01-wordpress
          php /tmp/s01-wp-cli.phar core download --path=/tmp/s01-wordpress --skip-content
          php /tmp/s01-wp-cli.phar core config --path=/tmp/s01-wordpress --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/s01-wp-cli.phar core install --path=/tmp/s01-wordpress --url=http://127.0.0.1:8080 --title=S01-Test --admin_user=admin --admin_password=local-fixture-only --admin_email=test@example.invalid --skip-email
          mkdir -p /tmp/s01-wordpress/wp-content/themes
          ln -s "$GITHUB_WORKSPACE/private-theme/src" /tmp/s01-wordpress/wp-content/themes/vf-tools-theme
          php /tmp/s01-wp-cli.phar theme activate vf-tools-theme --path=/tmp/s01-wordpress
      - name: Verify twenty page entries and reverse routes in actual WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          php /tmp/s01-wp-cli.phar eval-file "$GITHUB_WORKSPACE/private-theme/tests/s01-pr-frontend-navigation-wordpress-smoke.php" --path=/tmp/s01-wordpress --skip-plugins
          echo "S01_C01_ENTRY_LINK_MACHINE_PASS=$THEME_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
