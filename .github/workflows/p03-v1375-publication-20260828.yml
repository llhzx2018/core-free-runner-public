name: P03 V1.37.5 Publication

on:
  push:
    paths:
      - '.github/workflows/p03-v1375-publication-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact verified V1.37.5 release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: bash scripts/p03-v1375-publication.sh
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: P03-V1.37.5-PUBLICATION-EVIDENCE
          path: ${{ runner.temp }}/p03-v1375-publication/evidence/P03-V1.37.5-PUBLICATION.json
          if-no-files-found: error
          retention-days: 30
