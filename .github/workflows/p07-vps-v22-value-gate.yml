name: P07 VPS Audit V2.2 Value Verdict Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-vps-v22-value-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p07-vps-value-verdict-v22
          persist-credentials: false
          fetch-depth: 1

      - name: Syntax and identity
        run: |
          set -Eeuo pipefail
          bash -n experiments/p07-vps-audit-v22.sh
          test "$(NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --version)" = "P07 VPS 一键验机 V2.2.0"
          test "$(NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --build-id)" = "2.2.0-rc1-value-verdict"

      - name: Value verdict self-test
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash experiments/p07-vps-audit-v22.sh --self-test | tee /tmp/self-test.txt
          grep -Fq 'P07_VPS_VALUE_VERDICT_SELF_TEST=PASS' /tmp/self-test.txt
