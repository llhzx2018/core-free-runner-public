            'update':{'asset_name':'VF_Infra_V2.8.4_UPDATE.zip','asset_id':520675405,'bytes':1243266,'sha256':'a1776cd99bbcd8c8402621af6c3e21b52f35ca5a37b29521a25575008d821eda','allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3'],'payload_file_count':214},
