            'formal_product_tree':'4e4df93ebb8717519ff7c714278023feb1e0dbbd',
            'runtime_source_fingerprint':'d8714d463126c4719a8f50bac7e8349145d0e99e30ad6cb758187aabc4fa3930',
            'source_manifest_sha256':'03d3a7b828bbca8031922c53b219fd51ab8ee84970258348a4bb4c29bca0a8cd',
            'runtime_file_count_including_manifest':214,
            'explicit_actions':['provider_accounts_sync_all','provider_billings_sync_all','provider_account_sync','provider_billing_sync','run_due_checks','domain_check'],
            'generic_slow_post_fallback_ms':650,
            'immediate_busy_feedback':'PASS',
            'indeterminate_progress':'PASS',
