name: P04 V2.8.4 Governance Closure
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v284-governance.yml'
      - 'requests/p04-v284-governance.txt'
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PRODUCT: 165fd09f591dddbf6c5e1337734fcd31b09a47ae
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout P04 develop exact product source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
      - name: Write Current Truth closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_PRODUCT"
          python3 - <<'PY'
          import json
          p='VF_PROJECT.json'
          d=json.load(open(p,encoding='utf-8'))
          d['status']='V2.8.4_FORMAL_RELEASE_PASS'
          d['lifecycle']='RELEASED_PENDING_PRODUCTION_OWNER_UPGRADE'
          d['version']='2.8.4'
          ba=d.setdefault('branch_authority',{})
          ba.update({
            'main':'V2.8.4_FORMAL_BRANCH_PENDING_GOVERNANCE_FAST_FORWARD',
            'develop':'V2.8.4_FORMAL_PRODUCT_PLUS_GOVERNANCE_CLOSURE',
            'formal_product_source':'165fd09f591dddbf6c5e1337734fcd31b09a47ae',
            'formal_product_tree':'4e4df93ebb8717519ff7c714278023feb1e0dbbd',
            'formal_tag':'v2.8.4',
            'working_candidate_product_source':'165fd09f591dddbf6c5e1337734fcd31b09a47ae',
            'working_candidate_product_tree':'4e4df93ebb8717519ff7c714278023feb1e0dbbd'
          })
          d['v284_long_action_feedback']={
            'status':'FORMAL_RELEASE_PASS',
            'owner_request':'LONG_RUNNING_ACTIONS_MUST_SHOW_PROGRESS_AND_PREVENT_REPEAT_CLICKS; APPLY_SAME_PATTERN_TO_SIMILAR_SCENARIOS',
            'schema':14,
            'migration':'NONE',
            'provider_authority_change':False,
