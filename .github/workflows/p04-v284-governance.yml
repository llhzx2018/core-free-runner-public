          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = 'VF_PROJECT.json'
          git commit -m 'chore(P04): close V2.8.4 long-action UX release'
          git push origin HEAD:develop
          echo "P04_V284_GOVERNANCE_COMMIT=$(git rev-parse HEAD)"
