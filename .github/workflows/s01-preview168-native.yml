name: S01 Theme Preview168 native exact upgrade
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-preview168-native.yml']
permissions:
  contents: read
env:
  TARGET_VERSION: 1.35.168
  TARGET_SHA: b0e3c2cc16584f248d0b5c4a386a279b0cf66a4d
  TARGET_TREE: 555b9d9abd4c46f2f869021ad45c615a9fc88c63
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: established
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: b0e3c2cc16584f248d0b5c4a386a279b0cf66a4d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate and build package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p provider proof
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          php -l target/src/inc/admin/views/preview.php
          node --check target/src/assets/js/admin/admin-preview.js
          php target/tests/preview-real-target-failclosed-contract.php
          php target/tests/preview-workflow-v4-contract.php
          php target/tests/preview-human-language-followup-contract.php
          gh release download v1.35.167 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.167.zip --dir provider
          echo '5525d09da700e2051b1ca0521eaabdca21a11077a22c0de04a6de29514ee2a34  provider/vf-tools-theme_V1.35.167.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          python3 control/lanes/s01-render166/package.py
      - name: WordPress native upgrade rollback repeat and protected data
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          python3 control/lanes/s01-preview-no-ghost-20261022/prepare-native168.py
          bash lane/native-preview168.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: proof/
          name: s01-preview168-native
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider lane
