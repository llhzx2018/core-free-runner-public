name: TEMP core-updates P01 V2.47.108 distribution gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-core-updates-p01-v247108.yml'

permissions:
  contents: read

jobs:
  verify-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 7938c3718034fd846cc8b44332d70528c9b9aa5a
          path: core-updates
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Verify manifest and update core
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py | tee /tmp/manifest-audit.json
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json',encoding='utf-8'))
          assert m['target_version']=='2.47.108'
          assert m['from_versions']==['2.47.105']
          assert m['release_tag']=='v2.47.108'
          assert m['release_id']==398861548
          assert m['product_identity']=='c8d3bdd2ea214cad4c339b5e1119dc3b86513498'
          assert m['asset_name']=='VF_Start_V2.47.108_UPDATE.zip'
          assert m['asset_bytes']==2028518
          assert m['asset_sha256']=='483308cd770f4ce2ef37d71c5f225b477bb8674b561d214c53fbef46351f2af9'
          assert m['schema_from']==m['schema_to']=='2026090401'
          print('P01_DISTRIBUTION_MANIFEST_EXACT=PASS')
          PY
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_DISTRIBUTION_GATE=PASS
