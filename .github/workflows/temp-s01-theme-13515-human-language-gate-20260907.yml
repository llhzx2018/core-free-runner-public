name: S01 Theme 1.35.15 Human Language Gate

on:
  push:
    branches:
      - temp/s01-theme-13515-human-language-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Credential boundary
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact Theme candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: adb8b2d40489e8ecad57401a822c08d49adcc155
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme

      - name: Exact source and changed-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          test "$(git rev-parse HEAD)" = "adb8b2d40489e8ecad57401a822c08d49adcc155"
          git cat-file -e de57f823e2d91963305b64a3c75fb1daaf93b9ba^{commit}
          git diff --name-only de57f823e2d91963305b64a3c75fb1daaf93b9ba HEAD | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          VERSION
          src/inc/update/class-vf-wp-update-admin-v1.php
          src/style.css
          tests/update-center-human-language-contract.php
          tests/update-refresh-policy-contract.php
          tests/visible-console-v2-contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log

      - name: Update center human-language contract
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/update-center-human-language-contract.php

      - name: Current update-policy regression
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/update-refresh-policy-contract.php

      - name: Visible Console V2 regression
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/visible-console-v2-contract.php

      - name: Update behavior boundary
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          git diff --unified=0 de57f823e2d91963305b64a3c75fb1daaf93b9ba HEAD -- src/inc/update/class-vf-wp-update-admin-v1.php > /tmp/admin.diff
          ! grep -E '^[-+].*(vf_wp_update_components_v1|vf-private-updates|check_all_updates|restore_latest_recovery|delete_site_transient|wp_update_themes|VF_WP_Update_Credential_V1::capability)' /tmp/admin.diff
          ! git diff --name-only de57f823e2d91963305b64a3c75fb1daaf93b9ba HEAD | grep -E '(^|/)(class-vf-theme-update-(client|source|package|recovery)-v1\.php|class-vf-wp-update-credential-v1\.php|assets/css/)'
          echo PASS_THEME_UPDATE_BEHAVIOR_BOUNDARY
