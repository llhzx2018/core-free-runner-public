name: P02 V2.5.0 UAUI Final 4
on:
  pull_request:
    branches: [main]
    paths: ['p02-v250-final4-trigger.txt']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Lint public runner script
        run: node --check runner/p02-v250-final.mjs
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: task/v2.5.0-runtime-uaui
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: false
      - name: Static gates and browser prerequisites
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test -n '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl
          php -l public/index.php
          find public src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          node --check public/assets/app.js
          node --check public/assets/editor-enhancements.js
          node --check public/assets/v250-uaui.js
          python3 scripts/repository-gates.py
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Fresh install
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250F4-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-final4"; SITE="$ROOT/site"; mkdir -p "$SITE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test -s "$SITE/assets/v250-uaui.css"; test -s "$SITE/assets/v250-uaui.js"; test -s "$SITE/assets/v250-reader-scale.css"
          php -d display_errors=0 -S 127.0.0.1:18159 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/server.pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18159/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie.txt" http://127.0.0.1:18159/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie.txt" -c "$ROOT/cookie.txt" -H 'Origin: http://127.0.0.1:18159' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$AUDIT_PASSWORD" --data-urlencode "password_confirm=$AUDIT_PASSWORD" http://127.0.0.1:18159/setup.php)" = 303
      - name: Browser UAUI + Stable Core parity
        working-directory: p02
        env: {AUDIT_PASSWORD: 'P02-V250F4-${{ github.run_id }}-${{ github.run_attempt }}!'}
        run: node ../runner/p02-v250-final.mjs
      - name: Cleanup
        if: always()
        working-directory: p02
        run: |
          if test -f "$RUNNER_TEMP/p02-final4/server.pid"; then kill "$(cat "$RUNNER_TEMP/p02-final4/server.pid")" 2>/dev/null || true; fi
          rm -rf "$RUNNER_TEMP/p02-final4" node_modules package.json package-lock.json || true
