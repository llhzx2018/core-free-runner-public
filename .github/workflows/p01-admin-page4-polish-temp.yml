name: p01-admin-page4-polish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-admin-page4-polish-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: f2be1bacd9bcfb3efdf4f6789bf809889dec3fde
      TARGET_SHA: 3b703669924eaf522b5724b4b93de77147554aa7
    steps:
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          echo P01_ADMIN_PAGE4_EXACT_SOURCE=PASS

      - name: Verify bounded four-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/admin-pages.css
          src/assets/links-admin.js
          src/links-admin.php
          tests/unit/admin_navigation_categories_page4_polish_contract.php
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.42"
          echo P01_ADMIN_PAGE4_BOUNDED_DIFF=PASS

      - name: Lint and focused Navigation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/links-admin.php
          node --check current/src/assets/links-admin.js
          tests=(
            tests/unit/admin_navigation_category_route_runtime_contract.php
            tests/unit/admin_navigation_task_separation_contract.php
            tests/unit/navigation_category_workspace_tabs_contract.php
            tests/unit/navigation_category_header_contract.php
            tests/unit/links_admin_visible_selection_contract.php
            tests/unit/links_filter_empty_state_clarity_contract.php
            tests/unit/navigation_row_action_hierarchy_contract.php
            tests/unit/navigation_mobile_list_r73_contract.php
            tests/unit/admin_navigation_categories_page4_polish_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_ADMIN_PAGE4_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_ADMIN_PAGE4_CANONICAL=PASS
