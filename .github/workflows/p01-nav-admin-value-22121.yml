# P01 · VF Start · Backend Function Value Decision

Date: 2026-08-19
Baseline: Production 2.21.20

## Product rule
VF Start is a personal navigation and URL-asset system. A backend function must either support daily URL work, preserve recoverability, or surface a real exception. Historical engineering workspaces are not permanent product modules.

## KEEP / MERGE
- URL / category / pending: core daily workspace.
- URL health: keep under URL; exception handling, not a system module.
- Duplicate URLs: keep under URL; cleanup action.
- Import / export: keep under URL; migration of URL assets.
- Browser helper: keep; direct capture path.
- Backup / restore / disaster recovery: keep as one recovery family.
- Archive / trash: keep as URL lifecycle recovery.
- Settings: keep; brand, display, home, public/SEO, account.
- System status: keep inside Settings; normal state stays quiet.
- RSS extension: keep inside Settings; there is currently only one bundled plugin.
- Update: keep.

## RETIRE AS USER FEATURES
- Tags: retire. Category + visibility + pending already form the stable organization model. Tag governance adds a second organization system and maintenance burden.
- Affiliate / promotion-link management: retire. It grew into campaign/tracking/merchant governance beyond the personal-navigation core. Existing DB fields/API compatibility are preserved during the retirement window; no destructive data migration in this maintenance cycle.
- Historical governance workspace: retire. Historical governance is sealed evidence, not an ongoing operation.
- Icon management workspace: retire. Icon fetching/repair remains automatic/system-owned.
- Background-jobs workspace: retire. Jobs remain internal; failures surface through system status.
- Separate security page: retire. Account/security belongs to Settings.
- Management overview page: retire. Entering the backend opens URL management directly.

## Safety boundary
This cycle retires/merges product surfaces without deleting historical DB columns or rows. Physical schema cleanup, if ever justified, requires a separate migration with data-readback evidence. No user data is deleted here.
MD
