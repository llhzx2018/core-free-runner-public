name: P02 V2.5.124 Settings Targeted Browser

on:
  push:
    branches:
      - run/p02-v25124-settings-functional-content-20260926
    paths:
      - '.github/workflows/p02-v25124-settings-targeted.yml'
      - 'requests/p02-v25124-settings-targeted.sh'

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: abe8852160f4bf796c99fd126a6386b138e0639b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "abe8852160f4bf796c99fd126a6386b138e0639b"
          bash runner/requests/p02-v25124-settings-targeted.sh
