name: TEMP P08 R43 SQLite same-PDO WAL transactional backup and DDL rollback proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-same-pdo-wal-20261124b.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 5923851bde4d6a25c06e32c6506fe2c726b9ed79
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-same-pdo-wal-20261124b'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-same-pdo-wal-20261124b.json --input .github/workflows/temp-p08-r43-same-pdo-wal-20261124b.yml
  sqlite-same-connection:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-same-pdo-wal-20261124b'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source locked dependencies and two real source-built FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php > "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TRANSACTION_PHP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php >> "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TEST_PHP_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/r43-$d-composer.log" 2>&1) || { echo R43_COMPOSER_LOCK=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/r43-$d-vite.log" 2>&1) || { echo R43_NPM_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-bridge-package.log" 2>&1 || { echo R43_BRIDGE_CANONICAL_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-target-package.log" 2>&1 || { echo R43_TARGET_CANONICAL_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-bridge-extract"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$RUNNER_TEMP/p08-r43-bridge-extract"
          echo P08_R43_CANONICAL_DEV_FULLS_EXTRACTED=PASS
      - name: Exact-source real v017 Owner SQLite WAL same-PDO rollback-only proof
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          t="private-p08-bridge/tests/compatibility/r43_sqlite_writer_isolation_probe.php"
          php -l "$t" > "$RUNNER_TEMP/r43-pdo-syntax.log" 2>&1 || { echo P08_R43_SAME_PDO_SYNTAX=FAIL; exit 1; }
          site="$RUNNER_TEMP/p08-r43-site-app-gate"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-pdo-setup.log" 2>&1 || { echo P08_R43_SAME_PDO_CLEAN_OWNER_SETUP=FAIL; exit 1; }
          if ! php "$t" same-pdo-wal-proof "$site" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-pdo-proof.log" 2>&1; then
            echo P08_R43_SAME_PDO_WAL_PROOF=FAIL
            grep -E '^P08_R43_SQLITE_DB_FENCE_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/r43-pdo-proof.log" | tail -15 || true
            safe_reason="$(sed -nE 's/.*RuntimeException: (R43_[A-Z0-9_]+).*/\1/p' "$RUNNER_TEMP/r43-pdo-proof.log" | head -1 || true)"
            if [[ "$safe_reason" =~ ^R43_[A-Z0-9_]+$ ]]; then echo "P08_R43_SAME_PDO_SAFE_REASON=$safe_reason"; else echo P08_R43_SAME_PDO_SAFE_REASON=UNCLASSIFIED; fi
            exit 1
          fi
          for name in SAME_PDO_PROOF_NEVER_ADMITS_APPLY SINGLE_CONNECTION_REQUIRES_REAL_WAL REAL_OLD_OWNER_SCHEMA_BEFORE_SNAPSHOT WAL_BACKUP_PRIVATE_INDEPENDENT_DB WAL_BACKUP_OLD_SCHEMA_OWNER_PARITY SAME_PDO_UNCOMMITTED_DDL_VISIBLE EXTERNAL_WRITER_SQLITE_BUSY_THROUGH_DDL ROLLBACK_PRESERVES_OLD_SCHEMA_OWNER_AND_NO_EXTERNAL_WRITE NO_SOURCE_POINTER_SWAP; do
            grep -qx "P08_R43_SQLITE_DB_FENCE_$name=PASS" "$RUNNER_TEMP/r43-pdo-proof.log" || { echo "P08_R43_SAME_PDO_MISSING_ASSERT=$name"; exit 1; }
          done
          test ! -e "$RUNNER_TEMP/r43-sqlite-same-pdo-wal-snapshot.sqlite"
          echo P08_R43_SAME_PDO_WAL_SNAPSHOT_DDL_TRANSACTION_ROLLBACK=PASS
          echo P08_R43_REAL_V017_SOURCE="$BRIDGE_SHA"
          echo P08_R43_REAL_V018_TARGET="$TARGET_SHA"
          echo P08_R43_PRODUCTION_SCHEMA_APPLY=BLOCKED
      - name: Remove private sources and synthetic Owner DB/files
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-app-gate" "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP/p08-r43-bridge-extract"
          rm -f -- "$RUNNER_TEMP"/r43-*.zip "$RUNNER_TEMP"/r43-*.log "$RUNNER_TEMP/r43-sqlite-same-pdo-wal-snapshot.sqlite"
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-site-app-gate"; then
            echo P08_R43_PRIVATE_SOURCE_AND_SYNTHETIC_SITE_CLEANUP=PASS
          else
            echo P08_R43_PRIVATE_CLEANUP=FAIL
            exit 1
          fi
