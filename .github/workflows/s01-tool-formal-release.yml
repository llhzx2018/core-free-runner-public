name: S01 Theme155 and M3U8-92 formal GitHub release
on:
  push:
    branches: [task/s01-tool-results-20261021]
    paths: ['.github/workflows/s01-tool-formal-release.yml']
permissions:
  contents: read
env:
  TARGET_SHA: 8b3a97697871c14789ebb89d2f3cee8dfc2420ef
  TARGET_VERSION: 1.35.155
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 8b3a97697871c14789ebb89d2f3cee8dfc2420ef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: e1bb445cbd08acdd2cfe8b847fb27e1f22340cb5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: provider-candidate
      - name: Verify both tested source trees equal merged main
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD^{tree})" = 'a4fdbe793cd1d97ab5944b9e6f877d843eb96cde'
          test "$(git -C provider-candidate rev-parse HEAD^{tree})" = 'c3b1dde4f9e53ddc93c67aad6586c20ea7ebf271'
          test "$(gh api repos/llhzx2018/vf-tools-theme/commits/main --jq .sha)" = '5fc738ac42d71898da146b6fedc70a4ad7ec1a43'
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/commits/main --jq .sha)" = 'ff767c337ad9dc0b0246cc63e5eb555380319a57'
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/commits/5fc738ac42d71898da146b6fedc70a4ad7ec1a43 --jq .tree.sha)" = 'a4fdbe793cd1d97ab5944b9e6f877d843eb96cde'
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/git/commits/ff767c337ad9dc0b0246cc63e5eb555380319a57 --jq .tree.sha)" = 'c3b1dde4f9e53ddc93c67aad6586c20ea7ebf271'
          echo MERGED_MAIN_EXACT_TESTED_TREES_PASS
      - name: Build validated Theme deterministic release ZIP
        run: |
          python3 control/lanes/s01-tool-results-20261021/release155-package.py
          echo '125b15f50ad36b5a05d7ff1998313d90580e6def99415bfaca956cbc710c5b5a  vf-tools-theme_V1.35.155.zip' | sha256sum -c
      - name: Exact M3U8 1.25.92 candidate package from previous release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
          node --check provider-candidate/src/public/js/modules/converter.js
          node --check provider-candidate/src/public/dist/converter.js
          php -l provider-candidate/src/includes/i18n.php
          python3 - <<'PYCANDIDATE'
          from pathlib import Path, PurePosixPath
          import subprocess,zipfile,hashlib,json,io
          root=Path('provider-candidate')
          sha='e1bb445cbd08acdd2cfe8b847fb27e1f22340cb5'
          tree='c3b1dde4f9e53ddc93c67aad6586c20ea7ebf271'
          base='2494010394a424112bd4cb7d70c60b0481e21313'
          v='1.25.92'
          def git(*args):
              return subprocess.check_output(['git','-C',str(root),*args])
          assert git('rev-parse','HEAD').decode().strip()==sha
          assert git('rev-parse','HEAD^{tree}').decode().strip()==tree
          assert (root/'VERSION').read_text().strip()==v
          changed=set(git('diff','--name-only',base,'HEAD').decode().splitlines())
          expected={'CHANGELOG.md','VERSION','src/PACKAGE_PROFILE.json','src/config/performance-bundles.php','src/includes/i18n.php','src/plugin-manifest.json','src/public/dist/converter.js','src/public/js/modules/converter.js','src/vf-tool-m3u8.php'}
          assert changed==expected,(changed^expected)
          oldsrc=git('show',base+':src/public/js/modules/converter.js').decode()
          newsrc=(root/'src/public/js/modules/converter.js').read_text()
          olddist=git('show',base+':src/public/dist/converter.js').decode()
          newdist=(root/'src/public/dist/converter.js').read_text()
          def sample(s):
              a=s.index('  function sample(r,options){')
              b=s.index('  function clear(r){',a)
              return s[a:b]
          before,after=sample(oldsrc),sample(newsrc)
          inject_start=newsrc.index('  function applyIncoming(r){')
          inject_end=newsrc.index('  function bootRoot(r){',inject_start)
          inject=newsrc[inject_start:inject_end]
          assert inject and newdist.count(inject)==1
          boot_old='  function bootRoot(r){'
          boot_new=inject+'  function bootRoot(r){applyIncoming(r);'
          assert oldsrc.replace(before,after,1).replace(boot_old,boot_new,1)==newsrc
          assert olddist.count(before)==1
          assert olddist.replace(before,after,1).replace(boot_old,boot_new,1)==newdist
          print('M3U8_SOURCE_DIST_EXACT_CLOSURE=PASS')
          oldzip=Path('provider/vf-tools-m3u8_V1.25.91.zip')
          newzip=Path('provider/vf-tool-m3u8_V1.25.92.zip')
          required={'vf-tool-m3u8.php','includes/i18n.php','plugin-manifest.json','config/performance-bundles.php','public/dist/converter.js','public/js/modules/converter.js'}
          runtime_changed={p[4:] for p in expected if p.startswith('src/')}
          def build():
              b=io.BytesIO()
              changed_actual=[]
              with zipfile.ZipFile(oldzip) as zin,zipfile.ZipFile(b,'w') as zout:
                  names=zin.namelist()
                  files=[n for n in names if not n.endswith('/')]
                  assert len(files)==568,len(files)
                  assert all(n.startswith('vf-tool-m3u8/') and '..' not in PurePosixPath(n).parts for n in names)
                  found={n[len('vf-tool-m3u8/'):] for n in files}
                  assert required<=found,sorted(required-found)
                  for info in zin.infolist():
                      data=zin.read(info.filename)
                      rel=info.filename[len('vf-tool-m3u8/'):]
                      if rel in runtime_changed:
                          baseline=git('show',base+':src/'+rel)
                          assert data==baseline,rel+' differs from previous release'
                          data=(root/'src'/rel).read_bytes()
                          changed_actual.append(rel)
                      zout.writestr(info,data)
              assert required<=set(changed_actual),sorted(required-set(changed_actual))
              return b.getvalue(),changed_actual
          a,files=build()
          b,_=build()
          assert a==b
          newzip.write_bytes(a)
          with zipfile.ZipFile(newzip) as z:
              assert z.testzip() is None
              assert len([n for n in z.namelist() if not n.endswith('/')])==568
              header=z.read('vf-tool-m3u8/vf-tool-m3u8.php').decode()
              assert 'Version: 1.25.92' in header
              assert '1.25.91' not in header[:3000]
          record={'status':'PASS','version':v,'source':sha,'tree':tree,'file_count':568,'changed_runtime_files':files,'bytes':len(a),'sha256':hashlib.sha256(a).hexdigest(),'source_dist_closure':'PASS','reproducible':'PASS','root':'vf-tool-m3u8/','production':'UNTOUCHED'}
          Path('proof/m3u8-candidate-package.json').write_text(json.dumps(record,indent=2))
          print('M3U8_CANDIDATE_PACKAGE',json.dumps(record))
          PYCANDIDATE
      - name: Verify both release asset bytes before any write
        run: |
          set -euo pipefail
          cp provider/vf-tool-m3u8_V1.25.92.zip vf-tools-m3u8_V1.25.92.zip
          echo '6bf23229781134dfb387bd2f9c1bc59de7a6ed535e069e642be808b6bf269517  vf-tools-m3u8_V1.25.92.zip' | sha256sum -c
          test "$(stat -c %s vf-tools-theme_V1.35.155.zip)" = 1967613
          test "$(stat -c %s vf-tools-m3u8_V1.25.92.zip)" = 3603630
          echo EXACT_TESTED_ASSETS_CLOSED_PASS
      - name: Publish two formal Releases to product repos (not Production)
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.155 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then
            gh release create v1.35.155 vf-tools-theme_V1.35.155.zip --repo llhzx2018/vf-tools-theme --target 5fc738ac42d71898da146b6fedc70a4ad7ec1a43 --title 'VF Tools Theme V1.35.155' --notes '修复中文相关工具旧默认英文说明及播放器深色标题对比度；保留自定义说明。476 文件确定性包和 WordPress 原生升级回退 PASS；Production 由 OWNER 手工升级。' --latest
          fi
          if ! gh release view v1.25.92 --repo llhzx2018/vf-tools-m3u8 >/dev/null 2>&1; then
            gh release create v1.25.92 vf-tools-m3u8_V1.25.92.zip --repo llhzx2018/vf-tools-m3u8 --target ff767c337ad9dc0b0246cc63e5eb555380319a57 --title 'VF Tools M3U8 V1.25.92' --notes '修复中文下载结果运行时选择器、转换器失败示例恢复和跨工具来源地址输入；真实浏览器69/69 PASS，原生升级回退重升幂等及数据保留 PASS。物理插件根 vf-tool-m3u8 保持；Production 手工升级。' --latest
          fi
      - name: Authenticated release asset byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof/released-theme proof/released-m3u8
          gh release download v1.35.155 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.155.zip --dir proof/released-theme
          gh release download v1.25.92 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.92.zip --dir proof/released-m3u8
          cmp vf-tools-theme_V1.35.155.zip proof/released-theme/vf-tools-theme_V1.35.155.zip
          cmp vf-tools-m3u8_V1.25.92.zip proof/released-m3u8/vf-tools-m3u8_V1.25.92.zip
          test "$(gh release view v1.35.155 --repo llhzx2018/vf-tools-theme --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          test "$(gh release view v1.25.92 --repo llhzx2018/vf-tools-m3u8 --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          echo BOTH_FORMAL_RELEASE_ASSETS_AUTHENTICATED_BYTE_IDENTICAL_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme155-m3u892-formal-${{ github.run_id }}
          path: |
            proof/candidate-zip-receipt.json
            proof/m3u8-candidate-package.json
          retention-days: 14
      - name: Remove temporary private source and ZIPs
        if: always()
        run: rm -rf target provider-candidate provider vf-tools-theme_V1.35.155.zip vf-tools-m3u8_V1.25.92.zip proof/released-theme proof/released-m3u8
