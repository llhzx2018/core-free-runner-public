name: TEMP Git Estate Registry Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-git-estate-registry-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary runner head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact GOV-DOC candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: 293de4cd63af4fbb8828e6847db9b46de67e7fb8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          test "$(git rev-parse HEAD)" = '293de4cd63af4fbb8828e6847db9b46de67e7fb8'

      - name: Verify Git Estate registry contract
        shell: bash
        run: |
          set -euo pipefail
          cd gov
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          registry_path = Path('governance/authority/VF_GIT_REPOSITORY_REGISTRY_V1.0.json')
          contract_path = Path('governance/authority/VF_GIT_ESTATE_GOVERNANCE_CONTRACT_V1.0.md')
          readme_path = Path('governance/README.md')

          assert registry_path.is_file()
          assert contract_path.is_file()
          assert readme_path.is_file()

          raw = registry_path.read_text(encoding='utf-8')
          data = json.loads(raw)
          assert data['schema'] == 'vf.git-repository-registry.v1'
          assert data['version'] == '1.0'
          assert data['status'] == 'CURRENT_ON_MERGE'
          assert data['lifecycle_values'] == ['ACTIVE', 'REFERENCE', 'CANDIDATE', 'HISTORICAL', 'DELETED']
          assert data['route_status_values'] == ['CURRENT_ROUTE', 'NON_AUTHORITY', 'TOMBSTONE']

          repos = data['repositories']
          assert len(repos) == 19
          names = [r['repository'] for r in repos]
          assert len(names) == len(set(names))

          accessible = {
              'llhzx2018/NotionNext',
              'llhzx2018/m3u8-downloader',
              'llhzx2018/freePS',
              'llhzx2018/vf-infra',
              'llhzx2018/vf-start',
              'llhzx2018/vf-library',
              'llhzx2018/vf-forge',
              'llhzx2018/vf-seo',
              'llhzx2018/vf-tools-theme',
              'llhzx2018/vf-tools-m3u8',
              'llhzx2018/vf-tools-ops',
              'llhzx2018/gov-doc',
              'llhzx2018/core-updates',
              'llhzx2018/core-free-runner-public',
              'llhzx2018/core-free-runner-private',
              'llhzx2018/core-agent',
              'llhzx2018/vf-press',
              'llhzx2018/kewaro',
          }
          assert set(names) == accessible | {'llhzx2018/core-test-runner'}

          by_name = {r['repository']: r for r in repos}
          for name in accessible:
              r = by_name[name]
              assert r['lifecycle'] in data['lifecycle_values']
              assert r['route_status'] in data['route_status_values']

          external = {
              'llhzx2018/NotionNext': 'notionnext-org/NotionNext',
              'llhzx2018/freePS': 'geeeeeeeek/freePS',
              'llhzx2018/m3u8-downloader': 'Momo707577045/m3u8-downloader',
          }
          for name, upstream in external.items():
              r = by_name[name]
              assert r['source_class'] == 'EXTERNAL_FORK'
              assert r['estate_role'] == 'EXTERNAL_SOURCE_FORK'
              assert r['lifecycle'] == 'REFERENCE'
              assert r['route_status'] == 'NON_AUTHORITY'
              assert r['upstream'] == upstream
              assert r['authority_pointer'] == 'UPSTREAM'

          deleted = by_name['llhzx2018/core-test-runner']
          assert deleted['lifecycle'] == 'DELETED'
          assert deleted['route_status'] == 'TOMBSTONE'

          for r in repos:
              pointer = r['authority_pointer']
              if pointer in {'UPSTREAM', 'REPOSITORY_MAIN'}:
                  continue
              assert Path(pointer).exists(), (r['repository'], pointer)

          # Registry must never become a dynamic observation database.
          assert not re.search(r'\b[0-9a-f]{40}\b', raw, re.I)
          forbidden_keys = {
              'head_sha', 'main_sha', 'open_prs', 'workflow_run', 'workflow_run_id',
              'release_version', 'production_version', 'installed_version', 'latest_run'
          }
          def walk(value):
              if isinstance(value, dict):
                  assert not (set(value) & forbidden_keys), set(value) & forbidden_keys
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)

          contract = contract_path.read_text(encoding='utf-8')
          for required in [
              'CURRENT / AUTHORITATIVE ON MERGE',
              'Current Truth 必须拆分',
              'AI-assisted Trunk + Controlled PR Gate',
              'Branch 删除 Gate',
              '外部 Fork 治理',
              'Runner 治理',
              'Release / Update Contract',
              'GitHub Protection 顺序',
              'Agent Runtime 最小读取合同',
          ]:
              assert required in contract, required

          readme = readme_path.read_text(encoding='utf-8')
          assert 'VF_GIT_ESTATE_GOVERNANCE_CONTRACT_V1.0.md' in readme
          assert 'VF_GIT_REPOSITORY_REGISTRY_V1.0.json' in readme

          print('GIT_ESTATE_GATE=PASS')
          print('REGISTRY_COUNT=19')
          print('CURRENT_ROUTE_COUNT=' + str(sum(r['route_status'] == 'CURRENT_ROUTE' for r in repos)))
          print('REFERENCE_COUNT=' + str(sum(r['lifecycle'] == 'REFERENCE' for r in repos)))
          print('TOMBSTONE_COUNT=' + str(sum(r['route_status'] == 'TOMBSTONE' for r in repos)))
          PY
