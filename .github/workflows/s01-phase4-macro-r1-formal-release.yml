name: S01 Phase 4 Macro R1 Formal Release

on:
  push:
    branches:
      - task/s01-phase4-macro-r1-formal-release
    paths:
      - .github/workflows/s01-phase4-macro-r1-formal-release.yml

permissions:
  contents: read

jobs:
  formal-release:
    name: Exact source release + distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo "CREDENTIAL_GATE=PASS"

      - name: Fetch exact merged main sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/s01-release
          mkdir -p /tmp/s01-release/src /tmp/s01-release/out /tmp/s01-release/meta

          fetch_source() {
            key="$1"; repo="$2"; sha="$3"; version="$4"
            commit_json="/tmp/s01-release/meta/$key-commit.json"
            curl -fsSL               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/commits/$sha" -o "$commit_json"
            test "$(jq -r '.sha' "$commit_json")" = "$sha"

            branch_sha="$(curl -fsSL               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/branches/main" | jq -r '.commit.sha')"
            test "$branch_sha" = "$sha"

            mkdir -p "/tmp/s01-release/src/$key"
            curl -fsSL -L               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/tarball/$sha"               -o "/tmp/s01-release/$key.tar.gz"
            tar -xzf "/tmp/s01-release/$key.tar.gz" -C "/tmp/s01-release/src/$key"
            root="$(find "/tmp/s01-release/src/$key" -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$root"
            test "$(tr -d '\r\n' < "$root/VERSION")" = "$version"
            printf '%s' "$root" > "/tmp/s01-release/meta/$key-root"
          }

          fetch_source ops llhzx2018/vf-tools-ops 8c2fb1f4037f87d674a0cfc16a02805cf7b2f569 1.21.944
          fetch_source theme llhzx2018/vf-tools-theme 7fac7f5dcee3deb9c2fc4e8666adb3774f4bd202 1.35.46
          fetch_source m3u8 llhzx2018/vf-tools-m3u8 7ede1009c1c0a5c7a0b1d33f27fa6b7a655bc17c 1.25.49
          echo "EXACT_MERGED_MAIN_SOURCE=PASS"

      - name: Exact source UI contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          ops="$(cat /tmp/s01-release/meta/ops-root)"
          theme="$(cat /tmp/s01-release/meta/theme-root)"
          m3u8="$(cat /tmp/s01-release/meta/m3u8-root)"

          php "$ops/tests/s01-c02-page-body-system-v1-phase4-macro-contract.php"
          php "$ops/tests/s01-c02-page-body-system-v1-phase3-contract.php"
          php "$ops/tests/s01-c02-page-body-system-v1-phase3-residue-contract.php"

          php "$theme/tests/s01-c01-page-body-system-v1-phase4-macro-contract.php"
          php "$theme/tests/s01-c01-page-body-system-v1-phase3-contract.php"
          php "$theme/tests/s01-c01-page-body-system-v1-phase3-residue-contract.php"

          php "$m3u8/tests/s01-c03-page-body-system-v1-phase4-macro-contract.php"
          php "$m3u8/tests/s01-c03-page-body-system-v1-phase3-contract.php"
          php "$m3u8/tests/s01-c03-page-body-system-v1-phase3-residue-contract.php"
          php "$m3u8/tests/unit/package-physical-locator-contract.php"
          php "$m3u8/tests/unit/update-schema-authority-contract.php"

          echo "EXACT_MAIN_UAUI_CONTRACTS=PASS"

      - name: Build all exact release assets before mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          ops="$(cat /tmp/s01-release/meta/ops-root)"
          theme="$(cat /tmp/s01-release/meta/theme-root)"
          m3u8="$(cat /tmp/s01-release/meta/m3u8-root)"

          python3 "$ops/.github/release/build-ops-package.py"             --source "$ops"             --output "/tmp/s01-release/out/vf-tools-ops_V1.21.944.zip"             > /tmp/s01-release/meta/ops.json

          python3 - "$theme" "$m3u8" <<'PY'
          import hashlib, json, re, sys, zipfile
          from pathlib import Path

          theme_repo=Path(sys.argv[1])
          m3u8_repo=Path(sys.argv[2])
          out=Path("/tmp/s01-release/out")
          meta_dir=Path("/tmp/s01-release/meta")
          epoch=(1980,1,1,0,0,0)

          def safe_files(src: Path):
              rows=[]
              for p in sorted(src.rglob("*")):
                  if not p.is_file():
                      continue
                  rel=p.relative_to(src).as_posix()
                  if p.is_symlink():
                      raise SystemExit(f"symlink not allowed: {rel}")
                  if re.search(r"(^|/)(\.git|\.github|tests?|docs?|evidence|private)(/|$)", rel, re.I):
                      raise SystemExit(f"dev/private path not allowed: {rel}")
                  if re.search(r"\.(sql|sqlite|sqlite3|db|log|tar|gz)$", rel, re.I):
                      raise SystemExit(f"forbidden package content: {rel}")
                  if re.search(r"(^|/)\.env(?:\.|$)|(^|/)wp-config\.php$", rel, re.I):
                      raise SystemExit(f"secret-risk file: {rel}")
                  rows.append((rel,p.read_bytes()))
              return rows

          def write_zip(files, top, path):
              with zipfile.ZipFile(path,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      zi=zipfile.ZipInfo(f"{top}/{rel}",epoch)
                      zi.compress_type=zipfile.ZIP_DEFLATED
                      zi.external_attr=0o100644 << 16
                      z.writestr(zi,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)

          def fingerprint(files, is_runtime):
              rows=[]
              for rel,data in files:
                  if is_runtime(rel):
                      rows.append((rel,hashlib.sha256(data).hexdigest()))
              canonical="".join(f"{p}\0{h}\n" for p,h in sorted(rows)).encode()
              return len(rows),hashlib.sha256(canonical).hexdigest()

          def theme_runtime(rel):
              parts=rel.split("/")
              if len(parts)==1:
                  return rel=="style.css" or rel.lower().endswith(".php")
              return parts[0] in {"inc","assets","config","languages","template-parts","templates"}

          def m3u8_runtime(rel):
              base=rel.split("/")[-1].lower()
              if base in {"readme.md","changelog.md","license","license.txt","package_profile.json"}:
                  return False
              if re.search(r"\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$",rel,re.I):
                  return False
              parts=rel.split("/")
              if len(parts)==1:
                  return rel in {"vf-tool-m3u8.php","uninstall.php","plugin-manifest.json","tool-settings.schema.json"}
              return parts[0] in {"admin","config","includes","public","templates","tools"}

          specs=[
              ("theme",theme_repo/"src","vf-tools-theme","1.35.46","style.css",theme_runtime,"vf-tools-theme_V1.35.46.zip"),
              ("m3u8",m3u8_repo/"src","vf-tool-m3u8","1.25.49","vf-tool-m3u8.php",m3u8_runtime,"vf-tools-m3u8_V1.25.49.zip"),
          ]
          for key,src,top,version,main,runtime_fn,asset_name in specs:
              files=safe_files(src)
              asset=out/asset_name
              write_zip(files,top,asset)
              with zipfile.ZipFile(asset) as z:
                  names=[n for n in z.namelist() if not n.endswith("/")]
                  if not names or any(not n.startswith(top+"/") for n in names):
                      raise SystemExit(f"{key}: single root failed")
                  if any(n.startswith(top+"/"+top+"/") for n in names):
                      raise SystemExit(f"{key}: double nested root")
                  main_name=f"{top}/{main}"
                  if main_name not in names:
                      raise SystemExit(f"{key}: main file missing")
                  main_text=z.read(main_name).decode("utf-8")
                  if key=="theme":
                      if not re.search(rf"^Version:\s*{re.escape(version)}\s*$",main_text,re.M):
                          raise SystemExit("theme header version mismatch")
                      for required in [f"{top}/functions.php",f"{top}/index.php"]:
                          if required not in names:
                              raise SystemExit(f"theme required file missing: {required}")
                  else:
                      if not re.search(rf"^\s*\*\s*Version:\s*{re.escape(version)}\s*$",main_text,re.M):
                          raise SystemExit("m3u8 header version mismatch")
              count,fp=fingerprint(files,runtime_fn)
              meta={
                  "version":version,
                  "asset_name":asset_name,
                  "asset_bytes":asset.stat().st_size,
                  "asset_sha256":hashlib.sha256(asset.read_bytes()).hexdigest(),
                  "runtime_files":count,
                  "runtime_fingerprint":fp,
                  "package_slug":top,
                  "root_contract":"PASS_SINGLE_ROOT",
              }
              (meta_dir/f"{key}.json").write_text(json.dumps(meta,ensure_ascii=False,sort_keys=True)+"\n")
              print(key,json.dumps(meta,ensure_ascii=False,sort_keys=True))
          PY

          for key in ops theme m3u8; do
            jq -e '.asset_bytes > 0 and (.asset_sha256|length)==64 and .runtime_files > 0 and (.runtime_fingerprint|length)==64' "/tmp/s01-release/meta/$key.json"
            cat "/tmp/s01-release/meta/$key.json"
          done
          echo "ALL_EXACT_ASSETS_BUILT_BEFORE_RELEASE_WRITE=PASS"

      - name: Create or verify source tags and GitHub Releases
        shell: bash
        run: |
          set -Eeuo pipefail

          release_one() {
            key="$1"; repo="$2"; sha="$3"; version="$4"; display="$5"; asset="$6"; body="$7"
            tag="v$version"
            meta="/tmp/s01-release/meta/$key.json"

            ref_code="$(curl -sS -o "/tmp/s01-release/meta/$key-ref.json" -w '%{http_code}'               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/git/ref/tags/$tag")"
            if [ "$ref_code" = "404" ]; then
              jq -n --arg ref "refs/tags/$tag" --arg sha "$sha" '{ref:$ref,sha:$sha}'                 > "/tmp/s01-release/meta/$key-create-ref.json"
              curl -fsSL -X POST                 -H "Authorization: Bearer $WRITE_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "Content-Type: application/json"                 "https://api.github.com/repos/$repo/git/refs"                 --data-binary @"/tmp/s01-release/meta/$key-create-ref.json"                 > "/tmp/s01-release/meta/$key-ref.json"
            elif [ "$ref_code" != "200" ]; then
              cat "/tmp/s01-release/meta/$key-ref.json"
              exit 1
            fi
            test "$(jq -r '.object.sha' "/tmp/s01-release/meta/$key-ref.json")" = "$sha"

            rel_code="$(curl -sS -o "/tmp/s01-release/meta/$key-release.json" -w '%{http_code}'               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/releases/tags/$tag")"
            if [ "$rel_code" = "404" ]; then
              jq -n                 --arg tag "$tag"                 --arg target "$sha"                 --arg name "$display V$version"                 --arg body "$body"                 '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false,generate_release_notes:false}'                 > "/tmp/s01-release/meta/$key-create-release.json"
              curl -fsSL -X POST                 -H "Authorization: Bearer $WRITE_TOKEN"                 -H "Accept: application/vnd.github+json"                 -H "Content-Type: application/json"                 "https://api.github.com/repos/$repo/releases"                 --data-binary @"/tmp/s01-release/meta/$key-create-release.json"                 > "/tmp/s01-release/meta/$key-release.json"
            elif [ "$rel_code" != "200" ]; then
              cat "/tmp/s01-release/meta/$key-release.json"
              exit 1
            fi

            test "$(jq -r '.tag_name' "/tmp/s01-release/meta/$key-release.json")" = "$tag"
            upload_url="$(jq -r '.upload_url' "/tmp/s01-release/meta/$key-release.json" | sed 's/{?name,label}//')"
            release_id="$(jq -r '.id' "/tmp/s01-release/meta/$key-release.json")"

            curl -fsSL               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/releases/$release_id/assets"               > "/tmp/s01-release/meta/$key-assets.json"
            asset_id="$(jq -r --arg name "$asset" '.[] | select(.name==$name) | .id' "/tmp/s01-release/meta/$key-assets.json" | head -n1)"
            if [ -z "$asset_id" ]; then
              curl -fsSL -X POST                 -H "Authorization: Bearer $WRITE_TOKEN"                 -H "Content-Type: application/zip"                 "$upload_url?name=$asset"                 --data-binary @"/tmp/s01-release/out/$asset"                 > "/tmp/s01-release/meta/$key-upload.json"
              asset_id="$(jq -r '.id' "/tmp/s01-release/meta/$key-upload.json")"
            fi
            test -n "$asset_id"

            curl -fsSL -L               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/octet-stream"               "https://api.github.com/repos/$repo/releases/assets/$asset_id"               -o "/tmp/s01-release/$key-remote.zip"

            local_size="$(jq -r '.asset_bytes' "$meta")"
            local_sha="$(jq -r '.asset_sha256' "$meta")"
            remote_size="$(stat -c%s "/tmp/s01-release/$key-remote.zip")"
            remote_sha="$(sha256sum "/tmp/s01-release/$key-remote.zip" | awk '{print $1}')"
            test "$remote_size" = "$local_size"
            test "$remote_sha" = "$local_sha"

            jq --argjson release_id "$release_id" --argjson asset_id "$asset_id"                --arg released_at "$(jq -r '.published_at // .created_at' "/tmp/s01-release/meta/$key-release.json")"                '. + {release_id:$release_id,asset_id:$asset_id,released_at:$released_at,remote_readback:"PASS"}'                "$meta" > "$meta.tmp"
            mv "$meta.tmp" "$meta"
            echo "$key RELEASE_REMOTE_READBACK=PASS"
          }

          release_one ops llhzx2018/vf-tools-ops 8c2fb1f4037f87d674a0cfc16a02805cf7b2f569 1.21.944             "VF Tools Ops" "vf-tools-ops_V1.21.944.zip"             "S01 Page Body Phase 4 Macro R1. UX/UI comparison page: 工作台 / 今日运营. Removes duplicate inner Page Head behavior and compacts first-screen context/status rhythm. Frozen Shell/Header/Header Menu IA unchanged. OWNER Production real-use remains required."

          release_one theme llhzx2018/vf-tools-theme 7fac7f5dcee3deb9c2fc4e8666adb3774f4bd202 1.35.46             "VF Tools Theme" "vf-tools-theme_V1.35.46.zip"             "S01 Page Body Phase 4 Macro R1. UX/UI comparison workspaces: 品牌与样式、页面布局、导航与页脚、技术 SEO. Primary A5 setting groups are flatter and less card-heavy; preview/context remains distinct. Frozen Shell/Header/Header Menu IA unchanged. OWNER Production real-use remains required."

          release_one m3u8 llhzx2018/vf-tools-m3u8 7ede1009c1c0a5c7a0b1d33f27fa6b7a655bc17c 1.25.49             "VF Tools M3U8" "vf-tools-m3u8_V1.25.49.zip"             "S01 Page Body Phase 4 Macro R1. UX/UI comparison page: 运行实验室 / Runtime Playground. Demotes protocol/session decoration and tightens selector-session-action-evidence hierarchy. Frozen Shell/Header/Header Menu IA unchanged. OWNER Production real-use remains required."

          echo "FORMAL_RELEASES=PASS"

      - name: Publish core-updates channel
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/s01-release/manifests

          update_manifest() {
            key="$1"; component="$2"; repo="$3"; source_sha="$4"; compare_pages="$5"; schema_from="$6"; schema_to="$7"
            meta="/tmp/s01-release/meta/$key.json"
            api="https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$component.json?ref=main"

            curl -fsSL               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/vnd.github+json"               "$api" > "/tmp/s01-release/meta/$key-manifest-source.json"
            blob_sha="$(jq -r '.sha' "/tmp/s01-release/meta/$key-manifest-source.json")"
            jq -r '.content' "/tmp/s01-release/meta/$key-manifest-source.json" | tr -d '\n' | base64 -d               > "/tmp/s01-release/manifests/$component.json"

            python3 -               "/tmp/s01-release/manifests/$component.json" "$meta" "$repo" "$source_sha" "$compare_pages" "$schema_from" "$schema_to" <<'PY'
          import json,sys
          from pathlib import Path
          manifest_path=Path(sys.argv[1])
          meta_path=Path(sys.argv[2])
          repo=sys.argv[3]
          source_sha=sys.argv[4]
          compare_pages=sys.argv[5]
          schema_from=sys.argv[6]
          schema_to=sys.argv[7]
          d=json.loads(manifest_path.read_text())
          m=json.loads(meta_path.read_text())
          old=str(d.get("target_version","")).strip()
          fv=[str(x) for x in d.get("from_versions",[])]
          if old and old != m["version"] and old not in fv:
              fv.append(old)
          d["target_version"]=m["version"]
          d["from_versions"]=fv
          d["repository"]=repo
          d["release_tag"]="v"+m["version"]
          d["asset_name"]=m["asset_name"]
          d["asset_bytes"]=m["asset_bytes"]
          d["asset_sha256"]=m["asset_sha256"]
          d["schema_from"]=schema_from
          d["schema_to"]=schema_to
          d["backup_required"]=True
          d["rollback_supported"]=True
          d["runtime_contract"]="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1"
          d["runtime_files"]=m["runtime_files"]
          d["runtime_fingerprint"]=m["runtime_fingerprint"]
          if "runtime_file_count" in d:
              d["runtime_file_count"]=m["runtime_files"]
          if "runtime_fingerprint_sha256" in d:
              d["runtime_fingerprint_sha256"]=m["runtime_fingerprint"]
          d["released_at"]=m["released_at"]
          d["notes"]=(
              f"Phase 4 Macro R1 UI-only release. Exact source {source_sha}. "
              f"OWNER comparison surfaces: {compare_pages}. "
              f"Formal Release ID {m['release_id']}; asset ID {m['asset_id']}; "
              f"{m['asset_bytes']} bytes / SHA256 {m['asset_sha256']}. "
              f"Runtime Authority: {m['runtime_files']} files / {m['runtime_fingerprint']}. "
              "Frozen Shell / Header / Header Menu IA unchanged. "
              "Production remains OWNER manual; post-Production real-use is required before Macro Freeze."
          )
          manifest_path.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
          PY

            encoded="$(base64 -w0 "/tmp/s01-release/manifests/$component.json")"
            jq -n               --arg message "release($component): publish Phase 4 Macro R1"               --arg content "$encoded"               --arg sha "$blob_sha"               '{message:$message,content:$content,sha:$sha,branch:"main"}'               > "/tmp/s01-release/meta/$key-manifest-put.json"

            curl -fsSL -X PUT               -H "Authorization: Bearer $WRITE_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/json"               "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$component.json"               --data-binary @"/tmp/s01-release/meta/$key-manifest-put.json"               > "/tmp/s01-release/meta/$key-manifest-result.json"
            test "$(jq -r '.content.path' "/tmp/s01-release/meta/$key-manifest-result.json")" = "projects/$component.json"
            echo "$key CORE_UPDATES_WRITE=PASS"
          }

          update_manifest ops S01-C02 llhzx2018/vf-tools-ops 8c2fb1f4037f87d674a0cfc16a02805cf7b2f569             "OPS → 工作台 / 今日运营" "6.0.0" "6.0.0"
          update_manifest theme S01-C01 llhzx2018/vf-tools-theme 7fac7f5dcee3deb9c2fc4e8666adb3774f4bd202             "Theme → 品牌与样式、页面布局、导航与页脚、技术 SEO" "N/A" "N/A"
          update_manifest m3u8 S01-C03 llhzx2018/vf-tools-m3u8 7ede1009c1c0a5c7a0b1d33f27fa6b7a655bc17c             "M3U8 → 运行实验室 / Runtime Playground" "1.3.0" "1.3.0"

          echo "DISTRIBUTION_PUBLISH=PASS"

      - name: Remote discovery and authority closure
        shell: bash
        run: |
          set -Eeuo pipefail

          verify_component() {
            key="$1"; component="$2"; repo="$3"; sha="$4"; version="$5"; asset="$6"
            meta="/tmp/s01-release/meta/$key.json"

            main_sha="$(curl -fsSL               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/branches/main" | jq -r '.commit.sha')"
            test "$main_sha" = "$sha"

            rel="$(curl -fsSL               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$repo/releases/tags/v$version")"
            test "$(printf '%s' "$rel" | jq -r '.tag_name')" = "v$version"
            release_id="$(printf '%s' "$rel" | jq -r '.id')"
            remote_asset="$(printf '%s' "$rel" | jq -r --arg name "$asset" '.assets[] | select(.name==$name) | .id' | head -n1)"
            test -n "$remote_asset"
            test "$release_id" = "$(jq -r '.release_id' "$meta")"
            test "$remote_asset" = "$(jq -r '.asset_id' "$meta")"

            manifest_json="$(curl -fsSL               -H "Authorization: Bearer $READ_TOKEN"               -H "Accept: application/vnd.github.raw+json"               "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$component.json?ref=main")"
            test "$(printf '%s' "$manifest_json" | jq -r '.target_version')" = "$version"
            test "$(printf '%s' "$manifest_json" | jq -r '.release_tag')" = "v$version"
            test "$(printf '%s' "$manifest_json" | jq -r '.asset_name')" = "$asset"
            test "$(printf '%s' "$manifest_json" | jq -r '.asset_sha256')" = "$(jq -r '.asset_sha256' "$meta")"
            test "$(printf '%s' "$manifest_json" | jq -r '.asset_bytes')" = "$(jq -r '.asset_bytes' "$meta")"
            test "$(printf '%s' "$manifest_json" | jq -r '.runtime_files')" = "$(jq -r '.runtime_files' "$meta")"
            test "$(printf '%s' "$manifest_json" | jq -r '.runtime_fingerprint')" = "$(jq -r '.runtime_fingerprint' "$meta")"

            echo "$key REMOTE_READBACK=PASS"
          }

          verify_component ops S01-C02 llhzx2018/vf-tools-ops 8c2fb1f4037f87d674a0cfc16a02805cf7b2f569             1.21.944 vf-tools-ops_V1.21.944.zip
          verify_component theme S01-C01 llhzx2018/vf-tools-theme 7fac7f5dcee3deb9c2fc4e8666adb3774f4bd202             1.35.46 vf-tools-theme_V1.35.46.zip
          verify_component m3u8 S01-C03 llhzx2018/vf-tools-m3u8 7ede1009c1c0a5c7a0b1d33f27fa6b7a655bc17c             1.25.49 vf-tools-m3u8_V1.25.49.zip

          echo "PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS"
          echo "NO_REQUIRED_GATE_MISSING=YES"
          echo "NO_UNKNOWN_APPLICABILITY=YES"
          echo "NO_INVALID_DYNAMIC_SNAPSHOT=YES"
          echo "NO_HISTORICAL_STATE_AS_CURRENT=YES"
          echo "NO_DUPLICATE_CURRENT_TRUTH=YES"
          echo "DISTRIBUTION_STATE_CANONICAL=YES"
          echo "PRODUCTION_STATE_CANONICAL=YES"
          echo "README_NOT_RUNTIME_AUTHORITY=YES"
