name: P01 R21 Prototype Density Gate R2

on:
  pull_request:
    paths:
      - '.github/workflows/p01-r21-prototype-density-gate-r2.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'temp/p01-r21-prototype-density-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 4a5d2a4ddccdfb0e3ea70d62af83c7a664563fb5
      CANDIDATE_SHA: 7a7a3a2d6c63002899ff8815ea2af685cbcc2955
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact authority and bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/work/p01-r21-prototype-density-20260910" --jq '.object.sha')" = "$CANDIDATE_SHA"
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/compare/${BASE_SHA}...${CANDIDATE_SHA}" --jq '.files[].filename' | sort >/tmp/r21-files
          printf '%s\n' src/assets/prototype-density.css src/assets/workspace-domain-nav-base.css src/assets/workspace-domain-nav.css tests/unit/prototype_density_contract.php | sort >/tmp/r21-expected
          diff -u /tmp/r21-expected /tmp/r21-files
          echo P01_R21_EXACT_BOUNDED_SOURCE=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Contract and stable-shell preservation
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l tests/unit/prototype_density_contract.php
          php tests/unit/prototype_density_contract.php | tee /tmp/r21-contract
          grep -Fx 'P01_R21_PROTOTYPE_DENSITY_CONTRACT=PASS' /tmp/r21-contract
          LOCAL_HASH=$(sha256sum src/assets/workspace-domain-nav-base.css | awk '{print $1}')
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/contents/src/assets/workspace-domain-nav.css?ref=${BASE_SHA}" --jq '.content' | tr -d '\n' | base64 -d >/tmp/r21-base.css
          test "$LOCAL_HASH" = "$(sha256sum /tmp/r21-base.css | awk '{print $1}')"
          echo P01_R21_STABLE_SHELL_PRESERVED=PASS

      - name: Fresh install runtime
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-r21-runtime
          rm -rf "$RUNTIME"
          cp -a src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18121 -t . >/tmp/p01-r21-server.log 2>&1 &
          echo $! >/tmp/p01-r21-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies http://127.0.0.1:18121/setup.php -o /tmp/p01-r21-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r21-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}R21x"
          curl -fsS -c /tmp/p01-r21.cookies -b /tmp/p01-r21.cookies -X POST http://127.0.0.1:18121/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start R21 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-r21-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-r21-verify
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-r21-verify
          for p in start.php channels.php watch.php topics.php courses.php projects.php tools.php software.php; do test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18121/$p")" = 200; done
          echo P01_R21_FRESH_RUNTIME=PASS

      - name: Chromium density geometry
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-r21-pw && cd /tmp/p01-r21-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='http://127.0.0.1:18121/';
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const overflow=()=>page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
          await page.goto(base+'start.php',{waitUntil:'networkidle'});
          const nav=await page.evaluate(()=>{const s=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage');const r=document.createElement('article');r.className='vf-asset-row';r.innerHTML='<span class="vf-asset-copy"><strong>Readable title</strong><small>domain · category</small></span>';document.querySelector('.vf-shell-main').append(r);return{side:getComputedStyle(s).display,sw:s.getBoundingClientRect().width,left:stage.getBoundingClientRect().left,rh:r.getBoundingClientRect().height,ts:parseFloat(getComputedStyle(r.querySelector('strong')).fontSize),ms:parseFloat(getComputedStyle(r.querySelector('small')).fontSize)}});
          if(nav.side==='none'||nav.sw<200||nav.left<200||nav.rh<54||nav.ts<13||nav.ms<11||await overflow()>1)throw new Error('Navigation '+JSON.stringify(nav));
          const cases=[
            ['watch.php','vf-watch-library-grid',6,'<article class="vf-watch-library-card"><div class="vf-watch-copy"><strong>Movie</strong><small>2026</small></div></article>','.vf-watch-copy strong',13],
            ['topics.php','vf-topic-library-grid',4,'<article class="vf-topic-library-card"><a class="vf-topic-library-cover"></a><div class="vf-topic-library-body"><h3>Topic</h3></div></article>','.vf-topic-library-body h3',14],
            ['courses.php','vf-course-grid',2,'<article class="vf-course-card"><a class="vf-course-cover"><span class="vf-course-cover-art"></span></a><div class="vf-course-card-body"><h3>Course</h3></div></article>','.vf-course-card h3',14],
            ['channels.php','vf-channel-grid',3,'<article class="vf-channel-card"><span class="vf-channel-avatar"></span><div class="vf-channel-copy"><h3>Channel</h3></div></article>','.vf-channel-copy h3',13.5],
            ['projects.php','vf-project-action-grid',2,'<article class="vf-project-action-card"><h3>Project</h3></article>','.vf-project-action-card h3',13.5],
            ['tools.php','vf-tool-scene-grid',4,'<a class="vf-tool-scene-card"><span class="vf-tool-scene-copy"><strong>Task scene</strong></span></a>','.vf-tool-scene-copy strong',13.5],
            ['software.php','vf-software-common-grid',6,'<a class="vf-software-common-card"><strong>App</strong></a>','.vf-software-common-card strong',12]
          ];
          const out={navigation:nav,subjects:{}};
          for(const [path,klass,want,html,sel,min] of cases){await page.goto(base+path,{waitUntil:'networkidle'});const r=await page.evaluate(({klass,html,sel})=>{const side=document.querySelector('.vf-app-sidebar'),stage=document.querySelector('.vf-app-stage'),main=document.querySelector('.vf-shell-main');const grid=document.createElement('div');grid.className=klass;grid.innerHTML=html.repeat(8);main.append(grid);const cs=getComputedStyle(grid);const text=grid.querySelector(sel);return{side:getComputedStyle(side).display,left:stage.getBoundingClientRect().left,mw:main.getBoundingClientRect().width,display:cs.display,cols:cs.gridTemplateColumns.split(' ').filter(Boolean).length,fs:text?parseFloat(getComputedStyle(text).fontSize):0}} ,{klass,html,sel});if(r.side!=='none'||Math.abs(r.left)>1||r.mw<1100||r.display!=='grid'||r.cols!==want||r.fs<min||await overflow()>1)throw new Error(path+' '+JSON.stringify(r));out.subjects[path]=r;}
          const mobile=await browser.newPage({viewport:{width:390,height:844}});for(const path of ['start.php','watch.php','topics.php','courses.php','channels.php','projects.php','tools.php','software.php']){await mobile.goto(base+path,{waitUntil:'networkidle'});const d=await mobile.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(d>1)throw new Error(path+' mobile overflow '+d)}
          console.log('P01_R21_BROWSER_GEOMETRY='+JSON.stringify(out));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-r21-browser
          grep -F 'P01_R21_BROWSER_GEOMETRY=' /tmp/p01-r21-browser
          echo P01_R21_CHROMIUM=PASS

      - name: Final verdict
        run: |
          echo P01_R21_PROTOTYPE_DENSITY=PASS
          echo DATA_SCHEMA_CHANGE=false
          echo UPDATER_CHANGE=false
          echo RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-r21-server.pid; then kill "$(cat /tmp/p01-r21-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-r21-*
