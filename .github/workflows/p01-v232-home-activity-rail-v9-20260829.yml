name: P01 V2.32 Home Activity Rail Gate V9
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-activity-rail-v9-20260829.yml
      - scripts/p01-v232-home-activity-rail-v9.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18642'
      ADMIN_PASS: 'P01V232!HomeGate'
      EVID: /tmp/p01-v232-home-evidence
      SOURCE: 6cbe6f05dc854f637f358dfac265f70bd85301c6
      SOURCE_TREE: 5d73608bd75a34f507e8625122ba65def6b80716
      BASE_SOURCE: f7c14b70dda991ac5fc8b25140eb558fd54009d6
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 6cbe6f05dc854f637f358dfac265f70bd85301c6
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Home activity rail authoritative machine and browser gate V9
        shell: bash
        run: bash runner/scripts/p01-v232-home-activity-rail-v9.sh
      - name: Upload V2.32 Home activity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v232-home-activity-v9-evidence-${{ github.run_id }}
          path: /tmp/p01-v232-home-evidence
          if-no-files-found: warn
          retention-days: 30
