name: P01 V2.25 Release Identity
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-release-identity-20260828.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      RELEASE_BRANCH: release/p01-v2.25.0-20260828
      EXACT_BASE: 19fc03dca150150e2bdedb34a49e145d8d9d03a0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify release base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_BASE"
          test "$(cat VERSION)" = '2.24.0'
          test "$(cat src/VERSION.txt)" = '2.24.0'
          grep -F "define('VF_VERSION', '2.24.0');" src/app/bootstrap.php >/dev/null
          grep -F '## V2.25.0 · Working Candidate · 2026-08-28' CHANGELOG.md >/dev/null
      - name: Prepare V2.25 formal identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2.25.0\n' > VERSION
          printf '2.25.0\n' > src/VERSION.txt
          sed -i "s/define('VF_VERSION', '2.24.0');/define('VF_VERSION', '2.25.0');/" src/app/bootstrap.php
          sed -i 's/## V2.25.0 · Working Candidate · 2026-08-28/## V2.25.0 · Formal Release · 2026-08-28/' CHANGELOG.md
          test "$(git diff --name-only | sort | paste -sd, -)" = 'CHANGELOG.md,VERSION,src/VERSION.txt,src/app/bootstrap.php'
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.25.0 identity'
          git push origin HEAD:"$RELEASE_BRANCH"
          echo "P01_V225_RELEASE_SOURCE=$(git rev-parse HEAD)"
          echo "P01_V225_RELEASE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Verdict
        run: |
          echo P01_V225_RELEASE_IDENTITY=PASS
          echo SCHEMA=2026082801
          echo PRODUCTION_WRITE=NO
