name: P04 V2.7.1 One Shell IA PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'p04-v271-trigger.txt'

permissions:
  contents: read

concurrency:
  group: p04-v271-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout P04 V2.7.1 working branch
        id: product
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: feature/v2.7.1-shell-ia-unification
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Lock product identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          HEAD=$(git rev-parse HEAD)
          test "$(tr -d '\r\n' < VERSION)" = '2.7.1'
          test -f public/assets/v271-unified-shell.js
          test -f public/assets/v271-unified-shell.css
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "P04_V271_TESTED_HEAD=$HEAD"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          npm install --no-save --silent playwright
          npx playwright install chromium >/dev/null

      - name: Run V2.7.1 owner-task one-shell gate
        shell: bash
        env:
          VF_V271_TESTED_RUNTIME_COMMIT: ${{ steps.identity.outputs.head }}
          VF_V271_EVIDENCE_DIR: ${{ github.workspace }}/evidence-v271
        run: |
          set -Eeuo pipefail
          cd product
          bash scripts/run-v271-shell-unification-gate.sh

      - name: Upload V2.7.1 browser / pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.1-ONE-SHELL-IA-GATE
          path: evidence-v271/
          if-no-files-found: error
          retention-days: 30
