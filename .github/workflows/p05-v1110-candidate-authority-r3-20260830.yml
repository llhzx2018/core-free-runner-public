name: P05 V1.1.10 Candidate Authority R3

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BRANCH: fix/p05-runtime-pointer-v1110-20260830
      P05_EXPECTED_HEAD: efe061fb3d1de9eb702c59b2a775971f98c0cf6f
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P05
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05
      - name: Verify starting source
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXPECTED_HEAD"
          test "$(cat VERSION)" = '1.1.10'
          node -e "const p=require('./package.json'); if(p.version!=='1.1.10') process.exit(1)"
          grep -Fq 'Mechanism Public Runner: 33316433128 · PASS' README.md
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Generate deterministic candidate authority
        working-directory: p05
        run: |
          set -euo pipefail
          npm version 1.1.10 --no-git-tag-version --allow-same-version
          python3 ../scripts/p05_v1110_candidate_freeze.py
      - name: Verify full mutation scope
        working-directory: p05
        run: |
          set -euo pipefail
          { git diff --name-only "$P05_EXPECTED_HEAD" --; git ls-files --others --exclude-standard; } | sort -u | tee /tmp/changed
          cat >/tmp/expected <<'EOF'
          CHANGELOG.md
          VF_PROJECT.json
          docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md
          docs/authority/RELEASE_V1.1.10_CANDIDATE.md
          docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md
          docs/handoff/CURRENT_STATE.md
          package-lock.json
          php/README.md
          EOF
          sort -o /tmp/expected /tmp/expected
          cmp /tmp/expected /tmp/changed
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          if(p.version!=='1.1.10'||l.version!=='1.1.10'||l.packages[''].version!=='1.1.10') process.exit(1);
          NODE
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['version']==d['target_version']==d['working_version']=='1.1.10'
          assert d['formal_release']=='v1.1.9'
          x=d['v1_1_10_runtime_pointer_install_fix']
          assert x['pointer_created']=='AFTER_SUCCESSFUL_SETUP_ONLY'
          assert x['fresh_install_uses_home'] is False
          assert x['fresh_install_uses_environment_storage_paths'] is False
          assert d['production_deployment']=='NOT_DEPLOYED' and d['production_write']==0
          PY
      - name: Commit complete V1.1.10 candidate authority
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VF_PROJECT.json package-lock.json docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md docs/authority/RELEASE_V1.1.10_CANDIDATE.md docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md docs/handoff/CURRENT_STATE.md php/README.md
          git commit -m 'release(P05): freeze V1.1.10 candidate authority'
          git push origin HEAD:"$P05_BRANCH"
          echo "P05_V1110_CANDIDATE_SOURCE=$(git rev-parse HEAD)"
      - name: Receipt
        run: |
          echo 'P05_V1110_CANDIDATE_AUTHORITY_R3=PASS'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
