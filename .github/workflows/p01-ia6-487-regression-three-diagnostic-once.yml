name: P01 IA6 exact regression 3 failures diagnostics (test-only)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-487-regression-three-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  classify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_SHA: 389b27ca662acd51509a24d404a252ad380397b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install PHP SQLite in disposable runner
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip >/dev/null
      - name: Checkout exact private candidate transiently
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          live="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" refs/heads/feat/ia-v6-frontstage-admin-parity-system-jobs-r1 | awk '{print $1}')"
          test "$live" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
      - name: Classify exact existing canonical failures without changing test outcomes
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in p01_local_management_r2_contract transfer_scope_shortlink_return_native transfer_six_domain_roundtrip_native; do
            set +e
            output="$(php "candidate/tests/unit/$name.php" 2>&1)"
            status=$?
            set -e
            echo "P01_487_DIAGNOSTIC=$name EXIT=$status"
            printf '%s\n' "$output" | tail -n 12
            test "$status" -ne 0
          done
          echo P01_487_THREE_FAILED_TESTS_CLASSIFIED=YES
      - name: Cleanup private candidate
        if: always()
        run: rm -rf candidate
