name: P07 R3 private recovery evidence exact-source synthetic proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-private-recovery-r3.yml'
      - 'experiments/p07-private-recovery/**'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify public candidate source blob hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release111"
          test "$(git hash-object experiments/p07-private-recovery/lib/server_migration_pull.py)" = 35529f1414a08c295d632a344405cc7058a5e8ae
          test "$(git hash-object experiments/p07-private-recovery/lib/migration_remainder.py)" = 36c4166d5b06c0ef2491d60ae9c5ed134352d351
          test "$(git hash-object experiments/p07-private-recovery/lib/private_recovery_gate.py)" = f28aedfba4caf1788d7e6266a809141601228025
          test "$(git hash-object experiments/p07-private-recovery/tests/test_private_recovery_gate.py)" = 47bf70e75587c7816918bc60a8156f7e4fdcbaea
          test "$(git hash-object experiments/p07-private-recovery/tests/test_migration_remainder.py)" = 179736d53c790b204af859ac027cc09f61cc1c67
          test "$(git hash-object experiments/p07-private-recovery/bin/vfops)" = 15fc770ac9d17ad727df2ea15732006d3566ee3a
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-recovery-r3"
          for p in lib/server_migration_pull.py lib/migration_remainder.py lib/private_recovery_gate.py tests/test_private_recovery_gate.py tests/test_migration_remainder.py bin/vfops; do
            cp "experiments/p07-private-recovery/$p" "$RUNNER_TEMP/p07-recovery-r3/$p"
          done
          chmod +x "$RUNNER_TEMP/p07-recovery-r3/bin/"*
          echo P07_RECOVERY_R3_EXACT_BYTES_PASS
      - name: Compile and test strict non-write entry
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-recovery-r3"
          python3 -m py_compile lib/private_recovery_gate.py lib/server_migration_pull.py lib/migration_remainder.py tests/test_private_recovery_gate.py tests/test_migration_remainder.py
          bash -n bin/vfops
          PYTHONPATH=lib python3 -m unittest -v tests.test_private_recovery_gate tests.test_migration_remainder
          echo P07_RECOVERY_R3_PRIVATE_SYNTHETIC_GATE_PASS
      - name: Original migration, SQL and backup regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-recovery-r3"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull \
            tests.test_migration_conflict_recovery \
            tests.test_sql_pk_conflict_evidence \
            tests.test_sql_diff_evidence \
            tests.test_verify
          echo P07_RECOVERY_R3_ORIGINAL_REGRESSIONS_PASS
      - name: Baseline restore and database clients unmodified
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-recovery-r3"
          for path in lib/cloudpanel.py lib/restore_apply_core.py lib/verify.py lib/package_core.py lib/server_migration.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$path")" = "$(git hash-object "$path")"
          done
          echo P07_RECOVERY_R3_NO_DB_WRITER_CHANGE_PASS
