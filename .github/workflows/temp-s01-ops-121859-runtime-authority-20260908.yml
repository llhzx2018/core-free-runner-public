name: temp-s01-ops-121859-runtime-authority-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121859-runtime-authority-20260908.yml
permissions:
  contents: read
jobs:
  runtime-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.859
      ASSET: vf-tools-ops_V1.21.859.zip
      EXPECTED_SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      EXPECTED_BYTES: '3362261'
      EXPECTED_ASSET_SHA256: 2e4e0c1f74723b5ac5a634aba1833b4827f1f3f261f2de6ef2c72625fc2891df
      EXPECTED_RUNTIME_FILES: '934'
      EXPECTED_RUNTIME_FP: 1b3056d4127919c2156be9f7fbb57f9b5e5c98e3458e216398db1b0a44a3ab34
    steps:
      - name: Verify exact delivered runtime authority
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RUNTIME_AUTHORITY_MODE=DELIVERED_RELEASE_READ_ONLY PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          test "$(gh api repos/$REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$EXPECTED_SHA"
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '.draft')" = false
          test "$(gh api repos/$REPO/releases/tags/$TAG --jq '.prerelease')" = false
          rm -rf "$RUNNER_TEMP/ops-runtime" && mkdir -p "$RUNNER_TEMP/ops-runtime"
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/ops-runtime"
          test "$(stat -c %s "$RUNNER_TEMP/ops-runtime/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/ops-runtime/$ASSET" | awk '{print $1}')" = "$EXPECTED_ASSET_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, os
          p=Path(os.environ['RUNNER_TEMP'])/'ops-runtime'/os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              names=sorted(n for n in z.namelist() if not n.endswith('/'))
              assert z.testzip() is None
              assert len(names)==int(os.environ['EXPECTED_RUNTIME_FILES'])
              assert all(n.startswith('vf-ops/') for n in names)
              assert set(n.split('/')[1] for n in names)=={'assets','includes','uninstall.php','vf-ops.php'}
              assert 'vf-ops/VERSION' not in names
              assert not any(n.startswith('vf-ops/tests/') for n in names)
              rows=[]
              for n in names:
                  rel=n[len('vf-ops/'):]
                  rows.append((rel,z.read(n)))
              runtime=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in rows).encode()
              fp=hashlib.sha256(runtime).hexdigest()
              assert fp==os.environ['EXPECTED_RUNTIME_FP'], (fp, os.environ['EXPECTED_RUNTIME_FP'])
              assert b'Version: 1.21.859' in z.read('vf-ops/vf-ops.php')
              assert b'S01-DEFAULT-WORKBENCH-VISIBLE-UI-CLOSURE' in z.read('vf-ops/vf-ops.php')
          print('RUNTIME_FILES='+os.environ['EXPECTED_RUNTIME_FILES'])
          print('RUNTIME_FP='+os.environ['EXPECTED_RUNTIME_FP'])
          print('PASS_S01_C02_121859_DELIVERED_RUNTIME_AUTHORITY')
          PY
