name: P05 Runtime Pointer Mechanism Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P05_EXACT_SOURCE: 3f811ce4f96108fbf6efff3cb7047b193cdd6eb4
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 3f811ce4f96108fbf6efff3cb7047b193cdd6eb4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05

      - name: Verify exact source
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test ! -e VF_INSTALL_INSTANCE.json
          test ! -e .vf-seo-site-instance.json
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Static and PHP syntax gates
        working-directory: p05
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run typecheck
          php -l php/src/SiteInstance.php
          php -l php/src/RuntimePaths.php
          php -l php/src/Config.php
          php -l php/src/Installer.php
          php -l php/src/setup-bootstrap.php
          php -l php/src/bootstrap.php
          test ! -e php/src/FreshInstallRecovery.php
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh

      - name: Build clean formal FULL staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-installing.lock
          test -z "$(find build/vf-seo-php-release -name '*.sqlite*' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' -print -quit)"
          find build/vf-seo-php-release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/staging-before.sha

      - name: Browser install pointer-last smoke
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh

      - name: Real full-delete reinstall with dirty state
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh

      - name: Real Chrome E2E on isolated copy
        working-directory: p05
        run: |
          set -euo pipefail
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py

      - name: Prove formal staging remained byte-identical
        working-directory: p05
        run: |
          set -euo pipefail
          find build/vf-seo-php-release -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/staging-after.sha
          cmp /tmp/staging-before.sha /tmp/staging-after.sha
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          test ! -e build/vf-seo-php-release/.vf-seo-installing.lock
          test -z "$(find build/vf-seo-php-release -name '*.sqlite*' -o -name 'runtime.env' -o -name 'setup.lock.json' -o -name '.vfseo-data-*' -print -quit)"

      - name: Machine receipt
        run: |
          echo 'P05_RUNTIME_POINTER_MECHANISM=PASS'
          echo 'POINTER_ABSENT_MEANS_FRESH=PASS'
          echo 'POINTER_CREATED_AFTER_SUCCESS_ONLY=PASS'
          echo 'FULL_DELETE_REINSTALL_WITH_DIRTY_PRIVATE_STATE=PASS'
          echo 'POISONED_HOME_ENV_SQLITE_IGNORED=PASS'
          echo 'RANDOM_SIBLING_PRIVATE_STORAGE=PASS'
          echo 'OLD_PRIVATE_DATA_PRESERVED=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'FORMAL_STAGING_IMMUTABLE=PASS'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
