name: P01 V2.32.0 Candidate Docs Finalization
on:
  push:
    branches: [task/p01-v2320-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2320-finalize-candidate-docs-20260830.yml
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout V2.32 candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.32.0-candidate-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Finalize docs-bound candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 8b4f3483579bf2d286c551c1f33e876e4e7aec16
          test "$(git rev-parse HEAD^{tree})" = 8e693bda3a16ad1e0952314858227ffbffd59897
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          python3 ../runner/scripts/p01-v2320-finalize-candidate-docs.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --name-only | sort > /tmp/p01-v2320-final-docs-actual.txt
          printf '%s\n' \
            VF_PROJECT.json \
            docs/authority/CURRENT.md \
            docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md \
            docs/handoff/CURRENT_STATE.md | sort > /tmp/p01-v2320-final-docs-expected.txt
          diff -u /tmp/p01-v2320-final-docs-expected.txt /tmp/p01-v2320-final-docs-actual.txt
          test -z "$(git diff --name-only -- src)"
          test "$(jq -r .candidate_state VF_PROJECT.json)" = READY_FOR_L3_RELEASE_GATE
          test "$(jq -r .current_change.gates.candidate_readiness VF_PROJECT.json)" = 33263475338
          grep -F 'PASS / READY_FOR_L3_RELEASE_GATE' docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md >/dev/null
          grep -F 'Unified Candidate Gate: 33263475338 PASS' docs/authority/CURRENT.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): finalize V2.32.0 candidate readiness'
          git push origin HEAD:release/p01-v2.32.0-candidate-20260830
          echo "FINAL_CANDIDATE_SOURCE=$(git rev-parse HEAD)"
          echo "FINAL_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo 'VERSION=2.32.0'
          echo 'SCHEMA=2026082901'
          echo 'OWNER_PRODUCTION_WRITE=NO'
          echo 'RELEASE=NO'
