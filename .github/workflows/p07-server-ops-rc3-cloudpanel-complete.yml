name: P07 Server Ops RC3 CloudPanel Foundation Complete

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_*.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_ui_complete.py'
      - 'dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-server-ops-rc3-cloudpanel-complete.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_ui_*.sh'
      - 'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_ui_complete.py'
      - 'dist/p07/0.1.0-rc3/tests/test_site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_real_db_compat.py'
      - 'installers/p07-rc3-admin-simple.sh'
      - 'installers/p07-rc3-nav-flat.sh'
      - 'installers/p07.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-server-ops-rc3-cloudpanel-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudpanel-complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build guided-init14 combined runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-cloudpanel-complete
          mkdir -p /tmp/p07-cloudpanel-complete
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-cloudpanel-complete/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-cloudpanel-complete/
          mkdir -p /tmp/p07-cloudpanel-complete/tests
          for test in \
            test_cloudpanel.py \
            test_cloudpanel_site.py \
            test_cloudpanel_integration.py \
            test_cloudpanel_ui_complete.py \
            test_site_lifecycle.py \
            test_menu3_modular.py \
            test_restore_as.py \
            test_restore_as_verified.py \
            test_restore_as_real_db_compat.py \
            test_restore_as_machine_e2e.py; do
            cp "dist/p07/0.1.0-rc3/tests/$test" /tmp/p07-cloudpanel-complete/tests/
          done
          test "$(cat /tmp/p07-cloudpanel-complete/BUILD_ID)" = '0.1.0-rc3-guided-init14'

      - name: Exact source identity
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/p07-cloudpanel-complete/BUILD_ID)" = '1e07e5b18f89058da04cd2dddaf8e7f7414bb6d2'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/bin/vfops-user)" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui)" = '5b0fa75d6951586c82404e361b88ab5e10661212'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_common.sh)" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/tests/test_site_lifecycle.py)" = '2edb3b76e2f2a044afa7fba0f274ef0e54c644b0'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_sites.sh)" = 'dc1458efb9a669185b07171f7748959711ac59de'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_ops.sh)" = '4eeedb7facfe709583476e3b84ebce00d0a8ab03'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_admin.sh)" = 'eeae6b514b27e15e20ea596f5cd363e7779e461b'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/tests/test_cloudpanel_ui_complete.py)" = '007a4b6893b2e5b4955d5e2ca8c297bf2976b214'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/tests/test_menu3_modular.py)" = '5ebd94d717a62c551b8397ed9a56b852c5992f0d'
          test "$(git hash-object /tmp/p07-cloudpanel-complete/tests/test_restore_as_real_db_compat.py)" = '250b2613dc98dd5d14bf0ac4b5c0918966219789'

      - name: Shell syntax and complete UX gate
        run: |
          set -euo pipefail
          bash -n /tmp/p07-cloudpanel-complete/bin/vfops-user
          bash -n /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          for script in /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_*.sh; do bash -n "$script"; done
          cd /tmp/p07-cloudpanel-complete
          python3 tests/test_cloudpanel_ui_complete.py -v
          python3 tests/test_menu3_modular.py -v

      - name: CloudPanel adapter and lifecycle regression
        env:
          PYTHONPATH: /tmp/p07-cloudpanel-complete/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-cloudpanel-complete
          python3 tests/test_cloudpanel.py -v
          python3 tests/test_cloudpanel_site.py -v
          python3 tests/test_cloudpanel_integration.py -v
          python3 tests/test_site_lifecycle.py -v

      - name: Restore-As and Real R1 DB regression remains green
        env:
          PYTHONPATH: /tmp/p07-cloudpanel-complete/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-cloudpanel-complete
          python3 tests/test_restore_as.py -v
          python3 tests/test_restore_as_verified.py -v
          python3 tests/test_restore_as_real_db_compat.py -v
          python3 tests/test_restore_as_machine_e2e.py -v

      - name: Ordinary-user safety invariants
        run: |
          set -euo pipefail
          bundle="$(cat /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_*.sh)"
          for marker in '网站管理' '当前网站：' '数据库清单' '新增数据库' 'SSL 状态' '修复网站权限' '清理 Varnish 缓存' 'CloudPanel 管理' 'CloudPanel 安全' 'CloudPanel 用户' 'Vhost Templates（高级）' '平台基础能力检查'; do
            grep -Fq "$marker" <<<"$bundle"
          done
          grep -Fq '98. 更换网站' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq '0. 返回 P07 主菜单' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq '6. 网站管理' /tmp/p07-cloudpanel-complete/bin/vfops-user
          grep -Fq '7. CloudPanel 管理' /tmp/p07-cloudpanel-complete/bin/vfops-user
          printf '0\n' | bash /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui admin > /tmp/p07-admin.txt
          grep -Fq '4. 平台基础能力检查' /tmp/p07-admin.txt
          ! grep -Fq 'Vhost 模板' /tmp/p07-admin.txt
          grep -Fq 'Vhost 模板由 CloudPanel / P07 自动处理' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq '模板名不能为空。' /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_admin.sh
          grep -Fq '模板来源不能为空。' /tmp/p07-cloudpanel-complete/lib/cloudpanel_ui_admin.sh
          for forbidden in 'site:delete' 'db:delete' 'user:delete' 'cloudpanel.delete_site' 'cloudpanel.delete_database' 'cloudpanel.delete_panel_user' 'REAL_PASS'; do
            ! grep -Fq "$forbidden" <<<"$bundle"
          done
          ! grep -Eiq '\b(update_dns|write_dns|set_dns|delete_dns)\b' <<<"$bundle"
          grep -Fq 'read -r -s' <<<"$bundle"
          grep -Fq 'P07_SECRET="$SECRET_VALUE"' <<<"$bundle"
          grep -Fq 'TARGET 已存在，P07 不会覆盖' <<<"$bundle"
          grep -Fq -- '--resolve "$domain:80:127.0.0.1"' <<<"$bundle"
          grep -Fq -- '--resolve "$domain:443:127.0.0.1"' <<<"$bundle"
          grep -Fq '不自动修改 DNS' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq '不删除 SOURCE' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq '不覆盖已有 TARGET' /tmp/p07-cloudpanel-complete/bin/vfops-cloudpanel-ui
          grep -Fq 'database = cloudpanel.validate_name(f"p07{token}{index}"' /tmp/p07-cloudpanel-complete/lib/site_lifecycle.py
          ! grep -Fq 'p07_{token}' /tmp/p07-cloudpanel-complete/lib/site_lifecycle.py

      - name: Stable installer upgrades to guided-init14
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          public_root="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF_SHA}"
          sudo env P07_PUBLIC_ROOT="$public_root" P07_NO_EXEC=1 bash installers/p07.sh | tee /tmp/p07-init14-install.txt
          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC3'
          test "$(vfops --build-id)" = '0.1.0-rc3-guided-init14'
          test "$(git hash-object /opt/vf-server-ops/bin/vfops-user)" = '1028b939ecd4c52377c846ab8e12ff136667981c'
          test "$(git hash-object /opt/vf-server-ops/bin/vfops-cloudpanel-ui)" = '5b0fa75d6951586c82404e361b88ab5e10661212'
          test "$(git hash-object /opt/vf-server-ops/lib/cloudpanel_ui_common.sh)" = 'b591cd9b7e1ab9e715cf60cd702fee44f448e7ff'
          test "$(git hash-object /opt/vf-server-ops/lib/cloudpanel_ui_admin.sh)" = 'eeae6b514b27e15e20ea596f5cd363e7779e461b'
          test "$(git hash-object /opt/vf-server-ops/lib/site_lifecycle.py)" = '3e84dfa74b4df8413c3228322b8dc1c22d901761'
          test "$(git hash-object /opt/vf-server-ops/lib/restore_as_verified.py)" = 'c0df2750e0cb79e16bf46cad88e85cacacfc2415'

      - name: Same build reuses exact installation
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          public_root="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF_SHA}"
          before="$(git hash-object /opt/vf-server-ops/bin/vfops-cloudpanel-ui)"
          sudo env P07_PUBLIC_ROOT="$public_root" P07_NO_EXEC=1 bash installers/p07.sh | tee /tmp/p07-init14-reuse.txt
          after="$(git hash-object /opt/vf-server-ops/bin/vfops-cloudpanel-ui)"
          test "$before" = "$after"
          grep -Fq 'guided-init14 已是当前版本' /tmp/p07-init14-reuse.txt

      - name: Toolbox identity and System Care boundary
        run: |
          set -euo pipefail
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-rc3-guided-init14"' installers/p07-toolbox.sh
          grep -Fq 'CloudPanel 备份 / 恢复 / 迁移' installers/p07-toolbox.sh
          grep -Fq '测试中' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq '系统维护 / 安全' installers/p07-toolbox.sh
          grep -Fq '可用' installers/p07-toolbox.sh

      - name: Result
        run: echo 'P07_RC3_CLOUDPANEL_FOUNDATION_COMPLETE_MACHINE=PASS'
