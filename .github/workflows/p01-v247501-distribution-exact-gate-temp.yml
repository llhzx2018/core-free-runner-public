name: p01-v247501-distribution-pr-exact-gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247501-distribution-exact-gate-temp.yml'
permissions:
  contents: read
jobs:
  distribution-501-exact-source-and-manifest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHANNEL_SHA: a2b8b34b27addf4b7e2ad3e7bf5e40d6765ee135
      CHANNEL_BASE: 9ad945990330c7f2d360de321dc7f02e6cc88d0a
      WORK: /tmp/p01-v247501-dist-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect exact distribution PR source and official GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$WORK/release"
          test "$(git ls-remote https://github.com/llhzx2018/core-updates.git refs/heads/release/p01-v247501-channel-20261107 | awk '{print $1}')" = "$CHANNEL_SHA"
          git clone -q --no-checkout https://github.com/llhzx2018/core-updates.git "$WORK/channel"
          git -C "$WORK/channel" fetch -q --depth 2 origin "$CHANNEL_SHA"
          git -C "$WORK/channel" checkout -q --detach "$CHANNEL_SHA"
          test "$(git -C "$WORK/channel" rev-parse HEAD^)" = "$CHANNEL_BASE"
          test "$(git -C "$WORK/channel" diff --name-only HEAD^ HEAD)" = projects/P01.json
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.501 --jq .object.sha)" = 11d2fe8554fb45c3365c771ab686343207dcde81
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.501 --jq .id)" = 437504679
          gh release download v2.47.501 -R llhzx2018/vf-start -D "$WORK/release" \
            -p VF-Start-V2.47.501-FULL.zip -p VF_Start_V2.47.501_UPDATE.zip
          printf '%s  %s\n' \
            387d48f9d94d479b71ffff4c28bef703a5c8ceed95f5ebee9498603006b75b5c "$WORK/release/VF-Start-V2.47.501-FULL.zip" \
            658faa9c1e30b10ae7932f04a68f50a777e23a2115e0fd3d602c66ad64e02fa8 "$WORK/release/VF_Start_V2.47.501_UPDATE.zip" | sha256sum -c -
          echo P01_V501_DISTRIBUTION_ONEFILE_EXACT_RELEASE_SHA=PASS
      - name: Run core-updates own required Manifest, PHP contract and unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/channel"
          python3 scripts/check_manifest_contract.py >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_V501_CORE_UPDATES_SAME_NATIVE_TESTS=PASS
      - name: Verify single source, schema unchanged and actual official ZIP bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$WORK/channel/projects/P01.json" "$WORK/release" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          root=pathlib.Path(sys.argv[2])
          assert m['project_id']=='P01' and m['component_id']=='APP' and m['enabled'] is True
          assert m['current_version']=='2.47.500' and m['target_version']=='2.47.501'
          assert m['from_versions']==['2.47.500'] and m['update_type']=='ATOMIC'
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['repository']=='llhzx2018/vf-start' and m['release_tag']=='v2.47.501'
          assert m['product_identity']=='11d2fe8554fb45c3365c771ab686343207dcde81'
          assert m['release_id']==437504679 and m['backup_required'] and m['rollback_supported']
          assert m['asset_name']=='VF_Start_V2.47.501_UPDATE.zip'
          update=(root/m['asset_name']).read_bytes()
          assert len(update)==m['asset_bytes']==3788274
          assert hashlib.sha256(update).hexdigest()==m['asset_sha256']=='658faa9c1e30b10ae7932f04a68f50a777e23a2115e0fd3d602c66ad64e02fa8'
          with zipfile.ZipFile(root/m['asset_name']) as z:
              assert z.namelist()==['repair-v2.47.501.php']
          print('P01_V501_CHANNEL_SINGLE_500_ATOMIC_EXACT_REAL_RELEASE_BYTES=PASS')
          PY
      - name: Cleanup ephemeral source and metadata
        if: always()
        shell: bash
        run: |
          echo P01_V501_PRODUCTION_WRITE=NONE
          echo P01_V501_PRIVATE_ARTIFACT=NONE
          case "$WORK" in /tmp/p01-v247501-dist-*) rm -rf -- "$WORK";; *) exit 88;; esac
