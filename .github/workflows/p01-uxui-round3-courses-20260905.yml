name: P01 UXUI Round3 Courses

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round3-courses-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 7e1bd9609f350aacf7055babe943c6d5b16a5f5f
      BASE_SHA: d1ac0b223fd989b5e337b1dd98b02300f0539d79
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round3-courses-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 8
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
          ! grep -Fq 'surface.php' src/courses.php
          grep -Fq "require __DIR__ . '/courses.php';" src/books.php
      - name: Syntax and Round 3 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/courses.php src/books.php src/app/SubjectPageChrome.php src/app/CourseLibraryPage.php tests/unit/course_experience_source_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/consolidated_product_acceptance_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round3_course_identity_contract.php
          php tests/unit/course_experience_source_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Course Books and product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          matched=0
          for f in tests/unit/*course*.php tests/unit/*book*.php; do
            [ -f "$f" ] || continue
            echo "RUN $f"
            php "$f"
            matched=$((matched+1))
          done
          echo "course/books contracts run: $matched"
          for f in tests/unit/consolidated_product_acceptance_contract.php tests/unit/consolidated_product_model_contract.php tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php; do
            [ -f "$f" ] && php "$f"
          done
      - name: Static learning-library assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'VfCourseLibraryPage::render()' src/courses.php
          grep -Fq '学习资料库' src/app/CourseLibraryPage.php
          grep -Fq '继续学习' src/app/CourseLibraryPage.php
          grep -Fq 'vf-course-state:v1:' src/assets/course-experience.js
          grep -Fq 'grid-template-columns:repeat(3,minmax(0,1fr))' src/assets/course-experience.css
          grep -Fq '@media(max-width:650px)' src/assets/course-experience.css
          ! grep -Fq 'overflow-x:auto' src/assets/course-experience.css
          ! grep -Fq '.vf-book-card' src/assets/course-experience.js
          ! grep -Fq 'Math.round' src/assets/course-experience.js
          ! grep -Fq '%' src/assets/course-experience.js
          echo P01_UXUI_ROUND3_COURSES=PASS
