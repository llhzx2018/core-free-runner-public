name: P01 V247351 Interactive Owner Preview (Temporary / No Release)
# A Draft PR can be opened and reviewed without launching a provider.
# Only an explicit Owner-authorized transition from Draft -> Ready may deploy.
on:
  pull_request:
    types: [ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/p01-v247351-interactive-owner-preview.yml'
permissions:
  contents: read
  issues: write
jobs:
  preview-evidence:
    if: github.event.action == 'ready_for_review' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'preview/p01-v247351-owner-interactive-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact product main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 23f1b838f66d41fec8534e1bb69f900e8c784ead
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Prepare PHP and browser
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Install disposable site with mock administrator
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 23f1b838f66d41fec8534e1bb69f900e8c784ead
          test "$(tr -d '\r\n' < product/VERSION)" = '2.47.351'
          mkdir -p /tmp/p01-v247351-preview
          python3 -c 'import secrets; print("OwnerPreview!"+secrets.token_urlsafe(20))' >/tmp/p01-v247351-preview/login-password
          chmod 600 /tmp/p01-v247351-preview/login-password
          php -S 127.0.0.1:18541 -t product/src >/tmp/p01-preview-php.log 2>&1 &
          echo $! >/tmp/p01-v247351-preview/server.pid
          for n in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-preview-cookie -b /tmp/p01-preview-cookie 'http://127.0.0.1:18541/setup.php' -o /tmp/p01-preview-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-preview-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m,'setup CSRF not available'
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-preview-cookie -b /tmp/p01-preview-cookie -X POST 'http://127.0.0.1:18541/setup.php' \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=VF Start Isolated Preview' \
            --data-urlencode "admin_password=$(cat /tmp/p01-v247351-preview/login-password)" \
            --data-urlencode "admin_password_confirm=$(cat /tmp/p01-v247351-preview/login-password)" >/tmp/p01-preview-setup-response.html
          (cd product/src && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_PREVIEW_DISPOSABLE_INSTALL=PASS
      - name: Create four entirely fictional backup states
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-preview-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('GITHUB_WORKSPACE').'/product/src/app/bootstrap.php';
          $db=vf_db();
          vf_prepare_private_dirs();
          $dir=VF_BACKUP_DIR;
          $safe=$dir.'/fixture-present-protected.sqlite';
          $db->exec("VACUUM INTO '".str_replace("'","''",$safe)."'");
          $alias=$dir.'/fixture-linked-protected.sqlite';
          if(!symlink($safe,$alias))throw new RuntimeException('Fixture symlink failed');
          $unprotected=$dir.'/fixture-present-unprotected.sqlite';
          if(!copy($safe,$unprotected))throw new RuntimeException('Fixture copy failed');
          $now=gmdate('c');
          $add=$db->prepare('INSERT INTO backup_records(backup_key,file_name,reason,backup_type,source_version,byte_size,sha256,integrity_status,foreign_key_errors,validation_status,validation_error,object_summary,is_protected,created_at,verified_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
          $fixtures=[
            ['fixture-present-unprotected','fixture-present-unprotected.sqlite',0,$unprotected],
            ['fixture-present-protected','fixture-present-protected.sqlite',1,$safe],
            ['fixture-linked-protected','fixture-linked-protected.sqlite',1,$alias],
            ['fixture-missing-protected','fixture-missing-protected.sqlite',1,null],
          ];
          foreach($fixtures as [$key,$file,$protected,$path]){
            $size=$path?filesize($path):8192;
            $sha=$path?hash_file('sha256',$path):str_repeat('1',64);
            $add->execute([$key,$file,'ISOLATED FAKE DATA','snapshot','2.47.351',
              $size,$sha,'ok',0,'valid','','{"categories":1,"links":1}',
              $protected,$now,$now]);
          }
          echo "P01_PREVIEW_ONLY_SYNTHETIC_BACKUPS=PASS\n";
          PHP
          php /tmp/p01-preview-seed.php
          echo P01_PREVIEW_NO_PRODUCTION_ASSETS=PASS
      - name: Prepare synthetic weekly backup verification with early failures and healthy last batch
        shell: bash
        env:
          VF_ISOLATED_TEST_ONLY: '1'
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v247351-weekly-preview.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=realpath((string)getenv('GITHUB_WORKSPACE').'/product/src');
          if(getenv('VF_ISOLATED_TEST_ONLY')!=='1'||$root===false)throw new RuntimeException('isolated only');
          require_once $root.'/app/bootstrap.php';
          if(VF_VERSION!=='2.47.351'||!str_starts_with(realpath(VF_PRIVATE_ROOT)?:'', $root.'/'))throw new RuntimeException('unsafe runtime');
          $db=vf_db();
          $manager=new VfBackupManager($db);
          $insert=$db->prepare('INSERT INTO backup_records(backup_key,file_name,reason,backup_type,source_version,byte_size,sha256,integrity_status,foreign_key_errors,validation_status,validation_error,object_summary,is_protected,created_at,verified_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)');
          for($i=0;$i<14;$i++){
              $key='fixture-weekly-missing-'.str_pad((string)$i,2,'0',STR_PAD_LEFT);
              $insert->execute([$key,$key.'.sqlite','ISOLATED WEEKLY AUDIT','automatic','2.47.351',1234,
                  str_repeat('2',64),'ok',0,'valid','','{"links":1}',1,gmdate('c'),gmdate('c')]);
          }
          // Valid real SQLite is last: a healthy final batch must not hide old failures.
          $safe=$manager->create('ISOLATED FINAL GOOD SNAPSHOT','automatic',true);
          $schedule=$db->query("SELECT schedule_key FROM job_schedules WHERE owner='core' AND job_type='backup_verify' LIMIT 1")->fetchColumn();
          if(!$schedule)throw new RuntimeException('scheduled backup verification unavailable');
          $db->prepare('UPDATE job_schedules SET enabled=1,next_run_at=? WHERE schedule_key=?')->execute([gmdate('c',time()-60),$schedule]);
          $jobs=new VfJobManager($db);
          if($jobs->enqueueDueSchedules()<1)throw new RuntimeException('missing due enqueue');
          $q=$db->prepare("SELECT id FROM background_jobs WHERE owner='core' AND job_type='backup_verify' AND idempotency_key LIKE ? ORDER BY id DESC LIMIT 1");
          $q->execute(['schedule:'.$schedule.':%']);
          $id=(int)$q->fetchColumn();
          if($id<=0)throw new RuntimeException('missing scheduled audit job');
          $last=null;$chunks=0;
          do {
              $last=$jobs->workSpecific($id,'p01-isolated-v247351-preview',4);
              $chunks++;
              if($chunks>12)throw new RuntimeException('audit stalled');
          } while(($last['state']??'')==='queued');
          if(($last['state']??'')!=='failed'||(int)$last['failure_count']<14
            ||(int)$last['processed']<19||$chunks<5)
            throw new RuntimeException('bounded audit falsely green, incomplete, or unbounded: '.json_encode($last));
          if(!is_file(VF_BACKUP_DIR.'/'.basename($safe['file_name'])))
            throw new RuntimeException('final good backup missing');
          $protected=(int)$db->query("SELECT COUNT(*) FROM backup_records WHERE is_protected=1")->fetchColumn();
          if($protected<17)throw new RuntimeException('protected history was altered');
          echo 'P01_V247351_WEEKLY_BATCHED_AUDIT_FAILURE_VISIBLE=PASS'.PHP_EOL;
          echo 'P01_V247351_WEEKLY_AUDIT_SIMULATION_PRODUCTION_NOT_TOUCHED=PASS'.PHP_EOL;
          PHP
          php /tmp/p01-v247351-weekly-preview.php
      - name: Install isolated browser harness
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null
          test -n "$(fc-match -f '%{family}' ':lang=zh-cn')"
          python3 -m pip install --quiet --break-system-packages 'playwright==1.55.0'
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1; then
            python3 -m playwright install chromium
          fi
      - name: Render current product page and prove safe actions
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-preview-browser.py <<'PY'
          import json, pathlib, shutil
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:18541/'
          out=pathlib.Path('/tmp/p01-v247351-preview')
          out.mkdir(exist_ok=True)
          with sync_playwright() as pw:
              browser_path=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
              browser=pw.chromium.launch(executable_path=browser_path,headless=True,args=['--no-sandbox'])
              context=browser.new_context(viewport={'width':1440,'height':1040},device_scale_factor=1)
              response=context.request.post(base+'api.php?action=login',data={'password':pathlib.Path('/tmp/p01-v247351-preview/login-password').read_text().strip()})
              assert response.ok and response.json().get('ok'), 'Disposable preview admin login failed'
              page=context.new_page()
              page.goto(base+'data-safety.php',wait_until='domcontentloaded')
              page.locator('[data-protect="fixture-missing-protected"]').wait_for(state='attached',timeout=15000)
              page.locator('details.vf-data-row-more').first.locator('summary').click()
              states={}
              for key in ['fixture-missing-protected','fixture-linked-protected','fixture-present-protected','fixture-present-unprotected']:
                  button=page.locator('[data-protect="'+key+'"]')
                  states[key]={'disabled':button.is_disabled(),'text':button.inner_text()}
              assert states['fixture-missing-protected']['disabled'],states
              assert states['fixture-linked-protected']['disabled'],states
              assert not states['fixture-present-protected']['disabled'],states
              assert not states['fixture-present-unprotected']['disabled'],states
              page.screenshot(path=str(out/'V247351_BACKUP_PROTECTION_ISOLATED_PREVIEW.png'),full_page=True)
              page.goto(base+'jobs.php',wait_until='domcontentloaded')
              page.get_by_text('最近执行：失败',exact=False).first.wait_for(timeout=25000)
              assert '备份' in page.locator('body').inner_text(), 'Weekly backup task not rendered'
              page.screenshot(path=str(out/'V247351_WEEKLY_BACKUP_BATCH_RESULT.png'),full_page=True)
              (out/'PREVIEW_STATUS.json').write_text(json.dumps({
                  'product_version':'2.47.351','source_sha':'23f1b838f66d41fec8534e1bb69f900e8c784ead',
                  'environment':'isolated runner disposable SQLite with synthetic records only',
                  'safe_actions':states,'owner_preview_runtime':'NOT_PROVEN',
                  'owner_real_use':'NOT_PROVEN','production':'NOT_TOUCHED'
              },indent=2,ensure_ascii=False),encoding='utf-8')
              browser.close()
          print('P01_247351_REAL_BROWSER_ISOLATED_PREVIEW=PASS')
          PY
          python3 /tmp/p01-preview-browser.py
      - name: Start ephemeral password-protected HTTPS preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-preview-basic-proxy.py <<'PY'
          import base64, hmac, http.client, pathlib
          from urllib.parse import urlsplit, unquote
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          secret=pathlib.Path('/tmp/p01-v247351-preview/login-password').read_text().strip()
          expected='Basic '+base64.b64encode(('preview:'+secret).encode()).decode()
          class Proxy(BaseHTTPRequestHandler):
              def log_message(self,*args): pass
              def do_GET(self): self.forward()
              def do_POST(self): self.forward()
              def do_HEAD(self): self.forward()
              def do_OPTIONS(self): self.forward()
              def forward(self):
                  if not hmac.compare_digest(self.headers.get('Authorization',''),expected):
                      self.send_response(401)
                      self.send_header('WWW-Authenticate','Basic realm="VF Start isolated mock preview"')
                      self.send_header('Cache-Control','no-store')
                      self.end_headers()
                      return
                  # PHP's development server lacks Production Nginx deny rules.
                  # Expose only the disposable application's public entrypoints/assets.
                  path=unquote(unquote(urlsplit(self.path).path)).replace('\\','/')
                  parts=[part.lower() for part in path.split('/') if part]
                  blocked={'app','cli','deploy','migrations','plugins','.git','.github'}
                  unsafe=(any(part in blocked or part.startswith('.vfnav-data')
                              or part.startswith('.') or part=='..' for part in parts)
                          or path.lower().endswith(('.md','.txt','.json','.yml','.yaml',
                                                     '.sql','.sqlite','.db','.bak','.zip')))
                  if unsafe:
                      self.send_response(404)
                      self.send_header('Cache-Control','no-store')
                      self.end_headers()
                      return
                  raw_length=self.headers.get('Content-Length','0')
                  if not raw_length.isdecimal() or int(raw_length)>1048576:
                      self.send_response(413)
                      self.end_headers()
                      return
                  length=int(raw_length)
                  payload=self.rfile.read(length) if length else None
                  headers={k:v for k,v in self.headers.items()
                           if k.lower() not in ('authorization','host','connection','accept-encoding',
                           'transfer-encoding','content-length','x-forwarded-for','x-forwarded-proto')}
                  headers['Host']='127.0.0.1:18541'
                  headers['X-Forwarded-Proto']='https'
                  try:
                      c=http.client.HTTPConnection('127.0.0.1',18541,timeout=25)
                      c.request(self.command,self.path,body=payload,headers=headers)
                      response=c.getresponse()
                      data=response.read()
                      self.send_response(response.status)
                      for k,v in response.getheaders():
                          if k.lower() in ('connection','transfer-encoding','content-length','server','date'):
                              continue
                          self.send_header(k,v)
                      self.send_header('Content-Length',str(len(data)))
                      self.send_header('Cache-Control','no-store')
                      self.send_header('X-Robots-Tag','noindex, nofollow, noarchive')
                      self.send_header('X-Content-Type-Options','nosniff')
                      self.end_headers()
                      if self.command!='HEAD':self.wfile.write(data)
                      c.close()
                  except Exception:
                      self.send_response(502)
                      self.send_header('Content-Length','0')
                      self.end_headers()
          ThreadingHTTPServer(('127.0.0.1',18542),Proxy).serve_forever()
          PY
          nohup python3 /tmp/p01-preview-basic-proxy.py >/tmp/p01-preview-proxy.log 2>&1 &
          echo $! >/tmp/p01-v247351-preview/proxy.pid
          for n in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18542/data-safety.php || true)
            if [[ "$code" == "401" ]]; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18542/data-safety.php)" = "401"
          for unsafe in '/app/bootstrap.php' '/migrations/' '/VERSION.txt' '/.gitignore' '/%2e%76%66%6e%61%76-data-private/'; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --user "preview:$(cat /tmp/p01-v247351-preview/login-password)" "http://127.0.0.1:18542$unsafe")"
            test "$code" = "404"
          done
          echo P01_PREVIEW_DEV_SERVER_PRIVATE_PATHS_DENIED=PASS
          curl --fail --silent --show-error -L --user "preview:$(cat /tmp/p01-v247351-preview/login-password)" \
            -o /tmp/p01-preview-auth-response.html http://127.0.0.1:18542/login.php
          test -s /tmp/p01-preview-auth-response.html
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/p01-cloudflared
          chmod 700 /tmp/p01-cloudflared
          nohup /tmp/p01-cloudflared tunnel --url http://127.0.0.1:18542 --no-autoupdate \
            >/tmp/p01-preview-cloudflared.log 2>&1 &
          echo $! >/tmp/p01-v247351-preview/tunnel.pid
          url=''
          for n in $(seq 1 90); do
            url="$(grep -oE 'https://[a-z0-9-]+[.]trycloudflare[.]com' \
              /tmp/p01-preview-cloudflared.log | head -1 || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$url" ]]; then
            echo "PREVIEW_TUNNEL_START_FAILED"
            tail -35 /tmp/p01-preview-cloudflared.log
            exit 4
          fi
          echo "$url" >/tmp/p01-v247351-preview/preview-url
          # Quick Tunnel is public HTTPS; locally require an ephemeral Basic-auth secret
          # and then the disposable VF Start admin password. NO real user assets.
          for n in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url/login.php" || true)"
            [[ "$code" == "401" ]] && break
            sleep 2
          done
          test "$code" = "401"
          curl --fail --silent --show-error --location --max-time 30 \
            --user "preview:$(cat /tmp/p01-v247351-preview/login-password)" \
            -o /tmp/p01-preview-remote-response.html "$url/login.php"
          test -s /tmp/p01-preview-remote-response.html
          echo "P01_OWNER_PREVIEW_HTTPS_BASIC_AUTH=PASS"
          # Encrypt the short-lived credentials to the current operator's one-off
          # public key before recording anything in the PUBLIC Runner PR.
          cat >/tmp/p01-preview-operator-public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqoVWRHHK4ZJATc1Hpcmx
WbrYATTYenUxxn4UYrgY58csCyrj4J+6fjBvuEuL+u0tWOny8BseEuf/0nF9g2nG
O4mYIlGLeBcH71M/rEgEMb2Qjq1F4SInXE4ZnATp77rrJYqBDX/RnU86bhU5uUC5
tAKLVUAOGnYNrkYzaI5RKistj6xCv3Mus6TeH2c+5F9Om9rLAV3O/+Vd6VuEvYkZ
SIIsg0RXlpyg+i1GMPaLjOD4ccZHK/dwW0JtHIzxoLECPwlRBcPT61EeHhkhnXal
ybZ9XN2QxC1XXUr7LoLGPUdW0UCOWejRYW76kZCCMn2TaO0jY8gWUvr/B+wwkBWW
jHFZ5wYuUKyPzGmoHcMx2+N6U4LKeOtuIapWnV+7dJwCwJEbkUabH9tuwbBDfAQ0
JSNoNQfzpBp8rEJKpToTP3efYParAbdxhzv63R/Rzagld2ETBbLzbZbKejaFzI4X
1d5UV+UysqPSTfF/RAU6bouTXy9KS1bJLZUHGvsh0G3PAgMBAAE=
-----END PUBLIC KEY-----
          PEM
          chmod 600 /tmp/p01-preview-operator-public.pem
          openssl pkey -pubin -in /tmp/p01-preview-operator-public.pem -noout >/dev/null
          ciphertext="$(printf '%s\n%s' "$url/data-safety.php" "$(cat /tmp/p01-v247351-preview/login-password)" \
            | openssl pkeyutl -encrypt -pubin -inkey /tmp/p01-preview-operator-public.pem \
              -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          comment_id="$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PREVIEW_PR_NUMBER/comments" \
            -f body="P01_247351_TEMPORARY_PREVIEW_ENCRYPTED=$ciphertext (RSA-OAEP-SHA256). Synthetic data only. Runtime expires in 45 min." \
            --jq '.id')"
          echo "$comment_id" >/tmp/p01-v247351-preview/comment-id
          echo "P01_OWNER_PREVIEW_ENCRYPTED_COMMENT_ID=$comment_id"
          echo "P01_OWNER_PREVIEW_URL_AND_LOGIN_SHARED_PRIVATELY=READY"
      - name: Keep disposable preview live for Owner review
        shell: bash
        timeout-minutes: 50
        run: |
          set -Eeuo pipefail
          echo "P01_OWNER_PREVIEW_TEMPORARY_RUNTIME=ACTIVE"
          echo "P01_OWNER_PREVIEW_EXPIRES_AFTER=45_MINUTES"
          for n in $(seq 1 270); do
            kill -0 "$(cat /tmp/p01-v247351-preview/server.pid)"
            kill -0 "$(cat /tmp/p01-v247351-preview/proxy.pid)"
            kill -0 "$(cat /tmp/p01-v247351-preview/tunnel.pid)"
            sleep 10
          done
          echo "P01_OWNER_PREVIEW_TEMPORARY_RUNTIME=EXPIRED"
      - name: Redact temporary access after review window
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if test -s /tmp/p01-v247351-preview/comment-id; then
            comment_id="$(cat /tmp/p01-v247351-preview/comment-id)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body='P01 V2.47.351 temporary preview expired; credentials redacted. No Production data used.'
          fi
          for role in tunnel proxy server; do
            f="/tmp/p01-v247351-preview/$role.pid"
            if test -s "$f"; then kill "$(cat "$f")" 2>/dev/null || true; fi
          done
          echo 'P01_OWNER_PREVIEW_EXPIRED_AND_REDACTED=PASS'
      - name: Preserve only sanitized screenshot and status
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P01-V247351-Isolated-Preview-Evidence
          path: |
            /tmp/p01-v247351-preview/V247351_BACKUP_PROTECTION_ISOLATED_PREVIEW.png
            /tmp/p01-v247351-preview/V247351_WEEKLY_BACKUP_BATCH_RESULT.png
            /tmp/p01-v247351-preview/PREVIEW_STATUS.json
          if-no-files-found: error
          retention-days: 7
