name: P07 original18 real native engines temporary proof
on:
  push:
    branches:
      - task/p07-original18-native-real-20261112
permissions:
  contents: read
concurrency:
  group: p07-original18-real-engines-20261112
  cancel-in-progress: false
jobs:
  real-engine-isolated:
    if: false # real engine already passed; this commit only fixes unit fixture
    # Owner release144 failure needs fresh exact-source safety proof.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P07_EXACT_SHA: 7c35d9707c05e8a4ee2b47255f23eb74612f4e55
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-synthetic-disposable-only-20261112
    steps:
      - name: Transient checkout exact private product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7c35d9707c05e8a4ee2b47255f23eb74612f4e55
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify source and build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release144"
          python3 -B -m compileall -q product/lib product/tests/test_p07_original_db_restore_real_mariadb.py product/tests/test_p07_original_18_native_mysql84_to_mariadb118.py
          echo P07_REAL_ENGINE_EXACT_SOURCE=PASS
      - name: Prepare disposable independent MySQL84 and MariaDB118 engines
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mysql:8.4
          docker pull mariadb:11.8
          docker run --rm -d --name p07-real-target-maria118 --network bridge -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then
              echo P07_DISPOSABLE_MARIADB118_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Run real four-target scratch restore with native SQL readback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_drill tests.test_p07_original_db_protection tests.test_p07_original_18_protected_preparation)
          echo P07_ORIGINAL18_OWNER_FAILURE_GUARDS=PASS
          echo P07_REAL_TARGET_FOUR_DATABASES_RESTORED=PASS
      - name: Run real isolated MySQL84 to MariaDB118 native shadow/rollback tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_CROSS_ENGINE_NATIVE_SHADOW_ROLLBACK=PASS
          echo P07_ACTUAL_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Run release144 Owner Trial identity and tamper regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_owner_trial_singlefile)
          echo P07_TRIAL144_WRAPPER_REGRESSIONS=PASS
      - name: Checkout approved public immutable installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build actual release144 trial and inspect offline onefile
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-original18-real-trial"
          mkdir -p "$root/out" "$root/unpack"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" \
            --public-root "$PWD/public-base" \
            --product-sha "$P07_EXACT_SHA" \
            --trial-build 0.1.0-release144 \
            --output-dir "$root/out" > "$root/build.log"
          grep -Fxq 'P07_OWNER_PACKAGE_CREATED=YES' "$root/build.log"
          grep -Fxq 'P07_OWNER_PACKAGE_BUILD=0.1.0-release144' "$root/build.log"
          (cd "$root/out" && sha256sum -c p07-release144-rc144-owner-test.tar.gz.sha256)
          tar -xzf "$root/out/p07-release144-rc144-owner-test.tar.gz" -C "$root/unpack"
          python3 -B product/scripts/p07_owner_trial_singlefile.py \
            --candidate-dir "$root/unpack/candidate" \
            --product-sha "$P07_EXACT_SHA" \
            --output "$root/p07-original18-owner-trial144.sh" > "$root/singlefile.log"
          bash -n "$root/p07-original18-owner-trial144.sh"
          bash "$root/p07-original18-owner-trial144.sh" --inspect > "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_PACKAGE_INTEGRITY=PASS' "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_VPS_WRITES=NONE' "$root/inspect.log"
          echo P07_TRIAL144_REAL_OFFLINE_PACKAGE_INSPECT=PASS
          echo P07_TRIAL144_PREBUILT_FORMAL_RELEASE=NO
          echo P07_TRIAL144_OWNER_VPS_INSTALL=NOT_RUN
      - name: Always remove disposable DB and temporary private source
        if: always()
        shell: bash
        run: |
          docker rm -f p07-real-target-maria118 >/dev/null 2>&1 || true
          rm -rf -- product public-base "$RUNNER_TEMP/p07-original18-real-trial"
          echo P07_REAL_ENGINE_CLEANUP=YES

  trial144-structural-and-publication:
    if: false # already published exact release144; do not republish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      P07_EXACT_SHA: 7c35d9707c05e8a4ee2b47255f23eb74612f4e55
      PUBLIC_SHA: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
      GOV_SHA: 33b222f642ff18dd52a1ac7887443d91833edbb2
      TRIAL_TAG: p07-v0.1.0-release144-owner-trial
      TRIAL_FILE: p07-original18-rc144-039a86-owner-trial.sh
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify no previous release target is occupied
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if gh release view "$TRIAL_TAG" --repo llhzx2018/core-free-runner-public >/dev/null 2>&1; then
            echo P07_TRIAL144_TAG_ALREADY_EXISTS_NO_OVERWRITE
            exit 13
          fi
      - name: Transient checkout exact P07 code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 039a86e91c2ecce4eafe9b9a72901336756eead2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Checkout immutable original installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Checkout actual shared Authority structural gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 33b222f642ff18dd52a1ac7887443d91833edbb2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov
      - name: Rebuild clean release144 self-extracting candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C public-base rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release144"
          root="$RUNNER_TEMP/p07-structural-144"
          mkdir -p "$root/out" "$root/unpack"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" --public-root "$PWD/public-base" \
            --product-sha "$P07_EXACT_SHA" \
            --trial-build 0.1.0-release144 --output-dir "$root/out" > "$root/build.log"
          grep -Fxq 'P07_OWNER_PACKAGE_CREATED=YES' "$root/build.log"
          (cd "$root/out" && sha256sum -c p07-release144-rc144-owner-test.tar.gz.sha256)
          tar -xzf "$root/out/p07-release144-rc144-owner-test.tar.gz" -C "$root/unpack"
          python3 -B product/scripts/p07_owner_trial_singlefile.py \
            --candidate-dir "$root/unpack/candidate" \
            --product-sha "$P07_EXACT_SHA" \
            --output "$root/$TRIAL_FILE" > "$root/onefile.json"
          sha256sum "$root/$TRIAL_FILE" | tee "$root/$TRIAL_FILE.sha256"
          bash -n "$root/$TRIAL_FILE"
          bash "$root/$TRIAL_FILE" --inspect > "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_PACKAGE_INTEGRITY=PASS' "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_VPS_WRITES=NONE' "$root/inspect.log"
          echo P07_TRIAL144_EXACT_BUILD_INSPECT=PASS
      - name: Public Authority exact artifact structural contract
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-structural-144"
          export P07_RECEIPT="$root/delivery-receipt.json"
          export P07_FINAL_ARTIFACT="$root/$TRIAL_FILE"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          artifact=Path(os.environ["P07_FINAL_ARTIFACT"])
          doc={
              "schema":"vf.public-authority.task-delivery-check.v1",
              "project":"P07",
              "source":os.environ["P07_EXACT_SHA"],
              "task_id":"pull-20261109T082020Z-7cca03ae",
              "project_authority":{
                  "agents":"AGENTS.md",
                  "current":"docs/authority/CURRENT.md",
                  "acceptance":"docs/authority/RPD.md",
                  "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md",
                  "task_lock":"docs/authority/P07_ACTIVE_TASK_LOCK.json",
              },
              "acceptance_markers":["原18站迁移 · 执行链收口验收合同"],
              "task_capabilities":["installer","candidate","migration","rollback","database","scheduler","source_change","installer_ui","audit_log"],
              "required_domains":["INSTALL","UPGRADE","SECURITY","TESTING","DATA_SCHEMA","CRON_JOB","OBSERVABILITY","GIT","UA_UI"],
              "delivery":{
                  "profile":"cli_one_command",
                  "entrypoint":artifact.name,
                  "artifact":artifact.name,
                  "sha256":hashlib.sha256(artifact.read_bytes()).hexdigest(),
                  "requires_git":False,
                  "requires_manual_source_copy":False,
              },
          }
          Path(os.environ["P07_RECEIPT"]).write_text(json.dumps(doc,sort_keys=True))
          PY
          python3 -B gov/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery \
            --receipt "$P07_RECEIPT" \
            --project-root "$PWD/product" \
            --artifact-root "$root" \
            --public-router "$PWD/gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json"
          echo P07_TRIAL144_STRUCTURAL_DELIVERY=PASS
      - name: Publish ONLY nonformal Owner Trial executable after gated verification
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-structural-144"
          test -f "$root/$TRIAL_FILE"
          if gh release view "$TRIAL_TAG" --repo llhzx2018/core-free-runner-public >/dev/null 2>&1; then
            echo P07_TRIAL144_OCCUPIED_REFUSE_REPUBLISH
            exit 14
          fi
          gh release create "$TRIAL_TAG" \
            "$root/$TRIAL_FILE" "$root/$TRIAL_FILE.sha256" \
            --repo llhzx2018/core-free-runner-public \
            --prerelease --target "$GITHUB_SHA" \
            --title "P07 release144 — nonformal Owner Trial, original18 executor" \
            --notes "Optional OWNER-initiated install test only. Exact P07 source: 039a86e91c2ecce4eafe9b9a72901336756eead2; public installer baseline e5f0bf042110284d21c8461393cbb3b5b0ed02cc; isolated synthetic 4-target restore and MySQL8.4 to MariaDB11.8 native checks PASS at run 43132509817. No automatic migration, source shutdown, CP2 existing-target overwrite, DNS, formal P07 release or core-updates publication. Original failed task stays protected until independently authorized manual action and actual CP2 proof."
          gh release view "$TRIAL_TAG" --repo llhzx2018/core-free-runner-public --json tagName,assets > "$root/release.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p07-structural-144/release.json"
          data=json.loads(p.read_text())
          expected=os.environ["TRIAL_FILE"]
          names={a.get("name") for a in data.get("assets", [])}
          if data.get("tagName") != os.environ["TRIAL_TAG"] or not {expected,expected+".sha256"}.issubset(names):
              raise SystemExit("P07_TRIAL144_RELEASE_ASSETS_UNVERIFIED")
          PY
          echo P07_TRIAL144_NONFORMAL_ASSETS_PUBLISHED=YES
          echo P07_TRIAL144_FORMAL_RELEASE=NO
          echo P07_TRIAL144_CP2_MIGRATION_EXECUTED=NO
      - name: Always purge transient private source and candidate
        if: always()
        shell: bash
        run: |
          rm -rf -- product public-base gov "$RUNNER_TEMP/p07-structural-144"
          echo P07_TRIAL144_PRIVATE_WORKSPACE_CLEANED=YES

  owner-recovery-focused-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      P07_EXACT_SHA: 8eea8d8112a559dacb9ffb5810e7d1615118abaa
    steps:
      - name: Transient exact private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8eea8d8112a559dacb9ffb5810e7d1615118abaa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Compile and execute original18 failed archive recovery regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          python3 -B -m py_compile product/lib/migration_native_existing_db_adoption.py product/lib/migration_original_db_restore_drill.py product/lib/migration_original_db_recovery_point.py product/tests/test_p07_original_db_restore_drill.py product/tests/test_p07_original_db_protection.py product/tests/test_p07_original_18_protected_preparation.py
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_drill tests.test_p07_original_db_protection tests.test_p07_original_18_protected_preparation)
          echo P07_OWNER_PREWRITE_ARCHIVE_GUARD_EXACT_SOURCE=PASS
          echo P07_OWNER_CP2_RESTORE=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Wipe transient private source
        if: always()
        run: |
          rm -rf -- product
          echo P07_PRIVATE_CHECKOUT_CLEANED=YES
