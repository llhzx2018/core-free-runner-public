name: P07 original18 real native engines temporary proof
on:
  push:
    branches:
      - task/p07-original18-native-real-20261112
permissions:
  contents: read
concurrency:
  group: p07-original18-real-engines-20261112
  cancel-in-progress: false
jobs:
  real-engine-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P07_EXACT_SHA: 039a86e91c2ecce4eafe9b9a72901336756eead2
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-synthetic-disposable-only-20261112
    steps:
      - name: Transient checkout exact private product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 039a86e91c2ecce4eafe9b9a72901336756eead2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify source and build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release144"
          python3 -B -m compileall -q product/lib product/tests/test_p07_original_db_restore_real_mariadb.py product/tests/test_p07_original_18_native_mysql84_to_mariadb118.py
          echo P07_REAL_ENGINE_EXACT_SOURCE=PASS
      - name: Prepare disposable independent MySQL84 and MariaDB118 engines
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mysql:8.4
          docker pull mariadb:11.8
          docker run --rm -d --name p07-real-target-maria118 --network bridge -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then
              echo P07_DISPOSABLE_MARIADB118_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Run real four-target scratch restore with native SQL readback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_REAL_TARGET_FOUR_DATABASES_RESTORED=PASS
      - name: Run real isolated MySQL84 to MariaDB118 native shadow/rollback tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_CROSS_ENGINE_NATIVE_SHADOW_ROLLBACK=PASS
          echo P07_ACTUAL_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Run release144 Owner Trial identity and tamper regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_owner_trial_singlefile)
          echo P07_TRIAL144_WRAPPER_REGRESSIONS=PASS
      - name: Checkout approved public immutable installer baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: e5f0bf042110284d21c8461393cbb3b5b0ed02cc
          persist-credentials: false
          fetch-depth: 1
          path: public-base
      - name: Build actual release144 trial and inspect offline onefile
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/p07-original18-real-trial"
          mkdir -p "$root/out" "$root/unpack"
          python3 -B product/scripts/p07-owner-prebuilt143-package.py \
            --product-root "$PWD/product" \
            --public-root "$PWD/public-base" \
            --product-sha "$P07_EXACT_SHA" \
            --trial-build 0.1.0-release144 \
            --output-dir "$root/out" > "$root/build.log"
          grep -Fxq 'P07_OWNER_PACKAGE_CREATED=YES' "$root/build.log"
          grep -Fxq 'P07_OWNER_PACKAGE_BUILD=0.1.0-release144' "$root/build.log"
          (cd "$root/out" && sha256sum -c p07-release144-rc144-owner-test.tar.gz.sha256)
          tar -xzf "$root/out/p07-release144-rc144-owner-test.tar.gz" -C "$root/unpack"
          python3 -B product/scripts/p07_owner_trial_singlefile.py \
            --candidate-dir "$root/unpack/candidate" \
            --product-sha "$P07_EXACT_SHA" \
            --output "$root/p07-original18-owner-trial144.sh" > "$root/singlefile.log"
          bash -n "$root/p07-original18-owner-trial144.sh"
          bash "$root/p07-original18-owner-trial144.sh" --inspect > "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_PACKAGE_INTEGRITY=PASS' "$root/inspect.log"
          grep -Fxq 'P07_TRIAL_VPS_WRITES=NONE' "$root/inspect.log"
          echo P07_TRIAL144_REAL_OFFLINE_PACKAGE_INSPECT=PASS
          echo P07_TRIAL144_PREBUILT_FORMAL_RELEASE=NO
          echo P07_TRIAL144_OWNER_VPS_INSTALL=NOT_RUN
      - name: Always remove disposable DB and temporary private source
        if: always()
        shell: bash
        run: |
          docker rm -f p07-real-target-maria118 >/dev/null 2>&1 || true
          rm -rf -- product public-base "$RUNNER_TEMP/p07-original18-real-trial"
          echo P07_REAL_ENGINE_CLEANUP=YES
