name: P07 original18 real native engines temporary proof
on:
  push:
    branches:
      - task/p07-original18-native-real-20261112
permissions:
  contents: read
concurrency:
  group: p07-original18-real-engines-20261112
  cancel-in-progress: false
jobs:
  real-engine-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P07_EXACT_SHA: 3a57531fe3c95d1dfdbc9d987cb4fac6b6fad2f2
      P07_SYNTHETIC_MARIADB: "1"
      P07_DB_TEST_HOST: 127.0.0.1
      P07_DB_TEST_PORT: "63306"
      P07_DB_TEST_PASSWORD: p07-synthetic-disposable-only-20261112
    steps:
      - name: Transient checkout exact private product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3a57531fe3c95d1dfdbc9d987cb4fac6b6fad2f2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Verify source and build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$P07_EXACT_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release143"
          python3 -B -m compileall -q product/lib product/tests/test_p07_original_db_restore_real_mariadb.py product/tests/test_p07_original_18_native_mysql84_to_mariadb118.py
          echo P07_REAL_ENGINE_EXACT_SOURCE=PASS
      - name: Prepare disposable independent MySQL84 and MariaDB118 engines
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client
          docker pull mysql:8.4
          docker pull mariadb:11.8
          docker run --rm -d --name p07-real-target-maria118 --network bridge -p 127.0.0.1:63306:3306 -e "MARIADB_ROOT_PASSWORD=$P07_DB_TEST_PASSWORD" mariadb:11.8 >/dev/null
          for i in $(seq 1 100); do
            if MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e "SELECT 1" >/dev/null 2>&1; then
              echo P07_DISPOSABLE_MARIADB118_READY=YES
              break
            fi
            sleep 2
          done
          test "$(MYSQL_PWD="$P07_DB_TEST_PASSWORD" mariadb --no-defaults -h 127.0.0.1 -P 63306 -uroot -N -e 'SELECT VERSION()' | cut -d. -f1-2)" = "11.8"
      - name: Run real four-target scratch restore with native SQL readback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_db_restore_real_mariadb)
          echo P07_REAL_TARGET_FOUR_DATABASES_RESTORED=PASS
      - name: Run real isolated MySQL84 to MariaDB118 native shadow/rollback tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_native_mysql84_to_mariadb118)
          echo P07_CROSS_ENGINE_NATIVE_SHADOW_ROLLBACK=PASS
          echo P07_ACTUAL_OWNER_CP2_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Always remove disposable DB and temporary private source
        if: always()
        shell: bash
        run: |
          docker rm -f p07-real-target-maria118 >/dev/null 2>&1 || true
          rm -rf -- product
          echo P07_REAL_ENGINE_CLEANUP=YES
