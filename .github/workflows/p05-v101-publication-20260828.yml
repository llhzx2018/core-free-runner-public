name: P05 V1.0.1 Publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v101-publication-20260828.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-seo
      VERIFIED_SOURCE: 00a724587c041130c0e81e0e45ef876413fb2916
      VERIFIED_TREE: 1f793ef58a14e766ceb2189226267497101a81fd
      MERGED_MAIN: 60cb19c38f3167bd007c6c99b06fe6654a93b201
      TAG: v1.0.1
      VERSION: 1.0.1
      SCHEMA: 1
      ARTIFACT_RUN: 33144311553
      ARTIFACT_ID: 9675163136
      EXPECTED_BYTES: 469642
      EXPECTED_SHA: ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c
    steps:
      - uses: actions/checkout@v4
      - name: Publish exact verified assets and FULL-only channel
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/p05-v101-publication"; rm -rf "$WORK"; mkdir -p "$WORK/artifact"

          # Gate publication against the already-merged exact release source.
          git clone "https://x-access-token:${TOKEN}@github.com/${PRODUCT_REPO}.git" "$WORK/product" >/dev/null 2>&1
          cd "$WORK/product"
          test "$(git rev-parse origin/main)" = "$MERGED_MAIN"
          test "$(git rev-parse "$VERIFIED_SOURCE^{tree}")" = "$VERIFIED_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '1.0.1'
          test "$(git show "$VERIFIED_SOURCE:VERSION" | tr -d '\r\n')" = '1.0.1'
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then echo TAG_ALREADY_EXISTS; exit 31; fi
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS; exit 32; fi

          # Download the exact machine-verified artifact; do not rebuild here.
          cd "$WORK/artifact"
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/llhzx2018/core-free-runner-public/actions/artifacts/${ARTIFACT_ID}/zip" > artifact.zip
          unzip -q artifact.zip
          ls -la
          test -f VF_SEO_V1.0.1_FULL.zip
          test -f VF_SEO_V1.0.1_UPDATE.zip
          test -f SHA256SUMS.txt
          test "$(stat -c '%s' VF_SEO_V1.0.1_FULL.zip)" = "$EXPECTED_BYTES"
          test "$(stat -c '%s' VF_SEO_V1.0.1_UPDATE.zip)" = "$EXPECTED_BYTES"
          test "$(sha256sum VF_SEO_V1.0.1_FULL.zip | awk '{print $1}')" = "$EXPECTED_SHA"
          test "$(sha256sum VF_SEO_V1.0.1_UPDATE.zip | awk '{print $1}')" = "$EXPECTED_SHA"
          (sha256sum -c SHA256SUMS.txt)

          # Create an exact lightweight tag at the machine-tested source.
          cd "$WORK/product"
          git tag "$TAG" "$VERIFIED_SOURCE"
          git push origin "refs/tags/$TAG"

          cat > "$WORK/release-notes.md" <<'EOF'
          # P05 · VF SEO V1.0.1

          Common Product Baseline V2 正式发布，并完成首次部署就绪验证。

          - Common Product Baseline V2：15 Domains，默认 SQLite Runtime = 14 PASS / 1 N_A / DRIFT 0 / UNKNOWN 0。
          - CloudPanel 首次安装器已与 PERSONAL_SINGLE_ADMIN V2 安全基线对齐。
          - 正式 FULL 包已在空白 Node 24 环境真实执行安装：SQLite Migration、管理员创建、PM2 Server + Worker、Health、重启与数据持久化全部 PASS。
          - Schema 1，不执行 Schema 升级。
          - 当前没有 P05 Production Server，因此 Production 状态保持 NOT_DEPLOYED；不得把 Release/Runner 验证冒充生产上线。
          - 历史 V1.0.0 不含当前在线 updater，所以本次不会声明 V1.0.0 → V1.0.1 在线升级支持。首次 Production 应使用 FULL 包安装。

          First-install Formal Gate: Run 33144311553 / Job 98761893522 = PASS.
          Final Exact Source Gate: Run 33144494055 / Job 98762452258 = PASS.
          EOF
          gh release create "$TAG" \
            "$WORK/artifact/VF_SEO_V1.0.1_FULL.zip" \
            "$WORK/artifact/VF_SEO_V1.0.1_UPDATE.zip" \
            "$WORK/artifact/SHA256SUMS.txt" \
            --repo "$PRODUCT_REPO" --title 'VF SEO V1.0.1' --notes-file "$WORK/release-notes.md" --verify-tag

          # Remote readback before changing the distribution manifest.
          REL_JSON="$WORK/release.json"
          gh api "/repos/${PRODUCT_REPO}/releases/tags/${TAG}" > "$REL_JSON"
          RELEASE_ID="$(jq -r '.id' "$REL_JSON")"
          FULL_ID="$(jq -r '.assets[]|select(.name=="VF_SEO_V1.0.1_FULL.zip")|.id' "$REL_JSON")"
          FULL_BYTES="$(jq -r '.assets[]|select(.name=="VF_SEO_V1.0.1_FULL.zip")|.size' "$REL_JSON")"
          FULL_DIGEST="$(jq -r '.assets[]|select(.name=="VF_SEO_V1.0.1_FULL.zip")|.digest' "$REL_JSON")"
          test -n "$RELEASE_ID" && test "$FULL_BYTES" = "$EXPECTED_BYTES" && test "$FULL_DIGEST" = "sha256:$EXPECTED_SHA"
          TAG_SHA="$(gh api "/repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')"
          test "$TAG_SHA" = "$VERIFIED_SOURCE"

          # P05 has no Production and v1.0.0 had no current updater. Publish an honest
          # first-install-only distribution record; from_versions MUST stay empty.
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/core-updates.git" "$WORK/updates" >/dev/null 2>&1
          cd "$WORK/updates"
          mkdir -p projects
          if [ -e projects/P05.json ]; then echo P05_MANIFEST_ALREADY_EXISTS; exit 33; fi
          RELEASE_ID="$RELEASE_ID" FULL_ID="$FULL_ID" cat > projects/P05.json <<EOF
          {
            "schema_version": "1.0",
            "project_id": "P05",
            "component_id": "APP",
            "enabled": true,
            "target_version": "1.0.1",
            "update_type": "FULL_ONLY",
            "from_versions": [],
            "schema_from": "1",
            "schema_to": "1",
            "repository": "llhzx2018/vf-seo",
            "release_tag": "v1.0.1",
            "release_name": "VF SEO V1.0.1",
            "release_id": ${RELEASE_ID},
            "release_product_commit": "00a724587c041130c0e81e0e45ef876413fb2916",
            "release_product_tree": "1f793ef58a14e766ceb2189226267497101a81fd",
            "asset_name": "VF_SEO_V1.0.1_FULL.zip",
            "asset_id": ${FULL_ID},
            "asset_bytes": 469642,
            "asset_sha256": "ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c",
            "backup_required": false,
            "rollback_supported": false,
            "deployment_state": "NOT_DEPLOYED",
            "production_verification": "NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT",
            "minimum_node": "24.0.0",
            "notes": "P05 V1.0.1 首次部署就绪。当前无 Production Runtime；V1.0.0 不含当前 updater，因此 from_versions 为空且仅允许 FULL 首次安装，不声明在线升级支持。"
          }
          EOF
          jq -e '.target_version=="1.0.1" and .update_type=="FULL_ONLY" and (.from_versions|length)==0 and .deployment_state=="NOT_DEPLOYED" and .asset_sha256=="ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c"' projects/P05.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add projects/P05.json
          git commit -m 'release(P05): publish V1.0.1 first-install channel'
          git push origin HEAD:main
          UPDATES_SHA="$(git rev-parse HEAD)"

          # Final publication readback.
          test "$(gh api /repos/llhzx2018/core-updates/contents/projects/P05.json?ref=main --jq '.content' | tr -d '\n' | base64 -d | jq -r '.target_version')" = '1.0.1'
          test "$(gh api /repos/llhzx2018/core-updates/contents/projects/P05.json?ref=main --jq '.content' | tr -d '\n' | base64 -d | jq -r '.update_type')" = 'FULL_ONLY'
          test "$(gh api /repos/llhzx2018/core-updates/contents/projects/P05.json?ref=main --jq '.content' | tr -d '\n' | base64 -d | jq '.from_versions|length')" = '0'
          echo P05_V101_RELEASE_ID="$RELEASE_ID"
          echo P05_V101_FULL_ASSET_ID="$FULL_ID"
          echo P05_V101_CORE_UPDATES_COMMIT="$UPDATES_SHA"
          echo P05_V101_TAG_SOURCE="$TAG_SHA"
          echo P05_V101_PUBLICATION=PASS
          echo P05_V101_PRODUCTION=NOT_DEPLOYED
      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: P05-V1.0.1-PUBLICATION-EVIDENCE
          path: ${{ runner.temp }}/p05-v101-publication/release.json
          if-no-files-found: error
          retention-days: 90
