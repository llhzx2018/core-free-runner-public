name: P07 original 18 old-rescue exact source
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - task/p07-old-rollback-live-20261112
permissions:
  contents: read
jobs:
  original18-live-rescue-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 9517e7610d1d0dbd00c69f746128d52dbdda4858
    steps:
      - name: Transient private exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 9517e7610d1d0dbd00c69f746128d52dbdda4858
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Exact source and original 18 rollback regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat product/BUILD_ID)" = "0.1.0-release146"
          python3 -B -m compileall -q product/lib product/tests
          (cd product && python3 -B -m unittest -v tests.test_p07_original_18_owner_window tests.test_p07_original_18_frozen_pipeline tests.test_p07_original_18_final_window)
          (cd product && python3 -B -m unittest -q tests.test_p07_original_18_sql_binary_integrity tests.test_p07_original_db_restore_drill)
          echo P07_ORIGINAL18_OLD_ROLLBACK_EXACT_SOURCE=PASS
          echo P07_OLD_VPS_AND_CP2_OPERATED=NO
          echo P07_FORMAL_RELEASE=NO
      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- product
          echo P07_PRIVATE_SOURCE_CLEANUP=YES
