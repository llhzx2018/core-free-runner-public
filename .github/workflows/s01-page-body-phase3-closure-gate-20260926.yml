name: S01 Page Body Phase 3 Closure Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-phase3-closure-gate-20260926.yml'

permissions:
  contents: read

jobs:
  closure:
    if: github.head_ref == 'task/s01-page-body-phase3-closure-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: dbbb23db87eaec4920f772484a732c88fd83fa3d
      THEME_SHA: b8de9700e7e58503c46a07a16cafa8e4e1e2b799
      M3U8_SHA: 16040c1d85f93e017b7918da6d82838b7097ed1b
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact repositories
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for spec in             "llhzx2018/vf-tools-ops:$OPS_SHA:ops"             "llhzx2018/vf-tools-theme:$THEME_SHA:theme"             "llhzx2018/vf-tools-m3u8:$M3U8_SHA:m3u8"
          do
            IFS=: read -r r s d <<<"$spec"
            git clone -q --filter=blob:none "https://x-access-token:$READ_TOKEN@github.com/$r.git" "$d"
            git -C "$d" fetch -q origin "$s"
            git -C "$d" checkout -q --detach "$s"
            test "$(git -C "$d" rev-parse HEAD)" = "$s"
          done

      - name: OPS all Page Body contracts
        working-directory: ops
        run: |
          set -Eeuo pipefail
          for t in tests/s01-c02-page-body-system-v1-*.php; do
            php -l "$t" >/dev/null
            php "$t"
          done

      - name: Theme all Page Body contracts
        working-directory: theme
        run: |
          set -Eeuo pipefail
          for t in tests/s01-c01-page-body-system-v1-*.php; do
            php -l "$t" >/dev/null
            php "$t"
          done

      - name: M3U8 all Page Body contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          for t in tests/s01-c03-page-body-system-v1-*.php; do
            php -l "$t" >/dev/null
            php "$t"
          done

      - name: Phase 3 mandatory markers
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             ops/assets/css/current/admin-s01-page-body-system-v1.css             theme/src/assets/css/admin/admin-s01-page-body-system-v1.css             m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css
          do
            grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R1' "$f"
            grep -Fq 'Phase 3 · Responsive / Accessibility / Legacy Residue R2' "$f"
            grep -Fq '@media(max-width:900px)' "$f"
            grep -Fq '@media(max-width:782px)' "$f"
            grep -Fq '@media(max-width:600px)' "$f"
            grep -Fq '@media(prefers-reduced-motion:reduce)' "$f"
            grep -Fq '@media(forced-colors:active)' "$f"
          done

      - name: Frozen Header selector fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-s01-shell-header' ops/assets/css/current/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' theme/src/assets/css/admin/admin-s01-page-body-system-v1.css
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS delimiter balance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths=[
            Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
            Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
            Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]
          for p in paths:
              c=p.read_text()
              assert c.count('{')==c.count('}'), p
          print('PASS_S01_PAGE_BODY_PHASE3_CLOSURE')
          PY
