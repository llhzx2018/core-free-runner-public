name: TEMP Fix P01 Nav Patch Workflow
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/temp-fix-p01-nav-patch-workflow.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vf-agent-operations-v1
      - name: Fix renamed-file staging and retrigger
        shell: bash
        run: |
          set -Eeuo pipefail
          f=.github/workflows/temp-p01-nav-admin-simplify-source.yml
          old='git add src/index.php src/app/AdminShell.php src/assets/reference-ui.js src/assets/navigation-shell.css src/assets/sidebar-refinement.css src/advanced.php'
          test "$(grep -Fxc "$old" "$f")" = 1
          sed -i "s|$old|git add -A|" "$f"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "$f"
          git commit -m 'ci(P01): stage sidebar rename safely'
          git pull --rebase origin vf-agent-operations-v1
          git push origin HEAD:vf-agent-operations-v1
