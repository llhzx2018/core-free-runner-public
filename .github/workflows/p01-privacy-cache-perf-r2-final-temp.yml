name: p01-privacy-cache-perf-r2-final-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-privacy-cache-perf-r2-final-temp.yml'
      - 'requests/p01-privacy-cache-perf-r2-final-20260922.json'

permissions:
  contents: read

jobs:
  r2-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-privacy-cache-perf-r2-final-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" | tee /tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Checkout exact P01 R2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fix/p01-privacy-cache-perf-r2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$target_version"
          test "$(php -r '$p=json_decode(file_get_contents("candidate/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$schema_version"
          echo 'P01_R2_FINAL_EXACT_SOURCE=PASS'

      - name: Focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          cd candidate
          php tests/unit/privacy_cache_performance_r2_contract.php
          php tests/unit/session_csrf_contract.php
          php tests/unit/navigation_owner_behavior_privacy_contract.php
          php tests/unit/resource_cover_derivative_runtime.php
          php tests/unit/full_surface_governance_privacy_monotonic_runtime.php
          php tests/unit/admin_system_baseline_r25_contract.php
          echo 'P01_R2_FINAL_CONTRACTS=PASS'

      - name: Optional setup guard
        shell: bash
        run: |
          set -Eeuo pipefail
          GUARD=/tmp/p01-r2-final-guard
          rm -rf "$GUARD"
          cp -a candidate/src "$GUARD"
          cd "$GUARD"
          VF_SETUP_REQUIRE_KEY=1 php -S 127.0.0.1:18448 -t . >/tmp/p01-r2-final-guard.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18448/setup.php" -o /tmp/p01-r2-final-guard.html; then break; fi
            sleep 1
          done
          grep -Fq '高级安装保护' /tmp/p01-r2-final-guard.html
          grep -Fq 'name="setup_key_auth"' /tmp/p01-r2-final-guard.html
          ! grep -Fq 'name="admin_password"' /tmp/p01-r2-final-guard.html
          echo 'P01_R2_FINAL_SETUP_GUARD=PASS'

      - name: Fresh runtime privacy cache proof
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-r2-final-runtime
          COOKIE=/tmp/p01-r2-final-admin.cookies
          rm -rf "$RUNTIME" "$COOKIE"
          cp -a candidate/src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:"$target_port" -t . >/tmp/p01-r2-final-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$target_port/setup.php" -o /tmp/p01-r2-final-setup.html; then break; fi
            sleep 1
          done
          SETUP_CSRF=$(python3 - <<'PY'
          import re
          t=open('/tmp/p01-r2-final-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',t)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$target_port/setup.php" \
            --data-urlencode "setup_csrf=$SETUP_CSRF" \
            --data-urlencode 'site_title=VF Start R2 Final' \
            --data-urlencode 'admin_password=PrivacyCache!2026' \
            --data-urlencode 'admin_password_confirm=PrivacyCache!2026' \
            -o /tmp/p01-r2-final-setup-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$target_port/setup.php")" = '302'

          curl -fsS -D /tmp/p01-r2-final-home.h -o /tmp/p01-r2-final-home.html "http://127.0.0.1:$target_port/"
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-final-home.h
          grep -Eiq '^Cache-Control: public, max-age=120, stale-while-revalidate=300' /tmp/p01-r2-final-home.h
          ! grep -Eiq '^Set-Cookie: *vfnav_session=' /tmp/p01-r2-final-home.h

          curl -fsS -D /tmp/p01-r2-final-start.h -o /tmp/p01-r2-final-start.html "http://127.0.0.1:$target_port/start.php"
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-final-start.h
          grep -Eiq '^Cache-Control: public, max-age=120, stale-while-revalidate=300' /tmp/p01-r2-final-start.h
          ! grep -Eiq '^Set-Cookie: *vfnav_session=' /tmp/p01-r2-final-start.h
          echo 'P01_R2_FINAL_ANON_SESSIONLESS=PASS'

          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' \
            --data '{"password":"PrivacyCache!2026"}' \
            "http://127.0.0.1:$target_port/api.php?action=login" >/tmp/p01-r2-final-login.json
          grep -Fq '"ok":true' /tmp/p01-r2-final-login.json
          curl -fsS -c "$COOKIE" -b "$COOKIE" -D /tmp/p01-r2-final-admin.h -o /tmp/p01-r2-final-admin.html "http://127.0.0.1:$target_port/start.php"
          grep -Eiq '^Cache-Control: no-store, private|^Cache-Control: private, no-store' /tmp/p01-r2-final-admin.h
          echo 'P01_R2_FINAL_ADMIN_NOSTORE=PASS'

          php -r '
          require "app/bootstrap.php";
          $db=vf_db();
          $repo=new VfRepository($db);
          $cat=$repo->createCategory(["name"=>"R2 Public","description"=>"","icon"=>"","is_private"=>0,"sort_order"=>0]);
          $link=$repo->saveLink(null,["surface"=>"start","category_id"=>$cat,"title"=>"R2 Cover","url"=>"https://example.com/r2-cover","description"=>"","tags"=>[],"is_private"=>0,"is_pending"=>0]);
          $id=(int)$link["id"];
          $dir=VF_PRIVATE_ROOT."/resource-assets/covers";
          if(!is_dir($dir))mkdir($dir,0750,true);
          vf_write_storage_guards($dir);
          $file="cover-".$id."-r2final.png";
          $path=$dir."/".$file;
          $im=imagecreatetruecolor(32,32);
          imagepng($im,$path);
          imagedestroy($im);
          chmod($path,0640);
          $hash=hash_file("sha256",$path);
          $now=gmdate("c");
          $stmt=$db->prepare("INSERT INTO resource_asset_files(link_id,asset_kind,file_name,original_name,mime_type,byte_size,width,height,file_hash,created_at,updated_at) VALUES(?,\x27cover\x27,?,\x27r2.png\x27,\x27image/png\x27,?,32,32,?,?,?)");
          $stmt->execute([$id,$file,filesize($path),$hash,$now,$now]);
          echo $id." ".substr($hash,0,16)."\\n";
          ' > /tmp/p01-r2-final-cover.txt
          read COVER_ID COVER_HASH < /tmp/p01-r2-final-cover.txt
          COVER_URL="http://127.0.0.1:$target_port/resource-cover.php?id=$COVER_ID&v=$COVER_HASH"

          PUBLIC_STATUS=$(curl -sS -D /tmp/p01-r2-final-cover-public.h -o /tmp/p01-r2-final-cover.bin -w '%{http_code}' "$COVER_URL")
          echo "PUBLIC_COVER_STATUS=$PUBLIC_STATUS"
          cat /tmp/p01-r2-final-cover-public.h
          if [ "$PUBLIC_STATUS" != '200' ]; then
            cat /tmp/p01-r2-final-server.log
            exit 94
          fi
          grep -Eiq '^Cache-Control: public, max-age=0, must-revalidate' /tmp/p01-r2-final-cover-public.h
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-final-cover-public.h
          ETAG=$(awk 'BEGIN{IGNORECASE=1} /^ETag:/{gsub("\r",""); sub(/^ETag:[[:space:]]*/,""); print; exit}' /tmp/p01-r2-final-cover-public.h)
          test -n "$ETAG"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$COVER_URL")" = '304'

          php -r '
          require "app/bootstrap.php";
          $db=vf_db();
          $stmt=$db->prepare("UPDATE links SET is_private=1,updated_at=? WHERE id=?");
          $stmt->execute([gmdate("c"),(int)$argv[1]]);
          ' "$COVER_ID"

          PRIVATE_STATUS=$(curl -sS -D /tmp/p01-r2-final-cover-private.h -o /tmp/p01-r2-final-private.bin -w '%{http_code}' -H "If-None-Match: $ETAG" "$COVER_URL")
          echo "PRIVATE_COVER_STATUS=$PRIVATE_STATUS"
          test "$PRIVATE_STATUS" = '404'
          grep -Eiq '^Cache-Control: private, no-store, max-age=0' /tmp/p01-r2-final-cover-private.h
          test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$target_port/resource-cover.php?id=0")" = '404'
          echo 'P01_R2_FINAL_PUBLIC_TO_PRIVATE=PASS'
          echo 'P01_R2_FINAL_FRESH_RUNTIME=PASS'
