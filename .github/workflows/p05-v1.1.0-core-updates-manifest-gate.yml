name: P05 V1.1.0 Core Updates Manifest Gate

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.0-core-updates-manifest-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPDATES_SOURCE: 28cc3e686cd4f179ac3aefd5e4befebafe79353d
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact core-updates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SOURCE }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Verify P05 V1.1.0 manifest and remote release
        working-directory: updates
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P05.json',encoding='utf-8'))
          expected={
            'schema_version':'1.0','project_id':'P05','component_id':'APP','enabled':True,
            'target_version':'1.1.0','update_type':'FULL_ONLY','from_versions':[],
            'schema_from':'1','schema_to':'1','repository':'llhzx2018/vf-seo',
            'release_tag':'v1.1.0','release_id':379062020,
            'release_product_commit':'e3455704cf5fc7254b86fbe84cc3941f585a15ac',
            'release_product_tree':'46b4fca0b04ecae1653ca9d75228c3b949c5267c',
            'asset_name':'VF_SEO_V1.1.0_FULL.zip','asset_id':535551195,
            'asset_bytes':190082,'asset_sha256':'86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6',
            'backup_required':False,'rollback_supported':False,'deployment_state':'NOT_DEPLOYED',
            'minimum_php':'8.2','minimum_node':'24.0.0'
          }
          for k,v in expected.items():
            assert p.get(k)==v,(k,p.get(k),v)
          assert p.get('production_verification')=='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          print('P05_CORE_UPDATES_MANIFEST=PASS')
          PY
          rel="$(gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.0)"
          test "$(jq -r '.id' <<<"$rel")" = '379062020'
          test "$(jq -r '.target_commitish' <<<"$rel")" = 'e3455704cf5fc7254b86fbe84cc3941f585a15ac'
          test "$(jq -r '.draft' <<<"$rel")" = 'false'
          test "$(jq -r '.prerelease' <<<"$rel")" = 'false'
          asset="$(jq -c '.assets[]|select(.id==535551195)' <<<"$rel")"
          test "$(jq -r '.name' <<<"$asset")" = 'VF_SEO_V1.1.0_FULL.zip'
          test "$(jq -r '.size' <<<"$asset")" = '190082'
          test "$(jq -r '.digest' <<<"$asset")" = 'sha256:86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6'
          echo P05_CORE_UPDATES_REMOTE_RELEASE=PASS
