name: P01 V2.47.9 Candidate Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2479-candidate-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2479-candidate-gate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.head_ref == 'temp/p01-v2479-candidate-gate-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      ENGINEERING_SHA: 63791bc5eee3d8d565127d342ddb48c944f6d5cd
      TARGET_BRANCH: release/v2.47.9-candidate-20260911
      SOURCE_TAG: v2.47.8
      SOURCE_SHA: c1806005c0f89d9794844124264cb15a7ffcb1fc
      SOURCE_VERSION: 2.47.8
      TARGET_VERSION: 2.47.9
      EXPECTED_SCHEMA: '2026090401'
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority and release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" && test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$ENGINEERING_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then echo BLOCK=CANDIDATE_BRANCH_ALREADY_EXISTS; exit 81; fi
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then echo BLOCK=TARGET_TAG_ALREADY_EXISTS; exit 82; fi
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo P01_V2479_AUTHORITY=PASS

      - name: Checkout exact engineering source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.ENGINEERING_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Create exact V2.47.9 candidate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINEERING_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '${SOURCE_VERSION}');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.8');"; new="define('VF_VERSION', '2.47.9');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          prefix='''# V2.47.9\n\n- R24：把“待整理”明确为系统收件箱 presentation，而不是导航业务分类或第七 canonical storage domain。\n- 待整理页面明确区分“状态：待整理 / AI 建议去向 / 正式去向”，旧 category 关系或 AI suggestion 不再冒充已正式归类。\n- 资源管理侧栏按“系统收件箱 / 资源库 / 业务分类 / 治理”分组；确认正式去向后资源才通过既有 canonical mutation 清除 pending 并离开 Inbox。\n- 继续复用 `links.is_pending` 单一 workflow Authority，不新增分类、Shadow Table、Schema 或 Migration。\n- Schema 仍为 `2026090401`，Migration `NONE`；V2.47.9 只允许正式验证的 `2.47.8 → 2.47.9` 单跳在线更新。\n\n'''
          assert not s.startswith('# V2.47.9\n')
          p.write_text(prefix+s,encoding='utf-8')
          PY
          mkdir -p docs/release
          cat > docs/release/V2.47.9_RELEASE_GATE.md <<'EOF'
          # P01 · V2.47.9 Release Gate

          ## Owner Preview Applicability

          `OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A`

          Reason: this release is a bounded Admin Pending-Inbox UX clarification. The Owner explicitly instructed the optimization, required the corresponding stable contracts to be updated, and then explicitly instructed “完成了就发布更新”. P01 has no separate supported preview runtime, while its installed updater intentionally consumes stable one-hop releases rather than GitHub prerelease assets. Creating a second preview distribution path only for this UX round would add a new mechanism with no product value. Exact Candidate browser evidence remains required; Owner real-use after manual upgrade remains authoritative and may still reject the result.

          This N_A does not waive machine evidence. Exact Candidate Fresh Install, authenticated desktop/mobile Pending Inbox semantics, canonical Pending exit, strict one-hop UPDATE, existing-data preservation, backup/rollback, package safety and remote byte readback remain required.

          ## Public Authority Applicability

          | Domain | State | Release obligation |
          |---|---|---|
          | INSTALL | REQUIRED | Clean FULL, setup/admin init/login/setup lock |
          | SECURITY | REQUIRED | authenticated admin boundary remains intact; package safety; no user/private runtime data in artifacts |
          | TESTING | REQUIRED | syntax, focused contracts, runtime, browser, install and update evidence |
          | UPGRADE | REQUIRED | strict 2.47.8 → 2.47.9 Atomic update, backup/rollback/readback |
          | DATA_SCHEMA | REQUIRED | existing SQLite preserved; schema 2026090401 unchanged; no user data in packages |
          | API_PROVIDER | N_A | no provider/API capability change |
          | SEO | N_A | no public indexing/metadata change |
          | CRON_JOB | N_A | no scheduler/background-job change |
          | NOTIFICATION | N_A | no notification capability change |
          | OBSERVABILITY | N_A | no Production write in this release gate |
          | PERFORMANCE | N_A | no capacity-sensitive change |
          | GIT | REQUIRED | exact source, candidate, tag/release/remote readback |
          | UA_UI | REQUIRED | Pending Inbox desktop/mobile semantics, IA grouping and no horizontal overflow |

          ## Stable Product Boundary

          - Schema: `2026090401 → 2026090401`
          - Migration: `NONE`
          - Canonical data/storage authority: unchanged
          - Pending Authority: existing `links.is_pending`
          - Update route: strict one-hop `2.47.8 → 2.47.9`
          - Production: separate; Release/Distribution do not claim installed Production
          EOF
          git config user.name 'VF Release Runner'
          git config user.email 'vf-release-runner@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add VERSION src/VERSION.txt src/app/bootstrap.php CHANGELOG.md docs/release/V2.47.9_RELEASE_GATE.md
          git commit -m 'release(P01): prepare V2.47.9 candidate'
          CANDIDATE_SHA=$(git rev-parse HEAD)
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${PRODUCT_REPO}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo "P01_V2479_CANDIDATE_SHA=$CANDIDATE_SHA"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact identity and static contracts
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          mapfile -t changed < <(git diff --name-only "$ENGINEERING_SHA"..HEAD | sort)
          printf '%s\n' "${changed[@]}" >/tmp/changed
          printf '%s\n' CHANGELOG.md VERSION docs/release/V2.47.9_RELEASE_GATE.md src/VERSION.txt src/app/bootstrap.php >/tmp/expected
          diff -u /tmp/expected /tmp/changed
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          php tests/unit/pending_inbox_presentation_contract.php | grep -Fx 'P01_PENDING_INBOX_PRESENTATION_CONTRACT=PASS'
          php tests/unit/admin_secondary_nav_focus_contract.php | grep -Fx 'P01_ADMIN_SECONDARY_NAV_FOCUS_CONTRACT=PASS'
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.9_RELEASE_GATE.md
          echo P01_V2479_STATIC=PASS
          echo DATA_SCHEMA_CHANGE=NONE

      - name: Fresh install and representative Pending seed
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2479-runtime /tmp/p01-v2479-pw
          cp -a src /tmp/p01-v2479-runtime
          cd /tmp/p01-v2479-runtime
          php -S 127.0.0.1:18130 -t . >/tmp/p01-v2479-server.log 2>&1 & echo $! >/tmp/p01-v2479-server.pid
          for i in $(seq 1 30); do if curl -fsS -c /tmp/p01-v2479.cookies -b /tmp/p01-v2479.cookies http://127.0.0.1:18130/setup.php -o /tmp/p01-v2479-setup.html; then break; fi; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2479-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2479x"; printf '%s' "$PASS" >/tmp/p01-v2479.password
          curl -fsS -L -c /tmp/p01-v2479.cookies -b /tmp/p01-v2479.cookies -X POST http://127.0.0.1:18130/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2479 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2479-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          code=$(curl -sS -o /tmp/revisit -D /tmp/revisit.h -w '%{http_code}' http://127.0.0.1:18130/setup.php); test "$code" = 302
          tr -d '\r' </tmp/revisit.h | grep -Eiq '^Location: /$'
          php -r 'require "app/bootstrap.php"; require "app/SurfaceRepository.php"; $r=new VfRepository(vf_db()); $r->createCategory(["name"=>"V2479 Legacy Bucket","is_private"=>true,"sort_order"=>0]); $db=vf_db(); $q=$db->prepare("SELECT id FROM categories WHERE name=? ORDER BY id DESC LIMIT 1"); $q->execute(["V2479 Legacy Bucket"]); $cid=(int)$q->fetchColumn(); $x=$r->savePendingCapture(["url"=>"https://example.com/v2479-pending-inbox","title"=>"V2479 Pending Inbox Resource"],"mobile-quick-save"); $id=(int)($x["id"]??0); if($cid<=0||$id<=0) exit(2); $db->prepare("UPDATE links SET category_id=? WHERE id=?")->execute([$cid,$id]); echo "P01_V2479_SEED=PASS\n";'
          echo P01_V2479_INSTALL=PASS

      - name: Authenticated Pending Inbox browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2479-pw && cd /tmp/p01-v2479-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18130/',password=fs.readFileSync('/tmp/p01-v2479.password','utf8');
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:1291,height:797}});const p=await ctx.newPage();
          await p.goto(base+'start.php',{waitUntil:'networkidle'});await p.click('.vf-global-account-actions [data-vf-auth-login]');await p.fill('[data-vf-auth-dialog] input[name="password"]',password);await p.click('[data-vf-auth-submit]');await p.waitForSelector('.vf-global-account-actions a[href="settings.php"]',{timeout:15000});
          await p.goto(base+'surface-manager.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-pending-inbox-intro');
          const d=await p.evaluate(()=>{const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],row=q('.vf-resource-pending-row'),copy=row?.querySelector('.vf-resource-copy');return{h1:q('h1')?.textContent.trim(),intro:q('.vf-pending-inbox-copy strong')?.textContent.trim(),count:q('.vf-pending-inbox-count strong')?.textContent.trim(),groups:qa('.vf-rail-subgroup-label').map(x=>x.textContent.trim()),status:copy?.querySelector('small')?.textContent.trim(),suggestion:copy?.querySelector('em')?.textContent.trim(),destination:row?.querySelector('.vf-inbox-destination>span')?.textContent.trim(),legacyInStatus:(copy?.querySelector('small')?.textContent||'').includes('V2479 Legacy Bucket'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});
          if(d.h1!=='待整理收件箱'||d.intro!=='待整理不是正式分类'||d.count!=='1'||JSON.stringify(d.groups)!==JSON.stringify(['系统收件箱','资源库','业务分类','治理'])||!d.status.includes('状态：待整理')||d.legacyInStatus||!d.suggestion.startsWith('AI 建议去向：')||d.destination!=='正式去向（导航分类）'||d.overflow>1)throw new Error('desktop '+JSON.stringify(d));
          await p.setViewportSize({width:390,height:844});await p.goto(base+'surface-manager.php',{waitUntil:'networkidle'});await p.waitForSelector('.vf-pending-inbox-intro');
          const m=await p.evaluate(()=>({status:document.querySelector('.vf-resource-pending-row .vf-resource-copy small')?.textContent.trim(),destination:document.querySelector('.vf-inbox-destination>span')?.textContent.trim(),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          if(!m.status?.includes('状态：待整理')||m.destination!=='正式去向（导航分类）'||m.overflow>1)throw new Error('mobile '+JSON.stringify(m));
          await p.setViewportSize({width:1291,height:797});await p.goto(base+'surface-manager.php',{waitUntil:'networkidle'});const row=p.locator('.vf-resource-pending-row').first();await row.locator('button[value="organize_category"]').click();await p.waitForLoadState('networkidle');await p.waitForSelector('.vf-pending-inbox-intro');
          const after=await p.evaluate(()=>({rows:document.querySelectorAll('.vf-resource-pending-row').length,empty:document.body.textContent.includes('待整理已经清空'),count:document.querySelector('.vf-pending-inbox-count strong')?.textContent.trim(),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));
          if(after.rows!==0||!after.empty||after.count!=='0'||after.overflow>1)throw new Error('after '+JSON.stringify(after));
          console.log('P01_V2479_BROWSER='+JSON.stringify({desktop:d,mobile:m,after}));await browser.close();
          JS
          node verify.mjs | tee /tmp/p01-v2479-browser
          grep -F 'P01_V2479_BROWSER=' /tmp/p01-v2479-browser
          cd /tmp/p01-v2479-runtime
          php -r 'require "app/bootstrap.php"; $db=vf_db(); $q=$db->prepare("SELECT is_pending FROM links WHERE url=? AND lifecycle_state=\"active\""); $q->execute(["https://example.com/v2479-pending-inbox"]); $v=$q->fetchColumn(); if($v===false||(int)$v!==0) exit(2); echo "P01_V2479_PENDING_EXIT=PASS\n";'
          echo P01_V2479_BROWSER_GATE=PASS

      - name: Final candidate verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS_BOUNDARY_UNCHANGED
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PENDING_FORMAL_ARTIFACT_GATE
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PENDING_FORMAL_ARTIFACT_GATE
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V2479_CANDIDATE_GATE=PASS
          echo FORMAL_RELEASE=false
          echo DISTRIBUTION=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-v2479-server.pid; then kill "$(cat /tmp/p01-v2479-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-v2479-* /tmp/changed /tmp/expected /tmp/php-lint
