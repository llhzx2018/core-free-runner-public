name: TEMP S01-C02 v1.21.817 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121817-build-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121817-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 25b3cdda0494dff26e57f9e8a8a206cf9e6ac1a9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Gate update channel
        shell: bash
        run: |
          set -Eeuo pipefail
          CORE_BASE=06daae55891a14bdb23a475792bf36857673ce02
          CORE_SHA=25b3cdda0494dff26e57f9e8a8a206cf9e6ac1a9
          OPS_SHA=7df4c09dfcbd99d6fee0bd2e96c648aac87c919d
          OPS_TREE=07ddda7634fbebb5c38dc5a794788cbf7566f1bd
          ASSET_NAME=vf-tools-ops_V1.21.817.zip
          ASSET_BYTES=3231672
          ASSET_SHA=458af4faa77bf67e793ec350a406f6547d35b1790c995dff3888b6aec0b80638
          test "$(git -C updates rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C updates rev-list --count "$CORE_BASE..$CORE_SHA")" = 1
          test "$(git -C updates diff --name-only "$CORE_BASE" "$CORE_SHA")" = 'projects/S01-C02.json'
          m=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.817" and .from_versions==["1.21.816"] and .release_tag=="v1.21.817" and .asset_name=="vf-tools-ops_V1.21.817.zip" and .asset_bytes==3231672 and .asset_sha256=="458af4faa77bf67e793ec350a406f6547d35b1790c995dff3888b6aec0b80638" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .runtime_files==904 and .runtime_file_count==904 and .runtime_fingerprint=="fa4d2e0aa318bae8f149f127ef6b12ec6eff82bb10fb0256857e90426d2e8f23" and .runtime_fingerprint_sha256=="fa4d2e0aa318bae8f149f127ef6b12ec6eff82bb10fb0256857e90426d2e8f23" and .released_at=="2026-09-05T08:06:43Z"' "$m" >/dev/null
          rel=$(curl -fsSL https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.817)
          test "$(jq -r '.target_commitish' <<<"$rel")" = "$OPS_SHA"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$rel")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$rel")" = "sha256:$ASSET_SHA"
          prod=$(curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')
          test "$(jq -r '.pluginVersion' <<<"$prod")" = '1.21.816'
          test "$(jq -r '.status' <<<"$prod")" = 'CURRENT'
          test "$(jq -r '.authorityFinalHost' <<<"$prod")" = 'https://ilovem3u8.com'
          test "$(jq -r '.authorityMatch' <<<"$prod")" = 'true'
          echo FORMAL_RELEASE_ASSET=PASS
          echo DIRECT_PRODUCTION_1_21_816_ONLY=PASS
          echo PASS_V121817_UPDATE_CHANNEL_GATE
