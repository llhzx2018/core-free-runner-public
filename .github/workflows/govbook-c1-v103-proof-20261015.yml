name: GOV-BOOK C1 v1.0.3 one-off reader native proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/govbook-c1-v103-proof-20261015.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private candidate transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-book.git" book
          git -C book checkout -q cbd120ccb274e651c67258bb0d28a5db7de37f33
          git -C book fetch -q origin draft/c1-skill-book-v58-depth-20261015
          test "$(git -C book rev-parse HEAD)" = "cbd120ccb274e651c67258bb0d28a5db7de37f33"
          echo GOVBOOK_C1_PINNED_SOURCE=PASS
      - name: Validate immutable versions and exact Markdown ZIP bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path('book')
          sha=lambda b:hashlib.sha256(b).hexdigest()
          base=root/'distribution/p01/books/C1'
          new=base/'v1.0.3'
          old=base/'v1.0.2'
          meta=json.loads((new/'asset.json').read_text('utf-8'))
          previous=json.loads((old/'asset.json').read_text('utf-8'))
          catalog=json.loads((root/'distribution/p01/catalog.json').read_text('utf-8'))
          manifest=json.loads((root/'books/C1/revisions/skill-book-v5.8-r5/SOURCE_MANIFEST.json').read_text('utf-8'))
          rows={x['book_id']:x for x in catalog['internal_revisions']}
          assert len(catalog['books'])==9 and len(catalog['internal_books'])==2 and len(rows)==8
          assert len(rows)==len(catalog['internal_revisions'])
          assert rows['C1']['book_version']=='v1.0.3' and rows['C1']['qualification']=='INTERNAL'
          assert rows['C1']['publication_status']=='NOT_PUBLISHED'
          assert meta['book_id']=='C1' and meta['book_version']=='v1.0.3'
          assert meta['base_book_version']=='v1.0.1' and meta['reading_stage']=='INTERNAL'
          assert previous['book_version']=='v1.0.2' and previous['qualification']=='INTERNAL'
          assert sha((old/'reader.zip').read_bytes())==previous['zip']['sha256']
          assert sha((new/'cover.png').read_bytes())==meta['cover']['sha256']==previous['cover']['sha256']
          zipped=(new/'reader.zip').read_bytes()
          assert len(zipped)==meta['zip']['bytes'] and sha(zipped)==meta['zip']['sha256']
          assert meta['source_commit']==manifest['source_commit']=='63f99da52256577bd27b5243a29519f30b1ff0f1'
          entries=manifest['entries']
          assert len(entries)==31 and len({z['name'] for z in entries})==31
          modified=[]
          with zipfile.ZipFile(new/'reader.zip') as archive:
            assert archive.testzip() is None
            members=archive.infolist()
            assert len(members)==31 and {z.filename for z in members}=={z['name'] for z in entries}
            for info in members:
              assert info.compress_type==zipfile.ZIP_STORED and info.flag_bits & 0x800
              assert not info.filename.startswith('/') and '..' not in pathlib.PurePosixPath(info.filename).parts
              assert info.filename.endswith('.md')
            for item in entries:
              name=item['name']
              body=(root/item['source']).read_bytes()
              assert archive.read(name)==body
              assert len(body)==item['bytes']
              assert sha(body) and (zipfile.crc32(body)&0xffffffff)==int(item['crc32'],16)
              original='books/C1/revisions/skill-book-v5.8-r4/p01_course/md/'+name
              oldbody=subprocess.check_output(['git','-C','book','show','FETCH_HEAD:'+original])
              if oldbody!=body:modified.append(name)
          assert set(modified)=={'15_第15章.md','16_第16章.md'}
          ch15=(root/'books/C1/revisions/skill-book-v5.8-r5/p01_course/md/15_第15章.md').read_text('utf-8')
          ch16=(root/'books/C1/revisions/skill-book-v5.8-r5/p01_course/md/16_第16章.md').read_text('utf-8')
          assert '## 第四部分' not in ch15 and '**第四部分 ·' in ch16
          assert sum(line.startswith('# ') for line in ch15.splitlines())==1
          assert sum(line.startswith('# ') for line in ch16.splitlines())==1
          print('GOVBOOK_C1_31_MARKDOWN_EXACT_SOURCE=PASS')
          print('GOVBOOK_C1_29_UNCHANGED_TWO_CORRECTED=PASS')
          print('GOVBOOK_C1_ZIP_CRC_SHA256_UTF8=PASS')
          print('GOVBOOK_C1_COVER_IDENTITY_PRESERVED=PASS')
          print('GOVBOOK_C1_FORMAL_AND_PRIVATE_QUALIFICATION_GUARD=PASS')
          PY
      - name: Cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf book
          echo PRIVATE_SOURCE_PERSISTED=NO
