name: P07 Release12 Backup Freshness Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release12-backup-fresh-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f043df6d3e2462f1ae96eb67a71751bf2cb46b6f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'f043df6d3e2462f1ae96eb67a71751bf2cb46b6f'
          test "$(cat BUILD_ID)" = '0.1.0-release12'

      - name: Full regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash -n bin/vfops-user
          bash -n bin/vfops-site-ui
          bash -n bin/vfops-selfcheck-ui
          bash -n lib/terminal_ui.sh
          python3 -m unittest -v tests.test_release12_backup_freshness
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root .

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE12_EXACT_SOURCE=f043df6d3e2462f1ae96eb67a71751bf2cb46b6f'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
