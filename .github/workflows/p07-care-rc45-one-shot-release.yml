name: P07 Care rc45 no-op truth formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc45-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): care rc45 zero-change truth'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout verified canonical Public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact distribution identities and 14 successful Machine Gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '93509fbb79db3cee26eda3b2f959e7a266742335'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc45'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc45'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = '5f6780059491b80af11665103ec868428146ce58'
          test "$(git hash-object "$pkg/lib/resource_apply.py")" = '0eef659e7a7edc0395a1e680cdaf77521bb3aa59'
          test "$(git hash-object "$pkg/lib/resource_brief.py")" = 'ee41f62775a17fbfcd90059f332d092e56a6dc99'
          (cd "$pkg" && while read -r sha f; do test "$(git hash-object "$f")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq "VERSION='0.1.0-rc45'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='5f6780059491b80af11665103ec868428146ce58'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc45"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'UNCHANGED_VERIFIED' "$pkg/lib/resource_apply.py"
          grep -Fq 'no_runtime_changes' "$pkg/lib/resource_apply.py"
          grep -Fq '当前配置符合建议，无需修改' "$pkg/lib/resource_brief.py"
          for id in 37761394933 37761394955 37761394854 37761394797 37761394727 37761394867 37761394943 37761394925 37761394916 37761394837 37761394894 37761394888 37761394752 37761395025; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '3d5098458ed5ad26d78b36d9c071b5715aab649b'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_CARE_RC45_FORMAL_PRECONDITIONS=PASS
      - name: Publish formal immutable release and read back
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc45-no-change-truth'
          target='93509fbb79db3cee26eda3b2f959e7a266742335'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 服务器维护 rc45 · 零变更不虚报已调优' \
              --notes '根据 OWNER rc44 真实 VPS 截图，PHP 0 项/数据库 0 项却显示已应用和恢复副本，存在误导性报告和无效配置写入风险。rc45 不改动一屏排版：当生产安全计划没有需修改内容时直接显示“当前配置符合建议，无需修改”，只允许 Enter 返回；后端再次核查磁盘计划和 MySQL 运行时参数确实不需更改时直接 VERIFIED_KEEP，不重写文件、不调用 MySQL SET GLOBAL、不 reload PHP、不生成空回滚副本。确有差异或安全门槛不符时仍使用原有生产保护，安全校准和真实应用逻辑不放宽。所有恢复、初始化、菜单1/2/3/5均冻结。14/14 隔离 Machine Gates PASS，实际生产 OWNER 验收仍由用户完成。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_CARE_RC45_FORMAL_RELEASE=PASS
