name: TEMP skill-book V5.7 Source Current promotion

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promote-source-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOV_REPO: llhzx2018/gov-doc
      GOV_WORK_BRANCH: work/skill-book-v57-reader-transfer
      EXPECTED_MAIN_SHA: dbd594bfb828121d2fee9f5f9edb1c82164381da
      EXPECTED_WORK_SHA: bf9b0ea5d122eb6e7e9bd63632a69cc816ea94d2
      CANDIDATE_SOURCE_SHA: 885d43a70100911531b7bc38833355e559a90b1d
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered VF capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          test -n "$VF_RELEASE_WRITE_TOKEN" || { echo 'BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 79; }
          echo 'REGISTERED_CAPABILITIES=PASS'

      - name: Checkout exact V5.7 governance branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_WORK_BRANCH }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov

      - name: Verify promotion ancestry and package freeze
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_WORK_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git diff --exit-code "$CANDIDATE_SOURCE_SHA"..HEAD -- skills/skill-book/V5.7
          python3 - <<'PY'
          import subprocess
          allowed = ('skills/skill-book/V5.7/', 'mother-specs/skill-book/V5.7/')
          out = subprocess.check_output(['git','diff','--name-only','dbd594bfb828121d2fee9f5f9edb1c82164381da..HEAD'], text=True)
          bad = [p for p in out.splitlines() if p and not p.startswith(allowed)]
          assert not bad, bad
          print('PROMOTION_SCOPE_PRECHECK=PASS')
          PY

      - name: Apply OWNER-authorized Current routing and overlay
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          current = Path('CURRENT.md')
          text = current.read_text(encoding='utf-8')
          old_row = '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          new_row = '| skill-book | V5.7 | V5.7 CANDIDATE（已安装；Current Distribution 待发布） |'
          assert text.count(old_row) == 1, text.count(old_row)
          text = text.replace(old_row, new_row)

          old_para = '`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2/V5.3/V5.4/V5.5` 为保留的历史 Candidate，`V5.6` 为最新 Candidate；十七个 Candidate 版本均未晋升 Source Current。V5.6 已进入 Candidate Distribution，但未进入 Current Distribution。'
          new_para = '`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7/V4.8/V4.9/V5.0/V5.1/V5.2/V5.3/V5.4/V5.5/V5.6` 保留为历史 Candidate。`skill-book V5.7` 已于 2026-08-29 经 OWNER 明确批准，在 Published Candidate Remote Readback、42/42 compile、140/140 regression、Fresh Isolated Blind Proxy 与安装后 `V57-SFT-01` SEALED STANDALONE FORWARD TEST 的 READ / LEARN / TRAIN / DO 全部 PASS 后晋升 Source Current；V3.5 降为 Previous Current。V5.7 Candidate Release 继续作为不可变历史发行身份；Source Current 晋升不自动等于 Current Distribution，正式分发仍必须通过 `distribution/skills/RELEASE_POLICY.md` 的 canonical publisher + Remote Readback Gate。Real Reader Evidence 仍为 NOT_RUN，不由 AI blind proxy 推导。'
          assert text.count(old_para) == 1, text.count(old_para)
          text = text.replace(old_para, new_para)
          current.write_text(text, encoding='utf-8')

          overlay = Path('mother-specs/agent-native-current/skill-book/V5.7/CURRENT_OVERLAY.md')
          overlay.parent.mkdir(parents=True, exist_ok=True)
          overlay.write_text('''# skill-book V5.7 · Current Overlay\n\n状态：CURRENT / AGENT-NATIVE\n\nSource Current：`skill-book V5.7`。\nRuntime Contract：`SB57-RUNTIME-CONTRACT-8ADCAF17`。\nExact Candidate source package commit：`885d43a70100911531b7bc38833355e559a90b1d`。\nCandidate non-manifest tree SHA-256：`ec3d55bef71856ffee823059538b8318010d7bac18ff91beadf72e9e7dee630b`。\n\n晋升依据：Published Candidate Remote Readback PASS；42/42 Python compile；140/140 full regression；Fresh Isolated Blind Proxy PASS；安装后的 `V57-SFT-01` SEALED STANDALONE FORWARD TEST 在全新非历史题目上完成 READ / LEARN / TRAIN / DO 首答迁移 PASS。\n\nV5.7 Current 的方法重点继续保持 READ / LEARN / TRAIN / DO，同时把 Practical Asset Depth、Operational Closure、Freeze Integrity、Reader Transfer 与 Blind Reader Outcome Validation 纳入 runtime acceptance。历史 Canonical 只允许 FIRST_FREEZE 之后用于 evaluator，不得回流为 generation template。\n\n详细设计、冻结、Candidate 与 Promotion Evidence：`mother-specs/skill-book/V5.7/`。\n\nAuthority Boundary：AI blind proxy PASS 不等于 Real Reader PASS；`REAL_READER_EVIDENCE = NOT_RUN`。Source Current 与 Current Distribution / Installed Runtime 保持独立身份。\n''', encoding='utf-8')

          decision = Path('mother-specs/skill-book/V5.7/V57_SOURCE_CURRENT_OWNER_PROMOTION_DECISION_20260829.json')
          decision.write_text(json.dumps({
              'schema':'skill-book-source-current-promotion/v1',
              'skill':'skill-book',
              'previous_source_current':'V3.5',
              'new_source_current':'V5.7',
              'owner_decision':'APPROVED',
              'owner_approval_text':'批准 skill-book V5.7 晋升 Source Current，并继续完成 Current Distribution 发布。',
              'runtime_contract_id':'SB57-RUNTIME-CONTRACT-8ADCAF17',
              'candidate_source_commit':'885d43a70100911531b7bc38833355e559a90b1d',
              'candidate_release_id':379041922,
              'candidate_zip_sha256':'0b36523a4ed54b28677fb08a87540ba6074aa8a31ba72a4cc4d4d0b6e2bffa4e',
              'v57_sft_01':'PASS',
              'fresh_isolated_blind_proxy':'PASS',
              'real_reader_evidence':'NOT_RUN',
              'distribution_effect':'AUTHORIZED_AFTER_SOURCE_CURRENT_REMOTE_READBACK'
          }, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print('CURRENT_ROUTING_DELTA=PREPARED')
          PY

      - name: Preflight Current distribution builder with V5.7
        working-directory: gov
        shell: bash
        env:
          VF_SKILL_PACK_VERSION: promotion-preflight-v57
          VF_SKILL_BUILD_ID: promotion-preflight-v57
        run: |
          set -Eeuo pipefail
          python3 distribution/skills/release_build.py >/tmp/v57-preflight.log
          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile
          root = Path('dist/skills-promotion-preflight-v57')
          m = json.loads((root/'INSTALL_BUILD_MANIFEST.json').read_text(encoding='utf-8'))
          book = next(r for r in m['skills'] if r['skill']=='skill-book')
          assert book['version'] == 'V5.7', book
          zpath = root/book['artifact']
          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
              assert 'skill-book/references/current-mother-spec/CURRENT_OVERLAY.md' in names
              assert z.testzip() is None
          print('CURRENT_BUILDER_V57_PREFLIGHT=PASS')
          PY
          rm -rf dist/skills-promotion-preflight-v57

      - name: Commit guarded promotion preparation to V5.7 work branch
        working-directory: gov
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CURRENT.md mother-specs/agent-native-current/skill-book/V5.7/CURRENT_OVERLAY.md mother-specs/skill-book/V5.7/V57_SOURCE_CURRENT_OWNER_PROMOTION_DECISION_20260829.json
          test -n "$(git status --porcelain)"
          git diff --cached --exit-code -- skills/skill-book/V5.7
          git commit -m 'skill-book: prepare OWNER-authorized V5.7 Source Current promotion'
          NEW_SHA="$(git rev-parse HEAD)"
          git push "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" "HEAD:refs/heads/${GOV_WORK_BRANCH}"
          echo "V57_SOURCE_PROMOTION_PREPARED_SHA=$NEW_SHA"

      - name: Remote work-branch readback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GOV_REPO']; branch=os.environ['GOV_WORK_BRANCH']; token=os.environ['VF_PRIVATE_READ_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}', headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req, timeout=30) as r: data=json.load(r)
          sha=data['object']['sha']
          assert sha != os.environ['EXPECTED_WORK_SHA'], sha
          print(f'REMOTE_WORK_BRANCH_PROMOTION_PREPARED={sha}')
          PY
