name: S01 M3U8 formal runtime fingerprint readback
on:
  push:
    branches: [task/s01-tool-results-20261021]
    paths: ['.github/workflows/s01-tool-runtime-fingerprint.yml']
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact formal source and candidate archives
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p package/old package/new proof
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir package/old
          gh release download v1.25.92 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.92.zip --dir package/new
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  package/old/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
          echo '6bf23229781134dfb387bd2f9c1bc59de7a6ed535e069e642be808b6bf269517  package/new/vf-tools-m3u8_V1.25.92.zip' | sha256sum -c
      - name: Derive runtime authority hash from exact installed physical root
        run: |
          python3 - <<'PY_PROOF'
          import zipfile,hashlib,re,json
          from pathlib import PurePosixPath,Path
          def is_runtime(rel):
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              base=rel.rsplit('/',1)[-1].lower()
              if base in ('readme.md','changelog.md','license','license.txt','package_profile.json'):return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel in ('vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json')
              return rel.startswith(('admin/','config/','includes/','public/','templates/','tools/'))
          def inspect(path):
              with zipfile.ZipFile(path) as z:
                  assert z.testzip() is None
                  names=z.namelist();root='vf-tool-m3u8/'
                  assert all(n.startswith(root) and '..' not in PurePosixPath(n).parts for n in names)
                  files={}
                  for name in names:
                      if name.endswith('/'):continue
                      rel=name[len(root):]
                      if is_runtime(rel): files[rel]=hashlib.sha256(z.read(name)).hexdigest()
                  canonical=''.join(name+'\x00'+sha+'\n' for name,sha in sorted(files.items()))
                  return {'file_count':len(files),'fingerprint_sha256':hashlib.sha256(canonical.encode()).hexdigest()}
          old=inspect('package/old/vf-tools-m3u8_V1.25.91.zip')
          new=inspect('package/new/vf-tools-m3u8_V1.25.92.zip')
          assert old=={'file_count':568,'fingerprint_sha256':'98ea8cb7afa8f494c58b0c837230ad224d438bc3e48cd2f498d14a86e3af53d0'},old
          assert new['file_count']==568,new
          result={'status':'PASS','baseline_1_25_91':old,'candidate_1_25_92':new,'source':'EXACT_FORMAL_RELEASE_BYTES','production':'UNTOUCHED'}
          Path('proof/runtime-fingerprint.json').write_text(json.dumps(result,indent=2))
          print('RUNTIME_FINGERPRINT_AUTHORITY_EXACT_PASS',json.dumps(result))
          PY_PROOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-m3u8-runtime-fingerprint-${{ github.run_id }}
          path: proof/runtime-fingerprint.json
          retention-days: 14
