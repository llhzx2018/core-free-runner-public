name: P02 V2.5.13 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 7f0d29ef2932391ad065073fb5499af4e2ff08d3
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.13
        env:
          PRODUCT_REF: 7f0d29ef2932391ad065073fb5499af4e2ff08d3
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2513-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2513-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          # Move immutable V2.5.10 target to V2.5.13, then its V2.5.9 source to authenticated Production V2.5.12.
          s=s.replace('2.5.10','2.5.13')
          s=s.replace('2.5.9','2.5.12')
          s=s.replace('32225789953','32235881575')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 73')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
          end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.13 is a personal-workflow refinement release built for authenticated Production V2.5.12.\n\n- Explicit notebook category/scope switches now always start the middle title list at the top, while ordinary in-scope scrolling can still be remembered.\n- Scratch Tabs add low-noise pin/unpin and drag reorder.\n- Safe in-page shortcuts: Alt+N create, Alt+W close, Alt+J/K switch, Alt+R restore recently closed.\n- /scratch/ provides a bookmarkable direct entry to the temporary workspace.\n- Organize remains one-screen: note/article type, title and category in one flow.\n- Long articles still open at the top by default; an explicit “continue last reading position” affordance appears only when useful.\n- Reader H2 sections and standalone images can be collapsed on demand and remain expanded by default.\n- Candidate Build Run 32235094203 PASS and real Chromium Run 32235881575 PASS, including category-switch positioning, reader resume/folding, Scratch pin/order/shortcuts/recent reopen/organize, /scratch/, Fresh Install and 390px mobile overflow.\n- Exact authenticated Production source is V2.5.12. Dual-source Preflight Run 32236444110 already verified existing-data V2.5.12 → V2.5.13 with automatic backup, data/favorite/Scratch preservation, post-upgrade Scratch write/pin and SQLite integrity/FK.\n- Schema remains {SCHEMA}; no migration. Existing {SRCVER} sites use UPDATE.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2513-formal.sh"
