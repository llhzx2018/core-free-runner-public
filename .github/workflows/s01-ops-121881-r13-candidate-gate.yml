name: S01 Ops 1.21.881 R13 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      SOURCE_SHA: 43ea49f1d38f856ef5d1c89d0a17b5d5a13c4fbb
      VERSION: 1.21.881
      TAG: v1.21.881
      ASSET: vf-tools-ops_V1.21.881.zip
      CANDIDATE_RUN_ID: '35423645978'
      CANDIDATE_ARTIFACT_ID: '10579095668'
      EXPECTED_BYTES: '3435173'
      EXPECTED_SHA256: 26be3ee6b85a9f8a1733723c08dcc264d3b08758c3f2d15cfbf37963cf169d9c
      EXPECTED_RUNTIME_FILES: '954'
      EXPECTED_RUNTIME_FP: 1f59cb1cfa105aea30446569810de7c8ae7c41f659f4fa82c9f5293d071b9890

    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PASS_RELEASE_CREDENTIAL_PRESENCE

      - name: Checkout exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 43ea49f1d38f856ef5d1c89d0a17b5d5a13c4fbb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.881' ops/vf-ops.php
          grep -Fq 'S01-MATURE-ADMIN-V6-R13-REPEAT-INTERACTION-CLOSURE' ops/vf-ops.php
          grep -Fq '## V1.21.881 · Mature Admin V6 R13 Repeat Interaction Closure' ops/CHANGELOG.md
          php ops/tests/s01-v6-r13-repeat-interaction-closure-contract.php
          echo PASS_EXACT_RELEASE_SOURCE

      - name: Fetch exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/tested && mkdir -p /tmp/tested
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" \
            -o /tmp/tested-artifact.zip
          unzip -q /tmp/tested-artifact.zip -d /tmp/tested
          ZIP="$(find /tmp/tested -type f -name "$ASSET" -print -quit)"
          test -n "$ZIP"
          cp "$ZIP" "/tmp/$ASSET"
          test "$(stat -c %s "/tmp/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "/tmp/$ASSET" >/dev/null
          echo PASS_EXACT_TESTED_ARTIFACT_FETCH

      - name: Runtime Authority exact verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, os, zipfile
          p='/tmp/'+os.environ['ASSET']
          files={}
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.endswith('/'): continue
                  if not n.startswith('vf-ops/'): raise SystemExit('unexpected root: '+n)
                  rel=n[len('vf-ops/'):]
                  if rel: files[rel]=z.read(n)
          if len(files)!=int(os.environ['EXPECTED_RUNTIME_FILES']): raise SystemExit('runtime count mismatch')
          if b'Version: 1.21.881' not in files['vf-ops.php']: raise SystemExit('runtime version mismatch')
          h=hashlib.sha256()
          for rel,b in sorted(files.items()):
              h.update(rel.encode()); h.update(b'\0'); h.update(hashlib.sha256(b).hexdigest().encode()); h.update(b'\n')
          if h.hexdigest()!=os.environ['EXPECTED_RUNTIME_FP']: raise SystemExit('runtime fingerprint mismatch')
          print('PASS_RUNTIME_AUTHORITY_EXACT')
          PY

      - name: Verify tag and release absence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 31; fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 32; fi
          test "$(gh api "repos/$TARGET_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          echo PASS_RELEASE_ABSENCE_AND_TARGET

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Ops V1.21.881

          发布日期：2026-09-18（America/Los_Angeles）

          **Mature Admin V6 · R13 Repeat Interaction Closure**

          本轮收口 System 高级配置中的重复项交互：
          - 公开路径、历史域名、历史重定向的“移除”获得明确上下文与序号；
          - 新增、删除和重新编号后可访问名称同步更新；
          - 删除行后键盘焦点移动到相邻可编辑行，避免焦点掉到页面顶部；
          - 仅剩一行时清空而不移除，焦点保留；
          - 删除与启用区域扩大触控目标；
          - 字段名、校验规则、保存/检查协议和后端写入语义不变。

          Safety：
          - Schema 6.0.0 → 6.0.0
          - Data Migration NONE
          - Top-level six-domain IA UNCHANGED
          - Site Release save/test protocol UNCHANGED
          - Shared updater protocol UNCHANGED
          - M3U8 / Theme ownership UNCHANGED
          - Rollback v1.21.880
          - Candidate Gate $CANDIDATE_RUN_ID PASS
          - OWNER post-release Real-use NOT_RUN
          - Production installation NOT YET CLAIMED

          Runtime Authority：
          - Asset $ASSET
          - Bytes $EXPECTED_BYTES
          - SHA-256 $EXPECTED_SHA256
          - Runtime Files $EXPECTED_RUNTIME_FILES
          - Runtime Fingerprint $EXPECTED_RUNTIME_FP
          EOF
          created=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then gh release delete "$TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true; fi; exit "$rc"; }
          trap cleanup EXIT
          gh release create "$TAG" "/tmp/$ASSET#VF Tools Ops $VERSION Runtime Authority ZIP" \
            --repo "$TARGET_REPO" --target "$SOURCE_SHA" --title "VF Tools Ops V$VERSION" --notes-file /tmp/release-notes.md
          created=1
          trap - EXIT
          echo PASS_FORMAL_RELEASE_CREATED

      - name: Independent remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          PUBLISHED="$(jq -r '.published_at' <<<"$JSON")"
          test -n "$RID" && test "$RID" != null
          test -n "$AID" && test "$AID" != null
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$EXPECTED_BYTES"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          rm -rf /tmp/release-readback && mkdir -p /tmp/release-readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir /tmp/release-readback
          test "$(stat -c %s "/tmp/release-readback/$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "/tmp/release-readback/$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA256"
          cmp "/tmp/$ASSET" "/tmp/release-readback/$ASSET"
          unzip -tq "/tmp/release-readback/$ASSET" >/dev/null
          cat > /tmp/formal-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          CANDIDATE_RUN=$CANDIDATE_RUN_ID
          CANDIDATE_ARTIFACT_ID=$CANDIDATE_ARTIFACT_ID
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$EXPECTED_BYTES
          SHA256=$EXPECTED_SHA256
          RUNTIME_FILES=$EXPECTED_RUNTIME_FILES
          RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
          PUBLISHED_AT=$PUBLISHED
          REMOTE_ZIP_INTEGRITY=PASS
          TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS
          PRODUCTION=NOT_CLAIMED
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat /tmp/formal-release-receipt.txt
          echo PASS_S01_OPS_121881_FORMAL_RELEASE

      - name: Upload formal release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121881-formal-release-${{ github.run_id }}
          path: /tmp/formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
