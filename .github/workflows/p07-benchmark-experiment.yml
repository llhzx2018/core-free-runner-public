name: P07 Benchmark Experiment

on:
  push:
    branches:
      - experiment/p07-benchmark-v01
    paths:
      - experiments/p07-benchmark.sh
      - .github/workflows/p07-benchmark-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-benchmark-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: bash -n experiments/p07-benchmark.sh

      - name: Version
        run: |
          chmod +x experiments/p07-benchmark.sh
          ./experiments/p07-benchmark.sh --version | grep -F '0.2.0'

      - name: Self-test
        run: ./experiments/p07-benchmark.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: Demo disk safety UX
        run: |
          ./experiments/p07-benchmark.sh --demo --disk --yes | tee /tmp/disk.txt
          grep -F 'Test size      256 MiB' /tmp/disk.txt
          grep -F 'Temp cleanup   PASS' /tmp/disk.txt
          grep -F 'Seq write' /tmp/disk.txt
          grep -F 'Seq read' /tmp/disk.txt

      - name: tmpfs false-benchmark guard
        run: |
          set +e
          VF_BENCH_DIR=/dev/shm ./experiments/p07-benchmark.sh --disk --yes > /tmp/tmpfs.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F '不代表真实 VPS 磁盘性能' /tmp/tmpfs.txt

      - name: Demo network UX
        run: |
          ./experiments/p07-benchmark.sh --demo --network --yes | tee /tmp/network.txt
          grep -F 'Los Angeles US' /tmp/network.txt
          grep -F 'Suzhou CN' /tmp/network.txt
          grep -F 'Ningbo CN' /tmp/network.txt
          grep -F 'PASS' /tmp/network.txt
          grep -F 'FAIL' /tmp/network.txt

      - name: Supply-chain and mutation safety
        run: |
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-benchmark.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-benchmark.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-benchmark.sh
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-benchmark.sh

      - name: No legacy automatic 3 GiB write pattern
        run: |
          ! grep -F 'count=2048' experiments/p07-benchmark.sh
          grep -F 'DISK_MIB=256' experiments/p07-benchmark.sh
