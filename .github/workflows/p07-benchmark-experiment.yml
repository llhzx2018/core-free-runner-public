name: P07 Benchmark Experiment

on:
  push:
    branches:
      - experiment/p07-benchmark-v01
    paths:
      - experiments/p07-benchmark.sh
      - .github/workflows/p07-benchmark-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-benchmark-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: bash -n experiments/p07-benchmark.sh

      - name: Version
        run: |
          chmod +x experiments/p07-benchmark.sh
          ./experiments/p07-benchmark.sh --version | grep -F '0.4.0'

      - name: Self-test and compare contract
        run: ./experiments/p07-benchmark.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: Demo disk safety UX
        run: |
          rm -rf /tmp/p07-benchmark-state
          ./experiments/p07-benchmark.sh --demo --disk --yes | tee /tmp/disk.txt
          grep -F 'Test size      256 MiB' /tmp/disk.txt
          grep -F 'Temp cleanup   PASS' /tmp/disk.txt
          grep -F 'Seq write' /tmp/disk.txt
          grep -F 'Seq read' /tmp/disk.txt

      - name: tmpfs false-benchmark guard
        run: |
          set +e
          VF_BENCH_DIR=/dev/shm ./experiments/p07-benchmark.sh --disk --yes > /tmp/tmpfs.txt 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -F '不代表真实 VPS 磁盘性能' /tmp/tmpfs.txt

      - name: Demo network UX and reasons
        run: |
          ./experiments/p07-benchmark.sh --demo --network --yes | tee /tmp/network.txt
          grep -F 'Los Angeles US' /tmp/network.txt
          grep -F 'Suzhou CN' /tmp/network.txt
          grep -F 'Ningbo CN' /tmp/network.txt
          grep -F 'TIMEOUT' /tmp/network.txt

      - name: Structured per-node network history
        run: |
          f=$(find /tmp/p07-benchmark-state -type f -name 'network_*.json' | head -1)
          test -n "$f"
          python3 -c "import json,sys; p=json.load(open(sys.argv[1],encoding='utf-8')); assert p['version']=='0.4.0'; assert p['kind']=='network'; assert len(p['nodes'])>=9; s=[n for n in p['nodes'] if n['name']=='Suzhou CN'][0]; assert s['state']=='FAIL'; assert s['reason']=='TIMEOUT'" "$f"

      - name: Snapshot contract
        run: |
          ./experiments/p07-benchmark.sh --snapshot --label SOURCE --output /tmp/source.json
          python3 -c "import json; p=json.load(open('/tmp/source.json')); assert p['module']=='p07-benchmark-snapshot'; assert p['version']=='0.4.0'; assert p['label']=='SOURCE'; assert p['disk']; assert p['network']"

      - name: Compare regression verdict
        run: |
          python3 - <<'PY'
          import json
          s={'schema_version':1,'module':'p07-benchmark-snapshot','version':'0.4.0','label':'SOURCE','disk':{'seq_write_mb_s':'500','seq_read_mb_s':'800'},'network':{'nodes':[{'server_id':'1','name':'Node A','download_mbps':'1000','latency_ms':'50','state':'PASS'}]}}
          t={'schema_version':1,'module':'p07-benchmark-snapshot','version':'0.4.0','label':'TARGET','disk':{'seq_write_mb_s':'300','seq_read_mb_s':'500'},'network':{'nodes':[{'server_id':'1','name':'Node A','download_mbps':'600','latency_ms':'90','state':'PASS'}]}}
          json.dump(s,open('/tmp/cmp-source.json','w')); json.dump(t,open('/tmp/cmp-target.json','w'))
          PY
          ./experiments/p07-benchmark.sh --compare /tmp/cmp-source.json /tmp/cmp-target.json | tee /tmp/compare.txt
          grep -F 'Disk write' /tmp/compare.txt
          grep -F 'Node A' /tmp/compare.txt
          grep -F 'VERDICT REGRESSION' /tmp/compare.txt

      - name: History rendering
        run: |
          ./experiments/p07-benchmark.sh --history | tee /tmp/history.txt
          grep -F 'DISK' /tmp/history.txt
          grep -F 'NETWORK' /tmp/history.txt

      - name: Supply-chain and mutation safety
        run: |
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-benchmark.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-benchmark.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-benchmark.sh
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-benchmark.sh

      - name: Bounded write and timeout contract
        run: |
          ! grep -F 'count=2048' experiments/p07-benchmark.sh
          grep -F 'DISK_MIB=256' experiments/p07-benchmark.sh
          grep -F 'TIMEOUT_COMMAND_MISSING' experiments/p07-benchmark.sh
          grep -F 'with_timeout 55s' experiments/p07-benchmark.sh
