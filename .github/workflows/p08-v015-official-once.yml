name: P08 v014 final once-only official GitHub Release after verified native gates
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-official-once.yml
permissions:
  contents: read
jobs:
  issue-official-once:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/p08-v015-official-one-shot-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_REPO: llhzx2018/vf-adops
      TARGET_VERSION: '0.1.15'
      TARGET_SHA: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
      TARGET_TREE: 5d3fa9d901a699815e826065f3f27a83afb9ad9f
      P08_OLD_ISSUED_SHA: 6fae792864a594465e4b3224bd6d73abde976f12
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact public-safe one-case issuer identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Fail-closed single target lane audit before any private source
        run: |
          set -Eeuo pipefail
          python3 -B runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/p08-v015-official-one-shot-20261121.json
          python3 -B runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/p08-v015-official-one-shot-20261121.json --input runner/.github/workflows/p08-v015-official-once.yml
      - name: Checkout exact final P08 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout exact effective GOV Mode W
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 3c25384caeed4d14b09637321dbc3379008d92ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 and locked source builder
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all existing required real machine runs and live publishing safety
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          def require(ok,code):
              if not ok: raise RuntimeError('P08_V015_ISSUE_STOP_'+code)
          def api(path):
              p=subprocess.run(['gh','api',path],text=True,capture_output=True,timeout=90)
              require(p.returncode==0,'REMOTE_READ_'+path.rsplit('/',1)[-1])
              try: return json.loads(p.stdout)
              except ValueError: raise RuntimeError('P08_V015_ISSUE_STOP_INVALID_REMOTE_JSON')
          require(os.environ.get('GITHUB_ACTIONS')=='true' and len(os.environ.get('GH_TOKEN',''))>=20,'MISSING_APPROVED_RUNTIME_CREDENTIAL')
          runmap={
            44858425140:('3daa1c7f363c630246ca5b28232afecddd09b0f4',3),
            44858711566:('8083e377bffdbea1b3068caf84a67dab4526b9b9',3),
            44858273614:('2619a263671796dcb54b4a6a3c1a91507aca10c4',3),
            44858937236:('dc499311b1e2a3836c24023a7c2eefaf6cc53564',3),
            44857308114:('0d74149e825cc27938b7e0f142b7ab4e06df4425',1),
          }
          for n,(sha,count) in runmap.items():
              url='repos/llhzx2018/core-free-runner-public/actions/runs/'+str(n)
              run=api(url)
              require(run.get('head_sha')==sha and run.get('conclusion')=='success','PROOF_IDENTITY_'+str(n))
              jobs=api(url+'/jobs?per_page=100').get('jobs',[])
              require(len(jobs)==count and all(j.get('conclusion')=='success' for j in jobs),'PROOF_JOB_FAIL_'+str(n))
          prod='repos/llhzx2018/vf-adops'
          gov='repos/llhzx2018/gov-doc'
          upd='repos/llhzx2018/core-updates'
          require(api(prod+'/git/ref/heads/main')['object']['sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e','PRODUCT_MAIN_MOVED')
          require(api(gov+'/git/ref/heads/main')['object']['sha']=='3c25384caeed4d14b09637321dbc3379008d92ce','GOV_MAIN_MOVED')
          require(api(upd+'/contents/projects/P08-ADOPS.json?ref=main')['sha']=='08c4995864eae9b08c4f30420c99090c7c72e38d','OLD_CHANNEL_CHANGED')
          old=api(prod+'/releases/tags/v0.1.14')
          require(old.get('id')==452894503 and old.get('draft') is False and old.get('prerelease') is False,'ISSUED_OLD_RELEASE_CHANGED')
          assets={a.get('name'):a for a in old.get('assets',[])}
          require(assets.get('VF_AdOps_V0.1.14_FULL.zip',{}).get('id')==772420344,'ISSUED_OLD_FULL_ID_CHANGED')
          require(assets.get('VF_AdOps_V0.1.14_UPDATE.zip',{}).get('id')==772420348,'ISSUED_OLD_ATOMIC_ID_CHANGED')
          old_atomic=assets.get('VF_AdOps_V0.1.14_UPDATE.zip',{})
          require(old_atomic.get('digest') in (None,'sha256:7177496dc9322ded6c3fa53aa2c0a7eb5ac1f015531516b829d7c4d71e6e80af'),'ISSUED_OLD_ATOMIC_DIGEST_CHANGED')
          require(api(prod+'/git/ref/tags/v0.1.14')['object']['sha']=='6fae792864a594465e4b3224bd6d73abde976f12','ISSUED_OLD_TAG_CHANGED')
          for path in (prod+'/git/ref/tags/v0.1.15',prod+'/releases/tags/v0.1.15'):
              r=subprocess.run(['gh','api',path],capture_output=True,text=True,timeout=40)
              require(r.returncode!=0 and ('HTTP 404' in r.stderr or 'Not Found' in r.stderr),'TARGET_TAG_OR_RELEASE_ALREADY_EXISTS_OR_UNVERIFIED')
          print('P08_V015_ISSUE_PREPUBLICATION_ALL_3DB_BROWSER_FAULT_13DOMAIN_FINAL_PACKAGE=PASS')
          print('P08_V015_ISSUE_MAIN_GOV_PREVIOUS_TAG_CHANNEL_ABSENCE=PASS')
          PY
      - name: Build immutable true FULL UPDATE twice and provenance from exact final source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          test "$(git -C target rev-parse HEAD^{tree})" = 5d3fa9d901a699815e826065f3f27a83afb9ad9f
          test "$(git -C gov rev-parse HEAD)" = 3c25384caeed4d14b09637321dbc3379008d92ce
          test "$(cat target/VERSION)" = 0.1.15
          grep -Fq '| skill-release | V3.22 |' gov/CURRENT.md
          grep -Fq '## RP-07W' target/docs/authority/ACCEPTANCE_MATRIX.md
          tmp="$RUNNER_TEMP/p08-v015-immutable-issue"
          test ! -e "$tmp" && ! -L "$tmp"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/772420344 \
            -o "$tmp/previous-full.zip"
          test "$(sha256sum "$tmp/previous-full.zip" | cut -d' ' -f1)" = 2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b
          unzip -p "$tmp/previous-full.zip" FULL_MANIFEST.json > "$tmp/previous-manifest.json"
          test "$(sha256sum "$tmp/previous-manifest.json" | cut -d' ' -f1)" = efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b
          npm ci --prefix target --ignore-scripts --no-fund --no-audit > "$tmp/node.log" 2>&1
          npm run build --prefix target >> "$tmp/node.log" 2>&1
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader > "$tmp/composer.log" 2>&1
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          bash target/scripts/dev_check.sh > "$tmp/dev_check.log" 2>&1 || { echo P08_V015_ISSUE_STOP_DEV_CHECK;exit 41; }
          (
            cd target
            git diff --exit-code && git diff --cached --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php)
                  test -f "$f" && ! test -L "$f" && rm -- "$f";;
                *) echo P08_V015_ISSUE_UNEXPECTED_SOURCE; exit 27;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          for part in first second; do
            python3 -B target/scripts/build_full.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/full-$part.zip" \
              --version 0.1.15 --source-sha 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e \
              --governance-root "$GITHUB_WORKSPACE/gov"
            python3 -B target/scripts/build_atomic.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/update-$part.zip" \
              --source-version 0.1.14 --source-sha "$P08_OLD_ISSUED_SHA" \
              --source-full-manifest-sha256 efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b \
              --previous-full-manifest "$tmp/previous-manifest.json" \
              --target-version 0.1.15 --target-sha 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          done
          cmp "$tmp/full-first.zip" "$tmp/full-second.zip"
          cmp "$tmp/update-first.zip" "$tmp/update-second.zip"
          test "$(sha256sum "$tmp/full-first.zip" | cut -d' ' -f1)" = 538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73
          test "$(sha256sum "$tmp/update-first.zip" | cut -d' ' -f1)" = e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f
          mv "$tmp/full-first.zip" "$tmp/VF_AdOps_V0.1.15_FULL.zip"
          mv "$tmp/update-first.zip" "$tmp/VF_AdOps_V0.1.15_UPDATE.zip"
          rm "$tmp/full-second.zip" "$tmp/update-second.zip"
          unzip -tqq "$tmp/VF_AdOps_V0.1.15_FULL.zip"
          unzip -tqq "$tmp/VF_AdOps_V0.1.15_UPDATE.zip"
          cat > "$tmp/RELEASE_NOTES.md" <<'NOTES'
          # VF AdOps v0.1.15 — 系统更新页 UX、真实后台一键 Atomic

          空站首次安装请选择 FULL；已经安装的站点不要上传 FULL 覆盖。真实官方 v0.1.14 可通过原有后台「检查官方更新」→「一键安全升级」主动操作，备份优先的 code-only Atomic；页面打开不自动检查或执行安装。

          本次 Atomic 严格只接受 v0.1.14、源码 SHA 6fae792864a594465e4b3224bd6d73abde976f12、安装 FULL_MANIFEST SHA-256 efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b、Schema 1.1。已发行官方 v0.1.14 FULL 安装与已发行 v0.1.13→v0.1.14 Atomic 安装必须通过机器身份检查并证明清单一致；其它来源不支持跳升，不应手工修正来源清单。

          重点修复：主动作清楚、把历史升级成功和本次检查结果分开、状态读取失败有限次安全重查，保留原有 GitHub 授权、备份恢复、失败回滚及后台操作。原生 SQLite WAL/MySQL 8.4/MariaDB 11.8、原版 v0.1.14 PHP+Vue HTTPS Chromium 390/768/1440、真实备份/独立恢复/异常回滚/SIGKILL137 及 13 域安全证据均为发布前必检。

          只有本人 Preview/Real Use 验收依单案 Mode W 后置，仍然待完成。Production、CloudPanel、DNS、SSL 由 Owner 手工操作，无自动生产升级或要求每次 SSH 的正常流程。
          NOTES
          python3 - "$tmp" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1])
          full='VF_AdOps_V0.1.15_FULL.zip'
          update='VF_AdOps_V0.1.15_UPDATE.zip'
          sha=lambda s:hashlib.sha256((root/s).read_bytes()).hexdigest()
          with zipfile.ZipFile(root/full) as z:
            m=json.loads(z.read('FULL_MANIFEST.json'))
            assert m['type']=='CLEAN_FULL_ONLY' and m['data_included'] is False
            assert m['source_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
            assert m['target_version']=='0.1.15' and len(m['files'])>6100 and z.testzip() is None
          with zipfile.ZipFile(root/update) as z:
            m=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert m['type']=='P08_ATOMIC_CODE_ONLY_V1'
            assert m['source_version']=='0.1.14' and m['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['source_full_manifest_sha256']=='efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b'
            assert m['target_version']=='0.1.15' and m['target_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
            assert m['schema_changes'] is False and len(m['files'])>6100 and z.testzip() is None
          assert sha(full)=='538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73'
          assert sha(update)=='e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f'
          provenance=dict(project_id='P08',repository='llhzx2018/vf-adops',
            source_version='0.1.14',source_sha='6fae792864a594465e4b3224bd6d73abde976f12',
            source_full_manifest_sha256='efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b',
            target_version='0.1.15',target_sha='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e',
            target_tree_sha='5d3fa9d901a699815e826065f3f27a83afb9ad9f',
            governance_sha='3c25384caeed4d14b09637321dbc3379008d92ce',
            full_sha256=sha(full),atomic_sha256=sha(update),
            schema_changes=False,data_included=False,schema_from='1.1',schema_to='1.1',
            backup_required=True,rollback_supported=True,production_auto_apply=False,
            native_three_db_run=44858937236,final_source_package_run=44857308114,
            owner_preview='POST_RELEASE_REQUIRED_NOT_PASS',
            owner_real_use='POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS')
          (root/'RELEASE_PROVENANCE.json').write_text(json.dumps(provenance,sort_keys=True,indent=2)+'\n')
          names=[full,update,'RELEASE_PROVENANCE.json','RELEASE_NOTES.md']
          (root/'SHA256SUMS').write_text(''.join(sha(n)+'  '+n+'\n' for n in names))
          print('P08_V015_FINAL_OFFICIAL_BUILD_INPUTS=VERIFIED')
          PY
      - name: Official one-time GitHub Release followed by immutable remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_V015_RELEASE_ONCE: YES
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 - <<'PY'
          import json,hashlib,subprocess,os,sys
          from pathlib import Path
          def die(code):raise RuntimeError('P08_V015_ISSUE_STOP_'+code)
          def req(ok,code):
            if not ok:die(code)
          def cmd(*args):
            p=subprocess.run(args,capture_output=True,text=True,timeout=200)
            if p.returncode!=0:die('COMMAND_FAILED_'+args[0].upper().replace('-','_'))
            return p.stdout.strip()
          def api(path):return json.loads(cmd('gh','api',path))
          req(os.getenv('GITHUB_ACTIONS')=='true' and os.getenv('P08_V015_RELEASE_ONCE')=='YES','UNAUTHORIZED')
          root=Path(os.environ['RUNNER_TEMP'])/'p08-v015-immutable-issue'
          names=['VF_AdOps_V0.1.15_FULL.zip','VF_AdOps_V0.1.15_UPDATE.zip','RELEASE_PROVENANCE.json','RELEASE_NOTES.md','SHA256SUMS']
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          req(all((root/n).is_file() and not (root/n).is_symlink() for n in names),'FILES_MISSING')
          sums=set((root/'SHA256SUMS').read_text().splitlines())
          req(sums=={sha(root/n)+'  '+n for n in names[:-1]},'CHECKSUM_LIST')
          req(sha(root/names[0])=='538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73','FINAL_FULL_SHA')
          req(sha(root/names[1])=='e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f','FINAL_ATOMIC_SHA')
          req(api('repos/llhzx2018/vf-adops/git/ref/heads/main')['object']['sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e','MAIN_MOVED')
          req(api('repos/llhzx2018/gov-doc/git/ref/heads/main')['object']['sha']=='3c25384caeed4d14b09637321dbc3379008d92ce','GOV_MOVED')
          req(api('repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main')['sha']=='08c4995864eae9b08c4f30420c99090c7c72e38d','CHANNEL_MOVED')
          for url in ('repos/llhzx2018/vf-adops/git/ref/tags/v0.1.15','repos/llhzx2018/vf-adops/releases/tags/v0.1.15'):
            p=subprocess.run(['gh','api',url],capture_output=True,text=True,timeout=30)
            req(p.returncode!=0 and ('HTTP 404' in p.stderr or 'Not Found' in p.stderr),'TAG_ALREADY_EXISTS_OR_ACCESS_PROBLEM')
          cmd('gh','release','create','v0.1.15',*(str(root/n) for n in names),
            '-R','llhzx2018/vf-adops','--target','369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e',
            '--title','VF AdOps v0.1.15 — Native Owner Atomic',
            '--notes-file',str(root/'RELEASE_NOTES.md'))
          product='repos/llhzx2018/vf-adops'
          release=api(product+'/releases/tags/v0.1.15')
          req(release.get('tag_name')=='v0.1.15' and release.get('id',0)>0
              and release.get('draft') is False and release.get('prerelease') is False,
              'REMOTE_RELEASE_IDENTITY')
          req(api(product+'/git/ref/tags/v0.1.15')['object']['sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e','REMOTE_TAG_SHA')
          assets={a.get('name'):a for a in release.get('assets',[])}
          req(set(assets)==set(names),'REMOTE_ASSET_SET')
          for name in names:
            a=assets[name];p=root/name
            req(isinstance(a.get('id'),int) and a['id']>0 and a.get('size')==p.stat().st_size,'REMOTE_SIZE_OR_ID')
            req(a.get('digest') in (None,'sha256:'+sha(p)),'REMOTE_DIGEST')
          dest=root/'remote';dest.mkdir(mode=0o700)
          cmd('gh','release','download','v0.1.15','-R','llhzx2018/vf-adops','-D',str(dest))
          req({p.name for p in dest.iterdir()}==set(names),'REMOTE_DOWNLOAD_SET')
          for name in names:req(sha(dest/name)==sha(root/name),'REMOTE_ASSET_BYTES')
          req(api('repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json?ref=main')['sha']=='08c4995864eae9b08c4f30420c99090c7c72e38d','CHANNEL_PREMATURE_WRITE')
          print('P08_V015_OFFICIAL_RELEASE_ASSETS_REMOTE_REDOWNLOAD=PASS')
          print('P08_V015_RELEASE_ID='+str(release['id']))
          print('P08_V015_FULL_ASSET_ID='+str(assets[names[0]]['id']))
          print('P08_V015_FULL_BYTES='+str((root/names[0]).stat().st_size))
          print('P08_V015_UPDATE_ASSET_ID='+str(assets[names[1]]['id']))
          print('P08_V015_UPDATE_BYTES='+str((root/names[1]).stat().st_size))
          print('P08_V015_PRODUCTION_CLOUDPANEL_DNS=UNTOUCHED')
          PY
      - name: Always erase all source, secrets-bearing private test inputs and packages
        if: always()
        shell: bash
        run: |
          rm -rf -- runner target gov "$RUNNER_TEMP/p08-v015-immutable-issue"
          test ! -e target && test ! -e gov
          echo P08_V015_ISSUANCE_PRIVATE_CLEANUP=PASS
