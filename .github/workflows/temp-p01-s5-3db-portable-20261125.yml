name: TEMP P01 S5 portable exchange native SQLite MySQL MariaDB
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s5-3db-portable-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p01-s5-3db-portable-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-portable-s5:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s5-3db-portable-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: p01_s5_portable
          MYSQL_USER: vf_s5_fixture
          MYSQL_PASSWORD: synthetic_only_local_db_password
          MYSQL_ROOT_PASSWORD: synthetic_only_local_root_password
        ports: [ '33584:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
      mariadb118:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: p01_s5_portable
          MARIADB_USER: vf_s5_fixture
          MARIADB_PASSWORD: synthetic_only_local_db_password
          MARIADB_ROOT_PASSWORD: synthetic_only_local_root_password
        ports: [ '33585:3306' ]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - name: Checkout exact private P01 candidate only into ephemeral runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 632f12f9571f1971ee4931b4953c7032f6492c53
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact product source binding
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "632f12f9571f1971ee4931b4953c7032f6492c53"
          echo 'P01_POPULATED_EXACT_SOURCE=PASS'
      - name: PHP 8.4 and native SQLite MySQL MariaDB drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install exact locked PHP dependencies without ever claiming first install
        working-directory: private-src
        env:
          APP_ENV: testing
          VF_INSTALL_ALLOW_UNMARKED_DEV: 'true'
          VF_INSTALL_DEV_CLAIM_ENABLED: 'false'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(cat VERSION)" = '0.1.0-dev'
          test ! -e storage/app/private/vf-startnew/installed.json
          php -l tests/Feature/S5PortableExchangeCleanTargetTest.php >"$RUNNER_TEMP/p01-s5-lint.log" 2>&1
          echo 'P01_S5_3DB_TEST_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --no-ansi >"$RUNNER_TEMP/p01-s5-composer.log" 2>&1; then
            echo 'P01_S5_3DB_COMPOSER=FAIL'; exit 1
          fi
          echo 'P01_S5_3DB_COMPOSER=PASS'
          echo 'P01_S5_FIRST_OWNER_INSTALL_NOT_INVOKED=TRUE'
      - name: Real S5 exchange clean entity roundtrip and atomic conflict tests in three databases
        working-directory: private-src
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          VF_INSTALL_ALLOW_UNMARKED_DEV: 'true'
          VF_INSTALL_DEV_CLAIM_ENABLED: 'false'
          DB_HOST: '127.0.0.1'
          DB_DATABASE: p01_s5_portable
          DB_USERNAME: vf_s5_fixture
          DB_PASSWORD: synthetic_only_local_db_password
          DB_URL: ''
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test ! -e storage/app/private/vf-startnew/installed.json
          for engine in sqlite mysql mariadb; do
            export DB_CONNECTION="$engine"
            if [[ "$engine" = sqlite ]]; then
              export DB_DATABASE=':memory:'
              unset DB_PORT
            else
              export DB_DATABASE='p01_s5_portable'
              if [[ "$engine" = mysql ]]; then export DB_PORT=33584
              else export DB_PORT=33585; fi
              php -r '$d=getenv("DB_CONNECTION"); $p=(int)getenv("DB_PORT"); $c=new PDO("mysql:host=127.0.0.1;port=$p;dbname=p01_s5_portable","vf_s5_fixture",getenv("DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $v=strtolower((string)$c->query("select version()")->fetchColumn()); if (($d==="mysql" && str_contains($v,"mariadb"))||($d==="mariadb" && !str_contains($v,"mariadb"))) exit(47);'
            fi
            printf 'P01_S5_3DB_ENGINE_%s_PREFLIGHT=PASS\n' "$engine"
            if ! php artisan test tests/Feature/S5PortableExchangeCleanTargetTest.php --no-ansi >"$RUNNER_TEMP/p01-s5-portable-$engine.log" 2>&1; then
              printf 'P01_S5_3DB_ENGINE_%s=FAIL\n' "$engine"
              python3 - "$RUNNER_TEMP/p01-s5-portable-$engine.log" <<'PY'
          import pathlib,re,sys
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          for line in t.splitlines()[-70:]:
              if re.search(r'FAIL|Error|Failed|Expected|Assertion|Tests:|SQLSTATE',line,re.I):
                  print('P01_S5_3DB_SAFE_DIAG='+line.strip()[:200])
          PY
              exit 1
            fi
            python3 - "$RUNNER_TEMP/p01-s5-portable-$engine.log" "$engine" <<'PY'
          import pathlib,re,sys
          t=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          m=re.findall(r'(\d+) warnings? \((\d+) assertions?\)|(\d+) assertions?',t)
          print('P01_S5_3DB_'+sys.argv[2].upper()+'_ASSERTIONS='+str(m[-1] if m else 'unavailable')[:100])
          PY
            printf 'P01_S5_3DB_ENGINE_%s=PASS\n' "$engine"
          done
          test ! -e storage/app/private/vf-startnew/installed.json
          echo 'P01_S5_3DB_PORTABLE_THREE_ENGINE_ROUNDTRIP=PASS'
          echo 'P01_S5_NO_REAL_OWNER_FIRST_INSTALL=PASS'
      - name: Clean up all transient private source and synthetic diagnostics
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-s5-lint.log" "$RUNNER_TEMP/p01-s5-composer.log" "$RUNNER_TEMP/p01-s5-portable-"*".log"
          test ! -e private-src
          echo 'P01_S5_3DB_PRIVATE_CLEANUP=PASS'
