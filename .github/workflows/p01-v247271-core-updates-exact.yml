name: P01 V2.47.271 Core Updates Exact Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247271-core-updates-exact.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.271 core-updates exact fallback')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null

      - name: Clone exact core-updates candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin fbacd1e002ad244b60cc8915d5f61e06da8e1199
          git -C candidate checkout -q --detach fbacd1e002ad244b60cc8915d5f61e06da8e1199
          test "$(git -C candidate rev-parse HEAD)" = "fbacd1e002ad244b60cc8915d5f61e06da8e1199"
          echo CORE_UPDATES_EXACT_SOURCE=PASS

      - name: Run canonical core-updates CI commands
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS

      - name: Verify P01 manifest exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.270" and
            .target_version=="2.47.271" and
            .update_type=="ATOMIC" and
            .from_versions==["2.47.270"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .repository=="llhzx2018/vf-start" and
            .release_tag=="v2.47.271" and
            .release_id==404913743 and
            .product_identity=="4d896880d5ab21a907fb034b3efaa257e7202cbf" and
            .asset_name=="VF_Start_V2.47.271_UPDATE.zip" and
            .asset_bytes==2369915 and
            .asset_sha256=="436e8fb67ecf7d4043e587b6e938577a121de765ae2da42390fd0db8ec1d3fca" and
            .backup_required==true and
            .rollback_supported==true and
            .minimum_php=="8.0.0"
          ' candidate/projects/P01.json >/dev/null
          echo P01_V247271_MANIFEST_IDENTITY=PASS

      - name: Verify bounded distribution delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q origin main
          git -C candidate diff --name-only 81da81da4dc3668a9879d71244bd563ac40e3bc8..fbacd1e002ad244b60cc8915d5f61e06da8e1199 | tee /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt | tr -d ' ')" = "1"
          grep -Fx 'projects/P01.json' /tmp/changed.txt
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
