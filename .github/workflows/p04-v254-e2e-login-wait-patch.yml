name: P04 V2.5.4 E2E Login Wait Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-login-wait-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login wait to app DOM
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old="""await Promise.all([\n  page.waitForURL(/index\\.php|\\/$/, { timeout: 30000 }),\n  page.getByRole('button', { name: '登录' }).click(),\n]);\nawait page.waitForSelector('.nav-item[data-nav=\"dashboard\"]');"""
          new="""await page.getByRole('button', { name: '登录' }).click();\nawait page.waitForSelector('.nav-item[data-nav=\"dashboard\"]', { timeout: 30000 });"""
          if s.count(old)!=1: raise SystemExit('login wait sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): wait on V2.5.4 app DOM after login'
          git push origin HEAD:main
