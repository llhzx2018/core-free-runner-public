name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-operations163-20261022]
    paths: ['.github/workflows/s01-operations163-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.163
  TARGET_SHA: c111556c137865d5d523fff2fbd52b57f9f77db3
  TARGET_TREE: 763b59e904cdbbbda3f0b64dcfa772c545c8fe53
  BASE_SHA: 2be0168bce3d4ba4e9880f06bff532479a3c5ad0
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: c111556c137865d5d523fff2fbd52b57f9f77db3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39703936140 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39703936140 --jq .head_sha)" = 34a955e588d13ed8a5498b44c821c1ce5be5dd5f
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39703936140 --repo llhzx2018/core-free-runner-public --name s01-operations-39703936140 --dir candidate-proof
          python3 control/lanes/s01-operations163-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='140bda041b11afc6946b2c88e67d599aaa4c91cd16be50bc7778b0a1861bc31a' and new['bytes']==1975655
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.163 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.163 provider/vf-tools-theme_V1.35.163.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.163' --notes '页面总览聚焦正式运营：紧凑列表提供页型、简短范围、编辑和查看入口；移出研发版本、测试证据、原型和人工验收说明。具体范围按需展开，原检查记录从既有验证维护页进入，保存及旧深链保留。定向后台交互、干净安装、162→163升级回退重复安装与数据保护验证通过后发布。M3U8保持1.25.94，Owner手工升级Production，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.163 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.163 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.163 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.163.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.163.zip remote/vf-tools-theme_V1.35.163.zip
          echo '140bda041b11afc6946b2c88e67d599aaa4c91cd16be50bc7778b0a1861bc31a  remote/vf-tools-theme_V1.35.163.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.163.zip)" = 1975655
          gh release view v1.35.163 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
