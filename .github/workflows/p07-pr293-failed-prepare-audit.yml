name: P07 PR293 Failed Prepare Read-only Audit Exact Source
on:
  pull_request:
    paths: ['.github/workflows/p07-pr293-failed-prepare-audit.yml']
permissions:
  contents: read
jobs:
  failed-prepare-audit:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Private exact-source checkout into disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: caa510ec710d058bb43ec2a741815b551cc6d564
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-exact
          fetch-depth: 1
      - name: Prove isolated forensic read-only, ownership safety and fail-closed CLI/UI
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p07-exact
          test "$(git rev-parse HEAD)" = caa510ec710d058bb43ec2a741815b551cc6d564
          export PYTHONDONTWRITEBYTECODE=1
          bash -n bin/vfops bin/vfops-migrate-ui
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              'lib/migration_failed_prepare_audit.py',
              'lib/server_migration_pull.py',
              'tests/test_migration_failed_prepare_audit.py',
          ):
              ast.parse(Path(name).read_text(encoding='utf-8'), filename=name)
          print('P07_AUDIT_SOURCE_SYNTAX_PASS')
          PY
          python3 -B -m unittest -q tests.test_migration_failed_prepare_audit tests.test_migration_no_overwrite_resume
          python3 -B lib/server_migration_pull.py failed-prepare-audit --help | grep -F -- '--migration-id'
          grep -F '单站失败迁移只读核验' bin/vfops-migrate-ui >/dev/null
          echo 'P07_FAILED_PREPARE_READONLY_AUDIT_EXACT_MACHINE_PASS'
      - name: Cleanup private checkout even if prior checks fail
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p07-exact
          echo 'P07_PRIVATE_SOURCE_CLEANUP_DONE'
