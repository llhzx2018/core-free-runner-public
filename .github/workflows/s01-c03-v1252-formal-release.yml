name: S01-C03 M3U8 V1.25.2 Formal Release

on:
  push:
    branches: [task/s01-c03-v1252-formal-release]
    paths:
      - '.github/workflows/s01-c03-v1252-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c03-m3u8-v1252-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-tools-m3u8
      PRODUCT_COMMIT: d13fa95047dee2eaa16a7e64bab74c7d06420de9
      PRODUCT_TREE: 718c5bff889cef35843d934edd93873c8b1dc04f
      PRODUCT_MAIN: a78bb60695f3cd3f8131413b4f0bbc3c9e6a023f
      TAG: v1.25.2
      ASSET_NAME: vf-tools-m3u8_V1.25.2.zip
      EXPECTED_FILES: '548'
      EXPECTED_BYTES: '3520025'
      EXPECTED_SHA: 857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf
      EXPECTED_RUNTIME_FILES: '546'
      EXPECTED_RUNTIME_FP: dec3da20c89fb79df16f7fe233f7d0709270e1723bf9872adeb77380fc373548
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact verified candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild exact tested artifact and lock identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C m3u8 rev-parse HEAD:src)" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.2'
          mkdir -p "$RUNNER_TEMP/m3u8-release"
          python3 - m3u8/src "$RUNNER_TEMP/m3u8-release/$ASSET_NAME" "$RUNNER_TEMP/m3u8-release/meta.json" <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json,sys
          src=Path(sys.argv[1]); out=Path(sys.argv[2]); meta=Path(sys.argv[3])
          files=sorted([p for p in src.rglob('*') if p.is_file()],key=lambda p:p.relative_to(src).as_posix())
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              zi=zipfile.ZipInfo('vf-tool-m3u8/');zi.date_time=(1980,1,1,0,0,0);zi.external_attr=(0o40755<<16)|0x10;z.writestr(zi,b'')
              for p in files:
                  zi=zipfile.ZipInfo('vf-tool-m3u8/'+p.relative_to(src).as_posix());zi.date_time=(1980,1,1,0,0,0);zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,p.read_bytes())
          def is_runtime(rel):
              parts=rel.replace('\\','/').split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): return False
              b=parts[-1].lower()
              if b in {'readme.md','changelog.md','license','license.txt','package_profile.json'}: return False
              if b.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')): return False
              if len(parts)==1: return rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              return parts[0] in {'admin','config','includes','public','templates','tools'}
          rows=[]
          for p in files:
              rel=p.relative_to(src).as_posix()
              if is_runtime(rel): rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canon=''.join(f'{p}\0{h}\n' for p,h in rows).encode()
          m={'files':len(files),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'runtime_files':len(rows),'runtime_fingerprint':hashlib.sha256(canon).hexdigest()}
          meta.write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
          python3 - "$RUNNER_TEMP/m3u8-release/meta.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['files']==548
          assert m['bytes']==3520025
          assert m['sha256']=='857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf'
          assert m['runtime_files']==546
          assert m['runtime_fingerprint']=='dec3da20c89fb79df16f7fe233f7d0709270e1723bf9872adeb77380fc373548'
          PY
          unzip -t "$RUNNER_TEMP/m3u8-release/$ASSET_NAME" >/dev/null
          echo 'TESTED_ARTIFACT_IDENTITY=PASS'

      - name: Create formal tag release asset and remote exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH_READ=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          AUTH_WRITE=(-H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ASSET="$RUNNER_TEMP/m3u8-release/$ASSET_NAME"
          TAG_CREATED=0; RELEASE_ID=''; ASSET_ID=''
          cleanup_failure(){
            rc=$?
            if [ "$rc" -ne 0 ]; then
              [ -z "$RELEASE_ID" ] || curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/releases/$RELEASE_ID" >/dev/null || true
              [ "$TAG_CREATED" != 1 ] || curl -sS -X DELETE "${AUTH_WRITE[@]}" "$API/git/refs/tags/$TAG" >/dev/null || true
            fi
            exit "$rc"
          }
          trap cleanup_failure EXIT

          test "$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH_READ[@]}" "$API/git/ref/tags/$TAG")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH_READ[@]}" "$API/releases/tags/$TAG")" = 404
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

          python3 - "$PRODUCT_COMMIT" > "$RUNNER_TEMP/tag.json" <<'PY'
          import json,sys
          print(json.dumps({'ref':'refs/tags/v1.25.2','sha':sys.argv[1]}))
          PY
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/tag.json" "$API/git/refs" > "$RUNNER_TEMP/tag-response.json"
          TAG_CREATED=1
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-response.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"

          cat > "$RUNNER_TEMP/release.json" <<'JSON'
          {
            "tag_name":"v1.25.2",
            "target_commitish":"d13fa95047dee2eaa16a7e64bab74c7d06420de9",
            "name":"VF Tools M3U8 V1.25.2",
            "body":"S01-C03 · VF Tools M3U8 V1.25.2\n\nClassification: REAL WORDPRESS NATIVE ONLINE UPDATE VERIFICATION RELEASE\n\nAuthorized source baseline: 1.25.1 only.\nSchema: 1.2.0 → 1.2.0.\nPhysical locator: vf-tool-m3u8/vf-tool-m3u8.php.\nLocator cutover: NO.\nProduction current truth: 1.25.1 / Active (user-confirmed).\nProduction update: NOT EXECUTED in this release round.",
            "draft":true,
            "prerelease":false
          }
          JSON
          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" "$API/releases" > "$RUNNER_TEMP/release-response.json"
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/release-response.json'"))["id"])')"
          test -n "$RELEASE_ID"

          curl --fail-with-body -sS -X POST "${AUTH_WRITE[@]}" -H 'Content-Type: application/zip' --data-binary @"$ASSET" "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME" > "$RUNNER_TEMP/asset-response.json"
          ASSET_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["id"])')"
          test -n "$ASSET_ID"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["size"])')" = "$EXPECTED_BYTES"

          code="$(curl -sS -L -o "$RUNNER_TEMP/remote-$ASSET_NAME" -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" || true)"
          if [ "$code" != 200 ]; then
            curl --fail-with-body -sS -L -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" -o "$RUNNER_TEMP/remote-$ASSET_NAME"
          fi
          test "$(stat -c %s "$RUNNER_TEMP/remote-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/remote-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          cmp -s "$ASSET" "$RUNNER_TEMP/remote-$ASSET_NAME"
          echo 'REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS'

          echo '{"draft":false,"prerelease":false}' > "$RUNNER_TEMP/publish.json"
          curl --fail-with-body -sS -X PATCH "${AUTH_WRITE[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish.json" "$API/releases/$RELEASE_ID" > "$RUNNER_TEMP/published.json"
          python3 - "$RUNNER_TEMP/published.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['tag_name']=='v1.25.2'; assert x['name']=='VF Tools M3U8 V1.25.2'; assert x['draft'] is False; assert x['prerelease'] is False
          PY

          curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/git/ref/tags/$TAG" > "$RUNNER_TEMP/final-tag.json"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/final-tag.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"
          curl --fail-with-body -sS "${AUTH_READ[@]}" "$API/releases/tags/$TAG" > "$RUNNER_TEMP/final-release.json"
          python3 - "$RUNNER_TEMP/final-release.json" "$RELEASE_ID" "$ASSET_ID" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); rid=int(sys.argv[2]); aid=int(sys.argv[3])
          assert x['id']==rid and x['tag_name']=='v1.25.2' and x['draft'] is False and x['prerelease'] is False
          a=[a for a in x['assets'] if a['name']=='vf-tools-m3u8_V1.25.2.zip']
          assert len(a)==1 and a[0]['id']==aid and a[0]['size']==3520025
          if a[0].get('digest'): assert a[0]['digest']=='sha256:857eb4706f06a79b2eee0260fe144da7d8b6d43d2ab40fe310fcace3f72106bf'
          PY
          FINAL_ASSET_ID="$(python3 -c 'import json;x=json.load(open("'$RUNNER_TEMP/final-release.json'"));print([a["id"] for a in x["assets"] if a["name"]=="vf-tools-m3u8_V1.25.2.zip"][0])')"
          curl --fail-with-body -sS -L -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$FINAL_ASSET_ID" -o "$RUNNER_TEMP/final-$ASSET_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/final-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/final-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          cmp -s "$ASSET" "$RUNNER_TEMP/final-$ASSET_NAME"
          trap - EXIT
          echo "FORMAL_RELEASE_ID=$RELEASE_ID"
          echo "FORMAL_ASSET_ID=$ASSET_ID"
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'

      - name: Confirm product main remained unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(curl --fail -sS -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/branches/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$MAIN_SHA" = "$PRODUCT_MAIN"
          echo "PRODUCT_MAIN_UNCHANGED=$MAIN_SHA"
