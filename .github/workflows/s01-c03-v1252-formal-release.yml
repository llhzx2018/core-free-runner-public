name: S01-C03 M3U8 V1.25.5 Formal Release

on:
  push:
    branches: [task/s01-c03-v1252-formal-release]
    paths:
      - '.github/workflows/s01-c03-v1252-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c03-m3u8-v1255-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-tools-m3u8
      PRODUCT_COMMIT: d7b67319ae3c0b077d39d0f84df3facd38a2c44d
      PRODUCT_TREE: 2efc783534f38a2b0071066adb403146766c2533
      TAG: v1.25.5
      ASSET_NAME: vf-tools-m3u8_V1.25.5.zip
      EXPECTED_FILES: '550'
      EXPECTED_BYTES: '3529023'
      EXPECTED_SHA: f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Credential authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'

      - name: Checkout exact formal main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Rebuild exact Gate artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C m3u8 rev-parse HEAD:src)" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = '1.25.5'
          mkdir -p "$RUNNER_TEMP/m3u8-release"
          python3 - m3u8/src "$RUNNER_TEMP/m3u8-release/$ASSET_NAME" "$RUNNER_TEMP/m3u8-release/meta.json" <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json,sys
          src=Path(sys.argv[1]); out=Path(sys.argv[2]); meta=Path(sys.argv[3])
          files={p.relative_to(src).as_posix():p.read_bytes() for p in src.rglob('*') if p.is_file() and not p.is_symlink()}
          files=dict(sorted(files.items()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo(f'vf-tool-m3u8/{rel}',(2026,9,2,0,0,0))
                  zi.compress_type=zipfile.ZIP_DEFLATED
                  zi.external_attr=0o100644<<16
                  z.writestr(zi,b)
          m={'files':len(files),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest()}
          meta.write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY
          python3 - "$RUNNER_TEMP/m3u8-release/meta.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['files']==550
          assert m['bytes']==3529023
          assert m['sha256']=='f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399'
          PY
          unzip -t "$RUNNER_TEMP/m3u8-release/$ASSET_NAME" >/dev/null
          echo 'GATE_ARTIFACT_REBUILD=PASS'

      - name: Publish exact Tag Release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$REPO"
          R=(-H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          W=(-H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ASSET="$RUNNER_TEMP/m3u8-release/$ASSET_NAME"
          TAG_CREATED=0; RELEASE_ID=''; ASSET_ID=''
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then [ -z "$RELEASE_ID" ] || curl -sS -X DELETE "${W[@]}" "$API/releases/$RELEASE_ID" >/dev/null || true; [ "$TAG_CREATED" != 1 ] || curl -sS -X DELETE "${W[@]}" "$API/git/refs/tags/$TAG" >/dev/null || true; fi; exit "$rc"; }
          trap cleanup EXIT

          test "$(curl -sS -o /dev/null -w '%{http_code}' "${R[@]}" "$API/git/ref/tags/$TAG")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${R[@]}" "$API/releases/tags/$TAG")" = 404
          echo 'REMOTE_RELEASE_PREFLIGHT=PASS'

          python3 - "$PRODUCT_COMMIT" > "$RUNNER_TEMP/tag.json" <<'PY'
          import json,sys
          print(json.dumps({'ref':'refs/tags/v1.25.5','sha':sys.argv[1]}))
          PY
          curl --fail-with-body -sS -X POST "${W[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/tag.json" "$API/git/refs" > "$RUNNER_TEMP/tag-response.json"
          TAG_CREATED=1
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-response.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"

          cat > "$RUNNER_TEMP/release.json" <<'JSON'
          {
            "tag_name":"v1.25.5",
            "target_commitish":"d7b67319ae3c0b077d39d0f84df3facd38a2c44d",
            "name":"VF Tools M3U8 V1.25.5",
            "body":"V1.25.5 = S01 DIAGNOSTIC-FIRST PROVIDER SCHEMA RECOVERY RELEASE.\n\n- Promotes the formally verified diagnostic-first Provider Schema recovery to the release line.\n- Unhealthy Provider Schema state suppresses implicit admin_init mutation; diagnostics remain read-only and explicit repair is capability/nonce/repairAllowed gated.\n- Provider Schema remains 1.3.0; no schema-version bump.\n- Legacy shared-schema migration and Ops platform schema preservation: PASS.\n- Release identity: 1.25.5 / R229.\n- Formal Pre-Release Gate run 33641145641: PASS on WordPress 7.1 / MariaDB 11.4.\n- Owner Golden Path / diagnostic behavior matrix / static recovery contract: PASS.\n- Package SHA256: f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399.\n- core-updates publication is handled separately after Release readback.\n- Production upgrade/write: NOT EXECUTED by this Release step.",
            "draft":true,
            "prerelease":false
          }
          JSON
          curl --fail-with-body -sS -X POST "${W[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" "$API/releases" > "$RUNNER_TEMP/release-response.json"
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/release-response.json'"))["id"])')"

          curl --fail-with-body -sS -X POST "${W[@]}" -H 'Content-Type: application/zip' --data-binary @"$ASSET" "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME" > "$RUNNER_TEMP/asset-response.json"
          ASSET_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["id"])')"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["size"])')" = "$EXPECTED_BYTES"

          code="$(curl -sS -L -o "$RUNNER_TEMP/remote-$ASSET_NAME" -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" || true)"
          if [ "$code" != 200 ]; then curl --fail-with-body -sS -L -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$ASSET_ID" -o "$RUNNER_TEMP/remote-$ASSET_NAME"; fi
          test "$(stat -c %s "$RUNNER_TEMP/remote-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/remote-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          cmp -s "$ASSET" "$RUNNER_TEMP/remote-$ASSET_NAME"
          echo 'REMOTE_ASSET_EXACT_READBACK_BEFORE_PUBLISH=PASS'

          echo '{"draft":false,"prerelease":false}' > "$RUNNER_TEMP/publish.json"
          curl --fail-with-body -sS -X PATCH "${W[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish.json" "$API/releases/$RELEASE_ID" > "$RUNNER_TEMP/published.json"

          curl --fail-with-body -sS "${R[@]}" "$API/git/ref/tags/$TAG" > "$RUNNER_TEMP/final-tag.json"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/final-tag.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"
          curl --fail-with-body -sS "${R[@]}" "$API/releases/tags/$TAG" > "$RUNNER_TEMP/final-release.json"
          python3 - "$RUNNER_TEMP/final-release.json" "$RELEASE_ID" "$ASSET_ID" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); rid=int(sys.argv[2]); aid=int(sys.argv[3])
          assert x['id']==rid and x['tag_name']=='v1.25.5' and x['name']=='VF Tools M3U8 V1.25.5'
          assert x['draft'] is False and x['prerelease'] is False
          a=[a for a in x['assets'] if a['name']=='vf-tools-m3u8_V1.25.5.zip']
          assert len(a)==1 and a[0]['id']==aid and a[0]['size']==3529023
          if a[0].get('digest'): assert a[0]['digest']=='sha256:f2dc1c720370ee6a7316e5e9ca99db0901d25b94b45a6e675724045759728399'
          PY
          FINAL_ASSET_ID="$(python3 -c 'import json;x=json.load(open("'$RUNNER_TEMP/final-release.json'"));print([a["id"] for a in x["assets"] if a["name"]=="vf-tools-m3u8_V1.25.5.zip"][0])')"
          curl --fail-with-body -sS -L -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "$API/releases/assets/$FINAL_ASSET_ID" -o "$RUNNER_TEMP/final-$ASSET_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/final-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/final-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          cmp -s "$ASSET" "$RUNNER_TEMP/final-$ASSET_NAME"
          trap - EXIT
          echo "FORMAL_RELEASE_ID=$RELEASE_ID"
          echo "FORMAL_ASSET_ID=$ASSET_ID"
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'

      - name: Confirm product main unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(curl --fail -sS -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/branches/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$MAIN_SHA" = "$PRODUCT_COMMIT"
          echo "PRODUCT_MAIN_UNCHANGED=$MAIN_SHA"
