name: P01 V2.21.15 Candidate Authority Alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.15-authority-align.yml'
      - 'requests/p01-v2.21.15-authority-align-*.txt'

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: 944cb1fb8d52377ec36db8d35aa8e5acb69570b1
    steps:
      - name: Checkout exact P01 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p01

      - name: Guard candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.15'
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = '2.21.15'
          test "$(python3 -c 'import json;print(json.load(open("p01/VF_PROJECT.json"))["production_version"])')" = '2.21.14'

      - name: Align Current Authority without rewriting Production truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('p01/VF_PROJECT.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['production_version']=='2.21.14'
          x['status']='CANDIDATE_VALIDATION'
          x['working_version']='2.21.15'
          x['candidate_version']='2.21.15'
          x['candidate_state']='UPDATE_CORE_INTEGRATION / RUNNER VERIFIED / FORMAL RELEASE GATES PENDING'
          x['schema_version']='2026080902'
          x['component_versions']['browser_helper']='1.6.4'
          x['development_process']='vf-dev V8.1 / user-current execution contract'
          x['release_process']='vf-release V2.2 / GitHub Release + core-updates unified online update path'
          x['current_phase']='V2.21.15 CANDIDATE VALIDATION / PRODUCTION 2.21.14 UNCHANGED'
          x['verified_release_ready']=False
          x['formal_artifact_gate']='PENDING_FINAL_ARTIFACT_REVERSE_VERIFICATION'
          x['release_gates']['formal_ed25519_signature']='RETIRED_AS_CURRENT_STANDARD'
          x['release_gates']['formal_ed25519_signature_reason']='Historical evidence only. Current standard is core-updates + GitHub Release identity + asset bytes + SHA-256.'
          x['release_gates']['rel_cg_candidate']='PASS_UPDATE_CORE_MATRIX'
          x['release_gates']['rel_cg_build']='PENDING_2.21.15_FORMAL_BYTES'
          x['release_gates']['rel_cg_verification']='PENDING_2.21.15_FORMAL_BYTES'
          x['release_gates']['rel_cg_ready']='PENDING_2.21.15_FORMAL_BYTES'
          x['release_gates']['rel_cg_promotion']='NOT_EXECUTED'
          x['release_gates']['rel_cg_finalize']='NOT_EXECUTED'
          x['release_gates']['rel_cg_publication']='NOT_EXECUTED'
          x['release_gates']['final_online_pass']='NO_NOT_PRODUCTION_UPGRADED'
          x['release_signing']['state']='HISTORICAL_ONLY_NOT_CURRENT_STANDARD'
          x['release_signing']['infrastructure']='NOT_REQUIRED_BY_CURRENT_UPDATE_STANDARD'
          x['repository_block']=[]
          x['project_block']=[]
          x['update_system']={
            'classification':'D_LEGACY_BRIDGE_REQUIRED_WITH_MINIMAL_CODE_INTEGRATION',
            'project_id':'P01','component_id':'APP','target_version':'2.21.15',
            'production_version':'2.21.14','schema_from':'2026080902','schema_to':'2026080902',
            'manifest_truth':'llhzx2018/core-updates/projects/P01.json',
            'release_truth':'GitHub Release',
            'read_credential':'VF_PRIVATE_READ_TOKEN','write_credential':'VF_RELEASE_WRITE_TOKEN',
            'public_runner':'llhzx2018/core-free-runner-public','private_runner':'llhzx2018/core-free-runner-private',
            'browser_extension_unit':'INDEPENDENT / 1.6.4 / UNCHANGED',
            'legacy_updates_kewaro':'RETIRED_FROM_CURRENT_APP_PATH',
            'legacy_ed25519':'HISTORICAL_ONLY',
            'production_bridge':'REQUIRED_ONCE_BEFORE_2.21.14_CAN_DISCOVER_2.21.15',
            'production_upgrade':'NOT_EXECUTED'
          }
          findings=list(x.get('current_findings') or [])
          for item in ['V2.21.15_UPDATE_CORE_INTEGRATED','P02_PROVEN_UPDATE_CORE_PROTOCOL_REUSED','UNIFIED_TWO_TOKEN_GOVERNANCE','PUBLIC_RUNNER_UPDATE_CORE_MATRIX_PASS','PRIVATE_RUNNER_ALLOCATION_INFRASTRUCTURE_FAILURE_NON_PROJECT_BLOCK','BROWSER_EXTENSION_1.6.4_UNCHANGED']:
              if item not in findings: findings.append(item)
          x['current_findings']=findings
          x['formal_release_complete']=False
          x['formal_tag_created']=False
          x['publication_completed']=False
          x['main_candidate_promotion']=False
          x['next_action']='V2.21.15 FORMAL CANDIDATE + RELEASE ARTIFACT REVERSE VERIFICATION'
          x['current_authority']='ALIGNED_FOR_V2.21.15_CANDIDATE'
          x['current_state']='V2.21.15_CANDIDATE_VALIDATION'
          x['lifecycle']='CANDIDATE_VALIDATION'
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ssot=Path('p01/docs/authority/SSOT.md')
          s=ssot.read_text(encoding='utf-8')
          anchor='# 0.00 CURRENT · 2026-08-15 V2.21.14 Production Seal\n'
          assert s.count(anchor)==1
          block='''# 0.000 CURRENT · 2026-08-15 V2.21.15 Unified Update Candidate\n\n```text\nProduction: 2.21.14 / Schema 2026080902 / main Truth UNCHANGED\nWorking / Candidate: 2.21.15 / Schema 2026080902\nCandidate Scope: P01 APP unified online update integration only\nUpdate Classification: D · LEGACY BRIDGE REQUIRED + minimal code integration\nUpdate Manifest Truth: llhzx2018/core-updates/projects/P01.json\nFormal UPDATE Asset Truth: GitHub Release\nRead Credential: VF_PRIVATE_READ_TOKEN\nWrite Credential: VF_RELEASE_WRITE_TOKEN\nRunner: core-free-runner-public + core-free-runner-private (private runner allocation currently infrastructure-failed)\nLegacy updates.kewaro.com: RETIRED FROM CURRENT APP PATH\nLegacy Ed25519: HISTORICAL ONLY / NOT CURRENT STANDARD\nBrowser Extension: 1.6.4 / INDEPENDENT / UNCHANGED\nCandidate Update Core Matrix: PASS\nFormal Release Artifacts: PENDING FINAL BYTE VERIFICATION\nProduction Discovery Bridge: REQUIRED ONCE / NOT DEPLOYED\nProduction Upgrade: NOT EXECUTED\nmain Promotion: FORBIDDEN UNTIL REAL PRODUCTION UPGRADE + READBACK PASS\nProject Block: NONE\n```\n\n本节仅覆盖当前工程施工状态，不覆盖下面 V2.21.14 已完成的 Production Seal。V2.21.14 仍是唯一 Production Truth；2.21.15 在真实线上升级与回读前不得写成 Production PASS。\n\n'''
          s=s.replace(anchor,block+anchor)
          s=s.replace('**SSOT Revision**：`R2026.08.15-V22114-PRODUCTION-CURRENT-SEAL`','**SSOT Revision**：`R2026.08.15-V22115-UPDATE-CORE-CANDIDATE`',1)
          s=s.replace('**Development Source Baseline**：`VF Start V2.21.14 · CURRENT ENGINEERING BASELINE`','**Development Source Baseline**：`VF Start V2.21.15 · UPDATE CORE CANDIDATE`',1)
          s=s.replace('**Current Lifecycle**：`STABLE_OPERATIONS`','**Current Lifecycle**：`CANDIDATE_VALIDATION`',1)
          s=s.replace('**当前阶段**：`STABLE_OPERATIONS / V2.21.14 PRODUCTION CLOSED`','**当前阶段**：`V2.21.15 CANDIDATE VALIDATION / V2.21.14 PRODUCTION UNCHANGED`',1)
          marker='> **V2.21.14**：`PRODUCTION / CURRENT`  \n'
          assert s.count(marker)>=1
          s=s.replace(marker,marker+'> **V2.21.15**：`ENGINEERING / CANDIDATE / NOT PRODUCTION`  \n',1)
          ssot.write_text(s,encoding='utf-8',newline='\n')

          mat=Path('p01/docs/authority/ACCEPTANCE_MATRIX.md')
          m=mat.read_text(encoding='utf-8')
          anchor='# 0.00 CURRENT · V2.21.14 Production Closure\n'
          assert m.count(anchor)==1
          block='''# 0.000 CURRENT · V2.21.15 Unified Update Candidate Gates\n\n| ID | Gate | Evidence / Result | Status |\n|---|---|---|---|\n| V22115-UPD-01 | Production Truth | `2.21.14 / 2026080902 / main unchanged` | PASS |\n| V22115-UPD-02 | Candidate Identity | `2.21.15 / Schema 2026080902` | PASS |\n| V22115-UPD-03 | Update Architecture | `core-updates + GitHub Release + bytes/SHA-256 + existing Atomic rollback` | PASS |\n| V22115-UPD-04 | Unified Credential Names | `VF_PRIVATE_READ_TOKEN / VF_RELEASE_WRITE_TOKEN` only | PASS |\n| V22115-UPD-05 | Retired Update Path | `updates.kewaro.com / old Ed25519 current-path dependency removed` | PASS |\n| V22115-UPD-06 | PHP 8.0 Compatibility | integrated update core parsed under PHP 8.0 | PASS |\n| V22115-UPD-07 | Update Core Negative Matrix | project/component/from/schema/bytes/SHA/latest/fail-closed cases | PASS |\n| V22115-UPD-08 | Browser Extension Boundary | `1.6.4`, independent, unchanged | PASS |\n| V22115-UPD-09 | Public Runner | unified runner execution | PASS |\n| V22115-UPD-10 | Private Runner | GitHub hosted runner allocation fails before any step | N/A / INFRA |\n| V22115-UPD-11 | Final Artifact Build | exact candidate formal bytes | TODO |\n| V22115-UPD-12 | Exact 2.21.14 → 2.21.15 Upgrade | real SQLite runtime | TODO |\n| V22115-UPD-13 | Failure Rollback | injected failure + source/data restoration | TODO |\n| V22115-UPD-14 | Git Tag / Release | exact candidate | TODO |\n| V22115-UPD-15 | core-updates P01.json | generated from real Release asset | TODO |\n| V22115-UPD-16 | Production Discovery Bridge | one-time exact 2.21.14 bridge | TODO |\n| V22115-UPD-17 | Real Production Upgrade | user authorization boundary | NOT EXECUTED |\n| V22115-UPD-18 | main Candidate Promotion | forbidden before production readback | NOT EXECUTED |\n\n'''
          m=m.replace(anchor,block+anchor)
          m=m.replace('`R2026.08.15-V22114-PRODUCTION-CURRENT-SEAL`','`R2026.08.15-V22115-UPDATE-CORE-CANDIDATE`',1)
          m=m.replace('`STABLE_OPERATIONS / V2.21.14 PRODUCTION CLOSED`','`V2.21.15 CANDIDATE VALIDATION / V2.21.14 PRODUCTION UNCHANGED`',1)
          m=m.replace('`VF Start V2.21.14 · CURRENT ENGINEERING BASELINE`','`VF Start V2.21.15 · UPDATE CORE CANDIDATE`',1)
          m=m.replace('`VF Start V2.21.14 · PRODUCTION / CURRENT / STABLE_OPERATIONS`','`VF Start V2.21.15 · CANDIDATE / NOT PRODUCTION`',1)
          mat.write_text(m,encoding='utf-8',newline='\n')

          ch=Path('p01/CHANGELOG.md')
          c=ch.read_text(encoding='utf-8')
          anchor='## 当前维护基线\n\n'
          assert c.count(anchor)==1
          entry='''### VF Start V2.21.15 — Candidate\n- APP 接入统一 `core-updates + GitHub Release` 在线更新体系；不重构现有 Atomic / Backup / Rollback 执行引擎。\n- 只读凭据统一为 `VF_PRIVATE_READ_TOKEN`；正式发布写入统一使用 `VF_RELEASE_WRITE_TOKEN`。\n- 当前更新完整性改为项目/组件/Tag/Asset 身份 + Release Asset bytes + SHA-256；旧 `updates.kewaro.com / Ed25519` 仅保留历史证据，不再作为当前标准。\n- Schema 继续 `2026080902`；Browser Helper / Extension 继续 `1.6.4`，不随 APP 机械升版。\n- 当前仍是 Candidate；Production 继续 `2.21.14`，`main` 不提前晋级。\n\n'''
          c=c.replace(anchor,anchor+entry)
          ch.write_text(c,encoding='utf-8',newline='\n')
          PY

          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          git -C p01 diff --check
          grep -Fq '2.21.15 Unified Update Candidate' p01/docs/authority/SSOT.md
          grep -Fq 'V22115-UPD-18' p01/docs/authority/ACCEPTANCE_MATRIX.md
          echo 'P01_CANDIDATE_AUTHORITY_ALIGNMENT=PASS'

      - name: Commit aligned candidate authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json CHANGELOG.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          git commit -m 'docs(authority): align P01 2.21.15 update candidate'
          git push origin HEAD:develop
          echo "P01_AUTHORITY_ALIGNED_HEAD=$(git rev-parse HEAD)"
