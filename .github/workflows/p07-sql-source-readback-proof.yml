name: P07 SQL source readback bounded retry exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-sql-source-readback-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-sql-source-readback-20261029' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 7a89bf30702bdc5f1072b184e0fb84cda27099c9
    steps:
      - name: Verify private read source capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout exact P07 product source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7a89bf30702bdc5f1072b184e0fb84cda27099c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Exact SHA, source readback and fail-closed regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = "0.1.0-release103"
          python3 -B -m py_compile lib/sql_diff_evidence.py lib/verify.py lib/server_migration_pull.py
          export PYTHONPATH="$PWD/lib:$PWD"
          for pattern in test_sql_diff_evidence.py test_sql_diff_command.py test_cross_engine_sql_format.py test_server_migration_pull.py test_verify.py test_secret_scan.py; do
            python3 -B -m unittest discover -s tests -p "$pattern" -v
          done
          python3 -B scripts/secret_scan.py --root .
          git diff --exit-code
          echo P07_SQL_SOURCE_READBACK_EXACT_SOURCE_PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- p07-private
          echo P07_PRIVATE_SOURCE_CLEANUP_PASS
