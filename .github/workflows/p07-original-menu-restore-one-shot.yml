name: P07 original menu1 menu2 restore formal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-original-menu-restore-one-shot.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): original menu1 menu2 restoration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify original immutable identities and CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '99c1426b88dddeead9b79804bf4ef6248e042ebf'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          bash -n installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc12"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_BUILD_EXPECTED="2.1.0-rc7-field"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_SHA256="d1846e751bba5c860c623e3db26641908e27ca43b39cf37016758853b65a952d"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_URL="https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/0a851b9fe1819c7970ed5bb8e3633f2fc8e73166/experiments/p07-vps-audit-v21.sh"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc42"' installers/p07-toolbox.sh
          for id in 37744411692 37744411904 37744411698 37744411689 37744411690 37744411767 37744411684 37744411747 37744411771 37744411687; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = 'bc5b90e3f5d8f28d0fa9810dc1e578b5c22e0151'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_ORIGINAL_MENU_RESTORE_FORMAL_PRECONDITIONS=PASS
      - name: Publish rollback formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-original-menu-restore-v21'
          target='99c1426b88dddeead9b79804bf4ef6248e042ebf'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 菜单 1 和菜单 2 恢复原版' \
              --notes '按 OWNER 要求回退：菜单1网络代理节点使用原正式基线 rc12，源码及入口行为与原稳定版本保持不变；菜单2回退为原版 VPS 验机 V2.1.0 (2.1.0-rc7-field)，恢复原始彩色终端、先服务器配置再真实测速、全球及中国大陆网络测试、CPU/磁盘、增强 fio、三网回程及报告。移除菜单2默认 V2.2.4-V2.2.7 简化/心跳包装路径。菜单3-5与 Source release84 不变。Public Distribution 10/10 Machine Gates PASS，真实生产环境 OWNER 验收保持 PENDING，Production 不自动升级。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_ORIGINAL_MENU_RESTORE_FORMAL_RELEASE=PASS
