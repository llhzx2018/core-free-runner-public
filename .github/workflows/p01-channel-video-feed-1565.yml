name: P01 Channel Video Feed 1565 One-shot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-channel-video-feed-1565.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXACT_SHA: 1c20bfadeed67b91c1a921ed744cc9cc22e29c89
      BASELINE_TAG: v2.47.405
    steps:
      - name: Public runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,simplexml,mbstring,zip,openssl
          coverage: none
      - name: Bind private exact product source without publish
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-video-feed-1565"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_TEST_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$EXACT_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$EXACT_SHA"
          git clone -q --depth 1 --branch "$BASELINE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/stable"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          echo P01_VIDEO_FEED_EXACT_SOURCE=PASS
      - name: Focused owner, layout, cache and existing batch tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_ROOT/candidate"
          php -m | grep -Fx SimpleXML
          php -m | grep -Fx mbstring
          php -l src/app/ChannelVideoFeed.php
          php -l src/app/ChannelLibraryPage.php
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/channel_video_feed_owner_cache_native.php
          node --check src/assets/channel-video-feed.js
          node --check tests/integration/channel_video_feed_layout_node.js
          php tests/unit/channel_video_feed_owner_cache_native.php
          node tests/integration/channel_video_feed_layout_node.js
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/youtube_modal_thumbnails_node.js
          echo P01_CHANNEL_VIDEO_FEED_FOCUSED=PASS
      - name: Canonical product unit baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$P01_TEST_ROOT/candidate/tests/canonical_release_regression.sh" \
            "$P01_TEST_ROOT/candidate" "$P01_TEST_ROOT/stable" --require-zero-debt \
            | tee "$P01_TEST_ROOT/canonical.log"
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS "$P01_TEST_ROOT/canonical.log"
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS "$P01_TEST_ROOT/canonical.log"
          test -z "$(git -C "$P01_TEST_ROOT/candidate" status --porcelain)"
          echo P01_CHANNEL_VIDEO_FEED_CANONICAL=PASS
      - name: No persistent private artifact
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${P01_TEST_ROOT:-}" ]; then rm -rf -- "$P01_TEST_ROOT"; fi
          echo P01_CHANNEL_VIDEO_FEED_EPHEMERAL=PASS
