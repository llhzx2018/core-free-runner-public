name: P01 Owner subsite frontend exact-source test 20261113
on:
  push:
    branches:
      - test/p01-owner-subsite-ui-20261113-8a139

permissions:
  contents: read

jobs:
  exact-owner-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate temporary public-safe Runner lane
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-owner-subsite-ui-20261113-8a139"
          echo "P01_SCOPE=PRIVATE_SOURCE_EPHEMERAL_CHECKOUT_SYNTHETIC_BROWSER_ONLY"
          echo "P01_PRODUCTION=UNTOUCHED"

      - name: Require registered private source read capability
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo "P01_REGISTERED_PRIVATE_READ=PRESENT"

      - name: Checkout exact private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9a6d36271af4393d6df3927b6b57a7b33054fa6b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Verify exact source and future-only version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9a6d36271af4393d6df3927b6b57a7b33054fa6b"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/frontend/tests/subsite-switcher.spec.ts
          echo "P01_EXACT_SOURCE=9a6d36271af4393d6df3927b6b57a7b33054fa6b"

      - name: Install isolated frontend lockfile dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm-ci.txt" 2>&1
          echo "P01_FRONTEND_LOCKFILE_INSTALL=PASS"

      - name: Vue TypeScript typecheck
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run typecheck > "$RUNNER_TEMP/p01-typecheck.txt" 2>&1
          echo "P01_FRONTEND_VUE_TYPECHECK=PASS"

      - name: Focused existing frontend unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1
          echo "P01_FRONTEND_UNIT=PASS"

      - name: Actual production-mode Vite build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_FRONTEND_VITE_BUILD=PASS"

      - name: Chromium availability for 390 768 1440 testing
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser-setup.txt" 2>&1
          echo "P01_CHROMIUM_INSTALLED=PASS"

      - name: Actual subsite and existing UX browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-playwright.txt" 2>&1; then
            echo "P01_CHROMIUM_UI_REGRESSION=FAIL_SANITIZED_TEST_NAMES_ONLY"
            grep -E 'chromium|failed|passed|Error:' "$RUNNER_TEMP/p01-playwright.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 65 || true
            exit 1
          fi
          echo "P01_CHROMIUM_390_768_1440_UI_REGRESSION=PASS"

      - name: Clean private source and logs without artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_LOGS_OR_ARTIFACTS=PERSISTED_NO"
