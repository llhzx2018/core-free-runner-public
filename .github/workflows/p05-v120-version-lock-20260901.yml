name: P05 V1.2.0 Version Lock Mutation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v120-version-lock-20260901.yml']
permissions:
  contents: read
jobs:
  version-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v120-version-lock-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      P05_BASE_MAIN: 239049548ab890d21e644051309af3df6ce1c9ed
      TARGET_VERSION: 1.2.0
      PRODUCTION_VERSION: 1.1.12
      TARGET_BRANCH: release/p05-v120-version-lock-20260901
    steps:
      - name: Checkout exact private P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BASE_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p05
      - name: Verify frozen release base
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE_MAIN"
          test "$(cat VERSION)" = '1.1.12'
          node - <<'NODE'
          const p=require('./package.json');
          if(p.version!=='1.1.12') process.exit(1);
          NODE
          git ls-remote --exit-code origin refs/heads/main | grep -F "$P05_BASE_MAIN" >/dev/null
          if git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo 'TARGET_BRANCH_ALREADY_EXISTS' >&2; exit 1
          fi
          echo 'P05_V120_VERSION_LOCK_BASE=PASS'
      - name: Apply release-only version and authority lock
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_VERSION']; prod=os.environ['PRODUCTION_VERSION']; base=os.environ['P05_BASE_MAIN']
          Path('VERSION').write_text(target+'\n', encoding='utf-8')
          pkg=json.loads(Path('package.json').read_text(encoding='utf-8'))
          pkg['version']=target
          Path('package.json').write_text(json.dumps(pkg, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          vf=json.loads(Path('VF_PROJECT.json').read_text(encoding='utf-8'))
          vf['status']='V1.2.0_RELEASE_CANDIDATE / FINAL_MACHINE_GATE_PENDING / PRODUCTION_V1.1.12_OWNER_OBSERVED'
          vf['version']=target
          vf['production_version']=prod
          vf['target_version']=target
          vf['working_version']=target
          vf['version_change']=True
          vf['candidate_authorization']='AUTHORIZED_V1.2.0_20260901_PENDING_EXECUTION'
          vf['release_authorization']='AUTHORIZED_V1.2.0_20260901_PENDING_EXECUTION'
          vf['production_deployment_authorization']='AUTHORIZED_V1.2.0_20260901_PENDING_EXECUTION'
          vf['next_action']='V1.2.0 FINAL EXACT SOURCE GATE; THEN FORMAL FULL / ATOMIC CHANNEL / PRODUCTION ONLINE UPDATE'
          vf['deployment_readiness']='V1.2.0_CANDIDATE_FINAL_GATE_PENDING'
          Path('VF_PROJECT.json').write_text(json.dumps(vf, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          app=Path('src/client/ProductApp.tsx').read_text(encoding='utf-8')
          old='P05 · Product Optimization · v1.1.12 baseline'
          if old not in app: raise SystemExit('PRODUCT_VERSION_LABEL_ANCHOR_MISSING')
          Path('src/client/ProductApp.tsx').write_text(app.replace(old, 'P05 · Product Optimization · v1.2.0', 1), encoding='utf-8')
          cand=Path('docs/authority/RELEASE_V1.2.0_CANDIDATE.md')
          if cand.exists(): raise SystemExit('CANDIDATE_AUTHORITY_ALREADY_EXISTS')
          cand.write_text(f'''# P05 · VF SEO v1.2.0 Release Candidate\n\nStatus: `OWNER_AUTHORIZED / FINAL_EXACT_SOURCE_GATE_PENDING`\n\n## Release basis\n\n- Frozen pre-release main: `{base}`\n- Previous formal Release: `v1.1.12`\n- Owner-observed Production baseline: `v1.1.12`\n- Target Release / Production: `v1.2.0`\n- Schema: `VF-SEO-SCHEMA@1 / 1` (unchanged)\n- Default database: SQLite (unchanged)\n\n## Product scope already merged and machine-verified\n\nThis release closes the post-v1.1.12 L2 Product Optimization cycle: Portfolio/Overview truth, Query/Page evidence routing, Data Sources/AEO authority, recoverable object/workspace states, Demo Dataset verified load/clear lifecycle, and Empty Portfolio Real Project/Website bootstrap with canonical-ID readback.\n\nThe final product slice was merged by PR #131 after disposable Public Runner #544 Run `33518699683` / Job `99892169635` PASS.\n\n## Version authority\n\n- `VERSION` is the product-version authority and is locked to `1.2.0`.\n- `package.json` mirrors `VERSION`.\n- `package-lock.json` remains dependency-graph authority; root package version metadata is non-authoritative and is not rewritten for release-only churn.\n- Product UI release label is `v1.2.0`.\n\n## Release contract\n\n1. Final Exact Source Gate on the exact version-lock commit.\n2. Merge only that exact SHA to `main`.\n3. Formal deterministic `VF_SEO_V1.2.0_FULL.zip` publication with receipt and remote digest readback.\n4. Build and gate canonical v1.1.12 → v1.2.0 Atomic UPDATE / repair from formal Release bytes.\n5. Publish `core-updates/projects/P05.json` only after the Atomic gate passes.\n6. Apply Production through the already-established authenticated backend online-update path; preserve Runtime Pointer, private SQLite, backup/rollback, source/schema/bytes/SHA gates.\n7. Remote Production readback must prove v1.2.0 before closure can claim Production PASS.\n\n## Authorization\n\nOwner explicitly authorized on 2026-09-01: `批准发布 P05 v1.2.0，完成 Release / Tag / Production Closure。`\n\nThis candidate file does not itself prove publication or Production success. Those states are written only after their corresponding machine/runtime evidence exists.\n''', encoding='utf-8')
          PY
          test "$(cat VERSION)" = "$TARGET_VERSION"
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.0'||v.version!=='1.2.0'||v.target_version!=='1.2.0'||v.working_version!=='1.2.0') process.exit(1);
          if(v.production_version!=='1.1.12') process.exit(1);
          NODE
          git diff --check
          git diff --name-only | sort > /tmp/changed
          printf '%s\n' VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.0_CANDIDATE.md package.json src/client/ProductApp.tsx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'P05_V120_VERSION_LOCK_SCOPE=PASS'
      - name: Validate release metadata source
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run release:source:gate
          npm run typecheck
          node --import tsx --test tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts tests/unit/demo-dataset.test.ts tests/unit/product-site-load-race-truth.test.ts
          echo 'P05_V120_VERSION_LOCK_VALIDATION=PASS'
      - name: Commit and push private release candidate branch
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git switch -c "$TARGET_BRANCH"
          git add VERSION VF_PROJECT.json docs/authority/RELEASE_V1.2.0_CANDIDATE.md package.json src/client/ProductApp.tsx
          git commit -m 'chore(P05): lock v1.2.0 release authority'
          test "$(git rev-list --count "$P05_BASE_MAIN"..HEAD)" = 1
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "P05_V120_CANDIDATE_SOURCE=$(git rev-parse HEAD)"
          echo "P05_V120_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
