name: P03 V1.37.1 Authority Closure Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1371-authority-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  RELEASE_SOURCE: c7bc5216af5363b4524611595418e8e67edb55e6

jobs:
  authority-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P03 develop governance truth
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03

      - name: Seal V1.37.1 release-ready Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          test "$(cat VERSION)" = '1.37.1'
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V1.37.0 PRODUCTION / V1.37.1 RELEASE READY / OWNER UPGRADE PENDING'
          d['project_status']='RELEASE_READY_FOR_OWNER_UPGRADE'
          d['lifecycle']='RELEASE_READY'
          d['production_version']='1.37.0'
          d['working_version']='1.37.1'
          d['candidate_version']='1.37.1'
          d['schema_version']=30
          d['migration']='NONE'
          d['product_identity']={
            'installed_production_version':'1.37.0',
            'release_ready_version':'1.37.1',
            'release_source_commit':'c7bc5216af5363b4524611595418e8e67edb55e6',
            'release_tag':'v1.37.1','release_id':373133471,'release_asset_id':520969164,
            'release_asset_name':'VF_Forge_V1.37.1_UPDATE.zip','release_asset_bytes':823384,
            'release_asset_sha256':'e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229',
            'source_manifest_sha256':'6c1b5867ecde0922fdefc8ecb2e48a41c7f9354d25ccdb2e1d71bbcd70ed2676',
            'meaning':'V1.37.1 release/source truth is sealed. Installed Production remains V1.37.0 until OWNER executes the authorized Atomic upgrade.'
          }
          d['production_truth']={
            'installed_version':'1.37.0','installed_schema':30,
            'owner_real_use_status':'OWNER UI BUGS OBSERVED / V1.37.1 PATCH READY',
            'observed_runtime_from_owner_screenshot':'V1.37.0',
            'production_upgrade_to_1_37_1':'NOT_EXECUTED','production_write':'NO'
          }
          d['verification'].update({
            'v1371_exact_candidate_commit':'c7bc5216af5363b4524611595418e8e67edb55e6',
            'v1371_source_projection':'50 / 50 PASS',
            'v1371_schema_contract':'PASS / 30','v1371_migration':'NONE',
            'v1371_atomic_from_version':'1.37.0','v1371_atomic_target_version':'1.37.1',
            'v1371_atomic_sha256':'e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229',
            'v1371_source_manifest_sha256':'6c1b5867ecde0922fdefc8ecb2e48a41c7f9354d25ccdb2e1d71bbcd70ed2676',
            'v1371_atomic_success_upgrade':'PASS','v1371_atomic_source_database_rollback':'PASS',
            'v1371_data_preservation':'PASS','v1371_atomic_closure_run_id':32265383889,'v1371_atomic_closure_job_id':96108478808,
            'v1371_owner_ui_closure':'PASS','v1371_owner_ui_run_id':32265933726,'v1371_owner_ui_job_id':96110299750,
            'v1371_sidebar_scroll_1319x652':'PASS','v1371_null_authority_safe_degrade':'PASS',
            'v1371_formal_release':'PASS','v1371_release_remote_readback':'PASS',
            'v1371_formal_distribution_run_id':32266385566,'v1371_formal_distribution_job_id':96111798442,
            'v1371_release_id':373133471,'v1371_release_asset_id':520969164,
            'v1371_core_updates_remote_readback':'PASS','v1371_core_updates_commit':'9150e5b58b52c9c8e1663659dba0feee7b4dbe51',
            'private_source_published':'NO','production_write':'NO'
          })
          d['release']={
            'installed_production_version':'1.37.0','available_version':'1.37.1','release_ready':'PASS',
            'release_tag':'v1.37.1','release_source_commit':'c7bc5216af5363b4524611595418e8e67edb55e6',
            'release_id':373133471,'asset_id':520969164,'asset_name':'VF_Forge_V1.37.1_UPDATE.zip',
            'asset_bytes':823384,'asset_sha256':'e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229',
            'source_manifest_sha256':'6c1b5867ecde0922fdefc8ecb2e48a41c7f9354d25ccdb2e1d71bbcd70ed2676',
            'core_updates':'PASS','owner_upgrade_authorized':True,'production_write':False
          }
          d['git_alignment']={
            'mode':'RELEASE READY / OWNER UPGRADE PENDING',
            'main_release_source_commit':'c7bc5216af5363b4524611595418e8e67edb55e6',
            'main_release_version':'1.37.1','tag_matches_main_release_source':True,
            'installed_production_remains_1_37_0':True,'develop_contains_governance_only_after_release_tag':True,
            'force_push':False,'history_rewrite':False
          }
          d['bugfix_cycle']={
            'version':'1.37.1','status':'VERIFIED / RELEASED / CORE_UPDATES_PASS / OWNER UPGRADE PENDING',
            'owner_reported_at':'2026-08-19',
            'fixes':[
              {'id':'SIDEBAR_PROJECT_SCROLL','result':'PASS','contract':'CURRENT PROJECT SHORTCUTS SCROLL INDEPENDENTLY; SETTINGS / RUNTIME / LOGOUT REMAIN VISIBLE','chromium':'1319x652 PASS'},
              {'id':'NULL_AUTHORITY_CANONICAL_URL','result':'PASS','contract':'MISSING AUTHORITY OMITS LINK; PROJECT DETAIL RENDERS WITHOUT ERROR','chromium':'PASS'}
            ],
            'schema_change':'NO','migration':'NONE','production_write':'NO'
          }
          d['current_phase']='OWNER PRODUCTION UPGRADE GATE'
          d['current_verdict']='V1.37.1 RELEASE_READY / SAFE_TO_UPGRADE_FROM_V1.37.0'
          d['product_failure']='V1.37.0 OWNER-REPORTED UI BUGS FIXED_IN_V1.37.1'
          d['product_test_failure']='NONE_ON_V1.37.1'
          d['production_real_use_pass']='V1.37.0 RUNNING / OWNER BUGS IDENTIFIED; V1.37.1 PATCH VERIFIED'
          d['runtime_change']='V1.37.1 RELEASE SOURCE SEALED'
          d['version_change']='1.37.0 -> 1.37.1 RELEASE READY'
          d['production_write']='NO'
          d['user_engineering_action']=1
          d['next_action']='OWNER MAY UPGRADE INSTALLED P03 PRODUCTION FROM V1.37.0 TO V1.37.1 USING THE FORMAL ATOMIC UPDATE CHANNEL'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          cat > docs/authority/ACCEPTANCE_MATRIX.md <<'EOF'
          # P03 · VF Forge · 当前验收矩阵

          **状态：** `V1.37.1 RELEASE READY / OWNER UPGRADE PENDING`  
          **Installed Production：** `V1.37.0`  
          **Available Release：** `V1.37.1`  
          **Schema：** `30 → 30`  
          **Migration：** `NONE`  
          **PRODUCTION WRITE：** `NO`

          > 本矩阵维护两层 Truth：GitHub / Release / core-updates 的 V1.37.1 发布真相已经封板；当前实际安装的 Production 仍是 V1.37.0，等待 OWNER 执行正式 Atomic 升级。

          ## 1. Maintenance Scope

          V1.37.1 只关闭 OWNER 在 V1.37.0 Production 中发现的两个真实运行问题：

          | Bug | Result | Acceptance |
          |---|---|---|
          | 左侧“当前项目”超过视口后无独立滚动，底部设置 / Runtime / 退出被挤出 | PASS | 项目区独立滚动；主导航与底部区保持固定可见 |
          | 无 Authority 项目读取 `null.canonical_url` 导致详情页崩溃 | PASS | 缺失 Authority 安全降级；外链隐藏；项目详情正常渲染 |

          永久产品边界保持不变：`PROJECT-ASSET STORAGE = NONE`、`USER FILE UPLOAD = RETIRED`、`LOCAL ASSET REPOSITORY = RETIRED`。

          ## 2. Version Contract

          ```text
          INSTALLED PRODUCTION = 1.37.0
          RELEASE TARGET = 1.37.1
          CHANGE CLASS = PATCH / OWNER RUNTIME BUGFIX
          SCHEMA FROM = 30
          SCHEMA TO = 30
          MIGRATION = NONE
          ALLOWED SOURCE = 1.37.0 ONLY
          ```

          ## 3. Source / Runtime Regression

          ```text
          RELEASE SOURCE = c7bc5216af5363b4524611595418e8e67edb55e6
          SOURCE PROJECTION = 50 / 50 PASS
          SCHEMA = 30 PASS
          SQLITE = 91 TABLES / 19 TRIGGERS PASS
          PHP LINT = 36 / 36 PASS
          FRESH INSTALL = PASS
          AUTH / CSRF / ORIGIN = PASS
          BACKUP / RESTORE = PASS
          DECISION MEMORY RESTORE = PASS
          MCP / AGENT CONTEXT = PASS
          ZERO PROJECT-ASSET STORAGE FAIL-CLOSED = PASS
          PRIVATE SOURCE PUBLISHED = NO
          ```

          ## 4. OWNER Screenshot Chromium Gate

          Authority：`core-free-runner-public` Run `32265933726` / Job `96110299750`。

          ```text
          VIEWPORT = 1319×652
          PROJECT SHORTCUT CLIENT HEIGHT = 131
          PROJECT SHORTCUT SCROLL HEIGHT = 602
          PROJECT SHORTCUT SCROLL TOP AFTER = 471
          PRIMARY NAV POSITION = UNCHANGED
          SETTINGS POSITION = UNCHANGED
          RUNTIME BOTTOM = 592.40625 / INSIDE VIEWPORT
          LOGOUT BOTTOM = 636 / INSIDE VIEWPORT
          SIDEBAR FIX = PASS

          VF ToolSite / NO AUTHORITY DETAIL = PASS
          canonical_url CRASH = NONE
          ERROR TOAST = NONE
          MISSING AUTHORITY LINKS = OMITTED
          ```

          ## 5. Atomic Upgrade / Rollback Gate

          Authority：`core-free-runner-public` Run `32265383889` / Job `96108478808`。

          ```text
          FROM = 1.37.0
          TARGET = 1.37.1
          SCHEMA = 30 → 30
          MIGRATION = NONE
          SUCCESS UPGRADE = PASS
          PRODUCTION SOURCE EXACT = PASS / 50 FILES
          DATA PRESERVATION = PASS
          FAILURE INJECTION = PASS
          SOURCE ROLLBACK = PASS
          SQLITE ROLLBACK = PASS
          ```

          Fingerprints：

          ```text
          UPDATE SHA-256 = e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229
          SOURCE MANIFEST SHA-256 = 6c1b5867ecde0922fdefc8ecb2e48a41c7f9354d25ccdb2e1d71bbcd70ed2676
          RUNTIME FILES = 50
          ```

          ## 6. Formal Release / Distribution Gate

          Authority：`core-free-runner-public` Run `32266385566` / Job `96111798442`。

          ```text
          main = c7bc5216af5363b4524611595418e8e67edb55e6
          v1.37.1 = c7bc5216af5363b4524611595418e8e67edb55e6
          GitHub Release ID = 373133471
          UPDATE Asset ID = 520969164
          Asset = VF_Forge_V1.37.1_UPDATE.zip
          Asset Bytes = 823384
          Asset SHA-256 = e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229
          Remote Release Download Readback = PASS
          ZIP Integrity = PASS
          core-updates Commit = 9150e5b58b52c9c8e1663659dba0feee7b4dbe51
          core-updates Remote Readback = PASS
          Force Push = NO
          History Rewrite = NO
          Production Write = NO
          ```

          ## 7. Final Verdict

          ```text
          OWNER-REPORTED BUGS = 2 / 2 FIXED
          SOURCE / RUNTIME REGRESSION = PASS
          OWNER VIEWPORT CHROMIUM = PASS
          ATOMIC SUCCESS = PASS
          FAILURE ROLLBACK = PASS
          FORMAL RELEASE = PASS
          REMOTE RELEASE ASSET READBACK = PASS
          CORE-UPDATES = PASS
          BLOCKER = 0

          INSTALLED PRODUCTION = 1.37.0 / Schema 30
          AVAILABLE RELEASE = 1.37.1 / Schema 30
          OWNER UPGRADE = AUTHORIZED
          PRODUCTION UPGRADE TO 1.37.1 = NOT YET EXECUTED
          ```

          **正式裁决：P03 V1.37.1 已达到 OWNER Production Upgrade Gate。允许从已安装 V1.37.0 使用正式 Atomic Update Channel 升级到 V1.37.1。**
          EOF

          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['status']=='V1.37.0 PRODUCTION / V1.37.1 RELEASE READY / OWNER UPGRADE PENDING'
          assert d['release']['release_ready']=='PASS'
          assert d['release']['asset_sha256']=='e459a4997695f0bb1dd8a778c402b7bd8250420c6223ed0944599589c4c4c229'
          assert d['verification']['v1371_owner_ui_closure']=='PASS'
          assert d['verification']['v1371_core_updates_remote_readback']=='PASS'
          assert d['permanent_boundaries']['project_asset_storage']=='NONE'
          print('P03_V1371_AUTHORITY_CLOSURE_CONTENT=PASS')
          PY
          git diff --check

      - name: Commit governance-only closure to develop
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VF_PROJECT.json docs/authority/ACCEPTANCE_MATRIX.md
          git commit -m 'authority(P03): seal V1.37.1 release-ready state'
          git push origin HEAD:develop
          echo "P03_V1371_AUTHORITY_CLOSURE=PASS sha=$(git rev-parse HEAD)"
