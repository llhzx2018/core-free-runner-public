name: p01-admin-ui-r4-799-temp

on:
  push:
    branches:
      - run/p01-admin-ui-r4-799

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: c0de24116f5540fb4b5511196729eefc414d72d0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "c0de24116f5540fb4b5511196729eefc414d72d0"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_ADMIN_UI_R4_SYNTAX=PASS

      - name: Focused UI contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_visual_system_r3_contract.php
          php tests/unit/admin_rail_action_only_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_backend_closure_contract.php
          echo P01_ADMIN_UI_R4_CONTRACTS=PASS

      - name: Fresh install and common baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-admin-ui-r4
          cp -a vf-start/src /tmp/p01-admin-ui-r4
          cd /tmp/p01-admin-ui-r4
          php -S 127.0.0.1:18108 -t . >/tmp/p01-admin-ui-r4-server.log 2>&1 &
          echo $! >/tmp/p01-admin-ui-r4.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-admin-ui-r4.cookies -b /tmp/p01-admin-ui-r4.cookies http://127.0.0.1:18108/setup.php -o /tmp/p01-admin-ui-r4-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-admin-ui-r4-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-admin-ui-r4.cookies -b /tmp/p01-admin-ui-r4.cookies -X POST http://127.0.0.1:18108/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=VF Admin UI R4'             --data-urlencode "admin_password=$TEST_PASSWORD"             --data-urlencode "admin_password_confirm=$TEST_PASSWORD"             -o /tmp/p01-admin-ui-r4-setup-post.html
          php cli/verify.php | tee /tmp/p01-admin-ui-r4-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-admin-ui-r4-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-admin-ui-r4-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-admin-ui-r4-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-admin-ui-r4-baseline.txt
          echo P01_ADMIN_UI_R4_BASELINE=PASS

      - name: Authenticated shell and resource smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=http://127.0.0.1:18108
          python3 - <<'PY' >/tmp/p01-admin-ui-r4-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-admin-ui-r4.cookies -b /tmp/p01-admin-ui-r4.cookies             -H 'Content-Type: application/json' -X POST "$BASE/api.php?action=login"             --data-binary @/tmp/p01-admin-ui-r4-login.json             -o /tmp/p01-admin-ui-r4-login-result.json
          grep -F '"ok":true' /tmp/p01-admin-ui-r4-login-result.json >/dev/null

          for page in manage.php surface-manager.php 'surface-manager.php?advanced=1' links-admin.php transfer.php system-health.php settings.php; do
            safe=$(printf '%s' "$page" | tr '?=&/' '____')
            curl -fsS -c /tmp/p01-admin-ui-r4.cookies -b /tmp/p01-admin-ui-r4.cookies "$BASE/$page" -o "/tmp/p01-admin-ui-r4-$safe.html"
          done

          RESOURCE=/tmp/p01-admin-ui-r4-surface-manager.php.html
          grep -F '>待整理收件箱<' "$RESOURCE" >/dev/null
          grep -F 'class="vf-rail-chevron"' "$RESOURCE" >/dev/null
          test "$(grep -o 'class="vf-rail-subitem' "$RESOURCE" | wc -l | tr -d ' ')" = "5"
          for forbidden in 系统收件箱 资源库 业务分类 治理; do ! grep -F "$forbidden" "$RESOURCE" >/dev/null; done

          grep -F 'P01 Admin Visual System R4 — enterprise unified' vf-start/src/assets/admin-consolidation.css >/dev/null
          grep -F '.vf-rail-subitem.active:before{content:none!important' vf-start/src/assets/admin-consolidation.css >/dev/null
          grep -F 'background:var(--vf-admin-primary-soft)!important' vf-start/src/assets/admin-consolidation.css >/dev/null
          grep -F 'P01 Admin Visual System R4 — resource workbench alignment' vf-start/src/assets/admin-resource-manager.css >/dev/null
          echo P01_ADMIN_UI_R4_AUTH_HTTP=PASS

      - name: Verdict
        run: |
          echo P01_ADMIN_UI_R4_799=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-admin-ui-r4.pid ]; then kill "$(cat /tmp/p01-admin-ui-r4.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-admin-ui-r4 /tmp/p01-admin-ui-r4-*
