name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-page-coverage160-20261021]
    paths: ['.github/workflows/s01-page-coverage-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.160
  TARGET_SHA: 5eace6a0f761ddd7d6736591782b24d3c2bd4b2f
  UPDATE_SHA: 288c129931367f75be927c9439dea3827aaedebb
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 288c129931367f75be927c9439dea3827aaedebb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='dea04c41d3e054f59b19c9ad952f1e2d242b2e79313e5656eee5376f2423c1f8' and m['asset_bytes']==1974621
          assert m['runtime_files']==476 and '1.35.159' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
