name: P08 R47 Owner update current-page strict source build (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r47-update-panel-once.yml'
permissions:
  contents: read
jobs:
  isolated-update-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public-safe temporary workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout private exact P08 source only in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 6d24f191894ea4e9809f29c6231e4c00d91d7000
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Verify exact source and fail-closed product updater
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = "6d24f191894ea4e9809f29c6231e4c00d91d7000"
          test "$(cat private-p08/VERSION)" = 0.1.1
          grep -Fq 'PUBLIC_KEY_HEX = null' private-p08/src/Upgrade/UpdateAuthority.php
          test ! -e private-p08/.env
          echo P08_R47_EXACT_PRIVATE_SOURCE_AND_DISABLED_SIGNER=PASS
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict Vue/TypeScript compilation and actual Vite build
        run: |
          set -euo pipefail
          cd private-p08
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r47-npm.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-r47-npm.log"; exit 1; }
          npm run typecheck
          echo P08_R47_VUE_TYPESCRIPT_TYPECHECK=PASS
          npm run build
          echo P08_R47_REAL_VITE_BUNDLE=PASS
          test -f public/build/manifest.json
      - name: Validate real project source gates and PHP syntax
        run: |
          set -euo pipefail
          cd private-p08
          python3 scripts/check_stack_contract.py --phase mature
          php -l app/Http/Controllers/OwnerUpgradeController.php
          php -l routes/web.php
          echo P08_R47_UPGRADE_POST_SAME_PAGE_ERROR_HANDLING_SOURCE_GATE=PASS
          echo P08_R47_OWNER_BROWSER_CLICK_END_TO_END=NOT_PROVEN
          echo P08_R47_OWNER_CRON_AND_FPM_REFRESH=NOT_PROVEN
      - name: Remove private source and temporary build output
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r47-npm.log"
