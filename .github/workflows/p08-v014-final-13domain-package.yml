name: P08 v014 FINAL exact-source 13-domain and real deterministic FULL UPDATE prepublication
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v014-final-13domain-package.yml
permissions:
  contents: read
jobs:
  final-source-package:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v014-final-13domain-package-20261120' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source-only P08 final main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6fae792864a594465e4b3224bd6d73abde976f12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Checkout effective GOV Mode V and all 13 real authorities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 native code modules
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run final exact source security, PHP, TS and unit negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 6fae792864a594465e4b3224bd6d73abde976f12
          test "$(git -C target rev-parse HEAD^{tree})" = 52c5efd04dfa895bff56fc4d7467dd4fca21f952
          test "$(git -C gov rev-parse HEAD)" = ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          test "$(cat target/VERSION)" = 0.1.14
          grep -Fq '| skill-release | V3.21 |' gov/CURRENT.md
          grep -Fq '## RP-07V' target/docs/authority/ACCEPTANCE_MATRIX.md
          npm ci --prefix target --ignore-scripts --no-fund --no-audit
          npm run typecheck --prefix target
          npm run build --prefix target
          npm run test:unit --prefix target
          composer --working-dir=target install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress --optimize-autoloader
          bash target/scripts/dev_check.sh > "$RUNNER_TEMP/p08-v014-final-source.log" 2>&1 || {
            echo P08_V014_FINAL_SOURCE_DEV_CHECK_FAIL
            exit 21
          }
          python3 -B target/scripts/check_stack_contract.py --phase full --root target
          ( cd target
            git diff --exit-code && git diff --cached --exit-code
            for f in $(git ls-files --others --exclude-standard); do
              case "$f" in
                bootstrap/cache/packages.php|bootstrap/cache/services.php)
                  test -f "$f" && ! test -L "$f" && rm -- "$f";;
                *) echo P08_V014_UNEXPECTED_SOURCE_GENERATION; exit 23;;
              esac
            done
            test -z "$(git status --porcelain --untracked-files=all)"
          )
          echo P08_V014_FINAL_SOURCE_ALL_NEGATIVES=PASS
      - name: Download authentic issued old v013 FULL without revealing private bytes
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          tmp="$RUNNER_TEMP/p08-v014-final-issuer-input"
          mkdir -m 700 "$tmp"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/770296940 \
            -o "$tmp/issued-v013-full.zip"
          test "$(sha256sum "$tmp/issued-v013-full.zip" | cut -d' ' -f1)" = f8075f065d1413c984f80ef7531242cfc894bf272e90f6d89282074f6617c1ec
          unzip -p "$tmp/issued-v013-full.zip" FULL_MANIFEST.json > "$tmp/issued-v013-manifest.json"
          python3 - "$tmp/issued-v013-manifest.json" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          b=Path(sys.argv[1]).read_bytes()
          j=json.loads(b)
          assert j["source_sha"]=="8b385fecd132a02ac79f5b67e670783e98997c3e"
          assert j["target_version"]=="0.1.13"
          assert len(j["files"])>6100
          print("P08_V014_ORIGINAL_V013_FULL_MANIFEST_SHA256="+hashlib.sha256(b).hexdigest())
          PY
          echo P08_V014_ORIGINAL_ISSUED_V013_FULL=VERIFIED
      - name: Read all 13 applicability domains and build REAL final FULL and UPDATE twice
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$RUNNER_TEMP/p08-v014-final-issuer-input"
          test -f "$tmp/issued-v013-manifest.json"
          python3 -B - <<'PY'
          from pathlib import Path
          import json,subprocess
          gov=Path('gov')
          p=Path('target')
          router=json.loads((gov/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())
          domain=router['domains']
          required={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','CRON_JOB','OBSERVABILITY','GIT','UA_UI'}
          conditional={'API_PROVIDER','SEO','NOTIFICATION','PERFORMANCE'}
          assert len(domain)==13 and set(domain)==required|conditional
          matrix=(p/'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text()
          for name,entry in domain.items():
            f=gov/entry['authority']
            assert f.is_file() and f.stat().st_size>1000,name
            assert '| '+name+' |' in matrix,name
          assert '## RP-07V' in (p/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert 'Mode V' in (gov/'skills/skill-release/V3.21/SKILL.md').read_text()
          assert subprocess.check_output(['git','-C','target','rev-parse','HEAD'],text=True).strip()=='6fae792864a594465e4b3224bd6d73abde976f12'
          print('P08_V014_FINAL_13_DOMAINS_RESOLVED_9_REQUIRED_4_CONDITIONAL=PASS')
          PY
          for phase in first second; do
            python3 -B target/scripts/build_full.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/014-full-$phase.zip" \
              --version 0.1.14 --source-sha 6fae792864a594465e4b3224bd6d73abde976f12 \
              --governance-root "$GITHUB_WORKSPACE/gov"
            python3 -B target/scripts/build_atomic.py \
              --source "$GITHUB_WORKSPACE/target" --output "$tmp/014-update-$phase.zip" \
              --source-version 0.1.13 --source-sha 8b385fecd132a02ac79f5b67e670783e98997c3e \
              --source-full-manifest-sha256 "$(sha256sum "$tmp/issued-v013-manifest.json" | cut -d' ' -f1)" \
              --previous-full-manifest "$tmp/issued-v013-manifest.json" \
              --target-version 0.1.14 --target-sha 6fae792864a594465e4b3224bd6d73abde976f12
          done
          cmp "$tmp/014-full-first.zip" "$tmp/014-full-second.zip"
          cmp "$tmp/014-update-first.zip" "$tmp/014-update-second.zip"
          test "$(sha256sum "$tmp/014-full-first.zip" | cut -d' ' -f1)" = 2b8023a1c67213dbebb8f7047f27debbccc0f00fb210d10aeb3dc703076a811b
          unzip -tqq "$tmp/014-full-first.zip"
          unzip -tqq "$tmp/014-update-first.zip"
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import hashlib,json,sys,zipfile
          t=Path(sys.argv[1]);full=t/'014-full-first.zip';atomic=t/'014-update-first.zip'
          old=hashlib.sha256((t/'issued-v013-manifest.json').read_bytes()).hexdigest()
          with zipfile.ZipFile(full) as z:
            m=json.loads(z.read('FULL_MANIFEST.json'))
            assert m['type']=='CLEAN_FULL_ONLY' and m['target_version']=='0.1.14'
            assert m['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['data_included'] is False and len(m['files'])>6100 and z.testzip() is None
          with zipfile.ZipFile(atomic) as z:
            m=json.loads(z.read('ATOMIC_MANIFEST.json'))
            assert m['type']=='P08_ATOMIC_CODE_ONLY_V1'
            assert m['source_version']=='0.1.13'
            assert m['source_sha']=='8b385fecd132a02ac79f5b67e670783e98997c3e'
            assert m['source_full_manifest_sha256']==old
            assert m['target_version']=='0.1.14'
            assert m['target_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
            assert m['schema_changes'] is False and len(m['files'])>6100 and z.testzip() is None
          for f in (full,atomic):
            with zipfile.ZipFile(f) as z:
              paths=z.namelist()
              assert not any(n.startswith('.git/') or n in ('.env','storage/database.sqlite')
                        or n.startswith('storage/app/private/')
                        or n.startswith('node_modules/') for n in paths)
          digest=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          print('P08_V014_REAL_FINAL_FULL_SHA256='+digest(full))
          print('P08_V014_REAL_FINAL_ATOMIC_SHA256='+digest(atomic))
          print('P08_V014_FINAL_DOUBLE_BUILD_AND_MEMBER_SAFETY=PASS')
          PY
      - name: Canonical real-ZIP Public Authority structural delivery for both profiles
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,sys,os
          p=Path('target').resolve();g=Path('gov').resolve()
          t=Path(os.environ['RUNNER_TEMP'])/'p08-v014-final-issuer-input'
          router=g/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json'
          checker=g/'governance/public-authority/tools/task_delivery_contract_lint.py'
          caps=['source_change','full_package','installer_ui','auth','database','online_upgrade','background_job','release_visibility']
          paths={'agents':'AGENTS.md','current':'docs/authority/CURRENT.md','acceptance':'docs/authority/RPD.md','applicability':'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md'}
          required=['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','CRON_JOB','OBSERVABILITY','GIT','UA_UI']
          for kind,filename,entry in [('web_full_zip','014-full-first.zip','public/setup.php'),('web_atomic_zip','014-update-first.zip','public/index.php')]:
            artifact=t/filename
            receipt={'schema':'vf.public-authority.task-delivery-check.v1','project':'P08',
              'source':'6fae792864a594465e4b3224bd6d73abde976f12',
              'project_authority':paths,'acceptance_markers':['WordPress-simple','CloudPanel'],
              'required_domains':required,'task_capabilities':caps,
              'delivery':{'profile':kind,'entrypoint':entry,'requires_git':False,
                'requires_manual_source_copy':False,'artifact':filename,
                'sha256':hashlib.sha256(artifact.read_bytes()).hexdigest()}}
            f=t/('receipt-'+kind+'.json')
            f.write_text(json.dumps(receipt))
            for phase in ('resolve','delivery'):
              proc=subprocess.run([sys.executable,'-B',str(checker),'--phase',phase,
                '--receipt',str(f),'--project-root',str(p),'--artifact-root',str(t),
                '--public-router',str(router)],capture_output=True,text=True,timeout=70)
              assert proc.returncode==0 and ('CONTRACT_CHECK='+
                ('RULES_RESOLVED' if phase=='resolve' else 'STRUCTURAL_PASS')) in proc.stdout.splitlines(), kind+':'+phase
              print('P08_V014_'+kind.upper()+'_'+phase.upper()+'=PASS')
          PY
          echo P08_V014_FINAL_SOURCE_13DOMAINS_AND_TWO_ACTUAL_ZIPS=PASS
      - name: Always remove every private source, temporary package, identity and test log
        if: always()
        shell: bash
        run: |
          rm -rf -- target gov "$RUNNER_TEMP/p08-v014-final-issuer-input" "$RUNNER_TEMP/p08-v014-final-source.log"
          test ! -e target && test ! -e gov
          echo P08_V014_FINAL_PRIVATE_CLEANUP=PASS
