name: P01 V2.21.20 Sidebar CSS Contract V4
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-sidebar-css-contract-v4.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact source / fresh install
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/sidebar-density-2.21.20-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" c
          cd c; H=$(git rev-parse HEAD); echo "$H" >/tmp/sha; test "$H" = 46a3e2362d3c396e845f20fecd22d5745d728581; git rev-parse HEAD^{tree} >/tmp/tree
          find src -name '*.php' -print0|xargs -0 -n1 php -l >/dev/null; find src -name '*.js' -print0|xargs -0 -n1 node --check >/dev/null
          grep -q 'sidebar-refinement.css?v=22120' src/assets/reference-ui.js; grep -q 'reference-ui.js?v=22120' src/index.php
          sudo apt-get update -qq; sudo apt-get install -y -qq php-sqlite3 sqlite3 >/dev/null
          cp -a src /tmp/p; cd /tmp/p; php -S 127.0.0.1:18092 -t . >/tmp/server.log 2>&1 & echo $! >/tmp/pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/c http://127.0.0.1:18092/setup.php -o /tmp/setup&&break||sleep 1;done
          CSRF=$(python3 - <<'PY'
          import re
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/setup').read()).group(1))
          PY
          )
          curl -fsSL -c /tmp/c -b /tmp/c -X POST http://127.0.0.1:18092/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode site_title=VF --data-urlencode 'admin_password=Runner-P01-22120!Strong' --data-urlencode 'admin_password_confirm=Runner-P01-22120!Strong' >/dev/null
          php cli/verify.php >/tmp/verify; grep -q VERIFY_PASS=YES /tmp/verify; DB=$(php -r "require 'app/bootstrap.php';echo VF_DB_FILE;"); test "$(sqlite3 "$DB" 'PRAGMA integrity_check;')" = ok; test -z "$(sqlite3 "$DB" 'PRAGMA foreign_key_check;')"
          mkdir -p "$RUNNER_TEMP/n";cd "$RUNNER_TEMP/n";npm init -y >/dev/null 2>&1;PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
      - name: Real Chrome final sidebar contract
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/n/t.mjs" <<'JS'
          import{chromium}from'playwright-core';const br=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          try{const p=await br.newPage({viewport:{width:1319,height:900}}),errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:18092/',{waitUntil:'networkidle'});await p.waitForFunction(()=>document.documentElement.dataset.vfReferenceUi==='4'&&document.querySelector('link[data-vf-sidebar-refinement]'));
          await p.evaluate(()=>{document.body.classList.add('is-admin');const h=document.createElement('div');h.id='runnerSidebarContract';h.className='sidebar-group';const row=(name,count,active)=>`<div class="category-node category-node--child"><span class="category-guide"></span><div class="category-row category-row--child category-nav-row child${active?' active':''}"><button class="category-nav-main"><span class="nav-label">${name}</span></button><span class="nav-count">${count}</span><span class="category-actions"><span class="nav-drag" draggable="true">⋮⋮</span><button class="nav-more">•••</button></span></div></div>`;h.innerHTML=row('浏览器、设备与环境',13,true)+row('账号、邮箱与身份管理',18,false);document.querySelector('#categoryNavSection').appendChild(h)});await p.waitForTimeout(250);
          const q=await p.evaluate(()=>{const rows=[...document.querySelectorAll('#runnerSidebarContract .category-row--child')],r=rows[0],l=rows[1],ra=r.querySelector('.category-nav-main'),la=l.querySelector('.category-nav-main'),a=r.querySelector('.nav-label'),b=l.querySelector('.nav-label'),c=r.querySelector('.nav-count'),x=r.querySelector('.category-actions'),s=document.querySelector('.sidebar'),rs=getComputedStyle(r),xs=getComputedStyle(x),bf=getComputedStyle(r,'::before');return{sidebar:s.getBoundingClientRect().width,buttonW:ra.getBoundingClientRect().width,longButtonW:la.getBoundingClientRect().width,aO:a.scrollWidth-a.clientWidth,bO:b.scrollWidth-b.clientWidth,count:c.getBoundingClientRect().width,actions:x.getBoundingClientRect().width,pos:xs.position,bg:rs.backgroundColor,rail:bf.width,doc:Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth)}});console.log('GEOMETRY='+JSON.stringify(q));
          if(q.sidebar<258||q.sidebar>262||q.buttonW<145||q.longButtonW<145||q.count>27||q.actions>51||q.pos!=='absolute')throw Error('layout '+JSON.stringify(q));if(q.aO>1||q.bO>1)throw Error('text truncation '+JSON.stringify(q));if(q.bg!=='rgb(247, 247, 247)'||Math.abs(parseFloat(q.rail)-2)>.2)throw Error('active '+JSON.stringify(q));if(q.doc>1)throw Error('overflow '+q.doc);
          const sel='#runnerSidebarContract .category-row--child.active',before=await p.$eval(sel,e=>({x:e.getBoundingClientRect().x,w:e.getBoundingClientRect().width}));await p.hover(sel);await p.waitForTimeout(180);const after=await p.$eval(sel,e=>({x:e.getBoundingClientRect().x,w:e.getBoundingClientRect().width,count:+getComputedStyle(e.querySelector('.nav-count')).opacity,more:+getComputedStyle(e.querySelector('.nav-more')).opacity}));if(Math.abs(before.x-after.x)>.1||Math.abs(before.w-after.w)>.1||after.count>.1||after.more<.8)throw Error('hover '+JSON.stringify({before,after}));
          for(const w of [390,480,768,1024,1319,1440]){await p.setViewportSize({width:w,height:900});await p.waitForTimeout(150);const d=await p.evaluate(()=>Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth));if(d>1)throw Error(`overflow ${w}:${d}`)}if(errors.length)throw Error(errors.join('|'));console.log('P01_V22120_SIDEBAR_CSS_CONTRACT_V4=PASS')}finally{await br.close()}
          JS
          cd "$RUNNER_TEMP/n";node t.mjs
      - name: Publish evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          def r(p):
            try:return open(p).read().strip()
            except:return''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','gate':'SIDEBAR_CSS_CONTRACT_V4','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_sha':r('/tmp/sha'),'source_tree':r('/tmp/tree'),'workflow_run_id':os.environ['RID'],'assertion':'available_button_width_and_zero_text_overflow','private_data_persisted_publicly':False};c=json.dumps(q,indent=2)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-SIDEBAR-CSS-CONTRACT-V4.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          d={'message':'evidence(P01): publish V2.21.20 sidebar CSS V4','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:d['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(d).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
      - if: always()
        run: if [ -f /tmp/pid ];then kill $(cat /tmp/pid) 2>/dev/null||true;fi
