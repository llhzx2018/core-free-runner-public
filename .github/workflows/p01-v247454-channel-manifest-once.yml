name: p01-v247454-channel-manifest-once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247454-channel-manifest-once.yml'

permissions:
  contents: read

jobs:
  exact-channel:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247454-channel-manifest-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/core-updates
      TARGET_VERSION: 2.47.454
      TARGET_SHA: b7ea6a1a542206441dc3d4d2fd3710b16413a0dd
      SOURCE_VERSION: 2.47.453
    steps:
      - name: Checkout public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit exact-source lane binding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec validation/p01-v247454-channel-manifest-spec.json --input .github/workflows/p01-v247454-channel-manifest-once.yml
      - name: Checkout exact core-updates PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: b7ea6a1a542206441dc3d4d2fd3710b16413a0dd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
      - name: Run canonical manifest and updater regression
        shell: bash
        working-directory: channel
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-channel-php-lint.txt
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('projects/P01.json').read_text(encoding='utf-8'))
          expected={
              'project_id':'P01','component_id':'APP','current_version':'2.47.453',
              'target_version':'2.47.454','release_tag':'v2.47.454','release_id':423215595,
              'product_identity':'73dd58e4d017b0afbb63c88f8207f7caa9159c97',
              'asset_name':'VF_Start_V2.47.454_UPDATE.zip','asset_bytes':2991372,
              'asset_sha256':'9b0f7867b59125a91aeec137d047f2a1555882b45ce161a60c7dfd2256c4ebd7',
              'schema_from':'2026102201','schema_to':'2026102201',
              'backup_required':True,'rollback_supported':True,'update_type':'ATOMIC',
          }
          for key,value in expected.items():
              assert m.get(key)==value,(key,m.get(key),value)
          assert m.get('from_versions')==['2.47.453']
          assert m.get('repository')=='llhzx2018/vf-start'
          print('P01_CHANNEL_EXACT_MANIFEST=PASS')
          PY
          echo P01_CHANNEL_UPDATER_REGRESSION=PASS
      - name: Verify owning GitHub Tag and artifact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.454 --jq '.object.sha')" = "73dd58e4d017b0afbb63c88f8207f7caa9159c97"
          dest="$RUNNER_TEMP/p01-channel-v247454"
          mkdir -p "$dest"
          gh release download v2.47.454 -R llhzx2018/vf-start -D "$dest" -p "VF-Start-V2.47.454-FULL.zip" -p "VF_Start_V2.47.454_UPDATE.zip"
          test "$(stat -c %s "$dest/VF-Start-V2.47.454-FULL.zip")" = 1371990
          test "$(stat -c %s "$dest/VF_Start_V2.47.454_UPDATE.zip")" = 2991372
          test "$(sha256sum "$dest/VF-Start-V2.47.454-FULL.zip" | cut -d ' ' -f1)" = "b24699196c6c4034f02e1d538a3d7ba9acf693cfe61dc8cd59934a17ab1b80db"
          test "$(sha256sum "$dest/VF_Start_V2.47.454_UPDATE.zip" | cut -d ' ' -f1)" = "9b0f7867b59125a91aeec137d047f2a1555882b45ce161a60c7dfd2256c4ebd7"
          echo P01_CHANNEL_REMOTE_RELEASE_IDENTITY=PASS
