name: Core Updates P01 V2.34 Manifest Gate
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths: [.github/workflows/core-updates-p01-v2340-manifest-gate-20260830.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 8db85499605c34c6b72e664778fa709aa40dc963
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=73c3e0400713d201411d7fda3be426d180b85d91
          CANDIDATE=8db85499605c34c6b72e664778fa709aa40dc963
          test "$(git -C updates rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C updates merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C updates diff --name-only "$BASE"...HEAD)" = projects/P01.json
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$BASE"
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.33.0" and .target_version=="2.34.0" and
            .update_type=="ATOMIC" and .from_versions==["2.33.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.34.0" and
            .release_id==379298288 and
            .product_identity=="518d10f446ea85445d1110a3defafc5bcbece473" and
            .asset_name=="VF_Start_V2.34.0_UPDATE.zip" and
            .asset_bytes==1366286 and
            .asset_sha256=="0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-30T14:00:30Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.34.0)
          test "$(jq -r .object.sha <<<"$TAG")" = 518d10f446ea85445d1110a3defafc5bcbece473
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0)
          test "$(jq -r .id <<<"$REL")" = 379298288
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.size' <<<"$REL")" = 1366286
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58
          rm -rf /tmp/p01-v2340-manifest-asset && mkdir -p /tmp/p01-v2340-manifest-asset
          gh release download v2.34.0 --repo llhzx2018/vf-start --pattern VF_Start_V2.34.0_UPDATE.zip --dir /tmp/p01-v2340-manifest-asset
          A=/tmp/p01-v2340-manifest-asset/VF_Start_V2.34.0_UPDATE.zip
          test "$(stat -c%s "$A")" = 1366286
          echo "0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.34.0.php >/dev/null
          cp "$M" /tmp/P01-V2.34.0-manifest.json
          jq -n --arg candidate "$CANDIDATE" --arg base "$BASE" --arg asset_sha 0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58 '{candidate:$candidate,base:$base,manifest_gate:"PASS",release_id:379298288,tag:"v2.34.0",asset_bytes:1366286,asset_sha256:$asset_sha,owner_production_write:false}' >/tmp/P01-V2.34.0-manifest-gate.json
          echo CORE_UPDATES_P01_V2340_MANIFEST_GATE=PASS
          echo READY_FOR_CORE_UPDATES_MAIN_PROMOTION=YES
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-core-updates-manifest-${{ github.run_id }}
          path: |
            /tmp/P01-V2.34.0-manifest.json
            /tmp/P01-V2.34.0-manifest-gate.json
          if-no-files-found: error
          retention-days: 90
