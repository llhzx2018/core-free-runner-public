name: P01 V2.37.3 Published Authority
on:
  push:
    branches: [release/p01-v2373-strict-publish-20260902]
    paths:
      - .github/workflows/p01-v2373-published-authority-20260902.yml
      - scripts/p01_v2373_published_authority.py
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2373-strict-publish-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2373-published-checkpoint-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh fences
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = cec95e310771feb6813a51c7ee3340884295ee38
          test "$(git -C product rev-parse HEAD:src)" = e56459ebadc120c749cc5336821d762001db5218
          test "$(cat product/VERSION)" = 2.37.3
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.37.3 --jq .object.sha)" = cec95e310771feb6813a51c7ee3340884295ee38
          REL="$(gh api repos/llhzx2018/vf-start/releases/381039491)"
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          CORE="$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)"
          test "$CORE" = dac1d05f3273daa7760b2f1820163df21116a145
          MAN="$(gh api repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main --jq .content | tr -d '\n' | base64 -d)"
          jq -e '.current_version=="2.37.2" and .target_version=="2.37.3" and .from_versions==["2.37.2"] and .release_id==381039491 and .asset_bytes==1271655 and .asset_sha256=="8042c324e59136a70893b9cc839569f3fbcbbaa7184c3855e0b81c37b9556e75"' <<<"$MAN" >/dev/null
      - name: Build authority checkpoint
        run: python3 runner/scripts/p01_v2373_published_authority.py
      - name: Exact docs-only gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product diff --check
          git -C product status --porcelain | sed 's/^...//' | sort >/tmp/files.txt
          cat >/tmp/expected.txt <<'EOF'
          CHANGELOG.md
          README.md
          VF_PROJECT.json
          docs/README.md
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.37.3_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          docs/handoff/CURRENT_STATE.md
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/files.txt
          test "$(git -C product rev-parse HEAD:src)" = e56459ebadc120c749cc5336821d762001db5218
          test "$(cat product/VERSION)" = 2.37.3
          jq -e '.production_version=="2.37.2" and .published_release.version=="2.37.3" and .published_release.release_id==381039491 and .published_release.live_core_updates_commit=="dac1d05f3273daa7760b2f1820163df21116a145" and .published_release.production_closure=="PENDING OWNER UPDATE AND REAL IYF COVER VERIFICATION" and .current_change.production_write==false' product/VF_PROJECT.json >/dev/null
          grep -F 'Published Latest: V2.37.3' product/README.md >/dev/null
          grep -F 'V2.37.2 -> V2.37.3 ONLY' product/README.md >/dev/null
          grep -F 'IYF_FIRST_ATTEMPT' runner/scripts/p01_v2373_strict_fresh.sh >/dev/null || true
      - name: Commit and push checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md docs/README.md CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.37.3_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          git commit -m 'docs(P01): record V2.37.3 published checkpoint'
          git push origin HEAD:docs/p01-v2373-published-checkpoint-20260902
          printf 'P01_V2373_PUBLISHED_AUTHORITY=PASS\nFILES=7\nRUNTIME_WRITE=NO\nVERSION_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n'
