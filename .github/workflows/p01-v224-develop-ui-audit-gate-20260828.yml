name: P01 V2.24 Develop UX UI Audit Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-develop-ui-audit-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      EXACT_DEVELOP: 5b6f8c63b0040deaa60e69f08a7cec33e31a052b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact develop identity and syntax
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_DEVELOP"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/develop | awk '{print $1}')" = "$EXACT_DEVELOP"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V224_DEVELOP_IDENTITY=PASS
      - name: Fresh runtime seed and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v224-ui /tmp/p01-v224-ui.cookies
          cp -a p01/src /tmp/p01-v224-ui
          cd /tmp/p01-v224-ui
          php -S 127.0.0.1:18244 -t . >/tmp/p01-v224-ui-server.log 2>&1 & echo $! >/tmp/p01-v224-ui.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18244/setup.php -o /tmp/p01-v224-ui-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v224-ui.cookies -b /tmp/p01-v224-ui.cookies http://127.0.0.1:18244/setup.php -o /tmp/p01-v224-ui-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v224-ui-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v224-ui.cookies -b /tmp/p01-v224-ui.cookies -X POST http://127.0.0.1:18244/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start UI Audit' --data-urlencode 'admin_password=P01V223!UnifiedUI' --data-urlencode 'admin_password_confirm=P01V223!UnifiedUI' -o /tmp/p01-v224-ui-setup-post.html
          curl -fsS -c /tmp/p01-v224-ui.cookies -b /tmp/p01-v224-ui.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18244/api.php?action=login' --data '{"password":"P01V223!UnifiedUI"}' -o /tmp/p01-v224-ui-login.json
          jq -e '.ok==true' /tmp/p01-v224-ui-login.json >/dev/null
          cat >/tmp/p01-v224-ui-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v224-ui/app/bootstrap.php';
          require_once '/tmp/p01-v224-ui/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $work=$r->createCategory(['name'=>'工作入口','description'=>'','is_private'=>false]);
          $media=$r->createCategory(['name'=>'内容收藏','description'=>'','is_private'=>true]);
          foreach([
            ['Cloudflare Dashboard','https://dash.cloudflare.com/','基础设施控制台',8,1],
            ['GitHub','https://github.com/','代码与项目',6,1],
            ['OpenAI','https://openai.com/','AI 工具',4,0],
            ['DigitalOcean','https://www.digitalocean.com/','云服务器',2,0],
          ] as $x){$r->saveLink(null,['category_id'=>$work,'title'=>$x[0],'url'=>$x[1],'description'=>$x[2],'click_count'=>$x[3],'is_favorite'=>$x[4]],'import');}
          foreach([
            ['硅谷101','https://www.youtube.com/@TheValley101','科技与商业故事','科技,商业'],
            ['42章经','https://www.youtube.com/@42zhangjing','创业与投资访谈','创业,访谈'],
            ['蜉蝣天地 Meanders','https://www.youtube.com/@meanders','人物与社会长谈','访谈,社会'],
          ] as $x){$z=$r->saveLink(null,['category_id'=>$media,'title'=>$x[0],'url'=>$x[1],'description'=>$x[2],'tags'=>$x[3],'is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'youtube','note'=>'适合工作时听','background_friendly'=>true]);}
          foreach([
            ['流浪地球 2','https://example.com/watch/wandering-earth-2','科幻电影','2023'],
            ['宇宙探索编辑部','https://example.com/watch/journey-to-west','剧情电影','2023'],
          ] as $x){$z=$r->saveLink(null,['category_id'=>$media,'title'=>$x[0],'url'=>$x[1],'description'=>$x[2],'is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>$x[3],'media_status'=>'want']);}
          $r->saveLink(null,['category_id'=>$media,'title'=>'未整理 YouTube 频道','url'=>'https://www.youtube.com/@unclassified-example','description'=>'等待归入 Channels','is_private'=>true],'manual');
          echo "P01_V224_UI_SEED=PASS\n";
          PHP
          php /tmp/p01-v224-ui-seed.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v224-ui-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v224-ui-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v224-ui-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v224-ui-baseline.txt
          echo P01_V224_UI_RUNTIME=PASS
      - name: Authenticated UX contract and screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v224-ui
          for spec in 'home:surfaces.php' 'start:start.php' 'channels:channels.php' 'watch:watch.php' 'organizer:surface-manager.php'; do
            name=${spec%%:*}; url=${spec#*:}
            curl -fsS -c /tmp/p01-v224-ui.cookies -b /tmp/p01-v224-ui.cookies "http://127.0.0.1:18244/$url" -o "audit-$name.html"
            grep -F 'vf-app-sidebar' "audit-$name.html" >/dev/null
            grep -F 'vf-app-topbar' "audit-$name.html" >/dev/null
            grep -F 'VF Start' "audit-$name.html" >/dev/null
          done
          grep -F 'Cloudflare Dashboard' audit-home.html >/dev/null
          grep -F '硅谷101' audit-home.html >/dev/null
          grep -F '流浪地球 2' audit-home.html >/dev/null
          grep -F '资源整理' audit-organizer.html >/dev/null
          grep -F 'P01 · 个人互联网入口' audit-home.html >/dev/null
          grep -F '管理设置' audit-home.html >/dev/null
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$BROWSER"
          mkdir -p /tmp/p01-v224-ui-shots
          for name in home start channels watch organizer; do
            "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1000 --screenshot="/tmp/p01-v224-ui-shots/${name}-desktop.png" "http://127.0.0.1:18244/audit-${name}.html"
          done
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=/tmp/p01-v224-ui-shots/home-mobile.png http://127.0.0.1:18244/audit-home.html
          test "$(find /tmp/p01-v224-ui-shots -type f -name '*.png' -size +10k | wc -l)" -eq 6
          printf 'EXACT_DEVELOP=%s\nRUN_MODE=FRESH_RUNTIME\nDESKTOP=1440x1000\nMOBILE=390x844\n' "$EXACT_DEVELOP" >/tmp/p01-v224-ui-shots/MANIFEST.txt
          echo P01_V224_UI_SCREENSHOT_GATE=PASS
      - name: Final database integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v224-ui
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v224-ui.pid)" 2>/dev/null || true
          echo P01_V224_UI_DATABASE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v224-ui-audit-${{ env.EXACT_DEVELOP }}
          path: /tmp/p01-v224-ui-shots
          if-no-files-found: error
          retention-days: 7
      - name: Verdict
        run: |
          echo P01_V224_UI_AUDIT_EXACT_DEVELOP="$EXACT_DEVELOP"
          echo P01_V224_UI_AUDIT_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
