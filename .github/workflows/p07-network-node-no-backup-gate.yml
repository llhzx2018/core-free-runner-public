name: P07 network node rc13 remove backup command gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/p07-network-node/0.1.0-rc13/**'
      - 'installers/vf-node.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-network-node-no-backup-gate.yml'
permissions:
  contents: read
jobs:
  removed-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact immutable rc13 package and removed standalone backup
        shell: bash
        run: |
          set -Eeuo pipefail
          pkg='packages/p07-network-node/0.1.0-rc13'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc13'
          test ! -e "$pkg/backup.sh"
          (cd "$pkg" && sha256sum -c MANIFEST.sha256)
          test "$(sha256sum "$pkg/MANIFEST.sha256" | awk '{print $1}')" = '1ca3dc95a5cc6e5aa35c9b7ead415d3b6ea6c6eb9e8307a76310d146ab53c47f'
          grep -Fq "VERSION='0.1.0-rc13'" installers/vf-node.sh
          grep -Fq "MANIFEST_SHA256='1ca3dc95a5cc6e5aa35c9b7ead415d3b6ea6c6eb9e8307a76310d146ab53c47f'" installers/vf-node.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          bash -n installers/vf-node.sh
          bash -n "$pkg/vf-node.sh"
          bash -n "$pkg/uninstall.sh"
          test "$(bash "$pkg/vf-node.sh" --version | awk '{print $NF}')" = '0.1.0-rc13'
          bash "$pkg/vf-node.sh" --help > /tmp/rc13-help
          ! grep -iq backup /tmp/rc13-help
          if bash "$pkg/vf-node.sh" backup >/tmp/rc13-backup 2>&1; then
            echo 'Removed backup command unexpectedly succeeded' >&2; exit 1
          fi
          grep -Fq '未知命令' /tmp/rc13-backup
          echo 'P07_NODE_BACKUP_COMMAND_REMOVED=PASS'
      - name: Verify consecutive menu and safe uninstall recovery guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pkg=Path('packages/p07-network-node/0.1.0-rc13')
          menu=(pkg/'vf-node.sh').read_text()
          uninstall=(pkg/'uninstall.sh').read_text()
          installer=Path('installers/vf-node.sh').read_text()
          toolbox=Path('installers/p07-toolbox.sh').read_text()
          expected=('1.','2.','3.','4.','0.')
          for n in expected:
              assert '${C_' in menu
          assert '请选择 [0-4]' in menu
          assert '5) run_and_pause' not in menu
          assert '4) run_and_pause bash "$SCRIPT_DIR/uninstall.sh"' in menu
          assert '  backup)' not in menu
          assert 'backup.sh' not in menu and 'backup.sh' not in installer
          assert 'backup.sh' not in uninstall
          assert 'make_uninstall_recovery_copy' not in uninstall
          assert 'create_uninstall_recovery_copy || exit 1' in uninstall
          assert uninstall.index('create_uninstall_recovery_copy || exit 1') < uninstall.index('systemctl stop v2ray.service')
          assert 'VF_NODE_EXPECTED="0.1.0-rc13"' in toolbox
          assert 'VPS_AUDIT_EXPECTED="V2.1.0"' in toolbox
          assert 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' in toolbox
          assert 'SYSTEM_CARE_EXPECTED="0.1.0-rc52"' in toolbox
          print('P07_NODE_CONTIGUOUS_MENU=PASS')
          print('P07_NODE_UNINSTALL_RECOVERY_FAIL_CLOSED=PASS')
          PY
