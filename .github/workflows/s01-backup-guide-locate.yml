name: S01 backup page read-only route text locator
on:
  push:
    branches: [task/s01-backup-guide157-94-20261021]
    paths: ['.github/workflows/s01-backup-guide-locate.yml']
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: cc15f8256f6def8e6a0372994ca09c8cc6ff3fb6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 8945f7f088baec68c5a4982e208bccf03398c4f0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: plugin
      - name: Find top-stage copy sources without modifying any file
        run: |
          set -euo pipefail
          for query in '点击页面中的主按钮' '结果会在当前页面显示' '输入并执行' 'Current tool' '当前工具' 'result will' 'click the primary'; do
            echo "QUERY=$query"
            grep -R -n --include='*.php' --include='*.json' --include='*.js' -F "$query" theme/src plugin/src | cut -c1-400 | head -n 8 || true
          done
          echo READ_ONLY_SOURCE_LOCATOR_FINISHED
