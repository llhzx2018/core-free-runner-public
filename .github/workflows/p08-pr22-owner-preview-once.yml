name: P08 PR22 one-time private Owner preview (never official release)
on:
  push:
    branches: [test/p08-owner-preview-pr22-20261113]
permissions:
  contents: read
jobs:
  preview:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-owner-preview-pr22-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-adops
      TARGET_SHA: 9f796a7302de7d0b2f6a84ba69a6d3fb4a70f1dd
      BRIDGE_SHA: 956c4d2144915e392d745f6ddbbad3c7e1c21442
      PREVIEW_TAG: p08-pr22-0.1.1-owner-preview-20261113
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      P08_ISOLATED_INSTALL_TEST: YES
    steps:
      - name: Verify explicitly authorized scope and protected capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-owner-preview-pr22-20261113
          test -n "$GH_TOKEN" || { echo 'P08_PREVIEW_PRIVATE_PUBLICATION_CREDENTIAL_UNAVAILABLE'; exit 78; }
          test "$(gh api "repos/$PRODUCT_REPO" --jq '.private')" = true || { echo 'P08_PREVIEW_PRIVATE_DESTINATION_REQUIRED'; exit 78; }
          echo 'P08_PREVIEW_NO_PRODUCTION_NO_OFFICIAL_V011_NO_CORE_UPDATES=YES'
      - name: Exact private PR22 checkout (ephemeral only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9f796a7302de7d0b2f6a84ba69a6d3fb4a70f1dd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: PHP 8.4 Composer and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - name: Node 22 locked Vite build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact PR22 source and build actual locked three-archive pair
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = 0.1.1
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/heads/feature/p08-r23-verified-backup-first-upgrade-arm" --jq '.object.sha')" = "$TARGET_SHA"
          git cat-file -e "$BRIDGE_SHA^{commit}"
          python3 scripts/check_stack_contract.py --phase foundation
          python3 scripts/check_bridge_runtime_parity.py
          python3 scripts/build_owner_atomic_pair.py --repo "$PWD" --target-sha "$TARGET_SHA" --output-dir "$RUNNER_TEMP/p08-pr22-exact-pair"
          python3 scripts/verify_owner_atomic_pair.py "$RUNNER_TEMP/p08-pr22-exact-pair" "$BRIDGE_SHA" "$TARGET_SHA"
          test -s "$RUNNER_TEMP/p08-pr22-exact-pair/VF_AdOps_V0.1.1_FULL.zip"
          unzip -tq "$RUNNER_TEMP/p08-pr22-exact-pair/VF_AdOps_V0.1.1_FULL.zip" >/dev/null
          echo 'P08_PRIVATE_PREVIEW_SOURCE_AND_REAL_FULL_BYTES=PASS'
      - name: One genuine isolated SQLite first-install smoke of same exact FULL ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/p08-pr22-disposable-first-install"
          unzip -q "$RUNNER_TEMP/p08-pr22-exact-pair/VF_AdOps_V0.1.1_FULL.zip" -d "$RUNNER_TEMP/p08-pr22-disposable-first-install"
          test ! -f "$RUNNER_TEMP/p08-pr22-disposable-first-install/.env"
          test -f "$RUNNER_TEMP/p08-pr22-disposable-first-install/vendor/autoload.php"
          test -f "$RUNNER_TEMP/p08-pr22-disposable-first-install/public/build/manifest.json"
          mkdir "$RUNNER_TEMP/p08-pr22-disposable-first-install/tests"
          cp source/tests/test_install_sqlite_e2e.php "$RUNNER_TEMP/p08-pr22-disposable-first-install/tests/"
          cd "$RUNNER_TEMP/p08-pr22-disposable-first-install"
          php tests/test_install_sqlite_e2e.php
          test -f storage/app/private/adops/installation/installed.json
          echo 'P08_PRIVATE_PREVIEW_DISPOSABLE_SQLITE_FIRST_INSTALL=PASS'
      - name: Create nonproduction-only preview asset and remote private readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$PRODUCT_REPO" --jq '.private')" = true
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/heads/feature/p08-r23-verified-backup-first-upgrade-arm" --jq '.object.sha')" = "$TARGET_SHA"
          if gh api "repos/$PRODUCT_REPO/git/ref/tags/$PREVIEW_TAG" >/dev/null 2>&1; then
            echo 'P08_PREVIEW_TAG_COLLISION_NO_OVERWRITE'; exit 81
          fi
          if gh release view "$PREVIEW_TAG" -R "$PRODUCT_REPO" >/dev/null 2>&1; then
            echo 'P08_PREVIEW_RELEASE_COLLISION_NO_OVERWRITE'; exit 81
          fi
          mkdir -m 0700 "$RUNNER_TEMP/p08-pr22-private-preview"
          cp "$RUNNER_TEMP/p08-pr22-exact-pair/VF_AdOps_V0.1.1_FULL.zip" "$RUNNER_TEMP/p08-pr22-private-preview/VF_AdOps_V0.1.1_PR22_NONPRODUCTION_PREVIEW_FULL.zip"
          (
            cd "$RUNNER_TEMP/p08-pr22-private-preview"
            sha256sum VF_AdOps_V0.1.1_PR22_NONPRODUCTION_PREVIEW_FULL.zip > SHA256SUMS.txt
          )
          cat > "$RUNNER_TEMP/p08-pr22-private-preview/README_PREVIEW.txt" <<EOF
          VF AdOps 0.1.1 — PR #22 — NONPRODUCTION ONE-TIME OWNER PREVIEW ONLY
          Source commit: $TARGET_SHA
          Project repository: $PRODUCT_REPO (PRIVATE)
          Clean FULL ONLY. No official signed Atomic / official channel.
          Use ONLY on separate disposable test site, with a fresh empty database.
          NEVER overwrite adops.kewaro.com or any existing installed site.
          PHP >= 8.4.1; CloudPanel Nginx document root must point to public/.
          Owner Preview/Real Use is PENDING until Owner actually tests.
          This is NOT an official Release or a Production upgrade authorization.
          EOF
          cat > "$RUNNER_TEMP/p08-pr22-private-preview/RELEASE_NOTES.md" <<EOF
          # VF AdOps 0.1.1 · PR22 一次性非生产预览
          
          本次仅用于 Owner 在隔离的、全新空库测试站体验首次安装、登录、GitHub 只读 Token 保存/替换/撤销和后台更新 UI。
          
          **禁止安装到 Production 或覆盖现有数据。** 这是未签发的预览 FULL，不是正式 0.1.1 Release，也没有官方 Atomic 更新或更新频道。文件实际 SHA-256 见附件 SHA256SUMS.txt。旧版 Bridge、正式发行者、签名 Update、P08-ADOPS 更新通道均不在此预览交付内。
          
          exact-source：$TARGET_SHA；GitHub PR #22。安装前确认 PHP >=8.4.1、Nginx Root 指向 public/、全新空库，访问 /setup。真正 Owner 验收和 CloudPanel/FPM 需独立确认；失败请丢弃整个隔离站，不要覆盖正式站。
          EOF
          gh release create "$PREVIEW_TAG" -R "$PRODUCT_REPO" --target "$TARGET_SHA" \
            --prerelease --title 'VF AdOps 0.1.1 · PR22 PRIVATE OWNER PREVIEW (NOT PRODUCTION)' \
            --notes-file "$RUNNER_TEMP/p08-pr22-private-preview/RELEASE_NOTES.md" \
            "$RUNNER_TEMP/p08-pr22-private-preview/VF_AdOps_V0.1.1_PR22_NONPRODUCTION_PREVIEW_FULL.zip" \
            "$RUNNER_TEMP/p08-pr22-private-preview/SHA256SUMS.txt" \
            "$RUNNER_TEMP/p08-pr22-private-preview/README_PREVIEW.txt"
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$PREVIEW_TAG" --jq '.prerelease')" = true
          test "$(gh api "repos/$PRODUCT_REPO/releases/tags/$PREVIEW_TAG" --jq '.assets | length')" -eq 3
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$PREVIEW_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          mkdir -m 0700 "$RUNNER_TEMP/p08-pr22-preview-readback"
          gh release download "$PREVIEW_TAG" -R "$PRODUCT_REPO" --dir "$RUNNER_TEMP/p08-pr22-preview-readback"
          (
            cd "$RUNNER_TEMP/p08-pr22-preview-readback"
            sha256sum -c SHA256SUMS.txt
          )
          cmp "$RUNNER_TEMP/p08-pr22-private-preview/VF_AdOps_V0.1.1_PR22_NONPRODUCTION_PREVIEW_FULL.zip" \
            "$RUNNER_TEMP/p08-pr22-preview-readback/VF_AdOps_V0.1.1_PR22_NONPRODUCTION_PREVIEW_FULL.zip"
          echo 'P08_NONPRODUCTION_PRIVATE_PREVIEW_RELEASE_AND_REMOTE_SHA256=PASS'
          echo 'P08_OFFICIAL_TAG_RELEASE_CHANNEL_PRODUCTION_UNCHANGED=YES'
      - name: Always remove all private source installed fixtures and binary archives from public runner
        if: always()
        shell: bash
        run: |
          rm -rf source "$RUNNER_TEMP/p08-pr22-exact-pair" \
            "$RUNNER_TEMP/p08-pr22-disposable-first-install" \
            "$RUNNER_TEMP/p08-pr22-private-preview" \
            "$RUNNER_TEMP/p08-pr22-preview-readback"
          echo 'P08_RUNNER_PUBLIC_SOURCE_ARTIFACT_SECRET_PERSISTENCE=NONE'
