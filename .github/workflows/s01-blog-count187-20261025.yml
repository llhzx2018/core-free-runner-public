name: S01 Blog visible count and native query consistency
on:
  push:
    branches: [task/s01-blog-count187-20261025]
    paths: ['.github/workflows/s01-blog-count187-20261025.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.187
  TARGET_SHA: 6c68b4989b27120fb786bcdf7131f90f711a39f4
  TARGET_TREE: 3247b6b585fea7bdfebf27dfa2f292e454e22e6b
  BASE_SHA: 8d0ef7363038d0f08a86e4fe510fd2133f4a451b
  SOURCE_VERSION: 1.35.186
  LANE_ID: s01-blog-count187-20261025
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-blog-count187-20261025/spec.json --input control/.github/workflows/s01-blog-count187-20261025.yml
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 6c68b4989b27120fb786bcdf7131f90f711a39f4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and focused syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-blog-count187-20261025/package.py
          for f in src/inc/modules/module-post-list.php src/inc/services/post-list-query-service.php src/inc/services/frontend-page-progress-service.php src/inc/runtime-constants.php tests/blog-result-count-native-check.php; do php -l "target/$f"; done
          node --check target/tests/blog-result-count-browser-check.cjs
          node --check control/lanes/s01-blog-count187-20261025/clean.cjs
          gh release download v1.35.186 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.186.zip --dir provider
          echo '30cea61d2213ff58ab45dbab17bf96b12539fb52cbc1d13a23a3767b24281841  provider/vf-tools-theme_V1.35.186.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Native WordPress Blog directory and upgrade rollback data protection
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-blog-count187-20261025/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-blog-count187-20261025/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
