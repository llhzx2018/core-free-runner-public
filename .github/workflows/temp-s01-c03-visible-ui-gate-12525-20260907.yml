name: S01-C03 M3U8 1.25.25 Visible UI Gate
on:
  push:
    branches: [temp/s01-c03-visible-ui-gate-12525-20260907]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Credential boundary
        run: |
          test -z "${VF_RELEASE_WRITE_TOKEN:-}"
          test -z "${VF_PRIVATE_READ_TOKEN:-}"
      - name: Checkout exact M3U8 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ux/s01-c03-visible-ui-refresh-12525-20260907
          path: m3u8
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact M3U8 candidate
        run: |
          cd m3u8
          test "$(git rev-parse HEAD)" = "55c9489fa5f806850f5635a93a37c930ff502246"
      - name: Exact six-file UI fence
        run: |
          cd m3u8
          git diff --name-only 9a6997418b339c88a61501f43337a461a8ff1dbb..HEAD | sort > /tmp/changed
          cat >/tmp/expected <<'EOF'
          VERSION
          src/admin/ui-v4/admin-s01-console-v2.css
          src/vf-tool-m3u8.php
          tests/unit/package-physical-locator-contract.php
          tests/unit/update-refresh-policy-contract.php
          tests/unit/visible-console-v2-contract.php
          EOF
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
          ! grep -E 'schema|migration|provider' /tmp/changed
      - name: Version and route identity
        run: |
          cd m3u8
          test "$(tr -d '\r\n' < VERSION)" = '1.25.25'
          grep -Fq 'Version: 1.25.25' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.25'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R249'" src/vf-tool-m3u8.php
          grep -Fq 'R249_S01_VISIBLE_UI_REFRESH' src/vf-tool-m3u8.php
          php tests/unit/admin-human-language-contract.php
      - name: Regression contracts
        run: |
          cd m3u8
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/update-schema-authority-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
      - name: Full PHP syntax gate
        run: |
          cd m3u8
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
      - name: UI-only boundary
        run: |
          cd m3u8
          test "$(git diff --name-only 9a6997418b339c88a61501f43337a461a8ff1dbb..HEAD | wc -l)" -eq 6
          git diff 9a6997418b339c88a61501f43337a461a8ff1dbb..HEAD -- src/admin/ui-v4/admin-s01-console-v2.css | grep -q 'vf-workbench-v12__health'
          git diff 9a6997418b339c88a61501f43337a461a8ff1dbb..HEAD -- src/admin/ui-v4/admin-s01-console-v2.css | grep -q 'vf-workbench-v12__row.is-attention'
          echo 'M3U8_MIGRATION_REMAINS_CLOSED=PASS'
      - name: Post Checkout exact M3U8 candidate
        run: |
          cd m3u8
          test "$(git rev-parse HEAD)" = "55c9489fa5f806850f5635a93a37c930ff502246"