name: P02 V2.5.29 Release Candidate Prep
on:
  push:
    branches: [task/p02-v2529-common-baseline-release-20260828]
    paths: ['.github/workflows/p02-v2529-release-candidate-prep-20260828.yml']
permissions: {contents: read}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare exact P02 release candidate
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --branch release/p02-v2.5.29-common-baseline-v2-20260828 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" p02
          cd p02
          test "$(git rev-parse HEAD)" = a3e42bfecd1214f68e59eb20eba498f0e8ae0dca
          test "$(git ls-remote origin refs/heads/main|awk '{print $1}')" = a3e42bfecd1214f68e59eb20eba498f0e8ae0dca
          test "$(tr -d '\r\n' < VERSION)" = 2.5.28
          printf '2.5.29\n' > VERSION
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          git diff --check
          mapfile -t f < <(git diff --name-only | sort)
          test "${#f[@]}" -eq 3
          test "${f[0]}" = SOURCE_MANIFEST.json
          test "${f[1]}" = SOURCE_MANIFEST.txt
          test "${f[2]}" = VERSION
          grep -Fq '2.5.29' SOURCE_MANIFEST.json
          grep -Fq 'VF Library V2.5.29 CANDIDATE SOURCE_MANIFEST' SOURCE_MANIFEST.txt
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'release(P02): prepare V2.5.29 Common Baseline V2 source'
          git push origin HEAD:release/p02-v2.5.29-common-baseline-v2-20260828
          echo P02_V2529_CANDIDATE_PREP=PASS