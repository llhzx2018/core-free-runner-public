name: P04 VF Infra V2.5.8 Retarget Candidate

on:
  push:
    paths:
      - '.github/workflows/p04-v258-retarget-candidate.yml'

permissions:
  contents: write

jobs:
  retarget:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Retarget exact product candidate and remove self
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p04-v258-candidate-gate.yml')
          s=p.read_text(encoding='utf-8')
          old_commit='a9a372b22f8aaf71be498a98f9496cf48ccb2c40'
          old_tree='7112192eb26aedde672c61df57b77e0beebfe4a0'
          new_commit='29d54486231a4ed06febaf2e777adbd4e15b5ba1'
          new_tree='5039a9192856fe44a397468baa00e5282cd2469a'
          if old_commit not in s or old_tree not in s: raise SystemExit('P04_V258_CANDIDATE_RETARGET_ANCHOR_MISSING')
          p.write_text(s.replace(old_commit,new_commit,1).replace(old_tree,new_tree,1),encoding='utf-8')
          PY
          rm -f .github/workflows/p04-v258-retarget-candidate.yml
          grep -q 'TARGET_COMMIT: 29d54486231a4ed06febaf2e777adbd4e15b5ba1' .github/workflows/p04-v258-candidate-gate.yml
          grep -q 'TARGET_TREE: 5039a9192856fe44a397468baa00e5282cd2469a' .github/workflows/p04-v258-candidate-gate.yml
          git config user.name 'VF Candidate Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci(P04): verify fixed V2.5.8 product candidate'
          git push origin HEAD:main
