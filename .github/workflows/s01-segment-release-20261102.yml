name: S01 segment formal release
on:
  push:
    branches: [task/s01-segment-current-proof-20261031]
    paths: ['.github/workflows/s01-segment-release-20261102.yml']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: theme
            repository: llhzx2018/vf-tools-theme
            commit: 8d51892b55e3939fcaf6cb52d8784fc00b268b0a
            tree: 5b6c1803fb9806a6c683a4819da6847626d796bb
            tag: v1.35.223
            file: vf-tools-theme_V1.35.223.zip
            hash: 5ea5dbc5fda6a2f7ba0b318bb04f75cea2ab22e02ef88c39d9adf2a64c1f2221
          - component: m3u8
            repository: llhzx2018/vf-tools-m3u8
            commit: 5d0fb24e180d4bafe2e9cd79ac5973b0e23990f0
            tree: 5ef7d56490472d8a5ef61a2eb425c764cb9a7aaa
            tag: v1.25.98
            file: vf-tools-m3u8_V1.25.98.zip
            hash: 8804951ff582ab02e237e12a3bdefeb167c115f08b095ff7927921c8f1bffaf9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: s01-segment-41369067984
          path: candidate
          run-id: 41369067984
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidate and verify remote bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          REPO: ${{ matrix.repository }}
          COMMIT: ${{ matrix.commit }}
          TREE: ${{ matrix.tree }}
          TAG: ${{ matrix.tag }}
          ASSET: ${{ matrix.file }}
          HASH: ${{ matrix.hash }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$COMMIT"
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$TREE"
          echo "$HASH  candidate/$ASSET" | sha256sum -c
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then echo "Release already exists; refusing overwrite"; exit 1; fi
          gh release create "$TAG" "candidate/$ASSET" --repo "$REPO" --target "$COMMIT" --title "$TAG" --notes "分片查看器桌面体验与中文运行时修复。机器验证完成；正式站人工验收待后续进行。"
          mkdir remote
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir remote
          cmp "candidate/$ASSET" "remote/$ASSET"
          echo "$HASH  remote/$ASSET" | sha256sum -c
          gh release view "$TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,url
          echo FORMAL_ASSET_REMOTE_BYTES_PASS
