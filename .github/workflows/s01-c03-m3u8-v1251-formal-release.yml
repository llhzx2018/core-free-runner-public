name: S01-C03 M3U8 V1.25.1 Formal Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s01-c03-m3u8-v1251-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c03-m3u8-v1251-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-tools-m3u8
      PRODUCT_COMMIT: 1c8ad3272ffbd7781136d05a4eb22376c2dfc67e
      PRODUCT_TREE: 9ed82a1224ddda19889d6db1302d62de912e6b15
      TAG: v1.25.1
      ASSET_NAME: vf-tools-m3u8_V1.25.1.zip
      EXPECTED_BYTES: '3520019'
      EXPECTED_SHA: 61c09336d6fece2807f223b40a4eae59db06b4edae0f4524a916a072af03f220
      EXPECTED_RUNTIME_FILES: '546'
      EXPECTED_RUNTIME_FP: bf2098f54359915e165c877a18131e88f584982f4cc1eff6fe01a51f72206e3c
    steps:
      - name: Checkout public release shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require existing shared private credential
        env:
          RELEASE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo 'SHARED_PRIVATE_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact verified candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: m3u8
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce and lock byte-identical tested artifact
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git rev-parse HEAD:src)" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < VERSION)" = '1.25.1'
          mkdir -p "$RUNNER_TEMP/m3u8-release"
          python3 tests/wp-update/build_packages.py --repo "$PWD" --out "$RUNNER_TEMP/m3u8-release" > "$RUNNER_TEMP/m3u8-release/meta.json"
          ASSET="$RUNNER_TEMP/m3u8-release/$ASSET_NAME"
          test -f "$ASSET"
          test "$(stat -c %s "$ASSET")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$ASSET" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$RUNNER_TEMP/m3u8-release/meta.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))['candidate']
          assert m['files']==548
          assert m['runtime']['file_count']==546
          assert m['runtime']['fingerprint_sha256']=='bf2098f54359915e165c877a18131e88f584982f4cc1eff6fe01a51f72206e3c'
          PY
          echo 'TESTED_ARTIFACT_BYTE_IDENTITY=PASS'

      - name: Create tag, draft release, upload exact bytes, remote verify, publish
        env:
          RELEASE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/$REPO"
          AUTH=(-H "Authorization: Bearer $RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ASSET="$RUNNER_TEMP/m3u8-release/$ASSET_NAME"
          TAG_CREATED=0
          RELEASE_ID=''
          cleanup_failure(){
            rc=$?
            if [ "$rc" -ne 0 ]; then
              if [ -n "$RELEASE_ID" ]; then curl -sS -X DELETE "${AUTH[@]}" "$API/releases/$RELEASE_ID" >/dev/null || true; fi
              if [ "$TAG_CREATED" = 1 ]; then curl -sS -X DELETE "${AUTH[@]}" "$API/git/refs/tags/$TAG" >/dev/null || true; fi
            fi
            exit "$rc"
          }
          trap cleanup_failure EXIT
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$API/git/ref/tags/$TAG")" = 404
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH[@]}" "$API/releases/tags/$TAG")" = 404
          python3 - "$PRODUCT_COMMIT" > "$RUNNER_TEMP/tag.json" <<'PY'
          import json,sys
          print(json.dumps({'ref':'refs/tags/v1.25.1','sha':sys.argv[1]}))
          PY
          curl --fail-with-body -sS -X POST "${AUTH[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/tag.json" "$API/git/refs" > "$RUNNER_TEMP/tag-response.json"
          TAG_CREATED=1
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/tag-response.json'"))["object"]["sha"])')" = "$PRODUCT_COMMIT"
          cat > "$RUNNER_TEMP/release.json" <<'JSON'
          {
            "tag_name":"v1.25.1",
            "target_commitish":"1c8ad3272ffbd7781136d05a4eb22376c2dfc67e",
            "name":"VF Tools M3U8 V1.25.1",
            "body":"S01-C03 · VF Tools M3U8 V1.25.1\n\nClassification: ONLINE UPDATE BOOTSTRAP BASELINE\n\nBootstrap first hop: WordPress Native Plugin Upload / Replace Existing.\n1.25.0 → 1.25.1 Native Online Update is not supported and is not claimed.\nLocator cutover: NO.\nProduction bootstrap: NOT EXECUTED.",
            "draft":true,
            "prerelease":false
          }
          JSON
          curl --fail-with-body -sS -X POST "${AUTH[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/release.json" "$API/releases" > "$RUNNER_TEMP/release-response.json"
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/release-response.json'"))["id"])')"
          UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME"
          curl --fail-with-body -sS -X POST "${AUTH[@]}" -H 'Content-Type: application/zip' --data-binary @"$ASSET" "$UPLOAD_URL" > "$RUNNER_TEMP/asset-response.json"
          ASSET_ID="$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["id"])')"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["name"])')" = "$ASSET_NAME"
          test "$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP/asset-response.json'"))["size"])')" = "$EXPECTED_BYTES"
          curl --fail-with-body -sS -L "${AUTH[@]}" -H 'Accept: application/octet-stream' "$API/releases/assets/$ASSET_ID" -o "$RUNNER_TEMP/remote-$ASSET_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/remote-$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/remote-$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$RUNNER_TEMP/remote-$ASSET_NAME" <<'PY'
          import zipfile,sys,re,hashlib,os
          p=sys.argv[1]
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            files=[i for i in z.infolist() if not i.is_dir()]
            assert len(files)==548
            assert sorted({i.filename.split('/')[0] for i in z.infolist() if i.filename})==['vf-tool-m3u8']
            main='vf-tool-m3u8/vf-tool-m3u8.php'; txt=z.read(main).decode('utf-8'); assert re.search(r'^\s*\*?\s*Version:\s*1\.25\.1\s*$',txt,re.M)
            allow={'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}; exd=re.compile(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',re.I); exe=re.compile(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',re.I); inc=re.compile(r'^(?:admin|config|includes|public|templates|tools)/'); exb={'readme.md','changelog.md','license','license.txt','package_profile.json'}; r={}
            for i in files:
              rel=i.filename[len('vf-tool-m3u8/'):] if i.filename.startswith('vf-tool-m3u8/') else ''
              if not rel or exd.search(rel) or os.path.basename(rel).lower() in exb or exe.search(rel): continue
              if (rel in allow if '/' not in rel else bool(inc.match(rel))): r[rel]=hashlib.sha256(z.read(i)).hexdigest()
            canon=''.join(f'{k}\0{r[k]}\n' for k in sorted(r)); assert len(r)==546; assert hashlib.sha256(canon.encode()).hexdigest()=='bf2098f54359915e165c877a18131e88f584982f4cc1eff6fe01a51f72206e3c'
          PY
          echo '{"draft":false,"prerelease":false}' > "$RUNNER_TEMP/publish.json"
          curl --fail-with-body -sS -X PATCH "${AUTH[@]}" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/publish.json" "$API/releases/$RELEASE_ID" > "$RUNNER_TEMP/published.json"
          python3 - "$RUNNER_TEMP/published.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['tag_name']=='v1.25.1'; assert x['name']=='VF Tools M3U8 V1.25.1'; assert x['draft'] is False; assert x['prerelease'] is False
          PY
          trap - EXIT
          echo 'FORMAL_RELEASE=PASS'
          echo 'REMOTE_ASSET_EXACT_READBACK=PASS'

      - name: Confirm main remained unchanged
        env:
          RELEASE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          MAIN_SHA="$(curl --fail -sS -H "Authorization: Bearer $RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$REPO/branches/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$MAIN_SHA" = 'a78bb60695f3cd3f8131413b4f0bbc3c9e6a023f'
          echo 'MAIN_MODIFIED=NO'
