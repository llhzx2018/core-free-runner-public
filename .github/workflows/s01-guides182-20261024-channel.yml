name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guides182-20261024]
    paths: ['.github/workflows/s01-guides182-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.182
  TARGET_SHA: f1535ec95e2f4d661a3650628bae0b35b0b1c517
  UPDATE_SHA: f5a3ed6a535f67cf0d54835d55328976c9a82d2b
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: f5a3ed6a535f67cf0d54835d55328976c9a82d2b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='c6a4ef911b9949ef825b8919636894963483dedd3f40680421fa065ad8bcacc4' and m['asset_bytes']==1985299
          assert m['runtime_files']==476 and '1.35.181' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
