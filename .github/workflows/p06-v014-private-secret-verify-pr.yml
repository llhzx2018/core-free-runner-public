name: P06 VF Press V0.1.4 Private Secret Verify

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v014-private-secret-verify-pr.txt

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: c7d8a12bb70166d47e94fd33494055595f7c0376
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source
      - name: Full regression and private secret fallback
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.4'
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '
            require "vendor/autoload.php";
            $storage=getcwd()."/storage";$db=$storage."/app.db";
            $config=new VF\Press\Infrastructure\Config\AppConfig(getcwd(),$storage,$db,"test");
            $pdo=new PDO("sqlite:".$db);$pdo->setAttribute(PDO::ATTR_ERRMODE,PDO::ERRMODE_EXCEPTION);
            $audit=new VF\Press\Infrastructure\Security\AuditLogger($pdo);
            $recovery=new VF\Press\Infrastructure\Recovery\RecoveryService($pdo,$audit,$storage,$db);
            $adapter=new VF\Press\Infrastructure\Update\VFPressUpdateAdapter($pdo,$config,$audit,$recovery);
            putenv("VF_PRIVATE_READ_TOKEN");
            $secretRoot=dirname($storage)."/.vfpress-secrets";$siteKey=substr(hash("sha256",$storage),0,16);$secretFile=$secretRoot."/".$siteKey."/VF_PRIVATE_READ_TOKEN";
            @mkdir(dirname($secretFile),0700,true);file_put_contents($secretFile,"synthetic-private-token\n");@chmod($secretFile,0600);
            $svc=new VF\Press\Application\Operations\OnlineUpdateService($pdo,$config,$audit,$adapter);
            if(!$svc->tokenConfigured()) throw new RuntimeException("PRIVATE_SECRET_FALLBACK_FAIL");
            if(str_starts_with(realpath($secretFile)?:$secretFile, realpath($storage)?:$storage)) throw new RuntimeException("SECRET_INSIDE_DATA_FAIL");
            echo "PRIVATE_SECRET_FALLBACK=PASS\nSECRET_OUTSIDE_DATA=PASS\n";
            @unlink($secretFile);@rmdir(dirname($secretFile));@rmdir($secretRoot);
          '
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq RELEASE_BUILD=PASS /tmp/build
          unzip -p dist/VF_Press_V0.1.4_UPDATE.zip payload/src/Application/Operations/OnlineUpdateService.php | grep -Fq '.vfpress-secrets'
          rm -rf storage dist storage-restore-*
          echo P06_V014_PRIVATE_SECRET_GATE=PASS
