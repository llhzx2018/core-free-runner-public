name: TEMP P08 R43 issued v016 to v018 schema refusal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s9-r43-v018-schema-refusal-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-v018-refusal-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: c727b9149745c76abcf18be2dbf7d71265e597c5
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s9-r43-v018-schema-refusal-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit disposable source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s9-r43-v018-schema-refusal-20261125.json --input .github/workflows/temp-p08-s9-r43-v018-schema-refusal-20261125.yml
          echo P08_R43_SOURCE_IDENTITY=PASS
  issued-source-schema-refusal:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transient exact private P08 candidate and published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: c727b9149745c76abcf18be2dbf7d71265e597c5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - name: Real issued Git diff, backward refusal, and hostile fixture regressions
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test "$(git rev-parse 'v0.1.16^{commit}')" = 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          test -z "$(git status --porcelain)"
          python3 -m unittest discover -s tests -p 'test_s9_r43_schema_boundary.py' -q
          echo P08_R43_NEGATIVE_BOUNDARY_FIXTURES=PASS
          python3 -m unittest discover -s tests -p 'test_r101_atomic_schema_compat.py' -q
          echo P08_R43_CODE_ONLY_COMPAT_NEGATIVES=PASS
          python3 -m unittest discover -s tests -p 'test_atomic_builder.py' -q
          echo P08_R43_ATOMIC_BUILDER_SCHEMA_PARITY=PASS
          python3 scripts/check_s9_r43_schema_boundary.py --repo . --target-sha "$TARGET_SHA"
          echo P08_R43_CODE_ONLY_SAFE_REFUSAL=PASS
          echo P08_R43_SCHEMA_MIGRATION_APPLY=NOT_RUN
          echo P08_R43_FORMAL_RELEASE=NOT_AUTHORIZED
      - name: Delete transient private checkout
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          test ! -e private-p08
          echo P08_R43_PRIVATE_CLEANUP=PASS
