name: P02 W2 attachment exact private-source trial (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-w2-attachment-exact-20261113.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'validation/p02-w2-attachment-0d30fa5b-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout temporary public test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout only the exact private P02 source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0d30fa5b9a4c30deba0b6664013d353e2afa37b8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Verify source and prepare isolated runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = 0d30fa5b9a4c30deba0b6664013d353e2afa37b8
          sudo apt-get update -qq >/dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-zip php-mbstring php-xml composer sqlite3 unzip curl >/dev/null 2>&1
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") && extension_loaded("zip") ? 0 : 1);'
          echo P02_W2_ATTACHMENT_EXACT_SOURCE=0d30fa5b9a4c30deba0b6664013d353e2afa37b8
      - name: Python source contract and negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-src
          if python3 -B -m unittest discover -s tests/unit -p 'test_p02_w2_attachment_read.py' >"$RUNNER_TEMP/p02-attachment-unit.log" 2>&1; then
            echo P02_W2_ATTACHMENT_PYTHON_NEGATIVE=PASS
          else
            echo P02_W2_ATTACHMENT_PYTHON_NEGATIVE=FAIL
            grep -E '^(FAIL|ERROR): test_[[:alnum:]_]+|^FAILED \\(' "$RUNNER_TEMP/p02-attachment-unit.log" | head -n 16 || true
            exit 1
          fi
          if python3 -B scripts/p02-w2-attachment-read-gate.py >"$RUNNER_TEMP/p02-attachment-gate.log" 2>&1; then
            echo P02_W2_ATTACHMENT_SOURCE_GATE=PASS
          else
            echo P02_W2_ATTACHMENT_SOURCE_GATE=FAIL
            grep -E '^P02_W2_ATTACHMENT_READ_GATE=' "$RUNNER_TEMP/p02-attachment-gate.log" | head -n 1 || true
            exit 1
          fi
      - name: Actual Laravel 13 PHP SQLite metadata parity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-src
          for p in src/app/LaravelAttachmentReadBridge.php src/app/AttachmentService.php public/api.php tests/integration/p02_w2_laravel_attachment_reads.php; do
            php -l "$p" >/dev/null || { echo P02_W2_ATTACHMENT_PHP_LINT=FAIL; exit 1; }
          done
          echo P02_W2_ATTACHMENT_PHP_LINT=PASS
          if composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >"$RUNNER_TEMP/p02-attachment-composer.log" 2>&1 &&
             test -f modern/laravel/vendor/autoload.php; then
            mv modern/laravel/vendor "$RUNNER_TEMP/p02-w2-vendor"
            echo P02_W2B_VENDOR_AUTOLOAD="$RUNNER_TEMP/p02-w2-vendor/autoload.php" >>"$GITHUB_ENV"
            P02_W2B_VENDOR_AUTOLOAD="$RUNNER_TEMP/p02-w2-vendor/autoload.php" php tests/integration/p02_w2_laravel_attachment_reads.php >"$RUNNER_TEMP/p02-attachment-parity.log" 2>&1 || {
              echo P02_W2_ATTACHMENT_REAL_LARAVEL_SQLITE=FAIL
              exit 1
            }
            echo P02_W2_ATTACHMENT_REAL_LARAVEL_SQLITE=PASS
          else
            echo P02_W2_ATTACHMENT_COMPOSER=FAIL
            exit 1
          fi
      - name: Actual PHP SQLite and Chrome ON/OFF 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-src
          for mode in 1 0; do
            if P02_W2B_LARAVEL_READ=1 P02_W2C_LARAVEL_ROUTE=1 P02_W2D_INERTIA_PAGE=1 \
              P02_W2B_BROWSER_E2E=1 P02_W2C_BROWSER_E2E=1 P02_W2D_BROWSER_E2E=1 P02_W2E_BROWSER_E2E=1 \
              P02_W2_CANONICAL_SAVE_BRIDGE="$mode" \
              bash scripts/p02-w1-exact-source-build.sh --full >"$RUNNER_TEMP/p02-w2-browser-$mode.log" 2>&1; then
              echo "P02_W2_ATTACHMENT_REAL_BROWSER_MODE_$mode=PASS"
            else
              echo "P02_W2_ATTACHMENT_REAL_BROWSER_MODE_$mode=FAIL"
              exit 1
            fi
          done
      - name: Erase private source and private test logs
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- private-src "$RUNNER_TEMP/p02-w2-vendor"
          rm -f "$RUNNER_TEMP"/p02-attachment-*.log "$RUNNER_TEMP"/p02-w2-browser-*.log
          test ! -e private-src
