name: TEMP S01-C02 Ops 1.21.831 Probe Runtime Trace
on:
  push:
    branches:
      - temp/s01-c02-v121831-tail-replay-probe-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121831-probe-runtime-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b0ef670e5a9564ad33329cfee8d5902bfe6a0d47
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace runtime loader and builder class dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== candidate runtime defs/calls ==='
          grep -RIn 'vf_ops_s01_static_candidate_runtime_v121803' ops/includes ops/vf-ops.php || true
          echo '=== class loader references ==='
          grep -RInE 'class-candidate-(path-filter|entry-processor)|VF_Ops_Release_Candidate_(Path_Filter|Entry_Processor)' ops/includes/bootstrap ops/includes/site-release ops/includes/release | head -400 || true
          echo '=== v121828 full runtime ==='
          grep -RInE 'static_recovery_execution_runtime_v121828|release-pipeline.php|class-candidate-path-filter|class-candidate-entry-processor' ops/includes/site-release/s01-static-recovery-runtime-closure-v121828.php ops/includes/bootstrap ops/includes/release-pipeline.php || true
          echo PASS_V121831_PROBE_RUNTIME_TRACE
