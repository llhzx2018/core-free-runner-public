name: S01 C02 Admin UX V1 Wave1 Gate

on:
  push:
    branches:
      - temp/s01-c02-admin-ux-v1-wave1-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8b232bfe05fae95eb960b64f05ffd7da81919e27
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Verify exact candidate identity and scope
        shell: bash
        run: |
          set -euo pipefail
          base='3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb'
          head='8b232bfe05fae95eb960b64f05ffd7da81919e27'
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$base^{commit}"
          actual="$(git diff --name-only "$base" "$head" | sort)"
          expected="$(printf '%s\n' \
            'assets/css/current/admin-ux-system-v1.css' \
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php' \
            'tests/admin-ux-system-v1-wave1-contract.php' | sort)"
          test "$actual" = "$expected"
          test "$(cat VERSION)" = '1.21.857'
          git diff --quiet "$base" "$head" -- \
            includes/admin-v13/views/dashboard.php \
            includes/admin-v13/views/content_workflow.php \
            includes/admin-v13/views/acceptance_source.php \
            includes/admin-v13/route-contract.php \
            includes/wp-update \
            includes/site-release
          echo 'PASS_EXACT_SCOPE_3_FILES'

      - name: PHP syntax gate
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.php' | xargs -0 -n1 php -l >/dev/null
          echo 'PASS_PHP_LINT'

      - name: Admin UX V1 contract
        run: php tests/admin-ux-system-v1-wave1-contract.php

      - name: Dashboard selector regression
        run: php tests/dashboard-selector-hit-contract.php

      - name: Existing visible console regression
        run: php tests/visible-console-v2-contract.php

      - name: Admin human-language regression
        run: php tests/admin-human-language-contract.php

      - name: Pages and tools language regression
        run: php tests/pages-tools-human-closure-contract.php

      - name: Component status language regression
        run: php tests/system-components-human-language-contract.php

      - name: Gate summary
        run: |
          echo 'PASS_S01_C02_ADMIN_UX_V1_WAVE1'
          echo 'Candidate: 8b232bfe05fae95eb960b64f05ffd7da81919e27'
          echo 'Base: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb'
          echo 'Production: NOT_RUN'
