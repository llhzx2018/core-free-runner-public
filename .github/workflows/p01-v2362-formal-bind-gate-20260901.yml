name: P01 V2.36.2 Formal Bind Gate
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-formal-bind-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BOUND: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      CANDIDATE: 67b00fd8cdb20c18cd6dedf3b412aa007854fabe
      DEVELOP: 0fd80ff3996e31abec24e85199f171769460fa3d
      RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      CANDIDATE_RUN: '33478737169'
      CANDIDATE_ARTIFACT: '9789120412'
      CANDIDATE_DIGEST: 42c39e68648784c56cbd443258f40346966573d0da4baa0fcb6217719bf2dde3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BOUND }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Exact formal bind fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2362-formal-bind
          test "$(git rev-parse HEAD)" = "$BOUND"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$CANDIDATE..$BOUND" | tr '\n' ' ')" = 'VF_PROJECT.json '
          test "$(cat VERSION)" = '2.36.2'
          test "$(cat src/VERSION.txt)" = '2.36.2'
          grep -Fx "define('VF_VERSION', '2.36.2');" src/app/bootstrap.php >/dev/null
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e --arg run "$CANDIDATE_RUN" --arg art "$CANDIDATE_ARTIFACT" --arg digest "$CANDIDATE_DIGEST" '
            .candidate_version=="2.36.2" and
            .schema_version=="2026082901" and
            .production_version=="2.36.0" and
            .v2_36_2_candidate_gate.state=="PASS" and
            (.v2_36_2_candidate_gate.candidate_readiness_run|tostring)==$run and
            (.v2_36_2_candidate_gate.artifact|tostring)==$art and
            .v2_36_2_candidate_gate.artifact_sha256==$digest and
            .v2_36_2_candidate_gate.candidate=="67b00fd8cdb20c18cd6dedf3b412aa007854fabe" and
            .v2_36_2_candidate_gate.runtime_tree=="55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424" and
            .v2_36_2_candidate_gate.runtime_delta_count==6 and
            .v2_36_2_candidate_gate.runtime_added==["assets/auth-controls.js"] and
            .v2_36_2_candidate_gate.runtime_removed==[] and
            .v2_36_2_candidate_gate.full_zip_sha256=="2ac81cb8fba0815e006170a897017ea14ca8a6c77e41dfcfe0332f64c4604870" and
            .v2_36_2_candidate_gate.update_zip_sha256=="8ab1a12d23ad50276e26ae773bcf97feac0bb97198ab65b3e68c93889362e121" and
            .v2_36_2_candidate_gate.atomic_upgrade=="V2.36.1 -> V2.36.2 PASS" and
            .v2_36_2_candidate_gate.visible_auth_entry=="390 + 1440 / REAL LOGIN + LOGOUT / PASS" and
            .v2_36_2_candidate_gate.owner_production_write==false and
            .v2_36_2_candidate_gate.release_published==false
          ' VF_PROJECT.json >/dev/null
          git diff --check "$CANDIDATE..$BOUND"
          git diff --name-only "$DEVELOP..$BOUND" | sort | tee /tmp/p01-v2362-formal-bind/develop-delta.txt
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/p01-v2362-formal-bind/develop-delta.txt
          test "$(git rev-parse "$DEVELOP:src/app/FunctionalWorkspaceShell.php")" = "$(git rev-parse "$BOUND:src/app/FunctionalWorkspaceShell.php")"
          test "$(git rev-parse "$DEVELOP:src/assets/auth-controls.js")" = "$(git rev-parse "$BOUND:src/assets/auth-controls.js")"
          test "$(git rev-parse "$DEVELOP:src/assets/workspace-rebaseline.css")" = "$(git rev-parse "$BOUND:src/assets/workspace-rebaseline.css")"
          test "$(git rev-parse "$DEVELOP:src/index.php")" = "$(git rev-parse "$BOUND:src/index.php")"
          printf 'P01_V2362_FORMAL_BIND_GATE=PASS\nBOUND=%s\nRUNTIME_TREE=%s\nDEVELOP_DELTA=5\nMAIN_WRITE=NO\nRELEASE_PUBLISHED=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$BOUND" "$RUNTIME_TREE" | tee /tmp/p01-v2362-formal-bind/verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2362-formal-bind
          if-no-files-found: error
          retention-days: 90
