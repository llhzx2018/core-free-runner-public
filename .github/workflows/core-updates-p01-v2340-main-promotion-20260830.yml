name: Core Updates P01 V2.34 Main Promotion
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths: [.github/workflows/core-updates-p01-v2340-main-promotion-20260830.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify manifest gate and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          GATE=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33315793899)
          test "$(jq -r .status <<<"$GATE")" = completed
          test "$(jq -r .conclusion <<<"$GATE")" = success
          test "$(jq -r .head_sha <<<"$GATE")" = 85bba44e82137f8708a3655974b42d70a6ff0add
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 73c3e0400713d201411d7fda3be426d180b85d91
          rm -rf updates
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          git -C updates fetch -q origin release/p01-v2.34.0-manifest-20260830 main
          test "$(git -C updates rev-parse origin/release/p01-v2.34.0-manifest-20260830)" = 8db85499605c34c6b72e664778fa709aa40dc963
          test "$(git -C updates merge-base origin/main origin/release/p01-v2.34.0-manifest-20260830)" = 73c3e0400713d201411d7fda3be426d180b85d91
          test "$(git -C updates diff --name-only origin/main...origin/release/p01-v2.34.0-manifest-20260830)" = projects/P01.json
          echo CORE_UPDATES_P01_V2340_PROMOTION_PRECHECK=PASS
      - name: Promote exact manifest candidate to core-updates main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C updates push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" 8db85499605c34c6b72e664778fa709aa40dc963:refs/heads/main
          git -C updates fetch -q origin main
          test "$(git -C updates rev-parse origin/main)" = 8db85499605c34c6b72e664778fa709aa40dc963
          jq -e '.current_version=="2.33.0" and .target_version=="2.34.0" and .release_id==379298288 and .product_identity=="518d10f446ea85445d1110a3defafc5bcbece473" and .asset_sha256=="0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58"' updates/projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V2340_MAIN_PROMOTION=PASS
          echo OWNER_PRODUCTION_WRITE=NO
