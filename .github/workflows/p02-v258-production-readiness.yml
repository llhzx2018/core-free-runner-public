name: P02 V2.5.8 Production Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v258-production-readiness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_REF: 0d71a5005d2495959f25aa6705ad5d8d3e6dc4a4
      PRODUCT_SOURCE_REF: v2.5.6
      TARGET_REF: 56ea24d4bd42b94450f64b3d75a244816b9e9ab9
      RELEASE_ID: '372804743'
      UPDATE_NAME: VF_Library_V2.5.8_UPDATE.zip
      UPDATE_BYTES: '319074'
      UPDATE_SHA256: bf89ccc74b286832e78a148d7213520e2c09de36215f40ecd2ec4ed946ee0530
    steps:
      - name: Require registered private read capability
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
        run: test -n "$READ_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: '${{ env.CORE_UPDATES_REF }}'
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: updates
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_SOURCE_REF }}'
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Validate authority and Release identity
        env:
          GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_REF"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.5.6
          python3 - <<'PY'
          import json,os
          m=json.load(open('updates/projects/P02.json',encoding='utf-8'))
          expected={'schema_version':'1.0','project_id':'P02','component_id':'APP','enabled':True,'current_version':'2.5.6','target_version':'2.5.8','update_type':'ATOMIC','from_versions':['2.5.6'],'schema_from':'2401','schema_to':'2401','repository':'llhzx2018/vf-library','release_tag':'v2.5.8','release_id':int(os.environ['RELEASE_ID']),'product_identity':os.environ['TARGET_REF'],'asset_name':os.environ['UPDATE_NAME'],'asset_bytes':int(os.environ['UPDATE_BYTES']),'asset_sha256':os.environ['UPDATE_SHA256'],'backup_required':True,'rollback_supported':True}
          for k,v in expected.items():assert m.get(k)==v,(k,m.get(k),v)
          print('CORE_UPDATES_AUTHORITY=PASS')
          PY
          gh release view v2.5.8 --repo llhzx2018/vf-library --json databaseId,tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1]));assert int(x['databaseId'])==int(os.environ['RELEASE_ID']);assert x['tagName']=='v2.5.8' and not x['isDraft'] and not x['isPrerelease'];a={x['name']:x for x in x['assets']}[os.environ['UPDATE_NAME']];assert int(a['size'])==int(os.environ['UPDATE_BYTES']);print('REMOTE_RELEASE_METADATA=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/r";gh release download v2.5.8 --repo llhzx2018/vf-library --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/r"
          test "$(stat -c%s "$RUNNER_TEMP/r/$UPDATE_NAME")" = "$UPDATE_BYTES";test "$(sha256sum "$RUNNER_TEMP/r/$UPDATE_NAME"|awk '{print $1}')" = "$UPDATE_SHA256"
          unzip -p "$RUNNER_TEMP/r/$UPDATE_NAME" atomic-manifest.json | jq -e '.source_version=="2.5.6" and .target_version=="2.5.8"' >/dev/null
          echo REMOTE_UPDATE_IDENTITY=PASS
      - name: Actual V2.5.6 UpdateService readiness
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/site256";mkdir -p "$ROOT";bash source/scripts/build-deploy-tree.sh "$ROOT" >/dev/null;test "$(cat "$ROOT/VERSION.txt")" = 2.5.6
          cat > "$RUNNER_TEMP/check.php" <<'PHP'
          <?php
          $site=$argv[1];$mp=$argv[2];$pkg=$argv[3];require $site.'/app/bootstrap.php';require_once $site.'/app/UpdateService.php';$m=json_decode(file_get_contents($mp),true);$svc=new VfLibraryUpdateService(fn()=>$m,null,fn()=>2401);$check=$svc->check(true);$status=$check['status']??[];$cr=$check['core']??[];$core=new CoreUpdates\UpdateCore('P02','APP');$v=$core->verifyPackage($pkg,$m);$latest=$core->check('2.5.8','2401',$m);$stale=$core->check('2.5.5','2401',$m);$wrong=$core->check('2.5.6','9999',$m);echo json_encode(compact('cr','status','v','latest','stale','wrong'),JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE),"\n";if(($cr['status']??'')!=='AVAILABLE')exit(2);if(empty($status['can_update'])||empty($status['update_available']))exit(3);if(($status['latest_version']??'')!=='2.5.8')exit(4);if(($v['status']??'')!=='VERIFIED')exit(5);if(($latest['status']??'')!=='UP_TO_DATE')exit(6);if(($stale['status']??'')!=='BLOCKED_SOURCE_VERSION')exit(7);if(($wrong['status']??'')!=='BLOCKED_SCHEMA')exit(8);
          PHP
          php "$RUNNER_TEMP/check.php" "$ROOT" updates/projects/P02.json "$RUNNER_TEMP/r/$UPDATE_NAME"
          echo ACTUAL_V256_UPDATE_SERVICE=AVAILABLE
          echo CAN_UPDATE=TRUE
          echo PACKAGE_VERIFIED=PASS
          echo TARGET_2.5.8=UP_TO_DATE
          echo STALE_AND_SCHEMA_FAIL_CLOSED=PASS
          echo P02_V258_PRODUCTION_READINESS=PASS
          echo PRODUCTION_WRITE=NO
