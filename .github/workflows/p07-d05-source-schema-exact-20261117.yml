name: P07 D05 selected source schema readonly exact-source TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-source-schema-exact-20261117.yml'
permissions:
  contents: read
jobs:
  exact-d05-source-schema:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout temporary Public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 D05 source into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f01134612aca493711fb54c6080c300950e1411d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout existing GOV architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-gov
      - name: Selected source schema read-only unit and complete PR architecture checks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = f01134612aca493711fb54c6080c300950e1411d
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in ("lib/db_engine_conversion_source_schema.py",
                       "tests/test_p07_m03_d05_source_schema.py",
                       "tests/test_p07_m03_d05_source_schema_native.py"):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          print("P07_D05_SOURCE_SCHEMA_AST_NO_PYC=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_source_schema.py -v
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha f01134612aca493711fb54c6080c300950e1411d
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output([
              "git", "diff", "--name-only",
              "df5625d1e601307474891f31b1e6a5052f41b1fd",
              "f01134612aca493711fb54c6080c300950e1411d"
          ], text=True).splitlines()
          allowed = {"lib/db_engine_conversion_source_schema.py",
                     "bin/vfops_db_convert_plan.py",
                     "tests/test_p07_m03_d05_source_schema.py",
                     "tests/test_p07_m03_d05_source_schema_native.py"}
          assert set(changed) == allowed, "D05_SCOPE_DRIFT"
          print("P07_D05_SOURCE_SCHEMA_D04_OTHER_MODULES_UNCHANGED=PASS")
          PY
          echo P07_D05_SOURCE_SCHEMA_UNIT_ARCH_SCOPE=PASS
      - name: Selected source schema real native engine metadata/negative checks
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=30s 1200s \
            python3 -B -m unittest discover -s tests \
            -p test_p07_m03_d05_source_schema_native.py -v
          echo P07_D05_SELECTED_SOURCE_SCHEMA_BOTH_ENGINES=PASS
      - name: Clean exact private/GOV workspaces and owned lab containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter name='^/p07-d05-' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
