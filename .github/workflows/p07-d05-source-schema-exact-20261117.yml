name: P07 D05 actual WordPress one-site cross-engine lab TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-source-schema-exact-20261117.yml'
permissions:
  contents: read
jobs:
  wordpress-real-application:
    if: github.event.action == 'reopened' || github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    steps:
      - name: Checkout temporary public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private product into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: bf825d079c6e859cb111355b427ccb5b1876e56b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout shared existing GOV architecture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-gov
      - name: New WP code unit guard and unchanged architecture check
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = bf825d079c6e859cb111355b427ccb5b1876e56b
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for p in ("lib/db_engine_conversion_wordpress_lab.py",
                    "tests/test_p07_m03_d05_wordpress_lab.py"):
              ast.parse(Path(p).read_text(encoding="utf-8"), filename=p)
          print("P07_D05_WP_REAL_APP_AST=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_wordpress_lab.py -v
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha bf825d079c6e859cb111355b427ccb5b1876e56b
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only", "6fbd5311593ef449f8797622cc881d4bbda8ab39", "bf825d079c6e859cb111355b427ccb5b1876e56b"
          ], text=True).splitlines())
          allowed = {"lib/db_engine_conversion_wordpress_lab.py"}
          assert changed == allowed, "D05_WP_APP_SCOPE_DRIFT"
          print("P07_D05_D04_AND_FOUR_MODULES_UNCHANGED=PASS")
          PY
      - name: Actual official WordPress PHP application MySQL8.4 to MariaDB11.8
        shell: bash
        env:
          P07_ALLOW_WORDPRESS_D05_LAB: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=30s 1600s \
            python3 -B -m unittest discover -s tests \
              -p test_p07_m03_d05_wordpress_lab.py -v
          echo P07_D05_UPSTREAM_WORDPRESS_NATIVE_APP_RECOVERY=PASS
      - name: Always scrub owned lab resources and ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker rm -f >/dev/null 2>&1
          docker network ls -q --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker network rm >/dev/null 2>&1
          docker volume ls -q --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker volume rm >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
