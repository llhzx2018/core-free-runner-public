name: P07 D05 private converted backup native dump and reimport TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-source-schema-exact-20261117.yml'
permissions:
  contents: read
jobs:
  p07-converted-backup:
    if: github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 33
    steps:
      - name: Checkout reused temporary public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 product into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 2a65846d57e417ded8dfc35b4c2af9f1938afc56
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout existing GOV architecture source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-gov
      - name: New converted backup guards and quality gates
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = 2a65846d57e417ded8dfc35b4c2af9f1938afc56
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in ("lib/db_engine_conversion_converted_backup.py",
                       "bin/vfops_db_convert_offline_trial.py",
                       "tests/test_p07_m03_d05_converted_backup.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("P07_D05_PRIVATE_BACKUP_AST=PASS")
          PY
          python3 -B -m unittest discover -s tests \
            -p test_p07_m03_d05_converted_backup.py -v
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha 2a65846d57e417ded8dfc35b4c2af9f1938afc56
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output([
              "git","diff","--name-only","a60e7f5f860bed51754e8afc08ad2be613a2c4e0","2a65846d57e417ded8dfc35b4c2af9f1938afc56"
          ],text=True).splitlines())
          allowed={
              "lib/db_engine_conversion_converted_backup.py",
              "tests/test_p07_m03_d05_converted_backup.py",
              "bin/vfops_db_convert_offline_trial.py",
              "docs/authority/P07_MODULE_REGISTRY.json",
              "docs/authority/P07_DB_ENGINE_CONVERSION_V1.md",
          }
          assert changed==allowed,"P07_D05_CONVERTED_BACKUP_SCOPE_DRIFT"
          print("P07_D05_D04_FOUR_OTHER_MODULES_UNCHANGED=PASS")
          PY
      - name: Actual native converted SQL saved, reimported and source untouched
        shell: bash
        env:
          P07_ALLOW_D05_OFFLINE_BACKUP_LAB: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=30s 1600s \
            python3 -B -m unittest discover -s tests \
              -p test_p07_m03_d05_converted_backup.py -v
          echo P07_D05_PRIVATE_CONVERTED_NATIVE_BACKUP_REIMPORT=PASS
      - name: Always scrub test-only DB and ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker rm -f >/dev/null 2>&1
          docker network ls -q --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker network rm >/dev/null 2>&1
          docker volume ls -q --filter label=org.kewaro.p07.d05.wp_lab | xargs -r docker volume rm >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
