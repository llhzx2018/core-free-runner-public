name: P07 D05 personal one-site simple menu exact-source TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-source-schema-exact-20261117.yml'
permissions:
  contents: read
jobs:
  exact-d05-m03-readonly-menu:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout temporary Public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source into ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ee4ec878986cd30b19808b33e45f5552d4c17193
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout existing GOV architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-gov
      - name: Existing M03 UX and D05 static planner unit regression, full safety gates
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = ee4ec878986cd30b19808b33e45f5552d4c17193
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          bash -n bin/vfops-user
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in ("bin/vfops_db_convert_plan.py",
                       "tests/test_p07_m03_parent_terminal_ux_v3.py",
                       "tests/test_p07_m03_db_conversion_plan.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("P07_D05_M03_ENTRY_SYNTAX=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_parent_terminal_ux_v3.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_db_conversion_plan.py -v
          python3 -B -m unittest discover -s tests -p test_main_menu_routes.py -v
          python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -v
          python3 -B -m unittest discover -s tests -p test_p07_module_contract.py -v
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03 \
            --changed-file bin/vfops-user \
            --changed-file bin/vfops_db_convert_plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-readonly-route.json
          python3 -B scripts/check_p07_modules.py
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha ee4ec878986cd30b19808b33e45f5552d4c17193
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only",
              "2f11becf656ed0ae256f64209a3675e2bb7d37a6", "ee4ec878986cd30b19808b33e45f5552d4c17193"
          ], text=True).splitlines())
          allowed = {
              "bin/vfops-user",
              "tests/test_p07_m03_parent_terminal_ux_v3.py",
              "docs/authority/P07_DB_ENGINE_CONVERSION_V1.md",
              "docs/authority/ACCEPTANCE_MATRIX.md",
          }
          assert changed == allowed, f"P07_D05_M03_SCOPE_DRIFT:{sorted(changed ^ allowed)}"
          print("P07_D05_D04_OTHER_MODULES_UNCHANGED=PASS")
          PY
          echo P07_D05_READONLY_ENTRY_UX_ARCH=PASS
      - name: Actual non-TTY SSH menu positive-negative direct execution
        shell: bash
        env:
          NO_COLOR: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          result="$(printf '6\n1\n1\n0\n' | bash bin/vfops-user)"
          printf '%s\n' "$result" | grep -qF 'MySQL 8.4 → MariaDB 11.8'
          printf '%s\n' "$result" | grep -qF '先转换，再迁移'
          printf '%s\n' "$result" | grep -qF '本次没有连接数据库'
          result="$(printf '6\n1\n2\n0\n' | bash bin/vfops-user)"
          printf '%s\n' "$result" | grep -qF 'MariaDB 11.8 → MySQL 8.4'
          printf '%s\n' "$result" | grep -qF '认证阻断'
          result="$(printf '6\n2\n1\n0\n' | bash bin/vfops-user)"
          printf '%s\n' "$result" | grep -qF '当前服务器独立转换'
          result="$(printf '6\n0\n0\n' | bash bin/vfops-user)"
          if printf '%s\n' "$result" | grep -qF '本次没有连接数据库'; then
            echo P07_D05_CANCEL_CALLED_PLANNER >&2
            exit 1
          fi
          echo P07_D05_REAL_SHELL_MENU_READONLY=PASS
      - name: Clean exact private and GOV workspaces
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
