name: P07 D05 one-site schema native 12-table PK evidence TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-source-schema-exact-20261117.yml'
permissions:
  contents: read
jobs:
  exact-d05-source-admission:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout existing Public-safe temporary workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 product only in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: af62529970c362cc699220c0c8b15da88e6f9be8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-d05-private
      - name: Checkout existing GOV architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-gov
      - name: Targeted selected-site source scope and full architecture safety
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = af62529970c362cc699220c0c8b15da88e6f9be8
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in ("lib/db_engine_conversion_source_schema.py",
                       "tests/test_p07_m03_d05_source_schema.py",
                       "tests/test_p07_m03_d05_source_schema_native.py"):
              ast.parse(Path(path).read_text(encoding="utf-8"), filename=path)
          print("P07_D05_SELECTED_SCHEMA_AST=PASS")
          PY
          python3 -B -m unittest discover -s tests \
            -p test_p07_m03_d05_source_schema.py -v
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 \
            --head-sha af62529970c362cc699220c0c8b15da88e6f9be8
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output([
              "git", "diff", "--name-only",
              "ee4ec878986cd30b19808b33e45f5552d4c17193", "af62529970c362cc699220c0c8b15da88e6f9be8"
          ], text=True).splitlines())
          allowed = {
              "lib/db_engine_conversion_source_schema.py",
              "tests/test_p07_m03_d05_source_schema.py",
              "tests/test_p07_m03_d05_source_schema_native.py",
              "docs/authority/P07_DB_ENGINE_CONVERSION_V1.md",
          }
          assert changed == allowed, f"D05_SCOPE_DRIFT:{sorted(changed ^ allowed)}"
          print("P07_D05_D04_OTHER_MODULES_UNCHANGED=PASS")
          PY
          echo P07_D05_ONE_SITE_SCHEMA_SCOPE_AND_ARCH=PASS
      - name: Native MySQL8.4 and MariaDB11.8 per-table primary proof
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=30s 1200s \
            python3 -B -m unittest discover -s tests \
              -p test_p07_m03_d05_source_schema_native.py -v
          echo P07_D05_ONE_SITE_12_TABLE_AND_PK_BOTH_NATIVE_ENGINES=PASS
      - name: Clean exact private and GOV workspaces and owned DB containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter name='^/p07-d05-' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-gov
          test ! -e .p07-d05-private && test ! -e .p07-gov
          echo P07_D05_PRIVATE_WORKSPACE_CLEAN=PASS
