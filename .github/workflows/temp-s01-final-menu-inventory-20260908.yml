name: temp-s01-final-menu-inventory-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-final-menu-inventory-20260908.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Inventory exact release-source menu registrations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INVENTORY_MODE=READ_ONLY WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/theme /tmp/ops /tmp/m3u8
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" /tmp/theme
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" /tmp/ops
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" /tmp/m3u8
          git -C /tmp/theme checkout -q cae2e2dbc78ac46ed339589f741d26656673d4a9
          git -C /tmp/ops checkout -q fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
          git -C /tmp/m3u8 checkout -q 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
          for spec in 'THEME:/tmp/theme' 'OPS:/tmp/ops' 'M3U8:/tmp/m3u8'; do
            label="${spec%%:*}"; dir="${spec#*:}"
            echo "===== ${label}_IDENTITY ====="
            printf 'HEAD='; git -C "$dir" rev-parse HEAD
            printf 'VERSION='; cat "$dir/VERSION" 2>/dev/null || true
            echo "===== ${label}_MENU_CALLS ====="
            grep -RInE --include='*.php' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'add_(menu_page|submenu_page|theme_page|management_page|plugins_page|options_page)\s*\(' "$dir/src" | head -n 300 || true
            echo "===== ${label}_UPDATE_WORDING ====="
            grep -RInE --include='*.php' --include='*.js' --include='*.json' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules 'VF 在线更新|在线更新|vf[-_](tools[-_])?update|update[-_](center|hub|ui)|统一更新|components?.*update' "$dir/src" | head -n 400 || true
            echo "===== ${label}_TOOLS_PARENT ====="
            grep -RInE --include='*.php' --exclude-dir=.git --exclude-dir=vendor --exclude-dir=node_modules "tools\.php|add_submenu_page\s*\(\s*['\"]tools\.php" "$dir/src" | head -n 200 || true
          done
          echo 'PASS_S01_FINAL_MENU_INVENTORY'
