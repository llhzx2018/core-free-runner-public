name: P07 System Care rc43 single-screen formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc43-one-shot-release.yml'
permissions:
  contents: read
jobs:
  formal-release:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): System Care rc43 owner UX closure'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact immutable delivery and isolated gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '4921598574e07b357a81f3c5eddd123b73c18897'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          test "$(cat packages/p07-system-care/0.1.0-rc43/VERSION)" = '0.1.0-rc43'
          test "$(git hash-object packages/p07-system-care/0.1.0-rc43/MANIFEST.gitblob)" = 'b298fc798f53ac8370d1a61a2e2c6442a06f8a53'
          test "$(git hash-object packages/p07-system-care/0.1.0-rc43/vf-system-care.sh)" = '59321bf17c9590f2b9f0925e85b360e1eb5de66d'
          grep -Fq "VERSION='0.1.0-rc43'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='b298fc798f53ac8370d1a61a2e2c6442a06f8a53'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='59321bf17c9590f2b9f0925e85b360e1eb5de66d'" installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc43"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          (cd packages/p07-system-care/0.1.0-rc43 && while read -r hash file; do test "$(git hash-object "$file")" = "$hash"; done < MANIFEST.gitblob)
          for id in 37755533739 37755533791 37755533769 37755533882 37755533762 37755533757 37755533912 37755533852 37755533986 37755533886 37755534050 37755534004; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = 'b4f4e27e4ee79b3a4a1182c890fca720d6c2a85e'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_CARE_RC43_FORMAL_PRECONDITIONS=PASS
      - name: Create formal release and confirm remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc43-one-screen'
          target='4921598574e07b357a81f3c5eddd123b73c18897'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · 服务器维护与安全 rc43 · 单屏及返回修复' \
              --notes 'OWNER 截图指出磁盘清理和性能配置无法显示确认/按 Enter 返回。现修复交互脚本经过 sed 过滤造成无换行 Y/N 提示被缓冲的问题；恢复原生终端实时确认。磁盘清理输出浓缩一屏；性能配置只显示一套只读结论，只有用户明确输入 A 并再次确认才进入原来的安全应用流程。菜单4八项功能全部保留，避免无价值重复说明；菜单1 网络节点 rc13、菜单2 VPS V2.1.0、菜单3 网站与数据 release84、菜单5 新服务器初始化均未修改。Public Distribution CI 12/12 PASS，包括隔离伪终端无换行提示回归。生产写入、真实备份恢复和迁移均未执行，OWNER PASS 单独验收。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_CARE_RC43_FORMAL_RELEASE=PASS
