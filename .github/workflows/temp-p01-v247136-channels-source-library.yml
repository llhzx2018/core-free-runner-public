name: P01 V2.47.136 Channels Source Library Gate

on:
  push:
    branches:
      - test-p01-v247136-channels-source-library-20260930
    paths:
      - '.github/workflows/temp-p01-v247136-channels-source-library.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6866266a980bb4de35d96c1cdedbd99e2231534a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: candidate

      - name: Checkout stable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 27650c6465ffa3252ddb474f697837d21e885ddf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Exact identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate/VERSION)" = "2.47.136"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.136"
          grep -F "define('VF_VERSION', '2.47.136');" candidate/src/app/bootstrap.php
          php -l candidate/src/app/ChannelLibraryPage.php
          php -l candidate/src/channels.php
          php -l candidate/tests/unit/channels_v247136_source_row_cascade_contract.php
          echo P01_V247136_CHANNELS_IDENTITY_SYNTAX=PASS

      - name: Channels focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php tests/unit/channels_v247136_source_row_cascade_contract.php
          php tests/unit/channels_v247125_mature_source_library_contract.php
          php tests/unit/channels_page_full_polish_contract.php
          php tests/unit/channel_page_full_polish_contract.php
          php tests/unit/channel_card_action_hierarchy_contract.php
          php tests/unit/channel_mobile_first_content_r4_contract.php
          php tests/unit/channel_kind_facet_context_contract.php
          php tests/unit/channel_provider_context_facet_contract.php
          php tests/unit/channel_provider_normalization_contract.php
          php tests/unit/channel_provider_zero_result_contract.php
          php tests/unit/channel_type_context_count_contract.php
          php tests/unit/channel_watch_search_context_contract.php
          php tests/unit/channel_add_background_context_contract.php
          php tests/unit/uxui_round6_channels_watch_identity_contract.php
          php tests/unit/uxui_round8_visual_system_contract.php
          php tests/unit/ux01_global_visual_system_contract.php
          php tests/unit/ux02_interaction_contract.php
          echo P01_V247136_CHANNELS_FOCUSED=PASS

      - name: Release delta boundary
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git diff --name-only 27650c6465ffa3252ddb474f697837d21e885ddf..6866266a980bb4de35d96c1cdedbd99e2231534a > /tmp/release-files.txt
          cat /tmp/release-files.txt
          if grep -E '(^|/)(migrations?|schema)(/|\.|$)' /tmp/release-files.txt; then
            echo P01_V247136_SCHEMA_BOUNDARY=FAIL
            exit 1
          fi
          echo P01_V247136_SCHEMA_BOUNDARY=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -euo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline
          echo P01_V247136_CHANNELS_CANONICAL=PASS
