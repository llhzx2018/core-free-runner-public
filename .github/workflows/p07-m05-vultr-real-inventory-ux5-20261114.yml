# One-shot public-safe proof: only GitHub-hosted disposable KVM, never Owner VPS.
# Private P07 source is transiently fetched and deleted; no artifacts are uploaded.
name: P07-M05 新服务器初始化 UX5 Debian13 KVM 实机
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m05-vultr-real-inventory-ux5-20261114.yml']
permissions:
  contents: read
jobs:
  full-kvm:
    if: github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-m05-vultr-real-inventory-ux5-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Verify free disposable GitHub-hosted runner supports hardware KVM
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${GITHUB_REPOSITORY:-}" = llhzx2018/core-free-runner-public
          [[ "${GITHUB_REF:-}" =~ ^refs/pull/[0-9]+/merge$ ]]
          test "$(uname -m)" = x86_64
          if [[ ! -c /dev/kvm ]]; then
            echo 'P07_M05_UX5_FULL_KVM=BLOCKED_KVM_DEVICE_UNAVAILABLE'
            exit 12
          fi
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          test ! -e /opt/vfops-modules/m05 && test ! -e /home/clp
          echo P07_M05_UX5_REAL_HARDWARE_KVM=PASS
      - name: Checkout immutable public Debian13 KVM + first-admin harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 4571db5fad5fc6b21b82fa3b1cb881b752268f52
          persist-credentials: false
          fetch-depth: 1
          path: public_harness
      - name: Checkout immutable PRIVATE M05 package only inside private CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: eaff34e6c1e40842a9342b862bfd6ed6b2244c19
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private_m05
      - name: Verify immutable inputs, safely adapt harness provenance, and run REAL full install
        shell: bash
        env:
          P07_M05_THROWAWAY_GITHUB_VM: YES_I_ACKNOWLEDGE_EPHEMERAL_GH_VM
          P07_M05_EXPLICIT_FULL_INSTALL_ON_KVM: 'YES'
        run: |
          set -Eeuo pipefail
          test "$(git -C public_harness rev-parse HEAD)" = 4571db5fad5fc6b21b82fa3b1cb881b752268f52
          test "$(git -C private_m05 rev-parse HEAD)" = eaff34e6c1e40842a9342b862bfd6ed6b2244c19
          test "$(git -C public_harness hash-object tests/p07_m05_debian13_qemu_tcg.sh)" = 9994de6f520c2ba88257cac396f07ae8ef070925
          test "$(git -C public_harness hash-object tests/p07_m05_native_first_admin.py)" = 8dbd035b03337c0efe7eaa6e7c47319278dfb7d9
          # Actual product exact-source UX/Guard regression, with safety deny fixtures.
          (cd private_m05 && python3 -B scripts/check_p07_modules.py)
          (cd private_m05 && python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M05 --changed-file bin/vfops-init-ui \
            --evidence-file docs/ux-reviews/p07-m05-vultr-clean-host-ux5-20261114.json)
          (cd private_m05 && python3 -B -m unittest discover -s tests -p 'test_p07_m05_*.py' -q)
          echo P07_M05_UX5_SOURCE_GUARD_AND_7_UX_SCENARIOS_MACHINE=PASS
          # Rebuild the currently checked-out M05 source, not the older 2026-11-12 candidate.
          mkdir -p "$RUNNER_TEMP/m05"
          python3 -B private_m05/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/a.zip" >/dev/null
          python3 -B private_m05/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/m05/b.zip" >/dev/null
          cmp "$RUNNER_TEMP/m05/a.zip" "$RUNNER_TEMP/m05/b.zip"
          # Official GUARD-UX3 -> new GUARD-UX5 using *actual* standalone
          # atomic module installer in a throwaway root, never Owner VPS.
          old="$RUNNER_TEMP/m05/old-official-guard-ux3.zip"
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 90 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-guard-ux3-20261114/P07-M05-0.1.0-m05-db-first-guard-ux3.zip' -o "$old"
          echo "a5d5ccb77aa3c9dd5120fa112fbb73c6701877f0c2200a9f4f9da79ebb1faf29  $old" | sha256sum -c - >/dev/null
          PYTHONPATH=private_m05/scripts python3 -B - "$old" "$RUNNER_TEMP/m05/a.zip" <<'ATOMIC'
          import hashlib,os,pathlib,sys,tempfile
          import install_p07_m05_bundle as ins
          old,new=map(pathlib.Path,sys.argv[1:3])
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          os.environ["P07_M05_DISPOSABLE_TEST"]="1"
          with tempfile.TemporaryDirectory(prefix="p07-m05-ux5-atomic-") as td:
              root=pathlib.Path(td)
              sibling={}
              for module in ("m01","m02","m03","m04"):
                  marker=root/module/"UNCHANGED"
                  marker.parent.mkdir()
                  marker.write_text("M05_ONLY")
                  sibling[module]=sha(marker)
              assert ins.install(old,sha(old),root,test_mode=True)["installed_build"]=="0.1.0-m05-db-first-guard-ux3"
              assert ins.install(new,sha(new),root,test_mode=True)["installed_build"]=="0.1.0-m05-db-first-guard-ux5"
              assert ins.install(new,sha(new),root,test_mode=True)["already_current"] is True
              try: ins.install(new,"0"*64,root,test_mode=True)
              except ins.IsolatedInstallError: pass
              else: raise AssertionError("invalid SHA accepted")
              assert (root/"m05/current").readlink().as_posix()=="releases/0.1.0-m05-db-first-guard-ux5"
              assert ins.rollback("0.1.0-m05-db-first-guard-ux3",root,test_mode=True)["restored_build"]=="0.1.0-m05-db-first-guard-ux3"
              assert all(sha(root/module/"UNCHANGED")==sibling[module] for module in sibling)
          print("P07_M05_UX5_OFFICIAL_OLD_TO_NEW_ATOMIC_ROLLBACK_AND_FOUR_SIBLINGS=PASS")
          ATOMIC
          mkdir -p private_m05/owner-trial
          export P07_M05_OFFLINE_TRIAL_FILE="$GITHUB_WORKSPACE/private_m05/owner-trial/P07-M05-0.1.0-m05-db-first-guard-ux5-OFFLINE.run"
          PYTHONPATH=private_m05/scripts python3 -B - "$RUNNER_TEMP/m05/a.zip" "public_harness/installers/p07-m05-atomic.py" "$P07_M05_OFFLINE_TRIAL_FILE" <<'WRAP'
          import hashlib,sys
          from pathlib import Path
          import build_p07_m05_bundle as module
          import build_p07_m05_owner_trial_run as trial
          bundle,installer,output=map(Path,sys.argv[1:4])
          assert module.BUILD_ID=="0.1.0-m05-db-first-guard-ux5"
          trial.BUILD=module.BUILD_ID
          trial.BUNDLE_SHA256=hashlib.sha256(bundle.read_bytes()).hexdigest()
          assert trial.git_blob_sha1(installer.read_bytes())==trial.INSTALLER_BLOB
          print("P07_M05_UX5_TRIAL="+trial.build(output,bundle,installer)["sha256"])
          WRAP
          bash "$P07_M05_OFFLINE_TRIAL_FILE" --verify-only >/dev/null
          # This public-only branch has no tests/ directory; generated private
          # harness files belong to disposable workspace and are erased.
          mkdir -p tests
          python3 - "$P07_M05_OFFLINE_TRIAL_FILE" <<'PY'
          from pathlib import Path
          import hashlib,sys,os,re
          assert re.fullmatch(r"refs/pull/[0-9]+/merge", os.environ["GITHUB_REF"])
          trial_sha=hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest()
          substitutions = {
              'refs/heads/feat/p07-unified-independent-module-router-20261112': os.environ["GITHUB_REF"],
          }
          substitutions["e42b6b3c59719f6ec189e4c62b7cfc54385aaa6e566c8f92ca5306246f022bbb"]=trial_sha
          substitutions["0.1.0-m05-candidate2"]="0.1.0-m05-db-first-guard-ux5"
          for file in ('p07_m05_debian13_qemu_tcg.sh','p07_m05_native_first_admin.py'):
              input_path=Path('public_harness/tests')/file
              output_path=Path('tests')/file
              content=input_path.read_text(encoding='utf-8')
              # Package hash and module build appear only in the QEMU shell
              # script; the first-admin Python test has no such literals.
              for old,new in substitutions.items():
                  if file.endswith('.py') and old in (
                      "e42b6b3c59719f6ec189e4c62b7cfc54385aaa6e566c8f92ca5306246f022bbb",
                      "0.1.0-m05-candidate2",
                  ):
                      continue
                  assert old in content, (file,old)
                  content=content.replace(old,new)
              output_path.write_text(content,encoding='utf-8')
              output_path.chmod(0o700)
          PY
          bash -n tests/p07_m05_debian13_qemu_tcg.sh
          python3 -m py_compile tests/p07_m05_native_first_admin.py
          echo P07_M05_DEPOT_EXACT_PUBLIC_HARNESS=VERIFIED
          echo P07_M05_DEPOT_EXACT_PRIVATE_PACKAGE=VERIFIED
          echo P07_M05_DEPOT_NEW_BUILD=0.1.0-m05-db-first-guard-ux5
          bash tests/p07_m05_debian13_qemu_tcg.sh
      - name: Delete private checkout and temporary harness after exact test
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private_m05 public_harness
          rm -rf -- "$RUNNER_TEMP/m05"
          rm -f -- tests/p07_m05_debian13_qemu_tcg.sh tests/p07_m05_native_first_admin.py
          echo P07_M05_DEPOT_PRIVATE_CHECKOUT_CLEANUP=YES
          echo P07_M05_OWNER_PRODUCTION=UNTOUCHED
