name: S01-C02 V1.21.996 Keyword Research Production Polish Formal Release

on:
  push:
    branches:
      - release/s01-c02-121996-formal
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: ea6661f808c7d5afb9c69c49d567d1a45501dc2a
      TARGET_VERSION: 1.21.996
      RELEASE_TAG: v1.21.996
      ASSET_NAME: vf-tools-ops_V1.21.996.zip
      TESTED_RUN_ID: '36971764658'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.996-keyword-research-production-polish-candidate
      EXPECTED_BYTES: '3465484'
      EXPECTED_SHA256: 95d7ee90218e4873112bbd9e46f2cdde9d46dfa4ca79d1ce586fa2b530f8fa69
      EXPECTED_RUNTIME_FILES: '973'
      EXPECTED_RUNTIME_FP: 92957d6f471b2d8e9560d15363674f3471ff095667c10480c70df45a3f9efd7b
      PROMOTED_MAIN_SHA: 3694998ec9b9a42109e8d9caac6bcf6f78a327d3
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 0

      - name: Verify promotion to main
        shell: bash
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          test "$(gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$PROMOTED_MAIN_SHA"
          gh api "repos/$TARGET_REPOSITORY/commits/$PROMOTED_MAIN_SHA" --jq '.parents[].sha' | grep -Fx "$TARGET_SHA" >/dev/null
          echo "PROMOTED_EXACT_SOURCE=PASS"

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf tested; mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f tested/FINAL_EVIDENCE.json
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$ver and
            .upgrade=="PASS" and
            .browser.result=="PASS" and
            .browser.blocking_errors==0 and
            .browser.responsive_failures==0 and
            .research_production_fixture.result=="PASS" and
            .research_production_fixture.research_checks==6 and
            .research_production_fixture.frozen_map_checks==6 and
            .security_boundary=="PASS" and
            .orphan_research_footer=="REMOVED" and
            .research_export=="PRESERVED_IN_QUEUE" and
            .footer_version_source=="INSTALLED_PLUGIN_HEADER" and
            .frozen_shell_header_menu=="PASS" and
            .owner_real_use=="POST_PRODUCTION_REQUIRED" and
            .production=="NOT_EXECUTED"
          ' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo "EXACT_TESTED_ARTIFACT=PASS"

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.996

          Keyword Research Production Screenshot Polish:
          - 修复只有一个语言任务时右侧留下大面积空白的问题，单任务改为紧凑全宽运营行
          - 从关键词研究日常页面移除底部低频专业操作/高级能力孤立区
          - 研究证据导出保留到候选队列结果区，不丢功能
          - 页脚版本优先从已安装插件文件头读取，避免升级后版本显示滞后
          - 已验收正式关键词地图、Shell / Header / Header Menu 保持冻结
          - 1.21.995 → 1.21.996 upgrade preservation PASS
          - authenticated browser regression PASS
          - production-like source-render 60/60 PASS；Keyword Research 6 widths PASS；frozen Keyword Map 6 widths PASS
          - security boundary PASS
          - exact source: ea6661f808c7d5afb9c69c49d567d1a45501dc2a
          - main promotion: 3694998ec9b9a42109e8d9caac6bcf6f78a327d3
          - Candidate Gate Run: 36971764658

          Production 更新后的 OWNER 视觉截图仍是最终视觉 Gate。
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.996" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
