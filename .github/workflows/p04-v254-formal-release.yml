name: P04 V2.5.4 Formal Release and Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v254-formal-release.yml'

permissions:
  contents: read

concurrency:
  group: p04-v254-formal-release
  cancel-in-progress: false

env:
  PRODUCT_REPO: llhzx2018/vf-infra
  CORE_UPDATES_REPO: llhzx2018/core-updates
  CANDIDATE_COMMIT: 2391834b2d904ca76fca23c94c835a38cec0e6e5
  CANDIDATE_TREE: acdb479a25511405a7fe44cd2ca6f29eeb0515b2
  TARGET_VERSION: 2.5.4
  SOURCE_VERSION: 2.5.3
  SCHEMA: '14'
  RUNTIME_FILES: '150'
  RUNTIME_FINGERPRINT: 7350f393eb894c3fc8057d485589f9727ef495bb042c37ae64df66838c4a7c7b

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require unified credentials
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          test -n "$READ_TOKEN"
          echo 'UNIFIED_RELEASE_CREDENTIALS=PASS'

      - name: Checkout exact Candidate Product Source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 2391834b2d904ca76fca23c94c835a38cec0e6e5
          fetch-depth: 0
          path: vf-infra
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

      - name: Verify exact source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-infra
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          echo 'TESTED_PRODUCT_SOURCE_EQUALS_RELEASE_PRODUCT_SOURCE=PASS'

      - name: Build exact V2.5.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-infra
          rm -rf "$RUNNER_TEMP/v254-runtime" "$RUNNER_TEMP/v254-release"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v254-runtime" | tee "$RUNNER_TEMP/v254-runtime-build.json"
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'v254-runtime-build.json'
          x=json.loads(p.read_text().strip().splitlines()[-1])
          assert x['version']=='2.5.4'
          assert x['schema']==14
          assert x['file_count']==150
          assert x['source_fingerprint']=='7350f393eb894c3fc8057d485589f9727ef495bb042c37ae64df66838c4a7c7b'
          print('RUNTIME_IDENTITY_GATE=PASS')
          PY
          grep -Fq 'deriveFinalOutcome' src/app/Core/Update/UpdateHistoryService.php
          grep -Fq 'final_outcome' src/app/Core/Update/UpdateHistoryService.php
          echo 'UPDATE_HISTORY_FINAL_OUTCOME_PRESENT=PASS'

      - name: Build frozen UPDATE and ATOMIC assets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-infra
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-v253-update-release.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("TARGET='2.5.3'","TARGET='2.5.4'",1)
          s=s.replace("SOURCE='2.5.2'","SOURCE='2.5.3'",1)
          start=s.index('PAYLOAD_PATHS=[')
          end=s.index(']\n\n', start)+2
          payload="""PAYLOAD_PATHS=[
              'VERSION.txt',
              'api.php',
              'assets/app.js',
              'assets/v254-ui.css',
              'assets/v254-ui.js',
              'index.php',
              'login.php',
              'maintenance.php',
              'app/Core/Update/UpdateHistoryService.php',
              'release-manifest.json',
          ]"""
          s=s[:start]+payload+s[end:]
          Path('scripts/build-v254-release-temp.py').write_text(s,encoding='utf-8')
          PY
          python3 scripts/build-v254-release-temp.py --target-runtime "$RUNNER_TEMP/v254-runtime" --output "$RUNNER_TEMP/v254-release" | tee "$RUNNER_TEMP/v254-artifact-build.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v254-release'
          mpath=out/'PACKAGE_MANIFEST.json'
          m=json.loads(mpath.read_text(encoding='utf-8'))
          m['source_commit']='2391834b2d904ca76fca23c94c835a38cec0e6e5'
          m['source_tree']='acdb479a25511405a7fe44cd2ca6f29eeb0515b2'
          m['target_runtime_file_count']=150
          m['target_runtime_source_fingerprint']='7350f393eb894c3fc8057d485589f9727ef495bb042c37ae64df66838c4a7c7b'
          m['schema_migration']='NONE'
          mpath.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          files=[out/'VF_Infra_V2.5.4_ATOMIC.zip',out/'VF_Infra_V2.5.4_UPDATE.zip',out/'repair-v2.5.4.php',mpath]
          for name in ['README_INSTALL.txt','PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt']:
              q=out/name
              if q.exists(): files.append(q)
          (out/'SHA256SUMS.txt').write_text(''.join(f'{sha(q)}  {q.name}\n' for q in files),encoding='utf-8')
          PY

      - name: Artifact identity and safety gate
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/v254-release"
          update="$out/VF_Infra_V2.5.4_UPDATE.zip"
          atomic="$out/VF_Infra_V2.5.4_ATOMIC.zip"
          repair="$out/repair-v2.5.4.php"
          test -f "$update" && test -f "$atomic" && test -f "$repair"
          unzip -t "$update" >/dev/null
          unzip -t "$atomic" >/dev/null
          test "$(unzip -Z1 "$update" | wc -l | tr -d ' ')" = '1'
          test "$(unzip -Z1 "$update")" = 'repair-v2.5.4.php'
          test "$(sha256sum "$update" | awk '{print $1}')" = "$(sha256sum "$atomic" | awk '{print $1}')"
          cmp -s "$update" "$atomic"
          python3 - <<'PY'
          import json,os,pathlib,re,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'v254-release'
          z=out/'VF_Infra_V2.5.4_UPDATE.zip'
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
              assert names==['repair-v2.5.4.php']
              for n in names:
                  p=pathlib.PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in n
              data=f.read(names[0])
          forbidden=[b'github_pat_',b'ghp_',b'-----BEGIN PRIVATE KEY-----',b'AKIA']
          assert not any(x in data for x in forbidden)
          m=json.loads((out/'PACKAGE_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='2.5.4' and m['schema']==14
          assert m['allowed_source_versions']==['2.5.3']
          assert m['payload_file_count']==10
          assert m['schema_change'] is False
          assert m['source_commit']=='2391834b2d904ca76fca23c94c835a38cec0e6e5'
          assert m['source_tree']=='acdb479a25511405a7fe44cd2ca6f29eeb0515b2'
          assert m['target_runtime_file_count']==150
          assert m['target_runtime_source_fingerprint']=='7350f393eb894c3fc8057d485589f9727ef495bb042c37ae64df66838c4a7c7b'
          print('ZIP_PATH_SECRET_PRIVATE_GATE=PASS')
          PY
          php "$repair" --self-test | tee "$RUNNER_TEMP/v254-repair-self-test.txt"
          bytes=$(stat -c '%s' "$update")
          sha=$(sha256sum "$update" | awk '{print $1}')
          echo "UPDATE_BYTES=$bytes" | tee "$RUNNER_TEMP/v254-asset-identity.env"
          echo "UPDATE_SHA256=$sha" | tee -a "$RUNNER_TEMP/v254-asset-identity.env"
          echo 'UPDATE_FILES=1' | tee -a "$RUNNER_TEMP/v254-asset-identity.env"
          echo 'ARTIFACT_FREEZE_GATE=PASS'

      - name: Create unique Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$TARGET_VERSION" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            echo 'FORMAL_RELEASE_ALREADY_EXISTS=FAIL'
            exit 1
          fi
          out="$RUNNER_TEMP/v254-release"
          gh release create "v$TARGET_VERSION" \
            --repo "$PRODUCT_REPO" \
            --target "$CANDIDATE_COMMIT" \
            --title "VF Infra V2.5.4" \
            --notes 'P04 V2.5.4：全后台 UA/UI 统一升级；修正 Update History 最终结果语义；统一 Loading/Empty/Error、Responsive 与 Accessibility。Schema 14 不变；业务模型、Provider 写权限与统一 Update Core 均不扩展。Production 仍为 2.5.3，发布不代表 Production 晋级。' \
            "$out/VF_Infra_V2.5.4_ATOMIC.zip" \
            "$out/VF_Infra_V2.5.4_UPDATE.zip" \
            "$out/PACKAGE_MANIFEST.json" \
            "$out/SHA256SUMS.txt"
          echo 'FORMAL_RELEASE_CREATE=PASS'

      - name: Remote Release and Asset exact readback
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/v254-asset-identity.env"
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/$PRODUCT_REPO/releases/tags/v$TARGET_VERSION" > "$release_json"
          python3 - "$release_json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['tag_name']=='v2.5.4'
          assert x['draft'] is False and x['prerelease'] is False
          assert x['target_commitish']=='2391834b2d904ca76fca23c94c835a38cec0e6e5'
          names={a['name'] for a in x['assets']}
          assert names=={'VF_Infra_V2.5.4_ATOMIC.zip','VF_Infra_V2.5.4_UPDATE.zip','PACKAGE_MANIFEST.json','SHA256SUMS.txt'}
          print('FORMAL_RELEASE_METADATA=PASS')
          PY
          ref=$(gh api "repos/$PRODUCT_REPO/git/ref/tags/v$TARGET_VERSION" --jq '.object.sha')
          test "$ref" = "$CANDIDATE_COMMIT"
          asset_id=$(python3 - "$release_json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print(next(a['id'] for a in x['assets'] if a['name']=='VF_Infra_V2.5.4_UPDATE.zip'))
          PY
          )
          remote="$RUNNER_TEMP/VF_Infra_V2.5.4_UPDATE.remote.zip"
          curl --fail --silent --show-error --location --max-time 90 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$PRODUCT_REPO/releases/assets/$asset_id" -o "$remote"
          test "$(stat -c '%s' "$remote")" = "$UPDATE_BYTES"
          test "$(sha256sum "$remote" | awk '{print $1}')" = "$UPDATE_SHA256"
          cmp -s "$remote" "$RUNNER_TEMP/v254-release/VF_Infra_V2.5.4_UPDATE.zip"
          unzip -t "$remote" >/dev/null
          test "$(unzip -Z1 "$remote")" = 'repair-v2.5.4.php'
          unzip -p "$remote" repair-v2.5.4.php > "$RUNNER_TEMP/repair-v2.5.4.remote.php"
          php "$RUNNER_TEMP/repair-v2.5.4.remote.php" --self-test >/dev/null
          echo "RELEASE_PUBLISHED_AT=$(python3 - "$release_json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['published_at'])
          PY
          )" >> "$RUNNER_TEMP/v254-asset-identity.env"
          echo 'REMOTE_ASSET_READBACK=PASS'
          echo 'REMOTE_RUNTIME_IDENTITY_BY_EXACT_ARTIFACT_TRANSITIVITY=PASS'

      - name: Publish core-updates P04 V2.5.4
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: main
          fetch-depth: 0
          path: core-updates
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

      - name: Generate and push exact P04 manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/v254-asset-identity.env"
          cd core-updates
          python3 - "$UPDATE_BYTES" "$UPDATE_SHA256" "$RELEASE_PUBLISHED_AT" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path('projects/P04.json')
          obj={
            'schema_version':'1.0','project_id':'P04','component_id':'APP','enabled':True,
            'target_version':'2.5.4','update_type':'ATOMIC','from_versions':['2.5.3'],
            'schema_from':'14','schema_to':'14','repository':'llhzx2018/vf-infra',
            'release_tag':'v2.5.4','asset_name':'VF_Infra_V2.5.4_UPDATE.zip',
            'asset_bytes':int(sys.argv[1]),'asset_sha256':sys.argv[2],
            'backup_required':True,'rollback_supported':True,'released_at':sys.argv[3],
            'minimum_php':'8.0.0',
            'notes':'P04 V2.5.4 maintenance release: full backend UA/UI unification, Update History final-outcome reconciliation, normalized feedback/responsive/accessibility; Schema 14 unchanged.'
          }
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add projects/P04.json
          git diff --cached --quiet && { echo 'CORE_UPDATES_MANIFEST_NO_CHANGE_UNEXPECTED=FAIL'; exit 1; }
          git commit -m 'release(P04): publish V2.5.4 update manifest'
          git push origin HEAD:main
          echo 'CORE_UPDATES_PUBLISH=PASS'

      - name: Remote manifest exact readback and live discovery contract
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          source "$RUNNER_TEMP/v254-asset-identity.env"
          api="https://api.github.com/repos/$CORE_UPDATES_REPO/contents/projects/P04.json?ref=main"
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$api" > "$RUNNER_TEMP/p04-content.json"
          python3 - "$RUNNER_TEMP/p04-content.json" "$UPDATE_BYTES" "$UPDATE_SHA256" <<'PY'
          import base64,json,sys
          x=json.load(open(sys.argv[1]))
          m=json.loads(base64.b64decode(x['content']).decode())
          assert m['target_version']=='2.5.4'
          assert '2.5.3' in m['from_versions']
          assert m['schema_from']=='14' and m['schema_to']=='14'
          assert m['release_tag']=='v2.5.4'
          assert m['asset_name']=='VF_Infra_V2.5.4_UPDATE.zip'
          assert m['asset_bytes']==int(sys.argv[2]) and m['asset_sha256']==sys.argv[3]
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('REMOTE_MANIFEST_READBACK=PASS')
          print('DISCOVERY_CONTRACT_2.5.3_TO_2.5.4=PASS')
          PY
          echo 'CORE_UPDATES_MAIN='$(git -C core-updates rev-parse HEAD)

      - name: Verify Production remains unchanged and probe authenticated discovery channel
        shell: bash
        env:
          PROD_URL: https://infra.kewaro.com
          VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
          P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
          P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
          VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
          VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 20 "$PROD_URL/login.php" > "$RUNNER_TEMP/prod-login.html"
          python3 - "$RUNNER_TEMP/prod-login.html" <<'PY'
          import re,sys,pathlib
          t=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          v=re.findall(r'VF Infra\s*·\s*V([0-9]+(?:\.[0-9]+){2})',t)
          assert v and v[-1]=='2.5.3'
          print('PRODUCTION_VERSION=2.5.3')
          PY
          admin=''
          for name in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do
            if [ -n "${!name:-}" ]; then admin="${!name}"; echo "PRODUCTION_ADMIN_CHANNEL=$name"; break; fi
          done
          if [ -z "$admin" ]; then
            echo 'PRODUCTION_DISCOVERY=BLOCK_NO_ADMIN_READBACK_CREDENTIAL'
            echo 'PRODUCTION_WRITE=0'
            exit 42
          fi
          csrf=$(python3 - "$RUNNER_TEMP/prod-login.html" <<'PY'
          from html.parser import HTMLParser
          import sys
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.v=''
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='input' and d.get('name')=='csrf': self.v=d.get('value','')
          p=P(); p.feed(open(sys.argv[1],encoding='utf-8',errors='replace').read()); print(p.v)
          PY
          )
          test -n "$csrf"
          jar="$RUNNER_TEMP/prod.cookies"
          curl --fail --silent --show-error --location --max-time 30 -c "$jar" -b "$jar" \
            --data-urlencode "csrf=$csrf" --data-urlencode "password=$admin" \
            "$PROD_URL/login.php" -o "$RUNNER_TEMP/prod-after-login.html"
          grep -Fq 'VF Infra' "$RUNNER_TEMP/prod-after-login.html"
          echo 'PRODUCTION_AUTHENTICATED_READ_CHANNEL=PASS'
          echo 'PRODUCTION_DISCOVERY_AUTH_CHANNEL_READY=PASS'
          echo 'PRODUCTION_WRITE=0'

      - name: Final release boundary assertion
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          main=$(git ls-remote "https://github.com/$PRODUCT_REPO.git" refs/heads/main | awk '{print $1}')
          test "$main" = '68fd396a45ba1eaea34db5ac15cce42791965e49'
          echo 'MAIN_UNCHANGED=PASS'
          echo 'PRODUCTION_UPGRADE=NOT_EXECUTED'
          echo 'STOP_FOR_MASTER_PRODUCTION_AUTHORIZATION=TRUE'
