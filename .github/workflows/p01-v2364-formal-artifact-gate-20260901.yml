name: P01 V2.36.4 Formal Artifact Gate
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-artifact-gate-20260901.yml]
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      FORMAL_RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      MAIN_EXPECTED: d35038c32b5a287636ee92d9fe074ea12c1469ef
      DEVELOP_EXPECTED: 5615d19b07303132e8fc2e374de1236a37f3cb16
      SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      SOURCE_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      SOURCE_RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      VERSION: 2.36.4
      SOURCE_VERSION: 2.36.3
      SCHEMA: '2026082901'
      CANDIDATE_GATE: '33518274633'
      CANDIDATE_ARTIFACT: '9804570473'
      CANDIDATE_DIGEST: d092acb2892308d3c481196e77c4edd0a2ed720bff3458067d6ad85acf7cdddb
      OUT: /tmp/p01-v2364-formal-artifacts
      EVID: /tmp/p01-v2364-formal-evidence
      UPGRADE: /tmp/p01-v2364-formal-upgrade
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2364-candidate-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 71c0ddf946974a6d6ac75bc629ffc07256eb9e4f
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Generate fenced formal gates
        run: python3 runner/scripts/p01_v2364_formal_gate_generate.py
      - name: Exact formal fence
        run: bash /tmp/p01-v2364-formal-generated/01-exact.sh
      - name: Build deterministic formal release artifacts
        run: bash /tmp/p01-v2364-formal-generated/02-build.sh
      - name: Candidate artifact identity fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(stat -c%s "$OUT/VF-Start-V2.36.4-FULL.zip")" = 587178
          test "$(sha256sum "$OUT/VF-Start-V2.36.4-FULL.zip" | awk '{print $1}')" = dd0d25e8eacb367305b14cc830363539b0819a055a3b01f1333b79a8104dbe83
          test "$(stat -c%s "$OUT/VF_Start_V2.36.4_UPDATE.zip")" = 1236989
          test "$(sha256sum "$OUT/VF_Start_V2.36.4_UPDATE.zip" | awk '{print $1}')" = 3b0754d6c089baa0249064ba5683732a9784fc397b8971b97a30dda3c1ebde24
          test "$(stat -c%s "$OUT/repair-v2.36.4.php")" = 3592533
          test "$(sha256sum "$OUT/repair-v2.36.4.php" | awk '{print $1}')" = 14b12da6d14d53aa5b3fc43b3578efb323da7736ecef861782d1d0dfce543385
          printf 'CANDIDATE_ARTIFACT_IDENTITY=PASS\n' | tee "$EVID/candidate-identity.txt"
      - name: Actual formal V2.36.3 to V2.36.4 upgrade
        run: bash /tmp/p01-v2364-formal-generated/03-atomic.sh
      - name: Final formal verdict
        shell: bash
        run: |
          printf 'P01_V2364_FORMAL_ARTIFACT_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nMIGRATION=NONE\nCANDIDATE_GATE=%s/PASS\nCANDIDATE_ARTIFACT_IDENTITY=PASS\nATOMIC_2363_TO_2364=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" "$CANDIDATE_GATE" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-formal-artifacts-${{ github.run_id }}
          path: |
            /tmp/p01-v2364-formal-artifacts
            /tmp/p01-v2364-formal-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2364-formal.pid 2>/dev/null)" 2>/dev/null || true
