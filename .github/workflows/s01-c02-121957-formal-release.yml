name: S01-C02 1.21.957 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121957-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: e9b5b9a2bb7a4529841a74e070de78bc2761c533
      TARGET_VERSION: 1.21.957
      RELEASE_TAG: v1.21.957
      ASSET_NAME: vf-tools-ops_V1.21.957.zip
      TESTED_RUN_ID: '36541506324'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.957-r8-candidate
      EXPECTED_BYTES: '3410161'
      EXPECTED_SHA256: 4e720c0fa4f23ce33ed7122f15669f8a1082b1bfb6fd4c9a2ce76dd363411c0c
      EXPECTED_RUNTIME_FILES: '961'
      EXPECTED_RUNTIME_FP: 537636efc43a6c57ae363788d751ef3fd055f9db397e4f3d6df65ab92a444249
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '.status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and .upgrade=="PASS" and .security=="PASS" and .r8_contract=="PASS" and .browser.result=="PASS" and .browser.blocking_errors==0 and .browser.responsive_failures==0' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.957

          Production Real-use R8 · Readability + Information De-noise:
          - 内容库：恢复更成熟的列表字号与扫描层级
          - 页面与关键词地图：主决策列更突出，证据降为第二层
          - 单页精修：保持现有结构，只做可读性微调
          - 内容集群与链接：压缩已完成扫描证据、空状态和问题行视觉重量
          - Page Body V2 Macro / Shell / Header / Header Menu IA unchanged
          - no route / canonical data / schema / permission / business logic / updater semantic change
          - Exact Candidate Gate Run: 36541506324
          - exact source: e9b5b9a2bb7a4529841a74e070de78bc2761c533

          OWNER Production visual acceptance remains pending after installation.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.957" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
