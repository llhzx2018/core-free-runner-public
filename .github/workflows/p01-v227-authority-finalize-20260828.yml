name: P01 V2.27 Authority Finalize
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-authority-finalize-20260828.yml']
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: efd05e0fd8af1f2f0f5ff74e778621fcc1a62430
      PRODUCT_BRANCH: feature/p01-v2.27.0-workspace-productization-20260828
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: true
      - name: Patch candidate authority to final exact source evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json
          old_src='91e0153fc08161aca1c96b598cfb15d0b12f0df6'
          old_tree='7a1f37b45cdaa818ce470cdd02a264b90202ce49'
          final_src='efd05e0fd8af1f2f0f5ff74e778621fcc1a62430'
          final_tree='846a0cdc438519087fc42acb53b0fe7680bfcb2b'
          replacements = {
            'docs/evidence/P01_V2.27.0_WORKSPACE_PRODUCTIZATION_20260828.md': (
              f"Feature Source: {old_src}\nFeature Tree: {old_tree}\nSchema: 2026082801 / unchanged\nProduction Write: NO",
              f"Runtime Feature Source: {old_src}\nRuntime Feature Tree: {old_tree}\nFinal Candidate Source: {final_src}\nFinal Candidate Tree: {final_tree}\nVersion Identity Run: 33178323869 / PASS\nFinal Exact Head Gate: 33178564469 / PASS\nSchema: 2026082801 / unchanged\nProduction Write: NO"
            ),
            'docs/authority/CURRENT.md': (
              f"V2.27 Verified Feature Source: {old_src}\nV2.27 Verified Feature Tree: {old_tree}\nSchema Change: NO",
              f"V2.27 Runtime Feature Source: {old_src}\nV2.27 Runtime Feature Tree: {old_tree}\nV2.27 Final Candidate Source: {final_src}\nV2.27 Final Candidate Tree: {final_tree}\nVersion Identity Run: 33178323869 / PASS\nFinal Exact Head Gate: 33178564469 / PASS\nSchema Change: NO"
            ),
            'docs/authority/SSOT.md': (
              f"Verified Feature Source: {old_src}\nVerified Feature Tree: {old_tree}\nExact Productization Gate V2: 33167109754 / PASS",
              f"Runtime Feature Source: {old_src}\nRuntime Feature Tree: {old_tree}\nFinal Candidate Source: {final_src}\nFinal Candidate Tree: {final_tree}\nVersion Identity Run: 33178323869 / PASS\nFinal Exact Head Gate: 33178564469 / PASS\nExact Productization Gate V2: 33167109754 / PASS"
            ),
            'docs/authority/RPD.md': (
              f"Verified Feature Source: {old_src}\nVerified Feature Tree: {old_tree}\nExact Runtime / Mutation Gate: 33167109754 / PASS",
              f"Runtime Feature Source: {old_src}\nRuntime Feature Tree: {old_tree}\nFinal Candidate Source: {final_src}\nFinal Candidate Tree: {final_tree}\nVersion Identity Run: 33178323869 / PASS\nFinal Exact Head Gate: 33178564469 / PASS\nExact Runtime / Mutation Gate: 33167109754 / PASS"
            ),
            'docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md': (
              f"Verified Feature Source: {old_src}\nVerified Feature Tree: {old_tree}\nRuntime / Mutation Gate: 33167109754 / PASS",
              f"Runtime Feature Source: {old_src}\nRuntime Feature Tree: {old_tree}\nFinal Candidate Source: {final_src}\nFinal Candidate Tree: {final_tree}\nVersion Identity Run: 33178323869 / PASS\nFinal Exact Head Gate: 33178564469 / PASS\nRuntime / Mutation Gate: 33167109754 / PASS"
            ),
            'docs/authority/ACCEPTANCE_MATRIX.md': (
              f"| Final Docs Head Gate | PENDING |\n| PR -> develop | PENDING |",
              f"| Version Identity Finalization | PASS / `33178323869` |\n| Final Exact Head Gate | PASS / `33178564469` / `{final_src}` |\n| PR -> develop | PENDING |"
            ),
          }
          for path,(old,new) in replacements.items():
            p=Path(path); s=p.read_text(encoding='utf-8'); assert old in s, f'missing marker {path}'; p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('docs/authority/ACCEPTANCE_MATRIX.md'); s=p.read_text(encoding='utf-8')
          old=f"Feature Source: {old_src}\nFeature Tree: {old_tree}\nWorking Branch: feature/p01-v2.27.0-workspace-productization-20260828"
          new=f"Runtime Feature Source: {old_src}\nRuntime Feature Tree: {old_tree}\nFinal Candidate Source: {final_src}\nFinal Candidate Tree: {final_tree}\nWorking Branch: feature/p01-v2.27.0-workspace-productization-20260828"
          assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('docs/authority/CURRENT.md'); s=p.read_text(encoding='utf-8')
          old='V2.27 当前只允许继续完成：Authority Closure -> Final Exact Head Gate -> PR -> develop -> develop Exact Gate -> 独立 Release Chain。'
          new='V2.27 Authority Closure、Version Identity 与 Final Exact Head Gate 已 PASS。下一步进入 PR -> develop -> develop Exact Gate -> 独立 Release Chain。'
          assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['current_phase']='WORKSPACE PRODUCTIZATION / FINAL EXACT HEAD PASS / PR + RELEASE CHAIN PENDING'
          c=d['current_change']
          c['runtime_feature_source']=c.pop('verified_feature_source')
          c['runtime_feature_tree']=c.pop('verified_feature_tree')
          c['final_candidate_source']=final_src
          c['final_candidate_tree']=final_tree
          c['version_identity_run']=33178323869
          c['version_identity_result']='PASS'
          c['final_exact_head_gate']=33178564469
          c['final_exact_head_result']='PASS'
          d['candidate_state']='WORKSPACE PRODUCTIZATION FINAL EXACT HEAD PASS / NOT RELEASED'
          d['current_authority']='Owner Production V2.26.0 / Schema 2026082801 closed; V2.27 workspace productization final exact head PASS; no release or production write'
          d['next_action']='PR -> develop -> develop Exact Gate -> V2.27 Release Chain'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 7
          for f in VF_PROJECT.json docs/authority/CURRENT.md docs/authority/SSOT.md docs/authority/RPD.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.27.0_WORKSPACE_PRODUCTIZATION_20260828.md; do git diff --name-only | grep -Fx "$f" >/dev/null; done
      - name: Commit and push authority closure
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/authority/SSOT.md docs/authority/RPD.md docs/authority/ACCEPTANCE_MATRIX.md docs/architecture/P01_MULTI_SURFACE_ARCHITECTURE.md docs/evidence/P01_V2.27.0_WORKSPACE_PRODUCTIZATION_20260828.md
          git commit -m 'P01 V2.27: close candidate authority evidence'
          NEW_HEAD=$(git rev-parse HEAD); NEW_TREE=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:$PRODUCT_BRANCH"
          echo P01_V227_AUTHORITY_HEAD=$NEW_HEAD
          echo P01_V227_AUTHORITY_TREE=$NEW_TREE
          echo P01_V227_AUTHORITY_FINALIZE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
