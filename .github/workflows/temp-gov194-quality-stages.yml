name: GOV194 stage-aware quality DEV MODULE RELEASE proof
on:
  pull_request:
    paths:
      - '.github/workflows/temp-gov194-quality-stages.yml'
permissions:
  contents: read
jobs:
  exact-governance-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact GOV-DOC source in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: c4b6ec87a5d5d8624fff10eaa14a86b822cce2eb
          path: private-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact SHA and project test installation portability negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-gov rev-parse HEAD)" = "c4b6ec87a5d5d8624fff10eaa14a86b822cce2eb"
          echo "EXACT_GOV_SOURCE=c4b6ec87a5d5d8624fff10eaa14a86b822cce2eb"
          cd private-gov
          python3 -B -m unittest discover -s governance/agent -p 'test_project_test_install_receipt_gate.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_project_evolvability_gate.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_code_architecture_lint.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_entry.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_source_adoption_gate.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_test_reuse_growth_gate.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -q
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/catalog/tools/doc_structure_lint.py
          grep -Fq '## 七、部署与运营配置不得绑死' governance/agent/VF_CODE_ARCHITECTURE_QUALITY_CONTRACT_V1.md
          grep -Fq 'require-portability' governance/agent/project_test_install_receipt_gate.py
          grep -Fq '设计可配置、部署可替换' CURRENT.md
          grep -Fq 'audit_deployment_literal_changes' governance/agent/code_architecture_lint.py
          grep -Fq 'EVOLVE_CI_SOURCE_DIFF_NOT_WIRED' governance/agent/project_evolvability_gate.py
          grep -Fq '环境/域名/Provider 可配置且必须执行源码检查' governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md
          grep -Fq '域名/安装目录/Provider 变化时必须执行真实可替换性测试' governance/agent/VF_PROJECT_TEST_INSTALL_EXECUTION_V1.md
          grep -Fq '域名和服务器不能写死' 中文文档导航.md
          grep -Fq 'classify_quality_stages' governance/agent/code_architecture_lint.py
          grep -Fq 'QUALITY_STAGE_ROUTING=CLASSIFIED_NOT_EXECUTED' governance/agent/code_architecture_lint.py
          grep -Fq '开发质量规则按阶段执行' governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md
          grep -Fq '开发、模块、发布三级质量门禁' AGENTS.md
          grep -Fq '开发轻检、模块针对性验收' CURRENT.md
          echo 'GOV194_QUALITY_ROUTING=PASS'
      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- private-gov
          echo 'TEMP_PRIVATE_CHECKOUT_CLEANED=YES'
