name: TEMP S01-C02 Ops 1.21.842 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121842-finalize-readback-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121842-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: ee6377e6bf7dc608b516f0047e73363503174144
      TREE: 9922080b788c125d0103942e7da4c245192b3cca
      TAG: v1.21.842
      ASSET: vf-tools-ops_V1.21.842.zip
      BYTES: '3294392'
      SHA256: 6ab8f2c4390445d86c975f8b6e13523f9a94cebfd17109970fc9e6dd2cc31e9f
      FILES: '924'
      FP: eeb185c18fa7bb2334018aeac7ac6c6f092f1de813f2f04c126370ec21f6ff89
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.842
          php ops/.github/phase3/v121842-finalize-durable-readback-closure.php | grep -Fxq PASS_V121842_FINALIZE_DURABLE_READBACK_CLOSURE
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/release/steps/class-step-finalize-candidate.php | grep -Fq 'durableReadback'
          unzip -p "/tmp/release/$ASSET" vf-ops/includes/site-release/s01-static-finalize-readback-retry-v121842.php | grep -Fq 'sourceRecoveryFinalizeReadbackRetryCandidateAuditFailureCount'
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.842 closes the proven Candidate finalize/readback lifecycle defect behind the single remaining S01 Final Audit package-contract failure.

          - Focused Gate 34005939547 PASS on exact source ee6377e6bf7dc608b516f0047e73363503174144 / tree 9922080b788c125d0103942e7da4c245192b3cca.
          - Deterministic Artifact Identity 34005968562 PASS.
          - Production V1.21.841 remains fail-closed with exactly one Final Audit package-contract leaf, zero internal-link failures, reusable Static Source and manualSourceUploadRequired=false.
          - Source tracing proved the large-package Stage 4 builder already durably writes resource backfill, sitemaps, social metadata and each root helper with checked close boundaries, but legacy Stage 5 rewrote them again in one long ZipArchive mutation session and did not check the final close result.
          - V1.21.842 makes large-package Stage 5 readback-only after the Stage 4 completeness contract; ordinary candidates now require successful close, independent reopen/readback and required-root-file verification before Finalize can PASS.
          - A bounded one-time recovery layer may create a distinct fresh Candidate only when the existing terminal Candidate has exactly the proven Final Audit reopen boundary failure and the immutable DONE inspect-only Source re-hashes to its expected SHA. The old failed Candidate is not reset or mutated.
          - The recovery layer reuses the existing V1.21.834 bounded worker; Static Source is not uploaded or mutated; Final Audit, candidatePackageReady and finalOnline are never forced.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema/content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.842.zip; 3294392 bytes; SHA256 6ab8f2c4390445d86c975f8b6e13523f9a94cebfd17109970fc9e6dd2cc31e9f; runtime files 924; fingerprint eeb185c18fa7bb2334018aeac7ac6c6f092f1de813f2f04c126370ec21f6ff89.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.842' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121842=PASS
