name: Core Updates P01 V2.47.133 Distribution Gate

on:
  push:
    branches:
      - test-core-updates-p01-v247133-20260930
    paths:
      - '.github/workflows/temp-core-updates-p01-v247133.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: b8cbe545e239db80dd6965490832f37bd523163c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.132" and
            .target_version=="2.47.133" and
            .release_tag=="v2.47.133" and
            .release_id==399952865 and
            .product_identity=="fa2741d17bb54ce2e204a944a2f710d8436473ca" and
            .asset_name=="VF_Start_V2.47.133_UPDATE.zip" and
            .asset_bytes==2067054 and
            .asset_sha256=="c2cd344fa4231541de06902a5a8338eb7858d5b097f7b490ac8c837f496f0989"
          ' projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V247133_MANIFEST=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo CORE_UPDATES_P01_V247133_PHP_LINT=PASS

      - name: Update Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php update-core/php/tests/run.php
          echo CORE_UPDATES_P01_V247133_REGRESSION=PASS
