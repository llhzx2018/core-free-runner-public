name: P08 PR83 bounded legacy synthetic pair suite diagnostic
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-pr83-legacy-pair-diagnostic.yml]
permissions:
  contents: read
jobs:
  old-suite:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-legacy-pair-suite-diagnostic-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout disposable public-safe runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout immutable private P08 PR83 HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Run only already existing synthetic pair suite; print whitelisted error codes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" != 0
          test "$(git -C target rev-parse HEAD)" = 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          test "$(cat target/VERSION)" = 0.1.13
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          umask 077
          log="$RUNNER_TEMP/p08-83-legacy-synthetic-private.log"
          ( cd target; python3 -m unittest discover -s tests -p test_owner_atomic_pair_builder.py -v ) > "$log" 2>&1 && status=0 || status=$?
          python3 - "$log" "$status" <<'PY'
          import re,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          print('P08_83_LEGACY_SUITE_RC='+sys.argv[2])
          for line in lines:
              m=re.match(r'^(FAIL|ERROR): (test_[A-Za-z_0-9]+)\s+\(',line)
              if m:print('P08_83_LEGACY_TEST_FAILURE='+m.group(1)+':'+m.group(2))
              m=re.match(r'^[A-Za-z_.]*(PackageError|AssertionError|ValueError|FileNotFoundError|OSError|CalledProcessError|TypeError|RuntimeError|KeyError):\s*([A-Z][A-Z0-9_:-]{3,90})$',line)
              if m:print('P08_83_LEGACY_EXCEPTION='+m.group(1)+':'+m.group(2))
              m=re.search(r'^Ran (\d+) tests? in',line)
              if m:print('P08_83_LEGACY_TEST_COUNT='+m.group(1))
              m=re.match(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)',line)
              if m:print('P08_83_LEGACY_EXCEPTION_CLASS='+m.group(1).split('.')[-1])
              m=re.search(r'File "[^"]+/(test_owner_atomic_pair_builder\.py|build_owner_atomic_pair\.py|build_full\.py|build_atomic\.py)", line ([0-9]{1,4}), in ([A-Za-z_0-9]+)',line)
              if m:print('P08_83_LEGACY_TRACE_FILE_LINE='+m.group(1)+':'+m.group(2)+':'+m.group(3))
              for code in re.findall(r'\bPAIR_[A-Z0-9_]{3,100}\b',line):
                  print('P08_83_LEGACY_ERROR_CODE='+code)
          PY
          if [ "$status" -eq 0 ]; then echo P08_83_LEGACY_PREEXISTING_SUITE=PASS; else echo P08_83_LEGACY_PREEXISTING_SUITE=FAIL_CLASSIFIED_NO_RAW_LOG; fi
      - name: Always remove private checkout and log
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-83-legacy-synthetic-private.log"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-83-legacy-synthetic-private.log"
          echo P08_83_LEGACY_DIAGNOSTIC_CLEANUP=PASS
