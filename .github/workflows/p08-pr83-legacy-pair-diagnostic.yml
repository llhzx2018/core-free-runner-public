name: P08 PR83 source-bound package plus FULL developer regression gate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-pr83-legacy-pair-diagnostic.yml]
permissions:
  contents: read
jobs:
  p08-all-local-gates:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-legacy-pair-suite-diagnostic-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout public-safe ephemeral proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact candidate P08 PR83 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP8.4 native rootless runtime for complete development smoke
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,fileinfo
          coverage: none
      - name: Run historical Bridge three suites AND entire daily dev check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          test "$(cat target/VERSION)" = 0.1.13
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          umask 077
          private="$RUNNER_TEMP/p08-83-private-test-logs"
          mkdir -m 700 "$private"
          cd target
          for t in test_owner_atomic_pair_builder.py test_verify_owner_atomic_pair.py test_atomic_builder.py; do
            if python3 -m unittest discover -s tests -p "$t" -v > "$private/$t.log" 2>&1; then
              echo "P08_83_PACKAGE_REGRESSION_$t=PASS"
            else
              echo "P08_83_PACKAGE_REGRESSION_$t=FAIL"
              python3 - "$private/$t.log" <<'PY'
          import re,sys
          from pathlib import Path
          for line in Path(sys.argv[1]).read_text(errors='replace').splitlines():
              m=re.match(r'^(ERROR|FAIL): (test_[A-Za-z0-9_]+) \(',line)
              if m:print("P08_83_PACKAGE_TEST_FAIL="+m.group(1)+":"+m.group(2))
              m=re.match(r'^[A-Za-z_.]*(?:AuditError|PackageError):\s*(PAIR_[A-Z0-9_:-]{4,100})$',line)
              if m:print("P08_83_PACKAGE_FAIL_CODE="+m.group(1))
          PY
              exit 21
            fi
          done
          if bash -x scripts/dev_check.sh > "$private/full.log" 2>&1; then
            grep -Fxq 'P08_OWNER_HISTORY_AND_SINGLE_CLICK_LOCAL_REGRESSIONS=PASS' "$private/full.log"
            grep -Fxq 'R1_LOCAL_SOURCE_TESTS=PASS' "$private/full.log"
            grep -Fxq 'FULL_RELEASE_READY=NO' "$private/full.log"
            test -z "$(git status --porcelain --untracked-files=all)"
            echo P08_83_EXACT_SOURCE_WHOLE_DEV_CHECK=PASS
            echo P08_83_PACKAGE_AND_UPDATER_TESTS_TOGETHER=PASS
            echo P08_83_NOT_FORMAL_RELEASE=CONFIRMED
          else
            echo P08_83_EXACT_SOURCE_WHOLE_DEV_CHECK=FAIL
            python3 - "$private/full.log" <<'PY'
          import re,sys
          from pathlib import Path
          log=Path(sys.argv[1]).read_text(errors='replace').splitlines()
          last='NOT_RESOLVED'
          for line in log:
              m=re.match(r'^\+ (?:php|python3|bash) ((?:tests|scripts)/[A-Za-z0-9_./-]+\.(?:php|py|sh))(?=\s|$)',line)
              if m:last=m.group(1)
              if line.startswith('+ python3 -m unittest discover -s tests -p '):
                  m=re.search(r'(test_[A-Za-z0-9_]+\.py)',line)
                  if m:last='unittest/'+m.group(1)
          print('P08_83_FULL_CHECK_LAST_SUITE='+last)
          for marker in ['PHP_SYNTAX_CHECKED','P08_OWNER_HISTORY_AND_SINGLE_CLICK_LOCAL_REGRESSIONS','R1_LOCAL_SOURCE_TESTS']:
              if any(x.startswith(marker+'=') for x in log):
                  print('P08_83_STAGE_REACHED='+marker)
          PY
            exit 23
          fi
      - name: Always remove private source, logs and synthetic build output
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-83-private-test-logs"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-83-private-test-logs"
          echo P08_83_FULL_VALIDATION_CLEANUP=PASS
