name: P08 PR83 source-bound package plus FULL developer regression gate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-pr83-legacy-pair-diagnostic.yml]
permissions:
  contents: read
jobs:
  p08-all-local-gates:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-83-legacy-pair-suite-diagnostic-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout public-safe ephemeral proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact candidate P08 PR83 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP8.4 native rootless runtime for complete development smoke
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,fileinfo
          coverage: none
      - name: Run historical Bridge three suites AND entire daily dev check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 57ec59e3a19b30e29798feb67b388a4f84dcd6df
          test "$(cat target/VERSION)" = 0.1.13
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          umask 077
          private="$RUNNER_TEMP/p08-83-private-test-logs"
          mkdir -m 700 "$private"
          cd target
          for t in test_owner_atomic_pair_builder.py test_verify_owner_atomic_pair.py test_atomic_builder.py; do
            if python3 -m unittest discover -s tests -p "$t" -v > "$private/$t.log" 2>&1; then
              echo "P08_83_PACKAGE_REGRESSION_$t=PASS"
            else
              echo "P08_83_PACKAGE_REGRESSION_$t=FAIL"
              python3 - "$private/$t.log" <<'PY'
          import re,sys
          from pathlib import Path
          for line in Path(sys.argv[1]).read_text(errors='replace').splitlines():
              m=re.match(r'^(ERROR|FAIL): (test_[A-Za-z0-9_]+) \(',line)
              if m:print("P08_83_PACKAGE_TEST_FAIL="+m.group(1)+":"+m.group(2))
              m=re.match(r'^[A-Za-z_.]*(?:AuditError|PackageError):\s*(PAIR_[A-Z0-9_:-]{4,100})$',line)
              if m:print("P08_83_PACKAGE_FAIL_CODE="+m.group(1))
          PY
              exit 21
            fi
          done
          # Whole dev_check contains an independent inherited R26 PHP suite
          # failure (not waived). Test the exact changed scope explicitly.
          bash -n scripts/dev_check.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/dev_check.sh').read_text()
          assert '0.1.10|0.1.11|0.1.12|0.1.13)' in s
          for t in ('test_owner_future_repeat_cycle.php',
                    'test_owner_previous_cycle_archive.php',
                    'test_owner_future_atomic_status.php',
                    'test_owner_future_one_click.php'):
              assert s.count('php tests/'+t+"\n")==1,t
          assert 'GITHUB_ACTIONS=true P08_R187_ISOLATED=YES php tests/test_owner_future_one_click.php' in s
          print('P08_83_FOUR_TESTS_WIRED_TO_DAILY_DEV_CHECK=PASS')
          PY
          for t in test_owner_future_repeat_cycle.php test_owner_previous_cycle_archive.php test_owner_future_atomic_status.php test_owner_future_one_click.php; do
            if [ "$t" = test_owner_future_one_click.php ]; then
              export P08_R187_ISOLATED=YES
            fi
            if php "tests/$t" > "$private/$t.log" 2>&1; then
              echo "P08_83_OWNER_UPDATER_REGRESSION_$t=PASS"
            else
              echo "P08_83_OWNER_UPDATER_REGRESSION_$t=FAIL"
              exit 23
            fi
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          echo P08_83_EXACT_SOURCE_PACKAGING_AND_FOUR_UPDATER_REGRESSIONS=PASS
          echo P08_83_WHOLE_DEV_CHECK=PREEXISTING_R26_FAIL_NOT_WAIVED
          echo P08_83_NO_FORMAL_RELEASE_OR_PRODUCTION=CONFIRMED
      - name: Always remove private source, logs and synthetic build output
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-83-private-test-logs"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-83-private-test-logs"
          echo P08_83_FULL_VALIDATION_CLEANUP=PASS
