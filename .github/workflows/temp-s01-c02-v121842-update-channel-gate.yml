name: TEMP S01-C02 Ops 1.21.842 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121842-finalize-readback-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121842-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 5d1b92c53dc23a18dd8b5712d0f20e7bd3dbd2a6
      UPDATE_DEVELOP: d175a068923d50a4dd384a424479aef206fd8c58
      UPDATE_CANDIDATE: 3ecdd477e253fb5cafe54341e912c5534c775671
      UPDATE_TREE: 4ba9ce8a9173a4e63164cf95218f7c5f762e5613
      PRODUCT_COMMIT: ee6377e6bf7dc608b516f0047e73363503174144
      PRODUCT_TREE: 9922080b788c125d0103942e7da4c245192b3cca
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      TAG: v1.21.842
      ASSET: vf-tools-ops_V1.21.842.zip
      BYTES: '3294392'
      SHA256: 6ab8f2c4390445d86c975f8b6e13523f9a94cebfd17109970fc9e6dd2cc31e9f
      FP: eeb185c18fa7bb2334018aeac7ac6c6f092f1de813f2f04c126370ec21f6ff89
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          test "$(git -C updates rev-parse HEAD^{tree})" = "$UPDATE_TREE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.842" and .from_versions==["1.21.841"] and .release_tag=="v1.21.842" and .asset_name=="vf-tools-ops_V1.21.842.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==924 and .runtime_file_count==924 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-06T02:15:58Z"' updates/projects/S01-C02.json >/dev/null
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.id==383435015 and .tag_name=="v1.21.842" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.id==546604899 and .name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$PRODUCT_COMMIT --jq .tree.sha)" = "$PRODUCT_TREE"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.841" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.841" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractClassifiedCount==0 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobInternalLinkFailureLeafCount==0 and .activeStaticJobInternalLinkUniqueTargetCount==0' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$UPDATE_BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$UPDATE_DEVELOP"
          test "$(git -C updates merge-base "$UPDATE_DEVELOP" "$UPDATE_BASE")" = "$UPDATE_DEVELOP"
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121842_UPDATE_CHANNEL_GATE
