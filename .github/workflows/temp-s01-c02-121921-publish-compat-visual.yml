name: TEMP S01-C02 1.21.921 Publish compatibility visual proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1bd30e51b48ed7a07dafc969c017d1a8ef7721fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Assert exact product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "1bd30e51b48ed7a07dafc969c017d1a8ef7721fc"
          test "$(tr -d '\r\n' < source/VERSION)" = "1.21.921"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l source/vf-ops.php
          php -l source/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l source/tests/s01-c02-121921-publish-compat-visual-r32-contract.php

      - name: R32 exact-source contract
        shell: bash
        run: |
          set -euo pipefail
          php source/tests/s01-c02-121921-publish-compat-visual-r32-contract.php

      - name: CSS structural check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/assets/css/current/admin-s01-compat-r32.css")
          css = p.read_text(encoding="utf-8")
          assert css.count("{") == css.count("}")
          assert '[data-vf-route-status="migration_evidence"]' in css
          for cls in (
              ".vf-publish-workbench",
              ".vf-pending-head",
              ".vf-pf-header",
              ".vf-batches-head",
              ".vf-history-head",
          ):
              assert cls in css, cls
          print("R32 CSS structural check PASS")
          PY

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf source

# PR synchronize trigger

# reuse registered lane for release progression
