name: S01-C02 1.21.921 Distribution R32 Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CORE_UPDATES_SHA: ffc1417493009c6a08e502a4404136e615cca146
      PRODUCT_SHA: c37dc1cc4754a3792926f8f4a40e04e48fb36ad4
      TAG: v1.21.921
      ASSET: vf-tools-ops_V1.21.921.zip
      ASSET_BYTES: "3494823"
      ASSET_SHA256: 4bf2ac497dffe980f43c56ccef82dce261f211fcdbdfde5f356e7fbe1e549a6d
      RUNTIME_FILES: "976"
      RUNTIME_FINGERPRINT: a1e3c134af139c848850bc75ff103923999821342315c07bb31b933d82404272

    steps:
      - name: Checkout exact distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ffc1417493009c6a08e502a4404136e615cca146
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: dist
          persist-credentials: false

      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c37dc1cc4754a3792926f8f4a40e04e48fb36ad4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify manifest and Update Core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C dist rev-parse HEAD)" = "$CORE_UPDATES_SHA"
          python3 dist/scripts/check_manifest_contract.py >/tmp/manifest-audit.json
          grep -Fq '"status": "PASS"' /tmp/manifest-audit.json

          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('dist/projects/S01-C02.json').read_text())
          assert m['target_version']=='1.21.921'
          assert m['release_tag']==os.environ['TAG']
          assert m['asset_name']==os.environ['ASSET']
          assert m['asset_bytes']==int(os.environ['ASSET_BYTES'])
          assert m['asset_sha256']==os.environ['ASSET_SHA256']
          assert m['runtime_files']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_file_count']==int(os.environ['RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['RUNTIME_FINGERPRINT']
          assert m['runtime_fingerprint_sha256']==os.environ['RUNTIME_FINGERPRINT']
          assert '1.21.914' in m['from_versions']
          assert m['schema_from']=='6.0.0' and m['schema_to']=='6.0.0'
          assert m['backup_required'] is True
          assert m['rollback_supported'] is True
          print('PASS_MANIFEST')
          PY

          find dist/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php dist/update-core/php/tests/run.php

      - name: Verify R32 product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.921"
          php ops/tests/s01-c02-121921-publish-compat-visual-r32-contract.php

      - name: Verify Formal Release binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          mkdir -p /tmp/release
          gh release download "$TAG" --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/release
          test "$(sha256sum "/tmp/release/$ASSET" | awk '{print $1}')" = "$ASSET_SHA256"
          echo PASS_DISTRIBUTION_R32

      - name: Cleanup private checkouts
        if: always()
        shell: bash
        run: rm -rf dist ops /tmp/release

# synchronize distribution definition
