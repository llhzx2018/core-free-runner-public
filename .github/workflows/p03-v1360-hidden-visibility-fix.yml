name: P03 V1.36.0 Hidden Visibility Runtime Fix
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: 203db39bfb8c7716ebb6645447c5c59f49a278b0
    steps:
      - name: Fix runtime hidden contract and lock regression
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          css=Path('public/assets/experience.css')
          s=css.read_text(encoding='utf-8')
          anchor='*{box-sizing:border-box}'
          fix='[hidden]{display:none!important}'
          assert s.count(anchor)==1, 'CSS_ANCHOR_MISMATCH'
          assert fix not in s, 'HIDDEN_FIX_ALREADY_PRESENT'
          css.write_text(s.replace(anchor,anchor+fix,1),encoding='utf-8')
          gate=Path('tests/integration/v1360_experience_static_gate.py')
          g=gate.read_text(encoding='utf-8')
          anchor2="css=(root/'public/assets/experience.css').read_text(encoding='utf-8')\n"
          add="assert '[hidden]{display:none!important}' in css, 'hidden elements must remain hidden after author CSS'\n"
          assert g.count(anchor2)==1, 'STATIC_GATE_ANCHOR_MISMATCH'
          assert add not in g
          gate.write_text(g.replace(anchor2,anchor2+add,1),encoding='utf-8')
          PY
          python3 tests/integration/v1360_experience_static_gate.py
          node --check public/assets/experience.js
          test "$(git status --short | wc -l)" -eq 2
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add public/assets/experience.css tests/integration/v1360_experience_static_gate.py
          git commit -m 'fix(v1.36.0): preserve hidden login and app visibility states'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
