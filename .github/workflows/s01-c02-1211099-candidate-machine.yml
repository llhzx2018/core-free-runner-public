name: S01 C02 1211099 Exact Candidate Machine
on:
  push:
    branches: [task/s01-c02-1211099-exact-candidate-20261012]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: vf_ops_update
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
          MARIADB_ROOT_PASSWORD: vfroot
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pvfroot"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_VERSION: '1.21.1099'
      TARGET_SHA: '6ec4b13921aa421446881c0e528eb985dd443e8d'
      TARGET_TREE: '4f5ce0da1208141fc9001a905ae04299463a131c'
      SOURCE_VERSION: '1.21.1098'
      MARIADB_ROOT_PASSWORD: vfroot
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout registered public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Validate exact candidate lane identity and trigger
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/ephemeral_lane_spec.py validate --spec runner/lanes/s01-c02-1211099/spec.json
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c02-1211099/spec.json --input runner/.github/workflows/s01-c02-1211099-candidate-machine.yml
          bash -n runner/lanes/s01-c02-1211099/candidate.sh
      - name: Checkout exact product candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Install Linux WordPress testing dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl unzip jq curl
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar' -o /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          php -v | head -n 2
          wp --info
          mysql --protocol=tcp -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_ops_update
      - name: Verify, package and exercise WordPress native upgrade/recovery
        run: |
          set -Eeuo pipefail
          bash runner/lanes/s01-c02-1211099/candidate.sh product "$GITHUB_WORKSPACE/proof"
      - name: Upload public-safe receipts only (no product ZIP or secret)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211099-candidate-receipts-${{ github.run_id }}
          path: |
            proof/stage.txt
            proof/regression.txt
            proof/candidate.json
            proof/SHA256SUMS.txt
            proof/formal-upgrade.txt
            proof/RESULT.json
            proof/native/candidate.json
            proof/native/FINAL_EVIDENCE.json
            proof/native/browser-e2e.json
          if-no-files-found: warn
          retention-days: 30
