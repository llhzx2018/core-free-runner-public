name: Core Updates P01 V2.35 Main Promotion
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/core-updates-p01-v2350-main-promotion-20260831.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify manifest gate and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          GATE=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33332828443)
          test "$(jq -r .status <<<"$GATE")" = completed
          test "$(jq -r .conclusion <<<"$GATE")" = success
          test "$(jq -r .head_sha <<<"$GATE")" = b975758002ebde1cff1b6142daeab6aa359a919d
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 489c200898612edfe0cac110e727742016f7bb70
          rm -rf updates
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          git -C updates fetch -q origin release/p01-v2.35.0-manifest-20260831 main
          test "$(git -C updates rev-parse origin/release/p01-v2.35.0-manifest-20260831)" = 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          test "$(git -C updates merge-base origin/main origin/release/p01-v2.35.0-manifest-20260831)" = 489c200898612edfe0cac110e727742016f7bb70
          test "$(git -C updates diff --name-only origin/main...origin/release/p01-v2.35.0-manifest-20260831)" = projects/P01.json
          jq -e '.current_version=="2.34.0" and .target_version=="2.35.0" and .release_id==379388775 and .product_identity=="d20f8e964455c7238b66c6ff6ab2e7d732d315e2" and .asset_sha256=="73cbfabf9968c6366491a7f3caa6b70916432c638ac3e7df87479ccc2051e68a"' updates/projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V2350_PROMOTION_PRECHECK=PASS
      - name: Promote exact manifest candidate to core-updates main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C updates push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09:refs/heads/main
          git -C updates fetch -q origin main
          test "$(git -C updates rev-parse origin/main)" = 2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          jq -e '.current_version=="2.34.0" and .target_version=="2.35.0" and .release_id==379388775 and .product_identity=="d20f8e964455c7238b66c6ff6ab2e7d732d315e2" and .asset_sha256=="73cbfabf9968c6366491a7f3caa6b70916432c638ac3e7df87479ccc2051e68a"' updates/projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V2350_MAIN_PROMOTION=PASS
          echo OWNER_PRODUCTION_WRITE=NO
