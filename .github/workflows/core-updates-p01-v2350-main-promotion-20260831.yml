name: Core Updates P01 V2.35.1 Main Promotion
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/core-updates-p01-v2350-main-promotion-20260831.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify manifest gate and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          CANDIDATE=a7a601e0880becb78c9835648d06dcda2625b2dc
          GATE=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33342185241)
          test "$(jq -r .status <<<"$GATE")" = completed
          test "$(jq -r .conclusion <<<"$GATE")" = success
          test "$(jq -r .head_sha <<<"$GATE")" = f2a5049b1c0c61bbdc0733ce358efb2a04686fdb
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$BASE"
          rm -rf updates
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          git -C updates fetch -q origin release/p01-v2351-manifest-20260831 main
          test "$(git -C updates rev-parse origin/release/p01-v2351-manifest-20260831)" = "$CANDIDATE"
          test "$(git -C updates merge-base origin/main origin/release/p01-v2351-manifest-20260831)" = "$BASE"
          test "$(git -C updates diff --name-only origin/main...origin/release/p01-v2351-manifest-20260831)" = projects/P01.json
          git -C updates show origin/release/p01-v2351-manifest-20260831:projects/P01.json | jq -e '.current_version=="2.35.0" and .target_version=="2.35.1" and .release_id==379424818 and .product_identity=="eb36fd19d269aed4ef4246c2c18f172b2c761bde" and .asset_name=="VF_Start_V2.35.1_UPDATE.zip" and .asset_bytes==1376805 and .asset_sha256=="e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af"' >/dev/null
          echo CORE_UPDATES_P01_V2351_PROMOTION_PRECHECK=PASS
      - name: Promote exact manifest candidate to core-updates main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C updates push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" a7a601e0880becb78c9835648d06dcda2625b2dc:refs/heads/main
          git -C updates fetch -q origin main
          test "$(git -C updates rev-parse origin/main)" = a7a601e0880becb78c9835648d06dcda2625b2dc
          git -C updates show origin/main:projects/P01.json | jq -e '.current_version=="2.35.0" and .target_version=="2.35.1" and .release_id==379424818 and .product_identity=="eb36fd19d269aed4ef4246c2c18f172b2c761bde" and .asset_name=="VF_Start_V2.35.1_UPDATE.zip" and .asset_bytes==1376805 and .asset_sha256=="e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af"' >/dev/null
          echo CORE_UPDATES_P01_V2351_MAIN_PROMOTION=PASS
          echo OWNER_PRODUCTION_WRITE=NO
