name: S01 native WP updater discovers approved Theme public templates
on:
  push:
    branches: [task/s01-theme114-public-templates-native-20261014]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: 'ffdd965b8a1162ad091e0586b346e79559524968'
      TARGET_TREE: 'f8df663204642be6f0d8e9d27ad877c75c3781ef'
      CHANNEL_SHA: 'ffdd965b8a1162ad091e0586b346e79559524968'
      THEME_SOURCE_VERSION: '1.35.113'
      THEME_LEGACY_SOURCE_VERSION: '1.35.112'
      THEME_VERSION: '1.35.114'
      THEME_SHA: '67a06b595ca1e1bce0b80b697638023731a67a9d'
      THEME_TREE: 'd2cc9b82c4c66089e378848d7624059eaebc939e'
      THEME_ASSET_SHA: '6a6faa26f29a425fe8f1bea49d3427f7c8437a22876f28431df17d8767d5764b'
      M3_SOURCE_VERSION: '1.25.90'
      M3_VERSION: '1.25.91'
      M3_SHA: 'c7872c7f63c1224865a6ea9bfd9fdd616e0ff2fd'
      M3_TREE: '9736d4ec2f9c04bb3adfa4497fcc41fdc3e7d8a2'
      M3_ASSET_SHA: 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df'
      THEME_BASE_BYTES: '1794571'
      THEME_BASE_SHA256: '0aa8ebf58000fff58a57a64aff2bd06b514bcf67e5c87c61e32f4061d2a9e335'
      M3_BASE_BYTES: '3580301'
      M3_BASE_SHA256: 'ad6b42a093082db6d477566a4aac47e087d456bf61ba4d3426858ca86467dafa'
      THEME_LEGACY_BYTES: '1794058'
      THEME_LEGACY_SHA256: '6574f7701b1646d968f1c7605f99b222584912e5d0af23debc6b5c0f66d26745'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact one-spec discovery audit
        run: |
          set -Eeuo pipefail
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme114-public-templates-native-20261014/spec.json --template runner/lanes/s01-theme114-public-templates-native-20261014/discovery.template.yml --output /tmp/discovery-render.yml >/dev/null
          cmp /tmp/discovery-render.yml runner/.github/workflows/s01-theme114-public-templates-native-20261014.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme114-public-templates-native-20261014/spec.json --input runner/.github/workflows/s01-theme114-public-templates-native-20261014.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-theme114-public-templates-native-20261014 lane
          bash -n lane/native.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Original Core CI on the exact merged distribution source
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cd target
          python3 scripts/check_manifest_contract.py
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010-discovery
          persist-credentials: false
          path: historic-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed78-20261010-discovery
          persist-credentials: false
          path: historic-m3
      - name: Real WordPress old-install native update discovery and exact asset download
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lane/native.sh
      - name: Public-safe discovery receipts only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-native-discovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Uploaded public-safe receipt reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/native-meta.json; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/native-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import os,json,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text());b=pathlib.Path('/tmp/native-receipt.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert m['size_in_bytes']==len(b) and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/native-receipt.zip') as z:
           assert z.testzip() is None
           names={'lane-identity.json','native-theme-current.json','native-theme-legacy.json','native-m3.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:
            assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           final=json.loads(z.read('FINAL_DISCOVERY.json'))
           assert final['status']=='PASS' and len(final['component_checks'])==2
          print('PUBLIC_SAFE_NATIVE_READBACK',json.dumps({'status':'PASS','artifact_id':m['id'],'digest':m['digest'],'bytes':len(b)}))
          PY
      - name: Remove private checkout and synthetic artifacts
        if: always()
        run: rm -rf target historic-theme historic-m3 /tmp/vf-s01-wpcli.phar /tmp/theme-source.zip /tmp/theme-legacy-source.zip /tmp/m3-source.zip /tmp/theme-channel.json /tmp/m3-channel.json
