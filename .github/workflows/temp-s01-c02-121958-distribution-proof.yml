name: TEMP S01-C02 1.21.958 Distribution Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-121958-distribution-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      UPDATES_SHA: a1d763ce77793c32efbaee0e52c3f1b82f7a11dc
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 30aa7d3ec8ae38cd7829c43d70584e5336e2b8b9
      TAG: v1.21.958
      ASSET: vf-tools-ops_V1.21.958.zip
      ASSET_BYTES: '3411757'
      ASSET_SHA256: c723629b16721da3e85ec2aba617f0dc90c68fece36793564e2d4c5bb6bf8959
      RUNTIME_FILES: '961'
      RUNTIME_FP: 80da97e7b5d037c4e69bc5368d4c65f054b47cbc66dcf54e5a3b8c2445f05721

    steps:
      - name: Checkout exact distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Exact manifest identity and contract
        shell: bash
        working-directory: updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.958"
          assert m["release_tag"]=="v1.21.958"
          assert m["asset_name"]=="vf-tools-ops_V1.21.958.zip"
          assert m["asset_bytes"]==3411757
          assert m["asset_sha256"]=="c723629b16721da3e85ec2aba617f0dc90c68fece36793564e2d4c5bb6bf8959"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="80da97e7b5d037c4e69bc5368d4c65f054b47cbc66dcf54e5a3b8c2445f05721"
          assert "1.21.957" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          print("S01-C02 1.21.958 manifest identity PASS")
          PY
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          echo 'S01-C02 1.21.958 DISTRIBUTION_EXACT_SOURCE_PROOF=PASS'

      - name: Cleanup
        if: always()
        run: rm -rf updates
