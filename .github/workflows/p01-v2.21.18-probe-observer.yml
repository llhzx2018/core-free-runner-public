name: P01 V2.21.18 Probe Observer
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-probe-observer.yml']
permissions:
  actions: read
  contents: read
jobs:
  x:
    runs-on: ubuntu-24.04
    env:
      G: ${{ github.token }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64,urllib.error
          repo=os.environ['GITHUB_REPOSITORY'];h={'Authorization':'Bearer '+os.environ['G']};u=f'https://api.github.com/repos/{repo}/actions/workflows/p01-v2.21.18-mobile-overflow-probe.yml/runs?branch=vf-agent-operations-v1&per_page=2';d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=h)));p={'runs':[{k:x.get(k) for k in ['id','status','conclusion','head_sha']} for x in d.get('workflow_runs',[])]};c=json.dumps(p,indent=2)+'\n';t=os.environ['W'];api=f'https://api.github.com/repos/{repo}/contents/vf-agent/results/P01-V2.21.18-PROBE-OBSERVER.json';hh={'Authorization':'Bearer '+t};sha=None
          try:sha=json.load(urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=hh))).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): observe mobile probe','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**hh,'Content-Type':'application/json'})).read()
          PY
