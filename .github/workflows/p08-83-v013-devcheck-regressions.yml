name: P08 83 current v013 rootless repeated Owner upgrade regression gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-83-v013-devcheck-regressions.yml
permissions:
  contents: read
jobs:
  exact-private-source-four-rootless-updater-tests:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-devcheck-83-four-php-rootless-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout temporary public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 PR83 source transiently without persisting GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: PHP8.4 rootless test dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,fileinfo
          coverage: none
      - name: Verify existing installed source, old R67 refusal and four actual PHP regression files
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C target rev-parse HEAD)" = 3cebfb6d810ff407dc3bc3f94a38f856d342b488
          test "$(cat target/VERSION)" = 0.1.13
          test -z "$(git -C target status --porcelain --untracked-files=all)"
          bash -n target/scripts/dev_check.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path('target/scripts/dev_check.sh').read_text()
          assert '0.1.10|0.1.11|0.1.12|0.1.13)' in s
          for test in (
              'test_owner_future_repeat_cycle.php',
              'test_owner_previous_cycle_archive.php',
              'test_owner_future_atomic_status.php',
              'test_owner_future_one_click.php',
          ):
              assert s.count('php tests/'+test+'\n')==1,test
          assert 'P08_R67_UNKNOWN_FUTURE_TARGET_VERSION=BLOCKED' in s
          print('P08_83_PRECISE_CURRENT_VERSION_AND_FOUR_WIRED_REGRESSIONS=PASS')
          PY
          cd target
          private="$RUNNER_TEMP/p08-83-unlogged-fixtures"
          mkdir -m 700 "$private"
          set +e
          python3 scripts/check_bridge_runtime_parity.py > "$private/r67.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -Fq 'P08_R67_UNEXPECTED_TARGET_VERSION' "$private/r67.log"
          echo 'P08_83_LEGACY_R67_REFUSES_V013=PASS'
          for t in test_owner_future_repeat_cycle.php test_owner_previous_cycle_archive.php test_owner_future_atomic_status.php test_owner_future_one_click.php; do
            php -l "tests/$t" >/dev/null
            if [ "$t" = test_owner_future_one_click.php ]; then
              export P08_R187_ISOLATED=YES
            fi
            if ! php "tests/$t" > "$private/$t.log" 2>&1; then
              echo "P08_83_TEST_FAILED=${t%.php}" >&2
              exit 1
            fi
            echo "P08_83_TEST_SUCCESS=${t%.php}"
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'P08_83_ROOTLESS_FOUR_PHP_HISTORY_STATUS_ONECLICK=PASS'
      - name: Always remove private checkout and test logs; do not save artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- target "$RUNNER_TEMP/p08-83-unlogged-fixtures"
          test ! -e target
          test ! -e "$RUNNER_TEMP/p08-83-unlogged-fixtures"
          echo 'P08_83_RUNNER_PRIVATE_WORKSPACE_AND_LOGS_CLEANUP=PASS'
