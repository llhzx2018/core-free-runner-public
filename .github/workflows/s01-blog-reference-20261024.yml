name: S01 Blog reference prototype render
on:
  push:
    branches: [design/s01-blog-reference-20261024]
    paths: ['.github/workflows/s01-blog-reference-20261024.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.185
  TARGET_SHA: 78c69171a0be86c5a715142c534c3288cfbc0eca
  TARGET_TREE: f8b6d6b0db01d22b6177bac9e9f1ff75f8c9ff07
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Check rendered target identity
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-blog-reference-20261024/spec.json --input control/.github/workflows/s01-blog-reference-20261024.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 78c69171a0be86c5a715142c534c3288cfbc0eca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Render exact offline prototype without a web server
        run: |
          set -euo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C theme rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat theme/VERSION)" = "$TARGET_VERSION"
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts" proof
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          PROOF_DIR="$PWD/proof" NODE_PATH="$PWD/node_modules" node theme/docs/prototypes/2026-10-24-blog-directory/render-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-blog-reference-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private source
        if: always()
        run: rm -rf theme
