name: P02 W3 read-only official update exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-w3-update-source-exact.yml'
permissions:
  contents: read
concurrency:
  group: p02-w3-update-readonly-one-off
  cancel-in-progress: false
jobs:
  source-security:
    if: github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p02-w3-update-readonly-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P02_SHA: 2de410acb3e990591c731c52c163e1db683f5ea6
    steps:
      - name: Fetch exact private P02 source into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 2de410acb3e990591c731c52c163e1db683f5ea6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p02-source
          fetch-depth: 1
      - name: Exact identity and PHP/Python security tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p02-source rev-parse HEAD)" = "$P02_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli python3
          cd p02-source
          test "$(cat VERSION)" = "2.5.131"
          php -l modern/laravel/P02W3OfficialUpdateSource.php
          php -l modern/laravel/P02W3OwnerUpdateToken.php
          php -l modern/laravel/P02W3LaravelPortal.php
          php -l modern/laravel/P02W3UpdateSettingsView.php
          php -l modern/laravel/P02W3InstalledSiteEntry.php
          php -l modern/laravel/routes/web.php
          php -l tests/unit/p02_w3_official_update_source.php
          php tests/unit/p02_w3_official_update_source.php
          php tests/unit/p02_w3_installed_site_entry.php
          python3 -B -m unittest discover -s tests/unit -p test_p02_w3_laravel_portal_source.py -v
          python3 -B scripts/p02_w3_source_gate.py
          echo P02_W3_OFFICIAL_RELEASE_IDENTITY_OWNER_CSRF_SOURCE=PASS
          echo P02_W3_EXACT_SOURCE_SHA="$P02_SHA"
          echo P02_W3_LEGACY_CHANNEL_NOT_W3_ATOMIC=PASS
          echo P02_W3_RELEASE_PRODUCTION=NOT_AUTHORIZED
      - name: Clean transient private source
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -d p02-source; then rm -rf -- p02-source; fi
          test ! -e p02-source
          echo P02_W3_PRIVATE_SOURCE_NOT_PERSISTED=YES

