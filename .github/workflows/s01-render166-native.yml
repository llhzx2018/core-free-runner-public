name: S01 Theme render166 exact native lifecycle
on:
  push:
    branches: [task/s01-render-verify-20261022]
    paths: ['.github/workflows/s01-render166-native.yml']
permissions:
  contents: read
env:
  TARGET_SHA: fae79f8d0cabdbe6bb3f517907e683a67042b9e1
  TARGET_TREE: 13c82d65cb2ca9df72e0ec19509792c2cbe93f1a
  TARGET_VERSION: 1.35.166
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: fae79f8d0cabdbe6bb3f517907e683a67042b9e1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify exact candidate and build deterministic Theme ZIP
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          test "$(grep '^Version: ' target/src/style.css)" = "Version: $TARGET_VERSION"
          php -l target/src/inc/admin/admin-render-actions.php
          php -l target/src/inc/admin/views/render.php
          php -l target/src/inc/runtime-constants.php
          node --check target/src/assets/js/admin/admin-render.js
          php target/tests/render-page-refinement-contract.php
          php target/tests/render-settings-human-language-contract.php
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          gh release download v1.35.165 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.165.zip --dir provider
          echo 'f617fdfccd6fef7999bc17878c923bfad800fae714ec50fedce4f7fb343101e8  provider/vf-tools-theme_V1.35.165.zip' | sha256sum -c
          python3 control/lanes/s01-render166/package.py
      - name: Native WordPress with existing established synthetic fixture
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          python3 control/lanes/s01-render166/prepare.py
          bash lane/native-render166.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-render166-native
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf target provider lane
