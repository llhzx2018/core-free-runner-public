name: P01 V2.38.0 Formal Bind R2 Gate

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p01-v2380-formal-bind-r2-gate.yml]

permissions:
  contents: read

jobs:
  formal-bind-r2:
    if: github.event.pull_request.head.ref == 'test/p01-v2380-formal-bind-r2-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact formal source R2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 44a13c13585e82c2061657e78d06055f0879a60f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Verify corrected Formal Bind
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '44a13c13585e82c2061657e78d06055f0879a60f'
          test "$(git rev-parse HEAD^{tree})" = '18b906722a001bbe674139f53018ca5b86225dd7'
          test "$(git rev-parse HEAD^)" = '869178a4c8144a0760ea489936c4bde5efa989d2'
          test "$(cat VERSION)" = '2.38.0'
          test "$(cat src/VERSION.txt)" = '2.38.0'
          test "$(cat VERSION)" = "$(cat src/VERSION.txt)"
          ! git show-ref --verify --quiet refs/tags/v2.38.0
          git diff --name-only 869178a4c8144a0760ea489936c4bde5efa989d2..HEAD > /tmp/bind.txt
          test "$(cat /tmp/bind.txt)" = 'docs/evidence/P01_V2.38.0_FORMAL_BIND_R2_20260902.md'
          test "$(git rev-parse HEAD:src)" = "$(git rev-parse 869178a4c8144a0760ea489936c4bde5efa989d2:src)"
          grep -Fq 'R2 Candidate Readiness Run: `33619802724`' docs/evidence/P01_V2.38.0_FORMAL_BIND_R2_20260902.md
          grep -Fq 'R2 Candidate Readiness Result: `PASS`' docs/evidence/P01_V2.38.0_FORMAL_BIND_R2_20260902.md
          grep -Fq 'SUPERSEDED_FOR_FORMAL_RELEASE' docs/evidence/P01_V2.38.0_FORMAL_BIND_R2_20260902.md
          php src/cli/verify.php | tee /tmp/verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/verify.txt
          echo P01_V2380_R2_FORMAL_SOURCE=PASS
          echo P01_V2380_R2_RUNTIME_BYTES_UNCHANGED=PASS
          echo P01_V2380_R2_DUAL_VERSION_FENCE=PASS
      - name: Final read-only boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          echo P01_V2380_R2_MAIN_WRITE=0
          echo P01_V2380_R2_RELEASE_WRITE=0
          echo P01_V2380_R2_PRODUCTION_WRITE=0
          echo P01_V2380_R2_FORMAL_BIND=PASS
