name: S01 Theme 1.35.156 backup desktop exact CSS priority recheck
on:
  push:
    branches: [task/s01-theme-backup156-20261021]
    paths:
      - '.github/workflows/s01-theme-backup156.yml'
      - 'lanes/s01-theme-backup156-20261021/**'
permissions:
  contents: read
jobs:
  backup-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Reuse established isolated WordPress MariaDB shell
        run: |
          set -euo pipefail
          mkdir -p proof provider
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-theme-backup156-20261021/backup-focused.cjs lane/backup-focused.cjs
          node --check lane/backup-focused.cjs
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 74818819cd0bd6ac36d05eea97a83efea4654325
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Validate exact owner CSS and deterministic Theme release package
        run: |
          set -euo pipefail
          php -l target/src/inc/runtime-constants.php
          python3 - <<'PY_PACKAGE'
          from pathlib import Path,PurePosixPath
          import subprocess,hashlib,zipfile,json
          root=Path('target');base='5fc738ac42d71898da146b6fedc70a4ad7ec1a43';sha='74818819cd0bd6ac36d05eea97a83efea4654325'
          def git(*args):return subprocess.check_output(['git','-C',str(root),*args])
          assert git('rev-parse','HEAD').decode().strip()==sha
          assert git('rev-parse','HEAD^{tree}').decode().strip()=='ecde3793c222a1d3944f7ccc1acfe81989b62eb1'
          assert (root/'VERSION').read_text().strip()=='1.35.156'
          changed=set(git('diff','--name-only',base,sha).decode().splitlines())
          owner='src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css'
          bundle='src/assets/css/public/vf-theme-public-runtime.css'
          assert changed=={owner,bundle,'VERSION','src/style.css','src/inc/runtime-constants.php','CHANGELOG.md'},changed
          old=git('show',base+':'+owner)
          new=(root/owner).read_bytes()
          baseline=git('show',base+':'+bundle)
          actual=(root/bundle).read_bytes()
          assert baseline.count(old)==1
          assert actual==baseline.replace(old,new,1)
          assert 'Version: 1.35.156' in (root/'src/style.css').read_text()
          assert "VF_THEME_VERSION', '1.35.156'" in (root/'src/inc/runtime-constants.php').read_text()
          assert 'S01-C01: readable backup workbench on desktop' in new.decode()
          assert new.count(b'.vf-backup-restore[data-vf-module="backup-restore"]')>=5
          print('CSS_OWNER_BUNDLE_EXACT_BYTE_CLOSURE_PASS')
          files=sorted(x for x in (root/'src').rglob('*') if x.is_file())
          assert len(files)==476,len(files)
          out=Path('vf-tools-theme_V1.35.156.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
           for p in files:
            assert not p.is_symlink()
            inf=zipfile.ZipInfo(str(PurePosixPath('vf-tools-theme')/p.relative_to(root/'src')),date_time=(1980,1,1,0,0,0))
            inf.compress_type=zipfile.ZIP_DEFLATED
            inf.external_attr=(p.stat().st_mode&0o777)<<16
            z.writestr(inf,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(out) as z:
           assert z.testzip() is None
           assert 'Version: 1.35.156' in z.read('vf-tools-theme/style.css').decode()
          proof={'version':'1.35.156','source':sha,'tree':'ecde3793c222a1d3944f7ccc1acfe81989b62eb1','fileCount':476,'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'scope':'backup desktop CSS presentation only','status':'PASS'}
          Path('proof/theme156-package.json').write_text(json.dumps(proof,indent=2))
          print('THEME156_EXACT_PACKAGE_PASS',json.dumps(proof))
          PY_PACKAGE
      - name: Download exact released M3U8 and prior Theme for rollback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v1.25.93 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.93.zip --dir provider
          echo '4e032449f4581115a33e4e5b122ec0eef7651ac7a1f23937102a49cd0a7e5815  provider/vf-tools-m3u8_V1.25.93.zip' | sha256sum -c
          gh release download v1.35.155 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.155.zip --dir provider
          echo '125b15f50ad36b5a05d7ff1998313d90580e6def99415bfaca956cbc710c5b5a  provider/vf-tools-theme_V1.35.155.zip' | sha256sum -c
      - name: Browser engine
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: Real WordPress front-end and native theme upgrade rollback
        run: |
          set -euo pipefail
          python3 - <<'PY_NATIVE'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          old='docker cp provider/vf-tools-m3u8_V1.25.91.zip "$WP:/tmp/provider.zip"'
          assert script.count(old)==1
          script=script.replace(old,'docker cp provider/vf-tools-m3u8_V1.25.93.zip "$WP:/tmp/provider.zip"')
          step='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert script.count(step)==1
          script=script.replace(step,'for attempt in 1 2 3; do '+step+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          script=script.replace('node lane/warm-admin.cjs','true')
          anchor='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(anchor)==1
          script=script.split(anchor)[0]+"""node lane/backup-focused.cjs
          cli eval-file /tmp/snapshot.php > proof/state-after-browser.json
          cmp proof/state-before.sha256 proof/state-after-browser.json
          docker cp provider/vf-tools-theme_V1.35.155.zip "$WP:/tmp/theme-old.zip"
          docker cp vf-tools-theme_V1.35.156.zip "$WP:/tmp/theme-next.zip"
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.156
          cli theme install /tmp/theme-old.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.155
          cli theme install /tmp/theme-next.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.156
          cli theme install /tmp/theme-next.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.156
          cli eval-file /tmp/snapshot.php > proof/state-after-upgrade.json
          cmp proof/state-before.sha256 proof/state-after-upgrade.json
          echo THEME156_NATIVE_UPGRADE_ROLLBACK_REPEAT_STATE_PRESERVED_PASS
          """
          Path('lane/backup-native.sh').write_text(script)
          PY_NATIVE
          bash lane/backup-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme156-backup-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private source
        if: always()
        run: rm -rf target provider vf-tools-theme_V1.35.156.zip
