name: p01-v247214-scroll-loop-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247214-scroll-loop-proof.yml'

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: ccfa0bce744e52ed30a12dd801e792d602f21990
      BASE_TAG: v2.47.213
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          echo P01_SCROLL_LOOP_RUNTIME=PASS

      - name: Resolve exact source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.214"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          echo P01_SCROLL_LOOP_EXACT_SOURCE=PASS

      - name: Syntax and focused contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/tools_header_mature_r2_contract.php | tee /tmp/p01-tools-header.txt
          grep -Fx 'P01_TOOLS_HEADER_MATURE_R2=PASS' /tmp/p01-tools-header.txt
          ! grep -F 'scrollIntoView(' src/assets/tool-scene-detail.js
          grep -F 'rail.scrollLeft' src/assets/tool-scene-detail.js >/dev/null
          echo P01_SCROLL_LOOP_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          echo P01_SCROLL_LOOP_CANONICAL=PASS
