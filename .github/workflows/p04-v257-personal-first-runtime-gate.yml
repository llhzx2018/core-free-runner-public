name: P04 VF Infra V2.5.7 Personal-first Runtime Gate

on:
  push:
    paths:
      - '.github/workflows/p04-v257-personal-first-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v257-personal-first-runtime-gate
  cancel-in-progress: true

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  EXPECTED_COMMIT: ce13f15fb454fcb8d20244ac9cb232eee7f15adc

jobs:
  runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private P04 runtime source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.7'
          python3 - <<'PY'
          import json
          with open('VF_PROJECT.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data['schema_version'] == 14
          assert data['working']['version'] == '2.5.7'
          assert data['working']['migration'] == 'NONE'
          assert data['working']['dangerous_provider_remote_write_added'] is False
          PY
          echo "P04 exact source identity PASS: $actual / V2.5.7 / Schema14"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl
          coverage: none

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository and migration health
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/repository-health-gate.py
          python scripts/check-migrations.py

      - name: Syntax and structural contracts
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$({
            find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l &&
            node --check public/assets/app.js &&
            node --check public/assets/v254-ui.js &&
            node --check public/assets/v256-ui.js &&
            node --check public/assets/v257-view.js &&
            node --check public/assets/v257-mobile.js &&
            node --check public/assets/v257-nav.js &&
            node --check public/assets/v257-cn.js &&
            node --check tests/e2e/v257-personal-first.mjs &&
            bash -n scripts/run-v257-browser-gate.sh &&
            php tests/unit/ui_contract_v256.php . &&
            php tests/unit/ui_contract_v257.php .
          } 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | tail -n 18 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=P04 V2.5.7 Static Gate::$detail"
            exit "$rc"
          fi

      - name: Provider billing, Project Scope and job regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/unit/core_updates_contract_v252.php
          php tests/integration/provider_billing_contract_v250.php src
          php tests/integration/provider_billing_pagination_v256.php src
          php tests/integration/project_membership_contract_v257.php src
          php tests/unit/provider_currency_contract_v256.php src
          php tests/unit/provider_billing_persistence_contract_v256.php .
          php tests/unit/job_partial_health_contract_v256.php .

      - name: Fresh install and synthetic business chain
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/run-clean-full-install-gate.sh
          scripts/run-clean-full-install-gate.sh

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Personal-first browser E2E and responsive gate
        shell: bash
        run: |
          set -uo pipefail
          chmod +x scripts/run-v257-browser-gate.sh
          set +e
          output="$(scripts/run-v257-browser-gate.sh 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            detail="$(printf '%s\n' "$output" | tail -n 14 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=P04 V2.5.7 Browser Gate::$detail"
            exit "$rc"
          fi

      - name: Confirm no dangerous provider remote-write surface
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Eqi 'reboot_instance|delete_instance|rebuild_instance|resize_instance|power_off_instance|power_on_instance' public/assets/v257-view.js public/assets/v257-mobile.js public/assets/v257-nav.js public/assets/v257-cn.js
          echo 'P04 V2.5.7 READ-ONLY FIRST boundary PASS'

      - name: Ephemeral source cleanup marker
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'Private source was checked out only into this ephemeral runner workspace.'
          echo 'No source package, FULL, UPDATE, Atomic, database, or source artifact is uploaded.'
