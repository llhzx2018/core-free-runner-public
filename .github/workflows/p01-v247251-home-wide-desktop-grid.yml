name: P01 V2.47.251 Home Wide Desktop Grid Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247251-home-wide-desktop-grid.yml"
      - "proof-triggers/p01-v247251-home-wide-desktop-grid.json"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin b7f0384877bb4ecb6620700923fa76eb6afd2820
          git -C candidate checkout -q --detach b7f0384877bb4ecb6620700923fa76eb6afd2820
          test "$(git -C candidate rev-parse HEAD)" = "b7f0384877bb4ecb6620700923fa76eb6afd2820"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.251"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.251"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 9b9d73ff508e5f0837942ed23ce3375e95305be5
          git -C baseline checkout -q --detach 9b9d73ff508e5f0837942ed23ce3375e95305be5
          echo P01_V247251_EXACT_SOURCE=PASS

      - name: Home Wide Desktop focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/frontend_wide_desktop_layout_contract.php
          php candidate/tests/unit/frontend_home_portal_contract.php
          php candidate/tests/unit/frontend_global_shell_r1_contract.php
          grep -Fq -- '--home-portal-max:1440px' candidate/src/assets/desktop-wide-layout.css
          grep -Fq -- '--home-portal-rail:340px' candidate/src/assets/desktop-wide-layout.css
          grep -Fq 'body.surface-home .vf-home-portal-layout' candidate/src/assets/desktop-wide-layout.css
          grep -Fq 'grid-template-columns:minmax(0,1fr) minmax(300px,var(--home-portal-rail))!important' candidate/src/assets/desktop-wide-layout.css
          ! grep -Fq 'body.surface-home .vf-home-layout' candidate/src/assets/desktop-wide-layout.css
          ! grep -Fq -- '--home-r8-max:1440px' candidate/src/assets/desktop-wide-layout.css
          echo P01_V247251_HOME_WIDE_GRID=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/FunctionalHome.php
          php -l candidate/src/app/bootstrap.php
          echo P01_V247251_SYNTAX=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247251_CANONICAL=PASS

      - name: Prove bounded scope
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
