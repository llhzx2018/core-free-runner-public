name: P01 V2.36.0 Candidate Preparation
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-candidate-prep-20260901.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: 3bf01f97ea4fc7012cc2462643165dc0936e841c
      BASE_PRODUCT_SOURCE: 8b210c93f2d4c71126ff1aed6ec3d317abb51d15
      BASE_PRODUCT_TREE: c08166da380b3a4cae06be0a037f32fa7cf2b91e
      VERSION_NEW: 2.36.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.0-candidate-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Prepare exact versioned candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          test "$(cat product/VERSION)" = "2.35.3"
          test "$(cat product/src/VERSION.txt)" = "2.35.3"
          grep -Fq "define('VF_VERSION', '2.35.3');" product/src/app/bootstrap.php
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('product')
          v=os.environ['VERSION_NEW']
          base=os.environ['BASE']; ps=os.environ['BASE_PRODUCT_SOURCE']; pt=os.environ['BASE_PRODUCT_TREE']
          (root/'VERSION').write_text(v+'\n')
          (root/'src/VERSION.txt').write_text(v+'\n')
          bp=root/'src/app/bootstrap.php'
          s=bp.read_text()
          old="define('VF_VERSION', '2.35.3');"
          new=f"define('VF_VERSION', '{v}');"
          assert s.count(old)==1
          bp.write_text(s.replace(old,new))
          ch=root/'CHANGELOG.md'
          oldc=ch.read_text()
          lines=[
            '## V2.36.0 · Release Candidate · 2026-09-01',
            '',
            '- 收口 V2.35.3 Production 之后完整 L2 Product Optimization：Home / 网址管理 / 后台 Shell / Browser Helper / 五域 Workspace 的日常效率、移动端可达性与状态语义统一。',
            '- Pending 整理、移动分页选择、批量操作状态、筛选/模式切换选择安全、移动触控目标等交互已完成真实 Chromium / SQLite Gate 闭环。',
            '- 新增资源内容类型 / Provider 分离与自动本地封面缓存能力；新增 `ResourceMetadata`、`ResourceCoverCache` 与 `resource-cover-refresh.php`，保持单一 links/Data Authority，不引入第二套资源库。',
            '- Home 与 Workspace 进一步收敛为当前任务/异常/真实资源上下文；Browser Helper 与后台表单/数据安全动态操作完成移动端证据闭环。',
            '- 管理员 / 公开预览 / 匿名三种状态显式分离：管理员可安全“查看公开版”，公开预览按匿名读取权限执行且不泄露 Workspace Payload、CSRF 或私人资源；返回路由使用同站白名单。',
            '- 当前冻结 Product Source=`8b210c93f2d4c71126ff1aed6ec3d317abb51d15` / Product Tree=`c08166da380b3a4cae06be0a037f32fa7cf2b91e`；Schema 保持 `2026082901`，无 Migration。',
            '- Candidate 版本推进为 `2.36.0`；当前仅进入 Formal Release Gate，`main` / Tag / GitHub Release / core-updates / Owner Production 均未修改。',
            '',
          ]
          assert not oldc.startswith('## V2.36.0')
          ch.write_text('\n'.join(lines)+'\n'+oldc)
          p=root/'VF_PROJECT.json'; data=json.loads(p.read_text())
          assert data['production_version']=='2.35.3'
          data['status']='V2.35.3 PRODUCTION CLOSURE PASS / V2.36.0 RELEASE CANDIDATE PREPARATION'
          data['working_version']=v
          data['target_release_version']=v
          data['candidate_version']=v
          data['candidate_schema_version']=data['schema_version']
          data['candidate_state']='V2.36.0 VERSIONED CANDIDATE / FORMAL RELEASE GATE STARTED / NOT RELEASED'
          data['current_phase']='V2.36.0 FORMAL RELEASE GATE / CANDIDATE PREPARATION'
          data['next_action']='Run V2.36.0 Candidate Readiness against the exact versioned candidate. Do not promote main, publish Tag/Release, mutate core-updates or write Owner Production unless subsequent formal gates pass.'
          data['v2_36_0_release_candidate']={
            'base_develop':base,
            'base_product_source':ps,
            'base_product_tree':pt,
            'version':v,
            'schema_version':data['schema_version'],
            'schema_change':False,
            'migration':None,
            'state':'VERSIONED CANDIDATE PREPARATION / NOT RELEASED',
            'main_write':False,
            'production_write':False
          }
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool product/VF_PROJECT.json >/dev/null
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          CHANGELOG.md
          VERSION
          VF_PROJECT.json
          src/VERSION.txt
          src/app/bootstrap.php
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          git -C product commit -m 'release(P01): prepare V2.36.0 candidate'
          git -C product push origin HEAD:release/v2.36.0-candidate-20260901
          printf 'CANDIDATE_SOURCE=%s\nCANDIDATE_TREE=%s\n' "$(git -C product rev-parse HEAD)" "$(git -C product rev-parse HEAD^{tree})"
