name: P05 V1.1.7 Publish Tested FULL

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P05_MAIN_SOURCE: 7d9084d337f3d2eff0d928da31c8a73d250f8714
      VERSION: 1.1.7
      ASSET: VF_SEO_V1.1.7_FULL.zip
    steps:
      - name: Checkout exact P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 7d9084d337f3d2eff0d928da31c8a73d250f8714
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact main
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(cat VERSION)" = "$VERSION"

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install and build formal staging
        working-directory: p05
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          npm run build
          npm run build:php-release
          npm run php:release:gate

      - name: HOME-unset CloudPanel real install
        working-directory: p05
        run: |
          set -euo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh

      - name: Real Chrome final regression
        working-directory: p05
        run: |
          set -euo pipefail
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py

      - name: Deterministic FULL build
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          root=Path('build/vf-seo-php-release')
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0))
                      mode=p.stat().st_mode & 0o777
                      info.external_attr=(mode & 0xFFFF) << 16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../VF_SEO_V1.1.7_FULL.a.zip')
          build('../VF_SEO_V1.1.7_FULL.b.zip')
          PY
          cmp ../VF_SEO_V1.1.7_FULL.a.zip ../VF_SEO_V1.1.7_FULL.b.zip
          mv ../VF_SEO_V1.1.7_FULL.a.zip "../$ASSET"
          rm ../VF_SEO_V1.1.7_FULL.b.zip
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c '%s' "../$ASSET")"
          files="$(find build/vf-seo-php-release -type f | wc -l | tr -d ' ')"
          printf 'P05_VERSION=%s\nP05_SOURCE=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nP05_HOME_UNSET=PASS\nP05_CLOUDFLARE_NOSTORE=PASS\nP05_CHROME=PASS\nPRODUCTION=NOT_DEPLOYED\n' "$VERSION" "$P05_MAIN_SOURCE" "$files" "$bytes" "$sha" > ../VF_SEO_V1.1.7_RELEASE_RECEIPT.txt
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cd p05
          test -f "../$ASSET"
          test -f ../VF_SEO_V1.1.7_RELEASE_RECEIPT.txt
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 1
          fi
          gh release create "v$VERSION" \
            --repo llhzx2018/vf-seo \
            --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.1.7 · CloudPanel FPM Fresh Install Fix' \
            --notes 'Fixes the real CloudPanel PHP-FPM fresh-install failure caused when HOME is cleared. Private state now resolves the effective Unix user home or a per-site fallback, so a recreated site does not inherit the old shared htdocs/.vf-seo-private state. Dynamic setup/auth responses also explicitly opt out of browser/CDN/Cloudflare caching. Verified from exact main with HOME unset, stale shared state present, browser-first setup, administrator login, and real Chrome. Production remains NOT_DEPLOYED.' \
            "../$ASSET" ../VF_SEO_V1.1.7_RELEASE_RECEIPT.txt

      - name: Remote release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          assets={a['name']:a for a in r['assets']}
          a=assets[os.environ['ASSET']]
          assert int(a['size'])==int(os.environ['P05_BYTES'])
          digest=a.get('digest')
          if digest is not None:
              assert digest=='sha256:'+os.environ['P05_SHA256'], (digest,os.environ['P05_SHA256'])
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_ASSET_ID='+str(a['id']))
          print('P05_REMOTE_DIGEST='+str(digest))
          print('P05_V117_RELEASE_REMOTE_READBACK=PASS')
          PY

      - name: Machine receipt
        run: |
          echo 'P05_V117_FORMAL_RELEASE=PASS'
          echo "P05_MAIN_SOURCE=$P05_MAIN_SOURCE"
          echo "P05_FILES=$P05_FILES"
          echo "P05_BYTES=$P05_BYTES"
          echo "P05_SHA256=$P05_SHA256"
          echo 'HOME_UNSET_REAL_INSTALL=PASS'
          echo 'LEGACY_SHARED_STATE_IGNORED=PASS'
          echo 'CLOUDFLARE_NOSTORE=PASS'
          echo 'CHROME_E2E=PASS'
          echo 'PRODUCTION_WRITE=0'
