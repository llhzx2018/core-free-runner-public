name: GOV-DOC P165 delivery contract exact-source proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/owner-gov-p165-proof.yml

permissions:
  contents: read

jobs:
  gov-p165-delivery:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'maintenance/gov-entry-p165-delivery-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_GOV_SHA: b34eef62a601ae7628003cc4ef66ab3eb9850e31
    steps:
      - name: Validate registered scope
        run: |
          test "$EXPECTED_GOV_SHA" = "b34eef62a601ae7628003cc4ef66ab3eb9850e31"
          echo GOV_PROOF_SOURCE=$EXPECTED_GOV_SHA

      - name: Checkout transient private GOV-DOC exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.EXPECTED_GOV_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-transient

      - name: Verify source exactness and run public-safe synthetic fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C gov-transient rev-parse HEAD)"
          test "$actual" = "$EXPECTED_GOV_SHA"
          echo GOV_EXACT_SOURCE_BOUND=YES
          if python3 -B gov-transient/governance/public-authority/tools/public_authority_router_lint.py > "$RUNNER_TEMP/p165-router.log" 2>&1; then
            echo GOV_PUBLIC_AUTHORITY_ROUTER=PASS
          else
            echo GOV_PUBLIC_AUTHORITY_ROUTER=FAIL
            exit 1
          fi
          if PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s gov-transient/governance/public-authority/tests -p 'test_task_delivery_contract_lint.py' -v > "$RUNNER_TEMP/p165-tests.log" 2>&1; then
            grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/p165-tests.log" || true
            echo GOV_DELIVERY_REGRESSIONS=PASS
          else
            grep -E '^(FAIL|ERROR|FAILED|Ran [0-9]+ tests)' "$RUNNER_TEMP/p165-tests.log" || true
            echo GOV_DELIVERY_REGRESSIONS=FAIL
            exit 1
          fi

      - name: Remove transient source and logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-transient
          rm -f "$RUNNER_TEMP/p165-router.log" "$RUNNER_TEMP/p165-tests.log"
          echo GOV_TEMP_PRIVATE_SOURCE_CLEANUP=ATTEMPTED
