name: P01 Missing Credential Real Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-missing-credential-real-gate.yml'
      - 'requests/p01-missing-credential-real-gate-*.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE: e6d71b3309fb24b11139c6febf7dcaf0f9106e87
      VERSION: 2.21.15
    steps:
      - name: Checkout exact Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip php-xml sqlite3 >/dev/null
          php -r 'foreach(["pdo_sqlite","curl","zip"] as $x){if(!extension_loaded($x))exit(1);}echo "RUNTIME=PASS\n";'

      - name: Install exact Candidate without update credential in process
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          rm -rf /tmp/p01-no-token && cp -a candidate/src /tmp/p01-no-token
          env -u VF_PRIVATE_READ_TOKEN php -S 127.0.0.1:18111 -t /tmp/p01-no-token >/tmp/p01-no-token-server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-no-token.cookies http://127.0.0.1:18111/setup.php -o /tmp/p01-no-token-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-no-token-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
          )"
          test -n "$csrf"
          curl -fsS -b /tmp/p01-no-token.cookies -c /tmp/p01-no-token.cookies -X POST http://127.0.0.1:18111/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=P01 Missing Token Gate' \
            --data-urlencode 'admin_password=P01NoToken!22115Runner' \
            --data-urlencode 'admin_password_confirm=P01NoToken!22115Runner' \
            -o /tmp/p01-no-token-result.html
          kill "$pid" || true
          wait "$pid" 2>/dev/null || true
          env -u VF_PRIVATE_READ_TOKEN php /tmp/p01-no-token/cli/verify.php | tee /tmp/p01-no-token-verify.txt
          grep -q 'VERIFY_PASS=YES' /tmp/p01-no-token-verify.txt
          echo 'CANDIDATE_INSTALL=PASS'

      - name: Verify real adapter fails closed without VF_PRIVATE_READ_TOKEN
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-no-token-gate.php <<'PHP'
          <?php
          declare(strict_types=1);
          require '/tmp/p01-no-token/app/bootstrap.php';
          putenv('VF_PRIVATE_READ_TOKEN');
          $u = new VfUpdateManager(vf_db());
          $r = $u->check(false);
          $s = $u->status();
          $encoded = json_encode([$r,$s], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
          if (($r['ok'] ?? true) !== false) { fwrite(STDERR, "check did not fail closed\n".$encoded."\n"); exit(1); }
          if (($s['credential_configured'] ?? true) !== false) { fwrite(STDERR, "credential state is not false\n".$encoded."\n"); exit(2); }
          if (strpos((string)$encoded, 'VF_PRIVATE_READ_TOKEN') === false) { fwrite(STDERR, "missing credential reason not surfaced\n".$encoded."\n"); exit(3); }
          if (!empty($s['can_update'])) { fwrite(STDERR, "can_update must be false\n".$encoded."\n"); exit(4); }
          echo "MISSING_CREDENTIAL_FAIL_CLOSED=PASS\n";
          PHP
          env -u VF_PRIVATE_READ_TOKEN php /tmp/p01-no-token-gate.php

      - name: Summary
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P01_REAL_MISSING_CREDENTIAL_GATE=PASS'
          echo "CANDIDATE_COMMIT=$CANDIDATE"
