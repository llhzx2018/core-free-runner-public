name: P04 V2.8.6 Production UX Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v286-production-ux-candidate.yml'
      - 'requests/p04-v286-production-ux-candidate.txt'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPOSITORY: llhzx2018/vf-infra
      SOURCE_COMMIT: d98c2bc9281f259b6ba9f90855b01e42b73eabb3
      TARGET_VERSION: 2.8.6
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require registered private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'PRIVATE_READ_CHANNEL=PASS'

      - name: Checkout exact P04 candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Setup PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, zip, sodium, pdo_sqlite, sqlite3, fileinfo, mbstring
          ini-file: production

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static and packaging contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          php -l public/index.php >/dev/null
          node --check public/assets/v284-long-action-feedback.js
          node --check public/assets/v286-production-maintenance.js
          python3 -m py_compile scripts/build-release-tree.py scripts/build-v286-update-release.py
          python3 scripts/repository-health-gate.py
          python3 scripts/check-migrations.py
          python3 - <<'PY'
          from pathlib import Path
          index=Path('public/index.php').read_text(encoding='utf-8')
          js=Path('public/assets/v286-production-maintenance.js').read_text(encoding='utf-8')
          css=Path('public/assets/v286-production-maintenance.css').read_text(encoding='utf-8')
          assert 'v286-production-maintenance.css' in index and 'v286-production-maintenance.js' in index
          assert "diagnostics_run" in js and "stopImmediatePropagation" in js and "renderDiagnostics" in js
          assert "data-v271-action" in js and "data-action" in js
          assert '后台自动任务' in js and '日常无需手动操作' in js
          assert 'align-content: start' in css and 'grid-auto-rows: max-content' in css
          print('P04_V286_STATIC_UX_CONTRACT=PASS')
          PY
          rm -rf "$RUNNER_TEMP/v286-runtime" "$RUNNER_TEMP/v286-update-a" "$RUNNER_TEMP/v286-update-b"
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v286-runtime" | tee "$GITHUB_WORKSPACE/release-tree.json"
          jq -e '.version=="2.8.6" and .target_schema==14 and .release_kind=="maintenance_release"' "$RUNNER_TEMP/v286-runtime/release-manifest.json" >/dev/null
          python3 scripts/build-v286-update-release.py --target-runtime "$RUNNER_TEMP/v286-runtime" --output "$RUNNER_TEMP/v286-update-a" | tee "$GITHUB_WORKSPACE/update-build.json"
          python3 scripts/build-v286-update-release.py --target-runtime "$RUNNER_TEMP/v286-runtime" --output "$RUNNER_TEMP/v286-update-b" >/dev/null
          cmp "$RUNNER_TEMP/v286-update-a/VF_Infra_V2.8.6_UPDATE.zip" "$RUNNER_TEMP/v286-update-b/VF_Infra_V2.8.6_UPDATE.zip"
          php "$RUNNER_TEMP/v286-update-a/repair-v2.8.6.php" --self-test | tee "$GITHUB_WORKSPACE/atomic-self-test.txt"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.6 schema=14' "$GITHUB_WORKSPACE/atomic-self-test.txt"
          jq -e '.version=="2.8.6" and .schema==14 and .allowed_source_versions==["2.7.9","2.8.0","2.8.1","2.8.2","2.8.3","2.8.4","2.8.5"] and .diagnostics_result_visible==true and .settings_select_alignment==true and .v271_long_action_bridge==true' "$RUNNER_TEMP/v286-update-a/PACKAGE_MANIFEST.json" >/dev/null
          echo 'P04_V286_PACKAGE_CONTRACT=PASS'

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser regression for owner-reported defects
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          const assert = require('assert');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1366,height:768}});
            await page.route('https://vf.test/**', async route => {
              const u = new URL(route.request().url());
              if (u.pathname.endsWith('/api.php') && u.searchParams.get('action') === 'diagnostics_run') {
                await new Promise(r => setTimeout(r, 350));
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,message:'系统诊断已完成。',diagnostics:{status:'warning',summary:{ok:2,warning:1,blocked:0},checks:[{status:'ok',label:'SQLite 完整性',detail:'ok',next:''},{status:'warning',label:'邮件通知',detail:'未启用',next:'需要邮件提醒时再启用。'},{status:'ok',label:'统一任务调度',detail:'已配置',next:''}]}})});
              }
              return route.fulfill({status:200,contentType:'text/html',body:'<!doctype html><html><body></body></html>'});
            });
            await page.goto('https://vf.test/');
            await page.setContent(`<!doctype html><html><head><meta name="csrf-token" content="test-csrf"></head><body>
              <main>
                <div class="v271-form-grid">
                  <div class="v271-field"><label>时区</label><select id="tz"><option>Asia/Shanghai</option></select><small>数据库继续按 UTC 保存。</small></div>
                  <div class="v271-field"><label>默认币种</label><select id="currency"><option>USD</option></select></div>
                </div>
                <section class="v271-panel" id="auto"><div class="v271-panel-head"><div><h2>自动任务</h2><p class="v271-panel-sub">Cron 仍属于系统能力，不再是一级导航。</p></div></div><div class="v271-detail-list"><div class="v271-detail-item"><span>最近运行</span><strong>—</strong></div><div class="v271-detail-item"><span>锁状态</span><strong>无活动锁</strong></div><div class="v271-detail-item"><span>自动任务入口</span><strong>已配置统一命令</strong></div></div></section>
                <section class="v271-panel" id="diag"><div class="v271-panel-head"><div><h2>诊断</h2><p class="v271-panel-sub">先看是否正常，再看需要 OWNER 做什么。</p></div><span class="v271-status">未知</span></div><div class="v271-settings-summary"><div class="v271-summary-card"><span>正常</span><strong>0</strong></div><div class="v271-summary-card"><span>提醒</span><strong>0</strong></div><div class="v271-summary-card"><span>阻断</span><strong>0</strong></div><div class="v271-summary-card"><span>状态</span><strong><span class="v271-status">未知</span></strong></div></div><div class="v271-form-actions"><button type="button" class="v271-button primary" data-v271-action="diagnostics-run">重新检查系统</button></div><div class="v271-empty">尚未生成诊断结果。</div></section>
              </main></body></html>`);
            await page.addStyleTag({path:path.resolve('source/public/assets/v271-unified-shell.css')});
            await page.addStyleTag({path:path.resolve('source/public/assets/v286-production-maintenance.css')});
            await page.addScriptTag({path:path.resolve('source/public/assets/v284-long-action-feedback.js')});
            await page.addScriptTag({path:path.resolve('source/public/assets/v286-production-maintenance.js')});
            await page.waitForTimeout(80);

            assert.equal(await page.locator('#auto h2').textContent(), '后台自动任务');
            assert.match(await page.locator('#auto .v271-panel-sub').textContent(), /日常无需手动操作/);
            assert.equal(await page.locator('#auto .v271-detail-item').nth(1).locator('strong').textContent(), '当前空闲');
            assert.equal(await page.locator('[data-v271-action="diagnostics-run"]').getAttribute('data-action'), 'diagnostics-run');
            assert.match(await page.locator('.v271-field').nth(1).locator('small').textContent(), /服务商原币种/);

            const tz = await page.locator('#tz').boundingBox();
            const cur = await page.locator('#currency').boundingBox();
            assert(tz && cur);
            assert(Math.abs(tz.y-cur.y) <= 1, `selects not aligned: ${tz.y} vs ${cur.y}`);

            await page.locator('[data-v271-action="diagnostics-run"]').click();
            await page.waitForTimeout(80);
            const busyText = await page.locator('[data-v271-action="diagnostics-run"]').textContent();
            assert.match(busyText, /正在检查系统/);
            await page.waitForSelector('#diag .v271-diagnostic');
            assert.equal(await page.locator('#diag .v271-summary-card').nth(0).locator('strong').textContent(), '2');
            assert.equal(await page.locator('#diag .v271-summary-card').nth(1).locator('strong').textContent(), '1');
            assert.equal(await page.locator('#diag .v271-diagnostic').count(), 3);
            assert.match(await page.locator('#diag').textContent(), /SQLite 完整性/);
            assert.equal(await page.locator('#diag > .v271-empty').count(), 0);
            console.log('P04_V286_BROWSER_OWNER_DEFECTS=PASS');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.6-PRODUCTION-UX-CANDIDATE
          path: |
            release-tree.json
            update-build.json
            atomic-self-test.txt
          if-no-files-found: warn
          retention-days: 30
