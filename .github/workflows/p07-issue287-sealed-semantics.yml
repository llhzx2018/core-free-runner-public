name: P07 Issue287 sealed private excerpt synthetic verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-issue287-sealed-semantics.yml'
permissions:
  contents: read
jobs:
  sealed_semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact P07 product source into temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5b08f30711137c7e6e039962a9b7aef9f3d757e4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: _p07_issue287
      - name: Validate new bounded parser, CLI, package inventory and unsafe cases
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          test "$(git -C _p07_issue287 rev-parse HEAD)" = 5b08f30711137c7e6e039962a9b7aef9f3d757e4
          cd _p07_issue287
          test "$(cat BUILD_ID)" = '0.1.0-release115'
          bash -n bin/vfops-migrate-ui
          python3 -B -m py_compile \
            lib/migration_private_sql_semantics.py \
            lib/migration_private_sql_repro.py \
            lib/server_migration_pull.py \
            scripts/p07_candidate_bundle.py \
            tests/test_issue287_existing_private_semantics.py
          python3 -B -m unittest -q \
            tests.test_issue287_existing_private_semantics \
            tests.test_issue287_private_repro \
            tests.test_migration_safe_session_guard \
            tests.test_p07_fresh_menu \
            tests.test_p07_bundle_identity
          git diff --quiet 02d64a008196ff46d7acb41fde0f4dab1df3c65e..HEAD \
            -- lib/verify.py lib/migration_db_adoption.py \
               lib/migration_sql_failure_retention.py
          echo 'P07_ISSUE287_EXACT_SOURCE_PRIVATE_REPRO_SYNTHETIC_TEST_PASS'
          echo 'P07_REAL_PRIVATE_SQL_NOT_ACCESSED'
          echo 'P07_SERVER_DB_DNS_WRITES_NONE'
      - name: Remove temporary private source
        if: always()
        shell: bash
        run: |
          rm -rf -- _p07_issue287
          echo 'P07_TEMPORARY_CHECKOUT_REMOVED'
