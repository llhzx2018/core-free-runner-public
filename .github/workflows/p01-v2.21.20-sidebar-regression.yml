name: P01 V2.21.20 Sidebar Regression
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-sidebar-regression.yml']
permissions:
  contents: read
jobs:
  sidebar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch maintenance/sidebar-density-2.21.20-20260819 "https://x-access-token:${R}@github.com/llhzx2018/vf-start.git" c
          cd c
          ACTUAL="$(git rev-parse HEAD)"; echo "$ACTUAL" >/tmp/sha
          test "$ACTUAL" = '46a3e2362d3c396e845f20fecd22d5745d728581'
          git rev-parse HEAD^{tree} >/tmp/tree
          find src -type f -name '*.php' -print0|xargs -0 -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0|xargs -0 -n1 node --check >/dev/null
          grep -q 'sidebar-refinement.css?v=22120' src/assets/reference-ui.js
          grep -q 'reference-ui.js?v=22120' src/index.php
      - name: Fresh install
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-sqlite3 sqlite3 >/dev/null
          cp -a c/src /tmp/p
          cd /tmp/p
          php -S 127.0.0.1:18090 -t . >/tmp/p01-22120.log 2>&1 & echo $! >/tmp/pid
          for i in $(seq 1 30);do curl -fsS -c /tmp/c http://127.0.0.1:18090/setup.php -o /tmp/setup&&break||sleep 1;done
          CSRF=$(python3 - <<'PY'
          import re
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/setup').read()).group(1))
          PY
          )
          curl -fsSL -c /tmp/c -b /tmp/c -X POST http://127.0.0.1:18090/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF' --data-urlencode 'admin_password=Runner-P01-22120!Strong' --data-urlencode 'admin_password_confirm=Runner-P01-22120!Strong' >/dev/null
          php cli/verify.php|tee /tmp/verify
          grep -q 'VERIFY_PASS=YES' /tmp/verify
          DB=$(php -r "require 'app/bootstrap.php';echo VF_DB_FILE;")
          test "$(sqlite3 "$DB" 'PRAGMA integrity_check;')" = ok
          test -z "$(sqlite3 "$DB" 'PRAGMA foreign_key_check;')"
          mkdir -p "$RUNNER_TEMP/n";cd "$RUNNER_TEMP/n";npm init -y >/dev/null 2>&1;PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm i --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
      - name: Real Chrome sidebar geometry and interaction
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/n/sidebar.mjs" <<'JS'
          import{chromium}from'playwright-core';
          const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          try{
            const p=await b.newPage({viewport:{width:1319,height:900}}),errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto('http://127.0.0.1:18090/',{waitUntil:'networkidle'});
            await p.click('#loginButton');await p.fill('[name=password]','Runner-P01-22120!Strong');await p.click('#loginSubmit');
            await p.waitForFunction(()=>document.documentElement.dataset.vfReferenceUi==='4'&&!!document.querySelector('link[data-vf-sidebar-refinement]'));
            await p.evaluate(()=>{
              state.categories=[
                {id:100,parent_id:null,name:'账号与网络',description:'x',sort_order:100,legacy_position:1,effective_private:1,is_private:1},
                {id:101,parent_id:100,name:'代理与网络',description:'x',sort_order:90,legacy_position:1,effective_private:1,is_private:1},
                {id:102,parent_id:100,name:'浏览器、设备与环境',description:'x',sort_order:80,legacy_position:2,effective_private:1,is_private:1},
                {id:103,parent_id:100,name:'账号、邮箱与身份管理',description:'x',sort_order:70,legacy_position:3,effective_private:1,is_private:1}
              ];
              state.links=[
                {id:201,title:'One',url:'https://one.example',category_id:101,is_pending:0,is_private:1,effective_private:1,is_favorite:0,sort_order:1,legacy_position:1,click_count:0,tags:[]},
                {id:202,title:'Two',url:'https://two.example',category_id:102,is_pending:0,is_private:1,effective_private:1,is_favorite:0,sort_order:1,legacy_position:1,click_count:0,tags:[]},
                {id:203,title:'Three',url:'https://three.example',category_id:103,is_pending:0,is_private:1,effective_private:1,is_favorite:0,sort_order:1,legacy_position:1,click_count:0,tags:[]}
              ];
              state.sidebarScope='private';state.mode='category';state.selected=102;state.privacyScope='private';state.expanded=new Set([100]);render();
            });
            await p.waitForTimeout(250);
            const q=await p.evaluate(()=>{
              const rows=[...document.querySelectorAll('.category-row--child')],row=rows.find(x=>x.textContent.includes('浏览器、设备与环境')),long=rows.find(x=>x.textContent.includes('账号、邮箱与身份管理'));
              if(!row||!long)throw Error('child row missing');
              const label=row.querySelector('.nav-label'),longLabel=long.querySelector('.nav-label'),count=row.querySelector('.nav-count'),actions=row.querySelector('.category-actions'),sidebar=document.querySelector('.sidebar');
              const rs=getComputedStyle(row),as=getComputedStyle(actions),before=getComputedStyle(row,'::before');
              return {sidebarWidth:sidebar.getBoundingClientRect().width,rowWidth:row.getBoundingClientRect().width,labelWidth:label.getBoundingClientRect().width,labelOverflow:label.scrollWidth-label.clientWidth,longLabelWidth:longLabel.getBoundingClientRect().width,longLabelOverflow:longLabel.scrollWidth-longLabel.clientWidth,countWidth:count?.getBoundingClientRect().width||0,actionsWidth:actions?.getBoundingClientRect().width||0,actionsPosition:as.position,grid:rs.gridTemplateColumns,bg:rs.backgroundColor,railWidth:before.width,docOverflow:Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth)};
            });
            console.log(JSON.stringify(q));
            if(q.sidebarWidth<258||q.sidebarWidth>262)throw Error('sidebar width '+q.sidebarWidth);
            if(q.countWidth>27)throw Error('count slot '+q.countWidth);
            if(q.actionsPosition!=='absolute'||q.actionsWidth>51)throw Error('actions flow '+JSON.stringify(q));
            if(q.labelWidth<145||q.longLabelWidth<145)throw Error('label width '+JSON.stringify(q));
            if(q.labelOverflow>1||q.longLabelOverflow>1)throw Error('common child label truncated '+JSON.stringify(q));
            if(q.bg!=='rgb(247, 247, 247)')throw Error('active background '+q.bg);
            if(parseFloat(q.railWidth)>2.2||parseFloat(q.railWidth)<1.8)throw Error('active rail '+q.railWidth);
            if(q.docOverflow>1)throw Error('desktop overflow '+q.docOverflow);
            const rowSel='.category-row--child.active';
            const beforeHover=await p.$eval(rowSel,e=>({x:e.getBoundingClientRect().x,w:e.getBoundingClientRect().width,count:+getComputedStyle(e.querySelector('.nav-count')).opacity}));
            await p.hover(rowSel);await p.waitForTimeout(180);
            const afterHover=await p.$eval(rowSel,e=>({x:e.getBoundingClientRect().x,w:e.getBoundingClientRect().width,count:+getComputedStyle(e.querySelector('.nav-count')).opacity,more:+getComputedStyle(e.querySelector('.nav-more')).opacity,drag:+getComputedStyle(e.querySelector('.nav-drag')).opacity}));
            if(Math.abs(beforeHover.x-afterHover.x)>.1||Math.abs(beforeHover.w-afterHover.w)>.1)throw Error('hover layout shift');
            if(afterHover.count>.1)throw Error('count did not yield on hover');
            if(afterHover.more<.8)throw Error('more hidden on hover');
            for(const w of [390,480,768,1024,1319,1440]){await p.setViewportSize({width:w,height:900});await p.waitForTimeout(150);let d=await p.evaluate(()=>Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth));if(d>1)throw Error('overflow '+w+':'+d)}
            if(errs.length)throw Error(errs.join('|'));
            console.log('P01_V22120_SIDEBAR_REAL_CHROME=PASS');
          }finally{await b.close()}
          JS
          cd "$RUNNER_TEMP/n";node sidebar.mjs
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          def r(p):
            try:return open(p).read().strip()
            except:return''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','gate':'SIDEBAR_REAL_CHROME','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_sha':r('/tmp/sha'),'source_tree':r('/tmp/tree'),'workflow_run_id':os.environ['RID'],'private_data_persisted_publicly':False};c=json.dumps(q,indent=2)+'\n';t=os.environ['W'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-SIDEBAR-REAL-CHROME.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          body={'message':'evidence(P01): publish V2.21.20 sidebar Chrome regression','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:body['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
      - if: always()
        run: if [ -f /tmp/pid ];then kill $(cat /tmp/pid) 2>/dev/null||true;fi
