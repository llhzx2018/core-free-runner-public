name: S01-C01 v1.35.138 core-updates manifest premerge proof
on:
  push:
    branches: [task/s01-guide-detail-v135138-20261019]
    paths: ['.github/workflows/s01-theme-v135138-manifest-20261019.yml']
permissions:
  contents: read
jobs:
  premerge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 7f588dbc60bf670acb785ea2c155049923bca056
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: Exact manifest source and full registry schema
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 7f588dbc60bf670acb785ea2c155049923bca056
          (cd updates && python3 scripts/check_manifest_contract.py > /tmp/s01-manifest-audit.json)
          python3 - <<'PY'
          import json, pathlib
          z=json.load(open('/tmp/s01-manifest-audit.json'))
          assert z['status']=='PASS',z
          m=json.loads(pathlib.Path('updates/projects/S01-C01.json').read_text())
          assert m['target_version']=='1.35.138'
          assert m['release_tag']=='v1.35.138'
          assert m['asset_name']=='vf-tools-theme_V1.35.138.zip'
          assert m['asset_bytes']==1953931
          assert m['asset_sha256']=='986eea087832d8817501ebfbd5b18f2e96b3b4de13781baa91fe340c61bae7bb'
          assert m['runtime_files']==476
          assert '1.35.137' in m['from_versions']
          assert 'runtime_fingerprint' not in m
          print('CORE_UPDATES_MANIFEST_138_CONTRACT=PASS')
          PY
      - name: Compare manifest to exact published private Release ZIP
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v1.35.138 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.138.zip
          echo '986eea087832d8817501ebfbd5b18f2e96b3b4de13781baa91fe340c61bae7bb  vf-tools-theme_V1.35.138.zip' | sha256sum -c
          test "$(stat -c%s vf-tools-theme_V1.35.138.zip)" = 1953931
          echo 'CORE_UPDATES_PRIVATE_RELEASE_IDENTITY=PASS'
      - name: Cleanup
        if: always()
        run: rm -rf updates vf-tools-theme_V1.35.138.zip
