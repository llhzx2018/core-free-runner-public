name: P05 V1.1.10 Release Closure R2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false

      - name: Checkout exact P05 closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: governance/p05-v1110-release-closure-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p05

      - name: Verify published Release truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00"
          test "$(git -C p05 rev-parse origin/main)" = "5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00"
          gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.10 > /tmp/p05-release.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/p05-release.json'))
          assert r['id'] == 379314813
          assert r['tag_name'] == 'v1.1.10'
          assert r['target_commitish'] == '5fa1a4a80f84201dcc1a4313c8d8d0ace05f3b00'
          assets={a['name']:a for a in r['assets']}
          a=assets['VF_SEO_V1.1.10_FULL.zip']
          rec=assets['VF_SEO_V1.1.10_RELEASE_RECEIPT.txt']
          assert a['id'] == 536734918
          assert a['size'] == 363138
          assert a.get('digest') == 'sha256:16448869130988685c5fadb42f50362dfac08d6b2dd8657394b8a43c7787ba5d'
          assert rec['id'] == 536734919
          print('P05_RELEASE_REMOTE_TRUTH=PASS')
          PY

      - name: Write five-file Current Truth closure
        run: |
          set -euo pipefail
          before="$(sha256sum p05/docs/authority/RELEASE_V1.1.10_CANDIDATE.md | awk '{print $1}')"
          python3 runner/scripts/p05_v1110_release_closure.py p05
          after="$(sha256sum p05/docs/authority/RELEASE_V1.1.10_CANDIDATE.md | awk '{print $1}')"
          test "$before" = "$after"
          python3 -m json.tool p05/VF_PROJECT.json >/dev/null
          test "$(jq -r '.formal_release' p05/VF_PROJECT.json)" = "v1.1.10"
          test "$(jq -r '.formal_release_state' p05/VF_PROJECT.json)" = "RELEASED_CURRENT_MACHINE_PASS_PRODUCTION_NOT_DEPLOYED"
          test "$(jq -r '.production_deployment' p05/VF_PROJECT.json)" = "NOT_DEPLOYED"
          test "$(jq -r '.production_write' p05/VF_PROJECT.json)" = "0"
          git -C p05 diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          README.md
          VF_PROJECT.json
          docs/authority/RELEASE_V1.1.10_CURRENT.md
          docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md
          docs/handoff/CURRENT_STATE.md
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -C p05 diff --name-only -- php src public scripts package.json package-lock.json VERSION 2>/dev/null || true)"
          echo 'P05_RELEASE_CLOSURE_SCOPE=PASS'

      - name: Commit closure branch
        run: |
          set -euo pipefail
          git -C p05 config user.name VictorForge
          git -C p05 config user.email llhzx2018@gmail.com
          git -C p05 add README.md VF_PROJECT.json docs/authority/RELEASE_V1.1.10_CURRENT.md docs/evidence/V1.1.10_FORMAL_RELEASE_20260830.md docs/handoff/CURRENT_STATE.md
          git -C p05 diff --cached --check
          git -C p05 commit -m "governance(P05): close V1.1.10 release truth"
          git -C p05 push origin HEAD:governance/p05-v1110-release-closure-20260830
          echo "P05_RELEASE_CLOSURE_HEAD=$(git -C p05 rev-parse HEAD)"
          echo 'P05_RELEASE_CLOSURE_WRITER=PASS'
