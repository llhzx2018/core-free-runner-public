name: P02 R54 Library Model Native Ownership Write V3

on:
  push:
    branches:
      - run/p02-r54-library-model-native-write

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 2b362241897aae0573986d529c876488651a7695
      EXPECTED_VERSION: 2.5.32
      PORT: '18080'
      V1_RUNNER_REF: a19808d782cc61acaac5b52da1f350eb284ba4b5
      V2_RUNNER_REF: 7ffa07bb26e8e70d2d16c41c9a5e9ee52be1e6b2
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout immutable V1 proof source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ env.V1_RUNNER_REF }}
          persist-credentials: false
          fetch-depth: 1
          path: v1

      - name: Checkout immutable V2 transform source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ env.V2_RUNNER_REF }}
          persist-credentials: false
          fetch-depth: 1
          path: v2

      - name: Replay proven V2 transform
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('v2/.github/workflows/p02-r54-library-model-native-write-v2.yml').read_text(encoding='utf-8').splitlines()
          label='      - name: Replay V1 transform with Python syntax correction'
          start=src.index(label)
          run_i=next(i for i in range(start+1,len(src)) if src[i]=='        run: |')
          end=next(i for i in range(run_i+1,len(src)) if src[i].startswith('      - name: '))
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in src[run_i+1:end])+'\n'
          Path('/tmp/r54-v2-transform.sh').write_text(body,encoding='utf-8')
          PY
          bash /tmp/r54-v2-transform.sh
          echo P02_R54_V3_NATIVE_TRANSFORM=PASS

      - name: Static contracts and repository gates
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          node --check public/assets/app.js
          node --check public/assets/v254-common-branding.js
          php -l public/index.php
          python3 scripts/verify-source-manifest.py
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==68
          assert c['runtime_source_file_count']==68
          for key in ['library_model_convergence_native','v2517_wrapper_block_retired','recent_usage_tracking_native','recent_notebook_time_native']:
              assert c['convergence'][key] is True,key
          print('P02_R54_V3_AUTHORITY=PASS')
          PY
          git diff --check
          echo P02_R54_V3_STATIC_GATES=PASS

      - name: Source Manifest regenerate identity
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r54-v3-manifest.json"
          cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r54-v3-manifest.txt"
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r54-v3-manifest.json"
          cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r54-v3-manifest.txt"
          python3 scripts/verify-source-manifest.py
          echo SOURCE_MANIFEST_JSON_REGEN_IDENTITY=PASS
          echo SOURCE_MANIFEST_TXT_REGEN_IDENTITY=PASS

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Build and boot transformed site
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r54"
          SITE="$RUN_ROOT/site"
          mkdir -p "$RUN_ROOT"
          bash scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 &
          echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$PORT"
          for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          PASSWORD="VF-R54-V3-${GITHUB_RUN_ID}!"
          printf '%s' "$PASSWORD" > "$RUN_ROOT/password"
          curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m: raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")"
          test "$STATUS" = '303'
          echo P02_R54_V3_SITE_READY=PASS

      - name: Existing Chromium regression
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r54"
          VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" \
          VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" \
          VF_UX_E2E_VERSION="$EXPECTED_VERSION" \
          node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R54_V3_STANDARD_CHROMIUM=PASS

      - name: Patched native library model browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('v1/.github/workflows/p02-r54-library-model-native-write.yml').read_text(encoding='utf-8').splitlines()
          label='      - name: Native library model browser proof'
          start=src.index(label)
          run_i=next(i for i in range(start+1,len(src)) if src[i]=='        run: |')
          end=next(i for i in range(run_i+1,len(src)) if src[i].startswith('      - name: '))
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in src[run_i+1:end])+'\n'
          old="""          const recentCopy=await page.evaluate(()=>{state.status='active';state.mode='recent';return modeCopy();});
          assert(recentCopy[1]==='最近打开、阅读、编辑、复制或调用过的资料','recent subtitle not native');
          await page.evaluate(()=>{state.settingsSection='search';renderSettings({scrollTop:0});});
          await page.waitForSelector('#settingsPanel');
          const settingsText=await page.locator('#settingsPanel').innerText();
          """
          new="""          await page.waitForFunction(()=>!state.loading);
          const recentCopy=await page.evaluate(()=>{const prev={mode:state.mode,status:state.status,categoryId:state.categoryId,query:state.query,sort:state.sort,page:state.page};state.status='active';state.mode='recent';const copy=modeCopy();Object.assign(state,prev);return copy;});
          assert(recentCopy[1]==='最近打开、阅读、编辑、复制或调用过的资料','recent subtitle not native');
          await page.waitForTimeout(150);
          await page.evaluate(()=>{state.settingsSection='search';renderSettings({scrollTop:0});});
          await page.waitForFunction(()=>state.mode==='settings'&&Boolean(document.querySelector('#settingsPanel'))&&Boolean(document.querySelector('#settingsForm')));
          const settingsText=await page.locator('#settingsPanel').innerText();
          """
          assert old in body,'R54 V1 proof settings snippet drift'
          body=body.replace(old,new,1)
          Path('/tmp/r54-v3-browser-proof.sh').write_text(body,encoding='utf-8')
          print('R54_V3_SETTINGS_RACE_PATCH=PASS')
          PY
          cd product
          bash /tmp/r54-v3-browser-proof.sh
          echo P02_R54_V3_LIBRARY_MODEL_NATIVE_BROWSER=PASS

      - name: Final verification before develop write
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          python3 scripts/verify-source-manifest.py
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t" >/dev/null; done
          python3 scripts/repository-gates.py >/dev/null
          git diff --check
          echo P02_R54_V3_PREWRITE_VERIFY=PASS

      - name: Commit and push develop only
        working-directory: product
        shell: bash
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add -A
          git commit -m 'refactor(P02): make library model ownership native'
          NEW_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop --depth=1
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git push origin HEAD:refs/heads/develop
          git remote set-url origin 'https://github.com/llhzx2018/vf-library.git'
          echo "P02_R54_V3_NEW_SHA=$NEW_SHA"
          echo P02_R54_V3_DEVELOP_WRITE=PASS

      - name: Boundaries
        if: always()
        shell: bash
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r54"
          if test -f "$RUN_ROOT/php.pid"; then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null || true; fi
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo MAIN_WRITE=NO
          echo RELEASE_WRITE=NO
          echo TAG_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
