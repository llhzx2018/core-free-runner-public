name: P04 VF Infra V2.5.8 Distribution and Production Discovery Readback

on:
  push:
    paths:
      - '.github/workflows/p04-v258-distribution-production-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v258-distribution-production-discovery
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VF_RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      VF_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
      VF_INFRA_SSH_HOST: ${{ secrets.VF_INFRA_SSH_HOST }}
      VF_INFRA_SSH_USER: ${{ secrets.VF_INFRA_SSH_USER }}
      VF_INFRA_SSH_PRIVATE_KEY: ${{ secrets.VF_INFRA_SSH_PRIVATE_KEY }}
      P04_SSH_HOST: ${{ secrets.P04_SSH_HOST }}
      P04_SSH_USER: ${{ secrets.P04_SSH_USER }}
      P04_SSH_PRIVATE_KEY: ${{ secrets.P04_SSH_PRIVATE_KEY }}
      CLOUDPANEL_SSH_HOST: ${{ secrets.CLOUDPANEL_SSH_HOST }}
      CLOUDPANEL_SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
      CLOUDPANEL_SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify V2.5.8 immutable Release and downloadable UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_TOKEN"
          TAG="$RUNNER_TEMP/tag.json"; REL="$RUNNER_TEMP/release.json"; ZIP="$RUNNER_TEMP/VF_Infra_V2.5.8_UPDATE.zip"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-infra/git/ref/tags/v2.5.8 -o "$TAG"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/v2.5.8 -o "$REL"
          python3 - "$TAG" "$REL" <<'PY'
          import json,sys
          tag=json.load(open(sys.argv[1])); rel=json.load(open(sys.argv[2]))
          assert tag['object']['sha']=='4a18a61c21455184c67aa4a3e0957283674ae2d7'
          assert rel['id']==371481567 and rel['tag_name']=='v2.5.8' and rel['name']=='VF Infra V2.5.8'
          a=next(x for x in rel['assets'] if x['name']=='VF_Infra_V2.5.8_UPDATE.zip')
          assert a['id']==517422548 and a['size']==93560
          assert a.get('digest')=='sha256:4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129'
          print('RELEASE_REMOTE_IDENTITY=PASS')
          PY
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/octet-stream' https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/517422548 -o "$ZIP"
          test "$(stat -c %s "$ZIP")" = '93560'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129'
          echo 'UPDATE_DOWNLOAD=PASS'
          echo 'UPDATE_SHA256=PASS'

      - name: Verify core-updates V2.5.8 exact metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN="$VF_READ_TOKEN"; [ -n "$TOKEN" ] || TOKEN="$VF_RELEASE_TOKEN"
          META="$RUNNER_TEMP/p04.json"
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github.raw+json' 'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main' -o "$META"
          python3 - "$META" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['enabled'] is True
          assert d['target_version']=='2.5.8' and d['from_versions']==['2.5.7'] and d['update_type']=='ATOMIC'
          assert d['schema_from']=='14' and d['schema_to']=='14'
          assert d['release_tag']=='v2.5.8' and d['release_id']==371481567
          assert d['release_product_commit']=='4a18a61c21455184c67aa4a3e0957283674ae2d7'
          assert d['release_product_tree']=='89f322a309f8c51c9869864800a6980cb9bfbb94'
          assert d['asset_name']=='VF_Infra_V2.5.8_UPDATE.zip' and d['asset_id']==517422548 and d['asset_bytes']==93560
          assert d['asset_sha256']=='4561bdc3b929e4be58a369cc25335ae4f6c12e9bcde836f7db2fb61eeaa04129'
          assert d['backup_required'] is True and d['rollback_supported'] is True
          print('CORE_UPDATES_REMOTE_IDENTITY=PASS')
          print('DISCOVERY_DISTRIBUTION_METADATA=PASS')
          PY

      - name: Read public Production installed version without authentication or writes
        shell: bash
        run: |
          set -Eeuo pipefail
          HTML="$RUNNER_TEMP/login.html"
          curl -fsSL --max-time 20 'https://infra.kewaro.com/login.php' -o "$HTML"
          grep -Fq 'VF Infra · V2.5.7' "$HTML"
          echo 'PRODUCTION_PUBLIC_INSTALLED_VERSION=2.5.7'
          echo 'PRODUCTION_PUBLIC_READBACK=PASS'
          echo 'PRODUCTION_NETWORK_WRITE=0'

      - name: Probe existing authenticated Production channels without revealing values
        shell: bash
        run: |
          set -Eeuo pipefail
          admin=0; ssh_host=0; ssh_user=0; ssh_key=0; found=0
          for name in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; admin=1; found=1; fi
          done
          for name in VF_INFRA_SSH_HOST P04_SSH_HOST CLOUDPANEL_SSH_HOST PRODUCTION_SSH_HOST; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_host=1; found=1; fi
          done
          for name in VF_INFRA_SSH_USER P04_SSH_USER CLOUDPANEL_SSH_USER PRODUCTION_SSH_USER; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_user=1; found=1; fi
          done
          for name in VF_INFRA_SSH_PRIVATE_KEY P04_SSH_PRIVATE_KEY CLOUDPANEL_SSH_PRIVATE_KEY PRODUCTION_SSH_PRIVATE_KEY; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_key=1; found=1; fi
          done
          if [ "$admin" -eq 1 ]; then echo 'PRODUCTION_ADMIN_CHANNEL=AVAILABLE'; else echo 'PRODUCTION_ADMIN_CHANNEL=NONE'; fi
          if [ "$ssh_host" -eq 1 ] && [ "$ssh_user" -eq 1 ] && [ "$ssh_key" -eq 1 ]; then echo 'PRODUCTION_SSH_CHANNEL=COMPLETE'; else echo 'PRODUCTION_SSH_CHANNEL=INCOMPLETE'; fi
          if [ "$found" -eq 0 ]; then echo 'KNOWN_PRODUCTION_CREDENTIAL_CHANNEL=NONE'; else echo 'KNOWN_PRODUCTION_CREDENTIAL_CHANNEL=AVAILABLE'; fi
          echo 'NO_PRODUCTION_LOGIN_POST_EXECUTED=TRUE'
          echo 'NO_UPDATE_CHECK_POST_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_FILE_WRITE_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_DATABASE_WRITE_EXECUTED=TRUE'
          echo 'NO_PRODUCTION_UPGRADE_EXECUTED=TRUE'
          echo 'NO_SECRET_VALUE_PRINTED=TRUE'
