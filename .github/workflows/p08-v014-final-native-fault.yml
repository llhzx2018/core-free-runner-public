name: P08 v014 FINAL merged-main issued v013 native rollback and SIGKILL recovery 3DB
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v014-final-native-fault.yml
      - scripts/p08_v014_final_native_fault_once.sh
permissions:
  contents: read
jobs:
  three-db-real-native-two-cycle:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v014-final-native-fault-20261120' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: p08-pr83-isolated-only
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-pr83-isolated-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=6s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: p08-pr83-isolated-only
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout temporary public-safe test runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact privately tracked P08 main without persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 6fae792864a594465e4b3224bd6d73abde976f12
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout canonical GOV-DOC full installation gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ec0af1f62f9056e3159c0c1fb2cb65fbc6576683
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP8.4 native database and complete builder dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql,pdo_sqlite,sqlite3,zip,curl,mbstring,openssl,posix,dom,intl,bcmath,fileinfo
          coverage: none
      - name: Node22 for reproducible Vue assets
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install native database dump clients in disposable Ubuntu VM
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
          command -v sqlite3
      - name: Exact v014 final SOURCE issued v013 FULL real rollback and SIGKILL native 3DB
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = 6fae792864a594465e4b3224bd6d73abde976f12
          bash scripts/p08_v014_final_native_fault_once.sh "${{ matrix.kind }}"
      - name: Erase all temporary private source, packages, native DB files and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r131-fault-${{ matrix.kind }}" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-kill"
          test ! -e p08 && test ! -e gov
          test ! -e "$RUNNER_TEMP/p08-r131-fault-${{ matrix.kind }}"
          echo "P08_V014_FINAL_FAULT_${{ matrix.kind }}_PRIVATE_CLEANUP=PASS"
