name: P08 v0.1.12 FINAL native 3DB real inherited v010 Atomic source and rollback
on:
  pull_request:
    paths:
      - .github/workflows/p08-v012-final-native-3db.yml
      - scripts/p08_v012_final_chain.sh
      - scripts/specs/p08-v012-final.json
permissions:
  contents: read
jobs:
  official-full-to-exact-next-atomic:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v012-formal-source-authority-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_BASE010_SHA: ef78dcb21117c822e2756360280f2418f794704f
      P08_FINAL012_SHA: dac7bc1d5410c077f32e522eb5740537f618ef9d
      TARGET_VERSION: '0.1.12'
      TARGET_SHA: dac7bc1d5410c077f32e522eb5740537f618ef9d
      TARGET_TREE: 154c43365b84a85150c6af89770e2116275667c4
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
    steps:
      - name: Checkout exact isolated Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 v0.1.10 candidate without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout exact P08 v0.1.12 DEV candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dac7bc1d5410c077f32e522eb5740537f618ef9d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Audit final one-shot lane target identity (not a Release)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/specs/p08-v012-final.json
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/specs/p08-v012-final.json --input .github/workflows/p08-v012-final-native-3db.yml
          echo P08_R208_FINAL_LANE_TARGET_IDENTITY=PASS
      - name: Checkout canonical Source Current for real FULL structural gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Verify exact current release mode T authority source before native machines
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          test "$(git -C target rev-parse HEAD^{tree})" = 154c43365b84a85150c6af89770e2116275667c4
          test "$(git -C gov rev-parse HEAD)" = 883c92ce1a987b5f6e5729b7b73fd098ffaf14ae
          grep -q '| skill-release | V3.19 |' gov/CURRENT.md
          grep -q '### Mode T ·' gov/skills/skill-release/V3.19/SKILL.md
          grep -q '## RP-07T ·' target/docs/authority/ACCEPTANCE_MATRIX.md
          test "$(cat target/VERSION)" = 0.1.12
          echo P08_R208_FINAL_MAIN_MODE_T_IDENTITY=PASS
      - name: PHP 8.4 locked packages and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native SQL dump and sqlite tools
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
      - name: Verify historical official v0.1.10 and current v0.1.11 identity without modifying channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(cat p08/VERSION)" = 0.1.10
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(git -C p08 rev-parse HEAD^{tree})" = 1c5975bad5b9795998d4afcedec47ba9d52769a4
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.10 --jq .object.sha)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.11 --jq .object.sha)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = 368cc70658048bfe160d498b01f6a585fa0f15a5
          echo P08_R208_ACTUAL_OFFICIAL_HISTORIC_RELEASES=PASS
      - name: Verify real 0.1.9→0.1.10→0.1.12 old-client Atomic and canonical next materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          P08_R187_ISOLATED=YES php p08/tests/test_owner_future_one_click.php
          bash scripts/p08_v012_final_chain.sh ${{ matrix.kind }}
      - name: Destroy all private checkouts and temporary real packages
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 target gov "$RUNNER_TEMP/p08-r208-${{ matrix.kind }}" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-kill"
          test ! -e p08 && test ! -e target && test ! -e gov
