name: P02 V2.5.26 Interaction Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2526-interaction-refresh.yml'
      - 'scripts/p02-v2526-interaction-refresh.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 8f6a6275f69c6bdb01a0a0f557dec875f788545c
    steps:
      - name: Require registered product-read capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_READ_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install PHP and Chromium harness
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact V2.5.26 interaction candidate
        env:
          TEST_PASSWORD: P02-V2526-${{ github.run_id }}!
        run: bash scripts/p02-v2526-interaction-refresh.sh

      - name: Prove protected boundaries
        if: always()
        run: |
          echo PRODUCTION_WRITE=NO
          echo MAIN_PROMOTION=NO
          echo FORMAL_RELEASE=NO
