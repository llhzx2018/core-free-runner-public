name: P02 V2.5.16 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2516-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 71fd40b8e69d21cbdd18ee3f0f92751686b3a960
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.16
        env:
          PRODUCT_REF: 71fd40b8e69d21cbdd18ee3f0f92751686b3a960
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2516-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2516-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.16')
          s=s.replace('2.5.9','2.5.15')
          s=s.replace('32225789953','32247931341')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
          end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.16 is a focused Eye Comfort Surface maintenance release driven by authenticated OWNER long-session reading/editing feedback.\n\n- Replaces large pure-white light-mode canvases with a restrained warm-neutral four-layer surface hierarchy.\n- Light tokens: background #f2f2ef, main surface #fafaf8, soft #f6f6f3, muted #edede9, with softened borders.\n- Applies to the main workspace, sidebar/topbar, content surfaces, Scratch editor, modal/login surfaces without changing product structure or behavior.\n- Dark Mode remains exactly aligned with sealed V2.5.15.\n- Final Candidate Run 32247931341 PASS: 74/74 Source Manifest, Source Exact, build-deploy-tree, real Chromium light-surface verification, no large pure-white tested surfaces, exact dark-mode baseline match, 390px no overflow.\n- Provides the canonical direct Atomic path from authenticated Production {SRCVER} to V{VER}.\n- Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2516-formal.sh"
