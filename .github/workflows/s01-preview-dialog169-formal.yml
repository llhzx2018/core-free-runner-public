name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-preview-dialog169-20261022]
    paths: ['.github/workflows/s01-preview-dialog169-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.169
  TARGET_SHA: ee888dcb308cbc687ae52d33c258cc61a43ee4ee
  TARGET_TREE: aa8294c37bc435460fd03517b4bbad2642f8f3fc
  BASE_SHA: e83159b14373b010f89a5dbedc6f102ab790ccfb
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ee888dcb308cbc687ae52d33c258cc61a43ee4ee
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39737095816 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39737095816 --jq .head_sha)" = 59772cfa7603b8d7cfb85e3703a2bcd0c01468a8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39737095816 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39737095816 --jq .head_sha)" = 59772cfa7603b8d7cfb85e3703a2bcd0c01468a8
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39737095816 --repo llhzx2018/core-free-runner-public --name s01-preview-dialog-39737095816 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/review-before.sha256 candidate-proof/review-after.sha256
          python3 control/lanes/s01-preview-dialog169-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert pathlib.Path('candidate-proof/baseline-regression.txt').read_text().strip()=='BASELINE168_DIALOG_WRONG_LOCALE_REPRODUCED'
          assert pathlib.Path('candidate-proof/chooser-regression.txt').read_text().strip()=='PREVIEW_DIALOG_LANGUAGE_SEARCH_AND_NO_WRITES_PASS'
          clean=json.loads(pathlib.Path('candidate-proof/clean-install.json').read_text())
          assert clean['status']=='PASS' and clean['admin_login']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='383f50900aeb9e006aad98e7b4c8419cb044a0cd08e45031eb9b8fb9bcd54fe3' and new['bytes']==1971830
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.169 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.169 provider/vf-tools-theme_V1.35.169.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.169' --notes '视觉验收：切换前台语言后，页面选择弹窗同步显示和搜索当前语言的真实路径，缺少对应地址时明确说明，不借用其它语言。定向Chromium复现旧版问题并验证修复，真实ZIP安装、168→169升级回退重复安装及受保护数据一致性通过；任务控制、预览链接和历史证据逻辑保持。M3U8维持1.25.94，Production由Owner手工升级，整页视觉验收仍待升级后截图确认。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.169 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.169 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.169 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.169.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.169.zip remote/vf-tools-theme_V1.35.169.zip
          echo '383f50900aeb9e006aad98e7b4c8419cb044a0cd08e45031eb9b8fb9bcd54fe3  remote/vf-tools-theme_V1.35.169.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.169.zip)" = 1971830
          gh release view v1.35.169 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
