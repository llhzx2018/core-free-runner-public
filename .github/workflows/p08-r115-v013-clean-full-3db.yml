name: P08 R115 true v013 clean FULL first-install three database gate
on:
  pull_request:
    paths: [.github/workflows/p08-r115-v013-clean-full-3db.yml]
permissions:
  contents: read
jobs:
  first-install:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pR106SyntheticRootOnly --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
          - {driver: sqlite, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pR106SyntheticRootOnly --silent'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: R106SyntheticRootOnly
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=24
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R115_CLEAN_FULL_ONLY: 'YES'
      P08_R115_DRIVER: ${{ matrix.driver }}
      P08_R115_SOURCE: 5df165b83d2990a7ba4d5771c0cc13b9931bbad9
    steps:
      - name: Exact committed P08 private source checkout into disposable Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 5df165b83d2990a7ba4d5771c0cc13b9931bbad9
          path: p08-next
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Shared public authority structural delivery gate exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 4bac826de506bc2c857cb42cfd9645e70227273b
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 runtime, Composer and required PDO native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Node 22 locked frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source real candidate FULL build and manifest identity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-next rev-parse HEAD)" = "$P08_R115_SOURCE"
          test "$(git -C gov-current rev-parse HEAD)" = '4bac826de506bc2c857cb42cfd9645e70227273b'
          test "$(cat p08-next/VERSION)" = 0.1.3
          php -l p08-next/src/Upgrade/R105OfficialNextRelease.php >/dev/null
          php -l p08-next/src/Upgrade/OwnerReleaseDiscovery.php >/dev/null
          php p08-next/tests/compatibility/r105_official_next_release.php \
            > "$RUNNER_TEMP/r115-readonly-channel-unit.log" 2>&1 || {
              echo R115_FRESH_013_READONLY_CHANNEL_NEGATIVES=FAIL; exit 1;
            }
          grep -Fxq 'R115_CLEAN_013_READONLY_CURRENT_BEHIND_MISSING_BAD_SOURCE=PASS' "$RUNNER_TEMP/r115-readonly-channel-unit.log"
          echo R115_FRESH_013_SOURCE_CHANNEL_NEGATIVE_GATE=PASS
          php -r 'exit(PHP_VERSION_ID>=80401?0:1);'
          target="$RUNNER_TEMP/p08-r115-build"
          mkdir -m 0700 "$target"
          git -C p08-next archive HEAD | tar -x -C "$target"
          cd "$target"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r115-composer.log" 2>&1 || {
            echo R115_LOCKED_COMPOSER_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r115-npm.log" 2>&1 || {
            echo R115_LOCKED_NPM_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r115-npm.log" 2>&1 || {
            echo R115_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r115-full-package.log" 2>&1 || {
          import json,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-next/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          root=Path('p08-next').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r115-build'
          output=Path(os.environ['RUNNER_TEMP'])/'VF_AdOps_V0.1.3_FULL.zip'
          sha=os.environ['P08_R115_SOURCE']
          gov=Path('gov-current').resolve()
          verify_canonical_full_contract(root,output,sha,gov,'resolve')
          receipt=write_full(built,output,'0.1.3',sha)
          verify_canonical_full_contract(root,output,sha,gov,'delivery')
          with zipfile.ZipFile(output) as z:
              manifest=json.loads(z.read('FULL_MANIFEST.json'))
              assert manifest['type']=='CLEAN_FULL_ONLY'
              assert manifest['source_sha']==sha and manifest['target_version']=='0.1.3'
              assert manifest['data_included'] is False
              assert z.read('VERSION')==b'0.1.3\n'
              files=z.namelist()
              assert len(files)==len(set(files))
              assert len(files)>100
              assert not any(f.startswith(('storage/','.git/')) for f in files)
              assert all(not f.startswith('database/') or (f.startswith('database/migrations/') and f.endswith('.php')) for f in files)
              assert '.env' not in files
          print('R115_REAL_SOURCE_FULL_CLEAN_INDEXED=PASS')
          print('R115_FULL_BYTES='+str(receipt['bytes']))
          print('R115_FULL_SHA256='+receipt['sha256'])
          PY
            echo R115_CANDIDATE_FULL_PACKAGE=FAIL
            python3 -B - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r115-full-package.log'
          raw=p.read_text(errors='replace') if p.is_file() else ''
          lines=re.findall(r'File "<stdin>", line ([0-9]{1,3})',raw)
          errors=re.findall(r'(?m)^([A-Za-z]{3,30}(?:Error|Exception))(?::|$)',raw)
          print('R115_SAFE_PYTHON_LINE='+str(lines[-1] if lines else 'NONE'))
          print('R115_SAFE_EXCEPTION_CLASS='+str(errors[-1] if errors else 'NONE'))
          for flag in ['P08_PUBLIC_AUTHORITY_RESOLVE=PASS','P08_PUBLIC_AUTHORITY_DELIVERY=PASS']:
              print('R115_'+flag.split('P08_')[-1]+'='+('YES' if flag in raw else 'NO'))
          PY
            grep -E '^R115_[A-Z0-9_]+=' "$RUNNER_TEMP/r115-full-package.log" | tail -8 || true
            exit 1
          }
          grep -Fxq 'R115_REAL_SOURCE_FULL_CLEAN_INDEXED=PASS' "$RUNNER_TEMP/r115-full-package.log"
          echo R115_EXACT_GIT_COMPOSER_VITE_FULL_SEALED=PASS
      - name: Actual empty-db first Owner install and dirty-db repeat-install denials
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export P08_R115_CLEAN_SITE="$RUNNER_TEMP/p08-r115-clean-$P08_R115_DRIVER"
          export P08_R115_DIRTY_SITE="$RUNNER_TEMP/p08-r115-dirty-$P08_R115_DRIVER"
          for site in "$P08_R115_CLEAN_SITE" "$P08_R115_DIRTY_SITE"; do
            test ! -e "$site"
            mkdir -m 0700 "$site"
            unzip -q "$RUNNER_TEMP/VF_AdOps_V0.1.3_FULL.zip" -d "$site"
            test "$(cat "$site/VERSION")" = 0.1.3
            test ! -e "$site/.env"
            test ! -e "$site/storage/app/private/adops/installation/installed.json"
          done
          php <<'PHP' > "$RUNNER_TEMP/r115-first-install.log" 2>&1 || {
          <?php
          declare(strict_types=1);
          if (PHP_SAPI!=='cli' || getenv('GITHUB_ACTIONS')!=='true'
            || getenv('P08_ISOLATED_INSTALL_TEST')!=='YES'
            || getenv('P08_R115_CLEAN_FULL_ONLY')!=='YES') {
              throw new RuntimeException('R115_NOT_DISPOSABLE');
          }
          $driver=(string)getenv('P08_R115_DRIVER');
          $sha=(string)getenv('P08_R115_SOURCE');
          if (!in_array($driver,['sqlite','mysql','mariadb'],true)
            || !preg_match('/^[a-f0-9]{40}$/D',$sha))throw new RuntimeException('R115_BAD_SOURCE_DRIVER');
          $site=(string)getenv('P08_R115_CLEAN_SITE');
          $dirty=(string)getenv('P08_R115_DIRTY_SITE');
          $temp=(string)getenv('RUNNER_TEMP');
          foreach([$site,$dirty] as $root) {
              if (!str_starts_with($root,$temp.'/p08-r115-')
                  || is_link($root) || !is_dir($root))throw new RuntimeException('R115_BAD_SITE');
              $m=json_decode((string)file_get_contents($root.'/FULL_MANIFEST.json'),true,32,JSON_THROW_ON_ERROR);
              if (($m['source_sha']??null)!==$sha
                  || ($m['target_version']??null)!=='0.1.3'
                  || ($m['data_included']??null)!==false)
                  throw new RuntimeException('R115_FULL_IDENTITY_INVALID');
          }
          $db='p08_r115_'.$driver.'_clean';
          $badDb='p08_r115_'.$driver.'_dirty';
          $dbname=str_repeat('a',32).'.sqlite';
          $badName=str_repeat('b',32).'.sqlite';
          $user='r115_fixture';
          $pwd='R115SyntheticOnlyNoProduction!';
          $password='R115-SyntheticOwnerOnly-2026!';
          if ($driver==='sqlite') {
              foreach([[$site,$dbname],[$dirty,$badName]] as [$root,$f]) {
                  $dir=$root.'/database';
                  if (!is_dir($dir)&&!mkdir($dir,0700,true))throw new RuntimeException('R115_SQLITE_DIR');
                  $path=$dir.'/'.$f;
                  if (file_put_contents($path,'',LOCK_EX)===false || !chmod($path,0600))
                      throw new RuntimeException('R115_SQLITE_FILE');
              }
              $bad=new PDO('sqlite:'.$dirty.'/database/'.$badName);
              $bad->exec('CREATE TABLE owner_sentinel (id INTEGER PRIMARY KEY, token TEXT NOT NULL)');
              $bad->exec("INSERT INTO owner_sentinel VALUES (1,'do-not-delete')");
          } else {
              $admin=new PDO('mysql:host=127.0.0.1;port=3306;charset=utf8mb4','root','R106SyntheticRootOnly',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $admin->exec("CREATE USER '$user'@'%' IDENTIFIED BY '$pwd'");
              foreach([$db,$badDb] as $name) {
                  $admin->exec("CREATE DATABASE `$name` CHARACTER SET utf8mb4");
                  $admin->exec("GRANT ALL PRIVILEGES ON `$name`.* TO '$user'@'%'");
              }
              $bad=new PDO('mysql:host=127.0.0.1;port=3306;dbname='.$badDb,$user,$pwd,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
              $bad->exec('CREATE TABLE owner_sentinel (id INTEGER PRIMARY KEY, token VARCHAR(60) NOT NULL)');
              $bad->exec("INSERT INTO owner_sentinel VALUES (1,'do-not-delete')");
          }
          require_once $site.'/vendor/autoload.php';
          require_once $site.'/src/Support/Autoload.php';
          \VF\AdOps\Installation\SetupGuard::package($site);
          \VF\AdOps\Installation\SetupGuard::package($dirty);
          $_SERVER['HTTPS']='on';
          $_SERVER['HTTP_HOST']='r115-isolated.example';
          $common=[
              'site_name'=>'R115 first install',
              'owner_username'=>'r115_owner',
              'owner_email'=>'r115@isolated.example',
              'owner_password'=>$password,'owner_confirm'=>$password,
              'db_driver'=>$driver,'github_token_later'=>'1','github_read_token'=>'',
          ];
          $opts=$driver==='sqlite'?['db_database'=>$dbname]:[
              'db_host'=>'127.0.0.1','db_port'=>'3306','db_database'=>$db,
              'db_username'=>$user,'db_password'=>$pwd,
          ];
          $badOpts=$driver==='sqlite'?['db_database'=>$badName]:[
              'db_host'=>'127.0.0.1','db_port'=>'3306','db_database'=>$badDb,
              'db_username'=>$user,'db_password'=>$pwd,
          ];
          $installer=new \VF\AdOps\Installation\OwnerWebInstaller();
          try{
              $installer->install([...$common,...$badOpts],$dirty);
              throw new RuntimeException('R115_DIRTY_ACCEPTED');
          }catch(RuntimeException $e){
              if ($e->getMessage()!=='SETUP_DIRTY_DATABASE_REJECTED')throw $e;
          }
          if (file_exists($dirty.'/.env')
              || file_exists($dirty.'/storage/app/private/adops/installation/installed.json')
              || $bad->query('SELECT token FROM owner_sentinel WHERE id=1')->fetchColumn()!=='do-not-delete') {
              throw new RuntimeException('R115_DIRTY_CHANGED');
          }
          echo 'R115_DIRTY_DATABASE_REFUSED_WITHOUT_WRITING=PASS'.PHP_EOL;
          $answer=$installer->install([...$common,...$opts],$site);
          if (($answer['status']??null)!=='INSTALLED'
              || ($answer['github_credential']??null)!=='UPDATE_AUTH_NOT_CONFIGURED')
              throw new RuntimeException('R115_REAL_FIRST_INSTALL_FAILED');
          $dsn=$driver==='sqlite'
              ? 'sqlite:'.$site.'/database/'.$dbname
              : 'mysql:host=127.0.0.1;port=3306;dbname='.$db.';charset=utf8mb4';
          $dbConn=new PDO($dsn,$driver==='sqlite'?null:$user,$driver==='sqlite'?null:$pwd,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          if ((int)$dbConn->query('SELECT COUNT(*) FROM migrations')->fetchColumn()!==15
              || (int)$dbConn->query('SELECT COUNT(*) FROM users')->fetchColumn()!==1)
              throw new RuntimeException('R115_OWNER_SCHEMA_INVALID');
          $owner=$dbConn->query('SELECT name,email,password FROM users LIMIT 1')->fetch(PDO::FETCH_ASSOC);
          if (($owner['name']??null)!=='r115_owner'
              || ($owner['email']??null)!=='r115@isolated.example'
              || !password_verify($password,(string)($owner['password']??'')))
              throw new RuntimeException('R115_OWNER_HASH_INVALID');
          require_once getenv('GITHUB_WORKSPACE').'/p08-next/tests/compatibility/r101_complete_schema.php';
          r101CompleteSchemaAfterOwnerInstall($driver);
          $receipt=json_decode((string)file_get_contents($site.'/storage/app/private/adops/installation/installed.json'),true,32,JSON_THROW_ON_ERROR);
          if (($receipt['project_id']??null)!=='P08' || ($receipt['status']??null)!=='INSTALLED'
              || ($receipt['database_driver']??null)!==$driver
              || ($receipt['domain']??null)!=='r115-isolated.example'
              || !is_file($site.'/.env')
              || file_exists($site.'/storage/app/private/adops/upgrade/github-read-token'))
              throw new RuntimeException('R115_INSTALL_IDENTITY_OR_TOKEN');
          $ownerId=(string)($receipt['owner_id']??'');
          $current=(new \VF\AdOps\Upgrade\OwnerReleaseDiscovery())
              ->check($site,$ownerId);
          if ($current!==[
              'status'=>'GITHUB_TOKEN_NOT_CONFIGURED','can_install'=>false
          ]) throw new RuntimeException('R115_FRESH_013_POSTINSTALL_UPDATE_CHECK_FAILED');
          echo 'R115_FRESH_013_UPDATE_PANEL_NO_TOKEN_READONLY=PASS'.PHP_EOL;
          $envHash=hash_file('sha256',$site.'/.env');
          try{
              $installer->install([...$common,...$opts],$site);
              throw new RuntimeException('R115_REINSTALL_ACCEPTED');
          }catch(RuntimeException $e){
              if ($e->getMessage()!=='SETUP_ALREADY_STARTED_OR_INSTALLED')throw $e;
          }
          if (hash_file('sha256',$site.'/.env')!==$envHash
              || (int)$dbConn->query('SELECT COUNT(*) FROM users')->fetchColumn()!==1
              || (int)$dbConn->query('SELECT COUNT(*) FROM migrations')->fetchColumn()!==15)
              throw new RuntimeException('R115_REINSTALL_CHANGED');
          echo 'R115_REAL_FRESH_'.strtoupper($driver).'_OWNER_15_MIGRATIONS=PASS'.PHP_EOL;
          echo 'R115_REINSTALL_REFUSED_AND_ORIGINAL_DATA_KEPT=PASS'.PHP_EOL;
          PHP
            echo R115_CLEAN_FULL_OWNER_INSTALL=FAIL
            grep -E '^R115_[A-Z0-9_]+=' "$RUNNER_TEMP/r115-first-install.log" | tail -15 || true
            exit 1
          }
          driver_upper="$(printf '%s' "$P08_R115_DRIVER" | tr '[:lower:]' '[:upper:]')"
          grep -Fxq "R115_REAL_FRESH_${driver_upper}_OWNER_15_MIGRATIONS=PASS" "$RUNNER_TEMP/r115-first-install.log"
          grep -Fxq 'R115_REINSTALL_REFUSED_AND_ORIGINAL_DATA_KEPT=PASS' "$RUNNER_TEMP/r115-first-install.log"
          grep -Fxq 'R115_FRESH_013_UPDATE_PANEL_NO_TOKEN_READONLY=PASS' "$RUNNER_TEMP/r115-first-install.log"
          grep -Fxq 'R115_DIRTY_DATABASE_REFUSED_WITHOUT_WRITING=PASS' "$RUNNER_TEMP/r115-first-install.log"
          echo "R115_REAL_CANDIDATE_FRESH_THREE_DB_${driver_upper}=PASS"
      - name: Always securely purge private source and real candidate ZIP
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-next gov-current "$RUNNER_TEMP/p08-r115-build"
          rm -rf -- "$RUNNER_TEMP"/p08-r115-clean-* "$RUNNER_TEMP"/p08-r115-dirty-*
          rm -f -- "$RUNNER_TEMP/VF_AdOps_V0.1.3_FULL.zip" "$RUNNER_TEMP"/r115-*.log
          echo R115_PRIVATE_SOURCE_CANDIDATE_ARCHIVE_AND_DBS_PURGED=YES
