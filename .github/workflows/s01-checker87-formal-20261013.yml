name: S01 M3U8 exact candidate gated private formal release
on:
  push:
    branches: [task/s01-checker87-formal-20261013]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-m3u8'
      TARGET_VERSION: '1.25.87'
      TARGET_SHA: '1037bed03dac982570f0d68e74d08ce83414ec29'
      TARGET_TREE: '752863eb781963fb5be60827e88b0904cbb30736'
      TARGET_MAIN_SHA: '7a015935fbc6a0b621e6537a0c1ecb722ffa9382'
      SOURCE_VERSION: '1.25.86'
      BASE_SHA: '4a3f738b1babbfbf74e0589dca825a9daccb7cc2'
      M3_BASE_SHA: '4a3f738b1babbfbf74e0589dca825a9daccb7cc2'
      FIXTURE_THEME_SHA: '029439879c817c505d8d6049ee58e6c49b7196cf'
      FIXTURE_THEME_TREE: '210ac8321f2a59669d955c33147cc5b54f1ea9cb'
      CANDIDATE_RUN: '38329530371'
      CANDIDATE_SHA: '82877ac0edf12209d7b52d71bf23cf9fddc2b3de'
      CANDIDATE_ARTIFACT: '11782059606'
      CANDIDATE_DIGEST: 'sha256:45cf3c46c219db6739818969760d5381d0410c3add57ddb47dc3c77002a904ed'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker87-formal-20261013/spec.json --template runner/lanes/s01-checker87-formal-20261013/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-checker87-formal-20261013.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker87-formal-20261013/spec.json --input runner/.github/workflows/s01-checker87-formal-20261013.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-checker87-formal-20261013 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic rebuild and tested asset equality
        run: bash lane/build.sh
      - name: Publish authorized M3U8 formal release and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: checker87-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['m3u8-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PUBLIC_SAFE_FORMAL_RECEIPT',json.dumps({'status':'PASS','artifact_id':m['id'],'bytes':len(b),'digest':m['digest'],'run_id':os.environ['GITHUB_RUN_ID']}))
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip


