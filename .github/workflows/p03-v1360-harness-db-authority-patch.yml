name: P03 V1.36.0 Harness Authoritative SQLite Patch
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: 233bbe51e904bd614ba1d32cad2c21b1e816e062
    steps:
      - name: Patch exact private harness DB authority selector
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/integration/v1360_formal_runtime_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='DB=$(find "$DATA_ROOT" -type f -name \'*.sqlite\' -print -quit); test -n "$DB"; export DB'
          new='''DB=''
          while IFS= read -r CANDIDATE_DB; do
            HAS_SCHEMA=$(sqlite3 "$CANDIDATE_DB" "SELECT count(*) FROM sqlite_master WHERE type='table' AND name='schema_migrations';" 2>/dev/null || true)
            if [ "$HAS_SCHEMA" = '1' ]; then
              CANDIDATE_SCHEMA=$(sqlite3 "$CANDIDATE_DB" 'select max(version) from schema_migrations;' 2>/dev/null || true)
              if [ "$CANDIDATE_SCHEMA" = '30' ]; then DB="$CANDIDATE_DB"; break; fi
            fi
          done < <(find "$DATA_ROOT" -type f -name '*.sqlite' -print)
          test -n "$DB"; export DB'''
          assert s.count(old)==1, 'DB_AUTHORITY_ANCHOR_MISMATCH'
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          test "$(git status --short | wc -l)" -eq 1
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add tests/integration/v1360_formal_runtime_gate.sh
          git commit -m 'test(v1.36.0): select authoritative Schema30 fixture database'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
