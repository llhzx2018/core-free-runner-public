name: S01-C02 V9 Batch 1 Three Surfaces

on:
  push:
    branches:
      - task/s01-c02-v9-batch1-three-surfaces
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: fc0fa42c9f8991c8ebf88f1b4a4e91c37bcec363
  BASE_SHA: 1da9b3bf153f95b477a3c90f1e3eeef3bf948d1f

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact source and frozen boundary
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git diff --name-only "$BASE_SHA..$TARGET_SHA" | tee /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          expected={
            'assets/css/current/admin-s01-tools-r15.css',
            'assets/css/v13/seo/links-redirects.css',
            'assets/css/v13/system/integrations.css',
            'includes/admin-v13/views/integrations.php',
            'includes/admin-v13/views/seo_links_redirects.php',
            'includes/s01/tool-workbench.php',
            'tests/s01-c02-v9-batch1-body-contract.php',
            'tests/s01-c02-v9-batch1-browser-proof.js',
          }
          if changed != expected: raise SystemExit('changed set mismatch: '+repr(sorted(changed)))
          bad=[p for p in changed if any(x in p.lower() for x in ('shell','header-menu','header_menu','global-header','admin-shell'))]
          if bad: raise SystemExit('frozen shell/header/menu touched: '+repr(bad))
          print('EXACT_SOURCE=PASS')
          print('FROZEN_SHELL_HEADER_MENU_BOUNDARY=PASS')
          PY

      - name: Syntax and contracts
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l includes/s01/tool-workbench.php
          php -l includes/admin-v13/views/integrations.php
          php -l includes/admin-v13/views/seo_links_redirects.php
          php -l tests/s01-c02-v9-batch1-body-contract.php
          node --check tests/s01-c02-v9-batch1-browser-proof.js
          php tests/s01-c02-v9-batch1-body-contract.php
          php tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php tests/s01-c02-prod-realuse-r18-unified-page-frame-contract.php
          php tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php
          php tests/s01-c02-page-body-system-v2-full-surface-contract.php
          php tests/s01-c02-121904-tools-r15-contract.php || true
          echo "SOURCE_REGRESSION=PASS"

      - name: Browser dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v9-node
          cd /tmp/v9-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install chromium >/dev/null
          echo "NODE_PATH=/tmp/v9-node/node_modules" >> "$GITHUB_ENV"

      - name: Real-width source-render proof
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          export V9_PROOF_DIR=/tmp/v9-batch1-proof
          node tests/s01-c02-v9-batch1-browser-proof.js | tee /tmp/v9-batch1-output.txt
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/v9-batch1-proof/browser-proof.json'))
          assert p['pass'] is True
          assert len(p['checks']) == 18
          assert all(not x['failures'] for x in p['checks'])
          assert all(not x['overflow'] for x in p['checks'])
          assert p['owner_product_pass'] is False
          print('REAL_WIDTH_18=PASS')
          PY

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v9-batch1-proof-${{ github.run_id }}
          path: /tmp/v9-batch1-proof
          retention-days: 14
          if-no-files-found: warn
