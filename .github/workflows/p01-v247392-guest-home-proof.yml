name: P01 V2.47.392 scoped guest-home CSS proof (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247392-guest-home-proof.yml'
permissions:
  contents: read
jobs:
  scoped-guest-home:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Transient exact P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 8a35500186ef2f2cdf03fcf4a90439e9552846e3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Candidate identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "8a35500186ef2f2cdf03fcf4a90439e9552846e3"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.392"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "2.47.392"
          grep -Fq "define('VF_VERSION', '2.47.392')" src/app/bootstrap.php
          php -l src/index.php >/dev/null
          php -l tests/integration/p01_public_home_layout_acceptance.php >/dev/null
          node --check src/assets/surface-home.js
          echo P01_V247392_EXACT_SOURCE_LINT=PASS
      - name: Focused public Home and inherited shell regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/p01_public_home_layout_acceptance.php
          php tests/unit/brand_shell_r79_contract.php
          php tests/unit/full_product_action_density_r3_contract.php
          php tests/unit/public_home_owner_shell_unified_v247390_contract.php
          php tests/unit/public_home_visitor_discovery_v247390_contract.php
          echo P01_V247392_HOME_FOCUSED_TESTS=PASS
      - name: CSS guest-only scope and breakpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/assets/uxui-home-root.css').read_text()
          h=Path('src/index.php').read_text()
          assert s.count('{')==s.count('}')
          assert 'body.vf-public-home.vf-workspace-page .vf-shell-main.vf-public-home-main{' in s
          assert 'body.vf-public-home .vf-public-home-hero{\n  max-width:none!important;' in s
          assert 'width:var(--vf-wide-shell)!important;' in s
          assert '@media(max-width:620px)' in s
          assert "if (vf_is_admin()) { require __DIR__ . '/home.php'; exit; }" in h
          assert h.count('class="vf-public-home-path"')==3
          print('P01_V247392_GUEST_ONLY_CSS_SCOPE=PASS')
          PY
