name: P01 V2.36.5 Formal Bind Gate
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-formal-bind-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE: 57d99978340a45cd7673c6d0943137e6437aae51
      CANDIDATE_TREE: 4517a92885e5fe4db42ba5b23bdcfbc712940be2
      RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      READINESS_RUN: '33547215072'
      READINESS_ARTIFACT: '9815966257'
      READINESS_DIGEST: sha256:a0544bd418a03e4feeb95b1aea635b7a4bad4e0ae3ae969ef2c8ce075f49a5e3
      FORMAL_BRANCH: release/v2.36.5-formal-source-20260902
    steps:
      - name: Verify Candidate Readiness R2 authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_RUN)
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = 3e2cb71cb3cda043e40146fa16dd6e87d61cdc8f
          art_json=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$READINESS_ARTIFACT)
          test "$(jq -r .workflow_run.id <<<"$art_json")" = "$READINESS_RUN"
          test "$(jq -r .digest <<<"$art_json")" = "$READINESS_DIGEST"
          test "$(jq -r .expired <<<"$art_json")" = false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Bind exact Candidate PASS and push isolated Formal Source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test -z "$(git ls-remote --heads origin "refs/heads/$FORMAL_BRANCH")"
          test -z "$(git ls-remote --tags origin refs/tags/v2.36.5)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text())
          if d.get('candidate_version')!='2.36.5' or d.get('production_version')!='2.36.4': raise SystemExit('candidate/production version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          c=d.get('v2_36_5_release_candidate') or {}
          if c.get('unknown_runtime_bytes')!=0: raise SystemExit('unknown runtime byte drift')
          c.update({
            'candidate_source':'57d99978340a45cd7673c6d0943137e6437aae51',
            'candidate_tree':'4517a92885e5fe4db42ba5b23bdcfbc712940be2',
            'candidate_runtime_tree':'a7f472ec1f449ada1152d271f2723c52e7b58144',
            'candidate_readiness_gate':33547215072,
            'candidate_readiness_artifact':9815966257,
            'candidate_readiness_artifact_digest':'sha256:a0544bd418a03e4feeb95b1aea635b7a4bad4e0ae3ae969ef2c8ce075f49a5e3',
            'candidate_readiness_r1_gate':33546946198,
            'candidate_readiness_r1_classification':'HARNESS_ONLY / SHELL VARIABLE INTERPOLATION',
            'state':'CANDIDATE READINESS R2 PASS / FORMAL BIND GATE',
            'main_write':False,
            'core_updates_write':False,
            'owner_production_write':False,
          })
          d['v2_36_5_release_candidate']=c
          d['status']='V2.36.4 OWNER PRODUCTION / PUBLISHED / V2.36.5 FORMAL CANDIDATE'
          d['current_phase']='V2.36.5 CANDIDATE READINESS R2 PASS / FORMAL BIND GATE'
          d['candidate_state']='CANDIDATE READINESS R2 PASS / FORMAL SOURCE BINDING'
          d['formal_release_state']='V2.36.4 PUBLISHED + OWNER PRODUCTION / V2.36.5 CANDIDATE PASS / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.4 / Published Latest V2.36.4 / V2.36.5 Candidate Readiness R2 PASS / Formal Source binding'
          d['next_action']='Run V2.36.5 Formal Artifact Gate from immutable Formal Source. No main, Tag, Release, core-updates or Owner Production write before subsequent gates pass.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = VF_PROJECT.json
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = VF_PROJECT.json
          git commit -m 'release(P01): bind V2.36.5 candidate PASS'
          FORMAL=$(git rev-parse HEAD)
          FORMAL_TREE=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = VF_PROJECT.json
          printf 'P01_V2365_FORMAL_BIND=PASS\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nPARENT=%s\nREADINESS_RUN=%s\nREADINESS_ARTIFACT=%s\nREADINESS_DIGEST=%s\nMAIN_WRITE=NO\nTAG_RELEASE_WRITE=NO\nCORE_UPDATES_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$RUNTIME_TREE" "$CANDIDATE" "$READINESS_RUN" "$READINESS_ARTIFACT" "$READINESS_DIGEST" | tee /tmp/p01-v2365-formal-bind.txt
          git push origin HEAD:"refs/heads/$FORMAL_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$FORMAL_BRANCH" | awk '{print $1}')" = "$FORMAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2365-formal-bind.txt
          if-no-files-found: error
          retention-days: 90
