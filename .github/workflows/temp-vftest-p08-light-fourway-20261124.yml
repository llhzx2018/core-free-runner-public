name: TEMP VF测试 P08 independent PHP Vue security light lane
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-vftest-p08-light-fourway-20261124.yml'
permissions:
  contents: read
concurrency:
  group: vftest-p08-light-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.17'
  TARGET_SHA: 42bc1199835789aa55a7f5f60383a1270e2e15e5
  TEST_PROJECT: P08
  TEST_LANE: VFTEST_P08_LIGHT_20261124
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/vftest-p08-light-fourway-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit independent P08 lane source and run inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/vftest-p08-light-fourway-20261124.json --input .github/workflows/temp-vftest-p08-light-fourway-20261124.yml
          echo 'VFTEST_P08_LANE_IDENTITY=PASS'
  php-light:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/vftest-p08-light-fourway-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Transient exact private P08 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-p08-vftest
          persist-credentials: false
      - name: PHP 8.4 runtime and SQLite in-memory test extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Verify exact P08 SHA and lint PHP/stack
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-p08-vftest
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          python3 scripts/check_stack_contract.py --phase foundation > "$RUNNER_TEMP/p08-vftest-foundation.log" 2>&1 || { echo VFTEST_P08_FOUNDATION=FAIL; exit 1; }
          find app bootstrap config database public routes src tests -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l > "$RUNNER_TEMP/p08-vftest-php-lint.log" 2>&1 || { echo VFTEST_P08_PHP84_SYNTAX=FAIL; exit 1; }
          checked="$(grep -c '^No syntax errors detected in ' "$RUNNER_TEMP/p08-vftest-php-lint.log" || true)"
          test "$checked" -gt 100 || { echo VFTEST_P08_PHP84_FILE_COVERAGE=FAIL; exit 1; }
          echo "VFTEST_P08_PHP84_SYNTAX=PASS checked=$checked"
          echo 'VFTEST_P08_STACK_FOUNDATION=PASS'
      - name: Composer frozen dependencies and synthetic local PHP security regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-p08-vftest
          composer install --no-interaction --no-progress --prefer-dist --no-scripts > "$RUNNER_TEMP/p08-vftest-composer.log" 2>&1 || { echo VFTEST_P08_COMPOSER_LOCKED_INSTALL=FAIL; exit 1; }
          echo VFTEST_P08_COMPOSER_LOCKED_INSTALL=PASS
          php tests/run.php > "$RUNNER_TEMP/p08-vftest-core.log" 2>&1 || { echo VFTEST_P08_CORE_PHP_UNIT=FAIL; exit 1; }
          echo VFTEST_P08_CORE_PHP_UNIT=PASS
          for test in tests/test_setup_guard.php tests/test_stable_runtime_gateway.php tests/test_maintenance_gate.php; do
            php "$test" >> "$RUNNER_TEMP/p08-vftest-security.log" 2>&1 || { echo VFTEST_P08_LOCAL_SECURITY_REGRESSIONS=FAIL; exit 1; }
          done
          echo VFTEST_P08_LOCAL_SECURITY_REGRESSIONS=PASS
      - name: Real Laravel HTTP guest/Inertia access and in-memory integrated business feature
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-p08-vftest
          export APP_ENV=testing APP_KEY=base64:VFRlc3RFeGFtcGxlS2V5VFRlc3RFeGFtcGxlS2V5
          export DB_CONNECTION=sqlite DB_DATABASE=:memory: CACHE_STORE=array SESSION_DRIVER=array
          vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Feature/WorkspaceInertiaTest.php > "$RUNNER_TEMP/p08-vftest-http-guest.log" 2>&1 || { echo VFTEST_P08_GUEST_HTTP_INERTIA_AUTH=FAIL; exit 1; }
          echo VFTEST_P08_GUEST_HTTP_INERTIA_AUTH=PASS
          vendor/bin/phpunit --bootstrap vendor/autoload.php tests/Feature/R101IntegratedWorkspaceTest.php > "$RUNNER_TEMP/p08-vftest-http-integration.log" 2>&1 || { echo VFTEST_P08_SYNTHETIC_API_WORKSPACE=FAIL; exit 1; }
          echo VFTEST_P08_SYNTHETIC_API_WORKSPACE=PASS
          echo VFTEST_P08_REAL_AD_ACCOUNTS_TRACKER_TOKENS=NOT_USED
      - name: Cleanup PHP private worktree and local logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08-vftest
          rm -f -- "$RUNNER_TEMP"/p08-vftest-*.log
          test ! -e private-p08-vftest || exit 1
          echo VFTEST_P08_PHP_PRIVATE_WORKSPACE_CLEANUP=PASS
  vue-light:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/vftest-p08-light-fourway-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Transient exact private P08 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-p08-vftest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact P08 SHA, frozen npm tree, Vue TypeScript and unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd private-p08-vftest
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-vftest-npm.log" 2>&1 || { echo VFTEST_P08_NPM_LOCKED_INSTALL=FAIL; exit 1; }
          echo VFTEST_P08_NPM_LOCKED_INSTALL=PASS
          npm run typecheck > "$RUNNER_TEMP/p08-vftest-typecheck.log" 2>&1 || { echo VFTEST_P08_VUE_TYPESCRIPT=FAIL; exit 1; }
          echo VFTEST_P08_VUE_TYPESCRIPT=PASS
          npm run build > "$RUNNER_TEMP/p08-vftest-vite.log" 2>&1 || { echo VFTEST_P08_VITE_BUILD=FAIL; exit 1; }
          test -s public/build/manifest.json || { echo VFTEST_P08_VITE_MANIFEST=FAIL; exit 1; }
          echo VFTEST_P08_VITE_BUILD=PASS
          npm run test:unit > "$RUNNER_TEMP/p08-vftest-vitest.log" 2>&1 || { echo VFTEST_P08_VITEST_UNIT=FAIL; exit 1; }
          echo VFTEST_P08_VITEST_UNIT=PASS
          echo VFTEST_P08_BROWSER_E2E_HEAVY=NOT_RUN
      - name: Remove generated Vue build outputs from isolated workspace
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08-vftest
          rm -f -- "$RUNNER_TEMP"/p08-vftest-*.log
          test ! -e private-p08-vftest || exit 1
          echo VFTEST_P08_VUE_PRIVATE_WORKSPACE_CLEANUP=PASS
