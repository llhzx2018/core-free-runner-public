name: P07 release90 exact formal publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release90-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release90
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc59
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release90'
          test "$(cat "$care/VERSION")" = '0.1.0-rc59'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 1d1653f7d9864cbfc4d54cd4ac79e935ac5e7b68
          test "$(git hash-object "$root/MANIFEST.gitblob")" = 73446d9ece4050e05c4b1fedd7d51fbf30992f5f
          test "$(git hash-object "$care/MANIFEST.gitblob")" = b5897e6c3eee8e3f3a9e511435279991175235a9
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = fa980ecd4912b69f18223883c9ba25a42855e80a
          test "$(git hash-object installers/p07.sh)" = 07d3a3106016450e3415a19e8945095683e12e55
          test "$(git hash-object installers/p07-toolbox.sh)" = e585f05814d81724f55e7b0165109b48a922ae1f
          test "$(git hash-object installers/p07-system-care.sh)" = b1f71ca37ac5a89f3edd7e099e9761caa7daac41
          grep -Fq 'EXPECTED_BLOB="fa980ecd4912b69f18223883c9ba25a42855e80a"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release90"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="1d1653f7d9864cbfc4d54cd4ac79e935ac5e7b68"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release90"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc59"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='b5897e6c3eee8e3f3a9e511435279991175235a9'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE90_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release90 · 正式网站数据工具与 System Care rc59' \
              --notes 'P07 release90 / System Care rc59. Exact private P07 source 9b33fd41c2493881e51026cbc46e7ca2add11c1a (merged main 270de10af5240ca80c2fb8076fa1672c4671bf27, identical Git tree); registered Public Runner 147/147 regression tests PASS including CloudPanel master root 1045 and live MariaDB PID/socket fail-closed identity, immutable candidate proof, isolated clean install / release89 upgrade / idempotence / corruption rejection / rollback PASS. Production CP2 upgrade and real CP-to-CP2 migration NOT_RUN; old CP and DNS untouched.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE90_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release90-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release90-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release90-assets/$name"
            test "$(git hash-object "/tmp/p07-release90-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE90_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 07d3a3106016450e3415a19e8945095683e12e55' 'installers/p07-final.sh fa980ecd4912b69f18223883c9ba25a42855e80a' 'installers/p07-toolbox.sh e585f05814d81724f55e7b0165109b48a922ae1f' 'installers/p07-system-care.sh b1f71ca37ac5a89f3edd7e099e9761caa7daac41' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 1d1653f7d9864cbfc4d54cd4ac79e935ac5e7b68'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release90-remote
            test "$(git hash-object /tmp/p07-release90-remote)" = "$sha"
          done
          echo P07_RELEASE90_REMOTE_DISTRIBUTION_READBACK_PASS
