name: S01 Theme layout editor UX closure
permissions:
  contents: read
  actions: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.141'
  TARGET_SHA: '231f25ce80b97cb7e82835c3258b0b9ac5c94001'
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: control
    - uses: actions/checkout@v4
      with:
        ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
        persist-credentials: false
        path: established
    - name: Reuse established isolated WordPress setup
      run: |
        mkdir -p proof
        cp -a established/lanes/s01-frontend-design-20261017 lane
        cp control/lanes/s01-admin-navigation-20261019/* lane/
    - uses: actions/checkout@v4
      with:
        repository: 'llhzx2018/vf-tools-theme'
        ref: '231f25ce80b97cb7e82835c3258b0b9ac5c94001'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        fetch-depth: 0
        path: target
    - name: Verify read-only candidate identity
      run: |
        test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
        test "$(cat target/VERSION)" = "$TARGET_VERSION"
        node --check lane/admin-layout-style.cjs
        node --check target/src/assets/js/admin/admin-layout.js
        python3 - <<'PYCONT'
        import subprocess
        from pathlib import Path
        base='a3c62ddac0c47ab488f7936c2797d03341fc224c'
        repo='target'
        changed=subprocess.check_output(['git','-C',repo,'diff','--name-only',base,'HEAD'],text=True).splitlines()
        assert set(changed)=={'src/inc/admin/views/layout.php','src/assets/css/admin/pages/page-structure/admin-page-layout-v8.css'},changed
        view='src/inc/admin/views/layout.php'
        old=subprocess.check_output(['git','-C',repo,'show',base+':'+view],text=True)
        new=Path(repo,view).read_text()
        assert new.count('class="vf-layout-library-filter-field"')==2
        assert new.replace(' class="vf-layout-library-filter-field"','')==old
        css='src/assets/css/admin/pages/page-structure/admin-page-layout-v8.css'
        oldcss=subprocess.check_output(['git','-C',repo,'show',base+':'+css],text=True)
        newcss=Path(repo,css).read_text()
        expected=oldcss.replace('.vf-layout-library-filters label{','.vf-layout-library-filters label.vf-layout-library-filter-field{').replace('.vf-layout-library-filters :is(input,select){','.vf-layout-library-filters .vf-layout-library-filter-field :is(input,select){')
        assert newcss==expected
        assert subprocess.check_output(['git','-C',repo,'rev-parse',base+':src/assets/js/admin/admin-layout.js'])==subprocess.check_output(['git','-C',repo,'rev-parse','HEAD:src/assets/js/admin/admin-layout.js'])
        print('SOURCE_STYLE_ONLY_CONTINUITY_PASS')
        PYCONT
    - uses: actions/download-artifact@v4
      with:
        name: s01-layout-editor-39348632698
        run-id: 39348632698
        github-token: ${{ github.token }}
        path: prior-proof
    - name: Exact M3U8 fixture dependency
      env:
        GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      run: |
        mkdir -p provider
        gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
        echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
    - name: Chromium and Chinese font
      run: |
        npm install --no-audit --no-fund playwright@1.62.1
        npx playwright install chromium
        mkdir -p "$HOME/.local/share/fonts"
        curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
        fc-cache -f
    - name: Focused style and operability closure; reuse unchanged functional proof
      run: |
        python3 - <<'PYBASE'
        from pathlib import Path
        script=Path('lane/native.sh').read_text()
        marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
        assert script.count(marker)==1
        script=script.split(marker)[0]+'node lane/admin-layout-style.cjs\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\n'
        Path('lane/admin-ux-native.sh').write_text(script)
        PYBASE
        bash lane/admin-ux-native.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: s01-layout-editor-final-${{ github.run_id }}
        path: proof/
        retention-days: 14
    - name: Remove temporary private source
      if: always()
      run: rm -rf target provider
on:
  push:
    branches:
    - 'task/s01-admin-page-navigation-20261019'
    paths:
    - .github/workflows/s01-admin-ux.yml
