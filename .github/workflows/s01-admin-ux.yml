name: S01-C01 1.35.146 channel contract fallback
on:
  push:
    branches: [task/s01-theme146-problems-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.146'
  TARGET_SHA: '93f4b2608a4b54610a534232768d8fd9921f5bd9'
  UPDATE_SHA: '0af8a60bdef769e0ab98d06ae3b1288018b0f13b'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '0af8a60bdef769e0ab98d06ae3b1288018b0f13b'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='e1075655f95434c5d9c36455a450331dec0df8d0101c89484a96fc6f58ac85b9'
        assert m['asset_bytes']==int('1962343')
        assert '1.35.145' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
