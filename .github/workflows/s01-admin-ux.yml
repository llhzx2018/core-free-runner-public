name: S01 Long footer tools focused recheck
on:
  push:
    branches: [task/s01-theme150-footer-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.150
  TARGET_SHA: 6f26b957d694f5cf3907f4e5df9bf9fb50fea584
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Select established WordPress lane and focused fixtures
        run: |
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-problems-20261019/* lane/
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 6f26b957d694f5cf3907f4e5df9bf9fb50fea584
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source boundary and regression contract
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -q "^Version: $TARGET_VERSION$" target/src/style.css
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          base='8b2dfcb41cd59567e37a57960a1da430b8c0c7df'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',base,'HEAD'],text=True).splitlines()
          expected=['VERSION', 'src/style.css', 'src/inc/runtime-constants.php', 'src/assets/css/public/responsive/header-footer/public-responsive-footer.css', 'src/assets/css/public/vf-theme-public-runtime.css']
          assert sorted(changed)==sorted(expected),changed
          owner='src/assets/css/public/responsive/header-footer/public-responsive-footer.css'
          bundle='src/assets/css/public/vf-theme-public-runtime.css'
          old=subprocess.check_output(['git','-C','target','show',base+':'+owner],text=True)
          old_bundle=subprocess.check_output(['git','-C','target','show',base+':'+bundle],text=True)
          new=Path('target',owner).read_text();new_bundle=Path('target',bundle).read_text()
          assert old_bundle.count(old)==1 and new_bundle.count(new)==1
          assert new_bundle.replace(new,old,1)==old_bundle,'unrelated public CSS changed'
          Path('proof/source.json').write_text(json.dumps({'status':'PASS','changed_files':changed,'production':'NOT_MODIFIED'}))
          PY
          git -C target show 8b2dfcb41cd59567e37a57960a1da430b8c0c7df:src/assets/css/public/vf-theme-public-runtime.css > /tmp/prior-public.css
          node --check lane/problems-focused.cjs
          php -l control/lanes/s01-problems-20261019/footer-seed.php
      - name: Exact plugin fixture
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Focused real WordPress MariaDB Chromium checks only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          seed='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert script.count(seed)==1
          script=script.replace(seed,'docker cp lane/footer-seed.php "$WP:/tmp/footer-seed.php";cli eval-file /tmp/footer-seed.php > proof/footer-seed.json\n'+seed)
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(marker)==1
          script=script.split(marker)[0]+'node lane/problems-focused.cjs\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\n'
          Path('lane/problems-native.sh').write_text(script)
          PY
          bash lane/problems-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-problems-focused-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source
        if: always()
        run: rm -rf target provider

