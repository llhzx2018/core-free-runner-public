name: S01 Problem detail alignment focused candidate
on:
  push:
    branches: [task/s01-theme147-detail-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.147
  TARGET_SHA: e5eaab602f9e499b99131fa4bf324ce27da1b0d3
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Select established WordPress lane and focused fixtures
        run: |
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-problems-20261019/* lane/
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: e5eaab602f9e499b99131fa4bf324ce27da1b0d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source boundary and regression contract
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -q "^Version: $TARGET_VERSION$" target/src/style.css
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json
          base='93f4b2608a4b54610a534232768d8fd9921f5bd9'
          changed=subprocess.check_output(['git','-C','target','diff','--name-only',base,'HEAD'],text=True).splitlines()
          expected=['VERSION','src/style.css','src/inc/runtime-constants.php','src/assets/css/public/public-reading-final-owner.css']
          assert sorted(changed)==sorted(expected),changed
          Path('proof/source.json').write_text(json.dumps({'status':'PASS','changed_files':changed,'production':'NOT_MODIFIED'}))
          PY
          git -C target show 93f4b2608a4b54610a534232768d8fd9921f5bd9:src/assets/css/public/public-reading-final-owner.css > /tmp/prior-reading.css
          node --check lane/problems-focused.cjs
          php -l lane/problems-fixture.php
          php -l control/lanes/s01-problems-20261019/detail-fixture.php
      - name: Exact plugin fixture
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Focused real WordPress MariaDB Chromium checks only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixture=Path('lane/fixture.php');fixture.write_text(fixture.read_text()+'\n'+Path('control/lanes/s01-problems-20261019/detail-fixture.php').read_text().removeprefix('<?php\n'))
          script=Path('lane/native.sh').read_text()
          seed='docker cp lane/extra-seed.php "$WP:/tmp/extra-seed.php"'
          assert script.count(seed)==1
          script=script.replace(seed,'docker cp lane/problems-fixture.php "$WP:/tmp/problems-fixture.php";cli eval-file /tmp/problems-fixture.php > proof/problems-fixture.json\n'+seed)
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(marker)==1
          script=script.split(marker)[0]+'node lane/problems-focused.cjs\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\n'
          Path('lane/problems-native.sh').write_text(script)
          PY
          bash lane/problems-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-problems-focused-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source
        if: always()
        run: rm -rf target provider

  package-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: control
    - uses: actions/checkout@v4
      with:
        repository: 'llhzx2018/vf-tools-theme'
        ref: 'e5eaab602f9e499b99131fa4bf324ce27da1b0d3'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        fetch-depth: 0
        path: target
    - name: Exact source package and syntax
      run: |
        mkdir -p proof
        python3 control/lanes/s01-admin-navigation-20261019/release145-package.py
        php -l target/src/inc/modules/module-post-list.php
        php -l target/src/inc/runtime-constants.php
    - name: Previous formal package
      env:
        GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      run: |
        gh release download v1.35.146 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.146.zip
        echo 'e1075655f95434c5d9c36455a450331dec0df8d0101c89484a96fc6f58ac85b9  vf-tools-theme_V1.35.146.zip' | sha256sum -c
    - name: Install upgrade rollback reapply and protected data
      env:
        SOURCE_VERSION: '1.35.146'
      run: bash control/lanes/s01-admin-navigation-20261019/release143-wp.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: s01-theme147-package-${{ github.run_id }}
        path: proof/
        retention-days: 14
    - name: Remove temporary source and assets
      if: always()
      run: rm -rf target vf-tools-theme_V*.zip wp.phar
