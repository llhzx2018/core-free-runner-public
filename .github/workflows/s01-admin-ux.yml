name: S01-C01 1.35.144 channel contract fallback
on:
  push:
    branches: [task/s01-theme144-release-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.144'
  TARGET_SHA: '5eced9c381448a2c0099bbabee1f0035d716f7e2'
  UPDATE_SHA: '92ab1a91764f867f3220ffb39eb18d1d4dad74e8'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '92ab1a91764f867f3220ffb39eb18d1d4dad74e8'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='a1729fee6e74677a50e4212d37c8ff8b2b9f6b5da5f4d6efc9a47b7ad735e030'
        assert m['asset_bytes']==int('1961827')
        assert '1.35.143' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
