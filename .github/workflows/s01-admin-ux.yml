name: S01-C01 1.35.154 formal release closure
on:
  push:
    branches: [task/s01-tool-workspace-20261021]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.154
  TARGET_SHA: c4f5d3594501fe92928475d359efdacb5553dc50
  TARGET_TREE: f675cbee992135660857f9f1d6c233d17731ecd0
  EXPECTED_SHA256: f8ea19be89cd2192744dd9442a2df525dfff71bab2b3aa84b985d6b46b36e631
  EXPECTED_BYTES: '1967338'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: c4f5d3594501fe92928475d359efdacb5553dc50
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact merged source and deterministic tested artifact
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          python3 - <<'PY'
          import os,zipfile,hashlib,json
          from pathlib import Path,PurePosixPath
          v=os.environ['TARGET_VERSION']; root=Path('target/src')
          dest=Path(f'vf-tools-theme_V{v}.zip')
          files=sorted(x for x in root.rglob('*') if x.is_file())
          assert len(files)==476
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              info=zipfile.ZipInfo(str(PurePosixPath('vf-tools-theme')/p.relative_to(root)),date_time=(1980,1,1,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=(p.stat().st_mode&0o777)<<16
              z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(dest) as z:
            assert z.testzip() is None
            assert f'Version: {v}' in z.read('vf-tools-theme/style.css').decode()
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          assert digest==os.environ['EXPECTED_SHA256'],digest
          assert dest.stat().st_size==int(os.environ['EXPECTED_BYTES'])
          receipt={'source':os.environ['TARGET_SHA'],'tree':os.environ['TARGET_TREE'],'version':v,'sha256':digest,'bytes':dest.stat().st_size,'files':len(files),'candidate_run':'39526938024','production':'UNTOUCHED'}
          Path('formal-package.json').write_text(json.dumps(receipt,indent=2))
          print('EXACT_TESTED_PACKAGE=PASS')
          PY
      - name: Publish formal release and remote byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TARGET_REPO/git/ref/heads/main" --jq .object.sha | grep -qx "$TARGET_SHA"
          if gh release view "v$TARGET_VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'EXISTING_RELEASE_REFUSE_OVERWRITE' >&2; exit 1
          fi
          gh release create "v$TARGET_VERSION" "vf-tools-theme_V$TARGET_VERSION.zip" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes '工具详情体验与错误恢复：默认工作区介绍交给已有完整流程的Provider，保留自定义说明与可访问标题；桌面标题区采用紧凑任务布局，让主要输入与操作更早出现。必需工具短代码已注册但未输出控件时，工作区显示准确的双语不可用说明，并提供当前语言的工具目录与指南入口；不可用时省略无法执行的操作步骤，匿名访客不显示后台短代码诊断。未注册运行时的404边界保持不变。11个工具的双语桌面布局，以及播放器真实HLS解码、浏览器请求与报告导出、播放列表错误修复/重检/清空流程通过定向验证；正式包干净安装、1.35.153升级/回退/重升/幂等与数据保留通过。主题呈现变更，不修改Provider算法、数据、Schema或Updater。Production由OWNER手工升级；手机暂缓，整体真实使用待确认。'
          gh api "repos/$TARGET_REPO/git/ref/tags/v$TARGET_VERSION" --jq .object.sha | grep -qx "$TARGET_SHA"
          gh release view "v$TARGET_VERSION" --repo "$TARGET_REPO" --json tagName,isDraft,isPrerelease,assets > release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('release.json'));v=os.environ['TARGET_VERSION']
          assert r['tagName']=='v'+v and not r['isDraft'] and not r['isPrerelease']
          assert len(r['assets'])==1
          assert r['assets'][0]['name']==f'vf-tools-theme_V{v}.zip'
          assert r['assets'][0]['size']==int(os.environ['EXPECTED_BYTES'])
          PY
          mkdir verify
          gh release download "v$TARGET_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V$TARGET_VERSION.zip" --dir verify
          cmp "vf-tools-theme_V$TARGET_VERSION.zip" "verify/vf-tools-theme_V$TARGET_VERSION.zip"
          echo "$EXPECTED_SHA256  verify/vf-tools-theme_V$TARGET_VERSION.zip" | sha256sum -c
          echo 'FORMAL_RELEASE_REMOTE_BYTES_SHA_TAG=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme-formal-closure-${{ github.run_id }}
          path: |
            formal-package.json
            release.json
          retention-days: 14
      - name: Remove transient private source and assets
        if: always()
        run: rm -rf target verify vf-tools-theme_V*.zip
