name: S01 Theme 1.35.143 package upgrade gate
on:
  push:
    branches: ['task/s01-admin-page-navigation-20261019']
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_SHA: '2590ad40480aa343d6951f1993381d89fe8b1363'
  TARGET_VERSION: '1.35.143'
  SOURCE_VERSION: '1.35.141'
jobs:
  package-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: 'llhzx2018/vf-tools-theme'
          ref: '2590ad40480aa343d6951f1993381d89fe8b1363'
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Bind package to tested source with exact identity-only changes
        run: |
          mkdir -p proof
          python3 control/lanes/s01-admin-navigation-20261019/release143-package.py
          php -l target/src/inc/runtime-constants.php
          php -l target/src/inc/admin/views/frontend-pages.php
          node --check target/src/assets/js/admin/admin-console.js
      - name: Download exact previous formal release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V$SOURCE_VERSION.zip"
          echo 'c7dc1ee1c50caccd2cadbf8952b5bfe70b987f5f890c43ce0a9a9fef9da71526  vf-tools-theme_V1.35.141.zip' | sha256sum -c
      - name: Fresh install native upgrade rollback reapply and data preservation
        run: bash control/lanes/s01-admin-navigation-20261019/release143-wp.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme-143-package-upgrade-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source and assets
        if: always()
        run: rm -rf target vf-tools-theme_V*.zip wp.phar
