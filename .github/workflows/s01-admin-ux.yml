name: S01-C01 1.35.148 channel contract fallback
on:
  push:
    branches: [task/s01-theme148-width-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.148'
  TARGET_SHA: '420bf467bec7f4750e11f2e0198d2fe1c7a800db'
  UPDATE_SHA: 'a650fed4ad59a8a49a479ef6f4926d188f77f3be'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: 'a650fed4ad59a8a49a479ef6f4926d188f77f3be'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='87e7bc86ef58bcd4f89d2ba87df60f9769a3d6433ad9d140024ee4aac0d9c701'
        assert m['asset_bytes']==int('1962764')
        assert '1.35.147' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
