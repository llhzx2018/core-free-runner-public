name: S01-C01 1.35.147 channel contract fallback
on:
  push:
    branches: [task/s01-theme147-detail-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.147'
  TARGET_SHA: '98b7cf8684ddb486244a7446b34719fd7059a614'
  UPDATE_SHA: '01ab6909c9007574263d3c610d726c3a8f685add'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '01ab6909c9007574263d3c610d726c3a8f685add'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='c8d00a3e449aed2fc053650b7f733f2bcf64a564a2f8484be9105598227e313f'
        assert m['asset_bytes']==int('1962767')
        assert '1.35.146' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
