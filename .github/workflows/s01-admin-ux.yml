name: S01-C01 1.35.149 channel contract fallback
on:
  push:
    branches: [task/s01-theme149-reference-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.149'
  TARGET_SHA: '8b2dfcb41cd59567e37a57960a1da430b8c0c7df'
  UPDATE_SHA: 'deec5540e6bfd3efd7672633aade8fcbb5b4552f'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: 'deec5540e6bfd3efd7672633aade8fcbb5b4552f'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='1583f72a8b12316e78f08490c6a7dfe868913d07228e7ef43fdb2e78ff16ca38'
        assert m['asset_bytes']==int('1965224')
        assert '1.35.148' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
