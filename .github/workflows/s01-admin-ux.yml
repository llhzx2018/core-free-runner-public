name: S01-C01 1.35.150 channel contract fallback
on:
  push:
    branches: [task/s01-theme150-footer-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.150'
  TARGET_SHA: '6b96aed0b9efb16ab529978c5089f764997a09ce'
  UPDATE_SHA: '2944959474cec9705194fa94b069da6f8b09e094'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '2944959474cec9705194fa94b069da6f8b09e094'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='2a58c1f1c6778543327d02c7322867104ab7ae9e335b5251fd68f5a5800f2b64'
        assert m['asset_bytes']==int('1965851')
        assert '1.35.149' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
