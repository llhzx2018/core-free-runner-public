name: S01-C01 1.35.154 channel contract fallback
on:
  push:
    branches: [task/s01-tool-workspace-20261021]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.154'
  TARGET_SHA: 'c4f5d3594501fe92928475d359efdacb5553dc50'
  UPDATE_SHA: '347e906215ad5cff5862c1efe60e13ed600c31ff'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '347e906215ad5cff5862c1efe60e13ed600c31ff'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='f8ea19be89cd2192744dd9442a2df525dfff71bab2b3aa84b985d6b46b36e631'
        assert m['asset_bytes']==int('1967338')
        assert '1.35.153' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
