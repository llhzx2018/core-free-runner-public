name: S01 Tool workspace focused checks
on:
  push:
    branches: [task/s01-tool-workspace-20261021]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.154
  TARGET_SHA: 07aeddf31d80860817db05994beb69c61823e6dd
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Select established WordPress lane and focused fixtures
        run: |
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-problems-20261019/* lane/
          cp control/lanes/s01-tool-20261021/* lane/
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 07aeddf31d80860817db05994beb69c61823e6dd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source boundary and regression contract
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -q "^Version: $TARGET_VERSION$" target/src/style.css
          test "$(git -C target rev-parse HEAD^{tree})" = "79ddf70fc4c9963816e0a2ae79db6e0cdbfd4d5c"
          node --check lane/tool-flows.cjs
          node --check target/src/assets/js/main.js
          php -l lane/tool-fixture.php
      - name: Exact plugin fixture
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Focused real WordPress MariaDB Chromium checks only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          install='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert script.count(install)==1
          script=script.replace(install,'for attempt in 1 2 3; do '+install+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          marker_fixture='docker cp lane/fixture.php "$WP:/var/www/html/wp-content/mu-plugins/progress-fixture.php"'
          assert script.count(marker_fixture)==1
          script=script.replace(marker_fixture,marker_fixture+'\ndocker cp lane/tool-fixture.php "$WP:/var/www/html/wp-content/mu-plugins/tool-fixture.php"')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(marker)==1
          script=script.split(marker)[0]+'status=0;node lane/tool-flows.cjs || status=$?\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\nexit "$status"\n'
          Path('lane/problems-native.sh').write_text(script)
          PY
          bash lane/problems-native.sh
      - name: Combine unchanged exact-source checks and completed real flows
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/39524537496 --jq .head_sha | grep -qx b7bdda42a937c527c3f8cf23d5df0aa1f534abdc
          gh run download 39524537496 --repo llhzx2018/core-free-runner-public --name s01-tool-focused-39524537496 --dir prior-proof
          python3 - <<'PYCOMBINE'
          import json,pathlib,os
          root=pathlib.Path('prior-proof');old=json.loads((root/'tool-focused.json').read_text());new=json.loads(pathlib.Path('proof/tool-flows.json').read_text())
          expected={lang+' '+kind+' scenario completed'for lang in ['en','zh']for kind in ['player','browser stream']}
          failed=[x for x in old['checks']if not x['pass']]
          assert {x['name']for x in failed}==expected
          assert all('strict mode violation' in x['detail']for x in failed)
          assert new['status']=='PASS'and all(x['pass']for x in new['checks'])
          assert {lang+' '+kind+' flow completed'for lang in ['en','zh']for kind in ['player','browser']} <= {x['name']for x in new['checks']if x['pass']}
          assert (root/'state-before.sha256').read_bytes()==(root/'state-after.sha256').read_bytes()
          final={x['name']:x for x in old['checks']if x['pass']}
          final.update({x['name']:x for x in new['checks']})
          result={'status':'PASS','source':os.environ['TARGET_SHA'],'version':os.environ['TARGET_VERSION'],'retained_source_run':39524537496,'test_harness_corrections':failed,'checks':list(final.values())}
          pathlib.Path('proof/tool-combined.json').write_text(json.dumps(result,indent=2))
          print('EXACT_SOURCE_COMBINED_TOOL_CHECKS=PASS',len(final))
          PYCOMBINE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-tool-flows-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source
        if: always()
        run: rm -rf target provider

