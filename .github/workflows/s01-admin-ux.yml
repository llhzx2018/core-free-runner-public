name: S01-C01 1.35.152 channel contract fallback
on:
  push:
    branches: [task/s01-theme152-directory-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.152'
  TARGET_SHA: '27c63068b41613097542629ed8fe6a328c94bcda'
  UPDATE_SHA: 'cb0fd77b9154b4b74853f0738c4c1e955a7c0ac2'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: 'cb0fd77b9154b4b74853f0738c4c1e955a7c0ac2'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='0bacc9b1b7fecfb3c713beeac14a51ee84fe297858861a146f219734b7d93a56'
        assert m['asset_bytes']==int('1966481')
        assert '1.35.151' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
