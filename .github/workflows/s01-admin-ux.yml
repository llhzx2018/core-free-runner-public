name: S01 Content directory and search recovery candidate
on:
  push:
    branches: [task/s01-theme152-directory-20261020]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.152
  TARGET_SHA: 2eab7b18e1c591ab93561cc0d46c42d80d7ae946
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Select established WordPress lane and focused fixtures
        run: |
          mkdir -p proof
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-problems-20261019/* lane/
          cp control/lanes/s01-catalog-20261020/* lane/
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2eab7b18e1c591ab93561cc0d46c42d80d7ae946
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source boundary and regression contract
        run: |
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -q "^Version: $TARGET_VERSION$" target/src/style.css
          test "$(git -C target rev-parse HEAD^{tree})" = "f08fc87126a1dbc79d9e5730367be8b8d6453f19"
          git -C target show 326e73072ae58f22b31ca900e87aaad2fd59d732:src/assets/js/main.js > /tmp/prior-main.js
          node --check lane/catalog-focused.cjs
          node --check target/src/assets/js/main.js
          php -l lane/catalog-fixture.php
      - name: Exact plugin fixture
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir -p provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Chromium and Chinese font
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Focused real WordPress MariaDB Chromium checks only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path('lane/native.sh').read_text()
          install='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert script.count(install)==1
          script=script.replace(install,'for attempt in 1 2 3; do '+install+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          marker_fixture='docker cp lane/fixture.php "$WP:/var/www/html/wp-content/mu-plugins/progress-fixture.php"'
          assert script.count(marker_fixture)==1
          script=script.replace(marker_fixture,marker_fixture+'\ndocker cp lane/catalog-fixture.php "$WP:/var/www/html/wp-content/mu-plugins/catalog-fixture.php"')
          test_marker='docker cp lane/snapshot.php "$WP:/tmp/snapshot.php"'
          assert script.count(test_marker)==1
          script=script.replace(test_marker,'docker cp target/tests/search-archive-wordpress-check.php "$WP:/tmp/catalog-check.php";cli eval-file /tmp/catalog-check.php > proof/search-archive-contract.json\n'+test_marker)
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert script.count(marker)==1
          script=script.split(marker)[0]+'node lane/catalog-focused.cjs\ncli eval-file /tmp/snapshot.php > proof/state-after.sha256\ncmp proof/state-before.sha256 proof/state-after.sha256\necho PROTECTED_STATE_BYTE_IDENTICAL\n'
          Path('lane/problems-native.sh').write_text(script)
          PY
          bash lane/problems-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-catalog-focused-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove temporary private source
        if: always()
        run: rm -rf target provider


  package-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        path: control
    - uses: actions/checkout@v4
      with:
        repository: 'llhzx2018/vf-tools-theme'
        ref: '2eab7b18e1c591ab93561cc0d46c42d80d7ae946'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        fetch-depth: 0
        path: target
    - name: Exact source package and syntax
      run: |
        mkdir -p proof
        python3 control/lanes/s01-admin-navigation-20261019/release145-package.py
        php -l target/src/footer.php
        php -l target/src/inc/runtime-constants.php
    - name: Previous formal package
      env:
        GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      run: |
        gh release download v1.35.151 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.151.zip
        echo '14bf0acb607b5ee6b6ac0eee141cf39aa1c2294309f09d91e1117ca4f70eeb66  vf-tools-theme_V1.35.151.zip' | sha256sum -c
    - name: Install upgrade rollback reapply and protected data
      env:
        SOURCE_VERSION: '1.35.151'
      run: bash control/lanes/s01-admin-navigation-20261019/release143-wp.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: s01-theme152-package-${{ github.run_id }}
        path: proof/
        retention-days: 14
    - name: Remove temporary source and assets
      if: always()
      run: rm -rf target vf-tools-theme_V*.zip wp.phar
