name: S01-C01 1.35.153 channel contract fallback
on:
  push:
    branches: [task/s01-support-system-20261021]
    paths: ['.github/workflows/s01-admin-ux.yml']
permissions:
  contents: read
env:
  TARGET_REPO: 'llhzx2018/vf-tools-theme'
  TARGET_VERSION: '1.35.153'
  TARGET_SHA: 'f74aadeb0896f59abd004d97886affecb8607759'
  UPDATE_SHA: '5af3ccdb9565df67c18cd03e26f892435887ff88'
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v4
      with:
        repository: llhzx2018/core-updates
        ref: '5af3ccdb9565df67c18cd03e26f892435887ff88'
        token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        persist-credentials: false
        path: source
    - name: Exact distribution source and manifest contract
      run: |
        test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
        cd source
        python3 scripts/check_manifest_contract.py
        find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
        php update-core/php/tests/run.php
        python3 - <<'PY'
        import json,os
        m=json.load(open('projects/S01-C01.json'))
        assert m['target_version']==os.environ['TARGET_VERSION']
        assert m['asset_sha256']=='769f684646749cec0f009328bff3938a591d967fe8ef0e1c68dfb352d2818393'
        assert m['asset_bytes']==int('1966521')
        assert '1.35.152' in m['from_versions']
        print('EXACT_CHANNEL_NATIVE_PARITY=PASS')
        PY
    - name: Remove private source
      if: always()
      run: rm -rf source
