name: S01 v1.21.821 frontend runtime diagnostic
on:
  push:
    branches:
      - temp/s01-c02-production-readback-20260904-current
    paths:
      - '.github/workflows/s01-v121821-frontend-runtime-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops 1.21.821
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 696fb2d936210a2a179dec5fea4a2c6594d65df6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Diagnose publish runtime enqueue and stale-global behavior
        shell: bash
        run: |
          set -euo pipefail
          cd ops
          echo '=== IDENTITY ==='
          git rev-parse HEAD
          cat VERSION
          echo '=== ADMIN PUBLISH JS REFERENCES ==='
          grep -RIn --exclude-dir=.git --exclude='*.map' 'admin-publish-zip\.js\|vfOpsPublishZipRuntime\|data-vf-publish-autostart' . || true
          echo '=== SCRIPT ENQUEUE / REGISTER ==='
          grep -RIn --exclude-dir=.git -E 'wp_enqueue_script|wp_register_script|plugins_url\(|plugin_dir_url\(' includes vf-ops.php | head -n 250 || true
          echo '=== SOFT REFRESH CONTRACT ==='
          grep -RIn --exclude-dir=.git 'vfops:saas-soft-refreshed\|saas-soft' assets includes | head -n 200 || true
          echo '=== JS HEAD ==='
          sed -n '1,80p' assets/js/admin-publish-zip.js
          echo '=== JS AUTOSTART ==='
          grep -n -B8 -A24 'bindCandidateAutostart' assets/js/admin-publish-zip.js || true
          echo 'PASS_V121821_FRONTEND_RUNTIME_DIAGNOSTIC'
