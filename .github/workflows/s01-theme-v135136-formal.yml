name: S01-C01 Theme v1.35.136 formal private Release
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135136-formal.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 17fc8ad501b10346c87f4292bd12dab1d4353c01
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact source and theme PHP validation
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "17fc8ad501b10346c87f4292bd12dab1d4353c01"
          test "$(cat target/VERSION)" = "1.35.136"
          grep -q '^Version: 1.35.136$' target/src/style.css
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/s01-php-lint.txt
          echo "EXACT_SOURCE_PHP=PASS"
      - name: Deterministic WordPress ZIP integrity
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile,hashlib,json
          root=Path('target/src');dest=Path('vf-tools-theme_V1.35.136.zip')
          files=sorted(x for x in root.rglob('*') if x.is_file())
          assert len(files)>100
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  name=str(PurePosixPath('vf-tools-theme') / p.relative_to(root))
                  info=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(p.stat().st_mode & 0o777)<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(dest) as z:
              assert z.testzip() is None
              assert 'vf-tools-theme/functions.php' in z.namelist()
              assert 'Version: 1.35.136' in z.read('vf-tools-theme/style.css').decode()
          receipt={'status':'PASS','version':'1.35.136','source_sha':'17fc8ad501b10346c87f4292bd12dab1d4353c01','file_count':len(files),'bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'production':'UNTOUCHED'}
          Path('s01-theme-package-receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
          echo '12be51d1b5cac6139194b16b7833e2457d17e8c2dbba235720ad6a2830e1ca3c  vf-tools-theme_V1.35.136.zip' | sha256sum -c
      - name: Formal private GitHub Release and asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view v1.35.136 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS_REFUSE_REPLACE"; exit 1
          fi
          gh release create v1.35.136 vf-tools-theme_V1.35.136.zip --repo llhzx2018/vf-tools-theme --target 17fc8ad501b10346c87f4292bd12dab1d4353c01 --title "VF Tools Theme V1.35.136" --notes "S01-C01 R15 Tools Directory bilingual desktop readability, search/filter/link and technical SEO verified. Production manual upgrade only; mobile deferred."
          gh release download v1.35.136 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.136.zip --dir /tmp/vf-theme-release-readback
          cmp vf-tools-theme_V1.35.136.zip /tmp/vf-theme-release-readback/vf-tools-theme_V1.35.136.zip
          echo "PRIVATE_RELEASE_ASSET_BYTES_IDENTICAL=PASS"
          rm -rf /tmp/vf-theme-release-readback
      - name: Destroy transient private checkout
        if: always()
        run: rm -rf target
