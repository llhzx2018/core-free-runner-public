name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-home177-20261023]
    paths: ['.github/workflows/s01-home177-20261023-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.177
  TARGET_SHA: b8e944681ae263a585d03748dbf4d111e08d899a
  TARGET_TREE: 8bbd1bda740789d275e6853015dda76f37a637ac
  BASE_SHA: 3d5c4ca2293cfcdc0d93fe43ad8e10e5439ffba0
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: b8e944681ae263a585d03748dbf4d111e08d899a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39916015439 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39916015439 --jq .head_sha)" = 4bbd6efda482e35f1c84009688c9f59b5a114819
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39916015439 --repo llhzx2018/core-free-runner-public --name s01-home-39916015439 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-home177-20261023/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='e904dca2c40cefe4e490e10f3614466e2c5e6473'
          phases={phase:json.loads((r/(phase+'-home.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['write_requests']==[] and result['errors']==[]
              assert len(result['rows'])==8
              assert {x['language'] for x in result['rows']}=={'en','zh'}
              assert {x['width'] for x in result['rows']}=={1920,1440,1319,1024}
              fixed=phase in ['upgrade','after']
              for row in result['rows']:
                  o=row['observed']
                  assert row['result']=='PASS' and o['overflow'] is False and o['clipped']==[]
                  assert len(o['cards'])==6 and all(x>=4.5 for x in o['quickContrast'])
                  assert o['headerMark']==o['footerMark']
                  assert row['center_error']<=2
                  if fixed:
                      assert o['copy']['textAlign']=='center'
                      assert all(h['head']['textAlign']=='left' and h['title']['textAlign']=='left' and h['description']['textAlign']=='left' and abs(h['head']['x']-h['copy']['x'])<=2 for h in o['heads'])
                      assert all(abs(h['head']['x']-h['container']['x']-float(h['container']['padding'][:-2]))<=2 and float(h['label']['border'][:-2])==0 for h in o['heads'])
                      assert all(abs(h['link']['right']-h['head']['right'])<=2 and h['link']['y']+h['link']['height']<=h['head']['y']+h['head']['height']+2 for h in o['heads'] if h['link'])
                      assert all(x['title']['textAlign']=='left' and x['description']['textAlign']=='left' and abs(x['item']['x']-x['number']['x'])<=2 for x in o['steps'])
                      assert o['cta']['textAlign']=='center'
                      assert len(o['readability'])>=20 and all(x['minimum']>=4.5 for x in o['readability'])
                      assert o['operations']['taskBottom']==0 and o['operations']['footerTools']==11
                      assert o['operations']['guide']['height']<340 and o['operations']['guide']['titleOffset']<120
                      assert o['operations']['partner']['links']==1 and o['operations']['partner']['height']<=70
                      assert all(float(x['padding'][:-2])>=24 for x in o['cards'])
              assert all(h['title']['textAlign']=='left' for row in result['rows'] for h in row['observed']['heads'])
              if not fixed:
                  for row in result['rows']:
                      assert any(x['selector']=='.vf-home-secondary-link' and x['minimum']<4.5 for x in row['observed']['readability'])
                      assert row['observed']['operations']['taskBottom']>0 and row['observed']['operations']['partner']['height']>70
              if phase in ['before','after']:
                  assert len(result['interactions'])==2
                  for x in result['interactions']:
                      assert len(x['quick_destinations'])==3 and x['return_home']==x['language_switch']==x['task_disclosure']=='PASS'
                      assert x['header_keyboard']=='PASS'
                      assert x['language_escape_focus']==('RESTORED' if phase=='after' else 'OLD_LOST')
                      if phase=='after':assert x['hover_focus']==x['link_responses']=='PASS'
          for before,after in zip(phases['before']['rows'],phases['after']['rows']):
              for key in ['hrefs','h1','canonical']:assert before['observed'][key]==after['observed'][key]
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='a549a718c8a05b2e6825128ea3c263693fc4e2e4d165c5e7693a5043a6dbe984' and new['bytes']==1976857
          coverage=json.loads(pathlib.Path('control/lanes/s01-home177-20261023/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='e904dca2c40cefe4e490e10f3614466e2c5e6473' and coverage['tree']=='8bbd1bda740789d275e6853015dda76f37a637ac'
          assert coverage['owner_preview']=='N_A per unchanged Theme SSOT15'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='39916015439'
          coverage['merged_source']='b8e944681ae263a585d03748dbf4d111e08d899a'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.177 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.177 provider/vf-tools-theme_V1.35.177.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.177' --notes '继续回应Owner首页正式运营要求，集中修复主次操作/编号/浅底说明对比度、辅助文字字号、键盘焦点、重复分隔线及页尾伙伴菜单留白；语言菜单Escape恢复触发器焦点，文字指南改为等宽卡片、去除大块图片留白，页尾hover/focus使用深色可读文字。保留此前首屏居中和内容阅读基线，不改用户保存的布局、品牌或菜单内容。内容、链接、模块顺序、自定义菜单、SEO及领域逻辑保持；此前品牌和可读性修复保持。中英文四档桌面、实际链接跳转/返回、语言切换、键盘任务展开、干净安装/登录、原生升级/回退/重复安装与受保护数据验证通过。476运行文件；M3U8保持1.25.94，Ops未改。Production由Owner手工升级，手机按Owner要求暂缓；机器验证不等于首页整体运营体验已获认可，须在正式站整页复验。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.177 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.177 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.177 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.177.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.177.zip remote/vf-tools-theme_V1.35.177.zip
          echo 'a549a718c8a05b2e6825128ea3c263693fc4e2e4d165c5e7693a5043a6dbe984  remote/vf-tools-theme_V1.35.177.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.177.zip)" = 1976857
          gh release view v1.35.177 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
