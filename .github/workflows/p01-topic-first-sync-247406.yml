name: p01-topic-first-sync-247406
# One-shot transient proof. This PR is closed without merge.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-topic-first-sync-247406.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EXPECT_FEATURE: 57923b33e26e39552388ba23904a230c433d2e8a
      EXPECT_BASE_TAG: v2.47.405
    steps:
      - name: Install PHP test runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -r 'if (!in_array("sqlite",PDO::getAvailableDrivers(),true)) exit(8);'
          echo P01_PUBLIC_RUNNER_PDO_SQLITE=PASS
      - name: Transient private source resolution
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          gh auth setup-git >/dev/null
          git clone --quiet https://github.com/llhzx2018/vf-start.git candidate
          cd candidate
          echo P01_HEAD_SOURCE_RUNTIME=FORMAL_TAG_PINNED
          git fetch --quiet origin "$EXPECT_FEATURE" "refs/tags/$EXPECT_BASE_TAG:refs/tags/$EXPECT_BASE_TAG"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECT_FEATURE" || test "$(git rev-parse "$EXPECT_FEATURE")" = "$EXPECT_FEATURE"
          test "$(git show "$EXPECT_BASE_TAG:VERSION" | tr -d '\r\n')" = "2.47.405"
          git worktree add --quiet --detach ../stable "$EXPECT_BASE_TAG"
          git checkout -q -B isolated-merge "$EXPECT_FEATURE"
          git merge-base --is-ancestor "$EXPECT_BASE_TAG" HEAD
          test "$(cat VERSION | tr -d '\r\n')" = "2.47.406"
          echo P01_V247406_EXACT_CANDIDATE=PASS
          echo "P01_TEMP_MERGED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Focused true-PDO and HTTP security proof
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          for test in tests/gov_topic_catalog_contract.php tests/gov_topic_local_integrity_contract.php tests/gov_topic_auth_contract.php tests/gov_topic_remote_contract.php tests/gov_topic_source_ref_contract.php tests/gov_topic_asset_route_contract.php tests/gov_topic_preview_contract.php tests/gov_topic_pdo_integration.php; do
            php "$test"
          done
          echo P01_TOPIC_ISOLATED_MACHINE=PASS
      - name: Stable baseline canonical full regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          timeout 1800 bash tests/canonical_release_regression.sh . ../stable --require-zero-debt
          echo P01_V247406_CANONICAL_REGRESSION=PASS
      - name: Synthetic next-version FULL and Atomic package smoke
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 https://github.com/llhzx2018/core-free-runner-public.git runner-control
          mkdir -p release-base/full release-base/update candidate-out
          gh release download "$EXPECT_BASE_TAG" -R llhzx2018/vf-start -D release-base -p "VF-Start-V2.47.405-FULL.zip" -p "VF_Start_V2.47.405_UPDATE.zip"
          unzip -q release-base/VF-Start-V2.47.405-FULL.zip -d release-base/full
          unzip -q release-base/VF_Start_V2.47.405_UPDATE.zip -d release-base/update
          cd candidate
          test "$(cat VERSION)" = "2.47.406"
          test "$(cat src/VERSION.txt)" = "2.47.406"
          grep -Fq "define('VF_VERSION', '2.47.406');" src/app/bootstrap.php
          python3 ../runner-control/scripts/p01-maintenance-release.py \
            --candidate src \
            --baseline-full ../release-base/full \
            --baseline-repair ../release-base/update/repair-v2.47.405.php \
            --out ../candidate-out \
            --version 2.47.406 --source-version 2.47.405 \
            --target-sha "$(git rev-parse HEAD)" --target-tree "$(git rev-parse HEAD^{tree})" >/dev/null
          cd ..
          unzip -t candidate-out/VF-Start-V2.47.406-FULL.zip >/dev/null
          unzip -t candidate-out/VF_Start_V2.47.406_UPDATE.zip >/dev/null
          mkdir -p candidate-update candidate-full
          unzip -q candidate-out/VF_Start_V2.47.406_UPDATE.zip -d candidate-update
          unzip -q candidate-out/VF-Start-V2.47.406-FULL.zip -d candidate-full
          php -l candidate-update/repair-v2.47.406.php >/dev/null
          php candidate-update/repair-v2.47.406.php --self-test | grep -F '"ok":true' >/dev/null
          test "$(cat candidate-full/VERSION.txt)" = "2.47.406"
          echo P01_TOPIC_SYNTHETIC_FULL_ATOMIC_PACKAGE=PASS
      - name: Synthetic clean install, Atomic UPDATE and rollback
        shell: bash
        run: |
          set -euo pipefail
          setup_full() {
            local archive="$1" root="$2" port="$3" pid="" csrf=""
            mkdir -p "$root"
            unzip -q "$archive" -d "$root"
            php -S "127.0.0.1:$port" -t "$root" >"/tmp/p01-setup-$port.log" 2>&1 &
            pid=$!
            local cookie="/tmp/p01-topic-cookie-$port"
            for attempt in $(seq 1 40); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "/tmp/p01-topic-setup-$port.html"; then break; fi
              sleep 0.15
            done
            csrf="$(python3 - "/tmp/p01-topic-setup-$port.html" <<'PY'
          import re,sys
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open(sys.argv[1],encoding='utf-8').read())
          assert m
          print(m.group(1))
          PY
          )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" \
                --data-urlencode "setup_csrf=$csrf" \
                --data-urlencode "site_title=P01 topic synthetic gate" \
                --data-urlencode "admin_password=SyntheticGate!$port" \
                --data-urlencode "admin_password_confirm=SyntheticGate!$port" \
                -o "/tmp/p01-topic-result-$port.html"
            (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/setup.php")" = 302
            kill "$pid"; wait "$pid" 2>/dev/null || true
          }
          setup_full "$PWD/candidate-out/VF-Start-V2.47.406-FULL.zip" "$PWD/gate-full" 19611
          echo P01_TOPIC_CLEAN_FULL=PASS
          setup_full "$PWD/release-base/VF-Start-V2.47.405-FULL.zip" "$PWD/gate-upgrade" 19612
          cat >gate-upgrade/sentinel.php <<'PHP'
          <?php
          require __DIR__.'/app/bootstrap.php';
          $r=new VfRepository(vf_db());
          $cat=$r->createCategory(['name'=>'Gate protected','description'=>'','icon'=>'','is_private'=>1,'sort_order'=>0]);
          $a=$r->saveLink(null,['surface'=>'start','category_id'=>$cat,'title'=>'Gate sentinel','url'=>'https://example.com/topic-gate-sentinel','is_private'=>1,'description'=>'keep data','tags'=>['sentinel'],'is_pending'=>0]);
          file_put_contents('/tmp/p01-topic-sentinel.txt',(string)$a['id']);
          PHP
          php gate-upgrade/sentinel.php
          rm gate-upgrade/sentinel.php
          cp candidate-update/repair-v2.47.406.php gate-upgrade/repair-v2.47.406.php
          php gate-upgrade/repair-v2.47.406.php --verify-source="$PWD/gate-upgrade" | grep -F '"ok":true'
          php gate-upgrade/repair-v2.47.406.php --run="$PWD/gate-upgrade" | grep -F '"ok":true'
          test "$(cat gate-upgrade/VERSION.txt)" = 2.47.406
          (cd gate-upgrade && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          php -r 'require $argv[1]."/app/bootstrap.php"; $id=(int)trim(file_get_contents("/tmp/p01-topic-sentinel.txt")); $q=vf_db()->prepare("SELECT is_private,title FROM links WHERE id=?"); $q->execute([$id]); $r=$q->fetch(PDO::FETCH_ASSOC); if(!$r || (int)$r["is_private"]!==1 || $r["title"]!=="Gate sentinel") exit(4);' "$PWD/gate-upgrade"
          # Atomic success deliberately removes the installer; restore its
          # previously verified exact bytes for the idempotency check.
          cp candidate-update/repair-v2.47.406.php gate-upgrade/repair-v2.47.406.php
          php gate-upgrade/repair-v2.47.406.php --run="$PWD/gate-upgrade" | grep -F '"already_current":true'
          echo P01_TOPIC_ATOMIC_UPGRADE_IDEMPOTENCY_DATA=PASS
          setup_full "$PWD/release-base/VF-Start-V2.47.405-FULL.zip" "$PWD/gate-rollback" 19613
          cp candidate-update/repair-v2.47.406.php gate-rollback/repair-v2.47.406.php
          if VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php gate-rollback/repair-v2.47.406.php --run="$PWD/gate-rollback" >/tmp/p01-topic-rollback.out 2>/tmp/p01-topic-rollback.err; then
            echo 'Rollback failpoint unexpectedly succeeded'; exit 1
          fi
          test "$(cat gate-rollback/VERSION.txt)" = 2.47.405
          (cd gate-rollback && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_TOPIC_ATOMIC_ROLLBACK=PASS
      - name: Real PHP-cURL private GOV-TOPIC read
        shell: bash
        env:
          VF_GOV_TOPIC_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          cd candidate
          php -r '
            define("VF_PRIVATE_ROOT",sys_get_temp_dir()."/vf-topic-proof-".getmypid());
            require "src/app/GovTopicRemote.php";
            $remote=new VfGovTopicRemote();
            $rows=$remote->catalog();
            if(count($rows)<1) exit(11);
            $row=$rows[0];
            $fingerprint=VfGovTopicRemote::catalogFingerprint($rows);
            $snapshot=$remote->snapshot($row["topic_id"],$row["topic_version"],$fingerprint);
            if(!hash_equals($row["html"]["sha256"],hash("sha256",$snapshot["assets"]["html"]))) exit(12);
            if(!hash_equals($row["sources"]["sha256"],hash("sha256",$snapshot["assets"]["sources"]))) exit(13);
            echo "P01_GOV_TOPIC_REAL_PHP_CURL_READ=PASS\n";
          '
      - name: Private GOV-TOPIC Contents permission diagnostic
        shell: bash
        run: |
          set -euo pipefail
          if gh api repos/llhzx2018/gov-topic/contents/distribution/p01/catalog.json >/dev/null 2>&1; then
            echo GOV_TOPIC_PRIVATE_GITHUB_RUNNER_CONTENTS=PASS
          else
            echo GOV_TOPIC_PRIVATE_GITHUB_RUNNER_CONTENTS=NOT_PROVEN
          fi
          echo P01_PRIVATE_SOURCE_PERSISTENCE=NONE
