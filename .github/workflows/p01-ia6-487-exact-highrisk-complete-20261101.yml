name: P01 IA6 487 final exact SHA highrisk real business parity (one use)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-487-exact-highrisk-complete-20261101.yml'
permissions:
  contents: read
jobs:
  isolated-transfer:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 95581cab5032a68cd1cbc811b80b0f805c565889
      PRODUCT_VERSION: 2.47.487
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-transfer-20261031
      VF_IA6_DISPOSABLE_ACK: IA6-TRANSFER-ONLY
      P01_TEST_ORIGIN: http://127.0.0.1:19237
      P01_TEST_PASSWORD: IA6SyntheticTransferOwner2026!
    steps:
      - name: Checkout public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind exact candidate no public artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          echo P01_IA6_TRANSFER_EXACT_SOURCE=PASS
      - name: Transfer parity source and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile candidate/tests/integration/p01_ia6_transfer_formats_owner_http.py
          php -l candidate/src/app/DataTransfer.php
          php -l candidate/src/api.php
          echo P01_IA6_TRANSFER_SYNTAX=PASS
      - name: Fresh isolated Owner localhost installation
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$VF_E2E_RUNTIME_ROOT"
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:19237 -t . >/tmp/p01-ia6-transfer-server.log 2>&1 & echo $! >/tmp/p01-ia6-transfer-php.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-transfer-cookie -b /tmp/p01-ia6-transfer-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-transfer-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          raw=open('/tmp/p01-ia6-transfer-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',raw)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-transfer-cookie -b /tmp/p01-ia6-transfer-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Transfer Synthetic Fixture" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-transfer-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_IA6_TRANSFER_FRESH_INSTALL=PASS
      - name: Refuse without disposable Owner boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          if VF_E2E_RUNTIME_ROOT=/opt/some-real-site python3 candidate/tests/integration/p01_ia6_transfer_formats_owner_http.py >/tmp/p01-ia6-transfer-refuse.log 2>&1; then
            echo UNAUTHORIZED_TRANSFER_PROBE_ALLOWED >&2;exit 1
          fi
          grep -F NONDISPOSABLE_TRANSFER_ROOT_REFUSED /tmp/p01-ia6-transfer-refuse.log
          echo P01_IA6_TRANSFER_DISPOSABLE_GUARD=PASS
      - name: Actual Owner and Guest three-format transfer HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/integration/p01_ia6_transfer_formats_owner_http.py
          echo P01_IA6_TRANSFER_OWNER_HTTP_OPERATION_PARITY=PASS
      - name: Confirm actual resource state, protected backups and Owner Guest CSRF in disposable runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate && bash tests/integration/run_p01_ia6_r3_highrisk_disposable.sh)
          echo P01_IA6_CURRENT_REAL_RESOURCE_SECURITY_CHECK=PASS
      - name: Confirm 27 legacy admin routes and single dialog 12 tabs at 1440 768
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          node candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          echo P01_IA6_CURRENT_LEGACY_GUI_BROWSER_CHECK=PASS
      - name: Owner Global import explicit reauth and unknown-write browser
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/tests/integration/p01_ia6_import_dialog_write_outcomes_browser.mjs
          node candidate/tests/integration/p01_ia6_import_dialog_write_outcomes_browser.mjs
          echo P01_IA6_GLOBAL_IMPORT_HTTP_428_AND_UNKNOWN_BROWSER=PASS
      - name: Prepare four isolated recovery credential and purge installations
        shell: bash
        run: |
          set -Eeuo pipefail
          install_one() {
            local root="$1" port="$2"
            [[ "$root" == /tmp/p01-ia6-* && "$port" =~ ^[0-9]+$ ]]
            mkdir -p "$root"
            cp -a candidate/src/. "$root/"
            php -S 127.0.0.1:"$port" -t "$root" >"/tmp/p01-ia6-port-$port.log" 2>&1 &
            local pid=$!
            echo "$pid" >>/tmp/p01-ia6-process-list
            local cookie="/tmp/p01-ia6-cookie-$port" setup="/tmp/p01-ia6-setup-$port"
            for i in $(seq 1 45); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "$setup" >/dev/null 2>&1; then break; fi
              sleep 1
            done
            test -s "$setup"
            local csrf
            csrf="$(python3 - "$setup" <<'PY'
          import re,sys
          data=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',data)
          assert m,'setup CSRF missing'
          print(m.group(1))
          PY
          )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" \
              --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode "site_title=IA6 disposable highrisk fixture $port" \
              --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
              --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
              >/tmp/p01-ia6-setup-post-$port
            (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
            test "$(tr -d '\r\n ' < "$root/VERSION.txt")" = "$PRODUCT_VERSION"
          }
          : >/tmp/p01-ia6-process-list
          install_one /tmp/p01-ia6-purge-current-20261101 19238
          install_one /tmp/p01-ia6-disaster-parity-current-20261101 19239
          install_one /tmp/p01-ia6-r11-current-20261101 19240
          install_one /tmp/p01-ia6-source-auth-current-20261101 19241
          echo P01_IA6_FOUR_ISOLATED_FRESH_INSTALLS=PASS
      - name: Actual stale destructive review and guarded purge
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-purge-current-20261101 \
          VF_IA6_DISPOSABLE_ACK=IA6-PURGE-SYNTHETIC-ONLY \
            php candidate/tests/integration/p01_ia6_recycle_purge_stale_batch_disposable.php
          echo P01_IA6_PURGE_STALE_REVIEW_EXACT=PASS
      - name: Actual full disaster restore private data and recovery package
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-disaster-parity-current-20261101 \
          VF_IA6_DISPOSABLE_ACK=IA6-DISASTER-DISPOSABLE-ONLY \
            php candidate/tests/integration/p01_ia6_disaster_roundtrip_disposable.php
          echo P01_IA6_DISASTER_REAL_RESTORE_EXACT=PASS
      - name: Actual interrupted backup restore crash-journal rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_E2E_RUNTIME_ROOT=/tmp/p01-ia6-r11-current-20261101 \
            php candidate/tests/integration/p01_ia6_interrupted_restore_disposable.php
          echo P01_IA6_CRASH_RESTORE_ROLLBACK_EXACT=PASS
      - name: Source Owner and Guest HTTP credentials revoke and update isolation
        shell: bash
        env:
          VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-source-auth-current-20261101
          P01_TEST_ORIGIN: http://127.0.0.1:19241
          VF_IA6_DISPOSABLE_ACK: IA6-SOURCE-AUTH-ONLY
        run: |
          set -Eeuo pipefail
          bash candidate/tests/integration/p01_ia6_specialist_sources_credential_http.sh
          echo P01_IA6_SOURCE_CREDENTIAL_ISOLATION_EXACT=PASS
      - name: Cleanup fixture and protected candidate checkout
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-transfer-php.pid; then kill "$(cat /tmp/p01-ia6-transfer-php.pid)" >/dev/null 2>&1 || true; fi
          if test -f /tmp/p01-ia6-process-list; then while read -r pid; do kill "$pid" >/dev/null 2>&1 || true; done </tmp/p01-ia6-process-list; fi
          rm -rf /tmp/p01-ia6-transfer-20261031 /tmp/p01-ia6-purge-current-20261101 \
            /tmp/p01-ia6-disaster-parity-current-20261101 /tmp/p01-ia6-r11-current-20261101 \
            /tmp/p01-ia6-source-auth-current-20261101 candidate
          rm -f /tmp/p01-ia6-process-list
          echo P01_IA6_HIGH_RISK_TEMP_CLEANUP=PASS
          echo P01_IA6_TRANSFER_CLEANUP=PASS
