name: P07 D05 read-only real DB inspection source QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d05-readonly-source-qa-20261115.yml'
permissions:
  contents: read
jobs:
  source-qa:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public synthetic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient private exact P07 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5406e3f25d077ceaf8274baa64948eda93cfc981
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-d05
      - name: Run D05 endpoint discovery and UX fail-closed regression
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-d05 rev-parse HEAD)" = 5406e3f25d077ceaf8274baa64948eda93cfc981
          cd .p07-private-d05
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_readonly_discovery.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_cli_inspect.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_db_conversion_plan.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_matched_engine.py -v
          python3 -B -m unittest discover -s tests -p test_p07_terminal_ux_contract.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：独立双端只读检查阶段' \
            --changed-file lib/db_engine_conversion_discovery.py \
            --changed-file bin/vfops-db-convert-plan.py \
            --changed-file tests/test_p07_m03_d05_cli_inspect.py \
            --affected P07-M03-D05 --shared-reason 'D05客户端只读界面同模块改动'
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M03-D05 \
            --changed-file bin/vfops-db-convert-plan.py \
            --evidence-file docs/ux-reviews/p07-m03-d05-readonly-inspect-v1.json
          echo P07_D05_READONLY_DISCOVERY_SOURCE_QA=PASS
      - name: Remove transient private P07 source
        if: always()
        shell: bash
        run: |
          rm -rf -- .p07-private-d05
          test ! -e .p07-private-d05
          echo P07_D05_PRIVATE_SOURCE_CLEAN=PASS
