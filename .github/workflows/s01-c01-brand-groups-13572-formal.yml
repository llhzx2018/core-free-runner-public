name: S01-C01 brand groups formal release
on:
  push:
    branches: [task/s01-c01-brand-groups-13572-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.72'
      TARGET_SHA: 'f063a4bd4eb4a50d767f747ef339ffce0f699075'
      TARGET_TREE: 'de922ea178376d278ddb03add28c2fe5447ef57a'
      SOURCE_VERSION: '1.35.71'
      BASE_SHA: '8e366b077fdc5628cf2a16d3f85db8e4dab960f6'
      CANDIDATE_RUN: '37128484383'
      CANDIDATE_SHA: '20d1cff4b032488708f9e4fece3414adb209948e'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-brand-groups-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .fixture_browser=="PASS" and .brand_persistence=="PASS" and .brand_csrf=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .choice_controls=="PASS" and .recovery_controls=="PASS" and .number_controls=="PASS" and .preview_controls=="PASS" and .preview_scroll=="PASS" and .advanced_controls=="PASS" and .advanced_interactions=="PASS" and .layout_browser=="PASS" and .layout_cases==120 and .layout_persistence=="PASS" and .layout_csrf=="PASS" and .layout_modal_keyboard=="PASS" and .layout_information_hierarchy=="PASS" and .layout_save_no_occlusion=="PASS" and .layout_module_affordance=="PASS" and .layout_module_provenance=="PASS" and .layout_module_enable=="PASS" and .layout_context_picker=="PASS" and .layout_controls_reused==false and .layout_all_controls=="PASS" and .layout_control_cases==40 and .layout_control_checks>1000 and .layout_section_isolation=="PASS" and .layout_mouse_wheel=="PASS" and .brand_advanced_action_return=="PASS" and .brand_advanced_groups=="PASS" and .brand_restore_labels=="PASS" and .brand_form_preservation=="PASS" and .brand_independent_edit=="PASS" and .brand_native_cases==6 and .brand_fixture_cases==24' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-brand-groups-13572 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          品牌与全局样式：高级设置分为配置来源、站点预设、临时视觉、恢复临时视觉四个独立展开区，默认收起，按当前操作展开。展开切换保留已填输入，操作返回时展开对应分组，恢复选项及预设差异显示中文名称，展开和收起提示保持水平。
          原有表单、预设差异与确认、临时视觉保存及恢复行为保持；壳、头部、主菜单冻结。
          Exact candidate Run: $CANDIDATE_RUN。6 宽度真实 WordPress 品牌交互、24 组源代码渲染用例、20 页型 × 6 宽度布局回归与 40 组控件回归，以及 $SOURCE_VERSION→$TARGET_VERSION 原生升级、恢复旧版、重新应用新版通过。
          OWNER 验收范围为 UX/UI；机器检查不替代升级后 OWNER 视觉裁决。发布前独立 Preview Runtime 按项目 SSOT 为 N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-brand-groups-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
