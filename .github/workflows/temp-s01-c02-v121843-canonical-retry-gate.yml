name: TEMP S01-C02 Ops 1.21.843 Canonical Final Audit Retry Gate
on:
  push:
    branches:
      - temp/s01-c02-v121843-canonical-retry-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121843-canonical-retry-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_BASE: ee6377e6bf7dc608b516f0047e73363503174144
      PRODUCT_COMMIT: 904a68e3a60aa58c5d7af8d725f3393f22e9be07
      PRODUCT_TREE: 00abb181effaf9479244792a9e05e031af63e527
      CORE_UPDATES: 3ecdd477e253fb5cafe54341e912c5534c775671
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify source and Phase3
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.843
          php -l ops/includes/site-release/s01-static-final-audit-canonical-retry-v121843.php
          php -l ops/vf-ops.php
          php -l ops/.github/phase3/v121843-final-audit-canonical-retry.php
          php ops/.github/phase3/v121843-final-audit-canonical-retry.php | grep -Fxq PASS_V121843_FINAL_AUDIT_CANONICAL_RETRY
      - name: Verify narrow diff
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git -C ops diff --name-only "$PRODUCT_BASE" "$PRODUCT_COMMIT" | sort)
          test "${#files[@]}" = 4
          printf '%s\n' "${files[@]}" | grep -Fxq '.github/phase3/v121843-final-audit-canonical-retry.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'VERSION'
          printf '%s\n' "${files[@]}" | grep -Fxq 'includes/site-release/s01-static-final-audit-canonical-retry-v121843.php'
          printf '%s\n' "${files[@]}" | grep -Fxq 'vf-ops.php'
      - name: Verify Engineering and Production authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES"
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/develop --jq .object.sha)" = "$CORE_UPDATES"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.842" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.842" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalizeReadbackRetryStatus=="not_run" and .sourceRecoveryFinalizeReadbackRetryCode=="finalize_readback_retry_not_final_audit"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryJobMode=="inspect_only" and .sourceRecoveryJobStatus=="done" and .sourceRecoveryJobCurrentStage==3 and .sourceRecoveryJobInspectionComplete==true' /tmp/static.json >/dev/null
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121843_CANONICAL_FINAL_AUDIT_RETRY_GATE
