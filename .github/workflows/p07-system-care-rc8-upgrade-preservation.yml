name: P07 System Care RC8 Upgrade Preservation Gate

on:
  push:
    branches: [gate/p07-system-care-rc8-upgrade-preservation-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc8-upgrade-preservation.yml'

permissions:
  contents: read

jobs:
  rc7-to-rc8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install historical RC7 through its public installer
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/584f548a47f892218d0c5105a528f83811d7329c/installers/p07-system-care.sh -o /tmp/p07-system-care-rc7.sh
          grep -Fq "VERSION='0.1.0-rc7'" /tmp/p07-system-care-rc7.sh
          sudo bash /tmp/p07-system-care-rc7.sh status >/tmp/rc7-status.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc7
          echo P07_RC8_UPGRADE_START_RC7=PASS

      - name: Create valid RC7 evidence state and P07 scheduler fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          fixture=/tmp/p07-rc8-upgrade-fixture
          mkdir -p "$fixture/home/alice/htdocs/example.com/wp-content/uploads"
          printf '%s\n' '<?php define("DB_NAME","fixture");' > "$fixture/home/alice/htdocs/example.com/wp-config.php"
          printf '%s\n' '<?php echo "clean";' > "$fixture/home/alice/htdocs/example.com/index.php"
          sudo env P07_IE_DISCOVERY_HOME="$fixture/home" python3 /opt/vf-system-care/lib/intrusion_evidence.py --state-dir /var/lib/vf-system-care/intrusion-evidence baseline --site-root "$fixture/home/alice/htdocs/example.com" >/tmp/rc7-baseline.out
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/baseline.json
          sudo test -f /var/lib/vf-system-care/intrusion-evidence/scan_state.json
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json | sudo tee /tmp/p07-rc8-state-before.sha256 >/dev/null
          printf '%s\n' '[Unit]' 'Description=P07 upgrade preservation fixture' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.service >/dev/null
          printf '%s\n' '[Timer]' 'OnCalendar=daily' | sudo tee /etc/systemd/system/vf-system-care-intrusion-evidence.timer >/dev/null
          sudo sha256sum /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer | sudo tee /tmp/p07-rc8-scheduler-before.sha256 >/dev/null
          echo P07_RC8_UPGRADE_RC7_STATE_FIXTURE=PASS

      - name: Upgrade through current permanent RC8 installer
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o /tmp/p07-system-care-rc8.sh
          grep -Fq "VERSION='0.1.0-rc8'" /tmp/p07-system-care-rc8.sh
          sudo bash /tmp/p07-system-care-rc8.sh status >/tmp/rc8-status.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc8
          echo P07_RC8_UPGRADE_RUNTIME=PASS

      - name: Verify evidence state and scheduler bytes were preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo sha256sum -c /tmp/p07-rc8-state-before.sha256
          sudo sha256sum -c /tmp/p07-rc8-scheduler-before.sha256
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence)" = 700
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/baseline.json)" = 600
          test "$(sudo stat -c '%a' /var/lib/vf-system-care/intrusion-evidence/scan_state.json)" = 600
          echo P07_RC8_UPGRADE_EVIDENCE_STATE_PRESERVED=PASS
          echo P07_RC8_UPGRADE_SCHEDULER_FILES_PRESERVED=PASS

      - name: Verify RC8 refresh reports existing state without rewriting it
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo sha256sum /var/lib/vf-system-care/intrusion-evidence/baseline.json /var/lib/vf-system-care/intrusion-evidence/scan_state.json > /tmp/p07-rc8-state-before-refresh.sha256
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence refresh-cache
          sudo sha256sum -c /tmp/p07-rc8-state-before-refresh.sha256
          sudo grep -Eq '^STATUS=(NORMAL|ATTENTION|FAILED)$' /tmp/p07-system-care-intrusion-0.cache
          sudo grep -Fq 'SCHEDULER=broken' /tmp/p07-system-care-intrusion-0.cache
          echo P07_RC8_UPGRADE_REFRESH_READ_ONLY=PASS

      - name: Cleanup fixtures
        if: always()
        shell: bash
        run: |
          sudo rm -f /etc/systemd/system/vf-system-care-intrusion-evidence.service /etc/systemd/system/vf-system-care-intrusion-evidence.timer
          sudo rm -rf /var/lib/vf-system-care/intrusion-evidence /tmp/p07-rc8-upgrade-fixture
          echo P07_RC8_UPGRADE_FIXTURE_CLEANUP=PASS

      - name: Final upgrade marker
        shell: bash
        run: echo P07_SYSTEM_CARE_RC8_UPGRADE_PRESERVATION_GATE=PASS
