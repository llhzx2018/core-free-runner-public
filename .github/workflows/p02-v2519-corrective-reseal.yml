name: P02 V2.5.19 Corrective Reseal

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-v2519-corrective-reseal.yml']

permissions:
  contents: read

jobs:
  reseal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REF: 8598b440096da030a780f75b0800b140d58d107f
      TARGET_BRANCH: maintenance/v2.5.19-update-path-corrective
      V2518_REF: d473e012b2c6674c0b5f910161a866f6b0fb3866
    steps:
      - name: Require registered private capability
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$WRITE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_REF }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Reseal exact V2.5.19 source and regression contract
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.19
          test "$(git show "$V2518_REF:public/assets/v254-common-branding.js" | sha256sum | awk '{print $1}')" = "$(sha256sum public/assets/v254-common-branding.js | awk '{print $1}')"
          test "$(git show "$V2518_REF:public/assets/scratch-tabs.js" | sha256sum | awk '{print $1}')" = "$(sha256sum public/assets/scratch-tabs.js | awk '{print $1}')"
          node --check public/assets/v254-common-branding.js
          node --check public/assets/scratch-tabs.js
          grep -q 'V2.5.18_SCRATCH_TAB_OVERFLOW_UX' public/assets/v254-common-branding.js
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          jp=Path('SOURCE_MANIFEST.json'); obj=json.loads(jp.read_text(encoding='utf-8')); entries=obj['entries']; assert len(entries)==74
          lines=['VF Library V2.5.19 CANDIDATE SOURCE_MANIFEST','FULL_SHA256  PENDING_FORMAL_CANDIDATE_ARTIFACT','RUNTIME_SOURCE_FILES  74','MAPPING_STATUS  CURRENT_GIT_CANDIDATE','']
          for e in entries:
              p=Path(e['repo_path']); assert p.is_file(), e['repo_path']; b=p.read_bytes(); h=hashlib.sha256(b).hexdigest(); e['bytes']=len(b); e['sha256']=h; e['repo_sha256']=h; lines.append(f"{h}  {e['repo_path']}  <=  {e['full_path']}")
          txt='\n'.join(lines)+'\n'; Path('SOURCE_MANIFEST.txt').write_text(txt,encoding='utf-8'); obj['version']='2.5.19'; obj['schema']=2401; obj['runtime_source_file_count']=74; obj['source_baseline_full_sha256']='PENDING_FORMAL_CANDIDATE_ARTIFACT'; obj['mapping_contract']='Each declared runtime source file must exist exactly once at repo_path; hashes bind the Git-native V2.5.19 corrective candidate deploy tree. Formal release identity is not assigned by this candidate manifest.'; obj['repo_sha256']=hashlib.sha256(txt.encode()).hexdigest(); jp.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          re=json.loads(jp.read_text(encoding='utf-8')); assert re['version']=='2.5.19' and re['schema']==2401 and len(re['entries'])==74
          for e in re['entries']:
              b=Path(e['repo_path']).read_bytes(); h=hashlib.sha256(b).hexdigest(); assert e['bytes']==len(b) and e['sha256']==h and e['repo_sha256']==h
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          PY
          ROOT="$RUNNER_TEMP/vf2519"; mkdir -p "$ROOT/site"; bash scripts/build-deploy-tree.sh "$ROOT/site" >/dev/null; test "$(cat "$ROOT/site/VERSION.txt")" = 2.5.19
          php -l "$ROOT/site/index.php" >/dev/null
          echo V2518_TAB_UX_RUNTIME_EXACT=PASS
          echo BUILD_DEPLOY_TREE=PASS
          echo SCHEMA=2401
          echo PRODUCTION_WRITE=NO
      - name: Push sealed corrective candidate
        working-directory: product
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'chore(source): reseal V2.5.19 corrective source manifest'
          git push "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git" HEAD:"$TARGET_BRANCH"
