name: P07 OneShot Bench Sync

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v01
    paths:
      - .github/workflows/p07-oneshot-sync.yml
  workflow_dispatch:

permissions:
  contents: write

# Exact-byte sync: private development source -> public experiment.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v01

      - name: Fetch exact private OneShot source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          SOURCE_SHA: df5311238a47c0afd4ecd633f8d526b2f0d950f2
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p experiments
          curl -fL --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/contents/standalone/p07-bench.sh?ref=$SOURCE_SHA" \
            -o experiments/p07-bench.sh
          test -s experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          grep -F 'VERSION="0.1.0"' experiments/p07-bench.sh

      - name: Commit exact public experiment bytes
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'experiment(p07-bench): sync exact one-shot v0.1 source'
          git push origin HEAD:experiment/p07-oneshot-bench-v01
