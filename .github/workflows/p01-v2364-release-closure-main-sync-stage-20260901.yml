name: P01 V2.36.4 Release Closure Main Sync Stage
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-release-closure-main-sync-stage-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAIN: 8fedb0d1dab25d23e598029bd39c0cbea50916b0
      DEVELOP: 4a608669d1ee7457aca645f561f57d883e51d749
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      CORE_MAIN: 135f66c4eca08819840001f28dcd89869770085c
      BRANCH: docs/p01-v2364-release-closure-main-20260901
      EVID: /tmp/p01-v2364-release-closure-main-sync
    steps:
      - name: Closure prerequisite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33526604560 --jq .conclusion)" = success
      - name: Checkout exact main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Stage exact authority files from develop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          cd p01
          test "$(git rev-parse HEAD)" = "$MAIN"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$MAIN"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$DEVELOP"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_MAIN"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then echo BRANCH_EXISTS; exit 30; fi
          git fetch origin "$DEVELOP" --quiet
          git switch -c "$BRANCH"
          git checkout "$DEVELOP" -- VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.4_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.4_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md "
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          jq -e '.production_version=="2.36.3" and .published_release.version=="2.36.4" and .published_release.production_closure=="PENDING OWNER UPDATE" and .authority.current_production_evidence=="docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md" and .authority.current_formal_release_evidence=="docs/evidence/P01_V2.36.4_RELEASE_CLOSURE_20260901.md"' VF_PROJECT.json >/dev/null
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.4_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          git diff --cached --name-only | sort | tee "$EVID/files.txt"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P01): sync V2.36.4 release closure to main'
          C=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$MAIN"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin "$BRANCH"
          printf 'P01_V2364_RELEASE_CLOSURE_MAIN_SYNC_STAGE=PASS\nBRANCH=%s\nCOMMIT=%s\nBASE_MAIN=%s\nSOURCE_DEVELOP=%s\nRUNTIME_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$BRANCH" "$C" "$MAIN" "$DEVELOP" "$RUNTIME_TREE" | tee "$EVID/verdict.txt"
      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-release-closure-main-sync-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90