name: P02 V2.5.13 Inspect

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2513-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private read capability
        env:
          READ_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$READ_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Inspect relevant UX code
        run: |
          set -Eeuo pipefail
          cd product
          echo '=== VERSION ==='; cat VERSION
          echo '=== notebook selection/list scroll/category ==='
          grep -n -E 'renderNotebookSelection|loadNotebookItems|notebookListScroll|data-category|categoryId|scrollIntoView' public/assets/app.js | head -n 220
          echo '=== scratch shortcuts/order/pin/recent ==='
          grep -n -E 'keydown|Ctrl|sort_order|pinned|reorder|recent|reopenTab|openOrganize|switchTab' public/assets/scratch-tabs.js src/app/ScratchTabsService.php public/scratch-action.php | head -n 260
          echo '=== reader resume/collapse ==='
          grep -n -E 'reader.*scroll|reading.*position|collapse|details|figure|img|toc|reader-width' public/assets/app.js public/assets/*.css | head -n 260
