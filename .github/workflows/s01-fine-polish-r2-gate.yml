name: S01 Fine Polish R2 Gate
# retry-2

on:
  push:
    branches:
      - task/s01-fine-polish-r2-gate
    paths:
      - .github/workflows/s01-fine-polish-r2-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: Fine Polish R2 Gate (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 95cd92b2a613d2a06e8fa2d38c911648d666a366
            head: 983e24371e41c9829d73447741ded8e7ba3fdc2b
            version: 1.21.951
            css: assets/css/current/admin-s01-page-body-fine-polish-r1.css
            test: tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            allowed: CHANGELOG.md,VERSION,assets/css/current/admin-s01-page-body-fine-polish-r1.css,tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php,vf-ops.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: a02d51f82ba420238cb5871fcf7d9c0f1b87fe62
            head: 1358cfc789e87c4053272e9964f87be42e1349a8
            version: 1.35.52
            css: src/assets/css/admin/admin-s01-page-body-fine-polish-r1.css
            test: tests/s01-c01-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            allowed: CHANGELOG.md,VERSION,src/assets/css/admin/admin-s01-page-body-fine-polish-r1.css,src/inc/runtime-constants.php,src/style.css,src/theme.json,tests/s01-c01-page-body-v2-fine-polish-r1-full-surface-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 3eec23ffbf69571ab28f819d78dfcbb9823e7b3b
            head: b11ec1ce2d45514c5ff53d0ea1d7aee89bcfcd07
            version: 1.25.55
            css: src/admin/ui-v4/admin-s01-page-body-fine-polish-r1.css
            test: tests/s01-c03-page-body-v2-fine-polish-r1-full-surface-contract.php
            full: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            allowed: CHANGELOG.md,VERSION,src/admin/ui-v4/admin-s01-page-body-fine-polish-r1.css,src/vf-tool-m3u8.php,tests/s01-c03-page-body-v2-fine-polish-r1-full-surface-contract.php

    steps:
      - name: Credential gate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact branch and bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          printf '%s' "$ALLOWED" | tr ',' '\n' | sort > /tmp/want.txt
          jq -r '.files[].filename' /tmp/compare.json | sort > /tmp/actual.txt
          diff -u /tmp/want.txt /tmp/actual.txt

          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Identity and Fine Polish contracts
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
          CSS: ${{ matrix.css }}
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "$VERSION"
          grep -F 'details>summary:focus-visible' "$SOURCE_DIR/$CSS"
          grep -F 'details>summary{min-height:var(--vf-fp-touch)' "$SOURCE_DIR/$CSS"
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"
          case "$COMPONENT" in
            OPS)
              grep -F "Version: $VERSION" "$SOURCE_DIR/vf-ops.php"
              grep -F "VF_OPS_VERSION', '$VERSION'" "$SOURCE_DIR/vf-ops.php"
              php -l "$SOURCE_DIR/vf-ops.php"
              ;;
            THEME)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/style.css"
              grep -F "VF_THEME_VERSION', '$VERSION'" "$SOURCE_DIR/src/inc/runtime-constants.php"
              grep -F "\"vfThemeVersion\": \"$VERSION\"" "$SOURCE_DIR/src/theme.json"
              php -l "$SOURCE_DIR/src/inc/runtime-constants.php"
              ;;
            M3U8)
              grep -F "Version: $VERSION" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              grep -F "VF_TOOL_M3U8_VERSION', '$VERSION'" "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php -l "$SOURCE_DIR/src/vf-tool-m3u8.php"
              php "$SOURCE_DIR/tests/unit/package-physical-locator-contract.php"
              php "$SOURCE_DIR/tests/unit/update-schema-authority-contract.php"
              ;;
          esac
          echo "SOURCE_GATE=PASS"

      - name: Security and package compatibility
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ matrix.version }}
        run: |
          set -Eeuo pipefail
          ! grep -RIlE --exclude-dir=.git -- '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{16,}|sk-[A-Za-z0-9]{20,})' "$SOURCE_DIR" | grep -q .
          ! find "$SOURCE_DIR" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa' -o -name 'id_ed25519' \) -print -quit | grep -q .

          mkdir -p /tmp/pkg
          if [ "$COMPONENT" = "OPS" ]; then
            python3 "$SOURCE_DIR/.github/release/build-ops-package.py"               --source "$SOURCE_DIR" --output "/tmp/pkg/vf-tools-ops_V$VERSION.zip" >/tmp/pkg/meta.json
            unzip -Z1 "/tmp/pkg/vf-tools-ops_V$VERSION.zip" | awk 'NF && $0 !~ /\/$/' | grep -v '^vf-ops/' && exit 1 || true
            unzip -Z1 "/tmp/pkg/vf-tools-ops_V$VERSION.zip" | grep -qx 'vf-ops/vf-ops.php'
          elif [ "$COMPONENT" = "THEME" ]; then
            (cd "$SOURCE_DIR/src" && zip -qr "/tmp/pkg/vf-tools-theme_V$VERSION.zip" .)
            test -s "/tmp/pkg/vf-tools-theme_V$VERSION.zip"
            unzip -Z1 "/tmp/pkg/vf-tools-theme_V$VERSION.zip" | grep -qx 'style.css'
          else
            (cd "$SOURCE_DIR/src" && zip -qr "/tmp/pkg/vf-tools-m3u8_V$VERSION.zip" .)
            test -s "/tmp/pkg/vf-tools-m3u8_V$VERSION.zip"
            unzip -Z1 "/tmp/pkg/vf-tools-m3u8_V$VERSION.zip" | grep -qx 'vf-tool-m3u8.php'
          fi
          echo "SECURITY=PASS"
          echo "UPGRADE_PACKAGE_COMPATIBILITY=PASS"

      - name: Gate summary
        run: |
          echo "TESTING=PASS"
          echo "SECURITY=PASS"
          echo "GIT=PASS"
          echo "UA_UI_SOURCE=PASS"
          echo "NO_REQUIRED_GATE_MISSING=YES"
          echo "FINE_POLISH_R2_INPUT=PASS"
