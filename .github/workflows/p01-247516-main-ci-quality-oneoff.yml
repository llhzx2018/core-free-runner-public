name: P01 2.47.516 merged main GOV architecture Canonical and 3-engine FULL (one-off)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actual-full-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 698a6329a0c5c1ce7464a09b93fabcce04d08d07
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Checkout one-off runner identity auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact 2.47.516 target identity before private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-main-ci-quality.json > "$RUNNER_TEMP/p01-d14-lane.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-main-ci-quality.json \
            --input .github/workflows/p01-247516-main-ci-quality-oneoff.yml > "$RUNNER_TEMP/p01-d14-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-d14-audit.json" >/dev/null
          echo 'P01_D14_TARGET_SOURCE_LANE_AUDIT=PASS'
      - name: Confirm exact test route and synthetic-only data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-main-ci-quality-20261114"
          echo "P01_D14_SCOPE=ISOLATED_EPHEMERAL_FULL_AND_LOCAL_SQL_CONTAINERS"
          echo "P01_D14_PRODUCTION_WRITES=NO"

      - name: Check registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo "P01_D14_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Read exact private candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Exact Git identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d76_deep_business.py
          php8.3 -l candidate/src/app/CoursePackageStore.php
          test -f candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo "P01_D14_EXACT_PRIVATE_HEAD=$TARGET_SHA"

      - name: Prepare isolated actual PHP-FPM Nginx and composer build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3             php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip composer             openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v openssl
          node --version
          npm --version
          php -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(2);'
          php8.3 -l candidate/src/app/next/http/OwnerLoginRoutes.php
          php8.3 -l candidate/src/app/next/runtime/CloudPanelWorkbenchAssets.php
          php8.3 -l candidate/src/app/next/runtime/OwnerWorkbenchAssets.php
          php8.3 -l candidate/src/app/OwnerCatalogMetadata.php
          php8.3 -l candidate/src/app/ToolSceneDetail.php
          php8.3 -l candidate/src/app/NewsFeedService.php
          php8.3 -l candidate/src/app/next/OwnerToolboxManager.php
          php8.3 -l candidate/src/app/next/OwnerPersonalCatalog.php
          php8.3 -l candidate/src/app/next/http/OwnerHttpRoutes.php
          php8.3 -r 'require "candidate/src/app/OwnerCatalogMetadata.php"; if(count(VfOwnerCatalogMetadata::toolSceneDefinitions())!==6||count(VfOwnerCatalogMetadata::newsSourceDefinitions())!==9)exit(17);'
          echo "P01_D75_SHARED_TOOL_NEWS_SINGLE_SOURCE_METADATA=PASS"
          echo "P01_D14_REAL_FPM_NGINX_PDO_AVAILABLE=PASS"

      - name: Build exact-source real self-contained future FULL once
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha $TARGET_SHA             --output "$RUNNER_TEMP/p01-d14-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/p01-d14-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d14-full.zip" \
            --output "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          echo "P01_D74_EXACT_SOURCE_REAL_CLOUDPANEL_ZIP=PASS"

      - name: Validate real Nginx TLS and PHP-FPM SQLite clean FULL browser HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine sqlite
          echo "P01_D14_SQLITE_REAL_FPM_FULL=PASS"

      - name: Validate real MariaDB 11.8 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine mariadb
          echo "P01_D14_MARIADB_REAL_FPM_FULL=PASS"

      - name: Validate real MySQL 8.4 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine mysql
          echo "P01_D14_MYSQL_REAL_FPM_FULL=PASS"

      - name: Private source and generated ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d14-lane.json" "$RUNNER_TEMP/p01-d14-audit.json"
          rm -f -- "$RUNNER_TEMP/p01-d14-full.zip" "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          echo "P01_D14_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D14_TEST_ZIP_PERSISTED=NO"

  exact-source-main-architecture-and-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: 698a6329a0c5c1ce7464a09b93fabcce04d08d07
      STABLE_SHA: ddd9d5dd0325772e2741d7a9e498b043e964c310
      MAIN_SHA: defaf3db8bd94adc9909e1783ec2134e03b44410
    steps:
      - name: Checkout registered public ephemeral lane audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit exact product target before any private checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate \
            --spec scripts/ephemeral/p01-247516-main-ci-quality.json >"$RUNNER_TEMP/p01-canonical-spec.json"
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec scripts/ephemeral/p01-247516-main-ci-quality.json \
            --input .github/workflows/p01-247516-main-ci-quality-oneoff.yml >"$RUNNER_TEMP/p01-canonical-audit.json"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-canonical-audit.json" >/dev/null
          echo 'P01_CANONICAL_EXACT_TARGET_AUDIT=PASS'
      - name: Checkout exact P01 private 2.47.516 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
          fetch-depth: 0
      - name: Checkout immutable released P01 2.47.515 source for debt comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.STABLE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Checkout current GOV-DOC architectural authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Native PHP 8.3 exact source and baseline identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat stable/VERSION)" = "2.47.515"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >>"$RUNNER_TEMP/p01-canonical-apt.txt" 2>&1
          php8.3 -m | grep -Fx pdo_sqlite >/dev/null || php8.3 -m | grep -Fx PDO
          echo 'P01_CANONICAL_NATIVE_PHP_8_3=PASS'
      - name: New GOV-DOC architecture and P01 public authority actual source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate merge-base --is-ancestor "$MAIN_SHA" "$TARGET_SHA" >/dev/null 2>&1; echo $?)" = 0
          python3 -B candidate/.github/checks/test_architecture_gate.py > "$RUNNER_TEMP/p01-architecture-negative.txt" 2>&1 || { echo P01_GOV_ARCH_NEGATIVE=FAIL; exit 1; }
          python3 -B candidate/.github/checks/test_gov_doc_ci.py > "$RUNNER_TEMP/p01-gov-negative.txt" 2>&1 || { echo P01_GOV_SOURCE_NEGATIVE=FAIL; exit 1; }
          python3 -B candidate/tests/test_p01_public_authority_source.py > "$RUNNER_TEMP/p01-public-authority.txt" 2>&1 || { echo P01_PUBLIC_ROUTER=FAIL; exit 1; }
          python3 -B candidate/.github/checks/architecture_gate.py \
            --manifest candidate/.github/checks/code_architecture.json \
            --gov-root gov --git-root candidate \
            --base-sha "$MAIN_SHA" --head-sha "$TARGET_SHA" \
            > "$RUNNER_TEMP/p01-product-architecture.txt" 2>&1 || {
              grep -E 'PROJECT_ARCHITECTURE=BLOCKED|CODE_ARCHITECTURE=BLOCKED' "$RUNNER_TEMP/p01-product-architecture.txt" | head -n 5 || true
              echo P01_GOV_183_REAL_SOURCE=FAIL; exit 1;
            }
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-product-architecture.txt"
          python3 -B candidate/scripts/check_p01_fullstack_contract.py --root candidate > "$RUNNER_TEMP/p01-public-source-check.txt" 2>&1 || {
              grep -E 'P01_STACK_CONTRACT=FAIL' "$RUNNER_TEMP/p01-public-source-check.txt" | head -n 5 || true
              echo P01_PUBLIC_AUTHORITY_PROJECT=FAIL; exit 1;
            }
          echo P01_PUBLIC_AUTHORITY_AND_GOV_183=PASS
      - name: Exact-source post-unit architecture only (reuse unchanged 843 of 843 PHP unit proof)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          raw=Path('candidate/tests/canonical_release_regression.sh').read_text()
          start=raw.index('# Full-stack target and new framework code')
          end=raw.index('echo "P01_CANONICAL_UNIT_REGRESSION=PASS"',start)
          tail=raw[start:end]
          out=[]
          stage=0
          for line in tail.splitlines():
              if line.startswith(('PYTHONDONTWRITEBYTECODE=1 python3','php -l ','php "$CURRENT_ROOT')):
                  stage+=1
                  out.append('echo P01_CANONICAL_POST_UNIT_STAGE_%02d=START'%stage)
              out.append(line)
          out.append('echo P01_CANONICAL_POST_UNIT_ARCH=PASS')
          Path('p01-post-unit.sh').write_text('\n'.join(out)+'\n')
          PY
          export CURRENT_ROOT="$(cd candidate && pwd)"
          export BASELINE_ROOT="$(cd stable && pwd)"
          export TMP_DIR="$RUNNER_TEMP/p01-post-unit"
          mkdir -m 700 -p "$TMP_DIR"
          if ! bash -e p01-post-unit.sh > "$RUNNER_TEMP/p01-post-unit-results.txt" 2>&1; then
            grep -E '^P01_CANONICAL_POST_UNIT_STAGE_[0-9]{2}=START' "$RUNNER_TEMP/p01-post-unit-results.txt" | tail -n 3 || true
            grep -E '^P01_(STACK|D[0-9]{1,3}|MAJOR|DATABASE|CANONICAL)_[A-Z0-9_]+=(FAIL|BLOCKED|NOT_PROVEN)' "$RUNNER_TEMP/p01-post-unit-results.txt" | tail -n 8 || true
            echo P01_CANONICAL_POST_UNIT=FAIL
            exit 1
          fi
          grep -Fx 'P01_CANONICAL_POST_UNIT_ARCH=PASS' "$RUNNER_TEMP/p01-post-unit-results.txt"
          echo P01_CANONICAL_POST_UNIT=PASS
      - name: Always purge private source, logs and temp regression material
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate stable gov p01-post-unit.sh "$RUNNER_TEMP/p01-post-unit"
          rm -f -- "$RUNNER_TEMP"/p01-post-unit-*.txt "$RUNNER_TEMP"/p01-architecture-*.txt "$RUNNER_TEMP"/p01-gov-*.txt "$RUNNER_TEMP"/p01-public-*.txt "$RUNNER_TEMP"/p01-product-*.txt "$RUNNER_TEMP"/p01-canonical-*.txt "$RUNNER_TEMP"/p01-canonical-*.json
          echo 'P01_CANONICAL_PRIVATE_SOURCE_AND_LOG_PERSISTED=NO'
          echo 'P01_CANONICAL_PUBLIC_ARTIFACTS=NONE'
