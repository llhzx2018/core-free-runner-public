name: P05 V1.2.0 Atomic Asset Publication

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v120-atomic-publish-20260901.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v120-atomic-publish-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATOMIC_RUN: '33521531415'
      ATOMIC_JOB: '99901734606'
      ATOMIC_ARTIFACT_ID: '9805894759'
      ATOMIC_ARTIFACT_NAME: P05_V1.2.0_VPS_ATOMIC_7c028651181edbe60110323f9f6806183ff63326
      RELEASE_ID: '380589072'
      RELEASE_TAG: v1.2.0
      RELEASE_TARGET: 8fd6ea22f237eac891bdd0e336947d587560dc75
      FULL_NAME: VF_SEO_V1.2.0_FULL.zip
      FULL_SHA256: 5ce491394083fbe35b4e72a076e44d601979b1fdc05885a344ab47a7d4d666c4
      UPDATE_SHA256: 3b072e29242a9c7a116f9c366104d44ad9100297c04efd2ee284a2a17bfff82a
      UPDATE_BYTES: '1165612'
      REPAIR_SHA256: c49f6e9dfce42cc7fee56f4e9c7b766659bf44f2d719e32729870e3543de5aa6
      REPAIR_BYTES: '3660822'
      SELFTEST_SHA256: 94a345588cf2cf56bf0593aa00ac03b6ad35fdd3610839c24c99d3b9706df462
    steps:
      - name: Bind exact Atomic PASS and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ATOMIC_ARTIFACT_ID" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); art=json.load(open('/tmp/artifact.json'))
          assert run['id']==int(os.environ['ATOMIC_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['ATOMIC_JOB']) and job['run_id']==int(os.environ['ATOMIC_RUN']) and job['conclusion']=='success' and job['name']=='atomic'
          assert art['id']==int(os.environ['ATOMIC_ARTIFACT_ID']) and art['name']==os.environ['ATOMIC_ARTIFACT_NAME'] and not art['expired']
          print('P05_V120_ATOMIC_EVIDENCE_BINDING=PASS')
          PY

      - name: Download exact Atomic evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic
          gh run download "$ATOMIC_RUN" --repo llhzx2018/core-free-runner-public --name "$ATOMIC_ARTIFACT_NAME" --dir /tmp/p05-atomic
          find /tmp/p05-atomic -maxdepth 2 -type f -printf '%f\n' | sort

      - name: Verify exact six Atomic assets
        run: |
          set -Eeuo pipefail
          cd /tmp/p05-atomic
          for f in repair-v1.2.0.php VF_SEO_V1.2.0_UPDATE.zip atomic-self-test.json P05-V1.2.0-ATOMIC-METADATA.json P05-V1.2.0-ATOMIC-GATE.json SHA256SUMS.txt; do test -s "$f"; done
          test "$(sha256sum VF_SEO_V1.2.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c%s VF_SEO_V1.2.0_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum repair-v1.2.0.php | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(stat -c%s repair-v1.2.0.php)" = "$REPAIR_BYTES"
          test "$(sha256sum atomic-self-test.json | awk '{print $1}')" = "$SELFTEST_SHA256"
          python3 - <<'PY'
          import json
          gate=json.load(open('P05-V1.2.0-ATOMIC-GATE.json'))
          meta=json.load(open('P05-V1.2.0-ATOMIC-METADATA.json'))
          assert gate['project_id']=='P05' and gate['source_version']=='1.1.12' and gate['target_version']=='1.2.0' and gate['result']=='PASS'
          for k in ['self_test','actual_upgrade','data_preservation','idempotence','rollback','interruption_recovery','browser_single_php','proxy_https_same_origin']:
              assert gate[k]=='PASS', (k,gate.get(k))
          assert gate['production_write']==0 and gate['distribution_revision']=='R2'
          assert meta['source_version']=='1.1.12' and meta['target_version']=='1.2.0' and meta['status']=='FORMAL_ATOMIC_ARTIFACT_GATE_PASS'
          assert meta['proxy_https_same_origin']=='PASS' and meta['distribution_revision']=='R2' and meta['production_write']==0
          print('P05_V120_ATOMIC_SIX_ASSETS_LOCAL=PASS')
          PY
          sha256sum repair-v1.2.0.php VF_SEO_V1.2.0_UPDATE.zip atomic-self-test.json P05-V1.2.0-ATOMIC-METADATA.json P05-V1.2.0-ATOMIC-GATE.json SHA256SUMS.txt > /tmp/local-six.sha256
          cat /tmp/local-six.sha256

      - name: Verify formal Release before supplemental write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          forbidden=['repair-v1.2.0.php','VF_SEO_V1.2.0_UPDATE.zip','atomic-self-test.json','P05-V1.2.0-ATOMIC-METADATA.json','P05-V1.2.0-ATOMIC-GATE.json','SHA256SUMS.txt']
          assert all(x not in a for x in forbidden), [x for x in forbidden if x in a]
          print('P05_V120_RELEASE_PRE_SUPPLEMENT=PASS')
          PY

      - name: Publish exact Atomic assets to v1.2.0 Release
        working-directory: /tmp/p05-atomic
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" --repo llhzx2018/vf-seo \
            VF_SEO_V1.2.0_UPDATE.zip \
            repair-v1.2.0.php \
            atomic-self-test.json \
            P05-V1.2.0-ATOMIC-METADATA.json \
            P05-V1.2.0-ATOMIC-GATE.json \
            SHA256SUMS.txt
          echo 'P05_V120_ATOMIC_RELEASE_UPLOAD=PASS'

      - name: Remote readback all v1.2.0 Release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os,hashlib,pathlib
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.0.php','VF_SEO_V1.2.0_UPDATE.zip','atomic-self-test.json','P05-V1.2.0-ATOMIC-METADATA.json','P05-V1.2.0-ATOMIC-GATE.json','SHA256SUMS.txt']
          for name in names:
              p=pathlib.Path('/tmp/p05-atomic')/name
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert a[name]['digest']=='sha256:'+digest, (name,a[name].get('digest'),digest)
              assert a[name]['size']==p.stat().st_size
              print(f'P05_ASSET_{name}_ID={a[name]["id"]}')
          assert a['VF_SEO_V1.2.0_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          assert a['repair-v1.2.0.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V120_ATOMIC_RELEASE_REMOTE_READBACK=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY
