name: P05 V1.0.1 Release Authority Closure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p05-v101-release-authority-closure-20260828.yml'
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Close release authority without claiming Production
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-seo.git" p05 >/dev/null 2>&1
          cd p05
          git checkout governance/p05-v1.0.1-release-closure-20260828
          test "$(git rev-parse HEAD)" = "60cb19c38f3167bd007c6c99b06fe6654a93b201"
          test "$(git rev-parse origin/main)" = "60cb19c38f3167bd007c6c99b06fe6654a93b201"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('VF_PROJECT.json'); d=json.loads(p.read_text())
          d['status']='V1.0.1_RELEASED_DEPLOYMENT_READY_PRODUCTION_NOT_DEPLOYED'
          d['formal_release']='v1.0.1'
          d['formal_release_state']='RELEASED'
          d['formal_release_id']=378275560
          d['formal_release_asset']='VF_SEO_V1.0.1_FULL.zip'
          d['formal_release_asset_id']=533298329
          d['formal_release_asset_bytes']=469642
          d['formal_release_asset_sha256']='ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c'
          d['release_publication']={
            'state':'PASS','repository':'llhzx2018/core-free-runner-public',
            'workflow':'.github/workflows/p05-v101-publication-20260828.yml',
            'run':33144684468,'job':98763025984,
            'release_id':378275560,'tag':'v1.0.1',
            'tag_source':'00a724587c041130c0e81e0e45ef876413fb2916',
            'full_asset_id':533298329,
            'full_asset_sha256':'ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c',
            'distribution':'core-updates/projects/P05.json',
            'distribution_mode':'FULL_ONLY','from_versions':[]
          }
          d['production_version']=None
          d['production_deployment']='NOT_DEPLOYED'
          d['production_write']=0
          d['production_main_promotion']='NOT_APPLICABLE_NO_PRODUCTION_RUNTIME'
          d['owner_real_use_review']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['owner_real_use_pass']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['production_deployment_authorization']='NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          d['next_action']='FIRST_PRODUCTION_DEPLOYMENT_WHEN_OWNER_PROVISIONS_RUNTIME / OTHERWISE P06'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          q=pathlib.Path('docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'); a=json.loads(q.read_text())
          assert a['state']=='CURRENT' and a['version']=='1.0.1' and a['schema_version']==1
          assert a['machine_verification']['state']=='PASS'
          a['release_executed']=True
          a['production_changed']=False
          a['release_evidence']={
            'state':'PASS','release_tag':'v1.0.1','release_id':378275560,
            'release_source_sha':'00a724587c041130c0e81e0e45ef876413fb2916',
            'publication_run_id':33144684468,'publication_job_id':98763025984,
            'full_asset':'VF_SEO_V1.0.1_FULL.zip','full_asset_id':533298329,
            'full_asset_bytes':469642,'full_asset_sha256':'ac36676612163c10006515eaa4f3265d01351425b4121c53be6d2bbe2dd92a0c',
            'distribution_mode':'FULL_ONLY','from_versions':[],
            'production_state':'NOT_DEPLOYED',
            'production_verification':'NOT_APPLICABLE_UNTIL_FIRST_DEPLOYMENT'
          }
          q.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 -m json.tool docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json >/dev/null
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'VF_PROJECT.json'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'
          git diff --check
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json')); a=json.load(open('docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json'))
          assert d['status']=='V1.0.1_RELEASED_DEPLOYMENT_READY_PRODUCTION_NOT_DEPLOYED'
          assert d['formal_release_state']=='RELEASED' and d['formal_release_id']==378275560
          assert d['production_version'] is None and d['production_deployment']=='NOT_DEPLOYED' and d['production_write']==0
          assert d['release_publication']['distribution_mode']=='FULL_ONLY' and d['release_publication']['from_versions']==[]
          assert a['state']=='CURRENT' and a['release_executed'] is True and a['production_changed'] is False
          assert a['release_evidence']['production_state']=='NOT_DEPLOYED' and a['release_evidence']['from_versions']==[]
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION.json
          git commit -m 'docs(P05): close V1.0.1 formal release authority'
          git push origin HEAD:governance/p05-v1.0.1-release-closure-20260828
          echo P05_V101_RELEASE_AUTHORITY_CLOSURE=PASS
