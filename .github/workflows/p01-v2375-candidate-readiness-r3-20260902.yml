name: P01 V2.37.5 Candidate Readiness R3
on:
  push:
    branches: [release/p01-v2375-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2375-candidate-readiness-r3-20260902.yml
permissions:
  actions: read
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 90ae8cd7b1681db894356fa590ec9e807cb1ab77
      CANDIDATE_TREE: c49eb771267cc4d5d4c755741686fb9ac8928b7a
      CANDIDATE_RUNTIME_TREE: 467c56faa900a6bfcc7caadd0fd570b9c6a76567
      SOURCE: 4532e6443805cefe141efc1f70f1689e532450b9
      SOURCE_TREE: b2c5ac50e07c851dc960bbc0d2b04f33271346cb
      SOURCE_RUNTIME_TREE: 369f24a5320b9c7ebbb950a06c2711b8ca3b4f93
      VERSION: 2.37.5
      SOURCE_VERSION: 2.37.4
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2375-candidate-artifacts
      EVID: /tmp/p01-v2375-candidate-evidence
      UPGRADE: /tmp/p01-v2375-upgrade
      FRESH: /tmp/p01-v2375-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2373-hotfix-20260902
          path: prior
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.4
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Verify prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT" "$EVID" "$UPGRADE" "$FRESH"
          for run in 33608249098 33608705736 33609124506 33609483255; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
      - name: Generate readiness gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('prior/scripts/p01_v2373_candidate_readiness_generate.py').read_text(encoding='utf-8')
          s=s.replace('2.37.2','__SOURCE_VERSION__')
          s=s.replace('2.37.3','2.37.5').replace('V2.37.3','V2.37.5').replace('v2.37.3','v2.37.5')
          s=s.replace('__SOURCE_VERSION__','2.37.4')
          s=s.replace('p01-v2373','p01-v2375').replace('P01_V2373','P01_V2375').replace('v2_37_3','v2_37_5')
          Path('/tmp/p01_v2375_generate.py').write_text(s,encoding='utf-8')
          PY
          python3 /tmp/p01_v2375_generate.py
      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C candidate rev-parse HEAD:src)" = "$CANDIDATE_RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C production rev-parse HEAD:src)" = "$SOURCE_RUNTIME_TREE"
          test "$(cat candidate/VERSION)" = "$VERSION"
          test "$(cat production/VERSION)" = "$SOURCE_VERSION"
          test "$(git -C candidate rev-parse HEAD:database)" = "$(git -C production rev-parse HEAD:database)"
          actual=$(git -C candidate diff --name-only "$SOURCE" "$CANDIDATE" -- src | sort)
          expected=$(printf '%s\n' src/VERSION.txt src/app/FunctionalWorkspaceShell.php src/app/bootstrap.php src/assets/surface-workspace.css src/assets/workspace.js | sort)
          test "$actual" = "$expected"
          cmp candidate/src/app/ResourceCoverCache.php production/src/app/ResourceCoverCache.php
          test -z "$(git -C candidate diff --name-only "$SOURCE" "$CANDIDATE" -- database migrations)"
          printf 'EXACT_SOURCE=PASS\nRUNTIME_DELTA=5_FILES\nREMOTE_FETCH_POLICY_UNCHANGED=YES\n' | tee "$EVID/exact.txt"
      - name: Diagnostics UX contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          node --check candidate/src/assets/workspace.js
          grep -F 'data-cover-refresh-id' candidate/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'data-cover-diagnostic' candidate/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'vf-cover-retry:v6:${id}' candidate/src/assets/workspace.js >/dev/null
          grep -F "if(manual)markCoverRetry(id,false)" candidate/src/assets/workspace.js >/dev/null
          grep -F "coverDiagnostic(id,item.success?'':error)" candidate/src/assets/workspace.js >/dev/null
          cmp candidate/src/app/ResourceCoverCache.php production/src/app/ResourceCoverCache.php
      - name: Build deterministic candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT" "$EVID" "$UPGRADE" "$FRESH"
          bash /tmp/p01-v2375-generated/02-build.sh
      - name: Actual V2.37.4 to V2.37.5 Atomic upgrade
        run: bash /tmp/p01-v2375-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2375-generated/04-fresh.sh
      - name: Final candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.5
          jq -e '.production_version=="2.37.4" and .published_release.version=="2.37.4" and .production_release.version=="2.37.4" and .candidate_version=="2.37.5" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2375_CANDIDATE_READINESS_R3=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSOURCE=%s\nSCHEMA=%s\nATOMIC_2374_TO_2375=PASS\nFRESH_INSTALL=PASS\nPERSISTENT_ERROR_SURFACE=PASS\nMANUAL_RETRY=PASS\nREMOTE_FETCH_POLICY_UNCHANGED=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2375-candidate-readiness-r3-${{ github.run_id }}
          path: |
            /tmp/p01-v2375-candidate-artifacts
            /tmp/p01-v2375-candidate-evidence
          if-no-files-found: warn
          retention-days: 90
