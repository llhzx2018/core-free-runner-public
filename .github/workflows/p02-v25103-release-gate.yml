name: P02 V2.5.103 Formal Release Gate

on:
  push:
    branches:
      - run/p02-v25103-release-gate-20260924
    paths:
      - '.github/workflows/p02-v25103-release-gate.yml'
      - 'requests/p02-v25103-release-gate.sh'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.103 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: b1c704900f15776a96d3e8930ec61c2ff64ae02f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout V2.5.81 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 9290f8d583312524b728288a39f9c493654ccce6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old81-src

      - name: Checkout V2.5.82 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0411c3fbf36a896f0aaaa693e7f077ac9acfb143
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old82-src

      - name: Checkout V2.5.102 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 430d0e7d7a1f47e2d444f57ac615e6bdabb53823
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old102-src

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "b1c704900f15776a96d3e8930ec61c2ff64ae02f"
          test "$(git show -s --format=%T HEAD)" = "8d9c432a9e8bbcac2da2359cbf1a1cb05d79a61b"
          test "$(cat VERSION)" = "2.5.103"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          bash -n scripts/verify-release-artifacts.sh
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25103_EXACT_SOURCE=PASS

      - name: Maintenance clean FULL browser E2E privacy
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25103-MAINT-${{ github.run_id }}!"
          EVIDENCE_DIR: "${{ runner.temp }}/p02-v25103-maintenance"
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V25103_MAINTENANCE_BROWSER=PASS

      - name: Deterministic formal release preflight
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25103-RELEASE-${{ github.run_id }}!"
          VF_RELEASE_SOURCE_SHA: b1c704900f15776a96d3e8930ec61c2ff64ae02f
          VF_RELEASE_SOURCE_TREE: 8d9c432a9e8bbcac2da2359cbf1a1cb05d79a61b
          VF_RELEASE_SOURCE_REF: work/p02-v25103-inkstone-final-ux-convergence-20260924
          VF_RELEASE_FROM_VERSIONS: "2.5.81 2.5.82 2.5.102"
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_V25103_RELEASE_PREFLIGHT=PASS

      - name: Real-data direct upgrade matrix
        env:
          TEST_PASSWORD: "VF-P02-V25103-UPGRADE-${{ github.run_id }}!"
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25103-release-gate.sh

      - name: Final release gate marker
        run: echo P02_V25103_FORMAL_RELEASE_GATE=PASS
