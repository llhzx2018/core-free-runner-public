name: P03 V1.35.3 Formal Release Publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1353-formal-release-publish.yml'
permissions:
  contents: read
concurrency:
  group: p03-v1353-formal-release-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_COMMIT: 370c699d4e105a9035393bcfb4e0aef982131cde
      CANDIDATE_TREE: 2652978e8f31f7d3fcc1ec3a315be15c0ce4066d
      PRODUCTION_COMMIT: c074678fdad9856addb3d290b555b723ce7013ec
      GATE_FULL_SHA: c3a23cc446770205cda345df9473ba6b285143db4b245813be043885c7352196
      GATE_FULL_BYTES: '462462'
      GATE_UPDATE_SHA: 451f49d420eaf1833b6ac4f6064eda255ad5380999f093e9e153b298d29a65f3
      GATE_UPDATE_BYTES: '718446'
      GATE_ATOMIC_SHA: 451f49d420eaf1833b6ac4f6064eda255ad5380999f093e9e153b298d29a65f3
      GATE_ATOMIC_BYTES: '718446'
      GATE_SOURCE_MANIFEST_SHA: de7389f9fc1c84188558ac948d02fef45ba1681f3e355087a7c913a049080f06
    steps:
      - name: Checkout public release harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: harness
      - name: Require governed release credential
        shell: bash
        env:
          T: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$T"
          R=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $T" -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/llhzx2018/vf-forge)
          python3 -c 'import json,sys; p=(json.load(sys.stdin).get("permissions") or {}); assert p.get("pull") and p.get("push") and p.get("admin"); print("VF_FORGE_RELEASE_CREDENTIAL=PASS")' <<<"$R"
      - name: Checkout exact private Candidate ephemerally
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: 370c699d4e105a9035393bcfb4e0aef982131cde
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p03
      - name: Prepare formal build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-zip unzip zip >/dev/null
          php -v | head -1
          python3 --version
      - name: Apply release transport correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 harness/scripts/patch_p03_v1353_release_transport.py
          bash -n harness/scripts/p03_v1353_formal_release.sh
      - name: Governed deterministic build, exact Tag, verified Draft Release, publish and readback
        shell: bash
        env:
          VF_RELEASE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          chmod +x harness/scripts/p03_v1353_formal_release.sh
          bash harness/scripts/p03_v1353_formal_release.sh
      - name: Confirm public runner persisted no release artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          RESP=$(curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
          COUNT=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["total_count"])' <<<"$RESP")
          test "$COUNT" = '0'
          echo 'PUBLIC_RUNNER_ACTIONS_ARTIFACTS=0'
