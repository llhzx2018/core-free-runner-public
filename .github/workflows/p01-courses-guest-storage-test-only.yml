name: P01 Courses guest storage isolation test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-courses-guest-storage-test-only.yml']
permissions:
  contents: read
jobs:
  courses-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout existing public gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f864cd862516928360c533aee225690bf146b3a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip,openssl
          coverage: none
      - name: Exact course guest/owner state and reader/GOV-BOOK regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "f864cd862516928360c533aee225690bf146b3a5"
          php -l product/src/app/CourseLibraryPage.php
          php -l product/tests/unit/course_guest_owner_storage_contract.php
          node --check product/src/assets/course-experience.js
          node --check product/tests/unit/course_guest_owner_storage_isolation_native.js
          (cd product && node tests/unit/course_guest_owner_storage_isolation_native.js)
          for t in \
            course_guest_owner_storage_contract.php \
            course_continue_context_contract.php \
            course_reader_resume_visibility_contract.php \
            course_unique_book_stats_contract.php \
            course_personal_study_r1_contract.php \
            course_workspace_presentation_contract.php \
            course_catalog_pairing_runtime.php \
            course_paired_state_fallback_contract.php \
            course_reader_header_notes_contract.php \
            course_reader_longform_contract.php \
            course_markdown_reader_contract.php \
            courses_page_context_closure_contract.php \
            courses_page_full_polish_contract.php \
            courses_v247160_learning_index_contract.php \
            courses_v247172_browse_first_r13_contract.php \
            courses_v247173_whole_tile_open_r14_contract.php \
            gov_book_canonical_cover_art_contract.php \
            gov_book_course_progress_runtime.js; do
            case "$t" in
              *.js) (cd product && node "tests/unit/$t");;
              *) php "product/tests/unit/$t";;
            esac
          done
          echo P01_COURSES_EXACT_SOURCE_GUEST_OWNER=PASS
      - name: Remove ephemeral private source
        if: always()
        shell: bash
        run: rm -rf product
