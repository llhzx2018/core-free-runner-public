name: TEMP P07 M03 installed DEV D01 D02 D03
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-installed-dev-temporary.yml']
permissions:
  contents: read
jobs:
  installed-business:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.triggering_actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-m03-installed-dev-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SOURCE: 829d4fb55d7b06e2dd1397d673cc7a502a1ea83a
      TREE: 325cbb1ba4e0dfb01895036548ab060f068d6a87
      BUILD: 0.1.0-release146-dev829d4fb5
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 829d4fb55d7b06e2dd1397d673cc7a502a1ea83a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m03-source
      - name: Compose DEV-only scoped overlay on authentic immutable M03 release146 and install
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cd m03-source
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          test -z "$(git status --porcelain)"
          work=$(mktemp -d "$RUNNER_TEMP/p07-m03-installed.XXXXXX")
          printf '%s\n' "$work" > "$RUNNER_TEMP/p07-m03-installed-owned-$GITHUB_RUN_ID"
          export WORK="$work"
          curl --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 -fsSL \
            https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release146-20261122/P07-M03-0.1.0-release146.zip -o "$work/official.zip"
          echo "7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321  $work/official.zip" | sha256sum -c >/dev/null
          python3 -B - <<'PY'
          import hashlib, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          work=Path(os.environ['WORK']); src=Path.cwd()
          prefix='dist/p07/0.1.0/overlay/'
          manifest=prefix+'RUNTIME.gitblob'
          installer='installers/p07-final.sh'
          base='dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz'
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          with zipfile.ZipFile(work/'official.zip') as z:
              infos=z.infolist(); names=[i.filename for i in infos]
              assert 50<=len(infos)<=240 and len(set(names))==len(names)
              assert sum(i.file_size for i in infos)<110*1024*1024
              for i in infos:
                  assert stat.S_IFMT(i.external_attr>>16)==stat.S_IFREG and i.file_size<64*1024*1024
                  assert not i.is_dir() and not i.filename.startswith('/') and '\\' not in i.filename and '..' not in PurePosixPath(i.filename).parts
              files={i.filename:z.read(i) for i in infos}
          assert blob(files[manifest])=='78caa4b85edc5441039483117e3f9660cf6e3af6'
          assert blob(files[installer])=='878135473e5b2bfaf7fe104821efb36121667f0f'
          rows={}
          for line in files[manifest].decode('ascii').splitlines():
              m=re.fullmatch(r'([a-f0-9]{40})  ((?:bin|lib|components)/[A-Za-z0-9_./-]+|BUILD_ID)',line)
              assert m and m[2] not in rows and '..' not in PurePosixPath(m[2]).parts
              assert blob(files[prefix+m[2]])==m[1]
              rows[m[2]]=m[1]
          assert set(files)=={prefix+n for n in rows}|{manifest,installer,base}
          assert files[prefix+'BUILD_ID']==b'0.1.0-release146\n'
          prior=dict(files)
          change={'bin/vfops-site-ui':'66a37cb5c8c538b5ebf3db2f6994c740b9ef78f0',
                  'lib/package_core.py':'6c03e27bde76f8bfaa9e12a1d9bd5118811b520c'}
          for n,digest in change.items():
              assert n in rows
              data=(src/n).read_bytes();assert blob(data)==digest
              files[prefix+n]=data
          # Unchanged runtime dependencies are independently compared. D04 stays
          # the immutable official release146 runtime, not the frozen RC5 trial.
          checked=['lib/inventory.py','lib/package.py','lib/restore.py','lib/restore_apply.py',
                   'lib/restore_apply_core.py','lib/terminal_ui.sh','lib/restore_failure_ui.sh',
                   'bin/vfops','lib/cloudpanel.py']
          matches=sum(n in rows and files[prefix+n]==(src/n).read_bytes() for n in checked)
          print(f'P07_M03_D01_D03_SUPPORT_FILE_MATCH={matches}/{len(checked)}',flush=True)
          files[prefix+'BUILD_ID']=(os.environ['BUILD']+'\n').encode('ascii')
          files[manifest]=''.join(blob(files[prefix+n])+'  '+n+'\n' for n in sorted(rows)).encode('ascii')
          script=files[installer]
          for old,new in ((b'EXPECTED_BUILD_ID="0.1.0-release146"',('EXPECTED_BUILD_ID="'+os.environ['BUILD']+'"').encode()),
                          (b'RUNTIME_MANIFEST_BLOB="78caa4b85edc5441039483117e3f9660cf6e3af6"',('RUNTIME_MANIFEST_BLOB="'+blob(files[manifest])+'"').encode())):
              assert script.count(old)==1;script=script.replace(old,new)
          files[installer]=script
          allowed={prefix+n for n in change}|{prefix+'BUILD_ID',manifest,installer}
          assert all(files[n]==v for n,v in prior.items() if n not in allowed)
          dest=work/'candidate';dest.mkdir(mode=0o700)
          for n,data in files.items():
              p=dest/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          archive=work/'candidate.zip'
          with zipfile.ZipFile(archive,'x',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n,data in sorted(files.items()):
                  info=zipfile.ZipInfo(n,(2026,11,28,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(stat.S_IFREG|0o644)<<16;z.writestr(info,data)
          print('P07_M03_OFFICIAL146_AUTHENTIC_AND_UNCHANGED_D04=PASS',flush=True)
          print('P07_M03_DEV_OVERLAY_SOURCE='+os.environ['SOURCE']+'; TREE='+os.environ['TREE'],flush=True)
          print('P07_M03_DEV_ZIP_SHA256='+hashlib.sha256(archive.read_bytes()).hexdigest(),flush=True)
          print('P07_M03_SCOPE=SIGNED_RELEASE146_PLUS_EXACT_TWO_FILE_DEV_OVERLAY_NOT_FULL_SOURCE_TREE',flush=True)
          PY
          bash -n "$work/candidate/installers/p07-final.sh"
          P07_ALLOW_NONROOT=1 P07_NO_EXEC=1 P07_INSTALL_DIR="$work/installed" \
            P07_PREVIOUS_DIR="$work/previous" P07_BIN_LINK="$work/vfops" \
            P07_PUBLIC_ROOT="file://$work/candidate" \
            bash "$work/candidate/installers/p07-final.sh" > "$work/install.log" 2>&1
          test "$(cat "$work/installed/BUILD_ID")" = "$BUILD"
          test "$(git hash-object "$work/installed/bin/vfops-site-ui")" = 66a37cb5c8c538b5ebf3db2f6994c740b9ef78f0
          test "$(git hash-object "$work/installed/lib/package_core.py")" = 6c03e27bde76f8bfaa9e12a1d9bd5118811b520c
          echo P07_M03_REAL_SCOPED_DEV_INSTALL=PASS
      - name: Use actual installed website menu and fresh verified backup
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          read -r work < "$RUNNER_TEMP/p07-m03-installed-owned-$GITHUB_RUN_ID"
          [[ "$work" == "$RUNNER_TEMP"/p07-m03-installed.* && -d "$work" && ! -L "$work" ]]
          # Synthetic metadata on an otherwise unmodified disposable host.
          fixture="p07-dev-sites-$GITHUB_RUN_ID"
          [[ ! -e /home/clp && ! -L /home/clp && ! -e "/home/$fixture" && ! -L "/home/$fixture" ]]
          printf '%s\n' "$fixture" > "$work/fixture-owned"
          sudo -n python3 -B - "$fixture" <<'PY'
          import sqlite3,sys
          from pathlib import Path
          user=sys.argv[1]
          panel=Path('/home/clp/htdocs/app/data/db.sq3');panel.parent.mkdir(parents=True)
          with sqlite3.connect(panel) as c:
              c.executescript('CREATE TABLE site(id INTEGER PRIMARY KEY, domain_name TEXT, user TEXT,type TEXT,vhost_template TEXT);CREATE TABLE php_settings(site_id INT,php_version TEXT);CREATE TABLE database(site_id INT,name TEXT,user_name TEXT,password TEXT);')
              for i in range(1,23):
                  domain=f'p07-site-{i:02}.test'
                  site=Path('/home')/user/'htdocs'/domain;site.mkdir(parents=True)
                  (site/'index.html').write_text(f'synthetic site {i}\n')
                  c.execute('INSERT INTO site VALUES(?,?,?,?,?)',(i,domain,user,'static','Generic'))
          PY
          sudo -n sha256sum /home/clp/htdocs/app/data/db.sq3 > "$work/panel-before"
          sudo -n find "/home/$fixture" -type f -exec sha256sum {} + | sort > "$work/sites-before"
          ui="$work/installed/bin/vfops-site-ui"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 "$work/installed/bin/vfops" inventory --compact > "$work/inventory.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1]));assert len(p["sites"])==22 and p["summary"]["site_count"]==22' "$work/inventory.json"
          echo P07_M03_INSTALLED_ACTUAL_SYNTHETIC_ASSET_INVENTORY_22=PASS
          for width in 40 80; do
            printf 'n\n0\n' | sudo -n script -qfec "stty cols $width rows 24; env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 TERM=dumb VFOPS_BACKUP_DIR='$work/backups' bash '$ui' backup" "$work/cancel-$width.tty" > "$work/cancel-$width.log" 2>&1
            grep -Fq '网站 5—8 / 22' "$work/cancel-$width.log"
            test ! -e "$work/backups"
            echo "P07_M03_INSTALLED_PAGE_AND_CANCEL_$width=PASS"
          done
          printf 'n\n5\ny\n\n' | sudo -n script -qfec "stty cols 80 rows 24; env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 TERM=dumb VFOPS_BACKUP_DIR='$work/backups' bash '$ui' backup" "$work/backup.tty" > "$work/backup.log" 2>&1
          grep -Fq '备份完成 · 完整性校验通过' "$work/backup.log"
          sudo -n python3 -B - "$work/backups" <<'PY'
          import json,sys,tarfile
          from pathlib import Path
          base=Path(sys.argv[1]);rows=list(base.glob('*/manifest.json'));assert len(rows)==1
          p=rows[0].parent;m=json.loads(rows[0].read_text())
          assert m['site']['domain']=='p07-site-05.test'
          assert json.loads((p/'verification.json').read_text())['status']=='PASS'
          with tarfile.open(p/m['contents']['files_archive']) as a:
              assert a.extractfile('site/index.html').read()==b'synthetic site 5\n'
          PY
          echo P07_M03_INSTALLED_D02_ACTUAL_SELECTED_SITE_BACKUP=PASS
          printf '1\n2\n\n' | sudo -n script -qfec "stty cols 80 rows 24; env PYTHONDONTWRITEBYTECODE=1 NO_COLOR=1 TERM=dumb VFOPS_BACKUP_DIR='$work/backups' bash '$ui' restore" "$work/restore.tty" > "$work/restore.log" 2>&1
          grep -Fq '当前服务器不能按原域名接收这个备份' "$work/restore.log"
          sudo -n sha256sum -c "$work/panel-before" >/dev/null
          sudo -n find "/home/$fixture" -type f -exec sha256sum {} + | sort > "$work/sites-after"
          cmp "$work/sites-before" "$work/sites-after"
          echo P07_M03_INSTALLED_D03_EXISTING_SITE_REFUSAL_AND_SOURCE_PROTECTION=PASS
      - name: Always remove owned private source and fixtures
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          f="$RUNNER_TEMP/p07-m03-installed-owned-$GITHUB_RUN_ID"
          if [[ -f "$f" && ! -L "$f" ]]; then
            read -r work < "$f"
            [[ "$work" == "$RUNNER_TEMP"/p07-m03-installed.* && -d "$work" && ! -L "$work" ]]
            if [[ -f "$work/fixture-owned" && ! -L "$work/fixture-owned" ]]; then
              read -r fixture < "$work/fixture-owned"
              [[ "$fixture" == "p07-dev-sites-$GITHUB_RUN_ID" && ! -L "/home/$fixture" && ! -L /home/clp ]]
              sudo -n rm -rf -- "/home/$fixture" /home/clp
              test ! -e "/home/$fixture"; test ! -e /home/clp
            fi
            sudo -n rm -rf -- "$work"
            test ! -e "$work"; rm -- "$f"
          fi
          p="$GITHUB_WORKSPACE/m03-source"
          [[ ! -L "$p" ]]
          rm -rf -- "$p"
          test ! -e "$p"
          echo P07_M03_OWNED_FIXTURE_RUNTIME_PRIVATE_CHECKOUT_CLEANUP=PASS
