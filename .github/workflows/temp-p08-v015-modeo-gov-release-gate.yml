name: TEMP P08 v015 GOV Mode O exact governance machine gate
on:
  pull_request:
    paths:
      - '.github/workflows/temp-p08-v015-modeo-gov-release-gate.yml'
permissions:
  contents: read
jobs:
  exact-governance-gate:
    name: P08 v015 Mode O governance exact-source verification
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only approved exact GOV-DOC PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 84c478a99e74a64bfade5f91e17033d72a34231d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov
          persist-credentials: false
          fetch-depth: 0
      - name: Execute existing canonical governance checks and negative fixtures
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          export PR_BODY="$(python3 - <<'PY'
          import json,os,urllib.request
          url="https://api.github.com/repos/llhzx2018/gov-doc/pulls/195"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_READ_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"VF-governance-read-only"})
          with urllib.request.urlopen(req,timeout=25) as f: j=json.load(f)
          assert j["head"]["sha"]=="84c478a99e74a64bfade5f91e17033d72a34231d"
          assert j["base"]["sha"]=="70aef9ac061671546d408740b35b999e0ee7b866"
          print(j["body"])
          PY
          )"
          set -Eeuo pipefail
          set +x
          test "$(git -C gov rev-parse HEAD)" = "84c478a99e74a64bfade5f91e17033d72a34231d"
          cd gov
          test "$(git rev-parse 70aef9ac061671546d408740b35b999e0ee7b866)" = "70aef9ac061671546d408740b35b999e0ee7b866"
          test "$(git diff --name-only 70aef9ac061671546d408740b35b999e0ee7b866 HEAD | wc -l)" -eq 4
          test -f skills/skill-release/V3.14/SKILL.md
          grep -Fq 'skill-release | V3.14' CURRENT.md
          grep -Fq 'skill-release | V3.14' skills/README.md
          grep -Fq 'Mode O' skills/skill-release/V3.14/SKILL.md
          test -f governance/release/cases/P08_ADOPS_015_CLEAN_FULL_ONLY_POST_RELEASE_OWNER_MANUAL_20261117.md
          echo 'P08_GOV195_SOURCE_AND_SCOPE=PASS'
          python3 -B governance/agent/takeover_context_budget_lint.py
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 70aef9ac061671546d408740b35b999e0ee7b866 --git-head 84c478a99e74a64bfade5f91e17033d72a34231d
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 70aef9ac061671546d408740b35b999e0ee7b866 --git-head 84c478a99e74a64bfade5f91e17033d72a34231d
          python3 -B governance/catalog/tools/doc_structure_lint.py
          python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_router_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_skill_bridge_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_system_install_upgrade_contract_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_task_delivery_contract_lint.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tests -p 'test_first_release_upgrade_evidence.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_test_reuse_growth_gate.py' -q
          echo 'P08_GOV195_EXISTING_CANONICAL_AND_NEGATIVE_MACHINE_GATES=PASS'
      - name: Remove private transient governance checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- gov
          echo 'PRIVATE_CHECKOUT_CLEANED=YES'
