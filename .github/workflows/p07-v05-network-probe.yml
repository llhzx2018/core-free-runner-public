name: P07 OneShot v0.5 Network Probe

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v05-network-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Ookla CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz -o /tmp/speedtest.tgz
          echo '5690596c54ff9bed63fa3732f818a05dbc2db19ad36ed68f21ca5f64d5cfeeb7  /tmp/speedtest.tgz' | sha256sum -c -
          tar -xzf /tmp/speedtest.tgz -C /tmp speedtest
          chmod +x /tmp/speedtest
          /tmp/speedtest --version
      - name: Probe server-id versus host fallback
        shell: bash
        run: |
          set +e
          probe() {
            label="$1"; shift
            echo "===== ${label} ====="
            timeout 45s /tmp/speedtest --progress=no --accept-license --accept-gdpr --format=json "$@" >/tmp/out 2>/tmp/err
            rc=$?
            echo "rc=${rc}"
            echo 'stdout:'
            head -c 800 /tmp/out; echo
            echo 'stderr:'
            head -c 800 /tmp/err; echo
          }
          probe unicom-id-43752 --server-id=43752
          probe unicom-host --host=beijing.unicomtest.com
          probe telecom-id-59387 --server-id=59387
          probe telecom-host --host=cesu-nb.zjtelecom.com.cn.prod.hosts.ooklaserver.net
          probe mobile-id-16204 --server-id=16204
          probe mobile-host --host=speedtest.jsqiuying.com
          exit 0
