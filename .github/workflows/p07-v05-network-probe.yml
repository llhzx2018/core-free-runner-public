name: P07 OneShot v0.5 Network Probe

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v05-network-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Ookla CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz -o /tmp/speedtest.tgz
          echo '5690596c54ff9bed63fa3732f818a05dbc2db19ad36ed68f21ca5f64d5cfeeb7  /tmp/speedtest.tgz' | sha256sum -c -
          tar -xzf /tmp/speedtest.tgz -C /tmp speedtest
          chmod +x /tmp/speedtest
          /tmp/speedtest --version
      - name: Probe server-id versus host fallback
        shell: bash
        run: |
          set +e
          run_probe() {
            label="$1"; shift
            echo "===== ${label} ====="
            timeout 45s /tmp/speedtest --progress=no --accept-license --accept-gdpr --format=json "$@" >/tmp/out 2>/tmp/err
            rc=$?
            echo "rc=${rc}"
            python3 -c 'import json,pathlib; \
for p in ["/tmp/out","/tmp/err"]: \
 t=pathlib.Path(p).read_text(errors="replace").strip(); print(pathlib.Path(p).name+": "+t[:700].replace("\\n"," ")); \
 d=json.loads(t) if t.startswith("{") else {}; s=d.get("server",{}); \
 print("parsed_server=",s.get("id"),s.get("name"),s.get("location"),s.get("country"),s.get("host")) if d else None; \
 print("download_mbps=",round(d.get("download",{}).get("bandwidth",0)*8/1e6,2),"upload_mbps=",round(d.get("upload",{}).get("bandwidth",0)*8/1e6,2),"latency=",d.get("ping",{}).get("latency")) if d else None'
          }
          run_probe 'unicom-id-43752' --server-id=43752
          run_probe 'unicom-host' --host=beijing.unicomtest.com
          run_probe 'telecom-id-59387' --server-id=59387
          run_probe 'telecom-host' --host=cesu-nb.zjtelecom.com.cn.prod.hosts.ooklaserver.net
          run_probe 'mobile-id-16204' --server-id=16204
          run_probe 'mobile-host' --host=speedtest.jsqiuying.com
          exit 0
