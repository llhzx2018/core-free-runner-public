name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-faq198-channel-20261026]
    paths: ['.github/workflows/s01-faq198-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.198
  TARGET_SHA: 94f6b93eea0759b3ad5cccc06fe68409bdd71e98
  UPDATE_SHA: 1b34ae4ad1cf512376ec82b40dd84bfaca899c3c
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 1b34ae4ad1cf512376ec82b40dd84bfaca899c3c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq198-20261026/channel-spec.json --input control/.github/workflows/s01-faq198-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 839656adc412ce421d5a2d7658e28f9ccc8a20ba 1b34ae4ad1cf512376ec82b40dd84bfaca899c3c)" = projects/S01-C01.json
          git -C source diff --exit-code 839656adc412ce421d5a2d7658e28f9ccc8a20ba 1b34ae4ad1cf512376ec82b40dd84bfaca899c3c -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='d322a2f0c3d137f91a8c45a21863df2a41a64aa419654129b4e5c735a26be1a0' and m['asset_bytes']==2002625
          assert m['runtime_files']==476 and '1.35.197' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
