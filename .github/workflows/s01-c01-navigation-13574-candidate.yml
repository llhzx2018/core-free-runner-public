name: S01-C01 navigation exact candidate
on:
  push:
    branches: [task/s01-c01-navigation-13574-candidate]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.74'
      TARGET_SHA: '84c2ae018a9bf5870e290f7224fe5cf385f514f4'
      TARGET_TREE: 'e45d73794ca96b055cf41455ae365d246600220d'
      SOURCE_VERSION: '1.35.73'
      BASE_SHA: '56698b5abac9da78e9ac7a7a963decf77f6f03ef'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-navigation-13574 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/navigation-page-refinement-contract.php
          php target/tests/navigation-workflow-v4-contract.php
          node --check target/tests/navigation-v8-browser-proof.js
          node --check target/tests/navigation-controls-browser-check.js
          node --check target/src/assets/js/admin/admin-navigation-page-refinement-v1.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1754176'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = 'b14e0599e827d76d0c735aba82323bdef73fd21bdd95d0b86493857eae3fea90'
      - name: Browser dependencies and 30 source-render cases
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
          mkdir wp-css
          for f in common forms; do curl -fsSL "https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-admin/css/$f.css" -o "wp-css/$f.css"; done
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-includes/css/buttons.css -o wp-css/buttons.css
          cp target/src/assets/css/admin/pages/navigation/admin-page-navigation-v8.css /tmp/navigation-candidate.css
          : > target/src/assets/css/admin/pages/navigation/admin-page-navigation-v8.css
          export NODE_PATH="$PWD/node_modules" V8_WP_CSS="$PWD/wp-css" V8_PROOF_DIR="$PWD/proof/fixture"
          if node target/tests/navigation-v8-browser-proof.js > /tmp/navigation-baseline.log 2>&1; then echo 'old hidden task tabs unexpectedly passed'; exit 1; fi
          grep -Fq 'four navigation operation tabs must be visible' /tmp/navigation-baseline.log
          mv /tmp/navigation-candidate.css target/src/assets/css/admin/pages/navigation/admin-page-navigation-v8.css
          node target/tests/navigation-v8-browser-proof.js
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-navigation-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
            proof/fixture/*.json
            proof/fixture/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py /tmp/navigation-candidate.css /tmp/navigation-baseline.log
