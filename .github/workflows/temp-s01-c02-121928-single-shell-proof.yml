name: TEMP S01-C02 1.21.928 Single Shell Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 94e3ee58c9f098e4be9a6d418859fb0a35b6fc7f
      BASE_SHA: 87365c86ce189fc61cdc66ddeae15cd512f91926

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 94e3ee58c9f098e4be9a6d418859fb0a35b6fc7f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.928"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            includes/s01/tool-workbench.php \
            includes/s01/v6-landing-shell.php \
            includes/views/admin-shell-tabs-parts/02-shell-navigation.php \
            tests/s01-c02-121928-single-shell-r39-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/wp-update includes/admin-v13/route-contract.php includes/admin-v13/tab-controller.php includes/admin-v13/services docs/authority | wc -l)" = "0"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/s01/tool-workbench.php
          php -l product/includes/s01/v6-landing-shell.php
          php -l product/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l product/tests/s01-c02-121928-single-shell-r39-contract.php

      - name: R39 product contract
        shell: bash
        run: |
          set -euo pipefail
          php product/tests/s01-c02-121928-single-shell-r39-contract.php

      - name: Independent one-shell proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("product")
          nav=(root/"includes/views/admin-shell-tabs-parts/02-shell-navigation.php").read_text(encoding="utf-8")
          landing=(root/"includes/s01/v6-landing-shell.php").read_text(encoding="utf-8")
          tools=(root/"includes/s01/tool-workbench.php").read_text(encoding="utf-8")
          route=(root/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")

          for fn in (
              "vf_ops_v13_render_shell_header_v121928",
              "vf_ops_v13_render_shell_navigation_v121928",
              "vf_ops_v13_render_shell_open_v121928",
              "vf_ops_v13_render_shell_close_v121928",
          ):
              assert ("function "+fn) in nav, fn

          assert "vf_ops_v13_render_shell_open_v121928($tab, $diag, $route);" in nav
          assert "vf_ops_render_admin_open($tab, $diag);" in landing
          assert "vf_ops_v13_render_shell_open_v121928(" in tools
          assert "vf_ops_v13_render_shell_close_v121928();" in tools

          forbidden_landing=[
              '<div class="wrap vf-ops-admin',
              '<header class="vf-v6-shell-header',
              '<main class="vf-v6-shell-main">',
              'vf-console-domain-nav-desktop',
          ]
          for marker in forbidden_landing:
              assert marker not in landing, marker

          assert '<div class="wrap vf-ops-admin vf-ops-admin-shell vf-ops-v6-shell' not in tools
          assert '<main class="vf-v6-shell-main">' not in tools

          markers=[
              '<header class="vf-v6-shell-header',
              '<main class="vf-v6-shell-main">',
              'data-vf-s01-admin-shell="single-r39"',
          ]
          for marker in markers:
              owners=[]
              for p in (root/"includes").rglob("*.php"):
                  txt=p.read_text(encoding="utf-8",errors="ignore")
                  if marker in txt:
                      owners.append(p.relative_to(root).as_posix())
              assert sorted(set(owners)) == ["includes/views/admin-shell-tabs-parts/02-shell-navigation.php"], (marker,owners)

          # Keep exact Route/Variant/Partial ownership from R37/R38.
          declared=set(re.findall(r"admin-v13/views/[A-Za-z0-9_-]+\.php",route))
          physical=set(p.relative_to(root/"includes").as_posix() for p in (root/"includes/admin-v13/views").rglob("*.php"))
          assert physical==declared, (sorted(physical-declared),sorted(declared-physical))

          rows=[]
          for line in route.splitlines():
              m=re.match(r"^\s*'([^']+)'\s*=>\s*\[(.*)\],?\s*$",line)
              if not m: continue
              body=m.group(2)
              if "'view'=>'admin-v13/views/" in body and "'status'=>'" in body:
                  rows.append(m.group(1))
          assert len(rows)==39, len(rows)

          print("FORMAL_ROUTES=39")
          print("STANDALONE_TOOLS=1")
          print("OWNER_VISIBLE_SURFACES=40")
          print("GLOBAL_SHELL_AUTHORITY=1")
          print("UNKNOWN_VIEW_AUTHORITY=0")
          print("RESULT=PASS")
          PY

      - name: Cleanup
        if: always()
        run: rm -rf product
