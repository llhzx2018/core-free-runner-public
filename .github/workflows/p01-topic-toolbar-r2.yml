name: One-shot P01 Topics Toolbar R2
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-topic-toolbar-r2.yml']
permissions:
  contents: read
jobs:
  topics-toolbar:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PINNED_SHA: a5eaf76162aa960edadd0ff168c421dce4c7e06c
    steps:
      - name: Checkout exact private source into temporary workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PINNED_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p01-src
      - name: Exact source PHP syntax and scoped topics UI contract
        working-directory: p01-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          php -l src/app/TopicLibraryPage.php
          php -l tests/unit/topics_page_full_polish_contract.php
          php tests/unit/topics_page_full_polish_contract.php
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/app/TopicLibraryPage.php').read_text()
          css=Path('src/assets/topic-library.css').read_text()
          assert s.index('<header class="vf-subject-section-head"') < s.index('vf-topic-filter-chips')
          assert 'flex-wrap:wrap!important;' in css
          assert 'body.surface-topics .vf-topic-filter-chips a:focus-visible' in css
          print("TOPICS_TOOLBAR_R2_RESPONSIVE_SOURCE=PASS")
          PY
          echo 'TOPICS_TOOLBAR_R2_EXACT_TEST=PASS'
      - name: Remove private source
        if: always()
        shell: bash
        run: |
          rm -rf p01-src
          echo 'PRIVATE_SOURCE_PERSISTED=NO'
