name: p01-r5-owner-preview-authority-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r5-owner-preview-authority-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 04fc58edd9808d2539d85bf2c56cac342387f4ec
      TARGET_SHA: afbfa3b9ed8a7063ad74bab84d251bc9971c0c96
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"; done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R5_OWNER_PREVIEW_EXACT_SOURCE=PASS

      - name: Focused authority contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/tests/unit/owner_preview_applicability_authority_contract.php
          php current/tests/unit/owner_preview_applicability_authority_contract.php | tee /tmp/owner-preview.txt
          grep -q '^P01_OWNER_PREVIEW_APPLICABILITY_AUTHORITY=PASS$' /tmp/owner-preview.txt
          echo P01_R5_OWNER_PREVIEW_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_R5_OWNER_PREVIEW_CANONICAL=PASS

      - name: Runtime source unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current diff --exit-code "$BASE_SHA" "$TARGET_SHA" -- src
          test "$(cat current/VERSION)" = "2.47.41"
          test -z "$(git -C current status --porcelain --untracked-files=no)"
          echo P01_R5_OWNER_PREVIEW_RUNTIME_UNCHANGED=PASS