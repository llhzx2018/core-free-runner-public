name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-layout-save190-release-20261025]
    paths: ['.github/workflows/s01-layout-save190-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.190
  TARGET_SHA: ad7a93087733fff7473fbcc198682367c17dc0bf
  TARGET_TREE: cfe21d7738be76270126538a829f89d41db1428a
  BASE_SHA: 58438a8b2e70808e5c155db9425e05e8e10b73e7
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-layout-save190-20261025/formal-spec.json --input control/.github/workflows/s01-layout-save190-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ad7a93087733fff7473fbcc198682367c17dc0bf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40190061930 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40190061930 --jq .head_sha)" = 4904773d405c7d4971b72af9090e208838c4995e
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40190061930 --repo llhzx2018/core-free-runner-public --name s01-home-40190061930 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-layout-save190-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='b756335f4a16c07407a7f0d013ba1ee5ead9b2ef'
          before=json.loads((r/'legacy-before.json').read_text());after=json.loads((r/'legacy-after.json').read_text());unknown=json.loads((r/'legacy-unknown.json').read_text());smoke=json.loads((r/'legacy-smoke.json').read_text())
          assert before['status']=='PASS_REPRODUCED' and before['receipt']['code']=='UNKNOWN_FIELDS'
          assert before['receipt']['unknownFields']==['layout.tocPosition'] and before['refresh']=='off'
          assert after['status']==unknown['status']==smoke['status']=='PASS'
          assert after['refresh']=='contextual' and len(after['receipts'])==3
          assert all(x['success'] and x['readback'] and x['runtimeOK'] and x['roundtripOK'] for x in after['receipts'])
          assert unknown['receipt']['code']=='UNKNOWN_FIELDS' and any(x.startswith('layout.futureOwnerField') for x in unknown['receipt']['unknownFields'])
          assert all(result['errors']==[] for result in [before,after,unknown,smoke])
          assert after['security'][0]['code']=='NONCE_INVALID' and after['security'][0]['http']==403
          assert after['security'][1]['code']=='REVISION_CONFLICT' and after['security'][1]['http']==409
          assert 'TRUE_UNKNOWN_LAYOUT_BYTE_IDENTICAL_PASS' in (r/'legacy-unknown-protection.txt').read_text()
          assert 'LEGACY_TOC_COMPATIBILITY_AND_TRUE_UNKNOWN_GUARD_PASS' in (r/'legacy-contract-after.txt').read_text()
          assert 'PUBLIC_PROJECTION_AND_TRUE_CONSUMER_MISMATCH_GUARD_PASS' in (r/'legacy-contract-after.txt').read_text()
          for lang in ['en','zh']:
              assert (r/('legacy-saved-front-'+lang+'.png')).stat().st_size>1000
              front=json.loads((r/('legacy-saved-front-'+lang+'.json')).read_text())
              base=json.loads((r/('legacy-head-'+lang+'.json')).read_text())
              assert front['mode']=='contextual' and abs(front['group']['w']-1120)<2
              for key in ['title','description','canonical','hreflang','bodyHash']:assert front[key]==base[key]
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='dd11bb243dfe8d9f7755666123a37d4ae66b8d1584a6a8e8ad433448cebe329c' and new['bytes']==1996738
          coverage=json.loads(pathlib.Path('control/lanes/s01-layout-save190-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='b756335f4a16c07407a7f0d013ba1ee5ead9b2ef' and coverage['tree']=='cfe21d7738be76270126538a829f89d41db1428a'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40190061930'
          coverage['merged_source']='ad7a93087733fff7473fbcc198682367c17dc0bf'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.190 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.190 provider/vf-tools-theme_V1.35.190.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.190' --notes '修复已保存布局的旧顶层tocPosition兼容字段被误判UNKNOWN_FIELDS，导致文章侧栏设置保存失败、刷新还原的问题。该字段继续作为文章阅读设置的兼容镜像，逐页articleReading优先；同时修复工具目录旧模块按已批准呈现投影隐藏后被校验误报、导致保存回滚的问题。前台与校验共享同一纯投影，完整旧配置继续保留；真正未知字段和真正消费者错位仍阻止保存，不自动删除历史配置。真实隔离WordPress复现189失败，新版实际保存/刷新保留/双语前台侧栏生效、nonce与修订冲突、未知字段保护、干净安装、189升级190/回退/重复安装与数据保护通过。文章版式、SEO、JS及其它组件保持；不新增Schema版本或迁移机制。476运行文件，Production由Owner手工升级，人工最终复验与手机实机仍待确认。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.190 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.190 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.190 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.190.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.190.zip remote/vf-tools-theme_V1.35.190.zip
          echo 'dd11bb243dfe8d9f7755666123a37d4ae66b8d1584a6a8e8ad433448cebe329c  remote/vf-tools-theme_V1.35.190.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.190.zip)" = 1996738
          gh release view v1.35.190 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
