name: P08 v0.1.11 FINAL MariaDB isolated one retry gate
on:
  pull_request:
    paths:
      - .github/workflows/p08-v011-final-mariadb-retry.yml
      - scripts/p08_v011_final_native.sh
      - scripts/specs/p08-v011-final-source.json
permissions:
  contents: read
jobs:
  official-full-to-exact-next-atomic:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v011-final-source-gates-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: 1de00a198add963c2e87779e71f8d564e67c5328
      TARGET_VERSION: '0.1.11'
      TARGET_SHA: 1de00a198add963c2e87779e71f8d564e67c5328
      TARGET_TREE: 675c73951b42adeaf5d52de8af836baaa616437c
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
    steps:
      - name: Checkout exact isolated Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 v0.1.11 merged main without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1de00a198add963c2e87779e71f8d564e67c5328
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Audit exact-source immutable lane before machine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/specs/p08-v011-final-source.json
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/specs/p08-v011-final-source.json --input .github/workflows/p08-v011-final-mariadb-retry.yml
          test "$(git -C p08 rev-parse HEAD)" = 1de00a198add963c2e87779e71f8d564e67c5328
          echo P08_V011_FINAL_MARIADB_RETRY_EXACT_LANE=PASS
      - name: Checkout canonical Source Current for real FULL structural gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Confirm exact 0.1.10 to 0.1.11 presentation-only Git change scope and current Mode D
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.10 --jq .id)" = 450188625
          grep -q '### Mode D · OWNER_DIRECT_REVERSIBLE_UI_RELEASE' gov/skills/skill-release/V3.18/SKILL.md
          grep -q 'OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED' p08/docs/authority/ACCEPTANCE_MATRIX.md
          test "$(cat p08/VERSION)" = 0.1.11
          gh api repos/llhzx2018/vf-adops/compare/ef78dcb21117c822e2756360280f2418f794704f...1de00a198add963c2e87779e71f8d564e67c5328 --jq '.files[].filename' > "$RUNNER_TEMP/p08-v011-compare-paths.txt"
          python3 - "$RUNNER_TEMP/p08-v011-compare-paths.txt" <<'PY'
          from pathlib import Path
          import sys
          actual=set(Path(sys.argv[1]).read_text().splitlines())
          approved={
            "CLOUDPANEL_INSTALL.txt","VERSION","public/p08-install-build.txt",
            "resources/css/app.css","resources/js/modules/updates/FutureOwnerUpdatePanel.vue",
            "resources/js/modules/updates/UpdatePanel.vue","scripts/dev_check.sh",
            "tests/e2e/owner-v015-first-update-browser.spec.ts",
            "tests/js/future-update-check-feedback.test.ts"
          }
          assert actual==approved,(sorted(actual-approved),sorted(approved-actual))
          print("P08_V011_MODE_D_ACTUAL_NO_BACKEND_AUTH_DB_SCHEMA_UPDATER_DIFF=PASS")
          PY
      - name: PHP 8.4 locked packages and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native SQL dump and sqlite tools
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 420 sudo apt-get -qq update
          timeout 420 sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
      - name: Verify exact final main authority before REAL machine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat p08/VERSION)" = 0.1.11
          test "$(git -C p08 rev-parse HEAD)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(git -C p08 rev-parse HEAD^{tree})" = 675c73951b42adeaf5d52de8af836baaa616437c
          test "$(git -C gov rev-parse HEAD)" = 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          echo P08_V011_FINAL_SOURCE_IDENTITY=PASS
      - name: Real official v0.1.10 FULL install then final SHA-bound Atomic switch rollback and SIGKILL
        shell: bash
        run: |
          set -Eeuo pipefail
          P08_R187_ISOLATED=YES php p08/tests/test_owner_future_one_click.php
          bash scripts/p08_v011_final_native.sh ${{ matrix.kind }}
      - name: Destroy all private checkouts and temporary real packages
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/p08-v011-compare-paths.txt"
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r198-${{ matrix.kind }}" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-kill"
          test ! -e p08 && test ! -e gov
