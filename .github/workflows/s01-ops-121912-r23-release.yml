name: S01 Ops 1.21.912 Surface Density R23 Release Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 3677940d4c60f04a0d744d4accbb6884bcd4fa07
      BASE_SHA: bc80400be13c84d43096f94d413c72a09da0ee6a
      VERSION: 1.21.912
      PREVIOUS_TAG: v1.21.911
      PREVIOUS_ASSET: vf-tools-ops_V1.21.911.zip
      ASSET: vf-tools-ops_V1.21.912.zip

    steps:
      - name: Checkout exact Ops main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3677940d4c60f04a0d744d4accbb6884bcd4fa07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.912' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.912'" ops/vf-ops.php
          grep -Fq 'S01-SURFACE-DENSITY-CONSISTENCY-R23' ops/vf-ops.php
          php ops/tests/s01-c02-121912-surface-density-consistency-r23-contract.php
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121912-surface-density-consistency-r23-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

      - name: Build deterministic runtime package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); stage=Path('stage/vf-ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel in ('vf-ops.php','uninstall.php')
              return re.match(r'^(?:includes|assets|languages|config)/',rel) is not None
          files=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()),key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel):continue
              if p.is_symlink():raise SystemExit('runtime symlink forbidden: '+rel)
              data=p.read_bytes(); files.append((rel,data))
              q=stage/rel; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(data)
          canonical=b''.join(rel.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for rel,data in files)
          Path('/tmp/runtime_count').write_text(str(len(files)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          for out in ('dist/vf-tools-ops_V1.21.912.zip','dist/rebuild-vf-tools-ops_V1.21.912.zip'):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      info=zipfile.ZipInfo('vf-ops/'+rel,date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF)<<16
                      z.writestr(info,data)
          PY
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.912'
          test "$(cat /tmp/runtime_count)" = "972"
          sha256sum "dist/$ASSET" | awk '{print $1}' >/tmp/asset_sha
          stat -c '%s' "dist/$ASSET" >/tmp/asset_bytes

      - name: Previous release compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(stat -c '%s' "previous/$PREVIOUS_ASSET")" = "3480003"
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "2e22e053b96193b91399f9d21fc6d4b399c56dcb9b7b60fdbb4d2119245785ab"
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sort >/tmp/prev.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sort >/tmp/new.txt
          test ! -s <(comm -13 /tmp/prev.txt /tmp/new.txt)
          test ! -s <(comm -23 /tmp/prev.txt /tmp/new.txt)

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > dist/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=v1.21.911
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RELEASE_CLASS=FILES_ONLY_ADMIN_UX_UI
          SURFACE_DENSITY_SHARED_TOKENS=PASS
          SCHEMA=6.0.0_TO_6.0.0
          DATA_MIGRATION=NONE
          RESULT=PASS
          EOF

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121912-r23-candidate
          path: |
            dist/vf-tools-ops_V1.21.912.zip
            dist/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14

  formal-release:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      SOURCE_SHA: 3677940d4c60f04a0d744d4accbb6884bcd4fa07
      VERSION: 1.21.912
      TAG: v1.21.912
      ASSET: vf-tools-ops_V1.21.912.zip

    steps:
      - name: Download exact tested candidate
        uses: actions/download-artifact@v4
        with:
          name: s01-c02-121912-r23-candidate
          path: tested

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          grep -Fqx "VERSION=$VERSION" tested/candidate-receipt.txt
          grep -Fqx "SOURCE_SHA=$SOURCE_SHA" tested/candidate-receipt.txt
          grep -Fqx 'SURFACE_DENSITY_SHARED_TOKENS=PASS' tested/candidate-receipt.txt
          grep -Fqx 'RESULT=PASS' tested/candidate-receipt.txt
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then exit 31; fi

          BYTES="$(stat -c '%s' "tested/$ASSET")"
          SHA="$(sha256sum "tested/$ASSET" | awk '{print $1}')"
          RUNTIME_FILES="$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)"
          RUNTIME_FP="$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)"
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Ops V1.21.912

          **S01-C02 · Surface + Density Consistency R23**

          - Shared neutral surfaces, borders and 7px panel radius
          - Shared 24px section rhythm and 18px section title
          - Shared 14px row gap, 13.5px object title and 11.5px object copy
          - Dashboard / Tools / Content+SEO / Quality / Publish+System consume the same visual tokens
          - System/Publish object rows brought up to the same readable density
          - R21 shell and R22 page-head authority preserved
          - IA/routes/write semantics/Schema/Data/updater unchanged
          - Rollback v1.21.911
          - OWNER visual acceptance remains post-update

          Exact asset:
          - $ASSET
          - Bytes $BYTES
          - SHA-256 $SHA
          - Runtime files $RUNTIME_FILES
          - Runtime Fingerprint $RUNTIME_FP
          EOF

          gh release create "$TAG" "tested/$ASSET#VF Tools Ops $VERSION"             --repo "$TARGET_REPO"             --target "$SOURCE_SHA"             --title "VF Tools Ops V$VERSION"             --notes-file /tmp/release-notes.md

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          mkdir -p remote
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir remote
          cmp "tested/$ASSET" "remote/$ASSET"
          cat > formal-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$(stat -c '%s' "remote/$ASSET")
          SHA256=$(sha256sum "remote/$ASSET" | awk '{print $1}')
          RUNTIME_FILES=$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)
          RUNTIME_FINGERPRINT=$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)
          REMOTE_READBACK=PASS
          PRODUCTION=NOT_YET_CLAIMED
          OWNER_VISUAL_ACCEPTANCE=OPEN
          RESULT=PASS
          EOF

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121912-r23-formal-release
          path: formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
