name: P01 V2.32 Home Polish Edit
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-home-polish-edit-20260829.yml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SOURCE: 23ada10bd7f76e21c48126a7ae29d8e32153f7fb
      PRODUCT_BRANCH: feature/p01-v2.32-home-polish-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-v2.32-home-polish-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source fenced Home polish
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/app/FunctionalHome.php')
          s=p.read_text(encoding='utf-8')

          anchor="""function vf_home_asset_class(array $asset): string
          {
          """
          helper="""function vf_home_favorite_assets(array $assets): array
          {
              $favorites = array_values(array_filter($assets, static fn(array $asset): bool => (int)($asset['is_favorite'] ?? 0) === 1));
              usort($favorites, static function(array $a, array $b): int {
                  $ar = (int)($a['favorite_rank'] ?? 0);
                  $br = (int)($b['favorite_rank'] ?? 0);
                  if ($ar > 0 || $br > 0) {
                      if ($ar <= 0) return 1;
                      if ($br <= 0) return -1;
                      if ($ar !== $br) return $ar <=> $br;
                  }
                  $updated = strcmp((string)($b['updated_at'] ?? ''), (string)($a['updated_at'] ?? ''));
                  if ($updated !== 0) return $updated;
                  return strnatcasecmp((string)($a['title'] ?? ''), (string)($b['title'] ?? ''));
              });
              return $favorites;
          }

          """
          if anchor not in s: raise SystemExit('helper anchor missing')
          s=s.replace(anchor,helper+anchor,1)

          old="""    $recent = (array)$context['recent'];
              $total = (int)($surfaceCounts['total'] ?? 0);
          """
          new="""    $recent = (array)$context['recent'];
              $favorites = (array)$context['favorites'];
              $total = (int)($surfaceCounts['total'] ?? 0);
          """
          if old not in s: raise SystemExit('context anchor missing')
          s=s.replace(old,new,1)

          old="""      <a class=\"vf-home-secondary\" href=\"surfaces.php\">查看全部资源</a>
                <button type=\"button\" class=\"vf-home-primary\" data-open-add>＋ 添加资源</button>
          """
          new="""      <a class=\"vf-home-secondary\" href=\"surfaces.php\">查看全部资源</a>
          """
          if old not in s: raise SystemExit('duplicate add anchor missing')
          s=s.replace(old,new,1)

          anchor="""      </section>
              </div>

              <aside class=\"vf-home-rail\">
          """
          favorite_section="""      </section>

                <section class=\"vf-home-section\">
                  <header><div><span>快捷</span><h2>我的收藏</h2><p>只展示已真实收藏的资源，最多 6 条。</p></div><a href=\"surfaces.php?view=favorite\">查看全部 →</a></header>
                  <?php if (!$favorites): ?>
                    <div class=\"vf-home-empty\"><strong>还没有收藏资源</strong><p>在任一资源域标记收藏后，这里会成为你的快捷启动区。</p></div>
                  <?php else: ?>
                    <div class=\"vf-home-recent-list\">
                      <?php foreach($favorites as $asset): $surface=(string)($asset['surface']??'start');$class=vf_home_asset_class($asset); ?>
                        <article class=\"vf-home-recent-item\">
                          <span class=\"vf-home-recent-icon\"><?=vf_fw_icon($asset)?></span>
                          <button type=\"button\" class=\"vf-home-recent-copy\" data-edit-id=\"<?=(int)$asset['id']?>\">
                            <strong><?=vf_fw_h((string)$asset['title'])?></strong>
                            <small><?=vf_fw_h(vf_fw_mode_label($surface))?><?php if($class!==''): ?> · <?=vf_fw_h($class)?><?php endif; ?></small>
                          </button>
                          <?php if(vf_fw_is_private($asset)): ?><i class=\"vf-home-private\">私人</i><?php endif; ?>
                          <a class=\"vf-home-open\" href=\"<?=vf_fw_open_href($asset,true)?>\" target=\"_blank\" rel=\"noopener noreferrer\">打开 ↗</a>
                        </article>
                      <?php endforeach; ?>
                    </div>
                  <?php endif; ?>
                </section>
              </div>

              <aside class=\"vf-home-rail\">
          """
          if anchor not in s: raise SystemExit('favorite section anchor missing')
          s=s.replace(anchor,favorite_section,1)

          old="""    $favoriteCount = count(array_filter($allAssets, static fn(array $asset): bool => (int)($asset['is_favorite'] ?? 0) === 1));
              $recentAll = vf_home_recent_assets($allAssets);
              $recent = array_slice($recentAll, 0, 6);
          """
          new="""    $favoritesAll = vf_home_favorite_assets($allAssets);
              $favoriteCount = count($favoritesAll);
              $favorites = array_slice($favoritesAll, 0, 6);
              $recentAll = vf_home_recent_assets($allAssets);
              $recent = array_slice($recentAll, 0, 6);
          """
          if old not in s: raise SystemExit('favorite data anchor missing')
          s=s.replace(old,new,1)

          old="""<?php vf_render_home_command_center(['surface_counts'=>$surfaceCounts,'pending'=>$pending,'favorite_count'=>$favoriteCount,'recent_count'=>count($recentAll),'recent'=>$recent]); ?>
          <script type=\"application/json\" id=\"vf-functional-context\"><?=vf_fw_context_json($categories,'all','home')?></script>
          <?php vf_workspace_payload($recent,$categories); ?>
          """
          new="""<?php vf_render_home_command_center(['surface_counts'=>$surfaceCounts,'pending'=>$pending,'favorite_count'=>$favoriteCount,'recent_count'=>count($recentAll),'recent'=>$recent,'favorites'=>$favorites]); ?>
          <script type=\"application/json\" id=\"vf-functional-context\"><?=vf_fw_context_json($categories,'all','home')?></script>
          <?php
          $payloadAssets = [];
          foreach (array_merge($recent, $favorites) as $asset) $payloadAssets[(int)$asset['id']] = $asset;
          vf_workspace_payload(array_values($payloadAssets),$categories);
          ?>
          """
          if old not in s: raise SystemExit('payload anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          php -l product/src/app/FunctionalHome.php
          test "$(git -C product diff --name-only)" = "src/app/FunctionalHome.php"
          git -C product diff --check
          git -C product diff --stat
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/app/FunctionalHome.php
          git -C product commit -m "refine(P01): make Home favorites actionable"
          git -C product push origin "HEAD:${PRODUCT_BRANCH}"
          echo "NEW_SOURCE=$(git -C product rev-parse HEAD)"
          echo "NEW_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "VERSION=$(tr -d '\r\n' < product/src/VERSION.txt)"
          echo "OWNER_PRODUCTION_WRITE=NO"
          echo "RELEASE=NO"
