name: P01 manual YouTube exact-source security and canonical proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-youtube-manual-native.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: bfb3fef4cceba9835549655149e8557a96aef944
    steps:
      - name: Install PHP and Node native test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-xml php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring|simplexml|curl'
          node --version
      - name: Exact private product source and official baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git"
          live="$(git ls-remote "$remote" refs/heads/feat/p01-youtube-manual-check-20261020 | awk '{print $1}')"
          test "$live" = "$PRODUCT_SHA"
          git clone -q --no-checkout "$remote" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git clone -q --depth 1 --branch v2.47.397 "$remote" baseline
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < candidate/VERSION)" = "2.47.397"
          echo P01_YOUTUBE_EXACT_SOURCE=PASS
      - name: Syntax and owner-only security fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          for f in src/app/YouTubeManualUpdates.php src/app/ChannelLibraryPage.php src/app/SubjectPageChrome.php src/youtube-channel-updates.php tests/unit/youtube_manual_updates_cache_native.php; do php -l "$f"; done
          node --check src/assets/channel-youtube-updates.js
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          echo P01_YOUTUBE_NATIVE_FOCUSED=PASS
      - name: Canonical full regression and Zero Debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/p01-youtube-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-youtube-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-youtube-canonical.txt
          echo P01_YOUTUBE_CANONICAL=PASS
      - name: No production or release actions
        run: echo P01_YOUTUBE_PRODUCTION_UNCHANGED=PASS
