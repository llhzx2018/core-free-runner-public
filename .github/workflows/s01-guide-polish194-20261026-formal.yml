name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guide-polish194-formal-20261026]
    paths: ['.github/workflows/s01-guide-polish194-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.194
  TARGET_SHA: a02c80efe12a65c0ee22ae87adfbd8130c735198
  TARGET_TREE: 9c57a1baf053278a94ff550d2e25e0d68db7d578
  BASE_SHA: 39a6b8ad0f0d16ad3f3bc99ba5e71df1ae88e4e6
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-polish194-20261026/formal-spec.json --input control/.github/workflows/s01-guide-polish194-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a02c80efe12a65c0ee22ae87adfbd8130c735198
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40247396437 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40247396437 --jq .head_sha)" = 0e6204b24dd431cb0821f447e86ad43c10584991
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40247396437 --repo llhzx2018/core-free-runner-public --name s01-home-40247396437 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guide-polish194-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='3a4073e2b0ed6c49834c660ce2c7aafe3ce8d736'
          for phase,count in [('before',8),('after',16),('smoke',4)]:
              result=json.loads((r/('guide-polish-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==count
              assert result['errors']==[] and result['writes']==[]
              assert result['realAds']=='SYNTHETIC_CONTRACT_ONLY'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for kind in ['long','short']:
                      stem=lang+'-'+str(width)+'-'+kind
                      baseline=json.loads((r/('guide-polish-baseline-'+stem+'.json')).read_text())
                      for state in ['off','ready']:
                          after=json.loads((r/('guide-polish-after-'+stem+'-'+state+'.json')).read_text())
                          for key in ['title','h1','description','canonical','hreflang','robots','schema','body','header','footer','nav']:assert after[key]==baseline[key],key
                          if state=='ready':
                              assert after['sideAd']['w']==300 and after['sideAd']['h']==250
                              assert after['sideAd']['x']>=after['reading']['right']+40
                              assert abs(after['endAd']['x']+after['endAd']['w']/2-width/2)<2
              for kind in ['long','short']:
                  for area in ['top','support']:assert (r/('guide-polish-'+lang+'-'+kind+'-'+area+'.png')).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='4ef757de6068654805a649085fb6a5aba3da0f905d9cd21adc81ea473ec1a4a3' and new['bytes']==1999608
          coverage=json.loads(pathlib.Path('control/lanes/s01-guide-polish194-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='3a4073e2b0ed6c49834c660ce2c7aafe3ce8d736' and coverage['tree']=='9c57a1baf053278a94ff550d2e25e0d68db7d578'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40247396437'
          coverage['merged_source']='a02c80efe12a65c0ee22ae87adfbd8130c735198'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.194 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.194 provider/vf-tools-theme_V1.35.194.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.194' --notes '指南详情收尾：修复相关工具与FAQ间距，长短指南共用原生目录展开和键盘锚点并遵守目录位置/关闭设置，中文日期显示年月日；相关工具消费既有公开工具目录，缺失运行时仍隐藏。指南后台解释侧栏和sidebar设备开关、运营广告可用条件，不自动启用正式站广告。中英文1440/1024×长短内容×广告有无16组，侧栏/设备关闭/empty/denied/无JS、相邻文章输出、SEO正文保持、干净安装、193升级194/回退/重复安装与数据保护通过。476运行文件。合成广告不等于真实投放或CWV通过，Production由Owner手工升级，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.194 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.194 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.194 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.194.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.194.zip remote/vf-tools-theme_V1.35.194.zip
          echo '4ef757de6068654805a649085fb6a5aba3da0f905d9cd21adc81ea473ec1a4a3  remote/vf-tools-theme_V1.35.194.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.194.zip)" = 1999608
          gh release view v1.35.194 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
