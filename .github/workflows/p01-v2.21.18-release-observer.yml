name: P01 V2.21.18 Release Observer
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-release-observer.yml']
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Observe formal release run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/core-free-runner-public/actions/workflows/p01-v2.21.18-formal-release.yml/runs -f branch=vf-agent-operations-v1 -f per_page=5 > /tmp/runs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'));runs=[]
          for r in x.get('workflow_runs',[])[:5]:runs.append({k:r.get(k) for k in ['id','status','conclusion','run_attempt','head_sha','created_at','updated_at']})
          open('/tmp/result.json','w').write(json.dumps({'schema':'vf-public-runner-observation/v1','project_id':'P01','target_version':'2.21.18','gate':'FORMAL_RELEASE_OBSERVER','runs':runs},indent=2)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git repo
          mkdir -p repo/vf-agent/results;cp /tmp/result.json repo/vf-agent/results/P01-V2.21.18-FORMAL-RELEASE-OBSERVER.json
          git -C repo config user.name VictorForge;git -C repo config user.email llhzx2018@gmail.com;git -C repo add vf-agent/results/P01-V2.21.18-FORMAL-RELEASE-OBSERVER.json
          if ! git -C repo diff --cached --quiet;then git -C repo commit -q -m 'evidence(P01): observe V2.21.18 formal release';git -C repo push -q origin HEAD:vf-agent-operations-v1;fi
