name: P02 R27 CSS Convergence Write
on:
  push:
    branches: [run/p02-r27-css-convergence-write]
permissions:
  contents: read
jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 7dff06b2fe73afb41ff58c9e2f53d988c4a3cec2
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Converge stylesheet cascade
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess

          root=Path('.')
          app_path=root/'public/assets/app.css'
          index_path=root/'public/index.php'
          app=app_path.read_text(encoding='utf-8')
          index=index_path.read_text(encoding='utf-8')

          parent='c120559901039344bf0d7421cb05a1badd8b7962'
          companion=subprocess.check_output(['git','show',f'{parent}:public/assets/v2521-context-ux.css'],text=True).strip()
          if app.count(companion)!=1:
              raise SystemExit(f'expected exact historical UX CSS once in app.css, got {app.count(companion)}')
          app=app.replace(companion,'',1)

          marker='/* V2.5.32 R25 visual audit fixes */'
          pos=app.find(marker)
          if pos<0:
              raise SystemExit('R25 visual fix block missing')
          base=app[:pos].rstrip()
          final_fix=app[pos:].strip()

          ordered=[
            'editor-enhancements.css',
            'v250-uaui.css',
            'v250-reader-scale.css',
            'v251-hotfix.css',
            'v252-hotfix.css',
            'v253-hotfix.css',
            'v254-common-branding.css',
            'v2514-writing-typography.css',
          ]
          blocks=[base]
          for name in ordered:
              p=root/'public/assets'/name
              if not p.exists(): raise SystemExit(f'missing stylesheet {name}')
              blocks.append(f'/* V2.5.32 R27 consolidated source: {name} */\n'+p.read_text(encoding='utf-8').strip())
          blocks.append('/* V2.5.32 R27 native UX final cascade */\n'+companion)
          blocks.append(final_fix)
          blocks.append('''/* V2.5.32 R27 CSS convergence guards */
          @media(min-width:901px){
            .notebook-layout.notebook-editing .notebook-list-pane,
            .notebook-layout.notebook-editing .notebook-resizer{display:none!important}
          }
          .notebook-list-pane[hidden],.notebook-resizer[hidden]{display:none!important}
          ''')
          app_path.write_text('\n\n'.join(blocks).strip()+'\n',encoding='utf-8')

          for name in ordered:
              p=root/'public/assets'/name
              p.unlink()
              needle=f'<link rel="stylesheet" href="/assets/{name}?v=<?=rawurlencode(VFTB_VERSION)?>">\n'
              if needle not in index:
                  raise SystemExit(f'index link missing for {name}')
              index=index.replace(needle,'',1)
          index_path.write_text(index,encoding='utf-8')

          identity_path=root/'docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json'
          identity=json.loads(identity_path.read_text(encoding='utf-8'))
          identity['runtime_source_file_count']=72
          identity['css_convergence']=True
          identity['css_runtime_entry']='public/assets/app.css'
          identity['consolidated_css_assets']=ordered
          identity['candidate_state']='DEVELOP_UX_CONVERGENCE_IN_PROGRESS'
          identity['next_gate']='RERUN_BROWSER_VISUAL_CONVERGENCE_THEN_CONTINUE_FULL_PRODUCT_AUDIT'
          identity_path.write_text(json.dumps(identity,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for p in (root/'tests/unit').glob('p02_*.mjs'):
              s=p.read_text(encoding='utf-8')
              if 'runtime_source_file_count' in s:
                  s=s.replace("runtime_source_file_count!==80","runtime_source_file_count!==72")
                  s=s.replace("runtime_source_file_count,80","runtime_source_file_count,72")
                  s=s.replace("runtime_source_file_count==80","runtime_source_file_count==72")
              p.write_text(s,encoding='utf-8')

          contract=root/'tests/unit/p02_css_convergence_contract.mjs'
          contract.write_text("""import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const index=fs.readFileSync('public/index.php','utf8');
          const css=fs.readFileSync('public/assets/app.css','utf8');
          const candidate=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));
          const links=(index.match(/<link rel=\"stylesheet\"/g)||[]).length;
          assert.equal(links,1,'index must expose one stylesheet runtime entry');
          assert.ok(index.includes('/assets/app.css'));
          for(const name of ['editor-enhancements.css','v250-uaui.css','v250-reader-scale.css','v251-hotfix.css','v252-hotfix.css','v253-hotfix.css','v254-common-branding.css','v2514-writing-typography.css']){
            assert.ok(!fs.existsSync('public/assets/'+name),name+' should be consolidated');
            assert.ok(css.includes('V2.5.32 R27 consolidated source: '+name),name+' boundary missing');
          }
          const oldPos=css.indexOf('V2.5.32 R27 consolidated source: v2514-writing-typography.css');
          const nativePos=css.indexOf('V2.5.32 R27 native UX final cascade');
          const fixPos=css.indexOf('V2.5.32 R25 visual audit fixes');
          assert.ok(oldPos>=0&&nativePos>oldPos&&fixPos>nativePos,'final UX cascade must follow legacy sources');
          assert.ok(css.includes('.notebook-layout.notebook-editing .notebook-list-pane'));
          assert.equal(candidate.runtime_source_file_count,72);
          assert.equal(candidate.css_convergence,true);
          console.log('P02_CSS_CONVERGENCE=PASS');
          """,encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py

      - name: Verify full static and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = '2.5.32'
          test "$(grep -c '<link rel="stylesheet"' public/index.php)" = '1'
          for t in tests/unit/p02_*.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32' and m['runtime_source_file_count']==72
          assert c['candidate_version']=='2.5.32' and c['runtime_source_file_count']==72
          assert c['production_version']=='2.5.31'
          print('P02_R27_CSS_CONVERGENCE_GATES=PASS')
          PY

      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor(P02): converge V2.5.32 stylesheet cascade'
          git push origin HEAD:develop
          git remote set-url origin "https://github.com/llhzx2018/vf-library"
          echo P02_DEVELOP_WRITE=PASS
          echo P02_MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
