name: P01 V2.36.4 Remote Release Truth
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-remote-release-truth-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      PRODUCT_MAIN: 8fedb0d1dab25d23e598029bd39c0cbea50916b0
      DEVELOP: 48da73b3d69279de507d21c9f095094f5b8948da
      COMPOSITE_TREE: 0c790c1580078813c47e5c0f56f1ced9bd3d66cc
      CORE_LIVE: 0a700ad89ca1d2d6e05ccca3d7005afb8769f112
      RELEASE_ID: '380614937'
      ASSET_NAME: VF_Start_V2.36.4_UPDATE.zip
      ASSET_BYTES: '1237066'
      ASSET_SHA256: ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
      PUBLICATION_R1: '33524823393'
      PUBLICATION_R2: '33525031995'
      PUBLICATION_R2_ARTIFACT: '9807299362'
      PUBLICATION_R2_DIGEST: sha256:fbb316eb752365f5cc5ec137cd6ed4a2d841617f3eedf06078d179c568968f79
      EVID: /tmp/p01-v2364-remote-release-truth
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Runner prerequisite fence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in 33520819304 33521577888 33523864431 33524444884 "$PUBLICATION_R2"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_R1 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$PUBLICATION_R2/artifacts --jq ".artifacts[] | select(.id==$PUBLICATION_R2_ARTIFACT) | .digest")" = "$PUBLICATION_R2_DIGEST"
      - name: Checkout exact v2.36.4 tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.36.4
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: target
      - name: Checkout exact live core-updates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_LIVE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Authenticated remote release truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf "$EVID"; mkdir -p "$EVID/download"
          test "$(git -C target rev-parse HEAD)" = "$FORMAL"
          test "$(git -C target rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C target rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)
          DEV=$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)
          test "$MAIN" = "$PRODUCT_MAIN"
          test "$DEV" = "$DEVELOP"
          git -C target fetch origin "$MAIN" "$DEV" --quiet
          test "$(git -C target rev-parse "$MAIN^{tree}")" = "$COMPOSITE_TREE"
          test "$(git -C target rev-parse "$DEV^{tree}")" = "$COMPOSITE_TREE"
          test "$(git -C target rev-parse "$MAIN:src")" = "$RUNTIME_TREE"
          test "$(git -C target rev-parse "$DEV:src")" = "$RUNTIME_TREE"
          git -C target merge-base --is-ancestor "$FORMAL" "$MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.4 --jq .object.sha)" = "$FORMAL"

          gh api repos/llhzx2018/vf-start/releases/tags/v2.36.4 > "$EVID/release.json"
          test "$(jq -r .id "$EVID/release.json")" = "$RELEASE_ID"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.36.4
          test "$(jq -r .target_commitish "$EVID/release.json")" = main
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          jq -e '.assets[]|select(.name=="VF-Start-V2.36.4-FULL.zip" and .size==587272 and .digest=="sha256:552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24" and .state=="uploaded")' "$EVID/release.json" >/dev/null
          jq -e --arg n "$ASSET_NAME" --argjson b "$ASSET_BYTES" --arg d "sha256:$ASSET_SHA256" '.assets[]|select(.name==$n and .size==$b and .digest==$d and .state=="uploaded")' "$EVID/release.json" >/dev/null
          jq -e '.assets[]|select(.name=="repair-v2.36.4.php" and .size==3592809 and .digest=="sha256:cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee" and .state=="uploaded")' "$EVID/release.json" >/dev/null

          gh release download v2.36.4 --repo llhzx2018/vf-start --pattern "$ASSET_NAME" --dir "$EVID/download"
          A="$EVID/download/$ASSET_NAME"; test -f "$A"
          test "$(stat -c %s "$A")" = "$ASSET_BYTES"
          test "$(sha256sum "$A" | awk '{print $1}')" = "$ASSET_SHA256"
          unzip -p "$A" repair-v2.36.4.php > "$EVID/repair-v2.36.4.php"
          php -l "$EVID/repair-v2.36.4.php" >/dev/null
          grep -F "public const SOURCE_VERSION='2.36.3';" "$EVID/repair-v2.36.4.php" >/dev/null
          grep -F "public const TARGET_VERSION='2.36.4';" "$EVID/repair-v2.36.4.php" >/dev/null
          grep -F "public const TARGET_SCHEMA='2026082901';" "$EVID/repair-v2.36.4.php" >/dev/null
          php "$EVID/repair-v2.36.4.php" --self-test | tee "$EVID/atomic-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null

          test "$(git -C updates rev-parse HEAD)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563 and .product_identity=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .asset_name=="VF_Start_V2.36.3_UPDATE.zip" and .asset_bytes==1236976 and .asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' updates/projects/P01.json >/dev/null
          gh api -H 'Accept: application/vnd.github.raw+json' 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' > "$EVID/live-P01-before-v2364.json"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_tag=="v2.36.3" and .release_id==380449563' "$EVID/live-P01-before-v2364.json" >/dev/null

          printf 'P01_V2364_REMOTE_RELEASE_TRUTH=PASS\nPUBLISHED_LATEST=2.36.4\nRELEASE_ID=%s\nTAG=v2.36.4\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nPRODUCT_MAIN=%s\nDEVELOP=%s\nCOMPOSITE_TREE=%s\nUPDATE_ASSET=%s\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nREPAIR_REMOTE_SELF_TEST=PASS\nCORE_UPDATES_MAIN_BEFORE_V2364=%s\nLIVE_P01_BEFORE_V2364=2.36.2_TO_2.36.3\nPUBLICATION_R1_CLASSIFICATION=POST_PUBLICATION_TARGET_COMMITISH_HARNESS_ONLY\nPUBLICATION_R2=%s\nREMOTE_WRITE=NO\nCORE_UPDATES_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\nNEXT=STAGE_STRICT_2.36.3_TO_2.36.4_MANIFEST\n' "$RELEASE_ID" "$FORMAL" "$FORMAL_TREE" "$RUNTIME_TREE" "$MAIN" "$DEV" "$COMPOSITE_TREE" "$ASSET_NAME" "$ASSET_BYTES" "$ASSET_SHA256" "$CORE_LIVE" "$PUBLICATION_R2" | tee "$EVID/verdict.txt"
      - name: Upload remote truth evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-remote-release-truth-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
