name: P01 News 2.47.506 Owner trial bundle (NOT FORMAL)
on:
  push:
    branches:
      - task/p01-news-v506-owner-trial-20261109
permissions:
  contents: read
concurrency:
  group: p01-news-owner-trial-20261109
  cancel-in-progress: false
jobs:
  owner-trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK: /tmp/p01-news-owner-trial-20261109
      NEWS_SHA: 665a24645101096df9cb4b4800154cdf04167a67
      TRIAL_TAG: trial/p01-news-2.47.506-20261109
    steps:
      - name: Checkout registered public-safe builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private product without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 665a24645101096df9cb4b4800154cdf04167a67
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Build exact non-formal trial package from published 505
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml unzip zip jq >/dev/null
          test -n "$GH_TOKEN"
          test "$(git -C p01-exact rev-parse HEAD)" = "$NEWS_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.506
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = 2.47.506
          grep -Fx "define('VF_VERSION', '2.47.506');" p01-exact/src/app/bootstrap.php
          test ! -e p01-exact/src/app/.runtime.php
          mkdir -p "$WORK/baseline" "$WORK/update505" "$WORK/output"
          gh release download v2.47.505 -R llhzx2018/vf-start -D "$WORK" -p VF-Start-V2.47.505-FULL.zip -p VF_Start_V2.47.505_UPDATE.zip
          unzip -q "$WORK/VF-Start-V2.47.505-FULL.zip" -d "$WORK/baseline"
          unzip -q "$WORK/VF_Start_V2.47.505_UPDATE.zip" -d "$WORK/update505"
          test -f "$WORK/update505/repair-v2.47.505.php"
          tree_sha="$(git -C p01-exact rev-parse HEAD^{tree})"
          python3 scripts/p01-maintenance-release.py \
            --candidate p01-exact/src \
            --baseline-full "$WORK/baseline" \
            --baseline-repair "$WORK/update505/repair-v2.47.505.php" \
            --out "$WORK/output" --version 2.47.506 \
            --source-version 2.47.505 --target-sha "$NEWS_SHA" \
            --target-tree "$tree_sha" > "$WORK/build.json"
          FULL="$WORK/output/VF-Start-V2.47.506-FULL.zip"
          UPDATE="$WORK/output/VF_Start_V2.47.506_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          test "$(unzip -Z1 "$UPDATE")" = repair-v2.47.506.php
          if unzip -Z1 "$FULL" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/|news-cache/)' >/dev/null; then
            echo P01_TRIAL_PRIVATE_DATA_LEAK; exit 91
          fi
          mkdir -p "$WORK/bundle/VF_Start_News_OWNER_TRIAL_2.47.506"
          dest="$WORK/bundle/VF_Start_News_OWNER_TRIAL_2.47.506"
          cp "$FULL" "$UPDATE" "$dest/"
          (cd "$dest" && sha256sum VF-Start-V2.47.506-FULL.zip VF_Start_V2.47.506_UPDATE.zip > SHA256SUMS.txt)
          cat > "$dest/README_先看我.txt" <<'EOT'
          VF Start 新闻 2.47.506 OWNER_TRIAL_CANDIDATE（不是正式版）
          源码：665a24645101096df9cb4b4800154cdf04167a67
          上一正式版本：2.47.505

          仅供 Owner 在独立、可丢弃的测试网站手工试用。
          请勿覆盖 start.kewaro.com 正式站；不要作为已完成正式安全门禁的更新。
          core-updates 仍为 2.47.505，此包不改变在线分发或 Production。

          包内 FULL.zip 是零数据首次安装候选。
          包内 UPDATE.zip 仅用于可丢弃的 2.47.505 测试副本升级试用。
          测试前备份原文件、私有配置、SQLite / WAL / SHM、媒体、恢复包。
          故障时从独立完整备份恢复测试站，不要在 Production 试错。

          未完成正式门禁：原主分支 505 之后的导入/灾难保护高风险新路径；
          最终发布适用性、来源条款与完整恢复取证。绝不视为安全 PASS。
          Owner 人工验收后也须按正式门禁再发布上线。
          EOT
          (cd "$WORK/bundle" && zip -q -r "$WORK/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip" VF_Start_News_OWNER_TRIAL_2.47.506)
          unzip -t "$WORK/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip" >/dev/null
          sha256sum "$WORK/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip"
          echo P01_NEWS_OWNER_TRIAL_ARTIFACT_READY=PASS
      - name: Publish only one private owner trial prerelease (not official channel)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start --jq '.private')" = true
          if gh api "repos/llhzx2018/vf-start/git/ref/tags/$TRIAL_TAG" >/dev/null 2>&1; then
            echo EXISTING_TRIAL_TAG_STOP; exit 8
          fi
          gh api --method POST repos/llhzx2018/vf-start/git/refs \
            -f "ref=refs/tags/$TRIAL_TAG" -f "sha=$NEWS_SHA" > /dev/null
          test "$(gh api "repos/llhzx2018/vf-start/git/ref/tags/$TRIAL_TAG" --jq '.object.sha')" = "$NEWS_SHA"
          cat > "$WORK/notes.md" <<'EOT'
          # OWNER TRIAL ONLY — NOT FORMAL
          This is one non-formal, private, manually testable candidate.
          NOT part of P01 core-updates. Do NOT apply to Production.
          Bundle contains FULL and Atomic candidates, SHA256SUMS and a Chinese safety checklist.
          Exact source: 665a24645101096df9cb4b4800154cdf04167a67.
          Release gates and platform-denied equivalent safety tests are not claimed PASS.
          EOT
          gh release create "$TRIAL_TAG" "$WORK/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip" \
            -R llhzx2018/vf-start --prerelease --verify-tag \
            --title "P01 News 2.47.506 OWNER TRIAL — NOT FORMAL" --notes-file "$WORK/notes.md"
          gh api "repos/llhzx2018/vf-start/releases/tags/$TRIAL_TAG" > "$WORK/release.json"
          test "$(jq -r '.prerelease' "$WORK/release.json")" = true
          test "$(jq -r '.draft' "$WORK/release.json")" = false
          test "$(jq '.assets | length' "$WORK/release.json")" -eq 1
          mkdir -p "$WORK/readback"
          gh release download "$TRIAL_TAG" -R llhzx2018/vf-start -D "$WORK/readback" -p P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip
          cmp "$WORK/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip" "$WORK/readback/P01_News_2.47.506_OWNER_TRIAL_NOT_FORMAL.zip"
          echo P01_NEWS_PRIVATE_TRIAL_REMOTE_SHA=PASS
          echo P01_FORMAL_RELEASE_PERFORMED=NO
          echo P01_CORE_UPDATES_MODIFIED=NO
          echo P01_PRODUCTION_MODIFIED=NO
      - name: Clean transient private checkout and scratch packages
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact "$WORK"
          echo P01_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_RUNNER=NO
