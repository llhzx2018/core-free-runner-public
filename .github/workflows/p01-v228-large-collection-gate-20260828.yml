name: P01 V2.28 Large Collection Browsing Gate
on:
  push:
    branches: [task/p01-v228-large-collection-gate-20260828]
    paths: ['.github/workflows/p01-v228-large-collection-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: eeb2d4eda68a2aaf858066eb57dcd19d961e2dea
      TREE: ba06c40837ca32af4d2e6b7752d0244771a25f98
      ROOT: /tmp/p01-v228-large
      PORT: '18332'
      COOKIE: /tmp/p01-v228-large.cookies
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          path: product
      - name: Exact source syntax fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TREE"
          php -l product/src/surfaces.php
          grep -F 'aria-label="资源模式过滤"' product/src/surfaces.php >/dev/null
          grep -F 'aria-label="分类过滤"' product/src/surfaces.php >/dev/null
          grep -F 'aria-label="每页数量"' product/src/surfaces.php >/dev/null
          echo P01_V228_EXACT=PASS
      - name: Fresh runtime and representative large collection
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$COOKIE"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-v228-server.log 2>&1 & echo $! >/tmp/p01-v228.pid
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-v228-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v228-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V228 Large Collection' --data-urlencode 'admin_password=P01V228!Large' --data-urlencode 'admin_password_confirm=P01V228!Large' -o /tmp/p01-v228-setup-post.html
          cat >/tmp/p01-v228-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v228-large/app/bootstrap.php';
          require_once '/tmp/p01-v228-large/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $cats=[]; foreach(['开发','AI','影视'] as $name) $cats[$name]=$r->createCategory(['name'=>$name,'description'=>'','is_private'=>false]);
          for($i=1;$i<=180;$i++){
              $cat=$i%3===0?$cats['AI']:$cats['开发'];
              $a=$r->saveLink(null,['category_id'=>$cat,'title'=>'Tool '.$i,'url'=>'https://tool'.$i.'.example.com','description'=>'large collection','tags'=>$i%5===0?'AI,工具':'工具','is_private'=>false,'is_favorite'=>$i%13===0],'manual');
              if($i<=30) $s->upsertProfile((int)$a['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>1]);
          }
          for($i=1;$i<=20;$i++){
              $a=$r->saveLink(null,['category_id'=>$cats['影视'],'title'=>'Movie '.$i,'url'=>'https://movie'.$i.'.example.com','description'=>'movie','tags'=>'电影','is_private'=>false],'manual');
              $s->upsertProfile((int)$a['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2026','media_status'=>'want']);
          }
          file_put_contents('/tmp/p01-v228-ai-cat',(string)$cats['AI']);
          echo "P01_V228_SEED=PASS\n";
          PHP
          php /tmp/p01-v228-seed.php | grep -Fx 'P01_V228_SEED=PASS'
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data '{"password":"P01V228!Large"}' | jq -e '.ok==true' >/dev/null
          echo P01_V228_RUNTIME=PASS
      - name: Browsing filter pagination contract
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="http://127.0.0.1:$PORT"
          CAT=$(cat /tmp/p01-v228-ai-cat)
          curl -fsS -b "$COOKIE" "$BASE/surfaces.php?per=30" -o /tmp/p01-v228-per30.html
          grep -F '200 项' /tmp/p01-v228-per30.html >/dev/null
          grep -F '第 1 / 7 页' /tmp/p01-v228-per30.html >/dev/null
          grep -F '30 / 页' /tmp/p01-v228-per30.html >/dev/null
          curl -fsS -b "$COOKIE" "$BASE/surfaces.php?surface=channels&per=100" -o /tmp/p01-v228-channels.html
          grep -F '30 项' /tmp/p01-v228-channels.html >/dev/null
          grep -F '>Channels</option>' /tmp/p01-v228-channels.html >/dev/null
          curl -fsS -b "$COOKIE" "$BASE/surfaces.php?surface=watch&per=30" -o /tmp/p01-v228-watch.html
          grep -F '20 项' /tmp/p01-v228-watch.html >/dev/null
          curl -fsS -b "$COOKIE" "$BASE/surfaces.php?category=$CAT&per=30" -o /tmp/p01-v228-category.html
          grep -F '60 项' /tmp/p01-v228-category.html >/dev/null
          grep -F '第 1 / 2 页' /tmp/p01-v228-category.html >/dev/null
          curl -fsS -b "$COOKIE" "$BASE/surfaces.php?q=Tool%2010&surface=start&per=30" -o /tmp/p01-v228-combined.html
          grep -F '搜索结果' /tmp/p01-v228-combined.html >/dev/null
          grep -F 'Tool 10' /tmp/p01-v228-combined.html >/dev/null
          grep -F '清除' /tmp/p01-v228-combined.html >/dev/null
          echo P01_V228_BROWSING=PASS
      - name: Regression baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v228-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v228-verify.txt
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v228-surface.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v228-surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v228-base.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v228-base.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v228-base.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v228-base.txt
          php -r 'require "/tmp/p01-v228-large/app/bootstrap.php";$db=vf_db();if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(1);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "P01_V228_SQLITE=PASS\n";'
          echo P01_V228_REGRESSION=PASS
      - name: Verdict
        run: |
          echo P01_V228_LARGE_COLLECTION_GATE=PASS
          echo SOURCE=$SOURCE
          echo TREE=$TREE
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v228.pid 2>/dev/null)" 2>/dev/null || true
