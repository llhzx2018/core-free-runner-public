name: P02 V2.5.17 Library Model Convergence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2517-library-model-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      TARGET_BRANCH: maintenance/v2.5.17-library-model-convergence
    steps:
      - name: Require registered capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo CAPABILITY_GATE=PASS

      - name: Checkout P02 maintenance candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Verify and reseal V2.5.17
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '2.5.17'
          node --check public/assets/v254-common-branding.js
          grep -q 'V2.5.17_LIBRARY_MODEL_CONVERGENCE' public/assets/v254-common-branding.js
          grep -q 'side-item\[data-mode="quick"\]' public/assets/v254-common-branding.css
          grep -q '最近打开、阅读、编辑、复制或调用过的资料' public/assets/v254-common-branding.js
          grep -q 'scheduleArticleOpen=function(){}' public/assets/v254-common-branding.js
          grep -q "last_copied_at IS NOT NULL OR last_opened_at IS NOT NULL" src/app/Repository.php
          bash scripts/build-deploy-tree.sh "$RUNNER_TEMP/p02-v2517-deploy" >/dev/null
          test "$(cat "$RUNNER_TEMP/p02-v2517-deploy/VERSION.txt")" = '2.5.17'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changelog=Path('CHANGELOG.md').read_text(encoding='utf-8')
          section='''## V2.5.17 · 资料库模型收敛 · 2026-08-19\n\n- 明确“临时工作台 = 真正的便签 / 随手记；资料库 = 长期保存资料”的产品边界。\n- 左侧资料库导航隐藏历史“便签 / 文章资料”一级筛选，只保留全部内容、收藏、最近使用与分类。\n- 旧 quick/article 本地视图状态自动安全回落到“全部内容”，底层 content_mode 兼容字段与历史数据不迁移。\n- 最近使用统一记录明确的打开、阅读、编辑、复制或调用；自动首选、布局恢复和程序渲染不会污染最近使用。\n- 用户可见 quick/article 术语收敛为“普通资料 / 长文资料”；Schema 继续 2401，无 Migration。\n\n'''
          body=changelog
          if body.startswith('## V2.5.17'):
              next_pos=body.find('\n## ',4)
              body=body[next_pos+1:] if next_pos!=-1 else ''
          Path('CHANGELOG.md').write_text(section+body,encoding='utf-8')
          p=Path('SOURCE_MANIFEST.json');m=json.loads(p.read_text(encoding='utf-8'))
          m['version']='2.5.17';m['mapping_contract']=str(m.get('mapping_contract','')).replace('V2.5.16','V2.5.17')
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes();h=hashlib.sha256(raw).hexdigest();e['bytes']=len(raw);e['sha256']=h;e['repo_sha256']=h
          assert len(m['entries'])==m['runtime_source_file_count']==74
          lines=['VF Library Source Manifest','Version: 2.5.17','Schema: 2401','Runtime source files: 74','']
          for e in m['entries']:lines.append(f"{e['sha256']}  {e['bytes']:>8}  {e['repo_path']} -> {e['full_path']}")
          txt='\n'.join(lines)+'\n';Path('SOURCE_MANIFEST.txt').write_text(txt,encoding='utf-8')
          m['repo_sha256']=hashlib.sha256(txt.encode('utf-8')).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          for e in m['entries']:
              raw=Path(e['repo_path']).read_bytes();h=hashlib.sha256(raw).hexdigest();assert len(raw)==e['bytes'] and h==e['sha256']==e['repo_sha256']
          assert hashlib.sha256(Path('SOURCE_MANIFEST.txt').read_bytes()).hexdigest()==m['repo_sha256']
          print('SOURCE_MANIFEST_74_OF_74=PASS')
          print('SOURCE_MANIFEST_TXT_SHA=PASS')
          print('SCHEMA=2401')
          print('PRODUCTION_WRITE=NO')
          PY

      - name: Commit verified candidate metadata
        working-directory: product
        shell: bash
        env:
          TOKEN: ${{ env.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          if ! git diff --cached --quiet; then git commit -m 'docs(release): reseal V2.5.17 candidate manifest'; fi
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-library.git"
          git push origin HEAD:${TARGET_BRANCH}
          echo P02_V2517_PUBLIC_RUNNER_GATE=PASS
# reseal after explicit-use semantics fix
