name: P05 Single Product Phase2 Writer R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-single-product-phase2-writer-r2.yml'
      - 'scripts/p05-single-product-phase2-writer-r2.py'

permissions:
  contents: read

jobs:
  write:
    if: github.event.pull_request.head.ref == 'write/p05-single-product-phase2-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private write capability
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$WRITE_TOKEN"
      - name: Checkout disposable writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact P05 phase2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: product/single-product-consolidation-phase2-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 1
          path: p05
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Bind exact Product base
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = 'cdf194b9a88d29ecda4cd48523d67eb240f0fe7c'
          test "$(cat p05/VERSION)" = '1.2.3'
      - name: Apply phase2 retirement and parity migration R2
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-single-product-phase2-writer-r2.py
          git -C p05 diff --check
          mapfile -t changed < <(git -C p05 status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 11
          expected=(
            'src/client/App.tsx'
            'src/client/CommonSystemCenter.tsx'
            'src/client/DemoDatasetShortcut.tsx'
            'src/client/ProductWorkspaceShortcut.tsx'
            'tests/contract/common-system-human-ui.test.ts'
            'tests/contract/single-product-parity.test.ts'
            'tests/contract/single-product-shell.test.ts'
            'tests/unit/classic-keyword-trend-coverage.test.ts'
            'tests/unit/classic-nullable-metric-truth.test.ts'
            'tests/unit/classic-overview-loading.test.ts'
            'tests/unit/classic-truth-states.test.ts'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test ! -e p05/src/client/App.tsx
          test ! -e p05/src/client/ProductWorkspaceShortcut.tsx
          test ! -e p05/src/client/DemoDatasetShortcut.tsx
          ! grep -F "tab === 'update'" p05/src/client/CommonSystemCenter.tsx
          ! grep -F '/api/system/update/apply' p05/src/client/CommonSystemCenter.tsx
          ! grep -F '系统信息、基线、升级、备份与运行健康' p05/src/client/CommonSystemCenter.tsx
          test "$(cat p05/VERSION)" = '1.2.3'
      - name: Install dependencies
        working-directory: p05
        run: npm ci
      - name: Verify phase2 parity and retirement
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run build
          ! grep -R -F '新版工作区 Preview' dist
          ! grep -R -F '返回经典工作区' dist
          grep -R -F '系统维护' dist/client/assets >/dev/null
          grep -R -F '系统与更新' dist/client/assets >/dev/null
      - name: Commit and push private Product candidate
        run: |
          set -Eeuo pipefail
          git -C p05 config user.name 'VictorForge'
          git -C p05 config user.email 'llhzx2018@gmail.com'
          git -C p05 add -A
          git -C p05 commit -m 'refactor(P05): retire Classic workspace'
          git -C p05 push origin HEAD:product/single-product-consolidation-phase2-20260902
          echo "P05_SINGLE_PRODUCT_PHASE2_CANDIDATE_SHA=$(git -C p05 rev-parse HEAD)"
          echo "P05_SINGLE_PRODUCT_PHASE2_CANDIDATE_TREE=$(git -C p05 rev-parse HEAD^{tree})"
          echo 'P05_SINGLE_PRODUCT_PHASE2_RELEASE_WRITE=0'
          echo 'P05_SINGLE_PRODUCT_PHASE2_PRODUCTION_WRITE=0'
