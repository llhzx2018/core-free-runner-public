name: P01 V2.32 Admin Root Home Edit
on:
  push:
    branches: [task/p01-v232-home-command-center-20260829]
    paths:
      - .github/workflows/p01-v232-admin-root-home-edit-20260829.yml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SOURCE: 723299984f8afb6b472691c19caf9057ddf6235e
      PRODUCT_BRANCH: feature/p01-v2.32-home-command-center-20260829
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-v2.32-home-command-center-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source fenced one-line admin root edit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('product/src/index.php')
          s=p.read_text(encoding='utf-8')
          old="header('Location: surfaces.php', true, 302);"
          new="header('Location: home.php', true, 302);"
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one admin root redirect, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          php -l product/src/index.php
          test "$(git -C product diff --name-only)" = "src/index.php"
          git -C product diff --check
          git -C product diff -- src/index.php
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/index.php
          git -C product commit -m "feat(P01): make Home the admin root workspace"
          git -C product push origin "HEAD:${PRODUCT_BRANCH}"
          echo "NEW_SOURCE=$(git -C product rev-parse HEAD)"
          echo "NEW_TREE=$(git -C product rev-parse HEAD^{tree})"
          echo "OWNER_PRODUCTION_WRITE=NO"
          echo "RELEASE=NO"
