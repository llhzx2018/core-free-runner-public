name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-layout-editor164-20261022]
    paths: ['.github/workflows/s01-layout-editor164-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.164
  TARGET_SHA: 6142d47bf4f8409ae9d5e7888e5772b669fceee2
  UPDATE_SHA: c3e56da2420d70e1a7c0a222eefcbb64b301c0ac
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: c3e56da2420d70e1a7c0a222eefcbb64b301c0ac
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='7e15c3528911a00b18ccd4b6237c5a540eca399b1d15ee2b4593e5d9eb9441ed' and m['asset_bytes']==1969957
          assert m['runtime_files']==476 and '1.35.163' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
