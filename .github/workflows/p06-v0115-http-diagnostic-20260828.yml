name: P06 V0.1.15 HTTP Diagnostic

on:
  push:
    paths:
      - '.github/workflows/p06-v0115-http-diagnostic-20260828.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact P06 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: 561e59a82f035e2622c4567710bec06a1c50dab3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p06
      - name: Diagnose real HTTP runtime
        shell: bash
        run: |
          set -u
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer sqlite3 >/dev/null
          cd p06
          composer install --no-interaction --prefer-dist --no-progress
          ROOT="$RUNNER_TEMP/p06-v0115-http-diag"
          export APP_ENV=test
          export VF_PRESS_STORAGE_PATH="$ROOT/storage"
          export VF_PRESS_DB_PATH="$ROOT/storage/app.db"
          export VF_PRESS_OWNER_USERNAME=human-owner
          export VF_PRESS_OWNER_PASSWORD='P06-Human-Baseline-Owner-Password-2026!'
          export VF_PRESS_OWNER_DISPLAY_NAME='Human Baseline Owner'
          export VF_PRESS_SESSION_IDLE_SECONDS=604800
          export VF_PRESS_SESSION_ABSOLUTE_SECONDS=2592000
          export VF_PRESS_SESSION_COOKIE_SECONDS=2592000
          export VF_PRESS_SERVER_SESSION_FLOOR_SECONDS=2592000
          export VF_PRESS_STEP_UP_WINDOW_SECONDS=900
          export VF_PRESS_DISPLAY_TIMEZONE=Asia/Shanghai
          export VF_PRESS_LOCALE=zh-CN
          mkdir -p "$ROOT/storage" "$ROOT/sessions"
          php bin/migrate.php
          php bin/create-owner.php
          echo "VERSION=$(cat VERSION)"
          PORT=19059
          php -d session.save_path="$ROOT/sessions" -S 127.0.0.1:$PORT -t public public/index.php >"$ROOT/server.log" 2>&1 &
          PID=$!
          sleep 1
          set +e
          curl -sS -D "$ROOT/health.h" -o "$ROOT/health.body" "http://127.0.0.1:$PORT/health"
          RC=$?
          echo "CURL_RC=$RC"
          echo '--- HEALTH HEADERS ---'
          cat "$ROOT/health.h" || true
          echo '--- HEALTH BODY ---'
          cat "$ROOT/health.body" || true
          echo
          echo '--- SERVER LOG ---'
          cat "$ROOT/server.log" || true
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          exit "$RC"
