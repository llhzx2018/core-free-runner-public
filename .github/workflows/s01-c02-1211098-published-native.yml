name: S01 C02 1211098 Published WordPress Native Discovery
on:
  push:
    branches: [task/s01-c02-1211098-published-native-20261012]
permissions:
  contents: read
  actions: read
jobs:
  published-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: vf_ops_discovery
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
          MARIADB_ROOT_PASSWORD: fixture-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only-root"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      SOURCE_VERSION: '1.21.1097'
      TARGET_VERSION: '1.21.1098'
      CHANNEL_SHA: 'e0dec8be0a6b2cfff78cbaef3212b81db5e21c5a'
      EXPECTED_BYTES: '3568645'
      EXPECTED_SHA: '5e9c37625519a99f367f66bd666f9670ec7ae2f2bf94bb7041c979d5ee7e8a72'
    steps:
      - name: Checkout scoped public-safe native verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Prepare isolated WordPress and MariaDB
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl unzip curl
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar' -o /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          mysql --protocol=tcp -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_ops_discovery
          bash -n runner/lanes/s01-c02-1211098/published-native.sh
      - name: Live published channel and native WordPress update test
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash runner/lanes/s01-c02-1211098/published-native.sh
      - name: Upload safe redacted evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-published-native-${{ github.run_id }}
          path: |
            proof-native/stage.txt
            proof-native/published-channel.json
            proof-native/channel-commit.json
            proof-native/release.json
            proof-native/wordpress-native.txt
            proof-native/FINAL_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 30
