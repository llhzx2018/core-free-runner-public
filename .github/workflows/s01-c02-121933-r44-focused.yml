name: S01-C02 1.21.933 R44 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121933-r44-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: c0fd57773eb66ffdeb3056058aebbccba9b29306
      EXPECTED_VERSION: 1.21.933
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-NAVIGATION-FLYOUT-POLISH-R44" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: Focused PHP and JS checks
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l target/vf-ops.php
          php -l target/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php -l target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          node --check target/assets/js/admin-s01-domain-shell-r1.js
          echo "FOCUSED_CODE_GATE=PASS"

      - name: Static UX contract checks
        shell: bash
        run: |
          set -Eeuo pipefail
          CSS=target/assets/css/current/admin-s01-v6-shell-r1.css
          NAV=target/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          grep -Fq -- "--vf-v6-domain-flyout-wide-width:520px" "$CSS"
          grep -Fq -- "grid-template-columns:repeat(2,minmax(0,1fr))" "$CSS"
          grep -Fq -- "overflow:visible!important" "$CSS"
          grep -Fq -- "vf-v6-domain-flyout-group" "$NAV"
          grep -Fq -- "主要功能" "$NAV"
          grep -Fq -- "更多功能" "$NAV"
          if sed -n '/R44 · Mature domain-flyout density polish/,/Approved prototype: no persistent second or third navigation row/p' "$CSS" | grep -Fq 'overflow-y:auto!important'; then
            echo "R44_SCROLL_TRAY_REGRESSION=FAIL"
            exit 1
          fi
          echo "R44_DESKTOP_FLYOUT_DENSITY=PASS"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121933-r44-focused-${{ github.run_id }}
          path: |
            target/VERSION
          retention-days: 7
