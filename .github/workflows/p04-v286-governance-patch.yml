name: P04 V2.8.6 Governance Patch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v286-governance-patch.yml'
      - 'requests/p04-v286-governance-patch.txt'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P04_REPOSITORY: llhzx2018/vf-infra
      EXPECTED_DEVELOP: 979159dc119ea2b35dccb55351b477a5c99843a9
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 develop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P04_REPOSITORY }}
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Patch Current Truth governance only
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEVELOP"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P04'
          assert d['formal_release']['version']=='2.8.5'
          assert d['schema']==14

          d['status']='V2.8.6_CANDIDATE_PASS'
          d['lifecycle']='CANDIDATE_READY_FOR_OWNER_RELEASE_AUTHORIZATION'
          d['version']='2.8.6'
          ba=d.setdefault('branch_authority',{})
          ba['main']='V2.8.5_FORMAL_PRODUCTION_ALIGNED'
          ba['develop']='V2.8.6_VERIFIED_CANDIDATE_PLUS_GOVERNANCE'
          ba['working_candidate_product_source']='d98c2bc9281f259b6ba9f90855b01e42b73eabb3'
          ba['working_candidate_product_tree']='40a5ae119812676aaf2f6e5a89e0e9c238876457'
          ba['force_push']='NO'
          ba['history_rewrite']='NO'

          prod=d.setdefault('production',{})
          prod['installed_version']='2.8.5'
          prod['installed_version_evidence']='OWNER_SCREENSHOTS_V2.8.5_SYSTEM_INFO_AND_SETTINGS_20260819'
          prod['installed_version_observed_at']='2026-08-19T19:22:00+08:00'
          prod['schema_visible']=14
          prod['program_version_visible']='2.8.5'
          prod['upgrade_v285']='PASS_OWNER_REAL_USE'
          prod['production_write_by_assistant_v286_cycle']=0
          prod['upgrade_v286']='NOT_EXECUTED'
          prod['next_requirement']='OWNER_AUTHORIZE_V2.8.6_MAIN_PROMOTION_FORMAL_RELEASE_AND_CORE_UPDATES'

          gates=d.setdefault('verification_gates',{})
          gates['production_v285_upgrade']='PASS_OWNER_REAL_USE'
          gates['v286_repository_health']='PASS'
          gates['v286_migrations_001_014']='PASS'
          gates['v286_deterministic_runtime_tree']='PASS'
          gates['v286_deterministic_update']='PASS'
          gates['v286_atomic_self_test']='PASS'
          gates['v286_background_task_owner_copy']='PASS'
          gates['v286_diagnostics_immediate_feedback']='PASS'
          gates['v286_diagnostics_result_retention']='PASS'
          gates['v286_settings_select_alignment']='PASS'
          gates['v286_v271_long_action_bridge']='PASS'
          gates['v286_browser_owner_defects']='PASS'
          gates['v286_formal_release']='WAITING_OWNER_AUTHORIZATION'
          gates['production_v286_upgrade']='NOT_EXECUTED'

          cleanup=d.setdefault('temporary_review_cleanup',{})
          cleanup['public_runner_pr_182']='CLOSED_NOT_MERGED_WITH_FINAL_PASS_EVIDENCE'

          d['v286_production_ux_maintenance_candidate']={
            'status':'CANDIDATE_PASS',
            'schema':14,
            'migration':'NONE',
            'provider_authority_change':False,
            'exact_product_source':'d98c2bc9281f259b6ba9f90855b01e42b73eabb3',
            'product_tree':'40a5ae119812676aaf2f6e5a89e0e9c238876457',
            'runtime_fingerprint':'2c4b54b204203380de8c05da75d92e21089ed28b5380b9ab50667dd3be6ae15d',
            'source_manifest_sha256':'bda08ab57e1b69b62de82689b3e7d1a6d835e35e553929ae37341e3974083e6d',
            'runtime_file_count_including_manifest':216,
            'package_runner_run':32249183168,
            'package_runner_job':96056186867,
            'candidate_evidence_artifact_id':9363735794,
            'candidate_evidence_artifact_sha256':'425eafb39ac417c798f719d4fc1e8e652cb4b3a11ac7ef7d566f185315e71403',
            'browser_runner_run':32249077363,
            'browser_runner_job':96055873669,
            'full':{'asset_name':'VF_Infra_V2.8.6_FULL.zip','bytes':579762,'sha256':'1f77d7522a2cad2c4e3a0f4528dff410aaa4d8f3cb5b0c77465c8f9b7016bf40'},
            'update':{'asset_name':'VF_Infra_V2.8.6_UPDATE.zip','bytes':1250606,'sha256':'990437edf412efa4ffda89caf32823f059f945c205a34ed87db7db9486fe6106','allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4','2.8.5']},
            'automatic_task_copy':'PASS',
            'diagnostics_feedback_and_result':'PASS',
            'settings_select_alignment':'PASS',
            'v271_long_action_bridge':'PASS',
            'production_write':0
          }
          d['current_phase']='V2.8.6_CANDIDATE_PASS_READY_FOR_OWNER_RELEASE_AUTHORIZATION'
          d['project_block']='NONE'
          d['window_execution_block']='NONE'
          d['next_gate']='OWNER_MAIN_PROMOTION_AND_FORMAL_RELEASE_AUTHORIZATION'
          d['next_action']='OWNER_AUTHORIZE_MAIN_PROMOTION_V2.8.6_FORMAL_RELEASE_AND_CORE_UPDATES'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = 'VF_PROJECT.json'

      - name: Commit governance-only Current Truth
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(P04): align V2.8.6 candidate current truth'
          git push origin HEAD:develop
          echo "P04_V286_GOVERNANCE_COMMIT=$(git rev-parse HEAD)"
          echo 'RUNTIME_CHANGE_IN_THIS_COMMIT=0'
          echo 'MAIN_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
