name: TEMP S01-C02 Ops 1.21.844 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 38be815bd77ae62548fe763b106bfec0b937d2c7
      TREE: 47ee86c21ae1674d2892c42945bc459e1f4d6e9c
      TAG: v1.21.844
      ASSET: vf-tools-ops_V1.21.844.zip
      BYTES: '3303808'
      SHA256: 4fde6c26086f35ca9970394896d90f31750b72113f53a04c47bd575f14cfed9f
      FILES: '926'
      FP: 8600816db1bc0fe48257d5ca7f9f1f2f58c6326634d3b1f8df513be49aa20974
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.844
          php ops/.github/phase3/v121844-record-isolation-retry.php | grep -Fxq PASS_V121844_RECORD_ISOLATION_RETRY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.844 closes the cross-job terminal-evidence collision proven on Production V1.21.843.

          - Focused Gate 34008144624 PASS on exact source 38be815bd77ae62548fe763b106bfec0b937d2c7 / tree 47ee86c21ae1674d2892c42945bc459e1f4d6e9c.
          - Deterministic Artifact Identity 34008167216 PASS.
          - Production V1.21.843 is current with reusable Static Source, manualSourceUploadRequired=false, candidatePackageReady=false, finalOnlinePass=NO, zero internal-link failures.
          - Exact contradiction: the V1.21.838 fresh Candidate is still bound to the trusted DONE inspection and immutable Source, yet at current_stage=1 already carries the single Final Audit reopen leaf and failed final_decision; normal pipeline Final Audit cannot exist before Stage 6.
          - Root cause: asynchronous recovery jobs may rebind active_release_job/candidate_async_job. A subsequent PARTIAL/current sync could retain terminal fields written by another job, and the next load then normalized that stale Final Audit evidence into the new Candidate.
          - V1.21.844 isolates the canonical release record so PARTIAL/current records cannot retain final_candidate_audit_result, generation_result, cf_upload_check_summary, candidate_async_error or candidate_audit from another job. Terminal writers remain fail-closed and authoritative.
          - One-time recovery requires the exact early-stage contradiction, exact Source SHA across trusted inspection/candidate/release record, exact inspection lineage, exact durable-kick boundary, exact blocker job identity, exactly one proven reopen leaf, and failed final_decision. Any mismatch fails closed.
          - Only after proof does it rebind to the trusted inspection, create a distinct fresh Candidate, verify RUNNING Stage 0 with no inherited audit failure and exact Source SHA, then delegate bounded execution to the existing V1.21.834 worker.
          - Static Source is not uploaded or mutated; the old failed Candidate is not reset or mutated; Final Audit, candidatePackageReady and finalOnline are never forced.
          - M3U8 migration/schema/DB, Seed HOLD, JD.gg, WPvivid, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.844.zip; 3303808 bytes; SHA256 4fde6c26086f35ca9970394896d90f31750b72113f53a04c47bd575f14cfed9f; runtime files 926; fingerprint 8600816db1bc0fe48257d5ca7f9f1f2f58c6326634d3b1f8df513be49aa20974.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.844' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121844=PASS
