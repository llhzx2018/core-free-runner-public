name: TEMP skill-book V5.7 reader transfer implementation RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_TEST_RED: 81b5c3274cd9b66a737fca98d8a68674761cdb41

jobs:
  implementation-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact test-first V5.7 WIP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_TEST_RED"
          test "$(git -C gov rev-parse HEAD)" = "$V57_TEST_RED"
          test -f gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py
          test ! -e gov/skills/skill-book/V5.7/scripts/reader_transfer_audit.py

      - name: Require adversarial matrix to be RED before implementation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py > /tmp/v57-red.out 2>&1
          rc=$?
          set -e
          cat /tmp/v57-red.out
          test "$rc" -ne 0
          grep -q 'FAILED' /tmp/v57-red.out
          grep -q 'test_good_blind_reader_proxy_passes_but_real_reader_stays_not_run' /tmp/v57-red.out
          echo 'V57_TEST_FIRST_IMPLEMENTATION_RED=PASS'
          echo 'EXPECTED_IMPLEMENTATION_RED_PASS'
