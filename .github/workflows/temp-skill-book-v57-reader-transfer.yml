name: TEMP skill-book V5.7 full WIP regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_EXACT: 1918f413a0e24e696245f8c76aeb93c017bf256d

jobs:
  full-wip-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact Runtime-integrated V5.7 WIP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_EXACT"
          test "$(git -C gov rev-parse HEAD)" = "$V57_EXACT"
          test -f gov/skills/skill-book/V5.7/scripts/reader_transfer_audit.py

      - name: Compile all V5.7 Python
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find gov/skills/skill-book/V5.7 -type f -name '*.py' | sort)
          test "${#files[@]}" -gt 0
          python -m py_compile "${files[@]}"
          echo "V57_PYTHON_COMPILE_COUNT=${#files[@]}"
          echo 'V57_PYTHON_COMPILE=PASS'

      - name: Run complete V5.7 pytest suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q gov/skills/skill-book/V5.7/tests | tee /tmp/v57-full.txt
          echo 'V57_FULL_WIP_REGRESSION=PASS'
