name: TEMP skill-book V5.7 seed WIP after RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V56_SOURCE: b32fda1c75fdbc4d2e40aaaa444ba7b31e06bd28
  V57_BRANCH: work/skill-book-v57-reader-transfer
  V57_EXPECTED: 920befc731c1cbcec293672c0ea49dc65c9ada42

jobs:
  seed-v57-wip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.7 design branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$V57_EXPECTED"
          test "$(git -C gov rev-parse ${V56_SOURCE}:skills/skill-book/V5.6/VERSION)" != ''
          test ! -e gov/skills/skill-book/V5.7
          test -f gov/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md

      - name: Seed exact V5.6 source bytes as V5.7 WIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gov/skills/skill-book/V5.7
          git -C gov archive "$V56_SOURCE" skills/skill-book/V5.6 | tar -x -C /tmp
          cp -a /tmp/skills/skill-book/V5.6/. gov/skills/skill-book/V5.7/
          test "$(cat gov/skills/skill-book/V5.7/VERSION)" = '5.6'
          test ! -e gov/skills/skill-book/V5.7/scripts/reader_transfer_audit.py
          git -C gov add skills/skill-book/V5.7
          test -n "$(git -C gov diff --cached --name-only)"
          test -z "$(git -C gov diff --cached --name-only | grep -v '^skills/skill-book/V5.7/' || true)"
          echo "V57_SEED_FILES=$(git -C gov diff --cached --name-only | wc -l)"
          echo 'V57_WIP_SEED_GUARD=PASS'

      - name: Guarded WIP seed writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin refs/heads/${V57_BRANCH} | awk '{print $1}')"
          test "$live" = "$V57_EXPECTED"
          test -z "$(git -C gov diff --cached --name-only | grep -v '^skills/skill-book/V5.7/' || true)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov commit -m 'skill-book: seed V5.7 WIP from exact V5.6 candidate'
          git -C gov push origin HEAD:refs/heads/${V57_BRANCH}
          new="$(git -C gov rev-parse HEAD)"
          test "$(git -C gov ls-remote origin refs/heads/${V57_BRANCH} | awk '{print $1}')" = "$new"
          echo "V57_WIP_SEED_COMMIT=$new"
