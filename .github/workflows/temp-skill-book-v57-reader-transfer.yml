name: TEMP skill-book V5.7 active identity inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_EXACT: 1918f413a0e24e696245f8c76aeb93c017bf256d

jobs:
  active-identity-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact stable V5.7 WIP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_EXACT"
          test "$(git -C gov rev-parse HEAD)" = "$V57_EXACT"

      - name: Inventory inherited V5.6 active identity references
        shell: bash
        run: |
          set -euo pipefail
          root=gov/skills/skill-book/V5.7
          grep -R -l -E 'SB56-RUNTIME-CONTRACT-CBE00206|V5\.6|(^|[^0-9])5\.6([^0-9]|$)' "$root" \
            --exclude-dir=validation --exclude='SHA256SUMS.txt' | sort | tee /tmp/identity-files.txt
          echo "ACTIVE_IDENTITY_FILE_COUNT=$(wc -l < /tmp/identity-files.txt)"
          echo '--- ACTIVE IDENTITY LINES ---'
          grep -R -n -E 'SB56-RUNTIME-CONTRACT-CBE00206|V5\.6|(^|[^0-9])5\.6([^0-9]|$)' "$root" \
            --exclude-dir=validation --exclude='SHA256SUMS.txt' | head -n 240
          echo 'V57_ACTIVE_IDENTITY_INVENTORY=PASS'
