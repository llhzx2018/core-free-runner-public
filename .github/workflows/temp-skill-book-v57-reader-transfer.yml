name: TEMP skill-book V5.7 transfer bridge GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_BRIDGE: 6e9127b0143d0e26e64bca81b1056caf0628ed66

jobs:
  reader-transfer-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.7 bridge WIP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_BRIDGE"
          test "$(git -C gov rev-parse HEAD)" = "$V57_BRIDGE"

      - name: Run targeted reader-transfer and V5.6 false-green bridge
        shell: bash
        run: |
          set -euo pipefail
          python gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py 2>&1 | tee /tmp/transfer.out
          grep -q 'Ran 13 tests' /tmp/transfer.out
          grep -q '^OK$' /tmp/transfer.out
          python gov/skills/skill-book/V5.7/tests/test_reader_transfer_v56_false_green_bridge.py 2>&1 | tee /tmp/bridge.out
          grep -q 'Ran 3 tests' /tmp/bridge.out
          grep -q '^OK$' /tmp/bridge.out
          echo 'V57_READER_TRANSFER_TARGETED=13/13_PASS'
          echo 'V56_DEPTH_GREEN_V57_TRANSFER_RED_BRIDGE=3/3_PASS'
          echo 'V57_TARGETED_TOTAL=16/16_PASS'
