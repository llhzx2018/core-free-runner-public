name: TEMP skill-book V5.7 runtime transfer integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_BRANCH: work/skill-book-v57-reader-transfer
  V57_EXPECTED: 6e9127b0143d0e26e64bca81b1056caf0628ed66
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v57-reader-transfer-20260829

jobs:
  runtime-transfer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact WIP and runner helper
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$V57_EXPECTED"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v57/patch_runtime_transfer.py

      - name: Apply runtime transfer patch locally
        shell: bash
        run: |
          set -euo pipefail
          python runner/temp/skill-book-v57/patch_runtime_transfer.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            skills/skill-book/V5.7/scripts/runtime_acceptance_audit.py \
            skills/skill-book/V5.7/scripts/runtime_authority_fidelity_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_acceptance_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_authority_fidelity_audit.py | sort)"
          python -m py_compile \
            gov/skills/skill-book/V5.7/scripts/runtime_acceptance_audit.py \
            gov/skills/skill-book/V5.7/scripts/runtime_authority_fidelity_audit.py \
            gov/skills/skill-book/V5.7/scripts/reader_transfer_audit.py
          echo 'V57_RUNTIME_PATCH_SCOPE_AND_COMPILE=PASS'

      - name: Run targeted transfer and runtime integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q \
            gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py \
            gov/skills/skill-book/V5.7/tests/test_reader_transfer_v56_false_green_bridge.py \
            gov/skills/skill-book/V5.7/tests/test_runtime_authority_fidelity_audit.py \
            gov/skills/skill-book/V5.7/tests/test_runtime_acceptance_audit.py | tee /tmp/v57-runtime-tests.txt
          echo 'V57_RUNTIME_TRANSFER_INTEGRATION_TESTS=PASS'

      - name: Guarded four-file WIP writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin refs/heads/${V57_BRANCH} | awk '{print $1}')"
          test "$live" = "$V57_EXPECTED"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            skills/skill-book/V5.7/scripts/runtime_acceptance_audit.py \
            skills/skill-book/V5.7/scripts/runtime_authority_fidelity_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_acceptance_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_authority_fidelity_audit.py | sort)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add \
            skills/skill-book/V5.7/scripts/runtime_acceptance_audit.py \
            skills/skill-book/V5.7/scripts/runtime_authority_fidelity_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_acceptance_audit.py \
            skills/skill-book/V5.7/tests/test_runtime_authority_fidelity_audit.py
          git -C gov commit -m 'skill-book: integrate V5.7 reader transfer into runtime authority'
          git -C gov push origin HEAD:refs/heads/${V57_BRANCH}
          new="$(git -C gov rev-parse HEAD)"
          test "$(git -C gov ls-remote origin refs/heads/${V57_BRANCH} | awk '{print $1}')" = "$new"
          echo "V57_RUNTIME_TRANSFER_WIP_COMMIT=$new"
