name: TEMP skill-book V5.7 reader transfer RED gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V56_SOURCE: b32fda1c75fdbc4d2e40aaaa444ba7b31e06bd28
  V57_DESIGN: 920befc731c1cbcec293672c0ea49dc65c9ada42

jobs:
  expected-red-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 Candidate and V5.7 design authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov56
          git -C gov56 checkout --quiet "$V56_SOURCE"
          test "$(git -C gov56 rev-parse HEAD)" = "$V56_SOURCE"
          test "$(cat gov56/skills/skill-book/V5.6/VERSION)" = '5.6'
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov57
          git -C gov57 checkout --quiet "$V57_DESIGN"
          test "$(git -C gov57 rev-parse HEAD)" = "$V57_DESIGN"
          test -f gov57/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md

      - name: Reproduce legacy receipt-only closure path
        shell: bash
        run: |
          set -euo pipefail
          python gov56/skills/skill-book/V5.6/tests/test_reader_outcome_audit.py T.test_good_fixture
          echo 'LEGACY_RECEIPT_ONLY_CLOSURE_PATH_REPRODUCED=PASS'

      - name: Establish V5.7 expected RED precondition
        shell: bash
        run: |
          set -euo pipefail
          test ! -e gov56/skills/skill-book/V5.6/scripts/reader_transfer_audit.py
          test ! -e gov57/skills/skill-book/V5.7/scripts/reader_transfer_audit.py
          test ! -e gov57/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py
          grep -q 'BLIND_READER_PROXY_PASS' gov57/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md
          grep -q 'NEAR_MISS_CONFUSION' gov57/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md
          grep -q 'RETRY_DID_NOT_REPAIR_RESPONSIBILITY' gov57/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md
          grep -q 'OPERATOR_HANDOFF_NOT_SELF_SUFFICIENT' gov57/mother-specs/skill-book/V5.7/SKILL_BOOK_V5.7_DESIGN_GATE.md
          echo 'RED_PRECONDITION_PASS=reader-transfer-verifier-not-implemented'
          echo 'EXPECTED_RED_BASELINE_PASS'
