name: TEMP skill-book V5.7 reader transfer GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V57_GREEN: 58c407f0354d260978f0b4f0e4da127bd49e33f6

jobs:
  reader-transfer-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.7 GREEN WIP
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V57_GREEN"
          test "$(git -C gov rev-parse HEAD)" = "$V57_GREEN"
          test -f gov/skills/skill-book/V5.7/scripts/reader_transfer_audit.py
          test -f gov/skills/skill-book/V5.7/references/reader_transfer_contract.md
          test -f gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py

      - name: Run V5.7 reader transfer adversarial matrix
        shell: bash
        run: |
          set -euo pipefail
          python gov/skills/skill-book/V5.7/tests/test_reader_transfer_audit.py 2>&1 | tee /tmp/v57-green.out
          grep -q 'Ran 13 tests' /tmp/v57-green.out
          grep -q '^OK$' /tmp/v57-green.out
          echo 'V57_READER_TRANSFER_TARGETED=13/13_PASS'
          echo 'BLIND_READER_PROXY_AUTHORITY_BOUNDARY=PASS'
