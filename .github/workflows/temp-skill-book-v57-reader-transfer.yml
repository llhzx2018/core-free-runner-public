name: TEMP skill-book V5.7 isolated proxy capability probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  V57_EXACT: d968141537f43a8d873e033be9b9c931fbd25b1d

jobs:
  isolated-proxy-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
    steps:
      - name: Verify personal-repo Copilot credential is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo 'FRESH_ISOLATED_PROXY_CAPABILITY=NOT_AVAILABLE_MISSING_COPILOT_GITHUB_TOKEN'
            exit 3
          fi
          echo 'FRESH_ISOLATED_PROXY_CREDENTIAL_PRESENT=PASS'

      - name: Install Copilot CLI
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Copilot CLI package
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version
          echo 'COPILOT_CLI_INSTALL=PASS'

      - name: Run tool-free isolated inference probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v57-isolated-probe"
          cd "$RUNNER_TEMP/v57-isolated-probe"
          response="$(copilot -p 'You are a fresh blind reader capability probe. You have no repository context and must not use tools. Reply with exactly: ISOLATED_PROXY_CAPABILITY_READY' -s --no-ask-user)"
          printf '%s\n' "$response" | tee /tmp/v57-copilot-probe.txt
          grep -qx 'ISOLATED_PROXY_CAPABILITY_READY' /tmp/v57-copilot-probe.txt
          echo 'FRESH_ISOLATED_PROXY_CAPABILITY=PASS_COPILOT_CLI_TOOL_FREE'
