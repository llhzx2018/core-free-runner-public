name: p01-backup-baseline-native-one-off
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-backup-baseline-onetime-native.yml'
permissions:
  contents: read
concurrency:
  group: p01-baseline-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  exact-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_SHA: 77fd3736520e47c527c5c5726082c9f6db14fa10
    steps:
      - name: Checkout trusted public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision native PHP SQLite on isolated hosted machine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl >/dev/null
          php -m | grep -i -Fx pdo_sqlite
          php -m | grep -i -Fx sqlite3
          echo P01_NATIVE_SQLITE_RUNTIME=PASS
      - name: Checkout P01 exact private candidate in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 77fd3736520e47c527c5c5726082c9f6db14fa10
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source identity and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-candidate rev-parse HEAD)" = "$SOURCE_SHA"
          php -l private-candidate/src/app/BackupManager.php >/dev/null
          php -l private-candidate/src/api.php >/dev/null
          php -l private-candidate/src/data-safety.php >/dev/null
          php -l private-candidate/tests/integration/backup_baseline_reset_native_sqlite.php >/dev/null
          php -l private-candidate/tests/unit/backup_baseline_reset_exact_source_gate.php >/dev/null
          node --check private-candidate/src/assets/data-recovery.js
          echo P01_PRIVATE_EXACT_SOURCE_SYNTAX=PASS
      - name: Run native SQLite destructive reset and owner confirmation contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php private-candidate/tests/integration/backup_baseline_reset_native_sqlite.php
          node private-candidate/tests/browser/backup_baseline_reset_owner_smoke.cjs
          node private-candidate/tests/browser/backup_missing_alert_v247297_smoke.cjs
          echo P01_BACKUP_BASELINE_MACHINE=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: rm -rf private-candidate
