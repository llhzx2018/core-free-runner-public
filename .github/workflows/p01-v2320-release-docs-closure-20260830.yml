name: P01 V2.32 Formal Release Docs Closure
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2320-release-docs-closure-20260830.yml
      - scripts/p01-v2320-release-docs-closure.py
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact docs closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2.32.0-release-closure-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact release truth and docs-only closure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(git rev-parse HEAD^{tree})" = d0fa7c87ebefef083712ec0b7707a6c4273943f2
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0 --jq .object.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0 --jq .id)" = 379046260
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = e61b366d7d63faf19b895b8334c3b9900b83a7a8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264951077 --jq .conclusion)" = success
          python3 ../runner/scripts/p01-v2320-release-docs-closure.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          tracked=$(git diff --name-only)
          untracked=$(git ls-files --others --exclude-standard)
          { printf '%s\n' "$tracked"; printf '%s\n' "$untracked"; } | sed '/^$/d' | sort -u >/tmp/p01-v2320-docs-actual.txt
          printf '%s\n' \
            CHANGELOG.md \
            VF_PROJECT.json \
            docs/authority/CURRENT.md \
            docs/evidence/P01_V2.32.0_RELEASE_CLOSURE_20260830.md \
            docs/handoff/CURRENT_STATE.md | sort >/tmp/p01-v2320-docs-expected.txt
          diff -u /tmp/p01-v2320-docs-expected.txt /tmp/p01-v2320-docs-actual.txt
          test -z "$(git diff --name-only -- src)"
          test "$(git rev-parse HEAD:src)" = f348cb314623906acc851cb79d75b1c8f6637aff
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.31.0
          test "$(jq -r .working_version VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'PUBLISHED / REMOTE_GATE_PASS / OWNER_PRODUCTION_PENDING'
          test "$(jq -r .current_change.formal_release.remote_online_update_gate VF_PROJECT.json)" = 33264951077
          test "$(jq -r .current_change.formal_release.owner_production_write VF_PROJECT.json)" = false
          grep -F 'READY_FOR_OWNER_PRODUCTION_UPGRADE' docs/evidence/P01_V2.32.0_RELEASE_CLOSURE_20260830.md >/dev/null
          grep -F 'Owner Production **尚未升级到 V2.32.0**' docs/authority/CURRENT.md >/dev/null
          grep -F 'Owner Production 仍为 V2.31.0' CHANGELOG.md >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.32.0_RELEASE_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.32.0 formal release authority'
          git push origin HEAD:docs/p01-v2.32.0-release-closure-20260830
          echo "DOCS_SOURCE=$(git rev-parse HEAD)"
          echo "DOCS_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo P01_V2320_FORMAL_RELEASE_DOCS_CLOSURE=PASS
          echo OWNER_PRODUCTION_WRITE=NO
