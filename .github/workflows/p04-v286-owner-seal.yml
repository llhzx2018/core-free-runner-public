name: P04 V2.8.6 Owner Seal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v286-owner-seal.yml'
      - 'requests/p04-v286-owner-seal.txt'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    env:
      P04_REPOSITORY: llhzx2018/vf-infra
      EXPECTED_HEAD: e48cae0ebc76848786028d1f7264f0c3b3ac029f
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 develop
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P04_REPOSITORY }}
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: source

      - name: Seal V2.8.6 Current Truth only
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/develop)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P04' and d['version']=='2.8.6' and d['schema']==14
          assert d['formal_release']['version']=='2.8.6' and d['formal_release']['status']=='PASS'
          d['status']='V2.8.6_SEALED'
          d['lifecycle']='STABLE_OPERATIONS'
          d['branch_authority']['main']='V2.8.6_SEALED_STABLE_OPERATIONS'
          d['branch_authority']['develop']='V2.8.6_SEALED_STABLE_OPERATIONS'
          prod=d.setdefault('production',{})
          prod['installed_version']='2.8.6'
          prod['installed_version_evidence']='OWNER_SCREENSHOT_V2.8.6_SYSTEM_UPDATE_20260819'
          prod['installed_version_observed_at']='2026-08-19T20:01:00+08:00'
          prod['program_version_visible']='2.8.6'
          prod['schema_visible']=14
          prod['upgrade_v286']='PASS_OWNER_REAL_USE'
          prod['next_requirement']='NONE_STABLE_OPERATIONS'
          gates=d.setdefault('verification_gates',{})
          gates['production_v286_upgrade']='PASS_OWNER_REAL_USE'
          gates['production_v286_version_readback']='PASS'
          gates['production_v286_schema14_readback']='PASS'
          gates['owner_v286_seal']='PASS'
          channel=d.setdefault('online_update_channel',{})
          channel['status']='V2.8.6_PUBLISHED'
          channel['authority']='llhzx2018/core-updates/projects/P04.json'
          channel['authority_publication_commit']='a82227326965b3527fc668244d76152151a63414'
          channel['target_version']='2.8.6'
          channel['allowed_source_versions']=['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4','2.8.5']
          channel['schema_from']=14
          channel['schema_to']=14
          channel['update_type']='ATOMIC'
          channel['backup_required']=True
          channel['rollback_supported']=True
          channel['production_write']=0
          d['current_phase']='V2.8.6_SEALED_STABLE_OPERATIONS'
          d['project_block']='NONE'
          d['window_execution_block']='NONE'
          d['next_gate']='NONE_STABLE_OPERATIONS'
          d['next_action']='STABLE_OPERATIONS_MONITOR_ONLY'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ssot='''# P04 · VF Infra · Current Truth SSOT\n\n> Current Truth：2026-08-19 20:01 +08:00  \n> Repository：`llhzx2018/vf-infra`  \n> Production Runtime：`2.8.6`  \n> Production Schema：`14`  \n> Lifecycle：`STABLE_OPERATIONS`  \n> Seal：`OWNER_ACCEPTED / SEALED`  \n> Provider Authority：`READ_ONLY_FIRST`  \n> Project Block：`NONE`\n\n## 1. Current Truth\n\n```text\nProduction: 2.8.6 / OWNER screenshot readback PASS\nSchema: 14 / PASS\nFormal Release: PASS\nTag: v2.8.6\nRelease ID: 373012164\nExact Product Source: d98c2bc9281f259b6ba9f90855b01e42b73eabb3\nExact Product Tree: 40a5ae119812676aaf2f6e5a89e0e9c238876457\ncore-updates: a82227326965b3527fc668244d76152151a63414 / PASS\nOwner Seal: PASS\nLifecycle: STABLE_OPERATIONS\n```\n\n## 2. V2.8.6 Sealed Product Result\n\n本版完成 Production 真实使用后的小型维护：诊断按钮即时反馈与结果保留、时区/默认币种对齐、后台自动任务个人化文案、`data-v271-action` 到既有长耗时反馈层的兼容桥。Schema 14，无 Migration，不扩大 Provider 写权限。\n\n## 3. Formal Artifacts\n\n```text\nFULL: VF_Infra_V2.8.6_FULL.zip\nBytes: 579762\nSHA-256: 1f77d7522a2cad2c4e3a0f4528dff410aaa4d8f3cb5b0c77465c8f9b7016bf40\nAsset ID: 520784289\n\nUPDATE: VF_Infra_V2.8.6_UPDATE.zip\nBytes: 1250606\nSHA-256: 990437edf412efa4ffda89caf32823f059f945c205a34ed87db7db9486fe6106\nAsset ID: 520784290\nRemote Download + SHA Readback: PASS\n```\n\n## 4. Product Contract\n\n一级导航：概览 / 域名 / 服务器 / 服务商 / 设置。个人优先级：费用 → 到期 → 续费 → 价格变化 → 风险 → OWNER 需要处理 → 资源详情。Provider 继续 `READ_ONLY_FIRST`。\n\n## 5. Seal Rule\n\nV2.8.6 自本次 OWNER 裁决起封版。除真实 Bug、重要安全/数据完整性问题或明确降低个人日常维护成本的改动外，不再继续机械升版。\n'''
          Path('docs/authority/SSOT.md').write_text(ssot,encoding='utf-8')
          matrix='''# VF Infra Current Acceptance Matrix · V2.8.6 SEALED\n\n| Gate | 状态 |\n|---|---|\n| Exact Tested Product Source | PASS / `d98c2bc9281f259b6ba9f90855b01e42b73eabb3` |\n| Product Tree | PASS / `40a5ae119812676aaf2f6e5a89e0e9c238876457` |\n| Schema | PASS / `14` |\n| Migration | `NONE` |\n| Repository Health | PASS |\n| Browser OWNER Defect Regression | PASS |\n| Tag `v2.8.6` | PASS |\n| GitHub Release | PASS / `373012164` |\n| FULL Asset | PASS / `520784289` / `579762` bytes |\n| UPDATE Asset | PASS / `520784290` / `1250606` bytes |\n| Remote Asset Download + Hash | PASS |\n| core-updates | PASS / `a82227326965b3527fc668244d76152151a63414` |\n| Provider Authority | `READ_ONLY_FIRST` |\n| Production Version | PASS / `2.8.6` |\n| Production Schema | PASS / `14` |\n| Production V2.8.6 Upgrade | PASS / OWNER REAL USE |\n| OWNER Seal | PASS |\n| Lifecycle | `STABLE_OPERATIONS` |\n| Project Block | `NONE` |\n\n## Final Gate\n\n```text\nV2.8.6: SEALED\nPRODUCTION: 2.8.6\nSCHEMA: 14\nMAIN = DEVELOP: REQUIRED\nNEXT: STABLE_OPERATIONS_MONITOR_ONLY\n```\n'''
          Path('docs/authority/ACCEPTANCE_MATRIX.md').write_text(matrix,encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          CHANGED=$(git diff --name-only | sort)
          EXPECTED=$(printf '%s\n' VF_PROJECT.json docs/authority/ACCEPTANCE_MATRIX.md docs/authority/SSOT.md | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Commit and align main develop non-force
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          git commit -m 'chore(P04): seal V2.8.6 stable operations'
          NEW=$(git rev-parse HEAD)
          git push origin HEAD:develop
          git push origin HEAD:main
          echo "P04_V286_SEAL_COMMIT=$NEW"
          echo 'RUNTIME_CHANGE=0'
          echo 'PRODUCTION_WRITE=0'
