name: S01-C02 V1.21.985 Links Clean Authority Source Gate

on:
  push:
    branches:
      - verify/s01-c02-v121985-links-clean-authority
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_SHA: e1c40de0cb2f1343890dd962902e629b533ff788
  BASE_SHA: 53fc0e87aea12b8d5b51bac5c61a950bd78fe2f8

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Exact bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          git -C target diff --name-only "$BASE_SHA..$TARGET_SHA" | tee /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          expected={
            'assets/css/v13/seo/links-redirects.css',
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php',
            'tests/s01-c02-v9-batch1-body-contract.php',
            'tests/s01-c02-v9-batch1-browser-proof.js',
            'tests/s01-c02-page-body-system-v2-full-surface-contract.php',
          }
          if changed != expected:
              raise SystemExit('unexpected diff: '+repr(sorted(changed)))
          print('BOUNDED_DIFF=PASS')
          PY

      - name: Contracts and lint
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-v9-batch1-body-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php
          php target/tests/s01-c02-page-body-system-v2-full-surface-contract.php
          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.2-cli sh -lc 'php -l includes/admin-v13/views/seo_links_redirects.php >/dev/null && php -l tests/s01-c02-v9-batch1-body-contract.php >/dev/null'
          node --check target/tests/s01-c02-v9-batch1-browser-proof.js
          echo 'CONTRACTS_LINT=PASS'

      - name: Responsive source browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v9-node evidence
          cd /tmp/v9-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/v9-node/node_modules
          export V9_PROOF_DIR="$GITHUB_WORKSPACE/evidence/v9-proof"
          node tests/s01-c02-v9-batch1-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/v9-browser-output.txt"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'evidence/v9-proof/browser-proof.json')))
          assert p['pass'] is True
          assert len(p['checks']) == 18
          assert all(not x['failures'] for x in p['checks'])
          assert all(not x['overflow'] for x in p['checks'])
          links=[x for x in p['checks'] if x['kind']=='links']
          assert links and all(x.get('workspace') is True for x in links)
          assert all(x.get('jobDetailOpen') is False for x in links)
          print('RESPONSIVE_18=PASS')
          print('PROTOTYPE_WORKSPACE=PASS')
          PY

      - name: Frozen shell boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=Path('/tmp/changed.txt').read_text().splitlines()
          forbidden=('includes/admin-v13/shell','includes/s01/admin-shell','assets/css/current/admin-shell','assets/css/v13/shell')
          if any(any(x in p for x in forbidden) for p in changed):
              raise SystemExit('frozen shell/header/menu touched')
          print('FROZEN_SHELL_HEADER_MENU=PASS')
          PY

      - name: Final
        shell: bash
        run: echo 'S01-C02 V1.21.985 LINKS CLEAN AUTHORITY SOURCE GATE PASS'
