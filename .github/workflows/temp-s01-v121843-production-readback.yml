name: TEMP S01 Production V1.21.843 Fresh Readback
on:
  push:
    branches:
      - temp/s01-v121843-production-readback-20260905
    paths:
      - '.github/workflows/temp-s01-v121843-production-readback.yml'
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read public S01 endpoints
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local name="$1"
            local url="$2"
            local out="/tmp/${name}.json"
            local code
            code="$(curl -sS --retry 2 --connect-timeout 15 --max-time 30 -o "$out" -w '%{http_code}' "$url")"
            echo "${name}_HTTP=${code}"
            test "$code" = "200"
            jq -e . "$out" >/dev/null
            echo "--- ${name} ---"
            jq -c . "$out"
          }
          probe domain 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority'
          probe seo 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-seo-closure'
          probe reconciliation 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-boundary-reconciliation'
          probe static 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness'
          echo '--- focused-v121843 ---'
          jq -c '{pluginVersion,sourceArtifactAvailable,manualSourceUploadRequired,candidatePackageReady,finalOnlinePass,activeStaticJobStatus,activeStaticJobMode,activeStaticJobFirstFailedStep,activeStaticJobAuditFailureCount,activeStaticJobInternalLinkFailureLeafCount,sourceRecoveryCanonicalFinalAuditRetryStatus,sourceRecoveryCanonicalFinalAuditRetryCode,sourceRecoveryCanonicalFinalAuditRetryEligibleCount,sourceRecoveryCanonicalFinalAuditRetryCandidateStatus,sourceRecoveryCanonicalFinalAuditRetryCandidateCurrentStage,sourceRecoveryCanonicalFinalAuditRetryCandidateAuditFailureCount}' /tmp/static.json
          echo 'PASS_CURRENT_PRODUCTION_PUBLIC_READBACK_V121843'
      - name: Verify runner main unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
          echo RUNNER_MAIN_UNCHANGED=PASS
