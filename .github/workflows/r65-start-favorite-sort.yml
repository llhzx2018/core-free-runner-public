name: R65 Focused Start Favorite Sort Reset Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r65-start-favorite-sort.yml'

permissions:
  contents: read

jobs:
  r65-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: cfb34ca11cf24cad11e97be19b3c745e1c4fd3ae
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: cfb34ca11cf24cad11e97be19b3c745e1c4fd3ae
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/FunctionalWorkspaceShell.php
          php -l tests/unit/start_favorite_sort_reset_contract.php
          php tests/unit/start_favorite_sort_reset_contract.php
          php tests/unit/start_popular_sort_control_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          echo R65_START_FAVORITE_SORT_RESET_PASS
          echo R65_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
