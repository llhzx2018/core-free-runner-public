name: TEMP Private44 missing native security gate checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-private44-scope-lifecycle-gates.yml'
permissions:
  contents: read
jobs:
  private44-gates:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'validation/private44-missing-native-gates-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Checkout exact Private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 625990fc53c66a2f640d7230b05522fdad07e442
          path: transient-private44
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run ONLY missing trigger and lifecycle machine gates
        shell: bash
        env:
          EXPECTED_SHA: 625990fc53c66a2f640d7230b05522fdad07e442
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-private44
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          echo PRIVATE44_EXACT_SOURCE=PASS
          if python3 -B scripts/check_runner_trigger_scope.py --inventory > /dev/null 2>&1 && python3 -B -m unittest tests/test_runner_trigger_scope.py > /dev/null 2>&1; then
            echo PRIVATE44_TRIGGER_SCOPE=PASS
          else
            echo PRIVATE44_TRIGGER_SCOPE=FAIL
            exit 1
          fi
          if python3 -B scripts/check_workflow_lifecycle.py > /dev/null 2>&1 && python3 -B -m unittest tests/test_workflow_lifecycle.py > /dev/null 2>&1; then
            echo PRIVATE44_WORKFLOW_LIFECYCLE=PASS
          else
            echo PRIVATE44_WORKFLOW_LIFECYCLE=FAIL
            exit 1
          fi
          echo PRIVATE44_PRIVATE_SOURCE_UPLOADED=NO
      - name: Cleanup exact private candidate
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- transient-private44
          test ! -e transient-private44
          echo PRIVATE44_TRANSIENT_CLEANUP=PASS
