name: P01 V2.32 Publication
on:
  push:
    branches: [task/p01-v2320-formal-release-20260830]
    paths: [.github/workflows/p01-v2320-publication-20260830.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Publication precheck
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          test "$(gh api repos/llhzx2018/vf-start/contents/VERSION?ref=main --jq .content | tr -d '\n' | base64 -d | tr -d '\r\n')" = 2.32.0
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264371922 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33264426723 --jq .conclusion)" = success
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0 >/dev/null 2>&1; then echo 'v2.32.0 tag already exists'; exit 2; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0 >/dev/null 2>&1; then echo 'v2.32.0 release already exists'; exit 3; fi
          echo P01_V2320_PUBLICATION_PRECHECK=PASS
      - name: Fetch exact PASS artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2320-publish /tmp/p01-v2320-artifact.zip
          mkdir -p /tmp/p01-v2320-publish
          gh api --method GET repos/llhzx2018/core-free-runner-public/actions/artifacts/9718189503/zip > /tmp/p01-v2320-artifact.zip
          unzip -q /tmp/p01-v2320-artifact.zip -d /tmp/p01-v2320-publish
          cd /tmp/p01-v2320-publish
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          test "$(sha256sum VF-Start-V2.32.0-FULL.zip | awk '{print $1}')" = 603f356e53e72d4bae04645393934456cef2c5cc15595221bfacef903c9f98e0
          test "$(sha256sum VF_Start_V2.32.0_UPDATE.zip | awk '{print $1}')" = 262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          test "$(sha256sum VF-Start-V2.32.0-UPDATE.zip | awk '{print $1}')" = 262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          test "$(sha256sum repair-v2.32.0.php | awk '{print $1}')" = 6312ea943f3057ca49508c39d73769c45f8350e1b1118ab245519181f65d0906
          jq -e '.formal_artifact_gate=="PASS" and .release_source=="120a42667fce7357fdaef03b64cb7ea41392040d" and .release_tree=="d0fa7c87ebefef083712ec0b7707a6c4273943f2" and .product_source=="8944677974e3a512d846f0740897a7a98e4b7b53" and .runtime_tree=="f348cb314623906acc851cb79d75b1c8f6637aff" and .source_version=="2.31.0" and .schema=="2026082901" and .schema_change==false and .owner_production_write==false' P01-V2.32.0-FORMAL-METADATA.json >/dev/null
          test "$(jq -r .full.sha256 P01-V2.32.0-FORMAL-METADATA.json)" = 603f356e53e72d4bae04645393934456cef2c5cc15595221bfacef903c9f98e0
          test "$(jq -r .update.sha256 P01-V2.32.0-FORMAL-METADATA.json)" = 262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          test "$(jq -r .repair.sha256 P01-V2.32.0-FORMAL-METADATA.json)" = 6312ea943f3057ca49508c39d73769c45f8350e1b1118ab245519181f65d0906
          stat -c '%n %s' VF-Start-V2.32.0-FULL.zip VF_Start_V2.32.0_UPDATE.zip repair-v2.32.0.php | tee /tmp/p01-v2320-asset-sizes.txt
          echo P01_V2320_EXACT_PASS_ARTIFACT=PASS
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST repos/llhzx2018/vf-start/git/refs -f ref=refs/tags/v2.32.0 -f sha=120a42667fce7357fdaef03b64cb7ea41392040d >/tmp/p01-v2320-tag.json
          test "$(jq -r .object.sha /tmp/p01-v2320-tag.json)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          cat >/tmp/p01-v2320-notes.md <<'EOF'
          VF Start V2.32.0 将登录后的根入口升级为真正的个人资源工作台 Home Command Center。

          - 登录后根入口进入 Home；匿名访问仍保持 Public Navigator 边界不变。
          - Home 汇总待整理、收藏、最近资源、近期操作与健康信号，减少日常进入多个列表页寻找状态的成本。
          - “全部资源”继续保持独立工作区，不与 Home 混为一体。
          - 活动轨道、健康信号与相对时间展示均绑定现有 Resource / Operation History Authority，不建立影子数据系统。
          - 桌面与移动端 Home、Public / Private 边界、无横向溢出均已通过 Candidate Gate。
          - Schema 保持 2026082901 不变，无 Migration。
          - 支持从 V2.31.0 Atomic 升级；正式 Artifact Gate 33264371922 PASS。
          - 本 Release 不自动写 Owner Production。
          EOF
          cd /tmp/p01-v2320-publish
          gh release create v2.32.0 \
            P01-V2.32.0-ARTIFACT-GATE.json \
            P01-V2.32.0-FORMAL-METADATA.json \
            SHA256SUMS.txt \
            VF-Start-V2.32.0-FULL.zip \
            VF-Start-V2.32.0-UPDATE.zip \
            VF_Start_V2.32.0_UPDATE.zip \
            atomic-self-test.json \
            repair-v2.32.0.php \
            --repo llhzx2018/vf-start --title 'VF Start V2.32.0' --notes-file /tmp/p01-v2320-notes.md --verify-tag
          gh api repos/llhzx2018/vf-start/releases/tags/v2.32.0 > /tmp/p01-v2320-release.json
          test "$(jq -r .tag_name /tmp/p01-v2320-release.json)" = v2.32.0
          test "$(jq -r .target_commitish /tmp/p01-v2320-release.json)" != ''
          test "$(jq -r .draft /tmp/p01-v2320-release.json)" = false
          test "$(jq -r .prerelease /tmp/p01-v2320-release.json)" = false
          test "$(jq '.assets|length' /tmp/p01-v2320-release.json)" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.32.0_UPDATE.zip")|.digest' /tmp/p01-v2320-release.json)" = sha256:262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.32.0-UPDATE.zip")|.digest' /tmp/p01-v2320-release.json)" = sha256:262efaf80564f7c5942c37e1ba797434da277a8344b92cd0a7783edb90f1725a
          test "$(jq -r '.assets[]|select(.name=="VF-Start-V2.32.0-FULL.zip")|.digest' /tmp/p01-v2320-release.json)" = sha256:603f356e53e72d4bae04645393934456cef2c5cc15595221bfacef903c9f98e0
          test "$(jq -r '.assets[]|select(.name=="repair-v2.32.0.php")|.digest' /tmp/p01-v2320-release.json)" = sha256:6312ea943f3057ca49508c39d73769c45f8350e1b1118ab245519181f65d0906
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.32.0 --jq .object.sha)" = 120a42667fce7357fdaef03b64cb7ea41392040d
          jq -r '.id, (.assets[] | [.name,.size,.digest] | @tsv)' /tmp/p01-v2320-release.json | tee /tmp/p01-v2320-publication-readback.txt
          echo P01_V2320_TAG_REMOTE_READBACK=PASS
          echo P01_V2320_GITHUB_RELEASE=PASS
          echo CORE_UPDATES_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-publication-${{ github.run_id }}
          path: |
            /tmp/p01-v2320-tag.json
            /tmp/p01-v2320-release.json
            /tmp/p01-v2320-asset-sizes.txt
            /tmp/p01-v2320-publication-readback.txt
          if-no-files-found: warn
          retention-days: 90
