name: P05 Overview Audit Page Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-overview-audit-page-9bf4b69.yml']
permissions:
  contents: read
jobs:
  p05-overview-audit-page-exact-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-overview-audit-page-9bf4b69-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: 9bf4b69307c2963ccb8f0e5e3ca931cc1fb690c3
      P05_BASE_MAIN: ae58c62c72d7853ddc2ad5c1bd16e47a2e6564b2
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and three-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE"
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' \
            php/src/ProductOptimizationService.php \
            src/server/product-optimization.ts \
            tests/unit/product-overview-audit-page-identity-truth.test.ts | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'P05_OVERVIEW_AUDIT_PAGE_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_OVERVIEW_AUDIT_PAGE_ENGINEERING=PASS'
      - name: Audit Page identity truth and cumulative Product contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test \
            tests/unit/product-overview-audit-page-identity-truth.test.ts \
            tests/unit/product-overview-action-routing-truth.test.ts \
            tests/unit/product-audit-page-evidence-drilldown-truth.test.ts \
            tests/unit/product-overview-what-changed-query-routing-truth.test.ts \
            tests/unit/product-overview-why-query-routing-truth.test.ts \
            tests/unit/product-overview-top-movers-query-routing-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-search-query-evidence-routing-truth.test.ts \
            tests/unit/product-opportunity-subject-routing-parity.test.ts \
            tests/unit/product-keyword-related-pages-evidence-truth.test.ts \
            tests/unit/product-page-query-authority-boundary-truth.test.ts \
            tests/unit/product-aeo-blocker-page-evidence-truth.test.ts
          node --import tsx --test \
            tests/unit/product-data-source-capability-truth.test.ts \
            tests/unit/product-audit-capability-rerun-truth.test.ts \
            tests/unit/product-changes-record-observe-truth.test.ts \
            tests/unit/product-settings-truth.test.ts
          npm run test:php-product-parity
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_OVERVIEW_AUDIT_PAGE_TRUTH=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          echo 'P05_OVERVIEW_AUDIT_PAGE_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_OVERVIEW_AUDIT_PAGE_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_OVERVIEW_AUDIT_PAGE_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
