name: S01-C01 v1.35.134 runtime fingerprint evidence
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-theme-v135134-fingerprint.yml']
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve verified private Release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v1.35.134 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.134.zip
          gh release download v1.35.133 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.133.zip
          echo '0ac191879cdb88f95350b29e3539a6f9bbb165b06867d25169c44c355b2472de  vf-tools-theme_V1.35.134.zip' | sha256sum -c
      - name: Emit verifiable runtime tree fingerprints
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,json,pathlib
          z=zipfile.ZipFile('vf-tools-theme_V1.35.134.zip')
          names=sorted(n for n in z.namelist() if not n.endswith('/'))
          assert len(names)==476
          records=[(n.removeprefix('vf-tools-theme/'),hashlib.sha256(z.read(n)).hexdigest()) for n in names]
          candidates={}
          candidates['paths_and_sha256_newlines']=hashlib.sha256(''.join(f'{n} {h}\n' for n,h in records).encode()).hexdigest()
          candidates['hash_then_path_newlines']=hashlib.sha256(''.join(f'{h}  {n}\n' for n,h in records).encode()).hexdigest()
          candidates['path_null_hash_null']=hashlib.sha256(b''.join(n.encode()+b'\0'+h.encode()+b'\0' for n,h in records)).hexdigest()
          print('RUNTIME_FINGERPRINT_CANDIDATES='+json.dumps(candidates,sort_keys=True))
          print('RUNTIME_FILES='+str(len(names)))
          old=zipfile.ZipFile('vf-tools-theme_V1.35.133.zip')
          oldnames=sorted(n for n in old.namelist() if not n.endswith('/'))
          oldrecords=[(n.removeprefix('vf-tools-theme/'),hashlib.sha256(old.read(n)).hexdigest()) for n in oldnames]
          baselines={'paths_and_sha256_newlines':hashlib.sha256(''.join(f'{n} {h}\\n' for n,h in oldrecords).encode()).hexdigest(),'hash_then_path_newlines':hashlib.sha256(''.join(f'{h}  {n}\\n' for n,h in oldrecords).encode()).hexdigest(),'path_null_hash_null':hashlib.sha256(b''.join(n.encode()+b'\\0'+h.encode()+b'\\0' for n,h in oldrecords)).hexdigest()}
          print('BASELINE_FINGERPRINT_CANDIDATES='+json.dumps(baselines,sort_keys=True))
          print('BASELINE_EXPECTED=cc272df18ec48e1bd1e5ced531625fc18e2b0eeeeaa3bcf133b736f14ef8817a')
          PY
      - name: Remove private artifact
        if: always()
        run: rm -f vf-tools-theme_V1.35.134.zip vf-tools-theme_V1.35.133.zip
