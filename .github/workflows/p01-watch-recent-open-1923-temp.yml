name: p01-watch-recent-open-1923-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-watch-recent-open-1923-temp.yml']
permissions:
  contents: read
jobs:
  exact-recent-open:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: dcc2ff7d993df04d901d80985b7c6cd36b9968ff
      BASE_SHA: e782d769d41f75433300a38686efeeb04474003f
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-watch-recent-open-id-failclosed-r1
    steps:
      - name: Checkout registered public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact Watch recent recordOpen and full canonical safety proof
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-watch-recent-1923.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          echo "P01_WATCH_RECENT_EXACT_SHA=$TARGET_SHA"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.496"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.496"
          cd "$ROOT/candidate"
          for f in src/surface-open.php src/app/SurfaceRepository.php tests/unit/p01_watch_recent_open_identity_runtime.php; do php -l "$f" >/dev/null; done
          echo P01_WATCH_RECENT_PHP_SYNTAX=PASS
          php tests/unit/p01_watch_recent_open_identity_runtime.php
          php tests/integration/p01_six_surface_authority_acceptance.php
          php tests/unit/watch_public_privacy_density_v247390_contract.php
          php tests/unit/watch_cinema_rebuild_contract.php
          node tests/browser/watch_cinema_detail_delegation_contract.cjs
          echo P01_WATCH_RECENT_FOCUSED_REGRESSION=PASS
          RC=0
          bash tests/canonical_release_regression.sh "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/canonical.log" 2>&1 || RC=$?
          grep -E '^(P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|CURRENT_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|ZERO_DEBT_REQUIRED)=|NEW_UNIT_REGRESSION=|CHANGED_TEST_FAILURE=)' "$ROOT/canonical.log" || true
          test "$RC" -eq 0
          echo P01_WATCH_RECENT_CANONICAL_ZERO_DEBT=PASS
      - name: Public-safe cleanup receipt
        if: always()
        shell: bash
        run: |
          echo P01_PRIVATE_SOURCE_PUBLIC_GIT=NO
          echo P01_PRIVATE_SOURCE_ARTIFACT=NONE
          echo P01_PRODUCTION_CHANGED=NO
          echo P01_TEMPORARY_PR_MUST_CLOSE_UNMERGED=YES
