name: skill-adpage-197-exact-source-oneoff
on:
  pull_request:
    paths:
      - '.github/workflows/skill-adpage-197-exact-source-oneoff.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public runner baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out GOV-DOC PR 197 exact source privately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 854d1e3660a5822358eadde601f1c33b0178ad5f
          path: .private-governance-checkout
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Run bounded candidate and GOV-DOC source gates
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd .private-governance-checkout
          actual=$(git rev-parse HEAD)
          test "$actual" = '854d1e3660a5822358eadde601f1c33b0178ad5f'
          echo 'EXACT_SOURCE_CHECK=PASS'
          python3 -B -m unittest discover -s skills/skill-adpage/V1.0/scripts -p 'test_*.py' -v
          PR_BODY=$(printf '%s\n' 'PUBLIC_AUTHORITY_IMPACT: UPDATED' 'AFFECTED_DOMAINS: GIT,TESTING,SECURITY,UA_UI' 'IMPACT_REASON: Introduces a new normative candidate advertising-landing Skill, its source checks, Mother candidate, and necessary governance review; thirteen sealed Public Authority bodies, existing eleven Current Skills, and released distribution assets remain byte-unchanged.')
          test -n "$PR_BODY"
          export PR_BODY
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 5bf99b73afc70a976ec6753ed5c71554b9f36a13 --git-head 854d1e3660a5822358eadde601f1c33b0178ad5f
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 5bf99b73afc70a976ec6753ed5c71554b9f36a13 --git-head 854d1e3660a5822358eadde601f1c33b0178ad5f
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          python3 -B governance/catalog/tools/doc_structure_lint.py
          python3 -B -m unittest discover -s governance/catalog/tools -p 'test_doc_structure_lint.py' -v
          echo 'SCOPED_GOV_SOURCE_GATES=PASS'
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- .private-governance-checkout
          echo 'PRIVATE_CHECKOUT_CLEANUP=ATTEMPTED'
