name: S01 native WP updater discovers checker86 and theme110
on:
  push:
    branches: [task/s01-checker86-theme110-native-20261012]
permissions:
  contents: read
  actions: read
jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.3.0'
      TARGET_SHA: '90d82b6bc8014c413ddf2e3146ab06831d0f0f4d'
      TARGET_TREE: 'cfbb4991086d47111d1a314bf4e799d1ff765bdd'
      CHANNEL_SHA: '90d82b6bc8014c413ddf2e3146ab06831d0f0f4d'
      THEME_SOURCE_VERSION: '1.35.109'
      THEME_LEGACY_SOURCE_VERSION: '1.35.108'
      THEME_VERSION: '1.35.110'
      THEME_SHA: '029439879c817c505d8d6049ee58e6c49b7196cf'
      THEME_TREE: '210ac8321f2a59669d955c33147cc5b54f1ea9cb'
      THEME_ASSET_SHA: '17e54882cff8ab4e755ba33a851e343d6db69290389851a2e0c45c9c49ce0c53'
      M3_SOURCE_VERSION: '1.25.85'
      M3_VERSION: '1.25.86'
      M3_SHA: 'f909407ce5434b0a1a928bb0574586fef88231ae'
      M3_TREE: 'e10905d4f1b360949e08c4128de07723bfe65a65'
      M3_ASSET_SHA: '85f1ea807557b8ea9d4a5f0d9d6d1a67b245db5e0d1c988df6cbd5cbbfb8fc1c'
      THEME_LEGACY_BYTES: '1791730'
      THEME_LEGACY_SHA256: '91ea82ff11dd171219a47838a9902e81c0af7d7a0a6dd16816ab7fc8273cc594'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact one-spec discovery audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker86-theme110-native-20261012/spec.json --template runner/lanes/s01-checker86-theme110-native-20261012/discovery.template.yml --output /tmp/discovery-render.yml >/dev/null
          cmp /tmp/discovery-render.yml runner/.github/workflows/s01-checker86-theme110-native-20261012.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker86-theme110-native-20261012/spec.json --input runner/.github/workflows/s01-checker86-theme110-native-20261012.yml > proof/lane-identity.json
          cp -a runner/lanes/s01-checker86-theme110-native-20261012 lane
          bash -n lane/native.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010-discovery
          persist-credentials: false
          path: historic-theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed78-20261010-discovery
          persist-credentials: false
          path: historic-m3
      - name: Real WordPress old-install native update discovery and exact asset download
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash lane/native.sh
      - name: Public-safe discovery receipts only
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-native-discovery-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Uploaded public-safe receipt reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/native-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/native-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import os,json,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/native-meta.json').read_text());b=pathlib.Path('/tmp/native-receipt.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['id']==int(os.environ['GITHUB_RUN_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert m['size_in_bytes']==len(b) and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/native-receipt.zip') as z:
           assert z.testzip() is None
           names={'lane-identity.json','native-theme-current.json','native-theme-legacy.json','native-m3.json','FINAL_DISCOVERY.json'}
           assert set(z.namelist())==names
           for n in names:
            assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           final=json.loads(z.read('FINAL_DISCOVERY.json'))
           assert final['status']=='PASS' and len(final['component_checks'])==2
          print('PUBLIC_SAFE_NATIVE_READBACK',json.dumps({'status':'PASS','artifact_id':m['id'],'digest':m['digest'],'bytes':len(b)}))
          PY
      - name: Remove private checkout and synthetic artifacts
        if: always()
        run: rm -rf target historic-theme historic-m3 /tmp/vf-s01-wpcli.phar /tmp/theme-source.zip /tmp/theme-legacy-source.zip /tmp/m3-source.zip /tmp/theme-channel.json /tmp/m3-channel.json

