name: P07 Release14 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release14-readback-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 46320955ee0f01104b7a1ebdf39b772bf12a87fd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release14 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '46320955ee0f01104b7a1ebdf39b772bf12a87fd'
          test "$(cat BUILD_ID)" = '0.1.0-release14'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release14' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = 32d53b8350145f6a229211cc96ea591b1b8045da' docs/authority/CURRENT.md
          grep -Fq 'Release14 Distribution Gate           36710551712 PASS' docs/authority/CURRENT.md
          grep -Fq 'release14 Production install            NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md
          grep -Fq 'release13 Owner real backup path        REAL_FAIL / FINAL_VERIFY_NOT_PASS' docs/authority/CURRENT.md

          grep -Fq '| B46 | Stable Final Verification / Exact Beginner Diagnosis |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE14_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md
          ! grep -F 'B46 | Stable Final Verification / Exact Beginner Diagnosis' docs/authority/ACCEPTANCE_MATRIX.md | grep -Fq 'PUBLIC_DISTRIBUTION_PENDING'

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release14'
          assert slot3['source_main_commit']=='1dd186ef9786cd538d8c55c329f9857aa6dca240'
          assert slot3['backup_final_verify_contract']=='STABLE_TWO_CONSECUTIVE_FULL_PASS_V1'
          assert p['release']['slot3_build']=='0.1.0-release14'
          assert p['release']['public_distribution_commit']=='32d53b8350145f6a229211cc96ea591b1b8045da'
          assert p['release']['runtime_manifest_blob']=='e437d91b0ba6f257464659b50858e96a099184ce'
          assert p['release']['overlay_manifest_blob']=='543d50ee7eb6bd1870e3fbe007e875132b0d9852'
          assert p['release']['final_installer_blob']=='28c92ee9abb0cb36f190567fde2de4fe36305521'
          assert p['release']['stable_installer_blob']=='1d3e0dfc2b0ac97afd677fc2109006d193175dc0'
          assert p['release']['toolbox_blob']=='3b3e445cb86e15db29f203b447064a522224ddb7'
          assert p['production']['slot3_build']=='0.1.0-release3'
          assert p['production']['release13_owner_real_use']=='REAL_FAIL_FINAL_VERIFY_NOT_PASS'
          assert p['production']['release14_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert p['production']['migration_executed'] is False
          assert p['production']['dns_write'] is False
          assert p['production']['source_delete'] is False
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE14_READBACK_SOURCE=46320955ee0f01104b7a1ebdf39b772bf12a87fd'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
