name: TEMP P08 schema legacy boundary read-only verification
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-schema-legacy-boundary-20261126.yml'
permissions:
  contents: read
concurrency:
  group: p08-schema-legacy-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 77821cda34ad3e13b485fc7a64cde761da07fa29
  TARGET_TREE: 5cc801aa27e2ffa0ff35774096d33ee6d90b9c10
  GOV_SHA: 5afe0d29a5a401db80ecdb981038b89a8cefed0a
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-schema-legacy-boundary-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-schema-legacy-boundary-20261126.json --input .github/workflows/temp-p08-schema-legacy-boundary-20261126.yml
  legacy-boundary:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-schema-legacy-boundary-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify exact source and new rejection cases
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test ! -e .env
          test "$(git hash-object tests/compatibility/schema_legacy_entry_boundary.php)" = e590f523b60dc9217699d5a949ce11f25711fd1e
          for file in src/Recovery/MaintenanceGate.php src/Upgrade/AtomicReleasePointer.php src/Upgrade/OwnerFutureSiteDispatcher.php src/Upgrade/OwnerFutureAtomicService.php src/Upgrade/AtomicUpgradeArm.php src/Upgrade/FreshOwnerUpgradeBackup.php app/Http/Controllers/OwnerFutureUpdateController.php tests/compatibility/schema_legacy_entry_boundary.php; do
            php -l "$file" >/dev/null
          done
          echo P08_LEGACY_BOUNDARY_EXACT_SOURCE_SYNTAX=PASS
          if php tests/compatibility/schema_legacy_entry_boundary.php > "$RUNNER_TEMP/p08-schema-legacy-boundary.log" 2>&1; then
            grep -qx 'P08_LEGACY_CLEAR_BOUNDARY=PASS' "$RUNNER_TEMP/p08-schema-legacy-boundary.log"
            grep -qx 'P08_SCHEMA_LEGACY_BOUNDARY_CASES=5;FAIL=0' "$RUNNER_TEMP/p08-schema-legacy-boundary.log"
            echo P08_LEGACY_CLEAR_BOUNDARY=PASS
            echo 'P08_SCHEMA_LEGACY_BOUNDARY_CASES=5;FAIL=0'
            for engine in sqlite mysql mariadb; do
              grep -qx "P08_BACKUP_SOURCE_BINDING=PASS engine=$engine" "$RUNNER_TEMP/p08-schema-legacy-boundary.log"
              echo "P08_BACKUP_SOURCE_BINDING=PASS engine=$engine"
            done
          else
            python3 - "$RUNNER_TEMP/p08-schema-legacy-boundary.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          codes=sorted(set(re.findall(r'\b(?:R38_|R25_|ADOPS_|ATOMIC_ARM_|SCHEMA_TRANSACTION_|P08_FUTURE_)[A-Z_]+\b',raw)))
          print('P08_LEGACY_BOUNDARY_FAILURE_CODES='+','.join(codes[:12]) if codes else 'P08_LEGACY_BOUNDARY_FAILURE_CODES=UNCLASSIFIED')
          PY
            exit 1
          fi
      - name: Cleanup ephemeral private source and log
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP/p08-schema-legacy-boundary.log"
          test ! -e private-p08 && test ! -e "$RUNNER_TEMP/p08-schema-legacy-boundary.log"
          echo P08_LEGACY_BOUNDARY_CLEANUP=PASS
