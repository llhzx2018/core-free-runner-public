name: P01 2.47.408 Safe Bridge Distribution One-Shot Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247408-bridge-distribution.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: c95e32f3eb6548b258cb365dd8b14dab43c99af1
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update manifest in disposable directory
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-updates-408-bridge"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_408_DIST_EXACT_SOURCE=PASS
      - name: Full schema, PHP and source-specific Release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.408'
          assert m['current_version']=='2.47.407'
          assert m['from_versions']==['2.47.405']
          assert m['release_tag']=='v2.47.408'
          assert m['release_id']==419423440
          assert m['product_identity']=='9dd836b1237c084c314aa165e14d9e241f712693'
          assert m['asset_name']=='VF_Start_V2.47.408_UPDATE.zip'
          assert m['asset_bytes']==2663524
          assert m['asset_sha256']=='5a8052ef2779bfd2793c935a59373642c77d87c6d5228774b117834831419732'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['update_type']=='ATOMIC'
          print('P01_408_RESCUE_EXACT_RELEASE_AND_ONLY_405=PASS')
          PY
          echo P01_408_DIST_EQUIVALENT_CI=PASS
      - name: Remove private source
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_408_DIST_PRIVATE_ARTIFACT_NONE=PASS
