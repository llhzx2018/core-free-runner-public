name: P04 V2.8.11 Browser R2

on:
  push:
    paths:
      - '.github/workflows/p04-v2811-browser-r2-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: cab41a436126ccfb050ba37642ffc7a7c87953e6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, sodium, zip, mbstring, fileinfo
          coverage: none
      - name: Source sanity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          node --check product/public/assets/v271-unified-shell.js
          node --check product/public/assets/v280-navigation-simplify.js
          node --check product/public/assets/v2811-human-baseline.js
          php -l product/public/baseline-summary.php >/dev/null
          php -l product/public/system-baseline.php >/dev/null
          echo P04_V2811_BROWSER_R2_SOURCE=PASS
      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Five maintenance entries and route stability
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          WEB="$RUNNER_TEMP/p04-v2811-browser-r2"
          REPORT="$RUNNER_TEMP/p04-v2811-browser-r2.json"
          PORT=19042
          python3 scripts/build-v2811-release-tree.py "$WEB" >/dev/null
          php -d opcache.jit=0 -S "127.0.0.1:$PORT" -t "$WEB" >"$RUNNER_TEMP/p04-v2811-browser-r2-php.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .1; done
          cat > .runner-v2811-browser-r2.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base='http://127.0.0.1:19042';
          const password='Vf'+crypto.randomUUID().replaceAll('-','')+'Aa1';
          const report={status:'FAIL',stage:'start',routes:{},page_errors:[],console_errors:[],bad_responses:[]};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1365,height:900}});
          const page=await context.newPage();
          page.on('pageerror',e=>report.page_errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')report.console_errors.push(m.text())});
          page.on('response',r=>{if(r.status()>=400)report.bad_responses.push({url:r.url(),status:r.status()})});
          async function route(label, expected, forbidden='') {
            report.stage=`route:${label}`;
            const nav=page.locator('.v271-settings-nav');
            const btn=nav.getByRole('button',{name:label,exact:true});
            await btn.waitFor({state:'visible',timeout:8000});
            await btn.click({timeout:8000});
            await page.locator('.v271-settings-content h2',{hasText:expected}).first().waitFor({state:'visible',timeout:8000});
            const titles=await page.locator('.v271-settings-content h2').allInnerTexts();
            if(!titles.some(t=>t.trim()===expected)) throw new Error(`${label} missing ${expected}; ${JSON.stringify(titles)}`);
            if(forbidden && titles.some(t=>t.trim()===forbidden)) throw new Error(`${label} merged with ${forbidden}; ${JSON.stringify(titles)}`);
            report.routes[label]=titles;
          }
          try {
            report.stage='setup';
            await page.goto(base+'/setup.php',{waitUntil:'domcontentloaded'});
            await page.locator('#site_name').fill('VF Infra V2.8.11 Browser R2');
            await page.locator('#password').fill(password);
            await page.locator('#password_confirm').fill(password);
            await Promise.all([page.waitForURL(/login\.php\?installed=1/),page.getByRole('button',{name:'安装并进入系统'}).click()]);
            report.stage='login';
            await page.locator('#admin-password').fill(password);
            await Promise.all([page.waitForURL(/index\.php(?:#.*)?$/),page.getByRole('button',{name:'登录'}).click()]);

            report.stage='baseline-api';
            const api=await context.request.get(base+'/baseline-summary.php');
            if(!api.ok()) throw new Error(`baseline HTTP ${api.status()}`);
            const baseline=(await api.json()).baseline;
            if(Number(baseline?.counts?.DRIFT)!==0||Number(baseline?.counts?.UNKNOWN)!==0) throw new Error(`baseline ${JSON.stringify(baseline?.counts)}`);
            if(Number(baseline?.required_domain_count)!==15||Number(baseline?.covered_domain_count)!==15) throw new Error('baseline coverage');

            report.stage='shell';
            await page.goto(base+'/index.php#settings/baseline',{waitUntil:'domcontentloaded'});
            await page.locator('.v2811-baseline-hero h2').waitFor({state:'visible',timeout:10000});
            await page.waitForTimeout(150);
            const nav=page.locator('.v271-settings-nav');
            const expected=['系统信息','系统基线','在线升级','备份与恢复','运行健康'];
            for(const label of expected){
              const count=await nav.getByRole('button',{name:label,exact:true}).count();
              if(count!==1) throw new Error(`entry ${label} count=${count}; nav=${JSON.stringify(await nav.innerText())}`);
            }
            const navBefore=await nav.innerText();
            await page.waitForTimeout(250);
            const navAfter=await nav.innerText();
            if(navBefore!==navAfter) throw new Error(`nav unstable: ${JSON.stringify(navBefore)} -> ${JSON.stringify(navAfter)}`);
            if(!(await page.locator('.v2811-attention').innerText()).includes('当前没有需要你处理')) throw new Error('human attention missing');
            if(await page.locator('.v2811-baseline-group').count()!==5) throw new Error('group count');
            if(await page.locator('.v2811-tech-details').getAttribute('open')!==null) throw new Error('technical details open');

            await route('系统信息','系统信息','运行健康');
            await route('在线升级','在线升级');
            await route('备份与恢复','备份与恢复','导入导出');
            await route('运行健康','运行健康','系统信息');

            report.stage='mobile';
            await page.setViewportSize({width:390,height:844});
            await page.goto(base+'/index.php#settings/baseline',{waitUntil:'domcontentloaded'});
            await page.locator('.v2811-baseline-hero h2').waitFor({state:'visible',timeout:10000});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            report.mobile_overflow=overflow;
            if(overflow>2) throw new Error(`mobile overflow ${overflow}`);
            report.stage='complete'; report.status='PASS';
          } catch(e) {
            report.error=String(e?.stack||e);
            try {report.url=page.url(); report.body=(await page.locator('body').innerText()).slice(0,5000);} catch(_){}
          } finally {
            await browser.close();
            fs.writeFileSync(process.env.REPORT_PATH,JSON.stringify(report,null,2));
          }
          JS
          REPORT_PATH="$REPORT" node .runner-v2811-browser-r2.mjs
          cat "$REPORT"
          test "$(jq -r '.status' "$REPORT")" = PASS
          test "$(jq '.page_errors|length' "$REPORT")" = 0
          test "$(jq '.console_errors|length' "$REPORT")" = 0
          test "$(jq '.bad_responses|length' "$REPORT")" = 0
          kill "$SERVER_PID"; wait "$SERVER_PID" || true; trap - EXIT
          echo P04_V2811_BROWSER_R2=PASS
