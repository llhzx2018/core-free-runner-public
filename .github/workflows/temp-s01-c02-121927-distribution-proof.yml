name: TEMP S01-C02 1.21.927 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 8f362cd47ba51d4de5e53c26e18e07a1250a67b9
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.927
      ASSET: vf-tools-ops_V1.21.927.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 8f362cd47ba51d4de5e53c26e18e07a1250a67b9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.927"
          assert m["release_tag"]=="v1.21.927"
          assert m["asset_name"]=="vf-tools-ops_V1.21.927.zip"
          assert m["asset_bytes"]==3476843
          assert m["asset_sha256"]=="50bffc5c5352539537459cd9a661729a7d41373ccb83cca8efbdf95a58675934"
          assert m["runtime_files"]==975
          assert m["runtime_fingerprint"]=="2b37217038203518a3d9bbcc98f31c4e0f2c7ef2de08ac3e699042b45f373e61"
          assert "1.21.926" in m["from_versions"]
          assert m["schema_from"]=="6.0.0"
          assert m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 1.21.927 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "87365c86ce189fc61cdc66ddeae15cd512f91926"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3476843"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:50bffc5c5352539537459cd9a661729a7d41373ccb83cca8efbdf95a58675934"
          echo "S01-C02 1.21.927 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
