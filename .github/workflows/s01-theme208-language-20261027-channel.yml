name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-theme208-language-20261027]
    paths: ['.github/workflows/s01-theme208-language-20261027-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.208
  TARGET_SHA: afa7c7b3fc9ef9ee4a7a1036c20c26c38a070e18
  UPDATE_SHA: 5c4814a94207c23d45b90bc57078f219bc92f4b4
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 5c4814a94207c23d45b90bc57078f219bc92f4b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme208-language-20261027/channel-spec.json --input control/.github/workflows/s01-theme208-language-20261027-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only a6be1022b8a37458d38e6d0a92f67a99cc33522c 5c4814a94207c23d45b90bc57078f219bc92f4b4)" = projects/S01-C01.json
          git -C source diff --exit-code a6be1022b8a37458d38e6d0a92f67a99cc33522c 5c4814a94207c23d45b90bc57078f219bc92f4b4 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='526af72e467888f6a2bddea7383fe52ebfcea8161bc4bee4f736f7050f5a28fe' and m['asset_bytes']==2010876
          assert m['runtime_files']==476 and '1.35.207' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          import pathlib,subprocess
          base=json.loads(subprocess.check_output(['git','show','a6be1022b8a37458d38e6d0a92f67a99cc33522c:projects/S01-C01.json']))
          changed={k for k in set(base)|set(m)if base.get(k)!=m.get(k)}
          assert changed=={'target_version','from_versions','release_tag','asset_name','asset_bytes','asset_sha256','notes','released_at'}
          assert m['from_versions']==base['from_versions']+['1.35.207']
          pathlib.Path('../proof').mkdir(exist_ok=True)
          pathlib.Path('../proof/channel.json').write_text(json.dumps({'status':'PASS','source':'5c4814a94207c23d45b90bc57078f219bc92f4b4','version':m['target_version'],'sha256':m['asset_sha256'],'bytes':m['asset_bytes'],'runtime_files':m['runtime_files'],'changed_fields':sorted(changed),'protocol_tests':'PASS','production':'UNTOUCHED'},indent=2))
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme208-channel-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf source
