name: P05 V1.2.4 Formal FULL Publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-v124-formal-full-20260903.yml'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v124-formal-full-20260903'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P05_MAIN_SOURCE: f752c13b44fb624924926a49197ebe9519ec3f28
      P05_VERIFIED_TREE: 33c67dedfc25143c9e675c97dec903a8ef1c4134
      P05_FINAL_GATE_RUN: '33687734807'
      P05_FINAL_GATE_JOB: '100439096516'
      VERSION: 1.2.4
      PREVIOUS_PRODUCTION_VERSION: 1.2.3
      ASSET: VF_SEO_V1.2.4_FULL.zip
      RECEIPT: VF_SEO_V1.2.4_RELEASE_RECEIPT.txt
    steps:
      - name: Bind canonical v1.2.4 Final Exact Source PASS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$P05_FINAL_GATE_RUN" > /tmp/final-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$P05_FINAL_GATE_JOB" > /tmp/final-job.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/final-run.json')); job=json.load(open('/tmp/final-job.json'))
          assert run['id']==int(os.environ['P05_FINAL_GATE_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['P05_FINAL_GATE_JOB']) and job['run_id']==int(os.environ['P05_FINAL_GATE_RUN'])
          assert job['conclusion']=='success' and job['name']=='final-exact-source'
          print('P05_V124_FINAL_GATE_BINDING=PASS')
          PY

      - name: Checkout exact promoted P05 v1.2.4 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact source and release boundary
        working-directory: p05
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.4') process.exit(1);
          if(v.version!=='1.2.4'||v.target_version!=='1.2.4'||v.working_version!=='1.2.4') process.exit(1);
          if(v.production_version!=='1.2.3'||v.formal_release!=='v1.2.3') process.exit(1);
          if(v.release_authorization!=='OWNER_AUTHORIZED_V1.2.4 / EXECUTION_PENDING') process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          echo P05_V124_SOURCE_BOUNDARY=PASS

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Build pristine formal PHP staging
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm ci
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl sqlite3
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e))exit(1);} if(!class_exists("ZipArchive"))exit(1);'
          npm run release:source:gate
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = "$VERSION"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.env"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          test -f "$S/php/bin/init-update-service.php"
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' "$S/PHP_RELEASE_MANIFEST.json" >/dev/null
          ! grep -F 'core-free-runner-public' "$S/PHP_RELEASE_MANIFEST.json"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -name runtime.env -o -name setup.lock.json \) | grep -q .; then exit 1; fi
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          echo P05_V124_FORMAL_STAGING=PASS

      - name: Deterministic FULL build and receipt
        working-directory: p05
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release'); asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0)); info.external_attr=((p.stat().st_mode & 0o777)&0xFFFF)<<16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a'); build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"; rm "../$ASSET.b"
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c%s "../$ASSET")"
          files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nUPDATE_AUTHORITY=core-updates:llhzx2018/core-updates/projects/P05.json\nPREVIOUS_PRODUCTION_VERSION=%s\nPRODUCTION_WRITE=0\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" "$PREVIOUS_PRODUCTION_VERSION" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"
          echo "P05_V124_FULL_SHA256=$sha"
          echo "P05_V124_FULL_BYTES=$bytes"
          echo "P05_V124_FULL_FILES=$files"

      - name: Reconfirm remote v1.2.4 absence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then echo "release exists" >&2; exit 1; fi
          if gh api "repos/llhzx2018/vf-seo/git/ref/tags/v$VERSION" >/dev/null 2>&1; then echo "tag exists" >&2; exit 1; fi
          echo P05_V124_REMOTE_ABSENCE=PASS

      - name: Publish private Product Release v1.2.4 FULL
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        working-directory: p05
        run: |
          set -Eeuo pipefail
          gh release create "v$VERSION" --repo llhzx2018/vf-seo --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.2.4 · Product Optimization Patch' \
            --notes 'v1.2.4 publishes the completed post-v1.2.3 Product Optimization work: clearer Owner-facing presentation, correct recent-change/WHY routing, persisted Opportunity presentation hardening, Portfolio runtime read-model and decision-order consistency, and aligned unknown-provider source-state reasons across Node and PHP. Schema remains VF-SEO-SCHEMA@1/1 and the SQLite data format is unchanged. This publisher creates the formal FULL package only. The direct v1.2.3 → v1.2.4 online-update package and core-updates manifest are verified and published separately. Production is not modified by this publication step.' \
            "../$ASSET" "../$RECEIPT"

      - name: Remote readback formal Release truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json')); assets={x['name']:x for x in r['assets']}
          assert r['tag_name']=='v'+os.environ['VERSION'] and r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          full=assets[os.environ['ASSET']]
          assert int(full['size'])==int(os.environ['P05_BYTES'])
          assert full.get('digest')=='sha256:'+os.environ['P05_SHA256']
          assert os.environ['RECEIPT'] in assets
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_FULL_ASSET_ID='+str(full['id']))
          print('P05_RECEIPT_ASSET_ID='+str(assets[os.environ['RECEIPT']]['id']))
          print('P05_V124_FORMAL_FULL_PUBLICATION=PASS')
          print('P05_PRODUCTION_WRITE=0')
          PY
