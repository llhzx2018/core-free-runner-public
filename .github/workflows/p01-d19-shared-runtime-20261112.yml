name: P01 D19 installed Laravel durable private-state continuity (temporary)
on:
  push:
    branches:
      - test/p01-d19-shared-runtime-20261112
permissions:
  contents: read
jobs:
  p01-d19-real-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify registered public-safe runner and fixture identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d19-shared-runtime-20261112"
          echo P01_D19_INPUT=SYNTHEIC_ONLY
      - name: Probe private checkout capability without exposing secret
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          echo P01_D19_PRIVATE_READ=AVAILABLE
      - name: Checkout baseline immutable Laravel private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f9edb978eb9c969bf3460444fd177d7bfb6663af
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: before
      - name: Checkout independent candidate immutable Laravel private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e43b12d61f1b752c6a5126be2edd14bf285838f6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact source, D19 contract, and native parser
        run: |
          set -Eeuo pipefail
          test "$(git -C before rev-parse HEAD)" = "f9edb978eb9c969bf3460444fd177d7bfb6663af"
          test "$(git -C candidate rev-parse HEAD)" = "e43b12d61f1b752c6a5126be2edd14bf285838f6"
          test "$(cat before/VERSION)" = "2.47.515"
          test "$(cat candidate/VERSION)" = "2.47.515"
          php -l candidate/src/app/next/runtime/ImmutableReleasePrivateLayout.php
          php -l candidate/src/app/next/runtime/InstalledRuntime.php
          php -l candidate/src/app/next/runtime/LaravelBootAuthority.php
          php -l candidate/src/app/next/runtime/CloudPanelSiteActivation.php
          php -l candidate/src/app/next/runtime/CloudPanelFrontControllerPreflight.php
          php -l candidate/src/app/next/runtime/IsolatedRealLaravelRollout.php
          php -l candidate/src/app/next/runtime/WriteGate.php
          php -l candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          php -l candidate/tests/compatibility/p01_d19_shared_installed_switch.php
          python3 -m py_compile candidate/tests/compatibility/p01_d19_shared_installed_state.py
          php candidate/tests/unit/p01_d19_immutable_runtime_layout_contract.php
          echo P01_D19_EXACT_TWO_SOURCE_SHA=f9edb978eb9c969bf3460444fd177d7bfb6663af:e43b12d61f1b752c6a5126be2edd14bf285838f6
      - name: Prepare build-only Composer and PHP runtime
        run: |
          set -Eeuo pipefail
          if ! command -v composer >/dev/null || ! php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql")?0:1);'; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq composer unzip php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml php8.3-curl >/dev/null
          fi
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite")?0:1);'
          echo P01_D19_COMPOSER_ONLY_IN_BUILD=YES
      - name: Build two actual self-contained Laravel source zip and prove one sealed installed Owner instance
        run: |
          set -Eeuo pipefail
          umask 077
          site="/tmp/p01-d19-sandbox-$(openssl rand -hex 10)"
          cleanup() {
            rm -rf -- "$site" /tmp/p01-d19-before.zip /tmp/p01-d19-candidate.zip
          }
          trap cleanup EXIT
          mkdir -m 0700 "$site"
          mkdir -m 0700 "$site/private" "$site/releases"
          python3 before/scripts/build_p01_next_clean_full.py build --source-sha f9edb978eb9c969bf3460444fd177d7bfb6663af --output /tmp/p01-d19-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py build --source-sha e43b12d61f1b752c6a5126be2edd14bf285838f6 --output /tmp/p01-d19-candidate.zip
          python3 before/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d19-before.zip
          python3 candidate/scripts/build_p01_next_clean_full.py verify --zip /tmp/p01-d19-candidate.zip
          mkdir -m 0700 "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af" "$site/releases/e43b12d61f1b752c6a5126be2edd14bf285838f6"
          python3 -m zipfile -e /tmp/p01-d19-before.zip "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af"
          python3 -m zipfile -e /tmp/p01-d19-candidate.zip "$site/releases/e43b12d61f1b752c6a5126be2edd14bf285838f6"
          test -f "$site/releases/f9edb978eb9c969bf3460444fd177d7bfb6663af/vf-start-next/app/vendor/autoload.php"
          test -f "$site/releases/e43b12d61f1b752c6a5126be2edd14bf285838f6/vf-start-next/app/vendor/autoload.php"
          echo P01_D19_TWO_INDEPENDENT_LARAVEL_VENDOR_BUNDLES=VERIFIED
          python3 candidate/tests/compatibility/p01_d19_shared_installed_state.py \
            "$site" "f9edb978eb9c969bf3460444fd177d7bfb6663af" "e43b12d61f1b752c6a5126be2edd14bf285838f6" \
            "$PWD/candidate/tests/compatibility/p01_d19_shared_installed_switch.php"
          echo P01_D19_ACTUAL_INSTALLED_SQLITE_CONTINUITY=PASS
          echo P01_D19_PRODUCTION_CLOUDPANEL_ATOMIC=NOT_PROVEN
      - name: Re-run D15 and D17 isolation contracts on current exact source
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/p01_d15_write_gate_contract.php
          php candidate/tests/unit/p01_d17_isolated_code_switch_contract.php
          echo P01_D19_EXISTING_RECOVERY_GUARDS=PASS
      - name: Cleanup private source and test records
        if: always()
        run: |
          rm -rf -- before candidate
          echo P01_D19_PRIVATE_SOURCE_PERSISTED=NO
