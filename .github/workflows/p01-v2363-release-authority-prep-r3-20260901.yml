name: P01 V2.36.3 Release Authority Prep R3
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-release-authority-prep-r3-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      BRANCH: docs/p01-v2363-release-closure-20260901
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      REMOTE_TRUTH_R2: '33504969865'
    steps:
      - name: Checkout runner script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner
      - name: Checkout exact product develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Prepare and push docs-only closure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$PRODUCT_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_TRUTH_R2 --jq .conclusion)" = success
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then echo "target branch already exists"; exit 1; fi
          git switch -c "$BRANCH"
          python3 ../runner/.github/scripts/p01-v2363-release-authority-prep.py
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- src)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md
          test "$(git diff --cached --name-only | sort)" = "$expected"
          test -z "$(git diff --cached --name-only -- src)"
          git commit -m "docs(P01): record V2.36.3 release closure"
          test "$(git rev-parse HEAD^:src)" = "$(git rev-parse HEAD:src)"
          git push origin "$BRANCH"
          mkdir -p /tmp/p01-v2363-authority-prep-r3
          printf 'P01_V2363_AUTHORITY_PREP_R3=PASS\nBASE=%s\nBRANCH=%s\nCOMMIT=%s\nSRC_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$BASE" "$BRANCH" "$(git rev-parse HEAD)" "$(git rev-parse HEAD:src)" | tee /tmp/p01-v2363-authority-prep-r3/verdict.txt
      - name: Upload prep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-release-authority-prep-r3-${{ github.run_id }}
          path: /tmp/p01-v2363-authority-prep-r3
          if-no-files-found: warn
          retention-days: 90
