name: P01 IA V2 R7 project Git-source ownership proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r7-project-source-gate.yml'
permissions:
  contents: read
jobs:
  p01-r7-project-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 2ee2f94698b218d17ee36877ce541252766bc288
      BASELINE_SHA: 24fb3458a5273af36ded97a8a245b8604181a4f6
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Fetch exact private source without publishing its contents
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:$READ_TOKEN@github.com/$REPO.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R7_EXACT_PRIVATE_SOURCE_PIN=PASS
      - name: PHP lint, SQLite repeatability, Owner conflict and routes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.444'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.444'
          for file in src/app/GithubProjectImporter.php src/app/SubsiteAdminCatalog.php src/app/ProjectActionCenterPage.php src/projects-github-sync.php src/projects-source-manager.php tests/unit/ia_v2_r7_project_source_contract.php; do
            php -l "$file" >/dev/null
          done
          php tests/unit/project_github_sync_v247177_contract.php
          php tests/unit/project_source_only_v247177_contract.php
          php tests/unit/ia_v2_r7_project_source_contract.php
          echo P01_R7_PROJECT_SOURCE_AUTH_CSRF_IDEMPOTENCE=PASS
      - name: Canonical regression vs exact merged baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R7_CANONICAL_ZERO_DEBT=PASS
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R7_PRIVATE_SOURCE_CLEANUP=PASS
