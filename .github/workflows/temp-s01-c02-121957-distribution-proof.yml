name: TEMP S01-C02 1.21.957 Distribution Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-121957-distribution-proof.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      UPDATES_SHA: ce7e99f5327265a8636edb0ce34c9a7ea2a54530
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: e9b5b9a2bb7a4529841a74e070de78bc2761c533
      TAG: v1.21.957
      ASSET: vf-tools-ops_V1.21.957.zip
      ASSET_BYTES: '3410161'
      ASSET_SHA256: 4e720c0fa4f23ce33ed7122f15669f8a1082b1bfb6fd4c9a2ce76dd363411c0c
      RUNTIME_FILES: '961'
      RUNTIME_FP: 537636efc43a6c57ae363788d751ef3fd055f9db397e4f3d6df65ab92a444249

    steps:
      - name: Checkout exact distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Exact manifest identity and contract
        shell: bash
        working-directory: updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.957"
          assert m["release_tag"]=="v1.21.957"
          assert m["asset_name"]=="vf-tools-ops_V1.21.957.zip"
          assert m["asset_bytes"]==3410161
          assert m["asset_sha256"]=="4e720c0fa4f23ce33ed7122f15669f8a1082b1bfb6fd4c9a2ce76dd363411c0c"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="537636efc43a6c57ae363788d751ef3fd055f9db397e4f3d6df65ab92a444249"
          assert "1.21.956" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          print("S01-C02 1.21.957 manifest identity PASS")
          PY
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          echo 'S01-C02 1.21.957 DISTRIBUTION_EXACT_SOURCE_PROOF=PASS'

      - name: Cleanup
        if: always()
        run: rm -rf updates
