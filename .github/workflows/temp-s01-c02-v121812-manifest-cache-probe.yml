name: TEMP S01-C02 v1.21.812 Manifest Cache Probe
on:
  push:
    branches: [temp/s01-c02-v121812-shared-bootstrap-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121812-manifest-cache-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe core-updates raw contents API
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          url='https://api.github.com/repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main'
          echo 'DEFAULT:'
          curl -fsSL -D /tmp/h1 -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github.raw+json' "$url" | tee /tmp/m1 | jq '{target_version,from_versions,asset_name}'
          grep -Ei '^(etag|age|cache-control|x-github-request-id):' /tmp/h1 || true
          echo 'NO_CACHE:'
          curl -fsSL -D /tmp/h2 -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github.raw+json' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url" | tee /tmp/m2 | jq '{target_version,from_versions,asset_name}'
          grep -Ei '^(etag|age|cache-control|x-github-request-id):' /tmp/h2 || true
          test "$(jq -r '.target_version' /tmp/m1)" = '1.21.812'
          test "$(jq -r '.target_version' /tmp/m2)" = '1.21.812'
          echo PASS_MANIFEST_CACHE_PROBE
