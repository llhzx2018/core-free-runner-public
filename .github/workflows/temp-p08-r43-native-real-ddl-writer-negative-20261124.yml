name: TEMP P08 R43 actual MySQL MariaDB six DDL implicit commit outsider write negative
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-native-real-ddl-writer-negative-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 1e16c6badda41df640c619bf4f3ef784c1382561
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-real-ddl-writer-negative-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-native-real-ddl-writer-negative-20261124.json --input .github/workflows/temp-p08-r43-native-real-ddl-writer-negative-20261124.yml
  native-ddl-external-writer-negative:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-real-ddl-writer-negative-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
    steps:
      - name: Checkout exact v017 bridge candidate (private transient checkout)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - name: Checkout exact v018 integrated target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Checkout current GOV-doc delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source, vendor and Vite build + real source-locked dev Clean FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php > "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_DRIVER_TEST_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php >> "$RUNNER_TEMP/p08-r43-native-lint.log" 2>&1 || { echo P08_R43_NATIVE_TRANSACTION_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_COMPOSER=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_NATIVE_LOCKED_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-builder.log" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-builder.log" 2>&1 || { echo P08_R43_NATIVE_TARGET_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          echo P08_R43_NATIVE_TWO_CANONICAL_DEV_FULLS=PASS
      - name: Installed Owner and real six-DDL native implicit commit + independent writer
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -l private-p08-bridge/tests/compatibility/r43_native_mysql_mariadb_writer_isolation_negative.php > "$RUNNER_TEMP/r43-n-native-syntax.log" 2>&1 || { echo P08_R43_NEGATIVE_PHP_SYNTAX=FAIL; exit 1; }
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("P08_R43_NATIVE_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("CREATE DATABASE p08_ci_r43_native_success CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");' > "$RUNNER_TEMP/r43-n-db.log" 2>&1 || { echo P08_R43_NEGATIVE_DB_CREATE=FAIL; exit 1; }
          site="$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success"
          mkdir -m 700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$site"
          php private-p08-bridge/tests/compatibility/r43_isolated_installed_native_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-n-setup.log" 2>&1 || { echo P08_R43_NEGATIVE_REAL_OWNER_SETUP=FAIL; exit 1; }
          grep -qx 'P08_R43_NATIVE_REAL_FULL_017_OWNER_FIRST_INSTALL=PASS' "$RUNNER_TEMP/r43-n-setup.log"
          t="private-p08-bridge/tests/compatibility/r43_native_mysql_mariadb_writer_isolation_negative.php"
          if ! php "$t" "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-n-proof.log" 2>&1; then
            echo P08_R43_NEGATIVE_NATIVE_PROOF=FAIL
            grep -E '^P08_R43_NATIVE_NEGATIVE_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/r43-n-proof.log" | tail -15 || true
            c="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/r43-n-proof.log" | tail -1 || true)"
            if [[ "$c" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_SAFE_ERROR=$c"; else echo P08_R43_SAFE_ERROR=UNCLASSIFIED; fi
            exit 1
          fi
          grep -qx 'P08_R43_NATIVE_NEGATIVE_ROLLBACK_CANNOT_UNDO_NATIVE_DDL_OR_PRE_DDL_ROW=PASS' "$RUNNER_TEMP/r43-n-proof.log"
          grep -qx 'P08_R43_NATIVE_NEGATIVE_NONCOOPERATING_SQL_CLIENT_IGNORES_APP_FLOCK=PASS' "$RUNNER_TEMP/r43-n-proof.log"
          grep -qx 'P08_R43_NATIVE_NEGATIVE_REAL_SCHEMA_SHIPPING_ADMISSION_STILL_REFUSED=PASS' "$RUNNER_TEMP/r43-n-proof.log"
          grep -qx 'P08_R43_NATIVE_SCHEMA_PRODUCTION_APPLY=BLOCKED' "$RUNNER_TEMP/r43-n-proof.log"
          grep -qx "P08_R43_NATIVE_$P08_R43_NATIVE_ENGINE"_SIX_DDL_IMPLICIT_COMMIT_AND_EXTERNAL_WRITE_NEGATIVE=PASS "$RUNNER_TEMP/r43-n-proof.log"
          test "$(readlink "$site/current")" = "releases/$BRIDGE_SHA"
          echo "P08_R43_NATIVE_IMPLICIT_DDL_AND_NONCOOPERATING_WRITE_NEGATIVE=PASS engine=$P08_R43_NATIVE_ENGINE"
          echo P08_R43_PRODUCTION_SCHEMA_APPLY=BLOCKED
      - name: Clean native synthetic DB and private checkouts
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("P08_R43_NATIVE_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("DROP DATABASE IF EXISTS p08_ci_r43_native_success");' > "$RUNNER_TEMP/r43-n-drop.log" 2>&1
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP"/r43-n-*.log
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-site-$P08_R43_NATIVE_ENGINE-success"; then
            echo P08_R43_PRIVATE_SOURCE_AND_NATIVE_SYNTHETIC_SITE_CLEANUP=PASS
          else
            echo P08_R43_NATIVE_NEGATIVE_CLEANUP=FAIL
            exit 1
          fi
