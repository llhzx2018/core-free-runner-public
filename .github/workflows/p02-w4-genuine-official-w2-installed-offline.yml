name: P02 W4 genuine official 2.5.131 W2 FULL to staged W3 offline proof
on:
  pull_request:
    paths:
      - .github/workflows/p02-w4-genuine-official-w2-installed-offline.yml
permissions:
  contents: read
env:
  P02_EXACT_SHA: '309b2fc0e951d960a10d78ade08cad8f63235794'
  P02_OFFICIAL_SHA: 'f5dd7782e6fcae14a6ca04b8a263e1bee09f74e7'
  P02_W4_SYNTHETIC_ONLY: '1'
  P02_W3_SYNTHETIC_ONLY: '1'
  P02_W3_ENGINE: sqlite
jobs:
  w4-genuine-w2-full-install-and-bridge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-official-w2-real-full-to-w3-offline-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Exact working P02 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_EXACT_SHA }}
          path: p02-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact official tag source and W2 identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_OFFICIAL_SHA }}
          path: p02-official
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install actual W2/W3 PHP runtime and locked Vue Composer deps
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p02-private rev-parse HEAD)" = "$P02_EXACT_SHA"
          test "$(git -C p02-official rev-parse HEAD)" = "$P02_OFFICIAL_SHA"
          sudo apt-get update -qq > "$RUNNER_TEMP/p02-w4-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml php-curl php-zip composer sqlite3 curl unzip >> "$RUNNER_TEMP/p02-w4-apt.log" 2>&1
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("sqlite3") && extension_loaded("zip") ? 0 : 1);'
          composer --working-dir=p02-private/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-w4-composer.log" 2>&1
          npm ci --prefix p02-private/modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-w4-npm.log" 2>&1
          npm run build --prefix p02-private/modern/inertia-page > "$RUNNER_TEMP/p02-w4-vue.log" 2>&1
          php -l p02-private/modern/laravel/P02W4LegacySqliteBridge.php >/dev/null
          php -l p02-private/tests/integration/p02_w4_legacy_sqlite_bridge.php >/dev/null
          echo P02_W4_GENUINE_FULL_PHP_COMPOSER_VUE=PASS
      - name: Fetch authoritative exact official Release FULL and SHA256 manifest
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$PRIVATE_READ_TOKEN"
          curl -fsSL --retry 2 -H "Authorization: Bearer $PRIVATE_READ_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/llhzx2018/vf-library/releases/assets/747862273" -o "$RUNNER_TEMP/p02-w4-official-full.zip"
          curl -fsSL --retry 2 -H "Authorization: Bearer $PRIVATE_READ_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/llhzx2018/vf-library/releases/assets/747862274" -o "$RUNNER_TEMP/p02-w4-official-sums.txt"
          python3 - <<'PY'
          import hashlib, pathlib, re, zipfile, os, stat
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          archive=temp/"p02-w4-official-full.zip"
          sums=temp/"p02-w4-official-sums.txt"
          assert archive.stat().st_size==7389380, "OFFICIAL_RELEASE_ASSET_SIZE_MISMATCH"
          txt=sums.read_text(encoding="utf-8")
          rows=re.findall(r"(?m)^([a-f0-9]{64})\s+\*?(VF_Library_V2\.5\.131_FULL\.zip)$",txt)
          assert len(rows)==1,"OFFICIAL_SHA256_SUMS_ENTRY_NOT_UNIQUE"
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==rows[0][0], "OFFICIAL_RELEASE_ZIP_HASH"
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              assert all(not n.startswith("/") and "\\" not in n and
                  all(part not in ("","..",".") for part in n.rstrip("/").split("/")) for n in names)
              assert all(not stat.S_ISLNK(info.external_attr>>16) for info in z.infolist())
              assert {"index.php","setup.php","VERSION.txt","app/bootstrap.php",
                      "app/VfLibraryCoreUpdateAdapter.php"}.issubset(names),"OFFICIAL_FULL_LAYOUT"
              assert z.read("VERSION.txt")==b"2.5.131\n","OFFICIAL_FULL_VERSION"
              for local, original in (("index.php","public/index.php"),
                  ("app/bootstrap.php","src/app/bootstrap.php"),
                  ("app/VfLibraryCoreUpdateAdapter.php","src/app/VfLibraryCoreUpdateAdapter.php")):
                  assert z.read(local)==pathlib.Path("p02-official",original).read_bytes(),"OFFICIAL_FULL_SOURCE_BYTES"
          print("P02_W4_OFFICIAL_RELEASE_FULL_BYTES_SHA_LAYOUT=PASS")
          PY
      - name: Genuine official W2 web setup into disposable isolated legacy root
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$(mktemp -d -p /tmp p02-w4-legacy-XXXXXXXXXXXXXXX)"
          # mktemp template replacement is random alphanumeric, while the
          # migration guard requires lowercase hex: explicitly rename using a
          # crypto-random 16-hex slug, never touch any existing root.
          slug="$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(8))
          PY
          )"
          canonical="/tmp/p02-w4-legacy-$slug"
          test ! -e "$canonical"
          mv -- "$root" "$canonical"
          root="$canonical"
          chmod 0700 "$root"
          install -d -m 0700 "$root/htdocs"
          ROOT="$root" python3 - <<'PY'
          import os, pathlib, zipfile
          z=zipfile.ZipFile(pathlib.Path(os.environ["RUNNER_TEMP"])/"p02-w4-official-full.zip")
          target=pathlib.Path(os.environ["ROOT"])/"htdocs"
          z.extractall(target)
          assert (target/"setup.php").is_file()
          (pathlib.Path(os.environ["ROOT"])/"VERSION.txt").write_bytes(
              (target/"VERSION.txt").read_bytes())
          PY
          echo "$root" > "$RUNNER_TEMP/p02-w4-legacy-root"
          ROOT="$root" python3 - <<'PY'
          import http.cookiejar, os, pathlib, re, socket, subprocess, time
          import urllib.parse, urllib.request
          root=pathlib.Path(os.environ["ROOT"])
          with socket.socket() as sock:
              sock.bind(("127.0.0.1",0))
              port=sock.getsockname()[1]
          base=f"http://127.0.0.1:{port}"
          server=subprocess.Popen(["php","-d","display_errors=0","-S",
                f"127.0.0.1:{port}","-t",str(root/"htdocs")],
                stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              opener=urllib.request.build_opener(
                  urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()),
                  urllib.request.HTTPRedirectHandler())
              page=None
              for _ in range(60):
                  try:
                      page=opener.open(base+"/setup.php",timeout=3).read().decode()
                      break
                  except Exception:
                      time.sleep(0.3)
              assert page is not None,"OFFICIAL_SETUP_NOT_RUNNING"
              csrf=re.search(r'name="setup_csrf"\s+value="([a-f0-9]{64})"',page)
              assert csrf,"OFFICIAL_W2_SETUP_CSRF_MISSING"
              password="W4-Isolated-Password-2026!"
              payload=urllib.parse.urlencode({"setup_csrf":csrf.group(1),
                  "password":password,"password_confirm":password}).encode()
              req=urllib.request.Request(base+"/setup.php",data=payload,
                  headers={"Content-Type":"application/x-www-form-urlencoded",
                           "Origin":base},method="POST")
              # The expected successful 303 redirects into the now installed
              # private site; urllib follows it and obtains the Owner UI.
              result=opener.open(req,timeout=30)
              assert result.status==200,"OFFICIAL_W2_SETUP_REDIRECT_FAILED"
              assert (root/"htdocs/app/.runtime.php").is_file(),"W2_NOT_INSTALLED"
              priv=list(root.glob(".vftextbox-data-*"))
              assert len(priv)==1 and priv[0].is_dir(),"W2_PRIVATE_DATA_MISSING"
              assert len(list(priv[0].glob("textbox-*.sqlite")))==1
              assert len(list(priv[0].glob("config-*.json")))==1
              print("P02_W4_GENUINE_OFFICIAL_W2_HTTP_OWNER_SETUP=PASS")
          finally:
              server.terminate()
              try: server.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  server.kill()
                  server.wait(timeout=5)
          PY
      - name: Genuine official installed W2 UpdateCore v1 source and rollback matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$(cat "$RUNNER_TEMP/p02-w4-legacy-root")"
          test -d "$root/htdocs" && test -f "$root/htdocs/app/.runtime.php"
          php -l p02-private/scripts/p02-w2-updatecore-synthetic.php >/dev/null
          python3 -B -m py_compile p02-private/tests/integration/p02_w4_official_w2_atomic_bootstrap.py
          export P02_W4_REAL_INSTALLED_W2_ROOT="$root"
          export P02_W2_ATOMIC_SYNTHETIC=1
          export P02_W4_SYNTHETIC_ONLY=1
          set +e
          (cd p02-private && python3 -B tests/integration/p02_w4_official_w2_atomic_bootstrap.py) > "$RUNNER_TEMP/p02-w4-w2-native-bootstrap.log" 2>&1
          code=$?
          set -e
          if test "$code" -ne 0; then
            echo P02_W4_GENUINE_OFFICIAL_W2_OLD_UPDATER=FAIL
            exit 82
          fi
          grep '^P02_W4_GENUINE_W2_.*=PASS
        shell: bash
        env:
          P02_W4_EXPECTED_SOURCE_SHA: '309b2fc0e951d960a10d78ade08cad8f63235794'
        run: |
          set -Eeuo pipefail
          set +x
          root="$(cat "$RUNNER_TEMP/p02-w4-legacy-root")"
          case "$root" in /tmp/p02-w4-legacy-*) ;; *) exit 70;; esac
          test -d "$root/htdocs" && test -f "$root/htdocs/app/.runtime.php"
          set +e
          (cd p02-private && P02_W4_REAL_INSTALLED_W2_ROOT="$root" python3 -B tests/integration/p02_w4_candidate_from_bundle.py) > "$RUNNER_TEMP/p02-w4-real-bridge.log" 2>&1
          rc=$?
          set -e
          if test "$rc" -ne 0; then
            echo "P02_W4_TRUE_OFFICIAL_W2_TO_STAGED_W3=FAIL_STAGE_$rc"
            exit 71
          fi
          grep '^P02_W4_.*=PASS$' "$RUNNER_TEMP/p02-w4-real-bridge.log"
          grep -q 'P02_W4_GENUINE_25131_FULL_INSTALLED_W2_TO_W3_STAGED_DATA=PASS' "$RUNNER_TEMP/p02-w4-real-bridge.log" || exit 72
          echo P02_W4_TRUE_OFFICIAL_W2_TO_STAGED_W3=PASS
      - name: Cleanup all confidential temporary source and only test legacy roots
        if: always()
        shell: bash
        run: |
          set +x
          if test -f "$RUNNER_TEMP/p02-w4-legacy-root"; then
            root="$(cat "$RUNNER_TEMP/p02-w4-legacy-root")"
            if [[ "$root" =~ ^/tmp/p02-w4-legacy-[a-f0-9]{16}$ ]]; then
              rm -rf -- "$root"
            fi
          fi
          rm -rf -- p02-private p02-official
          rm -f "$RUNNER_TEMP"/p02-w4-*
          test ! -e p02-private && test ! -e p02-official
          echo P02_W4_PRIVATE_TEMP_CLEANUP=PASS
 "$RUNNER_TEMP/p02-w4-w2-native-bootstrap.log"
          grep -q 'P02_W4_GENUINE_W2_25131_UPDATECORE_V1_BOOTSTRAP=PASS' "$RUNNER_TEMP/p02-w4-w2-native-bootstrap.log"
          grep -q 'P02_W4_GENUINE_W2_V1_DATA_SCRATCH_MEDIA_ROLLBACK=PASS' "$RUNNER_TEMP/p02-w4-w2-native-bootstrap.log"
          grep -q 'P02_W4_W3_IN_PLACE_CUTOVER=NOT_IMPLEMENTED' "$RUNNER_TEMP/p02-w4-w2-native-bootstrap.log"
          echo P02_W4_REAL_OFFICIAL_W2_V1_BOOTSTRAP_AND_RECOVERY=PASS
      - name: Sealed W4 kit and real installed W2 data to W3 separate clean site
        shell: bash
        env:
          P02_W4_EXPECTED_SOURCE_SHA: '309b2fc0e951d960a10d78ade08cad8f63235794'
        run: |
          set -Eeuo pipefail
          set +x
          root="$(cat "$RUNNER_TEMP/p02-w4-legacy-root")"
          case "$root" in /tmp/p02-w4-legacy-*) ;; *) exit 70;; esac
          test -d "$root/htdocs" && test -f "$root/htdocs/app/.runtime.php"
          set +e
          (cd p02-private && P02_W4_REAL_INSTALLED_W2_ROOT="$root" python3 -B tests/integration/p02_w4_candidate_from_bundle.py) > "$RUNNER_TEMP/p02-w4-real-bridge.log" 2>&1
          rc=$?
          set -e
          if test "$rc" -ne 0; then
            echo "P02_W4_TRUE_OFFICIAL_W2_TO_STAGED_W3=FAIL_STAGE_$rc"
            exit 71
          fi
          grep '^P02_W4_.*=PASS$' "$RUNNER_TEMP/p02-w4-real-bridge.log"
          grep -q 'P02_W4_GENUINE_25131_FULL_INSTALLED_W2_TO_W3_STAGED_DATA=PASS' "$RUNNER_TEMP/p02-w4-real-bridge.log" || exit 72
          echo P02_W4_TRUE_OFFICIAL_W2_TO_STAGED_W3=PASS
      - name: Cleanup all confidential temporary source and only test legacy roots
        if: always()
        shell: bash
        run: |
          set +x
          if test -f "$RUNNER_TEMP/p02-w4-legacy-root"; then
            root="$(cat "$RUNNER_TEMP/p02-w4-legacy-root")"
            if [[ "$root" =~ ^/tmp/p02-w4-legacy-[a-f0-9]{16}$ ]]; then
              rm -rf -- "$root"
            fi
          fi
          rm -rf -- p02-private p02-official
          rm -f "$RUNNER_TEMP"/p02-w4-*
          test ! -e p02-private && test ! -e p02-official
          echo P02_W4_PRIVATE_TEMP_CLEANUP=PASS
