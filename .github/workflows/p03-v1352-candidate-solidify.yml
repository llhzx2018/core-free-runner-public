name: P03 V1.35.2 Candidate Solidification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1352-candidate-solidify.yml'

permissions:
  contents: read

concurrency:
  group: p03-v1352-candidate-solidify
  cancel-in-progress: false

jobs:
  solidify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ENGINEERING_HEAD: ee09d47d33b375a582eaf74ddf62dc4d0a810442
      TARGET_BRANCH: work/p03-v1.35.2-unified-update-core
      VERIFIED_RUN: '31895053003'
    steps:
      - name: Require unified credentials
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN missing' >&2; exit 78; }
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo 'UNIFIED_CREDENTIAL_GATE=PASS'

      - name: Ephemeral exact engineering checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-forge
          ref: ee09d47d33b375a582eaf74ddf62dc4d0a810442
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p03

      - name: Guard exact pre-candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p03 rev-parse HEAD)" = "$ENGINEERING_HEAD"
          test "$(tr -d '\r\n' < p03/VERSION)" = '1.35.1'
          grep -Fq "define('VFAB_VERSION', '1.35.1');" p03/src/app/bootstrap.php
          grep -Fq "define('VFAB_SCHEMA_VERSION', 29);" p03/src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.35.1'" p03/scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.35.0']" p03/scripts/build_atomic.py
          echo 'PRE_CANDIDATE_IDENTITY=PASS'

      - name: Apply exact verified candidate identity
        shell: bash
        working-directory: p03
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def exact(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {n}: {old!r}')
              p.write_text(s.replace(old,new), encoding='utf-8', newline='\n')

          Path('VERSION').write_text('1.35.2\n', encoding='utf-8', newline='\n')
          exact('src/app/bootstrap.php', "define('VFAB_VERSION', '1.35.1');", "define('VFAB_VERSION', '1.35.2');")
          exact('scripts/build_atomic.py', "TARGET_VERSION='1.35.1'", "TARGET_VERSION='1.35.2'")
          exact('scripts/build_atomic.py', "ALLOWED_SOURCES=['1.35.0']", "ALLOWED_SOURCES=['1.35.1']")
          exact('scripts/build_atomic.py', 'VF Forge 1.35.1 Formal Atomic Maintenance Release.', 'VF Forge 1.35.2 Formal Atomic Maintenance Release.')
          exact('scripts/build_atomic.py', "const VFF_ATOMIC_TARGET='1.35.1';", "const VFF_ATOMIC_TARGET='1.35.2';")

          c=Path('CHANGELOG.md')
          s=c.read_text(encoding='utf-8')
          marker='## [1.35.1] - 2026-08-14\n'
          if s.count(marker) != 1:
              raise SystemExit('CHANGELOG 1.35.1 marker mismatch')
          section=(
              '## [1.35.2] - 2026-08-16\n'
              '- Maintenance Release；Schema 继续保持 29，不引入 Business / Data-model Migration。\n'
              '- 在线更新发现层统一切换为 `core-updates/projects/P03.json` + GitHub Release Asset；保留 VF Forge 既有 Atomic / Recovery / Rollback 引擎。\n'
              '- 使用统一 `VF_PRIVATE_READ_TOKEN` 读取更新真相，并对 Project / Component、来源版本、Schema、Release Tag、Asset Name、bytes 与 SHA-256 做 Fail-Closed 校验。\n'
              '- `core-free-runner-public` 通过 ephemeral exact private checkout 完成 synthetic Existing Data、Asset Reference、Backup / Restore、Atomic Apply、Rollback / Recovery 与 Secret Missing Fail-Closed 验证；不上传私有源码 Artifact。\n'
              '- Candidate Verification Run `31895053003`：PASS。\n\n'
          )
          c.write_text(s.replace(marker, section+marker), encoding='utf-8', newline='\n')

          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('production_version')!='1.35.1' or d.get('schema_version')!=29:
              raise SystemExit('VF_PROJECT production baseline drift')
          d['status']='ACTIVE / MAINTENANCE_CANDIDATE_VERIFIED'
          d['working_version']='1.35.2'
          d['candidate_version']='1.35.2'
          d['current_verification']={
              'mode':'V1.35.2 UNIFIED UPDATE CORE / PUBLIC RUNNER VERIFIED CANDIDATE',
              'engineering_head':'ee09d47d33b375a582eaf74ddf62dc4d0a810442',
              'candidate_verification_run':'31895053003',
              'runner':'llhzx2018/core-free-runner-public',
              'source_checkout':'PRIVATE EXACT COMMIT / EPHEMERAL / VF_PRIVATE_READ_TOKEN',
              'test_data_policy':'SYNTHETIC / TEMPORARY / NO PRODUCTION DB / NO PRIVATE_DATA',
              'update_core':'PASS',
              'existing_data_preservation':'PASS / SYNTHETIC',
              'asset_reference_preservation':'PASS / SYNTHETIC',
              'backup_restore':'PASS / SYNTHETIC',
              'atomic_apply':'PASS',
              'rollback_recovery':'PASS',
              'secret_fail_closed':'PASS',
              'private_data_leakage':'0',
              'public_source_artifact':'0',
              'schema_change':'NONE / 29 -> 29',
              'production_deployment':'NOT EXECUTED'
          }
          d['maintenance_release']={
              'version':'1.35.2',
              'scope':['UNIFIED CORE-UPDATES DISCOVERY','GITHUB RELEASE ASSET RESOLUTION','BYTES + SHA-256 INTEGRITY','P03 ATOMIC ADAPTER'],
              'business_feature_change':False,
              'data_model_change':False,
              'schema_change':False,
              'allowed_source_versions':['1.35.1'],
              'release_status':'CANDIDATE VERIFIED / NOT RELEASED',
              'production_upgrade':'NOT AUTHORIZED / NOT EXECUTED'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n', encoding='utf-8', newline='\n')
          PY

          test "$(tr -d '\r\n' < VERSION)" = '1.35.2'
          grep -Fq "define('VFAB_VERSION', '1.35.2');" src/app/bootstrap.php
          grep -Fq "define('VFAB_SCHEMA_VERSION', 29);" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.35.2'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.35.1']" scripts/build_atomic.py
          test -z "$(git diff -- database/schema database/migrations)"
          git diff --check
          echo 'CANDIDATE_IDENTITY_PATCH=PASS'

      - name: Commit one exact private candidate
        shell: bash
        working-directory: p03
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VERSION src/app/bootstrap.php scripts/build_atomic.py CHANGELOG.md VF_PROJECT.json
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '5'
          git commit -m 'chore(release): solidify P03 V1.35.2 candidate'
          CANDIDATE=$(git rev-parse HEAD)
          gh auth setup-git
          git push https://github.com/llhzx2018/vf-forge.git "HEAD:$TARGET_BRANCH"
          echo "P03_CANDIDATE_COMMIT=$CANDIDATE"
          echo 'PRIVATE_CANDIDATE_PUSH=PASS'

      - name: No public source artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PRIVATE_SOURCE_PUBLIC_COMMIT=0'
          echo 'PRIVATE_SOURCE_PUBLIC_ARTIFACT=0'
          echo 'CANDIDATE_SOLIDIFICATION=PASS'
