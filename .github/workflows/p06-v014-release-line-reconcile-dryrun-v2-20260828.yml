name: P06 V0.1.14 Release Line Reconcile Dry Run V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-v014-release-line-reconcile-dryrun-v2-20260828.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MAIN_SOURCE: 44def40930019b1c597e404fa49c98d4ceb2ac42
      RELEASE_SOURCE: cec5ecd28b3cdc585d1b7cac17a9e2167d520ea1
      PR7_SOURCE: 94acb934fdc7c374425bd81f8b5047632317abce
      PR7_BRANCH: fix/p06-operations-console-ux-20260827
    steps:
      - uses: actions/checkout@v4
      - name: Exact read-only reconciliation inspection
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-press.git" p06 >/dev/null 2>&1
          cd p06
          git checkout "$MAIN_SOURCE"
          test "$(git rev-parse HEAD)" = "$MAIN_SOURCE"
          test "$(git rev-parse origin/main)" = "$MAIN_SOURCE"
          test "$(git rev-parse v0.1.13)" = "$RELEASE_SOURCE"
          test "$(git rev-parse origin/$PR7_BRANCH)" = "$PR7_SOURCE"
          git config user.name 'VictorForge Dry Run'
          git config user.email 'dryrun@invalid.local'

          BASE="$(git merge-base "$MAIN_SOURCE" "$RELEASE_SOURCE")"
          echo MAIN_VERSION="$(git show "$MAIN_SOURCE:VERSION" | tr -d '\r\n')"
          echo RELEASE_VERSION="$(git show "$RELEASE_SOURCE:VERSION" | tr -d '\r\n')"
          echo MAIN_SCHEMA="$(git show "$MAIN_SOURCE:VF_PROJECT.json" | jq -r '.schema')"
          echo RELEASE_SCHEMA="$(git show "$RELEASE_SOURCE:VF_PROJECT.json" | jq -r '.schema')"
          echo MERGE_BASE="$BASE"
          echo MAIN_UNIQUE_COMMITS="$(git rev-list --count "$RELEASE_SOURCE..$MAIN_SOURCE")"
          echo RELEASE_UNIQUE_COMMITS="$(git rev-list --count "$MAIN_SOURCE..$RELEASE_SOURCE")"
          echo MAIN_FILES_CHANGED_SINCE_BASE="$(git diff --name-only "$BASE" "$MAIN_SOURCE" | wc -l)"
          echo RELEASE_FILES_CHANGED_SINCE_BASE="$(git diff --name-only "$BASE" "$RELEASE_SOURCE" | wc -l)"

          set +e
          git merge --no-commit --no-ff "$RELEASE_SOURCE" >/tmp/merge.out 2>&1
          RC=$?
          set -e
          cat /tmp/merge.out
          if [ "$RC" -eq 0 ]; then
            echo MERGE_CLEAN=YES
            echo CONFLICT_COUNT=0
            echo AUTO_MERGED_CHANGED_FILES="$(git diff --cached --name-only | wc -l)"
          else
            echo MERGE_CLEAN=NO
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            echo CONFLICT_COUNT="${#conflicts[@]}"
            printf 'CONFLICT=%s\n' "${conflicts[@]}"
            echo STAGED_AUTO_MERGED_FILES="$(git diff --cached --name-only | wc -l)"
          fi

          echo '--- RELEASE-LINE IDENTITY PATHS ---'
          for f in VERSION VF_PROJECT.json database/migrations/002_schema_v3.php database/migrations/003_schema_v3.php; do
            [ -e "$f" ] && echo WORKTREE_PATH_PRESENT="$f"
          done
          if [ -f VERSION ]; then printf 'WORKTREE_VERSION='; tr -d '\r\n' < VERSION; echo; fi
          if jq -e . VF_PROJECT.json >/dev/null 2>&1; then echo WORKTREE_SCHEMA="$(jq -r '.schema' VF_PROJECT.json)"; else echo WORKTREE_VF_PROJECT=CONFLICTED; fi

          echo '--- BASELINE V2 PATH INVENTORY FROM PR8 ---'
          git diff --name-only 144b31929a74d079554dc31d1edb5e54a5bb37c4 df46f65c0b5564cbe7a62e24c343d545177f68cc | sed 's/^/P06_V2_RUNTIME_PATH=/'
          echo '--- RELEASE-LINE CHANGED PATHS OVERLAPPING BASELINE RUNTIME ---'
          while IFS= read -r f; do
            if git diff --name-only "$BASE" "$RELEASE_SOURCE" -- "$f" | grep -q .; then echo RELEASE_OVERLAP="$f"; fi
          done < <(git diff --name-only 144b31929a74d079554dc31d1edb5e54a5bb37c4 df46f65c0b5564cbe7a62e24c343d545177f68cc)

          git merge --abort 2>/dev/null || git reset --hard "$MAIN_SOURCE" >/dev/null
          test "$(git rev-parse HEAD)" = "$MAIN_SOURCE"
          test "$(git rev-parse origin/main)" = "$MAIN_SOURCE"
          test "$(git rev-parse origin/$PR7_BRANCH)" = "$PR7_SOURCE"
          echo P06_RELEASE_LINE_RECONCILE_DRYRUN_V2=PASS
