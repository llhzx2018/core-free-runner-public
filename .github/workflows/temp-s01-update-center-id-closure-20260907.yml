name: S01 Update Center ID Closure Candidate
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-update-center-id-closure-20260907.yml]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-theme
      BRANCH: work/s01-update-center-id-closure-20260907
      BASE_SHA: 6c30935c613802847d138097c63c3f73219ec02a
    steps:
      - name: Apply bounded update-center human-language closure
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          admin = Path('src/inc/update/class-vf-wp-update-admin-v1.php')
          s = admin.read_text()
          old = '''                                <div class="vf-update-component__topline">
                                    <span class="vf-update-component__id"><?php echo esc_html($view['id']); ?></span>
                                    <span class="vf-update-component__type"><?php echo esc_html($view['type_label']); ?></span>
                                </div>'''
          new = '''                                <div class="vf-update-component__topline">
                                    <span class="vf-update-component__type"><?php echo esc_html($view['type_label']); ?></span>
                                </div>'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          admin.write_text(s)

          css = Path('src/assets/css/admin/admin-update-center.css')
          s = css.read_text()
          old = '.vf-update-component__topline {\n    justify-content: space-between;'
          new = '.vf-update-component__topline {\n    justify-content: flex-end;'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '.vf-update-component__id,\n.vf-update-component__type {'
          new = '.vf-update-component__type {'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          css.write_text(s)

          test = Path('tests/update-center-human-language-contract.php')
          s = test.read_text()
          old = "    'Source Recovery Point',\n];"
          new = "    'Source Recovery Point',\n    '<span class=\"vf-update-component__id\">',\n];"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          test.write_text(s)
          PY
          php -l src/inc/update/class-vf-wp-update-admin-v1.php
          php -l tests/update-center-human-language-contract.php
          php tests/update-center-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          grep -F 'id="component-<?php echo esc_attr($view['"'"'id'"'"']); ?>"' src/inc/update/class-vf-wp-update-admin-v1.php >/dev/null
          grep -F "'component_id' => 'S01-C01'" src/inc/update/class-vf-wp-update-admin-v1.php >/dev/null
          ! grep -F '<span class="vf-update-component__id">' src/inc/update/class-vf-wp-update-admin-v1.php
          git diff --name-only "$BASE_SHA" | sort > /tmp/actual
          printf '%s\n' \
            src/assets/css/admin/admin-update-center.css \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            tests/update-center-human-language-contract.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/assets/css/admin/admin-update-center.css src/inc/update/class-vf-wp-update-admin-v1.php tests/update-center-human-language-contract.php
          git commit -m 'refine(S01-C01): hide internal component IDs in update center'
          git push -q origin HEAD:"$BRANCH"
          echo "THEME_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C01_UPDATE_CENTER_ID_CLOSURE_CANDIDATE'
