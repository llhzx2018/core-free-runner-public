name: P01 V247352 Transfer Export Native Regression (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247352-transfer-export-native.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c2dd425f04e1b3b0274073e5d18b798126930cfb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout exact unchanged product main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 23f1b838f66d41fec8534e1bb69f900e8c784ead
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
      - name: Prepare PHP 8.4 with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Verify candidate identity and PHP lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = c2dd425f04e1b3b0274073e5d18b798126930cfb
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.352
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.352
          grep -Fq "define('VF_VERSION', '2.47.352');" product/src/app/bootstrap.php
          php -l product/src/app/DataTransfer.php
          php -l product/tests/unit/data_transfer_export_cycle_native.php
          echo P01_247352_TRANSFER_IDENTITY_AND_SYNTAX=PASS
      - name: Native SQLite category export and invalid cycles
        shell: bash
        run: |
          set -Eeuo pipefail
          php product/tests/unit/data_transfer_export_cycle_native.php | tee /tmp/p01-247352-transfer-native.txt
          grep -Fx P01_TRANSFER_EXPORT_NORMAL_CATEGORY_SELECTION=PASS /tmp/p01-247352-transfer-native.txt
          grep -Fx P01_TRANSFER_EXPORT_CYCLIC_CATEGORIES_FAIL_CLOSED=PASS /tmp/p01-247352-transfer-native.txt
          grep -Fx P01_TRANSFER_EXPORT_READ_ONLY_PRESERVED=PASS /tmp/p01-247352-transfer-native.txt
      - name: Canonical zero-debt all-unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash product/tests/canonical_release_regression.sh product stable --require-zero-debt | tee /tmp/p01-247352-canonical.txt
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-247352-canonical.txt
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-247352-canonical.txt
          echo P01_247352_CANONICAL=PASS
