name: TEMP S01-C02 1.21.827 Recovery Stage Trace
on:
  push:
    branches:
      - temp/s01-c02-v121826-candidate-restart-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-recovery-stage-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops 1.21.827
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a59068c8e9c6adc533e37883f48bd38224e7362
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Trace trusted-source create path
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== ASSERT SOURCE ARCHIVE SAFE ==='
          grep -RIn "function assert_source_archive_safe_v121376\|assert_source_archive_safe_v121376" ops/includes | head -n 120 || true
          echo '=== UPLOAD DIR / SAVE / LOAD ==='
          grep -RInE 'function upload_dir\(|function save\(|function load\(|option_key\(' ops/includes/release/async-job-parts | head -n 220 || true
          echo '=== CREATE TRUSTED INSPECTION WINDOW ==='
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/includes/release/async-job-parts/01-job-create-trait.php')
          s=p.read_text()
          for key in ['public static function create_inspection_from_trusted_source_v121814','private static function create_job_from_source_file']:
              i=s.find(key); print('\n### '+key+'\n'); print(s[i:i+9000] if i>=0 else 'NOT_FOUND')
          PY
          echo '=== ZIP CLASS WINDOWS ==='
          files=$(grep -Rl "assert_source_archive_safe_v121376" ops/includes || true)
          for f in $files; do echo "--- $f"; grep -n -B25 -A120 "assert_source_archive_safe_v121376" "$f" || true; done
          echo '=== 1.21.815 MARKER BUG ==='
          sed -n '55,125p' ops/includes/site-release/s01-static-inspection-failure-readback-v121815.php
          echo TRACE_V121827_TRUSTED_SOURCE_CREATE_DONE
