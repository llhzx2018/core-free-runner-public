name: TEMP S01-C02 1.21.827 Recovery Stage Trace
on:
  push:
    branches:
      - temp/s01-c02-v121826-candidate-restart-trace-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-recovery-stage-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact Ops 1.21.827
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3a59068c8e9c6adc533e37883f48bd38224e7362
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Trace recovery and inspect-only stage pipeline
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT MARKER WRITERS ==='
          grep -RInE 'current_active_job_failed|SOURCE_REINSPECTION_FAILED|source_reinspection_failed' ops/includes || true
          echo '=== RUN NEXT STAGE / INSPECT ONLY ==='
          grep -RInE 'function run_next_stage|run_next_stage\(|\$inspectOnly|job_mode.*inspect_only|inspection_complete' ops/includes/release/async-job-parts ops/includes/release/steps | head -n 500 || true
          echo '=== STAGE PIPELINE FULL ==='
          sed -n '1,300p' ops/includes/release/async-job-parts/04-stage-pipeline-trait.php
          echo '=== STEP CLASSES ==='
          for f in ops/includes/release/steps/*.php; do echo "--- $f"; sed -n '1,240p' "$f"; done
          echo '=== SYNC RECORD ==='
          grep -RInE 'function sync_record|sync_record\(' ops/includes/release/async-job-parts | head -n 80 || true
          echo TRACE_V121827_RECOVERY_STAGE_DONE
