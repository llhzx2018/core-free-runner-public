name: P02 D3 cross-window quick capture source/SQLite and Windows proof (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-d3-cross-session-20261112.yml'
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Private read capability without disclosure
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ" || { echo P02_READ_UNAVAILABLE; exit 78; }
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: db8c2e034dd5f9688ff01fa1eb2bebf48da7e8ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Install isolated PHP SQLite for real transaction fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
          php -r 'exit(extension_loaded("pdo_sqlite")?0:1);'
      - name: D3 exact source, real synthetic browser and PHP security gate
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "db8c2e034dd5f9688ff01fa1eb2bebf48da7e8ce"
          echo P02_D3_SOURCE_IDENTITY=PASS
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs tests/unit/p02_d2c_isolated_search.test.mjs tests/unit/p02_d3_isolated_capture.test.mjs
          php tests/integration/p02_d3_capture_idempotency.php
          bash scripts/verify-repository.sh
          echo P02_D3_LINUX_SOURCE_AND_DENIAL=PASS
      - name: Cleanup transient private workspace
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
  windows-rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Private read capability without disclosure
        shell: pwsh
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_READ)) { throw 'P02_READ_UNAVAILABLE' }
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: db8c2e034dd5f9688ff01fa1eb2bebf48da7e8ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: D3 Windows Quick 0.1.5 tests and native Rust compile
        working-directory: product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'db8c2e034dd5f9688ff01fa1eb2bebf48da7e8ce') { throw 'P02_SOURCE_DRIFT' }
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs tests/unit/p02_d2c_isolated_search.test.mjs tests/unit/p02_d3_isolated_capture.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'P02_D3_WINDOWS_JS_FAIL' }
          cargo test --locked --manifest-path desktop/windows-quick/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'P02_D3_WINDOWS_RUST_FAIL' }
          Write-Output 'P02_D3_WINDOWS_SOURCE_AND_NATIVE=PASS'
      - name: Cleanup transient private workspace
        if: always()
        shell: pwsh
        run: |
          if (Test-Path product) { Remove-Item product -Force -Recurse }
          Write-Output 'PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO'
