name: p01-v247386-core-updates-distribution-one-off
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247386-core-updates-distribution-one-off.yml'
permissions:
  contents: read
jobs:
  distribution:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout disposable public control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private Core Updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: acd8dc993092a7a1867d7db5de71f67937b07a97
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Validate manifests and Update Core PHP regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "acd8dc993092a7a1867d7db5de71f67937b07a97"
          cd candidate
          python3 scripts/check_manifest_contract.py >/tmp/p01-distribution-manifest-audit.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p01-distribution-manifest-audit.json'))
          assert j['status']=='PASS',j
          p=json.load(open('projects/P01.json'))
          assert p['target_version']=='2.47.386',p
          assert p['from_versions']==['2.47.385'],p
          assert p['release_tag']=='v2.47.386',p
          assert p['product_identity']=='0e77cb323f2c46bff1ea897ad347d8d0c2b7ace9',p
          assert p['asset_name']=='VF_Start_V2.47.386_UPDATE.zip',p
          assert p['asset_bytes']==2559130,p
          assert p['asset_sha256']=='a10e4c8736b3ec01c26209dec23ca1e9a480177ebd2bb896b8cf2a997466c430',p
          assert p['schema_from']==p['schema_to']=='2026090401',p
          assert p['backup_required'] and p['rollback_supported'],p
          print('P01_CORE_UPDATES_EXACT_MANIFEST=PASS')
          PY
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-distribution-php-syntax.log
          php update-core/php/tests/run.php | tee /tmp/p01-distribution-updatecore-tests.log
          echo P01_CORE_UPDATES_SCHEMA_PHP_TESTS=PASS
      - name: Read back actual formal P01 Release and SHA identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.386 >/tmp/p01-publication.json
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.386 >/tmp/p01-tag.json
          jq -e '
            .id==415748655 and .tag_name=="v2.47.386" and
            .draft==false and .prerelease==false and
            ([.assets[] | select(.name=="VF_Start_V2.47.386_UPDATE.zip" and
              .size==2559130 and
              .digest=="sha256:a10e4c8736b3ec01c26209dec23ca1e9a480177ebd2bb896b8cf2a997466c430")] | length)==1
          ' /tmp/p01-publication.json >/dev/null
          jq -e '.object.sha=="0e77cb323f2c46bff1ea897ad347d8d0c2b7ace9"' /tmp/p01-tag.json >/dev/null
          echo P01_CORE_UPDATES_EXACT_RELEASE_REMOTE_READBACK=PASS
      - name: Erase temporary private source
        if: always()
        shell: bash
        run: rm -rf candidate
