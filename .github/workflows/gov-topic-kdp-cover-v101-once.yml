name: GOV-TOPIC KDP cover v1.0.1 one-shot exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gov-topic-kdp-cover-v101-once.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_GOV_TOPIC_SHA: cceb7f783cef43a0794e07598f461b65b5e99be3
    steps:
      - name: Verify transient private checkout capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo "PRIVATE_CHECKOUT=BLOCKED_CAPABILITY"; exit 78; }
          echo "PRIVATE_CHECKOUT=AVAILABLE"
      - name: Checkout exact private GOV-TOPIC source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-topic
          ref: ${{ env.EXPECTED_GOV_TOPIC_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Full repository unit tests and generated catalog verification
        shell: bash
        working-directory: private-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_GOV_TOPIC_SHA"
          python3 -m unittest discover -s tests -v
          python3 tools/build_catalog.py --check
          echo 'GOV_TOPIC_FULL_TESTS_AND_CATALOG=PASS'
      - name: Assert cover-only six-version update and new pricing guide
        shell: bash
        working-directory: private-src
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('.')
          ids=['kdp-niche-research-beginners','kdp-ai-coloring-workflow',
          'kdp-monochrome-mosaic-coloring','kdp-low-clicks-diagnosis',
          'kdp-paperback-print-preflight','kdp-new-book-first-30-days']
          c=json.loads((root/'distribution/p01/catalog.json').read_text())
          assert len(c['topics'])==10
          def entry(id):return next(x for x in c['topics'] if x['topic_id']==id)
          for tid in ids:
              old=root/'topics'/tid/'v1.0.0'
              new=root/'topics'/tid/'v1.0.1'
              t=entry(tid)
              assert t['topic_version']=='v1.0.1'
              for fn in ['index.html','sources.json']:
                  assert (old/fn).read_bytes()==(new/fn).read_bytes(),(tid,fn)
              png=(new/'cover.png').read_bytes()
              assert png[:8]==b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',png[16:24])==(1200,900)
          new_id='kdp-royalties-pricing-real-profit'
          t=entry(new_id)
          assert t['topic_version']=='v1.0.0'
          assert len(json.loads((root/t['sources']['path']).read_text())['sources'])==10
          html=(root/t['html']['path']).read_text(encoding='utf-8').lower()
          assert '<script' not in html and 'noindex' not in html
          for tid in ids+[new_id]:
              t=entry(tid)
              for asset in ['html','sources','cover']:
                  d=t[asset];raw=(root/d['path']).read_bytes()
                  assert len(raw)==d['bytes'],(tid,asset,'bytes')
                  assert hashlib.sha256(raw).hexdigest()==d['sha256'],(tid,asset,'digest')
          print('GOV_TOPIC_SEVEN_COVERS_AND_NEW_GUIDE=PASS')
          PY
      - name: Remove transient source
        shell: bash
        if: always()
        run: |
          rm -rf private-src
          echo "PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_ARTIFACT=NO"
