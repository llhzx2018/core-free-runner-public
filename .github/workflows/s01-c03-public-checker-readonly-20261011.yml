name: S01 C03 Public Checker Readonly Routes
on:
  push:
    branches:
      - task/s01-c03-checker-readonly-20261011
permissions:
  contents: read
jobs:
  read_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout public temporary scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Probe public pages with read-only GET
        run: |
          python3 -m py_compile scripts/s01-c03-public-readonly-20261011.py
          python3 scripts/s01-c03-public-readonly-20261011.py
      - name: Upload public-only route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-checker-readonly-${{ github.run_id }}
          path: proof/s01-checker-route-readonly.json
          if-no-files-found: warn
          retention-days: 7
