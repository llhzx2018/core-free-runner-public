name: P07 NetCheck Experiment

on:
  push:
    branches:
      - experiment/p07-netcheck-v01
    paths:
      - experiments/p07-netcheck.sh
      - .github/workflows/p07-netcheck-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: bash -n experiments/p07-netcheck.sh

      - name: Version
        run: |
          chmod +x experiments/p07-netcheck.sh
          NO_COLOR=1 ./experiments/p07-netcheck.sh --version | grep -F '0.3.0'

      - name: Internal self-test
        run: |
          NO_COLOR=1 ./experiments/p07-netcheck.sh --self-test | tee /tmp/selftest.txt
          grep -F 'P07_NETCHECK_SELF_TEST=PASS' /tmp/selftest.txt

      - name: Demo high-risk UX
        run: |
          printf '2\n\n0\n' | NO_COLOR=1 ./experiments/p07-netcheck.sh --demo | tee /tmp/demo.txt
          grep -F '综合判断：高风险' /tmp/demo.txt
          grep -F 'Suzhou CN' /tmp/demo.txt
          grep -F 'Ningbo CN' /tmp/demo.txt

      - name: Supply-chain safety regression
        run: |
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-netcheck.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-netcheck.sh
          grep -F '不会静默下载' experiments/p07-netcheck.sh

      - name: Demo report smoke
        run: |
          printf '5\n\n0\n' | NO_COLOR=1 ./experiments/p07-netcheck.sh --demo | tee /tmp/report.txt
          grep -F '报告已保存' /tmp/report.txt
