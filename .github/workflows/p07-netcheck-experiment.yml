name: P07 NetCheck Experiment

on:
  push:
    branches:
      - experiment/p07-netcheck-v01
    paths:
      - experiments/p07-netcheck.sh
      - .github/workflows/p07-netcheck-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-netcheck-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: bash -n experiments/p07-netcheck.sh

      - name: Version
        run: |
          chmod +x experiments/p07-netcheck.sh
          ./experiments/p07-netcheck.sh --version | grep -F '0.5.0'

      - name: Internal self-test and metadata mapping
        run: |
          ./experiments/p07-netcheck.sh --self-test | tee /tmp/selftest.txt
          grep -F 'SELF_TEST=PASS' /tmp/selftest.txt
          grep -F 'CHINA_MOBILE' experiments/p07-netcheck.sh
          grep -F 'CARRIER_SIGNAL' experiments/p07-netcheck.sh

      - name: Demo China high-risk UX
        run: |
          rm -rf /tmp/p07-netcheck-state
          ./experiments/p07-netcheck.sh --demo --china | tee /tmp/china.txt
          grep -F '综合判断：高风险' /tmp/china.txt
          grep -F 'VPS→中国' /tmp/china.txt
          grep -F 'TIMEOUT' /tmp/china.txt

      - name: Structured 15-field probe ledger
        run: |
          f=/tmp/p07-netcheck-state/p07-netcheck/last-results.tsv
          test -s "$f"
          awk -F '\t' 'NF!=15{bad=1} END{exit bad}' "$f"
          awk -F '\t' '$13=="CHINA_MOBILE" && $11=="VPS_OUTBOUND" && $15=="CARRIER_SIGNAL"{ok=1} END{exit !ok}' "$f"

      - name: China history evidence scope
        run: |
          f=$(find /tmp/p07-netcheck-state -type f -name 'china_*.json' | head -1)
          test -n "$f"
          python3 -c "import json,sys; p=json.load(open(sys.argv[1],encoding='utf-8')); assert p['version']=='0.5.0'; assert p['verdict']=='HIGH_RISK'; assert p['evidence_scope']=='VPS_OUTBOUND_ONLY'; assert p['mainland_inbound_probe']=='NOT_IMPLEMENTED'" "$f"

      - name: Demo Speedtest failure reasons and hard timeout
        run: |
          ./experiments/p07-netcheck.sh --demo --global --yes | tee /tmp/global.txt
          grep -F 'Suzhou CN' /tmp/global.txt
          grep -F 'Ningbo CN' /tmp/global.txt
          grep -F 'TIMEOUT' /tmp/global.txt
          grep -F 'TIMEOUT_COMMAND_MISSING' experiments/p07-netcheck.sh
          grep -F 'with_timeout 55s' experiments/p07-netcheck.sh

      - name: History and compare regression
        run: |
          rm -rf /tmp/p07-netcheck-state
          ./experiments/p07-netcheck.sh --demo --china >/dev/null
          sleep 1
          ./experiments/p07-netcheck.sh --demo --china >/dev/null
          ./experiments/p07-netcheck.sh --history | tee /tmp/history.txt
          ./experiments/p07-netcheck.sh --compare | tee /tmp/compare.txt
          grep -F 'HIGH_RISK' /tmp/history.txt
          grep -F '风险等级未变化' /tmp/compare.txt

      - name: Report probe metadata contract
        run: |
          ./experiments/p07-netcheck.sh --demo --china >/dev/null
          ./experiments/p07-netcheck.sh --demo --report | tee /tmp/report.txt
          grep -F '报告已保存' /tmp/report.txt
          f=$(find /tmp/p07-netcheck-state -type f -name 'netcheck_*.json' | head -1)
          test -n "$f"
          python3 -c "import json,sys; p=json.load(open(sys.argv[1],encoding='utf-8')); assert p['version']=='0.5.0'; assert p['evidence_scope']=='VPS_OUTBOUND_ONLY'; assert p['mainland_inbound_probe']=='NOT_IMPLEMENTED'; assert len(p['probes'])>=9; assert any(x['carrier']=='CHINA_MOBILE' and x['direction']=='VPS_OUTBOUND' and x['evidence']=='CARRIER_SIGNAL' for x in p['probes'])" "$f"

      - name: Supply-chain and mutation safety
        run: |
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-netcheck.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-netcheck.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-netcheck.sh
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-netcheck.sh
          grep -F '不会静默下载' experiments/p07-netcheck.sh
