name: TEMP P07 RC4 paired authority and final archive identity
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-paired-authority-final-byte-audit-20261125.yml
permissions:
  contents: read
jobs:
  paired-authority-and-archive:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-paired-authority-final-byte-audit-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOV_BASE: '74db859d21b0f93c7c2230d13eae9de8f0fd576a'
      GOV_HEAD: 'bf286d6c35f5d34451db52a3774d33d709992471'
      PRODUCT_SHA: '0d414b3c198bdab1e0d600d560f77ee7d9775a60'
      ADOPTION_SHA: '45a42dfa67df3c6e11f5d591c796539086c6a112'
    steps:
      - name: Checkout exact GOV proposal transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: bf286d6c35f5d34451db52a3774d33d709992471
          fetch-depth: 0
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact product adoption transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 45a42dfa67df3c6e11f5d591c796539086c6a112
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact paired authority proposals and inherited sealed rules
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT,INSTALL,UPGRADE,TESTING,SECURITY,DATA_SCHEMA,UA_UI
            IMPACT_REASON: Normative single-case maintenance publication scope and explicit applicable installation upgrade testing security recovery Git and terminal UX proof mapping; no sealed public body or full migration gate modified.
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_HEAD"
          test "$(git -C transient-p07 rev-parse HEAD)" = "$ADOPTION_SHA"
          test "$(git -C transient-p07 diff --name-only "$PRODUCT_SHA" "$ADOPTION_SHA")" = "docs/authority/ACCEPTANCE_MATRIX.md"
          python3 -B - <<'PY'
          from pathlib import Path
          import os,subprocess
          g=Path("transient-gov")
          p=Path("transient-p07")
          paths=subprocess.check_output(["git","-C",str(g),"diff","--name-only",os.environ["GOV_BASE"],os.environ["GOV_HEAD"]],text=True).splitlines()
          assert set(paths)=={"CURRENT.md","skills/README.md","skills/skill-release/V3.28/SKILL.md","governance/release/cases/P07_M03_RC4_INDEPENDENT_RC3_MAINTENANCE_20261125.md"}
          old=(g/"skills/skill-release/V3.27/SKILL.md").read_text()
          new=(g/"skills/skill-release/V3.28/SKILL.md").read_text()
          assert new.endswith(old[old.index("# skill-release V3.27"):])
          assert "| skill-release | V3.28 |" in (g/"CURRENT.md").read_text()
          assert "RP-07AC" in (p/"docs/authority/ACCEPTANCE_MATRIX.md").read_text()
          print("P07_RC4_EXACT_PAIRED_AUTHORITY_PROPOSALS=PASS")
          PY
          cd transient-gov
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" >"$RUNNER_TEMP/gov-closure.log" 2>&1 || { echo GOV_CLOSURE=FAIL; exit 21; }
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$GOV_BASE" --git-head "$GOV_HEAD" >"$RUNNER_TEMP/gov-dependency.log" 2>&1 || { echo GOV_DEPENDENCY=FAIL; exit 22; }
          for t in test_global_closure_lint.py test_current_dependency_lint.py test_public_authority_router_lint.py; do
            python3 -B -m unittest discover -s governance/public-authority/tools -p "$t" -q >"$RUNNER_TEMP/$t.log" 2>&1 || { echo "GOV_NEGATIVE_TEST_FAIL:$t"; exit 23; }
            grep -E '^Ran [0-9]+ tests?' "$RUNNER_TEMP/$t.log" | tail -1
            grep -Fxq OK "$RUNNER_TEMP/$t.log"
          done
          echo P07_RC4_GOV_SEALED_AND_DEPENDENCY_GATES=PASS
      - name: Recover final package identity from genuine old RC3 and exact functional source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          git -C transient-p07 checkout --detach "$PRODUCT_SHA" >/dev/null 2>&1
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 100 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip' \
            -o "$RUNNER_TEMP/original-rc3.zip"
          printf '%s  %s\n' '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d' "$RUNNER_TEMP/original-rc3.zip" | sha256sum -c - >/dev/null
          cd transient-p07
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/original-rc3.zip" --source . --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-first.zip" >"$RUNNER_TEMP/rc4-first.json"
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/original-rc3.zip" --source . --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-second.zip" >"$RUNNER_TEMP/rc4-second.json"
          cmp -s "$RUNNER_TEMP/rc4-first.zip" "$RUNNER_TEMP/rc4-second.zip"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,stat,zipfile
          r=pathlib.Path(os.environ["RUNNER_TEMP"])
          def blob(d): return hashlib.sha1(b"blob "+str(len(d)).encode()+b"\0"+d).hexdigest()
          a=json.loads((r/"rc4-first.json").read_text())
          assert a==json.loads((r/"rc4-second.json").read_text())
          sha=hashlib.sha256((r/"rc4-first.zip").read_bytes()).hexdigest()
          assert sha==a["candidate_sha256"]=="ef6e8731c4b0a7501d2fe55f18f86a74f374d03ad0e7030709b3120a7b13f1e7"
          assert a["source_sha"]==os.environ["PRODUCT_SHA"]
          assert not a["formal_release"] and not a["public_distribution"]
          pre="dist/p07/0.1.0/overlay/"
          with zipfile.ZipFile(r/"original-rc3.zip") as old, zipfile.ZipFile(r/"rc4-first.zip") as z:
              assert z.testzip() is None
              names=z.namelist()
              assert len(names)==len(set(names))
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and ".." not in p.parts and not item.is_dir()
                  assert stat.S_IFMT(item.external_attr>>16)==stat.S_IFREG
              manifest=z.read(pre+"RUNTIME.gitblob")
              seen=set()
              for line in manifest.decode().splitlines():
                  m=re.fullmatch(r"([0-9a-f]{40})  ((?:bin|lib|components)/[A-Za-z0-9_./-]+|BUILD_ID)",line)
                  assert m
                  expected,rel=m.groups()
                  assert rel not in seen and blob(z.read(pre+rel))==expected
                  seen.add(rel)
              assert set(names)=={pre+x for x in seen}|{pre+"RUNTIME.gitblob","installers/p07-final.sh","dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"}
              assert z.read(pre+"BUILD_ID")==b"0.1.0-release147-rc4\n"
              base="dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"
              assert old.read(base)==z.read(base)
              for n in names:
                  if n==base: continue
                  raw=z.read(n)
                  assert not re.search(rb"-----BEGIN (?:RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}",raw)
              print("P07_RC4_FINAL_CANDIDATE_SHA256="+sha)
              print("P07_RC4_RUNTIME_MANIFEST_BLOB="+blob(manifest))
              print("P07_RC4_INNER_INSTALLER_BLOB="+blob(z.read("installers/p07-final.sh")))
              print("P07_RC4_CANDIDATE_BYTES="+str((r/"rc4-first.zip").stat().st_size))
          print("P07_RC4_EXACT_PACKAGE_IDENTITY_AND_MEMBER_AUDIT=PASS")
          PY
      - name: Erase temporary private checkout and package bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-gov" "$GITHUB_WORKSPACE/transient-p07"
          rm -f -- "$RUNNER_TEMP"/original-rc3.zip "$RUNNER_TEMP"/rc4-first.zip "$RUNNER_TEMP"/rc4-second.zip "$RUNNER_TEMP"/rc4-first.json "$RUNNER_TEMP"/rc4-second.json "$RUNNER_TEMP"/gov-closure.log "$RUNNER_TEMP"/gov-dependency.log "$RUNNER_TEMP"/test_global_closure_lint.py.log "$RUNNER_TEMP"/test_current_dependency_lint.py.log "$RUNNER_TEMP"/test_public_authority_router_lint.py.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_RC4_TRANSIENT_BYTES_REMOVED=PASS
