name: S01 bounded public attribute owner locator
on:
  push:
    branches: [task/s01-tool-action-locator-20261011]
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 77457e6d093eb9d54a9a53a426793c9fe189b79a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Locate owning definitions without exporting private source
        run: |
          python3 - <<'PY'
          import pathlib,re,json
          result={}
          for name in ['vf_toolsite_rewrite_static_markup_links','vf_toolsite_multilingual_normalize_template_markup']:
           rows=[]
           for p in pathlib.Path('theme/src').rglob('*.php'):
            for i,line in enumerate(p.read_text().splitlines(),1):
             if re.search(r'function\s+'+name+r'\s*\(',line):
              rows.append({'path':str(p.relative_to('theme')),'line':i})
           result[name]=rows
          pathlib.Path('owner-locators.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-locators
          path: owner-locators.json
          retention-days: 7
      - name: Clean transient source
        if: always()
        run: rm -rf theme
