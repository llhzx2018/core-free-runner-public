name: S01-C03 exact channel original CI fallback
on:
  push:
    branches: [task/s01-c03-widget-channel-20261007]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/core-updates'
      TARGET_VERSION: '1.25.59'
      TARGET_SHA: '6a6fe157ac2ca43460f39f4012a9c81c68924d45'
      TARGET_TREE: '51621ce5d93a6f41e8ee2c41a41c8a4c6903afe4'
      CORE_BASE_SHA: 'db5b0676bcee19296cfb073a6a266fc78e0965f6'
      COMPONENT_SOURCE_SHA: '62aeab4f5dd7437339f07ca80b53eac12cfc7e49'
      FORMAL_RUN: '37637052182'
      FORMAL_RUNNER_SHA: '928c633e02c6ac7058e4a28329ae8a8c4c5ed158'
      FORMAL_ARTIFACT_ID: '11490361305'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target-owned spec preflight
        run: |
          set -Eeuo pipefail
          mkdir proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c03-widget-channel-20261007/spec.json --template runner/lanes/s01-c03-widget-channel-20261007/channel.template.yml --output /tmp/channel-rendered.yml >/dev/null
          cmp /tmp/channel-rendered.yml runner/.github/workflows/s01-c03-widget-channel-20261007.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c03-widget-channel-20261007/spec.json --input runner/.github/workflows/s01-c03-widget-channel-20261007.yml > proof/identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact channel diff and unchanged original CI
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C target diff --name-only $CORE_BASE_SHA HEAD)" = projects/S01-C03.json
          (cd target && python3 scripts/check_manifest_contract.py && php -v && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l && php update-core/php/tests/run.php)
      - name: Reverse actual formal artifact ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FORMAL_RUN" > /tmp/formal-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FORMAL_ARTIFACT_ID" > /tmp/formal-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$FORMAL_ARTIFACT_ID/zip" > /tmp/formal-proof.zip
          python3 runner/lanes/s01-c03-widget-channel-20261007/reverse.py
      - name: Actual formal asset exact bytes and component identity
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir delivered
          gh api "repos/llhzx2018/vf-tools-m3u8/releases/tags/v$TARGET_VERSION" > /tmp/real-release.json
          gh release download "v$TARGET_VERSION" --repo llhzx2018/vf-tools-m3u8 --pattern "vf-tools-m3u8_V$TARGET_VERSION.zip" --dir delivered
          python3 runner/lanes/s01-c03-widget-channel-20261007/verify.py
      - name: Public-safe channel proof
        id: artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-widget-channel-${{ github.run_id }}
          path: proof/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Reverse actual channel proof upload
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ID" > /tmp/channel-proof-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PROOF_ID/zip" > /tmp/channel-proof.zip
          python3 runner/lanes/s01-c03-widget-channel-20261007/receipt.py
      - name: Private cleanup
        if: always()
        run: rm -rf target delivered /tmp/formal-proof.zip
