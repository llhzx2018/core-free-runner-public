name: P02 V2.4.23 Formal Publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.23-formal-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 333d4fd52150f1c15e9911bce312bb2b6775f856
      SOURCE_TREE: 1d379370d275a192988de01b2ce546736151fa42
      TAG: v2.4.23
      REPO: llhzx2018/vf-library
      UPDATE_NAME: VF_Library_V2.4.23_UPDATE.zip
      EXPECTED_UPDATE_BYTES: '293214'
      EXPECTED_UPDATE_SHA256: 34166f1d1031de00e5bcf5c5f116e93a11a63e11c3771ff4931c310f22957ed4
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Checkout public execution shell
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require release credentials
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN"
          test -n "$RELEASE_TOKEN"

      - name: Checkout exact VF Library Candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 333d4fd52150f1c15e9911bce312bb2b6775f856
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Guard exact Candidate identity
        run: |
          set -Eeuo pipefail
          test "$(git -C p02 rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C p02 rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < p02/VERSION)" = '2.4.23'

      - name: Install formal release runtime dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq

      - name: Build and reverse-verify formal release set
        working-directory: p02
        env:
          VF_RELEASE_SOURCE_SHA: 333d4fd52150f1c15e9911bce312bb2b6775f856
          VF_RELEASE_SOURCE_REF: develop
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh

      - name: Lock online UPDATE asset identity
        run: |
          set -Eeuo pipefail
          f="p02/build/release/$UPDATE_NAME"
          test -f "$f"
          test "$(stat -c %s "$f")" = "$EXPECTED_UPDATE_BYTES"
          test "$(sha256sum "$f" | awk '{print $1}')" = "$EXPECTED_UPDATE_SHA256"

      - name: Create exact Git tag
        run: |
          set -Eeuo pipefail
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/tmp/tag.json 2>/dev/null; then
            current="$(jq -r '.object.sha' /tmp/tag.json)"
            if [ "$current" != "$SOURCE_SHA" ]; then
              echo "Existing tag points to unexpected object: $current" >&2
              exit 1
            fi
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SOURCE_SHA" >/tmp/tag.json
          fi
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"

      - name: Create formal GitHub Release
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/$REPO/releases/tags/$TAG" >/tmp/release.json 2>/dev/null; then
            notes="$(cat p02/build/release/VF_Library_V2.4.23_RELEASE_NOTES.md)"
            jq -n \
              --arg tag "$TAG" \
              --arg target "$SOURCE_SHA" \
              --arg name 'VF Library V2.4.23' \
              --arg body "$notes" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:false}' \
              | gh api -X POST "repos/$REPO/releases" --input - >/tmp/release.json
          fi
          test "$(jq -r '.tag_name' /tmp/release.json)" = "$TAG"
          test "$(jq -r '.draft' /tmp/release.json)" = 'false'
          test "$(jq -r '.prerelease' /tmp/release.json)" = 'false'

      - name: Publish exact formal Release Assets
        run: |
          set -Eeuo pipefail
          release_id="$(jq -r '.id' /tmp/release.json)"
          mkdir -p /tmp/remote-assets
          for f in p02/build/release/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            gh api "repos/$REPO/releases/$release_id/assets" --paginate >/tmp/assets-loop.json
            asset_id="$(jq -r --arg n "$name" '.[] | select(.name==$n) | .id' /tmp/assets-loop.json | head -n1)"
            if [ -n "$asset_id" ]; then
              gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$asset_id" >"/tmp/remote-assets/$name"
              test "$(stat -c %s "/tmp/remote-assets/$name")" = "$(stat -c %s "$f")"
              test "$(sha256sum "/tmp/remote-assets/$name" | awk '{print $1}')" = "$(sha256sum "$f" | awk '{print $1}')"
            else
              gh release upload "$TAG" "$f" --repo "$REPO"
            fi
          done

      - name: Remote readback UPDATE bytes and SHA-256
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/releases/tags/$TAG" >/tmp/release-final.json
          release_id="$(jq -r '.id' /tmp/release-final.json)"
          gh api "repos/$REPO/releases/$release_id/assets" --paginate >/tmp/assets.json
          asset_id="$(jq -r --arg n "$UPDATE_NAME" '.[] | select(.name==$n) | .id' /tmp/assets.json | head -n1)"
          asset_size="$(jq -r --arg n "$UPDATE_NAME" '.[] | select(.name==$n) | .size' /tmp/assets.json | head -n1)"
          test -n "$asset_id"
          test "$asset_size" = "$EXPECTED_UPDATE_BYTES"
          gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$asset_id" >/tmp/remote-update.zip
          remote_bytes="$(stat -c %s /tmp/remote-update.zip)"
          remote_sha="$(sha256sum /tmp/remote-update.zip | awk '{print $1}')"
          test "$remote_bytes" = "$EXPECTED_UPDATE_BYTES"
          test "$remote_sha" = "$EXPECTED_UPDATE_SHA256"
          mkdir -p public-evidence
          jq -n \
            --arg result PASS \
            --arg project_id P02 \
            --arg version 2.4.23 \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg tag "$TAG" \
            --argjson release_id "$(jq -r '.id' /tmp/release-final.json)" \
            --arg released_at "$(jq -r '.published_at' /tmp/release-final.json)" \
            --arg asset_name "$UPDATE_NAME" \
            --argjson asset_id "$asset_id" \
            --argjson asset_bytes "$remote_bytes" \
            --arg asset_sha256 "$remote_sha" \
            '{result:$result,project_id:$project_id,version:$version,source_sha:$source_sha,source_tree:$source_tree,release_tag:$tag,release_id:$release_id,released_at:$released_at,asset_name:$asset_name,asset_id:$asset_id,asset_bytes:$asset_bytes,asset_sha256:$asset_sha256,privacy:"REDACTED_METADATA_ONLY_NO_SOURCE_BYTES_NO_DB_NO_SESSION_NO_SECRET"}' \
            >public-evidence/p02-v2.4.23-formal-publish.json

      - name: Public evidence privacy gate and cleanup
        run: |
          set -Eeuo pipefail
          ! find public-evidence -type f \( -name '*.zip' -o -name '*.php' -o -name '*.sqlite' -o -name '*.db' \) -print -quit | grep -q .
          ! grep -RIE --binary-files=without-match '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|Authorization:[[:space:]]*(token|Bearer)|Set-Cookie:|PHPSESSID=|VF_PRIVATE_READ_TOKEN=|VF_RELEASE_WRITE_TOKEN=)' public-evidence
          rm -rf p02 /tmp/remote-assets /tmp/remote-update.zip

      - name: Upload redacted formal publish evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.23-formal-publish-${{ github.run_id }}
          path: public-evidence
          if-no-files-found: error
          retention-days: 14
