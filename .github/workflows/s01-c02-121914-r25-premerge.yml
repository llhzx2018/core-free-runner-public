name: S01-C02 1.21.914 R25 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: a97a25e61ec165d74febf5f030f7e6edea46e12d
      BASE_SHA: a35dada3e273ff6bb3015353224da39b849ba57a

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a97a25e61ec165d74febf5f030f7e6edea46e12d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify R25 exact scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "1.21.914"
          grep -Fq 'Version: 1.21.914' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.914'" ops/vf-ops.php
          grep -Fq 'S01-SECONDARY-HIERARCHY-R25' ops/vf-ops.php
          php ops/tests/s01-c02-121914-secondary-hierarchy-r25-contract.php
          php -l ops/vf-ops.php >/dev/null

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-content-seo-r16.css             assets/css/current/admin-s01-dashboard-r14.css             assets/css/current/admin-s01-quality-r17.css             assets/css/current/admin-s01-system-publish-r13.css             assets/css/current/admin-s01-tools-r15.css             assets/css/current/admin-s01-v6-shell-r1.css             tests/s01-c02-121914-secondary-hierarchy-r25-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          python3 - <<'PY'
          from pathlib import Path
          files=[
            'admin-s01-dashboard-r14.css',
            'admin-s01-tools-r15.css',
            'admin-s01-content-seo-r16.css',
            'admin-s01-quality-r17.css',
            'admin-s01-system-publish-r13.css',
          ]
          for name in files:
              s=(Path('ops/assets/css/current')/name).read_text(encoding='utf-8')
              assert s.count('{')==s.count('}'), name
              assert 'R25 · Shared secondary hierarchy binding' in s, name

          shell=Path('ops/assets/css/current/admin-s01-v6-shell-r1.css').read_text(encoding='utf-8')
          for needle in [
              '--vf-v6-feedback-min-height:46px',
              '--vf-v6-disclosure-min-height:50px',
              '--vf-v6-empty-title-size:12px',
              '--vf-v6-form-label-size:13px',
              '--vf-v6-evidence-value-size:11px',
          ]:
              assert needle in shell, needle

          system=Path('ops/assets/css/current/admin-s01-system-publish-r13.css').read_text(encoding='utf-8')
          for needle in [
              'var(--vf-v6-disclosure-title-size)',
              'var(--vf-v6-form-label-size)',
              'var(--vf-v6-empty-title-size)',
              'var(--vf-v6-evidence-value-size)',
          ]:
              assert needle in system, needle
          print('PASS_R25_SECONDARY_HIERARCHY')
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/assets/css/current/admin-s01-v6-shell-r1.css             ops/assets/css/current/admin-s01-dashboard-r14.css             ops/assets/css/current/admin-s01-tools-r15.css             ops/assets/css/current/admin-s01-content-seo-r16.css             ops/assets/css/current/admin-s01-quality-r17.css             ops/assets/css/current/admin-s01-system-publish-r13.css

          echo PASS_S01_C02_121914_R25_PREMERGE
