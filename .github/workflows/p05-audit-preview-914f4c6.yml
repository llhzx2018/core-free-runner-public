name: P05 Product Audit Page Preview Completeness Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-audit-preview-914f4c6.yml']
permissions:
  contents: read
jobs:
  p05-product-audit-preview-truth:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-audit-preview-914f4c6-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: 914f4c62cf336dd51ca1d3b9dc83f6e0068ae263
      P05_BASE_MAIN: 97a81073a902a55dc140dafae468eb2d6483e972
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and two-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx'
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' src/client/ProductSiteViews.tsx tests/unit/product-audit-page-preview-completeness.test.ts | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo 'P05_PRODUCT_AUDIT_PREVIEW_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_PRODUCT_AUDIT_PREVIEW_ENGINEERING=PASS'
      - name: Product Audit completeness truth and cumulative contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test tests/unit/product-audit-page-preview-completeness.test.ts
          node --import tsx --test tests/unit/product-search-movement-label-truth.test.ts tests/unit/classic-keyword-trend-coverage.test.ts tests/unit/product-global-search-truth.test.ts tests/unit/global-search-completeness-window.test.ts tests/unit/product-page-workspace-completeness.test.ts tests/unit/product-object-detail-state-truth.test.ts tests/unit/product-object-selection-race-truth.test.ts tests/unit/product-portfolio-truth.test.ts tests/unit/product-portfolio-query-boundary.test.ts
          npm run test:php-product-parity
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_PRODUCT_AUDIT_PAGE_PREVIEW_COMPLETENESS=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          echo 'P05_PRODUCT_AUDIT_PREVIEW_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_PRODUCT_AUDIT_PREVIEW_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_PRODUCT_AUDIT_PREVIEW_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
