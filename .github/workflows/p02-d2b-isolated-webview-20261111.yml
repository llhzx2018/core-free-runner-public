name: P02 D2-B isolated remote Webview exact Windows proof (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p02-d2b-isolated-webview-20261111.yml']
permissions:
  contents: read
jobs:
  p02-d2b:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Verify transient P02 source capability
        shell: pwsh
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_READ)) { throw "READ_CAPABILITY_UNAVAILABLE" }
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 8534e641a36e14a21ed232c5684f0c4848b7f3da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact identity and trusted local UI interaction tests
        working-directory: product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "8534e641a36e14a21ed232c5684f0c4848b7f3da") { throw "SOURCE_DRIFT" }
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "D2B_LOCAL_UI_TEST_FAILURE" }
      - name: Compile real Tauri 2 Windows code and navigation safety tests
        working-directory: product/desktop/windows-quick/src-tauri
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw "D2B_WINDOWS_RUST_FAILURE" }
      - name: Remove transient private source and binary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path product) { Remove-Item product -Recurse -Force }
          Write-Output "PUBLIC_GIT_OR_ARTIFACT_PRIVATE_CONTENT=NONE"
