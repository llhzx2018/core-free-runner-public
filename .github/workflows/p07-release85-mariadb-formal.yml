name: P07 release85 MariaDB and Care rc54 Formal Release
on:
  push:
    branches: [main]
    paths:
      - 'packages/p07-system-care/0.1.0-rc54/**'
      - 'installers/p07-system-care.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/p07.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release85-mariadb-formal.yml'

permissions:
  contents: read

concurrency:
  group: p07-release85-mariadb-formal
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: p07-v0.1.0-release85-mariadb-1011
      RELEASE_REPO: llhzx2018/core-free-runner-public
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact merged source and immutable distribution preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo 'P07_RELEASE_TOKEN_MISSING'; exit 78; }
          test "$GITHUB_REPOSITORY" = "$RELEASE_REPO"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(gh api "repos/$RELEASE_REPO/git/ref/heads/main" --jq '.object.sha')"
          test "$remote_main" = "$GITHUB_SHA"
          pkg='packages/p07-system-care/0.1.0-rc54'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc54'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'e9ccedae9232d345ebbe945ee37197f030ce2ea5'
          (cd "$pkg" && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc54"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc54'" installers/p07-system-care.sh
          grep -Fq "BEGINNER_UI_BLOB='0b0b72f7ff6933dc7cb59881d1becadc40566ee7'" installers/p07-system-care.sh
          test "$(git hash-object installers/p07-system-care.sh)" = e62f9def82703fb8019c73a8745f65157af2cfe2
          grep -Fq "MANIFEST_BLOB='e9ccedae9232d345ebbe945ee37197f030ce2ea5'" installers/p07-system-care.sh
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release85'
          test "$(git hash-object dist/p07/0.1.0/overlay/RUNTIME.gitblob)" = '929db8209957c3ad8c742360ebf15fdb3605071f'
          test "$(git hash-object dist/p07/0.1.0/overlay/MANIFEST.gitblob)" = '492a8eccf87635953f418bfa6fc737c947ea9090'
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < RUNTIME.gitblob)
          (cd dist/p07/0.1.0/overlay && while read -r sha name; do test "$(git hash-object "$name")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = '96dd25258e50aba0c404ddf53a296f2df849d110'
          grep -Fq 'EXPECTED_BLOB="96dd25258e50aba0c404ddf53a296f2df849d110"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release85"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="929db8209957c3ad8c742360ebf15fdb3605071f"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release85"' installers/p07-toolbox.sh
          grep -Fq 'CLOUDPANEL_BOOTSTRAP_DB_ENGINE = "MARIADB_10.11"' dist/p07/0.1.0/overlay/lib/server_migration.py
          grep -Fq 'NEW_SERVER_REQUIRES_MARIADB_10_11' dist/p07/0.1.0/overlay/lib/server_migration_pull.py
          grep -Fq "VFOPS_BUILD_EXPECTED='0.1.0-release85'" "$pkg/vf-system-care.sh"
          bash -n "$pkg/intrusion-evidence.sh" installers/p07-system-care.sh installers/p07-toolbox.sh installers/p07-final.sh installers/p07.sh dist/p07/0.1.0/overlay/bin/vfops-init-ui
          (cd dist/p07/0.1.0/overlay && PYTHONPATH=lib python3 -m unittest -q tests.test_mariadb_owner_policy tests.test_server_migration tests.test_server_migration_pull)
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_baseline_rc50.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_status_rc51.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_overview_rc52.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_verify_rc53.py' -q
          python3 -m unittest discover -s tests -p 'test_p07_wp_owner_triage_rc48.py' -q
          echo 'P07_RELEASE85_MERGED_EXACT_SOURCE=PASS'

      - name: Formal Release through registered VF release credential
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release85 · 新服务器默认 MariaDB 10.11' \
              --notes 'CloudPanel 全新服务器默认 MariaDB 10.11。目标迁移检查、断点恢复及最终切换均拒绝错误数据库引擎，永不自动替换已有 MySQL/Percona。System Care rc54 对齐 release85。119 项隔离迁移测试 PASS；产品仓原生 CI 存在历史基础设施失败，未声称通过。未执行真实生产迁移或跨引擎 E2E；DNS、旧机及生产操作均需 Owner 手工确认。'
          fi
          tag_sha="$(gh api "repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$GITHUB_SHA" || { echo 'P07_RELEASE85_TAG_IDENTITY_MISMATCH'; exit 81; }
          release_data="$(gh api "repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.tag_name' <<< "$release_data")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<< "$release_data")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<< "$release_data")" = false
          test "$(jq -r '.prerelease' <<< "$release_data")" = false
          echo 'P07_RELEASE85_FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Published public distribution and raw-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_url="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA/packages/p07-system-care/0.1.0-rc54/MANIFEST.gitblob"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/p07-release85-manifest
          test "$(git hash-object /tmp/p07-release85-manifest)" = 'e9ccedae9232d345ebbe945ee37197f030ce2ea5'
          url="https://raw.githubusercontent.com/$RELEASE_REPO/main/installers/p07-system-care.sh"
          good=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --proto '=https' --tlsv1.2 "$url" -o /tmp/p07-public-installer &&
              grep -Fq "VERSION='0.1.0-rc54'" /tmp/p07-public-installer &&
              grep -Fq "MANIFEST_BLOB='e9ccedae9232d345ebbe945ee37197f030ce2ea5'" /tmp/p07-public-installer; then
              good=1
              break
            fi
            sleep 3
          done
          test "$good" = 1 || { echo P07_RELEASE85_PUBLIC_INSTALLER_NOT_CURRENT; exit 85; }
          live_base="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-final.sh" -o /tmp/p07-release85-final
          test "$(git hash-object /tmp/p07-release85-final)" = '96dd25258e50aba0c404ddf53a296f2df849d110'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/dist/p07/0.1.0/overlay/RUNTIME.gitblob" -o /tmp/p07-release85-runtime
          test "$(git hash-object /tmp/p07-release85-runtime)" = '929db8209957c3ad8c742360ebf15fdb3605071f'
          curl -fsSL --proto '=https' --tlsv1.2 "$live_base/installers/p07-toolbox.sh" -o /tmp/p07-release85-toolbox
          test "$(git hash-object /tmp/p07-release85-toolbox)" = '5fb5af4d5c19b123a7791194727ccf6e6167b6c5'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release85"' /tmp/p07-release85-toolbox
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc54"' /tmp/p07-release85-toolbox
          echo 'P07_RELEASE85_PUBLIC_DISTRIBUTION_REMOTE_READBACK=PASS'
