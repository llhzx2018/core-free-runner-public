name: P01 Owner media ZIP export to real Laravel importer
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  owner-media-export:
    if: github.head_ref == 'test/p01-owner-legacy-archive-export-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify public-safe synthetic-only scope
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_OWNER_MEDIA_EXPORT_SCOPE=SYNTHETIC_ONLY
      - name: Check out exact P01 code using ephemeral read-only credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4d7e7b7f13db2cf462f8efb7dd0c6f4081b6658b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Source identity and Python compile
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 4d7e7b7f13db2cf462f8efb7dd0c6f4081b6658b
          test "$(cat candidate/VERSION)" = 2.47.517
          python3 -m py_compile candidate/scripts/build_p01_legacy_owner_media_archive.py candidate/tests/architecture/test_p01_owner_media_export.py
          echo P01_LEGACY_EXPORT_EXACT_SOURCE_PYTHON=PASS
      - name: Native PHP SQLite and ZIP importer dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip >/dev/null
          php -r 'if (!extension_loaded("pdo_sqlite") || !class_exists("ZipArchive")) exit(1);'
          php -l candidate/src/app/next/runtime/OwnerLegacyMediaArchive.php
          echo P01_MEDIA_EXPORT_NATIVE_SQLITE_ZIP=PASS
      - name: Actual old media exporter to true Laravel importer with negative tests
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/architecture/test_p01_owner_media_export.py
          echo P01_OLD_PRIVATE_MEDIA_COMPLETE_EXPORT_TO_NEW_LARAVEL=PASS
      - name: Remove transient private checkout, no artifacts
        if: always()
        run: |
          rm -rf -- candidate
          echo P01_MEDIA_EXPORT_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_MEDIA_EXPORT_PUBLIC_ARTIFACTS=NONE
