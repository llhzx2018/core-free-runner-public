name: P08 R105 exact v0.1.2 offline same-release activation regression (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r105-v012-same-release-once.yml
permissions:
  contents: read
jobs:
  same-release-php:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_R105_DISPOSABLE: YES
    steps:
      - name: Public workflow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P08 R105 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9a04137614d951742e51323b551d40312e27a50d
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, fileinfo, posix
      - name: Bound R105, R28, R29, R104 regression and syntax tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "9a04137614d951742e51323b551d40312e27a50d"
          test "$(cat VERSION)" = "0.1.2"
          for f in src/Upgrade/FlatLayoutBridgePrepare.php src/Upgrade/FlatLayoutBridgeActivation.php tests/compatibility/r105_same_release_activation.php tests/test_flat_layout_bridge_prepare.php tests/test_flat_layout_bridge_activation.php; do
            if ! php -l "$f" > "$RUNNER_TEMP/p08-r105-lint.log" 2>&1; then
              echo "P08_R105_SYNTAX=FAIL"; exit 1
            fi
          done
          echo "P08_R105_PHP84_SYNTAX=PASS"
          for f in tests/test_flat_layout_bridge_prepare.php tests/test_flat_layout_bridge_activation.php tests/compatibility/r104_large_full_readiness.php tests/compatibility/r105_same_release_activation.php; do
            if ! php "$f" > "$RUNNER_TEMP/p08-r105-tests.log" 2>&1; then
              echo "P08_R105_ISOLATED_TEST_FAILED=$(basename "$f")"
              tail -n 12 "$RUNNER_TEMP/p08-r105-tests.log" | sed -E 's@[A-Za-z0-9_+/-]{32,}@REDACTED@g' || true
              exit 1
            fi
            echo "P08_R105_SUITE_$(basename "$f")=PASS"
          done
          echo "P08_R105_LEGACY_AND_SAME_RELEASE_FAULT_MATRIX=PASS"
      - name: Remove private source and transient proof files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r105-*.log
          echo "P08_R105_CLEANUP=COMPLETE"

  genuine-v012-full:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_R105_DISPOSABLE: YES
      P08_R105_REAL_FULL_ISOLATED: YES
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout pinned private R105 code, no persisted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9a04137614d951742e51323b551d40312e27a50d
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 and archive utilities
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, fileinfo, posix
      - name: Real official GitHub Release FULL verified bytes then isolated same-version transition
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "9a04137614d951742e51323b551d40312e27a50d"
          php -l p08-private/tests/compatibility/r105_official_full_same_release.php >/dev/null
          test "${P08_PRIVATE_READ_TOKEN:-}" != ""
          p="$RUNNER_TEMP/p08-r105-real-full-$(date +%s)-$$"
          export P08_R105_SITE_DIR="$p"
          mkdir -m 0700 "$p"
          curl --fail --location --silent --show-error --max-time 95 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/p08-r105-official-full.zip"
          test "$(wc -c < "$RUNNER_TEMP/p08-r105-official-full.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-r105-official-full.zip" | sha256sum -c - >/dev/null
          echo "R105_GITHUB_OFFICIAL_012_FULL_EXACT_SHA256=PASS"
          unzip -q "$RUNNER_TEMP/p08-r105-official-full.zip" -d "$p"
          test -f "$p/FULL_MANIFEST.json"
          manifest_digest=$(sha256sum "$p/FULL_MANIFEST.json")
          manifest_digest=${manifest_digest%% *}
          test "${#manifest_digest}" = 64
          echo "R105_OFFICIAL_MANIFEST_SHA256=$manifest_digest"
          test "$(cat "$p/VERSION")" = "0.1.2"
          export GITHUB_ACTIONS=true
          if ! php p08-private/tests/compatibility/r105_official_full_same_release.php > "$RUNNER_TEMP/p08-r105-official-test.log" 2>&1; then
            echo "R105_GENUINE_FULL_TEST=FAIL"
            tail -n 8 "$RUNNER_TEMP/p08-r105-official-test.log" | sed -E 's@/[^ ]{12,}@/[REDACTED]@g' || true
            exit 1
          fi
          for required in R105_PUBLISHED_012_GENUINE_FULL_MEMBER_HASHES=PASS R105_PUBLISHED_012_GENUINE_FULL_IMMUTABLE_COPY=PASS R105_GENUINE_FULL_OFFLINE_REFUSAL=PASS R105_PUBLISHED_012_SAME_VERSION_ACTIVATION_SYNTHETIC_QUIESCENCE=PASS; do
            grep -Fxq "$required" "$RUNNER_TEMP/p08-r105-official-test.log"
          done
          echo "R105_REAL_PUBLISHED_FULL_STAGING_AND_ACTIVATION=PASS"
      - name: Remove official private FULL, all staged code, session data and test logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -rf -- "$RUNNER_TEMP"/p08-r105-real-full-*
          rm -f -- "$RUNNER_TEMP"/p08-r105-official-full.zip "$RUNNER_TEMP"/p08-r105-official-test.log
          echo "R105_PUBLISHED_FULL_DISPOSABLE_CLEANUP=COMPLETE"

  r105-onefile-build:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout exact bounded private R105 development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9a04137614d951742e51323b551d40312e27a50d
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 for offline helper validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip, mbstring, posix, sqlite3, pdo_mysql
      - name: Build deterministic single-script and test safe refusal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "9a04137614d951742e51323b551d40312e27a50d"
          for name in src/Upgrade/FlatLayoutBridgePrepare.php src/Upgrade/FlatLayoutBridgeActivation.php src/Upgrade/R102CloudPanelOfflineGuard.php src/Upgrade/r105-offline-bootstrap-cli.php; do
            if ! php -l "$name" > "$RUNNER_TEMP/p08-r105-build-lint.log" 2>&1; then
              echo R105_PHP_BUNDLE_SYNTAX=FAIL; exit 1
            fi
          done
          echo R105_PHP_BUNDLE_SYNTAX=PASS
          if ! python3 scripts/build_r105_onefile.py --output-dir "$RUNNER_TEMP" > "$RUNNER_TEMP/p08-r105-build.out" 2>&1; then
            echo R105_SELF_CONTAINED_BUILD=FAIL; exit 1
          fi
          test -s "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh"
          bash -n "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh"
          if bash "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" --activate --ack-global-service-outage /tmp/not-owner-site testsiteuser 8.4 > /dev/null 2>&1; then
            echo R105_NON_ROOT_EXECUTION_REFUSAL=FAIL; exit 1
          fi
          if sudo bash "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" --activate --wrong-ack /tmp/not-owner-site testsiteuser 8.4 > /dev/null 2>&1; then
            echo R105_EXPLICIT_GLOBAL_OUTAGE_CONFIRMATION=FAIL; exit 1
          fi
          echo R105_ONEFILE_BUILD_PHP_AND_GATES=PASS
          grep '^R105_ONEFILE_SHA256=' "$RUNNER_TEMP/p08-r105-build.out"
      - name: Never persist one-file candidate or private source
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" "$RUNNER_TEMP/p08-r105-build.out" "$RUNNER_TEMP/p08-r105-build-lint.log"
          echo R105_ONEFILE_RUNNER_CLEANUP=COMPLETE

  r105-real-cloudpanel-systemd-sqlite:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P08 private R105 source (temporary)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9a04137614d951742e51323b551d40312e27a50d
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install real disposable systemd nginx cron PHP8.4 FPM and native SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq > "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo apt-get update -qq >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-zip php8.4-curl php8.4-mbstring php8.4-xml php8.4-bcmath >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          /usr/bin/php8.4 -r 'exit(extension_loaded("sqlite3") && extension_loaded("posix") ? 0 : 1);'
          echo R105_REAL_SYSTEMD_COMPONENTS=PASS
      - name: Real official 0.1.2 FULL, isolated Owner and CloudPanel host setup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "9a04137614d951742e51323b551d40312e27a50d"
          test "${P08_PRIVATE_READ_TOKEN:-}" != ""
          site=/home/kewaro-adops/htdocs/adops.kewaro.com
          sudo useradd -m -s /bin/bash kewaro-adops
          sudo mkdir -p "$site" "$site/storage/app/private/adops/installation" "$site/storage/app/private/adops/maintenance"
          curl --fail --location --silent --show-error --max-time 100 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/r105-official-full.zip"
          test "$(wc -c < "$RUNNER_TEMP/r105-official-full.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r105-official-full.zip" | sha256sum -c --status
          sudo unzip -q "$RUNNER_TEMP/r105-official-full.zip" -d "$site"
          test "$(sudo cat "$site/VERSION")" = 0.1.2
          echo "fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233  $site/FULL_MANIFEST.json" | sudo sha256sum -c --status
          db="$site/database/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite"
          sudo /usr/bin/php8.4 -r '$db=new SQLite3($argv[1]); $db->exec("CREATE TABLE proof_items (id INTEGER PRIMARY KEY, owner_value TEXT NOT NULL)"); $db->exec("INSERT INTO proof_items VALUES (1, \"owner-kept\")"); $db->close();' "$db"
          sudo tee "$site/.env" > /dev/null <<EOF
          APP_NAME="VF AdOps Test"
          APP_ENV="production"
          APP_KEY="base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          APP_DEBUG="false"
          APP_URL="http://127.0.0.1:18927"
          DB_CONNECTION="sqlite"
          DB_DATABASE="$db"
          DB_FOREIGN_KEYS="true"
          SESSION_DRIVER="database"
          SESSION_ENCRYPT="true"
          CACHE_STORE="database"
          QUEUE_CONNECTION="sync"
          EOF
          sudo tee "$site/storage/app/private/adops/installation/installed.json" > /dev/null <<'EOF'
          {"project_id":"P08","status":"INSTALLED","database_driver":"sqlite"}
          EOF
          sudo touch "$site/storage/app/private/adops/maintenance/write-gate.lock"
          sudo mkdir -p "$site/storage/app/private/adops/landings"
          echo "owner-sensitive-synthetic-media" | sudo tee "$site/storage/app/private/adops/landings/owner-test.txt" > /dev/null
          sudo tee /etc/php/8.4/fpm/pool.d/kewaro-adops.conf > /dev/null <<'EOF'
          [kewaro-adops]
          user = kewaro-adops
          group = kewaro-adops
          listen = /run/php/kewaro-adops-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = dynamic
          pm.max_children = 3
          pm.start_servers = 1
          pm.min_spare_servers = 1
          pm.max_spare_servers = 2
          EOF
          sudo tee /etc/nginx/sites-enabled/adops.kewaro.com.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18927;
            server_name adops.kewaro.com;
            root /home/kewaro-adops/htdocs/adops.kewaro.com/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/kewaro-adops-fpm.sock;
            }
          }
          EOF
          sudo chown -R kewaro-adops:kewaro-adops /home/kewaro-adops
          sudo chmod 0755 /home/kewaro-adops /home/kewaro-adops/htdocs "$site"
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          echo R105_REAL_OFFICIAL_FULL_SITE_UID_AND_SERVICES=PASS
      - name: Build one-file, confirm outage rejection, real native backup and systemd Atomic activation
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site=/home/kewaro-adops/htdocs/adops.kewaro.com
          python3 p08-private/scripts/build_r105_onefile.py --output-dir "$RUNNER_TEMP" > "$RUNNER_TEMP/r105-built.log"
          script="$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh"
          test -s "$script"
          beforePid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          oldEnv="$(sudo sha256sum "$site/.env" | awk '{print $1}')"
          oldMedia="$(sudo sha256sum "$site/storage/app/private/adops/landings/owner-test.txt" | awk '{print $1}')"
          if sudo bash "$script" --activate --wrong-ack "$site" kewaro-adops 8.4 > /dev/null 2>&1; then
            echo R105_GLOBAL_OUTAGE_CONSENT=FAIL; exit 1
          fi
          test "$(sudo systemctl is-active nginx)" = active
          test ! -e "$site/releases"
          echo R105_REAL_SYSTEMD_NEGATIVE_NO_CONSENT=PASS
          if sudo bash "$script" --activate --ack-global-service-outage "$site" kewaro-adops 8.4 > "$RUNNER_TEMP/r105-systemd-apply.log" 2>&1; then
            echo R105_REAL_SYSTEMD_SCRIPT_PROCESS_EXIT=PASS
          else
            grep '^R105_' "$RUNNER_TEMP/r105-systemd-apply.log" | tail -n 15 || true
            echo R105_REAL_SYSTEMD_APPLY=FAIL
            exit 1
          fi
          echo R105_REAL_SYSTEMD_OBSERVED_CODES_BEGIN
          grep '^R105_' "$RUNNER_TEMP/r105-systemd-apply.log" | tail -n 15 || true
          echo R105_REAL_SYSTEMD_OBSERVED_CODES_END
          test "$(sudo readlink "$site/current")" = releases/7f7218abfa13ba232d1afd13f10df29da29dd21a
          echo R105_POST_COMMIT_ACTIVE_POINTER=PASS
          grep -Fxq 'R105_CLOUDPANEL=OFFICIAL_012_SAME_VERSION_COMMITTED' "$RUNNER_TEMP/r105-systemd-apply.log"
          grep -Fxq 'R105_CLOUDPANEL=SERVICES_RESTARTED_WITH_NEW_FPM' "$RUNNER_TEMP/r105-systemd-apply.log"
          test "$(sudo sha256sum "$site/.env" | awk '{print $1}')" = "$oldEnv"
          test "$(sudo sha256sum "$site/storage/app/private/adops/landings/owner-test.txt" | awk '{print $1}')" = "$oldMedia"
          test "$(sudo /usr/bin/php8.4 -r '$db=new SQLite3($argv[1],SQLITE3_OPEN_READONLY); echo $db->querySingle("SELECT owner_value FROM proof_items WHERE id=1");' "$site/database/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite")" = owner-kept
          test -f "$site/storage/app/private/adops/r105-bootstrap/native-backup.json"
          test ! -e "$site/storage/app/private/adops/maintenance/maintenance.json"
          afterPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$beforePid" != "$afterPid"
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          echo R105_REAL_SYSTEMD_OFFLINE_NATIVE_SQLITE_BACKUP_ATOMIC_FPM_RESTART=PASS
          echo R105_REAL_DB_OWNER_MEDIA_CONFIG_PRESERVED=PASS
      - name: Destroy disposable private official FULL, native snapshots and temporary site
        if: always()
        shell: bash
        run: |
          set +e
          sudo systemctl stop nginx cron php8.4-fpm 2>/dev/null || true
          sudo rm -f /etc/nginx/sites-enabled/adops.kewaro.com.conf /etc/php/8.4/fpm/pool.d/kewaro-adops.conf
          sudo pkill -u kewaro-adops 2>/dev/null || true
          sudo userdel -r kewaro-adops 2>/dev/null || true
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" "$RUNNER_TEMP/r105-official-full.zip" "$RUNNER_TEMP/r105-systemd-apply.log" "$RUNNER_TEMP/r105-built.log" "$RUNNER_TEMP/r105-systemd-apt.log"
          echo R105_REAL_SYSTEMD_PRIVATE_SOURCE_AND_NATIVE_BACKUPS_CLEANED=YES
