name: P08 R105 exact v0.1.2 offline same-release activation regression (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r105-v012-same-release-once.yml
permissions:
  contents: read
jobs:
  same-release-php:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Public workflow checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact P08 R105 private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: fb060b5a10c5de7ec40942e5ce84e3d7beb8442e
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, fileinfo, posix
      - name: Bound R105, R28, R29, R104 regression and syntax tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "fb060b5a10c5de7ec40942e5ce84e3d7beb8442e"
          test "$(cat VERSION)" = "0.1.2"
          for f in src/Upgrade/FlatLayoutBridgePrepare.php src/Upgrade/FlatLayoutBridgeActivation.php tests/compatibility/r105_same_release_activation.php tests/test_flat_layout_bridge_prepare.php tests/test_flat_layout_bridge_activation.php; do
            if ! php -l "$f" > "$RUNNER_TEMP/p08-r105-lint.log" 2>&1; then
              echo "P08_R105_SYNTAX=FAIL"; exit 1
            fi
          done
          echo "P08_R105_PHP84_SYNTAX=PASS"
          for f in tests/test_flat_layout_bridge_prepare.php tests/test_flat_layout_bridge_activation.php tests/compatibility/r104_large_full_readiness.php tests/compatibility/r105_same_release_activation.php; do
            if ! php "$f" > "$RUNNER_TEMP/p08-r105-tests.log" 2>&1; then
              echo "P08_R105_ISOLATED_TEST_FAILED=$(basename "$f")"
              tail -n 12 "$RUNNER_TEMP/p08-r105-tests.log" | sed -E 's@[A-Za-z0-9_+/-]{32,}@REDACTED@g' || true
              exit 1
            fi
            echo "P08_R105_SUITE_$(basename "$f")=PASS"
          done
          echo "P08_R105_LEGACY_AND_SAME_RELEASE_FAULT_MATRIX=PASS"
      - name: Remove private source and transient proof files
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP"/p08-r105-*.log
          echo "P08_R105_CLEANUP=COMPLETE"
