name: TEMP P01 project layout exact-source Chromium proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-project-layout-closure.yml'
      - '.github/ephemeral/p01-project-layout-closure.json'

permissions:
  contents: read

env:
  TARGET_REPO: llhzx2018/vf-start
  TARGET_VERSION: 2.47.479
  TARGET_SHA: d7539e1c68a25425e3989c74f71f87455d4cb3fa
  TARGET_TREE: 208cb96724f782c5d65514d94baf4819715531d6

jobs:
  layout:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout isolated public proof workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify rendered target identity before fetching private source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered \
            --spec .github/ephemeral/p01-project-layout-closure.json \
            --input .github/workflows/temp-p01-project-layout-closure.yml
          echo P01_LAYOUT_IDENTITY_AUDIT=PASS

      - name: Fetch exact private P01 candidate without persisting source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q --depth 1 origin "$TARGET_SHA"
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C product rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < product/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = "$TARGET_VERSION"
          echo P01_LAYOUT_EXACT_SOURCE=PASS

      - name: Focused interaction and real Chromium geometry regression
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node --check product/tests/unit/project_visual_geometry_browser_contract.cjs
          node --check product/tests/unit/project_dual_layout_contract.cjs
          node --check product/tests/unit/project_visual_alignment_closure_contract.cjs
          node product/tests/unit/project_dual_layout_contract.cjs
          node product/tests/unit/project_visual_alignment_closure_contract.cjs
          (
            cd product
            node tests/unit/project_visual_geometry_browser_contract.cjs
          ) | tee /tmp/p01-layout-browser.txt
          for marker in \
            P01_PROJECT_GEOMETRY_1440_CARD=PASS \
            P01_PROJECT_GEOMETRY_900_CARD=PASS \
            P01_PROJECT_GEOMETRY_600_CARD=PASS \
            P01_PROJECT_GEOMETRY_1440_LIST=PASS \
            P01_PROJECT_GEOMETRY_1280_LIST=PASS \
            P01_PROJECT_VISUAL_BROWSER=PASS; do
            grep -Fx "$marker" /tmp/p01-layout-browser.txt
          done
          echo P01_LAYOUT_FOCUSED_GEOMETRY=PASS

      - name: Clean up private checkout
        if: always()
        shell: bash
        run: |
          if [ -d product ]; then
            find product -type f -delete
            find product -depth -type d -empty -delete
          fi
          echo P01_LAYOUT_PRIVATE_SOURCE_CLEANUP=PASS
