name: P02 R51 V255 Ownership Retirement

on:
  push:
    branches:
      - run/p02-r51-v255-ownership

permissions:
  contents: read

jobs:
  converge:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: 2b362241897aae0573986d529c876488651a7695
      EXPECTED_VERSION: 2.5.32
      PORT: '18080'
      POST_PORT: '18081'
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Retire mixed v255 hotfix ownership shell
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          hotfix=Path('public/assets/v255-hotfix.js')
          text=hotfix.read_text(encoding='utf-8')
          marker="\n\n(function () {\n  const SCRATCH_ID = 'scratchWorkspaceV259';"
          if marker not in text:
              raise SystemExit('v255 split marker missing')
          prefix, scratch_tail=text.split(marker,1)
          prefix=prefix.removeprefix("'use strict';\n\n").rstrip()+"\n"
          scratch="(function () {\n  const SCRATCH_ID = 'scratchWorkspaceV259';"+scratch_tail

          editor=Path('public/assets/editor-enhancements.js')
          editor.write_text(editor.read_text(encoding='utf-8').rstrip()+"\n\n/* P02 V2.5.32 R51 · Editor viewport/caret guard domain ownership */\n"+prefix,encoding='utf-8')
          scratch_file=Path('public/assets/scratch-tabs.js')
          scratch_file.write_text(scratch_file.read_text(encoding='utf-8').rstrip()+"\n\n/* P02 V2.5.32 R51 · Scratch exit/navigation continuity domain ownership */\n"+scratch.rstrip()+"\n",encoding='utf-8')

          index=Path('public/index.php')
          index.write_text('\n'.join(line for line in index.read_text(encoding='utf-8').splitlines() if '/assets/v255-hotfix.js' not in line)+'\n',encoding='utf-8')
          hotfix.unlink()

          authority=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          data=json.loads(authority.read_text(encoding='utf-8'))
          data['runtime_source_file_count']=67
          conv=data.setdefault('convergence',{})
          conv['v255_hotfix_wrapper_retired']=True
          conv['editor_input_viewport_guard_domain_owned']=True
          conv['scratch_exit_navigation_domain_owned']=True
          data['next_gate']='POST_V255_HOTFIX_OWNERSHIP_REVIEW'
          authority.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          count_contracts=[]
          patterns=[
            (r'(runtime_source_file_count\s*!==\s*)68',r'\g<1>67'),
            (r'(runtime_source_file_count\s*===\s*)68',r'\g<1>67'),
            (r'(runtime_source_file_count\s*,\s*)68',r'\g<1>67'),
          ]
          for p in sorted(Path('tests/unit').glob('p02_*.mjs')):
              old=p.read_text(encoding='utf-8'); new=old
              for pattern,repl in patterns:new=re.sub(pattern,repl,new)
              if new!=old:
                  p.write_text(new,encoding='utf-8');count_contracts.append(str(p))
          if 'tests/unit/p02_candidate_version_identity_contract.mjs' not in count_contracts or 'tests/unit/p02_css_convergence_contract.mjs' not in count_contracts:
              raise SystemExit('expected source-count contracts were not both rebound')
          print('R51_COUNT_CONTRACTS='+','.join(count_contracts))

          Path('docs/evidence/P02_V255_HOTFIX_OWNERSHIP_RETIREMENT_20260831.md').write_text('''# P02 V255 Hotfix Ownership Retirement · 2026-08-31\n\n## Current truth\n\n`v255-hotfix.js` mixed two unrelated compatibility patches: editor viewport/caret continuity and Scratch workspace exit/navigation continuity. Both behaviors remain required, but neither needs a standalone historical hotfix owner.\n\n## Native domain ownership\n\n- Editor viewport/caret guard is owned by `editor-enhancements.js`.\n- Scratch exit/navigation continuity is owned by `scratch-tabs.js`.\n- `v255-hotfix.js` is removed from source, runtime loading, and manifest identity.\n- Runtime source identity moves from 68 to 67 files.\n- P02 candidate/convergence contracts that bind the exact runtime source count are rebound to 67; no behavioral contract is weakened.\n\n## Boundary\n\nNo schema, external API, main, tag, release, update-channel, or production change.\n''',encoding='utf-8')

          Path('tests/unit/p02_v255_hotfix_ownership_retirement.mjs').write_text('''import fs from 'node:fs';\nimport assert from 'node:assert/strict';\nconst read=p=>fs.readFileSync(new URL('../../'+p,import.meta.url),'utf8');\nassert.equal(fs.existsSync(new URL('../../public/assets/v255-hotfix.js',import.meta.url)),false);\nconst index=read('public/index.php');assert.equal(index.includes('v255-hotfix.js'),false);\nconst editor=read('public/assets/editor-enhancements.js');assert(editor.includes('scheduleViewportGuard'));assert(editor.includes("const TARGET_SELECTOR = '.content-editor, #articleSource'"));\nconst scratch=read('public/assets/scratch-tabs.js');assert(scratch.includes('leaveScratchThenActivate'));assert(scratch.includes("const SCRATCH_ID = 'scratchWorkspaceV259'"));\nconst manifest=JSON.parse(read('SOURCE_MANIFEST.json'));assert.equal(manifest.runtime_source_file_count,67);assert.equal(manifest.entries.some(x=>x.repo_path==='public/assets/v255-hotfix.js'),false);\nconst candidate=JSON.parse(read('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json'));assert.equal(candidate.runtime_source_file_count,67);\nfor(const key of ['v255_hotfix_wrapper_retired','editor_input_viewport_guard_domain_owned','scratch_exit_navigation_domain_owned'])assert.equal(candidate.convergence[key],true,key);\nfor(const p of ['tests/unit/p02_candidate_version_identity_contract.mjs','tests/unit/p02_css_convergence_contract.mjs']){const t=read(p);assert.equal(/runtime_source_file_count\\s*(?:!==|===|,)\\s*68/.test(t),false,p);}\nconsole.log('P02_V255_HOTFIX_OWNERSHIP_RETIREMENT=PASS');\n''',encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          echo P02_R51_TRANSFORM=PASS

      - name: Full contracts and repository gates
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF"
          node --check public/assets/editor-enhancements.js
          node --check public/assets/scratch-tabs.js
          node --check public/assets/app.js
          bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t"; done
          test ! -e public/assets/v255-hotfix.js
          ! grep -F 'v255-hotfix.js' public/index.php
          ! grep -RE 'runtime_source_file_count[[:space:]]*(!==|===|,)[[:space:]]*68' tests/unit/p02_*.mjs
          git diff --check
          echo P02_R51_STATIC_GATES=PASS

      - name: Source Manifest regenerate identity
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r51-manifest.json"
          cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r51-manifest.txt"
          python3 scripts/generate-source-manifest.py
          cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r51-manifest.json"
          cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r51-manifest.txt"
          python3 scripts/verify-source-manifest.py
          echo P02_R51_MANIFEST_REGEN_IDENTITY=PASS

      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Build and boot prewrite site
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r51";SITE="$RUN_ROOT/site";mkdir -p "$RUN_ROOT"
          bash scripts/build-deploy-tree.sh "$SITE";test ! -e "$SITE/assets/v255-hotfix.js"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 & echo $! > "$RUN_ROOT/php.pid"
          BASE_URL="http://127.0.0.1:$PORT";for _ in $(seq 1 80); do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1 && break;sleep .25;done
          PASSWORD="VF-R51-${GITHUB_RUN_ID}!";printf '%s' "$PASSWORD" > "$RUN_ROOT/password";curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m:raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")";test "$STATUS" = '303'
          echo P02_R51_SITE_READY=PASS

      - name: Standard Chromium regression
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r51"
          VF_UX_E2E_BASE_URL="http://127.0.0.1:$PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs
          echo P02_R51_STANDARD_CHROMIUM=PASS

      - name: V255 ownership specialized Chromium
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r51-v255-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1280,height:820}});const base=process.env.BASE_URL,password=process.env.PASSWORD;const assert=(v,m)=>{if(!v)throw new Error(m);};
          await page.goto(base+'/',{waitUntil:'networkidle'});if(await page.locator('[data-open-login]').count()){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));}
          await page.waitForFunction(()=>typeof openEditor==='function'&&typeof loadList==='function');const resources=await page.evaluate(()=>({scripts:[...document.scripts].map(x=>x.src),resources:performance.getEntriesByType('resource').map(x=>x.name)}));assert(!resources.scripts.some(x=>x.includes('v255-hotfix.js')),'v255 script tag remains');assert(!resources.resources.some(x=>x.includes('v255-hotfix.js')),'v255 requested');
          await page.evaluate(async()=>{await openEditor(null,{initialTitle:'R51 Editor Guard',initialContent:'line one\nline two',origin:{mode:'all',status:'active',categoryId:0,query:'',sort:'auto',page:1,scrollTop:0,contentView:'list'}});});await page.waitForSelector('#contentForm .content-editor');
          const guard=await page.evaluate(async()=>{const ta=document.querySelector('#contentForm .content-editor');const root=ta.closest('#notebookDetailScroll')||document.querySelector('#main');const spacer=document.createElement('div');spacer.style.height='1800px';root.appendChild(spacer);root.style.overflow='auto';root.style.maxHeight='420px';ta.value=('abcdefghij\n').repeat(80);ta.style.height='220px';ta.style.overflow='auto';ta.focus({preventScroll:true});root.scrollTop=0;ta.scrollTop=0;ta.setSelectionRange(7,7);ta.dispatchEvent(new Event('input',{bubbles:true}));root.scrollTop=Math.min(260,Math.max(0,root.scrollHeight-root.clientHeight));ta.scrollTop=120;ta.setSelectionRange(0,0);await new Promise(r=>setTimeout(r,120));return{rootTop:root.scrollTop,start:ta.selectionStart,end:ta.selectionEnd,textareaTop:ta.scrollTop};});console.log('R51_EDITOR_GUARD='+JSON.stringify(guard));assert(guard.rootTop<=48,'editor root viewport guard not active');assert(guard.start===7&&guard.end===7,'editor caret guard not active');assert(guard.textareaTop<=48,'editor textarea scroll guard not active');
          await page.evaluate(async()=>{state.mode='all';state.status='active';state.categoryId=0;await loadList({scrollTop:0});});await page.waitForSelector('#scratchLaunchV259',{timeout:10000});await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await page.locator('#settingsBtn').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));await page.waitForSelector('#settingsPanel',{timeout:10000});console.log('P02_R51_V255_SPECIALIZED_BROWSER=PASS');await browser.close();
          JS
          RUN_ROOT="$RUNNER_TEMP/p02-r51";BASE_URL="http://127.0.0.1:$PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r51-v255-proof.mjs;rm r51-v255-proof.mjs

      - name: Final verification before develop write
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_REF";bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs; do node "$t" >/dev/null;done
          git diff --check;echo P02_R51_PREWRITE_VERIFY=PASS

      - name: Commit and push develop only
        id: write
        working-directory: product
        shell: bash
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge';git config user.email 'llhzx2018@gmail.com';git add -A;git commit -m 'refactor(P02): retire v255 mixed hotfix ownership';NEW_SHA="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/llhzx2018/vf-library.git";git fetch origin develop --depth=1;test "$(git rev-parse origin/develop)" = "$BASE_REF";git push origin HEAD:refs/heads/develop;git remote set-url origin 'https://github.com/llhzx2018/vf-library.git'
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT";echo "P02_R51_NEW_SHA=$NEW_SHA";echo P02_R51_DEVELOP_WRITE=PASS

      - name: Stop prewrite site
        if: always()
        shell: bash
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r51";if test -f "$RUN_ROOT/php.pid";then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null||true;fi

      - name: Checkout exact post-write SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ steps.write.outputs.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: post

      - name: Exact-SHA readonly static closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.write.outputs.sha }}";test "$(tr -d '\r\n' < VERSION)" = "$EXPECTED_VERSION"
          cp SOURCE_MANIFEST.json "$RUNNER_TEMP/r51-post-manifest.json";cp SOURCE_MANIFEST.txt "$RUNNER_TEMP/r51-post-manifest.txt";bash scripts/verify-repository.sh
          for t in tests/unit/p02_*.mjs tests/unit/v2523_unified_content_workspace_contract.mjs;do node "$t";done
          python3 scripts/generate-source-manifest.py;cmp -s SOURCE_MANIFEST.json "$RUNNER_TEMP/r51-post-manifest.json";cmp -s SOURCE_MANIFEST.txt "$RUNNER_TEMP/r51-post-manifest.txt";python3 scripts/verify-source-manifest.py
          test ! -e public/assets/v255-hotfix.js;! grep -F 'v255-hotfix.js' public/index.php;git diff --exit-code;echo P02_R51_EXACT_SHA_STATIC_CLOSURE=PASS

      - name: Build and boot exact post-write site
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          RUN_ROOT="$RUNNER_TEMP/p02-r51-post";SITE="$RUN_ROOT/site";mkdir -p "$RUN_ROOT";bash scripts/build-deploy-tree.sh "$SITE";test ! -e "$SITE/assets/v255-hotfix.js"
          php -d display_errors=0 -S "127.0.0.1:$POST_PORT" -t "$SITE" >"$RUN_ROOT/php.log" 2>&1 & echo $! > "$RUN_ROOT/php.pid";BASE_URL="http://127.0.0.1:$POST_PORT";for _ in $(seq 1 80);do curl -fsS "$BASE_URL/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          PASSWORD="VF-R51-POST-${GITHUB_RUN_ID}!";printf '%s' "$PASSWORD" > "$RUN_ROOT/password";curl -fsS -c "$RUN_ROOT/cookie" "$BASE_URL/setup.php" > "$RUN_ROOT/setup.html"
          SETUP_CSRF="$(python3 - "$RUN_ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          if not m:raise SystemExit('setup csrf missing')
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$RUN_ROOT/setup-post.html" -w '%{http_code}' -b "$RUN_ROOT/cookie" -c "$RUN_ROOT/cookie" -H "Origin: $BASE_URL" --data-urlencode "setup_csrf=$SETUP_CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE_URL/setup.php")";test "$STATUS" = '303';echo P02_R51_POST_SITE_READY=PASS

      - name: Exact-SHA standard Chromium closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_ROOT="$RUNNER_TEMP/p02-r51-post";VF_UX_E2E_BASE_URL="http://127.0.0.1:$POST_PORT" VF_UX_E2E_PASSWORD="$(cat "$RUN_ROOT/password")" VF_UX_E2E_VERSION="$EXPECTED_VERSION" node tests/e2e/p02_ux_task_flow.mjs;echo P02_R51_EXACT_SHA_STANDARD_CHROMIUM=PASS

      - name: Exact-SHA V255 specialized Chromium closure
        working-directory: post
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > r51-v255-proof.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1280,height:820}});const base=process.env.BASE_URL,password=process.env.PASSWORD;const assert=(v,m)=>{if(!v)throw new Error(m);};await page.goto(base+'/',{waitUntil:'networkidle'});if(await page.locator('[data-open-login]').count()){await page.locator('[data-open-login]').click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();await page.waitForFunction(async()=>Boolean((await(await fetch('/api.php?action=session')).json())?.site?.auth));}await page.waitForFunction(()=>typeof openEditor==='function'&&typeof loadList==='function');
          const r=await page.evaluate(()=>({scripts:[...document.scripts].map(x=>x.src),resources:performance.getEntriesByType('resource').map(x=>x.name)}));assert(!r.scripts.some(x=>x.includes('v255-hotfix.js')),'v255 script tag remains');assert(!r.resources.some(x=>x.includes('v255-hotfix.js')),'v255 requested');await page.evaluate(async()=>{await openEditor(null,{initialTitle:'R51 Post Guard',initialContent:'line one\nline two',origin:{mode:'all',status:'active',categoryId:0,query:'',sort:'auto',page:1,scrollTop:0,contentView:'list'}});});await page.waitForSelector('#contentForm .content-editor');
          const guard=await page.evaluate(async()=>{const ta=document.querySelector('#contentForm .content-editor');const root=ta.closest('#notebookDetailScroll')||document.querySelector('#main');const spacer=document.createElement('div');spacer.style.height='1800px';root.appendChild(spacer);root.style.overflow='auto';root.style.maxHeight='420px';ta.value=('abcdefghij\n').repeat(80);ta.style.height='220px';ta.style.overflow='auto';ta.focus({preventScroll:true});root.scrollTop=0;ta.scrollTop=0;ta.setSelectionRange(7,7);ta.dispatchEvent(new Event('input',{bubbles:true}));root.scrollTop=Math.min(260,Math.max(0,root.scrollHeight-root.clientHeight));ta.scrollTop=120;ta.setSelectionRange(0,0);await new Promise(r=>setTimeout(r,120));return{rootTop:root.scrollTop,start:ta.selectionStart,end:ta.selectionEnd,textareaTop:ta.scrollTop};});assert(guard.rootTop<=48,'post editor root viewport guard missing');assert(guard.start===7&&guard.end===7,'post caret guard missing');assert(guard.textareaTop<=48,'post textarea guard missing');await page.evaluate(async()=>{state.mode='all';state.status='active';state.categoryId=0;await loadList({scrollTop:0});});await page.waitForSelector('#scratchLaunchV259',{timeout:10000});await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await page.locator('#settingsBtn').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259'));await page.waitForSelector('#settingsPanel',{timeout:10000});console.log('P02_R51_EXACT_SHA_V255_SPECIALIZED_BROWSER=PASS');await browser.close();
          JS
          RUN_ROOT="$RUNNER_TEMP/p02-r51-post";BASE_URL="http://127.0.0.1:$POST_PORT" PASSWORD="$(cat "$RUN_ROOT/password")" node r51-v255-proof.mjs;rm r51-v255-proof.mjs;git diff --exit-code;echo P02_R51_EXACT_SHA_READONLY_CLOSURE=PASS

      - name: Boundaries
        if: always()
        shell: bash
        run: |
          RUN_ROOT="$RUNNER_TEMP/p02-r51-post";if test -f "$RUN_ROOT/php.pid";then kill "$(cat "$RUN_ROOT/php.pid")" 2>/dev/null||true;fi
          echo PRIVATE_SOURCE_PERSISTED=NO;echo MAIN_WRITE=NO;echo RELEASE_WRITE=NO;echo TAG_WRITE=NO;echo UPDATE_CHANNEL_WRITE=NO;echo PRODUCTION_WRITE=NO
