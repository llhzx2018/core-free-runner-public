name: P01 D52 Owner Laravel SQLite catalog integration 20261113
on:
  push:
    branches:
      - test/p01-personal-catalog-ui-20261113-5b833
permissions:
  contents: read
jobs:
  exact-personal-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check one-off lane and registered private access
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-personal-catalog-ui-20261113-5b833"
          test -n "$PRIVATE_READ"
          echo "P01_SOURCE=TRANSIENT_PRIVATE_ONLY"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Checkout exact private P01 D52 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2793cbc4172daa723df372f52939b39a8909a8a5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact D52 source without a production bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "2793cbc4172daa723df372f52939b39a8909a8a5"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test -f candidate/tests/p01_d52_personal_catalog.php
          test -f candidate/src/app/next/composer.lock
          echo "P01_EXACT_SOURCE=2793cbc4172daa723df372f52939b39a8909a8a5"
      - name: Check PHP SQLite and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
          for f in candidate/tests/p01_d52_personal_catalog.php candidate/src/app/next/OwnerPersonalCatalog.php candidate/src/app/next/OwnerDataRuntime.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/src/app/next/http/OwnerHttpRoutes.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-php-lint.txt" 2>&1
          done
          echo "P01_PRIVATE_CATALOG_PHP_SYNTAX=PASS"
      - name: Install pinned Laravel runtime in disposable test checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next
          composer install --no-dev --no-interaction --no-scripts --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          echo "P01_LARAVEL_PINNED_DEPENDENCIES=PASS"
      - name: Execute real Laravel SQLite table and Owner guard tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d52_personal_catalog.php > "$RUNNER_TEMP/p01-d52-result.txt" 2>&1; then
            echo "P01_D52_LARAVEL_SQLITE_TEST=FAIL"
            exit 1
          fi
          grep '^P01_D52_.*=PASS$' "$RUNNER_TEMP/p01-d52-result.txt"
          echo "P01_D52_LARAVEL_SQLITE_TEST=PASS"
      - name: Always remove private candidate and temporary output
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_CODE_PERSISTED=NO"
          echo "P01_SOURCE_LOG_ARTIFACT_PERSISTED=NO"
