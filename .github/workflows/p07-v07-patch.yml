name: P07 OneShot v0.7 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v07-patch.yml
      - experiments/p07-v07-patch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.7 patch
        run: python3 experiments/p07-v07-patch.py
      - name: Validate v0.7
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F '0.7.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          ./experiments/p07-bench.sh --demo >/tmp/demo
          grep -F 'P07 Enhanced Bench' /tmp/demo
          grep -F 'Evidence Quality' /tmp/demo
          ! grep -F 'output="$(speed_node ' experiments/p07-bench.sh
          grep -F 'Speedtest backend preflight failed' experiments/p07-bench.sh
          grep -F 'RATE_LIMITED' experiments/p07-bench.sh
          grep -F 'BACKEND_UNAVAILABLE' experiments/p07-bench.sh
      - name: Commit v0.7 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add experiments/p07-bench.sh
          git commit -m 'fix(p07-bench): add backend preflight and fail-fast v0.7'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
