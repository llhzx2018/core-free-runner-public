name: P01 L2 Bookmark Import Onboarding
on:
  push:
    branches: [run/p01-bookmark-import-onboarding-20260902]
    paths: [.github/workflows/p01-l2-bookmark-import-onboarding-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-bookmark-import-onboarding-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-bookmark-import-onboarding-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 7de314fc5acd4e3a85bc9760799fede3cd1265ab
          test "$(git -C product rev-parse origin/develop)" = 7de314fc5acd4e3a85bc9760799fede3cd1265ab
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_bookmark_import_onboarding_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/transfer.php >/dev/null
          node --check src/assets/transfer.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text=Path('src/transfer.php').read_text()
          assert text.index('导入浏览器书签') < text.index('导出 / 迁移')
          assert '第一次使用 · 从这里开始' in text
          assert '浏览器书签 HTML（推荐）' in text
          assert '<summary>高级设置</summary>' in text
          assert '跳过已有网址（推荐）' in text
          assert '默认按私人导入' in text
          PY
          grep -F '打开我的导航' src/assets/transfer.js >/dev/null
          grep -F '继续整理网址' src/assets/transfer.js >/dev/null
          grep -F '.vf-transfer-steps' src/assets/admin-pages.css >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt VF_PROJECT.json database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/assets/admin-pages.css src/assets/transfer.js src/transfer.php | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'BOOKMARK IMPORT ONBOARDING PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/transfer.php src/assets/transfer.js src/assets/admin-pages.css
          git commit -m 'feat(P01): make bookmark import onboarding-first'
          git push origin HEAD:product/p01-bookmark-import-onboarding-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
