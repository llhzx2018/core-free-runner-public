name: P05 Common Baseline Gate

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - 'p05-common-baseline/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Checkout exact P05 maintenance source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          git clone --quiet --branch maintenance/common-baseline-v1.0.1 --single-branch "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/vf-seo.git" p05
          cd p05
          git rev-parse HEAD | tee ../p05-source-sha.txt
          test -z "$(git status --porcelain)"
      - name: Install
        working-directory: p05
        run: npm ci
      - name: Lint
        working-directory: p05
        run: npm run lint
      - name: Typecheck
        working-directory: p05
        run: npm run typecheck
      - name: Migrate and schema
        working-directory: p05
        run: npm run migrate && npm run verify:schema
      - name: Tests
        working-directory: p05
        run: npm run test
      - name: Build
        working-directory: p05
        run: npm run build
      - name: Source and scope gates
        working-directory: p05
        run: npm run source:gate && npm run scope:gate
      - name: Security gates
        working-directory: p05
        run: |
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
      - name: Publish marker
        if: always()
        run: |
          mkdir -p p05-common-baseline/results
          printf '{"source_sha":"%s","run_id":"%s","job_status":"%s"}\n' "$(cat p05-source-sha.txt 2>/dev/null || true)" "$GITHUB_RUN_ID" "${{ job.status }}" > p05-common-baseline/results/latest.json
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P05_COMMON_BASELINE_EVIDENCE
          path: |
            p05-source-sha.txt
          retention-days: 3
