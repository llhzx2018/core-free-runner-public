name: P01 2.47.446 exact core-updates PR869 independent gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247446-distribution-869.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: 7bb9e1828dbc238c5d41a993da99434a5748fc20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Bind exact private update candidate in ephemeral checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-446-distribution"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" fetch -q origin refs/heads/dist/p01-music-v2.47.446-20261024
          git -C "$ROOT" checkout -q --detach FETCH_HEAD
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_446_DIST_EXACT_SOURCE=PASS
      - name: Full core-updates contract and exact P01 release coordinates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee "$P01_UPDATES_ROOT/manifest-result.json"
          grep -F '"status": "PASS"' "$P01_UPDATES_ROOT/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          m=json.load(open('projects/P01.json'))
          assert m['target_version']=='2.47.446'
          assert m['current_version']=='2.47.445'
          assert m['from_versions']==['2.47.445']
          assert m['release_tag']=='v2.47.446'
          assert m['release_id']==422533656
          assert m['product_identity']=='de55ac5e9a6753cfd53caa553ebf1136c22c4f17'
          assert m['asset_name']=='VF_Start_V2.47.446_UPDATE.zip'
          assert m['asset_bytes']==2945723
          assert m['asset_sha256']=='94256454afb713ab5f4b89077af807b78f5950933e03172bbb24c08404cf20e0'
          assert m['schema_from']==m['schema_to']=='2026102201'
          assert m['update_type']=='ATOMIC'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          print('P01_446_DISTRIBUTION_COORDINATES=PASS')
          PY
          echo P01_446_DISTRIBUTION_EQUIVALENT_CI=PASS
      - name: Independent published release/tag/UPDATE remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          RELEASE_JSON="$RUNNER_TEMP/p01-446-release.json"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.446 > "$RELEASE_JSON"
          jq -e '.id==422533656 and .tag_name=="v2.47.446" and .draft==false and .prerelease==false' "$RELEASE_JSON" >/dev/null
          jq -e '.assets[] | select(.name=="VF_Start_V2.47.446_UPDATE.zip") | .size==2945723 and .digest=="sha256:94256454afb713ab5f4b89077af807b78f5950933e03172bbb24c08404cf20e0"' "$RELEASE_JSON" >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.446 --jq '.object.sha')" = "de55ac5e9a6753cfd53caa553ebf1136c22c4f17"
          mkdir -p "$RUNNER_TEMP/p01-446-remote"
          gh release download v2.47.446 -R llhzx2018/vf-start -D "$RUNNER_TEMP/p01-446-remote" -p VF_Start_V2.47.446_UPDATE.zip
          test "$(sha256sum "$RUNNER_TEMP/p01-446-remote/VF_Start_V2.47.446_UPDATE.zip" | awk '{print $1}')" = "94256454afb713ab5f4b89077af807b78f5950933e03172bbb24c08404cf20e0"
          echo P01_446_DISTRIBUTION_REMOTE_ASSET=PASS
      - name: Delete private checkout
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo P01_446_DIST_EPHEMERAL=PASS
