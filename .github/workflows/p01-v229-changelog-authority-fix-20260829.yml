name: P01 V2.29 Changelog Authority Fix
on:
  push:
    branches: [task/p01-v229-changelog-authority-fix-20260829]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch stale V2.29 changelog block only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "442b609c3049aff54ee653a80e167b2b6bd9d519"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md');s=p.read_text(encoding='utf-8')
          marker='## V2.28.0 · Formal Release · 2026-08-29'
          assert s.startswith('## V2.29.0 · Functional Rebaseline Candidate · 2026-08-29')
          assert marker in s
          _,tail=s.split(marker,1)
          head='''## V2.29.0 · Functional + Resource Domain Rebaseline Candidate · 2026-08-29

- Functional Rebaseline：恢复 All / Public / Private、完整层级导航分类、Parent→Descendants、Desktop 分类搜索、Mobile searchable picker、0-count Category、Bulk Public / Private 与大收藏量连续定位。
- Resource Domain Rebaseline：同一 `links` URL Authority 下明确为“全部资源 / 导航 / 频道 / 影视 / 专题”；一级资源域本身不要求装饰性图标。
- 导航继续使用原 `categories` 层级 Authority；频道 / 影视 / 专题改用各自 `resource_kind` 主分类 + Tags 次属性，不再把导航分类树当业务分类。
- 非导航资源 Public/Private 与历史网址分类隐私解耦；导航仍保留祖先/分类隐私继承语义。
- 普通网址继续使用已有 favicon 自动抓取 / 本地缓存 / 用户图标；频道 / 影视 / 专题支持独立封面，浏览器先压缩（WebP/JPEG、约 <=960 px 最大边）后上传，服务器再校验压缩成品。
- 专题新增 `remote_url / hosted_html` 双来源；上传 HTML 进入私有资源存储，通过 CSP sandbox 打开，允许自身脚本但无 `allow-same-origin`，不可取得 P01 localStorage / API Authority；私人专题匿名 404。
- Schema 从 `2026082801` 推进到 Candidate `2026082901`；新增 `resource_domain_profiles` / `resource_asset_files`，旧 `resource_surface_profiles` 兼容迁移前向，不新增 Shadow URL Authority。
- Exact Product Source=`a6b8d47064ce06fa2cf8b8003ba15e25a83666d2` / Tree=`520e759125bfdc5b9a9616dcba24fb37db65f111` / PR #49 MERGED / Product Merge=`033f10f69119fd4fecafff391f58783ee3826c4f`。
- Functional Contract Gate V2 `33195369438`、450-link Gate `33195712935`、Large Library UX `33196685934`、Domain+Cover UI `33201210206`、Hosted HTTP Sandbox `33205098305` PASS。
- V2.29 当前仅完成 develop Candidate Closure；未 main Promotion、未创建 `v2.29.0` Tag / GitHub Release、未发布 core-updates 2.29.0、未写 Owner Production。

'''
          p.write_text(head+marker+tail,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "CHANGELOG.md"
          grep -F 'Schema 从 `2026082801` 推进到 Candidate `2026082901`' CHANGELOG.md
          grep -F 'Hosted HTTP Sandbox `33205098305` PASS' CHANGELOG.md
      - name: Commit and push docs-only correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          git commit -m 'docs(P01): align V2.29 changelog with resource domain closure'
          git push origin HEAD:develop
          echo "P01_V229_CHANGELOG_COMMIT=$(git rev-parse HEAD)"
