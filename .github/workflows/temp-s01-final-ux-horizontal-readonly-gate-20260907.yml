name: S01 Final UX Horizontal Readonly Gate
on:
  push:
    branches:
      - temp/s01-final-ux-candidate-patch-20260907
    paths:
      - .github/workflows/temp-s01-final-ux-horizontal-readonly-gate-20260907.yml
permissions:
  contents: read
jobs:
  horizontal:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      C01_SHA: 14192d54995a2f1994787ed819bf60938395f673
      C02_SHA: bc62c6395b27afaffa58817f5840a184c67b28c8
      C03_SHA: 6d603409acf470865e3ca8474cd29bff7fdd0601
    steps:
      - name: Exact identities and cross-component UX contracts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO'
          echo 'MAIN_WRITE_USED=NO'
          echo 'RELEASE_WRITE_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          cd c01
          git checkout -q "$C01_SHA"
          test "$(git rev-parse HEAD)" = "$C01_SHA"
          test "$(cat VERSION)" = "1.35.19"
          php -l src/inc/admin/views/brand.php >/dev/null
          php -l src/inc/admin/views/navigation.php >/dev/null
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          cd ..

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          cd c02
          git checkout -q "$C02_SHA"
          test "$(git rev-parse HEAD)" = "$C02_SHA"
          test "$(cat VERSION)" = "1.21.857"
          php -l includes/views/admin-operations-console-pages.php >/dev/null
          php -l includes/admin-v13/views/dashboard.php >/dev/null
          php tests/admin-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          cd ..

          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          cd c03
          git checkout -q "$C03_SHA"
          test "$(git rev-parse HEAD)" = "$C03_SHA"
          test "$(cat VERSION)" = "1.25.27"
          php -l src/admin/pages/dashboard.php >/dev/null
          php tests/unit/dashboard-human-language-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php

          echo 'PASS_S01_FINAL_UX_HORIZONTAL_READONLY_GATE'
