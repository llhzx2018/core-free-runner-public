name: P01 V2.36.4 VF_PROJECT Authority Diff
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-vf-project-authority-diff-20260901.yml]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEVELOP: 5615d19b07303132e8fc2e374de1236a37f3cb16
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Recursive VF_PROJECT path diff
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$DEVELOP"
          git fetch origin "$FORMAL" --quiet
          git show "$DEVELOP:VF_PROJECT.json" > /tmp/develop.json
          git show "$FORMAL:VF_PROJECT.json" > /tmp/formal.json
          python3 - <<'PY' | tee /tmp/p01-v2364-vf-project-authority-diff.txt
          import json
          D=json.load(open('/tmp/develop.json'))
          F=json.load(open('/tmp/formal.json'))
          def walk(a,b,p='$'):
              if type(a)!=type(b):
                  print(f'TYPE\t{p}\tDEVELOP={type(a).__name__}\tFORMAL={type(b).__name__}')
                  return
              if isinstance(a,dict):
                  for k in sorted(set(a)|set(b)):
                      q=f'{p}.{k}'
                      if k not in a: print(f'ADD_FORMAL\t{q}\tFORMAL={json.dumps(b[k],ensure_ascii=False,sort_keys=True)}')
                      elif k not in b: print(f'ONLY_DEVELOP\t{q}\tDEVELOP={json.dumps(a[k],ensure_ascii=False,sort_keys=True)}')
                      else: walk(a[k],b[k],q)
              elif isinstance(a,list):
                  if a!=b: print(f'CHANGE\t{p}\tDEVELOP={json.dumps(a,ensure_ascii=False)}\tFORMAL={json.dumps(b,ensure_ascii=False)}')
              elif a!=b:
                  print(f'CHANGE\t{p}\tDEVELOP={json.dumps(a,ensure_ascii=False)}\tFORMAL={json.dumps(b,ensure_ascii=False)}')
          walk(D,F)
          print('--- TOP LEVEL DIFFERENT KEYS ---')
          for k in sorted(set(D)|set(F)):
              if D.get(k,'__MISSING__') != F.get(k,'__MISSING__'): print(k)
          PY
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "d35038c32b5a287636ee92d9fe074ea12c1469ef"
          echo 'REMOTE_WRITE=NO' | tee -a /tmp/p01-v2364-vf-project-authority-diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-vf-project-authority-diff-${{ github.run_id }}
          path: /tmp/p01-v2364-vf-project-authority-diff.txt
          if-no-files-found: error
          retention-days: 90
