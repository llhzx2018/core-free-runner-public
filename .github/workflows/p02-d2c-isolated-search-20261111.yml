name: P02 D2-C isolated search exact private-source Windows and Linux checks (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-d2c-isolated-search-20261111.yml'
permissions:
  contents: read
jobs:
  linux-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Capability without disclosure
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN" || { echo P02_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 65765726a7ff15c9eaaa9d3fc2994f6a8dc124e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact P02 source, JS behavior, legacy security and PHP checks
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "65765726a7ff15c9eaaa9d3fc2994f6a8dc124e9"
          echo P02_D2C_EXACT_SOURCE=PASS
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs tests/unit/p02_d2c_isolated_search.test.mjs
          bash scripts/verify-repository.sh
          echo P02_D2C_REPOSITORY_GATE=PASS
      - name: Cleanup private workspace
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo P02_D2C_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC=NO

  windows-rust:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - name: Capability without disclosure
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:READ_TOKEN)) { throw "READ_CAPABILITY_UNAVAILABLE" }
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 65765726a7ff15c9eaaa9d3fc2994f6a8dc124e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Windows Tauri test and trusted origin denials
        working-directory: product
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "65765726a7ff15c9eaaa9d3fc2994f6a8dc124e9") { throw "P02_SOURCE_DRIFT" }
          node --test tests/unit/p02_d2_windows_quick_panel.test.mjs tests/unit/p02_d2c_isolated_search.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "P02_D2C_NODE_FAIL" }
          cargo test --locked --manifest-path desktop/windows-quick/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "P02_D2C_RUST_FAIL" }
          Write-Output "P02_D2C_WINDOWS_COMPILE_AND_SECURITY=PASS"
      - name: Cleanup private workspace
        if: always()
        shell: pwsh
        run: |
          if (Test-Path product) { Remove-Item -Force -Recurse product }
          Write-Output "P02_D2C_PRIVATE_SOURCE_PERSISTED_IN_PUBLIC=NO"
