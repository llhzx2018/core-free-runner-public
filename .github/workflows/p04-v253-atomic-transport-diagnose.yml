name: P04 V2.5.3 Atomic Transport Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-atomic-transport-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Capture Atomic transport and server failure
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute_v2.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''UP_CODE=$(curl -sS -b "$WORK/cookie" -c "$WORK/cookie" -o "$WORK/repair-post.html" -w '%{http_code}' -H "Origin: $BASE" --data-urlencode "csrf=$RCSRF" "$BASE/repair-v2.5.3.php")\ntest "$UP_CODE" = 200\ngrep -Fq '升级完成' "$WORK/repair-post.html"'''
          new='''set +e\nUP_CODE=$(curl -sS -b "$WORK/cookie" -c "$WORK/cookie" -o "$WORK/repair-post.html" -w '%{http_code}' -H "Origin: $BASE" --data-urlencode "csrf=$RCSRF" "$BASE/repair-v2.5.3.php")\nCURL_RC=$?\nset -e\necho "ATOMIC_CURL_RC=$CURL_RC HTTP=$UP_CODE SERVER_ALIVE=$(kill -0 $PID 2>/dev/null && echo YES || echo NO)"\necho '--- ATOMIC RESPONSE ---'\nif [[ -f "$WORK/repair-post.html" ]]; then sed -n '1,200p' "$WORK/repair-post.html" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'; else echo '[NO BODY]'; fi\necho '--- SERVER LOG TAIL ---'\ntail -120 "$WORK/http.log" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'\nif [[ "$CURL_RC" != 0 || "$UP_CODE" != 200 ]] || ! grep -Fq '升级完成' "$WORK/repair-post.html"; then exit 1; fi'''
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
