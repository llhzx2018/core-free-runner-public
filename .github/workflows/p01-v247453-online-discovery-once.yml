name: P01 V2.47.453 live update discovery contract (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247453-online-discovery-once.yml'

permissions:
  contents: read

jobs:
  live-discovery:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247453-online-discovery-once-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact released P01 client source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3e73804b553fb6a501c0a8dc00417b0a223aa663
          path: candidate
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Prepare PHP cURL transport if absent
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -m | grep -Eiq '^curl$'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq php-curl
          fi
          php -m | grep -Eiq '^curl$'
          echo P01_DISCOVERY_PHP_CURL=PASS

      - name: Live core-updates main via canonical P01 GitHubClient and UpdateCore
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test "$(git -C candidate rev-parse HEAD)" = 3e73804b553fb6a501c0a8dc00417b0a223aa663
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'candidate/src/app/CoreUpdates/GitHubClient.php';
          require 'candidate/src/app/CoreUpdates/UpdateCore.php';
          $token=(string)getenv('VF_PRIVATE_READ_TOKEN');
          if (strlen($token)<20) throw new RuntimeException('Runtime read token missing');
          $client=new CoreUpdates\GitHubClient($token);
          $manifest=$client->fetchProjectManifest('llhzx2018/core-updates','P01.json','main');
          if ($manifest['target_version']!=='2.47.453'
             || $manifest['release_tag']!=='v2.47.453'
             || $manifest['asset_name']!=='VF_Start_V2.47.453_UPDATE.zip'
             || $manifest['asset_sha256']!=='d320b8156adf1a9bdad4dff3062866b9ca1fe4dc5a6fb7000e9ed931b6705f86'
             || $manifest['product_identity']!=='3e73804b553fb6a501c0a8dc00417b0a223aa663') {
              throw new RuntimeException('Live main channel identity mismatch');
          }
          $core=new CoreUpdates\UpdateCore('P01','APP');
          foreach ([
             ['2.47.452','2026102201','AVAILABLE'],
             ['2.47.451','2026102201','BLOCKED_SOURCE_VERSION'],
             ['2.47.453','2026102201','UP_TO_DATE'],
             ['2.47.452','1900010101','BLOCKED_SCHEMA']
          ] as [$v,$schema,$expected]) {
             $result=$core->check($v,$schema,$manifest);
             if ($result['status']!==$expected) {
                 throw new RuntimeException("Discovery $v $schema expected $expected got ".$result['status']);
             }
             echo "P01_LIVE_CHANNEL_DISCOVERY $v/$schema $expected=PASS\n";
          }
          echo "P01_453_LIVE_DISCOVERY_EXACT_RELEASED_SOURCE=PASS\n";
          PHP
