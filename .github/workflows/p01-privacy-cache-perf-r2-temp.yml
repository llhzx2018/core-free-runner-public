name: p01-privacy-cache-perf-r2-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-privacy-cache-perf-r2-temp.yml'
      - 'requests/p01-privacy-cache-perf-r2-20260922.json'

permissions:
  contents: read

concurrency:
  group: p01-privacy-cache-perf-r2-temp
  cancel-in-progress: false

jobs:
  privacy-cache-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-privacy-cache-perf-r2-20260922.json
    steps:
      - name: Checkout public runner control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate ephemeral lane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" | tee /tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Checkout P01 R2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fix/p01-privacy-cache-perf-r2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$target_version"
          test "$(php -r '$p=json_decode(file_get_contents("candidate/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$schema_version"
          echo 'P01_R2_EXACT_SOURCE=PASS'

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          cd candidate
          php tests/unit/privacy_cache_performance_r2_contract.php
          php tests/unit/session_csrf_contract.php
          php tests/unit/navigation_owner_behavior_privacy_contract.php
          php tests/unit/resource_cover_derivative_runtime.php
          php tests/unit/full_surface_governance_privacy_monotonic_runtime.php
          php tests/unit/admin_system_baseline_r25_contract.php
          echo 'P01_R2_FOCUSED_CONTRACTS=PASS'

      - name: Verify optional pre-install claim guard
        shell: bash
        run: |
          set -Eeuo pipefail
          GUARD=/tmp/p01-r2-guard
          rm -rf "$GUARD"
          cp -a candidate/src "$GUARD"
          cd "$GUARD"
          VF_SETUP_REQUIRE_KEY=1 php -S 127.0.0.1:18446 -t . >/tmp/p01-r2-guard.log 2>&1 &
          GUARD_PID=$!
          trap 'kill "$GUARD_PID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:18446/setup.php" -o /tmp/p01-r2-guard.html; then break; fi
            sleep 1
          done
          grep -Fq '高级安装保护' /tmp/p01-r2-guard.html
          grep -Fq 'name="setup_key_auth"' /tmp/p01-r2-guard.html
          if grep -Fq 'name="admin_password"' /tmp/p01-r2-guard.html; then
            echo 'ADMIN_PASSWORD_FORM_EXPOSED_BEFORE_SETUP_CLAIM'
            exit 91
          fi
          kill "$GUARD_PID" >/dev/null 2>&1 || true
          trap - EXIT
          echo 'P01_R2_OPTIONAL_SETUP_GUARD=PASS'

      - name: Fresh runtime cache privacy and visibility transition
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-r2-runtime
          COOKIE=/tmp/p01-r2-admin.cookies
          rm -rf "$RUNTIME" "$COOKIE"
          cp -a candidate/src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:"$target_port" -t . >/tmp/p01-r2-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 40); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$target_port/setup.php" -o /tmp/p01-r2-setup.html; then break; fi
            sleep 1
          done
          SETUP_CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-r2-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert m, 'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$target_port/setup.php" \
            --data-urlencode "setup_csrf=$SETUP_CSRF" \
            --data-urlencode 'site_title=VF Start R2 Gate' \
            --data-urlencode 'admin_password=PrivacyCache!2026' \
            --data-urlencode 'admin_password_confirm=PrivacyCache!2026' \
            -o /tmp/p01-r2-setup-post.html
          php cli/verify.php | tee /tmp/p01-r2-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-r2-verify.txt
          SETUP_LOCK_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$target_port/setup.php")
          echo "SETUP_LOCK_STATUS=$SETUP_LOCK_STATUS"
          test "$SETUP_LOCK_STATUS" = '302'
          echo 'P01_R2_SETUP_LOCK=PASS'

          rm -f /tmp/p01-r2-anon.cookies
          curl -fsS -D /tmp/p01-r2-home.headers -o /tmp/p01-r2-home.html "http://127.0.0.1:$target_port/"
          echo '--- ANON HOME HEADERS ---'; cat /tmp/p01-r2-home.headers
          grep -Eiq '^Cache-Control: public, max-age=120, stale-while-revalidate=300' /tmp/p01-r2-home.headers
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-home.headers
          if grep -Eiq '^Set-Cookie: *vfnav_session=' /tmp/p01-r2-home.headers; then
            echo 'ANONYMOUS_HOME_STARTED_SESSION'
            exit 92
          fi
          echo 'P01_R2_ANON_HOME_CACHE=PASS'

          curl -fsS -D /tmp/p01-r2-start.headers -o /tmp/p01-r2-start.html "http://127.0.0.1:$target_port/start.php"
          echo '--- ANON START HEADERS ---'; cat /tmp/p01-r2-start.headers
          grep -Eiq '^Cache-Control: public, max-age=120, stale-while-revalidate=300' /tmp/p01-r2-start.headers
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-start.headers
          if grep -Eiq '^Set-Cookie: *vfnav_session=' /tmp/p01-r2-start.headers; then
            echo 'ANONYMOUS_START_STARTED_SESSION'
            exit 93
          fi
          echo 'P01_R2_ANON_START_CACHE=PASS'

          LOGIN_STATUS=$(curl -sS -c "$COOKIE" -b "$COOKIE" -o /tmp/p01-r2-login.json -w '%{http_code}' -H 'Content-Type: application/json' \
            --data '{"password":"PrivacyCache!2026"}' \
            "http://127.0.0.1:$target_port/api.php?action=login")
          echo "LOGIN_STATUS=$LOGIN_STATUS"; cat /tmp/p01-r2-login.json
          test "$LOGIN_STATUS" = '200'
          grep -Fq '"ok":true' /tmp/p01-r2-login.json
          echo 'P01_R2_LOGIN=PASS'

          curl -fsS -c "$COOKIE" -b "$COOKIE" -D /tmp/p01-r2-admin-start.headers -o /tmp/p01-r2-admin-start.html \
            "http://127.0.0.1:$target_port/start.php"
          echo '--- ADMIN START HEADERS ---'; cat /tmp/p01-r2-admin-start.headers
          grep -Eiq '^Cache-Control: no-store, private|^Cache-Control: private, no-store' /tmp/p01-r2-admin-start.headers
          echo 'P01_R2_ADMIN_NOSTORE=PASS'

          php -r '
          require "app/bootstrap.php";
          $db=vf_db();
          $repo=new VfRepository($db);
          $category=$repo->createCategory(["name"=>"R2 Public","description"=>"","icon"=>"","is_private"=>0,"sort_order"=>0]);
          $link=$repo->saveLink(null,["surface"=>"start","category_id"=>$category,"title"=>"R2 Cover","url"=>"https://example.com/r2-cover","description"=>"","tags"=>[],"is_private"=>0,"is_pending"=>0]);
          $id=(int)$link["id"];
          $dir=VF_PRIVATE_ROOT."/resource-assets/covers";
          if(!is_dir($dir))mkdir($dir,0750,true);
          vf_write_storage_guards($dir);
          $file="cover-".$id."-r2gate.png";
          $path=$dir."/".$file;
          $im=imagecreatetruecolor(32,32);
          imagepng($im,$path);
          imagedestroy($im);
          chmod($path,0640);
          $hash=hash_file("sha256",$path);
          $now=gmdate("c");
          $stmt=$db->prepare("INSERT INTO resource_asset_files(link_id,asset_kind,file_name,original_name,mime_type,byte_size,width,height,file_hash,created_at,updated_at) VALUES(?,\x27cover\x27,?,\x27r2.png\x27,\x27image/png\x27,?,32,32,?,?,?)");
          $stmt->execute([$id,$file,filesize($path),$hash,$now,$now]);
          echo $id." ".substr($hash,0,16);
          ' > /tmp/p01-r2-cover-fixture.txt
          echo '--- COVER FIXTURE ---'; cat /tmp/p01-r2-cover-fixture.txt
          read COVER_ID COVER_HASH < /tmp/p01-r2-cover-fixture.txt
          test -n "$COVER_ID"
          test -n "$COVER_HASH"
          COVER_URL="http://127.0.0.1:$target_port/resource-cover.php?id=$COVER_ID&v=$COVER_HASH"

          php -r '
          require "app/bootstrap.php";
          $id=(int)$argv[1];
          $db=vf_db();
          echo "ACCESS=".json_encode((new VfSurfaceRepository($db))->accessRecord($id),JSON_UNESCAPED_SLASHES)."\\n";
          $cover=(new VfResourceAssetStore($db))->coverRecord($id);
          echo "COVER=".json_encode(is_array($cover)?["file_name"=>$cover["file_name"]??"","path"=>$cover["path"]??"","exists"=>is_file((string)($cover["path"]??""))]:null,JSON_UNESCAPED_SLASHES)."\\n";
          ' "$COVER_ID"

          COVER_PUBLIC_STATUS=$(curl -sS -D /tmp/p01-r2-cover-public.headers -o /tmp/p01-r2-cover-public.bin -w '%{http_code}' "$COVER_URL")
          echo "COVER_PUBLIC_STATUS=$COVER_PUBLIC_STATUS"; cat /tmp/p01-r2-cover-public.headers
          if [ "$COVER_PUBLIC_STATUS" != '200' ]; then
            echo '--- SERVER LOG ---'; cat /tmp/p01-r2-server.log
            exit 94
          fi
          grep -Eiq '^Cache-Control: public, max-age=0, must-revalidate' /tmp/p01-r2-cover-public.headers
          grep -Eiq '^Vary: Cookie' /tmp/p01-r2-cover-public.headers
          ETAG=$(awk 'BEGIN{IGNORECASE=1} /^ETag:/{gsub("\r",""); sub(/^ETag:[[:space:]]*/,""); print; exit}' /tmp/p01-r2-cover-public.headers)
          test -n "$ETAG"

          STATUS_304=$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $ETAG" "$COVER_URL")
          test "$STATUS_304" = '304'

          php -r '
          require "app/bootstrap.php";
          $db=vf_db();
          $id=(int)$argv[1];
          $stmt=$db->prepare("UPDATE links SET is_private=1,updated_at=? WHERE id=?");
          $stmt->execute([gmdate("c"),$id]);
          ' "$COVER_ID"

          PRIVATE_STATUS=$(curl -sS -D /tmp/p01-r2-cover-private.headers -o /tmp/p01-r2-cover-private.bin -w '%{http_code}' \
            -H "If-None-Match: $ETAG" "$COVER_URL")
          test "$PRIVATE_STATUS" = '404'
          grep -Eiq '^Cache-Control: private, no-store, max-age=0' /tmp/p01-r2-cover-private.headers

          INVALID_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$target_port/resource-cover.php?id=0")
          test "$INVALID_STATUS" = '404'

          echo 'P01_R2_ANONYMOUS_SESSIONLESS_CACHE=PASS'
          echo 'P01_R2_PUBLIC_TO_PRIVATE_COVER=PASS'
          echo 'P01_R2_FRESH_RUNTIME=PASS'
