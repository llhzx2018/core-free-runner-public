name: S01 Ops 1.21.894 Operations Final R5 Candidate Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 9ada146737ff204450eb4d0f47e808e0718658dc
      BASE_SHA: 943f3d56300c196b919c585b14a1f47e9d8be9fd
      VERSION: 1.21.894
      PREVIOUS_TAG: v1.21.893
      PREVIOUS_ASSET: vf-tools-ops_V1.21.893.zip
      ASSET: vf-tools-ops_V1.21.894.zip

    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9ada146737ff204450eb4d0f47e808e0718658dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.894' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.894'" ops/vf-ops.php
          grep -Fq 'S01-OPERATIONS-FINAL-R5' ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-operations-final-r5.css \
            includes/admin-v13/views/acceptance_overview.php \
            includes/admin-v13/views/dashboard.php \
            includes/admin-v13/views/publish_zip_v6.php \
            includes/admin-v13/views/system_site_release_v6.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121894-operations-final-r5-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update | wc -l)" = "0"
          echo PASS_EXACT_IDENTITY_AND_SCOPE

      - name: Contract syntax and runtime-hook gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-121894-operations-final-r5-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/admin-v13/views/dashboard.php >/dev/null
          php -l ops/includes/admin-v13/views/acceptance_overview.php >/dev/null
          php -l ops/includes/admin-v13/views/publish_zip_v6.php >/dev/null
          php -l ops/includes/admin-v13/views/system_site_release_v6.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php -l ops/tests/s01-c02-121894-operations-final-r5-contract.php >/dev/null
          css=ops/assets/css/current/admin-s01-operations-final-r5.css
          for needle in \
            '.vf-v9-table-dashboard' \
            '.vf-v9-table-quality' \
            '.vf-v9-issue-list' \
            '.vf-v9-upload' \
            '.vf-v9-form-table' \
            '.vf-v9-table-chain' \
            '.vf-v9-table-system' \
            '@media (max-width:782px)' \
            '@media (max-width:520px)' \
            '@media (forced-colors:active)' \
            '@media (prefers-reduced-motion:reduce)'; do
            grep -Fq "$needle" "$css"
          done
          ! grep -Fq 'position: fixed' "$css"
          ! grep -Fq 'position:fixed' "$css"
          python3 - <<'PY'
          from pathlib import Path
          d=Path('ops/includes/admin-v13/views/dashboard.php').read_text()
          q=Path('ops/includes/admin-v13/views/acceptance_overview.php').read_text()
          p=Path('ops/includes/admin-v13/views/publish_zip_v6.php').read_text()
          s=Path('ops/includes/admin-v13/views/system_site_release_v6.php').read_text()
          assert 'data-vf-dashboard-product' in d and 'data-vf-dashboard-refresh' in d
          assert 'data-vf-acceptance-overview-root' in q and 'data-vf-acceptance-refresh' in q
          for x in ('data-vf-zip-root','vf-release-source-zip-upload-v121331','data-vf-zip-task-panel','data-vf-zip-cleanup-open'):
              assert x in p
          assert p.count('data-vf-publish-prepare-form') == 1
          for x in ('data-vf-sr-root','id="vf-site-release-form"','id="vf-sr-primary"','data-vf-repeat="required-path"','data-vf-repeat="forbidden-host"','data-vf-repeat="redirect-map"'):
              assert x in s
          PY
          echo PASS_CONTRACT_SYNTAX_RUNTIME_HOOKS

      - name: Security and ownership fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ops/vf-ops.php \
            ops/includes/admin-v13/views/dashboard.php \
            ops/includes/admin-v13/views/acceptance_overview.php \
            ops/includes/admin-v13/views/publish_zip_v6.php \
            ops/includes/admin-v13/views/system_site_release_v6.php \
            ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            ops/assets/css/current/admin-s01-operations-final-r5.css
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- includes/wp-update config database | wc -l)" = "0"
          echo PASS_SECURITY_AND_OWNERSHIP_FENCE

      - name: Build deterministic runtime-only package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); stage=Path('stage/vf-ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel in ('vf-ops.php','uninstall.php')
              return re.match(r'^(?:includes|assets|languages|config)/',rel) is not None
          files=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()),key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel):continue
              if p.is_symlink():raise SystemExit('runtime symlink forbidden: '+rel)
              data=p.read_bytes(); files.append((rel,data))
              q=stage/rel; q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(data)
          canonical=b''.join(rel.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for rel,data in files)
          Path('/tmp/runtime_count').write_text(str(len(files)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          for out in ('dist/vf-tools-ops_V1.21.894.zip','dist/rebuild-vf-tools-ops_V1.21.894.zip'):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      info=zipfile.ZipInfo('vf-ops/'+rel,date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF)<<16
                      z.writestr(info,data)
          print('RUNTIME_FILES='+str(len(files)))
          print('RUNTIME_FINGERPRINT='+hashlib.sha256(canonical).hexdigest())
          PY
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.894'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-operations-final-r5.css'
          test "$(cat /tmp/runtime_count)" = "965"
          sha256sum "dist/$ASSET" | awk '{print $1}' >/tmp/asset_sha
          stat -c '%s' "dist/$ASSET" >/tmp/asset_bytes
          echo PASS_DETERMINISTIC_RUNTIME_PACKAGE

      - name: Previous release compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(stat -c '%s' "previous/$PREVIOUS_ASSET")" = "3445526"
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "8c277b32bac6cf677739b001ac1538369fec2692698edbd3cef99c88c4898b9e"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sort >/tmp/prev_files.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sort >/tmp/new_files.txt
          comm -13 /tmp/prev_files.txt /tmp/new_files.txt >/tmp/added.txt
          comm -23 /tmp/prev_files.txt /tmp/new_files.txt >/tmp/removed.txt
          test "$(cat /tmp/added.txt)" = 'vf-ops/assets/css/current/admin-s01-operations-final-r5.css'
          test ! -s /tmp/removed.txt
          echo PASS_PREVIOUS_RELEASE_COMPATIBILITY

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > dist/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=$PREVIOUS_TAG
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RUNTIME_ADDED=assets/css/current/admin-s01-operations-final-r5.css
          RUNTIME_REMOVED=NONE
          SECURITY=PASS
          TESTING=PASS
          RUNTIME_HOOKS=PASS
          UA_UI=PASS_OPERATIONS_FINAL_R5_CONTRACT
          SCHEMA=6.0.0_TO_6.0.0
          DATA_MIGRATION=NONE
          SIX_DOMAIN_IA=UNCHANGED
          CANONICAL_ROUTES=UNCHANGED
          M3U8_OWNERSHIP=UNCHANGED
          THEME_OWNERSHIP=UNCHANGED
          SHARED_UPDATER=UNCHANGED
          PRODUCTION=NOT_RUN
          OWNER_VISUAL_ACCEPTANCE=NOT_RUN
          RESULT=PASS
          EOF
          cat dist/candidate-receipt.txt

      - name: Upload exact tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121894-operations-final-r5-candidate
          path: |
            dist/vf-tools-ops_V1.21.894.zip
            dist/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14
