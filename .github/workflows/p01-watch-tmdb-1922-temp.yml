name: p01-watch-tmdb-1922-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-watch-tmdb-1922-temp.yml']
permissions:
  contents: read
jobs:
  exact-watch-sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: cd9c820aea69f4790d87b932e473a38716b07f7d
      BASE_SHA: 8e00724f6284833c28a504607ae9f5faf42be832
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-watch-tmdb-single-response-identity-20261106
    steps:
      - name: Checkout public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact source and Watch TMDB identity behavior
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          ROOT="$(mktemp -d /tmp/p01-watch-1922.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch "$PRODUCT_BRANCH" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/$PRODUCT_REPO.git"
          unset READ_TOKEN
          test "$(tr -d '\r\n ' < "$ROOT/candidate/VERSION")" = "2.47.496"
          test "$(tr -d '\r\n ' < "$ROOT/candidate/src/VERSION.txt")" = "2.47.496"
          echo "P01_WATCH_EXACT_SHA=$TARGET_SHA"
          cd "$ROOT/candidate"
          node --check src/assets/watch-metadata.js
          node --check tests/browser/watch_metadata_manual_sync_result_contract.cjs
          echo P01_WATCH_JS_SYNTAX=PASS
          node tests/browser/watch_metadata_manual_sync_result_contract.cjs
          node tests/browser/watch_metadata_detail_live_sync_contract.cjs
          node tests/browser/watch_cinema_detail_delegation_contract.cjs
          echo P01_WATCH_IDENTITY_BROWSER_CONTRACTS=PASS
          if command -v php >/dev/null; then
            php tests/unit/watch_r13_auto_detail_contract.php
            php tests/unit/watch_cinema_rebuild_contract.php
            echo P01_WATCH_PHP_SOURCE_REGRESSION=PASS
          fi
          echo P01_WATCH_SAFE_RETURN_AND_PLAYBACK_UNCHANGED=PASS
      - name: Public-safe lifecycle acknowledgment
        if: always()
        shell: bash
        run: |
          echo P01_PRIVATE_SOURCE_PUBLIC_ARTIFACT=NONE
          echo P01_PRODUCTION_CHANGED=NO
          echo P01_TEMPORARY_LANE_CLOSE_UNMERGED=YES
