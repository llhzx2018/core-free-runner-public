name: P08 R103 genuine old v0.1.1 CloudPanel onefile Bridge activation
on:
  push:
    branches: [test/p08-r103-old011-onefile-bootstrap-once-20261114]
permissions:
  contents: read
jobs:
  real-cloudpanel-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - name: Public-safe test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private exact R103 code in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e28a89192b239d8653e56ef2975bc2bc7779061b
          path: p08-private-r103
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4, FPM nginx cron systemd installed on disposable machine
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/r103-apt.log" 2>&1 || { tail -n 12 "$RUNNER_TEMP/r103-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/r103-apt.log" 2>&1
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/r103-apt.log" 2>&1
          sudo apt-get update -qq >> "$RUNNER_TEMP/r103-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-zip php8.4-curl \
            >> "$RUNNER_TEMP/r103-apt.log" 2>&1 || { tail -n 18 "$RUNNER_TEMP/r103-apt.log"; exit 1; }
          php8.4 -v | head -n 1
          echo R103_GENUINE_SYSTEMD_AND_PHP84=PASS
      - name: Build precisely ONE script, inspect embedded helper, reject missing authorization
        run: |
          set -euo pipefail
          src="$PWD/p08-private-r103"
          test "$(git -C "$src" rev-parse HEAD)" = e28a89192b239d8653e56ef2975bc2bc7779061b
          test "$(cat "$src/VERSION")" = 0.1.2
          php8.4 -l "$src/scripts/r103_bridge_bootstrap_helper.php"
          bash -n "$src/scripts/r103_cloudpanel_old011_bootstrap_once.sh"
          python3 "$src/scripts/build_r103_onefile.py" \
            --source "$src" --output "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh"
          bash -n "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh"
          test "$(grep -xc '__R103_PRIVATE_PHP_BEGIN__' "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh")" -eq 1
          test "$(grep -c '__R103_EMBEDDED_HELPER_SHA256__' "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh")" -eq 0
          ! sudo bash "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh" \
            --activate --invalid-ack >/dev/null 2>&1
          echo R103_ONEFILE_CLI_DIGEST_AND_UNAUTHORIZED_REFUSAL=PASS
      - name: Download genuine OFFICIAL v0.1.1 FULL and install seeded old Owner
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          GITHUB_ACTIONS: 'true'
          P08_ISOLATED_INSTALL_TEST: 'YES'
          P08_R102_DISPOSABLE_SCHEMA: 'YES'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          src="$PWD/p08-private-r103"
          site=/home/r103ci/htdocs/r103-test.invalid
          sudo useradd -m -s /bin/bash r103ci
          sudo mkdir -p "$site"
          old="$RUNNER_TEMP/p08-r103-published-old"
          mkdir -m 0700 "$old"
          gh release download v0.1.1 -R llhzx2018/vf-adops \
            --pattern VF_AdOps_V0.1.1_FULL.zip --dir "$old" >/dev/null
          printf '%s  %s\n' \
            d6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba \
            "$old/VF_AdOps_V0.1.1_FULL.zip" | sha256sum -c -
          sudo unzip -q "$old/VF_AdOps_V0.1.1_FULL.zip" -d "$site"
          test "$(sudo sha256sum "$site/FULL_MANIFEST.json" | cut -d' ' -f1)" = a4bf9f7f5fc48bb4c32ece11139af508b68ed85e69a69cf48dff7adc0d837829
          sudo env GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES P08_R102_DISPOSABLE_SCHEMA=YES \
            php8.4 "$src/tests/compatibility/r102_install_published_sqlite.php" "$site"
          sudo mkdir -p "$site/storage/app/private/adops/upgrade"
          printf '%s\n' "$GH_TOKEN" |
            sudo tee "$site/storage/app/private/adops/upgrade/github-read-token" >/dev/null
          sudo chmod 0600 "$site/storage/app/private/adops/upgrade/github-read-token"
          sudo chown -R r103ci:r103ci /home/r103ci/htdocs
          sudo chmod 0755 /home/r103ci /home/r103ci/htdocs "$site"
          sudo tee /etc/php/8.4/fpm/pool.d/r103ci.conf > /dev/null <<'EOF'
          [r103ci]
          user = r103ci
          group = r103ci
          listen = /run/php/r103ci-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = ondemand
          pm.max_children = 2
          pm.process_idle_timeout = 10s
          EOF
          sudo tee /etc/nginx/sites-enabled/r103-test.invalid.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:19213;
            server_name r103-test.invalid;
            root /home/r103ci/htdocs/r103-test.invalid/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/r103ci-fpm.sock;
            }
          }
          EOF
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for unit in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$unit"; done
          test "$(sudo readlink "$site/current" 2>/dev/null || true)" = ''
          echo R103_REAL_PUBLISHED_011_OLD_OWNER_INSTALLED_AND_TOKEN_REUSED=PASS
      - name: Run single-script real GitHub official download plus real offline Bridge activation
        run: |
          set -euo pipefail
          site=/home/r103ci/htdocs/r103-test.invalid
          script="$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh"
          oldPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$oldPid" -gt 1
          # LIVE official Release, old saved site Token and real systemd.
          if ! sudo bash "$script" --activate --ack-global-service-outage "$site" \
               > "$RUNNER_TEMP/r103-offline-output.log" 2>&1; then
            grep -E '^(R103_|R102_)' "$RUNNER_TEMP/r103-offline-output.log" | tail -n 20 || true
            echo R103_REAL_OFFICIAL_BRIDGE_BOOTSTRAP_BLOCKED
            exit 1
          fi
          grep -Fq 'R103_OFFICIAL_011_TO_BRIDGE_PREFLIGHT=PASS' "$RUNNER_TEMP/r103-offline-output.log"
          grep -Fq 'R103_BRIDGE_ACTIVATED_OFFLINE=PASS' "$RUNNER_TEMP/r103-offline-output.log"
          grep -Fq 'R103_CLOUDPANEL=BRIDGE_READY_LOGIN_AND_CLICK_012' "$RUNNER_TEMP/r103-offline-output.log"
          test -L "$site/current"
          ptr="$(sudo readlink "$site/current")"
          [[ "$ptr" =~ ^releases/[a-f0-9]{40}$ ]]
          test ! -e "$site/storage/app/private/adops/maintenance/maintenance.json"
          test -f "$site/storage/app/private/adops/upgrade/r102-bridge-activation.json"
          test -f "$site/storage/app/private/adops/upgrade/r102-bridge-activation-journal.json"
          test -f "$site/storage/app/private/adops/upgrade/github-read-token"
          fresh="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$fresh" -gt 1 && test "$fresh" != "$oldPid"
          for unit in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$unit"; done
          curl -fsS -D "$RUNNER_TEMP/r103-header" \
            -o "$RUNNER_TEMP/r103-body" \
            -H 'Host: r103-test.invalid' http://127.0.0.1:19213/ || true
          if grep -q 'VF AdOps update safety check failed' "$RUNNER_TEMP/r103-body"; then
            echo R103_AFTER_BRIDGE_WEB_GATEWAY_BLOCKED
            exit 1
          fi
          echo R103_REAL_011_TO_VERSIONED_BRIDGE_ACTIVATION_DATA_BACKUP_FPM=PASS
      - name: Always cleanup private sources/credentials/disposable host
        if: always()
        run: |
          sudo systemctl stop nginx cron php8.4-fpm 2>/dev/null || true
          sudo rm -f /etc/nginx/sites-enabled/r103-test.invalid.conf \
            /etc/php/8.4/fpm/pool.d/r103ci.conf
          sudo pkill -u r103ci 2>/dev/null || true
          sudo userdel -r r103ci 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/p08-private-r103" "$RUNNER_TEMP/p08-r103-published-old"
          rm -f "$RUNNER_TEMP/P08_R103_OLD011_BRIDGE_ONCE.sh" \
            "$RUNNER_TEMP/r103-offline-output.log" \
            "$RUNNER_TEMP/r103-header" "$RUNNER_TEMP/r103-body" \
            "$RUNNER_TEMP/r103-apt.log"
          echo R103_PRIVATE_SITE_AND_TOKEN_CLEANED=YES
