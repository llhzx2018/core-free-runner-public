name: P02 V2.5.28 Production Closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-production-closure.yml'
      - 'scripts/p02-v2528-production-closure.py'

permissions:
  contents: read

jobs:
  close-production-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered write capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo RELEASE_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: main
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Verify exact sealed source before governance write
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < product/VERSION)" = '2.5.28'
          test "$(git -C product rev-parse HEAD)" = '7861999d99a8de385bdd73f7892477e197c4559c'
          echo P02_FORMAL_SOURCE_AUTHORITY=PASS

      - name: Write production closure branch
        run: |
          set -Eeuo pipefail
          git -C product remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/llhzx2018/vf-library.git"
          python3 scripts/p02-v2528-production-closure.py

      - name: Protected boundaries
        if: always()
        run: |
          echo PRODUCT_RUNTIME_CHANGE=NO
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION_WRITE=NO
          echo FORCE_PUSH=NO
          echo HISTORY_REWRITE=NO
