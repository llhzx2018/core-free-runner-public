name: TEMP P07 RC4 final exact public maintenance entry
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-final-public-entry-20261126.yml
permissions:
  contents: read
jobs:
  real-entry:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-final-public-entry-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLIC_SHA: '4c48475eb9bdba15fd5cb41c3a76e982b1c8f1c0'
      PUBLIC_BASE: '7789eaf083bad6e3d0fce19982f930f30794e3e3'
      PRODUCT_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Checkout exact public entry candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4c48475eb9bdba15fd5cb41c3a76e982b1c8f1c0
          fetch-depth: 0
          path: public-candidate
          persist-credentials: false
      - name: Checkout exact private functional source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 54c46dfa862a5c4a39020c1bd80a129bd992077b
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Public source boundary and actual prepublication archive
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C public-candidate rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import os, subprocess,re
          from pathlib import Path
          p=Path("public-candidate")
          old=subprocess.check_output(["git","-C",str(p),"show",os.environ["PUBLIC_BASE"]+":installers/p07-toolbox.sh"],text=True)
          new=(p/"installers/p07-toolbox.sh").read_text()
          def unaffected(s):
              start=s.index("m03_owner_trial_previous_pinned()") if "m03_owner_trial_previous_pinned()" in s else s.index("m03_verified_owner_trial()")
              end=s.index("\nrun_server_ops()",start)
              s=s[:start]+s[end:]
              return "\n".join(l for l in s.splitlines() if not l.startswith("M03_OWNER_TRIAL_") and not ('say "  2.' in l and '$M03_OWNER_TRIAL_BUILD' in l))
          assert unaffected(old)==unaffected(new)
          assert "VF_SERVER_OPS_BUILD_EXPECTED=\"0.1.0-release146\"" in new
          print("P07_RC4_PUBLIC_OTHER_MODULES_AND_STABLE_SOURCE_UNCHANGED=PASS")
          PY
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip' -o "$RUNNER_TEMP/rc3-original.zip"
          printf '%s  %s\n' '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d' "$RUNNER_TEMP/rc3-original.zip" | sha256sum -c - >/dev/null
          cd transient-p07
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/rc3-original.zip" --source . --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-candidate.zip" >"$RUNNER_TEMP/candidate.json"
          printf '%s  %s\n' '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238' "$RUNNER_TEMP/rc4-candidate.zip" | sha256sum -c - >/dev/null
          echo P07_RC4_REAL_ENTRY_EXACT_PACKAGE=PASS
      - name: Real actual public menu, wrapper, old RC3, RC4, failure and cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
            [[ ! -e "$p" && ! -L "$p" ]] || { echo P07_RC4_TEST_HOST_NOT_EMPTY; exit 31; }
          done
          touch "$RUNNER_TEMP/p07-rc4-owned-sandbox"
          cd public-candidate
          python3 -B tests/test_p07_m03_rc4_public_maintenance.py PublicContract -v >"$RUNNER_TEMP/public-contract.log" 2>&1
          grep -Fxq OK "$RUNNER_TEMP/public-contract.log"
          grep -E '^Ran [1-9][0-9]* tests?' "$RUNNER_TEMP/public-contract.log"
          python3 -B scripts/check_p07_public_install_contract.py
          python3 -B scripts/check_p07_public_terminal_ux.py --base-ref "$PUBLIC_BASE"
          for suite in test_p07_five_slot_route_isolation.py test_p07_public_install_contract.py test_p07_public_terminal_ux.py test_p07_public_toolbox_menu_v3_20261118.py test_p07_five_official_owner_route.py test_p07_m03_toolbox_real_entry_argv.py test_p07_five_ux_rollback_current.py; do
            log="$RUNNER_TEMP/$suite.final.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -q >"$log" 2>&1; then
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED' "$log" | cut -c1-250 || true
              echo "P07_RC4_PUBLIC_SUITE=FAIL:$suite"
              exit 31
            fi
            grep -Fxq OK "$log"
            grep -E '^Ran [1-9][0-9]* tests?' "$log"
            echo "P07_RC4_PUBLIC_SUITE=PASS:$suite"
          done
          if ! sudo env PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted P07_RC4_REAL_ENTRY=1 P07_RC3_ZIP="$RUNNER_TEMP/rc3-original.zip" P07_RC4_ZIP="$RUNNER_TEMP/rc4-candidate.zip" "$(command -v python3)" -B tests/test_p07_m03_rc4_public_maintenance.py RealEntry -v >"$RUNNER_TEMP/public-real-entry.log" 2>&1; then
            grep -E '^(test_|FAIL:|ERROR:|AssertionError:|Ran [0-9]+ tests|FAILED)' "$RUNNER_TEMP/public-real-entry.log" | cut -c1-300 | tail -35 || true
            echo P07_RC4_REAL_PUBLIC_ENTRY=FAIL
            exit 32
          fi
          grep -E '^(test_|Ran [0-9]+ tests|OK$)' "$RUNNER_TEMP/public-real-entry.log"
          grep -Eq '^Ran 10 tests in ' "$RUNNER_TEMP/public-real-entry.log"
          grep -Fxq OK "$RUNNER_TEMP/public-real-entry.log"
          grep -Eq '^test_real_public_upgrade_legacy_caches_and_reentry \(.*\) \.\.\. ok$' "$RUNNER_TEMP/public-real-entry.log"
          grep -Eq '^test_actual_swap_failure_rolls_back \(.*\) \.\.\. ok$' "$RUNNER_TEMP/public-real-entry.log"
          grep -Eq '^test_real_public_fresh_install_and_no_color \(.*\) \.\.\. ok$' "$RUNNER_TEMP/public-real-entry.log"
          echo P07_RC4_REAL_PUBLIC_ENTRY=PASS
      - name: Always verify isolated test path and private source cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rc=0
          if [[ -f "$RUNNER_TEMP/p07-rc4-owned-sandbox" ]]; then
            for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
              if [[ -e "$p" || -L "$p" ]]; then rc=1; sudo rm -rf -- "$p"; fi
            done
          fi
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/public-candidate"
          rm -f -- "$RUNNER_TEMP"/rc3-original.zip "$RUNNER_TEMP"/rc4-candidate.zip "$RUNNER_TEMP"/candidate.json "$RUNNER_TEMP"/public-contract.log "$RUNNER_TEMP"/public-real-entry.log "$RUNNER_TEMP"/p07-rc4-owned-sandbox
          rm -f -- "$RUNNER_TEMP"/test_p07_*.py.final.log
          [[ ! -e "$GITHUB_WORKSPACE/transient-p07" ]] || exit 39
          [[ "$rc" -eq 0 ]] || { echo P07_RC4_TEST_RUNTIME_RESIDUE=FAIL; exit 39; }
          echo P07_RC4_TRANSIENT_AND_SANDBOX_CLEAN=PASS
