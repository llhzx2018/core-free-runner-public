name: TEMP VFTEST P01 production-deps Clean FULL isolated candidate
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-vftest-p01-r23-real-full-candidate-20261124.yml]
permissions:
  contents: read
concurrency:
  group: vftest-p01-real-full-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  clean-full-production-deps:
    name: VFTEST-P01-R23-PROD-FULL
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/vftest-p01-r23-real-full-candidate-')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Private exact source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: a37927c5b2ecb0372816adfb53aef17d0d575611
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Validate exact source before build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "a37927c5b2ecb0372816adfb53aef17d0d575611"
          test "$(cat private-src/VERSION)" = "0.1.0-dev"
          test -z "$(git -C private-src status --porcelain)"
          echo P01_R23_FULL_SOURCE=PASS
          echo P01_R23_SOURCE_SHA=a37927c5b2ecb0372816adfb53aef17d0d575611
      - name: Set up pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: PHP 8.4 and locked production Composer dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,zip,sodium,dom,xml,fileinfo,curl,openssl
          tools: composer:v2
          coverage: none
      - name: Locked non-dev vendor and built Vite assets
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-full-composer.log" 2>&1; then
            echo P01_R23_FULL_COMPOSER_PRODUCTION=FAIL; exit 1
          fi
          test ! -e vendor/phpunit && test ! -e vendor/laravel/pint && test ! -e vendor/bin/phpunit
          echo P01_R23_FULL_COMPOSER_PRODUCTION=PASS
          if ! npm ci --no-audit --no-fund --no-progress --quiet >"$RUNNER_TEMP/p01-full-npm.log" 2>&1; then
            echo P01_R23_FULL_NPM_LOCK=FAIL; exit 1
          fi
          if ! npm run build >"$RUNNER_TEMP/p01-full-vite.log" 2>&1; then
            echo P01_R23_FULL_VITE=FAIL; exit 1
          fi
          test -s public/build/manifest.json
          echo P01_R23_FULL_VITE=PASS
      - name: Create genuine output ZIP and verify member bytes and secret exclusion
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          test -z "$(git status --porcelain)"
          python3 scripts/build_clean_full.py --root . --output "$RUNNER_TEMP/p01-full-dev-candidate.zip" --source-sha "a37927c5b2ecb0372816adfb53aef17d0d575611" >"$RUNNER_TEMP/p01-full-builder.log" 2>&1 || {
            echo P01_R23_REAL_FULL_BUILD=FAIL; exit 1
          }
          python3 - "$RUNNER_TEMP/p01-full-dev-candidate.zip" <<'PY'
          import sys,zipfile,shutil,hashlib,json,pathlib
          from scripts.build_clean_full import verify_archive,PackageError,MANIFEST
          z=pathlib.Path(sys.argv[1])
          manifest=verify_archive(z)
          assert manifest["source_sha"]=="a37927c5b2ecb0372816adfb53aef17d0d575611"
          assert manifest["project"]=="P01_STARTNEW"
          assert manifest["type"]=="clean-full-v1"
          assert manifest["version"]=="0.1.0-dev"
          with zipfile.ZipFile(z) as archive:
              names=set(archive.namelist())
              assert archive.read("VERSION")==b"0.1.0-dev\n"
              assert "vendor/autoload.php" in names
              assert "public/build/manifest.json" in names
              assert "vendor/phpunit/phpunit/phpunit" not in names
              assert ".env" not in names and "public/storage" not in names
              assert not any(x.startswith(("storage/app/private/","storage/app/public/")) and not x.endswith("/") for x in names)
              assert not any("credentials" in x.lower() for x in names if x.startswith("storage/"))
              installed=json.loads(archive.read("vendor/composer/installed.json"))
              assert installed["dev"] is False
          print("P01_R23_REAL_FULL_MANIFEST=PASS")
          print("P01_R23_REAL_FULL_FILE_COUNT="+str(len(manifest["files"])))
          print("P01_R23_REAL_FULL_BYTES="+str(z.stat().st_size))
          print("P01_R23_REAL_FULL_SHA256="+hashlib.sha256(z.read_bytes()).hexdigest())
          bad=z.with_name("p01-full-mutated-synthetic-negative.zip")
          shutil.copyfile(z,bad)
          with zipfile.ZipFile(bad,"a") as a:
              a.writestr("storage/app/private/forbidden-synthetic-fixture.txt", b"NO_PRIVATE_USER_DATA")
          try:
              verify_archive(bad)
          except PackageError:
              print("P01_R23_FORGED_SECRET_ZIP_REJECTED=PASS")
          else:
              raise AssertionError("FOREIGN_SECRET_MEMBER_ACCEPTED")
          print("P01_R23_REAL_FULL_BUILD=PASS")
          PY
      - name: Runtime autoload smoke from extracted generated ZIP without install
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          python3 - "$RUNNER_TEMP/p01-full-dev-candidate.zip" "$RUNNER_TEMP/p01-full-extracted" <<'PY'
          import sys,zipfile,pathlib
          from scripts.build_clean_full import verify_archive
          path=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          verify_archive(path)
          with zipfile.ZipFile(path) as src: src.extractall(out)
          assert (out/"vendor/autoload.php").is_file()
          assert (out/"public/build/manifest.json").is_file()
          assert not (out/".env").exists()
          PY
          php -r 'require $argv[1]."/vendor/autoload.php"; exit(class_exists("Illuminate\\Foundation\\Application") ? 0 : 1);' "$RUNNER_TEMP/p01-full-extracted" >"$RUNNER_TEMP/p01-full-php-smoke.log" 2>&1 || {
            echo P01_R23_REAL_FULL_AUTOLOAD=FAIL; exit 1
          }
          echo P01_R23_REAL_FULL_AUTOLOAD=PASS
          echo P01_R23_REAL_FULL_INSTALL=NOT_EXECUTED
          echo P01_R23_REAL_FULL_RELEASE=NOT_AUTHORIZED
      - name: Always erase transient private checkout and all generated ZIPs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src "$RUNNER_TEMP/p01-full-extracted"
          rm -f -- "$RUNNER_TEMP"/p01-full-*
          test ! -e private-src
          test ! -e "$RUNNER_TEMP/p01-full-dev-candidate.zip"
          echo P01_R23_FULL_PRIVATE_CLEANUP=PASS
