name: P01 R22 Global Account Actions Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-r22-account-actions-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'temp/p01-r22-account-actions-gate-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 67ffe44e67909ef5f172f3ba54e4e54da412d41b
      CANDIDATE_SHA: f095b58c8c24666d97f8f170af8158e6671b4a59
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Exact authority
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$BASE_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/work/p01-r22-global-account-actions-20260911" --jq '.object.sha')" = "$CANDIDATE_SHA"
          echo P01_R22_AUTHORITY=PASS

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Static contract and syntax
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          node --check src/assets/auth-controls.js
          php -l tests/unit/global_account_actions_contract.php
          php tests/unit/global_account_actions_contract.php | tee /tmp/r22-contract
          grep -Fx 'P01_R22_GLOBAL_ACCOUNT_ACTIONS_CONTRACT=PASS' /tmp/r22-contract
          grep -Fq '@import url("/asset.php?file=global-account-actions.css");' src/assets/workspace-domain-nav.css
          echo P01_R22_STATIC=PASS

      - name: Fresh install and runtime assets
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-r22-runtime
          cp -a src /tmp/p01-r22-runtime
          cd /tmp/p01-r22-runtime
          php -S 127.0.0.1:18122 -t . >/tmp/p01-r22-server.log 2>&1 &
          echo $! >/tmp/p01-r22-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-r22.cookies -b /tmp/p01-r22.cookies http://127.0.0.1:18122/setup.php -o /tmp/p01-r22-setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-r22-setup.html',encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}R22x"
          curl -fsS -L -c /tmp/p01-r22.cookies -b /tmp/p01-r22.cookies -X POST http://127.0.0.1:18122/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start R22 Gate' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-r22-post.html
          test -f app/.runtime.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          test "$(curl -sS -o /tmp/r22-entry.css -w '%{http_code}' 'http://127.0.0.1:18122/asset.php?file=workspace-domain-nav.css')" = 200
          test "$(curl -sS -o /tmp/r22-account.css -w '%{http_code}' 'http://127.0.0.1:18122/asset.php?file=global-account-actions.css')" = 200
          grep -Fq '/asset.php?file=global-account-actions.css' /tmp/r22-entry.css
          grep -Fq '.vf-global-account-actions' /tmp/r22-account.css
          echo P01_R22_RUNTIME_ASSETS=PASS

      - name: Authenticated and anonymous Chromium UX
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-r22-pw && cd /tmp/p01-r22-pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const base='http://127.0.0.1:18122/';
          const browser=await chromium.launch({headless:true});
          const readCookies=()=>{const raw=fs.readFileSync('/tmp/p01-r22.cookies','utf8').split(/\r?\n/),cookies=[];for(let line of raw){if(!line)continue;if(line.startsWith('#HttpOnly_'))line=line.slice(10);else if(line.startsWith('#'))continue;const p=line.split('\t');if(p.length>=7)cookies.push({name:p[5],value:p[6],url:base});}return cookies;};
          const cookies=readCookies();if(!cookies.length)throw new Error('admin cookies missing');
          const admin=await browser.newContext({viewport:{width:1291,height:797}});await admin.addCookies(cookies);const page=await admin.newPage();
          const inspect=async(path)=>{await page.goto(base+path,{waitUntil:'networkidle'});await page.waitForSelector('.vf-global-account-actions');return await page.evaluate(()=>{const cluster=document.querySelector('.vf-global-account-actions'),links=document.querySelector('.vf-global-domain-links'),settings=cluster?.querySelector('a[href="settings.php"]'),logout=cluster?.querySelector('[data-vf-auth-logout]'),sidebarSettings=document.querySelector('.vf-sidebar-bottom>a[href="settings.php"]'),sidebarLogout=document.querySelector('.vf-sidebar-bottom>a[data-vf-auth-logout]');const r=cluster?.getBoundingClientRect();return{labels:[...cluster.querySelectorAll('a')].map(a=>a.textContent.trim()),right:r?.right,left:r?.left,width:r?.width,linksClient:links?.clientWidth,linksScroll:links?.scrollWidth,settings:!!settings,logout:!!logout,sidebarSettings:sidebarSettings?getComputedStyle(sidebarSettings).display:null,sidebarLogout:sidebarLogout?getComputedStyle(sidebarLogout).display:null,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});};
          const start=await inspect('start.php');if(!start.settings||!start.logout||!start.labels.includes('设置')||!start.labels.includes('退出')||start.right>1291.5||start.right<1260||start.overflow>1||start.sidebarSettings!=='none'||start.sidebarLogout!=='none')throw new Error('admin start '+JSON.stringify(start));
          const watch=await inspect('watch.php');if(!watch.settings||!watch.logout||watch.right>1291.5||watch.right<1260||watch.overflow>1)throw new Error('admin watch '+JSON.stringify(watch));
          const mobile=await browser.newContext({viewport:{width:390,height:844}});await mobile.addCookies(cookies);const mp=await mobile.newPage();await mp.goto(base+'watch.php',{waitUntil:'networkidle'});await mp.waitForSelector('.vf-global-account-actions');const mr=await mp.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect();return{labels:[...c.querySelectorAll('a')].map(a=>a.textContent.trim()),right:r.right,left:r.left,width:r.width,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(!mr.labels.includes('设置')||!mr.labels.includes('退出')||mr.right>390.5||mr.right<375||mr.overflow>1)throw new Error('mobile admin '+JSON.stringify(mr));
          const anon=await browser.newContext({viewport:{width:1291,height:797}});const ap=await anon.newPage();await ap.goto(base+'start.php',{waitUntil:'networkidle'});await ap.waitForSelector('.vf-global-account-actions');const ar=await ap.evaluate(()=>{const c=document.querySelector('.vf-global-account-actions'),r=c.getBoundingClientRect();return{labels:[...c.querySelectorAll('a')].map(a=>a.textContent.trim()),login:!!c.querySelector('[data-vf-auth-login]'),settings:!!c.querySelector('a[href="settings.php"]'),right:r.right,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});if(!ar.login||ar.settings||ar.labels.join('|')!=='登录'||ar.right>1291.5||ar.right<1260||ar.overflow>1)throw new Error('anonymous '+JSON.stringify(ar));await ap.click('.vf-global-account-actions [data-vf-auth-login]');await ap.waitForSelector('[data-vf-auth-dialog][open]');
          console.log('P01_R22_CHROMIUM='+JSON.stringify({start,watch,mobile:mr,anonymous:ar}));await browser.close();
          JS
          node verify.mjs | tee /tmp/r22-browser
          grep -F 'P01_R22_CHROMIUM=' /tmp/r22-browser
          echo P01_R22_CHROMIUM_GATE=PASS

      - name: Final verdict
        run: |
          echo P01_R22_GLOBAL_ACCOUNT_ACTIONS_GATE=PASS
          echo RELEASE=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/p01-r22-server.pid; then kill "$(cat /tmp/p01-r22-server.pid)" 2>/dev/null || true; fi
          rm -rf vf-start /tmp/p01-r22-*