name: P01 backup stale preview exact-source proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247304-backup-preview-proof.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: e8c6129db34ba2f9b49ed93b6caca0084a2ccf80
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout prior formal stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.303
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Prepare PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Focused refresh and backup workflow preservation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = e8c6129db34ba2f9b49ed93b6caca0084a2ccf80
          node --check src/assets/data-recovery.js
          node --check tests/browser/backup_missing_alert_v247297_smoke.cjs
          node tests/browser/backup_missing_alert_v247297_smoke.cjs
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          php tests/unit/backup_missing_alert_v247297_contract.php
          php tests/unit/backup_upgrade_retention_preview_v247298_contract.php
          php tests/unit/backup_storage_capacity_readonly_contract.php
          php tests/unit/admin_backup_typography_readability_contract.php
          php tests/unit/backup_missing_history_readonly_audit_native.php
          echo P01_BACKUP_REFRESH_FOCUSED=PASS
      - name: Canonical no-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_BACKUP_REFRESH_CANONICAL=PASS
