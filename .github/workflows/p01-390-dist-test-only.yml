name: P01 V2.47.390 manifest test only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-390-dist-test-only.yml']
permissions:
  contents: read
jobs:
  p01-dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 239d47bf5ed5d51f94e113eba2a79df416d9fe97
          persist-credentials: false
          path: channel
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring,openssl
          coverage: none
      - name: Exact Update Core V1 tests and published Release digest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C channel rev-parse HEAD)" = "239d47bf5ed5d51f94e113eba2a79df416d9fe97"
          (cd channel && python3 scripts/check_manifest_contract.py > /tmp/p01-update-core-audit.json)
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/p01-update-core-audit.json'))
          assert j['status']=='PASS',j
          print('P01_UPDATE_CORE_MANIFEST_CONTRACT=PASS')
          PY
          find channel/update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-update-core-php-lint.txt
          echo P01_UPDATE_CORE_PHP_LINT=PASS
          (cd channel && php update-core/php/tests/run.php) | tee /tmp/p01-update-core-tests.log
          echo P01_UPDATE_CORE_FULL_TESTS=PASS
          test -n "$GH_TOKEN"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.390 > /tmp/p01-release-390.json
          gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.390 > /tmp/p01-tag-390.json
          python3 - <<'PY'
          import json
          m=json.load(open('channel/projects/P01.json'))
          r=json.load(open('/tmp/p01-release-390.json'))
          t=json.load(open('/tmp/p01-tag-390.json'))
          assert m['target_version']=='2.47.390' and m['from_versions']==['2.47.389']
          assert m['release_id']==r['id']==417060131
          assert m['release_tag']==r['tag_name']=='v2.47.390'
          assert m['product_identity']==t['object']['sha']=='9d2052dbef7d5cf567f05425b5905459609739b9'
          assert m['schema_from']==m['schema_to']=='2026090401'
          a=next(a for a in r['assets'] if a['name']==m['asset_name'])
          assert a['size']==m['asset_bytes']==2583213
          assert a['digest']=='sha256:'+m['asset_sha256']
          assert r['published_at']==m['released_at']
          assert m['backup_required'] and m['rollback_supported']
          print('P01_RELEASE_ASSET_MANIFEST_REMOTE_BINDING=PASS')
          PY
          test -z "$(git -C channel status --porcelain)"
          echo P01_CORE_UPDATES_V247390_EXACT_SOURCE=PASS
      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf channel /tmp/p01-release-390.json /tmp/p01-tag-390.json
