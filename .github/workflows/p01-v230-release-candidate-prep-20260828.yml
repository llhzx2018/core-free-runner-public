name: P01 V2.23.0 Release Candidate Prep
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v230-release-candidate-prep-20260828.yml']
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BRANCH: release/p01-v2.23.0-unified-ui-20260828
      BASE: a421248b38e2dcbf2fe2769cbddc1fcb899f4059
    steps:
      - name: Patch exact release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product checkout -q "$BRANCH"
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          for rel in ['VERSION','src/VERSION.txt']:
              p=Path('product')/rel; s=p.read_text(encoding='utf-8'); assert s.strip()=='2.22.1'; p.write_text('2.23.0\n',encoding='utf-8',newline='\n')
          p=Path('product/src/app/bootstrap.php'); s=p.read_text(encoding='utf-8'); old="define('VF_VERSION', '2.22.1');"; new="define('VF_VERSION', '2.23.0');"; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
          php -l product/src/app/bootstrap.php >/dev/null
          git -C product diff --check
          test "$(git -C product diff --name-only | wc -l)" -eq 3
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add VERSION src/VERSION.txt src/app/bootstrap.php
          git -C product commit -m 'release(P01): prepare V2.23.0 unified surface UI'
          git -C product push origin "$BRANCH"
          SHA=$(git -C product rev-parse HEAD)
          TREE=$(git -C product rev-parse 'HEAD^{tree}')
          echo "RELEASE_CANDIDATE=$SHA"
          echo "RELEASE_TREE=$TREE"
          echo P01_V230_RELEASE_CANDIDATE_PREP=PASS
      - name: Remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          REMOTE=$(git -C product ls-remote origin "refs/heads/$BRANCH"|awk '{print $1}')
          test "$REMOTE" = "$(git -C product rev-parse HEAD)"
          test "$(git -C product show "$REMOTE:VERSION" | tr -d '\r\n')" = 2.23.0
          test "$(git -C product show "$REMOTE:src/VERSION.txt" | tr -d '\r\n')" = 2.23.0
          git -C product show "$REMOTE:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.23.0');" >/dev/null
