name: P02 V2.5.19 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths: ['triggers/p02-v2519-formal-release.txt']

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 135056b12ff7ca26df7dd3a4e5d822e987427600
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize sealed formal pipeline for V2.5.19
        env:
          PRODUCT_REF: 135056b12ff7ca26df7dd3a4e5d822e987427600
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2519-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2519-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.19')
          s=s.replace('2.5.9','2.5.17')
          s=s.replace('32225789953','32282998053')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''";end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.19 is a corrective release-path publication for authenticated Production V2.5.17.\n\n- It carries the already verified V2.5.18 Scratch TAB overflow UX unchanged.\n- The runtime TAB behavior remains: explicit left/right overflow controls, boundary-aware disabled states, automatic active-TAB reveal, wheel/trackpad auxiliary scrolling, and drag-edge auto-scroll.\n- V2.5.18 remains immutable historical release and is not rewritten.\n- OWNER authenticated screenshot proved Production is V2.5.17, so this release provides the canonical direct Atomic path from {SRCVER} to V{VER}.\n- Corrective reseal Run 32282998053 PASS: 74/74 Source Exact, V2.5.18 TAB UX runtime exact, build deploy tree PASS.\n- Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2519-formal.sh"
