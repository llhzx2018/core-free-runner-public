# P07-M05 新服务器初始化 UX15 Formal Release, Owner-approved VF测试 equivalent proof.
# Only the Owner-controlled merge of this exact workflow to public main can publish.
# Existing P07 private native checks remain BLOCKED_INFRA; never overwrite them.
name: P07-M05 UX15 VFTest exact Formal Release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux15-vftest-formal-release.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p07-m05-ux15-vftest-formal-release.yml'
permissions:
  contents: read
jobs:
  ux15-exact-release:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release/p07-m05-ux15-formal-20261126') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'P07 M05 UX15 formal publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_VERSION: '0.1.0'
      TARGET_SHA: '51520a4422c87888f79e349b79914ca1f64826ef'
      TARGET_TREE: '13358d477833462d662a04d5ea0915955191f2b4'
      BUILD: '0.1.0-m05-ux15-rc4-runtime-compat'
      EXPECTED_SHA: 'fa67235dbc9fc7d132b057da7095d5064d1b72f7308a781aa7d616e942d27d99'
      RELEASE_TAG: 'p07-m05-v0.1.0-ux15-rc4-runtime-compat-20261126'
      ASSET: 'P07-M05-0.1.0-m05-ux15-rc4-runtime-compat.zip'
      RECEIPT: 'P07-M05-UX15-FORMAL-RELEASE.json'
    steps:
      - name: Checkout exact public installer and release workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout merged P07 product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '51520a4422c87888f79e349b79914ca1f64826ef'
          path: private-src
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact merged source and preserved case-only machine evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C private-src rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat private-src/VERSION)" = "$TARGET_VERSION"
          grep -Fqx "BUILD_ID = \"$BUILD\"" private-src/scripts/build_p07_m05_bundle.py
          test -f private-src/lib/m05_python_cache_guard.py
          test -f private-src/lib/m05_installed_p07_guard.py
          echo P07_M05_FORMAL_MERGED_PRODUCT_IDENTITY=PASS
      - name: Bind exact DEV proof and reconstruct immutable package without rerunning valid tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git hash-object installers/p07-toolbox.sh)" = 3cf8bc9e7727778e43a35262e58517d47526a7e1
          test "$(git hash-object installers/p07-m05-atomic.py)" = 17e47121ac27f31162d93a72aa0b1dbea602ea01
          grep -Fqx 'M05_BUILD_EXPECTED="0.1.0-m05-ux14-verified-pycache"' installers/p07-toolbox.sh
          root="$RUNNER_TEMP/p07-m05-package-proof"
          mkdir -m 700 "$root"
          cd private-src
          git merge-base --is-ancestor df33592537de14ad8fb324eebe398620e62d2047 HEAD
          git diff --quiet df33592537de14ad8fb324eebe398620e62d2047 HEAD
          python3 -B scripts/build_p07_m05_bundle.py --output "$root/ux15.zip"
          printf '%s  %s\n' "$EXPECTED_SHA" "$root/ux15.zip" | sha256sum -c -
          cd ..
          curl -q --proto '=https' --tlsv1.2 -fsSL --retry 1 --max-time 95 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux14-verified-pycache-20261125/P07-M05-0.1.0-m05-ux14-verified-pycache.zip' -o "$root/ux14-official.zip" || curl -q --proto '=https' --tlsv1.2 -fsSL -H 'Accept: application/octet-stream' 'https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/assets/790455651' -o "$root/ux14-official.zip"
          printf '%s  %s\n' '8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d' "$root/ux14-official.zip" | sha256sum -c -
          python3 -B - "$root" <<'PY'
          import hashlib,importlib.util,json,os,pathlib,stat,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location("atomic",pathlib.Path("installers/p07-m05-atomic.py"))
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          old=root/"ux14-official.zip"; new=root/"ux15.zip"
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert m.read_verified_archive(new,sha(new))[0]==os.environ["BUILD"]
          with zipfile.ZipFile(old) as a,zipfile.ZipFile(new) as b:
              assert b.testzip() is None
              assert len(b.namelist())==len(set(b.namelist()))
              changes={n for n in set(a.namelist())|set(b.namelist()) if n not in a.namelist() or n not in b.namelist() or a.read(n)!=b.read(n)}
              assert changes=={"p07-m05/BUILD_ID","p07-m05/MODULE_BUILD_ID","p07-m05/MODULE_MANIFEST.json","p07-m05/lib/m05_owner_trial_guard.py","p07-m05/lib/m03_trial_retirement.py"}, sorted(changes)
              for name in b.namelist():
                  i=b.getinfo(name); p=pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and ".." not in p.parts and stat.S_IFMT(i.external_attr>>16)==stat.S_IFREG
              tampered=root/"tampered.zip"
              with zipfile.ZipFile(tampered,"w") as t:
                  for info in b.infolist():
                      t.writestr(info,b"invalid\n" if info.filename=="p07-m05/MODULE_BUILD_ID" else b.read(info))
              try: m.read_verified_archive(tampered,sha(tampered))
              except m.Unsafe: pass
              else: raise AssertionError("tampered manifest accepted")
          print("P07_M05_EXACT_UX14_UX15_ARCHIVE_DELTA=PASS")
          print("P07_M05_FORMAL_FINAL_ARCHIVE_IDENTITY_AND_MANIFEST_DENIAL=PASS")
          PY
      - name: Checkout pinned current GOV structural delivery authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 20631614c585aab137c7be89828f21408697491f
          path: gov-rules
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Structural check of actual user public CLI entrypoint and source authority
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C gov-rules rev-parse HEAD)" = "20631614c585aab137c7be89828f21408697491f"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          script=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"installers"/"p07-toolbox.sh"
          assert script.is_file() and not script.is_symlink()
          script_sha256=hashlib.sha256(script.read_bytes()).hexdigest()
          assert len(script_sha256)==64 and script_sha256!=os.environ["EXPECTED_SHA"]
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"p07-m05-task-delivery-receipt.json"
          data={
            "schema":"vf.public-authority.task-delivery-check.v1",
            "project":"P07",
            "source":os.environ["TARGET_SHA"],
            "project_authority":{
              "agents":"AGENTS.md",
              "current":"docs/authority/CURRENT.md",
              "acceptance":"docs/authority/ACCEPTANCE_MATRIX.md",
              "applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"
            },
            "acceptance_markers":["P07-PUBLIC-01","P07-PUBLIC-03","P07-PUBLIC-05"],
            "delivery":{
              "profile":"cli_one_command",
              "entrypoint":"p07-toolbox.sh",
              "artifact":"installers/p07-toolbox.sh",
              "sha256":script_sha256,
              "requires_git":False,
              "requires_manual_source_copy":False
            },
            "required_domains":["INSTALL","SECURITY","TESTING","UPGRADE","DATA_SCHEMA","GIT"],
            "task_capabilities":["installer","candidate","existing_install_transition","database","release_source"]
          }
          p.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True),encoding="utf8")
          PY
          python3 -B gov-rules/governance/public-authority/tools/task_delivery_contract_lint.py \
            --phase delivery --receipt "$RUNNER_TEMP/p07-m05-task-delivery-receipt.json" \
            --project-root "$GITHUB_WORKSPACE/private-src" --artifact-root "$GITHUB_WORKSPACE" \
            --public-router "$GITHUB_WORKSPACE/gov-rules/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json"
          echo P07_M05_PUBLIC_TASK_DELIVERY_STRUCTURAL=PASS
      - name: Build immutable release receipt and SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export RELEASE_HOME="$RUNNER_TEMP/p07-m05-package-proof"
          cp "$RELEASE_HOME/ux15.zip" "$RELEASE_HOME/$ASSET"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RELEASE_HOME"])
          target=root/os.environ["ASSET"]
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          assert digest==os.environ["EXPECTED_SHA"]
          receipt={
            "schema":"vf.p07.m05.ux15.release/v1",
            "module_id":"P07-M05",
            "module_name":"新服务器初始化",
            "build_id":os.environ["BUILD"],
            "source_commit":os.environ["TARGET_SHA"],
            "source_tree":os.environ["TARGET_TREE"],
            "formal_tag":os.environ["RELEASE_TAG"],
            "archive_name":target.name,
            "archive_sha256":digest,
            "previous_formal_build":"0.1.0-m05-ux14-verified-pycache",
            "previous_formal_sha256":"8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d",
            "proofs":{
              "unchanged_75_guard_cases":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45739918807",
              "final_16_and_actual_issued_pair":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45740014330",
              "unchanged_native_db_and_terminal":"https://github.com/llhzx2018/core-free-runner-public/actions/runs/45532493968"
            },
            "domains":{"INSTALL":"PASS","UPGRADE":"PASS","SECURITY":"PASS","TESTING":"PASS","DATA_SCHEMA":"PASS_UNCHANGED_DB_AND_BUSINESS_DENIAL","GIT":"PASS_PREISSUE","UA_UI":"PASS_UNCHANGED_TERMINAL_AND_FINAL_PUBLIC_GATED","API_PROVIDER":"CONDITIONAL_UNCHANGED","CRON_JOB":"N_A_UNCHANGED","OBSERVABILITY":"PASS_READ_ONLY_GUARD_AND_DENIAL","PERFORMANCE":"CONDITIONAL_BOUNDED_SCAN","SEO":"N_A","NOTIFICATION":"N_A"},
            "owner_preview":"N_A_SOURCE_ONLY_CLI","owner_real_use":"PENDING_MANUAL",
            "native_product_checks":"BLOCKED_INFRA_NOT_RELABELED_PASS",
            "owner_vps":"NOT_TOUCHED",
            "production":"MANUAL_ONLY",
          }
          manifest=root/os.environ["RECEIPT"]
          manifest.write_text(json.dumps(receipt,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf8")
          rows=[(target,digest),(manifest,hashlib.sha256(manifest.read_bytes()).hexdigest())]
          (root/"SHA256SUMS").write_text("".join(f"{h}  {f.name}\n" for f,h in rows),encoding="ascii")
          print("P07_M05_UX15_RELEASE_RECEIPT=PASS")
          PY
          (cd "$RELEASE_HOME" && sha256sum -c SHA256SUMS)
      - name: Publish exact immutable product and public GitHub releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$GH_TOKEN" || { echo P07_M05_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          p=llhzx2018/vf-server-ops
          r=llhzx2018/core-free-runner-public
          root="$RUNNER_TEMP/p07-m05-package-proof"
          test "$(gh api "repos/$p/branches/main" --jq '.commit.sha')" = "$TARGET_SHA" || {
            echo P07_M05_PRODUCT_MAIN_MOVED_STOP; exit 13; }
          if gh release view "$RELEASE_TAG" -R "$p" >/dev/null 2>&1; then
            test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA" || exit 13
          else
            if gh api "repos/$p/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$p" --target "$TARGET_SHA" \
              --title "P07-M05 新服务器初始化 UX15" \
              --notes "Only P07-M05. VF测试 exact-source gate and immutable SHA256. Source merge is separate from Production; Owner manually upgrades VPS."
          fi
          if gh release view "$RELEASE_TAG" -R "$r" >/dev/null 2>&1; then
            test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA" || exit 13
            test "$(gh api "repos/$r/releases/tags/$RELEASE_TAG" --jq '.assets|length')" = 3 || exit 13
          else
            if gh api "repos/$r/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 13; fi
            gh release create "$RELEASE_TAG" -R "$r" --target "$GITHUB_SHA" \
              --title "P07-M05 UX15 verified module release" \
              --notes "Only the new server initialization module. Current public toolbox pin remains UX14 until separate artifact-readback and upgrade gate."
            gh release upload "$RELEASE_TAG" -R "$r" \
              "$root/$ASSET" "$root/$RECEIPT" "$root/SHA256SUMS"
          fi
          dest="$RUNNER_TEMP/p07-m05-remote-proof"
          mkdir -p "$dest"
          gh release download "$RELEASE_TAG" -R "$r" --dir "$dest"
          (cd "$dest" && sha256sum -c SHA256SUMS)
          cmp "$root/$RECEIPT" "$dest/$RECEIPT"
          test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          echo P07_M05_UX15_BOTH_RELEASES_REMOTE_READBACK=PASS
          echo P07_M05_PUBLIC_TOOLBOX_PIN=UX14_UNCHANGED
      - name: Always erase private source and transient test/archive bytes
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/private-src" "$GITHUB_WORKSPACE/gov-rules" "$RUNNER_TEMP/p07-m05-package-proof" "$RUNNER_TEMP/p07-m05-remote-proof"
          test ! -e "$GITHUB_WORKSPACE/private-src"
          test ! -e "$GITHUB_WORKSPACE/gov-rules"
          rm -f -- "$RUNNER_TEMP/p07-m05-task-delivery-receipt.json"
          echo P07_M05_PRIVATE_SOURCE_AND_ARCHIVE_CLEANUP=PASS
