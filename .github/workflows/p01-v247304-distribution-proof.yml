name: P01 V247304 core-updates exact discovery integrity gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247304-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates P01 manifest candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 3a25ea257c44482cca6bd077646f2ba6713d1a00
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Setup PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Validate all update manifests and P01 asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json,subprocess
          m=json.load(open('projects/P01.json',encoding='utf-8'))
          assert m['project_id']=='P01'
          assert m['current_version']=='2.47.303' and m['target_version']=='2.47.304'
          assert m['from_versions']==['2.47.303'] and m['update_type']=='ATOMIC'
          assert m['schema_from']==m['schema_to']=='2026090401'
          assert m['product_identity']=='a139241f30e47c678f360b24f51f2bd2b573695d'
          assert m['backup_required'] and m['rollback_supported']
          assert m['release_id']==407607378 and m['release_tag']=='v2.47.304'
          assert __import__('os').environ.get('GH_TOKEN'), 'Registered read-only GitHub release metadata token required'
          release=json.loads(subprocess.check_output(['gh','api','repos/llhzx2018/vf-start/releases/tags/v2.47.304'],text=True))
          assert release['id']==m['release_id'] and release['tag_name']==m['release_tag']
          assert not release['draft'] and not release['prerelease']
          assets=[a for a in release['assets'] if a['name']==m['asset_name']]
          assert len(assets)==1
          a=assets[0]
          assert a['size']==m['asset_bytes']
          assert a['digest']=='sha256:'+m['asset_sha256']
          print('P01_V247304_DIST_RELEASE_EXACT_MATCH=PASS')
          PY
      - name: Run update core native regression
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_V247304_CORE_UPDATES_NATIVE=PASS
