name: P07 Intrusion Evidence Runtime Health Exact Source Gate

on:
  push:
    branches:
      - 'gate/p07-intrusion-evidence-v01-20260907'
    paths:
      - '.github/workflows/p07-intrusion-evidence-runtime-health-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public runner branch
        uses: actions/checkout@v4

      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-server-ops
          ref: 3008c2db06032ca90699d0338063af2b67a2a309
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p07-source
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-source rev-parse HEAD)" = '3008c2db06032ca90699d0338063af2b67a2a309'
          test "$(cat p07-source/modules/system-care/VERSION)" = '0.1.0-rc7'

      - name: Run System Care static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash p07-source/modules/system-care/tests/static_gate.sh

      - name: Run System Care functional gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash p07-source/modules/system-care/tests/functional_gate.sh

      - name: Compile intrusion evidence Python helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            p07-source/modules/system-care/lib/intrusion_scan.py \
            p07-source/modules/system-care/lib/intrusion_evidence.py \
            p07-source/modules/system-care/lib/intrusion_logs.py \
            p07-source/modules/system-care/lib/intrusion_state.py

      - name: Public-safe result
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P07_INTRUSION_EVIDENCE_RUNTIME_HEALTH_EXACT_SOURCE=3008c2db06032ca90699d0338063af2b67a2a309'
          echo 'P07_INTRUSION_EVIDENCE_RUNTIME_HEALTH_SYNTHETIC_GATE=PASS'

      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: rm -rf p07-source
