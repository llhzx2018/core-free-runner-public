name: P07 Five-Module Independent Upgrade Isolation
on:
  push:
    branches: [main, feat/p07-unified-independent-module-router-20261112]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-vf-node-independent-rc13.sh'
      - 'installers/p07-system-care-rc83-isolated.sh'
      - 'installers/p07-m05-atomic.py'
      - 'tests/test_p07_*.py'
      - 'dist/p07/candidates/five-modules-stage-20261112.json'
      - '.github/workflows/p07-unified-modules-20261112.yml'
  pull_request:
    branches: [main, feat/p07-m02-independent-20261112]
    paths:
      - 'installers/p07-toolbox.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-vf-node-independent-rc13.sh'
      - 'installers/p07-system-care-rc83-isolated.sh'
      - 'installers/p07-m05-atomic.py'
      - 'tests/test_p07_*.py'
      - 'dist/p07/candidates/five-modules-stage-20261112.json'
      - '.github/workflows/p07-unified-modules-20261112.yml'
permissions:
  contents: read
jobs:
  unified-module-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Five selected-module routing and M04 native exact-pinned installer
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-toolbox.sh
          python3 -B -c 'import ast,pathlib; ast.parse(pathlib.Path("installers/p07-m05-atomic.py").read_text(encoding="utf-8"))'
          python3 -B -m unittest discover -s tests -p 'test_p07_*_isolation.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m04_unified_route.py' -v
          sudo env P07_M04_HOSTED_NATIVE_TEST=1 python3 -B -m unittest discover -s tests -p 'test_p07_m04_unified_route.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_unified_route.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_independent_versions.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m02_m03_upgrade_stage.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_owner_trial_single_entry.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_five_module_stage_lock.py' -v
          sudo env P07_M01_HOSTED_UNIFIED=1 python3 -B -m unittest discover -s tests -p 'test_p07_m01_unified_route.py' -v
          echo P07_M01_M02_M04_M05_ROUTER_SEPARATE=PASS_SYNTHETIC
          echo P07_M04_OWN_PACKAGE_INSTALLED=PASS
          echo P07_M03_PHYSICAL_UPGRADE=SEE_SEPARATE_OFFICIAL_RELEASE114_TO115_NATIVE_JOB
          echo P07_M05_FULL_INSTALL_DISTRIBUTION=NOT_RELEASED
          echo P07_FORMAL_RELEASE=NO
  m03-owned-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout immutable official P07-M03 网站与数据 release114 source and package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 9561d8a30d6cadda40442461e54cf8d35d551eda
          path: historical_m03
          persist-credentials: false
          fetch-depth: 1
      - name: Verify P07-M03 网站与数据 independent stable installer in disposable directory
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-final.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_runtime_isolation.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_previous_protection.py' -v
          sudo env GITHUB_ACTIONS=true P07_M03_NATIVE_TEST=1 python3 -B -m unittest discover -s tests -p 'test_p07_m03_runtime_rollback.py' -v
          P07_M03_DISPOSABLE_RUNNER=1 python3 -B -m unittest discover -s tests -p 'test_p07_m03_runtime_isolation.py' -v
          sudo env GITHUB_ACTIONS=true P07_M03_NATIVE_FULL=1 python3 -B -m unittest discover -s tests -p 'test_p07_m03_real_cross_version_install.py' -v
          echo P07_M03_OFFICIAL_RELEASE114_TO115_PHYSICAL_UPGRADE=PASS
          echo P07_M03_PRIVATE_OWNED_RUNTIME=PASS
          echo P07_M01_M02_M04_M05_UNCHANGED=PASS_SYNTHETIC
          echo P07_REAL_MIGRATION=NOT_RUN
          echo P07_PRODUCTION=NO
  all-five-native-coexistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public Toolbox candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout M05 exact private product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 86469cf1ec09561ad5cd2357c6921b0b8d5e4c97
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Checkout P07-M05 新服务器初始化 exact old candidate1 ZIP privately for cross-version upgrade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 946e790cb681c77658ebba1f9675a859709adeb3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: previous_m05
      - name: Refuse any existing target outside disposable checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "86469cf1ec09561ad5cd2357c6921b0b8d5e4c97"
          test "$(git -C previous_m05 rev-parse HEAD)" = "946e790cb681c77658ebba1f9675a859709adeb3"
          echo "226f7cb0f4674072979e9946e639500fc05d77f92fec59a508c6eea7303f458b  previous_m05/owner-trial/P07-M05-0.1.0-m05-candidate1.zip" | sha256sum -c -
          for path in /opt/vfops-modules/m01 /opt/vfops-modules/m02 /opt/vfops-modules/m03 /opt/vfops-modules/m04 /opt/vfops-modules/m05 /opt/vf-server-ops /opt/vf-server-ops.previous /usr/local/bin/vfops; do
            test ! -e "$path" && test ! -L "$path"
          done
          touch /tmp/p07-five-disposable-owned
      - name: P07-M05 新服务器初始化 · protect all host writes and check candidate2 SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_host_write_gate.py' -v
          python3 -B -m unittest discover -s product/tests -p 'test_p07_m05_db_engine_boundary.py' -v
          python3 -B product/scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/p07-m05-candidate2-private.zip" > "$RUNNER_TEMP/p07-m05-candidate2-receipt.json"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path(os.environ["RUNNER_TEMP"])
          payload=json.loads((folder/"p07-m05-candidate2-receipt.json").read_text())
          content=(folder/"p07-m05-candidate2-private.zip").read_bytes()
          observed=hashlib.sha256(content).hexdigest()
          assert payload["build_id"]=="0.1.0-m05-candidate2"
          assert payload["module_id"]=="P07-M05"
          assert payload["sha256"]==observed
          assert payload["formal_release"] is False
          assert payload["production_install"] is False
          print("P07_M05_CANDIDATE2_EXACT_PRIVATE_SHA256="+observed)
          print("P07_M05_CANDIDATE2_FILE_COUNT="+str(payload["file_count"]))
          PY
      - name: Install all five separately, reapply each, atomic M05 upgrade and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo env P07_NATIVE_FIVE=1 GITHUB_ACTIONS=true RUNNER_TEMP="$RUNNER_TEMP" python3 -B -m unittest discover -s tests -p 'test_p07_five_module_native_coexistence.py' -v
          echo P07_ALL_FIVE_NATIVE_UPGRADE_ISOLATION=PASS
          echo P07_M05_MYSQL_MARIADB_CHOOSER_BUNDLED=PASS_NO_CLOUDPANEL_EXEC
          echo P07_OWNER_PRODUCTION=NOT_TOUCHED
          echo P07_MIGRATION=NOT_RUN
          echo P07_FORMAL_RELEASE=NO
      - name: Deposit exact verified M05 candidate2 ZIP ONLY in private product Owner trial branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/feat/p07-unified-independent-module-router-20261112'
        shell: bash
        env:
          P07_PRIVATE_CANDIDATE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "${P07_PRIVATE_CANDIDATE_WRITE_TOKEN:-}" || { echo P07_PRIVATE_CANDIDATE_WRITE_CAPABILITY=MISSING; exit 13; }
          test "$(git -C product rev-parse HEAD)" = '86469cf1ec09561ad5cd2357c6921b0b8d5e4c97'
          test -f "$RUNNER_TEMP/p07-m05-candidate2-private.zip"
          echo "835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb  $RUNNER_TEMP/p07-m05-candidate2-private.zip" | sha256sum -c -
          export P07_TRIAL_ZIP="$RUNNER_TEMP/p07-m05-candidate2-private.zip"
          python3 -B - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.error, urllib.request
          data=pathlib.Path(os.environ['P07_TRIAL_ZIP']).read_bytes()
          expected='835356e2af2f89877e79d904f47b1ad38602983aa760978657ac4bb3c7593adb'
          if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('P07_M05_CANDIDATE2_BUILD_HASH_MISMATCH')
          token=os.environ['P07_PRIVATE_CANDIDATE_WRITE_TOKEN']
          api='https://api.github.com/repos/llhzx2018/vf-server-ops'
          branch='owner-trial/p07-m05-20261112-candidate2-private-zip'
          filename='owner-trial/P07-M05-0.1.0-m05-candidate2.zip'
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'P07-M05-Private-Owner-Trial'}
          def request(resource,method='GET',payload=None):
              body=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              req=urllib.request.Request(api+resource,data=body,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=45) as response: return json.load(response)
          ref=request('/git/ref/heads/'+branch)
          if ref.get('object',{}).get('sha')!='86469cf1ec09561ad5cd2357c6921b0b8d5e4c97':
              raise SystemExit('P07_M05_PRIVATE_TRIAL_BRANCH_MOVED_DENY')
          # Contents create-only; refuse overwrite if already present.
          filename_path='/contents/'+filename
          try:
              request(filename_path+'?ref='+branch)
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          else:
              raise SystemExit('P07_M05_PRIVATE_TRIAL_ZIP_EXISTS_DENY')
          result=request(filename_path,'PUT',{'message':'build(P07-M05 新服务器初始化): exact private candidate2 Owner trial ZIP (not a release)','branch':branch,'content':base64.b64encode(data).decode('ascii')})
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if result.get('content',{}).get('sha')!=blob or not result.get('commit',{}).get('sha'):
              raise SystemExit('P07_M05_PRIVATE_TRIAL_COMMIT_UNVERIFIED')
          remote=request('/git/blobs/'+blob)
          if remote.get('encoding')!='base64' or hashlib.sha256(base64.b64decode(remote['content'])).hexdigest()!=expected:
              raise SystemExit('P07_M05_PRIVATE_TRIAL_REMOTE_READBACK_FAILED')
          print('P07_M05_CANDIDATE2_PRIVATE_ZIP_CREATED_AND_REMOTE_READBACK=PASS')
          print('P07_M05_CANDIDATE2_PRIVATE_ZIP_SHA256='+expected)
          print('P07_M05_CANDIDATE2_PRIVATE_GIT_BLOB_SHA1='+blob)
          print('P07_M05_CANDIDATE2_PRIVATE_COMMIT='+result['commit']['sha'])
          print('P07_M05_PUBLIC_ARTIFACT=NONE')
          print('P07_M05_FORMAL_RELEASE=NO')
          print('P07_M05_PRODUCTION=NO')
          PY
      - name: Always clean sensitive private checkout and owned ephemeral modules
        if: always()
        shell: bash
        run: |
          set +e
          if test -f /tmp/p07-five-disposable-owned; then
            if test -L /usr/local/bin/vfops && test "$(readlink /usr/local/bin/vfops)" = '/opt/vf-server-ops/bin/vfops-user'; then sudo rm -f /usr/local/bin/vfops; fi
            sudo rm -rf /opt/vfops-modules/m01 /opt/vfops-modules/m02 /opt/vfops-modules/m03 /opt/vfops-modules/m04 /opt/vfops-modules/m05 /opt/vf-server-ops /opt/vf-server-ops.previous
            rm -f /tmp/p07-five-disposable-owned
          fi
          rm -rf -- product previous_m05
          echo P07_PRIVATE_CHECKOUT_AND_NATIVE_MODULES_CLEANUP=YES
