name: P04 V2.7 Final UI Candidate Gate

on:
  push:
    branches:
      - p04-v270-final-ui-candidate-gate-tmp
    paths:
      - .github/workflows/p04-v270-final-ui-candidate-gate.yml

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-infra
      PRODUCT_HEAD: ad3031313d31302c41e0c9528bd04b81ba06724c
      AUTHORITY_HEAD: 2b9209fb5c5a8d5ec4f7ea770fa473962fdccb9c
      PRODUCT_VERSION: 2.7.0
      PRODUCT_SCHEMA: '14'
    steps:
      - name: Checkout gate harness
        uses: actions/checkout@v4

      - name: Require existing private read authority
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"

      - name: Checkout exact polished P04 runtime
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ad3031313d31302c41e0c9528bd04b81ba06724c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: vf-src

      - name: Verify exact identity and polish-only delta
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = "$PRODUCT_VERSION"
          test "$(jq -r '.schema_version' VF_PROJECT.json)" = "$PRODUCT_SCHEMA"
          test "$(jq -r '.migration // "NONE"' VF_PROJECT.json)" = "NONE"
          mapfile -t changed < <(git diff --name-only "$AUTHORITY_HEAD" "$PRODUCT_HEAD")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'public/assets/v270-final-polish.css'
          printf '%s\n' "${changed[@]}" | grep -Fx 'public/index.php'
          test -z "$(git diff --name-only "$AUTHORITY_HEAD" "$PRODUCT_HEAD" -- VERSION VF_PROJECT.json migrations public/assets/v270-reference-lock.js public/assets/v270-personal-infra.css public/bootstrap.php public/api.php public/experience.php)"
          test "$(git diff --numstat "$AUTHORITY_HEAD" "$PRODUCT_HEAD" -- public/index.php | awk '{print $1":"$2}')" = "1:0"
          git diff "$AUTHORITY_HEAD" "$PRODUCT_HEAD" -- public/index.php | grep -F 'v270-final-polish.css'
          ! grep -Eqi '(api[_-]?key|secret|token|password)[[:space:]]*[:=][[:space:]]*["'"'][^"'"']{8,}' public/assets/v270-final-polish.css
          echo P04_V270_POLISH_ONLY_DELTA=PASS

      - name: PHP syntax and existing unit contract regression
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find . -type f -name '*.php' -print0)
          for t in tests/unit/*.php; do
            echo "RUN $t"
            php "$t"
          done
          echo P04_V270_PHP_LINT=PASS
          echo P04_V270_UNIT_CONTRACTS=PASS

      - name: Install Chromium test runtime
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start disposable real runtime and run final-polish browser gate
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f public/config.php public/*.sqlite public/*.sqlite-* || true
          rm -rf public/data public/storage var/data var/sessions evidence-final-ui
          mkdir -p evidence-final-ui
          export VF_INFRA_E2E_ADMIN_CREDENTIAL="P04-CANDIDATE-$(openssl rand -hex 16)"
          php -S 127.0.0.1:18998 -t public > evidence-final-ui/php-server.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18998/setup.php >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18998/setup.php >/dev/null
          VF_INFRA_E2E_BASE_URL=http://127.0.0.1:18998 \
          VF_INFRA_E2E_ADMIN_CREDENTIAL="$VF_INFRA_E2E_ADMIN_CREDENTIAL" \
          VF_INFRA_E2E_WEB_ROOT="$PWD/public" \
          VF_V270_TESTED_RUNTIME_COMMIT="$PRODUCT_HEAD" \
          VF_V270_EVIDENCE_DIR="$PWD/evidence-final-ui" \
          node tests/e2e/v270-final-polish-evidence.mjs | tee evidence-final-ui/e2e.log
          echo P04_V270_FINAL_POLISH_BROWSER_E2E=PASS

      - name: Security regression assertions
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f public/config.php
          mode="$(stat -c '%a' public/config.php)"
          case "$mode" in 600|640) ;; *) echo "unsafe config mode: $mode"; exit 71;; esac
          unauth_code="$(curl -sS -o /tmp/p04-unauth.out -w '%{http_code}' -H 'Accept: application/json' 'http://127.0.0.1:18998/api.php?action=snapshot')"
          test "$unauth_code" = "401" -o "$unauth_code" = "403"
          ! grep -RIlE '(VF_PRIVATE_READ_TOKEN|VF_RELEASE_WRITE_TOKEN|ghp_[A-Za-z0-9]{20,}|github_pat_)' evidence-final-ui public/config.php
          echo "CONFIG_MODE=$mode" > evidence-final-ui/security-regression.txt
          echo "UNAUTH_API_HTTP=$unauth_code" >> evidence-final-ui/security-regression.txt
          echo 'SECURITY_REGRESSION=PASS' >> evidence-final-ui/security-regression.txt
          echo P04_V270_SECURITY_REGRESSION=PASS

      - name: Verify visual evidence inventory and create manifest
        working-directory: vf-src
        shell: bash
        run: |
          set -Eeuo pipefail
          png_count="$(find evidence-final-ui -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$png_count" -ge 12
          sha256sum evidence-final-ui/*.png > evidence-final-ui/SHA256SUMS
          cat > evidence-final-ui/CANDIDATE_GATE_MANIFEST.json <<JSON
          {
            "project":"P04 · VF Infra",
            "status":"READY_FOR_ACTUAL_PIXEL_REVIEW",
            "runtime_commit":"$PRODUCT_HEAD",
            "authority_commit":"$AUTHORITY_HEAD",
            "version":"$PRODUCT_VERSION",
            "schema":14,
            "migration":"NONE",
            "owner_real_use":"PASS",
            "final_ui_polish":"TESTED",
            "affected_functional_regression":"PASS",
            "security_regression":"PASS",
            "browser_e2e":"PASS",
            "screenshot_count":$png_count,
            "production_write":0,
            "candidate_created":false
          }
          JSON
          cat evidence-final-ui/CANDIDATE_GATE_MANIFEST.json

      - name: Upload exact browser and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.0-FINAL-UI-CANDIDATE-GATE
          path: vf-src/evidence-final-ui
          if-no-files-found: error
          retention-days: 30
