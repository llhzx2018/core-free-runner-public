name: P04 V2.5.4 Mutation Observer Fix

on:
  push:
    paths:
      - '.github/workflows/p04-v254-mutation-loop-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Make page-description observer idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/v254-ui.js')
          s=p.read_text(encoding='utf-8')
          old="""    desc.textContent = descriptions[currentView()] || '';
    desc.hidden = !desc.textContent;
    qsa('.nav-item[data-nav]').forEach((item) => {
      const active = item.dataset.nav === currentView();
      if (active) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    });"""
          new="""    const nextDescription = descriptions[currentView()] || '';
    if (desc.textContent !== nextDescription) desc.textContent = nextDescription;
    const shouldHide = nextDescription === '';
    if (desc.hidden !== shouldHide) desc.hidden = shouldHide;
    qsa('.nav-item[data-nav]').forEach((item) => {
      const active = item.dataset.nav === currentView();
      if (active) {
        if (item.getAttribute('aria-current') !== 'page') item.setAttribute('aria-current', 'page');
      } else if (item.hasAttribute('aria-current')) {
        item.removeAttribute('aria-current');
      }
    });"""
          if s.count(old)!=1: raise SystemExit('observer sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check public/assets/v254-ui.js
          git diff --check
          test "$(git diff --name-only)" = 'public/assets/v254-ui.js'
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add public/assets/v254-ui.js
          git commit -m 'fix(P04): make V2.5.4 UI observer idempotent'
          git push origin HEAD:maintenance/p04-v2.5.4-full-backend-ui-20260816
