name: TEMP S01 Core Updates Fingerprints

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Ops release main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a1eda8f80f8a7969b3b4d580b4b822c804c24984
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Checkout exact M3U8 release main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: e0bae05a97b5f1369ce1233438b3baed13ac503e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8
      - name: Compute canonical runtime fingerprints
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,json
          from pathlib import Path
          def fp(files):
              payload=b''.join(path.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for path,data in sorted(files.items()))
              return hashlib.sha256(payload).hexdigest()
          ops=Path('ops')
          def ops_runtime(rel):
              p=rel.as_posix().lstrip('/'); parts=p.split('/')
              if not p or '..' in parts:return False
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I):return False
              if '/' not in p:return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          of={p.relative_to(ops).as_posix():p.read_bytes() for p in ops.rglob('*') if p.is_file() and not p.is_symlink() and ops_runtime(p.relative_to(ops))}
          root=Path('m3u8/src')
          mf={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}
          out={
            'ops':{'sha':'a1eda8f80f8a7969b3b4d580b4b822c804c24984','runtime_file_count':len(of),'runtime_fingerprint_sha256':fp(of)},
            'm3u8':{'sha':'e0bae05a97b5f1369ce1233438b3baed13ac503e','runtime_file_count':len(mf),'runtime_fingerprint_sha256':fp(mf)}
          }
          assert out['ops']['runtime_file_count']==890, out
          assert out['m3u8']['runtime_file_count']==549, out
          print(json.dumps(out,sort_keys=True))
          Path('/tmp/s01-runtime-fingerprints.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Upload fingerprint evidence
        uses: actions/upload-artifact@v4
        with:
          name: s01-runtime-fingerprints-${{ github.run_id }}
          path: /tmp/s01-runtime-fingerprints.json
          retention-days: 14
