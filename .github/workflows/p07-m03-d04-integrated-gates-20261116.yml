name: P07 D04 consolidated safe development gates
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-integrated-gates-20261116.yml'
permissions:
  contents: read
jobs:
  p07-d04-exact-source-guard-review:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout temporary public harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient exact source with main diff
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7f784d99de1b36b063177a60ae6b78122345234c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private-integrated
      - name: Transient canonical governance checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .gov-rules
      - name: Prepare isolated local TLS tests
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx openssl curl >/dev/null
      - name: Full current D04 safe-unit and local Nginx sweep
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-integrated rev-parse HEAD)" = "7f784d99de1b36b063177a60ae6b78122345234c"
          cd .p07-private-integrated
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_d04_*.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_dynamic_sqlite_scope.py' -v
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_mysql84_receiver_preflight.py' -v
          python3 -B -m unittest discover -s tests -p 'test_migration_failed_prepare_audit.py' -v
          echo P07_D04_EXACT_SOURCE_CONSOLIDATED_SAFE_SUITE=PASS
      - name: Full module ownership and canonical real diff architecture
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-private-integrated
          git fetch --no-tags origin main:refs/remotes/origin/main >/dev/null 2>&1
          BASE="$(git merge-base origin/main HEAD)"
          test -n "$BASE"
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D04 --pr-title 'P07-M03-D04 服务器迁移：合并前一次性全集成验收' \
            --base-ref origin/main --affected P07-M03-D04 \
            --shared-reason '仅 D04 迁移及其旧 D04 迁移 helper'
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.gov-rules --git-root . --base-sha "$BASE" \
            --head-sha "7f784d99de1b36b063177a60ae6b78122345234c"
          echo P07_D04_EXACT_DIFF_MODULE_AND_ARCHITECTURE=PASS
      - name: Remove transient private source and governance checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-integrated .gov-rules
          test ! -e .p07-private-integrated
          test ! -e .gov-rules
          echo P07_D04_INTEGRATED_PRIVATE_WORKSPACES_CLEAN=PASS
