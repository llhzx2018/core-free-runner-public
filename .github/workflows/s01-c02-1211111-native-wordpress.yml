name: S01 Ops 1.21.1111 published WordPress native update
on:
  push:
    branches: [task/s01-ops1111-publish-20261013]
    paths: [.github/workflows/s01-c02-1211111-native-wordpress.yml]
permissions:
  contents: read
jobs:
  published-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: vf_ops_discovery
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
          MARIADB_ROOT_PASSWORD: fixture-only-root
        ports: [3306:3306]
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only-root"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_SHA: a93d19dd9e920470b7244308189e45cedab8ed98
      SOURCE_VERSION: '1.21.1109'
      TARGET_VERSION: '1.21.1111'
      CHANNEL_SHA: 9b4b97251d51c64903de5d7926792fdc51d67427
      EXPECTED_BYTES: '3581602'
      EXPECTED_SHA: 38e6a096a387b4a8d7b687e33bc963907aa781ae9d3410e0bf07a2987c578dee
    steps:
      - name: Checkout prior proven native WordPress verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ef8c7bff9e6fa36266742831e29cd427b71632fe
          persist-credentials: false
          path: historic
      - name: Prepare disposable WordPress and verify exact channel source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CHANNEL_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq .commit.sha)" = "$TARGET_SHA"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client php8.3-mysql php8.3-zip php8.3-xml php8.3-mbstring php8.3-curl unzip curl >/dev/null
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          mysql --protocol=tcp -h127.0.0.1 -uvf -pvf -e 'SELECT 1' vf_ops_discovery
          bash -n historic/lanes/s01-c02-1211107/published-native.sh
          echo S01_OPS_1111_NATIVE_EXACT_PREFLIGHT_PASS
      - name: Published channel actual native update discovery, upgrade and postinstall
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash historic/lanes/s01-c02-1211107/published-native.sh
      - name: Verify result receipt and remove synthetic evidence secrets
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,pathlib
          j=json.loads(pathlib.Path('proof-native/FINAL_DISCOVERY.json').read_text())
          assert j['result']=='PASS' and j['component_id']=='S01-C02'
          assert j['source_version']=='1.21.1109' and j['target_version']=='1.21.1111'
          for v in ('native_manual_check','wp_update_plugins_offer','real_release_asset_upgrade','business_preservation','post_update_activation_and_authority','post_installed_target_no_false_source_block'):
           assert j[v]=='PASS',v
          assert j['production']=='UNCHANGED'
          print('S01_OPS_1111_PUBLISHED_WORDPRESS_NATIVE_UPDATER_PASS')
          PY
      - name: Cleanup private evidence and transient WordPress
        if: always()
        run: rm -rf historic proof-native "$RUNNER_TEMP/s01-c02-published-native" /tmp/wp-cli.phar
