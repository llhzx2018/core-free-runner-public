name: S01 Theme 1.35.25 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4

      - name: Verify governed release credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $VF_RELEASE_WRITE_TOKEN" https://api.github.com/repos/llhzx2018/vf-tools-theme || true)"
          test "$code" = "200"
          echo "PASS governed release credential can read Theme repository"

      - name: Clone exact Theme release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf theme
          mkdir theme
          cd theme
          git init -q
          git remote add origin https://github.com/llhzx2018/vf-tools-theme.git
          AUTH="$(printf 'x-access-token:%s' "$VF_RELEASE_WRITE_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/tags/v1.35.24:refs/tags/v1.35.24
          git checkout --detach refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "9eaaa558323613f4d688b7c50a27fdf120fa6f48"
          test "$(cat VERSION)" = "1.35.25"
          grep -Fq 'Version: 1.35.25' src/style.css
          grep -Fq 'V1.35.25_S01_UPDATE_CENTER_FRESH_RECEIPTS' src/style.css
          echo "PASS exact Theme main source"

      - name: Exact release scope fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          test "$(git rev-parse HEAD^1)" = "a9ae5ca465f6ac07e8a9afd0a228c0cbe46f0b2a"
          test "$(git rev-parse HEAD^2)" = "5b1429739c932c1bce2855cec301e96b851fe781"
          actual="$(git diff --name-only HEAD^1 HEAD | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            src/style.css \
            tests/update-refresh-policy-contract.php | sort)"
          test "$actual" = "$expected"
          echo "PASS release source is the gated four-file product change"

      - name: Runtime PHP and policy gate
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/update-refresh-policy-contract.php
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find src -type f -name '*.php' -print0 | sort -z)
          echo "PASS all staged runtime PHP syntax"

      - name: Establish runtime fingerprint continuity
        id: fp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/theme-old"
          git -C theme worktree add -q --detach "$RUNNER_TEMP/theme-old" v1.35.24
          python3 - "$RUNNER_TEMP/theme-old/src" theme/src "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import hashlib, pathlib, sys
          old=pathlib.Path(sys.argv[1]); new=pathlib.Path(sys.argv[2]); out=pathlib.Path(sys.argv[3]); summary=pathlib.Path(sys.argv[4])
          expected='683fff47035d69f994e163f16d0d193095cebd5ecaad5a6f56942ff2e1b32f58'
          def files(root):
              return sorted((p for p in root.rglob('*') if p.is_file()), key=lambda p:p.relative_to(root).as_posix())
          def algs(root):
              fs=files(root)
              rows=[]
              for p in fs:
                  rel=p.relative_to(root).as_posix(); hx=hashlib.sha256(p.read_bytes()).hexdigest()
                  rows.append((rel,hx,p))
              vals={}
              vals['A_sha256sum_dot']=hashlib.sha256(''.join(f'{hx}  ./{rel}\n' for rel,hx,_ in rows).encode()).hexdigest()
              vals['B_sha256sum_rel']=hashlib.sha256(''.join(f'{hx}  {rel}\n' for rel,hx,_ in rows).encode()).hexdigest()
              vals['C_rel_null_hex']=hashlib.sha256(''.join(f'{rel}\0{hx}\n' for rel,hx,_ in rows).encode()).hexdigest()
              h=hashlib.sha256()
              for rel,hx,_ in rows: h.update(rel.encode()); h.update(b'\0'); h.update(bytes.fromhex(hx))
              vals['D_rel_null_digest']=h.hexdigest()
              h=hashlib.sha256()
              for rel,_,p in rows: h.update(rel.encode()); h.update(b'\0'); h.update(p.read_bytes())
              vals['E_rel_null_bytes']=h.hexdigest()
              return vals, len(fs)
          oldvals, oldcount=algs(old)
          matches=[k for k,v in oldvals.items() if v==expected]
          with summary.open('a',encoding='utf-8') as s:
              s.write('### Runtime fingerprint continuity\n')
              s.write(f'- old runtime files: {oldcount}\n')
              for k,v in oldvals.items(): s.write(f'- {k}: `{v}`\n')
          if oldcount != 455 or not matches:
              raise SystemExit('No runtime fingerprint algorithm matched 1.35.24 Authority')
          alg=matches[0]
          newvals, newcount=algs(new)
          newfp=newvals[alg]
          with out.open('a',encoding='utf-8') as f:
              f.write(f'algorithm={alg}\n')
              f.write(f'runtime_files={newcount}\n')
              f.write(f'runtime_fingerprint={newfp}\n')
          with summary.open('a',encoding='utf-8') as s:
              s.write(f'- matched algorithm: `{alg}`\n- new runtime files: {newcount}\n- new runtime fingerprint: `{newfp}`\n')
          PY

      - name: Build deterministic WordPress Theme ZIP
        id: build
        shell: bash
        run: |
          set -euo pipefail
          TMP="$RUNNER_TEMP/vf-theme-13525"
          ROOT="$TMP/vf-tools-theme"
          ZIP="$TMP/vf-tools-theme_V1.35.25.zip"
          rm -rf "$TMP"
          mkdir -p "$ROOT"
          cp -a theme/src/. "$ROOT/"
          python3 - "$ROOT" "$ZIP" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
                  rel=pathlib.PurePosixPath('vf-tools-theme')/p.relative_to(root)
                  info=zipfile.ZipInfo(str(rel),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=(p.stat().st_mode & 0xFFFF) << 16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY
          BYTES="$(stat -c '%s' "$ZIP")"
          SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          FILES="$(find "$ROOT" -type f | wc -l | tr -d ' ')"
          test "$FILES" = "${{ steps.fp.outputs.runtime_files }}"
          unzip -tq "$ZIP" >/dev/null
          test "$(unzip -Z1 "$ZIP" | cut -d/ -f1 | sort -u)" = 'vf-tools-theme'
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Release package" >> "$GITHUB_STEP_SUMMARY"
          echo "- bytes: $BYTES" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- runtime files: $FILES" >> "$GITHUB_STEP_SUMMARY"
          echo "- runtime fingerprint: \`${{ steps.fp.outputs.runtime_fingerprint }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS deterministic package gate"

      - name: Create formal private release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.35.25 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then
            echo 'Release v1.35.25 already exists; refusing overwrite.' >&2
            exit 31
          fi
          gh release create v1.35.25 "${{ steps.build.outputs.zip }}#vf-tools-theme_V1.35.25.zip" \
            --repo llhzx2018/vf-tools-theme \
            --target 9eaaa558323613f4d688b7c50a27fdf120fa6f48 \
            --title 'VF Tools Theme V1.35.25' \
            --notes 'S01-C01 unified VF online update center reliability release. Exact source 9eaaa558323613f4d688b7c50a27fdf120fa6f48. Fresh 10-minute per-component check receipts, normalized Theme/Ops/M3U8 refresh outcomes, isolated callback failures, and safe user-facing failure reasons. Product Gate 35069592638 PASS. No public renderer, SEO, Provider, Ops or M3U8 business algorithm changes. Production install / Static / FINAL_ONLINE_PASS are NOT_RUN.'
          echo "PASS release created"

      - name: Independent release and asset readback
        id: readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.25)"
          python3 - "$JSON" "${{ steps.build.outputs.bytes }}" "${{ steps.build.outputs.sha256 }}" "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          x=json.loads(sys.argv[1]); exp_bytes=int(sys.argv[2]); exp_sha=sys.argv[3]; out=sys.argv[4]; summary=sys.argv[5]
          assert x['tag_name']=='v1.35.25' and x['draft'] is False and x['prerelease'] is False
          assets=[a for a in x.get('assets',[]) if a.get('name')=='vf-tools-theme_V1.35.25.zip']
          assert len(assets)==1
          a=assets[0]; assert int(a['size'])==exp_bytes
          digest=str(a.get('digest') or '')
          if digest: assert digest=='sha256:'+exp_sha
          with open(out,'a',encoding='utf-8') as f:
              f.write(f'release_id={x["id"]}\nasset_id={a["id"]}\npublished_at={x["published_at"]}\n')
          with open(summary,'a',encoding='utf-8') as s:
              s.write(f'- release id: {x["id"]}\n- asset id: {a["id"]}\n- published at: {x["published_at"]}\n')
          PY
          rm -rf "$RUNNER_TEMP/release-readback"
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download v1.35.25 --repo llhzx2018/vf-tools-theme --pattern 'vf-tools-theme_V1.35.25.zip' --dir "$RUNNER_TEMP/release-readback"
          DL="$RUNNER_TEMP/release-readback/vf-tools-theme_V1.35.25.zip"
          test "$(stat -c '%s' "$DL")" = "${{ steps.build.outputs.bytes }}"
          test "$(sha256sum "$DL" | awk '{print $1}')" = "${{ steps.build.outputs.sha256 }}"
          echo "PASS independent release asset readback"
