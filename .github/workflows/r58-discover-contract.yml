name: R58 Focused Discover Sample Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r58-discover-contract.yml'

permissions:
  contents: read

jobs:
  r58-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: c6510fcfab1e8b1aa386370d25a7f88469774ec5
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: c6510fcfab1e8b1aa386370d25a7f88469774ec5
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/FunctionalWorkspace.php
          php -l tests/unit/discover_random_sample_contract.php
          php tests/unit/discover_random_sample_contract.php
          php tests/unit/favorite_add_context_contract.php
          echo R58_DISCOVER_RANDOM_SAMPLE_PASS
          echo R58_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
