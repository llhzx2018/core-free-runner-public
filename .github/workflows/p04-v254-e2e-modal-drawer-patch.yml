name: P04 V2.5.4 E2E Modal Drawer Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-modal-drawer-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply modal and drawer E2E patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p04-v254-modal-drawer-patch.py
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): cover V2.5.4 modal and drawer contracts'
          git push origin HEAD:main
