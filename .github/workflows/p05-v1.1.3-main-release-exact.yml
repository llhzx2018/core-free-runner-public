name: P05 V1.1.3 Main Release Exact Gate

on:
  push:
    branches:
      - gate/p05-v113-login-repair-20260830
    paths:
      - '.github/workflows/p05-v1.1.3-main-release-exact.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_MAIN_SHA: 5e85172e86ab511849ab5f215378f2cfa8f26355
      P05_EXPECTED_TREE: cd725c4b55d989e44c73b46785403dc3f6910dd9
      VERIFIED_SOURCE_SHA: 22d3df51a26203d40e94908684a081353530f6dd
      P05_VERSION: 1.1.3
      RELEASE_ASSET: VF_SEO_V1.1.3_FULL.zip
      RECEIPT_ASSET: VF_SEO_V1.1.3_RELEASE_RECEIPT.txt
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private read capability
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact P05 main
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXPECTED_TREE"
          test "$(git rev-parse "$VERIFIED_SOURCE_SHA^{tree}")" = "$P05_EXPECTED_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$P05_VERSION"
          test "$(jq -r .version package.json)" = "$P05_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .target_version VF_PROJECT.json)" = "$P05_VERSION"
          test "$(jq -r .working_version VF_PROJECT.json)" = "$P05_VERSION"
          echo P05_V113_MAIN_IDENTITY=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Full exact main regression and security
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo P05_V113_MAIN_NODE=PASS

      - name: PHP runtime and legacy login repair
        shell: bash
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SQLITE_PATH: /tmp/vf-seo-v113-main.sqlite3
          VF_BACKUP_DIR: /tmp/vf-seo-v113-main-backups
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: v113-main-portable-password-123
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || !extension_loaded("pdo_sqlite")) exit(1);'
          php -l index.php
          npm run php:lint
          php php/tests/security-interop.php
          rm -f "$VF_SQLITE_PATH" "$VF_SQLITE_PATH-wal" "$VF_SQLITE_PATH-shm"
          rm -rf "$VF_BACKUP_DIR"
          php php/bin/migrate.php
          php php/bin/bootstrap-admin.php
          bash php/tests/http-smoke.sh
          bash php/tests/login-session-compat-smoke.sh
          echo P05_V113_MAIN_LOGIN_REPAIR=PASS

      - name: Build release staging and browser-first gates
        shell: bash
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_MAIN_SHA }}
        run: |
          set -euo pipefail
          npm run build:php-release
          npm run php:release:gate
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          node - <<'JS'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json','utf8'));
          if(m.version!==process.env.P05_VERSION||m.sourceCommit!==process.env.P05_MAIN_SHA) throw new Error('main manifest identity');
          if(m.cloudPanelDirectExtract!==true||m.browserFirstInstall!==true||m.normalInstallRequiresShell!==false||m.setupPath!=='/setup') throw new Error('browser-first contract');
          JS
          echo P05_V113_MAIN_BROWSER_FIRST=PASS

      - name: Build deterministic formal FULL and receipt
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p05-v113-main-release"
          mkdir -p "$OUT"
          zip_stage() {
            local out="$1"
            STAGE="$(pwd)/build/vf-seo-php-release" OUT_FILE="$out" python3 - <<'PY'
          import os,pathlib,zipfile
          stage=pathlib.Path(os.environ['STAGE']); out=pathlib.Path(os.environ['OUT_FILE'])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
              for p in sorted(x for x in stage.rglob('*') if x.is_file()):
                  rel=p.relative_to(stage).as_posix()
                  info=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.create_system=3
                  info.external_attr=((0o100755 if rel=='install-cloudpanel-php.sh' else 0o100644)<<16)
                  z.writestr(info,p.read_bytes())
          PY
          }
          zip_stage "$OUT/a.zip"
          zip_stage "$OUT/b.zip"
          cmp "$OUT/a.zip" "$OUT/b.zip"
          mv "$OUT/a.zip" "$OUT/$RELEASE_ASSET"
          rm "$OUT/b.zip"
          SHA="$(sha256sum "$OUT/$RELEASE_ASSET" | awk '{print $1}')"
          BYTES="$(stat -c %s "$OUT/$RELEASE_ASSET")"
          FILES="$(unzip -Z1 "$OUT/$RELEASE_ASSET" | grep -cv '/$')"
          unzip -p "$OUT/$RELEASE_ASSET" VERSION | tr -d '\r\n' | grep -Fxq "$P05_VERSION"
          unzip -Z1 "$OUT/$RELEASE_ASSET" | grep -Fxq 'index.php'
          unzip -Z1 "$OUT/$RELEASE_ASSET" | grep -Fxq 'php/src/RuntimeLoginCompatibilityTrait.php'
          unzip -p "$OUT/$RELEASE_ASSET" PHP_RELEASE_MANIFEST.json | jq -e --arg v "$P05_VERSION" --arg s "$P05_MAIN_SHA" '.version==$v and .sourceCommit==$s and .cloudPanelDirectExtract==true and .browserFirstInstall==true and .normalInstallRequiresShell==false' >/dev/null
          cat > "$OUT/$RECEIPT_ASSET" <<EOF
          P05_V113_MAIN_RELEASE_MACHINE=PASS
          P05_EXACT_MAIN=$P05_MAIN_SHA
          P05_TREE=$P05_EXPECTED_TREE
          P05_VERSION=$P05_VERSION
          P05_LEGACY_LOGIN_REPAIR=PASS
          P05_BROWSER_FIRST_INSTALL=PASS
          P05_NORMAL_INSTALL_REQUIRES_SHELL=false
          P05_SETUP_PATH=/setup
          P05_FORMAL_FULL_FILES=$FILES
          P05_FORMAL_FULL_BYTES=$BYTES
          P05_FORMAL_FULL_SHA256=$SHA
          P05_PRODUCTION=NOT_DEPLOYED
          EOF
          cat "$OUT/$RECEIPT_ASSET"

      - name: Repository cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | grep -Ev '^(\?\? | M )?(build/|dist/)' > /tmp/p05-dirty.txt || true
          test ! -s /tmp/p05-dirty.txt
          echo P05_V113_MAIN_CLEANLINESS=PASS

      - name: Upload formal release candidate
        uses: actions/upload-artifact@v4
        with:
          name: P05_V1.1.3_MAIN_RELEASE
          path: |
            ${{ runner.temp }}/p05-v113-main-release/VF_SEO_V1.1.3_FULL.zip
            ${{ runner.temp }}/p05-v113-main-release/VF_SEO_V1.1.3_RELEASE_RECEIPT.txt
          retention-days: 90
