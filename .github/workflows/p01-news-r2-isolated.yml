name: P01 News R9 exact-source security and SEO gates

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r9-release-preflight
  cancel-in-progress: false

jobs:
  news-r9:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PRODUCT_SHA: d96c994dfbb1b03c850895db4ca90a2a09cf1d1e
      MAIN_SHA: 62c96967a0c69417432c05625f4504f8480beb4f
    steps:
      - name: Prepare public-safe PHP test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_R9_RUNTIME=PASS

      - name: Checkout exact private P01 News source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout formal branch for baseline regression comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-main
          persist-credentials: false
          fetch-depth: 1

      - name: Pin exact identities and run public-domain negative cases
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-main rev-parse HEAD)" = "$MAIN_SHA"
          php -l p01-news/tests/unit/p01_news_release_surface_contract.php
          php p01-news/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-news-r9-gates.txt
          grep -E '^P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=[0-9]+$' /tmp/p01-news-r9-gates.txt
          echo P01_NEWS_R9_PUBLIC_SURFACE=PASS

      - name: Full exact-source canonical unit regression for new test
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          bash p01-news/tests/canonical_release_regression.sh p01-news p01-main --require-zero-debt | tee /tmp/p01-news-r9-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-news-r9-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-news-r9-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-news-r9-canonical.txt
          echo P01_NEWS_R9_EXACT_CANONICAL=PASS

      - name: Always remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf p01-news p01-main
          echo P01_NEWS_R9_PRIVATE_SOURCE_CLEANUP=COMPLETE
