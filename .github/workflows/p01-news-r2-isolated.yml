name: P01 Chinese News bounded official RSS live access preflight

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-official-feed-read-only
  cancel-in-progress: false

jobs:
  live-8-official:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_SHA: 4c4a238420ed1226ba946f497b10d0d1167db5a3
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare PHP cURL and XML
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml >/dev/null
          php -m | grep -Fx curl
          php -m | grep -Fx SimpleXML
      - name: Checkout exact current P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 1
      - name: Bounded one GET per publisher RSS without login redirects or retries
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$PRODUCT_SHA"
          cat > /tmp/p01-news-rss-preflight.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once getcwd().'/p01-news/src/app/NewsFeedService.php';
          $registry=(new ReflectionClass('VfNewsFeedService'))->getReflectionConstant('SOURCES')->getValue();
          if(count($registry)!==8){echo "NEWS_FEED_PREFLIGHT_REGISTRY_DRIFT\n";exit(17);}
          $allowedHosts=['www.chinanews.com.cn'=>1,'www.ithome.com'=>1,'36kr.com'=>1];
          $summary=[];
          foreach($registry as $id=>$source){
            $url=(string)$source['feed'];
            $host=parse_url($url,PHP_URL_HOST);
            if(!isset($allowedHosts[$host])||!str_starts_with($url,'https://')){
              echo "NEWS_FEED_PREFLIGHT_UNEXPECTED_HOST\n";exit(19);
            }
            $body='';
            $c=curl_init($url);
            curl_setopt_array($c,[
              CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,
              CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>7,
              CURLOPT_USERAGENT=>'VF Start News/1 (+source headlines only)',
              CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
              CURLOPT_PROXY=>'',CURLOPT_NOPROXY=>'*',
              CURLOPT_HTTPHEADER=>['Accept: application/rss+xml, application/xml, text/xml'],
              CURLOPT_WRITEFUNCTION=>static function($c,string $chunk)use(&$body):int{
                if(strlen($body)+strlen($chunk)>393216)return 0;
                $body.=$chunk;return strlen($chunk);
              },
            ]);
            $ok=curl_exec($c);
            $code=(int)curl_getinfo($c,CURLINFO_RESPONSE_CODE);
            $ctype=(string)curl_getinfo($c,CURLINFO_CONTENT_TYPE);
            $err=(int)curl_errno($c);
            curl_close($c);
            $state='NOT_XML';$count=0;
            if(!$ok)$state='NETWORK_OR_SIZE_ERROR';
            elseif($code!==200)$state='HTTP_NOT_200';
            elseif(preg_match('/text\/html/i',$ctype))$state='HTML_CHALLENGE_OR_PAGE';
            else{
              try{$items=VfNewsFeedService::parseRss($id,$body,time());
                $count=count($items);$state=$count>0?'VALID_NEWS_XML':'NO_VALID_ITEMS';
              }catch(Throwable $e){$state='INVALID_FEED_XML';}
            }
            echo "NEWS_FEED_PREFLIGHT id=$id status=$state http=$code items=$count errno=$err\n";
            $summary[$state]=($summary[$state]??0)+1;
          }
          echo 'NEWS_FEED_PREFLIGHT_FINISHED=8 PROBE_ONLY=YES NO_REDIRECTS=YES NO_COOKIES=YES NO_RETRIES=YES'.PHP_EOL;
          echo 'NEWS_FEED_PREFLIGHT_VALID='.($summary['VALID_NEWS_XML']??0).PHP_EOL;
          PHP
          php /tmp/p01-news-rss-preflight.php
          echo P01_NEWS_OFFICIAL_RSS_ACCESS_DIAGNOSTIC=EXECUTED
          echo P01_NEWS_RELEASE_AND_RIGHTS_GATE=NOT_ASSERTED
      - name: Purge private transient sources and diagnostic
        if: always()
        run: |
          rm -rf p01-news /tmp/p01-news-rss-preflight.php
          echo P01_NEWS_RSS_PRIVATE_CLEANUP=COMPLETE
