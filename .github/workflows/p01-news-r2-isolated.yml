name: P01 News R5 isolated lifecycle proof

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r5-exact-synthetic-lifecycle
  cancel-in-progress: false

jobs:
  news-r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRODUCT_SHA: ff21e30b11a4ec98e88e43538d5c9969428eb0eb
    steps:
      - name: Checkout registered public Builder control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP SQLite ZIP and GNU tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          php -m | grep -Fx curl
          echo P01_NEWS_R5_RUNTIME=PASS

      - name: Checkout exact private P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned P01 source and integration test syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          php -l p01-exact/tests/integration/p01_news_r5_lifecycle_native.php >/dev/null
          bash -n p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh
          php -l p01-exact/src/app/NewsFeedService.php >/dev/null
          php -l p01-exact/src/app/NewsSourcePreferences.php >/dev/null
          python3 -m py_compile scripts/p01-maintenance-release.py
          echo P01_NEWS_R5_EXACT_SOURCE_PRECHECK=PASS

      - name: Isolated formal baseline to synthetic target FULL Atomic backup and rollback
        shell: bash
        timeout-minutes: 8
        env:
          VF_NEWS_R5_SANDBOX: "1"
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh

      - name: Clean transient private checkout and synthetic package
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact
          echo P01_NEWS_R5_PRIVATE_SOURCE_CLEANUP=COMPLETE
