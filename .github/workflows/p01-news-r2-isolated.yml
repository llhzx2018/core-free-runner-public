name: P01 Chinese live eight publisher feeds full exact-source regression

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r12-guest-rights
  cancel-in-progress: false

jobs:
  news-r10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: ace7a44a084ec0ec16edccf8dc28ac837d722351
      MAIN_SHA: 855e15e18f656c4f398ddc4d8e959521ecbc7e5e
    steps:
      - name: Checkout registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare PHP SQLite and XML runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_R12_RUNTIME=PASS

      - name: Checkout exact private News source only transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact main for canonical comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.MAIN_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify source and focused attribution/security
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-main rev-parse HEAD)" = "$MAIN_SHA"
          php -l p01-news/src/app/NewsFeedService.php >/dev/null
          php -l p01-news/src/app/NewsFeedPage.php >/dev/null
          php -l p01-news/src/quick-save.php >/dev/null
          php -l p01-news/tests/unit/p01_news_release_surface_contract.php >/dev/null
          node --check p01-news/tests/browser/p01_news_r4_chromium.cjs
          for test in quick_save_prg_contract.php quick_save_duplicate_action_contract.php quick_save_pending_continuity_contract.php; do php "p01-news/tests/unit/$test" >/dev/null; done
          echo P01_QUICK_SAVE_PRIOR_HTML_PRG_COMPAT=PASS
          php -l p01-news/src/app/NewsSourcePreferences.php >/dev/null
          php -l p01-news/src/app/NewsFeedService.php >/dev/null
          php -l p01-news/src/app/NewsFeedPage.php >/dev/null
          php p01-news/tests/unit/p01_news_feed_service_contract.php | tee /tmp/p01-news-r12-service.txt
          grep -E '^VF_NEWS_SERVICE_LOCAL_CONTRACT=PASS checks=[0-9]+$' /tmp/p01-news-r12-service.txt
          php p01-news/tests/unit/p01_news_source_preferences_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_feed_normalizer_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-news-r12-attribution.txt
          grep -E '^P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=[0-9]+$' /tmp/p01-news-r12-attribution.txt
          echo P01_NEWS_R12_PUBLIC_RIGHTS_SOURCE=PASS=PASS

      - name: Eight exact-registry published RSS response and P01 XML parser checks
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-news-eight-live.php <<'PHP'
          <?php
          declare(strict_types=1);
          require_once getcwd().'/p01-news/src/app/NewsFeedService.php';
          $registry=(new ReflectionClass('VfNewsFeedService'))->getReflectionConstant('SOURCES')->getValue();
          $expected=['cn-live','cn-china','cn-society','cn-finance','cn-world',
            'ithome-tech','solidot-tech','sspai-digital'];
          if(array_keys($registry)!==$expected){echo "P01_NEWS_LIVE_REGISTRY_DRIFT\n";exit(17);}
          $allowed=['www.chinanews.com.cn'=>true,'www.ithome.com'=>true,'www.solidot.org'=>true,'sspai.com'=>true];
          $passed=0;
          foreach($registry as $id=>$source) {
            $url=(string)$source['feed'];
            if(!str_starts_with($url,'https://')||!isset($allowed[parse_url($url,PHP_URL_HOST)])){
              echo "P01_NEWS_LIVE_DISALLOWED_REGISTRY\n";exit(18);
            }
            $body='';$ch=curl_init($url);
            curl_setopt_array($ch,[
              CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,
              CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>7,
              CURLOPT_USERAGENT=>'VF Start News/1 (+source headlines only)',
              CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
              CURLOPT_PROXY=>'',CURLOPT_NOPROXY=>'*',
              CURLOPT_HTTPHEADER=>['Accept: application/rss+xml, application/xml, text/xml'],
              CURLOPT_WRITEFUNCTION=>static function($ch,string $chunk)use(&$body):int{
                if(strlen($body)+strlen($chunk)>393216)return 0;
                $body.=$chunk;return strlen($chunk);
              }
            ]);
            $ok=curl_exec($ch);
            $status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
            $ctype=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
            $errno=(int)curl_errno($ch);curl_close($ch);
            $items=[];
            if($ok && $status===200 && stripos($ctype,'text/html')===false){
              try{$items=VfNewsFeedService::parseRss($id,$body,time());}
              catch(Throwable $e){}
            }
            $pass=count($items)>0;
            if($pass)$passed++;
            echo "P01_NEWS_EXACT_LIVE id=$id http=$status valid_items=".count($items)." code=".($pass?'PASS':'NOT_PROVEN')." errno=$errno\n";
          }
          echo "P01_NEWS_EXACT_LIVE_PASS=$passed/8\n";
          if($passed!==8)exit(4);
          PHP
          php /tmp/p01-news-eight-live.php
          echo P01_NEWS_OFFICIAL_EIGHT_REAL_SOURCE_AND_PARSER=PASS
          echo P01_NEWS_UPSTREAM_RIGHTS=NOT_PROVEN

      - name: Fresh installed Chromium News Owner Guest attribution flow
        shell: bash
        timeout-minutes: 9
        env:
          VF_NEWS_BROWSER_MODULE: /tmp/p01-news-r12-browser
          PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-r12-browsers
          VF_NEWS_TEST_ROOT: p01-news
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-news/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news-r12-browser.txt
          grep -F 'P01_NEWS_R4_CHROMIUM=PASS checks=58' /tmp/p01-news-r12-browser.txt
          echo P01_NEWS_R12_OWNER_GUEST_RIGHTS_CHROMIUM=PASS

      - name: Final changed-source full canonical release regression
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          bash p01-news/tests/canonical_release_regression.sh p01-news p01-main --require-zero-debt | tee /tmp/p01-news-r12-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-news-r12-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-news-r12-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-news-r12-canonical.txt
          echo P01_NEWS_R12_FINAL_CANONICAL=PASS

      - name: Remove private source and ephemeral browsers
        if: always()
        shell: bash
        run: |
          rm -rf p01-news p01-main
          rm -rf /tmp/p01-news-r12-browser /tmp/p01-news-r12-browsers
          rm -f /tmp/p01-news-eight-live.php
          echo P01_NEWS_R12_PRIVATE_CLEANUP=COMPLETE
