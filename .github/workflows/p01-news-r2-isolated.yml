name: P01 News R5 canonical release regression

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r5-canonical-zero-debt
  cancel-in-progress: false

jobs:
  p01-canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRODUCT_SHA: 49e39aeb6d1c057d79fefcb349ed1dec119b5427
      BASELINE_SHA: 62c96967a0c69417432c05625f4504f8480beb4f
    steps:
      - name: Prepare PHP Native Dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          echo P01_NEWS_R5_CANONICAL_MACHINE=PASS

      - name: Checkout exact PR source in ephemeral workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact current main as regression baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-stable
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact identities and 12-subsite overflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-stable rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = "2.47.505"
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          echo P01_NEWS_R5_NAV_SOURCE=PASS

      - name: Canonical baseline relative full PHPUnit style inventory
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          set +e
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-stable --require-zero-debt | tee /tmp/p01-news-canonical.txt
          status=${PIPESTATUS[0]}
          set -e
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-news-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-news-canonical.txt
          grep -Fx 'P01_CANONICAL_CHANGED_TEST_FAILURE_COUNT=0' /tmp/p01-news-canonical.txt
          grep -Fx 'P01_CANONICAL_REMOVED_BASELINE_TEST_COUNT=0' /tmp/p01-news-canonical.txt
          echo P01_NEWS_R5_RELATIVE_CANONICAL=PASS
          if [ "$status" -eq 0 ]; then
            grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-news-canonical.txt
            echo P01_NEWS_R5_FULL_ZERO_DEBT=PASS
          elif [ "$status" -eq 2 ] && grep -Fxq 'P01_CANONICAL_BASELINE_FAILURE_COUNT=1' /tmp/p01-news-canonical.txt \
              && grep -Fxq 'P01_CANONICAL_CURRENT_FAILURE_COUNT=1' /tmp/p01-news-canonical.txt; then
            echo P01_NEWS_R5_FULL_ZERO_DEBT=BLOCKED_EXISTING_BASELINE_ONE
            failures=0
            while IFS= read -r file; do
              if ! php "$file" >/dev/null 2>&1; then
                failures=$((failures+1))
                echo "P01_NEWS_R5_BASELINE_FAILED_TEST=${file#p01-stable/}"
              fi
            done < <(find p01-stable/tests/unit -maxdepth 1 -type f -name '*.php' | sort)
            test "$failures" -eq 1
          else
            echo P01_NEWS_R5_CANONICAL_UNEXPECTED_FAILURE
            exit "$status"
          fi

      - name: Clean private source checkouts
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-stable
          echo P01_NEWS_R5_PRIVATE_CLEANUP=COMPLETE
