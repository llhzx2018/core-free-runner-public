name: P01 News R6 canonical zero-debt closure

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r6-canonical-zero-debt
  cancel-in-progress: false

jobs:
  news-r6:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PRODUCT_SHA: e0af96915803ec4bb628296cba7880494a78b2a0
      BASELINE_SHA: 62c96967a0c69417432c05625f4504f8480beb4f
    steps:
      - name: Prepare isolated PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          echo P01_NEWS_R6_PHP_RUNTIME=PASS

      - name: Checkout exact candidate temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact main baseline temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASELINE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-stable
          persist-credentials: false
          fetch-depth: 1

      - name: Identify stale prior channel test and prove current implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C p01-stable rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = "2.47.505"
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = "2.47.505"
          cmp -s p01-exact/src/app/ChannelLibraryPage.php p01-stable/src/app/ChannelLibraryPage.php
          set +e
          php p01-stable/tests/unit/channels_guest_readonly_layout_v247390_contract.php >/dev/null 2>&1
          baseline_rc=$?
          set -e
          test "$baseline_rc" -ne 0
          echo P01_NEWS_R6_BASELINE_LEGACY_TEST_FAILURE_CONFIRMED=YES
          php p01-exact/tests/unit/channels_guest_readonly_layout_v247390_contract.php
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          echo P01_NEWS_R6_CHANNEL_BOTH_PAGINATION_MODES=PASS

      - name: Full canonical regression strict no-debt on exact candidate
        shell: bash
        timeout-minutes: 11
        run: |
          set -Eeuo pipefail
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-stable --require-zero-debt | tee /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_CHANGED_FAILURE_COUNT=0' /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_REMOVED_BASELINE_TEST_COUNT=0' /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_RESOLVED_DEBT_COUNT=1' /tmp/p01-news-r6-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-news-r6-canonical.txt
          echo P01_NEWS_R6_EXACT_SOURCE_FULL_CANONICAL=PASS

      - name: Always cleanup transient private worktrees
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-stable
          echo P01_NEWS_R6_PRIVATE_SOURCE_CLEANUP=COMPLETE
