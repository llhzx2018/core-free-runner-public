name: P01 News R2 isolated source proof

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r2-exact-source
  cancel-in-progress: false

jobs:
  news-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PRODUCT_SHA: 1b6cbbb1d1bf50cc46c6864a7ef21c41b67de627
    steps:
      - name: Prepare PHP machine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring >/dev/null
          php -m | grep -Fx curl
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_MACHINE_EXTENSIONS=PASS

      - name: Checkout pinned private P01 source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Git source and run bounded contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          for file in             src/app/NewsFeedNormalizer.php             src/app/NewsFeedService.php             src/app/NewsFeedPage.php             src/app/FunctionalWorkspaceCore.php             src/app/FunctionalWorkspaceShell.php             src/app/SubjectPageChrome.php             src/app/WorkspaceViewCatalog.php             src/news.php             src/news-feed.php             tests/unit/p01_news_feed_normalizer_contract.php             tests/unit/p01_news_feed_service_contract.php; do
            php -l "p01-exact/$file" >/dev/null
          done
          echo P01_NEWS_EXACT_PHP_LINT=PASS
          php p01-exact/tests/unit/p01_news_feed_normalizer_contract.php
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          echo P01_NEWS_R2_ISOLATED_CONTRACT=PASS

      - name: Clean temporary private source from public runner
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact
          echo P01_NEWS_PRIVATE_SOURCE_CLEANUP=COMPLETE
