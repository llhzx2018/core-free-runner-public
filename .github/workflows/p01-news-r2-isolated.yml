name: P01 News R4 isolated Chromium UX proof

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-r4-exact-source
  cancel-in-progress: false

jobs:
  news-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PRODUCT_SHA: 81cd64779e8043e964891c63d6c8a2b0c59f2145
    steps:
      - name: Prepare PHP machine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 >/dev/null
          php -m | grep -Fx curl
          php -m | grep -Fx SimpleXML
          php -m | grep -Fx pdo_sqlite
          echo P01_NEWS_MACHINE_EXTENSIONS=PASS

      - name: Checkout pinned private P01 source without credential persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact Git source and run bounded contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          for file in \
            src/app/NewsFeedNormalizer.php \
            src/app/NewsFeedService.php \
            src/app/NewsFeedPage.php \
            src/app/NewsSourcePreferences.php \
            src/app/NewsLocalManagementPanel.php \
            src/app/FunctionalWorkspaceShell.php \
            src/app/SubjectPageChrome.php \
            src/news.php \
            src/news-feed.php \
            src/news-preferences.php \
            tests/unit/p01_news_source_preferences_contract.php; do
            php -l "p01-exact/$file" >/dev/null
          done
          echo P01_NEWS_EXACT_PHP_LINT=PASS
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          echo P01_NEWS_R3_PREFERENCES_CONTRACT=PASS
          node --check p01-exact/src/assets/news-feed.js
          node --check p01-exact/src/assets/news-preferences.js
          node --check p01-exact/src/assets/local-subsite-management.js
          test -s p01-exact/src/assets/news-feed.css
          echo P01_NEWS_R3_JS_CSS_STATIC=PASS

      - name: P01 News R3 privacy and canonical save integration static guard
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'if (!vf_is_admin())' p01-exact/src/news-preferences.php >/dev/null
          grep -F 'vf_require_csrf();' p01-exact/src/news-preferences.php >/dev/null
          grep -F "data-vf-news-save" p01-exact/src/app/NewsFeedPage.php >/dev/null
          grep -F "fetch('quick-save.php'" p01-exact/src/assets/news-feed.js >/dev/null
          grep -F "data-vf-local-news-area" p01-exact/src/app/NewsLocalManagementPanel.php >/dev/null
          grep -F "window.VFLocalNews?.requestDismiss?.()" p01-exact/src/assets/local-subsite-management.js >/dev/null
          echo P01_NEWS_R3_STATIC_SECURITY_WIRING=PASS

      - name: Isolated installed P01 HTTP Owner/Guest/news/Inbox smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          cp -a p01-exact p01-r4-clean
          SITE="http://127.0.0.1:18078"
          COOKIES="$(mktemp)"
          LOG="$(mktemp)"
          PASS="$(openssl rand -hex 14)"
          php -S 127.0.0.1:18078 -t p01-exact/src >"$LOG" 2>&1 &
          SERVER_PID=$!
          finish() {
            kill "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
            rm -f "$COOKIES" "$LOG"
          }
          trap finish EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -c "$COOKIES" -b "$COOKIES" "$SITE/setup.php" -o /tmp/p01-news-setup.html; then break; fi
            sleep 1
          done
          SETUP_CSRF="$(sed -n 's/.*name="setup_csrf" value="\([^"]*\)".*/\1/p' /tmp/p01-news-setup.html | head -1)"
          test -n "$SETUP_CSRF"
          curl -sS -c "$COOKIES" -b "$COOKIES" -o /tmp/p01-news-installed.html \
            --data-urlencode "setup_csrf=$SETUP_CSRF" \
            --data-urlencode 'site_title=News Smoke' \
            --data-urlencode "admin_password=$PASS" \
            --data-urlencode "admin_password_confirm=$PASS" \
            "$SITE/setup.php"
          test -s p01-exact/src/app/.runtime.php
          curl -fsS "$SITE/api.php?action=health" | jq -e '.ok==true' >/dev/null
          echo P01_NEWS_R3_ISOLATED_INSTALL=PASS
          curl -fsS -c "$COOKIES" -b "$COOKIES" "$SITE/news.php" -o /tmp/p01-news-guest.html
          grep -F '<h1>新闻</h1>' /tmp/p01-news-guest.html >/dev/null
          if grep -F 'data-vf-news-save' /tmp/p01-news-guest.html >/dev/null; then
            echo GUEST_SAVE_LEAK; exit 12
          fi
          GUEST_PREF="$(curl -sS -o /tmp/p01-news-guest-prefs.json -w '%{http_code}' "$SITE/news-preferences.php")"
          test "$GUEST_PREF" = 401
          echo P01_NEWS_R3_GUEST_PRIVACY_HTTP=PASS
          LOGIN_JSON="$(python3 -c 'import json,sys;print(json.dumps({"password":sys.argv[1]}))' "$PASS")"
          CSRF="$(curl -fsS -c "$COOKIES" -b "$COOKIES" -H 'Content-Type: application/json' \
            -d "$LOGIN_JSON" "$SITE/api.php?action=login" | jq -r '.csrf // empty')"
          test -n "$CSRF"
          curl -fsS -c "$COOKIES" -b "$COOKIES" "$SITE/news.php" -o /tmp/p01-news-owner.html
          grep -F 'data-vf-news-open-manager' /tmp/p01-news-owner.html >/dev/null
          grep -F 'data-vf-news-csrf=' /tmp/p01-news-owner.html >/dev/null
          grep -F 'data-vf-local-news-area' /tmp/p01-news-owner.html >/dev/null
          PREF="$(curl -fsS -b "$COOKIES" "$SITE/news-preferences.php")"
          VERSION="$(printf '%s' "$PREF" | jq -r '.preferences.version')"
          test "$VERSION" = defaults
          BODY="$(python3 -c 'import json,sys;print(json.dumps({"version":sys.argv[1],"order":["bbc-world","bbc-technology","bbc-business","npr-news","v2ex-tech","hn-frontpage"],"enabled":["bbc-world","npr-news"],"followed":["npr-news"]}))' "$VERSION")"
          curl -fsS -b "$COOKIES" -c "$COOKIES" -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $CSRF" -d "$BODY" "$SITE/news-preferences.php" \
            | jq -e '.ok == true and .preferences.followed == ["npr-news"]' >/dev/null
          curl -fsS -b "$COOKIES" "$SITE/news-preferences.php" | jq -e '.preferences.enabled == ["bbc-world","npr-news"]' >/dev/null
          curl -fsS -b "$COOKIES" "$SITE/news.php?view=followed" -o /tmp/p01-news-followed.html
          grep -F '我的关注' /tmp/p01-news-followed.html >/dev/null
          BLOCKED="$(curl -sS -b "$COOKIES" -o /tmp/p01-news-disabled.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" \
            -d '{"source_id":"bbc-business"}' "$SITE/news-feed.php")"
          test "$BLOCKED" = 403
          echo P01_NEWS_R3_OWNER_PREFS_HTTP=PASS
          ( cd p01-exact/src && php -r 'require "app/bootstrap.php";(new VfRepository(vf_db()))->createCategory(["name"=>"Synthetic Inbox","is_private"=>true]);' )
          SAVED="$(curl -fsS -b "$COOKIES" -c "$COOKIES" -H 'Accept: application/json' \
            -F "csrf=$CSRF" -F 'url=https://news.example.org/story-one' \
            -F 'title=News R3 synthetic item' "$SITE/quick-save.php")"
          printf '%s' "$SAVED" | jq -e '.ok == true' >/dev/null
          AGAIN="$(curl -fsS -b "$COOKIES" -c "$COOKIES" -H 'Accept: application/json' \
            -F "csrf=$CSRF" -F 'url=https://news.example.org/story-one' \
            -F 'title=News R3 synthetic item' "$SITE/quick-save.php")"
          printf '%s' "$AGAIN" | jq -e '.ok == true' >/dev/null
          ( cd p01-exact/src && php -r '
            require "app/bootstrap.php";
            $db=vf_db();
            $query=$db->prepare("SELECT is_private,is_pending FROM links WHERE url=?");
            $query->execute(["https://news.example.org/story-one"]);
            $rows=$query->fetchAll(PDO::FETCH_ASSOC);
            if(count($rows)!==1 || (int)$rows[0]["is_private"]!==1 || (int)$rows[0]["is_pending"]!==1)exit(7);
          ' )
          echo P01_NEWS_R3_PENDING_CANONICAL_HTTP=PASS

      - name: Public official feed runtime eligibility (bounded read)
        shell: bash
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          require 'p01-exact/src/app/bootstrap.php';
          require 'p01-exact/src/app/NewsFeedService.php';
          foreach (['v2ex-tech','hn-frontpage'] as $id) {
              try {
                  $result=VfNewsFeedService::refresh($id);
                  $status=(string)($result['status']??'failed');
                  $count=(int)($result['count']??0);
                  echo 'P01_NEWS_R4_OFFICIAL_SOURCE_'.$id.'='.$status.' items='.$count.PHP_EOL;
              } catch (Throwable $error) {
                  echo 'P01_NEWS_R4_OFFICIAL_SOURCE_'.$id.'=NOT_PROVEN'.PHP_EOL;
              }
          }
          PHP

      - name: Chromium R4 responsive Owner Guest and resource budget
        shell: bash
        timeout-minutes: 8
        env:
          VF_NEWS_BROWSER_MODULE: /tmp/p01-news-browser
          PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-browsers
          VF_NEWS_TEST_ROOT: p01-r4-clean
        run: |
          set -Eeuo pipefail
          node --check p01-exact/tests/browser/p01_news_r4_chromium.cjs
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs

      - name: Clean temporary private source from public runner
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-r4-clean
          echo P01_NEWS_PRIVATE_SOURCE_CLEANUP=COMPLETE
