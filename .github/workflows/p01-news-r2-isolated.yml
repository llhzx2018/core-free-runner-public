name: P01 Chinese community official hottest public JSON one-shot validation

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

jobs:
  documented-community:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare isolated HTTPS JSON runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl >/dev/null
      - name: Check one documented public hottest topics endpoint without auth or retries
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $url='https://sb.sb/api/v1/topics/?kind=hot&limit=15';
          $body='';
          $ch=curl_init($url);
          curl_setopt_array($ch,[
            CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,
            CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>8,
            CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
            CURLOPT_PROXY=>'',CURLOPT_NOPROXY=>'*',
            CURLOPT_USERAGENT=>'VF Start News/1 (+documented public JSON; Owner-only research)',
            CURLOPT_HTTPHEADER=>['Accept: application/json'],
            CURLOPT_WRITEFUNCTION=>static function($ch,string $chunk)use(&$body):int{
              if(strlen($body)+strlen($chunk)>98304)return 0;
              $body.=$chunk;return strlen($chunk);
            }
          ]);
          $ok=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
          $ctype=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
          $errno=(int)curl_errno($ch);curl_close($ch);
          $data=json_decode($body,true,14,JSON_INVALID_UTF8_SUBSTITUTE);
          $entries=is_array($data['topics']??null)?$data['topics']:[];
          $good=0;
          foreach(array_slice($entries,0,15) as $entry)
            if(is_array($entry)&&is_int($entry['id']??null)
              && is_string($entry['title']??null)&&trim($entry['title'])!=='')$good++;
          echo "SB_OFFICIAL_HOT_HTTP=$status CONTENT_TYPE=".str_replace(["\r","\n"],'',$ctype)." ERRNO=$errno\n";
          echo "SB_OFFICIAL_HOT_TOPIC_COUNT=".count($entries)." VALID=$good\n";
          echo "SB_HOT_PREFLIGHT_NO_AUTH=YES NO_REDIRECT=YES NO_RETRIES=YES NO_PAYLOAD_EXPORT=YES\n";
          if(!$ok||$status!==200||$good<1)exit(8);
          echo "P01_SB_OFFICIAL_HOT_JSON_VALID=PASS\n";
          PHP
      - name: No private artifacts
        if: always()
        run: echo P01_SB_HOT_PROBE_PAYLOAD_STORED=NO
