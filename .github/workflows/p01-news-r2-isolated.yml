name: P01 Official V2EX hot API one-shot read-only access preflight

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-v2ex-public-api-preflight
  cancel-in-progress: false

jobs:
  official-v2ex:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install only PHP HTTPS JSON diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl >/dev/null
      - name: Make one ordinary GET to official unauthenticated hot topics API
        shell: bash
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          $url='https://www.v2ex.com/api/topics/hot.json';
          $body='';
          $ch=curl_init($url);
          curl_setopt_array($ch,[
            CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,
            CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>8,
            CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
            CURLOPT_PROXY=>'',CURLOPT_NOPROXY=>'*',
            CURLOPT_USERAGENT=>'VF Start News/1 (+official publicly documented V2EX API; Owner personal use)',
            CURLOPT_HTTPHEADER=>['Accept: application/json'],
            CURLOPT_WRITEFUNCTION=>static function($ch,string $chunk)use(&$body):int{
              if(strlen($body)+strlen($chunk)>98304)return 0;
              $body.=$chunk;return strlen($chunk);
            }
          ]);
          $ok=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
          $ct=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
          $err=(int)curl_errno($ch);curl_close($ch);
          $data=json_decode($body,true,16,JSON_INVALID_UTF8_SUBSTITUTE);
          $count=is_array($data)&&array_is_list($data)?count($data):0;
          $valid=0;
          foreach(is_array($data)?array_slice($data,0,12):[] as $item){
            if(is_array($item)&&is_int($item['id']??null)
              && is_string($item['title']??null)&&trim($item['title'])!=='')$valid++;
          }
          echo "V2EX_OFFICIAL_V1_ENDPOINT_HTTP=$status CONTENT_TYPE=".preg_replace('/[\r\n]/','',$ct)." ERRNO=$err\n";
          echo "V2EX_OFFICIAL_V1_JSON_ENTRIES=$count VALID_FIRST_TWELVE=$valid\n";
          echo "V2EX_PRECHECK_NO_TOKEN=YES NO_REDIRECT=YES NO_RETRIES=YES NO_CREDENTIALS=YES NO_CONTENT_EXPORTED=YES\n";
          if(!$ok||$status!==200||$count<1||$valid<1)exit(8);
          echo "P01_V2EX_OFFICIAL_HOT_API_READ=PASS\n";
          PHP
      - name: Confirm no persistent feed payload
        if: always()
        run: |
          echo P01_V2EX_PRECHECK_PRIVATE_PAYLOAD=NONE
