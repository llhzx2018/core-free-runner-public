name: P01 News integration against pending 506 candidate

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-506-integration
  cancel-in-progress: false

jobs:
  news-506-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWS_SHA: 5acfc648db7a2f130c7a34f348307e27821af789
      SECURITY_SHA: 2a63c0755c195da4e3330c23d975939fb0cf4a5b
    steps:
      - name: Checkout registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare only News unit and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_506_MERGE_RUNTIME=PASS

      - name: Checkout exact News candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEWS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact pending v506 security candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SECURITY_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-security
          persist-credentials: false
          fetch-depth: 0

      - name: Build uncommitted exact-source integration tree without release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          test "$(git -C p01-security rev-parse HEAD)" = "$SECURITY_SHA"
          git -C p01-news fetch --no-tags ../p01-security HEAD:refs/remotes/vf/security
          git -C p01-news -c user.name="VF Isolated Test" -c user.email="noreply@example.invalid" merge --no-commit --no-ff refs/remotes/vf/security
          test "$(tr -d '\r\n ' < p01-news/VERSION)" = "2.47.506"
          test "$(tr -d '\r\n ' < p01-news/src/VERSION.txt)" = "2.47.506"
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          echo "P01_NEWS_506_TEMPORARY_MERGE_TREE=$(git -C p01-news write-tree)"
          echo P01_NEWS_506_EXACT_SOURCE_MERGE=PASS
          echo P01_NEWS_506_FORMAL_RELEASE=NOT_PERFORMED

      - name: Verify News-only unit and syntax on combined tree
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in p01-news/src/app/NewsFeedService.php p01-news/src/app/NewsFeedPage.php p01-news/src/app/SubjectPageChrome.php p01-news/src/app/NewsSourcePreferences.php p01-news/tests/unit/p01_news_release_surface_contract.php; do php -l "$file" >/dev/null; done
          node --check p01-news/tests/browser/p01_news_r4_chromium.cjs
          php p01-news/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-news-506-source.txt
          grep -E '^P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=[0-9]+$' /tmp/p01-news-506-source.txt
          php p01-news/tests/unit/p01_news_feed_service_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_source_preferences_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_feed_normalizer_contract.php >/dev/null
          echo P01_NEWS_506_FOCUSED_REGRESSION=PASS

      - name: Real News Owner Guest Chromium on ephemeral combined tree
        timeout-minutes: 9
        shell: bash
        env:
          VF_NEWS_BROWSER_MODULE: /tmp/p01-news-506-browser
          PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news-506-browsers
          VF_NEWS_TEST_ROOT: p01-news
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell
          node p01-news/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news-506-browser.txt
          grep -F 'P01_NEWS_R4_CHROMIUM=PASS checks=50' /tmp/p01-news-506-browser.txt
          echo P01_NEWS_506_COMBINED_BROWSER=PASS

      - name: Clean all transient private inputs
        if: always()
        shell: bash
        run: |
          rm -rf p01-news p01-security
          rm -rf /tmp/p01-news-506-browser /tmp/p01-news-506-browsers
          echo P01_NEWS_506_PRIVATE_CLEANUP=COMPLETE
