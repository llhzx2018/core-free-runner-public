name: P01 News plus 506 clean synthetic package structural gate

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-506-integration
  cancel-in-progress: false

jobs:
  news-506-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWS_SHA: 5acfc648db7a2f130c7a34f348307e27821af789
      SECURITY_SHA: 2a63c0755c195da4e3330c23d975939fb0cf4a5b
    steps:
      - name: Checkout registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare package-only runtime, no browser or installation
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_506_MERGE_RUNTIME=PASS

      - name: Checkout exact News candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEWS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact pending v506 security candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SECURITY_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-security
          persist-credentials: false
          fetch-depth: 0

      - name: Build uncommitted exact-source integration tree without release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          test "$(git -C p01-security rev-parse HEAD)" = "$SECURITY_SHA"
          git -C p01-news fetch --no-tags ../p01-security HEAD:refs/remotes/vf/security
          git -C p01-news -c user.name="VF Isolated Test" -c user.email="noreply@example.invalid" merge --no-commit --no-ff refs/remotes/vf/security
          test "$(tr -d '\r\n ' < p01-news/VERSION)" = "2.47.506"
          test "$(tr -d '\r\n ' < p01-news/src/VERSION.txt)" = "2.47.506"
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          echo "P01_NEWS_506_TEMPORARY_MERGE_TREE=$(git -C p01-news write-tree)"
          echo P01_NEWS_506_EXACT_SOURCE_MERGE=PASS
          echo P01_NEWS_506_FORMAL_RELEASE=NOT_PERFORMED

      - name: Verify ephemeral combined package bytes without install or restore
        shell: bash
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          WORK="$(mktemp -d "/tmp/p01-news-package-${GITHUB_RUN_ID}-XXXXXXXX")"
          trap 'rm -rf -- "$WORK"' EXIT
          mkdir -p "$WORK"/{baseline,prior-update,candidate,out}
          gh release download v2.47.505 -R llhzx2018/vf-start -D "$WORK" \
            -p 'VF-Start-V2.47.505-FULL.zip' \
            -p 'VF_Start_V2.47.505_UPDATE.zip'
          unzip -q "$WORK/VF-Start-V2.47.505-FULL.zip" -d "$WORK/baseline"
          unzip -q "$WORK/VF_Start_V2.47.505_UPDATE.zip" -d "$WORK/prior-update"
          test -s "$WORK/prior-update/repair-v2.47.505.php"
          test "$(tr -d '\r\n ' < p01-news/src/VERSION.txt)" = "2.47.506"
          test ! -e p01-news/src/app/.runtime.php
          test -z "$(git -C p01-news ls-files --others --exclude-standard -- src)"
          cp -a p01-news/src/. "$WORK/candidate/"
          test ! -e "$WORK/candidate/app/.runtime.php"
          python3 - "$WORK/candidate" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          v=root/'VERSION.txt'
          assert v.read_text().strip()=='2.47.506'
          v.write_text('2.99.999\n')
          file=root/'app/bootstrap.php'
          src=file.read_text()
          previous="define('VF_VERSION', '2.47.506');"
          assert src.count(previous)==1
          file.write_text(src.replace(previous,"define('VF_VERSION', '2.99.999');"))
          PY
          ZERO=0000000000000000000000000000000000000000
          python3 scripts/p01-maintenance-release.py \
            --candidate "$WORK/candidate" \
            --baseline-full "$WORK/baseline" \
            --baseline-repair "$WORK/prior-update/repair-v2.47.505.php" \
            --out "$WORK/out" --version 2.99.999 --source-version 2.47.505 \
            --target-sha "$ZERO" --target-tree "$ZERO" >/dev/null
          FULL="$WORK/out/VF-Start-V2.99.999-FULL.zip"
          UPDATE="$WORK/out/VF_Start_V2.99.999_UPDATE.zip"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          test "$(unzip -Z1 "$UPDATE")" = "repair-v2.99.999.php"
          for entry in news.php news-feed.php news-preferences.php \
            app/NewsFeedPage.php app/NewsFeedService.php app/NewsSourcePreferences.php \
            assets/news-feed.js assets/news-feed.css app/DisasterRecovery.php app/ChannelLibraryPage.php; do
            unzip -Z1 "$FULL" | grep -Fx "$entry" >/dev/null
            cmp -s <(unzip -p "$FULL" "$entry") "p01-news/src/$entry" || \
              { echo "P01_NEWS_506_PACKAGE_FILE_MISMATCH=$entry"; exit 12; }
          done
          if unzip -Z1 "$FULL" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?|.*\.db|news-cache/|private/|backups?/|sessions?/|tokens?/)' >/dev/null; then
            echo P01_NEWS_506_PACKAGE_PRIVATE_PAYLOAD=FAIL
            exit 13
          fi
          unzip -q "$UPDATE" -d "$WORK/updater"
          php -l "$WORK/updater/repair-v2.99.999.php" >/dev/null
          php "$WORK/updater/repair-v2.99.999.php" --self-test | grep -F '"ok":true' >/dev/null
          echo P01_NEWS_506_SYNTHETIC_FULL_ATOMIC_STRUCTURAL=PASS
          echo P01_NEWS_506_OFFICIAL_ASSETS=NOT_BUILT
          echo P01_NEWS_506_DISASTER_RESTORE=NOT_EXECUTED
          echo P01_NEWS_506_PRODUCTION_WRITE=NO

      - name: Clean all transient private inputs
        if: always()
        shell: bash
        run: |
          rm -rf p01-news p01-security
          rm -rf /tmp/p01-news-506-browser /tmp/p01-news-506-browsers
          echo P01_NEWS_506_PRIVATE_CLEANUP=COMPLETE
