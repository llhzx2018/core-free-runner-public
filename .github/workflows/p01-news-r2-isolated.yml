name: P01 Chinese News official replacement RSS candidate live-read triage

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-official-candidate-probe
  cancel-in-progress: false

jobs:
  official-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare XML parser and TLS
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml >/dev/null
      - name: Verify three published candidate subscriptions only
        shell: bash
        timeout-minutes: 4
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-chinese-candidates.php <<'PHP'
          <?php
          declare(strict_types=1);
          $urls=[
            'solidot-tech'=>'https://www.solidot.org/index.rss',
            'sspai-tech'=>'https://sspai.com/feed',
            'cn-headline'=>'https://www.chinanews.com.cn/rss/importnews.xml'
          ];
          $hosts=['www.solidot.org'=>true,'sspai.com'=>true,'www.chinanews.com.cn'=>true];
          foreach($urls as $id=>$url){
            $host=parse_url($url,PHP_URL_HOST);
            if(!isset($hosts[$host]))exit(16);
            $body='';$ch=curl_init($url);
            curl_setopt_array($ch,[
              CURLOPT_RETURNTRANSFER=>false,CURLOPT_FOLLOWLOCATION=>false,
              CURLOPT_CONNECTTIMEOUT=>3,CURLOPT_TIMEOUT=>7,
              CURLOPT_USERAGENT=>'VF Start News/1 (+source headlines only)',
              CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
              CURLOPT_PROXY=>'',CURLOPT_NOPROXY=>'*',
              CURLOPT_HTTPHEADER=>['Accept: application/rss+xml, application/xml, text/xml'],
              CURLOPT_WRITEFUNCTION=>static function($ch,string $chunk) use(&$body):int{
                if(strlen($body)+strlen($chunk)>393216)return 0;
                $body.=$chunk;return strlen($chunk);
              }
            ]);
            $ok=curl_exec($ch);$status=(int)curl_getinfo($ch,CURLINFO_RESPONSE_CODE);
            $ctype=(string)curl_getinfo($ch,CURLINFO_CONTENT_TYPE);
            $errno=(int)curl_errno($ch);curl_close($ch);
            $items=0;$reason='INVALID_XML';
            if(!$ok)$reason='NETWORK_OR_SIZE_ERROR';
            elseif($status!==200)$reason='HTTP_NOT_200';
            elseif(stripos($ctype,'text/html')!==false)$reason='HTML_PAGE_OR_CHALLENGE';
            elseif(preg_match('/<!\s*(?:DOCTYPE|ENTITY)\b/i',$body))$reason='XML_DTD_DENIED';
            else{
              $prior=libxml_use_internal_errors(true);
              $root=simplexml_load_string($body,'SimpleXMLElement',LIBXML_NONET|LIBXML_NOCDATA);
              if($root!==false){
                $items=isset($root->channel)?count($root->channel->item):0;
                if($root->getName()==='feed'){
                  $root->registerXPathNamespace('atom','http://www.w3.org/2005/Atom');
                  $entries=$root->xpath('/atom:feed/atom:entry');$items=is_array($entries)?count($entries):0;
                }
              }
              libxml_clear_errors();libxml_use_internal_errors($prior);
              $reason=$items>0?'LIVE_XML_ITEMS':'XML_NO_ITEMS';
            }
            echo "CANDIDATE_SOURCE=$id STATUS=$reason HTTP=$status ITEMS=$items ERRNO=$errno\n";
          }
          echo "CANDIDATE_OFFICIAL_LIVE_TRIAGE=COMPLETED NO_BYPASS=YES NO_COOKIES=YES\n";
          PHP
          php /tmp/p01-chinese-candidates.php
      - name: Delete temporary response workspace
        if: always()
        run: |
          rm -f /tmp/p01-chinese-candidates.php
          echo P01_NEWS_CANDIDATE_PROBE_CLEANUP=COMPLETE
