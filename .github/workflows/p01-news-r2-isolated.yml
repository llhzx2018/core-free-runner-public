name: P01 News one-shot real install Atomic preserve rollback against pending 506

on:
  push:
    branches:
      - task/p01-news-r2-proof-20261108

permissions:
  contents: read

concurrency:
  group: p01-news-506-integration
  cancel-in-progress: false

jobs:
  news-506-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEWS_SHA: ccadfd5abbb9886be9961801b6921bf86d380312
      SECURITY_SHA: 2a63c0755c195da4e3330c23d975939fb0cf4a5b
    steps:
      - name: Checkout registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare only News unit and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx SimpleXML
          echo P01_NEWS_506_MERGE_RUNTIME=PASS

      - name: Checkout exact News candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEWS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-news
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact pending v506 security candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SECURITY_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-security
          persist-credentials: false
          fetch-depth: 0

      - name: Build uncommitted exact-source integration tree without release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          test "$(git -C p01-security rev-parse HEAD)" = "$SECURITY_SHA"
          git -C p01-news fetch --no-tags ../p01-security HEAD:refs/remotes/vf/security
          git -C p01-news -c user.name="VF Isolated Test" -c user.email="noreply@example.invalid" merge --no-commit --no-ff refs/remotes/vf/security
          test "$(tr -d '\r\n ' < p01-news/VERSION)" = "2.47.506"
          test "$(tr -d '\r\n ' < p01-news/src/VERSION.txt)" = "2.47.506"
          test "$(git -C p01-news rev-parse HEAD)" = "$NEWS_SHA"
          echo "P01_NEWS_506_TEMPORARY_MERGE_TREE=$(git -C p01-news write-tree)"
          echo P01_NEWS_506_EXACT_SOURCE_MERGE=PASS
          echo P01_NEWS_506_FORMAL_RELEASE=NOT_PERFORMED

      - name: Verify News-only unit and syntax on combined tree
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in p01-news/src/app/NewsFeedService.php p01-news/src/app/NewsFeedPage.php p01-news/src/app/SubjectPageChrome.php p01-news/src/app/NewsSourcePreferences.php p01-news/tests/unit/p01_news_release_surface_contract.php p01-news/src/quick-save.php; do php -l "$file" >/dev/null; done
          node --check p01-news/tests/browser/p01_news_r4_chromium.cjs
          php p01-news/tests/unit/p01_news_release_surface_contract.php | tee /tmp/p01-news-506-source.txt
          grep -Fx 'P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=86' /tmp/p01-news-506-source.txt
          php p01-news/tests/unit/p01_news_feed_service_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_source_preferences_contract.php >/dev/null
          php p01-news/tests/unit/p01_news_feed_normalizer_contract.php >/dev/null
          for f in quick_save_prg_contract.php quick_save_duplicate_action_contract.php quick_save_pending_continuity_contract.php; do
            php "p01-news/tests/unit/$f" >/dev/null
          done
          echo P01_NEWS_506_QUICK_SAVE_CLASSIC_PRG=PASS
          echo P01_NEWS_506_FOCUSED_REGRESSION=PASS

      - name: One-shot clean FULL and 505-to-merged synthetic Atomic preserve rollback without disaster restore
        shell: bash
        timeout-minutes: 14
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          WORK="$(mktemp -d "/tmp/p01-news-package-${GITHUB_RUN_ID}-XXXXXXXX")"
          PIDS=""
          cleanup() {
            for pid in $PIDS; do kill "$pid" >/dev/null 2>&1 || true; done
            rm -rf -- "$WORK"
          }
          trap cleanup EXIT
          mkdir -p "$WORK"/{baseline,prior-update,candidate,out}
          gh release download v2.47.505 -R llhzx2018/vf-start -D "$WORK" \
            -p 'VF-Start-V2.47.505-FULL.zip' \
            -p 'VF_Start_V2.47.505_UPDATE.zip'
          unzip -q "$WORK/VF-Start-V2.47.505-FULL.zip" -d "$WORK/baseline"
          unzip -q "$WORK/VF_Start_V2.47.505_UPDATE.zip" -d "$WORK/prior-update"
          test -s "$WORK/prior-update/repair-v2.47.505.php"
          test "$(tr -d '\r\n ' < p01-news/src/VERSION.txt)" = "2.47.506"
          test ! -e p01-news/src/app/.runtime.php
          test -z "$(git -C p01-news ls-files --others --exclude-standard -- src)"
          cp -a p01-news/src/. "$WORK/candidate/"
          test ! -e "$WORK/candidate/app/.runtime.php"
          python3 - "$WORK/candidate" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          v=root/'VERSION.txt'
          assert v.read_text().strip()=='2.47.506'
          v.write_text('2.99.999\n')
          file=root/'app/bootstrap.php'
          src=file.read_text()
          previous="define('VF_VERSION', '2.47.506');"
          assert src.count(previous)==1
          file.write_text(src.replace(previous,"define('VF_VERSION', '2.99.999');"))
          PY
          ZERO=0000000000000000000000000000000000000000
          python3 scripts/p01-maintenance-release.py \
            --candidate "$WORK/candidate" \
            --baseline-full "$WORK/baseline" \
            --baseline-repair "$WORK/prior-update/repair-v2.47.505.php" \
            --out "$WORK/out" --version 2.99.999 --source-version 2.47.505 \
            --target-sha "$ZERO" --target-tree "$ZERO" >/dev/null
          FULL="$WORK/out/VF-Start-V2.99.999-FULL.zip"
          UPDATE="$WORK/out/VF_Start_V2.99.999_UPDATE.zip"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          test "$(unzip -Z1 "$UPDATE")" = "repair-v2.99.999.php"
          for entry in quick-save.php news.php news-feed.php news-preferences.php \
            app/NewsFeedPage.php app/NewsFeedService.php app/NewsSourcePreferences.php \
            assets/news-feed.js assets/news-feed.css app/DisasterRecovery.php app/ChannelLibraryPage.php; do
            unzip -Z1 "$FULL" | grep -Fx "$entry" >/dev/null
            cmp -s <(unzip -p "$FULL" "$entry") "p01-news/src/$entry" || \
              { echo "P01_NEWS_506_PACKAGE_FILE_MISMATCH=$entry"; exit 12; }
          done
          if unzip -Z1 "$FULL" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?|.*\.db|news-cache/|private/|backups?/|sessions?/|tokens?/)' >/dev/null; then
            echo P01_NEWS_506_PACKAGE_PRIVATE_PAYLOAD=FAIL
            exit 13
          fi
          unzip -q "$UPDATE" -d "$WORK/updater"
          php -l "$WORK/updater/repair-v2.99.999.php" >/dev/null
          php "$WORK/updater/repair-v2.99.999.php" --self-test | grep -F '"ok":true' >/dev/null
          echo P01_NEWS_506_SYNTHETIC_FULL_ATOMIC_STRUCTURAL=PASS
          # Only disposable localhost installs, no import or disaster restore.
          install_fixture() {
            local root="$1" zip="$2" port="$3" password="NEWS-RUN-$GITHUB_RUN_ID-$3"
            mkdir -p "$root"
            unzip -q "$zip" -d "$root"
            php -S "127.0.0.1:$port" -t "$root" >"$WORK/php-$port.log" 2>&1 &
            local pid=$!
            PIDS="$PIDS $pid"
            for i in $(seq 1 45); do
              if curl -fsS -b "$WORK/cookie-$port" -c "$WORK/cookie-$port" \
                "http://127.0.0.1:$port/setup.php" -o "$WORK/setup-$port.html" 2>/dev/null; then break; fi
              sleep .15
            done
            local csrf
            csrf="$(sed -n 's/.*name="setup_csrf" value="\([^"]*\)".*/\1/p' "$WORK/setup-$port.html" | head -1)"
            test -n "$csrf"
            curl -fsS -b "$WORK/cookie-$port" -c "$WORK/cookie-$port" \
              --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode 'site_title=P01 Synthetic News Release Fixture' \
              --data-urlencode "admin_password=$password" \
              --data-urlencode "admin_password_confirm=$password" \
              "http://127.0.0.1:$port/setup.php" >"$WORK/installed-$port.html"
            test -s "$root/app/.runtime.php"
            (cd "$root" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES' >/dev/null
            kill "$pid" >/dev/null 2>&1 || true
            echo "P01_NEWS_506_CLEAN_INSTALL_$port=PASS"
          }
          stage_owner() {
            php -r '
              $root=$argv[1];$tag=$argv[2];
              require $root."/app/bootstrap.php";
              $repo=new VfRepository(vf_db());
              $repo->createCategory(["name"=>"Synthetic Private ".$tag,"is_private"=>true]);
              $item=$repo->savePendingCapture(["url"=>"https://news.example.org/e2e-".$tag,"title"=>"Synthetic Owner ".$tag],"browser-extension");
              if ((int)($item["id"]??0)<=0) exit(23);
              $value="P01-OWNER-PRIVATE-".$tag;
              if(file_put_contents(VF_PRIVATE_ROOT."/news-e2e-".$tag.".txt",$value)!==strlen($value))exit(24);
              if(VF_VERSION!=="2.47.505")exit(25);
            ' "$1" "$2"
          }
          verify_owner() {
            php -r '
              $root=$argv[1];$tag=$argv[2];$expected=$argv[3];
              require $root."/app/bootstrap.php";
              if(VF_VERSION!==$expected)exit(31);
              $q=vf_db()->prepare("SELECT is_private,is_pending FROM links WHERE url=?");
              $q->execute(["https://news.example.org/e2e-".$tag]);
              $rows=$q->fetchAll(PDO::FETCH_ASSOC);
              if(count($rows)!==1||(int)$rows[0]["is_private"]!==1||(int)$rows[0]["is_pending"]!==1)exit(32);
              if((string)@file_get_contents(VF_PRIVATE_ROOT."/news-e2e-".$tag.".txt")!=="P01-OWNER-PRIVATE-".$tag)exit(33);
              if((string)vf_db()->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(34);
            ' "$1" "$2" "$3"
          }
          install_fixture "$WORK/fresh" "$FULL" 18261
          test "$(tr -d '\r\n ' < "$WORK/fresh/VERSION.txt")" = "2.99.999"
          test -f "$WORK/fresh/news.php"
          echo P01_NEWS_506_REAL_SYNTHETIC_FULL_INSTALL=PASS

          install_fixture "$WORK/upgrade" "$WORK/VF-Start-V2.47.505-FULL.zip" 18262
          stage_owner "$WORK/upgrade" upgrade
          cp "$WORK/updater/repair-v2.99.999.php" "$WORK/upgrade/"
          php "$WORK/upgrade/repair-v2.99.999.php" --run="$WORK/upgrade" | grep -F '"ok":true' >/dev/null
          test "$(tr -d '\r\n ' < "$WORK/upgrade/VERSION.txt")" = "2.99.999"
          test -f "$WORK/upgrade/news.php"
          verify_owner "$WORK/upgrade" upgrade 2.99.999
          (cd "$WORK/upgrade" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES' >/dev/null
          echo P01_NEWS_506_REAL_SYNTHETIC_ATOMIC_PRIVATE_PRESERVED=PASS

          install_fixture "$WORK/rollback" "$WORK/VF-Start-V2.47.505-FULL.zip" 18263
          stage_owner "$WORK/rollback" rollback
          cp "$WORK/updater/repair-v2.99.999.php" "$WORK/rollback/"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$WORK/rollback/repair-v2.99.999.php" \
            --run="$WORK/rollback" >"$WORK/forced-failure.log" 2>&1
          failure=$?
          set -e
          test "$failure" -ne 0
          test "$(tr -d '\r\n ' < "$WORK/rollback/VERSION.txt")" = "2.47.505"
          test ! -e "$WORK/rollback/news.php"
          verify_owner "$WORK/rollback" rollback 2.47.505
          (cd "$WORK/rollback" && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES' >/dev/null
          echo P01_NEWS_506_REAL_SYNTHETIC_ATOMIC_FAULT_ROLLBACK=PASS
          echo P01_NEWS_506_DISASTER_RESTORE=NOT_EXECUTED
          echo P01_NEWS_506_OFFICIAL_RELEASE=NOT_PUBLISHED
          echo P01_NEWS_506_PRODUCTION_WRITES=NONE

          echo P01_NEWS_506_OFFICIAL_ASSETS=NOT_BUILT
          echo P01_NEWS_506_DISASTER_RESTORE=NOT_EXECUTED
          echo P01_NEWS_506_PRODUCTION_WRITE=NO

      - name: Clean all transient private inputs
        if: always()
        shell: bash
        run: |
          rm -rf p01-news p01-security
          rm -rf /tmp/p01-news-506-browser /tmp/p01-news-506-browsers
          echo P01_NEWS_506_PRIVATE_CLEANUP=COMPLETE
