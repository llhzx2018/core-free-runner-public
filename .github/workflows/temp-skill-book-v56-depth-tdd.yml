name: TEMP skill-book V5.6 final candidate byte seal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BRANCH: work/skill-book-v56-practical-asset-depth
  EXPECTED_STAGED: 98d6e788644bd6504249c2c7a4c8ce1d75e16671
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829
  CANDIDATE_NAME: skill-book_V5.6_CANDIDATE_20260829.zip

jobs:
  final-candidate-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact staged Candidate and reconcile final-byte metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_STAGED"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/finalize_v56_candidate.py
          python runner/temp/skill-book-v56/finalize_v56_candidate.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          grep -q 'LOCAL_FINAL_BYTES_SEALED_AFTER_METADATA_RECONCILIATION' gov/skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md
          grep -q 'PASS_REQUIRED_AND_VERIFIED_FOR_IMMUTABLE_CANDIDATE' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '"current_promotion": "NOT_AUTHORIZED"' gov/skills/skill-book/V5.6/MANIFEST.json

      - name: Final-byte regression and deterministic double build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('gov/skills/skill-book/V5.6')
          rows=(root/'SHA256SUMS.txt').read_text().splitlines(); seen=set()
          for row in rows:
              digest,rel=row.split('  ',1); assert rel not in seen; seen.add(rel)
              p=root/rel; assert p.is_file(); assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt' and '__pycache__' not in p.parts and p.suffix!='.pyc'}
          assert seen==actual
          m=json.loads((root/'MANIFEST.json').read_text())
          h=hashlib.sha256()
          for item in m['files']:
              p=root/item['path']; data=p.read_bytes(); digest=hashlib.sha256(data).hexdigest()
              assert digest==item['sha256']; assert len(data)==item['bytes']
              h.update(f"{digest}  {item['path']}\n".encode())
          assert h.hexdigest()==m['validation']['source_non_manifest_tree_sha256']
          assert m['status']=='CANDIDATE_NOT_CURRENT'
          assert m['current_promotion']=='NOT_AUTHORIZED'
          assert m['real_reader_evidence']=='NOT_RUN'
          print('FINAL_SHA_ROWS='+str(len(rows)))
          print('FINAL_TREE_SHA='+h.hexdigest())
          PY
          test "$(find gov/skills/skill-book/V5.6 -name '*.py' -type f | wc -l)" -eq 39
          find gov/skills/skill-book/V5.6 -name '*.py' -type f -print0 | xargs -0 python -m py_compile
          python -m pip install --quiet pytest
          python -m pytest -q gov/skills/skill-book/V5.6/tests | tee /tmp/v56-final-byte.txt
          grep -Eq '122 passed' /tmp/v56-final-byte.txt
          echo 'V56_FINAL_BYTE_FULL_REGRESSION=122/122_PASS'
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile
          root=Path('gov/skills/skill-book/V5.6')
          outa=Path('/tmp/skill-book_V5.6_CANDIDATE_20260829_A.zip')
          outb=Path('/tmp/skill-book_V5.6_CANDIDATE_20260829_B.zip')
          final=Path('/tmp/skill-book_V5.6_CANDIDATE_20260829.zip')
          def build(out):
              files=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
              assert len(files)==98, len(files)
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in files:
                      rel=p.relative_to(root).as_posix()
                      zi=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0))
                      zi.create_system=3
                      zi.external_attr=(0o100644 << 16)
                      zi.compress_type=zipfile.ZIP_DEFLATED
                      z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          build(outa); build(outb)
          a=outa.read_bytes(); b=outb.read_bytes(); assert a==b
          sha=hashlib.sha256(a).hexdigest(); final.write_bytes(a)
          with zipfile.ZipFile(final) as z:
              names=z.namelist(); assert len(names)==98; assert len(names)==len(set(names)); assert z.testzip() is None
              for n in names:
                  pp=PurePosixPath(n); assert not pp.is_absolute(); assert '..' not in pp.parts; assert '__pycache__' not in pp.parts; assert not n.endswith('.pyc')
              sums=z.read('SHA256SUMS.txt').decode().splitlines(); assert len(sums)==97
              for row in sums:
                  digest,rel=row.split('  ',1); assert rel in names; assert hashlib.sha256(z.read(rel)).hexdigest()==digest
          shafile=Path('/tmp/skill-book_V5.6_CANDIDATE_20260829.zip.sha256')
          shafile.write_text(f'{sha}  {final.name}\n')
          Path('/tmp/v56_candidate_meta.txt').write_text(f'CANDIDATE_BYTES={len(a)}\nCANDIDATE_SHA256={sha}\nCANDIDATE_FILES=98\nINTERNAL_SHA=97/97_PASS\nCRC=PASS\nDETERMINISTIC_DOUBLE_BUILD=PASS\n')
          print(Path('/tmp/v56_candidate_meta.txt').read_text(),end='')
          PY

      - name: Guarded immutable Candidate source writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin "refs/heads/${GOV_BRANCH}" | awk '{print $1}')"
          test "$live" = "$EXPECTED_STAGED"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md skills/skill-book/V5.6/MANIFEST.json skills/skill-book/V5.6/SHA256SUMS.txt
          git -C gov diff --cached --quiet && exit 1 || true
          git -C gov commit -m 'skill-book: finalize V5.6 candidate package identity'
          git -C gov push origin "HEAD:refs/heads/${GOV_BRANCH}"
          echo "V56_FINAL_CANDIDATE_SOURCE=$(git -C gov rev-parse HEAD)"
          cat /tmp/v56_candidate_meta.txt

      - name: Upload locally sealed Candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: skill-book_V5.6_CANDIDATE_20260829_LOCAL_SEAL
          path: |
            /tmp/skill-book_V5.6_CANDIDATE_20260829.zip
            /tmp/skill-book_V5.6_CANDIDATE_20260829.zip.sha256
          if-no-files-found: error
          retention-days: 7
