name: TEMP skill-book V5.6 fresh-gate committed-state reseal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BRANCH: work/skill-book-v56-practical-asset-depth
  EXPECTED_WIP: c3b19fe5ccb751019443495f3dc975f3ab8ab046
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829

jobs:
  committed-state-reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact WIP and apply evidence-only reconciliation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_WIP"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/record_v56_fresh_gate.py
          python runner/temp/skill-book-v56/record_v56_fresh_gate.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          grep -q '"fresh_non_a1_generation": "PASS"' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '33258236680 / 99115573137' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q 'V5.6_FRESH_NON_A1_READING_CLUB_20260829' gov/mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md

      - name: Verify package SHA and full regression before writeback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('gov/skills/skill-book/V5.6')
          rows=(root/'SHA256SUMS.txt').read_text().splitlines()
          seen=set()
          for row in rows:
              digest, rel=row.split('  ',1)
              assert rel not in seen
              seen.add(rel)
              p=root/rel
              assert p.is_file(), rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, rel
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt'}
          assert seen==actual, (len(seen),len(actual),sorted(actual-seen),sorted(seen-actual))
          print(f'SHA256SUMS_PASS={len(rows)}')
          PY
          test "$(find gov/skills/skill-book/V5.6 -name '*.py' -type f | wc -l)" -eq 39
          find gov/skills/skill-book/V5.6 -name '*.py' -type f -print0 | xargs -0 python -m py_compile
          python -m pytest -q gov/skills/skill-book/V5.6/tests | tee /tmp/v56-full.txt
          grep -Eq '122 passed' /tmp/v56-full.txt
          echo 'V56_COMMITTED_STATE_FULL_REGRESSION=122/122_PASS'

      - name: Guarded exact three-file WIP writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin "refs/heads/${GOV_BRANCH}" | awk '{print $1}')"
          test "$live" = "$EXPECTED_WIP"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt
          git -C gov diff --cached --quiet && exit 1 || true
          git -C gov commit -m 'skill-book: record V5.6 fresh non-A1 gate evidence'
          git -C gov push origin "HEAD:refs/heads/${GOV_BRANCH}"
          echo "V56_FRESH_GATE_EVIDENCE_WIP=$(git -C gov rev-parse HEAD)"
