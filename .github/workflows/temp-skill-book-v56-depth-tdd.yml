name: TEMP skill-book V5.6 candidate exact-source staging

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BRANCH: work/skill-book-v56-practical-asset-depth
  EXPECTED_WIP: a521a8c974a3175abcfbc970a643b6bcbb0ba581
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829

jobs:
  candidate-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact closed WIP and stage Candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_WIP"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/stage_v56_candidate.py
          python runner/temp/skill-book-v56/stage_v56_candidate.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SKILL.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt \
            skills/skill-book/V5.6/agents/openai.yaml \
            skills/skill-book/V5.6/tests/test_skill_contract.py | sort)"
          grep -q '# skill-book V5.6 Candidate' gov/skills/skill-book/V5.6/SKILL.md
          grep -q 'status: candidate_not_current' gov/skills/skill-book/V5.6/agents/openai.yaml
          grep -q '"status": "CANDIDATE_NOT_CURRENT"' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '"candidate_authorization": "AUTHORIZED_TO_SEAL_CANDIDATE"' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '"current_promotion": "NOT_AUTHORIZED"' gov/skills/skill-book/V5.6/MANIFEST.json

      - name: Verify staged Candidate package and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('gov/skills/skill-book/V5.6')
          rows=(root/'SHA256SUMS.txt').read_text().splitlines(); seen=set()
          for row in rows:
              digest,rel=row.split('  ',1); assert rel not in seen; seen.add(rel)
              p=root/rel; assert p.is_file(); assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt' and '__pycache__' not in p.parts and p.suffix!='.pyc'}
          assert seen==actual
          m=json.loads((root/'MANIFEST.json').read_text())
          h=hashlib.sha256()
          for item in m['files']:
              p=root/item['path']; data=p.read_bytes(); digest=hashlib.sha256(data).hexdigest()
              assert digest==item['sha256']; assert len(data)==item['bytes']
              h.update(f"{digest}  {item['path']}\n".encode())
          assert h.hexdigest()==m['validation']['source_non_manifest_tree_sha256']
          assert m['package_seal_state']['local_final_bytes'].startswith('PENDING_')
          assert m['real_reader_evidence']=='NOT_RUN'
          print('STAGED_CANDIDATE_SHA_PASS='+str(len(rows)))
          print('STAGED_CANDIDATE_TREE='+h.hexdigest())
          PY
          test "$(find gov/skills/skill-book/V5.6 -name '*.py' -type f | wc -l)" -eq 39
          find gov/skills/skill-book/V5.6 -name '*.py' -type f -print0 | xargs -0 python -m py_compile
          python -m pip install --quiet pytest
          python -m pytest -q gov/skills/skill-book/V5.6/tests | tee /tmp/v56-candidate-stage.txt
          grep -Eq '122 passed' /tmp/v56-candidate-stage.txt
          echo 'V56_CANDIDATE_STAGE_FULL_REGRESSION=122/122_PASS'

      - name: Guarded staged-Candidate writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin "refs/heads/${GOV_BRANCH}" | awk '{print $1}')"
          test "$live" = "$EXPECTED_WIP"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SKILL.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt \
            skills/skill-book/V5.6/agents/openai.yaml \
            skills/skill-book/V5.6/tests/test_skill_contract.py | sort)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SKILL.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt \
            skills/skill-book/V5.6/agents/openai.yaml \
            skills/skill-book/V5.6/tests/test_skill_contract.py
          git -C gov diff --cached --quiet && exit 1 || true
          git -C gov commit -m 'skill-book: stage V5.6 candidate exact source'
          git -C gov push origin "HEAD:refs/heads/${GOV_BRANCH}"
          echo "V56_CANDIDATE_STAGED_SOURCE=$(git -C gov rev-parse HEAD)"
