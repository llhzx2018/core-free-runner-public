name: TEMP skill-book V5.6 remote exact-source release gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  CANDIDATE_SOURCE: b32fda1c75fdbc4d2e40aaaa444ba7b31e06bd28
  EXPECTED_MAIN: f3d7ff5e1b40db3737862156661186a234c11138
  EXPECTED_ZIP_SHA: 57ba8943013946d22ec1555619ea07797f93a89ae1966c38f341e7e3c372f48a
  EXPECTED_ZIP_BYTES: '197611'
  CANDIDATE_NAME: skill-book_V5.6_CANDIDATE_20260829.zip
  RELEASE_TAG: skill-book-v5.6-candidate-20260829

jobs:
  remote-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone immutable Candidate source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$CANDIDATE_SOURCE"
          test "$(git -C gov rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test "$(git -C gov ls-remote origin refs/heads/work/skill-book-v56-practical-asset-depth | awk '{print $1}')" = "$CANDIDATE_SOURCE"
          grep -q '# skill-book V5.6 Candidate' gov/skills/skill-book/V5.6/SKILL.md
          grep -q '"status": "CANDIDATE_NOT_CURRENT"' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '"current_promotion": "NOT_AUTHORIZED"' gov/skills/skill-book/V5.6/MANIFEST.json

      - name: Remote exact-source full regression and deterministic rebuild
        shell: bash
        run: |
          set -euo pipefail
          test "$(find gov/skills/skill-book/V5.6 -name '*.py' -type f | wc -l)" -eq 39
          find gov/skills/skill-book/V5.6 -name '*.py' -type f -print0 | xargs -0 python -m py_compile
          python -m pip install --quiet pytest
          python -m pytest -q gov/skills/skill-book/V5.6/tests | tee /tmp/v56-remote.txt
          grep -Eq '122 passed' /tmp/v56-remote.txt
          python - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,zipfile,os
          root=Path('gov/skills/skill-book/V5.6')
          a=Path('/tmp/remote_A.zip'); b=Path('/tmp/remote_B.zip'); final=Path('/tmp')/os.environ['CANDIDATE_NAME']
          def build(out):
              files=sorted(p for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix!='.pyc')
              assert len(files)==98
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in files:
                      rel=p.relative_to(root).as_posix(); zi=zipfile.ZipInfo(rel,date_time=(1980,1,1,0,0,0)); zi.create_system=3; zi.external_attr=(0o100644<<16); zi.compress_type=zipfile.ZIP_DEFLATED
                      z.writestr(zi,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          build(a); build(b); ba=a.read_bytes(); bb=b.read_bytes(); assert ba==bb
          sha=hashlib.sha256(ba).hexdigest(); assert sha==os.environ['EXPECTED_ZIP_SHA']; assert len(ba)==int(os.environ['EXPECTED_ZIP_BYTES']); final.write_bytes(ba)
          with zipfile.ZipFile(final) as z:
              names=z.namelist(); assert len(names)==98; assert len(names)==len(set(names)); assert z.testzip() is None
              for n in names:
                  pp=PurePosixPath(n); assert not pp.is_absolute(); assert '..' not in pp.parts; assert '__pycache__' not in pp.parts; assert not n.endswith('.pyc')
              sums=z.read('SHA256SUMS.txt').decode().splitlines(); assert len(sums)==97
              for row in sums:
                  digest,rel=row.split('  ',1); assert rel in names; assert hashlib.sha256(z.read(rel)).hexdigest()==digest
          (Path('/tmp')/(os.environ['CANDIDATE_NAME']+'.sha256')).write_text(f"{sha}  {os.environ['CANDIDATE_NAME']}\n")
          print('REMOTE_EXACT_SOURCE=PASS')
          print('REMOTE_FULL_REGRESSION=122/122_PASS')
          print('REMOTE_DETERMINISTIC_DOUBLE_BUILD=PASS')
          print('REMOTE_ZIP_SHA256='+sha)
          print('REMOTE_ZIP_BYTES='+str(len(ba)))
          print('REMOTE_ZIP_FILES=98')
          print('REMOTE_INTERNAL_SHA=97/97_PASS')
          print('REMOTE_CRC=PASS')
          PY

      - name: Gated fast-forward Candidate source to main
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$EXPECTED_MAIN"
          git -C gov merge-base --is-ancestor "$EXPECTED_MAIN" "$CANDIDATE_SOURCE"
          test -z "$(git -C gov ls-remote origin "refs/tags/${RELEASE_TAG}")"
          git -C gov push origin "$CANDIDATE_SOURCE:refs/heads/main"
          test "$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')" = "$CANDIDATE_SOURCE"
          echo "V56_MAIN_EXACT_CANDIDATE_SOURCE=$CANDIDATE_SOURCE"

      - name: Publish prerelease bound to immutable source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          skill-book V5.6 Candidate closes the Practical Asset Depth / Adequacy design gate.

          Evidence highlights:
          - Practical Asset Depth targeted non-A1 matrix: 12/12 PASS
          - Inherited Adequacy targeted suite: 6/6 PASS
          - Runtime depth integration: 36/36 PASS
          - Full regression on immutable Candidate bytes: 122/122 PASS
          - Fresh non-A1 reading-club generation: 9/9 PASS
          - Old Adequacy false-green reproduced; V5.6 Depth blocked shallow evidence/recovery trace; repair PASS without verifier/contract mutation
          - Deterministic double build, CRC, path safety and internal SHA verification: PASS
          - Real Reader Evidence: NOT_RUN
          - Source Current remains V3.5; V5.6 is Candidate / NOT CURRENT
          EOF
          gh release create "$RELEASE_TAG" "/tmp/${CANDIDATE_NAME}" "/tmp/${CANDIDATE_NAME}.sha256" \
            --repo "$GOV_REPO" --target "$CANDIDATE_SOURCE" \
            --title 'skill-book V5.6 Candidate · 2026-08-29' \
            --notes-file /tmp/release-notes.md --prerelease
          test "$(git -C gov ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')" = "$CANDIDATE_SOURCE"
          gh release view "$RELEASE_TAG" --repo "$GOV_REPO" --json databaseId,tagName,name,isPrerelease,isDraft,targetCommitish,url,assets | tee /tmp/release-view.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/release-view.json'))
          assert d['tagName']=='skill-book-v5.6-candidate-20260829'
          assert d['name']=='skill-book V5.6 Candidate · 2026-08-29'
          assert d['isPrerelease'] is True and d['isDraft'] is False
          names=sorted(x['name'] for x in d['assets'])
          assert names==['skill-book_V5.6_CANDIDATE_20260829.zip','skill-book_V5.6_CANDIDATE_20260829.zip.sha256'],names
          print('PRERELEASE_METADATA_PASS')
          print('RELEASE_DATABASE_ID='+str(d['databaseId']))
          print('RELEASE_URL='+d['url'])
          PY

      - name: Remote release asset readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/readback && mkdir /tmp/readback
          gh release download "$RELEASE_TAG" --repo "$GOV_REPO" --dir /tmp/readback
          test "$(stat -c '%s' "/tmp/readback/${CANDIDATE_NAME}")" = "$EXPECTED_ZIP_BYTES"
          test "$(sha256sum "/tmp/readback/${CANDIDATE_NAME}" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA"
          grep -qx "${EXPECTED_ZIP_SHA}  ${CANDIDATE_NAME}" "/tmp/readback/${CANDIDATE_NAME}.sha256"
          python - <<'PY'
          import zipfile,hashlib,os
          p='/tmp/readback/'+os.environ['CANDIDATE_NAME']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None; names=z.namelist(); assert len(names)==98; assert len(names)==len(set(names))
              sums=z.read('SHA256SUMS.txt').decode().splitlines(); assert len(sums)==97
              for row in sums:
                  digest,rel=row.split('  ',1); assert hashlib.sha256(z.read(rel)).hexdigest()==digest
          print('REMOTE_RELEASE_READBACK_PASS')
          PY
