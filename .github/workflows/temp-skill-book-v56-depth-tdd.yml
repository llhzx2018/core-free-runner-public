name: TEMP skill-book V5.6 practical asset depth TDD gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  WIP_COMMIT: f95e66f4ccf132b8191d14a7a130aadae253b081

jobs:
  expected-red-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP test commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$WIP_COMMIT"
          test "$(git -C gov rev-parse HEAD)" = "$WIP_COMMIT"
          test -f gov/skills/skill-book/V5.6/tests/test_practical_asset_depth_audit.py
          test ! -f gov/skills/skill-book/V5.6/scripts/practical_asset_depth_audit.py
          echo RED_PRECONDITION_PASS
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Prove targeted tests are red before verifier exists
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q tests/test_practical_asset_depth_audit.py > /tmp/collect.txt
          grep -q '8 tests collected' /tmp/collect.txt
          set +e
          python -m pytest -q tests/test_practical_asset_depth_audit.py > /tmp/red.txt 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q 'failed' /tmp/red.txt
          echo EXPECTED_RED_BASELINE_PASS
