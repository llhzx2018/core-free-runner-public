name: TEMP skill-book V5.6 exact WIP full regression gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_WIP_BRANCH: work/skill-book-v56-practical-asset-depth
  GOV_WIP_HEAD: 472c8f73a318c093ae5d14ad7a06f241828711dc

jobs:
  full-wip-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP head
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_WIP_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_WIP_HEAD"
          echo "EXACT_WIP_HEAD_PASS=$GOV_WIP_HEAD"

      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile Python sources
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(find scripts tests -type f -name '*.py' | sort)
          test "${#pyfiles[@]}" -gt 0
          python -m py_compile "${pyfiles[@]}"
          echo "PYTHON_COMPILE_PASS=${#pyfiles[@]}"

      - name: Run complete V5.6 WIP pytest suite
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest -q | tee /tmp/v56-full.txt
          grep -Eq '[0-9]+ passed' /tmp/v56-full.txt
          ! grep -Eq '[0-9]+ failed|[0-9]+ error' /tmp/v56-full.txt
          echo V56_FULL_WIP_REGRESSION_PASS
