name: TEMP skill-book V5.6 practical asset depth TDD gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  WIP_COMMIT: 02560d0062ea3ab5b05d50e19d1ed3b09dda3a05

jobs:
  wip-full-impact-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$WIP_COMMIT"
          test "$(git -C gov rev-parse HEAD)" = "$WIP_COMMIT"
          echo WIP_EXACT_CHECKOUT_PASS
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Collect WIP suite
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q | tee /tmp/collect.txt
          tail -n 2 /tmp/collect.txt
      - name: Run full WIP suite and preserve truthful result
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          set +e
          python -m pytest -q | tee /tmp/full.txt
          RC=${PIPESTATUS[0]}
          set -e
          echo "WIP_FULL_RC=$RC"
          if [ "$RC" -eq 0 ]; then
            echo WIP_FULL_PASS
          else
            echo WIP_FULL_EXPECTED_RECONCILIATION_GAPS_PRESENT
            exit "$RC"
          fi
