name: TEMP skill-book V5.6 fresh non-A1 generation gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  V56_SOURCE: c3b19fe5ccb751019443495f3dc975f3ab8ab046
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829

jobs:
  fresh-non-a1-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP source and fresh generator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$V56_SOURCE"
          test "$(git -C gov rev-parse HEAD)" = "$V56_SOURCE"
          test "$(cat gov/skills/skill-book/V5.6/VERSION)" = '5.6'
          grep -q 'SB56-RUNTIME-CONTRACT-CBE00206' gov/skills/skill-book/V5.6/SKILL.md
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/fresh_non_a1_reading_club.py
          test -f runner/temp/skill-book-v56/patch_fresh_non_a1_generation_v2.py
          test -f runner/temp/skill-book-v56/patch_fresh_non_a1_generation_v3_depth.py
          (cd runner && python temp/skill-book-v56/patch_fresh_non_a1_generation_v2.py)
          (cd runner && python temp/skill-book-v56/patch_fresh_non_a1_generation_v3_depth.py)
          echo "FRESH_SOURCE_IDENTITY_PASS=$V56_SOURCE"

      - name: Generate fresh non-A1 practical knowledge product and run gates
        shell: bash
        run: |
          set -euo pipefail
          python runner/temp/skill-book-v56/fresh_non_a1_reading_club.py \
            gov/skills/skill-book/V5.6 \
            "$RUNNER_TEMP/fresh-reading-club" | tee /tmp/fresh-non-a1.txt
          grep -q 'FRESH_NON_A1_GENERATION_GATE_PASS' /tmp/fresh-non-a1.txt
          grep -q 'THIN_ITERATION_OLD_ADEQUACY_FALSE_GREEN=PASS' /tmp/fresh-non-a1.txt
          grep -q 'THIN_ITERATION_DEPTH_BLOCK=PASS' /tmp/fresh-non-a1.txt
          grep -q 'DEPTH_REPAIRED=PASS' /tmp/fresh-non-a1.txt
          test -f "$RUNNER_TEMP/fresh-reading-club/evidence/FRESH_NON_A1_SUMMARY.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'fresh-reading-club/evidence/FRESH_NON_A1_SUMMARY.json'
          d=json.loads(p.read_text())
          assert d['decision']=='PASS_FRESH_NON_A1_GENERATION_DEPTH_GATE'
          assert d['canonical_used'] is False
          assert d['real_reader_evidence']=='NOT_RUN'
          assert d['fresh_reader_facing_chapters']==3
          assert d['fresh_practical_assets']==8
          assert d['adversarial_mutation']['old_adequacy_result']=='PASS_FALSE_GREEN_REPRODUCED'
          assert d['adversarial_mutation']['depth_result']=='BLOCK_AS_REQUIRED'
          assert d['adversarial_mutation']['repair_result']=='PASS'
          assert d['adversarial_mutation']['verifier_changed_during_repair'] is False
          print('FRESH_NON_A1_SUMMARY_ASSERTIONS_PASS')
          PY
