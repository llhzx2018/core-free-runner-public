name: TEMP skill-book V5.6 practical asset depth TDD gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_WIP_BRANCH: work/skill-book-v56-practical-asset-depth
  GOV_WIP_BASE: d561d7df74388c9871577edd4311bd8291a997d2

jobs:
  runtime-depth-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP branch
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_WIP_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_WIP_BASE"
          echo WIP_PATCH_BASE_PASS

      - name: Patch runtime acceptance and fixture atomically
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def repl(s,old,new,label,count=1):
              got=s.count(old)
              assert got==count,(label,got,count)
              return s.replace(old,new)

          p=Path('scripts/runtime_acceptance_audit.py')
          s=p.read_text(encoding='utf-8')
          s=repl(s,"ADEQ=ROOT/'adequacy_audit.py'\nBASE=ROOT/'postdraft_baseline_audit.py'","ADEQ=ROOT/'adequacy_audit.py'\nDEPTH=ROOT/'practical_asset_depth_audit.py'\nBASE=ROOT/'postdraft_baseline_audit.py'",'runtime-depth-script')
          s=repl(s,"'evidence/training_feedback_contract.json','evidence/training_feedback_pre_freeze.json','evidence/adequacy_contract.json','evidence/adequacy_audit.json',\n 'evidence/prefreeze_random_open.json'","'evidence/training_feedback_contract.json','evidence/training_feedback_pre_freeze.json','evidence/adequacy_contract.json','evidence/adequacy_audit.json',\n 'evidence/practical_asset_depth_contract.json','evidence/practical_asset_depth_audit.json',\n 'evidence/prefreeze_random_open.json'",'runtime-receipt-list')
          s=repl(s,"    declared_adequacy=root/'evidence'/'adequacy_audit.json'\n    if not declared_adequacy.exists(): blocks.append('ADEQUACY_AUDIT_EVIDENCE_MISSING')\n    reader_contract=root/'evidence'/'reader_transformation_contract.json'","    declared_adequacy=root/'evidence'/'adequacy_audit.json'\n    if not declared_adequacy.exists(): blocks.append('ADEQUACY_AUDIT_EVIDENCE_MISSING')\n    depth_contract=root/'evidence'/'practical_asset_depth_contract.json'\n    if not depth_contract.exists(): blocks.append('PRACTICAL_ASSET_DEPTH_CONTRACT_EVIDENCE_MISSING')\n    declared_depth=root/'evidence'/'practical_asset_depth_audit.json'\n    if not declared_depth.exists(): blocks.append('PRACTICAL_ASSET_DEPTH_AUDIT_EVIDENCE_MISSING')\n    reader_contract=root/'evidence'/'reader_transformation_contract.json'",'runtime-depth-evidence')
          s=repl(s,"        ao=Path(td)/'adequacy.json';cp,ar=run_json([sys.executable,str(ADEQ),'--new',str(root),'--json',str(ao)],ao)\n        if cp.returncode!=0 or not ar or ar.get('decision')!='PASS': blocks.append('ADEQUACY_EXTERNAL_REAUDIT_BLOCK')\n        ro=Path(td)/'responsibility.json'","        ao=Path(td)/'adequacy.json';cp,ar=run_json([sys.executable,str(ADEQ),'--new',str(root),'--json',str(ao)],ao)\n        if cp.returncode!=0 or not ar or ar.get('decision')!='PASS': blocks.append('ADEQUACY_EXTERNAL_REAUDIT_BLOCK')\n        do=Path(td)/'practical_asset_depth.json';cpd,drsp=run_json([sys.executable,str(DEPTH),'--new',str(root),'--json',str(do)],do)\n        if cpd.returncode!=0 or not drsp or drsp.get('decision')!='PASS': blocks.append('PRACTICAL_ASSET_DEPTH_EXTERNAL_REAUDIT_BLOCK')\n        ro=Path(td)/'responsibility.json'",'runtime-depth-reaudit')
          s=repl(s,"'adequacy_external':ar if 'ar' in locals() else None,'generation_responsibility_external':","'adequacy_external':ar if 'ar' in locals() else None,'practical_asset_depth_external':drsp if 'drsp' in locals() else None,'generation_responsibility_external':",'runtime-depth-report')
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_runtime_acceptance_audit.py')
          s=p.read_text(encoding='utf-8')
          s=repl(s,";ADEQ=R/'scripts'/'adequacy_audit.py';RESP=R/'scripts'/'generation_responsibility_audit.py'",";ADEQ=R/'scripts'/'adequacy_audit.py';DEPTH=R/'scripts'/'practical_asset_depth_audit.py';RESP=R/'scripts'/'generation_responsibility_audit.py'",'fixture-depth-script')
          old="'evidence/adequacy_contract.json','evidence/adequacy_audit.json','evidence/prefreeze_random_open.json'"
          new="'evidence/adequacy_contract.json','evidence/adequacy_audit.json','evidence/practical_asset_depth_contract.json','evidence/practical_asset_depth_audit.json','evidence/prefreeze_random_open.json'"
          s=repl(s,old,new,'fixture-depth-lists',2)
          old="""## 验证与验收
预期输出 实际 验证 验收 PASS FAIL。
## 错误类型与恢复
错误类型 为什么错 失败 恢复 纠错 回滚 重试。
## 参考判断
参考判断：证据满足阈值才继续。
## 完成条件
完成条件：独立复核后进入下一步。
"""
          new="""## 验证与验收
Expected: ____ Actual: ____ Verification method: ____ PASS / FAIL / PARTIAL: ____ Defect / rework: ____
## 证据追踪
Record ID: ____ Source / actor: ____ Date: ____ Action / observation: ____ Result: ____ Interpretation: ____ Linked decision/change: ____
## 决策复核
Options: A / B. Criteria / threshold: ____ Evidence source: ____ Selected option: ____ Rationale / tradeoff: ____ Uncertainty: ____ Revisit trigger: ____
## 变更控制
Baseline version: ____ Proposed change: ____ Change reason / evidence: ____ Owner / authority: ____ Impact: ____ Revalidation: ____ Accept / Reject / Defer: ____ Superseded version / rollback target: ____
## 错误类型与恢复
Failure trigger: ____ Diagnosis / likely cause: ____ Recovery action: ____ Retry condition: ____ Post-retry evidence: ____ Escalate or pause when: ____
错误类型 为什么错 失败 恢复 纠错 回滚 重试。
## 参考判断
参考判断：证据满足阈值才继续。
## 完成条件
完成条件：独立复核后进入下一步。
"""
          s=repl(s,old,new,'fixture-rich-tool')
          old="  w(new/'evidence'/'adequacy_contract.json',json.dumps({'chapters':chapters,'assets':assets},ensure_ascii=False))\n  rtc="
          new="""  w(new/'evidence'/'adequacy_contract.json',json.dumps({'chapters':chapters,'assets':assets},ensure_ascii=False))
  depth_dims={
   'decision_record':['input_evidence','decision_rule','completion'],
   'plan_or_contract':['context_task','change_control','validation_acceptance','completion'],
   'execution_brief_or_log':['input_evidence','execution_steps','evidence_log','failure_recovery','validation_acceptance','completion'],
   'acceptance_record':['validation_acceptance','completion'],
   'iteration_log':['evidence_log','decision_rule','completion']}
  depth_assets=[{'path':asset_paths[i],'roles':[c],'complexity':'HIGH','required_dimensions':depth_dims[c],'n_a':{},'promise_links':['fixture_do']} for i,c in enumerate(classes)]
  w(new/'evidence'/'practical_asset_depth_contract.json',json.dumps({'schema':'skill-book.practical-asset-depth.v1','assets':depth_assets},ensure_ascii=False))
  rtc="""
          s=repl(s,old,new,'fixture-depth-contract')
          s=repl(s,"  genprom('ADEQUACY',ADEQ,['--new',str(new)],new/'evidence'/'adequacy_audit.json')\n  genprom('GEN_RESP_PRE_DRAFT'","  genprom('ADEQUACY',ADEQ,['--new',str(new)],new/'evidence'/'adequacy_audit.json')\n  depthout=new/'evidence'/'practical_asset_depth_audit.json';cpd=run_report(DEPTH,['--new',str(new)],depthout);assert cpd.returncode==0,cpd.stdout+cpd.stderr\n  genprom('GEN_RESP_PRE_DRAFT'",'fixture-depth-audit')
          marker=" def test_good_evidence_truth_passes_when_runtime_writes_authority_path(self):"
          insert=""" def test_practical_asset_depth_evidence_is_runtime_mandatory(self):
  td,old,new=self.fixture(False);(new/'evidence'/'practical_asset_depth_audit.json').unlink();cp,r=self.audit(old,new,True,False);self.assertNotEqual(cp.returncode,0);self.assertIn('PRACTICAL_ASSET_DEPTH_AUDIT_EVIDENCE_MISSING',r['blocks']);td.cleanup()
"""+marker
          s=repl(s,marker,insert,'fixture-depth-runtime-test')
          p.write_text(s,encoding='utf-8')
          print('RUNTIME_DEPTH_PATCH_APPLIED')
          PY

      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Run depth and runtime integration tests
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_practical_asset_depth_audit.py tests/test_runtime_authority_fidelity_audit.py tests/test_runtime_acceptance_audit.py | tee /tmp/runtime-depth.txt
          grep -Eq '36 passed' /tmp/runtime-depth.txt
          echo RUNTIME_DEPTH_INTEGRATION_36_PASS

      - name: Commit and push exact WIP runtime integration
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          LIVE="$(git ls-remote origin "refs/heads/$GOV_WIP_BRANCH" | awk '{print $1}')"
          test "$LIVE" = "$GOV_WIP_BASE"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add skills/skill-book/V5.6/scripts/runtime_acceptance_audit.py skills/skill-book/V5.6/tests/test_runtime_acceptance_audit.py
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'skills/skill-book/V5.6/scripts/runtime_acceptance_audit.py'
          test "${changed[1]}" = 'skills/skill-book/V5.6/tests/test_runtime_acceptance_audit.py'
          git commit -m 'skill-book: integrate V5.6 depth into runtime acceptance'
          NEW_WIP_COMMIT="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git"
          git push --quiet origin "HEAD:refs/heads/$GOV_WIP_BRANCH"
          echo "NEW_WIP_COMMIT=$NEW_WIP_COMMIT"
