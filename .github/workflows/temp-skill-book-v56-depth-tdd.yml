name: TEMP skill-book V5.6 practical asset depth TDD gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  WIP_COMMIT: 444088d91fbd12a2c17e6d0c158b0888be28bdab

jobs:
  targeted-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP implementation commit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet --detach "$WIP_COMMIT"
          test "$(git -C gov rev-parse HEAD)" = "$WIP_COMMIT"
          test -f gov/skills/skill-book/V5.6/tests/test_practical_asset_depth_audit.py
          test -f gov/skills/skill-book/V5.6/scripts/practical_asset_depth_audit.py
          echo GREEN_PRECONDITION_PASS
      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Run non-A1 targeted depth tests
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_practical_asset_depth_audit.py | tee /tmp/green.txt
          grep -Eq '12 passed' /tmp/green.txt
          echo TARGETED_DEPTH_12_PASS
      - name: Preserve inherited adequacy behavior
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_adequacy_audit.py | tee /tmp/adequacy.txt
          grep -Eq '6 passed' /tmp/adequacy.txt
          echo INHERITED_ADEQUACY_6_PASS
