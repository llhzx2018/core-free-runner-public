name: TEMP skill-book V5.6 guarded WIP identity reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_WIP_BRANCH: work/skill-book-v56-practical-asset-depth
  GOV_WIP_BASE: 472c8f73a318c093ae5d14ad7a06f241828711dc
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829
  NEW_RID: SB56-RUNTIME-CONTRACT-CBE00206

jobs:
  reconcile-wip-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact WIP and guarded helper
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_WIP_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_WIP_BASE"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/reconcile_wip_identity.py
          echo WIP_IDENTITY_BASE_PASS

      - name: Reconcile V5.6 WIP identity and package metadata
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/runner/temp/skill-book-v56/reconcile_wip_identity.py"

      - name: Verify active identity and checksum integrity
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '5.6'
          grep -q '# skill-book V5.6 Design Gate WIP' SKILL.md
          grep -q 'DESIGN_GATE / WIP / NOT CANDIDATE / NOT CURRENT' SKILL.md
          grep -q "$NEW_RID" SKILL.md references/runtime_entry_receipt_contract.md references/runtime_authority_fidelity_contract.md scripts/runtime_acceptance_audit.py scripts/runtime_authority_fidelity_audit.py
          grep -q 'evidence/practical_asset_depth_contract.json' SKILL.md references/runtime_entry_receipt_contract.md
          grep -q 'evidence/practical_asset_depth_audit.json' SKILL.md references/runtime_entry_receipt_contract.md
          ! grep -RIn --exclude-dir=validation --exclude=SHA256SUMS.txt 'SB55-RUNTIME-CONTRACT-6B3D9F21' SKILL.md SOURCE_PACKAGE_IDENTITY.md VERSION agents references scripts tests MANIFEST.json
          ! grep -RInE --exclude-dir=validation --exclude=SHA256SUMS.txt 'version: 5\.5|declared_skill_version.{0,10}5\.5|EXPECTED_SKILL_VERSION.{0,10}5\.5' SKILL.md SOURCE_PACKAGE_IDENTITY.md VERSION agents references scripts tests MANIFEST.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.')
          m=json.loads((root/'MANIFEST.json').read_text())
          assert m['artifact_id']=='SKILL-BOOK-V5.6-DESIGN-GATE-WIP'
          assert m['version']=='5.6'
          assert m['status']=='DESIGN_GATE_WIP_NOT_CANDIDATE_NOT_CURRENT'
          assert m['runtime_contract_id']=='SB56-RUNTIME-CONTRACT-CBE00206'
          assert m['candidate_authorization']=='NOT_AUTHORIZED'
          assert m['current_promotion']=='NOT_AUTHORIZED'
          lines=[x for x in (root/'SHA256SUMS.txt').read_text().splitlines() if x.strip()]
          seen=set()
          for line in lines:
              h,rel=line.split('  ',1)
              assert rel not in seen;seen.add(rel)
              p=root/rel;assert p.is_file(),rel
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h,rel
          actual=[p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='SHA256SUMS.txt']
          assert sorted(seen)==sorted(actual),(len(seen),len(actual))
          print(f'WIP_PACKAGE_INTEGRITY_PASS sha_entries={len(lines)} total_files={len(actual)+1}')
          PY
          echo V56_ACTIVE_IDENTITY_PASS

      - name: Install pinned pytest
        run: python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile and run complete V5.6 suite
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          mapfile -t pyfiles < <(find scripts tests -type f -name '*.py' | sort)
          python -m py_compile "${pyfiles[@]}"
          echo "PYTHON_COMPILE_PASS=${#pyfiles[@]}"
          python -m pytest -q | tee /tmp/v56-identity.txt
          grep -Eq '122 passed' /tmp/v56-identity.txt
          ! grep -Eq '[0-9]+ failed|[0-9]+ error' /tmp/v56-identity.txt
          echo V56_IDENTITY_FULL_REGRESSION_122_PASS

      - name: Verify exact delta and push WIP identity commit
        shell: bash
        working-directory: gov
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'skills/skill-book/V5.6/MANIFEST.json'
            'skills/skill-book/V5.6/SHA256SUMS.txt'
            'skills/skill-book/V5.6/SKILL.md'
            'skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md'
            'skills/skill-book/V5.6/VERSION'
            'skills/skill-book/V5.6/agents/openai.yaml'
            'skills/skill-book/V5.6/references/runtime_authority_fidelity_contract.md'
            'skills/skill-book/V5.6/references/runtime_enforcement_contract.md'
            'skills/skill-book/V5.6/references/runtime_entry_receipt_contract.md'
            'skills/skill-book/V5.6/scripts/runtime_acceptance_audit.py'
            'skills/skill-book/V5.6/scripts/runtime_authority_fidelity_audit.py'
            'skills/skill-book/V5.6/tests/test_runtime_acceptance_audit.py'
            'skills/skill-book/V5.6/tests/test_runtime_authority_fidelity_audit.py'
            'skills/skill-book/V5.6/tests/test_skill_contract.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          LIVE="$(git ls-remote origin "refs/heads/$GOV_WIP_BRANCH" | awk '{print $1}')"
          test "$LIVE" = "$GOV_WIP_BASE"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add "${changed[@]}"
          git commit -m 'skill-book: reconcile V5.6 design-gate WIP identity'
          NEW_WIP_COMMIT="$(git rev-parse HEAD)"
          git remote set-url origin "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git"
          git push --quiet origin "HEAD:refs/heads/$GOV_WIP_BRANCH"
          echo "NEW_WIP_COMMIT=$NEW_WIP_COMMIT"
          echo V56_WIP_IDENTITY_PUSH_PASS
