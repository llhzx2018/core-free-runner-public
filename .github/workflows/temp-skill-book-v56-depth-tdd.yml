name: TEMP skill-book V5.6 design-gate reseal closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_BRANCH: work/skill-book-v56-practical-asset-depth
  EXPECTED_WIP: b18eb8d1240081914c378a902f4c99403956ed80
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829

jobs:
  design-gate-reseal-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact WIP and reconcile closed design-gate truth
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_WIP"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/close_v56_design_gate_reseal.py
          python runner/temp/skill-book-v56/close_v56_design_gate_reseal.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          grep -q 'DESIGN_GATE_FUNCTIONALLY_CLOSED_RESEALED_NOT_CANDIDATE' gov/skills/skill-book/V5.6/MANIFEST.json
          grep -q '33258401492 / 99116008440' gov/skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md
          grep -q 'FUNCTIONALLY CLOSED / COMMITTED-STATE RESEALED' gov/mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md
          grep -q 'Candidate Authorization: `NOT_AUTHORIZED`' gov/skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md

      - name: Verify closed package SHA and full regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('gov/skills/skill-book/V5.6')
          rows=(root/'SHA256SUMS.txt').read_text().splitlines(); seen=set()
          for row in rows:
              digest,rel=row.split('  ',1); assert rel not in seen; seen.add(rel)
              p=root/rel; assert p.is_file(),rel; assert hashlib.sha256(p.read_bytes()).hexdigest()==digest,rel
          actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and p.name!='SHA256SUMS.txt' and '__pycache__' not in p.parts and p.suffix!='.pyc'}
          assert seen==actual,(len(seen),len(actual),sorted(actual-seen),sorted(seen-actual))
          m=json.loads((root/'MANIFEST.json').read_text())
          h=hashlib.sha256()
          for item in m['files']:
              p=root/item['path']; data=p.read_bytes(); digest=hashlib.sha256(data).hexdigest()
              assert digest==item['sha256']; assert len(data)==item['bytes']
              h.update(f"{digest}  {item['path']}\n".encode())
          assert h.hexdigest()==m['validation']['source_non_manifest_tree_sha256']
          assert m['candidate_authorization']=='NOT_AUTHORIZED'
          assert m['current_promotion']=='NOT_AUTHORIZED'
          assert m['real_reader_evidence']=='NOT_RUN'
          print(f'SHA256SUMS_PASS={len(rows)}')
          print('TREE_MANIFEST_PASS='+h.hexdigest())
          PY
          test "$(find gov/skills/skill-book/V5.6 -name '*.py' -type f | wc -l)" -eq 39
          find gov/skills/skill-book/V5.6 -name '*.py' -type f -print0 | xargs -0 python -m py_compile
          python -m pip install --quiet pytest
          python -m pytest -q gov/skills/skill-book/V5.6/tests | tee /tmp/v56-full.txt
          grep -Eq '122 passed' /tmp/v56-full.txt
          echo 'V56_DESIGN_GATE_CLOSED_FULL_REGRESSION=122/122_PASS'

      - name: Guarded exact four-file WIP writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin "refs/heads/${GOV_BRANCH}" | awk '{print $1}')"
          test "$live" = "$EXPECTED_WIP"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt | sort)"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_DESIGN_GATE.md \
            skills/skill-book/V5.6/SOURCE_PACKAGE_IDENTITY.md \
            skills/skill-book/V5.6/MANIFEST.json \
            skills/skill-book/V5.6/SHA256SUMS.txt
          git -C gov diff --cached --quiet && exit 1 || true
          git -C gov commit -m 'skill-book: close V5.6 design-gate reseal truth'
          git -C gov push origin "HEAD:refs/heads/${GOV_BRANCH}"
          echo "V56_DESIGN_GATE_CLOSED_WIP=$(git -C gov rev-parse HEAD)"
