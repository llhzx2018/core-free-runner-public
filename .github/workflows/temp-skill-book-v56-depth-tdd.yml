name: TEMP skill-book V5.6 governance reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  EXPECTED_MAIN: b32fda1c75fdbc4d2e40aaaa444ba7b31e06bd28
  CANDIDATE_SOURCE: b32fda1c75fdbc4d2e40aaaa444ba7b31e06bd28
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: test/skill-book-v56-depth-gate-20260829
  CURRENT_DIST_BLOB: 4742ae001ee50d7f3e9b1c09aa2515f70cf77f5b
  CURRENT_INDEX_BLOB: 8f12ac70db9bb36903fe2307a40f548d33d301d1

jobs:
  governance-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact published Candidate main
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet main
          test "$(git -C gov rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          test "$(git -C gov rev-parse HEAD:skills/skill-book/V5.6/MANIFEST.json)" = "$(git -C gov rev-parse ${CANDIDATE_SOURCE}:skills/skill-book/V5.6/MANIFEST.json)"
          git clone --quiet --branch "$RUNNER_BRANCH" --single-branch "https://github.com/${RUNNER_REPO}.git" runner
          test -f runner/temp/skill-book-v56/reconcile_v56_governance.py

      - name: Prepare exact four-file governance delta
        shell: bash
        run: |
          set -euo pipefail
          python runner/temp/skill-book-v56/reconcile_v56_governance.py gov
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            CURRENT.md \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_CANDIDATE_OVERLAY.md \
            distribution/skills/candidates/skill-book/V5.6/README.md \
            distribution/skills/candidates/skill-book/V5.6/RUNTIME_ZIP_MIRROR_STATUS.md | sort)"
          git -C gov diff --quiet -- skills/skill-book/V5.6
          test "$(git -C gov hash-object distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git -C gov hash-object distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          grep -q '`V5.6` 为最新 Candidate' gov/CURRENT.md
          grep -q 'PUBLISHED_REMOTE_VERIFIED' gov/mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_CANDIDATE_OVERLAY.md
          grep -q 'Current Distribution：`UNCHANGED`' gov/distribution/skills/candidates/skill-book/V5.6/README.md
          grep -q 'GOVERNANCE_RECONCILED_PENDING_RUNNER_CLOSE' gov/distribution/skills/candidates/skill-book/V5.6/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -q '#397：`OPEN / DO NOT MERGE / CLOSE PENDING`' gov/distribution/skills/candidates/skill-book/V5.6/RUNTIME_ZIP_MIRROR_STATUS.md
          echo 'V56_GOVERNANCE_DELTA_GUARD=PASS'

      - name: Guarded main governance writeback
        shell: bash
        run: |
          set -euo pipefail
          live="$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live" = "$EXPECTED_MAIN"
          test "$(git -C gov diff --name-only | sort)" = "$(printf '%s\n' \
            CURRENT.md \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_CANDIDATE_OVERLAY.md \
            distribution/skills/candidates/skill-book/V5.6/README.md \
            distribution/skills/candidates/skill-book/V5.6/RUNTIME_ZIP_MIRROR_STATUS.md | sort)"
          git -C gov diff --quiet -- skills/skill-book/V5.6
          test "$(git -C gov hash-object distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git -C gov hash-object distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          git -C gov config user.name VictorForge
          git -C gov config user.email llhzx2018@gmail.com
          git -C gov add \
            CURRENT.md \
            mother-specs/skill-book/V5.6/SKILL_BOOK_V5.6_CANDIDATE_OVERLAY.md \
            distribution/skills/candidates/skill-book/V5.6/README.md \
            distribution/skills/candidates/skill-book/V5.6/RUNTIME_ZIP_MIRROR_STATUS.md
          git -C gov diff --cached --quiet && exit 1 || true
          git -C gov commit -m 'skill-book: reconcile V5.6 published candidate governance'
          git -C gov push origin HEAD:refs/heads/main
          new="$(git -C gov rev-parse HEAD)"
          test "$(git -C gov ls-remote origin refs/heads/main | awk '{print $1}')" = "$new"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DISTRIBUTION.json)" = "$CURRENT_DIST_BLOB"
          test "$(git -C gov rev-parse HEAD:distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md)" = "$CURRENT_INDEX_BLOB"
          echo "V56_GOVERNANCE_RECONCILIATION_COMMIT=$new"
