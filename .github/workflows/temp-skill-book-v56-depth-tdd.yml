name: TEMP skill-book V5.6 active identity inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOV_REPO: llhzx2018/gov-doc
  GOV_WIP_BRANCH: work/skill-book-v56-practical-asset-depth
  GOV_WIP_HEAD: 472c8f73a318c093ae5d14ad7a06f241828711dc

jobs:
  identity-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Clone exact V5.6 WIP head
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          git clone --quiet "https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/${GOV_REPO}.git" gov
          git -C gov checkout --quiet "$GOV_WIP_BRANCH"
          test "$(git -C gov rev-parse HEAD)" = "$GOV_WIP_HEAD"
          echo "EXACT_WIP_HEAD_PASS=$GOV_WIP_HEAD"

      - name: Inventory active seed identity references
        shell: bash
        working-directory: gov/skills/skill-book/V5.6
        run: |
          set -euo pipefail
          echo '=== ACTIVE SB55 RUNTIME CONTRACT REFERENCES ==='
          grep -RIn --exclude-dir=validation --exclude=MANIFEST.json --exclude=SHA256SUMS.txt 'SB55-RUNTIME-CONTRACT-6B3D9F21' SKILL.md SOURCE_PACKAGE_IDENTITY.md VERSION agents references scripts tests || true
          echo '=== ACTIVE V5.5 / 5.5 IDENTITY REFERENCES ==='
          grep -RInE --exclude-dir=validation --exclude=MANIFEST.json --exclude=SHA256SUMS.txt 'V5\.5 Candidate|version: 5\.5|declared_skill_version.{0,10}5\.5|EXPECTED_SKILL_VERSION.{0,10}5\.5|\b5\.5\b' SKILL.md SOURCE_PACKAGE_IDENTITY.md VERSION agents references scripts tests || true
          echo '=== PACKAGE STATUS REFERENCES ==='
          grep -RInE --exclude-dir=validation 'CANDIDATE_NOT_CURRENT|candidate_not_current|CANDIDATE / NOT CURRENT' SKILL.md SOURCE_PACKAGE_IDENTITY.md VERSION agents references scripts tests MANIFEST.json || true
          echo ACTIVE_IDENTITY_INVENTORY_COMPLETE
