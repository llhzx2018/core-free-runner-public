name: P08 v013 candidate real FULL and UPDATE reproducible package proof
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-candidate-package.yml]
permissions:
  contents: read
jobs:
  real-packages:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.ref == 'proof/p08-v013-candidate-source-20261119' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P08 v013 candidate ephemeral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f0865a5ecfb399ea1297c157d605f17240ff9ab2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout exact GOV-DOC Mode U candidate ephemeral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a6e476ccc54fec29cf5264177cf65675b282d4da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          tools: composer:v2
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Two independent real FULLs and Atomic archives, no publication
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          # Disable untracked Python bytecode generated by the Atomic builder
          # imports. Canonical Git cleanliness remains strictly mandatory.
          export PYTHONDONTWRITEBYTECODE=1
          test "$(git -C p08 rev-parse HEAD)" = f0865a5ecfb399ea1297c157d605f17240ff9ab2
          test "$(git -C gov rev-parse HEAD)" = a6e476ccc54fec29cf5264177cf65675b282d4da
          test "$(cat p08/VERSION)" = '0.1.13'
          cd p08
          npm ci --no-fund --no-audit
          npm run build
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          python3 scripts/check_stack_contract.py --phase full
          # Post-install Composer/Laravel discovery may generate PHP bootstrap
          # caches. Never hide unreviewed source edits from the canonical
          # clean Git checkout requirement: accept only known disposable
          # generated caches and fail on any other untracked/modified input.
          git diff --exit-code
          git diff --cached --exit-code
          mapfile -t generated < <(git ls-files --others --exclude-standard)
          for f in "${generated[@]}"; do
            case "$f" in
              bootstrap/cache/packages.php|bootstrap/cache/services.php)
                test -f "$f" && ! test -L "$f"
                rm -- "$f"
                ;;
              *)
                printf 'P08_PACKAGING_UNEXPECTED_UNTRACKED=%s\n' "$f"
                exit 28
                ;;
            esac
          done
          test -z "$(git status --porcelain --untracked-files=all)"
          echo P08_CANONICAL_SOURCE_CLEAN=PASS
          cd ..
          mkdir -p "$RUNNER_TEMP/p08packages"
          old="$RUNNER_TEMP/p08packages/previous-manifest.json"
          curl -fsSL --retry 2 --max-time 100 \
            -H "Authorization: Bearer $GH_READ_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/766931640' \
            -o "$RUNNER_TEMP/p08packages/original-v012.zip"
          test "$(sha256sum "$RUNNER_TEMP/p08packages/original-v012.zip" | cut -d' ' -f1)" = 721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6
          unzip -p "$RUNNER_TEMP/p08packages/original-v012.zip" FULL_MANIFEST.json > "$old"
          test "$(sha256sum "$old" | cut -d' ' -f1)" = 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc
          cd p08
          for n in 1 2; do
            python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08packages/FULL-$n.zip" --version 0.1.13 --source-sha f0865a5ecfb399ea1297c157d605f17240ff9ab2 --governance-root "$GITHUB_WORKSPACE/gov"
            python3 scripts/build_atomic.py --source "$PWD" --output "$RUNNER_TEMP/p08packages/UPDATE-$n.zip" --source-version 0.1.12 --source-sha dac7bc1d5410c077f32e522eb5740537f618ef9d --source-full-manifest-sha256 4df28b7a9dcfbaf4c0bec18009955fe1b0c7764ccfe94f4257ae2ca0dc3794cc --previous-full-manifest "$old" --target-version 0.1.13 --target-sha f0865a5ecfb399ea1297c157d605f17240ff9ab2
            if test -n "$(git status --porcelain --untracked-files=all)"; then
              echo 'P08_V013_POST_ATOMIC_CHECKOUT=DIRTY_BLOCKED'
              git status --porcelain --untracked-files=all
              exit 32
            fi
            echo "P08_V013_POST_ATOMIC_CHECKOUT=CLEAN_PASS_RUN_$n"

          done
          cmp "$RUNNER_TEMP/p08packages/FULL-1.zip" "$RUNNER_TEMP/p08packages/FULL-2.zip"
          cmp "$RUNNER_TEMP/p08packages/UPDATE-1.zip" "$RUNNER_TEMP/p08packages/UPDATE-2.zip"
          unzip -t "$RUNNER_TEMP/p08packages/FULL-1.zip" > /dev/null
          unzip -t "$RUNNER_TEMP/p08packages/UPDATE-1.zip" > /dev/null
          echo P08_V013_CANDIDATE_DOUBLE_FULL_SHA256="$(sha256sum "$RUNNER_TEMP/p08packages/FULL-1.zip" | cut -d' ' -f1)"
          echo P08_V013_CANDIDATE_DOUBLE_UPDATE_SHA256="$(sha256sum "$RUNNER_TEMP/p08packages/UPDATE-1.zip" | cut -d' ' -f1)"
          echo P08_V013_CANDIDATE_PACKAGE_DETERMINISM=PASS_NOT_RELEASED
      - name: Delete package and private checkouts even on error
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08packages"
          test ! -e p08 && test ! -e gov && test ! -e "$RUNNER_TEMP/p08packages"
          echo P08_CANDIDATE_PACKAGE_PRIVATE_CLEANUP=PASS
