name: P01 V2.35.0 Unified Candidate Readiness

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-unified-candidate-readiness-20260831.yml]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CANDIDATE: fb97dcff0eac000a337c5cd749ab32c0f280a9c9
      CANDIDATE_TREE: 7b3270ef56d127d3735e6a93b51a0b2ccdc1152d
      RUNTIME_TREE: 24953b64762b2d17076e4149a2aa49a492316477
      PRODUCT: cc2ee6e819e911021e7fb6e18b1f33e8a00443e0
      PRODUCT_TREE: fd722846bd280459466ab1650afc5f4958f6e934
      SOURCE: 518d10f446ea85445d1110a3defafc5bcbece473
      SOURCE_TREE: 90ffab51a20640a4e3f6f07122a8e6e147592f64
      SOURCE_RUNTIME_TREE: f3eeb66fbce3949ef50483ac4c5a821edbd15d35
      SCHEMA: '2026082901'
      VERSION: 2.35.0
      SOURCE_VERSION: 2.34.0
      ART: /tmp/p01-v2350-candidate-evidence
      OUT: /tmp/p01-v2350-candidate-artifacts
      UP: /tmp/p01-v2350-upgrade-runtime
      FRESH: /tmp/p01-v2350-fresh-runtime
      PORT: '18375'
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: runner

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact V2.35 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: fb97dcff0eac000a337c5cd749ab32c0f280a9c9
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate

      - name: Checkout immutable V2.34 production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.34.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven

      - name: Exact source and syntax fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ART" "$OUT" "$UP" "$FRESH"; mkdir -p "$ART"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C candidate rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C production rev-parse HEAD:src)" = "$SOURCE_RUNTIME_TREE"
          test "$(cat candidate/VERSION)" = "$VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.0');" candidate/src/app/bootstrap.php >/dev/null
          test "$(cat production/VERSION)" = "$SOURCE_VERSION"
          test "$(cat production/src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fx "define('VF_VERSION', '2.34.0');" production/src/app/bootstrap.php >/dev/null
          if git -C candidate diff --name-only "$SOURCE"..."$CANDIDATE" -- src/migrations/ | grep .; then echo UNEXPECTED_MIGRATION; exit 1; fi
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find candidate/src -type f -name '*.php' -print0)
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find candidate/src -type f -name '*.js' -print0)
          python3 - <<'PY'
          import json
          d=json.load(open('candidate/VF_PROJECT.json',encoding='utf-8'))
          assert d['project_id']=='P01'
          assert d['production_version']=='2.34.0'
          assert d['working_version']=='2.35.0'
          assert d['target_release_version']=='2.35.0'
          assert str(d['working_schema_version'])=='2026082901'
          assert d['v2_35_tag_state']=='NOT_CREATED'
          assert d['core_updates_v2_35_state']=='NOT_PUBLISHED'
          assert d['current_change']['product_develop_source']=='cc2ee6e819e911021e7fb6e18b1f33e8a00443e0'
          assert d['current_change']['final_visual_sweep']['run']==33330543623
          print('P01_V2350_AUTHORITY=PASS')
          PY
          printf '%s\n' P01_V2350_EXACT_SOURCE=PASS P01_V2350_VERSION_TRIPLE=PASS P01_V2350_SCHEMA_UNCHANGED=PASS P01_V2350_NO_MIGRATION=PASS | tee "$ART/source-fence.txt"

      - name: Build deterministic unpublished candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-v2350-build.py <<'PY'
          from pathlib import Path
          import hashlib,importlib.util,json,os
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); VERSION='2.35.0'; SOURCE_VERSION='2.34.0'; SCHEMA='2026082901'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          base=load('base',ROOT/'proven/scripts/p01-build-release.py'); v2=load('v2',ROOT/'proven/scripts/p01-build-release-v2.py')
          sha=lambda b:hashlib.sha256(b).hexdigest(); gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files): return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}
          td=base.collect(ROOT/'candidate/src'); sd=base.collect(ROOT/'production/src')
          assert td['VERSION.txt'].strip()==VERSION.encode(); assert sd['VERSION.txt'].strip()==SOURCE_VERSION.encode()
          target=runtime(td); source=runtime(sd)
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k])); added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          if removed: raise SystemExit('unexpected removed runtime files '+json.dumps(removed))
          if not changed: raise SystemExit('empty runtime delta')
          manifest={'project':'VF Start','project_id':'P01','component_id':'APP','version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,'source_schema_version':SCHEMA,'release_type':'candidate','stage':'CANDIDATE_READINESS_GATE','deployable':False,'release_authorized':False,'candidate_source_commit':os.environ['CANDIDATE'],'candidate_source_tree':os.environ['CANDIDATE_TREE'],'product_source_commit':os.environ['PRODUCT'],'product_source_tree':os.environ['PRODUCT_TREE'],'runtime_source_tree':os.environ['RUNTIME_TREE'],'production_source_commit':os.environ['SOURCE'],'production_source_tree':os.environ['SOURCE_TREE'],'production_runtime_tree':os.environ['SOURCE_RUNTIME_TREE'],'schema_change':False,'schema_migrations':[],'runtime_data_included':False,'runtime_files':{k:sha(v) for k,v in sorted(target.items())},'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_schema':SCHEMA,'target_schema':SCHEMA,'added_files':added,'removed_files':removed,'runtime_delta':changed},'update':{'asset_name':'VF_Start_V2.35.0_UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True},'ux_v235':{'five_domain_consistency':True,'drawer_hierarchy':True,'sidebar_productization':True,'feedback_semantics':True,'private_protected_state':True,'mobile_command_row':True,'desktop_bulkbar':True,'dark_watch_states':True,'topics_dark_tokens':True,'final_visual_sweep_run':33330543623}}
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode(); full=dict(td); full['release-manifest.json']=mb; atomic=dict(target); atomic['release-manifest.json']=mb
          repair=v2.build_repair(source,atomic,sha(target['app/UpdateManager.php']))
          old="public const SOURCE_VERSION='2.21.14';\n    public const TARGET_VERSION='2.21.15';\n    public const TARGET_SCHEMA='2026080902';"
          new="public const SOURCE_VERSION='2.34.0';\n    public const TARGET_VERSION='2.35.0';\n    public const TARGET_SCHEMA='2026082901';"
          if repair.count(old)!=1: raise SystemExit('repair constant anchor mismatch')
          repair=repair.replace(old,new,1)
          out=Path(os.environ['OUT']); out.mkdir(parents=True,exist_ok=True); rp=out/'repair-v2.35.0.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/'VF-Start-V2.35.0-FULL.zip',full); base.deterministic_zip(out/'VF_Start_V2.35.0_UPDATE.zip',{rp.name:rp.read_bytes()})
          result={'status':'CANDIDATE_ARTIFACT_BUILD_PASS','candidate_source':os.environ['CANDIDATE'],'candidate_tree':os.environ['CANDIDATE_TREE'],'source_commit':os.environ['SOURCE'],'version':VERSION,'source_version':SOURCE_VERSION,'schema':SCHEMA,'runtime_delta_count':len(changed),'runtime_delta':changed,'runtime_added':added,'runtime_removed':removed,'owner_production_write':False,'release_published':False}
          (out/'P01-V2.35.0-CANDIDATE-GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          arts=[p for p in sorted(out.iterdir()) if p.is_file()]; (out/'SHA256SUMS.txt').write_text(''.join(f'{base.sha256_file(p)}  {p.name}\n' for p in arts),encoding='utf-8'); print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-v2350-build.py | tee "$ART/build-1.json"
          REPAIR="$OUT/repair-v2.35.0.php"; FULL="$OUT/VF-Start-V2.35.0-FULL.zip"; UPDATE="$OUT/VF_Start_V2.35.0_UPDATE.zip"
          php -l "$REPAIR" >/dev/null
          php "$REPAIR" --self-test | tee "$ART/repair-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$ART/artifacts-sha-1.txt"
          cp -a "$OUT" /tmp/p01-v2350-first; rm -rf "$OUT"
          python3 /tmp/p01-v2350-build.py | tee "$ART/build-2.json"
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$ART/artifacts-sha-2.txt"
          diff -u "$ART/artifacts-sha-1.txt" "$ART/artifacts-sha-2.txt"
          unzip -Z1 "$UPDATE" | grep -Fx repair-v2.35.0.php >/dev/null
          echo P01_V2350_DETERMINISTIC_ARTIFACTS=PASS | tee "$ART/artifact-verdict.txt"

      - name: Actual V2.34 to V2.35 upgrade and fresh install
        shell: bash
        run: |
          set -Eeuo pipefail
          REPAIR="$OUT/repair-v2.35.0.php"
          setup_root(){ local root="$1" src="$2" port="$3" label="$4"; rm -rf "$root"; cp -a "$src" "$root"; php -S 127.0.0.1:$port -t "$root" >"$ART/$label-server.log" 2>&1 & local pid=$!; for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$port/setup.php" -o "$ART/$label-setup.html" && break; sleep .25; done; local csrf=$(python3 - "$ART/$label-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          ); curl -fsS -c "$ART/$label.cookies" -b "$ART/$label.cookies" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=V235 Gate" --data-urlencode 'admin_password=V235Gate!2026' --data-urlencode 'admin_password_confirm=V235Gate!2026' -o "$ART/$label-setup-post.html"; kill "$pid" || true; }
          setup_root "$UP" production/src 18373 source
          ROOT="$UP" php <<'PHP' | tee "$ART/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php'; require_once getenv('ROOT').'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'发布验证','description'=>'','is_private'=>false]);
          $domains=['start','channels','watch','topics'];
          for($i=1;$i<=40;$i++){ $x=$r->saveLink(null,['category_id'=>$c,'title'=>'Gate '.$i,'url'=>'https://example.com/v235-'.$i,'description'=>'V235 preserve','tags'=>'release','is_private'=>$i%3===0],'manual'); $d=$domains[($i-1)%4]; if($d!=='start')$s->upsertProfile((int)$x['id'],['surface'=>$d,'resource_kind'=>$d==='channels'?'creator':($d==='watch'?'movie':'guide')]); if($i<=6)$s->recordOpen((int)$x['id']); }
          echo "P01_V2350_SEED_40=PASS\n";
          PHP
          grep -Fx P01_V2350_SEED_40=PASS "$ART/seed.txt"
          php "$REPAIR" --verify-source="$UP" | tee "$ART/verify-source.json" | jq -e '.ok==true' >/dev/null
          php "$REPAIR" --run="$UP" | tee "$ART/upgrade-run.json" | jq -e '.ok==true and .already_current==false and .schema=="2026082901"' >/dev/null
          test "$(cat "$UP/VERSION.txt")" = '2.35.0'; grep -Fx "define('VF_VERSION', '2.35.0');" "$UP/app/bootstrap.php" >/dev/null
          ROOT="$UP" php <<'PHP' | tee "$ART/upgrade-data.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn()!==40)exit(1);
          if((int)$db->query("SELECT COUNT(*) FROM resource_domain_profiles")->fetchColumn()<30)exit(2);
          if((string)$db->query("SELECT MAX(version) FROM schema_migrations WHERE status='success'")->fetchColumn()!=='2026082901')exit(3);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(4);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(5);
          echo "P01_V2350_DATA_PRESERVATION=PASS\n";
          PHP
          grep -Fx P01_V2350_DATA_PRESERVATION=PASS "$ART/upgrade-data.txt"
          php "$REPAIR" --run="$UP" | tee "$ART/upgrade-idempotent.json" | jq -e '.ok==true and .already_current==true' >/dev/null
          php "$REPAIR" --verify-target="$UP" | tee "$ART/verify-target.json" | jq -e '.ok==true' >/dev/null
          php "$UP/cli/verify.php" | tee "$ART/upgraded-verify.txt" | grep -Fx VERIFY_PASS=YES >/dev/null
          php "$UP/cli/surface-verify.php" | tee "$ART/upgraded-surface.txt" | grep -E 'MULTI_SURFACE_PASS=YES|CURRENT_DOMAIN_PASS=YES' >/dev/null
          php "$UP/cli/baseline-verify.php" | tee "$ART/upgraded-baseline.txt"
          grep -Fx BASELINE_CORE_PASS=YES "$ART/upgraded-baseline.txt"; grep -Fx DRIFT_COUNT=0 "$ART/upgraded-baseline.txt"; grep -Fx UNKNOWN_COUNT=0 "$ART/upgraded-baseline.txt"
          setup_root "$FRESH" candidate/src 18374 fresh
          php "$FRESH/cli/verify.php" | tee "$ART/fresh-verify.txt" | grep -Fx VERIFY_PASS=YES >/dev/null
          php "$FRESH/cli/surface-verify.php" | tee "$ART/fresh-surface.txt" | grep -E 'MULTI_SURFACE_PASS=YES|CURRENT_DOMAIN_PASS=YES' >/dev/null
          ROOT="$FRESH" php -r 'require getenv("ROOT")."/app/bootstrap.php";$db=vf_db();if((string)$db->query("SELECT MAX(version) FROM schema_migrations WHERE status=\"success\"")->fetchColumn()!=="2026082901")exit(1);if(strtolower((string)$db->query("PRAGMA integrity_check")->fetchColumn())!=="ok")exit(2);if($db->query("PRAGMA foreign_key_check")->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_V2350_FRESH_DB=PASS\n";' | tee "$ART/fresh-db.txt"
          echo P01_V2340_TO_V2350_ACTUAL_UPGRADE=PASS | tee "$ART/upgrade-verdict.txt"

      - name: Five-domain browser smoke on upgraded runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$UP" >"$ART/browser-server.log" 2>&1 & echo $! >/tmp/p01-v2350-browser.pid
          for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$PORT/index.php" -o /dev/null && break; sleep .25; done
          mkdir -p /tmp/p01-v2350-ui; cd /tmp/p01-v2350-ui; npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 --no-save >/dev/null 2>&1; npx playwright install chromium --with-deps >/dev/null 2>&1
          cat > smoke.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:1000}});let r=await c.request.post('http://127.0.0.1:18375/api.php?action=login',{data:{password:'V235Gate!2026'}});if(!r.ok()||!(await r.json()).ok)throw Error('login');const p=await c.newPage(), pages=['home.php','start.php','channels.php','watch.php','topics.php'];const out={};for(const f of pages){for(const theme of ['light','dark']){await p.goto('http://127.0.0.1:18375/'+f,{waitUntil:'networkidle'});await p.evaluate(t=>{document.documentElement.dataset.theme=t;localStorage.setItem('vf_theme',t)},theme);await p.reload({waitUntil:'networkidle'});const m=await p.evaluate(()=>({version:document.body.innerText.includes('V2.35.0'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,h1:document.querySelector('h1')?.textContent?.trim()||''}));if(!m.version||m.overflow>1)throw Error(f+' '+theme+' '+JSON.stringify(m));out[f+'-'+theme]=m;await p.screenshot({path:process.env.ART+'/'+f.replace('.php','')+'-1440-'+theme+'.png',fullPage:false});}}
          await p.setViewportSize({width:390,height:844});for(const f of pages){await p.goto('http://127.0.0.1:18375/'+f,{waitUntil:'networkidle'});const m=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}));if(m.overflow>1)throw Error('mobile '+f);await p.screenshot({path:process.env.ART+'/'+f.replace('.php','')+'-390.png',fullPage:false});}fs.writeFileSync(process.env.ART+'/browser-metrics.json',JSON.stringify(out,null,2));await b.close();console.log('P01_V2350_BROWSER=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          ART="$ART" node smoke.cjs | tee "$ART/browser-result.txt"
          grep -Fx P01_V2350_BROWSER=PASS "$ART/browser-result.txt"

      - name: Verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$ART/verdict.txt" <<EOF
          P01_V2350_CANDIDATE_SOURCE=$CANDIDATE
          P01_V2350_CANDIDATE_TREE=$CANDIDATE_TREE
          P01_V2350_RUNTIME_TREE=$RUNTIME_TREE
          P01_V2350_PRODUCT_SOURCE=$PRODUCT
          P01_V2350_PRODUCT_TREE=$PRODUCT_TREE
          P01_V2350_PRODUCTION_SOURCE=$SOURCE
          P01_V2350_CANDIDATE_READINESS=PASS
          P01_V2350_VERSION_TRIPLE=PASS
          P01_V2350_DETERMINISTIC_ARTIFACTS=PASS
          P01_V2340_TO_V2350_ACTUAL_UPGRADE=PASS
          P01_V2350_DATA_PRESERVATION=PASS
          P01_V2350_IDEMPOTENCE=PASS
          P01_V2350_REPAIR_SELF_TEST=PASS
          P01_V2350_FRESH_RUNTIME=PASS
          P01_V2350_BROWSER=PASS
          P01_V2350_SCHEMA_UNCHANGED_2026082901=PASS
          OWNER_PRODUCTION_WRITE=NO
          RELEASE=NO
          EOF
          cat "$ART/verdict.txt"

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2350-candidate-readiness-evidence-${{ github.run_id }}
          path: /tmp/p01-v2350-candidate-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload unpublished candidate artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2350-unpublished-candidate-artifacts-${{ github.run_id }}
          path: /tmp/p01-v2350-candidate-artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-v2350-browser.pid 2>/dev/null)" 2>/dev/null || true
