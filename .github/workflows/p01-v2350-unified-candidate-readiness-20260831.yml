name: P01 V2.35.1 Unified Candidate Readiness

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-unified-candidate-readiness-20260831.yml]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: 0a0196358b2684dc1d542e78af9c6e04fe2c7c22
      CANDIDATE_TREE: db1d4c9b93184f25049a1fa6cf9262c1b872494c
      CANDIDATE_RUNTIME_TREE: 3cdfa02d8c19ae5e771b7d4abff69a670ac4396c
      SOURCE: d20f8e964455c7238b66c6ff6ab2e7d732d315e2
      SOURCE_TREE: 1d9c8a11f1e8ddb7bb775b28592459f754c2c59b
      SOURCE_RUNTIME_TREE: 24953b64762b2d17076e4149a2aa49a492316477
      VERSION: 2.35.1
      SOURCE_VERSION: 2.35.0
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2351-candidate-artifacts
      EVID: /tmp/p01-v2351-candidate-evidence
      UPGRADE: /tmp/p01-v2351-upgrade
      FRESH: /tmp/p01-v2351-fresh
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - name: Checkout exact R3 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate

      - name: Checkout immutable V2.35.0 predecessor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.35.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven

      - name: Exact source and version fence
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" "$EVID" "$UPGRADE" "$FRESH"; mkdir -p "$OUT" "$EVID"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C candidate rev-parse HEAD:src)" = "$CANDIDATE_RUNTIME_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git -C production rev-parse HEAD:src)" = "$SOURCE_RUNTIME_TREE"
          test "$(cat candidate/VERSION)" = "$VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$VERSION"
          grep -Fx "define('VF_VERSION', '2.35.1');" candidate/src/app/bootstrap.php >/dev/null
          test "$(cat production/VERSION)" = "$SOURCE_VERSION"
          test "$(cat production/src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fx "define('VF_VERSION', '2.35.0');" production/src/app/bootstrap.php >/dev/null
          php -l candidate/src/app/bootstrap.php >/dev/null
          php -l candidate/src/app/FunctionalHome.php >/dev/null
          echo P01_V2351_EXACT_SOURCE=PASS | tee "$EVID/boundary.txt"
          echo OWNER_PRODUCTION_WRITE=NO | tee -a "$EVID/boundary.txt"

      - name: Build deterministic candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v2351-build.py <<'PY'
          from pathlib import Path
          import hashlib,importlib.util,json,os
          ROOT=Path(os.environ['GITHUB_WORKSPACE']); VERSION='2.35.1'; SOURCE_VERSION='2.35.0'; SCHEMA='2026082901'
          def load(name,path):
              s=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); return m
          base=load('base',ROOT/'proven/scripts/p01-build-release.py'); v2=load('v2',ROOT/'proven/scripts/p01-build-release-v2.py')
          sha=lambda b:hashlib.sha256(b).hexdigest(); gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files): return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}
          td=base.collect(ROOT/'candidate/src'); sd=base.collect(ROOT/'production/src'); target=runtime(td); source=runtime(sd)
          assert td['VERSION.txt'].strip()==VERSION.encode(); assert sd['VERSION.txt'].strip()==SOURCE_VERSION.encode()
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k])); added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          if removed: raise SystemExit('unexpected removed runtime files '+json.dumps(removed))
          if not changed: raise SystemExit('empty runtime delta')
          manifest={'project':'VF Start','project_id':'P01','component_id':'APP','version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,'source_schema_version':SCHEMA,'release_type':'candidate','stage':'CANDIDATE_READINESS','deployable':False,'release_authorized':False,'candidate_source_commit':os.environ['CANDIDATE'],'candidate_source_tree':os.environ['CANDIDATE_TREE'],'runtime_source_tree':os.environ['CANDIDATE_RUNTIME_TREE'],'production_source_commit':os.environ['SOURCE'],'production_source_tree':os.environ['SOURCE_TREE'],'production_runtime_tree':os.environ['SOURCE_RUNTIME_TREE'],'schema_change':False,'schema_migrations':[],'runtime_data_included':False,'final_visual_sweep_gate':33338822193,'home_action_priority_gate':33338635840,'runtime_files':{k:sha(v) for k,v in sorted(target.items())},'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_schema':SCHEMA,'target_schema':SCHEMA,'added_files':added,'removed_files':removed,'runtime_delta':changed},'update':{'asset_name':'VF_Start_V2.35.1_UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True}}
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode(); full=dict(td); full['release-manifest.json']=mb; atomic=dict(target); atomic['release-manifest.json']=mb
          repair=v2.build_repair(source,atomic,sha(target['app/UpdateManager.php']))
          old="public const SOURCE_VERSION='2.21.14';\n    public const TARGET_VERSION='2.21.15';\n    public const TARGET_SCHEMA='2026080902';"
          new="public const SOURCE_VERSION='2.35.0';\n    public const TARGET_VERSION='2.35.1';\n    public const TARGET_SCHEMA='2026082901';"
          if repair.count(old)!=1: raise SystemExit('repair constant anchor mismatch')
          repair=repair.replace(old,new,1)
          out=Path(os.environ['OUT']); rp=out/'repair-v2.35.1.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/'VF-Start-V2.35.1-FULL.zip',full); base.deterministic_zip(out/'VF_Start_V2.35.1_UPDATE.zip',{rp.name:rp.read_bytes()})
          result={'status':'CANDIDATE_ARTIFACT_BUILD_PASS','candidate':os.environ['CANDIDATE'],'candidate_tree':os.environ['CANDIDATE_TREE'],'runtime_tree':os.environ['CANDIDATE_RUNTIME_TREE'],'source':os.environ['SOURCE'],'version':VERSION,'source_version':SOURCE_VERSION,'schema':SCHEMA,'runtime_delta_count':len(changed),'runtime_delta':changed,'release_published':False,'owner_production_write':False}
          (out/'P01-V2.35.1-CANDIDATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-v2351-build.py | tee "$EVID/build-1.json"
          REPAIR="$OUT/repair-v2.35.1.php"; FULL="$OUT/VF-Start-V2.35.1-FULL.zip"; UPDATE="$OUT/VF_Start_V2.35.1_UPDATE.zip"
          php -l "$REPAIR" >/dev/null
          php "$REPAIR" --self-test | tee "$EVID/repair-self-test.json" | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$EVID/artifacts-sha-1.txt"
          cp -a "$OUT" /tmp/p01-v2351-first; rm -rf "$OUT"; mkdir -p "$OUT"
          python3 /tmp/p01-v2351-build.py | tee "$EVID/build-2.json"
          sha256sum "$FULL" "$UPDATE" "$REPAIR" > "$EVID/artifacts-sha-2.txt"
          diff -u "$EVID/artifacts-sha-1.txt" "$EVID/artifacts-sha-2.txt"
          unzip -Z1 "$UPDATE" | grep -Fx repair-v2.35.1.php >/dev/null
          echo P01_V2351_CANDIDATE_DETERMINISTIC=PASS | tee "$EVID/artifact-verdict.txt"

      - name: Actual V2.35.0 to V2.35.1 Atomic upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          REPAIR="$OUT/repair-v2.35.1.php"
          setup_root(){
            local root="$1" src="$2" port="$3" label="$4"
            local cookie="$EVID/$label.cookies"
            rm -rf "$root"; cp -a "$src" "$root"; rm -f "$cookie"
            php -S 127.0.0.1:$port -t "$root" >"$EVID/$label-server.log" 2>&1 & local pid=$!
            local ready=0; for i in $(seq 1 60); do if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" -o "$EVID/$label-setup.html"; then ready=1; break; fi; sleep .25; done; test "$ready" = 1
            local csrf; csrf=$(python3 - "$EVID/$label-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
            )
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=V2351 Candidate' --data-urlencode 'admin_password=V2351Candidate!2026' --data-urlencode 'admin_password_confirm=V2351Candidate!2026' -o "$EVID/$label-setup-post.html"
            kill "$pid" || true
            php "$root/cli/verify.php" | grep -Fx VERIFY_PASS=YES >/dev/null
          }
          setup_root "$UPGRADE" production/src 18381 source
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/seed.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php'; require_once getenv('ROOT').'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());$c=$r->createCategory(['name'=>'V2351 Gate','description'=>'','is_private'=>false]);$domains=['start','channels','watch','topics'];
          for($i=1;$i<=40;$i++){ $x=$r->saveLink(null,['category_id'=>$c,'title'=>'Candidate '.$i,'url'=>'https://example.com/v2351-'.$i,'description'=>'preserve','tags'=>'candidate','is_private'=>$i%5===0,'is_favorite'=>$i<=4],'manual'); $d=$domains[($i-1)%4]; if($d!=='start')$s->upsertProfile((int)$x['id'],['surface'=>$d,'resource_kind'=>$d==='channels'?'creator':($d==='watch'?'movie':'guide')]); }
          echo "P01_V2351_SEED_40=PASS\n";
          PHP
          grep -Fx P01_V2351_SEED_40=PASS "$EVID/seed.txt"
          php "$REPAIR" --verify-source="$UPGRADE" | tee "$EVID/verify-source.json" | jq -e '.ok==true' >/dev/null
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/upgrade-run.json" | jq -e '.ok==true and .already_current==false and .schema=="2026082901"' >/dev/null
          test "$(cat "$UPGRADE/VERSION.txt")" = '2.35.1'
          grep -Fx "define('VF_VERSION', '2.35.1');" "$UPGRADE/app/bootstrap.php" >/dev/null
          ROOT="$UPGRADE" php <<'PHP' | tee "$EVID/data-preservation.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE lifecycle_state='active'")->fetchColumn()!==40)exit(1);
          if((int)$db->query("SELECT COUNT(*) FROM links WHERE is_favorite=1 AND lifecycle_state='active'")->fetchColumn()!==4)exit(2);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(3);
          if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(4);
          echo "P01_V2351_DATA_PRESERVATION=PASS\n";
          PHP
          php "$REPAIR" --run="$UPGRADE" | tee "$EVID/idempotent.json" | jq -e '.ok==true and .already_current==true' >/dev/null
          php "$REPAIR" --verify-target="$UPGRADE" | tee "$EVID/verify-target.json" | jq -e '.ok==true' >/dev/null
          php "$UPGRADE/cli/verify.php" | tee "$EVID/upgrade-verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$UPGRADE/cli/surface-verify.php" | tee "$EVID/upgrade-surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          echo P01_V2351_ACTUAL_UPGRADE=PASS | tee "$EVID/upgrade-verdict.txt"

      - name: Fresh install exact candidate and five-domain HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$FRESH"; cp -a candidate/src "$FRESH"
          php -S 127.0.0.1:18382 -t "$FRESH" >"$EVID/fresh-server.log" 2>&1 & PID=$!
          COOKIE="$EVID/fresh.cookies"; rm -f "$COOKIE"
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18382/setup.php -o "$EVID/fresh-setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/fresh-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18382/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2351 Fresh' --data-urlencode 'admin_password=V2351Fresh!2026' --data-urlencode 'admin_password_confirm=V2351Fresh!2026' -o "$EVID/fresh-setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/fresh-verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/fresh-surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          LOGIN=$(curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d '{"password":"V2351Fresh!2026"}' 'http://127.0.0.1:18382/api.php?action=login'); echo "$LOGIN" | jq -e '.ok==true' >/dev/null
          for route in home.php start.php channels.php watch.php topics.php; do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:18382/$route" -o "$EVID/fresh-${route%.php}.html"; done
          grep -F 'VF Start · V2.35.1' "$EVID/fresh-home.html" >/dev/null
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/fresh-sqlite.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$db=vf_db();if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(2);if($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(3);echo "P01_V2351_FRESH_SQLITE=PASS\n";
          PHP
          kill "$PID" || true
          echo P01_V2351_FRESH_FIVE_DOMAIN=PASS | tee "$EVID/fresh-verdict.txt"

      - name: Candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2351_EXACT_SOURCE=PASS "$EVID/boundary.txt"
          grep -Fx P01_V2351_CANDIDATE_DETERMINISTIC=PASS "$EVID/artifact-verdict.txt"
          grep -Fx P01_V2351_ACTUAL_UPGRADE=PASS "$EVID/upgrade-verdict.txt"
          grep -Fx P01_V2351_FRESH_FIVE_DOMAIN=PASS "$EVID/fresh-verdict.txt"
          cat >"$EVID/verdict.txt" <<EOF
          P01_V2351_CANDIDATE_READINESS=PASS
          CANDIDATE=$CANDIDATE
          CANDIDATE_TREE=$CANDIDATE_TREE
          CANDIDATE_RUNTIME_TREE=$CANDIDATE_RUNTIME_TREE
          SOURCE=$SOURCE
          SOURCE_VERSION=$SOURCE_VERSION
          TARGET_VERSION=$VERSION
          SCHEMA=$SCHEMA
          ACTUAL_UPGRADE=PASS
          DATA_PRESERVATION=PASS
          IDEMPOTENCE=PASS
          REPAIR_SELF_TEST=PASS
          FRESH_INSTALL=PASS
          FIVE_DOMAIN_HTTP=PASS
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2351-candidate-evidence-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload unpublished candidate artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2351-unpublished-candidate-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
