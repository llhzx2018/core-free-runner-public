name: P01 V2.35.1 Candidate Prep via Proven Orchestrator

on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/p01-v2350-unified-candidate-readiness-20260831.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 04b8fb4bd005205b737fff7ffc3383bef4c1990a
      TARGET_BRANCH: release/v2.35.1-candidate-20260831
    steps:
      - name: Checkout exact private P01 candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.1-candidate-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0

      - name: Exact base fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(cat VERSION)" = '2.35.0'
          test "$(cat src/VERSION.txt)" = '2.35.0'
          grep -Fx "define('VF_VERSION', '2.35.0');" src/app/bootstrap.php >/dev/null

      - name: Write V2.35.1 release metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2.35.1\n' > VERSION
          printf '2.35.1\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.35.0');"
          new="define('VF_VERSION', '2.35.1');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          head="""## V2.35.1 · Patch Release Candidate · 2026-08-31

- 收口 V2.35.0 发布后的三批已验证 UX：Topic 无封面 fallback、Watch 无海报 fallback、Home 移动端 Recent=0 空态密度。
- Topic / Watch 仅改变无真实封面/海报时的 fallback identity；已有真实图片路径保持不变。
- Home 仅在 ≤430px 且 Recent 真正为空时压缩首屏空态；非空 Recent 与桌面保持原结构。
- 当前 Develop Five-Domain Visual Sweep `33335213914` PASS：Home / Start / Channels / Watch / Topics × 1440/390 × Light/Dark 共 20 帧，CLI / Surface / SQLite/FK 与人眼复核通过。
- Schema 保持 `2026082901`，无 Migration；本补丁不新增功能域、不修改数据模型、不修改 Production 数据。
- Release Gate 必须同时验证 `2.34.0 → 2.35.1` 与 `2.35.0 → 2.35.1` 两条 Atomic 路径，避免 Owner 仍在 2.34.0 时被新 Latest 阻断。

"""
          p.write_text(head+s,encoding='utf-8',newline='\n')
          PY
          test "$(cat VERSION)" = '2.35.1'
          test "$(cat src/VERSION.txt)" = '2.35.1'
          grep -Fx "define('VF_VERSION', '2.35.1');" src/app/bootstrap.php >/dev/null
          mapfile -t files < <(git diff --name-only)
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          printf '%s\n' CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit candidate and push exact branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.35.1 patch candidate'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
          printf 'P01_V2351_CANDIDATE=%s\n' "$(git rev-parse HEAD)"
          printf 'P01_V2351_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD^{tree})"
          printf 'P01_V2351_RUNTIME_TREE=%s\n' "$(git rev-parse HEAD:src)"
