name: P01 IA V2 R5 Music Frontstage exact-source regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r5-music-frontstage-exact-source.yml'
permissions:
  contents: read
jobs:
  p01-r5-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 2c7938ba2e625dbe8e219d542c901ad87f1974e0
      BASELINE_SHA: 49b6b7331fc81f47f26dfe7832a39d1b2dc591e7
    steps:
      - name: Prepare isolated PHP and SQLite test stack
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Fetch exact pinned private sources into temporary runner only
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo BLOCKED_SECRET_MISSING; exit 11; }
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git init -q stable
          git -C stable remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C stable -c advice.detachedHead=false fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C stable rev-parse HEAD)" = "$BASELINE_SHA"
          git -C candidate remote remove origin
          git -C stable remote remove origin
          echo P01_R5_EXACT_SOURCE=PASS
      - name: R5 syntax, frontstage contracts and isolated owner HTTP CRUD
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d "\r\n " < candidate/VERSION)" = "2.47.444"
          test "$(tr -d "\r\n " < candidate/src/VERSION.txt)" = "2.47.444"
          php -l candidate/src/music-home.php
          php -l candidate/tests/unit/p01_ia_v2_r5_music_frontstage_contract.php
          node --check candidate/src/assets/music-home-manage.js
          php candidate/tests/unit/p01_ia_v2_r5_music_frontstage_contract.php
          bash candidate/tests/integration/p01_ia_v2_r5_music_http_roundtrip.sh candidate
          echo P01_R5_FOCUSED_GATE=PASS
      - name: Existing Music and full canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R5_CANONICAL_REGRESSION=PASS
      - name: Remove exact-source temporary checkouts
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R5_PRIVATE_SOURCE_CLEANUP=PASS
