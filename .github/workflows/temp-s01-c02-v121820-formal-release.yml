name: TEMP S01-C02 v1.21.820 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121820-preflight-authority-scan-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121820-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPS_SHA: 562827263f4d8fe93aee3ea6fb445164cfa5242a
      OPS_TREE: 9bee1ffdbec4321fab9bfe9570aa54968c8d1027
      CANDIDATE_GATE_RUN: '33959769180'
      ASSET_NAME: vf-tools-ops_V1.21.820.zip
      ASSET_BYTES: '3235541'
      ASSET_SHA: 3627eba025cd2b8b64b3a5ebf0e9b325f6f92103ad200aa064cb9bef42519317
      RUNTIME_FILES: '905'
      RUNTIME_FP: a991ecfba95317581ca90f65e5c4003b70558023a3f85cf5be7ec19e9189755c
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify promoted source Candidate Gate and exact artifact
        shell: bash
        env:
          R: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gate=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_GATE_RUN")
          test "$(jq -r '.conclusion' <<<"$gate")" = success
          test "$(jq -r '.head_sha' <<<"$gate")" = 0a9fc0804887835dfa19dfa810cce558c82baba1
          main=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/main | jq -r '.commit.sha')
          develop=$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/develop | jq -r '.commit.sha')
          test "$main" = "$OPS_SHA"
          test "$develop" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$OPS_TREE"
          php ops/.github/phase3/v121820-candidate-preflight-authority.php
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          root=Path('ops'); runtime=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to(root).as_posix(); parts=rel.split('/'); low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              runtime.append((rel,p.read_bytes()))
          runtime.sort(key=lambda x:x[0])
          fp=hashlib.sha256()
          for rel,b in runtime: fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/vf-tools-ops_V1.21.820.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in runtime:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          assert len(runtime)==905
          assert fp.hexdigest()=='a991ecfba95317581ca90f65e5c4003b70558023a3f85cf5be7ec19e9189755c'
          assert z.stat().st_size==3235541
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='3627eba025cd2b8b64b3a5ebf0e9b325f6f92103ad200aa064cb9bef42519317'
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo RELEASE_AUTHORITY=PASS
          echo EXACT_ARTIFACT=PASS
      - name: Create and read back Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.820 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.820 "/tmp/release/$ASSET_NAME" \
            --repo llhzx2018/vf-tools-ops \
            --target "$OPS_SHA" \
            --title 'VF Tools Ops v1.21.820' \
            --notes 'S01-C02 Candidate Preflight Authority V1. Aligns Cloudflare Candidate preparation with the existing saved_snapshot_lightweight_batch_identity Preflight contract. A persisted, intact, current snapshot with an eligible locked release batch and P0=0 may proceed while P1 warnings remain visible; Candidate creation no longer silently reruns context-sensitive live evidence and rejects the same saved snapshot for transient scope/evidence drift. P0, expired snapshots, version mismatch, batch-identity mismatch and corrupted snapshots remain fail-closed. The legacy strict live Preflight gate remains intact for other governance consumers; final online freeze remains NO and its stricter acceptance policy is unchanged. Candidate worker/autostart logic is unchanged. Existing recovered Simply Static Source and completed inspection are preserved; no repeat Source ZIP upload is authorized. No M3U8 migration/schema/DB write, Seed HOLD release, JD.gg/WPvivid mutation, content write, Production activation or DNS write is performed by this release.'
          j=$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.820)
          test "$(jq -r '.target_commitish' <<<"$j")" = "$OPS_SHA"
          test "$(jq -r '.draft' <<<"$j")" = false
          test "$(jq -r '.prerelease' <<<"$j")" = false
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$j")"
          echo "ASSET_ID=$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")"
          echo PASS_V121820_FORMAL_RELEASE
