name: P01 V2.25 Final Feature Head Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-final-head-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_HEAD: 5520d78fcfd77b51fbd7ecd2f0e05c9286490f29
      FUNCTIONAL_SOURCE: d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8
      BRANCH: feature/p01-v2.25.0-vf-teal-rebaseline-20260828
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact identity and scope continuity
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${BRANCH}"|awk '{print $1}')" = "$EXACT_HEAD"
          git merge-base --is-ancestor "$FUNCTIONAL_SOURCE" "$EXACT_HEAD"
          test "$(git diff --name-only "$FUNCTIONAL_SOURCE" "$EXACT_HEAD" | grep -Ev '^(README.md|AGENTS.md|CHANGELOG.md|VF_PROJECT.json|docs/)' | wc -l)" -eq 0
          grep -F 'Owner Production Runtime: V2.24.0' docs/authority/CURRENT.md >/dev/null
          grep -F 'V2.25.0 VF Teal Whole-site UX/UI Candidate' docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F 'surface-vf-theme.css' src/app/SurfaceShell.php >/dev/null
          echo P01_V225_FINAL_HEAD_IDENTITY=PASS
      - name: Syntax and regression contracts
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          rm -rf /tmp/p01-v225-final; cp -a src /tmp/p01-v225-final; cd /tmp/p01-v225-final
          php -r "require 'app/bootstrap.php'; vf_initialize_database(vf_db());"
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v225-final-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v225-final-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v225-final-baseline.txt
          grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v225-final-baseline.txt
          test "$(php -r "require 'app/bootstrap.php';echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php';echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V225_FINAL_HEAD_REGRESSION=PASS
      - name: Evidence continuity
        run: |
          set -Eeuo pipefail
          python3 -m json.tool VF_PROJECT.json >/dev/null
          python3 -m json.tool docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json >/dev/null
          grep -F '33157340401' docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json >/dev/null
          grep -F '33157677144' docs/evidence/P01_V2.25.0_VF_TEAL_UI_AUDIT_20260828.json >/dev/null
          echo P01_V225_FINAL_HEAD_EVIDENCE=PASS
      - name: Verdict
        run: |
          echo P01_V225_FINAL_FEATURE_HEAD="$EXACT_HEAD"
          echo P01_V225_FINAL_FEATURE_HEAD_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
