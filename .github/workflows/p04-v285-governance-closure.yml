          d['current_phase']='V2.8.5_FORMAL_READY_FOR_OWNER_REAL_USE_UPGRADE'
          d['project_block']='NONE'
          d['window_execution_block']='NONE'
          d['next_gate']='OWNER_REAL_USE_V2.8.5_UPGRADE'
          d['next_action']='OWNER_PRODUCTION_UPGRADE_TO_V2.8.5_AND_SEND_RESULT_SCREENSHOT'
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open(p,'a',encoding='utf-8').write('\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = 'VF_PROJECT.json'
          git commit -m 'chore(P04): close V2.8.5 settings and route UX release'
          git push origin HEAD:develop
          echo "P04_V285_GOVERNANCE_COMMIT=$(git rev-parse HEAD)"
          echo 'PRODUCTION_WRITE=0'
