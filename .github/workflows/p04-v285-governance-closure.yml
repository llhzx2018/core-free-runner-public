name: P04 V2.8.5 Governance Closure

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v285-governance-closure.yml'
      - 'requests/p04-v285-governance-closure.txt'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PRODUCT: b73179673801452469a276ec744e15612ee7f38a
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact P04 develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Write V2.8.5 Current Truth closure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PUSH_TOKEN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_PRODUCT"
          python3 - <<'PY'
          import json
          p='VF_PROJECT.json'
          d=json.load(open(p,encoding='utf-8'))
          d['status']='V2.8.5_FORMAL_RELEASE_PASS'
          d['lifecycle']='RELEASED_PENDING_PRODUCTION_OWNER_UPGRADE'
          d['version']='2.8.5'
          ba=d.setdefault('branch_authority',{})
          ba.update({
            'main':'V2.8.5_FORMAL_BRANCH_PENDING_GOVERNANCE_FAST_FORWARD',
            'develop':'V2.8.5_FORMAL_PRODUCT_PLUS_GOVERNANCE_CLOSURE',
            'formal_product_source':'b73179673801452469a276ec744e15612ee7f38a',
            'formal_product_tree':'eec4572631e98f02d92ac0fd2e1821bbe2a65a50',
            'formal_tag':'v2.8.5',
            'working_candidate_product_source':'b73179673801452469a276ec744e15612ee7f38a',
            'working_candidate_product_tree':'eec4572631e98f02d92ac0fd2e1821bbe2a65a50'
          })
          d['v285_settings_route_ux']={
            'status':'FORMAL_RELEASE_PASS',
            'owner_direction':'KEEP_SETTINGS_LEFT_SIDEBAR_REMOVE_ONLY_NESTED_TABS; DATA_AND_SYSTEM_SINGLE_CONTINUOUS_PAGE; PROVIDER_TOP_LEVEL_ROUTE_OPENS_AT_TOP',
            'schema':14,
            'migration':'NONE',
            'provider_authority_change':False,
            'formal_product_source':'b73179673801452469a276ec744e15612ee7f38a',
            'runtime_fingerprint':'78c7b50956abe9b1092725aa83a633b8062dd439ab96bf035d557390a7412c29',
            'source_manifest_sha256':'95e1c604bca4e9c18c701afd82fd88f1dcf593678be0003c528b8771728a31a0',
            'runtime_file_count_including_manifest':214,
            'settings_primary_sidebar':'RETAINED',
            'nested_settings_tabs':'REMOVED',
            'data_management':'IMPORT_EXPORT_PLUS_BACKUP_RESTORE_ONE_CONTINUOUS_PAGE',
            'system_information':'SYSTEM_INFO_PLUS_DIAGNOSTICS_ONE_CONTINUOUS_PAGE',
            'owned_route_post_render_scroll_reset':'PASS',
            'same_page_refresh_scroll_preserved':'PASS',
            'v284_long_action_feedback_regression':'PASS',
            'runtime_safe_integrity_verifier':'PASS'
          }
          d['formal_release']={
            'status':'PASS','version':'2.8.5','tag':'v2.8.5','release_name':'VF Infra V2.8.5','release_id':372985763,
            'product_source':'b73179673801452469a276ec744e15612ee7f38a','product_tree':'eec4572631e98f02d92ac0fd2e1821bbe2a65a50',
            'full':{'asset_name':'VF_Infra_V2.8.5_FULL.zip','asset_id':520742168,'bytes':575671,'sha256':'eadb10e16e53004040e4e823bb215f81398b7a06313cc1f4a66fac6b2c9d1374'},
            'update':{'asset_name':'VF_Infra_V2.8.5_UPDATE.zip','asset_id':520742167,'bytes':1244056,'sha256':'e7896773928f6e21b024c628f047d04c57007b9287e0cd67d1eb7c0eb635f13c','allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4'],'payload_file_count':214},
            'atomic_self_test':'PASS','remote_artifact_readback':'PASS','production_write':0
          }
          d['online_update_channel']={
            'status':'READY_FOR_V2.8.5_OWNER_UPGRADE',
            'authority':'llhzx2018/core-updates/projects/P04.json',
            'authority_publication_commit':'92b927564933305383384804c82a043eb362d135',
            'target_version':'2.8.5',
            'allowed_source_versions':['2.7.9','2.8.0','2.8.1','2.8.2','2.8.3','2.8.4'],
            'schema_from':14,'schema_to':14,'update_type':'ATOMIC','backup_required':True,'rollback_supported':True,
            'e2e_run':32246434209,'e2e_job':96047868093,'e2e_status':'PASS','evidence_artifact_id':9362754186,'production_write':0
          }
          prod=d.setdefault('production',{})
          prod.update({
            'installed_version':'2.8.4',
            'installed_version_evidence':'OWNER_SCREENSHOT_V2.8.4_PROVIDER_PAGE',
            'schema_visible':14,
            'production_write_by_assistant_v285_cycle':0,
            'upgrade_v285':'NOT_EXECUTED',
            'next_requirement':'OWNER_UPGRADE_TO_V2.8.5_AND_POST_UPGRADE_READBACK'
          })
          gates=d.setdefault('verification_gates',{})
          gates.update({
            'v285_settings_primary_sidebar_retained':'PASS',
            'v285_nested_settings_tabs_removed':'PASS',
            'v285_data_management_single_page':'PASS',
            'v285_system_information_single_page':'PASS',
            'v285_owned_route_post_render_scroll_reset':'PASS',
            'v285_same_page_refresh_scroll_contract':'PASS',
            'v285_formal_candidate':'PASS',
            'v285_formal_release':'PASS',
            'v285_core_updates_publish':'PASS',
            'v285_online_channel_e2e':'PASS',
            'production_v285_upgrade':'WAITING_OWNER_REAL_USE'
