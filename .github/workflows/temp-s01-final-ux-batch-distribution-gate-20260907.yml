name: S01 Final UX Batch Distribution Gate
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-final-ux-batch-distribution-gate-20260907.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_SHA: 938a91b7abe5cd6cea21302e47662ce650dcba06
      CORE_BASE: 4dfab2e153f37da94886d2cfb4a35df780d7f6c1
      C01_SHA: 6c30935c613802847d138097c63c3f73219ec02a
      C02_SHA: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
      C03_SHA: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
    steps:
      - name: Exact three-manifest distribution proof
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'WRITE_TOKEN_USED=NO PRODUCT_WRITE_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" core
          git -C core checkout -q "$CORE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C core rev-parse origin/main)" = "$CORE_BASE"
          git -C core diff --name-only "$CORE_BASE" HEAD | sort > /tmp/actual
          printf '%s\n' projects/S01-C01.json projects/S01-C02.json projects/S01-C03.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          echo 'PASS_EXACT_THREE_MANIFEST_FENCE'
          for f in core/projects/S01-C01.json core/projects/S01-C02.json core/projects/S01-C03.json; do jq -e . "$f" >/dev/null; done
          (cd core && python3 scripts/check_manifest_contract.py >/tmp/contract.json)
          jq -e '.status=="PASS"' /tmp/contract.json >/dev/null
          find core/update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core/update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          c1=json.load(open('core/projects/S01-C01.json'));c2=json.load(open('core/projects/S01-C02.json'));c3=json.load(open('core/projects/S01-C03.json'))
          assert c1['target_version']=='1.35.19' and c1['release_tag']=='v1.35.19' and c1['asset_name']=='vf-tools-theme_V1.35.19.zip'
          assert c1['asset_bytes']==1806467 and c1['asset_sha256']=='89c3217ded3fb220caa1a934cbc37cea5187edbb69f7b254b3fc1adb794f4f22'
          assert c1['runtime_files']==446 and c1['runtime_fingerprint']=='9113186c89e972aa668cb5c0fb52960a9dfd0302969f3a67ed750455fb9685d6'
          assert c1['from_versions']==['1.35.8','1.35.9','1.35.10','1.35.11','1.35.12','1.35.13','1.35.14','1.35.15','1.35.16','1.35.17','1.35.18']
          assert c2['target_version']=='1.21.857' and c2['release_tag']=='v1.21.857' and c2['asset_name']=='vf-tools-ops_V1.21.857.zip'
          assert c2['asset_bytes']==3339813 and c2['asset_sha256']=='f3707c60a099be01d7a5726308192692e2547020a1ddabf715182baef080e5a7'
          assert c2['runtime_files']==934 and c2['runtime_file_count']==934 and c2['runtime_fingerprint']=='c10a31837863dddaba3ddb2e2a70969f4509b0db8ef1ed58a05da7a1e6f7d720' and c2['runtime_fingerprint_sha256']==c2['runtime_fingerprint']
          assert c2['physical_locator']=='vf-ops/vf-ops.php' and c2['locator_cutover'] is False and c2['schema_from']=='6.0.0' and c2['schema_to']=='6.0.0'
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853','1.21.854','1.21.855','1.21.856']
          assert c3['target_version']=='1.25.28' and c3['release_tag']=='v1.25.28' and c3['asset_name']=='vf-tools-m3u8_V1.25.28.zip'
          assert c3['asset_bytes']==3580525 and c3['asset_sha256']=='835375d0e1b41b8f2348bef13df08b883e44e554917d739fbef9463cc0f0504f'
          assert c3['runtime_files']==559 and c3['runtime_file_count']==559 and c3['runtime_fingerprint']=='21d08119f69e3a2ac2d9f25ae1f6076e60b7d732a1cc6ab298501e93f5bf42db' and c3['runtime_fingerprint_sha256']==c3['runtime_fingerprint']
          assert c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php' and c3['locator_cutover'] is False and c3['schema_from']=='1.3.0' and c3['schema_to']=='1.3.0'
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24','1.25.25','1.25.26','1.25.27']
          assert 'migration remains CLOSED' in c3['notes']
          for c in (c1,c2,c3): assert 'does not claim Production' in c['notes']
          print('PASS_S01_BATCH_CHANNEL_SEMANTICS')
          PY
          for spec in \
            'llhzx2018/vf-tools-theme|v1.35.19|vf-tools-theme_V1.35.19.zip|1806467|89c3217ded3fb220caa1a934cbc37cea5187edbb69f7b254b3fc1adb794f4f22|6c30935c613802847d138097c63c3f73219ec02a' \
            'llhzx2018/vf-tools-ops|v1.21.857|vf-tools-ops_V1.21.857.zip|3339813|f3707c60a099be01d7a5726308192692e2547020a1ddabf715182baef080e5a7|3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb' \
            'llhzx2018/vf-tools-m3u8|v1.25.28|vf-tools-m3u8_V1.25.28.zip|3580525|835375d0e1b41b8f2348bef13df08b883e44e554917d739fbef9463cc0f0504f|3a50a8557fbdb634f56ab6fd14a3d9072bd927c5'; do
            IFS='|' read -r repo tag asset bytes digest sha <<< "$spec"
            test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$sha"
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            gh api "repos/$repo/releases/tags/$tag" > /tmp/release.json
            test "$(jq -r '.draft' /tmp/release.json)" = false; test "$(jq -r '.prerelease' /tmp/release.json)" = false
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = "$bytes"
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = "sha256:$digest"
          done
          echo 'PASS_LIVE_THREE_RELEASE_AUTHORITIES'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01;git -C c01 checkout -q "$C01_SHA"
          cat >/tmp/ta.php <<'PHP'
          <?php define('ABSPATH','/'); class WP_Error { public function __construct(...$x){} } require $argv[1].'/src/inc/update/class-vf-theme-runtime-authority-v1.php'; $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1].'/src'); echo $s['file_count'],' ', $s['fingerprint_sha256'],"\n";
          PHP
          test "$(php /tmp/ta.php c01)" = '446 9113186c89e972aa668cb5c0fb52960a9dfd0302969f3a67ed750455fb9685d6'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02;git -C c02 checkout -q "$C02_SHA"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03;git -C c03 checkout -q "$C03_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          def fp(rows):
            h=hashlib.sha256()
            for rel,b in sorted(rows):h.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
            return len(rows),h.hexdigest()
          rows=[];root=Path('c02')
          for p in root.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            rel=p.relative_to(root).as_posix();parts=rel.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts):continue
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):continue
            if ((rel in {'vf-ops.php','uninstall.php'}) if '/' not in rel else parts[0] in {'includes','assets','languages','config'}):rows.append((rel,p.read_bytes()))
          assert fp(rows)==(934,'c10a31837863dddaba3ddb2e2a70969f4509b0db8ef1ed58a05da7a1e6f7d720')
          rows=[];src=Path('c03/src')
          for p in src.rglob('*'):
            if not p.is_file():continue
            rel=p.relative_to(src).as_posix();parts=rel.split('/');low=[x.lower() for x in parts];bn=parts[-1].lower()
            if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low):continue
            if bn in {'readme.md','changelog.md','license','license.txt','package_profile.json'} or bn.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')):continue
            if ((rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) if len(parts)==1 else parts[0] in {'admin','config','includes','public','templates','tools'}):rows.append((rel,p.read_bytes()))
          assert fp(rows)==(559,'21d08119f69e3a2ac2d9f25ae1f6076e60b7d732a1cc6ab298501e93f5bf42db')
          print('PASS_RUNTIME_AUTHORITY_RECOMPUTE')
          PY
          echo 'PASS_S01_FINAL_UX_BATCH_DISTRIBUTION_GATE'
