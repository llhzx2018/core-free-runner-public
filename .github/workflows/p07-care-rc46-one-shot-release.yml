name: P07 Care rc46 security one-screen formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc46-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): Care rc46 SSH one-screen'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Public Distribution main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact source and Gate verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'fbf9a4b25c0d5649459449dedda9be1253ddb637'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc46'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc46'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'c0b03b7fcbf7637273c2eb901412f051b26d397a'
          test "$(git hash-object "$pkg/security-audit.sh")" = 'dccda6463f15ed57b083f5e4f2706c847d7eaaf0'
          test "$(git hash-object "$pkg/vf-system-care.sh")" = 'b6a2da93ac1c41ba272d17e00c8c61ab442f05da'
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc46"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc46'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='c0b03b7fcbf7637273c2eb901412f051b26d397a'" installers/p07-system-care.sh
          grep -Fq '5) screen_clear; run_action_friendly security-audit.sh; pause_menu' "$pkg/vf-system-care.sh"
          for id in 37763286083 37763286197 37763286200 37763285929 37763285960 37763286121 37763285944 37763286047 37763285897 37763286215 37763285883 37763286135 37763286012 37763285987 37763286074; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '1ac15044797a8a9de7bce5c879d186d0923c0d4d'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_CARE_RC46_EXACT_GATE=PASS
      - name: Publish formal release and read back
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc46-login-security-one-screen'
          target='fbf9a4b25c0d5649459449dedda9be1253ddb637'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · rc46 服务器登录安全单屏修复' \
              --notes '菜单4的服务器登录安全页面：先清屏，不再显示上一级菜单；只显示 SSH 服务状态、配置端口、管理员登录、密码认证、防火墙与登录保护。明确区分服务状态和配置读取失败，不能仅凭配置端口就宣称远程登录正常；删除与本页无关的面板信息和更新缓存。保持终端语义配色与 Enter 返回；任何 SSH、密码、防火墙和服务状态均只读，不自动修改，避免锁定服务器。其他菜单版本冻结。公共隔离 Gate 15/15 PASS，Production 未自动修改，OWNER 实机验收独立确认。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_CARE_RC46_FORMAL_RELEASE=PASS
