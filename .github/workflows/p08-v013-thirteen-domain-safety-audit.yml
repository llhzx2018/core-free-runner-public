name: P08 v013 exact 13 Public Authority bodies and updater negatives
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v013-thirteen-domain-safety-audit.yml]
permissions:
  contents: read
jobs:
  thirteen-domains:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v013-candidate-source-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact P08 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 11f1ca58849e4baf8283c33659863416e48b9c5d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Exact governed Mode U source and canonical thirteen domains
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a6e476ccc54fec29cf5264177cf65675b282d4da
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          tools: composer:v2
          coverage: none
      - name: Native machine scan of exact public authority bodies and project applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = 11f1ca58849e4baf8283c33659863416e48b9c5d
          test "$(git -C gov rev-parse HEAD)" = a6e476ccc54fec29cf5264177cf65675b282d4da
          test "$(cat p08/VERSION)" = 0.1.13
          python3 - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          base=Path('gov')
          p08=Path('p08')
          a=json.loads((base/'governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json').read_text())
          domains=a['domains']
          expected={'INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','SEO',
                    'CRON_JOB','NOTIFICATION','OBSERVABILITY','PERFORMANCE','GIT','UA_UI'}
          assert set(domains)==expected
          assert 'UNKNOWN' not in a['allowed_states']
          contract=(p08/'docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md').read_text()
          case=(base/'governance/release/cases/P08_ADOPS_013_PR78_PR79_RELEASE_FIRST_OWNER_MANUAL_20261119.md').read_text()
          acceptance=(p08/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert 'RP-07U' in acceptance and 'Mode U' in case
          assert 'OWNER_PRODUCT_ACCEPTANCE=PENDING' in case
          for domain in sorted(expected):
              path=base/domains[domain]['authority']
              assert path.is_file(),(domain,'MISSING_AUTHORITY')
              body=path.read_bytes()
              assert 2000<len(body)<300000,(domain,'INVALID_BODY_SIZE')
              assert domain in contract and re.search(r'\|\s*'+domain+r'\s*\|',contract)
              assert domain in case
              row=next((x for x in contract.splitlines() if re.match(r'^\|\s*'+domain+r'\s*\|',x)),None)
              assert row and ('REQUIRED' in row or 'CONDITIONAL' in row) and 'UNKNOWN' not in row
              print('P08_013_DOMAIN_'+domain+'='+('REQUIRED' if 'REQUIRED' in row else 'CONDITIONAL')
                    +';BODY_SHA256='+hashlib.sha256(body).hexdigest())
          print('P08_013_ALL_13_AUTHORITY_LIVE_SOURCE_BODIES_AND_PROJECT_MAPPING=STRUCTURAL_PASS')
          PY
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
      - name: Execute exact PR78/79 updater, installation, status, and security negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08
          composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader
          php tests/test_setup_guard.php
          php tests/test_setup_experience_contract.php
          php tests/test_owner_check_failure_classes.php
          php tests/test_owner_future_atomic_status.php
          php tests/test_owner_previous_cycle_archive.php
          php tests/test_owner_future_repeat_cycle.php
          P08_R187_ISOLATED=YES php tests/test_owner_future_one_click.php
          php tests/test_upgrade_throttle_isolation.php
          test -z "$(git diff --name-only)"
          echo P08_013_UPDATER_NEGATIVE_SAFETY_CASES=PASS
      - name: Confidential source cleanup
        if: always()
        run: |
          rm -rf -- p08 gov
          test ! -e p08 && test ! -e gov
          echo P08_013_13_DOMAIN_PRIVATE_SOURCE_CLEANUP=PASS
