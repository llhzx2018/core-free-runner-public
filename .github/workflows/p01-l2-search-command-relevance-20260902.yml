name: P01 L2 Search Command + Relevance
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-search-command-relevance-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-search-command-relevance-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = a04631226e5be8f37388bbf0eb7fb7d34027a409
          test "$(git -C product rev-parse origin/develop)" = a04631226e5be8f37388bbf0eb7fb7d34027a409
      - name: Apply search usability patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)

          p=Path('src/app/FunctionalWorkspace.php'); s=p.read_text()
          old="""    $assets=$mode==='start'?vf_fw_filter_category($scopedMode,$categories,$categoryId):vf_fw_filter_kind($scopedMode,$kind);\n    if($q!==''){$needle=mb_strtolower($q,'UTF-8');$assets=array_values(array_filter($assets,static function(array $asset)use($needle):bool{$haystack=mb_strtolower((string)($asset['title']??'').' '.(string)($asset['url']??'').' '.(string)($asset['description']??'').' '.(string)($asset['category_name']??'').' '.(string)($asset['resource_kind']??'').' '.(string)($asset['provider_label']??'').' '.implode(' ',(array)($asset['tags']??[])),'UTF-8');return mb_strpos($haystack,$needle,0,'UTF-8')!==false;}));}\n"""
          new="""    $assets=$mode==='start'?vf_fw_filter_category($scopedMode,$categories,$categoryId):vf_fw_filter_kind($scopedMode,$kind);\n    $needle=$q!==''?mb_strtolower($q,'UTF-8'):'';\n    if($needle!==''){$assets=array_values(array_filter($assets,static function(array $asset)use($needle):bool{$haystack=mb_strtolower((string)($asset['title']??'').' '.(string)($asset['url']??'').' '.(string)($asset['description']??'').' '.(string)($asset['category_name']??'').' '.(string)($asset['resource_kind']??'').' '.(string)($asset['provider_label']??'').' '.implode(' ',(array)($asset['tags']??[])),'UTF-8');return mb_strpos($haystack,$needle,0,'UTF-8')!==false;}));}\n"""
          s=once(s,old,new,'search needle init')
          old="""    if($view!=='discover'&&!$discover){usort($assets,static function(array $a,array $b)use($sort,$mode,$view):int{if($sort==='title')return strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='popular')return ((int)($b['click_count']??0)<=>(int)($a['click_count']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='recent'){$ad=(string)($a['last_surface_opened_at']??'');$bd=(string)($b['last_surface_opened_at']??'');if($ad!==$bd)return strcmp($bd,$ad);return strcmp((string)($b['updated_at']??''),(string)($a['updated_at']??''));}if($sort==='year'&&$mode==='watch')return ((int)($b['media_year']??0)<=>(int)($a['media_year']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='default'&&$view==='favorite'){$ar=(int)($a['favorite_rank']??0);$br=(int)($b['favorite_rank']??0);if($ar>0||$br>0){if($ar<=0)return 1;if($br<=0)return -1;if($ar!==$br)return $ar<=>$br;}$updated=strcmp((string)($b['updated_at']??''),(string)($a['updated_at']??''));if($updated!==0)return $updated;return strnatcasecmp((string)$a['title'],(string)$b['title']);}return ((int)($a['sort_order']??0)<=>(int)($b['sort_order']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);});}\n"""
          new="""    if($view!=='discover'&&!$discover){usort($assets,static function(array $a,array $b)use($sort,$mode,$view,$needle):int{if($sort==='default'&&$needle!==''){\n        $score=static function(array $asset)use($needle):int{\n            $title=mb_strtolower(trim((string)($asset['title']??'')),'UTF-8');$url=mb_strtolower((string)($asset['url']??''),'UTF-8');$category=mb_strtolower((string)($asset['category_name']??''),'UTF-8');$description=mb_strtolower((string)($asset['description']??''),'UTF-8');$provider=mb_strtolower((string)($asset['provider_label']??''),'UTF-8');$kind=mb_strtolower((string)($asset['resource_kind']??''),'UTF-8');$tags=array_map(static fn($tag):string=>mb_strtolower(trim((string)$tag),'UTF-8'),(array)($asset['tags']??[]));\n            $points=0;if($title===$needle)$points+=1000;elseif(str_starts_with($title,$needle))$points+=850;elseif(mb_strpos($title,$needle,0,'UTF-8')!==false)$points+=650;\n            if(in_array($needle,$tags,true))$points+=500;elseif(implode(' ',$tags)!==''&&mb_strpos(implode(' ',$tags),$needle,0,'UTF-8')!==false)$points+=220;\n            if(mb_strpos($url,$needle,0,'UTF-8')!==false)$points+=300;if(mb_strpos($category,$needle,0,'UTF-8')!==false)$points+=240;if(mb_strpos($provider,$needle,0,'UTF-8')!==false)$points+=160;if(mb_strpos($kind,$needle,0,'UTF-8')!==false)$points+=140;if(mb_strpos($description,$needle,0,'UTF-8')!==false)$points+=80;\n            if((int)($asset['is_favorite']??0)===1)$points+=90;if(trim((string)($asset['last_surface_opened_at']??''))!=='')$points+=45;$points+=min(30,max(0,(int)($asset['click_count']??0)));return $points;\n        };\n        $as=$score($a);$bs=$score($b);if($as!==$bs)return $bs<=>$as;$ad=(string)($a['last_surface_opened_at']??'');$bd=(string)($b['last_surface_opened_at']??'');if($ad!==$bd)return strcmp($bd,$ad);return strnatcasecmp((string)$a['title'],(string)$b['title']);\n    }if($sort==='title')return strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='popular')return ((int)($b['click_count']??0)<=>(int)($a['click_count']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='recent'){$ad=(string)($a['last_surface_opened_at']??'');$bd=(string)($b['last_surface_opened_at']??'');if($ad!==$bd)return strcmp($bd,$ad);return strcmp((string)($b['updated_at']??''),(string)($a['updated_at']??''));}if($sort==='year'&&$mode==='watch')return ((int)($b['media_year']??0)<=>(int)($a['media_year']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);if($sort==='default'&&$view==='favorite'){$ar=(int)($a['favorite_rank']??0);$br=(int)($b['favorite_rank']??0);if($ar>0||$br>0){if($ar<=0)return 1;if($br<=0)return -1;if($ar!==$br)return $ar<=>$br;}$updated=strcmp((string)($b['updated_at']??''),(string)($a['updated_at']??''));if($updated!==0)return $updated;return strnatcasecmp((string)$a['title'],(string)$b['title']);}return ((int)($a['sort_order']??0)<=>(int)($b['sort_order']??0))?:strnatcasecmp((string)$a['title'],(string)$b['title']);});}\n"""
          s=once(s,old,new,'search relevance sort')
          p.write_text(s)

          p=Path('src/assets/workspace-rebaseline.js'); s=p.read_text()
          old="""  document.addEventListener('keydown',e=>{\n    if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&categorySearch&&![\"INPUT\",\"TEXTAREA\",\"SELECT\"].includes(document.activeElement?.tagName||'')){\n      e.preventDefault();categorySearch.focus();categorySearch.select();\n    }\n  });\n"""
          new="""  const activeGlobalSearch=()=>{\n    const candidates=$$('.vf-global-search input[type=\"search\"],.vf-mobile-command-search input[type=\"search\"],.vf-home-mobile-command input[type=\"search\"]');\n    return candidates.find(input=>input.offsetParent!==null)||candidates[0]||null;\n  };\n  document.addEventListener('keydown',e=>{\n    const key=String(e.key||'').toLowerCase();\n    if(key==='k'&&(e.ctrlKey||e.metaKey)&&!e.altKey){\n      const input=activeGlobalSearch();if(!input)return;e.preventDefault();input.focus();input.select();return;\n    }\n    if(e.key==='/'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&categorySearch&&![\"INPUT\",\"TEXTAREA\",\"SELECT\"].includes(document.activeElement?.tagName||'')){\n      e.preventDefault();categorySearch.focus();categorySearch.select();\n    }\n  });\n  activeGlobalSearch()?.setAttribute('aria-keyshortcuts','Control+K Meta+K');\n"""
          p.write_text(once(s,old,new,'ctrl-k binding'))
          PY
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/FunctionalWorkspace.php >/dev/null
          node --check src/assets/workspace-rebaseline.js
          git diff --check
          grep -F "if(\$sort==='default'&&\$needle!=='')" src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'if($title===$needle)$points+=1000' src/app/FunctionalWorkspace.php >/dev/null
          grep -F "if((int)(\$asset['is_favorite']??0)===1)\$points+=90" src/app/FunctionalWorkspace.php >/dev/null
          grep -F "if(trim((string)(\$asset['last_surface_opened_at']??''))!=='')\$points+=45" src/app/FunctionalWorkspace.php >/dev/null
          grep -F "key==='k'&&(e.ctrlKey||e.metaKey)" src/assets/workspace-rebaseline.js >/dev/null
          grep -F "aria-keyshortcuts','Control+K Meta+K" src/assets/workspace-rebaseline.js >/dev/null
          test "$(cat src/VERSION.txt)" = 2.36.4
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/FunctionalWorkspace.php src/assets/workspace-rebaseline.js | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          test "$(git diff --name-only -- database src/migrations | wc -l | tr -d ' ')" = 0
          echo 'SEARCH COMMAND + RELEVANCE PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspace.php src/assets/workspace-rebaseline.js
          git commit -m 'feat(P01): make global search keyboard-first and relevant'
          git push origin HEAD:product/p01-search-command-relevance-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
