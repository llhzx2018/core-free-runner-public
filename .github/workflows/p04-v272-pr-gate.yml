name: P04 V2.7.2 Backend Detail UX Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'p04-v272-trigger.txt'

permissions:
  contents: read

concurrency:
  group: p04-v272-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout P04 V2.7.2 working branch
        id: product
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: feature/v2.7.2-backend-detail-ux
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Lock product identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          HEAD=$(git rev-parse HEAD)
          test "$(tr -d '\r\n' < VERSION)" = '2.7.2'
          test -f public/assets/v272-backend-detail-ux.js
          test -f public/assets/v272-backend-detail-ux.css
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "P04_V272_TESTED_HEAD=$HEAD"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          npm install --no-save --silent playwright
          npx playwright install chromium >/dev/null

      - name: Run V2.7.2 backend detail UX gate
        shell: bash
        env:
          VF_V272_TESTED_RUNTIME_COMMIT: ${{ steps.identity.outputs.head }}
          VF_V272_EVIDENCE_DIR: ${{ github.workspace }}/evidence-v272
        run: |
          set -Eeuo pipefail
          cd product
          bash scripts/run-v272-backend-detail-ux-gate.sh

      - name: Upload V2.7.2 browser / pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.7.2-BACKEND-DETAIL-UX-GATE
          path: evidence-v272/
          if-no-files-found: error
          retention-days: 30
