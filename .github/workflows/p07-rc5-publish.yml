name: P07 RC5 已验证候选发布

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-rc5-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05
          fetch-depth: 0

      - name: 生成与已通过 Gate 相同的 RC5 字节
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_patch_rc5_ux.py
          python3 .github/scripts/p07_patch_rc5_fixup.py
          chmod +x experiments/p07-bench.sh
          bash -n experiments/p07-bench.sh
          experiments/p07-bench.sh --self-test
          NO_COLOR=1 P07_BENCH_FORCE_FALLBACK=1 experiments/p07-bench.sh --demo >/tmp/rc5-demo.txt
          grep -q '1.0.0-rc5-zh' /tmp/rc5-demo.txt
          grep -q '马来西亚 吉隆坡' /tmp/rc5-demo.txt
          grep -q '泰国 曼谷' /tmp/rc5-demo.txt
          grep -q '验机结论' /tmp/rc5-demo.txt
          ! grep -q '中国联通' /tmp/rc5-demo.txt
          ! grep -q '中国电信' /tmp/rc5-demo.txt
          sha256sum experiments/p07-bench.sh | tee /tmp/rc5.sha256

      - name: 发布候选
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat(p07-bench): publish rc5 field candidate'
          git push origin HEAD:experiment/p07-oneshot-bench-v05
