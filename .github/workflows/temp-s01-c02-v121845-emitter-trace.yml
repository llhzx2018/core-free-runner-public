name: TEMP S01-C02 Ops 1.21.845 Final Audit Emitter Trace
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121845-emitter-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b2e54350130866ac569b379473773d281c6d04f2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace exact emitter and transformations
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '=== EXACT SENTENCE ==='
          grep -RInF --exclude-dir=.git '最终候选包无法打开，不能标记可上传。' ops || true
          echo '=== FINAL AUDIT / PACKAGE OPEN ==='
          grep -RInE --exclude-dir=.git 'candidate_audit|final_candidate_audit|final_decision|candidate.*package|package.*open|ZipArchive|unzip|PclZip' ops/includes ops/vf-ops.php | head -n 1200 || true
          echo '=== FAILURE APPENDS ==='
          grep -RInE --exclude-dir=.git "failures.*\[|\['failures'\]|array_merge.*failures|candidate_async_error|cf_upload_check_summary" ops/includes | head -n 1000 || true
          echo PASS_V121845_EMITTER_TRACE
