name: TEMP VFTEST P01 R22 R23 token package security synthetic HTTP and Unit
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/temp-vftest-p01-r22-r23-owner-update-boundary-20261124.yml]
permissions:
  contents: read
concurrency:
  group: vftest-p01-r22-r23-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-update-security:
    name: VFTEST-P01-R22-R23-ISOLATED
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/vftest-p01-r22-r23-owner-update-boundary-')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Temporary checkout exact P01 private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: e90915317ea13ce49723e54fd3a530efc42cedc3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-src
      - name: Confirm exact product source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "e90915317ea13ce49723e54fd3a530efc42cedc3"
          test "$(cat private-src/VERSION)" = "0.1.0-dev"
          echo P01_R22_R23_EXACT_SOURCE=PASS
      - name: PHP 8.4 with SQLite, ZIP and test dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip, sodium, dom, xml, fileinfo, curl, openssl
          tools: composer:v2
          coverage: none
      - name: Run existing R22 authorization and R23 package security regressions
        shell: bash
        working-directory: private-src
        run: |
          set -Eeuo pipefail
          set +x
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-r22-r23-composer.log" 2>&1; then
            echo P01_R22_R23_COMPOSER=FAIL; exit 1
          fi
          echo P01_R22_R23_COMPOSER=PASS
          export APP_ENV=testing DB_CONNECTION=sqlite DB_DATABASE=:memory:
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export CACHE_STORE=array SESSION_DRIVER=array QUEUE_CONNECTION=sync
          export VF_INSTALL_DEV_CLAIM_ENABLED=false
          set +e
          ./vendor/bin/phpunit --log-junit "$RUNNER_TEMP/p01-r22-r23-junit.xml" \
            tests/Feature/OwnerUpdatePageTest.php \
            tests/Unit/UpdateCredentialStoreTest.php \
            tests/Unit/NewOfficialPreviousFullReleaseVerifierTest.php \
            tests/Unit/NewOfficialGitHubReleaseAssetTransferTest.php \
            tests/Unit/NewAtomicReleaseAssetStagerTest.php \
            tests/Unit/NewAtomicPreparedPackageReceiptTest.php \
            tests/Unit/InstalledAtomicReadOnlyPreflightTest.php >"$RUNNER_TEMP/p01-r22-r23-phpunit.log" 2>&1
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/p01-r22-r23-junit.xml" <<'PY'
          import sys,pathlib,re,xml.etree.ElementTree as ET
          x=pathlib.Path(sys.argv[1])
          if not x.is_file():
              print("P01_R22_R23_JUNIT=MISSING"); sys.exit(1)
          cases=list(ET.parse(x).getroot().iter("testcase"))
          n=len(cases); a=sum(int(c.get("assertions","0")) for c in cases)
          skipped=sum(c.find("skipped") is not None for c in cases)
          failed=sum(c.find("failure") is not None or c.find("error") is not None for c in cases)
          print("P01_R22_R23_JUNIT="+",".join(map(str,(n,a,skipped,failed))))
          for c in cases:
              if c.find("failure") is not None or c.find("error") is not None:
                  print("P01_R22_R23_FAILED_METHOD="+re.sub(r"[^a-zA-Z0-9_]","",c.get("name",""))[:105])
          if n<35 or a<100 or skipped or failed: sys.exit(1)
          PY
          checked=$?
          if [ "$status" -ne 0 ] || [ "$checked" -ne 0 ]; then
            echo P01_R22_R23_SCOPE_MACHINE=FAIL
            exit 1
          fi
          echo P01_R22_R23_SCOPE_MACHINE=PASS
      - name: Scrub all private source, fixture databases and test logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP"/p01-r22-r23-*
          test ! -e private-src
          echo P01_R22_R23_PRIVATE_CLEANUP=PASS
