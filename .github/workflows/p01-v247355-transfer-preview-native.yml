name: P01 V247355 Transfer Preview Native Regression (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247355-transfer-preview-native.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2bd4e2b06848fff2a917566254cced7b519181c6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout exact unchanged product main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5873c14e6014c85c5edf3153de32af99a57e2bdf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
      - name: Prepare PHP 8.4 with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Verify candidate identity and PHP lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 2bd4e2b06848fff2a917566254cced7b519181c6
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.355
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.355
          grep -Fq "define('VF_VERSION', '2.47.355');" product/src/app/bootstrap.php
          php -l product/src/app/DataTransfer.php
          php -l product/src/app/Repository.php
          php -l product/tests/unit/transfer_preview_infile_duplicates_native.php
          php -l product/tests/unit/transfer_scope_shortlink_return_native.php
          echo P01_247355_PREVIEW_IDENTITY_AND_SYNTAX=PASS
      - name: Native SQLite import preview duplicate detection
        shell: bash
        run: |
          set -Eeuo pipefail
          php product/tests/unit/transfer_preview_infile_duplicates_native.php | tee /tmp/p01-247355-preview-native.txt
          grep -Fx P01_TRANSFER_PREVIEW_EXISTING_AND_INFILE_DUPLICATES=PASS /tmp/p01-247355-preview-native.txt
          grep -Fx P01_TRANSFER_PREVIEW_SHORT_TOKEN_SAFETY=PASS /tmp/p01-247355-preview-native.txt
          grep -Fx P01_TRANSFER_PREVIEW_READ_ONLY=PASS /tmp/p01-247355-preview-native.txt
          grep -Fx P01_TRANSFER_PREVIEW_REQUIRED_FIELDS_FAIL_CLOSED=PASS /tmp/p01-247355-preview-native.txt
          grep -Fx P01_TRANSFER_PREVIEW_SELF_LINK_FAIL_CLOSED=PASS /tmp/p01-247355-preview-native.txt
      - name: Canonical zero-debt all-unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash product/tests/canonical_release_regression.sh product stable --require-zero-debt | tee /tmp/p01-247355-canonical.txt
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-247355-canonical.txt
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-247355-canonical.txt
          echo P01_247355_CANONICAL=PASS
