name: S01-C02 1.21.1033 SEO refine candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_refine
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_VERSION: 1.21.1033
      TARGET_SHA: c66b0245b47cecac51bbbdc199b79868d76e24a1
      TARGET_TREE: 9fc5cdecf0620d8421d3bd547de7995257baa112
      BASE_SHA: 614923663a94598aa470c1e8d243d4399b9f0bd4
      BASE_VERSION: 1.21.1031
      BASE_ASSET_SHA256: d2b57e61993d319eb642ba154ae7c6944e4f5d6390ba14d9827a5afb5ca6ab18
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lane identity preflight
        run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec lane/spec.json --input .github/workflows/temp-s01-refine-1033.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c66b0245b47cecac51bbbdc199b79868d76e24a1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 614923663a94598aa470c1e8d243d4399b9f0bd4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium
      - name: Exact source identity and functional-boundary regression
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211033-seo-refine-functional-ux-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          for p in includes/wp-update includes/content-management/content-refinement-controller.php includes/seo-refine/seo-refine-service.php includes/admin-v13/views/seo_refine.php includes/views/admin-content-tabs/content-refinement.php includes/content-management/content-management-controller.php includes/content-management/content-management-policy.php includes/content-management/content-management-repository.php includes/content-management/content-management-service.php; do diff -rq "baseline/$p" "target/$p"; done
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/s01-1033-php-lint.txt
          echo PHP_83_SYNTAX=PASS
      - name: Browser dependencies and exact fixture proofs
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/refine-node && cd /tmp/refine-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/refine-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211032-content-library-browser-proof.js > evidence/content-library-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/content-library-browser.json
          node target/tests/s01-c02-1211033-seo-refine-browser-proof.js > evidence/refine-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/refine-browser.json
      - name: Exact package, current channel and package security
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" candidate.zip
          gh release download "v$BASE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-ops_V$BASE_VERSION.zip" --dir previous
          cp "previous/vf-tools-ops_V$BASE_VERSION.zip" baseline.zip
          test "$(sha256sum baseline.zip | cut -d' ' -f1)" = "$BASE_ASSET_SHA256"
          gh api -H 'Accept: application/vnd.github.raw+json' repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main > channel.json
          jq -e --arg v "$BASE_VERSION" '.enabled==true and .target_version==$v' channel.json >/dev/null
          cp package.json evidence/package.json
          python3 - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('candidate.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  assert n.startswith('vf-ops/') and '..' not in n.split('/'),n
                  assert not re.search(r'(^|/)(?:\.env|\.git|tests?|docs?|evidence|private|backups?)(/|$)',n,re.I),n
                  assert not re.search(rb'(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)',z.read(n)),n
          print('PACKAGE_CRC_PRIVACY_SECRET=PASS')
          PY
      - name: Native update, actual WordPress interaction and source rollback
        env:
          NODE_PATH: /tmp/refine-node/node_modules
        run: bash lane/refine-native.sh
      - name: Public-safe exact candidate proof
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          p=json.loads(Path('package.json').read_text())
          rows=[]
          for item in subprocess.check_output(['git','-C','target','ls-files','-z']).split(b'\0'):
              if not item: continue
              name=item.decode();f=Path('target')/name
              if f.is_file(): rows.append((name,hashlib.sha256(f.read_bytes()).hexdigest()))
          h=hashlib.sha256()
          for name,digest in rows:h.update((name+'\0'+digest+'\n').encode())
          proof={
            'schema':'vf-s01-refine-proof/v1','status':'PASS',
            'source_repository':os.environ['TARGET_REPO'],'source_sha':os.environ['TARGET_SHA'],'source_tree':os.environ['TARGET_TREE'],
            'source_manifest_sha256':h.hexdigest(),'version':os.environ['TARGET_VERSION'],'base_version':os.environ['BASE_VERSION'],
            'package':p,'php_83_syntax':'PASS','functional_boundary_contract':'PASS','content_library_browser':'PASS',
            'refine_fixture_browser':'PASS','native_wordpress_interaction':'PASS','native_upgrade':'PASS','native_rollback':'PASS',
            'owner_product_pass':False,'production':'NOT_TOUCHED'
          }
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          PY
      - name: Evidence and exact tested package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1033-seo-refine-candidate
          path: |
            candidate.zip
            package.json
            evidence/content-library-browser.json
            evidence/refine-browser.json
            evidence/native-browser.json
            evidence/FINAL_EVIDENCE.json
          retention-days: 30
