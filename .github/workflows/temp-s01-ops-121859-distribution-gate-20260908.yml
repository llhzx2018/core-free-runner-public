name: temp-s01-ops-121859-distribution-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121859-distribution-gate-20260908.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BASE: 60d2094dd92dea4f1b14ae78bcec18940e15fc64
      CORE_CANDIDATE: d08f0648631160e22c7f74af62d4bf595e292d41
      C01_BLOB: fac7996168ae4b5e2d34bcc619a20981b9610271
      C03_BLOB: 5d27495f15ceb92581eb1cd227770b2d02158d4b
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      OPS_TAG: v1.21.859
      OPS_ASSET: vf-tools-ops_V1.21.859.zip
      OPS_BYTES: '3362261'
      OPS_ASSET_SHA256: 2e4e0c1f74723b5ac5a634aba1833b4827f1f3f261f2de6ef2c72625fc2891df
      OPS_RUNTIME_FILES: '934'
      OPS_RUNTIME_FP: 1b3056d4127919c2156be9f7fbb57f9b5e5c98e3458e216398db1b0a44a3ab34
    steps:
      - name: Gate exact C02 distribution candidate
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'DISTRIBUTION_GATE_ONLY=YES CORE_MAIN_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          test "$(gh api repos/$CORE_REPO/branches/main --jq '.commit.sha')" = "$CORE_BASE"
          rm -rf /tmp/core-updates && git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${CORE_REPO}.git" /tmp/core-updates
          git -C /tmp/core-updates checkout -q "$CORE_CANDIDATE"
          test "$(git -C /tmp/core-updates rev-parse HEAD)" = "$CORE_CANDIDATE"
          changed="$(git -C /tmp/core-updates diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")"
          test "$changed" = 'projects/S01-C02.json'
          test "$(git -C /tmp/core-updates rev-parse "$CORE_CANDIDATE:projects/S01-C01.json")" = "$C01_BLOB"
          test "$(git -C /tmp/core-updates rev-parse "$CORE_CANDIDATE:projects/S01-C03.json")" = "$C03_BLOB"
          jq -e '
            .component_id=="S01-C02" and
            .package_slug=="vf-ops" and
            .plugin_file=="vf-ops/vf-ops.php" and
            .physical_locator=="vf-ops/vf-ops.php" and
            .locator_cutover==false and
            .target_version=="1.21.859" and
            .release_tag=="v1.21.859" and
            .asset_name=="vf-tools-ops_V1.21.859.zip" and
            .asset_bytes==3362261 and
            .asset_sha256=="2e4e0c1f74723b5ac5a634aba1833b4827f1f3f261f2de6ef2c72625fc2891df" and
            .schema_from=="6.0.0" and .schema_to=="6.0.0" and
            .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and
            .runtime_files==934 and .runtime_file_count==934 and
            .runtime_fingerprint=="1b3056d4127919c2156be9f7fbb57f9b5e5c98e3458e216398db1b0a44a3ab34" and
            .runtime_fingerprint_sha256=="1b3056d4127919c2156be9f7fbb57f9b5e5c98e3458e216398db1b0a44a3ab34" and
            (.from_versions|index("1.21.858")!=null)
          ' /tmp/core-updates/projects/S01-C02.json >/dev/null
          test "$(gh api repos/$OPS_REPO/git/ref/tags/$OPS_TAG --jq '.object.sha')" = "$OPS_SHA"
          rel="$(gh api repos/$OPS_REPO/releases/tags/$OPS_TAG)"
          test "$(jq -r '.draft' <<<"$rel")" = false
          test "$(jq -r '.prerelease' <<<"$rel")" = false
          test "$(jq -r --arg a "$OPS_ASSET" '.assets[]|select(.name==$a)|.size' <<<"$rel")" = "$OPS_BYTES"
          test "$(jq -r --arg a "$OPS_ASSET" '.assets[]|select(.name==$a)|.digest' <<<"$rel")" = "sha256:$OPS_ASSET_SHA256"
          grep -F 'Delivered Runtime Authority 34211976215 PASS' /tmp/core-updates/projects/S01-C02.json >/dev/null
          echo 'C01_UNCHANGED=PASS C03_UNCHANGED=PASS'
          echo 'OPS_RELEASE_ID=384607276 OPS_ASSET_ID=550243201'
          echo 'PASS_S01_C02_121859_DISTRIBUTION_GATE'
