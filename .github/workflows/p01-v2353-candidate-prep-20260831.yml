name: P01 V2.35.3 Candidate Prep
on:
  push:
    branches: [release/p01-v2353-candidate-prep-20260831]
    paths: [.github/workflows/p01-v2353-candidate-prep-20260831.yml]
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.35.3-candidate-20260831
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact base and metadata update
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = c9ca6d6f0052bd1a0c61d07fc6b1042708e74b93
          test "$(git rev-parse origin/develop)" = c9ca6d6f0052bd1a0c61d07fc6b1042708e74b93
          test "$(git rev-parse origin/main)" = 3c9239be8bba34637411110f7fdb43f6e494c880
          test "$(cat VERSION)" = 2.35.2
          test "$(cat src/VERSION.txt)" = 2.35.2
          grep -F "define('VF_VERSION', '2.35.2');" src/app/bootstrap.php >/dev/null
          printf '2.35.3\n' > VERSION
          printf '2.35.3\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text()
          old="define('VF_VERSION', '2.35.2');"
          new="define('VF_VERSION', '2.35.3');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          p=Path('CHANGELOG.md')
          s=p.read_text()
          entry="""## V2.35.3 — 2026-08-31\n\n- Production terminal-state hotfix: when Current >= Latest, the install control and update steps remain visually hidden even if legacy page-level display rules are present.\n- The visible Admin Shell version and asset-version metadata reconcile immediately with the update result, so the page no longer shows a stale footer after a successful Atomic install.\n- Successful installs now schedule one authoritative hard refresh; the legacy observer remains fallback-only and shares the same reload lock, eliminating double-refresh races.\n- Genuine prepare/download/SHA/Atomic failures remain failures. Schema remains `2026082901`; no migration and no business/data/five-domain behavior changes.\n- Hotfix Machine Gate `33358556905` PASS against source `818091eb5d9576e8278a6e7282cfd4d1b6a32918`; Owner Production remains V2.35.2 until the formal V2.35.3 online-update chain passes.\n\n"""
          assert not s.startswith('## V2.35.3')
          p.write_text(entry+s)
          PY
          test "$(git diff --name-only | sort)" = $'CHANGELOG.md\nVERSION\nsrc/VERSION.txt\nsrc/app/bootstrap.php'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.35.3 candidate'
          git push origin HEAD:release/v2.35.3-candidate-20260831
          echo P01_V2353_CANDIDATE_PREP=PASS
