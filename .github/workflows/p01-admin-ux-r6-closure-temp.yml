name: p01-admin-ux-r6-closure-temp

on:
  push:
    branches:
      - run/p01-admin-ux-r6-closure

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact P01 engineering source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: afcc7097d490d8b0252aad898dc3bda92f39ebbe
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "afcc7097d490d8b0252aad898dc3bda92f39ebbe"
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.28"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/admin_navigation_category_route_runtime_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/admin_resource_health_closure_contract.php
          php tests/unit/admin_data_closure_contract.php
          php tests/unit/admin_system_closure_contract.php
          php tests/unit/admin_settings_focus_contract.php
          php tests/unit/admin_overview_actionable_health_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_resource_browse_edit_r5_contract.php
          php tests/unit/update_notice_no_obstruction_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/global_page_size_authority_contract.php
          echo P01_ADMIN_UX_R6_FOCUSED_CONTRACTS=PASS

      - name: Fresh install and authenticated admin smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-admin-r6
          cp -a vf-start/src /tmp/p01-admin-r6
          cd /tmp/p01-admin-r6
          php -S 127.0.0.1:18111 -t . >/tmp/p01-admin-r6-server.log 2>&1 &
          echo $! >/tmp/p01-admin-r6.pid
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies http://127.0.0.1:18111/setup.php -o /tmp/p01-admin-r6-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-admin-r6-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies -X POST http://127.0.0.1:18111/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF Admin R6' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            -o /tmp/p01-admin-r6-setup-post.html
          php cli/verify.php | tee /tmp/p01-admin-r6-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-admin-r6-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-admin-r6-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-admin-r6-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-admin-r6-baseline.txt

          php -r 'require "app/bootstrap.php"; $r=new VfRepository(vf_db()); $cid=$r->createCategory(["name"=>"Runner 分类"]); $saved=$r->saveLink(null,["surface"=>"start","category_id"=>$cid,"title"=>"Runner URL","url"=>"https://example.com"]); $id=(int)$saved["id"]; $db=vf_db(); $now=gmdate("c"); $s=$db->prepare("INSERT INTO link_health(link_id,status,http_status,last_checked_at,consecutive_failures,manual_confirmed,updated_at,ignore_auto) VALUES(?,\"confirmed\",404,?,2,1,?,0)"); $s->execute([$id,$now,$now]);'

      - name: Authenticated route and task smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=http://127.0.0.1:18111
          python3 - <<'PY' >/tmp/p01-admin-r6-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies \
            -H 'Content-Type: application/json' -X POST "$BASE/api.php?action=login" \
            --data-binary @/tmp/p01-admin-r6-login.json -o /tmp/p01-admin-r6-login-result.json
          grep -F '"ok":true' /tmp/p01-admin-r6-login-result.json >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/links-admin.php" -o /tmp/p01-admin-r6-links.html
          grep -F '<h1>导航与分类</h1>' /tmp/p01-admin-r6-links.html >/dev/null
          grep -F 'id="stateFilter" aria-label="网址状态" hidden' /tmp/p01-admin-r6-links.html >/dev/null
          ! grep -F 'data-bulk="archive"' /tmp/p01-admin-r6-links.html >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/health.php" -o /tmp/p01-admin-r6-health.html
          grep -F '<h1>网址健康</h1>' /tmp/p01-admin-r6-health.html >/dev/null
          grep -F '>网址健康</a>' /tmp/p01-admin-r6-health.html >/dev/null
          ! grep -F 'data-batch="archive"' /tmp/p01-admin-r6-health.html >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/transfer.php" -o /tmp/p01-admin-r6-transfer.html
          grep -F 'vf-transfer-advanced-entry' /tmp/p01-admin-r6-transfer.html >/dev/null
          grep -F '跨资源批量整理（低频）' /tmp/p01-admin-r6-transfer.html >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/system-health.php" -o /tmp/p01-admin-r6-system.html
          grep -F '请到“RSS 与扩展”' /tmp/p01-admin-r6-system.html >/dev/null
          ! grep -F '请到“RSS 订阅”' /tmp/p01-admin-r6-system.html >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/settings.php?section=display" -o /tmp/p01-admin-r6-settings.html
          grep -F 'class="vf-admin-subnav vf-settings-tabs"' /tmp/p01-admin-r6-settings.html >/dev/null
          grep -F 'href="settings.php?section=display"' /tmp/p01-admin-r6-settings.html >/dev/null
          grep -F 'id="display" data-panel="display"' /tmp/p01-admin-r6-settings.html >/dev/null
          grep -F '恢复显示推荐值' /tmp/p01-admin-r6-settings.html >/dev/null

          curl -fsS -c /tmp/p01-admin-r6.cookies -b /tmp/p01-admin-r6.cookies "$BASE/manage.php" -o /tmp/p01-admin-r6-manage.html
          grep -F '<h1>概览</h1>' /tmp/p01-admin-r6-manage.html >/dev/null
          grep -F '网址健康 1 条待处理' /tmp/p01-admin-r6-manage.html >/dev/null
          grep -F 'href="health.php?status=attention"' /tmp/p01-admin-r6-manage.html >/dev/null
          ! grep -F '开始整理</a>' /tmp/p01-admin-r6-manage.html >/dev/null

          echo P01_ADMIN_UX_R6_AUTH_HTTP=PASS

      - name: Verdict
        run: |
          echo P01_ADMIN_UX_R6_EXACT_SOURCE_GATE=PASS
          echo EXACT_SOURCE=afcc7097d490d8b0252aad898dc3bda92f39ebbe
          echo VERSION=2.47.28
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-admin-r6.pid ]; then kill "$(cat /tmp/p01-admin-r6.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-admin-r6 /tmp/p01-admin-r6-*
