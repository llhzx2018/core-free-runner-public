name: P01 hls.js pinned SRI and safe-stream probe
on:
  push:
    branches: [task/p01-hls-sri-probe-20261028]
    paths: ['.github/workflows/p01-hls-sri-probe-20261028.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Confirm pinned open-source hls.js bytes and SRI
        shell: bash
        run: |
          set -euo pipefail
          url='https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.light.min.js'
          curl --proto '=https' --tlsv1.2 -fsSL --max-time 25 "$url" -o /tmp/vf-hls.min.js
          test "$(wc -c < /tmp/vf-hls.min.js)" -gt 250000
          node --check /tmp/vf-hls.min.js
          python3 - <<'PY'
          import base64,hashlib
          data=open('/tmp/vf-hls.min.js','rb').read()
          print('VF_HLS_VERSION=1.7.3')
          print('VF_HLS_BYTES='+str(len(data)))
          print('VF_HLS_SHA384_SRI=sha384-'+base64.b64encode(hashlib.sha384(data).digest()).decode())
          print('VF_HLS_SHA256='+hashlib.sha256(data).hexdigest())
          PY
          rm -f /tmp/vf-hls.min.js
