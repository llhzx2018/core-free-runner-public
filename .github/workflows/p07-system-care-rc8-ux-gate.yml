name: P07 System Care RC8 UX Gate

on:
  push:
    branches: [gate/p07-system-care-rc8-ux-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc8-ux-gate.yml'

permissions:
  contents: read

jobs:
  rc8-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact RC8 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 0ac7e599b86df5180064c03bd72a66bf0a32170b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "0ac7e599b86df5180064c03bd72a66bf0a32170b"
          test "$(cat product/modules/system-care/VERSION)" = "0.1.0-rc8"
          echo P07_SYSTEM_CARE_RC8_EXACT_SOURCE=PASS

      - name: Static gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/static_gate.sh

      - name: Functional gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          bash modules/system-care/tests/functional_gate.sh

      - name: UX contract markers
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product/modules/system-care
          grep -Fq '服务器      %b需处理%b · 按 1 查看原因' vf-system-care.sh
          grep -Fq '网站安全    %b需处理%b' vf-system-care.sh
          grep -Fq '自动检查    %b已开启%b' vf-system-care.sh
          grep -Fq '下一步     选择 2 查看异常详情' intrusion-evidence.sh
          grep -Fq '3. 我确认当前网站正常，更新参考状态' intrusion-evidence.sh
          grep -Fq 'refresh-cache) refresh_cache' intrusion-evidence.sh
          echo P07_SYSTEM_CARE_RC8_UX_CONTRACT=PASS

      - name: Final marker
        shell: bash
        run: echo P07_SYSTEM_CARE_RC8_UX_MACHINE_GATE=PASS
