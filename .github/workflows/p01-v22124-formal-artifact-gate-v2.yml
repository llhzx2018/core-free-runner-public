name: P01 V2.21.24 Formal Artifact Gate V2

on:
  pull_request:
    paths:
      - 'requests/p01-v22124-formal-artifact-gate-v2-*.txt'

permissions:
  contents: read

jobs:
  gate:
    if: startsWith(github.head_ref, 'agent/p01-v22124-formal-artifact-gate-v2-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      CANDIDATE_BRANCH: fix/p01-v22124-ux-consistency-20260820
      CANDIDATE: 7363949d18f44652458ec7ef0f7c67c9cae1bbb4
      CANDIDATE_TREE: 8e3c9e82da6598f07de97b6d16cf78ad0c0f6c25
      SOURCE_TAG: v2.21.22
      SOURCE_COMMIT: 84ed48f5208f23e63e4e92c98695d53af6f278a7
      SOURCE_TREE: 49bc9b9d040f17fdbb370a9167e3e75cf38b8b4f
      VERSION: 2.21.24
      SOURCE_VERSION: 2.21.22
      SCHEMA: '2026080902'
      OUT: /tmp/p01-v22124-artifact-gate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Clone exact sources
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch "$CANDIDATE_BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git clone -q --depth 1 --branch "$SOURCE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" production
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          echo 'EXACT_SOURCE_READBACK=PASS'
      - name: Prepare corrected proven gate
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git runner-old
          mkdir -p runner/scripts
          cp runner-old/scripts/p01-build-release.py runner/scripts/
          cp runner-old/scripts/p01-build-release-v2.py runner/scripts/
          cp runner-old/scripts/p01-build-maintenance-candidate-22121.py runner/scripts/p01-build-maintenance-candidate-22124.py
          cp runner-old/scripts/p01-v22121-formal-artifact-gate.sh runner/scripts/p01-v22124-formal-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          b=Path('runner/scripts/p01-build-maintenance-candidate-22124.py')
          s=b.read_text(encoding='utf-8')
          s=s.replace("VERSION = '2.21.21'", "VERSION = '2.21.24'", 1)
          s=s.replace("SOURCE_VERSION = '2.21.20'", "SOURCE_VERSION = '2.21.22'", 1)
          replacement="""EXPECTED_ADDED = set()
          EXPECTED_RUNTIME_DELTA = {
              'VERSION.txt',
              'app/AdminShell.php',
              'app/Repository.php',
              'app/bootstrap.php',
              'assets/admin-shell.css',
              'assets/duplicates.js',
              'assets/frontend-legacy.css',
              'assets/links-admin.js',
              'duplicates.php',
              'index.php',
              'links-admin.php',
          }
          """
          s,n=re.subn(r"EXPECTED_ADDED = \{.*?\n\}\nEXPECTED_RUNTIME_DELTA = \{.*?\n\}\n",replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('builder expected-set anchor mismatch')
          s=s.replace('p01_base_22121','p01_base_22124').replace('p01_v2_atomic_22121','p01_v2_atomic_22124')
          b.write_text(s,encoding='utf-8',newline='\n')

          g=Path('runner/scripts/p01-v22124-formal-artifact-gate.sh')
          t=g.read_text(encoding='utf-8')
          t=t.replace('22121','22124')
          t=t.replace('2.21.21','2.21.24')
          t=t.replace('2.21.20','2.21.22')
          t=t.replace('OUT="$RUNNER_TEMP/p01-v22124-artifact-gate"','OUT="/tmp/p01-v22124-artifact-gate"',1)
          old='.runtime_added==["assets/data-recovery.js","assets/update-reload.js"] and (.runtime_delta|length)==23'
          new='.runtime_added==[] and (.runtime_delta|length)==11'
          if old not in t: raise SystemExit('runtime delta anchor mismatch')
          t=t.replace(old,new,1)
          t=t.replace('(.target_files==(.source_files+2))','(.target_files==.source_files)',1)
          anchor='test -f "$UPGRADE/assets/update-reload.js"'
          if anchor not in t: raise SystemExit('upgrade asset anchor mismatch')
          t=t.replace(anchor,anchor+'\ntest -f "$UPGRADE/assets/admin-consolidation.css"\ntest -f "$UPGRADE/assets/admin-consolidation.js"\ntest -f "$UPGRADE/assets/favorite-affordance.css"',1)
          full="for required in ['index.php','setup.php','VERSION.txt','app/bootstrap.php','assets/data-recovery.js','assets/update-reload.js']:"
          full2="for required in ['index.php','setup.php','VERSION.txt','app/bootstrap.php','assets/data-recovery.js','assets/update-reload.js','assets/admin-consolidation.css','assets/admin-consolidation.js','assets/favorite-affordance.css']:"
          if full not in t: raise SystemExit('FULL required anchor mismatch')
          t=t.replace(full,full2,1)
          grep_old="grep -q 'app/AdminShell.php:sha' \"$RUNNER_TEMP/p01-runtime-tamper.out\""
          jq_new="jq -e '.ok==false and (.errors|index(\"app/AdminShell.php:sha\")!=null)' \"$RUNNER_TEMP/p01-runtime-tamper.out\" >/dev/null"
          if grep_old not in t: raise SystemExit('tamper assertion anchor mismatch')
          t=t.replace(grep_old,jq_new,1)
          t=t.replace('$RUNNER_TEMP/p01-full-owner.mjs','$PWD/p01-full-owner.mjs')
          g.write_text(t,encoding='utf-8',newline='\n')
          PY
          chmod +x runner/scripts/p01-v22124-formal-artifact-gate.sh
          grep -Fq 'OUT="/tmp/p01-v22124-artifact-gate"' runner/scripts/p01-v22124-formal-artifact-gate.sh
          grep -Fq 'index("app/AdminShell.php:sha")' runner/scripts/p01-v22124-formal-artifact-gate.sh
          grep -Fq '$PWD/p01-full-owner.mjs' runner/scripts/p01-v22124-formal-artifact-gate.sh
          echo 'CORRECTED_GATE_PREP=PASS'
      - name: Run full formal artifact gate
        shell: bash
        env:
          CANDIDATE: ${{ env.CANDIDATE }}
          CANDIDATE_TREE: ${{ env.CANDIDATE_TREE }}
          PRODUCTION: ${{ env.SOURCE_COMMIT }}
          VERSION: ${{ env.VERSION }}
          SOURCE_VERSION: ${{ env.SOURCE_VERSION }}
          SCHEMA: ${{ env.SCHEMA }}
        run: |
          set -Eeuo pipefail
          bash runner/scripts/p01-v22124-formal-artifact-gate.sh | tee /tmp/p01-v22124-formal-artifact-gate.log
          UPDATE="$OUT/VF_Start_V2.21.24_UPDATE.zip"
          FULL="$OUT/VF_Start_V2.21.24_FULL.zip"
          REPAIR="$OUT/repair-v2.21.24.php"
          test -f "$UPDATE" && test -f "$FULL" && test -f "$REPAIR"
          jq -n \
            --arg candidate "$CANDIDATE" --arg tree "$CANDIDATE_TREE" \
            --arg source "$SOURCE_COMMIT" --arg source_tree "$SOURCE_TREE" \
            --arg update_sha "$(sha256sum "$UPDATE"|awk '{print $1}')" \
            --arg full_sha "$(sha256sum "$FULL"|awk '{print $1}')" \
            --arg repair_sha "$(sha256sum "$REPAIR"|awk '{print $1}')" \
            --argjson update_bytes "$(stat -c %s "$UPDATE")" \
            --argjson full_bytes "$(stat -c %s "$FULL")" \
            --argjson repair_bytes "$(stat -c %s "$REPAIR")" \
            '{project_id:"P01",gate:"V2.21.24_FORMAL_ARTIFACT_GATE_V2",pass:true,candidate:$candidate,candidate_tree:$tree,source:$source,source_tree:$source_tree,version:"2.21.24",source_version:"2.21.22",schema:"2026080902",assets:{update:{sha256:$update_sha,bytes:$update_bytes},full:{sha256:$full_sha,bytes:$full_bytes},repair:{sha256:$repair_sha,bytes:$repair_bytes}},production_changed:false}' > /tmp/p01-v22124-gate-result.json
          echo 'P01_V2.21.24_FORMAL_ARTIFACT_GATE_V2=PASS'

      - name: V2.21.24 reported bug browser and data regression
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v22124-upgrade
          test -d "$ROOT"
          php <<'PHP'
          <?php
          require '/tmp/p01-v22124-upgrade/app/bootstrap.php';
          $repo = new VfRepository(vf_db());
          if (!is_dir(VF_BRAND_DIR) && !mkdir(VF_BRAND_DIR, 0750, true) && !is_dir(VF_BRAND_DIR)) {
              throw new RuntimeException('Cannot create brand directory.');
          }
          $logo = 'p01-v22124-gate-logo.svg';
          file_put_contents(VF_BRAND_DIR . '/' . $logo, '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="16" fill="#0f766e"/><path fill="#fff" d="M18 22h12l10 25 10-25h12L45 60H35z"/></svg>');
          $branding = $repo->setBrandAsset('logo', $logo);
          if (($branding['logoUrl'] ?? '') === '') throw new RuntimeException('Logo fixture not active.');
          $category = $repo->createCategory(['name'=>'P01 V22124 Regression','description'=>'release gate','is_private'=>0,'sort_order'=>24]);
          $favorite = (int)$repo->saveLink(null, ['category_id'=>$category,'title'=>'Favorite stays second','url'=>'https://example.com/p01-v22124-duplicate','description'=>'favorite ordering sentinel','sort_order'=>10,'force_duplicate'=>true])['id'];
          $leading = (int)$repo->saveLink(null, ['category_id'=>$category,'title'=>'Category order stays first','url'=>'https://example.com/p01-v22124-duplicate','description'=>'category ordering sentinel','sort_order'=>20,'force_duplicate'=>true])['id'];
          $repo->toggleFavorite($favorite, true);
          $stmt = vf_db()->prepare("SELECT id,category_id,sort_order,is_favorite FROM links WHERE category_id=? AND lifecycle_state='active' ORDER BY sort_order DESC,legacy_position ASC,id ASC");
          $stmt->execute([$category]);
          $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);
          if (array_map(static fn($row)=>(int)$row['id'],$rows) !== [$leading,$favorite]) throw new RuntimeException('Favorite changed category order.');
          if ((int)$rows[1]['is_favorite'] !== 1 || (int)$rows[1]['category_id'] !== $category) throw new RuntimeException('Favorite/category invariant failed.');
          file_put_contents('/tmp/p01-v22124-fixture.json', json_encode(['category'=>$category,'favorite'=>$favorite,'leading'=>$leading,'logoUrl'=>$branding['logoUrl']], JSON_UNESCAPED_SLASHES));
          echo "FAVORITE_CATEGORY_ORDER_DATA=PASS\n";
          PHP

          php -S 127.0.0.1:18180 -t "$ROOT" > "$RUNNER_TEMP/p01-v22124-targeted-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18180/ >/dev/null; then break; fi
            sleep 1
          done
          cat > "$PWD/p01-v22124-targeted.mjs" <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const fixture=JSON.parse(fs.readFileSync('/tmp/p01-v22124-fixture.json','utf8'));
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const base='http://127.0.0.1:18180/';
          try {
            await page.goto(base,{waitUntil:'networkidle'});
            await page.click('#loginButton');
            await page.fill('[name=password]','FormalUpgrade-P01-22120!Strong');
            await page.click('#loginSubmit');
            await page.waitForFunction(()=>document.body.classList.contains('is-admin') && window.state && state.loadedOnce);
            await page.waitForSelector('#brandMark img',{state:'attached'});
            const frontLogo=await page.locator('#brandMark img').getAttribute('src');
            if(frontLogo!==fixture.logoUrl)throw new Error('FRONT_LOGO '+frontLogo+' != '+fixture.logoUrl);

            await page.evaluate(id=>setView('category',id,false,{privacyScope:'public'}),fixture.category);
            await page.waitForFunction(id=>state.mode==='category' && Number(state.selected)===Number(id),fixture.category);
            const categoryOrder=await page.evaluate(()=>categoryLinks().map(item=>item.title));
            if(JSON.stringify(categoryOrder.slice(0,2))!==JSON.stringify(['Category order stays first','Favorite stays second']))throw new Error('CATEGORY_ORDER '+JSON.stringify(categoryOrder));

            await page.evaluate(()=>toastAction('网址已移入回收站','撤销',async()=>{},'success',10000));
            const toastPlacement=await page.locator('#toastRoot').evaluate(node=>{const box=node.getBoundingClientRect(),style=getComputedStyle(node);return{top:box.top,right:innerWidth-box.right,cssTop:style.top,cssBottom:style.bottom};});
            if(toastPlacement.top>140 || toastPlacement.right>40 || toastPlacement.cssBottom!=='auto')throw new Error('TOAST_PLACEMENT '+JSON.stringify(toastPlacement));
            await page.locator('#toastRoot .toast').first().evaluate(node=>node.remove());

            await page.goto(base+'links-admin.php',{waitUntil:'networkidle'});
            await page.waitForSelector('.vf-rail-mark img',{state:'attached'});
            const adminLogo=await page.locator('.vf-rail-mark img').getAttribute('src');
            if(adminLogo!==frontLogo)throw new Error('LOGO_SYNC '+frontLogo+' != '+adminLogo);

            await page.route('**/api.php?action=duplicate_merge_preview',async route=>{await new Promise(resolve=>setTimeout(resolve,900));await route.continue();});
            await page.goto(base+'duplicates.php',{waitUntil:'networkidle'});
            const merge=page.locator('[data-merge]').first();
            await merge.waitFor({state:'visible'});
            await merge.click();
            await page.waitForSelector('#modal:not([hidden]) [role="status"]');
            if(!(await merge.isDisabled()) || await merge.getAttribute('aria-busy')!=='true')throw new Error('DUPLICATE_BUTTON_NO_IMMEDIATE_FEEDBACK');
            await page.waitForSelector('#doMerge',{state:'visible'});
            console.log('DELETE_TOAST_PLACEMENT=PASS');
            console.log('FAVORITE_CATEGORY_ORDER_BROWSER=PASS');
            console.log('DUPLICATE_BUTTON_INTERACTION=PASS');
            console.log('FRONT_ADMIN_LOGO_SYNC=PASS');
          } finally {
            await browser.close();
          }
          JS
          node "$PWD/p01-v22124-targeted.mjs" | tee "$RUNNER_TEMP/p01-v22124-targeted.log"
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT
          echo 'P01_V2.21.24_REPORTED_BUG_REGRESSION=PASS'

      - name: Upload exact gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v22124-formal-artifact-gate-v2-${{ github.run_id }}
          path: |
            /tmp/p01-v22124-artifact-gate/VF_Start_V2.21.24_UPDATE.zip
            /tmp/p01-v22124-artifact-gate/VF_Start_V2.21.24_FULL.zip
            /tmp/p01-v22124-artifact-gate/repair-v2.21.24.php
            /tmp/p01-v22124-artifact-gate/SHA256SUMS.txt
            /tmp/p01-v22124-gate-result.json
            /tmp/p01-v22124-formal-artifact-gate.log
            /tmp/p01-v22124-fixture.json
            ${{ runner.temp }}/p01-v22124-targeted.log
            ${{ runner.temp }}/p01-v22124-targeted-server.log
          if-no-files-found: warn
