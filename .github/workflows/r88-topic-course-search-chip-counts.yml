name: R88 Focused Topic Course Search Chip Count Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r88-topic-course-search-chip-counts.yml'

permissions:
  contents: read

jobs:
  r88-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 1dc2b95bbfc3e8691569b2be528b05f1f1a5f644
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1dc2b95bbfc3e8691569b2be528b05f1f1a5f644
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/topic_course_search_chip_count_contract.php
          php tests/unit/topic_course_search_chip_count_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          php tests/unit/project_chip_context_count_contract.php
          php tests/unit/channel_type_context_count_contract.php
          echo R88_TOPIC_COURSE_SEARCH_CHIP_COUNT_PASS
          echo R88_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
