name: P08 v015 immutable official-issued channel candidate exact original tests
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/p08-v015-channel-candidate.yml]
permissions:
  contents: read
jobs:
  exact-channel-source-manifest:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-official-channel-candidate-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P08-only core-updates distribution candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: a8ba085f81b0a25b2025a6fdf3830244d86574cd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Read exact issued v014 publication timestamp and classify manifest gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          stamp="$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.15 --jq '.published_at')"
          python3 - "$stamp" <<'PY'
          from datetime import datetime
          import sys
          stamp=sys.argv[1]
          assert stamp.endswith('Z') and datetime.fromisoformat(stamp.replace('Z','+00:00')).tzinfo is not None
          print('P08_V015_OFFICIAL_RELEASE_PUBLISHED_AT='+stamp)
          PY
          (cd updates && python3 scripts/check_manifest_contract.py > "$RUNNER_TEMP/p08-v015-contract-preflight.json") || true
          python3 - "$RUNNER_TEMP/p08-v015-contract-preflight.json" <<'PY'
          import json,sys
          from pathlib import Path
          obj=json.loads(Path(sys.argv[1]).read_text())
          entry=next((x for x in obj.get('results',[]) if x['path']=='projects/P08-ADOPS.json'),{})
          print('P08_V015_CHANNEL_SCHEMA_STATUS='+obj.get('status','UNVERIFIED'))
          for code in entry.get('failures',[]):print('P08_V015_CHANNEL_SCHEMA_FAILURE='+code)
          PY
      - name: Exact candidate manifest and original Update Core CI tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C updates rev-parse HEAD)" = a8ba085f81b0a25b2025a6fdf3830244d86574cd
          cd updates
          python3 scripts/check_manifest_contract.py > "$RUNNER_TEMP/channel-contract-output.json"
          python3 - "$RUNNER_TEMP/channel-contract-output.json" <<'PY'
          import json,sys
          from pathlib import Path
          report=json.loads(Path(sys.argv[1]).read_text())
          assert report['status']=='PASS', 'GLOBAL_MANIFEST_SCHEMA_FAILED'
          a=[x for x in report['results'] if x['path']=='projects/P08-ADOPS.json']
          assert len(a)==1 and a[0]['failures']==[], 'P08_SCHEMA_FAILED'
          print('P08_V015_ALL_CHANNELS_SCHEMA_AND_P08_LEGACY_COMPAT=PASS')
          PY
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l > "$RUNNER_TEMP/p08-php-lint.txt"
          php update-core/php/tests/run.php
          python3 - <<'PY'
          from pathlib import Path
          import json
          j=json.loads(Path('projects/P08-ADOPS.json').read_text())
          assert j['target_version']=='0.1.15'
          assert j['release_tag']=='v0.1.15'
          assert j['release_id']==453401976
          assert j['released_at']=='2026-11-21T03:06:38Z'
          assert j['target_sha']=='369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e'
          assert j['from_versions']==['0.1.14']
          assert j['source_sha']=='6fae792864a594465e4b3224bd6d73abde976f12'
          assert j['source_full_manifest_sha256']=='efcfa190b08e11e2ff93c9ade976e86355f933fb22417c9668e4cb1f840cf09b'
          assert j['source_full_manifest_sha256']!='c7ea39bba377507c335031801a7f1d193de0ddd04715547abdb067928ef7cd5d'
          assert j['schema_from']==j['schema_to']=='1.1'
          assert j['production_auto_apply'] is False
          assert j['owner_bridge_activation']=='NOT_REQUIRED_V014_VERSIONED_SITE'
          assert j['backup_required'] is True and j['rollback_supported'] is True
          assert j['signature_required'] is False
          assert j['asset_id']==774232507 and j['full_asset_id']==774232524
          assert j['asset_bytes']==8356933 and j['full_asset_bytes']==8368739
          assert j['asset_sha256']=='e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f'
          assert j['full_asset_sha256']=='538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73'
          print('P08_V015_EXACT_V014_ONLY_CHANNEL_SAFETY=PASS')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify actual remote official v015 release/tag/asset IDs and immutable v014
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.15 --jq '.object.sha')" = 369fcb0aa8fef71b0a2b79c2b7a6c473d2527c3e
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.15 --jq '.id')" = 453401976
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.15 --jq '[.draft,.prerelease] | all(. == false)')" = true
          for entry in "774232507:8356933:e8b949d46f6adba0221c6a258c2e844891379494f7ed5b8dcb5903689e4fe51f" "774232524:8368739:538d161339849214999eb6f85da40623a149fc9cf1b592c9e5907f751c434f73"; do
            IFS=: read -r id bytes digest <<< "$entry"
            test "$(gh api repos/llhzx2018/vf-adops/releases/assets/"$id" --jq .size)" = "$bytes"
            test "$(gh api repos/llhzx2018/vf-adops/releases/assets/"$id" --jq .digest)" = "sha256:$digest"
          done
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.14 --jq '.object.sha')" = 6fae792864a594465e4b3224bd6d73abde976f12
          echo P08_V015_ACTUAL_REMOTE_GITHUB_ASSET_IDS_AND_SHA=PASS
      - name: Always remove checked-out P08 distribution and validation traces
        if: always()
        shell: bash
        run: |
          rm -rf -- updates
          rm -f -- "$RUNNER_TEMP/channel-contract-output.json" "$RUNNER_TEMP/p08-php-lint.txt"
          test ! -e updates
          echo P08_V015_CHANNEL_TEST_PRIVATE_SOURCES_CLEANED=PASS
