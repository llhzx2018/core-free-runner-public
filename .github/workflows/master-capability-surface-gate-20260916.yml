name: Master Capability Surface Classifier Gate

on:
  pull_request:
    paths:
      - '.github/workflows/master-capability-surface-gate-20260916.yml'

permissions:
  contents: read

concurrency:
  group: master-capability-surface-gate-20260916
  cancel-in-progress: false

jobs:
  gate:
    if: github.head_ref == 'temp/master-capability-surface-gate-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOV_REPO: llhzx2018/gov-doc
      GOV_BASE: 2905f57e41b4f72091ba9b756509ba58c91ed15f
      GOV_SHA: 10051fff1f1d1c48b167d096232735bb081a1505
      GOV_BRANCH: work/master-capability-surface-classifier-20260916
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact private authority preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GOV_REPO}/git/ref/heads/${GOV_BRANCH}" --jq '.object.sha')" = "$GOV_SHA"
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${GOV_REPO}" --jq '.permissions.pull')" = true
          echo CAPABILITY_SURFACE_GOVDOC_PREFLIGHT=PASS

      - name: Checkout exact gov-doc candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-doc

      - name: Exact diff boundary
        working-directory: gov-doc
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GOV_SHA"
          git diff --name-only "$GOV_BASE".."$GOV_SHA" | sort >/tmp/changed
          cat >/tmp/expected <<'EOF'
          governance/agent/VF_AGENT_INFRA_AUTHORITY.json
          governance/agent/VF_AGENT_INFRA_AUTHORITY.md
          governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/changed
          echo CAPABILITY_SURFACE_DIFF_BOUNDARY=PASS

      - name: Machine-readable authority contract
        working-directory: gov-doc
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('governance/agent/VF_AGENT_INFRA_AUTHORITY.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['schema']=='vf-agent-infra-authority/2'
          assert d['public_runner']=='llhzx2018/core-free-runner-public'
          assert d['private_runner']=='llhzx2018/core-free-runner-private'
          assert d['credentials']=={
              'private_read':'VF_PRIVATE_READ_TOKEN',
              'release_write':'VF_RELEASE_WRITE_TOKEN',
          }
          s=d['capability_surfaces']
          expected={
              'repository_read',
              'repository_develop_write',
              'release_tag_write',
              'runner_job_start',
              'machine_execution',
              'distribution_production',
          }
          assert expected <= set(s)
          for k in expected:
              assert s[k]=='INDEPENDENT_PROBE_REQUIRED'
          assert s['cross_surface_inference']=='FORBIDDEN'
          assert s['repository_write_probe_is_machine_pass'] is False
          assert s['runner_job_start_block_implies_repository_read_write_block'] is False
          h=d['hard_rules']
          assert h['allow_third_runner'] is False
          assert h['allow_third_credential'] is False
          assert h['classify_capability_surface_before_declaring_infra_unavailable'] is True
          assert h['cross_surface_availability_inference'] is False
          assert h['repository_write_success_implies_machine_pass'] is False
          assert h['runner_job_start_block_implies_repository_read_write_block'] is False
          before=d['before_asking_user']
          assert 'classify_required_capability_surface' in before
          assert 'classify_failure_by_capability_surface' in before
          print('CAPABILITY_SURFACE_JSON_CONTRACT=PASS')
          PY

      - name: Human authority invariants
        working-directory: gov-doc
        shell: bash
        run: |
          set -Eeuo pipefail
          DEV=governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md
          INFRA=governance/agent/VF_AGENT_INFRA_AUTHORITY.md
          grep -Fq '### Capability Surface Classifier' "$DEV"
          grep -Fq 'REPOSITORY_DEVELOP_WRITE' "$DEV"
          grep -Fq 'Runner Job Start = BLOCKED' "$DEV"
          grep -Fq '!= Repository Develop Write BLOCKED' "$DEV"
          grep -Fq 'Probe 成功只证明 Git 写能力，不得冒充 Machine PASS' "$DEV"
          grep -Fq '### 3.1 Capability Surface 必须独立分类' "$INFRA"
          grep -Fq 'Runner Infrastructure Block 不等于 Product Failure，也不等于 Repository Read/Write Failure' "$INFRA"
          grep -Fq 'Current Long-term Runner Spaces = 2' "$INFRA"
          grep -Fq 'VF_PRIVATE_READ_TOKEN' "$INFRA"
          grep -Fq 'VF_RELEASE_WRITE_TOKEN' "$INFRA"
          echo CAPABILITY_SURFACE_HUMAN_CONTRACT=PASS

      - name: No architecture expansion
        working-directory: gov-doc
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only "$GOV_BASE".."$GOV_SHA" | grep -Ec '^skills/' || true)" = 0
          test "$(git diff --name-only "$GOV_BASE".."$GOV_SHA" | grep -Ec '^projects/' || true)" = 0
          test "$(git diff --name-only "$GOV_BASE".."$GOV_SHA" | grep -Ec 'CURRENT.md$' || true)" = 0
          echo THIRD_RUNNER_ADDED=false
          echo THIRD_CREDENTIAL_ADDED=false
          echo NEW_RUNTIME_ADDED=false
          echo PRODUCT_CHANGE=false
          echo CAPABILITY_SURFACE_ARCHITECTURE_BOUNDARY=PASS

      - name: Final verdict
        run: |
          echo MASTER_CAPABILITY_SURFACE_CLASSIFIER_GATE=PASS
          echo EXACT_GOVDOC_SHA=$GOV_SHA
          echo FORMAL_RELEASE=N_A_GOVERNANCE_AUTHORITY_MERGE_ONLY
          echo DISTRIBUTION=N_A
          echo PRODUCTION=false
