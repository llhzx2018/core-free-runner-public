name: P02 Final Product Acceptance Visual Gate
on:
  push:
    branches:
      - run/p02-final-product-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P02 exact accepted develop SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 9da03ce7bc132ef0119d75ed4469c258570cb22f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source identity
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "9da03ce7bc132ef0119d75ed4469c258570cb22f"
          test "$(git show -s --format=%T HEAD)" = "fdd46210af9558a0ebffec198e2d0be45d98ee16"
          test -z "$(git status --porcelain)"
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
      - name: Install visual runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl unzip >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run desktop mobile and Scratch visual proof
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-final-visual"
          SITE="$ROOT/site"
          SHOTS="$ROOT/screenshots"
          PORT=18170
          BASE="http://127.0.0.1:$PORT"
          PASSWORD="VF-VISUAL-${GITHUB_RUN_ID}!"
          mkdir -p "$ROOT" "$SHOTS"
          bash product/scripts/build-deploy-tree.sh "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" > "$ROOT/php.log" 2>&1 &
          PHP_PID=$!
          cleanup(){ kill "$PHP_PID" 2>/dev/null || true; rm -f product/tests/e2e/.p02-final-visual.mjs; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          kill -0 "$PHP_PID"
          COOKIE="$ROOT/setup-cookie.txt"
          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "$ROOT/setup.html"
          CSRF="$(python3 - "$ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o "$ROOT/setup-post.html" -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode "password=$PASSWORD" --data-urlencode "password_confirm=$PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = 303
          cat > product/tests/e2e/.p02-final-visual.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const base=process.env.VF_BASE,password=process.env.VF_PASSWORD,shots=process.env.VF_SHOTS;
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          fs.mkdirSync(shots,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await context.newPage();
          const pageErrors=[],consoleErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          const settle=async()=>{await page.waitForTimeout(180)};
          const noOverflow=async label=>{
            const x=await page.evaluate(()=>({w:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth}));
            assert(x.doc<=x.w+3&&x.body<=x.w+3,label+' horizontal overflow '+JSON.stringify(x));
          };
          const shot=async label=>{await settle();await noOverflow(label);await page.screenshot({path:path.join(shots,label+'.png'),fullPage:true});console.log('P02_VISUAL_SCREENSHOT='+label)};
          const login=async()=>{
            await page.goto(base+'/',{waitUntil:'networkidle'});
            const unlock=page.locator('[data-open-login]').first();
            if(await unlock.count()){
              await unlock.click();await page.locator('#loginForm input[name="password"]').fill(password);await page.locator('#loginSubmit').click();
              await page.waitForFunction(async()=>{const j=await (await fetch('/api.php?action=session',{cache:'no-store'})).json();return Boolean(j?.ok&&j?.site?.auth)});
            }
            await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);
          };
          try{
            await login();
            const fixture=await page.evaluate(async()=>{
              const s=await (await fetch('/api.php?action=session',{cache:'no-store'})).json();
              const post=async(action,body)=>{const r=await fetch('/api.php?action='+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(action+JSON.stringify(j));return j};
              const scratch=async(action,body={})=>{const r=await fetch('/scratch-action.php?action='+action,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':s.csrf},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error('scratch '+action+JSON.stringify(j));return j};
              const cat=await post('category_save',{name:'Final Visual Review',description:'whole-site visual acceptance',icon:'folder'});
              const ids=[];
              for(let i=0;i<18;i++){
                const content='# Visual Article '+i+'\n\n'+('这是一段用于最终视觉验收的长正文。 English reading line '+i+'.\n\n'.repeat(32));
                const x=await post('content_save',{category_id:cat.id,title:'视觉验收资料 '+String(i+1).padStart(2,'0'),description:'桌面与移动端布局检查',content,content_mode:'article',content_format:'markdown',primary_action:'read',status:'active'});ids.push(x.id);
              }
              for(let i=0;i<14;i++){const x=await scratch('create');await scratch('save',{id:x.tab.id,content:'临时页签 '+String(i+1).padStart(2,'0')+'\n'+('scratch visual content '+i+'\n'.repeat(8)),cursor_pos:0,scroll_top:0});}
              return {categoryId:cat.id,ids};
            });
            await page.evaluate(async id=>{if(state.contentView!=='list')await setContentView('list');await selectCategory(id)},fixture.categoryId);
            await page.waitForFunction(()=>state.loading===false&&document.querySelectorAll('.content-row').length>0);
            await shot('desktop-01-library');
            await page.evaluate(id=>openReader(id),fixture.ids[0]);await page.waitForSelector('.reader-page');await shot('desktop-02-reader');
            await page.locator('#readerEdit').click();await page.waitForSelector('.article-workspace');await page.locator('[data-workspace-command="split"]').click();await settle();await shot('desktop-03-editor-split');
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);await page.locator('#settingsBtn').click();await page.waitForSelector('.settings-page, .settings-shell, [data-settings-section], .settings-nav');await shot('desktop-04-settings');
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);await page.waitForSelector('#scratchLaunchV259');
            const scratchResourceCount=await page.evaluate(()=>performance.getEntriesByType('resource').filter(e=>/\/assets\/scratch-tabs\.js(?:\?|$)/.test(e.name)).length);
            assert(scratchResourceCount===1,'scratch resource requested '+scratchResourceCount+' times');
            assert(await page.locator('script[src*="/assets/scratch-tabs.js"]').count()===1,'scratch static script entry count mismatch');
            await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await shot('desktop-05-scratch');
            await page.locator('[data-scratch-exit]').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259')&&!document.body.classList.contains('scratch-mode-v2510'));
            console.log('P02_SCRATCH_DESKTOP_EXIT=PASS');
            for(const [name,url] of [['desktop-06-system-info','/system-info.php'],['desktop-07-system-baseline','/system-baseline.php']]){await page.goto(base+url,{waitUntil:'networkidle'});await shot(name)}

            await page.setViewportSize({width:390,height:844});
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);await page.evaluate(async id=>{if(state.contentView!=='list')await setContentView('list');await selectCategory(id)},fixture.categoryId);await page.waitForFunction(()=>state.loading===false&&document.querySelectorAll('.content-row').length>0);await shot('mobile-01-library');
            await page.evaluate(id=>openReader(id),fixture.ids[1]);await page.waitForSelector('.reader-page');await shot('mobile-02-reader');
            await page.locator('#readerEdit').click();await page.waitForSelector('.article-workspace');await page.locator('[data-workspace-command="edit"]').click();await settle();await shot('mobile-03-editor');
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);await page.locator('#menuBtn').click();await settle();await page.locator('#settingsBtn').click();await page.waitForSelector('.settings-page, .settings-shell, [data-settings-section], .settings-nav');await shot('mobile-04-settings');
            await page.goto(base+'/',{waitUntil:'networkidle'});await page.waitForFunction(()=>typeof state==='object'&&state.loading===false);await page.waitForSelector('#scratchLaunchV259');await page.locator('#scratchLaunchV259').click();await page.waitForSelector('#scratchWorkspaceV259');await settle();
            const scratch=await page.evaluate(()=>{const sc=document.querySelector('.scratch-tabs-scroll-v259'),bar=document.querySelector('.scratch-bar-v259');return {client:sc?.clientWidth||0,scroll:sc?.scrollWidth||0,barOverflow:!!bar?.classList.contains('has-tab-overflow-v2518'),buttons:bar?Array.from(bar.querySelectorAll('button')).length:0}});
            assert(scratch.scroll>scratch.client+3,'scratch tabs did not overflow '+JSON.stringify(scratch));assert(scratch.barOverflow,'scratch overflow class missing');assert(scratch.buttons>=6,'scratch overflow controls not injected '+JSON.stringify(scratch));
            const moved=await page.evaluate(()=>{const sc=document.querySelector('.scratch-tabs-scroll-v259');const max=sc.scrollWidth-sc.clientWidth;sc.scrollLeft=max;sc.dispatchEvent(new Event('scroll'));return {left:sc.scrollLeft,max}});assert(moved.left>3&&moved.max>3,'scratch horizontal scroll failed '+JSON.stringify(moved));
            await shot('mobile-05-scratch-overflow');
            await page.locator('[data-scratch-exit]').click();await page.waitForFunction(()=>!document.querySelector('#scratchWorkspaceV259')&&!document.body.classList.contains('scratch-mode-v2510'));
            console.log('P02_SCRATCH_MOBILE_OVERFLOW_EXIT=PASS');
            for(const [name,url] of [['mobile-06-system-info','/system-info.php'],['mobile-07-system-baseline','/system-baseline.php']]){await page.goto(base+url,{waitUntil:'networkidle'});await shot(name)}
            const unexpected=consoleErrors.filter(x=>!/status of 409 \(Conflict\)/.test(x)&&!/Content Security Policy directive/.test(x));
            assert(pageErrors.length===0,'page errors '+pageErrors.join(' | '));assert(unexpected.length===0,'console errors '+unexpected.join(' | '));
            console.log('P02_FINAL_WHOLE_SITE_VISUAL_GEOMETRY=PASS');
            console.log('P02_FINAL_SCRATCH_SPECIALIZED=PASS');
          } finally {await browser.close()}
          JS
          cd product
          VF_BASE="$BASE" VF_PASSWORD="$PASSWORD" VF_SHOTS="$SHOTS" node tests/e2e/.p02-final-visual.mjs
          rm -f tests/e2e/.p02-final-visual.mjs
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "9da03ce7bc132ef0119d75ed4469c258570cb22f"
          cp "$ROOT/php.log" "$SHOTS/php.log"
          printf '%s\n' 'P02 exact SHA: 9da03ce7bc132ef0119d75ed4469c258570cb22f' 'Tree: fdd46210af9558a0ebffec198e2d0be45d98ee16' > "$SHOTS/IDENTITY.txt"
          echo P02_FINAL_VISUAL_AND_SCRATCH_AUTOMATION=PASS
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2532-final-visual-evidence
          path: ${{ runner.temp }}/p02-final-visual/screenshots
          if-no-files-found: error
          retention-days: 7
