name: P02 Final Product Acceptance Core Gate
on:
  push:
    branches:
      - run/p02-final-product-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - name: Checkout P02 exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: e0bac8f6ec30df94e626e07821ae3c39cbcd7f59
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Install acceptance runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 curl unzip >/dev/null
          cd product
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Execute final acceptance
        run: bash runner/.github/runner/p02-final-acceptance.sh
