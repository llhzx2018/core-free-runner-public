name: P02 V2.5.32 Candidate Seal Gate
on:
  push:
    branches:
      - run/p02-final-product-acceptance
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P02 accepted runtime base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 9da03ce7bc132ef0119d75ed4469c258570cb22f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 0
      - name: Install seal runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 sqlite3 zip unzip >/dev/null
      - name: Apply governance-only candidate seal
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "9da03ce7bc132ef0119d75ed4469c258570cb22f"
          test "$(git show -s --format=%T HEAD)" = "fdd46210af9558a0ebffec198e2d0be45d98ee16"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          c=json.loads(p.read_text(encoding='utf-8'))
          assert c['candidate_version']=='2.5.32'
          assert c['candidate_state']=='DEVELOP_UX_CONVERGENCE_IN_PROGRESS'
          assert c['candidate_packaging_verified'] is False
          assert c['owner_test_requested'] is False
          assert c['release_prep_allowed'] is False
          assert c['formal_release_created'] is False
          assert c['update_channel_change_allowed'] is False
          assert c['production_write'] is False
          c['candidate_state']='PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE'
          c['candidate_packaging_verified']=True
          c['owner_test_requested']=True
          c['owner_test_policy']='FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE'
          c['next_gate']='OWNER_FINAL_EXPERIENCE_TEST'
          c['final_acceptance']={
            'machine_acceptance':'PASS',
            'runtime_source_commit':'9da03ce7bc132ef0119d75ed4469c258570cb22f',
            'runtime_source_tree':'fdd46210af9558a0ebffec198e2d0be45d98ee16',
            'core_exact_sha_run_id':33418679568,
            'core_exact_sha_job_id':99575407575,
            'visual_scratch_run_id':33419719401,
            'visual_scratch_job_id':99578848129,
            'visual_artifact_id':9768426923,
            'visual_artifact_digest':'sha256:0270fc112864dfd05bea6828d3ecdc58ca74ddd988c208d1ab5975df6384438c',
            'owner_experience':'PENDING',
            'runtime_changed_by_seal':False,
            'release_boundary':'CLOSED_UNTIL_OWNER_APPROVAL'
          }
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          replacements={
            'tests/unit/p02_candidate_version_identity_contract.mjs':(
              "if(candidate.release_prep_allowed!==false||candidate.owner_test_requested!==false)throw new Error('candidate must remain optimization-only');",
              "if(candidate.release_prep_allowed!==false||candidate.formal_release_created!==false||candidate.update_channel_change_allowed!==false||candidate.production_write!==false)throw new Error('release boundary must remain closed');if(candidate.candidate_state!=='PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE'||candidate.owner_test_requested!==true||candidate.owner_test_policy!=='FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE'||candidate.next_gate!=='OWNER_FINAL_EXPERIENCE_TEST')throw new Error('converged owner experience gate mismatch');"
            ),
            'tests/unit/p02_candidate_packaging_contract.mjs':(
              "assert.equal(candidate.candidate_packaging_verified,false);",
              "assert.equal(candidate.candidate_packaging_verified,true);"
            ),
            'tests/unit/p02_owner_preview_handoff_contract.mjs':(
              "assert.equal(candidate.owner_test_requested,false);",
              "assert.equal(candidate.owner_test_requested,true);assert.equal(candidate.next_gate,'OWNER_FINAL_EXPERIENCE_TEST');"
            ),
            'tests/unit/p02_release_readiness_owner_preview_contract.mjs':(
              "assert.equal(candidate.owner_test_requested,false);assert.equal(candidate.owner_test_policy,'DEFER_UNTIL_PRODUCT_OPTIMIZATION_COMPLETE');",
              "assert.equal(candidate.owner_test_requested,true);assert.equal(candidate.owner_test_policy,'FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE');assert.equal(candidate.release_prep_allowed,false);"
            )
          }
          for name,(old,new) in replacements.items():
              q=Path(name);s=q.read_text(encoding='utf-8')
              assert s.count(old)==1,(name,'seal seam drift')
              q.write_text(s.replace(old,new),encoding='utf-8')

          evidence=Path('docs/evidence/P02_V2532_PRODUCT_OPTIMIZATION_CONVERGENCE_20260831.md')
          evidence.write_text('''# P02 · VF Library V2.5.32 Product Optimization Convergence\n\nStatus: `PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE`\n\n## Accepted runtime identity\n\n- Runtime source commit: `9da03ce7bc132ef0119d75ed4469c258570cb22f`\n- Runtime source tree: `fdd46210af9558a0ebffec198e2d0be45d98ee16`\n- Version: `2.5.32`\n- Schema: `2401`\n- Runtime source files: `67`\n\n## Machine acceptance\n\n- Exact-SHA Final Core Acceptance: run `33418679568`, job `99575407575` — PASS.\n- Deterministic candidate packaging — PASS.\n- Full maintenance / fresh install / SQLite — PASS.\n- Real `2.5.31 → 2.5.32` Atomic data-preserving upgrade — PASS.\n- Post-upgrade standard Chromium task flow — PASS.\n- Final whole-site desktop + 390px visual geometry: run `33419719401`, job `99578848129` — PASS.\n- Scratch static single-owner, overflow Next control and desktop/mobile exit — PASS.\n- Visual evidence artifact: `9768426923`, digest `sha256:0270fc112864dfd05bea6828d3ecdc58ca74ddd988c208d1ab5975df6384438c`.\n\n## Owner boundary\n\n`OWNER_FINAL_EXPERIENCE_TEST = PENDING`\n\nMachine acceptance does not substitute for OWNER real-use judgement. This seal requests one final OWNER experience test only after product optimization convergence.\n\n## Publication boundary\n\n- main write: NO\n- formal Tag/Release: NO\n- update-channel V2.5.32 publish: NO\n- production V2.5.32 write: NO\n- release prep allowed: NO\n\nThese remain closed until explicit OWNER approval after the final experience test.\n''',encoding='utf-8')

          seal=Path('tests/unit/p02_v2532_product_convergence_seal_contract.mjs')
          seal.write_text("""import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst c=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));\nconst e=fs.readFileSync('docs/evidence/P02_V2532_PRODUCT_OPTIMIZATION_CONVERGENCE_20260831.md','utf8');\nassert.equal(c.candidate_version,'2.5.32');\nassert.equal(c.candidate_state,'PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE');\nassert.equal(c.candidate_packaging_verified,true);\nassert.equal(c.owner_test_requested,true);\nassert.equal(c.owner_test_policy,'FINAL_OWNER_EXPERIENCE_AFTER_PRODUCT_CONVERGENCE');\nassert.equal(c.next_gate,'OWNER_FINAL_EXPERIENCE_TEST');\nassert.equal(c.release_prep_allowed,false);assert.equal(c.formal_release_created,false);assert.equal(c.update_channel_change_allowed,false);assert.equal(c.production_write,false);\nassert.equal(c.final_acceptance.machine_acceptance,'PASS');assert.equal(c.final_acceptance.owner_experience,'PENDING');assert.equal(c.final_acceptance.runtime_changed_by_seal,false);\nassert.equal(c.final_acceptance.runtime_source_commit,'9da03ce7bc132ef0119d75ed4469c258570cb22f');assert.equal(c.final_acceptance.runtime_source_tree,'fdd46210af9558a0ebffec198e2d0be45d98ee16');\nassert.match(e,/OWNER_FINAL_EXPERIENCE_TEST = PENDING/);assert.match(e,/main write: NO/);assert.match(e,/formal Tag\/Release: NO/);\nconsole.log('P02_V2532_PRODUCT_CONVERGENCE_SEAL=PASS');\n""",encoding='utf-8')
          PY
          git diff --exit-code HEAD -- public src VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          for t in tests/unit/*.mjs; do echo "UNIT $t"; node "$t"; done
          echo P02_SEAL_GOVERNANCE_ONLY=PASS
          echo P02_SEAL_ALL_UNIT=PASS
      - name: Create local seal commit and verify deterministic packaging
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json docs/evidence/P02_V2532_PRODUCT_OPTIMIZATION_CONVERGENCE_20260831.md tests/unit/p02_candidate_version_identity_contract.mjs tests/unit/p02_candidate_packaging_contract.mjs tests/unit/p02_owner_preview_handoff_contract.mjs tests/unit/p02_release_readiness_owner_preview_contract.mjs tests/unit/p02_v2532_product_convergence_seal_contract.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m "governance(P02): seal V2.5.32 product convergence"
          SEAL_SHA="$(git rev-parse HEAD)"
          SEAL_TREE="$(git show -s --format=%T HEAD)"
          echo "P02_SEAL_LOCAL_SHA=$SEAL_SHA"
          echo "P02_SEAL_LOCAL_TREE=$SEAL_TREE"
          rm -rf build/final-seal-a build/final-seal-b
          python3 scripts/build-candidate.py --out build/final-seal-a --source-version 2.5.31 --source-commit "$SEAL_SHA" --source-tree "$SEAL_TREE" --source-ref develop >/tmp/p02-seal-a.json
          python3 scripts/build-candidate.py --out build/final-seal-b --source-version 2.5.31 --source-commit "$SEAL_SHA" --source-tree "$SEAL_TREE" --source-ref develop >/tmp/p02-seal-b.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          A=Path('build/final-seal-a');B=Path('build/final-seal-b')
          a=sorted(p.name for p in A.iterdir() if p.is_file());b=sorted(p.name for p in B.iterdir() if p.is_file());assert a==b,(a,b)
          for name in a: assert hashlib.sha256((A/name).read_bytes()).digest()==hashlib.sha256((B/name).read_bytes()).digest(),name
          print('P02_SEAL_DETERMINISTIC_PACKAGING=PASS')
          PY
          rm -rf build/final-seal-a build/final-seal-b
          test -z "$(git status --porcelain)"
      - name: Live-read all Canonical Authority before develop write
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          import base64,json,os,urllib.request
          token=os.environ['VF_RELEASE_WRITE_TOKEN']
          def get(url):
              r=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(r) as x:return json.load(x)
          def content(repo,path,ref):
              x=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}')
              return base64.b64decode(x['content']).decode('utf-8')
          dev=get('https://api.github.com/repos/llhzx2018/vf-library/branches/develop')['commit']['sha']
          main=get('https://api.github.com/repos/llhzx2018/vf-library/branches/main')['commit']['sha']
          version=content('llhzx2018/vf-library','VERSION','develop').strip()
          sm=json.loads(content('llhzx2018/vf-library','SOURCE_MANIFEST.json','develop'))
          smtxt=content('llhzx2018/vf-library','SOURCE_MANIFEST.txt','develop')
          candidate=json.loads(content('llhzx2018/vf-library','docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','develop'))
          index=content('llhzx2018/vf-library','public/index.php','develop')
          runner=get('https://api.github.com/repos/llhzx2018/core-free-runner-public/branches/main')['commit']['sha']
          updates=get('https://api.github.com/repos/llhzx2018/core-updates/branches/main')['commit']['sha']
          p02=json.loads(content('llhzx2018/core-updates','projects/P02.json','main'))
          assert dev=='9da03ce7bc132ef0119d75ed4469c258570cb22f',dev
          assert main=='6a43f76308f6ba3e4fd675d121ba9fe7be7f3ddd',main
          assert version=='2.5.32'
          assert sm['version']=='2.5.32' and sm['schema']==2401 and sm['runtime_source_file_count']==67
          assert 'RUNTIME_SOURCE_FILES  67' in smtxt
          assert candidate['candidate_state']=='DEVELOP_UX_CONVERGENCE_IN_PROGRESS' and candidate['owner_test_requested'] is False
          assert '/assets/favicon-settings.js' in index and '/assets/scratch-tabs.js' in index
          assert p02['target_version']=='2.5.31' and p02['release_tag']=='v2.5.31-rc.1'
          out={'vf_develop':dev,'vf_main':main,'version':version,'runtime_sources':67,'runner_main':runner,'core_updates_main':updates,'p02_target':p02['target_version']}
          open('/tmp/p02-seal-authority.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          print('P02_SEAL_AUTHORITY_10_OF_10=PASS')
          PY
      - name: Publish one sealed candidate commit to develop
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          SEAL_SHA="$(git rev-parse HEAD)"
          git config --global url."https://x-access-token:${VF_RELEASE_WRITE_TOKEN}@github.com/".insteadOf "https://github.com/"
          git push origin "$SEAL_SHA:refs/heads/develop"
          REMOTE="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          test "$REMOTE" = "$SEAL_SHA"
          echo "P02_V2532_SEALED_DEVELOP_SHA=$SEAL_SHA"
          echo P02_SEAL_DEVELOP_WRITE=PASS
      - name: Exact-SHA postwrite seal verification
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          SEAL_SHA="$(git rev-parse HEAD)"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$SEAL_SHA"
          test -z "$(git status --porcelain)"
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          for t in tests/unit/*.mjs; do node "$t"; done
          node - <<'JS'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json','utf8'));
          if(c.candidate_state!=='PRODUCT_OPTIMIZATION_CONVERGED_AWAITING_OWNER_EXPERIENCE'||c.candidate_packaging_verified!==true||c.owner_test_requested!==true||c.next_gate!=='OWNER_FINAL_EXPERIENCE_TEST')process.exit(71);
          if(c.release_prep_allowed!==false||c.formal_release_created!==false||c.update_channel_change_allowed!==false||c.production_write!==false)process.exit(72);
          JS
          python3 - <<'PY'
          import base64,json,os,urllib.request
          token=os.environ['VF_RELEASE_WRITE_TOKEN']
          def get(url):
              r=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(r) as x:return json.load(x)
          def content(repo,path,ref):
              x=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={ref}')
              return base64.b64decode(x['content']).decode('utf-8')
          main=get('https://api.github.com/repos/llhzx2018/vf-library/branches/main')['commit']['sha']
          p02=json.loads(content('llhzx2018/core-updates','projects/P02.json','main'))
          assert main=='6a43f76308f6ba3e4fd675d121ba9fe7be7f3ddd'
          assert p02['target_version']=='2.5.31' and p02['release_tag']=='v2.5.31-rc.1'
          print('P02_SEAL_BOUNDARY_MAIN_WRITE=NO')
          print('P02_SEAL_BOUNDARY_RELEASE_WRITE=NO')
          print('P02_SEAL_BOUNDARY_TAG_WRITE=NO')
          print('P02_SEAL_BOUNDARY_UPDATE_CHANNEL_WRITE=NO')
          print('P02_SEAL_BOUNDARY_PRODUCTION_WRITE=NO')
          PY
          echo P02_V2532_PRODUCT_OPTIMIZATION_CONVERGED=PASS
