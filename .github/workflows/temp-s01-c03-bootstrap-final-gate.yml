name: TEMP S01-C03 Bootstrap Final Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-bootstrap-final-gate.yml

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-bootstrap-final-gate
  cancel-in-progress: true

env:
  BASE_SHA: 2551f1f0a4045012eea5759169cd96d07aab8215
  BOOTSTRAP_SHA: ebf6e15b8dd589e0a764542242cbd8adbbe8c8c1
  TARGET_SHA: 72d2a1ca9400a3a3530a90974758b7135a7039d2
  WP_PATH: /tmp/vf-s01-bootstrap-final-wp
  PKG_DIR: /tmp/vf-s01-bootstrap-final-pkg
  EV_DIR: /tmp/vf-s01-bootstrap-final-evidence
  V1254_ASSET_ID: '540225036'
  V1254_BYTES: '3524539'
  V1254_SHA256: 797ee12ea864219880792d7c23530d1df15a609f6792f7bb5fa79361fbbe1c84

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_bootstrap_final
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout exact bootstrap candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.BOOTSTRAP_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: bootstrap

      - name: Checkout provisional target identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Provision PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mysqli,curl,zip,mbstring,xml,json,openssl
          coverage: none

      - name: Exact boundary and static contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PKG_DIR" "$EV_DIR"
          test "$(git -C bootstrap rev-parse HEAD)" = "$BOOTSTRAP_SHA"
          test "$(git -C bootstrap merge-base "$BASE_SHA" "$BOOTSTRAP_SHA")" = "$BASE_SHA"
          test "$(git -C bootstrap rev-parse origin/main)" = "$BASE_SHA"
          git -C bootstrap diff --name-only "$BASE_SHA" "$BOOTSTRAP_SHA" | LC_ALL=C sort > /tmp/actual
          printf '%s\n' scripts/s01-c03-bootstrap-upgrade-1254.php tests/unit/bootstrap-upgrade-contract.php | LC_ALL=C sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git -C bootstrap diff --check "$BASE_SHA" "$BOOTSTRAP_SHA"
          php -l bootstrap/scripts/s01-c03-bootstrap-upgrade-1254.php
          php -l bootstrap/tests/unit/bootstrap-upgrade-contract.php
          php bootstrap/tests/unit/bootstrap-upgrade-contract.php | tee "$EV_DIR/static-contract.txt"
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = '1.25.6'

      - name: Build provisional target and verify official source
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('target/src'); out=Path('/tmp/vf-s01-bootstrap-final-pkg'); ev=Path('/tmp/vf-s01-bootstrap-final-evidence')
          files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); assert len(files)==550
          zpath=out/'vf-tools-m3u8_V1.25.6.zip'
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in files.items():
                  zi=zipfile.ZipInfo(f'vf-tool-m3u8/{rel}',(2026,9,2,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
          assert zipfile.ZipFile(zpath).testzip() is None
          audit={'bytes':zpath.stat().st_size,'sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'files':len(files)}
          (ev/'target-package.json').write_text(json.dumps(audit,indent=2)+'\n'); print(json.dumps(audit))
          PY
          curl -fsSL -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-tools-m3u8/releases/assets/$V1254_ASSET_ID" -o "$PKG_DIR/vf-tools-m3u8_V1.25.4.zip"
          test "$(stat -c%s "$PKG_DIR/vf-tools-m3u8_V1.25.4.zip")" = "$V1254_BYTES"
          test "$(sha256sum "$PKG_DIR/vf-tools-m3u8_V1.25.4.zip" | awk '{print $1}')" = "$V1254_SHA256"

      - name: Install WordPress 7.1 and official v1.25.4
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
          chmod +x /tmp/wp && sudo mv /tmp/wp /usr/local/bin/wp
          for i in $(seq 1 30); do mysqladmin ping -h127.0.0.1 -P3306 -uvf -pvf --silent >/dev/null 2>&1 && break; sleep 1; done
          mysqladmin ping -h127.0.0.1 -P3306 -uvf -pvf --silent
          rm -rf "$WP_PATH"
          wp core download --path="$WP_PATH" --version=7.1 --force
          wp config create --path="$WP_PATH" --dbname=vf_s01_bootstrap_final --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check
          wp config set FS_METHOD direct --path="$WP_PATH"
          wp core install --path="$WP_PATH" --url=http://127.0.0.1:8089 --title='VF Bootstrap Final Gate' --admin_user=owner --admin_password='gate-only-final' --admin_email=owner@example.invalid --skip-email
          wp plugin install "$PKG_DIR/vf-tools-m3u8_V1.25.4.zip" --path="$WP_PATH" --activate --force
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          test "$(wp option get vf_tools_m3u8_v6_schema_version --path="$WP_PATH" | tr -d '\r')" = '1.3.0'
          test "$(wp core version --path="$WP_PATH" | tr -d '\r')" = '7.1'

      - name: Seal exact pre-state
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/schema-fp.php <<'PHP'
          <?php
          $tables=function_exists('vf_tools_m3u8_v6_table_names')?vf_tools_m3u8_v6_table_names():[]; if(count($tables)!==14){exit(2);} ksort($tables,SORT_STRING); global $wpdb; $p=['tables'=>[],'options'=>[]];
          foreach($tables as $k=>$t){$c=$wpdb->get_row('SHOW CREATE TABLE `'.str_replace('`','``',$t).'`',ARRAY_N);$r=$wpdb->get_results('SELECT * FROM `'.str_replace('`','``',$t).'`',ARRAY_A);usort($r,static fn($a,$b)=>strcmp(wp_json_encode($a),wp_json_encode($b)));$p['tables'][$k]=['name'=>$t,'create'=>$c,'rows'=>$r];}
          $p['options']['schema_version']=get_option('vf_tools_m3u8_v6_schema_version',null);$p['options']['migration']=get_option('vf_tools_m3u8_v6_private_schema_migration',null);echo hash('sha256',wp_json_encode($p,JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE)),"\n";
          PHP
          cat > /tmp/source-fp.py <<'PY'
          import hashlib,sys
          from pathlib import Path
          root=Path(sys.argv[1]); files={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file() and not p.is_symlink()}; files=dict(sorted(files.items())); print(hashlib.sha256(''.join(f'{k}\0{hashlib.sha256(v).hexdigest()}\n' for k,v in files.items()).encode()).hexdigest())
          PY
          wp eval-file /tmp/schema-fp.php --path="$WP_PATH" > "$EV_DIR/schema-before.sha256"
          python3 /tmp/source-fp.py "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EV_DIR/source-before.sha256"

      - name: Verify-only zero mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          Z="$PKG_DIR/vf-tools-m3u8_V1.25.6.zip"; B="$(jq -r .bytes "$EV_DIR/target-package.json")"; S="$(jq -r .sha256 "$EV_DIR/target-package.json")"
          wp --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/bootstrap/scripts/s01-c03-bootstrap-upgrade-1254.php" "zip=$Z" "sha256=$S" "bytes=$B" "target=1.25.6" "verify-only" | tee "$EV_DIR/verify-only.txt"
          grep -Fq 'bootstrap preflight PASS' "$EV_DIR/verify-only.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp eval-file /tmp/schema-fp.php --path="$WP_PATH" > "$EV_DIR/schema-after-verify.sha256"
          python3 /tmp/source-fp.py "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EV_DIR/source-after-verify.sha256"
          cmp "$EV_DIR/schema-before.sha256" "$EV_DIR/schema-after-verify.sha256"
          cmp "$EV_DIR/source-before.sha256" "$EV_DIR/source-after-verify.sha256"

      - name: Fault after source promotion rolls back exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          Z="$PKG_DIR/vf-tools-m3u8_V1.25.6.zip"; B="$(jq -r .bytes "$EV_DIR/target-package.json")"; S="$(jq -r .sha256 "$EV_DIR/target-package.json")"
          cp "$GITHUB_WORKSPACE/bootstrap/scripts/s01-c03-bootstrap-upgrade-1254.php" /tmp/bootstrap-fault.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/bootstrap-fault.php'); s=p.read_text(); n='            self::assert_target_readback($pluginDir, $target, $activeBefore, $networkBefore);'; assert s.count(n)==1; p.write_text(s.replace(n,"            throw new RuntimeException('GATE_FAULT_AFTER_SOURCE_PROMOTION');\n"+n))
          PY
          set +e
          wp --path="$WP_PATH" eval-file /tmp/bootstrap-fault.php "zip=$Z" "sha256=$S" "bytes=$B" "target=1.25.6" > "$EV_DIR/fault.txt" 2>&1
          rc=$?
          set -e
          cat "$EV_DIR/fault.txt"
          test "$rc" -ne 0
          grep -Fq 'GATE_FAULT_AFTER_SOURCE_PROMOTION' "$EV_DIR/fault.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.4'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          wp eval-file /tmp/schema-fp.php --path="$WP_PATH" > "$EV_DIR/schema-after-fault.sha256"
          python3 /tmp/source-fp.py "$WP_PATH/wp-content/plugins/vf-tool-m3u8" > "$EV_DIR/source-after-fault.sha256"
          cmp "$EV_DIR/schema-before.sha256" "$EV_DIR/schema-after-fault.sha256"
          cmp "$EV_DIR/source-before.sha256" "$EV_DIR/source-after-fault.sha256"

      - name: Successful source-only bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          Z="$PKG_DIR/vf-tools-m3u8_V1.25.6.zip"; B="$(jq -r .bytes "$EV_DIR/target-package.json")"; S="$(jq -r .sha256 "$EV_DIR/target-package.json")"
          wp --path="$WP_PATH" eval-file "$GITHUB_WORKSPACE/bootstrap/scripts/s01-c03-bootstrap-upgrade-1254.php" "zip=$Z" "sha256=$S" "bytes=$B" "target=1.25.6" | tee "$EV_DIR/success.txt"
          test "$(wp plugin get vf-tool-m3u8 --field=version --path="$WP_PATH" | tr -d '\r')" = '1.25.6'
          wp plugin is-active vf-tool-m3u8 --path="$WP_PATH"
          wp eval-file /tmp/schema-fp.php --path="$WP_PATH" > "$EV_DIR/schema-after-success.sha256"
          cmp "$EV_DIR/schema-before.sha256" "$EV_DIR/schema-after-success.sha256"
          test "$(wp option get vf_s01_c03_runtime_authority_v1 --format=json --path="$WP_PATH" | jq -r .version)" = '1.25.6'
          grep -Fq 'Provider Schema was not mutated' "$EV_DIR/success.txt"

      - name: Seal evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'S01_C03_BOOTSTRAP_FINAL_GATE=PASS' "BASE_SHA=$BASE_SHA" "BOOTSTRAP_SHA=$BOOTSTRAP_SHA" "TARGET_SHA=$TARGET_SHA" 'WP=7.1' 'MARIADB=11.4' 'VERIFY_ONLY=PASS' 'FAULT_ROLLBACK=PASS' 'SUCCESS_BOOTSTRAP=PASS' 'SCHEMA_NO_WRITE=PASS' > "$EV_DIR/FINAL_EVIDENCE.txt"
          cat "$EV_DIR/FINAL_EVIDENCE.txt"

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-bootstrap-final-gate-${{ github.run_id }}
          path: /tmp/vf-s01-bootstrap-final-evidence
          if-no-files-found: error
          retention-days: 14
