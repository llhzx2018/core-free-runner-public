name: P08 R194 official v0.1.9 Owner PHP live discovery of verified v0.1.10 Atomic channel
on:
  pull_request:
    paths:
      - .github/workflows/p08-r194-v010-live-official-discovery.yml
permissions:
  contents: read
jobs:
  shipped-old-owner-real-https-github-check:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r194-v010-live-discovery-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout actual issued v0.1.9 PHP Owner client (not target head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b77c7e8563d93255f5f4a60bb8c5736a994d8151
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: PHP 8.4 exact shipped client with real curl HTTPS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Independent remote channel, tag and genuine final asset identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = b77c7e8563d93255f5f4a60bb8c5736a994d8151
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = e0df94e31d7082cf3d04dcf628fd2fbc8f96f901
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.10 --jq .object.sha)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.10 --jq .id)" = 450188625
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.9 --jq .id)" = 449880979
          echo P08_R194_REAL_OFFICIAL_CHANNEL_TAG_ASSET_TRUST=PASS
      - name: Execute true shipped v0.1.9 PHP Owner check over private GitHub HTTPS and reject bad versions
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/OwnerNextReleaseGateway.php';
          $token=(string)getenv('P08_PRIVATE_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('P08_R194_READ_CREDENTIAL_REQUIRED');
          $gateway=new VF\AdOps\Upgrade\OwnerNextReleaseGateway();
          $installed=[
            'version'=>'0.1.9',
            'source_sha'=>'b77c7e8563d93255f5f4a60bb8c5736a994d8151',
            'source_full_manifest_sha256'=>'0abfd473c3428f5378bd946a26e51ddc1fd0cfbd997790ce6c5572163f34481e'
          ];
          $new=$gateway->check($token,$installed);
          if(($new['status']??null)!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
             ||($new['target_version']??null)!=='0.1.10'
             ||($new['target_sha']??null)!=='ef78dcb21117c822e2756360280f2418f794704f'
             ||($new['source_version']??null)!=='0.1.9'
             ||($new['source_sha']??null)!==$installed['source_sha']
             ||($new['source_full_manifest_sha256']??null)!==$installed['source_full_manifest_sha256']
             ||($new['asset_sha256']??null)!=='3a9ceae0d6b928bc6871b8db900be421728be24c4500dc1c661463917ba4a827'
             ||($new['can_install']??true)!==false)
             throw new RuntimeException('P08_R194_REAL_019_TO_010_INTAKE_MISMATCH');
          echo "P08_R194_V019_PHP_TRUE_OFFICIAL_010_NEXT_OFFER_NOT_STAGED=PASS\n";
          $current=$installed;
          $current['version']='0.1.10';
          $current['source_sha']='ef78dcb21117c822e2756360280f2418f794704f';
          $current['source_full_manifest_sha256']=str_repeat('a',64);
          $same=$gateway->check($token,$current);
          if(($same['status']??null)!=='OFFICIAL_VERSION_CURRENT'
              ||($same['can_install']??true)!==false)
              throw new RuntimeException('P08_R194_NO_DOWNGRADE_OR_SAME_VERSION_FAILURE');
          echo "P08_R194_V010_CURRENT_NO_REINSTALL_NO_DOWNGRADE=PASS\n";
          foreach(['source_sha'=>str_repeat('f',40),'source_full_manifest_sha256'=>str_repeat('a',64)] as $field=>$badValue){
            $bad=$installed;
            $bad[$field]=$badValue;
            try{
              $gateway->check($token,$bad);
              throw new RuntimeException('P08_R194_UNTRUSTED_SOURCE_ACCEPTED');
            }catch(RuntimeException $e){
              if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
            }
          }
          echo "P08_R194_OLD_SOURCE_MANIFEST_TAMPER_DENIED=PASS\n";
          echo "P08_R194_NO_BACKUP_NO_DOWNLOAD_NO_APPLY_PRODUCTION_UNTOUCHED=PASS\n";
          PHP
      - name: Always cleanup temporary private source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
