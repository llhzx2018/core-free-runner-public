name: S01-C02 1.21.953 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121953-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 2068e4b1435d28ab5333ca076f95f371a6559b95
      TARGET_VERSION: 1.21.953
      RELEASE_TAG: v1.21.953
      ASSET_NAME: vf-tools-ops_V1.21.953.zip
      TESTED_RUN_ID: '36506833553'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.953-r4-candidate
      EXPECTED_BYTES: '3405362'
      EXPECTED_SHA256: 69d0317e72cdd9723685eaa50ac10d7e3e393cba0551511c49ed96ab5793d928
      EXPECTED_RUNTIME_FILES: '961'
      EXPECTED_RUNTIME_FP: a4f71ac44e11c45bf90d26b4ccb38a7f2cf094034fdf8fcbf5f5526a67f3b07e
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"
          echo "RELEASE_CREDENTIALS=PASS"

      - name: Checkout exact promoted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact release source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -Fq "Version: $TARGET_VERSION" target/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '$TARGET_VERSION'" target/vf-ops.php
          echo "EXACT_PROMOTED_SOURCE=PASS"

      - name: Fetch exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf tested
          mkdir tested
          gh run download "$TESTED_RUN_ID"             --repo "llhzx2018/core-free-runner-public"             --name "$TESTED_ARTIFACT_NAME"             --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/package-evidence.json"
          test -f "tested/$ASSET_NAME"

          jq -e --arg sha "$TARGET_SHA" --arg version "$TARGET_VERSION" '
            .status=="PASS" and
            .candidate_sha==$sha and
            .candidate_version==$version and
            .php82_source_contract=="PASS" and
            .security_source_scan=="PASS" and
            .clean_install_activation=="PASS" and
            .existing_install_upgrade_preservation=="PASS" and
            .updater_implementation_changed==false and
            .schema_migration=="NONE" and
            .owner_surface_count==14 and
            .browser.result=="PASS" and
            .browser.blocking_errors==0 and
            .browser.responsive_failures==0
          ' tested/FINAL_EVIDENCE.json >/dev/null

          jq -e --arg version "$TARGET_VERSION"             --arg sha "$EXPECTED_SHA256"             --arg fp "$EXPECTED_RUNTIME_FP"             --argjson bytes "$EXPECTED_BYTES"             --argjson files "$EXPECTED_RUNTIME_FILES" '
            .candidate.version==$version and
            .candidate.bytes==$bytes and
            .candidate.sha256==$sha and
            .candidate.files==$files and
            .candidate.runtime_fingerprint==$fp
          ' tested/package-evidence.json >/dev/null

          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null
          echo "TESTED_ARTIFACT_EXACT=PASS"

      - name: Formal release absence or exact idempotent state
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/tmp/existing-release.json 2>/dev/null; then
            TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            test "$TAG_SHA" = "$TARGET_SHA"
            echo "RELEASE_ALREADY_EXISTS=YES"
          else
            echo "RELEASE_ALREADY_EXISTS=NO"
          fi

      - name: Create formal tag release and upload exact tested asset
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "RELEASE_CREATE=SKIPPED_EXACT_EXISTING"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.953

          Full Product Fine Polish R4 · Readability:
          - makes visible Fine Polish changes instead of another copy-only pass
          - raises shared body/help typography and control/row rhythm across the 14 formal OPS surfaces
          - deep-polishes 工作台 / 工具 / 内容与 SEO 概览
          - closes 发布中心 legacy tiny-text overrides, including 8.5–12px release/evidence labels
          - Page Body V2 Macro remains frozen
          - Shell / Header / Header Menu IA remain frozen
          - no route, business logic, data, schema, permission, ownership or updater semantic change
          - exact Candidate Gate Run: 36506833553
          - exact source: 2068e4b1435d28ab5333ca076f95f371a6559b95

          Formal Release does not by itself claim OWNER Production visual acceptance.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME"               --repo "$TARGET_REPOSITORY"               --target "$TARGET_SHA"               --title "VF Tools Ops V1.21.953"               --notes-file release-notes.md
            echo "RELEASE_CREATE=PASS"
          fi

      - name: Remote formal release exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
          RELEASE_ID="$(jq -r '.id' release.json)"
          ASSET_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .id' release.json)"
          ASSET_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | .size' release.json)"
          ASSET_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name==$n) | (.digest // "")' release.json)"
          PUBLISHED_AT="$(jq -r '.published_at' release.json)"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"

          test "$TAG_SHA" = "$TARGET_SHA"
          test "$ASSET_SIZE" = "$EXPECTED_BYTES"
          if [ -n "$ASSET_DIGEST" ] && [ "$ASSET_DIGEST" != "null" ]; then
            test "$ASSET_DIGEST" = "sha256:$EXPECTED_SHA256"
          fi

          rm -rf readback
          mkdir readback
          gh release download "$RELEASE_TAG"             --repo "$TARGET_REPOSITORY"             --pattern "$ASSET_NAME"             --dir readback             --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null

          printf '%s\n' "$RELEASE_ID" > release-id.txt
          printf '%s\n' "$ASSET_ID" > asset-id.txt
          printf '%s\n' "$PUBLISHED_AT" > published-at.txt

          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RELEASE_ID"
          echo "ASSET_ID=$ASSET_ID"
          echo "ASSET_BYTES=$ASSET_SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Build sanitized release evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p={
            "schema":"vf-release/s01-c02-formal-r4",
            "version":os.environ["TARGET_VERSION"],
            "tag":os.environ["RELEASE_TAG"],
            "target_sha":os.environ["TARGET_SHA"],
            "machine_gate_run":int(os.environ["TESTED_RUN_ID"]),
            "release_id":int(Path("release-id.txt").read_text().strip()),
            "asset_id":int(Path("asset-id.txt").read_text().strip()),
            "asset_name":os.environ["ASSET_NAME"],
            "asset_bytes":int(os.environ["EXPECTED_BYTES"]),
            "asset_sha256":os.environ["EXPECTED_SHA256"],
            "runtime_file_count":int(os.environ["EXPECTED_RUNTIME_FILES"]),
            "runtime_fingerprint_sha256":os.environ["EXPECTED_RUNTIME_FP"],
            "schema_from":"6.0.0",
            "schema_to":"6.0.0",
            "backup_required":True,
            "rollback_supported":True,
            "owner_direct_release":True,
            "machine_pass":True,
            "tested_artifact_equals_delivered_artifact":True,
            "remote_readback_pass":True,
            "distribution_write_executed":False,
            "production_write_executed":False,
            "owner_post_release_real_use":"PENDING",
            "published_at":Path("published-at.txt").read_text().strip(),
            "private_source_persisted":False,
            "secret_values_persisted":False
          }
          raw=json.dumps(p,sort_keys=True).encode()
          p["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence/s01-c02-121953-formal-release.json").write_text(
            json.dumps(p,indent=2,sort_keys=True)+"\n", encoding="utf-8"
          )
          print("FORMAL_RELEASE_EVIDENCE_SHA256="+p["evidence_sha256"])
          PY

      - name: Remove private product bytes
        if: always()
        shell: bash
        run: |
          rm -rf target tested readback
          echo "PRIVATE_PRODUCT_BYTES_REMOVED=PASS"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121953-formal-release-${{ github.run_id }}
          path: evidence/s01-c02-121953-formal-release.json
          if-no-files-found: error
          retention-days: 30
