name: S01 C02 Polylang Duplicate Guard Isolated
on:
  push:
    branches: [task/s01-c02-polylang-archive-guard-20261011]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_SHA: '508d43a7d8718d1185ae460aff2ca4304d88a832'
    steps:
      - name: Checkout guarded private Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Verify and execute exact PHP guard
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$PRODUCT_SHA"
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/01-common.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/02-scan.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/03-repair-helpers.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/04-repair-runner.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/06-endpoint-labels.php
          php -l target/includes/multilingual-slug-cleaner/02-view.php
          php -l target/tests/s01-c02-multilingual-duplicate-relation-guard.php
          php target/tests/s01-c02-multilingual-duplicate-relation-guard.php
          mkdir -p proof
          python3 - <<'PY'
          import json,os,pathlib
          r={'status':'PASS','scope':'S01-C02 Polylang duplicate archiving guard','candidate_sha':os.environ['PRODUCT_SHA'],'production':'NOT_EXECUTED','tests':'php-lint and synthetic linked/unlinked/race regressions'}
          pathlib.Path('proof/FINAL.json').write_text(json.dumps(r,indent=2))
          print('S01_C02_DUPLICATE_GUARD_PASS',json.dumps(r))
          PY
      - name: Check current-main updater regressions and deterministic package preparation
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-1211095-system-update-blocker-visibility.php
          php target/tests/s01-c02-1211096-current-update-offer-order.php
          mkdir -p "$RUNNER_TEMP/s01-build"
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/s01-build/first.zip" > "$RUNNER_TEMP/s01-build/first.json"
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/s01-build/second.zip" > "$RUNNER_TEMP/s01-build/second.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'s01-build'
          a=json.loads((folder/'first.json').read_text())
          b=json.loads((folder/'second.json').read_text())
          for key in ['version','asset_bytes','asset_sha256','runtime_files','runtime_fingerprint','root_contract','plugin_file']:
              if a[key]!=b[key]: raise SystemExit('Package reproducibility failed: '+key)
          if a['version']!='1.21.1096': raise SystemExit('Expected current-main identity; no new release version is assigned yet')
          with zipfile.ZipFile(folder/'first.zip') as z:
              names=z.namelist()
              if any(n.startswith(('vf-ops/tests/','vf-ops/.github/','vf-ops/docs/')) for n in names):
                  raise SystemExit('Non-runtime files leaked into package')
              guard='includes/multilingual-slug-cleaner/service-actions-parts/03-repair-helpers.php'
              if z.read('vf-ops/'+guard)!=(pathlib.Path('target')/guard).read_bytes():
                  raise SystemExit('Packaged archive guard differs from exact candidate')
          receipt={k:a[k] for k in ['version','asset_bytes','asset_sha256','runtime_files','runtime_fingerprint','root_contract','plugin_file']}
          receipt.update(status='PASS',gate='BUILD_PREPARATION_ONLY',candidate_sha=os.environ['PRODUCT_SHA'],reproducible=True,release_ready=False,licensed_pro_gate='PENDING',production_mutated=False)
          pathlib.Path('proof/BUILD_PREPARATION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('S01_C02_BUILD_PREPARATION_PASS',json.dumps(receipt))
          PY
      - name: Checkout public integration lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Validate and run isolated WordPress MariaDB Polylang scenario
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-polylang-archive-guard/integration.sh
          php -l runner/lanes/s01-c02-polylang-archive-guard/fixture.php
          php -l runner/lanes/s01-c02-polylang-archive-guard/rank-math-fixture.php
          bash runner/lanes/s01-c02-polylang-archive-guard/integration.sh
          test "$(grep -c 'S01_C02_HTTP_PROBE_RACE_BLOCK_PASS' /tmp/s01-rankmath.log)" = 3
      - name: Upload public-safe receipt only
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-polylang-archive-guard-${{ github.run_id }}
          path: |
            proof/FINAL.json
            proof/WORDPRESS.json
            proof/BUILD_PREPARATION.json
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup transient private source
        if: always()
        run: rm -rf target runner "$RUNNER_TEMP/s01-build"
