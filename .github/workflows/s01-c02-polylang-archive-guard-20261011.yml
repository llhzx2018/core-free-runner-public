name: S01 C02 Polylang Duplicate Guard Isolated
on:
  push:
    branches: [task/s01-c02-polylang-archive-guard-20261011]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_SHA: 'dfc985984d69b6990203f10cec6e9aecc218743b'
    steps:
      - name: Checkout guarded private Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Verify and execute exact PHP guard
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$PRODUCT_SHA"
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/01-common.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/02-scan.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/03-repair-helpers.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/04-repair-runner.php
          php -l target/includes/multilingual-slug-cleaner/service-actions-parts/06-endpoint-labels.php
          php -l target/includes/multilingual-slug-cleaner/02-view.php
          php -l target/tests/s01-c02-multilingual-duplicate-relation-guard.php
          php target/tests/s01-c02-multilingual-duplicate-relation-guard.php
          mkdir -p proof
          python3 - <<'PY'
          import json,os,pathlib
          r={'status':'PASS','scope':'S01-C02 Polylang duplicate archiving guard','candidate_sha':os.environ['PRODUCT_SHA'],'production':'NOT_EXECUTED','tests':'php-lint and synthetic linked/unlinked/race regressions'}
          pathlib.Path('proof/FINAL.json').write_text(json.dumps(r,indent=2))
          print('S01_C02_DUPLICATE_GUARD_PASS',json.dumps(r))
          PY
      - name: Checkout public integration lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Validate and run isolated WordPress MariaDB Polylang scenario
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-polylang-archive-guard/integration.sh
          php -l runner/lanes/s01-c02-polylang-archive-guard/fixture.php
          php -l runner/lanes/s01-c02-polylang-archive-guard/rank-math-fixture.php
          bash runner/lanes/s01-c02-polylang-archive-guard/integration.sh
      - name: Upload public-safe receipt only
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-polylang-archive-guard-${{ github.run_id }}
          path: |
            proof/FINAL.json
            proof/WORDPRESS.json
          if-no-files-found: error
          retention-days: 7
      - name: Cleanup transient private source
        if: always()
        run: rm -rf target runner
