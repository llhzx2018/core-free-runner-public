name: P01 V2.25 Develop Exact Source Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-develop-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEVELOP: 19fc03dca150150e2bdedb34a49e145d8d9d03a0
      FEATURE: 5520d78fcfd77b51fbd7ecd2f0e05c9286490f29
      FUNCTIONAL: d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Identity and ancestry
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEVELOP"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/develop|awk '{print $1}')" = "$DEVELOP"
          git merge-base --is-ancestor "$FEATURE" "$DEVELOP"
          git merge-base --is-ancestor "$FUNCTIONAL" "$DEVELOP"
          test "$(cat VERSION|tr -d '\r\n')" = 2.24.0
          grep -F 'surface-vf-theme.css' src/app/SurfaceShell.php >/dev/null
      - name: Fresh regression
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          rm -rf /tmp/p01-v225-dev /tmp/p01-v225-dev.cookies; cp -a src /tmp/p01-v225-dev; cd /tmp/p01-v225-dev
          php -S 127.0.0.1:18253 -t . >/tmp/p01-v225-dev-server.log 2>&1 & echo $! >/tmp/p01-v225-dev.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18253/setup.php -o /tmp/p01-v225-dev-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v225-dev.cookies -b /tmp/p01-v225-dev.cookies http://127.0.0.1:18253/setup.php -o /tmp/p01-v225-dev-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v225-dev-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v225-dev.cookies -b /tmp/p01-v225-dev.cookies -X POST http://127.0.0.1:18253/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start Develop Gate' --data-urlencode 'admin_password=P01V225!Develop' --data-urlencode 'admin_password_confirm=P01V225!Develop' >/tmp/p01-v225-dev-post.html
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/p01-v225-dev-b.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v225-dev-b.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v225-dev-b.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v225-dev-b.txt
          test "$(php -r "require 'app/bootstrap.php';echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php';echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v225-dev.pid)" 2>/dev/null || true
      - name: Verdict
        run: |
          echo P01_V225_DEVELOP_EXACT_SOURCE="$DEVELOP"
          echo P01_V225_DEVELOP_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
