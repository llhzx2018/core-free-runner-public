name: P02 V2.5.29 Publication V2
on:
  push:
    branches: [task/p02-v2529-common-baseline-release-20260828]
    paths: ['.github/workflows/p02-v2529-publication-v2-20260828.yml']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Align publication reader with P02 native release-manifest schema
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2529-publication.sh')
          s=p.read_text(encoding='utf-8')
          old="""python3 - <<'PY'\nimport json\nm=json.load(open('VF_Library_V2.5.29_RELEASE_MANIFEST.json',encoding='utf-8'))\nassert m['project_id']=='P02' and m['version']=='2.5.29' and m['schema_version']==2401\nassert m['source_commit']=='387655e222c1fed0b6e4559b66d254dba5d3c8e4'\nassert m['source_tree']=='aac3c6d27a33dbbf9f036720c0f2b66d6dbae5f5'\nassert m['production_changed'] is False\nPY"""
          new="""python3 - <<'PY'\nimport json\nm=json.load(open('VF_Library_V2.5.29_RELEASE_MANIFEST.json',encoding='utf-8'))\nassert m['schema']=='vf-release-manifest/2.1' and m['release_id']=='P02-VF-LIBRARY-2.5.29' and m['version']=='2.5.29'\nassert m['source']['repository']=='llhzx2018/vf-library'\nassert m['source']['candidate_commit']=='387655e222c1fed0b6e4559b66d254dba5d3c8e4'\nassert m['source']['source_tree']=='aac3c6d27a33dbbf9f036720c0f2b66d6dbae5f5'\nassert m['build']['schema']==2401 and m['compatibility']['supported_from']==['2.5.28']\nassert m['compatibility']['source_schema']==2401 and m['compatibility']['target_schema']==2401 and m['compatibility']['schema_migration'] is False\nassert m['deployment']['status']=='NOT_EXECUTED' and m['deployment']['final_online_pass'] is False\nPY"""
          if s.count(old)!=1: raise SystemExit(f'publication manifest anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('P02_PUBLICATION_MANIFEST_SCHEMA_PATCH=PASS')
          PY
      - name: Publish exact verified release and update channel
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: bash scripts/p02-v2529-publication.sh
      - name: Persist publication evidence
        if: success()
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json
          git restore scripts/p02-v2529-publication.sh
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add vf-agent/results/P02-V2.5.29-FORMAL-RELEASE.json
          git commit -m 'evidence(P02): record V2.5.29 formal publication'
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-free-runner-public.git"
          git push origin HEAD:task/p02-v2529-common-baseline-release-20260828
