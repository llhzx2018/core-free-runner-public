name: P05 Single Product Consolidation Phase1 Writer
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p05-single-product-consolidation-phase1.py'
      - '.github/workflows/p05-single-product-consolidation-phase1.yml'
permissions:
  contents: read
jobs:
  write:
    if: github.event.pull_request.head.ref == 'write/p05-single-product-consolidation-phase1-20260902'
    runs-on: ubuntu-24.04
    steps:
      - name: Verify private write capability
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          echo 'P05_CONSOLIDATION_WRITE_CAPABILITY=PASS'
      - name: Checkout disposable writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact P05 Product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: product/single-product-consolidation-phase1-r2-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 2
          path: p05
      - name: Bind exact Product base
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = '2518a8c07fc516de714d275327df49359e9e4719'
          test "$(cat p05/VERSION)" = '1.2.3'
      - name: Apply Single Product Phase1
        run: |
          set -Eeuo pipefail
          python3 scripts/p05-single-product-consolidation-phase1.py
          git -C p05 diff --check
          mapfile -t changed < <(git -C p05 status --porcelain | sed -E 's/^.. //' | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          expected=(
            'src/client/CommonSystemCenter.tsx'
            'src/client/ProductApp.tsx'
            'src/client/main.tsx'
            'tests/contract/single-product-shell.test.ts'
          )
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          test "$(cat p05/VERSION)" = '1.2.3'
          grep -q '<ProductApp />' p05/src/client/main.tsx
          ! grep -q "from './App'" p05/src/client/main.tsx
          ! grep -q 'ProductWorkspaceShortcut' p05/src/client/main.tsx
          ! grep -q 'DemoDatasetShortcut' p05/src/client/main.tsx
          ! grep -q 'Product Optimization Preview' p05/src/client/ProductApp.tsx
          grep -q "document.querySelector('.p05v2-secondary')" p05/src/client/CommonSystemCenter.tsx
          echo 'P05_SINGLE_PRODUCT_SCOPE=PASS'
      - name: Focused contract test
        working-directory: p05
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test tests/contract/single-product-shell.test.ts tests/contract/common-system-human-ui.test.ts
      - name: Commit and push Product candidate
        run: |
          set -Eeuo pipefail
          git -C p05 config user.name 'VictorForge'
          git -C p05 config user.email 'llhzx2018@gmail.com'
          git -C p05 add src/client/main.tsx src/client/ProductApp.tsx src/client/CommonSystemCenter.tsx tests/contract/single-product-shell.test.ts
          git -C p05 commit -m 'feat(P05): consolidate to one Product workspace'
          git -C p05 push origin HEAD:product/single-product-consolidation-phase1-r2-20260902
          echo "P05_CONSOLIDATION_CANDIDATE_SHA=$(git -C p05 rev-parse HEAD)"
          echo "P05_CONSOLIDATION_CANDIDATE_TREE=$(git -C p05 rev-parse HEAD^{tree})"
          echo 'P05_CONSOLIDATION_RELEASE_WRITE=0'
          echo 'P05_CONSOLIDATION_PRODUCTION_WRITE=0'
