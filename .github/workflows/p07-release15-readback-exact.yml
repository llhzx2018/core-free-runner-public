name: P07 Release15 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release15-readback-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 71c327c314e5392a430320b7c2613d4d0ccff664
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release15 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '71c327c314e5392a430320b7c2613d4d0ccff664'
          test "$(cat BUILD_ID)" = '0.1.0-release15'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release15' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = 75ffa26993d79e0d9768c2d0ef13fe42c9ffda25' docs/authority/CURRENT.md
          grep -Fq 'Release15 Distribution Gate           36726942820 PASS' docs/authority/CURRENT.md
          grep -Fq 'Production exact installed Slot 3 Build  0.1.0-release14' docs/authority/CURRENT.md
          grep -Fq 'release15 Production install             NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md

          grep -Fq '| B47 | SQLite WAL Snapshot / Manifest-only Verification |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'RELEASE15_OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release15'
          assert slot3['source_main_commit']=='63e1ebdb0ce043bcb65ec06dbadc9ee69f162954'
          assert slot3['sqlite_snapshot_contract']=='WAL_BACKUP_API_DELETE_JOURNAL_V1'
          assert slot3['sqlite_verification_contract']=='MANIFEST_ONLY_IMMUTABLE_READ_V1'
          assert p['release']['slot3_build']=='0.1.0-release15'
          assert p['release']['public_distribution_commit']=='75ffa26993d79e0d9768c2d0ef13fe42c9ffda25'
          assert p['release']['runtime_manifest_blob']=='eb0d6635e846a19822b354fd114e7c8a74d4fac6'
          assert p['release']['overlay_manifest_blob']=='9fba2e9207831df97df60a9dd3452fe25c1aa70d'
          assert p['release']['final_installer_blob']=='29009fcf49fd79458e391103bbe8be1a868c4c4b'
          assert p['release']['stable_installer_blob']=='5c35e9e05a0f99e559e79c930e118761e07d3d04'
          assert p['release']['toolbox_blob']=='1860eeea3b939c8ca5a475af20c2ef295542ce75'
          assert p['production']['slot3_build']=='0.1.0-release14'
          assert p['production']['release14_owner_real_use']=='REAL_FAIL_SQLITE_INTEGRITY'
          assert p['production']['release15_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert p['production']['release15_owner_real_use']=='PENDING'
          assert p['production']['migration_executed'] is False
          assert p['production']['dns_write'] is False
          assert p['production']['source_delete'] is False
          assert 'source_candidate' not in p
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE15_READBACK_SOURCE=71c327c314e5392a430320b7c2613d4d0ccff664'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
