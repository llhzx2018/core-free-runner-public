name: S01 C01 Recovery Human Language Round 2
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c01-recovery-human-round2-20260907.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-theme
      BRANCH: ux/s01-c01-deep-human-closure-13519-20260907
      HEAD_SHA: 14192d54995a2f1994787ed819bf60938395f673
    steps:
      - name: Patch C01 candidate only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/inc/admin/views/recovery-v510.php')
          s=p.read_text()
          pairs={
          '配置域、消费者与阻断':'设置范围、使用状态与阻断',
          '正在使用主题注册默认值；运行消费者与导出内容已读取同一份有效配置。':'正在使用主题默认值；相关功能与导出内容已读取同一份有效设置。',
          '导出只读；导入和恢复都必须经过预检、保护点、数据库回读与消费者验证。':'导出只读取当前设置；导入和恢复都要先比较差异、建立保护点，并确认保存结果与相关功能都正常。',
          '请先处理失败的配置域、恢复点完整性或消费者断链；导出服务会阻止生成错误备份。':'请先处理异常设置、恢复点或未接通的相关功能；问题解决前不会生成备份。',
          '先核对数据库、恢复点完整性和真实运行消费者；验证通过后生成可下载 JSON，不写入任何配置。':'先确认当前设置、恢复点和相关功能都正常；通过后生成可下载的 JSON 备份，不会修改现有配置。',
          '修复阻断后，系统才会验证数据库、运行消费者和导出文件完整性。':'处理完阻断后，系统会再次确认当前设置、相关功能和备份文件是否完整。',
          '数据库配置、运行消费者和导出文件完整性必须同时通过。':'当前设置、相关功能和备份文件必须同时正常。',
          '失败的配置域':'异常设置',
          '未接通消费者':'未接通的相关功能',
          '浏览器初检不等于通过；服务器会验证合同、版本、Theme 配置域、Renderer Schema、完整性和当前 Revision。':'浏览器初检不等于通过；服务器还会确认文件格式、版本、主题设置结构、完整性和当前配置状态。',
          '<dt>合同</dt>':'<dt>文件类型</dt>',
          '<dt>配置域</dt>':'<dt>设置范围</dt>',
          '<dt>校验和</dt>':'<dt>完整性</dt>',
          '只在导入事务成功后保存':'只在导入成功后保存',
          '预检、校验失败、回读失败或消费者失败时，策略保持原值。':'预检或保存确认失败时，这些设置保持原值。',
          '未来版本、合同不匹配和校验失败始终阻断。':'来自未来版本、文件格式不兼容或完整性检查失败时，系统不会导入。',
          '03 · 服务器预检':'03 · 服务器确认',
          '确认后才会创建保护点、写入、数据库回读并验证消费者。':'确认后才会创建保护点、写入，并再次确认保存结果与相关功能。',
          '<dt>变化配置域</dt>':'<dt>变化设置</dt>',
          '预检 → 保护点 → 写入 → 数据库回读 → 消费者验证':'检查 → 保护点 → 写入 → 确认保存结果 → 检查相关功能',
          '恢复前自动创建当前配置保护点；目标写入后必须完成数据库回读和 Theme 运行消费者验证。':'恢复前会自动保存当前配置保护点；恢复后还会确认保存结果和相关功能是否正常。',
          '确认词必须完整匹配；Revision 已变化时，即使确认词正确也会阻断。':'确认词必须完整匹配；如果页面打开后配置又被其他操作修改，即使确认词正确也会阻止恢复。',
          '恢复顺序：校验 → 保存当前保护点 → 恢复 → 回读 → 消费者验证。':'恢复顺序：检查 → 保存当前保护点 → 恢复 → 确认保存结果 → 检查相关功能。',
          '创建保护点 → 恢复 → 数据库回读 → 消费者验证':'创建保护点 → 恢复 → 确认保存结果 → 检查相关功能',
          '只有现有备份和恢复点都无法修复时使用；会覆盖 Theme 自有配置域。':'只有现有备份和恢复点都无法修复时使用；会覆盖主题自己的设置。',
          '系统先创建保护点，再用主题注册默认值覆盖当前 Theme 配置域。':'系统会先创建保护点，再用主题默认值覆盖当前主题设置。',
          '<li>校验当前 Revision</li>':'<li>确认当前配置状态</li>',
          '<li>覆盖 Theme 自有配置域</li>':'<li>覆盖主题自己的设置</li>',
          '<li>数据库回读并验证 Theme 运行消费者</li>':'<li>重新确认保存结果和相关功能</li>'}
          for a,b in pairs.items():
              if s.count(a)!=1: raise SystemExit('EXACT_REPLACE_FAIL:'+a)
              s=s.replace(a,b,1)
          s=s.replace(' 个配置域</span>',' 类设置</span>',1).replace('?> 消费者</span>','?> 相关功能</span>',1)
          p.write_text(s)
          Path('tests/recovery-human-language-closure-contract.php').write_text("""<?php
          $root=dirname(__DIR__); $v=(string)file_get_contents($root.'/src/inc/admin/views/recovery-v510.php');
          foreach(['设置范围、使用状态与阻断','相关功能与导出内容已读取同一份有效设置','文件格式、版本、主题设置结构、完整性和当前配置状态','<dt>文件类型</dt>','<dt>设置范围</dt>','03 · 服务器确认','确认保存结果 → 检查相关功能','覆盖主题自己的设置'] as $n){if(!str_contains($v,$n)){fwrite(STDERR,"FAIL_REQUIRED:$n\n");exit(1);}}
          foreach(['配置域、消费者与阻断','Renderer Schema','当前 Revision','未接通消费者','<dt>合同</dt>','数据库回读 → 消费者验证','Revision 已变化','Theme 自有配置域'] as $n){if(str_contains($v,$n)){fwrite(STDERR,"FAIL_VISIBLE_ENGINEERING:$n\n");exit(1);}}
          foreach(['data-vf-recovery-revision','data-vf-recovery-preflight-token','runtimeVerification','storeRevision'] as $n){if(!str_contains($v,$n)){fwrite(STDERR,"FAIL_INTERNAL:$n\n");exit(1);}}
          echo "PASS_THEME_RECOVERY_HUMAN_LANGUAGE_CLOSURE\n";
          """)
          PY
          php -l src/inc/admin/views/recovery-v510.php >/dev/null
          php tests/recovery-human-language-closure-contract.php
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/inc/admin/views/recovery-v510.php tests/recovery-human-language-closure-contract.php
          git commit -m 'refine(S01-C01): humanize backup recovery language'
          git push -q origin HEAD:"$BRANCH"
          echo "C01_NEW_HEAD=$(git rev-parse HEAD)"
