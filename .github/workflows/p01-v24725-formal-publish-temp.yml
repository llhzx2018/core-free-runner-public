name: p01-v24725-formal-publish-temp

on:
  push:
    branches:
      - release/p01-v24725-publish

permissions:
  contents: read

concurrency:
  group: p01-v24725-formal-publish
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      FORMAL_SHA: 102954eacf0d5c13620a8235fbdc5e46203658e0
      SOURCE_TAG: v2.47.23
      SOURCE_SHA: d8e73266cd36119e59b42a8f1fafd15e4298713a
      SOURCE_VERSION: 2.47.23
      TARGET_VERSION: 2.47.25
      TARGET_TAG: v2.47.25
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35478632039'
      BACKEND_GATE_RUN: '35478555365'
      BIND_PR: '796'
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact formal authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            echo BLOCK=TARGET_TAG_ALREADY_EXISTS
            exit 81
          fi
          echo P01_V24725_FORMAL_AUTHORITY=PASS

      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.23 baseline
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact source syntax and backend contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' vf-start/docs/release/V2.47.25_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' vf-start/docs/release/V2.47.25_RELEASE_GATE.md
          find vf-start/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find vf-start/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          php vf-start/tests/unit/atomic_runtime_cache_contract.php
          php vf-start/tests/unit/update_recovery_contract.php
          php vf-start/tests/unit/admin_overview_ia_contract.php
          php vf-start/tests/unit/admin_secondary_nav_focus_contract.php
          php vf-start/tests/unit/admin_backend_closure_contract.php
          php vf-start/tests/unit/advanced_manager_daily_entry_contract.php
          php vf-start/tests/unit/admin_visual_system_r3_contract.php
          echo P01_V24725_EXACT_SOURCE_BACKEND_CONTRACTS=PASS

      - name: Rebuild deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v24725-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v24725-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['FORMAL_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['FORMAL_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR='+os.environ['BIND_PR']),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V24725_ATOMIC_CACHE_HANDOFF_20260920'),
            ('V2470','V24725'),('v2470','v24725')
          ]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4',os.environ['SOURCE_VERSION']).replace('__TARGET__',os.environ['TARGET_VERSION'])
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.23 之后 Atomic 当前请求缓存切换的正式发布版本。')",1)
          builder_anchor="    return repair.replace(old,new,1)"
          builder_replacement="    repair=repair.replace(old,new,1)\n    method_anchor=\"    public static function selfTest(): array {\"\n    method=\"    private static function refreshRuntimeCache(string $root): array {\\n        $helper=rtrim($root,'/').'/app/AtomicRuntimeCache.php';\\n        if(!is_file($helper)||is_link($helper))throw new RuntimeException('Atomic runtime cache helper missing.');\\n        require_once $helper;\\n        if(!class_exists('VfAtomicRuntimeCache',false))throw new RuntimeException('Atomic runtime cache helper invalid.');\\n        return VfAtomicRuntimeCache::refresh($root);\\n    }\\n\"\n    if repair.count(method_anchor)!=1: raise SystemExit('atomic cache method anchor mismatch')\n    repair=repair.replace(method_anchor,method+method_anchor,1)\n    current_anchor=\"$dbv=self::dbVerify((string)$rt['db_file']);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors']];\"\n    current_new=\"$dbv=self::dbVerify((string)$rt['db_file']);$runtimeCache=self::refreshRuntimeCache($root);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors'],'runtime_cache'=>$runtimeCache];\"\n    if repair.count(current_anchor)!=1: raise SystemExit('atomic already-current cache anchor mismatch')\n    repair=repair.replace(current_anchor,current_new,1)\n    commit_anchor=\"$dbv=self::dbVerify($db);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\"\n    commit_new=\"$dbv=self::dbVerify($db);$runtimeCache=self::refreshRuntimeCache($root);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\"\n    if repair.count(commit_anchor)!=1: raise SystemExit('atomic commit cache anchor mismatch')\n    repair=repair.replace(commit_anchor,commit_new,1)\n    return_anchor=\"'target_checked'=>$target['checked'],'rollback_supported'=>true];\"\n    return_new=\"'target_checked'=>$target['checked'],'rollback_supported'=>true,'runtime_cache'=>$runtimeCache];\"\n    if repair.count(return_anchor)!=1: raise SystemExit('atomic return cache anchor mismatch')\n    return repair.replace(return_anchor,return_new,1)"
          if builder_anchor not in src: raise SystemExit('builder Atomic cache anchor missing')
          src=src.replace(builder_anchor,builder_replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v24725-artifact-gate.sh
          bash /tmp/p01-v24725-artifact-gate.sh | tee /tmp/p01-v24725-artifact.log
          grep -Fx 'P01_V24725_FORMAL_ARTIFACT_GATE=PASS' /tmp/p01-v24725-artifact.log
          jq -e '.runtime_cache as $r | (($r|type)=="object") and ($r|has("opcache_available")) and ($r|has("files_checked")) and ($r|has("reset"))' /tmp/v24725-formal-upgrade.json >/dev/null
          grep -Fq 'private static function refreshRuntimeCache(string $root): array' /tmp/p01-v24725-formal-artifacts/repair-v2.47.25.php
          grep -Fq 'app/AtomicRuntimeCache.php' /tmp/p01-v24725-formal-artifacts/repair-v2.47.25.php
          grep -Fq 'VfAtomicRuntimeCache::refresh($root)' /tmp/p01-v24725-formal-artifacts/repair-v2.47.25.php
          cmp -s /tmp/p01-v24725-formal-upgrade/app/AdminShell.php vf-start/src/app/AdminShell.php
          ! grep -Fq '系统收件箱' /tmp/p01-v24725-formal-upgrade/app/AdminShell.php
          ! grep -Fq '资源库' /tmp/p01-v24725-formal-upgrade/app/AdminShell.php
          ! grep -Fq '业务分类' /tmp/p01-v24725-formal-upgrade/app/AdminShell.php
          echo P01_V24725_ATOMIC_RUNTIME_CACHE_HANDOFF=PASS
          echo P01_V24725_REAL_UPGRADE=PASS

      - name: Stable package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24725-formal-artifacts
          FULL="$ASSETS/VF-Start-V2.47.25-FULL.zip"
          UPDATE="$ASSETS/VF_Start_V2.47.25_UPDATE.zip"
          for f in "$FULL" "$FULL.sha256" "$UPDATE" "$UPDATE.sha256"; do test -f "$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.25-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.25_UPDATE.zip.sha256)
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n ')" = "$TARGET_VERSION"
          unzip -p "$FULL" release-manifest.json >/tmp/p01-v24725-release-manifest.json
          jq -e --arg t "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg schema "$EXPECTED_SCHEMA" '.version==$t and .source_version==$s and .schema_version==$schema and .source_schema_version==$schema and .schema_change==false and (.schema_migrations|length)==0 and .runtime_data_included==false and .seed_user_business_data_included==false and .update.backup_required==true and .update.rollback_supported==true and .update.single_hop==true and (.update.supported_from==[$s])' /tmp/p01-v24725-release-manifest.json >/dev/null
          test "$(unzip -Z1 "$UPDATE" | wc -l | tr -d ' ')" = 1
          unzip -Z1 "$UPDATE" | grep -Fxq repair-v2.47.25.php
          php "$ASSETS/repair-v2.47.25.php" --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          grep -Fq 'AtomicRuntimeCache.php' "$ASSETS/repair-v2.47.25.php"
          grep -Fq 'VfAtomicRuntimeCache::refresh($root)' "$ASSETS/repair-v2.47.25.php"
          unzip -p "$FULL" app/AdminShell.php >/tmp/p01-v24725-full-adminshell.php
          ! grep -Fq '系统收件箱' /tmp/p01-v24725-full-adminshell.php
          ! grep -Fq '资源库' /tmp/p01-v24725-full-adminshell.php
          ! grep -Fq '业务分类' /tmp/p01-v24725-full-adminshell.php
          ! unzip -Z1 "$FULL" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          (cd "$ASSETS" && sha256sum VF-Start-V2.47.25-FULL.zip VF-Start-V2.47.25-FULL.zip.sha256 VF_Start_V2.47.25_UPDATE.zip VF_Start_V2.47.25_UPDATE.zip.sha256 > SHA256SUMS.txt)
          echo P01_V24725_PACKAGE_CONTRACT=PASS

      - name: Create stable tag and release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24725-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TARGET_TAG}" -f sha="$FORMAL_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          cat >/tmp/p01-v24725-notes.md <<EOF
          # P01 · VF Start V2.47.25

          Atomic 当前请求缓存切换修正版：
          - 正式 UPDATE 直接支持 V2.47.23 → V2.47.25，V2.47.24 被 supersede。
          - Atomic 包写入并验证目标源码后，在同一个升级请求内加载新写入的 AtomicRuntimeCache helper。
          - 强制失效应用 PHP 文件 OPcache、请求 shared OPcache reset，并清理 stat cache。
          - 解决“版本号已升级，但 PHP 仍执行旧 AdminShell 字节码”的运行时 split-brain 风险。
          - 后台菜单目标结构保持：概览 / 资源 / 数据 / 系统 / 设置；活跃分组直接展开真实任务，无装饰性分组小标题、无中转页、无菜单 #anchor。
          - Schema、用户数据与权限不变。

          Exact Formal Source: ${FORMAL_SHA}
          Previous Stable: ${SOURCE_TAG} / ${SOURCE_SHA}
          Schema: ${EXPECTED_SCHEMA} unchanged; Migration: NONE.
          Backend exact-source Gate: ${BACKEND_GATE_RUN} PASS.
          Bound Candidate Gate: ${CANDIDATE_RUN} PASS.
          Formal Release Gate: ${GITHUB_RUN_ID}.
          Strict 2.47.23 → 2.47.25 Atomic Update / Clean FULL / data preservation / backup+rollback / package safety / Atomic runtime-cache handoff: PASS in Formal Gate.
          OWNER_PREVIEW_RUNTIME_APPLICABILITY: N_A by explicit OWNER direct-publish instruction.
          Formal Release / Distribution do not imply Production upgraded.
          EOF
          gh release create "$TARGET_TAG"             "$ASSETS/VF-Start-V2.47.25-FULL.zip"             "$ASSETS/VF-Start-V2.47.25-FULL.zip.sha256"             "$ASSETS/VF_Start_V2.47.25_UPDATE.zip"             "$ASSETS/VF_Start_V2.47.25_UPDATE.zip.sha256"             "$ASSETS/SHA256SUMS.txt"             --repo "$PRODUCT_REPO" --title 'VF Start V2.47.25' --notes-file /tmp/p01-v24725-notes.md --verify-tag
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.prerelease')" = false
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.draft')" = false
          echo P01_V24725_STABLE_RELEASE=PASS

      - name: Independent remote byte readback
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24725-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          rm -rf /tmp/p01-v24725-remote
          mkdir -p /tmp/p01-v24725-remote
          gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24725-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v24725-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.25-FULL.zip','VF-Start-V2.47.25-FULL.zip.sha256','VF_Start_V2.47.25_UPDATE.zip','VF_Start_V2.47.25_UPDATE.zip.sha256','SHA256SUMS.txt']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'FORMAL_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24725_REMOTE_BYTES=PASS')
          PY

      - name: Final formal verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PASS
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=PASS
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=N_A
          echo OWNER_REAL_USE=POST_RELEASE_PENDING
          echo P01_V24725_FORMAL_RELEASE_GATE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template proven formal candidate /tmp/p01-v24725-*
