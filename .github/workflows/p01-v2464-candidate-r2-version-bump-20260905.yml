name: P01 V2.46.4 Candidate R2 Version Identity

on:
  push:
    branches:
      - gate/p01-v2464-candidate-version-bump-20260905
    paths:
      - .github/workflows/p01-v2464-candidate-r2-version-bump-20260905.yml

permissions:
  contents: read

jobs:
  stage-r2:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: baa85b60eab696bacb1a091149bfc502bcc1abb4
      CANDIDATE_BRANCH: release/p01-v2464-maintenance-candidate-r2-20260905
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2464-maintenance-candidate-r2-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: true
          path: source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,mbstring
          coverage: none
      - name: Verify exact base and stage V2.46.4 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          grep -Fxq "define('VF_VERSION', '2.46.3');" src/app/bootstrap.php
          python3 - <<'PY'
          from pathlib import Path
          reps={
            Path('VERSION'):('2.46.3\n','2.46.4\n'),
            Path('src/VERSION.txt'):('2.46.3\n','2.46.4\n'),
            Path('src/app/bootstrap.php'):("define('VF_VERSION', '2.46.3');","define('VF_VERSION', '2.46.4');"),
          }
          for p,(old,new) in reps.items():
              s=p.read_text(encoding='utf-8')
              if s.count(old)!=1: raise SystemExit(f'{p}: version anchor mismatch')
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          test "$(git diff --name-only | sort)" = $'VERSION\nsrc/VERSION.txt\nsrc/app/bootstrap.php'
          test "$(cat VERSION)" = '2.46.4'
          test "$(cat src/VERSION.txt)" = '2.46.4'
          grep -Fxq "define('VF_VERSION', '2.46.4');" src/app/bootstrap.php
          ! git diff --name-only | grep -Eq '^src/migrations/'
      - name: R2 source regressions including refreshed Course contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          php -l src/app/bootstrap.php >/dev/null
          php tests/unit/course_experience_source_contract.php
          php tests/unit/uxui_round3_course_identity_contract.php
          php tests/unit/consolidated_product_acceptance_contract.php
          for f in tests/unit/uxui_round1_home_root_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/uxui_round7_navigation_home_identity_contract.php tests/unit/uxui_round8_visual_system_contract.php; do php "$f"; done
          echo P01_V2464_R2_SOURCE_REGRESSIONS=PASS
      - name: Commit Candidate R2 identity only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd source
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): stage V2.46.4 maintenance candidate R2'
          SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "P01_V2464_CANDIDATE_R2_SHA=$SHA"
          echo P01_V2464_CANDIDATE_R2_VERSION_IDENTITY=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo RELEASE_MUTATION=NO
          echo CORE_UPDATES_MUTATION=NO
          echo PRODUCTION_MUTATION=NO
