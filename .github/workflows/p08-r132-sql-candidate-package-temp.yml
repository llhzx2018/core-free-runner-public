name: P08 R133 MySQL MariaDB exact-head candidate FULL and onefile byte parity TEMP
on:
  pull_request:
    paths: [.github/workflows/p08-r132-sql-candidate-package-temp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pSyntheticP08Only123 --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: SyntheticP08Only123
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_R130_ISOLATED: "YES"
      P08_R132_ISOLATED: "YES"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_TEST_DB_HOST: "127.0.0.1"
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_USER: "root"
      P08_TEST_DB_PASSWORD: "SyntheticP08Only123"
      P08_CANDIDATE_SOURCE_SHA: b371cc6d8f52089b818bf1990f245bd25007f931
      P08_CANDIDATE_VERSION: "0.1.4"
    steps:
      - name: Setup PHP8.4 and isolated runtime extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,sqlite3,pdo_sqlite,pdo_mysql,posix,mbstring,dom,curl
          coverage: none
          tools: composer:v2
      - name: Node22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout only exact private source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b371cc6d8f52089b818bf1990f245bd25007f931
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p08-source
          persist-credentials: false
      - name: Compile locked Composer plus Vite source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08-source rev-parse HEAD)" = "b371cc6d8f52089b818bf1990f245bd25007f931"
          test "$(cat p08-source/VERSION)" = '0.1.4'
          cd p08-source
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/p08-r132-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r132-node.log" 2>&1
          npm run build >> "$RUNNER_TEMP/p08-r132-node.log" 2>&1
          python3 -B -m unittest discover -s tests -p 'test_r132_live_release_proof.py' -v
          python3 -B -m py_compile scripts/build_r130_onefile.py scripts/r132_live_release_proof.py tests/compatibility/r132_candidate_package_gate.py
          echo P08_R132_LOCKED_CANDIDATE_RUNTIME_BUILD_AND_NEGATIVE_UNIT=PASS
      - name: Download exact issued official v0.1.3 FULL zip
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r132-issued-013.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r132-issued-013.zip" | sha256sum -c --status
          test "$(wc -c < "$RUNNER_TEMP/p08-r132-issued-013.zip")" -eq 8294042
          echo P08_R132_OFFICIAL_013_FULL_BYTES_AND_SHA256=PASS
      - name: Build exact candidate FULL and Atomic twice with source-bound old manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p08-source
          python3 -B - <<'PY'
          import hashlib,os,sys,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from build_full import write_full
          from build_atomic import write_atomic
          t=Path(os.environ['RUNNER_TEMP'])
          root=Path('.')
          target='b371cc6d8f52089b818bf1990f245bd25007f931'
          with zipfile.ZipFile(t/'p08-r132-issued-013.zip') as z:
              oldhash=hashlib.sha256(z.read('FULL_MANIFEST.json')).hexdigest()
          write_full(root,t/'p08-r132-candidate-full.zip','0.1.4',target)
          write_atomic(root,t/'p08-r132-candidate-atomic.zip',
              source_version='0.1.3',
              source_sha='44d504185f0ac8cf4be552dc5adada989a08b40e',
              source_full_manifest_sha256=oldhash,
              target_version='0.1.4',target_sha=target)
          print('P08_R132_CANDIDATE_CODE_ONLY_FULL_ATOMIC_CREATED_NOT_RELEASED=PASS')
          PY
          python3 -B tests/compatibility/r132_candidate_package_gate.py \
            --full "$RUNNER_TEMP/p08-r132-candidate-full.zip" \
            --atomic "$RUNNER_TEMP/p08-r132-candidate-atomic.zip" \
            --old "$RUNNER_TEMP/p08-r132-issued-013.zip" \
            --source "$GITHUB_WORKSPACE/p08-source" --sha "b371cc6d8f52089b818bf1990f245bd25007f931"
          php -l "$RUNNER_TEMP/p08-owner-forward-once.php"
      - name: Actual extracted candidate FULL clean Owner installation
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/p08-r132-sql-$P08_TEST_DB_DRIVER-full"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/p08-r132-candidate-full.zip" -d "$site"
          php p08-source/tests/test_install_cloudpanel_hyphen_e2e.php "$site"
          echo P08_R132_CANDIDATE_CLEAN_FULL_NATIVE_SQL_HYPHEN_OWNER_INSTALL=PASS
      - name: Official release negative check (no new tag means no publishable onefile)
        shell: bash
        env:
          P08_RELEASE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p08-source
          python3 -B - <<'PY'
          import hashlib,sys,os
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from r132_live_release_proof import require_official_next_release
          t=Path(os.environ['RUNNER_TEMP']); f=t/'p08-r132-candidate-full.zip';a=t/'p08-r132-candidate-atomic.zip'
          try:
              require_official_next_release('b371cc6d8f52089b818bf1990f245bd25007f931',hashlib.sha256(f.read_bytes()).hexdigest(),f.stat().st_size,hashlib.sha256(a.read_bytes()).hexdigest(),a.stat().st_size)
          except ValueError as e:
              if str(e)!='R132_OFFICIAL_NEXT_NOT_PUBLISHED': raise
          else:
              raise RuntimeError('R132_UNAUTHORIZED_RELEASE_EXISTS_REQUIRE_NEW_APPROVAL')
          print('P08_R132_REAL_GITHUB_UNISSUED_NEXT_BLOCKED=PASS')
          PY
      - name: Always purge transient private source, official zip and synthetic site
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-r132-* "$RUNNER_TEMP/p08-owner-forward-once.php"
