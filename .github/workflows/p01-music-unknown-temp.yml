name: p01-music-unknown-readback-guard
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-music-unknown-temp.yml'
      - 'specs/p01_music_unknown_readback.json'
      - 'templates/p01_music_unknown.yml.in'
permissions:
  contents: read
jobs:
  exact-music:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      WORK: /tmp/p01-music-unknown-${{ github.run_id }}
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.504
      TARGET_SHA: f20988617893f8f194cb019dcc1cf592f050c46e
      TARGET_TREE: 93bf694c9bc6c9e476915990c8a15c09c2508077
      HEAD_BRANCH: feat/p01-cross-subsite-legacy-watch-tmdb-parity
      BASE_SHA: 465890414fa9981af3ac8797c65f84f75db0d946
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Strict single-source render and identity audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          python3 scripts/ephemeral_lane_spec.py validate --spec specs/p01_music_unknown_readback.json >/dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/p01_music_unknown_readback.json --input .github/workflows/p01-music-unknown-temp.yml
          python3 scripts/ephemeral_lane_spec.py render --spec specs/p01_music_unknown_readback.json --template templates/p01_music_unknown.yml.in --output "$WORK/rendered.yml"
          cmp "$WORK/rendered.yml" .github/workflows/p01-music-unknown-temp.yml
          echo P01_MUSIC_UNKNOWN_RUNNER_RENDER=PASS
      - name: Fetch and lock exact private P01 source (transient)
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "$WORK/candidate"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/$TARGET_REPO.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          git -C "$WORK/candidate" diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > "$WORK/diff.txt"
          printf '%s\n' src/assets/frontstage-legacy-entry.js src/assets/global-remote-music.js src/settings.php tests/unit/p01_ia5_remote_music_quick_r48_contract.cjs tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs tests/unit/p01_ia6_music_remote_unknown_readback_guard_contract.cjs | sort > "$WORK/expected.txt"
          cmp "$WORK/expected.txt" "$WORK/diff.txt"
          echo P01_MUSIC_UNKNOWN_EXACT_SIX_FILE_SCOPE=PASS
      - name: Verify real JS and actual unknown-commit readback behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/candidate"
          for f in src/assets/global-remote-music.js src/assets/frontstage-legacy-entry.js tests/unit/p01_ia6_music_remote_unknown_readback_guard_contract.cjs; do node --check "$f"; done
          node tests/unit/p01_ia6_music_remote_unknown_readback_guard_contract.cjs
          node tests/unit/p01_ia5_remote_music_r30_contract.cjs
          node tests/unit/p01_ia5_remote_music_quick_r48_contract.cjs
          node tests/unit/p01_ia6_music_unknown_write_dialog_guard_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          echo P01_MUSIC_UNKNOWN_SOURCE_BEHAVIOR_MACHINE=PASS
      - name: Always clear private runtime checkout
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_MUSIC_UNKNOWN_PUBLIC_ARTIFACT=NONE
          echo P01_MUSIC_UNKNOWN_PRODUCTION_WRITES=NONE
          case "$WORK" in /tmp/p01-music-unknown-*) rm -rf -- "$WORK";; *) exit 66;; esac
