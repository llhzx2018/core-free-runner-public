name: temp-s01-theme-13523-runtime-authority-probe-20260909
on:
  push:
    branches: [temp/s01-theme-13523-preview-release-20260909]
    paths:
      - '.github/workflows/temp-s01-theme-13523-runtime-authority-probe-20260909.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ASSET: vf-tools-theme_V1.35.23.zip
      EXPECTED_BYTES: '1829351'
      EXPECTED_SHA256: ac0a8a12a29b0674723c301e8a32a87fd80fa3970c624714c76db72477534f3e
    steps:
      - name: Compute authority from delivered Theme release asset
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          rm -rf /tmp/release /tmp/unpack
          mkdir -p /tmp/release /tmp/unpack
          gh release download v1.35.23 --repo llhzx2018/vf-tools-theme --pattern "$ASSET" --dir /tmp/release
          test "$(stat -c %s /tmp/release/$ASSET)" = "$EXPECTED_BYTES"
          test "$(sha256sum /tmp/release/$ASSET | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -q /tmp/release/$ASSET -d /tmp/unpack
          test -f /tmp/unpack/vf-tools-theme/style.css
          grep -F 'Version: 1.35.23' /tmp/unpack/vf-tools-theme/style.css >/dev/null
          test ! -e /tmp/unpack/vf-tools-theme/assets/js/admin/admin-seo-page-refinement-v1.js
          cat >/tmp/theme-authority.php <<'PHP'
          <?php
          define('ABSPATH','/');
          class WP_Error { public function __construct(...$x){} }
          require $argv[1].'/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot($argv[1]);
          if ($s instanceof WP_Error) { fwrite(STDERR,"AUTHORITY_ERROR\n"); exit(1); }
          unset($s['files']);
          echo json_encode($s, JSON_UNESCAPED_SLASHES), "\n";
          PHP
          php /tmp/theme-authority.php /tmp/unpack/vf-tools-theme >/tmp/authority.json
          jq -e '.component_id=="S01-C01" and .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1"' /tmp/authority.json >/dev/null
          echo "C01_RUNTIME_FILES=$(jq -r '.file_count' /tmp/authority.json)"
          echo "C01_RUNTIME_FP=$(jq -r '.fingerprint_sha256' /tmp/authority.json)"
          echo 'PASS_S01_C01_13523_DELIVERED_RUNTIME_AUTHORITY'