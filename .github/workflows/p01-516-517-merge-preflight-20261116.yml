name: P01 v517 exact-source final security route architecture canonical regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pre-release-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_SHA: 7ad6c67e76864f983e08d7b975f1ae9e028e2ecf
      TESTED_CODE_SHA: 7305ccb164684bd4495cf025c9d49734872334b1
      BRIDGE_SHA: cc92515a4eb782a48b47db7f30703a7fbceb6cf7
      BASE_SHA: defaf3db8bd94adc9909e1783ec2134e03b44410
    steps:
      - name: Public-safe one-off branch identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-517-gated-source-preflight-20261116"
      - name: Checkout exact integrated private candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEXT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout public current GOV source for mandatory project architecture check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-doc
          persist-credentials: false
      - name: Prepare real baseline source and no-code-drift verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$NEXT_SHA"
          test "$(cat product/VERSION)" = "2.47.517"
          test "$(cat product/src/VERSION.txt)" = "2.47.517"
          git -C product merge-base --is-ancestor "$BASE_SHA" "$NEXT_SHA"
          git -C product merge-base --is-ancestor "$BRIDGE_SHA" "$NEXT_SHA"
          git -C product merge-base --is-ancestor "$TESTED_CODE_SHA" "$NEXT_SHA"
          test -f product/src/app/next/runtime/MajorOfflineJournalMethods.php
          test -f product/src/app/LegacyMajorRescueInventoryMethods.php
          test -f product/scripts/p01_bridge_legacy_io.py
          git -C product worktree add --detach "$RUNNER_TEMP/p01-515-baseline" "$BASE_SHA" >/dev/null
          echo P01_517_INTEGRATED_EXACT_SOURCE_NO_CODE_DRIFT=PASS
      - name: Install PHP CLI for canonical source and safety unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-mbstring php8.3-sqlite3 php8.3-zip php8.3-gd php8.3-xml php8.3-intl >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          command -v php
          php -v | head -n 1
      - name: Mandatory new architecture naming and real Git diff gate
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/app/LegacyMajorFullRestorePoint.php src/app/LegacyMajorRescueInventoryMethods.php src/app/LegacyMajorOwnerApiActions.php src/app/LegacyMajorPackageStage.php src/app/LegacyMajorPackagePreparationMethods.php src/app/next/runtime/MajorOfflineNextInstall.php src/app/next/runtime/MajorOfflineSourceMethods.php src/app/next/runtime/MajorOfflineSealedStageMethods.php src/app/next/runtime/MajorOfflineJournalMethods.php src/app/next/runtime/MajorBridgeRestoreIntake.php src/app/next/runtime/MajorBridgeRestoreValidationMethods.php src/app/CoreUpdates/GitHubClient.php src/app/CoreUpdates/GitHubMajorReleaseMethods.php; do
            php8.3 -l "product/$f" >/dev/null
          done
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ("build_p01_247516_legacy_atomic.py", "p01_bridge_legacy_cli.py", "p01_bridge_legacy_io.py"):
              ast.parse((Path("product/scripts")/name).read_text())
          PY
          echo P01_517_REFACTORED_MAJOR_PHP_AND_BUILDER_SYNTAX=PASS
          python3 -B product/.github/checks/test_architecture_gate.py >/dev/null
          python3 -B product/.github/checks/architecture_gate.py             --manifest product/.github/checks/code_architecture.json             --gov-root gov-doc --base-sha "$BASE_SHA" --head-sha "$NEXT_SHA"             --git-root product >"$RUNNER_TEMP/p01-arch.txt" 2>&1 || {
              grep -E 'PROJECT_ARCHITECTURE=|Traceback|Error' "$RUNNER_TEMP/p01-arch.txt" | head -n 6 || true
              exit 1
            }
          grep -F 'PROJECT_ARCHITECTURE=STRUCTURAL_PASS' "$RUNNER_TEMP/p01-arch.txt" >/dev/null
          echo P01_517_REAL_GIT_ARCHITECTURE_NAMING=PASS
      - name: Current target implementation and three engine adapter source checks
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B product/scripts/check_p01_fullstack_contract.py --root product --implementation --database-adapter >"$RUNNER_TEMP/p01-tech.txt" 2>&1 || {
            grep -Eo 'P01_STACK_CONTRACT=FAIL[^\r\n]*|P01_[A-Z0-9_]{5,90}' "$RUNNER_TEMP/p01-tech.txt" | head -n 9 || true
            exit 1
          }
          grep -F 'P01_STACK_STRUCTURE=PASS' "$RUNNER_TEMP/p01-tech.txt"
          echo P01_517_FULLSTACK_SOURCE_AND_DATABASE_ADAPTER=PASS
      - name: Exact 515 to 517 canonical regression, protected major safety and source checks
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd product && bash tests/canonical_release_regression.sh "$PWD" "$RUNNER_TEMP/p01-515-baseline" >"$RUNNER_TEMP/p01-canonical.txt" 2>&1) || {
            grep -E '^(P01_|PROJECT_|BUILD_|ERROR|Fatal|FAIL|NEW_UNIT_REGRESSION=|CHANGED_TEST_FAILURE=)' "$RUNNER_TEMP/p01-canonical.txt" | tail -n 24 || true
            exit 1
          }
          grep -F 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$RUNNER_TEMP/p01-canonical.txt"
          grep -F 'P01_STACK_CANONICAL_SOURCE_GATE=PASS' "$RUNNER_TEMP/p01-canonical.txt"
          echo P01_517_515_TO_517_CANONICAL_RELEASE_SOURCE=PASS
      - name: One-pass complete scope of new-file architecture blocker
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product diff --name-only --diff-filter=A "$BASE_SHA" "$NEXT_SHA" -- src scripts > "$RUNNER_TEMP/p01-added.txt"
          python3 - <<'PY'
          from pathlib import Path
          root=Path("product")
          paths=Path(__import__("os").environ["RUNNER_TEMP"]+"/p01-added.txt").read_text().splitlines()
          rows=[]
          for name in paths:
              p=root/name
              if p.is_file() and p.suffix in {".php",".py",".vue",".js",".ts",".tsx"}:
                  lines=len(p.read_bytes().splitlines())
                  if lines>400:
                      rows.append((name,lines))
          print(f"P01_ARCH_NEW_HANDWRITTEN_CODE_FILES_OVER_400={len(rows)}")
          for name,lines in sorted(rows):
              print(f"P01_ARCH_OVER_400={name}:{lines}")
          PY
      - name: Release preflight aggregator with explicit blocked result
        shell: bash
        run: |
          set -Eeuo pipefail
          for part in arch tech canonical; do
            log="$RUNNER_TEMP/p01-$part.txt"
            case "$part" in
              arch) marker='PROJECT_ARCHITECTURE=STRUCTURAL_PASS' ;;
              tech) marker='P01_STACK_STRUCTURE=PASS' ;;
              canonical) marker='P01_CANONICAL_UNIT_REGRESSION=PASS' ;;
            esac
            if [ -s "$log" ] && grep -Fq "$marker" "$log"; then
              echo "P01_517_RELEASE_SOURCE_${part^^}=PASS"
            else
              echo "P01_517_RELEASE_SOURCE_${part^^}=BLOCKED"
              fail=1
            fi
          done
          if [ "${fail:-0}" -ne 0 ]; then
            echo P01_517_RELEASE_PREFLIGHT=BLOCKED_NOT_FORMAL_RELEASE_READY
            exit 1
          fi
          echo P01_517_RELEASE_SOURCE_REGRESSION=PASS
      - name: Clean private source and temporary baseline
        if: always()
        shell: bash
        run: |
          rm -rf -- product gov-doc "$RUNNER_TEMP/p01-515-baseline"
          rm -f -- "$RUNNER_TEMP"/p01-apt.txt "$RUNNER_TEMP"/p01-arch.txt "$RUNNER_TEMP"/p01-tech.txt "$RUNNER_TEMP"/p01-canonical.txt "$RUNNER_TEMP"/p01-added.txt
          test ! -e product && test ! -e gov-doc && test ! -e "$RUNNER_TEMP/p01-515-baseline"
          echo P01_RUNNER_PRIVATE_SOURCE_AND_BASELINE_PERSISTED=NO
