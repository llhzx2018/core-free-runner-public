name: P01 516→517 exact Git merge integration preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  merge-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      BRIDGE_SHA: 119cd57fe7cf3f998266460698f3dd55985bca88
      LARAVEL_SHA: 002e873d313d5c56a2c3bd6f2e2a0ebab101ffe9
    steps:
      - name: Checkout registered public-safe harness
        uses: actions/checkout@v4
      - name: Check exact one-off identity
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = 'test/p01-516-517-merge-preflight-20261116'
          test "${#BRIDGE_SHA}" -eq 40 && test "${#LARAVEL_SHA}" -eq 40
      - name: Checkout private bridge exact immutable SHA
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ref: ${{ env.BRIDGE_SHA }}
          path: bridge-src
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout private Laravel exact immutable SHA
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          ref: ${{ env.LARAVEL_SHA }}
          path: next-src
          persist-credentials: false
          fetch-depth: 0
      - name: Real Git merge of bridge into Laravel and conflict-only readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C next-src rev-parse HEAD)" = "$LARAVEL_SHA"
          test "$(cat bridge-src/VERSION)" = 2.47.516
          test "$(cat next-src/VERSION)" = 2.47.517
          git -C next-src config user.name P01-Offline-Integration
          git -C next-src config user.email p01-integration@localhost.invalid
          git -C next-src fetch --quiet ../bridge-src "$BRIDGE_SHA"
          ancestor="$(git -C next-src merge-base "$LARAVEL_SHA" "$BRIDGE_SHA")"
          test "${#ancestor}" -eq 40
          echo P01_516_517_SHARED_MERGE_BASE=VERIFIED
          set +e
          git -C next-src merge --no-ff --no-commit "$BRIDGE_SHA" > "$RUNNER_TEMP/p01-git-merge.txt" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo P01_516_517_GIT_CLEAN_MERGE=PASS
            echo P01_516_517_MERGE_CONFLICT_COUNT=0
            test "$(cat next-src/VERSION)" = 2.47.517
          else
            git -C next-src diff --name-only --diff-filter=U | LC_ALL=C sort > "$RUNNER_TEMP/p01-conflict-files.txt"
            count="$(wc -l < "$RUNNER_TEMP/p01-conflict-files.txt" | tr -d ' ')"
            echo "P01_516_517_MERGE_CONFLICT_COUNT=$count"
            echo 'P01_516_517_CONFLICT_PATHS_BEGIN'
            cat "$RUNNER_TEMP/p01-conflict-files.txt"
            echo 'P01_516_517_CONFLICT_PATHS_END'
            test "$count" -gt 0
            echo P01_516_517_UNRESOLVED_MERGE=BLOCKED_BY_REAL_CONFLICTS
          fi
          echo P01_516_517_RELEASE_OR_PRODUCTION_WRITES=NONE
      - name: Cleanup all private source from public Runner
        if: always()
        shell: bash
        run: |
          rm -rf -- bridge-src next-src
          rm -f -- "$RUNNER_TEMP/p01-git-merge.txt" "$RUNNER_TEMP/p01-conflict-files.txt"
          test ! -e bridge-src && test ! -e next-src
          echo P01_PRIVATE_SOURCE_PERSISTED=NO
