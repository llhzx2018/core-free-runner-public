name: P01 v517 exact-current unit failures one-pass inventory
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      NEXT_SHA: c5905fdc274ab8070f33b5149c5f31c73f174227
    steps:
      - name: Strict oneoff invocation and private exact checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.NEXT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: PHP CLI dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >"$RUNNER_TEMP/php-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-mbstring php8.3-sqlite3 php8.3-zip php8.3-gd php8.3-xml php8.3-intl >>"$RUNNER_TEMP/php-apt.txt" 2>&1
          test "$(git -C product rev-parse HEAD)" = "$NEXT_SHA"
      - name: Execute every current PHP unit in isolation and report ONLY failing paths
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          fails=0
          for file in product/tests/unit/*.php; do
            count=$((count+1))
            set +e
            timeout 15s php "$file" >"$RUNNER_TEMP/p01-one-unit-log.txt" 2>&1
            result=$?
            set -e
            if [ "$result" -ne 0 ]; then
              fails=$((fails+1))
              echo "P01_517_FAILED_UNIT_PATH=${file#product/}"
              echo "P01_517_FAILED_UNIT_EXIT=$result"
              grep -E -m 2 'Fatal error|PHP Fatal|Uncaught|Assertion|failed|FAIL|RuntimeException|Error:' "$RUNNER_TEMP/p01-one-unit-log.txt" | sed -E 's/([A-Za-z0-9_+.-]{28,})/[redacted]/g' | cut -c 1-200 || true
            fi
          done
          echo "P01_517_CURRENT_UNIT_FILES_EXECUTED=$count"
          echo "P01_517_CURRENT_UNIT_FAILURES=$fails"
          test "$fails" -eq 0
      - name: Cleanup all private source
        if: always()
        run: |
          rm -rf -- product
          rm -f -- "$RUNNER_TEMP/php-apt.txt" "$RUNNER_TEMP/p01-one-unit-log.txt"
          test ! -e product
          echo P01_RUNNER_PRIVATE_SOURCE_PERSISTED=NO
