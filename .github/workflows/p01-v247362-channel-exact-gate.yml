name: P01 V2.47.362 Channel Exact Independent Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p01-v247362-channel-exact-gate.yml'
permissions:
  contents: read
jobs:
  exact-channel:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-v247362-channel-exact-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact core-updates candidate manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 8e5fc5e2fdf50232b9c9aa54d10242ac8adf2257
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Validate exact P01 manifest, all manifests and native update core
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd channel
          test "$(git rev-parse HEAD)" = 8e5fc5e2fdf50232b9c9aa54d10242ac8adf2257
          python3 scripts/check_manifest_contract.py > /tmp/channel-manifest-report.json
          jq -e '.status=="PASS"' /tmp/channel-manifest-report.json > /dev/null
          jq -e '.project_id=="P01" and .current_version=="2.47.361" and .target_version=="2.47.362" and
                  .update_type=="ATOMIC" and .from_versions==["2.47.361"] and
                  .release_tag=="v2.47.362" and .release_id==412268450 and
                  .product_identity=="968eda659d96a794f2ccb3b728431741b2ad47ea" and
                  .asset_name=="VF_Start_V2.47.362_UPDATE.zip" and
                  .asset_bytes==2496053 and
                  .asset_sha256=="e7ad70ca38b5ea33831f82230fc7d28342c3b6c861872f9aab851d8c1131d3d3" and
                  .backup_required==true and .rollback_supported==true and
                  .schema_from==.schema_to' projects/P01.json >/dev/null
          echo P01_DISTRIBUTION_MANIFEST_EXACT=PASS
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/update-core-php-lint.txt
          php update-core/php/tests/run.php | tee /tmp/update-core-regression.txt
          echo P01_CHANNEL_UPDATE_CORE_REGRESSION=PASS
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.362 --jq '
            . as $r | ($r.assets[] | select(.name=="VF_Start_V2.47.362_UPDATE.zip")) as $a |
            ($r.id==412268450 and $a.size==2496053 and
              $a.digest=="sha256:e7ad70ca38b5ea33831f82230fc7d28342c3b6c861872f9aab851d8c1131d3d3")
          ' | grep -Fx true
          echo P01_CHANNEL_REMOTE_RELEASE_INTEGRITY=PASS
