name: P07 native full audit owner-order regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/p07-vps-audit-v227-r1.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-vps-audit-native-stream-gate.yml'
permissions:
  contents: read
jobs:
  native-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate original configuration-first execution and native route
        shell: bash
        run: |
          set -Eeuo pipefail
          file=experiments/p07-vps-audit-v227-r1.sh
          bash -n "$file"
          bash -n installers/p07-toolbox.sh
          test "$(bash "$file" --build-id)" = '2.2.7-rc1-full-native-stream'
          test "$(bash "$file" --version | awk '{print $NF}')" = 'V2.2.7'
          bash "$file" --self-test | grep -Fx 'P07_VPS_VALUE_VERDICT_SELF_TEST=PASS'
          bash "$file" --help | grep -Fq '首先显示服务器基础配置'
          bash "$file" --help | grep -Fq '全球和大陆网络测速'
          bash "$file" --help | grep -Fq '增强 fio'
          grep -Fq 'timeout --signal=TERM --kill-after=5s 720s bash "$BASE" 2>&1 | tee "$OUT"' "$file"
          grep -Fq '服务器配置 → CPU / 磁盘 → 全球测速' "$file"
          grep -Fq '12 分钟' "$file"
          grep -Fq 'heartbeat_pid' "$file"
          ! grep -Fq "awk '/Speedtest" "$file"
          ! grep -Fq 'render_vps_audit_output' installers/p07-toolbox.sh
          grep -Fq '  bash "$tmp"' installers/p07-toolbox.sh
          printf 'P07_V227_SHA256=%s\n' "$(sha256sum "$file" | awk '{print $1}')"
          echo P07_NATIVE_ORDER_GUARD=PASS
      - name: Synthetic no-work source must stream unfiltered and reject invented PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          file=experiments/p07-vps-audit-v227-r1.sh
          start="$(date +%s)"
          set +e
          P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_V21_SKIP_ROUTE=1 NO_COLOR=1 \
            timeout --signal=TERM --kill-after=3s 75s bash "$file" > /tmp/p07-native.txt 2>&1
          rc=$?
          set -e
          cat /tmp/p07-native.txt
          test "$rc" -eq 12
          grep -Fq 'P07 VPS 一键验机 V2.1.0' /tmp/p07-native.txt
          grep -Fq '增强磁盘低负载测试' /tmp/p07-native.txt
          grep -Fq '中国三网回程' /tmp/p07-native.txt
          grep -Fq '基础 CPU 或磁盘证据不足' /tmp/p07-native.txt
          test "$(date +%s)" -le "$((start+75))"
          echo P07_NATIVE_FULL_STREAM_SYNTHETIC=PASS
