name: S01 Ops 1.21.1110 formal release exact main
on:
  push:
    branches: [task/s01-c02-1211110-package-gate-20261013]
    paths: [.github/workflows/s01-c02-1211110-formal-release.yml]
permissions:
  contents: read
jobs:
  ops-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: c8f3fa9c911071f141978ddd20d1368e9049f3b8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Verify merged Git tree equals tested PR candidate, version and gate result
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = c8f3fa9c911071f141978ddd20d1368e9049f3b8
          test "$(git -C source rev-parse HEAD^{tree})" = 5acf67ecb2e18f3308f7c497cdbb3df78d88b615
          test "$(cat source/VERSION)" = 1.21.1110
          test "$(gh api repos/llhzx2018/vf-tools-ops/branches/main --jq .commit.sha)" = c8f3fa9c911071f141978ddd20d1368e9049f3b8
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38381336776 --jq .conclusion)" = success
          if gh release view v1.21.1110 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then echo "FORMAL_TAG_EXISTS_FAIL_CLOSED"; exit 1; fi
          echo S01_OPS_1110_SOURCE_AND_TESTED_TREE_MATCH_PASS
      - name: Rebuild and verify exact candidate fingerprint
        run: |
          set -Eeuo pipefail
          mkdir -p release
          python3 source/.github/release/build-ops-package.py --source source --output release/vf-tools-ops_V1.21.1110.zip > release/meta.json
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('release/vf-tools-ops_V1.21.1110.zip')
          m=json.loads(pathlib.Path('release/meta.json').read_text())
          assert m['version']=='1.21.1110' and m['asset_bytes']==3581457
          assert m['runtime_files']==990
          assert m['runtime_fingerprint']=='91a2836a878a7d0a11351762339eca1fe2e428b0b3e1b0f5130fd2cd995dff32'
          assert m['asset_sha256']=='c9881d65f51235fa474293601307efbee7b831ae2576a31a70ad6acdff3c65f9'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['asset_sha256']
          print('S01_OPS_1110_CANDIDATE_BYTE_EXACT_PASS')
          PY
      - name: Publish Release tag and actual ZIP, then remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release create v1.21.1110 release/vf-tools-ops_V1.21.1110.zip --repo llhzx2018/vf-tools-ops --target c8f3fa9c911071f141978ddd20d1368e9049f3b8 --title "VF Tools Ops 1.21.1110" --notes "S01 Ops bundled tested read-side truth fixes: PR #408 bounded content/media scan fail-closed, #409 scan progress integrity, #410 Quality P0/P1/SCAN verdict correctness, #411 Publish ZIP current-vs-historic evidence. Exact main build, deterministic package and disposable real WordPress 1.21.1109→1110→1109→1110 with MariaDB and latest Theme/M3U8 PASS (Runner #38381336776). Draft PR #407 protected six-setting POST and Draft #357 recovery NOT included, their independent safety gates remain pending. Production only OWNER manual."
          mkdir -p remote
          gh release download v1.21.1110 --repo llhzx2018/vf-tools-ops --pattern vf-tools-ops_V1.21.1110.zip --dir remote
          cmp release/vf-tools-ops_V1.21.1110.zip remote/vf-tools-ops_V1.21.1110.zip
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.1110 --jq .object.sha)" = c8f3fa9c911071f141978ddd20d1368e9049f3b8
          test "$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.1110 --jq '.assets[0].digest')" = sha256:c9881d65f51235fa474293601307efbee7b831ae2576a31a70ad6acdff3c65f9
          echo S01_OPS_1110_FORMAL_REMOTE_TAG_AND_ZIP_PASS
      - name: Cleanup temporary source and asset bytes
        if: always()
        run: rm -rf source release remote
