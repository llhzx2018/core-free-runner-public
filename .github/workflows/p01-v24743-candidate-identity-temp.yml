name: p01-v24743-candidate-identity-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24743-candidate-identity-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 9550e663521d21ff00270890415ba3e4a6d05be6
      PRE_IDENTITY_SHA: 1a3f48b6ef8d2323979b4a84b7cd003ae9b57e4f
      STABLE_TAG: v2.47.42
    steps:
      - name: Checkout exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.43"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.43"
          grep -F "define('VF_VERSION', '2.47.43');" candidate/src/app/bootstrap.php >/dev/null
          echo P01_V24743_EXACT_CANDIDATE=PASS

      - name: Verify identity-only final delta
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin "$PRE_IDENTITY_SHA"
          git -C candidate diff --name-only "$PRE_IDENTITY_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          php candidate/tests/unit/engineering_consistency_r80_contract.php
          echo P01_V24743_IDENTITY_DELTA=PASS

      - name: Canonical zero-debt against live stable
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          git -C stable fetch -q --depth 1 origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
          git -C stable checkout -q --detach "$STABLE_TAG"
          test "$(git -C stable rev-parse HEAD)" = "63aece29b7562a800d6771a1479bcfc9faa26cab"
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_V24743_CANDIDATE_CANONICAL=PASS
