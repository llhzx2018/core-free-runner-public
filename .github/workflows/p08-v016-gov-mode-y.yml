name: P08 v016 combined PR94+PR97 Mode Y GOV-DOC exact-source lint
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-gov-mode-y.yml
permissions:
  contents: read
jobs:
  p08-v016-gov-doc:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-gov-mode-y-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ephemeral public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private GOV-DOC PR head with no saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: fd940b8f6df3f6846d4142eb0c686bb80a825a4f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
          fetch-depth: 0
      - name: Validate actual GOV-DOC exact SHA, pointer and allowed one-case changes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          test "$(git rev-parse HEAD)" = fd940b8f6df3f6846d4142eb0c686bb80a825a4f
          test -z "$(git status --porcelain)"
          git diff --name-only a47e9f44a4367d36cb03ae30e2938f45e55ec1e1 HEAD > "$RUNNER_TEMP/gov-pr-filelist"
          python3 -B - <<'PY'
          import pathlib
          actual=set(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'gov-pr-filelist').read_text().splitlines())
          expected={'CURRENT.md','skills/README.md','skills/skill-release/V3.24/SKILL.md','governance/release/cases/P08_ADOPS_V016_PR94_PR97_MEDIA_SAFE_BRIDGE_FORMAL_RELEASE_20261121.md'}
          assert actual==expected,(actual,expected)
          skill=pathlib.Path('skills/skill-release/V3.24/SKILL.md').read_text()
          current=pathlib.Path('CURRENT.md').read_text()
          case=pathlib.Path('governance/release/cases/P08_ADOPS_V016_PR94_PR97_MEDIA_SAFE_BRIDGE_FORMAL_RELEASE_20261121.md').read_text()
          assert '| skill-release | V3.24 |' in current
          assert 'Mode Y' in current and '67b3b98477f93028007c44e648a0b759991c8f19' in current
          assert 'Mode Y' in skill and 'SIGKILL' in skill and 'landing-assets' in skill
          assert 'Hard STOP' in case and 'RP-07Y' in case
          assert 'landing-assets' in case and 'core-updates' in case
          print('P08_V016_MODE_Y_GOV_ONE_CASE_SCOPE_AND_POINTER=PASS')
          PY
      - name: Canonical governance current dependency and closure lints
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL,SECURITY,TESTING,UPGRADE,DATA_SCHEMA,API_PROVIDER,SEO,CRON_JOB,NOTIFICATION,OBSERVABILITY,PERFORMANCE,GIT,UA_UI
            IMPACT_REASON: One-case normative formal release applicability changes for P08 v0.1.16 combined PR94/PR97 only. All thirteen sealed bodies and all original real machine gates remain intact. No per-domain weakening or new business function.
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base a47e9f44a4367d36cb03ae30e2938f45e55ec1e1 --git-head fd940b8f6df3f6846d4142eb0c686bb80a825a4f
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base a47e9f44a4367d36cb03ae30e2938f45e55ec1e1 --git-head fd940b8f6df3f6846d4142eb0c686bb80a825a4f
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo 'P08_V016_MODE_Y_GOV_CLOSURE_AND_NEGATIVE_FIXTURES=PASS'
      - name: Always erase transient private GOV source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- gov "$RUNNER_TEMP/gov-pr-filelist"
          test ! -e gov
          echo 'P08_V016_MODE_Y_GOV_PRIVATE_CLEANUP=PASS'
