name: Core Updates S01 Theme 1.35.38 Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/core-updates-s01-c01-13538-exact-gate-20260924.yml'

permissions:
  contents: read

jobs:
  exact-core-updates-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 27ea6f9386d59e8d5884bb70963320eb854202f7
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: core-updates

      - name: Verify exact source and Theme manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C core-updates rev-parse HEAD)" = "$TARGET_SHA"
          test "$(jq -r '.target_version' core-updates/projects/S01-C01.json)" = "1.35.38"
          test "$(jq -r '.release_tag' core-updates/projects/S01-C01.json)" = "v1.35.38"
          test "$(jq -r '.asset_name' core-updates/projects/S01-C01.json)" = "vf-tools-theme_V1.35.38.zip"
          test "$(jq -r '.asset_bytes' core-updates/projects/S01-C01.json)" = "1738146"
          test "$(jq -r '.asset_sha256' core-updates/projects/S01-C01.json)" = "68b10baa5d35a0f0466ec6bf05ab299c9753a8190baa977c4b4b398b5cff3ec2"
          test "$(jq -r '.runtime_files' core-updates/projects/S01-C01.json)" = "459"
          test "$(jq -r '.runtime_fingerprint' core-updates/projects/S01-C01.json)" = "9a5595fe2c2b042f3321aefaafa086f45e883fa723e36575e332841a0c08a649"
          jq -e '.from_versions | index("1.35.37") != null' core-updates/projects/S01-C01.json >/dev/null

      - name: Manifest Contract Audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          python3 scripts/check_manifest_contract.py

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core V1 regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd core-updates
          php update-core/php/tests/run.php
