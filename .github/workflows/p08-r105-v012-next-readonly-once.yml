name: P08 R105 installed official 012 next-version read-only source gate (one-off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r105-v012-next-readonly-once.yml
permissions:
  contents: read
jobs:
  real-full-readonly:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
    steps:
      - name: Transient pinned private P08 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f813487577bbfc9bb7d5b62921c8df4452818cf3
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 required by source
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, fileinfo, posix
      - name: PHP syntax and read-only source + bad-source negative matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "f813487577bbfc9bb7d5b62921c8df4452818cf3"
          test "$(cat VERSION)" = "0.1.2"
          for p in src/Upgrade/R105OfficialNextRelease.php src/Upgrade/OwnerReleaseDiscovery.php src/Upgrade/FlatLayoutBridgePrepare.php src/Upgrade/r105-offline-bootstrap-cli.php tests/compatibility/r105_official_next_release.php tests/compatibility/r105_official_full_same_release.php tests/compatibility/r105_same_release_activation.php tests/compatibility/r105_installed_database_config.php; do
            if ! php -l "$p" > "$RUNNER_TEMP/p08-next-lint.log" 2>&1; then
              echo R105_NEXT_PHP84_SYNTAX=FAIL; exit 1
            fi
          done
          echo R105_NEXT_PHP84_SYNTAX=PASS
          bash -n scripts/r105_cloudpanel_flat012_once.sh
          echo R105_NEW_ROOT_SUPERVISOR_BASH_SYNTAX=PASS
          if ! python3 scripts/build_r105_onefile.py --output-dir "$RUNNER_TEMP" > "$RUNNER_TEMP/p08-next-build.log" 2>&1; then
            echo R105_EXACT_NEW_ONEFILE_BUILD=FAIL; exit 1
          fi
          bash -n "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh"
          test "$(sha256sum "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" | cut -d' ' -f1)" = "$(sed -n 's/^R105_ONEFILE_SHA256=//p' "$RUNNER_TEMP/p08-next-build.log")"
          echo R105_EXACT_NEW_ONEFILE_BUILD_AND_HASH=PASS
          for p in tests/compatibility/r105_same_release_activation.php tests/compatibility/r105_official_next_release.php tests/test_owner_release_discovery.php; do
            if ! php "$p" > "$RUNNER_TEMP/p08-next-unit.log" 2>&1; then
              echo "R105_NEXT_SUITE_FAIL=$(basename "$p")"
              tail -n 4 "$RUNNER_TEMP/p08-next-unit.log" | sed -E 's@[A-Za-z0-9_+/-]{25,}@REDACTED@g'
              exit 1
            fi
            echo "R105_NEXT_SUITE_$(basename "$p")=PASS"
          done
          echo R105_NEXT_LEGACY_AND_BOUND_FUTURE_CHECK=PASS
      - name: Node 22 current-page UX build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source Vue UX typecheck, tests and build
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08-private
          test "$(git rev-parse HEAD)" = "f813487577bbfc9bb7d5b62921c8df4452818cf3"
          if ! npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-next-node.log" 2>&1; then
            echo R105_NEXT_NPM_LOCK=FAIL; exit 1
          fi
          if ! npm run typecheck > "$RUNNER_TEMP/p08-next-node.log" 2>&1; then
            echo R105_NEXT_TYPESCRIPT=FAIL; exit 1
          fi
          if ! npm run test:unit > "$RUNNER_TEMP/p08-next-node.log" 2>&1; then
            echo R105_NEXT_VUE_UNIT=FAIL; exit 1
          fi
          if ! npm run build > "$RUNNER_TEMP/p08-next-node.log" 2>&1; then
            echo R105_NEXT_VITE_BUILD=FAIL; exit 1
          fi
          echo R105_NEXT_VUE_UX_TYPECHECK_UNIT_BUILD=PASS
      - name: Verified published 0.1.2 FULL -> versioned -> Owner read-only check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "${P08_PRIVATE_READ_TOKEN:-}" != ""
          site="$RUNNER_TEMP/p08-r105-real-full-$RANDOM-$RANDOM"
          export P08_R105_SITE_DIR="$site"
          mkdir -m 0700 "$site"
          curl --fail --location --silent --show-error --max-time 95 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/p08-next-full.zip"
          test "$(wc -c < "$RUNNER_TEMP/p08-next-full.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-next-full.zip" | sha256sum -c --status
          unzip -q "$RUNNER_TEMP/p08-next-full.zip" -d "$site"
          test -f "$site/FULL_MANIFEST.json"
          test "$(cat "$site/VERSION")" = "0.1.2"
          if ! P08_R105_CANONICAL_VENDOR_ROOT="$site" php p08-private/tests/compatibility/r105_installed_database_config.php > "$RUNNER_TEMP/p08-next-config.log" 2>&1; then
            echo R105_OFFICIAL_FULL_3DB_QUOTED_CONFIG=FAIL
            tail -n 5 "$RUNNER_TEMP/p08-next-config.log" | sed -E 's@[A-Za-z0-9_+/-]{25,}@REDACTED@g'
            exit 1
          fi
          for expected in \
            R105_CANONICAL_mysql_QUOTED_SECRET_PRESERVED=PASS \
            R105_CANONICAL_mariadb_QUOTED_SECRET_PRESERVED=PASS \
            R105_CANONICAL_SQLITE_CONFIG_PRESERVED=PASS \
            R105_SQLITE_MARIADB_CROSS_DRIVER_REFUSED=PASS; do
            grep -Fxq "$expected" "$RUNNER_TEMP/p08-next-config.log"
          done
          echo R105_OFFICIAL_FULL_3DB_QUOTED_CONFIG=PASS
          if ! php p08-private/tests/compatibility/r105_official_full_same_release.php > "$RUNNER_TEMP/p08-next-full-test.log" 2>&1; then
            echo R105_NEXT_PUBLISHED_FULL_OWNER_CHECK=FAIL
            tail -n 6 "$RUNNER_TEMP/p08-next-full-test.log" | sed -E 's@/[^ ]{14,}@/[REDACTED]@g' || true
            exit 1
          fi
          for check in R105_GENUINE_FLAT_012_READONLY_CHECK_REQUIRES_OFFLINE_ACTIVATION=PASS R105_GENUINE_OFFICIAL_FULL_POST_BOOTSTRAP_NO_NEWER_RELEASE=PASS R105_GENUINE_FULL_OWNER_BOUNDARY=PASS; do
            grep -Fxq "$check" "$RUNNER_TEMP/p08-next-full-test.log"
          done
          echo R105_REAL_OFFICIAL_FULL_BOOTSTRAP_TO_READONLY_NEXT_CHECK=PASS
          echo R105_NEW_VERSION_OWNER_CLICK_ATOMIC=NOT_PROVEN
      - name: Always scrub private source, official ZIP and synthetic site
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private
          rm -rf -- "$RUNNER_TEMP"/p08-r105-real-full-*
          rm -f -- "$RUNNER_TEMP"/r105_cloudpanel_flat012_once.sh
          rm -f -- "$RUNNER_TEMP"/p08-next-*.log "$RUNNER_TEMP"/p08-next-full.zip
          echo R105_PRIVATE_SOURCE_SITE_AND_LOGS_REMOVED=YES

  r105-real-cloudpanel-preactivation-recovery:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact P08 private R105 source (temporary)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f813487577bbfc9bb7d5b62921c8df4452818cf3
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Install real disposable systemd nginx cron PHP8.4 FPM and native SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq > "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo apt-get update -qq >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-zip php8.4-curl php8.4-mbstring php8.4-xml php8.4-bcmath >> "$RUNNER_TEMP/r105-systemd-apt.log" 2>&1
          /usr/bin/php8.4 -r 'exit(extension_loaded("sqlite3") && extension_loaded("posix") ? 0 : 1);'
          echo R105_REAL_SYSTEMD_COMPONENTS=PASS
      - name: Real official 0.1.2 FULL, isolated Owner and CloudPanel host setup
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "f813487577bbfc9bb7d5b62921c8df4452818cf3"
          test "${P08_PRIVATE_READ_TOKEN:-}" != ""
          site=/home/kewaro-adops/htdocs/adops.kewaro.com
          sudo useradd -m -s /bin/bash kewaro-adops
          sudo mkdir -p "$site" "$site/storage/app/private/adops/installation" "$site/storage/app/private/adops/maintenance"
          curl --fail --location --silent --show-error --max-time 100 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/r105-official-full.zip"
          test "$(wc -c < "$RUNNER_TEMP/r105-official-full.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r105-official-full.zip" | sha256sum -c --status
          sudo unzip -q "$RUNNER_TEMP/r105-official-full.zip" -d "$site"
          test "$(sudo cat "$site/VERSION")" = 0.1.2
          echo "fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233  $site/FULL_MANIFEST.json" | sudo sha256sum -c --status
          db="$site/database/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.sqlite"
          sudo /usr/bin/php8.4 -r '$db=new SQLite3($argv[1]); $db->exec("CREATE TABLE proof_items (id INTEGER PRIMARY KEY, owner_value TEXT NOT NULL)"); $db->exec("INSERT INTO proof_items VALUES (1, \"owner-kept\")"); $db->close();' "$db"
          sudo tee "$site/.env" > /dev/null <<EOF
          APP_NAME="VF AdOps Test"
          APP_ENV="production"
          APP_KEY="base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          APP_DEBUG="false"
          APP_URL="http://127.0.0.1:18927"
          DB_CONNECTION="sqlite"
          DB_DATABASE="$db"
          DB_FOREIGN_KEYS="true"
          SESSION_DRIVER="database"
          SESSION_ENCRYPT="true"
          CACHE_STORE="database"
          QUEUE_CONNECTION="sync"
          EOF
          sudo tee "$site/storage/app/private/adops/installation/installed.json" > /dev/null <<'EOF'
          {"project_id":"P08","status":"INSTALLED","database_driver":"sqlite"}
          EOF
          sudo touch "$site/storage/app/private/adops/maintenance/write-gate.lock"
          sudo mkdir -p "$site/storage/app/private/adops/landings"
          echo "owner-sensitive-synthetic-media" | sudo tee "$site/storage/app/private/adops/landings/owner-test.txt" > /dev/null
          sudo tee /etc/php/8.4/fpm/pool.d/kewaro-adops.conf > /dev/null <<'EOF'
          [kewaro-adops]
          user = kewaro-adops
          group = kewaro-adops
          listen = /run/php/kewaro-adops-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = dynamic
          pm.max_children = 3
          pm.start_servers = 1
          pm.min_spare_servers = 1
          pm.max_spare_servers = 2
          EOF
          sudo tee /etc/nginx/sites-enabled/adops.kewaro.com.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18927;
            server_name adops.kewaro.com;
            root /home/kewaro-adops/htdocs/adops.kewaro.com/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/kewaro-adops-fpm.sock;
            }
          }
          EOF
          sudo chown -R kewaro-adops:kewaro-adops /home/kewaro-adops
          sudo chmod 0755 /home/kewaro-adops /home/kewaro-adops/htdocs "$site"
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for service in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$service"; done
          echo R105_REAL_OFFICIAL_FULL_SITE_UID_AND_SERVICES=PASS
      - name: Real root service stop, injected postprepare failure, verified flat recovery and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          site=/home/kewaro-adops/htdocs/adops.kewaro.com
          python3 p08-private/scripts/build_r105_onefile.py --output-dir "$RUNNER_TEMP" > "$RUNNER_TEMP/r105-built.log"
          script="$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh"
          test -s "$script"
          test "$(sudo systemctl is-active nginx)" = active
          beforePid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          if sudo env GITHUB_ACTIONS=true P08_ISOLATED_INSTALL_TEST=YES P08_R105_DISPOSABLE=YES P08_R105_TEST_FAULT_AFTER_PREPARE=YES bash "$script" --activate --ack-global-service-outage "$site" kewaro-adops 8.4 > "$RUNNER_TEMP/r105-systemd-apply.log" 2>&1; then
            echo R105_REAL_FAULT_AFTER_PREPARE_UNEXPECTED_SUCCESS=FAIL
            exit 1
          fi
          for marker in \
            R105_OFFLINE=NATIVE_BACKUP_CAPTURED_AND_MANIFESTS_READBACK \
            R105_OFFLINE=IMMUTABLE_012_STAGED_AFTER_BACKUP \
            R105_CLOUDPANEL=PREACTIVATION_CANCELED_ORIGINAL_FLAT_SITE_VERIFIED \
            R105_CLOUDPANEL=SERVICES_RESTARTED_WITH_NEW_FPM; do
            if ! grep -Fxq "$marker" "$RUNNER_TEMP/r105-systemd-apply.log"; then
              echo "R105_REAL_FAULT_MARKER_MISSING"
              grep '^R105_' "$RUNNER_TEMP/r105-systemd-apply.log" | tail -n 12 || true
              exit 1
            fi
          done
          test ! -e "$site/current" && test ! -L "$site/current"
          test ! -e "$site/releases" && test ! -L "$site/releases"
          test "$(cat "$site/VERSION")" = "0.1.2"
          afterPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$beforePid" != "$afterPid"
          for service in nginx cron php8.4-fpm; do
            sudo systemctl is-active --quiet "$service"
          done
          http="$(curl --silent --show-error --max-time 8 --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:18927/login' || true)"
          if [[ "$http" == 000 || "$http" == 503 ]]; then
            echo "R105_REAL_FLAT_LOGIN_HTTP_NOT_AVAILABLE_STATUS=$http"
            exit 1
          fi
          echo "R105_REAL_SYSTEMD_POSTPREPARE_FAULT_FLAT_RECOVERY_AND_FPM_RESTART=PASS"
          echo "R105_REAL_OWNER_AUTHENTICATED_BROWSER_AND_NEXT_UPDATE=NOT_PROVEN"
      - name: Destroy disposable private official FULL, native snapshots and temporary site
        if: always()
        shell: bash
        run: |
          set +e
          sudo systemctl stop nginx cron php8.4-fpm 2>/dev/null || true
          sudo rm -f /etc/nginx/sites-enabled/adops.kewaro.com.conf /etc/php/8.4/fpm/pool.d/kewaro-adops.conf
          sudo pkill -u kewaro-adops 2>/dev/null || true
          sudo userdel -r kewaro-adops 2>/dev/null || true
          rm -rf -- p08-private
          rm -f -- "$RUNNER_TEMP/r105_cloudpanel_flat012_once.sh" "$RUNNER_TEMP/r105-official-full.zip" "$RUNNER_TEMP/r105-systemd-apply.log" "$RUNNER_TEMP/r105-built.log" "$RUNNER_TEMP/r105-systemd-apt.log"
          echo R105_REAL_SYSTEMD_PRIVATE_SOURCE_AND_NATIVE_BACKUPS_CLEANED=YES

  unissued-012-to-013-code-only-sqlite:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
    steps:
      - name: Ephemeral exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f813487577bbfc9bb7d5b62921c8df4452818cf3
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 native SQLite and ZIP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: zip, sqlite3, pdo_sqlite, mbstring, fileinfo
      - name: Official FULL to synthetic unissued next code-only and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "f813487577bbfc9bb7d5b62921c8df4452818cf3"
          test "$(cat p08-private/VERSION)" = "0.1.2"
          mkdir -m 0700 "$RUNNER_TEMP/p08-r105-real-full-013-success" "$RUNNER_TEMP/p08-r105-real-full-013-fault" "$RUNNER_TEMP/p08-r105-unissued-next-runtime"
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --max-time 95 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            "https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263" \
            --output "$RUNNER_TEMP/p08-next-test-official.zip"
          test "$(wc -c < "$RUNNER_TEMP/p08-next-test-official.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-next-test-official.zip" | sha256sum -c --status
          for dir in "$RUNNER_TEMP/p08-r105-real-full-013-success" "$RUNNER_TEMP/p08-r105-real-full-013-fault" "$RUNNER_TEMP/p08-r105-unissued-next-runtime"; do
            unzip -q "$RUNNER_TEMP/p08-next-test-official.zip" -d "$dir"
            test "$(cat "$dir/VERSION")" = "0.1.2"
            echo "fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233  $dir/FULL_MANIFEST.json" | sha256sum -c --status
          done
          printf '0.1.3\n' > "$RUNNER_TEMP/p08-r105-unissued-next-runtime/VERSION"
          targetSha="$(printf %s 'P08-UNISSUED-013-f813487577bbfc9bb7d5b62921c8df4452818cf3' | sha256sum | cut -c1-40)"
          python3 p08-private/scripts/build_atomic.py \
            --source "$RUNNER_TEMP/p08-r105-unissued-next-runtime" \
            --output "$RUNNER_TEMP/p08-next-unissued-013-atomic.zip" \
            --source-version 0.1.2 \
            --source-sha 7f7218abfa13ba232d1afd13f10df29da29dd21a \
            --source-full-manifest-sha256 fd15c721b12e524ffe747606172eb9f21dc98809bbb8c0430f1b4b586ca09233 \
            --target-version 0.1.3 \
            --target-sha "$targetSha" > "$RUNNER_TEMP/p08-next-candidate-receipt.json"
          test -s "$RUNNER_TEMP/p08-next-unissued-013-atomic.zip"
          php -l p08-private/tests/compatibility/p08_012_to_unissued_013_code_only.php > /dev/null
          for mode in success fault; do
            site="$RUNNER_TEMP/p08-r105-real-full-013-$mode"
            if ! php p08-private/tests/compatibility/p08_012_to_unissued_013_code_only.php \
              "$mode" "$site" "$RUNNER_TEMP/p08-next-unissued-013-atomic.zip" "$targetSha" \
              > "$RUNNER_TEMP/p08-next-code-$mode.log" 2>&1; then
              echo "R105_UNISSUED_013_NATIVE_SQLITE_$mode=FAIL"
              # Print only error class / all-caps failure code; never a
              # filesystem path, line of source, credentials or stack trace.
              echo R105_NEXT_FAULT_DIAGNOSTIC_BEGIN
              grep -Eo 'R[0-9]{2,3}_[A-Z0-9_]+|ATOMIC_[A-Z0-9_]+|[A-Za-z]+Error|[A-Za-z]+Exception|[A-Z]{5,}_[A-Z0-9_]+' "$RUNNER_TEMP/p08-next-code-$mode.log" | sort -u | tail -n 8 || true
              echo R105_NEXT_FAULT_DIAGNOSTIC_END
              exit 1
            fi
            grep -Fxq "R105_NATIVE_SQLITE_$mode_NEXT_VERSION_CODE_ONLY_AND_ROLLBACK_RESTORE=PASS" "$RUNNER_TEMP/p08-next-code-$mode.log"
            echo "R105_UNISSUED_013_NATIVE_SQLITE_$mode=PASS"
          done
          echo R105_OFFICIAL_012_TO_UNISSUED_013_NATIVE_CODE_ONLY_FAULT_RESTORE=PASS
          echo R105_NEXT_OFFICIAL_RELEASE_OR_OWNER_CLICK=NOT_PROVEN
      - name: Delete temporary source and non-release artifacts
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private "$RUNNER_TEMP"/p08-r105-real-full-013-* "$RUNNER_TEMP"/p08-r105-unissued-next-runtime
          rm -f -- "$RUNNER_TEMP"/p08-next-test-official.zip "$RUNNER_TEMP"/p08-next-unissued-013-atomic.zip "$RUNNER_TEMP"/p08-next-candidate-receipt.json "$RUNNER_TEMP"/p08-next-code-*.log
          echo R105_UNISSUED_NEXT_SOURCE_AND_SYNTHETIC_BACKUPS_CLEANED=YES
