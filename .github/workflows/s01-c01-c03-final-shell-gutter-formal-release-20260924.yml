name: S01 Theme 1.35.37 + M3U8 1.25.41 Final Shell Gutter Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  theme-release:
    if: github.head_ref == 'task/s01-c01-c03-final-shell-gutter-formal-release-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-theme
      SHA: 14ff88a5c4f40a310e9c72f109834dfd8f2bc668
      VERSION: 1.35.37
      TAG: v1.35.37
      ASSET: vf-tools-theme_V1.35.37.zip
      PREVIOUS_TAG: v1.35.36
      PREVIOUS_ASSET: vf-tools-theme_V1.35.36.zip
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact Theme main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 14ff88a5c4f40a310e9c72f109834dfd8f2bc668
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: theme
          persist-credentials: false

      - name: Verify Theme exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.35.37' theme/src/style.css
          grep -Fq 'V1.35.37_S01_PRODUCTION_SHELL_GUTTER_PARITY_R10' theme/src/style.css
          grep -Fq "VF_THEME_VERSION', '1.35.37'" theme/src/inc/runtime-constants.php
          grep -Fq "VF_THEME_ROUND', 'V1.35.37_S01_PRODUCTION_SHELL_GUTTER_PARITY_R10'" theme/src/inc/runtime-constants.php
          php theme/tests/s01-c01-admin-shell-alignment-r1-contract.php
          php theme/tests/s01-c01-local-nav-alignment-r2-contract.php
          php theme/tests/s01-c01-content-alignment-r3-contract.php
          php theme/tests/s01-c01-special-surface-r4-contract.php
          php theme/tests/s01-c01-page-visual-closure-r5-contract.php
          grep -Fq 'R10 · OWNER Production desktop shell gutter parity' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'body.vf-theme-admin-screen #wpcontent' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'padding-left:20px!important' theme/src/assets/css/admin/admin-s01-page-visual-closure-r5.css
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' theme/docs/authority/SSOT.md
          grep -Fq 'Post-release OWNER REAL USE = REQUIRED_FOR_FINAL_UX_CLOSURE' theme/docs/authority/SSOT.md
          python3 - <<'PY'
          import json
          d=json.load(open('theme/src/theme.json'))
          assert d['version']==3
          assert d['settings']['custom']['vfThemeVersion']=='1.35.37'
          assert d['settings']['custom']['vfPackageSyncRound']=='V1.35.37_S01_PRODUCTION_SHELL_GUTTER_PARITY_R10'
          PY

      - name: Build and verify Theme package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tools-theme stage2/vf-tools-theme dist previous
          cp -a theme/src/. stage1/vf-tools-theme/
          cp -a theme/src/. stage2/vf-tools-theme/
          rm -f stage1/vf-tools-theme/README.md stage1/vf-tools-theme/CHANGELOG.md
          rm -f stage2/vf-tools-theme/README.md stage2/vf-tools-theme/CHANGELOG.md
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage1/vf-tools-theme -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          root=Path('stage1/vf-tools-theme')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel:return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):return False
              base=Path(rel).name.lower()
              if base in {'readme.md','changelog.md','license','license.txt'}:return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):return False
              if '/' not in rel:return rel=='style.css' or rel.lower().endswith('.php')
              return re.match(r'^(?:inc|assets|config|languages|template-parts|templates)/',rel) is not None
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/theme_runtime_count').write_text(str(len(rows)))
          Path('/tmp/theme_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tools-theme)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tools-theme)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tools-theme"
          unzip -p "dist/$ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.37'
          unzip -p "dist/$ASSET" vf-tools-theme/inc/runtime-constants.php | grep -Fq "VF_THEME_VERSION', '1.35.37'"
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/theme_sha
          stat -c '%s' "dist/$ASSET" > /tmp/theme_bytes

      - name: Previous Theme release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tools-theme/style.css | grep -Fq 'Version: 1.35.33'

      - name: Publish and read back Theme release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/theme-notes.md <<EOF
          # VF Tools Theme V1.35.37
          S01-C01 Final Production Shell Gutter R10.
          - Final Production shell alignment against OPS 1.21.941: restore WordPress desktop #wpcontent 20px left gutter while preserving the verified 1160 / 66 / 36 / 42 / 13px shell geometry.
          - Exact Candidate Browser Gate 35990106554 PASS across 8 Theme admin pages × 3 viewports.
          - Presentation-only; no Theme settings/data/schema migration.
          - Post-release OWNER Production visual/use verification remains REQUIRED_FOR_FINAL_UX_CLOSURE.
          - Rollback source: $PREVIOUS_TAG.
          - OWNER explicitly instructed direct completion through release/production without further intermediate confirmation.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools Theme $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools Theme V$VERSION" --notes-file /tmp/theme-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/theme_bytes)"
          lsha="$(cat /tmp/theme_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/theme-readback && mkdir -p /tmp/theme-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/theme-readback --clobber
          test "$(sha256sum "/tmp/theme-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/theme-readback/$ASSET"
          cat > /tmp/theme-release-receipt.json <<EOF
          {"component_id":"S01-C01","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/theme_runtime_count),"runtime_fingerprint":"$(cat /tmp/theme_runtime_fp)","owner_direct_release_authorization":"YES","remote_readback":"PASS"}
          EOF

      - name: Upload Theme release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-13537-formal-release-${{ github.run_id }}
          path: /tmp/theme-release-receipt.json
          if-no-files-found: error
          retention-days: 30

  m3u8-release:
    if: github.head_ref == 'task/s01-c01-c03-final-shell-gutter-formal-release-20260924'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-m3u8
      SHA: ee9bbcb1db3dba2eb7e86b2c4e697adae7baade9
      VERSION: 1.25.41
      TAG: v1.25.41
      ASSET: vf-tools-m3u8_V1.25.41.zip
      PREVIOUS_TAG: v1.25.40
      PREVIOUS_ASSET: vf-tools-m3u8_V1.25.40.zip
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact M3U8 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ee9bbcb1db3dba2eb7e86b2c4e697adae7baade9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: m3u8
          persist-credentials: false

      - name: Verify M3U8 exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.25.41' m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.41'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R263'" m3u8/src/vf-tool-m3u8.php
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/s01-c03-local-nav-alignment-r2-contract.php
          php m3u8/tests/s01-c03-content-alignment-r3-contract.php
          php m3u8/tests/s01-c03-special-surface-r4-contract.php
          php m3u8/tests/s01-c03-page-visual-closure-r5-contract.php
          grep -Fq 'R13 · OWNER Production desktop shell gutter parity' m3u8/src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'body.wp-admin.vf-m3u8-admin-ui-v4 #wpcontent' m3u8/src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'padding-left:20px!important' m3u8/src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'R11 · OPS-exact single disclosure indicator' m3u8/src/admin/ui-v4/admin-s01-page-visual-closure-r5.css
          grep -Fq 'vf-v6-domain-menu-chevron" aria-hidden="true">⌄</span>' m3u8/src/admin/Presentation/Components/class-admin-components.php
          ! grep -Fq 'content: "⌄";' m3u8/src/admin/ui-v4/phase4-component-workspace.css
          ! grep -Fq 'content: "⌃";' m3u8/src/admin/ui-v4/phase4-component-workspace.css
          grep -Fq '"file":"admin/dist/dashboard.css"' m3u8/src/config/admin-performance-bundles.php
          ! grep -Fq 'dashboard-phase4.css' m3u8/src/config/admin-performance-bundles.php
          test ! -e m3u8/src/admin/dist/dashboard-phase4.css
          grep -Fq 'vf_tool_m3u8_admin_ui_v4_enqueue_phase4_component_workspace' m3u8/src/admin/ui-v4/admin-ui-assets.php
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' m3u8/docs/authority/SSOT.md
          grep -Fq 'Post-release OWNER REAL USE = REQUIRED_FOR_FINAL_UX_CLOSURE' m3u8/docs/authority/SSOT.md

      - name: Build and verify M3U8 package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist previous
          mkdir -p stage/vf-tool-m3u8 dist previous
          cp -a m3u8/src/. stage/vf-tool-m3u8/
          test "$(find stage/vf-tool-m3u8 -type l | wc -l)" = "0"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage/vf-tool-m3u8 -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage/vf-tool-m3u8')
          banned={'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'}
          def runtime(rel):
              parts=rel.split('/')
              if any(x.lower() in banned for x in parts):return False
              b=parts[-1].lower()
              if b in {'readme.md','changelog.md','license','license.txt','package_profile.json'}:return False
              if b.endswith(('.sql','.sqlite','.sqlite3','.db','.log','.zip','.tar','.gz','.bak','.tmp')):return False
              if len(parts)==1:return rel in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}
              return parts[0] in {'admin','config','includes','public','templates','tools'}
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if runtime(rel):rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/m3_runtime_count').write_text(str(len(rows)))
          Path('/tmp/m3_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage && zip -X -q -r "../dist/$ASSET" vf-tool-m3u8)
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tool-m3u8"
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.41'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/m3_sha
          stat -c '%s' "dist/$ASSET" > /tmp/m3_bytes

      - name: Previous M3U8 release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.34'

      - name: Publish and read back M3U8 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/m3-notes.md <<EOF
          # VF Tools M3U8 V1.25.41
          S01-C03 Final Production Shell Gutter R13.
          - Final Production shell alignment against OPS 1.21.941: restore WordPress desktop #wpcontent 20px left gutter while preserving the verified 1160 / 66 / 36 / 42 / 13px shell geometry.
          - Exact Candidate Browser Gate 35990106554 PASS across 14 M3U8 admin pages × 3 viewports; Professional Mode remains a single literal Chevron with the Phase4 filemtime cache-bust path.
          - Presentation-only; no Provider algorithm/domain state/schema migration.
          - Post-release OWNER Production visual/use verification remains REQUIRED_FOR_FINAL_UX_CLOSURE.
          - Rollback source: $PREVIOUS_TAG.
          - OWNER explicitly instructed direct completion through release/production without further intermediate confirmation.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools M3U8 $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools M3U8 V$VERSION" --notes-file /tmp/m3-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/m3_bytes)"
          lsha="$(cat /tmp/m3_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/m3-readback && mkdir -p /tmp/m3-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/m3-readback --clobber
          test "$(sha256sum "/tmp/m3-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/m3-readback/$ASSET"
          cat > /tmp/m3-release-receipt.json <<EOF
          {"component_id":"S01-C03","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/m3_runtime_count),"runtime_fingerprint":"$(cat /tmp/m3_runtime_fp)","owner_direct_release_authorization":"YES","remote_readback":"PASS"}
          EOF

      - name: Upload M3U8 release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-12541-formal-release-${{ github.run_id }}
          path: /tmp/m3-release-receipt.json
          if-no-files-found: error
          retention-days: 30
