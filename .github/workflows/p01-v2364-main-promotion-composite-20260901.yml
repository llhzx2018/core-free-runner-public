name: P01 V2.36.4 Main Promotion Composite
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-main-promotion-composite-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      EXPECTED_MAIN: d35038c32b5a287636ee92d9fe074ea12c1469ef
      EXPECTED_DEVELOP: 48da73b3d69279de507d21c9f095094f5b8948da
      DEVELOP_TREE: 0c790c1580078813c47e5c0f56f1ced9bd3d66cc
      FORMAL_ARTIFACT_RUN: '33520819304'
      STRICT_FRESH_RUN: '33521577888'
      COMPOSITE_STAGING_RUN: '33523864431'
      DIFF_DIAGNOSTIC_RUN: '33524228991'
    steps:
      - name: Checkout exact composite develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact composite promotion fence and main write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$FORMAL_ARTIFACT_RUN" "$STRICT_FRESH_RUN" "$COMPOSITE_STAGING_RUN" "$DIFF_DIAGNOSTIC_RUN"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          cd p01
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEVELOP"
          test "$(git rev-parse HEAD^{tree})" = "$DEVELOP_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$EXPECTED_DEVELOP"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.4 >/dev/null 2>&1; then echo UNEXPECTED_V2364_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" "$FORMAL_SOURCE" --quiet
          test "$(git rev-parse "$FORMAL_SOURCE^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"

          git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_DEVELOP" | tee /tmp/p01-v2364-main-promotion-diff.txt
          EXPECTED_SCOPE='CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php src/assets/workspace-domain-nav.css '
          ACTUAL_SCOPE=$(git diff --name-only "$EXPECTED_MAIN" "$EXPECTED_DEVELOP" | sort | tr '\n' ' ')
          test "$ACTUAL_SCOPE" = "$EXPECTED_SCOPE"
          if git diff --name-status "$EXPECTED_MAIN" "$EXPECTED_DEVELOP" | awk '$1=="D"{bad=1} END{exit bad?0:1}'; then echo UNEXPECTED_PATH_DELETION; exit 21; fi

          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$EXPECTED_MAIN:$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"
          done

          git show "$EXPECTED_MAIN:VF_PROJECT.json" > /tmp/main-vf.json
          git show "$FORMAL_SOURCE:VF_PROJECT.json" > /tmp/formal-vf.json
          git show "$EXPECTED_DEVELOP:VF_PROJECT.json" > /tmp/develop-vf.json
          python3 - <<'PY'
          import json
          M=json.load(open('/tmp/main-vf.json'))
          F=json.load(open('/tmp/formal-vf.json'))
          D=json.load(open('/tmp/develop-vf.json'))
          for k in ('current_production_evidence','current_formal_release_evidence','current_l2_develop_evidence'):
              F['authority'][k]=M['authority'][k]
          F['owner_production_closure_evidence']=M['owner_production_closure_evidence']
          F['v2_36_3_release_chain']=M['v2_36_3_release_chain']
          assert D == F
          assert D['production_version']=='2.36.3'
          assert D['working_version']=='2.36.4'
          assert D['target_release_version']=='2.36.4'
          assert D['schema_version']=='2026082901'
          assert D['v2_36_4_candidate_gate']['state']=='PASS'
          assert D['v2_36_4_release_candidate']['version']=='2.36.4'
          assert D['owner_production_closure_evidence']['version']=='2.36.3'
          assert D['v2_36_3_release_chain']['result']=='PASS'
          assert D['authority']['current_production_evidence']=='docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md'
          assert D['authority']['current_formal_release_evidence']=='docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md'
          assert D['authority']['current_l2_develop_evidence']=='docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md'
          PY

          for f in CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php; do
            test "$(git rev-parse "$EXPECTED_DEVELOP:$f")" = "$(git rev-parse "$FORMAL_SOURCE:$f")"
          done
          test "$(git rev-parse "$EXPECTED_DEVELOP:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" src/app/bootstrap.php >/dev/null

          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          PROMOTION=$(printf 'release(P01): promote V2.36.4 composite formal tree to main\n\nPromote exact composite develop tree after Formal Artifact, Strict Fresh, Composite Staging and endpoint-diff gates. Formal Source is preserved as second parent; V2.36.3 Closure Authority remains intact. No Tag/Release/core-updates/Owner Production write.\n' | git commit-tree "$DEVELOP_TREE" -p "$EXPECTED_MAIN" -p "$FORMAL_SOURCE")
          test "$(git rev-parse "$PROMOTION^{tree}")" = "$DEVELOP_TREE"
          test "$(git rev-parse "$PROMOTION:src")" = "$RUNTIME_TREE"
          test "$(git show -s --format=%P "$PROMOTION")" = "$EXPECTED_MAIN $FORMAL_SOURCE"
          git push origin "$PROMOTION:refs/heads/main"

          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$PROMOTION"
          test "$REMOTE_DEVELOP" = "$EXPECTED_DEVELOP"
          git fetch origin "$REMOTE_MAIN" --quiet
          test "$(git rev-parse "$REMOTE_MAIN^{tree}")" = "$DEVELOP_TREE"
          test "$(git rev-parse "$REMOTE_MAIN:src")" = "$RUNTIME_TREE"
          test "$(git show -s --format=%P "$REMOTE_MAIN")" = "$EXPECTED_MAIN $FORMAL_SOURCE"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$REMOTE_MAIN"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$REMOTE_MAIN"
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$REMOTE_MAIN:$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"
          done
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.4 >/dev/null 2>&1; then echo UNEXPECTED_TAG_AFTER_PROMOTION; exit 22; fi
          printf 'P01_V2364_MAIN_PROMOTION=PASS\nPROMOTION_MAIN=%s\nPREVIOUS_MAIN=%s\nDEVELOP=%s\nDEVELOP_TREE=%s\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nDIFF_SCOPE=CHANGELOG.md,VERSION,VF_PROJECT.json,src/VERSION.txt,src/app/bootstrap.php,src/assets/workspace-domain-nav.css\nVF_PROJECT_COMPOSITE=PASS\nV2363_CLOSURE_AUTHORITY=PRESERVED\nPROMOTION_MODE=TREE_IDENTITY_COMPOSITE_MERGE\nTAG=ABSENT\nGITHUB_RELEASE_WRITE=NO\nCORE_UPDATES_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$EXPECTED_MAIN" "$REMOTE_DEVELOP" "$DEVELOP_TREE" "$FORMAL_SOURCE" "$FORMAL_TREE" "$RUNTIME_TREE" | tee /tmp/p01-v2364-main-promotion.txt
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2364-main-promotion-${{ github.run_id }}
          path: |
            /tmp/p01-v2364-main-promotion.txt
            /tmp/p01-v2364-main-promotion-diff.txt
          if-no-files-found: error
          retention-days: 90
