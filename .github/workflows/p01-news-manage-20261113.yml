name: P01 News Source Management Exact-Source 20261113
on:
  push:
    branches:
      - test/p01-news-manage-20261113-fc78

permissions:
  contents: read

jobs:
  news-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Confirm ephemeral private-source checkout authority
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-news-manage-20261113-fc78"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=NEWS_SOURCE_MANAGEMENT_D54"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Checkout exact private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fc78d0dbdcaee7a7a1ebf1bfb49a53c1b052183c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact source and role separation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "fc78d0dbdcaee7a7a1ebf1bfb49a53c1b052183c"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/OwnerNewsRefresh.php
          test -f candidate/src/app/next/frontend/src/OwnerNewsManage.vue
          test -f candidate/src/app/next/frontend/tests/news-management.spec.ts
          echo "P01_NEWS_EXACT_SOURCE=fc78d0dbdcaee7a7a1ebf1bfb49a53c1b052183c"
      - name: Prepare isolated PHP XML ZIP and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("simplexml") && class_exists("ZipArchive") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-xml php8.3-zip >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("simplexml") && class_exists("ZipArchive") ? 0 : 1);'
          for f in candidate/src/app/NewsFeedService.php candidate/src/app/next/OwnerNewsWorkspace.php candidate/src/app/next/OwnerNewsRefresh.php candidate/src/app/next/http/OwnerHttpRoutes.php candidate/tests/p01_d53_news_courses.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          echo "P01_NEWS_PHP_SYNTAX=PASS"
      - name: Install locked isolated Laravel PHP dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next
          composer install --no-dev --no-interaction --no-scripts --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          echo "P01_NEWS_LARAVEL_DEPENDENCIES=PASS"
      - name: Execute real Laravel SQLite News and Courses synthetic business tests
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d53_news_courses.php > "$RUNNER_TEMP/p01-php.txt" 2>&1; then
            echo "P01_NEWS_SQLITE_INTEGRATION=FAIL"
            grep -E 'D53 FAIL|D53 UNSAFE PASS|Fatal error|Uncaught|Error|WARNING|Notice' "$RUNNER_TEMP/p01-php.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 15 || true
            exit 1
          fi
          grep '^P01_D5[34]_.*=PASS$' "$RUNNER_TEMP/p01-php.txt"
          echo "P01_NEWS_SQLITE_INTEGRATION=PASS"
      - name: Install locked frontend and run Vue typecheck unit and build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_NEWS_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|OwnerNews|App.vue' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 30 || true
            exit 1
          fi
          echo "P01_NEWS_VUE_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_NEWS_UNIT=FAIL"
            grep -E ' FAIL |Test Files|Tests  |AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 25 || true
            exit 1
          fi
          echo "P01_NEWS_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_NEWS_VITE_PRODUCTION_BUILD=PASS"
      - name: Install Chromium and validate all existing frontend workspaces
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_NEWS_12_SUBSITE_CHROMIUM=FAIL"
            grep -E '^  [0-9]+\)|Error:|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 35 || true
            exit 1
          fi
          echo "P01_NEWS_390_768_1440_AND_EXISTING_BROWSER=PASS"
      - name: Always remove private checkout and log files without artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_TEST_ARTIFACTS=PERSISTED_NO"
