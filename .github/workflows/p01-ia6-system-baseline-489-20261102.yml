name: P01 IA6 Owner system baseline detail parity exact-source disposable proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-system-baseline-489-20261102.yml
permissions:
  contents: read
jobs:
  baseline-detail:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: 795e1af2c1ce9c0e7c74baee5d57cc4ee7258716
      PRODUCT_VERSION: 2.47.489
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-baseline-20261102
      P01_TEST_ORIGIN: http://127.0.0.1:19325
      P01_TEST_PASSWORD: IA6SyntheticBaselineOwner2026!
    steps:
      - name: Checkout public-safe one-time Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated PHP SQLite and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind exact private candidate without public source persistence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_BASELINE_EXACT_SOURCE=PASS
      - name: Changed contract and runtime syntax validation
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/api.php
          php -l candidate/src/app/CommonBaseline.php
          php -l candidate/src/app/FrontstageSystemBaseline.php
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          node --check candidate/src/assets/frontstage-system-baseline.js
          node candidate/tests/unit/p01_ia6_system_baseline_r5_contract.cjs
          node candidate/tests/unit/p01_ia6_system_baseline_diagnostic_detail_parity_contract.cjs
          echo P01_IA6_BASELINE_NATIVE_CONTRACT_SYNTAX=PASS
      - name: Disposable real Owner Guest HTTP and Chromium in-place read
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VF_E2E_RUNTIME_ROOT" = /tmp/p01-ia6-baseline-20261102
          mkdir -p "$VF_E2E_RUNTIME_ROOT"
          cp -a candidate/src/. "$VF_E2E_RUNTIME_ROOT/"
          php -S 127.0.0.1:19325 -t "$VF_E2E_RUNTIME_ROOT" >/tmp/p01-ia6-baseline-server.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; rm -rf "$VF_E2E_RUNTIME_ROOT"; rm -f /tmp/p01-ia6-baseline-{server.log,cookie,setup.html,installed.html}; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-baseline-cookie -b /tmp/p01-ia6-baseline-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-baseline-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-baseline-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m,"setup_csrf missing"
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-baseline-cookie -b /tmp/p01-ia6-baseline-cookie -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Synthetic Baseline" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" >/tmp/p01-ia6-baseline-installed.html
          (cd "$VF_E2E_RUNTIME_ROOT" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.request as u,http.cookiejar,os
          origin=os.environ['P01_TEST_ORIGIN']
          path='/api.php?action=system_baseline_report'
          def get(op):
            req=urllib.request.Request(origin+path,headers={'Accept':'application/json'})
            try:
              with op.open(req,timeout=20) as res:return res.status,json.load(res),res.headers
            except urllib.error.HTTPError as e:return e.code,{},e.headers
          guest=urllib.request.build_opener()
          status,_,_=get(guest)
          assert status in (401,403),status
          jar=http.cookiejar.CookieJar()
          owner=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          req=urllib.request.Request(origin+'/api.php?action=login',data=json.dumps({'password':os.environ['P01_TEST_PASSWORD']}).encode(),headers={'Content-Type':'application/json'})
          with owner.open(req,timeout=20) as res:auth=json.load(res)
          assert auth.get('ok'),auth
          status,reply,headers=get(owner)
          assert status==200 and reply.get('ok'),(status,reply)
          rows=reply['report']['rows'];assert 20<len(rows)<400,len(rows)
          assert all(all(isinstance(x.get(k),str) for k in ('domain','parameter','result','expected','effective','source')) for x in rows)
          assert all(len(x['expected'])<=160 and len(x['effective'])<=160 and len(x['source'])<=200 for x in rows)
          assert any(x['source'] and x['expected'] and x['effective'] for x in rows)
          assert 'no-store' in headers.get('Cache-Control','')
          assert reply['info']['app_version']=='2.47.489'
          print('P01_IA6_BASELINE_HTTP_OWNER_GUEST_READONLY_FIELDS=PASS')
          PY
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const origin=process.env.P01_TEST_ORIGIN,password=process.env.P01_TEST_PASSWORD;
          assert.match(origin,/^http:\/\/127\.0\.0\.1:\d+$/);
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          try{
            const ctx=await browser.newContext({viewport:{width:1440,height:900}});
            await ctx.route(/https?:\/\/(?!127\.0\.0\.1)/,route=>route.abort());
            const auth=await ctx.request.post(origin+'/api.php?action=login',{data:{password}});
            assert.equal(auth.status(),200);assert.ok((await auth.json()).ok);
            const page=await ctx.newPage();let writes=0,baselineReads=0,navigations=0;
            page.on('request',r=>{
              if(r.method()==='POST')writes++;
              if(r.url().includes('action=system_baseline_report'))baselineReads++;
            });
            await page.goto(origin+'/start.php',{waitUntil:'domcontentloaded'});
            page.on('framenavigated',f=>{if(f===page.mainFrame())navigations++;});
            await page.locator('[data-vf-global-manage-open]').click();
            const dialog=page.locator('#vf-local-management');
            await dialog.waitFor({state:'visible'});
            await dialog.locator('[data-vf-global-group="system"]').click();
            const root=dialog.locator('[data-vf-baseline-root]');
            assert.equal(await root.count(),1);
            await root.locator(':scope > summary').click();
            assert.equal(baselineReads,0,'explicit Owner click is required');
            await root.locator('[data-vf-baseline-read]').click();
            await page.waitForFunction(()=>Boolean(document.querySelector('[data-vf-baseline-report]')?.hidden===false));
            assert.equal(baselineReads,1);
            await root.locator('[data-vf-baseline-all]').check();
            const entries=root.locator('.vf-unified-baseline-item');
            assert.ok(await entries.count()>20);
            await entries.first().locator('summary').click();
            assert.deepEqual(await entries.first().locator('dt').allTextContents(),['统一要求','当前实际','检查来源']);
            const values=await entries.first().locator('dd').allTextContents();
            assert.equal(values.length,3);assert.ok(values.every(x=>x.trim().length>0));
            assert.equal(await dialog.locator('iframe').count(),0);
            assert.equal(await page.locator('dialog[open]:modal').count(),1);
            assert.equal(writes,0,'diagnostics must never write');
            assert.equal(navigations,0,'management must remain in current page');
            console.log('P01_IA6_BASELINE_BROWSER_SAME_DIALOG_DETAILS_READ_NO_WRITE=PASS');
            await ctx.close();
          }finally{await browser.close();}
          JS
          echo P01_IA6_BASELINE_DISPOSABLE_RUNTIME=PASS
      - name: Remove all synthetic source and installation bytes
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-ia6-baseline-20261102
          rm -f /tmp/p01-ia6-baseline-server.log /tmp/p01-ia6-baseline-cookie /tmp/p01-ia6-baseline-setup.html /tmp/p01-ia6-baseline-installed.html
          echo P01_IA6_BASELINE_DISPOSABLE_CLEANUP=PASS
