name: P05 First Impression Browser

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-first-impression-browser.yml'

permissions:
  contents: read

jobs:
  exact-first-impression:
    if: github.event.pull_request.head.ref == 'test/p05-first-impression-browser-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact corrected P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 1086bc6998af0980e9cc4b83f53103dc03ba805a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and runtime Owner language
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '1086bc6998af0980e9cc4b83f53103dc03ba805a'
          test "$(git rev-parse HEAD^{tree})" = 'bd92368d7c04472cc96a34663b4d209fe453fafc'
          test "$(cat VERSION)" = '1.2.3'
          grep -Fq '<span>网站组合</span>' src/client/ProductApp.tsx
          grep -Fq 'aria-label="全局工具"><span>全局</span>' src/client/ProductApp.tsx
          grep -Fq '载入演示数据 →' src/client/ProductApp.tsx
          grep -Fq '今日优先' src/client/ProductApp.tsx
          grep -Fq '仅为候选解释，不代表因果' src/client/ProductApp.tsx
          grep -Fq "whyDisclaimer: '候选解释来自相关观察与证据；它们帮助排查，但不是自动因果结论。'" src/server/product-optimization.ts
          grep -Fq "'whyDisclaimer' => '候选解释来自相关观察与证据；它们帮助排查，但不是自动因果结论。'" php/src/ProductOptimizationService.php
          grep -Fq '基于新鲜观察与证据。' src/server/product-optimization.ts
          grep -Fq '基于新鲜观察与证据。' php/src/ProductOptimizationService.php
          ! grep -Fq 'Observation / Evidence' src/server/product-optimization.ts
          ! grep -Fq 'Observation / Evidence' php/src/ProductOptimizationService.php
          grep -Fq "const DEMO_DATASET_AUTHORITY = { id: 'P05_DEMO_V1', sha256: 'f9722556109118edc8fe94471ebecd0679fafc10de7e2096423c8b69e8e83e06' } as const;" src/client/ProductApp.tsx
          echo 'P05_FIRST_IMPRESSION_EXACT_SOURCE=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Focused truth and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test \
            tests/contract/single-product-shell.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-overview-why-query-routing-truth.test.ts \
            tests/unit/product-overview-action-routing-truth.test.ts \
            tests/unit/product-overview-top-movers-query-routing-truth.test.ts \
            tests/unit/product-overview-what-changed-query-routing-truth.test.ts \
            tests/unit/product-overview-changes-workspace-action-truth.test.ts
          npm run typecheck
          npm run build

      - name: Browser verify Owner first impression, canonical evidence and mobile width
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='FirstImpression-2026!' npm run bootstrap:admin
          PORT=18196 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-first-impression-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, shutil, subprocess, sys, time, urllib.request, urllib.error
          BASE='http://127.0.0.1:18196'; DP=9523; PASSWORD='FirstImpression-2026!'
          def fail(msg): print('P05_FIRST_IMPRESSION_BROWSER=FAIL '+msg,file=sys.stderr); raise SystemExit(1)
          def http(m,u,p=None):
              d=None if p is None else json.dumps(p).encode(); r=urllib.request.Request(u,data=d,method=m)
              if d is not None:r.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(r,timeout=25) as x:
                      raw=x.read().decode(); return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e: fail(f'http {e.code} {u}: {e.read().decode(errors="replace")[:400]}')
          def wait_http(u):
              for _ in range(250):
                  try:
                      with urllib.request.urlopen(u,timeout=1) as r:
                          if r.status<500:return
                  except Exception:time.sleep(.1)
              fail('server not ready '+u)
          def wd(m,p,d=None):
              r=http(m,f'http://127.0.0.1:{DP}{p}',d); v=r.get('value')
              if isinstance(v,dict) and v.get('error'):fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome:fail('Chrome unavailable')
          proc=subprocess.Popen([driver,f'--port={DP}','--allowed-ips=127.0.0.1'],stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT); s=''
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DP}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              s=str(r['value'].get('sessionId') or r.get('sessionId') or '')
              if not s:fail('missing webdriver session')
              def sv(m,p,d=None):return wd(m,f'/session/{s}{p}',d)['value']
              def js(code):return sv('POST','/execute/sync',{'script':code,'args':[]})
              def text():return str(js("return document.querySelector('.p05v2-content')?.innerText || ''"))
              def side():return str(js("return document.querySelector('.p05v2-sidebar')?.innerText || ''"))
              def wait(fn,label,n=300):
                  last=None
                  for _ in range(n):
                      try:
                          last=fn()
                          if last:return last
                      except Exception as e:last=repr(e)
                      time.sleep(.1)
                  fail(f'timeout {label}: {last!r}')
              def find(css):return sv('POST','/element',{'using':'css selector','value':css})['element-6066-11e4-a52e-4f735466cecf']
              def send(e,v):sv('POST',f'/element/{e}/clear',{});sv('POST',f'/element/{e}/value',{'text':v,'value':list(v)})
              def click(label):return bool(js('''const x=%s;const b=[...document.querySelectorAll('button')].find(e=>e.textContent.trim()===x);if(!b||b.disabled)return false;b.click();return true;'''%json.dumps(label,ensure_ascii=False)))
              def require(t,items,where):
                  miss=[x for x in items if x not in t]
                  if miss:fail(where+' missing '+json.dumps(miss,ensure_ascii=False))
              def forbid(t,items,where):
                  leak=[x for x in items if x in t]
                  if leak:fail(where+' leaked '+json.dumps(leak,ensure_ascii=False))
              sv('POST','/url',{'url':BASE+'/'})
              wait(lambda:js("return !!document.querySelector(\"input[autocomplete='username']\")"),'login')
              send(find("input[autocomplete='username']"),'owner');send(find("input[autocomplete='current-password']"),PASSWORD);click('登录') or fail('login button')
              shell=wait(lambda:side() if '网站组合' in side() and '全局' in side() else '', 'Chinese shell')
              forbid(shell,['Site Portfolio','Global tools'],'shell')
              empty=wait(lambda:text() if '载入演示数据 →' in text() else '', 'demo load')
              require(empty,['网站组合还没有网站','真实网站与演示数据是两条独立入口','载入演示数据 →'],'empty portfolio')
              forbid(empty,['Demo Dataset','Site Portfolio'],'empty portfolio')
              click('载入演示数据 →') or fail('demo load click')
              portfolio=wait(lambda:text() if all(x in text() for x in ['Kewaro Tools','Kewaro Start','Kewaro Guide','Kewaro AI','WordPress Lab','今日优先','今天先看谁']) else '', 'five-site portfolio',400)
              forbid(portfolio,['OWNER QUEUE','SINCE LAST CHECK','observation_state','Demo Dataset','Site Portfolio'],'portfolio')
              ok=js('''const s=document.querySelector('.p05v2-site-context select');const o=[...s.options].find(x=>x.textContent.trim()==='Kewaro Guide');if(!o)return false;s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));return true;''')
              if not ok:fail('Kewaro Guide selection')
              ov=wait(lambda:text() if all(x in text() for x in ['Kewaro Guide · 概览','发生了什么','为什么可能变化','下一步应该做什么','只看支持判断的数据']) else '', 'Kewaro Guide overview',400)
              require(ov,['最近变化','可能原因','仅为候选解释，不代表因果','候选解释来自相关观察与证据；它们帮助排查，但不是自动因果结论。','需要处理','下一步','核心证据','关键词变化证据 · 前 8 条'],'overview')
              forbid(ov,['SINCE LAST CHECK','WHY / EVIDENCE','causal=false','BREAK / FIX','NEXT BEST ACTION','CONTEXT, NOT CAUSALITY','TOP MOVERS','OWNER ACTION','Observation / Evidence'],'overview')
              if '打开精确关键词证据 →' not in ov:fail('canonical Query action missing')
              if '打开落地页证据 →' not in ov:fail('canonical Page action missing')
              click('打开精确关键词证据 →') or fail('canonical Query click')
              wait(lambda:text() if '当前关键词' in text() else '', 'Query drilldown')
              click('概览') or fail('Overview return')
              wait(lambda:text() if '发生了什么' in text() and '打开落地页证据 →' in text() else '', 'Overview after Query')
              click('打开落地页证据 →') or fail('canonical Page click')
              wait(lambda:text() if '当前页面' in text() else '', 'Page drilldown')
              sv('POST','/window/rect',{'width':390,'height':844});time.sleep(.4)
              overflow=int(js("return Math.max(document.documentElement.scrollWidth,document.body?document.body.scrollWidth:0)-document.documentElement.clientWidth"))
              if overflow!=0:fail(f'mobile horizontal overflow={overflow}')
              print('P05_FIRST_IMPRESSION_CANONICAL_QUERY=PASS')
              print('P05_FIRST_IMPRESSION_CANONICAL_PAGE=PASS')
              print('P05_FIRST_IMPRESSION_MOBILE_OVERFLOW=0')
              print('P05_FIRST_IMPRESSION_BROWSER=PASS')
          finally:
              if s:
                  try:wd('DELETE',f'/session/{s}')
                  except Exception:pass
              proc.terminate()
          PY

      - name: Read-only exact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '1086bc6998af0980e9cc4b83f53103dc03ba805a'
          test "$(git rev-parse HEAD^{tree})" = 'bd92368d7c04472cc96a34663b4d209fe453fafc'
          test -z "$(git status --porcelain)"
          echo 'P05_PRODUCT_SOURCE_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
