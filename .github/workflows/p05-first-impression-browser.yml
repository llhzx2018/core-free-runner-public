name: P05 First Impression Browser

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-first-impression-browser.yml'

permissions:
  contents: read

jobs:
  exact-first-impression:
    if: github.event.pull_request.head.ref == 'test/p05-first-impression-browser-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vf_seo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vf_seo
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 163d60f04f01bb0bd38b36de9723cb18053549c9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity and Owner-language contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '163d60f04f01bb0bd38b36de9723cb18053549c9'
          test "$(git rev-parse HEAD^{tree})" = '7dc40056890d77c51fac2938b16d4843894391bf'
          test "$(cat VERSION)" = '1.2.3'
          grep -Fq '<span>网站组合</span>' src/client/ProductApp.tsx
          grep -Fq 'aria-label="全局工具"><span>全局</span>' src/client/ProductApp.tsx
          grep -Fq '载入演示数据 →' src/client/ProductApp.tsx
          grep -Fq '今日优先' src/client/ProductApp.tsx
          grep -Fq '仅为候选解释，不代表因果' src/client/ProductApp.tsx
          grep -Fq '下一步应该做什么' src/client/ProductApp.tsx
          grep -Fq '只看支持判断的数据' src/client/ProductApp.tsx
          grep -Fq "const DEMO_DATASET_AUTHORITY = { id: 'P05_DEMO_V1', sha256: 'f9722556109118edc8fe94471ebecd0679fafc10de7e2096423c8b69e8e83e06' } as const;" src/client/ProductApp.tsx
          ! grep -Fq '<span>Site Portfolio</span>' src/client/ProductApp.tsx
          ! grep -Fq 'aria-label="Global tools"' src/client/ProductApp.tsx
          echo 'P05_FIRST_IMPRESSION_EXACT_SOURCE=PASS'

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm

      - name: Focused truth and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          node --import tsx --test \
            tests/contract/single-product-shell.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-overview-why-query-routing-truth.test.ts \
            tests/unit/product-overview-action-routing-truth.test.ts \
            tests/unit/product-overview-top-movers-query-routing-truth.test.ts \
            tests/unit/product-overview-what-changed-query-routing-truth.test.ts \
            tests/unit/product-overview-changes-workspace-action-truth.test.ts
          npm run typecheck
          npm run build

      - name: Browser verify first impression, canonical evidence and mobile width
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run migrate
          VF_ADMIN_USERNAME=owner VF_ADMIN_PASSWORD='FirstImpression-2026!' npm run bootstrap:admin
          PORT=18196 VF_SECURE_COOKIES=false VF_REQUIRE_HTTPS=false node dist/src/server/index.js >/tmp/p05-first-impression-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json, shutil, subprocess, sys, time, urllib.request, urllib.error
          BASE='http://127.0.0.1:18196'; DRIVER_PORT=9523; PASSWORD='FirstImpression-2026!'
          def fail(msg):
              print('P05_FIRST_IMPRESSION_BROWSER=FAIL '+msg,file=sys.stderr)
              raise SystemExit(1)
          def http(method,url,payload=None,headers=None,timeout=25):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=data,method=method,headers=headers or {})
              if data is not None: req.add_header('Content-Type','application/json')
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r: raw=r.read().decode()
              except urllib.error.HTTPError as e:
                  fail(f'http {e.code} {url}: {e.read().decode(errors="replace")[:500]}')
              return json.loads(raw) if raw else {}
          def wait_http(url,timeout=25):
              end=time.time()+timeout
              while time.time()<end:
                  try:
                      with urllib.request.urlopen(url,timeout=1) as r:
                          if r.status<500:return
                  except Exception: time.sleep(.15)
              fail('server not ready '+url)
          def wd(method,path,payload=None):
              r=http(method,f'http://127.0.0.1:{DRIVER_PORT}{path}',payload); v=r.get('value')
              if isinstance(v,dict) and v.get('error'): fail(f"webdriver {v.get('error')}: {v.get('message')}")
              return r
          def sv(s,m,p,payload=None): return wd(m,f'/session/{s}{p}',payload)['value']
          def eid(v): return v['element-6066-11e4-a52e-4f735466cecf']
          def find(s,css): return eid(sv(s,'POST','/element',{'using':'css selector','value':css}))
          def send(s,e,value):
              sv(s,'POST',f'/element/{e}/clear',{})
              sv(s,'POST',f'/element/{e}/value',{'text':value,'value':list(value)})
          def execute(s,script): return sv(s,'POST','/execute/sync',{'script':script,'args':[]})
          def content(s): return str(execute(s,"return document.querySelector('.p05v2-content')?.innerText || ''"))
          def sidebar(s): return str(execute(s,"return document.querySelector('.p05v2-sidebar')?.innerText || ''"))
          def wait(pred,label,timeout=30):
              end=time.time()+timeout; last=None
              while time.time()<end:
                  try:
                      last=pred()
                      if last:return last
                  except Exception as e:last=repr(e)
                  time.sleep(.15)
              fail(f'timeout {label}: {last!r}')
          def click_text(s,label):
              js='''const label=%s;const b=[...document.querySelectorAll('button')].find(x=>x.textContent.trim()===label);if(!b||b.disabled)return false;b.click();return true;''' % json.dumps(label,ensure_ascii=False)
              return bool(execute(s,js))
          def choose_site(s,label):
              js='''const label=%s;const sel=document.querySelector('.p05v2-site-context select');if(!sel)return false;const opt=[...sel.options].find(o=>o.textContent.trim()===label);if(!opt)return false;sel.value=opt.value;sel.dispatchEvent(new Event('change',{bubbles:true}));return true;''' % json.dumps(label,ensure_ascii=False)
              return bool(execute(s,js))
          def require_text(text,items,where):
              missing=[x for x in items if x not in text]
              if missing: fail(where+' missing '+json.dumps(missing,ensure_ascii=False))
          def forbid_text(text,items,where):
              leaked=[x for x in items if x in text]
              if leaked: fail(where+' leaked '+json.dumps(leaked,ensure_ascii=False))
          driver=shutil.which('chromedriver'); chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          if not driver or not chrome: fail('Chrome/ChromeDriver unavailable')
          log=open('/tmp/p05-first-impression-chromedriver.log','wb')
          proc=subprocess.Popen([driver,f'--port={DRIVER_PORT}','--allowed-ips=127.0.0.1'],stdout=log,stderr=subprocess.STDOUT)
          session=None
          try:
              wait_http(BASE+'/api/health'); wait_http(f'http://127.0.0.1:{DRIVER_PORT}/status')
              r=wd('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'chrome','goog:chromeOptions':{'binary':chrome,'args':['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,1000']}}}})
              v=r['value']; session=str(v.get('sessionId') or r.get('sessionId') or '')
              if not session: fail('missing webdriver session')
              sv(session,'POST','/url',{'url':BASE+'/'})
              wait(lambda: execute(session,"return !!document.querySelector(\"input[autocomplete='username']\")"),'login form')
              send(session,find(session,"input[autocomplete='username']"),'owner')
              send(session,find(session,"input[autocomplete='current-password']"),PASSWORD)
              click_text(session,'登录') or fail('login button missing')
              side=wait(lambda: sidebar(session) if '网站组合' in sidebar(session) and '全局' in sidebar(session) else '', 'Chinese Product shell')
              forbid_text(side,['Site Portfolio','Global\n','Global tools'],'sidebar')
              initial=wait(lambda: content(session) if '载入演示数据 →' in content(session) else '', 'demo load action')
              require_text(initial,['网站组合还没有网站','真实网站与演示数据是两条独立入口','载入演示数据 →'],'empty portfolio')
              forbid_text(initial,['Demo Dataset','Demo 数据','Portfolio'],'empty portfolio')
              click_text(session,'载入演示数据 →') or fail('demo load button missing')
              portfolio=wait(lambda: content(session) if all(x in content(session) for x in ['Kewaro Tools','Kewaro Start','Kewaro Guide','Kewaro AI','WordPress Lab','今日优先','今天先看谁']) else '', 'five-site Portfolio',35)
              require_text(portfolio,['今日优先','今天先看谁','数据异常 → 技术故障 → 明显下降 → 高价值机会 → 健康站点。'],'portfolio')
              forbid_text(portfolio,['OWNER QUEUE','SINCE LAST CHECK','observation_state','Demo Dataset','Site Portfolio'],'portfolio')
              choose_site(session,'Kewaro Guide') or fail('Kewaro Guide select unavailable')
              overview=wait(lambda: content(session) if all(x in content(session) for x in ['Kewaro Guide · 概览','发生了什么','为什么可能变化','下一步应该做什么','只看支持判断的数据']) else '', 'Kewaro Guide Overview')
              require_text(overview,['最近变化','发生了什么','可能原因','为什么可能变化','仅为候选解释，不代表因果','需要处理','哪里坏了 / 需要处理','下一步','下一步应该做什么','核心证据','只看支持判断的数据','关键词变化证据 · 前 8 条'],'overview')
              forbid_text(overview,['SINCE LAST CHECK','WHY / EVIDENCE','causal=false','BREAK / FIX','NEXT BEST ACTION','CONTEXT, NOT CAUSALITY','TOP MOVERS','OWNER ACTION','Observation / Evidence'],'overview')
              if '打开精确关键词证据 →' not in overview: fail('canonical Query action missing on Kewaro Guide Overview')
              if '打开落地页证据 →' not in overview: fail('canonical Page action missing on Kewaro Guide Overview')
              click_text(session,'打开精确关键词证据 →') or fail('exact Query evidence action not clickable')
              wait(lambda: content(session) if '当前关键词' in content(session) else '', 'exact Query drilldown')
              click_text(session,'概览') or fail('Overview nav unavailable after Query drilldown')
              overview=wait(lambda: content(session) if '发生了什么' in content(session) and '打开落地页证据 →' in content(session) else '', 'Overview after Query drilldown')
              click_text(session,'打开落地页证据 →') or fail('exact Page evidence action not clickable')
              wait(lambda: content(session) if '当前页面' in content(session) else '', 'exact Page drilldown')
              sv(session,'POST','/window/rect',{'width':390,'height':844})
              time.sleep(.4)
              overflow=int(execute(session,"return Math.max(document.documentElement.scrollWidth,document.body ? document.body.scrollWidth : 0)-document.documentElement.clientWidth"))
              if overflow != 0: fail(f'mobile horizontal overflow={overflow}')
              print('P05_FIRST_IMPRESSION_MOBILE_OVERFLOW=0')
              print('P05_FIRST_IMPRESSION_CANONICAL_QUERY=PASS')
              print('P05_FIRST_IMPRESSION_CANONICAL_PAGE=PASS')
              print('P05_FIRST_IMPRESSION_BROWSER=PASS')
          finally:
              if session:
                  try: wd('DELETE',f'/session/{session}')
                  except Exception: pass
              proc.terminate()
              try: proc.wait(timeout=5)
              except Exception: proc.kill()
              log.close()
          PY

      - name: Read-only exact boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '163d60f04f01bb0bd38b36de9723cb18053549c9'
          test "$(git rev-parse HEAD^{tree})" = '7dc40056890d77c51fac2938b16d4843894391bf'
          test -z "$(git status --porcelain)"
          echo 'P05_PRODUCT_SOURCE_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
