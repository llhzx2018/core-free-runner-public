name: P07 Release12 Readback Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release12-readback-exact.yml'

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read token
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private authority candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 44cdcf4c483f761bc8c41e4c6c9326bba9686adf
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Release12 authority readback
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '44cdcf4c483f761bc8c41e4c6c9326bba9686adf'
          test "$(cat BUILD_ID)" = '0.1.0-release12'
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null

          grep -Fq 'Slot 3 CloudPanel Ops                = 0.1.0-release12' docs/authority/CURRENT.md
          grep -Fq 'Public Distribution                   = ec8d2587c411b36178c12160960a8ea3bf62cf6c' docs/authority/CURRENT.md
          grep -Fq '36701825127 PASS' docs/authority/CURRENT.md
          grep -Fq '5a278aec6d9a49c257589f762d8abeb09847f990' docs/authority/CURRENT.md
          grep -Fq 'd743dc37bf6d7fd5649513b24372d30f205a0400' docs/authority/CURRENT.md
          grep -Fq '61ef13cd9de032000c5da1ad496429f03b72cf09' docs/authority/CURRENT.md
          grep -Fq 'cfb88ff2491dc9fb606e087256dab502d0f285a7' docs/authority/CURRENT.md
          grep -Fq '121dbebdf9c3e85577be0a279c00b177012e8475' docs/authority/CURRENT.md
          grep -Fq 'release12 Production install            NOT_YET_OWNER_VERIFIED' docs/authority/CURRENT.md

          grep -Fq '| B44 | Backup Freshness / Restore Visibility |' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'Distribution Gate `36701825127`' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'PUBLIC_DISTRIBUTED · OWNER_REAL_USE_PENDING' docs/authority/ACCEPTANCE_MATRIX.md
          ! grep -F 'B44 | Backup Freshness / Restore Visibility' docs/authority/ACCEPTANCE_MATRIX.md | grep -Fq 'DISTRIBUTION_PENDING'

          python3 - <<'PY'
          import json
          p=json.load(open('docs/authority/P07_INTEGRATION_MANIFEST.json',encoding='utf-8'))
          slot3=next(x for x in p['slots'] if x['slot']==3)
          assert slot3['internal_version']=='0.1.0-release12'
          assert slot3['source_main_commit']=='e4a72657cc87ff970012c7e89adf4ba143cd0a44'
          assert slot3['backup_freshness_contract']=='MYSQL_QUIESCENT_POST_COMMIT_FRESH_VERIFY_V1'
          assert p['release']['slot3_build']=='0.1.0-release12'
          assert p['release']['public_distribution_commit']=='ec8d2587c411b36178c12160960a8ea3bf62cf6c'
          assert p['release']['runtime_manifest_blob']=='5a278aec6d9a49c257589f762d8abeb09847f990'
          assert p['production']['slot3_build']=='0.1.0-release3'
          assert p['production']['release12_install_status']=='NOT_YET_OWNER_VERIFIED'
          assert p['production']['migration_executed'] is False
          assert p['production']['dns_write'] is False
          assert p['production']['source_delete'] is False
          PY

      - name: Secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/secret_scan.py --root docs tests/test_p07_integration_manifest.py

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE12_READBACK_SOURCE=44cdcf4c483f761bc8c41e4c6c9326bba9686adf'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
