name: P02 W3 three real database engine isolated exact-source proof
on:
  pull_request:
    paths:
      - .github/workflows/p02-w3-three-engine-oneoff.yml
permissions:
  contents: read
jobs:
  isolated-w3-engines:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-three-engine-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_DATABASE: p02_w3_mysql
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pp02_w3_disposable_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_DATABASE: p02_w3_mariadb
        ports:
          - 33307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    steps:
      - name: Checkout exact private P02 W3 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 7f570e22863695835d60bc40081012a9817d63df
          path: vf-library
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
      - name: Install isolated PHP PDO database clients and pinned Laravel 13 vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C vf-library rev-parse HEAD)" = "7f570e22863695835d60bc40081012a9817d63df"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-zip php8.3-mbstring php8.3-xml composer sqlite3 >/dev/null
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") ? 0 : 1);'
          composer --working-dir=vf-library/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --optimize-autoloader > "$RUNNER_TEMP/p02-w3-composer.log" 2>&1 || { echo P02_W3_COMPOSER_DEPENDENCY_INSTALL=FAIL; exit 1; }
          test -s vf-library/modern/laravel/vendor/autoload.php
          echo P02_W3_REAL_LARAVEL_13_VENDOR=PASS
      - name: Real source, denial fixture and PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd vf-library
          python3 scripts/p02-w3-source-gate.py
          python3 -m unittest discover -s tests/unit -p test_p02_w3_engine_sandbox_source.py -v
          php -l modern/laravel/P02W3EngineSandbox.php
          php -l tests/integration/p02_w3_three_engine_sandbox.php
          echo P02_W3_SOURCE_NEGATIVES_AND_PHP_SYNTAX=PASS
      - name: SQLite real in-memory clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
      - name: MySQL 8.4 real isolated clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: mysql
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
      - name: MariaDB 11.8 real isolated clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: mariadb
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
          echo P02_W3_EXACT_THREE_DATABASE_SOURCE_STAGE=PASS
          echo P02_W3_WEB_INSTALL_FULL_ATOMIC=NOT_PROVEN
          echo P02_W3_PRODUCTION=NOT_TOUCHED
      - name: Whole existing repository regression after independent engine proof
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd vf-library
          log="$RUNNER_TEMP/p02-w3-repository.log"
          if bash scripts/verify-repository.sh > "$log" 2>&1; then
            echo P02_W3_EXISTING_REPOSITORY_REGRESSION=PASS
          else
            python3 - "$log" <<'PY'
          from pathlib import Path
          import re,sys
          lines=Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pattern=re.compile(r'^(?:not ok \d+ - |# (?:fail|pass|tests) |\s*FAIL: |\s*ERROR: |\s*AssertionError: |P02_[A-Z0-9_]+=FAIL)',re.I)
          names=[re.sub(r'\x1b\[[0-9;]*m','',x)[:160] for x in lines if pattern.search(x)]
          print("P02_W3_REPOSITORY_FAILED_NAMED_TESTS_BEGIN")
          for name in names[-40:]:print(name)
          print("P02_W3_REPOSITORY_FAILED_NAMED_TESTS_END")
          PY
            echo P02_W3_EXISTING_REPOSITORY_REGRESSION=FAIL
            exit 1
          fi
      - name: Erase transient private source and dependency files
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- vf-library
          rm -f -- "$RUNNER_TEMP/p02-w3-composer.log" "$RUNNER_TEMP/p02-w3-repository.log"
          echo P02_W3_PRIVATE_SOURCE_NOT_PERSISTED=YES
