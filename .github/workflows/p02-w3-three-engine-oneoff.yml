          echo P02_W3_PHYSICAL_SQLITE_RESTART_OWNER_SESSION_MATERIAL=PASS
          echo P02_W3_SQLITE_CLOUDPANEL_FULL_ATOMIC=NOT_PROVEN
      - name: Real current P02 SQLite 2401 authoritative migration and FTS5 through Laravel Material
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_TRUE_2401_CLI: '1'
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_exact_sqlite_2401.php
