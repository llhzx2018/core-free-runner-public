          echo P02_W3_MYSQL_MARIADB_2401_FULL_PARITY=NOT_PROVEN
      - name: MySQL 8.4 real local HTTP Owner and canonical Material survive PHP restart
        shell: bash
        env:
          P02_W3_ENGINE: mysql
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_USER: root
