name: P02 W3 three real database engine isolated exact-source proof
on:
  pull_request:
    paths:
      - .github/workflows/p02-w3-three-engine-oneoff.yml
env:
  TARGET_VERSION: '2.5.131'
  TARGET_SHA: '448cad245460fbc21d2ac3df6005a3d4e52d5e6c'
permissions:
  contents: read
jobs:
  isolated-w3-engines:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w3-three-engine-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_DATABASE: p02_w3_mysql
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pp02_w3_disposable_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p02_w3_disposable_only
          MARIADB_DATABASE: p02_w3_mariadb
        ports:
          - 33307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    steps:
      - name: Checkout registered public lane contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner-lane
          persist-credentials: false
          fetch-depth: 1
      - name: Audit rendered temporary exact-source lane identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner-lane/scripts/ephemeral_lane_spec.py audit-rendered \
            --spec runner-lane/proof/p02-w3-three-engine-lane.json \
            --input runner-lane/.github/workflows/p02-w3-three-engine-oneoff.yml
          test "$TARGET_SHA" = "448cad245460fbc21d2ac3df6005a3d4e52d5e6c"
          test "$TARGET_VERSION" = '2.5.131'
      - name: Checkout exact private P02 W3 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 448cad245460fbc21d2ac3df6005a3d4e52d5e6c
          path: vf-library
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
      - name: Install isolated PHP PDO database clients and pinned Laravel 13 vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C vf-library rev-parse HEAD)" = "448cad245460fbc21d2ac3df6005a3d4e52d5e6c"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php8.3-cli php8.3-mysql php8.3-sqlite3 php8.3-zip php8.3-mbstring php8.3-xml composer sqlite3 >/dev/null
          php -r 'exit(PHP_VERSION_ID>=80300 && extension_loaded("pdo_sqlite") && extension_loaded("pdo_mysql") ? 0 : 1);'
          composer --working-dir=vf-library/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress --optimize-autoloader > "$RUNNER_TEMP/p02-w3-composer.log" 2>&1 || { echo P02_W3_COMPOSER_DEPENDENCY_INSTALL=FAIL; exit 1; }
          test -s vf-library/modern/laravel/vendor/autoload.php
          echo P02_W3_REAL_LARAVEL_13_VENDOR=PASS
      - name: Real source, denial fixture and PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd vf-library
          python3 scripts/p02-w3-source-gate.py
          python3 -m unittest discover -s tests/unit -p test_p02_w3_engine_sandbox_source.py -v
          php -l modern/laravel/P02W3EngineSandbox.php
          php -l modern/laravel/P02W3FirstInstallCandidate.php
          php -l modern/laravel/P02W3UnifiedInstallCandidate.php
          php -l modern/laravel/P02W3PersistentSQLite.php
          php -l modern/laravel/P02W3PersistentSql.php
          python3 -m py_compile tests/integration/p02_w3_persistent_http_sql.py
          php -l modern/laravel/P02W3SQLite2401Exact.php
          php -l tests/integration/p02_w3_exact_sqlite_2401.php
          php -l modern/laravel/P02W3PersistentHttp.php
          python3 -m py_compile tests/integration/p02_w3_persistent_http_sqlite.py
          php -l tests/integration/p02_w3_unified_install.php
          php -l modern/laravel/P02W3CanonicalMaterial.php
          php -l modern/laravel/P02W3RelationalSchema2401Candidate.php
          php -l modern/laravel/P02W3AssetRecovery.php
          php -l tests/integration/p02_w3_asset_recovery.php
          php -l tests/integration/p02_w3_relational_schema_2401.php
          php -l tests/integration/p02_w3_canonical_material.php
          php -l modern/laravel/P02W3InstallPreviewPage.php
          php -l modern/laravel/w3-install-preview-router.php
          python3 -m py_compile tests/integration/p02_w3_http_install_preview.py
          php -l tests/integration/p02_w3_three_engine_sandbox.php
          echo P02_W3_SOURCE_NEGATIVES_AND_PHP_SYNTAX=PASS
      - name: SQLite real in-memory clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
      - name: MySQL 8.4 real isolated clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: mysql
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
      - name: MariaDB 11.8 real isolated clean schema CRUD FK transaction
        shell: bash
        env:
          P02_W3_ENGINE: mariadb
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_DSN: mysql:host=127.0.0.1;port=33307;dbname=p02_w3_mariadb;charset=utf8mb4
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_three_engine_sandbox.php
          echo P02_W3_EXACT_THREE_DATABASE_INSTALL_BACKEND=PASS
          echo P02_W3_WEB_INSTALL_FULL_ATOMIC=NOT_PROVEN
          echo P02_W3_PRODUCTION=NOT_TOUCHED
      - name: SQLite real localhost HTTP installer input origin CSRF and Owner flow
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
        run: |
          set -Eeuo pipefail
          set +x
          python3 vf-library/tests/integration/p02_w3_http_install_preview.py sqlite
      - name: MySQL 8.4 localhost HTTP installer and isolated clean DB
        shell: bash
        env:
          P02_W3_ENGINE: mysql
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
          P02_W3_USER: root
