          echo P02_W3_REAL_18_TABLE_SINGLE_INSTALL_OWNER_ALL_THREE_ENGINES=PASS
          echo P02_W3_CLOUDPANEL_FULL_ATOMIC=NOT_PROVEN
      - name: SQLite physical disk and Owner session persist across PHP processes
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          set +x
