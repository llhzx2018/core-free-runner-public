          echo P02_W3_THREE_ENGINE_HTTP_SETUP_STAGE=PASS
          echo P02_W3_CLOUDPANEL_FULL_ATOMIC=NOT_PROVEN
      - name: SQLite actual P02 canonical Material columns and behavior
        shell: bash
        env:
          P02_W3_ENGINE: sqlite
          P02_W3_SYNTHETIC_ONLY: '1'
        run: |
          set -Eeuo pipefail
          set +x
          export P02_W3_VENDOR_AUTOLOAD="$PWD/vf-library/modern/laravel/vendor/autoload.php"
          php vf-library/tests/integration/p02_w3_canonical_material.php
      - name: MySQL 8.4 actual P02 canonical Material core
        shell: bash
        env:
