name: P05 Phase 2 Exact Source Zero-Paid Verification

on:
  push:
    branches: [main]
    paths:
      - 'requests/p05-phase2-exact-verify-*.txt'

permissions:
  contents: read

concurrency:
  group: p05-phase2-exact-source-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_P05_SHA: 351553ab4752438ee449211ac2313d383d481bc1
      EXPECTED_MANIFEST_FILE_SHA256: 1db14218711945e69d7bf041fa67528eb17ec1da2d069d8400c3eb23b8454a34
      EXPECTED_MANIFEST_ROOT_SHA256: 4f126b04914993dd4d7cc6e02a3833103b76441fd52f6c38a58942fd8dbaadba
      NODE_IMAGE: node:24-bookworm@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
      POSTGRES_IMAGE: postgres:18@sha256:7157393f508fd8eb46119937fab39813783fe3e7d4c6316c45c12ce2ea25e61d
      DATABASE_URL: postgresql://vfseo:fixture-pass@127.0.0.1:5432/vfseo
      VF_ADMIN_USERNAME: phase2-admin
      VF_ADMIN_PASSWORD: fixture-phase2-admin-password-20260815
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_TRUST_PROXY: 'false'
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - name: Checkout public control repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require private read credential
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.VF_SEO_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Checkout exact private P05 source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-seo
          ref: 351553ab4752438ee449211ac2313d383d481bc1
          token: ${{ secrets.VF_SEO_READ_TOKEN }}
          path: p05
          fetch-depth: 1
          persist-credentials: false

      - name: Guard exact source identity and sealed-input boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "$EXPECTED_P05_SHA"
          test "$(tr -d '\r\n' < p05/VERSION)" = '1.0.0'
          test ! -e p05/.github/phase2-upload/part00
          echo "$EXPECTED_MANIFEST_FILE_SHA256  p05/docs/evidence/PHASE2_SOURCE_MANIFEST.sha256" | sha256sum -c -
          grep -F "# sha256=$EXPECTED_MANIFEST_ROOT_SHA256" p05/docs/evidence/PHASE2_SOURCE_MANIFEST.sha256 >/dev/null
          echo 'EXACT_SOURCE_IDENTITY=PASS'

      - name: Provision pinned Node 24 and PostgreSQL 18
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull "$NODE_IMAGE" >/dev/null
          docker pull "$POSTGRES_IMAGE" >/dev/null
          docker rm -f p05-pg >/dev/null 2>&1 || true
          docker run -d --name p05-pg \
            -e POSTGRES_USER=vfseo -e POSTGRES_PASSWORD=fixture-pass -e POSTGRES_DB=vfseo \
            -p 127.0.0.1:5432:5432 "$POSTGRES_IMAGE" >/dev/null
          for i in $(seq 1 60); do
            if docker exec p05-pg pg_isready -U vfseo -d vfseo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec p05-pg pg_isready -U vfseo -d vfseo
          docker run --rm "$NODE_IMAGE" node --version
          docker exec p05-pg postgres --version

      - name: Install exact lockfile and static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e DATABASE_URL -e VF_ADMIN_USERNAME -e VF_ADMIN_PASSWORD -e VF_SECURE_COOKIES -e VF_REQUIRE_HTTPS -e VF_TRUST_PROXY -e VF_MASTER_KEY_BASE64 \
            -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            bash -lc 'npm ci && npm run lint && npm run typecheck'

      - name: Migration schema clean install admin bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e DATABASE_URL -e VF_ADMIN_USERNAME -e VF_ADMIN_PASSWORD -e VF_SECURE_COOKIES -e VF_REQUIRE_HTTPS -e VF_TRUST_PROXY -e VF_MASTER_KEY_BASE64 \
            -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            bash -lc 'npm run migrate && npm run verify:schema && npm run clean-install:check && npm run bootstrap:admin && npm run verify:admin-ready'

      - name: Phase 2 security regression
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e DATABASE_URL -e VF_ADMIN_USERNAME -e VF_ADMIN_PASSWORD -e VF_SECURE_COOKIES -e VF_REQUIRE_HTTPS -e VF_TRUST_PROXY -e VF_MASTER_KEY_BASE64 \
            -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" bash -lc 'npm run test:security'

      - name: Phase 1 frozen regression
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host \
            -e DATABASE_URL -e VF_ADMIN_USERNAME -e VF_ADMIN_PASSWORD -e VF_SECURE_COOKIES -e VF_REQUIRE_HTTPS -e VF_TRUST_PROXY -e VF_MASTER_KEY_BASE64 \
            -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" bash -lc 'npm test'

      - name: Build dependency and audit gates
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host -e DATABASE_URL -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            bash -lc 'npm run build && npm run dependency:gate && npm audit --audit-level=high'

      - name: Source scope secret private-data security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network host -e DATABASE_URL -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            bash -lc 'npm run source:gate && npm run scope:gate && npm run security:gate'
          if grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude='*.map' -E -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|ya29\.[A-Za-z0-9._~-]+|1//[A-Za-z0-9._~-]{20,}' p05/src p05/tests p05/database p05/scripts >/tmp/p05-secret-hits; then
            cat /tmp/p05-secret-hits
            exit 1
          fi
          if grep -RIl --exclude-dir=.git --exclude-dir=node_modules -E -- '(start|lib|forge|infra)\.kewaro\.com|llhzx2018@gmail\.com' p05/src p05/tests p05/database >/tmp/p05-private-hits; then
            cat /tmp/p05-private-hits
            exit 1
          fi
          echo 'SECRET_GATE=PASS'
          echo 'PRIVATE_DATA_GATE=PASS'

      - name: Rebuild and compare exact Phase 2 source manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            node scripts/source-manifest-phase2.mjs > "$RUNNER_TEMP/PHASE2_SOURCE_MANIFEST.sha256"
          cmp -s p05/docs/evidence/PHASE2_SOURCE_MANIFEST.sha256 "$RUNNER_TEMP/PHASE2_SOURCE_MANIFEST.sha256"
          echo "$EXPECTED_MANIFEST_FILE_SHA256  $RUNNER_TEMP/PHASE2_SOURCE_MANIFEST.sha256" | sha256sum -c -
          echo 'PHASE2_SOURCE_MANIFEST=PASS'

      - name: Final exact-source non-sealing assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = "$EXPECTED_P05_SHA"
          test "$(tr -d '\r\n' < p05/VERSION)" = '1.0.0'
          test ! -e p05/.github/phase2-upload/part00
          echo 'PHASE2_EXACT_SOURCE_EXECUTION_GATES=PASS'
          echo 'CANDIDATE=NONE'
          echo 'PRODUCTION=NONE'

      - name: Cleanup private source and database
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f p05-pg >/dev/null 2>&1
          docker run --rm -v "$GITHUB_WORKSPACE/p05:/work" "$NODE_IMAGE" sh -lc 'rm -rf /work/node_modules /work/dist' >/dev/null 2>&1 || true
          rm -rf p05
          rm -f "$RUNNER_TEMP/PHASE2_SOURCE_MANIFEST.sha256" /tmp/p05-secret-hits /tmp/p05-private-hits
          echo 'PRIVATE_SOURCE_CLEANUP=PASS'
