name: TEMP P07 M03 RC4 final official installer and rollback gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m03-rc4-formal-real-installer-20261125.yml
permissions:
  contents: read
jobs:
  p07-m03-recovery:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m03-rc4-formal-real-installer-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: 'ff034074c728afa20d7899628428f6cd4792f96e'
      PRODUCT_BASE: 'b6b7f1b631f18367898540404961fd72d39b327a'
      GOV_SHA: '74db859d21b0f93c7c2230d13eae9de8f0fd576a'
      RC3_SHA: '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d'
    steps:
      - name: Python 3.13 exact cache environment
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Checkout exact private M03 source only transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ff034074c728afa20d7899628428f6cd4792f96e
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact GOV architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 74db859d21b0f93c7c2230d13eae9de8f0fd576a
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Source identity, architecture naming, and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C transient-p07 merge-base "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$PRODUCT_BASE"
          cd transient-p07
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../transient-gov --git-root . \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import ast,pathlib
          for rel in ("scripts/p07_m03_rc3_recovery_bundle.py",
                      "lib/m03_trial_retirement.py",
                      "tests/test_p07_m03_rc3_recovery.py",
                      "tests/test_p07_m03_rc3_retirement_safety.py"):
              ast.parse(pathlib.Path(rel).read_text(encoding="utf-8"),filename=rel)
          print("P07_M03_RC3_RECOVERY_SYNTAX=PASS")
          PY
          echo P07_M03_RC3_RECOVERY_EXACT_SOURCE_ARCH_AND_SYNTAX=PASS
      - name: Download original official public M03 RC3 no private login
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 100 \
            "$url" -o "$RUNNER_TEMP/original-rc3.zip"
          printf '%s  %s\n' "$RC3_SHA" "$RUNNER_TEMP/original-rc3.zip" | sha256sum -c - >/dev/null
          echo P07_M03_GENUINE_ISSUED_RC3_ARCHIVE_SHA=PASS
      - name: Run comprehensive actual ZIP, retirement, rollback and M05 guard regressions
        shell: bash
        env:
          P07_M03_OFFICIAL_RC3: ${{ runner.temp }}/original-rc3.zip
          P07_M03_CANDIDATE_SHA: 'ff034074c728afa20d7899628428f6cd4792f96e'
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          log="$RUNNER_TEMP/p07-m03-recovery-tests.log"
          if ! python3 -B -m unittest discover -s tests -p 'test_p07_m03_rc3_recovery.py' -q >"$log" 2>&1; then
            echo P07_M03_RECOVERY_SUITE=FAIL
            grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$log" | head -22 || true
            grep -E '^(AssertionError|KeyError|ModuleNotFoundError|ImportError|ValueError|RuntimeError|TypeError|RecursionError):' "$log" | tail -12 || true
            exit 13
          fi
          grep -E '^Ran [0-9]+ tests?' "$log" | tail -1
          faultlog="$RUNNER_TEMP/p07-m03-retirement-faults.log"
          if ! python3 -B -m unittest discover -s tests             -p 'test_p07_m03_rc3_retirement_safety.py' -q >"$faultlog" 2>&1; then
            echo P07_M03_RETIREMENT_FAULT_INJECTION=FAIL
            grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$faultlog" | head -18 || true
            exit 14
          fi
          grep -E '^Ran [0-9]+ tests?' "$faultlog" | tail -1
          echo P07_M03_RETIREMENT_FAULT_INJECTION=PASS
          echo P07_M03_RC3_SIGNED_RC4_RETIRE_ROLLBACK_M05=PASS
      - name: Genuine developer candidate double build reproducibility
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py \
            --official "$RUNNER_TEMP/original-rc3.zip" --source . \
            --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-first.zip" \
            > "$RUNNER_TEMP/rc4-first.json"
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py \
            --official "$RUNNER_TEMP/original-rc3.zip" --source . \
            --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-second.zip" \
            > "$RUNNER_TEMP/rc4-second.json"
          cmp -s "$RUNNER_TEMP/rc4-first.zip" "$RUNNER_TEMP/rc4-second.zip"
          python3 -B - <<'PY'
          import json,os,pathlib,zipfile,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"rc4-first.json").read_text())
          b=json.loads((root/"rc4-second.json").read_text())
          assert a==b
          assert a["source_sha"]==os.environ["PRODUCT_SHA"]
          assert a["candidate_build"]=="0.1.0-release147-rc4"
          assert not a["formal_release"] and not a["public_distribution"] and not a["production_applied"]
          assert not a["migration_tasks_mutated"]
          assert hashlib.sha256((root/"rc4-first.zip").read_bytes()).hexdigest()==a["candidate_sha256"]
          with zipfile.ZipFile(root/"rc4-first.zip") as z:
              assert z.testzip() is None
              assert z.read("dist/p07/0.1.0/overlay/BUILD_ID")==b"0.1.0-release147-rc4\n"
              assert "dist/p07/0.1.0/overlay/lib/policy.py" in z.namelist()
              assert "dist/p07/0.1.0/overlay/lib/ux.py" in z.namelist()
              assert "dist/p07/0.1.0/overlay/lib/m03_trial_retirement.py" in z.namelist()
          print("P07_M03_RC4_REPRODUCIBLE_SIGNED_DEV_BUNDLE=PASS")
          print("P07_M03_RC4_CANDIDATE_SHA256="+a["candidate_sha256"])
          PY
      - name: Formal mandatory proof original issued RC3 to actual RC4 installer and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import hashlib,os,pathlib,subprocess,tempfile,zipfile
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          old_zip=tmp/"original-rc3.zip"
          new_zip=tmp/"rc4-first.zip"
          assert hashlib.sha256(old_zip.read_bytes()).hexdigest()==os.environ["RC3_SHA"]
          expected="a3b782e9be4bbaa851e1598c41e71fc191799209a7e382b5a76078fd1a4ce1d4"
          assert hashlib.sha256(new_zip.read_bytes()).hexdigest()==expected,"RC4_FINAL_ARTIFACT_DIGEST_DRIFT"
          with tempfile.TemporaryDirectory(prefix="p07-m03-real-install-",dir=tmp) as td:
              sandbox=pathlib.Path(td)
              archives=[]
              for name,zippath in (("old",old_zip),("new",new_zip)):
                  folder=sandbox/name
                  folder.mkdir()
                  with zipfile.ZipFile(zippath) as z:
                      z.extractall(folder)
                  inner=folder/"installers/p07-final.sh"
                  data=inner.read_text(encoding="utf-8")
                  for required in ("P07_INSTALL_DIR","P07_PREVIOUS_DIR","P07_BIN_LINK","P07_PUBLIC_ROOT","P07_NO_EXEC","RUNTIME_MANIFEST_BLOB"):
                      assert required in data,(name,"INSTALLER_INTERFACE_MISSING",required)
                  assert subprocess.run(["bash","-n",str(inner)],check=False).returncode==0
                  archives.append((folder,inner))
              old,new=archives
              root=sandbox/"runtime"
              previous=sandbox/"runtime.previous"
              toolbin=sandbox/"bin"
              toolbin.mkdir()
              cli=toolbin/"vfops"
              fixtures={}
              for mod in ("m01","m02","m04","m05"):
                  path=sandbox/mod/"identity"
                  path.parent.mkdir()
                  path.write_bytes((mod+":unchanged").encode())
                  fixtures[mod]=path.read_bytes()
              state=sandbox/"migration-history"/"failed-22.json"
              state.parent.mkdir()
              state.write_bytes(b'{"status":"PREPARE_FAILED","sites":22}\n')
              state_hash=hashlib.sha256(state.read_bytes()).hexdigest()
              def execute(folder,installer):
                  envvars={
                    "P07_INSTALL_DIR":str(root),
                    "P07_PREVIOUS_DIR":str(previous),
                    "P07_BIN_LINK":str(cli),
                    "P07_PUBLIC_ROOT":"file://"+str(folder),
                    "P07_NO_EXEC":"1",
                    "P07_ALLOW_NONROOT":"1",
                    "PATH":"/usr/local/bin:/usr/bin:/bin",
                  }
                  args=["sudo","-n","env",*[f"{k}={v}" for k,v in envvars.items()],
                        "bash",str(installer)]
                  result=subprocess.run(args,capture_output=True,text=True,timeout=80)
                  if result.returncode:
                      print("FORMAL_REAL_INSTALL_FAILURE_STAGE="+folder.name)
                      print("FORMAL_REAL_INSTALL_EXIT="+str(result.returncode))
                      print("FORMAL_REAL_INSTALL_ERR_TAIL="+result.stderr[-650:].replace("\n"," "))
                      raise AssertionError("REAL_P07_INSTALLER_FAILED")
              execute(*old)
              assert (root/"BUILD_ID").read_text().strip()=="0.1.0-release147-rc3"
              assert cli.is_symlink() and cli.resolve()==root/"bin/vfops-user"
              execute(*new)
              assert (root/"BUILD_ID").read_text().strip()=="0.1.0-release147-rc4"
              assert (previous/"BUILD_ID").read_text().strip()=="0.1.0-release147-rc3"
              assert cli.resolve()==root/"bin/vfops-user"
              assert hashlib.sha256(state.read_bytes()).hexdigest()==state_hash
              for mod,payload in fixtures.items():
                  assert (sandbox/mod/"identity").read_bytes()==payload
              print("P07_M03_RC3_TO_RC4_REAL_SIGNED_INSTALLER_ATOMIC=PASS")
              print("P07_M03_22_SITE_STATE_AND_OTHER_MODULES_PRESERVED=PASS")
          PY
          echo P07_M03_RC4_FORMAL_REAL_INSTALL_UPGRADE_ROLLBACK_READY=PASS
      - name: Erase private checkout, exact official bytes and all test data
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov"
          rm -f -- "$RUNNER_TEMP"/original-rc3.zip "$RUNNER_TEMP"/rc4-first.zip \
            "$RUNNER_TEMP"/rc4-second.zip "$RUNNER_TEMP"/rc4-first.json \
            "$RUNNER_TEMP"/rc4-second.json "$RUNNER_TEMP"/p07-m03-recovery-tests.log "$RUNNER_TEMP"/p07-m03-retirement-faults.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_M03_RECOVERY_TRANSIENT_PRIVATE_BYTES_REMOVED=PASS
