name: P08 R85 P01-P02 official SHA256 Atomic source and package checks
on:
  push:
    branches: [test/p08-r85-official-sha256-20261113]
permissions:
  contents: read
jobs:
  exact-source-and-pair:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-r85-official-sha256-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e7e946adc1ab4fc19540098461ba093fd9891b02
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact PR head and single ancestor Bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = e7e946adc1ab4fc19540098461ba093fd9891b02
          git merge-base --is-ancestor 513f9d027d1f45111b0fc4f00fdccbc9843c00fe HEAD
          python3 scripts/check_bridge_runtime_parity.py
          python3 tests/test_bridge_runtime_parity.py
          python3 tests/test_verify_owner_atomic_pair.py
          echo P08_R85_EXACT_BRIDGE_SOURCE_AND_STRUCTURAL_NEGATIVES=PASS
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring,ctype,dom,xml,zip,curl,sodium,pdo_sqlite,pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: New and historical PHP syntax/negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in src/Upgrade/GitHubVerifiedCandidatePreparation.php src/Upgrade/GitHubSignedCandidateIntake.php src/Upgrade/GitHubStableReleaseClient.php src/Upgrade/GitHubStableReleaseGate.php src/Upgrade/OwnerUpgradePreparation.php src/Upgrade/OwnerUpgradeJob.php; do
            php -l "$file" > /dev/null
          done
          php tests/test_github_stable_release_gate.php
          php tests/test_owner_upgrade_preparation.php
          php tests/test_owner_upgrade_job.php
          echo P08_R85_BACKUP_ATOMIC_AND_UPGRADE_PHP_SYNTAX=PASS
      - name: Build three real offline FULL and Atomic artifacts, no upload or sign
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py --repo "$GITHUB_WORKSPACE" --target-sha e7e946adc1ab4fc19540098461ba093fd9891b02 --output-dir "$RUNNER_TEMP/p08-r85-build"
          python3 scripts/verify_owner_atomic_pair.py "$RUNNER_TEMP/p08-r85-build" 513f9d027d1f45111b0fc4f00fdccbc9843c00fe e7e946adc1ab4fc19540098461ba093fd9891b02
          echo P08_R85_THREE_REAL_PACKAGE_BYTES_VERIFIED=PASS
      - name: Clean private source and test bytes
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          rm -rf "$RUNNER_TEMP/p08-r85-build"
          echo P08_R85_NO_PRIVATE_SOURCE_OR_ARTIFACT_LEFT=YES
