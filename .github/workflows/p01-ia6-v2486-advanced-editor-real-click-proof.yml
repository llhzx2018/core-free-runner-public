name: p01-ia6-v2486-advanced-editor-real-click-proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-v2486-advanced-editor-real-click-proof.yml'
permissions:
  contents: read
jobs:
  one-exact-head-frontstage-save:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: f3b1c0976bc1b2e50f3ca522eed49b450c018183
    steps:
      - name: Lock exact product source and prepare disposable PHP
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          test -n "$READ_TOKEN"
          remote="https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git"
          test "$(git ls-remote "$remote" refs/heads/feat/ia-v6-frontstage-admin-parity-system-jobs-r1 | awk '{print $1}')" = "$TARGET_SHA"
          git clone -q --no-checkout "$remote" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.486"
          node candidate/tests/unit/p01_ia6_recycle_purge_r16_contract.cjs
          echo P01_EXACT_FRONTSTAGE_SOURCE=PASS
      - name: Real Chromium click edit confirm save readback on synthetic Watch
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$(mktemp -d /tmp/p01-ia6-purge-XXXXXXXX)"
          cp -a candidate/src/. "$root/"
          (cd "$root"; php -S 127.0.0.1:18968 -t . >/tmp/p01-ia6-real-browser-php.log 2>&1) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$root" /tmp/p01-ia6-real-browser-*' EXIT
          for i in $(seq 1 60); do
            if curl -fsS -c /tmp/p01-ia6-real-browser-cookie -b /tmp/p01-ia6-real-browser-cookie http://127.0.0.1:18968/setup.php -o /tmp/p01-ia6-real-browser-setup.html 2>/dev/null; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open('/tmp/p01-ia6-real-browser-setup.html').read())
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -b /tmp/p01-ia6-real-browser-cookie -c /tmp/p01-ia6-real-browser-cookie \
            -X POST http://127.0.0.1:18968/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 browser real click synthetic" \
            --data-urlencode "admin_password=P01Browser!18968" \
            --data-urlencode "admin_password_confirm=P01Browser!18968" \
            -o /tmp/p01-ia6-real-browser-installed.html
          (cd "$root"; php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          VF_E2E_RUNTIME_ROOT="$root" VF_IA6_DISPOSABLE_ACK=IA6-PURGE-SYNTHETIC-ONLY \
            php candidate/tests/integration/p01_ia6_recycle_purge_stale_batch_disposable.php
          VF_IA6_ROOT="$root" php <<'PHP'
          <?php
          require getenv('VF_IA6_ROOT').'/app/bootstrap.php';
          require_once getenv('VF_IA6_ROOT').'/app/SurfaceRepository.php';
          $db=vf_db();$repo=new VfRepository($db);
          $r=$repo->saveLink(null,['surface'=>'watch',
            'title'=>'IA6_BROWSER_ADVANCED_18968',
            'url'=>'https://example.org/ia6-browser-advanced-18968',
            'description'=>'Synthetic only','tags'=>['browser-proof'],
            'is_private'=>1,'is_pending'=>0,'force_duplicate'=>1]);
          $id=(int)$r['id'];
          (new VfSurfaceRepository($db))->upsertProfile($id,[
            'surface'=>'watch','resource_kind'=>'film',
            'note'=>'BEFORE_BROWSER_18968','media_year'=>2025,'media_status'=>'want']);
          echo "P01_IA6_SYNTHETIC_WATCH_SEEDED=PASS\n";
          PHP
          npm install --prefix /tmp/p01-ia6-real-browser-npm --no-audit --no-fund playwright@1.56.1 >/tmp/p01-ia6-real-browser-npm.log
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia6-real-browser-bins /tmp/p01-ia6-real-browser-npm/node_modules/.bin/playwright install --with-deps chromium >/tmp/p01-ia6-real-browser-chromium.log
          NODE_PATH=/tmp/p01-ia6-real-browser-npm/node_modules \
          PLAYWRIGHT_BROWSERS_PATH=/tmp/p01-ia6-real-browser-bins \
          node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const origin='http://127.0.0.1:18968';
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            try{
              const ctx=await browser.newContext({viewport:{width:1440,height:900}});
              await ctx.route(/https?:\/\/(?!127\.0\.0\.1)/,r=>r.abort());
              const login=await ctx.request.post(origin+'/api.php?action=login',
                {data:{password:'P01Browser!18968'}});
              assert.equal(login.status(),200,'owner authenticated');
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message)));
              const response=await page.goto(origin+'/start.php',{waitUntil:'domcontentloaded'});
              assert.equal(response.status(),200);
              const landed=new URL(page.url()).pathname;
              await page.locator('[data-vf-global-manage-open]').click();
              const dlg=page.locator('[data-vf-local-management]');
              await dlg.locator('[data-vf-management-tab="global"]').click();
              await dlg.locator('[data-vf-global-group="resources"]').click();
              const advanced=dlg.locator('[data-vf-advanced-root]');
              assert.equal(await advanced.isVisible(),true,'global resources panel');
              await advanced.locator('summary').click();
              await advanced.locator('[data-vf-advanced-filter]').selectOption('watch');
              await advanced.locator('[data-vf-advanced-query]').fill('IA6_BROWSER_ADVANCED_18968');
              await advanced.locator('[data-vf-advanced-list]').click();
              await page.waitForFunction(()=>/匹配 1 条/.test(document.querySelector('[data-vf-advanced-message]')?.textContent||''),null,{timeout:16000});
              const row=advanced.locator('[data-vf-advanced-select] option').filter({hasText:'IA6_BROWSER_ADVANCED_18968'});
              const value=await row.getAttribute('value');
              assert.ok(Number(value)>0,'real resource listed');
              await advanced.locator('[data-vf-advanced-select]').selectOption(value);
              await advanced.locator('[data-vf-advanced-read]').click();
              await advanced.locator('[data-vf-advanced-editor]').waitFor({state:'visible'});
              assert.equal(await advanced.locator('[data-vf-advanced-status]').inputValue(),'want');
              assert.equal(await advanced.locator('[data-vf-advanced-note]').inputValue(),'BEFORE_BROWSER_18968');
              await advanced.locator('[data-vf-advanced-note]').fill('AFTER_BROWSER_18968');
              await advanced.locator('[data-vf-advanced-year]').fill('2026');
              await advanced.locator('[data-vf-advanced-status]').selectOption('watched');
              await advanced.locator('[data-vf-advanced-prepare]').click();
              await advanced.locator('[data-vf-advanced-confirm]').waitFor({state:'visible'});
              await advanced.locator('[data-vf-advanced-commit]').click();
              await page.waitForFunction(()=>/服务器已保存/.test(document.querySelector('[data-vf-advanced-message]')?.textContent||''),null,{timeout:16000});
              const verify=await ctx.request.get(origin+'/api.php?action=resource_advanced_read&id='+value);
              assert.equal(verify.status(),200);
              const record=(await verify.json()).record;
              assert.equal(record.surface,'watch');
              assert.equal(record.is_private,1);
              assert.equal(record.media_year,'2026');
              assert.equal(record.media_status,'watched');
              assert.equal(record.note,'AFTER_BROWSER_18968');
              assert.equal(await dlg.evaluate(e=>e.open),true);
              assert.equal(new URL(page.url()).pathname,landed,'no backend redirect');
              // Second same-dialog operation: read-only batch inventory,
              // explicit selection and confirmation preview, then cancel.
              const bulk=dlg.locator('[data-vf-global-bulk-root]');
              await bulk.locator('summary').click();
              await bulk.locator('[data-vf-global-bulk-surface]').selectOption('watch');
              await bulk.locator('[data-vf-global-bulk-query]').fill('IA6_BROWSER_ADVANCED_18968');
              await bulk.locator('[data-vf-global-bulk-load]').click();
              await page.waitForFunction(()=>/当前匹配 1 条/.test(
                document.querySelector('[data-vf-global-bulk-count]')?.textContent||''),null,{timeout:16000});
              const entry=bulk.locator('input[data-vf-bulk-pick]');
              assert.equal(await entry.count(),1);
              await entry.check();
              await bulk.locator('[data-vf-global-bulk-operation]').selectOption('private');
              await bulk.locator('[data-vf-global-bulk-phrase]').fill('确认批量操作');
              assert.equal(await bulk.locator('[data-vf-global-bulk-prepare]').isEnabled(),true);
              await bulk.locator('[data-vf-global-bulk-prepare]').click();
              await bulk.locator('[data-vf-global-bulk-confirm]').waitFor({state:'visible'});
              await bulk.locator('[data-vf-global-bulk-cancel]').click();
              assert.equal(await bulk.locator('[data-vf-global-bulk-confirm]').isVisible(),false);
              const afterCancel=await ctx.request.get(origin+'/api.php?action=resource_advanced_read&id='+value);
              assert.equal(afterCancel.status(),200);
              assert.equal((await afterCancel.json()).record.is_private,1);
              console.log('P01_IA6_NATIVE_BULK_REVIEW_CANCEL_NO_WRITE=PASS');
              assert.deepEqual(errors,[],'no JS uncaught exceptions');
              console.log('P01_IA6_ADVANCED_BROWSER_CLICK_SAVE_READBACK=PASS');
              console.log('P01_IA6_ADVANCED_SAME_NATIVE_DIALOG_NO_NAV=PASS');
              await ctx.close();
            }finally{await browser.close();}
          })().catch(e=>{console.error('P01_ADVANCED_BROWSER_FLOW_FAIL',e);process.exitCode=1;});
          JS
          echo P01_IA6_BROWSER_EXACT_OPERATION_PROOF=PASS
