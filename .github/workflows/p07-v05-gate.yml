name: P07 OneShot Bench v0.5 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - .github/workflows/p07-v05-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v05
      - name: Exact candidate identity
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/p07-bench.sh)" = c67e59dde90da155bd77cff8b7e59a361cdaac8f
          grep -F 'VERSION="0.5.0"' experiments/p07-bench.sh
      - name: Syntax and self-test
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          NO_COLOR=1 XDG_STATE_HOME=/tmp/p07-v05-self ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
      - name: One-shot demo contract
        env:
          NO_COLOR: '1'
          XDG_STATE_HOME: /tmp/p07-v05-demo-state
        run: |
          set -euo pipefail
          ./experiments/p07-bench.sh --demo > /tmp/p07-v05-demo.txt
          grep -F 'P07 Enhanced Bench' /tmp/p07-v05-demo.txt
          grep -F 'Speedtest.net' /tmp/p07-v05-demo.txt | grep -F 'PASS'
          grep -F 'Carrier Speed' /tmp/p07-v05-demo.txt
          grep -F 'Evidence Quality' /tmp/p07-v05-demo.txt | grep -F 'GOOD'
          grep -F 'Mainland -> VPS' /tmp/p07-v05-demo.txt | grep -F 'NOT_RUN'
          grep -F 'Outbound Verdict' /tmp/p07-v05-demo.txt | grep -F 'NORMAL'
          ! grep -E '(^|[[:space:]])([0-9]+\)|请选择|选择功能|菜单)' /tmp/p07-v05-demo.txt
      - name: Field regression contract
        run: |
          set -euo pipefail
          grep -F 'speed_node_retry' experiments/p07-bench.sh
          grep -F 'BACKEND_FAILURE|TIMEOUT|CONNECTION_FAILED' experiments/p07-bench.sh
          grep -F 'fallback-only evidence cannot produce NORMAL' experiments/p07-bench.sh
          grep -F 'cn_speed_pass == 0 && fallback_pass >= 1' experiments/p07-bench.sh
          grep -F 'CARRIER NODES UNAVAILABLE; VERIFY FROM MAINLAND' experiments/p07-bench.sh
      - name: JSON report contract
        run: |
          set -euo pipefail
          f=$(find /tmp/p07-v05-demo-state/p07-bench/reports -name 'p07-bench_*.json' | head -n1)
          test -n "$f"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["version"]=="0.5.0"; assert d["china_ip_assessment"]["mainland_origin_probe"]=="NOT_IMPLEMENTED"; assert len(d["network_nodes"])>=10' "$f"
      - name: Safety boundary
        run: |
          set -euo pipefail
          ! grep -E '(^|[^a-zA-Z])(reboot|shutdown|systemctl restart|service .* restart|sysctl -w|rm -rf /|iptables -F|nft flush)' experiments/p07-bench.sh
          ! grep -E 'curl[^\n]*(--insecure|-k)([[:space:]]|$)|wget[^\n]*--no-check-certificate' experiments/p07-bench.sh
          grep -F 'sha256sum' experiments/p07-bench.sh
