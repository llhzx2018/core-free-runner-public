name: S01 player216 integrated exact-source proof
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/s01-player216-integrated-proof-20261028.yml']
permissions:
  contents: read
jobs:
  candidate:
    name: Public Runner PHP and source guard
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Hosted allocation and PHP runtime
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo 'PUBLIC_RUNNER_ALLOCATION=PASS'
          php -v
          node --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a308a03525ab8b0e95f1e84395b1ed0e1dc7d05b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5cff78990a0cc7fe2ebbe859651c093304491698
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Exact private identity and bounded candidate tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = a308a03525ab8b0e95f1e84395b1ed0e1dc7d05b
          test "$(git -C ops rev-parse HEAD)" = 5cff78990a0cc7fe2ebbe859651c093304491698
          test "$(cat target/VERSION)" = 1.35.216
          test "$(cat ops/VERSION)" = 1.21.1113
          for file in target/src/inc/modules/module-faq.php target/src/inc/seo-parts/seo-jsonld.php target/src/inc/public-css-owner-registry.php target/tests/player-faq-copy-contract.php target/tests/player-advanced-seo-jsonld-contract.php ops/includes/content-matrix-core-pages-parts/01-seed-contracts-and-paths.php ops/includes/cf-release/checker-html-parts/03-advanced-seo.php ops/tests/s01-player-advanced-seo-contract.php; do
            php -l "$file"
          done
          node --check target/src/assets/js/main.js
          php target/tests/player-faq-copy-contract.php
          php target/tests/player-advanced-seo-jsonld-contract.php
          php ops/tests/s01-player-advanced-seo-contract.php
          php target/tests/tool-task-hero-compact-contract.php
          php target/tests/tool-diagnostic-shell-contract.php
          echo 'S01_PLAYER216_EXACT_PRIVATE_SOURCE_AND_CONTRACTS=PASS'
      - name: Remove transient private source
        if: always()
        shell: bash
        run: |
          rm -rf target ops

  native:
    name: Isolated WordPress bilingual player and upgrade rollback
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_REPO: llhzx2018/vf-tools-theme
      TARGET_VERSION: 1.35.216
      TARGET_SHA: a308a03525ab8b0e95f1e84395b1ed0e1dc7d05b
      TARGET_TREE: ff18d04093a18a998d1b0b0d2f9a966bb7764e45
      BASE_SHA: 1216a1431b9bb69a36594329de9fac2582edb821
      SOURCE_VERSION: 1.35.215
      LANE_ID: s01-theme216-navigation-20261028
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d1e452c2a6f4edf8e1941b769f85cd932a36638
          persist-credentials: false
          path: prior-lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a308a03525ab8b0e95f1e84395b1ed0e1dc7d05b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 0
      - name: Deterministic package and source guard
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p proof provider control/lanes
          cp -a prior-lane/lanes/s01-theme216-navigation-20261028 control/lanes/
          cp control/lanes/s01-player216-integrated-20261028/changed.json control/lanes/s01-theme216-navigation-20261028/changed.json
          python3 control/lanes/s01-theme216-navigation-20261028/package.py
          node --check control/lanes/s01-theme216-navigation-20261028/check.cjs
          gh release download v1.35.215 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.215.zip --dir provider
          printf '%s  %s\n' 05c8736168f5e2dc1e22b1e43ee2a910a4992bae965780b32935264998ae8990 provider/vf-tools-theme_V1.35.215.zip | sha256sum --check
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          printf '%s  %s\n' 70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03 provider/vf-tools-m3u8_V1.25.94.zip | sha256sum --check
      - name: Prepare isolated real-browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-theme216-navigation-20261028/clean.cjs lane/warm-admin.cjs
          python3 - <<'PYDEBUG'
          from pathlib import Path
          p=Path('control/lanes/s01-theme216-navigation-20261028/check.cjs')
          src=p.read_text()
          needle="   await p.waitForFunction(()=>document.querySelector('[data-vf-player-presentation]').getAttribute('data-vf-player-library-open')==='0'&&document.activeElement===document.querySelector('[data-vf-player-video]'));"
          assert src.count(needle)==1
          inspect="   await p.waitForTimeout(700);\n   const navProbe=await p.evaluate(()=>{const host=document.querySelector('[data-vf-player-presentation]'),video=document.querySelector('[data-vf-player-video]'),active=document.activeElement;return {open:host?.getAttribute('data-vf-player-library-open'),active:active?.outerHTML?.slice(0,250),video:video?.outerHTML?.slice(0,250),same:active===video,panelHidden:document.querySelector('[data-vf-player-simple-panel]')?.hidden,scrollY:scrollY};});\n   fs.writeFileSync('proof/nav-debug-'+lang+'.json',JSON.stringify(navProbe));console.log('NAV_DEBUG',JSON.stringify(navProbe));\n"
          checked=src.replace(needle,inspect+needle)
          old="   await root.locator('[data-vf-player-play]').click();await p.waitForTimeout(100);assert.equal(media.length,0);"
          new="   const mediaBeforeEmpty=media.length;await root.locator('[data-vf-player-play]').click();await p.waitForTimeout(100);assert.equal(media.length,mediaBeforeEmpty,'missing input must not start another media request');"
          assert checked.count(old)==1
          p.write_text(checked.replace(old,new))
          PYDEBUG
      - name: Isolated native WordPress and Chromium flows
        shell: bash
        run: |
          set -Eeuo pipefail
          bash control/lanes/s01-theme216-navigation-20261028/native.sh
      - name: Upload bounded synthetic proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player216-native-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.sha256
            proof/*.png
            proof/*.jpg
          if-no-files-found: warn
          retention-days: 3
      - name: Purge ephemeral private source and downloads
        if: always()
        shell: bash
        run: |
          rm -rf target provider baseline lane established prior-lane
