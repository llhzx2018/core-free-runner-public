name: P01 V2.37.5 Published Authority
on:
  push:
    branches: [release/p01-v2375-hotfix-20260902]
    paths: [.github/workflows/p01-v2375-published-authority-20260902.yml]
permissions:
  contents: read
  actions: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: cefda28149dbf29164adc8ebfa57edacad122474
      RUNTIME_TREE: 467c56faa900a6bfcc7caadd0fd570b9c6a76567
      CORE_UPDATES_MAIN: 6621a7f0bf4b8b7dd7d66e8896c05e39b115392b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Verify published and online-update truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)" = "$FORMAL_SOURCE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.37.5 --jq .object.sha)" = "$FORMAL_SOURCE"
          REL="$(gh api repos/llhzx2018/vf-start/releases/381104896)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.5
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          for run in 33609124506 33609483255 33610132981 33610766833 33610944516 33611166304 33611315179 33611411049 33611606323; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = "$CORE_UPDATES_MAIN"
          LIVE="$(gh api repos/llhzx2018/core-updates/contents/projects/P01.json?ref=$CORE_UPDATES_MAIN --jq .content | tr -d '\n' | base64 -d)"
          jq -e '.current_version=="2.37.4" and .target_version=="2.37.5" and .from_versions==["2.37.4"] and .release_id==381104896 and .product_identity=="cefda28149dbf29164adc8ebfa57edacad122474" and .asset_name=="VF_Start_V2.37.5_UPDATE.zip" and .asset_bytes==1273639 and .asset_sha256=="169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492"' <<<"$LIVE" >/dev/null
      - name: Create published authority checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git checkout -b docs/p01-v2375-published-20260902
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          vf=root/'VF_PROJECT.json'
          d=json.loads(vf.read_text(encoding='utf-8'))
          assert d['production_version']=='2.37.4'
          assert d['candidate_version']=='2.37.5'
          d['status']='V2.37.4 OWNER PRODUCTION OBSERVED / V2.37.5 PUBLISHED / ONLINE UPDATE AVAILABLE'
          d['production_version']='2.37.4'
          d['working_version']='2.37.5'
          d['target_release_version']='2.37.5'
          d['current_phase']='V2.37.5 PUBLISHED / OWNER PRODUCTION UPDATE + REAL IYF ERROR READBACK PENDING'
          d['published_release']={
            'version':'2.37.5','tag':'v2.37.5','release_id':381104896,
            'release_source':'cefda28149dbf29164adc8ebfa57edacad122474',
            'runtime_tree':'467c56faa900a6bfcc7caadd0fd570b9c6a76567',
            'schema_version':'2026082901','live_core_updates_commit':'6621a7f0bf4b8b7dd7d66e8896c05e39b115392b',
            'live_online_next_hop':'2.37.5 / FROM 2.37.4',
            'online_asset':'VF_Start_V2.37.5_UPDATE.zip','online_asset_bytes':1273639,
            'online_asset_sha256':'169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492',
            'release_state':'PUBLISHED / OWNER PRODUCTION PENDING','assistant_production_write':False,
            'legacy_exact_replay':33608249098,'legacy_exact_replay_result':'12/12 PASS',
            'edge_diagnostic':33608705736,'focused_gate':33609124506,'stage_gate':33609483255,
            'candidate_readiness_r1':33609705922,'candidate_readiness_r1_classification':'HARNESS_ONLY_RUNTIME_DIFF_TEMPLATE',
            'candidate_readiness_r2':33609974556,'candidate_readiness_r2_classification':'HARNESS_ONLY_ARTIFACT_OUTPUT_DIRECTORY',
            'candidate_readiness':33610132981,'formal_bind_gate':33610766833,
            'formal_artifact_gate':33610944516,'strict_fresh_gate':33611166304,
            'main_promotion_gate':33611315179,'release_publish_gate':33611411049,
            'core_updates_manifest_gate':33611606323,'core_updates_promotion_commit':'6621a7f0bf4b8b7dd7d66e8896c05e39b115392b',
            'production_closure':'PENDING OWNER UPDATE + REAL IYF COVER RESULT / ERROR READBACK'
          }
          d['candidate_state']='NONE / V2.37.5 PUBLISHED'
          d['formal_release_state']='V2.37.5 PUBLISHED / ONLINE UPDATE AVAILABLE / OWNER PRODUCTION PENDING'
          d['current_authority']='Owner Production V2.37.4 OBSERVED / Published Latest V2.37.5 / Online Update Available'
          d['next_action']='Owner updates Production V2.37.4 → V2.37.5, then use the real Watch-card cover result or persistent backend error from “重新抓封面” for Production Closure and final IYF diagnosis.'
          c=d.get('v2_37_5_release_candidate')
          if isinstance(c,dict):
              c['candidate_readiness_run']=33610132981
              c['candidate_readiness']='PASS'
              c['candidate_source']='90ae8cd7b1681db894356fa590ec9e807cb1ab77'
              c['candidate_tree']='c49eb771267cc4d5d4c755741686fb9ac8928b7a'
              c['runtime_tree']='467c56faa900a6bfcc7caadd0fd570b9c6a76567'
              c['formal_source']='cefda28149dbf29164adc8ebfa57edacad122474'
              c['formal_source_tree']='8999753c57e8b1156de6506f8e5f861136f41e5a'
              c['formal_bind_gate']=33610766833
              c['formal_artifact_gate']=33610944516
              c['strict_fresh_gate']=33611166304
              c['main_promotion_gate']=33611315179
              c['release_publish_gate']=33611411049
              c['release_id']=381104896
              c['core_updates_manifest_gate']=33611606323
              c['core_updates_promotion_commit']='6621a7f0bf4b8b7dd7d66e8896c05e39b115392b'
              c['state']='PUBLISHED / OWNER PRODUCTION PENDING'
          if isinstance(d.get('current_change'),dict):
              d['current_change']['release_completed']=True
              d['current_change']['main_write']=True
              d['current_change']['production_write']=False
              d['current_change']['formal_bind_gate']=33610766833
              d['current_change']['formal_artifact_gate']=33610944516
              d['current_change']['strict_fresh_gate']=33611166304
              d['current_change']['main_promotion_gate']=33611315179
              d['current_change']['release_publish_gate']=33611411049
              d['current_change']['core_updates_manifest_gate']=33611606323
              d['current_change']['core_updates_promotion_commit']='6621a7f0bf4b8b7dd7d66e8896c05e39b115392b'
          d.setdefault('authority',{})['current_formal_release_evidence']='docs/evidence/P01_V2.37.5_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md'
          vf.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          block='''> **Current Published Truth · 2026-09-02**\n> V2.37.5 已正式发布并开放严格单跳 `V2.37.4 → V2.37.5` 在线更新；Owner Production 当前仍为 V2.37.4。V2.37.5 的目的不是继续盲改 IYF 抓图，而是让真实 Production 的封面失败原因持久显示，并提供可绕过浏览器失败缓存的“重新抓封面”。Production Closure 必须等待 Owner 升级后的真实结果。\n\n'''
          for p in ['README.md','docs/README.md','docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md']:
              f=root/p; f.write_text(block+f.read_text(encoding='utf-8'),encoding='utf-8')
          ch=root/'CHANGELOG.md'; ch.write_text('''## V2.37.5 · Published / Owner Production Pending\n\n- 影视缺封面卡片新增管理员“重新抓封面”，手动重试绕过浏览器 1 小时失败缓存；retry revision 升至 v6。\n- 自动封面抓取失败会在对应卡片持久显示真实后端错误，不再静默吞错。\n- 真实历史 IYF 记录重放 12/12 PASS；双 www IPv4 均 200+OG、双 static IPv4 均 200 WebP；本版不修改 ResourceCoverCache / SSRF / 远程图片验证策略。\n- Candidate Readiness R3 `33610132981`、Formal Bind `33610766833`、Formal Artifact `33610944516`、Strict Fresh `33611166304`、Main Promotion `33611315179`、Release Publish `33611411049`、Manifest Gate `33611606323` 全部 PASS。\n- GitHub Release `381104896`；在线更新严格只允许 V2.37.4 → V2.37.5；Schema `2026082901` 不变，无 Migration。\n- Owner Production 仍为 V2.37.4；升级后的真实封面结果/错误文本回读前不得 Production Closure。\n\n'''+ch.read_text(encoding='utf-8'),encoding='utf-8')
          ev=root/'docs/evidence/P01_V2.37.5_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md'
          ev.write_text('''# P01 · VF Start V2.37.5 Published / Owner Production Pending\n\n- Candidate: `90ae8cd7b1681db894356fa590ec9e807cb1ab77`\n- Formal Source / Tag Source: `cefda28149dbf29164adc8ebfa57edacad122474`\n- Formal Source Tree: `8999753c57e8b1156de6506f8e5f861136f41e5a`\n- Runtime Tree: `467c56faa900a6bfcc7caadd0fd570b9c6a76567`\n- Legacy exact IYF replay: `33608249098` / 12 of 12 PASS\n- Edge diagnostic: `33608705736` PASS\n- Focused Gate: `33609124506` PASS\n- Stage: `33609483255` PASS\n- Candidate Readiness R1 `33609705922`: Harness-only runtime-diff template\n- Candidate Readiness R2 `33609974556`: Harness-only artifact output directory\n- Candidate Readiness R3: `33610132981` PASS\n- Formal Bind: `33610766833` PASS\n- Formal Artifact: `33610944516` PASS / frozen Artifact ID `9838945578` / digest `1e59c22ec9d2175d901b01c11e3084dc6dd9dcaf552de602768a2dc2d34158b8`\n- Strict Fresh frozen bytes: `33611166304` PASS\n- Main Promotion: `33611315179` PASS / non-force fast-forward\n- Release Publish: `33611411049` PASS\n- GitHub Release ID: `381104896` / tag `v2.37.5`\n- FULL: `VF-Start-V2.37.5-FULL.zip` / `602770` bytes / SHA-256 `547667032bd62a1887a1272889b9485229c3e19a4441b770f8eb1277cbab9637`\n- UPDATE: `VF_Start_V2.37.5_UPDATE.zip` / `1273639` bytes / SHA-256 `169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492`\n- Manifest Gate: `33611606323` PASS\n- core-updates PR: `#44` / merge `6621a7f0bf4b8b7dd7d66e8896c05e39b115392b`\n- Live hop: `V2.37.4 → V2.37.5 ONLY`\n- Schema: `2026082901 → 2026082901`; Migration: none\n- Remote fetch policy: unchanged from V2.37.4\n- Owner Production: V2.37.4 observed\n- Production Closure: PENDING Owner upgrade + real cover result / persistent backend error readback\n- Assistant Production Write: NO\n''',encoding='utf-8')
          PY
          git diff --check
          test "$(git status --porcelain | wc -l | tr -d ' ')" = 7
          test -z "$(git status --porcelain | grep -E '(^.. src/|(^|/)VERSION$|migrations|schema)' || true)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git add README.md docs/README.md CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_V2.37.5_PUBLISHED_PENDING_OWNER_PRODUCTION_20260902.md
          git -c user.name=VictorForge -c user.email=llhzx2018@gmail.com commit -m 'docs(P01): record V2.37.5 published checkpoint'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:docs/p01-v2375-published-20260902
          printf 'P01_V2375_PUBLISHED_AUTHORITY=PASS\nFILES=7\nBASE=%s\nDOCS_SOURCE=%s\nRUNTIME_TREE=%s\nPUBLISHED=2.37.5\nOWNER_PRODUCTION=2.37.4\nONLINE_HOP=2.37.4_TO_2.37.5\nRUNTIME_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL_SOURCE" "$(git rev-parse HEAD)" "$RUNTIME_TREE" | tee /tmp/p01-v2375-published-authority.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2375-published-authority-${{ github.run_id }}
          path: /tmp/p01-v2375-published-authority.txt
          if-no-files-found: warn
          retention-days: 90
