name: p01-v247455-channel-manifest-once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247455-channel-manifest-once.yml'

permissions:
  contents: read

jobs:
  exact-channel:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-v247455-channel-manifest-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/core-updates
      TARGET_VERSION: 2.47.455
      TARGET_SHA: 6881bc6d63df8914b4a3709e3dca84be3358971b
      SOURCE_VERSION: 2.47.454
    steps:
      - name: Checkout public runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit exact-source lane binding
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec validation/p01-v247455-channel-manifest-spec.json --input .github/workflows/p01-v247455-channel-manifest-once.yml
      - name: Checkout exact core-updates PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 6881bc6d63df8914b4a3709e3dca84be3358971b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
      - name: Run canonical manifest and updater regression
        shell: bash
        working-directory: channel
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring >/dev/null
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-channel-php-lint.txt
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('projects/P01.json').read_text(encoding='utf-8'))
          expected={
              'project_id':'P01','component_id':'APP','current_version':'2.47.454',
              'target_version':'2.47.455','release_tag':'v2.47.455','release_id':423241485,
              'product_identity':'4d17dd32c58ff1c3d6050e30360243b7fe73ed4e',
              'asset_name':'VF_Start_V2.47.455_UPDATE.zip','asset_bytes':2997911,
              'asset_sha256':'a435ff9305a0c5ce48afacf05b66b5444211867d9ef3f7430bfa78d372ca2bdd',
              'schema_from':'2026102201','schema_to':'2026102201',
              'backup_required':True,'rollback_supported':True,'update_type':'ATOMIC',
          }
          for key,value in expected.items():
              assert m.get(key)==value,(key,m.get(key),value)
          assert m.get('from_versions')==['2.47.454']
          assert m.get('repository')=='llhzx2018/vf-start'
          print('P01_CHANNEL_EXACT_MANIFEST=PASS')
          PY
          echo P01_CHANNEL_UPDATER_REGRESSION=PASS
      - name: Verify owning GitHub Tag and artifact bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.455 --jq '.object.sha')" = "4d17dd32c58ff1c3d6050e30360243b7fe73ed4e"
          dest="$RUNNER_TEMP/p01-channel-v247455"
          mkdir -p "$dest"
          gh release download v2.47.455 -R llhzx2018/vf-start -D "$dest" -p "VF-Start-V2.47.455-FULL.zip" -p "VF_Start_V2.47.455_UPDATE.zip"
          test "$(stat -c %s "$dest/VF-Start-V2.47.455-FULL.zip")" = 1374434
          test "$(stat -c %s "$dest/VF_Start_V2.47.455_UPDATE.zip")" = 2997911
          test "$(sha256sum "$dest/VF-Start-V2.47.455-FULL.zip" | cut -d ' ' -f1)" = "c1b2c813e5b488b0b19a18d80b6c5ba94c534d1314cb8ca696630f3d2acb8ccd"
          test "$(sha256sum "$dest/VF_Start_V2.47.455_UPDATE.zip" | cut -d ' ' -f1)" = "a435ff9305a0c5ce48afacf05b66b5444211867d9ef3f7430bfa78d372ca2bdd"
          echo P01_CHANNEL_REMOTE_RELEASE_IDENTITY=PASS
