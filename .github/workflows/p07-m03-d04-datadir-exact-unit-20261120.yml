name: P07-M03-D04 exact-source native datadir read-only unit gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-datadir-exact-unit-20261120.yml'
permissions:
  contents: read
jobs:
  p07-m03-d04-datadir:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      P07_EXACT_SOURCE_SHA: '19bac6f4443266e7f9028f75ada7d79c761bd421'
    steps:
      - name: Checkout ephemeral public workflow (no credential persistence)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 19bac6f4443266e7f9028f75ada7d79c761bd421
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .product
      - name: Verify exact source identity and compile Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = "$P07_EXACT_SOURCE_SHA"
          python3 -B - <<'PY'
          from pathlib import Path
          import ast
          root=Path(".product")
          for name in (
              "lib/migration_native_datadir_guard.py",
              "lib/migration_safe_batch_guard.py",
              "lib/migration_safe_batch_io.py",
              "lib/migration_safe_batch_cli.py",
              "scripts/p07_m03_trial_from_official.py",
              "tests/test_p07_m03_safe_batch_native_datadir.py",
          ):
              ast.parse((root/name).read_text(encoding="utf-8"), filename=name)
          print("P07_M03_D04_EXACT_SOURCE_AND_AST=PASS")
          PY
      - name: Exact-source isolated Python regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for suite in \
            test_p07_m03_safe_batch_native_datadir.py \
            test_p07_m03_safe_batch.py \
            test_p07_m03_trial_builder_142.py; do
            file="$RUNNER_TEMP/p07-m03-d04-${suite}.log"
            if (cd .product && python3 -B -m unittest discover -s tests -p "$suite" -q) > "$file" 2>&1; then
              echo "P07_M03_D04_SUITE_PASS=$suite"
              grep -E '^Ran [0-9]+ tests' "$file" | tail -n 1 | cut -c1-90 || true
            else
              echo "P07_M03_D04_SUITE_FAIL=$suite"
              grep -E '^FAIL:|^ERROR:|^Ran [0-9]+ tests|^FAILED' "$file" | tail -n 12 | cut -c1-170 || true
              exit 1
            fi
          done
          echo P07_M03_D04_EXACT_SOURCE_UNIT_PROOF=PASS
      - name: Verify true official142 bytes and build private unpublished 144-rc offline candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          official="$RUNNER_TEMP/p07-official142.zip"
          candidate="$RUNNER_TEMP/p07-candidate144rc1.zip"
          curl -fsSL --retry 2 --max-time 75 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release142-20261120/P07-M03-0.1.0-release142.zip' \
            -o "$official"
          printf '%s  %s\n' 'dc6978463e8e73a224e7cccb2bdffe9710bc3bb478076b670703bbb164bda87e' "$official" | sha256sum -c --status
          echo P07_M03_D04_OFFICIAL142_ASSET_REAL_SHA256=PASS
          python3 -B .product/scripts/p07_m03_trial_from_official.py \
            --official-zip "$official" --official-build '0.1.0-release142' \
            --product-root .product --product-sha "$P07_EXACT_SOURCE_SHA" \
            --build '0.1.0-release144-rc1' --output "$candidate"
          python3 - "$candidate" <<'PY'
          import hashlib,sys,zipfile
          from pathlib import Path
          p=Path(sys.argv[1])
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "candidate ZIP integrity"
              names=set(z.namelist())
              root="dist/p07/0.1.0/overlay/"
              assert (root+"lib/migration_native_datadir_guard.py") in names
              assert (root+"lib/migration_safe_batch_io.py") in names
              assert z.read(root+"BUILD_ID").strip()==b"0.1.0-release144-rc1"
              manifest=z.read(root+"RUNTIME.gitblob").decode()
              assert "  lib/migration_native_datadir_guard.py\n" in manifest
              assert not any("p07-toolbox" in n or "p07-system-care" in n for n in names)
              assert len(names)>50
          print("P07_M03_D04_REAL142_TO_UNPUBLISHED144_PACKAGE=PASS")
          print("P07_M03_D04_UNPUBLISHED_ONLY_SHA256="+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          printf '%s\n' 'tampered-official-zip' > "$RUNNER_TEMP/corrupt142.zip"
          if python3 -B .product/scripts/p07_m03_trial_from_official.py \
            --official-zip "$RUNNER_TEMP/corrupt142.zip" --official-build '0.1.0-release142' \
            --product-root .product --product-sha "$P07_EXACT_SOURCE_SHA" \
            --build '0.1.0-release144-rc1' \
            --output "$RUNNER_TEMP/do-not-create-corrupted.zip" > "$RUNNER_TEMP/bad-zip.log" 2>&1; then
            echo P07_M03_D04_CORRUPT_OFFICIAL_ZIP=FAIL
            exit 1
          fi
          test ! -e "$RUNNER_TEMP/do-not-create-corrupted.zip"
          grep -Fxq 'P07_M03_TRIAL_BUILD=BLOCKED:OFFICIAL_ZIP_HASH_MISMATCH' "$RUNNER_TEMP/bad-zip.log"
          echo P07_M03_D04_CORRUPT_OFFICIAL_ZIP=BLOCKED_AS_EXPECTED
          rm -f -- "$official" "$candidate" "$RUNNER_TEMP/corrupt142.zip" "$RUNNER_TEMP/bad-zip.log"
      - name: Remove private source and local logs
        if: always()
        shell: bash
        run: |
          rm -rf -- .product
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'p07-m03-d04-*.log' -delete
          echo P07_M03_D04_PUBLIC_PRIVATE_BOUNDARY_CLEANED=YES
