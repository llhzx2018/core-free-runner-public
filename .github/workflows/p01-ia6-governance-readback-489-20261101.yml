name: P01 IA6 489 full six-resource and Watch CSV independent readback exact source proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-ia6-governance-readback-489-20261101.yml
permissions:
  contents: read
jobs:
  governance-native:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/ia-v6-frontstage-admin-parity-system-jobs-r1
      PRODUCT_SHA: a2c6e4b7e5feed09ae7a6621ffbfe8bb18d8f722
      PRODUCT_VERSION: 2.47.489
      VF_E2E_RUNTIME_ROOT: /tmp/p01-ia6-governance-readback-20261101
      VF_IA6_DISPOSABLE_ACK: IA6-GOVERNANCE-ONLY
      P01_TEST_ORIGIN: http://127.0.0.1:19322
      P01_TEST_PASSWORD: IA6SyntheticGovernanceOwner2026!
    steps:
      - name: Checkout public-safe test-only Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install disposable PHP SQLite and local Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Bind exact private candidate without publishing artifacts
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          echo P01_IA6_GOVERNANCE_EXACT_SOURCE=PASS
      - name: Native CSV receipt and independent readback syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node candidate/tests/unit/p01_ia6_governance_independent_readback_contract.cjs
          node candidate/tests/unit/p01_ia6_advanced_resource_governance_closure_contract.cjs
          node --check candidate/tests/integration/p01_ia6_governance_readback_browser.mjs
          python3 -m py_compile candidate/tests/integration/p01_ia6_governance_canonical_readback_disposable.py
          php -l candidate/src/app/FullSurfaceGovernance.php
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          php -l candidate/src/app/WatchStatusGovernance.php
          php -l candidate/src/api.php
          php -l candidate/src/full-governance-action.php
          php -l candidate/src/full-governance-media-status-action.php
          node --check candidate/src/assets/full-governance.js
          echo P01_IA6_GOVERNANCE_NATIVE_CONTRACT_AND_SYNTAX=PASS
      - name: Real synthetic six-resource and Watch CSV HTTP and Owner Chromium readback
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$VF_E2E_RUNTIME_ROOT"
          test "$root" = /tmp/p01-ia6-governance-readback-20261101
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          php -S 127.0.0.1:19322 -t "$root" >/tmp/p01-ia6-governance-server.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" >/dev/null 2>&1 || true; rm -rf "$root"; rm -f /tmp/p01-ia6-governance-cookie /tmp/p01-ia6-governance-setup.html /tmp/p01-ia6-governance-installed.html; }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-governance-cookie -b /tmp/p01-ia6-governance-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-governance-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-ia6-governance-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-governance-cookie -b /tmp/p01-ia6-governance-cookie -X POST "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Synthetic CSV Governance Readback" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" >/tmp/p01-ia6-governance-installed.html
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          python3 candidate/tests/integration/p01_ia6_governance_canonical_readback_disposable.py
          node candidate/tests/integration/p01_ia6_governance_readback_browser.mjs
          echo P01_IA6_GOVERNANCE_REAL_SQLITE_BROWSER=PASS
      - name: Remove synthetic source and site bytes
        if: always()
        shell: bash
        run: |
          rm -rf candidate /tmp/p01-ia6-governance-readback-20261101
          rm -f /tmp/p01-ia6-governance-server.log /tmp/p01-ia6-governance-cookie /tmp/p01-ia6-governance-setup.html /tmp/p01-ia6-governance-installed.html
          echo P01_IA6_GOVERNANCE_DISPOSABLE_CLEANUP=PASS
