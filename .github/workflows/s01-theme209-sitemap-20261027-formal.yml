name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-theme209-sitemap-20261027]
    paths: ['.github/workflows/s01-theme209-sitemap-20261027-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.209
  TARGET_SHA: 0e3a1032d0ca245ad4c74396ad8f6de34c69e3ab
  TARGET_TREE: c181eef1aa22f59d20b0d05e22e0bcd3a41f6ce7
  BASE_SHA: afa7c7b3fc9ef9ee4a7a1036c20c26c38a070e18
  LANE_ID: s01-theme209-sitemap-20261027
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme209-sitemap-20261027/formal-spec.json --input control/.github/workflows/s01-theme209-sitemap-20261027-formal.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0e3a1032d0ca245ad4c74396ad8f6de34c69e3ab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40495818357 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40495818357 --jq .head_sha)" = 14555f0eb4baa83ce299037cef380af42d8081cb
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40495818357 --repo llhzx2018/core-free-runner-public --name s01-home-40495818357 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-theme209-sitemap-20261027/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='d575289e92794eeef8d54322b12658f82c2a7877'
          cases=[json.loads(line) for line in (r/'route-label.jsonl').read_text().splitlines()]
          assert len(cases)==7 and all(x['status']=='PASS' for x in cases)
          assert cases[0]['phase']=='before' and cases[0]['selected']==1002
          assert sum(x['phase']=='after' and x['scenario'] in ['missing','draft'] and x['selected']==0 for x in cases)==4
          before=json.loads((r/'before-results.json').read_text());after=json.loads((r/'after-results.json').read_text())
          assert before['status']=='PASS' and before['cases']==4
          assert after['status']=='PASS' and after['cases']==9
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          assert json.loads((r/'native-lifecycle.json').read_text())['status']=='PASS'
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  assert (r/f'sitemap-{lang}-{width}.png').stat().st_size>500
                  geo=json.loads((r/f'after-geometry-{lang}-{width}.json').read_text())
                  assert abs(geo['hero']['x']+geo['hero']['width']/2-width/2)<2
                  assert geo['gridColumns']==(3 if width==1440 else 2)
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='9d6408fafb95bd2596b219f00dcb2da01a692c41fbe0fc6db6b2e630161d151d' and new['bytes']==2011445
          coverage=json.loads(pathlib.Path('control/lanes/s01-theme209-sitemap-20261027/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='d575289e92794eeef8d54322b12658f82c2a7877' and coverage['tree']=='c181eef1aa22f59d20b0d05e22e0bcd3a41f6ce7'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40495818357'
          coverage['merged_source']='0e3a1032d0ca245ad4c74396ad8f6de34c69e3ab'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.209 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.209 provider/vf-tools-theme_V1.35.209.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.209' --notes '参考Apple官方Site Map精修中英文HTML站点地图：单一介绍、轻量分组跳转、2/3列文字目录、清晰的长标题与更新时间；减少重复统计、编号、逐条箭头和边框。恢复后台分组列数配置的实际效果，保留分组/计数/日期/完整公开路径开关、自定义说明及原链接。Sitemap页面对象只读消费原精确路由/语言解析器，修复同slug被错误语言页面覆盖H1的问题，不写标题、内容、SEO或语言关系。精确源码通过旧行为复现、缺失/草稿目标保护、双语1440/1024、设置/空状态/无脚本及URL图保持；干净209原生安装/登录/安装锁、208升级回退重复安装及受保护数据一致性通过。后台历史登记208404桌面截图结案，本页正式站体验待Owner手工升级截图验收；手机暂缓。476运行文件，正式ZIP远端字节核验。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.209 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.209 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.209 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.209.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.209.zip remote/vf-tools-theme_V1.35.209.zip
          echo '9d6408fafb95bd2596b219f00dcb2da01a692c41fbe0fc6db6b2e630161d151d  remote/vf-tools-theme_V1.35.209.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.209.zip)" = 2011445
          gh release view v1.35.209 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
