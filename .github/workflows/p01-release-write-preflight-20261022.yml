name: P01 Release Write Permission Preflight
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-release-write-preflight-20261022.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'diagnostic/p01-release-write-preflight-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Non-destructive P01 release-credential check
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          test -n "$READ_TOKEN"
          TARGET="llhzx2018/vf-start"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET/git/ref/heads/main" --jq '.object.sha')" = "7b8b854399d10a63b6212d8878803b6f606d38fe"
          echo P01_RELEASE_READ_CURRENT=PASS
          # All-zero sha refers to no real Git object: a 422 indicates permission
          # was accepted before payload validation; this never creates a tag.
          payload='{"ref":"refs/tags/__vf_write_probe_never_create__","sha":"0000000000000000000000000000000000000000"}'
          for alias in RELEASE READ; do
            if [ "$alias" = RELEASE ]; then t="$RELEASE_TOKEN"; else t="$READ_TOKEN"; fi
            status="$(curl --silent --show-error --output "/tmp/$alias-body.json" --dump-header "/tmp/$alias-headers.txt" --write-out '%{http_code}' \
              --request POST "https://api.github.com/repos/$TARGET/git/refs" \
              --header "Authorization: Bearer $t" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload")"
            echo "P01_${alias}_TOKEN_SYNTHETIC_TAG_HTTP=$status"
            jq -r '.message // "no message"' "/tmp/$alias-body.json" | sed 's/^/P01_GITHUB_RESULT=/' | head -c 250
            echo
            grep -i '^x-accepted-github-permissions:' "/tmp/$alias-headers.txt" | sed 's/^/P01_REQUIRED_PERMISSION_HEADER=/' || true
          done
          if [ "$(cat /tmp/RELEASE-body.json | jq -r '.status // ""')" = "403" ]; then
            echo 'P01_RELEASE_TOKEN_FORBIDDEN=YES'
          fi
          rm -f /tmp/{RELEASE,READ}-{body.json,headers.txt}
          echo P01_WRITE_PREFLIGHT_NO_TAG_CREATED=PASS
