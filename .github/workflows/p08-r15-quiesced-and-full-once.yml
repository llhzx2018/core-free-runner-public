name: P08 R15 quiesced 3-engine backup plus extracted FULL browser (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r15-quiesced-and-full-once.yml'

permissions:
  contents: read

jobs:
  sql-engines:
    name: P08 ${{ matrix.engine }} isolated installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mariadb
            image: mariadb:11.8
          - engine: mysql
            image: mysql:8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="if command -v mariadb-admin >/dev/null; then mariadb-admin ping --silent; else mysqladmin ping --silent; fi"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.engine }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_RESTORE: p08_ci_restore
      P08_TEST_DB_FULL_RESTORE: p08_ci_fullrestore
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
    steps:
      - name: Checkout private exact P08 source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-adops
          ref: 483e3eff7de66fdd23bc7e58b7192603d04461cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Verify bound source identity
        run: |
          test "$(git -C private-product rev-parse HEAD)" = "483e3eff7de66fdd23bc7e58b7192603d04461cc"
          echo "P08_EXACT_SOURCE_SHA=483e3eff7de66fdd23bc7e58b7192603d04461cc"
      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Install only locked dependencies, prepare disposable workspace
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          test -s composer.lock
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/composer-p08.log" 2>&1
          test -f vendor/autoload.php
      - name: Native SQL client for synthetic backup and restore
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/p08-apt.log" 2>&1
          sudo apt-get install -y -qq mariadb-client >> "$RUNNER_TEMP/p08-apt.log" 2>&1
      - name: Source static gate and isolated unit checks
        working-directory: private-product
        run: |
          set -euo pipefail
          python3 scripts/check_stack_contract.py --phase foundation
          python3 -m unittest discover -s tests -p test_stack_contract.py -q
          php -l src/Installation/OwnerWebInstaller.php
          php -l src/Installation/SetupGuard.php
          php -l public/setup.php
          php -l src/Recovery/DatabaseSnapshot.php
          php -l tests/test_recovery_sql_e2e.php
          php -l src/Recovery/PrivatePayloadSnapshot.php
          php -l src/Recovery/MaintenanceGate.php
          php -l src/Recovery/ConsistentSiteSnapshot.php
          php -l app/Http/Middleware/MaintenanceWriteGuard.php
          php tests/test_maintenance_gate.php
          php -l tests/test_recovery_private_payload_e2e.php
      - name: Isolated ${{ matrix.engine }} install and business proof
        working-directory: private-product
        run: |
          set -euo pipefail
          php tests/fixtures/create_ci_databases.php
          php tests/test_install_mysql_e2e.php
          php tests/test_recovery_sql_e2e.php
          php tests/test_recovery_private_payload_e2e.php
          echo P08_R15_THREE_ENGINE_QUIESCED_SNAPSHOT=PASS
          echo P08_R13_SQL_AND_PRIVATE_FILES_INTEGRATED=PASS
      - name: Remove private source and transient logs
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r13-new-private-files"
          rm -f "$RUNNER_TEMP/p08-r13-synthetic.zip"
          rm -f "$RUNNER_TEMP/composer-p08.log" "$RUNNER_TEMP/p08-apt.log"

  sqlite:
    name: P08 SQLite isolated installer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      P08_ISOLATED_INSTALL_TEST: YES
    steps:
      - name: Checkout private exact P08 source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-adops
          ref: 483e3eff7de66fdd23bc7e58b7192603d04461cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Verify bound source identity
        run: |
          test "$(git -C private-product rev-parse HEAD)" = "483e3eff7de66fdd23bc7e58b7192603d04461cc"
          echo "P08_EXACT_SOURCE_SHA=483e3eff7de66fdd23bc7e58b7192603d04461cc"
      - name: PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Install only locked dependencies, prepare disposable workspace
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          test -s composer.lock
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/composer-p08.log" 2>&1
      - name: SQLite first install and negative test
        working-directory: private-product
        run: |
          set -euo pipefail
          php tests/test_install_sqlite_e2e.php
          php tests/test_recovery_sqlite_e2e.php
          php tests/test_recovery_private_payload_e2e.php
          echo P08_R13_SQLITE_AND_PRIVATE_FILES_INTEGRATED=PASS
      - name: Remove private source and transient logs
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-r13-new-private-files"
          rm -f "$RUNNER_TEMP/p08-r13-synthetic.zip"
          rm -f "$RUNNER_TEMP/composer-p08.log"

  trial-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_CANDIDATE_SOURCE_SHA: 483e3eff7de66fdd23bc7e58b7192603d04461cc
      P08_TEST_BASE_URL: http://127.0.0.1:18080
      SESSION_SECURE_COOKIE: 'false'
      APP_ENV: testing
      APP_URL: http://127.0.0.1:18080
    steps:
      - name: Checkout P08 candidate exact private source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-adops
          ref: 483e3eff7de66fdd23bc7e58b7192603d04461cc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-product
      - name: Source-bound candidate identity
        run: |
          test "$(git -C private-product rev-parse HEAD)" = "483e3eff7de66fdd23bc7e58b7192603d04461cc"
          test "$(cat private-product/VERSION)" = "0.1.0"
          echo P08_FIRST_FULL_TRIAL_SOURCE=483e3eff7de66fdd23bc7e58b7192603d04461cc
      - name: PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build pinned runtime and run FULL gates
        working-directory: private-product
        run: |
          set -euo pipefail
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer-full.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-npm-full.log" 2>&1
          npm run build
          npm run typecheck
          python3 scripts/check_stack_contract.py --phase full
          python3 -m unittest discover -s tests -p test_full_builder.py -q
          php tests/test_full_integrity.php
          echo P08_CANDIDATE_FULL_BUILD_INPUTS=PASS
      - name: Create source-bound complete FULL and inspect extracted file manifest
        working-directory: private-product
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-TRIAL.zip"
          python3 scripts/build_full.py --source "$PWD" --output "$package" --version 0.1.0 --source-sha "483e3eff7de66fdd23bc7e58b7192603d04461cc"
          test -s "$package"
          echo "P08_TRIAL_PACKAGE_SHA256=$(sha256sum "$package" | awk '{print $1}')"
          mkdir "$RUNNER_TEMP/p08-extracted"
          unzip -qq "$package" -d "$RUNNER_TEMP/p08-extracted"
          test -f "$RUNNER_TEMP/p08-extracted/vendor/autoload.php"
          test -f "$RUNNER_TEMP/p08-extracted/public/build/manifest.json"
          test ! -e "$RUNNER_TEMP/p08-extracted/.env"
          test ! -e "$RUNNER_TEMP/p08-extracted/storage"
          echo P08_REAL_FULL_ARCHIVE_EXTRACTED_NO_USER_DATA=PASS
      - name: Run isolated first Owner install from extracted FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          php tests/test_extracted_full_sqlite_e2e.php "$RUNNER_TEMP/p08-extracted"
      - name: Chromium guest Owner Landing and ZIP browser acceptance on extracted FULL
        working-directory: private-product
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p08-browser-deps.log" 2>&1
          python3 tests/fixtures/make_browser_zip_fixtures.py "$RUNNER_TEMP/p08-first-full-fixtures"
          export P08_BROWSER_FIXTURE_DIR="$RUNNER_TEMP/p08-first-full-fixtures"
          (cd "$RUNNER_TEMP/p08-extracted" && php artisan serve --host=127.0.0.1 --port=18080) > "$RUNNER_TEMP/p08-full-serve.log" 2>&1 &
          p=$!
          trap 'kill "$p" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/login -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo P08_FULL_TRIAL_BOOT=FAIL; tail -n 25 "$RUNNER_TEMP/p08-full-serve.log"; exit 1; fi
          npm run test:e2e -- tests/e2e/guest.spec.ts tests/e2e/owner-workspace.spec.ts tests/e2e/static-upload-security-responsive.spec.ts
          echo P08_EXTRACTED_FULL_REAL_CHROMIUM=PASS
      - name: Erase private source, ZIP, installed synthetic data, and logs
        if: always()
        run: |
          rm -rf private-product "$RUNNER_TEMP/p08-extracted" "$RUNNER_TEMP/p08-first-full-fixtures"
          rm -f "$RUNNER_TEMP/P08-vf-adops-0.1.0-FULL-TRIAL.zip" "$RUNNER_TEMP/p08-composer-full.log" "$RUNNER_TEMP/p08-npm-full.log" "$RUNNER_TEMP/p08-browser-deps.log" "$RUNNER_TEMP/p08-full-serve.log"

