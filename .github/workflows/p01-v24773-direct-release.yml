name: P01 V2.47.73 Direct Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24773-direct-release.yml'

permissions:
  contents: read

concurrency:
  group: p01-v24773-direct-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      UPDATES_REPO: llhzx2018/core-updates
      TARGET_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      TARGET_TREE: 9e6fe0e775e95dfb237471a569f604062f267218
      TARGET_VERSION: 2.47.73
      SOURCE_SHA: cd176611a24be2dd90155ce84b6b89fab2915150
      SOURCE_TREE: 755ec90d9af490b5cd177aaf17d55e217fe49d33
      SOURCE_VERSION: 2.47.72
      SOURCE_TAG: v2.47.72
      SCHEMA: '2026090401'
      TAG: v2.47.73
      FULL_NAME: VF-Start-V2.47.73-FULL.zip
      UPDATE_NAME: VF_Start_V2.47.73_UPDATE.zip
    steps:
      - name: Checkout release carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P01 target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5a90fa61b0e446444b49f8de58438d2de5e9acda
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P01 predecessor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: cd176611a24be2dd90155ce84b6b89fab2915150
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: prior
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact identities
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(git -C prior rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C prior rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < prior/VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < prior/src/VERSION.txt)" = "$SOURCE_VERSION"
          test "$(jq -r '.version' candidate/src/browser-extension/manifest.json)" = '1.7.0'
          echo P01_V24773_EXACT_SOURCE=PASS

      - name: Install release test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip zip jq >/dev/null
          php -v
          php -m | grep -Fx pdo_sqlite

      - name: Build deterministic FULL and UPDATE
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cp scripts/p01-build-release.py /tmp/p01-build-release-current.py
          sed -i "s/VERSION='2.21.15'/VERSION='2.47.73'/" /tmp/p01-build-release-current.py
          sed -i "s/SOURCE_VERSION='2.21.14'/SOURCE_VERSION='2.47.72'/" /tmp/p01-build-release-current.py
          sed -i "s/SCHEMA='2026080902'/SCHEMA='2026090401'/" /tmp/p01-build-release-current.py
          sed -i "s/if extver!='1.6.4'/if extver!='1.7.0'/" /tmp/p01-build-release-current.py
          sed -i "s/'version':'1.6.4'/'version':'1.7.0'/g" /tmp/p01-build-release-current.py
          rm -rf /tmp/p01-v24773-release
          python3 /tmp/p01-build-release-current.py             --candidate candidate/src             --production prior/src             --out /tmp/p01-v24773-release             --candidate-commit "$TARGET_SHA"             --candidate-tree "$TARGET_TREE"             --production-commit "$SOURCE_SHA"
          mv /tmp/p01-v24773-release/VF_Start_V2.47.73_FULL.zip "/tmp/p01-v24773-release/$FULL_NAME"
          test -f "/tmp/p01-v24773-release/$UPDATE_NAME"
          test -f "/tmp/p01-v24773-release/$FULL_NAME"
          unzip -Z1 "/tmp/p01-v24773-release/$UPDATE_NAME" | grep -Fx 'repair-v2.47.73.php'
          unzip -Z1 "/tmp/p01-v24773-release/$FULL_NAME" | grep -Fx 'VERSION.txt'
          ! unzip -Z1 "/tmp/p01-v24773-release/$FULL_NAME" | grep -E '(^|/)(private_data|PRIVATE_DATA|backups?|logs?|sessions?)(/|$)|\.(sqlite|sqlite3|db|log|env)$'
          php /tmp/p01-v24773-release/repair-v2.47.73.php --self-test | tee /tmp/p01-v24773-atomic-selftest.json
          grep -Fq '"ok":true' /tmp/p01-v24773-atomic-selftest.json
          FULL_SHA="$(sha256sum "/tmp/p01-v24773-release/$FULL_NAME" | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum "/tmp/p01-v24773-release/$UPDATE_NAME" | awk '{print $1}')"
          FULL_BYTES="$(stat -c %s "/tmp/p01-v24773-release/$FULL_NAME")"
          UPDATE_BYTES="$(stat -c %s "/tmp/p01-v24773-release/$UPDATE_NAME")"
          printf 'FULL_SHA=%s\nUPDATE_SHA=%s\nFULL_BYTES=%s\nUPDATE_BYTES=%s\n' "$FULL_SHA" "$UPDATE_SHA" "$FULL_BYTES" "$UPDATE_BYTES" >> "$GITHUB_ENV"
          echo P01_V24773_FORMAL_BYTES=PASS

      - name: Clean FULL install gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24773-full-runtime
          mkdir -p /tmp/p01-v24773-full-runtime
          unzip -q "/tmp/p01-v24773-release/$FULL_NAME" -d /tmp/p01-v24773-full-runtime
          root=/tmp/p01-v24773-full-runtime
          cookie=/tmp/p01-v24773-full-cookie.txt
          pass='ReleaseGate-V24773!'
          (cd "$root" && php -S 127.0.0.1:18491 -t . >/tmp/p01-v24773-full-http.log 2>&1 & echo $! >/tmp/p01-v24773-full-http.pid)
          for i in $(seq 1 40); do
            curl -fsS -c "$cookie" -b "$cookie" http://127.0.0.1:18491/setup.php -o /tmp/p01-v24773-full-setup.html && break
            sleep 1
          done
          csrf="$(sed -n 's/.*name="setup_csrf"[[:space:]]*value="\([^"]*\)".*/\1/p' /tmp/p01-v24773-full-setup.html | head -n1)"
          test -n "$csrf"
          curl -fsS -c "$cookie" -b "$cookie" -X POST http://127.0.0.1:18491/setup.php             --data-urlencode "setup_csrf=$csrf"             --data-urlencode 'site_title=VF Start Release Gate'             --data-urlencode "admin_password=$pass"             --data-urlencode "admin_password_confirm=$pass"             -o /tmp/p01-v24773-full-setup-post.html
          (cd "$root" && php cli/verify.php) | tee /tmp/p01-v24773-full-verify.txt
          grep -Fxq 'VERIFY_PASS=YES' /tmp/p01-v24773-full-verify.txt
          body="$(php -r 'echo json_encode(["password"=>$argv[1]], JSON_UNESCAPED_SLASHES);' "$pass")"
          curl -fsS -c "$cookie" -b "$cookie" -H 'Content-Type: application/json' --data "$body"             'http://127.0.0.1:18491/api.php?action=login' >/tmp/p01-v24773-full-login.json
          grep -Fq '"ok":true' /tmp/p01-v24773-full-login.json
          curl -fsS -c "$cookie" -b "$cookie" http://127.0.0.1:18491/jobs.php -o /tmp/p01-v24773-full-jobs.html
          grep -Fq '计划任务' /tmp/p01-v24773-full-jobs.html
          kill "$(cat /tmp/p01-v24773-full-http.pid)" >/dev/null 2>&1 || true
          echo P01_V24773_CLEAN_FULL=PASS

      - name: Exact V2.47.72 to V2.47.73 Atomic gate
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24772-runtime /tmp/p01-v24772-release
          mkdir -p /tmp/p01-v24772-runtime /tmp/p01-v24772-release
          gh release download "$SOURCE_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24772-release --pattern 'VF-Start-V2.47.72-FULL.zip'
          unzip -q /tmp/p01-v24772-release/VF-Start-V2.47.72-FULL.zip -d /tmp/p01-v24772-runtime
          root=/tmp/p01-v24772-runtime
          cookie=/tmp/p01-v24772-cookie.txt
          pass='AtomicGate-V24772!'
          (cd "$root" && php -S 127.0.0.1:18492 -t . >/tmp/p01-v24772-http.log 2>&1 & echo $! >/tmp/p01-v24772-http.pid)
          for i in $(seq 1 40); do
            curl -fsS -c "$cookie" -b "$cookie" http://127.0.0.1:18492/setup.php -o /tmp/p01-v24772-setup.html && break
            sleep 1
          done
          csrf="$(sed -n 's/.*name="setup_csrf"[[:space:]]*value="\([^"]*\)".*/\1/p' /tmp/p01-v24772-setup.html | head -n1)"
          test -n "$csrf"
          curl -fsS -c "$cookie" -b "$cookie" -X POST http://127.0.0.1:18492/setup.php             --data-urlencode "setup_csrf=$csrf"             --data-urlencode 'site_title=VF Start Atomic Gate'             --data-urlencode "admin_password=$pass"             --data-urlencode "admin_password_confirm=$pass"             -o /tmp/p01-v24772-setup-post.html
          kill "$(cat /tmp/p01-v24772-http.pid)" >/dev/null 2>&1 || true
          db="$(php -r '$x=include $argv[1]; echo $x["db_file"];' "$root/app/.runtime.php")"
          test -f "$db"
          db_before="$(sha256sum "$db" | awk '{print $1}')"
          php /tmp/p01-v24773-release/repair-v2.47.73.php --verify-source="$root" | tee /tmp/p01-v24773-source-verify.json
          grep -Fq '"ok":true' /tmp/p01-v24773-source-verify.json
          php /tmp/p01-v24773-release/repair-v2.47.73.php --run="$root" | tee /tmp/p01-v24773-atomic-run.json
          grep -Fq '"ok":true' /tmp/p01-v24773-atomic-run.json
          test "$(tr -d '\r\n ' < "$root/VERSION.txt")" = "$TARGET_VERSION"
          (cd "$root" && php cli/verify.php) | tee /tmp/p01-v24773-upgraded-verify.txt
          grep -Fxq 'VERIFY_PASS=YES' /tmp/p01-v24773-upgraded-verify.txt
          db_after="$(sha256sum "$db" | awk '{print $1}')"
          test "$db_before" = "$db_after"
          php /tmp/p01-v24773-release/repair-v2.47.73.php --run="$root" | tee /tmp/p01-v24773-idempotent.json
          grep -Fq '"already_current":true' /tmp/p01-v24773-idempotent.json
          echo P01_V24772_TO_V24773_ATOMIC=PASS
          echo P01_V24773_DB_BYTES_PRESERVED=PASS
          echo P01_V24773_IDEMPOTENCY=PASS

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          notes=/tmp/p01-v24773-release-notes.md
          printf '%s\n'             '# VF Start V2.47.73'             ''             'P01 · VF Start V2.47.73 将「系统 → 计划任务」正式产品化。'             ''             "- Exact Source: $TARGET_SHA"             "- Exact Tree: $TARGET_TREE"             "- Source Version: V$SOURCE_VERSION"             "- Target Version: V$TARGET_VERSION"             "- Schema: $SCHEMA（不变）"             '- 恢复 jobs.php 为正式 AdminShell 页面，并加入「系统 → 计划任务」入口。'             '- 提供 Worker/Cron 状态、自动计划、执行时机/逾期状态、手动动作与执行历史。'             '- Runtime Health 的 Cron 提醒统一指向计划任务页，并修正 canonical Worker 路径。'             '- 不改变 Schema、任务调度器执行语义、备份、Auth、Updater 或 Production 数据。'             '- Clean FULL、V2.47.72 → V2.47.73 Atomic、DB bytes preservation、Idempotency：PASS。'             '- Release Input: OWNER_DIRECT_RELEASE；Production 仍由 OWNER 后台手动升级。'             > "$notes"
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" | jq -e --arg sha "$TARGET_SHA" '.object.sha==$sha' >/dev/null
            gh release upload "$TAG" "/tmp/p01-v24773-release/$FULL_NAME" "/tmp/p01-v24773-release/$UPDATE_NAME" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "/tmp/p01-v24773-release/$FULL_NAME" "/tmp/p01-v24773-release/$UPDATE_NAME"               --repo "$PRODUCT_REPO" --target "$TARGET_SHA" --title 'VF Start V2.47.73' --notes-file "$notes"
          fi
          gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" | jq -e --arg sha "$TARGET_SHA" '.object.sha==$sha' >/dev/null
          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" > /tmp/p01-v24773-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v24773-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v24773-release.json)"
          test "$(jq -r '.draft' /tmp/p01-v24773-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v24773-release.json)" = false
          test "$(jq -r --arg n "$FULL_NAME" '.assets[]|select(.name==$n)|.size' /tmp/p01-v24773-release.json)" = "$FULL_BYTES"
          test "$(jq -r --arg n "$UPDATE_NAME" '.assets[]|select(.name==$n)|.size' /tmp/p01-v24773-release.json)" = "$UPDATE_BYTES"
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\n' "$RELEASE_ID" "$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V24773_GITHUB_RELEASE=PASS

      - name: Remote release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24773-readback
          mkdir -p /tmp/p01-v24773-readback
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24773-readback --pattern "$FULL_NAME" --pattern "$UPDATE_NAME"
          test "$(sha256sum "/tmp/p01-v24773-readback/$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "/tmp/p01-v24773-readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA"
          echo P01_V24773_REMOTE_RELEASE_READBACK=PASS

      - name: Stage core-updates P01 distribution branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          branch="release/p01-v24773-$GITHUB_RUN_ID"
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" /tmp/core-updates
          test "$(jq -r '.target_version' /tmp/core-updates/projects/P01.json)" = "$SOURCE_VERSION"
          test "$(jq -r '.product_identity' /tmp/core-updates/projects/P01.json)" = "$SOURCE_SHA"
          jq             --arg current "$SOURCE_VERSION"             --arg target "$TARGET_VERSION"             --arg schema "$SCHEMA"             --arg tag "$TAG"             --arg product "$TARGET_SHA"             --arg asset "$UPDATE_NAME"             --arg sha "$UPDATE_SHA"             --arg released "$RELEASED_AT"             --arg notes 'P01 · VF Start V2.47.73 将「系统 → 计划任务」正式产品化；Worker/Cron 状态、自动计划、执行时机、手动动作与执行历史统一进入正式系统页。Schema 不变；Atomic/DB preservation/Idempotency PASS；Production 由 OWNER 后台手动升级。'             --argjson rid "$RELEASE_ID"             --argjson bytes "$UPDATE_BYTES"             '.current_version=$current
             | .target_version=$target
             | .update_type="ATOMIC"
             | .from_versions=[$current]
             | .schema_from=$schema
             | .schema_to=$schema
             | .repository="llhzx2018/vf-start"
             | .release_tag=$tag
             | .release_id=$rid
             | .product_identity=$product
             | .asset_name=$asset
             | .asset_bytes=$bytes
             | .asset_sha256=$sha
             | .backup_required=true
             | .rollback_supported=true
             | .released_at=$released
             | .minimum_php="8.0.0"
             | .notes=$notes'             /tmp/core-updates/projects/P01.json > /tmp/P01.json
          mv /tmp/P01.json /tmp/core-updates/projects/P01.json
          git -C /tmp/core-updates checkout -b "$branch"
          git -C /tmp/core-updates config user.name VictorForge
          git -C /tmp/core-updates config user.email llhzx2018@gmail.com
          git -C /tmp/core-updates add projects/P01.json
          git -C /tmp/core-updates commit -m 'release(P01): distribute VF Start V2.47.73'
          git -C /tmp/core-updates push origin "$branch"
          printf 'CORE_UPDATES_BRANCH=%s\n' "$branch" >> "$GITHUB_ENV"
          echo "CORE_UPDATES_BRANCH=$branch"
          echo P01_V24773_CORE_UPDATES_BRANCH=PASS

      - name: Final release receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n'             "P01_V24773_RELEASE=PASS"             "SOURCE_SHA=$TARGET_SHA"             "SOURCE_TREE=$TARGET_TREE"             "TAG=$TAG"             "RELEASE_ID=$RELEASE_ID"             "FULL_NAME=$FULL_NAME"             "FULL_BYTES=$FULL_BYTES"             "FULL_SHA256=$FULL_SHA"             "UPDATE_NAME=$UPDATE_NAME"             "UPDATE_BYTES=$UPDATE_BYTES"             "UPDATE_SHA256=$UPDATE_SHA"             "CORE_UPDATES_BRANCH=$CORE_UPDATES_BRANCH"             "PRODUCTION_WRITE=NO"
