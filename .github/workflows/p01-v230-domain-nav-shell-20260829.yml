name: P01 V2.30 Domain Nav Shell
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-domain-nav-shell-20260829.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 1872c1268a44239a63271af0207593b05be38f51
      PRODUCT_BRANCH: feature/p01-v230-domain-nav-shell-20260829
      PORT: '18572'
      ROOT: /tmp/p01-v230-domain-nav
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Exact source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < source/VERSION)" = 2.29.0
          test "$(tr -d '\r\n' < source/src/VERSION.txt)" = 2.29.0
          grep -Fx "define('VF_VERSION', '2.29.0');" source/src/app/bootstrap.php >/dev/null
          echo P01_V230_DOMAIN_NAV_SOURCE_FENCE=PASS

      - name: Patch V2.30 global domain navigation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('source/src/app/FunctionalWorkspaceShell.php')
          text = shell.read_text(encoding='utf-8')
          anchor = "function vf_fw_render_sidebar(array $options): void\n{"
          assert anchor in text
          assert 'function vf_fw_render_global_domain_nav' not in text
          fn = r'''function vf_fw_render_global_domain_nav(string $mode, bool $admin, string $scope): void
          {
              $items = [
                  ['all', '首页'],
                  ['start', '导航'],
                  ['channels', '频道'],
                  ['watch', '影视'],
                  ['topics', '专题'],
              ];
              ?>
          <nav class="vf-global-domain-nav" aria-label="VF Start 资源域">
            <div class="vf-global-domain-nav-inner">
              <?php foreach($items as [$key,$label]):
                  $href = vf_fw_route_link($key, $admin ? $scope : 'public', 0);
              ?><a class="<?=$mode===$key?'active':''?>" href="<?=$href?>" aria-current="<?=$mode===$key?'page':'false'?>"><?=vf_fw_h($label)?></a><?php endforeach; ?>
            </div>
          </nav>
          <?php
          }

          '''
          text = text.replace(anchor, fn + anchor, 1)
          shell.write_text(text, encoding='utf-8')

          workspace = Path('source/src/app/FunctionalWorkspace.php')
          text = workspace.read_text(encoding='utf-8')
          old_css = '<link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url(\'assets/resource-media.css\'))?>">'
          new_css = old_css + '<link rel="stylesheet" href="<?=vf_fw_h(vf_asset_url(\'assets/workspace-domain-nav.css\'))?>">'
          assert old_css in text
          text = text.replace(old_css, new_css, 1)
          old_stage = '<section class="vf-app-stage"><header class="vf-app-topbar">'
          new_stage = '<section class="vf-app-stage"><?php vf_fw_render_global_domain_nav($mode,$admin,$scope); ?><header class="vf-app-topbar vf-domain-subbar">'
          assert old_stage in text
          text = text.replace(old_stage, new_stage, 1)
          workspace.write_text(text, encoding='utf-8')

          bootstrap = Path('source/src/app/bootstrap.php')
          text = bootstrap.read_text(encoding='utf-8')
          assert "define('VF_VERSION', '2.29.0');" in text
          bootstrap.write_text(text.replace("define('VF_VERSION', '2.29.0');", "define('VF_VERSION', '2.30.0');", 1), encoding='utf-8')
          Path('source/VERSION').write_text('2.30.0\n', encoding='utf-8')
          Path('source/src/VERSION.txt').write_text('2.30.0\n', encoding='utf-8')
          PY

          cat > source/src/assets/workspace-domain-nav.css <<'CSS'
          /* P01 V2.30 — domain-first navigation shell.
           * IA reference: stable global product strip + domain-local navigation.
           * Visual language remains VF neutral + teal; no external UI is copied verbatim.
           */
          :root{--ws-domain-nav:38px}
          .vf-global-domain-nav{height:var(--ws-domain-nav);position:sticky;top:0;z-index:38;background:#4b4e4a;border-bottom:1px solid rgba(0,0,0,.14);color:#e8ece9}
          .vf-global-domain-nav-inner{height:100%;padding:0 22px;display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
          .vf-global-domain-nav-inner::-webkit-scrollbar{display:none}
          .vf-global-domain-nav a{position:relative;min-width:max-content;padding:0 13px;display:inline-flex;align-items:center;text-decoration:none;color:#e0e5e1;font-size:12.5px;font-weight:520;letter-spacing:.01em}
          .vf-global-domain-nav a:hover{background:rgba(255,255,255,.07);color:#fff}
          .vf-global-domain-nav a.active{background:rgba(0,0,0,.11);color:#fff;font-weight:700}
          .vf-global-domain-nav a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:#45c6b9}
          .vf-app-topbar.vf-domain-subbar{top:var(--ws-domain-nav)}
          .vf-functional-sidebar .vf-nav-section-first,.vf-functional-sidebar .vf-main-nav{display:none!important}
          .vf-functional-sidebar .vf-quick-nav{margin-top:2px}
          .vf-functional-sidebar .vf-sidebar-scroll>.vf-nav-section:not(.vf-nav-section-first):first-of-type{margin-top:3px;padding-top:4px;border-top:0}
          .vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px)}
          @media(max-width:760px){
            :root{--ws-domain-nav:40px}
            .vf-global-domain-nav-inner{padding:0 8px;gap:0}
            .vf-global-domain-nav a{padding:0 12px;font-size:12.5px}
            .vf-global-domain-nav a.active::after{left:10px;right:10px}
            .vf-functional-workspace .vf-workspace-toolbar{top:calc(var(--ws-domain-nav) + 58px)}
          }
          CSS

          php -l source/src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l source/src/app/FunctionalWorkspace.php >/dev/null
          php -l source/src/app/bootstrap.php >/dev/null
          grep -F 'vf_fw_render_global_domain_nav($mode,$admin,$scope)' source/src/app/FunctionalWorkspace.php >/dev/null
          grep -F '首页' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F '专题' source/src/app/FunctionalWorkspaceShell.php >/dev/null
          test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
          test "$(tr -d '\r\n' < source/src/VERSION.txt)" = 2.30.0
          grep -Fx "define('VF_VERSION', '2.30.0');" source/src/app/bootstrap.php >/dev/null
          echo P01_V230_DOMAIN_NAV_PATCH=PASS

      - name: Fresh runtime smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-domain-nav.log 2>&1 &
          echo $! >/tmp/p01-v230-domain-nav.pid
          COOKIE=/tmp/p01-v230-domain-nav.cookies
          for i in $(seq 1 30); do
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v230-setup.html && break || sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v230-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V230 Domain Nav' \
            --data-urlencode 'admin_password=P01V230!Nav' \
            --data-urlencode 'admin_password_confirm=P01V230!Nav' \
            -o /tmp/p01-v230-setup-post.html
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v230-verify.txt | grep -Fx VERIFY_PASS=YES
          for page in surfaces.php start.php channels.php watch.php topics.php; do
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/${page}" -o "/tmp/${page}.html"
            grep -F 'vf-global-domain-nav' "/tmp/${page}.html" >/dev/null
            grep -F '>首页</a>' "/tmp/${page}.html" >/dev/null
            grep -F '>导航</a>' "/tmp/${page}.html" >/dev/null
            grep -F '>频道</a>' "/tmp/${page}.html" >/dev/null
            grep -F '>影视</a>' "/tmp/${page}.html" >/dev/null
            grep -F '>专题</a>' "/tmp/${page}.html" >/dev/null
          done
          echo P01_V230_DOMAIN_NAV_RUNTIME=PASS

      - name: Commit product branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd source
          git status --short
          git diff --check
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/VERSION.txt src/app/bootstrap.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-domain-nav.css
          git commit -m "feat(P01): add V2.30 global resource domain navigation"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "P01_V230_DOMAIN_NAV_SOURCE=${PRODUCT_SHA}"
          echo "P01_V230_DOMAIN_NAV_TREE=${PRODUCT_TREE}"
          echo P01_V230_DOMAIN_NAV_GATE=PASS
