name: P08 R129 published 012 013 2 SQL native history regressions (TEMP)
on:
  pull_request:
    paths: [.github/workflows/p08-r129-real-sql-temp.yml]
permissions:
  contents: read
jobs:
  real-issued-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {driver: mysql, image: 'mysql:8.4', health: 'mysqladmin ping -h 127.0.0.1 -uroot -pSyntheticP08Only123 --silent'}
          - {driver: mariadb, image: 'mariadb:11.8', health: 'healthcheck.sh --connect --innodb_initialized'}
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: SyntheticP08Only123
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      P08_R129_ISOLATED: "YES"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R129_DRIVER: ${{ matrix.driver }}
      P08_R129_SQL_HOST: 127.0.0.1
      P08_R129_SQL_USER: root
      P08_R129_SQL_PASSWORD: SyntheticP08Only123
    steps:
      - name: Setup PHP 8.4 with native PDO and data support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_mysql,pdo_sqlite,sqlite3,curl,mbstring,zip,posix
      - name: Install SQL native clients under disposable runner
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          command -v mariadb-dump
          command -v mysql
      - name: Checkout exact private PR56 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 702016ccd3f76df2b4e5e82d537ca103a83ce404
          path: p08-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Fetch and verify real published v0.1.2 and v0.1.3 full ZIP
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          site="$RUNNER_TEMP/p08-r129-real-issued-sql-$P08_R129_DRIVER"
          mkdir -m 0700 "$site" "$site/releases"
          echo "P08_R129_SITE=$site" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/p08-r129-issued-012.zip"
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/p08-r129-issued-012.zip" | sha256sum -c --status
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/753599121 \
            --output "$RUNNER_TEMP/p08-r129-issued-013.zip"
          echo "80556ab606aec6080b05000b41073e597578544162ac918277bd0629cf020527  $RUNNER_TEMP/p08-r129-issued-013.zip" | sha256sum -c --status
          unzip -q "$RUNNER_TEMP/p08-r129-issued-012.zip" -d "$site"
          mkdir -m 0700 "$site/releases/44d504185f0ac8cf4be552dc5adada989a08b40e"
          unzip -q "$RUNNER_TEMP/p08-r129-issued-013.zip" -d "$site/releases/44d504185f0ac8cf4be552dc5adada989a08b40e"
          echo P08_R129_ACTUAL_RELEASE_ZIP_BYTES_AND_OFFICIAL_SHA256=PASS
      - name: Exact source MySQL MariaDB native backup and history handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$P08_R129_SITE" "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP/p08-r129-issued-012.zip" "$RUNNER_TEMP/p08-r129-issued-013.zip"' EXIT
          cd p08-source
          test "$(git rev-parse HEAD)" = 702016ccd3f76df2b4e5e82d537ca103a83ce404
          php -l tests/compatibility/r129_real_issued_013_history.php
          php tests/compatibility/r129_real_issued_013_history.php "$P08_R129_SITE"
          php tests/test_r127_owner_cycle_handoff.php
          echo P08_R129_REAL_PUBLISHED_THREE_ENGINE_NATIVE_BACKUP_HISTORY=PASS
      - name: Always purge ZIP and private source
        if: always()
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-source" "$RUNNER_TEMP"/p08-r129-real-issued-sql-* "$RUNNER_TEMP/p08-r129-issued-012.zip" "$RUNNER_TEMP/p08-r129-issued-013.zip"
