name: p01-1935-later-success-proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-1935-later-success-proof-temp.yml'
permissions:
  contents: read
jobs:
  interrupted-journal-supersession:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: fix/p01-v247500-superseded-interrupted-journal-r1
      TARGET_SHA: f3a9b810b1aa5889d5570a471892287f17f1fdf6
      TARGET_TREE: 0ab5d7f89edfbd6858b842c06c1ab77e37ce3c29
      BASE_SHA: 59f9dff7771a0fd9a8dbe30f7a14ddbaaa8f4902
      WORK: /tmp/p01-journal-1935-${{ github.run_id }}
    steps:
      - name: Checkout registered Public Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP / Node isolated test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-sqlite3 php-curl php-zip php-mbstring >/dev/null
          php -m | grep -Fx pdo_sqlite
          node --version
      - name: Exact private product commit transient checkout
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$actual" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$WORK/candidate"
          git -C "$WORK/candidate" fetch -q --depth 1 origin "$TARGET_SHA"
          git -C "$WORK/candidate" fetch -q --depth 1 origin "$BASE_SHA"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" worktree add -q --detach "$WORK/stable" "$BASE_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "2.47.500"
          test "$(tr -d '\r\n ' < "$WORK/stable/VERSION")" = "2.47.500"
          echo P01_1935_LATER_SUCCESS_EXACT_TREE=PASS
      - name: Fail-closed journal and dual-operation PHP tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/candidate"
          php -l src/app/UpdateManager.php
          php -l tests/unit/p01_update_superseded_interrupted_journal_guard.php
          php tests/unit/p01_update_superseded_interrupted_journal_guard.php
          php tests/unit/p01_update_interrupted_install_fail_closed.php
          php tests/unit/p01_upgrade_global_lock_timeout_contract.php
          node tests/unit/p01_update_interrupted_owner_warning_native.cjs
          echo P01_1935_LATER_SUCCESS_AND_TRUE_PENDING=PASS
      - name: Canonical exact-source zero-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$WORK/candidate/tests/canonical_release_regression.sh" "$WORK/candidate" "$WORK/stable" --require-zero-debt
          echo P01_1935_LATER_SUCCESS_CANONICAL_ZERO_DEBT=PASS
      - name: Safety classification and disposable cleanup
        if: always()
        shell: bash
        run: |
          echo P01_1935_LATER_SUCCESS_FORMAL_RELEASE=NOT_EXECUTED
          echo P01_1935_LATER_SUCCESS_CORE_UPDATES=UNCHANGED
          echo P01_1935_LATER_SUCCESS_PRODUCTION=UNCHANGED
          echo P01_1935_LATER_SUCCESS_PRIVATE_SOURCE_ARTIFACT=NONE
          case "$WORK" in /tmp/p01-journal-1935-*) rm -rf -- "$WORK";; *) exit 66;; esac
