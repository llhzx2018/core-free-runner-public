name: P01 V2.28 Remote Online Update Gate Final
on:
  push:
    branches: [task/p01-v2280-remote-online-update-gate-20260829]
    paths:
      - .github/workflows/p01-v2280-remote-online-update-gate-final-20260829.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v228-remote-final
      PORT: '18359'
      ADMIN_PASS: 'P01V228!RemoteFinal'
      SOURCE_SHA: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
      FORMAL_SOURCE: e010d484c8879737503a02612d0ba8cff1d2fd7d
      CORE_UPDATES_MAIN: b9169523a9c7c7584fc77f982d872676d8eb3712
      UPDATE_SHA: 7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.27.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Exact remote truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v228-remote-final-evidence && mkdir -p /tmp/p01-v228-remote-final-evidence
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_MAIN"
          jq -e '.target_version=="2.28.0" and .from_versions==["2.27.0"] and .release_tag=="v2.28.0" and .asset_name=="VF_Start_V2.28.0_UPDATE.zip" and .asset_bytes==1255387 and .asset_sha256=="7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f" and .release_id==378625381 and .release_identity=="v2.28.0@e010d484c8879737503a02612d0ba8cff1d2fd7d" and .schema_from=="2026082801" and .schema_to=="2026082801"' updates/projects/P01.json >/dev/null
          test "$(git -C production ls-remote --tags origin refs/tags/v2.28.0 | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.28.0)
          test "$(jq -r .id <<<"$R")" = 378625381
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.28.0_UPDATE.zip")' <<<"$R")
          test "$(jq -r .size <<<"$A")" = 1255387
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          echo P01_V228_FINAL_REMOTE_TRUTH=PASS
      - name: Install isolated V2.27 and seed Owner-like data
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "/tmp/p01-v228-final-${PORT}.cookies"
          cp -a production/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"/tmp/p01-v228-final-${PORT}.log" 2>&1 &
          echo $! >"/tmp/p01-v228-final-${PORT}.pid"
          COOKIE="/tmp/p01-v228-final-${PORT}.cookies"
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v228-final-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v228-final-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V228 Remote Final' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/p01-v228-final-setup-post.html
          test -f "$ROOT/app/.runtime.php"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.27.0
          cat >/tmp/p01-v228-final-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $a=$r->createCategory(['name'=>'Final Start','description'=>'','is_private'=>false]);
          $b=$r->createCategory(['name'=>'Final Channels','description'=>'','is_private'=>false]);
          $c=$r->createCategory(['name'=>'Final Watch','description'=>'','is_private'=>false]);
          $ids=['a'=>$a,'b'=>$b,'c'=>$c,'fav'=>0,'ch'=>0,'wa'=>0];
          for($i=1;$i<=15;$i++){ $x=$r->saveLink(null,['category_id'=>$a,'title'=>'Final Start '.$i,'url'=>'https://final-start-'.$i.'.example.com','description'=>'keep','is_private'=>false,'is_favorite'=>$i===1],'manual');if($i===1)$ids['fav']=(int)$x['id']; }
          for($i=1;$i<=65;$i++){ $x=$r->saveLink(null,['category_id'=>$b,'title'=>'Final Channel '.$i,'url'=>'https://youtube.com/@final-v228-'.$i,'description'=>'keep','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%2===0,'note'=>$i===1?'final channel note':'']);if($i===1)$ids['ch']=(int)$x['id']; }
          $st=['want','watching','watched','favorite'];for($i=1;$i<=45;$i++){ $x=$r->saveLink(null,['category_id'=>$c,'title'=>'Final Watch '.$i,'url'=>'https://final-watch-'.$i.'.example.com','description'=>'keep','is_private'=>true],'manual');$s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>2000+$i%24,'media_status'=>$st[($i-1)%4],'note'=>$i===1?'final watch note':'']);if($i===1)$ids['wa']=(int)$x['id']; }
          file_put_contents('/tmp/p01-v228-final-ids.json',json_encode($ids,JSON_THROW_ON_ERROR));$p=vf_db();
          if((int)$p->query('SELECT COUNT(*) FROM links')->fetchColumn()!==125||(int)$p->query('SELECT COUNT(*) FROM resource_surface_profiles')->fetchColumn()!==110)throw new RuntimeException('seed mismatch');
          echo "P01_V228_FINAL_OWNER_SEED=PASS\n";
          PHP
          php /tmp/p01-v228-final-seed.php | tee /tmp/p01-v228-remote-final-evidence/seed.txt | grep -Fx P01_V228_FINAL_OWNER_SEED=PASS
      - name: Real UpdateManager remote check prepare install
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v228-final-update.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');require $root.'/app/bootstrap.php';require_once $root.'/app/UpdateManager.php';
          $m=new VfUpdateManager(vf_db(),['root'=>$root,'private_root'=>VF_PRIVATE_ROOT,'current_version'=>'2.27.0']);
          $check=$m->check(true);
          if(($check['ok']??false)!==true||($check['latest_version']??'')!=='2.28.0'||($check['available']??false)!==true||($check['can_update']??false)!==true)throw new RuntimeException('check failed '.json_encode($check));
          $prep=$m->prepare();
          if(($prep['ok']??false)!==true||($prep['release_tag']??'')!=='v2.28.0'||($prep['asset_name']??'')!=='VF_Start_V2.28.0_UPDATE.zip'||(int)($prep['update_package_bytes']??0)!==1255387||($prep['update_package_sha256']??'')!=='7a8f8ad9417edd6305494f1228b7953791b91afd539b31d9bac16490f089581f')throw new RuntimeException('prepare failed '.json_encode($prep));
          foreach(['manifest_identity','release_tag','release_asset','bytes','sha256','atomic_self_test','recovery_point'] as $k)if(($prep['checks'][$k]??'')!=='pass')throw new RuntimeException('prepare '.$k);
          $install=$m->install((string)$prep['operation_id']);
          if(($install['ok']??false)!==true||($install['updated']??false)!==true||($install['from_version']??'')!=='2.27.0'||($install['to_version']??'')!=='2.28.0')throw new RuntimeException('install failed '.json_encode($install));
          file_put_contents('/tmp/p01-v228-remote-final-evidence/update.json',json_encode(['check'=>$check,'prepare'=>$prep,'install'=>$install],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V228_FINAL_REAL_UPDATE_MANAGER=PASS\n";
          PHP
          php /tmp/p01-v228-final-update.php | tee /tmp/p01-v228-remote-final-evidence/update.txt | grep -Fx P01_V228_FINAL_REAL_UPDATE_MANAGER=PASS
      - name: Verify upgraded data baseline SQLite and online current state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.28.0
          grep -Fx "define('VF_VERSION', '2.28.0');" "$ROOT/app/bootstrap.php" >/dev/null
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v228-remote-final-evidence/verify.txt | grep -Fx VERIFY_PASS=YES
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v228-remote-final-evidence/surface.txt
          grep -Fx MULTI_SURFACE_PASS=YES /tmp/p01-v228-remote-final-evidence/surface.txt
          grep -Fx WORKING_SCHEMA=2026082801 /tmp/p01-v228-remote-final-evidence/surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v228-remote-final-evidence/baseline.txt
          grep -Fx BASELINE_CORE_PASS=YES /tmp/p01-v228-remote-final-evidence/baseline.txt
          grep -Fx BASELINE_FULL_PASS=YES /tmp/p01-v228-remote-final-evidence/baseline.txt
          grep -Fx DRIFT_COUNT=0 /tmp/p01-v228-remote-final-evidence/baseline.txt
          grep -Fx UNKNOWN_COUNT=0 /tmp/p01-v228-remote-final-evidence/baseline.txt
          cat >/tmp/p01-v228-final-verify.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');$ids=json_decode((string)file_get_contents('/tmp/p01-v228-final-ids.json'),true,512,JSON_THROW_ON_ERROR);require $root.'/app/bootstrap.php';require_once $root.'/app/SurfaceRepository.php';require_once $root.'/app/UpdateManager.php';$p=vf_db();
          if((int)$p->query('SELECT COUNT(*) FROM links')->fetchColumn()!==125||(int)$p->query('SELECT COUNT(*) FROM resource_surface_profiles')->fetchColumn()!==110)throw new RuntimeException('data count');
          $q=$p->prepare('SELECT is_favorite FROM links WHERE id=?');$q->execute([(int)$ids['fav']]);if((int)$q->fetchColumn()!==1)throw new RuntimeException('favorite');
          $q=$p->prepare('SELECT surface,note FROM resource_surface_profiles WHERE link_id=?');$q->execute([(int)$ids['ch']]);$x=$q->fetch(PDO::FETCH_ASSOC);if(($x['surface']??'')!=='channels'||($x['note']??'')!=='final channel note')throw new RuntimeException('channel profile');$q->execute([(int)$ids['wa']]);$x=$q->fetch(PDO::FETCH_ASSOC);if(($x['surface']??'')!=='watch'||($x['note']??'')!=='final watch note')throw new RuntimeException('watch profile');
          $r=new VfRepository($p);$s=new VfSurfaceRepository($p);$n=$r->saveLink(null,['category_id'=>(int)$ids['b'],'title'=>'Final Post Upgrade','url'=>'https://final-post-upgrade.example.com','description'=>'ok','is_private'=>true,'is_favorite'=>true],'manual');$s->upsertProfile((int)$n['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>true,'note'=>'post']);
          if(strtolower((string)$p->query('PRAGMA integrity_check')->fetchColumn())!=='ok'||count($p->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))!==0)throw new RuntimeException('sqlite');
          $m=new VfUpdateManager($p,['root'=>$root,'private_root'=>VF_PRIVATE_ROOT,'current_version'=>'2.28.0']);$check=$m->check(true);$status=$m->status();if(($check['latest_version']??'')!=='2.28.0'||($check['available']??true)!==false||($status['current_version']??'')!=='2.28.0')throw new RuntimeException('current check');$h=$status['history'][0]??[];if(($h['from_version']??'')!=='2.27.0'||($h['to_version']??'')!=='2.28.0'||($h['result']??'')!=='success')throw new RuntimeException('history');
          file_put_contents('/tmp/p01-v228-remote-final-evidence/current.json',json_encode(['check'=>$check,'status'=>$status],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));echo "P01_V228_FINAL_DATA_AND_CURRENT=PASS\n";
          PHP
          php /tmp/p01-v228-final-verify.php | tee /tmp/p01-v228-remote-final-evidence/current.txt | grep -Fx P01_V228_FINAL_DATA_AND_CURRENT=PASS
      - name: Restart upgraded web runtime and HTTP smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          OLD=$(cat "/tmp/p01-v228-final-${PORT}.pid")
          kill "$OLD" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$OLD" 2>/dev/null || break; sleep .2; done
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >"/tmp/p01-v228-final-${PORT}-upgraded.log" 2>&1 &
          echo $! >"/tmp/p01-v228-final-${PORT}.pid"
          for i in $(seq 1 30); do curl -sS -o /dev/null "http://127.0.0.1:${PORT}/" && break || sleep 1; done
          COOKIE=/tmp/p01-v228-final-upgraded.cookies
          LOGIN=$(curl -sS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST "http://127.0.0.1:${PORT}/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}")
          printf '%s\n' "$LOGIN" > /tmp/p01-v228-remote-final-evidence/login.json
          jq -e '.ok==true' <<<"$LOGIN" >/dev/null
          : > /tmp/p01-v228-remote-final-evidence/http.txt
          for path in 'surface.php?surface=all' 'start.php' 'channels.php' 'watch.php'; do
            code=$(curl -sS -o /tmp/p01-v228-final-page.html -w '%{http_code}' -b "$COOKIE" "http://127.0.0.1:${PORT}/$path")
            printf '%s %s\n' "$code" "$path" | tee -a /tmp/p01-v228-remote-final-evidence/http.txt
            test "$code" = 200
          done
          grep -Fx "define('VF_VERSION', '2.28.0');" "$ROOT/app/bootstrap.php" >/dev/null
          echo P01_V228_FINAL_FRESH_HTTP_RUNTIME=PASS
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          kill "$(cat /tmp/p01-v228-final-${PORT}.pid)" 2>/dev/null || true
          cat >/tmp/p01-v228-remote-final-evidence/VERDICT.txt <<'EOF'
          P01_V227_TO_V228_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V228_REMOTE_MANIFEST=PASS
          P01_V228_REMOTE_ASSET=PASS
          P01_V228_REAL_UPDATE_MANAGER=PASS
          P01_V228_REMOTE_DATA_PRESERVED=PASS
          P01_V228_REMOTE_POST_UPGRADE_MUTATION=PASS
          P01_V228_REMOTE_SQLITE=PASS
          P01_V228_REMOTE_ALREADY_CURRENT=PASS
          P01_V228_REMOTE_HISTORY=PASS
          P01_V228_REMOTE_HTTP_SMOKE=PASS
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat /tmp/p01-v228-remote-final-evidence/VERDICT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: P01-v2.28.0-remote-online-update-final-evidence
          path: /tmp/p01-v228-remote-final-evidence
          if-no-files-found: error
          retention-days: 90
