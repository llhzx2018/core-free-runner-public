name: S01 Page Body V1 Phase4 Distribution Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-phase4-distribution-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-phase4-distribution-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      CORE_MAIN_SHA: 91de0515f5c24c4b7b1e1a29ae6d093679d376b4
      C01_BRANCH: release/s01-c01-theme-13545-page-body-v1-20260926
      C01_SHA: 4281f81d3b8f24f9c07bdc8d61ec2b8430d9154b
      C02_BRANCH: release/s01-c02-ops-121942-page-body-v1-20260926
      C02_SHA: e8b5833b12050ab22b505ae77531b45619e958f1
      C03_BRANCH: release/s01-c03-m3u8-12548-page-body-v1-20260926
      C03_SHA: 767f459b5829df834438e70f11e0a6b39411d4c8
    steps:
      - name: Credential presence
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"

      - name: Resolve core-updates credential
        id: auth
        shell: bash
        run: |
          set -Eeuo pipefail
          choose=''
          for candidate_name in VF_PRIVATE_READ_TOKEN VF_RELEASE_WRITE_TOKEN; do
            candidate="${!candidate_name:-}"
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $candidate" https://api.github.com/repos/llhzx2018/core-updates || true)"
            if [ "$code" = '200' ]; then choose="$candidate_name"; break; fi
          done
          [ -n "$choose" ] || exit 1
          echo "token_name=$choose" >> "$GITHUB_OUTPUT"

      - name: Fetch exact core-updates refs
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.auth.outputs.token_name }}" = 'VF_PRIVATE_READ_TOKEN' ]; then TOKEN="$VF_PRIVATE_READ_TOKEN"; else TOKEN="$VF_RELEASE_WRITE_TOKEN"; fi
          rm -rf core-updates && mkdir core-updates && cd core-updates
          git init -q
          git remote add origin https://github.com/llhzx2018/core-updates.git
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin             refs/heads/main:refs/remotes/origin/main             refs/heads/$C01_BRANCH:refs/remotes/origin/c01             refs/heads/$C02_BRANCH:refs/remotes/origin/c02             refs/heads/$C03_BRANCH:refs/remotes/origin/c03
          test "$(git rev-parse refs/remotes/origin/main)" = "$CORE_MAIN_SHA"
          test "$(git rev-parse refs/remotes/origin/c01)" = "$C01_SHA"
          test "$(git rev-parse refs/remotes/origin/c02)" = "$C02_SHA"
          test "$(git rev-parse refs/remotes/origin/c03)" = "$C03_SHA"

      - name: Exact one-file scopes
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only refs/remotes/origin/main...refs/remotes/origin/c01)" = 'projects/S01-C01.json'
          test "$(git diff --name-only refs/remotes/origin/main...refs/remotes/origin/c02)" = 'projects/S01-C02.json'
          test "$(git diff --name-only refs/remotes/origin/main...refs/remotes/origin/c03)" = 'projects/S01-C03.json'

      - name: Validate C01 manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          git checkout --detach refs/remotes/origin/c01
          python3 - <<'PY'
          import json
          p=json.load(open('projects/S01-C01.json',encoding='utf-8'))
          assert p['target_version']=='1.35.45'
          assert p['from_versions']==[f'1.35.{n}' for n in range(8,45)]
          assert p['release_tag']=='v1.35.45'
          assert p['asset_name']=='vf-tools-theme_V1.35.45.zip'
          assert p['asset_bytes']==1748411
          assert p['asset_sha256']=='972e613f7e301f665a2b773af034252c6e3656d25b3b9ad8c24c2c35b853ffc8'
          assert p['runtime_files']==461
          assert p['runtime_fingerprint']=='2b1d132f36ed422803bb7c9b1d95d8790acc9daa32258f548f52dca56ca30625'
          assert p['released_at']=='2026-09-26T10:56:19Z'
          print('PASS C01')
          PY
          python3 scripts/check_manifest_contract.py

      - name: Validate C02 manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          git checkout --detach refs/remotes/origin/c02
          python3 - <<'PY'
          import json
          p=json.load(open('projects/S01-C02.json',encoding='utf-8'))
          assert p['target_version']=='1.21.942'
          assert '1.21.941' in p['from_versions']
          assert len(p['from_versions'])==len(set(p['from_versions']))
          assert p['release_tag']=='v1.21.942'
          assert p['asset_name']=='vf-tools-ops_V1.21.942.zip'
          assert p['asset_bytes']==3482657
          assert p['asset_sha256']=='5c8bf47082d37b1ecbef9536fd94728ea24faafb0fdfa3d7f53792f7828a9495'
          assert p['runtime_files']==966
          assert p['runtime_fingerprint']=='5b80f2828285ea305e730a54da69faf485ae5657ed8cd7c32f749c9d878305b3'
          assert p['runtime_file_count']==966
          assert p['runtime_fingerprint_sha256']==p['runtime_fingerprint']
          assert p['schema_from']=='6.0.0' and p['schema_to']=='6.0.0'
          assert p['released_at']=='2026-09-26T11:14:07Z'
          print('PASS C02')
          PY
          python3 scripts/check_manifest_contract.py

      - name: Validate C03 manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          git checkout --detach refs/remotes/origin/c03
          python3 - <<'PY'
          import json
          p=json.load(open('projects/S01-C03.json',encoding='utf-8'))
          assert p['target_version']=='1.25.48'
          assert p['from_versions']==[f'1.25.{n}' for n in range(20,48)]
          assert p['release_tag']=='v1.25.48'
          assert p['asset_name']=='vf-tools-m3u8_V1.25.48.zip'
          assert p['asset_bytes']==3574446
          assert p['asset_sha256']=='449f542e96dd56f2d7984923b04e0aff56798fa822c93204c8f976cefc05b24b'
          assert p['runtime_files']==565
          assert p['runtime_fingerprint']=='e59b924372d0fc8eb37dc6dad4f88be8d1ee1e6d0b8c008ecdba2649816b0e37'
          assert p['runtime_file_count']==565
          assert p['runtime_fingerprint_sha256']==p['runtime_fingerprint']
          assert p['schema_from']=='1.3.0' and p['schema_to']=='1.3.0'
          assert p['released_at']=='2026-09-26T10:56:16Z'
          print('PASS C03')
          PY
          python3 scripts/check_manifest_contract.py

      - name: Update Core regression
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          git checkout --detach refs/remotes/origin/c03
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php

      - name: Live Release metadata
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          C01="$(gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.45)"
          C02="$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.942)"
          C03="$(gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/v1.25.48)"
          python3 - "$C01" "$C02" "$C03" <<'PY'
          import json,sys
          rows=[
            (json.loads(sys.argv[1]),'0a1a4f3c1b72b8e1a9b3e21884f9b2fa2aa8a512','vf-tools-theme_V1.35.45.zip',1748411,'sha256:972e613f7e301f665a2b773af034252c6e3656d25b3b9ad8c24c2c35b853ffc8'),
            (json.loads(sys.argv[2]),'f5844e3fddca106071c00f55b0517e22835a9565','vf-tools-ops_V1.21.942.zip',3482657,'sha256:5c8bf47082d37b1ecbef9536fd94728ea24faafb0fdfa3d7f53792f7828a9495'),
            (json.loads(sys.argv[3]),'b058da1e449e773ebebb694c33675517608f87de','vf-tools-m3u8_V1.25.48.zip',3574446,'sha256:449f542e96dd56f2d7984923b04e0aff56798fa822c93204c8f976cefc05b24b'),
          ]
          for r,target,name,size,digest in rows:
            assert r['target_commitish']==target
            a=[x for x in r['assets'] if x['name']==name]; assert len(a)==1
            assert a[0]['size']==size and a[0]['digest']==digest
          print('PASS releases')
          PY

      - name: Secret fence
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          for ref in c01 c02 c03; do
            git checkout --detach "refs/remotes/origin/$ref"
            case "$ref" in
              c01) file="projects/S01-C01.json" ;;
              c02) file="projects/S01-C02.json" ;;
              c03) file="projects/S01-C03.json" ;;
              *) exit 1 ;;
            esac
            ! grep -E '(ghp_|github_pat_|Authorization:[[:space:]]*Bearer|VF_PRIVATE_READ_TOKEN[[:space:]]*=|VF_RELEASE_WRITE_TOKEN[[:space:]]*=)' "$file"
          done
