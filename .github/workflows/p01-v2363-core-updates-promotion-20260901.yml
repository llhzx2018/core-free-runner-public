name: P01 V2.36.3 Core Updates Promotion
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-core-updates-promotion-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE: 3ddf344872744ba4e9e407c99fe704b90a4cda97
      MANIFEST_SOURCE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      CANDIDATE_GATE: '33504575042'
      EVID: /tmp/p01-v2363-core-updates-promotion-evidence
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.MANIFEST_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Concurrency fence and fast-forward manifest main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_GATE --jq .conclusion)" = success
          cd updates
          test "$(git rev-parse HEAD)" = "$MANIFEST_SOURCE"
          test "$(git rev-parse HEAD^)" = "$CORE_BASE"
          test "$(git diff --name-only "$CORE_BASE" "$MANIFEST_SOURCE")" = projects/P01.json
          LIVE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$LIVE" = "$CORE_BASE"
          M=projects/P01.json
          test "$(jq -r .current_version "$M")" = 2.36.2
          test "$(jq -r .target_version "$M")" = 2.36.3
          test "$(jq -r '.from_versions|join(",")' "$M")" = 2.36.2
          test "$(jq -r .release_tag "$M")" = v2.36.3
          test "$(jq -r .release_id "$M")" = 380449563
          test "$(jq -r .product_identity "$M")" = 718e043e3715ef7b21849bc08634fca89bf92c1f
          test "$(jq -r .asset_name "$M")" = VF_Start_V2.36.3_UPDATE.zip
          test "$(jq -r .asset_bytes "$M")" = 1236976
          test "$(jq -r .asset_sha256 "$M")" = 7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d
          git merge-base --is-ancestor "$CORE_BASE" "$MANIFEST_SOURCE"
          git push origin "$MANIFEST_SOURCE:refs/heads/main"
          REMOTE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE" = "$MANIFEST_SOURCE"
          git show "$REMOTE:projects/P01.json" > "$EVID/live-P01-after.json"
          test "$(jq -r .current_version "$EVID/live-P01-after.json")" = 2.36.2
          test "$(jq -r .target_version "$EVID/live-P01-after.json")" = 2.36.3
          test "$(jq -r '.from_versions|join(",")' "$EVID/live-P01-after.json")" = 2.36.2
          printf 'P01_V2363_CORE_UPDATES_PROMOTION=PASS\nCORE_UPDATES_MAIN_BEFORE=%s\nCORE_UPDATES_MAIN_AFTER=%s\nSUPPORTED_FROM=2.36.2\nTARGET=2.36.3\nASSET=VF_Start_V2.36.3_UPDATE.zip\nASSET_BYTES=1236976\nASSET_SHA256=7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d\nFORCE_PUSH=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$CORE_BASE" "$REMOTE" | tee "$EVID/verdict.txt"
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-core-updates-promotion-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
