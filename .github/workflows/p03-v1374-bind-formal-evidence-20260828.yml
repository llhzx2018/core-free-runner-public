name: P03 V1.37.4 Bind Formal Evidence
on:
  push:
    branches: [task/p03-v1374-common-baseline-release-20260828]
    paths: ['.github/workflows/p03-v1374-bind-formal-evidence-20260828.yml']
permissions: {contents: read}
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout P03 release branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-forge
          ref: release/p03-v1.37.4-common-baseline-v2-20260828
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product
      - name: Bind exact formal gate evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = b215f510a543ca5cf85af9e87257e2acb63d74ab
          git fetch origin main
          test "$(git rev-parse origin/main)" = cc9a6da445240534016d08e148aa8a28c11be241
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['project_id']=='P03' and d['candidate_version']=='1.37.4' and d['schema_version']==30
          assert d['production_version']=='1.37.3' and d['production_write']=='NO'
          d['status']='V1.37.3 PRODUCTION / V1.37.4 FORMAL CANDIDATE VERIFIED'
          d['project_status']='FORMAL_CANDIDATE_VERIFIED'
          d['product_identity']['candidate_source_commit']='b215f510a543ca5cf85af9e87257e2acb63d74ab'
          d['verification'].update({
            'final_exact':'FORMAL_GATE_PASS / FINAL_EXACT_SOURCE_GATE_PENDING',
            'formal_gate_result':'PASS',
            'formal_gate_run_id':33124160111,
            'formal_gate_job_id':98698131192,
            'formal_gate_artifact_id':9667684606,
            'formal_gate_artifact_name':'P03-V1.37.4-FORMAL-RELEASE-SET',
            'formal_gate_exact_source':'b215f510a543ca5cf85af9e87257e2acb63d74ab',
            'formal_gate_exact_tree':'75b65d094f3f487faefe5680ae4cc5162fc26552',
            'source_projection':'60 / 60 PASS',
            'repository_health':'PASS',
            'schema_contract':'PASS / 30',
            'fresh_install':'PASS / SCHEMA 30',
            'common_product_baseline_v2':'PASS / DRIFT 0 / UNKNOWN 0 / EXCEPTION 3 / N_A 1',
            'backup_restore':'PASS',
            'project_intelligence':'PASS',
            'mcp_e2e':'PASS',
            'atomic_upgrade':'1.37.3 -> 1.37.4 PASS',
            'atomic_rollback':'PASS / SOURCE AND DATABASE',
            'browser_e2e':'PASS / 1440x900 / 768x1024 / 390x844',
            'deterministic_artifacts':'PASS',
            'formal_release':'READY_NOT_PUBLISHED',
            'core_updates':'NOT_STARTED',
            'production_write':'NO'})
          d['release'].update({
            'release_ready':'YES / FORMAL MACHINE GATE PASS',
            'release_tag':None,
            'asset_name':'PENDING_PUBLICATION',
            'core_updates':'NOT_STARTED',
            'owner_upgrade_authorized':False,
            'production_write':False})
          d['git_alignment']['mode']='FORMAL CANDIDATE VERIFIED / FINAL EXACT SOURCE GATE'
          d['current_phase']='V1.37.4 FINAL EXACT SOURCE GATE'
          d['current_verdict']='FORMAL MACHINE PASS / RELEASE NOT YET PUBLISHED'
          d['product_test_failure']='NONE'
          d['next_action']='RUN V1.37.4 FINAL EXACT SOURCE GATE -> PR/MERGE -> TAG/RELEASE/CORE-UPDATES; PRODUCTION NO'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = VF_PROJECT.json
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['verification']['formal_gate_result']=='PASS'
          assert d['verification']['formal_gate_run_id']==33124160111
          assert d['verification']['formal_gate_job_id']==98698131192
          assert d['verification']['formal_gate_artifact_id']==9667684606
          assert d['verification']['formal_gate_exact_source']=='b215f510a543ca5cf85af9e87257e2acb63d74ab'
          assert d['release']['release_ready']=='YES / FORMAL MACHINE GATE PASS'
          assert d['production_write']=='NO'
          print('P03_V1374_FORMAL_EVIDENCE_CONTENT=PASS')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'authority(P03): bind V1.37.4 formal PASS evidence'
          git push origin HEAD:release/p03-v1.37.4-common-baseline-v2-20260828
          echo P03_V1374_FORMAL_EVIDENCE_BIND=PASS
