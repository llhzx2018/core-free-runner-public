name: P01 V2.29 Authoritative Remote Online Update Gate
on:
  push:
    branches: [task/p01-v2290-remote-online-update-gate-20260829]
    paths:
      - .github/workflows/p01-v2290-remote-online-update-authoritative-20260829.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      ROOT: /tmp/p01-v229-authoritative-owner
      PORT: '18561'
      ADMIN_PASS: 'P01V229!Authoritative'
      SOURCE_SHA: e010d484c8879737503a02612d0ba8cff1d2fd7d
      FORMAL_SOURCE: aa9070bb810064df2e965a793b999ac8bde5734e
      FORMAL_TREE: a4922cbd297390500d5fbbf053c0072d1dd6360f
      CORE_UPDATES_MAIN: 5fe7b4c21952fd8aa367de960378764848b6e559
      UPDATE_SHA: 40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1
      UPDATE_BYTES: '1319081'
      RELEASE_ID: '378779919'
      SOURCE_SCHEMA: '2026082801'
      TARGET_SCHEMA: '2026082901'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.28.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 5fe7b4c21952fd8aa367de960378764848b6e559
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates

      - name: Independent remote publication truth fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v229-authoritative-evidence && mkdir -p /tmp/p01-v229-authoritative-evidence
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = 2.28.0
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_MAIN"
          jq -e '
            .schema_version=="1.0" and .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.28.0" and .target_version=="2.29.0" and .update_type=="ATOMIC" and
            .from_versions==["2.28.0"] and
            .schema_from=="2026082801" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.29.0" and
            .release_id==378779919 and .product_identity=="aa9070bb810064df2e965a793b999ac8bde5734e" and
            .asset_name=="VF_Start_V2.29.0_UPDATE.zip" and .asset_bytes==1319081 and
            .asset_sha256=="40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-28T21:44:15Z" and .minimum_php=="8.0.0"
          ' updates/projects/P01.json >/dev/null
          test "$(git -C production ls-remote origin 'refs/tags/v2.29.0^{}' | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.29.0)
          test "$(jq -r .id <<<"$R")" = "$RELEASE_ID"
          test "$(jq -r .tag_name <<<"$R")" = v2.29.0
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          test "$(jq -r .published_at <<<"$R")" = '2026-08-28T21:44:15Z'
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.29.0_UPDATE.zip")' <<<"$R")
          test -n "$A"
          test "$(jq -r .size <<<"$A")" = "$UPDATE_BYTES"
          test "$(jq -r .digest <<<"$A")" = "sha256:$UPDATE_SHA"
          gh release download v2.29.0 -R llhzx2018/vf-start -p VF_Start_V2.29.0_UPDATE.zip -D /tmp/p01-v229-authoritative-evidence
          test "$(sha256sum /tmp/p01-v229-authoritative-evidence/VF_Start_V2.29.0_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s /tmp/p01-v229-authoritative-evidence/VF_Start_V2.29.0_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(unzip -Z1 /tmp/p01-v229-authoritative-evidence/VF_Start_V2.29.0_UPDATE.zip | wc -l)" = 1
          unzip -Z1 /tmp/p01-v229-authoritative-evidence/VF_Start_V2.29.0_UPDATE.zip | grep -Fx repair-v2.29.0.php >/dev/null
          unzip -p /tmp/p01-v229-authoritative-evidence/VF_Start_V2.29.0_UPDATE.zip repair-v2.29.0.php >/tmp/repair-v2.29.0.php
          php -l /tmp/repair-v2.29.0.php >/dev/null
          printf '%s\n' "$R" > /tmp/p01-v229-authoritative-evidence/release.json
          cp updates/projects/P01.json /tmp/p01-v229-authoritative-evidence/P01.json
          echo P01_V229_AUTHORITATIVE_REMOTE_TRUTH=PASS

      - name: Build isolated Owner-like V2.28 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" /tmp/p01-v229-authoritative.cookies
          cp -a production/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v229-authoritative-pre.log 2>&1 &
          echo $! >/tmp/p01-v229-authoritative.pid
          COOKIE=/tmp/p01-v229-authoritative.cookies
          for i in $(seq 1 30); do
            curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/p01-v229-authoritative-setup.html && break || sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v229-authoritative-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=V229 Authoritative Owner' \
            --data-urlencode "admin_password=$ADMIN_PASS" \
            --data-urlencode "admin_password_confirm=$ADMIN_PASS" \
            -o /tmp/p01-v229-authoritative-setup-post.html
          test -f "$ROOT/app/.runtime.php"
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.28.0
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v229-authoritative-evidence/pre-verify.txt | grep -Fx VERIFY_PASS=YES
          echo P01_V229_AUTHORITATIVE_V228_INSTALL=PASS

      - name: Seed representative V2.28 Owner data
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v229-authoritative-seed.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());
          $s=new VfSurfaceRepository(vf_db());
          $start=$r->createCategory(['name'=>'V229 Authority Start','description'=>'','is_private'=>false]);
          $channels=$r->createCategory(['name'=>'V229 Authority Channels','description'=>'','is_private'=>false]);
          $watch=$r->createCategory(['name'=>'V229 Authority Watch','description'=>'','is_private'=>false]);
          $ids=['start_cat'=>$start,'channels_cat'=>$channels,'watch_cat'=>$watch,'favorite'=>0,'channel'=>0,'watch'=>0];
          for($i=1;$i<=10;$i++){
              $x=$r->saveLink(null,['category_id'=>$start,'title'=>'V229 Start '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://v229-start-'.$i.'.example.com','description'=>'preserve','tags'=>'authority','is_private'=>false,'is_favorite'=>$i===1],'manual');
              if($i===1)$ids['favorite']=(int)$x['id'];
          }
          for($i=1;$i<=20;$i++){
              $x=$r->saveLink(null,['category_id'=>$channels,'title'=>'V229 Channel '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://youtube.com/@v229-authority-'.$i,'description'=>'preserve','tags'=>'authority,频道','is_private'=>true],'manual');
              $s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>$i%2===0,'note'=>$i===1?'v229 channel note':'']);
              if($i===1)$ids['channel']=(int)$x['id'];
          }
          $statuses=['want','watching','watched','favorite'];
          for($i=1;$i<=15;$i++){
              $x=$r->saveLink(null,['category_id'=>$watch,'title'=>'V229 Watch '.str_pad((string)$i,2,'0',STR_PAD_LEFT),'url'=>'https://v229-watch-'.$i.'.example.com','description'=>'preserve','tags'=>'authority,影视','is_private'=>true],'manual');
              $s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>2000+$i,'media_status'=>$statuses[($i-1)%4],'note'=>$i===1?'v229 watch note':'']);
              if($i===1)$ids['watch']=(int)$x['id'];
          }
          file_put_contents('/tmp/p01-v229-authoritative-ids.json',json_encode($ids,JSON_THROW_ON_ERROR));
          $p=vf_db();
          if((int)$p->query('SELECT COUNT(*) FROM links')->fetchColumn()!==45)throw new RuntimeException('seed links mismatch');
          if((int)$p->query('SELECT COUNT(*) FROM resource_surface_profiles')->fetchColumn()!==35)throw new RuntimeException('legacy profile count mismatch');
          echo "P01_V229_AUTHORITATIVE_SEED=PASS\n";
          PHP
          php /tmp/p01-v229-authoritative-seed.php | tee /tmp/p01-v229-authoritative-evidence/seed.txt | grep -Fx P01_V229_AUTHORITATIVE_SEED=PASS

      - name: Execute real V2.28 VfUpdateManager remote check prepare install
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/p01-v229-authoritative-update.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/UpdateManager.php';
          $m=new VfUpdateManager(vf_db(),['root'=>$root,'private_root'=>VF_PRIVATE_ROOT,'current_version'=>'2.28.0']);
          $check=$m->check(true);
          if(($check['ok']??false)!==true||($check['current_version']??'')!=='2.28.0'||($check['latest_version']??'')!=='2.29.0'||($check['available']??false)!==true||($check['can_update']??false)!==true){
              throw new RuntimeException('check failed '.json_encode($check,JSON_UNESCAPED_UNICODE));
          }
          $req=$check['requirements']??[];
          if(($req['schema']['current']??'')!=='2026082801'||($req['schema']['from']??'')!=='2026082801'||($req['schema']['target']??'')!=='2026082901'||($req['schema']['ok']??false)!==true){
              throw new RuntimeException('schema compatibility failed '.json_encode($req,JSON_UNESCAPED_UNICODE));
          }
          $prep=$m->prepare();
          if(($prep['ok']??false)!==true||($prep['from_version']??'')!=='2.28.0'||($prep['to_version']??'')!=='2.29.0'||($prep['release_tag']??'')!=='v2.29.0'||($prep['asset_name']??'')!=='VF_Start_V2.29.0_UPDATE.zip'||(int)($prep['update_package_bytes']??0)!==1319081||($prep['update_package_sha256']??'')!=='40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1'){
              throw new RuntimeException('prepare failed '.json_encode($prep,JSON_UNESCAPED_UNICODE));
          }
          foreach(['manifest_identity','release_tag','release_asset','bytes','sha256','atomic_self_test','recovery_point'] as $k){
              if(($prep['checks'][$k]??'')!=='pass')throw new RuntimeException('prepare check '.$k);
          }
          $install=$m->install((string)$prep['operation_id']);
          if(($install['ok']??false)!==true||($install['updated']??false)!==true||($install['from_version']??'')!=='2.28.0'||($install['to_version']??'')!=='2.29.0'){
              throw new RuntimeException('install failed '.json_encode($install,JSON_UNESCAPED_UNICODE));
          }
          foreach(['release_identity','atomic_handoff','activation','cleanup'] as $k){
              if(($install['checks'][$k]??'')!=='pass')throw new RuntimeException('install check '.$k);
          }
          file_put_contents('/tmp/p01-v229-authoritative-evidence/update.json',json_encode(['check'=>$check,'prepare'=>$prep,'install'=>$install],JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V229_AUTHORITATIVE_UPDATE_MANAGER=PASS\n";
          PHP
          php /tmp/p01-v229-authoritative-update.php | tee /tmp/p01-v229-authoritative-evidence/update.txt | grep -Fx P01_V229_AUTHORITATIVE_UPDATE_MANAGER=PASS

      - name: Verify upgraded schema data domains and integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = 2.29.0
          grep -Fx "define('VF_VERSION', '2.29.0');" "$ROOT/app/bootstrap.php" >/dev/null
          php "$ROOT/cli/verify.php" | tee /tmp/p01-v229-authoritative-evidence/post-verify.txt | grep -Fx VERIFY_PASS=YES
          cat >/tmp/p01-v229-authoritative-post.php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('ROOT');
          $ids=json_decode((string)file_get_contents('/tmp/p01-v229-authoritative-ids.json'),true,512,JSON_THROW_ON_ERROR);
          require $root.'/app/bootstrap.php';
          require_once $root.'/app/SurfaceRepository.php';
          $p=vf_db();
          $integrity=strtolower((string)$p->query('PRAGMA integrity_check')->fetchColumn());
          $fk=$p->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);
          $schema=(string)$p->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn();
          if($integrity!=='ok'||count($fk)!==0||$schema!=='2026082901')throw new RuntimeException('database verification failed');
          if((int)$p->query('SELECT COUNT(*) FROM links')->fetchColumn()!==45)throw new RuntimeException('link count');
          if((int)$p->query('SELECT COUNT(*) FROM resource_surface_profiles')->fetchColumn()!==35)throw new RuntimeException('legacy profile count');
          if((int)$p->query('SELECT COUNT(*) FROM resource_domain_profiles')->fetchColumn()!==35)throw new RuntimeException('domain profile migration count');
          if((int)$p->query('SELECT COUNT(*) FROM resource_asset_files')->fetchColumn()!==0)throw new RuntimeException('asset file initial count');
          $q=$p->prepare('SELECT is_favorite FROM links WHERE id=?');$q->execute([(int)$ids['favorite']]);if((int)$q->fetchColumn()!==1)throw new RuntimeException('favorite lost');
          $q=$p->prepare('SELECT domain_key,note FROM resource_domain_profiles WHERE link_id=?');
          $q->execute([(int)$ids['channel']]);$x=$q->fetch(PDO::FETCH_ASSOC);if(($x['domain_key']??'')!=='channels'||($x['note']??'')!=='v229 channel note')throw new RuntimeException('channel migration');
          $q->execute([(int)$ids['watch']]);$x=$q->fetch(PDO::FETCH_ASSOC);if(($x['domain_key']??'')!=='watch'||($x['note']??'')!=='v229 watch note')throw new RuntimeException('watch migration');
          $s=new VfSurfaceRepository($p);
          $counts=$s->counts(true);
          foreach(['start'=>10,'channels'=>20,'watch'=>15,'topics'=>0,'total'=>45] as $k=>$v){if((int)($counts[$k]??-1)!==$v)throw new RuntimeException('surface count '.$k);}
          $r=new VfRepository($p);
          $topic=$r->saveLink(null,['category_id'=>(int)$ids['start_cat'],'title'=>'V229 Post Upgrade Topic','url'=>'https://v229-topic.example.com','description'=>'post-upgrade topic','tags'=>'authority,专题','is_private'=>true,'is_favorite'=>false],'manual');
          $s->upsertProfile((int)$topic['id'],['surface'=>'topics','resource_kind'=>'专题','source_kind'=>'remote_url','source_ref'=>'https://v229-topic.example.com']);
          $topics=$s->collection('topics',true);
          if((int)$topics['count']!==1||(int)($topics['links'][0]['id']??0)!==(int)$topic['id'])throw new RuntimeException('post-upgrade topics capability');
          $integrity2=strtolower((string)$p->query('PRAGMA integrity_check')->fetchColumn());
          $fk2=$p->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC);
          if($integrity2!=='ok'||count($fk2)!==0)throw new RuntimeException('post mutation integrity');
          $out=['integrity'=>$integrity,'foreign_key_errors'=>count($fk),'schema'=>$schema,'links_before_post_mutation'=>45,'legacy_profiles'=>35,'domain_profiles'=>35,'asset_files'=>0,'counts_before_post_mutation'=>$counts,'topics_after_post_mutation'=>(int)$topics['count'],'post_integrity'=>$integrity2,'post_foreign_key_errors'=>count($fk2)];
          file_put_contents('/tmp/p01-v229-authoritative-evidence/post.json',json_encode($out,JSON_PRETTY_PRINT|JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES));
          echo "P01_V229_AUTHORITATIVE_DATA_SCHEMA=PASS\n";
          PHP
          php /tmp/p01-v229-authoritative-post.php | tee /tmp/p01-v229-authoritative-evidence/post.txt | grep -Fx P01_V229_AUTHORITATIVE_DATA_SCHEMA=PASS

      - name: HTTP smoke after remote upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          if test -f /tmp/p01-v229-authoritative.pid; then kill "$(cat /tmp/p01-v229-authoritative.pid)" || true; fi
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v229-authoritative-post-http.log 2>&1 &
          echo $! >/tmp/p01-v229-authoritative.pid
          for i in $(seq 1 30); do curl -fsS "http://127.0.0.1:${PORT}/start.php" -o /tmp/p01-v229-authoritative-start.html && break || sleep 1; done
          grep -F '2.29.0' /tmp/p01-v229-authoritative-start.html >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/channels.php" -o /tmp/p01-v229-authoritative-channels.html
          curl -fsS "http://127.0.0.1:${PORT}/watch.php" -o /tmp/p01-v229-authoritative-watch.html
          curl -fsS "http://127.0.0.1:${PORT}/topics.php" -o /tmp/p01-v229-authoritative-topics.html
          cp /tmp/p01-v229-authoritative-start.html /tmp/p01-v229-authoritative-evidence/start.html
          echo P01_V229_AUTHORITATIVE_HTTP=PASS

      - name: Final authoritative verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/p01-v229-authoritative-evidence/verdict.txt <<EOF
          SOURCE_VERSION=2.28.0
          TARGET_VERSION=2.29.0
          SOURCE_SCHEMA=$SOURCE_SCHEMA
          TARGET_SCHEMA=$TARGET_SCHEMA
          FORMAL_SOURCE=$FORMAL_SOURCE
          FORMAL_TREE=$FORMAL_TREE
          CORE_UPDATES_MAIN=$CORE_UPDATES_MAIN
          RELEASE_ID=$RELEASE_ID
          UPDATE_SHA256=$UPDATE_SHA
          UPDATE_BYTES=$UPDATE_BYTES
          P01_V228_TO_V229_REMOTE_ONLINE_UPDATE_GATE=PASS
          P01_V229_READY_FOR_OWNER_PRODUCTION_UPGRADE=YES
          OWNER_PRODUCTION_WRITE=NO
          EOF
          cat /tmp/p01-v229-authoritative-evidence/verdict.txt

      - name: Upload authoritative evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v229-remote-online-update-evidence
          path: /tmp/p01-v229-authoritative-evidence
          if-no-files-found: error
          retention-days: 30
