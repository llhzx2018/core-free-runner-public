name: P07 M03 D04 failed migration UX exact-source safe proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-failed-task-ux-proof-20261119.yml'
permissions:
  contents: read
jobs:
  exact-source-ux:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Checkout public workflow only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: f45765a8383132a6e546097f453fa26bd579f2f0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .product
      - name: Checkout GOV architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov
      - name: Exact SHA, standalone Bash syntax and actual mocked-backend user flows
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .product rev-parse HEAD)" = f45765a8383132a6e546097f453fa26bd579f2f0
          mkdir -m 0700 -p "$RUNNER_TEMP/p07-d04-ux"
          cd .product
          bash -n bin/vfops-migrate-ui components/p07-m03-failed-task-ux.sh
          if ! python3 -B -m unittest discover -s tests -p 'test_p07_m03_failed_task_ux.py' -v \
            > "$RUNNER_TEMP/p07-d04-ux/focused.log" 2>&1; then
            grep -E '^(test_[a-zA-Z0-9_]+ |FAIL: test_|ERROR: test_|AssertionError:|Ran [0-9]+ tests|FAILED )' \
              "$RUNNER_TEMP/p07-d04-ux/focused.log" | cut -c1-200 || true
            echo P07_M03_D04_FAILED_TASK_FOCUSED=FAIL
            exit 13
          fi
          grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/p07-d04-ux/focused.log" | cut -c1-160 || true
          echo P07_M03_D04_FAILED_TASK_FOCUSED=PASS
      - name: UX V3 seven scenario evidence, module ownership and architecture/naming
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .product
          base=55e1d4c3c5087883700a2abea8eda2a7057e73cf
          head=f45765a8383132a6e546097f453fa26bd579f2f0
          test "$(git merge-base "$base" HEAD)" = "$base"
          python3 -B scripts/check_p07_terminal_ux.py --module P07-M03-D04 \
            --base-ref "$base" --evidence-file docs/ux-reviews/p07-m03-d04-failed-task-20261119.json \
            > "$RUNNER_TEMP/p07-d04-ux/ux.log" 2>&1 || {
              grep -E '(BLOCKED|FAIL|ERROR)' "$RUNNER_TEMP/p07-d04-ux/ux.log" | cut -c1-240 || true
              exit 13
            }
          grep -E 'P07_TERMINAL_UX_DOC_CONTRACT=PASS|PR_UX_EVIDENCE=STRUCTURAL_PASS' \
            "$RUNNER_TEMP/p07-d04-ux/ux.log" | cut -c1-220 || true
          python3 -B scripts/check_p07_modules.py --module P07-M03-D04 \
            --base-ref "$base" --affected P07-M03-D04 \
            --shared-reason 'D04 status-only terminal source component' \
            --ux-evidence-file docs/ux-reviews/p07-m03-d04-failed-task-20261119.json \
            > "$RUNNER_TEMP/p07-d04-ux/modules.log" 2>&1 || {
              grep -E '(BLOCKED|FAIL|ERROR)' "$RUNNER_TEMP/p07-d04-ux/modules.log" | cut -c1-240 || true
              exit 13
            }
          grep 'P07_MODULE_SCOPE=PASS' "$RUNNER_TEMP/p07-d04-ux/modules.log" | cut -c1-220 || true
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.gov --base-sha "$base" --head-sha "$head" \
            --git-root . > "$RUNNER_TEMP/p07-d04-ux/arch.log" 2>&1 || {
              grep -E '(BLOCKED|FAIL|ERROR|ARCH_)' "$RUNNER_TEMP/p07-d04-ux/arch.log" | cut -c1-240 || true
              exit 13
            }
          echo P07_M03_D04_ARCHITECTURE_AND_NAMING=PASS
      - name: Existing terminal UX and failed-prepare read-only regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .product
          for name in test_p07_terminal_ux_contract.py test_migration_failed_prepare_audit.py; do
            if ! python3 -B -m unittest discover -s tests -p "$name" -q \
              > "$RUNNER_TEMP/p07-d04-ux/$name.log" 2>&1; then
              grep -E '^(FAIL: test_|ERROR: test_|AssertionError:|Ran [0-9]+ tests|FAILED )' \
                "$RUNNER_TEMP/p07-d04-ux/$name.log" | cut -c1-160 || true
              echo "P07_M03_D04_EXISTING_REGRESSION=FAIL $name"
              exit 13
            fi
            grep -E '^Ran [0-9]+ tests|^OK$' "$RUNNER_TEMP/p07-d04-ux/$name.log" | cut -c1-160 || true
          done
          echo P07_M03_D04_EXISTING_READONLY_AND_UX_REGRESSION=PASS
      - name: Erase transient private source and all test artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- .product .gov "$RUNNER_TEMP/p07-d04-ux"
          echo P07_M03_D04_PRIVATE_SOURCE_AND_TEST_ARTIFACT_CLEANUP=PASS
