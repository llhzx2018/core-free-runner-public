name: P01 V2.27 Release Source Prepare
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-release-source-prepare-20260828.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: release/p01-v2.27.0-20260828
      DEVELOP: d26f9f0e03b49365ffd0b6307d8071c122e79904
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 2
          persist-credentials: true
      - name: Prepare immutable release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$DEVELOP"
          test "$(cat VERSION)" = '2.27.0'
          test "$(cat src/VERSION.txt)" = '2.27.0'
          grep -F "define('VF_VERSION', '2.27.0');" src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          marker='## V2.27.0 · Formal Release · 2026-08-28'
          assert marker not in s
          entry='''## V2.27.0 · Formal Release · 2026-08-28\n\n- 将 V2.26 单工作区从“可浏览收藏库”推进为完整日常工作区：新增、详情/编辑、收藏、打开、批量操作均留在同一工作区。\n- 新增同工作区 Add Modal、右侧 Detail/Edit Drawer、多选与批量 Surface/分类/收藏/归档。\n- 全部收藏 / Start / Channels / Watch / 待整理统一支持真实筛选计数、分页、排序、列表/卡片与密度控制；Channels / Watch 保留各自资源语义。\n- 权限、CSRF、匿名 Public Start 隔离、URL Identity、Sparse Surface Profile、Atomic Update 与 Schema `2026082801` 均保持原合同。\n- Runtime/Mutation Gate `33167109754`、Screenshot Audit `33167194981`、Final Exact Head Gate `33178564469`、Develop Exact Gate `33178996228` PASS。\n\n'''
          p.write_text(entry+s,encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -Fx CHANGELOG.md
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          git commit -m 'P01 V2.27: formal release identity'
          SHA=$(git rev-parse HEAD); TREE=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:$BRANCH"
          echo P01_V227_RELEASE_SOURCE=$SHA
          echo P01_V227_RELEASE_TREE=$TREE
          echo P01_V227_RELEASE_SOURCE_PREPARE=PASS
          echo SCHEMA_CHANGE=NO
          echo PRODUCTION=NO
