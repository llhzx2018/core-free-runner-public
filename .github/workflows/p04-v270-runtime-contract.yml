name: P04 V2.7 Runtime Real Data Contract
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-runtime-contract.yml]
permissions:
  contents: write
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - name: Contract
        shell: bash
        run: |
          set +e
          result=/tmp/runtime-contract.json
          cd private
          status=PASS; failed='[]'
          fail(){ status=FAIL; failed=$(jq -c --arg x "$1" '.+[$x]' <<<"$failed"); }
          find . -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null || fail PHP_SYNTAX
          node --check public/assets/v270-app.js >/dev/null || fail JS_SYNTAX
          test "$(tr -d '\r\n' < VERSION)" = '2.7.0' || fail VERSION
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 14 || fail SCHEMA_14
          runtime=(public/index.php public/experience.php public/assets/v270-app.js src/app/Core/GlobalSearchService.php src/app/Core/PersonalInfraExperienceService.php src/app/Core/PersonalInfraTodayTrait.php src/app/Core/PersonalInfraMoneyTrait.php src/app/Core/PersonalInfraPortfolioTrait.php src/app/Core/PersonalInfraDomainTrait.php src/app/Core/PersonalInfraInfraTrait.php src/app/Core/PersonalInfraSupportTrait.php)
          for needle in '今天有 3 件事' 'USD 36.40' 'USD 46.20' 'USD 82.19' 'Tokyo-01' 'forgenoce.net'; do grep -Fq "$needle" "${runtime[@]}" && fail "HARDCODE:$needle"; done
          grep -Fq 'Auth::requireAuth' public/experience.php || fail ADMIN_AUTH
          grep -Fq '$method !==' public/experience.php && grep -Fq "'GET'" public/experience.php || fail GET_ONLY
          if grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|VACUUM|ATTACH|DETACH)\b' src/app/Core/PersonalInfraExperienceService.php src/app/Core/PersonalInfraTodayTrait.php src/app/Core/PersonalInfraMoneyTrait.php src/app/Core/PersonalInfraPortfolioTrait.php src/app/Core/PersonalInfraDomainTrait.php src/app/Core/PersonalInfraInfraTrait.php src/app/Core/PersonalInfraSupportTrait.php src/app/Core/GlobalSearchService.php; then fail READ_ONLY_SERVICE; fi
          jq -n --arg status "$status" --argjson failed "$failed" '{status:$status,version:"2.7.0",schema:14,migration:"NONE",admin_auth:true,get_only:true,fixture_hardcode:false,experience_write_sql:false,failed:$failed}' > "$result"
          exit 0
      - name: Publish
        shell: bash
        run: |
          mkdir -p evidence;cp /tmp/runtime-contract.json evidence/p04-v270-runtime-contract.json
          rm -f evidence/p04-v270-runtime-contract.PASS
          if jq -e '.status=="PASS" and .version=="2.7.0" and .schema==14 and .migration=="NONE" and .admin_auth==true and .get_only==true and .fixture_hardcode==false and .experience_write_sql==false' evidence/p04-v270-runtime-contract.json >/dev/null;then printf 'P04_V270_RUNTIME_REAL_DATA_CONTRACT_PASS\n' > evidence/p04-v270-runtime-contract.PASS;fi
          rm -rf private /tmp/runtime-contract.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add -A evidence/p04-v270-runtime-contract.*;git commit -m 'evidence(P04): V2.7 runtime real-data contract' || exit 0;git push origin HEAD:p04-v270-integration-gate
