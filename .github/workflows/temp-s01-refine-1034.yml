name: S01-C02 1.21.1036 keyword map candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_refine
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      TARGET_VERSION: 1.21.1036
      TARGET_SHA: 3af43cff372b1f3108ed6624ccea3a027346191c
      TARGET_TREE: 798fe2770ef038f9b85c4e50d1f9138453cb0a9d
      BASE_SHA: cb1a8f949c8a67cc4c48c52ee04f154ed86a768a
      BASE_VERSION: 1.21.1035
      BASE_ASSET_SHA256: 671f78da5206c9ccab23d79711208e460589c696719f617f1eea435907adfc3c
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3af43cff372b1f3108ed6624ccea3a027346191c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: cb1a8f949c8a67cc4c48c52ee04f154ed86a768a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium
      - name: Exact source identity and keyword functional regression
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(cat target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211036-keyword-map-ux-contract.php
          php target/tests/s01-c02-121994-keyword-map-mature-ui-contract.php
          php target/tests/s01-c02-121995-keyword-research-mature-ui-contract.php
          php target/tests/s01-c02-1211004-keyword-reading-scale-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          diff -rq baseline/includes/wp-update target/includes/wp-update
          diff -q baseline/includes/seo-data/keyword-map-service.php target/includes/seo-data/keyword-map-service.php
          diff -q baseline/includes/seo-data/keyword-research-service.php target/includes/seo-data/keyword-research-service.php
          diff -q baseline/assets/js/admin-o8-keywords.js target/assets/js/admin-o8-keywords.js
          grep -F "vf_ops_keyword_map_unassign_v121441" target/includes/seo-data/keyword-map-service.php >/dev/null
          grep -F "vf_ops_keyword_map_export_v121441" target/includes/seo-data/keyword-map-service.php >/dev/null
          grep -F "vf_ops_keyword_map_validate_record_v121441" target/includes/seo-data/keyword-map-service.php >/dev/null
          grep -F "vf_ops_keyword_assignment_import_v121440" target/includes/seo-data/keyword-research-service.php >/dev/null
          grep -F "vf_ops_keyword_assignment_save_ajax_v121698" target/includes/seo-data/keyword-research-service.php >/dev/null
          grep -F "vf_ops_keyword_assignment_decide_ajax_v121698" target/includes/seo-data/keyword-research-service.php >/dev/null
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/s01-1036-php-lint.txt
          echo KEYWORD_FUNCTIONAL_SOURCE_CONTRACT=PASS
          echo PHP_83_SYNTAX=PASS
      - name: Browser dependencies and keyword workspace proof
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/keyword-node && cd /tmp/keyword-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/keyword-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211036-keyword-map-browser-proof.js > evidence/keyword-browser.json
          cat evidence/keyword-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/keyword-browser.json
          echo KEYWORD_BROWSER=PASS
      - name: Exact package, current channel and package security
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V$TARGET_VERSION.zip" candidate.zip
          gh release download "v$BASE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-ops_V$BASE_VERSION.zip" --dir previous
          cp "previous/vf-tools-ops_V$BASE_VERSION.zip" baseline.zip
          test "$(sha256sum baseline.zip | cut -d' ' -f1)" = "$BASE_ASSET_SHA256"
          gh api -H 'Accept: application/vnd.github.raw+json' repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main > channel.json
          jq -e --arg v "$BASE_VERSION" '.enabled==true and .target_version==$v' channel.json >/dev/null
          cp package.json evidence/package.json
          python3 - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('candidate.zip') as z:
              assert z.testzip() is None
              for n in z.namelist():
                  assert n.startswith('vf-ops/') and '..' not in n.split('/'),n
                  assert not re.search(r'(^|/)(?:\.env|\.git|tests?|docs?|evidence|private|backups?)(/|$)',n,re.I),n
                  assert not re.search(rb'(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)',z.read(n)),n
          print('PACKAGE_CRC_PRIVACY_SECRET=PASS')
          PY
      - name: Native WordPress install and rollback
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/s01-keyword-1036"
          WP="$TASK_ROOT/wordpress"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }
          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_refine --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18094 --title='Keyword Candidate Fixture' --admin_user=admin --admin_password='Fixture-Keyword-Only!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --activate >/dev/null
          wp option update vf_ops_keyword_candidate_fixture preserve >/dev/null
          wp eval 'if(VF_OPS_VERSION!==getenv("BASE_VERSION"))throw new RuntimeException("BASE_VERSION");echo "BASELINE_RUNTIME=PASS\n";'
          wp plugin install "$GITHUB_WORKSPACE/candidate.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!==getenv("TARGET_VERSION"))throw new RuntimeException("TARGET_VERSION");if(get_option("vf_ops_keyword_candidate_fixture")!=="preserve")throw new RuntimeException("STATE_CHANGED");echo "CANDIDATE_INSTALL_READBACK=PASS\n";'
          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!==getenv("BASE_VERSION"))throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_keyword_candidate_fixture")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");echo "ROLLBACK=PASS\n";'
      - name: Public-safe exact keyword candidate proof
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          p=json.loads(Path('package.json').read_text())
          rows=[]
          for item in subprocess.check_output(['git','-C','target','ls-files','-z']).split(b'\0'):
              if not item: continue
              name=item.decode();f=Path('target')/name
              if f.is_file(): rows.append((name,hashlib.sha256(f.read_bytes()).hexdigest()))
          h=hashlib.sha256()
          for name,digest in rows:h.update((name+'\0'+digest+'\n').encode())
          proof={
            'schema':'vf-s01-keyword-map-proof/v1','status':'PASS',
            'source_repository':os.environ['TARGET_REPO'],'source_sha':os.environ['TARGET_SHA'],'source_tree':os.environ['TARGET_TREE'],
            'source_manifest_sha256':h.hexdigest(),'version':os.environ['TARGET_VERSION'],'base_version':os.environ['BASE_VERSION'],
            'package':p,'php_83_syntax':'PASS','functional_source_contract':'PASS','keyword_browser':'PASS',
            'candidate_install':'PASS','rollback':'PASS','owner_product_pass':False,'production':'NOT_TOUCHED'
          }
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          PY
      - name: Evidence and exact tested package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1036-keyword-map-candidate
          path: |
            candidate.zip
            package.json
            evidence/keyword-browser.json
            evidence/FINAL_EVIDENCE.json
          retention-days: 30
