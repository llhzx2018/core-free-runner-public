name: P07 M02 independent VPS audit exact-source native smoke
on:
  push:
    branches: [feat/p07-m02-independent-20261112]
  pull_request:
    branches: [feat/p07-toolbox-m05-isolated-20261112]
permissions:
  contents: read
jobs:
  standalone-m02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Native candidate module install/upgrade/refuse tamper and four-module unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash -n installers/p07-toolbox.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_m02_independent.py' -v
          sudo env P07_M02_HOSTED_NATIVE_TEST=1 python3 -B -m unittest discover -s tests -p 'test_p07_m02_independent.py' -v
          echo P07_M02_NATIVE_IMMUTABLE_INSTALL=PASS
          echo P07_M01_M03_M04_M05_UNCHANGED=PASS_SYNTHETIC
          echo P07_FORMAL_RELEASE=NO
