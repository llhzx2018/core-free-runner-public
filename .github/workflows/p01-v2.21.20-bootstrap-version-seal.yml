name: P01 V2.21.20 Bootstrap Version Seal
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-bootstrap-version-seal.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PUB: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Exact bootstrap version seal
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,json,base64,urllib.request
          token=os.environ['W'];repo='llhzx2018/vf-start';branch='maintenance/sidebar-density-2.21.20-20260819';expected='a97c1bcc2c42d089fede9209844560bdefa07e9d';path='src/app/bootstrap.php'
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:return json.load(r)
          ref=get(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}');head=ref['object']['sha'];
          if head!=expected:raise SystemExit(f'HEAD_DRIFT {head}')
          for p in ['VERSION','src/VERSION.txt']:
            f=get(f'https://api.github.com/repos/{repo}/contents/{p}?ref={branch}');raw=base64.b64decode(f['content']).decode().strip();
            if raw!='2.21.20':raise SystemExit(f'{p}={raw}')
          f=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}');raw=base64.b64decode(f['content']).decode();old="define('VF_VERSION', '2.21.19');";new="define('VF_VERSION', '2.21.20');"
          if raw.count(old)!=1 or new in raw:raise SystemExit('VERSION_ANCHOR_MISMATCH')
          body={'message':'chore(P01): set bootstrap version to 2.21.20','content':base64.b64encode(raw.replace(old,new,1).encode()).decode(),'sha':f['sha'],'branch':branch}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:out=json.load(r)
          nh=out['commit']['sha'];open('/tmp/head','w').write(nh);print('V22120_BOOTSTRAP_SEAL_PASS',nh)
          PY
      - name: Publish
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          try:h2=open('/tmp/head').read().strip()
          except:h2=''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','gate':'BOOTSTRAP_VERSION_SEAL','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_after':h2,'workflow_run_id':os.environ['RID'],'production_changed':False};c=json.dumps(q,indent=2)+'\n';t=os.environ['PUB'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-BOOTSTRAP-VERSION-SEAL.json';hdr={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=hdr)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): V2.21.20 bootstrap seal','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**hdr,'Content-Type':'application/json'})).read()
          PY
