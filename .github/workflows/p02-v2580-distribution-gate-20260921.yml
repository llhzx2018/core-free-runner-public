name: P02 V2.5.80 Distribution Gate

on:
  push:
    branches:
      - task/p02-v2580-distribution-gate-20260921
    paths:
      - '.github/workflows/p02-v2580-distribution-gate-20260921.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: b702874c31de6490e7371062ee73d3936a1d950d
          persist-credentials: false
          fetch-depth: 1
          path: core-updates

      - name: Verify exact identity
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "b702874c31de6490e7371062ee73d3936a1d950d"
          echo P02_V2580_DISTRIBUTION_EXACT_SOURCE=PASS

      - name: Manifest Contract Audit
        working-directory: core-updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax checks
        working-directory: core-updates
        run: |
          php -v
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Update Core V1 regression
        working-directory: core-updates
        run: php update-core/php/tests/run.php

      - name: P02 exact distribution receipt
        working-directory: core-updates
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open("projects/P02.json",encoding="utf-8"))
          assert p["target_version"]=="2.5.80"
          assert p["current_version"]=="2.5.54"
          assert p["from_versions"]==["2.5.53","2.5.54"]
          assert p["release_tag"]=="v2.5.80"
          assert p["release_id"]==392781463
          assert p["product_identity"]=="01c6915a9843089064b539bb4811c70d993b9b8d"
          assert p["asset_name"]=="VF_Library_V2.5.80_UPDATE.zip"
          assert p["asset_bytes"]==406086
          assert p["asset_sha256"]=="0d1f95c20b2051bc3113905e8297895cdeb85d6130662caf45fc6c135769b245"
          assert p["schema_from"]=="2401" and p["schema_to"]=="2401"
          print("P02_V2580_DISTRIBUTION_MANIFEST=PASS")
          PY
          echo P02_V2580_DISTRIBUTION_GATE=PASS
