name: P01 V2.36.4 Strict Fresh Formal
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-strict-fresh-formal-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33520819304'
      FORMAL_ARTIFACT: p01-v2364-formal-artifacts-r4-33520819304
      FORMAL_ARTIFACT_ID: '9805594341'
      FORMAL_ARTIFACT_DIGEST: sha256:3fd26ca5c07f43955566466501b8f2232e80974f96588ff5a01d19963c03ac4f
      FORMAL: 6b321422bce5a834521786d8233149c7624aa014
      FORMAL_TREE: 86c01bf1b5ee7c3ad3954e6ab9485734cb744d05
      FORMAL_RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      PREDECESSOR: 718e043e3715ef7b21849bc08634fca89bf92c1f
      SCHEMA: '2026082901'
      STRICT_FRESH_R1_RUN: '33521261722'
      FULL_BYTES: '587272'
      FULL_SHA: 552e3a0dc4de3e782de27dfa71943ca69a28ee5169b4aed33a221a45704c6a24
      UPDATE_BYTES: '1237066'
      UPDATE_SHA: ebb746554c95abb9f2fa77ce8ac6f41c280016c66e03f331149fd1d93370958b
      REPAIR_BYTES: '3592809'
      REPAIR_SHA: cdd7cefb0a4361f7e65fc2849156355e9b5a78401a862e9f74a9c64f817c44ee
      DOWNLOAD: /tmp/p01-v2364-strict-download
      FRESH: /tmp/p01-v2364-strict-fresh
      EVID: /tmp/p01-v2364-strict-evidence
      COOKIE: /tmp/p01-v2364-strict.cookies
      PORT: '18594'
      ADMIN_PASS: P01V2364StrictFormal2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Checkout exact anonymous grid browser harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 95fa7dbcc6c9eb5869412a88bdc58382870abebe
          path: gridhelper
      - name: Formal artifact live evidence and fresh install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"
          mkdir -p "$DOWNLOAD" "$FRESH" "$EVID/screens"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_FRESH_R1_RUN --jq .conclusion)" = failure
          LIVE_DIGEST=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN/artifacts --jq ".artifacts[] | select(.id==$FORMAL_ARTIFACT_ID) | .digest")
          test "$LIVE_DIGEST" = "$FORMAL_ARTIFACT_DIGEST"
          EXPIRED=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN/artifacts --jq ".artifacts[] | select(.id==$FORMAL_ARTIFACT_ID) | .expired")
          test "$EXPIRED" = false
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.4-FULL.zip' -print -quit); test -n "$FULL"
          ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          test "$(stat -c%s "$ART_DIR/VF-Start-V2.36.4-FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$ART_DIR/VF-Start-V2.36.4-FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$ART_DIR/VF_Start_V2.36.4_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$ART_DIR/VF_Start_V2.36.4_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(stat -c%s "$ART_DIR/repair-v2.36.4.php")" = "$REPAIR_BYTES"
          test "$(sha256sum "$ART_DIR/repair-v2.36.4.php" | awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="6b321422bce5a834521786d8233149c7624aa014" and .formal_tree=="86c01bf1b5ee7c3ad3954e6ab9485734cb744d05" and .runtime_tree=="e1ee914a6d9e61bac7931b1f5363a8c7e24e925a" and .schema=="2026082901" and .migration==null and .added==[] and .removed==[] and (.changed==["VERSION.txt","app/bootstrap.php","assets/workspace-domain-nav.css"])' "$ART_DIR/P01-V2.36.4-ARTIFACT-GATE.json" >/dev/null
          printf 'STRICT_FRESH_R1_CLASSIFICATION=HARNESS_ONLY_STALE_FORMAL_STATUS_ASSERTION\n' | tee "$EVID/r1-classification.txt"
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" "$FRESH/app/bootstrap.php" >/dev/null
          grep -F 'background:var(--ws-bg)' "$FRESH/assets/workspace-domain-nav.css" >/dev/null
          grep -F '.surface-start .vf-asset-row:not(:has(> .vf-asset-select)){grid-template-columns:32px minmax(0,1fr) auto}' "$FRESH/assets/workspace-domain-nav.css" >/dev/null
          grep -F '.surface-channels .vf-asset-row:not(:has(> .vf-asset-select)){grid-template-columns:46px minmax(0,1fr) auto}' "$FRESH/assets/workspace-domain-nav.css" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >"$EVID/js-syntax.txt"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2364-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V2.36.4 Strict Formal' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          P01_ROOT="$FRESH" php gridhelper/scripts/p01_anonymous_grid_seed.php | tee "$EVID/grid-seed.txt"
          grep -Fx P01_ANONYMOUS_GRID_SEED=PASS "$EVID/grid-seed.txt"
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Formal anonymous authenticated logout grid browser gate 390 1319 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile gridhelper/scripts/p01_anonymous_grid_gate.py
          python gridhelper/scripts/p01_anonymous_grid_gate.py | tee "$EVID/grid-browser.txt"
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
      - name: Final fresh runtime privacy SQLite and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          for route in start.php channels.php watch.php topics.php; do
            curl -fsS "http://127.0.0.1:$PORT/$route" -o "$EVID/anonymous-${route%.php}.html"
          done
          ! grep -R -F '管理员视角' "$EVID"/anonymous-*.html
          ! grep -R -F '公开视角' "$EVID"/anonymous-*.html
          ! grep -R -F '查看公开版' "$EVID"/anonymous-*.html
          ! grep -R -F '返回管理' "$EVID"/anonymous-*.html
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/db-final.txt"
          <?php
          require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();
          if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(1);
          if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(2);
          echo "INTEGRITY=ok\nFK=0\n";
          PHP
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
          printf 'P01_V2364_STRICT_FRESH_FORMAL_R2=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nPREDECESSOR=%s\nSCHEMA=%s\nFORMAL_RUN=%s\nFORMAL_ARTIFACT=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nANONYMOUS_GRID_390_1319_1440=PASS\nLOGIN_LOGOUT=PASS\nONE_FRONTEND=PASS\nPRIVACY=PASS\nSQLITE=PASS\nR1_FAILURE=HARNESS_ONLY_STALE_FORMAL_STATUS_ASSERTION\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$PREDECESSOR" "$SCHEMA" "$FORMAL_RUN" "$FORMAL_ARTIFACT_ID" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-strict-fresh-formal-r2-${{ github.run_id }}
          path: /tmp/p01-v2364-strict-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2364-strict.pid 2>/dev/null)" 2>/dev/null || true
