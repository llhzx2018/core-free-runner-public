name: TEMP S01-C02 Ops 1.21.796 Formal Release

on:
  push:
    branches:
      - temp/s01-c02-v121796-formal-release-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121796-formal-release.yml'

permissions:
  contents: read
  actions: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_COMMIT: 86e0664f193a6d76198e55756c938c64672416db
  TARGET_TREE: 80ff35a0bec2ef0c7fd499dab8af249082db240e
  GATE_CANDIDATE_COMMIT: e93db40d34f1904fa0dde2fda8fe4382fb876196
  GATE_CANDIDATE_TREE: 80ff35a0bec2ef0c7fd499dab8af249082db240e
  BASE_RELEASE_COMMIT: 0397b2524049b9b382f760f7b31e36ff66d908f1
  BASE_RUNTIME_FILES: '891'
  BASE_RUNTIME_FP: 5a30855fc101fc9975004e8af7ee68e559b2f9522dfce02de7283808f38cffd4
  BASE_ASSET_BYTES: '3185592'
  BASE_ASSET_SHA256: 67d4ad57fc688caf50a8adfb62d4dacc19d292bc3a23544171b2a69083d682e3
  CANDIDATE_GATE_RUN: '33807429865'
  CANDIDATE_GATE_RUNNER_SHA: 878137059aff173a9e19d9274326e4efc6cc3412
  VERSION: 1.21.796
  TAG: v1.21.796
  RELEASE_NAME: VF Tools Ops V1.21.796
  ASSET_NAME: vf-tools-ops_V1.21.796.zip
  EVIDENCE_DIR: /tmp/s01-c02-v121796-formal-release

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'RELEASE_CREDENTIALS=PASS'

      - name: Verify exact Candidate Gate PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${CANDIDATE_GATE_RUN}")"
          test "$(jq -r '.status' <<<"$JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$JSON")" = success
          test "$(jq -r '.head_sha' <<<"$JSON")" = "$CANDIDATE_GATE_RUNNER_SHA"
          printf '%s\n' "$JSON" > "$EVIDENCE_DIR/candidate-gate-run.json"
          echo 'CONTENT_WORKFLOW_CANDIDATE_GATE=PASS'

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 86e0664f193a6d76198e55756c938c64672416db
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify source identity, tested tree, and bounded scope
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$TARGET_TREE" = "$GATE_CANDIDATE_TREE"
          test "$(git -C ops rev-parse ${GATE_CANDIDATE_COMMIT}^{tree})" = "$GATE_CANDIDATE_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.796' ops/vf-ops.php
          MAIN_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/main")"
          test "$(jq -r '.commit.sha' <<<"$MAIN_JSON")" = "$TARGET_COMMIT"
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort > "$EVIDENCE_DIR/changed-files.txt"
          cat > /tmp/expected-files.txt <<'EOF'
          .github/phase3/v121796-content-workflow-contract-reconciliation.php
          VERSION
          VF_PROJECT.json
          docs/evidence/S01_C02_PRODUCTION_1_21_795_PLUGIN_GOVERNANCE_EVIDENCE.md
          includes/content-workflow/contract.php
          includes/content-workflow/migration.php
          includes/content-workflow/repository.php
          vf-ops.php
          EOF
          diff -u /tmp/expected-files.txt "$EVIDENCE_DIR/changed-files.txt"
          echo 'SOURCE_IDENTITY_TESTED_TREE_AND_SCOPE=PASS'

      - name: Run focused source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/content-workflow/contract.php
          php -l ops/includes/content-workflow/repository.php
          php -l ops/includes/content-workflow/migration.php
          php -l ops/vf-ops.php
          php -l ops/.github/phase3/v121796-content-workflow-contract-reconciliation.php
          php ops/.github/phase3/v121796-content-workflow-contract-reconciliation.php | tee "$EVIDENCE_DIR/content-workflow-contract.txt"
          grep -Fxq 'PASS_V121796_CONTENT_WORKFLOW_CONTRACT_RECONCILIATION' "$EVIDENCE_DIR/content-workflow-contract.txt"
          echo 'FOCUSED_SOURCE_CONTRACTS=PASS'

      - name: Calibrate 1.21.795 package and build exact 1.21.796 artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          mkdir -p /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          git -C ops archive "$BASE_RELEASE_COMMIT" | tar -x -C /tmp/base-source
          git -C ops archive "$TARGET_COMMIT" | tar -x -C /tmp/candidate-source
          python3 - <<'PY'
          import re, shutil, hashlib, zipfile, json, os
          from pathlib import Path

          def runtime_files(root_path, out_path):
              root=Path(root_path); out=Path(out_path); files={}
              def ok(rel):
                  p=rel.as_posix(); parts=p.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
                  if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
                  return parts[0] in {'includes','assets','languages','config'}
              for src in root.rglob('*'):
                  if src.is_file() and not src.is_symlink():
                      rel=src.relative_to(root)
                      if ok(rel):
                          dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
                          files[rel.as_posix()]=src.read_bytes()
              return dict(sorted(files.items()))

          def identity(files):
              fp=hashlib.sha256()
              for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(files),fp.hexdigest()

          def build_zip(files,zpath):
              zpath=Path(zpath)
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in files.items():
                      zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,3,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest()

          base=runtime_files('/tmp/base-source','/tmp/base-runtime')
          base_count,base_fp=identity(base)
          base_bytes,base_sha=build_zip(base,'/tmp/base-release.zip')
          assert base_count==int(os.environ['BASE_RUNTIME_FILES']), (base_count,os.environ['BASE_RUNTIME_FILES'])
          assert base_fp==os.environ['BASE_RUNTIME_FP'], (base_fp,os.environ['BASE_RUNTIME_FP'])
          assert base_bytes==int(os.environ['BASE_ASSET_BYTES']), (base_bytes,os.environ['BASE_ASSET_BYTES'])
          assert base_sha==os.environ['BASE_ASSET_SHA256'], (base_sha,os.environ['BASE_ASSET_SHA256'])

          cand=runtime_files('/tmp/candidate-source','/tmp/candidate-runtime')
          count,fp=identity(cand)
          assert count==base_count, (count,base_count)
          zpath='/tmp/release/'+os.environ['ASSET_NAME']
          asset_bytes,asset_sha=build_zip(cand,zpath)
          meta={'target_commit':os.environ['TARGET_COMMIT'],'target_tree':os.environ['TARGET_TREE'],'gate_candidate_commit':os.environ['GATE_CANDIDATE_COMMIT'],'gate_candidate_tree':os.environ['GATE_CANDIDATE_TREE'],'version':os.environ['VERSION'],'asset_name':os.environ['ASSET_NAME'],'asset_bytes':asset_bytes,'asset_sha256':asset_sha,'runtime_files':count,'runtime_fingerprint':fp,'candidate_gate_run':int(os.environ['CANDIDATE_GATE_RUN']),'tested_tree_equals_release_tree':os.environ['TARGET_TREE']==os.environ['GATE_CANDIDATE_TREE'],'packaging_calibration':'PASS'}
          Path(os.environ['EVIDENCE_DIR']+'/artifact-identity.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'ASSET_BYTES={asset_bytes}\nASSET_SHA256={asset_sha}\nRUNTIME_FILES={count}\nRUNTIME_FP={fp}\n')
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo 'PACKAGING_CALIBRATION_1_21_795=PASS'
          echo 'TESTED_TREE_EQUALS_RELEASE_TREE=PASS'
          echo 'EXACT_RELEASE_ARTIFACT=PASS'

      - name: Verify release absence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = 404
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404
          echo 'RELEASE_ABSENCE=PASS'

      - name: Create exact tag and release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat > /tmp/release-body.md <<EOF
          VF Tools Ops V1.21.796 reconciles the stale Production content-workflow contract that caused structural false blockers after the 1.21.795 recheck.

          - Reconciles current required page families from 10 core-only rows to 10 core + 11 M3U8 provider families while preserving custom rows.
          - Uses optional-locale path contracts already supported by the scanner, covering default-language and localized routes without pinning evidence to one locale URL.
          - Reconciles the saved workflow registry from the stale 6-state fallback to the canonical 14-state lifecycle with load-order-independent defaults.
          - Invalidates stale content-scan evidence after the bounded config migration; genuine body/SEO/content blockers remain visible.
          - Performs no post-content or workflow-post-meta mutation, no M3U8 write or migration, no bundled-seed HOLD release, and no plugin activation/deactivation/deletion.
          - Formal WordPress 7.1 / MariaDB 11.4 Candidate Gate: ${CANDIDATE_GATE_RUN} PASS.
          - Gate candidate tree = release source tree: ${TARGET_TREE}.
          - Release source commit: ${TARGET_COMMIT}.
          - Asset SHA256: ${ASSET_SHA256}.
          - Runtime files: ${RUNTIME_FILES}.
          - Runtime fingerprint: ${RUNTIME_FP}.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"
          test -n "$RID"; test "$RID" != null
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"

      - name: Upload exact tested artifact
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/release/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"
          test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$ASSET_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"

      - name: Remote release exact readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.id' <<<"$REL_JSON")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$REL_JSON")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$REL_JSON")" = "$ASSET_BYTES"
          REMOTE_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // ""' <<<"$REL_JSON")"
          if [ -n "$REMOTE_DIGEST" ] && [ "$REMOTE_DIGEST" != null ]; then test "$REMOTE_DIGEST" = "sha256:${ASSET_SHA256}"; fi
          jq -n --arg tag "$TAG" --arg commit "$TARGET_COMMIT" --arg tree "$TARGET_TREE" --argjson release_id "$RELEASE_ID" --argjson asset_id "$ASSET_ID" --argjson asset_bytes "$ASSET_BYTES" --arg asset_sha256 "$ASSET_SHA256" --argjson runtime_files "$RUNTIME_FILES" --arg runtime_fingerprint "$RUNTIME_FP" --argjson candidate_gate_run "$CANDIDATE_GATE_RUN" '{status:"PASS",tag:$tag,source_commit:$commit,source_tree:$tree,release_id:$release_id,asset_id:$asset_id,asset_bytes:$asset_bytes,asset_sha256:$asset_sha256,runtime_files:$runtime_files,runtime_fingerprint:$runtime_fingerprint,candidate_gate_run:$candidate_gate_run,tested_artifact_equals_delivered_artifact:true,production_write:0}' > "$EVIDENCE_DIR/release-readback.json"
          cat "$EVIDENCE_DIR/release-readback.json"
          echo 'FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Upload public-safe release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121796-formal-release-${{ github.run_id }}
          path: /tmp/s01-c02-v121796-formal-release/
          if-no-files-found: warn
          retention-days: 14
