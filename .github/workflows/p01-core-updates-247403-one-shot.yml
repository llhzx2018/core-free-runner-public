name: P01 Core Updates 2.47.403 One-shot CI Fallback
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-core-updates-247403-one-shot.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: c1de755e6a637d07ee7700318cbf372f7d9c62fa
    steps:
      - name: Checkout public one-shot control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bind exact update manifest source
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p01-update-247403"
          echo "P01_UPDATES_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo "P01_UPDATES_EXACT_SOURCE=PASS"

      - name: Run equivalent canonical core-updates CI
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_UPDATES_ROOT"
          python3 scripts/check_manifest_contract.py | tee /tmp/p01-247403-distribution-contract.json
          grep -F '"status": "PASS"' /tmp/p01-247403-distribution-contract.json >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          x=json.load(open('projects/P01.json'))
          assert x['target_version']=='2.47.403'
          assert x['from_versions']==['2.47.402']
          assert x['release_tag']=='v2.47.403'
          assert x['product_identity']=='36900f7051239fcf06d730f41dbffbaf8ec5c91d'
          assert x['asset_name']=='VF_Start_V2.47.403_UPDATE.zip'
          assert x['asset_bytes']==2619820
          assert x['asset_sha256']=='d71e759cfd773fb377c4d01b435faf3ee4d2e320e670f7a13dbd7e2132db176d'
          print('P01_UPDATES_247403_EXACT_MANIFEST=PASS')
          PY
          echo "P01_UPDATES_247403_EQUIVALENT_CI=PASS"

      - name: Disposable cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_UPDATES_ROOT:-}" ]; then rm -rf -- "$P01_UPDATES_ROOT"; fi
          echo 'P01_UPDATES_247403_NO_PERSISTED_COPY=PASS'
