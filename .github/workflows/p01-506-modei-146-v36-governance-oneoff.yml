name: p01-506-modei-146-governance-review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-506-modei-146-v36-governance-oneoff.yml'
permissions:
  contents: read
jobs:
  immutable-case-review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact GOV-DOC #146 source, transient only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 293b4900192f990f05e1d476dc9308d423572c7d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Checkout exact P01 RP-07I #1953 source, transient only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 22ef30e7f35d23588ad3c8bbce37c886437312ae
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Validate exact one-case delta without weakening old gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = "293b4900192f990f05e1d476dc9308d423572c7d"
          test "$(git -C product rev-parse HEAD)" = "22ef30e7f35d23588ad3c8bbce37c886437312ae"
          test "$(git -C gov hash-object skills/skill-release/V3.5/SKILL.md)" = "8fa32cf9fb46b40815bcd611a3ae0c1be280b5f3"
          test "$(cat product/VERSION)" = "2.47.505"
          test "$(cat product/src/VERSION.txt)" = "2.47.505"
          python3 - <<'PY'
          from pathlib import Path
          import re
          g=Path('gov')
          cur=(g/'CURRENT.md').read_text()
          old=(g/'skills/skill-release/V3.5/SKILL.md').read_text()
          new=(g/'skills/skill-release/V3.6/SKILL.md').read_text()
          case=(g/'governance/release/cases/P01_START247506_CHANNEL_PAGING_SCOPE_DELTA_REVIEW_20261108.md').read_text()
          p=(Path('product')/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert '| skill-release | V3.6 |' in cur
          assert 'version: "3.6"' in new and 'previous_version: "3.5"' in new
          assert len(re.findall(r'^### Mode [A-I] ',new,re.M))==9
          def modes(src):
            return {m.group(1):m.group(0) for m in re.finditer(r'(?ms)^### Mode ([A-I]) .*?(?=^### Mode [A-I] |^## 2\.|\Z)',src)}
          a,b=modes(old),modes(new)
          assert set(a)==set(b)==set('ABCDEFGHI'),(set(a),set(b))
          for k in 'ABCDEFGH':
            assert a[k]==b[k], 'Sealed prior mode drift: '+k
          assert 'RUNTIME_CHANGE_PR = [1947, 1948]' in a['I']
          assert 'RUNTIME_CHANGE_PR = [1947, 1948, 1951]' in b['I']
          assert 'de9c5ffb6a60161eba5062c8725aa0e106d3ffe2' in b['I']
          assert 'e9d8215304e066f90dacc4a7d610f1230c274659' in b['I']
          for must in (
            'OWNER_ADOPTED_GOV145_ONE_CASE_POLICY = PASS',
            'OWNER_ADOPTED_GOV146_CHANNEL_SCOPE_DELTA = PASS',
            'P01_RP07I_EXPLICIT_1951_SCOPE_DELTA = PASS',
            'CHANNEL_116_560_PAGINATION_OWNER_GUEST_REAL_CHROMIUM = PASS',
            'DISASTER_UNPROTECT_MISSING_CORRUPT_SYMLINK_ESCAPE_SIZE_SHA_STATUS_NEGATIVES_MACHINE',
            'IMPORT_428_AND_UNKNOWN_POST_NO_REPLAY_NO_DISCARD_NO_ESCAPE_NO_TAB_SWITCH_REAL_CHROMIUM',
            'ACTUAL_DISASTER_CREATE_VERIFY_RESTORE_AND_INTERRUPTED_RESTORE_RECOVERY_MACHINE',
            'ALL_REQUIRED_DOMAINS_LOADED_MAPPED_EXACT_EVIDENCE_PASS',
            'PERFORMANCE_ARCHIVE_SHA_BOUNDED_RESOURCE_AND_SAFE_FAILURE',
            'FORMAL_RELEASE_INPUT=BLOCKED',
            'SUPPORTED_ONLINE_ATOMIC_SOURCE = [2.47.505]',
            'PRODUCTION_AUTO_APPLY = NO'):
            assert must in b['I'],must
          assert 'OWNER_CASE_SCOPE_DELTA_APPROVAL = APPROVED_EXPLICIT_2026_11_08' in case
          assert 'RULE_EFFECTIVE=NO' in case
          assert p.count('| RP-07I |')==1
          rp=next(l for l in p.splitlines() if l.startswith('| RP-07I |'))
          assert 'GOV-DOC #146' in rp and '#1951' in rp and 'V3.6+' in rp
          for key in ('| RP-07F |','| RP-07H |','| RP-08 |','| RP-09 |'):
            assert key in p
          for hard in ('Production','NOT_PROVEN','安全拒绝','删除继续停用','灾难恢复'):
            assert hard in rp,hard
          print('P01_506_MODEI_V36_9_MODES_OLD_EIGHT_BYTE_IDENTICAL=PASS')
          print('P01_506_MODEI_145_146_DISTINCT_OWNER_SCOPE_APPROVAL=PASS')
          print('P01_506_MODEI_ALL_PRE_RELEASE_HARD_GATES_RETAINED=PASS')
          print('P01_506_MODEI_P01_RP07I_EXACT_1951_ONLY=PASS')
          print('P01_506_MODEI_NO_PRODUCT_RELEASE_OR_PRODUCTION_WRITE=PASS')
          PY
      - name: Clean up private source and report no release
        if: always()
        shell: bash
        run: |
          rm -rf gov product
          echo P01_506_GOVERNANCE_PUBLIC_PERSISTENT_SOURCE=NONE
          echo P01_506_GOVERNANCE_FORMAL_RELEASE=NO
