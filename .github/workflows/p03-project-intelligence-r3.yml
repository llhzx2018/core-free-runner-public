name: P03 Project Intelligence R3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p03-project-intelligence-r3.yml']
  pull_request:
    branches: [main]
    paths: ['ops/p03/**', '.github/workflows/p03-project-intelligence-r3.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_COMMIT: e251bab98614690357253e831b0ebfeaec5c7486
  P03_PREVIOUS_VERIFIED: f01974aacdff1057a5cf1daf7bc1ed414a646778
  FIXTURE_PASS: VfM-2026-Test-Fixture!
  PHP_TEST_IMAGE: vf-forge-pi-r3-php84

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact private P03 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 2
          path: p03

      - name: Exact identity and delta continuity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          test "$(git rev-parse HEAD)" = "$P03_COMMIT"
          test "$(git rev-parse HEAD^)" = "$P03_PREVIOUS_VERIFIED"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          printf 'DELTA=%s\n' "${changed[*]}"
          test "${#changed[@]}" = '1'
          test "${changed[0]}" = 'tests/maintenance/current_reverify.sh'
          test "$(cat VERSION)" = '1.36.2'
          test "$(cat database/schema/SCHEMA_VERSION)" = '30'
          python3 scripts/repo_health.py .
          echo 'R2_TO_R3_RUNTIME_UNCHANGED=PASS'

      - name: Prepare PHP 8.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
          cat >"$RUNNER_TEMP/Dockerfile.p03-r3" <<'EOF'
          FROM php:8.4-cli-bookworm
          ARG HOST_UID=1001
          ARG HOST_GID=121
          RUN apt-get update \
            && apt-get install -y --no-install-recommends libzip-dev libsqlite3-dev sqlite3 curl \
            && docker-php-ext-install pdo_sqlite zip \
            && rm -rf /var/lib/apt/lists/*
          USER ${HOST_UID}:${HOST_GID}
          EOF
          docker build --build-arg "HOST_UID=$(id -u)" --build-arg "HOST_GID=$(id -g)" -t "$PHP_TEST_IMAGE" -f "$RUNNER_TEMP/Dockerfile.p03-r3" "$RUNNER_TEMP" >/dev/null
          docker run --rm "$PHP_TEST_IMAGE" php -r 'foreach(["pdo_sqlite","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x))exit(1);} echo "PHP84_RUNTIME=PASS\n";'

      - name: Fresh install Project Intelligence backup restore
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          bash tests/maintenance/current_reverify.sh

      - name: Browser E2E Project Intelligence responsive
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          RUNTIME="$RUNNER_TEMP/p03-browser-runtime"
          DATA_ROOT="$RUNNER_TEMP/p03-browser-private"
          COOKIE="$RUNNER_TEMP/p03-browser-cookies"
          BASE='http://127.0.0.1:18081'
          rm -rf "$RUNTIME" "$DATA_ROOT" "$COOKIE"
          mkdir -p "$DATA_ROOT"
          python3 scripts/build_runtime.py "$RUNTIME" >/dev/null
          docker rm -f p03-pi-browser >/dev/null 2>&1 || true
          docker run -d --rm --name p03-pi-browser -p 18081:18081 -v "$RUNTIME:/app" -v "$DATA_ROOT:$DATA_ROOT" -w /app "$PHP_TEST_IMAGE" php -S 0.0.0.0:18081 -t /app >/dev/null
          trap 'docker logs p03-pi-browser 2>/dev/null || true; docker rm -f p03-pi-browser >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 80); do if curl -fsS "$BASE/setup.php" >/dev/null 2>&1; then ready=1; break; fi; sleep .25; done
          test "$ready" = '1'
          curl -fsS -c "$COOKIE" "$BASE/setup.php" -o "$RUNNER_TEMP/p03-browser-setup.html"
          CSRF=$(python3 - "$RUNNER_TEMP/p03-browser-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -i -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Forge Browser Fixture' --data-urlencode "data_root=$DATA_ROOT" --data-urlencode "password=$FIXTURE_PASS" --data-urlencode "password_confirm=$FIXTURE_PASS" "$BASE/setup.php" >"$RUNNER_TEMP/p03-browser-setup-post.txt"
          grep -Eq '^HTTP/.* 302|^HTTP/.* 303' "$RUNNER_TEMP/p03-browser-setup-post.txt"
          test "$(sqlite3 "$DATA_ROOT/database/"*.sqlite 'pragma integrity_check;')" = 'ok'
          FIXTURE_PASS="$FIXTURE_PASS" node tests/maintenance/browser_reverify.mjs
          docker rm -f p03-pi-browser >/dev/null
          trap - EXIT

      - name: Final R3 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P03_PROJECT_INTELLIGENCE_R3=PASS'
          echo "P03_COMMIT=$P03_COMMIT"
          echo 'SOURCE_SCHEMA_RUNTIME_GATES=INHERITED_FROM_R2_EXACT_RUNTIME_BYTES'
          echo 'FRESH_INSTALL_BACKUP_RESTORE=PASS'
          echo 'BROWSER_E2E_RESPONSIVE=PASS'
          echo 'PRODUCTION_WRITE=NO'
