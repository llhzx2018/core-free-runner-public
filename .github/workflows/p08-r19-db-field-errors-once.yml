name: P08 R19 exact CloudPanel DB error causes on real HTTP (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r19-db-field-errors-once.yml'
permissions:
  contents: read
jobs:
  exact-source-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_CANDIDATE_SOURCE_SHA: 8370336db9e8bd4299bd977eca5b4d7a606ff71b
    steps:
      - name: Transient private P08 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 8370336db9e8bd4299bd977eca5b4d7a606ff71b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Prove exact source and stable candidate
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = "8370336db9e8bd4299bd977eca5b4d7a606ff71b"
          test "$(cat private-p08/VERSION)" = "0.1.0"
          test ! -e private-p08/.env
          echo P08_R18_SOURCE_BOUND=PASS
      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact-source production dependencies and FULL
        working-directory: private-p08
        run: |
          set -euo pipefail
          php -l public/setup.php
          php -l src/Installation/SetupGuard.php
          php -l src/Installation/OwnerWebInstaller.php
          php -l src/Recovery/DatabaseSnapshot.php
          php tests/test_setup_guard.php
          python3 -m py_compile tests/test_setup_retry_http.py
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r18-composer.log" 2>&1
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r18-npm.log" 2>&1
          npm run build
          python3 scripts/check_stack_contract.py --phase full
          python3 -m unittest discover -s tests -p test_full_builder.py -q
          python3 scripts/build_full.py --source "$PWD" --output "$RUNNER_TEMP/p08-r18-full.zip" --version 0.1.0 --source-sha "8370336db9e8bd4299bd977eca5b4d7a606ff71b"
          mkdir "$RUNNER_TEMP/p08-r18-extracted"
          unzip -qq "$RUNNER_TEMP/p08-r18-full.zip" -d "$RUNNER_TEMP/p08-r18-extracted"
          test ! -e "$RUNNER_TEMP/p08-r18-extracted/.env"
          echo "P08_R18_FULL_SHA256=$(sha256sum "$RUNNER_TEMP/p08-r18-full.zip" | awk '{print $1}')"
          echo P08_R18_EXTRACTED_FULL_SOURCE=PASS
      - name: Real PHP HTTP invalid database input, retry, CSRF, and no writes
        working-directory: private-p08
        run: |
          set -euo pipefail
          python3 tests/test_setup_retry_http.py "$RUNNER_TEMP/p08-r18-extracted"
          echo P08_R19_PRECISE_DB_FIELDS_AND_RETRY=PASS
      - name: Cleanup private source and uninstalled FULL test artifacts
        if: always()
        run: |
          rm -rf private-p08 "$RUNNER_TEMP/p08-r18-extracted"
          rm -f "$RUNNER_TEMP/p08-r18-full.zip" "$RUNNER_TEMP/p08-r18-composer.log" "$RUNNER_TEMP/p08-r18-npm.log"
