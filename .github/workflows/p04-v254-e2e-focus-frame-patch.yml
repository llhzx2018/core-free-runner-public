name: P04 V2.5.4 E2E Focus Frame Patch

on:
  push:
    paths:
      - '.github/workflows/p04-v254-e2e-focus-frame-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for requestAnimationFrame focus restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p04-v254-browser-e2e.mjs')
          s=p.read_text(encoding='utf-8')
          old="""await page.waitForFunction(() => document.querySelector('#drawer')?.getAttribute('aria-hidden') === 'true');
assert(await newDomain.evaluate((b) => b === document.activeElement), 'drawer did not return focus to opener');"""
          new="""await page.waitForFunction(() => document.querySelector('#drawer')?.getAttribute('aria-hidden') === 'true');
await page.waitForFunction(() => document.querySelector('#page-actions [data-action=\"new-domain\"]') === document.activeElement);
assert(await newDomain.evaluate((b) => b === document.activeElement), 'drawer did not return focus to opener');"""
          if s.count(old)!=1: raise SystemExit('drawer focus assertion sentinel mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check scripts/p04-v254-browser-e2e.mjs
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add scripts/p04-v254-browser-e2e.mjs
          git commit -m 'runner(P04): await V2.5.4 drawer focus restoration frame'
          git push origin HEAD:main
