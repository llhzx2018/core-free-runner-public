name: TEMP S01-C02 v1.21.812 Formal Release
on:
  push:
    branches: [temp/s01-c02-v121812-shared-bootstrap-20260905]
    paths: ['.github/workflows/temp-s01-c02-v121812-formal-release.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: b32ea5d6012aa25305ed23b3aaadc4bf048e8c3c
      ASSET_BYTES: '3219158'
      ASSET_SHA: fe0e63128855cd86d0de3c0d44db5483d79b640bc84baee12c4740f34296a534
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Verify promoted authority
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$1" | jq -r '.commit.sha'; }
          test "$(live main)" = "$SOURCE"
          test "$(live develop)" = "$SOURCE"
          echo PROMOTED_AUTHORITY=PASS
      - name: Rebuild exact Candidate artifact
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/release
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,zipfile
          files=[]
          for p in Path('ops').rglob('*'):
              if not p.is_file() or p.is_symlink(): continue
              rel=p.relative_to('ops').as_posix(); parts=rel.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): continue
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
              if '/' not in rel:
                  if rel not in {'vf-ops.php','uninstall.php'}: continue
              elif parts[0] not in {'includes','assets','languages','config'}: continue
              files.append((rel,p.read_bytes()))
          files.sort(key=lambda x:x[0])
          z=Path('/tmp/release/vf-tools-ops_V1.21.812.zip')
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for rel,b in files:
                  i=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,5,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.external_attr=0o100644<<16; out.writestr(i,b)
          PY
          test "$(stat -c '%s' /tmp/release/vf-tools-ops_V1.21.812.zip)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/release/vf-tools-ops_V1.21.812.zip|awk '{print $1}')" = "$ASSET_SHA"
          unzip -tq /tmp/release/vf-tools-ops_V1.21.812.zip >/dev/null
          echo EXACT_CANDIDATE_ARTIFACT=PASS
      - name: Create formal release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          ! gh release view v1.21.812 --repo llhzx2018/vf-tools-ops >/dev/null 2>&1
          gh release create v1.21.812 /tmp/release/vf-tools-ops_V1.21.812.zip --repo llhzx2018/vf-tools-ops --target "$SOURCE" --title 'VF Tools Ops v1.21.812' --notes 'S01-C02 Shared Private Asset Bootstrap V1. Provides a bounded last-resort authenticated updater bridge for exact S01-C01 VF Tools Theme and S01-C03 VF Tools M3U8 private GitHub Release Asset API URLs. It delegates to each component existing updater so Runtime Authority, Manifest/Release identity, SHA/bytes, ZIP gate, recovery and post-update verification remain authoritative. Ops manual refresh now clears Ops/Theme/M3U8 component caches plus WordPress update_plugins/update_themes. No M3U8 migration/schema/data write, Seed HOLD release, plugin-state mutation, content write or DNS write.'
      - name: Release readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          j="$(gh api repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.812)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$SOURCE"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.812.zip")|.size' <<<"$j")" = "$ASSET_BYTES"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.812.zip")|.digest' <<<"$j")" = "sha256:$ASSET_SHA"
          echo PASS_V121812_FORMAL_RELEASE
