name: P01 Single System Auth Model Revert
on:
  push:
    branches:
      - temp/p01-single-system-auth-model-20260901
    paths:
      - .github/workflows/p01-single-system-auth-revert-20260901.yml

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact P01 product branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: fix/p01-single-system-auth-model-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Revert only the mistaken dual-view commit
        shell: bash
        run: |
          set -euo pipefail
          cd p01
          BASE='388f8f75777fc131e47ef7dc7a136ff2cb7d8cc9'
          BAD='aeee995f8a4b10f330938151bbc05b9fe5c74e82'
          test "$(git rev-parse HEAD)" = "$BASE"
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git revert --no-edit "$BAD"

          actual="$(git diff --name-only "$BASE"..HEAD | sort | tr '\n' ' ')"
          expected='src/api.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/assets/frontend.css src/assets/workspace-domain-nav.css src/index.php src/start.php '
          test "$actual" = "$expected"

          for needle in public_view preview_return vf_fw_public_preview_requested vf-global-view-state vf-view-state 管理员视角 公开视角; do
            if git grep -n -F "$needle" -- src/api.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/assets/frontend.css src/assets/workspace-domain-nav.css src/index.php src/start.php; then
              echo "forbidden dual-view marker remains: $needle" >&2
              exit 1
            fi
          done

          php -l src/api.php
          php -l src/app/FunctionalWorkspace.php
          php -l src/app/FunctionalWorkspaceCore.php
          php -l src/app/FunctionalWorkspaceShell.php
          php -l src/index.php
          php -l src/start.php
          test "$(tr -d '\r\n' < VERSION)" = '2.36.0'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.36.0'
          git diff --check "$BASE"..HEAD

          echo "REVERT_SOURCE=$(git rev-parse HEAD)"
          echo "REVERT_TREE=$(git rev-parse HEAD^{tree})"
          echo "REVERT_RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:fix/p01-single-system-auth-model-20260901
