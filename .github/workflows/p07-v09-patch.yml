name: P07 OneShot v0.9 Patch

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v05
    paths:
      - experiments/p07-v09-patch.py
      - .github/workflows/p07-v09-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.9 patch
        run: python3 experiments/p07-v09-patch.py
      - name: Validate v0.9
        shell: bash
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F '0.9.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'
          P07_BENCH_DEMO_BACKEND_REASON=RATE_LIMITED P07_BENCH_DEMO_MAINLAND_FAIL_HOST=10086.cn ./experiments/p07-bench.sh --demo >/tmp/rate-limited-demo
          grep -F 'Carrier Speed       : NOT_RUN (Ookla RATE_LIMITED)' /tmp/rate-limited-demo
          grep -F 'Mainland HTTPS Fail : www.10086.cn' /tmp/rate-limited-demo
          grep -F 'China IP Risk       : UNKNOWN' /tmp/rate-limited-demo
          grep -F 'Ookla provider failure is test-platform evidence, not IP-blocking evidence.' /tmp/rate-limited-demo
          grep -F 'Cloudflare Edge' /tmp/rate-limited-demo
          ! grep -q 'Los Angeles, US' /tmp/rate-limited-demo
          ! grep -q 'Carrier Speed       : 0/0 PASS' /tmp/rate-limited-demo
      - name: Commit v0.9 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-bench.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix(p07-bench): clarify provider-limited China assessment v0.9'
          git push
