name: p01-v24729-bind-temp

on:
  push:
    branches:
      - run/p01-v24729-bind

permissions:
  contents: read

jobs:
  bind-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 832ad7d062930d8462a030f4b7cc3ab5bef41ddb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout verified engineering base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: afcc7097d490d8b0252aad898dc3bda92f39ebbe
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: base
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact bind scope and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "832ad7d062930d8462a030f4b7cc3ab5bef41ddb"
          test "$(git -C base rev-parse HEAD)" = "afcc7097d490d8b0252aad898dc3bda92f39ebbe"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.29"
          test "$(tr -d '\r\n ' < target/src/VERSION.txt)" = "2.47.29"
          grep -Fq "define('VF_VERSION', '2.47.29');" target/src/app/bootstrap.php
          test "$(tr -d '\r\n ' < base/VERSION)" = "2.47.28"
          test -f target/docs/release/V2.47.29_RELEASE_GATE.md
          mapfile -t changed < <(git -C target diff --name-only afcc7097d490d8b0252aad898dc3bda92f39ebbe..832ad7d062930d8462a030f4b7cc3ab5bef41ddb | sort)
          test "${#changed[@]}" = 4
          printf '%s\n' "${changed[@]}" >/tmp/p01-v24729-bind-files.txt
          grep -Fxq VERSION /tmp/p01-v24729-bind-files.txt
          grep -Fxq src/VERSION.txt /tmp/p01-v24729-bind-files.txt
          grep -Fxq src/app/bootstrap.php /tmp/p01-v24729-bind-files.txt
          grep -Fxq docs/release/V2.47.29_RELEASE_GATE.md /tmp/p01-v24729-bind-files.txt
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V24729_BIND_SCOPE_SYNTAX=PASS

      - name: Focused release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          php tests/unit/admin_navigation_category_route_runtime_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/admin_resource_health_closure_contract.php
          php tests/unit/admin_data_closure_contract.php
          php tests/unit/admin_system_closure_contract.php
          php tests/unit/admin_settings_focus_contract.php
          php tests/unit/admin_overview_actionable_health_contract.php
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_resource_browse_edit_r5_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/atomic_runtime_cache_contract.php
          php tests/unit/update_recovery_contract.php
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.29_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' docs/release/V2.47.29_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' docs/release/V2.47.29_RELEASE_GATE.md
          echo P01_V24729_RELEASE_CONTRACTS=PASS

      - name: Fresh install baseline and authenticated admin smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          echo "TEST_PASSWORD=$TEST_PASSWORD" >> "$GITHUB_ENV"
          rm -rf /tmp/p01-v24729-runtime
          cp -a target/src /tmp/p01-v24729-runtime
          cd /tmp/p01-v24729-runtime
          php -S 127.0.0.1:18112 -t . >/tmp/p01-v24729-server.log 2>&1 &
          echo $! >/tmp/p01-v24729.pid
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies http://127.0.0.1:18112/setup.php -o /tmp/p01-v24729-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24729-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies -X POST http://127.0.0.1:18112/setup.php \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=VF V24729 Bind' \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            -o /tmp/p01-v24729-setup-post.html
          php cli/verify.php | tee /tmp/p01-v24729-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24729-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-v24729-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v24729-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-v24729-baseline.txt
          php -r 'require "app/bootstrap.php"; $r=new VfRepository(vf_db()); $cid=$r->createCategory(["name"=>"Runner 分类"]); $saved=$r->saveLink(null,["surface"=>"start","category_id"=>$cid,"title"=>"Runner URL","url"=>"https://example.com"]); $id=(int)$saved["id"]; $db=vf_db(); $now=gmdate("c"); $s=$db->prepare("INSERT INTO link_health(link_id,status,http_status,last_checked_at,consecutive_failures,manual_confirmed,updated_at,ignore_auto) VALUES(?,\"confirmed\",404,?,2,1,?,0)"); $s->execute([$id,$now,$now]);'

          TEST_PASSWORD="$TEST_PASSWORD" python3 - <<'PY' >/tmp/p01-v24729-login.json
          import json,os
          print(json.dumps({"password":os.environ["TEST_PASSWORD"]}))
          PY
          curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies -H 'Content-Type: application/json' \
            -X POST 'http://127.0.0.1:18112/api.php?action=login' --data-binary @/tmp/p01-v24729-login.json \
            -o /tmp/p01-v24729-login-result.json
          grep -F '"ok":true' /tmp/p01-v24729-login-result.json >/dev/null

          curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies 'http://127.0.0.1:18112/settings.php?section=display' -o /tmp/p01-v24729-settings.html
          grep -F '<h1>设置</h1>' /tmp/p01-v24729-settings.html >/dev/null
          grep -F '恢复显示推荐值' /tmp/p01-v24729-settings.html >/dev/null

          curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies 'http://127.0.0.1:18112/manage.php' -o /tmp/p01-v24729-manage.html
          grep -F '网址健康 1 条待处理' /tmp/p01-v24729-manage.html >/dev/null
          grep -F 'health.php?status=attention' /tmp/p01-v24729-manage.html >/dev/null

          curl -fsS -c /tmp/p01-v24729.cookies -b /tmp/p01-v24729.cookies 'http://127.0.0.1:18112/surface-manager.php?advanced=1' -o /tmp/p01-v24729-resources.html
          grep -F 'class="vf-resource-editor-details"' /tmp/p01-v24729-resources.html >/dev/null
          ! grep -F 'class="vf-resource-editor-details" open' /tmp/p01-v24729-resources.html >/dev/null
          echo P01_V24729_BIND_FRESH_AUTH_SMOKE=PASS

      - name: Verdict
        run: |
          echo P01_V24729_BOUND_CANDIDATE_GATE=PASS
          echo ENGINEERING_GATE=35483674002
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-v24729.pid ]; then kill "$(cat /tmp/p01-v24729.pid)" 2>/dev/null || true; fi
          rm -rf /tmp/p01-v24729-runtime /tmp/p01-v24729-*
