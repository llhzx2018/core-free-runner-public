name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-theme214-player-20261028]
    paths: ['.github/workflows/s01-theme214-player-20261028-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.215
  TARGET_SHA: 012d4b637281a484073727f1e2c4c4610d3b4611
  UPDATE_SHA: 1e9338706a402e79a39f0f0f3f600e76c8053dc6
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 1e9338706a402e79a39f0f0f3f600e76c8053dc6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme214-player-20261028/channel-spec.json --input control/.github/workflows/s01-theme214-player-20261028-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 2418ec0bc6646fdcfa54437db287da7676d8d2ac 1e9338706a402e79a39f0f0f3f600e76c8053dc6)" = projects/S01-C01.json
          git -C source diff --exit-code 2418ec0bc6646fdcfa54437db287da7676d8d2ac 1e9338706a402e79a39f0f0f3f600e76c8053dc6 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='05c8736168f5e2dc1e22b1e43ee2a910a4992bae965780b32935264998ae8990' and m['asset_bytes']==2023475
          assert m['runtime_files']==476 and '1.35.213' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          import pathlib,subprocess
          base=json.loads(subprocess.check_output(['git','show','2418ec0bc6646fdcfa54437db287da7676d8d2ac:projects/S01-C01.json']))
          changed={k for k in set(base)|set(m)if base.get(k)!=m.get(k)}
          assert changed=={'target_version','from_versions','release_tag','asset_name','asset_bytes','asset_sha256','notes','released_at'}
          supported=["1.35.213", "1.35.214"]
          assert m['from_versions']==base['from_versions']+[v for v in supported if v not in base['from_versions']]
          assert set(supported)<=set(m['from_versions'])
          pathlib.Path('../proof').mkdir(exist_ok=True)
          pathlib.Path('../proof/channel.json').write_text(json.dumps({'status':'PASS','source':'1e9338706a402e79a39f0f0f3f600e76c8053dc6','version':m['target_version'],'sha256':m['asset_sha256'],'bytes':m['asset_bytes'],'runtime_files':m['runtime_files'],'changed_fields':sorted(changed),'protocol_tests':'PASS','production':'UNTOUCHED'},indent=2))
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme214-channel-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: rm -rf source
