name: P04 VF Infra V2.5.8 Production Delta Forensic Probe Gate

on:
  push:
    branches:
      - p04-v258-delta-forensic-gate-bd2eadc2c6aa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v258-delta-forensic-gate-bd2eadc2c6aa
  cancel-in-progress: false

env:
  TARGET_COMMIT: 4a18a61c21455184c67aa4a3e0957283674ae2d7
  TARGET_TREE: 89f322a309f8c51c9869864800a6980cb9bfbb94
  PROBE_NAME: vf-v258-asset-relation-forensic-bd2eadc2c6aa.php
  PROBE_SHA256: 3d223577a2915752cec2ef941b748ff330057fbbb94352c6b6dc45b6edeb382c
  EXPECTED_NOTES_BYTES: '1770'
  EXPECTED_NOTES_SHA256: c402daaeb27130dda0354024a3725295270e78e16bcc6952f6d3b23269dd74d7

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout forensic gate authority
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: gate

      - name: Checkout exact frozen VF Infra V2.5.8 Product Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-vf-infra

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, mbstring
          coverage: none

      - name: Reconstruct exact original Probe from temporary evidence chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/original"
          cat gate/tools/p04/v258-delta-forensic/probe.part*.b64 | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/original/$PROBE_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/original/$PROBE_NAME")" = '23156'
          test "$(sha256sum "$RUNNER_TEMP/original/$PROBE_NAME" | awk '{print $1}')" = "$PROBE_SHA256"
          php -l "$RUNNER_TEMP/original/$PROBE_NAME" >/dev/null
          echo 'EXACT_ORIGINAL_PROBE_RECONSTRUCTION=PASS'

      - name: Frozen Product and RELEASE_NOTES payload contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd private-vf-infra
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(stat -c %s docs/operations/package/RELEASE_NOTES.md)" = "$EXPECTED_NOTES_BYTES"
          test "$(sha256sum docs/operations/package/RELEASE_NOTES.md | awk '{print $1}')" = "$EXPECTED_NOTES_SHA256"
          python3 - <<'PY'
          import ast,re,pathlib
          s=pathlib.Path('scripts/build-v258-update-release.py').read_text(encoding='utf-8')
          m=re.search(r"payload=(\[.*?\])\nreplacement=",s,re.S)
          assert m, 'PAYLOAD_LITERAL_NOT_FOUND'
          payload=ast.literal_eval(m.group(1))
          assert 'RELEASE_NOTES.md' not in payload
          assert payload==[
            'VERSION.txt','index.php','scope-summary.php','domain-portfolio.php',
            'assets/v258-ui.css','assets/v258-view.js','assets/v258-nav.js',
            'app/Core/ScopeSummaryService.php','app/Core/DomainPortfolioQueryService.php','release-manifest.json',
          ]
          print('RELEASE_NOTES_EXPECTED_BYTES=1770')
          print('RELEASE_NOTES_EXPECTED_SHA256=c402daaeb27130dda0354024a3725295270e78e16bcc6952f6d3b23269dd74d7')
          print('UPDATE_PAYLOAD_INCLUDED=NO')
          PY
          echo 'FROZEN_PRODUCT_AND_RELEASE_NOTES_CONTRACT=PASS'

      - name: Static read-only security review
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/original/$PROBE_NAME" <<'PY'
          import pathlib,re,sys
          s=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          forbidden_fs=r'\b(file_put_contents|fwrite|fputs|unlink|rename|copy|mkdir|rmdir|chmod|chown|touch|tempnam|move_uploaded_file)\s*\('
          forbidden_net=r'\b(curl_[a-z_]+|fsockopen|pfsockopen|stream_socket_client|socket_connect|file_get_contents\s*\(\s*[\"\']https?://)'
          forbidden_shell=r'\b(system|shell_exec|passthru|proc_open|popen|exec)\s*\('
          assert not re.search(forbidden_fs,s,re.I), 'FILESYSTEM_WRITE_PRIMITIVE_FOUND'
          assert not re.search(forbidden_net,s,re.I), 'NETWORK_PRIMITIVE_FOUND'
          assert not re.search(forbidden_shell,s,re.I), 'SHELL_PRIMITIVE_FOUND'
          assert 'SQLITE3_OPEN_READONLY' in s
          assert 'SQLITE3_OPEN_READWRITE' not in s and 'SQLITE3_OPEN_CREATE' not in s
          execs=re.findall(r'->exec\s*\((.*?)\)\s*;',s,re.S)
          assert len(execs)==1 and "'PRAGMA query_only=ON'" in execs[0]
          assert "session_start(['read_and_close' => true])" in s
          assert 'require $configFile' in s
          assert 'bootstrap.php' not in s
          print('STATIC_FILESYSTEM_WRITE=0')
          print('STATIC_DATABASE_WRITE=0')
          print('STATIC_NETWORK_CALL=0')
          print('STATIC_PROVIDER_REMOTE_WRITE=0')
          PY
          echo 'STATIC_READ_ONLY_SECURITY_REVIEW=PASS'

      - name: Build positive and negative isolated forensic fixtures
        shell: bash
        env:
          ORIGINAL_PROBE: ${{ runner.temp }}/original/${{ env.PROBE_NAME }}
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p04-forensic"
          mkdir -p "$ROOT"
          python3 - "$ROOT" <<'PY'
          import hashlib,os,pathlib,shutil,sqlite3,sys
          root=pathlib.Path(sys.argv[1])
          probe=pathlib.Path(os.environ['ORIGINAL_PROBE'])
          appkey='a'*64
          ua='P04-Delta-Forensic-Fixture/1.0'
          sid='p04deltafixture1234567890abcdef'
          schema='''
          CREATE TABLE settings(key TEXT PRIMARY KEY,value TEXT NOT NULL,updated_at TEXT NOT NULL);
          CREATE TABLE assets(id INTEGER PRIMARY KEY,asset_type TEXT NOT NULL,asset_key TEXT NOT NULL,provider_account_id INTEGER NULL,source_module TEXT NOT NULL,source_object_id INTEGER NOT NULL);
          CREATE TABLE asset_relations(id INTEGER PRIMARY KEY AUTOINCREMENT,from_asset_id INTEGER NOT NULL,to_asset_id INTEGER NOT NULL,relation_type TEXT NOT NULL,source TEXT NOT NULL DEFAULT 'manual',created_at TEXT NOT NULL,updated_at TEXT NOT NULL,UNIQUE(from_asset_id,to_asset_id,relation_type));
          CREATE TABLE backups(id INTEGER PRIMARY KEY,filename TEXT NOT NULL,backup_type TEXT NOT NULL,size_bytes INTEGER NOT NULL,sha256 TEXT NOT NULL,created_at TEXT NOT NULL,note TEXT NOT NULL DEFAULT '',source_version TEXT NOT NULL DEFAULT '',schema_version INTEGER NOT NULL DEFAULT 0,integrity_status TEXT NOT NULL DEFAULT 'unknown',foreign_key_status TEXT NOT NULL DEFAULT 'unknown',protected INTEGER NOT NULL DEFAULT 0);
          CREATE TABLE update_history(id INTEGER PRIMARY KEY,operation_id TEXT,package_id TEXT,from_version TEXT NOT NULL,to_version TEXT NOT NULL,started_at TEXT NOT NULL,completed_at TEXT,result TEXT NOT NULL,failure_stage TEXT NOT NULL DEFAULT '',release_manifest_sha256 TEXT NOT NULL DEFAULT '');
          CREATE TABLE jobs(id INTEGER PRIMARY KEY,job_key TEXT NOT NULL,module TEXT NOT NULL,display_name TEXT NOT NULL,schedule_type TEXT NOT NULL DEFAULT 'interval',schedule_value TEXT NOT NULL DEFAULT '',enabled INTEGER NOT NULL DEFAULT 1,priority INTEGER NOT NULL DEFAULT 100,timeout_seconds INTEGER NOT NULL DEFAULT 300,retry_policy_json TEXT NOT NULL DEFAULT '{}');
          CREATE TABLE job_runs(id INTEGER PRIMARY KEY,job_id INTEGER NOT NULL,started_at TEXT NOT NULL,finished_at TEXT NULL,status TEXT NOT NULL,attempt_no INTEGER NOT NULL DEFAULT 1,retry_count INTEGER NOT NULL DEFAULT 0,processed_count INTEGER NOT NULL DEFAULT 0,success_count INTEGER NOT NULL DEFAULT 0,limited_count INTEGER NOT NULL DEFAULT 0,failed_count INTEGER NOT NULL DEFAULT 0,error_code TEXT NOT NULL DEFAULT '',error_summary TEXT NOT NULL DEFAULT '',result_json TEXT NOT NULL DEFAULT '{}',duration_ms INTEGER NULL);
          CREATE TABLE events(id INTEGER PRIMARY KEY,asset_id INTEGER NULL,module TEXT NOT NULL,event_type TEXT NOT NULL,severity TEXT NOT NULL DEFAULT 'info',root_cause_key TEXT NOT NULL DEFAULT '',old_value TEXT NULL,new_value TEXT NULL,payload_safe_json TEXT NOT NULL DEFAULT '{}',observed_at TEXT NOT NULL,job_run_id INTEGER NULL,requires_action INTEGER NOT NULL DEFAULT 0,resolved_at TEXT NULL,source_event_id INTEGER NULL);
          CREATE TABLE provider_account_sync_state(provider_account_id INTEGER PRIMARY KEY,sync_enabled INTEGER NOT NULL DEFAULT 1,desired_sync_enabled INTEGER NOT NULL DEFAULT 1,last_started_at TEXT NULL,last_finished_at TEXT NULL,last_successful_at TEXT NULL,last_status TEXT NOT NULL DEFAULT 'never',consecutive_failures INTEGER NOT NULL DEFAULT 0,backoff_until TEXT NULL,next_sync_at TEXT NULL);
          '''
          def add_assets(c):
              for i in range(1,121):
                  typ='domain' if i<=60 else 'dns_zone'
                  key=(f'domain:fixture-{i}.example' if i<=60 else f'cloudflare:fixture:zone-{i}')
                  c.execute('INSERT INTO assets(id,asset_type,asset_key,provider_account_id,source_module,source_object_id) VALUES(?,?,?,?,?,?)',(i,typ,key,1,'domain' if i<=60 else 'dns',i))
          def add_relations_pre(c):
              for i in range(1,56):
                  c.execute('INSERT INTO asset_relations(id,from_asset_id,to_asset_id,relation_type,source,created_at,updated_at) VALUES(?,?,?,?,?,?,?)',(i,i,60+i,'linked_to','manual','2026-08-17 09:00:00','2026-08-17 09:00:00'))
              for i in range(56,60):
                  c.execute('INSERT INTO asset_relations(id,from_asset_id,to_asset_id,relation_type,source,created_at,updated_at) VALUES(?,?,?,?,?,?,?)',(i,i,60+i,'dns_managed_by','provider_sync','2026-08-17 09:30:00','2026-08-17 09:30:00'))
          pre=root/'pre.sqlite'
          c=sqlite3.connect(pre); c.executescript(schema); add_assets(c); add_relations_pre(c); c.commit(); c.close()
          backup_sha=hashlib.sha256(pre.read_bytes()).hexdigest(); backup_bytes=pre.stat().st_size
          def build_case(name,with_job):
              case=root/name; runtime=case/'runtime'; data=case/'data'; sessions=case/'sessions'
              (data/'database').mkdir(parents=True); (data/'backups').mkdir(parents=True); sessions.mkdir(parents=True); runtime.mkdir(parents=True)
              shutil.copy2(pre,data/'backups/pre-v257-to-v258.sqlite')
              db=data/'database/vf-domain.sqlite'
              c=sqlite3.connect(db); c.executescript(schema); add_assets(c)
              c.execute("INSERT INTO settings VALUES('auth_generation','1','2026-08-17 10:00:00')")
              for i in range(1,56):
                  c.execute('INSERT INTO asset_relations(id,from_asset_id,to_asset_id,relation_type,source,created_at,updated_at) VALUES(?,?,?,?,?,?,?)',(i,i,60+i,'linked_to','manual','2026-08-17 09:00:00','2026-08-17 09:00:00'))
              for j,i in enumerate(range(56,60),start=60):
                  c.execute('INSERT INTO asset_relations(id,from_asset_id,to_asset_id,relation_type,source,created_at,updated_at) VALUES(?,?,?,?,?,?,?)',(j,i,60+i,'dns_managed_by','provider_sync','2026-08-17 10:10:00','2026-08-17 10:10:00'))
              c.execute('INSERT INTO backups(id,filename,backup_type,size_bytes,sha256,created_at,note,source_version,schema_version,integrity_status,foreign_key_status,protected) VALUES(61,?,?,?,?,?,?,?,?,?,?,?)',('pre-v257-to-v258.sqlite','pre_update',backup_bytes,backup_sha,'2026-08-17 09:59:00','fixture','2.5.7',14,'ok','ok',1))
              c.execute("INSERT INTO update_history(id,operation_id,package_id,from_version,to_version,started_at,completed_at,result,failure_stage) VALUES(1,'fixture-op','fixture-package','2.5.7','2.5.8','2026-08-17 10:00:00','2026-08-17 10:05:00','success','')")
              c.execute("INSERT INTO jobs(id,job_key,module,display_name,schedule_type,schedule_value,enabled,priority,timeout_seconds,retry_policy_json) VALUES(1,'core.provider_inventory_sync','core','连接账号资产同步','interval','5m',1,45,900,'{}')")
              if with_job:
                  c.execute("INSERT INTO job_runs(id,job_id,started_at,finished_at,status,processed_count,success_count,limited_count,failed_count) VALUES(101,1,'2026-08-17 10:09:30','2026-08-17 10:10:30','success',1,1,0,0)")
              c.execute("INSERT INTO provider_account_sync_state(provider_account_id,last_started_at,last_finished_at,last_successful_at,last_status,next_sync_at) VALUES(1,'2026-08-17 10:09:30','2026-08-17 10:10:30','2026-08-17 10:10:30','success','2026-08-17 10:15:30')")
              for idx,i in enumerate(range(56,60),start=201):
                  c.execute("INSERT INTO events(id,asset_id,module,event_type,severity,observed_at,job_run_id,requires_action) VALUES(?,?,?,?,?,?,?,0)",(idx,i,'dns','dns_zone_changed','info','2026-08-17 10:10:00',101 if with_job else None))
              c.commit(); c.close()
              src=probe.read_text(encoding='utf-8')
              src=src.replace("const VFD_BACKUP_SHA256 = '367619835c340614522c29a1f316bffe44167c2c6bd07ac8beccbee5287e3531';",f"const VFD_BACKUP_SHA256 = '{backup_sha}';")
              (runtime/os.environ['PROBE_NAME']).write_text(src,encoding='utf-8')
              (runtime/'RELEASE_NOTES.md').write_text('V2.5.7 production notes retained by update payload gap\n',encoding='utf-8')
              (runtime/'config.php').write_text("<?php\nreturn [\n'app_name'=>'VF Infra Fixture',\n'base_url'=>'http://127.0.0.1:18000',\n'data_path'=>"+repr(str(data))+",\n'timezone'=>'Asia/Shanghai',\n'app_key'=>'"+appkey+"',\n'session_name'=>'vf_domain_session',\n'session_idle_timeout'=>1209600,\n'session_max_lifetime'=>2592000,\n'allowed_hosts'=>['127.0.0.1'],\n];\n",encoding='utf-8')
          build_case('positive',True); build_case('negative',False)
          (root/'fixture.env').write_text(f"APPKEY={appkey}\nUA={ua}\nSID={sid}\nBACKUP_SHA={backup_sha}\n",encoding='utf-8')
          print('FIXTURE_BACKUP_SHA='+backup_sha)
          print('FIXTURE_BUILD=PASS')
          PY
          source "$ROOT/fixture.env"
          for CASE in positive negative; do
            SESS="$ROOT/$CASE/sessions"
            SID="$SID" UA="$UA" APPKEY="$APPKEY" php -d session.save_path="$SESS" -d session.use_strict_mode=0 -r '
              session_name("vf_domain_session"); session_id(getenv("SID")); session_start(); $now=time();
              $_SESSION=["vf_domain_authenticated"=>true,"vf_domain_last_activity"=>$now,"vf_domain_created_at"=>$now,"vf_domain_auth_generation"=>1,"vf_domain_csrf"=>str_repeat("b",64),"vf_domain_ua"=>hash("sha256",getenv("UA")."|".getenv("APPKEY")),"vf_domain_rotated_at"=>$now]; session_write_close();'
          done
          echo 'ISOLATED_FORENSIC_FIXTURES=PASS'

      - name: Positive relation-delta classification and zero-write proof
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p04-forensic"; source "$ROOT/fixture.env"
          RT="$ROOT/positive/runtime"; DATA="$ROOT/positive/data"; SESS="$ROOT/positive/sessions"; PORT=18121
          find "$RT" "$DATA" "$SESS" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/positive.before"
          php -d session.save_path="$SESS" -S 127.0.0.1:$PORT -t "$RT" >"$ROOT/positive-server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            code=$(curl -sS --max-time 1 -o "$ROOT/ready.json" -w '%{http_code}' -A "$UA" "http://127.0.0.1:$PORT/$PROBE_NAME" || true)
            if [ "$code" = '403' ]; then ready=1; break; fi
            sleep .1
          done
          test "$ready" = '1'
          code=$(curl -sS -o "$ROOT/unauth.json" -w '%{http_code}' -A "$UA" "http://127.0.0.1:$PORT/$PROBE_NAME")
          test "$code" = '403'
          code=$(curl -sS -o "$ROOT/positive.json" -w '%{http_code}' -A "$UA" -H "Cookie: vf_domain_session=$SID" "http://127.0.0.1:$PORT/$PROBE_NAME")
          test "$code" = '200'
          kill $PID; wait $PID 2>/dev/null || true; trap - EXIT
          find "$RT" "$DATA" "$SESS" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/positive.after"
          cmp "$ROOT/positive.before" "$ROOT/positive.after"
          python3 - "$ROOT/positive.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d['ok'] is True
          x=d['asset_relation_delta']; c=d['classification_hint']; n=d['release_notes']; s=d['safety']
          assert x['pre_count']==59 and x['current_count']==59
          assert x['missing_from_current_count']==4 and x['new_since_backup_count']==4
          assert [r['id'] for r in x['missing_from_current']]==[56,57,58,59]
          assert [r['id'] for r in x['new_since_backup']]==[60,61,62,63]
          for r in x['missing_from_current']:
              assert set(['id','from_asset_id','from_asset_type','from_asset_key','to_asset_id','to_asset_type','to_asset_key','relation_type','source','created_at','updated_at']).issubset(r)
              assert len(r['semantic_replacement_ids'])==1
          for r in x['new_since_backup']:
              assert r['relation_type']=='dns_managed_by' and r['source']=='provider_sync'
              assert r['time_classification']=='POST_UPGRADE'
              assert r['related_provider_inventory_job_runs'] and r['related_provider_inventory_job_runs'][0]['job_key']=='core.provider_inventory_sync'
          assert x['all_missing_semantically_present_current']=='YES'
          assert x['all_new_post_upgrade']=='YES'
          assert x['all_new_provider_sync_dns_managed_by']=='YES'
          assert x['all_new_provider_inventory_job_correlated']=='YES'
          assert c['upgrade_caused_mutation']=='NO'
          assert c['post_upgrade_legitimate_evolution']=='YES'
          assert c['business_preservation_final_classification']=='PASS'
          assert n['expected']['bytes']==1770 and n['expected']['sha256']==os.environ['EXPECTED_NOTES_SHA256']
          assert n['exact']=='FAIL' and n['update_payload_included']=='NO' and n['root_cause']=='UPDATE_PAYLOAD_GAP'
          assert s['filesystem_write']==0 and s['database_write']==0 and s['network_call']==0 and s['provider_remote_write']==0 and s['physical_repair']==0
          raw=open(sys.argv[1],encoding='utf-8').read()
          for forbidden in ['a'*64,'p04deltafixture1234567890abcdef',os.environ['RUNNER_TEMP']]: assert forbidden not in raw
          print('POSITIVE_59_TO_59_DELTA_CLASSIFICATION=PASS')
          print('UNAUTHENTICATED_DENY=PASS')
          print('FILESYSTEM_WRITE=0')
          print('DATABASE_WRITE=0')
          print('NETWORK_CALL=0')
          print('SENSITIVE_OUTPUT_SCAN=PASS')
          PY

      - name: Negative missing-job provenance must remain unresolved
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p04-forensic"; source "$ROOT/fixture.env"
          RT="$ROOT/negative/runtime"; DATA="$ROOT/negative/data"; SESS="$ROOT/negative/sessions"; PORT=18122
          find "$RT" "$DATA" "$SESS" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/negative.before"
          php -d session.save_path="$SESS" -S 127.0.0.1:$PORT -t "$RT" >"$ROOT/negative-server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 50); do code=$(curl -sS --max-time 1 -o /dev/null -w '%{http_code}' -A "$UA" "http://127.0.0.1:$PORT/$PROBE_NAME" || true); if [ "$code" = '403' ]; then ready=1; break; fi; sleep .1; done
          test "$ready" = '1'
          code=$(curl -sS -o "$ROOT/negative.json" -w '%{http_code}' -A "$UA" -H "Cookie: vf_domain_session=$SID" "http://127.0.0.1:$PORT/$PROBE_NAME")
          test "$code" = '200'
          kill $PID; wait $PID 2>/dev/null || true; trap - EXIT
          find "$RT" "$DATA" "$SESS" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/negative.after"
          cmp "$ROOT/negative.before" "$ROOT/negative.after"
          python3 - "$ROOT/negative.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); x=d['asset_relation_delta']; c=d['classification_hint']
          assert x['missing_from_current_count']==4 and x['new_since_backup_count']==4
          assert x['all_new_post_upgrade']=='YES' and x['all_new_provider_sync_dns_managed_by']=='YES'
          assert x['all_new_provider_inventory_job_correlated']=='NO'
          assert c['upgrade_caused_mutation']=='NO'
          assert c['post_upgrade_legitimate_evolution']=='UNRESOLVED'
          assert c['business_preservation_final_classification']=='UNRESOLVED'
          print('NEGATIVE_PROVENANCE_GUARD=PASS')
          PY

      - name: Seal exact original single-file handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          PROBE="$RUNNER_TEMP/original/$PROBE_NAME"
          test "$(stat -c %s "$PROBE")" = '23156'
          test "$(sha256sum "$PROBE" | awk '{print $1}')" = "$PROBE_SHA256"
          mkdir -p "$RUNNER_TEMP/handoff"
          cp "$PROBE" "$RUNNER_TEMP/handoff/$PROBE_NAME"
          test "$(sha256sum "$RUNNER_TEMP/handoff/$PROBE_NAME" | awk '{print $1}')" = "$PROBE_SHA256"
          echo "PROBE_NAME=$PROBE_NAME"
          echo "PROBE_SHA256=$PROBE_SHA256"
          echo 'PROBE_RUNTIME_INCLUSION=NO'
          echo 'PRODUCTION_DEPLOY=NOT_EXECUTED'
          echo 'FINAL_CLOSURE=NOT_EXECUTED'

      - name: Upload exact original Probe only
        uses: actions/upload-artifact@v4
        with:
          name: P04-V258-Asset-Relation-Delta-Forensic-Probe
          path: ${{ runner.temp }}/handoff/${{ env.PROBE_NAME }}
          if-no-files-found: error
          retention-days: 7
