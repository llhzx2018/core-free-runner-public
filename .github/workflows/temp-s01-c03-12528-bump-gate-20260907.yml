name: S01 C03 12528 Bump Gate
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c03-12528-bump-gate-20260907.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      BRANCH: ux/s01-c03-recovery-runtime-human-followup-20260907
      EXPECTED_HEAD: c457bd921a45442b60f2f4abac7e46cd8195c0dd
      EXPECTED_MAIN: 6d603409acf470865e3ca8474cd29bff7fdd0601
    steps:
      - name: Bump exact candidate and run release identity gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path
          exact = {
              'VERSION': [('1.25.27\n','1.25.28\n')],
              'src/vf-tool-m3u8.php': [
                  ('Version: 1.25.27','Version: 1.25.28'),
                  ("VF_TOOL_M3U8_VERSION', '1.25.27'","VF_TOOL_M3U8_VERSION', '1.25.28'"),
                  ("VF_TOOL_M3U8_ROUND', 'R251'","VF_TOOL_M3U8_ROUND', 'R252'"),
                  ('R251_S01_HUMAN_RECOVERY_LANGUAGE','R252_S01_FINAL_ADMIN_HUMAN_CLOSURE'),
              ],
          }
          test_files = [
              'tests/unit/dashboard-human-language-contract.php',
              'tests/unit/host-recovery-human-language-contract.php',
              'tests/unit/package-physical-locator-contract.php',
              'tests/unit/recovery-runtime-human-language-followup-contract.php',
              'tests/unit/settings-human-language-followup-contract.php',
              'tests/unit/update-refresh-policy-contract.php',
              'tests/unit/visible-console-v2-contract.php',
          ]
          for f in test_files:
              exact[f] = [
                  ('1.25.27','1.25.28'),
                  ('R251_S01_HUMAN_RECOVERY_LANGUAGE','R252_S01_FINAL_ADMIN_HUMAN_CLOSURE'),
                  ('R251','R252'),
              ]
          for name, reps in exact.items():
              p=Path(name); s=p.read_text()
              before=s
              for old,new in reps:
                  if old in s:
                      s=s.replace(old,new)
              if s==before:
                  raise SystemExit(f'NO_EXPECTED_CHANGE:{name}')
              p.write_text(s)
          PY
          test "$(cat VERSION)" = '1.25.28'
          grep -Fq 'Version: 1.25.28' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.28'" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R252'" src/vf-tool-m3u8.php
          grep -Fq 'R252_S01_FINAL_ADMIN_HUMAN_CLOSURE' src/vf-tool-m3u8.php
          if git grep -n -E '1\.25\.27|R251' -- VERSION src tests ':!docs' ':!CHANGELOG.md'; then
            echo 'FAIL_STALE_RELEASE_IDENTITY'; exit 1
          fi
          node --check src/admin/admin-s01-human-language-final.js
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/unit/settings-human-language-followup-contract.php
          php tests/unit/recovery-runtime-human-language-followup-contract.php
          php tests/unit/admin-human-language-contract.php
          php tests/unit/dashboard-human-language-contract.php
          php tests/unit/host-recovery-human-language-contract.php
          php tests/unit/package-physical-locator-contract.php
          php tests/unit/update-refresh-policy-contract.php
          php tests/unit/visible-console-v2-contract.php
          php tests/unit/bootstrap-upgrade-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          git diff --exit-code origin/main -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          python3 - <<'PY'
          import subprocess
          expected={
            'VERSION','src/vf-tool-m3u8.php','src/admin/admin-s01-human-language-final.js','src/admin/admin-s01-uiux-polish.php',
            'tests/unit/dashboard-human-language-contract.php','tests/unit/host-recovery-human-language-contract.php',
            'tests/unit/package-physical-locator-contract.php','tests/unit/recovery-runtime-human-language-followup-contract.php',
            'tests/unit/settings-human-language-followup-contract.php','tests/unit/update-refresh-policy-contract.php',
            'tests/unit/visible-console-v2-contract.php'
          }
          actual=set(subprocess.check_output(['git','diff','--name-only','origin/main']).decode().splitlines())
          if actual != expected:
              print('EXPECTED',sorted(expected)); print('ACTUAL',sorted(actual)); raise SystemExit('FAIL_EXACT_11_FILE_FENCE')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION src/vf-tool-m3u8.php tests/unit/dashboard-human-language-contract.php tests/unit/host-recovery-human-language-contract.php tests/unit/package-physical-locator-contract.php tests/unit/recovery-runtime-human-language-followup-contract.php tests/unit/settings-human-language-followup-contract.php tests/unit/update-refresh-policy-contract.php tests/unit/visible-console-v2-contract.php
          git commit -m 'release(S01-C03): prepare 1.25.28 admin UX closure'
          git push -q origin HEAD:"$BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          echo "C03_12528_HEAD=$(git rev-parse HEAD)"
          echo 'PASS_S01_C03_12528_BUMP_GATE'
