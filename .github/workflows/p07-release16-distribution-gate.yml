name: P07 Release16 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release16-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release16 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release16'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release16"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release16"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="3461782c9326bd599e841fa437477dabeb472f4c"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="867e5d99ba2eb6241caaafb94dc43753644cc2e4"' installers/p07.sh
          grep -Fq 'restore_failure_ui.sh' installers/p07-final.sh
          grep -Fq '## Restore-As SQLite Canonical Snapshot Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B48 | Restore-As Canonical SQLite / Safe Stage Diagnosis |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              manifest=root/name
              seen=set()
              for line in manifest.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  assert rel not in seen, (name, 'duplicate', rel)
                  seen.add(rel)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  actual=blob(path)
                  assert actual==expected, (name, rel, actual, expected)

          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          required={
              'BUILD_ID':'ce0d151cf279a96a778eab1bb80ae6b2ddf597a1',
              'bin/vfops-site-ui':'1849c1ccc94341d088795f88ffb5b5f15f764c20',
              'lib/restore_as.py':'cb4742ce004a46ba45070a9bf747cd2ba9437a44',
              'lib/restore_apply_core.py':'3cbd380fced394313490ebd1a4e7fa5b9f57bb84',
              'lib/verify.py':'57c208e1463584383dc540edc80d8e08a0083bf9',
              'lib/restore_failure_ui.sh':'88f27f186bee9f516a7e50ac67898701f15cf7ed',
          }
          for rel, expected in required.items():
              assert f'{expected}  {rel}' in runtime, rel
          PY

      - name: Release16 Restore-As SQLite contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'failure_stage = "SQLITE_SNAPSHOT_RESTORE"' "$root/lib/restore_as.py"
          grep -Fq 'restore_apply.restore_sqlite(package_dir, manifest, staged_site, source_site_root)' "$root/lib/restore_as.py"
          grep -Fq 'sqlite_archive_excluded_paths' "$root/lib/verify.py"
          grep -Fq 'rel + suffix' "$root/lib/verify.py"
          grep -Fq '?mode=ro&immutable=1' "$root/lib/verify.py"
          grep -Fq 'for suffix in ("-wal", "-shm", "-journal")' "$root/lib/restore_apply_core.py"
          grep -Fq '?mode=ro&immutable=1' "$root/lib/restore_apply_core.py"
          grep -Fq 'SQLITE_SNAPSHOT_RESTORE)' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'SQLite 数据库快照恢复没有完成' "$root/lib/restore_failure_ui.sh"
          grep -Fq 'APPLICATION_CONFIG_REMAP)' "$root/lib/restore_failure_ui.sh"

      - name: Syntax and compile
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops"
          bash -n "$root/bin/vfops-site-ui"
          bash -n "$root/lib/terminal_ui.sh"
          bash -n "$root/lib/restore_failure_ui.sh"
          python3 -m py_compile             "$root/lib/restore_as.py"             "$root/lib/restore_apply.py"             "$root/lib/restore_apply_core.py"             "$root/lib/verify.py"             "$root/lib/package_core.py"

      - name: Public overlay Restore-As regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_release16_restore_as_sqlite             tests.test_restore_as             tests.test_release14_final_verify             tests.test_release13_mysql_snapshot             tests.test_release12_backup_freshness             tests.test_backup             tests.test_backup_frontend             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release16'
          grep -Fq 'lib/restore_failure_ui.sh' "$tmp/install/.runtime-manifest.gitblob"
          test -f "$tmp/install/lib/restore_failure_ui.sh"
          bash -n "$tmp/install/lib/restore_failure_ui.sh"

          test "$(cat "$tmp/install/BUILD_ID")" = '0.1.0-release16'

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Beginner Restore-As failure-stage contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          tmp="$(mktemp -d)"
          cat >"$tmp/sqlite.err" <<'EOF'
          ERROR: Restore-As failed; stage=SQLITE_SNAPSHOT_RESTORE; reason=synthetic
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/sqlite.err'" >"$tmp/sqlite.out"
          grep -Fq 'SQLite 数据库快照恢复没有完成' "$tmp/sqlite.out"
          ! grep -Fq 'SQLITE_SNAPSHOT_RESTORE' "$tmp/sqlite.out"

          cat >"$tmp/mysql.err" <<'EOF'
          ERROR: Restore-As failed; stage=MYSQL_CREATE_IMPORT_VERIFY; reason=synthetic-secret-value
          EOF
          NO_COLOR=1 bash -c "source '$root/lib/terminal_ui.sh'; source '$root/lib/restore_failure_ui.sh'; render_restore_failure '$tmp/mysql.err'" >"$tmp/mysql.out"
          grep -Fq 'MySQL 数据库创建、导入或校验没有通过' "$tmp/mysql.out"
          ! grep -Fq 'synthetic-secret-value' "$tmp/mysql.out"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'DNS：未修改' "$root/bin/vfops-site-ui"
          grep -Fq '原网站：保留' "$root/bin/vfops-site-ui"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE16_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
