name: P01 V2.39.2 Published Docs Branch

on:
  push:
    branches:
      - gate/p01-v2392-published-docs-20260903
    paths:
      - '.github/workflows/p01-v2392-published-docs.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_P01_MAIN: 4f823f249c169af23a2a790b5d377d02d08a7309
      TARGET_BRANCH: docs/p01-v2392-published-20260903
    steps:
      - name: Require private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          echo 'PRIVATE_WRITE_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact P01 published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_P01_MAIN }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Verify live main and target branch absence
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$EXPECTED_P01_MAIN"
          LIVE_MAIN="$(git ls-remote "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/main | awk '{print $1}')"
          test "$LIVE_MAIN" = "$EXPECTED_P01_MAIN"
          if git ls-remote --exit-code "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo 'TARGET_BRANCH_ALREADY_EXISTS' >&2
            exit 81
          fi
          echo 'P01_V2392_PUBLISHED_DOCS_BASE=PASS'

      - name: Build exact five-file published checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          import json
          from pathlib import Path

          project = Path('VF_PROJECT.json')
          data = json.loads(project.read_text(encoding='utf-8'))
          assert data['production_version'] == '2.39.1'
          assert data['production_release']['version'] == '2.39.1'
          assert data['published_release']['version'] == '2.39.1'
          assert data['working_version'] == '2.39.2'
          assert data['target_release_version'] == '2.39.2'
          assert data['schema_version'] == '2026090201'

          frozen_production = json.dumps(data['production_release'], ensure_ascii=False, sort_keys=True)
          frozen_owner = json.dumps(data.get('owner_production_activation_evidence'), ensure_ascii=False, sort_keys=True)
          frozen_model = json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True)

          data['status'] = 'V2.39.2 PUBLISHED / ONLINE UPDATE AVAILABLE / PRODUCTION V2.39.1'
          data['current_phase'] = 'V2.39.2 PUBLISHED / OWNER PRODUCTION UPDATE PENDING'
          data['published_release'] = {
              'version': '2.39.2',
              'tag': 'v2.39.2',
              'release_id': 381483161,
              'release_source': '4f823f249c169af23a2a790b5d377d02d08a7309',
              'formal_tree': 'eaa19b26a130ed78d6670ebac024a79d0bdefd43',
              'runtime_tree': '6aba779e61fe6c55c3806baea61e81a30a35b663',
              'source_schema_version': '2026090201',
              'schema_version': '2026090201',
              'migration': None,
              'live_core_updates_commit': '1a348b943f82bd16aa5c80f795100c22aaa69ffb',
              'live_online_next_hop': '2.39.1 -> 2.39.2',
              'online_asset': 'VF_Start_V2.39.2_UPDATE.zip',
              'online_asset_bytes': 1312853,
              'online_asset_sha256': '1d998ccf5544317bb1451224b87d2323cbdcb501b217c2d31edd74972b64a46d',
              'full_asset': 'VF-Start-V2.39.2-FULL.zip',
              'full_asset_bytes': 620308,
              'full_asset_sha256': '51fa95a748c7bc1a7f76d416699e54135823847ab6f7bfbcb270f7f52aaf8b95',
              'repair_asset': 'repair-v2.39.2.php',
              'repair_asset_bytes': 3821401,
              'repair_asset_sha256': '8673cd0871f38497a29a74aa34d15e7720a3f49b3bb7c1b348bc25f6e6b5195b',
              'published_at': '2026-09-02T18:25:34Z',
              'release_state': 'PUBLISHED / OWNER PRODUCTION V2.39.1 / UPDATE AVAILABLE',
              'assistant_production_write': False,
              'production_closure': 'PENDING OWNER UPDATE / CURRENT + LATEST + HISTORY READBACK',
              'formal_update_hop': '2.39.1 -> 2.39.2',
              'formal_artifact_gate': 33666893274,
              'release_publish_gate': 33667099823,
              'core_updates_manifest_gate': 33667435640,
              'core_updates_latest_promotion_pr': 52,
              'core_updates_latest_promotion_commit': '1a348b943f82bd16aa5c80f795100c22aaa69ffb',
              'online_channel_state': 'V2.39.1 -> V2.39.2 AVAILABLE'
          }
          change = dict(data.get('current_change') or {})
          change.update({
              'release_completed': True,
              'owner_production_activation': False,
              'production_closure_complete': False,
              'formal_bind_gate': 33666418883,
              'formal_artifact_gate': 33666893274,
              'release_publish_gate': 33667099823,
              'core_updates_manifest_gate': 33667435640,
              'core_updates_promotion_pr': 52,
              'core_updates_promotion_commit': '1a348b943f82bd16aa5c80f795100c22aaa69ffb',
              'published_release_id': 381483161,
              'production_write': False,
              'runner_main_write': False,
          })
          data['current_change'] = change
          data['authority']['current_formal_release_evidence'] = 'docs/evidence/P01_V2.39.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260903.md'
          data['candidate_version'] = '2.39.2'
          data['candidate_schema_version'] = '2026090201'
          data['candidate_state'] = 'NONE / V2.39.2 PUBLISHED'
          data['formal_release_state'] = 'V2.39.2 PUBLISHED / ONLINE UPDATE AVAILABLE / OWNER PRODUCTION V2.39.1'
          data['current_authority'] = 'Owner Production V2.39.1 OBSERVED / Published Latest V2.39.2 / Online Update Available'
          data['next_action'] = 'Owner updates Production V2.39.1 → V2.39.2, then read back Current / Latest / Update History and run real five-group + Managed Projects Production acceptance. No Assistant Production write.'

          assert json.dumps(data['production_release'], ensure_ascii=False, sort_keys=True) == frozen_production
          assert json.dumps(data.get('owner_production_activation_evidence'), ensure_ascii=False, sort_keys=True) == frozen_owner
          assert json.dumps(data['product_model'], ensure_ascii=False, sort_keys=True) == frozen_model
          assert data['production_version'] == '2.39.1'
          assert data['schema_version'] == '2026090201'
          project.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          current = Path('docs/authority/CURRENT.md')
          current_block = '\n'.join([
              '<!-- P01_V2392_PUBLISHED_CURRENT -->',
              '## V2.39.2 Published · Online Update Available · Owner Production V2.39.1 · 2026-09-03',
              '',
              '- Published Latest：`V2.39.2`；Owner Production：`V2.39.1`（本轮 Assistant 未写 Production）。',
              '- Unified Groups / Managed Projects exact product Gate：Run `33664600898` = `PASS`；Promotion PR `#235` 已合并。',
              '- Formal Source：`4f823f249c169af23a2a790b5d377d02d08a7309`；Formal Tree：`eaa19b26a130ed78d6670ebac024a79d0bdefd43`；Runtime Tree：`6aba779e61fe6c55c3806baea61e81a30a35b663`。',
              '- Release：`v2.39.2` / ID `381483161`；Published At：`2026-09-02T18:25:34Z`。',
              '- UPDATE：`VF_Start_V2.39.2_UPDATE.zip` = `1312853 bytes` / `sha256:1d998ccf5544317bb1451224b87d2323cbdcb501b217c2d31edd74972b64a46d`。',
              '- FULL：`620308 bytes` / `sha256:51fa95a748c7bc1a7f76d416699e54135823847ab6f7bfbcb270f7f52aaf8b95`；repair：`3821401 bytes` / `sha256:8673cd0871f38497a29a74aa34d15e7720a3f49b3bb7c1b348bc25f6e6b5195b`。',
              '- Schema：`2026090201 → 2026090201`；Migration：`NONE`。',
              '- Formal Bind：Run `33666418883` = `PASS`；Formal Artifact / Strict Fresh / rollback / hard-interruption recovery / idempotency：Run `33666893274` = `PASS`；Frozen Release remote readback：Run `33667099823` = `PASS`。',
              '- `core-updates` Manifest Gate：Run `33667435640` = `PASS`；PR `#52` / Merge `1a348b943f82bd16aa5c80f795100c22aaa69ffb` 已发布严格单跳 `V2.39.1 → V2.39.2`。',
              '- Assistant Production Write：`NO`；V2.39.2 Production Closure 必须等待 Owner 实际升级并回读 Current / Latest / History，然后执行真实五组往返与 Managed Projects 验收。',
              '- Kewaro P01–P06 转换仍需 Owner 在真实 Production 显式执行；任何站点/仓库退役或删除仍未授权。',
              '',
              '**Current Truth：V2.39.2 Formal Release + Online Update Channel = COMPLETE；Owner Production 仍为 V2.39.1，下一步是 Owner 执行 V2.39.1 → V2.39.2。**',
              '',
          ])
          current.write_text(current_block + current.read_text(encoding='utf-8'), encoding='utf-8')

          handoff = Path('docs/handoff/CURRENT_STATE.md')
          handoff_block = '\n'.join([
              '> **Current Published Truth · 2026-09-03**',
              '> V2.39.2 已正式发布并开放严格单跳 `V2.39.1 → V2.39.2` 在线更新；Owner Production 当前仍为 V2.39.1。Schema 保持 `2026090201`，无 Migration。该补丁收口 Unified Resource Groups / Managed Projects 的 dormant state、Projects 独立排序、URL-less retired Project 边界与真实验收前缺口；Production Closure 必须等待 Owner 实际升级与 Current / Latest / History 回读，并继续真实五组/Projects 验收；Assistant Production Write = NO。',
              '',
          ])
          handoff.write_text(handoff_block + handoff.read_text(encoding='utf-8'), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_block = '\n'.join([
              '## V2.39.2 · Published / Owner Production V2.39.1',
              '',
              '- Unified Resource Groups + Managed Projects Production Acceptance 修复正式发布。',
              '- 五组 dormant state、封面/Hosted Topic HTML 持久性、Projects-only 排序、URL-less retired Project 边界与项目删除/恢复工作流完成机器收口。',
              '- Schema `2026090201 → 2026090201`；Migration `NONE`。',
              '- Unified Groups Gate `33664600898` PASS；Formal Artifact `33666893274` PASS；Release readback `33667099823` PASS；core-updates Manifest Gate `33667435640` PASS。',
              '- GitHub Release `381483161`；严格在线更新只允许 `V2.39.1 → V2.39.2`。',
              '- Owner Production 仍为 V2.39.1；Assistant 未写 Production，Production Closure 待 Owner 升级后回读并执行真实五组/Projects 验收。',
              '- Kewaro 站点/仓库退役或删除未授权。',
              '',
          ])
          changelog.write_text(changelog_block + changelog.read_text(encoding='utf-8'), encoding='utf-8')

          evidence = Path('docs/evidence/P01_V2.39.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260903.md')
          evidence_lines = [
              '# P01 · VF Start V2.39.2 · Published / Pending Owner Production',
              '',
              '- Status: `PUBLISHED / ONLINE UPDATE AVAILABLE / OWNER PRODUCTION V2.39.1`',
              '- Product Gate: `33664600898 / PASS`',
              '- Promotion PR: `#235`',
              '- Formal Bind Gate: `33666418883 / PASS`',
              '- Formal Source: `4f823f249c169af23a2a790b5d377d02d08a7309`',
              '- Formal Tree: `eaa19b26a130ed78d6670ebac024a79d0bdefd43`',
              '- Runtime Tree: `6aba779e61fe6c55c3806baea61e81a30a35b663`',
              '- Formal Artifact Gate: `33666893274 / PASS`',
              '- Frozen Artifact: `9860931126` / `sha256:7c146c8d5d0c291701726e0a5b7aaf161255fdbb3258e8ba851fe8f12e68f4c6`',
              '- Release Publish / Remote Readback: `33667099823 / PASS`',
              '- Release: `v2.39.2` / ID `381483161` / Published `2026-09-02T18:25:34Z`',
              '- UPDATE: `1312853 bytes` / `sha256:1d998ccf5544317bb1451224b87d2323cbdcb501b217c2d31edd74972b64a46d`',
              '- FULL: `620308 bytes` / `sha256:51fa95a748c7bc1a7f76d416699e54135823847ab6f7bfbcb270f7f52aaf8b95`',
              '- repair: `3821401 bytes` / `sha256:8673cd0871f38497a29a74aa34d15e7720a3f49b3bb7c1b348bc25f6e6b5195b`',
              '- Schema: `2026090201 -> 2026090201` / Migration `NONE`',
              '- core-updates Manifest Gate: `33667435640 / PASS`',
              '- core-updates PR: `#52` / Merge `1a348b943f82bd16aa5c80f795100c22aaa69ffb`',
              '- Online next hop: `2.39.1 -> 2.39.2` ONLY',
              '- Owner Production: `2.39.1`',
              '- Assistant Production Write: `NO`',
              '',
              'Remaining Production gates after Owner upgrade:',
              '1. Current / Latest / Footer / Update History readback.',
              '2. Real existing resource five-group round trip and dormant-state/asset persistence.',
              '3. Managed Projects add/edit/cover/status/order/delete/recovery and URL-less retired Project.',
              '4. Explicit Owner Kewaro P01–P06 conversion and second-run idempotency.',
              '5. Owner confirmation that Projects workspace satisfies daily use.',
              '',
              'No Kewaro site/repository retirement or destructive action is authorized by this release.',
          ]
          evidence.write_text('\n'.join(evidence_lines) + '\n', encoding='utf-8')
          PY

          python3 -m json.tool VF_PROJECT.json >/dev/null
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          mapfile -t expected < <(printf '%s\n' CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.39.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260903.md docs/handoff/CURRENT_STATE.md | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          test "$(python3 -c "import json;d=json.load(open('VF_PROJECT.json'));print(d['production_version'])")" = '2.39.1'
          test "$(python3 -c "import json;d=json.load(open('VF_PROJECT.json'));print(d['published_release']['version'])")" = '2.39.2'
          test "$(cat src/VERSION.txt)" = '2.39.2'
          echo 'P01_V2392_PUBLISHED_DOCS_SCOPE=PASS'

      - name: Commit and push private docs branch only
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd p01
          LIVE_MAIN="$(git ls-remote "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/main | awk '{print $1}')"
          test "$LIVE_MAIN" = "$EXPECTED_P01_MAIN"
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CHANGELOG.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.39.2_PUBLISHED_PENDING_OWNER_PRODUCTION_20260903.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): record V2.39.2 published checkpoint'
          DOCS_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_P01_MAIN"
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 5
          git push "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          REMOTE="$(git ls-remote "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$REMOTE" = "$DOCS_HEAD"
          echo "P01_V2392_PUBLISHED_DOCS_HEAD=$DOCS_HEAD"
          echo 'P01_V2392_RUNNER_MAIN_WRITE=NO'

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf p01
          test ! -e p01
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
