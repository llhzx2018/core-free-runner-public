name: P01 L2 Browser Helper 1.6.5 Daily Loop
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-browser-helper-165-daily-loop-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2365-candidate-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-browser-helper-165-daily-loop-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 564b437fdeb13d3fe09c033d08fdd0518779e98e
          test "$(git -C product rev-parse origin/develop)" = 564b437fdeb13d3fe09c033d08fdd0518779e98e
      - name: Apply component patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_browser_helper_165_daily_loop_patch.py
      - name: Verify exact component contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          node --check src/browser-extension/background.js
          node --check src/browser-extension/popup.js
          python3 -m json.tool src/browser-extension/manifest.json >/dev/null
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          test "$(python3 -c "import json;print(json.load(open('src/browser-extension/manifest.json'))['version'])")" = 1.6.5
          test "$(python3 -c "import json;print(json.load(open('VF_PROJECT.json'))['component_versions']['browser_helper'])")" = 1.6.5
          grep -F "/links-admin.php?view=pending" src/browser-extension/background.js >/dev/null
          ! grep -F '/#/pending' src/browser-extension/background.js >/dev/null
          grep -F "details.reason==='install'" src/browser-extension/background.js >/dev/null
          grep -F 'configured:!!(c.siteUrl&&c.token)' src/browser-extension/background.js >/dev/null
          grep -F "saveButton.textContent=invalid?'重新连接 VF Start':'连接 VF Start'" src/browser-extension/popup.js >/dev/null
          grep -F "if(!connectionReady){chrome.runtime.openOptionsPage();window.close();return;}" src/browser-extension/popup.js >/dev/null
          grep -F '>连接并保存</button>' src/browser-extension/options.html >/dev/null
          grep -F 'V1.6.5' src/browser-extension/README.md >/dev/null
          test "$(git diff --name-only -- src/VERSION.txt database src/migrations | wc -l | tr -d ' ')" = 0
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' VF_PROJECT.json src/browser-extension/README.md src/browser-extension/background.js src/browser-extension/manifest.json src/browser-extension/options.html src/browser-extension/popup.js | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          echo 'BROWSER HELPER 1.6.5 DAILY LOOP PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json src/browser-extension/README.md src/browser-extension/background.js src/browser-extension/manifest.json src/browser-extension/options.html src/browser-extension/popup.js
          git commit -m 'fix(P01): close browser helper 1.6.5 daily loop'
          git push origin HEAD:product/p01-browser-helper-165-daily-loop-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
