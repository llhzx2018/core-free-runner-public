name: P01 V2.47.279 Core Updates Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247279-core-updates-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.279 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Clone exact candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin b81f5771681217fe5acf68bfc7af3fbdf5712168
          git -C candidate checkout -q --detach b81f5771681217fe5acf68bfc7af3fbdf5712168
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Verify identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.278" and
            .target_version=="2.47.279" and
            .from_versions==["2.47.278"] and
            .release_id==406309336 and
            .product_identity=="ffbb50140f935fdf59a5bbed1b6e72257470ccd0" and
            .asset_name=="VF_Start_V2.47.279_UPDATE.zip" and
            .asset_bytes==2360327 and
            .asset_sha256=="9c9f6e1c4cf613b52d4cbf21b809ae5a56ad48679813e18ffc7879cb22ae8a99" and
            (.notes|contains("积压推进过慢")) and
            (.notes|contains("正在补跑和待处理数量"))
          ' projects/P01.json >/dev/null
          echo P01_V247279_MANIFEST_IDENTITY=PASS
      - name: Verify bounded delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
