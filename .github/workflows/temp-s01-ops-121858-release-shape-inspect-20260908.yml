name: temp-s01-ops-121858-release-shape-inspect-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-121858-release-shape-inspect-20260908.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ASSET: vf-tools-ops_V1.21.858.zip
    steps:
      - name: Inspect exact prior release asset
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'INSPECT_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops858 && mkdir -p /tmp/ops858
          gh release download v1.21.858 --repo llhzx2018/vf-tools-ops --pattern "$ASSET" --dir /tmp/ops858
          test "$(stat -c %s /tmp/ops858/$ASSET)" = '3340234'
          test "$(sha256sum /tmp/ops858/$ASSET|awk '{print $1}')" = '9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a'
          python3 - <<'PY'
          import zipfile,collections,os,hashlib
          p='/tmp/ops858/'+os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              roots=collections.Counter(n.split('/')[0] for n in names)
              second=collections.Counter('/'.join(n.split('/')[:2]) for n in names if '/' in n)
              print('ZIP_FILES=',len(names),sep='')
              print('ROOTS_BEGIN')
              for k,v in sorted(roots.items()): print(k,v)
              print('ROOTS_END')
              print('SECOND_LEVEL_BEGIN')
              for k,v in sorted(second.items()): print(k,v)
              print('SECOND_LEVEL_END')
              probes=['vf-ops/VERSION','vf-ops/vf-ops.php','vf-ops/AGENTS.md','vf-ops/README.md','vf-ops/tests/dashboard-selector-hit-contract.php','vf-ops/assets/css/current/admin-current-dashboard.css']
              for q in probes: print('HAS',q,int(q in names))
              print('FIRST_FILES_BEGIN')
              for n in sorted(names)[:80]: print(n)
              print('FIRST_FILES_END')
          PY
          echo 'PASS_S01_C02_121858_RELEASE_SHAPE_INSPECT'
