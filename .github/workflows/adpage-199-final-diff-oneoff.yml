name: adpage-199-final-diff-only
on:
  pull_request:
    paths:
      - '.github/workflows/adpage-199-final-diff-oneoff.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout runner baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private GOV-DOC exact source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 73264412509c50b31c941f4a410b1d835756b75e
          path: .private-gov
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Prove unchanged executable tests and final PR impact
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT,TESTING,SECURITY,UA_UI
            IMPACT_REASON: V1.1 candidate introduces production-only landing-page rules and executable tests that block visitor-visible development/demo/test copy, unavailable CTA destinations, broken assets and nonmatching ZIP packages; sealed 13 public bodies and all existing Current/Distribution pointers stay unchanged.
        run: |
          set -euo pipefail
          cd .private-gov
          test "$(git rev-parse HEAD)" = '73264412509c50b31c941f4a410b1d835756b75e'
          git cat-file -e 'a1d783e31e6e22b037f0d9140a8046f25da210fc^{commit}'
          git cat-file -e '470e28a829a4883867717e553b3d0e4d5f172810^{commit}'
          echo 'EXACT_SOURCE_CHECK=PASS'
          python3 -B - <<'PY'
          import subprocess, pathlib
          prior = '470e28a829a4883867717e553b3d0e4d5f172810'
          premerge = '62a0f04fada5cf1def8bce4742bc8f5cf973fe75'
          current = '73264412509c50b31c941f4a410b1d835756b75e'
          modified = sorted(subprocess.check_output(['git','diff','--name-only',prior,premerge],text=True).splitlines())
          expected = sorted(['skills/skill-adpage/V1.1/SKILL.md','skills/skill-adpage/V1.1/references/ACCEPTANCE.md'])
          if modified != expected: raise SystemExit('SOURCE_SCOPE_CHANGED_UNEXPECTEDLY')
          after_merge=subprocess.check_output(['git','diff','--name-only',premerge,current,'--','skills/skill-adpage/V1.1'],text=True).splitlines()
          if after_merge: raise SystemExit('V1_1_CODE_CHANGED_DURING_MAIN_RECONCILIATION')
          readme=pathlib.Path('skills/README.md').read_text(encoding='utf-8')
          if '| skill-release | V3.16 |' not in readme or 'skill-adpage V1.1' not in readme: raise SystemExit('CURRENT_SKILL_INDEX_MISMATCH')
          s=pathlib.Path('skills/skill-adpage/V1.1/SKILL.md').read_text(encoding='utf-8')
          a=pathlib.Path('skills/skill-adpage/V1.1/references/ACCEPTANCE.md').read_text(encoding='utf-8')
          if '\\n\\n' in s or '看提示是否从隐藏变可见' in s or '演示提示从隐藏到显示' in a:
              raise SystemExit('STALE_DEMO_INSTRUCTION_REMAINS')
          if 'BLOCKED_REAL_CTA' not in s or '交付前主验收：实际触发正式 CTA 点击事件' not in s:
              raise SystemExit('LIVE_CONTRACT_MISSING')
          print('ONLY_DOCUMENTATION_CHANGED_SINCE_38_TEST_PASS=PASS')
          PY
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 'a1d783e31e6e22b037f0d9140a8046f25da210fc' --git-head '73264412509c50b31c941f4a410b1d835756b75e'
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 'a1d783e31e6e22b037f0d9140a8046f25da210fc' --git-head '73264412509c50b31c941f4a410b1d835756b75e'
          python3 -B governance/catalog/tools/doc_structure_lint.py
          echo 'FINAL_PR_GIT_IMPACT_AND_STRUCTURE=PASS'
      - name: Clean private checkout
        if: always()
        run: |
          rm -rf -- .private-gov
          echo 'PRIVATE_SOURCE_CLEANUP=ATTEMPTED'
