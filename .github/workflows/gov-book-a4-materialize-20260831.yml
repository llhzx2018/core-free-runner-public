name: GOV-BOOK A3 Exact Binary Materialize 20260831

on:
  push:
    branches:
      - task/gov-book-a4-materialize-20260831
    paths:
      - '.github/workflows/gov-book-a4-materialize-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-book-binary-materialize-20260831
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_SOURCE_REPO: llhzx2018/core-free-runner-private
      PRIVATE_SOURCE_SHA: 25e9c5597e50f263c287e771d8c81163805d5d4f
      TARGET_REPO: llhzx2018/gov-book
      TARGET_DEVELOP_SHA: 3270c3f0c5ba29ce4ecc54cb11a16200961e553f
      TARGET_MAIN_SHA: e89b0b98dd657e19187940e859fe9e5161df750e
      BOOK_ID: A3
      XZ_SHA256: c93e1de102b8b22a8631ceb48e0c8696443329640991fdd15c1cdc1b167f40ef
      XZ_SIZE: '140588'
      ZIP_SHA256: 936b7576b882e0e7db7e1559b44f2cb52b6bee80fd477cabf2628abac8f4b92a
      ZIP_SIZE: '145204'
      TARGET_PATH: downloads/A3/v0.9.0/A3_网站案例拆解_v0.9.0_中文版_PARTIAL.zip
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Require registered VF capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'REGISTERED_VF_CAPABILITIES=PASS'

      - name: Checkout exact private task input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-private
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-input

      - name: Rebuild and verify exact A3 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-input rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, zipfile
          q = pathlib.Path('private-input/queue/gov-book-20260831/A3')
          spec = json.loads((q/'READY.json').read_text(encoding='utf-8'))
          assert spec['book_id'] == os.environ['BOOK_ID']
          assert spec['payload_sha256'] == os.environ['ZIP_SHA256']
          assert spec['payload_size_bytes'] == int(os.environ['ZIP_SIZE'])
          assert spec['xz_sha256'] == os.environ['XZ_SHA256']
          assert spec['xz_size_bytes'] == int(os.environ['XZ_SIZE'])
          assert spec['expected_target_head'] == os.environ['TARGET_DEVELOP_SHA']
          assert spec['expected_main_head'] == os.environ['TARGET_MAIN_SHA']
          assert spec['target_path'] == os.environ['TARGET_PATH']
          pieces = []
          for c in spec['chunks']:
              path = q/c['path']
              data = path.read_bytes()
              assert len(data) == c['size']
              git_path = f"queue/gov-book-20260831/A3/{c['path']}"
              actual_blob = subprocess.check_output(['git','-C','private-input','rev-parse',f"HEAD:{git_path}"], text=True).strip()
              assert actual_blob == c['git_blob'], (git_path, actual_blob, c['git_blob'])
              pieces.append(data.decode('ascii'))
          encoded = ''.join(pieces)
          assert len(encoded.encode('ascii')) == spec['encoded_size_bytes']
          packed = base64.b64decode(encoded, validate=True)
          assert len(packed) == int(os.environ['XZ_SIZE'])
          assert hashlib.sha256(packed).hexdigest() == os.environ['XZ_SHA256']
          raw = lzma.decompress(packed)
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'A3.zip'
          out.write_bytes(raw)
          assert len(raw) == int(os.environ['ZIP_SIZE'])
          assert hashlib.sha256(raw).hexdigest() == os.environ['ZIP_SHA256']
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print('A3_PRIVATE_REBUILD_XZ_SHA256_ZIP_SHA256_CRC=PASS')
          PY

      - name: Checkout exact GOV-BOOK develop start
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-book
          ref: ${{ env.TARGET_DEVELOP_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: gov-book

      - name: Live ref gate and write A3 download only
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main develop
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          ACTUAL_DEVELOP="$(git rev-parse origin/develop)"
          echo "ACTUAL_MAIN=$ACTUAL_MAIN"
          echo "ACTUAL_DEVELOP=$ACTUAL_DEVELOP"
          test "$ACTUAL_MAIN" = "$TARGET_MAIN_SHA"
          test "$ACTUAL_DEVELOP" = "$TARGET_DEVELOP_SHA"
          mkdir -p "$(dirname "$TARGET_PATH")"
          cp "$RUNNER_TEMP/A3.zip" "$TARGET_PATH"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['TARGET_PATH'])
          assert p.stat().st_size == int(os.environ['ZIP_SIZE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['ZIP_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          PY
          git add -f -- "$TARGET_PATH"
          changed="$(git -c core.quotepath=false diff --cached --name-only)"
          echo "STAGED_PATH=$changed"
          test "$changed" = "$TARGET_PATH"
          git config user.name 'VF Public Runner'
          git config user.email 'runner@users.noreply.github.com'
          git commit -m 'content(book): materialize exact A3 Chinese download'
          git push origin HEAD:develop

      - name: Exact remote readback gate
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin develop
          REMOTE_HEAD="$(git rev-parse origin/develop)"
          git show "origin/develop:$TARGET_PATH" > "$RUNNER_TEMP/A3-remote.zip"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'A3-remote.zip'
          assert p.stat().st_size == int(os.environ['ZIP_SIZE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['ZIP_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('A3_REMOTE_EXACT_READBACK=PASS')
          PY
          echo "GOV_BOOK_DEVELOP_RESULT=$REMOTE_HEAD"
          echo 'MAIN_WRITE=NO'
          echo 'PRIVATE_SOURCE_PERSISTED_PUBLIC=NO'
