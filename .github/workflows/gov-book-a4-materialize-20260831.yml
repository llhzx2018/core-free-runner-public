name: GOV-BOOK Six-Book Exact Audit 20260901

on:
  push:
    branches:
      - task/gov-book-a4-materialize-20260831
    paths:
      - '.github/workflows/gov-book-a4-materialize-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-book-binary-materialize-20260831
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_DEVELOP_SHA: 3648d84fe0b95dc522d2e9c3f2e8a9ace4bc1b23
      TARGET_MAIN_SHA: e89b0b98dd657e19187940e859fe9e5161df750e
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered GOV-BOOK read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'REGISTERED_GOV_BOOK_READ_CAPABILITY=PASS'

      - name: Checkout exact GOV-BOOK develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-book
          ref: ${{ env.TARGET_DEVELOP_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Lock live refs
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN_SHA"
          test "$(git rev-parse origin/develop)" = "$TARGET_DEVELOP_SHA"
          echo 'LIVE_GIT_AUTHORITY_GATE=PASS'

      - name: Audit six exact ZIPs manifests and Git blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile

          root=pathlib.Path('.')
          catalog=json.loads((root/'BOOK_CATALOG.json').read_text(encoding='utf-8'))
          books=[b for b in catalog['books'] if b.get('book_version')]
          assert [b['book_id'] for b in books] == ['A1','A2','A3','A4','B1','B2']
          expected_qualification={
              'A1':'PASS','A2':'PARTIAL','A3':'PARTIAL',
              'A4':'PARTIAL','B1':'PASS','B2':'PASS'
          }

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          for b in books:
              book_id=b['book_id']
              ver=b['book_version']
              assert b['qualification']==expected_qualification[book_id]
              zip_path=root/b['download_path']
              zip_bytes=zip_path.read_bytes()
              assert sha(zip_bytes)==b['delivery_sha256'],(book_id,'ZIP_SHA')
              with zipfile.ZipFile(zip_path) as z:
                  assert z.testzip() is None,(book_id,'ZIP_CRC')
                  names=[n for n in z.namelist() if not n.endswith('/')]
                  for n in names:
                      p=pathlib.PurePosixPath(n)
                      assert not p.is_absolute() and '..' not in p.parts,(book_id,'UNSAFE_ZIP_MEMBER',n)

                  base=root/'books'/book_id/'versions'/ver
                  manifest_path=base/'SOURCE_MANIFEST.json'
                  manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
                  assert manifest['artifact_sha256']==b['delivery_sha256'],(book_id,'MANIFEST_ARTIFACT_SHA')
                  assert manifest['qualification']==b['qualification'],(book_id,'MANIFEST_QUALIFICATION')
                  entries=manifest['files']
                  manifest_paths=[x['path'] for x in entries]
                  assert len(manifest_paths)==len(set(manifest_paths)),(book_id,'DUPLICATE_MANIFEST_PATH')
                  reader=base/'reader'
                  actual_paths=sorted(str(p.relative_to(reader)).replace('\\','/') for p in reader.rglob('*') if p.is_file())
                  missing_paths=sorted(set(manifest_paths)-set(actual_paths))
                  extra_paths=sorted(set(actual_paths)-set(manifest_paths))
                  assert not missing_paths,(book_id,'MANIFEST_READER_MISSING',missing_paths)
                  print('READER_NON_MANIFEST_FILES='+json.dumps({
                      'book_id':book_id,'paths':extra_paths
                  },ensure_ascii=False,separators=(',',':')))

                  for item in entries:
                      rel=item['path']
                      git_path=f"books/{book_id}/versions/{ver}/reader/{rel}"
                      blob=subprocess.check_output(['git','show',f'HEAD:{git_path}'])
                      assert len(blob)==item['size_bytes'],(book_id,rel,'GIT_BLOB_SIZE')
                      assert sha(blob)==item['sha256'],(book_id,rel,'GIT_BLOB_SHA')
                      matching=[]
                      for n in names:
                          if n==rel or n.endswith('/'+rel):
                              data=z.read(n)
                              if len(data)==item['size_bytes'] and sha(data)==item['sha256']:
                                  matching.append(n)
                      assert matching,(book_id,rel,'NO_EXACT_ZIP_MEMBER')
                  print('SIX_BOOK_ENTRY_EXACT='+json.dumps({
                      'book_id':book_id,'version':ver,'qualification':b['qualification'],
                      'zip_sha256':b['delivery_sha256'],'manifest_files':len(entries)
                  },ensure_ascii=False,separators=(',',':')))

          assert catalog['full_reader_source_adoption']=='COMPLETE_6_OF_6'
          assert catalog['full_reader_source_exact']=='PASS_6_OF_6'
          assert catalog['remote_download_exact']=='PASS_6_OF_6'
          assert catalog['direct_github_download']=='AVAILABLE'
          for book_id in ['A2','B2']:
              b=next(x for x in books if x['book_id']==book_id)
              assert b['exact_byte_source_status']=='COMPLETE_EXACT'
              assert b['full_reader_source_status']=='COMPLETE_EXACT'
              assert b['download_status']=='REMOTE_EXACT_VERIFIED'

          status_paths=[
              'CURRENT.md','SOURCE_ADOPTION_STATUS.md','DOWNLOAD_DISTRIBUTION_STATUS.md',
              'downloads/A2/CURRENT.md','downloads/B2/CURRENT.md'
          ]
          status_text='\n'.join((root/p).read_text(encoding='utf-8') for p in status_paths)
          for marker in ['PASS_4_OF_6','NOT_YET_AVAILABLE','PENDING_EXACT_PAYLOAD','IN_PROGRESS_4_OF_6_EXACT']:
              assert marker not in status_text,('STALE_CURRENT_MARKER',marker)
          for marker in ['PASS_6_OF_6','COMPLETE_6_OF_6','REMOTE_EXACT_VERIFIED','COMPLETE_EXACT']:
              assert marker in status_text,('MISSING_CLOSURE_MARKER',marker)

          for p in ['README.md','books/README.md','downloads/README.md']:
              text=(root/p).read_text(encoding='utf-8')
              for marker in ['PASS_4_OF_6','PASS_6_OF_6','NOT_YET_AVAILABLE','PENDING_EXACT_PAYLOAD']:
                  assert marker not in text,('README_RUNTIME_SNAPSHOT',p,marker)
          assert '不保存 Runtime' in (root/'README.md').read_text(encoding='utf-8')
          assert '不复制 Source、Distribution' in (root/'books/README.md').read_text(encoding='utf-8')
          assert '不复制动态分发状态' in (root/'downloads/README.md').read_text(encoding='utf-8')

          for book_id in ['A1','A2','A3','A4','B1','B2']:
              text=(root/'books'/book_id/'CURRENT.md').read_text(encoding='utf-8')
              assert 'EXACT_BYTE_SOURCE_ADOPTION    = COMPLETE_EXACT' in text
              assert 'FULL_READER_PRODUCT_ADOPTION  = COMPLETE_EXACT' in text
              assert 'REMOTE_DOWNLOAD               = EXACT_VERIFIED' in text

          assert catalog['books'][2]['qualification']=='PARTIAL'
          assert catalog['books'][3]['qualification']=='PARTIAL'
          print('REMOTE_DOWNLOAD_EXACT=PASS_6_OF_6')
          print('FULL_READER_SOURCE_EXACT=PASS_6_OF_6')
          print('SIX_BOOK_SOURCE_MANIFEST_GIT_BLOB_AUDIT=PASS')
          print('A3_QUALIFICATION=PARTIAL_UNCHANGED')
          print('A4_QUALIFICATION=PARTIAL_UNCHANGED')
          print('PRODUCT_CORRECTION=NO')
          print('OWNER_PREVIEW_RUNTIME_APPLICABILITY=N/A_BOOK_REPOSITORY_CLOSURE')
          print('NO_INVALID_DYNAMIC_SNAPSHOT=YES')
          print('NO_HISTORICAL_STATE_AS_CURRENT=YES')
          print('NO_DUPLICATE_CURRENT_TRUTH=YES')
          print('DISTRIBUTION_STATE_CANONICAL=YES')
          print('PRODUCTION_STATE_CANONICAL=N/A_BOOK_REPOSITORY')
          print('README_NOT_RUNTIME_AUTHORITY=YES')
          print('REMOTE_READBACK_PASS=YES')
          print('SOURCE_IDENTITY_DRIFT=NO')
          print('PRE_RELEASE_AUTHORITY_GATE=PASS')
          PY

      - name: Confirm main stayed frozen
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN_SHA"
          test "$(git rev-parse origin/develop)" = "$TARGET_DEVELOP_SHA"
          echo 'MAIN_UNCHANGED=PASS'
          echo 'AUDIT_MODE=READ_ONLY'
