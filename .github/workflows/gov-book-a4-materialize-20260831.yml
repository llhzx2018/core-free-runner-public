name: GOV-BOOK Exact Reader Source Diagnostic 20260831

on:
  push:
    branches:
      - task/gov-book-a4-materialize-20260831
    paths:
      - '.github/workflows/gov-book-a4-materialize-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-book-binary-materialize-20260831
  cancel-in-progress: false

jobs:
  diagnose-reader-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_DEVELOP_SHA: c1570596f168cb78c8f137ffb855bb8dc9fef17e
      TARGET_MAIN_SHA: e89b0b98dd657e19187940e859fe9e5161df750e
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered target capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'TARGET_READ_CAPABILITY=PASS'

      - name: Checkout exact GOV-BOOK develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-book
          ref: ${{ env.TARGET_DEVELOP_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov-book

      - name: Live authority gate
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH=$(printf 'x-access-token:%s' "$VF_RELEASE_WRITE_TOKEN" | base64 -w0)
          REMOTE='https://github.com/llhzx2018/gov-book.git'
          MAIN=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote "$REMOTE" refs/heads/main | awk '{print $1}')
          DEVELOP=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" ls-remote "$REMOTE" refs/heads/develop | awk '{print $1}')
          echo "LIVE_MAIN=$MAIN"
          echo "LIVE_DEVELOP=$DEVELOP"
          test "$MAIN" = "$TARGET_MAIN_SHA"
          test "$DEVELOP" = "$TARGET_DEVELOP_SHA"
          echo 'LIVE_AUTHORITY_GATE=PASS'

      - name: Compare exact ZIP contents to Reader Source
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile

          root = pathlib.Path('.')
          catalog = json.loads((root/'BOOK_CATALOG.json').read_text(encoding='utf-8'))
          by_id = {b['book_id']: b for b in catalog['books'] if b.get('book_version')}
          ids = ['A1','A3','A4','B1']
          overall = {}

          def sha256_bytes(data): return hashlib.sha256(data).hexdigest()
          def sha256_file(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          for book_id in ids:
              b = by_id[book_id]
              ver = b['book_version']
              base = root/'books'/book_id/'versions'/ver
              manifest_path = base/'SOURCE_MANIFEST.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              zip_path = root/b['download_path']
              assert zip_path.exists(), (book_id, 'ZIP_MISSING', zip_path)
              zip_sha = sha256_file(zip_path)
              assert zip_sha == b['delivery_sha256'] == manifest['artifact_sha256'], (book_id, zip_sha, b['delivery_sha256'], manifest['artifact_sha256'])
              with zipfile.ZipFile(zip_path) as z:
                  assert z.testzip() is None
                  file_members=[n for n in z.namelist() if not n.endswith('/')]
                  rows=[]
                  counts={'existing_exact':0,'missing_recoverable':0,'existing_drift':0,'zip_member_not_found':0,'zip_member_ambiguous':0}
                  for item in manifest['files']:
                      rel=item['path']
                      target=base/'reader'/pathlib.PurePosixPath(rel)
                      exact_existing=False
                      existing_sha=None
                      existing_size=None
                      if target.exists():
                          existing_size=target.stat().st_size
                          existing_sha=sha256_file(target)
                          exact_existing=(existing_size==item['size_bytes'] and existing_sha==item['sha256'])
                      candidates=[n for n in file_members if n==rel or n.endswith('/'+rel)]
                      zip_member=None
                      zip_sha_member=None
                      zip_size_member=None
                      zip_exact=False
                      if len(candidates)==1:
                          zip_member=candidates[0]
                          data=z.read(zip_member)
                          zip_size_member=len(data)
                          zip_sha_member=sha256_bytes(data)
                          zip_exact=(zip_size_member==item['size_bytes'] and zip_sha_member==item['sha256'])
                      if exact_existing:
                          status='EXISTING_EXACT'; counts['existing_exact']+=1
                      elif target.exists():
                          status='EXISTING_DRIFT'; counts['existing_drift']+=1
                      elif len(candidates)==0:
                          status='ZIP_MEMBER_NOT_FOUND'; counts['zip_member_not_found']+=1
                      elif len(candidates)>1:
                          status='ZIP_MEMBER_AMBIGUOUS'; counts['zip_member_ambiguous']+=1
                      elif zip_exact:
                          status='MISSING_RECOVERABLE'; counts['missing_recoverable']+=1
                      else:
                          status='ZIP_MEMBER_HASH_MISMATCH'; counts['existing_drift']+=1
                      rows.append({
                          'path':rel,'status':status,
                          'target_exists':target.exists(),
                          'existing_size':existing_size,'existing_sha256':existing_sha,
                          'zip_member':zip_member,'zip_member_size':zip_size_member,'zip_member_sha256':zip_sha_member,
                          'manifest_size':item['size_bytes'],'manifest_sha256':item['sha256']
                      })
                  overall[book_id]={'zip_sha256':zip_sha,'zip_crc':'PASS','counts':counts,'rows':rows}
                  print('BOOK_SOURCE_DIAGNOSTIC='+json.dumps({book_id:overall[book_id]},ensure_ascii=False,separators=(',',':')))

          print('ALL_SOURCE_DIAGNOSTIC='+json.dumps(overall,ensure_ascii=False,separators=(',',':')))
          print('GOV_BOOK_WRITE=NO')
          print('MAIN_WRITE=NO')
          print('DEVELOP_WRITE=NO')
          PY
