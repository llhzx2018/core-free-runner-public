name: GOV-BOOK A3 Payload Diagnostic 20260831

on:
  push:
    branches:
      - task/gov-book-a4-materialize-20260831
    paths:
      - '.github/workflows/gov-book-a4-materialize-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-book-binary-materialize-20260831
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_SOURCE_SHA: 25e9c5597e50f263c287e771d8c81163805d5d4f
      EXPECTED_XZ_SHA256: c93e1de102b8b22a8631ceb48e0c8696443329640991fdd15c1cdc1b167f40ef
      EXPECTED_XZ_SIZE: '140588'
      EXPECTED_ZIP_SHA256: 936b7576b882e0e7db7e1559b44f2cb52b6bee80fd477cabf2628abac8f4b92a
      EXPECTED_ZIP_SIZE: '145204'
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Require private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          echo 'VF_PRIVATE_READ_CAPABILITY=PASS'

      - name: Checkout exact private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-private
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-input

      - name: Diagnose A3 transport and final payload
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, zipfile

          q = pathlib.Path('private-input/queue/gov-book-20260831/A3')
          spec = json.loads((q/'READY.json').read_text(encoding='utf-8'))
          assert spec['book_id'] == 'A3'
          assert spec['payload_sha256'] == os.environ['EXPECTED_ZIP_SHA256']
          assert spec['payload_size_bytes'] == int(os.environ['EXPECTED_ZIP_SIZE'])

          pieces = []
          mismatches = []
          for c in spec['chunks']:
              p = q/c['path']
              data = p.read_bytes()
              assert len(data) == c['size'], (c['path'], len(data), c['size'])
              git_path = f"queue/gov-book-20260831/A3/{c['path']}"
              actual_blob = subprocess.check_output(
                  ['git','-C','private-input','rev-parse',f"HEAD:{git_path}"], text=True
              ).strip()
              if actual_blob != c['git_blob']:
                  mismatches.append({'path': c['path'], 'actual': actual_blob, 'declared': c['git_blob']})
              pieces.append(data.decode('ascii'))

          print('A3_CHUNK_BLOB_MISMATCHES=' + json.dumps(mismatches, separators=(',',':')))
          encoded = ''.join(pieces).encode('ascii')
          print('A3_ENCODED_SIZE_ACTUAL=' + str(len(encoded)))
          print('A3_ENCODED_SIZE_DECLARED=' + str(spec['encoded_size_bytes']))
          assert len(encoded) == spec['encoded_size_bytes']

          packed = base64.b64decode(encoded, validate=True)
          actual_xz_sha = hashlib.sha256(packed).hexdigest()
          print('A3_XZ_SIZE_ACTUAL=' + str(len(packed)))
          print('A3_XZ_SIZE_EXPECTED=' + os.environ['EXPECTED_XZ_SIZE'])
          print('A3_XZ_SHA256_ACTUAL=' + actual_xz_sha)
          print('A3_XZ_SHA256_EXPECTED=' + os.environ['EXPECTED_XZ_SHA256'])
          print('A3_XZ_EXACT=' + ('PASS' if len(packed)==int(os.environ['EXPECTED_XZ_SIZE']) and actual_xz_sha==os.environ['EXPECTED_XZ_SHA256'] else 'FAIL'))

          try:
              raw = lzma.decompress(packed)
          except Exception as e:
              print('A3_XZ_DECOMPRESS=FAIL:' + repr(e))
              raise

          actual_zip_sha = hashlib.sha256(raw).hexdigest()
          print('A3_XZ_DECOMPRESS=PASS')
          print('A3_ZIP_SIZE_ACTUAL=' + str(len(raw)))
          print('A3_ZIP_SIZE_EXPECTED=' + os.environ['EXPECTED_ZIP_SIZE'])
          print('A3_ZIP_SHA256_ACTUAL=' + actual_zip_sha)
          print('A3_ZIP_SHA256_EXPECTED=' + os.environ['EXPECTED_ZIP_SHA256'])

          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'A3-diagnostic.zip'
          out.write_bytes(raw)
          crc_ok = False
          try:
              with zipfile.ZipFile(out) as z:
                  crc_ok = z.testzip() is None
                  print('A3_ZIP_MEMBER_COUNT=' + str(len(z.infolist())))
          except Exception as e:
              print('A3_ZIP_OPEN=FAIL:' + repr(e))
              raise

          print('A3_ZIP_CRC=' + ('PASS' if crc_ok else 'FAIL'))
          payload_exact = (
              len(raw) == int(os.environ['EXPECTED_ZIP_SIZE'])
              and actual_zip_sha == os.environ['EXPECTED_ZIP_SHA256']
              and crc_ok
          )
          print('A3_FINAL_PAYLOAD_EXACT=' + ('PASS' if payload_exact else 'FAIL'))
          if not payload_exact:
              raise SystemExit(42)
          PY

      - name: Assert no gov-book write path exists
        shell: bash
        run: |
          echo 'GOV_BOOK_CHECKOUT=NO'
          echo 'GOV_BOOK_WRITE=NO'
          echo 'MAIN_WRITE=NO'
          echo 'DEVELOP_WRITE=NO'
