name: GOV-BOOK A4 Exact Binary Materialize 20260831

on:
  push:
    branches:
      - task/gov-book-a4-materialize-20260831
    paths:
      - '.github/workflows/gov-book-a4-materialize-20260831.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-book-a4-materialize-20260831
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVATE_SOURCE_REPO: llhzx2018/core-free-runner-private
      PRIVATE_SOURCE_SHA: 6fb873f73fdaabf0c43f94b1d226b3f39e344508
      TARGET_REPO: llhzx2018/gov-book
      TARGET_DEVELOP_SHA: 6e50da26c60b28250309012ebe4c5f5db6476242
      TARGET_MAIN_SHA: e89b0b98dd657e19187940e859fe9e5161df750e
      A4_SHA256: 1add2ff7edfa590cc82e436a822456b126084e0c89d1d308c94fff5913dfbf65
      A4_SIZE: '113803'
      A4_TARGET: downloads/A4/v0.9.0/A4_Niche网站变现_v0.9.0_中文版当前交付包_PARTIAL.zip
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Require registered VF capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo 'REGISTERED_VF_CAPABILITIES=PASS'

      - name: Checkout exact private task input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-private
          ref: ${{ env.PRIVATE_SOURCE_SHA }}
          token: ${{ env.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-input

      - name: Rebuild and verify exact A4 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-input rev-parse HEAD)" = "$PRIVATE_SOURCE_SHA"
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, zipfile
          q = pathlib.Path('private-input/queue/gov-book-20260831/A4')
          spec = json.loads((q/'READY.json').read_text(encoding='utf-8'))
          assert spec['payload_sha256'] == os.environ['A4_SHA256']
          assert spec['payload_size_bytes'] == int(os.environ['A4_SIZE'])
          assert spec['expected_target_head'] == os.environ['TARGET_DEVELOP_SHA']
          assert spec['expected_main_head'] == os.environ['TARGET_MAIN_SHA']
          encoded = ''.join((q/c['path']).read_text(encoding='ascii') for c in spec['chunks'])
          raw = base64.b64decode(encoded, validate=True)
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'A4.zip'
          out.write_bytes(raw)
          assert len(raw) == int(os.environ['A4_SIZE'])
          assert hashlib.sha256(raw).hexdigest() == os.environ['A4_SHA256']
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
          print('A4_PRIVATE_REBUILD_SHA256_CRC=PASS')
          PY

      - name: Checkout exact GOV-BOOK develop start
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/gov-book
          ref: ${{ env.TARGET_DEVELOP_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: gov-book

      - name: Live ref gate and write A4 download only
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$TARGET_MAIN_SHA"
          test "$(git rev-parse origin/develop)" = "$TARGET_DEVELOP_SHA"
          mkdir -p "$(dirname "$A4_TARGET")"
          cp "$RUNNER_TEMP/A4.zip" "$A4_TARGET"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['A4_TARGET'])
          assert p.stat().st_size == int(os.environ['A4_SIZE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['A4_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          PY
          git add -f -- "$A4_TARGET"
          changed="$(git diff --cached --name-only)"
          test "$changed" = "$A4_TARGET"
          git config user.name 'VF Public Runner'
          git config user.email 'runner@users.noreply.github.com'
          git commit -m 'content(book): materialize exact A4 Chinese download'
          git push origin HEAD:develop

      - name: Exact remote readback gate
        working-directory: gov-book
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin develop
          REMOTE_HEAD="$(git rev-parse origin/develop)"
          git show "origin/develop:$A4_TARGET" > "$RUNNER_TEMP/A4-remote.zip"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['RUNNER_TEMP'])/'A4-remote.zip'
          assert p.stat().st_size == int(os.environ['A4_SIZE'])
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['A4_SHA256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('A4_REMOTE_EXACT_READBACK=PASS')
          PY
          echo "GOV_BOOK_DEVELOP_RESULT=$REMOTE_HEAD"
          echo 'MAIN_WRITE=NO'
          echo 'PRIVATE_SOURCE_PERSISTED_PUBLIC=NO'
