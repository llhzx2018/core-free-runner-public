name: P07 D05 portable native recovery exact-source proof TEMP
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-d05-portable-recovery-20261116.yml'
permissions:
  contents: read
jobs:
  d05-portable:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Checkout public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact D05 private source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5c57e92776adf50d2c43198591e700ea806a97dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-d05-private
      - name: GOV-DOC checker transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-d05-gov
      - name: Full PR scope, code architecture and fixed bundle guards
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-d05-private rev-parse HEAD)" = 5c57e92776adf50d2c43198591e700ea806a97dc
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          python3 -B .github/checks/test_architecture_gate.py
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../.p07-d05-gov --git-root . \
            --base-sha a6da82f35fdbd06020a7e65c8cbd5717f617f2f3 --head-sha 5c57e92776adf50d2c43198591e700ea806a97dc
          python3 -B scripts/check_p07_modules.py \
            --module P07-M03-D05 \
            --pr-title 'P07-M03-D05 数据库引擎转换：固定数据归档恢复与双向逻辑复制' \
            --changed-file lib/db_engine_conversion_portable_fixture.py \
            --affected P07-M03-D05 \
            --shared-reason 'D05 独占隔离合成证明，不修改 D04 主流程'
          python3 - <<'PY'
          import subprocess
          changes=subprocess.check_output([
              "git","diff","--name-only","a6da82f35fdbd06020a7e65c8cbd5717f617f2f3","5c57e92776adf50d2c43198591e700ea806a97dc"
          ],text=True).splitlines()
          assert not any(p.startswith(("lib/server_migration","lib/migration_"))
                         for p in changes), "D04 changed"
          assert not any(p.startswith(("installers/","public/")) for p in changes)
          print("P07_D05_PORTABLE_D04_UNCHANGED=PASS")
          PY
          python3 -B -m unittest discover -s tests -p test_p07_m03_d05_portable_fixture.py -v
          echo P07_D05_PORTABLE_SOURCE_SECURITY=PASS
      - name: Two real native engine directions and rollback after target rows
        shell: bash
        env:
          P07_ALLOW_SYNTHETIC_D05: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          cd .p07-d05-private
          export PYTHONPATH="$PWD/lib"
          timeout --signal=TERM --kill-after=10s 1080s \
            python3 -B -m unittest discover -s tests -p test_p07_m03_d05_portable_native.py -v
          echo P07_D05_PORTABLE_NATIVE_TWO_WAY_AND_FAULT=PASS
      - name: Always remove test-only private checkout and synthetic containers
        if: always()
        shell: bash
        run: |
          set +e
          docker ps -aq --filter 'label=org.kewaro.p07.d05.synthetic' | xargs -r docker rm -f >/dev/null 2>&1
          rm -rf -- .p07-d05-private .p07-d05-gov
          test ! -e .p07-d05-private
          test ! -e .p07-d05-gov
          echo P07_D05_PORTABLE_PRIVATE_CLEANUP=PASS
