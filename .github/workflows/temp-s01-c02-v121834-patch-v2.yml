name: TEMP S01-C02 Build Ops 1.21.834 Patch V2
on:
  push:
    branches:
      - temp/s01-c02-v121834-patch-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121834-patch-v2.yml'
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: b87c30f039c495122a59888b9c01d3b4431643d6
      WORK_BRANCH: work/s01-c02-v121834-zero-write-batch-closure
    steps:
      - name: Checkout runner patch script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp/s01-c02-v121834-patch-20260905
          persist-credentials: false
          path: runner
      - name: Checkout exact Product work branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.WORK_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: ops
      - name: Patch and validate exact Product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$BASE"
          python3 runner/.github/scripts/v121834_patch_product.py
          php -l ops/includes/release/builders/class-candidate-batch-builder.php >/dev/null
          php -l ops/includes/site-release/s01-static-candidate-build-failure-readback-v121830.php >/dev/null
          php -l ops/includes/site-release/s01-static-zero-write-batch-retry-v121834.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php ops/.github/phase3/v121834-zero-write-batch-closure.php | grep -Fxq PASS_V121834_ZERO_WRITE_BATCH_CLOSURE
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.834
          git -C ops diff --check
      - name: Commit exact Product candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops config user.name VictorForge
          git -C ops config user.email llhzx2018@gmail.com
          git -C ops add .github/phase3/v121834-zero-write-batch-closure.php VERSION vf-ops.php includes/release/builders/class-candidate-batch-builder.php includes/site-release/s01-static-candidate-build-failure-readback-v121830.php includes/site-release/s01-static-zero-write-batch-retry-v121834.php
          test "$(git -C ops diff --cached --name-only | wc -l | tr -d ' ')" = 6
          git -C ops commit -m 'fix(S01-C02): close zero-write Candidate batch boundary'
          git -C ops push origin HEAD:${WORK_BRANCH}
          echo PRODUCT_CANDIDATE_COMMIT=$(git -C ops rev-parse HEAD)
          echo PRODUCT_CANDIDATE_TREE=$(git -C ops rev-parse HEAD^{tree})
