name: S01-C02 Ops 1.21.1092 Exact Artifact Formal
on:
  push:
    branches: [release/s01-c02-1211092-integrations-config-ux-20261010]
permissions:
  contents: read
  actions: read
jobs:
  verify-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: ops_1092_formal
          MARIADB_USER: vf
          MARIADB_PASSWORD: fixture-pass
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      REPO: llhzx2018/vf-tools-ops
      VERSION: 1.21.1092
      MERGED_SHA: 97c5c8f2a8be86093a18e06b8f271c8a7d5b066c
      TESTED_SHA: 0cd418fe1072ea132559cbfea5ab32a5664bcf2b
      TREE: ae793e6f9456f56919c474d32c5f379ff2d8cdca
      SHA256: 5435ef8974be9760486dcac2fe58929f6b18d449732e3f41896bd25f7da78139
      RUNTIME_FP: 5522c6c496c2cdbd53829586f9df00766ae6b64877dfb892008de8300655fce1
      FILES: '989'
      BYTES: '3554358'
      ASSET: vf-tools-ops_V1.21.1092.zip
    steps:
      - name: Verify tested run and download its exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh run view 38033215204 --repo llhzx2018/core-free-runner-public --json conclusion --jq .conclusion)" = success
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 38033215204 --repo llhzx2018/core-free-runner-public --name s01-c02-v1.21.1092-integration-status-candidate --dir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/candidate/$ASSET" "$RUNNER_TEMP/$ASSET"
          test "$(stat -c %s "$RUNNER_TEMP/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/$ASSET" | cut -d' ' -f1)" = "$SHA256"
          unzip -tq "$RUNNER_TEMP/$ASSET"
          python3 - <<'PY'
          import hashlib,os,zipfile
          files={}
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],os.environ['ASSET'])) as z:
              for name in z.namelist():
                  if name.endswith('/'): continue
                  assert name.startswith('vf-ops/'),name
                  files[name[len('vf-ops/'):]]=z.read(name)
          assert len(files)==int(os.environ['FILES'])
          assert b'1.21.1092' in files['vf-ops.php']
          digest=hashlib.sha256()
          for name,data in sorted(files.items()):
              digest.update(name.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n')
          assert digest.hexdigest()==os.environ['RUNTIME_FP']
          print('EXACT_CANDIDATE_RUNTIME=PASS')
          PY
      - name: Verify merge tree equals tested source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$REPO/commits/main" --jq .sha)" = "$MERGED_SHA"
          test "$(gh api "repos/$REPO/git/commits/$MERGED_SHA" --jq .tree.sha)" = "$TREE"
          test "$(gh api "repos/$REPO/git/commits/$TESTED_SHA" --jq .tree.sha)" = "$TREE"
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release tag already exists; refuse replacement"
            exit 1
          fi
          echo 'EXACT_MERGED_SOURCE=PASS'
      - name: Isolated WordPress 1091 upgrade and rollback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/wp-isolated"; mkdir -p "$WORK/site"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$WORK/wp"
          wpqa(){ php "$WORK/wp" --path="$WORK/site" "$@"; }
          wpqa core download --version=7.0.2 --force
          wpqa config create --dbname=ops_1092_formal --dbuser=vf --dbpass=fixture-pass --dbhost=127.0.0.1 --skip-check
          wpqa core install --url=https://fixture.invalid --title=Isolated-Ops-1092 --admin_user=admin --admin_password=fixture-admin --admin_email=qa@example.invalid --skip-email
          gh release download v1.21.1091 --repo "$REPO" --pattern 'vf-tools-ops_V1.21.1091.zip' --dir "$WORK"
          test "$(sha256sum "$WORK/vf-tools-ops_V1.21.1091.zip" | cut -d' ' -f1)" = baa35cea59538544cd5e53445a172dfed3630af5149538ba83ce855f59564634
          wpqa plugin install "$WORK/vf-tools-ops_V1.21.1091.zip" --activate
          test "$(wpqa plugin get vf-ops --field=version)" = 1.21.1091
          wpqa option update vf_s01_1092_upgrade_preservation preserved
          wpqa plugin install "$RUNNER_TEMP/$ASSET" --force
          test "$(wpqa plugin get vf-ops --field=version)" = "$VERSION"
          wpqa plugin is-active vf-ops
          test "$(wpqa option get vf_s01_1092_upgrade_preservation)" = preserved
          wpqa plugin install "$WORK/vf-tools-ops_V1.21.1091.zip" --force
          test "$(wpqa plugin get vf-ops --field=version)" = 1.21.1091
          wpqa plugin is-active vf-ops
          test "$(wpqa option get vf_s01_1092_upgrade_preservation)" = preserved
          echo 'ISOLATED_UPGRADE_ROLLBACK=PASS'
      - name: Publish verified exact artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' 'Ops 1.21.1092 · 搜索与分析集成 UX/UI 精修' '' '状态区分别显示未配置与最近一次真实检查结果；已配置的真实 FAIL 保留，GSC/IndexNow/Analytics 写入合同、权限及 Secret 处理不变。' 'Candidate 38033215204 PASS，产品 PR #354，隔离 WordPress 升级及回滚 PASS。Production 由 OWNER 手工升级；外部 GSC 授权及 OWNER UX 验收尚未完成。' > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$RUNNER_TEMP/$ASSET" --repo "$REPO" --target "$MERGED_SHA" --title "VF Tools Ops V$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          echo 'FORMAL_RELEASE_CREATED=PASS'
      - name: Verify official remote asset bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh release view "v$VERSION" --repo "$REPO" --json isDraft --jq .isDraft)" = false
          test "$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --jq .object.sha)" = "$MERGED_SHA"
          mkdir -p "$RUNNER_TEMP/remote"
          gh release download "v$VERSION" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/remote"
          test "$(stat -c %s "$RUNNER_TEMP/remote/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/remote/$ASSET" | cut -d' ' -f1)" = "$SHA256"
          cmp "$RUNNER_TEMP/remote/$ASSET" "$RUNNER_TEMP/$ASSET"
          echo 'FORMAL_REMOTE_BYTES=PASS'
