name: P05 Common Baseline V2 Runtime Full Exact Source Gate
on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p05-common-baseline-v2-runtime-full-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo
          POSTGRES_DB: vfseo_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vfseo -d vfseo_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      EXACT_SOURCE: 3c081bdd1444149f4411eabf5f5ee9e57cff505a
      ASSESSED_BASE: 2e0f3a66a8764d54841f7d7161de7d35e5aacf3f
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260828
      DATABASE_URL: postgresql://vfseo:vfseo@127.0.0.1:5432/vfseo_gate
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout exact P05 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05
      - name: Prepare Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Exact source and authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test "$(tr -d '\r\n' < VERSION)" = '1.0.1'
          grep -Fq "APP_VERSION = '1.0.1'" src/server/version.ts
          grep -Fq 'SCHEMA_VERSION = 1' src/server/version.ts
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          v1=json.loads((root/'docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json').read_text())
          v2=json.loads((root/'docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json').read_text())
          assert v1['state']=='CURRENT',v1
          assert v2['state']=='MACHINE_VERIFICATION_PENDING',v2
          assert v2['machine_verification']['state']=='PENDING',v2
          assert v2['version']=='1.0.1' and v2['schema_version']==1,v2
          assert v2['version_changed'] is False and v2['schema_changed'] is False,v2
          assert v2['release_executed'] is False and v2['production_changed'] is False,v2
          PY
          ! grep -R "VF_SESSION_ROTATION_SECONDS" -n src .env.example
          ! grep -R "'/api/auth/rotate'\|\"/api/auth/rotate\"" -n src
          grep -Fq 'VF_SESSION_IDLE_SECONDS=604800' .env.example
          grep -Fq 'VF_SESSION_ABSOLUTE_SECONDS=2592000' .env.example
          grep -Fq 'VF_SESSION_COOKIE_SECONDS=2592000' .env.example
          grep -Fq 'VF_STEP_UP_WINDOW_SECONDS=900' .env.example
          echo P05_V2_SOURCE_FENCE=PASS
      - name: Install exact dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm ci
      - name: Existing formal regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          echo P05_V2_REGRESSION=PASS
      - name: Fresh SQLite install and schema gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          ROOT="$RUNNER_TEMP/p05-v2-fresh-final"
          export VF_DATABASE_PROVIDER=sqlite
          export VF_SQLITE_PATH="$ROOT/vf-seo.sqlite3"
          export VF_BACKUP_DIR="$ROOT/backups"
          export VF_ADMIN_USERNAME=admin
          export VF_ADMIN_PASSWORD='P05-V2-Fresh-Final-Password-2026!'
          mkdir -p "$ROOT"
          npm run migrate
          npm run verify:schema
          npm run bootstrap:admin
          npm run verify:admin-ready
          echo P05_V2_FRESH_INSTALL=PASS
      - name: Runtime surfaces and real restart step-up gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          ROOT="$RUNNER_TEMP/p05-v2-runtime-final"
          PORT=19025
          PASS='P05-V2-Runtime-Final-Password-2026!'
          export NODE_ENV=test
          export PORT
          export VF_DATABASE_PROVIDER=sqlite
          export VF_SQLITE_PATH="$ROOT/vf-seo.sqlite3"
          export VF_BACKUP_DIR="$ROOT/backups"
          export VF_ADMIN_USERNAME=admin
          export VF_ADMIN_PASSWORD="$PASS"
          export VF_SECURE_COOKIES=false
          export VF_REQUIRE_HTTPS=false
          export VF_TRUST_PROXY=false
          export VF_SESSION_TTL_SECONDS=2592000
          export VF_SESSION_IDLE_SECONDS=604800
          export VF_SESSION_ABSOLUTE_SECONDS=2592000
          export VF_SESSION_COOKIE_SECONDS=2592000
          export VF_STEP_UP_WINDOW_SECONDS=900
          export VF_DISPLAY_TIMEZONE=Asia/Shanghai
          export VF_LOCALE=zh-CN
          mkdir -p "$ROOT"
          npm run migrate
          npm run bootstrap:admin
          start_server() {
            node dist/src/server/index.js >"$1" 2>&1 &
            SERVER_PID=$!
            for _ in $(seq 1 120); do
              curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1 && return 0
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$1"; return 31; fi
              sleep .1
            done
            cat "$1"
            return 32
          }
          stop_server() {
            kill "$SERVER_PID"
            wait "$SERVER_PID" || true
            for _ in $(seq 1 60); do
              if ! curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then return 0; fi
              sleep .1
            done
            echo SERVER_PORT_DID_NOT_CLOSE
            return 33
          }
          start_server "$ROOT/server-1.log"
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          cat > "$ROOT/phase1.mjs" <<'JS'
          import fs from 'node:fs';
          const base=`http://127.0.0.1:${process.env.PORT}`;
          const password=process.env.VF_ADMIN_PASSWORD;
          const login=await fetch(base+'/api/auth/login',{method:'POST',headers:{'content-type':'application/json','origin':base},body:JSON.stringify({username:'admin',password})});
          if(login.status!==200) throw new Error(`login ${login.status} ${await login.text()}`);
          const setCookie=login.headers.get('set-cookie')||'';
          if(!/Max-Age=2592000/i.test(setCookie)) throw new Error(`cookie ${setCookie}`);
          const cookie=setCookie.split(';')[0];
          const body=await login.json();
          const csrf=body.csrfToken;
          if(!cookie||!csrf) throw new Error('session material missing');
          const get=async(path)=>{const r=await fetch(base+path,{headers:{cookie}});let b={};try{b=await r.json()}catch{}if(r.status!==200)throw new Error(`${path} ${r.status} ${JSON.stringify(b)}`);return b;};
          const info=await get('/api/system/info');
          if(info.version!=='1.0.1'||info.schema!==1||info.profile!=='PERSONAL_SINGLE_ADMIN') throw new Error(`info ${JSON.stringify(info)}`);
          if(info.auth.idleSeconds!==604800||info.auth.absoluteSeconds!==2592000||info.auth.cookieSeconds!==2592000||info.auth.serverSessionFloorSeconds!==2592000||info.auth.periodicRotationRequired!==false||info.auth.stepUpWindowSeconds!==900) throw new Error(`auth ${JSON.stringify(info.auth)}`);
          if(info.time.storage!=='UTC'||info.time.displayTimezone!=='Asia/Shanghai'||info.locale!=='zh-CN') throw new Error(`time ${JSON.stringify(info)}`);
          const baseline=(await get('/api/system/baseline')).report;
          if(baseline.baseline!=='VF-COMMON-PRODUCT-BASELINE@2.0'||baseline.profile!=='PERSONAL_SINGLE_ADMIN'||baseline.results.length!==15) throw new Error(`baseline ${JSON.stringify(baseline)}`);
          if(baseline.summary.pass!==14||baseline.summary.exception!==0||baseline.summary.drift!==0||baseline.summary.unknown!==0||baseline.summary.nA!==1||baseline.summary.fullPass!==true) throw new Error(`summary ${JSON.stringify(baseline.summary)}`);
          const n=baseline.results.find(x=>x.domain==='NOTIFICATION');
          if(n?.state!=='N_A'||!n.reason) throw new Error(`notification ${JSON.stringify(n)}`);
          const health=await get('/api/system/health');
          if(health.database!=='READY'||health.process!=='READY'||health.version!=='1.0.1'||health.schema!==1) throw new Error(`health ${JSON.stringify(health)}`);
          fs.writeFileSync(process.env.SESSION_FILE,JSON.stringify({cookie,csrf,password}));
          console.log('P05_V2_RUNTIME_SURFACES=PASS');
          JS
          SESSION_FILE="$ROOT/session.json" node "$ROOT/phase1.mjs"
          stop_server
          if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null 2>&1; then echo OLD_SERVER_STILL_REACHABLE; exit 34; fi
          start_server "$ROOT/server-2.log"
          cat > "$ROOT/phase2.mjs" <<'JS'
          import fs from 'node:fs';
          const {cookie,csrf,password}=JSON.parse(fs.readFileSync(process.env.SESSION_FILE,'utf8'));
          const base=`http://127.0.0.1:${process.env.PORT}`;
          const post=async(path,body)=>{const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','origin':base,'cookie':cookie,'x-csrf-token':csrf},body:JSON.stringify(body)});let b={};try{b=await r.json()}catch{}return {status:r.status,body:b};};
          const me=await fetch(base+'/api/auth/me',{headers:{cookie}});
          if(me.status!==200) throw new Error(`persisted session lost ${me.status}`);
          const blockedImport=await post('/api/system/import',{});
          if(blockedImport.status!==403||blockedImport.body.error!=='STEP_UP_REQUIRED') throw new Error(`import guard ${JSON.stringify(blockedImport)}`);
          const blockedUpdate=await post('/api/system/update/apply',{});
          if(blockedUpdate.status!==403||blockedUpdate.body.error!=='STEP_UP_REQUIRED') throw new Error(`update guard ${JSON.stringify(blockedUpdate)}`);
          const wrong=await post('/api/system/step-up',{password:'wrong-password'});
          if(wrong.status!==403||wrong.body.error!=='STEP_UP_INVALID_PASSWORD') throw new Error(`wrong ${JSON.stringify(wrong)}`);
          const accepted=await post('/api/system/step-up',{password});
          if(accepted.status!==200||accepted.body.recentAuth!==true||accepted.body.windowSeconds!==900) throw new Error(`accepted ${JSON.stringify(accepted)}`);
          const after=await post('/api/system/import',{});
          if(after.status!==400||after.body.error!=='IMPORT_PACKAGE_INVALID') throw new Error(`fallthrough ${JSON.stringify(after)}`);
          console.log('P05_V2_STEP_UP_RESTART=PASS');
          JS
          SESSION_FILE="$ROOT/session.json" node "$ROOT/phase2.mjs"
          stop_server
          trap - EXIT
          if grep -Eqi 'Unhandled|uncaught|fatal|EADDRINUSE' "$ROOT/server-1.log" "$ROOT/server-2.log"; then cat "$ROOT/server-1.log" "$ROOT/server-2.log"; exit 35; fi
          echo P05_V2_RUNTIME_FULL=PASS
      - name: Final runtime verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          echo P05_COMMON_BASELINE_V2_RUNTIME_EXACT_SOURCE="$EXACT_SOURCE"
          echo P05_COMMON_BASELINE_V2_VERSION=1.0.1
          echo P05_COMMON_BASELINE_V2_SCHEMA=1
          echo P05_COMMON_BASELINE_V2_MACHINE=PASS
          echo P05_COMMON_BASELINE_V2_RELEASE=NO
          echo P05_COMMON_BASELINE_V2_PRODUCTION=NO
