name: p01-v24746-formal-publish-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24746-formal-publish-temp.yml'
      - 'requests/p01-v24746-formal-publish-20260924.txt'

permissions:
  contents: read

concurrency:
  group: p01-v24746-formal-publish
  cancel-in-progress: false

env:
  PRODUCT_REPO: llhzx2018/vf-start
  TARGET_SHA: 2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1
  TARGET_TREE: 1e45242ff2271cd287181935a0865dcaf44bfa76
  VERSION: '2.47.46'
  SOURCE_VERSION: '2.47.45'
  SOURCE_SHA: 41d4253b8439deb098a44db6aa25acb94cc5ce93
  SCHEMA: '2026090401'
  TAG: v2.47.46
  MACHINE_RUN_ID: '35941043667'
  MACHINE_RUN_HEAD: 41b3714956b058ca213bbdb0ee71f7b7880dbb6a
  READINESS_RUN_ID: '35941244814'
  READINESS_RUN_HEAD: c4876945ccd27161e13f30d2676b4937c7852347
  ARTIFACT_ID: '10785770072'
  FULL_NAME: VF-Start-V2.47.46-FULL.zip
  FULL_BYTES: '907153'
  FULL_SHA: 828f44887ebbd1f915076f59a60342c8b9d1bc1d5d4da497c55909012a8a2c57
  UPDATE_NAME: VF_Start_V2.47.46_UPDATE.zip
  UPDATE_BYTES: '1948958'
  UPDATE_SHA: cbe74c22c8e011b25be26bd494ba3132b13d513dc7372ff322c56b3570b5b654

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout release control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Credential and exact source gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$RUNNER_TEMP/product"
          git -C "$RUNNER_TEMP/product" fetch -q --depth 1 origin "$TARGET_SHA"
          git -C "$RUNNER_TEMP/product" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/product" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$RUNNER_TEMP/product" rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$RUNNER_TEMP/product/VERSION")" = "$VERSION"
          test "$(tr -d '\r\n ' < "$RUNNER_TEMP/product/src/VERSION.txt")" = "$VERSION"
          echo P01_V24746_EXACT_RELEASE_SOURCE=PASS

      - name: Recheck final machine evidence and OWNER override
        shell: bash
        run: |
          set -Eeuo pipefail
          machine="$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$MACHINE_RUN_ID")"
          readiness="$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$machine")" = "$MACHINE_RUN_HEAD"
          test "$(jq -r '.conclusion' <<<"$machine")" = success
          test "$(jq -r '.head_sha' <<<"$readiness")" = "$READINESS_RUN_HEAD"
          test "$(jq -r '.conclusion' <<<"$readiness")" = success
          grep -F 'OWNER explicitly requested publication of the current R3 candidate V2.47.46 for manual Production update and real visual verification' requests/p01-v24746-formal-publish-20260924.txt >/dev/null
          echo P01_V24746_MACHINE_EVIDENCE_READBACK=PASS
          echo P01_V24746_OWNER_RELEASE_INTENT=AUTHORIZED

      - name: Fetch exact candidate artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/formal" "$RUNNER_TEMP/formal.zip"
          mkdir -p "$RUNNER_TEMP/formal"
          gh api --method GET "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/formal.zip"
          unzip -q "$RUNNER_TEMP/formal.zip" -d "$RUNNER_TEMP/formal"
          FULL="$(find "$RUNNER_TEMP/formal" -type f -name "$FULL_NAME" -print -quit)"
          UPDATE="$(find "$RUNNER_TEMP/formal" -type f -name "$UPDATE_NAME" -print -quit)"
          test -n "$FULL" && test -n "$UPDATE"
          test "$(stat -c %s "$FULL")" = "$FULL_BYTES"
          test "$(sha256sum "$FULL"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$UPDATE")" = "$UPDATE_BYTES"
          test "$(sha256sum "$UPDATE"|awk '{print $1}')" = "$UPDATE_SHA"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          echo "FULL_PATH=$FULL" >> "$GITHUB_ENV"
          echo "UPDATE_PATH=$UPDATE" >> "$GITHUB_ENV"
          echo P01_V24746_FINAL_ARTIFACT_READBACK=PASS

      - name: Immutable and stable-baseline preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          if tag_sha="$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$TARGET_SHA" || { echo "TAG_IDENTITY_CONFLICT=$tag_sha" >&2; exit 91; }
          fi
          baseline="$(gh api "repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main" --jq '.content' | base64 -d)"
          jq -e '
            .current_version=="2.47.44" and
            .target_version=="2.47.45" and
            .from_versions==["2.47.44"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.45" and
            .release_id==395189608 and
            .product_identity=="41d4253b8439deb098a44db6aa25acb94cc5ce93" and
            .asset_name=="VF_Start_V2.47.45_UPDATE.zip" and
            .asset_bytes==1946898 and
            .asset_sha256=="e2c4bf13cab16e8a4a4527890ac142208e9b1e1ebda5399de64c57e70e012620"
          ' <<<"$baseline" >/dev/null
          echo P01_V24746_IMMUTABLE_AND_BASELINE_PREFLIGHT=PASS

      - name: Create exact tag and GitHub Release
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$PRODUCT_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" > "$RUNNER_TEMP/tag-create.json"
          fi
          test "$(gh api "repos/$PRODUCT_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$TARGET_SHA"

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          # VF Start V2.47.46

          P01 · VF Start V2.47.46 全部资源 R3 明显表格化对齐正式更新。

          - Exact Source: $TARGET_SHA
          - Exact Tree: $TARGET_TREE
          - Source Version: V$SOURCE_VERSION
          - Target Version: V$VERSION
          - Schema: $SCHEMA（不变）
          - Canonical Regression: PASS / current failures 0 / new regressions 0
          - Machine Preflight: PASS / run $MACHINE_RUN_ID
          - Release Readiness: PASS / run $READINESS_RUN_ID
          - Clean FULL install: PASS
          - Atomic V$SOURCE_VERSION → V$VERSION: PASS
          - Atomic idempotency: PASS
          - Injected-failure rollback + private sentinel preservation: PASS
          - Diagnose / Setup / System Health focused evidence: PASS
          - OWNER direct Formal Release + Stable authorization: PASS
          - OWNER explicit instruction: publish the current R3 candidate V2.47.46 for manual Production update and real visual verification
          - Production upgrade: NOT INCLUDED; OWNER will apply the update from P01 admin
          EOF

          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FULL_PATH" "$UPDATE_PATH" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$FULL_PATH" "$UPDATE_PATH"               --repo "$PRODUCT_REPO"               --target "$TARGET_SHA"               --title "VF Start V$VERSION"               --notes-file "$RUNNER_TEMP/release-notes.md"               --verify-tag >/dev/null
          fi

          gh api "repos/$PRODUCT_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false' "$RUNNER_TEMP/release.json" >/dev/null
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
          echo "PUBLISHED_AT=$(jq -r '.published_at' "$RUNNER_TEMP/release.json")" >> "$GITHUB_ENV"
          echo P01_V24746_TAG_RELEASE=PASS

      - name: Remote Release exact-byte readback
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/release-readback"
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir "$RUNNER_TEMP/release-readback" --pattern "$FULL_NAME" --pattern "$UPDATE_NAME"
          test "$(stat -c %s "$RUNNER_TEMP/release-readback/$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/release-readback/$FULL_NAME"|awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c %s "$RUNNER_TEMP/release-readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/release-readback/$UPDATE_NAME"|awk '{print $1}')" = "$UPDATE_SHA"
          jq -e --arg f "$FULL_NAME" --arg u "$UPDATE_NAME" --argjson fb "$FULL_BYTES" --argjson ub "$UPDATE_BYTES"             '([.assets[]|select(.name==$f and .size==$fb)]|length)==1 and ([.assets[]|select(.name==$u and .size==$ub)]|length)==1'             "$RUNNER_TEMP/release.json" >/dev/null
          echo P01_V24746_RELEASE_REMOTE_READBACK=PASS

      - name: Checkout core-updates stable authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: main
          token: ${{ env.WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: updates

      - name: Publish P01 V2.47.46 stable channel
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .current_version=="2.47.44" and
            .target_version=="2.47.45" and
            .from_versions==["2.47.44"] and
            .release_tag=="v2.47.45" and
            .release_id==395189608 and
            .product_identity=="41d4253b8439deb098a44db6aa25acb94cc5ce93" and
            .asset_name=="VF_Start_V2.47.45_UPDATE.zip" and
            .asset_bytes==1946898 and
            .asset_sha256=="e2c4bf13cab16e8a4a4527890ac142208e9b1e1ebda5399de64c57e70e012620"
          ' updates/projects/P01.json >/dev/null

          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('updates/projects/P01.json')
          x={
            "schema_version":"1.0",
            "project_id":"P01",
            "component_id":"APP",
            "enabled":True,
            "current_version":"2.47.45",
            "target_version":"2.47.46",
            "update_type":"ATOMIC",
            "from_versions":["2.47.45"],
            "schema_from":"2026090401",
            "schema_to":"2026090401",
            "repository":"llhzx2018/vf-start",
            "release_tag":"v2.47.46",
            "release_id":int(os.environ["RELEASE_ID"]),
            "product_identity":"2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1",
            "asset_name":"VF_Start_V2.47.46_UPDATE.zip",
            "asset_bytes":1948958,
            "asset_sha256":"cbe74c22c8e011b25be26bd494ba3132b13d513dc7372ff322c56b3570b5b654",
            "backup_required":True,
            "rollback_supported":True,
            "released_at":os.environ["PUBLISHED_AT"],
            "minimum_php":"8.0.0",
            "notes":"P01 · VF Start V2.47.46 全部资源 R3 明显表格化对齐正式稳定更新。Exact Source 2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1；Schema 2026090401 不变；Canonical Regression current failures 0 / new regressions 0；Machine Preflight 35941043667 PASS；Release Readiness 35941244814 PASS；Clean FULL、Atomic 2.47.45→2.47.46、idempotency、failure rollback/data sentinel 均 PASS。全部资源使用共享列轨、明确列分隔、稳定左边界和独立操作单元，保留搜索、筛选、分页与按需编辑。OWNER 明确要求发布当前 R3 Candidate 供后台手动 Production 更新并继续真实视觉验收；Production 仍由 OWNER 在 P01 后台手动点击更新。Formal Release / Stable Published 不代表 Production 已升级。"
          }
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          git -C updates config user.name 'VF Release Automation'
          git -C updates config user.email 'vf-release-automation@users.noreply.github.com'
          git -C updates add projects/P01.json
          git -C updates commit -m 'release(P01): publish VF Start V2.47.46 stable channel'
          git -C updates push origin HEAD:main
          echo "CORE_UPDATES_COMMIT=$(git -C updates rev-parse HEAD)" >> "$GITHUB_ENV"
          echo P01_V24746_STABLE_CHANNEL_WRITE=PASS

      - name: Stable channel remote exact readback
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/updates-readback"
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" "$RUNNER_TEMP/updates-readback"
          M="$RUNNER_TEMP/updates-readback/projects/P01.json"
          jq -e --argjson rid "$RELEASE_ID" '
            .current_version=="2.47.45" and
            .target_version=="2.47.46" and
            .from_versions==["2.47.45"] and
            .schema_from=="2026090401" and
            .schema_to=="2026090401" and
            .release_tag=="v2.47.46" and
            .release_id==$rid and
            .product_identity=="2e31cf1b78fc4fc1958138e99a7fd1fd1c57efa1" and
            .asset_name=="VF_Start_V2.47.46_UPDATE.zip" and
            .asset_bytes==1948958 and
            .asset_sha256=="cbe74c22c8e011b25be26bd494ba3132b13d513dc7372ff322c56b3570b5b654"
          ' "$M" >/dev/null
          test "$(git -C "$RUNNER_TEMP/updates-readback" rev-parse HEAD)" = "$CORE_UPDATES_COMMIT"
          echo P01_V24746_STABLE_REMOTE_READBACK=PASS

      - name: Formal publish summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '# P01 V2.47.45 Formal Release'
            echo "Exact Source: $TARGET_SHA"
            echo "Tag: $TAG"
            echo "Release ID: $RELEASE_ID"
            echo "FULL: $FULL_BYTES bytes / $FULL_SHA"
            echo "UPDATE: $UPDATE_BYTES bytes / $UPDATE_SHA"
            echo "core-updates: $CORE_UPDATES_COMMIT"
            echo 'Production: NOT EXECUTED'
          } >> "$GITHUB_STEP_SUMMARY"
          echo P01_V24746_FORMAL_RELEASE_AND_STABLE=PASS

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/product" "$RUNNER_TEMP/formal" "$RUNNER_TEMP/formal.zip"             "$RUNNER_TEMP/release-readback" "$RUNNER_TEMP/updates-readback" updates
          rm -f "$RUNNER_TEMP/tag-create.json" "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-notes.md"
          echo P01_V24746_RELEASE_WORKSPACE_CLEANUP=PASS
