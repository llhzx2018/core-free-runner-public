name: P08 GOV-DOC V3.9 Mode K exact private source machine validation
on:
  push:
    branches: [test/p08-gov-v39-exact-20261113]
permissions:
  contents: read
jobs:
  source-public-authority-gates:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-gov-v39-exact-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 5b34ab021a4cdafb6ef7003d2b29188eacfb9777
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin private governance source and one-case candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 5b34ab021a4cdafb6ef7003d2b29188eacfb9777
          grep -Fq '| skill-release | V3.9 |' CURRENT.md
          grep -Fq '| skill-release | V3.9 | V2.6 |' skills/README.md
          grep -Fq '### Mode K · ONE_CASE_P08_ADOPS_011_SIGNED_RELEASE_FIRST_OWNER_REAL_USE' skills/skill-release/V3.9/SKILL.md
          grep -Fq 'OWNER_CASE_SPECIFIC_POST_RELEASE_REAL_USE_AND_SIGNER_AUTHORIZATION' skills/skill-release/V3.9/SKILL.md
          grep -Fq 'PRODUCTION_AUTO_APPLY = NO' skills/skill-release/V3.9/SKILL.md
          grep -Fq '保留' governance/release/cases/P08_ADOPS_011_RELEASE_FIRST_SIGNER_APPROVAL_20261113.md
          git cat-file -e 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997^{commit}
          test "$(git show 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997:skills/skill-release/V3.8/SKILL.md | git hash-object --stdin)" = "$(git hash-object skills/skill-release/V3.8/SKILL.md)"
          echo 'P08_GOV39_OLD_RELEASE_SKILL_EXACT_BYTES_PRESERVED=PASS'
      - name: Actual current Authority router and dependency regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B governance/public-authority/tools/public_authority_router_lint.py
          python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_skill_bridge_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_public_authority_router_lint.py' -v
          echo 'P08_GOV39_CURRENT_AND_SHARED_RULE_NEGATIVES=PASS'
      - name: Actual global closure and task scope guards
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py --resolve-trigger bootstrap
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          python3 -B -m unittest discover -s governance/agent -p 'test_task_scope_action_lint.py' -v
          python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_system_install_upgrade_contract_lint.py' -v
          echo 'P08_GOV39_GLOBAL_CLOSURE_AND_INSTALL_UPGRADE_NEGATIVES=PASS'
      - name: Actual source impact from Git diff, not fabricated receipt
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL, UPGRADE, SECURITY, TESTING, DATA_SCHEMA, GIT, UA_UI, CRON_JOB, OBSERVABILITY
            IMPACT_REASON: Adds one scoped P08 release-first timing contract but does not lower machine source signing security installation backup data recovery rollback or Production gates.
        run: |
          set -Eeuo pipefail
          python3 -B governance/public-authority/tools/current_dependency_lint.py \
            --git-base 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997 --git-head "$(git rev-parse HEAD)"
          python3 -B governance/public-authority/tools/global_closure_lint.py \
            --git-base 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997 --git-head "$(git rev-parse HEAD)"
          echo 'P08_GOV39_ACTUAL_BRANCH_DIFF_IMPACT_GATE=PASS'
      - name: Remove private governance source from public runner
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          rm -rf "$GITHUB_WORKSPACE"
          echo 'P08_GOV39_PUBLIC_PERSISTED_PRIVATE_SOURCE=NO'
