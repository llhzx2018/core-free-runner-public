name: P01 V2.47.134 Icon Rebuild Progress Gate

on:
  push:
    branches:
      - test-p01-v247134-icon-progress-20260930
    paths:
      - '.github/workflows/temp-p01-v247134-icon-progress.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 27d88be3bb64e3fe0a18e83f4a63cf1786bef2ad
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: candidate

      - name: Checkout exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fa2741d17bb54ce2e204a944a2f710d8436473ca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat candidate/VERSION)" = "2.47.134"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.134"
          grep -F "define('VF_VERSION', '2.47.134');" candidate/src/app/bootstrap.php
          php -l candidate/src/app/JobManager.php
          php -l candidate/src/app/IconCache.php
          php -l candidate/src/api.php
          php -l candidate/tests/unit/admin_icon_rebuild_progress_v247134_contract.php
          node --check candidate/src/assets/icons.js
          echo P01_V247134_IDENTITY_SYNTAX=PASS

      - name: Focused icon contracts
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php tests/unit/admin_icon_rebuild_progress_v247134_contract.php
          php tests/unit/admin_icon_maintenance_v247133_contract.php
          php tests/unit/navigation_v247127_favicon_reliability_contract.php
          php tests/unit/navigation_v247128_favicon_recovery_queue_contract.php
          php tests/unit/navigation_v247130_favicon_provider_generation_contract.php
          php tests/unit/navigation_v247131_favicon_stale_success_selfheal_contract.php
          php tests/unit/navigation_v247132_favicon_success_generation_refresh_contract.php
          php tests/unit/navigation_v247133_favicon_all_view_recovery_contract.php
          echo P01_V247134_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -euo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline
          echo P01_V247134_CANONICAL=PASS
