name: P01 Mobile Admin Post-Actions Visual Gate
on:
  push:
    branches: [tmp/p01-cover-coverage-diagnostic-20260902]
    paths: [.github/workflows/p01-mobile-admin-post-actions-visual-gate-20260902.yml]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 839329a10b2dc036114a76ae8f7ca576664bfe02
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mobile-admin-post-actions/evidence
      PW: /tmp/p01-mobile-admin-post-actions/pw
      PORT: '18550'
      ADMIN_PASS: P01MobileAdmin2026
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence and fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mobile-admin-post-actions; mkdir -p "$EVID" "$PW"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'SOURCE=%s\nREMOTE_DEVELOP=%s\n' "$SOURCE" "$REMOTE" | tee "$EVID/source.txt"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mobile-admin-post-actions.pid
          COOKIE=/tmp/p01-mobile-admin-post-actions.cookies
          for i in $(seq 1 60); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then break; fi
            sleep .25
          done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mobile Admin Visual' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Seed realistic admin dataset
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/dataset.txt"
          <?php
          declare(strict_types=1);
          require getenv('ROOT').'/app/bootstrap.php'; require getenv('ROOT').'/app/SurfaceRepository.php';
          $db=vf_db(); $repo=new VfRepository($db); $surface=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'移动管理测试','description'=>'','icon'=>'','is_private'=>0,'sort_order'=>0]);
          $hosts=['youtube.com','bilibili.com','vimeo.com','twitch.tv','music.youtube.com','example.com','archive.org','github.com'];
          for($i=0;$i<8;$i++){
            $url=$i===0?'https://www.youtube.com/watch?v=dQw4w9WgXcQ':'https://'.$hosts[$i].'/mobile-admin-'.$i;
            $saved=$repo->saveLink(null,['category_id'=>$cat,'title'=>'频道资源 '.($i+1).' · 移动端管理操作测试','url'=>$url,'description'=>'用于验证手机端操作按钮与筛选工具栏密度','is_private'=>$i%3===0?1:0],'manual');
            $surface->upsertProfile((int)$saved['id'],['surface'=>'channels','resource_kind'=>$i%2===0?'视频':'频道']);
          }
          echo 'COUNT=8'."\n";
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()); $fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));
          echo "INTEGRITY=$integrity\nFK=$fk\n"; if($integrity!=='ok'||$fk!==0) exit(2);
          PHP
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PW"; npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install chromium
      - name: Logged-in 390px top and scroll readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PW/visual.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,out=process.env.EVID,pass=process.env.ADMIN_PASS;
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:390,height:844}});
          const requests=[],consoleErrors=[],pageErrors=[];
          page.on('request',r=>requests.push(r.url())); page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e)));
          let response=await page.goto(base+'/channels.php',{waitUntil:'networkidle',timeout:30000});
          await page.locator('[data-vf-auth-login]').first().click();
          await page.locator('[data-vf-auth-dialog] input[name="password"]').fill(pass);
          await Promise.all([page.waitForLoadState('networkidle'),page.locator('[data-vf-auth-submit]').click()]);
          const top=await page.evaluate(()=>{
            const rect=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();const c=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:c.display,position:c.position,top:c.top,z:c.zIndex}};
            const buttons=[...document.querySelectorAll('.vf-icon-button')].map(e=>{const r=e.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height),text:(e.textContent||'').trim(),display:getComputedStyle(e).display}}).filter(x=>x.display!=='none');
            return {admin:document.body.innerText.includes('资源管理')&&document.body.innerText.includes('退出'),scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,domain:rect('.vf-global-domain-nav'),command:rect('.vf-mobile-command-row'),filters:rect('.vf-mobile-functional-filters'),toolbar:rect('.vf-workspace-toolbar'),firstRow:rect('[data-asset-row]'),buttons,assetActions:[...document.querySelectorAll('.vf-asset-actions')].length};
          });
          await page.screenshot({path:`${out}/channels-admin-mobile-top.png`,fullPage:true});
          await page.evaluate(()=>window.scrollTo(0,Math.min(document.documentElement.scrollHeight-844,760))); await page.waitForTimeout(250);
          const scrolled=await page.evaluate(()=>{
            const rect=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();const c=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),position:c.position,top:c.top,z:c.zIndex}};
            return {scrollY:Math.round(scrollY),domain:rect('.vf-global-domain-nav'),toolbar:rect('.vf-workspace-toolbar'),visibleRows:[...document.querySelectorAll('[data-asset-row]')].filter(e=>{const r=e.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight}).length};
          });
          await page.screenshot({path:`${out}/channels-admin-mobile-scrolled.png`,fullPage:false});
          const canonical=[...new Set(requests.filter(u=>u.includes('/asset.php?file=resource-actions.css')))];
          const wrong=[...new Set(requests.filter(u=>/\/resource-actions\.css(?:\?|$)/.test(u)&&!u.includes('/asset.php?')))];
          const report={status:response?.status()||0,top,scrolled,canonical,wrong,consoleErrors,pageErrors}; fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2)); console.log(JSON.stringify(report));
          await browser.close();
          const small=top.buttons.filter(b=>b.w<40||b.h<40);
          if(!top.admin||top.scrollWidth>top.clientWidth||top.assetActions<1||small.length||wrong.length||canonical.length!==1||pageErrors.length) process.exit(4);
          if(consoleErrors.some(x=>x.includes('MIME type')||x.includes('resource-actions.css'))) process.exit(5);
          if(!top.command||!top.filters||!top.toolbar||!scrolled.toolbar||scrolled.toolbar.y<0||scrolled.toolbar.y>90) process.exit(6);
          console.log('P01_MOBILE_ADMIN_POST_ACTIONS_MACHINE_GATE=PASS');
          JS
          cd "$PW"; PORT="$PORT" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" node visual.mjs | tee "$EVID/machine.txt"
      - name: Boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'P01_REF_WRITE=NO\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' | tee "$EVID/boundary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-admin-post-actions-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-mobile-admin-post-actions.pid 2>/dev/null)" 2>/dev/null || true
