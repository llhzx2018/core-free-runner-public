name: P01 Mobile Admin Post-Actions Visual Gate R4
on:
  push:
    branches: [tmp/p01-cover-coverage-diagnostic-20260902]
    paths: [.github/workflows/p01-mobile-admin-post-actions-visual-gate-20260902.yml]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: 839329a10b2dc036114a76ae8f7ca576664bfe02
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-mobile-admin-post-actions/evidence
      PW: /tmp/p01-mobile-admin-post-actions/pw
      PORT: '18550'
      ADMIN_PASS: P01MobileAdmin2026
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact source fence and fresh setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-mobile-admin-post-actions; mkdir -p "$EVID" "$PW"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'SOURCE=%s\nREMOTE_DEVELOP=%s\n' "$SOURCE" "$REMOTE" | tee "$EVID/source.txt"
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-mobile-admin-post-actions.pid
          COOKIE=/tmp/p01-mobile-admin-post-actions.cookies
          for i in $(seq 1 60); do
            if curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html"; then break; fi
            sleep .25
          done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read(); m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s); assert m; print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Mobile Admin Visual R4' \
            --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
      - name: Seed 30-row deep-scroll admin dataset
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$ROOT" php <<'PHP' | tee "$EVID/dataset.txt"
          <?php
          declare(strict_types=1);
          require getenv('ROOT').'/app/bootstrap.php'; require getenv('ROOT').'/app/SurfaceRepository.php';
          $db=vf_db(); $repo=new VfRepository($db); $surface=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'移动管理深滚动测试','description'=>'','icon'=>'','is_private'=>1,'sort_order'=>0]);
          for($i=1;$i<=30;$i++){
            $saved=$repo->saveLink(null,['category_id'=>$cat,'title'=>'频道资源 '.$i.' · 手机深滚动与管理按钮','url'=>'https://example.com/mobile-admin-r4-'.$i,'description'=>'验证 390px 管理态 toolbar sticky 与 40px 操作按钮','is_private'=>1],'manual');
            $surface->upsertProfile((int)$saved['id'],['surface'=>'channels','resource_kind'=>$i%2===0?'视频':'频道']);
          }
          echo 'COUNT=30'."\n";
          $integrity=strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn()); $fk=count($db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));
          echo "INTEGRITY=$integrity\nFK=$fk\n"; if($integrity!=='ok'||$fk!==0) exit(2);
          PHP
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PW"; npm init -y >/dev/null 2>&1; npm install --silent playwright@1.55.0; npx playwright install chromium
      - name: Logged-in 390px deep-scroll readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PW/visual.mjs" <<'JS'
          import { chromium } from 'playwright'; import fs from 'fs';
          const base=`http://127.0.0.1:${process.env.PORT}`,out=process.env.EVID,pass=process.env.ADMIN_PASS;
          const browser=await chromium.launch({headless:true}); const page=await browser.newPage({viewport:{width:390,height:844}});
          const requests=[],consoleErrors=[],pageErrors=[];
          page.on('request',r=>requests.push(r.url())); page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())}); page.on('pageerror',e=>pageErrors.push(String(e)));
          const response=await page.goto(base+'/channels.php',{waitUntil:'networkidle',timeout:30000});
          const login=page.locator('[data-vf-auth-login]:visible').first(); if(await login.count()!==1) throw new Error('VISIBLE_LOGIN_TRIGGER_NOT_UNIQUE');
          await login.click(); await page.locator('[data-vf-auth-dialog] input[name="password"]').fill(pass); await page.locator('[data-vf-auth-submit]').click();
          await page.locator('[data-vf-auth-logout]:visible').first().waitFor({state:'visible',timeout:30000});
          await page.locator('[data-open-add]:visible').first().waitFor({state:'visible',timeout:30000}); await page.waitForLoadState('networkidle');
          const snapshot=()=>page.evaluate(()=>{
            const box=e=>{if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),position:c.position,top:c.top,z:c.zIndex}};
            const toolbar=document.querySelector('.vf-workspace-toolbar'),domain=document.querySelector('.vf-global-domain-nav');
            const buttons=[...document.querySelectorAll('.vf-icon-button')].filter(e=>getComputedStyle(e).display!=='none').map(e=>{const r=e.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height)}});
            const rows=[...document.querySelectorAll('[data-asset-row]')].map(e=>box(e));
            return {scrollY:Math.round(scrollY),scrollHeight:document.documentElement.scrollHeight,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth,toolbar:box(toolbar),domain:box(domain),buttons,rows,assetActions:document.querySelectorAll('.vf-asset-actions').length};
          });
          const top=await snapshot(); await page.screenshot({path:`${out}/channels-admin-mobile-top.png`,fullPage:false});
          await page.evaluate(()=>window.scrollTo(0,650)); await page.waitForTimeout(300); const deep=await snapshot(); await page.screenshot({path:`${out}/channels-admin-mobile-deep.png`,fullPage:false});
          const canonical=[...new Set(requests.filter(u=>u.includes('/asset.php?file=resource-actions.css')))]; const wrong=[...new Set(requests.filter(u=>/\/resource-actions\.css(?:\?|$)/.test(u)&&!u.includes('/asset.php?')))];
          const firstBelow=deep.rows.find(r=>r&&r.bottom!==undefined?r.bottom>deep.toolbar.y+deep.toolbar.h:r&&r.y+r.h>deep.toolbar.y+deep.toolbar.h);
          const report={status:response?.status()||0,top,deep,canonical,wrong,consoleErrors,pageErrors,firstBelow}; fs.writeFileSync(`${out}/report.json`,JSON.stringify(report,null,2)); console.log(JSON.stringify(report)); await browser.close();
          const small=deep.buttons.filter(b=>b.w<40||b.h<40);
          if(report.status!==200||top.scrollWidth>top.clientWidth||deep.scrollWidth>deep.clientWidth||deep.assetActions!==30||small.length||wrong.length||canonical.length!==1||pageErrors.length) process.exit(4);
          if(consoleErrors.some(x=>x.includes('MIME type')||x.includes('resource-actions.css'))) process.exit(5);
          if(deep.scrollY<500||!deep.toolbar||deep.toolbar.position!=='sticky'||Math.abs(deep.toolbar.y-40)>2||!deep.domain||deep.domain.y!==0) process.exit(6);
          console.log('P01_MOBILE_ADMIN_POST_ACTIONS_DEEP_SCROLL_GATE=PASS');
          JS
          cd "$PW"; PORT="$PORT" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" node visual.mjs | tee "$EVID/machine.txt"
      - name: Boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REMOTE="$(git -C product ls-remote origin refs/heads/develop | awk '{print $1}')"; test "$REMOTE" = "$SOURCE"
          printf 'P01_REF_WRITE=NO\nMAIN_WRITE=NO\nPRODUCTION_WRITE=NO\nRUNNER_MAIN_WRITE=NO\n' | tee "$EVID/boundary.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-mobile-admin-post-actions-r4-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-mobile-admin-post-actions.pid 2>/dev/null)" 2>/dev/null || true
