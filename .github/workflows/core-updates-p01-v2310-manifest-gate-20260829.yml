name: Core Updates P01 V2.31 Manifest Gate
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths: [.github/workflows/core-updates-p01-v2310-manifest-gate-20260829.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = 7dac8b5d59d92f2a4997438fec9abeb4b3143ee5
          test "$(git -C updates merge-base 53fc02ebd99007793877a281e53238a591e7e485 HEAD)" = 53fc02ebd99007793877a281e53238a591e7e485
          test "$(git -C updates diff --name-only 53fc02ebd99007793877a281e53238a591e7e485...HEAD)" = projects/P01.json
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.30.0" and .target_version=="2.31.0" and
            .update_type=="ATOMIC" and .from_versions==["2.30.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.31.0" and
            .release_id==379001173 and
            .product_identity=="0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4" and
            .asset_name=="VF_Start_V2.31.0_UPDATE.zip" and
            .asset_bytes==1324509 and
            .asset_sha256=="41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-29T13:53:01Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.31.0)
          test "$(jq -r .object.sha <<<"$TAG")" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.31.0)
          test "$(jq -r .id <<<"$REL")" = 379001173
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.31.0_UPDATE.zip")|.size' <<<"$REL")" = 1324509
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.31.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774
          rm -rf /tmp/p01-v2310-manifest-asset && mkdir -p /tmp/p01-v2310-manifest-asset
          gh release download v2.31.0 --repo llhzx2018/vf-start --pattern VF_Start_V2.31.0_UPDATE.zip --dir /tmp/p01-v2310-manifest-asset
          A=/tmp/p01-v2310-manifest-asset/VF_Start_V2.31.0_UPDATE.zip
          test "$(stat -c%s "$A")" = 1324509
          echo "41228689f1abb2bf7d774ac3600be18726d128d9911341318e95f7e00562a774  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.31.0.php >/dev/null
          echo CORE_UPDATES_P01_V2310_MANIFEST_GATE=PASS
          echo CORE_UPDATES_MAIN_WRITE=NO
          echo OWNER_PRODUCTION_WRITE=NO
