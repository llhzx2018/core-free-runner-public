name: P01 V2.36.2 Main Promotion
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-v2362-main-promotion-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 4fd25a5ce4383dc456e755fc2e031a861d6ff655
      FORMAL_TREE: 0f0e5329098ad5a87a4a72dbd368c88d7a44b339
      RUNTIME_TREE: 55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424
      EXPECTED_MAIN: e29e5f56ad74cb98841d01764d73b680bd8913ba
      EXPECTED_DEVELOP: d3b6f4af92cbfab28df465938ea8348a35909052
      CANDIDATE_RUN: '33478737169'
      BIND_RUN: '33479052985'
      FORMAL_RUN: '33485021418'
      STRICT_RUN: '33485364786'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact Promotion Gate and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$EXPECTED_DEVELOP"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.2 >/dev/null 2>&1; then echo UNEXPECTED_V2362_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" "$EXPECTED_DEVELOP" --quiet
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$FORMAL_SOURCE"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$EXPECTED_DEVELOP"
          test "$(git rev-parse "$EXPECTED_DEVELOP:src")" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.36.2
          test "$(cat src/VERSION.txt)" = 2.36.2
          grep -Fx "define('VF_VERSION', '2.36.2');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .v2_36_2_candidate_gate.state VF_PROJECT.json)" = PASS
          git push origin "$FORMAL_SOURCE:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$FORMAL_SOURCE"
          test "$REMOTE_DEVELOP" = "$EXPECTED_DEVELOP"
          test "$(git rev-parse "$REMOTE_DEVELOP:src")" = "$RUNTIME_TREE"
          printf 'P01_V2362_MAIN_PROMOTION=PASS\nMAIN=%s\nDEVELOP=%s\nFORMAL=%s\nCANDIDATE_RUN=%s\nBIND_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_RUN=%s\nTAG=ABSENT\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$REMOTE_DEVELOP" "$FORMAL_SOURCE" "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2362-main-promotion.txt
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2362-main-promotion-${{ github.run_id }}
          path: /tmp/p01-v2362-main-promotion.txt
          if-no-files-found: error
          retention-days: 90
