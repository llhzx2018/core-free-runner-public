name: S01 C02 M3U8 Downloader R17 Candidate
on:
  push:
    branches: [task/s01-c02-1211105-tools-r17-ux-20261012]
permissions:
  contents: read
jobs:
  tools-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout isolated runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops tools candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 2e66ee6a9318679be03590a9e2c85be3374b50d8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Exact source and PHP syntax
        run: |
          test "$(git -C product rev-parse HEAD)" = 2e66ee6a9318679be03590a9e2c85be3374b50d8
          test "$(cat product/VERSION)" = 1.21.1104
          php -l product/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l product/includes/s01/tool-workbench.php
          node --check product/tests/s01-c02-1211105-m3u8-tools-r17-browser-proof.js
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify workbench responsive controls and safety boundaries
        working-directory: product
        run: |
          node tests/s01-c02-1211105-m3u8-tools-r17-browser-proof.js
          echo S01_C02_1211105_M3U8_TOOLS_R17_CANDIDATE_PASS
