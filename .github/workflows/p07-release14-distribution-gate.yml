name: P07 Release14 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release14-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release14 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release14'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release14"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release14"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="e437d91b0ba6f257464659b50858e96a099184ce"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="28c92ee9abb0cb36f190567fde2de4fe36305521"' installers/p07.sh
          grep -Fq '## Stable Final Verification Contract' "$root/docs/authority/RPD.md"
          grep -Fq '| B46 | Stable Final Verification / Exact Beginner Diagnosis |' "$root/docs/authority/ACCEPTANCE_MATRIX.md"
          grep -Fq 'OWNER_REAL_RELEASE13_FAIL' "$root/docs/authority/ACCEPTANCE_MATRIX.md"

      - name: Exact overlay and runtime manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()

          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              manifest=root/name
              for line in manifest.read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  actual=blob(path)
                  assert actual==expected, (name, rel, actual, expected)

          runtime=(root/'RUNTIME.gitblob').read_text(encoding='utf-8')
          assert '37e287dc33c8fa3dbbf5cf40d0499335ef99fcfa  BUILD_ID' in runtime
          assert '82f4e585a40fe18c9818583393ce37d3ad5dd0d4  lib/package_core.py' in runtime
          assert '11aa4a397e35a969d171b625c1a4e78b2f450387  lib/diagnostics.py' in runtime
          assert '37753ee68e14ac459a036a977df5d27dd78fc773  lib/terminal_ui.sh' in runtime

          full=(root/'MANIFEST.gitblob').read_text(encoding='utf-8')
          assert 'b4ca28ab0d6c318408004d1b821e1822ceb9a010  tests/test_release14_final_verify.py' in full
          assert '707feb9dc2286503d1ed1729df8a57fc85f77ba9  tests/test_release12_backup_freshness.py' in full
          PY

      - name: Stable final verify contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'def verify_package_stable' "$root/lib/package_core.py"
          grep -Fq 'consecutive_passes: int = 2' "$root/lib/package_core.py"
          grep -Fq 'attempts: int = 4' "$root/lib/package_core.py"
          grep -Fq 'def verification_failure_code' "$root/lib/package_core.py"
          grep -Fq 'SITE_ARCHIVE_INVALID' "$root/lib/diagnostics.py"
          grep -Fq "blocker_text='网站文件压缩包无法完整读取" "$root/lib/terminal_ui.sh"

      - name: Focused overlay regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          bash -n bin/vfops
          bash -n bin/vfops-site-ui
          bash -n lib/terminal_ui.sh
          python3 -m py_compile lib/package.py lib/package_core.py lib/diagnostics.py
          python3 -m unittest -q             tests.test_release14_final_verify             tests.test_release13_mysql_snapshot             tests.test_release12_backup_freshness             tests.test_backup             tests.test_backup_frontend             tests.test_terminal_ui_color_contract             tests.test_user_entry

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1

          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release14'
          grep -Fq 'lib/package_core.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/diagnostics.py' "$tmp/install/.runtime-manifest.gitblob"
          grep -Fq 'lib/terminal_ui.sh' "$tmp/install/.runtime-manifest.gitblob"

          NO_COLOR=1 bash -c "source '$tmp/install/lib/terminal_ui.sh'; ui_safe_diagnostic 'VFOPS_DIAGNOSTIC_V1 stage=BACKUP error_class=BACKUP_ERROR blocker=SITE_ARCHIVE_INVALID cleanup=NOT_REPORTED exit_code=4'" >"$tmp/diag.txt"
          grep -Fq '阶段：备份' "$tmp/diag.txt"
          grep -Fq '原因：网站文件压缩包无法完整读取' "$tmp/diag.txt"
          ! grep -Fq 'SITE_ARCHIVE_INVALID' "$tmp/diag.txt"
          ! grep -Fq '原因代码' "$tmp/diag.txt"

          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Safety boundary
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E '(PRIVATE KEY|BEGIN OPENSSH|ghp_[A-Za-z0-9]|github_pat_)' "$root/bin" "$root/lib" installers/p07*.sh
          ! grep -R -n -E '(^|[^A-Za-z])(rm[[:space:]]+-rf[[:space:]]+/($|[[:space:]]))' installers/p07*.sh "$root/bin" "$root/lib"
          grep -Fq 'DNS：未修改' "$root/bin/vfops-site-ui"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE14_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
