name: P01 V2.21.20 Cache Buster Patch
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-cache-buster-patch.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PUB: ${{ github.token }}
    steps:
      - name: Exact private source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          token=os.environ['W']; repo='llhzx2018/vf-start'; branch='maintenance/sidebar-density-2.21.20-20260819'; expected='49f7c74a72c0661e8e06903081547415270ddf7f'; path='src/index.php'
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
          ref=get(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}')
          head=ref['object']['sha']
          if head!=expected:raise SystemExit(f'HEAD_DRIFT expected={expected} got={head}')
          f=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}')
          raw=base64.b64decode(f['content']).decode('utf-8')
          old='assets/reference-ui.js?v=22119'; new='assets/reference-ui.js?v=22120'
          if raw.count(old)!=1:raise SystemExit(f'CACHE_BUSTER_MATCH_COUNT={raw.count(old)}')
          if new in raw:raise SystemExit('NEW_CACHE_BUSTER_ALREADY_PRESENT_UNEXPECTED')
          changed=raw.replace(old,new,1)
          body={'message':'fix(P01): bump reference UI cache for sidebar refinement','content':base64.b64encode(changed.encode()).decode(),'sha':f['sha'],'branch':branch}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:out=json.load(r)
          new_head=out['commit']['sha']; open('/tmp/new_head','w').write(new_head)
          # exact readback
          g=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={new_head}')
          rr=base64.b64decode(g['content']).decode('utf-8')
          if rr.count(new)!=1 or old in rr:raise SystemExit('READBACK_MISMATCH')
          print('P01_V22120_CACHE_BUSTER_PATCH=PASS',new_head)
          PY
      - name: Publish sanitized evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          try:new=open('/tmp/new_head').read().strip()
          except:new=''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','gate':'CACHE_BUSTER_PATCH','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','source_before':'49f7c74a72c0661e8e06903081547415270ddf7f','source_after':new,'changed_path':'src/index.php','old':'reference-ui.js?v=22119','new':'reference-ui.js?v=22120','workflow_run_id':os.environ['RID'],'private_data_persisted_publicly':False};c=json.dumps(q,indent=2)+'\n';t=os.environ['PUB'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-CACHE-BUSTER-PATCH.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): publish V2.21.20 cache buster patch','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
