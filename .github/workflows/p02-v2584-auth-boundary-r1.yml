name: P02 V2.5.84 Auth Boundary R1

on:
  push:
    branches:
      - run/p02-v2584-auth-boundary-r1-20260922
    paths:
      - '.github/workflows/p02-v2584-auth-boundary-r1.yml'

permissions:
  contents: read

jobs:
  auth-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 47d01f119d40cc1166874b4909201f053570cd2e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Focused source and unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "47d01f119d40cc1166874b4909201f053570cd2e"
          test "$(cat VERSION)" = "2.5.84"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node --check public/assets/app.js
          node --check public/assets/scratch-tabs.js
          node tests/unit/p02_v2584_auth_boundary_continuity.mjs
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V2584_AUTH_BOUNDARY_SOURCE=PASS

      - name: Maintenance baseline
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2584-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2584-auth-boundary
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
          echo P02_V2584_AUTH_BOUNDARY_MAINTENANCE=PASS

      - name: Focused Chromium auth boundary
        shell: bash
        working-directory: product
        env:
          VF_UX_FOCUSED_AUTH_SAFETY: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2584-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
          echo P02_V2584_AUTH_BOUNDARY_BROWSER_GATE=PASS

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-v2584-auth-boundary-r1
          path: ${{ runner.temp }}/p02-v2584-auth-boundary
          if-no-files-found: ignore
          retention-days: 7
