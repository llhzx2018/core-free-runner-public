name: P01 V2.37.1 Release Publish
on:
  push:
    branches: [release/p01-v2371-hotfix-20260902]
    paths: [.github/workflows/p01-v2371-release-publish-20260902.yml]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 0838e47ec49bb961131da81b0b314ebf77f1e126
      ARTIFACT_RUN: '33593977785'
      ARTIFACT_ID: '9832727218'
      STRICT_RUN: '33594101321'
    steps:
      - name: Verify frozen Runner evidence and download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$ARTIFACT_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN --jq .conclusion)" = success
          META="$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID)"
          test "$(jq -r .workflow_run.id <<<"$META")" = "$ARTIFACT_RUN"
          mkdir -p /tmp/v2371-release
          gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip > /tmp/v2371-release/artifact.zip
          unzip -q /tmp/v2371-release/artifact.zip -d /tmp/v2371-release/unpacked
          FULL="$(find /tmp/v2371-release/unpacked -type f -name 'VF-Start-V2.37.1-FULL.zip' -print -quit)"
          test -n "$FULL"; ASSETS="$(dirname "$FULL")"; echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          test "$(find "$ASSETS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.37.1-FULL.zip.sha256 && sha256sum -c VF_Start_V2.37.1_UPDATE.zip.sha256 && sha256sum -c repair-v2.37.1.php.sha256)
      - name: Publish exact tag and stable release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq .object.sha)" = "$FORMAL_SOURCE"
          if gh api repos/llhzx2018/vf-start/git/ref/tags/v2.37.1 >/dev/null 2>&1; then echo 'tag exists before publication' >&2; exit 21; fi
          gh api -X POST repos/llhzx2018/vf-start/git/refs -f ref='refs/tags/v2.37.1' -f sha="$FORMAL_SOURCE" >/tmp/tag-create.json
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.37.1 --jq .object.sha)" = "$FORMAL_SOURCE"
          gh release create v2.37.1 --repo llhzx2018/vf-start --verify-tag --title 'VF Start V2.37.1' --notes-file "$ASSETS/P01-V2.37.1-RELEASE-NOTES.md" "$ASSETS"/*
          REL="$(gh api repos/llhzx2018/vf-start/releases/tags/v2.37.1)"
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          jq '{id,tag_name,name,draft,prerelease,published_at,assets:[.assets[]|{name,size,id}]}' <<<"$REL" | tee /tmp/v2371-release.json
          UPDATE_ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.37.1_UPDATE.zip")|.id' <<<"$REL")"
          test -n "$UPDATE_ID"
          gh api -H 'Accept: application/octet-stream' repos/llhzx2018/vf-start/releases/assets/$UPDATE_ID > /tmp/release-update.zip
          test "$(sha256sum /tmp/release-update.zip | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$ASSETS/VF_Start_V2.37.1_UPDATE.zip.sha256")"
          test "$(stat -c%s /tmp/release-update.zip)" = "$(stat -c%s "$ASSETS/VF_Start_V2.37.1_UPDATE.zip")"
          printf 'P01_V2371_RELEASE_PUBLISH=PASS\nTAG=v2.37.1\nSOURCE=%s\nASSETS=8\nFROZEN_ARTIFACT_ID=%s\nSTRICT_RUN=%s\nREBUILD=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL_SOURCE" "$ARTIFACT_ID" "$STRICT_RUN" | tee /tmp/v2371-release-verdict.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2371-release-publish-${{ github.run_id }}
          path: |
            /tmp/v2371-release.json
            /tmp/v2371-release-verdict.txt
          if-no-files-found: warn
          retention-days: 90
