name: TEMP S01-C02 Ops 1.21.800 Formal Release

on:
  push:
    branches:
      - temp/s01-c02-v121800-formal-release-20260903
    paths:
      - '.github/workflows/temp-s01-c02-v121800-formal-release.yml'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_COMMIT: 7f7babb6a92ea297dc99e86ac632fcef22c96319
      TARGET_TREE: 9585eee48c4fb19e5bae9eb605f8bb15d40bafb2
      BASE_RELEASE_COMMIT: 4a04c70ba20ba7407230c8121aa6e5f11ac29743
      CANDIDATE_GATE_RUN: '33840991484'
      CANDIDATE_GATE_RUNNER_SHA: edc1d2447ee462511948a8e1a2eba398f5a74b96
      VERSION: 1.21.800
      TAG: v1.21.800
      RELEASE_NAME: VF Tools Ops V1.21.800
      ASSET_NAME: vf-tools-ops_V1.21.800.zip
      EXPECTED_ASSET_BYTES: '3202939'
      EXPECTED_ASSET_SHA256: e2d96560a2bc9dfb2779e07d6754cd3fa21bbf74ad23ebbe4de3a5ec975e0510
      EXPECTED_RUNTIME_FILES: '895'
      EXPECTED_RUNTIME_FP: 0132bef9fd0a8cf3050fff7d44c3b788d181c449b7bee2514e22e6e9ccd55223
      EVIDENCE_DIR: /tmp/s01-c02-v121800-formal-release
    steps:
      - name: Credential presence gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo RELEASE_CREDENTIALS=PASS

      - name: Verify exact Candidate Gate PASS
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${CANDIDATE_GATE_RUN}")"
          test "$(jq -r '.status' <<<"$JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$JSON")" = success
          test "$(jq -r '.head_sha' <<<"$JSON")" = "$CANDIDATE_GATE_RUNNER_SHA"
          printf '%s\n' "$JSON" > "$EVIDENCE_DIR/candidate-gate-run.json"
          echo EXACT_PACKAGED_CANDIDATE_GATE=PASS

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify source identity and bounded scope
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.800' ops/vf-ops.php
          MAIN_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/main")"
          DEV_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/develop")"
          test "$(jq -r '.commit.sha' <<<"$MAIN_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.commit.sha' <<<"$DEV_JSON")" = "$TARGET_COMMIT"
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort > "$EVIDENCE_DIR/changed-files.txt"
          cat > /tmp/expected-files.txt <<'EOF'
          .github/phase3/v121800-packaged-domain-authority.php
          VERSION
          includes/site-release/s01-project-authority.runtime.json
          vf-ops.php
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt "$EVIDENCE_DIR/changed-files.txt"
          echo SOURCE_IDENTITY_AND_SCOPE=PASS

      - name: Run focused source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php ops/.github/phase3/v121800-packaged-domain-authority.php | tee "$EVIDENCE_DIR/packaged-authority-contract.txt"
          grep -Fxq PASS_V121800_PACKAGED_DOMAIN_AUTHORITY "$EVIDENCE_DIR/packaged-authority-contract.txt"
          echo FOCUSED_SOURCE_CONTRACT=PASS

      - name: Build exact release artifact and lock Candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/release
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, json, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          for src in root.rglob('*'):
              if src.is_file() and not src.is_symlink():
                  rel=src.relative_to(root)
                  if ok(rel): files[rel.as_posix()]=src.read_bytes()
          files=dict(sorted(files.items()))
          assert 'VF_PROJECT.json' not in files
          assert 'includes/site-release/s01-project-authority.runtime.json' in files
          fp=hashlib.sha256()
          for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          zpath=Path('/tmp/release/'+os.environ['ASSET_NAME'])
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,3,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
          meta={
              'target_commit':os.environ['TARGET_COMMIT'],
              'target_tree':os.environ['TARGET_TREE'],
              'version':os.environ['VERSION'],
              'asset_name':os.environ['ASSET_NAME'],
              'asset_bytes':zpath.stat().st_size,
              'asset_sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),
              'runtime_files':len(files),
              'runtime_fingerprint':fp.hexdigest(),
              'root_vf_project_packaged':False,
              'packaged_authority_snapshot':True,
              'candidate_gate_run':int(os.environ['CANDIDATE_GATE_RUN'])
          }
          assert meta['asset_bytes']==int(os.environ['EXPECTED_ASSET_BYTES']),meta
          assert meta['asset_sha256']==os.environ['EXPECTED_ASSET_SHA256'],meta
          assert meta['runtime_files']==int(os.environ['EXPECTED_RUNTIME_FILES']),meta
          assert meta['runtime_fingerprint']==os.environ['EXPECTED_RUNTIME_FP'],meta
          Path(os.environ['EVIDENCE_DIR']+'/artifact-identity.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          ! unzip -Z1 "/tmp/release/$ASSET_NAME" | grep -Fxq 'vf-ops/VF_PROJECT.json'
          unzip -Z1 "/tmp/release/$ASSET_NAME" | grep -Fxq 'vf-ops/includes/site-release/s01-project-authority.runtime.json'
          unzip -p "/tmp/release/$ASSET_NAME" vf-ops/includes/site-release/s01-project-authority.runtime.json | jq -e '.search_analytics.final_public_host=="https://ilovem3u8.com" and .generated_for=="1.21.800"' >/dev/null
          echo EXACT_RELEASE_ARTIFACT=PASS

      - name: Verify release absence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = 404
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404

      - name: Create exact tag and release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          cat > /tmp/release-body.md <<EOF
          VF Tools Ops V1.21.800 closes the packaged-runtime final-domain authority gap observed on Production 1.21.799.

          - Exact Production 1.21.799 Release ZIP failure was reproduced: VF_PROJECT.json is not part of the runtime artifact, so final-domain authority was missing.
          - 1.21.800 packages a minimal public-safe S01 domain authority snapshot under includes/site-release and uses it only when the source-only VF_PROJECT.json router is absent.
          - Exact packaged 1.21.799 -> exact packaged 1.21.800 upgrade passed on WordPress 7.1 / MariaDB 11.4 in Candidate Gate ${CANDIDATE_GATE_RUN}.
          - Final host reconciles from https://ilovem3u8.pages.dev to https://ilovem3u8.com; old host-bound Static/Online PASS and freeze evidence are invalidated.
          - SEO authority-closure behavior is inherited unchanged; semantic keyword selection is never auto-promoted.
          - No post-content write, M3U8 write/migration, Seed HOLD release, JD.gg removal, WPvivid removal, or plugin-governance mutation.
          - Exact release source: ${TARGET_COMMIT}; tree: ${TARGET_TREE}.
          - Asset: ${ASSET_NAME}; bytes: ${EXPECTED_ASSET_BYTES}; SHA256: ${EXPECTED_ASSET_SHA256}.
          - Runtime files: ${EXPECTED_RUNTIME_FILES}; runtime fingerprint: ${EXPECTED_RUNTIME_FP}.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          sed -i 's/^          //' /tmp/release-body.md
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"; test -n "$RID"; test "$RID" != null; echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"

      - name: Upload exact artifact
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/release/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"; test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$EXPECTED_ASSET_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"

      - name: Remote exact readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          test "$(jq -r '.id' <<<"$REL_JSON")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$REL_JSON")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$REL_JSON")" = "$EXPECTED_ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$REL_JSON")" = "sha256:${EXPECTED_ASSET_SHA256}"
          printf '%s\n' "$TAG_JSON" > "$EVIDENCE_DIR/tag-readback.json"
          printf '%s\n' "$REL_JSON" > "$EVIDENCE_DIR/release-readback.json"
          jq -n --arg version "$VERSION" --arg target "$TARGET_COMMIT" --arg tree "$TARGET_TREE" --arg asset "$ASSET_NAME" --arg sha "$EXPECTED_ASSET_SHA256" --argjson bytes "$EXPECTED_ASSET_BYTES" --argjson files "$EXPECTED_RUNTIME_FILES" --arg fp "$EXPECTED_RUNTIME_FP" --argjson release_id "$RELEASE_ID" --argjson asset_id "$ASSET_ID" --argjson gate "$CANDIDATE_GATE_RUN" '{version:$version,target_commit:$target,target_tree:$tree,candidate_gate_run:$gate,release_id:$release_id,asset_id:$asset_id,asset_name:$asset,asset_bytes:$bytes,asset_sha256:$sha,runtime_files:$files,runtime_fingerprint:$fp,status:"PASS"}' > "$EVIDENCE_DIR/release-summary.json"
          cat "$EVIDENCE_DIR/release-summary.json"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-v121800-formal-release
          path: /tmp/s01-c02-v121800-formal-release/
          if-no-files-found: warn
          retention-days: 14
