name: TEMP S01-C02 Ops 1.21.833 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121833-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121833-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: b87c30f039c495122a59888b9c01d3b4431643d6
      TREE: efc2a1558b288b9e4851e8c9779f83fed3443e8e
      TAG: v1.21.833
      ASSET: vf-tools-ops_V1.21.833.zip
      BYTES: '3263185'
      SHA256: 824862408d688b479ecf041b72a5e48f289c11c1ccf435b92deead8530a1844a
      FILES: '915'
      FP: b399ed12f5abb130807e56d16e4be484488c62a6625536d3e336c700fb0a426c
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          release_code="$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$release_code" = 404
          tag_code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$tag_code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.833 adds a privacy-safe exact Candidate Entry Processor replay for the proven Stage-4 terminal failure.

          - Focused Gate 33988595517 PASS on exact source b87c30f039c495122a59888b9c01d3b4431643d6 / tree efc2a1558b288b9e4851e8c9779f83fed3443e8e; deterministic Artifact Identity 33988638631 PASS.
          - V1.21.832 proved the remaining 6 Source entries pass the individual path/repair/scrub phases and that the Tail Probe runtime is ready.
          - V1.21.833 now invokes the real Candidate Entry Processor in memory using shadow candidate-actions, shadow written-state and the existing route inventory, then performs a read-only completeness inspection.
          - It does not open or write the Candidate ZIP, persist Source/Candidate/content state, schedule work, retry Candidate, relax Final Audit or force Candidate/package/finalOnline PASS.
          - Public telemetry exposes only aggregate checked count, relative failure index, broad entry kind, processing phase, allowlisted Throwable class, shadow written count/delta and completeness status/reason count. No raw error, job identity, local path, filename, URL or Source SHA is exposed.
          - Production before upgrade remains 1.21.832 Candidate FAIL at Stage 4, persisted build offset 225/231, Tail Probe 6/6 PASS, Candidate package unavailable, Source reusable, manualSourceUploadRequired=false and finalOnlinePass=NO.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.833.zip; 3263185 bytes; SHA256 824862408d688b479ecf041b72a5e48f289c11c1ccf435b92deead8530a1844a; runtime files 915; fingerprint b399ed12f5abb130807e56d16e4be484488c62a6625536d3e336c700fb0a426c.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.833' --notes-file /tmp/release-notes.md
