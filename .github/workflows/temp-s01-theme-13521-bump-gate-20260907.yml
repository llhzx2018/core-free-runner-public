name: S01 Theme 1.35.21 Bump Gate
on:
  push:
    branches:
      - temp/s01-update-center-id-closure-20260907
    paths:
      - .github/workflows/temp-s01-theme-13521-bump-gate-20260907.yml
permissions:
  contents: read
jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      REPO: llhzx2018/vf-tools-theme
      BRANCH: work/s01-update-center-credential-first-20260907
      BASE_SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
      UX_SHA: b72826d7bb9600ef9d4b8615479870b6771e3b41
    steps:
      - uses: actions/checkout@v4
      - name: Bump exact Theme identity after credential-first UX gate
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: bash scripts/temp_s01_theme_13521_bump_20260907.sh
