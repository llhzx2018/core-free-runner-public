name: P01 UXUI Round2 Subject Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round2-subject-pages-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: 901db48da00b0ba8a13368b5d6509fc73fa59c14
      BASE_SHA: ddf1a103b6a7e25e9569185ecc177427fe0c9542
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round2-topics-projects-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 11
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
          ! grep -Fq 'surface.php' src/topics.php
          ! grep -Fq 'surface.php' src/projects.php
      - name: Syntax and permanent identity contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/topics.php src/projects.php src/project-signals.php src/app/SubjectPageChrome.php src/app/TopicLibraryPage.php src/app/ProjectActionCenterPage.php src/app/ProjectSignalRepository.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/project_signals_source_contract.php tests/unit/topic_project_approved_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round2_subject_identity_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Existing Topic Project signal regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          matched=0
          for f in tests/unit/*project*signal*.php tests/unit/*topic*project*.php tests/unit/*topic*cover*.php; do
            [ -f "$f" ] || continue
            echo "RUN $f"
            php "$f"
            matched=$((matched+1))
          done
          echo "focused existing contracts run: $matched"
          for f in tests/unit/workspace_view_catalog_contract.php tests/unit/consolidated_product_model_contract.php tests/unit/uxui_round1_home_root_contract.php; do
            [ -f "$f" ] && php "$f"
          done
      - name: Static visual-identity assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'grid-template-columns:repeat(4' src/assets/subject-pages.css
          grep -Fq 'grid-template-columns:repeat(3' src/assets/subject-pages.css
          grep -Fq '长期知识入口' src/app/TopicLibraryPage.php
          grep -Fq '状态与行动中心' src/app/ProjectActionCenterPage.php
          grep -Fq '需要你处理' src/app/ProjectActionCenterPage.php
          ! grep -Fq '热门入口' src/app/TopicLibraryPage.php
          ! grep -Eq '健康度百分比|完成度百分比|progress-percent' src/app/ProjectActionCenterPage.php
          echo P01_UXUI_ROUND2_SUBJECT_PAGES=PASS
