name: S01-C02 1.21.932 R43 wp-admin Preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121932-r43-wpadmin-preview.yml'

permissions:
  contents: read

jobs:
  wpadmin-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: db44417cd76ec1dd8b9369222209be0148ad550b
      EXPECTED_VERSION: 1.21.932
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      COMMENT_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify private read
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-NAVIGATION-ROLE-REBASELINE-R43" target/vf-ops.php
          echo "PREVIEW_SOURCE_IDENTITY=PASS"

      - name: Start verified disposable wp-admin preview and hold it open
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          ./cloudflared --version

          cat > preview-blueprint.json <<'JSON'
          {
            "$schema": "https://playground.wordpress.net/blueprint-schema.json",
            "preferredVersions": {
              "php": "8.3",
              "wp": "latest"
            },
            "landingPage": "/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow",
            "login": true,
            "steps": [
              {
                "step": "activatePlugin",
                "pluginPath": "vf-ops/vf-ops.php"
              }
            ]
          }
          JSON

          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:9400 > cloudflared.log 2>&1 &
          CF_PID=$!
          PLAYGROUND_PID=""

          cleanup() {
            if [ -n "$PLAYGROUND_PID" ]; then kill "$PLAYGROUND_PID" 2>/dev/null || true; fi
            kill "$CF_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ORIGIN=""
          for i in $(seq 1 60); do
            ORIGIN="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)"
            if [ -n "$ORIGIN" ]; then break; fi
            sleep 1
          done
          test -n "$ORIGIN"
          echo "PREVIEW_ORIGIN=$ORIGIN"

          npm init -y >/dev/null 2>&1
          npm install --no-save @wp-playground/cli@latest >/dev/null 2>&1

          cat > preview-server.mjs <<'JS'
          import { runCLI } from '@wp-playground/cli';
          import path from 'node:path';

          const root = process.cwd();
          const origin = process.env.PREVIEW_ORIGIN;
          const server = await runCLI({
            command: 'server',
            port: 9400,
            php: '8.3',
            wp: 'latest',
            login: true,
            siteUrl: origin,
            mount: [
              {
                hostPath: path.join(root, 'target'),
                vfsPath: '/wordpress/wp-content/plugins/vf-ops'
              }
            ],
            blueprint: {
              preferredVersions: { php: '8.3', wp: 'latest' },
              landingPage: '/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow',
              login: true,
              steps: [
                {
                  step: 'activatePlugin',
                  pluginPath: 'vf-ops/vf-ops.php'
                }
              ]
            }
          });

          console.log('PROGRAMMATIC_PLAYGROUND_READY=' + server.serverUrl);
          setInterval(() => {}, 1000 * 60 * 60);
          JS

          PREVIEW_ORIGIN="$ORIGIN" node preview-server.mjs > playground.log 2>&1 &
          PLAYGROUND_PID=$!

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9400/ >/dev/null 2>&1; then
              echo "PLAYGROUND_LOCAL=READY"
              break
            fi
            if ! kill -0 "$PLAYGROUND_PID" 2>/dev/null; then
              echo "PLAYGROUND_PROCESS_EXITED"
              cat playground.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9400/ >/dev/null

          PAGE="$ORIGIN/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow"
          LOCAL_PAGE="http://127.0.0.1:9400/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow"

          LOCAL_OK=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PLAYGROUND_PID" 2>/dev/null; then
              echo "PLAYGROUND_DIED_DURING_ADMIN_VERIFY"
              cat playground.log
              exit 1
            fi
            curl -L -fsS "$LOCAL_PAGE" -o local-admin.html || true
            if grep -Fq "VF 站点运营" local-admin.html 2>/dev/null && grep -Fq "vf-v6-domain-menu" local-admin.html 2>/dev/null; then
              echo "LOCAL_WPADMIN_CANDIDATE=PASS"
              LOCAL_OK=1
              break
            fi
            sleep 1
          done
          if [ "$LOCAL_OK" != "1" ]; then
            echo "LOCAL_WPADMIN_CANDIDATE=FAIL"
            tail -n 160 playground.log || true
            grep -E "wp-login|VF 站点运营|vf-v6-domain-menu|error|fatal" local-admin.html | head -n 80 || true
            exit 1
          fi

          CODE=""
          for i in $(seq 1 60); do
            CODE="$(curl -L -sS -o tunnel-check.html -w '%{http_code}' "$PAGE" || true)"
            if [ "$CODE" = "200" ]; then
              echo "PUBLIC_TUNNEL_HTTP=PASS"
              break
            fi
            sleep 1
          done
          test "$CODE" = "200"

          echo "WPADMIN_PREVIEW_RUNTIME=PASS"
          echo "OWNER_PREVIEW_URL=$PAGE"
          echo "Exact source: $TARGET_SHA"
          echo "Disposable WordPress Playground. Production untouched."
          echo "Preview lifetime: approximately 40 minutes."

          test -n "$COMMENT_TOKEN"
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment 1152 --repo "$GITHUB_REPOSITORY" --body "S01-C02 1.21.932 REAL wp-admin Preview Runtime READY — $PAGE — Exact source $TARGET_SHA — disposable WordPress Playground / PHP 8.3 — Production unchanged — no persistent secondary/tertiary navigation."

          for i in $(seq 1 80); do
            sleep 30
            kill -0 "$PLAYGROUND_PID"
            kill -0 "$CF_PID"
          done
