name: S01-C02 1.21.932 R43 wp-admin Preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121932-r43-wpadmin-preview.yml'

permissions:
  contents: read

jobs:
  wpadmin-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: db44417cd76ec1dd8b9369222209be0148ad550b
      EXPECTED_VERSION: 1.21.932
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      COMMENT_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify private read
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact Ops source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify candidate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-NAVIGATION-ROLE-REBASELINE-R43" target/vf-ops.php
          echo "PREVIEW_SOURCE_IDENTITY=PASS"

      - name: Start MySQL WordPress wp-admin preview and hold it open
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:9400 > cloudflared.log 2>&1 &
          CF_PID=$!

          cleanup() {
            docker rm -f vf-preview-wp vf-preview-db >/dev/null 2>&1 || true
            docker volume rm vf-preview-wp-data >/dev/null 2>&1 || true
            docker network rm vf-preview-net >/dev/null 2>&1 || true
            kill "$CF_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ORIGIN=""
          for i in $(seq 1 60); do
            ORIGIN="$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' cloudflared.log | head -n1 || true)"
            if [ -n "$ORIGIN" ]; then break; fi
            sleep 1
          done
          test -n "$ORIGIN"
          echo "PREVIEW_ORIGIN=$ORIGIN"

          docker network create vf-preview-net >/dev/null
          docker volume create vf-preview-wp-data >/dev/null

          docker run -d --name vf-preview-db --network vf-preview-net             -e MYSQL_ROOT_PASSWORD=preview-root             -e MYSQL_DATABASE=wordpress             -e MYSQL_USER=wordpress             -e MYSQL_PASSWORD=wordpress-preview             mysql:8.0 >/dev/null

          for i in $(seq 1 90); do
            if docker exec vf-preview-db mysqladmin ping -uroot -ppreview-root --silent >/dev/null 2>&1; then
              echo "MYSQL_PREVIEW=READY"
              break
            fi
            sleep 2
          done
          docker exec vf-preview-db mysqladmin ping -uroot -ppreview-root --silent >/dev/null

          docker run -d --name vf-preview-wp --network vf-preview-net -p 9400:80             -e WORDPRESS_DB_HOST=vf-preview-db:3306             -e WORDPRESS_DB_USER=wordpress             -e WORDPRESS_DB_PASSWORD=wordpress-preview             -e WORDPRESS_DB_NAME=wordpress             -v vf-preview-wp-data:/var/www/html             -v "$PWD/target:/var/www/html/wp-content/plugins/vf-ops:ro"             wordpress:php8.3-apache >/dev/null

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9400/ >/dev/null 2>&1; then
              echo "WORDPRESS_HTTP=READY"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9400/ >/dev/null

          # Explicitly bind wp-config.php to the disposable MySQL service.
          docker run --rm --user 0:0 --network vf-preview-net             -v vf-preview-wp-data:/var/www/html             -v "$PWD/target:/var/www/html/wp-content/plugins/vf-ops:ro"             wordpress:cli wp --allow-root config create               --path=/var/www/html               --dbname=wordpress               --dbuser=wordpress               --dbpass=wordpress-preview               --dbhost=vf-preview-db:3306               --skip-check               --force

          # Cloudflare terminates TLS before forwarding HTTP to localhost.
          # Teach WordPress to trust X-Forwarded-Proto so admin canonical/SSL
          # redirects do not loop on the public HTTPS preview URL.
          docker exec -i vf-preview-wp php <<'PHP'
          <?php
          $path = '/var/www/html/wp-config.php';
          $c = file_get_contents($path);
          $needle = "<?php\n";
          $extra = <<<'CFG'
          <?php
          if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos((string)$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
              $_SERVER['HTTPS'] = 'on';
              $_SERVER['SERVER_PORT'] = 443;
          }
          define('FORCE_SSL_ADMIN', true);

          CFG;
          if (strpos($c, "HTTP_X_FORWARDED_PROTO") === false) {
              $c = $extra . substr($c, strlen($needle));
              file_put_contents($path, $c);
          }
          PHP

          docker run --rm --user 0:0 --network vf-preview-net             -v vf-preview-wp-data:/var/www/html             -v "$PWD/target:/var/www/html/wp-content/plugins/vf-ops:ro"             wordpress:cli wp --allow-root core install               --path=/var/www/html               --url="$ORIGIN"               --title="VF Ops R43 Preview"               --admin_user=preview-owner               --admin_password='VF-R43-Preview-Only-932!'               --admin_email=preview@example.test               --skip-email

          docker run --rm --user 0:0 --network vf-preview-net             -v vf-preview-wp-data:/var/www/html             -v "$PWD/target:/var/www/html/wp-content/plugins/vf-ops:ro"             wordpress:cli wp --allow-root plugin activate vf-ops --path=/var/www/html

          docker exec vf-preview-wp mkdir -p /var/www/html/wp-content/mu-plugins
          docker exec -i vf-preview-wp sh -c 'cat > /var/www/html/wp-content/mu-plugins/vf-preview-autologin.php' <<'PHP'
          <?php
          /**
           * Disposable preview only. Any visitor to this throwaway WordPress
           * instance is treated as the preview administrator. No production
           * data or credentials exist in this runtime.
           */
          add_action('plugins_loaded', function () {
              if (is_user_logged_in()) { return; }
              $user = get_user_by('login', 'preview-owner');
              if (!$user) { return; }
              wp_set_current_user((int)$user->ID);
              wp_set_auth_cookie((int)$user->ID, false, is_ssl());
          }, 1);
          PHP
          docker exec vf-preview-wp chown -R www-data:www-data /var/www/html/wp-content/mu-plugins

          PAGE="$ORIGIN/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow"
          LOCAL_PAGE="http://127.0.0.1:9400/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow"

          # WordPress is configured with the public HTTPS tunnel origin, so
          # localhost requests correctly redirect to that origin. Verify the
          # actual public wp-admin runtime directly instead of following that
          # redirect back through localhost as HTTPS.

          CODE=""
          PUBLIC_OK=0
          for i in $(seq 1 90); do
            CODE="$(curl -L --max-redirs 8 -sS -o tunnel-check.html -w '%{http_code}' "$PAGE" || true)"
            if [ "$CODE" = "200" ] \
              && grep -Fq "VF 站点运营" tunnel-check.html 2>/dev/null \
              && grep -Fq "vf-v6-domain-menu" tunnel-check.html 2>/dev/null; then
              echo "PUBLIC_WPADMIN_CANDIDATE=PASS"
              PUBLIC_OK=1
              break
            fi
            sleep 1
          done
          if [ "$PUBLIC_OK" != "1" ]; then
            echo "PUBLIC_WPADMIN_CANDIDATE=FAIL HTTP=$CODE"
            grep -E "wp-login|VF 站点运营|vf-v6-domain-menu|error|fatal" tunnel-check.html | head -n 100 || true
            docker logs vf-preview-wp --tail 120 || true
            exit 1
          fi

          echo "WPADMIN_PREVIEW_RUNTIME=PASS"
          echo "OWNER_PREVIEW_URL=$PAGE"
          echo "Exact source: $TARGET_SHA"
          echo "Disposable MySQL WordPress runtime. Production untouched."

          test -n "$COMMENT_TOKEN"
          GH_TOKEN="$COMMENT_TOKEN" gh pr comment 1152 --repo "$GITHUB_REPOSITORY" --body "S01-C02 1.21.932 REAL wp-admin Preview READY — $PAGE — exact source $TARGET_SHA — disposable WordPress + MySQL / PHP 8.3 — Production unchanged."

          for i in $(seq 1 60); do
            sleep 30
            docker inspect -f '{{.State.Running}}' vf-preview-wp | grep -Fx true
            docker inspect -f '{{.State.Running}}' vf-preview-db | grep -Fx true
            kill -0 "$CF_PID"
          done
