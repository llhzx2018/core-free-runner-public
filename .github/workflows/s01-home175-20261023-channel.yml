name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-home175-20261023]
    paths: ['.github/workflows/s01-home175-20261023-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.175
  TARGET_SHA: 4227d5cc058124961a573826fd697cd10f304130
  UPDATE_SHA: 8e78c955701c6e34a1f8aa321529ce6c4650016d
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 8e78c955701c6e34a1f8aa321529ce6c4650016d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='947f99c2f72430bceb0404ec0f22abaca2d3c3488d1d5dc140953bffc6ff95bc' and m['asset_bytes']==1975041
          assert m['runtime_files']==476 and '1.35.174' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
