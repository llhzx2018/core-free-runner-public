name: P07 Care rc49 WordPress baseline owner safety formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc49-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): rc49 WP owner safety baseline gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical Public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Exact package and all 18 passing isolation gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'd94d78ba244e5fd4cd13704707d9d419a6f12452'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc49'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc49'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'f959600602521be6d912223ff045af2d09d00fc9'
          test "$(git hash-object "$pkg/intrusion-evidence.sh")" = 'd4bfbdf9ed3b8c8e8908850812172428c7897991'
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc49"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc49'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='f959600602521be6d912223ff045af2d09d00fc9'" installers/p07-system-care.sh
          grep -Fq '历史记录数量' "$pkg/intrusion-evidence.sh"
          grep -Fq 'TZ=Asia/Shanghai date -d' "$pkg/intrusion-evidence.sh"
          grep -Fq 'confirm_numeric' "$pkg/intrusion-evidence.sh"
          for id in 37771360975 37771360914 37771360968 37771360898 37771361029 37771360972 37771360998 37771361181 37771360877 37771360965 37771361229 37771360964 37771360958 37771361149 37771361220 37771360931 37771360955 37771361245; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '8237ce07c4f889f8d997492fc2d5b58f2e3249c9'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_RC49_EXACT_DISTRIBUTION_AND_TESTS=PASS
      - name: Create immutable formal release and verify readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc49-wp-owner-safe-baseline'
          target='d94d78ba244e5fd4cd13704707d9d419a6f12452'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · rc49 WordPress 历史事件解释及可信基线二次确认' \
              --notes '根据 OWNER 5 张真机截图，23 条历史变化中 0 项优先排查、19 项需要核实、4 项动态配置，并不证明网站被入侵或事件已经处理。本次只优化菜单4→6 WordPress 用户操作页面：历史异常明确写作累计记录，避免误解为本次新发现的入侵；扫描时间显示北京时间；基线更新前如仍有历史事件，必须由站长先核实更新来源、输入与现有历史记录相符的数量，并再用 Y/N 明确确认，单独输入 Y/Enter 不会将未核实文件设为参考状态。历史文件事件及请求证据原样保留，原扫描、基线及自动检查安全逻辑未修改，数据库仍按 UTC 记录。菜单1/2/3/5、菜单4已经 OWNER PASS 的页面及网络、测速模块全部冻结。全部 18/18 隔离 Machine Gate PASS，未对生产网站或系统做任何自动写入。OWNER 实机验收另行确认。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_RC49_FORMAL_RELEASE=PASS
