name: P07 V2.1 Reconcile Output

on:
  push:
    branches: [feature/p07-v21-lowload-fio-backtrace]
    paths:
      - '.github/scripts/p07_v21_reconcile.py'
      - '.github/workflows/p07-v21-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p07-v21-lowload-fio-backtrace
          fetch-depth: 0
      - name: Apply output reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/p07_v21_reconcile.py
          bash -n experiments/p07-vps-audit-v21.sh
          grep -q '基础综合结论' experiments/p07-vps-audit-v21.sh
          grep -q '完整验机总耗时' experiments/p07-vps-audit-v21.sh
          grep -q 'normalize_base_output' experiments/p07-vps-audit-v21.sh
      - name: Commit reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- experiments/p07-vps-audit-v21.sh; then
            echo 'No product diff to commit.'
            exit 0
          fi
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add experiments/p07-vps-audit-v21.sh
          git commit -m 'fix(P07): unify V2.1 output and final verdict'
          git push origin HEAD:feature/p07-v21-lowload-fio-backtrace
