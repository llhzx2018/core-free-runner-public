name: S01 Ops R14 recovery read-only render gate
on:
  push:
    branches: [task/s01-c02-r14-recovery-readonly-20261013]
    paths: [.github/workflows/s01-c02-r14-recovery-readonly-render-20261013.yml]
permissions:
  contents: read
jobs:
  recovery-readonly-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ed80e2466b090283dd8e6346d6d740813eaac01d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exact candidate, PHP syntax and real rendered view variants
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = ed80e2466b090283dd8e6346d6d740813eaac01d
          php -l candidate/includes/admin-v13/views/system_recovery.php
          php -l candidate/tests/s01-c02-recovery-export-evidence-diagnostic-render.php
          php candidate/tests/s01-c02-recovery-export-evidence-diagnostic-render.php
          php candidate/tests/s01-c02-1211104-recovery-owner-issue-dedup-proof.php
          php candidate/tests/s01-c02-1211103-recovery-seed-verified-model-proof.php
          node --check candidate/assets/js/v13/system/recovery.js
          echo S01_C02_R14_RECOVERY_READONLY_RENDER_AND_LEGACY_REGRESSIONS_PASS
      - name: Prove no destructive execution changes in exact source diff
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only a93d19dd9e920470b7244308189e45cedab8ed98..HEAD > /tmp/s01-r14-paths.txt
          grep -qx 'includes/admin-v13/views/system_recovery.php' /tmp/s01-r14-paths.txt
          grep -qx 'tests/s01-c02-recovery-export-evidence-diagnostic-render.php' /tmp/s01-r14-paths.txt
          test "$(wc -l < /tmp/s01-r14-paths.txt)" -eq 2
          git -C candidate diff -U0 a93d19dd9e920470b7244308189e45cedab8ed98..HEAD -- includes/admin-v13/views/system_recovery.php > /tmp/s01-r14-product.patch
          # Product delta must modify exactly two read-only presentation lines.
          test "$(grep -c '^+[^+]' /tmp/s01-r14-product.patch)" -eq 2
          test "$(grep -c '^-[^-]' /tmp/s01-r14-product.patch)" -eq 2
          ! grep -E '^[+][^+].*(admin_post|restore_engine|delete_option|update_option|wp_delete|wp_die|nonce_field)' /tmp/s01-r14-product.patch
          echo S01_C02_R14_NO_DESTRUCTIVE_RESTORE_PATH_CHANGED_PASS
      - name: Clean temporary Ops checkout
        if: always()
        run: rm -rf candidate /tmp/s01-r14-paths.txt /tmp/s01-r14-product.patch
