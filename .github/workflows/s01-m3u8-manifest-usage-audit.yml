name: S01 M3U8 Manifest Usage Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-m3u8-manifest-usage-audit.yml'
      - 'requests/s01-m3u8-manifest-usage-audit.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact M3U8 v1.25.3
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: v1.25.3
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Audit metadata consumers without printing private source
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets=['PACKAGE_PROFILE.json','plugin-manifest.json']
          roots=[Path('.')]
          skip_parts={'.git','vendor','node_modules'}
          text_ext={'.php','.js','.mjs','.cjs','.sh','.py','.yml','.yaml','.json','.md','.txt'}
          for target in targets:
              refs=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(part in skip_parts for part in p.parts):
                      continue
                  if p.name==target:
                      continue
                  if p.suffix.lower() not in text_ext:
                      continue
                  try: text=p.read_text(encoding='utf-8',errors='ignore')
                  except Exception: continue
                  if target in text:
                      refs.append(str(p))
              print(f'{target}_REFERENCE_COUNT={len(refs)}')
              for p in refs:
                  print(f'{target}_REFERENCE_FILE={p}')
          # Runtime source must not dynamically glob these metadata names via their key names.
          key_refs=[]
          for p in Path('src').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.php','.js','.mjs','.cjs'}:
                  continue
              if p.name in targets:
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              if 'pluginVersion' in text or 'schemaVersion' in text and ('PACKAGE_PROFILE' in text or 'plugin-manifest' in text):
                  key_refs.append(str(p))
          print('M3U8_METADATA_RUNTIME_KEY_REFERENCE_COUNT='+str(len(key_refs)))
          for p in key_refs:
              print('M3U8_METADATA_RUNTIME_KEY_REFERENCE_FILE='+p)
          PY

      - name: Audit formal package construction semantics
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          needles=['PACKAGE_PROFILE.json','plugin-manifest.json']
          candidates=[]
          for root in ['.github','scripts','docs/authority','docs/operations']:
              r=Path(root)
              if not r.exists(): continue
              for p in r.rglob('*'):
                  if not p.is_file(): continue
                  try: text=p.read_text(encoding='utf-8',errors='ignore')
                  except Exception: continue
                  if any(n in text for n in needles):
                      candidates.append(str(p))
          print('M3U8_PACKAGE_METADATA_BUILD_REFERENCE_COUNT='+str(len(candidates)))
          for p in candidates:
              print('M3U8_PACKAGE_METADATA_BUILD_REFERENCE_FILE='+p)
          # Check whether the metadata files physically exist under src and therefore are eligible for naive whole-src packaging.
          for n in needles:
              p=Path('src')/n
              print(f'M3U8_{n}_UNDER_SRC='+('YES' if p.exists() else 'NO'))
          PY

      - name: Classification gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '$p=json_decode(file_get_contents("src/PACKAGE_PROFILE.json"),true); $m=json_decode(file_get_contents("src/plugin-manifest.json"),true); if(($p["pluginVersion"]??null)!=="1.25.2"||($m["version"]??null)!=="1.25.2") exit(1); echo "M3U8_METADATA_FILES_PARSE=PASS\n";'
          echo 'M3U8_USAGE_AUDIT_EXACT_SOURCE=4db0265c346dbabe91f206af33a16dba77bb2939'
          echo 'M3U8_USAGE_AUDIT_WRITE=0'
