name: S01 Theme 1.35.25 Update Center Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout runner branch
        uses: actions/checkout@v4

      - name: Resolve governed Theme read credential
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          choose=''
          for candidate_name in VF_PRIVATE_READ_TOKEN VF_RELEASE_WRITE_TOKEN; do
            candidate="${!candidate_name:-}"
            [ -n "$candidate" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $candidate" https://api.github.com/repos/llhzx2018/vf-tools-theme || true)"
            if [ "$code" = "200" ]; then
              choose="$candidate_name"
              break
            fi
          done
          [ -n "$choose" ] || { echo 'No governed token can read Theme repo' >&2; exit 1; }
          echo "token_name=$choose" >> "$GITHUB_OUTPUT"
          echo "PASS governed credential available: $choose"

      - name: Checkout exact Theme candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.auth.outputs.token_name }}" = "VF_PRIVATE_READ_TOKEN" ]; then TOKEN="$VF_PRIVATE_READ_TOKEN"; else TOKEN="$VF_RELEASE_WRITE_TOKEN"; fi
          rm -rf theme
          mkdir theme
          cd theme
          git init -q
          git remote add origin https://github.com/llhzx2018/vf-tools-theme.git
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/work/s01-update-center-fresh-receipts-13525-20260916:refs/remotes/origin/candidate
          git checkout --detach refs/remotes/origin/candidate
          test "$(git rev-parse HEAD)" = "5b1429739c932c1bce2855cec301e96b851fe781"
          test "$(git rev-parse refs/remotes/origin/main)" = "a9ae5ca465f6ac07e8a9afd0a228c0cbe46f0b2a"
          echo "PASS exact private Theme refs fetched"

      - name: Exact source identity and four-file fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          actual="$(git diff --name-only refs/remotes/origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            VERSION \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            src/style.css \
            tests/update-refresh-policy-contract.php | sort)"
          test "$actual" = "$expected"
          echo "PASS exact SHA + four-file scope"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l theme/src/inc/update/class-vf-wp-update-admin-v1.php
          php -l theme/tests/update-refresh-policy-contract.php
          echo "PASS PHP syntax"

      - name: Update refresh policy contract
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          php tests/update-refresh-policy-contract.php

      - name: Version and round identity
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          test "$(cat VERSION)" = "1.35.25"
          grep -Fq 'Version: 1.35.25' src/style.css
          grep -Fq 'V1.35.25_S01_UPDATE_CENTER_FRESH_RECEIPTS' src/style.css
          echo "PASS version identity"

      - name: Receipt safety and ownership fence
        shell: bash
        run: |
          set -euo pipefail
          cd theme
          f=src/inc/update/class-vf-wp-update-admin-v1.php
          grep -Fq "vf_wp_update_refresh_receipts_v1" "$f"
          grep -Fq 'private const RECEIPT_TTL = 600;' "$f"
          grep -Fq 'catch (Throwable $e)' "$f"
          grep -Fq '$this->components(false)' "$f"
          grep -Fq 'VF_Theme_Update_Client_V1::status();' "$f"
          ! grep -Fq "'token' =>" "$f"
          ! grep -Fq "'authorization' =>" "$f"
          echo "PASS safe fresh-receipt overlay; no credential payload persisted"
