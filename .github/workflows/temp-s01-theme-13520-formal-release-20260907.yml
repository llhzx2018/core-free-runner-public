name: S01 Theme 1.35.20 Formal Release
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-theme-13520-formal-release-20260907.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
      BASE_SHA: 6c30935c613802847d138097c63c3f73219ec02a
    steps:
      - name: Exact Theme main and release preflight
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          test "$(gh api repos/llhzx2018/vf-tools-theme/branches/main --jq '.commit.sha')" = "$SHA"
          if gh api repos/llhzx2018/vf-tools-theme/git/ref/tags/v1.35.20 >/dev/null 2>&1; then echo 'TAG_ALREADY_EXISTS'; exit 1; fi
          if gh api repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.20 >/dev/null 2>&1; then echo 'RELEASE_ALREADY_EXISTS'; exit 1; fi
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          git -C repo checkout -q "$SHA"
          test "$(git -C repo rev-parse HEAD)" = "$SHA"
          test "$(cat repo/VERSION)" = '1.35.20'
          grep -F 'Version: 1.35.20' repo/src/style.css >/dev/null
          grep -F 'V1.35.20_S01_UPDATE_CENTER_ID_CLOSURE' repo/src/style.css >/dev/null
          ! grep -F '<span class="vf-update-component__id">' repo/src/inc/update/class-vf-wp-update-admin-v1.php
          grep -F 'id="component-<?php echo esc_attr($view['"'"'id'"'"']); ?>"' repo/src/inc/update/class-vf-wp-update-admin-v1.php >/dev/null
          find repo/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php repo/tests/update-center-human-language-contract.php
          php repo/tests/update-refresh-policy-contract.php
          php repo/tests/visible-console-v2-contract.php
          php repo/tests/workbench-primary-action-contract.php
          php repo/tests/final-admin-human-closure-contract.php
          php repo/tests/deep-admin-human-language-contract.php
          git -C repo diff --name-only "$BASE_SHA" "$SHA" | sort >/tmp/actual
          printf '%s\n' \
            VERSION \
            src/assets/css/admin/admin-update-center.css \
            src/inc/update/class-vf-wp-update-admin-v1.php \
            src/style.css \
            tests/update-center-human-language-contract.php \
            tests/update-refresh-policy-contract.php \
            tests/visible-console-v2-contract.php \
            tests/workbench-primary-action-contract.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/actual
          echo 'PASS_S01_C01_13520_FORMAL_PREFLIGHT'

  release-c01:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: 1447c67febf1d3d456ca0e51d2c7c78063f79ae7
      TAG: v1.35.20
      ASSET: vf-tools-theme_V1.35.20.zip
    steps:
      - name: Deterministic Theme build and publish
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          git -C repo checkout -q "$SHA"
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,os,zipfile
          src=Path('repo/src')
          rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
          assert len(rows)>=440
          def build(path):
            dirs={'vf-tools-theme/'}
            for rel,_ in rows:
              cur='vf-tools-theme'
              for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
            with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):
                zi=zipfile.ZipInfo(d);zi.date_time=(1980,1,1,0,0,0);zi.external_attr=(0o40755<<16)|0x10;z.writestr(zi,b'')
              for rel,b in rows:
                zi=zipfile.ZipInfo('vf-tools-theme/'+rel);zi.date_time=(1980,1,1,0,0,0);zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
            data=Path(path).read_bytes(); return len(rows),len(data),hashlib.sha256(data).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'a'/os.environ['ASSET'])
          b=build(Path(os.environ['RUNNER_TEMP'])/'b'/os.environ['ASSET'])
          assert a==b
          print(f'FILES={a[0]}');print(f'BYTES={a[1]}');print(f'SHA256={a[2]}')
          PY
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV"
          set -a; source "$RUNNER_TEMP/metrics.env"; set +a
          cmp "$RUNNER_TEMP/a/$ASSET" "$RUNNER_TEMP/b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          p=os.environ['RUNNER_TEMP']+'/a/'+os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            d=z.read('vf-tools-theme/style.css')
            assert b'Version: 1.35.20' in d
            assert b'V1.35.20_S01_UPDATE_CENTER_ID_CLOSURE' in d
            admin=z.read('vf-tools-theme/inc/update/class-vf-wp-update-admin-v1.php')
            assert b'vf-update-component__id' not in admin
            assert b'id="component-<?php echo esc_attr($view[' in admin
          PY
          repo='llhzx2018/vf-tools-theme'; created_tag=0; created_release=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then if [ "$created_release" -eq 1 ]; then gh release delete "$TAG" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1||true; fi; if [ "$created_tag" -eq 1 ]; then gh api --method DELETE "repos/$repo/git/refs/tags/$TAG" >/dev/null 2>&1||true; fi; fi; exit "$rc"; }; trap cleanup EXIT
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$SHA"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null; created_tag=1
          test "$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          printf 'S01-C01 Unified Update Center Internal-ID Closure. Exact main source: %s\nCandidate Gate: 34191846183 PASS\nIdentity Inventory: 34191939034 PASS\nBump Gate: 34191979590 PASS\nDefault-visible component IDs removed; internal anchors and registry IDs preserved.\nProduction: NOT_RUN\nStatic: NOT_RUN\nOnline: NOT_RUN\n' "$SHA" > "$RUNNER_TEMP/notes"
          gh release create "$TAG" "$RUNNER_TEMP/a/$ASSET" --repo "$repo" --title 'VF Tools Theme V1.35.20' --notes-file "$RUNNER_TEMP/notes" --draft --verify-tag; created_release=1
          mkdir "$RUNNER_TEMP/r"
          gh release download "$TAG" --repo "$repo" --pattern "$ASSET" --dir "$RUNNER_TEMP/r"
          test "$(stat -c %s "$RUNNER_TEMP/r/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/r/$ASSET"|awk '{print $1}')" = "$SHA256"
          gh release edit "$TAG" --repo "$repo" --draft=false
          gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/final.json"
          test "$(jq -r '.draft' "$RUNNER_TEMP/final.json")" = false
          test "$(jq -r '.prerelease' "$RUNNER_TEMP/final.json")" = false
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.size' "$RUNNER_TEMP/final.json")" = "$BYTES"
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/final.json")" = "sha256:$SHA256"
          trap - EXIT
          echo "TAG_TARGET=$(gh api "repos/$repo/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final.json")"
          echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/final.json")"
          echo "REMOTE_BYTES=$BYTES"
          echo "ASSET_SHA256=$SHA256"
          echo "RUNTIME_ZIP_FILES=$FILES"
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
          echo 'C01_13520_FORMAL_RELEASE=PASS'
