name: TEMP S01-C02 1.21.925 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 872f0a09e872b971b76be3912269117f17c554ab
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.925
      ASSET: vf-tools-ops_V1.21.925.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 872f0a09e872b971b76be3912269117f17c554ab
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact distribution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.925"
          assert m["release_tag"]=="v1.21.925"
          assert m["asset_name"]=="vf-tools-ops_V1.21.925.zip"
          assert m["asset_bytes"]==3498585
          assert m["asset_sha256"]=="92f752991051dbea19d3671f48fc97cf261de95bc4e3379b725ae11f7c5cfd0b"
          assert m["runtime_files"]==977
          assert m["runtime_fingerprint"]=="14f13c2df80b34545d0d025e22b6f02fe6f2579683f9a74e17d2cb370bd32b4b"
          assert "1.21.924" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.925 manifest identity PASS")
          PY

      - name: Manifest contract audit
        shell: bash
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Formal release remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "cb5fb4c97bc5b3bab7cff40e0fb4dd5fec597fe0"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3498585"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:92f752991051dbea19d3671f48fc97cf261de95bc4e3379b725ae11f7c5cfd0b"
          echo "S01-C02 1.21.925 Distribution exact-source proof PASS"

      - name: Remove transient checkout
        if: always()
        shell: bash
        run: rm -rf updates
