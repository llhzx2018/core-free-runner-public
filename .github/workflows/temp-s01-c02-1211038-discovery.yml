name: S01-C02 1.21.1038 Distribution Discovery
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_discovery_1038
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_VERSION: 1.21.1038
      PREVIOUS_VERSION: 1.21.1037
      TARGET_TAG: v1.21.1038
      TARGET_ASSET: vf-tools-ops_V1.21.1038.zip
      TARGET_BYTES: 3509741
      TARGET_SHA256: 74906b3947625d685187ab632d254b067729965a7ad026e97342c2db3173623f
      TARGET_RUNTIME_FP: f6372ec2361143faac1bd7baa21c70f14ef69ee66245903917573143284de3d5
      PREVIOUS_TAG: v1.21.1037
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1037.zip

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Live distribution and release readback
        env:
          GH_TOKEN: ${{ env.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          mkdir -p evidence
          gh api repos/llhzx2018/core-updates/contents/projects/S01-C02.json?ref=main             -H 'Accept: application/vnd.github.raw+json' > evidence/manifest.json
          jq -e --arg ver "$TARGET_VERSION" --arg tag "$TARGET_TAG" --arg asset "$TARGET_ASSET"             --arg sha "$TARGET_SHA256" --arg fp "$TARGET_RUNTIME_FP" --arg prev "$PREVIOUS_VERSION"             '.target_version==$ver
             and .release_tag==$tag
             and .asset_name==$asset
             and .asset_bytes==3509741
             and .asset_sha256==$sha
             and .runtime_fingerprint==$fp
             and (.from_versions|index($prev))!=null
             and .schema_from=="6.0.0"
             and .schema_to=="6.0.0"
             and .rollback_supported==true
             and .backup_required==true' evidence/manifest.json >/dev/null

          R="$(gh api repos/$TARGET_REPOSITORY/releases/tags/$TARGET_TAG)"
          test "$(jq -r '.target_commitish' <<<"$R")" = "5b077b506470869fbe4fe7574d2c071511422d36"
          test "$(jq -r --arg n "$TARGET_ASSET" '.assets[]|select(.name==$n)|.size' <<<"$R")" = "$TARGET_BYTES"
          test "$(jq -r --arg n "$TARGET_ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$R")" = "sha256:$TARGET_SHA256"
          echo LIVE_MANIFEST_RELEASE_READBACK=PASS

      - name: Download previous formal package
        env:
          GH_TOKEN: ${{ env.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p package
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir package --clobber
          unzip -tq "package/$PREVIOUS_ASSET" >/dev/null

      - name: Install temporary WordPress on 1.21.1037
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/discovery-1038"
          WP="$TASK_ROOT/wordpress"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_discovery_1038 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18138 --title='Distribution Discovery 1038' --admin_user=admin --admin_password='Fixture-Discovery-1038!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          wp plugin install "$GITHUB_WORKSPACE/package/$PREVIOUS_ASSET" --activate >/dev/null
          wp option update vf_ops_distribution_discovery_sentinel preserve-1038 >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1037")throw new RuntimeException("BASE_VERSION");do_action("admin_init");$a=VF_Ops_Runtime_Authority_V1::stored();if(($a["version"]??"")!=="1.21.1037")throw new RuntimeException("BASE_AUTHORITY");echo "BASELINE_RUNTIME_AUTHORITY=PASS\n";'

      - name: Prove WordPress backend discovers exact 1.21.1038
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/discovery-1038"
          WP="$TASK_ROOT/wordpress"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }

          wp eval '
            $r=vf_ops_wp_update_manual_check_v1();
            if(empty($r["ok"])||($r["status"]??"")!=="UPDATE_AVAILABLE")throw new RuntimeException("MANUAL_DISCOVERY_".wp_json_encode($r));
            $m=(array)$r["manifest"];$rel=(array)$r["release"];
            if(($m["target_version"]??"")!=="1.21.1038")throw new RuntimeException("TARGET_VERSION");
            if(($m["asset_sha256"]??"")!=="74906b3947625d685187ab632d254b067729965a7ad026e97342c2db3173623f")throw new RuntimeException("TARGET_SHA");
            if(($m["runtime_fingerprint"]??"")!=="f6372ec2361143faac1bd7baa21c70f14ef69ee66245903917573143284de3d5")throw new RuntimeException("TARGET_FP");
            if(($m["release_tag"]??"")!=="v1.21.1038")throw new RuntimeException("TARGET_TAG");
            if(empty($rel["asset_api_url"]))throw new RuntimeException("ASSET_API_URL");
            echo "MANUAL_DISCOVERY=PASS\n";
          '

          wp eval '
            require_once ABSPATH."wp-admin/includes/update.php";
            delete_site_transient("update_plugins");
            VF_Ops_Update_Client_V1::clear_cache();
            wp_update_plugins();
            $u=get_site_transient("update_plugins");
            $x=is_object($u)&&isset($u->response["vf-ops/vf-ops.php"])?$u->response["vf-ops/vf-ops.php"]:null;
            if(!$x)throw new RuntimeException("NATIVE_TRANSIENT_MISSING");
            if((string)$x->new_version!=="1.21.1038")throw new RuntimeException("NATIVE_TRANSIENT_VERSION");
            if(empty($x->package))throw new RuntimeException("NATIVE_TRANSIENT_PACKAGE");
            echo "WORDPRESS_NATIVE_UPDATE_OFFER=PASS\n";
          '

      - name: Execute native updater in temporary WordPress
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/discovery-1038"
          WP="$TASK_ROOT/wordpress"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }

          wp eval '
            $r=vf_ops_wp_update_execute_v1();
            if(empty($r["ok"])||($r["status"]??"")!=="PLUGIN_UPGRADER_COMPLETED")throw new RuntimeException("NATIVE_UPDATE_".wp_json_encode($r));
            if(($r["final"]["final_result"]??"")!=="SUCCESS")throw new RuntimeException("NATIVE_FINAL_RESULT");
            echo "NATIVE_UPDATE_EXECUTION=PASS\n";
          '

          wp eval '
            require_once ABSPATH."wp-admin/includes/plugin.php";
            $d=get_plugin_data(WP_PLUGIN_DIR."/vf-ops/vf-ops.php",false,false);
            if(($d["Version"]??"")!=="1.21.1038")throw new RuntimeException("POST_VERSION");
            if(VF_OPS_VERSION!=="1.21.1038")throw new RuntimeException("BOOT_VERSION");
            if(get_option("vf_ops_distribution_discovery_sentinel")!=="preserve-1038")throw new RuntimeException("STATE_PRESERVATION");
            if(!is_plugin_active("vf-ops/vf-ops.php"))throw new RuntimeException("ACTIVATION");
            $a=VF_Ops_Runtime_Authority_V1::stored();
            if(($a["version"]??"")!=="1.21.1038")throw new RuntimeException("TARGET_AUTHORITY");
            if(($a["fingerprint_sha256"]??"")!=="f6372ec2361143faac1bd7baa21c70f14ef69ee66245903917573143284de3d5")throw new RuntimeException("TARGET_AUTHORITY_FP");
            $r=vf_ops_wp_update_manual_check_v1();
            if(empty($r["ok"])||($r["status"]??"")!=="UP_TO_DATE")throw new RuntimeException("POST_DISCOVERY_".wp_json_encode($r));
            echo "POST_UPDATE_READBACK=PASS\n";
          '

      - name: Emit public-safe proof
        if: always()
        run: |
          set -Eeuo pipefail
          cat > evidence/FINAL_DISCOVERY.json <<'JSON'
          {
            "schema": "vf-s01-c02-distribution-discovery/v1",
            "component": "S01-C02",
            "from_version": "1.21.1037",
            "target_version": "1.21.1038",
            "distribution_main": "861a097dcf2fa7818ad91fcef395b5e33fd08a01",
            "formal_release_id": 403559722,
            "formal_asset_id": 612121317,
            "manifest_release_readback": "PASS",
            "manual_update_discovery": "PASS",
            "wordpress_native_offer": "PASS",
            "temporary_native_update": "PASS",
            "post_update_readback": "PASS",
            "state_preservation": "PASS",
            "production": "NOT_TOUCHED",
            "owner_product_pass": false,
            "status": "PASS"
          }
          JSON
          cat evidence/FINAL_DISCOVERY.json

      - name: Upload public-safe discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211038-distribution-discovery
          path: |
            evidence/manifest.json
            evidence/FINAL_DISCOVERY.json
          if-no-files-found: warn
          retention-days: 30
