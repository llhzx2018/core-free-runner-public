name: TEMP P01 YouTube and owner Git true-action E2E
on:
  push:
    branches:
      - verify/p01-channels-projects-true-action-20261027
permissions:
  contents: read
jobs:
  p01-channels-projects-real-action:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private P01 exact source into transient runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: llhzx2018/vf-start
          ref: 6d1f05612037c98c7cafc01e7b0595f35ea3c437
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare isolated copy, no artifacts retained
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 6d1f05612037c98c7cafc01e7b0595f35ea3c437
          test "$(cat VERSION)" = 2.47.465
          test "$(cat src/VERSION.txt)" = 2.47.465
          php -m | grep -qi pdo_sqlite
          node tests/unit/p01_music_native_form_action_url_contract.cjs
          node tests/browser/local_management_inbox_popover_contract.cjs
          node tests/browser/local_management_bulk_search_scope_contract.cjs
          command -v google-chrome
          npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/p01-browser" playwright-core@1.56.1
          mkdir -p "$RUNNER_TEMP/p01-native"
          cp -a src "$RUNNER_TEMP/p01-native/site"
          echo P01_NATIVE_EXACT_SOURCE_AND_ENV_PASS
      - name: Fresh FULL install, YouTube manual fetch and approved Git owner sync in Chromium
        shell: bash
        env:
          P01_TEST_BASE: http://127.0.0.1:18465
        run: |
          set -Eeuo pipefail
          work="$RUNNER_TEMP/p01-native"
          export P01_TEST_COOKIE="$work/cookies.txt"
          export NODE_PATH="$RUNNER_TEMP/p01-browser/node_modules"
          export CHROME_BIN="$(command -v google-chrome)"
          php -S 127.0.0.1:18465 -t "$work/site" > "$work/php.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS -c "$P01_TEST_COOKIE" -b "$P01_TEST_COOKIE" "$P01_TEST_BASE/setup.php" -o "$work/setup.html" 2>/dev/null; then break; fi
            sleep 0.2
          done
          test -s "$work/setup.html"
          csrf="$(sed -nE 's/.*name="setup_csrf" value="([^"]+)".*/\1/p' "$work/setup.html" | head -n 1)"
          test -n "$csrf"
          onepass="Isolated-$(openssl rand -hex 12)"
          curl -fsS -L -c "$P01_TEST_COOKIE" -b "$P01_TEST_COOKIE" \
            --data-urlencode "setup_csrf=$csrf" --data-urlencode 'site_title=P01 Isolated Native Modal' \
            --data-urlencode "admin_password=$onepass" \
            --data-urlencode "admin_password_confirm=$onepass" \
            "$P01_TEST_BASE/setup.php" -o "$work/installed.html"
          test -f "$work/site/app/.runtime.php"
          jq -nc --arg password "$onepass" '{password:$password}' | curl -fsS \
            -c "$P01_TEST_COOKIE" -b "$P01_TEST_COOKIE" \
            -H 'Content-Type: application/json' -d @- "$P01_TEST_BASE/api.php?action=login" -o "$work/login.json"
          export P01_TEST_CSRF="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["ok"] is True; print(d["csrf"])' "$work/login.json")"
          curl -fsS -c "$P01_TEST_COOKIE" -b "$P01_TEST_COOKIE" \
            --data-urlencode "csrf=$P01_TEST_CSRF" \
            --data-urlencode 'surface=channels' \
            --data-urlencode 'title=Isolated Synthetic YouTube Channel' \
            --data-urlencode 'url=https://www.youtube.com/channel/UC0000000000000000000000' \
            --data-urlencode 'resource_kind=视频频道' \
            --data-urlencode 'is_private=1' \
            "$P01_TEST_BASE/workspace-create.php" -o "$work/channel.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("ok") is True,d; print("P01_SYNTHETIC_CHANNEL_FIXTURE_PASS")' "$work/channel.json"
          negative_code="$(curl -sS -o "$work/denied.txt" -w '%{http_code}' \
            -c "$P01_TEST_COOKIE" -b "$P01_TEST_COOKIE" \
            --data-urlencode "csrf=$P01_TEST_CSRF" \
            "$P01_TEST_BASE/projects-github-sync.php")"
          test "$negative_code" = 404
          echo P01_GIT_NON_OWNER_HOST_SECURITY_DENIAL_PASS
          node <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const base=process.env.P01_TEST_BASE;
          // Browser DNS maps to the SAME loopback PHP test server. It never connects
          // to the real start.kewaro.com or mutates Production.
          const ownerBase='http://start.kewaro.com:18465';
          const timeout=40000;
          const cookies=[];
          for(let row of fs.readFileSync(process.env.P01_TEST_COOKIE,'utf8').split(/\r?\n/)){
            row=row.trim();
            if(row.startsWith('#HttpOnly_'))row=row.replace('#HttpOnly_','');
            else if(!row||row.startsWith('#'))continue;
            const bits=row.split('\t');
            if(bits.length>=7)for(const url of [base,ownerBase]){
              cookies.push({name:bits[5],value:bits[6],url});
            }
          }
          assert(cookies.length>=2,'Authenticated cookies for both loopback test origins');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:process.env.CHROME_BIN,headless:true,
              args:['--no-sandbox','--disable-dev-shm-usage','--no-proxy-server',
              '--host-resolver-rules=MAP start.kewaro.com 127.0.0.1']
            });
            try{
              const context=await browser.newContext({viewport:{width:1440,height:900},locale:'zh-CN'});
              await context.addCookies(cookies);
              await context.route('**/*',route=>{
                const u=new URL(route.request().url());
                if(![base,ownerBase].includes(u.origin))return route.abort('blockedbyclient');
                return route.continue();
              });
              const page=await context.newPage();
              let backendRedirect=false;
              let channelPosts=0;
              page.on('framenavigated',frame=>{
                if(frame===page.mainFrame()&&/\/(?:admin|manager|projects-source-manager)\.php/.test(frame.url()))backendRedirect=true;
              });
              page.on('request',request=>{
                if(request.url().endsWith('/youtube-channel-updates.php'))channelPosts++;
              });
              async function enter(origin,route) {
                const response=await page.goto(origin+'/'+route,{waitUntil:'domcontentloaded',timeout});
                assert.equal(response.status(),200,route+' HTTP 200');
                assert.equal(new URL(page.url()).pathname,'/'+route,'must stay frontend');
                const trigger=page.locator('[data-vf-local-manage-open]');
                await trigger.waitFor({state:'visible',timeout});
                await trigger.click();
                const modal=page.locator('dialog[data-vf-local-management]');
                await modal.waitFor({state:'visible',timeout});
                assert.equal(await modal.evaluate(el=>el.open),true,'Native dialog open');
                assert.equal(await modal.locator('iframe').count(),0,'No iframe in native dialog');
                return modal;
              }

              const channel=await enter(base,'channels.php');
              const task=channel.locator('[data-vf-local-task="channel"]');
              assert.equal(await task.count(),1,'Channels task exists');
              await task.click();
              const action=channel.locator('[data-vf-local-channel-check]');
              assert.equal(await action.isEnabled(),true,'Stored YouTube fixture enables manual check');
              assert.equal(await page.locator('[data-youtube-check-page]').count(),1,'Canonical action exists');
              assert.equal(channelPosts,0,'No automatic YouTube POST on initial render');
              await action.click();
              assert.equal(await channel.evaluate(el=>el.open),true,'Channel dialog stays open while request runs');
              assert.equal(new URL(page.url()).pathname,'/channels.php','YouTube check stays frontstage');
              await page.waitForFunction(()=>{
                const el=document.querySelector('[data-vf-local-channel-status]');
                return el&&!el.hidden&&(/本次检查结束|提前停止|已按要求停止/.test(el.textContent||''));
              },null,{timeout});
              assert.equal(channelPosts,1,'Exactly one owner-click HTTP POST for one saved channel');
              const checkStatus=await channel.locator('[data-vf-local-channel-status]').innerText();
              assert.equal(await channel.locator('[data-vf-local-channel-status]').isVisible(),true,'Progress inside management dialog');
              assert.equal(await channel.locator('[data-vf-local-channel-stop]').isVisible(),false,'Stop hidden after request settled');
              assert.equal(await channel.evaluate(el=>el.open),true,'Native channel dialog remains open after status');
              console.log('P01_NATIVE_CHANNEL_TRUE_ACTION_STATUS',checkStatus.slice(0,280));
              await action.click();
              await page.waitForFunction(()=>/冷却期/.test(document.querySelector('[data-vf-local-channel-status]')?.textContent||''),null,{timeout:12000});
              assert.equal(channelPosts,1,'Cooldown blocks second upstream POST');
              console.log('P01_CHANNEL_REAL_MANUAL_REQUEST_COOLDOWN_IN_MODAL_PASS');

              const normalProjects=await enter(base,'projects.php');
              await normalProjects.locator('[data-vf-local-task="project"]').click();
              assert.equal(await normalProjects.locator('[data-vf-local-project-sync]').isEnabled(),false,'Non-owner host stays disabled');
              assert.equal(await page.locator('[data-project-git-review-open]').count(),0,'Non-owner owner-only source never visible');
              console.log('P01_PROJECT_NON_OWNER_FRONTEND_DISABLED_PASS');

              const ownerProjects=await enter(ownerBase,'projects.php');
              await ownerProjects.locator('[data-vf-local-task="project"]').click();
              const syncAction=ownerProjects.locator('[data-vf-local-project-sync]');
              assert.equal(await syncAction.isEnabled(),true,'Owner host enables Git source');
              await syncAction.click();
              const review=page.locator('#vfProjectGitSourceDialog');
              await review.waitFor({state:'visible',timeout});
              assert.equal(await review.evaluate(el=>el.open),true,'Native approved Git source dialog open');
              assert.equal(new URL(page.url()).pathname,'/projects.php','Git review remains on current page');
              assert.equal(await review.locator('.vf-project-git-dialog-list li').count(),24,'24 approved sources reviewed');
              assert.equal(await review.locator('iframe').count(),0,'No iframe in Git source dialog');
              assert.equal(await review.locator('[data-project-git-sync-submit]').isEnabled(),true,'Missing sources actionable');
              let confirmSeen=false;
              page.once('dialog',async dlg=>{
                assert.equal(dlg.type(),'confirm','Explicit confirmation required');
                confirmSeen=true;
                await dlg.accept();
              });
              await review.locator('[data-project-git-sync-submit]').click();
              await page.waitForLoadState('domcontentloaded',{timeout});
              await page.waitForFunction(()=>Boolean(document.querySelector('#vfProjectGitSourceDialog[open] .vf-project-git-dialog-feedback')),{timeout});
              assert(confirmSeen,'Sync prompts before write');
              const feedback=await page.locator('#vfProjectGitSourceDialog .vf-project-git-dialog-feedback').innerText();
              assert(/本次完成：新增/.test(feedback),'Git sync success feedback: '+feedback);
              assert.equal(await page.locator('[data-project-git-sync-submit]').isEnabled(),false,'Clean owner sync is idempotent');
              assert.equal(new URL(page.url()).pathname,'/projects.php','Git sync returns same frontend route');
              assert.equal(new URL(page.url()).searchParams.has('github_sync'),false,'One-time query sanitized');
              console.log('P01_PROJECT_OWNER_SYNC_FEEDBACK',feedback);
              console.log('P01_PROJECT_GIT_APPROVED_SOURCE_SYNC_NATIVE_DIALOG_PASS');

              await page.reload({waitUntil:'domcontentloaded',timeout});
              assert.equal(await page.locator('#vfProjectGitSourceDialog').evaluate(el=>el.open),false,'Refresh never unexpectedly opens sync dialog');
              const opener=page.locator('[data-vf-local-manage-open]');
              await opener.click();
              const native=page.locator('dialog[data-vf-local-management]');
              await native.locator('[data-vf-local-task="project"]').click();
              assert.equal(await native.locator('[data-vf-local-project-sync]').isEnabled(),true,'Git review remains reachable after sync');
              await native.locator('[data-vf-local-project-sync]').click();
              await page.locator('#vfProjectGitSourceDialog').waitFor({state:'visible',timeout});
              assert.equal(await page.locator('.vf-project-git-dialog-counts').innerText().then(t=>t.includes('24')),true,'All 24 source identities linked');
              assert.equal(await page.locator('[data-project-git-sync-submit]').isEnabled(),false,'No duplicate sync write option');
              assert.equal(backendRedirect,false,'No hidden backend redirects');
              console.log('P01_PROJECT_OWNER_IDEMPOTENT_PERSISTENCE_FRONTSTAGE_PASS');
              console.log('P01_CHANNEL_AND_PROJECT_TRUE_ACTION_E2E_PASS');
            }finally{await browser.close();}
          })().catch(err=>{console.error('P01_CHANNEL_PROJECT_TRUE_ACTION_E2E_FAIL',String(err?.stack||err));process.exitCode=1;});
          JS
