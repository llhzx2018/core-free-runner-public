name: S01 M3U8 Effective Identity Semantics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-m3u8-identity-semantics.yml'
      - 'requests/s01-m3u8-identity-semantics.txt'

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-24.04
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact M3U8 v1.25.3
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: v1.25.3
          token: ${{ env.PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: source

      - name: Effective manifest identity gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/m3u8-effective-identity.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__);
          define('VF_TOOL_M3U8_VERSION', '1.25.3');
          define('VF_TOOL_M3U8_ROUND', 'R227');
          function vf_tool_m3u8_module_dir(): string { return getcwd().'/src/'; }
          require getcwd().'/src/includes/manifest.php';
          $raw=json_decode((string)file_get_contents(getcwd().'/src/plugin-manifest.json'),true);
          $effective=vf_tool_m3u8_manifest();
          if(($raw['version']??null)!=='1.25.2') { fwrite(STDERR,"RAW_EXPECTATION_CHANGED\n"); exit(2); }
          if(($effective['version']??null)!=='1.25.3') { fwrite(STDERR,"EFFECTIVE_VERSION_FAIL\n"); exit(3); }
          if(($effective['pluginVersion']??null)!=='1.25.3') { fwrite(STDERR,"EFFECTIVE_PLUGIN_VERSION_FAIL\n"); exit(4); }
          if(($effective['round']??null)!=='R227') { fwrite(STDERR,"EFFECTIVE_ROUND_FAIL\n"); exit(5); }
          echo "M3U8_RAW_MANIFEST_VERSION=1.25.2\n";
          echo "M3U8_EFFECTIVE_RUNTIME_MANIFEST_VERSION=1.25.3\n";
          echo "M3U8_EFFECTIVE_RUNTIME_PLUGIN_VERSION=1.25.3\n";
          echo "M3U8_EFFECTIVE_RUNTIME_ROUND=R227\n";
          echo "M3U8_RUNTIME_IDENTITY_OVERRIDE=PASS\n";
          PHP
          php /tmp/m3u8-effective-identity.php

      - name: Runtime authority path classification
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/m3u8-runtime-paths.php <<'PHP'
          <?php
          define('ABSPATH', __DIR__);
          require getcwd().'/src/includes/update/class-vf-m3u8-update-contract-v1.php';
          require getcwd().'/src/includes/update/class-vf-m3u8-runtime-authority-v1.php';
          $a=VF_M3U8_Runtime_Authority_V1::is_runtime_path('plugin-manifest.json');
          $b=VF_M3U8_Runtime_Authority_V1::is_runtime_path('PACKAGE_PROFILE.json');
          if($a!==true || $b!==false){fwrite(STDERR,"RUNTIME_PATH_CLASSIFICATION_FAIL\n");exit(2);}
          echo "M3U8_PLUGIN_MANIFEST_RUNTIME_PATH=YES\n";
          echo "M3U8_PACKAGE_PROFILE_RUNTIME_PATH=NO\n";
          echo "M3U8_RUNTIME_PATH_CLASSIFICATION=PASS\n";
          PHP
          php /tmp/m3u8-runtime-paths.php

      - name: Source identity owner assertion
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = '1.25.3'
          grep -Fq '* Version: 1.25.3' src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.3" src/vf-tool-m3u8.php
          grep -Fq 'Runtime identity is owned by the executable plugin header/constant' src/includes/manifest.php
          echo 'M3U8_CANONICAL_EXECUTABLE_IDENTITY=1.25.3'
          echo 'M3U8_IDENTITY_SEMANTICS_GATE=PASS'
