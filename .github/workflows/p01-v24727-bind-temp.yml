name: p01-v24727-bind-temp

on:
  push:
    branches:
      - run/p01-v24727-bind

permissions:
  contents: read

jobs:
  bind-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 035fd9234a8f1b75d28ce22d54a7048d1f66fab3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - name: Checkout engineering base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 007c07835a03f3e588a9d702686876774f8b4562
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: base
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact bind scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "035fd9234a8f1b75d28ce22d54a7048d1f66fab3"
          test "$(git -C base rev-parse HEAD)" = "007c07835a03f3e588a9d702686876774f8b4562"
          test "$(cat target/VERSION)" = "2.47.27"
          test "$(cat target/src/VERSION.txt)" = "2.47.27"
          grep -Fq "define('VF_VERSION', '2.47.27');" target/src/app/bootstrap.php
          test "$(cat base/VERSION)" = "2.47.26"
          test -f target/docs/release/V2.47.27_RELEASE_GATE.md
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_V24727_BIND_SCOPE_SYNTAX=PASS

      - name: Focused navigation contracts
        shell: bash
        run: |
          set -euo pipefail
          cd target
          php tests/unit/admin_visual_system_r4_contract.php
          php tests/unit/admin_rail_action_only_contract.php
          php tests/unit/atomic_runtime_cache_contract.php
          php tests/unit/update_recovery_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/advanced_manager_daily_entry_contract.php
          php tests/unit/admin_overview_ia_contract.php
          php tests/unit/data_recovery_desktop_disclosure_contract.php
          php tests/unit/admin_visual_system_r3_contract.php
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = N_A' docs/release/V2.47.27_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' docs/release/V2.47.27_RELEASE_GATE.md
          echo P01_V24727_BIND_FOCUSED_CONTRACTS=PASS

      - name: Fresh install baseline and authenticated smoke
        shell: bash
        run: |
          set -euo pipefail
          TEST_PASSWORD=$(python3 -c "import secrets; print('Aa1!'+secrets.token_urlsafe(24))")
          echo "::add-mask::$TEST_PASSWORD"
          rm -rf /tmp/p01-v24727-runtime
          cp -a target/src /tmp/p01-v24727-runtime
          cd /tmp/p01-v24727-runtime
          php -S 127.0.0.1:18103 -t . >/tmp/p01-v24727-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -rf /tmp/p01-v24727-runtime /tmp/p01-v24727-*' EXIT
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-v24727.cookies -b /tmp/p01-v24727.cookies http://127.0.0.1:18103/setup.php -o /tmp/p01-v24727-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24727-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v24727.cookies -b /tmp/p01-v24727.cookies -X POST http://127.0.0.1:18103/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=VF V24727 Bind'             --data-urlencode "admin_password=$TEST_PASSWORD"             --data-urlencode "admin_password_confirm=$TEST_PASSWORD"             -o /tmp/p01-v24727-setup-post.html
          php cli/verify.php | tee /tmp/p01-v24727-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24727-verify.txt
          php cli/baseline-verify.php | tee /tmp/p01-v24727-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v24727-baseline.txt
          grep -Fx 'BASELINE_FULL_PASS=YES' /tmp/p01-v24727-baseline.txt

          python3 - <<PY >/tmp/p01-v24727-login.json
          import json
          print(json.dumps({"password": """$TEST_PASSWORD"""}))
          PY
          curl -fsS -c /tmp/p01-v24727.cookies -b /tmp/p01-v24727.cookies -H 'Content-Type: application/json'             -X POST 'http://127.0.0.1:18103/api.php?action=login' --data-binary @/tmp/p01-v24727-login.json             -o /tmp/p01-v24727-login-result.json
          grep -F '"ok":true' /tmp/p01-v24727-login-result.json >/dev/null

          for page in manage.php surface-manager.php transfer.php system-health.php update.php settings.php; do
            curl -fsS -c /tmp/p01-v24727.cookies -b /tmp/p01-v24727.cookies "http://127.0.0.1:18103/$page" -o "/tmp/p01-v24727-$page.html"
          done
          test "$(grep -o 'class="vf-rail-item' /tmp/p01-v24727-manage.php.html | wc -l | tr -d ' ')" = "5"
          ! grep -F 'vf-admin-eyebrow' /tmp/p01-v24727-update.php.html >/dev/null
          grep -F 'href="surface-manager.php?advanced=1"' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'href="links-admin.php"' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'href="health.php"' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'href="recycle-bin.php"' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'href="browser-helper.php"' /tmp/p01-v24727-transfer.php.html >/dev/null
          grep -F 'href="data-safety.php"' /tmp/p01-v24727-transfer.php.html >/dev/null
          grep -F 'href="update.php"' /tmp/p01-v24727-update.php.html >/dev/null
          grep -F 'href="plugins.php"' /tmp/p01-v24727-update.php.html >/dev/null
          test "$(grep -o 'class="vf-rail-subitem' /tmp/p01-v24727-surface-manager.php.html | wc -l | tr -d ' ')" = "5"
          grep -F '<h1>待整理</h1>' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F '>待整理收件箱<' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'class="vf-rail-chevron"' /tmp/p01-v24727-surface-manager.php.html >/dev/null
          grep -F 'P01 Admin Visual System R4 — enterprise unified' "$GITHUB_WORKSPACE/target/src/assets/admin-consolidation.css" >/dev/null
          grep -F 'P01 Admin Visual System R4 — resource workbench alignment' "$GITHUB_WORKSPACE/target/src/assets/admin-resource-manager.css" >/dev/null
          grep -F '<h1>导入导出</h1>' /tmp/p01-v24727-transfer.php.html >/dev/null
          grep -F '<h1>运行健康</h1>' /tmp/p01-v24727-system-health.php.html >/dev/null
          for forbidden in 系统收件箱 资源库 业务分类 治理; do ! grep -F "$forbidden" /tmp/p01-v24727-surface-manager.php.html >/dev/null; done
          grep -F 'normalizeAdminRail' "$GITHUB_WORKSPACE/target/src/assets/admin-shell.js" >/dev/null
          grep -F 'LEGACY_RAIL_HEADINGS' "$GITHUB_WORKSPACE/target/src/assets/admin-shell.js" >/dev/null
          echo P01_V24727_BIND_FRESH_AUTH_SMOKE=PASS

      - name: Verdict
        run: |
          echo P01_V24727_BOUND_CANDIDATE_GATE=PASS
          echo SCHEMA=2026090401
          echo MIGRATION=NONE
          echo PRODUCTION=NOT_WRITTEN
