name: P06 VF Press V0.1.3 Formal Private Release

on:
  pull_request:
    branches: [main]
    paths:
      - triggers/p06-v013-formal-release.txt

permissions:
  contents: read

env:
  SOURCE_SHA: e505d0bd176c1b85804258e536e9aafd194d0d58
  TAG: v0.1.3

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require registered release capabilities
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo REGISTERED_RELEASE_CAPABILITIES=PASS

      - name: Checkout exact private release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Build and verify exact formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = '0.1.3'
          grep -Fq '"lifecycle": "RELEASE_READY"' VF_PROJECT.json
          grep -Fq '"chinese_http_render": "PASS"' VF_PROJECT.json
          composer validate --strict >/dev/null
          composer dump-autoload --no-dev --optimize --no-interaction >/dev/null
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/build-release.php dist | tee /tmp/build
          grep -Fq 'RELEASE_BUILD=PASS' /tmp/build
          (cd dist && sha256sum -c SHA256SUMS.txt)
          FULL=dist/VF_Press_V0.1.3_FULL.zip
          UPDATE=dist/VF_Press_V0.1.3_UPDATE.zip
          test -s "$FULL" && test -s "$UPDATE"
          unzip -Z1 "$FULL" | sort >/tmp/full-list
          printf '%s\n' README_FIRST_INSTALL.txt index.php vfpress-install.php vfpress-runtime.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/full-list
          unzip -p "$UPDATE" VF_UPDATE.json | grep -Fq '"target_version": "0.1.3"'
          unzip -p "$UPDATE" payload/public/index.php | grep -Fq '出版工作台'
          unzip -p "$UPDATE" payload/src/Http/Studio/PublishingController.php | grep -Fq 'AI 编辑审校'
          FULL_SHA="$(sha256sum "$FULL" | awk '{print $1}')"
          UPDATE_SHA="$(sha256sum "$UPDATE" | awk '{print $1}')"
          FULL_BYTES="$(stat -c%s "$FULL")"
          UPDATE_BYTES="$(stat -c%s "$UPDATE")"
          echo "FORMAL_FULL_SHA=$FULL_SHA" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_SHA=$UPDATE_SHA" >> "$GITHUB_ENV"
          echo "FORMAL_FULL_BYTES=$FULL_BYTES" >> "$GITHUB_ENV"
          echo "FORMAL_UPDATE_BYTES=$UPDATE_BYTES" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS

      - name: Publish exact private GitHub Release
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/release-notes.md <<'EOF'
          VF Press V0.1.3 · 中文界面统一版。

          - 正式界面以中文为默认产品语言
          - 工作台 / 研究 / 作品与母稿 / 出版台 / 系统运维 / 内部预览统一中文化
          - 英文状态码继续作为内部数据合同，显示层统一转换为中文
          - AI / EPUB / PDF / SQLite 等必要行业缩写保留
          - 不改变 Schema，支持 V0.1.2 后台原子升级
          EOF
          if gh release view "$TAG" --repo llhzx2018/vf-press --json targetCommitish >/tmp/existing.json 2>/dev/null; then
            test "$(jq -r '.targetCommitish' /tmp/existing.json)" = "$SOURCE_SHA"
            gh release upload "$TAG" --repo llhzx2018/vf-press dist/VF_Press_V0.1.3_FULL.zip dist/VF_Press_V0.1.3_UPDATE.zip dist/SHA256SUMS.txt dist/RELEASE_INFO.json --clobber
          else
            gh release create "$TAG" --repo llhzx2018/vf-press dist/VF_Press_V0.1.3_FULL.zip dist/VF_Press_V0.1.3_UPDATE.zip dist/SHA256SUMS.txt dist/RELEASE_INFO.json --target "$SOURCE_SHA" --title 'VF Press V0.1.3' --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --repo llhzx2018/vf-press --json tagName,targetCommitish,isDraft,isPrerelease >/tmp/release.json
          test "$(jq -r '.tagName' /tmp/release.json)" = "$TAG"
          test "$(jq -r '.targetCommitish' /tmp/release.json)" = "$SOURCE_SHA"
          test "$(jq -r '.isDraft' /tmp/release.json)" = false
          test "$(jq -r '.isPrerelease' /tmp/release.json)" = false
          echo FORMAL_PRIVATE_RELEASE=PASS

      - name: Remote asset readback establishes authority
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/v013-readback && mkdir /tmp/v013-readback
          gh release download "$TAG" --repo llhzx2018/vf-press --dir /tmp/v013-readback -p 'VF_Press_V0.1.3_FULL.zip' -p 'VF_Press_V0.1.3_UPDATE.zip' -p 'SHA256SUMS.txt' -p 'RELEASE_INFO.json'
          (cd /tmp/v013-readback && sha256sum -c SHA256SUMS.txt)
          RF="$(sha256sum /tmp/v013-readback/VF_Press_V0.1.3_FULL.zip | awk '{print $1}')"
          RU="$(sha256sum /tmp/v013-readback/VF_Press_V0.1.3_UPDATE.zip | awk '{print $1}')"
          RFB="$(stat -c%s /tmp/v013-readback/VF_Press_V0.1.3_FULL.zip)"
          RUB="$(stat -c%s /tmp/v013-readback/VF_Press_V0.1.3_UPDATE.zip)"
          test "$RF" = "$FORMAL_FULL_SHA" && test "$RU" = "$FORMAL_UPDATE_SHA"
          test "$RFB" = "$FORMAL_FULL_BYTES" && test "$RUB" = "$FORMAL_UPDATE_BYTES"
          echo FORMAL_REMOTE_READBACK=PASS
          echo "OFFICIAL_FULL_BYTES=$RFB"
          echo "OFFICIAL_FULL_SHA256=$RF"
          echo "OFFICIAL_UPDATE_BYTES=$RUB"
          echo "OFFICIAL_UPDATE_SHA256=$RU"
          rm -rf /tmp/v013-readback source
