name: P01 V2.30 Final Candidate Gate V2
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths: [.github/workflows/p01-v230-final-candidate-gate-v2-20260829.yml]
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {SOURCE_SHA: '426740ee3e36d207581dddf9b3fe5d62fd8d1808', PORT: '18590', ROOT: '/tmp/p01-v230-final-v2', ADMIN_PASS: 'P01V230!Final'}
    steps:
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', extensions: 'pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo', coverage: none}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {repository: llhzx2018/vf-start, ref: '${{ env.SOURCE_SHA }}', token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}', fetch-depth: 0, path: source}
      - name: Exact source fresh runtime and 450 library
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"; test "$(tr -d '\r\n' < source/VERSION)" = 2.30.0
          find source/src -name '*.php' -type f -print0|xargs -0 -n1 php -l >/dev/null; node --check source/src/assets/workspace-rebaseline.js; git -C source diff --check
          rm -rf "$ROOT" /tmp/finalv2.cookies evidence; mkdir -p evidence; cp -a source/src "$ROOT"; php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/finalv2-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -c /tmp/finalv2.cookies -b /tmp/finalv2.cookies "http://127.0.0.1:${PORT}/setup.php" -o /tmp/finalv2-setup.html && break || sleep 1; done
          S=$(python3 -c "import re;s=open('/tmp/finalv2-setup.html').read();m=re.search(r'name=\"setup_csrf\"\\s+value=\"([^\"]+)\"',s);assert m;print(m.group(1))")
          curl -fsS -c /tmp/finalv2.cookies -b /tmp/finalv2.cookies -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$S" --data-urlencode 'site_title=VF Start V2.30 Final' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" >/dev/null
          php "$ROOT/cli/verify.php"|grep -Fx VERIFY_PASS=YES
          LOGIN=$(curl -fsS -c /tmp/finalv2.cookies -b /tmp/finalv2.cookies -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login"); T=$(echo "$LOGIN"|jq -r '.csrf'); printf '%s' "$T" >/tmp/finalv2-csrf
          cat >/tmp/mkcat.py <<'PY'
          import json,subprocess
          t=open('/tmp/finalv2-csrf').read();c='/tmp/finalv2.cookies';b='http://127.0.0.1:18590'
          def p(x):
            o=subprocess.check_output(['curl','-fsS','-c',c,'-b',c,'-H','Content-Type: application/json','-H',f'X-CSRF-Token: {t}','-d',json.dumps(x,ensure_ascii=False),b+'/api.php?action=category_save']);d=json.loads(o);assert d.get('ok');return d['id']
          r=p({'name':'资源库','is_private':False,'sort_order':100});d=p({'name':'开发','parent_id':r,'is_private':False,'sort_order':90});q=p({'name':'私人','parent_id':r,'is_private':True,'sort_order':80});e=p({'name':'待拓展','parent_id':r,'is_private':False,'sort_order':70});open('/tmp/finalv2-ids','w').write(f'{r} {d} {q} {e}')
          PY
          python3 /tmp/mkcat.py; read RID DID PID EID </tmp/finalv2-ids
          create(){ local cid="$1" title="$2" url="$3" surface="${4:-start}" kind="${5:-}"; local o c b; o=$(curl -sS -w '\n%{http_code}' -c /tmp/finalv2.cookies -b /tmp/finalv2.cookies -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$T" -F "category_id=$cid" -F "surface=$surface" -F "title=$title" -F "url=$url" -F "resource_kind=$kind" -F 'tags=Gate' -F 'is_private=0' -F 'source_kind=remote_url'); c=$(printf '%s' "$o"|tail -1); b=$(printf '%s' "$o"|sed '$d'); test "$c" = 200 || { echo "$b"; return 1; }; echo "$b"|jq -e '.ok==true' >/dev/null; }
          for i in $(seq 1 450); do create "$DID" "导航资源 $i" "https://gate-$i.example.org/"; done
          create "$PID" '私人资源' 'https://private-gate.example.org/'
          create "$RID" '频道资源' 'https://channel-gate.example.org/' channels '科技'; create "$RID" '影视资源' 'https://watch-gate.example.org/' watch '电影'; create "$RID" '专题资源' 'https://topic-gate.example.org/' topics 'AI'
          printf '<!doctype html><title>Gate</title><h1>Sandbox topic</h1>' >/tmp/topic.html
          O=$(curl -sS -w '\n%{http_code}' -c /tmp/finalv2.cookies -b /tmp/finalv2.cookies -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$T" -F "category_id=$RID" -F 'surface=topics' -F 'title=Hosted Gate Topic' -F 'url=' -F 'resource_kind=AI' -F 'tags=Gate' -F 'is_private=0' -F 'source_kind=hosted_html' -F 'html=@/tmp/topic.html;type=text/html'); C=$(printf '%s' "$O"|tail -1); B=$(printf '%s' "$O"|sed '$d'); test "$C" = 200; HID=$(echo "$B"|jq -r '.id'); curl -fsS "http://127.0.0.1:${PORT}/resource-html.php?id=$HID"|grep -F 'Sandbox topic' >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/start.php" -o /tmp/public.html; ! grep -F '私人资源' /tmp/public.html; grep -F '导航资源 1' /tmp/public.html >/dev/null
          php "$ROOT/cli/verify.php"|grep -Fx VERIFY_PASS=YES
          echo P01_V230_FINAL_RUNTIME=PASS
      - name: Install Playwright
        shell: bash
        run: mkdir -p /tmp/pw-finalv2 && cd /tmp/pw-finalv2 && npm init -y >/dev/null 2>&1 && npm install playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Browser large library domain and mobile gate
        shell: bash
        run: |
          cat >/tmp/pw-finalv2/gate.js <<'JS'
          const{chromium}=require('playwright'),fs=require('fs');(async()=>{let b='http://127.0.0.1:18590',pw='P01V230!Final',x=await chromium.launch({headless:true});async function l(c){let r=await c.request.post(b+'/api.php?action=login',{data:{password:pw}});if(!r.ok())throw Error('login')};let d=await x.newContext({viewport:{width:1440,height:960}});await l(d);let p=await d.newPage();await p.goto(b+'/start.php?per=50',{waitUntil:'networkidle'});if(await p.locator('.vf-asset-row').count()!=50)throw Error('page size');let txt=await p.locator('.vf-workspace-count').innerText();if(!txt.includes('451'))throw Error('count '+txt);if(await p.locator('.vf-global-domain-nav a').count()!=5)throw Error('nav');if(await p.locator('[data-category-node]',{hasText:'待拓展'}).count()!=1)throw Error('empty category');await p.locator('.vf-global-search input[name=q]').fill('导航资源 449');await p.locator('.vf-global-search').evaluate(f=>f.submit());await p.waitForLoadState('networkidle');if(await p.locator('.vf-asset-row').count()!=1)throw Error('search');for(let r of ['channels.php','watch.php','topics.php']){await p.goto(b+'/'+r,{waitUntil:'networkidle'});if(await p.locator('.vf-global-domain-nav a.active').count()!=1)throw Error(r+' active')}await p.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/desktop-final.png',fullPage:true});await d.close();let m=await x.newContext({viewport:{width:390,height:844}});await l(m);let q=await m.newPage();await q.goto(b+'/start.php',{waitUntil:'networkidle'});await q.locator('.vf-mobile-command-row').waitFor({state:'visible'});let t=q.locator('.vf-mobile-category-trigger');await t.waitFor({state:'visible'});await t.click();let o=q.locator('.vf-mobile-category-overlay');await o.waitFor({state:'visible'});await o.locator('input[type=search]').fill('待拓展');if(await o.locator('[data-category-picker-item]',{hasText:'待拓展'}).count()!=1)throw Error('picker');if(await q.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)>1)throw Error('overflow');await q.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-final.png',fullPage:true});await m.close();await x.close();fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_FINAL_CANDIDATE_V2=PASS\n')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/pw-finalv2 && node gate.js
      - uses: actions/upload-artifact@v4
        with: {name: P01-v230-final-candidate-v2-evidence, path: evidence, retention-days: 7}
      - name: Final verdict
        run: echo "SOURCE=$SOURCE_SHA" && echo "TREE=$(git -C source rev-parse HEAD^{tree})" && echo P01_V230_FINAL_CANDIDATE_V2_GATE=PASS
