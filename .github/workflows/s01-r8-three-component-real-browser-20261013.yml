name: S01 Round8 Three-Component Real Browser Recovery
on:
  push:
    branches: [task/s01-r8-integrated-browser-20261013]
    paths:
      - .github/workflows/s01-r8-three-component-real-browser-20261013.yml
permissions:
  contents: read
jobs:
  round8-real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-r8-integrated-browser-20261013
          persist-credentials: false
          path: harness
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: c36475951aea88bfbd04d4ac52d1cc3f777bff0e
          persist-credentials: false
          path: historic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c03-embed79-20261010-candidate
          persist-credentials: false
          path: embed-fixture
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5e3c331b20ec72e82c91c8cd3cd0b5a9d0d5e89e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 72cc556ec2480562850cf064e2b5fa559aa23775
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0bbb9b0fcc05e7d912de15fe5edb8e7dccd12181
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Exact product versions and component regression suite
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          test "$(git -C ops rev-parse HEAD)" = 5e3c331b20ec72e82c91c8cd3cd0b5a9d0d5e89e
          test "$(git -C m3u8 rev-parse HEAD)" = 72cc556ec2480562850cf064e2b5fa559aa23775
          test "$(git -C theme rev-parse HEAD)" = 0bbb9b0fcc05e7d912de15fe5edb8e7dccd12181
          php ops/tests/s01-c02-content-scan-coverage-limit-unit.php
          php ops/tests/s01-c02-1211086-dependency-scan-batches.php
          php ops/tests/s01-c02-quality-verdict-count-consistency-unit.php
          php ops/tests/s01-c02-publish-current-job-evidence-unit.php
          php theme/tests/s01-c01-renderer-lazyload-saved-frontend-truth.php
          php m3u8/tests/s01-c03-ops-downloader-front-config-consistency.php
          node m3u8/tests/browser-stream-safety.node.cjs
          node m3u8/tests/three-tool-recovery.node.cjs
          node m3u8/tests/playlist-checker-completion-state.node.cjs
          echo S01_R8_SOURCE_RECOVERY_REGRESSION_PASS
      - name: Browser dependencies
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: Start disposable WordPress with Ops M3U8 Theme and Polylang
        run: |
          set -Eeuo pipefail
          NET="s01-r8-$GITHUB_RUN_ID"; DB="$NET-db"; WP="$NET-wp"
          echo "NET=$NET" >> "$GITHUB_ENV"
          echo "DB=$DB" >> "$GITHUB_ENV"
          echo "WP=$WP" >> "$GITHUB_ENV"
          docker network create "$NET" >/dev/null
          docker run -d --name "$DB" --network "$NET" -e MARIADB_ROOT_PASSWORD=syntheticroot -e MARIADB_DATABASE=wordpress -e MARIADB_USER=wordpress -e MARIADB_PASSWORD=syntheticdb mariadb:11.8.8 >/dev/null
          for i in $(seq 1 65); do docker exec "$DB" mariadb-admin ping -h127.0.0.1 -uroot -psyntheticroot --silent >/dev/null 2>&1 && break; sleep 2; done
          docker run -d --name "$WP" --network "$NET" -p 18880:80 -e WORDPRESS_DB_HOST="$DB:3306" -e WORDPRESS_DB_NAME=wordpress -e WORDPRESS_DB_USER=wordpress -e WORDPRESS_DB_PASSWORD=syntheticdb wordpress:7.1.2-php8.3-apache >/dev/null
          for i in $(seq 1 90); do docker exec "$WP" test -f /var/www/html/wp-settings.php && curl -fsS http://127.0.0.1:18880/wp-admin/install.php >/dev/null && break; sleep 2; done
          curl -fsSLo /tmp/wp-cli-s01-r8.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker cp /tmp/wp-cli-s01-r8.phar "$WP:/usr/local/bin/wp"
          docker exec "$WP" chmod 0755 /usr/local/bin/wp
          cli(){ docker exec --user www-data "$WP" php /usr/local/bin/wp "$@" --path=/var/www/html; }
          cli core install --url=http://127.0.0.1:18880 --title='S01 Round8 Synthetic Tools' --admin_user=admin --admin_password='Synthetic-Only-Update-54!' --admin_email=runner@example.invalid --skip-email >/dev/null
          docker exec "$WP" mkdir -p /var/www/html/wp-content/plugins/vf-tool-m3u8 /var/www/html/wp-content/plugins/vf-ops /var/www/html/wp-content/themes/vf-tools-theme
          docker cp m3u8/src/. "$WP:/var/www/html/wp-content/plugins/vf-tool-m3u8"
          docker cp ops/. "$WP:/var/www/html/wp-content/plugins/vf-ops"
          docker cp theme/src/. "$WP:/var/www/html/wp-content/themes/vf-tools-theme"
          cli theme activate vf-tools-theme
          cli plugin activate vf-tool-m3u8
          cli plugin activate vf-ops
          cli plugin install polylang --version=3.8.10 --activate
          docker cp embed-fixture/lanes/s01-c03-embed79-20261010/seed.php "$WP:/tmp/s01-seed.php"
          cli eval-file /tmp/s01-seed.php
          cli rewrite structure '/%postname%/' --hard >/dev/null
          docker cp historic/lanes/s01-tools88-theme111-20261013/mount-seed.php "$WP:/tmp/mount-seed.php"
          cli eval-file /tmp/mount-seed.php > proof/s01-r8-mount.json
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.111
          test "$(cli plugin get vf-tool-m3u8 --field=version)" = 1.25.89
          test "$(cli plugin get vf-ops --field=version)" = 1.21.1109
          echo S01_R8_REAL_WORDPRESS_THREE_INSTALLED
      - name: Run actual Chromium frontend UX and recovery
        run: |
          set -Eeuo pipefail
          node historic/lanes/s01-tools88-theme111-20261013/browser.js candidate
          node harness/s01-r8-ops-admin.browser.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('proof/tools-candidate.json').read_text())
          b=json.loads(Path('proof/s01-r8-ops-admin.json').read_text())
          assert a['status']=='PASS' and b['status']=='PASS'
          print('S01_R8_REAL_CHROMIUM_FRONTEND_RECOVERY_PASS',len(a['checks']),len(b['checks']))
          PY
      - name: Cleanup disposable environment and private source
        if: always()
        run: |
          docker rm -fv "${WP:-missing-wp}" "${DB:-missing-db}" >/dev/null 2>&1 || true
          docker network rm "${NET:-missing-network}" >/dev/null 2>&1 || true
          rm -rf ops m3u8 theme embed-fixture historic harness /tmp/wp-cli-s01-r8.phar
