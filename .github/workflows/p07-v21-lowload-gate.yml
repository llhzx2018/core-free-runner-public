name: P07 V2.1 Low-load Gate

on:
  push:
    branches: [feature/p07-v21-lowload-fio-backtrace]
    paths:
      - 'experiments/p07-vps-audit-v21-lowload.sh'
      - '.github/workflows/p07-v21-lowload-gate.yml'
  pull_request:
    paths:
      - 'experiments/p07-vps-audit-v21-lowload.sh'
      - '.github/workflows/p07-v21-lowload-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and public surface
        shell: bash
        run: |
          set -euo pipefail
          script='experiments/p07-vps-audit-v21-lowload.sh'
          bash -n "$script"
          test "$(NO_COLOR=1 bash "$script" --version | awk '{print $NF}')" = 'V2.1.0'
          test "$(bash "$script" --build-id)" = '2.1.0-rc6-lowload'
          NO_COLOR=1 bash "$script" --help | tee /tmp/help.txt
          grep -q '低负载 4K / 64K / 512K / 1M' /tmp/help.txt
          grep -q '中国电信 / 联通 / 移动三网回程' /tmp/help.txt

      - name: Safety and regression contract
        shell: bash
        run: |
          set -euo pipefail
          script='experiments/p07-vps-audit-v21-lowload.sh'
          grep -Fq 'P07_FIO_TEST_MIB:-64' "$script"
          grep -Fq "4k) printf '4'" "$script"
          grep -Fq "64k|512k) printf '2'" "$script"
          grep -Fq "1m) printf '1'" "$script"
          grep -Fq 'nice -n 10' "$script"
          grep -Fq 'ionice -c2 -n7' "$script"
          ! grep -Fq 'iodepth=32' "$script"
          ! grep -Fq 'hitscounter.dev' "$script"
          ! grep -Fq 'ipinfo.io' "$script"
          ! grep -Eq 'apt(-get)? +install|yum +install|dnf +install|apk +add' "$script"
          grep -Fq 'b511bda3b26b6d840698f543d63e956d7466b8512c10ff0ada8292d556c33fb1' "$script"
          grep -Fq 'e2942a26d4b249076486677c9c12cd7f1a572854a5e136597d1391e8ad75ffb0' "$script"

      - name: Real low-load fio smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-v21-reports && mkdir -p /tmp/p07-v21-reports
          started=$(date +%s)
          NO_COLOR=1 P07_V21_SKIP_BASE=1 P07_V21_SKIP_ROUTE=1 P07_REPORT_DIR=/tmp/p07-v21-reports \
            timeout 120s bash experiments/p07-vps-audit-v21-lowload.sh | tee /tmp/fio.out
          elapsed=$(( $(date +%s) - started ))
          test "$elapsed" -lt 120
          grep -q '增强磁盘低负载测试' /tmp/fio.out
          grep -q '^ 4k' /tmp/fio.out
          grep -q '^ 64k' /tmp/fio.out
          grep -q '^ 512k' /tmp/fio.out
          grep -q '^ 1m' /tmp/fio.out
          grep -q '有效档位           : 4 / 4' /tmp/fio.out
          grep -q '增强 Markdown 报告' /tmp/fio.out
          test -z "$(find /var/tmp -maxdepth 1 -name '.p07-fio-*' -print -quit)"

      - name: Three-carrier parser and UX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-v21-route && mkdir -p /tmp/p07-v21-route
          NO_COLOR=1 P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_ROUTE_MOCK=1 P07_REPORT_DIR=/tmp/p07-v21-route \
            timeout 40s bash experiments/p07-vps-audit-v21-lowload.sh | tee /tmp/route.out
          grep -q '中国三网回程' /tmp/route.out
          grep -q '北京电信.*电信CN2.*优质' /tmp/route.out
          grep -q '上海联通.*联通9929.*优质' /tmp/route.out
          grep -q '成都移动.*移动CMIN2.*优质' /tmp/route.out
          grep -q '三网回程证据       : 有效 12/12' /tmp/route.out

      - name: Raw-route fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          NO_COLOR=1 P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_ROUTE_TIMEOUT_SEC=12 P07_REPORT_DIR=/tmp/p07-v21-route \
            timeout 25s bash experiments/p07-vps-audit-v21-lowload.sh | tee /tmp/raw.out
          grep -Eq '三网回程证据|安全跳过' /tmp/raw.out
