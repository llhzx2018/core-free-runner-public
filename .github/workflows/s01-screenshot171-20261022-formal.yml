name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-screenshot171-20261022]
    paths: ['.github/workflows/s01-screenshot171-20261022-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.171
  TARGET_SHA: 901bf21866254912c6814df4b918f9641911570f
  TARGET_TREE: 56df1506edeb44551729ea9bc859bb2dfd7073d8
  BASE_SHA: 5e54d38be3dca221438f28519b2faf5f2c77d241
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 901bf21866254912c6814df4b918f9641911570f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39752204563 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39752204563 --jq .head_sha)" = 7eec47288eac1818d7fa91933b3f04dd03bbe964
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39752204563 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39752204563 --jq .head_sha)" = 7eec47288eac1818d7fa91933b3f04dd03bbe964
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39752204563 --repo llhzx2018/core-free-runner-public --name s01-screenshot-39752204563 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/review-before.sha256 candidate-proof/review-after.sha256
          python3 control/lanes/s01-screenshot171-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          before=json.loads(pathlib.Path('candidate-proof/before-ui.json').read_text())
          after=json.loads(pathlib.Path('candidate-proof/after-ui.json').read_text())
          assert before['status']==after['status']=='PASS'
          assert after['write_requests']==0 and after['owner_visual']=='PENDING'
          assert [r['width'] for r in after['rows']]==[1440,1319,1024]
          assert all(r['first_screen_space_saved_px']>=60 for r in after['rows'])
          clean=json.loads(pathlib.Path('candidate-proof/clean-install.json').read_text())
          assert clean['status']=='PASS' and clean['admin_login']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='31dae5e044b0e4c9d2c04e17b43b396db3a75913012d7c60bd807700c5010fab' and new['bytes']==1972269
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.171 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.171 provider/vf-tools-theme_V1.35.171.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.171' --notes '重新核对九张后台截图并修正：维护页辅助查找保留并移到任务区之后；视觉验收压缩重复说明，明确自动检查与独立预览状态；恢复点数量改为直白说明；工具模块定位与整页查看使用不同文案；正文和操作色回到既有中性/青绿基线。实际隔离WordPress在1440/1319/1024核对首屏空间、预览隔离、页尾查找、恢复页任务和原模块定位；正式ZIP干净安装及170→171升级/回退/重复安装与数据保护验证。检查引擎、恢复事务、权限及数据不变；M3U8保持1.25.94，Production由Owner手工升级，OWNER视觉验收仍待真实使用。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.171 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.171 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.171 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.171.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.171.zip remote/vf-tools-theme_V1.35.171.zip
          echo '31dae5e044b0e4c9d2c04e17b43b396db3a75913012d7c60bd807700c5010fab  remote/vf-tools-theme_V1.35.171.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.171.zip)" = 1972269
          gh release view v1.35.171 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
