name: P03 V1.36.0 High-Fi Debug
on:
  push:
    branches: [p03-v1360-highfi-review]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN || secrets.CORE_AGENT_RUNNER_TOKEN || secrets.VF_START_RUNNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch prototype
        run: |
          mkdir -p dbg/evidence
          curl -fsSL -H "Authorization: Bearer ${PRIVATE_READ_TOKEN}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/llhzx2018/vf-forge/contents/docs/ua-ui/high-fi/index.html?ref=prototype/v1.36.0-flow-approved-highfi" -o dbg/index.html
      - name: Install browser
        working-directory: dbg
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@latest >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run debug
        working-directory: dbg
        shell: bash
        run: |
          python3 -m http.server 8765 > evidence/server.log 2>&1 &
          sleep 1
          cat > debug.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          const b=await chromium.launch({headless:true}); const p=await b.newPage({viewport:{width:1440,height:1000}});
          let log=''; const out=x=>{log+=x+'\n';console.log(x)};
          try{
            await p.goto('http://127.0.0.1:8765/#/today',{waitUntil:'networkidle'}); out('URL1='+p.url());
            out('LINKS='+await p.locator('[data-testid="today-open-p03"]').count());
            out('LINK_HREF='+await p.locator('[data-testid="today-open-p03"]').getAttribute('href'));
            await p.click('[data-testid="today-open-p03"]'); out('URL2='+p.url());
            await p.waitForTimeout(300); out('URL3='+p.url());
            out('CONTEXT='+await p.locator('[data-testid="project-context"]').count());
            out('NEXT='+await p.locator('[data-testid="primary-next-action"]').count());
            out('BODY='+await p.locator('body').innerText());
            await p.screenshot({path:'evidence/task06.png',fullPage:true});
          }catch(e){out('ERROR='+e.stack); await p.screenshot({path:'evidence/task06-error.png',fullPage:true}).catch(()=>{});fs.writeFileSync('evidence/debug.log',log);await b.close();process.exit(1)}
          fs.writeFileSync('evidence/debug.log',log); await b.close();
          JS
          set -o pipefail
          node debug.mjs 2>&1 | tee evidence/stdout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P03_HIGHFI_TASK06_DEBUG
          path: dbg/evidence
          retention-days: 1
