name: P08 v014 Mode V GOV-DOC + P08 exact authority release gate
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v014-mode-v-gov-verify.yml
permissions:
  contents: read
jobs:
  gov-p08-v014-v:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v014-mode-v-policy-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact private GOV-DOC candidate (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: b92e8f48780c97b0021cfe075738d11875ac83ad
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: gov
      - name: Policy source exact gates and Git diff
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL, SECURITY, TESTING, UPGRADE, DATA_SCHEMA, API_PROVIDER, SEO, CRON_JOB, NOTIFICATION, OBSERVABILITY, PERFORMANCE, GIT, UA_UI
            IMPACT_REASON: This PR changes the normative release-skill human acceptance timing contract for one high-risk P08 updater release and is classified UPDATED; all 13 areas retain their safety gates while the sealed domain authority bodies stay unchanged.
        run: |
          set -Eeuo pipefail
          test "$(git -C gov rev-parse HEAD)" = b92e8f48780c97b0021cfe075738d11875ac83ad
          test -f gov/governance/release/cases/P08_ADOPS_V014_PR83_PR84_PR86_NATIVE_ONECLICK_POST_RELEASE_OWNER_MANUAL_20261120.md
          test -f gov/skills/skill-release/V3.21/SKILL.md
          test "$(git -C gov diff --name-only 74c4090c93cea7ef6a55c7b17d39515e7ca8710c HEAD | wc -l)" -eq 4
          python3 gov/governance/public-authority/tools/global_closure_lint.py --git-base 74c4090c93cea7ef6a55c7b17d39515e7ca8710c --git-head b92e8f48780c97b0021cfe075738d11875ac83ad
          python3 gov/governance/public-authority/tools/current_dependency_lint.py --git-base 74c4090c93cea7ef6a55c7b17d39515e7ca8710c --git-head b92e8f48780c97b0021cfe075738d11875ac83ad
          grep -F '| skill-release | V3.21 |' gov/CURRENT.md
          grep -F '| skill-release | V3.21 | V2.6 |' gov/skills/README.md
          grep -F 'v0.1.13' gov/governance/release/cases/P08_ADOPS_V014_PR83_PR84_PR86_NATIVE_ONECLICK_POST_RELEASE_OWNER_MANUAL_20261120.md
          grep -F 'Mode V' gov/skills/skill-release/V3.21/SKILL.md >/dev/null
          grep -F 'skill-release V3.21 ->' gov/skills/README.md >/dev/null
          test -z "$(git -C gov status --porcelain --untracked-files=all)"
          echo P08_MODE_V_GOV_CASE_SOURCE=PASS
      - name: Checkout exact P08 RP-07V candidate (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: e250bdeab0fb0c8d563bc2b33e81347e2aea87a6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p08
      - name: Verify P08 source identity, RP-07V and no executable delta
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = e250bdeab0fb0c8d563bc2b33e81347e2aea87a6
          test "$(cat p08/VERSION)" = 0.1.14
          test "$(git -C p08 diff --name-only 7d9512f5133bcc880ebace7e2655f8f947ff2508 HEAD | wc -l)" -eq 4
          test -z "$(git -C p08 diff --name-only 7d9512f5133bcc880ebace7e2655f8f947ff2508 HEAD | grep -Ev '^(AGENTS.md|docs/authority/CURRENT.md|docs/authority/ACCEPTANCE_MATRIX.md|docs/authority/RPD.md)
        if: always()
        run: |
          rm -rf -- gov p08
          test ! -e gov && test ! -e p08
          echo P08_MODE_V_PRIVATE_CLEANUP=PASS
 || true)"
          grep -F '## RP-07V' p08/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F 'V3.21 Mode V' p08/AGENTS.md >/dev/null
          grep -F 'FORMAL' p08/docs/authority/RPD.md >/dev/null || grep -F 'Formal Release' p08/docs/authority/RPD.md >/dev/null
          echo P08_RP07V_SOURCE_BOUND_AUTHORITY_ONLY=PASS
      - name: Destroy private GOV-DOC checkout
        if: always()
        run: |
          rm -rf -- gov
          test ! -e gov
          echo P08_MODE_V_PRIVATE_CLEANUP=PASS
