name: P04 V2.5.3 Atomic Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-atomic-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-zip sqlite3 >/dev/null
      - name: Run through Atomic and print safe failure page
        env:
          VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          python3 - runner-tools/ops/p04/v253_hotfix_execute_v2.sh <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          old='''test "$UP_CODE" = 200\ngrep -Fq '升级完成' "$WORK/repair-post.html"'''
          new='''if [[ "$UP_CODE" != 200 ]] || ! grep -Fq '升级完成' "$WORK/repair-post.html"; then\n  echo "ATOMIC_POST_HTTP=$UP_CODE"\n  echo '--- ATOMIC RESPONSE ---'\n  sed -n '1,160p' "$WORK/repair-post.html" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'\n  echo '--- SERVER LOG TAIL ---'\n  tail -80 "$WORK/http.log" | sed -E 's#(/[A-Za-z0-9._-]+){3,}#[ABSOLUTE_PATH_REDACTED]#g'\n  exit 1\nfi'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          bash runner-tools/ops/p04/v253_hotfix_execute_v2.sh
      - name: Cleanup
        if: always()
        run: rm -rf runner-tools
