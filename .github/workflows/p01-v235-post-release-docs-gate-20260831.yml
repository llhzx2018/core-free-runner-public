name: P01 V2.35 Post-release Develop Docs Gate
on:
  push:
    branches: [task/p01-v235-post-release-docs-gate-20260831]
jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      SOURCE: 0ae51657fc708351bdd5a7536570db2065a8fbb4
      BASE: 9aa21fd4ecc10508ec0776cb8fe00c824c772607
      DEVELOP_SOURCE: 9aa21fd4ecc10508ec0776cb8fe00c824c772607
      DEVELOP_TREE: 6e0c0b8d695cae1dd8897b47eb9680857a18d53b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
      - name: Exact docs-only fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          mapfile -t files < <(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "${files[@]}" | sort > /tmp/actual.txt
          printf '%s\n' \
            VF_PROJECT.json \
            docs/authority/CURRENT.md \
            docs/evidence/P01_POST_V2.35_DEVELOP_UX_CHECKPOINT_20260831.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --name-only "$BASE"...HEAD | grep -E '^(src|database|scripts|tests)/'
          test "$(cat VERSION)" = '2.35.0'
          echo P01_POST_RELEASE_DOCS_SOURCE_FENCE=PASS
      - name: Machine-readable authority invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess
          now=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          old=json.loads(subprocess.check_output(['git','show',f"{__import__('os').environ['BASE']}:VF_PROJECT.json"],text=True))
          # Published and Production Truth must not move in a develop-only checkpoint.
          assert now['production_version']==old['production_version']=='2.34.0'
          assert now['published_release']==old['published_release']
          assert now['production_release']==old['production_release']
          assert now['schema_version']==old['schema_version']=='2026082901'
          assert now['working_version']=='2.35.0'
          cc=now['current_change']
          assert cc['product_develop_source']==__import__('os').environ['DEVELOP_SOURCE']
          assert cc['product_develop_tree']==__import__('os').environ['DEVELOP_TREE']
          cp=cc['post_release_develop_checkpoint']
          assert cp['state']=='VERIFIED / NOT RELEASED'
          assert cp['visual_sweep']['run']==33335213914
          assert cp['visual_sweep']['frames']==20
          assert cp['visual_sweep']['result']=='PASS'
          assert cp['prs']==[122,123,124]
          assert now['current_authority'].find('Develop')>=0
          print('P01_POST_RELEASE_JSON_AUTHORITY=PASS')
          PY
      - name: Human-readable authority invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'Develop Truth · Post-V2.35.0 UX Checkpoint' docs/authority/CURRENT.md
          grep -F 'Develop Source: 9aa21fd4ecc10508ec0776cb8fe00c824c772607' docs/authority/CURRENT.md
          grep -F 'NOT RELEASED' docs/authority/CURRENT.md
          grep -F '33335213914 PASS' docs/authority/CURRENT.md
          grep -F 'PR #122' docs/evidence/P01_POST_V2.35_DEVELOP_UX_CHECKPOINT_20260831.md
          grep -F 'PR #123' docs/evidence/P01_POST_V2.35_DEVELOP_UX_CHECKPOINT_20260831.md
          grep -F 'PR #124' docs/evidence/P01_POST_V2.35_DEVELOP_UX_CHECKPOINT_20260831.md
          grep -F '33335213914' docs/evidence/P01_POST_V2.35_DEVELOP_UX_CHECKPOINT_20260831.md
          echo P01_POST_RELEASE_DOCS_AUTHORITY=PASS
