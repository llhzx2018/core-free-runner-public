name: S01-C01 brand settings V8 exact candidate
on:
  push:
    branches: [task/s01-c01-brand-alignment-13561-candidate]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.61'
      TARGET_SHA: '5655f8ca3ed7943b86d8b9ce9c3e59714cbd241b'
      TARGET_TREE: 'e104122a4973dfb2ed4ada142338fadaeabe6231'
      SOURCE_VERSION: '1.35.60'
      BASE_SHA: '06abf529192082bb903c5718a9b5c9b3fee5bc6a'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact identity and focused contracts
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c01-brand-alignment-13561 lane
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find target/src -type f -name '*.php' -print0)
          php target/tests/brand-page-live-preview-contract.php
          php target/tests/update-center-human-language-contract.php
          php target/tests/update-center-credential-native-offer-runtime.php
          node --check target/src/assets/js/admin/admin-brand.js
          node --check target/tests/brand-v8-browser-proof.js
          python3 lane/build.py
      - name: Previous exact release recovery baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir previous
          gh release download "v$SOURCE_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-theme_V${SOURCE_VERSION}.zip" --dir previous
          test "$(stat -c %s "previous/vf-tools-theme_V${SOURCE_VERSION}.zip")" = '1742249'
          test "$(sha256sum "previous/vf-tools-theme_V${SOURCE_VERSION}.zip" | awk '{print $1}')" = '623f974f59e3632c9b8b92d287d853c28f92872fb278cedcf7266adeed36db5d'
      - name: Browser dependencies and 16 source-render cases
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          mkdir wp-css
          for f in common forms; do curl -fsSL "https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-admin/css/$f.css" -o "wp-css/$f.css"; done
          curl -fsSL https://raw.githubusercontent.com/WordPress/WordPress/6.8.1/wp-includes/css/buttons.css -o wp-css/buttons.css
          NODE_PATH="$PWD/node_modules" V8_WP_CSS="$PWD/wp-css" node target/tests/brand-v8-browser-proof.js
          mkdir -p proof/fixture
          cp target/proof/*.json target/proof/*.png proof/fixture/
      - name: Real WordPress upgrade recovery and browser proof
        run: bash lane/wordpress.sh
      - name: Public-safe evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-brand-v8-candidate-${{ github.run_id }}
          path: |
            proof/*.json
            proof/*.png
            proof/fixture/*.json
            proof/fixture/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target previous proof/*.zip /tmp/v8-mock.py
