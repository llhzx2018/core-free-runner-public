name: P01 V2.47.252 Course Import UI Removal Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247252-course-import-ui-removal.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin dc53575e7d971e2cf0053d8b3432341d52d8e76d
          git -C candidate checkout -q --detach dc53575e7d971e2cf0053d8b3432341d52d8e76d
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.252"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.252"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin c7aeb58bfb39731e0da9b2e1e5c3d166f7e5624d
          git -C baseline checkout -q --detach c7aeb58bfb39731e0da9b2e1e5c3d166f7e5624d
          echo P01_V247252_EXACT_SOURCE=PASS

      - name: Focused course contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/course_workspace_presentation_contract.php
          php candidate/tests/unit/courses_page_full_polish_contract.php
          php candidate/tests/unit/courses_v247172_browse_first_r13_contract.php
          php candidate/tests/unit/course_markdown_reader_contract.php
          php -l candidate/src/app/CourseLibraryPage.php
          php -l candidate/src/books-catalog-import.php
          ! grep -Fq 'vf-course-import' candidate/src/app/CourseLibraryPage.php
          grep -Fq 'BookCatalogImporter.php' candidate/src/books-catalog-import.php
          echo P01_V247252_COURSE_IMPORT_UI_REMOVAL=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247252_CANONICAL=PASS

      - name: Prove bounded scope
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
