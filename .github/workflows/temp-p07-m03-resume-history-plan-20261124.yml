name: TEMP P07 M03 resume history-plan source regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-resume-history-plan-20261124.yml'
permissions:
  contents: read
jobs:
  source-regression:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-resume-history-plan-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_SHA: '95f1eb5ebf86a18102b92ea3f4284a863902245b'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Transient exact private source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-private
      - name: Verify exact source and synthetic resume-plan regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          cd "$GITHUB_WORKSPACE/.p07-private"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          python3 -B -m unittest -q \
            tests.test_p07_m03_safe_batch \
            tests.test_p07_m03_resume_audit \
            tests.test_p07_m03_safe_batch_terminal_ux \
            tests.test_p07_m03_trial_builder_146 \
            > "$RUNNER_TEMP/p07-source-regression.log" 2>&1 || {
              grep -E '^(FAIL:|ERROR:|Ran [0-9]+ tests|FAILED \()' "$RUNNER_TEMP/p07-source-regression.log" || true
              exit 31
            }
          grep -E '^(Ran [0-9]+ tests|OK)$' "$RUNNER_TEMP/p07-source-regression.log" || true
          echo P07_M03_HISTORY_SCOPE_SOURCE_TESTS=PASS
      - name: Always erase transient private checkout and private logs
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/p07-source-regression.log"
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private"
          test ! -e "$GITHUB_WORKSPACE/.p07-private"
