name: P01 V2.36.1 Main Promotion
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-main-promotion-20260901.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      FORMAL_TREE: 889d7662cf7907cc93d958c5df31f7824faa050a
      RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      EXPECTED_MAIN: e35a0757bde5e8c749f8ca3cb49349d2c463ec77
      CANDIDATE_RUN: '33472637909'
      BIND_RUN: '33472881503'
      FORMAL_RUN: '33473351744'
      STRICT_RUN: '33473626306'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact Promotion Gate and fast-forward main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.1 >/dev/null 2>&1; then echo UNEXPECTED_V2361_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" --quiet
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$FORMAL_SOURCE"
          test "$(cat VERSION)" = 2.36.1
          test "$(cat src/VERSION.txt)" = 2.36.1
          grep -Fx "define('VF_VERSION', '2.36.1');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .candidate_state VF_PROJECT.json)" = PASS
          git push origin "$FORMAL_SOURCE:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$FORMAL_SOURCE"
          test "$REMOTE_DEVELOP" = "$FORMAL_SOURCE"
          printf 'P01_V2361_MAIN_PROMOTION=PASS\nMAIN=%s\nDEVELOP=%s\nCANDIDATE_RUN=%s\nBIND_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_RUN=%s\nTAG=ABSENT\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$REMOTE_DEVELOP" "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2361-main-promotion.txt
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2361-main-promotion-${{ github.run_id }}
          path: /tmp/p01-v2361-main-promotion.txt
          if-no-files-found: error
          retention-days: 90
