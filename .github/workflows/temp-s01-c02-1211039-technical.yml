name: S01-C02 1.21.1039 technical candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_technical_1039
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4fb53ef8cedbc463c1d5a7ada392dd219e6ab65f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5b077b506470869fbe4fe7574d2c071511422d36
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Exact source contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "4fb53ef8cedbc463c1d5a7ada392dd219e6ab65f"
          test "$(git -C target rev-parse HEAD^{tree})" = "41e1f37a1bed6bde769242382d15c4b065ac0318"
          test "$(cat target/VERSION)" = "1.21.1039"
          test "$(cat baseline/VERSION)" = "1.21.1038"
          grep -F "Version: 1.21.1039" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211039-technical-functional-contract.php
          php target/tests/s01-c02-1211001-technical-responsive-consistency-contract.php
          php target/tests/s01-c02-1211002-technical-state-matrix-contract.php
          php target/tests/s01-c02-1211003-technical-readability-contract.php
          php target/tests/s01-c02-121997-technical-page-family-contract.php
          php target/tests/s01-c02-121998-technical-production-polish-contract.php
          php target/tests/s01-c02-121999-technical-gate-state-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          echo SOURCE_CONTRACTS=PASS
          echo PHP_83_SYNTAX=PASS

      - name: Browser responsive proof
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/technical-node
          cd /tmp/technical-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/technical-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211039-technical-browser-proof.js > evidence/technical-browser.json
          cat evidence/technical-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/technical-browser.json

      - name: Build baseline and candidate packages
        run: |
          set -Eeuo pipefail
          python3 baseline/.github/release/build-ops-package.py --source baseline --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1038.zip" > baseline-package.json
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1039.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1038.zip" baseline.zip
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1039.zip" candidate.zip
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          for name in ['baseline.zip','candidate.zip']:
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None,name
                  assert all(n.startswith('vf-ops/') and '..' not in n.split('/') for n in z.namelist()),name
          p=json.loads(Path('package.json').read_text())
          Path('evidence/package.json').write_text(json.dumps({
              'asset_name':p.get('asset_name',''),
              'asset_bytes':p.get('asset_bytes',0),
              'asset_sha256':p.get('asset_sha256',''),
              'runtime_fingerprint':p.get('runtime_fingerprint','')
          },indent=2)+'\n')
          print('PACKAGE_CRC_PATH=PASS')
          PY

      - name: WordPress technical truth integration and rollback
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/s01-technical-1039"
          WP="$TASK_ROOT/wordpress"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }

          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_technical_1039 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18139 --title='Technical Candidate 1039' --admin_user=admin --admin_password='Fixture-Technical-1039!' --admin_email=fixture@example.invalid --skip-email >/dev/null

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --activate >/dev/null
          wp option update vf_ops_technical_candidate_sentinel preserve >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1038")throw new RuntimeException("BASE_VERSION");echo "BASELINE_RUNTIME=PASS\n";'

          wp plugin install "$GITHUB_WORKSPACE/candidate.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1039")throw new RuntimeException("TARGET_VERSION");if(get_option("vf_ops_technical_candidate_sentinel")!=="preserve")throw new RuntimeException("STATE_CHANGED");echo "CANDIDATE_INSTALL_READBACK=PASS\n";'

          wp eval '
            require_once WP_PLUGIN_DIR."/vf-ops/includes/acceptance-o11/source-change-marker.php";
            require_once WP_PLUGIN_DIR."/vf-ops/includes/acceptance-o11/source-acceptance-product.php";
            require_once WP_PLUGIN_DIR."/vf-ops/includes/seo-governance/technical-seo-service.php";
            $key=function_exists("vf_ops_o11_contract_v121400")?(string)(vf_ops_o11_contract_v121400()["source_snapshot_option"]??"vf_ops_o11_source_snapshot_v121400"):"vf_ops_o11_source_snapshot_v121400";
            $m=vf_ops_source_change_marker_get_v121427();$s=vf_ops_source_acceptance_sitemap_path_v121807();$probe="/_vf-source-404-probe-candidate1039/";
            $x=["schemaVersion"=>"2.1","artifactType"=>"vf_ops_source_site_acceptance","version"=>VF_OPS_VERSION,"pluginVersion"=>VF_OPS_VERSION,"themeVersion"=>(string)wp_get_theme()->get("Version"),"generatedAt"=>current_time("mysql"),"summary"=>["status"=>"PASS"],"rows"=>[["path"=>"/","kind"=>"html","status"=>"PASS","http"=>200,"issues"=>[]],["path"=>$s,"kind"=>"sitemap","status"=>"PASS","http"=>200,"issues"=>[]],["path"=>"/robots.txt","kind"=>"robots","status"=>"PASS","http"=>200,"issues"=>[]],["path"=>$probe,"kind"=>"not_found","status"=>"PASS","http"=>404,"issues"=>[]]],"rawEvidence"=>["changeMarker"=>$m]];
            $x["snapshotSha256"]=vf_ops_source_acceptance_hash_v121427($x);update_option($key,$x,false);
            $r=vf_ops_o8_technical_source_snapshot_v121420([]);
            if(empty($r["integrity"])||!empty($r["stale"])||($r["status"]??"")!=="PASS")throw new RuntimeException("FRESH_SNAPSHOT");
            if(($r["rows"]["sitemap"]["path"]??"")!==$s)throw new RuntimeException("SITEMAP_OWNER");
            if(($r["rows"]["not_found"]["path"]??"")!==$probe)throw new RuntimeException("NOT_FOUND_PROBE");
            vf_ops_source_change_marker_touch_v121427("candidate_test",0);$st=vf_ops_o8_technical_source_snapshot_v121420([]);
            if(empty($st["stale"])||($st["status"]??"")!=="OUTDATED")throw new RuntimeException("CHANGE_MARKER_FRESHNESS");
            $x["snapshotSha256"]=str_repeat("0",64);update_option($key,$x,false);$bad=vf_ops_o8_technical_source_snapshot_v121420([]);
            if(!empty($bad["integrity"])||($bad["status"]??"")!=="NOT_VERIFIED")throw new RuntimeException("INTEGRITY_FAIL_CLOSED");
            $sample=["title"=>"测试页","path"=>"/sample/","language"=>"zh","layers"=>["dynamic"=>["status"=>"FAIL","issues"=>[["code"=>"canonical_missing"]]],"static"=>["status"=>"NOT_VERIFIED","issues"=>[["code"=>"evidence_missing"]]],"online"=>["status"=>"PASS","issues"=>[]]]];
            if(!vf_ops_o8_technical_row_matches_v121420($sample,["q"=>"测试","layer"=>"all","status"=>"needs_work","issue"=>"all","per_page"=>8,"paged"=>1]))throw new RuntimeException("FILTER_SEARCH");
            if(!vf_ops_o8_technical_row_matches_v121420($sample,["q"=>"","layer"=>"dynamic","status"=>"fail","issue"=>"canonical_missing","per_page"=>8,"paged"=>1]))throw new RuntimeException("FILTER_LAYER");
            echo json_encode(["status"=>"PASS","snapshot_integrity"=>"PASS","active_sitemap_owner"=>"PASS","not_found_probe"=>"PASS","change_marker_freshness"=>"PASS","invalid_snapshot_fail_closed"=>"PASS","filters"=>"PASS"])."\n";
          ' > evidence/technical-wp-integration.json
          cat evidence/technical-wp-integration.json
          jq -e '.status=="PASS" and .snapshot_integrity=="PASS" and .active_sitemap_owner=="PASS" and .not_found_probe=="PASS" and .change_marker_freshness=="PASS" and .invalid_snapshot_fail_closed=="PASS" and .filters=="PASS"' evidence/technical-wp-integration.json

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1038")throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_technical_candidate_sentinel")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");echo "ROLLBACK=PASS\n";'

      - name: Write public-safe evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read_json(path):
              p=Path(path)
              if not p.exists() or p.stat().st_size<2:return {}
              try:return json.loads(p.read_text())
              except Exception:return {}
          b=read_json('evidence/technical-browser.json')
          w=read_json('evidence/technical-wp-integration.json')
          p=read_json('evidence/package.json')
          proof={
              'schema':'vf-s01-technical-proof/v1',
              'source_repository':'llhzx2018/vf-tools-ops',
              'source_sha':'4fb53ef8cedbc463c1d5a7ada392dd219e6ab65f',
              'source_tree':'41e1f37a1bed6bde769242382d15c4b065ac0318',
              'version':'1.21.1039','base_version':'1.21.1038',
              'package_sha256':p.get('asset_sha256',''),'asset_bytes':p.get('asset_bytes',0),
              'runtime_fingerprint':p.get('runtime_fingerprint',''),
              'browser':'PASS' if b.get('pass') is True and not b.get('failures') else 'NOT_PROVEN',
              'wp_mariadb_integration':'PASS' if w.get('status')=='PASS' else 'NOT_PROVEN',
              'production':'NOT_TOUCHED','owner_product_pass':False
          }
          proof['status']='PASS' if proof['browser']=='PASS' and proof['wp_mariadb_integration']=='PASS' else 'FAIL'
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          if proof['status']!='PASS': raise SystemExit(1)
          PY

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211039-technical-candidate-evidence
          path: |
            evidence/technical-browser.json
            evidence/technical-wp-integration.json
            evidence/package.json
            evidence/FINAL_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
