name: P02 R38 Runtime Style Audit
on:
  push:
    branches: [run/p02-r38-runtime-style-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P02 develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: b051cad84535f9f059ca36eb4a75e04292a22aac
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Audit runtime style dependencies
        working-directory: product
        run: |
          set -Eeuo pipefail
          echo '=== SCRATCH CSS REFERENCES ==='
          grep -RIn --exclude='scratch-tabs.css' 'scratch-tabs\.css' public scripts tests docs .github SOURCE_MANIFEST.json SOURCE_MANIFEST.txt || true
          echo '=== SCRATCH INLINE STYLE REFERENCES ==='
          grep -RInE 'scratchTabOverflowUxV2518|ensureStyle\(|scratch-tab-scroll-v2518' public scripts tests docs .github || true
          echo '=== SCRATCH BROWSER ENTRY ==='
          grep -RInE 'createNewMaterial|VfLibraryScratch|scratchWorkspaceV259|scratch-launch-v259|data-scratch' public/assets tests/e2e tests/unit | head -n 160 || true
          echo '=== RUNTIME COUNT 72 REFERENCES ==='
          grep -RInE 'runtime_source_file_count[^\n]*72|files=72|72 runtime source' docs tests scripts .github SOURCE_MANIFEST.json SOURCE_MANIFEST.txt || true
          echo '=== MANIFEST SCRATCH ENTRIES ==='
          grep -n 'scratch-tabs' SOURCE_MANIFEST.json SOURCE_MANIFEST.txt || true
          echo '=== TEST SCREENSHOT RESIDUE ==='
          find browser-evidence -maxdepth 1 -type f -printf '%p %s bytes\n' 2>/dev/null || true
          echo '=== MAIN PAGE STATIC STYLE ENTRIES ==='
          grep -n 'stylesheet' public/index.php || true
          echo P02_R38_RUNTIME_STYLE_AUDIT=PASS
