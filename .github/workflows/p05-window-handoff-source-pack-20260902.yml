name: P05 Window Handoff Source/Data Pack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-window-handoff-source-pack-20260902.yml'

permissions:
  contents: read

jobs:
  pack:
    if: github.head_ref == 'test/p05-window-handoff-source-pack-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P05 current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-seo
          ref: 2518a8c07fc516de714d275327df49359e9e4719
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p05

      - name: Build exact source and data snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05 rev-parse HEAD)" = '2518a8c07fc516de714d275327df49359e9e4719'
          rm -rf /tmp/p05-handoff
          mkdir -p /tmp/p05-handoff/P05_SOURCE_SNAPSHOT /tmp/p05-handoff/09_DATA
          rsync -a --exclude='.git' p05/ /tmp/p05-handoff/P05_SOURCE_SNAPSHOT/
          printf '%s\n' '2518a8c07fc516de714d275327df49359e9e4719' > /tmp/p05-handoff/P05_SOURCE_SNAPSHOT_EXACT_COMMIT.txt
          printf '%s\n' 'd409c18052d2f4f72051043227acc7170aa3bfc4' > /tmp/p05-handoff/P05_SOURCE_SNAPSHOT_EXACT_TREE.txt
          git -C p05 ls-files | sort > /tmp/p05-handoff/P05_SOURCE_TRACKED_FILES.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          src=Path('p05/php/data/DEMO_DATASET_V1.json.gz.b64')
          out=Path('/tmp/p05-handoff/09_DATA/DEMO_DATASET_V1.json')
          meta=Path('/tmp/p05-handoff/09_DATA/DEMO_DATASET_README.txt')
          expected='f9722556109118edc8fe94471ebecd0679fafc10de7e2096423c8b69e8e83e06'
          raw=base64.b64decode(''.join(src.read_text(encoding='utf-8').split()))
          decoded=gzip.decompress(raw)
          json.loads(decoded.decode('utf-8'))
          out.write_bytes(decoded)
          actual=hashlib.sha256(decoded).hexdigest()
          meta.write_text('Dataset ID: P05_DEMO_V1\nExpected authority SHA-256: '+expected+'\nDecoded raw JSON SHA-256: '+actual+'\nSource: php/data/DEMO_DATASET_V1.json.gz.b64\n',encoding='utf-8')
          print('DEMO_DATASET_DECODED_SHA256='+actual)
          PY
          (cd /tmp/p05-handoff && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          echo 'P05_HANDOFF_SOURCE_DATA_PACK=PASS'
          echo 'P05_PRODUCT_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'

      - name: Upload exact source/data artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: P05_WINDOW_HANDOFF_SOURCE_DATA_2518a8c0
          path: /tmp/p05-handoff
          if-no-files-found: error
          retention-days: 7
