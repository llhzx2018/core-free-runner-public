name: p01-shared-dialog-foundation-r1-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-shared-dialog-foundation-r1-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 3d1f59364d6c328cc87bb07327ffa0be8d4faa5f
      TARGET_SHA: a6cc4f194c14fa895e0b6912e3290fc977296a15
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C baseline fetch -q --depth 1 origin "${BASE_SHA}"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.52"
          echo P01_SHARED_DIALOG_R1_EXACT_SOURCE=PASS

      - name: Verify bounded dialog diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          src/assets/admin-pages.css
          src/assets/admin-shell.css
          src/assets/admin-shell.js
          src/assets/browser-helper.js
          src/assets/data-recovery.js
          src/assets/data-safety.js
          src/assets/duplicates.js
          src/assets/health.js
          src/assets/links-admin.js
          src/assets/tags.js
          tests/unit/shared_dialog_foundation_r1_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_SHARED_DIALOG_R1_BOUNDED_DIFF=PASS

      - name: Syntax and focused dialog contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          for js in             src/assets/admin-shell.js             src/assets/browser-helper.js             src/assets/data-recovery.js             src/assets/data-safety.js             src/assets/duplicates.js             src/assets/health.js             src/assets/links-admin.js             src/assets/tags.js
          do
            node --check "current/${js}"
          done
          tests=(
            tests/unit/shared_dialog_foundation_r1_contract.php
            tests/unit/links_dialog_cancel_save_guard_contract.php
            tests/unit/navigation_url_table_production_r1_contract.php
            tests/unit/navigation_row_action_hierarchy_contract.php
            tests/unit/navigation_context_persistence_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/${t}"
            php "current/${t}"
          done
          echo P01_SHARED_DIALOG_R1_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_SHARED_DIALOG_R1_CANONICAL=PASS
