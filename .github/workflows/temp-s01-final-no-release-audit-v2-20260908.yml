name: temp-s01-final-no-release-audit-v2-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-final-no-release-audit-v2-20260908.yml
permissions:
  contents: read
jobs:
  final-audit-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      UPDATES_REPO: llhzx2018/core-updates
      UPDATES_SHA: 94831d106e2868d448b84c0b5169f4b92d1e56c4
      THEME_REPO: llhzx2018/vf-tools-theme
      THEME_SHA: cae2e2dbc78ac46ed339589f741d26656673d4a9
      THEME_TAG: v1.35.22
      THEME_ASSET: vf-tools-theme_V1.35.22.zip
      THEME_BYTES: '1811370'
      THEME_ASSET_SHA: b33625475f315fc93efda893969cf38b0b6425865fd33277eccbea316a3f4e5d
      THEME_RUNTIME_FP: cd2bfa8d48f11f22c27a81f6945776adbcac81479832fce963ce46e8540694ee
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      OPS_TAG: v1.21.859
      OPS_ASSET: vf-tools-ops_V1.21.859.zip
      OPS_BYTES: '3362261'
      OPS_ASSET_SHA: 2e4e0c1f74723b5ac5a634aba1833b4827f1f3f261f2de6ef2c72625fc2891df
      OPS_RUNTIME_FP: 1b3056d4127919c2156be9f7fbb57f9b5e5c98e3458e216398db1b0a44a3ab34
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      M3U8_SHA: 22247609c95e1c2bf5a85e81c6ebb2c8caac3f6b
      M3U8_TAG: v1.25.30
      M3U8_ASSET: vf-tools-m3u8_V1.25.30.zip
      M3U8_BYTES: '3583558'
      M3U8_ASSET_SHA: 8426926e2781603ff0be1d5cd6b5352606be507150d808f2dc156834c5ec1711
      M3U8_RUNTIME_FP: 041b21c5f40bf62ac524f0847f43cdfd077e57cf23c5f14fa5bbff1e0ae29ddd
    steps:
      - name: Audit exact releases, manifests, delivered packages, visible UI and update ownership
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          echo 'AUDIT_MODE=FINAL_NO_RELEASE_READ_ONLY_V2 WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          rm -rf /tmp/s01-v2-theme /tmp/s01-v2-ops /tmp/s01-v2-m3u8 /tmp/s01-v2-updates "$RUNNER_TEMP/s01-v2-assets"
          mkdir -p "$RUNNER_TEMP/s01-v2-assets/theme" "$RUNNER_TEMP/s01-v2-assets/ops" "$RUNNER_TEMP/s01-v2-assets/m3u8"

          clone_exact(){ repo="$1" sha="$2" dst="$3"; git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${repo}.git" "$dst"; git -C "$dst" checkout -q "$sha"; test "$(git -C "$dst" rev-parse HEAD)" = "$sha"; }
          clone_exact "$THEME_REPO" "$THEME_SHA" /tmp/s01-v2-theme
          clone_exact "$OPS_REPO" "$OPS_SHA" /tmp/s01-v2-ops
          clone_exact "$M3U8_REPO" "$M3U8_SHA" /tmp/s01-v2-m3u8
          clone_exact "$UPDATES_REPO" "$UPDATES_SHA" /tmp/s01-v2-updates

          remote_head(){ git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/$1.git" refs/heads/main | awk '{print $1}'; }
          test "$(remote_head "$THEME_REPO")" = "$THEME_SHA"
          test "$(remote_head "$OPS_REPO")" = "$OPS_SHA"
          test "$(remote_head "$M3U8_REPO")" = "$M3U8_SHA"
          test "$(remote_head "$UPDATES_REPO")" = "$UPDATES_SHA"
          echo 'MAIN_IDENTITY=PASS'

          c01=/tmp/s01-v2-updates/projects/S01-C01.json
          c02=/tmp/s01-v2-updates/projects/S01-C02.json
          c03=/tmp/s01-v2-updates/projects/S01-C03.json
          jq -e --arg sha "$THEME_ASSET_SHA" --arg fp "$THEME_RUNTIME_FP" '(.target_version=="1.35.22") and (.release_tag=="v1.35.22") and (.asset_name=="vf-tools-theme_V1.35.22.zip") and (.asset_bytes==1811370) and (.asset_sha256==$sha) and (.runtime_files==446) and (.runtime_fingerprint==$fp) and ((.notes|contains("Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS")))' "$c01" >/dev/null
          jq -e --arg sha "$OPS_ASSET_SHA" --arg fp "$OPS_RUNTIME_FP" '(.target_version=="1.21.859") and (.release_tag=="v1.21.859") and (.asset_name=="vf-tools-ops_V1.21.859.zip") and (.asset_bytes==3362261) and (.asset_sha256==$sha) and (.runtime_files==934) and (.runtime_fingerprint==$fp) and (.schema_from=="6.0.0") and (.schema_to=="6.0.0") and (.physical_locator=="vf-ops/vf-ops.php") and (.plugin_file=="vf-ops/vf-ops.php") and (.locator_cutover==false) and ((.notes|contains("Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS")))' "$c02" >/dev/null
          jq -e --arg sha "$M3U8_ASSET_SHA" --arg fp "$M3U8_RUNTIME_FP" '(.target_version=="1.25.30") and (.release_tag=="v1.25.30") and (.asset_name=="vf-tools-m3u8_V1.25.30.zip") and (.asset_bytes==3583558) and (.asset_sha256==$sha) and (.runtime_files==559) and (.runtime_fingerprint==$fp) and (.schema_from=="1.3.0") and (.schema_to=="1.3.0") and (.physical_locator=="vf-tool-m3u8/vf-tool-m3u8.php") and (.plugin_file=="vf-tool-m3u8/vf-tool-m3u8.php") and (.locator_cutover==false) and ((.notes|contains("M3U8 migration remains CLOSED"))) and ((.notes|contains("Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS")))' "$c03" >/dev/null
          test "$(git -C /tmp/s01-v2-updates rev-parse HEAD:projects/S01-C01.json)" = fac7996168ae4b5e2d34bcc619a20981b9610271
          test "$(git -C /tmp/s01-v2-updates rev-parse HEAD:projects/S01-C02.json)" = ad257e7d30c50f7ab84d15118dbb56bd15bc741d
          test "$(git -C /tmp/s01-v2-updates rev-parse HEAD:projects/S01-C03.json)" = cb805b37c730b386702be8edc16b70196688689a
          echo 'MANIFEST_AUTHORITY=PASS'

          check_release(){
            repo="$1" tag="$2" source="$3" asset="$4" bytes="$5" sha="$6" outdir="$7" rid="$8" aid="$9"
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$source"
            json="$(gh api "repos/$repo/releases/tags/$tag")"
            test "$(printf '%s' "$json" | jq -r '.id')" = "$rid"
            test "$(printf '%s' "$json" | jq -r '.draft')" = false
            test "$(printf '%s' "$json" | jq -r '.prerelease')" = false
            test "$(printf '%s' "$json" | jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.id')" = "$aid"
            test "$(printf '%s' "$json" | jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.size')" = "$bytes"
            digest="$(printf '%s' "$json" | jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.digest // empty')"
            if [ -n "$digest" ]; then test "$digest" = "sha256:$sha"; fi
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$outdir"
            file="$outdir/$asset"
            test "$(stat -c %s "$file")" = "$bytes"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$sha"
          }
          check_release "$THEME_REPO" "$THEME_TAG" "$THEME_SHA" "$THEME_ASSET" "$THEME_BYTES" "$THEME_ASSET_SHA" "$RUNNER_TEMP/s01-v2-assets/theme" 384589248 550206244
          check_release "$OPS_REPO" "$OPS_TAG" "$OPS_SHA" "$OPS_ASSET" "$OPS_BYTES" "$OPS_ASSET_SHA" "$RUNNER_TEMP/s01-v2-assets/ops" 384607276 550243201
          check_release "$M3U8_REPO" "$M3U8_TAG" "$M3U8_SHA" "$M3U8_ASSET" "$M3U8_BYTES" "$M3U8_ASSET_SHA" "$RUNNER_TEMP/s01-v2-assets/m3u8" 384636069 550298780
          echo 'RELEASE_AUTHORITY=PASS'

          theme_zip="$RUNNER_TEMP/s01-v2-assets/theme/$THEME_ASSET"
          ops_zip="$RUNNER_TEMP/s01-v2-assets/ops/$OPS_ASSET"
          m3u8_zip="$RUNNER_TEMP/s01-v2-assets/m3u8/$M3U8_ASSET"
          unzip -tq "$theme_zip" >/dev/null
          unzip -tq "$ops_zip" >/dev/null
          unzip -tq "$m3u8_zip" >/dev/null
          unzip -Z1 "$theme_zip" | grep -E '/assets/css/admin/admin-update-center-console-v2\.css$' >/dev/null
          unzip -p "$theme_zip" "*/assets/css/admin/admin-update-center-console-v2.css" | grep -F '.vf-update-center__hero' >/dev/null
          unzip -Z1 "$ops_zip" | grep -Fx 'vf-ops/vf-ops.php' >/dev/null
          unzip -p "$ops_zip" vf-ops/vf-ops.php | grep -F 'Version: 1.21.859' >/dev/null
          unzip -Z1 "$m3u8_zip" | grep -Fx 'vf-tool-m3u8/vf-tool-m3u8.php' >/dev/null
          unzip -Z1 "$m3u8_zip" | grep -Fx 'vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css' >/dev/null
          unzip -p "$m3u8_zip" vf-tool-m3u8/admin/ui-v4/phase4-component-workspace.css | grep -F '.vf-m3u8-v6-dashboard__hero' >/dev/null
          echo 'DELIVERED_PACKAGE_UI_AND_LOCATORS=PASS'

          theme=/tmp/s01-v2-theme
          test "$(tr -d '\r\n' < "$theme/VERSION")" = 1.35.22
          grep -F 'PHP_INT_MAX' "$theme/src/inc/admin/admin-s01-uiux-polish.php" >/dev/null
          grep -F 'admin-update-center-console-v2.css' "$theme/src/inc/admin/admin-s01-uiux-polish.php" >/dev/null
          grep -F '.vf-update-center__hero' "$theme/src/assets/css/admin/admin-update-center-console-v2.css" >/dev/null
          grep -F '.vf-update-center__summary' "$theme/src/assets/css/admin/admin-update-center-console-v2.css" >/dev/null
          grep -F '@media (max-width:782px)' "$theme/src/assets/css/admin/admin-update-center-console-v2.css" >/dev/null
          owner="$theme/src/inc/update/class-vf-wp-update-admin-v1.php"
          grep -F 'add_management_page(' "$owner" >/dev/null
          grep -F "'VF 在线更新'" "$owner" >/dev/null
          grep -F "'vf-private-updates'" "$owner" >/dev/null
          grep -RFl --include='*.php' 'add_theme_page(' "$theme/src/inc" | head -n1 >/dev/null
          echo 'THEME_VISIBLE_UI_AND_UPDATE_OWNER=PASS'

          ops=/tmp/s01-v2-ops
          test "$(tr -d '\r\n' < "$ops/VERSION")" = 1.21.859
          php "$ops/tests/dashboard-visible-ui-contract.php"
          grep -F '.vf-v658-hero' "$ops/assets/css/current/admin-current-dashboard.css" >/dev/null
          grep -F '.vf-v658-focus' "$ops/assets/css/current/admin-current-dashboard.css" >/dev/null
          grep -F '.vf-v658-primary-action' "$ops/assets/css/current/admin-current-dashboard.css" >/dev/null
          grep -F 'prefers-reduced-motion' "$ops/assets/css/current/admin-current-dashboard.css" >/dev/null
          ops_update="$ops/includes/wp-update/class-vf-ops-update-admin-v1.php"
          grep -F 'add_management_page(' "$ops_update" >/dev/null
          grep -F "remove_submenu_page('tools.php', 'vf-ops-updates')" "$ops_update" >/dev/null
          grep -F "tools.php?page=vf-private-updates" "$ops_update" >/dev/null
          echo 'OPS_VISIBLE_UI_AND_HIDDEN_LEGACY_ROUTE=PASS'

          m3u8=/tmp/s01-v2-m3u8
          test "$(tr -d '\r\n' < "$m3u8/VERSION")" = 1.25.30
          php "$m3u8/tests/provider-dashboard-visible-ui-contract.php"
          php "$m3u8/tests/frontend-s01-uiux-final-owner-contract.php"
          grep -F 'Provider 工作台' "$m3u8/src/admin/Controller/class-v6-provider-operations-controller.php" >/dev/null
          grep -F '当前下一步' "$m3u8/src/admin/Controller/class-v6-provider-operations-controller.php" >/dev/null
          grep -F '.vf-m3u8-v6-dashboard__hero' "$m3u8/src/admin/ui-v4/phase4-component-workspace.css" >/dev/null
          m3u8_update="$m3u8/src/includes/update/class-vf-m3u8-update-admin-v1.php"
          grep -F "remove_submenu_page('tools.php', 'vf-m3u8-updates')" "$m3u8_update" >/dev/null
          grep -F "tools.php?page=vf-private-updates" "$m3u8_update" >/dev/null
          echo 'M3U8_VISIBLE_UI_AND_HIDDEN_LEGACY_ROUTE=PASS'

          echo 'NORMAL_USER_VISIBLE_UPDATE_MENU_COUNT=1'
          echo 'NORMAL_USER_UPDATE_ENTRY=Tools -> VF 在线更新'
          echo 'THEME=1.35.22 OPS=1.21.859 M3U8=1.25.30'
          echo 'OPS_SCHEMA=6.0.0 OPS_LOCATOR=vf-ops/vf-ops.php OPS_LOCATOR_CUTOVER=false'
          echo 'M3U8_SCHEMA=1.3.0 M3U8_LOCATOR=vf-tool-m3u8/vf-tool-m3u8.php M3U8_LOCATOR_CUTOVER=false M3U8_MIGRATION=CLOSED'
          echo 'PRODUCTION=NOT_RUN STATIC=NOT_RUN ONLINE=NOT_RUN FINAL_ONLINE_PASS=NOT_CLAIMED'
          echo 'PASS_S01_FINAL_NO_RELEASE_CROSS_COMPONENT_AUDIT_V2'
