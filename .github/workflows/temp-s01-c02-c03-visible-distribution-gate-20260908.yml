name: temp-s01-c02-c03-visible-distribution-gate-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-c02-c03-visible-distribution-gate-20260908.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BASE: 94831d106e2868d448b84c0b5169f4b92d1e56c4
      CORE_CANDIDATE: 658edd8afebb2106371ee58053791e6fad883664
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 7a0948791a69f62f603de0d187e384c279215536
      OPS_TAG: v1.21.860
      OPS_ASSET: vf-tools-ops_V1.21.860.zip
      OPS_BYTES: '3364996'
      OPS_ASSET_SHA: aa8db19e25708527d3c6f8b6457f563472d2abe4f81d86f87b2882b0b8b814ba
      OPS_RUNTIME_FP: c95f44b6b796a601aaf000315917d9a80b027b4df4abfae207e3fee549b66b91
      M3_REPO: llhzx2018/vf-tools-m3u8
      M3_SHA: c1c682a69ef34d0eca16a5ad1f2db5bd052775bd
      M3_TAG: v1.25.31
      M3_ASSET: vf-tools-m3u8_V1.25.31.zip
      M3_BYTES: '3587176'
      M3_ASSET_SHA: 48d2f32bc534a8b3514c2df741b866a8b47cf37e98c63a3f8b049020b6097d5f
      M3_RUNTIME_FP: 5cd181d7cba7a5471c54d652cc074f349792ae44340496e5c0366d152decc433
    steps:
      - name: Gate exact manifests against exact delivered releases
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'DISTRIBUTION_GATE_ONLY=YES CORE_MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          test "$(gh api repos/$CORE_REPO/branches/main --jq '.commit.sha')" = "$CORE_BASE"
          rm -rf /tmp/core-dist-gate
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${CORE_REPO}.git" /tmp/core-dist-gate
          cd /tmp/core-dist-gate
          git checkout -q "$CORE_CANDIDATE"
          test "$(git rev-parse HEAD)" = "$CORE_CANDIDATE"
          changed="$(git diff --name-only "$CORE_BASE" "$CORE_CANDIDATE" | sort)"
          test "$changed" = $'projects/S01-C02.json\nprojects/S01-C03.json'
          test "$(git rev-parse "$CORE_CANDIDATE:projects/S01-C01.json")" = fac7996168ae4b5e2d34bcc619a20981b9610271
          jq -e '
            .component_id=="S01-C02" and .package_slug=="vf-ops" and
            .plugin_file=="vf-ops/vf-ops.php" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and
            .target_version=="1.21.860" and .release_tag=="v1.21.860" and .asset_name=="vf-tools-ops_V1.21.860.zip" and
            .asset_bytes==3364996 and .asset_sha256=="aa8db19e25708527d3c6f8b6457f563472d2abe4f81d86f87b2882b0b8b814ba" and
            .schema_from=="6.0.0" and .schema_to=="6.0.0" and
            .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and .runtime_files==935 and .runtime_file_count==935 and
            .runtime_fingerprint=="c95f44b6b796a601aaf000315917d9a80b027b4df4abfae207e3fee549b66b91" and .runtime_fingerprint_sha256=="c95f44b6b796a601aaf000315917d9a80b027b4df4abfae207e3fee549b66b91" and
            (.from_versions|index("1.21.859")!=null)
          ' projects/S01-C02.json >/dev/null
          jq -e '
            .component_id=="S01-C03" and .package_slug=="vf-tool-m3u8" and
            .plugin_file=="vf-tool-m3u8/vf-tool-m3u8.php" and .physical_locator=="vf-tool-m3u8/vf-tool-m3u8.php" and .locator_cutover==false and
            .target_version=="1.25.31" and .release_tag=="v1.25.31" and .asset_name=="vf-tools-m3u8_V1.25.31.zip" and
            .asset_bytes==3587176 and .asset_sha256=="48d2f32bc534a8b3514c2df741b866a8b47cf37e98c63a3f8b049020b6097d5f" and
            .schema_from=="1.3.0" and .schema_to=="1.3.0" and
            .runtime_contract=="VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1" and .runtime_files==560 and .runtime_file_count==560 and
            .runtime_fingerprint=="5cd181d7cba7a5471c54d652cc074f349792ae44340496e5c0366d152decc433" and .runtime_fingerprint_sha256=="5cd181d7cba7a5471c54d652cc074f349792ae44340496e5c0366d152decc433" and
            (.from_versions|index("1.25.30")!=null)
          ' projects/S01-C03.json >/dev/null
          grep -F 'Delivered Runtime Authority 34249246282 PASS' projects/S01-C02.json >/dev/null
          grep -F 'Delivered Runtime Authority 34249074120 PASS' projects/S01-C03.json >/dev/null
          grep -F 'Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS' projects/S01-C02.json >/dev/null
          grep -F 'Publication does not claim Production, Static, Online or FINAL_ONLINE_PASS' projects/S01-C03.json >/dev/null
          test "$(gh api repos/$OPS_REPO/git/ref/tags/$OPS_TAG --jq '.object.sha')" = "$OPS_SHA"
          ops_rel="$(gh api repos/$OPS_REPO/releases/tags/$OPS_TAG)"
          test "$(jq -r '.draft' <<<"$ops_rel")" = false; test "$(jq -r '.prerelease' <<<"$ops_rel")" = false
          test "$(jq -r --arg a "$OPS_ASSET" '.assets[]|select(.name==$a)|.size' <<<"$ops_rel")" = "$OPS_BYTES"
          test "$(jq -r --arg a "$OPS_ASSET" '.assets[]|select(.name==$a)|.digest' <<<"$ops_rel")" = "sha256:$OPS_ASSET_SHA"
          test "$(gh api repos/$M3_REPO/git/ref/tags/$M3_TAG --jq '.object.sha')" = "$M3_SHA"
          m3_rel="$(gh api repos/$M3_REPO/releases/tags/$M3_TAG)"
          test "$(jq -r '.draft' <<<"$m3_rel")" = false; test "$(jq -r '.prerelease' <<<"$m3_rel")" = false
          test "$(jq -r --arg a "$M3_ASSET" '.assets[]|select(.name==$a)|.size' <<<"$m3_rel")" = "$M3_BYTES"
          test "$(jq -r --arg a "$M3_ASSET" '.assets[]|select(.name==$a)|.digest' <<<"$m3_rel")" = "sha256:$M3_ASSET_SHA"
          echo 'C01_UNCHANGED=PASS C02_RELEASE_MATCH=PASS C03_RELEASE_MATCH=PASS RUNTIME_AUTHORITY_REFERENCES=PASS'
          echo 'PASS_S01_C02_C03_VISIBLE_DISTRIBUTION_GATE'
