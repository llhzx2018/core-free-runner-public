name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-guides183-20261024]
    paths: ['.github/workflows/s01-guides183-20261024-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.183
  TARGET_SHA: ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c
  UPDATE_SHA: 952013a186b6c458364f8a5ac9c530c764767733
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 952013a186b6c458364f8a5ac9c530c764767733
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='a219ab710ff1f80d4dd521a37d4a021c6475e6342d44997e7995a70350577cdb' and m['asset_bytes']==1986425
          assert m['runtime_files']==476 and '1.35.182' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
