name: p01-r3-batch-a-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r3-batch-a-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 893d39eda580db627d78a5de320d2617739b92aa
      TARGET_SHA: 302ffba48df578916920c2a425d1f17056e77ec0
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_R3_A_EXACT_SOURCES=PASS

      - name: Focused Batch A tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd current
          tests=(
            tests/unit/full_surface_governance_category_stability_runtime.php
            tests/unit/advanced_manager_daily_entry_contract.php
            tests/unit/operation_history_reachability_contract.php
            tests/unit/pending_inbox_presentation_contract.php
            tests/unit/public_brand_route_contract.php
            tests/unit/six_resource_admin_manager_contract.php
            tests/unit/six_resource_frontend_admin_bridge_contract.php
            tests/unit/link_health_peer_parity_contract.php
          )
          for t in "${tests[@]}"; do
            echo "RUN=$t"
            php "$t"
          done
          echo P01_R3_A_FOCUSED=PASS

      - name: Canonical debt comparison
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_BASELINE_FAILURE_COUNT=109$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=101$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_RESOLVED_DEBT_COUNT=8$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CHANGED_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_UNIT_REGRESSION=PASS$' /tmp/canonical.txt
          echo P01_R3_A_CANONICAL=PASS

      - name: Runtime source unchanged by batch
        shell: bash
        run: |
          set -Eeuo pipefail
          diff -qr baseline/src current/src
          test "$(cat current/VERSION)" = "2.47.41"
          test -z "$(git -C current status --porcelain)"
          echo P01_R3_A_RUNTIME_UNCHANGED=PASS
