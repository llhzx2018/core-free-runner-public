name: P01 D14 actual Nginx TLS PHP-FPM native three-engine clean FULL (temporary)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actual-full-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm exact test route and synthetic-only data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d14-full-fpm-three-engine-20261112"
          echo "P01_D14_SCOPE=ISOLATED_EPHEMERAL_FULL_AND_LOCAL_SQL_CONTAINERS"
          echo "P01_D14_PRODUCTION_WRITES=NO"

      - name: Check registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo "P01_D14_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Read exact private candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 43bc63e428b9324afa5678b436a489dcabf25766
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Exact Git identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "43bc63e428b9324afa5678b436a489dcabf25766"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d76_deep_business.py
          php8.3 -l candidate/src/app/CoursePackageStore.php
          test -f candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo "P01_D14_EXACT_PRIVATE_HEAD=43bc63e428b9324afa5678b436a489dcabf25766"

      - name: Prepare isolated actual PHP-FPM Nginx and composer build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3             php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip composer             openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v openssl
          node --version
          npm --version
          php -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(2);'
          php8.3 -l candidate/src/app/next/http/OwnerLoginRoutes.php
          php8.3 -l candidate/src/app/next/runtime/CloudPanelWorkbenchAssets.php
          php8.3 -l candidate/src/app/next/runtime/OwnerWorkbenchAssets.php
          php8.3 -l candidate/src/app/OwnerCatalogMetadata.php
          php8.3 -l candidate/src/app/ToolSceneDetail.php
          php8.3 -l candidate/src/app/NewsFeedService.php
          php8.3 -l candidate/src/app/next/OwnerToolboxManager.php
          php8.3 -l candidate/src/app/next/OwnerPersonalCatalog.php
          php8.3 -l candidate/src/app/next/http/OwnerHttpRoutes.php
          php8.3 -r 'require "candidate/src/app/OwnerCatalogMetadata.php"; if(count(VfOwnerCatalogMetadata::toolSceneDefinitions())!==6||count(VfOwnerCatalogMetadata::newsSourceDefinitions())!==9)exit(17);'
          echo "P01_D75_SHARED_TOOL_NEWS_SINGLE_SOURCE_METADATA=PASS"
          echo "P01_D14_REAL_FPM_NGINX_PDO_AVAILABLE=PASS"

      - name: Build exact-source real self-contained future FULL once
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha 43bc63e428b9324afa5678b436a489dcabf25766             --output "$RUNNER_TEMP/p01-d14-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/p01-d14-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d14-full.zip" \
            --output "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          echo "P01_D74_EXACT_SOURCE_REAL_CLOUDPANEL_ZIP=PASS"

      - name: Validate real Nginx TLS and PHP-FPM SQLite clean FULL browser HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine sqlite
          echo "P01_D14_SQLITE_REAL_FPM_FULL=PASS"

      - name: Validate real MariaDB 11.8 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine mariadb
          echo "P01_D14_MARIADB_REAL_FPM_FULL=PASS"

      - name: Validate real MySQL 8.4 FPM clean FULL and Owner
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip" --engine mysql
          echo "P01_D14_MYSQL_REAL_FPM_FULL=PASS"

      - name: Private source and generated ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d14-full.zip" "$RUNNER_TEMP/p01-d14-cloudpanel-full.zip"
          echo "P01_D14_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D14_TEST_ZIP_PERSISTED=NO"

  shared-metadata-legacy-parity:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify the fixed registered public safe and exact private test scope
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d14-full-fpm-three-engine-20261112"
          test -n "$PRIVATE_READ"
          echo "P01_D75_SHARED_LEGACY_PHP_SCOPE=EXACT_SOURCE_ONLY"
      - name: Checkout private exact current P01 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 43bc63e428b9324afa5678b436a489dcabf25766
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Execute real legacy PHP canonical metadata parity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "43bc63e428b9324afa5678b436a489dcabf25766"
          php -l candidate/src/app/OwnerCatalogMetadata.php
          php -l candidate/src/app/ToolSceneDetail.php
          php -l candidate/src/app/NewsFeedService.php
          php -l candidate/src/app/NewsFeedNormalizer.php
          php -r '
            require "candidate/src/app/OwnerCatalogMetadata.php";
            require "candidate/src/app/ToolSceneDetail.php";
            require "candidate/src/app/NewsFeedService.php";
            $tools=VfToolSceneDetail::defaultSceneDefinitions();
            if($tools!==VfOwnerCatalogMetadata::toolSceneDefinitions() || count($tools)!==6)exit(21);
            $raw=VfOwnerCatalogMetadata::newsSourceDefinitions();
            $public=VfNewsFeedService::sources();
            if(count($raw)!==9 || count($public)!==count($raw))exit(22);
            foreach($raw as $id=>$source){
              if(($public[$id]["name"]??null)!==$source["name"]
                || ($public[$id]["category"]??null)!==$source["category"])exit(23);
              if(isset($source["feed"])){
                $selected=VfNewsFeedService::fixedFeedEndpoint($id);
                if($selected["url"]!==$source["feed"]||$selected["ttl"]!==$source["ttl"])exit(24);
              }
            }
          '
          echo "P01_D75_LEGACY_AND_NEW_TOOL_NEWS_SOURCE_PARITY=PASS"
          echo "P01_D75_LEGACY_SOURCE_DEFINITION_NO_DRIFT=PASS"
      - name: Remove private test checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          echo "P01_D75_LEGACY_PRIVATE_SOURCE_PERSISTED=NO"
