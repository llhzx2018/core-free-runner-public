name: TEMP P07 private-safe SQL shape probe offline gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/p07-sql-shape-probe-v1.py'
      - '.github/workflows/p07-sql-shape-probe-gate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P07 release97 parser without production data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 8b037df9e993d4d5dc9b48feadf7653079825bdb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-p07
      - name: Pure synthetic schema parsing and private redaction proof
        shell: bash
        env:
          PYTHONPATH: transient-p07/lib:transient-p07
        run: |
          set -Eeuo pipefail
          python3 -m py_compile experiments/p07-sql-shape-probe-v1.py
          python3 - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import gzip,importlib.util,io,contextlib
          from tests.test_cross_engine_sql_format import SOURCE,TARGET
          spec=importlib.util.spec_from_file_location("probe",Path("experiments/p07-sql-shape-probe-v1.py"))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with TemporaryDirectory() as temp:
              src,dst=Path(temp)/"source.sql.gz",Path(temp)/"target.sql.gz"
              for path,content in ((src,SOURCE),(dst,TARGET)):
                  with gzip.open(path,"wt",encoding="utf-8") as f:f.write(content)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              summary=out.getvalue()
              assert "CREATE_TABLE_MISMATCHES=0:1" in summary,summary
              assert "PROBE_REDACTED=YES" in summary
              assert "single quote" not in summary and "demo" not in summary
              assert "value" not in summary and "t0" not in summary
              changed=TARGET.replace("idx_value","SECRET_INDEX")
              with gzip.open(dst,"wt",encoding="utf-8") as f:f.write(changed)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              summary=out.getvalue()
              assert "CREATE_TABLE_MISMATCHES=1:1" in summary,summary
              assert "SECRET_INDEX" not in summary and "single quote" not in summary
              # Distinguish inherited charset and quoted DECIMAL defaults
              source_shape=SOURCE.replace(
                  "  PRIMARY KEY", 
                  "  `PRIVATE_COLUMN` varchar(80) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci,\n"
                  "  `PRIVATE_AMOUNT` decimal(9,2) DEFAULT '0.00',\n"
                  "  PRIMARY KEY",
              )
              target_shape=TARGET.replace(
                  "  PRIMARY KEY",
                  "  `PRIVATE_COLUMN` varchar(80),\n"
                  "  `PRIVATE_AMOUNT` decimal(9,2) DEFAULT 0.00,\n"
                  "  PRIMARY KEY",
              )
              for path,content in ((src,source_shape),(dst,target_shape)):
                  with gzip.open(path,"wt",encoding="utf-8") as f:f.write(content)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              shape=out.getvalue()
              assert "EXPLICIT_CHARSET_STATUS=EFFECTIVE_CHARSET_COLLATION_EQUAL:1" in shape,shape
              assert "EXPLICIT_CHARSET_TYPES=VARCHAR:1" in shape,shape
              assert "NUMERIC_DEFAULT_STATUS=NUMERIC_EXACT:1" in shape,shape
              assert "PRIVATE_COLUMN" not in shape and "PRIVATE_AMOUNT" not in shape
              source_shape=source_shape.replace(
                  "varchar(80) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci",
                  "varchar(80) CHARACTER SET latin1 COLLATE utf8mb4_unicode_ci",
              )
              target_shape=target_shape.replace("DEFAULT 0.00", "DEFAULT 1.00")
              for path,content in ((src,source_shape),(dst,target_shape)):
                  with gzip.open(path,"wt",encoding="utf-8") as f:f.write(content)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              bad=out.getvalue()
              assert "TABLE_OR_EXPLICIT_DIFFER:1" in bad,bad
              assert "NUMERIC_DEFAULT_STATUS=UNPROVEN:1" in bad,bad
              assert "PRIVATE_COLUMN" not in bad and "PRIVATE_AMOUNT" not in bad
              # Guard syntax never emits user-defined variable names or string literals.
              guard_source=SOURCE + "/*!80000 SET @PRIVATE_PASSWORD = 'secret-string' */;\n" + "/*!80000 PRIVATE_ROUTINE SECRET_IDENTIFIER */;\n"
              for path,content in ((src,guard_source),(dst,TARGET)):
                  with gzip.open(path,"wt",encoding="utf-8") as f:f.write(content)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              redacted=out.getvalue()
              assert "UNKNOWN_SET_GRAMMAR_SOURCE_1=" in redacted,redacted
              assert "OTHER_GUARD_GRAMMAR_SOURCE_1=" in redacted,redacted
              for secret in ("PRIVATE_PASSWORD", "PRIVATE_ROUTINE", "SECRET_IDENTIFIER", "secret-string"):
                  assert secret not in redacted
              # Prepared SQL is NOT treated as harmless metadata. Redacted
              # branch-verb classification preserves the DDL risk signal.
              dynamic=SOURCE + (
                  "/*!50003 SET @PRIVATE_SQL = IF(@PRIVATE_FLAG, "
                  "'ALTER TABLE SECRET_TABLE ADD COLUMN TOPSECRET INT', 'SELECT 1') */;\n"
                  "/*!50003 PREPARE private_stmt FROM @PRIVATE_SQL */;\n"
                  "/*!50003 EXECUTE private_stmt */;\n"
                  "/*!50003 DEALLOCATE PREPARE private_stmt */;\n"
              )
              for path,content in ((src,dynamic),(dst,TARGET)):
                  with gzip.open(path,"wt",encoding="utf-8") as f:f.write(content)
              out=io.StringIO()
              with contextlib.redirect_stdout(out):module.summary(src,dst)
              parsed=out.getvalue()
              assert "DYNAMIC_BRANCH_VERBS_SOURCE=ALTER:1 SELECT:1" in parsed,parsed
              assert "SET_IF:1" in parsed and "PREPARE:1" in parsed and "EXECUTE:1" in parsed,parsed
              assert "PREPARE_USES_SET_VAR:1" in parsed and "EXECUTE_PAIR_MATCH:1" in parsed,parsed
              assert "DEALLOCATE_PAIR_MATCH:1" in parsed,parsed
              for secret in ("PRIVATE_SQL", "PRIVATE_FLAG", "SECRET_TABLE", "TOPSECRET", "private_stmt"):
                  for line in parsed.splitlines():
                      assert secret not in line, "REDACTION_LEAK_FIXTURE_" + secret + "_AT_" + line.split("=",1)[0]
              print("P07_ANONYMIZED_SCHEMA_DIFF_PASS")
          PY
      - name: Ensure never stores production SQL or fixture remnants
        if: always()
        run: |
          test ! -e /opt/vf-server-ops
          echo P07_PROBE_OFFLINE_SCOPE_PASS
