name: P01 V2.22.1 Publication

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v221-publication-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  UPDATES_REPO: llhzx2018/core-updates
  RUNNER_REPO: llhzx2018/core-free-runner-public
  MAIN_COMMIT: 203d3c1236624ab846555167d217978694e11e88
  CANDIDATE: a31bafac5efc97efa537b645f03bc99ed0ea5b43
  CANDIDATE_TREE: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59
  SOURCE_COMMIT: 6bc09cd152210183972dcb3f2c361eb65a4cadab
  VERSION: 2.22.1
  SOURCE_VERSION: 2.21.25
  SCHEMA: '2026082801'
  SOURCE_SCHEMA: '2026080902'
  TAG: v2.22.1
  GATE_RUN_ID: '33144353246'
  ARTIFACT_ID: '9675179543'
  LEGACY_EXPECTED_BYTES: '1170499'
  LEGACY_EXPECTED_SHA: b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exact release source and main fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN_COMMIT"
          test "$(git -C product rev-parse "$MAIN_COMMIT^{tree}")" = "$CANDIDATE_TREE"
          git -C product cat-file -e "$CANDIDATE^{commit}"
          test "$(git -C product rev-parse "$CANDIDATE^{tree}")" = "$CANDIDATE_TREE"
          git -C product merge-base --is-ancestor "$CANDIDATE" "$MAIN_COMMIT"
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:VERSION"))" = "$VERSION"
          test "$(tr -d '\r\n' < <(git -C product show "$CANDIDATE:src/VERSION.txt"))" = "$VERSION"
          test "$(git -C product diff --name-only 2e75a2f62729d4cf01acabb6ff851ee05ac4c0e8 "$CANDIDATE" | sort | tr '\n' ' ')" = "VERSION src/VERSION.txt src/app/bootstrap.php "
          echo P01_V221_PUBLICATION_SOURCE_FENCE=PASS

      - name: Fetch exact verified candidate artifacts
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${RUNNER_REPO}/actions/runs/${GATE_RUN_ID}" >/tmp/p01-v221-gate.json
          test "$(jq -r '.status' /tmp/p01-v221-gate.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v221-gate.json)" = success
          gh api "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}" >/tmp/p01-v221-artifact-meta.json
          test "$(jq -r '.name' /tmp/p01-v221-artifact-meta.json)" = 'P01-V2.22.1-ONLINE-HOTFIX-CANDIDATE-V2'
          test "$(jq -r '.expired' /tmp/p01-v221-artifact-meta.json)" = false
          rm -rf /tmp/p01-v221-release /tmp/p01-v221-artifact.zip
          mkdir -p /tmp/p01-v221-release
          gh api --method GET "repos/${RUNNER_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/p01-v221-artifact.zip
          unzip -q /tmp/p01-v221-artifact.zip -d /tmp/p01-v221-release
          FULL="$(find /tmp/p01-v221-release -type f -name 'VF-Start-V2.22.1-FULL.zip' -print -quit)"
          UPDATE="$(find /tmp/p01-v221-release -type f -name 'VF-Start-V2.22.1-UPDATE.zip' -print -quit)"
          LEGACY="$(find /tmp/p01-v221-release -type f -name 'VF_Start_V2.22.1_UPDATE.zip' -print -quit)"
          REPAIR="$(find /tmp/p01-v221-release -type f -name 'server-update-v2.22.1-repair.php' -print -quit)"
          RESULT="$(find /tmp/p01-v221-release -type f -name 'P01-V2.22.1-ONLINE-HOTFIX-CANDIDATE-V2.json' -print -quit)"
          for f in "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$RESULT"; do test -f "$f"; done
          unzip -t "$FULL" >/dev/null; unzip -t "$UPDATE" >/dev/null; unzip -t "$LEGACY" >/dev/null
          test "$(unzip -Z1 "$LEGACY" | wc -l)" -eq 1
          unzip -Z1 "$LEGACY" | grep -Fxq 'repair-v2.22.1.php'
          LEGACY_SHA="$(sha256sum "$LEGACY" | awk '{print $1}')"; LEGACY_BYTES="$(stat -c %s "$LEGACY")"
          test "$LEGACY_SHA" = "$LEGACY_EXPECTED_SHA"
          test "$LEGACY_BYTES" = "$LEGACY_EXPECTED_BYTES"
          REPAIR_SHA="$(sha256sum "$REPAIR"|awk '{print $1}')"
          test "$(unzip -p "$LEGACY" repair-v2.22.1.php | sha256sum | awk '{print $1}')" = "$REPAIR_SHA"
          FULL_SHA="$(sha256sum "$FULL"|awk '{print $1}')"; UPDATE_SHA="$(sha256sum "$UPDATE"|awk '{print $1}')"
          FULL_BYTES="$(stat -c %s "$FULL")"; UPDATE_BYTES="$(stat -c %s "$UPDATE")"; REPAIR_BYTES="$(stat -c %s "$REPAIR")"; RESULT_BYTES="$(stat -c %s "$RESULT")"
          jq -e --arg c "$CANDIDATE" --arg t "$CANDIDATE_TREE" '.status=="PASS" and .candidate==$c and .candidate_tree==$t and .source_version=="2.21.25" and .target_version=="2.22.1" and .target_schema=="2026082801" and .seeded_highest_verified_release=="2.22.0" and .freshness_advance=="PASS" and .legacy_inner_repair=="repair-v2.22.1.php" and .owner_updater_prepare=="PASS" and .owner_updater_install=="PASS" and .data_preserve=="PASS" and .common_baseline=="PASS" and .production_write==false' "$RESULT" >/dev/null
          printf 'FULL_PATH=%s\nUPDATE_PATH=%s\nLEGACY_PATH=%s\nREPAIR_PATH=%s\nRESULT_PATH=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nLEGACY_SHA=%s\nREPAIR_SHA=%s\nFULL_BYTES=%s\nUPDATE_BYTES=%s\nLEGACY_BYTES=%s\nREPAIR_BYTES=%s\nRESULT_BYTES=%s\n' "$FULL" "$UPDATE" "$LEGACY" "$REPAIR" "$RESULT" "$FULL_SHA" "$UPDATE_SHA" "$LEGACY_SHA" "$REPAIR_SHA" "$FULL_BYTES" "$UPDATE_BYTES" "$LEGACY_BYTES" "$REPAIR_BYTES" "$RESULT_BYTES" >> "$GITHUB_ENV"
          echo P01_V221_EXACT_ARTIFACT=PASS

      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" >/tmp/p01-v221-tag.json 2>/dev/null; then
            test "$(jq -r '.object.sha' /tmp/p01-v221-tag.json)" = "$CANDIDATE"
          else
            gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$CANDIDATE" >/tmp/p01-v221-tag.json
            test "$(jq -r '.object.sha' /tmp/p01-v221-tag.json)" = "$CANDIDATE"
          fi
          cat >/tmp/p01-v221-notes.md <<'EOF'
          VF Start V2.22.1 是 V2.22.0 Multi-Surface 的在线升级兼容补丁版本。

          - 不改变 Multi-Surface 产品功能与 Schema；Schema 仍为 2026082801。
          - 原因：V2.21.25 客户端已记录原 V2.22.0 Manifest，不能在同一正式版本下静默替换更新资产。
          - 保留并尊重 anti-silent-replacement / Freshness Gate，不降低安全验证。
          - 正式版本前进到 V2.22.1，使已记住 V2.22.0 的客户端通过正常版本前进接受新 Manifest。
          - 机器已真实模拟 V2.21.25 + remembered V2.22.0 状态：check / prepare / install 全部 PASS。
          - 数据保留、SQLite/FK、Multi-Surface、Common Product Baseline 88/88 PASS，DRIFT 0 / UNKNOWN 0。
          - Machine Gate：33144353246 PASS。
          - 实际服务器 Production Runtime 升级仍由 VF Start 后台在线升级流程执行；本发布不会直接写入服务器。
          EOF
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            echo 'release already exists; refusing mutation' >&2
            exit 1
          fi
          gh release create "$TAG" "$FULL_PATH" "$UPDATE_PATH" "$LEGACY_PATH" "$REPAIR_PATH" "$RESULT_PATH" --repo "$PRODUCT_REPO" --title 'VF Start V2.22.1 · Online Updater Freshness Hotfix' --notes-file /tmp/p01-v221-notes.md --verify-tag
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/p01-v221-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v221-release.json)"; RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v221-release.json)"
          test "$(jq -r '.draft' /tmp/p01-v221-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v221-release.json)" = false
          for spec in "VF-Start-V2.22.1-FULL.zip:$FULL_BYTES" "VF-Start-V2.22.1-UPDATE.zip:$UPDATE_BYTES" "VF_Start_V2.22.1_UPDATE.zip:$LEGACY_BYTES" "server-update-v2.22.1-repair.php:$REPAIR_BYTES" "P01-V2.22.1-ONLINE-HOTFIX-CANDIDATE-V2.json:$RESULT_BYTES"; do n="${spec%%:*}"; b="${spec##*:}"; test "$(jq -r --arg n "$n" '.assets[]|select(.name==$n)|.size' /tmp/p01-v221-release.json)" = "$b"; done
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\n' "$RELEASE_ID" "$RELEASED_AT" >> "$GITHUB_ENV"
          echo P01_V221_GITHUB_RELEASE=PASS

      - name: Remote release byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v221-remote && mkdir -p /tmp/p01-v221-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v221-remote --pattern 'VF-Start-V2.22.1-FULL.zip' --pattern 'VF-Start-V2.22.1-UPDATE.zip' --pattern 'VF_Start_V2.22.1_UPDATE.zip' --pattern 'server-update-v2.22.1-repair.php' --pattern 'P01-V2.22.1-ONLINE-HOTFIX-CANDIDATE-V2.json'
          test "$(sha256sum /tmp/p01-v221-remote/VF-Start-V2.22.1-FULL.zip|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v221-remote/VF-Start-V2.22.1-UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v221-remote/VF_Start_V2.22.1_UPDATE.zip|awk '{print $1}')" = "$LEGACY_SHA"
          test "$(sha256sum /tmp/p01-v221-remote/server-update-v2.22.1-repair.php|awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="PASS" and .owner_updater_install=="PASS"' /tmp/p01-v221-remote/P01-V2.22.1-ONLINE-HOTFIX-CANDIDATE-V2.json >/dev/null
          echo P01_V221_REMOTE_RELEASE_ASSETS=PASS

      - name: Publish core-updates P01 V2.22.1 channel
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path('updates/projects/P01.json'); d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version'))!='2.22.0': raise SystemExit('unexpected current P01 update target')
          d.update({
            'target_version':'2.22.1','update_type':'ATOMIC','from_versions':['2.21.25'],
            'schema_from':'2026080902','schema_to':'2026082801','repository':'llhzx2018/vf-start','release_tag':'v2.22.1',
            'asset_name':'VF_Start_V2.22.1_UPDATE.zip','asset_bytes':int(os.environ['LEGACY_BYTES']),'asset_sha256':os.environ['LEGACY_SHA'],
            'release_id':int(os.environ['RELEASE_ID']),'release_identity':'v2.22.1@a31bafac5efc97efa537b645f03bc99ed0ea5b43',
            'backup_required':True,'rollback_supported':True,'released_at':os.environ['RELEASED_AT'],'minimum_php':'8.0.0'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          git -C updates commit -m 'release(P01): publish VF Start V2.22.1 update channel'
          for i in 1 2 3; do if git -C updates push origin main; then break; fi; git -C updates pull --rebase origin main; test "$i" -lt 3; done
          git -C updates pull --ff-only origin main
          jq -e --arg sha "$LEGACY_SHA" --argjson bytes "$LEGACY_BYTES" --argjson rid "$RELEASE_ID" '.project_id=="P01" and .component_id=="APP" and .target_version=="2.22.1" and .release_tag=="v2.22.1" and .asset_name=="VF_Start_V2.22.1_UPDATE.zip" and .asset_sha256==$sha and .asset_bytes==$bytes and .release_id==$rid and .release_identity=="v2.22.1@a31bafac5efc97efa537b645f03bc99ed0ea5b43" and .schema_to=="2026082801"' updates/projects/P01.json >/dev/null
          UPDATE_COMMIT="$(git -C updates rev-parse HEAD)"
          printf 'UPDATE_COMMIT=%s\n' "$UPDATE_COMMIT" >> "$GITHUB_ENV"
          echo P01_V221_CORE_UPDATES=PASS

      - name: Final remote publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')" = "$CANDIDATE"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" >/tmp/p01-v221-final-release.json
          test "$(jq -r '.id' /tmp/p01-v221-final-release.json)" = "$RELEASE_ID"
          gh api "repos/${UPDATES_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/p01-v221-final-manifest.json
          jq -e --arg sha "$LEGACY_EXPECTED_SHA" --argjson bytes "$LEGACY_EXPECTED_BYTES" '.target_version=="2.22.1" and .release_tag=="v2.22.1" and .asset_name=="VF_Start_V2.22.1_UPDATE.zip" and .asset_sha256==$sha and .asset_bytes==$bytes and .release_identity=="v2.22.1@a31bafac5efc97efa537b645f03bc99ed0ea5b43"' /tmp/p01-v221-final-manifest.json >/dev/null
          echo "P01_V221_PUBLICATION=PASS release_id=$RELEASE_ID core_updates=$UPDATE_COMMIT production_write=false"
