name: TEMP P08 affected legacy regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-legacy-regression-20261126.yml'
permissions:
  contents: read
concurrency:
  group: p08-legacy-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: b66dedb00ea99f6eed01ab5de7a28ff7c552712c
  TARGET_TREE: eac5f9dfcccff4972d0742cb87ddb5c22bff5e60
  GOV_SHA: 5afe0d29a5a401db80ecdb981038b89a8cefed0a
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-legacy-regression-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-legacy-regression-20261126.json --input .github/workflows/temp-p08-legacy-regression-20261126.yml
  affected-legacy:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'llhzx2018' && github.head_ref == 'evidence/p08-legacy-regression-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Existing affected product regressions
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          test ! -e .env
          test "$(git hash-object tests/test_atomic_upgrade_arm.php)" = 05bc98b58d6a7d0c2a9385a0ce83f4d44ebb9c43
          echo P08_LEGACY_REGRESSION_EXACT_SOURCE=PASS
          failed=0
          for name in atomic_upgrade_arm atomic_release_pointer stable_runtime_gateway owner_future_atomic_status owner_future_repeat_cycle fresh_owner_upgrade_backup; do
            if php "tests/test_$name.php" > "$RUNNER_TEMP/p08-legacy-$name.log" 2>&1; then
              echo "P08_LEGACY_REGRESSION=$name:PASS"
            else
              echo "P08_LEGACY_REGRESSION=$name:FAIL"
              python3 - "$RUNNER_TEMP/p08-legacy-$name.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          codes=sorted(set(re.findall(r'\b(?:ATOMIC_ARM_|R38_|R25_|ADOPS_|P08_|R27_|R34_|R127_|R152_|R66_)[A-Z0-9_]+\b',raw)))
          print('CODES='+','.join(codes[-12:]) if codes else 'CODES=UNCLASSIFIED')
          PY
              failed=1
            fi
          done
          test "$failed" = 0
      - name: Cleanup ephemeral private checkout and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-legacy-*.log
          test ! -e private-p08
          echo P08_LEGACY_REGRESSION_CLEANUP=PASS
