name: P07 V0.1.0 Source Truth Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-v010-source-truth-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact P07 source truth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: bbfa5eb852cdabbf7ffce1a8664c900f67f5717d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "bbfa5eb852cdabbf7ffce1a8664c900f67f5717d"
          test "$(cat BUILD_ID)" = "0.1.0-release1"
          test "$(NO_COLOR=1 bash bin/vfops-user --version)" = "VF Server Ops 0.1.0"
          python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null
          python3 -m unittest -v tests.test_p07_integration_manifest
          grep -Fq '"release_state": "RELEASED"' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq '"public_status": "可用"' docs/authority/P07_INTEGRATION_MANIFEST.json
          grep -Fq 'Formal Release Tag                    = p07-v0.1.0' docs/authority/CURRENT.md
          python3 scripts/secret_scan.py --root .
          echo "P07_SOURCE_TRUTH_GATE=PASS"
