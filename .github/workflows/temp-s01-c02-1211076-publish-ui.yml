name: S01-C02 1076 Publish Maturity Gate
on:
  push:
    branches: [test/s01-c02-1211076-publish-ui-20261009]
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5abdc50031c037ee11d9720732a32af0352bf624
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,pdo_mysql,zip,curl,mbstring
          coverage: none
      - name: Headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: PHP Syntax and workbench real view
        run: |
          test "$(cat VERSION)" = 1.21.1076
          php -l includes/admin-v13/views/publish_zip_v6.php
          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          node --check tests/s01-c02-1211076-publish-mature-browser.js
          node tests/s01-c02-1211076-publish-mature-browser.js
      - name: Existing publish and zip interaction safety suite
        run: |
          node tests/s01-c02-1211073-publish-preflight-browser.js
          node tests/s01-c02-1211067-zip-input-browser-e2e.js
          node tests/s01-c02-1211066-publish-zip-operator-resume-browser.js
      - name: Final unique source package
        run: |
          mkdir -p /tmp/s01-c02-1076
          python3 .github/release/build-ops-package.py --output /tmp/s01-c02-1076/vf-tools-ops_V1.21.1076.zip > /tmp/s01-c02-1076/manifest.json
          unzip -tq /tmp/s01-c02-1076/vf-tools-ops_V1.21.1076.zip
          cat /tmp/s01-c02-1076/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1076-publish-maturity-candidate
          path: /tmp/s01-c02-1076/
