name: P01 V2.21.18 System Chrome Regression

on:
  push:
    branches: [vf-agent-operations-v1]
    paths:
      - '.github/workflows/p01-v2.21.18-system-chrome-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: llhzx2018/vf-start
  SOURCE_BRANCH: maintenance/prototype-refactor-2.21.18-20260819
  EXPECTED_SHA: 5af0341bff1014dd1290bc43d6c84057449eafb0
  RESULT_ID: P01-V2.21.18-SYSTEM-CHROME-REGRESSION

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
          git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" "https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/${SOURCE_REPO}.git" candidate
          cd candidate
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD > /tmp/source-sha
          git rev-parse HEAD^{tree} > /tmp/source-tree
          test "$(tr -d '\r\n' < VERSION)" = '2.21.17'
          grep -F 'assets/update.js?v=22118' src/index.php >/dev/null
          grep -F 'assets/navigation-stability.js?v=22118' src/assets/update.js >/dev/null
          echo 'EXACT_SOURCE=PASS'

      - name: Prepare compact runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v google-chrome >/dev/null || command -v google-chrome-stable >/dev/null
          google-chrome --version || google-chrome-stable --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-sqlite3 sqlite3 >/dev/null
          mkdir -p "$RUNNER_TEMP/p01-node" && cd "$RUNNER_TEMP/p01-node"
          npm init -y >/dev/null 2>&1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund playwright-core@1.57.0 >/dev/null 2>&1
          echo 'SYSTEM_CHROME_RUNTIME=PASS'

      - name: Syntax fresh install and SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          rm -rf /tmp/p01-runtime && cp -a candidate/src /tmp/p01-runtime
          cd /tmp/p01-runtime
          php -S 127.0.0.1:18085 -t . > /tmp/p01-server.log 2>&1 & echo $! >/tmp/p01-server.pid
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01.cookies http://127.0.0.1:18085/setup.php -o /tmp/setup.html && break; sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c /tmp/p01.cookies -b /tmp/p01.cookies -X POST http://127.0.0.1:18085/setup.php \
            --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start Runner' \
            --data-urlencode 'admin_password=Runner-P01-22118!Strong' --data-urlencode 'admin_password_confirm=Runner-P01-22118!Strong' >/tmp/setup-post.html
          php cli/verify.php | tee /tmp/verify.txt
          grep -q 'VERIFY_PASS=YES' /tmp/verify.txt
          php -r 'require "app/bootstrap.php";$d=vf_db();if((int)$d->query("SELECT COUNT(*) FROM categories")->fetchColumn()!==0||(int)$d->query("SELECT COUNT(*) FROM links")->fetchColumn()!==0)exit(1);echo "FRESH_DATA_ZERO=PASS\n";'
          DB=$(php -r "require 'app/bootstrap.php';echo VF_DB_FILE;")
          test "$(sqlite3 "$DB" 'PRAGMA integrity_check;')" = ok
          test -z "$(sqlite3 "$DB" 'PRAGMA foreign_key_check;')"
          echo 'FRESH_INSTALL_SQLITE=PASS'

      - name: Real system Chrome UA regression
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable)
          export CHROME
          cat > "$RUNNER_TEMP/p01-node/e2e.mjs" <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:18085/',{waitUntil:'networkidle'});await page.click('#loginButton');await page.fill('[name=password]','Runner-P01-22118!Strong');await page.click('#loginSubmit');
            await page.waitForFunction(()=>document.documentElement.dataset.vfNavigationStability==='2');
            const scripts=await page.evaluate(()=>Array.from(document.scripts).map(s=>s.src).filter(Boolean));
            if(!scripts.some(x=>x.includes('update.js?v=22118'))||!scripts.some(x=>x.includes('navigation-stability.js?v=22118')))throw new Error('cache-busted loaders missing');
            const order=await page.evaluate(()=>{const keep={links:state.links,recent:state.recent};state.links=[{id:101,title:'A',url:'https://a.example/',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:30,legacy_position:1,click_count:0,tags:[]},{id:102,title:'B',url:'https://b.example/',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:20,legacy_position:2,click_count:999,tags:[]},{id:103,title:'C',url:'https://c.example/',category_id:1,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:10,legacy_position:3,click_count:5000,tags:[]}];state.recent=[{id:103,at:Date.now()}];const before=topLinks(3).map(x=>x.id);const o=window.open;window.open=()=>({opener:null});openLink(state.links[1]);window.open=o;const after=topLinks(3).map(x=>x.id),recent=state.recent.map(x=>x.id);state.links=keep.links;state.recent=keep.recent;return{before,after,recent};});
            if(JSON.stringify(order.before)!=='[101,102,103]'||JSON.stringify(order.after)!=='[101,102,103]'||order.recent[0]!==102)throw new Error('stable order/recent regression '+JSON.stringify(order));
            console.log('OPEN_STABLE_ORDER_AND_RECENT=PASS');
            const scope=await page.evaluate(()=>{state.categories=[{id:91001,parent_id:null,name:'Runner Category',description:'fixture',sort_order:10,legacy_position:1,effective_private:0,is_private:0}];state.links=[{id:92001,title:'Public Only',url:'https://public.example/',category_id:91001,is_pending:0,is_private:0,effective_private:0,is_favorite:0,sort_order:10,legacy_position:1,click_count:0,tags:[]}];state.mode='category';state.selected=91001;state.privacyScope='public';state.sidebarScope='public';state.query='';render();switchSidebarScope('private');return{mode:state.mode,selected:Number(state.selected),privacyScope:state.privacyScope,sidebarScope:state.sidebarScope,hash:location.hash,links:filteredAndSortedLinks().length,home:!!document.querySelector('.home-page')};});
            if(scope.mode!=='category'||scope.selected!==91001||scope.privacyScope!=='private'||scope.sidebarScope!=='private'||scope.links!==0||scope.home||scope.hash!=='#/private/category/91001')throw new Error('scope regression '+JSON.stringify(scope));
            console.log('PUBLIC_PRIVATE_CONTEXT=PASS');
            const home=await page.evaluate(()=>{state.mode='home';state.selected=0;state.privacyScope='';state.sidebarScope='public';state.recent=[];render();const note=(document.querySelector('.home-quick-section .section-head p')||{}).textContent||'';const intro=(document.querySelector('.home-intro .page-subtitle')||{}).textContent||'';const plugin=document.querySelector('#pluginHomeSummary'),workspace=document.querySelector('.home-workspace');return{note,intro,pluginAfter:!!(workspace&&plugin&&workspace.nextElementSibling===plugin)};});
            if(!home.note.includes('稳定手动顺序')||home.note.includes('自动推荐')||!home.intro.includes('搜索与分类优先')||!home.pluginAfter)throw new Error('home regression '+JSON.stringify(home));
            for(const width of [390,480,640,768,1024,1280,1440,1920]){await page.setViewportSize({width,height:900});await page.waitForTimeout(30);const d=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth-document.documentElement.clientWidth,document.body.scrollWidth-document.body.clientWidth));if(d>1)throw new Error(`overflow ${width}:${d}`);}
            if(errors.length)throw new Error('page errors '+errors.join(' | '));
            console.log('HOME_RESPONSIVE_PAGEERROR=PASS');
          }finally{await browser.close();}
          JS
          cd "$RUNNER_TEMP/p01-node" && node e2e.mjs

      - name: Backup restore
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-runtime
          php <<'PHP'
          <?php require 'app/bootstrap.php';$db=vf_db();$r=new VfRepository($db);$r->createCategory(['name'=>'Sentinel','description'=>'runner','is_private'=>1]);$m=new VfBackupManager($db);$b=$m->create('2.21.18 regression','regression',true);$k=(string)$b['backup_key'];$v=$m->verify($k);if(($v['validation_status']??'')!=='valid')throw new RuntimeException('verify');$r->createCategory(['name'=>'Transient','description'=>'runner','is_private'=>1]);VfBackupManager::performRestore($k);$db=vf_db();$q=$db->prepare('SELECT COUNT(*) FROM categories WHERE name=?');$q->execute(['Sentinel']);if((int)$q->fetchColumn()!==1)throw new RuntimeException('sentinel');$q->execute(['Transient']);if((int)$q->fetchColumn()!==0)throw new RuntimeException('transient');echo "BACKUP_RESTORE=PASS\n";
          PHP

      - name: Publish verdict
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          test -n "${VF_RELEASE_WRITE_TOKEN:-}"
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          def r(p):
            try:return open(p).read().strip()
            except:return ''
          payload={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.18','gate':'SYSTEM_CHROME_REGRESSION','status':os.environ.get('JOB_STATUS','unknown').upper(),'pass':os.environ.get('JOB_STATUS')=='success','source_sha':r('/tmp/source-sha'),'source_tree':r('/tmp/source-tree'),'workflow_run_id':os.environ.get('RUN_ID',''),'schema_version':'2026080902','private_data_persisted_publicly':False}
          token=os.environ['VF_RELEASE_WRITE_TOKEN'];content=json.dumps(payload,indent=2,sort_keys=True)+'\n';path=f"vf-agent/results/{os.environ['RESULT_ID']}.json";api=f'https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/{path}';h={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h),timeout=20) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          body={'message':'evidence(P01): publish system Chrome regression','content':base64.b64encode(content.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:body['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'}),timeout=20).read()
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-server.pid ]; then kill "$(cat /tmp/p01-server.pid)" 2>/dev/null || true; fi
          rm -rf candidate /tmp/p01-runtime "$RUNNER_TEMP/p01-node" /tmp/p01.cookies || true
