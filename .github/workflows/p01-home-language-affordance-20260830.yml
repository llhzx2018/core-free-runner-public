name: P01 Home Language Affordance Gate

on:
  push:
    branches:
      - task/p01-home-language-affordance-20260830
    paths:
      - .github/workflows/p01-home-language-affordance-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EVID: /tmp/p01-home-language-affordance
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner

      - name: Checkout exact P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: f47bfe72a6b3ee4c822a3681c9a69fe26b71b761
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Exact source and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C p01 rev-parse HEAD)" = f47bfe72a6b3ee4c822a3681c9a69fe26b71b761
          git -C p01 cat-file -e a04fc022e24aa896f2572c3a41b680509f08eaae^{commit}
          git -C p01 diff --name-only a04fc022e24aa896f2572c3a41b680509f08eaae..HEAD | sort > "$EVID/actual-files.txt"
          cat > "$EVID/expected-files.txt" <<'EOF'
          src/app/FunctionalHome.php
          src/assets/workspace-home.css
          EOF
          sort -o "$EVID/expected-files.txt" "$EVID/expected-files.txt"
          diff -u "$EVID/expected-files.txt" "$EVID/actual-files.txt"
          echo P01_HOME_LANGUAGE_SCOPE=PASS | tee "$EVID/source-fence.txt"

      - name: PHP syntax and display taxonomy contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l p01/src/app/FunctionalHome.php
          php -r '
            require "p01/src/app/FunctionalHome.php";
            $cases=[
              [["surface"=>"channels","resource_kind"=>"youtube"],"YouTube"],
              [["surface"=>"channels","resource_kind"=>"podcast"],"播客"],
              [["surface"=>"channels","resource_kind"=>"bilibili"],"哔哩哔哩"],
              [["surface"=>"watch","resource_kind"=>"movie"],"电影"],
              [["surface"=>"watch","resource_kind"=>"series"],"剧集"],
              [["surface"=>"watch","resource_kind"=>"documentary"],"纪录片"],
              [["surface"=>"watch","resource_kind"=>"variety"],"综艺"],
              [["surface"=>"watch","resource_kind"=>"anime"],"动漫"],
              [["surface"=>"channels","resource_kind"=>"自定义分类"],"自定义分类"],
              [["surface"=>"start","category_name"=>"开发工具"],"开发工具"],
            ];
            foreach($cases as [$asset,$want]){ $got=vf_home_asset_class($asset); if($got!==$want){fwrite(STDERR,json_encode([$asset,$want,$got],JSON_UNESCAPED_UNICODE)."\n");exit(1);} }
            echo "P01_HOME_DISPLAY_TAXONOMY=PASS\n";
          ' | tee "$EVID/taxonomy.txt"

          grep -Fq '>工作台<' p01/src/app/FunctionalHome.php
          grep -Fq '<span>归属建议</span>' p01/src/app/FunctionalHome.php
          grep -Fq '按资源类型继续浏览和管理。' p01/src/app/FunctionalHome.php
          ! grep -Fq '>HOME<' p01/src/app/FunctionalHome.php
          ! grep -Fq 'URL/Data Authority' p01/src/app/FunctionalHome.php
          ! grep -Fq '不伪造' p01/src/app/FunctionalHome.php
          echo P01_HOME_HUMAN_COPY=PASS | tee "$EVID/copy.txt"

      - name: Prepare UI fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > p01/src/ux-language-fixture.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="assets/surface-workspace.css"><link rel="stylesheet" href="assets/workspace-domain-nav.css"><link rel="stylesheet" href="assets/workspace-home.css"><title>P01 Home Language</title></head>
          <body class="vf-surface-app vf-functional-workspace surface-home">
          <nav class="vf-global-domain-nav"><div class="vf-global-domain-nav-inner"><a class="active" href="#">首页</a><a href="#">导航</a><a href="#">频道</a><a href="#">影视</a><a href="#">专题</a></div></nav>
          <aside class="vf-app-sidebar"><a class="vf-app-brand" href="#"><span class="vf-brand-mark">S</span><span><strong>VF Start</strong><small>P01 · 个人互联网资产</small></span></a><nav class="vf-secondary-nav"><a href="#"><span>▣</span><b>全部资源</b><em>406</em></a><a href="#"><span>☆</span><b>我的收藏</b><em>4</em></a><a href="#"><span>◷</span><b>最近使用</b><em>229</em></a></nav></aside>
          <main class="vf-app-stage"><div class="vf-app-topbar vf-domain-subbar"><form class="vf-global-search"><span>⌕</span><input placeholder="搜索全部资源"><kbd>⌘ K</kbd></form></div><div class="vf-shell-main"><section class="vf-home-command">
          <header class="vf-home-command-head"><div><span class="vf-home-kicker">工作台</span><h1>首页</h1><p>先处理需要关注的内容，再从最近使用、收藏或资源类型继续。</p></div><div class="vf-home-head-actions"><a class="vf-home-secondary" href="#">查看全部资源</a></div></header>
          <nav class="vf-home-status-grid"><a href="#"><span>归属建议</span><strong>0</strong><small>当前没有归属建议</small></a><a href="#"><span>最近使用</span><strong>229</strong><small>最近打开过的资源</small></a><a href="#"><span>我的收藏</span><strong>4</strong><small>常用收藏入口</small></a><a href="#"><span>全部资源</span><strong>406</strong><small>浏览和管理全部资源</small></a></nav>
          <div class="vf-home-layout"><div class="vf-home-main-column"><section class="vf-home-section"><header><div><span>继续</span><h2>最近使用</h2><p>最近打开过的资源，点标题即可继续。</p></div><a href="#">查看全部 →</a></header><div class="vf-home-recent-list">
          <article class="vf-home-recent-item"><span class="vf-home-recent-icon">我</span><a class="vf-home-recent-copy" href="#"><strong>我的团长我的团</strong><small>影视 · 电影 · 1 分钟前</small></a><i class="vf-home-private">私人</i><button class="vf-icon-button" aria-label="编辑">✎</button></article>
          <article class="vf-home-recent-item"><span class="vf-home-recent-icon">T</span><a class="vf-home-recent-copy" href="#"><strong>TVBAnywhere 北美官方频道</strong><small>频道 · YouTube · 1 分钟前</small></a><button class="vf-icon-button" aria-label="编辑">✎</button></article>
          </div></section></div><aside class="vf-home-rail"><section class="vf-home-section"><header><div><span>资源</span><h2>从哪里继续</h2><p>按资源类型继续浏览和管理。</p></div></header><div class="vf-home-domain-list"><a href="#"><span><b>导航</b><small>网站、工具与普通网址</small></span><strong>349</strong></a><a href="#"><span><b>频道</b><small>创作者、内容源与后台听</small></span><strong>15</strong></a><a href="#"><span><b>影视</b><small>电影、剧集与观看状态</small></span><strong>41</strong></a><a href="#"><span><b>专题</b><small>学习、研究与托管专题</small></span><strong>1</strong></a></div></section></aside></div>
          </section></div></main></body></html>
          EOF
          python3 -m http.server 8124 --directory p01/src >/tmp/p01-home-language-http.log 2>&1 &

      - name: Chromium UI affordance gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/p01-home-language.cjs <<'EOF'
          const {chromium}=require('/tmp/node_modules/playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1440,height:900}});await p.goto('http://127.0.0.1:8124/ux-language-fixture.html',{waitUntil:'networkidle'});
            const d=await p.evaluate(()=>{const e=document.querySelector('.vf-home-recent-item>.vf-icon-button'),s=getComputedStyle(e);return{w:parseFloat(s.width),h:parseFloat(s.height),opacity:parseFloat(s.opacity),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,text:document.body.innerText};});
            if(d.w<28||d.h<28)throw new Error('edit target too small'); if(d.opacity<.7)throw new Error('edit affordance too faint'); if(d.overflow>1)throw new Error('desktop overflow'); if(/\bmovie\b|\byoutube\b/i.test(d.text))throw new Error('raw taxonomy leaked'); if(!d.text.includes('工作台')||!d.text.includes('归属建议')||!d.text.includes('影视 · 电影')||!d.text.includes('频道 · YouTube'))throw new Error('humanized copy missing');
            fs.writeFileSync(process.env.EVID+'/desktop.json',JSON.stringify(d,null,2));await p.screenshot({path:process.env.EVID+'/home-language-1440.png',fullPage:true});await p.setViewportSize({width:390,height:844});await p.reload({waitUntil:'networkidle'});const m=await p.evaluate(()=>{const s=getComputedStyle(document.querySelector('.vf-home-recent-item>.vf-icon-button'));return{opacity:parseFloat(s.opacity),border:s.borderStyle,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});if(m.opacity<.99||m.overflow>1)throw new Error('mobile edit/overflow regression');fs.writeFileSync(process.env.EVID+'/mobile.json',JSON.stringify(m,null,2));await p.screenshot({path:process.env.EVID+'/home-language-390.png',fullPage:true});fs.writeFileSync(process.env.EVID+'/verdict.txt','P01_HOME_LANGUAGE_AFFORDANCE=PASS\nSOURCE=f47bfe72a6b3ee4c822a3681c9a69fe26b71b761\n');await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          EOF
          EVID="$EVID" node /tmp/p01-home-language.cjs

      - name: Upload UI evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-home-language-affordance-${{ github.run_id }}
          path: ${{ env.EVID }}
          retention-days: 30
