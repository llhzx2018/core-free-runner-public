name: TEMP S01-C02 Ops 1.21.843 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121843-canonical-retry-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121843-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 904a68e3a60aa58c5d7af8d725f3393f22e9be07
      TREE: 00abb181effaf9479244792a9e05e031af63e527
      TAG: v1.21.843
      ASSET: vf-tools-ops_V1.21.843.zip
      BYTES: '3298663'
      SHA256: 8d91b11fe50e4be6f0793cb262637dfdb92fd3e9c7f6156611423e13a2da81e1
      FILES: '925'
      FP: c7dfd6146dd8b48c73d5b16a4e958c57ae5a64d1980465335cac3a4155e029c2
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.843
          php ops/.github/phase3/v121843-final-audit-canonical-retry.php | grep -Fxq PASS_V121843_FINAL_AUDIT_CANONICAL_RETRY
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.843 closes the authority collision that prevented the V1.21.842 bounded Final Audit retry from selecting the historical Stage-6 Candidate.

          - Focused Gate 34006992574 PASS on exact source 904a68e3a60aa58c5d7af8d725f3393f22e9be07 / tree 00abb181effaf9479244792a9e05e031af63e527.
          - Deterministic Artifact Identity 34007012350 PASS.
          - Production V1.21.842 is current, Source is reusable, manualSourceUploadRequired=false, Candidate remains fail-closed at final_decision with one audit leaf and zero internal-link failures.
          - Root cause: active_release_job/candidate_async_job are mutable orchestration pointers and are legitimately rebound by inspection/recovery work before the V1.21.842 retry boundary runs.
          - V1.21.843 resolves historical Final Audit authority independently using a bounded private scan capped at 200 async-job options and accepts exactly one terminal Candidate at current_stage=6 with the exact proven Final Audit reopen leaf, final_decision failure, trusted DONE inspect-only lineage, and exact durable Source SHA.
          - Zero eligible or multiple eligible Candidates both fail closed. Job ids, paths, hashes, package identity and raw failure text are not exported by REST evidence.
          - Only after canonical authority is proven may orchestration be rebound to the trusted inspection; a distinct fresh Candidate is then delegated to the existing V1.21.834 bounded worker.
          - Source is not uploaded or mutated; old failed Candidate is not reset or mutated; Final Audit, candidatePackageReady and finalOnline are never forced.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.843.zip; 3298663 bytes; SHA256 8d91b11fe50e4be6f0793cb262637dfdb92fd3e9c7f6156611423e13a2da81e1; runtime files 925; fingerprint c7dfd6146dd8b48c73d5b16a4e958c57ae5a64d1980465335cac3a4155e029c2.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.843' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121843=PASS
