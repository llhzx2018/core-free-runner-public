name: S01 R8 synthetic versioned WP ZIP upgrade rollback
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-zip-upgrade-20261103.yml'
      - 'lanes/s01-r8-20261103/zip-upgrade.sh'
permissions:
  contents: read
jobs:
  zip-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: fbe049dc18eb18eab21e9d8c3cededfe55b783e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7a1bca1deaf08148640812c9e465324442767d90
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3305e9447f936c3e2a63a15ac1fc9b2893f188e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - name: Exact M3U8 ZIP upgrade rollback and reupgrade without owner data loss
        shell: bash
        run: bash control/lanes/s01-r8-20261103/zip-upgrade.sh
      - name: Destroy transient private source and isolated WordPress
        if: always()
        shell: bash
        run: rm -rf candidate baseline theme ops /tmp/s01-r8-zip-fixture /tmp/s01-r8-upgrade-wp /tmp/s01-r8-before.json
