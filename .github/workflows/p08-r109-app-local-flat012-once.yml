name: P08 R109 real old 012 to site-owned app Atomic bridge once
on:
  pull_request:
    paths: [.github/workflows/p08-r109-app-local-flat012-once.yml]
permissions:
  contents: read
jobs:
  site-owned-012-atomic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_R109_EXACT_SOURCE: 8226fc82a89e993711594c6befa94320e8155ac9
    steps:
      - name: Exact temporary private source from registered read capability
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8226fc82a89e993711594c6befa94320e8155ac9
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Canonical shared delivery source exact governance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Native PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl
          tools: composer:v2
      - name: Locked Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source syntax, no global-service coupling, and nonroot safety
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "$P08_R109_EXACT_SOURCE"
          test "$(git -C gov-current rev-parse HEAD)" = 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          php -l p08-private/src/Upgrade/R109AppLocal012Activation.php
          php -l p08-private/src/Upgrade/R106Installed012Source.php
          php -l p08-private/tests/compatibility/r109_official012_app_local_activation.php
          python3 - <<'PY'
          from pathlib import Path
          p=Path('p08-private/src/Upgrade/R109AppLocal012Activation.php').read_text()
          assert 'posix_geteuid()===0' in p
          assert 'LOCK_EX | LOCK_NB' in p
          assert 'DatabaseSnapshot' in p and 'PrivatePayloadSnapshot' in p
          body=p.split('final class R109AppLocal012Activation',1)[1]
          for x in ('systemctl(', '/etc/nginx','stop nginx','stop cron','php-fpm','/home/kewaro'):
              assert x not in body, 'R109_FORBIDDEN_HOST_COUPLING'
          print('R109_SITE_OWNED_APP_SCOPE_NOT_VPS=PASS')
          PY
      - name: Independently build genuine indexed updater bridge runtime from exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          build="$RUNNER_TEMP/p08-r106-onefile-build-tree"
          mkdir -m 0700 "$build"
          git -C p08-private archive HEAD | tar -x -C "$build"
          cd "$build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r106-composer.log" 2>&1 || {
            echo R106_ONEFILE_COMPOSER_LOCKED_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_NPM_LOCKED_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r106-node.log" 2>&1 || {
            echo R106_ONEFILE_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' > "$RUNNER_TEMP/r106-full.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-onefile-build-tree'
          full=Path(os.environ['RUNNER_TEMP'])/'r106-onefile-bridge-full.zip'
          gov=Path('gov-current').resolve()
          sha=os.environ['P08_R109_EXACT_SOURCE']
          verify_canonical_full_contract(source,full,sha,gov,'resolve')
          write_full(built,full,'0.1.2',sha)
          verify_canonical_full_contract(source,full,sha,gov,'delivery')
          PY
            echo R106_ONEFILE_CANONICAL_FULL_GATE=FAIL
            python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'r106-full.log'
          raw=p.read_text(errors='replace') if p.exists() else ''
          codes=sorted(set(re.findall(r'\b(?:FULL|CONTRACT|P08|R106)_[A-Z0-9_]{4,90}\b',raw)))
          print("R106_ONEFILE_SAFE_CODES="+",".join(codes[-12:]))
          reasons=re.findall(r'CONTRACT_REASON=([A-Z][A-Z0-9_]{2,100})',raw)
          print("R106_ONEFILE_GATE_REASON="+(reasons[-1] if reasons else "NOT_PROVEN"))
          if not codes:
              print("R106_ONEFILE_EXEC_EXCEPTION="+("PYTHON_EXCEPTION" if 'Traceback' in raw else 'OTHER'))
          PY
            exit 1;
          }
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$RUNNER_TEMP/p08-r106-updater-bridge-onefile"
          echo R106_ONEFILE_DISTINCT_BRIDGE_CANONICAL_FULL=PASS
      - name: Real official 012 FULL byte-bound app-local conversion, backup and negative checks
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --location --silent --show-error --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r109-official-012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r109-official-012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r109-official-012.zip" | sha256sum --check --status
          site="$RUNNER_TEMP/p08-r109-official-012-site-success"
          bridge="$RUNNER_TEMP/p08-r109-updater-bridge-success"
          mkdir -m 0700 "$site" "$bridge"
          unzip -q "$RUNNER_TEMP/r109-official-012.zip" -d "$site"
          unzip -q "$RUNNER_TEMP/r106-onefile-bridge-full.zip" -d "$bridge"
          php p08-private/tests/compatibility/r109_official012_app_local_activation.php \
            success "$site" "$bridge" "$P08_R109_EXACT_SOURCE" \
            > "$RUNNER_TEMP/r109-app-local.log" 2>&1 || {
              grep -E '^R109_BRIDGE_FAILURE=' "$RUNNER_TEMP/r109-app-local.log" | tail -1 || true
              echo R109_APP_LEVEL_REAL_OFFICIAL_FULL_TEST=FAIL
              exit 1
            }
          grep -Fxq 'R109_REAL_OFFICIAL_012_FLAT_TO_APP_LOCAL_BRIDGE_AND_NATIVE_BACKUP=PASS' "$RUNNER_TEMP/r109-app-local.log"
          grep -Fxq 'R109_ROOT_AND_GLOBAL_SERVICES_REQUIRED=NO' "$RUNNER_TEMP/r109-app-local.log"
          grep -Fxq 'R109_SITE_ACCOUNT_NOT_OWNER_RELEASE=YES' "$RUNNER_TEMP/r109-app-local.log"
          echo R109_REAL_PUBLISHED_012_IN_APP_BRIDGE_AND_BACKUP=PASS
          echo R109_PHYSICAL_OWNER_VPS_AND_RELEASE=UNCHANGED
          echo R109_USER_INSTALL_READY=NO
      - name: Always purge private source, downloaded official FULL, and synthetic Owner fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private gov-current "$RUNNER_TEMP/p08-r106-onefile-build-tree" "$RUNNER_TEMP/p08-r109-updater-bridge-success" "$RUNNER_TEMP/p08-r109-official-012-site-success"
          rm -f -- "$RUNNER_TEMP"/r109-*.zip "$RUNNER_TEMP"/r109-*.log "$RUNNER_TEMP"/r106-onefile-bridge-full.zip "$RUNNER_TEMP"/r106-full.log "$RUNNER_TEMP"/r106-composer.log "$RUNNER_TEMP"/r106-node.log
          echo R109_PRIVATE_WORKSPACE_AND_FIXTURES_PURGED=YES
