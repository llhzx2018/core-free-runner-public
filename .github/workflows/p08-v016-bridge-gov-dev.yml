name: P08 v016 legacy-media bridge DEV-only GOV-DOC check
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v016-bridge-gov-dev.yml
permissions:
  contents: read
jobs:
  p08-v016-gov-doc:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v016-bridge-gov-dev-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout ephemeral public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private GOV-DOC PR head with no saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a7c49ab7eba5c015772ab2f46f46e33dc71f04b1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
          fetch-depth: 0
      - name: Validate actual GOV-DOC exact SHA, pointer and allowed one-case changes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          test "$(git rev-parse HEAD)" = a7c49ab7eba5c015772ab2f46f46e33dc71f04b1
          test -z "$(git status --porcelain)"
          git diff --name-only 677258196998c2e2b9f39b2aca54fc9d7fbddafe HEAD > "$RUNNER_TEMP/gov-pr-filelist"
          python3 -B - <<'PY'
          import pathlib
          actual=set(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'gov-pr-filelist').read_text().splitlines())
          expected={'CURRENT.md','governance/release/cases/P08_ADOPS_V016_ISSUED_V015_LEGACY_MEDIA_SAFE_BRIDGE_DEV_20261121.md'}
          assert actual==expected,(actual,expected)
          skill=pathlib.Path('skills/skill-release/V3.23/SKILL.md').read_text()
          current=pathlib.Path('CURRENT.md').read_text()
          case=pathlib.Path('governance/release/cases/P08_ADOPS_V016_ISSUED_V015_LEGACY_MEDIA_SAFE_BRIDGE_DEV_20261121.md').read_text()
          assert '| skill-release | V3.23 |' in current
          assert 'LEGACY' in current.upper() and 'aa2613425dcb5848d9d45befa17a5b8fbc8224d0' in current
          assert 'Mode X' in skill and 'SIGKILL' in skill and 'landing-assets' in skill
          assert 'FORMAL RELEASE IS NOT AUTHORIZED' in case
          assert 'landing-assets' in case and 'core-updates' in case
          print('P08_V016_BRIDGE_GOV_ONE_CASE_SCOPE_AND_POINTER=PASS')
          PY
      - name: Canonical governance current dependency and closure lints
        shell: bash
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL,SECURITY,TESTING,UPGRADE,DATA_SCHEMA,API_PROVIDER,SEO,CRON_JOB,NOTIFICATION,OBSERVABILITY,PERFORMANCE,GIT,UA_UI
            IMPACT_REASON: One-case P08 v016 normative development scope expands by exactly one old-client backup-safe bridge; all thirteen sealed domain requirements are retained without editing domain authority bodies, and no publication is permitted under this addendum.
        run: |
          set -Eeuo pipefail
          set +x
          cd gov
          python3 -B governance/public-authority/tools/current_dependency_lint.py
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base 677258196998c2e2b9f39b2aca54fc9d7fbddafe --git-head a7c49ab7eba5c015772ab2f46f46e33dc71f04b1
          python3 -B governance/public-authority/tools/global_closure_lint.py --git-base 677258196998c2e2b9f39b2aca54fc9d7fbddafe --git-head a7c49ab7eba5c015772ab2f46f46e33dc71f04b1
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_current_dependency_lint.py' -v
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -v
          echo 'P08_V016_BRIDGE_GOV_CLOSURE_AND_NEGATIVE_FIXTURES=PASS'
      - name: Always erase transient private GOV source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- gov "$RUNNER_TEMP/gov-pr-filelist"
          test ! -e gov
          echo 'P08_V016_BRIDGE_GOV_PRIVATE_CLEANUP=PASS'
