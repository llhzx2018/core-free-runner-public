name: P01 D1 exact-source synthetic three-engine smoke (temporary)
on:
  push:
    branches:
      - test/p01-d1-db-parity-20261111

permissions:
  contents: read

jobs:
  d1-schema-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Assert bounded public-safe test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d1-db-parity-20261111"
          echo "P01_D1_SCOPE=SYNTHETIC_ISOLATED_ONLY"
          echo "P01_D1_PRODUCTION_WRITES=NO"

      - name: Verify ephemeral private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "$READ_TOKEN" ]; then
            echo "P01_D1_PRIVATE_READ_CAPABILITY=BLOCKED_MISSING"
            exit 20
          fi
          echo "P01_D1_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Checkout exact private P01 source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b1430f20374338fdbf0d0ecea86f0fc70cca5fe1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Verify exact source SHA before executing
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "b1430f20374338fdbf0d0ecea86f0fc70cca5fe1"
          test "$(cat candidate/VERSION)" = "2.47.515"
          echo "P01_D1_EXACT_SOURCE=PASS"
          echo "P01_D1_TARGET_SHA=b1430f20374338fdbf0d0ecea86f0fc70cca5fe1"

      - name: Install disposable PHP and Composer testing dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mysql php-mbstring php-xml php-curl unzip composer >/dev/null
          php -v | head -2
          php -r 'foreach (["sqlite", "mysql"] as $d) {if (!in_array($d, PDO::getAvailableDrivers(), true)) {fwrite(STDERR, "P01_D1_PDO_DRIVER_MISSING=".$d."\n");exit(1);}} echo "P01_D1_PDO_DRIVERS=PASS\n";'
          composer --version
          composer install --working-dir=candidate/tests/compatibility/laravel --no-interaction --no-progress --no-scripts --prefer-dist --optimize-autoloader
          echo "P01_D1_ISOLATED_LARAVEL_DEPS=PASS"

      - name: Existing schema source and PHP negative contract
        id: source_guard
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd candidate
          python3 scripts/check_p01_fullstack_contract.py --database-schema
          status=$?
          echo "P01_D1_SCHEMA_SOURCE_EXIT=$status"
          exit "$status"

      - name: Laravel 13 clean SQLite migration CRUD and rollback
        id: sqlite
        continue-on-error: true
        shell: bash
        env:
          P01_ISOLATED_DB_TEST: "YES"
          P01_DB_TEST_ENGINE: sqlite
        run: |
          cd candidate
          php tests/compatibility/laravel/run_import_batches.php

      - name: Laravel 13 MariaDB 11.8 migration CRUD and rollback
        id: maria
        continue-on-error: true
        shell: bash
        env:
          P01_ISOLATED_DB_TEST: "YES"
          P01_DB_TEST_ENGINE: mariadb
          P01_DB_TEST_HOST: 127.0.0.1
          P01_DB_TEST_PORT: "3307"
          P01_DB_TEST_NAME: p01_d1_test_maria_20261111
          P01_DB_TEST_USER: root
          P01_DB_TEST_PASSWORD: p01-only-synthetic-test
        run: |
          cd candidate
          php tests/compatibility/laravel/run_import_batches.php

      - name: Laravel 13 MySQL 8.4 migration CRUD and rollback
        id: mysql
        continue-on-error: true
        shell: bash
        env:
          P01_ISOLATED_DB_TEST: "YES"
          P01_DB_TEST_ENGINE: mysql
          P01_DB_TEST_HOST: 127.0.0.1
          P01_DB_TEST_PORT: "3306"
          P01_DB_TEST_NAME: p01_d1_test_mysql_20261111
          P01_DB_TEST_USER: root
          P01_DB_TEST_PASSWORD: p01-only-synthetic-test
        run: |
          cd candidate
          php tests/compatibility/laravel/run_import_batches.php

      - name: Classify all exact-source engine outcomes
        if: always()
        shell: bash
        env:
          SOURCE: ${{ steps.source_guard.outcome }}
          SQLITE: ${{ steps.sqlite.outcome }}
          MARIADB: ${{ steps.maria.outcome }}
          MYSQL: ${{ steps.mysql.outcome }}
        run: |
          echo "P01_D1_SOURCE_GUARD=$SOURCE"
          echo "P01_D1_SQLITE=$SQLITE"
          echo "P01_D1_MARIADB=$MARIADB"
          echo "P01_D1_MYSQL=$MYSQL"
          if [ "$SOURCE" != success ] || [ "$SQLITE" != success ] || [ "$MARIADB" != success ] || [ "$MYSQL" != success ]; then
            echo "P01_D1_THREE_ENGINE=FAIL_OR_BLOCKED"
            exit 1
          fi
          echo "P01_D1_THREE_ENGINE_ISOLATED_SMOKE=PASS"

      - name: Remove private checkout and synthetic testing files
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          echo "P01_D1_PRIVATE_SOURCE_PERSISTED=NO"
