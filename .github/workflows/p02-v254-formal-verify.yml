name: P02 V2.5.4 Formal Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v254-formal-verify.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_BASE: 6db75825b6ea3cdf340f6d885f3004d9c5fe14a2
      PRODUCT_REPO: llhzx2018/vf-library
      SOURCE_VERSION: 2.5.2
      TARGET_VERSION: 2.5.4
      SCHEMA_VERSION: '2401'
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout exact V2.5.4 common-baseline candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: '${{ env.PRODUCT_BASE }}'
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: p02
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare immutable V2.5.4 formal release source
        working-directory: p02
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release@users.noreply.github.com'
          git switch -C release/v2.5.4 "$PRODUCT_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          src=root/'scripts/build-release-v2.5.3.py'
          dst=root/'scripts/build-release-v2.5.4.py'
          s=src.read_text(encoding='utf-8')
          old="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.3'; SCHEMA=2401; DT=(2026,8,18,14,15,0)"
          new="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.4'; SCHEMA=2401; DT=(2026,8,19,2,0,0)"
          assert old in s
          s=s.replace(old,new)
          s=s.replace("default='build/release-v2.5.3'","default='build/release-v2.5.4'")
          s=s.replace("default='release/v2.5.3'","default='release/v2.5.4'")
          pattern=r"notes=out/f'VF_Library_V\{VER\}_RELEASE_NOTES\.md'; notes\.write_text\(f'''# VF Library V\{VER\}.*?'''\)"
          replacement="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.4 is the formal VF Common Product Baseline adoption release for P02, consolidated for direct upgrade from V2.5.2. It includes the V2.5.3 Document List resizer fix plus independent Favicon / Browser Icon management while retaining the existing Logo, import/export, backup/restore, install, online update, migration/rollback and security contracts. Schema {SCHEMA} is unchanged.\n\nHighlights:\n- VF-COMMON-PRODUCT-BASELINE@1.0 adoption: 7/7 applicable capabilities COMPLIANT, semantic gaps 0, pending 0.\n- Adds independent Favicon / Browser Icon upload, preview, reset/default fallback and cache-busting without coupling it to Logo.\n- Custom branding assets remain private and outside runtime replacement payloads, so online update does not overwrite OWNER assets.\n- Retains V2.5.3 real Document List width dragging in Edit/Split mode, including width persistence and collapse/restore behavior.\n- Retains V2.5.2 responsive editor, A-/A+ font scaling, Document List visibility/recovery and wide Edit/Split workspace behavior.\n- Formal upgrade path for current Production is V2.5.2 -> V2.5.4; V2.5.3 is superseded as a standalone Production target.\n\nSchema remains {SCHEMA}; no migration. Existing {SRCVER} sites use UPDATE; FULL is clean install only.\n''')"""
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          assert n==1,n
          s=s2.replace("'candidate_browser':'PASS_RUN_32146866564'","'candidate_browser':'PASS_RUN_32206056733_PLUS_32146866564'")
          s=s.replace("'candidate_backend_data_privacy_transaction':'INHERITED_V2.5.0_PLUS_SCOPED_HOTFIX'","'candidate_backend_data_privacy_transaction':'PASS_RUN_32206056733_PLUS_INHERITED_V2.5.3'")
          s=s.replace("'main_readback':'PRODUCTION_2.5.2_CURRENT_EXPECTED'","'main_readback':'PRODUCTION_2.5.2_CURRENT_EXPECTED_NOT_PROMOTED'")
          dst.write_text(s,encoding='utf-8'); dst.chmod(0o755)

          ch=root/'CHANGELOG.md'; old_ch=ch.read_text(encoding='utf-8')
          if not old_ch.startswith('# VF Library V2.5.4'):
              head='''# VF Library V2.5.4 · VF Common Product Baseline Adoption · 2026-08-19\n\n- 完成 `VF-COMMON-PRODUCT-BASELINE@1.0` 在 P02 的适用性与实现收口：7 / 7 applicable capabilities COMPLIANT，Semantic Gap 0，Pending 0。\n- 新增独立 Favicon / Browser Icon 管理：上传、预览、恢复默认、Fallback、缓存版本化均与 Logo 解耦；自定义品牌资产继续保存在私有目录，在线更新不得覆盖。\n- 保留并合并 V2.5.3 的 Document List 真实宽度拖动修复：Edit / Split 使用三轨 Grid，拖动宽度、折叠/恢复与本地记忆继续有效。\n- 保留 V2.5.2 的编辑器响应式、A-/A+ 字号、Document List 可见性/恢复入口与宽工作区修复。\n- 本次正式升级路径直接从 V2.5.2 → V2.5.4；V2.5.3 作为已验证中间 Hotfix 被 V2.5.4 正式合并，不再要求 OWNER 先做一次中间升级。\n- Schema 保持 `2401`，无 Migration。\n\n'''
              ch.write_text(head+old_ch,encoding='utf-8')

          vp=root/'VF_PROJECT.json'; data=json.loads(vp.read_text(encoding='utf-8'))
          data['status']='V2.5.4_FORMAL_RELEASE_CANDIDATE'
          data['lifecycle']='FORMAL_RELEASE_PREP'
          data['release_authorization']={'owner_authorized':True,'authorized_at':'2026-08-19','scope':'FORMAL_RELEASE_AND_CORE_UPDATES_PUBLICATION_NO_PRODUCTION_WRITE'}
          pb=data.setdefault('protected_boundaries',{})
          pb['main_write_v254']='NOT_AUTHORIZED_NOT_EXECUTED'
          pb['formal_release_v254']='AUTHORIZED_IN_PROGRESS'
          pb['core_updates_v254_publish']='AUTHORIZED_AFTER_FORMAL_VERIFY'
          pb['production_upgrade_v254']='NOT_EXECUTED'
          pb['production_write']=0
          data['current_phase']='V2.5.4_FORMAL_RELEASE_VERIFY'
          data['next_gate']='FORMAL_ARTIFACT_PASS_THEN_RELEASE_AND_CORE_UPDATES_PUBLISH'
          vp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m py_compile scripts/build-release-v2.5.4.py
          python3 scripts/repository-gates.py
          python3 scripts/verify-source-manifest.py
          php -l public/index.php >/dev/null
          git add scripts/build-release-v2.5.4.py CHANGELOG.md VF_PROJECT.json
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'chore(v2.5.4): prepare formal common-baseline release'; fi
          git push origin HEAD:release/v2.5.4
          echo FORMAL_SOURCE=$(git rev-parse HEAD)
          echo FORMAL_TREE=$(git show -s --format=%T HEAD)

      - name: Deterministic formal build x2
        working-directory: p02
        run: |
          set -Eeuo pipefail
          FORMAL_SOURCE=$(git rev-parse HEAD); TREE=$(git show -s --format=%T HEAD)
          python3 scripts/build-release-v2.5.4.py --out build/formal-a --source-commit "$FORMAL_SOURCE" --source-tree "$TREE" --source-ref release/v2.5.4 > "$RUNNER_TEMP/build-a.json"
          python3 scripts/build-release-v2.5.4.py --out build/formal-b --source-commit "$FORMAL_SOURCE" --source-tree "$TREE" --source-ref release/v2.5.4 > "$RUNNER_TEMP/build-b.json"
          (cd build/formal-a && sha256sum * | sort) > "$RUNNER_TEMP/sums-a.txt"
          (cd build/formal-b && sha256sum * | sort) > "$RUNNER_TEMP/sums-b.txt"
          diff -u "$RUNNER_TEMP/sums-a.txt" "$RUNNER_TEMP/sums-b.txt"
          diff -u build/formal-a/SHA256SUMS.txt build/formal-b/SHA256SUMS.txt
          for f in VF_Library_V2.5.4_UPDATE.zip VF_Library_V2.5.4_FULL.zip VF_Library_V2.5.4_ATOMIC.zip VF_Library_V2.5.4_SOURCE.zip repair-v2.5.4.php; do test -s "build/formal-a/$f"; done
          for z in build/formal-a/*.zip; do unzip -t "$z" >/dev/null; done
          echo P02_V254_DETERMINISTIC_BUILD=PASS

      - name: FULL actual ZIP fresh install
        working-directory: p02
        env:
          PW: 'P02-V254-Fresh-${{ github.run_id }}!'
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/full-test"; SITE="$ROOT/site"; mkdir -p "$SITE"
          unzip -q build/formal-a/VF_Library_V2.5.4_FULL.zip -d "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = 2.5.4
          test -s "$SITE/app/FaviconAsset.php"
          test -s "$SITE/favicon.php"
          test -s "$SITE/favicon-action.php"
          php -S 127.0.0.1:18204 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18204/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18204/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18204' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" http://127.0.0.1:18204/setup.php)" = 303
          curl -fsS -b "$ROOT/cookie" http://127.0.0.1:18204/api.php?action=session | jq -e '.site.auth==true' >/dev/null
          DB=$(find "$(dirname "$SITE")" -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) | head -n1); test -n "$DB"
          test "$(sqlite3 "$DB" 'pragma integrity_check;')" = ok
          test -z "$(sqlite3 "$DB" 'pragma foreign_key_check;')"
          kill "$(cat "$ROOT/pid")"
          echo P02_V254_FULL_FRESH_INSTALL=PASS

      - name: Existing-data UpdateCore 2.5.2 to 2.5.4
        working-directory: p02
        env:
          PW: 'P02-V254-Upgrade-${{ github.run_id }}!'
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/upgrade-test"; SRC="$ROOT/source-252"; SITE="$ROOT/site"; mkdir -p "$ROOT"
          git clone -q --no-checkout https://x-access-token:${{ secrets.VF_PRIVATE_READ_TOKEN }}@github.com/llhzx2018/vf-library.git "$SRC"
          git -C "$SRC" checkout -q v2.5.2
          mkdir -p "$SITE"; bash "$SRC/scripts/build-deploy-tree.sh" "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.2
          php -S 127.0.0.1:18205 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18205/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18205/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18205' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" http://127.0.0.1:18205/setup.php)" = 303
          SESSION=$(curl -fsS -b "$ROOT/cookie" http://127.0.0.1:18205/api.php?action=session); CSRF=$(jq -r '.csrf' <<<"$SESSION")
          CAT=$(curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"V254 Upgrade Sentinel","description":"formal existing-data sentinel","icon":"folder"}' 'http://127.0.0.1:18205/api.php?action=category_save'); CID=$(jq -r '.id' <<<"$CAT"); test "$CID" != null
          ITEM=$(jq -nc --argjson cid "$CID" '{category_id:$cid,title:"V254 Existing Data Sentinel",description:"must survive",content:"# Existing Data Sentinel\n\nBusiness content must survive.",content_mode:"article",content_format:"markdown",primary_action:"read",status:"active"}')
          SAVED=$(curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "$ITEM" 'http://127.0.0.1:18205/api.php?action=content_save'); IID=$(jq -r '.id' <<<"$SAVED"); test "$IID" != null
          curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "{\"id\":$IID,\"favorite\":true}" 'http://127.0.0.1:18205/api.php?action=content_favorite' | jq -e '.ok==true' >/dev/null
          cp build/formal-a/VF_Library_V2.5.4_UPDATE.zip "$ROOT/update.zip"; BYTES=$(stat -c%s "$ROOT/update.zip"); SHA=$(sha256sum "$ROOT/update.zip"|awk '{print $1}')
          cat > "$ROOT/upgrade.php" <<'PHP'
          <?php
          $site=$argv[1];$package=$argv[2];$bytes=(int)$argv[3];$sha=$argv[4];
          require $site.'/app/bootstrap.php';require_once $site.'/app/CoreUpdates/UpdateAdapter.php';require_once $site.'/app/CoreUpdates/UpdateCore.php';require_once $site.'/app/VfLibraryCoreUpdateAdapter.php';
          $manifest=['schema_version'=>'1.0','project_id'=>'P02','component_id'=>'APP','enabled'=>true,'target_version'=>'2.5.4','update_type'=>'ATOMIC','from_versions'=>['2.5.2'],'schema_from'=>'2401','schema_to'=>'2401','repository'=>'llhzx2018/vf-library','release_tag'=>'v2.5.4','asset_name'=>'VF_Library_V2.5.4_UPDATE.zip','asset_bytes'=>$bytes,'asset_sha256'=>$sha,'backup_required'=>true,'rollback_supported'=>true,'released_at'=>'2026-08-19T00:00:00Z','minimum_php'=>'8.1'];
          $core=new CoreUpdates\UpdateCore('P02','APP');$check=$core->check('2.5.2','2401',$manifest);if(($check['status']??'')!=='AVAILABLE')exit(2);$verify=$core->verifyPackage($package,$manifest);if(($verify['status']??'')!=='VERIFIED')exit(3);$adapter=new VfLibraryCoreUpdateAdapter();$result=$core->upgrade('2.5.2','2401',$adapter,$package,$manifest);echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT),"\n";if(!in_array($result['status']??'', ['COMMITTED','COMMITTED_WITH_CLEANUP_WARNING'],true))exit(4);if(empty($result['backup_locator']))exit(5);
          PHP
          php "$ROOT/upgrade.php" "$SITE" "$ROOT/update.zip" "$BYTES" "$SHA" | tee "$ROOT/result.json"
          test "$(cat "$SITE/VERSION.txt")" = 2.5.4
          jq -e '.status=="COMMITTED" or .status=="COMMITTED_WITH_CLEANUP_WARNING"' "$ROOT/result.json" >/dev/null
          jq -e '.backup_locator|length>0' "$ROOT/result.json" >/dev/null
          SESSION2=$(curl -fsS -b "$ROOT/cookie" http://127.0.0.1:18205/api.php?action=session); CSRF2=$(jq -r '.csrf' <<<"$SESSION2"); jq -e '.site.auth==true' <<<"$SESSION2" >/dev/null
          curl -fsS -b "$ROOT/cookie" "http://127.0.0.1:18205/api.php?action=content_get&id=$IID" | jq -e '.item.title=="V254 Existing Data Sentinel" and (.item.is_favorite|tonumber)==1' >/dev/null
          POST=$(jq -nc --argjson cid "$CID" '{category_id:$cid,title:"V254 Post Upgrade Write",description:"after update",content:"write works",content_mode:"quick",content_format:"plain",primary_action:"copy",status:"active"}')
          curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF2" -d "$POST" 'http://127.0.0.1:18205/api.php?action=content_save' | jq -e '.ok==true' >/dev/null
          php "$SITE/cli/verify.php" > "$ROOT/verify.json"; jq -e '.ok==true and .version=="2.5.4" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' "$ROOT/verify.json" >/dev/null
          DB=$(find "$(dirname "$SITE")" -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \) | head -n1); test -n "$DB"; test "$(sqlite3 "$DB" 'pragma integrity_check;')" = ok; test -z "$(sqlite3 "$DB" 'pragma foreign_key_check;')"
          test -s "$SITE/app/FaviconAsset.php"; test -s "$SITE/favicon.php"; test -s "$SITE/favicon-action.php"
          kill "$(cat "$ROOT/pid")"
          echo P02_V254_EXISTING_DATA_UPDATECORE=PASS

      - name: Artifact identities
        working-directory: p02
        run: |
          set -Eeuo pipefail
          cd build/formal-a
          for f in *; do printf '%s  %s  ' "$f" "$(stat -c%s "$f")"; sha256sum "$f"|awk '{print $1}'; done | sort
          echo P02_V254_FORMAL_SOURCE=$(git -C ../.. rev-parse HEAD)
          echo P02_V254_COMMON_BASELINE=7_OF_7_COMPLIANT
          echo P02_V254_DETERMINISTIC_BUILD=PASS
          echo P02_V254_FULL_FRESH_INSTALL=PASS
          echo P02_V254_EXISTING_DATA_UPDATECORE=PASS
          echo PRODUCTION_WRITE=NO

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-v254-formal-assets
          path: p02/build/formal-a/*
          if-no-files-found: error
          retention-days: 1
