name: P01 V2.34.0 Final Metadata Fence

on:
  push:
    branches: [task/p01-v2340-candidate-readiness-20260830]
    paths:
      - .github/workflows/p01-v2340-final-metadata-fence-20260830.yml

permissions:
  contents: read

jobs:
  fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 4a4e2d1abb4dc8be848448863f7d58ce20705e7b
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Final docs-bound exact-source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          EVID=/tmp/p01-v2340-final-metadata-fence
          rm -rf "$EVID" && mkdir -p "$EVID"
          test "$(git rev-parse HEAD)" = 4a4e2d1abb4dc8be848448863f7d58ce20705e7b
          test "$(git rev-parse HEAD^{tree})" = 90ffab51a20640a4e3f6f07122a8e6e147592f64
          test "$(git rev-parse HEAD:src)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          git diff --name-only 8cd4b78ec27ced5657888a692a32bad1cc953fcd...HEAD | sort > "$EVID/actual-docs-delta.txt"
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.34.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md | sort > "$EVID/expected-docs-delta.txt"
          diff -u "$EVID/expected-docs-delta.txt" "$EVID/actual-docs-delta.txt"
          test -z "$(git diff --name-only 8cd4b78ec27ced5657888a692a32bad1cc953fcd...HEAD -- src)"
          test "$(cat VERSION)" = 2.34.0
          test "$(cat src/VERSION.txt)" = 2.34.0
          grep -Fx "define('VF_VERSION', '2.34.0');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .candidate_version VF_PROJECT.json)" = 2.34.0
          test "$(jq -r .candidate_schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .candidate_state VF_PROJECT.json)" = READY_FOR_L3_RELEASE_GATE
          test "$(jq -r .current_change.gates.candidate_readiness VF_PROJECT.json)" = 33314444500
          test "$(jq -r .current_change.versioned_candidate_source VF_PROJECT.json)" = 8cd4b78ec27ced5657888a692a32bad1cc953fcd
          test "$(jq -r .current_change.runtime_tree VF_PROJECT.json)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'NOT_STARTED / CANDIDATE ONLY'
          test "$(jq -r .v2_34_tag_state VF_PROJECT.json)" = NOT_CREATED
          test "$(jq -r .core_updates_v2_34_state VF_PROJECT.json)" = NOT_PUBLISHED
          grep -F 'PASS / READY_FOR_L3_RELEASE_GATE' docs/evidence/P01_V2.34.0_CANDIDATE_READINESS_20260830.md >/dev/null
          grep -F 'Unified Gate Run: 33314444500 / PASS' docs/evidence/P01_V2.34.0_CANDIDATE_READINESS_20260830.md >/dev/null
          git fetch origin main --quiet
          test "$(git rev-parse refs/remotes/origin/main)" = 2733f9687a9f72d740b6289d938a9f0e01e62e4f
          if git ls-remote --exit-code --tags origin refs/tags/v2.34.0 >/dev/null 2>&1; then echo 'UNEXPECTED_V234_TAG'; exit 1; fi
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2340_FINAL_METADATA_FENCE=PASS
          FINAL_CANDIDATE_SOURCE=4a4e2d1abb4dc8be848448863f7d58ce20705e7b
          FINAL_CANDIDATE_TREE=90ffab51a20640a4e3f6f07122a8e6e147592f64
          RUNTIME_TREE=f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          VERSION=2.34.0
          SCHEMA=2026082901
          CANDIDATE_STATE=READY_FOR_L3_RELEASE_GATE
          UNIFIED_CANDIDATE_GATE=33314444500 PASS
          MAIN=2733f9687a9f72d740b6289d938a9f0e01e62e4f
          V2_34_TAG=ABSENT
          CORE_UPDATES_V2_34=NOT_PUBLISHED
          OWNER_PRODUCTION_WRITE=NO
          FORMAL_RELEASE=NOT_STARTED
          EOF
          cat "$EVID/verdict.txt"

      - name: Upload final metadata fence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-final-metadata-fence-${{ github.run_id }}
          path: /tmp/p01-v2340-final-metadata-fence
          if-no-files-found: warn
          retention-days: 30
