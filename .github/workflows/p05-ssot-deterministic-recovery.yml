name: P05 SSOT Deterministic Recovery Dual Clean

on:
  push:
    branches:
      - task/p05-ssot-recovery-20260815

permissions:
  contents: read

jobs:
  recover_a:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require private read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
      - name: Checkout exact accepted P05 source in clean workspace A
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: e2b418c4a7fb81540e49eb7ef7241806bd3cfb96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p05-a
          fetch-depth: 1
          persist-credentials: false
      - name: Deterministic recovery A
        shell: bash
        run: |
          set -euo pipefail
          cd p05-a
          test "$(git rev-parse HEAD)" = "e2b418c4a7fb81540e49eb7ef7241806bd3cfb96"
          PRE="$(git hash-object docs/authority/SSOT.md)"
          echo "A_PRE_SEAL_SSOT_BLOB=$PRE"
          test "$PRE" = "9021c5e1db72fd874b07c98c648c5547e0431262"
          PHASE2_VERIFIED_SOURCE_COMMIT=e2b418c4a7fb81540e49eb7ef7241806bd3cfb96 GITHUB_RUN_ID=31873814411 node scripts/seal-phase2.mjs
          OUT="$(git hash-object docs/authority/SSOT.md)"
          echo "A_RECOVERED_SSOT_BLOB=$OUT"
          test "$OUT" = "02b590506d0b86e50bf2927f03e9ab3d3e64546a"
          python3 - <<'PY'
          from pathlib import Path
          b=Path('docs/authority/SSOT.md').read_bytes()
          t=b.decode('utf-8')
          assert t.startswith('# VF SEO · Current Engineering SSOT')
          assert not t.lstrip().startswith('IyB')
          assert 'Product Authority: VF-SEO-RPD@1.0 · CURRENT / SEALED' in t
          assert '# Phase 2 Security / Data Safety Current Seal' in t
          assert '- State: PASS / CLOSED' in t
          assert '- S-001 ～ S-018: PASS' in t
          assert '- Candidate / Production: NONE / NONE' in t
          assert '- Next: RETURN_TO_MASTER_FOR_PHASE_3_AUTHORIZATION' in t
          assert 'Phase 3: PASS' not in t
          PY

  recover_b:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require private read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"
      - name: Checkout exact accepted P05 source in clean workspace B
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: e2b418c4a7fb81540e49eb7ef7241806bd3cfb96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p05-b
          fetch-depth: 1
          persist-credentials: false
      - name: Deterministic recovery B
        shell: bash
        run: |
          set -euo pipefail
          cd p05-b
          test "$(git rev-parse HEAD)" = "e2b418c4a7fb81540e49eb7ef7241806bd3cfb96"
          PRE="$(git hash-object docs/authority/SSOT.md)"
          echo "B_PRE_SEAL_SSOT_BLOB=$PRE"
          test "$PRE" = "9021c5e1db72fd874b07c98c648c5547e0431262"
          PHASE2_VERIFIED_SOURCE_COMMIT=e2b418c4a7fb81540e49eb7ef7241806bd3cfb96 GITHUB_RUN_ID=31873814411 node scripts/seal-phase2.mjs
          OUT="$(git hash-object docs/authority/SSOT.md)"
          echo "B_RECOVERED_SSOT_BLOB=$OUT"
          test "$OUT" = "02b590506d0b86e50bf2927f03e9ab3d3e64546a"
          python3 - <<'PY'
          from pathlib import Path
          b=Path('docs/authority/SSOT.md').read_bytes()
          t=b.decode('utf-8')
          assert t.startswith('# VF SEO · Current Engineering SSOT')
          assert not t.lstrip().startswith('IyB')
          assert 'Product Authority: VF-SEO-RPD@1.0 · CURRENT / SEALED' in t
          assert '# Phase 2 Security / Data Safety Current Seal' in t
          assert '- State: PASS / CLOSED' in t
          assert '- S-001 ～ S-018: PASS' in t
          assert '- Candidate / Production: NONE / NONE' in t
          assert '- Next: RETURN_TO_MASTER_FOR_PHASE_3_AUTHORIZATION' in t
          assert 'Phase 3: PASS' not in t
          PY

  deterministic_gate:
    runs-on: ubuntu-24.04
    needs: [recover_a, recover_b]
    steps:
      - name: Dual clean recovery passed
        run: echo "DETERMINISTIC_SSOT_RECOVERY=PASS"
