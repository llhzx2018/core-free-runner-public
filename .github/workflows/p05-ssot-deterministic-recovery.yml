name: P05 SSOT Deterministic Recovery

on:
  push:
    branches:
      - task/p05-ssot-recovery-20260815

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Require private read credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}"

      - name: Checkout exact accepted P05 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: e2b418c4a7fb81540e49eb7ef7241806bd3cfb96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p05
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pre-seal SSOT and execute existing seal logic
        shell: bash
        run: |
          set -euo pipefail
          cd p05
          test "$(git rev-parse HEAD)" = "e2b418c4a7fb81540e49eb7ef7241806bd3cfb96"
          PRE="$(git hash-object docs/authority/SSOT.md)"
          echo "PRE_SEAL_SSOT_BLOB=$PRE"
          test "$PRE" = "9021c5e1db72fd874b07c98c648c5547e0431262"
          PHASE2_VERIFIED_SOURCE_COMMIT=e2b418c4a7fb81540e49eb7ef7241806bd3cfb96 GITHUB_RUN_ID=31873814411 node scripts/seal-phase2.mjs
          cp docs/authority/SSOT.md /tmp/RECOVERED_SSOT.md

      - name: Exact recovery proof and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('/tmp/RECOVERED_SSOT.md')
          b=p.read_bytes()
          text=b.decode('utf-8')
          assert text.startswith('# VF SEO · Current Engineering SSOT')
          assert 'Product Authority: VF-SEO-RPD@1.0 · CURRENT / SEALED' in text
          assert 'Working Version: 1.0.0' in text or 'Version: 1.0.0' in text
          assert 'Schema: VF-SEO-SCHEMA@1 / 1' in text
          assert 'Phase 1: PASS / CLOSED' in text
          assert '# Phase 2 Security / Data Safety Current Seal' in text
          assert '- State: PASS / CLOSED' in text
          assert '- S-001 ～ S-018: PASS' in text
          assert '- Candidate / Production: NONE / NONE' in text
          assert '- Next: RETURN_TO_MASTER_FOR_PHASE_3_AUTHORIZATION' in text
          assert 'Phase 3: PASS' not in text
          assert 'Phase 3: PASS / CLOSED' not in text
          assert not text.lstrip().startswith('IyB')
          Path('/tmp/RECOVERED_SSOT.base64').write_bytes(base64.b64encode(b))
          PY
          GOOD="$(git -C p05 hash-object /tmp/RECOVERED_SSOT.md)"
          BAD_RECON="$(git -C p05 hash-object /tmp/RECOVERED_SSOT.base64)"
          echo "RECOVERED_SSOT_BLOB=$GOOD"
          echo "RECONSTRUCTED_BAD_BLOB=$BAD_RECON"
          test "$BAD_RECON" = "7c3a3b3aa3c72be814ee4a21cd5c9680f3048211"
          test "$(grep -c '^| S-[0-9][0-9][0-9] |.*| PASS |$' p05/docs/authority/ACCEPTANCE_MATRIX.md)" -eq 18
          grep -q '"phase_1": "PASS_CLOSED"' p05/VF_PROJECT.json
          grep -q '"phase_2": "PASS_CLOSED"' p05/VF_PROJECT.json
          grep -q '"phase_3": "NOT_STARTED"' p05/VF_PROJECT.json
          grep -q '"candidate_version": null' p05/VF_PROJECT.json
          grep -q '"production_version": null' p05/VF_PROJECT.json
          grep -q '"product_failure": null' p05/VF_PROJECT.json
          grep -q '"project_block": null' p05/VF_PROJECT.json
          test "$(cat p05/VERSION)" = "1.0.0"
          grep -q '"schema_identity": "VF-SEO-SCHEMA@1"' p05/VF_PROJECT.json
          grep -q '"schema_version": 1' p05/VF_PROJECT.json
          test -f p05/docs/evidence/PHASE2_SECURITY_DATA_SAFETY_20260815.md
          test -f p05/docs/evidence/PHASE2_SOURCE_MANIFEST.sha256
          test "$(find p05 -type f -name 'phase2-upload*' | wc -l)" -eq 0
          printf 'PRE_SEAL_SSOT_BLOB=%s\nRECOVERED_SSOT_BLOB=%s\nRECONSTRUCTED_BAD_BLOB=%s\nSSOT_EXACT_RECOVERY=PASS_PROVEN_BY_BAD_BLOB_HASH_RECONSTRUCTION\n' \
            "$(git -C p05 hash-object e2b418c4a7fb81540e49eb7ef7241806bd3cfb96:docs/authority/SSOT.md 2>/dev/null || echo 9021c5e1db72fd874b07c98c648c5547e0431262)" \
            "$GOOD" "$BAD_RECON" > /tmp/proof.txt

      - name: Encrypt recovered SSOT for private handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recovery-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAjyQaxM63E8Re/NmL9/6p
          m7DmPEVQTfzB+r0wIO4ypUw5sPo7R/gf+xB3E8be2PJvSjIxhLiHtfAFOZTJhfOV
          gX+s/OdgNG5LYJYgDMnLvIpBj/goicBJRG1fF57hxIldcXJqFWG53eKN/+lnnIEJ
          8/CSvp1CHopBUAQvu6Wht3KiJ7udDCVX7j853OwB/zphcKATfKzqz+Bf+JpTyGXn
          gxHHk2QydiAUzbJjDSGux5Rq4srOj1QAtff7NycH+fuayymSQ2XrurniaqxL0ODi
          NeWUkm0fBas7Mh/OOmPPk++TaESAbxpCAjv9AKBjj8kAbrYF/lZAcE6ieAJRUeAD
          hJIm5fOJEAAKyDp6uVVrYrkNPq12j0Qw14bryz9NmBftDdpGemq5wXqihNcvzl9x
          D2o4oDBPxlcnXYsSeKTok6w/pwSKec1a+NSC/4Xh+dj4NCPCfJ6eKJbnzGqUHAYp
          9THAMyodcN3VF18XLxNT0rheI4dHf8iL3Vciv6Mc7WHvAgMBAAE=
          -----END PUBLIC KEY-----
          PEM
          openssl rand -hex 32 > /tmp/recovery-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -pass file:/tmp/recovery-key.txt -in /tmp/RECOVERED_SSOT.md -out /tmp/RECOVERED_SSOT.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public.pem -in /tmp/recovery-key.txt -out /tmp/RECOVERED_SSOT.key.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          rm -f /tmp/recovery-key.txt /tmp/RECOVERED_SSOT.base64 /tmp/RECOVERED_SSOT.md

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: p05-ssot-recovery-encrypted-20260815
          path: |
            /tmp/RECOVERED_SSOT.enc
            /tmp/RECOVERED_SSOT.key.enc
            /tmp/proof.txt
          if-no-files-found: error
          retention-days: 1
