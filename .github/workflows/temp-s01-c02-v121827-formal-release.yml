name: TEMP S01-C02 Ops 1.21.827 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121827-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 3a59068c8e9c6adc533e37883f48bd38224e7362
      TREE: 5d4378a15d3c2a14da603cebe27348df502b32aa
      TAG: v1.21.827
      ASSET: vf-tools-ops_V1.21.827.zip
      BYTES: '3247976'
      SHA256: 903a315c934c8437e980bfd9d6776b0be08f597464a02d1a44006d40ab1c13a2
      FILES: '909'
      FP: 795a5fd53b8a36c04599a4fe4a45c1416f9abf91c91d910a461ec5b21641226a
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          code="$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$code" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops tag "$TAG" "$COMMIT"
          git -C ops push origin "refs/tags/$TAG"
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.827 closes the no-reupload restart gap after a terminal failed Static Candidate.

          - Focused Gate 33983377523 PASS on exact source 3a59068c8e9c6adc533e37883f48bd38224e7362 / tree 5d4378a15d3c2a14da603cebe27348df502b32aa; deterministic artifact identity 33983421972 PASS.
          - When the active release job is a terminal failed Candidate and its private Source ZIP is still readable, the bridge requires the durable S01 source SHA authority and exact hash equality before doing anything.
          - It then copies the same trusted Source into a fresh inspect-only job through the existing V1.21.814 trusted-source service. Source inspection is never skipped.
          - No Source ZIP upload is required; no WordPress source content is mutated.
          - Existing inspection -> release prepare -> Candidate promotion remains authoritative. Candidate verdict, Final Audit, package readiness and finalOnlinePass are not relaxed or forced.
          - V1.21.826 Candidate route normalization remains unchanged and is exercised only by the new Candidate job after Production upgrades.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.827.zip; 3247976 bytes; SHA256 903a315c934c8437e980bfd9d6776b0be08f597464a02d1a44006d40ab1c13a2; runtime files 909; fingerprint 795a5fd53b8a36c04599a4fe4a45c1416f9abf91c91d910a461ec5b21641226a.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --title 'VF Tools Ops v1.21.827' --notes-file /tmp/release-notes.md --verify-tag
