name: P04 V2.5.3 Target Source Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-target-source-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Build patched target and inspect trust references
        env:
          TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          git clone -q "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-infra.git" repo
          git clone -q https://github.com/llhzx2018/core-free-runner-public.git runner-tools
          cd repo; git checkout -q hotfix/p04-v2.5.3-settings-maintenance-ui-20260816
          test "$(git rev-parse HEAD)" = 91984268ffe66781700db9da10de8d509c878c0b
          python3 ../runner-tools/ops/p04/v253_hotfix_patch.py .
          python3 ../runner-tools/ops/p04/v253_hotfix_postpatch.py .
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v253-target" >/dev/null
          echo 'REPO_PRIMARY_REFERENCES:'
          grep -RFn 'PRIMARY_KEY_ID' public src || true
          echo 'TARGET_PRIMARY_REFERENCES:'
          grep -RFn 'PRIMARY_KEY_ID' "$RUNNER_TEMP/v253-target" || true
          test -z "$(grep -RFl 'PRIMARY_KEY_ID' "$RUNNER_TEMP/v253-target" || true)"
          grep -Fq "required_key_id' => \$label" "$RUNNER_TEMP/v253-target/api.php"
          echo "TARGET_API_SHA=$(sha256sum "$RUNNER_TEMP/v253-target/api.php" | awk '{print $1}')"
          echo 'TARGET_SOURCE_RETIRED_REFERENCE_ZERO=PASS'
