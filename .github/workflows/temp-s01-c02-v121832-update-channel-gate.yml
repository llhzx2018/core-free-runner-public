name: TEMP S01-C02 Ops 1.21.832 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121832-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121832-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPDATE_REPO: llhzx2018/core-updates
      BASE: 967c714b2e2999498a3fedfc62d43117e769f23c
      CANDIDATE: c572fae897646a9400f18870fa4bada3f7758a2a
      PRODUCT_COMMIT: 02fb592cc6aacfcf8c0a39c9a648a08977820b44
      PRODUCT_TREE: b90f4de92921860b62d9f36f3292e8138f6ba951
      RELEASE_ID: '383354681'
      ASSET_ID: '546232351'
      ASSET: vf-tools-ops_V1.21.832.zip
      BYTES: '3260422'
      SHA256: baf078107c601ab8630c22685131087756f854b68c1b4b81501234cd012dd460
      FP: 833db33ff1e14b43f679770c27e6bad5750e06617e7d1e195718281cf0476ac8
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CANDIDATE"
          mapfile -t changed < <(git -C updates diff --name-only "$BASE" "$CANDIDATE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'projects/S01-C02.json'
          M=updates/projects/S01-C02.json
          test "$(jq -r .target_version "$M")" = '1.21.832'
          test "$(jq -r '.from_versions|join(",")' "$M")" = '1.21.831'
          test "$(jq -r .release_tag "$M")" = 'v1.21.832'
          test "$(jq -r .asset_name "$M")" = "$ASSET"
          test "$(jq -r .asset_bytes "$M")" = "$BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$SHA256"
          test "$(jq -r .runtime_files "$M")" = '914'
          test "$(jq -r .runtime_fingerprint "$M")" = "$FP"
          RLS="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.832)"
          test "$(jq -r .id <<<"$RLS")" = "$RELEASE_ID"
          test "$(jq -r .target_commitish <<<"$RLS")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.assets[0].id' <<<"$RLS")" = "$ASSET_ID"
          test "$(jq -r '.assets[0].name' <<<"$RLS")" = "$ASSET"
          test "$(jq -r '.assets[0].size' <<<"$RLS")" = "$BYTES"
          test "$(jq -r '.assets[0].digest' <<<"$RLS")" = "sha256:$SHA256"
          for b in main develop; do
            P="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$b")"
            test "$(jq -r .commit.sha <<<"$P")" = "$PRODUCT_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$P")" = "$PRODUCT_TREE"
          done
      - name: Verify direct Production remains 1.21.831 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          test "$(jq -r .pluginVersion <<<"$J")" = '1.21.831'
          test "$(jq -r .activeStaticJobStatus <<<"$J")" = 'FAIL'
          test "$(jq -r .sourceRecoveryCandidateCurrentStage <<<"$J")" = '4'
          test "$(jq -r .sourceRecoveryCandidateBuildOffset <<<"$J")" = '225'
          test "$(jq -r .sourceRecoveryCandidateBuildTotal <<<"$J")" = '231'
          test "$(jq -r .sourceRecoveryCandidateTailProbeStatus <<<"$J")" = 'not_run'
          test "$(jq -r .candidatePackageReady <<<"$J")" = 'false'
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = 'false'
          test "$(jq -r .finalOnlinePass <<<"$J")" = 'NO'
      - name: Verify update authority and runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          U="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$U")" = "$BASE"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Seal result
        shell: bash
        run: echo PASS_V121832_UPDATE_CHANNEL_GATE
