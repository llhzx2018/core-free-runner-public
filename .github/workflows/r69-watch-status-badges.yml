name: R69 Focused Watch Status Badge Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r69-watch-status-badges.yml'

permissions:
  contents: read

jobs:
  r69-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 2837ee5d2489e2a479c280d98ab487f1ed16ff03
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 2837ee5d2489e2a479c280d98ab487f1ed16ff03
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/watch_status_context_badge_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          php tests/unit/start_popular_sort_control_contract.php
          echo R69_WATCH_STATUS_CONTEXT_BADGE_PASS
          echo R69_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
