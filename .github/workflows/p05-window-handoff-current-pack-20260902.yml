name: P05 Window Handoff Exact Current Pack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/p05-window-handoff-current-pack-20260902.yml'

permissions:
  contents: read

jobs:
  pack:
    if: github.head_ref == 'test/p05-window-handoff-current-pack-20260902'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout disposable runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact P05 current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: 9afdbb61a495af5ec34a2ee0ff573721602d50de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p05-current

      - name: Build exact current source and data snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p05-current rev-parse HEAD)" = '9afdbb61a495af5ec34a2ee0ff573721602d50de'
          rm -rf /tmp/p05-current-handoff
          mkdir -p /tmp/p05-current-handoff/P05_CURRENT_SOURCE_SNAPSHOT /tmp/p05-current-handoff/10_DATA
          rsync -a --exclude='.git' p05-current/ /tmp/p05-current-handoff/P05_CURRENT_SOURCE_SNAPSHOT/
          printf '%s\n' '9afdbb61a495af5ec34a2ee0ff573721602d50de' > /tmp/p05-current-handoff/CURRENT_MAIN_EXACT_COMMIT.txt
          printf '%s\n' '21e6602dbcbd04e44f9101ad83f8ad674bcd7d25' > /tmp/p05-current-handoff/CURRENT_MAIN_EXACT_TREE.txt
          git -C p05-current ls-files | sort > /tmp/p05-current-handoff/CURRENT_TRACKED_FILES.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          src=Path('p05-current/php/data/DEMO_DATASET_V1.json.gz.b64')
          out=Path('/tmp/p05-current-handoff/10_DATA/DEMO_DATASET_V1.json')
          meta=Path('/tmp/p05-current-handoff/10_DATA/DEMO_DATASET_README.txt')
          expected='f9722556109118edc8fe94471ebecd0679fafc10de7e2096423c8b69e8e83e06'
          raw=base64.b64decode(''.join(src.read_text(encoding='utf-8').split()))
          decoded=gzip.decompress(raw)
          json.loads(decoded.decode('utf-8'))
          out.write_bytes(decoded)
          actual=hashlib.sha256(decoded).hexdigest()
          meta.write_text('Dataset ID: P05_DEMO_V1\nProduct authority SHA-256: '+expected+'\nDecoded raw JSON SHA-256: '+actual+'\nSource: php/data/DEMO_DATASET_V1.json.gz.b64\n',encoding='utf-8')
          print('DEMO_DATASET_DECODED_SHA256='+actual)
          PY
          (cd /tmp/p05-current-handoff && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          echo 'P05_HANDOFF_EXACT_CURRENT_PACK=PASS'
          echo 'P05_PRODUCT_WRITE=0'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'

      - name: Upload exact current snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P05_WINDOW_HANDOFF_CURRENT_9afdbb61
          path: /tmp/p05-current-handoff
          if-no-files-found: error
          retention-days: 7
