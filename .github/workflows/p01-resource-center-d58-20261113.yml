name: P01 D58 Canonical Owner Resource Center Exact Source
on:
  push:
    branches:
      - test/p01-resource-center-d58-20261113

permissions:
  contents: read

jobs:
  resource-center:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Registered exact-source private read and public-safe input guard
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-resource-center-d58-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=D58_ONE_CANONICAL_ALL_RESOURCES_INDEX"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Transient private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 9f109f8bbf5ab9cf8f08449427416e9f0f639c50
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Lock candidate identity and essential files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9f109f8bbf5ab9cf8f08449427416e9f0f639c50"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/OwnerResourceCenter.php
          test -f candidate/src/app/next/frontend/src/OwnerResourceCenter.vue
          test -f candidate/tests/p01_d58_resource_center.php
          echo "P01_D58_EXACT_SOURCE=9f109f8bbf5ab9cf8f08449427416e9f0f639c50"
      - name: PHP syntax and locked Laravel synthetic SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite")&&extension_loaded("mbstring") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-mbstring >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          for f in candidate/src/app/next/OwnerResourceCenter.php candidate/src/app/next/D2CanonicalConnectionScope.php candidate/src/app/next/OwnerDataRuntime.php candidate/src/app/next/http/OwnerHttpRoutes.php candidate/tests/p01_d58_resource_center.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          echo "P01_D58_PHP_SYNTAX=PASS"
          cd candidate/src/app/next
          composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          test -f vendor/autoload.php
          cd ../../../
          if ! php tests/p01_d58_resource_center.php > "$RUNNER_TEMP/p01-sqlite.txt" 2>&1; then
            echo "P01_D58_REAL_SQLITE=FAIL"
            grep -E 'D58 FAIL|D58 UNSAFE|Fatal error|Uncaught|Exception|Error' "$RUNNER_TEMP/p01-sqlite.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 28 || true
            exit 1
          fi
          grep '^P01_D58_.*=PASS$' "$RUNNER_TEMP/p01-sqlite.txt"
          echo "P01_D58_REAL_SQLITE=PASS"
      - name: Vue typecheck full Vitest and production Vite compile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-types.txt" 2>&1; then
            echo "P01_D58_VUE_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|resource-center|OwnerResourceCenter|App.vue' "$RUNNER_TEMP/p01-types.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 25 || true
            exit 1
          fi
          echo "P01_D58_VUE_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D58_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError|Expected' "$RUNNER_TEMP/p01-unit.txt" | tail -n 20 || true
            exit 1
          fi
          echo "P01_D58_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D58_VITE_PRODUCTION_BUILD=PASS"
      - name: Full Chromium Owner workspace regression 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D58_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|Locator:|Expected:|Received:|resources-center.spec.ts:[0-9]+|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 38 || true
            exit 1
          fi
          echo "P01_D58_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Remove private source and temporary evidence, always
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PUBLIC_PRIVATE_ARTIFACTS=NONE"

  resource-center-final-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Guard exact final source and registered private read
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-resource-center-d58-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D58_FINAL_SCOPE=VISIBLE_GLOBAL_RESOURCE_ENTRY_AND_FULL_UI"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Exact private candidate checkout into transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 00d221d674b784b43ae11df780c8b3ac9eeca46d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Final TypeScript strict source and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "00d221d674b784b43ae11df780c8b3ac9eeca46d"
          test "$(cat candidate/VERSION)" = "2.47.516"
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D58_FINAL_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|resources-center|App.vue' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 25 || true
            exit 1
          fi
          echo "P01_D58_FINAL_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D58_FINAL_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 20 || true
            exit 1
          fi
          echo "P01_D58_FINAL_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D58_FINAL_VITE_BUILD=PASS"
      - name: Full Chromium regression 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-browser.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D58_FINAL_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|Locator:|Expected:|Received:|resources-center.spec.ts:[0-9]+|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 36 || true
            exit 1
          fi
          echo "P01_D58_FINAL_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always purge private source and temporary test files
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PUBLIC_PRIVATE_ARTIFACTS=NONE"
