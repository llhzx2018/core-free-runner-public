name: P01 V2.34 Strict Fresh Install Fence
on:
  push:
    branches: [task/p01-v2340-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2340-strict-fresh-install-fence-20260830.yml
      - scripts/p01-v2340-formal-fresh-fence.sh
permissions:
  contents: read
jobs:
  fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact V2.34 formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 518d10f446ea85445d1110a3defafc5bcbece473
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Strict fresh install verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(git -C candidate rev-parse HEAD^{tree})" = 90ffab51a20640a4e3f6f07122a8e6e147592f64
          test "$(git -C candidate rev-parse HEAD:src)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          bash runner/scripts/p01-v2340-formal-fresh-fence.sh
          grep -Fx P01_V2340_STRICT_FRESH_INSTALL=PASS /tmp/p01-v2340-strict-fresh-evidence/strict-fresh-verdict.txt >/dev/null
          echo P01_V2340_STRICT_FRESH_INSTALL_FENCE=PASS
          echo FORMAL_SOURCE=518d10f446ea85445d1110a3defafc5bcbece473
          echo RUNTIME_TREE=f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          echo SCHEMA=2026082901
          echo PRODUCT_BYTES_CHANGED=NO
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload strict fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-strict-fresh-install-${{ github.run_id }}
          path: /tmp/p01-v2340-strict-fresh-evidence
          if-no-files-found: warn
          retention-days: 30
