name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-archive-empty161-20261021]
    paths: ['.github/workflows/s01-archive-empty-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.161
  TARGET_SHA: 3fb4432fa30faabf6c61574f62a4d0bc796e2cc0
  TARGET_TREE: a836ab14d96289abb5eb3163d634a628c930b3d3
  BASE_SHA: 5eace6a0f761ddd7d6736591782b24d3c2bd4b2f
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3fb4432fa30faabf6c61574f62a4d0bc796e2cc0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39587932522 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39587932522 --jq .head_sha)" = bdd9d6ba79d6482adefd973ef9bc7c18f121b99d
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39587932522 --repo llhzx2018/core-free-runner-public --name s01-archive-empty-39587932522 --dir candidate-proof
          python3 control/lanes/s01-archive-empty161-20261021/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='09fddf0506c741f7e0deec6f8bcbf5ebd5d3c2a3cecb381a6e0645bc01b379ee' and new['bytes']==1974754
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.161 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.161 provider/vf-tools-theme_V1.35.161.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.161' --notes '归档本地筛选无匹配时真正隐藏旧文章卡片，并显现原有清除筛选入口；清除与Escape恢复内容。保留作者/分类/标签/日期范围、原生搜索和分页、既有SEO及日期归档开关。定向桌面浏览器、160→161原生升级回退重装与数据保护PASS。M3U8保持1.25.94；Owner手工升级Production后验收，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.161 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.161 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.161 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.161.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.161.zip remote/vf-tools-theme_V1.35.161.zip
          echo '09fddf0506c741f7e0deec6f8bcbf5ebd5d3c2a3cecb381a6e0645bc01b379ee  remote/vf-tools-theme_V1.35.161.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.161.zip)" = 1974754
          gh release view v1.35.161 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-archive-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
