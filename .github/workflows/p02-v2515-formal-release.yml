name: P02 V2.5.15 Formal Verify And Publish

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2515-formal-release.yml'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered capabilities
        env:
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: b13def8f6b2b683fee8ed0e4bd17c7964b7b1c43
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize sealed formal pipeline for V2.5.15
        env:
          PRODUCT_REF: b13def8f6b2b683fee8ed0e4bd17c7964b7b1c43
          RELEASE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          git fetch origin task/p02-v2511-formal-release
          git show FETCH_HEAD:scripts/p02-v2510-formal-release.sh > "$RUNNER_TEMP/p02-v2515-formal.sh"
          python3 - "$RUNNER_TEMP/p02-v2515-formal.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text(encoding='utf-8')
          s=s.replace('2.5.10','2.5.15')
          s=s.replace('2.5.9','2.5.13')
          s=s.replace('32225789953','32239590775')
          s=s.replace('test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 72','test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74')
          marker="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
          end="''')\n arts=[sz,fz,uz,az,rf,notes]"
          if marker in s and end in s:
              i=s.index(marker);j=s.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}\n\nV2.5.15 is a corrective online-update release after authenticated OWNER readback proved Production had already reached V2.5.13.\n\n- Keeps the already verified Scratch writing typography refinement: Chinese-first writing font stack, Desktop 17px / 1.88 line-height, normal letter spacing, approximately 920px centered text measure, and Mobile 16px / 1.82 with 18px safe padding.\n- Adds no new product functionality beyond the V2.5.14 runtime behavior.\n- Provides the canonical direct Atomic path from authenticated Production {SRCVER} to V{VER}.\n- Does not rewrite the published V2.5.14 Release; V2.5.14 remains historical evidence.\n- Candidate Runner 32239590775 PASS: source/privacy gates, 74-file SOURCE_MANIFEST, Fresh Install, real Chromium desktop/mobile typography, Scratch autosave, SQLite integrity/FK.\n- Schema remains {SCHEMA}; no migration.\n''')\n arts=[sz,fz,uz,az,rf,notes]"""
              s=s[:i]+notes+s[j+len(end):]
          p.write_text(s,encoding='utf-8')
          PY
          bash "$RUNNER_TEMP/p02-v2515-formal.sh"
