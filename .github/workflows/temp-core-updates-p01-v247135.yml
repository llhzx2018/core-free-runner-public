name: Core Updates P01 V2.47.135 Distribution Gate

on:
  push:
    branches:
      - test-core-updates-p01-v247135-20260930
    paths:
      - '.github/workflows/temp-core-updates-p01-v247135.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 4285ef76465ae8494c2b5f6990c16740005fe6ba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Manifest contract
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.134" and
            .target_version=="2.47.135" and
            .release_tag=="v2.47.135" and
            .release_id==399978968 and
            .product_identity=="27650c6465ffa3252ddb474f697837d21e885ddf" and
            .asset_name=="VF_Start_V2.47.135_UPDATE.zip" and
            .asset_bytes==2072940 and
            .asset_sha256=="66dad52e07812853f357cb776c71dd3f6a7fc05b3e7eff9e3c33bec939692fc9"
          ' projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V247135_MANIFEST=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo CORE_UPDATES_P01_V247135_PHP_LINT=PASS

      - name: Update Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php update-core/php/tests/run.php
          echo CORE_UPDATES_P01_V247135_REGRESSION=PASS
