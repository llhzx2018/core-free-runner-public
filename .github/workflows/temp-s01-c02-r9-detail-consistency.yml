name: TEMP S01-C02 R9 Detail Consistency

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-r9-detail-consistency.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: 452e3b6132c67e67741598162fbb206bd0b5c3de

    steps:
      - name: Checkout exact R9 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - name: Contract and package
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$PRODUCT_SHA"
          php target/tests/s01-c02-prod-realuse-r9-detail-consistency-contract.php
          python3 - <<'PY'
          import re,zipfile
          from pathlib import Path
          root=Path('target'); out=Path('/tmp/vf-tools-ops-r9.zip')
          def keep(rel):
              p=rel.as_posix(); parts=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return parts[0] in {'includes','assets','languages','config'}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if path.is_file() and not path.is_symlink():
                      rel=path.relative_to(root)
                      if keep(rel): z.write(path,'vf-ops/'+rel.as_posix())
          PY
          unzip -tq /tmp/vf-tools-ops-r9.zip

      - name: Boot disposable WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          NET="vf-r9-${GITHUB_RUN_ID}"; DB="vf-r9-db-${GITHUB_RUN_ID}"; WP="vf-r9-wp-${GITHUB_RUN_ID}"
          PORT="$((24000 + (GITHUB_RUN_ID % 5000)))"
          cleanup(){ docker rm -f "$WP" "$DB" >/dev/null 2>&1 || true; docker network rm "$NET" >/dev/null 2>&1 || true; }
          trap cleanup EXIT; cleanup; docker network create "$NET" >/dev/null
          docker run -d --name "$DB" --network "$NET" -e MARIADB_DATABASE=vf_test -e MARIADB_USER=vf_runner -e MARIADB_PASSWORD=vf_runner_ephemeral -e MARIADB_ROOT_PASSWORD=vf_root_ephemeral mariadb:11.8.8 >/dev/null
          for i in $(seq 1 40); do docker exec "$DB" mariadb-admin ping -uroot -pvf_root_ephemeral --silent >/dev/null 2>&1 && break || sleep 2; done
          docker run -d --name "$WP" --network "$NET" -p "127.0.0.1:${PORT}:80" -e WORDPRESS_DB_HOST="$DB:3306" -e WORDPRESS_DB_USER=vf_runner -e WORDPRESS_DB_PASSWORD=vf_runner_ephemeral -e WORDPRESS_DB_NAME=vf_test wordpress:7.0.2-php8.4-apache >/dev/null
          for i in $(seq 1 40); do curl -fsS "http://127.0.0.1:${PORT}/wp-login.php" >/dev/null 2>&1 && break || sleep 2; done
          curl -fsSL https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o /tmp/wp-cli.phar
          docker cp /tmp/wp-cli.phar "$WP:/usr/local/bin/wp"; docker exec "$WP" chmod +x /usr/local/bin/wp
          docker cp /tmp/vf-tools-ops-r9.zip "$WP:/tmp/vf-tools-ops-r9.zip"
          BASE_URL="http://127.0.0.1:${PORT}"
          docker exec "$WP" wp core install --allow-root --path=/var/www/html --url="$BASE_URL" --title='VF R9' --admin_user=admin --admin_password='VF-R9-Proof!' --admin_email=fixture@example.invalid --skip-email >/dev/null
          docker exec "$WP" wp plugin install /tmp/vf-tools-ops-r9.zip --activate --force --allow-root --path=/var/www/html >/dev/null
          for i in $(seq 1 18); do docker exec "$WP" wp post create --allow-root --path=/var/www/html --post_type=post --post_status=publish --post_title="R9 Sample $i" --post_content="R9 sample $i" >/dev/null; done
          echo "VF_BASE_URL=$BASE_URL" >> "$GITHUB_ENV"; echo "VF_WP_CONTAINER=$WP" >> "$GITHUB_ENV"; echo "VF_DB_CONTAINER=$DB" >> "$GITHUB_ENV"; echo "VF_DOCKER_NETWORK=$NET" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Browser detail proof
        shell: bash
        env:
          WP_ADMIN_PASSWORD: VF-R9-Proof!
        run: |
          set -Eeuo pipefail
          cd target/.github/phase3
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/r9.js <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          const fs=require('fs');
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1440,height:1000}});
            const base=process.argv[2], out={checks:{},routes:[],errors:[]};
            p.on('pageerror',e=>out.errors.push(String(e)));
            await p.goto(base+'/wp-login.php',{waitUntil:'domcontentloaded'});
            await p.fill('#user_login','admin'); await p.fill('#user_pass',process.env.WP_ADMIN_PASSWORD);
            await Promise.all([p.waitForNavigation({waitUntil:'domcontentloaded'}),p.click('#wp-submit')]);

            await p.goto(base+'/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow&workspace=articles',{waitUntil:'domcontentloaded'});
            const cb=p.locator('.vf-content-manager-row-check').first();
            if(!(await cb.count())) throw new Error('content checkbox missing');
            const cbb=await cb.boundingBox();
            out.checks.checkbox={width:cbb.width,height:cbb.height,square:Math.abs(cbb.width-cbb.height)<=1 && cbb.width>=17 && cbb.width<=21};

            await p.goto(base+'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=keywords',{waitUntil:'domcontentloaded'});
            const domain=p.locator('.vf-console-domain-nav-desktop .vf-v6-domain-menu[data-vf-s01-domain="content_seo"]');
            await domain.locator(':scope > summary').click();
            const refine=domain.locator('.vf-v6-domain-flyout a').filter({hasText:'单页精修'}).first();
            await refine.click();
            await sleep(900);
            const title=(await p.locator('.vf-v6-page-canvas h1, .vf-page-canvas h1').first().innerText()).trim();
            const activeTexts=await p.locator('.vf-console-domain-nav-desktop .vf-v6-domain-flyout a.is-current').allInnerTexts();
            out.checks.flyout={title,activeTexts,pass:title==='单页精修'&&activeTexts.length===1&&activeTexts[0].trim()==='单页精修'};

            await p.goto(base+'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=links',{waitUntil:'domcontentloaded'});
            const filter=p.locator('.vf-links-filter.is-compact').first();
            if(await filter.count()){
              const select=filter.locator('select').first(), btn=filter.locator('.button,button').last();
              if(await select.count() && await btn.count()){
                const sb=await select.boundingBox(), bb=await btn.boundingBox();
                out.checks.controlHeights={select:sb.height,button:bb.height,pass:Math.abs(sb.height-bb.height)<=1 && Math.abs(sb.height-40)<=1};
              }
            }
            const head=p.locator('.vf-links-head').first();
            if(await head.count()){
              const hb=await head.boundingBox();
              out.checks.linksHead={height:hb.height,pass:hb.height<=78};
            }

            await p.goto(base+'/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=keywords',{waitUntil:'domcontentloaded'});
            const code=p.locator('.vf-keyword-map-table td:first-child>code').first();
            if(await code.count()) out.checks.keywordDuplicate={display:await code.evaluate(el=>getComputedStyle(el).display),pass:(await code.evaluate(el=>getComputedStyle(el).display))==='none'};

            for(const [name,url] of [
              ['content','/wp-admin/admin.php?page=vf-toolsite-content&tab=workflow&workspace=articles'],
              ['keywords','/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=keywords'],
              ['refine','/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=refine'],
              ['links','/wp-admin/admin.php?page=vf-toolsite-seo-keywords&tab=planner&workspace=links']
            ]){
              const res=await p.goto(base+url,{waitUntil:'domcontentloaded'});
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1);
              out.routes.push({name,status:res.status(),overflow,pass:res.status()<400&&!overflow});
            }
            const required=['checkbox','flyout','controlHeights','linksHead'];
            const pass=out.errors.length===0 && required.every(k=>out.checks[k]&&out.checks[k].pass) && out.routes.every(r=>r.pass);
            out.result=pass?'PASS':'FAIL';
            fs.mkdirSync(process.argv[3],{recursive:true});
            fs.writeFileSync(process.argv[3]+'/r9-detail.json',JSON.stringify(out,null,2));
            console.log(JSON.stringify(out,null,2));
            await b.close();
            if(!pass) process.exit(2);
          })().catch(e=>{console.error(e);process.exit(2)});
          JS
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          node /tmp/r9.js "$VF_BASE_URL" "$GITHUB_WORKSPACE/evidence"
          echo 'R9_DETAIL_BROWSER=PASS'

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-r9-detail-consistency
          path: evidence/r9-detail.json
          retention-days: 14

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker rm -f "${VF_WP_CONTAINER:-}" "${VF_DB_CONTAINER:-}" >/dev/null 2>&1 || true
          docker network rm "${VF_DOCKER_NETWORK:-}" >/dev/null 2>&1 || true
