name: P01 IA6 492 four protected fallbacks (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-492-recycle-native-once.yml']
permissions:
  contents: read
jobs:
  exact-source-fallbacks:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-ia6-legacy-gui-final-retirement-20261104
      PRODUCT_SHA: 268c695b6db584b7c344e70a2d27d0f7f1b5d67a
      PRODUCT_VERSION: 2.47.492
      P01_TEST_ORIGIN: http://127.0.0.1:18631
      P01_TEST_PASSWORD: P01Ia6SyntheticTransfer2026!
    steps:
      - name: Checkout registered Public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare synthetic PHP SQLite and Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Pin exact private product source with runtime secret
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_FOUR_FALLBACKS_EXACT_SOURCE=PASS
      - name: Verify four protected fallback/source and legacy safety gates
        shell: bash
        run: |
          set -Eeuo pipefail
          for p in surface-manager.php data-safety.php update.php update-credential.php; do
            php -l "candidate/src/$p" >/dev/null
          done
          node --check candidate/tests/unit/p01_ia6_four_fallbacks_contract.cjs
          (cd candidate && node tests/unit/p01_ia6_four_fallbacks_contract.cjs)
          (cd candidate && node tests/unit/p01_ia6_data_safety_readonly_parity_r8_contract.cjs)
          (cd candidate && php tests/unit/admin_update_credential_r27_contract.php)
          (cd candidate && node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs)
          echo P01_IA6_FOUR_FALLBACKS_SOURCE_CONTRACTS=PASS
      - name: Isolated four fallback Guest Owner GET POST CSRF and method gating
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-492-transfer
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:18631 -t . >/tmp/p01-ia6-492-php.log 2>&1 & echo $! >/tmp/p01-ia6-492-php.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-492-cookie -b /tmp/p01-ia6-492-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-492-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          source=open('/tmp/p01-ia6-492-setup.html',encoding='utf-8').read()
          token=re.search(r'name="setup_csrf"\s+value="([^"]+)"',source)
          assert token
          print(token.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-492-cookie -b /tmp/p01-ia6-492-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Recycle Synthetic Fixture" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-492-installed.html
          code="$(curl -s -o /dev/null -w '%{http_code}' "$P01_TEST_ORIGIN/recycle-bin.php")"
          test "$code" = 403
          code="$(curl -s -X POST -o /dev/null -w '%{http_code}' "$P01_TEST_ORIGIN/recycle-bin.php")"
          test "$code" = 403
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node --check candidate/tests/integration/p01_ia6_four_fallbacks_http_browser.mjs
          node candidate/tests/integration/p01_ia6_four_fallbacks_http_browser.mjs
          echo P01_IA6_FOUR_FALLBACKS_INSTALLED_HTTP=PASS
      - name: Erase ephemeral checkout and fixture
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-492-php.pid; then kill "$(cat /tmp/p01-ia6-492-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-492-transfer candidate
          echo P01_IA6_TRANSFER_CLEANUP=PASS
