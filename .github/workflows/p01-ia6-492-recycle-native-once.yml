name: P01 IA6 492 native Recycle and Toolbox parity (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-492-recycle-native-once.yml']
permissions:
  contents: read
jobs:
  exact-source-recycle:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-ia6-legacy-gui-final-retirement-20261104
      PRODUCT_SHA: 7c261f910d6c8646d8a2fc90057dce6d85378a11
      PRODUCT_VERSION: 2.47.492
      P01_TEST_ORIGIN: http://127.0.0.1:18631
      P01_TEST_PASSWORD: P01Ia6SyntheticTransfer2026!
    steps:
      - name: Checkout registered Public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare synthetic PHP SQLite and Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
      - name: Pin exact private product source with runtime secret
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_RECYCLE_EXACT_SOURCE=PASS
      - name: Verify updated historical Recycle UI contracts against exact native source
        shell: bash
        run: |
          set -Eeuo pipefail
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          (
            cd candidate
            for t in \
              tests/unit/admin_recycle_bin_page6_polish_contract.php \
              tests/unit/admin_recycle_bin_r11_contract.php \
              tests/unit/admin_recycle_bin_r12_pagination_contract.php \
              tests/unit/recycle_archive_unified_view_contract.php \
              tests/unit/recycle_bin_action_density_contract.php \
              tests/unit/recycle_bin_admin_return_contract.php \
              tests/unit/recycle_bin_deleted_archive_clarity_v247289_contract.php \
              tests/unit/recycle_bin_direct_open_contract.php \
              tests/unit/recycle_bin_inline_more_v247293_contract.php \
              tests/unit/recycle_bin_restore_target_v247290_contract.php \
              tests/unit/recycle_bin_safe_selection_v247291_contract.php \
              tests/unit/recycle_bin_scrollbar_v247294_contract.php \
              tests/unit/recycle_destructive_scope_safe_link_contract.php \
              tests/unit/recycle_mobile_card_labels_contract.php; do
              php -l "$t" >/dev/null
              php "$t"
            done
            for t in \
              tests/unit/backend_ia_round3_toolbox_v247271_contract.php \
              tests/unit/tools_toolbox_manager_v247210_contract.php \
              tests/unit/toolbox_dialog_sort_and_actions_v247329_contract.php \
              tests/unit/toolbox_modal_final_layout_v247330_contract.php \
              tests/unit/toolbox_workflow_action_truth_v247327_contract.php \
              tests/unit/toolbox_workflow_modal_v247328_contract.php \
              tests/unit/admin_plain_language_17_tasks_v247287_contract.php \
              tests/unit/admin_group_single_authority_r39_contract.php \
              tests/unit/admin_backend_coverage_r60_contract.php \
              tests/unit/p01_ia_v2_r10_admin_closure_contract.php; do
              php -l "$t" >/dev/null
              php "$t"
            done
            node tests/unit/p01_ia6_toolbox_api_r13_contract.cjs
            node tests/unit/p01_ia6_toolbox_group_delete_remap_contract.cjs
            node tests/unit/p01_tools_workflow_draft_preservation_contract.cjs
            node tests/unit/p01_ia6_recycle_ux66_closure_contract.cjs
            node tests/unit/p01_ia6_legacy_route_retirement_inventory.cjs
          )
          echo P01_IA6_RECYCLE_REBASED_CONTRACTS=PASS
      - name: Isolated Recycle UX66 25-row read-only API fixture in Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          root=/tmp/p01-ia6-492-transfer
          rm -rf "$root"
          mkdir -p "$root"
          cp -a candidate/src/. "$root/"
          (cd "$root" && php -S 127.0.0.1:18631 -t . >/tmp/p01-ia6-492-php.log 2>&1 & echo $! >/tmp/p01-ia6-492-php.pid)
          for i in $(seq 1 35); do
            if curl -fsS -c /tmp/p01-ia6-492-cookie -b /tmp/p01-ia6-492-cookie "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-492-setup.html; then break; fi
            sleep 1
          done
          csrf="$(python3 - <<'PY'
          import re
          source=open('/tmp/p01-ia6-492-setup.html',encoding='utf-8').read()
          token=re.search(r'name="setup_csrf"\s+value="([^"]+)"',source)
          assert token
          print(token.group(1))
          PY
          )"
          curl -fsS -X POST -c /tmp/p01-ia6-492-cookie -b /tmp/p01-ia6-492-cookie "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode "site_title=IA6 Recycle Synthetic Fixture" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            >/tmp/p01-ia6-492-installed.html
          code="$(curl -s -o /dev/null -w '%{http_code}' "$P01_TEST_ORIGIN/recycle-bin.php")"
          test "$code" = 403
          code="$(curl -s -X POST -o /dev/null -w '%{http_code}' "$P01_TEST_ORIGIN/recycle-bin.php")"
          test "$code" = 403
          (cd "$root" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node --check candidate/tests/integration/p01_ia6_recycle_ux66_synthetic_browser.mjs
          node candidate/tests/integration/p01_ia6_recycle_ux66_synthetic_browser.mjs
          node --check candidate/tests/integration/p01_ia6_toolbox_legacy_native_synthetic_browser.mjs
          node candidate/tests/integration/p01_ia6_toolbox_legacy_native_synthetic_browser.mjs
          node candidate/tests/integration/p01_ia6_27_routes_11_tabs_browser.mjs
          echo P01_IA6_RECYCLE_UX66_ISOLATED_BROWSER=PASS
      - name: Erase ephemeral checkout and fixture
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-492-php.pid; then kill "$(cat /tmp/p01-ia6-492-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-492-transfer candidate
          echo P01_IA6_TRANSFER_CLEANUP=PASS
