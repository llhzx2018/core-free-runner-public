name: P01 IA6 493 Atomic hard-exit exact-source recovery proof (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-492-recycle-native-once.yml']
permissions:
  contents: read
jobs:
  exact-source-regression:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-ia6-legacy-gui-final-retirement-20261104
      PRODUCT_SHA: 6a5e51461c1002b75ebb039385061e74140197bb
      PRODUCT_VERSION: 2.47.493
      P01_TEST_ORIGIN: http://127.0.0.1:18631
      P01_TEST_PASSWORD: P01Ia6SyntheticTransfer2026!
    steps:
      - name: Checkout registered Public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare synthetic PHP SQLite and Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
      - name: Pin exact private product source with runtime secret
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_NATIVE_RESOURCES_EXACT_SOURCE=PASS
      - name: Resolve prior published 2.47.492 FULL and Atomic repair
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$GH_TOKEN"
          git clone -q --depth 1 --branch v2.47.492 "https://x-access-token:$READ_TOKEN@github.com/llhzx2018/vf-start.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.492"
          mkdir -p /tmp/p01-maintenance-source/full /tmp/p01-maintenance-source/update
          gh release download v2.47.492 -R llhzx2018/vf-start -D /tmp/p01-maintenance-source \
            -p VF-Start-V2.47.492-FULL.zip -p VF_Start_V2.47.492_UPDATE.zip
          unzip -q /tmp/p01-maintenance-source/VF-Start-V2.47.492-FULL.zip -d /tmp/p01-maintenance-source/full
          unzip -q /tmp/p01-maintenance-source/VF_Start_V2.47.492_UPDATE.zip -d /tmp/p01-maintenance-source/update
          test -f /tmp/p01-maintenance-source/update/repair-v2.47.492.php
          echo P01_IA6_REAL_PUBLISHED_BASELINE_ASSETS=PASS
      - name: Build candidate 2.47.493 FULL and Atomic without publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          tree="$(git -C candidate rev-parse HEAD^{tree})"
          python3 scripts/p01-maintenance-release.py \
            --candidate candidate/src \
            --baseline-full /tmp/p01-maintenance-source/full \
            --baseline-repair /tmp/p01-maintenance-source/update/repair-v2.47.492.php \
            --out /tmp/p01-maintenance-artifacts \
            --version 2.47.493 --source-version 2.47.492 \
            --target-sha "$PRODUCT_SHA" --target-tree "$tree"
          test -f /tmp/p01-maintenance-artifacts/VF-Start-V2.47.493-FULL.zip
          test -f /tmp/p01-maintenance-artifacts/VF_Start_V2.47.493_UPDATE.zip
          echo P01_IA6_493_ARTIFACT_BUILD=PASS
      - name: Actual Atomic hard process exit journal recovery and private data
        shell: bash
        env:
          VERSION: 2.47.493
          SOURCE: 2.47.492
          ART: /tmp/p01-maintenance-artifacts
          REL: /tmp/p01-maintenance-source
        run: |
          set -Eeuo pipefail
          bash scripts/p01-ia6-493-hard-exit-once.sh
          echo P01_IA6_493_HARD_EXIT_EXACT_SOURCE_GATE=PASS
      - name: Erase ephemeral checkout and fixture
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-492-php.pid; then kill "$(cat /tmp/p01-ia6-492-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-492-transfer /tmp/p01-ia6-canonical-baseline /tmp/p01-maintenance-source /tmp/p01-maintenance-artifacts /tmp/p01-maintenance-gate candidate stable
          echo P01_IA6_TRANSFER_CLEANUP=PASS
