name: P01 IA6 native resource exact-source gate (one-off)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-492-recycle-native-once.yml']
permissions:
  contents: read
jobs:
  exact-source-regression:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: feat/p01-ia6-legacy-gui-final-retirement-20261104
      PRODUCT_SHA: 2529168114b6db90777e0844c3240b6d4a521326
      PRODUCT_VERSION: 2.47.492
      P01_TEST_ORIGIN: http://127.0.0.1:18631
      P01_TEST_PASSWORD: P01Ia6SyntheticTransfer2026!
    steps:
      - name: Checkout registered Public Runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare synthetic PHP SQLite and Chromium runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd php-xml >/dev/null
          php -m | grep -Fx pdo_sqlite
      - name: Pin exact private product source with runtime secret
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          actual="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$PRODUCT_VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$PRODUCT_VERSION"
          echo P01_IA6_NATIVE_RESOURCES_EXACT_SOURCE=PASS
      - name: Install browser dependency for credential failure HTTP proof
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund --prefix candidate/tests/integration playwright@1.56.1
          candidate/tests/integration/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact-source resource code lint and targeted contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for path in \
            candidate/src/assets/frontstage-resource-advanced.js \
            candidate/src/assets/frontstage-inventory-bulk.js \
            candidate/src/assets/local-subsite-management.js; do
            node --check "$path"
          done
          php -l candidate/src/app/FunctionalWorkspaceShell.php
          php -l candidate/src/app/FrontstageAdvancedResource.php
          php -l candidate/src/api.php
          node candidate/tests/unit/p01_ia6_final_native_resource_parity.cjs
          echo P01_IA6_NATIVE_RESOURCES_FOCUSED_CONTRACT=PASS
      - name: Compare canonical unit regression against stable main
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline=fa3097ff9465ec457c945ab35ef85359146373ca
          git -C candidate fetch -q --depth 1 origin "$baseline"
          git -C candidate worktree add -q --detach /tmp/p01-ia6-canonical-baseline "$baseline"
          bash candidate/tests/canonical_release_regression.sh candidate /tmp/p01-ia6-canonical-baseline --require-zero-debt
          echo P01_IA6_RESOURCE_FINAL_CANONICAL=PASS
      - name: Real Chromium synthetic Owner advanced and batch resource operations
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01-ia6-native-resource-once.sh candidate
          echo P01_IA6_NATIVE_RESOURCE_REAL_BROWSER=PASS
      - name: Erase ephemeral checkout and fixture
        if: always()
        shell: bash
        run: |
          if test -f /tmp/p01-ia6-492-php.pid; then kill "$(cat /tmp/p01-ia6-492-php.pid)" >/dev/null 2>&1 || true; fi
          rm -rf /tmp/p01-ia6-492-transfer /tmp/p01-ia6-canonical-baseline candidate
          echo P01_IA6_TRANSFER_CLEANUP=PASS
