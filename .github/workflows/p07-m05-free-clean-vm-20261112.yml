name: P07-M05 新服务器初始化 — Free Clean VM Feasibility
on:
  push:
    branches: [feat/p07-unified-independent-module-router-20261112]
    paths:
      - 'tests/p07_m05_clean_vm_probe.sh'
      - 'tests/p07_m05_free_clean_vm.sh'
      - '.github/workflows/p07-m05-free-clean-vm-20261112.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  free-hosted-guest-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Probe GitHub's FREE hosted KVM capacity without touching any VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/p07_m05_clean_vm_probe.sh
          echo P07_M05_REAL_CLOUDPANEL_INSTALL=NOT_YET_RUN
          echo P07_M05_OWNER_VPS=UNTOUCHED
          echo P07_M05_DNS=UNTOUCHED

  free-native-cloudpanel-real-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/p07-unified-independent-module-router-20261112'
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - name: Public registered P07 disposable test checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private M05 exact single-file trial temporary checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1d288ae7fc2f213b702a43c8596a7284f3bfb82e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private_m05
      - name: Actual P07-M05 新服务器初始化 CloudPanel install on this free throwaway hosted VM only
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private_m05 rev-parse HEAD)" = '1d288ae7fc2f213b702a43c8596a7284f3bfb82e'
          FILE="$GITHUB_WORKSPACE/private_m05/owner-trial/P07-M05-0.1.0-m05-candidate2-OFFLINE.run"
          test -f "$FILE"
          echo "e42b6b3c59719f6ec189e4c62b7cfc54385aaa6e566c8f92ca5306246f022bbb  $FILE" | sha256sum -c -
          sudo env \
            GITHUB_ACTIONS=true \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            P07_M05_THROWAWAY_GITHUB_VM=YES_I_ACKNOWLEDGE_EPHEMERAL_GH_VM \
            P07_M05_OFFLINE_TRIAL_FILE="$FILE" \
            bash tests/p07_m05_free_native_cloudpanel.sh
      - name: Remove private source and transient installation log
        if: always()
        shell: bash
        run: |
          set +e
          sudo rm -f -- "$RUNNER_TEMP/p07-m05-cloudpanel-private-install.log"
          rm -rf -- private_m05
          echo P07_M05_FREE_NATIVE_PRIVATE_DATA_CLEANUP=YES
