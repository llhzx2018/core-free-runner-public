name: P01 V2.36.3 Main Promotion Tree Identity
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-main-promotion-tree-identity-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 718e043e3715ef7b21849bc08634fca89bf92c1f
      FORMAL_TREE: 32e8afdd6d7cdd338c62fdafaedb200b127ca881
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      EXPECTED_MAIN: 896723136e7535aa94d8d23deef39b892fd2f643
      EXPECTED_DEVELOP: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      PREDECESSOR_TAG: v2.36.2
      CANDIDATE_RUN: '33501907010'
      BIND_RUN: '33502414744'
      FORMAL_RUN: '33502799058'
      STRICT_RUN: '33503664704'
    steps:
      - name: Checkout exact formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact promotion fence and tree-identity merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for run in "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN"; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          cd p01
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$EXPECTED_MAIN"
          test "$DEVELOP" = "$EXPECTED_DEVELOP"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.3 >/dev/null 2>&1; then echo UNEXPECTED_V2363_TAG; exit 20; fi
          git fetch origin "$EXPECTED_MAIN" "$EXPECTED_DEVELOP" "$PREDECESSOR_TAG" --quiet
          test "$(git rev-parse "$EXPECTED_DEVELOP^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$EXPECTED_DEVELOP:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$EXPECTED_MAIN:src")" = "55bc3143df6ca4e8e66b3e8d3e0f01b3ec343424"
          test "$(git rev-parse "$PREDECESSOR_TAG")" = "4fd25a5ce4383dc456e755fc2e031a861d6ff655"
          git diff --name-status "$EXPECTED_MAIN" "$FORMAL_SOURCE" | tee /tmp/p01-v2363-main-to-formal.txt
          if git diff --name-status "$EXPECTED_MAIN" "$FORMAL_SOURCE" | awk '$1=="D"{bad=1} END{exit bad?0:1}'; then echo UNEXPECTED_MAIN_PATH_DELETION; exit 21; fi
          test "$(cat VERSION)" = 2.36.3
          test "$(cat src/VERSION.txt)" = 2.36.3
          grep -Fx "define('VF_VERSION', '2.36.3');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.2
          test "$(jq -r .v2_36_3_candidate_gate.state VF_PROJECT.json)" = PASS
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          PROMOTION=$(printf 'release(P01): promote V2.36.3 formal tree to main\n\nTree-identity merge promotion after V2.36.2 docs-only main authority sync. Formal Source %s is preserved as second parent; runtime bytes are unchanged.\n' "$FORMAL_SOURCE" | git commit-tree "$FORMAL_TREE" -p "$EXPECTED_MAIN" -p "$FORMAL_SOURCE")
          test "$(git rev-parse "$PROMOTION^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$PROMOTION:src")" = "$RUNTIME_TREE"
          test "$(git show -s --format=%P "$PROMOTION")" = "$EXPECTED_MAIN $FORMAL_SOURCE"
          git push origin "$PROMOTION:refs/heads/main"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$REMOTE_MAIN" = "$PROMOTION"
          test "$REMOTE_DEVELOP" = "$EXPECTED_DEVELOP"
          git fetch origin "$REMOTE_MAIN" --quiet
          test "$(git rev-parse "$REMOTE_MAIN^{tree}")" = "$FORMAL_TREE"
          test "$(git rev-parse "$REMOTE_MAIN:src")" = "$RUNTIME_TREE"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$REMOTE_MAIN"
          git merge-base --is-ancestor "$FORMAL_SOURCE" "$REMOTE_MAIN"
          if git ls-remote --exit-code --tags origin refs/tags/v2.36.3 >/dev/null 2>&1; then echo UNEXPECTED_TAG_AFTER_PROMOTION; exit 22; fi
          printf 'P01_V2363_MAIN_PROMOTION=PASS\nPROMOTION_MAIN=%s\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nDEVELOP=%s\nCANDIDATE_RUN=%s\nBIND_RUN=%s\nFORMAL_RUN=%s\nSTRICT_FRESH_R2_RUN=%s\nPROMOTION_MODE=TREE_IDENTITY_MERGE\nTAG=ABSENT\nOWNER_PRODUCTION_WRITE=NO\n' "$REMOTE_MAIN" "$FORMAL_SOURCE" "$FORMAL_TREE" "$RUNTIME_TREE" "$REMOTE_DEVELOP" "$CANDIDATE_RUN" "$BIND_RUN" "$FORMAL_RUN" "$STRICT_RUN" | tee /tmp/p01-v2363-main-promotion.txt
      - name: Upload promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-main-promotion-${{ github.run_id }}
          path: |
            /tmp/p01-v2363-main-promotion.txt
            /tmp/p01-v2363-main-to-formal.txt
          if-no-files-found: error
          retention-days: 90
