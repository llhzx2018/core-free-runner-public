name: S01 player 95 clean first-run proof
on:
  push:
    branches: [task/s01-player95-20261028]
    paths: ['.github/workflows/s01-player95-clean-20261028.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-m3u8
  TARGET_VERSION: 1.25.95
  TARGET_SHA: a63479b5fb519ff8bf661c4ca94a338089a6e4f1
  TARGET_TREE: 85c487262037857115369f279b7fb261adb58a85
  BASE_SHA: 9416ed0aef6db0878834a03459ccbfe3566f31f4
  SOURCE_VERSION: 1.25.94
  LANE_ID: s01-player95-20261028
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-player95-20261028/spec.json --input control/.github/workflows/s01-player95-clean-20261028.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: a63479b5fb519ff8bf661c4ca94a338089a6e4f1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Build exact candidate and verify executable provenance
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider sample
          gh release download v1.25.94 --repo "$TARGET_REPO" --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          python3 control/lanes/s01-player95-20261028/package.py
          php -l target/src/vf-tool-m3u8.php
          php -l target/src/includes/settings-engine.php
          node --check target/src/public/js/modules/player.js
          node --check target/src/public/dist/player.js
          node --check control/lanes/s01-player95-20261028/browser.cjs
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: First activation and admin revisit
        run: bash control/lanes/s01-player95-20261028/clean.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-player95-clean-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and package
        if: always()
        run: rm -rf target provider sample
