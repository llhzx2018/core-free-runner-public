name: P01 2.47.516 actual nginx -T CloudPanel vhost root one-off
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  nginx-root-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 20740ccf803fe9fba15324d26612a53b5a58d3e6
      TARGET_VERSION: 2.47.516
    steps:
      - name: Checkout registered public ephemeral runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify test lane identity and rendered workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-nginx-vhost-root-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-nginx-root.json > "$RUNNER_TEMP/p01-nginx-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-nginx-root.json --input .github/workflows/p01-247516-nginx-root-oneoff.yml > "$RUNNER_TEMP/p01-nginx-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-nginx-audit.txt" > /dev/null
          echo P01_REAL_NGINX_LANE_IDENTITY=PASS
      - name: Checkout P01 exact private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact source and real nginx/php test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-nginx-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx-light openssl php8.3-cli >>"$RUNNER_TEMP/p01-nginx-apt.txt" 2>&1
          test -x /usr/sbin/nginx
          test -x /usr/bin/openssl
          echo P01_REAL_NGINX_AND_PHP_SOURCE=PASS
      - name: PHP syntax and new CloudPanel read-only contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             src/app/next/runtime/MajorNginxVhostRootEvidence.php             src/app/next/runtime/CloudPanelManualHandoff.php             tests/compatibility/laravel/http/p01_major_nginx_vhost_root.php; do
            php8.3 -l "candidate/$f" >"$RUNNER_TEMP/p01-nginx-php-lint.txt" 2>&1 || {
              echo P01_REAL_NGINX_PHP_SOURCE=FAIL; exit 1;
            }
          done
          echo P01_REAL_NGINX_PHP_SOURCE=PASS
      - name: True nginx -T parser and 18 root-confusion negative cases
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/compatibility/laravel/http/p01_major_nginx_vhost_root.php --real-nginx-t >"$RUNNER_TEMP/p01-nginx-real-test.txt" 2>&1 || {
            grep -E 'MAJOR_NGINX_|NGINX_|Fatal error|Parse error|Uncaught|test failed' "$RUNNER_TEMP/p01-nginx-real-test.txt" | head -n 12 || true
            echo P01_REAL_NGINX_ROOT_MATRIX=FAIL
            exit 1
          }
          grep -Fx 'P01_MAJOR_NGINX_ROOT_THREE_PHASE_POSITIVE=PASS' "$RUNNER_TEMP/p01-nginx-real-test.txt"
          grep -Fx 'P01_MAJOR_NGINX_ROOT_FALSE_MATCH_NEGATIVE_MATRIX=PASS' "$RUNNER_TEMP/p01-nginx-real-test.txt"
          grep -Fx 'P01_MAJOR_NGINX_ROOT_CONFIG_IS_NOT_LIVE_WORKER_PROOF=PASS' "$RUNNER_TEMP/p01-nginx-real-test.txt"
          grep -Fx 'P01_MAJOR_REAL_NGINX_T_ROOT_READBACK=PASS' "$RUNNER_TEMP/p01-nginx-real-test.txt"
          echo P01_CLOUDPANEL_VHOST_SOURCE_INTEGRITY=PASS
      - name: Cleanup exact private candidate and all NGINX evidence
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-nginx-*.txt
          echo P01_REAL_NGINX_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_REAL_NGINX_PUBLIC_ARTIFACTS=NONE
