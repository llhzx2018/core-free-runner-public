name: P07 OneShot Bench v0.4 Gate

on:
  push:
    branches:
      - experiment/p07-oneshot-bench-v04
    paths:
      - experiments/p07-bench.sh
      - .github/workflows/p07-oneshot-v04-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NO_COLOR: "1"
      XDG_STATE_HOME: /tmp/p07-v04-gate-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p07-oneshot-bench-v04

      - name: Syntax identity self-test
        run: |
          set -euo pipefail
          bash -n experiments/p07-bench.sh
          chmod +x experiments/p07-bench.sh
          ./experiments/p07-bench.sh --version | grep -F 'P07 Enhanced Bench 0.4.0'
          ./experiments/p07-bench.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: One-shot demo gate
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-v04-gate-state
          ./experiments/p07-bench.sh --demo 2>&1 | tee /tmp/p07-v04-demo.txt
          grep -F 'Speedtest.net' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'China Unicom, CN' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'China Telecom, CN' /tmp/p07-v04-demo.txt | grep -F 'PASS'
          grep -F 'Mainland Speed' /tmp/p07-v04-demo.txt | grep -F '2/2 PASS'
          grep -F 'Outbound Verdict' /tmp/p07-v04-demo.txt | grep -F 'NORMAL'
          grep -F 'Mainland -> VPS' /tmp/p07-v04-demo.txt | grep -F 'NOT_RUN'
          ! grep -F 'PARSE_ERROR' /tmp/p07-v04-demo.txt
          ! grep -F '/dev/tty:' /tmp/p07-v04-demo.txt

      - name: Parser regression contract
        run: |
          set -euo pipefail
          grep -F 'parse_speed_json_file' experiments/p07-bench.sh
          grep -F 'speed-${key}.out' experiments/p07-bench.sh
          grep -F 'speed-${key}.err' experiments/p07-bench.sh
          grep -F -- '--format=json >"$out_file" 2>"$err_file"' experiments/p07-bench.sh
          grep -F "lstrip('\\ufeff')" experiments/p07-bench.sh

      - name: Mainland fallback contract
        run: |
          set -euo pipefail
          grep -F 'speed_node_pool' experiments/p07-bench.sh
          for id in 24447 43752 36663 5396 59387 16204 30852; do grep -F "$id" experiments/p07-bench.sh; done
          grep -F 'NODE_UNAVAILABLE is not IP-block evidence' experiments/p07-bench.sh
          grep -F 'china_verdict_from_counts 0 0 2 9 6 0 3' experiments/p07-bench.sh

      - name: JSON report contract
        run: |
          set -euo pipefail
          f=$(find /tmp/p07-v04-gate-state -type f -name 'p07-bench_*.json' | head -1)
          test -n "$f"
          python3 - "$f" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          assert p['module']=='p07-bench'
          assert p['version']=='0.4.0'
          assert len(p['network_nodes'])==12
          assert p['china_ip_assessment']['verdict']=='NORMAL'
          assert p['china_ip_assessment']['mainland_origin_probe']=='NOT_IMPLEMENTED'
          PY

      - name: No-menu and safety boundary
        run: |
          set -euo pipefail
          ! grep -Eq '请选择|按 Enter|main_menu|interactive\(' experiments/p07-bench.sh
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-bench.sh
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-bench.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-bench.sh
