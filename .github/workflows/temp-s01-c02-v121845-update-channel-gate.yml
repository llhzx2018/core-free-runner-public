name: TEMP S01-C02 Ops 1.21.845 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121845-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 0fd50c9a363e22e5f6d443e92f7ff9e41ff23e47
      UPDATE_CANDIDATE: 29ca1491efbaf33501c4849a94dd2ce4a6600324
      UPDATE_TREE: f0aafaedb2dc07c94f4aa5bdc55a5e4c887fd747
      PRODUCT_COMMIT: b2e54350130866ac569b379473773d281c6d04f2
      PRODUCT_TREE: 27f7ba81b227c6d2e93c55311aef7f041a081d61
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.845.zip
      BYTES: '3308390'
      SHA256: 96a290a9f6695711c81af288464c158944a786498671e5c47f449b283f370e3b
      FP: 53c40d4311ae0923d534505c85995e77b55ea291b784072d347093114880b61e
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          test "$(git -C updates rev-parse HEAD^{tree})" = "$UPDATE_TREE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.845" and .from_versions==["1.21.844"] and .release_tag=="v1.21.845" and .asset_name=="vf-tools-ops_V1.21.845.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==927 and .runtime_file_count==927 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-06T03:48:19Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.845' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.id==383456534 and .tag_name=="v1.21.845" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.id==546687321 and .name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$PRODUCT_COMMIT --jq .tree.sha)" = "$PRODUCT_TREE"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.844" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.844" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRootItemStatus=="fail" and .sourceRecoveryRootItemCandidateCurrentStage==1 and .sourceRecoveryRootItemCandidateAuditFailureCount==1 and .sourceRecoveryDurableKickCode=="durable_kick_candidate_already_terminal"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRecordIsolationStatus=="blocked" and .sourceRecoveryRecordIsolationCode=="record_isolation_final_audit_boundary_changed"' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git -C updates rev-parse origin/develop)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121845_UPDATE_CHANNEL_GATE
