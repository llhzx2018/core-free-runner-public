name: P07 full VPS audit restoration smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/p07-vps-audit-v226-r1.sh'
      - 'installers/p07-toolbox.sh'
      - '.github/workflows/p07-full-audit-restoration-smoke.yml'
permissions:
  contents: read
jobs:
  full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact syntax, feature restoration and classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          file='experiments/p07-vps-audit-v226-r1.sh'
          bash -n "$file"
          test "$(bash "$file" --build-id)" = '2.2.6-rc1-full-bounded'
          test "$(bash "$file" --version | awk '{print $NF}')" = 'V2.2.6'
          bash "$file" --self-test | tee /tmp/v226-self.txt
          grep -Fx 'P07_VPS_VALUE_VERDICT_SELF_TEST=PASS' /tmp/v226-self.txt
          bash "$file" --help | tee /tmp/v226-help.txt
          grep -Fq '全球节点及中国大陆网络测速' /tmp/v226-help.txt
          grep -Fq '三网回程' /tmp/v226-help.txt
          grep -Fq '增强 fio 4K/64K/512K/1M' /tmp/v226-help.txt
          grep -Fq '中文报告' /tmp/v226-help.txt
          grep -Fq '12 分钟' "$file"
          grep -Fq 'timeout --signal=TERM --kill-after=5s 720s bash "$BASE"' "$file"
          grep -Fq 'P07_BENCH_IO_MIB=64' "$file"
          grep -Fq 'P07_FIO_TIMEOUT_SEC=20' "$file"
          grep -Fq 'P07_ROUTE_TIMEOUT_SEC=25' "$file"
          ! grep -Fq 'P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_V21_SKIP_ROUTE=1' "$file"
          bash "$file" --color-demo | grep -Fq '服务器结论'
          printf 'VPS_AUDIT_226_SHA256=%s\n' "$(sha256sum "$file" | awk '{print $1}')"
          echo P07_FULL_AUDIT_RESTORE_STATIC=PASS
      - name: Synthetic unmeasured V2.1 scenario must never report full success
        shell: bash
        run: |
          set -Eeuo pipefail
          file='experiments/p07-vps-audit-v226-r1.sh'
          set +e
          P07_V21_SKIP_BASE=1 P07_V21_SKIP_FIO=1 P07_V21_SKIP_ROUTE=1 NO_COLOR=1 \
            timeout --kill-after=3s 75s bash "$file" > /tmp/v226-skip.txt 2>&1
          rc=$?
          set -e
          cat /tmp/v226-skip.txt
          test "$rc" -eq 12
          grep -Fq '完整模式：CPU / 磁盘 / 全球及中国大陆测速' /tmp/v226-skip.txt
          grep -Fq '网络测速、增强磁盘和三网回程' /tmp/v226-skip.txt
          grep -Fq '证据不足' /tmp/v226-skip.txt
          grep -Fq '基础 CPU 或 4K 磁盘数据不足' /tmp/v226-skip.txt
          echo P07_FULL_AUDIT_MISSING_EVIDENCE_FAIL_CLOSED=PASS
