name: S01-C03 overview exact formal release
on:
  push:
    branches: [task/s01-c03-overview-20261008-release]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-m3u8'
      TARGET_VERSION: '1.25.60'
      TARGET_SHA: '8c3b84cac67ede8e50badaef861ff334605e0cfb'
      TARGET_TREE: 'a2edcc649598ff6a20b084a67ae20d839927d743'
      CANDIDATE_RUN: '37752763045'
      CANDIDATE_RUNNER_SHA: '24ab7c1915fc1ed0c8db17707fe24710260754be'
      CANDIDATE_ARTIFACT_ID: '11537834765'
      PROMOTED_MAIN_SHA: 'ebba52b7ffb489ebe5756803e911fb6752bee414'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target spec preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-c03-overview-20261008-release/spec.json --template runner/lanes/s01-c03-overview-20261008-release/release.template.yml --output /tmp/rendered-release.yml >/dev/null
          cmp /tmp/rendered-release.yml runner/.github/workflows/s01-c03-overview-20261008-release.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-c03-overview-20261008-release/spec.json --input runner/.github/workflows/s01-c03-overview-20261008-release.yml > proof/lane-identity-audit.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Actual candidate archive reverse verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > /tmp/candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > /tmp/candidate-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > /tmp/candidate-proof.zip
          python3 runner/lanes/s01-c03-overview-20261008-release/reverse.py
      - name: Exact promoted source and deterministic rebuild
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c03-overview-20261008-release lane
          test "$(gh api repos/$TARGET_REPO/git/ref/heads/main --jq '.object.sha')" = "$PROMOTED_MAIN_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$PROMOTED_MAIN_SHA --jq '.tree.sha')" = "$TARGET_TREE"
          php target/tests/provider-dashboard-visible-ui-contract.php
          php target/tests/unit/provider-overview-state-contract.php > proof/overview-unit.json
          php target/tests/unit/provider-diagnostic-self-check-contract.php > proof/diagnostic-unit.json
          php target/tests/unit/package-physical-locator-contract.php
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('proof/identity.json').read_text());b=json.loads(pathlib.Path('candidate/proof/identity.json').read_text());assert a==b,(a,b)
          PY
      - name: Publish authorized exact tag and formal asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TARGET_REPO/git/refs/tags" > /tmp/tags.json
          gh api "repos/$TARGET_REPO/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import pathlib,json,os
          tag='v'+os.environ['TARGET_VERSION']
          assert not any(n['ref']=='refs/tags/'+tag for n in json.loads(pathlib.Path('/tmp/tags.json').read_text()))
          assert not any(n['tag_name']==tag for n in json.loads(pathlib.Path('/tmp/releases.json').read_text()))
          pathlib.Path('/tmp/release-notes.md').write_text('修复能力运行概览的状态误导：基础自检通过不再代表整页验证完成；缺失、过期、未知、警告证据和未知线上依赖保持待验证。默认展示中文状态，精确运行环境与原始状态保留于技术详情。已有失败优先进入对应处理页；修复诊断读取不存在的pass字段导致误报。真实隔离WordPress入口、兼容性/性能/诊断操作与结果回读、六种屏宽、权限及Nonce保护、原生升级/源与状态恢复/再次升级/全新安装已验证。保留1.25.59前台修复，冻结Shell/Header/Menu，领域算法和写入合同不变。Source: '+os.environ['TARGET_SHA']+'; candidate run '+os.environ['CANDIDATE_RUN']+'. Production仍由用户手工升级；未声明用户最终产品验收通过。\n')
          PY
          gh api "repos/$TARGET_REPO/git/refs" -X POST -f ref="refs/tags/v$TARGET_VERSION" -f sha="$PROMOTED_MAIN_SHA" > proof/tag.json
          gh release create "v$TARGET_VERSION" "proof/vf-tools-m3u8_V$TARGET_VERSION.zip" --repo "$TARGET_REPO" --verify-tag --title "VF Tools M3U8 V$TARGET_VERSION" --notes-file /tmp/release-notes.md
      - name: Exact delivered asset remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir delivered
          gh api "repos/$TARGET_REPO/releases/tags/v$TARGET_VERSION" > proof/release-meta.json
          gh api "repos/$TARGET_REPO/git/ref/tags/v$TARGET_VERSION" > /tmp/tag-readback.json
          gh release download "v$TARGET_VERSION" --repo "$TARGET_REPO" --pattern "vf-tools-m3u8_V$TARGET_VERSION.zip" --dir delivered
          python3 runner/lanes/s01-c03-overview-20261008-release/readback.py
      - name: Safe release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-overview-release-${{ github.run_id }}
          path: proof/**/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target candidate delivered proof/*.zip /tmp/candidate-proof.zip

