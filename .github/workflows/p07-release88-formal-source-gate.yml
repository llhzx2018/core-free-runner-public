name: P07 release88 formal source identity gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release88-formal-source-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      P07_SOURCE_SHA: 1bbd14c2c87b72179469992d5050c19b101aa2ca
    steps:
      - name: Check registered private read capability
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo 'P07_PRIVATE_READ_CAPABILITY_UNAVAILABLE'; exit 78; }
      - name: Fetch exact private product source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 1bbd14c2c87b72179469992d5050c19b101aa2ca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-p07-private
      - name: Verify source identity and focused formal build tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd transient-p07-private
          test "$(git rev-parse HEAD)" = "$P07_SOURCE_SHA"
          test "$(cat BUILD_ID)" = '0.1.0-release88'
          python3 -m unittest -q tests.test_p07_bundle_identity
          python3 -m py_compile scripts/p07_candidate_bundle.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("scripts/p07_candidate_bundle.py")
          spec = importlib.util.spec_from_file_location("p07_bundle_check", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.safe_manifest("a" * 40 + "  BUILD_ID\\n") == [("a" * 40, "BUILD_ID")]
          try:
              module.safe_manifest("a" * 40 + "  ../outside\\n")
          except module.CandidateBundleError:
              pass
          else:
              raise AssertionError("unsafe manifest must fail closed")
          print("P07_RELEASE88_MANIFEST_PATH_POLICY=PASS")
          PY
          echo P07_RELEASE88_FORMAL_SOURCE_IDENTITY=PASS
      - name: Cleanup private material
        if: always()
        shell: bash
        run: rm -rf transient-p07-private
