name: P01 V2.32.0 Unified Candidate Readiness Gate
on:
  push:
    branches: [task/p01-v2320-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2320-unified-candidate-readiness-20260830.yml
      - scripts/p01-v2320-build-candidate-artifacts.py
      - scripts/p01-v2320-candidate-readiness.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Checkout exact V2.32 versioned candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 8b4f3483579bf2d286c551c1f33e876e4e7aec16
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Checkout immutable V2.31 production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.31.0
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Checkout proven Atomic builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - name: Unified candidate machine, upgrade and browser gate
        shell: bash
        run: bash runner/scripts/p01-v2320-candidate-readiness.sh
      - name: Upload V2.32 candidate readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-candidate-readiness-evidence-${{ github.run_id }}
          path: /tmp/p01-v2320-candidate-evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Upload unpublished candidate artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2320-unpublished-candidate-artifacts-${{ github.run_id }}
          path: /tmp/p01-v2320-candidate-artifacts
          if-no-files-found: error
          retention-days: 30
