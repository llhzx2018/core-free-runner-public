name: P01 V2.30 Child Domain UI Evidence
on:
  push:
    branches: [task/p01-v230-domain-nav-shell-20260829]
    paths:
      - .github/workflows/p01-v230-child-domain-ui-evidence-20260829.yml
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ff518db31c218752ce60fd57ae38a59324fc6c37
      PORT: '18576'
      ROOT: /tmp/p01-v230-child-ui
      ADMIN_PASS: 'P01V230!ChildUI'
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          path: source
      - name: Fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          rm -rf "$ROOT" /tmp/p01-v230-child-ui.cookies evidence
          cp -a source/src "$ROOT"
          php -S "127.0.0.1:${PORT}" -t "$ROOT" >/tmp/p01-v230-child-ui.log 2>&1 &
          COOKIE=/tmp/p01-v230-child-ui.cookies
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:${PORT}/setup.php" -o /tmp/setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V230 Child UI' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o /tmp/setup-post.html
          grep -F 'VF Start 安装完成' /tmp/setup-post.html >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -d "{\"password\":\"$ADMIN_PASS\"}" "http://127.0.0.1:${PORT}/api.php?action=login" -o /tmp/login.json
          jq -e '.ok==true' /tmp/login.json >/dev/null
          jq -r '.csrf' /tmp/login.json >/tmp/csrf
          php "$ROOT/cli/verify.php" | grep -Fx VERIFY_PASS=YES
      - name: Seed child domains
        shell: bash
        run: |
          set -Eeuo pipefail
          COOKIE=/tmp/p01-v230-child-ui.cookies; CSRF=$(cat /tmp/csrf)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"开发工具","is_private":false,"sort_order":100}' "http://127.0.0.1:${PORT}/api.php?action=category_save" -o /tmp/cat.json
          CAT=$(jq -r '.id' /tmp/cat.json); test "$CAT" -gt 0
          create(){ curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:${PORT}/workspace-create.php" -F "csrf=$CSRF" -F "category_id=$CAT" -F "surface=$1" -F "title=$2" -F "url=$3" -F "resource_kind=$4" -F "tags=$5" -F 'is_private=0' -F 'source_kind=remote_url' >/tmp/create.json; jq -e '.ok==true' /tmp/create.json >/dev/null; }
          create start 'ChatGPT' 'https://chatgpt.com/' '' 'AI,常用'
          create start 'GitHub' 'https://github.com/' '' '开发,代码'
          create channels '科技漫谈' 'https://example.com/channel/tech' '科技' 'AI,科技,后台听'
          create channels '旅行故事' 'https://example.com/channel/travel' '旅行' '旅行,生活'
          create watch '样例电影' 'https://example.com/movie/1' '电影' '剧情,科幻'
          create watch '样例纪录片' 'https://example.com/movie/2' '纪录片' '纪录片,科技'
          create topics 'AI 编程工具怎么选' 'https://example.com/topic/ai-code' 'AI' 'AI,编程,专题'
          create topics '一个人做网站成本账本' 'https://example.com/topic/cost' '建站' '建站,成本,专题'
      - name: Install Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-playwright; mkdir -p /tmp/p01-playwright; cd /tmp/p01-playwright
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Browser gate and screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          cat >/tmp/p01-playwright/gate.js <<'JS'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const base='http://127.0.0.1:18576',password='P01V230!ChildUI';const browser=await chromium.launch({headless:true});
          const desktop=await browser.newContext({viewport:{width:1440,height:960}});let r=await desktop.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('desktop login');
          for(const [path,label,file] of [['start.php','导航','desktop-start.png'],['channels.php','频道','desktop-channels.png'],['watch.php','影视','desktop-watch.png'],['topics.php','专题','desktop-topics.png']]){const p=await desktop.newPage();await p.goto(base+'/'+path,{waitUntil:'networkidle'});if((await p.locator('.vf-global-domain-nav a.active').textContent()||'').trim()!==label)throw new Error(path+' global active');if(await p.locator('.vf-quick-nav').count())throw new Error(path+' child quick nav rendered');if((await p.locator('.vf-sidebar-bottom').textContent()||'').includes('网址管理'))throw new Error(path+' old management label');const allChip=p.locator('.vf-context-chip',{hasText:'全部'});if(await allChip.count())throw new Error(path+' redundant all scope chip');await p.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/'+file,fullPage:true});await p.close();}
          await desktop.close();
          const mobile=await browser.newContext({viewport:{width:390,height:844}});r=await mobile.request.post(base+'/api.php?action=login',{data:{password}});if(!r.ok())throw new Error('mobile login');const p=await mobile.newPage();await p.goto(base+'/channels.php',{waitUntil:'networkidle'});if(await p.locator('.vf-domain-subbar').evaluate(el=>getComputedStyle(el).display)!=='none')throw new Error('mobile blank topbar remains');const add=p.locator('.vf-mobile-add-action');await add.waitFor({state:'visible'});const nav=await p.locator('.vf-global-domain-nav').boundingBox(),head=await p.locator('.vf-functional-head').boundingBox();if(!nav||!head||head.y-nav.height>35)throw new Error('mobile excessive top gap '+JSON.stringify({nav,head}));const overflow=await p.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error('mobile overflow '+overflow);await p.screenshot({path:'/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/mobile-channels.png',fullPage:true});await browser.close();fs.writeFileSync('/home/runner/work/core-free-runner-public/core-free-runner-public/evidence/verdict.txt','P01_V230_CHILD_DOMAIN_UI=PASS\nSOURCE=ff518db31c218752ce60fd57ae38a59324fc6c37\n');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          cd /tmp/p01-playwright && node gate.js
          echo P01_V230_CHILD_DOMAIN_UI=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: P01-v230-child-domain-ui-evidence
          path: evidence
          retention-days: 7
