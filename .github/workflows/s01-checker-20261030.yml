name: S01 playlist checker reference candidate proof
on:
  push:
    branches: [task/s01-checker-proof-20261030]
    paths: ['.github/workflows/s01-checker-20261030.yml', 'lanes/s01-checker-20261030/**']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.217
  TARGET_SHA: 81757056b5ace411d31f9fcb154936fcfd3c3c25
  TARGET_TREE: 7e107ae7c99623d2cf65386a5a231c9346a0dc61
  BASE_SHA: 25f956f608b18f6c61ef73ca861b3a984f02b8c7
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-checker-20261030/spec.json --input control/.github/workflows/s01-checker-20261030.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 81757056b5ace411d31f9fcb154936fcfd3c3c25
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify candidate and unchanged source boundary
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/inc/modules/module-faq.php
          node --check control/lanes/s01-checker-20261030/check.cjs
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,os
          files=set(subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines())
          assert files=={'src/inc/modules/module-faq.php','src/inc/public-css-owner-registry.php','src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css'},files
          src=pathlib.Path('target/src'); family=(src/'assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css').read_bytes();bundle=(src/'assets/css/public/vf-theme-public-runtime.css').read_bytes();assert bundle.count(family)==1
          assert hashlib.sha256(bundle).hexdigest()=='0f0d1b97ca4b90cea39272403ade55dfbd5193b25dc8949e998e4f0ef6917869'
          assert hashlib.sha256(bundle).hexdigest() in (src/'inc/public-css-owner-registry.php').read_text()
          PY
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: WordPress bilingual layouts and controls
        run: bash control/lanes/s01-checker-20261030/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-downloader-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and provider
        if: always()
        run: rm -rf target provider lane
