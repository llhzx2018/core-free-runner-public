name: S01 playlist checker reference candidate proof
on:
  push:
    branches: [task/s01-checker-current-proof-20261031]
    paths: ['.github/workflows/s01-checker-20261030.yml', 'lanes/s01-checker-20261030/**']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.221
  TARGET_SHA: a01ed814f03bc427d2d3e9a0f861361082b43de2
  TARGET_TREE: 5a05bc0118dd7509fa59a9b656b11800cd97155a
  BASE_SHA: 4c3482d6644487ddf799d0efac3c5af22b82df51
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-checker-20261030/spec.json --input control/.github/workflows/s01-checker-20261030.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a01ed814f03bc427d2d3e9a0f861361082b43de2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify candidate and unchanged source boundary
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          php -l target/src/inc/seo-integration.php
          php -l target/src/inc/modules/module-faq.php
          node --check control/lanes/s01-checker-20261030/check.cjs
          python3 - <<'PY'
          import subprocess,pathlib,hashlib,os
          files=set(subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines())
          assert files=={'src/inc/seo-integration.php','src/inc/frontend-seo-context.php','src/inc/bootstrap/public-runtime.php','src/inc/modules/module-faq.php','src/inc/public-css-owner-registry.php','src/assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css'},files
          src=pathlib.Path('target/src'); family=(src/'assets/css/public/pages/families/public-family-02-tool-directory-detail-operations-closure.css').read_bytes();bundle=(src/'assets/css/public/vf-theme-public-runtime.css').read_bytes();assert bundle.count(family)==1
          assert hashlib.sha256(bundle).hexdigest()=='75142740344de5a89e19b3c66162cab109d61c8bc1f185d611e3771e0f553485'
          assert hashlib.sha256(bundle).hexdigest() in (src/'inc/public-css-owner-registry.php').read_text()
          PY
          gh release download v1.25.97 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.97.zip --dir provider
          echo 'd84279b9527f5da7ae43f05759dfb8288f5a07e63e481c84253e507458ad485f  provider/vf-tools-m3u8_V1.25.97.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -fsSL https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf -o "$HOME/.local/share/fonts/NotoSansCJKsc-Regular.otf"
          fc-cache -f
          cp -a established/lanes/s01-frontend-design-20261017 lane
      - name: WordPress bilingual layouts and controls
        run: bash control/lanes/s01-checker-20261030/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-checker-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Clean private source and provider
        if: always()
        run: rm -rf target provider lane
