name: P01 V2.26.0 Release Exact Source Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-release-exact-source-gate-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SHA: c97a362fc574cd80349526fca016f9e0e6a9c472
      TREE: 784fbbb4b3612145cdfa424659ddc6e843d3694b
      DEVELOP: 66c3b69527c3273c8dc923c88b3d5bfee8eda3ce
      FEATURE_TREE: 1f68db30b1a060456378dd482bbf7aaa5235f9fd
      VERSION: 2.26.0
      SCHEMA: '2026082801'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SHA }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Release identity fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test "$(git rev-parse HEAD^)" = "$DEVELOP"
          test "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" refs/heads/release/p01-v2.26.0-20260828|awk '{print $1}')" = "$SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "$VERSION"
          grep -F "define('VF_VERSION', '2.26.0');" src/app/bootstrap.php >/dev/null
          grep -F '## V2.26.0 · Formal Release · 2026-08-28' CHANGELOG.md >/dev/null
          mapfile -t ids < <(git diff --name-only "$DEVELOP..$SHA")
          test "${#ids[@]}" -eq 4
          for f in "${ids[@]}"; do case "$f" in VERSION|src/VERSION.txt|src/app/bootstrap.php|CHANGELOG.md) ;; *) echo "unexpected release identity file: $f" >&2; exit 1;; esac; done
          test "$(git rev-parse "$DEVELOP^{tree}")" = "$FEATURE_TREE"
          echo P01_V226_RELEASE_IDENTITY=PASS
      - name: Syntax fresh runtime and Raindrop contract
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          test -f docs/authority/P01_RAINDROP_PROTOTYPE_BASELINE_20260828.md
          grep -F 'Raindrop.io Web App' docs/authority/P01_RAINDROP_PROTOTYPE_BASELINE_20260828.md >/dev/null
          grep -F 'surface-workspace.css' src/app/SurfaceShell.php >/dev/null
          ! grep -F 'surface-vf-theme.css' src/app/SurfaceShell.php
          rm -rf /tmp/p01-v226-release /tmp/p01-v226.cookies /tmp/p01-v226-anon.cookies
          cp -a src /tmp/p01-v226-release; cd /tmp/p01-v226-release
          php -S 127.0.0.1:18320 -t . >/tmp/p01-v226-release.log 2>&1 & echo $! >/tmp/p01-v226-release.pid
          trap 'kill "$(cat /tmp/p01-v226-release.pid)" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/setup.php -o /tmp/setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies -X POST http://127.0.0.1:18320/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V226 Release' --data-urlencode 'admin_password=P01V226!Release' --data-urlencode 'admin_password_confirm=P01V226!Release' >/tmp/setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/verify.txt; grep -Fx 'VERIFY_PASS=YES' /tmp/verify.txt
          php cli/surface-verify.php | tee /tmp/surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/surface.txt; grep -Fx "WORKING_SCHEMA=$SCHEMA" /tmp/surface.txt
          php cli/baseline-verify.php | tee /tmp/base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/base.txt
          cat >/tmp/p01-v226-release-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v226-release/app/bootstrap.php';
          require_once '/tmp/p01-v226-release/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'Release Gate','description'=>'','is_private'=>false]);
          $start=$r->saveLink(null,['category_id'=>$c,'title'=>'GitHub','url'=>'https://github.com','description'=>'Start fixture','is_private'=>false,'is_favorite'=>true],'manual');
          $channel=$r->saveLink(null,['category_id'=>$c,'title'=>'硅谷101','url'=>'https://www.youtube.com/@release-channel','description'=>'长期内容源','is_private'=>true],'manual');
          $s->upsertProfile((int)$channel['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true,'note'=>'后台听']);
          $watch=$r->saveLink(null,['category_id'=>$c,'title'=>'奥本海默','url'=>'https://example.com/watch-release','description'=>'影视索引','is_private'=>true],'manual');
          $s->upsertProfile((int)$watch['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2023','media_status'=>'want','note'=>'想看']);
          $r->saveLink(null,['category_id'=>$c,'title'=>'待整理频道','url'=>'https://www.youtube.com/@release-pending','description'=>'等待归属','is_private'=>true,'is_pending'=>true],'manual');
          echo "SEED=PASS\n";
          PHP
          php /tmp/p01-v226-release-seed.php | grep -Fx 'SEED=PASS'
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18320/api.php?action=login' --data '{"password":"P01V226!Release"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/surfaces.php -o /tmp/all.html
          grep -F '全部收藏' /tmp/all.html >/dev/null
          grep -F '智能视图' /tmp/all.html >/dev/null
          grep -F 'vf-workspace-list' /tmp/all.html >/dev/null
          ! grep -F '你的互联网，从这里继续。' /tmp/all.html
          ! grep -F 'vf-space-switcher' /tmp/all.html
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/start.php -o /tmp/start.html
          grep -F '<h1>Start</h1>' /tmp/start.html >/dev/null
          grep -F 'vf-workspace-toolbar' /tmp/start.html >/dev/null
          ! grep -F '经典导航' /tmp/start.html
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/channels.php -o /tmp/channels.html
          grep -F '<h1>Channels</h1>' /tmp/channels.html >/dev/null
          grep -F 'vf-channel-row' /tmp/channels.html >/dev/null
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/watch.php -o /tmp/watch.html
          grep -F '<h1>Watch</h1>' /tmp/watch.html >/dev/null
          grep -F 'vf-watch-grid' /tmp/watch.html >/dev/null
          curl -fsS -c /tmp/p01-v226.cookies -b /tmp/p01-v226.cookies http://127.0.0.1:18320/surface-manager.php -o /tmp/inbox.html
          grep -F '<h1>待整理</h1>' /tmp/inbox.html >/dev/null
          grep -F '高级管理' /tmp/inbox.html >/dev/null
          ! grep -F 'vf-editor-row' /tmp/inbox.html
          curl -fsS -c /tmp/p01-v226-anon.cookies http://127.0.0.1:18320/ -o /tmp/public.html
          ! grep -F 'vf-app-sidebar' /tmp/public.html
          test "$(php -r "require 'app/bootstrap.php'; echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php'; echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V226_RELEASE_RUNTIME=PASS
      - name: Verdict
        run: |
          echo P01_V226_RELEASE_SOURCE=$SHA
          echo P01_V226_RELEASE_TREE=$TREE
          echo P01_V226_RELEASE_MACHINE=PASS
          echo SCHEMA=$SCHEMA
          echo PRODUCTION=NO
