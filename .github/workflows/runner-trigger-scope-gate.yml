name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Require registered private-read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$VF_PRIVATE_READ_TOKEN"

      - name: Checkout P02 base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 2a039204e849d0e4dc14f780fb7f86f2b6313c16
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p02-base
          persist-credentials: false

      - name: Checkout P02 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: b5f82c42c8ae57c16241fa8ccc7cf7b9d27cf3d8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p02-head
          persist-credentials: false

      - name: Checkout P04 base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: a5f4b451f3277e9e7f00aea40533cb34b20444e3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p04-base
          persist-credentials: false

      - name: Checkout P04 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: 93330c2104209f14754008f504d4fac74d0d78b1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p04-head
          persist-credentials: false

      - name: Checkout P05 base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: babbd3845928af985d4944118239b76f60f83d6f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p05-base
          persist-credentials: false

      - name: Checkout P05 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: 4ebfac484f95a07d69e4d04ae78dccf3df3f8247
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/p05-head
          persist-credentials: false

      - name: Checkout Theme base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: faf6112c60ae8aca399afec6e1bc85c6e646ab03
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/theme-base
          persist-credentials: false

      - name: Checkout Theme exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 788f507de4acb4a6f988d79f6c005ba3c2aa1528
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/theme-head
          persist-credentials: false

      - name: Checkout M3U8 base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: cdf737c5612f6d50876df4a3fe5932efac2d2201
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/m3u8-base
          persist-credentials: false

      - name: Checkout M3U8 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 3898843fc85a9878ef51129e6fcf9377e3b70d49
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/m3u8-head
          persist-credentials: false

      - name: Checkout Ops base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fbf1f115c568a75ada8c92f6673c8c447dd3613d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/ops-base
          persist-credentials: false

      - name: Checkout Ops exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8a5f7605d4a4816703f249ffa6bfd6552c104e4d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/ops-head
          persist-credentials: false

      - name: Checkout core-agent base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: d6fe8785ad595a4dacfd264b904f5202a5106bef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/core-base
          persist-credentials: false

      - name: Checkout core-agent exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: 5b5af83207984188137a263cf4135d59aaa14995
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/core-head
          persist-credentials: false

      - name: Checkout gov-doc base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 02f7b592bcc1b5e2b8887fed7550203a8dc5611a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/gov-base
          persist-credentials: false

      - name: Checkout gov-doc exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/gov-doc
          ref: 7b5e0657b9bd93d12d48649fdd3e0875b5994726
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: targets/gov-head
          persist-credentials: false

      - name: Verify exact-source control-plane deltas
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          ROOT = Path('targets')

          def tree(path):
              out = {}
              for p in sorted(path.rglob('*')):
                  if p.is_file() and '.git' not in p.parts:
                      rel = p.relative_to(path).as_posix()
                      out[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out

          def changed(base, head):
              b, h = tree(base), tree(head)
              return {p for p in set(b) | set(h) if b.get(p) != h.get(p)}

          def text(path):
              return path.read_text(encoding='utf-8')

          # P02/P04: Agent bootstrap only.
          assert changed(ROOT/'p02-base', ROOT/'p02-head') == {'AGENTS.md'}
          assert changed(ROOT/'p04-base', ROOT/'p04-head') == {'AGENTS.md'}
          for name in ('p02-head', 'p04-head'):
              agents = text(ROOT/name/'AGENTS.md')
              assert 'core-free-runner-public' in agents and 'core-free-runner-private' in agents
              assert 'core-test-runner' in agents
              assert '永久删除' in agents
              assert 'fallback' in agents

          # P05: one historical workflow move + Agent route correction only.
          p05_changed = changed(ROOT/'p05-base', ROOT/'p05-head')
          assert p05_changed == {
              'AGENTS.md',
              '.github/workflows/phase2-security.yml',
              'archive/workflows/phase2-security-v100.yml',
          }, sorted(p05_changed)
          assert not (ROOT/'p05-head/.github/workflows/phase2-security.yml').exists()
          assert (ROOT/'p05-head/archive/workflows/phase2-security-v100.yml').is_file()
          assert sorted(p.name for p in (ROOT/'p05-head/.github/workflows').glob('*.yml')) == ['ci.yml']
          p05_agents = text(ROOT/'p05-head/AGENTS.md')
          assert '永久删除' in p05_agents and 'fallback' in p05_agents

          # Tool repos: workflow-only move; no product source/version delta.
          for name, expected_base_count in [('theme', 5), ('m3u8', 3), ('ops', 1)]:
              base = ROOT/f'{name}-base'
              head = ROOT/f'{name}-head'
              delta = changed(base, head)
              assert delta, name
              assert all(p.startswith('.github/workflows/') or p.startswith('archive/workflows/') for p in delta), (name, sorted(delta))
              assert len(list((base/'.github/workflows').glob('*.yml'))) == expected_base_count
              assert len(list((head/'.github/workflows').glob('*.yml'))) == 0
              assert (base/'VERSION').read_bytes() == (head/'VERSION').read_bytes()

          # core-agent: only runtime authority model + its regression tests.
          core_changed = changed(ROOT/'core-base', ROOT/'core-head')
          assert core_changed == {
              'src/core_agent/profiles/vf/infra_authority.py',
              'tests/test_vf_infra_authority.py',
          }, sorted(core_changed)
          assert (ROOT/'core-base/VERSION').read_bytes() == (ROOT/'core-head/VERSION').read_bytes()

          # gov-doc: exact three governance files only.
          gov_changed = changed(ROOT/'gov-base', ROOT/'gov-head')
          expected_gov = {
              'governance/authority/VF_GIT_REPOSITORY_REGISTRY_V1.0.json',
              'projects/current/P03_VF_Forge/02_CURRENT.md',
              'governance/agent/VF_AGENT_INFRA_AUTHORITY.json',
          }
          assert gov_changed == expected_gov, sorted(gov_changed)

          base_registry = json.loads(text(ROOT/'gov-base/governance/authority/VF_GIT_REPOSITORY_REGISTRY_V1.0.json'))
          head_registry = json.loads(text(ROOT/'gov-head/governance/authority/VF_GIT_REPOSITORY_REGISTRY_V1.0.json'))
          bmap = {x['repository']: x for x in base_registry['repositories']}
          hmap = {x['repository']: x for x in head_registry['repositories']}
          assert set(bmap) == set(hmap)
          assert hmap['llhzx2018/vf-forge']['lifecycle'] == 'HISTORICAL'
          assert hmap['llhzx2018/vf-forge']['route_status'] == 'NON_AUTHORITY'
          for repo in bmap:
              if repo != 'llhzx2018/vf-forge':
                  assert bmap[repo] == hmap[repo], repo

          pointer = text(ROOT/'gov-head/projects/current/P03_VF_Forge/02_CURRENT.md')
          assert 'RETIRED / HISTORICAL / NON-AUTHORITY' in pointer
          assert 'automatic routing = FORBIDDEN' in pointer

          base_auth = json.loads(text(ROOT/'gov-base/governance/agent/VF_AGENT_INFRA_AUTHORITY.json'))
          head_auth = json.loads(text(ROOT/'gov-head/governance/agent/VF_AGENT_INFRA_AUTHORITY.json'))
          assert 'legacy_runner' in base_auth
          assert 'legacy_runner' not in head_auth
          stripped = dict(base_auth)
          stripped.pop('legacy_runner')
          assert stripped == head_auth
          tomb = head_auth['legacy_runner_tombstone']
          assert tomb['canonical_id'] == 'llhzx2018/core-test-runner'
          assert tomb['state'] == 'DELETED'
          assert tomb['current_route'] is False
          assert tomb['compatibility_policy'] == 'TOMBSTONE_AND_MIGRATION_EVIDENCE_ONLY'

          print('ESTATE_CONTROL_PLANE_STATIC=PASS')
          PY

      - name: Verify core-agent exact source
        working-directory: targets/core-head
        run: |
          python scripts/verify.py
          PYTHONPATH=src python - <<'PY'
          from core_agent.profiles.vf.infra_authority import VFInfrastructureAuthority

          mapping = {
              'public_runner': 'llhzx2018/core-free-runner-public',
              'private_runner': 'llhzx2018/core-free-runner-private',
              'legacy_runner': 'llhzx2018/core-test-runner',
              'credentials': {
                  'private_read': 'VF_PRIVATE_READ_TOKEN',
                  'release_write': 'VF_RELEASE_WRITE_TOKEN',
              },
              'hard_rules': {
                  'allow_third_runner': False,
                  'allow_third_credential': False,
              },
          }
          value = VFInfrastructureAuthority.from_mapping(mapping)
          assert value.registered_runners == (
              'llhzx2018/core-free-runner-public',
              'llhzx2018/core-free-runner-private',
          )
          assert not hasattr(value, 'legacy_runner')
          try:
              value.validate_runner('llhzx2018/core-test-runner')
          except PermissionError:
              pass
          else:
              raise AssertionError('deleted legacy runner must be rejected')
          print('CORE_AGENT_LEGACY_RUNNER_CONTRACT=PASS')
          PY

      - name: Emit public-safe batch receipt
        run: |
          python - <<'PY'
          import hashlib, json
          receipt = {
              'schema': 'vf-estate-convergence-batch/v1',
              'status': 'PASS',
              'sources': {
                  'P02': 'b5f82c42c8ae57c16241fa8ccc7cf7b9d27cf3d8',
                  'P04': '93330c2104209f14754008f504d4fac74d0d78b1',
                  'P05': '4ebfac484f95a07d69e4d04ae78dccf3df3f8247',
                  'S01-C01': '788f507de4acb4a6f988d79f6c005ba3c2aa1528',
                  'S01-C03': '3898843fc85a9878ef51129e6fcf9377e3b70d49',
                  'S01-C02': '8a5f7605d4a4816703f249ffa6bfd6552c104e4d',
                  'core-agent': '5b5af83207984188137a263cf4135d59aaa14995',
                  'gov-doc': '7b5e0657b9bd93d12d48649fdd3e0875b5994726',
              },
              'private_source_persisted': False,
          }
          raw = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          print(json.dumps(receipt, sort_keys=True))
          print('PUBLIC_SAFE_RECEIPT_SHA256=' + hashlib.sha256(raw).hexdigest())
          print('ESTATE_CONVERGENCE_BATCH_MACHINE=PASS')
          PY
