name: Public Runner Trigger Scope Gate
# P01 Round 3 corrected-candidate rerun

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-navigation-ux-round3-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_navigation_ux_round3:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-navigation-ux-round3-gate-r2-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary gate lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 773b78be926e7baaabe44c03a233111a27a1e6d5
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p01

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo
          coverage: none

      - name: Run P01 Navigation UX Round 3 gate
        shell: bash
        working-directory: runner
        env:
          P01_ROOT: ../p01
        run: bash scripts/p01-navigation-ux-round3-gate.sh

      - name: Upload public-safe gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-navigation-ux-round3-${{ github.run_id }}
          path: runner/evidence/runner/P01_NAVIGATION_UX_ROUND3_GATE.txt
          if-no-files-found: error
          retention-days: 14
