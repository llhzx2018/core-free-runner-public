name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24716-navigation-ux-round3-release-wrapper.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24716_navigation_ux_round3_release_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24716-navigation-ux-round3-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.16 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f953988b4001f04b36c027168a815d80ae3b5fb7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact V2.47.15 release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: abe82d469c24b8f1d5f8d4081800b4abfadc6148
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-v24714-navigation-row-release-gate-20260918
          persist-credentials: false
          fetch-depth: 1
          path: old-gate

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and PHP/JS syntax
        shell: bash
        run: |
          test "$(cat target/VERSION)" = "2.47.16"
          test "$(cat target/src/VERSION.txt)" = "2.47.16"
          grep -Fq "define('VF_VERSION', '2.47.16');" target/src/app/bootstrap.php
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24715-php-lint.txt
          node --check target/src/assets/workspace.js

      - name: Run V2.47.16 formal release gate
        shell: bash
        working-directory: runner
        env:
          TARGET_ROOT: ../target
          BASELINE_ROOT: ../baseline
          OLD_HARNESS_ROOT: ../old-harness
          PROVEN_ROOT: ../proven
          OLD_GATE_ROOT: ../old-gate
        run: bash scripts/p01-v24716-navigation-ux-round3-release-wrapper.sh

      - name: Upload V2.47.16 gate assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24716-navigation-ux-round3-${{ github.run_id }}
          path: |
            /tmp/p01-v24716-navigation-round3/VF-Start-V2.47.16-FULL.zip
            /tmp/p01-v24716-navigation-round3/VF-Start-V2.47.16-FULL.zip.sha256
            /tmp/p01-v24716-navigation-round3/VF_Start_V2.47.16_UPDATE.zip
            /tmp/p01-v24716-navigation-round3/VF_Start_V2.47.16_UPDATE.zip.sha256
            /tmp/p01-v24716-navigation-round3/P01.json
            /tmp/p01-v24716-navigation-round3/SHA256SUMS.txt
            /tmp/p01-v24716-navigation-round3/R16_GATE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish VF Start V2.47.16 Formal Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24716-navigation-round3
          REPO=llhzx2018/vf-start
          TAG=v2.47.16
          SOURCE=f953988b4001f04b36c027168a815d80ae3b5fb7
          TREE=a0271a55adf8e95379e1e762589f33b6cc8d6e6d

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.16"

          test "$(sha256sum "$OUT/VF-Start-V2.47.16-FULL.zip" | awk '{print $1}')" = "aa204ca30d76d8fd1d82bd70f5c73c59c60d8c8233cd87a35b23619d0776d920"
          test "$(sha256sum "$OUT/VF_Start_V2.47.16_UPDATE.zip" | awk '{print $1}')" = "d9676a26f1824f85e9b05b9dfa6f754a8130d40f1b1b9491fc8f3ba8dbd13903"
          test "$(stat -c %s "$OUT/VF-Start-V2.47.16-FULL.zip")" = "870659"
          test "$(stat -c %s "$OUT/VF_Start_V2.47.16_UPDATE.zip")" = "1856108"
          grep -Fx 'P01_V24716_NAVIGATION_UX_ROUND3_RELEASE_GATE=PASS' "$OUT/R16_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R16_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R16_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R16_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R16_GATE_RECEIPT.txt"

          cat > /tmp/p01-v24716-release-notes.md <<EOF
          VF Start V2.47.16 · Navigation UX Round 3.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.15 → V2.47.16
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Adds owner-only Favorite / Popular / Recent behavior views while keeping public privacy boundaries intact.
          - Preserves search, category, scope, kind, sort, Favorite and software-detail context across Navigation flows.
          - Keeps Favorite counts and badges live and coherent across Start / Tool / Software derived views.
          - Retains Round 2 multi-term search, clearable context, pagination anchor and exact-URL scroll continuity.

          Machine proof: Public Runner $GITHUB_RUN_ID PASS.
          - Clean FULL install / admin login / setup lock PASS
          - V2.47.15 → V2.47.16 Atomic update PASS
          - Managed update credential preserved with 0600 mode
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Round 2 navigation regression PASS
          - Round 3 owner behavior / privacy / context contracts PASS
          - Public Authority release coverage PASS
          - Production NOT_WRITTEN

          FULL sha256: aa204ca30d76d8fd1d82bd70f5c73c59c60d8c8233cd87a35b23619d0776d920
          UPDATE sha256: d9676a26f1824f85e9b05b9dfa6f754a8130d40f1b1b9491fc8f3ba8dbd13903

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24716-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            existing_target=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')
            test "$existing_target" = "$SOURCE"
          else
            gh release create "$TAG"               "$OUT/VF-Start-V2.47.16-FULL.zip"               "$OUT/VF-Start-V2.47.16-FULL.zip.sha256"               "$OUT/VF_Start_V2.47.16_UPDATE.zip"               "$OUT/VF_Start_V2.47.16_UPDATE.zip.sha256"               "$OUT/SHA256SUMS.txt"               --repo "$REPO"               --target "$SOURCE"               --title "VF Start V2.47.16"               --notes-file /tmp/p01-v24716-release-notes.md
          fi

          READBACK=/tmp/p01-v24716-release-readback
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')" = "$SOURCE"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.draft')" = "false"
          test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.prerelease')" = "false"
          gh release download "$TAG" --repo "$REPO" --dir "$READBACK"
          test "$(sha256sum "$READBACK/VF-Start-V2.47.16-FULL.zip" | awk '{print $1}')" = "aa204ca30d76d8fd1d82bd70f5c73c59c60d8c8233cd87a35b23619d0776d920"
          test "$(sha256sum "$READBACK/VF_Start_V2.47.16_UPDATE.zip" | awk '{print $1}')" = "d9676a26f1824f85e9b05b9dfa6f754a8130d40f1b1b9491fc8f3ba8dbd13903"
          echo "P01_V24716_FORMAL_RELEASE_READBACK=PASS"
          echo "PRODUCTION=NOT_WRITTEN"
