name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24712-production-http-e2e.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p01_v24712_real_http_update_e2e:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24712-production-atomic-repro-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout temporary HTTP repro lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact Production V2.47.10 source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: 972541fd06c66044105ec1b19cf7738c340c90c1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Download exact V2.47.12 merged-source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run download 35333470967 --repo llhzx2018/core-free-runner-public --name p01-v24712-immutable-update-35333470967 --dir artifact

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Run real HTTP login-CSRF-check-prepare-install E2E
        shell: bash
        working-directory: runner
        env:
          BASELINE_ROOT: ../baseline
          ARTIFACT_ROOT: ../artifact
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: bash scripts/p01-v24712-production-http-e2e.sh

      - name: Upload HTTP repro evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24712-real-http-update-e2e-${{ github.run_id }}
          path: /tmp/p01-v24712-http-e2e-evidence/**
          if-no-files-found: warn
          retention-days: 14
