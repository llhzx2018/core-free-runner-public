name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24710-atomic-diagnostic-publish.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24710_atomic_diagnostic_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24712-production-atomic-repro-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary diagnostic lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Build, publish, and remote-readback one-time diagnostic
        shell: bash
        working-directory: runner
        run: bash scripts/p01-v24710-atomic-diagnostic-publish.sh

      - name: Upload public-safe diagnostic receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24710-atomic-diagnostic-${{ github.run_id }}
          path: runner/evidence/runner/P01_V24710_ATOMIC_DIAGNOSTIC_PUBLISH.txt
          if-no-files-found: error
          retention-days: 14
