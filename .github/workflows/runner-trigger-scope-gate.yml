name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

      - name: Checkout private runner exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 5315ce7341cbae69df12a66bb332158189b9f805
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: verify/private-runner-source

      - name: Verify private runner exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C verify/private-runner-source rev-parse HEAD)"
          test "$actual" = "5315ce7341cbae69df12a66bb332158189b9f805"
          echo "PRIVATE_RUNNER_NODE24_SOURCE=$actual"

      - name: Run private runner Node24 machine verification
        working-directory: verify/private-runner-source
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_runner_trigger_scope.py --inventory
          python -m unittest tests/test_runner_trigger_scope.py
          python scripts/check_workflow_lifecycle.py
          python -m unittest tests/test_workflow_lifecycle.py
          echo 'PRIVATE_RUNNER_NODE24_MACHINE=PASS'
