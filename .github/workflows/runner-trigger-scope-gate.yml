name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      P06_SOURCE_SHA: 644e43538bf18a72195d1235ba97e38b33d98756
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Require private read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 PR13 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.P06_SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 3
          path: source

      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -m | grep -Fxq PDO
          php -m | grep -Fxq pdo_sqlite
          php -m | grep -Fxq sqlite3
          php -m | grep -Fxq mbstring
          php -m | grep -Fxq zip
          php -m | grep -Fxq curl
          echo P06_PR13_MACHINE_RUNTIME=PASS

      - name: Execute P06 PR13 exact-source gate
        shell: bash
        run: bash scripts/temp-p06-pr13-exact-gate.sh source
