name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24711-channel-hotfix-r1-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24711_channel_hotfix_r1_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24711-atomic-hotfix-publish-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary channel gate lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-updates
          ref: 0f054443ff838ecb9bc49ac5ed111424d6c9e743
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core

      - name: Run exact Update Core + remote asset gate
        shell: bash
        working-directory: runner
        env:
          CORE_ROOT: ../core
        run: bash scripts/p01-v24711-channel-hotfix-r1-gate.sh

      - name: Upload public-safe channel gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24711-channel-hotfix-r1-${{ github.run_id }}
          path: runner/evidence/runner/P01_V24711_CHANNEL_HOTFIX_R1_GATE.txt
          if-no-files-found: error
          retention-days: 14
