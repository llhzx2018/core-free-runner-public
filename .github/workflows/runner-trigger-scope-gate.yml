name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24714-navigation-row-release-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24714_navigation_row_release_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24714-navigation-row-release-gate-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary gate lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.14 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: 421e7b5df1e48db768b39470fc99580330a07c0f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact released V2.47.13 source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: e714cfe540ad39202c2cb558e5c0a370ef6d6502
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and PHP lint
        shell: bash
        run: |
          test "$(cat target/VERSION)" = "2.47.14"
          test "$(cat target/src/VERSION.txt)" = "2.47.14"
          grep -Fq "define('VF_VERSION', '2.47.14');" target/src/app/bootstrap.php
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24714-php-lint.txt

      - name: Run V2.47.14 release gate
        shell: bash
        working-directory: runner
        env:
          TARGET_ROOT: ../target
          BASELINE_ROOT: ../baseline
          OLD_HARNESS_ROOT: ../old-harness
          PROVEN_ROOT: ../proven
        run: bash scripts/p01-v24714-navigation-row-release-gate.sh

      - name: Upload public-safe V2.47.14 gate assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24714-navigation-row-${{ github.run_id }}
          path: |
            /tmp/p01-v24714-navigation/VF-Start-V2.47.14-FULL.zip
            /tmp/p01-v24714-navigation/VF-Start-V2.47.14-FULL.zip.sha256
            /tmp/p01-v24714-navigation/VF_Start_V2.47.14_UPDATE.zip
            /tmp/p01-v24714-navigation/VF_Start_V2.47.14_UPDATE.zip.sha256
            /tmp/p01-v24714-navigation/P01.json
            /tmp/p01-v24714-navigation/SHA256SUMS.txt
            /tmp/p01-v24714-navigation/R14_GATE_RECEIPT.txt
          if-no-files-found: warn
          retention-days: 14
