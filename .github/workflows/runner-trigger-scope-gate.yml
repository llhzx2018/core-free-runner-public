name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_navigation_ux_round4_gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-navigation-ux-round4-gate-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary proof lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 5abc6c369be8f5367f6f1097c197039493c9bd03
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "5abc6c369be8f5367f6f1097c197039493c9bd03"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.16"
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo 'P01_NAVIGATION_UX_ROUND4_SOURCE_IDENTITY=PASS'

      - name: Run focused shell and Navigation regressions
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php tests/unit/global_account_actions_contract.php
          php tests/unit/public_global_nav_contract.php
          php tests/unit/navigation_public_row_layout_contract.php
          php tests/unit/navigation_owner_behavior_privacy_contract.php
          php tests/unit/navigation_owner_views_round3_contract.php
          php tests/unit/subject_domain_nav_shell_contract.php
          php tests/unit/navigation_search_context_contract.php
          echo 'P01_NAVIGATION_UX_ROUND4_FOCUSED_REGRESSION=PASS'

      - name: Fresh HTTP shell smoke
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-round4-runtime
          cp -a target/src /tmp/p01-round4-runtime
          cd /tmp/p01-round4-runtime
          php -S 127.0.0.1:18097 -t . >/tmp/p01-round4-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-round4.cookies -b /tmp/p01-round4.cookies http://127.0.0.1:18097/setup.php -o /tmp/p01-round4-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-round4-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"', text)
          assert m, 'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-round4.cookies -b /tmp/p01-round4.cookies -X POST http://127.0.0.1:18097/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=P01 Round4 Gate'             --data-urlencode 'admin_password=Round4Gate!2026'             --data-urlencode 'admin_password_confirm=Round4Gate!2026'             -o /tmp/p01-round4-setup-post.html
          curl -fsS http://127.0.0.1:18097/start.php?scope=public -o /tmp/p01-round4-public.html
          grep -F 'class="vf-global-domain-links"' /tmp/p01-round4-public.html >/dev/null
          grep -F 'class="vf-global-account-actions is-anonymous"' /tmp/p01-round4-public.html >/dev/null
          grep -F 'data-vf-auth-login' /tmp/p01-round4-public.html >/dev/null
          ! grep -F 'href="settings.php" class="vf-global-account-action vf-global-account-settings"' /tmp/p01-round4-public.html >/dev/null

          curl -fsS -c /tmp/p01-round4.cookies -b /tmp/p01-round4.cookies http://127.0.0.1:18097/start.php -o /tmp/p01-round4-owner.html
          grep -F 'class="vf-global-domain-links"' /tmp/p01-round4-owner.html >/dev/null
          grep -F 'class="vf-global-account-actions"' /tmp/p01-round4-owner.html >/dev/null
          grep -F 'href="settings.php" class="vf-global-account-action vf-global-account-settings"' /tmp/p01-round4-owner.html >/dev/null
          grep -F 'href="surface-manager.php?advanced=1" role="menuitem">资源管理</a>' /tmp/p01-round4-owner.html >/dev/null
          grep -F 'href="recycle-bin.php" role="menuitem">回收站</a>' /tmp/p01-round4-owner.html >/dev/null
          grep -F 'data-vf-auth-logout' /tmp/p01-round4-owner.html >/dev/null
          echo 'P01_NAVIGATION_UX_ROUND4_FRESH_HTTP_SHELL=PASS'

      - name: Gate receipt
        shell: bash
        run: |
          echo 'P01_NAVIGATION_UX_ROUND4_GATE=PASS'
          echo 'SCHEMA_CHANGE=NONE'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION=NOT_WRITTEN'
