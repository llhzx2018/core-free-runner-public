name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24720_full_unit_discovery:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-v24720-full-unit-discovery-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout temporary discovery lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout current P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f9f4698ef6ac40595b2401a3771d3ee36485e4dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Run all P01 unit contracts
        shell: bash
        working-directory: target
        run: |
          set -u
          test "$(git rev-parse HEAD)" = "f9f4698ef6ac40595b2401a3771d3ee36485e4dc"
          total=0
          pass=0
          fail=0
          : >/tmp/p01-unit-failures.txt
          while IFS= read -r test_file; do
            total=$((total+1))
            echo "===== UNIT $test_file ====="
            if timeout 120 php -d display_errors=1 "$test_file"; then
              pass=$((pass+1))
              echo "UNIT_RESULT=PASS $test_file"
            else
              rc=$?
              fail=$((fail+1))
              echo "$test_file|$rc" >>/tmp/p01-unit-failures.txt
              echo "UNIT_RESULT=FAIL rc=$rc $test_file"
            fi
          done < <(find tests/unit -maxdepth 1 -type f -name '*.php' | sort)
          echo "P01_UNIT_TOTAL=$total"
          echo "P01_UNIT_PASS=$pass"
          echo "P01_UNIT_FAIL=$fail"
          echo "===== FAILURES ====="
          cat /tmp/p01-unit-failures.txt
          test "$fail" -eq 0

      - name: Discovery receipt
        if: always()
        shell: bash
        run: |
          echo 'P01_V24720_FULL_UNIT_DISCOVERY=COMPLETED'
          echo 'PRODUCTION=NOT_WRITTEN'
