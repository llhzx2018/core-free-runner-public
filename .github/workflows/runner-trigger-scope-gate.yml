name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1112-lock-metadata:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v1112-backend-update-gate-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_EXACT_SOURCE: 8b39ed235a9db50e36ce9f754634c53761cb92c9
    steps:
      - name: Checkout exact private P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind frozen version source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.12'
          node -e "const p=require('./package.json');if(p.version!=='1.1.12')process.exit(1)"
          echo 'P05_V1112_VERSION_SOURCE=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 Node24
        with:
          node-version: 24
          cache: npm

      - name: Regenerate product-version lock metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --package-lock-only --ignore-scripts
          node - <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(lock.version!=='1.1.12'||lock.packages?.['']?.version!=='1.1.12') process.exit(1);
          NODE
          npm run release:source:gate
          echo '--- package-lock metadata diff ---'
          git diff -- package-lock.json
          echo 'P05_V1112_LOCK_METADATA=PASS'

      - name: Upload generated package-lock
        uses: actions/upload-artifact@v4
        with:
          name: p05-v1112-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Seal lock generation
        run: |
          echo 'P05_V1112_LOCK_GENERATION=PASS'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
