name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24720_browser_runtime_discovery:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-v24720-browser-runtime-discovery-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout temporary discovery lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout current P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f9f4698ef6ac40595b2401a3771d3ee36485e4dc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Fresh runtime setup
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-browser-runtime
          cp -a target/src /tmp/p01-browser-runtime
          cd /tmp/p01-browser-runtime
          php -S 127.0.0.1:18104 -t . >/tmp/p01-browser-runtime-server.log 2>&1 &
          echo $! >/tmp/p01-browser-runtime-server.pid
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-browser.cookies -b /tmp/p01-browser.cookies http://127.0.0.1:18104/setup.php -o /tmp/p01-browser-setup.html; then break; fi
            sleep 1
          done
          SETUP_CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-browser-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"', text)
          assert m, 'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-browser.cookies -b /tmp/p01-browser.cookies -X POST http://127.0.0.1:18104/setup.php             --data-urlencode "setup_csrf=$SETUP_CSRF"             --data-urlencode 'site_title=P01 Browser Discovery'             --data-urlencode 'admin_password=BrowserDiscovery!2026'             --data-urlencode 'admin_password_confirm=BrowserDiscovery!2026'             -o /tmp/p01-browser-setup-post.html
          echo 'P01_BROWSER_FRESH_SETUP=PASS'

      - name: Browser runtime exception sweep
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'P01_BROWSER_RUNTIME_INFRA=NO_CHROME'
            exit 2
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --remote-debugging-port=9222 --user-data-dir=/tmp/p01-browser-profile about:blank             >/tmp/p01-chrome.log 2>&1 &
          echo $! >/tmp/p01-chrome.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/p01-cdp-list.json; then break; fi
            sleep 1
          done
          cat >/tmp/p01-cdp-smoke.mjs <<'NODE'
          const targets = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const wsUrl = targets.find(t=>t.type==='page')?.webSocketDebuggerUrl;
          if(!wsUrl) throw new Error('CDP page target missing');
          const ws = new WebSocket(wsUrl);
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let seq=0;
          const pending=new Map();
          const waiters=new Map();
          const exceptions=[];
          let currentRoute='about:blank';
          ws.onmessage=event=>{
            const msg=JSON.parse(event.data);
            if(msg.id && pending.has(msg.id)){
              const {resolve,reject}=pending.get(msg.id);pending.delete(msg.id);
              if(msg.error)reject(new Error(msg.error.message||JSON.stringify(msg.error)));else resolve(msg.result||{});
              return;
            }
            if(msg.method==='Runtime.exceptionThrown'){
              const d=msg.params?.exceptionDetails||{};
              const message=d.exception?.description||d.text||'Runtime exception';
              exceptions.push({route:currentRoute,type:'exception',message});
            }
            if(msg.method==='Runtime.consoleAPICalled' && msg.params?.type==='error'){
              const message=(msg.params.args||[]).map(a=>a.value??a.description??'').join(' ');
              exceptions.push({route:currentRoute,type:'console.error',message});
            }
            const list=waiters.get(msg.method);
            if(list?.length){
              const fn=list.shift();fn(msg.params||{});
            }
          };
          const send=(method,params={})=>new Promise((resolve,reject)=>{
            const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));
          });
          const once=method=>new Promise(resolve=>{
            const list=waiters.get(method)||[];list.push(resolve);waiters.set(method,list);
          });
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          await send('Runtime.enable');
          await send('Page.enable');

          const navigate=async route=>{
            currentRoute=route;
            const loaded=once('Page.loadEventFired');
            await send('Page.navigate',{url:'http://127.0.0.1:18104/'+route});
            await Promise.race([loaded,sleep(5000)]);
            await sleep(500);
          };

          await navigate('start.php');
          const login=await send('Runtime.evaluate',{
            expression:`(async()=>{const r=await fetch('api.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:'BrowserDiscovery!2026'})});return await r.text()})()`,
            awaitPromise:true,returnByValue:true
          });
          const loginText=String(login.result?.value||'');
          if(!loginText.includes('"ok":true'))throw new Error('browser login failed: '+loginText);
          await navigate('start.php');

          const create=await send('Runtime.evaluate',{
            expression:`(async()=>{const n=document.getElementById('vf-workspace-data');const s=JSON.parse(n.textContent||'{}');const fd=new FormData();[['csrf',s.csrf],['surface','start'],['source_kind','remote_url'],['title','Runtime Smoke Resource'],['url','https://example.com/runtime-smoke'],['is_private','1'],['is_favorite','0']].forEach(([k,v])=>fd.set(k,v));const r=await fetch('workspace-create.php',{method:'POST',body:fd,credentials:'same-origin'});return await r.text()})()`,
            awaitPromise:true,returnByValue:true
          });
          if(!String(create.result?.value||'').includes('"ok":true'))throw new Error('fixture create failed: '+String(create.result?.value||''));

          const routes=[
            'home.php',
            'start.php',
            'surfaces.php',
            'channels.php',
            'watch.php',
            'topics.php',
            'courses.php',
            'projects.php',
            'tools.php',
            'software.php',
            'surface-manager.php',
            'recycle-bin.php',
            'settings.php',
            'data-recovery.php',
            'update.php'
          ];
          for(const route of routes){
            await navigate(route);
            const state=await send('Runtime.evaluate',{expression:`({title:document.title,ready:document.readyState,body:document.body?.className||''})`,returnByValue:true});
            console.log('PAGE_OK',route,JSON.stringify(state.result?.value||{}));
          }

          // Exercise the shared Favorite click on a real Navigation row.
          await navigate('start.php');
          const favorite=await send('Runtime.evaluate',{
            expression:`(async()=>{const b=document.querySelector('[data-favorite-id]');if(!b)return 'NO_FAVORITE_BUTTON';b.click();await new Promise(r=>setTimeout(r,900));return document.querySelector('.vf-workspace-toast')?.textContent||'NO_TOAST'})()`,
            awaitPromise:true,returnByValue:true
          });
          console.log('FAVORITE_CLICK',String(favorite.result?.value||''));

          await sleep(400);
          console.log('P01_BROWSER_RUNTIME_EXCEPTION_COUNT='+exceptions.length);
          exceptions.forEach((e,i)=>console.log('BROWSER_EXCEPTION_'+(i+1)+'='+JSON.stringify(e)));
          ws.close();
          if(exceptions.length)process.exit(1);
          NODE
          node /tmp/p01-cdp-smoke.mjs

      - name: Discovery receipt
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/p01-chrome.pid ]; then kill "$(cat /tmp/p01-chrome.pid)" >/dev/null 2>&1 || true; fi
          if [ -f /tmp/p01-browser-runtime-server.pid ]; then kill "$(cat /tmp/p01-browser-runtime-server.pid)" >/dev/null 2>&1 || true; fi
          echo 'P01_V24720_BROWSER_RUNTIME_DISCOVERY=COMPLETED'
          echo 'PRODUCTION=NOT_WRITTEN'
