name: Public Runner Trigger Scope Gate

on:
  schedule:
    # Scheduled polling is supported on public main; GitHub may delay ticks.
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/monitor_cross_project_public_authority.py'
      - 'tests/test_monitor_cross_project_public_authority.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
      - 'scripts/monitor_cross_project_public_authority.py'
      - 'tests/test_monitor_cross_project_public_authority.py'
  workflow_dispatch:
    inputs:
      cross_project_ci:
        description: 'Read-only cross-project public authority check for eight scoped PRs'
        type: boolean
        default: false
      entry_check:
        description: 'Verify live VF repository entry coverage (read-only)'
        type: boolean
        default: false
      gov_source_sha:
        description: 'main or an approved exact GOV-DOC commit SHA'
        type: string
        default: main

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger-scope owned regression tests
        run: python -m unittest tests.test_runner_trigger_scope tests.test_estate_anti_drift -v

      - name: Verify long-lived CI monitor positive and denial fixtures
        run: python3 -B -m unittest tests.test_monitor_cross_project_public_authority -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  entry-regressions:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.entry_check) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'llhzx2018' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'maintenance/gov-entry-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOV_REF: ${{ inputs.gov_source_sha || 'main' }}
    steps:
      - name: Validate read-only source selection
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GOV_REF" = main || "$GOV_REF" =~ ^[a-f0-9]{40}$ ]] || exit 78

      - name: Checkout transient governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-entry-source

      - name: Bind exact governance source
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C gov-entry-source rev-parse HEAD)"
          if [ "$GOV_REF" != main ]; then test "$SOURCE_SHA" = "$GOV_REF"; fi
          echo "GOV_EXACT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "GOV_ENTRY_SOURCE_SHA=$SOURCE_SHA"

      - name: Verify identity and coverage regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -m unittest discover -s gov-entry-source/governance/agent -p test_repository_entry.py > "$RUNNER_TEMP/entry-tests.log" 2>&1; then
            echo 'GOV_ENTRY_REGRESSIONS=PASS'
          else
            echo 'GOV_ENTRY_REGRESSIONS=FAIL'
            exit 1
          fi

      - name: Cleanup transient private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-entry-source
          rm -f "$RUNNER_TEMP/entry-tests.log"

  architecture-seven:
    name: "GOV-DOC 183 exact architecture ${{ matrix.id }}"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'maintenance/gov-entry-seven-arch-')
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: "P01", repo: "llhzx2018/vf-start", sha: "e9f6207cf77db08f3cacfc9c4b11c63b3af904d9", ext: ".php"}
          - {id: "P02", repo: "llhzx2018/vf-library", sha: "b76b9df23cddb276e0e33fa72aad3ff7c2440e6a", ext: ".php"}
          - {id: "P07", repo: "llhzx2018/vf-server-ops", sha: "774f92225d4dd16358f779f14722cf96fe1445b8", ext: ".py"}
          - {id: "P08", repo: "llhzx2018/vf-adops", sha: "ec1765b3612f76faf65c052d48337a5fd39f5a49", ext: ".php"}
          - {id: "S01-C01", repo: "llhzx2018/vf-tools-theme", sha: "556ceeeffc8ca0131a66977ade52cefe3b74b7ea", ext: ".php"}
          - {id: "S01-C02", repo: "llhzx2018/vf-tools-ops", sha: "fca62221d2fb021592a1b53aa1f38a4ea731ab69", ext: ".php"}
          - {id: "S01-C03", repo: "llhzx2018/vf-tools-m3u8", sha: "9f7a98552948e401924293c87b6f38fcc8fd8482", ext: ".php"}
    steps:
      - name: Checkout exact private product read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-product-src
      - name: Checkout canonical GOV-DOC read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 96aa0cdf349086225bbb000ae6b953c284e8594b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-policy-src
      - name: Actual exact-source architecture and positive/negative Git fixtures
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_EXT: ${{ matrix.ext }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-product-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gov-policy-src rev-parse HEAD)" = 96aa0cdf349086225bbb000ae6b953c284e8594b
          mkdir -p "$RUNNER_TEMP/vf-arch-seven"
          if python3 -B -m unittest discover -s private-product-src/.github/checks -p 'test_architecture_gate.py' -q > "$RUNNER_TEMP/vf-arch-seven/adapter.log" 2>&1; then
            echo "ARCH_ADAPTER_FIXTURES=PASS;ID=$TARGET_ID"
          else echo "ARCH_ADAPTER_FIXTURES=FAIL;ID=$TARGET_ID"; exit 1; fi
          if python3 -B -m unittest discover -s gov-policy-src/governance/agent -p 'test_code_architecture_lint.py' -q > "$RUNNER_TEMP/vf-arch-seven/gov-tests.log" 2>&1; then
            echo "ARCH_CANONICAL_FIXTURES=PASS;ID=$TARGET_ID"
          else echo "ARCH_CANONICAL_FIXTURES=FAIL;ID=$TARGET_ID"; exit 1; fi
          BASE="$(git -C private-product-src merge-base HEAD origin/main)"
          if (cd private-product-src && python3 -B .github/checks/architecture_gate.py \
             --manifest .github/checks/code_architecture.json --gov-root ../gov-policy-src \
             --git-root . --base-sha "$BASE" --head-sha "$TARGET_SHA") \
             > "$RUNNER_TEMP/vf-arch-seven/actual-diff.log" 2>&1; then
            echo "ARCH_EXACT_SOURCE_DIFF=PASS;ID=$TARGET_ID"
          else echo "ARCH_EXACT_SOURCE_DIFF=FAIL;ID=$TARGET_ID"; exit 1; fi
          FIXTURE="$RUNNER_TEMP/vf-arch-seven/synthetic"
          git init -q "$FIXTURE"
          git -C "$FIXTURE" config user.email arch-fixture@example.test
          git -C "$FIXTURE" config user.name "Architecture Fixture"
          git -C "$FIXTURE" remote add origin "https://github.com/$TARGET_REPO.git"
          printf 'synthetic\n' > "$FIXTURE/README.md"
          git -C "$FIXTURE" add .
          git -C "$FIXTURE" commit -qm base
          B1="$(git -C "$FIXTURE" rev-parse HEAD)"
          ROOT_CODE="$(python3 -c 'import json; print(json.load(open("private-product-src/.github/checks/code_architecture.json"))["gov_manifest"]["layers"][0]["roots"][0])')"
          [[ "$ROOT_CODE" =~ ^[A-Za-z0-9_/-]+/$ ]] || exit 81
          mkdir -p "$FIXTURE/$ROOT_CODE"
          TARGET="$FIXTURE/$ROOT_CODE""architecture-synthetic$TARGET_EXT"
          printf 'x\n' > "$TARGET"
          git -C "$FIXTURE" add .
          git -C "$FIXTURE" commit -qm small
          H1="$(git -C "$FIXTURE" rev-parse HEAD)"
          arch_fixture() {
            python3 -B "$GITHUB_WORKSPACE/private-product-src/.github/checks/architecture_gate.py" \
              --manifest "$GITHUB_WORKSPACE/private-product-src/.github/checks/code_architecture.json" \
              --gov-root "$GITHUB_WORKSPACE/gov-policy-src" --git-root "$FIXTURE" "$@"
          }
          if arch_fixture --base-sha "$B1" --head-sha "$H1" > "$RUNNER_TEMP/vf-arch-seven/small.log" 2>&1; then
            echo "ARCH_SYNTHETIC_SMALL=PASS;ID=$TARGET_ID"
          else echo "ARCH_SYNTHETIC_SMALL=FAIL;ID=$TARGET_ID"; exit 1; fi
          python3 -c 'import pathlib,sys; pathlib.Path(sys.argv[1]).write_text("x\n"*401)' "$TARGET"
          git -C "$FIXTURE" add .
          git -C "$FIXTURE" commit -qm oversized
          H2="$(git -C "$FIXTURE" rev-parse HEAD)"
          if arch_fixture --base-sha "$H1" --head-sha "$H2" > "$RUNNER_TEMP/vf-arch-seven/god-file.log" 2>&1; then
            echo "ARCH_SYNTHETIC_GOD_FILE=UNEXPECTED_PASS;ID=$TARGET_ID"
            exit 1
          fi
          grep -Eq 'EXISTING_FILE_CROSSES_BUDGET|ARCH_ROOT_FILE_GROWTH|NEW_GOD_FILE' "$RUNNER_TEMP/vf-arch-seven/god-file.log"
          echo "ARCH_SYNTHETIC_GOD_FILE=BLOCKED_AS_EXPECTED;ID=$TARGET_ID"
          case "$TARGET_ID" in
            P01) BAD_FILE="src/bad_import.php"; BAD_SOURCE='require "../scripts/private.php";' ;;
            P02) BAD_FILE="scripts/bad_import.sh"; BAD_SOURCE='source "../public/private.js"' ;;
            P07) BAD_FILE="scripts/bad_import.sh"; BAD_SOURCE='source "../bin/menu.sh"' ;;
            P08) BAD_FILE="app/Models/BadImport.php"; BAD_SOURCE='use App\Http\Controllers\AuthController;' ;;
            S01-C01) BAD_FILE="scripts/bad_import.sh"; BAD_SOURCE='source "../src/index.php"' ;;
            S01-C02) BAD_FILE="scripts/bad_import.sh"; BAD_SOURCE='source "../assets/js/menu.js"' ;;
            S01-C03) BAD_FILE="scripts/bad_import.sh"; BAD_SOURCE='source "../src/admin/admin-loader.php"' ;;
            *) echo "ARCH_UNKNOWN_TARGET"; exit 1 ;;
          esac
          mkdir -p "$FIXTURE/$(dirname "$BAD_FILE")"
          printf '%s\n' "$BAD_SOURCE" > "$FIXTURE/$BAD_FILE"
          git -C "$FIXTURE" add .
          git -C "$FIXTURE" commit -qm wrong-layer
          H3="$(git -C "$FIXTURE" rev-parse HEAD)"
          if arch_fixture --base-sha "$H2" --head-sha "$H3" > "$RUNNER_TEMP/vf-arch-seven/wrong-layer.log" 2>&1; then
            echo "ARCH_SYNTHETIC_LAYER=UNEXPECTED_PASS;ID=$TARGET_ID"
            exit 1
          fi
          grep -Eq 'ARCH_BAD_LAYER_IMPORT|FORBIDDEN_LAYER_IMPORT' "$RUNNER_TEMP/vf-arch-seven/wrong-layer.log"
          echo "ARCH_SYNTHETIC_LAYER=BLOCKED_AS_EXPECTED;ID=$TARGET_ID"
          echo "ARCH_MACHINE=PASS;ID=$TARGET_ID;EXACT_SHA=$TARGET_SHA"
      - name: Erase transient private source and test data
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-product-src gov-policy-src "$RUNNER_TEMP/vf-arch-seven"
          test ! -e private-product-src
          test ! -e gov-policy-src

  cross-project-discover:
    name: Discover eight current PR heads and current GOV-DOC SHA
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.cross_project_ci) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'llhzx2018' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'maintenance/gov-entry-longterm-ci-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      gov_sha: ${{ steps.find.outputs.gov_sha }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run monitor positive and denial tests
        run: python3 -B -m unittest tests.test_monitor_cross_project_public_authority -v
      - name: Read only latest scoped PR heads and canonical governance main
        id: find
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/monitor_cross_project_public_authority.py discover

  cross-project-exact-check:
    name: Exact public authority ${{ matrix.id }}
    needs: cross-project-discover
    if: needs.cross-project-discover.result == 'success' && needs.cross-project-discover.outputs.count == '8'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cross-project-discover.outputs.matrix) }}
    steps:
      - name: Checkout current public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore exact-source successful validation cache
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: .vf-ci-marker/pass
          key: vf-gov-ci-v1-${{ matrix.id }}-${{ matrix.mode }}-${{ matrix.sha }}-${{ needs.cross-project-discover.outputs.gov_sha }}-${{ hashFiles('scripts/monitor_cross_project_public_authority.py', '.github/workflows/runner-trigger-scope-gate.yml') }}

      - name: Refuse invalid success cache entries
        if: steps.proof-cache.outputs.cache-hit == 'true'
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/monitor_cross_project_public_authority.py verify-marker --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Checkout exact private product source transiently
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-product-src
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact current GOV-DOC transiently
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ needs.cross-project-discover.outputs.gov_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-policy-src
          persist-credentials: false
          fetch-depth: 1

      - name: Exact source identity, 17 positive/denial tests and full router coverage
        if: steps.proof-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_PROFILE: ${{ matrix.profile }}
          TARGET_WORKFLOW: ${{ matrix.workflow }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-product-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gov-policy-src rev-parse HEAD)" = "$GOV_SHA"
          python3 -B -m unittest discover -s private-product-src/.github/checks -p 'test_gov_doc_ci.py' -v
          python3 -B private-product-src/.github/checks/check_gov_doc_ci.py \
            --project-root private-product-src --gov-root gov-policy-src \
            --project-id "$TARGET_ID" --profile "$TARGET_PROFILE" \
            --workflow "$TARGET_WORKFLOW" --require-git
          echo "GOV_MONITOR_NEW_SOURCE_MACHINE=PASS;ID=$TARGET_ID"

      - name: Erase private workspaces regardless of outcome
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-product-src gov-policy-src
          test ! -e private-product-src
          test ! -e gov-policy-src

      - name: Revalidate latest PR and GOV-DOC SHAs before passing
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/monitor_cross_project_public_authority.py recheck --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Create non-sensitive success digest for changed source
        if: steps.proof-cache.outputs.cache-hit != 'true'
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/monitor_cross_project_public_authority.py write-marker --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Cache only successful source-policy pair (no source or secrets)
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vf-ci-marker/pass
          key: vf-gov-ci-v1-${{ matrix.id }}-${{ matrix.mode }}-${{ matrix.sha }}-${{ needs.cross-project-discover.outputs.gov_sha }}-${{ hashFiles('scripts/monitor_cross_project_public_authority.py', '.github/workflows/runner-trigger-scope-gate.yml') }}

  cross-project-final-gate:
    name: All eight scoped public-authority results must PASS
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.cross_project_ci) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'maintenance/gov-entry-longterm-ci-')))
    needs: [cross-project-discover, cross-project-exact-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fail closed if discovery or any project was skipped or failed
        env:
          DISCOVERY: ${{ needs.cross-project-discover.result }}
          MATRIX_RESULT: ${{ needs.cross-project-exact-check.result }}
          TARGET_COUNT: ${{ needs.cross-project-discover.outputs.count }}
        run: |
          set -Eeuo pipefail
          test "$DISCOVERY" = success
          test "$TARGET_COUNT" = 8
          test "$MATRIX_RESULT" = success
          echo "GOV_MONITOR_LONG_TERM_8_OF_8=PASS"
