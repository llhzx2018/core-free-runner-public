name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24712-immutable-update-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24712_immutable_update_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24712-immutable-update-gate-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary gate lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.12 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: b8b8a4b1effc916083f9ed2966e85ced1d1bf251
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact V2.47.10 Production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: 972541fd06c66044105ec1b19cf7738c340c90c1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Source identity and recovery contract
        shell: bash
        run: |
          test "$(cat target/VERSION)" = "2.47.12"
          test "$(cat target/src/VERSION.txt)" = "2.47.12"
          grep -Fq "define('VF_VERSION', '2.47.12');" target/src/app/bootstrap.php
          php target/tests/unit/update_recovery_contract.php
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24712-php-lint.txt

      - name: Exact V2.47.10 to V2.47.12 Atomic gate
        shell: bash
        run: bash runner/scripts/p01-v24712-immutable-update-gate.sh

      - name: Upload public-safe V2.47.12 gate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24712-immutable-update-${{ github.run_id }}
          path: |
            /tmp/p01-v24712-atomic-r1/VF-Start-V2.47.12-FULL.zip
            /tmp/p01-v24712-atomic-r1/VF-Start-V2.47.12-FULL.zip.sha256
            /tmp/p01-v24712-atomic-r1/VF_Start_V2.47.12_UPDATE.zip
            /tmp/p01-v24712-atomic-r1/VF_Start_V2.47.12_UPDATE.zip.sha256
            /tmp/p01-v24712-atomic-r1/P01_V24710_AUTH_BRIDGE.php
            /tmp/p01-v24712-atomic-r1/P01.json
            /tmp/p01-v24712-atomic-r1/SHA256SUMS.txt
            /tmp/p01-v24712-atomic-r1/R1_GATE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup private working copies
        if: always()
        shell: bash
        run: rm -rf target baseline old-harness proven /tmp/p01-r1-* /tmp/p01-v24712-atomic-r1-builder /tmp/p01-v24712-atomic-r1-rebuild
