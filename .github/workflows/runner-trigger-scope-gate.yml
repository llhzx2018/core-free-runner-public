name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1111-core-updates-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_UPDATES_BASE: 8db85499605c34c6b72e664778fa709aa40dc963
      CORE_UPDATES_HEAD: 9057629285929b4d9a61336db2eb3c7adb2ef2af
      PRODUCT_SOURCE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      RELEASE_ID: '379349908'
      ASSET_ID: '536950425'
      ASSET_NAME: VF_SEO_V1.1.11_UPDATE.zip
      ASSET_BYTES: '847947'
      ASSET_SHA256: 82c0a65b7b29729a1be659940af62abd4c02909866590f97e7b5b4b6b6198702
    steps:
      - name: Checkout disposable runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact private core-updates manifest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core-updates

      - name: Bind exact core-updates manifest source
        working-directory: core-updates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_UPDATES_HEAD"
          git cat-file -e "$CORE_UPDATES_BASE^{commit}"
          test "$(git diff --name-only "$CORE_UPDATES_BASE" "$CORE_UPDATES_HEAD")" = 'projects/P05.json'
          git diff --check "$CORE_UPDATES_BASE" "$CORE_UPDATES_HEAD"
          echo P05_CORE_UPDATES_EXACT_SOURCE_SCOPE=PASS

      - name: Validate manifest against current V1 schema contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,datetime,pathlib
          root=pathlib.Path('core-updates')
          m=json.loads((root/'projects/P05.json').read_text())
          s=json.loads((root/'schemas/update-manifest-v1.schema.json').read_text())
          allowed=set(s['properties'])
          required=set(s['required'])
          assert required <= set(m), required-set(m)
          assert set(m) <= allowed, set(m)-allowed
          assert m['schema_version']=='1.0'
          assert m['project_id']=='P05' and m['component_id']=='APP' and m['enabled'] is True
          assert m['current_version']=='1.1.10'
          assert m['target_version']=='1.1.11'
          assert m['update_type']=='ATOMIC'
          assert m['from_versions']==['1.1.10']
          assert m['schema_from']=='1' and m['schema_to']=='1'
          assert m['repository']=='llhzx2018/vf-seo'
          assert m['release_tag']=='v1.1.11'
          assert m['release_id']==379349908
          assert m['product_identity']=='49434d79d861bba206d72daa4476363f1bf8e0d4'
          assert m['asset_name']=='VF_SEO_V1.1.11_UPDATE.zip'
          assert m['asset_bytes']==847947
          assert m['asset_sha256']=='82c0a65b7b29729a1be659940af62abd4c02909866590f97e7b5b4b6b6198702'
          assert m['backup_required'] is True and m['rollback_supported'] is True
          assert re.fullmatch(r'[0-9a-f]{40}',m['product_identity'])
          assert re.fullmatch(r'[0-9a-f]{64}',m['asset_sha256'])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?',m['current_version'])
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?',m['target_version'])
          datetime.datetime.fromisoformat(m['released_at'].replace('Z','+00:00'))
          print('P05_CORE_UPDATES_SCHEMA_CONTRACT=PASS')
          PY

      - name: Verify private Product Release and exact UPDATE bytes
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p05-release
          gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.11 > /tmp/p05-release/release.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/p05-release/release.json'))
          assert r['id']==int(os.environ['RELEASE_ID'])
          assert r['tag_name']=='v1.1.11'
          assert r['target_commitish']==os.environ['PRODUCT_SOURCE']
          a={x['name']:x for x in r['assets']}[os.environ['ASSET_NAME']]
          assert a['id']==int(os.environ['ASSET_ID'])
          assert a['size']==int(os.environ['ASSET_BYTES'])
          assert a.get('digest')=='sha256:'+os.environ['ASSET_SHA256']
          print('P05_PRODUCT_RELEASE_ASSET_IDENTITY=PASS')
          PY
          gh release download v1.1.11 -R llhzx2018/vf-seo -p "$ASSET_NAME" -D /tmp/p05-release
          test "$(stat -c '%s' "/tmp/p05-release/$ASSET_NAME")" = "$ASSET_BYTES"
          test "$(sha256sum "/tmp/p05-release/$ASSET_NAME" | awk '{print $1}')" = "$ASSET_SHA256"
          test "$(unzip -Z1 "/tmp/p05-release/$ASSET_NAME" | wc -l)" -eq 1
          unzip -Z1 "/tmp/p05-release/$ASSET_NAME" | grep -Fx 'repair-v1.1.11.php' >/dev/null
          echo P05_PRODUCT_RELEASE_UPDATE_BYTES=PASS

      - name: Exercise manifest through Update Core V1
        run: |
          set -euo pipefail
          find core-updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core-updates/update-core/php/tests/run.php
          php -r '
          require "core-updates/update-core/php/src/UpdateAdapter.php";
          require "core-updates/update-core/php/src/UpdateCore.php";
          $m=json_decode(file_get_contents("core-updates/projects/P05.json"),true,512,JSON_THROW_ON_ERROR);
          $p="/tmp/p05-release/VF_SEO_V1.1.11_UPDATE.zip";
          $c=new CoreUpdates\UpdateCore("P05","APP");
          if (($c->check("1.1.10","1",$m)["status"]??null)!=="AVAILABLE") exit(21);
          if (($c->check("1.1.9","1",$m)["status"]??null)!=="BLOCKED_SOURCE_VERSION") exit(22);
          if (($c->check("1.1.11","1",$m)["status"]??null)!=="UP_TO_DATE") exit(23);
          if (($c->verifyPackage($p,$m)["status"]??null)!=="VERIFIED") exit(24);
          echo "P05_UPDATE_CORE_MANIFEST_RUNTIME=PASS\n";
          '

      - name: Seal manifest gate
        run: |
          echo P05_V1111_CORE_UPDATES_MANIFEST_GATE=PASS
          echo P05_CORE_UPDATES_HEAD="$CORE_UPDATES_HEAD"
          echo P05_UPDATE_ASSET_ID="$ASSET_ID"
          echo P05_UPDATE_SHA256="$ASSET_SHA256"
          echo P05_PRODUCTION_WRITE=0
