name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
      - 'scripts/p01-v24711-release-gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory
      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p01_exact_source:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24711-update-recovery-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_SHA: 252ca51215e7e4411741e2f53d0bcc68f37614f2
      EXACT_TREE: 1e6fe31f03ed871e68b3153b7e5c1e81099d1cf7
      SOURCE_SHA: 972541fd06c66044105ec1b19cf7738c340c90c1
      TARGET_VERSION: 2.47.11
      SOURCE_VERSION: 2.47.10
      EXPECTED_SCHEMA: '2026090401'
      SOURCE_ACCESS_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Existing credential read-only route preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_ACCESS_TOKEN"
          echo P01_EXISTING_CREDENTIAL_READONLY_ROUTE=PASS

      - name: Checkout temporary gate harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact final main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SHA }}
          token: ${{ env.SOURCE_ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Checkout exact V2.47.10 stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity, syntax and recovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git -C vf-start rev-parse HEAD^{tree})" = "$EXACT_TREE"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < baseline/src/VERSION.txt)" = "$SOURCE_VERSION"
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          test -z "$(git -C vf-start diff --name-only "$SOURCE_SHA"..HEAD -- src/migrations/)"
          find vf-start/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24711-php-lint.log
          find vf-start/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/p01-v24711-js-lint.log
          php vf-start/tests/unit/update_recovery_contract.php | tee /tmp/p01-v24711-contract.log
          grep -Fx 'P01_UPDATE_RECOVERY_CONTRACT=PASS' /tmp/p01-v24711-contract.log
          echo P01_V24711_EXACT_FINAL_MAIN=PASS
          echo P01_V24711_SYNTAX=PASS
          echo P01_V24711_SCHEMA_NO_MIGRATION=PASS

      - name: Build deterministic formal candidate bytes and bounded V2.47.10 auth bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24711-release
          python runner/scripts/p01-v24711-release-gate.py \
            --candidate vf-start/src \
            --source baseline/src \
            --out /tmp/p01-v24711-release \
            --candidate-commit "$EXACT_SHA" \
            --candidate-tree "$EXACT_TREE" \
            --source-commit "$SOURCE_SHA" | tee /tmp/p01-v24711-build.log
          test -s /tmp/p01-v24711-release/VF-Start-V2.47.11-FULL.zip
          test -s /tmp/p01-v24711-release/VF_Start_V2.47.11_UPDATE.zip
          test -s /tmp/p01-v24711-release/P01_V24710_AUTH_BRIDGE.php
          test -s /tmp/p01-v24711-release/repair-v2.47.11.php
          php /tmp/p01-v24711-release/repair-v2.47.11.php --self-test >/tmp/p01-v24711-atomic-selftest.json
          python - <<'PY'
          from pathlib import Path
          import json, zipfile, hashlib
          out=Path('/tmp/p01-v24711-release')
          r=json.loads((out/'BUILD_RECEIPT.json').read_text())
          assert r['version']=='2.47.11' and r['source_version']=='2.47.10' and r['schema']=='2026090401'
          assert r['candidate_commit']=='252ca51215e7e4411741e2f53d0bcc68f37614f2'
          assert r['candidate_tree']=='1e6fe31f03ed871e68b3153b7e5c1e81099d1cf7'
          for name,key in [('VF-Start-V2.47.11-FULL.zip','full_sha256'),('VF_Start_V2.47.11_UPDATE.zip','update_sha256'),('P01_V24710_AUTH_BRIDGE.php','bridge_sha256')]:
              p=out/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==r[key]
          with zipfile.ZipFile(out/'VF_Start_V2.47.11_UPDATE.zip') as z:
              assert z.namelist()==['repair-v2.47.11.php']
          with zipfile.ZipFile(out/'VF-Start-V2.47.11-FULL.zip') as z:
              names=z.namelist()
              assert 'VERSION.txt' in names and 'release-manifest.json' in names
              forbidden=('private_data/','PRIVATE_DATA/','app/.runtime.php','app/.setup-key.php','app/.setup.lock')
              assert not any(any(n==f or n.startswith(f) for f in forbidden) for n in names)
          bridge=(out/'P01_V24710_AUTH_BRIDGE.php').read_text()
          assert "VF_VERSION !== '2.47.10'" in bridge
          assert 'vf_is_admin()' in bridge and 'hash_equals($csrf, $provided)' in bridge
          assert "header('Location: update-credential.php?bridge=v24710')" in bridge
          assert 'curl_' not in bridge and 'https://' not in bridge and 'http://' not in bridge
          assert 'VF_RELEASE_WRITE_TOKEN=' not in bridge
          print('P01_V24711_PACKAGE_IDENTITY=PASS')
          print('P01_V24710_AUTH_BRIDGE_STATIC_CONTRACT=PASS')
          PY

      - name: Fresh install from exact FULL package
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/p01-v24711-full-install
          rm -rf "$R" /tmp/p01-v24711-full-*
          mkdir -p "$R"
          unzip -q /tmp/p01-v24711-release/VF-Start-V2.47.11-FULL.zip -d "$R"
          php -S 127.0.0.1:19831 -t "$R" >/tmp/p01-v24711-full-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS -c /tmp/p01-v24711-full.cookies -b /tmp/p01-v24711-full.cookies http://127.0.0.1:19831/setup.php -o /tmp/p01-v24711-full-setup && break
            sleep .25
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24711-full-setup',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-v24711-full.cookies -b /tmp/p01-v24711-full.cookies -X POST http://127.0.0.1:19831/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=V24711 Formal Fresh Gate' \
            --data-urlencode 'admin_password=V24711FormalFresh!' \
            --data-urlencode 'admin_password_confirm=V24711FormalFresh!' \
            -o /tmp/p01-v24711-full-setup-post
          test -f "$R/app/.runtime.php"
          php "$R/cli/verify.php" | tee /tmp/p01-v24711-full-verify.log
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v24711-full-verify.log
          test "$(tr -d '\r\n ' < "$R/VERSION.txt")" = "$TARGET_VERSION"
          kill "$pid" 2>/dev/null || true
          trap - EXIT
          echo P01_V24711_FRESH_INSTALL_FROM_FULL=PASS

      - name: Strict V2.47.10 bridge, backup, rollback, data preservation and Atomic upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/p01-v24710-upgrade
          rm -rf "$R" /tmp/p01-v24710-*
          cp -a baseline/src "$R"
          php -S 127.0.0.1:19832 -t "$R" >/tmp/p01-v24710-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS -c /tmp/p01-v24710.cookies -b /tmp/p01-v24710.cookies http://127.0.0.1:19832/setup.php -o /tmp/p01-v24710-setup && break
            sleep .25
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24710-setup',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-v24710.cookies -b /tmp/p01-v24710.cookies -X POST http://127.0.0.1:19832/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=V24710 Upgrade Gate' \
            --data-urlencode 'admin_password=V24710UpgradeGate!' \
            --data-urlencode 'admin_password_confirm=V24710UpgradeGate!' \
            -o /tmp/p01-v24710-setup-post
          test -f "$R/app/.runtime.php"
          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          $rt=include $r.'/app/.runtime.php';
          $pdo=new PDO('sqlite:'.$rt['db_file'],null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $pdo->exec('CREATE TABLE IF NOT EXISTS vf_release_gate_sentinel (id INTEGER PRIMARY KEY, marker TEXT NOT NULL)');
          $pdo->exec("DELETE FROM vf_release_gate_sentinel");
          $pdo->exec("INSERT INTO vf_release_gate_sentinel(id,marker) VALUES(1,'preserve-v24710-to-v24711')");
          echo "P01_EXISTING_DATA_SENTINEL_CREATED=PASS\n";
          PHP
          cp /tmp/p01-v24711-release/P01_V24710_AUTH_BRIDGE.php "$R/P01_V24710_AUTH_BRIDGE.php"
          code="$(curl -sS -o /tmp/p01-v24710-bridge-anon -w '%{http_code}' http://127.0.0.1:19832/P01_V24710_AUTH_BRIDGE.php)"
          test "$code" = 302
          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          require_once $r.'/app/bootstrap.php';
          define('VF_P01_V24710_AUTH_BRIDGE_LIBRARY_MODE', true);
          require $r.'/P01_V24710_AUTH_BRIDGE.php';
          $x=VfP01V24710AuthBridge::run($r);
          if(empty($x['ok'])||($x['files']??0)!==3||empty($x['backup_verified'])) exit(20);
          if(VF_VERSION!=='2.47.10'||trim((string)file_get_contents($r.'/VERSION.txt'))!=='2.47.10') exit(21);
          $backup=VF_PRIVATE_ROOT.'/update-auth/bridge-v24710-backup/GitHubClient.php';
          if(!is_file($backup)||is_link($backup)||(fileperms($backup)&0777)!==0600) exit(22);
          echo "P01_V24710_AUTH_BRIDGE_RUNTIME=PASS\n";
          echo "P01_V24710_GITHUBCLIENT_BACKUP_0600=PASS\n";
          PHP
          test -f "$R/app/UpdateCredentialStore.php"
          test -f "$R/update-credential.php"
          test "$(tr -d '\r\n ' < "$R/VERSION.txt")" = "$SOURCE_VERSION"

          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          require_once $r.'/app/bootstrap.php';
          require_once $r.'/app/BackupManager.php';
          $b=(new VfBackupManager(vf_db()))->create('V2.47.11 machine gate pre-update','pre-update',true);
          if(empty($b['backup_key'])) exit(30);
          echo "P01_PREUPDATE_BACKUP=PASS\n";
          PHP

          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php /tmp/p01-v24711-release/repair-v2.47.11.php --run="$R" >/tmp/p01-v24711-injected.out 2>/tmp/p01-v24711-injected.err
          fail_rc=$?
          set -e
          test "$fail_rc" -ne 0
          test "$(tr -d '\r\n ' < "$R/VERSION.txt")" = "$SOURCE_VERSION"
          test -f "$R/P01_V24710_AUTH_BRIDGE.php"
          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          $rt=include $r.'/app/.runtime.php';
          $pdo=new PDO('sqlite:'.$rt['db_file'],null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $v=$pdo->query('SELECT marker FROM vf_release_gate_sentinel WHERE id=1')->fetchColumn();
          if($v!=='preserve-v24710-to-v24711') exit(31);
          $head=(string)$pdo->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn();
          if($head!=='2026090401') exit(32);
          echo "P01_INJECTED_FAILURE_ROLLBACK=PASS\n";
          echo "P01_ROLLBACK_DATA_PRESERVED=PASS\n";
          PHP

          php /tmp/p01-v24711-release/repair-v2.47.11.php --run="$R" | tee /tmp/p01-v24711-upgrade.json
          test "$(tr -d '\r\n ' < "$R/VERSION.txt")" = "$TARGET_VERSION"
          test ! -e "$R/P01_V24710_AUTH_BRIDGE.php"
          php /tmp/p01-v24711-release/repair-v2.47.11.php --verify-target="$R" | tee /tmp/p01-v24711-target.json
          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          $rt=include $r.'/app/.runtime.php';
          $pdo=new PDO('sqlite:'.$rt['db_file'],null,null,[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $v=$pdo->query('SELECT marker FROM vf_release_gate_sentinel WHERE id=1')->fetchColumn();
          if($v!=='preserve-v24710-to-v24711') exit(40);
          $head=(string)$pdo->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn();
          if($head!=='2026090401') exit(41);
          echo "P01_STRICT_24710_TO_24711=PASS\n";
          echo "P01_EXISTING_DATA_PRESERVED=PASS\n";
          echo "P01_SCHEMA_UNCHANGED=PASS\n";
          echo "P01_BRIDGE_RETIRED_AFTER_UPDATE=PASS\n";
          PHP
          kill "$pid" 2>/dev/null || true
          trap - EXIT

      - name: Core manifest and UPDATE package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          require 'vf-start/src/app/CoreUpdates/UpdateCore.php';
          $m=json_decode(file_get_contents('/tmp/p01-v24711-release/P01.json'),true,512,JSON_THROW_ON_ERROR);
          $core=new \CoreUpdates\UpdateCore('P01','APP');
          $a=$core->check('2.47.10','2026090401',$m);
          if(($a['status']??'')!=='AVAILABLE') {fwrite(STDERR,json_encode($a)."\n"); exit(50);}
          $p=$core->verifyPackage('/tmp/p01-v24711-release/VF_Start_V2.47.11_UPDATE.zip',$m);
          if(($p['status']??'')!=='VERIFIED') {fwrite(STDERR,json_encode($p)."\n"); exit(51);}
          if($m['from_versions']!==['2.47.10']||$m['schema_from']!=='2026090401'||$m['schema_to']!=='2026090401') exit(52);
          echo "P01_CORE_MANIFEST_STRICT_HOP=PASS\n";
          echo "P01_UPDATE_BYTES_SHA=PASS\n";
          PHP

      - name: Public-safe final-main receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('/tmp/p01-v24711-release/BUILD_RECEIPT.json').read_text())
          rows={
            'P01_EXACT_SOURCE_SHA':'252ca51215e7e4411741e2f53d0bcc68f37614f2',
            'P01_EXACT_SOURCE_TREE':'1e6fe31f03ed871e68b3153b7e5c1e81099d1cf7',
            'P01_SOURCE_STABLE_SHA':'972541fd06c66044105ec1b19cf7738c340c90c1',
            'VERSION':'2.47.11','FROM_VERSION':'2.47.10','SCHEMA':'2026090401','MIGRATION':'NONE',
            'PHP_JS_SYNTAX':'PASS','UPDATE_RECOVERY_CONTRACT':'PASS','FRESH_INSTALL_FULL':'PASS',
            'AUTH_BRIDGE_EXACT_24710':'PASS','AUTH_BRIDGE_ADMIN_CSRF_CONTRACT':'PASS','AUTH_BRIDGE_NO_NETWORK':'PASS',
            'AUTH_BRIDGE_GITHUBCLIENT_BACKUP':'PASS','AUTH_BRIDGE_RETIRED_ON_SUCCESS':'PASS',
            'PREUPDATE_BACKUP':'PASS','INJECTED_FAILURE_ROLLBACK':'PASS','EXISTING_DATA_PRESERVATION':'PASS',
            'STRICT_24710_TO_24711':'PASS','CORE_MANIFEST_STRICT_HOP':'PASS','PACKAGE_IDENTITY':'PASS',
            'FULL_NAME':b['full_name'],'FULL_BYTES':str(b['full_bytes']),'FULL_SHA256':b['full_sha256'],
            'UPDATE_NAME':b['update_name'],'UPDATE_BYTES':str(b['update_bytes']),'UPDATE_SHA256':b['update_sha256'],
            'BRIDGE_NAME':b['bridge_name'],'BRIDGE_BYTES':str(b['bridge_bytes']),'BRIDGE_SHA256':b['bridge_sha256'],
            'RELEASE_WRITE_OPERATION':'NO','PRODUCTION':'NOT_TESTED','P01_V24711_FINAL_MAIN_MACHINE_GATE':'PASS'
          }
          p=Path('evidence/runner/P01_V24711_FINAL_MAIN_GATE.txt')
          p.write_text(''.join(f'{k}={v}\n' for k,v in rows.items()))
          print(p.read_text())
          PY

      - name: Upload public-safe receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24711-final-main-gate-${{ github.run_id }}
          path: evidence/runner/P01_V24711_FINAL_MAIN_GATE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup private source and package bytes
        if: always()
        shell: bash
        run: rm -rf vf-start baseline /tmp/p01-v24711-* /tmp/p01-v24710-*