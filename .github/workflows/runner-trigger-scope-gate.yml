name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_navigation_ux_round5_gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-navigation-ux-round5-mobile-sort-gate-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary proof lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 3e96d814c0f2b63b410c59b4c456e7f7dee47cb4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "3e96d814c0f2b63b410c59b4c456e7f7dee47cb4"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.17"
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo 'P01_NAVIGATION_UX_ROUND5_SOURCE_IDENTITY=PASS'

      - name: Run focused mobile-sort regressions
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php tests/unit/mobile_sort_accessibility_contract.php
          php tests/unit/default_sort_result_route_contract.php
          php tests/unit/search_sort_stability_contract.php
          php tests/unit/start_popular_sort_control_contract.php
          php tests/unit/tool_software_sort_context_contract.php
          php tests/unit/navigation_search_context_contract.php
          php tests/unit/global_account_actions_contract.php
          php tests/unit/public_global_nav_contract.php
          echo 'P01_NAVIGATION_UX_ROUND5_FOCUSED_REGRESSION=PASS'

      - name: Fresh authenticated HTTP/CSS smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-round5-runtime
          cp -a target/src /tmp/p01-round5-runtime
          cd /tmp/p01-round5-runtime
          php -S 127.0.0.1:18098 -t . >/tmp/p01-round5-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-round5.cookies -b /tmp/p01-round5.cookies http://127.0.0.1:18098/setup.php -o /tmp/p01-round5-setup.html; then break; fi
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-round5-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"', text)
          assert m, 'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-round5.cookies -b /tmp/p01-round5.cookies -X POST http://127.0.0.1:18098/setup.php             --data-urlencode "setup_csrf=$CSRF"             --data-urlencode 'site_title=P01 Round5 Gate'             --data-urlencode 'admin_password=Round5Gate!2026'             --data-urlencode 'admin_password_confirm=Round5Gate!2026'             -o /tmp/p01-round5-setup-post.html

          curl -fsS -c /tmp/p01-round5.cookies -b /tmp/p01-round5.cookies             -H 'Content-Type: application/json'             -X POST 'http://127.0.0.1:18098/api.php?action=login'             --data '{"password":"Round5Gate!2026"}'             -o /tmp/p01-round5-login.json
          grep -F '"ok":true' /tmp/p01-round5-login.json >/dev/null

          curl -fsS -c /tmp/p01-round5.cookies -b /tmp/p01-round5.cookies 'http://127.0.0.1:18098/start.php?sort=title' -o /tmp/p01-round5-owner.html
          grep -F '<select data-vf-location-select aria-label="排序">' /tmp/p01-round5-owner.html >/dev/null
          grep -F 'selected>标题</option>' /tmp/p01-round5-owner.html >/dev/null

          curl -fsS 'http://127.0.0.1:18098/asset.php?file=workspace-rebaseline.css' -o /tmp/p01-round5.css
          grep -F '.vf-functional-workspace .vf-toolbar-controls select[aria-label="排序"]{' /tmp/p01-round5.css >/dev/null
          grep -F 'min-width:118px' /tmp/p01-round5.css >/dev/null
          grep -F 'height:38px' /tmp/p01-round5.css >/dev/null
          ! grep -F '.vf-functional-workspace .vf-toolbar-controls select[aria-label="排序"]{display:none}' /tmp/p01-round5.css >/dev/null
          echo 'P01_NAVIGATION_UX_ROUND5_FRESH_HTTP_CSS=PASS'

      - name: Gate receipt
        shell: bash
        run: |
          echo 'P01_NAVIGATION_UX_ROUND5_GATE=PASS'
          echo 'SCHEMA_CHANGE=NONE'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION=NOT_WRITTEN'
