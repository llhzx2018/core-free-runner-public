name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24720_favorite_ui_foreach_gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-v24720-favorite-ui-foreach-gate-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary proof lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d708af02b0b5814d3f079e9a27e423b3fb78d543
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "d708af02b0b5814d3f079e9a27e423b3fb78d543"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.19"
          php -l target/tests/unit/favorite_ui_collection_contract.php >/dev/null
          node --check target/src/assets/workspace.js
          echo 'P01_V24720_FAVORITE_UI_SOURCE_IDENTITY=PASS'

      - name: Run Favorite UI regressions
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php tests/unit/favorite_ui_collection_contract.php
          php tests/unit/favorite_write_recovery_contract.php
          php tests/unit/favorite_add_context_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          php tests/unit/derived_favorite_view_coherence_contract.php
          php tests/unit/navigation_favorite_count_context_contract.php
          php tests/unit/navigation_owner_behavior_privacy_contract.php
          php tests/unit/global_account_actions_contract.php
          echo 'P01_V24720_FAVORITE_UI_REGRESSION=PASS'

      - name: Verify served workspace asset contains collection fix
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v24720-ui
          cp -a target/src /tmp/p01-v24720-ui
          cd /tmp/p01-v24720-ui
          php -S 127.0.0.1:18103 -t . >/tmp/p01-v24720-ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/p01-v24720-ui-server.log || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:18103/asset.php?file=workspace.js' -o /tmp/p01-v24720-workspace.js; then break; fi
            sleep 1
          done
          grep -F "$$('[data-favorite-count]').forEach(el=>{" /tmp/p01-v24720-workspace.js >/dev/null
          grep -F 'data-favorite-id="' /tmp/p01-v24720-workspace.js | grep -F '$$(' | grep -F '.forEach(btn=>{' >/dev/null
          ! grep -F "$('[data-favorite-count]').forEach(el=>{" /tmp/p01-v24720-workspace.js >/dev/null
          echo 'P01_V24720_SERVED_FAVORITE_COLLECTION_FIX=PASS'

      - name: Gate receipt
        shell: bash
        run: |
          echo 'P01_V24720_FAVORITE_UI_FOREACH_GATE=PASS'
          echo 'FAVORITE_WRITE_PATH=UNCHANGED_FROM_V24719=YES'
          echo 'FAVORITE_UI_COLLECTION_SELECTOR=PASS'
          echo 'SCHEMA_CHANGE=NONE'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION=NOT_WRITTEN'
