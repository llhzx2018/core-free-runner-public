name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory
      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1112-project-truth:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v1112-backend-update-gate-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      P05_EXACT_SOURCE: 59b962bd3dc0ed8051199ddac39a931607cf2d0c
    steps:
      - name: Checkout exact private P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate candidate Current Truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          node - <<'NODE'
          const fs = require('fs');
          const path = 'VF_PROJECT.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          p.status = 'V1.1.12_CANDIDATE / FINAL_MACHINE_GATE_PENDING / PRODUCTION_V1.1.11_OWNER_OBSERVED';
          p.version = '1.1.12';
          p.production_version = '1.1.11';
          p.target_version = '1.1.12';
          p.working_version = '1.1.12';
          p.version_change = true;
          p.production_source_upload = 'EXECUTED_BY_USER';
          p.production_runtime_acceptance = 'OWNER_OBSERVED_V1.1.11_RUNNING';
          p.production_deployment = 'DEPLOYED_OWNER_OBSERVED';
          p.owner_real_use_review = 'V1.1.9_REAL_FAIL_HISTORICAL / V1.1.11_OWNER_OBSERVED_RUNNING_UPDATE_UI_GAP_FOUND';
          p.owner_real_use_pass = 'PARTIAL_V1.1.11_RUNTIME_RUNNING_BACKEND_UPDATE_UI_GAP';
          p.next_action = 'V1.1.12 CANDIDATE FINAL EXACT SOURCE GATE; THEN MERGE/RELEASE; NO PRODUCTION WRITE';
          p.deployment_readiness = 'V1.1.12_CANDIDATE_FINAL_GATE_PENDING';
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          NODE
          node - <<'NODE'
          const p=require('./VF_PROJECT.json');
          const checks=[
            p.version==='1.1.12',p.target_version==='1.1.12',p.working_version==='1.1.12',
            p.production_version==='1.1.11',p.production_deployment==='DEPLOYED_OWNER_OBSERVED',
            p.production_write===0,p.formal_release==='v1.1.11'
          ];
          if(checks.some(x=>!x)) { console.error(p); process.exit(1); }
          console.log('P05_V1112_PROJECT_TRUTH_GENERATION=PASS');
          NODE

      - name: Upload generated VF_PROJECT
        uses: actions/upload-artifact@v4
        with:
          name: p05-v1112-vf-project
          path: VF_PROJECT.json
          if-no-files-found: error
          retention-days: 1

      - name: Seal Current Truth utility
        run: |
          echo 'P05_V1112_PROJECT_TRUTH_ARTIFACT=PASS'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
