name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  p01_v24717_navigation_ux_round4_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24717-navigation-ux-round4-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Fetch exact PASS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24717-pass
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh run download 35424074350             --repo llhzx2018/core-free-runner-public             --name p01-v24717-navigation-ux-round4-35424074350             --dir "$OUT"
          test -f "$OUT/VF-Start-V2.47.17-FULL.zip"
          test -f "$OUT/VF_Start_V2.47.17_UPDATE.zip"
          test -f "$OUT/R17_GATE_RECEIPT.txt"
          echo 'P01_V24717_PASS_ARTIFACT_FETCH=PASS'

      - name: Verify sealed gate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24717-pass
          test "$(stat -c %s "$OUT/VF-Start-V2.47.17-FULL.zip")" = "870210"
          test "$(sha256sum "$OUT/VF-Start-V2.47.17-FULL.zip" | awk '{print $1}')" = "285e1119982c3bc5bac7eb6b6a3a81fff3c68ab4a02ab818513193f8444b2585"
          test "$(stat -c %s "$OUT/VF_Start_V2.47.17_UPDATE.zip")" = "1855143"
          test "$(sha256sum "$OUT/VF_Start_V2.47.17_UPDATE.zip" | awk '{print $1}')" = "9424f99d5aa2c8e68c65eef46d7b84a4c8fed9f0d7f624928da7b34ccc167258"
          grep -Fx 'P01_V24717_NAVIGATION_UX_ROUND4_RELEASE_GATE=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'V24716_TO_V24717_ATOMIC_UPGRADE=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'GLOBAL_ACCOUNT_SERVER_RENDER=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'CLIENT_DOM_REPARENTING_REMOVED=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R17_GATE_RECEIPT.txt"
          echo 'P01_V24717_SEALED_GATE_IDENTITY=PASS'

      - name: Publish VF Start V2.47.17 Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24717-pass
          REPO=llhzx2018/vf-start
          TAG=v2.47.17
          SOURCE=dfbafc51a55a37e52240f2b029f05ab311735f12
          TREE=712118f6b2b26f6e868c305324ffb1414cf7a6d7
          MAIN=83ab227a239b4da6f940fb2c6822b36e5677558e

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$main_sha" = "$MAIN"
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.17"

          cat > /tmp/p01-v24717-release-notes.md <<EOF
          VF Start V2.47.17 · Navigation UX Round 4.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.16 → V2.47.17
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Moves the global Navigation/account shell from client-side DOM reconstruction to stable server-rendered markup.
          - Keeps Settings, Resource Management, Recycle Bin, Login and Logout semantics while making JavaScript bind interaction only.
          - Removes client-side global-nav reparenting and dynamic Projects insertion ownership.
          - Preserves the existing product shape, data authority, privacy boundary and Navigation Round 2/3 behavior.

          Machine proof:
          - Exact-source focused gate: 35423826127 PASS
          - Formal Release Gate: 35424074350 PASS
          - Clean FULL install / admin login / setup lock PASS
          - V2.47.16 → V2.47.17 Atomic update PASS
          - Owner data and managed update credential preservation PASS
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Navigation Round 2/3 regression + Round 4 global account shell contracts PASS
          - Public Authority release coverage PASS
          - Production NOT_WRITTEN

          FULL sha256: 285e1119982c3bc5bac7eb6b6a3a81fff3c68ab4a02ab818513193f8444b2585
          UPDATE sha256: 9424f99d5aa2c8e68c65eef46d7b84a4c8fed9f0d7f624928da7b34ccc167258

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24717-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')" = "$SOURCE"
          else
            gh release create "$TAG"               "$OUT/VF-Start-V2.47.17-FULL.zip"               "$OUT/VF-Start-V2.47.17-FULL.zip.sha256"               "$OUT/VF_Start_V2.47.17_UPDATE.zip"               "$OUT/VF_Start_V2.47.17_UPDATE.zip.sha256"               "$OUT/SHA256SUMS.txt"               --repo "$REPO"               --target "$SOURCE"               --title "VF Start V2.47.17"               --notes-file /tmp/p01-v24717-release-notes.md
          fi

          READBACK=/tmp/p01-v24717-release-readback
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          release_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          gh release download "$TAG" --repo "$REPO" --dir "$READBACK"
          test "$(stat -c %s "$READBACK/VF-Start-V2.47.17-FULL.zip")" = "870210"
          test "$(sha256sum "$READBACK/VF-Start-V2.47.17-FULL.zip" | awk '{print $1}')" = "285e1119982c3bc5bac7eb6b6a3a81fff3c68ab4a02ab818513193f8444b2585"
          test "$(stat -c %s "$READBACK/VF_Start_V2.47.17_UPDATE.zip")" = "1855143"
          test "$(sha256sum "$READBACK/VF_Start_V2.47.17_UPDATE.zip" | awk '{print $1}')" = "9424f99d5aa2c8e68c65eef46d7b84a4c8fed9f0d7f624928da7b34ccc167258"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$release_json")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$release_json")"
          echo 'P01_V24717_FORMAL_RELEASE_READBACK=PASS'
          echo 'PRODUCTION=NOT_WRITTEN'
