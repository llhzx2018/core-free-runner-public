name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:
    inputs:
      entry_check:
        description: 'Verify live VF repository entry coverage (read-only)'
        type: boolean
        default: false
      gov_source_sha:
        description: 'main or an approved exact GOV-DOC commit SHA'
        type: string
        default: main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger-scope owned regression tests
        run: python -m unittest tests.test_runner_trigger_scope tests.test_estate_anti_drift -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  entry-regressions:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.entry_check) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'llhzx2018' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'maintenance/gov-entry-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOV_REF: ${{ inputs.gov_source_sha || 'main' }}
    steps:
      - name: Validate read-only source selection
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GOV_REF" = main || "$GOV_REF" =~ ^[a-f0-9]{40}$ ]] || exit 78

      - name: Checkout transient governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-entry-source

      - name: Bind exact governance source
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C gov-entry-source rev-parse HEAD)"
          if [ "$GOV_REF" != main ]; then test "$SOURCE_SHA" = "$GOV_REF"; fi
          echo "GOV_EXACT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "GOV_ENTRY_SOURCE_SHA=$SOURCE_SHA"

      - name: Verify identity and coverage regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -m unittest discover -s gov-entry-source/governance/agent -p test_repository_entry.py > "$RUNNER_TEMP/entry-tests.log" 2>&1; then
            echo 'GOV_ENTRY_REGRESSIONS=PASS'
          else
            echo 'GOV_ENTRY_REGRESSIONS=FAIL'
            exit 1
          fi

      - name: Cleanup transient private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-entry-source
          rm -f "$RUNNER_TEMP/entry-tests.log"

  gov-cross-project-exact:
    name: Exact GOV-DOC public authority (${{ matrix.id }})
    # Temporary owner-authored same-repository PR only.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'maintenance/gov-entry-20261113-cross-project-ci-proof')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: P08
            repo: llhzx2018/vf-adops
            sha: 30193fd6493958838ae49ac4be182e4cee128195
            profile: web_existing
            workflow: .github/workflows/p08-isolated-first-install.yml
          - id: P01
            repo: llhzx2018/vf-start
            sha: fe4de84cec0bfe81cb0785785a8ab50142a2dc12
            profile: web_existing
            workflow: .github/workflows/repository-health.yml
          - id: P02
            repo: llhzx2018/vf-library
            sha: 9327fda2965a7a023d60851fce2972512eaa01f2
            profile: web_existing
            workflow: .github/workflows/repository-health.yml
          - id: P04
            repo: llhzx2018/vf-infra
            sha: fd9843fe2cc6b1417aaa749f721f2fd0f4e68eb6
            profile: web_existing
            workflow: .github/workflows/ci.yml
          - id: P07
            repo: llhzx2018/vf-server-ops
            sha: 888443e57ff0c4cfdbe020096baa5ff572a67a74
            profile: cli
            workflow: .github/workflows/ci.yml
          - id: S01-C01
            repo: llhzx2018/vf-tools-theme
            sha: c5975aadde246f3c85eb4497ef69b35e07f071e0
            profile: wordpress_static
            workflow: .github/workflows/s01-static-modernization-contract.yml
          - id: S01-C02
            repo: llhzx2018/vf-tools-ops
            sha: f80460d834fff5690807b89fa8baecb1e69d1610
            profile: wordpress_static
            workflow: .github/workflows/s01-static-modernization-contract.yml
          - id: S01-C03
            repo: llhzx2018/vf-tools-m3u8
            sha: a4c0358c5fa8d1d6e5a4ba07ce724a5f0bd0f0f5
            profile: wordpress_static
            workflow: .github/workflows/s01-static-modernization-contract.yml
    steps:
      - name: Checkout exact private candidate (transient; read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-product-src
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout canonical GOV-DOC exact source (transient; read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-policy-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact SHAs; run positive and negative source-gate tests
        shell: bash
        env:
          LOCKED_PRODUCT_SHA: ${{ matrix.sha }}
          LOCKED_PROJECT_ID: ${{ matrix.id }}
          LOCKED_PROFILE: ${{ matrix.profile }}
          LOCKED_WORKFLOW: ${{ matrix.workflow }}
          LOCKED_GOV_SHA: 3a794b9f30d4b8b20c8b8b1b173f6d82d35a3997
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-product-src rev-parse HEAD)" = "$LOCKED_PRODUCT_SHA"
          test "$(git -C gov-policy-src rev-parse HEAD)" = "$LOCKED_GOV_SHA"
          test -n "$LOCKED_PROJECT_ID"
          python3 -B -m unittest discover -s private-product-src/.github/checks -p 'test_gov_doc_ci.py' -v
          python3 -B private-product-src/.github/checks/check_gov_doc_ci.py \
            --project-root private-product-src \
            --gov-root gov-policy-src \
            --project-id "$LOCKED_PROJECT_ID" \
            --profile "$LOCKED_PROFILE" \
            --workflow "$LOCKED_WORKFLOW" --require-git
          echo "GOV_CROSS_REPO_EXACT_SOURCE_MACHINE=PASS"
          echo "GOV_CROSS_REPO_ID=$LOCKED_PROJECT_ID"
          echo "GOV_CROSS_REPO_PRODUCT_SHA=$LOCKED_PRODUCT_SHA"
          echo "GOV_CROSS_REPO_GOV_SHA=$LOCKED_GOV_SHA"

      - name: Erase transient private checkouts
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-product-src gov-policy-src
          test ! -e private-product-src
          test ! -e gov-policy-src
