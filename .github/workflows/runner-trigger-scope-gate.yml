name: Public Runner Trigger Scope Gate

on:
  schedule:
    # Scheduled polling is supported on public main; GitHub may delay ticks.
    - cron: '17 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/monitor_cross_project_public_authority.py'
      - 'tests/test_monitor_cross_project_public_authority.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
      - 'scripts/monitor_cross_project_public_authority.py'
      - 'tests/test_monitor_cross_project_public_authority.py'
  workflow_dispatch:
    inputs:
      cross_project_ci:
        description: 'Read-only cross-project public authority check for eight scoped PRs'
        type: boolean
        default: false
      entry_check:
        description: 'Verify live VF repository entry coverage (read-only)'
        type: boolean
        default: false
      gov_source_sha:
        description: 'main or an approved exact GOV-DOC commit SHA'
        type: string
        default: main

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger-scope owned regression tests
        run: python -m unittest tests.test_runner_trigger_scope tests.test_estate_anti_drift -v

      - name: Verify long-lived CI monitor positive and denial fixtures
        run: python3 -B -m unittest tests.test_monitor_cross_project_public_authority -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  entry-regressions:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.entry_check) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'llhzx2018' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'maintenance/gov-entry-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOV_REF: 174a25317cf3326c2552343cd8aa24db00d2d8a9
    steps:
      - name: Validate read-only source selection
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GOV_REF" = main || "$GOV_REF" =~ ^[a-f0-9]{40}$ ]] || exit 78

      - name: Checkout transient governance source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-entry-source
          fetch-depth: 0

      - name: Bind exact governance source
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA="$(git -C gov-entry-source rev-parse HEAD)"
          if [ "$GOV_REF" != main ]; then test "$SOURCE_SHA" = "$GOV_REF"; fi
          echo "GOV_EXACT_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "GOV_ENTRY_SOURCE_SHA=$SOURCE_SHA"

      - name: Verify identity and coverage regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          if python3 -m unittest discover -s gov-entry-source/governance/agent -p test_repository_entry.py > "$RUNNER_TEMP/entry-tests.log" 2>&1; then
            echo 'GOV_ENTRY_REGRESSIONS=PASS'
          else
            echo 'GOV_ENTRY_REGRESSIONS=FAIL'
            exit 1
          fi

      - name: Verify exact GOV-DOC PR 180 layout and shared authority gates
        shell: bash
        env:
          GOV_BASE_SHA: cf19f11eb96d5f44992345fd6dd48012b7fbcef0
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: GIT
            IMPACT_REASON: PR 180 updates the GOV-DOC document layout and existing Git CI with no sealed body changes; only GIT domain scope is affected.
        run: |
          set -Eeuo pipefail
          set +x
          test "$GOV_EXACT_SHA" = "174a25317cf3326c2552343cd8aa24db00d2d8a9"
          cd gov-entry-source
          test "$(git rev-parse HEAD)" = "174a25317cf3326c2552343cd8aa24db00d2d8a9"
          git cat-file -e "$GOV_BASE_SHA^{commit}"
          mkdir -p "$RUNNER_TEMP/gov180-safe"
          check() {
            local label="$1"; shift
            if "$@" > "$RUNNER_TEMP/gov180-safe/$label.log" 2>&1; then
              echo "GOV180_${label}=PASS"
            else
              echo "GOV180_${label}=FAIL"
              exit 1
            fi
          }
          check structure python3 -B governance/catalog/tools/doc_structure_lint.py
          check structure_negative python3 -B -m unittest discover -s governance/catalog/tools -p test_doc_structure_lint.py -v
          check applicability python3 -B governance/public-authority/tools/public_authority_router_lint.py
          check skill_bridge python3 -B governance/public-authority/tools/public_authority_skill_bridge_lint.py
          check skill_bridge_negative python3 -B -m unittest discover -s governance/public-authority/tools -p test_public_authority_skill_bridge_lint.py -v
          check current_dependencies python3 -B governance/public-authority/tools/current_dependency_lint.py
          check current_dependencies_negative python3 -B -m unittest discover -s governance/public-authority/tools -p test_current_dependency_lint.py -v
          check router_negative python3 -B -m unittest discover -s governance/public-authority/tools -p test_public_authority_router_lint.py -v
          check current_git_diff python3 -B governance/public-authority/tools/current_dependency_lint.py --git-base "$GOV_BASE_SHA" --git-head "$GOV_EXACT_SHA"
          check delivery_negative python3 -B -m unittest discover -s governance/public-authority/tests -p test_task_delivery_contract_lint.py -v
          check first_release_negative python3 -B -m unittest discover -s governance/public-authority/tests -p test_first_release_upgrade_evidence.py -v
          check read_order_negative python3 -B -m unittest discover -s governance/public-authority/tests -p test_task_rule_read_order_lint.py -v
          check scope_negative python3 -B -m unittest discover -s governance/agent -p test_task_scope_action_lint.py -v
          check modules_negative python3 -B -m unittest discover -s governance/agent -p test_module_boundary_lint.py -v
          check repository_entry_negative python3 -B -m unittest discover -s governance/agent -p test_repository_entry.py -v
          check installer_contract python3 -B governance/public-authority/tools/system_install_upgrade_contract_lint.py
          check installer_negative python3 -B -m unittest discover -s governance/public-authority/tools -p test_system_install_upgrade_contract_lint.py -v
          check global_closure python3 -B governance/public-authority/tools/global_closure_lint.py
          check bootstrap python3 -B governance/public-authority/tools/global_closure_lint.py --resolve-trigger bootstrap
          check global_negative python3 -B -m unittest discover -s governance/public-authority/tools -p test_global_closure_lint.py -v
          check global_git_diff python3 -B governance/public-authority/tools/global_closure_lint.py --git-base "$GOV_BASE_SHA" --git-head "$GOV_EXACT_SHA"
          echo "GOV180_EXACT_MACHINE_TESTS=21_PASS;SHA=$GOV_EXACT_SHA"

      - name: Cleanup transient private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf gov-entry-source
          rm -f "$RUNNER_TEMP/entry-tests.log"
          rm -rf "$RUNNER_TEMP/gov180-safe"

  cross-project-discover:
    name: Discover eight current PR heads and current GOV-DOC SHA
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.cross_project_ci) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login == 'llhzx2018' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'maintenance/gov-entry-longterm-ci-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      gov_sha: ${{ steps.find.outputs.gov_sha }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run monitor positive and denial tests
        run: python3 -B -m unittest tests.test_monitor_cross_project_public_authority -v
      - name: Read only latest scoped PR heads and canonical governance main
        id: find
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/monitor_cross_project_public_authority.py discover

  cross-project-exact-check:
    name: Exact public authority ${{ matrix.id }}
    needs: cross-project-discover
    if: needs.cross-project-discover.result == 'success' && needs.cross-project-discover.outputs.count == '8'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cross-project-discover.outputs.matrix) }}
    steps:
      - name: Checkout current public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore exact-source successful validation cache
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          path: .vf-ci-marker/pass
          key: vf-gov-ci-v1-${{ matrix.id }}-${{ matrix.mode }}-${{ matrix.sha }}-${{ needs.cross-project-discover.outputs.gov_sha }}-${{ hashFiles('scripts/monitor_cross_project_public_authority.py', '.github/workflows/runner-trigger-scope-gate.yml') }}

      - name: Refuse invalid success cache entries
        if: steps.proof-cache.outputs.cache-hit == 'true'
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/monitor_cross_project_public_authority.py verify-marker --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Checkout exact private product source transiently
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-product-src
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact current GOV-DOC transiently
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ needs.cross-project-discover.outputs.gov_sha }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: gov-policy-src
          persist-credentials: false
          fetch-depth: 1

      - name: Exact source identity, 17 positive/denial tests and full router coverage
        if: steps.proof-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          TARGET_SHA: ${{ matrix.sha }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_PROFILE: ${{ matrix.profile }}
          TARGET_WORKFLOW: ${{ matrix.workflow }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-product-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C gov-policy-src rev-parse HEAD)" = "$GOV_SHA"
          python3 -B -m unittest discover -s private-product-src/.github/checks -p 'test_gov_doc_ci.py' -v
          python3 -B private-product-src/.github/checks/check_gov_doc_ci.py \
            --project-root private-product-src --gov-root gov-policy-src \
            --project-id "$TARGET_ID" --profile "$TARGET_PROFILE" \
            --workflow "$TARGET_WORKFLOW" --require-git
          echo "GOV_MONITOR_NEW_SOURCE_MACHINE=PASS;ID=$TARGET_ID"

      - name: Erase private workspaces regardless of outcome
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- private-product-src gov-policy-src
          test ! -e private-product-src
          test ! -e gov-policy-src

      - name: Revalidate latest PR and GOV-DOC SHAs before passing
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B scripts/monitor_cross_project_public_authority.py recheck --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Create non-sensitive success digest for changed source
        if: steps.proof-cache.outputs.cache-hit != 'true'
        env:
          TARGET_ID: ${{ matrix.id }}
          TARGET_SHA: ${{ matrix.sha }}
          GOV_SHA: ${{ needs.cross-project-discover.outputs.gov_sha }}
          TARGET_MODE: ${{ matrix.mode }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/monitor_cross_project_public_authority.py write-marker --id "$TARGET_ID" --sha "$TARGET_SHA" --gov-sha "$GOV_SHA" --mode "$TARGET_MODE"

      - name: Cache only successful source-policy pair (no source or secrets)
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vf-ci-marker/pass
          key: vf-gov-ci-v1-${{ matrix.id }}-${{ matrix.mode }}-${{ matrix.sha }}-${{ needs.cross-project-discover.outputs.gov_sha }}-${{ hashFiles('scripts/monitor_cross_project_public_authority.py', '.github/workflows/runner-trigger-scope-gate.yml') }}

  cross-project-final-gate:
    name: All eight scoped public-authority results must PASS
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.cross_project_ci) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'maintenance/gov-entry-longterm-ci-')))
    needs: [cross-project-discover, cross-project-exact-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fail closed if discovery or any project was skipped or failed
        env:
          DISCOVERY: ${{ needs.cross-project-discover.result }}
          MATRIX_RESULT: ${{ needs.cross-project-exact-check.result }}
          TARGET_COUNT: ${{ needs.cross-project-discover.outputs.count }}
        run: |
          set -Eeuo pipefail
          test "$DISCOVERY" = success
          test "$TARGET_COUNT" = 8
          test "$MATRIX_RESULT" = success
          echo "GOV_MONITOR_LONG_TERM_8_OF_8=PASS"
