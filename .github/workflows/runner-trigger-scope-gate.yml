name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24717-navigation-ux-round4-release-wrapper.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24717_navigation_ux_round4_release_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24717-navigation-ux-round4-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.17 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: dfbafc51a55a37e52240f2b029f05ab311735f12
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact V2.47.16 release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f953988b4001f04b36c027168a815d80ae3b5fb7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-v24714-navigation-row-release-gate-20260918
          persist-credentials: false
          fetch-depth: 1
          path: old-gate

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and PHP/JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat target/VERSION)" = "2.47.17"
          test "$(cat target/src/VERSION.txt)" = "2.47.17"
          grep -Fq "define('VF_VERSION', '2.47.17');" target/src/app/bootstrap.php
          test "$(git -C target rev-parse HEAD)" = "dfbafc51a55a37e52240f2b029f05ab311735f12"
          test "$(git -C target rev-parse HEAD^{tree})" = "712118f6b2b26f6e868c305324ffb1414cf7a6d7"
          test "$(git -C baseline rev-parse HEAD)" = "f953988b4001f04b36c027168a815d80ae3b5fb7"
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24717-php-lint.txt
          find target/src -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/p01-v24717-js-lint.txt
          echo 'P01_V24717_EXACT_SOURCE_IDENTITY=PASS'

      - name: Run V2.47.17 formal release gate
        shell: bash
        working-directory: runner
        env:
          TARGET_ROOT: ../target
          BASELINE_ROOT: ../baseline
          OLD_HARNESS_ROOT: ../old-harness
          PROVEN_ROOT: ../proven
          OLD_GATE_ROOT: ../old-gate
        run: bash scripts/p01-v24717-navigation-ux-round4-release-wrapper.sh

      - name: Print deterministic artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24717-navigation-round4
          echo "FULL_BYTES=$(stat -c %s "$OUT/VF-Start-V2.47.17-FULL.zip")"
          echo "FULL_SHA256=$(sha256sum "$OUT/VF-Start-V2.47.17-FULL.zip" | awk '{print $1}')"
          echo "UPDATE_BYTES=$(stat -c %s "$OUT/VF_Start_V2.47.17_UPDATE.zip")"
          echo "UPDATE_SHA256=$(sha256sum "$OUT/VF_Start_V2.47.17_UPDATE.zip" | awk '{print $1}')"
          grep -Fx 'P01_V24717_NAVIGATION_UX_ROUND4_RELEASE_GATE=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R17_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R17_GATE_RECEIPT.txt"

      - name: Upload V2.47.17 gate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24717-navigation-ux-round4-${{ github.run_id }}
          path: |
            /tmp/p01-v24717-navigation-round4/VF-Start-V2.47.17-FULL.zip
            /tmp/p01-v24717-navigation-round4/VF-Start-V2.47.17-FULL.zip.sha256
            /tmp/p01-v24717-navigation-round4/VF_Start_V2.47.17_UPDATE.zip
            /tmp/p01-v24717-navigation-round4/VF_Start_V2.47.17_UPDATE.zip.sha256
            /tmp/p01-v24717-navigation-round4/P01.json
            /tmp/p01-v24717-navigation-round4/SHA256SUMS.txt
            /tmp/p01-v24717-navigation-round4/R17_GATE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14
