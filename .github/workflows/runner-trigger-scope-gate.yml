name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24719_favorite_hotfix_gate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'temp/p01-v24719-favorite-write-hotfix-gate-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout temporary hotfix proof lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P01 hotfix candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c250ef9a02cbf9f7a646dd04322b038b0e39a65d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "c250ef9a02cbf9f7a646dd04322b038b0e39a65d"
          test "$(tr -d '\r\n ' < target/VERSION)" = "2.47.19"
          find target/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find target/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo 'P01_V24719_FAVORITE_HOTFIX_SOURCE_IDENTITY=PASS'

      - name: Run Favorite recovery contracts
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          php tests/unit/favorite_write_recovery_contract.php
          php tests/unit/favorite_add_context_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          php tests/unit/derived_favorite_view_coherence_contract.php
          php tests/unit/navigation_favorite_count_context_contract.php
          php tests/unit/navigation_owner_behavior_privacy_contract.php
          php tests/unit/global_account_actions_contract.php
          echo 'P01_V24719_FAVORITE_HOTFIX_CONTRACTS=PASS'

      - name: Fresh HTTP Favorite state-setter and stale-projection smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-favorite-hotfix
          cp -a target/src /tmp/p01-favorite-hotfix
          cd /tmp/p01-favorite-hotfix
          php -S 127.0.0.1:18102 -t . >/tmp/p01-favorite-hotfix-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; cat /tmp/p01-favorite-hotfix-server.log || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies http://127.0.0.1:18102/setup.php -o /tmp/p01-fav-hotfix-setup.html; then break; fi
            sleep 1
          done
          SETUP_CSRF=$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-fav-hotfix-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"', text)
          assert m
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies -X POST http://127.0.0.1:18102/setup.php             --data-urlencode "setup_csrf=$SETUP_CSRF"             --data-urlencode 'site_title=P01 Favorite Hotfix'             --data-urlencode 'admin_password=FavoriteHotfix!2026'             --data-urlencode 'admin_password_confirm=FavoriteHotfix!2026'             -o /tmp/p01-fav-hotfix-setup-post.html

          curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies             -H 'Content-Type: application/json'             -X POST 'http://127.0.0.1:18102/api.php?action=login'             --data '{"password":"FavoriteHotfix!2026"}'             -o /tmp/p01-fav-hotfix-login.json
          grep -F '"ok":true' /tmp/p01-fav-hotfix-login.json >/dev/null

          curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies 'http://127.0.0.1:18102/watch.php' -o /tmp/p01-fav-hotfix-watch.html
          CSRF=$(python3 - <<'PY'
          import json,re,html
          text=open('/tmp/p01-fav-hotfix-watch.html',encoding='utf-8').read()
          m=re.search(r'<script[^>]+id="vf-workspace-data"[^>]*>(.*?)</script>', text, re.S)
          assert m
          payload=json.loads(html.unescape(m.group(1)))
          print(payload['csrf'])
          PY
          )

          curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies             -X POST http://127.0.0.1:18102/workspace-create.php             -F "csrf=$CSRF"             -F 'surface=watch'             -F 'source_kind=remote_url'             -F 'title=Favorite Hotfix Watch'             -F 'url=https://example.com/favorite-hotfix-watch'             -F 'resource_kind=movie'             -F 'media_status=want'             -F 'is_private=1'             -F 'is_favorite=0'             -o /tmp/p01-fav-hotfix-create.json
          ID=$(jq -er '.id' /tmp/p01-fav-hotfix-create.json)

          favorite(){
            local desired="$1"
            curl -fsS -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies               -X POST http://127.0.0.1:18102/workspace-action.php               -F "csrf=$CSRF"               -F 'action=favorite'               -F "id=$ID"               -F "favorite=$desired"
          }

          favorite 1 | tee /tmp/p01-fav-hotfix-f1.json
          favorite 1 | tee /tmp/p01-fav-hotfix-f1-repeat.json

          DB=$(php -r "require 'app/bootstrap.php'; echo VF_DB_FILE;")
          test "$(sqlite3 "$DB" "select category_id is null from links where id=$ID;")" = "1"
          test "$(sqlite3 "$DB" "select is_favorite from links where id=$ID;")" = "1"
          test "$(sqlite3 "$DB" "select count(*) from operation_history where action='favorite' and object_id=$ID;")" = "1"

          favorite 0 | tee /tmp/p01-fav-hotfix-f0.json
          favorite 0 | tee /tmp/p01-fav-hotfix-f0-repeat.json
          test "$(sqlite3 "$DB" "select is_favorite from links where id=$ID;")" = "0"
          test "$(sqlite3 "$DB" "select count(*) from operation_history where action='favorite' and object_id=$ID;")" = "2"

          # Simulate a stale page / incomplete derived profile: the canonical link
          # remains active but no longer appears in allAssets(true). Favorite must
          # still be a canonical link write, not a projection-membership write.
          sqlite3 "$DB" "delete from resource_domain_profiles where link_id=$ID;"
          favorite 1 | tee /tmp/p01-fav-hotfix-stale-projection.json
          grep -F '"ok":true' /tmp/p01-fav-hotfix-stale-projection.json >/dev/null
          test "$(sqlite3 "$DB" "select is_favorite from links where id=$ID;")" = "1"
          test "$(sqlite3 "$DB" "select count(*) from operation_history where action='favorite' and object_id=$ID;")" = "3"

          # A stale CSRF is rejected before mutation; workspace.js owns the one-time
          # refresh/retry recovery contract.
          code=$(curl -sS -o /tmp/p01-fav-hotfix-stale-csrf.json -w '%{http_code}'             -c /tmp/p01-fav-hotfix.cookies -b /tmp/p01-fav-hotfix.cookies             -X POST http://127.0.0.1:18102/workspace-action.php             -F 'csrf=stale-token' -F 'action=favorite' -F "id=$ID" -F 'favorite=0')
          test "$code" = "403"
          grep -F 'CSRF 校验失败' /tmp/p01-fav-hotfix-stale-csrf.json >/dev/null
          test "$(sqlite3 "$DB" "select is_favorite from links where id=$ID;")" = "1"

          echo 'P01_V24719_FAVORITE_IDEMPOTENT_HTTP=PASS'
          echo 'P01_V24719_FAVORITE_STALE_PROJECTION_HTTP=PASS'
          echo 'P01_V24719_FAVORITE_STALE_CSRF_FAIL_CLOSED=PASS'

      - name: Gate receipt
        shell: bash
        run: |
          echo 'P01_V24719_FAVORITE_HOTFIX_GATE=PASS'
          echo 'FAVORITE_CANONICAL_WRITE=PASS'
          echo 'FAVORITE_IDEMPOTENT=PASS'
          echo 'FAVORITE_NULL_CATEGORY=PASS'
          echo 'FAVORITE_STALE_PROJECTION_RECOVERY=PASS'
          echo 'FAVORITE_STALE_CSRF_RECOVERY_CONTRACT=PASS'
          echo 'SCHEMA_CHANGE=NONE'
          echo 'MIGRATION=NONE'
          echo 'PRODUCTION=NOT_WRITTEN'
