name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1112-backend-update-mechanism:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v1112-backend-update-gate-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      P05_EXACT_SOURCE: ace6c56fb199c782fa276654ee42dcd7be2123a9
      P05_BASE_SOURCE: 40e6863fa7b3a771bb6561076dfb40507e9d5866
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_SOURCE^{commit}"
          git diff --check "$P05_BASE_SOURCE" "$P05_EXACT_SOURCE"
          printf '%s\n' '--- P05 exact mechanism diff ---'
          git diff --name-only "$P05_BASE_SOURCE" "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.11'
          echo 'P05_V1112_MECHANISM_EXACT_SOURCE=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 Node24
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Frontend and contract gates
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run build
          echo 'P05_V1112_FRONTEND_CONTRACT_BUILD=PASS'

      - name: PHP syntax and common Authority anti-drift
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing:$e\n");exit(1);}} if(!class_exists("ZipArchive")){fwrite(STDERR,"missing:ZipArchive\n");exit(1);}'
          npm run php:lint
          grep -F "CORE_REPOSITORY = 'llhzx2018/core-updates'" php/src/PhpUpdater.php >/dev/null
          grep -F "CORE_PROJECT_FILE = 'P05.json'" php/src/PhpUpdater.php >/dev/null
          grep -F "TOKEN_ENV = 'VF_PRIVATE_READ_TOKEN'" php/src/PhpUpdater.php >/dev/null
          ! grep -R -F 'core-free-runner-public' php/src/PhpUpdater.php src/client/UpdateShortcut.tsx scripts/package-php-release.mjs
          ! grep -R -F 'p05-dist-v' php/src/PhpUpdater.php src/client/UpdateShortcut.tsx scripts/package-php-release.mjs
          ! grep -F '_FULL.zip' php/src/PhpUpdater.php
          grep -F 'P05AtomicPackage::run' php/src/PhpUpdater.php >/dev/null
          grep -F "onlineUpdateAuthority: 'core-updates:llhzx2018/core-updates/projects/P05.json'" scripts/package-php-release.mjs >/dev/null
          echo 'P05_V1112_COMMON_UPDATE_AUTHORITY=PASS'

      - name: Build formal PHP staging and fresh-install compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          test -f build/vf-seo-php-release/php/src/CoreUpdates/UpdateCore.php
          test -f build/vf-seo-php-release/php/src/CoreUpdates/GitHubClient.php
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json >/dev/null
          grep -F 'POINTER_BOUND_PRIVATE_RUNTIME_ENV' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json >/dev/null
          ! grep -F 'core-free-runner-public' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          echo 'P05_V1112_FRESH_INSTALL_COMPATIBILITY=PASS'

      - name: Exercise real private common update channel and credential storage
        env:
          P05_TEST_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          php scripts/php-common-updater-smoke.php
          echo 'P05_V1112_REAL_COMMON_CHANNEL=PASS'

      - name: Seal mechanism gate
        run: |
          echo 'P05_V1112_BACKEND_UPDATE_MECHANISM_GATE=PASS'
          echo 'P05_EXACT_SOURCE=ace6c56fb199c782fa276654ee42dcd7be2123a9'
          echo 'P05_VERSION_FROZEN=NO'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
