name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24711-atomic-hotfix-r1-publish.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  p01_v24711_atomic_hotfix_r1_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24711-atomic-hotfix-publish-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      RUNNER_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout temporary publish lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Replace V2.47.11 Atomic UPDATE asset and remote-readback
        shell: bash
        working-directory: runner
        run: bash scripts/p01-v24711-atomic-hotfix-r1-publish.sh

      - name: Upload public-safe publish receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24711-atomic-hotfix-r1-publish-${{ github.run_id }}
          path: runner/evidence/runner/P01_V24711_ATOMIC_HOTFIX_R1_PUBLISH.txt
          if-no-files-found: error
          retention-days: 14
