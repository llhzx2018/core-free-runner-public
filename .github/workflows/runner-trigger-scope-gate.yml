name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory
      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p01_exact_source:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24711-update-recovery-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_SHA: 7184ddd5f60f18f57dd82e6745d5df58b372f111
      SOURCE_SHA: 972541fd06c66044105ec1b19cf7738c340c90c1
      TARGET_VERSION: 2.47.11
      EXPECTED_SCHEMA: '2026090401'
      SOURCE_ACCESS_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Existing credential read-only route preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$SOURCE_ACCESS_TOKEN"
          echo P01_EXISTING_CREDENTIAL_READONLY_ROUTE=PASS

      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SHA }}
          token: ${{ env.SOURCE_ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-start

      - name: Checkout exact stable baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.SOURCE_ACCESS_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source lint and recovery contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$EXACT_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          test -z "$(git -C vf-start diff --name-only "$SOURCE_SHA"..HEAD -- src/migrations/)"
          find vf-start/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24711-php-lint.log
          php vf-start/tests/unit/update_recovery_contract.php | tee /tmp/p01-v24711-contract.log
          grep -Fx 'P01_UPDATE_RECOVERY_CONTRACT=PASS' /tmp/p01-v24711-contract.log
          echo P01_V24711_PHP_LINT=PASS
          echo P01_V24711_SCHEMA_NO_MIGRATION=PASS

      - name: Fresh install and managed credential runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/p01-v24711-fresh
          rm -rf "$R" /tmp/p01-v24711-*
          cp -a vf-start/src "$R"
          php -S 127.0.0.1:19821 -t "$R" >/tmp/p01-v24711-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            curl -fsS -c /tmp/p01-v24711-cookie -b /tmp/p01-v24711-cookie http://127.0.0.1:19821/setup.php -o /tmp/p01-v24711-setup && break
            sleep .25
          done
          csrf="$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v24711-setup',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-v24711-cookie -b /tmp/p01-v24711-cookie -X POST http://127.0.0.1:19821/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=V24711 Candidate Gate' \
            --data-urlencode 'admin_password=V24711CandidateMachine!' \
            --data-urlencode 'admin_password_confirm=V24711CandidateMachine!' \
            -o /tmp/p01-v24711-setup-post
          test -f "$R/app/.runtime.php"
          php "$R/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          code="$(curl -sS -o /tmp/p01-v24711-anon.body -D /tmp/p01-v24711-anon.headers -w '%{http_code}' http://127.0.0.1:19821/update-credential.php)"
          test "$code" = 302
          R="$R" php <<'PHP'
          <?php
          $r=getenv('R');
          require $r.'/app/bootstrap.php';
          require $r.'/app/UpdateCredentialStore.php';
          require $r.'/app/CoreUpdates/GitHubClient.php';
          $store=new VfUpdateCredentialStore();
          $managed='synthetic_P01_read_token_24711_machine';
          $store->save($managed);
          $path=VF_PRIVATE_ROOT.'/update-auth/github-read-token';
          clearstatcache(true,$path);
          if(!is_file($path)||is_link($path)||(fileperms($path)&0777)!==0600) exit(10);
          putenv('VF_PRIVATE_READ_TOKEN=synthetic_stale_environment_token_24711');
          $before=(string)getenv('VF_PRIVATE_READ_TOKEN');
          $client=new \CoreUpdates\GitHubClient($before);
          $rp=(new ReflectionClass($client))->getProperty('token');
          $rp->setAccessible(true);
          if($rp->getValue($client)!==$managed) exit(11);
          if((string)getenv('VF_PRIVATE_READ_TOKEN')!==$before) exit(12);
          $store->clear();
          $target=VF_PRIVATE_ROOT.'/update-auth/symlink-target';
          file_put_contents($target,"sentinel\n");
          symlink($target,$path);
          if($store->managedToken()!=='') exit(13);
          $rejected=false;
          try{$store->clear();}catch(RuntimeException $e){$rejected=true;}
          if(!$rejected) exit(14);
          @unlink($path); @unlink($target);
          echo "P01_MANAGED_TOKEN_PRIVATE_0600=PASS\n";
          echo "P01_MANAGED_OVERRIDES_STALE_ENV=PASS\n";
          echo "P01_PROCESS_ENV_UNCHANGED=PASS\n";
          echo "P01_MANAGED_SYMLINK_REJECTION=PASS\n";
          PHP
          echo P01_V24711_FRESH_INSTALL=PASS
          echo P01_V24711_CANDIDATE_MACHINE_CHECK=PASS

      - name: Public-safe candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/runner
          cat > evidence/runner/P01_V24711_CANDIDATE.txt <<EOF
          P01_EXACT_SOURCE_SHA=$EXACT_SHA
          P01_SOURCE_STABLE_SHA=$SOURCE_SHA
          VERSION=$TARGET_VERSION
          SCHEMA=$EXPECTED_SCHEMA
          PHP_LINT=PASS
          UPDATE_RECOVERY_CONTRACT=PASS
          FRESH_INSTALL=PASS
          ADMIN_ONLY_ROUTE=PASS
          MANAGED_PRIVATE_0600=PASS
          MANAGED_SYMLINK_REJECTION=PASS
          MANAGED_OVERRIDES_STALE_ENV=PASS
          PROCESS_ENV_UNCHANGED=PASS
          MIGRATION=NONE
          RELEASE_WRITE_OPERATION=NO
          PRODUCTION=NOT_TESTED
          P01_V24711_CANDIDATE_MACHINE_CHECK=PASS
          EOF
          cat evidence/runner/P01_V24711_CANDIDATE.txt

      - name: Upload public-safe receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24711-candidate-${{ github.run_id }}
          path: evidence/runner/P01_V24711_CANDIDATE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup private worktree bytes
        if: always()
        shell: bash
        run: rm -rf vf-start baseline /tmp/p01-v24711-*
