name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  p01_v24719_navigation_round6_favorite_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24719-navigation-round6-favorite-hotfix-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Fetch exact PASS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24719-pass
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh run download 35434639190             --repo llhzx2018/core-free-runner-public             --name p01-v24719-navigation-ux-round6-35434639190             --dir "$OUT"
          test -f "$OUT/VF-Start-V2.47.19-FULL.zip"
          test -f "$OUT/VF_Start_V2.47.19_UPDATE.zip"
          test -f "$OUT/R19_GATE_RECEIPT.txt"
          echo 'P01_V24719_PASS_ARTIFACT_FETCH=PASS'

      - name: Verify sealed gate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24719-pass
          test "$(stat -c %s "$OUT/VF-Start-V2.47.19-FULL.zip")" = "870783"
          test "$(sha256sum "$OUT/VF-Start-V2.47.19-FULL.zip" | awk '{print $1}')" = "0cfd09229c5b4e7e38926592ebff88276a3c0dfcda8430575c20e79f4994dcfc"
          test "$(stat -c %s "$OUT/VF_Start_V2.47.19_UPDATE.zip")" = "1856178"
          test "$(sha256sum "$OUT/VF_Start_V2.47.19_UPDATE.zip" | awk '{print $1}')" = "963567feb379fc3fe8ae345bb21231eaa1bc8fee45d2c22cbb670bae7de08d0f"
          grep -Fx 'P01_V24719_NAVIGATION_UX_ROUND6_RELEASE_GATE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'V24718_TO_V24719_ATOMIC_UPGRADE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'GLOBAL_ACCOUNT_SINGLE_OWNER=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'SIDEBAR_VERSION_ONLY=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_WRITE_RECOVERY=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_CANONICAL_WRITE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_IDEMPOTENT=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_NULL_CATEGORY=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_STALE_PROJECTION_RECOVERY=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_STALE_CSRF_RECOVERY_CONTRACT=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R19_GATE_RECEIPT.txt"
          echo 'P01_V24719_SEALED_GATE_IDENTITY=PASS'

      - name: Publish VF Start V2.47.19 Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24719-pass
          REPO=llhzx2018/vf-start
          TAG=v2.47.19
          SOURCE=aabaa35728f776c0db3785f67eb7812e0a0374ee
          TREE=7c92318758aa6f2a18be36550fc9918b9d77e0ab
          MAIN=64bab8b5d17f020e3be9ccb98cf455d0afa01e15

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$main_sha" = "$MAIN"
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.19"

          cat > /tmp/p01-v24719-release-notes.md <<EOF
          VF Start V2.47.19 · Navigation UX Round 6 + Favorite Production Recovery.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.18 → V2.47.19
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Removes duplicated hidden sidebar account actions; the top-right account area is now the single authoritative owner.
          - Keeps the sidebar footer version-only instead of rendering duplicate actions and hiding them with CSS.
          - Hardens one-click Favorite writes after OWNER Production reported a live error on V2.47.18.
          - Favorite writes now use canonical active-link state directly, are idempotent, preserve nullable category identity, and do not depend on derived surface projection completeness.
          - Workspace writes recover once from an explicit stale-CSRF 403 by refreshing the current page token, while server-side CSRF still fails closed before mutation.

          Machine proof:
          - V2.47.18 fresh Favorite diagnostic: 35434083336 PASS
          - Favorite hotfix exact-source Gate: 35434556083 PASS
          - Formal Release Gate: 35434639190 PASS
          - V2.47.18 → V2.47.19 Atomic update PASS
          - Clean FULL install / admin login / setup lock PASS
          - Owner data and managed update credential preservation PASS
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Navigation Round 6 + Favorite recovery regressions PASS
          - Public Authority release coverage PASS
          - Production NOT_WRITTEN

          FULL sha256: 0cfd09229c5b4e7e38926592ebff88276a3c0dfcda8430575c20e79f4994dcfc
          UPDATE sha256: 963567feb379fc3fe8ae345bb21231eaa1bc8fee45d2c22cbb670bae7de08d0f

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24719-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')" = "$SOURCE"
          else
            gh release create "$TAG"               "$OUT/VF-Start-V2.47.19-FULL.zip"               "$OUT/VF-Start-V2.47.19-FULL.zip.sha256"               "$OUT/VF_Start_V2.47.19_UPDATE.zip"               "$OUT/VF_Start_V2.47.19_UPDATE.zip.sha256"               "$OUT/SHA256SUMS.txt"               --repo "$REPO"               --target "$SOURCE"               --title "VF Start V2.47.19"               --notes-file /tmp/p01-v24719-release-notes.md
          fi

          READBACK=/tmp/p01-v24719-release-readback
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          release_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          gh release download "$TAG" --repo "$REPO" --dir "$READBACK"
          test "$(stat -c %s "$READBACK/VF-Start-V2.47.19-FULL.zip")" = "870783"
          test "$(sha256sum "$READBACK/VF-Start-V2.47.19-FULL.zip" | awk '{print $1}')" = "0cfd09229c5b4e7e38926592ebff88276a3c0dfcda8430575c20e79f4994dcfc"
          test "$(stat -c %s "$READBACK/VF_Start_V2.47.19_UPDATE.zip")" = "1856178"
          test "$(sha256sum "$READBACK/VF_Start_V2.47.19_UPDATE.zip" | awk '{print $1}')" = "963567feb379fc3fe8ae345bb21231eaa1bc8fee45d2c22cbb670bae7de08d0f"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$release_json")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$release_json")"
          echo 'P01_V24719_FORMAL_RELEASE_READBACK=PASS'
          echo 'PRODUCTION=NOT_WRITTEN'
