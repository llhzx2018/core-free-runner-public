name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24711-release-gate.py'
      - 'scripts/p01-v24711-formal-release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_formal_release:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24711-update-recovery-20260916'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_SHA: 252ca51215e7e4411741e2f53d0bcc68f37614f2
      EXACT_TREE: 1e6fe31f03ed871e68b3153b7e5c1e81099d1cf7
      SOURCE_SHA: 972541fd06c66044105ec1b19cf7738c340c90c1
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Formal release authorization boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_WRITE_TOKEN"
          echo PRIOR_EXACT_MACHINE_GATE_RUN=35212399949
          echo PRIOR_EXACT_MACHINE_GATE_JOB=p01_exact_source
          echo PRIOR_EXACT_MACHINE_GATE=PASS
          echo PRODUCTION_WRITE=NO

      - name: Checkout temporary release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact gated P01 main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: vf-start

      - name: Checkout exact V2.47.10 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Rebuild exact deterministic bytes and publish formal release
        shell: bash
        env:
          P01_EXACT_SHA: ${{ env.EXACT_SHA }}
          P01_EXACT_TREE: ${{ env.EXACT_TREE }}
          P01_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          RUNNER_ROOT: ${{ github.workspace }}/runner
          P01_ROOT: ${{ github.workspace }}/vf-start
          BASELINE_ROOT: ${{ github.workspace }}/baseline
        run: bash runner/scripts/p01-v24711-formal-release.sh

      - name: Upload public-safe formal release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24711-formal-release-${{ github.run_id }}
          path: runner/evidence/runner/P01_V24711_FORMAL_RELEASE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup release credential working copies
        if: always()
        shell: bash
        run: rm -rf vf-start baseline /tmp/p01-v24711-formal-release /tmp/remote-VF-* /tmp/remote-P01_* /tmp/p01-*.json /tmp/p01-*.err