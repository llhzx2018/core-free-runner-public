name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24719-navigation-ux-round6-release-wrapper.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24719_navigation_ux_round6_release_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24719-navigation-ux-round6-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.19 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a3b51bdb69cd1e530fc7136028b2712a5a96551c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact V2.47.18 release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 52249a697b907e15f6cb56acb37fa8993b789d80
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-v24714-navigation-row-release-gate-20260918
          persist-credentials: false
          fetch-depth: 1
          path: old-gate

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and PHP/JS syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat target/VERSION)" = "2.47.19"
          test "$(cat target/src/VERSION.txt)" = "2.47.19"
          grep -Fq "define('VF_VERSION', '2.47.19');" target/src/app/bootstrap.php
          test "$(git -C target rev-parse HEAD)" = "a3b51bdb69cd1e530fc7136028b2712a5a96551c"
          test "$(git -C target rev-parse HEAD^{tree})" = "e881ef44f78108c13c0af2f54ffa5b0efed27b2f"
          test "$(git -C baseline rev-parse HEAD)" = "52249a697b907e15f6cb56acb37fa8993b789d80"
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24719-php-lint.txt
          find target/src -name '*.js' -print0 | xargs -0 -n1 node --check >/tmp/p01-v24719-js-lint.txt
          echo 'P01_V24719_EXACT_SOURCE_IDENTITY=PASS'

      - name: Run V2.47.19 formal release gate
        shell: bash
        working-directory: runner
        env:
          TARGET_ROOT: ../target
          BASELINE_ROOT: ../baseline
          OLD_HARNESS_ROOT: ../old-harness
          PROVEN_ROOT: ../proven
          OLD_GATE_ROOT: ../old-gate
        run: bash scripts/p01-v24719-navigation-ux-round6-release-wrapper.sh

      - name: Print deterministic artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24719-navigation-round6
          echo "FULL_BYTES=$(stat -c %s "$OUT/VF-Start-V2.47.19-FULL.zip")"
          echo "FULL_SHA256=$(sha256sum "$OUT/VF-Start-V2.47.19-FULL.zip" | awk '{print $1}')"
          echo "UPDATE_BYTES=$(stat -c %s "$OUT/VF_Start_V2.47.19_UPDATE.zip")"
          echo "UPDATE_SHA256=$(sha256sum "$OUT/VF_Start_V2.47.19_UPDATE.zip" | awk '{print $1}')"
          grep -Fx 'P01_V24719_NAVIGATION_UX_ROUND6_RELEASE_GATE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'V24718_TO_V24719_ATOMIC_UPGRADE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'GLOBAL_ACCOUNT_SINGLE_OWNER=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'SIDEBAR_VERSION_ONLY=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R19_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R19_GATE_RECEIPT.txt"

      - name: Upload V2.47.19 gate assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24719-navigation-ux-round6-${{ github.run_id }}
          path: |
            /tmp/p01-v24719-navigation-round6/VF-Start-V2.47.19-FULL.zip
            /tmp/p01-v24719-navigation-round6/VF-Start-V2.47.19-FULL.zip.sha256
            /tmp/p01-v24719-navigation-round6/VF_Start_V2.47.19_UPDATE.zip
            /tmp/p01-v24719-navigation-round6/VF_Start_V2.47.19_UPDATE.zip.sha256
            /tmp/p01-v24719-navigation-round6/P01.json
            /tmp/p01-v24719-navigation-round6/SHA256SUMS.txt
            /tmp/p01-v24719-navigation-round6/R19_GATE_RECEIPT.txt
          if-no-files-found: error
          retention-days: 14
