name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24713-runtime-boundary-channel-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24713_runtime_boundary_channel_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24713-runtime-boundary-gate-20260918'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VF_RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary channel gate lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-updates
          ref: 103933f3ef611f1308867718da7e4a05fec73266
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core

      - name: Checkout exact P01 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-start
          ref: e714cfe540ad39202c2cb558e5c0a370ef6d6502
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p01

      - name: Run Update Core, remote asset, and freshness rotation gate
        shell: bash
        working-directory: runner
        env:
          CORE_ROOT: ../core
          P01_ROOT: ../p01
        run: bash scripts/p01-v24713-runtime-boundary-channel-gate.sh

      - name: Upload public-safe channel gate receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24713-runtime-boundary-channel-${{ github.run_id }}
          path: runner/evidence/runner/P01_V24713_RUNTIME_BOUNDARY_CHANNEL_GATE.txt
          if-no-files-found: error
          retention-days: 14
