name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
      - 'scripts/p05-v1111-standard-atomic-builder-bootstrap.py'
      - 'scripts/p05-v1111-standard-atomic-current-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1111-standard-atomic:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v1111-standard-atomic-artifact-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout one-off public-safe gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Execute P05 standard Atomic artifact gate
        shell: bash
        run: |
          # Wrong-password is intentionally HTTP 422. Preserve its response body for
          # assertion instead of asking curl --fail to convert the expected 422 into
          # a harness failure. This edits only the disposable runner worktree.
          sed -i "/password=wrong-password/s/curl -fsS/curl -sS/" scripts/p05-v1111-standard-atomic-current-gate.sh
          bash scripts/p05-v1111-standard-atomic-current-gate.sh

      - name: Upload P05 standard Atomic artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: P05_V1.1.11_STANDARD_ATOMIC_ARTIFACTS_${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/p05-atomic/out1/repair-v1.1.11.php
            /tmp/p05-atomic/out1/VF_SEO_V1.1.11_UPDATE.zip
            /tmp/p05-atomic/out1/atomic-self-test.json
            /tmp/p05-atomic/out1/P05-V1.1.11-ATOMIC-METADATA.json
            /tmp/p05-atomic/out1/P05-V1.1.11-ATOMIC-GATE.json
            /tmp/p05-atomic/out1/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
