name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  p01_v24720_favorite_ui_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24720-favorite-ui-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Fetch exact PASS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24720-pass
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh run download 35435192054             --repo llhzx2018/core-free-runner-public             --name p01-v24720-favorite-ui-35435192054             --dir "$OUT"
          test -f "$OUT/VF-Start-V2.47.20-FULL.zip"
          test -f "$OUT/VF_Start_V2.47.20_UPDATE.zip"
          test -f "$OUT/R20_GATE_RECEIPT.txt"
          echo 'P01_V24720_PASS_ARTIFACT_FETCH=PASS'

      - name: Verify sealed gate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24720-pass
          test "$(stat -c %s "$OUT/VF-Start-V2.47.20-FULL.zip")" = "870778"
          test "$(sha256sum "$OUT/VF-Start-V2.47.20-FULL.zip" | awk '{print $1}')" = "478fff86673823a45dde119ab0a7df1e6d9c3c0a531cc62ce5dd7f3ebb554048"
          test "$(stat -c %s "$OUT/VF_Start_V2.47.20_UPDATE.zip")" = "1856243"
          test "$(sha256sum "$OUT/VF_Start_V2.47.20_UPDATE.zip" | awk '{print $1}')" = "b5108a82cb0869fddbf63dee9021580e15930e6527819ff901c58bbb6579942c"
          grep -Fx 'P01_V24720_NAVIGATION_UX_FAVORITE_UI_RELEASE_GATE=PASS' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'V24719_TO_V24720_ATOMIC_UPGRADE=PASS' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_UI_COLLECTION_SELECTOR=PASS' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'FAVORITE_UI_RUNTIME_ERROR_REMOVED=PASS' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R20_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R20_GATE_RECEIPT.txt"
          echo 'P01_V24720_SEALED_GATE_IDENTITY=PASS'

      - name: Publish VF Start V2.47.20 Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24720-pass
          REPO=llhzx2018/vf-start
          TAG=v2.47.20
          SOURCE=83ca94662dd8bc053dea0ef94bc0e6ef0d587234
          TREE=0de1caa05e148281d8c8db99d88a57e37fc01587
          MAIN=32b8d39232c7106be81d2a60d6f3fde075847161

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$main_sha" = "$MAIN"
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.20"

          cat > /tmp/p01-v24720-release-notes.md <<EOF
          VF Start V2.47.20 · Favorite UI Collection Runtime Fix.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.19 → V2.47.20
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Fixes the OWNER-reported Favorite/Unfavorite toast error: `$(...).forEach is not a function`.
          - Corrects Favorite count and Favorite button UI synchronization to use the multi-element selector helper instead of the single-element querySelector helper.
          - Keeps the V2.47.19 canonical Favorite write recovery intact; this release only fixes the post-write client UI synchronization exception.
          - Adds a regression contract that rejects any single-element `$()` followed by `.forEach()` in workspace.js.

          Machine proof:
          - Favorite UI exact-source Gate: 35435025201 PASS
          - Formal Release Gate: 35435192054 PASS
          - V2.47.19 → V2.47.20 Atomic update PASS
          - Clean FULL install / admin login / setup lock PASS
          - Owner data and managed update credential preservation PASS
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Favorite write recovery + Favorite UI collection regressions PASS
          - Public Authority release coverage PASS
          - Production NOT_WRITTEN

          FULL sha256: 478fff86673823a45dde119ab0a7df1e6d9c3c0a531cc62ce5dd7f3ebb554048
          UPDATE sha256: b5108a82cb0869fddbf63dee9021580e15930e6527819ff901c58bbb6579942c

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24720-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')" = "$SOURCE"
          else
            gh release create "$TAG"               "$OUT/VF-Start-V2.47.20-FULL.zip"               "$OUT/VF-Start-V2.47.20-FULL.zip.sha256"               "$OUT/VF_Start_V2.47.20_UPDATE.zip"               "$OUT/VF_Start_V2.47.20_UPDATE.zip.sha256"               "$OUT/SHA256SUMS.txt"               --repo "$REPO"               --target "$SOURCE"               --title "VF Start V2.47.20"               --notes-file /tmp/p01-v24720-release-notes.md
          fi

          READBACK=/tmp/p01-v24720-release-readback
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          release_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          gh release download "$TAG" --repo "$REPO" --dir "$READBACK"
          test "$(stat -c %s "$READBACK/VF-Start-V2.47.20-FULL.zip")" = "870778"
          test "$(sha256sum "$READBACK/VF-Start-V2.47.20-FULL.zip" | awk '{print $1}')" = "478fff86673823a45dde119ab0a7df1e6d9c3c0a531cc62ce5dd7f3ebb554048"
          test "$(stat -c %s "$READBACK/VF_Start_V2.47.20_UPDATE.zip")" = "1856243"
          test "$(sha256sum "$READBACK/VF_Start_V2.47.20_UPDATE.zip" | awk '{print $1}')" = "b5108a82cb0869fddbf63dee9021580e15930e6527819ff901c58bbb6579942c"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$release_json")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$release_json")"
          echo 'P01_V24720_FORMAL_RELEASE_READBACK=PASS'
          echo 'PRODUCTION=NOT_WRITTEN'
