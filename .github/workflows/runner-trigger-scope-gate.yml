name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

      - name: Checkout Theme base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: cec158448b916e8309da8e45a25d62f4956ffa8f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/theme-base

      - name: Checkout Theme exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 8b45606376213899fc57f1e4df35fbc960d9f947
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/theme-source

      - name: Checkout M3U8 base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 61ad2a29ffa438aaf92b61454878600f592c4974
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/m3u8-base

      - name: Checkout M3U8 exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 444859cc12aa7a8a2e183ad35d71d5be781d8608
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/m3u8-source

      - name: Checkout Ops base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4f56c209d6b9e16c59c4e65827d84d41c42d9e0b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/ops-base

      - name: Checkout Ops exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 146bb443dd49dec9a4a25f22bed77a0e70eb743f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/ops-source

      - name: Verify three exact AGENTS route deltas
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          cases = [
              ("Theme", Path("verify/theme-base"), Path("verify/theme-source"), "8b45606376213899fc57f1e4df35fbc960d9f947"),
              ("M3U8", Path("verify/m3u8-base"), Path("verify/m3u8-source"), "444859cc12aa7a8a2e183ad35d71d5be781d8608"),
              ("Ops", Path("verify/ops-base"), Path("verify/ops-source"), "146bb443dd49dec9a4a25f22bed77a0e70eb743f"),
          ]
          required = "`core-test-runner` = `DELETED / TOMBSTONE / MIGRATION PROVENANCE ONLY`"
          forbidden = "`core-test-runner` = `LEGACY / RETIRED / DO NOT ROUTE NEW WORK`"

          def tree(root: Path):
              out = {}
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  if rel.startswith(".git/") or rel == "AGENTS.md":
                      continue
                  out[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out

          for name, base, source, expected_sha in cases:
              head = (source / ".git" / "HEAD").read_text(encoding="utf-8").strip()
              if not head.startswith("ref:"):
                  import subprocess
                  actual = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
              else:
                  import subprocess
                  actual = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
              assert actual == expected_sha, f"{name}: exact source drift {actual}"
              assert tree(base) == tree(source), f"{name}: non-AGENTS source drift"
              text = (source / "AGENTS.md").read_text(encoding="utf-8")
              assert required in text, f"{name}: tombstone route missing"
              assert forbidden not in text, f"{name}: legacy route still present"
              lowered = text.lower()
              assert "fallback" in lowered and "execution" in lowered and "new-task" in lowered, f"{name}: route prohibitions incomplete"
              print(f"{name.upper()}_DELETED_RUNNER_ROUTE=PASS")
          print("TOOLS_DELETED_RUNNER_ROUTE_MACHINE=PASS")
          PY
