name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  p01_v24718_navigation_ux_round5_publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24718-navigation-ux-round5-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Fetch exact PASS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24718-pass
          rm -rf "$OUT"
          mkdir -p "$OUT"
          gh run download 35433326099             --repo llhzx2018/core-free-runner-public             --name p01-v24718-navigation-ux-round5-35433326099             --dir "$OUT"
          test -f "$OUT/VF-Start-V2.47.18-FULL.zip"
          test -f "$OUT/VF_Start_V2.47.18_UPDATE.zip"
          test -f "$OUT/R18_GATE_RECEIPT.txt"
          echo 'P01_V24718_PASS_ARTIFACT_FETCH=PASS'

      - name: Verify sealed gate identity
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24718-pass
          test "$(stat -c %s "$OUT/VF-Start-V2.47.18-FULL.zip")" = "870266"
          test "$(sha256sum "$OUT/VF-Start-V2.47.18-FULL.zip" | awk '{print $1}')" = "d2aad870832f05829ef936a39f0278449b7e838d05c8d2133db8cb47736c15b0"
          test "$(stat -c %s "$OUT/VF_Start_V2.47.18_UPDATE.zip")" = "1855309"
          test "$(sha256sum "$OUT/VF_Start_V2.47.18_UPDATE.zip" | awk '{print $1}')" = "45de5eb525f2ddce151752f266ac2aa134a2d21b28fff56cabcaa6a9b3387d63"
          grep -Fx 'P01_V24718_NAVIGATION_UX_ROUND5_RELEASE_GATE=PASS' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'V24717_TO_V24718_ATOMIC_UPGRADE=PASS' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'MOBILE_SORT_REACHABILITY=PASS' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'NO_REQUIRED_GATE_MISSING=YES' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'NO_UNKNOWN_APPLICABILITY=YES' "$OUT/R18_GATE_RECEIPT.txt"
          grep -Fx 'PRODUCTION=NOT_WRITTEN' "$OUT/R18_GATE_RECEIPT.txt"
          echo 'P01_V24718_SEALED_GATE_IDENTITY=PASS'

      - name: Publish VF Start V2.47.18 Formal Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24718-pass
          REPO=llhzx2018/vf-start
          TAG=v2.47.18
          SOURCE=52249a697b907e15f6cb56acb37fa8993b789d80
          TREE=2b2570247d96aab6f4a33841f7c5dfd311697b33
          MAIN=edff74bd4cd70202bd780de5bc5d28a8c2545bd6

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          test "$main_sha" = "$MAIN"
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.18"

          cat > /tmp/p01-v24718-release-notes.md <<EOF
          VF Start V2.47.18 · Navigation UX Round 5.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.17 → V2.47.18
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Restores the canonical Navigation sort control on mobile instead of hiding the only sort selector below 760px.
          - Keeps the existing sort routing/context semantics and makes the responsive control large enough for practical mobile use.
          - Preserves Navigation Round 2-4 behavior, account-shell ownership, data authority and privacy boundaries.

          Machine proof:
          - Exact-source focused gate: 35433174521 PASS
          - Formal Release Gate: 35433326099 PASS
          - Clean FULL install / admin login / setup lock PASS
          - V2.47.17 → V2.47.18 Atomic update PASS
          - Owner data and managed update credential preservation PASS
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Mobile sort reachability + Navigation regressions PASS
          - Public Authority release coverage PASS
          - Production NOT_WRITTEN

          FULL sha256: d2aad870832f05829ef936a39f0278449b7e838d05c8d2133db8cb47736c15b0
          UPDATE sha256: 45de5eb525f2ddce151752f266ac2aa134a2d21b28fff56cabcaa6a9b3387d63

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24718-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.target_commitish')" = "$SOURCE"
          else
            gh release create "$TAG"               "$OUT/VF-Start-V2.47.18-FULL.zip"               "$OUT/VF-Start-V2.47.18-FULL.zip.sha256"               "$OUT/VF_Start_V2.47.18_UPDATE.zip"               "$OUT/VF_Start_V2.47.18_UPDATE.zip.sha256"               "$OUT/SHA256SUMS.txt"               --repo "$REPO"               --target "$SOURCE"               --title "VF Start V2.47.18"               --notes-file /tmp/p01-v24718-release-notes.md
          fi

          READBACK=/tmp/p01-v24718-release-readback
          rm -rf "$READBACK" && mkdir -p "$READBACK"
          release_json=$(gh api "repos/$REPO/releases/tags/$TAG")
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          gh release download "$TAG" --repo "$REPO" --dir "$READBACK"
          test "$(stat -c %s "$READBACK/VF-Start-V2.47.18-FULL.zip")" = "870266"
          test "$(sha256sum "$READBACK/VF-Start-V2.47.18-FULL.zip" | awk '{print $1}')" = "d2aad870832f05829ef936a39f0278449b7e838d05c8d2133db8cb47736c15b0"
          test "$(stat -c %s "$READBACK/VF_Start_V2.47.18_UPDATE.zip")" = "1855309"
          test "$(sha256sum "$READBACK/VF_Start_V2.47.18_UPDATE.zip" | awk '{print $1}')" = "45de5eb525f2ddce151752f266ac2aa134a2d21b28fff56cabcaa6a9b3387d63"
          echo "RELEASE_ID=$(jq -r '.id' <<<"$release_json")"
          echo "PUBLISHED_AT=$(jq -r '.published_at' <<<"$release_json")"
          echo 'P01_V24718_FORMAL_RELEASE_READBACK=PASS'
          echo 'PRODUCTION=NOT_WRITTEN'
