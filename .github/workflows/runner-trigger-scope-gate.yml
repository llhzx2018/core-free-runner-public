name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory
      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

  p05-v1112-final-exact-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v1112-backend-update-gate-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SOURCE: b3cede5d2c06e4e93553e1c32543c0627e3881d4
      P05_BASE_SOURCE: 40e6863fa7b3a771bb6561076dfb40507e9d5866
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout exact private P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind final exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_SOURCE^{commit}"
          git diff --check "$P05_BASE_SOURCE" "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.12'
          node -e "const p=require('./package.json');if(p.version!=='1.1.12')process.exit(1)"
          node -e "const p=require('./VF_PROJECT.json');if(p.version!=='1.1.12'||p.target_version!=='1.1.12'||p.working_version!=='1.1.12'||p.production_version!=='1.1.11')process.exit(1)"
          test -f docs/authority/RELEASE_V1.1.12_CANDIDATE.md
          grep -F 'MECHANISM_PASS / FINAL_EXACT_SOURCE_GATE_PENDING' docs/authority/RELEASE_V1.1.12_CANDIDATE.md >/dev/null
          printf '%s\n' '--- P05 v1.1.12 final exact-source diff ---'
          git diff --name-only "$P05_BASE_SOURCE" "$P05_EXACT_SOURCE"
          echo 'P05_V1112_FINAL_SOURCE_BINDING=PASS'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 Node24
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies and verify version authority
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run release:source:gate
          echo 'P05_V1112_VERSION_AUTHORITY=PASS'

      - name: Full Node and database regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_V1112_FULL_NODE_REGRESSION=PASS'

      - name: PHP compatibility and security regression
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e)){fwrite(STDERR,"missing:$e\n");exit(1);}} if(!class_exists("ZipArchive")){fwrite(STDERR,"missing:ZipArchive\n");exit(1);}'
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          echo 'P05_V1112_PHP_SECURITY_REGRESSION=PASS'

      - name: Common updater authority anti-drift
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F "CORE_REPOSITORY = 'llhzx2018/core-updates'" php/src/PhpUpdater.php >/dev/null
          grep -F "CORE_PROJECT_FILE = 'P05.json'" php/src/PhpUpdater.php >/dev/null
          grep -F "TOKEN_ENV = 'VF_PRIVATE_READ_TOKEN'" php/src/PhpUpdater.php >/dev/null
          grep -F 'P05AtomicPackage::run' php/src/PhpUpdater.php >/dev/null
          grep -F "onlineUpdateAuthority: 'core-updates:llhzx2018/core-updates/projects/P05.json'" scripts/package-php-release.mjs >/dev/null
          ! grep -R -F 'core-free-runner-public' php/src/PhpUpdater.php src/client/UpdateShortcut.tsx scripts/package-php-release.mjs
          ! grep -R -F 'p05-dist-v' php/src/PhpUpdater.php src/client/UpdateShortcut.tsx scripts/package-php-release.mjs
          ! grep -F '_FULL.zip' php/src/PhpUpdater.php
          grep -F "document.querySelector('.secondary-nav')" src/client/UpdateShortcut.tsx >/dev/null
          grep -F '系统与更新' src/client/UpdateShortcut.tsx >/dev/null
          echo 'P05_V1112_COMMON_UPDATE_AUTHORITY=PASS'

      - name: Build formal PHP staging and release gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          test "$(cat build/vf-seo-php-release/VERSION)" = '1.1.12'
          test -f build/vf-seo-php-release/php/src/CoreUpdates/UpdateCore.php
          test -f build/vf-seo-php-release/php/src/CoreUpdates/GitHubClient.php
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json >/dev/null
          grep -F 'POINTER_BOUND_PRIVATE_RUNTIME_ENV' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json >/dev/null
          ! grep -F 'core-free-runner-public' build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json
          ! test -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          echo 'P05_V1112_FORMAL_STAGING=PASS'

      - name: CloudPanel and browser-first runtime gates
        shell: bash
        run: |
          set -Eeuo pipefail
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          echo 'P05_V1112_CLOUDPANEL_BROWSER_BASELINE=PASS'

      - name: Build browser probe for visible backend update workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('php/tests/browser-install-e2e.py').read_text()
          needle = (
              '            click(session, find(session, "a.button"))\n'
              '            wait_value(lambda: bool(execute(session, "return !!document.querySelector(\'#root\');")), lambda value: value is True, "application root after completion")\n'
              '\n'
              '            navigate(session, f"{BASE}/setup")\n'
          )
          replacement = (
              '            click(session, find(session, "a.button"))\n'
              '            wait_value(lambda: bool(execute(session, "return !!document.querySelector(\'#root\');")), lambda value: value is True, "application root after completion")\n'
              '\n'
              '            navigate(session, f"{BASE}/")\n'
              '            initial = wait_value(lambda: body_text(session), lambda value: "所有网站" in value or "登录" in value, "post-install application or login")\n'
              '            if "所有网站" not in initial:\n'
              '                user = find(session, "input[autocomplete=\'username\']")\n'
              '                session_value(session, "POST", f"/element/{user}/clear", {})\n'
              '                send_keys(session, user, "owner")\n'
              '                password = find(session, "input[autocomplete=\'current-password\']")\n'
              '                session_value(session, "POST", f"/element/{password}/clear", {})\n'
              '                send_keys(session, password, PASSWORD)\n'
              '                click(session, find(session, "button.primary"))\n'
              '            wait_value(lambda: body_text(session), lambda value: "所有网站" in value and "系统与更新" in value, "visible System Update secondary navigation")\n'
              '            assert_no_overflow(session, "update-nav-1440")\n'
              '            opened = execute(session, "const b=[...document.querySelectorAll(\'.secondary-nav button\')].find(x=>x.textContent&&x.textContent.includes(\'系统与更新\')); if(!b)return false; b.click(); return true;")\n'
              '            if opened is not True:\n'
              '                fail("System Update navigation button not clickable")\n'
              '            wait_value(lambda: body_text(session), lambda value: "只读更新凭据" in value and "当前版本" in value and "V1.1.12" in value and "core-updates" in value, "System Update workspace content")\n'
              '            overlay = execute(session, "return !!document.querySelector(\'.vf-update-overlay .vf-update-dialog\');")\n'
              '            if overlay is not True:\n'
              '                fail("System Update workspace overlay missing")\n'
              '            assert_no_overflow(session, "update-workspace-1440")\n'
              '\n'
              '            navigate(session, f"{BASE}/setup")\n'
          )
          if needle not in src:
              raise SystemExit('P05_BROWSER_UPDATE_PROBE_PATCH_TARGET_MISSING')
          src = src.replace(needle, replacement, 1)
          marker = '            print("P05_E2E_STAGING_IMMUTABLE=PASS")\n'
          extra = marker + '            print("P05_BACKEND_UPDATE_NAV_VISIBLE=PASS")\n            print("P05_BACKEND_UPDATE_WORKSPACE=PASS")\n            print("P05_BACKEND_UPDATE_CURRENT_VERSION=1.1.12")\n'
          if marker not in src:
              raise SystemExit('P05_BROWSER_UPDATE_PROBE_PRINT_TARGET_MISSING')
          Path('/tmp/p05-browser-final.py').write_text(src.replace(marker, extra, 1))
          PY
          python3 -m py_compile /tmp/p05-browser-final.py
          echo 'P05_V1112_BROWSER_UPDATE_PROBE_READY=PASS'

      - name: Real browser gate for System and Updates workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_INSTALL_ROOT=build/vf-seo-php-release VF_BROWSER_E2E_PHP_PORT=18197 VF_BROWSER_E2E_DRIVER_PORT=9525 python3 /tmp/p05-browser-final.py
          echo 'P05_V1112_REAL_UPDATE_UI=PASS'

      - name: Real private common channel and credential gate
        env:
          P05_TEST_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          php scripts/php-common-updater-smoke.php
          echo 'P05_V1112_REAL_PRIVATE_CHANNEL=PASS'

      - name: Source scope and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          if [ -f scripts/security-gate.mjs ]; then
            npm run dependency:gate
            npm audit --audit-level=high
            npm run security:gate
          fi
          echo 'P05_V1112_SOURCE_SECURITY=PASS'

      - name: Seal Final Exact Source Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.1.12'
          echo 'P05_V1112_FINAL_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_VERSION=1.1.12'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
