name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

      - name: Checkout core-agent exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-agent
          ref: 9d45e2aebfaa88e44308058d15dffefb0f7b6ae5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: verify/core-agent-source

      - name: Verify core-agent exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C verify/core-agent-source rev-parse HEAD)"
          test "$actual" = "9d45e2aebfaa88e44308058d15dffefb0f7b6ae5"
          echo "CORE_AGENT_P03_ROUTE_SOURCE=$actual"

      - name: Run core-agent machine verification
        working-directory: verify/core-agent-source
        run: python scripts/verify.py

      - name: Verify retired P03 route contract
        working-directory: verify/core-agent-source
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'PY'
          from core_agent.profiles.vf.runtime_entry import requires_vf_runtime_activation

          for project_id in ("P01", "P02", "P04", "P05", "P06"):
              assert requires_vf_runtime_activation(f"{project_id}，继续开发。"), project_id
          assert not requires_vf_runtime_activation("P03，继续开发。")
          assert requires_vf_runtime_activation("VF Runtime：检查 P03 历史状态")
          print("CORE_AGENT_P03_RUNTIME_ROUTE_MACHINE=PASS")
          PY
