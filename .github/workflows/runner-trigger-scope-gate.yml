name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - '.github/workflows/p01-pr-probe.yml'
      - '.github/workflows/p01-22121-browser-gate.yml'
      - '.github/workflows/p01-22121-final-source-gate.yml'
      - '.github/workflows/p02-v2516-final-candidate-verify.yml'
      - '.github/workflows/p02-v2516-manifest-reseal.yml'
      - '.github/workflows/p02-v2516-production-readiness.yml'
      - '.github/workflows/p02-v2517-production-readiness.yml'
      - '.github/workflows/p02-v2517-source-manifest-reseal.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v
