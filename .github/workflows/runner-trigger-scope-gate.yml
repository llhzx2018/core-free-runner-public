name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runner-trigger-scope-gate.yml'
      - 'scripts/p01-v24716-navigation-ux-round3-release-wrapper.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01_v24716_navigation_ux_round3_release_gate:
    if: github.event_name == 'pull_request' && github.head_ref == 'temp/p01-v24716-navigation-ux-round3-release-20260919'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout temporary release lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact V2.47.15 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: f953988b4001f04b36c027168a815d80ae3b5fb7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: target

      - name: Checkout exact V2.47.14 release baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 421e7b5df1e48db768b39470fc99580330a07c0f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout previous release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-v24714-navigation-row-release-gate-20260918
          persist-credentials: false
          fetch-depth: 1
          path: old-gate

      - name: Checkout previous release build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 969d023423703b560947b7597a7f77e73e5c53bc
          persist-credentials: false
          fetch-depth: 1
          path: old-harness

      - name: Checkout proven Atomic primitive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact source identity and PHP/JS syntax
        shell: bash
        run: |
          test "$(cat target/VERSION)" = "2.47.15"
          test "$(cat target/src/VERSION.txt)" = "2.47.15"
          grep -Fq "define('VF_VERSION', '2.47.15');" target/src/app/bootstrap.php
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v24715-php-lint.txt
          node --check target/src/assets/workspace.js

      - name: Run V2.47.15 formal release gate
        shell: bash
        working-directory: runner
        env:
          TARGET_ROOT: ../target
          BASELINE_ROOT: ../baseline
          OLD_HARNESS_ROOT: ../old-harness
          PROVEN_ROOT: ../proven
          OLD_GATE_ROOT: ../old-gate
        run: bash scripts/p01-v24716-navigation-ux-round3-release-wrapper.sh

      - name: Upload V2.47.15 gate assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24715-navigation-ux-round2-${{ github.run_id }}
          path: |
            /tmp/p01-v24715-navigation-round2/VF-Start-V2.47.15-FULL.zip
            /tmp/p01-v24715-navigation-round2/VF-Start-V2.47.15-FULL.zip.sha256
            /tmp/p01-v24715-navigation-round2/VF_Start_V2.47.15_UPDATE.zip
            /tmp/p01-v24715-navigation-round2/VF_Start_V2.47.15_UPDATE.zip.sha256
            /tmp/p01-v24715-navigation-round2/P01.json
            /tmp/p01-v24715-navigation-round2/SHA256SUMS.txt
            /tmp/p01-v24715-navigation-round2/R15_GATE_RECEIPT.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish VF Start V2.47.15 Formal Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p01-v24715-navigation-round2
          REPO=llhzx2018/vf-start
          TAG=v2.47.15
          SOURCE=abe82d469c24b8f1d5f8d4081800b4abfadc6148
          TREE=6428100224e12ce89463dfecb12bebd42a9df8f6

          main_sha=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          main_tree=$(gh api "repos/$REPO/git/commits/$main_sha" --jq '.tree.sha')
          test "$main_tree" = "$TREE"
          main_version=$(gh api "repos/$REPO/contents/VERSION?ref=main" --jq '.content' | base64 -d | tr -d '\r\n ')
          test "$main_version" = "2.47.15"

          test "$(sha256sum "$OUT/VF-Start-V2.47.15-FULL.zip" | awk '{print $1}')" = "7518077782e719c4b9ee9189271f9ab3afd22cc784f002e4cc7222c8cbef81d1"
          test "$(sha256sum "$OUT/VF_Start_V2.47.15_UPDATE.zip" | awk '{print $1}')" = "0ec7cbc11fb873e2850e4f31e93335abc7c4f531296b05d94e3a86cbecf4bb09"
          grep -Fx 'P01_V24715_NAVIGATION_UX_ROUND2_RELEASE_GATE=PASS' "$OUT/R15_GATE_RECEIPT.txt"

          cat > /tmp/p01-v24715-release-notes.md <<EOF
          VF Start V2.47.15 · Navigation UX Round 2.

          Exact Formal Source: $SOURCE
          Exact Source Tree: $TREE
          Main alignment at publish: $main_sha (same exact tree)
          Validated direct upgrade: V2.47.14 → V2.47.15
          Schema: 2026090401 → 2026090401
          Migration: NONE

          Changes:
          - Navigation resource search now supports multi-term queries across the established searchable fields.
          - Active search/category/scope/kind context is visible and directly clearable.
          - Pagination lands back on the result list instead of losing place.
          - Exact-URL scroll state is preserved for normal navigation/back continuity.

          Machine proof: Public Runner $GITHUB_RUN_ID PASS.
          - Clean FULL install / admin login / setup lock PASS
          - V2.47.14 → V2.47.15 Atomic update PASS
          - Persistent business data preserved
          - Managed update credential preserved with 0600 mode
          - Runtime tamper rejection / rollback / interruption recovery / global barrier PASS
          - Multi-term search / clearable context / pagination anchor / scroll return regressions PASS
          - Deterministic FULL / UPDATE package identity PASS

          FULL sha256: 7518077782e719c4b9ee9189271f9ab3afd22cc784f002e4cc7222c8cbef81d1
          UPDATE sha256: 0ec7cbc11fb873e2850e4f31e93335abc7c4f531296b05d94e3a86cbecf4bb09

          Publishing this release does not update Production automatically.
          EOF
          sed -i 's/^          //' /tmp/p01-v24715-release-notes.md

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving existing release unchanged for readback validation."
            exit 0
          fi

          gh release create "$TAG"             "$OUT/VF-Start-V2.47.15-FULL.zip"             "$OUT/VF-Start-V2.47.15-FULL.zip.sha256"             "$OUT/VF_Start_V2.47.15_UPDATE.zip"             "$OUT/VF_Start_V2.47.15_UPDATE.zip.sha256"             "$OUT/SHA256SUMS.txt"             --repo "$REPO"             --target "$SOURCE"             --title "VF Start V2.47.15"             --notes-file /tmp/p01-v24715-release-notes.md
