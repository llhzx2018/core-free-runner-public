name: Public Runner Trigger Scope Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - 'scripts/check_runner_trigger_scope.py'
      - 'tests/test_runner_trigger_scope.py'
      - 'scripts/check_estate_anti_drift.py'
      - 'tests/test_estate_anti_drift.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify trigger quarantine
        run: python scripts/check_runner_trigger_scope.py --inventory

      - name: Run trigger scope regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify Git Estate anti-drift
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: python scripts/check_estate_anti_drift.py --live

      - name: Checkout Public Runner base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 5a23cc8f64a76059b89cb3e0c6d64ce08c840a3d
          persist-credentials: false
          path: verify/public-base

      - name: Checkout Public Runner exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: a36a2765710851c1a5b47d2ff988f7a245ef9677
          persist-credentials: false
          path: verify/public-source

      - name: Checkout Private Runner base
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 33f8b0320555492a3ad251699bd0ece0a690fde7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/private-base

      - name: Checkout Private Runner exact source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-private
          ref: 9ff617934c5ba513de7ddf225fc783794d8c539a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: verify/private-source

      - name: Verify exact AGENTS-only deltas and entry contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          cases = [
              (
                  "PUBLIC",
                  Path("verify/public-base"),
                  Path("verify/public-source"),
                  "a36a2765710851c1a5b47d2ff988f7a245ef9677",
                  [
                      "Public-safe GitHub Hosted Runner + Evidence",
                      "DELETED / TOMBSTONE / MIGRATION PROVENANCE ONLY",
                      "CLOSE WITHOUT MERGE",
                      "AI 不能自签 Machine PASS",
                      "禁止 Force Push",
                      "直接把一次性项目验证写入 main",
                  ],
              ),
              (
                  "PRIVATE",
                  Path("verify/private-base"),
                  Path("verify/private-source"),
                  "9ff617934c5ba513de7ddf225fc783794d8c539a",
                  [
                      "Private Test Input + Private Evidence + Controlled Sandbox",
                      "DELETED / TOMBSTONE / MIGRATION PROVENANCE ONLY",
                      "不是 Product Canonical Source",
                      "AI 不能自签 Machine PASS",
                      "禁止 Force Push",
                      "无 Gate 直接写 main",
                  ],
              ),
          ]

          def tree(root: Path):
              out = {}
              for p in root.rglob("*"):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  if rel.startswith(".git/") or rel == "AGENTS.md":
                      continue
                  out[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out

          for name, base, source, expected_sha, required_markers in cases:
              actual = subprocess.check_output(
                  ["git", "-C", str(source), "rev-parse", "HEAD"], text=True
              ).strip()
              assert actual == expected_sha, f"{name}: exact source drift {actual}"
              assert not (base / "AGENTS.md").exists(), f"{name}: AGENTS already existed in base"
              assert (source / "AGENTS.md").is_file(), f"{name}: AGENTS missing in source"
              assert tree(base) == tree(source), f"{name}: non-AGENTS source drift"
              text = (source / "AGENTS.md").read_text(encoding="utf-8")
              for marker in required_markers:
                  assert marker in text, f"{name}: missing marker: {marker}"
              assert "core-test-runner` = `LEGACY / RETIRED" not in text, f"{name}: legacy runner route remains"
              assert "第三套长期 Runner" in text, f"{name}: third-runner prohibition missing"
              print(f"{name}_RUNNER_AGENTS_ENTRY=PASS")

          print("RUNNER_AGENTS_ENTRY_MACHINE=PASS")
          PY
