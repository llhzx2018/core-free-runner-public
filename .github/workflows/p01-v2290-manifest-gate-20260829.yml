name: P01 V2.29 Manifest Gate
on:
  push:
    branches: [task/p01-v2290-manifest-gate-20260829]
    paths:
      - .github/workflows/p01-v2290-manifest-gate-20260829.yml
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MANIFEST_HEAD: 0a068b8a771d72083a96454cfcbdf89805ddeb58
      MANIFEST_BASE: 0efeff737acd05b593e69a5ef347540d4e4fc76f
      FORMAL_SOURCE: aa9070bb810064df2e965a793b999ac8bde5734e
      FORMAL_TREE: a4922cbd297390500d5fbbf053c0072d1dd6360f
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 0a068b8a771d72083a96454cfcbdf89805ddeb58
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: aa9070bb810064df2e965a793b999ac8bde5734e
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact manifest and remote Release Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$MANIFEST_HEAD"
          test "$(git -C updates merge-base "$MANIFEST_BASE" "$MANIFEST_HEAD")" = "$MANIFEST_BASE"
          test "$(git -C updates diff --name-only "$MANIFEST_BASE" "$MANIFEST_HEAD")" = 'projects/P01.json'
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.28.0" and .target_version=="2.29.0" and .update_type=="ATOMIC" and
            .from_versions==["2.28.0"] and
            .schema_from=="2026082801" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.29.0" and
            .release_id==378779919 and
            .product_identity=="aa9070bb810064df2e965a793b999ac8bde5734e" and
            (has("release_identity")|not) and
            .asset_name=="VF_Start_V2.29.0_UPDATE.zip" and
            .asset_bytes==1319081 and
            .asset_sha256=="40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-28T21:44:15Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          php -r 'require "product/src/app/CoreUpdates/UpdateCore.php"; $m=json_decode(file_get_contents("updates/projects/P01.json"),true,128,JSON_THROW_ON_ERROR); $c=new CoreUpdates\UpdateCore("P01","APP"); $c->validateManifest($m); $r=$c->check("2.28.0","2026082801",$m); if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,json_encode($r)."\n"); exit(2);} echo "P01_V229_UPDATECORE_COMPAT=PASS\n";'
          test "$(git -C product rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git -C product rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git -C product ls-remote origin 'refs/tags/v2.29.0^{}' | awk '{print $1}')" = "$FORMAL_SOURCE"
          R=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.29.0)
          test "$(jq -r .id <<<"$R")" = 378779919
          test "$(jq -r .tag_name <<<"$R")" = v2.29.0
          test "$(jq -r .draft <<<"$R")" = false
          test "$(jq -r .prerelease <<<"$R")" = false
          test "$(jq -r .published_at <<<"$R")" = '2026-08-28T21:44:15Z'
          A=$(jq -c '.assets[]|select(.name=="VF_Start_V2.29.0_UPDATE.zip")' <<<"$R")
          test -n "$A"
          test "$(jq -r .size <<<"$A")" = 1319081
          test "$(jq -r .digest <<<"$A")" = 'sha256:40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1'
          rm -rf /tmp/remote && mkdir -p /tmp/remote
          gh release download v2.29.0 -R llhzx2018/vf-start -p VF_Start_V2.29.0_UPDATE.zip -D /tmp/remote
          test "$(stat -c%s /tmp/remote/VF_Start_V2.29.0_UPDATE.zip)" = 1319081
          test "$(sha256sum /tmp/remote/VF_Start_V2.29.0_UPDATE.zip | awk '{print $1}')" = 40505719b8dcbaa4a47437ba2e222172d8551ca206f3a8a5e8f11e951d3912a1
          test "$(unzip -Z1 /tmp/remote/VF_Start_V2.29.0_UPDATE.zip | wc -l)" = 1
          unzip -Z1 /tmp/remote/VF_Start_V2.29.0_UPDATE.zip | grep -Fx repair-v2.29.0.php >/dev/null
          unzip -p /tmp/remote/VF_Start_V2.29.0_UPDATE.zip repair-v2.29.0.php >/tmp/repair-v2.29.0.php
          php -l /tmp/repair-v2.29.0.php >/dev/null
          echo P01_V229_MANIFEST_EXACT=PASS
          echo P01_V229_REMOTE_RELEASE_ASSET=PASS
          echo P01_V229_MANIFEST_READY_TO_MERGE=YES
          echo OWNER_PRODUCTION_WRITE=NO
