name: S01 R9 225-100 exact release asset preflight
on:
  push:
    branches: [release/s01-r9-candidates-225-100-20261104]
    paths: ['.github/workflows/s01-r9-225-100-package-proof-20261104.yml']
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 93e1fccec37f7b608a18c1d49711e9dc563bb973
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 20f5ce58567c5380843229c6e737a7d1f0a498e7
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: m3u8
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'zip,mysqli,mbstring', coverage: none}
      - name: Verify exact approved candidate and independent hard machine passes
        env: {GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = 93e1fccec37f7b608a18c1d49711e9dc563bb973
          test "$(git -C m3u8 rev-parse HEAD)" = 20f5ce58567c5380843229c6e737a7d1f0a498e7
          test "$(cat theme/VERSION)" = 1.35.225
          test "$(cat m3u8/VERSION)" = 1.25.100
          grep -Fq 'Version: 1.35.225' theme/src/style.css
          grep -Fq 'Version: 1.25.100' m3u8/src/vf-tool-m3u8.php
          grep -Fq "define('VF_TOOL_M3U8_VERSION', '1.25.100')" m3u8/src/vf-tool-m3u8.php
          test -n "$GH_TOKEN"
          for id in 41812379082 41818085522 41819104974 41822227084 41823115238 41615734900 41596347156 41626649638; do
            conclusion="$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)"
            test "$conclusion" = success || { echo "MACHINE_GATE_NOT_PASS:$id";exit 80; }
          done
          test "$(gh api repos/llhzx2018/vf-tools-theme/git/ref/heads/main --jq .object.sha)" = 93e1fccec37f7b608a18c1d49711e9dc563bb973
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/git/ref/heads/main --jq .object.sha)" = 20f5ce58567c5380843229c6e737a7d1f0a498e7
          find theme/src m3u8/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/s01-r9-php-lint.txt
          echo S01_R9_EXACT_SOURCE_ALL_REQUIRED_INDEPENDENT_RUNS=PASS
      - name: Old official ZIP hashes and 2 deterministic new runtime assets
        env: {GH_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/old"
          gh release download v1.35.224 -R llhzx2018/vf-tools-theme -p vf-tools-theme_V1.35.224.zip -D "$RUNNER_TEMP/old"
          gh release download v1.25.99 -R llhzx2018/vf-tools-m3u8 -p vf-tools-m3u8_V1.25.99.zip -D "$RUNNER_TEMP/old"
          echo "7d64ce96ac15c482b653666a54fd587437b8aa214a73eb82e6e6771eaa02a4de  $RUNNER_TEMP/old/vf-tools-theme_V1.35.224.zip" | sha256sum -c
          echo "7bd5c648fc1eb3513896404e8d433bc64044ce79928ddf7ed79f73b2fd2ba2a4  $RUNNER_TEMP/old/vf-tools-m3u8_V1.25.99.zip" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import os,io,hashlib,zipfile,json
          root=Path(os.environ['RUNNER_TEMP'])
          specs=[('theme','vf-tools-theme','1.35.225','vf-tools-theme_V1.35.224.zip','style.css'),('m3u8','vf-tool-m3u8','1.25.100','vf-tools-m3u8_V1.25.99.zip','vf-tool-m3u8.php')]
          for name,slug,version,old_asset,header in specs:
           source=Path(name)/'src'
           files=sorted((p for p in source.rglob('*') if p.is_file() and p.name!='PACKAGE_PROFILE.json'),key=lambda p:p.as_posix())
           assert len(files)>= (450 if name=='theme' else 560),len(files)
           assert not any(p.is_symlink() for p in files)
           def pack():
            buf=io.BytesIO()
            with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
             for p in files:
              rel=p.relative_to(source)
              assert '..' not in rel.parts
              info=zipfile.ZipInfo(str(PurePosixPath(slug)/rel.as_posix()),date_time=(1980,1,1,0,0,0))
              info.compress_type=zipfile.ZIP_DEFLATED
              info.external_attr=(p.stat().st_mode & 0o777)<<16
              z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
            return buf.getvalue()
           blob=pack()
           assert blob==pack()
           with zipfile.ZipFile(io.BytesIO(blob)) as z:
            assert z.testzip() is None and len(z.namelist())==len(files)
            assert 'Version: '+version in z.read(slug+'/'+header).decode()
            names=set(x.split('/',1)[1] for x in z.namelist())
           with zipfile.ZipFile(root/'old'/old_asset) as z:
            old=set(x.split('/',1)[1] for x in z.namelist() if '/' in x and not x.endswith('/'))
           print('S01_R9_ARCHIVE_FILE_DELTA',name,json.dumps({'old':len(old),'new':len(names),'added':sorted(names-old),'removed':sorted(old-names)},ensure_ascii=False))
           assert len(old-names)<=20 and len(names-old)<=70
           print('S01_R9_ASSET',name,'version='+version,'bytes='+str(len(blob)),'files='+str(len(files)),'sha256='+hashlib.sha256(blob).hexdigest())
           print('S01_R9_DOUBLE_BUILD_DETERMINISM=PASS',name)
          print('S01_R9_EXACT_ASSET_GATE=PASS')
          PY
      - name: Remove all transient private source and downloaded ZIP
        if: always()
        run: rm -rf theme m3u8 "$RUNNER_TEMP/old" /tmp/s01-r9-php-lint.txt
