name: P01 V2.47.364 Channel Exact Independent Gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p01-v247364-channel-exact-gate.yml'
permissions:
  contents: read
jobs:
  exact-channel:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-v247364-channel-exact-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact core-updates candidate manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 48a23271ce420db73e3c0e96d34a3df9a26d86a6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Validate exact P01 manifest, all manifests and native update core
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd channel
          test "$(git rev-parse HEAD)" = 48a23271ce420db73e3c0e96d34a3df9a26d86a6
          python3 scripts/check_manifest_contract.py > /tmp/channel-manifest-report.json
          jq -e '.status=="PASS"' /tmp/channel-manifest-report.json > /dev/null
          jq -e '.project_id=="P01" and .current_version=="2.47.363" and .target_version=="2.47.364" and
                  .update_type=="ATOMIC" and .from_versions==["2.47.363"] and
                  .release_tag=="v2.47.364" and .release_id==412286121 and
                  .product_identity=="c828e94d6fa890a1c61da7cb71078d3f209ce8b8" and
                  .asset_name=="VF_Start_V2.47.364_UPDATE.zip" and
                  .asset_bytes==2501507 and
                  .asset_sha256=="3bfae788b8db82bf120a379d0f8c0bfb5eedc5818ddcfadebc36989617819e04" and
                  .backup_required==true and .rollback_supported==true and
                  .schema_from==.schema_to' projects/P01.json >/dev/null
          echo P01_DISTRIBUTION_MANIFEST_EXACT=PASS
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/update-core-php-lint.txt
          php update-core/php/tests/run.php | tee /tmp/update-core-regression.txt
          echo P01_CHANNEL_UPDATE_CORE_REGRESSION=PASS
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.364 --jq '
            . as $r | ($r.assets[] | select(.name=="VF_Start_V2.47.364_UPDATE.zip")) as $a |
            ($r.id==412286121 and $a.size==2501507 and
              $a.digest=="sha256:3bfae788b8db82bf120a379d0f8c0bfb5eedc5818ddcfadebc36989617819e04")
          ' | grep -Fx true
          echo P01_CHANNEL_REMOTE_RELEASE_INTEGRITY=PASS
