name: P07 Care rc48 readable WordPress triage formal release
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-care-rc48-one-shot-release.yml'
permissions:
  contents: read
jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.title == 'release(P07): rc48 WordPress human security triage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout canonical verified Public main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact source, immutable runtime and 17 machine gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'c48b09772baa5fec2184ebdea4d5dc42c0ea2e12'
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release84'
          pkg='packages/p07-system-care/0.1.0-rc48'
          test "$(cat "$pkg/VERSION")" = '0.1.0-rc48'
          test "$(git hash-object "$pkg/MANIFEST.gitblob")" = 'a393740832147180791ea4a66b81630a3c052583'
          test "$(git hash-object "$pkg/lib/intrusion_evidence.py")" = '29091d5f2f1bb3374cee43d439a47b294dba0e77'
          (cd "$pkg" && while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc48"' installers/p07-toolbox.sh
          grep -Fq 'VF_NODE_EXPECTED="0.1.0-rc13"' installers/p07-toolbox.sh
          grep -Fq 'VPS_AUDIT_EXPECTED="V2.1.0"' installers/p07-toolbox.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release84"' installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc48'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='a393740832147180791ea4a66b81630a3c052583'" installers/p07-system-care.sh
          grep -Fq 'helper report --triage --page "$page"' "$pkg/intrusion-evidence.sh"
          grep -Fq 'helper report --limit 20' "$pkg/intrusion-evidence.sh"
          grep -Fq 'confirm_numeric' "$pkg/intrusion-evidence.sh"
          for id in 37769359860 37769359953 37769359881 37769359991 37769359747 37769359668 37769359883 37769359631 37769359731 37769359820 37769359609 37769359836 37769359746 37769359702 37769359637 37769359696 37769359817; do
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .head_sha)" = '139496ee4fd7235ccad5cf20c010a8e6ce122f14'
            test "$(gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$id" --jq .conclusion)" = success
          done
          echo P07_RC48_FORMAL_EXACT_GATES=PASS
      - name: Publish formal release and read back published tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          repo='llhzx2018/core-free-runner-public'
          tag='p07-v0.1.0-release84-care-rc48-wp-human-triage'
          target='c48b09772baa5fec2184ebdea4d5dc42c0ea2e12'
          if gh release view "$tag" -R "$repo" >/dev/null 2>&1; then
            test "$(gh release view "$tag" -R "$repo" --json targetCommitish --jq .targetCommitish)" = "$target"
          else
            gh release create "$tag" -R "$repo" --target "$target" \
              --title 'P07 · rc48 WordPress 文件变化人工判读与一屏明细' \
              --notes 'OWNER 实机指出 WordPress 完整异常页面出现大量重复 HTTP 请求和技术路径，无法判断什么才算真正有问题。本次保留全部原始文件事件、请求线索和机器可读 JSON，默认菜单4→6→5 改为面向普通站长的三类初步提示：上传目录 PHP/敏感配置变动优先排查；核心和插件文件变化需要对照升级记录核实；Wordfence 动态配置变化单独标注仍待核实。不把文件变化、IP 或日志关联断言为已经入侵。每页最多 7 条；N 下一页、P 上一页、R 主动查看原始日志、Enter 返回。保留原人工扫描、自动任务、历史记录、基线更新确认和所有安全阈值，绝不自动清除告警或信任变更。主菜单1/2/3/5与菜单4其他功能保持冻结。17/17 隔离 Machine Gates PASS，Production 手工升级和 OWNER 实机验收独立。' \
              --latest=false
          fi
          test "$(gh release view "$tag" -R "$repo" --json tagName --jq .tagName)" = "$tag"
          echo P07_RC48_FORMAL_RELEASE=PASS
