name: P01 Directory Action Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-directory-action-1594.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3,pdo_sqlite
          coverage: none
      - name: Validate exact P01 source contract
        shell: bash
        env:
          TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TOKEN"
          ROOT="$RUNNER_TEMP/p01-directory-1594"
          git clone -q --no-checkout "https://x-access-token:${TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach cd6b3324ef5f66d7d85dc89d0ae41ce1952872f0
          git -C "$ROOT" remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C "$ROOT" rev-parse HEAD)" = cd6b3324ef5f66d7d85dc89d0ae41ce1952872f0
          php -l "$ROOT/src/app/ChannelLibraryPage.php"
          node --check "$ROOT/src/assets/workspace.js"
          php "$ROOT/tests/unit/channels_directory_trash_action_contract.php"
          echo P01_DIRECTORY_TRASH_SOURCE_PASS
          rm -rf "$ROOT"
