name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-blog-count187-20261025]
    paths: ['.github/workflows/s01-blog-count187-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.187
  TARGET_SHA: 2823bc1b0a368094afc8589cb2c8437461f1f17d
  TARGET_TREE: 5ed39db23ac54fca9608dcde8884d8db48fe9ed0
  BASE_SHA: 8d0ef7363038d0f08a86e4fe510fd2133f4a451b
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2823bc1b0a368094afc8589cb2c8437461f1f17d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40160572782 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40160572782 --jq .head_sha)" = 28c3f2f8ae2821097a71d22e0a599e6e9b74a89e
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40160572782 --repo llhzx2018/core-free-runner-public --name s01-home-40160572782 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-blog-count187-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='33c7420d455eec3581da00697d8cc8c697bcdbd7'
          phases={phase:json.loads((r/(phase+'-blog-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(4 if phase in ['before','after'] else 1)
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  for phase in ['before','after']:assert (r/(phase+'-blog-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
                  a=json.loads((r/('before-blog-'+lang+'-'+str(width)+'.json')).read_text());b=json.loads((r/('after-blog-'+lang+'-'+str(width)+'.json')).read_text())
                  assert a['version']=='1.35.186' and b['version']=='1.35.187'
                  assert not a['overflow'] and not b['overflow']
                  for key in ['h1','canonical','hreflang','shell','container','hero']:assert a[key]==b[key]
                  assert len(a['cards'])==7 and len(b['cards'])==9 and a['cards']==b['cards'][:7]
                  assert '1–9' in a['summary'] and '14' in a['summary']
                  assert '1–9' in b['summary'] and '12' in b['summary']
              for kind in ['empty','last']:assert (r/('blog-'+kind+'-'+lang+'.png')).stat().st_size>1000
          flows=phases['after']['interactions'];assert len(flows)==4
          for item in flows:
              assert item['language'] in ['en','zh']
              assert all(v=='PASS' for k,v in item.items() if k!='language')
          native=json.loads((r/'native-main-query.json').read_text());assert native['status']=='PASS'
          for lang in ['en','zh']:assert all(v=='PASS' for v in native['results'][lang].values())
          probe=native['results']['bounded_probe'];assert probe['status']=='PASS' and probe['max_batch_rows']<=100 and probe['eligible_total']==217
          assert native['results']['archive_compatibility']=='PASS'
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='464f4c42a0c9118234e08dbac26f54e15279e2e86b52758800239d8b87e98c16' and new['bytes']==1991662
          coverage=json.loads(pathlib.Path('control/lanes/s01-blog-count187-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='33c7420d455eec3581da00697d8cc8c697bcdbd7' and coverage['tree']=='5ed39db23ac54fca9608dcde8884d8db48fe9ed0'
          assert coverage['owner_preview_runtime']=='POST_RELEASE_REQUIRED'
          assert coverage['release_mode']=='OWNER_DIRECT_RELEASE'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40160572782'
          coverage['merged_source']='2823bc1b0a368094afc8589cb2c8437461f1f17d'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.187 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.187 provider/vf-tools-theme_V1.35.187.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.187' --notes '修复Owner正式站博客截图中提示1–9篇却仅显示7篇的计数/分页不一致。内部查询和原生博客主查询复用既有URL Owner只读识别，在SQL计数和分页前排除旧跳转壳；既有索引slug排除同样提前，博客仅累计实际输出卡片。不改186已确认版式、CSS/JS、文章/URL/SEO/人工记录和Provider/升级机制。实际WordPress中英文1440/1024复现旧问题，验证9+3真实首尾页、搜索分页/零结果/无脚本、原生主查询/既有限定范围/205候选分批/归档兼容；干净安装、186升级187、回退与重复安装及保护数据验证通过。476运行文件；M3U8保持1.25.94。Production由Owner手工升级后最终截图复验，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.187 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.187 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.187 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.187.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.187.zip remote/vf-tools-theme_V1.35.187.zip
          echo '464f4c42a0c9118234e08dbac26f54e15279e2e86b52758800239d8b87e98c16  remote/vf-tools-theme_V1.35.187.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.187.zip)" = 1991662
          gh release view v1.35.187 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
