name: P01 V2.36.3 Owner Production Main Sync
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-owner-production-main-sync-20260901.yml]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAIN_BASE: e25f028044523b46bb3f75c26b19410e9d2b3f9c
      DEVELOP_CLOSURE: c7a1c6e9ab6321ec07bc00a3e778661faaefb4ae
      BRANCH: docs/p01-v2363-owner-production-main-sync-20260901
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
    steps:
      - name: Checkout main sync branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2363-owner-production-main-sync-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Copy exact develop closure Authority snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_BASE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          test "$(git ls-remote origin refs/heads/develop | cut -f1)" = "$DEVELOP_CLOSURE"
          git fetch origin "$DEVELOP_CLOSURE" --quiet
          for f in VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            git checkout "$DEVELOP_CLOSURE" -- "$f"
          done
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          test -z "$(git diff --cached --name-only -- src)"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e '.production_version=="2.36.3" and .production_release.version=="2.36.3" and .production_release.production_closure=="PASS"' VF_PROJECT.json >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'docs(P01): sync V2.36.3 Owner Production closure to main'
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git push origin HEAD:"$BRANCH"
      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin "$BRANCH" --quiet
          test "$(git rev-parse origin/$BRANCH:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$MAIN_BASE" origin/$BRANCH | sort)" = $'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(git rev-parse origin/$BRANCH:VF_PROJECT.json)" = "$(git rev-parse $DEVELOP_CLOSURE:VF_PROJECT.json)"
