name: P05 Site Scoped Pages Clean App Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-site-pages-a186aef.yml'
permissions:
  contents: read
jobs:
  p05-site-pages:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-site-pages-a186aef-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_EXACT_SOURCE: a186aef04b1058b089784bc66a422983f2bd47b7
      P05_BASE_MAIN: 7c70b1a179dbe027ed9b5b04beb23fca78138f33
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- '*.ts' '*.tsx' '*.css' '*.mjs' '*.php' '*.json' '*.yml' '*.yaml'
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/p05-changed.txt
          printf '%s\n' \
            'package.json' \
            'php/src/ProductPagesService.php' \
            'php/src/RuntimeProductRoutesTrait.php' \
            'php/src/bootstrap.php' \
            'php/tests/product-pages-parity.php' \
            'scripts/p05-product-parity-gate.mjs' \
            'src/client/App.tsx' \
            'src/server/index.ts' \
            'src/server/product-pages.ts' \
            'tests/unit/product-site-pages.test.ts' | sort > /tmp/p05-expected.txt
          diff -u /tmp/p05-expected.txt /tmp/p05-changed.txt
          git diff "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" -- src/client/App.tsx > /tmp/app.diff
          test "$(grep -c '^[-+]  useEffect' /tmp/app.diff)" -eq 2
          test "$(grep -c '^@@' /tmp/app.diff)" -eq 1
          echo 'P05_SITE_PAGES_CLEAN_APP_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_SITE_PAGES_CLEAN_APP_ENGINEERING=PASS'
      - name: Verify site-scoped Pages contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test tests/unit/product-site-pages.test.ts
          PHP_PARITY_LOG="$(mktemp)"
          npm run test:php-product-parity | tee "$PHP_PARITY_LOG"
          grep -F 'P05_PHP_SITE_SCOPED_PAGES_105=PASS' "$PHP_PARITY_LOG"
          grep -F 'P05_PHP_SITE_SCOPED_PAGES_NO_TRUNCATION=PASS' "$PHP_PARITY_LOG"
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          MAIN_CHUNK="${MAIN_RECORD#* }"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK=$(basename "$MAIN_CHUNK")"
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_SITE_SCOPED_PAGES_REQUEST_CONTRACT=1'
          echo 'P05_SITE_SCOPED_PAGES_105_VALUE=PASS'
      - name: Formal PHP staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run build:php-release
          npm run php:release:gate
          grep -R -F '/api/product/pages/' build/vf-seo-php-release/assets >/dev/null
          find build/vf-seo-php-release -type f -name 'ProductPagesService.php' -print -quit | grep -q .
          echo 'P05_SITE_SCOPED_PAGES_PHP_RELEASE_STAGING=PASS'
      - name: Source and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_SITE_SCOPED_PAGES_SOURCE_SECURITY=PASS'
      - name: Seal exact source result
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          echo 'P05_SITE_SCOPED_PAGES_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'