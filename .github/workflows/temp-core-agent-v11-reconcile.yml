name: TEMP core-agent V1.1 Authority Reconciliation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-core-agent-v11-reconcile.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_AGENT_SHA: e4bec34bb73debcc15cb06996621f1dcf9b5f576
      GOV_DOC_SHA: 9eb8a65490dda0c98b2b3c6807ad0bc2422d699c
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-agent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core-agent

      - name: Checkout exact gov-doc Current Authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_DOC_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-doc

      - name: Verify exact identities
        shell: bash
        run: |
          test "$(git -C core-agent rev-parse HEAD)" = "$CORE_AGENT_SHA"
          test "$(git -C gov-doc rev-parse HEAD)" = "$GOV_DOC_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Full core-agent verification
        working-directory: core-agent
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SHA }}
        run: python scripts/verify.py

      - name: Focused lifecycle and version tests
        working-directory: core-agent
        run: |
          python -m unittest tests.test_vf_runtime_entry -v
          python -m unittest tests.test_version_consistency -v

      - name: Verify V1.1 authority reconciliation
        shell: bash
        run: |
          test "$(cat core-agent/VERSION)" = "1.1.0"
          grep -F 'version = "1.1.0"' core-agent/pyproject.toml
          grep -F '__version__ = "1.1.0"' core-agent/src/core_agent/__init__.py
          grep -F 'Runtime Source：`1.1.0`' core-agent/docs/authority/CURRENT.md
          grep -F 'Runtime Source Version：`1.1.0`' core-agent/docs/authority/SSOT.md
          grep -F 'Current Runtime Source Version：`1.1.0`' core-agent/docs/authority/INFRASTRUCTURE_CONTRACT.md
          grep -F 'Project Syntax != Current Lifecycle Authority' core-agent/docs/architecture/V1.1_CURRENT.md
          grep -F 'Project Syntax != Current Lifecycle Authority' core-agent/AGENTS.md
          grep -F 'Development System Master Current' gov-doc/CURRENT.md
          grep -F 'P03 · VF Forge = RETIRED / HISTORICAL / DO NOT ROUTE NEW WORK' gov-doc/CURRENT.md
          grep -F 'P06 · VF Press = RETIRED / HISTORICAL / DO NOT ROUTE NEW WORK' gov-doc/CURRENT.md

      - name: Verify no product or distribution scope
        shell: bash
        run: |
          test ! -e core-agent/VF_PROJECT.json
          echo 'CORE_AGENT_V11_AUTHORITY_RECONCILIATION=PASS'
