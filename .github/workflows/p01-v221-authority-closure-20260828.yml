ction/Real-use 仍需 Owner 真机 Evidence。\n\n## 8. Current Boundary\n\n```text\nFormal Release Version:       V2.22.1\nRelease Source:               a31bafac5efc97efa537b645f03bc99ed0ea5b43\nRelease Tree:                 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59\nRelease Schema:               2026082801\nHotfix Machine Gate:          PASS / 33144353246\nPublication:                  PASS / 33144772489\nGitHub Release ID:            378275999\nOnline Alias SHA:             b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466\ncore-updates target:          2.22.1\nOwner Production Runtime:     V2.21.25\nProduction Upgrade V2.22.1:  OUT / NOT EXECUTED\n```\n''',encoding='utf-8',newline='\n')

