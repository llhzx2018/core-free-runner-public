          expected=$(printf '%s\n' CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/RPD.md docs/authority/SSOT.md docs/evidence/P01_V2.22.1_ONLINE_HOTFIX_RELEASE_20260828.md src/README.md | sort)
