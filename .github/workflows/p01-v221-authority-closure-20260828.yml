name: P01 V2.22.1 Release Authority Closure

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v221-authority-closure-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  DOC_BRANCH: docs/p01-v2.22.1-release-closure-20260828
  BASE_MAIN: 203d3c1236624ab846555167d217978694e11e88
  RELEASE_SOURCE: a31bafac5efc97efa537b645f03bc99ed0ea5b43
  RELEASE_TREE: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59
  RELEASE_ID: '378275999'
  PUBLICATION_RUN: '33144772489'
  HOTFIX_GATE_RUN: '33144353246'
  CORE_UPDATES_COMMIT: 9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1
  LEGACY_SHA: b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466
  LEGACY_BYTES: '1170499'

jobs:
  close-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact docs closure branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product checkout -q "$DOC_BRANCH"
          test "$(git -C product rev-parse HEAD)" = "$BASE_MAIN"
          test "$(git -C product rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          echo P01_V221_DOC_BASE=PASS

      - name: Update current authority documents only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('product')

          # Machine-readable current state.
          p=root/'VF_PROJECT.json'; d=json.loads(p.read_text(encoding='utf-8'))
          old=d.get('formal_release',{})
          d['status']='V2.22.1 FORMAL RELEASE / V2.21.25 PRODUCTION RUNTIME'
          d['working_version']='2.22.1'
          d['target_release_version']='2.22.1'
          d['current_phase']='V2.22.1 FORMAL RELEASE PUBLISHED / OWNER PRODUCTION UPGRADE PENDING'
          d['previous_formal_release']=old
          d['formal_release']={
            'version':'2.22.1','tag':'v2.22.1','release_id':378275999,
            'release_source':'a31bafac5efc97efa537b645f03bc99ed0ea5b43',
            'release_tree':'76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59',
            'main_merge':'203d3c1236624ab846555167d217978694e11e88',
            'schema_version':'2026082801','source_schema_version':'2026080902',
            'hotfix_candidate_gate':33144353246,'publication_run':33144772489,
            'core_updates_target':'2.22.1','core_updates_commit':'9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1',
            'online_updater':{
              'status':'PASS / PUBLISHED','asset_name':'VF_Start_V2.22.1_UPDATE.zip',
              'asset_bytes':1170499,'asset_sha256':'b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466',
              'inner_repair_name':'repair-v2.22.1.php','freshness_advance_from_remembered_release':'2.22.0',
              'anti_silent_replacement_weakened':False
            },
            'status':'PASS'
          }
          cc=d.get('current_change',{})
          cc.update({
            'release_source':'a31bafac5efc97efa537b645f03bc99ed0ea5b43',
            'release_tree':'76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59',
            'release_version':'2.22.1','hotfix_candidate_gate_run':33144353246,
            'publication_run':33144772489,'core_updates_commit':'9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1',
            'online_updater_fix':'PASS / V2.22.1 PUBLISHED',
            'v22125_current_online_updater_prepare_install':'PASS / remembered V2.22.0 -> V2.22.1',
            'production_upgrade':'NOT EXECUTED','production_write':False
          })
          d['current_change']=cc
          auth=d.get('authority',{})
          auth['hotfix_release_evidence']='docs/evidence/P01_V2.22.1_ONLINE_HOTFIX_RELEASE_20260828.md'
          d['authority']=auth
          d['candidate_version']='2.22.1'
          d['candidate_schema_version']='2026082801'
          d['candidate_state']='PROMOTED / FORMAL RELEASE PUBLISHED'
          d['current_authority']='v2.22.1@a31bafac5efc97efa537b645f03bc99ed0ea5b43 / publication 33144772489 PASS / core-updates 2.22.1; owner Production Runtime remains V2.21.25 until separate upgrade evidence'
          d['next_action']='OWNER CHECK UPDATE -> PRODUCTION UPGRADE V2.21.25 -> V2.22.1 -> RUNTIME/SCHEMA/SURFACE READBACK -> PRODUCTION CLOSURE'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')

          def replace_once(path,old,new,label):
              q=root/path; s=q.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              q.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')

          # Root README current release truth.
          replace_once('README.md',
          '''- Formal Release：`V2.22.0` / Tag `v2.22.0`\n- Release Source：`2c159b4b7ecfc03e79eff2e6103f7e2c768ded08`\n- Release Schema：`2026082801`\n- GitHub Release ID：`378266367`\n- Main Promotion Merge：`591efb7b1b15602fd9ce3c9a9a4c4620f29f33a9`\n- `core-updates` Target：`2.22.0`\n- Owner Production Runtime：`V2.21.25`\n- Owner Production Schema：`2026080902`\n- V2.22.0 Production Upgrade：`NOT EXECUTED`\n- Browser Helper：`1.6.4`\n\nV2.22.0 已正式发布；**正式发布与真实服务器升级是两个 Gate**。在 Owner Production Upgrade 完成前，不能把真实运行版本写成 V2.22.0。''',
          '''- Formal Release：`V2.22.1` / Tag `v2.22.1`\n- Release Source：`a31bafac5efc97efa537b645f03bc99ed0ea5b43`\n- Release Tree：`76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59`\n- Release Schema：`2026082801`\n- GitHub Release ID：`378275999`\n- Release Merge：`203d3c1236624ab846555167d217978694e11e88`\n- Publication Runner：`33144772489` / PASS\n- `core-updates` Target：`2.22.1`\n- Owner Production Runtime：`V2.21.25`\n- Owner Production Schema：`2026080902`\n- V2.22.1 Production Upgrade：`NOT EXECUTED`\n- Browser Helper：`1.6.4`\n\nV2.22.1 已正式发布；它不改变 V2.22.0 Multi-Surface 功能或 Schema，只通过正常版本前进解决“同一正式版本 Manifest 不允许静默替换”的在线升级安全边界。**正式发布与真实服务器升级仍是两个 Gate**。''','README current release')
          replace_once('README.md','Tag `v2.22.0` 锁定正式 Release Source；','Tag `v2.22.1` 锁定当前正式 Hotfix Release Source；V2.22.0 继续保留为 Multi-Surface 首个正式版本的历史 Release；','README tag')
          replace_once('README.md','V2.22.0 已通过 Release Exact Source、Formal Artifact、Main Promotion 与 Publication Gate；','V2.22.0 Multi-Surface 原始 Release Gates 已 PASS；V2.22.1 Freshness Hotfix Gate `33144353246` 与 Publication `33144772489` 也已 PASS；','README gates')

          # Docs index.
          replace_once('docs/README.md','这是 VF Start 的中文文档总入口。P01 已于 2026-08-28 正式发布 **V2.22.0 Multi-Surface**：同一数据底座提供 Start / Channels / Watch 多个独立使用界面。','这是 VF Start 的中文文档总入口。P01 当前正式版本为 **V2.22.1**：产品功能仍是 V2.22.0 引入的 Multi-Surface，V2.22.1 仅处理 Online Updater Freshness / Manifest 不可静默替换的版本边界。','docs index intro')
          replace_once('docs/README.md','''## V2.22.0 Multi-Surface Truth\n\n```text\nFormal Release: V2.22.0 / PASS\nRelease Schema: 2026082801\nOwner Production Runtime: V2.21.25\nOwner Production Schema: 2026080902\nProduction Upgrade V2.22.0: NOT EXECUTED\n```''','''## Current Release / Multi-Surface Truth\n\n```text\nFormal Release: V2.22.1 / PASS\nProduct Feature Baseline: V2.22.0 Multi-Surface\nRelease Schema: 2026082801\nOwner Production Runtime: V2.21.25\nOwner Production Schema: 2026080902\nProduction Upgrade V2.22.1: NOT EXECUTED\n```''','docs index truth')
          replace_once('docs/README.md','Tag `v2.22.0` = V2.22.0 Formal Release Exact Source；','Tag `v2.22.1` = 当前 Formal Release Hotfix Exact Source；Tag `v2.22.0` 保留 Multi-Surface 首发历史；','docs index tag')

          # Runtime source README current truth only; migration name remains historical V2.22.0.
          replace_once('src/README.md','本目录是 P01 · VF Start 的正式 PHP/SQLite 应用源码。V2.22.0 Multi-Surface 已正式发布；Owner Production Runtime 尚未执行本次升级。','本目录是 P01 · VF Start 的正式 PHP/SQLite 应用源码。当前 Formal Release 为 V2.22.1；它沿用 V2.22.0 Multi-Surface 功能与 Schema，Owner Production Runtime 尚未执行本次升级。','src intro')
          replace_once('src/README.md','''Formal Release Version: 2.22.0\nFormal Release Schema:  2026082801\nRelease Source:         2c159b4b7ecfc03e79eff2e6103f7e2c768ded08''','''Formal Release Version: 2.22.1\nFormal Release Schema:  2026082801\nRelease Source:         a31bafac5efc97efa537b645f03bc99ed0ea5b43''','src truth')
          replace_once('src/README.md','V2.22.0 Formal Artifact 已真实验证：','V2.22.0 Formal Artifact + V2.22.1 Freshness Hotfix 已真实验证：','src validation intro')
          replace_once('src/README.md','V2.21.25 / Schema `2026080902` → V2.22.0 / Schema `2026082801`；','V2.21.25 / Schema `2026080902` → V2.22.1 / Schema `2026082801`，并覆盖“本机已记住 V2.22.0 Manifest”的真实 Freshness 场景；','src upgrade')

          # RPD is product definition: only advance delivery status, do not rewrite product history.
          replace_once('docs/authority/RPD.md','''→ OWNER Real-use UI Review\n→ 独立 Release / Production Gate（未来）\n```\n\n当前开发完成不自动等于 Release，更不等于 Production。''','''→ OWNER Real-use UI Review\n→ Formal Release Gate（V2.22.0 / V2.22.1 已完成）\n→ 独立 Owner Production Upgrade Gate\n```\n\n当前 Formal Release 已推进到 V2.22.1；真实 Owner Production Runtime 仍需独立升级证据，Release 不自动等于 Production。''','RPD delivery')

          # Prepend current changelog; V2.22.0 entries remain immutable history.
          c=root/'CHANGELOG.md'; s=c.read_text(encoding='utf-8')
          if '## VF Start V2.22.1 — Online Updater Freshness Hotfix' not in s:
              marker='# 变更记录\n\n'
              if not s.startswith(marker): raise SystemExit('CHANGELOG header mismatch')
              entry='''## VF Start V2.22.1 — Online Updater Freshness Hotfix\n- 正式发布：`v2.22.1` / Release ID `378275999` / Exact Source `a31bafac5efc97efa537b645f03bc99ed0ea5b43` / Tree `76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59`。\n- V2.22.0 功能与 Schema 不变；V2.22.1 只推进正式版本 Identity，不引入新的 Migration 或业务功能。\n- 根因：Owner V2.21.25 已记录原 V2.22.0 Manifest；之后即使修正版更新 alias 本身正确，同一个 `2.22.0` 对应不同 Manifest SHA 仍会被 anti-silent-replacement 安全门正确拒绝。\n- 安全策略不放宽、不清除 Owner Freshness State，也不允许同版本静默换包；改为发布新的不可变版本 V2.22.1。\n- Hotfix Candidate Gate `33144353246` 真实模拟 `V2.21.25 + highest_verified_release_version=2.22.0`，`check()` / `prepare()` / `install()` 全部 PASS。\n- 升级后版本 `2.22.1` / Schema `2026082801`；Category / Link 保留、无静默 Surface Profile、SQLite/FK PASS、Common Product Baseline 88 / DRIFT 0 / UNKNOWN 0。\n- Online Updater alias：`VF_Start_V2.22.1_UPDATE.zip`，Bytes=`1170499`，SHA-256=`b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466`，内部唯一 `repair-v2.22.1.php`。\n- Publication Runner `33144772489` PASS；Tag / GitHub Release / 远端资产字节回读 / `core-updates` 发布 / 最终回读全部 PASS。\n- `core-updates` Commit=`9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1`，Target=`2.22.1`。\n- **Owner Production Runtime 仍是 V2.21.25 / Schema 2026080902；本发布没有直接写入真实服务器。**\n\n'''
              c.write_text(marker+entry+s[len(marker):],encoding='utf-8',newline='\n')

          # Current Authority is intentionally rewritten as current state, not historical evidence.
          (root/'docs/authority/CURRENT.md').write_text('''# P01 · VF Start · Current Authority Overlay\n\n> 更新时间：2026-08-28  \n> 状态：`CURRENT / V2.22.1 FORMAL RELEASE PUBLISHED / PRODUCTION RUNTIME V2.21.25`\n\n## 1. Formal Release Truth · PASS\n\n```text\nProject: P01 · VF Start\nRepository: llhzx2018/vf-start\nFormal Release: V2.22.1 / PASS\nTag: v2.22.1\nRelease ID: 378275999\nRelease Source: a31bafac5efc97efa537b645f03bc99ed0ea5b43\nRelease Tree: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59\nRelease Merge: 203d3c1236624ab846555167d217978694e11e88\nHotfix Candidate Gate: 33144353246 / PASS\nPublication Run: 33144772489 / PASS\nRelease Schema: 2026082801\nBrowser Helper: 1.6.4\ncore-updates Target: 2.22.1\ncore-updates Commit: 9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1\n```\n\nV2.22.1 的 Tag、GitHub Release、Release Assets 与 `core-updates` 已全部远端回读；本轮没有直接写入 Owner Production Server。\n\n## 2. Freshness Hotfix Root Cause · CLOSED\n\nV2.22.0 首轮 Online Updater alias 的内部 Repair 文件名问题已经通过 Compatibility Fix 解决；但 Owner V2.21.25 在此之前已经保存了原 V2.22.0 的最高已验证正式版本与 Manifest SHA。\n\n当同一个正式版本 `2.22.0` 的 `core-updates` Manifest 因修正版 asset SHA 发生变化时，V2.21.25 正确触发：\n\n`同一正式版本的 Core Update Manifest 内容发生变化，已拒绝静默替换。`\n\n这不是应被删除的限制，而是 anti-silent-replacement 安全合同。最终裁决：\n\n- 不清理 Owner 已保存的 Freshness State；\n- 不降低或绕过 Manifest Freshness Gate；\n- 不再修改 V2.22.0；\n- 使用新正式版本 V2.22.1 承载修复后的不可变 Online Update Identity。\n\nMachine Gate `33144353246` 已真实模拟 `V2.21.25 + remembered V2.22.0`，V2.21.25 当前 `VfUpdateManager::check() -> prepare() -> install()` 全部 PASS。\n\n## 3. V2.22.1 Online Update Artifact · PASS\n\n```text\nAsset: VF_Start_V2.22.1_UPDATE.zip\nBytes: 1170499\nSHA-256: b961ff63612a23284ab0337d403a6b65b06b6494b66f853b2d88de8baec16466\nInner Repair: repair-v2.22.1.php\nFrom Version: 2.21.25\nTarget Version: 2.22.1\nTarget Schema: 2026082801\n```\n\nGate 同时证明：Fresh Install、Category / Link Preserve、无自动 Profile、SQLite integrity / FK、Multi-Surface Contract、Common Product Baseline 88 PASS / DRIFT 0 / UNKNOWN 0。\n\n## 4. Production Runtime Truth · UNCHANGED\n\n```text\nCurrent Owner Runtime Version: V2.21.25\nCurrent Owner Runtime Schema: 2026080902\nLast Confirmed Owner Upgrade: 2.21.24 -> 2.21.25 / SUCCESS\nV2.22.1 Production Runtime Upgrade: NOT EXECUTED\nProduction Write by V2.22.1 Publication: NO\n```\n\n**Formal Release V2.22.1 != Owner Production Runtime V2.22.1。** 在 Owner 真机重新执行在线升级并完成 Runtime / Schema / Surface / 数据完整性回读之前，Production Runtime 必须继续写 V2.21.25。\n\n## 5. Product Truth\n\nV2.22.1 不改变 V2.22.0 Multi-Surface 产品定义：\n\n- P01 仍是一个系统、一个账号、一个 SQLite 数据权威；\n- Start / Channels / Watch 是并行 Surface；\n- `links` 继续是 URL Identity；\n- `resource_surface_profiles` 是稀疏扩展；无 Profile = Start；\n- Channels = 内容源长期记忆 + 反算法重发现；\n- Watch = 影视/视听索引，不是播放器或媒体服务器；\n- 自动分析只产生建议，禁止静默迁移；\n- `/` 继续保持现有 Start。\n\n## 6. Evidence\n\n- Multi-Surface Canonical Machine Evidence：`docs/evidence/P01_V2.22.0_MULTI_SURFACE_MACHINE_20260828.md`；\n- V2.22.0 Release Publication：`33142964417` / PASS；\n- V2.22.0 Online Updater Compatibility：`33143671134` / PASS；\n- V2.22.0 Publication Fix：`33143735834` / PASS；\n- V2.22.1 Freshness Hotfix Candidate：`33144353246` / PASS；\n- V2.22.1 Publication：`33144772489` / PASS；\n- V2.22.1 Release Evidence：`docs/evidence/P01_V2.22.1_ONLINE_HOTFIX_RELEASE_20260828.md`。\n\n## 7. Git / Release Boundary\n\n```text\nmain: 203d3c1236624ab846555167d217978694e11e88\nTag v2.22.1: a31bafac5efc97efa537b645f03bc99ed0ea5b43\nTag Tree = main Tree: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59\nGitHub Release: 378275999\ncore-updates: target 2.22.1 / commit 9e7972a19a3d8e4ffa239b3cc029bc0ba952bba1\nProduction Runtime: V2.21.25 / NOT YET UPGRADED\n```\n\n## 8. Next Gate\n\n下一步只有独立的 **Owner Production Upgrade Gate**：在当前真实 V2.21.25 后台重新“检查更新”，应看到 V2.22.1；执行 Atomic Update 后回读 Runtime Version `2.22.1`、Schema `2026082801`、Start / Channels / Watch、数据完整性与运行健康，再形成 Production Closure。\n\n## 9. Historical Boundary\n\nV2.22.0 Multi-Surface Release、首次 Online Updater FAIL、Compatibility Fix 与旧 Evidence 都是历史事实，不因 V2.22.1 发布而改写或删除。\n''',encoding='utf-8',newline='\n')

          (root/'docs/authority/SSOT.md').write_text('''# P01 · VF Start · Current Engineering SSOT\n\n> 状态：`CURRENT / V2.22.1 FORMAL RELEASE + V2.21.25 OWNER PRODUCTION RUNTIME`  \n> Rebaseline：2026-08-28  \n> Repository：`llhzx2018/vf-start`\n\n## 1. Authority 优先级\n\n```text\nOWNER 最新明确产品裁决\n→ 真实 Production Evidence\n→ Git Current Ref / Release / VF_PROJECT.json\n→ Current RPD / SSOT / Acceptance Matrix\n→ 历史 Prototype / Handoff / Evidence / 聊天\n```\n\n## 2. Source / Release / Owner Runtime 严格分离\n\n```text\nGit main:             203d3c1236624ab846555167d217978694e11e88\nCurrent Formal Tag:   v2.22.1\nRelease Exact Source: a31bafac5efc97efa537b645f03bc99ed0ea5b43\nRelease Tree:         76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59\nRelease Schema:       2026082801\nOwner Runtime:        2.21.25\nOwner Schema:         2026080902\nProduction Upgrade:   NOT EXECUTED\n```\n\nGit Formal Release 可以领先 Owner Runtime。没有真实服务器升级回读时，不允许用 Tag/Main 推断 Owner 已经运行 V2.22.1。\n\n## 3. Runtime 架构\n\n正式运行继续是 PHP + SQLite；V2.22.1 不引入第二数据库、第二认证系统或新业务 Schema。\n\n关键实现保持：\n\n- `src/index.php`：Start 根入口；\n- `src/surfaces.php`：Surface 总览；\n- `src/channels.php` / `src/watch.php`：独立 Surface Entry；\n- `src/surface.php`：共享渲染内核；\n- `src/surface-manager.php`：管理员归属管理；\n- `src/surface-open.php`：管理员点击记录 + 安全重定向；\n- `src/app/SurfaceRepository.php`：Surface 数据访问层；\n- `src/migrations/2026082801_v222_multi_surface.php`：V2.22.0 引入且 V2.22.1 继续使用的 Schema Migration；\n- `src/cli/surface-verify.php`：Machine Contract Verification。\n\n## 4. Data Contract\n\n`links` 继续是 URL Asset 主表。Multi-Surface 使用稀疏 `resource_surface_profiles`，不建立平行 URL 主表。\n\n```text\nProfile 不存在 -> Start\nProfile.surface=channels -> Channels\nProfile.surface=watch -> Watch\n```\n\nMigration 不修改既有 URL/Category 行，不自动分类历史资产；Reset to Start = 删除 Profile，不删除 URL。\n\n## 5. Projection / Surface Contract\n\nSurface 查询必须继承现有 visibility / lifecycle / sensitive filtering。匿名投影不得泄漏 `surface_note`、`last_opened_at`、后台听偏好、Watch 私人状态或 Private/Pending/Sensitive/Protected URL。\n\n- Start：`/` 保持成熟入口，无 Profile 的旧链接默认 Start；\n- Channels：内容源长期记忆与重发现，不复制 YouTube Feed / 评论 / 播放量；\n- Watch：影视/视听索引，不托管媒体文件；\n- Classification Suggestion：只读建议，只有管理员显式提交才可写 DB。\n\n## 6. Security / Update Contract\n\n- PERSONAL_SINGLE_ADMIN；\n- 写操作必须 Session + CSRF；\n- Redirect 只允许 DB 中合法 `http(s)` URL，拒绝 CR/LF；\n- Production DB / PRIVATE_DATA 不进入 Runner；\n- Backup / Restore / Atomic Update 继续服从 Common Product Baseline V2；\n- Online Update Manifest 具有 anti-silent-replacement 语义：同一已验证正式版本的 Manifest SHA 变化必须拒绝；\n- 修复发布必须通过新版本前进，不得清理客户端 Freshness State 或放宽安全门。\n\n## 7. Current Upgrade Contract\n\n当前唯一支持的 Owner Upgrade 路径：\n\n```text\n2.21.25 / Schema 2026080902\n        ↓ Atomic Update\n2.22.1 / Schema 2026082801\n```\n\nV2.22.1 Gate `33144353246` 已证明：本机先保存 `highest_verified_release_version=2.22.0` 后，V2.21.25 当前 Updater 仍能正常接受 V2.22.1，并完成 `check -> prepare -> install`。\n\n升级必须继续验证：Version、Schema、Category/Link Preserve、无自动 Profile、SQLite/FK、Surface Contract、Common Baseline。\n\n## 8. Release Contract · CURRENT\n\n```text\nV2.22.0 = Multi-Surface Material Feature Release（历史首发）\nV2.22.1 = Online Updater Freshness Hotfix（当前正式版本）\n```\n\nCurrent Release Evidence：Hotfix Gate `33144353246` PASS，Publication `33144772489` PASS，GitHub Release ID `378275999`，`core-updates` target `2.22.1`。\n\nProduction Upgrade 仍需独立 Owner Production Gate，不因 Formal Release 自动执行。\n''',encoding='utf-8',newline='\n')

