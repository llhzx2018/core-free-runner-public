name: R56 Derived Favorite Coherence Public Runner Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r56-derived-favorite-coherence-public-gate.yml'

permissions:
  contents: read

jobs:
  r56-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_INITIAL_SHA: 9b5fa6dde6b6d8b93104e85e2c767fae4589b68a
      PRODUCT_BRANCH: l2/r56-derived-favorite-view-coherence
    steps:
      - name: Checkout private P01 working branch transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: l2/r56-derived-favorite-view-coherence
          path: vf-start
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Bind exact initial source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$EXPECTED_INITIAL_SHA"
          test "$(cat vf-start/VERSION)" = '2.47.0'
          echo R56_INITIAL_SOURCE_BOUND

      - name: Apply one-point favorite-view route correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vf-start/src/assets/workspace.js')
          text = path.read_text(encoding='utf-8')
          old = "['surfaces.php','start.php']"
          new = "['surfaces.php','start.php','tools.php','software.php']"
          if text.count(old) != 1:
              raise SystemExit('R56 favorite-view route fence mismatch')
          if new in text:
              raise SystemExit('R56 correction already present')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git -C vf-start diff --check
          test "$(git -C vf-start diff --name-only | tr -d '\r')" = 'src/assets/workspace.js'
          echo R56_EXACT_ONE_FILE_PATCH_READY

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Source and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          node --check src/assets/workspace.js
          php tests/unit/derived_favorite_view_coherence_contract.php
          php tests/unit/favorite_add_context_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          echo R56_PUBLIC_SOURCE_REGRESSION_PASS

      - name: Commit and push exact private candidate
        shell: bash
        run: |
          set -euo pipefail
          cd vf-start
          git config user.name 'VictorForge Runner'
          git config user.email 'actions@users.noreply.github.com'
          git add src/assets/workspace.js
          git commit -m 'fix(product): refresh derived favorite views after unfavorite'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${PRODUCT_BRANCH}"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$NEW_SHA"
          echo "R56_EXACT_CANDIDATE_SHA=$NEW_SHA"
          echo R56_REMOTE_BRANCH_BOUND

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Build real-workspace browser fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > vf-start/_r56_router.php <<'PHP'
          <?php
          declare(strict_types=1);
          $path = (string)(parse_url($_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH) ?: '/');
          $static = __DIR__ . $path;
          if ($path !== '/' && is_file($static)) return false;
          if ($path === '/workspace-action.php') {
              header('Content-Type: application/json; charset=utf-8');
              echo json_encode(['ok'=>true,'message'=>'收藏状态已更新'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES);
              return true;
          }
          if (!in_array($path, ['/tools.php','/software.php'], true)) {
              http_response_code(404); echo 'not found'; return true;
          }
          $mode = $path === '/tools.php' ? 'tools' : 'software';
          header('Content-Type: text/html; charset=utf-8');
          ?><!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R56</title></head><body>
          <div class="vf-root" data-mode="<?=$mode?>"></div>
          <script type="application/json" id="vf-workspace-data"><?=json_encode(['assets'=>['1'=>['id'=>1,'title'=>'R56 item','surface'=>'start','is_favorite'=>1]],'categories'=>[],'csrf'=>'r56'], JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)?></script>
          <article data-asset-row="1"><button type="button" data-favorite-id="1" data-favorite="1" class="active">★</button></article>
          <script src="/src/assets/workspace.js"></script>
          </body></html><?php return true;
          PHP
          php -l vf-start/_r56_router.php

      - name: Real Chromium desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          (cd vf-start && php -S 127.0.0.1:8771 _r56_router.php >"$RUNNER_TEMP/r56-php.log" 2>&1) &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8771/tools.php?view=favorite' >/dev/null; then break; fi
            sleep 0.5
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const width of [1280,390]){
              for(const route of ['tools.php','software.php']){
                const page=await browser.newPage({viewport:{width,height:900}});
                const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
                await page.goto(`http://127.0.0.1:8771/${route}?view=favorite`,{waitUntil:'domcontentloaded'});
                const nav=page.waitForNavigation({waitUntil:'domcontentloaded',timeout:3000});
                await page.locator('[data-favorite-id="1"]').click();
                await nav;
                assert(errors.length===0,`${route} favorite pageerror ${width}: ${errors.join(' | ')}`);
                assert(new URL(page.url()).searchParams.get('view')==='favorite',`${route} favorite context lost ${width}`);
                await page.close();
              }
              const control=await browser.newPage({viewport:{width,height:900}});
              await control.goto('http://127.0.0.1:8771/tools.php?view=all',{waitUntil:'domcontentloaded'});
              let navigated=false;
              control.on('framenavigated',frame=>{if(frame===control.mainFrame())navigated=true});
              navigated=false;
              await control.locator('[data-favorite-id="1"]').click();
              await control.waitForTimeout(650);
              assert(!navigated,`non-favorite control unexpectedly reloaded ${width}`);
              assert(await control.locator('[data-favorite-id="1"]').getAttribute('data-favorite')==='0',`non-favorite control did not update state ${width}`);
              await control.close();
            }
            await browser.close();
            console.log('R56_REAL_BROWSER_DERIVED_FAVORITE_VIEW_COHERENCE_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf vf-start
          rm -f "$RUNNER_TEMP/r56-php.log"
