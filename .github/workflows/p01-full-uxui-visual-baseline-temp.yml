name: p01-full-uxui-visual-baseline-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-full-uxui-visual-baseline-temp.yml'
      - 'requests/p01-full-uxui-visual-baseline-20260922.json'
      - 'scripts/p01_uxui_prepare_runtime.sh'
      - 'scripts/p01_uxui_capture.mjs'

permissions:
  contents: read

jobs:
  visual-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANE_SPEC: requests/p01-full-uxui-visual-baseline-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Checkout exact P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ux/p01-action-density-r3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact clean source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_worktree.py verify             --spec "$LANE_SPEC"             --repo candidate             --version-file VERSION             --version-file src/VERSION.txt             | tee /tmp/p01-uxui-exact.json
          grep -F '"status": "PASS"' /tmp/p01-uxui-exact.json >/dev/null
          echo P01_UXUI_EXACT_SOURCE=PASS

      - name: Focused UXUI source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/full_product_public_shared_rhythm_r1_contract.php
          php candidate/tests/unit/mobile_account_nav_r2_contract.php
          php candidate/tests/unit/full_product_action_density_r3_contract.php

      - name: Fresh runtime and synthetic UI fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_uxui_prepare_runtime.sh

      - name: Capture production public and exact-source admin surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/p01_uxui_capture.mjs

      - name: Upload visual baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24740-full-uxui-visual-baseline
          path: /tmp/p01-uxui-screens/
          if-no-files-found: error
          retention-days: 7

      - name: Baseline summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f /tmp/p01-uxui-screens/visual-audit.json ]; then
            jq '{counts,failures}' /tmp/p01-uxui-screens/visual-audit.json
          fi
