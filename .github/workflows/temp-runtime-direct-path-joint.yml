name: TEMP Runtime Direct Path Joint Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-runtime-direct-path-joint.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_AGENT_SHA: c16cc200ece644225a169f03b99b88df3de6d4ae
      GOV_SYSTEM_SHA: 36df808c982671c7bef5b92fdd9efad6e5ad61f7
      GOV_HANDOFF_SHA: 36ab4214d2a66cda04bc0d74f11863c03e15a5db
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-agent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core-agent

      - name: Checkout exact Development System candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_SYSTEM_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-system

      - name: Checkout exact Handoff candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_HANDOFF_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-handoff

      - name: Verify exact source identities
        shell: bash
        run: |
          test "$(git -C core-agent rev-parse HEAD)" = "$CORE_AGENT_SHA"
          test "$(git -C gov-system rev-parse HEAD)" = "$GOV_SYSTEM_SHA"
          test "$(git -C gov-handoff rev-parse HEAD)" = "$GOV_HANDOFF_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify core-agent candidate
        working-directory: core-agent
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SHA }}
        run: python scripts/verify.py

      - name: Verify Development System candidate
        working-directory: gov-system
        run: python governance/agent/candidates/tests/validate_runtime_entry_direct_path_v1_1.py

      - name: Verify Handoff candidate
        working-directory: gov-handoff
        run: python skills/skill-handoff/candidates/V2.4/tests/validate_candidate.py

      - name: Verify three-way Mission / Direct Path alignment
        shell: bash
        run: |
          grep -F 'P01/P02/P04/P05/P06` 本身不是 Durable Activation Request' core-agent/AGENTS.md
          grep -F 'Runtime Level != Infrastructure Stack' core-agent/AGENTS.md
          grep -F '优化整套 VF / Kewaro AI 软件开发流程与开发环境' gov-system/governance/agent/candidates/VF_DEVELOPMENT_SYSTEM_V2_CANDIDATE.md
          grep -F 'Ordinary Status Line != VF Runtime ACTIVE proof' gov-system/governance/agent/candidates/VF_DEVELOPMENT_SYSTEM_V2_CANDIDATE.md
          grep -F 'Project Routing != Durable Runtime Activation' gov-system/governance/agent/candidates/VF_RUNTIME_ENTRY_DIRECT_PATH_V1.1_CANDIDATE.md
          grep -F '文件名 / START_HERE / 一键入口 · HARD STRUCTURE' gov-handoff/skills/skill-handoff/candidates/V2.4/SKILL.md
          grep -F 'SHADOW_TEST_PACKAGE_CONTRACT=PASS' <(python gov-handoff/skills/skill-handoff/candidates/V2.4/tests/validate_candidate.py)
          grep -F 'P01 · VF Start = 当前验证样本，不是总任务' gov-handoff/skills/skill-handoff/candidates/V2.4/shadow-test/01_ONE_CLICK_PROMPT.txt
          grep -F 'SHADOW_TEST = PASS' gov-handoff/skills/skill-handoff/candidates/V2.4/shadow-test/03_EXPECTED_RESULT.md
          grep -F 'Current Project != Master Mission' gov-handoff/skills/skill-handoff/candidates/V2.4/SKILL.md
          grep -F 'Task Complete != Mission Complete' gov-handoff/skills/skill-handoff/candidates/V2.4/SKILL.md
          grep -F 'Status: `CURRENT' gov-system/governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.0.md
          test ! -e gov-system/governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.1.md
          echo 'VF_DEVELOPMENT_SYSTEM_V2_THREE_WAY_ALIGNMENT=PASS'
