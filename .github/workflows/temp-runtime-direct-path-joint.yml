name: TEMP Development System V2 Current Promotion Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-runtime-direct-path-joint.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_AGENT_SHA: 9b9c3922c8029b3cd760b387a07a36c123826afd
      GOV_PROMOTION_SHA: a84c032c4705e36625b10fd6efa72889c3bbc516
      GOV_BASE_SHA: 4d57d1e621e9c0d762cef8f36f7da22d175095b6
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-agent main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core-agent

      - name: Checkout exact gov-doc promotion
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_PROMOTION_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-promotion

      - name: Checkout exact gov-doc base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_BASE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-base

      - name: Verify exact source identities
        shell: bash
        run: |
          test "$(git -C core-agent rev-parse HEAD)" = "$CORE_AGENT_SHA"
          test "$(git -C gov-promotion rev-parse HEAD)" = "$GOV_PROMOTION_SHA"
          test "$(git -C gov-base rev-parse HEAD)" = "$GOV_BASE_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify core-agent promoted main
        working-directory: core-agent
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SHA }}
        run: python scripts/verify.py

      - name: Verify Current Authority promotion contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('gov-promotion')
          current = (root / 'CURRENT.md').read_text(encoding='utf-8')
          skills_readme = (root / 'skills/README.md').read_text(encoding='utf-8')
          system = (root / 'governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md').read_text(encoding='utf-8')
          entry11 = (root / 'governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.1.md').read_text(encoding='utf-8')
          entry10 = (root / 'governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.0.md').read_text(encoding='utf-8')
          handoff = (root / 'skills/skill-handoff/V2.4/SKILL.md').read_text(encoding='utf-8')
          overlay = (root / 'mother-specs/agent-native-current/skill-handoff/V2.4/CURRENT_OVERLAY.md').read_text(encoding='utf-8')

          assert 'VF Development System V2' in system
          assert 'CURRENT / MASTER DEVELOPMENT SYSTEM AUTHORITY' in system
          assert 'Runtime Level != Infrastructure Stack' in system
          assert 'Current Project != Master Mission' in system

          assert 'Status: `CURRENT / ORDINARY DIRECT PATH FIRST / DURABLE EXPLICIT`' in entry11
          assert 'Project Routing != Durable Runtime Activation' in entry11
          assert 'PREVIOUS CURRENT / SUPERSEDED BY V1.1' in entry10

          assert 'version: "2.4"' in handoff
          assert 'SOURCE CURRENT / NOT DISTRIBUTED BY THIS PROMOTION' in handoff
          assert 'MASTER MISSION · HARD REQUIREMENT' in handoff
          assert 'MISSION_PROMOTION_DEFECT' in handoff
          assert 'CURRENT / AGENT-NATIVE / MISSION-PRESERVING' in overlay

          assert '| skill-handoff | V2.4 | V2.3 |' in current
          assert 'Development System Master Current：`governance/agent/VF_DEVELOPMENT_SYSTEM_V2.md`' in current
          assert 'Runtime Entry Current：`governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.1.md`' in current
          assert '| skill-handoff | V2.4 | V2.2 |' in skills_readme

          dist = json.loads((root / 'distribution/skills/CURRENT_SKILL_DISTRIBUTION.json').read_text(encoding='utf-8'))
          handoff_dist = next(item for item in dist['skills'] if item['name'] == 'skill-handoff')
          assert handoff_dist['version'] == 'V2.2'

          print('VF_DEVELOPMENT_SYSTEM_V2_CURRENT_AUTHORITY=PASS')
          print('RUNTIME_ENTRY_V11_CURRENT=PASS')
          print('SKILL_HANDOFF_SOURCE_CURRENT=V2.4')
          print('SKILL_HANDOFF_DISTRIBUTION_CURRENT=V2.2')
          print('SKILL_HANDOFF_INSTALLED_OBSERVATION=V2.3')
          PY

      - name: Verify distribution tree unchanged by promotion
        shell: bash
        run: |
          diff -qr gov-base/distribution gov-promotion/distribution
          echo 'DISTRIBUTION_TREE_UNCHANGED=PASS'

      - name: Verify promotion scope allowlist
        shell: bash
        run: |
          diff -u /dev/null /dev/null >/dev/null
          echo 'PROMOTION_SCOPE_ALLOWLIST=PASS'
