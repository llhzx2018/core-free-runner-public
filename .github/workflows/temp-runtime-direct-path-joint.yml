name: TEMP Runtime Direct Path Joint Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-runtime-direct-path-joint.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_AGENT_SHA: c16cc200ece644225a169f03b99b88df3de6d4ae
      GOV_DOC_SHA: b7ae64526a829bef10c781866960254cb6a07084
    steps:
      - name: Verify private read capability
        shell: bash
        run: test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact core-agent candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-agent
          ref: ${{ env.CORE_AGENT_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: core-agent

      - name: Checkout exact gov-doc candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: ${{ env.GOV_DOC_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-doc

      - name: Verify exact source identities
        shell: bash
        run: |
          test "$(git -C core-agent rev-parse HEAD)" = "$CORE_AGENT_SHA"
          test "$(git -C gov-doc rev-parse HEAD)" = "$GOV_DOC_SHA"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Verify core-agent candidate
        working-directory: core-agent
        env:
          VF_SOURCE_SHA: ${{ env.CORE_AGENT_SHA }}
        run: python scripts/verify.py

      - name: Verify governance candidate
        working-directory: gov-doc
        run: python governance/agent/candidates/tests/validate_runtime_entry_direct_path_v1_1.py

      - name: Verify joint Direct Path alignment
        shell: bash
        run: |
          grep -F 'P01/P02/P04/P05/P06` 本身不是 Durable Activation Request' core-agent/AGENTS.md
          grep -F 'Runtime Level != Infrastructure Stack' core-agent/AGENTS.md
          grep -F 'Project Routing != Durable Runtime Activation' gov-doc/governance/agent/candidates/VF_RUNTIME_ENTRY_DIRECT_PATH_V1.1_CANDIDATE.md
          grep -F 'Runtime Level != Infrastructure Stack' gov-doc/governance/agent/candidates/VF_RUNTIME_ENTRY_DIRECT_PATH_V1.1_CANDIDATE.md
          grep -F 'Status: `CURRENT' gov-doc/governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.0.md
          test ! -e gov-doc/governance/agent/VF_RUNTIME_ENTRY_CONTRACT_V1.1.md
          echo 'RUNTIME_DIRECT_PATH_JOINT_ALIGNMENT=PASS'
