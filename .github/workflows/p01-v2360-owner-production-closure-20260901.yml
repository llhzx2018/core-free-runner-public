name: P01 V2.36.0 Owner Production Closure
on:
  push:
    branches: [temp/p01-v2360-owner-closure-20260901]
    paths: [.github/workflows/p01-v2360-owner-production-closure-20260901.yml]
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUTH_BASE: b6f80066a90f019bfa4f32ce79fc8bc8c278b6e7
      AUTH_BRANCH: production/p01-v2360-owner-closure-20260901
    steps:
      - name: Checkout exact authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.AUTH_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Update exact Production Authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$AUTH_BASE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          p=root/'VF_PROJECT.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V2.36.0 PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'
          d['production_version']='2.36.0'
          d['working_version']='2.36.0'
          d['target_release_version']='2.36.0'
          d['current_phase']='V2.36.0 PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION'
          pub=d['published_release']
          prod=dict(pub)
          prod.update({
            'release_state':'PUBLISHED / PRODUCTION CLOSURE PASS',
            'candidate_readiness_gate':33420047480,
            'formal_artifact_gate':33420558251,
            'strict_fresh_install_gate':33420751341,
            'main_promotion_gate':33469243080,
            'publication_gate':33469318027,
            'core_updates_manifest_gate':33469427557,
            'remote_online_update_gate':33469554421,
            'remote_online_update_artifact':9786039151,
            'remote_online_update_artifact_sha256':'73fffeb960bd6a6a7caf293f0eeb2fb3377d6f2f1e6782269b89cbc1527a0566',
            'owner_production_runtime':'2.36.0',
            'owner_production_schema':'2026082901',
            'owner_production_upgrade':'2.35.3 -> 2.36.0 / SUCCESS',
            'owner_version_readback':'Current V2.36.0 / Latest V2.36.0 / green latest / history success',
            'owner_browser_footer_readback':'V2.36.0 / PASS',
            'owner_browser_install_control_readback':'ABSENT / PASS',
            'owner_terminal_ui_last_check':'2026-09-01 12:32:54',
            'production_closure':'PASS',
            'assistant_production_write':False
          })
          d['production_release']=prod
          d['published_release']['release_state']='PUBLISHED / PRODUCTION CLOSURE PASS'
          d['formal_release_state']='V2.36.0 PUBLISHED / PRODUCTION CLOSURE PASS'
          d['develop_state']='V2.36.0 PRODUCTION CLOSURE PASS / L2 PRODUCT OPTIMIZATION READY'
          d['current_authority']='Owner Production V2.36.0 / Published Latest V2.36.0 / Production Closure PASS'
          d['next_action']='Continue P01 L2 Product Optimization from V2.36.0 Production Closure Current Truth. No release or production write unless separately authorized.'
          d['core_updates_v2_36_0_state']='PUBLISHED / OWNER PRODUCTION CLOSURE PASS'
          d['owner_production_activation_evidence']={
            'version':'2.36.0','schema':'2026082901',
            'final_screenshot_sha256':'cc32025bb9d1da7a676cd2c52d5822a68950a1ed6e2ce24460091a819d1a4890',
            'screenshot_size':'1319x641','current':'2.36.0','latest':'2.36.0','footer':'2.36.0',
            'install_control':'ABSENT','state':'已是最新版本。','history':'2.35.3 -> 2.36.0 / success',
            'last_check':'2026-09-01 12:32:54','terminal_ui_visual_closure':'PASS','assistant_production_write':False
          }
          d['authority']['current_production_evidence']='docs/evidence/P01_V2.36.0_OWNER_PRODUCTION_ACTIVATION_20260901.md'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          readme=root/'README.md'; t=readme.read_text(encoding='utf-8')
          block='''## Current Truth\n\n```text\nOwner Production: V2.36.0\nOwner Schema: 2026082901\nPublished Latest: V2.36.0\nFormal Release Source: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a\nRuntime src Tree: ad3f96345ead330adffb20c7ecb3cdf6537036b6\nTag: v2.36.0\nGitHub Release ID: 380209550\ncore-updates: 447e5f97bfaef078c31b752126f3b5bd0284a5ee\nFinal Remote Online Update Gate: 33469554421 / PASS\nOwner Production Closure: PASS\nAssistant Production Write: NO\n```\n\nV2.36.0 已由 Owner 在真实 Production 完成升级。截图回读确认 Current=Latest=V2.36.0、绿色“已是最新版本”、升级历史 2.35.3 → 2.36.0 / success、页脚 V2.36.0。当前恢复到 L2 Product Optimization。\n'''
          if re.search(r'## Current Truth\n.*?(?=\n## )',t,flags=re.S):
              t=re.sub(r'## Current Truth\n.*?(?=\n## )',block.rstrip(),t,count=1,flags=re.S)
          else:
              lines=t.splitlines(); t=lines[0]+'\n\n'+block+'\n'+'\n'.join(lines[1:])
          readme.write_text(t.rstrip()+'\n',encoding='utf-8')

          marker='<!-- P01_V2360_OWNER_PRODUCTION_CLOSURE -->'
          current_block=f'''{marker}\n## V2.36.0 Owner Production Closure · 2026-09-01\n\n- Owner Production：`V2.36.0` / Schema `2026082901`。\n- Published Latest：`V2.36.0`。\n- Owner-observed screenshot：`1319x641` / `sha256:cc32025bb9d1da7a676cd2c52d5822a68950a1ed6e2ce24460091a819d1a4890`。\n- Current / Latest：`V2.36.0 / V2.36.0`。\n- Terminal state：绿色 `已是最新版本。`。\n- Upgrade history：`2.35.3 -> 2.36.0 / success`。\n- Footer：`V2.36.0`。\n- Last check：`2026-09-01 12:32:54`。\n- Owner Production Closure：**PASS**。\n- Assistant Production Write：**NO**。\n- Next：回到 V2.36.0 Current Truth 继续 L2 Product Optimization。\n\n> 以下旧段落保留历史证据，不覆盖本段 Current Truth。\n'''
          for rel in ['docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md']:
              q=root/rel; s=q.read_text(encoding='utf-8')
              if marker in s:
                  s=re.sub(re.escape(marker)+r'.*?(?=\n#|\n##|\Z)',current_block.rstrip(),s,count=1,flags=re.S)
              else:
                  lines=s.splitlines()
                  if lines and lines[0].startswith('#'):
                      s=lines[0]+'\n\n'+current_block+'\n'+'\n'.join(lines[1:])
                  else: s=current_block+'\n'+s
              q.write_text(s.rstrip()+'\n',encoding='utf-8')

          evidence=root/'docs/evidence/P01_V2.36.0_OWNER_PRODUCTION_ACTIVATION_20260901.md'
          evidence.write_text('''# P01 · VF Start · V2.36.0 Owner Production Activation Evidence\n\n## Verdict\n\n**PASS / OWNER PRODUCTION V2.36.0 / PRODUCTION CLOSURE COMPLETE**\n\n## Owner-observed Production UI\n\n- Screenshot size: `1319x641`\n- Screenshot SHA-256: `cc32025bb9d1da7a676cd2c52d5822a68950a1ed6e2ce24460091a819d1a4890`\n- Current version: `V2.36.0`\n- Latest version: `V2.36.0`\n- Terminal state: `已是最新版本。`\n- Upgrade history: `2.35.3 -> 2.36.0 / success`\n- Footer: `V2.36.0`\n- Last check: `2026-09-01 12:32:54`\n\n## Release Identity\n\n- Tag: `v2.36.0`\n- Formal Source: `225780b1ed56bbcc8e62ba465b1129e1c22ee60a`\n- Runtime Tree: `ad3f96345ead330adffb20c7ecb3cdf6537036b6`\n- GitHub Release ID: `380209550`\n- core-updates: `447e5f97bfaef078c31b752126f3b5bd0284a5ee`\n- Final Remote Online Update Gate: `33469554421` / PASS\n\n## Boundary\n\nThe actual Production upgrade was performed by the Owner. The Assistant did not write Owner Production. This commit only records the observed terminal state and closes Current Authority.\n''',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=$'README.md\nVF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.0_OWNER_PRODUCTION_ACTIVATION_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected"
          ! printf '%s\n' "${changed[@]}" | grep '^src/'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add README.md VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.0_OWNER_PRODUCTION_ACTIVATION_20260901.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.36.0 owner production'
          git push origin HEAD:"$AUTH_BRANCH"
          printf 'P01_V2360_OWNER_PRODUCTION_CLOSURE=PASS\nOWNER_PRODUCTION=V2.36.0\nOWNER_PRODUCTION_WRITE=NO\n'
