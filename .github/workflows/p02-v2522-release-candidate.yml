name: P02 V2.5.22 Release Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2522-release-candidate.yml'
      - 'scripts/p02-v2522-release-candidate.sh'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: c0b56def6efea0a9ad94d88f60a18a0be2a5ab91
    steps:
      - name: Require registered product-read capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo 'PRODUCT_READ_CAPABILITY=PASS'

      - name: Checkout fixed public runner definition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact private P02 candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Build and verify prepare-only candidate release set
        shell: bash
        run: bash scripts/p02-v2522-release-candidate.sh

      - name: Prove ephemeral handling boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO'
          echo 'CANDIDATE_BYTES_PERSISTED_AS_PUBLIC_ARTIFACT=NO'
          echo 'SANITIZED_DIGEST_EVIDENCE_ONLY=YES'
          echo 'PRODUCTION_WRITE=NO'
