name: P02 Final Engineering Closure

on:
  push:
    branches:
      - run/p02-final-engineering-closure-20260923
    paths:
      - '.github/workflows/p02-final-engineering-closure.yml'

permissions:
  contents: read

jobs:
  final-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact P02 closure candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: c2c22cf2c86d6d8586db71b7e409b3f3d803240b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout current formal V2.5.82 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 0411c3fbf36a896f0aaaa693e7f077ac9acfb143
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old82-src

      - name: Install runtime and Chromium
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "c2c22cf2c86d6d8586db71b7e409b3f3d803240b"
          test "$(git show -s --format=%T HEAD)" = "2401c0fef338ffb14e7e02524752674361459cdc"
          test "$(cat VERSION)" = "2.5.102"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          python3 -m py_compile scripts/build-candidate.py scripts/build-release.py scripts/build-multisource-update.py scripts/build-multisource-repair.py
          bash -n scripts/verify-release-artifacts.sh
          node tests/unit/p02_final_engineering_closure_release_tooling.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_FINAL_CLOSURE_SOURCE=PASS

      - name: Build and verify candidate artifacts
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 scripts/build-candidate.py             --out build/final-candidate             --source-version 2.5.81             --source-version 2.5.82             --source-commit c2c22cf2c86d6d8586db71b7e409b3f3d803240b             --source-tree 2401c0fef338ffb14e7e02524752674361459cdc             --source-ref work/p02-final-engineering-closure-20260923
          cd build/final-candidate
          sha256sum -c SHA256SUMS.txt
          for z in *.zip; do unzip -t "$z" >/dev/null; done
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          root=Path('.')
          version='2.5.102'; sources=['2.5.81','2.5.82']
          m=json.loads((root/f'VF_Library_V{version}_CANDIDATE_MANIFEST.json').read_text())
          assert m['version']==version
          assert m['compatibility']['supported_from']==sources
          with zipfile.ZipFile(root/f'VF_Library_V{version}_UPDATE_CANDIDATE.zip') as z:
              u=json.loads(z.read('atomic-manifest.json'))
              assert u['format_version']==2 and u['source_versions']==sources and u['target_version']==version
          repair=(root/f'repair-v{version}-candidate.php').read_text()
          assert '@@' not in repair
          for value in sources: assert value in repair
          print('P02_FINAL_CLOSURE_CANDIDATE_BUILD=PASS')
          PY
          cd ../..
          rm -rf build/final-candidate
          echo P02_FINAL_CLOSURE_CANDIDATE_CLEANUP=PASS

      - name: Full maintenance / fresh-install / privacy baseline
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-FINAL-MAINT-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-final-maintenance
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_FINAL_CLOSURE_MAINTENANCE=PASS

      - name: Formal artifact release preflight
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-FINAL-RELEASE-${{ github.run_id }}!
          VF_RELEASE_SOURCE_SHA: c2c22cf2c86d6d8586db71b7e409b3f3d803240b
          VF_RELEASE_SOURCE_TREE: 2401c0fef338ffb14e7e02524752674361459cdc
          VF_RELEASE_SOURCE_REF: work/p02-final-engineering-closure-20260923
          VF_RELEASE_FROM_VERSIONS: 2.5.81 2.5.82
        run: |
          set -Eeuo pipefail
          bash scripts/verify-release-artifacts.sh
          echo P02_FINAL_CLOSURE_RELEASE_PREFLIGHT=PASS

      - name: Real-data Atomic repair upgrade V2.5.82 to V2.5.102
        env:
          TEST_PASSWORD: VF-P02-FINAL-UPGRADE-${{ github.run_id }}!
          OLD_PORT: "18092"
        run: |
          set -Eeuo pipefail
          ROOT="$PWD"
          OLD_SRC="$ROOT/old82-src"
          PRODUCT="$ROOT/product"
          SITE="${RUNNER_TEMP}/p02-v2582-upgrade-site"
          COOKIE="${RUNNER_TEMP}/p02-v2582-upgrade-cookie.txt"
          BASE="http://127.0.0.1:${OLD_PORT}"
          LOG="${RUNNER_TEMP}/p02-v2582-upgrade-server.log"
          rm -rf "$SITE"
          bash "$OLD_SRC/scripts/build-deploy-tree.sh" "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = "2.5.82"

          php -d display_errors=0 -S "127.0.0.1:${OLD_PORT}" -t "$SITE" >"$LOG" 2>&1 &
          PID=$!
          cleanup(){ kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for _ in $(seq 1 80); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          kill -0 "$PID"

          curl -fsS -c "$COOKIE" "$BASE/setup.php" > "${RUNNER_TEMP}/setup82.html"
          SETUP_CSRF="$(python3 - "${RUNNER_TEMP}/setup82.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',s)
          assert m
          print(html.unescape(m.group(1)))
          PY
          )"
          STATUS="$(curl -sS -o /dev/null -w '%{http_code}' -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE"             --data-urlencode "setup_csrf=$SETUP_CSRF"             --data-urlencode "password=$TEST_PASSWORD"             --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")"
          test "$STATUS" = "303"

          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" "$BASE/api.php?action=session" > "${RUNNER_TEMP}/session82.json"
          CSRF="$(python3 - "${RUNNER_TEMP}/session82.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.5.82'
          print(x['csrf'])
          PY
          )"

          cat > "${RUNNER_TEMP}/cat.json" <<'JSON'
          {"name":"Final Closure Upgrade","description":"V2.5.82 real-data fixture","icon":"folder"}
          JSON
          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json'             --data-binary @"${RUNNER_TEMP}/cat.json" "$BASE/api.php?action=category_save" > "${RUNNER_TEMP}/cat-response.json"
          CATEGORY_ID="$(python3 - "${RUNNER_TEMP}/cat-response.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok']; print(x['id'])
          PY
          )"

          python3 - "${RUNNER_TEMP}/article.json" "$CATEGORY_ID" <<'PY'
          import json,sys
          marker='P02_FINAL_CLOSURE_V2582_DATA_MARKER'
          json.dump({
            'category_id':int(sys.argv[2]),
            'title':'Final Closure Upgrade Fixture',
            'description':'must survive v2.5.82 -> v2.5.102',
            'content':marker+'\n中文资料完整性\n'+('DATA-LINE\n'*200),
            'content_mode':'article',
            'content_format':'markdown',
            'primary_action':'read',
            'status':'active'
          },open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False)
          PY
          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json'             --data-binary @"${RUNNER_TEMP}/article.json" "$BASE/api.php?action=content_save" > "${RUNNER_TEMP}/article-response.json"
          ARTICLE_ID="$(python3 - "${RUNNER_TEMP}/article-response.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok']; print(x['id'])
          PY
          )"

          python3 - "${RUNNER_TEMP}/fixture.png" <<'PY'
          import base64,sys
          open(sys.argv[1],'wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZfGQAAAAASUVORK5CYII='))
          PY
          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF"             -F "item_id=$ARTICLE_ID" -F "attachment=@${RUNNER_TEMP}/fixture.png;type=image/png"             "$BASE/api.php?action=attachment_upload" > "${RUNNER_TEMP}/attachment82.json"
          python3 - "${RUNNER_TEMP}/attachment82.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['attachments']
          PY

          cp "$PRODUCT/build/release-preflight/repair-v2.5.102.php" "$SITE/repair-v2.5.102.php"
          curl -fsS -b "$COOKIE" -c "$COOKIE" "$BASE/repair-v2.5.102.php" > "${RUNNER_TEMP}/repair-form.html"
          REPAIR_CSRF="$(python3 - "${RUNNER_TEMP}/repair-form.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          m=re.search(r'name="csrf" value="([^"]+)"',s)
          assert m,s[:500]
          print(html.unescape(m.group(1)))
          PY
          )"
          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE"             --data-urlencode "action=upgrade" --data-urlencode "csrf=$REPAIR_CSRF"             "$BASE/repair-v2.5.102.php" > "${RUNNER_TEMP}/repair-result.html"
          grep -q "升级完成" "${RUNNER_TEMP}/repair-result.html"
          test ! -e "$SITE/repair-v2.5.102.php"
          test "$(cat "$SITE/VERSION.txt")" = "2.5.102"

          curl -fsS -b "$COOKIE" -c "$COOKIE" -H "Origin: $BASE" "$BASE/api.php?action=session" > "${RUNNER_TEMP}/session102.json"
          python3 - "${RUNNER_TEMP}/session102.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.5.102'
          PY
          curl -fsS -b "$COOKIE" -H "Origin: $BASE" "$BASE/api.php?action=content_get&id=$ARTICLE_ID" > "${RUNNER_TEMP}/article102.json"
          python3 - "${RUNNER_TEMP}/article102.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['ok'] and 'P02_FINAL_CLOSURE_V2582_DATA_MARKER' in x['item']['content']
          assert x['item']['title']=='Final Closure Upgrade Fixture'
          PY
          curl -fsS -b "$COOKIE" -H "Origin: $BASE" "$BASE/api.php?action=attachment_list&item_id=$ARTICLE_ID" > "${RUNNER_TEMP}/attachments102.json"
          python3 - "${RUNNER_TEMP}/attachments102.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and len((x.get('data') or {}).get('items',[]))>=1
          PY

          ( cd "$SITE" && php cli/verify.php ) > "${RUNNER_TEMP}/verify102.json"
          python3 - "${RUNNER_TEMP}/verify102.json" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['ok'] is True
          PY
          DB_FILE="$(cd "$SITE" && php -r '$r=include "app/.runtime.php"; echo $r["db_file"];')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          echo P02_FINAL_CLOSURE_UPGRADE_2582=PASS

      - name: Final closure marker
        run: |
          echo P02_PRODUCT_ENGINEERING_CLOSURE=PASS
