name: P05 V1.1.11 Release Authority Closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BASE: 49434d79d861bba206d72daa4476363f1bf8e0d4
      P05_BRANCH: governance/p05-v1111-release-closure-20260831
      VERSION: 1.1.11
      CANDIDATE_SOURCE: 6705dfb1886b209187180fd6191c1521624fb6ba
      RELEASE_TREE: f8cf4326d7c8631298843b8bd48ff06ae54f4c40
      EXACT_GATE_RUN: '33324629957'
      EXACT_GATE_JOB: '99292477706'
      MECHANISM_RUN: '33324381888'
      MECHANISM_JOB: '99291824138'
      PUBLICATION_RUN: '33324914166'
      PUBLICATION_JOB: '99293234048'
      RELEASE_ID: '379349908'
      FULL_ASSET: VF_SEO_V1.1.11_FULL.zip
      FULL_ASSET_ID: '536861594'
      RECEIPT_ASSET: VF_SEO_V1.1.11_RELEASE_RECEIPT.txt
      RECEIPT_ASSET_ID: '536861593'
      FULL_FILES: '45'
      FULL_BYTES: '371150'
      FULL_SHA256: b24bbbeb997fa6414689a01b32eb70a7bf20c82ffeec8761fea4b69612629ce8
      PUBLISHED_AT: 2026-08-30T17:20:30Z
      PUBLIC_DIST_TAG: p05-dist-v1.1.11
      PUBLIC_RELEASE_ID: '379349919'
      PUBLIC_ASSET_ID: '536861640'
    steps:
      - name: Checkout exact P05 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BASE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05

      - name: Verify immutable private release and public mirror
        working-directory: p05
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$RELEASE_TREE"
          test "$(git rev-parse "$CANDIDATE_SOURCE^{tree}")" = "$RELEASE_TREE"
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/private-release.json
          curl -fsSL -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/llhzx2018/core-free-runner-public/releases/tags/$PUBLIC_DIST_TAG" > /tmp/public-release.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/private-release.json'))
          assert str(p['id'])==os.environ['RELEASE_ID']
          assert p['tag_name']=='v'+os.environ['VERSION']
          assert p['target_commitish']==os.environ['P05_BASE']
          assert p['published_at']==os.environ['PUBLISHED_AT']
          pa={a['name']:a for a in p['assets']}
          full=pa[os.environ['FULL_ASSET']]
          receipt=pa[os.environ['RECEIPT_ASSET']]
          assert str(full['id'])==os.environ['FULL_ASSET_ID']
          assert int(full['size'])==int(os.environ['FULL_BYTES'])
          assert full.get('digest')=='sha256:'+os.environ['FULL_SHA256']
          assert str(receipt['id'])==os.environ['RECEIPT_ASSET_ID']
          q=json.load(open('/tmp/public-release.json'))
          assert str(q['id'])==os.environ['PUBLIC_RELEASE_ID']
          assert q['tag_name']==os.environ['PUBLIC_DIST_TAG']
          qa={a['name']:a for a in q['assets']}
          mirror=qa[os.environ['FULL_ASSET']]
          assert str(mirror['id'])==os.environ['PUBLIC_ASSET_ID']
          assert int(mirror['size'])==int(os.environ['FULL_BYTES'])
          assert mirror.get('digest')=='sha256:'+os.environ['FULL_SHA256']
          assert os.environ['P05_BASE'] in (q.get('body') or '')
          print('P05_V1111_PRIVATE_RELEASE_TRUTH=PASS')
          print('P05_V1111_PUBLIC_MIRROR_TRUTH=PASS')
          PY

      - name: Write post-release Current Truth
        working-directory: p05
        run: |
          set -euo pipefail
          git switch -c "$P05_BRANCH"
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          V=os.environ['VERSION']; base=os.environ['P05_BASE']; tree=os.environ['RELEASE_TREE']; cand=os.environ['CANDIDATE_SOURCE']
          sha=os.environ['FULL_SHA256']; files=int(os.environ['FULL_FILES']); size=int(os.environ['FULL_BYTES'])
          rid=int(os.environ['RELEASE_ID']); aid=int(os.environ['FULL_ASSET_ID']); recid=int(os.environ['RECEIPT_ASSET_ID'])
          erun=int(os.environ['EXACT_GATE_RUN']); ejob=int(os.environ['EXACT_GATE_JOB']); prun=int(os.environ['PUBLICATION_RUN']); pjob=int(os.environ['PUBLICATION_JOB'])
          pubrid=int(os.environ['PUBLIC_RELEASE_ID']); pubaid=int(os.environ['PUBLIC_ASSET_ID'])

          # Machine-readable Current Truth.
          p=Path('VF_PROJECT.json'); data=json.loads(p.read_text())
          data.update({
            'status':'V1.1.11_RELEASED / MACHINE_PASS / PRODUCTION_NOT_DEPLOYED',
            'version':V,'target_version':V,'working_version':V,'version_change':False,
            'formal_release':'v'+V,
            'formal_release_state':'RELEASED_CURRENT_MACHINE_PASS_PRODUCTION_NOT_DEPLOYED',
            'formal_release_candidate_commit':cand,
            'formal_release_candidate_tree':tree,
            'formal_release_source':base,
            'formal_release_tree':tree,
            'formal_release_asset':os.environ['FULL_ASSET'],
            'formal_release_asset_files':files,
            'formal_release_asset_bytes':size,
            'formal_release_asset_sha256':sha,
            'formal_release_id':rid,
            'formal_release_asset_id':aid,
            'formal_release_receipt_asset_id':recid,
            'formal_release_exact_source_run':erun,
            'formal_release_exact_source_job':ejob,
            'formal_release_publication_run':prun,
            'formal_release_publication_job':pjob,
            'runtime_recovery_candidate':'V1.1.11_PHP_ONLINE_UPDATE_PASS_CLOSED',
            'runtime_recovery_release':'RELEASED_V1.1.11',
            'production_runtime_acceptance':'V1.1.11_RELEASED_REAL_ENDPOINT_NOT_PROVEN',
            'production_deployment':'NOT_DEPLOYED','production_write':0,
            'working_branch':'main',
            'owner_real_use_review':'V1.1.9_REAL_FAIL_HISTORICAL / V1.1.11_RELEASED_NOT_DEPLOYED',
            'owner_real_use_pass':'NOT_PROVEN_FOR_V1.1.11',
            'candidate_authorization':'CONSUMED_V1.1.11_RELEASED',
            'release_authorization':'CONSUMED_V1.1.11_RELEASED',
            'product_failure':None,
            'runtime_evidence':'docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md',
            'next_action':'V1.1.11 RELEASE CLOSED; FUTURE FORMAL UPDATES VIA BACKEND; PRODUCTION REQUIRES EXPLICIT OWNER AUTHORIZATION',
            'deployment_readiness':'V1.1.11_RELEASED_AWAIT_EXPLICIT_PRODUCTION_DECISION',
          })
          data.setdefault('authority',{})['release']='docs/authority/RELEASE_V1.1.11_CURRENT.md'
          data['authority']['release_candidate']='docs/authority/RELEASE_V1.1.11_CANDIDATE.md'
          data['release_publication']={
            'tag':'v'+V,'release_id':rid,'release_name':'P05 · VF SEO v1.1.11 · PHP Online Update Baseline',
            'target_commit':base,'target_tree':tree,'published_at':os.environ['PUBLISHED_AT'],
            'full_asset':os.environ['FULL_ASSET'],'full_asset_id':aid,'full_files':files,'full_bytes':size,'full_sha256':sha,
            'receipt_asset':os.environ['RECEIPT_ASSET'],'receipt_asset_id':recid,
            'exact_candidate_source':cand,'exact_candidate_run':erun,'exact_candidate_job':ejob,
            'publication_run':prun,'publication_job':pjob,
            'public_distribution_tag':os.environ['PUBLIC_DIST_TAG'],'public_distribution_release_id':pubrid,'public_distribution_asset_id':pubaid,
            'public_distribution_sha256':sha,'server_private_token_required':False,
            'state':'PASS_CLOSED','real_endpoint':'NOT_PROVEN_V1.1.11','production':'NOT_DEPLOYED'
          }
          u=data.setdefault('v1_1_11_php_online_update',{})
          u.update({
            'state':'RELEASED','release_source':base,'release_tree':tree,'formal_release_id':rid,'formal_full_asset_id':aid,
            'formal_receipt_asset_id':recid,'formal_full_files':files,'formal_full_bytes':size,'formal_full_sha256':sha,
            'exact_source':cand,'exact_source_run':erun,'exact_source_job':ejob,'publication_run':prun,'publication_job':pjob,
            'public_distribution_tag':os.environ['PUBLIC_DIST_TAG'],'public_distribution_release_id':pubrid,'public_distribution_asset_id':pubaid,
            'public_distribution_sha256':sha,'real_endpoint_deployment':'NOT_PROVEN','production_state':'NOT_DEPLOYED'
          })
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')

          current=f'''# P05 · VF SEO · V1.1.11 Current Release Authority\n\n## Current Formal Release\n\n```text\nVersion: v1.1.11\nState: RELEASED_CURRENT_MACHINE_PASS\nRelease Source / main: {base}\nRelease Tree: {tree}\nVerified Exact Source: {cand}\nFinal Exact Source Run / Job: {erun} / {ejob}\nPublication Run / Job: {prun} / {pjob}\nRelease ID: {rid}\nFull Asset: {os.environ['FULL_ASSET']}\nFull Asset ID: {aid}\nFull Files: {files}\nFull Bytes: {size}\nFull SHA-256: {sha}\nReceipt Asset ID: {recid}\nPublic Distribution: {os.environ['PUBLIC_DIST_TAG']}\nPublic Distribution Release / Asset: {pubrid} / {pubaid}\nProduction: NOT_DEPLOYED\nProduction Write: 0\n```\n\n## Release Verdict\n\nV1.1.11 的 Final Exact Source Gate 与 Formal Publication 均为 `PASS`。Merge 后 main tree 与 Candidate tree 完全一致。Publication 从 exact main 重新执行 Engineering、PostgreSQL Integration、Security、PHP、Browser-first、dirty-state reinstall、Google Chrome E2E 与真实 public-distribution updater regression，再重新构建 pristine staging 和 deterministic FULL。\n\nPrivate Release 与公开 update mirror 均远端回读为同一 `371150` bytes / `sha256:{sha}`。公开镜像仅是更新分发面，不是 Source Truth 或 Production Truth。\n\n## Online Update Contract\n\n```text\n后台：系统与更新\n→ 检查 public verified distribution\n→ GitHub SHA-256 校验\n→ 自动 SQLite 备份\n→ sibling staging\n→ 保留 VF_INSTALL_INSTANCE.json / private SQLite\n→ 原子切换 Webroot\n→ active OPcache reset；不能 reset 则 fail closed\n→ 保留 rollback tree\n→ 刷新进入新版本\n```\n\n服务器不保存 private GitHub token；正常未来更新不要求 SSH、CLI、手工 `.env` 或 HOME 清理。`v1.1.10 → v1.1.11` 是计划中的最后一次 CloudPanel 手工覆盖；从 v1.1.11 之后，正式后续版本应由后台更新中心安装。\n\n## Real User / Production Boundary\n\nV1.1.11 已达到 `MACHINE_PASS / RELEASED`，但 `seo.kewaro.com` 尚无 v1.1.11 正式 endpoint acceptance 证据，因此不得声明 `REAL_USER_PASS_V1.1.11`。Production 仍为 `NOT_DEPLOYED`，任何正式部署仍需 Owner 单独授权。\n'''
          Path('docs/authority/RELEASE_V1.1.11_CURRENT.md').write_text(current)

          evidence=f'''# P05 · VF SEO · V1.1.11 Formal Publication Evidence\n\n```text\nRelease Source: {base}\nRelease Tree: {tree}\nExact Candidate: {cand}\nMechanism Gate: {os.environ['MECHANISM_RUN']} / {os.environ['MECHANISM_JOB']} · PASS\nFinal Exact Source Gate: {erun} / {ejob} · PASS\nFormal Publication: {prun} / {pjob} · PASS\nRelease ID: {rid}\nFULL Asset ID: {aid}\nReceipt Asset ID: {recid}\nFiles: {files}\nBytes: {size}\nSHA-256: {sha}\nPublic Mirror: {os.environ['PUBLIC_DIST_TAG']}\nPublic Release / Asset: {pubrid} / {pubaid}\nProduction Write: 0\nProduction: NOT_DEPLOYED\n```\n\nPublication PASS covered complete engineering/security regressions, SQLite and PostgreSQL integration, PHP runtime compatibility, Browser-first install, full-Webroot dirty-state reinstall, Google Chrome mobile/desktop E2E, staging byte immutability, PHP updater real download/backup/atomic-swap regression, deterministic FULL double build, private release digest readback, and anonymous public mirror digest readback.\n'''
          Path('docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md').write_text(evidence)

          Path('docs/handoff/CURRENT_STATE.md').write_text(f'''# P05 · VF SEO · Current State\n\n```text\nCurrent Formal Release: v1.1.11 · RELEASED\nRelease Main: {base}\nRelease Tree: {tree}\nFinal Exact Source: {cand}\nFinal Exact Source Gate: {erun} / {ejob} · PASS\nFormal Publication: {prun} / {pjob} · PASS\nRelease ID: {rid}\nFULL: {os.environ['FULL_ASSET']}\nFULL Asset ID: {aid}\nFULL Files: {files}\nFULL Bytes: {size}\nFULL SHA-256: {sha}\nReceipt Asset ID: {recid}\nPublic Update Mirror: {os.environ['PUBLIC_DIST_TAG']} · {pubrid} / {pubaid}\nProduction: NOT_DEPLOYED\nProduction Write: 0\nSchema: VF-SEO-SCHEMA@1 / 1\n```\n\nV1.1.11 建立 PHP/CloudPanel 正式在线更新基线：后台 `系统与更新` 可发现公开 verified FULL，校验 SHA-256，自动备份 SQLite，保留 Runtime Pointer 与 private SQLite，通过 sibling staging 原子切换 Webroot，并对 active OPcache fail closed。服务器无需 private GitHub token，正常未来更新无需 SSH/CLI。\n\n`v1.1.10 → v1.1.11` 是计划中的最后一次手工 CloudPanel 覆盖。从 v1.1.11 以后，后续正式版本应走后台在线更新。\n\n历史真实用户证据继续保留：v1.1.9 fresh reinstall = FAIL。V1.1.11 目前只有正式 Machine/Release PASS；真实 Production endpoint 尚未证明，因此不得写成 REAL_USER_PASS。\n\nNext: Release Closure STOP。Production Deployment 必须由 Owner 另行明确授权。\n''')

          Path('docs/release/README.md').write_text(f'''# P05 Release Documentation\n\n## Current Truth\n\n```text\nCurrent Formal Release: v1.1.11\nRelease Source: {base}\nRelease Tree: {tree}\nFinal Exact Source: {cand}\nFinal Exact Source Gate: {erun} / {ejob} · PASS\nFormal Publication: {prun} / {pjob} · PASS\nFULL: {os.environ['FULL_ASSET']}\nFULL: {files} files / {size} bytes\nSHA-256: {sha}\nPublic Update Mirror: {os.environ['PUBLIC_DIST_TAG']}\nProduction: NOT_DEPLOYED\n```\n\n## Normal Installation\n\n首次安装仍为：上传正式 FULL → 解压到 CloudPanel PHP Webroot → 打开域名 → 创建管理员与密码 → 完成。无需 SSH、CLI、手工 `.env` 或 Migration。\n\n## Normal Update From V1.1.11 Forward\n\n后台 `系统与更新` → 检查更新 → 管理员身份确认 → 在线升级。系统自动校验公开 FULL 的 SHA-256、备份 SQLite、staging、原子切换、保留 Runtime Pointer/private SQLite，并保留 rollback tree。服务器不需要 GitHub 私仓 Token。\n\n`v1.1.10 → v1.1.11` 是最后一次计划中的 CloudPanel 手工更新；v1.1.11 之后的正式版本进入后台在线更新通道。\n\n## Release / Production Boundary\n\nRelease `PASS` 不等于 Production 已部署。当前 `seo.kewaro.com` 未证明运行 v1.1.11，Production 仍为 `NOT_DEPLOYED / PRODUCTION_WRITE=0`。\n''')

          Path('php/README.md').write_text('''# P05 · VF SEO · PHP Runtime\n\nPHP 8.2+ / PDO_SQLite 是正式 CloudPanel Runtime。首次 Browser 安装无需 SSH、CLI、PM2、手工 `.env`、Migration 或 private-data cleanup。\n\n`VF_INSTALL_INSTANCE.json` 缺失 → `/setup`；Setup 成功后最后提交 pointer，绑定 Webroot 同级随机 private runtime。Fresh install 不采用 HOME、旧 SQLite 或 storage-path 环境变量。\n\n从 v1.1.11 起，PHP Runtime 正式提供后台在线更新：`/api/system/update/status` + `/api/system/update/apply`。更新从公开 verified distribution 获取 FULL，校验 GitHub SHA-256，自动备份 SQLite，使用 sibling staging + 原子 Webroot swap，保留 Runtime Pointer/private SQLite/rollback tree。active OPcache 无法 reset 时 fail closed。安装服务器不需要 private GitHub token；正常未来更新不要求 SSH/CLI。\n''')

          readme=Path('README.md').read_text()
          start=readme.index('## Current Truth')
          end=readme.index('## V1.1.10 安装模型')
          head=f'''## Current Truth\n\n```text\nProject: P05 · VF SEO\nRepository: llhzx2018/vf-seo\nCurrent Formal Release: v1.1.11 · RELEASED\nRelease Main: {base}\nVerified Exact Source: {cand}\nVerified Tree: {tree}\nFinal Exact Source Gate: {erun} / {ejob} · PASS\nFormal Publication: {prun} / {pjob} · PASS\nFULL SHA-256: {sha}\nPublic Update Mirror: {os.environ['PUBLIC_DIST_TAG']}\nFormal Production Authority: NOT_DEPLOYED\nProduction Write: 0\nSchema: VF-SEO-SCHEMA@1 / 1\nDefault Database: SQLite\n```\n\n历史真实用户证据继续保留：v1.1.9 fresh reinstall = FAIL。v1.1.11 已达到正式 Machine/Release PASS，但尚未部署并证明真实 endpoint，因此不能声明 `REAL_USER_PASS_V1.1.11`。\n\n## V1.1.11 后台在线更新\n\nV1.1.11 建立 PHP/CloudPanel 正式在线更新基线。当前 v1.1.10 只需最后手工覆盖一次 v1.1.11；之后正式版本通过后台 **系统与更新** 完成。更新流程会自动校验公开 FULL 的 SHA-256、备份 SQLite、staging、原子替换代码、保留 Runtime Pointer/private SQLite 与 rollback tree；服务器无需 private GitHub token，也不要求 SSH/CLI。\n\n'''
          Path('README.md').write_text(readme[:start]+head+readme[end:])

          ch=Path('CHANGELOG.md').read_text()
          section=f'''## 1.1.11 · PHP Online Update Baseline（正式发布 · 2026-08-31）\n\n- 正式 Release：`v1.1.11` / Release ID `{rid}` / FULL `{os.environ['FULL_ASSET']}` / {files} files / {size} bytes / SHA-256 `{sha}`。\n- 新增 PHP-native `/api/system/update/status` 与 `/api/system/update/apply`，后台增加明显的 `系统与更新` 入口。\n- 安装服务器不保存 private GitHub Token；更新从 public verified distribution `{os.environ['PUBLIC_DIST_TAG']}` 获取正式 FULL，并校验 GitHub SHA-256。\n- 在线升级自动创建 SQLite recovery point，使用 sibling staging + atomic Webroot swap，保留 `VF_INSTALL_INSTANCE.json`、private SQLite 与 rollback tree。\n- active OPcache 使用运行态检测；无法安全 reset 时 fail closed，避免“磁盘新版、FPM 仍执行旧 opcode”。\n- Final Mechanism Gate `{os.environ['MECHANISM_RUN']}`、Exact Source Gate `{erun}`、Formal Publication `{prun}` 全部 PASS；Google Chrome / dirty-state reinstall / deterministic FULL / anonymous public mirror digest 均 PASS。\n- `v1.1.10 → v1.1.11` 是计划中的最后一次 CloudPanel 手工覆盖；v1.1.11 之后的正式更新应由后台在线更新完成。\n- Production 继续 `NOT_DEPLOYED / PRODUCTION_WRITE=0`；真实 endpoint v1.1.11 尚未证明。\n\n'''
          if '## 1.1.11 · PHP Online Update Baseline' not in ch:
              ch=ch.replace('# 变更记录\n\n','# 变更记录\n\n'+section,1)
          ch=ch.replace('## 1.1.10 · Runtime Pointer Install Model（Candidate · 2026-08-30）','## 1.1.10 · Runtime Pointer Install Model（正式发布 · 2026-08-30）',1)
          ch=ch.replace('- 仍为 Candidate；完整 Exact Source Gate PASS 后才允许 Release。Production 继续 NOT_DEPLOYED。','- 后续完成 Exact Source Gate 与 Formal Publication 并正式发布 v1.1.10；该版本现为历史正式 Release，已由 v1.1.11 取代。Production 未自动部署。',1)
          Path('CHANGELOG.md').write_text(ch)
          PY

          expected='CHANGELOG.md README.md VF_PROJECT.json docs/authority/RELEASE_V1.1.11_CURRENT.md docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md docs/handoff/CURRENT_STATE.md docs/release/README.md php/README.md'
          actual="$(git diff --name-only | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected"
          test "$(cat VERSION)" = "1.1.11"
          node -e "const v=require('./VF_PROJECT.json'); if(v.status!=='V1.1.11_RELEASED / MACHINE_PASS / PRODUCTION_NOT_DEPLOYED'||v.formal_release!=='v1.1.11'||v.production_deployment!=='NOT_DEPLOYED'||v.production_write!==0||v.release_publication.public_distribution_sha256!='$FULL_SHA256') process.exit(1)"
          grep -q 'Current Formal Release: v1.1.11' README.md
          grep -q '系统与更新' README.md
          grep -q 'V1.1.11_RELEASED' VF_PROJECT.json

      - name: Commit and push closure branch
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name "VF Public Runner"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CHANGELOG.md VF_PROJECT.json php/README.md docs/release/README.md docs/handoff/CURRENT_STATE.md docs/authority/RELEASE_V1.1.11_CURRENT.md docs/evidence/FORMAL_PUBLICATION_V1.1.11_20260831.md
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git commit -m "docs(P05): close v1.1.11 release and update authority"
          git push origin "HEAD:$P05_BRANCH"
          echo "P05_V1111_CLOSURE_HEAD=$(git rev-parse HEAD)"
          echo "P05_RELEASE_SOURCE_IMMUTABLE=$P05_BASE"
          echo "P05_PRODUCTION_WRITE=0"
