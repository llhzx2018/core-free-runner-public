name: P05 V1.2.3 Atomic Asset Publication

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v123-atomic-publish-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v123-atomic-publish-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATOMIC_RUN: '33548178743'
      ATOMIC_JOB: '99990780962'
      ATOMIC_ARTIFACT_ID: '9816329162'
      ATOMIC_ARTIFACT_NAME: P05_V1.2.3_VPS_ATOMIC_8f064bb7a0e59a36ddc985b3c728683dccaa2e71
      RELEASE_ID: '380755611'
      RELEASE_TAG: v1.2.3
      RELEASE_TARGET: 66a56dafdfba2ca7243d1984791ecbe0fd7382ae
      FULL_NAME: VF_SEO_V1.2.3_FULL.zip
      FULL_SHA256: 66621da7ed5d426cc7c1367a37ac5bbf463617daa5e71745a462f2c3ced44112
      UPDATE_SHA256: 0de26614f5269ba5d1f6ace343b6853a82a4fb3e3bcbe5be85e3ad683f48588d
      UPDATE_BYTES: '1173998'
      REPAIR_SHA256: 378c1ed64e86eb2ac79a8e40ca5feaa3bd7f3cd2ff41b05bf1daedead0e5ff63
      REPAIR_BYTES: '3671457'
    steps:
      - name: Bind exact Atomic PASS and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ATOMIC_ARTIFACT_ID" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); art=json.load(open('/tmp/artifact.json'))
          assert run['id']==int(os.environ['ATOMIC_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['ATOMIC_JOB']) and job['run_id']==int(os.environ['ATOMIC_RUN']) and job['conclusion']=='success' and job['name']=='atomic'
          assert art['id']==int(os.environ['ATOMIC_ARTIFACT_ID']) and art['name']==os.environ['ATOMIC_ARTIFACT_NAME'] and not art['expired']
          print('P05_V123_ATOMIC_EVIDENCE_BINDING=PASS')
          PY

      - name: Download exact Atomic evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic
          gh run download "$ATOMIC_RUN" --repo llhzx2018/core-free-runner-public --name "$ATOMIC_ARTIFACT_NAME" --dir /tmp/p05-atomic
          find /tmp/p05-atomic -maxdepth 2 -type f -printf '%f\n' | sort

      - name: Verify exact six Atomic assets and derive final authority
        run: |
          set -Eeuo pipefail
          cd /tmp/p05-atomic
          names=(repair-v1.2.3.php VF_SEO_V1.2.3_UPDATE.zip atomic-self-test.json P05-V1.2.3-ATOMIC-METADATA.json P05-V1.2.3-ATOMIC-GATE.json SHA256SUMS.txt)
          for f in "${names[@]}"; do test -s "$f"; done
          test "$(sha256sum VF_SEO_V1.2.3_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c%s VF_SEO_V1.2.3_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum repair-v1.2.3.php | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(stat -c%s repair-v1.2.3.php)" = "$REPAIR_BYTES"
          python3 - <<'PY'
          import json
          gate=json.load(open('P05-V1.2.3-ATOMIC-GATE.json'))
          meta=json.load(open('P05-V1.2.3-ATOMIC-METADATA.json'))
          assert gate['project_id']=='P05' and gate['source_version']=='1.2.2' and gate['target_version']=='1.2.3' and gate['result']=='PASS'
          for k in ['self_test','actual_upgrade','data_preservation','idempotence','rollback','interruption_recovery','browser_single_php','proxy_https_same_origin']:
              assert gate[k]=='PASS', (k,gate.get(k))
          assert gate['production_write']==0 and gate['distribution_revision']=='R2'
          assert meta['source_version']=='1.2.2' and meta['target_version']=='1.2.3' and meta['status']=='FORMAL_ATOMIC_ARTIFACT_GATE_PASS'
          assert meta['proxy_https_same_origin']=='PASS' and meta['distribution_revision']=='R2' and meta['production_write']==0
          print('P05_V123_ATOMIC_JSON_AUTHORITY=PASS')
          PY
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib,pathlib,os
          names=['repair-v1.2.3.php','VF_SEO_V1.2.3_UPDATE.zip','atomic-self-test.json','P05-V1.2.3-ATOMIC-METADATA.json','P05-V1.2.3-ATOMIC-GATE.json','SHA256SUMS.txt']
          with open('/tmp/final-assets.env','w') as out:
              for n in names:
                  p=pathlib.Path(n); h=hashlib.sha256(p.read_bytes()).hexdigest(); b=p.stat().st_size
                  key=n.upper().replace('.','_').replace('-','_')
                  out.write(f'{key}_SHA256={h}\n{key}_BYTES={b}\n')
                  print(f'P05_LOCAL_{key}_SHA256={h}')
                  print(f'P05_LOCAL_{key}_BYTES={b}')
          PY
          cat /tmp/final-assets.env >> "$GITHUB_ENV"
          echo P05_V123_ATOMIC_SIX_ASSETS_LOCAL=PASS

      - name: Verify formal Release before supplemental write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          forbidden=['repair-v1.2.3.php','VF_SEO_V1.2.3_UPDATE.zip','atomic-self-test.json','P05-V1.2.3-ATOMIC-METADATA.json','P05-V1.2.3-ATOMIC-GATE.json','SHA256SUMS.txt']
          assert all(x not in a for x in forbidden), [x for x in forbidden if x in a]
          print('P05_V123_RELEASE_PRE_SUPPLEMENT=PASS')
          PY

      - name: Publish exact Atomic assets to v1.2.3 Release
        working-directory: /tmp/p05-atomic
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" --repo llhzx2018/vf-seo \
            VF_SEO_V1.2.3_UPDATE.zip \
            repair-v1.2.3.php \
            atomic-self-test.json \
            P05-V1.2.3-ATOMIC-METADATA.json \
            P05-V1.2.3-ATOMIC-GATE.json \
            SHA256SUMS.txt
          echo P05_V123_ATOMIC_RELEASE_UPLOAD=PASS

      - name: Remote readback all v1.2.3 Release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os,hashlib,pathlib
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.3.php','VF_SEO_V1.2.3_UPDATE.zip','atomic-self-test.json','P05-V1.2.3-ATOMIC-METADATA.json','P05-V1.2.3-ATOMIC-GATE.json','SHA256SUMS.txt']
          for name in names:
              p=pathlib.Path('/tmp/p05-atomic')/name
              digest=hashlib.sha256(p.read_bytes()).hexdigest(); size=p.stat().st_size
              assert a[name]['digest']=='sha256:'+digest, (name,a[name].get('digest'),digest)
              assert a[name]['size']==size, (name,a[name].get('size'),size)
              print(f'P05_ASSET_{name}_ID={a[name]["id"]}')
              print(f'P05_ASSET_{name}_SHA256={digest}')
              print(f'P05_ASSET_{name}_BYTES={size}')
          assert a['VF_SEO_V1.2.3_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          assert a['repair-v1.2.3.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V123_ATOMIC_RELEASE_REMOTE_READBACK=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY