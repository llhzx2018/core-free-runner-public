name: P01 2.47.516 exact source integrated 3-engine Owner domains and resource
on:
  push:
    branches:
      - test/p01-247516-integrated-3db-20261113

permissions:
  contents: read

jobs:
  d60-real-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm original P01 and public-safe transient source lane
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-247516-integrated-3db-20261113"
          test -n "$PRIVATE_READ"
          echo "P01_D60_SCOPE=THREE_REAL_DATABASE_SELECTED_ENGINE_FULL_LARAVEL_OWNER_CANONICAL_HTTP"
          echo "P01_PRODUCTION_OR_RELEASE_WRITES=NONE"
      - name: Exact PRIVATE source in temporary self-cleaning workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 2a96f13aa3e01b545107f1f91b80787d519fb39e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify source and native HTTP probe syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "2a96f13aa3e01b545107f1f91b80787d519fb39e"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          php -l candidate/src/app/next/OwnerResourceCenter.php > "$RUNNER_TEMP/d60-lint.txt"
          php -l candidate/src/app/next/http/OwnerHttpRoutes.php > "$RUNNER_TEMP/d60-route-lint.txt"
          echo "P01_D60_EXACT_SOURCE=2a96f13aa3e01b545107f1f91b80787d519fb39e"
          echo "P01_D60_SYNTAX_AND_TARGET_IDENTITY=PASS"
      - name: Install real native TLS Nginx PHP-FPM plus locked Composer environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d60-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            composer openssl unzip >> "$RUNNER_TEMP/d60-apt.txt" 2>&1
          command -v php-fpm8.3
          command -v nginx
          command -v composer
          echo "P01_D60_NATIVE_HTTPS_FPM_RUNTIME_READY=PASS"
      - name: Single genuine complete Composer plus Vite packaged CloudPanel FULL, source-bound
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 2a96f13aa3e01b545107f1f91b80787d519fb39e \
            --output "$RUNNER_TEMP/d60-full.zip" --composer composer \
            > "$RUNNER_TEMP/d60-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/d60-full.zip" \
            > "$RUNNER_TEMP/d60-build-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/d60-full.zip" \
            --output "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d60-cloudpanel.zip"
          echo "P01_D60_ONE_COMPLETE_CLOUDPANEL_FULL_PACKAGE=PASS"
      - name: Genuine SQLite isolated TLS CloudPanel install Owner auth canonical cross-domain CRUD and index
        id: sqlite_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine sqlite \
            > "$RUNNER_TEMP/d60-sqlite.txt" 2>&1; then
            echo "P01_D60_SQLITE_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-sqlite.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-sqlite.txt"
          echo "P01_D60_SQLITE_REAL_FULL=PASS"
      - name: Genuine MariaDB 11.8 distinct installed FULL canonical cross-domain identity and writer parity
        id: mariadb_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine mariadb \
            > "$RUNNER_TEMP/d60-maria.txt" 2>&1; then
            echo "P01_D60_MARIADB_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-maria.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-maria.txt"
          echo "P01_D60_MARIADB_REAL_FULL=PASS"
      - name: Genuine MySQL 8.4 distinct installed FULL canonical cross-domain identity and writer parity
        id: mysql_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine mysql \
            > "$RUNNER_TEMP/d60-mysql.txt" 2>&1; then
            echo "P01_D60_MYSQL_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-mysql.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-mysql.txt"
          echo "P01_D60_MYSQL_REAL_FULL=PASS"
      - name: All three real database integration tests must pass
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.sqlite_probe.outcome }}' = success
          test '${{ steps.mariadb_probe.outcome }}' = success
          test '${{ steps.mysql_probe.outcome }}' = success
          echo "P01_D60_3_REAL_DB_FINAL_PROBES=PASS"
      - name: Verify six complete legacy-compatible Owner CRUD domains on all three real installed engines
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "2a96f13aa3e01b545107f1f91b80787d519fb39e"
          failed=0
          for engine in sqlite mariadb mysql; do
            for suite in d45_owner_links d46_owner_music d47_owner_channels d48_owner_watch d49_owner_topics d50_owner_projects; do
              log="$RUNNER_TEMP/p01-${engine}-${suite}.txt"
              echo "P01_247516_BEGIN=${engine}/${suite}"
              if python3 "candidate/tests/compatibility/laravel/http/run_${suite}_http.py" \
                --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine "$engine" > "$log" 2>&1; then
                grep -E '^P01_D[0-9]+_.*=PASS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "2a96f13aa3e01b545107f1f91b80787d519fb39e"
          echo "P01_D60_EXACT_SOURCE_READBACK=PASS"
          echo "P01_D60_OWNER_REAL_PRODUCTION_CLOUDPANEL=NOT_PROVEN"
          echo "P01_D60_PRODUCTION_AUTO_APPLY=NO"
      - name: Always remove private exact source, compiled packages and synthetic logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/d60-*.txt "$RUNNER_TEMP"/d60-*.zip "$RUNNER_TEMP"/p01-*.txt
          echo "P01_D60_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D60_RELEASE_OR_PRIVATE_PACKAGE_PERSISTED=NO"
          echo "P01_D60_PUBLIC_PRIVATE_ARTIFACTS=NONE"
 "$log" || true
                echo "P01_247516_${engine}_${suite}=PASS"
              else
                echo "P01_247516_${engine}_${suite}=FAIL"
                grep -E '^RuntimeError:|^P01_|^[A-Za-z]+Error:' "$log" | tail -n 25 || true
                failed=1
              fi
            done
          done
          test "$failed" = "0"
          echo "P01_247516_SIX_DOMAINS_THREE_ENGINE_REAL_HTTPS_AUTH_CSRF_CRUD=PASS"
      - name: Native query+schema scope and private full-sandbox cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "2a96f13aa3e01b545107f1f91b80787d519fb39e"
          echo "P01_D60_EXACT_SOURCE_READBACK=PASS"
          echo "P01_D60_OWNER_REAL_PRODUCTION_CLOUDPANEL=NOT_PROVEN"
          echo "P01_D60_PRODUCTION_AUTO_APPLY=NO"
      - name: Always remove private exact source, compiled packages and synthetic logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/d60-*.txt "$RUNNER_TEMP"/d60-*.zip
          echo "P01_D60_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D60_RELEASE_OR_PRIVATE_PACKAGE_PERSISTED=NO"
          echo "P01_D60_PUBLIC_PRIVATE_ARTIFACTS=NONE"
