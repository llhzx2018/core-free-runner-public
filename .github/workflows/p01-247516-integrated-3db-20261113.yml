name: P01 2.47.517 exact source integrated 3-engine Owner domains and resource
# D82 first active PR synchronization: real SHA e14db68
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TARGET_VERSION: 2.47.517
  TARGET_SHA: 015157e6ee0fea6d5aa4c72db62a3374e99162bc
  TARGET_TREE: 9a9f39dd6eaa98b3cce83027b936a2521b4044db

jobs:
  d60-real-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm original P01 and public-safe transient source lane
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_HEAD_REF" = "test/p01-247517-three-engine-whole-site-20261116"
          test -n "$PRIVATE_READ"
          echo "P01_D60_SCOPE=THREE_REAL_DATABASE_SELECTED_ENGINE_FULL_LARAVEL_OWNER_CANONICAL_HTTP"
          echo "P01_PRODUCTION_OR_RELEASE_WRITES=NONE"
      - name: Source-bound D81 one-off spec and final workflow identity audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner-public
      - name: Verify public workflow bound to one immutable P01 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner-public/scripts/ephemeral_lane_spec.py validate --spec runner-public/scripts/ephemeral/p01-d81-retention.json
          python3 runner-public/scripts/ephemeral_lane_spec.py audit-rendered --spec runner-public/scripts/ephemeral/p01-d81-retention.json --input runner-public/.github/workflows/p01-247516-integrated-3db-20261113.yml
          echo P01_D81_ONE_OFF_LANE_IDENTITY_AUDIT=PASS
      - name: Exact PRIVATE source in temporary self-cleaning workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify source and native HTTP probe syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          test -f candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d4[5-9]*_http.py candidate/tests/compatibility/laravel/http/run_d50_owner_projects_http.py
          php -l candidate/src/app/next/OwnerResourceCenter.php > "$RUNNER_TEMP/d60-lint.txt"
          php -l candidate/src/app/next/http/OwnerHttpRoutes.php > "$RUNNER_TEMP/d60-route-lint.txt"
          php -l candidate/src/app/next/http/OwnerHttpRoutesLibrary.php > /dev/null
          php -l candidate/src/app/next/OwnerJobRuntime.php > /dev/null
          test -f candidate/src/app/next/frontend/src/OwnerJobs.vue
          echo P01_D78_JOB_RUNTIME_SYNTAX_AND_UI_SOURCE=PASS
          echo P01_D78_SQLITE_RESULT_REFERENCE_FIX_SOURCE=$TARGET_SHA
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d77_jobs_failclosed.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d79_job_crash_recovery.py
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d81_retention_cleanup.py
          php -l candidate/src/app/next/OwnerJobMaintenance.php > /dev/null
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d82_link_health_worker.py
          php -l candidate/src/app/next/OwnerSafeHttpProbe.php > /dev/null
          php -l candidate/src/app/next/OwnerLinkHealthWorker.php > /dev/null
          php -l candidate/tests/compatibility/laravel/http/d82_health_provider_contract.php > /dev/null
          php -l candidate/src/app/next/OwnerIconFetch.php > /dev/null
          php -l candidate/src/app/next/OwnerIconWorker.php > /dev/null
          php -l candidate/tests/compatibility/laravel/http/d83_icon_media_contract.php > /dev/null
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d83_icon_media.py
          php -l candidate/src/app/next/OwnerBackupFileAudit.php > /dev/null
          php -l candidate/tests/compatibility/laravel/http/d84_backup_file_fixture.php > /dev/null
          python3 -m py_compile candidate/tests/compatibility/laravel/http/d84_backup_file_audit.py
          test -f candidate/src/app/next/frontend/tests/owner-jobs.spec.ts
          echo P01_D77_NATIVE_JOB_FAILCLOSED_PROBE_WIRED=YES
          echo "P01_D60_EXACT_SOURCE=$TARGET_SHA"
          echo "P01_D60_SYNTAX_AND_TARGET_IDENTITY=PASS"
      - name: Install real native TLS Nginx PHP-FPM plus locked Composer environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d60-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            composer openssl unzip >> "$RUNNER_TEMP/d60-apt.txt" 2>&1
          command -v php-fpm8.3
          command -v nginx
          command -v composer
          echo "P01_D60_NATIVE_HTTPS_FPM_RUNTIME_READY=PASS"
      - name: Single genuine complete Composer plus Vite packaged CloudPanel FULL, source-bound
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha $TARGET_SHA \
            --output "$RUNNER_TEMP/d60-full.zip" --composer composer \
            > "$RUNNER_TEMP/d60-build.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/d60-full.zip" \
            > "$RUNNER_TEMP/d60-build-verify.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/d60-full.zip" \
            --output "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/d60-cloudpanel.zip" \
            > "$RUNNER_TEMP/d60-layout-verify.txt" 2>&1
          test -s "$RUNNER_TEMP/d60-cloudpanel.zip"
          echo "P01_D60_ONE_COMPLETE_CLOUDPANEL_FULL_PACKAGE=PASS"
      - name: Genuine SQLite isolated TLS CloudPanel install Owner auth canonical cross-domain CRUD and index
        id: sqlite_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine sqlite \
            > "$RUNNER_TEMP/d60-sqlite.txt" 2>&1; then
            echo "P01_D60_SQLITE_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|^P01_D82_|^P01_D84_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-sqlite.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-sqlite.txt"
          echo "P01_D60_SQLITE_REAL_FULL=PASS"
      - name: Genuine MariaDB 11.8 distinct installed FULL canonical cross-domain identity and writer parity
        id: mariadb_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine mariadb \
            > "$RUNNER_TEMP/d60-maria.txt" 2>&1; then
            echo "P01_D60_MARIADB_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|^P01_D82_|^P01_D84_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-maria.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-maria.txt"
          echo "P01_D60_MARIADB_REAL_FULL=PASS"
      - name: Genuine MySQL 8.4 distinct installed FULL canonical cross-domain identity and writer parity
        id: mysql_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! python3 candidate/tests/compatibility/laravel/http/run_d60_resource_center_http.py \
            --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine mysql \
            > "$RUNNER_TEMP/d60-mysql.txt" 2>&1; then
            echo "P01_D60_MYSQL_REAL_FULL=FAIL"
            grep -E '^RuntimeError:|^P01_D60_|^P01_D82_|^P01_D84_|D14_STAGE_FAILED|D60_' "$RUNNER_TEMP/d60-mysql.txt" | tail -n 40 || true
            exit 1
          fi
          grep '^P01_D60_.*=PASS$' "$RUNNER_TEMP/d60-mysql.txt"
          echo "P01_D60_MYSQL_REAL_FULL=PASS"
      - name: All three real database integration tests must pass
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test '${{ steps.sqlite_probe.outcome }}' = success
          test '${{ steps.mariadb_probe.outcome }}' = success
          test '${{ steps.mysql_probe.outcome }}' = success
          echo "P01_D60_3_REAL_DB_FINAL_PROBES=PASS"
          for item in sqlite maria mysql; do
            label="$(echo "$item" | tr '[:lower:]' '[:upper:]')"
            if [ "$item" = maria ]; then label=MARIADB; fi
            grep -Fx "P01_D81_${label}_REAL_SQL_RETENTION_BOUNDED=PASS" "$RUNNER_TEMP/d60-$item.txt"
            grep -Fx "P01_D81_${label}_PROTECTED_BACKUPS_NOT_DELETED=PASS" "$RUNNER_TEMP/d60-$item.txt"
            grep -Fx "P01_D81_${label}_RETRY_READBACK_NO_PHANTOM_SUCCESS=PASS" "$RUNNER_TEMP/d60-$item.txt"
          done
          echo "P01_D81_3DB_RETENTION_BACKUP_SAFETY=PASS"
          for item in sqlite maria mysql; do
            label="$(echo "$item" | tr '[:lower:]' '[:upper:]')"
            if [ "$item" = maria ]; then label=MARIADB; fi
            for check in REAL_LINK_AND_AFFILIATE_WORKERS PUBLIC_PINNED_DNS_SSRF_GUARD HISTORY_AND_STATUS_NO_PHANTOM PROVIDER_CLASSIFICATION_SUCCESS_404_REDIRECT; do
              grep -Fx "P01_D82_${label}_${check}=PASS" "$RUNNER_TEMP/d60-$item.txt"
            done
          done
          echo "P01_D82_3DB_REAL_LINK_AFFILIATE_SSRF_STATUS=PASS"
          for engine in sqlite maria mysql; do
            label="$(echo "$engine" | tr '[:lower:]' '[:upper:]')"
            if [ "$engine" = maria ]; then label=MARIADB; fi
            for kind in REAL_ICON_MEDIA_AND_OWNER_PREVIEW PRIVATE_USER_ICON_SVG_AND_URL_TOKEN_FENCE OWNER_HTTP_ICON_DISPATCH_CSRF; do
              grep -Fx "P01_D83_${label}_${kind}=PASS" "$RUNNER_TEMP/d60-$engine.txt"
            done
          done
          echo "P01_D83_THREE_DB_PRIVATE_OWNER_ICON_MEDIA=PASS"
          for engine in sqlite maria mysql; do
            label="$(echo "$engine" | tr '[:lower:]' '[:upper:]')"
            if [ "$engine" = maria ]; then label=MARIADB; fi
            for check in REAL_BACKUP_FILE_SHA256_TAMPER_SYMLINK PROTECTED_RECORDS_NOT_REWRITTEN_OR_DELETED NO_DECRYPT_OR_RESTORE_CLAIM; do
              grep -Fx "P01_D84_${label}_${check}=PASS" "$RUNNER_TEMP/d60-$engine.txt"
            done
          done
          echo "P01_D84_3DB_BACKUP_FILE_ONLY_AUDIT=PASS"
      - name: Real Chromium all 12 Owner workspaces 390 768 1440 and D79 task UX
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          test -d node_modules
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/d79-chromium.txt" 2>&1 || {
            echo P01_D79_CHROMIUM_INSTALL=FAIL
            grep -E '^Error|failed|Missing' "$RUNNER_TEMP/d79-chromium.txt" | tail -n 8 || true
            exit 1
          }
          if ! CI=1 npm run test:e2e > "$RUNNER_TEMP/d79-browser.txt" 2>&1; then
            echo P01_D79_BROWSER_COMPLETE_WORKBENCH=FAIL
            grep -E '([0-9]+ failed|Error:|Timed out|✘|\bfailed\b|expected|received)' "$RUNNER_TEMP/d79-browser.txt" | tail -n 38 || true
            exit 1
          fi
          grep -E '[0-9]+ passed' "$RUNNER_TEMP/d79-browser.txt" | tail -n 2
          echo P01_D79_ALL_OWNER_BROWSER_E2E_390_768_1440=PASS
      - name: Twelve private workspaces and News Courses Software real business flows from installed FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          for engine in sqlite maria mysql; do
            label="$(echo "$engine" | tr '[:lower:]' '[:upper:]')"
            if [ "$engine" = maria ]; then label=MARIADB; fi
            log="$RUNNER_TEMP/d60-$engine.txt"
            test -s "$log"
            grep -Fx "P01_D74_12_GUEST_OWNER_LOGOUT_BOUNDARIES_${label}=PASS" "$log"
            grep -Fx "P01_D76_THREE_DEEP_OWNER_WORKFLOWS_${label}=PASS" "$log"
            grep -Fx "P01_D76_NEWS_CACHE_READ_MARK_INBOX_OWNER_${label}=PASS" "$log"
            grep -Fx "P01_D76_COURSE_ZIP_UPLOAD_CHAPTER_ROLLBACK_GUEST_${label}=PASS" "$log"
            grep -Fx "P01_D76_SOFTWARE_REAL_CANONICAL_RECOVERY_${label}=PASS" "$log"
          done
          echo "P01_247517_TWELVE_WORKSPACES_THREE_ENGINES=PASS"
      - name: Verify six complete legacy-compatible Owner CRUD domains on all three real installed engines
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          failed=0
          for engine in sqlite mariadb mysql; do
            for suite in d45_owner_links d46_owner_music d47_owner_channels d48_owner_watch d49_owner_topics d50_owner_projects; do
              # D14 requires a truly empty SQL schema for every independent fresh site.
              # ONLY the fixed disposable Docker service databases may be cleared.
              if [ "$engine" != sqlite ]; then
                if [ "$engine" = mariadb ]; then
                  port=3307; database=p01_d1_test_maria_20261111
                else
                  port=3306; database=p01_d1_test_mysql_20261111
                fi
                php -r '$n=$argv[2]; if(!in_array($n,["p01_d1_test_maria_20261111","p01_d1_test_mysql_20261111"],true))exit(88); $p=new PDO("mysql:host=127.0.0.1;port=".$argv[1].";charset=utf8mb4","root","p01-only-synthetic-test",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $p->exec("DROP DATABASE IF EXISTS `".$n."`"); $p->exec("CREATE DATABASE `".$n."` CHARACTER SET utf8mb4");' "$port" "$database"
              fi
              log="$RUNNER_TEMP/p01-${engine}-${suite}.txt"
              echo "P01_247517_BEGIN=${engine}/${suite}"
              if python3 "candidate/tests/compatibility/laravel/http/run_${suite}_http.py" \
                --bundle "$RUNNER_TEMP/d60-cloudpanel.zip" --engine "$engine" > "$log" 2>&1; then
                grep -E '^P01_D[0-9]+_.*=PASS$' "$log" || true
                echo "P01_247517_${engine}_${suite}=PASS"
              else
                echo "P01_247517_${engine}_${suite}=FAIL"
                grep -E '^RuntimeError:|^P01_|^[A-Za-z]+Error:' "$log" | tail -n 25 || true
                failed=1
              fi
            done
          done
          test "$failed" = "0"
          echo "P01_247517_SIX_DOMAINS_THREE_ENGINE_REAL_HTTPS_AUTH_CSRF_CRUD=PASS"
      - name: Native query+schema scope and private full-sandbox cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          echo "P01_D60_EXACT_SOURCE_READBACK=PASS"
          echo "P01_D60_OWNER_REAL_PRODUCTION_CLOUDPANEL=NOT_PROVEN"
          echo "P01_D60_PRODUCTION_AUTO_APPLY=NO"
      - name: Always remove private exact source, compiled packages and synthetic logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/d60-*.txt "$RUNNER_TEMP"/d60-*.zip "$RUNNER_TEMP"/p01-*.txt
          rm -f -- "$RUNNER_TEMP"/d79-chromium.txt "$RUNNER_TEMP"/d79-browser.txt
          echo "P01_D60_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D60_RELEASE_OR_PRIVATE_PACKAGE_PERSISTED=NO"
          echo "P01_D60_PUBLIC_PRIVATE_ARTIFACTS=NONE"
