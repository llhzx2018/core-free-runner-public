name: S01-C02-C03 Private Asset Auth Corrective Formal Release

on:
  push:
    branches: [task/s01-private-asset-download-auth-corrective]
    paths: ['.github/workflows/s01-c02-c03-private-asset-corrective-formal-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s01-c02-c03-private-asset-corrective-formal-release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.component }} corrective formal release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repository: llhzx2018/vf-tools-ops
            target_commit: 01f111cff3c7a423343e9ba3374dd8702bfdfe06
            target_tree: b38a9bc4229884af3f34a0604ce88624eb571d77
            version: 1.21.791
            tag: v1.21.791
            release_name: VF Tools Ops V1.21.791
            source_root: .
            package_root: vf-ops
            asset_name: vf-tools-ops_V1.21.791.zip
            expected_bytes: '3177006'
            expected_sha256: 448240d7c70d7744ca147e3642849980d295ad0a11f371e660143ef55781756e
            expected_runtime_files: '889'
            expected_runtime_fp: 326daa1186127e6ebe002580c0ea642d188f97d4f1fc09bd1c7d5beefbf855af
          - component: M3U8
            repository: llhzx2018/vf-tools-m3u8
            target_commit: 4db0265c346dbabe91f206af33a16dba77bb2939
            target_tree: f0b93ad406af9cead107714a6b8a15fc709966cc
            version: 1.25.3
            tag: v1.25.3
            release_name: VF Tools M3U8 V1.25.3
            source_root: src
            package_root: vf-tool-m3u8
            asset_name: vf-tools-m3u8_V1.25.3.zip
            expected_bytes: '3486647'
            expected_sha256: e412ead7c1c07aca53e5460a975839544d2515121cac0dc4b2b525a7b6dbbcf6
            expected_runtime_files: '547'
            expected_runtime_fp: ed2e1d7bf6508196654294c533ee35d9f557081312d437bbe86e2363508c624e

    env:
      COMPONENT: ${{ matrix.component }}
      TARGET_REPOSITORY: ${{ matrix.repository }}
      TARGET_COMMIT: ${{ matrix.target_commit }}
      TARGET_TREE: ${{ matrix.target_tree }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
      RELEASE_NAME: ${{ matrix.release_name }}
      SOURCE_ROOT: ${{ matrix.source_root }}
      PACKAGE_ROOT: ${{ matrix.package_root }}
      ASSET_NAME: ${{ matrix.asset_name }}
      EXPECTED_BYTES: ${{ matrix.expected_bytes }}
      EXPECTED_SHA256: ${{ matrix.expected_sha256 }}
      EXPECTED_RUNTIME_FILES: ${{ matrix.expected_runtime_files }}
      EXPECTED_RUNTIME_FP: ${{ matrix.expected_runtime_fp }}

    steps:
      - name: Release credential gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo 'PRIVATE_READ_TOKEN_PRESENT=PASS'
          echo 'RELEASE_WRITE_TOKEN_PRESENT=PASS'

      - name: Checkout exact corrective candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.target_commit }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Exact candidate commit tree and develop readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          DEV="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/develop" | jq -r '.commit.sha')"
          test "$DEV" = "$TARGET_COMMIT"
          echo 'CANDIDATE_COMMIT_TREE=PASS'
          echo 'DEVELOP_EXACT_CANDIDATE=PASS'

      - name: Deterministically rebuild exact tested candidate artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,re,zipfile,os
          from pathlib import Path
          comp=os.environ['COMPONENT']; root=Path('candidate' if comp=='OPS' else 'candidate/src'); slug=os.environ['PACKAGE_ROOT']; out=Path('/tmp')/os.environ['ASSET_NAME']
          def keep(rel):
              p=rel.as_posix();parts=p.split('/');low=[x.lower() for x in parts]
              if any(x in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in low): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if comp=='OPS': return (len(parts)==1 and p in {'vf-ops.php','uninstall.php'}) or parts[0] in {'includes','assets','languages','config'}
              return (len(parts)==1 and p in {'vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json'}) or parts[0] in {'admin','config','includes','public','templates','tools'}
          files={f.relative_to(root).as_posix():f.read_bytes() for f in root.rglob('*') if f.is_file() and not f.is_symlink() and keep(f.relative_to(root))}; files=dict(sorted(files.items()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in files.items():
                  zi=zipfile.ZipInfo(slug+'/'+rel,(2026,8,16,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
          h=hashlib.sha256()
          for rel,b in files.items(): h.update(rel.encode());h.update(b'\0');h.update(hashlib.sha256(b).hexdigest().encode());h.update(b'\n')
          actual=(out.stat().st_size,hashlib.sha256(out.read_bytes()).hexdigest(),len(files),h.hexdigest())
          expected=(int(os.environ['EXPECTED_BYTES']),os.environ['EXPECTED_SHA256'],int(os.environ['EXPECTED_RUNTIME_FILES']),os.environ['EXPECTED_RUNTIME_FP'])
          if actual!=expected: raise SystemExit(f'candidate artifact mismatch: {actual} != {expected}')
          print('TESTED_CANDIDATE_ARTIFACT_REBUILT_EXACT=PASS')
          PY
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null
          echo 'ZIP_INTEGRITY=PASS'

      - name: Confirm new tag and release do not already exist
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_HTTP="$(curl -sS -o /tmp/tag-before.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          REL_HTTP="$(curl -sS -o /tmp/release-before.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")"
          test "$TAG_HTTP" = 404
          test "$REL_HTTP" = 404
          echo 'NEW_CORRECTIVE_RELEASE_IDENTITY_AVAILABLE=PASS'

      - name: Create immutable corrective tag and release
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          jq -n --arg ref "refs/tags/${TAG}" --arg sha "$TARGET_COMMIT" '{ref:$ref,sha:$sha}' >/tmp/tag-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/refs" --data-binary @/tmp/tag-create.json >/tmp/tag-created.json
          test "$(jq -r '.object.sha' /tmp/tag-created.json)" = "$TARGET_COMMIT"
          if [ "$COMPONENT" = OPS ]; then
            cat >/tmp/release-body.md <<'EOF'
          V1.21.791 = PRIVATE RELEASE ASSET DOWNLOAD AUTH CORRECTIVE BASELINE.

          - Fixes WordPress AJAX/bulk Plugin_Upgrader private GitHub Release Asset authentication handoff.
          - Exact root cause: bulk_upgrade hook_extra contains plugin but omits type; prior client rejected the hook and WordPress default download_url reached the private asset without Authorization.
          - Corrective bridge scopes only exact vf-ops/vf-ops.php bulk context and delegates to the existing authenticated downloader/recovery lifecycle.
          - Authorization remains limited to exact api.github.com private Release Asset API requests; redirect targets receive no secret.
          - Missing/Wrong Token: FAIL CLOSED. Unexpected Host: NO AUTH REQUEST. Redirect: NO SECRET LEAK. Bytes/SHA mismatch: FAIL CLOSED.
          - Real WordPress update_plugins -> Plugin_Upgrader::bulk_upgrade -> private asset -> install/state-preservation fixture: PASS.
          - Schema: 6.0.0 / 48 tables / migration NONE.
          - Physical Locator: vf-ops/vf-ops.php. Locator Cutover: NO.
          - Existing V1.21.790 tag/release/asset: UNMODIFIED historical release.
          - core-updates publication: NOT EXECUTED.
          - Production upgrade/write: NOT EXECUTED.
          - This Corrective Baseline requires Master approval before any Production bootstrap/online verification round.
          EOF
          else
            cat >/tmp/release-body.md <<'EOF'
          V1.25.3 = PRIVATE RELEASE ASSET DOWNLOAD AUTH CORRECTIVE BASELINE.

          - Fixes WordPress AJAX/bulk Plugin_Upgrader private GitHub Release Asset authentication handoff.
          - Exact root cause: bulk_upgrade hook_extra contains plugin but omits type; prior client rejected the hook and WordPress default download_url reached the private asset without Authorization.
          - Corrective bridge scopes only exact vf-tool-m3u8/vf-tool-m3u8.php bulk context and delegates to the existing authenticated downloader/recovery lifecycle.
          - Authorization remains limited to exact api.github.com private Release Asset API requests; redirect targets receive no secret.
          - Missing/Wrong Token: FAIL CLOSED. Unexpected Host: NO AUTH REQUEST. Redirect: NO SECRET LEAK. Bytes/SHA mismatch: FAIL CLOSED.
          - Real WordPress update_plugins -> Plugin_Upgrader::bulk_upgrade -> private asset -> install/state-preservation fixture: PASS.
          - Schema: 1.2.0 / business schema migration NONE.
          - Physical Locator: vf-tool-m3u8/vf-tool-m3u8.php. Locator Cutover: NO.
          - Existing V1.25.2 tag/release/asset: UNMODIFIED historical release.
          - core-updates publication: NOT EXECUTED.
          - Production upgrade/write: NOT EXECUTED.
          - This Corrective Baseline requires Master approval before any Production bootstrap/online verification round.
          EOF
          fi
          jq -n --arg tag "$TAG" --arg name "$RELEASE_NAME" --rawfile body /tmp/release-body.md '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}' >/tmp/release-create.json
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases" --data-binary @/tmp/release-create.json >/tmp/release-created.json
          RID="$(jq -r '.id' /tmp/release-created.json)"; test -n "$RID"; test "$RID" != null
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"
          echo 'CORRECTIVE_TAG_RELEASE_CREATED=PASS'

      - name: Upload exact candidate artifact
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -X POST -H "Authorization: Bearer $WRITE_TOKEN" -H 'Content-Type: application/zip' "https://uploads.github.com/repos/${TARGET_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}" --data-binary "@/tmp/$ASSET_NAME" >/tmp/asset-created.json
          AID="$(jq -r '.id' /tmp/asset-created.json)"; test -n "$AID"; test "$AID" != null
          test "$(jq -r '.name' /tmp/asset-created.json)" = "$ASSET_NAME"
          test "$(jq -r '.size' /tmp/asset-created.json)" = "$EXPECTED_BYTES"
          echo "ASSET_ID=$AID" >> "$GITHUB_ENV"
          echo 'EXACT_CANDIDATE_ASSET_UPLOADED=PASS'

      - name: Remote metadata digest readback without redirect credential propagation
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          TAG_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"$TAG_JSON")" = "$TARGET_COMMIT"
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}" -o /tmp/release-readback.json
          test "$(jq -r '.id' /tmp/release-readback.json)" = "$RELEASE_ID"
          test "$(jq -r '.draft' /tmp/release-readback.json)" = false
          test "$(jq -r '.prerelease' /tmp/release-readback.json)" = false
          RB_ID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' /tmp/release-readback.json)"
          RB_SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' /tmp/release-readback.json)"
          RB_DIGEST="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest // empty' /tmp/release-readback.json)"
          test "$RB_ID" = "$ASSET_ID"
          test "$RB_SIZE" = "$EXPECTED_BYTES"
          test "$RB_DIGEST" = "sha256:$EXPECTED_SHA256"
          jq -n --arg component "$COMPONENT" --arg version "$VERSION" --arg tag "$TAG" --arg target "$TARGET_COMMIT" --arg tree "$TARGET_TREE" --argjson release_id "$RELEASE_ID" --argjson asset_id "$ASSET_ID" --arg asset "$ASSET_NAME" --argjson bytes "$EXPECTED_BYTES" --arg sha "$EXPECTED_SHA256" --argjson runtime_files "$EXPECTED_RUNTIME_FILES" --arg runtime_fp "$EXPECTED_RUNTIME_FP" '{component:$component,corrective_version:$version,tag:$tag,tag_target:$target,target_tree:$tree,release_id:$release_id,asset_id:$asset_id,asset:$asset,bytes:$bytes,sha256:$sha,runtime_files:$runtime_files,runtime_fingerprint:$runtime_fp,candidate_artifact_equals_delivered_artifact:"PASS",remote_metadata_digest_readback:"PASS",existing_historical_release_modified:false,core_updates_publish:"NOT_EXECUTED",production_write:0,final_online_pass:"NO"}' >/tmp/formal-release-readback.json
          cat /tmp/formal-release-readback.json
          echo 'FORMAL_RELEASE_REMOTE_READBACK=PASS'

      - name: Remove package and upload redacted release evidence only
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "/tmp/$ASSET_NAME"
          rm -rf candidate
          mkdir -p evidence
          cp /tmp/formal-release-readback.json evidence/result.json
          if find evidence -type f \( -name '*.zip' -o -name '*.php' -o -name '*.key' -o -name '*.pem' \) -print -quit | grep -q .; then exit 91; fi
          if grep -RIlE 'Bearer[[:space:]]+[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' evidence 2>/dev/null | grep -q .; then exit 92; fi
          echo 'RELEASE_EVIDENCE_PRIVACY=PASS'

      - name: Upload redacted release readback
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-${{ matrix.component }}-corrective-formal-release-${{ github.run_id }}
          path: evidence/result.json
          if-no-files-found: error
          retention-days: 30
