name: P03 V1.36.0 Private Bootstrap Identity Patch

on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-private-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: integration/v1.36.0-product-experience
      EXPECTED_HEAD: 866f71334580990801ee0244d7073632222b04fa
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Fail closed on missing write credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"

      - name: Clone exact private integration authority
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --branch "$TARGET_BRANCH" --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply exact V1.36.0 bootstrap identity delta
        working-directory: p03
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VFAB_VERSION', '1.35.4');"
          new="define('VFAB_VERSION', '1.36.0');"
          assert s.count(old)==1, 'VERSION_ANCHOR_MISMATCH'
          assert s.count(new)==0, 'VERSION_ALREADY_PATCHED'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "define('VFAB_VERSION', '1.36.0');" src/app/bootstrap.php >/dev/null
          grep -F "define('VFAB_SCHEMA_VERSION', 30);" src/app/bootstrap.php >/dev/null
          test "$(cat VERSION)" = '1.36.0'
          php -l src/app/bootstrap.php >/dev/null
          php -l src/app/ExperienceService.php >/dev/null
          php -l public/memory-api.php >/dev/null
          echo 'BOOTSTRAP_IDENTITY_PATCH=PASS'

      - name: Commit only the authorized bootstrap delta
        working-directory: p03
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = 'src/app/bootstrap.php'
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/bootstrap.php
          git commit -m 'chore(v1.36.0): align runtime bootstrap working identity'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "PATCHED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify remote exact head
        working-directory: p03
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test "$remote" = "$PATCHED_HEAD"
          echo "P03_V1360_BOOTSTRAP_REMOTE_WRITE=PASS head=$PATCHED_HEAD"
