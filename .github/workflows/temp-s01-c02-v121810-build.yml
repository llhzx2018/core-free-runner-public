name: TEMP S01-C02 Ops 1.21.810 Build
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121810-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO: llhzx2018/vf-tools-ops
      BRANCH: fix/s01-static-source-pointer-recovery-v121810
      BASE: e4c5fc3dece349ca23f0fea361d55709d4b3f82c
    steps:
      - name: Checkout staged patch inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: temp/s01-c02-v121809-production-readback-20260904
          path: runner
      - name: Patch exact 1.21.809 source
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"; test -n "$W"
          git clone -q --branch "$BRANCH" "https://x-access-token:${R}@github.com/${REPO}.git" ops
          test "$(git -C ops rev-parse HEAD)" = "$BASE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ops')
          helper=Path('runner/.github/phase3/temp-v121810-source-recovery.inc.php').read_text()
          if not helper.startswith('<?php\n'):
              raise SystemExit('helper header mismatch')
          helper=helper[len('<?php\n'):]
          p=root/'includes/site-release/s01-static-boundary-reconciler.php'
          s=p.read_text()
          anchor="function vf_ops_s01_static_boundary_owned_batch_v121804(array $marker): array {"
          if s.count(anchor)!=1:
              raise SystemExit('source recovery insertion anchor mismatch')
          s=s.replace(anchor,helper+'\n'+anchor)
          old="""function vf_ops_s01_static_boundary_admin_init_v121804(): void {
              $GLOBALS['vf_ops_s01_static_boundary_last_v121804'] = vf_ops_s01_static_boundary_reconcile_v121804();
          }"""
          new="""function vf_ops_s01_static_boundary_admin_init_v121804(): void {
              $GLOBALS['vf_ops_s01_static_source_pointer_recovery_last_v121810'] = vf_ops_s01_static_source_pointer_recover_v121810();
              $GLOBALS['vf_ops_s01_static_boundary_last_v121804'] = vf_ops_s01_static_boundary_reconcile_v121804();
          }"""
          if s.count(old)!=1:
              raise SystemExit('admin init anchor mismatch')
          p.write_text(s.replace(old,new))
          p=root/'vf-ops.php'; s=p.read_text()
          replacements=[
              (' * Version: 1.21.809',' * Version: 1.21.810'),
              ("VF_OPS_VERSION', '1.21.809'","VF_OPS_VERSION', '1.21.810'"),
              ("VF_OPS_ROUND', 'STATIC-BATCH-LABEL-COMPAT-V1'","VF_OPS_ROUND', 'STATIC-SOURCE-POINTER-RECOVERY-V1'"),
          ]
          for a,b in replacements:
              if s.count(a)!=1:
                  raise SystemExit('version anchor mismatch: '+a)
              s=s.replace(a,b)
          p.write_text(s)
          (root/'VERSION').write_text('1.21.810\n')
          (root/'.github/phase3/v121810-static-source-pointer-recovery.php').write_text(Path('runner/.github/phase3/temp-v121810-static-source-pointer-recovery-test.php').read_text())
          PY
          cd ops
          php .github/phase3/v121810-static-source-pointer-recovery.php | grep -Fxq PASS_V121810_STATIC_SOURCE_POINTER_RECOVERY
          git diff --check
          git status --short
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION vf-ops.php includes/site-release/s01-static-boundary-reconciler.php .github/phase3/v121810-static-source-pointer-recovery.php
          git commit -m 'fix(S01-C02): recover trusted static source inspection pointer'
          git remote set-url origin "https://x-access-token:${W}@github.com/${REPO}.git"
          git push -q origin "HEAD:${BRANCH}"
          echo BUILD_V121810=PASS
