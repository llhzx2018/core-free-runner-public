name: TEMP P07 independent internal UX and audit proof
on:
  pull_request:
    types: [reopened]
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-terminal-ux-actual-proof-20261127.yml'
permissions:
  contents: read
jobs:
  private-ux-delta:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-terminal-ux-actual-proof-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: m03-selection
            sha: 4f7494ebbb892164da8bb0a1942d6da672f61f82
            tree: f20cacebdb6d3703a60e80cc0e0ecafe888827a8
            suites: test_p07_m03_site_ux_v3.py
          - module: m05-shared
            sha: 5734f7e26abf23dd0e85e9970f2c3dbd2a298367
            tree: 4415fb5f3dde304b2d963d60e204bd31bd4d061f
            suites: test_p07_terminal_ui_rendering.py test_p07_m03_site_ux_v3.py test_p07_m05_host_write_gate.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '${{ matrix.sha }}'
          path: transient-p07
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Exact source and scoped independent UX regression
        shell: bash
        env:
          PRODUCT_SHA: '${{ matrix.sha }}'
          PRODUCT_TREE: '${{ matrix.tree }}'
          SUITES: '${{ matrix.suites }}'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          echo EXACT_SOURCE_TREE=PASS
          mkdir -m 700 "$RUNNER_TEMP/p07-ux-delta"
          result=0
          for suite in $SUITES; do
            case "$suite" in
              test_p07_m03_site_ux_v3.py|test_p07_terminal_ui_rendering.py|test_p07_m05_host_write_gate.py) ;;
              *) exit 13;;
            esac
            log="$RUNNER_TEMP/p07-ux-delta/$suite"
            if python3 -B -m unittest discover -s tests -p "$suite" -v >"$log" 2>&1 && grep -Fxq OK "$log"; then
              echo "P07_UX_SUITE=PASS:$suite"
            else
              echo "P07_UX_SUITE=FAIL:$suite"
              grep -E '^(FAIL|ERROR):' "$log" | cut -c1-160 || true
              result=1
            fi
            grep -E '^Ran [0-9]+ tests?' "$log" || true
          done
          if python3 -B scripts/check_p07_terminal_ux.py --base-ref 5a9fd0d1cfdc485f9709586f191689f9e47a3415 >"$RUNNER_TEMP/p07-ux-delta/scope.log" 2>&1; then
            echo UX_SCOPE_STRUCTURAL=PASS
          else
            echo UX_SCOPE_STRUCTURAL=FAIL
            result=1
          fi
          exit "$result"
      - name: Clean transient source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$RUNNER_TEMP/p07-ux-delta"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$RUNNER_TEMP/p07-ux-delta"
          echo TRANSIENT_PRIVATE_CHECKOUT_CLEANUP=PASS
  m02-full-audit:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.actor == 'llhzx2018' && github.event.pull_request.user.login == 'llhzx2018' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temp/p07-terminal-ux-actual-proof-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Run real exact UX4 performance detection and inspect generated report
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /opt/vfops-modules
          test ! -e /opt/vf-server-ops
          test ! -e /home/clp
          work="$(mktemp -d)"
          trap 'sudo -n rm -rf -- "$work"' EXIT
          mkdir -p "$work/bench" "$work/reports" "$work/runtime"
          curl --proto '=https' --tlsv1.2 -fsSL --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d79c2a3185511654dd7fb6ca402009965704d5e0/experiments/p07-vps-audit-v21-ux4.sh -o "$work/runtime/vps-audit.sh"
          test "$(git hash-object "$work/runtime/vps-audit.sh")" = 88b38d2ca46ac7325da8b45621a1f0cf16cf8951
          bash -n "$work/runtime/vps-audit.sh"
          test "$(bash "$work/runtime/vps-audit.sh" --build-id)" = 2.1.1-ux4
          echo EXACT_M02_SOURCE=PASS
          rc=0
          sudo -n env -u P07_V21_SKIP_BASE -u P07_V21_SKIP_FIO -u P07_V21_SKIP_ROUTE -u P07_ROUTE_MOCK \
            NO_COLOR=1 TERM=dumb P07_BENCH_DIR="$work/bench" P07_REPORT_DIR="$work/reports" \
            timeout --kill-after=10s 840s bash "$work/runtime/vps-audit.sh" >"$work/audit.log" 2>&1 || rc=$?
          echo "ACTUAL_FULL_AUDIT_EXIT=$rc"
          test "$rc" = 0
          sudo -n python3 - "$work" <<'PY'
          import pathlib,sys,stat
          root=pathlib.Path(sys.argv[1])
          reports=list((root/"reports").glob("*.md"))
          assert len(reports)==1
          report=reports[0]
          text=report.read_text()
          assert text.index("## 验机结论")<text.index("## 基础与网络验机输出")
          for field in ("综合评级","基础得分","增强磁盘","三网回程","建议","本次耗时"):
              assert field+"：" in text
          assert stat.S_IMODE(report.stat().st_mode)==0o600
          assert not list((root/"reports").glob(".p07-report.*"))
          assert not list((root/"bench").glob(".p07-fio-*"))
          print("ACTUAL_REPORT_SUMMARY_RAW_PRIVACY=PASS")
          print("ACTUAL_BENCHMARK_FILE_CLEANUP=PASS")
          print("ATOMIC_MODULE_INSTALL_AND_ROLLBACK=NOT_RUN")
          PY
