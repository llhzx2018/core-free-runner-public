name: S01-C01 Theme 1.35.16 Visible UI Gate
on:
  push:
    branches: [temp/s01-c01-visible-ui-gate-13516-20260907]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential boundary
        run: |
          test -n "$READ_TOKEN"
          test -z "${VF_RELEASE_WRITE_TOKEN:-}"
          echo 'READ_ONLY_CREDENTIAL=YES'
          echo 'RELEASE_WRITE_USED=NO'
      - name: Checkout exact Theme candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ux/s01-c01-visible-ui-refresh-13516-20260907
          token: ${{ env.READ_TOKEN }}
          path: theme
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Theme candidate
        run: |
          cd theme
          test "$(git rev-parse HEAD)" = "5ff2509198baf0656b1c5996c4cf19818d03ef59"
      - name: Exact six-file UI fence
        run: |
          cd theme
          git diff --name-only dac85683e5e826c343f7d6502f50394b6126ee73..HEAD | sort > /tmp/changed
          cat >/tmp/expected <<'EOF'
          VERSION
          src/assets/css/admin/admin-s01-console-v2.css
          src/assets/css/admin/admin-update-center-console-v2.css
          src/style.css
          tests/update-refresh-policy-contract.php
          tests/visible-console-v2-contract.php
          EOF
          sort /tmp/expected -o /tmp/expected
          diff -u /tmp/expected /tmp/changed
      - name: Full PHP syntax gate
        run: |
          cd theme
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log
      - name: Update center language regression
        run: |
          cd theme
          php tests/update-center-human-language-contract.php
      - name: Update policy regression
        run: |
          cd theme
          php tests/update-refresh-policy-contract.php
      - name: Visible UI contract
        run: |
          cd theme
          php tests/visible-console-v2-contract.php
      - name: UI-only boundary
        run: |
          cd theme
          test "$(git diff --name-only dac85683e5e826c343f7d6502f50394b6126ee73..HEAD | wc -l)" -eq 6
          ! git diff --name-only dac85683e5e826c343f7d6502f50394b6126ee73..HEAD | grep -E '(^|/)(public|schema|migration|update/class|inc/update)/'
          git diff dac85683e5e826c343f7d6502f50394b6126ee73..HEAD -- src/assets/css/admin/admin-s01-console-v2.css | grep -q 'vf-admin-page-head'
          git diff dac85683e5e826c343f7d6502f50394b6126ee73..HEAD -- src/assets/css/admin/admin-update-center-console-v2.css | grep -q 'vf-update-component'
      - name: Post Checkout exact Theme candidate
        run: |
          cd theme
          test "$(git rev-parse HEAD)" = "5ff2509198baf0656b1c5996c4cf19818d03ef59"