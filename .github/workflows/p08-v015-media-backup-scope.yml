name: P08 v015 private landing image backup scope test
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-media-backup-scope.yml
permissions:
  contents: read
jobs:
  p08-media-backup-scope:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-media-backup-scope-20261121' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public-safe Runner harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P08 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 9243683b7a108f2f31246e8fcb0b99dc5e262a4b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout baseline private P08 transiently for negative regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef6fb93226c771ecb560e499b5187f9878a3b3b0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08-before
      - name: PHP 8.4 isolated toolchain
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,pdo_mysql,zip,posix,openssl,fileinfo
          coverage: none
      - name: Assert exact source and baseline demonstrate original missing media
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08 rev-parse HEAD)" = 9243683b7a108f2f31246e8fcb0b99dc5e262a4b
          test "$(git -C p08-before rev-parse HEAD)" = ef6fb93226c771ecb560e499b5187f9878a3b3b0
          php -l p08/src/Recovery/PrivatePayloadSnapshot.php
          php -l p08/tests/test_recovery_landing_assets_snapshot.php
          cp p08/tests/test_recovery_landing_assets_snapshot.php p08-before/tests/test_recovery_landing_assets_snapshot.php
          if (cd p08-before && php tests/test_recovery_landing_assets_snapshot.php > "$RUNNER_TEMP/p08-before.out" 2>&1); then
            echo "P08_ASSET_PREVIOUS_SOURCE_UNEXPECTEDLY_PASSED"
            exit 1
          fi
          grep -q "P08_ASSET_SNAPSHOT_TEST_MISSING_IMAGE_BACKUP" "$RUNNER_TEMP/p08-before.out"
          echo "P08_ASSET_ORIGINAL_SOURCE_MISSING_LIBRARY=PROVEN"
      - name: Exact candidate image snapshot, stage and negative safety test
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd p08
          php tests/test_recovery_landing_assets_snapshot.php
          php tests/test_fresh_owner_upgrade_backup.php
          php tests/test_maintenance_gate.php
          echo "P08_ASSET_BACKUP_PATCH_EXACT_SHA=PASS"
      - name: Always erase private code and synthetic output
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- p08 p08-before "$RUNNER_TEMP/p08-before.out"
          test ! -e p08 && test ! -e p08-before
          echo "P08_MEDIA_PRIVATE_SOURCE_CLEANUP=PASS"
