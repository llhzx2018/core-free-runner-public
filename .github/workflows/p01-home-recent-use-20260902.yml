name: P01 L2 Home Recent Use
on:
  push:
    branches: [run/p01-home-recent-use-20260902]
    paths: [.github/workflows/p01-home-recent-use-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: run/p01-home-recent-use-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-home-recent-use-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product fetch origin develop
          test "$(git -C product rev-parse HEAD)" = 8a8bb39b55f90b60cef86be21b8bd47bf5c49552
          test "$(git -C product rev-parse origin/develop)" = 8a8bb39b55f90b60cef86be21b8bd47bf5c49552
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 ../runner/scripts/p01_home_recent_use_patch.py
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/FunctionalHome.php >/dev/null
          git diff --check
          grep -F "last_surface_opened_at" src/app/FunctionalHome.php >/dev/null
          grep -F "array_slice(\$recentAssets,0,6)" src/app/FunctionalHome.php >/dev/null
          grep -F '<h2 id="vfHomeRecentTitle">最近使用</h2>' src/app/FunctionalHome.php >/dev/null
          grep -F 'surfaces.php?view=recent' src/app/FunctionalHome.php >/dev/null
          grep -F 'surface-open.php?id=' src/app/FunctionalHome.php >/dev/null
          grep -F "'recent_assets'=>\$recentAssets" src/app/FunctionalHome.php >/dev/null
          grep -F '.vf-home-recent-grid' src/assets/workspace-home.css >/dev/null
          ! grep -E 'CREATE TABLE|ALTER TABLE|INSERT INTO .*recent|UPDATE .*recent' src/app/FunctionalHome.php >/dev/null
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          test -z "$(git diff --name-only -- VERSION src/VERSION.txt VF_PROJECT.json database src/migrations)"
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/assets/workspace-home.css | sort)
          test "$changed" = "$expected"
          echo 'HOME RECENT USE PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/assets/workspace-home.css
          git commit -m 'feat(P01): surface recent use on Home'
          git push origin HEAD:product/p01-home-recent-use-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
