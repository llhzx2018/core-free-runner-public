name: P06 VF Press V0.1.11 Temporary Formal Release

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-v0111-formal-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-v0111-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 623585de5160cdc66463812771c94367223a389b
      SOURCE_TREE: fa09d912839f348018062abfbe7c9b3a6d2e2037
      VERSION: 0.1.11
      TAG: v0.1.11
      CORE_REPO: llhzx2018/core-updates
    steps:
      - name: Require registered release capabilities
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS
          echo RELEASE_WRITE_CAPABILITY=PASS

      - name: Checkout exact release candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Checkout core-updates channel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.CORE_REPO }}
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: core-updates

      - name: Prepare release runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          command -v gh
          echo MACHINE_RUNTIME=PASS

      - name: Exact source and authority release gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$VERSION"
          test "$(jq -r .schema VF_PROJECT.json)" = '3'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'WHOLE_SITE_REFOUNDATION_V1_RELEASE_CANDIDATE'
          test "$(jq -r .next_gate VF_PROJECT.json)" = 'EXACT_SOURCE_RELEASE_V0_1_11'
          test "$(jq -r .release_gates.owner_preview_runtime_applicability VF_PROJECT.json)" = 'N/A'
          test -n "$(jq -r .release_gates.owner_preview_runtime_reason VF_PROJECT.json)"
          test "$(jq -r .release_gates.owner_formal_release_approval VF_PROJECT.json)" = 'PASS'
          test "$(jq -r .release_gates.whole_site_refoundation_v1 VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32752664457'
          test "$(jq -r .product_gates.library_book_workspace_runtime VF_PROJECT.json)" = 'PASS_MACHINE_EXACT_SOURCE_RUN_32752664457'
          grep -Fq 'WHOLE-SITE RUNTIME REFACTOR = PASS MACHINE / RUN 32752664457' docs/authority/ACCEPTANCE_MATRIX.md
          echo OWNER_PREVIEW_RUNTIME=N_A_AUTHORITY_REASON_PRESENT
          echo PRE_RELEASE_AUTHORITY_DRIFT_GATE=PASS
          echo EXACT_RELEASE_SOURCE=PASS
          echo PRODUCTION_WRITE=0

      - name: Composer PHP and complete regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/reader-ux-self-test.php | grep -Fq READER_UX_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/admin-shell-book-overview-self-test.php | grep -Fq ADMIN_SHELL_BOOK_OVERVIEW_SELF_TEST=PASS
          php bin/admin-shell-unification-self-test.php | grep -Fq ADMIN_SHELL_UNIFICATION_SELF_TEST=PASS
          php bin/whole-site-refoundation-self-test.php | grep -Fq WHOLE_SITE_REFOUNDATION_SELF_TEST=PASS
          php bin/book-outline-self-test.php | tee /tmp/p06-v0111-outline
          grep -Fq CANONICAL_MARKDOWN_NO_OVERWRITE=PASS /tmp/p06-v0111-outline
          grep -Fq PROVIDER_OPTIONAL_DEGRADATION=PASS /tmp/p06-v0111-outline
          php bin/demo-data-self-test.php | grep -Fq DEMO_DATA_SELF_TEST=PASS
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if($pdo->query("PRAGMA foreign_key_check")->fetchAll()!==[]) exit(2); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==3) exit(3);'
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS
          echo EXACT_SOURCE_FULL_REGRESSION=PASS
          echo PRODUCT_REPOSITORY_CLEAN=PASS

      - name: Build exact formal assets
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v0111-release
          rm -rf "$OUT"
          mkdir -p "$OUT"
          php bin/build-release.php "$OUT" | tee /tmp/p06-v0111-release-build
          grep -Fq RELEASE_BUILD=PASS /tmp/p06-v0111-release-build
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          FULL="$OUT/VF_Press_V0.1.11_FULL.zip"
          UPDATE="$OUT/VF_Press_V0.1.11_UPDATE.zip"
          test -s "$FULL" && test -s "$UPDATE"
          test "$(jq -r .version "$OUT/RELEASE_INFO.json")" = "$VERSION"
          test "$(jq -r .schema "$OUT/RELEASE_INFO.json")" = '3'
          unzip -p "$UPDATE" VF_UPDATE.json >/tmp/p06-v0111-update.json
          test "$(jq -r .target_version /tmp/p06-v0111-update.json)" = "$VERSION"
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/AdminShell.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/BookController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/src/Http/Studio/PublicationController.php'
          unzip -l "$UPDATE" | grep -Fq 'payload/public/assets/reader.css'
          unzip -l "$UPDATE" | grep -Fq 'payload/bin/whole-site-refoundation-self-test.php'
          echo "FULL_BYTES=$(stat -c%s "$FULL")" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(sha256sum "$FULL" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "UPDATE_BYTES=$(stat -c%s "$UPDATE")" >> "$GITHUB_ENV"
          echo "UPDATE_SHA=$(sha256sum "$UPDATE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo FORMAL_ASSET_BUILD=PASS

      - name: Publish and remote-readback formal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT=/tmp/p06-v0111-release
          NOTES=/tmp/p06-v0111-notes.md
          printf '%s\n' \
            '## VF Press V0.1.11 · Whole-Site Refoundation V1' \
            '' \
            '- 全局收敛为 Library → Book Workspace，不再使用六个平级后台中心。' \
            '- 每本书统一 Brief、目录、正文、研究、审校、阅读与更多上下文。' \
            '- 正文采用章节导航 + 单章编辑两列；来源和修订改为可展开上下文。' \
            '- Reader 使用可读版心，并可直接返回当前书籍或编辑当前章节。' \
            '- 出版、Edition、导出与分发继续作为可选后段能力。' \
            '- Schema 保持 3；AI 候选不能覆盖 Accepted Canonical Markdown。' \
            '' \
            'Production 升级与 OWNER 真实使用验收是发布后的独立步骤；本发布不写入 Production。' > "$NOTES"

          if gh release view "$TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release upload "$TAG" \
              "$OUT/VF_Press_V0.1.11_FULL.zip" \
              "$OUT/VF_Press_V0.1.11_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" --clobber
          else
            gh release create "$TAG" \
              "$OUT/VF_Press_V0.1.11_FULL.zip" \
              "$OUT/VF_Press_V0.1.11_UPDATE.zip" \
              "$OUT/SHA256SUMS.txt" \
              "$OUT/RELEASE_INFO.json" \
              --repo "$SOURCE_REPO" \
              --target "$SOURCE_SHA" \
              --title "VF Press V0.1.11 · Whole-Site Refoundation V1" \
              --notes-file "$NOTES"
          fi

          RELEASE_JSON=$(gh api "repos/$SOURCE_REPO/releases/tags/$TAG")
          test "$(jq -r .draft <<<"$RELEASE_JSON")" = false
          test "$(jq -r .prerelease <<<"$RELEASE_JSON")" = false
          test "$(jq -r .tag_name <<<"$RELEASE_JSON")" = "$TAG"
          TAG_SHA=$(gh api "repos/$SOURCE_REPO/git/ref/tags/$TAG" --jq .object.sha)
          test "$TAG_SHA" = "$SOURCE_SHA"

          READBACK=/tmp/p06-v0111-readback
          rm -rf "$READBACK"
          mkdir -p "$READBACK"
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir "$READBACK"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.11_FULL.zip")" = "$FULL_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.11_FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(stat -c%s "$READBACK/VF_Press_V0.1.11_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(sha256sum "$READBACK/VF_Press_V0.1.11_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          (cd "$READBACK" && sha256sum -c SHA256SUMS.txt)
          echo "RELEASE_URL=$(jq -r .html_url <<<"$RELEASE_JSON")" >> "$GITHUB_ENV"
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS

      - name: Publish core-updates P06 manifest
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          RELEASED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sha "$UPDATE_SHA" \
            --arg released_at "$RELEASED_AT" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '{
              schema_version:"1.0",
              project_id:"P06",
              component_id:"APP",
              enabled:true,
              target_version:$version,
              update_type:"ATOMIC",
              from_versions:["0.1.10"],
              schema_from:"3",
              schema_to:"3",
              repository:"llhzx2018/vf-press",
              release_tag:$tag,
              asset_name:"VF_Press_V0.1.11_UPDATE.zip",
              asset_bytes:$bytes,
              asset_sha256:$sha,
              backup_required:true,
              rollback_supported:true,
              minimum_php:"8.2.0",
              released_at:$released_at,
              product_identity:"VF Press / P06",
              notes:("V0.1.11 unifies the private product as Library to Book Workspace, keeps Reader and Manuscript in the same book context, preserves Schema 3, and binds exact source SHA " + $source_sha + ".")
            }' > projects/P06.json
          jq -e '.project_id=="P06" and .target_version=="0.1.11" and .from_versions==["0.1.10"] and .schema_from=="3" and .schema_to=="3" and .backup_required==true and .rollback_supported==true and .asset_bytes>0 and (.asset_sha256|test("^[a-f0-9]{64}$"))' projects/P06.json >/dev/null
          git config user.name 'VF Public Runner'
          git config user.email 'vf-public-runner@users.noreply.github.com'
          git add projects/P06.json
          git commit -m "release(P06): publish V0.1.11 update manifest"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "MANIFEST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo CORE_UPDATES_MANIFEST_PUBLISHED=PASS

      - name: Verify online discovery and release boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$CORE_REPO/contents/projects/P06.json?ref=main" --jq .content | tr -d '\n' | base64 -d >/tmp/P06-online.json
          jq -e \
            --arg sha "$UPDATE_SHA" \
            --argjson bytes "$UPDATE_BYTES" \
            '.target_version=="0.1.11" and .from_versions==["0.1.10"] and .schema_from=="3" and .schema_to=="3" and .release_tag=="v0.1.11" and .asset_bytes==$bytes and .asset_sha256==$sha' \
            /tmp/P06-online.json >/dev/null
          cd source
          php -r 'require "vendor/autoload.php"; $m=json_decode(file_get_contents("/tmp/P06-online.json"),true,512,JSON_THROW_ON_ERROR); $r=(new CoreUpdates\UpdateCore("P06"))->check("0.1.10","3",$m); if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,json_encode($r));exit(1);} echo "ONLINE_DISCOVERY=AVAILABLE\n";'
          echo ONLINE_UPDATE_DISCOVERY=PASS
          echo REMOTE_READBACK_PASS=YES
          echo FORMAL_RELEASE=PASS
          echo PRODUCTION_WRITE=NO
