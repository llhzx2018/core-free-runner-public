name: S01 C01 1.35.19 Candidate Patch V3
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: ['.github/workflows/temp-s01-c01-13519-candidate-patch-v3-20260907.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      BRANCH: ux/s01-c01-deep-human-closure-13519-20260907
      HEAD_SHA: 60f30e80231a953d8bf84d96b85cd55211d91ae0
      MAIN_SHA: 72d2a83da7b940a080d48c40891555dc815aaafa
    steps:
      - name: Patch and gate C01 only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo MAIN_WRITE_USED=NO; echo RELEASE_WRITE_USED=NO; echo PRODUCTION_WRITE_USED=NO
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          cd repo
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          git checkout -q "$BRANCH"; test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'EXACT_REPLACE_FAIL {path} count={n}: {old[:70]}')
              p.write_text(s.replace(old,new,1))
          one('VERSION','1.35.18\n','1.35.19\n')
          one('src/style.css','Version: 1.35.18','Version: 1.35.19')
          one('src/style.css','V1.35.18_S01_DEEP_HUMAN_LANGUAGE','V1.35.19_S01_FINAL_ADMIN_HUMAN_CLOSURE')
          b='src/inc/admin/views/brand.php'
          one(b,"$canonical_stored ? '正式配置已存储' : '当前使用兼容回退'","$canonical_stored ? '已保存并生效' : '正在使用安全默认设置'")
          one(b,"<span>修订 <?php echo esc_html($revision_short !== '' ? $revision_short : '未生成'); ?></span>","<span><?php echo esc_html($runtime_ok ? '前台显示已确认' : '前台显示待确认'); ?></span>")
          n='src/inc/admin/views/navigation.php'
          one(n,"$check_labels = ['database'=>'数据库回读','header'=>'桌面页头','mobile'=>'移动导航','footer'=>'页脚输出','css'=>'响应式变量'];","$check_labels = ['database'=>'保存结果','header'=>'桌面页头','mobile'=>'移动导航','footer'=>'页脚输出','css'=>'移动端适配'];")
          one(n,"'数据库、页头、移动导航、页脚与响应式变量已读取同一份正式配置。'","'导航与页脚设置已同步到桌面、移动端和页脚。'")
          one(n,"<span>保存后执行写入、数据库回读和五类前台显示检查。</span>","<span>保存后会自动检查桌面、移动端和页脚是否正确显示。</span>")
          one(n,"!empty($state['stored']) ? '正式配置已存储' : '当前使用兼容回退'","!empty($state['stored']) ? '已保存并生效' : '正在使用安全默认设置'")
          one(n,"<span>修订 <?php echo esc_html($revision_short !== '' ? $revision_short : '未生成'); ?></span>","<span><?php echo esc_html($runtime_ok ? '前台显示已确认' : '前台显示待确认'); ?></span>")
          one(n,"本页只绑定 WordPress 菜单到真实主题位置；菜单项本身仍由 WordPress 核心统一维护。","在这里选择桌面、移动端和页脚使用哪个 WordPress 菜单；菜单项内容仍在 WordPress 菜单中统一维护。")
          one(n,"<strong>旧配置仍在保护期</strong>","<strong>发现旧版设置</strong>")
          one(n,"'旧数据保留中，完成真实回读后再处理。':'等待真实环境确认迁移结果。'","'旧设置会暂时保留，确认当前导航显示正常后再自动整理。':'请先确认当前导航与页脚显示正常。'")
          one(n,"'数据库、桌面页头、移动导航、页脚和响应式变量已读取同一份正式配置。'","'桌面、移动端和页脚已使用当前保存的设置。'")
          for path in ['tests/update-refresh-policy-contract.php','tests/visible-console-v2-contract.php','tests/workbench-primary-action-contract.php']:
              p=Path(path); s=p.read_text(); c=s.count('1.35.18')
              if c<1: raise SystemExit('VERSION_CONTRACT_NOT_FOUND '+path)
              p.write_text(s.replace('1.35.18','1.35.19'))
          t='tests/deep-admin-human-language-contract.php'
          one(t,"[$navigation, 'WordPress 核心统一维护'],","[$navigation, '菜单项内容仍在 WordPress 菜单中统一维护。'],")
          one(t,"[$navigation, '五类前台显示检查'],","[$navigation, '保存后会自动检查桌面、移动端和页脚是否正确显示。'],")
          Path('tests/final-admin-human-closure-contract.php').write_text(r'''<?php
          $root=dirname(__DIR__);$brand=(string)file_get_contents($root.'/src/inc/admin/views/brand.php');$nav=(string)file_get_contents($root.'/src/inc/admin/views/navigation.php');$css=(string)file_get_contents($root.'/src/assets/css/admin/admin-s01-uiux-pages.css');
          foreach(['已保存并生效','正在使用安全默认设置','前台显示已确认','前台显示待确认'] as $x){if(!str_contains($brand,$x)){fwrite(STDERR,"FAIL_BRAND:$x\n");exit(1);}}
          foreach(['导航与页脚设置已同步到桌面、移动端和页脚。','保存后会自动检查桌面、移动端和页脚是否正确显示。','桌面、移动端和页脚已使用当前保存的设置。',"'database'=>'保存结果'","'css'=>'移动端适配'",'发现旧版设置'] as $x){if(!str_contains($nav,$x)){fwrite(STDERR,"FAIL_NAV:$x\n");exit(1);}}
          foreach(['正式配置已存储','当前使用兼容回退','数据库回读','响应式变量','<span>修订 ','旧配置仍在保护期'] as $x){if(str_contains($brand."\n".$nav,$x)){fwrite(STDERR,"FAIL_VISIBLE_ENGINEERING:$x\n");exit(1);}}
          foreach([['vf-brand-page','.vf-brand-page'],['vf-brand-status-strip','.vf-brand-status-strip'],['vf-brand-workflow','.vf-brand-workflow'],['vf-navigation-page','.vf-navigation-page'],['vf-navigation-status-strip','.vf-navigation-status-strip'],['vf-navigation-workflow','.vf-navigation-workflow']] as [$c,$s]){if(!str_contains($brand."\n".$nav,$c)||!str_contains($css,$s)){fwrite(STDERR,"FAIL_SELECTOR:$s\n");exit(1);}}
          foreach(['data-vf-revision','name="revision"','data-vf-navigation-revision','data-vf-brand-revision'] as $x){if(!str_contains($brand."\n".$nav,$x)){fwrite(STDERR,"FAIL_INTERNAL:$x\n");exit(1);}}
          echo "PASS_THEME_FINAL_ADMIN_HUMAN_CLOSURE\n";
          ''')
          PY
          rm -f .github/workflows/temp-c01-13519-candidate-patch.yml
          php -l src/inc/admin/views/brand.php >/dev/null; php -l src/inc/admin/views/navigation.php >/dev/null
          php tests/deep-admin-human-language-contract.php
          php tests/final-admin-human-closure-contract.php
          php tests/visible-console-v2-contract.php
          php tests/workbench-primary-action-contract.php
          php tests/update-refresh-policy-contract.php
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add -A; git commit -m 'feat(S01-C01): final admin human language closure 1.35.19'
          git push -q origin HEAD:"$BRANCH"
