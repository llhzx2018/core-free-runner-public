name: S01-C02 1.21.909 R20 Pre-Merge Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 4a07b5407e49aa6d03dad6a8273057bbda039db1
      BASE_SHA: 615c2e858a9629658bc8784784e1c64be7414ed8
      VERSION: 1.21.909

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 4a07b5407e49aa6d03dad6a8273057bbda039db1
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact scope identity and contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.909' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.909'" ops/vf-ops.php
          grep -Fq 'S01-FINAL-CONSISTENCY-R20' ops/vf-ops.php

          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             CHANGELOG.md             VERSION             assets/css/current/admin-s01-system-publish-r13.css             includes/admin-v13/views/system_site_release_v6.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             tests/s01-c02-121909-final-consistency-r20-contract.php             vf-ops.php | sort)"
          test "$actual" = "$expected"

          php ops/tests/s01-c02-121909-final-consistency-r20-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/admin-v13/views/system_site_release_v6.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          p=Path('ops/assets/css/current/admin-s01-system-publish-r13.css')
          s=p.read_text(encoding='utf-8')
          assert s.count('{')==s.count('}'), 'css brace imbalance'
          assert 'R20 · Current V6 build-rule disclosure' in s
          assert '.vf-v6-system-overview .vf-v13-build-advanced:not([open])>.vf-v9-form-table' in s
          PY

          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/vf-ops.php             ops/includes/admin-v13/views/system_site_release_v6.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/assets/css/current/admin-s01-system-publish-r13.css

          echo PASS_S01_C02_121909_R20_PREMERGE
