name: P07 VPS Audit RC5 Full Integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p07-nodebench-adoption-rc5
    paths:
      - experiments/p07-vps-audit-v21-rc5.sh
      - .github/workflows/p07-vps-audit-rc5-full.yml

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Load exact RC5 candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/experiments/p07-vps-audit-v21-rc5.sh" -o rc5.sh
          chmod +x rc5.sh
          bash -n rc5.sh
          NO_COLOR=1 bash rc5.sh --version

      - name: Run full VPS audit 2.1
        shell: bash
        run: |
          set -uo pipefail
          set +e
          env NO_COLOR=1 P07_FIO_TEST_MIB=128 P07_FIO_TIMEOUT_SEC=45 bash rc5.sh | tee full.out
          rc=${PIPESTATUS[0]}
          set -e
          [[ $rc -eq 0 ]]

      - name: Full-chain assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'P07 VPS 一键验机 2.0' full.out
          grep -q 'CPU 真实表现' full.out
          grep -q '磁盘 I/O 测速' full.out
          grep -q '磁盘数据库型负载' full.out
          grep -q '节点/地区' full.out
          grep -q '网络稳定性' full.out
          grep -q 'IP 与基础可达性' full.out
          grep -q '最终验机结论' full.out
          grep -q '中国大陆区域线路参考' full.out
          grep -q '增强磁盘混合读写' full.out
          grep -q '有效档位           : 4 / 4' full.out
          grep -q '增强磁盘判断' full.out
          grep -q 'Markdown 报告' full.out
          grep -q '暂未默认接入.*Backtrace' full.out
          ! grep -Eq '是否.*\(Y/n\)|请输入.*Y|请选择' full.out
          md="$(find "$HOME/.local/state/p07-bench/reports" /tmp/p07-bench-reports /var/lib/p07-bench/reports -maxdepth 1 -type f -name '*.md' 2>/dev/null | head -n1 || true)"
          [[ -n "$md" && -s "$md" ]]
          grep -q '基础验机输出' "$md"
          grep -q '增强磁盘混合读写' "$md"

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p07-vps-audit-rc5-full
          path: |
            full.out
            /home/runner/.local/state/p07-bench/reports/*.md
