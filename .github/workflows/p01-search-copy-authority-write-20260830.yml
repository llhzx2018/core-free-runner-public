name: P01 Search Copy Authority Write

on:
  push:
    branches:
      - task/p01-search-copy-authority-write-20260830

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact P01 feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-search-copy-authority-20260830
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01
          persist-credentials: true

      - name: Exact pre-edit fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = 4898aa260884308ce7dc80c3c99618aa9e4788d0
          test "$(git -C p01 rev-parse HEAD^{tree})" = "$(git -C p01 rev-parse 6212ed3e020900bcea4124a1d72d352a4589045e^{tree})"
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspace.php)" = 679d5ac813cb42c443e40e246827c0d8fc57de54
          test "$(git -C p01 rev-parse HEAD:src/app/FunctionalWorkspaceShell.php)" = b0e5ef30ce41b3f2e4127d2348a168be023ff001
          test "$(git -C p01 rev-parse HEAD:src/assets/surface-home.js)" = d827d178ac3f83fc14e4b673bb94f1339fc88950

      - name: Apply and verify exact edits
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('src/app/FunctionalWorkspace.php'): [('placeholder="<?=vf_fw_h($mode===\'start\'?\'搜索标题、网址、分类或标签\':\'搜索标题、分类或标签\')?>"','placeholder="搜索全部资源"')],
              Path('src/app/FunctionalWorkspaceShell.php'): [('placeholder="搜索当前资源"','placeholder="搜索全部资源"')],
              Path('src/assets/surface-home.js'): [("    input.placeholder='搜索全部资源';\n\n",'')],
          }
          for path, edits in replacements.items():
              text=path.read_text(encoding='utf-8')
              for old,new in edits:
                  count=text.count(old)
                  if count != 1: raise SystemExit(f'{path}: source match count={count}')
                  text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8',newline='')
          PY
          php -l src/app/FunctionalWorkspace.php
          php -l src/app/FunctionalWorkspaceShell.php
          node --check src/assets/surface-home.js
          test "$(git hash-object src/app/FunctionalWorkspace.php)" = 5424a99a36f2e36e1ca8c9863029a0839ea76fdf
          test "$(git hash-object src/app/FunctionalWorkspaceShell.php)" = 17173886f92e179a3ba6e0b79fe405393a976fb1
          test "$(git hash-object src/assets/surface-home.js)" = 158297114380af248a94e249fdc829b0561d53e3
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/surface-home.js "

      - name: Commit and push feature result
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/surface-home.js
          git commit -m "ui(P01): make global search copy server-authoritative"
          git push origin HEAD:feature/p01-search-copy-authority-20260830
