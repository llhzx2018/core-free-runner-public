name: P08 R183 official v0.1.9 FULL and 0.1.8 to 0.1.9 Atomic issuance
on:
  pull_request:
    paths:
      - .github/workflows/p08-r183-v019-official-atomic-once.yml
      - scripts/p08_r183_native_once.sh
      - scripts/p08_r183_v019_release_once.py
permissions:
  contents: read
jobs:
  exact-final-real-full-native-atomic-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r183-v019-official-atomic-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: b77c7e8563d93255f5f4a60bb8c5736a994d8151
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout short-lived registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact merged main 0.1.9 source and no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b77c7e8563d93255f5f4a60bb8c5736a994d8151
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout exact current GOV-DOC canonical 13-domain source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a1d783e31e6e22b037f0d9140a8046f25da210fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 Composer and DB extension suite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 exact lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native database CLI tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
      - name: Verify exact merged Main, immutable official v0.1.8 and Mode D scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = b77c7e8563d93255f5f4a60bb8c5736a994d8151
          test "$(git -C p08 rev-parse HEAD^{tree})" = 3793b31af4a317c8ddc9154493e5337f21ba8696
          test "$(cat p08/VERSION)" = 0.1.9
          test "$(git -C gov rev-parse HEAD)" = a1d783e31e6e22b037f0d9140a8046f25da210fc
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = b77c7e8563d93255f5f4a60bb8c5736a994d8151
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = a1d783e31e6e22b037f0d9140a8046f25da210fc
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.8 --jq .id)" = 449806101
          grep -q '## R182 · v0.1.9 / PR #68' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q '### Mode D · OWNER_DIRECT_REVERSIBLE_UI_RELEASE' gov/skills/skill-release/V3.16/SKILL.md
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R183_FINAL_MERGED_MAIN_AND_REVERSIBLE_UI_MODE_D=PASS
      - name: Execute original official 018 to final merged 019 real native SQLite success fault and SIGKILL recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p08_r183_native_once.sh sqlite
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R183_FINAL_MERGED_SOURCE_REAL_018_TO_019_SQLITE_NATIVE=PASS
      - name: Assemble official exact FULL and source-018 manifest-bound Atomic with deterministic build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r183-final"
          cp "$RUNNER_TEMP/p08-r183-sqlite/019-full-A.zip" "$RUNNER_TEMP/p08-r183-final/VF_AdOps_V0.1.9_FULL.zip"
          cp "$RUNNER_TEMP/p08-r183-sqlite/019-update-A.zip" "$RUNNER_TEMP/p08-r183-final/VF_AdOps_V0.1.9_UPDATE.zip"
          cmp "$RUNNER_TEMP/p08-r183-final/VF_AdOps_V0.1.9_FULL.zip" "$RUNNER_TEMP/p08-r183-sqlite/019-full-B.zip"
          cmp "$RUNNER_TEMP/p08-r183-final/VF_AdOps_V0.1.9_UPDATE.zip" "$RUNNER_TEMP/p08-r183-sqlite/019-update-B.zip"
          sha256sum "$RUNNER_TEMP/p08-r183-final/"*.zip
          echo P08_R183_FINAL_REAL_ASSET_BOTH_DOUBLE_BUILD_READBACK=PASS
      - name: Prepare final notes, source/provenance and 4-file SHA256 checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p08-r183-final" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          full="VF_AdOps_V0.1.9_FULL.zip"
          update="VF_AdOps_V0.1.9_UPDATE.zip"
          hash=lambda n:hashlib.sha256((root/n).read_bytes()).hexdigest()
          prov={
            "schema_version":"1.0","product":"P08",
            "repository":"llhzx2018/vf-adops",
            "target_version":"0.1.9",
            "target_sha":"b77c7e8563d93255f5f4a60bb8c5736a994d8151",
            "tree_sha":"3793b31af4a317c8ddc9154493e5337f21ba8696",
            "governance_sha":"a1d783e31e6e22b037f0d9140a8046f25da210fc",
            "release_mode":"V3.16_MODE_D_REVERSIBLE_UI_RELEASE",
            "source_pr":68,
            "asset_role":"CLEAN_FULL_AND_ATOMIC_018_TO_019",
            "source_version":"0.1.8",
            "source_sha":"76511f1b0263abf4de34dbfafd87b918eb60e209",
            "source_full_manifest_sha256":"fe0f25494df364811c1e58883e7f88c445f34229201dc8ea1e7594dd7c08fd90",
            "data_included":False,
            "schema_changes":False,
            "production_auto_apply":False,
            "full_sha256":hash(full),
            "full_bytes":(root/full).stat().st_size,
            "atomic_sha256":hash(update),
            "atomic_bytes":(root/update).stat().st_size,
            "machine_3db_run":"44291278333"
          }
          (root/"RELEASE_PROVENANCE.json").write_text(json.dumps(prov,sort_keys=True,indent=2)+"\n")
          notes="""# VF AdOps v0.1.9 — First official code-only Atomic from installed v0.1.8
          
          v0.1.9 updates the existing Owner Updates page: a completed check that finds no newer compatible version now shows 已检查 · 无更新 instead of permanently showing 等待检查. No database migrations, authentication changes, updater mechanism changes or domain pinning are introduced. Full remains exclusively for brand-new EMPTY site installation; existing v0.1.8 sites should use the backend Atomic UPDATE, never extract FULL over existing data.
          
          The official UPDATE is only from the exact issued v0.1.8 FULL, source 76511f1b0263abf4de34dbfafd87b918eb60e209 with original manifest SHA256 fe0f25494df364811c1e58883e7f88c445f34229201dc8ea1e7594dd7c08fd90, to exact source b77c7e8563d93255f5f4a60bb8c5736a994d8151. It has no database schema changes. Prior v0.1.5→v0.1.7 Atomic is superseded in the sole current channel only after this release passes remote readback and the channel metadata is separately source-locked and verified. Prior immutable v0.1.7 and v0.1.8 GitHub releases remain accessible.
          
          Independent actual v0.1.8 issued FULL→v0.1.9 native MySQL8.4/MariaDB11.8/SQLite backup, success, after-swap rollback, SIGKILL and recovery all passed: https://github.com/llhzx2018/core-free-runner-public/actions/runs/44291278333 . Postmerge final SQLite native and exact remote asset readback are part of this issuance job. Owner manually controls update check, preparation/backup and final confirmed apply on their CloudPanel site. Production and DNS are never automatically modified. Human Real Use remains PENDING until Owner reports back.
          """
          (root/"RELEASE_NOTES.md").write_text(notes)
          names=[full,update,"RELEASE_PROVENANCE.json","RELEASE_NOTES.md"]
          (root/"SHA256SUMS").write_text("\n".join(hash(n)+"  "+n for n in names)+"\n")
          print("P08_R183_FINAL_FULL_ATOMIC_RELEASE_PROVENANCE_AND_CHECKSUMS=PASS")
          PY
      - name: Issue only after verified hard gates then read back official real bytes SHA asset IDs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_R183_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_r183_v019_release_once.py
      - name: Always remove disposable private checkouts and release buffers
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r183-final" "$RUNNER_TEMP/p08-r183-sqlite" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-kill"
          test ! -e p08 && test ! -e gov
