name: P02 V2.5.54 Discovery Gate

on:
  push:
    branches:
      - run/p02-v2553-discovery-20260920
    paths:
      - '.github/workflows/p02-v2553-discovery-gate.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P02 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 28d10171aad527006ea5cc898aceeb3eca45909c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Checkout canonical core-updates manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: a9af475a6dad01b6f6e8011fd3d25b76d41f3d0b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates

      - name: Verify public stable discovery semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/projects/P02.json' > /tmp/P02.json
          cmp updates/projects/P02.json /tmp/P02.json
          echo P02_V2554_CANONICAL_MIRROR_MATCH=PASS
          python3 - /tmp/P02.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['project_id']=='P02'
          assert x['component_id']=='APP'
          assert x['enabled'] is True
          assert x['current_version']=='2.5.53'
          assert x['target_version']=='2.5.54'
          assert x['from_versions']==['2.5.35','2.5.36','2.5.37','2.5.38','2.5.39','2.5.40','2.5.41','2.5.53']
          assert x['schema_from']==x['schema_to']=='2401'
          assert x['repository']=='llhzx2018/vf-library'
          assert x['release_tag']=='v2.5.54'
          assert x['release_id']==392385983
          assert x['product_identity']=='28d10171aad527006ea5cc898aceeb3eca45909c'
          assert x['asset_name']=='VF_Library_V2.5.54_UPDATE.zip'
          assert x['asset_bytes']==390501
          assert x['asset_sha256']=='dec65da63e05f36d75850759fad21089afef57ec99bf6f564f1b374f1bf71e3e'
          assert x['backup_required'] is True and x['rollback_supported'] is True
          print('P02_V2554_PUBLIC_MANIFEST_IDENTITY=PASS')
          PY
          php -r '
            require "product/src/app/CoreUpdates/UpdateAdapter.php";
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $m=json_decode(file_get_contents("/tmp/P02.json"),true,512,JSON_THROW_ON_ERROR);
            $c=new \CoreUpdates\UpdateCore("P02","APP");
            foreach(["2.5.35","2.5.36","2.5.37","2.5.38","2.5.39","2.5.40","2.5.41","2.5.53"] as $v){
              $r=$c->check($v,"2401",$m);
              if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,$v.":".json_encode($r)."\n");exit(2);}
              echo "P02_V2554_DISCOVERY_".$v."=AVAILABLE\n";
            }
            $r=$c->check("2.5.54","2401",$m);
            if(($r["status"]??"")!=="UP_TO_DATE"){fwrite(STDERR,json_encode($r)."\n");exit(3);}
            echo "P02_V2554_DISCOVERY_2.5.54=UP_TO_DATE\n";
          '
          echo P02_V2554_DISCOVERY_GATE=PASS
