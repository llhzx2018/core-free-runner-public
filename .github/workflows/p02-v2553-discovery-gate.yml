name: P02 V2.5.53 Discovery Gate

on:
  push:
    branches:
      - run/p02-v2553-discovery-20260920
    paths:
      - '.github/workflows/p02-v2553-discovery-gate.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P02 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: e0afdb745a61f8bf21d7d81c734a589bc3194fe8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Checkout canonical core-updates manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 8dd6bdef26b36930aa3f79be822e63de188a5c11
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: updates

      - name: Verify public stable discovery semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/projects/P02.json' > /tmp/P02.json
          cmp updates/projects/P02.json /tmp/P02.json
          echo P02_V2553_CANONICAL_MIRROR_MATCH=PASS
          python3 - /tmp/P02.json <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['project_id']=='P02'
          assert x['component_id']=='APP'
          assert x['enabled'] is True
          assert x['current_version']=='2.5.41'
          assert x['target_version']=='2.5.53'
          assert x['from_versions']==['2.5.35','2.5.36','2.5.37','2.5.38','2.5.39','2.5.40','2.5.41']
          assert x['schema_from']==x['schema_to']=='2401'
          assert x['repository']=='llhzx2018/vf-library'
          assert x['release_tag']=='v2.5.53'
          assert x['release_id']==392362728
          assert x['product_identity']=='e0afdb745a61f8bf21d7d81c734a589bc3194fe8'
          assert x['asset_name']=='VF_Library_V2.5.53_UPDATE.zip'
          assert x['asset_bytes']==389775
          assert x['asset_sha256']=='dd804513de69a177b35cd29a397fc99f04040927ffeed548bd9d8cd546a33faa'
          assert x['backup_required'] is True and x['rollback_supported'] is True
          print('P02_V2553_PUBLIC_MANIFEST_IDENTITY=PASS')
          PY
          php -r '
            require "product/src/app/CoreUpdates/UpdateAdapter.php";
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $m=json_decode(file_get_contents("/tmp/P02.json"),true,512,JSON_THROW_ON_ERROR);
            $c=new \CoreUpdates\UpdateCore("P02","APP");
            foreach(["2.5.35","2.5.36","2.5.37","2.5.38","2.5.39","2.5.40","2.5.41"] as $v){
              $r=$c->check($v,"2401",$m);
              if(($r["status"]??"")!=="AVAILABLE"){fwrite(STDERR,$v.":".json_encode($r)."\n");exit(2);}
              echo "P02_V2553_DISCOVERY_".$v."=AVAILABLE\n";
            }
            $r=$c->check("2.5.53","2401",$m);
            if(($r["status"]??"")!=="UP_TO_DATE"){fwrite(STDERR,json_encode($r)."\n");exit(3);}
            echo "P02_V2553_DISCOVERY_2.5.53=UP_TO_DATE\n";
          '
          echo P02_V2553_DISCOVERY_GATE=PASS
