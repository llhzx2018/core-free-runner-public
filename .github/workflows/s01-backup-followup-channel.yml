name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-backup-followup158-20261021]
    paths: ['.github/workflows/s01-backup-followup-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.158
  TARGET_SHA: d126c8b7b3a142456df2050ded051fa3d3b70e58
  UPDATE_SHA: 4e5b12c721e9761002227efb320b5b51e72df3ef
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 4e5b12c721e9761002227efb320b5b51e72df3ef
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='f9866ee9178fef0df40c3bb520fcc422667a306f74d1324f2db6560820d9bafa' and m['asset_bytes']==1971702
          assert m['runtime_files']==476 and '1.35.157' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
