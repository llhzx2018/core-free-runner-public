name: P01 V2.35.2 Publication Gate

on:
  push:
    branches: [release/p01-v2352-publication-20260831]
    paths: [.github/workflows/p01-v2352-publication-20260831.yml]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAL_SOURCE: 3c9239be8bba34637411110f7fdb43f6e494c880
      FORMAL_TREE: 5d179443e215879259e3b5560c5e3c0342c2149b
      RUNTIME_TREE: f000f39c1a2cf48296a4c165726323dabaf5e37c
      FORMAL_RUN: '33347322224'
      FORMAL_ARTIFACT: p01-v2352-formal-artifacts-33347322224
      FORMAL_DIGEST: sha256:94c13fc54833a0e5bfd8efb80a59f2419fb9b5e979b380c0d0d2e221e4546b58
      STRICT_RUN: '33347594730'
      PROMOTION_RUN: '33347651122'
      ART: /tmp/p01-v2352-publish-artifacts
      ROUNDTRIP: /tmp/p01-v2352-release-roundtrip
      EVID: /tmp/p01-v2352-publication-evidence
    steps:
      - name: Download exact Formal Artifact Gate bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.FORMAL_ARTIFACT }}
          path: ${{ env.ART }}
          repository: llhzx2018/core-free-runner-public
          run-id: ${{ env.FORMAL_RUN }}
          github-token: ${{ github.token }}

      - name: Checkout exact formal source for Git write authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Publish immutable tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"; rm -rf "$ROUNDTRIP"; mkdir -p "$ROUNDTRIP"
          cd "$GITHUB_WORKSPACE/p01"
          test "$(git rev-parse HEAD)" = "$FORMAL_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$FORMAL_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          DEVELOP=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          test "$MAIN" = "$FORMAL_SOURCE"
          test "$DEVELOP" = "$FORMAL_SOURCE"
          if git ls-remote --exit-code --tags origin refs/tags/v2.35.2 >/dev/null 2>&1; then echo UNEXPECTED_TAG; exit 20; fi
          if gh api repos/llhzx2018/vf-start/releases/tags/v2.35.2 >/dev/null 2>&1; then echo UNEXPECTED_RELEASE; exit 21; fi
          cd "$ART"
          test "$(find . -maxdepth 1 -type f | wc -l)" = 8
          sha256sum -c SHA256SUMS.txt
          test "$(jq -r .release_source P01-V2.35.2-FORMAL-METADATA.json)" = "$FORMAL_SOURCE"
          test "$(jq -r .formal_artifact_gate_run P01-V2.35.2-FORMAL-METADATA.json)" = "$FORMAL_RUN"
          cp SHA256SUMS.txt "$EVID/prepublish-SHA256SUMS.txt"

          cd "$GITHUB_WORKSPACE/p01"
          git push origin "$FORMAL_SOURCE:refs/tags/v2.35.2"
          TAG=$(git ls-remote --tags origin refs/tags/v2.35.2 | awk '{print $1}')
          test "$TAG" = "$FORMAL_SOURCE"

          gh release create v2.35.2 "$ART"/* \
            --repo llhzx2018/vf-start \
            --verify-tag \
            --title 'VF Start V2.35.2' \
            --notes 'V2.35.2 是 V2.35.1 后的 Online Update Terminal-State Patch Release。修复 Current >= Latest 时仍出现安装动作或旧错误残留，以及 update_prepare 精确返回“当前已经是最新版本。”时错误渲染红色失败的问题。真正的 prepare / download / SHA-256 / Atomic 错误仍保持失败语义；存在新版本时安装按钮正常显示。Schema 保持 2026082901，无 Migration。Candidate Readiness 33347168167 PASS；Formal Artifact 33347322224 PASS；Strict Fresh 33347594730 PASS；Main Promotion 33347651122 PASS。Owner Production 不由 Assistant 自动修改。'

          gh api repos/llhzx2018/vf-start/releases/tags/v2.35.2 > "$EVID/release.json"
          test "$(jq -r .tag_name "$EVID/release.json")" = v2.35.2
          test "$(jq -r .draft "$EVID/release.json")" = false
          test "$(jq -r .prerelease "$EVID/release.json")" = false
          test "$(jq '.assets|length' "$EVID/release.json")" = 8
          gh release download v2.35.2 --repo llhzx2018/vf-start --dir "$ROUNDTRIP"
          for f in "$ART"/*; do
            n=$(basename "$f")
            test -f "$ROUNDTRIP/$n"
            test "$(sha256sum "$f" | awk '{print $1}')" = "$(sha256sum "$ROUNDTRIP/$n" | awk '{print $1}')"
            test "$(stat -c %s "$f")" = "$(stat -c %s "$ROUNDTRIP/$n")"
          done
          UPDATE_SHA=$(sha256sum "$ROUNDTRIP/VF_Start_V2.35.2_UPDATE.zip" | awk '{print $1}')
          UPDATE_BYTES=$(stat -c %s "$ROUNDTRIP/VF_Start_V2.35.2_UPDATE.zip")
          RELEASE_ID=$(jq -r .id "$EVID/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$EVID/release.json")
          printf 'P01_V2352_PUBLICATION=PASS\nTAG=%s\nRELEASE_ID=%s\nPUBLISHED_AT=%s\nUPDATE_ASSET=VF_Start_V2.35.2_UPDATE.zip\nUPDATE_BYTES=%s\nUPDATE_SHA256=%s\nFORMAL_SOURCE=%s\nFORMAL_ARTIFACT_DIGEST=%s\nSTRICT_FRESH_RUN=%s\nMAIN_PROMOTION_RUN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$TAG" "$RELEASE_ID" "$PUBLISHED_AT" "$UPDATE_BYTES" "$UPDATE_SHA" "$FORMAL_SOURCE" "$FORMAL_DIGEST" "$STRICT_RUN" "$PROMOTION_RUN" | tee "$EVID/verdict.txt"
          jq -r '.assets[] | [.name,.size,(.digest//"")] | @tsv' "$EVID/release.json" | sort > "$EVID/release-assets.tsv"

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2352-publication-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
