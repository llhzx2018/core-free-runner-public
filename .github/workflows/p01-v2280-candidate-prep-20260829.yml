name: P01 V2.28 Candidate Identity Prep
on:
  push:
    branches: [task/p01-v2280-candidate-prep-20260829]
    paths:
      - .github/workflows/p01-v2280-candidate-prep-20260829.yml
      - .github/scripts/p01-v228-candidate-prep-20260829.sh
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: candidate/p01-v2.28.0-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/p01-v2280-candidate-prep-20260829
          path: runner
      - name: Finalize candidate identity
        run: bash runner/.github/scripts/p01-v228-candidate-prep-20260829.sh
