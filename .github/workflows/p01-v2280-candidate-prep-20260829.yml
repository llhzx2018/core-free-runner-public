name: P01 V2.28 Candidate Identity Prep
on:
  push:
    branches: [task/p01-v2280-candidate-prep-20260829]
    paths:
      - .github/workflows/p01-v2280-candidate-prep-20260829.yml
permissions:
  contents: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: candidate/p01-v2.28.0-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Finalize version identity and candidate changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(tr -d '\r\n' < VERSION)" = '2.28.0'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.28.0'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.27.0');"
          new="define('VF_VERSION', '2.28.0');"
          if s.count(old)!=1:
              raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          c=Path('CHANGELOG.md')
          s=c.read_text(encoding='utf-8')
          if s.startswith('## V2.28.0'):
              raise SystemExit('V2.28 changelog already exists unexpectedly')
          entry='''## V2.28.0 · Candidate / Not Released · 2026-08-29

- 大收藏量工作区补齐分类 / Surface 过滤、30/50/100 每页、结果区间与完整分页，All / Start / Channels / Watch 在大量数据下保持连续定位。
- Add Modal / Detail Drawer 继承当前 Surface 与分类；新增“添加并继续”、Ctrl/Cmd+Enter 保存及 reload 后滚动位置恢复。
- Bulk 整理支持 Shift 连选、明确选中态、清除/Esc、收藏状态就地同步、移动端换行工具条；分类 / Surface / 归档继续使用受控 Mutation。
- Channels / Watch 补齐分类过滤、每页数量、完整分页；Watch 状态中文化，Channels rediscovery 不再覆盖搜索/分类筛选。
- Schema 保持 `2026082801`；URL Identity、Sparse Surface Profile、Admin/CSRF、Public Start、Backup/Recovery/Atomic Update 安全边界不变。
- 本条目仅声明 `develop` / Candidate 状态；未执行 Tag、GitHub Release、main 晋级、core-updates 或 Production 写入。

'''
          c.write_text(entry+s,encoding='utf-8',newline='\n')
          PY
          grep -Fx "define('VF_VERSION', '2.28.0');" src/app/bootstrap.php
          grep -F '## V2.28.0 · Candidate / Not Released · 2026-08-29' CHANGELOG.md
          php -l src/app/bootstrap.php >/dev/null
          git diff --check
          git diff --name-only | sort >/tmp/p01-v228-prep-files.txt
          printf 'CHANGELOG.md\nsrc/app/bootstrap.php\n' >/tmp/p01-v228-prep-expected.txt
          diff -u /tmp/p01-v228-prep-expected.txt /tmp/p01-v228-prep-files.txt
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md src/app/bootstrap.php
          git commit -m 'release(P01): finalize V2.28.0 candidate identity'
          git push origin HEAD:candidate/p01-v2.28.0-20260829
          echo P01_V228_IDENTITY_PREP=PASS
