name: TEMP S01-C02 1.21.923 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 05c7e7c51e4001b02e79b6cd067be2059fc66a04
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.923
      ASSET: vf-tools-ops_V1.21.923.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 05c7e7c51e4001b02e79b6cd067be2059fc66a04
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact distribution source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.923"
          assert m["release_tag"]=="v1.21.923"
          assert m["asset_name"]=="vf-tools-ops_V1.21.923.zip"
          assert m["asset_bytes"]==3496027
          assert m["asset_sha256"]=="b5f9eb89541d61c097262da0e8333cb05ecbed52d6b09de1c664e0a162f59915"
          assert m["runtime_files"]==976
          assert m["runtime_fingerprint"]=="9ca84766444c47e16351ec717a61339fddb6d0568956f355612418dca7f0ea03"
          assert "1.21.922" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.923 manifest identity PASS")
          PY

      - name: Manifest contract audit
        shell: bash
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Formal release remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "08619b50fb0dc90aecd22bb37f550780a131e0a4"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3496027"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:b5f9eb89541d61c097262da0e8333cb05ecbed52d6b09de1c664e0a162f59915"
          echo "S01-C02 1.21.923 Distribution exact-source proof PASS"

      - name: Remove transient checkout
        if: always()
        shell: bash
        run: rm -rf updates

# synchronize distribution proof
