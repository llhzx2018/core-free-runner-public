name: S01 Ops 1.21.884 V7 R2 Candidate Gate
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Ops source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f0455c7551b4a1b9fd65036ecc4d1dc04e0bc906
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f0455c7551b4a1b9fd65036ecc4d1dc04e0bc906"
          test "$(tr -d '\r\n' < VERSION)" = "1.21.884"
          php tests/s01-c02-121884-v7-r2-dashboard-tools-contract.php
          echo PASS_S01_OPS_121884_V7_R2
