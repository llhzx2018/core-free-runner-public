# one-off lane: close without merge
name: S01 Ops 1.21.888 V7 R6 Release Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      CANDIDATE_SHA: 841102c84df5e3adab48ccb6b89243dcbbeb3b59
      BASE_SHA: 4a216b9dec736faa7754de6fd93077e008ea02ac
      VERSION: 1.21.888
      PREVIOUS_TAG: v1.21.887
      PREVIOUS_ASSET: vf-tools-ops_V1.21.887.zip
      ASSET: vf-tools-ops_V1.21.888.zip

    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 841102c84df5e3adab48ccb6b89243dcbbeb3b59
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and scope fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.888' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.888'" ops/vf-ops.php
          grep -Fq 'S01-MATURE-ADMIN-V7-R6-SYSTEM-WORKSPACE' ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-v7-system-r6.css \
            docs/ui/S01_MATURE_ADMIN_V7_PRODUCT_SYSTEM.md \
            includes/admin-v13/views/system_site_release_v6.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121888-v7-r6-system-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- database config includes/v6 includes/wp-update | wc -l)" = "0"
          echo PASS_EXACT_IDENTITY_AND_SCOPE

      - name: Contract, syntax, UI and ownership gates
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-121888-v7-r6-system-contract.php
          php -l ops/vf-ops.php >/dev/null
          php -l ops/includes/admin-v13/views/system_site_release_v6.php >/dev/null
          php -l ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find ops/includes -type f -name '*.php' -print0 | sort -z)
          grep -Fq 'data-vf-v7-r6-system="1"' ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq 'vf_ops_site_release_admin_post_v121646' ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq 'ops.siteRelease.save' ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq 'ops.siteRelease.test' ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq '.vf-v6-ps-primary' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '.vf-v6-ps-field-grid' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '.vf-v6-ps-workspace-grid' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '.vf-v6-ps-chain-list' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '.vf-v6-ps-component-list' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '@media (max-width:520px)' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '@media (forced-colors:active)' ops/assets/css/current/admin-s01-v7-system-r6.css
          grep -Fq '@media (prefers-reduced-motion:reduce)' ops/assets/css/current/admin-s01-v7-system-r6.css
          ! grep -Fq 'position: fixed' ops/assets/css/current/admin-s01-v7-system-r6.css
          echo PASS_CONTRACT_SYNTAX_UI_OWNERSHIP

      - name: Security residue and updater fence
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
            ops/vf-ops.php \
            ops/includes/admin-v13/views/system_site_release_v6.php \
            ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            ops/assets/css/current/admin-s01-v7-system-r6.css \
            ops/docs/ui/S01_MATURE_ADMIN_V7_PRODUCT_SYSTEM.md
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- includes/wp-update config database | wc -l)" = "0"
          echo PASS_SECURITY_RESIDUE_AND_UPDATER_FENCE

      - name: Build deterministic runtime-only package
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage dist
          mkdir -p stage/vf-ops dist
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, zipfile
          root=Path('ops')
          stage=Path('stage/vf-ops')
          def runtime(rel):
              rel=rel.replace('\\','/').lstrip('/')
              if not rel or '../' in rel: return False
              if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): return False
              if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): return False
              if '/' not in rel: return rel in ('vf-ops.php','uninstall.php')
              return re.match(r'^(?:includes|assets|languages|config)/',rel) is not None
          files=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              if not runtime(rel): continue
              if p.is_symlink(): raise SystemExit('runtime symlink forbidden: '+rel)
              data=p.read_bytes()
              files.append((rel,data))
              q=stage/rel
              q.parent.mkdir(parents=True,exist_ok=True)
              q.write_bytes(data)
          canonical=b''.join(rel.encode()+b'\0'+hashlib.sha256(data).hexdigest().encode()+b'\n' for rel,data in files)
          Path('/tmp/runtime_count').write_text(str(len(files)))
          Path('/tmp/runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          for out in ('dist/vf-tools-ops_V1.21.888.zip','dist/rebuild-vf-tools-ops_V1.21.888.zip'):
              with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,data in files:
                      info=zipfile.ZipInfo('vf-ops/'+rel,date_time=(2020,1,1,0,0,0))
                      info.compress_type=zipfile.ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF) << 16
                      z.writestr(info,data)
          print('RUNTIME_FILES='+str(len(files)))
          print('RUNTIME_FINGERPRINT='+hashlib.sha256(canonical).hexdigest())
          PY
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-ops"
          unzip -p "dist/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.888'
          unzip -Z1 "dist/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-v7-system-r6.css'
          test "$(cat /tmp/runtime_count)" = "960"
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/asset_sha
          stat -c '%s' "dist/$ASSET" > /tmp/asset_bytes
          echo PASS_DETERMINISTIC_RUNTIME_PACKAGE

      - name: Previous release compatibility and runtime delta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          test "$(stat -c '%s' "previous/$PREVIOUS_ASSET")" = "3429208"
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "b0258ace0ba9fa92ccdd04c3e5decee55234c80176ed1bfb80c7364f027bdd36"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -Z1 "previous/$PREVIOUS_ASSET" | grep -v '/$' | sort > /tmp/prev_files.txt
          unzip -Z1 "dist/$ASSET" | grep -v '/$' | sort > /tmp/new_files.txt
          comm -13 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/added.txt
          comm -23 /tmp/prev_files.txt /tmp/new_files.txt > /tmp/removed.txt
          test "$(cat /tmp/added.txt)" = 'vf-ops/assets/css/current/admin-s01-v7-system-r6.css'
          test ! -s /tmp/removed.txt
          python3 - <<'PY'
          import hashlib, re, zipfile
          p='previous/vf-tools-ops_V1.21.887.zip'
          rows=[]
          with zipfile.ZipFile(p) as z:
              for n in sorted(z.namelist()):
                  if n.endswith('/') or not n.startswith('vf-ops/'): continue
                  rel=n[len('vf-ops/'):]
                  if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I): continue
                  if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I): continue
                  ok=(('/' not in rel and rel in ('vf-ops.php','uninstall.php')) or re.match(r'^(?:includes|assets|languages|config)/',rel))
                  if not ok: continue
                  data=z.read(n)
                  rows.append((rel,hashlib.sha256(data).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          assert len(rows)==959, len(rows)
          assert hashlib.sha256(canonical).hexdigest()=='d5baf0bbdc2d63a8317d45ae5ef3bd49fe8c7cbc20dd8f99e4b00c5dec71af1b'
          print('PASS_PREVIOUS_RUNTIME_AUTHORITY')
          PY
          echo PASS_PREVIOUS_RELEASE_COMPATIBILITY

      - name: Candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > dist/candidate-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$CANDIDATE_SHA
          BASE_RELEASE=$PREVIOUS_TAG
          ASSET=$ASSET
          BYTES=$(cat /tmp/asset_bytes)
          SHA256=$(cat /tmp/asset_sha)
          RUNTIME_FILES=$(cat /tmp/runtime_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/runtime_fp)
          RUNTIME_ADDED=assets/css/current/admin-s01-v7-system-r6.css
          RUNTIME_REMOVED=NONE
          SECURITY=PASS
          TESTING=PASS
          UPGRADE=PASS
          OBSERVABILITY=PASS_RELEASE_AND_RUNTIME_READBACK_REQUIRED
          GIT=PASS
          UA_UI=PASS_CONTRACT_RESPONSIVE_ACCESSIBILITY
          INSTALL=N_A_EXISTING_UPDATE
          DATA_SCHEMA=N_A_NO_SCHEMA_OR_DATA_CHANGE
          SCHEMA=6.0.0_TO_6.0.0
          DATA_MIGRATION=NONE
          SIX_DOMAIN_IA=UNCHANGED
          CANONICAL_ROUTES=UNCHANGED
          M3U8_OWNERSHIP=UNCHANGED
          THEME_OWNERSHIP=UNCHANGED
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat dist/candidate-receipt.txt
          echo PASS_S01_OPS_121888_CANDIDATE_GATE

      - name: Upload exact tested candidate
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121888-candidate
          path: |
            dist/vf-tools-ops_V1.21.888.zip
            dist/candidate-receipt.txt
          if-no-files-found: error
          retention-days: 14

  formal-release:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPO: llhzx2018/vf-tools-ops
      SOURCE_SHA: 841102c84df5e3adab48ccb6b89243dcbbeb3b59
      VERSION: 1.21.888
      TAG: v1.21.888
      ASSET: vf-tools-ops_V1.21.888.zip

    steps:
      - name: Download exact tested candidate
        uses: actions/download-artifact@v4
        with:
          name: s01-c02-121888-candidate
          path: tested

      - name: Verify tested artifact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "tested/$ASSET"
          test -f tested/candidate-receipt.txt
          grep -Fqx "VERSION=$VERSION" tested/candidate-receipt.txt
          grep -Fqx "SOURCE_SHA=$SOURCE_SHA" tested/candidate-receipt.txt
          grep -Fqx "ASSET=$ASSET" tested/candidate-receipt.txt
          grep -Fqx 'RESULT=PASS' tested/candidate-receipt.txt
          unzip -tq "tested/$ASSET" >/dev/null
          unzip -p "tested/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.888'
          echo PASS_EXACT_TESTED_ARTIFACT

      - name: Create exact formal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite." >&2
            exit 31
          fi
          test "$(gh api "repos/$TARGET_REPO/commits/$SOURCE_SHA" --jq '.sha')" = "$SOURCE_SHA"
          BYTES="$(stat -c '%s' "tested/$ASSET")"
          SHA="$(sha256sum "tested/$ASSET" | awk '{print $1}')"
          RUNTIME_FILES="$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)"
          RUNTIME_FP="$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)"
          cat > /tmp/release-notes.md <<EOF
          # VF Tools Ops V1.21.888

          **S01-C02 · Mature Admin V7 R6 System / Update / Recovery Workspace Rebuild**

          R6 continues the shared V7 Product System:
          - System now leads with a compact environment judgement and one primary save/test task.
          - Environment facts are an inline strip and production settings read as continuous rows.
          - Domain rules, chain evidence, component state and recovery details stay under Advanced.
          - Existing site-release save/test actions, domain-chain semantics, updater and recovery ownership remain unchanged.
          - Six-domain IA, system route, schema, data and shared updater semantics remain unchanged.

          Safety:
          - Schema 6.0.0 -> 6.0.0
          - Data Migration NONE
          - Rollback v1.21.887
          - OWNER Real-use POST_RELEASE_NOT_RUN

          Exact asset:
          - $ASSET
          - Bytes $BYTES
          - SHA-256 $SHA
          - Runtime files $RUNTIME_FILES
          - Runtime Fingerprint $RUNTIME_FP
          EOF
          created=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ] && [ "$created" -eq 1 ]; then gh release delete "$TAG" --repo "$TARGET_REPO" --cleanup-tag -y >/dev/null 2>&1 || true; fi; exit "$rc"; }
          trap cleanup EXIT
          gh release create "$TAG" "tested/$ASSET#VF Tools Ops $VERSION" \
            --repo "$TARGET_REPO" \
            --target "$SOURCE_SHA" \
            --title "VF Tools Ops V$VERSION" \
            --notes-file /tmp/release-notes.md
          created=1
          trap - EXIT
          echo PASS_FORMAL_RELEASE_CREATED

      - name: Independent remote release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPO/releases/tags/$TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          REMOTE_BYTES="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          test -n "$RID" && test "$RID" != null
          test -n "$AID" && test "$AID" != null
          test "$REMOTE_BYTES" = "$(stat -c '%s' "tested/$ASSET")"
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          mkdir -p remote
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir remote
          test "$(sha256sum "remote/$ASSET" | awk '{print $1}')" = "$(sha256sum "tested/$ASSET" | awk '{print $1}')"
          cmp "tested/$ASSET" "remote/$ASSET"
          cat > formal-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$SOURCE_SHA
          TAG=$TAG
          RELEASE_ID=$RID
          ASSET=$ASSET
          ASSET_ID=$AID
          BYTES=$REMOTE_BYTES
          SHA256=$(sha256sum "remote/$ASSET" | awk '{print $1}')
          RUNTIME_FILES=$(awk -F= '$1=="RUNTIME_FILES"{print $2}' tested/candidate-receipt.txt)
          RUNTIME_FINGERPRINT=$(awk -F= '$1=="RUNTIME_FINGERPRINT"{print $2}' tested/candidate-receipt.txt)
          TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS
          REMOTE_READBACK=PASS
          PRODUCTION=NOT_YET_CLAIMED
          OWNER_REAL_USE=POST_RELEASE_NOT_RUN
          RESULT=PASS
          EOF
          cat formal-release-receipt.txt
          echo PASS_S01_OPS_121888_FORMAL_RELEASE

      - name: Upload formal release receipt
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-121888-formal-release
          path: formal-release-receipt.txt
          if-no-files-found: error
          retention-days: 30
