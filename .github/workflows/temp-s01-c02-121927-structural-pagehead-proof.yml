name: TEMP S01-C02 1.21.927 Structural Pagehead Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: 82d522ba56c674dbbacd6bf7622f34212f73fe91
      BASE_SHA: 08ec70e29a4fddeba4f949bf40e190ee39cb61a2

    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 82d522ba56c674dbbacd6bf7622f34212f73fe91
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Exact bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.927"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-structural-pagehead-r38.css \
            includes/s01/tool-workbench.php \
            includes/s01/v6-landing-shell.php \
            includes/views/admin-shell-tabs-parts/02-shell-navigation.php \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121927-structural-pagehead-r38-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/wp-update includes/admin-v13/route-contract.php includes/admin-v13/tab-controller.php includes/admin-v13/services docs/authority | wc -l)" = "0"

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/s01/tool-workbench.php
          php -l product/includes/s01/v6-landing-shell.php
          php -l product/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l product/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l product/tests/s01-c02-121927-structural-pagehead-r38-contract.php

      - name: R38 product contract
        shell: bash
        run: |
          set -euo pipefail
          php product/tests/s01-c02-121927-structural-pagehead-r38-contract.php

      - name: Independent 40-surface structural shell proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("product")
          route=(root/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")
          nav=(root/"includes/views/admin-shell-tabs-parts/02-shell-navigation.php").read_text(encoding="utf-8")
          landing=(root/"includes/s01/v6-landing-shell.php").read_text(encoding="utf-8")
          tools=(root/"includes/s01/tool-workbench.php").read_text(encoding="utf-8")
          loader=(root/"includes/views/admin-style-helpers/admin-s01-uiux-polish.php").read_text(encoding="utf-8")
          css=(root/"assets/css/current/admin-s01-structural-pagehead-r38.css").read_text(encoding="utf-8")

          rows=[]
          for line in route.splitlines():
              m=re.match(r"^\s*'([^']+)'\s*=>\s*\[(.*)\],?\s*$",line)
              if not m: continue
              key,body=m.group(1),m.group(2)
              vm=re.search(r"'view'=>'(admin-v13/views/[^']+)'",body)
              sm=re.search(r"'status'=>'([^']+)'",body)
              lm=re.search(r"'label'=>'([^']+)'",body)
              pm=re.search(r"'page'=>'([^']+)'",body)
              if vm and sm:
                  rows.append({
                    "key":key,
                    "view":vm.group(1),
                    "status":sm.group(1),
                    "label":lm.group(1) if lm else "",
                    "page":pm.group(1) if pm else ""
                  })

          assert len(rows)==39, len(rows)
          assert sum(1 for r in rows if r["status"]=="migration_evidence")==13
          assert sum(1 for r in rows if r["status"]!="migration_evidence")==26

          non_shell=[]
          for r in rows:
              assert r["label"], r["key"]
              assert ("'"+r["key"]+"'") in nav or ('"'+r["key"]+'"') in nav, r["key"]
              txt=(root/"includes"/r["view"]).read_text(encoding="utf-8",errors="ignore")
              if "vf_ops_render_admin_open(" not in txt and "vf_ops_s01_v6_render_landing_open_v1(" not in txt:
                  non_shell.append((r["key"],r["view"]))
          assert not non_shell, non_shell

          assert "function vf_ops_v13_render_unified_page_header_v121927(array $route): void" in nav
          assert nav.count("vf_ops_v13_render_unified_page_header_v121927($route);") >= 1
          assert "vf_ops_v13_render_unified_page_header_v121927($route);" in landing
          assert "vf_ops_v13_render_unified_page_header_v121927(['page'=>'vf-toolsite-tools','label'=>'M3U8 Downloader','status'=>'active']);" in tools
          assert "'vf-toolsite-tools' => '工具'" in nav

          # Five clean-authority loader paths + one generic route path.
          assert loader.count("vf-ops-admin-s01-structural-pagehead-r38")==6
          assert loader.count("assets/css/current/admin-s01-structural-pagehead-r38.css")==6

          assert "data-vf-unified-pagehead=\"r38\"" in nav
          assert ".vf-v6-page-canvas h1" in css
          assert "display:none!important" in css
          assert ".vf-v8-tools-pagehead" in css
          assert css.count("{")==css.count("}")

          print("FORMAL_ROUTE_SURFACES=39")
          print("STANDALONE_TOOL_SURFACES=1")
          print("OWNER_VISIBLE_SURFACES=40")
          print("ROUTES_USING_SHARED_SHELL=39/39")
          print("STRUCTURAL_PAGEHEAD_RENDERER=1")
          print("UNKNOWN_ORPHAN_AUTHORITY=0")
          print("RESULT=PASS")
          PY

      - name: Cleanup
        if: always()
        run: rm -rf product

# synchronize structural pagehead proof
