name: P04 V2.5.2 Bridge Artifact Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v252-bridge-artifact-gate.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE: 91984268ffe66781700db9da10de8d509c878c0b
      EXPECTED_BYTES: '41442'
      EXPECTED_SHA: 3431cae2a905110669c8437fd2e2270bc74eacfe297ed4d9768eb3902a94eb10
      EXPECTED_SOURCE_FILES: '148'
      EXPECTED_SOURCE_SHA: 27a7eacb6260d3ef6041019e56d199d822a99de18cc0a0a2efb396231cf9e162
      RELEASE_ASSET_API: https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/515855401
      SELF: .github/workflows/p04-v252-bridge-artifact-gate.yml
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact P04 Candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p04
          fetch-depth: 1

      - name: Rebuild exact V2.5.2 runtime and update
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p04
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(cat VERSION)" = '2.5.2'
          python3 scripts/build-release-tree.py "$RUNNER_TEMP/v252-runtime"
          python3 scripts/build-v252-update-release.py --target-runtime "$RUNNER_TEMP/v252-runtime" --output "$RUNNER_TEMP/v252-release"
          test "$(stat -c '%s' "$RUNNER_TEMP/v252-release/VF_Infra_V2.5.2_UPDATE.zip")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/v252-release/VF_Infra_V2.5.2_UPDATE.zip" | awk '{print $1}')" = "$EXPECTED_SHA"
          python3 - "$RUNNER_TEMP/v252-release/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt" <<'PY'
          import sys
          lines=open(sys.argv[1],encoding='utf-8').read().splitlines()
          vals={}
          for line in lines[:5]:
              if line.startswith('# ') and '\t' in line:
                  k,v=line[2:].split('\t',1); vals[k]=v
          assert vals['version']=='2.5.2'
          assert vals['schema']=='14'
          assert vals['file_count']=='148'
          assert vals['manifest_sha256']=='27a7eacb6260d3ef6041019e56d199d822a99de18cc0a0a2efb396231cf9e162'
          print('TARGET_PRODUCTION_SOURCE_IDENTITY=PASS')
          print('TARGET_SOURCE_FILES='+vals['file_count'])
          print('TARGET_SOURCE_MANIFEST_SHA256='+vals['manifest_sha256'])
          PY
          echo 'REBUILT_FORMAL_UPDATE_IDENTITY=PASS'

      - name: Re-read remote formal UPDATE bytes
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          out="$RUNNER_TEMP/remote-update.zip"
          curl --fail --silent --show-error --location --max-time 60 \
            -H 'Accept: application/octet-stream' \
            -H "Authorization: Bearer $READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_ASSET_API" -o "$out"
          test "$(stat -c '%s' "$out")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$out" | awk '{print $1}')" = "$EXPECTED_SHA"
          cmp "$out" "$RUNNER_TEMP/v252-release/VF_Infra_V2.5.2_UPDATE.zip"
          echo 'REMOTE_FORMAL_UPDATE_EXACT_REBUILD=PASS'

      - name: Retire temporary artifact gate
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git pull --ff-only origin main
          git rm "$SELF"
          git commit -m 'test(P04): retire bridge artifact gate [skip ci]'
          git push origin HEAD:main
