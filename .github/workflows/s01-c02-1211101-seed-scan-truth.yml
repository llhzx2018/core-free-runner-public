name: S01 C02 Seed Scan Truth Candidate
on:
  push:
    branches: [task/s01-c02-1211101-seed-scan-truth-20261012]
permissions:
  contents: read
jobs:
  truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 9857f152539faa30948eb3fd14af3de91991904f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify exact source, PHP and scanner scenarios
        run: |
          test "$(git -C product rev-parse HEAD)" = 9857f152539faa30948eb3fd14af3de91991904f
          test "$(cat product/VERSION)" = 1.21.1100
          php -l product/includes/migration/seed-residue-migration.php
          php -l product/includes/system-integration/fault-recovery-product.php
          php -l product/includes/admin-v13/views/system_recovery.php
          php -l product/tests/s01-c02-1211101-seed-scan-truth-contract.php
          php product/tests/s01-c02-1211101-seed-scan-truth-contract.php
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise page golden path and diagnostics in four widths
        working-directory: product
        run: |
          node tests/s01-c02-1211022-recovery-golden-path-browser-proof.js
          node tests/s01-c02-1211024-recovery-diagnostics-browser-proof.js
          node tests/s01-c02-1211100-recovery-dialog-layout-browser-proof.js
          echo S01_C02_1211101_MARKED_CONTENT_SCAN_TRUTH_PASS
