name: P05 Simple Update UX Hotfix Build R4
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-simple-update-ux-build-r4-20260901.yml']
permissions:
  contents: read
jobs:
  build-hotfix-r4:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-simple-update-ux-build-r4-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Checkout runner authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          path: runner
      - name: Checkout exact private P05 hotfix base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: hotfix/p05-simple-update-ux-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p05
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Verify exact unchanged Product base
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '8fd6ea22f237eac891bdd0e336947d587560dc75'
          git ls-remote --exit-code origin refs/heads/main | grep -F '8fd6ea22f237eac891bdd0e336947d587560dc75' >/dev/null
          test "$(cat VERSION)" = '1.2.0'
          echo 'P05_SIMPLE_UPDATE_R4_BASE=PASS'
      - name: Reuse exact R3 four-file Product mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C runner fetch origin refs/heads/tmp/p05-simple-update-ux-build-r3-20260901:refs/remotes/origin/p05-simple-update-r3
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          text=subprocess.check_output([
            'git','-C','runner','show',
            'origin/p05-simple-update-r3:.github/workflows/p05-simple-update-ux-build-r3-20260901.yml'
          ], text=True)
          section=text[text.index('      - name: Reuse exact R2 Product mutation and update stale contract'):]
          section=section[section.index('        run: |\n')+len('        run: |\n'):]
          section=section[:section.index('      - name: Validate Product hotfix R3')]
          lines=[]
          for line in section.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit('UNEXPECTED_R3_RUN_INDENT')
          Path('/tmp/p05-r3-mutation.sh').write_text('\n'.join(lines)+'\n')
          PY
          bash /tmp/p05-r3-mutation.sh
          cd p05
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          echo 'P05_SIMPLE_UPDATE_R4_SCOPE=PASS'
      - name: Complete Product validation with native integration environment
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run lint
          npm run typecheck
          node --import tsx --test tests/unit/product-simple-update-ux-truth.test.ts
          node --import tsx --test tests/contract/backend-online-update-v2.test.ts
          php -l php/src/RuntimeOpsRoutesTrait.php >/dev/null
          npm run test:php-product-parity
          npm test
          npm run build
          echo 'P05_SIMPLE_UPDATE_R4_VALIDATION=PASS'
      - name: Commit and push exact private hotfix
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git commit -m 'fix(P05): simplify owner update experience'
          test "$(git rev-list --count 8fd6ea22f237eac891bdd0e336947d587560dc75..HEAD)" = 1
          git push origin HEAD:refs/heads/hotfix/p05-simple-update-ux-20260901
          echo "P05_SIMPLE_UPDATE_SOURCE=$(git rev-parse HEAD)"
          echo "P05_SIMPLE_UPDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_CORE_UPDATES_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
