name: P01 v517 Owner historical cover native PHP boundary
on:
  push:
    branches: [test/p01-v517-legacy-cover-read-20261119]
permissions:
  contents: read
jobs:
  p01-legacy-cover-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Assert public-safe synthetic-only machine boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-v517-legacy-cover-read-20261119"
          echo "P01_PRIVATE_OWNER_BACKUP_UPLOAD=NONE"
          echo "P01_PRODUCTION_WRITES=NO"
      - name: Transient checkout P01 exact source no persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: c8f37ef860ae0d7ef209b65c1fe9b2db0dfe6fc5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact P01 source and version
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "c8f37ef860ae0d7ef209b65c1fe9b2db0dfe6fc5"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          echo "P01_OWNER_LEGACY_COVER_SOURCE=c8f37ef860ae0d7ef209b65c1fe9b2db0dfe6fc5"
      - name: Native PHP unit positive and negative media contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r 'if(PHP_VERSION_ID<80300||!extension_loaded("fileinfo"))exit(1);'
          php -l candidate/src/app/next/runtime/PrivateMediaRead.php
          php -l candidate/tests/unit/p01_d25_private_media_contract.php
          php candidate/tests/unit/p01_d25_private_media_contract.php | tee /tmp/p01-d25-synthetic-proof.txt
          grep -Eq 'P01_D25_PRIVATE_PREVIEW_SOURCE_NEGATIVES=[0-9]+/[0-9]+ PASS' /tmp/p01-d25-synthetic-proof.txt
          grep -q 'P01_D25_REAL_NGINX_OWNER_HTTP=NOT_PROVEN_BY_UNIT' /tmp/p01-d25-synthetic-proof.txt
          echo "P01_OWNER_LEGACY_COVER_NATIVE_PHP=PASS"
      - name: Clear transient source and proof
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f /tmp/p01-d25-synthetic-proof.txt
          echo "P01_PRIVATE_SOURCE_PERSISTENCE=NONE"
