name: TEMP S01-C02 Ops 1.21.847 Meta Source Trace
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-meta-source-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace meta and repair core
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          echo '=== ensure_candidate_html_meta ==='
          grep -R -n -F -C 20 'ensure_candidate_html_meta' ops/includes | head -300 || true
          echo '=== prepare_html_for_cf ==='
          grep -R -n -F -C 20 'prepare_html_for_cf' ops/includes | head -300 || true
          echo '=== canonical setters ==='
          grep -R -n -E -C 12 'canonical|og:url|mainEntityOfPage|hreflang' ops/includes/cf-static-downloads/repair-parts ops/includes/release/builders | head -800 || true
          echo '=== sitemap helpers/callers ==='
          grep -R -n -F -C 15 'vf_toolsite_cf_release_sitemap_urlset_for_entries' ops/includes | head -350 || true
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_META_SOURCE_TRACE
