name: p01-v24745-candidate-identity-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24745-candidate-identity-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRE_IDENTITY_SHA: 4794dfb7e05a3950dc48afcb38b4506f0fbd8764
      TARGET_SHA: 4257301bc81ae842e6b57f9505b1450aa1908b25
    steps:
      - name: Checkout exact candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$PRE_IDENTITY_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.45"
          test "$(tr -d '\r\n ' < current/src/VERSION.txt)" = "2.47.45"
          grep -F "define('VF_VERSION', '2.47.45');" current/src/app/bootstrap.php >/dev/null
          echo P01_V24745_EXACT_CANDIDATE=PASS

      - name: Verify identity-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$PRE_IDENTITY_SHA"
          git -C current diff --name-only "$PRE_IDENTITY_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          php current/tests/unit/engineering_consistency_r80_contract.php
          echo P01_V24745_IDENTITY_DELTA=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_V24745_CANDIDATE_CANONICAL=PASS
