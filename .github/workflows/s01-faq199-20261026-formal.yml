name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-faq199-formal-20261026]
    paths: ['.github/workflows/s01-faq199-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.199
  TARGET_SHA: 3af1db5b5f5d20fb26f52614b668a31960653b72
  TARGET_TREE: 150bc6f1a924ce0aef671f533e7b9e9537363f8b
  BASE_SHA: 94f6b93eea0759b3ad5cccc06fe68409bdd71e98
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-faq199-20261026/formal-spec.json --input control/.github/workflows/s01-faq199-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3af1db5b5f5d20fb26f52614b668a31960653b72
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40290895857 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40290895857 --jq .head_sha)" = 915633a87b1c43c2e20ea6bddf109546091fb05e
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40290895857 --repo llhzx2018/core-free-runner-public --name s01-home-40290895857 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-faq199-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='92d281bb307e4fe8ccacc590f13277760733d7c1'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('faq-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2
          result=json.loads((r/'faq-after.json').read_text())
          assert result['status']=='PASS' and result['errors']==[] and result['checks']>=44
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['layout']=='SINGLE_RAIL_ZH_EN_1440_1024'
          assert result['cta']=='SECONDARY_TEXT_LINK'
          assert result['hierarchy']=='COMPACT_INTRO_SEARCH_PLAIN_CATEGORIES_NO_REPEAT_BADGES'
          assert result['customAndHeroOff']=='PRESERVED'
          assert result['interaction']=='SEARCH_CLEAR_ESCAPE_KEYBOARD_CATEGORY_SINGLE_MULTIPLE_NOJS_PASS'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'faq-{lang}-{width}.png').stat().st_size>1000
                  assert (r/f'faq-empty-{lang}-{width}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='058a2636b1f454b3c23543fd859722051893bf794db3dd4004c538f7996b257c' and new['bytes']==2003653
          coverage=json.loads(pathlib.Path('control/lanes/s01-faq199-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='92d281bb307e4fe8ccacc590f13277760733d7c1' and coverage['tree']=='150bc6f1a924ce0aef671f533e7b9e9537363f8b'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40290895857'
          coverage['merged_source']='3af1db5b5f5d20fb26f52614b668a31960653b72'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.199 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.199 provider/vf-tools-theme_V1.35.199.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.199' --notes 'FAQ桌面信息层级收敛：参照实际查看的iLoveIMG FAQ，将分类降为文字导航，移除重复分组编号与数量，缩短首屏搜索间距，使用中性分隔与轻量收尾链接。仅Theme呈现CSS调整，不改问答内容、Head、PHP渲染、配置与现有交互；真实WordPress/Chromium中英文1440/1024及44项定向检查、198升级199/回退/重复安装与保护数据通过。476运行文件。Owner上一版视觉裁决未通过，本版仍需手工升级后截图验收；手机及文章内容暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.199 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.199 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.199 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.199.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.199.zip remote/vf-tools-theme_V1.35.199.zip
          echo '058a2636b1f454b3c23543fd859722051893bf794db3dd4004c538f7996b257c  remote/vf-tools-theme_V1.35.199.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.199.zip)" = 2003653
          gh release view v1.35.199 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
