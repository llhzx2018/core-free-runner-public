name: S01 Theme108 candidate-gated exact private formal release
on:
  push:
    branches: [task/s01-theme108-formal-20261011]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_SHA: '465162ddcaf8895df9797195064e4b515fd5b7b7'
      TARGET_TREE: 'ce022f9748d7c530208c5545ea3d2a7a7772a827'
      TARGET_VERSION: '1.35.108'
      SOURCE_VERSION: '1.35.107'
      BASE_SHA: '4b9ed24c31be026db5e28dd806c5c1c96981aced'
      THEME_MAIN_SHA: 'b5e9af880dd0d4c69a976f7b51b629f63143c18f'
      CANDIDATE_RUN: '38112629726'
      CANDIDATE_SHA: '16a63f84d1f0e0ab39b45e0c4bb38ce4924161a6'
      CANDIDATE_ARTIFACT: '11692416208'
      CANDIDATE_DIGEST: 'sha256:2337b1279a8ace2a8973a6dcb1bad2fd5a8a83ece1b2bc0a6264685286ef9d66'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Target-owned one-spec preflight
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-theme108-formal-20261011/spec.json --template runner/lanes/s01-theme108-formal-20261011/formal.template.yml --output /tmp/formal-rendered-108.yml >/dev/null
          cmp /tmp/formal-rendered-108.yml runner/.github/workflows/s01-theme108-formal-20261011.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-theme108-formal-20261011/spec.json --input runner/.github/workflows/s01-theme108-formal-20261011.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-theme108-formal-20261011 lane
          bash -n lane/formal.sh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: task/s01-c01-footer105-20261010
          persist-credentials: false
          path: historic-footer
      - name: Reverse-gate exact Candidate, then formal Theme release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash lane/formal.sh
      - name: Upload public-safe Theme formal receipt
        if: always()
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-theme108-formal-receipt-${{ github.run_id }}
          path: |
            proof/lane-audit.json
            proof/candidate-reverse.json
            proof/identity.json
            proof/theme-FINAL_RELEASE.json
          if-no-files-found: error
          retention-days: 30
      - name: Reverse-read exact public receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/theme108-formal-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/theme108-formal.zip
          python3 - <<'PY'
          import json,os,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path('/tmp/theme108-formal-meta.json').read_text())
          b=pathlib.Path('/tmp/theme108-formal.zip').read_bytes()
          assert m['id']==int(os.environ['ARTIFACT_ID']) and m['workflow_run']['head_sha']==os.environ['GITHUB_SHA']
          assert not m['expired'] and m['size_in_bytes']==len(b) and m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/theme108-formal.zip') as z:
           assert z.testzip() is None
           names={'lane-audit.json','candidate-reverse.json','identity.json','theme-FINAL_RELEASE.json'}
           assert set(z.namelist())==names
           for n in names:assert json.loads(z.read(n))==json.loads((pathlib.Path('proof')/n).read_text())
           assert json.loads(z.read('theme-FINAL_RELEASE.json'))['status']=='PASS'
          print('THEME108_FORMAL_RECEIPT_READBACK',json.dumps({'status':'PASS','id':m['id'],'digest':m['digest'],'bytes':len(b)}))
          PY
      - name: Destroy transient private source and ZIP
        if: always()
        run: rm -rf target historic-footer readback proof/*.zip /tmp/theme108-*.json /tmp/theme108-*.zip /tmp/candidate-*-108.*
