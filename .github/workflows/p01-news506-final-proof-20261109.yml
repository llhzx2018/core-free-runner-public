name: P01 News 506 isolated baseline and exact-release gate
on:
  push:
    branches:
      - task/p01-news506-final-proof-20261109
permissions:
  contents: read
concurrency:
  group: p01-news506-final-proof-20261109
  cancel-in-progress: false
jobs:
  p01-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_SHA: 0a9656184ee550332c9064e9e3f9f03078057adb
      VF_NEWS_R5_SANDBOX: '1'
      VF_NEWS_R5_TARGET_VERSION: '2.47.506'
      VF_NEWS_BROWSER_MODULE: /tmp/p01-news506-playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/p01-news506-browsers
    steps:
      - name: Checkout registered public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare isolated PHP and browser runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip nodejs npm jq >/dev/null
          php -m | grep -Fxi pdo_sqlite
          php -m | grep -Fxi SimpleXML
          echo P01_NEWS_506_HOST_RUNTIME=PASS
      - name: Checkout exact private News candidate, transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0a9656184ee550332c9064e9e3f9f03078057adb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Checkout v505 officially released source as baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.505
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-baseline
          persist-credentials: false
      - name: Verify approved news-first scope without deferred security
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = 2.47.506
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = 2.47.506
          grep -Fx "define('VF_VERSION', '2.47.506');" p01-exact/src/app/bootstrap.php
          for f in src/app/ChannelLibraryPage.php src/app/DisasterRecovery.php; do
            cmp "p01-exact/$f" "p01-baseline/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          b=Path('p01-baseline/src/assets/local-subsite-management.js').read_text()
          t=Path('p01-exact/src/assets/local-subsite-management.js').read_text()
          for a,z in [("  function importCanLeave() {","  async function importPost("),("  importDiscardConfirm?.addEventListener('click',","  importDiscardCancel?.addEventListener('click',")]:
            assert a in b and z in b and a in t and z in t
            assert b[b.index(a):b.index(z,b.index(a))]==t[t.index(a):t.index(z,t.index(a))]
          print('P01_NEWS_506_UNRELEASED_SECURITY_BEHAVIOR_EXCLUDED=PASS')
          PY
          for x in p01-exact/src/app/NewsFeedService.php p01-exact/src/app/NewsFeedPage.php p01-exact/src/app/NewsTopicDigest.php p01-exact/src/app/NewsSourcePreferences.php p01-exact/src/app/bootstrap.php; do
            php -l "$x" >/dev/null
          done
          node --check p01-exact/src/assets/news-feed.js
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          echo P01_NEWS_506_VERSION_AND_SOURCE_SCOPED=PASS
      - name: Canonical PHP units against official released baseline
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          bash p01-exact/tests/canonical_release_regression.sh p01-exact p01-baseline --require-zero-debt | tee /tmp/p01-news506-canonical.log
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-news506-canonical.log
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-news506-canonical.log
          echo P01_NEWS_506_CANONICAL_RELEASE=PASS
      - name: News eight-source security and provider-rights negative controls
        shell: bash
        run: |
          set -Eeuo pipefail
          php p01-exact/tests/unit/p01_news_release_surface_contract.php | tee /tmp/news506-rights.log
          grep -F 'P01_NEWS_R9_PUBLIC_SECURITY_API_SEO=PASS checks=114' /tmp/news506-rights.log
          php p01-exact/tests/unit/p01_news_feed_service_contract.php
          php p01-exact/tests/unit/p01_news_source_preferences_contract.php
          php p01-exact/tests/unit/p01_news_topic_digest_contract.php
          node p01-exact/tests/browser/p01_news_r5_navigation_contract.cjs
          echo P01_NEWS_506_OWNER_ONLY_GUEST_RIGHTS=PASS
      - name: Installed Chromium Owner and Guest security with three breakpoints
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          mkdir -p "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          npm install --no-audit --no-fund --silent --prefix "$VF_NEWS_BROWSER_MODULE" playwright@1.56.1
          "$VF_NEWS_BROWSER_MODULE/node_modules/.bin/playwright" install chromium-headless-shell >/dev/null
          node p01-exact/tests/browser/p01_news_r4_chromium.cjs | tee /tmp/p01-news506-chromium.log
          grep -F 'P01_NEWS_R4_CHROMIUM=PASS checks=89' /tmp/p01-news506-chromium.log
          echo P01_NEWS_506_EXACT_BROWSER=PASS
      - name: Real v505-to-v506 FULL Atomic backup restore and rollback, News-only
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh | tee /tmp/p01-news506-atomic.log
          grep -Fx 'P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-news506-atomic.log
          echo P01_NEWS_506_EXACT_UPGRADE_AND_RESTORE=PASS
          echo P01_NEWS_506_REJECTED_SECURITY_SPECIAL_TESTS=NOT_RUN
          echo P01_NEWS_506_PRODUCTION_WRITES=NONE
      - name: Clean private source and isolated browser workspaces
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact p01-baseline "$VF_NEWS_BROWSER_MODULE" "$PLAYWRIGHT_BROWSERS_PATH"
          echo P01_NEWS_506_PRIVATE_CHECKOUT_CLEANED=YES
