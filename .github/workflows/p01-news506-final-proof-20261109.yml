name: P01 News 506 exact Atomic clean-checkout retest only
on:
  push:
    branches:
      - task/p01-news506-final-proof-20261109
permissions:
  contents: read
concurrency:
  group: p01-news506-final-proof-20261109
  cancel-in-progress: false
jobs:
  p01-news-exact-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: 0a9656184ee550332c9064e9e3f9f03078057adb
      VF_NEWS_R5_SANDBOX: '1'
      VF_NEWS_R5_TARGET_VERSION: '2.47.506'
    steps:
      - name: Checkout approved registered public builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Minimal PHP isolated install prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-curl php-xml php-mbstring php-sqlite3 php-zip php-gd unzip >/dev/null
          php -m | grep -Fxi pdo_sqlite
      - name: Fresh checkout exact private source; no previous browser fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0a9656184ee550332c9064e9e3f9f03078057adb
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Real exact v505 to v506 fresh FULL, Atomic, private restore, rollback
        shell: bash
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git -C p01-exact status --porcelain)"
          test ! -e p01-exact/src/app/.runtime.php
          test ! -d p01-exact/src/private
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh | tee /tmp/p01-news506-scoped-atomic.log
          grep -Fx 'P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-news506-scoped-atomic.log
          test -z "$(git -C p01-exact status --porcelain)"
          echo P01_NEWS506_SCOPED_EXACT_ATOMIC_RESTORE_ROLLBACK=PASS
          echo P01_REJECTED_IMPORT_DISASTER_SECURITY_OPERATION=NOT_RUN
          echo P01_PRODUCTION_WRITES=NONE
      - name: Remove private transient checkout
        if: always()
        run: |
          rm -rf p01-exact
          echo P01_PUBLIC_RUNNER_PRIVATE_SOURCE_CLEANED=YES
