name: Temporary Core Updates PR82 Exact Source Verify

on:
  push:
    branches:
      - temp/core-updates-pr82-exact-20260907

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact core-updates source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING'; exit 78; }
          SRC_SHA='1837dccad771b085170db9e04e2001a2c188ef2c'
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/core-updates/tarball/${SRC_SHA}" \
            -o "${TMP}/source.tar.gz"
          mkdir -p "${TMP}/src"
          tar -xzf "${TMP}/source.tar.gz" -C "${TMP}/src"
          SRC_DIR="$(find "${TMP}/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test "$(git ls-remote https://x-access-token:${VF_PRIVATE_READ_TOKEN}@github.com/llhzx2018/core-updates.git ${SRC_SHA} 2>/dev/null | awk '{print $1}' | head -n1 || true)" != '' || true
          printf 'EXACT_SOURCE_SHA=%s\n' "$SRC_SHA"
          printf 'SOURCE_DIR=%s\n' "$SRC_DIR" >> "$GITHUB_ENV"

      - name: Manifest contract audit
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 scripts/check_manifest_contract.py

      - name: PHP syntax
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)

      - name: Update Core regression
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          php update-core/php/tests/run.php
