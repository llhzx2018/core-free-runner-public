name: P01 V2.21.22 Publish Exact

on:
  pull_request:
    paths:
      - 'requests/p01-v22122-publish-exact-*.txt'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: startsWith(github.head_ref, 'agent/p01-v22122-publish-exact-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      UPDATES_REPO: llhzx2018/core-updates
      CANDIDATE_BRANCH: maintenance/admin-consolidation-2.21.22-20260820
      CANDIDATE: 84ed48f5208f23e63e4e92c98695d53af6f278a7
      CANDIDATE_TREE: 49bc9b9d040f17fdbb370a9167e3e75cf38b8b4f
      SOURCE_TAG: v2.21.21
      SOURCE_COMMIT: 0b62c96b787e03b0dda6ef8493d29755b6baf83e
      SOURCE_TREE: 02b6199ab82f2fb03dd9d8048288421037869e4e
      VERSION: 2.21.22
      SOURCE_VERSION: 2.21.21
      SCHEMA: '2026080902'
      TAG: v2.21.22
      GATE_RUN_ID: '32283009420'
      GATE_ARTIFACT_ID: '9376555408'
      UPDATE_SHA: 53f59b70d3475c27c7134016fccd83741c043be9b15e9d269d49e35cae488610
      FULL_SHA: 541fc0bc262215b2c9f32f41deedebc8601c0bfcd3d042a45a43503265ebca8e
      REPAIR_SHA: ffb4ce348cba642a213b5d4622322d3bececc3d278594b2cb84bd80ce375acd1
      UPDATE_BYTES: '1080666'
      FULL_BYTES: '493717'
      REPAIR_BYTES: '3118915'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Exact source readback before publish
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --depth 1 --branch "$CANDIDATE_BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git clone -q --depth 1 --branch "$SOURCE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" prior
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C prior rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C prior rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < prior/VERSION)" = "$SOURCE_VERSION"
          echo 'EXACT_SOURCE_READBACK=PASS'
      - name: Fetch exact PASS artifacts
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          rm -rf /tmp/p01-v22122-release /tmp/p01-v22122-gate.zip
          mkdir -p /tmp/p01-v22122-release
          gh api --method GET "repos/llhzx2018/core-free-runner-public/actions/artifacts/${GATE_ARTIFACT_ID}/zip" > /tmp/p01-v22122-gate.zip
          unzip -q /tmp/p01-v22122-gate.zip -d /tmp/p01-v22122-release
          ROOT=/tmp/p01-v22122-release/p01-v22122-artifact-gate
          test -f "$ROOT/VF_Start_V2.21.22_UPDATE.zip"
          test -f "$ROOT/VF_Start_V2.21.22_FULL.zip"
          test -f "$ROOT/repair-v2.21.22.php"
          test "$(sha256sum "$ROOT/VF_Start_V2.21.22_UPDATE.zip"|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ROOT/VF_Start_V2.21.22_FULL.zip"|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$ROOT/repair-v2.21.22.php"|awk '{print $1}')" = "$REPAIR_SHA"
          test "$(stat -c %s "$ROOT/VF_Start_V2.21.22_UPDATE.zip")" = "$UPDATE_BYTES"
          test "$(stat -c %s "$ROOT/VF_Start_V2.21.22_FULL.zip")" = "$FULL_BYTES"
          test "$(stat -c %s "$ROOT/repair-v2.21.22.php")" = "$REPAIR_BYTES"
          jq -e --arg c "$CANDIDATE" --arg t "$CANDIDATE_TREE" --arg s "$SOURCE_COMMIT" '.pass==true and .candidate==$c and .candidate_tree==$t and .source==$s and .version=="2.21.22" and .production_changed==false' /tmp/p01-v22122-release/p01-v22122-gate-result.json >/dev/null
          echo 'EXACT_PASS_ARTIFACTS=PASS'
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v22122-release/p01-v22122-artifact-gate
          remote_tag="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -z "$remote_tag" ]; then
            git -C candidate config user.name VictorForge
            git -C candidate config user.email llhzx2018@gmail.com
            git -C candidate tag "$TAG" "$CANDIDATE"
            git -C candidate push "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" "refs/tags/${TAG}"
          else
            test "$remote_tag" = "$CANDIDATE"
          fi
          cat > /tmp/p01-v22122-notes.md <<'EOF'
          V2.21.22 是 VF Start 的个人使用体验精修版本。

          - 收藏改为网址旁常驻 ☆ / ★，点击即可收藏或取消。
          - “我的收藏”、菜单、编辑弹窗与首页常用入口统一使用“收藏”语义。
          - 网址后台“选择本页”移入表格选择列头，修复工具栏错位。
          - “备份与恢复”与“设置”减少伪二级菜单，备份列表支持分页。
          - 真实 Chrome 已验证收藏、后台操作与响应式。
          - Schema 2026080902 不变；Browser Helper 1.6.4 不变。
          EOF
          if gh release view "$TAG" --repo "$PRODUCT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ROOT/VF_Start_V2.21.22_UPDATE.zip" "$ROOT/VF_Start_V2.21.22_FULL.zip" "$ROOT/repair-v2.21.22.php" --repo "$PRODUCT_REPO" --clobber
          else
            gh release create "$TAG" "$ROOT/VF_Start_V2.21.22_UPDATE.zip" "$ROOT/VF_Start_V2.21.22_FULL.zip" "$ROOT/repair-v2.21.22.php" --repo "$PRODUCT_REPO" --title 'VF Start V2.21.22' --notes-file /tmp/p01-v22122-notes.md --verify-tag
          fi
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v22122-release.json
          RELEASE_ID="$(jq -r '.id' /tmp/p01-v22122-release.json)"
          RELEASED_AT="$(jq -r '.published_at' /tmp/p01-v22122-release.json)"
          UPDATE_ASSET_ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.21.22_UPDATE.zip")|.id' /tmp/p01-v22122-release.json)"
          test -n "$RELEASE_ID" && test "$RELEASE_ID" != null
          test -n "$UPDATE_ASSET_ID" && test "$UPDATE_ASSET_ID" != null
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.21.22_UPDATE.zip")|.size' /tmp/p01-v22122-release.json)" = "$UPDATE_BYTES"
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.21.22_FULL.zip")|.size' /tmp/p01-v22122-release.json)" = "$FULL_BYTES"
          test "$(jq -r '.assets[]|select(.name=="repair-v2.21.22.php")|.size' /tmp/p01-v22122-release.json)" = "$REPAIR_BYTES"
          printf 'RELEASE_ID=%s\nRELEASED_AT=%s\nUPDATE_ASSET_ID=%s\n' "$RELEASE_ID" "$RELEASED_AT" "$UPDATE_ASSET_ID" >> "$GITHUB_ENV"
          echo 'GITHUB_RELEASE_CREATED=PASS'
      - name: Remote asset byte readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v22122-remote && mkdir -p /tmp/p01-v22122-remote
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v22122-remote --pattern 'VF_Start_V2.21.22_UPDATE.zip' --pattern 'VF_Start_V2.21.22_FULL.zip' --pattern 'repair-v2.21.22.php'
          test "$(sha256sum /tmp/p01-v22122-remote/VF_Start_V2.21.22_UPDATE.zip|awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v22122-remote/VF_Start_V2.21.22_FULL.zip|awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum /tmp/p01-v22122-remote/repair-v2.21.22.php|awk '{print $1}')" = "$REPAIR_SHA"
          echo 'REMOTE_ASSET_SHA_READBACK=PASS'
      - name: Publish core-updates P01
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('updates/projects/P01.json');d=json.loads(p.read_text(encoding='utf-8'))
          if str(d.get('target_version','')) not in {'2.21.21','2.21.22'}:
              raise SystemExit('unexpected current update target')
          d.update({
            'target_version':'2.21.22','update_type':'ATOMIC','from_versions':['2.21.21'],
            'schema_from':'2026080902','schema_to':'2026080902','repository':'llhzx2018/vf-start',
            'release_tag':'v2.21.22','asset_name':'VF_Start_V2.21.22_UPDATE.zip',
            'asset_bytes':1080666,'asset_sha256':os.environ['UPDATE_SHA'],
            'release_id':int(os.environ['RELEASE_ID']),
            'release_identity':'v2.21.22@84ed48f5208f23e63e4e92c98695d53af6f278a7',
            'backup_required':True,'rollback_supported':True,'released_at':os.environ['RELEASED_AT'],'minimum_php':'8.0.0'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then git -C updates commit -m 'release(P01): publish VF Start V2.21.22 update channel'; fi
          for i in 1 2 3; do
            if git -C updates push origin main; then break; fi
            git -C updates pull --rebase origin main
            test "$i" -lt 3
          done
          git -C updates pull --ff-only origin main
          jq -e --arg sha "$UPDATE_SHA" --argjson rid "$RELEASE_ID" '.target_version=="2.21.22" and .from_versions==["2.21.21"] and .schema_from=="2026080902" and .schema_to=="2026080902" and .release_tag=="v2.21.22" and .asset_name=="VF_Start_V2.21.22_UPDATE.zip" and .asset_bytes==1080666 and .asset_sha256==$sha and .release_id==$rid' updates/projects/P01.json >/dev/null
          echo 'CORE_UPDATES_REMOTE_READBACK=PASS'
      - name: Persist release evidence
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -n --argjson release_id "$RELEASE_ID" --argjson asset_id "$UPDATE_ASSET_ID" --arg released_at "$RELEASED_AT" \
            '{schema:"vf-public-runner-result/v1",project_id:"P01",gate:"V2.21.22_FORMAL_RELEASE",status:"SUCCESS",pass:true,version:"2.21.22",source_version:"2.21.21",candidate_source_sha:"84ed48f5208f23e63e4e92c98695d53af6f278a7",candidate_source_tree:"49bc9b9d040f17fdbb370a9167e3e75cf38b8b4f",prior_formal_source_sha:"0b62c96b787e03b0dda6ef8493d29755b6baf83e",prior_formal_source_tree:"02b6199ab82f2fb03dd9d8048288421037869e4e",schema_version:"2026080902",schema_changed:false,browser_helper:"1.6.4",release_authorized:true,formal_artifact_gate:true,formal_artifact_gate_run_id:32283009420,tag:"v2.21.22",release_id:$release_id,released_at:$released_at,assets:{update:{name:"VF_Start_V2.21.22_UPDATE.zip",bytes:1080666,sha256:"53f59b70d3475c27c7134016fccd83741c043be9b15e9d269d49e35cae488610",asset_id:$asset_id},full:{name:"VF_Start_V2.21.22_FULL.zip",bytes:493717,sha256:"541fc0bc262215b2c9f32f41deedebc8601c0bfcd3d042a45a43503265ebca8e"},repair:{name:"repair-v2.21.22.php",bytes:3118915,sha256:"ffb4ce348cba642a213b5d4622322d3bececc3d278594b2cb84bd80ce375acd1"}},core_updates:true,production_changed:false,private_data_used:false,private_source_persisted_publicly:false,workflow_run_id:env.GITHUB_RUN_ID}' > /tmp/P01-V2.21.22-FORMAL-RELEASE.json
          git clone -q --depth 1 --branch vf-agent-operations-v1 "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-free-runner-public.git" evidence
          mkdir -p evidence/vf-agent/results
          cp /tmp/P01-V2.21.22-FORMAL-RELEASE.json evidence/vf-agent/results/P01-V2.21.22-FORMAL-RELEASE.json
          git -C evidence config user.name VictorForge
          git -C evidence config user.email llhzx2018@gmail.com
          git -C evidence add vf-agent/results/P01-V2.21.22-FORMAL-RELEASE.json
          if ! git -C evidence diff --cached --quiet; then git -C evidence commit -m 'evidence(P01): V2.21.22 formal release PASS'; fi
          for i in 1 2 3; do
            if git -C evidence push origin vf-agent-operations-v1; then break; fi
            git -C evidence pull --rebase origin vf-agent-operations-v1
            test "$i" -lt 3
          done
          echo 'FORMAL_RELEASE_EVIDENCE=PASS'
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v22122-publish-exact-${{ github.run_id }}
          path: |
            /tmp/p01-v22122-release.json
            /tmp/P01-V2.21.22-FORMAL-RELEASE.json
          if-no-files-found: warn
