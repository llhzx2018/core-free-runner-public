name: TEMP S01-C02 1.21.929 Distribution Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 115c6bdedd4fbe34eec148eaeee4c368a64af391
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      TAG: v1.21.929
      ASSET: vf-tools-ops_V1.21.929.zip

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 115c6bdedd4fbe34eec148eaeee4c368a64af391
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.929"
          assert m["release_tag"]=="v1.21.929"
          assert m["asset_name"]=="vf-tools-ops_V1.21.929.zip"
          assert m["asset_bytes"]==3477184
          assert m["asset_sha256"]=="b56d4acb734c745e4614392c347ff16e00e19d6d4566d2f9ce15e8db08d9e130"
          assert m["runtime_files"]==975
          assert m["runtime_fingerprint"]=="8f0c86e183a33f010005031a098c8af25e3a2420ed08842fa34ec81559fa6cdd"
          assert "1.21.928" in m["from_versions"]
          assert m["schema_from"]=="6.0.0"
          assert m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True
          assert m["rollback_supported"] is True
          print("S01-C02 1.21.929 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "c4e1f8eb22e08708562bb6b3be6c13d90f5b9bb7"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "3477184"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:b56d4acb734c745e4614392c347ff16e00e19d6d4566d2f9ce15e8db08d9e130"
          echo "S01-C02 1.21.929 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
