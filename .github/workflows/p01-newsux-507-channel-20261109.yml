name: P01 UI 507 exact core-updates manifest and native PHP fallback
on:
  push:
    branches:
      - task/p01-newsux-507-channel-evidence-20261109
permissions:
  contents: read
jobs:
  verified-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout registered public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact distribution candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: abaea08f7d655337e5e6869ccce05a6d53365840
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: channel
          persist-credentials: false
      - name: Verify native PHP update core and official exact asset SHA
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip jq >/dev/null
          test "$(git -C channel rev-parse HEAD)" = "abaea08f7d655337e5e6869ccce05a6d53365840"
          (cd channel && python3 scripts/check_manifest_contract.py)
          (cd channel && find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null)
          (cd channel && php update-core/php/tests/run.php)
          jq -e '.project_id=="P01" and .current_version=="2.47.506" and .target_version=="2.47.507" and .release_tag=="v2.47.507" and .product_identity=="c33d03af2f1bd1bed60ba6e250e597011d2aabbb" and .from_versions==["2.47.506"] and .asset_name=="VF_Start_V2.47.507_UPDATE.zip" and .backup_required==true and .rollback_supported==true' channel/projects/P01.json
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.507 --jq '.id')" = 438845498
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.507 --jq '.object.sha')" = c33d03af2f1bd1bed60ba6e250e597011d2aabbb
          gh api repos/llhzx2018/vf-start/releases/tags/v2.47.507 | jq -e --slurpfile manifest channel/projects/P01.json '.assets|map(select(.name==$manifest[0].asset_name and .size==$manifest[0].asset_bytes and .digest==("sha256:"+$manifest[0].asset_sha256)))|length==1'
          echo P01_UI507_CHANNEL_NATIVE_PHP_MANIFEST_ASSET_SHA=PASS
          echo P01_PRODUCTION_WRITES=NONE
      - name: Delete private transient channel checkout
        if: always()
        shell: bash
        run: |
          rm -rf channel
          echo P01_UI507_CHANNEL_TEMP_CLEANUP=PASS
