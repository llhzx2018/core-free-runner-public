name: TEMP P07 M03 RC4 exact terminal candidate DEV proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-terminal-final-candidate-proof-20261125.yml
permissions:
  contents: read
jobs:
  p07-m03-recovery:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-terminal-final-candidate-proof-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
      PRODUCT_BASE: '3f1ceeeaada504d4aea6adbc587a5176c015c5e8'
      GOV_SHA: 'bc3d253fd146a1c9461e606de39f0c4ba7cc74c7'
      RC3_SHA: '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d'
    steps:
      - name: Python 3.13 exact cache environment
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Checkout exact private M03 source only transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 54c46dfa862a5c4a39020c1bd80a129bd992077b
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact GOV architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: bc3d253fd146a1c9461e606de39f0c4ba7cc74c7
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Source identity, architecture naming, and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C transient-p07 merge-base "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$PRODUCT_BASE"
          cd transient-p07
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../transient-gov --git-root . \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import ast,pathlib
          for rel in ("scripts/p07_m03_rc3_recovery_bundle.py",
                      "lib/m03_trial_retirement.py",
                      "tests/test_p07_m03_rc3_recovery.py",
                      "tests/test_p07_m03_rc3_retirement_safety.py",
                      "scripts/p07_m03_rc3_upgrade_compat.py",
                      "tests/test_p07_m03_rc3_upgrade_compat.py",
                      "tests/test_p07_m03_rc3_real_installer.py"):
              ast.parse(pathlib.Path(rel).read_text(encoding="utf-8"),filename=rel)
          print("P07_M03_RC3_RECOVERY_SYNTAX=PASS")
          PY
          echo P07_M03_RC3_RECOVERY_EXACT_SOURCE_ARCH_AND_SYNTAX=PASS
      - name: Checkout public distribution exact current state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7789eaf083bad6e3d0fce19982f930f30794e3e3
          path: transient-public
          persist-credentials: false
      - name: Verify stable sole-public-command baseline and old release safety
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-public rev-parse HEAD)" = 7789eaf083bad6e3d0fce19982f930f30794e3e3
          cd transient-public
          bash -n installers/p07-toolbox.sh
          python3 -B scripts/check_p07_public_install_contract.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_install_contract.py' -q
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc3"' installers/p07-toolbox.sh
          ! grep -q 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc4"' installers/p07-toolbox.sh
          echo P07_M03_PUBLIC_BASELINE_RC3_AND_UNIQUE_ENTRY=PASS
      - name: Download original official public M03 RC3 no private login
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 100 \
            "$url" -o "$RUNNER_TEMP/original-rc3.zip"
          printf '%s  %s\n' "$RC3_SHA" "$RUNNER_TEMP/original-rc3.zip" | sha256sum -c - >/dev/null
          echo P07_M03_GENUINE_ISSUED_RC3_ARCHIVE_SHA=PASS
      - name: Affected real recovery upgrade and terminal proof
        shell: bash
        env:
          P07_M03_OFFICIAL_RC3: ${{ runner.temp }}/original-rc3.zip
          P07_M03_CANDIDATE_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          for suite in test_p07_m03_rc3_recovery.py test_p07_m03_rc3_retirement_safety.py test_p07_m03_rc3_upgrade_compat.py test_p07_m03_rc3_real_installer.py; do
            log="$RUNNER_TEMP/$suite.rc4.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -v >"$log" 2>&1; then
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+|^Ran [0-9]+ tests|^FAILED' "$log" | cut -c1-200 | tail -25 || true
              echo "P07_RC4_AFFECTED_SUITE=FAIL:$suite"
              exit 23
            fi
            grep -Fxq OK "$log"
            grep -E '^Ran [1-9][0-9]* tests?' "$log" | tail -1
            if [[ "$suite" == test_p07_m03_rc3_recovery.py ]]; then
              grep -Eq '^test_signed_candidate_terminal_compat_real_pty \(.*\) \.\.\. ok$' "$log"
            fi
            if [[ "$suite" == test_p07_m03_rc3_real_installer.py ]]; then
              grep -Eq '^test_official_rc3_with_exact_extra_sources_and_66_real_caches \(.*\) \.\.\. ok$' "$log"
              grep -Eq '^test_failure_after_old_move_restores_original \(.*\) \.\.\. ok$' "$log"
            fi
            echo "P07_RC4_AFFECTED_SUITE=PASS:$suite"
          done
          echo P07_RC4_TERMINAL_PACKAGE_AFFECTED_PROOF=PASS
      - name: Deterministic new archive and precise old-new byte delta
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          old=0d414b3c198bdab1e0d600d560f77ee7d9775a60
          git -C transient-p07 worktree add --detach "$GITHUB_WORKSPACE/transient-p07-original" "$old" >/dev/null 2>&1
          (
            cd transient-p07-original
            python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/original-rc3.zip" --source . --source-sha "$old" --output "$RUNNER_TEMP/rc4-old-candidate.zip" >"$RUNNER_TEMP/rc4-old-candidate.json"
          )
          printf '%s  %s\n' 'ef6e8731c4b0a7501d2fe55f18f86a74f374d03ad0e7030709b3120a7b13f1e7' "$RUNNER_TEMP/rc4-old-candidate.zip" | sha256sum -c - >/dev/null
          (
            cd transient-p07
            for n in a b; do
              python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/original-rc3.zip" --source . --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-new-$n.zip" >"$RUNNER_TEMP/rc4-new-$n.json"
            done
          )
          cmp -s "$RUNNER_TEMP/rc4-new-a.zip" "$RUNNER_TEMP/rc4-new-b.zip"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,re,stat,zipfile
          r=pathlib.Path(os.environ["RUNNER_TEMP"])
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          a=json.loads((r/"rc4-new-a.json").read_text())
          assert a==json.loads((r/"rc4-new-b.json").read_text())
          assert a["source_sha"]==os.environ["PRODUCT_SHA"]
          assert not a["formal_release"] and not a["public_distribution"] and not a["production_applied"] and not a["migration_tasks_mutated"]
          pre="dist/p07/0.1.0/overlay/"
          with zipfile.ZipFile(r/"rc4-old-candidate.zip") as old, zipfile.ZipFile(r/"rc4-new-a.zip") as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              assert set(z.namelist())==set(old.namelist())
              delta={n for n in z.namelist() if z.read(n)!=old.read(n)}
              assert delta=={pre+"lib/terminal_ui.sh",pre+"RUNTIME.gitblob","installers/p07-final.sh"}
              manifest=z.read(pre+"RUNTIME.gitblob")
              seen=set()
              for line in manifest.decode().splitlines():
                  m=re.fullmatch(r"([0-9a-f]{40})  ((?:bin|lib|components)/[A-Za-z0-9_./-]+|BUILD_ID)",line)
                  assert m
                  digest,rel=m.groups()
                  assert rel not in seen and blob(z.read(pre+rel))==digest
                  seen.add(rel)
              assert set(z.namelist())=={pre+n for n in seen}|{pre+"RUNTIME.gitblob","installers/p07-final.sh","dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"}
              for item in z.infolist():
                  p=pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and ".." not in p.parts and not item.is_dir() and stat.S_IFMT(item.external_attr>>16)==stat.S_IFREG
              assert z.read(pre+"BUILD_ID")==b"0.1.0-release147-rc4\n"
              assert blob(manifest)==a["runtime_manifest_gitblob"]
              assert blob(z.read(pre+"lib/terminal_ui.sh"))==a["terminal_compat_candidate"]
              print("P07_RC4_TERMINAL_ARCHIVE_DELTA=PASS")
              print("P07_RC4_NEW_MANIFEST_BLOB="+blob(manifest))
              print("P07_RC4_NEW_INNER_INSTALLER_BLOB="+blob(z.read("installers/p07-final.sh")))
              print("P07_RC4_NEW_UI_BLOB="+a["terminal_compat_candidate"])
          digest=hashlib.sha256((r/"rc4-new-a.zip").read_bytes()).hexdigest()
          assert digest==a["candidate_sha256"]
          print("P07_RC4_NEW_CANDIDATE_SHA256="+digest)
          print("P07_RC4_NEW_CANDIDATE_BYTES="+str((r/"rc4-new-a.zip").stat().st_size))
          print("P07_RC4_REAL_ARCHIVE_REPRODUCIBILITY=PASS")
          PY
      - name: Always erase transient private checkouts and package bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07-original" "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov" "$GITHUB_WORKSPACE/transient-public"
          rm -f -- "$RUNNER_TEMP"/original-rc3.zip "$RUNNER_TEMP"/rc4-old-candidate.zip "$RUNNER_TEMP"/rc4-old-candidate.json "$RUNNER_TEMP"/rc4-new-a.zip "$RUNNER_TEMP"/rc4-new-b.zip "$RUNNER_TEMP"/rc4-new-a.json "$RUNNER_TEMP"/rc4-new-b.json "$RUNNER_TEMP"/test_p07_m03_rc3_*.py.rc4.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-p07-original"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_RC4_TRANSIENT_BYTES_REMOVED=PASS
