name: P02 V2.5.28 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-candidate.yml'
      - 'scripts/p02-v2528-candidate.sh'
      - 'scripts/p02-v2528-correct-scratch.py'
      - 'scripts/p02-v2528-correct-save-barrier.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: fb7bc3a9fc35a88f5cbf49c3e4e9c1609630e2af
      EXPECTED_PRODUCT_HEAD: fb7bc3a9fc35a88f5cbf49c3e4e9c1609630e2af
    steps:
      - name: Require registered product-write capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Install strict scratch save barrier on exact develop head
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          python3 ../scripts/p02-v2528-correct-save-barrier.py
          node --check public/assets/scratch-tabs.js
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          git diff --check
          CHANGED="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$CHANGED" = 'SOURCE_MANIFEST.json SOURCE_MANIFEST.txt public/assets/scratch-tabs.js '
          grep -Fq 'let savePromise=null;' public/assets/scratch-tabs.js
          grep -Fq 'return dirty?flushSave(quiet):true;' public/assets/scratch-tabs.js
          echo SCRATCH_SAVE_BARRIER_SOURCE=PASS
          git config user.name 'VF Release Runner'
          git config user.email 'vf-release-runner@users.noreply.github.com'
          git add public/assets/scratch-tabs.js SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'fix(P02): wait for scratch saves before navigation'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:develop
          echo "PRODUCT_REF=$NEW_SHA" >> "$GITHUB_ENV"
          echo "PRODUCT_DEVELOP_SHA=$NEW_SHA"
          echo PRODUCT_DEVELOP_SAVE_BARRIER_WRITE=PASS

      - name: Install runtime and browser dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl jq unzip
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Align candidate assertions with visible product behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2528-candidate.sh')
          s=p.read_text(encoding='utf-8')
          old="""  await page.waitForFunction(label=>{\n    const s=globalThis.state||{};\n    if(label==='all')return s.mode==='all'&&s.status==='active';\n    if(label==='favorite')return s.mode==='favorite'&&s.status==='active';\n    if(label==='recent')return s.mode==='recent'&&s.status==='active';\n    if(label==='draft')return s.status==='draft';\n    if(label==='trash')return s.status==='trash';\n    if(label==='settings')return s.mode==='settings';\n    return false;\n  },label,{timeout:10000});"""
          new="""  const activeSelector={all:'[data-mode=\"all\"]',favorite:'[data-mode=\"favorite\"]',recent:'[data-mode=\"recent\"]',trash:'#trashBtn',settings:'#settingsBtn'}[label];\n  await page.waitForFunction(sel=>document.querySelector(sel)?.classList.contains('active'),activeSelector,{timeout:10000});"""
          if old not in s: raise SystemExit('expected lexical-state assertion block not found')
          s=s.replace(old,new,1)
          old2="""  await page.locator('#addContentBtn').click();\n  await page.locator('#scratchWorkspaceV259').waitFor({state:'visible'});\n  const persisted=await page.locator('[data-scratch-editor]').inputValue();"""
          new2="""  await page.evaluate(()=>window.VfLibraryScratch.open());\n  await page.locator('#scratchWorkspaceV259').waitFor({state:'visible'});\n  const workspaceCount=await page.locator('#scratchWorkspaceV259').count();\n  if(workspaceCount!==1)throw new Error(`scratch workspace duplicate after ${label}: ${workspaceCount}`);\n  const persisted=await page.locator('[data-scratch-editor]').inputValue();"""
          if old2 not in s: raise SystemExit('expected scratch persistence reopen block not found')
          s=s.replace(old2,new2,1)
          draft="  ['#draftBtn',s=>s.status==='draft','draft'],\n"
          if draft in s: s=s.replace(draft,'',1)
          p.write_text(s,encoding='utf-8')
          print('VISIBLE_BEHAVIOR_ASSERTION_PATCH=PASS')
          PY

      - name: Verify exact V2.5.28 candidate
        env:
          TEST_PASSWORD: P02-V2528-${{ github.run_id }}!
        run: bash scripts/p02-v2528-candidate.sh

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo CANDIDATE_BYTES_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo MAIN_WRITE=NO
          echo FORMAL_RELEASE=NO
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
