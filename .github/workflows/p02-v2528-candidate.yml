name: P02 V2.5.28 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-candidate.yml'
      - 'scripts/p02-v2528-candidate.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 54a5faf5c8d96e263e13f9f50502a2270f270863
    steps:
      - name: Require registered product-read capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_READ_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Install runtime and browser dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl jq unzip
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Correct candidate browser assertion to public DOM contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2528-candidate.sh')
          s=p.read_text(encoding='utf-8')
          old="""  await page.waitForFunction(label=>{\n    const s=globalThis.state||{};\n    if(label==='all')return s.mode==='all'&&s.status==='active';\n    if(label==='favorite')return s.mode==='favorite'&&s.status==='active';\n    if(label==='recent')return s.mode==='recent'&&s.status==='active';\n    if(label==='draft')return s.status==='draft';\n    if(label==='trash')return s.status==='trash';\n    if(label==='settings')return s.mode==='settings';\n    return false;\n  },label,{timeout:10000});"""
          new="""  const activeSelector={all:'[data-mode=\"all\"]',favorite:'[data-mode=\"favorite\"]',recent:'[data-mode=\"recent\"]',draft:'#draftBtn',trash:'#trashBtn',settings:'#settingsBtn'}[label];\n  await page.waitForFunction(sel=>document.querySelector(sel)?.classList.contains('active'),activeSelector,{timeout:10000});"""
          if old not in s:
              raise SystemExit('expected lexical-state assertion block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('PUBLIC_DOM_ASSERTION_PATCH=PASS')
          PY

      - name: Verify exact V2.5.28 candidate
        env:
          TEST_PASSWORD: P02-V2528-${{ github.run_id }}!
        run: bash scripts/p02-v2528-candidate.sh

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo CANDIDATE_BYTES_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo DEVELOP_MERGE=NO
          echo MAIN_WRITE=NO
          echo FORMAL_RELEASE=NO
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
