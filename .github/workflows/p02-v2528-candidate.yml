name: P02 V2.5.28 Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2528-candidate.yml'
      - 'scripts/p02-v2528-candidate.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 54a5faf5c8d96e263e13f9f50502a2270f270863
      EXPECTED_PRODUCT_HEAD: 54a5faf5c8d96e263e13f9f50502a2270f270863
    steps:
      - name: Require registered product-write capability
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo PRODUCT_WRITE_CAPABILITY=PASS

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: develop
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: product

      - name: Correct scratch single-open race on exact develop head
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.5.28'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/assets/scratch-tabs.js')
          s=p.read_text(encoding='utf-8')
          anchor="  let autoOpened=false;\n  let noticeTimer=null;"
          replacement="  let autoOpened=false;\n  let openingPromise=null;\n  let noticeTimer=null;"
          if anchor not in s: raise SystemExit('openingPromise anchor missing')
          s=s.replace(anchor,replacement,1)
          stale="autoOpened=true;setTimeout(()=>openWorkspace(true).catch(()=>{}),180);"
          guarded="autoOpened=true;setTimeout(()=>{if(storage.get(LAST_OPEN_KEY)==='1'&&!workspace)openWorkspace(true).catch(()=>{});},180);"
          if stale not in s: raise SystemExit('stale auto-open timer anchor missing')
          s=s.replace(stale,guarded,1)
          pattern=r"  async function openWorkspace\(auto,createNew\)\{.*?\n  \}\n\n  function rememberCursor"
          match=re.search(pattern,s,flags=re.S)
          if not match: raise SystemExit('openWorkspace function block missing')
          new_block=r'''  async function openWorkspace(auto,createNew){
    if(workspace&&!workspace.isConnected)workspace=null;
    if(workspace){if(createNew)await createTab();return;}
    if(openingPromise){
      await openingPromise;
      if(createNew&&workspace)await createTab();
      return;
    }
    openingPromise=(async()=>{
      try{await session();await loadSnapshot();}
      catch(error){if(!auto)alert(error.message||'无法打开临时页签');return;}
      if(workspace&&workspace.isConnected)return;
      const existing=document.querySelector('#scratchWorkspaceV259');
      if(existing){workspace=existing;return;}
      const main=document.querySelector('#main');if(!main){if(!auto)alert('资料工作区尚未就绪。');return;}main.insertAdjacentHTML('beforeend',workspaceMarkup());workspace=document.querySelector('#scratchWorkspaceV259');
      document.body.classList.add('scratch-mode-v2510');document.querySelector('#scratchLaunchV259')?.setAttribute('aria-pressed','true');
      storage.set(LAST_OPEN_KEY,'1');
      workspace.querySelector('[data-scratch-add]').addEventListener('click',createTab);workspace.querySelector('[data-scratch-empty-add]').addEventListener('click',createTab);
      workspace.querySelector('[data-scratch-exit]').addEventListener('click',exitWorkspace);workspace.querySelector('[data-scratch-recent]').addEventListener('click',toggleRecent);workspace.querySelector('[data-scratch-organize]').addEventListener('click',openOrganize);
      const tabsScroll=workspace.querySelector('.scratch-tabs-scroll-v259');if(tabsScroll)tabsScroll.addEventListener('wheel',event=>{if(Math.abs(event.deltaY)<=Math.abs(event.deltaX)||tabsScroll.scrollWidth<=tabsScroll.clientWidth)return;event.preventDefault();tabsScroll.scrollLeft+=event.deltaY;},{passive:false});
      editor=workspace.querySelector('[data-scratch-editor]');
      editor.addEventListener('input',onInput);editor.addEventListener('scroll',()=>{const tab=current();if(tab)tab.scroll_top=editor.scrollTop;},{passive:true});editor.addEventListener('keyup',rememberCursor);editor.addEventListener('click',rememberCursor);editor.addEventListener('select',rememberCursor);
      let desired=Number(storage.get(ACTIVE_KEY)||0);if(!snapshot.open.some(t=>Number(t.id)===desired))desired=Number(snapshot.open[0]?.id||0);activeId=desired;
      if(createNew||(!activeId&&snapshot.open.length===0))await createTab();else{renderTabs();renderEditor();}
    })();
    try{await openingPromise;}finally{openingPromise=null;}
  }

  function rememberCursor'''
          s=s[:match.start()]+new_block+s[match.end():]
          p.write_text(s,encoding='utf-8')
          print('SCRATCH_SINGLE_OPEN_PATCH=APPLIED')
          PY
          node --check public/assets/scratch-tabs.js
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'public/assets/scratch-tabs.js','SOURCE_MANIFEST.json','SOURCE_MANIFEST.txt'}
          if changed!=expected: raise SystemExit(f'unexpected corrective diff: {sorted(changed)}')
          print('CORRECTIVE_DIFF_SCOPE=PASS')
          PY
          git config user.name 'VF Release Runner'
          git config user.email 'vf-release-runner@users.noreply.github.com'
          git add public/assets/scratch-tabs.js SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          git commit -m 'fix(P02): serialize scratch workspace opening'
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:develop
          echo "PRODUCT_REF=$NEW_SHA" >> "$GITHUB_ENV"
          echo "PRODUCT_DEVELOP_SHA=$NEW_SHA"
          echo PRODUCT_DEVELOP_CORRECTIVE_WRITE=PASS

      - name: Install runtime and browser dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip curl jq unzip
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Correct candidate browser assertion to public DOM contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2528-candidate.sh')
          s=p.read_text(encoding='utf-8')
          old="""  await page.waitForFunction(label=>{\n    const s=globalThis.state||{};\n    if(label==='all')return s.mode==='all'&&s.status==='active';\n    if(label==='favorite')return s.mode==='favorite'&&s.status==='active';\n    if(label==='recent')return s.mode==='recent'&&s.status==='active';\n    if(label==='draft')return s.status==='draft';\n    if(label==='trash')return s.status==='trash';\n    if(label==='settings')return s.mode==='settings';\n    return false;\n  },label,{timeout:10000});"""
          new="""  const activeSelector={all:'[data-mode=\"all\"]',favorite:'[data-mode=\"favorite\"]',recent:'[data-mode=\"recent\"]',draft:'#draftBtn',trash:'#trashBtn',settings:'#settingsBtn'}[label];\n  await page.waitForFunction(sel=>document.querySelector(sel)?.classList.contains('active'),activeSelector,{timeout:10000});"""
          if old not in s: raise SystemExit('expected lexical-state assertion block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('PUBLIC_DOM_ASSERTION_PATCH=PASS')
          PY

      - name: Verify exact V2.5.28 candidate
        env:
          TEST_PASSWORD: P02-V2528-${{ github.run_id }}!
        run: bash scripts/p02-v2528-candidate.sh

      - name: Protected boundaries
        if: always()
        run: |
          echo PRIVATE_SOURCE_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo CANDIDATE_BYTES_PERSISTED_AS_PUBLIC_ARTIFACT=NO
          echo MAIN_WRITE=NO
          echo FORMAL_RELEASE=NO
          echo CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
