# TEMP one-shot P02 ONLY fourth original Chromium flow diagnostic. Close without merge.
# Public-safe structured checkpoints only; private logs remain in disposable 0700 workspace.
name: TEMP P02 Stage6 fourth Chromium isolated diagnosis
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/p02-stage6-bulk-diagnostic-once.yml']
permissions:
  contents: read
concurrency:
  group: p02-stage6-bulk-diagnostic-once
  cancel-in-progress: false
jobs:
  fourth-only:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.ref == 'test/p02-stage6-bulk-diagnostic-20261125' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: ed2f88cab46db5321251045360edcb37bc964d1e
          path: control
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,pdo_mysql,dom,xml,zip,curl,fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: '10.20.0', run_install: false}
      - name: Exact source, disposable Chromium and Clean FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test "$(git -C control rev-parse HEAD)" = ed2f88cab46db5321251045360edcb37bc964d1e
          test "$(git -C control rev-parse HEAD^{tree})" = 58eb2340f0441c61295ce2aa9a3fdba51c9007ab
          test "$(git -C target rev-parse HEAD)" = b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          test "$(git -C target rev-parse HEAD^{tree})" = d524c7c4e34b7348e24c344c4c6696f86884743f
          echo P02_BULK_DIAG_EXACT_CONTROL_AND_PRODUCT=PASS
          lab="$RUNNER_TEMP/p02-stage6-bulk"
          toolsdir="$RUNNER_TEMP/p02-playwright-bulk"
          test ! -e "$lab" && test ! -e "$toolsdir"
          install -d -m 0700 "$lab" "$toolsdir"
          if npm install --prefix "$toolsdir" playwright@1.56.1 >"$lab/npm.log" 2>&1 &&
            PLAYWRIGHT_BROWSERS_PATH="$lab/browsers" node "$toolsdir/node_modules/playwright/cli.js" install --with-deps chromium >"$lab/browser-install.log" 2>&1; then
            echo P02_BULK_DIAG_CHROMIUM=PASS
          else
            echo P02_BULK_DIAG_CHROMIUM=FAIL
            exit 1
          fi
          if bash target/scripts/build-clean-full.sh "$lab/full.zip" >"$lab/full-build.log" 2>&1 && unzip -tqq "$lab/full.zip" >/dev/null; then
            echo P02_BULK_DIAG_CLEAN_FULL=PASS
          else
            echo P02_BULK_DIAG_CLEAN_FULL=FAIL
            exit 1
          fi
      - name: Original fourth bulk organization browser only with safe failure markers
        shell: bash
        env:
          E2E_CONFIRM_DISPOSABLE_NEW_VFDOC: 'YES'
          E2E_EXACT_SOURCE_SHA: b1cfa8c6cca8c5c5f430d865c7a0570d5c8f857a
          E2E_EMAIL: synthetic@example.test
          E2E_PASSWORD: synthetic-secure-password
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          lab="$RUNNER_TEMP/p02-stage6-bulk"
          site="$lab/bulk-fourth-fresh-full"
          test -f "$lab/full.zip" && test ! -e "$site" && test ! -L "$site"
          install -d -m 0700 "$site"
          unzip -q "$lab/full.zip" -d "$site"
          test ! -e "$site/.env"
          test ! -e "$site/storage/app/private/installed.json"
          printf '%s\n' '<?php' '$p=parse_url($_SERVER["REQUEST_URI"],PHP_URL_PATH);' 'if(is_file(__DIR__."/public".$p))return false;' 'require __DIR__."/public/index.php";' >"$site/router.php"
          php -S 127.0.0.1:8000 -t "$site/public" "$site/router.php" >"$lab/php-private.log" 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/setup.php 2>/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1 || { echo P02_BULK_DIAG_SERVER_READY=FAIL; exit 1; }
          if python3 target/tests/e2e/full_install_probe.py --root "$site" --base http://127.0.0.1:8000 --engine sqlite --mode clean >"$lab/install-private.log" 2>&1; then
            echo P02_BULK_DIAG_FRESH_OWNER_INSTALL=PASS
          else
            echo P02_BULK_DIAG_FRESH_OWNER_INSTALL=FAIL
            exit 1
          fi
          export PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/p02-playwright-bulk/node_modules/playwright"
          export PLAYWRIGHT_BROWSERS_PATH="$lab/browsers"
          node --check target/tests/e2e/bulk_organization.browser.cjs
          if timeout 150s node target/tests/e2e/bulk_organization.browser.cjs >"$lab/bulk-raw-private.log" 2>&1; then
            echo P02_BULK_DIAG_FOURTH_ONLY=PASS
          else
            rc="$?"
            echo "P02_BULK_DIAG_FOURTH_EXIT_CODE=$rc"
            python3 -B - "$lab/bulk-raw-private.log" "$lab/php-private.log" <<'PY'
          import pathlib,re,sys
          raw=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          php=pathlib.Path(sys.argv[2]).read_text(errors='replace')
          checkpoints={'start','login','make-category-and-tag','create-note','category-move','tag-add','three-width','verify-editor-data','done'}
          m=re.search(r'P02_BULK_ORGANIZE_CHECKPOINT=([a-z-]+)',raw)
          checkpoint=m.group(1) if m and m.group(1) in checkpoints else 'UNKNOWN'
          print('P02_BULK_DIAG_CHECKPOINT='+checkpoint)
          if 'TimeoutError' in raw: category='PLAYWRIGHT_TIMEOUT'
          elif 'AssertionError' in raw: category='ASSERTION'
          elif 'strict mode violation' in raw: category='LOCATOR_AMBIGUOUS'
          elif 'TypeError' in raw: category='JAVASCRIPT_TYPE_ERROR'
          elif 'Target page, context or browser has been closed' in raw: category='BROWSER_CLOSED'
          elif 'Error: locator.' in raw: category='LOCATOR_OR_PAGE_ERROR'
          else: category='UNCLASSIFIED'
          print('P02_BULK_DIAG_ERROR_CLASS='+category)
          assertions={'batch selection should reset':'BULK_SELECTION_RESET','tag batch selection should reset':'TAG_SELECTION_RESET','bulk organizer caused horizontal scroll':'HORIZONTAL_OVERFLOW'}
          matched=next((v for k,v in assertions.items() if k in raw),'NONE')
          print('P02_BULK_DIAG_ASSERT_ID='+matched)
          flags=[]
          for method,status in re.findall(r'\[(\d{3})\]:\s+(POST|GET)\s+/(?:materials/bulk|login|categories|tags)',php):
            flags.append(method+'_'+status)
          print('P02_BULK_DIAG_RELATED_HTTP='+(','.join(sorted(set(flags))[:12]) if flags else 'NONE_OBSERVED'))
          PY
            exit 1
          fi
      - name: Always remove transient source, private logs, installations and browsers
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- control target "$RUNNER_TEMP/p02-stage6-bulk" "$RUNNER_TEMP/p02-playwright-bulk"
          test ! -e control && test ! -e target && test ! -e "$RUNNER_TEMP/p02-stage6-bulk"
          echo P02_BULK_DIAG_PRIVATE_CLEAN=PASS
