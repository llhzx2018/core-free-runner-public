name: S01 C02 1.21.1108 owner visual-only formal release
on:
  push:
    branches: [task/s01-c02-1211106-real-wp-tools-css-20261012]
    paths: [.github/workflows/s01-c02-1211108-formal-20261013.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: fd1c082d7651a66a204dba1a8f0ecb2760096ba3
      CANDIDATE_SHA: 6223123b9a86679e59d144c280e5e9d6c90852fd
      VERSION: '1.21.1108'
      ASSET_SHA: 8376a23dd52f187e9f1c3cb484c6f3d5fd3552d00b2a4955361220043e3d1ea6
      TARGET_REPO: llhzx2018/vf-tools-ops
    steps:
      - name: Checkout exact promoted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: fd1c082d7651a66a204dba1a8f0ecb2760096ba3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Revalidate immutable merge, machine proof, and deterministic package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat product/VERSION)" = "$VERSION"
          git -C product merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          mkdir -p proof
          python3 product/.github/release/build-ops-package.py --source product --output "proof/vf-tools-ops_V1.21.1108.zip" > proof/package.json
          python3 product/.github/release/build-ops-package.py --source product --output "proof/rebuild.zip" > proof/rebuild.json
          cmp proof/vf-tools-ops_V1.21.1108.zip proof/rebuild.zip
          echo "$ASSET_SHA  proof/vf-tools-ops_V1.21.1108.zip" | sha256sum -c -
          python3 - <<'PY'
          import json,zipfile
          p=json.load(open('proof/package.json'))
          assert p['version']=='1.21.1108' and p['runtime_files']==990
          assert p['asset_sha256']=='8376a23dd52f187e9f1c3cb484c6f3d5fd3552d00b2a4955361220043e3d1ea6'
          with zipfile.ZipFile('proof/vf-tools-ops_V1.21.1108.zip') as z:
              assert z.testzip() is None
              assert all(x.startswith('vf-ops/') and '..' not in x.split('/') for x in z.namelist())
          print('EXACT_MERGED_FORMAL_PACKAGE_PASS')
          PY
      - name: Verify public source-candidate WordPress machine run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          proof=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38331455258 --jq '.conclusion')
          test "$proof" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/38331455258 --jq '.head_sha')" = a3094639b9ad0dc9ee369dacfdb24aadd5a0a044
          echo EXACT_PUBLIC_CANDIDATE_MACHINE_PROOF=PASS
      - name: Publish one immutable formal GitHub release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          # Match the exact private commit-read endpoint proven by formal 1.21.1106.
          # A live main check is still required; do not skip authorization failures.
          live_main=$(gh api "repos/$TARGET_REPO/commits/main" --jq '.sha')
          test "$live_main" = "$TARGET_SHA"
          remote_commit=$(gh api "repos/$TARGET_REPO/commits/$TARGET_SHA" --jq '.sha')
          test "$remote_commit" = "$TARGET_SHA"
          if gh release view "v$VERSION" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo 'Existing release version cannot be overwritten'; exit 1
          fi
          if gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Existing tag version cannot be moved'; exit 1
          fi
          cat > proof/release-notes.md <<'NOTES'
          # VF Tools Ops 1.21.1108 · 工具页 VF 青绿与高级信息精修
          
          本版仅针对 OWNER 真实升级 1.21.1107 后的工具页 UX/UI 局部修复。
          
          - 源码：PR #405，合并 main fd1c082d7651a66a204dba1a8f0ecb2760096ba3。
          - 工具页复选框在 WordPress 后台强制使用 VF 青绿的选中态与白色勾选；仍然是真正 input[type=checkbox]，保持原生语义、键盘操作和焦点反馈。高级工具信息改为清晰独立的标题与说明及展开状态。
          - 已冻结公共 Shell/Header/Header Menu/R18 Page Frame 没有源码修改；顶部状态与当前任务由 R18 原有逻辑整合，不新建第二份。
          - 隔离验收 Runner #38331455258：WordPress 7.1.3 / MariaDB / 正式 M3U8 1.25.84；正式 Ops 1.21.1107→候选 1.21.1108→正式 1.21.1107→候选 1.21.1108 安装/升级/回滚和 Provider 全配置指纹保全 PASS；四宽度真实浏览器和 8/8 UI 回归 PASS；复选框变绿的隔离截图已人工复查。
          - 正式 ZIP：vf-tools-ops_V1.21.1108.zip，vf-ops 单根目录、990 个运行文件、字节数 3579681、SHA-256 8376a23dd52f187e9f1c3cb484c6f3d5fd3552d00b2a4955361220043e3d1ea6。
          - Schema 6.0.0 不变，没有 Auth、Nonce、Revision、Provider canonical 事务或更新协议变更。六设置动态 POST 保存与安全拒绝的独立专项测试仍为 UNVERIFIED，不能被 UI 验收替代。
          - Production 始终 OWNER 手动升级；没有自动修改生产站点。
          NOTES
          gh release create "v$VERSION" "proof/vf-tools-ops_V1.21.1108.zip" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Ops 1.21.1108 · 工具页绿色控件与高级信息精修' --notes-file proof/release-notes.md --latest
          echo FORMAL_RELEASE_CREATED=PASS
      - name: Verify remote release tag and exact asset bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$TARGET_REPO/git/ref/tags/v$VERSION" --jq '.object.sha')" = "$TARGET_SHA"
          test "$(gh api "repos/$TARGET_REPO/releases/tags/v$VERSION" --jq '.draft')" = false
          mkdir -p proof/remote
          gh release download "v$VERSION" --repo "$TARGET_REPO" --pattern 'vf-tools-ops_V1.21.1108.zip' --dir proof/remote
          cmp proof/vf-tools-ops_V1.21.1108.zip proof/remote/vf-tools-ops_V1.21.1108.zip
          echo "$ASSET_SHA  proof/remote/vf-tools-ops_V1.21.1108.zip" | sha256sum -c -
          echo REMOTE_ASSET_IMMUTABLE_SHA_READBACK_PASS
      - name: Upload nonsecret proof only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1107-formal-proof-${{ github.run_id }}
          path: |
            proof/package.json
            proof/rebuild.json
            proof/release-notes.md
          if-no-files-found: warn
          retention-days: 10
