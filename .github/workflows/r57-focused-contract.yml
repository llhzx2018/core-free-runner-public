name: R57 Focused Favorite Add Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r57-focused-contract.yml'

permissions:
  contents: read

jobs:
  r57-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: bea28feaf91beb032ea1ad3158949d1c30427373
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: bea28feaf91beb032ea1ad3158949d1c30427373
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/favorite_add_context_contract.php
          php tests/unit/favorite_add_context_contract.php
          php tests/unit/health_workspace_edit_deeplink_contract.php
          echo R57_FAVORITE_ADD_CONTEXT_CONTRACT_PASS
          echo R57_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
