name: S01 checker channel manifest verification
on:
  push:
    branches: [task/s01-checker-current-proof-20261031]
    paths: ['.github/workflows/s01-checker-channel-20261031.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: bcad3874cc18f33d50cd0d3ab59764f49ab80c56
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: channel
      - name: Verify manifest and remote release package
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p assets
          gh release download v1.35.222 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.222.zip --dir assets
          python3 - <<'PY'
          import json,zipfile,hashlib,pathlib
          p=json.loads(pathlib.Path('channel/projects/S01-C01.json').read_text())
          assert p['target_version']=='1.35.222' and '1.35.221' in p['from_versions']
          data=(pathlib.Path('assets')/p['asset_name']).read_bytes()
          assert len(data)==p['asset_bytes']==2039483 and hashlib.sha256(data).hexdigest()==p['asset_sha256']=='51c547d67a37e376b9eaf01b1d6e65cefb6c607a9541a66d1a2736b8d849d154'
          with zipfile.ZipFile(pathlib.Path('assets')/p['asset_name']) as z:
            assert z.testzip() is None
            assert sum(not i.is_dir() for i in z.infolist())==p['runtime_files']==476
            assert b'Version: 1.35.222' in z.read('vf-tools-theme/style.css')
          print('CHECKER_CHANNEL_ASSET_PASS')
          PY
