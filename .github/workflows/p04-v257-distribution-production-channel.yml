name: P04 V2.5.7 Distribution and Production Channel Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v257-distribution-production-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v257-distribution-production-channel
  cancel-in-progress: false

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VF_RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      VF_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_INFRA_ADMIN_PASSWORD: ${{ secrets.VF_INFRA_ADMIN_PASSWORD }}
      P04_ADMIN_PASSWORD: ${{ secrets.P04_ADMIN_PASSWORD }}
      P04_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.P04_PRODUCTION_ADMIN_PASSWORD }}
      VF_PRODUCTION_ADMIN_PASSWORD: ${{ secrets.VF_PRODUCTION_ADMIN_PASSWORD }}
      VF_INFRA_PRODUCTION_PASSWORD: ${{ secrets.VF_INFRA_PRODUCTION_PASSWORD }}
      VF_INFRA_SSH_HOST: ${{ secrets.VF_INFRA_SSH_HOST }}
      VF_INFRA_SSH_USER: ${{ secrets.VF_INFRA_SSH_USER }}
      VF_INFRA_SSH_PRIVATE_KEY: ${{ secrets.VF_INFRA_SSH_PRIVATE_KEY }}
      P04_SSH_HOST: ${{ secrets.P04_SSH_HOST }}
      P04_SSH_USER: ${{ secrets.P04_SSH_USER }}
      P04_SSH_PRIVATE_KEY: ${{ secrets.P04_SSH_PRIVATE_KEY }}
      CLOUDPANEL_SSH_HOST: ${{ secrets.CLOUDPANEL_SSH_HOST }}
      CLOUDPANEL_SSH_USER: ${{ secrets.CLOUDPANEL_SSH_USER }}
      CLOUDPANEL_SSH_PRIVATE_KEY: ${{ secrets.CLOUDPANEL_SSH_PRIVATE_KEY }}
      PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      PRODUCTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify V2.5.7 Tag Release and downloadable UPDATE asset
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_RELEASE_TOKEN"
          TAG_JSON="$RUNNER_TEMP/tag.json"
          RELEASE_JSON="$RUNNER_TEMP/release.json"
          UPDATE_ZIP="$RUNNER_TEMP/VF_Infra_V2.5.7_UPDATE.zip"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/llhzx2018/vf-infra/git/ref/tags/v2.5.7 -o "$TAG_JSON"
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/llhzx2018/vf-infra/releases/tags/v2.5.7 -o "$RELEASE_JSON"
          python3 - "$TAG_JSON" "$RELEASE_JSON" <<'PY'
          import json,sys
          tag=json.load(open(sys.argv[1])); rel=json.load(open(sys.argv[2]))
          assert tag['object']['sha']=='1390b84a69798eee05b9eabd9a8ec02308f80f62'
          assert rel['id']==371332329 and rel['tag_name']=='v2.5.7' and rel['name']=='VF Infra V2.5.7'
          a=next(x for x in rel['assets'] if x['name']=='VF_Infra_V2.5.7_UPDATE.zip')
          assert a['id']==516848466 and a['size']==85945
          assert a.get('digest')=='sha256:9d8ed43579361ca459b9377e3f5f7526a17f1b8a8d82df634cfe519b58c3503f'
          print('RELEASE_METADATA=PASS')
          PY
          curl -fsSL -H "Authorization: Bearer $VF_RELEASE_TOKEN" -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/llhzx2018/vf-infra/releases/assets/516848466 -o "$UPDATE_ZIP"
          test "$(stat -c %s "$UPDATE_ZIP")" = '85945'
          test "$(sha256sum "$UPDATE_ZIP" | awk '{print $1}')" = '9d8ed43579361ca459b9377e3f5f7526a17f1b8a8d82df634cfe519b58c3503f'
          echo 'UPDATE_ASSET_DOWNLOAD=PASS'
          echo 'UPDATE_ASSET_SHA256=PASS'

      - name: Verify core-updates P04 exact discovery metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          TOKEN="$VF_READ_TOKEN"; [ -n "$TOKEN" ] || TOKEN="$VF_RELEASE_TOKEN"
          META="$RUNNER_TEMP/p04.json"
          curl -fsSL -H "Authorization: Bearer $TOKEN" -H 'Accept: application/vnd.github.raw+json' \
            'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main' -o "$META"
          python3 - "$META" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['enabled'] is True
          assert d['target_version']=='2.5.7'
          assert d['update_type']=='ATOMIC'
          assert d['from_versions']==['2.5.6']
          assert d['schema_from']=='14' and d['schema_to']=='14'
          assert d['release_tag']=='v2.5.7' and d['release_id']==371332329
          assert d['release_product_commit']=='1390b84a69798eee05b9eabd9a8ec02308f80f62'
          assert d['release_product_tree']=='1d5578b930af910ce167c65eb2ca8723dcf4e45c'
          assert d['asset_name']=='VF_Infra_V2.5.7_UPDATE.zip'
          assert d['asset_id']==516848466 and d['asset_bytes']==85945
          assert d['asset_sha256']=='9d8ed43579361ca459b9377e3f5f7526a17f1b8a8d82df634cfe519b58c3503f'
          assert d['backup_required'] is True and d['rollback_supported'] is True
          print('CORE_UPDATES_REMOTE_IDENTITY=PASS')
          print('DISCOVERY_METADATA=PASS')
          PY

      - name: Probe authenticated Production execution channels without revealing values
        shell: bash
        run: |
          set -Eeuo pipefail
          admin=0; ssh_host=0; ssh_user=0; ssh_key=0; found=0
          for name in VF_INFRA_ADMIN_PASSWORD P04_ADMIN_PASSWORD P04_PRODUCTION_ADMIN_PASSWORD VF_PRODUCTION_ADMIN_PASSWORD VF_INFRA_PRODUCTION_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; admin=1; found=1; fi
          done
          for name in VF_INFRA_SSH_HOST P04_SSH_HOST CLOUDPANEL_SSH_HOST PRODUCTION_SSH_HOST; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_host=1; found=1; fi
          done
          for name in VF_INFRA_SSH_USER P04_SSH_USER CLOUDPANEL_SSH_USER PRODUCTION_SSH_USER; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_user=1; found=1; fi
          done
          for name in VF_INFRA_SSH_PRIVATE_KEY P04_SSH_PRIVATE_KEY CLOUDPANEL_SSH_PRIVATE_KEY PRODUCTION_SSH_PRIVATE_KEY; do
            if [ -n "${!name:-}" ]; then echo "$name=AVAILABLE"; ssh_key=1; found=1; fi
          done
          if [ "$admin" -eq 1 ]; then echo 'PRODUCTION_ADMIN_CHANNEL=AVAILABLE'; else echo 'PRODUCTION_ADMIN_CHANNEL=NONE'; fi
          if [ "$ssh_host" -eq 1 ] && [ "$ssh_user" -eq 1 ] && [ "$ssh_key" -eq 1 ]; then echo 'PRODUCTION_SSH_CHANNEL=COMPLETE'; else echo 'PRODUCTION_SSH_CHANNEL=INCOMPLETE'; fi
          if [ "$found" -eq 0 ]; then echo 'KNOWN_PRODUCTION_CREDENTIAL_CHANNEL=NONE'; else echo 'KNOWN_PRODUCTION_CREDENTIAL_CHANNEL=AVAILABLE'; fi
          echo 'NO_PRODUCTION_NETWORK_WRITE_EXECUTED=TRUE'
          echo 'NO_SECRET_VALUE_PRINTED=TRUE'
