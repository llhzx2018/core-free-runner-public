name: P07 Network Node Package Gate

on:
  push:
    branches: [main]
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - '.github/workflows/p07-network-node-package-gate.yml'
  pull_request:
    paths:
      - 'installers/vf-node.sh'
      - 'packages/p07-network-node/**'
      - '.github/workflows/p07-network-node-package-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Resolve current package source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^VERSION='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test -n "$VERSION"
          PKG="packages/p07-network-node/$VERSION"
          test -f "$PKG/VERSION"
          test -f "$PKG/SOURCE_IDENTITY"
          test "$(tr -d '\r\n' < "$PKG/VERSION")" = "$VERSION"
          source "$PKG/SOURCE_IDENTITY"
          test "${P07_NETWORK_NODE_VERSION:-}" = "$VERSION"
          test "${PRIVATE_REPO:-}" = 'llhzx2018/vf-server-ops'
          test "${#PRIVATE_SOURCE_COMMIT}" = 40
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$PRIVATE_SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private current source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          SRC_SHA: ${{ steps.identity.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          TMP="$(mktemp -d)"
          curl -fL             -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}"             -o "$TMP/source.tar.gz"
          tar -xzf "$TMP/source.tar.gz" -C "$TMP"
          SRC_DIR="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -name 'llhzx2018-vf-server-ops-*' | head -n1)"
          test -n "$SRC_DIR"
          mkdir -p .private-network-node
          cp -a "$SRC_DIR/modules/network-node/." .private-network-node/

      - name: Compare public runtime bytes to exact private current source
        shell: bash
        run: |
          set -euo pipefail
          PKG="packages/p07-network-node/${{ steps.identity.outputs.version }}"
          SRC='.private-network-node'
          files=(VERSION vf-node.sh install.sh status.sh share.sh backup.sh uninstall.sh lib/common.sh lib/core-pin.env lib/patch_upstream_core.py)
          for f in "${files[@]}"; do
            cmp "$SRC/$f" "$PKG/$f"
          done
          echo 'P07_NETWORK_NODE_PUBLIC_BYTES_MATCH_PRIVATE_CURRENT=PASS'

      - name: Run exact private current source regression gates
        shell: bash
        run: |
          set -euo pipefail
          bash .private-network-node/tests/static_gate.sh
          bash .private-network-node/tests/upstream_patch_gate.sh

      - name: ShellCheck exact private current source
        shell: bash
        run: |
          set -euo pipefail
          # Current RC9 baseline exclusions:
          # SC1091: SCRIPT_DIR-relative sourced files are runtime-resolved.
          # SC1111: intentional Chinese smart quotes in user-facing copy.
          # SC2155: existing Current source style warning; no runtime-byte rewrite in Runner convergence.
          shellcheck -x -e SC1091,SC1111,SC2155 \
            .private-network-node/vf-node.sh \
            .private-network-node/install.sh \
            .private-network-node/status.sh \
            .private-network-node/share.sh \
            .private-network-node/backup.sh \
            .private-network-node/uninstall.sh
          # SC2016 is intentional in regression tests that grep literal shell expressions.
          shellcheck -x -e SC1091,SC2016 \
            .private-network-node/tests/static_gate.sh \
            .private-network-node/tests/upstream_patch_gate.sh \
            .private-network-node/tests/ephemeral_install_gate.sh
          # SC2034 is expected for globals consumed by scripts sourcing common.sh.
          shellcheck -e SC2034 .private-network-node/lib/common.sh
          echo 'P07_NETWORK_NODE_CURRENT_PRIVATE_STATIC=PASS'
          echo 'P07_NETWORK_NODE_CURRENT_PRIVATE_UPSTREAM_PATCH=PASS'
          echo 'P07_NETWORK_NODE_CURRENT_PRIVATE_SHELLCHECK=PASS'

      - name: Current route manifest and runtime safety
        shell: bash
        run: |
          set -euo pipefail
          PKG="packages/p07-network-node/${{ steps.identity.outputs.version }}"
          manifest_expected="$(sed -n "s/^MANIFEST_SHA256='\([^']*\)'/\1/p" installers/vf-node.sh | head -n1)"
          test -n "$manifest_expected"
          test "$(sha256sum "$PKG/MANIFEST.sha256" | awk '{print $1}')" = "$manifest_expected"
          bash -n "$PKG/vf-node.sh" "$PKG/install.sh" "$PKG/status.sh" "$PKG/share.sh" "$PKG/backup.sh" "$PKG/uninstall.sh" "$PKG/lib/common.sh"
          python3 -m py_compile "$PKG/lib/patch_upstream_core.py"
          if grep -R -nE '(VF_PRIVATE_READ_TOKEN|ghp_|github_pat_|BEGIN .*PRIVATE KEY)' "$PKG"; then exit 31; fi
          grep -Fq 'wait_for_udp_listener()' "$PKG/lib/common.sh"
          grep -Fq 'restart_managed_node()' "$PKG/lib/common.sh"
          grep -Fq 'write_state PENDING' "$PKG/install.sh"
          grep -Fq 'write_state FAILED' "$PKG/install.sh"
          grep -Fq 'write_state HEALTHY' "$PKG/install.sh"
          grep -Fq 'repair_managed_install()' "$PKG/vf-node.sh"
          grep -Fq '当前节点没有通过健康检查，暂不显示分享链接' "$PKG/share.sh"
          grep -Fq '请选择 [0-1]：' "$PKG/uninstall.sh"
          grep -Fq '未触碰：Caddy / 防火墙 / DNS / 其他服务' "$PKG/uninstall.sh"
          echo 'P07_NETWORK_NODE_CURRENT_ROUTE_SAFETY=PASS'

      - name: Emit current runtime SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "packages/p07-network-node/${{ steps.identity.outputs.version }}"
          echo 'P07_NETWORK_NODE_MANIFEST_BEGIN'
          sha256sum VERSION vf-node.sh install.sh status.sh share.sh backup.sh uninstall.sh lib/common.sh lib/core-pin.env lib/patch_upstream_core.py
          echo 'P07_NETWORK_NODE_MANIFEST_END'
