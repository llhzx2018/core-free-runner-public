name: P07 Network Node Package Gate

on:
  push:
    paths:
      - 'packages/p07-network-node/0.1.0-rc8/**'
      - '.github/workflows/p07-network-node-package-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Read package source identity
        id: identity
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc8'
          test -f "$PKG/SOURCE_IDENTITY"
          source "$PKG/SOURCE_IDENTITY"
          test "$VERSION" = '0.1.0-rc8'
          test "${#PRIVATE_SOURCE_SHA}" = 40
          echo "sha=$PRIVATE_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private RC8 source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          SRC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}" \
            -o "$TMP/source.tar.gz"
          tar -xzf "$TMP/source.tar.gz" -C "$TMP"
          SRC_DIR="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -name 'llhzx2018-vf-server-ops-*' | head -n1)"
          test -n "$SRC_DIR"
          mkdir -p .private-network-node
          cp -a "$SRC_DIR/modules/network-node/." .private-network-node/

      - name: Compare public runtime bytes to exact private RC8
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc8'
          SRC='.private-network-node'
          files=(
            VERSION
            vf-node.sh
            install.sh
            status.sh
            share.sh
            backup.sh
            uninstall.sh
            lib/common.sh
            lib/core-pin.env
            lib/patch_upstream_core.py
          )
          for f in "${files[@]}"; do
            cmp "$SRC/$f" "$PKG/$f"
          done
          echo 'P07_NETWORK_NODE_PUBLIC_BYTES_MATCH_PRIVATE_RC8=PASS'

      - name: Runtime syntax, secret and RC8 health checks
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc8'
          bash -n "$PKG/vf-node.sh" "$PKG/install.sh" "$PKG/status.sh" "$PKG/share.sh" "$PKG/backup.sh" "$PKG/uninstall.sh" "$PKG/lib/common.sh"
          python3 -m py_compile "$PKG/lib/patch_upstream_core.py"
          if grep -R -nE '(VF_PRIVATE_READ_TOKEN|ghp_|github_pat_|BEGIN .*PRIVATE KEY)' "$PKG"; then exit 31; fi
          grep -Fq '0.1.0-rc8' "$PKG/VERSION"
          grep -Fq 'PRIVATE_SOURCE_SHA=58299cfdb0ce961dd473108312014ac6c916401a' "$PKG/SOURCE_IDENTITY"
          grep -Fq 'wait_for_udp_listener()' "$PKG/lib/common.sh"
          grep -Fq 'restart_managed_node()' "$PKG/lib/common.sh"
          grep -Fq 'wait_for_udp_listener "$port" 20' "$PKG/install.sh"
          grep -Fq 'write_state PENDING' "$PKG/install.sh"
          grep -Fq 'write_state FAILED' "$PKG/install.sh"
          grep -Fq 'write_state HEALTHY' "$PKG/install.sh"
          grep -Fq '安装异常 · 可自动修复' "$PKG/vf-node.sh"
          grep -Fq 'repair_managed_install()' "$PKG/vf-node.sh"
          grep -Fq 'restart_managed_node 20' "$PKG/vf-node.sh"
          grep -Fq '当前节点没有通过健康检查，暂不显示分享链接' "$PKG/share.sh"
          grep -Fq '按 Enter 返回主菜单' "$PKG/install.sh"
          if grep -Fq '节点已就绪 · 下一步' "$PKG/vf-node.sh" "$PKG/install.sh"; then exit 35; fi
          grep -Fq '请选择 [0-1]：' "$PKG/uninstall.sh"
          grep -Fq 'systemctl stop v2ray.service' "$PKG/uninstall.sh"
          grep -Fq '未触碰：Caddy / 防火墙 / DNS / 其他服务' "$PKG/uninstall.sh"
          echo 'P07_NETWORK_NODE_PUBLIC_SECRET_SURFACE=PASS'
          echo 'P07_NETWORK_NODE_PUBLIC_RC8_HEALTH_STATE=PASS_STATIC'
          echo 'P07_NETWORK_NODE_PUBLIC_RC8_AUTO_REPAIR=PASS_STATIC'
          echo 'P07_NETWORK_NODE_PUBLIC_RC8_SHARE_HEALTH_GUARD=PASS_STATIC'

      - name: Emit runtime SHA256 manifest
        run: |
          set -euo pipefail
          cd packages/p07-network-node/0.1.0-rc8
          echo 'P07_NETWORK_NODE_MANIFEST_BEGIN'
          sha256sum \
            VERSION \
            vf-node.sh \
            install.sh \
            status.sh \
            share.sh \
            backup.sh \
            uninstall.sh \
            lib/common.sh \
            lib/core-pin.env \
            lib/patch_upstream_core.py
          echo 'P07_NETWORK_NODE_MANIFEST_END'
