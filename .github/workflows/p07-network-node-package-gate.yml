name: P07 Network Node Package Gate

on:
  push:
    paths:
      - 'packages/p07-network-node/0.1.0-rc4/**'
      - '.github/workflows/p07-network-node-package-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read package source identity
        id: identity
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc4'
          test -f "$PKG/SOURCE_IDENTITY"
          source "$PKG/SOURCE_IDENTITY"
          test "$VERSION" = '0.1.0-rc4'
          test "${#PRIVATE_SOURCE_SHA}" = 40
          echo "sha=$PRIVATE_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Fetch exact private RC4 source
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          SRC_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}" \
            -o "$TMP/source.tar.gz"
          tar -xzf "$TMP/source.tar.gz" -C "$TMP"
          SRC_DIR="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d -name 'llhzx2018-vf-server-ops-*' | head -n1)"
          test -n "$SRC_DIR"
          mkdir -p .private-network-node
          cp -a "$SRC_DIR/modules/network-node/." .private-network-node/

      - name: Compare public runtime bytes to exact private RC4
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc4'
          SRC='.private-network-node'
          files=(
            VERSION
            vf-node.sh
            install.sh
            status.sh
            share.sh
            backup.sh
            uninstall.sh
            lib/common.sh
            lib/core-pin.env
            lib/patch_upstream_core.py
          )
          for f in "${files[@]}"; do
            cmp "$SRC/$f" "$PKG/$f"
          done
          echo 'P07_NETWORK_NODE_PUBLIC_BYTES_MATCH_PRIVATE_RC4=PASS'

      - name: Runtime syntax, secret and uninstall UX checks
        run: |
          set -euo pipefail
          PKG='packages/p07-network-node/0.1.0-rc4'
          bash -n "$PKG/vf-node.sh" "$PKG/install.sh" "$PKG/status.sh" "$PKG/share.sh" "$PKG/backup.sh" "$PKG/uninstall.sh" "$PKG/lib/common.sh"
          python3 -m py_compile "$PKG/lib/patch_upstream_core.py"
          if grep -R -nE '(VF_PRIVATE_READ_TOKEN|ghp_|github_pat_|BEGIN .*PRIVATE KEY)' "$PKG"; then exit 31; fi
          grep -Fq '0.1.0-rc4' "$PKG/VERSION"
          grep -Fq 'PRIVATE_SOURCE_SHA=d9101d25f26f97c7f6533ee7ff9c0f56aa4ebdb7' "$PKG/SOURCE_IDENTITY"
          grep -Fq 'upstream_log="$tmp/upstream-install.log"' "$PKG/install.sh"
          grep -Fq '请选择 [0-1]：' "$PKG/uninstall.sh"
          grep -Fq 'read -e -r choice' "$PKG/uninstall.sh"
          grep -Fq 'systemctl stop v2ray.service' "$PKG/uninstall.sh"
          grep -Fq '未触碰：Caddy / 防火墙 / DNS / 其他服务' "$PKG/uninstall.sh"
          if grep -Fq 'UNINSTALL_VF_NODE' "$PKG/uninstall.sh"; then exit 34; fi
          if grep -Fq '"$cli" uninstall' "$PKG/uninstall.sh"; then exit 32; fi
          if grep -Eq 'rm -rf /etc/caddy|rm -rf /usr/local/bin/caddy|if-pre-up.d/iptables' "$PKG/uninstall.sh"; then exit 33; fi
          echo 'P07_NETWORK_NODE_PUBLIC_SECRET_SURFACE=PASS'
          echo 'P07_NETWORK_NODE_PUBLIC_NUMERIC_UNINSTALL_UX=PASS_STATIC'
          echo 'P07_NETWORK_NODE_PUBLIC_P07_OWNED_UNINSTALL=PASS_STATIC'

      - name: Emit runtime SHA256 manifest
        run: |
          set -euo pipefail
          cd packages/p07-network-node/0.1.0-rc4
          echo 'P07_NETWORK_NODE_MANIFEST_BEGIN'
          sha256sum \
            VERSION \
            vf-node.sh \
            install.sh \
            status.sh \
            share.sh \
            backup.sh \
            uninstall.sh \
            lib/common.sh \
            lib/core-pin.env \
            lib/patch_upstream_core.py
          echo 'P07_NETWORK_NODE_MANIFEST_END'
