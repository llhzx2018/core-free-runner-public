name: "TEMP P01 V2.47.465 exact channel independent verification"
on:
  push:
    branches:
      - "verify/p01-v247465-channel-20261027"
permissions:
  contents: read
jobs:
  p01-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHANNEL_SHA: "4d90afc9d7faa903d55dc386ee99a16a31bcf636"
      PRODUCT_SHA: "b42441e0691f0e82d25732b90fc2cbaee9bf7271"
    steps:
      - name: Checkout exact private core-updates PR source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: "4d90afc9d7faa903d55dc386ee99a16a31bcf636"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Check exact manifest schema and semantic contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHANNEL_SHA"
          python3 scripts/check_manifest_contract.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('projects/P01.json').read_text(encoding='utf-8'))
          expected={
            'project_id':'P01','component_id':'APP','current_version':'2.47.464',
            'target_version':'2.47.465','release_tag':'v2.47.465','release_id':424973428,
            'product_identity':'b42441e0691f0e82d25732b90fc2cbaee9bf7271',
            'asset_name':'VF_Start_V2.47.465_UPDATE.zip','asset_bytes':3119562,
            'asset_sha256':'41ece9d3fe0b3c35c59e722e9ebeabd6c25f744d91f182d413bc0cf5d7aabb22',
            'schema_from':'2026102201','schema_to':'2026102201',
            'backup_required':True,'rollback_supported':True,'update_type':'ATOMIC',
            'repository':'llhzx2018/vf-start',
          }
          for key,value in expected.items():
            assert m.get(key)==value,(key,m.get(key),value)
          assert m['from_versions']==['2.47.464']
          assert m.get('enabled') is True
          print('P01_V247465_CHANNEL_EXACT_MANIFEST=PASS')
          PY
      - name: Execute original Update Core PHP CI gates
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip unzip >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          echo P01_V247465_CHANNEL_UPDATE_CORE=PASS
      - name: Verify owning formal Tag Release and downloaded assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.47.465 --jq '.object.sha')" = "$PRODUCT_SHA"
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.47.465 --jq '.id')" = 424973428
          out="$RUNNER_TEMP/p01-v247465-channel-proof"
          mkdir -p "$out"
          gh release download v2.47.465 -R llhzx2018/vf-start -D "$out" -p "VF-Start-V2.47.465-FULL.zip" -p "VF_Start_V2.47.465_UPDATE.zip"
          test "$(stat -c %s "$out/VF-Start-V2.47.465-FULL.zip")" = 1425168
          test "$(stat -c %s "$out/VF_Start_V2.47.465_UPDATE.zip")" = 3119562
          test "$(sha256sum "$out/VF-Start-V2.47.465-FULL.zip" | cut -d ' ' -f1)" = "68791bfd1f795aeb7240509184d657b650eced5434e1ce0604114430cd71f88f"
          test "$(sha256sum "$out/VF_Start_V2.47.465_UPDATE.zip" | cut -d ' ' -f1)" = "41ece9d3fe0b3c35c59e722e9ebeabd6c25f744d91f182d413bc0cf5d7aabb22"
          unzip -t "$out/VF-Start-V2.47.465-FULL.zip" >/dev/null
          unzip -t "$out/VF_Start_V2.47.465_UPDATE.zip" >/dev/null
          echo P01_V247465_CHANNEL_REMOTE_ASSET=PASS
      - name: Public-safe conclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CHANNEL_SHA"
          echo P01_V247465_CHANNEL_INDEPENDENT_MACHINE=PASS
          echo "No channel merge, native CI waiver or Production write performed."
