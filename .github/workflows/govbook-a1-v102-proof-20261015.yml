name: GOV-BOOK A1 v1.0.2 one-off self-study native proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/govbook-a1-v102-proof-20261015.yml'
permissions:
  contents: read
jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private exact candidate transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          umask 077
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-book.git" book
          git -C book checkout -q 0ca414d78fabb9300922939bd63a02f2e5eab3a0
          git -C book fetch -q origin draft/a1-skill-book-v58-depth-20261015
          test "$(git -C book rev-parse HEAD)" = "0ca414d78fabb9300922939bd63a02f2e5eab3a0"
          echo GOVBOOK_A1_EXACT_SOURCE=PASS
      - name: Validate A1 exact lesson change and immutable ZIP resources
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,json,zipfile,subprocess
          root=pathlib.Path('book')
          sha=lambda x:hashlib.sha256(x).hexdigest()
          dist=root/'distribution/p01/books/A1'
          old,new=dist/'v1.0.1',dist/'v1.0.2'
          a=json.loads((old/'asset.json').read_text('utf-8'))
          b=json.loads((new/'asset.json').read_text('utf-8'))
          c=json.loads((root/'distribution/p01/catalog.json').read_text('utf-8'))
          src=json.loads((root/'books/A1/revisions/skill-book-v5.8-r3/SOURCE_MANIFEST.json').read_text('utf-8'))
          rows={x['book_id']:x for x in c['internal_revisions']}
          assert len(c['books'])==9 and len(c['internal_books'])==2 and len(rows)==8
          assert c['books'][0]['book_version']=='v1.0.0'
          assert rows['A1']['book_version']=='v1.0.2' and rows['C1']['book_version']=='v1.0.3'
          assert b['qualification']=='INTERNAL' and b['publication_status']=='NOT_PUBLISHED'
          assert b['base_book_version']=='v1.0.0' and b['source_commit']==src['source_commit']=='d598097fcb40f1c0711e39abd8c1351bbadd3ea5'
          assert a['book_version']=='v1.0.1'
          assert sha((old/'reader.zip').read_bytes())==a['zip']['sha256']
          assert sha((new/'cover.png').read_bytes())==b['cover']['sha256']==a['cover']['sha256']
          pack=(new/'reader.zip').read_bytes()
          assert len(pack)==b['zip']['bytes'] and sha(pack)==b['zip']['sha256']
          assert len(src['entries'])==23
          modified=[]
          with zipfile.ZipFile(new/'reader.zip') as z:
            assert z.testzip() is None
            info=z.infolist()
            assert len(info)==23 and {v.filename for v in info}=={e['name'] for e in src['entries']}
            for v in info:
              assert v.compress_type==zipfile.ZIP_STORED and v.flag_bits & 0x800
              assert v.filename.endswith('.md') and not v.filename.startswith('/')
              assert '..' not in pathlib.PurePosixPath(v.filename).parts
            for entry in src['entries']:
              name=entry['name']
              content=(root/entry['source']).read_bytes()
              assert z.read(name)==content and len(content)==entry['bytes']
              assert (zipfile.crc32(content)&0xffffffff)==int(entry['crc32'],16)
              oldname='books/A1/revisions/skill-book-v5.8-r2/p01_course/md/'+name
              previous=subprocess.check_output(['git','-C','book','show','FETCH_HEAD:'+oldname])
              if previous!=content:modified.append(name)
          assert modified==['01_第01章.md']
          chapter=(root/'books/A1/revisions/skill-book-v5.8-r3/p01_course/md/01_第01章.md').read_text('utf-8')
          assert sum(x.startswith('# ') for x in chapter.splitlines())==1
          assert 'Decision Frame' in chapter and '最小需求证据卡' in chapter
          assert 'CURRENT_STATUS' in chapter and 'EVIDENCE_STATUS' in chapter
          assert 'FIRST ATTEMPT' in chapter and 'CHANGED CASE' in chapter
          print('GOVBOOK_A1_23_MD_EXACT_SOURCE=PASS')
          print('GOVBOOK_A1_22_ORIGINAL_ONE_REVISED=PASS')
          print('GOVBOOK_A1_DO_WORKSHEET_COMPLETE=PASS')
          print('GOVBOOK_A1_ZIP_CRC_SHA256_COVER=PASS')
          print('GOVBOOK_A1_QUALIFICATION_AND_CATALOG_GUARDS=PASS')
          PY
      - name: Remove private candidate
        if: always()
        run: |
          rm -rf book
          echo PRIVATE_SOURCE_PERSISTED=NO
