name: P07 Release4 Lazy Chinese Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release4-lazy-chinese-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: bb0e268f6cc7452e8b3ea17c50df9c81f2c579b0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "bb0e268f6cc7452e8b3ea17c50df9c81f2c579b0"
          test "$(cat VERSION)" = "0.1.0"
          test "$(cat BUILD_ID)" = "0.1.0-release4"

      - name: Syntax and compile
        working-directory: source
        run: |
          set -Eeuo pipefail
          for file in bin/vfops bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-auto-backup bin/vfops-cloudpanel-ui bin/vfops-storage-setup lib/terminal_ui.sh lib/cloudpanel_ui_common.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh lib/cloudpanel_ui_admin.sh tests/smoke.sh; do
            bash -n "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in (Path("lib"), Path("tests"), Path("scripts")):
              for p in sorted(root.rglob("*.py")):
                  py_compile.compile(str(p), doraise=True)
          PY

      - name: Chinese and lazy contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          grep -Fq '高级命令说明' bin/vfops
          grep -Fq '安全边界' bin/vfops
          ! grep -Fq 'V1 commands:' bin/vfops
          grep -Fq 'ensure_rclone' bin/vfops-storage-setup
          grep -Fq '现在才按需安装' bin/vfops-storage-setup
          grep -Fq 'ensure_migration_dependencies' bin/vfops-migrate-ui
          grep -Fq '现在才按需安装' bin/vfops-migrate-ui
          grep -Fq '### 11.11 按需加载 / 安装规范' docs/authority/RPD.md
          grep -Fq 'Lazy loading / current-runtime install' docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq "P07_SHOW_MACHINE_SUMMARY" bin/vfops-site-ui
          ! grep -Fq "verify='PASS' if v.get('status') == 'PASS' else 'UNKNOWN'\\nverify_text" bin/vfops-site-ui

      - name: Terminal UI contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests.test_terminal_ui_color_contract

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Root-only auto-backup UX
        working-directory: source
        run: |
          set -Eeuo pipefail
          sudo -E env PYTHONPATH="$PWD/lib" python3 -m unittest -q tests.test_auto_backup_run_now_ux

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release4'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo "P07_RELEASE4_SOURCE=bb0e268f6cc7452e8b3ea17c50df9c81f2c579b0"
          echo "P07_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P07_PRODUCTION_DESTRUCTIVE_ACTION=NOT_RUN"
