name: temp-s01-ops-121860-release-preflight-v2-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-121860-release-preflight-v2-20260908.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      SHA: 7a0948791a69f62f603de0d187e384c279215536
      REPO: llhzx2018/vf-tools-ops
    steps:
      - name: Exact read-only release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          echo STAGE=MAIN
          actual="$(gh api repos/$REPO/branches/main --jq '.commit.sha')"; echo MAIN=$actual; test "$actual" = "$SHA"
          echo STAGE=CLONE
          rm -rf /tmp/ops-preflight
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-preflight
          git -C /tmp/ops-preflight checkout -q "$SHA"
          echo STAGE=IDENTITY
          cat /tmp/ops-preflight/VERSION
          grep -nF 'Version: 1.21.860' /tmp/ops-preflight/vf-ops.php
          grep -nF "VF_OPS_VERSION', '1.21.860" /tmp/ops-preflight/vf-ops.php
          echo STAGE=OWNER
          find /tmp/ops-preflight/assets/css/current -maxdepth 1 -type f -name '*top*domain*' -print
          grep -nF 'admin-top-domains-visible-v3.css' /tmp/ops-preflight/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          echo STAGE=TESTS
          php /tmp/ops-preflight/tests/top-domains-visible-ui-contract.php
          for t in dashboard-visible-ui-contract.php admin-human-language-contract.php system-components-human-language-contract.php update-refresh-policy-current-contract.php visible-console-v2-contract.php; do echo TEST=$t; php "/tmp/ops-preflight/tests/$t"; done
          echo STAGE=COUNT
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/ops-preflight'); rows=[]
          for top in ('assets','includes'):
              rows.extend(p for p in (root/top).rglob('*') if p.is_file())
          rows.extend([root/'uninstall.php',root/'vf-ops.php'])
          print('RUNTIME_FILES='+str(len(rows)))
          print('NEW_OWNER='+str((root/'assets/css/current/admin-top-domains-visible-v3.css').is_file()))
          PY
          echo PASS_S01_C02_121860_RELEASE_PREFLIGHT_V2
