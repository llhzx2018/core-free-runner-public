name: P07 V0.1.0 One-shot Release Publish

on:
  push:
    branches: [release/p07-v0.1.0-publish]
    paths:
      - '.github/workflows/p07-v010-one-shot-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_PUBLIC_MAIN: c2e36f9d7b735259fb5cf9f92226d590692cbd8e
      SOURCE_MAIN: 2aa67c64a317ea9d66371eed3bda9027e476eae5
      TAG: p07-v0.1.0
    steps:
      - name: Verify exact public main
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')"
          test "$actual" = "$EXPECTED_PUBLIC_MAIN"
          echo "P07_RELEASE_PUBLIC_MAIN=PASS"

      - name: Publish idempotent P07 V0.1.0 release
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "P07_RELEASE_ALREADY_EXISTS=PASS"
            exit 0
          fi

          cat > /tmp/p07-release-notes.md <<EOF
# P07 · VF Server Ops V0.1.0

P07 V0.1.0 is the first final four-slot integrated release.

## Unified Toolbox

1. Network Node / V2Ray
2. VPS Audit
3. CloudPanel Backup / Restore / Full-server Migration
4. System Care / Security

## Install / Run

```bash
bash <(curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh)
```

Slot 3 stable runtime:
- VF Server Ops 0.1.0
- build 0.1.0-release1
- full-server migration integrated
- transactional stable installer

Slot 4:
- System Care RC15
- 1C/2GB Balanced Production Verified
- 2C/4GB Balanced remains Candidate

Safety boundaries remain:
- no automatic DNS cutover
- no automatic SOURCE deletion
- no existing TARGET overwrite
- Resource Safe Apply is not auto-run

Engineering truth:
- source main: `$SOURCE_MAIN`
- public distribution main: `$EXPECTED_PUBLIC_MAIN`
EOF

          gh release create "$TAG"             --repo "${{ github.repository }}"             --target "$EXPECTED_PUBLIC_MAIN"             --title "P07 · VF Server Ops V0.1.0"             --notes-file /tmp/p07-release-notes.md

          echo "P07_RELEASE_CREATE=PASS"

      - name: Read back release
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="$(gh release view "$TAG" --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          test "$tag" = "$TAG"
          echo "P07_RELEASE_READBACK=PASS"
