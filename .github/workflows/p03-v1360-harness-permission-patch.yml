name: P03 V1.36.0 Disposable Fixture Ownership Patch
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: dec5f4e951a2826b20493add27a3eea626f4c29c
    steps:
      - name: Patch only Runner fixture ownership handoff
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/integration/v1360_formal_runtime_gate.sh')
          s=p.read_text(encoding='utf-8')
          anchor='grep -Eq \'^HTTP/.* 302|^HTTP/.* 303\' "$RUNNER_TEMP/v1360-setup-post.txt"\n'
          insert='sudo chown -R "$(id -u):$(id -g)" "$DATA_ROOT"\n'
          assert s.count(anchor)==1, 'SETUP_POST_ANCHOR_MISMATCH'
          assert insert not in s
          p.write_text(s.replace(anchor,anchor+insert,1),encoding='utf-8')
          PY
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          test "$(git status --short | wc -l)" -eq 1
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add tests/integration/v1360_formal_runtime_gate.sh
          git commit -m 'test(v1.36.0): hand disposable private fixture back to runner'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
