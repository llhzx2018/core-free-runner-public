name: P01 D73 exact-source synthetic old-tree relocation safety
on:
  push:
    branches:
      - test/p01-d73-relocation-exact-20261114
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  isolated-synthetic-relocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Confirm bounded public-safe proof route
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d73-relocation-exact-20261114"
          test ! -e candidate
          echo "P01_D73_SCOPE=TEMPORARY_SYNTHETIC_ONLY"
          echo "P01_D73_OWNER_DATA_AND_PRODUCTION=NOT_ACCESSED"
      - name: Checkout exact private source with runtime secret only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4932e5a211ff30d6d1c04202374c18b756b351cd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify exact product bytes and limited dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "4932e5a211ff30d6d1c04202374c18b756b351cd"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/runtime/SyntheticCloudPanelTreeRelocation.php
          test -f candidate/tests/compatibility/laravel/run_d73_synthetic_cloudpanel_relocation.php
          command -v php
          php -v | head -n 1
          echo "P01_D73_EXACT_PRIVATE_HEAD=4932e5a211ff30d6d1c04202374c18b756b351cd"
      - name: PHP source and synthetic relocation positives and negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/runtime/SyntheticCloudPanelTreeRelocation.php
          php -l candidate/src/app/next/runtime/CloudPanelManualHandoff.php
          php -l candidate/tests/compatibility/laravel/run_d73_synthetic_cloudpanel_relocation.php
          python3 -m py_compile candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py
          P01_D73_SYNTHETIC_ONLY=YES php candidate/tests/compatibility/laravel/run_d73_synthetic_cloudpanel_relocation.php
          echo "P01_D73_SYNTHETIC_RELOCATION_EXACT_SOURCE=PASS"
      - name: Previous CloudPanel maintenance source and local HTTP negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          P01_MANUAL_HANDOFF_SIMULATED=YES php candidate/tests/compatibility/laravel/run_cloudpanel_manual_handoff.php
          python3 candidate/tests/compatibility/laravel/verify_cloudpanel_handoff_http.py
          echo "P01_D73_MAINTENANCE_HTTP_SOURCE_REGRESSION=PASS"
          echo "P01_D77_PRIVATE_SAFE_MAINTENANCE_AND_OLD_REFUSAL=PASS"
      - name: Remove all transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          echo "P01_D73_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D73_NO_PRIVATE_ARTIFACTS=YES"

  authentic-v515-private-failback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify bounded D77 exact source and private runtime capabilities
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-d73-relocation-exact-20261114"
          test -n "$PRIVATE_READ"
          echo "P01_D77_OWNER_DATA=NONE"
      - name: Checkout exact private P01 development SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4932e5a211ff30d6d1c04202374c18b756b351cd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Prove exact source and bound v515 to v516 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "4932e5a211ff30d6d1c04202374c18b756b351cd"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          python3 -m py_compile candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py
          echo "P01_D77_EXACT_PRODUCT_SHA=4932e5a211ff30d6d1c04202374c18b756b351cd"
      - name: Install native PHP 8.3 SQLite and locked Laravel conversion deps
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/d77-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            php8.3-cli php8.3-sqlite3 php8.3-curl php8.3-mbstring php8.3-zip \
            composer >> "$RUNNER_TEMP/d77-apt.txt" 2>&1
          test "$(php8.3 -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "8.3"
          php8.3 -m | grep -Fxi pdo_sqlite
          php8.3 -l candidate/src/app/next/runtime/CloudPanelManualHandoff.php
          php8.3 -l candidate/src/app/next/runtime/SyntheticCloudPanelTreeRelocation.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d69_official_full_site_archive.php
          php8.3 -l candidate/tests/compatibility/laravel/run_d66_official_release_to_future_clone.php
          composer install --working-dir=candidate/src/app/next --no-dev \
            --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins \
            > "$RUNNER_TEMP/d77-composer.txt" 2>&1
          test -s candidate/src/app/next/vendor/autoload.php
          echo "P01_D77_REAL_NATIVE_V515_RESTORE_RUNTIME=PASS"
      - name: Authenticate official GitHub v515 FULL bytes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/d77-official"
          gh release download v2.47.515 --repo llhzx2018/vf-start \
            --pattern VF-Start-V2.47.515-FULL.zip \
            --dir "$RUNNER_TEMP/d77-official" \
            > "$RUNNER_TEMP/d77-download.txt" 2>&1
          file="$RUNNER_TEMP/d77-official/VF-Start-V2.47.515-FULL.zip"
          test -s "$file"
          test "$(stat -c '%s' "$file")" = "1802482"
          echo "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778  $file" | sha256sum -c --status
          echo "P01_D77_OFFICIAL_IMMUTABLE_V515_ASSET=PASS"
      - name: Authentic installed v515 entire tree plus D69 D73 interrupted relocation and full restore
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! P01_D65_OFFICIAL_ASSET_ISOLATED=YES python3 \
            candidate/tests/compatibility/laravel/run_d65_official_v515_full_restore.py \
              --release-full "$RUNNER_TEMP/d77-official/VF-Start-V2.47.515-FULL.zip" \
              --candidate-root candidate --archive-full-old-site \
              > "$RUNNER_TEMP/d77-results.txt" 2>&1; then
            grep -E '^P01_D(65|66|69|73)_' "$RUNNER_TEMP/d77-results.txt" \
              | tail -n 35 | cut -c1-170 || true
            exit 1
          fi
          for marker in \
            P01_D65_OFFICIAL_FULL_ASSET_HASH_SIZE_AND_LAYOUT=PASS \
            P01_D65_REAL_OLD_RELEASE_HTTP_CSRF_INSTALL_SETUP_LOCK=PASS \
            P01_D69_COMPLETE_SCOPE_ARCHIVE_AND_NEGATIVES=PASS \
            P01_D65_REAL_V515_WHOLE_TREE_D73_RELOCATION_AND_RESTORE=PASS \
            P01_D65_ACTUAL_OLD_SITE_CODE_DATA_CONFIG_MEDIA_RESTORED=PASS \
            P01_D66_ACTUAL_INSTALLED_OLD_DATABASE_TO_NEW35_TABLE_CLONE=PASS \
            P01_D66_ACTUAL_OLD_MEDIA_SHA_AND_FAULT_ROLLBACK=PASS \
            P01_D65_REAL_OLD_RELEASE_INSTALL_AND_RESTORE_STAGE=PASS \
            P01_D65_REAL_CLOUDPANEL_ROOT_SWITCH_OR_PRODUCTION_READY=NO \
            P01_D65_PRODUCTION_OR_REAL_OWNER_DATA_TOUCHED=NO; do
            grep -Fx "$marker" "$RUNNER_TEMP/d77-results.txt"
          done
          echo "P01_D77_REAL_V515_COMPLETE_OLD_TREE_MAINTENANCE_HANDOFF=PASS"
      - name: Ephemeral cleanup for private source and official owner fixture
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate "$RUNNER_TEMP/d77-official"
          rm -f -- "$RUNNER_TEMP/d77-apt.txt" "$RUNNER_TEMP/d77-composer.txt" \
            "$RUNNER_TEMP/d77-download.txt" "$RUNNER_TEMP/d77-results.txt"
          echo "P01_D77_PRIVATE_SOURCE_OR_OFFICIAL_FIXTURE_PERSISTED=NO"
