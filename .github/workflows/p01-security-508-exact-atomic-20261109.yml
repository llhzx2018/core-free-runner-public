name: P01 508 exact 507-to-508 isolated FULL Atomic and BackupManager test
on:
  push:
    branches:
      - task/p01-security-508-exact-atomic-20261109
permissions:
  contents: read
concurrency:
  group: p01-security-508-isolated-atomic-20261109
  cancel-in-progress: false
jobs:
  exact-package-rollback:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_SHA: 6d70095c41e923d7917a92f51d0a127539927cc5
      VF_NEWS_R5_SANDBOX: '1'
      VF_NEWS_R5_TARGET_VERSION: '2.47.508'
    steps:
      - name: Checkout registered public-safe builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install isolated CLI, SQLite and ZIP prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-xml php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fxi pdo_sqlite
          test -f scripts/p01-maintenance-release.py
          echo P01_508_SAFE_PACKAGE_RUNTIME=PASS
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6d70095c41e923d7917a92f51d0a127539927cc5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p01-exact
          persist-credentials: false
      - name: Adapt existing R5 isolated fixture to formally released 507 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01-exact rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n ' < p01-exact/VERSION)" = '2.47.508'
          test "$(tr -d '\r\n ' < p01-exact/src/VERSION.txt)" = '2.47.508'
          grep -Fx "define('VF_VERSION', '2.47.508');" p01-exact/src/app/bootstrap.php
          test -z "$(git -C p01-exact status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          script = Path("p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh")
          s = script.read_text()
          for before, after in [
              ("FROM=2.47.505\nCANDIDATE_VERSION=2.47.506\n", "FROM=2.47.507\nCANDIDATE_VERSION=2.47.508\n"),
              ('2.99.999|2.47.506)', '2.99.999|2.47.508)'),
              ("P01_NEWS_R5_EXACT_505_TO_506_FULL_ATOMIC_BACKUP_RESTORE=PASS", "P01_508_EXACT_507_TO_508_FULL_ATOMIC_BACKUP_RESTORE=PASS"),
          ]:
              assert s.count(before) == 1, before
              s = s.replace(before,after)
          script.write_text(s)
          fixture = Path("p01-exact/tests/integration/p01_news_r5_lifecycle_native.php")
          x = fixture.read_text()
          before = "news_r5_assert(!is_file($resolved.'/news.php'),'new-news-route-removed-after-failed-atomic');"
          after = "news_r5_assert(is_file($resolved.'/news.php'),'existing-news-route-preserved-after-failed-atomic');"
          assert x.count(before) == 1
          fixture.write_text(x.replace(before,after))
          print("P01_508_DISPOSABLE_TEST_ADAPTER_ONLY=PASS")
          PY
          test "$(git -C p01-exact diff --name-only | sort)" = "$(printf '%s\n' tests/integration/p01_news_r5_atomic_package_gate.sh tests/integration/p01_news_r5_lifecycle_native.php)"
          test -z "$(git -C p01-exact diff --name-only -- src)"
          echo P01_508_EXACT_PRODUCT_RUNTIME_UNMODIFIED=PASS
      - name: Real formally released 507 FULL to 508 Atomic backup restore and forced rollback
        shell: bash
        timeout-minutes: 17
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash p01-exact/tests/integration/p01_news_r5_atomic_package_gate.sh | tee /tmp/p01-508-exact-atomic.log
          grep -Fx 'P01_508_EXACT_507_TO_508_FULL_ATOMIC_BACKUP_RESTORE=PASS' /tmp/p01-508-exact-atomic.log
          echo P01_508_SCOPE_CLEAN_FULL_ATOMIC_PRIVATE_DATA_RESTORE_AND_FAILURE_ROLLBACK=PASS
          echo P01_508_REJECTED_REAL_DISASTER_RESTART_AND_IMPORT_CHROMIUM=NOT_RUN
          echo P01_508_FORMAL_RELEASE=NOT_RUN
          echo P01_508_PRODUCTION_WRITES=NONE
      - name: Cleanup all transient private source and test files
        if: always()
        shell: bash
        run: |
          rm -rf p01-exact
          echo P01_508_PRIVATE_SOURCE_PERSISTED_PUBLIC_RUNNER=NO
