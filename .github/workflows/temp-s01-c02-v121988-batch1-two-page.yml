name: S01-C02 V1.21.988 Batch1 Two Page Source Gate

on:
  push:
    branches:
      - verify/s01-c02-v121988-batch1-two-page-closure

permissions:
  contents: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  TARGET_REF: fix/v1.21.988-batch1-two-page-closure
  BASE_SHA: 82402bfb65597355b7896e693df53b5ddfef25ef

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact source and bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RESOLVED_TARGET_SHA=$(git -C target rev-parse HEAD)"
          git -C target diff --name-only "$BASE_SHA..HEAD" | tee /tmp/changed.txt
          python3 - <<'PY'
          from pathlib import Path
          changed=set(Path('/tmp/changed.txt').read_text().splitlines())
          expected={
            'assets/css/current/admin-s01-integrations-r4.css',
            'assets/css/current/admin-s01-tools-r16.css',
            'assets/js/admin-s01-page-frame-r18.js',
            'includes/views/admin-style-helpers/admin-s01-uiux-polish.php',
            'tests/s01-c02-v9-batch1-body-contract.php',
            'tests/s01-c02-v9-batch1-browser-proof.js',
          }
          if changed != expected:
              raise SystemExit('unexpected diff: '+repr(sorted(changed)))
          print('BOUNDED_DIFF=PASS')
          PY

      - name: Contracts and lint
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-v9-batch1-body-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          php target/tests/s01-c02-prod-realuse-r20-production-screenshot-closure-contract.php
          php target/tests/s01-c02-page-body-system-v2-full-surface-contract.php
          docker run --rm -v "$PWD/target:/src:ro" -w /src php:8.2-cli sh -lc 'php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null && php -l tests/s01-c02-v9-batch1-body-contract.php >/dev/null'
          node --check target/assets/js/admin-s01-page-frame-r18.js
          node --check target/tests/s01-c02-v9-batch1-browser-proof.js
          echo 'CONTRACTS_LINT=PASS'

      - name: Real-cascade responsive browser proof
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/v9-node evidence
          cd /tmp/v9-node
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE/target"
          export NODE_PATH=/tmp/v9-node/node_modules
          export V9_PROOF_DIR="$GITHUB_WORKSPACE/evidence/v9-proof"
          node tests/s01-c02-v9-batch1-browser-proof.js | tee "$GITHUB_WORKSPACE/evidence/v9-browser-output.txt"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ['GITHUB_WORKSPACE'],'evidence/v9-proof/browser-proof.json')))
          assert p['pass'] is True
          assert len(p['checks']) == 18
          assert all(not x['failures'] for x in p['checks'])
          assert all(not x['overflow'] for x in p['checks'])
          tools=[x for x in p['checks'] if x['kind']=='tools']
          ints=[x for x in p['checks'] if x['kind']=='integrations']
          assert len(tools)==6 and len(ints)==6
          print('RESPONSIVE_18=PASS')
          print('TOOLS_FINAL_BODY=PASS')
          print('INTEGRATIONS_FINAL_BODY=PASS')
          PY

      - name: Frozen shell boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changed=Path('/tmp/changed.txt').read_text().splitlines()
          forbidden=('includes/admin-v13/shell','includes/s01/admin-shell','assets/css/current/admin-s01-v6-shell-r1.css')
          if any(any(x in p for x in forbidden) for p in changed):
              raise SystemExit('frozen shell/header/menu touched')
          for p in [
              Path('target/assets/css/current/admin-s01-integrations-r4.css'),
              Path('target/assets/css/current/admin-s01-tools-r16.css'),
          ]:
              s=p.read_text()
              for selector in ('.vf-v6-shell-header','.vf-v6-domain-nav','.vf-v6-domain-menu','.vf-v8-product-shell'):
                  if selector in s:
                      raise SystemExit(f'frozen selector touched in {p}: {selector}')
          print('FROZEN_SHELL_HEADER_MENU=PASS')
          PY

      - name: Final
        shell: bash
        run: echo 'S01-C02 V1.21.988 BATCH1 TWO PAGE SOURCE GATE PASS'
