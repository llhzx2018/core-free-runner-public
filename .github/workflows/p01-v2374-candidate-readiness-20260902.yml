name: P01 V2.37.4 Candidate Readiness
on:
  push:
    branches: [release/p01-v2374-hotfix-20260902]
    paths:
      - .github/workflows/p01-v2374-candidate-readiness-20260902.yml
permissions:
  actions: read
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE: b3fd44a44d937f1a990e8e1ebd8d20fa21c67e1c
      CANDIDATE_TREE: 79278ffd39a05fd82bacd758189c452e08a6b63f
      CANDIDATE_RUNTIME_TREE: 369f24a5320b9c7ebbb950a06c2711b8ca3b4f93
      HOTFIX: 84230316c9a0d64371f65eb461460a1cf1cc40e8
      MAIN: 740610e6529dbc0997af3112d83c0aa95bd8d0ac
      SOURCE: cec95e310771feb6813a51c7ee3340884295ee38
      SOURCE_TREE: 8fc025e93aaf730414e70a3fcbdc6d43fe954653
      SOURCE_RUNTIME_TREE: e56459ebadc120c749cc5336821d762001db5218
      VERSION: 2.37.4
      SOURCE_VERSION: 2.37.3
      SCHEMA: '2026082901'
      OUT: /tmp/p01-v2374-candidate-artifacts
      EVID: /tmp/p01-v2374-candidate-evidence
      UPGRADE: /tmp/p01-v2374-upgrade
      FRESH: /tmp/p01-v2374-fresh
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/p01-v2374-hotfix-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2373-hotfix-20260902
          path: prior
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0fe72c7981f5f2b6ddd51bf4cfa5d6c014c9b0d3
          path: template
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: agent/p01-22121-formal-artifact-gate-20260819
          path: proven
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: v2.37.3
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - name: Verify prior evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33603764352 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33603844441 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33604150610 --jq .conclusion)" = success
          printf 'HOTFIX_R1=HARNESS_ONLY\nHOTFIX_R2=PASS_IYF_3_OF_3\nSTAGE=PASS\n' | tee "$EVID/prior-gates.txt"
      - name: Generate V2.37.4 readiness gates from proven V2.37.3 template
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('prior/scripts/p01_v2373_candidate_readiness_generate.py').read_text(encoding='utf-8')
          s=s.replace('2.37.2','__SOURCE_VERSION__')
          s=s.replace('2.37.3','2.37.4').replace('V2.37.3','V2.37.4').replace('v2.37.3','v2.37.4')
          s=s.replace('__SOURCE_VERSION__','2.37.3')
          s=s.replace('p01-v2373','p01-v2374').replace('P01_V2373','P01_V2374').replace('v2_37_3','v2_37_4')
          s=s.replace('vf-cover-retry:v4:','vf-cover-retry:v5:')
          Path('/tmp/p01_v2374_generate.py').write_text(s,encoding='utf-8')
          PY
          python3 /tmp/p01_v2374_generate.py
      - name: Exact source fence
        run: bash /tmp/p01-v2374-generated/01-exact.sh
      - name: Cover negotiation security boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'image/webp,image/png,image/jpeg,image/gif,image/*;q=0.8,*/*;q=0.1' candidate/src/app/ResourceCoverCache.php >/dev/null
          ! grep -F 'image/avif,image/webp,image/png,image/jpeg,image/*;q=0.8,*/*;q=0.1' candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F "'image/gif'=>'gif'" candidate/src/app/ResourceCoverCache.php >/dev/null
          grep -F 'vf-cover-retry:v5:' candidate/src/assets/workspace.js >/dev/null
          grep -F "\$extMap = ['image/webp'=>'webp','image/jpeg'=>'jpg','image/png'=>'png'];" candidate/src/app/ResourceAssetStore.php >/dev/null
          printf 'AVIF_ADVERTISED=NO\nREMOTE_VALIDATOR=PNG_JPEG_WEBP_GIF\nMANUAL_UPLOAD=WEBP_JPG_PNG\nRETRY_REVISION=v5\n' | tee "$EVID/cover-negotiation.txt"
      - name: Build deterministic candidate artifacts
        run: bash /tmp/p01-v2374-generated/02-build.sh
      - name: Actual V2.37.3 to V2.37.4 Atomic upgrade
        run: bash /tmp/p01-v2374-generated/03-atomic.sh
      - name: Strict fresh candidate runtime
        run: bash /tmp/p01-v2374-generated/04-fresh.sh
      - name: True IYF first-attempt E2E
        shell: bash
        run: |
          EVID="$EVID" bash prior/scripts/p01_v2373_candidate_iyf_e2e.sh
          python3 - "$EVID/iyf-e2e.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1],encoding='utf-8') if x.strip().startswith('{')]
          assert len(rows)==3 and all(x['result'].get('success') is True for x in rows), rows
          assert all(x['record']['mime'] in ('image/gif','image/webp','image/jpeg','image/png') for x in rows), rows
          print('P01_V2374_IYF_FIRST_ATTEMPT=3/3 PASS')
          PY
      - name: Final candidate verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat candidate/VERSION)" = 2.37.4
          jq -e '.production_version=="2.37.3" and .published_release.version=="2.37.3" and .production_release.version=="2.37.3" and .candidate_version=="2.37.4" and .current_change.release_authorized_by_owner==true' candidate/VF_PROJECT.json >/dev/null
          printf 'P01_V2374_CANDIDATE_READINESS=PASS\nCANDIDATE=%s\nTREE=%s\nRUNTIME_TREE=%s\nSOURCE=%s\nSCHEMA=%s\nATOMIC_2373_TO_2374=PASS\nFRESH_INSTALL=PASS\nIYF_FIRST_ATTEMPT=3/3\nAVIF_ADVERTISED=NO\nMANUAL_UPLOAD_UNCHANGED=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$CANDIDATE" "$CANDIDATE_TREE" "$CANDIDATE_RUNTIME_TREE" "$SOURCE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2374-candidate-readiness-${{ github.run_id }}
          path: |
            /tmp/p01-v2374-candidate-artifacts
            /tmp/p01-v2374-candidate-evidence
          if-no-files-found: warn
          retention-days: 90
