name: TEMP P07 M03 D04 SQL-catalog exact-source tests
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-d04-sql-catalog-20261123.yml'
permissions:
  contents: read
jobs:
  test:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'test/p07-m03-d04-sql-catalog-oneoff-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      TARGET_SHA: '42fb2e6107dffbe64ca7f7a5739f0662d1968e83'
      TARGET_BASE: 'fd113376cf8e44c6a3bc00fbe47f34c2a354726a'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - name: Temporary private checkout at exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: .p07-private-product
      - name: Execute scoped safe synthetic tests and UX gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          product="$GITHUB_WORKSPACE/.p07-private-product"
          [[ "$(git -C "$product" rev-parse HEAD)" == "$TARGET_SHA" ]]
          git -C "$product" merge-base --is-ancestor "$TARGET_BASE" "$TARGET_SHA"
          cd "$product"
          check() {
            local label="$1"
            shift
            if "$@" > "$RUNNER_TEMP/p07-m03-d04-scoped.log" 2>&1; then
              echo "$label=PASS"
            else
              echo "$label=FAIL"
              exit 1
            fi
          }
          check SQL_CATALOG_TESTS python3 -B -m unittest -q tests.test_p07_m03_cloudpanel_sql_probe
          check BATCH_GUARD_TESTS python3 -B -m unittest -q tests.test_p07_m03_safe_batch
          check FULL_VPS_UX_TESTS python3 -B -m unittest -q tests.test_p07_m03_safe_batch_terminal_ux
          check MODULE_ISOLATION python3 -B scripts/check_p07_modules.py
          check UX_REVIEW python3 -B scripts/check_p07_terminal_ux.py --base-ref "$TARGET_BASE"
          echo P07_M03_D04_ONEOFF_DEV_MACHINE_PROOF=PASS
      - name: Erase private candidate and local test log even on failure
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private-product"
          rm -f -- "$RUNNER_TEMP/p07-m03-d04-scoped.log"
          echo EPHEMERAL_PRIVATE_CLEANUP=COMPLETE
