name: TEMP S01-C02 Ops 1.21.849 Formal Release Pre-Gate

on:
  push:
    branches:
      - temp/s01-c02-v121849-formal-release-gate-20260906
    paths:
      - '.github/workflows/temp-s01-c02-v121849-formal-release-gate.yml'

permissions:
  contents: read
  actions: read

env:
  TARGET_REPOSITORY: llhzx2018/vf-tools-ops
  BASE_RELEASE_COMMIT: 7f0f6808c7a9fa076c58cf87776666fbdf38be6d
  TARGET_COMMIT: ca87ee6a6dd1139dab6fe33f20b64d537b1a2b20
  TARGET_TREE: 9ecefb081daf8a8563746601522678d8f93e67f8
  CANDIDATE_GATE_RUN: '34030876496'
  CANDIDATE_GATE_RUNNER_SHA: 82c6ca49ccf18951dab6866d2f69cb01da557526
  BASE_ASSET_BYTES: '3325498'
  BASE_ASSET_SHA256: 930adaf339fc1e47dfb84c056d548f5ca818cf5233eefc60d71c48b26570bfdc
  VERSION: 1.21.849
  TAG: v1.21.849
  ASSET_NAME: vf-tools-ops_V1.21.849.zip

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify prior Candidate Gate PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          JSON="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/${CANDIDATE_GATE_RUN}")"
          test "$(jq -r '.status' <<<"$JSON")" = completed
          test "$(jq -r '.conclusion' <<<"$JSON")" = success
          test "$(jq -r '.head_sha' <<<"$JSON")" = "$CANDIDATE_GATE_RUNNER_SHA"
          echo CANDIDATE_GATE=PASS

      - name: Checkout exact v849 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops

      - name: Verify source identity and current main boundary
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.849' ops/vf-ops.php
          MAIN_JSON="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/branches/main")"
          test "$(jq -r '.commit.sha' <<<"$MAIN_JSON")" = "$BASE_RELEASE_COMMIT"
          echo MAIN_STILL_V848=PASS

      - name: Verify bounded release delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C ops diff --name-only "$BASE_RELEASE_COMMIT" "$TARGET_COMMIT" | sort >/tmp/changed-files.txt
          cat >/tmp/expected-files.txt <<'EOF'
          .github/phase3/r6-static-token-integrity.php
          VERSION
          includes/cf-release/checker-html-parts/04-residue-target.php
          includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php
          includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php
          vf-ops.php
          EOF
          diff -u /tmp/expected-files.txt /tmp/changed-files.txt
          cmp <(git -C ops show "$BASE_RELEASE_COMMIT":includes/release/builders/class-candidate-entry-processor.php) ops/includes/release/builders/class-candidate-entry-processor.php
          cmp <(git -C ops show "$BASE_RELEASE_COMMIT":includes/release/builders/class-candidate-route-normalizer.php) ops/includes/release/builders/class-candidate-route-normalizer.php
          cmp <(git -C ops show "$BASE_RELEASE_COMMIT":includes/site-release/final-domain-authority.php) ops/includes/site-release/final-domain-authority.php
          echo RELEASE_DELTA_BOUNDARY=PASS

      - name: Run exact source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/vf-ops.php
          php -l ops/includes/cf-release/repair-core-parts/cleanup-parts/02-shadow-terms.php
          php -l ops/includes/cf-release/repair-core-parts/cleanup-parts/03-public-residue.php
          php -l ops/includes/cf-release/checker-html-parts/04-residue-target.php
          php ops/.github/phase3/r6-static-token-integrity.php | tee /tmp/token.txt
          grep -Fxq PASS_R6_STATIC_TOKEN_INTEGRITY /tmp/token.txt
          echo SOURCE_CONTRACTS=PASS

      - name: Calibrate v848 and build deterministic v849 release artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          mkdir -p /tmp/base-source /tmp/candidate-source /tmp/base-runtime /tmp/candidate-runtime /tmp/release
          git -C ops archive "$BASE_RELEASE_COMMIT" | tar -x -C /tmp/base-source
          git -C ops archive "$TARGET_COMMIT" | tar -x -C /tmp/candidate-source
          python3 - <<'PY'
          import re, shutil, hashlib, zipfile, json, os
          from pathlib import Path
          def runtime_files(root_path,out_path):
              root=Path(root_path); out=Path(out_path); files={}
              def ok(rel):
                  p=rel.as_posix(); parts=p.split('/')
                  if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in parts): return False
                  if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
                  if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
                  return parts[0] in {'includes','assets','languages','config'}
              for src in root.rglob('*'):
                  if src.is_file() and not src.is_symlink():
                      rel=src.relative_to(root)
                      if ok(rel):
                          dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copyfile(src,dst)
                          files[rel.as_posix()]=src.read_bytes()
              return dict(sorted(files.items()))
          def identity(files):
              fp=hashlib.sha256()
              for rel,b in files.items(): fp.update((rel+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
              return len(files),fp.hexdigest()
          def build_zip(files,zpath):
              zpath=Path(zpath)
              with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for rel,b in files.items():
                      zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,6,0,0,0)); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,b)
              return zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest()
          base=runtime_files('/tmp/base-source','/tmp/base-runtime')
          base_count,base_fp=identity(base)
          base_bytes,base_sha=build_zip(base,'/tmp/base-release.zip')
          print('BASE',base_count,base_fp,base_bytes,base_sha)
          assert base_bytes==int(os.environ['BASE_ASSET_BYTES']), (base_bytes,os.environ['BASE_ASSET_BYTES'])
          assert base_sha==os.environ['BASE_ASSET_SHA256'], (base_sha,os.environ['BASE_ASSET_SHA256'])
          cand=runtime_files('/tmp/candidate-source','/tmp/candidate-runtime')
          count,fp=identity(cand)
          assert count==base_count,(count,base_count)
          assert sorted(set(cand)-set(base))==[]
          assert sorted(set(base)-set(cand))==[]
          zpath='/tmp/release/'+os.environ['ASSET_NAME']
          asset_bytes,asset_sha=build_zip(cand,zpath)
          meta={'target_commit':os.environ['TARGET_COMMIT'],'target_tree':os.environ['TARGET_TREE'],'version':os.environ['VERSION'],'asset_name':os.environ['ASSET_NAME'],'asset_bytes':asset_bytes,'asset_sha256':asset_sha,'runtime_files':count,'runtime_fingerprint':fp,'base_runtime_files':base_count,'base_runtime_fingerprint':base_fp,'packaging_calibration':'PASS','candidate_gate_run':int(os.environ['CANDIDATE_GATE_RUN'])}
          Path('/tmp/artifact-identity.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY
          unzip -tq "/tmp/release/$ASSET_NAME" >/dev/null
          echo V848_PACKAGING_CALIBRATION=PASS
          echo EXACT_V849_ARTIFACT_BUILD=PASS

      - name: Verify release absence and fail closed state
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(curl -sS -o /tmp/tag.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}")" = 404
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${TARGET_REPOSITORY}/releases/tags/${TAG}")" = 404
          grep -Fq "finalOnlinePass'=>'NO'" ops/includes/site-release/s01-static-candidate-readiness.php
          echo RELEASE_ABSENCE=PASS
          echo FINAL_ONLINE_STILL_FAIL_CLOSED=PASS
          echo PASS_V121849_FORMAL_RELEASE_PRE_GATE
