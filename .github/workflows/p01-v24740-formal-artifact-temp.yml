name: p01-v24740-formal-artifact-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24740-formal-artifact-temp.yml'
      - 'requests/p01-v24740-formal-artifact-20260922.json'

permissions:
  contents: read

jobs:
  formal-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-v24740-formal-artifact-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Checkout exact V2.47.40 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$target_version"
          echo P01_V24740_RELEASE_SOURCE=PASS

      - name: Download V2.47.39 formal baseline assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel39
          gh release download v2.47.39 -R llhzx2018/vf-start -D /tmp/p01-rel39             -p 'VF-Start-V2.47.39-FULL.zip'             -p 'VF_Start_V2.47.39_UPDATE.zip'
          sha256sum /tmp/p01-rel39/*.zip
          echo "FULL_ENTRIES=$(unzip -Z1 /tmp/p01-rel39/VF-Start-V2.47.39-FULL.zip | wc -l)"
          echo "UPDATE_ENTRIES=$(unzip -Z1 /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip | wc -l)"
          unzip -Z1 /tmp/p01-rel39/VF-Start-V2.47.39-FULL.zip | head -n 40
          echo '---UPDATE---'
          unzip -Z1 /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip
          mkdir -p /tmp/p01-rel39/update
          unzip -q /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip -d /tmp/p01-rel39/update
          REPAIR=$(find /tmp/p01-rel39/update -maxdepth 2 -type f -name 'repair-v2.47.39.php' -print -quit)
          test -n "$REPAIR"
          grep -E "SOURCE_VERSION|TARGET_VERSION|TARGET_SCHEMA" "$REPAIR" | head -n 6
          echo P01_V24739_FORMAL_BASELINE_READBACK=PASS
