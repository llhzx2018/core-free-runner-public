name: p01-v24740-formal-artifact-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24740-formal-artifact-temp.yml'
      - 'requests/p01-v24740-formal-artifact-20260922.json'

permissions:
  contents: read

jobs:
  formal-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-v24740-formal-artifact-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Checkout exact V2.47.40 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: fix/p01-v24740-release-test-contracts
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Verify exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$target_version"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$target_version"
          echo P01_V24740_RELEASE_SOURCE=PASS

      - name: Download V2.47.39 formal baseline assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel39
          gh release download v2.47.39 -R llhzx2018/vf-start -D /tmp/p01-rel39             -p 'VF-Start-V2.47.39-FULL.zip'             -p 'VF_Start_V2.47.39_UPDATE.zip'
          sha256sum /tmp/p01-rel39/*.zip
          echo "FULL_ENTRIES=$(unzip -Z1 /tmp/p01-rel39/VF-Start-V2.47.39-FULL.zip | wc -l)"
          echo "UPDATE_ENTRIES=$(unzip -Z1 /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip | wc -l)"
          unzip -Z1 /tmp/p01-rel39/VF-Start-V2.47.39-FULL.zip | head -n 40
          echo '---UPDATE---'
          unzip -Z1 /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip
          mkdir -p /tmp/p01-rel39/update
          unzip -q /tmp/p01-rel39/VF_Start_V2.47.39_UPDATE.zip -d /tmp/p01-rel39/update
          REPAIR=$(find /tmp/p01-rel39/update -maxdepth 2 -type f -name 'repair-v2.47.39.php' -print -quit)
          test -n "$REPAIR"
          grep -E "SOURCE_VERSION|TARGET_VERSION|TARGET_SCHEMA" "$REPAIR" | head -n 6
          echo P01_V24739_FORMAL_BASELINE_READBACK=PASS
          echo '---FULL METADATA---'
          mkdir -p /tmp/p01-rel39/full
          unzip -q /tmp/p01-rel39/VF-Start-V2.47.39-FULL.zip -d /tmp/p01-rel39/full
          printf 'VERSION='; tr -d '\r\n ' </tmp/p01-rel39/full/VERSION.txt; echo
          printf 'FULL_NOTES='; head -n 1 /tmp/p01-rel39/full/FULL-PACKAGE-NOTES.txt
          php -r '$m=json_decode(file_get_contents("/tmp/p01-rel39/full/release-manifest.json"),true); echo json_encode(["version"=>$m["version"]??null,"source_commit"=>$m["source_commit"]??null,"source_tree"=>$m["source_tree"]??null,"source_version"=>$m["source_version"]??null,"schema_version"=>$m["schema_version"]??null,"runtime_hashed_file_count"=>$m["runtime_hashed_file_count"]??null],JSON_UNESCAPED_SLASHES),"\n";'
          grep -E "private const (SOURCE_MANIFEST|TARGET_MANIFEST|PAYLOAD|REMOVED|SOURCE_ALTERNATES)" "$REPAIR" | sed -E "s/='[^']+';/='<REDACTED_BYTES>';/"


      - name: Prepare formal runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Checkout exact V2.47.39 stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.39
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: stable

      - name: Canonical release regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C stable rev-parse HEAD)" = "761fb624c62e9ec16fe33e5f2f1e9f2c27738963"
          bash candidate/tests/canonical_release_regression.sh candidate stable | tee /tmp/p01-v24740-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-v24740-canonical.txt
          echo P01_V24740_CANONICAL_RELEASE_REGRESSION=PASS

      - name: Restore clean exact source after regression
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate reset --hard "$target_sha"
          git -C candidate clean -ffdx
          test "$(git -C candidate rev-parse HEAD)" = "$target_sha"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$target_tree"
          test -z "$(git -C candidate status --porcelain)"
          test ! -e candidate/src/.vfnav-data-pending
          echo P01_V24740_POST_REGRESSION_SOURCE_CLEAN=PASS

      - name: Build and verify formal FULL and ATOMIC
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24740_formal_gate.sh

      - name: Upload V2.47.40 formal candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24740-formal-candidate
          path: /tmp/p01-v24740-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Formal artifact receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          cat /tmp/p01-v24740-artifacts/P01_V24740_ARTIFACT_RECEIPT.json
          echo P01_V24740_FORMAL_MACHINE_READY=PASS
