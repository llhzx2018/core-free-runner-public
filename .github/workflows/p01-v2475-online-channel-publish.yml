name: P01 V2.47.5 Online Channel Publish

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2475-online-channel-publish.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2475-online-channel-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.head_ref == 'temp/p01-v2475-online-channel-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P01_REPO: llhzx2018/vf-start
      P01_MAIN_BEFORE: caf6994d2689fc30d52cd12d71f82310f4fb2d2b
      PREVIEW_SHA: 55be083da7263fef21b850ca11e7c167cb6b5cf4
      PREVIEW_TAG: v2.47.5-preview.1
      STABLE_TAG: v2.47.5
      CORE_REPO: llhzx2018/core-updates
      CORE_MAIN_BEFORE: c625781ebcc408d89bfb3e25f6c49f8062da15e6
      UPDATE_NAME: VF_Start_V2.47.5_UPDATE.zip
      UPDATE_BYTES: '1818069'
      UPDATE_SHA256: 136c1bf66e1bde876676f3ea5a38301d6e7727248efa5272b0934f6d931f5ed8
      FULL_NAME: VF-Start-V2.47.5-FULL.zip
      FULL_BYTES: '852918'
      FULL_SHA256: 4a7ecf4d3491d0047e8692edc668151e5c2da369217c715f2d9f886533d1452e
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact authority preview and channel source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$P01_MAIN_BEFORE"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/release/v2.47.5-preview-20260910" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/releases/tags/${PREVIEW_TAG}" --jq '.prerelease')" = true
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$CORE_MAIN_BEFORE"
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" >/dev/null 2>&1; then
            echo 'PUBLISH_BLOCK=STABLE_TAG_ALREADY_EXISTS'
            exit 81
          fi
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/p01-channel-before.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p01-channel-before.json',encoding='utf-8'))
          assert p['project_id']=='P01'
          assert p['current_version']=='2.47.3'
          assert p['target_version']=='2.47.4'
          assert p['from_versions']==['2.47.3']
          assert p['release_tag']=='v2.47.4'
          assert p['release_id']==386648208
          assert p['product_identity']=='f24b01af34b173aef3ae6a7ecb5489aa6df19cc8'
          assert p['asset_name']=='VF_Start_V2.47.4_UPDATE.zip'
          assert p['asset_bytes']==1817545
          assert p['asset_sha256']=='d0d50657c3b7069054f51d92e73ecec263f7de6441fefeeeacffcbbcb4e81562'
          assert p['schema_from']=='2026090401' and p['schema_to']=='2026090401'
          print('P01_V2475_CHANNEL_SOURCE_AUTHORITY=PASS')
          PY
          echo P01_V2475_EXACT_AUTHORITY=PASS

      - name: Checkout exact verified preview candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PREVIEW_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: vf-start

      - name: Promote exact candidate to main with changelog
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
          test "$(git rev-parse HEAD^)" = "$P01_MAIN_BEFORE"
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.5'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.5'
          grep -Fq "define('VF_VERSION', '2.47.5');" src/app/bootstrap.php
          git diff --name-only "$P01_MAIN_BEFORE" "$PREVIEW_SHA" | sort >/tmp/p01-v2475-candidate-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort >/tmp/p01-v2475-candidate-expected
          diff -u /tmp/p01-v2475-candidate-expected /tmp/p01-v2475-candidate-files
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          marker='<!-- P01_V2475_FORMAL_RELEASE_20260910:BEGIN -->'
          if marker in s:
              raise SystemExit('V2.47.5 changelog entry already exists unexpectedly')
          entry='''<!-- P01_V2475_FORMAL_RELEASE_20260910:BEGIN -->
          ## V2.47.5 · 内容优先 Shell / 导航分类侧栏收口 · 2026-09-10

          - 根据 Owner 真实使用反馈修正桌面信息架构：仅“导航”保留左侧分类树；首页、频道、影视、专题、课程、项目、工具、软件不再为共享侧栏永久占宽。
          - 非导航页统一进入 content-first / full-width shell；顶部九入口继续作为跨产品切换 Authority，各页面筛选和操作继续留在自身内容区。
          - 导航 `.surface-start` 分类侧栏由 acceptance contract 显式保护，避免后续优化误删；移动端同步清理非导航页无效侧栏/底部占位与横向溢出。
          - 数据、Schema、Migration、Updater、Auth 与 canonical Data Authority 均未改变；Schema `2026090401 -> 2026090401`，Migration `NONE`。
          - 在线更新严格单跳 `V2.47.4 -> V2.47.5`；Preview Candidate `55be083da7263fef21b850ca11e7c167cb6b5cf4`。
          - Exact Candidate UA/UI Machine：Runner `34555855409` PASS；FULL / ATOMIC UPDATE / 数据保留 / 安全 / 远端字节：Runner `34556157622` PASS。
          - Formal Release / core-updates Channel Published 不代表 Production 已升级；Production 仍需实际后台升级后另行验证。
          <!-- P01_V2475_FORMAL_RELEASE_20260910:END -->

          '''
          p.write_text(entry+s,encoding='utf-8')
          PY
          test "$(git diff --name-only)" = 'CHANGELOG.md'
          git diff --check
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m 'release(P01): publish V2.47.5 changelog'
          FORMAL_SHA="$(git rev-parse HEAD)"
          test "$(git diff --name-only "$PREVIEW_SHA" "$FORMAL_SHA")" = 'CHANGELOG.md'
          git push origin "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:${P01_MAIN_BEFORE}"
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${P01_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$FORMAL_SHA"
          echo "FORMAL_SHA=$FORMAL_SHA" >> "$GITHUB_ENV"
          echo "P01_V2475_FORMAL_SHA=$FORMAL_SHA"
          echo P01_V2475_MAIN_PROMOTION=PASS

      - name: Download and verify exact preview artifacts
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v2475-assets
          mkdir -p /tmp/p01-v2475-assets
          gh release download "$PREVIEW_TAG" --repo "$P01_REPO" --dir /tmp/p01-v2475-assets
          cd /tmp/p01-v2475-assets
          test "$(stat -c '%s' "$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c '%s' "$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA256"
          sha256sum -c "${UPDATE_NAME}.sha256"
          sha256sum -c "${FULL_NAME}.sha256"
          printf '%s  %s\n%s  %s\n' "$FULL_SHA256" "$FULL_NAME" "$UPDATE_SHA256" "$UPDATE_NAME" > SHA256SUMS.txt
          echo P01_V2475_FORMAL_ASSET_FREEZE=PASS

      - name: Create exact formal release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-assets
          cat >"$ASSETS/P01-V2.47.5-RELEASE-NOTES.md" <<EOF
          # P01 · VF Start V2.47.5

          发布日期：2026-09-10

          本版根据 Owner 真实使用反馈完成内容优先 Shell 收口：仅导航页保留左侧分类树；首页、频道、影视、专题、课程、项目、工具、软件释放永久侧栏占用，统一为 content-first / full-width 布局。

          - Schema：2026090401 → 2026090401
          - Migration：NONE
          - 支持在线升级：V2.47.4 → V2.47.5
          - FULL：用于全新安装
          - UPDATE：用于现有 V2.47.4 后台在线升级
          - Backup required：true
          - Rollback supported：true
          - Preview Candidate：${PREVIEW_SHA}
          - Formal Source：${FORMAL_SHA}
          - Exact Candidate UA/UI Gate：Runner 34555855409 PASS
          - Artifact / Atomic Update / Data Preservation Gate：Runner 34556157622 PASS
          - Production：NOT VERIFIED；发布更新通道不代表线上站点已经升级

          SHA-256：见 SHA256SUMS.txt 及逐资产 .sha256 文件。
          EOF
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          obj={
            'schema':'p01-formal-release/v1',
            'project_id':'P01',
            'version':'2.47.5',
            'formal_source':os.environ['FORMAL_SHA'],
            'preview_candidate':os.environ['PREVIEW_SHA'],
            'machine_gate_run':'34556157622',
            'ua_ui_gate_run':'34555855409',
            'schema_from':'2026090401','schema_to':'2026090401','migration':'NONE',
            'from_versions':['2.47.4'],
            'backup_required':True,'rollback_supported':True,
            'full_asset':{'name':os.environ['FULL_NAME'],'bytes':int(os.environ['FULL_BYTES']),'sha256':os.environ['FULL_SHA256']},
            'update_asset':{'name':os.environ['UPDATE_NAME'],'bytes':int(os.environ['UPDATE_BYTES']),'sha256':os.environ['UPDATE_SHA256']},
            'production':'NOT_VERIFIED'
          }
          Path('/tmp/p01-v2475-assets/P01-V2.47.5-FORMAL.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          echo P01_V2475_FORMAL_METADATA=PASS

      - name: Publish stable tag and GitHub Formal Release
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-assets
          gh api --method POST "repos/${P01_REPO}/git/refs" -f ref="refs/tags/${STABLE_TAG}" -f sha="$FORMAL_SHA" >/tmp/p01-v2475-stable-tag.json
          test "$(gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          gh release create "$STABLE_TAG" \
            "$ASSETS/$FULL_NAME" \
            "$ASSETS/${FULL_NAME}.sha256" \
            "$ASSETS/$UPDATE_NAME" \
            "$ASSETS/${UPDATE_NAME}.sha256" \
            "$ASSETS/SHA256SUMS.txt" \
            "$ASSETS/P01-V2.47.5-RELEASE-NOTES.md" \
            "$ASSETS/P01-V2.47.5-FORMAL.json" \
            --repo "$P01_REPO" --title 'VF Start V2.47.5' --notes-file "$ASSETS/P01-V2.47.5-RELEASE-NOTES.md" --verify-tag
          gh api "repos/${P01_REPO}/releases/tags/${STABLE_TAG}" >/tmp/p01-v2475-release.json
          test "$(jq -r '.draft' /tmp/p01-v2475-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v2475-release.json)" = false
          echo "RELEASE_ID=$(jq -r '.id' /tmp/p01-v2475-release.json)" >> "$GITHUB_ENV"
          echo "RELEASED_AT=$(jq -r '.published_at' /tmp/p01-v2475-release.json)" >> "$GITHUB_ENV"
          echo P01_V2475_FORMAL_RELEASE_PUBLISHED=PASS

      - name: Independent stable release remote byte readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/${P01_REPO}/git/ref/tags/${STABLE_TAG}" --jq '.object.sha')" = "$FORMAL_SHA"
          gh api "repos/${P01_REPO}/releases/tags/${STABLE_TAG}" >/tmp/p01-v2475-release-readback.json
          test "$(jq -r '.id' /tmp/p01-v2475-release-readback.json)" = "$RELEASE_ID"
          test "$(jq -r '.prerelease' /tmp/p01-v2475-release-readback.json)" = false
          rm -rf /tmp/p01-v2475-remote
          mkdir -p /tmp/p01-v2475-remote
          gh release download "$STABLE_TAG" --repo "$P01_REPO" --dir /tmp/p01-v2475-remote
          test "$(stat -c '%s' "/tmp/p01-v2475-remote/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "/tmp/p01-v2475-remote/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c '%s' "/tmp/p01-v2475-remote/$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "/tmp/p01-v2475-remote/$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA256"
          UPDATE_ASSET_ID="$(jq -r --arg n "$UPDATE_NAME" '.assets[]|select(.name==$n)|.id' /tmp/p01-v2475-release-readback.json)"
          test -n "$UPDATE_ASSET_ID"
          echo "UPDATE_ASSET_ID=$UPDATE_ASSET_ID" >> "$GITHUB_ENV"
          echo P01_V2475_FORMAL_REMOTE_READBACK=PASS

      - name: Checkout exact core-updates channel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_MAIN_BEFORE }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: core-updates

      - name: Publish P01 V2.47.5 backend online update channel
        working-directory: core-updates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$CORE_MAIN_BEFORE"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('projects/P01.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          assert obj['project_id']=='P01'
          assert obj['current_version']=='2.47.3'
          assert obj['target_version']=='2.47.4'
          assert obj['release_tag']=='v2.47.4'
          assert obj['product_identity']=='f24b01af34b173aef3ae6a7ecb5489aa6df19cc8'
          assert obj['asset_sha256']=='d0d50657c3b7069054f51d92e73ecec263f7de6441fefeeeacffcbbcb4e81562'
          obj.update({
            'current_version':'2.47.4',
            'target_version':'2.47.5',
            'update_type':'ATOMIC',
            'from_versions':['2.47.4'],
            'schema_from':'2026090401','schema_to':'2026090401',
            'repository':'llhzx2018/vf-start',
            'release_tag':'v2.47.5',
            'release_id':int(os.environ['RELEASE_ID']),
            'product_identity':os.environ['FORMAL_SHA'],
            'asset_name':os.environ['UPDATE_NAME'],
            'asset_bytes':int(os.environ['UPDATE_BYTES']),
            'asset_sha256':os.environ['UPDATE_SHA256'],
            'backup_required':True,
            'rollback_supported':True,
            'released_at':os.environ['RELEASED_AT'],
            'minimum_php':'8.0.0',
            'notes':'P01 · VF Start V2.47.5 内容优先 Shell / 导航分类侧栏收口正式在线升级通道。严格只允许 V2.47.4 → V2.47.5；Schema 2026090401 不变，Migration NONE。Preview Candidate '+os.environ['PREVIEW_SHA']+' / Formal Source '+os.environ['FORMAL_SHA']+'；Exact Candidate UA/UI Runner 34555855409 PASS，FULL/ATOMIC UPDATE/现有数据保留/安全/远端字节 Runner 34556157622 PASS，当前发布 Gate '+os.environ['GITHUB_RUN_ID']+'。canonical UPDATE 为 '+os.environ['UPDATE_NAME']+'，Asset ID '+os.environ['UPDATE_ASSET_ID']+'，'+os.environ['UPDATE_BYTES']+' bytes，sha256:'+os.environ['UPDATE_SHA256']+'。backup_required=true，rollback_supported=true。Formal Release / Channel Published 不代表 Production 已升级。'
          })
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'projects/P01.json'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git add projects/P01.json
          git commit -m 'dist(P01): publish V2.47.5 online update channel'
          CHANNEL_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/main" --force-with-lease="refs/heads/main:${CORE_MAIN_BEFORE}"
          echo "CHANNEL_SHA=$CHANNEL_SHA" >> "$GITHUB_ENV"
          echo "P01_V2475_CHANNEL_SHA=$CHANNEL_SHA"
          echo P01_V2475_CORE_UPDATES_PUBLISHED=PASS

      - name: Independent remote channel readback
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$CHANNEL_SHA"
          GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${CORE_REPO}/contents/projects/P01.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d >/tmp/p01-channel-after.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/p01-channel-after.json',encoding='utf-8'))
          assert p['enabled'] is True
          assert p['current_version']=='2.47.4'
          assert p['target_version']=='2.47.5'
          assert p['from_versions']==['2.47.4']
          assert p['schema_from']=='2026090401' and p['schema_to']=='2026090401'
          assert p['release_tag']=='v2.47.5'
          assert p['release_id']==int(os.environ['RELEASE_ID'])
          assert p['product_identity']==os.environ['FORMAL_SHA']
          assert p['asset_name']==os.environ['UPDATE_NAME']
          assert p['asset_bytes']==int(os.environ['UPDATE_BYTES'])
          assert p['asset_sha256']==os.environ['UPDATE_SHA256']
          assert p['backup_required'] is True and p['rollback_supported'] is True
          print('P01_V2475_BACKEND_UPDATE_CHANNEL_READBACK=PASS')
          PY
          echo P01_V2475_ONLINE_CHANNEL_GATE=PASS
          echo PRODUCTION_WRITE=false

      - name: Final verdict
        run: |
          echo P01_V2475_FORMAL_RELEASE=PASS
          echo P01_V2475_BACKEND_UPDATE_PUBLISHED=PASS
          echo OWNER_CAN_NOW_CHECK_UPDATE=true
          echo PRODUCTION_UPGRADE=NOT_PERFORMED

      - name: Cleanup
        if: always()
        run: rm -rf vf-start core-updates /tmp/p01-v2475-* /tmp/p01-channel-*.json