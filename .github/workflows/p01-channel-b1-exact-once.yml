name: p01-channel-b1-exact-once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-b1-exact-once.yml'

permissions:
  contents: read

jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-channel-b1-pr1717-exact-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare exact PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-curl php-xml php-mbstring php-sqlite3 >/dev/null
          php -v
          node --version

      - name: Checkout P01 exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 27375db3de9a40475d17ef310195773726e8ba47
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Bind source identity and run focused PHP and JS regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "27375db3de9a40475d17ef310195773726e8ba47"
          test "$(tr -d '\r\n' < VERSION)" = "2.47.452"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "2.47.452"
          php -l src/app/ChannelLibraryPage.php
          php -l src/app/YouTubeManualUpdates.php
          php -l src/youtube-channel-updates.php
          php tests/unit/youtube_manual_updates_cache_native.php
          php tests/unit/youtube_batch_server_contract_native.php
          php tests/unit/channel_youtube_diagnostic_overlay_contract.php
          php tests/unit/channel_scope_disclosure_contract.php
          node --check src/assets/channel-youtube-updates.js
          node tests/integration/youtube_failed_retry_node.js
          node tests/integration/youtube_batch_sequential_node.js
          node tests/integration/channels_upstream_warning_node.js
          echo P01_CHANNEL_BATCH1_EXACT_SOURCE=PASS
