name: P01 YouTube Sequential Batch One-shot Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-youtube-sequential-1561.yml'

permissions:
  contents: read

concurrency:
  group: p01-youtube-sequential-1561
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      SOURCE_SHA: 7e1320cfad719b57c6e9cbd3e8654e9c303e9260
      BASELINE_TAG: v2.47.402
    steps:
      - name: Checkout public one-shot control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use real PHP extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,simplexml,mbstring,zip,openssl
          coverage: none

      - name: Checkout exact private source ephemerally
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-youtube-batch-1561"
          mkdir -p "$ROOT"
          chmod 700 "$ROOT"
          echo "P01_TEST_ROOT=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/candidate"
          git -C "$ROOT/candidate" checkout -q --detach "$SOURCE_SHA"
          git -C "$ROOT/candidate" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$SOURCE_SHA"
          git clone -q --depth 1 --branch "$BASELINE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$ROOT/stable"
          git -C "$ROOT/stable" remote set-url origin "https://github.com/${PRODUCT_REPO}.git"
          echo 'P01_YOUTUBE_BATCH_SOURCE_BIND=PASS'

      - name: Focused PHP, JS and owner interaction tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_ROOT/candidate"
          php -m | grep -Fx mbstring
          php -m | grep -Fx SimpleXML
          php -m | grep -Fx curl
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/youtube_batch_server_contract_native.php
          node --check src/assets/channel-youtube-updates.js
          node --check tests/integration/youtube_batch_sequential_node.js
          php tests/unit/youtube_batch_server_contract_native.php
          php tests/unit/youtube_manual_updates_cache_native.php
          node tests/integration/youtube_batch_sequential_node.js
          echo 'P01_YOUTUBE_BATCH_FOCUSED_MACHINE=PASS'

      - name: Canonical unit regression relative to formal V2.47.402
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$P01_TEST_ROOT/candidate/tests/canonical_release_regression.sh" \
            "$P01_TEST_ROOT/candidate" "$P01_TEST_ROOT/stable" --require-zero-debt \
            | tee "$P01_TEST_ROOT/regression.log"
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$P01_TEST_ROOT/regression.log"
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' "$P01_TEST_ROOT/regression.log"
          test -z "$(git -C "$P01_TEST_ROOT/candidate" status --porcelain)"
          echo 'P01_YOUTUBE_BATCH_CANONICAL=PASS'

      - name: Clean up private source and sensitive fixture bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${P01_TEST_ROOT:-}" ]; then rm -rf -- "$P01_TEST_ROOT"; fi
          echo 'P01_YOUTUBE_BATCH_NO_PUBLIC_SOURCE_ARTIFACT=PASS'
