name: TEMP P07-M03 Owner Trial 147rc Publish (not formal)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p07-m03-ownertrial147-publish-20261123.yml'
permissions:
  contents: write
jobs:
  owner-trial-publish:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'release/p07-m03-ownertrial147-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PRODUCT_SHA: 'f6cdce87cff59dcf1a3bfb7f521ec9ad5912a6da'
      TRIAL_BUILD: '0.1.0-release147-rc1'
      TRIAL_TAG: 'p07-m03-v0.1.0-release147-rc1-ownertrial-20261123'
      NO_COLOR: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exact private product source (ephemeral read only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: ${{ env.PRODUCT_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: .p07-private
      - name: Build exact-source official146 based signed owner trial ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$GITHUB_WORKSPACE/.p07-private"
          test "$(git -C "$root" rev-parse HEAD)" = "$PRODUCT_SHA"
          trial_dir="$(mktemp -d "$RUNNER_TEMP/p07-m03-ownertrial.XXXXXXXX")"
          chmod 0700 "$trial_dir"
          echo "$trial_dir" > "$RUNNER_TEMP/p07-m03-ownertrial-path"
          official="$trial_dir/official146.zip"
          candidate="$trial_dir/P07-M03-0.1.0-release147-rc1-OWNER-TRIAL.zip"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 150 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release146-20261122/P07-M03-0.1.0-release146.zip' \
            -o "$official"
          echo "7b3e46c651c5ce3597e4ab535fbdc734023fc1b706fe85189a344ee600514321  $official" | sha256sum --check --status
          python3 -B "$root/scripts/p07_m03_trial_from_official.py" \
            --official-zip "$official" --product-root "$root" \
            --product-sha "$PRODUCT_SHA" --official-build 0.1.0-release146 \
            --build "$TRIAL_BUILD" --output "$candidate" > "$trial_dir/builder.log"
          grep -Fq 'P07_M03_TRIAL_BUILD=PASS' "$trial_dir/builder.log"
          unzip -p "$candidate" dist/p07/0.1.0/overlay/BUILD_ID | grep -Fxq "$TRIAL_BUILD"
          unzip -p "$candidate" dist/p07/0.1.0/overlay/lib/migration_safe_batch_cli.py | \
            grep -Fq 'source_assets_snapshot_sha256'
          unzip -p "$candidate" dist/p07/0.1.0/overlay/lib/migration_safe_batch_io.py | \
            grep -Fq 'BATCH_ALL_SOURCE_ASSETS_CHANGED_REPLAN_REQUIRED'
          python3 -B - "$candidate" "$trial_dir" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          path=pathlib.Path(sys.argv[1]);target=pathlib.Path(sys.argv[2])
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          with zipfile.ZipFile(path) as z:
              members=z.namelist()
              manifest=z.read('dist/p07/0.1.0/overlay/RUNTIME.gitblob')
              installer=z.read('installers/p07-final.sh')
              assert len(members)==len(set(members))
              entries=manifest.decode().splitlines()
              assert len(entries)>=50
              for line in entries:
                  expect,rel=line.split('  ',1)
                  assert blob(z.read('dist/p07/0.1.0/overlay/'+rel))==expect
              assert {'lib/migration_safe_batch_cli.py','lib/migration_safe_batch_io.py',
                      'lib/migration_native_datadir_guard.py',
                      'lib/migration_cloudpanel_sql_probe.py',
                      'components/p07-m03-safe-batch-ui.sh'}.issubset(
                        {line.split('  ',1)[1] for line in entries})
          metadata={'sha256':sha,'runtime_manifest_blob':blob(manifest),
                    'installer_blob':blob(installer),'product_sha':'f6cdce87cff59dcf1a3bfb7f521ec9ad5912a6da',
                    'build':'0.1.0-release147-rc1','release_class':'OWNER_TRIAL_NOT_FORMAL',
                    'migration_e2e':'NOT_RUN_PLATFORM_SAFETY_BLOCK'}
          (target/'receipt.json').write_text(json.dumps(metadata,sort_keys=True))
          (target/'SHA256SUMS').write_text(sha+'  '+path.name+'\n')
          print('OWNER_TRIAL_ZIP_SHA256='+sha)
          print('OWNER_TRIAL_RUNTIME_BLOB='+blob(manifest))
          print('OWNER_TRIAL_INSTALLER_BLOB='+blob(installer))
          print('OWNER_TRIAL_SIGNED_RUNTIME=PASS')
          PY
          cat > "$trial_dir/RELEASE_NOTES.md" <<'MD'
          # P07-M03 网站与数据 / D04 服务器迁移｜Owner 手工试迁候选（非正式版）
          仅供 Owner 在**独立空白测试接收机**上手工执行功能验证。
          源码: llhzx2018/vf-server-ops PR #380，exact f6cdce87cff59dcf1a3bfb7f521ec9ad5912a6da。
          基线: 官方不可变 release146 ZIP。安装升级与坏包/失败回滚已在隔离环境完成。
          **未经过此源码的双 CloudPanel Percona8.4 E2E；未验证真实目标业务数据恢复、最终同步或 DNS。**
          所有已有迁移任务、已有域名、数据库、目标用户和非空目录必须保护；发现 UNKNOWN / OCCUPIED / PREPARE_FAILED 不迁入。
          本包不会自动操作服务器、数据库或 DNS。Owner 手工试迁不能代替正式 Release 机验。
          正式公共 Toolbox release146 不会因本测试包自动更新。
          MD
      - name: Publish owner-trial GitHub prerelease, never stable public pin
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          trial_dir="$(cat "$RUNNER_TEMP/p07-m03-ownertrial-path")"
          test -f "$trial_dir/receipt.json"
          if gh release view "$TRIAL_TAG" --repo llhzx2018/core-free-runner-public >/dev/null 2>&1; then
            echo "OWNER_TRIAL_RELEASE_ALREADY_EXISTS_REFUSE_OVERWRITE"; exit 14
          fi
          gh release create "$TRIAL_TAG" \
            "$trial_dir/P07-M03-0.1.0-release147-rc1-OWNER-TRIAL.zip" \
            "$trial_dir/SHA256SUMS" "$trial_dir/receipt.json" \
            --repo llhzx2018/core-free-runner-public \
            --target main \
            --prerelease \
            --title "P07-M03 0.1.0-release147-rc1 Owner Trial (NOT FORMAL)" \
            --notes-file "$trial_dir/RELEASE_NOTES.md"
          gh release view "$TRIAL_TAG" --repo llhzx2018/core-free-runner-public --json isPrerelease,tagName,assets | \
            python3 -c 'import json,sys;p=json.load(sys.stdin);assert p["isPrerelease"];assert len(p["assets"])==3;print("OWNER_TRIAL_PUBLIC_PRERELEASE_CREATED=PASS")'
      - name: Always erase ephemeral private source and package
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- "$GITHUB_WORKSPACE/.p07-private"
          if [[ -f "$RUNNER_TEMP/p07-m03-ownertrial-path" ]]; then
            d="$(cat "$RUNNER_TEMP/p07-m03-ownertrial-path")"
            case "$d" in "$RUNNER_TEMP"/p07-m03-ownertrial.*) rm -rf -- "$d";; esac
            rm -f -- "$RUNNER_TEMP/p07-m03-ownertrial-path"
          fi
          echo EPHEMERAL_PRIVATE_AND_TRIAL_PACKAGE_CLEANUP=COMPLETE
