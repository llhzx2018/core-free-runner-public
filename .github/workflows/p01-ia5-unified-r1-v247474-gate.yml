          csrf2=$(curl -sS -b "$cookie" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18522/music-import.php -d 'vf_frontstage_json=1')
          test "$csrf1" = 419
          test "$csrf2" = 419
          for action in plugin_token_regenerate plugin_token_revoke; do
            denied=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:18522/api.php?action=$action")
            test "$denied" = 401
            missing=$(curl -sS -b "$cookie" -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:18522/api.php?action=$action")
            test "$missing" = 419
          done
          guest_sessions=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18522/api.php?action=security_sessions)
          test "$guest_sessions" = 401
          guest_revoke=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18522/api.php?action=security_sessions_revoke_others)
          test "$guest_revoke" = 401
          csrf_revoke=$(curl -sS -b "$cookie" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18522/api.php?action=security_sessions_revoke_others)
          test "$csrf_revoke" = 419
          settings_guest=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18522/api.php?action=security_settings_save)
          test "$settings_guest" = 401
          settings_csrf=$(curl -sS -b "$cookie" -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18522/api.php?action=security_settings_save)
          test "$settings_csrf" = 419
          for action in backup_preview_restore backup_restore; do
            guest_restore=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:18522/api.php?action=$action")
            test "$guest_restore" = 401
            csrf_restore=$(curl -sS -b "$cookie" -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:18522/api.php?action=$action")
            test "$csrf_restore" = 419
          done
          echo P01_IA5_RESTORE_OWNER_CSRF_HTTP=PASS
          echo P01_IA5_LOGIN_SECURITY_OWNER_CSRF_HTTP=PASS
          echo P01_IA5_SESSIONS_OWNER_AND_CSRF_HTTP=PASS
          echo P01_IA5_HELPER_TOKEN_OWNER_AND_CSRF_HTTP=PASS
          echo P01_IA5_OWNER_CSRF_HTTP=PASS

      - name: Isolated protected SQLite backup restore
        id: restore
        shell: bash
        run: |
          set -Eeuo pipefail
          VF_E2E_RUNTIME_ROOT=/tmp/p01-maintenance-gate/target-full php <<'PHP'
          <?php
          declare(strict_types=1);
          $root=getenv('VF_E2E_RUNTIME_ROOT');
          require $root.'/app/bootstrap.php';
          $db=vf_db();
          $db->exec('CREATE TABLE ia5_release_restore_sentinel (id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
          $db->exec("INSERT INTO ia5_release_restore_sentinel VALUES (1,'protected-before-restore')");
          $manager=new VfBackupManager($db);
          $backup=$manager->create('IA5 isolated release restore proof','manual',true);
          $key=(string)($backup['backup_key']??'');
          if($key==='')throw new RuntimeException('missing backup key');
          $verified=$manager->verify($key);
          if(($verified['validation_status']??'')!=='valid')throw new RuntimeException('invalid backup verification');
          $db->exec("UPDATE ia5_release_restore_sentinel SET value='mutated-after-backup' WHERE id=1");
          vf_close_db();
          $restored=VfBackupManager::performRestore($key);
          $value=vf_db()->query('SELECT value FROM ia5_release_restore_sentinel WHERE id=1')->fetchColumn();
          if($value!=='protected-before-restore')throw new RuntimeException('private sentinel lost');
          if(empty($restored['restored']))throw new RuntimeException('restore not confirmed');
          echo "P01_IA5_PROTECTED_BACKUP_RESTORE=PASS\n";
          PHP
          (cd /tmp/p01-maintenance-gate/target-full && php cli/verify.php) | grep -Fx VERIFY_PASS=YES

      - name: Report scoped proof and explicitly block full gate when main has debt
        if: always()
        shell: bash
        env:
          CANONICAL_RESULT: ${{ steps.canonical.outcome }}
          ATTRIBUTION_RESULT: ${{ steps.projects_main_attribution.outcome }}
          FOCUS_RESULT: ${{ steps.focus.outcome }}
          ARTIFACT_RESULT: ${{ steps.artifact.outcome }}
          INSTALL_RESULT: ${{ steps.install_upgrade.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          SECURITY_RESULT: ${{ steps.security.outcome }}
          RESTORE_RESULT: ${{ steps.restore.outcome }}
        run: |
          set -Eeuo pipefail
          echo NO_TAG_NO_RELEASE_NO_DISTRIBUTION_NO_PRODUCTION=YES
          for value in "$FOCUS_RESULT" "$ARTIFACT_RESULT" "$INSTALL_RESULT" "$BROWSER_RESULT" "$SECURITY_RESULT" "$RESTORE_RESULT"; do
            if [ "$value" != success ]; then
              echo P01_IA5_SCOPED_R14_GATE=FAIL_OR_INCOMPLETE
              exit 82
            fi
          done
          echo P01_IA5_SCOPED_R14_GATE=PASS
          if [ "$CANONICAL_RESULT" != success ]; then
            if [ "$ATTRIBUTION_RESULT" != success ]; then
              echo P01_FULL_CANONICAL_GATE=UNCLASSIFIED_FAIL
              exit 83
            fi
            echo P01_FULL_CANONICAL_GATE=BLOCKED_MAIN_PREEXISTING_DEBT
            exit 84
          fi
          echo P01_FULL_CANONICAL_GATE=PASS
          echo P01_IA5_EXACT_PREFLIGHT_GATE=PASS
