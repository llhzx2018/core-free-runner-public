name: P03 Bridge Payload Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p03-bridge-payload-audit.yml'
      - 'ops/p03/bridge-payload/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          for i in 01 02 03 04 05 06; do
            f="ops/p03/bridge-payload/chunk${i}.txt"
            printf '%s %s %s\n' "$i" "$(wc -c < "$f")" "$(sha256sum "$f"|awk '{print $1}')"
          done
          cat ops/p03/bridge-payload/chunk{01..06}.txt | tr -d '\r\n' > /tmp/payload.b64
          printf 'combined %s %s\n' "$(wc -c </tmp/payload.b64)" "$(sha256sum /tmp/payload.b64|awk '{print $1}')"
          test "$(wc -c </tmp/payload.b64)" = '16652'
          test "$(sha256sum /tmp/payload.b64|awk '{print $1}')" = '1e32f830d14c7fc2f9f38a6f8254596e208bf60442eeaf9fd383486ba7e5b791'
          base64 -d /tmp/payload.b64 | gzip -d > /tmp/activator.php
          test "$(sha256sum /tmp/activator.php|awk '{print $1}')" = '70fcda1dcb2cd8340c8f7ddf750606ac932caefd61780979ef497824fec4b727'
          php -l /tmp/activator.php
          echo P03_BRIDGE_PAYLOAD_AUDIT=PASS