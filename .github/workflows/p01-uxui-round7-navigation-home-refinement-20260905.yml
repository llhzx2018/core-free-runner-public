name: P01 UXUI Round7 Navigation Home Refinement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-uxui-round7-navigation-home-refinement-20260905.yml

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 2b5c6e289e269d4e70d72c7e554e270618ff4d2f
      BASE_SHA: 3f3eb92ea833170f91c569d8ada46c5d2f3bd20d
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-uxui-round7-navigation-home-refinement-20260905
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and no-release boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.46.3'
          test "$(cat src/VERSION.txt)" = '2.46.3'
          changed="$(git diff --name-only "$BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 7
          ! printf '%s\n' "$changed" | grep -Eq '(^VERSION$|^src/VERSION.txt$|^src/migrations/|^src/app/bootstrap.php$)'
      - name: Syntax and Round 7 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in src/home.php src/start.php src/app/FunctionalHome.php tests/unit/home_action_center_source_contract.php tests/unit/home_action_only_contract.php tests/unit/quick_open_global_contract.php tests/unit/uxui_round7_navigation_home_identity_contract.php; do php -l "$f"; done
          php tests/unit/uxui_round7_navigation_home_identity_contract.php
          find src -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          node --check src/assets/quick-open.js
      - name: Existing Home behavior regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/home_action_center_source_contract.php tests/unit/home_action_only_contract.php tests/unit/home_project_attention_contract.php tests/unit/home_readability_contract.php tests/unit/quick_open_global_contract.php tests/unit/uxui_round1_home_root_contract.php; do php "$f"; done
      - name: Navigation and product regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in tests/unit/workspace_view_catalog_contract.php tests/unit/workspace_nine_entry_source_contract.php tests/unit/global_page_size_authority_contract.php tests/unit/resource_action_semantics_contract.php tests/unit/primary_open_semantics_contract.php tests/unit/uxui_round2_subject_identity_contract.php tests/unit/uxui_round3_course_identity_contract.php tests/unit/uxui_round4_tools_identity_contract.php tests/unit/uxui_round5_software_identity_contract.php tests/unit/uxui_round6_channels_watch_identity_contract.php tests/unit/consolidated_product_acceptance_contract.php; do [ -f "$f" ] && php "$f"; done
      - name: Static Home Navigation boundary assertions
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'vf_render_home_workspace();' src/home.php
          ! grep -Eq 'ob_start\(|ob_get_clean\(|str_replace\(|substr_replace\(' src/home.php
          grep -Fq "require_once __DIR__ . '/HomeProjectAttention.php'" src/app/FunctionalHome.php
          grep -Fq 'VfHomeProjectAttention::read($db)' src/app/FunctionalHome.php
          grep -Fq 'assets/quick-open.css' src/app/FunctionalHome.php
          grep -Fq 'assets/quick-open.js' src/app/FunctionalHome.php
          grep -Fq 'surface-manager.php?mode=focus' src/app/FunctionalHome.php
          grep -Fq 'vf-mobile-command-search' src/app/FunctionalHome.php
          grep -Fq "\$_GET['layout'] = 'cards';" src/start.php
          grep -Fq "\$vfWorkspaceMode = 'start';" src/start.php
          grep -Fq "require_once __DIR__ . '/app/FunctionalWorkspace.php'" src/start.php
          ! grep -Eq 'progress[_-]?(percent|percentage)|health[_-]?score|project[_-]?score' src/app/FunctionalHome.php
          echo P01_UXUI_ROUND7_NAVIGATION_HOME_REFINEMENT=PASS
