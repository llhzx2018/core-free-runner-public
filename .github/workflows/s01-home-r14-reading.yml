name: S01-C01 R14 homepage visual reading exact-source gate
on:
  push:
    branches: [task/s01-frontend-design-20261017]
    paths: ['.github/workflows/s01-home-r14-reading.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Bind bounded browser acceptance lane
        run: |
          mkdir -p proof
          cp -a runner/lanes/s01-frontend-design-20261017 lane
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ad1ca3d6104abf20ebf99e9ec2b5f5bf960d7484
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source, synchronized CSS bundle and no unauthorized surfaces
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = ad1ca3d6104abf20ebf99e9ec2b5f5bf960d7484
          test "$(cat target/VERSION)" = 1.35.134
          python3 - <<'PY'
          import subprocess,pathlib
          root=pathlib.Path('target')
          changed=subprocess.check_output(['git','-C','target','diff','--name-only','5a47dd82d7bb04badcfe7fa6d0a2e43777317097','HEAD'],text=True).splitlines()
          allowed=['src/assets/css/public/pages/families/public-family-01-shell-home-operations-closure.css','src/assets/css/public/vf-theme-public-runtime.css']
          assert sorted(changed)==sorted(allowed),changed
          src=(root/allowed[0]).read_text()
          bundle=(root/allowed[1]).read_text()
          marker='/* R14 post-Production desktop reading polish'
          assert src.count(marker)==1 and bundle.count(marker)==1
          assert src[src.index(marker):]==bundle[bundle.index(marker):]
          block=src[src.index(marker):]
          for expected in ['min-width:1024px','vf-home-tool-card p','vf-home-section-head p','vf-home-boundary-card p','vf-home-steps-list p','vf-production-footer']:
              assert expected in block,expected
          assert 'font-size:16px' in block and '@media' in block
          print('R14_SCOPE_CSS_OWNER_RUNTIME_SYNC=PASS')
          PY
          php -l target/src/header.php
          php -l target/src/footer.php
          php target/tests/targeted/test-home-priority.php
          php target/tests/targeted/test-nav-current-external.php
      - name: Approved provider fixture (private transient download)
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          mkdir provider
          gh release download v1.25.91 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.91.zip --dir provider
          echo 'fcb56d605550c5b04a3ff8b3b78b8bf86ca11b77e0aa22334fa67e675b01d6df  provider/vf-tools-m3u8_V1.25.91.zip' | sha256sum -c
      - name: Browser dependencies
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Real isolated WordPress MariaDB and desktop Chromium regression
        run: bash lane/native.sh
      - name: Cleanup private transient checkout
        if: always()
        run: rm -rf target provider
