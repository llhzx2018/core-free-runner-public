name: P07 M03 D04 real SSH rsync static and SQLite isolated source
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-ssh-file-sqlite-20261116.yml']
permissions:
  contents: read
jobs:
  p07-real-ssh-site-and-sqlite:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout public one-time SSH test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout transient exact P07 product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: d3c47cb59795997c68fa92e417ec24cc0ebc5d16
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Checkout GOV canonical architecture in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-doc
      - name: Prepare isolated source SSH Linux container and owned synthetic target folders
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private rev-parse HEAD)" = "d3c47cb59795997c68fa92e417ec24cc0ebc5d16"
          command -v rsync >/dev/null || (sudo apt-get -qq update && sudo apt-get install -qq -y rsync)
          docker run -d --rm --name p07-d04-ssh-source -p 127.0.0.1:22287:22 ubuntu:24.04 sleep infinity >/dev/null
          docker exec p07-d04-ssh-source bash -lc 'set -eu; export DEBIAN_FRONTEND=noninteractive; apt-get -qq update >/dev/null; apt-get -qq install -y openssh-server rsync python3 >/dev/null; install -d -m 0700 /root/.ssh /run/sshd; usermod -p "$(openssl passwd -6 -salt p07test SYNTHETIC_ci_nonlogin)" root; printf "\\nPermitRootLogin yes\\nPasswordAuthentication no\\nPubkeyAuthentication yes\\nUsePAM no\\n" > /etc/ssh/sshd_config.d/p07-ci-ephemeral.conf; ssh-keygen -A >/dev/null'
          mkdir -p "$RUNNER_TEMP/p07-d04-ssh-private"
          chmod 0700 "$RUNNER_TEMP/p07-d04-ssh-private"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/p07-d04-ssh-private/key" >/dev/null
          docker cp "$RUNNER_TEMP/p07-d04-ssh-private/key.pub" p07-d04-ssh-source:/root/.ssh/authorized_keys
          docker exec p07-d04-ssh-source chmod 0600 /root/.ssh/authorized_keys
          docker exec p07-d04-ssh-source /usr/sbin/sshd -E /tmp/p07-sshd-auth.log -o LogLevel=DEBUG2
          docker exec p07-d04-ssh-source sh -c '/usr/sbin/sshd -T -C user=root,host=localhost,addr=127.0.0.1 | grep -E "^(permitrootlogin|pubkeyauthentication|passwordauthentication|usepam|authorizedkeysfile)"'
          docker exec p07-d04-ssh-source sh -c 'stat -c "%U:%G:%a %n" /root /root/.ssh /root/.ssh/authorized_keys; passwd -S root | cut -d " " -f 1-2'
          ssh-keyscan -T 10 -p 22287 127.0.0.1 > "$RUNNER_TEMP/p07-d04-ssh-private/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/p07-d04-ssh-private/known_hosts"
          if ! ssh -p 22287 -i "$RUNNER_TEMP/p07-d04-ssh-private/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/p07-d04-ssh-private/known_hosts" root@127.0.0.1 'test -x /usr/bin/rsync && test -x /usr/bin/python3'; then
            docker exec p07-d04-ssh-source sh -c 'grep -Ei "refus|denied|authenti|not allowed|bad owner|lock|invalid user|failed|accept" /tmp/p07-sshd-auth.log | tail -25' || true
            exit 1
          fi
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 /home/p07ssh /home/p07ssh/htdocs /home/p07ssh/htdocs/static.p07.invalid
          printf TARGET_KEEP > /home/p07ssh/htdocs/static.p07.invalid/index.html
          docker exec p07-d04-ssh-source bash -lc 'set -eu; install -d -m 0700 /home/p07ssh /home/p07ssh/htdocs /home/p07ssh/htdocs/static.p07.invalid /home/p07ssh/htdocs/static.p07.invalid/assets /home/p07ssh/htdocs/sqlite.p07.invalid /var/lib/vf-server-ops/pull-source/pull-20261116T110000Z-abc12345/data; printf SOURCE_PUBLIC_SITE > /home/p07ssh/htdocs/static.p07.invalid/index.html; printf "body{color:green}" > /home/p07ssh/htdocs/static.p07.invalid/assets/style.css'
          docker exec -i p07-d04-ssh-source python3 - <<'PY'
          import sqlite3
          p="/home/p07ssh/htdocs/sqlite.p07.invalid/app.sqlite"
          c=sqlite3.connect(p)
          c.execute("PRAGMA journal_mode=WAL")
          c.execute("CREATE TABLE measurements (id INTEGER PRIMARY KEY, label TEXT)")
          c.executemany("INSERT INTO measurements(label) VALUES (?)",
                        [("old-one",),("旧站继续运行",)])
          c.commit()
          c.close()
          PY
          echo "P07_D04_SSH_PRIVATE_KEY=$RUNNER_TEMP/p07-d04-ssh-private/key" >> "$GITHUB_ENV"
          echo P07_D04_REAL_SSH_SOURCE_CONTAINER_READY=PASS
      - name: Run P07 real SSH, remote source runtime and rsync static and SQLite safety tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
          P07_D04_NATIVE_SSH_CI: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          cd "$PRIVATE"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_real_ssh_transfer.py -v
          echo P07_D04_REAL_SSH_AND_RSYNC_STATIC_SQLITE_PRIVATE_STAGE=PASS
          echo P07_D04_SSH_SOURCE_IS_SYNTHETIC_CONTAINER=YES
          echo P07_D04_REAL_CLOUDPANEL_SOURCE_TARGET=NOT_RUN
          echo P07_D04_REAL_SQL_CROSS_ENGINE=NOT_RUN
          echo P07_D04_PRODUCTION_DNS=UNCHANGED
      - name: Exact-source safety and GOV naming, modules, terminal UX
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-doc"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_prepared_static_online_snapshot.py -q
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_prepared_sqlite_online_snapshot.py -q
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_final_sync_guard.py -q
          python3 -B .github/checks/test_architecture_gate.py -q
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py --manifest "$PRIVATE/.github/checks/code_architecture.json" --gov-root "$GOV" --git-root "$PRIVATE" --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81 --head-sha d3c47cb59795997c68fa92e417ec24cc0ebc5d16
          echo P07_D04_SSH_SCOPE_AND_ARCH_REGRESSION=PASS
      - name: Always destroy isolated source, credentials and private product workspace
        if: always()
        shell: bash
        run: |
          set +e
          docker rm -f p07-d04-ssh-source >/dev/null 2>&1
          rm -rf -- .p07-private .gov-doc "$RUNNER_TEMP/p07-d04-ssh-private"
          test ! -e .p07-private
          test ! -e .gov-doc
          test ! -e "$RUNNER_TEMP/p07-d04-ssh-private"
          echo P07_D04_SSH_PRIVATE_SOURCE_AND_WORKSPACE_CLEANED=PASS
