name: P07 V2.1 Full Integration Gate

on:
  push:
    branches: [feature/p07-v21-lowload-fio-backtrace]
    paths:
      - 'experiments/p07-vps-audit-v21.sh'
      - '.github/workflows/p07-v21-full-gate.yml'
  pull_request:
    paths:
      - 'experiments/p07-vps-audit-v21.sh'
      - '.github/workflows/p07-v21-full-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Exact surface and safety
        shell: bash
        run: |
          set -euo pipefail
          s='experiments/p07-vps-audit-v21.sh'
          bash -n "$s"
          test "$(NO_COLOR=1 bash "$s" --version | awk '{print $NF}')" = 'V2.1.0'
          test "$(bash "$s" --build-id)" = '2.1.0-rc7-field'
          grep -Fq 'P07_FIO_TEST_MIB:-64' "$s"
          ! grep -Fq 'iodepth=32' "$s"
          ! grep -Fq 'hitscounter.dev' "$s"
          ! grep -Fq 'ipinfo.io' "$s"
          grep -Fq '中国三网回程' "$s"
          grep -Fq 'display_width' "$s"
          grep -Fq 'normalize_base_output' "$s"
          grep -Fq '基础综合结论' "$s"
          grep -Fq '完整验机总耗时' "$s"

      - name: Full real base plus low-load fio and route UX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-v21-full && mkdir -p /tmp/p07-v21-full
          started=$(date +%s)
          NO_COLOR=1 P07_ROUTE_MOCK=1 P07_REPORT_DIR=/tmp/p07-v21-full \
            timeout 780s bash experiments/p07-vps-audit-v21.sh | tee /tmp/full.out
          elapsed=$(( $(date +%s) - started ))
          echo "elapsed=${elapsed}s"
          test "$elapsed" -lt 780

          grep -q 'P07 VPS 一键验机 V2.1.0' /tmp/full.out
          grep -q 'CPU 真实表现' /tmp/full.out
          grep -q '磁盘 I/O 测速' /tmp/full.out
          grep -q '节点/地区' /tmp/full.out
          grep -q '中国大陆区域线路参考' /tmp/full.out
          grep -q '基础综合结论' /tmp/full.out
          grep -q '增强磁盘低负载测试' /tmp/full.out
          grep -q '有效档位           : 4 / 4' /tmp/full.out
          grep -q '中国三网回程' /tmp/full.out
          grep -q '北京电信.*电信CN2.*优质' /tmp/full.out
          grep -q '电信优质回程       : 2 / 4' /tmp/full.out
          grep -q '联通优质回程       : 2 / 4' /tmp/full.out
          grep -q '移动优质回程       : 2 / 4' /tmp/full.out
          test "$(grep -c '^ 最终验机结论$' /tmp/full.out)" -eq 1
          grep -q '完整验机总耗时' /tmp/full.out
          grep -q '增强 Markdown 报告' /tmp/full.out
          ! grep -Eq '2\.0\.0-rc3-zh|2\.0\.0-rc4-zh|P07 VPS 一键验机 2\.0' /tmp/full.out
          test -n "$(find /tmp/p07-v21-full -maxdepth 1 -name 'p07-vps-audit-v21_*.md' -print -quit)"
          test -z "$(find /var/tmp -maxdepth 1 -name '.p07-fio-*' -print -quit)"

      - name: Markdown contract
        shell: bash
        run: |
          set -euo pipefail
          md=$(find /tmp/p07-v21-full -maxdepth 1 -name 'p07-vps-audit-v21_*.md' | head -n1)
          test -n "$md"
          grep -q '版本：`V2.1.0`' "$md"
          grep -q '基础与网络验机输出' "$md"
          grep -q '中国大陆区域线路参考' "$md"
          grep -q '增强磁盘低负载测试' "$md"
          grep -q '中国三网回程' "$md"
          grep -q '北京电信' "$md"
