name: TEMP P08 R43 post-pointer SIGKILL 3DB recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s9-r43-pointer-recovery-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-3db-restoration-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_SHA: 0136237d0912c98424f4df489765a0935437e05e
  TARGET_VERSION: '0.1.18'
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s9-r43-pointer-recovery-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Established temporary lane identity audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s9-r43-pointer-recovery-20261125.json --input .github/workflows/temp-p08-s9-r43-pointer-recovery-20261125.yml
          echo P08_R43_SOURCE_IDENTITY_PREFLIGHT=PASS
  sqlite-issued-schema-recovery:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private source only for disposable test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 0136237d0912c98424f4df489765a0935437e05e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - name: Native SQLite backup, 8 DDL, guarded downgrade, SIGKILL and independent restore
        working-directory: private-p08
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: 'base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI='
          SESSION_DRIVER: array
          CACHE_STORE: array
          P08_R43_DISPOSABLE_SCHEMA: 'YES'
          DB_CONNECTION: sqlite
        run: bash tests/native/r43_rehearse_issued_v016_to_v018.sh
      - name: Remove all private source and temporary DB/backup bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_PRIVATE_SOURCE_AND_BACKUP_CLEANUP=PASS

  sql-issued-schema-recovery:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      sql:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: 'p08_r43_disposable_only_2026'
          MYSQL_DATABASE: p08_r43_main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - name: Checkout exact private source only for disposable test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 0136237d0912c98424f4df489765a0935437e05e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - name: Install disposable native logical DB backup/restore client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client > /dev/null
          command -v mariadb-dump
          command -v mariadb
          echo P08_R43_NATIVE_SQL_BACKUP_CLIENT=PASS
      - name: Native MySQL/MariaDB pre-upgrade dump, 8 DDL, crash and independent SQL restore
        working-directory: private-p08
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: 'base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI='
          SESSION_DRIVER: array
          CACHE_STORE: array
          P08_R43_DISPOSABLE_SCHEMA: 'YES'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: 'p08_r43_disposable_only_2026'
        run: bash tests/native/r43_rehearse_issued_v016_to_v018.sh
      - name: Remove all private source and temporary DB/backup bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_PRIVATE_SOURCE_AND_BACKUP_CLEANUP=PASS
