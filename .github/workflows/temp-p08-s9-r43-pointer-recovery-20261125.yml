name: TEMP P08 R43 post-pointer SIGKILL 3DB recovery
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s9-r43-pointer-recovery-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-3db-restoration-20261125
  cancel-in-progress: false
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_SHA: 690ed97d81eca9feba99e96a46b97302abef5c96
  TARGET_VERSION: '0.1.18'
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s9-r43-pointer-recovery-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Established temporary lane identity audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s9-r43-pointer-recovery-20261125.json --input .github/workflows/temp-p08-s9-r43-pointer-recovery-20261125.yml
          echo P08_R43_SOURCE_IDENTITY_PREFLIGHT=PASS
  sqlite-issued-schema-recovery:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact private source only for disposable test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 690ed97d81eca9feba99e96a46b97302abef5c96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - name: Native SQLite backup, 8 DDL, guarded downgrade, SIGKILL and independent restore
        working-directory: private-p08
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: 'base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI='
          SESSION_DRIVER: array
          CACHE_STORE: array
          P08_R43_DISPOSABLE_SCHEMA: 'YES'
          DB_CONNECTION: sqlite
        run: bash tests/native/r43_rehearse_issued_v016_to_v018.sh
      - name: Remove all private source and temporary DB/backup bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_PRIVATE_SOURCE_AND_BACKUP_CLEANUP=PASS

  sql-issued-schema-recovery:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      sql:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: 'p08_r43_disposable_only_2026'
          MYSQL_DATABASE: p08_r43_main
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - name: Checkout exact private source only for disposable test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 690ed97d81eca9feba99e96a46b97302abef5c96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - name: Install disposable native logical DB backup/restore client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client > /dev/null
          command -v mariadb-dump
          command -v mariadb
          echo P08_R43_NATIVE_SQL_BACKUP_CLIENT=PASS
      - name: Native MySQL/MariaDB pre-upgrade dump, 8 DDL, crash and independent SQL restore
        working-directory: private-p08
        shell: bash
        env:
          APP_ENV: testing
          APP_KEY: 'base64:QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI='
          SESSION_DRIVER: array
          CACHE_STORE: array
          P08_R43_DISPOSABLE_SCHEMA: 'YES'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: 'p08_r43_disposable_only_2026'
        run: bash tests/native/r43_rehearse_issued_v016_to_v018.sh
      - name: Remove all private source and temporary DB/backup bytes
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_PRIVATE_SOURCE_AND_BACKUP_CLEANUP=PASS
  r43-source-bound-archive:
    needs: identity-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Transient exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 690ed97d81eca9feba99e96a46b97302abef5c96
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo, pcntl
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete private runtime for deterministic DEV ZIP
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = 0.1.18
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --no-interaction --no-progress --prefer-dist > "$RUNNER_TEMP/p08-r43-composer-artifact.log" 2>&1 || { echo P08_R43_ARTIFACT_COMPOSER=FAIL; exit 1; }
          npm ci --silent > "$RUNNER_TEMP/p08-r43-npm-artifact.log" 2>&1 || { echo P08_R43_ARTIFACT_NPM=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-r43-vite-artifact.log" 2>&1 || { echo P08_R43_ARTIFACT_VITE=FAIL; exit 1; }
          echo P08_R43_FULLY_BUILT_DEV_RUNTIME=PASS
      - name: Download true published v016 FULL with private release-reader
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/p08-r43-issued"
          gh release download v0.1.16 --repo llhzx2018/vf-adops --pattern 'VF_AdOps_V0.1.16_FULL.zip' --dir "$RUNNER_TEMP/p08-r43-issued" > "$RUNNER_TEMP/p08-r43-issued-download.log" 2>&1 || { echo P08_R43_ISSUED_ASSET_RETRIEVAL=NOT_PROVEN; exit 1; }
          test "$(sha256sum "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" | cut -d' ' -f1)" = '7f6a3050db060448df391f0dc5a8a3a2de45c9f28a704cb76606694b82bd084f' || { echo P08_R43_ISSUED_ASSET_SHA=FAIL; exit 1; }
          echo P08_R43_ISSUED_OFFICIAL_016_FULL_SHA256=PASS
      - name: Negative guard + two reproducible schema-changing DEV ZIP builds
        shell: bash
        working-directory: private-p08
        env:
          GITHUB_ACTIONS: 'true'
          P08_R43_DISPOSABLE_SCHEMA: 'YES'
        run: |
          set -Eeuo pipefail
          set +x
          python3 -m unittest discover -s tests -p test_s9_r43_schema_dev_archive.py -q
          echo P08_R43_SCHEMA_ARCHIVE_NEGATIVES=PASS
          python3 scripts/build_s9_r43_schema_dev_archive.py --source . --issued-full "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" --target-sha "$TARGET_SHA" --output "$RUNNER_TEMP/p08-r43-dev-one.zip"
          python3 scripts/build_s9_r43_schema_dev_archive.py --source . --issued-full "$RUNNER_TEMP/p08-r43-issued/VF_AdOps_V0.1.16_FULL.zip" --target-sha "$TARGET_SHA" --output "$RUNNER_TEMP/p08-r43-dev-two.zip"
          cmp "$RUNNER_TEMP/p08-r43-dev-one.zip" "$RUNNER_TEMP/p08-r43-dev-two.zip" || { echo P08_R43_REPRODUCIBLE_DEV_ARCHIVE=FAIL; exit 1; }
          python3 - "$RUNNER_TEMP/p08-r43-dev-one.zip" <<'PY'
import json,sys,zipfile
with zipfile.ZipFile(sys.argv[1]) as z:
    names=z.namelist()
    m=json.loads(z.read("ATOMIC_MANIFEST.json"))
    assert m["type"]=="P08_SCHEMA_CHANGING_DEV_NOT_INSTALLABLE_V1"
    assert m["source_sha"]=="ed96b18627cd0a63b1da20a1fd8c9b6c1808f159"
    assert m["schema_changes"] is True and m["can_upgrade"] is False
    assert m["old_migrations"]==15 and m["new_migrations"]==23
    assert m["delta_migrations"]==8 and len(m["migrations"])==23
    assert m["requires_separately_verified_old_client_bridge"] is True
    assert sum(x.startswith("database/migrations/") for x in names)==23
    assert not any(x.startswith("storage/") or x=="public/setup.php" or x.endswith(".sql") or x.endswith(".sqlite") for x in names)
PY
          echo P08_R43_DETERMINISTIC_SOURCE_BOUND_DEV_ARCHIVE=PASS_NOT_INSTALLABLE
      - name: Remove all generated private sources and packages
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -rf -- "$RUNNER_TEMP"/p08-r43-*
          test ! -e private-p08
          echo P08_R43_ARCHIVE_SOURCE_AND_ARTIFACT_CLEANUP=PASS
