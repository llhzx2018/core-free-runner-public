name: P01 2.47.516 SHA256 MAJOR Owner-intent and D70 recovery (one-off)
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  exact-major-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      TARGET_VERSION: 2.47.516
      TARGET_SHA: e4eb37fc76c8bc8d9998a76be0438030dbdfe202
      OLD_SHA: ddd9d5dd0325772e2741d7a9e498b043e964c310
    steps:
      - name: Checkout registered ephemeral lane auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Source-bound test lane identity and archive audit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "test/p01-247516-sha-major-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-247516-sha-major.json > "$RUNNER_TEMP/p01-d70-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-247516-sha-major.json --input .github/workflows/p01-247516-sha-major-oneoff.yml > "$RUNNER_TEMP/p01-d70-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-d70-audit.txt" > /dev/null
          echo P01_SHA_MAJOR_LANE_IDENTITY=PASS
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Native PHP runtime and exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat candidate/VERSION)" = "$TARGET_VERSION"
          test "$(cat candidate/src/VERSION.txt)" = "$TARGET_VERSION"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-d70-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-curl >>"$RUNNER_TEMP/p01-d70-apt.txt" 2>&1
          echo P01_SHA_MAJOR_EXACT_SOURCE=PASS
      - name: Native PHP syntax for changed Owner and migration surface
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in             src/app/LegacyMajorOwnerHandoff.php             src/app/LegacyMajorStatusMethods.php             src/app/next/runtime/MajorMigrationTransaction.php             src/app/next/runtime/MajorOwnerOneUseClaim.php             src/app/next/runtime/CloudPanelManualHandoff.php             src/app/next/runtime/MajorMigrationSiteLayoutGate.php             tests/compatibility/laravel/run_d70_major_migration_transaction.php             tests/compatibility/laravel/http/p01_major_owner_one_use_claim.php; do
            php8.3 -l "candidate/$file" >"$RUNNER_TEMP/p01-d70-lint.txt" 2>&1 || {
              echo P01_SHA_MAJOR_PHP_SYNTAX=FAIL; exit 1;
            }
          done
          echo P01_SHA_MAJOR_PHP_SYNTAX=PASS
      - name: Actual isolated v515 Owner intent and one-use journal negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          php8.3 candidate/tests/unit/p01_d81_legacy_major_owner_gate_contract.php >"$RUNNER_TEMP/p01-d70-owner.txt" 2>&1 || {
            grep -E 'D81_|Fatal|Error|FAIL' "$RUNNER_TEMP/p01-d70-owner.txt" | head -n 10 || true
            echo P01_SHA_MAJOR_OWNER_PROOF=FAIL; exit 1;
          }
          php8.3 candidate/tests/compatibility/laravel/http/p01_major_owner_one_use_claim.php >>"$RUNNER_TEMP/p01-d70-owner.txt" 2>&1 || {
            grep -E 'MAJOR_|Fatal|Error|FAIL' "$RUNNER_TEMP/p01-d70-owner.txt" | tail -n 10 || true
            echo P01_SHA_MAJOR_ONE_USE_CLAIM=FAIL; exit 1;
          }
          grep -Fx 'P01_MAJOR_OWNER_ONE_USE_CLAIM_LOCAL_CONTRACT=PASS' "$RUNNER_TEMP/p01-d70-owner.txt"
          echo P01_SHA_MAJOR_AUTHENTIC_OWNER_AND_REPLAY_GUARDS=PASS
      - name: D70 complete transactional crash, preflight and SHA identity negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          P01_D70_ISOLATED_MIGRATION=YES php8.3 candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php matrix "$OLD_SHA" "$TARGET_SHA" >"$RUNNER_TEMP/p01-d70-matrix.txt" 2>&1 || {
            grep -E 'D70_|Fatal|Error|FAILED|FAIL' "$RUNNER_TEMP/p01-d70-matrix.txt" | tail -n 12 || true
            echo P01_SHA_MAJOR_D70_MATRIX=FAIL; exit 1;
          }
          grep -Fx 'P01_D70_FALSE_OFFICIAL_SHA256_RELEASE_PROOF_REFUSED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_SIGNED_ONLY_AND_WRONG_MODEL_REFUSED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_ACTUAL_PROCESS_EXIT_88_AND_OLD_RECOVERY=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_MAJOR_MIGRATION_TRANSACTION_NATIVE_MATRIX=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_REAL_CLOUDPANEL_PRIVILEGED_DOCROOT=NOT_PROVEN' "$RUNNER_TEMP/p01-d70-matrix.txt"
          echo P01_SHA_MAJOR_D70_SNAPSHOT_ROLLBACK_CRASH_AND_RELEASE_GATES=PASS
      - name: CloudPanel isolated layout, maintenance 503 and private guard checks
        shell: bash
        run: |
          set -Eeuo pipefail
          P01_D72_ISOLATED=YES php8.3 candidate/tests/compatibility/laravel/run_d72_major_migration_layout_gate.php >"$RUNNER_TEMP/p01-d70-layout.txt" 2>&1 || {
            echo P01_SHA_MAJOR_LAYOUT=FAIL; exit 1;
          }
          P01_MANUAL_HANDOFF_SIMULATED=YES php8.3 candidate/tests/compatibility/laravel/run_cloudpanel_manual_handoff.php >"$RUNNER_TEMP/p01-d70-handoff.txt" 2>&1 || {
            echo P01_SHA_MAJOR_HANDOFF=FAIL; exit 1;
          }
          php8.3 candidate/tests/compatibility/laravel/http/p01_major_maintenance_probe.php >"$RUNNER_TEMP/p01-d70-probe.txt" 2>&1 || {
            echo P01_SHA_MAJOR_MAINTENANCE=FAIL; exit 1;
          }
          grep -Fx 'P01_MAJOR_MAINTENANCE_HTTP_PROBE_LOCAL_CONTRACT=PASS' "$RUNNER_TEMP/p01-d70-probe.txt"
          grep -Fx 'P01_D72_LAYOUT_PRIVACY_GATE_PHASE_PASS=YES' "$RUNNER_TEMP/p01-d70-layout.txt"
          echo P01_SHA_MAJOR_CLOUDPANEL_ISOLATED_PROOF=PASS
      - name: Always purge private checkout and local test evidence
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-d70-*.txt
          echo P01_SHA_MAJOR_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_SHA_MAJOR_PUBLIC_ARTIFACTS=NONE
