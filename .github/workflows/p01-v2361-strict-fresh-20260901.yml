name: P01 V2.36.1 Strict Fresh
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-strict-fresh-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33473351744'
      FORMAL_ARTIFACT: p01-v2361-formal-artifacts-33473351744
      FORMAL: 23321270d79fc98d529c2c5a0ef07e0f1012835a
      FORMAL_TREE: 889d7662cf7907cc93d958c5df31f7824faa050a
      FORMAL_RUNTIME_TREE: 91f92c5d3e7080469a7f5ab1497145454014c87a
      SCHEMA: '2026082901'
      FULL_SHA: ea8abae0f971ad34568626848f620e7dc8debf1241dc981dd3ebb76f4a16f492
      UPDATE_SHA: ef9d772d1fec07ee81899a64bf2fd2fdce4ebed7cf8b2b45168301cc5c7fd2bf
      REPAIR_SHA: b63904bfda876b97e63a899affc0d39845fe31d4e38b830ed9c5df2738cf2c74
      DOWNLOAD: /tmp/p01-v2361-strict-download
      FRESH: /tmp/p01-v2361-strict-fresh
      EVID: /tmp/p01-v2361-strict-evidence
      COOKIE: /tmp/p01-v2361-strict.cookies
      PORT: '18471'
      ADMIN_PASS: V2361StrictFresh2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Exact Formal package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.1-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          test "$(sha256sum "$ART_DIR/VF-Start-V2.36.1-FULL.zip" | awk '{print $1}')" = "$FULL_SHA"
          test "$(sha256sum "$ART_DIR/VF-Start-V2.36.1-UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ART_DIR/VF_Start_V2.36.1_UPDATE.zip" | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum "$ART_DIR/repair-v2.36.1.php" | awk '{print $1}')" = "$REPAIR_SHA"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="23321270d79fc98d529c2c5a0ef07e0f1012835a" and .formal_tree=="889d7662cf7907cc93d958c5df31f7824faa050a" and .runtime_tree=="91f92c5d3e7080469a7f5ab1497145454014c87a" and .schema=="2026082901" and .migration==null and .added==[] and .removed==[] and (.changed|length)==10' "$ART_DIR/P01-V2.36.1-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.1
          grep -Fx "define('VF_VERSION', '2.36.1');" "$FRESH/app/bootstrap.php" >/dev/null
          for needle in public_view preview_return vf_fw_public_preview_requested vf-global-view-state vf-view-state 管理员视角 公开视角 查看公开版 返回管理; do
            ! grep -R -n -F "$needle" "$FRESH/api.php" "$FRESH/app/FunctionalWorkspace.php" "$FRESH/app/FunctionalWorkspaceCore.php" "$FRESH/app/FunctionalWorkspaceShell.php" "$FRESH/assets/frontend.css" "$FRESH/assets/workspace-domain-nav.css" "$FRESH/index.php" "$FRESH/start.php"
          done
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo P01_V2361_STRICT_FORMAL_BYTES=PASS | tee "$EVID/formal.txt"
      - name: Fresh install zero data and routing
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2361-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2361 Strict' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/database.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2361_STRICT_ZERO_DATA=PASS\nP01_V2361_STRICT_SQLITE=PASS\n";
          PHP
          : > "$EVID/http-codes.txt"
          for page in start.php channels.php watch.php topics.php; do code=$(curl -sS -o "$EVID/anon-${page%.php}.html" -w '%{http_code}' "http://127.0.0.1:$PORT/$page"); echo "anon-$page=$code" | tee -a "$EVID/http-codes.txt"; test "$code" = 200; done
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}" | tee "$EVID/login.json" | jq -e '.ok==true' >/dev/null
          curl -sS -D "$EVID/root.headers" -o /dev/null -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/"
          tr -d '\r' < "$EVID/root.headers" > "$EVID/root.headers.normalized"
          test "$(awk 'NR==1{print $2}' "$EVID/root.headers.normalized")" = 302
          grep -Fqx 'Location: home.php' "$EVID/root.headers.normalized"
          for page in home.php start.php channels.php watch.php topics.php update.php links-admin.php settings.php; do code=$(curl -sS -o "$EVID/auth-${page%.php}.html" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/$page"); echo "auth-$page=$code" | tee -a "$EVID/http-codes.txt"; test "$code" = 200; done
          printf 'P01_V2361_STRICT_ROOT_REDIRECT=PASS\nP01_V2361_STRICT_CORE_HTTP=PASS\n' | tee "$EVID/http.txt"
      - name: Packaged Chromium single-system contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2361-strict-pw; cd /tmp/p01-v2361-strict-pw
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser); test -n "$CHROME"
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const base='http://127.0.0.1:18471/';
          const pass='V2361StrictFresh2026';
          const bad=['管理员视角','公开视角','查看公开版','返回管理'];
          const routes=['start.php','channels.php','watch.php','topics.php'];
          const visibleCount=async(p,s)=>p.locator(s).evaluateAll(es=>es.filter(e=>{const r=e.getBoundingClientRect(),c=getComputedStyle(e);return r.width>0&&r.height>0&&c.display!=='none'&&c.visibility!=='hidden'}).length);
          const assert=(x,m)=>{if(!x)throw Error(m)};
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME});
            for(const width of [1440,390]){
              const anon=await b.newContext({viewport:{width,height:width===390?844:900}});const p=await anon.newPage();
              for(const route of routes){await p.goto(base+route,{waitUntil:'networkidle'});const t=await p.locator('body').innerText();for(const x of bad)assert(!t.includes(x),`anon legacy ${x} ${width} ${route}`);assert(await p.locator('a[href="links-admin.php"]').count()===0,`anon resource management DOM ${width} ${route}`);assert(await p.locator('a[href="settings.php"]').count()===0,`anon settings DOM ${width} ${route}`);assert(await p.locator('body').evaluate(e=>e.scrollWidth-e.clientWidth)<=1,`anon overflow ${width} ${route}`);}
              await anon.close();
              const auth=await b.newContext({viewport:{width,height:width===390?844:900}});let q=await auth.request.post(base+'api.php?action=login',{data:{password:pass}});assert(q.ok()&&(await q.json()).ok,'login');const a=await auth.newPage();
              for(const route of routes){await a.goto(base+route,{waitUntil:'networkidle'});const t=await a.locator('body').innerText();for(const x of bad)assert(!t.includes(x),`auth legacy ${x} ${width} ${route}`);assert(await a.locator('a[href="links-admin.php"]').count()>0,`auth resource management DOM ${width} ${route}`);assert(await a.locator('a[href="settings.php"]').count()>0,`auth settings DOM ${width} ${route}`);if(width===1440){assert(await visibleCount(a,'a[href="links-admin.php"]')>0,`resource management invisible desktop ${route}`);assert(await visibleCount(a,'a[href="settings.php"]')>0,`settings invisible desktop ${route}`);}assert(await a.locator('body').evaluate(e=>e.scrollWidth-e.clientWidth)<=1,`auth overflow ${width} ${route}`);await a.goto(base+route+'?public_view=1&preview_return=home.php',{waitUntil:'networkidle'});assert(await a.locator('a[href="links-admin.php"]').count()>0,`legacy query changed auth ${width} ${route}`);}
              await auth.close();
            }
            const c=await b.newContext({viewport:{width:1440,height:900}});let q=await c.request.post(base+'api.php?action=login',{data:{password:pass}});assert(q.ok()&&(await q.json()).ok,'terminal login');const p=await c.newPage();const status={ok:true,status:{current_version:'2.36.1',latest_version:'2.36.1',available:false,can_update:false,current_withdrawn:false,reason:'当前已经是最新版本。',update_priority:'normal',last_check_at:'2026-09-01T00:00:00Z',history:[],release_notes:{summary:'V2.36.1'}}};await p.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status)}));await p.goto(base+'update.php',{waitUntil:'networkidle'});await p.waitForTimeout(120);const m=await p.evaluate(()=>{const x=document.getElementById('installUpdate');return{current:document.getElementById('updateCurrent')?.textContent||'',latest:document.getElementById('updateLatest')?.textContent||'',state:document.getElementById('updateState')?.textContent||'',footer:document.querySelector('.vf-rail-footer')?.textContent||'',hidden:!!x?.hidden,disabled:!!x?.disabled,display:x?getComputedStyle(x).display:'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});assert(m.current==='V2.36.1'&&m.latest==='V2.36.1'&&m.footer==='VF Start · V2.36.1'&&m.hidden&&m.disabled&&m.display==='none'&&m.state.includes('最新')&&m.overflow<=1,'terminal '+JSON.stringify(m));
            await b.close();console.log('P01_V2361_STRICT_CHROMIUM=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME="$CHROME" node gate.cjs | tee "$EVID/chromium.txt"
          grep -Fx P01_V2361_STRICT_CHROMIUM=PASS "$EVID/chromium.txt"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2361_STRICT_FORMAL_BYTES=PASS "$EVID/formal.txt"
          grep -Fx P01_V2361_STRICT_ZERO_DATA=PASS "$EVID/database.txt"
          grep -Fx P01_V2361_STRICT_SQLITE=PASS "$EVID/database.txt"
          grep -Fx P01_V2361_STRICT_CORE_HTTP=PASS "$EVID/http.txt"
          grep -Fx P01_V2361_STRICT_CHROMIUM=PASS "$EVID/chromium.txt"
          printf 'P01_V2361_STRICT_FRESH_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nSINGLE_SYSTEM_AUTH=PASS\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2361-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2361-strict-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2361-strict.pid 2>/dev/null)" 2>/dev/null || true
