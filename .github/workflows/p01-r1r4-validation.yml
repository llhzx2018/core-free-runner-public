name: P01 R1-R4 exact source focused machine validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r1r4-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: 859408f65ed991707d60ef0f749b692e3f9b6a1b
      PRODUCT_REPO: llhzx2018/vf-start
    steps:
      - name: Checkout temporary isolated runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare PHP and Node runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mbstring php-sqlite3 php-curl php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring'
          node --version

      - name: Fetch exact private product main
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_sha="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C product checkout -q --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < product/VERSION)" = "2.47.395"
          test "$(tr -d ' \r\n' < product/src/VERSION.txt)" = "2.47.395"
          echo P01_R1R4_EXACT_MAIN=PASS

      - name: PHP and JS syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          for f in src/index.php src/app/FunctionalWorkspaceCore.php src/app/CourseCatalogPresentation.php src/app/ChannelLibraryPage.php src/app/FunctionalWorkspace.php src/app/ToolProductPage.php src/app/ToolSceneDetail.php tests/course_learning_brief_regression.php tests/unit/search_sort_stability_contract.php tests/integration/p01_public_home_layout_acceptance.php; do
            php -l "$f" >/dev/null
          done
          node --check src/assets/software-workspace.js
          node --check tests/unit/software_owner_guest_install_profiles_native.js
          echo P01_R1R4_SYNTAX=PASS

      - name: Focused R1 R2 R3 R4 runtime regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php tests/course_learning_brief_regression.php
          node tests/unit/software_owner_guest_install_profiles_native.js
          php tests/unit/search_sort_stability_contract.php
          php tests/integration/p01_public_home_layout_acceptance.php
          echo P01_R1R4_FOCUSED_RUNTIME=PASS

      - name: Related permission and navigation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php tests/unit/navigation_visibility_search_context_v247390_contract.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/tools_software_role_badges_v247390_contract.php
          php tests/unit/public_global_nav_contract.php
          echo P01_R1R4_PRIVACY_NAV=PASS

      - name: No production side effect
        run: echo P01_R1R4_PRODUCTION_UNCHANGED=PASS
