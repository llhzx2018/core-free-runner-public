name: TEMP P07 RC4 independent anonymous official asset proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-official-anonymous-20261126.yml
permissions:
  contents: read
jobs:
  anonymous:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-official-anonymous-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Independent anonymous official asset bytes, provenance, and stable pin
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN
          root="$RUNNER_TEMP/p07-rc4-anonymous"
          mkdir -m 700 "$root"
          cd "$root"
          base=https://github.com/llhzx2018/core-free-runner-public/releases/download
          api=https://api.github.com/repos/llhzx2018/core-free-runner-public
          tag=p07-m03-v0.1.0-release147-rc4-maintenance-20261125
          zip=P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip
          fetch() { curl -q --proto '=https' --tlsv1.2 -fsSL --retry 1 --connect-timeout 10 --max-time 100 "$@"; }
          fetch "$api/releases/tags/$tag" -o release.json
          fetch "$api/git/ref/tags/$tag" -o tag.json
          fetch "$api/releases/tags/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123" -o old.json
          python3 -B - <<'PY'
          import json
          r=json.load(open("release.json"))
          assert r["id"]==458797704 and r["draft"] is False and r["tag_name"]=="p07-m03-v0.1.0-release147-rc4-maintenance-20261125"
          assert json.load(open("tag.json"))["object"]["sha"]=="66ad1af3da009988d84e7dc4cd4badb5b1f4b650"
          expected={"P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip":(793699101,719295,"85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238"),"receipt.json":(793699098,2732,"dbe0a0e009153a6bacf2993ba2e79ad949f4c506332f1afe275a59d93bd22860"),"SHA256SUMS":(793699100,190,"f60cd0c6a6eeab3c0ee5cd2e1c810d43fa9462720635feac82c5375353cb8783")}
          assert len(r["assets"])==len(expected)
          for a in r["assets"]:
              i,n,h=expected[a["name"]]
              assert a["id"]==i and a["size"]==n and a["digest"]=="sha256:"+h and a["state"]=="uploaded"
              assert a["browser_download_url"]=="https://github.com/llhzx2018/core-free-runner-public/releases/download/"+r["tag_name"]+"/"+a["name"]
          old=next(a for a in json.load(open("old.json"))["assets"] if a["id"]==781359770)
          assert old["digest"]=="sha256:3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d"
          print("P07_RC4_ANONYMOUS_RELEASE_TAG_METADATA=PASS")
          PY
          for name in "$zip" receipt.json SHA256SUMS; do
            case "$name" in "$zip") id=793699101;; receipt.json) id=793699098;; SHA256SUMS) id=793699100;; esac
            if ! fetch "$base/$tag/$name" -o "$name"; then
              fetch -H 'Accept: application/octet-stream' "$api/releases/assets/$id" -o "$name"
            fi
          done
          fetch https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o toolbox.sh
          python3 -B - <<'PY'
          import hashlib,json,pathlib,zipfile
          h=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          z="P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip"
          expected="85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238"
          assert pathlib.Path(z).stat().st_size==719295 and h(z)==expected
          assert h("receipt.json")=="dbe0a0e009153a6bacf2993ba2e79ad949f4c506332f1afe275a59d93bd22860"
          assert h("SHA256SUMS")=="f60cd0c6a6eeab3c0ee5cd2e1c810d43fa9462720635feac82c5375353cb8783"
          rows=dict((name,sha) for sha,name in (x.split("  ",1) for x in pathlib.Path("SHA256SUMS").read_text().splitlines()))
          assert rows=={z:expected,"receipt.json":h("receipt.json")}
          receipt=json.load(open("receipt.json"))
          assert receipt["source_commit"]=="54c46dfa862a5c4a39020c1bd80a129bd992077b" and receipt["archive_sha256"]==expected
          assert receipt["public_candidate"]=="e6a3bbac7de26e9b37f179605dd308d1ac0a5a4c"
          with zipfile.ZipFile(z) as a:
              assert a.testzip() is None
              assert blob(a.read("dist/p07/0.1.0/overlay/RUNTIME.gitblob"))=="3ab5b43f6f9e3431872f96bbfbffc83733f5b6a4"
              assert blob(a.read("installers/p07-final.sh"))=="309e32a0acd3903b05b84f3204db07fb6f55d638"
              assert a.read("dist/p07/0.1.0/overlay/BUILD_ID")==b"0.1.0-release147-rc4\n"
          assert blob(pathlib.Path("toolbox.sh").read_bytes())=="45b37be100fd1ac1f3b15e445829956dc33a5ba9"
          print("P07_RC4_ANONYMOUS_OFFICIAL_BYTES_SHA256_AND_PROVENANCE=PASS")
          print("P07_RC4_OLD_ASSET_AND_CURRENT_PUBLIC_PIN_PRESERVED=PASS")
          PY
      - name: Remove temporary anonymous archive bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/p07-rc4-anonymous"
          test ! -e "$RUNNER_TEMP/p07-rc4-anonymous"
          echo P07_RC4_ANONYMOUS_PROOF_CLEAN=PASS
