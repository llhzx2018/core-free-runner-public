name: P02 V2.4.26 Formal Release Publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.26-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-library
      PRODUCT_REF: 9c62b0f348958777fdaba251316cd76a867358af
      TAG: v2.4.26
      UPDATE_NAME: VF_Library_V2.4.26_UPDATE.zip
      UPDATE_BYTES: '299595'
      UPDATE_SHA256: ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
      FULL_NAME: VF_Library_V2.4.26_FULL.zip
      FULL_BYTES: '305791'
      FULL_SHA256: 8c445ab8939dabf0ada1059cf77b3f0c7888d9cc62d64a199c5f5a3b0fd16b82
      ATOMIC_NAME: VF_Library_V2.4.26_ATOMIC.zip
      ATOMIC_BYTES: '439310'
      ATOMIC_SHA256: d9ee3fe780c8a5e78bc92d6b34b1979bd21ed867899fe088e102a5bf25e12096
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }
          test -n "$WRITE_TOKEN" || { echo VF_RELEASE_WRITE_TOKEN_MISSING; exit 79; }
          echo REGISTERED_RELEASE_CAPABILITIES=PASS

      - name: Checkout exact formal source transiently
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPOSITORY }}
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Rebuild exact deterministic release set
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = '2.4.26'
          TREE=$(git show -s --format=%T "$PRODUCT_REF")
          python3 scripts/build-release.py --out build/release --source-commit "$PRODUCT_REF" --source-tree "$TREE" --source-ref release/v2.4.26 >/dev/null
          test "$(stat -c %s "build/release/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "build/release/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c %s "build/release/$FULL_NAME")" = "$FULL_BYTES"
          test "$(sha256sum "build/release/$FULL_NAME" | awk '{print $1}')" = "$FULL_SHA256"
          test "$(stat -c %s "build/release/$ATOMIC_NAME")" = "$ATOMIC_BYTES"
          test "$(sha256sum "build/release/$ATOMIC_NAME" | awk '{print $1}')" = "$ATOMIC_SHA256"
          echo FORMAL_RELEASE_SET_IDENTITY=PASS

      - name: Publish or verify exact private GitHub Release
        working-directory: product
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS=YES
          else
            gh release create "$TAG" build/release/* \
              --repo "$PRODUCT_REPOSITORY" \
              --target "$PRODUCT_REF" \
              --title 'VF Library V2.4.26' \
              --notes-file build/release/VF_Library_V2.4.26_RELEASE_NOTES.md
            echo RELEASE_CREATED=YES
          fi

          gh release view "$TAG" --repo "$PRODUCT_REPOSITORY" --json databaseId,tagName,publishedAt,targetCommitish,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1]))
          assert x['tagName']=='v2.4.26' and x['isDraft'] is False and x['isPrerelease'] is False
          assets={a['name']:a for a in x.get('assets',[])}
          expected={
            os.environ['UPDATE_NAME']:int(os.environ['UPDATE_BYTES']),
            os.environ['FULL_NAME']:int(os.environ['FULL_BYTES']),
            os.environ['ATOMIC_NAME']:int(os.environ['ATOMIC_BYTES']),
            'VF_Library_V2.4.26_SOURCE.zip':375417,
            'repair-v2.4.26.php':584109,
            'VF_Library_V2.4.26_RELEASE_NOTES.md':495,
            'VF_Library_V2.4.26_RELEASE_MANIFEST.json':2621,
            'SHA256SUMS.txt':676,
          }
          assert set(assets)==set(expected),(set(assets),set(expected))
          for n,s in expected.items(): assert int(assets[n]['size'])==s,(n,assets[n]['size'],s)
          print('RELEASE_ID='+str(x['databaseId']))
          print('RELEASE_PUBLISHED_AT='+str(x['publishedAt']))
          print('RELEASE_ASSET_METADATA=PASS')
          PY

          TAG_SHA=$(gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          test "$TAG_SHA" = "$PRODUCT_REF"
          echo "TAG_SOURCE=$TAG_SHA"

          rm -rf "$RUNNER_TEMP/release-readback"; mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$TAG" --repo "$PRODUCT_REPOSITORY" --pattern "$UPDATE_NAME" --dir "$RUNNER_TEMP/release-readback"
          test "$(stat -c %s "$RUNNER_TEMP/release-readback/$UPDATE_NAME")" = "$UPDATE_BYTES"
          test "$(sha256sum "$RUNNER_TEMP/release-readback/$UPDATE_NAME" | awk '{print $1}')" = "$UPDATE_SHA256"
          echo REMOTE_UPDATE_ASSET_READBACK=PASS

      - name: Public-safe publication evidence
        if: always()
        run: |
          echo P02=VF_Library
          echo FORMAL_VERSION=2.4.26
          echo FORMAL_SOURCE=9c62b0f348958777fdaba251316cd76a867358af
          echo UPDATE_BYTES=299595
          echo UPDATE_SHA256=ccd4b1fbcfdff07feb69caa72c51bc3a3e8fe17e897325aab43cdaefbaac91b8
          echo PRIVATE_SOURCE_PERSISTED=NO
          echo PRODUCTION_WRITE=NO
