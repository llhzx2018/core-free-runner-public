name: TEMP P07 M03 RC4 exact merged main formal package and recovery gates
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m03-rc4-formal-final-main-20261125.yml
permissions:
  contents: read
jobs:
  p07-m03-recovery:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m03-rc4-formal-final-main-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PRODUCT_SHA: 'cc7c1fac53c120bd6d746208aaae83716aeb943b'
      PRODUCT_BASE: 'ff034074c728afa20d7899628428f6cd4792f96e'
      GOV_SHA: '74db859d21b0f93c7c2230d13eae9de8f0fd576a'
      RC3_SHA: '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d'
    steps:
      - name: Python 3.13 exact cache environment
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Checkout exact private M03 source only transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: cc7c1fac53c120bd6d746208aaae83716aeb943b
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout exact GOV architecture authority transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 74db859d21b0f93c7c2230d13eae9de8f0fd576a
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Source identity, architecture naming, and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C transient-p07 merge-base "$PRODUCT_BASE" "$PRODUCT_SHA")" = "$PRODUCT_BASE"
          cd transient-p07
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../transient-gov --git-root . \
            --base-sha "$PRODUCT_BASE" --head-sha "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import ast,pathlib
          for rel in ("scripts/p07_m03_rc3_recovery_bundle.py",
                      "lib/m03_trial_retirement.py",
                      "tests/test_p07_m03_rc3_recovery.py",
                      "tests/test_p07_m03_rc3_retirement_safety.py",
                      "scripts/p07_m03_rc3_upgrade_compat.py",
                      "tests/test_p07_m03_rc3_upgrade_compat.py",
                      "tests/test_p07_m03_rc3_real_installer.py"):
              ast.parse(pathlib.Path(rel).read_text(encoding="utf-8"),filename=rel)
          print("P07_M03_RC3_RECOVERY_SYNTAX=PASS")
          PY
          echo P07_M03_RC3_RECOVERY_EXACT_SOURCE_ARCH_AND_SYNTAX=PASS
      - name: Checkout public distribution exact current state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 7789eaf083bad6e3d0fce19982f930f30794e3e3
          path: transient-public
          persist-credentials: false
      - name: Verify stable sole-public-command baseline and old release safety
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-public rev-parse HEAD)" = 7789eaf083bad6e3d0fce19982f930f30794e3e3
          cd transient-public
          bash -n installers/p07-toolbox.sh
          python3 -B scripts/check_p07_public_install_contract.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_install_contract.py' -q
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc3"' installers/p07-toolbox.sh
          ! grep -q 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc4"' installers/p07-toolbox.sh
          echo P07_M03_PUBLIC_BASELINE_RC3_AND_UNIQUE_ENTRY=PASS
      - name: Download original official public M03 RC3 no private login
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          url='https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 2 --max-time 100 \
            "$url" -o "$RUNNER_TEMP/original-rc3.zip"
          printf '%s  %s\n' "$RC3_SHA" "$RUNNER_TEMP/original-rc3.zip" | sha256sum -c - >/dev/null
          echo P07_M03_GENUINE_ISSUED_RC3_ARCHIVE_SHA=PASS
      - name: Inspect exact issuer's old RC3 tar extras read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 -B - <<'PY'
          import hashlib,io,os,tarfile,zipfile
          path=os.path.join(os.environ["RUNNER_TEMP"],"original-rc3.zip")
          base="dist/p07/0.1.0-rc2/P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz"
          blob=lambda data: hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          with zipfile.ZipFile(path) as z:
              data=z.read(base)
          print("RC3_SIGNED_BASE_TAR_SHA256="+hashlib.sha256(data).hexdigest())
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as tf:
              for name in ("vf-server-ops/lib/policy.py","vf-server-ops/lib/ux.py"):
                  try:
                      info=tf.getmember(name)
                      if not info.isfile():
                          raise ValueError("RC3_ISSUED_SOURCE_NOT_REGULAR")
                      raw=tf.extractfile(info).read()
                      if not raw or len(raw)>8*1024*1024:
                          raise ValueError("RC3_ISSUED_SOURCE_SIZE_INVALID")
                      print("RC3_SIGNED_BASE_SOURCE_GITBLOB="+name.rsplit("/",1)[-1]+":"+blob(raw))
                  except KeyError:
                      print("RC3_SIGNED_BASE_SOURCE_MISSING="+name.rsplit("/",1)[-1])
          PY
      - name: Run comprehensive actual ZIP, retirement, rollback and M05 guard regressions
        shell: bash
        env:
          P07_M03_OFFICIAL_RC3: ${{ runner.temp }}/original-rc3.zip
          P07_M03_CANDIDATE_SHA: 'cc7c1fac53c120bd6d746208aaae83716aeb943b'
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          log="$RUNNER_TEMP/p07-m03-recovery-tests.log"
          if ! python3 -B -m unittest discover -s tests -p 'test_p07_m03_rc3_recovery.py' -q >"$log" 2>&1; then
            echo P07_M03_RECOVERY_SUITE=FAIL
            tail -n 16 "$log" | sed -E "s@/home/runner/work/[^/]+/[^/]+/@WORKSPACE/@g"
            grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$log" | head -22 || true
            grep -E '^(AssertionError|KeyError|ModuleNotFoundError|ImportError|ValueError|RuntimeError|TypeError|RecursionError):' "$log" | tail -12 || true
            exit 13
          fi
          grep -E '^Ran [0-9]+ tests?' "$log" | tail -1
          faultlog="$RUNNER_TEMP/p07-m03-retirement-faults.log"
          if ! python3 -B -m unittest discover -s tests             -p 'test_p07_m03_rc3_retirement_safety.py' -q >"$faultlog" 2>&1; then
            echo P07_M03_RETIREMENT_FAULT_INJECTION=FAIL
            grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$faultlog" | head -18 || true
            exit 14
          fi
          grep -E '^Ran [0-9]+ tests?' "$faultlog" | tail -1
          echo P07_M03_RETIREMENT_FAULT_INJECTION=PASS
          echo P07_M03_RC3_SIGNED_RC4_RETIRE_ROLLBACK_M05=PASS
          for suite in test_p07_m03_rc3_upgrade_compat.py test_p07_m03_rc3_real_installer.py; do
            log="$RUNNER_TEMP/$suite.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -q >"$log" 2>&1; then
              echo "P07_M03_RC3_TO_RC4_INSTALLER_DEV=FAIL:$suite"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$log" | head -18 || true
              grep -E '^(AssertionError|ValueError|TypeError|ModuleNotFoundError|ImportError|RC3UpgradeCompatBlocked|RC3RecoveryBlocked|SyntaxError):' "$log" | tail -12 || true
              if [[ "$suite" == "test_p07_m03_rc3_real_installer.py" ]]; then tail -n 55 "$log" | sed -E "s@/home/runner/work/[^/]+/[^/]+/@WORKSPACE/@g"; fi
              grep -E '^Ran [0-9]+ tests?' "$log" | tail -1 || true
              exit 16
            fi
            grep -E '^Ran [0-9]+ tests?' "$log" | tail -1
            echo "P07_M03_RC3_TO_RC4_INSTALLER_DEV=PASS:$suite"
          done
          echo P07_M03_RC3_TO_RC4_EXACT_INSTALLER_AND_ROLLBACK_DEV=PASS
      - name: Genuine developer candidate double build reproducibility
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py \
            --official "$RUNNER_TEMP/original-rc3.zip" --source . \
            --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-first.zip" \
            > "$RUNNER_TEMP/rc4-first.json"
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py \
            --official "$RUNNER_TEMP/original-rc3.zip" --source . \
            --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-second.zip" \
            > "$RUNNER_TEMP/rc4-second.json"
          cmp -s "$RUNNER_TEMP/rc4-first.zip" "$RUNNER_TEMP/rc4-second.zip"
          python3 -B - <<'PY'
          import json,os,pathlib,zipfile,hashlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=json.loads((root/"rc4-first.json").read_text())
          b=json.loads((root/"rc4-second.json").read_text())
          assert a==b
          assert a["source_sha"]==os.environ["PRODUCT_SHA"]
          assert a["candidate_build"]=="0.1.0-release147-rc4"
          assert not a["formal_release"] and not a["public_distribution"] and not a["production_applied"]
          assert not a["migration_tasks_mutated"]
          assert hashlib.sha256((root/"rc4-first.zip").read_bytes()).hexdigest()==a["candidate_sha256"]
          with zipfile.ZipFile(root/"rc4-first.zip") as z:
              assert z.testzip() is None
              assert z.read("dist/p07/0.1.0/overlay/BUILD_ID")==b"0.1.0-release147-rc4\n"
              assert "dist/p07/0.1.0/overlay/lib/policy.py" in z.namelist()
              assert "dist/p07/0.1.0/overlay/lib/ux.py" in z.namelist()
              assert "dist/p07/0.1.0/overlay/lib/m03_trial_retirement.py" in z.namelist()
          print("P07_M03_RC4_REPRODUCIBLE_SIGNED_DEV_BUNDLE=PASS")
          print("P07_M03_RC4_CANDIDATE_SHA256="+a["candidate_sha256"])
          PY
      - name: Formal M03 backup and independent restore negative gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          for suite in test_backup.py test_native_scratch_restore.py test_isolated_db_restore.py; do
            log="$RUNNER_TEMP/formal-$suite.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -q >"$log" 2>&1; then
              echo "P07_M03_FORMAL_BACKUP_RESTORE=FAIL:$suite"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+' "$log" | head -12 || true
              grep -E '^Ran [0-9]+ tests?' "$log" | tail -1 || true
              exit 21
            fi
            grep -E '^Ran [0-9]+ tests?' "$log" | tail -1
            echo "P07_M03_FORMAL_BACKUP_RESTORE=PASS:$suite"
          done
          python3 -B - <<'PY'
          import hashlib,os,pathlib,shutil,sqlite3,tempfile
          with tempfile.TemporaryDirectory(prefix="p07-m03-rc4-sqlite-",dir=os.environ["RUNNER_TEMP"]) as td:
              base=pathlib.Path(td)
              source,backup,restored,damaged=[base/name for name in
                  ("source.sqlite","backup.sqlite","restored.sqlite","corrupt.sqlite")]
              with sqlite3.connect(source) as db:
                  db.executescript("CREATE TABLE owned(id INTEGER PRIMARY KEY,label TEXT NOT NULL);"
                                   "INSERT INTO owned VALUES (1,'a'),(2,'b');")
                  with sqlite3.connect(backup) as db2: db.backup(db2)
              with sqlite3.connect(backup) as db:
                  rows=db.execute("SELECT * FROM owned ORDER BY id").fetchall()
                  assert rows==[(1,"a"),(2,"b")]
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              oldhash=hashlib.sha256(backup.read_bytes()).hexdigest()
              with sqlite3.connect(source) as db: db.execute("DELETE FROM owned WHERE id=1");db.commit()
              shutil.copyfile(backup,restored)
              with sqlite3.connect(restored) as db:
                  assert db.execute("SELECT * FROM owned ORDER BY id").fetchall()==rows
                  assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
              assert hashlib.sha256(restored.read_bytes()).hexdigest()==oldhash
              damaged.write_bytes(b"NOT SQLITE DATABASE")
              try:
                  with sqlite3.connect(damaged) as db: db.execute("PRAGMA integrity_check").fetchone()
              except sqlite3.DatabaseError:
                  pass
              else:
                  raise AssertionError("CORRUPTED_BACKUP_ACCEPTED")
          print("P07_M03_FORMAL_SYNTHETIC_SQLITE_ACTUAL_BACKUP_AND_RESTORE=PASS")
          PY
      - name: Erase private checkout, exact official bytes and all test data
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov" "$GITHUB_WORKSPACE/transient-public"
          rm -f -- "$RUNNER_TEMP"/original-rc3.zip "$RUNNER_TEMP"/rc4-first.zip \
            "$RUNNER_TEMP"/rc4-second.zip "$RUNNER_TEMP"/rc4-first.json \
            "$RUNNER_TEMP"/rc4-second.json "$RUNNER_TEMP"/p07-m03-recovery-tests.log "$RUNNER_TEMP"/p07-m03-retirement-faults.log "$RUNNER_TEMP"/test_p07_m03_rc3_*.py.log "$RUNNER_TEMP"/formal-test_*.py.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          test ! -e "$GITHUB_WORKSPACE/transient-public"
          echo P07_M03_RECOVERY_TRANSIENT_PRIVATE_BYTES_REMOVED=PASS
