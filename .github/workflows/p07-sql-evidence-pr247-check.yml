name: P07 PR247 SQL advisory redaction regression (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-sql-evidence-pr247-check.yml'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P07 feature head (public source, no secrets)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b771310b1fbfa4a39abd4bbf2708c081be30c25b
          persist-credentials: false
      - name: Exact head and Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = b771310b1fbfa4a39abd4bbf2708c081be30c25b
          python3 -m py_compile lib/sql_diff_evidence.py lib/verify.py lib/server_migration_pull.py tests/test_sql_diff_evidence.py tests/test_sql_diff_command.py
          echo P07_PR247_EXACT_SOURCE_SYNTAX_PASS
      - name: Focused diagnostic tests, existing safety regression
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=lib python3 -m unittest -v tests.test_sql_diff_evidence tests.test_sql_diff_command
          echo P07_PR247_DIAGNOSTIC_MACHINE_PASS
      - name: Ensure diagnostic does not modify migration verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:lib/verify.py)" = "$(git rev-parse f2239ccc3502c948d4955294378e275aea964385:lib/verify.py)"
          test "$(git rev-parse HEAD:lib/server_migration_pull.py)" = "$(git rev-parse f2239ccc3502c948d4955294378e275aea964385:lib/server_migration_pull.py)"
          test "$(git rev-parse HEAD:BUILD_ID)" = "$(git rev-parse f2239ccc3502c948d4955294378e275aea964385:BUILD_ID)"
          echo P07_PR247_NO_MIGRATION_GATE_CHANGE_PASS
