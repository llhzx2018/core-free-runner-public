name: P07 PR247 SQL advisory redaction regression (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-sql-evidence-pr247-check.yml'
      - 'experiments/p07-pr247/**'
permissions:
  contents: read
jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout P07 release104 public synthetic baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Stage immutable source hashes over published release104 baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          root=dist/p07/0.1.0/overlay
          test "$(cat "$root/BUILD_ID")" = "0.1.0-release104"
          test "$(git hash-object "$root/lib/verify.py")" = 57f2158b3dd0fa67b0da86b71599925abaa07a9e
          test "$(git hash-object "$root/lib/server_migration_pull.py")" = 30e90e5b478bd4715d626002643c2edf85ee596f
          test "$(git hash-object experiments/p07-pr247/sql_diff_evidence.py)" = 08cd0d4309eab3622c6701c313f9a6ba5743fc08
          test "$(git hash-object experiments/p07-pr247/test_sql_diff_evidence.py)" = 96d0d3a5ba0e7f7a69fb18f237ea3f48ac27322e
          mkdir -p "$RUNNER_TEMP/p07-pr247"
          cp -a "$root"/. "$RUNNER_TEMP/p07-pr247/"
          cp experiments/p07-pr247/sql_diff_evidence.py "$RUNNER_TEMP/p07-pr247/lib/sql_diff_evidence.py"
          cp experiments/p07-pr247/test_sql_diff_evidence.py "$RUNNER_TEMP/p07-pr247/tests/test_sql_diff_evidence.py"
          echo P07_PR247_EXACT_BYTES_STAGED_PASS
      - name: Exact Python syntax and focused redacted diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-pr247"
          python3 -m py_compile lib/sql_diff_evidence.py lib/verify.py lib/server_migration_pull.py tests/test_sql_diff_evidence.py tests/test_sql_diff_command.py
          PYTHONPATH=lib python3 -m unittest -v tests.test_sql_diff_evidence tests.test_sql_diff_command
          echo P07_PR247_SQL_DIAGNOSTIC_TESTS_PASS
      - name: Confirm no source or production mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat "$RUNNER_TEMP/p07-pr247/BUILD_ID")" = "0.1.0-release104"
          echo P07_PR247_PUBLISHED_SOURCE_GUARDS_UNCHANGED
