name: P07 Release27 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release27-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Release27 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release27'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release27"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release27"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="ef2263f95198fe529f0db20aa6c8a220422e7c72"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="558ba61b71be7e28f245dac71520ef1bea5201ce"' installers/p07.sh

      - name: Exact manifests
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path: Path) -> str:
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name in ('RUNTIME.gitblob','MANIFEST.gitblob'):
              for line in (root/name).read_text(encoding='utf-8').splitlines():
                  if not line.strip():
                      continue
                  expected, rel=line.split('  ',1)
                  path=root/rel
                  assert path.is_file(), (name, rel)
                  assert blob(path)==expected, (name, rel, blob(path), expected)
          PY

      - name: Local whole-site switch contract
        run: |
          set -Eeuo pipefail
          ui='dist/p07/0.1.0/overlay/bin/vfops-migrate-ui'
          engine='dist/p07/0.1.0/overlay/lib/server_migration_pull.py'
          grep -Fq '当前服务器网站开关' "$ui"
          grep -Fq '开启这台服务器全部网站' "$ui"
          grep -Fq '停止这台服务器全部网站' "$ui"
          grep -Fq '不需要输入 IP' "$ui"
          grep -Fq 'local-nginx-status' "$ui"
          grep -Fq 'local-nginx-start' "$ui"
          grep -Fq 'local-nginx-stop' "$ui"
          python3 - <<'PY'
          from pathlib import Path
          text=Path('dist/p07/0.1.0/overlay/bin/vfops-migrate-ui').read_text(encoding='utf-8')
          start=text.index('old_server_nginx_control()')
          end=text.index('select_existing_migration()', start)
          ordinary=text[start:end]
          for forbidden in ('read_old_ip','OLD_SERVER_IP','ensure_source_access','source_args'):
              assert forbidden not in ordinary, forbidden
          PY
          grep -Fq '["systemctl", "start", "nginx"]' "$engine"
          grep -Fq '["systemctl", "stop", "nginx"]' "$engine"
          ! grep -Fq '["systemctl", "start", "clp-nginx"]' "$engine"
          ! grep -Fq '["systemctl", "stop", "clp-nginx"]' "$engine"

      - name: Syntax and targeted tests
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          bash -n "$root/bin/vfops"
          bash -n "$root/bin/vfops-migrate-ui"
          python3 -m py_compile "$root/lib/server_migration_pull.py"
          cd "$root"
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q             tests.test_menu3_modular             tests.test_server_migration_pull             tests.test_p07_integration_manifest             tests.test_user_entry

      - name: Isolated install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release27'

      - name: Safety
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          ! grep -R -n -E 'systemctl[[:space:]]+(start|stop|restart)[[:space:]]+clp-nginx' "$root/bin" "$root/lib"
          grep -Fq 'DNS 不自动修改' "$root/bin/vfops-migrate-ui"
          grep -Fq '旧服务器永不自动删除' "$root/bin/vfops-migrate-ui"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE27_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
          echo 'P07_REAL_SERVER_NGINX_SWITCH=NOT_RUN'
