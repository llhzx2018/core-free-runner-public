name: P02 One-Time Private Read Token Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-private-token-seal.yml'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      VF_SEAL_PUBLIC_KEY_B64: WVbyVNFVU8EjFMQBueWEC6APSz2JKvNxQvTLqnmMc0w=
    steps:
      - name: Require existing unified read token
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN"
          test -n "$VF_SEAL_PUBLIC_KEY_B64"
      - name: Seal token without exposing plaintext
        shell: bash
        run: |
          set -Eeuo pipefail
          php -r '
          $token=(string)getenv("VF_PRIVATE_READ_TOKEN");
          $pk=base64_decode((string)getenv("VF_SEAL_PUBLIC_KEY_B64"),true);
          if($token===""||!is_string($pk)||strlen($pk)!==SODIUM_CRYPTO_BOX_PUBLICKEYBYTES)throw new RuntimeException("seal input invalid");
          $sealed=sodium_crypto_box_seal($token,$pk);
          echo "VF_P02_SEALED_TOKEN_B64=".base64_encode($sealed).PHP_EOL;
          echo "VF_P02_SEAL_OK".PHP_EOL;
          '
