name: P08 v0.1.11 DEV issued v0.1.10 to candidate native 3DB
on:
  pull_request:
    paths:
      - .github/workflows/p08-v011-candidate-3db.yml
      - scripts/p08_v011_candidate_native.sh
permissions:
  contents: read
jobs:
  official-full-to-exact-next-atomic:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v011-ux-candidate-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: b86d5a58386cce3f35b5f9c6d6c2f1ec3de77e9c
      TARGET_VERSION: '0.1.11'
      TARGET_SHA: b86d5a58386cce3f35b5f9c6d6c2f1ec3de77e9c
      TARGET_TREE: 675c73951b42adeaf5d52de8af836baaa616437c
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
    steps:
      - name: Checkout exact isolated Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 v0.1.11 candidate without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b86d5a58386cce3f35b5f9c6d6c2f1ec3de77e9c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Verify isolated one-shot job is pinned to exact unissued candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = b86d5a58386cce3f35b5f9c6d6c2f1ec3de77e9c
          test "$(cat p08/VERSION)" = 0.1.11
          echo P08_V011_DEV_CANDIDATE_PIN=PASS
      - name: Checkout canonical Source Current for real FULL structural gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 locked packages and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native SQL dump and sqlite tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
      - name: Verify exact DEV candidate without claiming formal issuance authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat p08/VERSION)" = 0.1.11
          test "$(git -C p08 rev-parse HEAD)" = b86d5a58386cce3f35b5f9c6d6c2f1ec3de77e9c
          test "$(git -C p08 rev-parse HEAD^{tree})" = 675c73951b42adeaf5d52de8af836baaa616437c
          test "$(git -C gov rev-parse HEAD)" = 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          echo P08_V011_DEV_SOURCE_IDENTITY=PASS
      - name: Real official v0.1.10 FULL install then candidate Atomic switch rollback and hard-crash recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          P08_R187_ISOLATED=YES php p08/tests/test_owner_future_one_click.php
          bash scripts/p08_v011_candidate_native.sh ${{ matrix.kind }}
      - name: Destroy all private checkouts and temporary real packages
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r196-${{ matrix.kind }}" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-kill"
          test ! -e p08 && test ! -e gov
