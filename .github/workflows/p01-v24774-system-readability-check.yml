name: p01-v24774-system-readability-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24774-system-readability-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: cf0f4574ac1096a3d3e1c4733a6603c073a0d277
      BASE_TAG: v2.47.73
      VERSION: 2.47.74
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact candidate and baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.73"
          echo P01_V24774_EXACT_SOURCE=PASS

      - name: Focused System readability contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/jobs.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/admin_system_group_readability_r82_contract.php
          php candidate/tests/unit/admin_scheduled_tasks_center_contract.php
          php candidate/tests/unit/admin_system_group_polish_r69_contract.php
          php candidate/tests/unit/admin_secondary_nav_focus_contract.php
          php candidate/tests/unit/engineering_consistency_r80_contract.php
          echo P01_V24774_SYSTEM_READABILITY_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-v24774-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-v24774-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-v24774-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-v24774-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-v24774-canonical.txt
          echo P01_V24774_CANONICAL=PASS
