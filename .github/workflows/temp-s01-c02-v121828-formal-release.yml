name: TEMP S01-C02 Ops 1.21.828 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121828-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121828-formal-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      COMMIT: 5f6ec86cff40b007084909536efd71db4a27777a
      TREE: 8fa3c9be948f263dbb962e685c22660fa9776735
      TAG: v1.21.828
      ASSET: vf-tools-ops_V1.21.828.zip
      BYTES: '3250584'
      SHA256: 725c397b5d80f8223473795cc7aa39433a7f09d695945767b2fd60ce0232664b
      FILES: '910'
      FP: f0fae86b2db9ff5c3372b61cacbed7ac7fcc95424bacad86caf8806ba3cdb81c
    steps:
      - name: Verify authority gates and release absence
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$TREE"
          done
          test "$(curl -sS -o /tmp/release.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")" = 404
          test "$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")" = 404
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          python3 - <<'PY'
          import re,hashlib,zipfile,os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
            p=r.as_posix(); q=p.split('/')
            if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
            if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
            if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
            return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
            if s.is_file() and not s.is_symlink():
              r=s.relative_to(root)
              if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
            for r,b in files.items():
              info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          assert z.stat().st_size == int(os.environ['BYTES'])
          assert hashlib.sha256(z.read_bytes()).hexdigest() == os.environ['SHA256']
          assert len(files) == int(os.environ['FILES'])
          assert fp.hexdigest() == os.environ['FP']
          PY
          unzip -tq "/tmp/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          VF Tools Ops V1.21.828 closes the WP-Cron runtime dependency gap in trusted Static Source recovery.

          - Focused Gate 33984457617 PASS on exact source 5f6ec86cff40b007084909536efd71db4a27777a / tree 8fa3c9be948f263dbb962e685c22660fa9776735; Artifact Identity 33984501543 PASS.
          - Recovery cron now loads the exact full publish ZIP execution graph before calling the existing V1.21.814 worker; ordinary admin GET remains lightweight.
          - Existing trusted-source SHA authority, inspect-only pipeline, release prepare, Candidate promotion and unchanged Final Audit remain authoritative.
          - Safe public telemetry exposes only recovery status/stage/classification, never job id, source path/name, SHA or raw error text.
          - No Source ZIP upload is required; no WordPress source content is mutated; Candidate/package/finalOnline PASS is never forced.
          - V1.21.826 route normalization and V1.21.827 failed-Candidate source rebind remain unchanged and regression-tested.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema, content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.828.zip; 3250584 bytes; SHA256 725c397b5d80f8223473795cc7aa39433a7f09d695945767b2fd60ce0232664b; runtime files 910; fingerprint f0fae86b2db9ff5c3372b61cacbed7ac7fcc95424bacad86caf8806ba3cdb81c.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/$ASSET" --repo "$PRODUCT_REPO" --target "$COMMIT" --title 'VF Tools Ops v1.21.828' --notes-file /tmp/release-notes.md
