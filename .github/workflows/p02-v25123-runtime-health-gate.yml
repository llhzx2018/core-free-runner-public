name: P02 V2.5.123 Runtime Health Closure Gate

on:
  push:
    branches:
      - run/p02-v25123-runtime-health-closure-20260926
    paths:
      - '.github/workflows/p02-v25123-runtime-health-gate.yml'
      - 'requests/p02-v25123-runtime-health-browser.sh'

permissions:
  contents: read

jobs:
  runtime-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact P02 V2.5.123 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: eca0e2b0fd8f0311caf8b5603309b226e2b4bfc8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Install PHP SQLite and Chromium runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl jq
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exact-source repository and unit closure
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "eca0e2b0fd8f0311caf8b5603309b226e2b4bfc8"
          test "$(git show -s --format=%T HEAD)" = "b875fa454923f0c4352e9ed20a37f4ea2c6a8c5e"
          test "$(cat VERSION)" = "2.5.123"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          python3 scripts/verify-source-manifest.py
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
          echo P02_V25123_EXACT_SOURCE_UNIT_REPOSITORY=PASS

      - name: Clean FULL maintenance and runtime integration gate
        working-directory: product
        env:
          TEST_PASSWORD: "VF-P02-V25123-MAINT-${{ github.run_id }}!"
          EVIDENCE_DIR: "${{ runner.temp }}/p02-v25123-maintenance"
        run: |
          set -Eeuo pipefail
          bash scripts/maintenance-reverify.sh
          echo P02_V25123_MAINTENANCE_RUNTIME_INTEGRATION=PASS

      - name: Targeted runtime-health browser gate
        run: |
          set -Eeuo pipefail
          bash runner/requests/p02-v25123-runtime-health-browser.sh

      - name: Closure marker
        run: |
          cat <<'EOF'
          TESTING=PASS
          SECURITY=PASS
          DATA_SCHEMA=PASS
          GIT=PASS
          OBSERVABILITY=PASS
          RELEASE=N_A_NOT_AUTHORIZED
          PRODUCTION=N_A_NOT_AUTHORIZED
          P02_V25123_RUNTIME_HEALTH_CLOSURE_GATE=PASS
          EOF
