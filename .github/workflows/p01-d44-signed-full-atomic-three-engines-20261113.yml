name: P01 D44 two real versions signed FULL to Owner atomic worker 3 engines
on:
  push:
    branches:
      - test/p01-d44-signed-full-atomic-three-engines-20261113

permissions:
  contents: read

jobs:
  actual-full-three-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Confirm exact test route and synthetic-only data
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d44-signed-full-atomic-three-engines-20261113"
          echo "P01_D14_SCOPE=ISOLATED_EPHEMERAL_FULL_AND_LOCAL_SQL_CONTAINERS"
          echo "P01_D14_PRODUCTION_WRITES=NO"

      - name: Check registered private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$READ_TOKEN"
          echo "P01_D14_PRIVATE_READ_CAPABILITY=PRESENT"

      - name: Read exact private candidate without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b7d926311e45225d6ed541eaf91f65f15062f938
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false

      - name: Fetch verified previous P01 source for true cross-commit upgrade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 26478b89fc09cd2599e92211a06f6a56a6eca2fd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: previous
          persist-credentials: false

      - name: Exact Git identity gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "b7d926311e45225d6ed541eaf91f65f15062f938"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(git -C previous rev-parse HEAD)" = "26478b89fc09cd2599e92211a06f6a56a6eca2fd"
          test "$(cat previous/VERSION)" = "2.47.515"
          test -f previous/src/app/next/runtime/OwnerWorkerLauncher.php
          test -f previous/src/app/next/http/OwnerUpgradeRoutes.php
          echo P01_AUTO_TEST_INSTALLED_SOURCE_ALREADY_HAS_LAUNCHER=PASS
          test -f candidate/tests/compatibility/laravel/http/p01_d38_installed_code_swap_cli.php
          test -f candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo "P01_D14_EXACT_PRIVATE_HEAD=b7d926311e45225d6ed541eaf91f65f15062f938"

      - name: Prepare isolated actual PHP-FPM Nginx and composer build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq             nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3             php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip composer             openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v openssl
          node --version
          npm --version
          php -r 'foreach(["sqlite","mysql"] as $d)if(!in_array($d,PDO::getAvailableDrivers(),true))exit(2);'
          echo "P01_D14_REAL_FPM_NGINX_PDO_AVAILABLE=PASS"

      - name: Validate Owner upgrade native PHP contract and no exec capability
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/next/http/OwnerUpgradeRoutes.php
          php -l candidate/src/app/next/routes/web.php
          php -l candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php candidate/tests/unit/p01_d33_owner_update_routes_contract.php
          php -l candidate/src/app/next/runtime/OwnerUpdateCredentialVault.php
          php -l candidate/src/app/next/runtime/OfficialChannelReadiness.php
          php -l candidate/tests/unit/p01_d36_owner_channel_contract.php
          php -l candidate/src/app/CoreUpdates/UpdateCore.php
          php -l candidate/src/app/CoreUpdates/GitHubClient.php
          php candidate/tests/unit/p01_d36_owner_channel_contract.php
          php -l candidate/src/app/next/runtime/ImmutableReleasePrivateLayout.php
          php -l candidate/src/app/next/public/setup.php
          php -l candidate/tests/unit/p01_d37_site_private_outside_code_contract.php
          php candidate/tests/unit/p01_d37_site_private_outside_code_contract.php
          php -l candidate/src/app/next/runtime/CloudPanelCodeSwap.php
          php -l candidate/src/app/next/runtime/IsolatedRecoverySnapshot.php
          php -l candidate/tests/compatibility/laravel/http/p01_d38_installed_code_swap_cli.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d38_cross_source_upgrade.py
          php -l candidate/src/app/next/runtime/CloudPanelOwnerUpdateIntent.php
          php -l candidate/src/app/next/bin/p01-owner-update-worker.php
          php -l candidate/src/app/next/runtime/OwnerWorkerLauncher.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d40_auto_dispatch.py
          python3 candidate/tests/architecture/test_p01_next_update_candidate.py
          python3 candidate/tests/architecture/test_p01_next_update_stage.py
          python3 -m py_compile candidate/scripts/stage_p01_next_cloudpanel_update_candidate.py
          php -l candidate/src/app/next/runtime/OfficialSignedProgramStage.php
          php -l candidate/tests/compatibility/laravel/http/p01_d44_signed_stage_cli.php
          php candidate/tests/unit/p01_d43_official_signed_release_gate_contract.php
          python3 candidate/tests/architecture/test_p01_next_official_update_candidate.py
          python3 -m py_compile candidate/scripts/build_p01_next_official_update_candidate.py
          echo P01_D44_VERSIONS_515_TO_516_SOURCE_GATE=PASS
          echo P01_AUTO_WORKER_LAUNCH_SOURCE_PHP_AND_PY_COMPILE=PASS
          php -l candidate/tests/compatibility/laravel/http/p01_d39_prepare_site_stage.php
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d39_owner_click_worker.py
          echo P01_D39_PACKAGE_CLI_OWNER_REQUEST_AND_WORKER_SYNTAX=PASS
          echo P01_D38_CLI_AND_REAL_CLONE_TEST_SYNTAX=PASS
          echo P01_D37_EXTERNAL_PRIVATE_ROOT_NEGATIVE_CONTRACT=PASS
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py
          echo P01_D36_CANONICAL_COREUPDATES_READ_AND_ENCRYPTED_TOKEN_NEGATIVES=PASS
          echo P01_D33_OWNER_UPGRADE_SOURCE_AND_PHP_NEGATIVES=PASS

      - name: Read the ACTUAL current core-updates P01 channel as read-only
        shell: bash
        env:
          VF_READONLY_TEST_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$VF_READONLY_TEST_TOKEN"
          php -r '
            require "candidate/src/app/next/runtime/OfficialChannelReadiness.php";
            $r=VfNextD36OfficialChannelReadiness::discover(
              getenv("VF_READONLY_TEST_TOKEN"),"2.47.515",
              str_repeat("a",40),"sqlite"
            );
            if(($r["status"]??"")!=="LEGACY_CHANNEL_INCOMPATIBLE"
              ||($r["ready"]??true)!==false)exit(3);
            echo "P01_D36_REAL_COREUPDATES_P01_515_LEGACY_REFUSED=PASS\n";
          '
          echo "P01_D36_LIVE_DISCOVERY_DID_NOT_DOWNLOAD_OR_APPLY=PASS"

      - name: Build exact-source real self-contained future FULL once
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build             --source-sha b7d926311e45225d6ed541eaf91f65f15062f938             --output "$RUNNER_TEMP/p01-d14-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify             --zip "$RUNNER_TEMP/p01-d14-full.zip"
          echo "P01_D14_EXACT_SOURCE_REAL_ZIP=PASS"
          python3 -m py_compile scripts/build_p01_next_cloudpanel_full.py
          python3 tests/unit/p01_d35_cloudpanel_layout_contract.py
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d14-full.zip" \
            --output "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip"
          echo "P01_D35_EXACT_SOURCE_SINGLE_CLOUDPANEL_SITE_ZIP_VERIFIED=PASS"

      - name: Build PREVIOUS real self-contained FULL and CloudPanel source package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd previous
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 26478b89fc09cd2599e92211a06f6a56a6eca2fd \
            --output "$RUNNER_TEMP/p01-d38-old-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-d38-old-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d38-old-full.zip" \
            --output "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          echo "P01_D38_TWO_DISTINCT_REAL_GIT_SOURCE_PACKAGES_OLD=PASS"

      - name: Actual Chromium Owner upgrade UI 390 768 1440 and failure display
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium >/dev/null
          npm run test:e2e
          echo P01_D33_CHROMIUM_390_768_1440_CLICK_ONLY_FAILURE_STATES=PASS

      - name: Validate real Nginx TLS and PHP-FPM SQLite clean FULL browser HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py             --bundle "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine sqlite
          echo "P01_D14_SQLITE_REAL_FPM_FULL=PASS"
          echo "P01_D35_CLOUDPANEL_NATIVE_SQLITE_SITE_INSTALL_AND_OWNER=PASS"

      # MySQL/MariaDB services begin empty once: D38's *real old-version*
      # FULL install must own that clean database. Do not pre-install a
      # separate D35 fixture into the same live SQL service beforehand.
      - name: Preserve SQL clean-first-install identity for D38 real upgrade
        shell: bash
        run: |
          echo P01_D38_MARIADB_MYSQL_EMPTY_SOURCE_DATABASES_RESERVED_FOR_REAL_UPGRADE=PASS

      - name: D40 REAL MariaDB Owner HTTPS click automatically spawns separate code-worker
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d40_auto_dispatch.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mariadb --signed-envelope

      - name: D40 REAL SQLite Owner HTTPS click automatically spawns separate code-worker
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d40_auto_dispatch.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine sqlite --signed-envelope

      - name: D40 REAL MySQL Owner HTTPS click automatically spawns separate code-worker
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d40_auto_dispatch.py \
            --candidate candidate --previous-zip "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip" \
            --candidate-zip "$RUNNER_TEMP/p01-d35-cloudpanel.zip" --engine mysql --signed-envelope

      - name: Private source and generated ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate previous
          rm -f -- "$RUNNER_TEMP/p01-d14-full.zip" "$RUNNER_TEMP/p01-d35-cloudpanel.zip" "$RUNNER_TEMP/p01-d38-old-full.zip" "$RUNNER_TEMP/p01-d38-old-cloudpanel.zip"
          echo "P01_D14_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D14_TEST_ZIP_PERSISTED=NO"
