name: P07 Release10 Beginner UI Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release10-beginner-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release10 identity
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = '0.1.0-release10'
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release10"' installers/p07-toolbox.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release10"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="49a5e437a25a3ed35c3b160b2058cf587195319a"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="6bdbef8282a1532a35aa3928ec7ea605a9160611"' installers/p07.sh

      - name: Verify runtime manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          def blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          rows=[]
          for line in (root/'RUNTIME.gitblob').read_text().splitlines():
              if not line.strip(): continue
              h,p=line.split('  ',1); rows.append((h,p))
          for h,p in rows:
              path=root/p
              assert path.is_file(), p
              assert blob(path)==h, (p,blob(path),h)
          PY

      - name: Beginner menu contracts
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq '服务器与网站概况' "$root/bin/vfops-user"
          grep -Fq '自动备份 / 异地备份' "$root/bin/vfops-user"
          grep -Fq '面板管理（CloudPanel）' "$root/bin/vfops-user"
          grep -Fq '新服务器初始化' "$root/bin/vfops-user"
          grep -Fq '设置 / 检查异地备份' "$root/bin/vfops-auto-backup"
          grep -Fq 'HTTPS 证书状态' "$root/bin/vfops-cloudpanel-ui"
          grep -Fq '面板登录安全' "$root/bin/vfops-cloudpanel-ui"
          grep -Fq '两步验证（2FA）' "$root/lib/cloudpanel_ui_admin.sh"
          grep -Fq '远程连接与文件同步组件（SSH / rsync）' "$root/bin/vfops-migrate-ui"
          grep -Fq 'P07 · 异地备份设置' "$root/bin/vfops-storage-setup"
          grep -Fq '虚拟内存（Swap）' "$root/bin/vfops-init-ui"

      - name: Focused regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q \
            tests.test_terminal_ui_color_contract \
            tests.test_cloudpanel_ui_complete \
            tests.test_storage_onboarding_ux \
            tests.test_auto_backup \
            tests.test_auto_backup_run_now_ux \
            tests.test_first_verify_before_scheduler \
            tests.test_menu3_modular

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release10'
          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE10_BEGINNER_DISTRIBUTION_GATE=PASS'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
