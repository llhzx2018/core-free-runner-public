name: P08 one-time independent Ed25519 issuer bootstrap (no release)
on:
  push:
    branches: [test/p08-issuer-provision-once-20261113]
permissions:
  contents: read
concurrency:
  group: p08-adops-011-issuer-once
  cancel-in-progress: false
jobs:
  provision-isolated-signing-secret:
    if: ${{ github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/test/p08-issuer-provision-once-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: sodium,curl
      - name: Issue a standalone Ed25519 identity inside memory and persist only to a GitHub Actions Secret
        shell: bash
        env:
          P08_SIGNER_PROVISION_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          function blocked(string $code): never {fwrite(STDERR, 'P08_ISSUER_BOOTSTRAP_BLOCKED='.$code."\n");exit(2);}
          if (PHP_SAPI!=='cli' || !extension_loaded('sodium') || !extension_loaded('curl')
              || getenv('GITHUB_REPOSITORY')!=='llhzx2018/core-free-runner-public'
              || getenv('GITHUB_REF')!=='refs/heads/test/p08-issuer-provision-once-20261113'
              || getenv('GITHUB_EVENT_NAME')!=='push') blocked('SOURCE_OR_RUNTIME_SCOPE');
          $token=getenv('P08_SIGNER_PROVISION_TOKEN');
          if (!is_string($token)||strlen($token)<20) blocked('PROTECTED_WRITE_TOKEN_UNAVAILABLE');
          $repo='llhzx2018/core-free-runner-public';
          $name='P08_ADOPS_RELEASE_ED25519_SECRETKEY_HEX';
          $api='https://api.github.com/repos/'.$repo.'/actions/secrets';
          function request(string $url,string $token,string $method='GET',?string $body=null): array {
              $h=curl_init($url);
              if ($h===false) blocked('API_INIT');
              $opts=[
                  CURLOPT_RETURNTRANSFER=>true, CURLOPT_FOLLOWLOCATION=>false,
                  CURLOPT_CONNECTTIMEOUT=>5, CURLOPT_TIMEOUT=>15,
                  CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,
                  CURLOPT_HTTPHEADER=>['Authorization: Bearer '.$token,
                     'Accept: application/vnd.github+json',
                     'X-GitHub-Api-Version: 2022-11-28',
                     'User-Agent: VF-P08-Owner-Signer-Onetime'],
              ];
              if($method!=='GET') {
                  $opts[CURLOPT_CUSTOMREQUEST]=$method;
                  $opts[CURLOPT_POSTFIELDS]=$body;
                  $opts[CURLOPT_HTTPHEADER][]='Content-Type: application/json';
              }
              curl_setopt_array($h,$opts);
              $response=curl_exec($h);
              $status=(int)curl_getinfo($h,CURLINFO_RESPONSE_CODE);
              curl_close($h);
              return [$status,is_string($response)?$response:''];
          }
          [$existing,$ignore]=request($api.'/'.$name,$token);
          if($existing===200) blocked('ALREADY_EXISTS_NO_AUTOROTATE');
          if($existing!==404) blocked('SECRET_METADATA_PERMISSION_OR_API_'.$existing);
          [$http,$response]=request($api.'/public-key',$token);
          if($http!==200) blocked('SECRET_PUBLIC_KEY_PERMISSION_OR_API_'.$http);
          try{$decoded=json_decode($response,true,16,JSON_THROW_ON_ERROR);}
          catch(Throwable $e){blocked('PUBLIC_KEY_RESPONSE_INVALID');}
          if (!is_array($decoded)||!is_string($decoded['key']??null)
              ||!is_string($decoded['key_id']??null)) blocked('PUBLIC_KEY_RESPONSE_INVALID');
          $recipient=base64_decode($decoded['key'],true);
          if(!is_string($recipient)||strlen($recipient)!==32) blocked('PUBLIC_KEY_BAD_BYTES');
          // No private key exists until protected secret write access is confirmed.
          $pair=sodium_crypto_sign_keypair();
          $public=sodium_crypto_sign_publickey($pair);
          $private=sodium_crypto_sign_secretkey($pair);
          $privateHex=bin2hex($private);
          sodium_memzero($private);
          sodium_memzero($pair);
          $encrypted=sodium_crypto_box_seal($privateHex,$recipient);
          sodium_memzero($privateHex);
          $payload=json_encode([
              'encrypted_value'=>base64_encode($encrypted),
              'key_id'=>$decoded['key_id']
          ],JSON_THROW_ON_ERROR);
          sodium_memzero($encrypted);
          [$status,$reply]=request($api.'/'.$name,$token,'PUT',$payload);
          unset($payload,$reply,$response);
          if($status!==201) blocked('SECRET_WRITE_FAILED_HTTP_'.$status);
          [$verify,$metadata]=request($api.'/'.$name,$token);
          if($verify!==200) blocked('SECRET_METADATA_READBACK_FAILED_'.$verify);
          echo 'P08_ISSUER_BOOTSTRAP_PERSISTED_AS_GITHUB_ACTIONS_SECRET=YES'.PHP_EOL;
          echo 'P08_ISSUER_STORAGE_REPOSITORY=llhzx2018/core-free-runner-public'.PHP_EOL;
          echo 'P08_ISSUER_SECRET_NAME='.$name.PHP_EOL;
          echo 'P08_ISSUER_PUBLIC_KEY_HEX='.bin2hex($public).PHP_EOL;
          echo 'P08_ISSUER_PUBLIC_KEY_FINGERPRINT_SHA256='.hash('sha256',$public).PHP_EOL;
          echo 'P08_ISSUER_PRIVATE_KEY_IN_LOG_OR_ARTIFACT=NO'.PHP_EOL;
          echo 'P08_FORMAL_RELEASE_PRODUCTION_OR_CHANNEL_CHANGED=NO'.PHP_EOL;
          PHP
