name: P02 V2.5.90 Governance Resume R4
on:
  push:
    branches: [run/p02-v2590-governance-resume-r4-20260922]
    paths: ['.github/workflows/p02-v2590-governance-resume-r4.yml']
permissions:
  contents: read
jobs:
  governance-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact P02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: e38b14dfa744964994c57d18f9e2e52ecbb963f8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product
      - name: Install runtime and Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip sqlite3 unzip curl
          cd product
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact-source unit gate
        shell: bash
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "e38b14dfa744964994c57d18f9e2e52ecbb963f8"
          test "$(cat VERSION)" = "2.5.90"
          python3 scripts/generate-source-manifest.py
          git diff --exit-code -- SOURCE_MANIFEST.json SOURCE_MANIFEST.txt
          node tests/unit/p02_v2590_governance_resume_safety.mjs
          while IFS= read -r cmd; do test -n "$cmd"; eval "$cmd"; done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          bash scripts/verify-repository.sh
      - name: Maintenance baseline
        shell: bash
        working-directory: product
        env:
          TEST_PASSWORD: VF-P02-V2590-${{ github.run_id }}!
          EVIDENCE_DIR: ${{ runner.temp }}/p02-v2590-governance-resume
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/maintenance-reverify.sh
      - name: Focused Chromium governance resume
        shell: bash
        working-directory: product
        env:
          VF_UX_FOCUSED_GOVERNANCE_RESUME: "1"
          VF_UX_E2E_PASSWORD: VF-P02-V2590-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          timeout 180s bash scripts/ux-browser-reverify.sh
