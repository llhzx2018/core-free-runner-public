name: S01 Theme208 current-language regression
on:
  push:
    branches: [task/s01-theme208-language-20261027]
    paths: ['.github/workflows/s01-theme208-language-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.208
  TARGET_SHA: 1d70bd4bd427be70871da2067cebe0cea3063662
  TARGET_TREE: 0be55fa94cd07cf6d57e29562328912c5c7ef1c5
  BASE_SHA: 19d47c311d8d85c6b9e6fbc1cdd38781c736c55b
  SOURCE_VERSION: 1.35.207
  LANE_ID: s01-theme208-language-20261027
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme208-language-20261027/spec.json --input control/.github/workflows/s01-theme208-language-20261027.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1d70bd4bd427be70871da2067cebe0cea3063662
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-theme208-language-20261027/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check control/lanes/s01-theme208-language-20261027/check.cjs
          node --check target/src/assets/js/main.js
          mkdir -p baseline/src/inc
          git -C target show "$BASE_SHA:src/inc/multilingual-switcher.php" > baseline/src/inc/multilingual-switcher.php
          git -C target show "$BASE_SHA:src/inc/multilingual-switcher-render.php" > baseline/src/inc/multilingual-switcher-render.php
          for lang in en zh; do
            php target/tests/targeted/test-language-switcher-current-without-url.php baseline/src before missing-current "$lang" >> proof/current-label.jsonl
            for case in missing-current missing-target normal; do
              php target/tests/targeted/test-language-switcher-current-without-url.php target/src after "$case" "$lang" >> proof/current-label.jsonl
            done
          done
          gh release download v1.35.207 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.207.zip --dir provider
          echo 'eeaf5e4bb4794c6cd73525538d093119594fc00446039f848003fd65f3aadb0a  provider/vf-tools-theme_V1.35.207.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Clean208 WordPress,207 upgrade/rollback and focused language control proof
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-theme208-language-20261027/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-theme208-language-20261027/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
