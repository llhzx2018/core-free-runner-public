name: P01 V2.22.1 Authority Self-Reference Fix

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v221-authority-selfref-fix-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  DOC_BRANCH: docs/p01-v2.22.1-authority-selfref-fix-20260828
  BASE_MAIN: 5994e8b8d3b1a318d97e850097a2b810f537d5ff

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact docs branch
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf product
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/${PRODUCT_REPO}.git" product
          git -C product checkout -q "$DOC_BRANCH"
          test "$(git -C product rev-parse HEAD)" = "$BASE_MAIN"
          echo P01_V221_SELFREF_BASE=PASS

      - name: Correct self-referential current-main wording
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('product')
          def one(rel,old,new,label):
              p=root/rel; s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')

          one('docs/authority/CURRENT.md',
          '''main: 203d3c1236624ab846555167d217978694e11e88\nTag v2.22.1: a31bafac5efc97efa537b645f03bc99ed0ea5b43\nTag Tree = main Tree: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59''',
          '''Release Runtime Merge: 203d3c1236624ab846555167d217978694e11e88\nTag v2.22.1: a31bafac5efc97efa537b645f03bc99ed0ea5b43\nTag Tree = Release Runtime Merge Tree: 76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59''','CURRENT boundary')
          one('docs/authority/CURRENT.md',
          '''Production Runtime: V2.21.25 / NOT YET UPGRADED\n```''',
          '''Production Runtime: V2.21.25 / NOT YET UPGRADED\n```\n\nCurrent `main` 可以继续包含后续 docs-only Authority Closure commit；这不会改变已冻结的 V2.22.1 Tag、Release Runtime Source 或 Release Runtime Tree。''','CURRENT note')

          one('docs/authority/SSOT.md',
          'Git main:             203d3c1236624ab846555167d217978694e11e88',
          'Release Runtime Merge: 203d3c1236624ab846555167d217978694e11e88','SSOT runtime merge')
          one('docs/authority/SSOT.md',
          '''Production Upgrade:   NOT EXECUTED\n```\n\nGit Formal Release 可以领先 Owner Runtime。''',
          '''Production Upgrade:   NOT EXECUTED\n```\n\nCurrent `main` 允许在 Release Runtime Merge 之后继续追加 docs-only Authority Closure；这些提交不得被解释为新的 Runtime Release Source。\n\nGit Formal Release 可以领先 Owner Runtime。''','SSOT note')

          one('docs/authority/ACCEPTANCE_MATRIX.md',
          '| main Tree = Release Tree | PASS / `76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59` |',
          '| Release Merge Tree = Release Tree | PASS / `76aa42eb2e9abd0e0d543a7eba1241a3ff26eb59` |','matrix tree')
          PY
          expected=$(printf '%s\n' docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/authority/SSOT.md | sort)
          actual=$(git -C product status --short | sed -E 's/^.. //' | sort)
          test "$actual" = "$expected"
          ! git -C product diff --name-only | grep -E '^src/|^database/'
          grep -Fq 'Release Runtime Merge:' product/docs/authority/CURRENT.md
          grep -Fq 'Current `main` 可以继续包含后续 docs-only Authority Closure commit' product/docs/authority/CURRENT.md
          grep -Fq 'Release Runtime Merge:' product/docs/authority/SSOT.md
          grep -Fq 'Release Merge Tree = Release Tree' product/docs/authority/ACCEPTANCE_MATRIX.md
          echo P01_V221_SELFREF_DOCS=PASS

      - name: Commit and push docs-only correction
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add docs/authority/CURRENT.md docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md
          git -C product commit -m 'docs(P01): remove release authority self-reference'
          git -C product push origin "$DOC_BRANCH"
          echo "DOC_HEAD=$(git -C product rev-parse HEAD)" >> "$GITHUB_ENV"
          echo P01_V221_SELFREF_COMMIT=PASS

      - name: Remote readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote=$(git -C product ls-remote origin "refs/heads/${DOC_BRANCH}" | awk '{print $1}')
          test "$remote" = "$DOC_HEAD"
          echo "P01_V221_SELFREF_FIX=PASS head=$DOC_HEAD production_write=false"
