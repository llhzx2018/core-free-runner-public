name: S01 converter theme exact PHP checks
on:
  push:
    branches: [task/s01-converter-i18n-proof-20261030]
    paths: ['.github/workflows/s01-converter-theme-php-20261030.yml']
permissions:
  contents: read
jobs:
  php-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 246d97c9c3ccf0df3b517b5d7ee2c72cbc4ec147
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact source and player PHP regressions
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 246d97c9c3ccf0df3b517b5d7ee2c72cbc4ec147
          test "$(git -C target rev-parse 'HEAD^{tree}')" = 99a1e730fa03f8095ab57409a23285c4f016916e
          cd target
          for file in src/inc/modules/module-faq.php src/inc/seo-parts/seo-jsonld.php tests/player-faq-copy-contract.php tests/player-advanced-seo-jsonld-contract.php; do
            if [[ -f "$file" ]]; then php -l "$file"; fi
          done
          for file in tests/player-faq-copy-contract.php tests/player-advanced-seo-jsonld-contract.php; do
            if [[ -f "$file" ]]; then php "$file"; fi
          done
          echo EXACT_THEME_EQUIVALENT_PHP_CONTRACTS_PASS
