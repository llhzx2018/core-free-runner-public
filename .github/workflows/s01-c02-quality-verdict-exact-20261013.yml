name: S01 Ops Quality Gate P0/P1 consistency
on:
  push:
    branches: [task/s01-c02-quality-verdict-20261013]
    paths: [.github/workflows/s01-c02-quality-verdict-exact-20261013.yml]
permissions:
  contents: read
jobs:
  verdict-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact private candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 701dce46b03cb4650330ef5d90d208c9f6e835e4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Quality verdict PHP syntax and executable regression
        run: |
          set -Eeuo pipefail
          test "$(git -C private-source rev-parse HEAD)" = 701dce46b03cb4650330ef5d90d208c9f6e835e4
          php -l private-source/includes/acceptance-o11/acceptance-overview-product.php
          php -l private-source/tests/s01-c02-quality-verdict-count-consistency-unit.php
          php private-source/tests/s01-c02-quality-verdict-count-consistency-unit.php
          echo S01_C02_QUALITY_VERDICT_EXACT_GATE_PASS
      - name: Remove temporary private checkout
        if: always()
        run: rm -rf private-source
