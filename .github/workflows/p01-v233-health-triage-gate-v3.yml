name: P01 V2.33 Health Triage Browser Gate V3
on:
  push:
    branches: [task/p01-v233-health-triage-20260830]
    paths:
      - .github/workflows/p01-v233-health-triage-gate-v3.yml
      - scripts/p01-v233-health-triage-gate-v3.sh
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT: ${{ github.workspace }}/product
      ROOT: ${{ github.workspace }}/product/src
      PORT: '18673'
      ADMIN_PASS: 'P01V233!HealthGate'
      EVID: /tmp/p01-v233-health-evidence
      SOURCE: 0a0ef35f3b719c0cd4f262c1203ca5e912596735
      SOURCE_TREE: f81d776da1fa92d04acd31ccbe6444cb1d9f0d43
      BASE_SOURCE: b63b6605a723e4e8d34dfb3368e0e7dd993558a6
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0a0ef35f3b719c0cd4f262c1203ca5e912596735
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact Fresh Runtime and Browser Gate V3
        shell: bash
        run: bash runner/scripts/p01-v233-health-triage-gate-v3.sh
      - name: Upload V2.33 health triage evidence V3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v233-health-triage-v3-${{ github.run_id }}
          path: /tmp/p01-v233-health-evidence
          if-no-files-found: warn
          retention-days: 30
