name: P01 frontend navigation SEO test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-frontend-nav-seo-test-only.yml'
permissions:
  contents: read
jobs:
  frontend-seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read exact private P01 source ephemerally
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 96154acc4d6bd73c078294d8615a2f3902220a3f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Configure PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,openssl,curl,zip
          coverage: none
      - name: Exact source navigation / public Home and SEO contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "96154acc4d6bd73c078294d8615a2f3902220a3f"
          php -l product/src/app/FunctionalWorkspace.php
          php -l product/tests/unit/public_navigation_seo_route_v247390_contract.php
          for file in \
            public_navigation_seo_route_v247390_contract.php \
            public_home_visitor_discovery_v247390_contract.php \
            public_brand_route_contract.php \
            public_global_nav_contract.php \
            navigation_search_context_contract.php \
            navigation_search_authority_contract.php \
            navigation_category_facet_recovery_contract.php \
            navigation_page_visual_closure_contract.php \
            system_health_seo_root_privacy_false_positive_contract.php; do
            php "product/tests/unit/$file"
          done
          echo P01_PUBLIC_NAV_SEO_EXACT_SOURCE_PASS
      - name: Clean ephemeral private source
        if: always()
        shell: bash
        run: rm -rf product
