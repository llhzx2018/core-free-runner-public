name: P07 release92 exact formal publication
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release92-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release92
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc61
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release92'
          test "$(cat "$care/VERSION")" = '0.1.0-rc61'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = 87234c5ddea88eb59b981e5ac1a67ee916f4bd0d
          test "$(git hash-object "$root/MANIFEST.gitblob")" = eb5f7535f410f804e1ea50acedb1bf3e5d0b44b6
          test "$(git hash-object "$care/MANIFEST.gitblob")" = f27425b3cd7794d726f2000fb7d990e232bcffe2
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = c1ffadd543ccaa0238938c6c04d0e5660c662152
          test "$(git hash-object installers/p07.sh)" = 1436a054e81621a1d35515e9fb453b1e5d062bff
          test "$(git hash-object installers/p07-toolbox.sh)" = 1e4b4e2d5cfeb92359d07d138fb4ccb8b364b98b
          test "$(git hash-object installers/p07-system-care.sh)" = 8d6d3efba212004678ae80620caa51c891308e38
          grep -Fq 'EXPECTED_BLOB="c1ffadd543ccaa0238938c6c04d0e5660c662152"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release92"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="87234c5ddea88eb59b981e5ac1a67ee916f4bd0d"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release92"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc61"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='f27425b3cd7794d726f2000fb7d990e232bcffe2'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE92_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release92 · 正式网站数据工具与 System Care rc61' \
              --notes 'P07 release92 / System Care rc61. Exact private candidate 398581f7c0c7e46f73fcffaa291d99ef0c2c0ace; merged source main b8bca7a5594dfb180801fdeeebf321c53aa9cc6d with identical Git tree. Registered Public Runner conditional SQL DDL and strict mismatch regressions PASS; isolated clean install, release91 upgrade, idempotence, corruption rejection and rollback PASS. Only equivalent known session-version guards are normalized; triggers, views, indexes, schema, delimiters and data remain fully compared. Production CP2 manual upgrade, real migration and DNS cutover remain separate Owner-controlled gates.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE92_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release92-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release92-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release92-assets/$name"
            test "$(git hash-object "/tmp/p07-release92-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE92_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh 1436a054e81621a1d35515e9fb453b1e5d062bff' 'installers/p07-final.sh c1ffadd543ccaa0238938c6c04d0e5660c662152' 'installers/p07-toolbox.sh 1e4b4e2d5cfeb92359d07d138fb4ccb8b364b98b' 'installers/p07-system-care.sh 8d6d3efba212004678ae80620caa51c891308e38' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob 87234c5ddea88eb59b981e5ac1a67ee916f4bd0d'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release92-remote
            test "$(git hash-object /tmp/p07-release92-remote)" = "$sha"
          done
          echo P07_RELEASE92_REMOTE_DISTRIBUTION_READBACK_PASS
