name: P01 V2.21.15 Release State Seal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p01-v2.21.15-release-state-seal.yml'
      - 'requests/p01-v2.21.15-release-state-seal-*.txt'

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE: e6d71b3309fb24b11139c6febf7dcaf0f9106e87
      TAG: v2.21.15
      UPDATE_BYTES: '1073031'
      UPDATE_SHA: 7562fbc82b59de09c1f1b0dc77e0ca2e2f73ad556f969d6225a7cca5fd1b5947
      CORE_UPDATES_COMMIT: e1ca0a3462d2193710ab195c01cb0ded4aec564f
    steps:
      - name: Checkout current P01 develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: develop
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p01

      - name: Guard exact pre-seal state
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$CANDIDATE"
          test "$(tr -d '\r\n' < p01/VERSION)" = '2.21.15'
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = '2.21.15'
          test "$(python3 -c 'import json;print(json.load(open("p01/VF_PROJECT.json"))["production_version"])')" = '2.21.14'
          echo 'PRE_RELEASE_STATE_SEAL_IDENTITY=PASS'

      - name: Write post-release pre-production Current Truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os

          p=Path('p01/VF_PROJECT.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['production_version']=='2.21.14'
          assert x['candidate_version']=='2.21.15'
          x['status']='FORMAL_RELEASE_PUBLISHED / PRODUCTION_DISCOVERY_BRIDGE_PENDING'
          x['candidate_state']='FORMAL RELEASE VERIFIED / CORE-UPDATES PUBLISHED / NOT PRODUCTION'
          x['current_phase']='V2.21.15 FORMAL RELEASE PUBLISHED / PRODUCTION DISCOVERY BRIDGE PENDING'
          x['verified_release_ready']=True
          x['formal_artifact_gate']='PASS_FINAL_BYTES_EXACTLY_EQUAL_TESTED_CANDIDATE'
          x['formal_release_complete']=True
          x['formal_tag_created']=True
          x['publication_completed']=True
          x['main_candidate_promotion']=False
          rg=x.setdefault('release_gates',{})
          rg['rel_cg_candidate']='PASS'
          rg['rel_cg_build']='PASS'
          rg['rel_cg_verification']='PASS'
          rg['rel_cg_ready']='PASS'
          rg['rel_cg_promotion']='NOT_EXECUTED_PRODUCTION_NOT_UPGRADED'
          rg['rel_cg_finalize']='PASS_FORMAL_RELEASE_PUBLISHED'
          rg['rel_cg_publication']='PASS_GITHUB_RELEASE_AND_CORE_UPDATES'
          rg['final_online_pass']='NO_PRODUCTION_DISCOVERY_BRIDGE_NOT_EXECUTED'
          us=x.setdefault('update_system',{})
          us['formal_tag']='v2.21.15'
          us['candidate_commit']=os.environ['CANDIDATE']
          us['update_asset']='VF_Start_V2.21.15_UPDATE.zip'
          us['update_asset_bytes']=int(os.environ['UPDATE_BYTES'])
          us['update_asset_sha256']=os.environ['UPDATE_SHA']
          us['core_updates_commit']=os.environ['CORE_UPDATES_COMMIT']
          us['non_production_online_discovery']='PASS_CORE_UPDATES_GITHUB_RELEASE_PRIVATE_ASSET_PREPARE'
          us['production_bridge']='FORMAL_ASSET_READY / NOT DEPLOYED'
          us['production_upgrade']='NOT_EXECUTED'
          x['next_action']='DEPLOY AND RUN ONE-TIME P01 V2.21.14 DISCOVERY BRIDGE ON REAL PRODUCTION; THEN VERIFY BACKEND DISCOVERS V2.21.15. DO NOT EXECUTE V2.21.15 UPGRADE WITHOUT USER AUTHORIZATION.'
          x['current_authority']='POST_RELEASE_PRE_PRODUCTION_DISCOVERY_BRIDGE'
          x['current_state']='FORMAL_RELEASE_PUBLISHED_PRODUCTION_BRIDGE_PENDING'
          x['lifecycle']='FORMAL_RELEASE_PUBLISHED / PRE_PRODUCTION_DISCOVERY'
          findings=list(x.get('current_findings') or [])
          for item in [
              'V2.21.15_FORMAL_TAG_EXACT_CANDIDATE_PASS',
              'GITHUB_RELEASE_REMOTE_ASSET_READBACK_PASS',
              'CORE_UPDATES_P01_MANIFEST_REMOTE_READBACK_PASS',
              'MANIFEST_RELEASE_EXACT_EQUALITY_PASS',
              'LIVE_NON_PRODUCTION_DISCOVERY_AND_PRIVATE_ASSET_PREPARE_PASS',
              'PRODUCTION_DISCOVERY_BRIDGE_PENDING_NO_DEPLOYMENT_CHANNEL_IN_CURRENT_WINDOW'
          ]:
              if item not in findings: findings.append(item)
          x['current_findings']=findings
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          matrix=Path('p01/docs/authority/ACCEPTANCE_MATRIX.md')
          m=matrix.read_text(encoding='utf-8')
          replacements={
            '| V22115-UPD-11 | Final Artifact Build | exact candidate formal bytes | TODO |':'| V22115-UPD-11 | Final Artifact Build | exact bytes = Candidate-tested Evidence | PASS |',
            '| V22115-UPD-12 | Exact 2.21.14 → 2.21.15 Upgrade | real SQLite runtime | TODO |':'| V22115-UPD-12 | Exact 2.21.14 → 2.21.15 Upgrade | real SQLite runtime + sentinel preservation + repeat | PASS |',
            '| V22115-UPD-13 | Failure Rollback | injected failure + source/data restoration | TODO |':'| V22115-UPD-13 | Failure Rollback | soft failure rollback + hard interruption recovery/retry | PASS |',
            '| V22115-UPD-14 | Git Tag / Release | exact candidate | TODO |':'| V22115-UPD-14 | Git Tag / Release | `v2.21.15` → exact Candidate + remote asset readback | PASS |',
            '| V22115-UPD-15 | core-updates P01.json | generated from real Release asset | TODO |':'| V22115-UPD-15 | core-updates P01.json | generated from real Release bytes/SHA + remote equality | PASS |',
            '| V22115-UPD-16 | Production Discovery Bridge | one-time exact 2.21.14 bridge | TODO |':'| V22115-UPD-16 | Production Discovery Bridge | formal exact 2.21.14 bridge asset ready; current window has no Production deployment channel | BLOCKED-EXTERNAL / NOT PRODUCT BLOCK |'
          }
          for old,new in replacements.items():
              if m.count(old)!=1: raise SystemExit(f'Acceptance row drift: {old}')
              m=m.replace(old,new)
          matrix.write_text(m,encoding='utf-8',newline='\n')

          ssot=Path('p01/docs/authority/SSOT.md')
          s=ssot.read_text(encoding='utf-8')
          anchor='# 0.000 CURRENT · 2026-08-15 V2.21.15 Unified Update Candidate\n'
          if s.count(anchor)!=1: raise SystemExit('SSOT candidate anchor drift')
          block='''# 0.0000 CURRENT · 2026-08-15 V2.21.15 Formal Release Published / Production Bridge Pending\n\n```text\nProduction: 2.21.14 / Schema 2026080902 / main UNCHANGED\nFormal Candidate: 2.21.15 @ e6d71b3309fb24b11139c6febf7dcaf0f9106e87\nGit Tag: v2.21.15 → exact Candidate PASS\nGitHub Release: PASS / remote asset readback PASS\nUPDATE Asset: VF_Start_V2.21.15_UPDATE.zip / 1,073,031 bytes / SHA-256 7562fbc82b59de09c1f1b0dc77e0ca2e2f73ad556f969d6225a7cca5fd1b5947\ncore-updates: projects/P01.json @ e1ca0a3462d2193710ab195c01cb0ded4aec564f / PASS\nManifest = GitHub Release = exact Candidate: PASS\nNon-production live discovery + private Release asset prepare: PASS\nOne-time Production Discovery Bridge: FORMAL ASSET READY / NOT DEPLOYED\nReal Production Upgrade: NOT EXECUTED\nmain Promotion: NOT EXECUTED\nProduct Failure: NONE\nProject Block: NONE\nWindow / External Boundary: no Production SSH/SFTP/CloudPanel write channel is available in this execution window\n```\n\n当前只剩一次性的真实 Production Discovery Bridge。它不是以后每版本固定步骤；完成后 2.21.14 Production 才能直接读取统一 `core-updates + GitHub Release` 更新链。Bridge 只接入发现能力，不改变 VF Start 版本、Schema 或业务数据。真实 2.21.15 Production Upgrade 仍必须等待用户授权。\n\n'''
          s=s.replace(anchor,block+anchor)
          ssot.write_text(s,encoding='utf-8',newline='\n')

          ev=Path('p01/docs/evidence/P01_V2.21.15_UNIFIED_UPDATE_RELEASE_20260815.md')
          ev.write_text('''# P01 · VF Start V2.21.15 统一在线更新发布证据\n\n- Production：2.21.14 / Schema 2026080902 / main 未修改。\n- Candidate Commit：`e6d71b3309fb24b11139c6febf7dcaf0f9106e87`。\n- Candidate Tree：`3b784e34c3519992bd7cd9087d9652f8229fac46`。\n- Git Tag：`v2.21.15`，精确指向 Candidate。\n- UPDATE：`VF_Start_V2.21.15_UPDATE.zip`。\n- UPDATE bytes：`1073031`。\n- UPDATE SHA-256：`7562fbc82b59de09c1f1b0dc77e0ca2e2f73ad556f969d6225a7cca5fd1b5947`。\n- core-updates main：`e1ca0a3462d2193710ab195c01cb0ded4aec564f`。\n- `projects/P01.json` 与远端 Release Asset bytes/SHA 精确一致。\n- Public Runner：Candidate Update Core Matrix PASS；Formal Candidate Final Bytes / Fresh Install / Exact Upgrade / Backup Restore / Rollback / Hard Interruption PASS。\n- Missing Credential：真实 Adapter 无 `VF_PRIVATE_READ_TOKEN` 时 FAIL-CLOSED PASS。\n- Live non-production online discovery：2.21.14 + one-time Bridge → core-updates → private GitHub Release → UPDATE prepare PASS。\n- Browser Extension：1.6.4，独立组件，本轮未升版。\n- Private Runner：Hosted Runner allocation failure before steps；属于测试基础设施问题，不是 P01 Project Block。\n- Production Discovery Bridge：NOT EXECUTED，当前窗口无 Production 写入通道。\n- Production Upgrade：NOT EXECUTED。\n- main Alignment：NOT EXECUTED。\n''',encoding='utf-8',newline='\n')
          PY
          python3 -m json.tool p01/VF_PROJECT.json >/dev/null
          git -C p01 diff --check -- VF_PROJECT.json docs/evidence/P01_V2.21.15_UNIFIED_UPDATE_RELEASE_20260815.md
          grep -Fq 'V22115-UPD-16' p01/docs/authority/ACCEPTANCE_MATRIX.md
          echo 'POST_RELEASE_CURRENT_TRUTH_WRITTEN=PASS'

      - name: Commit docs-only state seal
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          git config user.name 'VF Release Automation'
          git config user.email 'vf-release-automation@users.noreply.github.com'
          git add VF_PROJECT.json docs/authority/SSOT.md docs/authority/ACCEPTANCE_MATRIX.md docs/evidence/P01_V2.21.15_UNIFIED_UPDATE_RELEASE_20260815.md
          git diff --cached --name-only | grep -v -E '^(VF_PROJECT\.json|docs/)' && { echo 'non-doc state file changed' >&2; exit 1; } || true
          git commit -m 'docs(authority): seal P01 2.21.15 post-release state'
          git push origin HEAD:develop
          echo "P01_POST_RELEASE_STATE_HEAD=$(git rev-parse HEAD)"
