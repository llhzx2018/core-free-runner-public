name: P06 Common Baseline V2 Runtime Exact Source Gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p06-common-baseline-v2-runtime-gate-20260828.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXACT_SOURCE: d21c00effe38382cf1b9a239946ade09f6ccb11f
      ASSESSED_BASE: 144b31929a74d079554dc31d1edb5e54a5bb37c4
      TARGET_BRANCH: maintenance/common-product-baseline-v2-20260828
    steps:
      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-press
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p06
      - name: Source and authority candidate fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.6'
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          test ! -e docs/authority/VF_COMMON_PRODUCT_BASELINE_ADOPTION.json
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('docs/authority/VF_COMMON_PRODUCT_BASELINE_V2_ADOPTION_CANDIDATE.json').read_text())
          assert x['state']=='MACHINE_VERIFICATION_PENDING',x
          assert x['machine_verification']['state']=='PENDING',x
          assert x['previous_common_product_baseline_adoption']=='NOT_PRESENT',x
          assert x['historical_gap'] is True and x['first_formal_common_product_baseline_adoption'] is True,x
          assert x['version']=='0.1.6' and x['schema_version']==2,x
          assert x['version_changed'] is False and x['schema_changed'] is False,x
          assert x['release_executed'] is False and x['tag_created'] is False and x['production_changed'] is False,x
          assert {e['id'] for e in x['explicit_exceptions']}=={'P06-TIME-DISPLAY-CONVERSION-LEGACY-SURFACES','P06-API-RETRY-PROVIDER-SPECIFIC'},x
          assert len(x['reasoned_n_a'])==1 and x['reasoned_n_a'][0]['domain']=='NOTIFICATION',x
          PY
          echo P06_V2_SOURCE_FENCE=PASS
      - name: Prepare PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl composer
          php -v
          php -m | grep -Fxq 'PDO'
          php -m | grep -Fxq 'pdo_sqlite'
          php -m | grep -Fxq 'sqlite3'
          php -m | grep -Fxq 'mbstring'
          php -m | grep -Fxq 'zip'
          php -m | grep -Fxq 'curl'
      - name: Composer install and PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          composer install --no-interaction --prefer-dist --no-progress
          while IFS= read -r file; do php -l "$file" >/dev/null; done < <(find src public bin deploy -type f -name '*.php' | sort)
          echo P06_PHP_SYNTAX=PASS
      - name: Fresh migration and formal regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          ROOT="$RUNNER_TEMP/p06-v2-runtime"
          export APP_ENV=test
          export VF_PRESS_STORAGE_PATH="$ROOT/storage"
          export VF_PRESS_DB_PATH="$ROOT/storage/app.db"
          export VF_PRESS_OWNER_USERNAME=baseline-owner
          export VF_PRESS_OWNER_PASSWORD='P06-Baseline-V2-Owner-Password-2026!'
          export VF_PRESS_OWNER_DISPLAY_NAME='Baseline Owner'
          mkdir -p "$ROOT/storage"
          php bin/migrate.php
          test "$(sqlite3 "$VF_PRESS_DB_PATH" 'SELECT MAX(version) FROM schema_migrations;')" = '2'
          php bin/create-owner.php
          php bin/preflight.php
          composer self-test
          composer security-self-test
          php bin/job-self-test.php
          composer research-self-test
          composer publication-self-test
          composer reader-self-test
          composer edition-self-test
          composer living-publishing-self-test
          composer operations-self-test
          composer operations-ui-self-test
          composer backoffice-self-test
          composer backoffice-catalog-self-test
          composer public-asset-self-test
          composer update-self-test
          php bin/common-baseline-v2-self-test.php
          echo P06_V2_FORMAL_REGRESSION=PASS
      - name: Real HTTP system surfaces and step-up gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          ROOT="$RUNNER_TEMP/p06-v2-runtime"
          PORT=19036
          PASS='P06-Baseline-V2-Owner-Password-2026!'
          export APP_ENV=test
          export VF_PRESS_STORAGE_PATH="$ROOT/storage"
          export VF_PRESS_DB_PATH="$ROOT/storage/app.db"
          export VF_PRESS_SESSION_IDLE_SECONDS=604800
          export VF_PRESS_SESSION_ABSOLUTE_SECONDS=2592000
          export VF_PRESS_SESSION_COOKIE_SECONDS=2592000
          export VF_PRESS_SERVER_SESSION_FLOOR_SECONDS=2592000
          export VF_PRESS_STEP_UP_WINDOW_SECONDS=900
          export VF_PRESS_DISPLAY_TIMEZONE=Asia/Shanghai
          export VF_PRESS_LOCALE=zh-CN
          mkdir -p "$ROOT/sessions"
          php -d session.save_path="$ROOT/sessions" -S 127.0.0.1:$PORT -t public public/index.php >"$ROOT/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            curl -fsS "http://127.0.0.1:$PORT/health" >"$ROOT/health.json" 2>/dev/null && break
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat "$ROOT/server.log"; exit 31; fi
            sleep .1
          done
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'p06-v2-runtime','health.json')))
          assert x['status']=='ok' and x['version']=='0.1.6' and x['schema']==2,x
          assert x['database']=='SQLite' and x['runtime']=='PHP',x
          PY
          BASE="http://127.0.0.1:$PORT"
          curl -fsS -c "$ROOT/cookies.txt" "$BASE/login" >"$ROOT/login.html"
          CSRF="$(python3 - <<'PY'
          import re,os
          text=open(os.path.join(os.environ['RUNNER_TEMP'],'p06-v2-runtime','login.html')).read()
          m=re.search(r'name="_csrf" value="([^"]+)"',text); assert m; print(m.group(1))
          PY
          )"
          curl -sS -D "$ROOT/login.headers" -o /dev/null -b "$ROOT/cookies.txt" -c "$ROOT/cookies.txt" -X POST "$BASE/login" --data-urlencode "_csrf=$CSRF" --data-urlencode 'username=baseline-owner' --data-urlencode "password=$PASS"
          grep -Eq '^HTTP/1\.[01] 303|^HTTP/2 303' "$ROOT/login.headers"
          grep -Fqi 'Location: /studio/operations' "$ROOT/login.headers"
          grep -Eqi 'Max-Age=2592000' "$ROOT/login.headers"
          curl -fsS -b "$ROOT/cookies.txt" "$BASE/studio/system" >"$ROOT/system.html"
          grep -Fq '系统信息' "$ROOT/system.html"
          grep -Fq 'PERSONAL_SINGLE_ADMIN' "$ROOT/system.html"
          grep -Fq 'Asia/Shanghai' "$ROOT/system.html"
          curl -fsS -b "$ROOT/cookies.txt" "$BASE/studio/system/baseline" >"$ROOT/baseline.html"
          grep -Fq 'VF-COMMON-PRODUCT-BASELINE@2.0' "$ROOT/baseline.html"
          grep -Fq '>TIME<' "$ROOT/baseline.html"
          grep -Fq '>API<' "$ROOT/baseline.html"
          grep -Fq '>N_A<' "$ROOT/baseline.html"
          curl -fsS -b "$ROOT/cookies.txt" "$BASE/studio/system/health" >"$ROOT/system-health.html"
          grep -Fq '运行健康' "$ROOT/system-health.html"
          CSRF2="$(python3 - <<'PY'
          import re,os
          text=open(os.path.join(os.environ['RUNNER_TEMP'],'p06-v2-runtime','system.html')).read()
          m=re.search(r'name="_csrf" value="([^"]+)"',text); assert m; print(m.group(1))
          PY
          )"
          SID="$(awk '$6=="vf_press_session"{print $7}' "$ROOT/cookies.txt" | tail -1)"
          test -n "$SID"
          php -d session.save_path="$ROOT/sessions" -r 'session_name("vf_press_session"); session_id($argv[1]); session_start(); unset($_SESSION["vf_press_recent_auth_at"]); session_write_close();' "$SID"
          curl -sS -D "$ROOT/guard.headers" -o /dev/null -b "$ROOT/cookies.txt" -c "$ROOT/cookies.txt" -X POST "$BASE/studio/updates/install" --data-urlencode "_csrf=$CSRF2"
          grep -Eq '^HTTP/1\.[01] 303|^HTTP/2 303' "$ROOT/guard.headers"
          grep -Fqi 'Location: /studio/system?return_to=/studio/updates' "$ROOT/guard.headers"
          curl -fsS -b "$ROOT/cookies.txt" "$BASE/studio/system?return_to=/studio/updates" >"$ROOT/step-up.html"
          CSRF3="$(python3 - <<'PY'
          import re,os
          text=open(os.path.join(os.environ['RUNNER_TEMP'],'p06-v2-runtime','step-up.html')).read()
          m=re.search(r'name="_csrf" value="([^"]+)"',text); assert m; print(m.group(1))
          PY
          )"
          curl -sS -D "$ROOT/wrong.headers" -o /dev/null -b "$ROOT/cookies.txt" -c "$ROOT/cookies.txt" -X POST "$BASE/studio/system/step-up" --data-urlencode "_csrf=$CSRF3" --data-urlencode 'return_to=/studio/system' --data-urlencode 'password=wrong-password'
          curl -fsS -b "$ROOT/cookies.txt" "$BASE/studio/system" >"$ROOT/wrong-result.html"
          grep -Fq '管理员密码验证失败' "$ROOT/wrong-result.html"
          CSRF4="$(python3 - <<'PY'
          import re,os
          text=open(os.path.join(os.environ['RUNNER_TEMP'],'p06-v2-runtime','wrong-result.html')).read()
          m=re.search(r'name="_csrf" value="([^"]+)"',text); assert m; print(m.group(1))
          PY
          )"
          curl -sS -D "$ROOT/correct.headers" -o /dev/null -b "$ROOT/cookies.txt" -c "$ROOT/cookies.txt" -X POST "$BASE/studio/system/step-up" --data-urlencode "_csrf=$CSRF4" --data-urlencode 'return_to=/studio/updates' --data-urlencode "password=$PASS"
          grep -Fqi 'Location: /studio/updates' "$ROOT/correct.headers"
          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          trap - EXIT
          if grep -Eqi 'Fatal error|Parse error|Uncaught|EADDRINUSE' "$ROOT/server.log"; then cat "$ROOT/server.log"; exit 35; fi
          echo P06_V2_HTTP_SYSTEM_SURFACES=PASS
          echo P06_V2_STEP_UP_GATE=PASS
      - name: Verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p06
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXACT_SOURCE"
          test "$(git rev-parse origin/main)" = "$ASSESSED_BASE"
          test -z "$(git diff --name-only "$ASSESSED_BASE" "$EXACT_SOURCE" -- VERSION database)"
          echo P06_COMMON_BASELINE_V2_RUNTIME_EXACT_SOURCE="$EXACT_SOURCE"
          echo P06_COMMON_BASELINE_V2_VERSION=0.1.6
          echo P06_COMMON_BASELINE_V2_SCHEMA=2
          echo P06_COMMON_BASELINE_V2_MACHINE=PASS
          echo P06_COMMON_BASELINE_V2_RELEASE=NO
          echo P06_COMMON_BASELINE_V2_TAG=NO
          echo P06_COMMON_BASELINE_V2_PRODUCTION=NO
