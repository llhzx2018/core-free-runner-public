name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guide-pagination184-20261024]
    paths: ['.github/workflows/s01-guide-pagination184-20261024-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.184
  TARGET_SHA: 832abfc4f0c8e32afdc6866484f34cb3db0edc81
  TARGET_TREE: 19f0a0fc4a9976b8e9de344af5a757be49a608c4
  BASE_SHA: ba2d556e5f6eccd9c6a01d0b6d36d562f3014e3c
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 832abfc4f0c8e32afdc6866484f34cb3db0edc81
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40086332942 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40086332942 --jq .head_sha)" = 5708a99f3ae231a7d5fdc2c7ab791eb5c7982df0
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40086332942 --repo llhzx2018/core-free-runner-public --name s01-home-40086332942 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guide-pagination184-20261024/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='e7ce9abb45d853a5cf37eb1966a196e0f037ee1f'
          phases={phase:json.loads((r/(phase+'-pagination-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(4 if phase in ['before','after'] else 1)
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1024]:
                  before=json.loads((r/('before-pagination-'+lang+'-'+str(width)+'.json')).read_text())
                  after=json.loads((r/('after-pagination-'+lang+'-'+str(width)+'.json')).read_text())
                  assert not after['overflow'] and after['version']=='1.35.184'
                  for key in ['h1','canonical','hreflang','shell']:assert before[key]==after[key]
                  assert len(after['h1'])==len(after['canonical'])==1
                  assert [(x['href'],x['title'],x['copy']) for x in before['cards']]==[(x['href'],x['title'],x['copy']) for x in after['cards']]
                  assert after['list']['border']==0 and after['list']['gap']==8 and after['list']['padding']==0
                  assert all(abs(after['controls'][i]['box']['x']-after['controls'][i-1]['box']['right']-8)<1 for i in range(1,len(after['controls'])))
                  for phase in ['before','after']:assert (r/(phase+'-pagination-'+lang+'-'+str(width)+'-normal.png')).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='8baba87322b6221287748c73359794fa8686861017b849d9d0615a3d29f03c6e' and new['bytes']==1986920
          coverage=json.loads(pathlib.Path('control/lanes/s01-guide-pagination184-20261024/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='e7ce9abb45d853a5cf37eb1966a196e0f037ee1f' and coverage['tree']=='19f0a0fc4a9976b8e9de344af5a757be49a608c4'
          assert coverage['owner_preview']=='POST_RELEASE_REQUIRED_MODE_B'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40086332942'
          coverage['merged_source']='832abfc4f0c8e32afdc6866484f34cb3db0edc81'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.184 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.184 provider/vf-tools-theme_V1.35.184.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.184' --notes '修复指南目录分页整组误包绿框的问题：将WordPress外层ul.page-numbers结构与内部页码按钮区分，恢复8px独立间距，普通页码中性色边线，保留当前页、悬停与键盘焦点反馈。仅7个文件含CSS精确聚合校验及版本元数据，不改文章卡片、分页查询/URL、内容、设置及其它页型。真实WordPress中英文1440/1024实际分页截图、下一页/上一页和键盘验证，精确新包清洁安装、183升级184、回退183与重复184安装数据保护通过。476运行文件；M3U8保持1.25.94。Production由OWNER手工升级后复核，手机实机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.184 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.184 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.184 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.184.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.184.zip remote/vf-tools-theme_V1.35.184.zip
          echo '8baba87322b6221287748c73359794fa8686861017b849d9d0615a3d29f03c6e  remote/vf-tools-theme_V1.35.184.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.184.zip)" = 1986920
          gh release view v1.35.184 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
