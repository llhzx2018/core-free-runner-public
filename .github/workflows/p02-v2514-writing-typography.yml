name: P02 V2.5.14 Writing Typography

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2514-writing-typography.yml'

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require registered private capability
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: feature/v2.5.14-writing-typography
          token: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
          path: product
          fetch-depth: 0
          persist-credentials: true

      - name: Seal V2.5.14 candidate source
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path
          version=Path('VERSION')
          assert version.read_text(encoding='utf-8').strip()=='2.5.13'
          version.write_text('2.5.14\n',encoding='utf-8')

          index=Path('public/index.php')
          s=index.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="/assets/v254-common-branding.css?v=<?=rawurlencode(VFTB_VERSION)?>">'
          addition=anchor+'\n<link rel="stylesheet" href="/assets/v2514-writing-typography.css?v=<?=rawurlencode(VFTB_VERSION)?>">'
          assert anchor in s and 'v2514-writing-typography.css' not in s
          index.write_text(s.replace(anchor,addition,1),encoding='utf-8')

          ch=Path('CHANGELOG.md')
          text=ch.read_text(encoding='utf-8')
          entry='''## V2.5.14 · 临时工作台写作排版舒适度精修 · 2026-08-19\n\n- 临时工作台正文从全站 UI 字体切换为中文写作优先字体栈，Windows 优先 Microsoft YaHei UI / Microsoft YaHei。\n- Desktop 正文字号提升至 17px，舒适行高 1.88，取消额外字距，降低中英文混排的界面感。\n- 大屏正文实际行宽控制在约 920px 并居中，避免单行横跨整个屏幕；较窄桌面自动缩减内边距。\n- Mobile 保持 16px / 1.82 行高与 18px 安全边距，不制造横向拥挤。\n- 仅 UA/UI Typography，Schema 2401 不变，无 Migration。\n\n'''
          assert '## V2.5.14 · 临时工作台写作排版舒适度精修' not in text
          ch.write_text(entry+text,encoding='utf-8')
          PY
          test -f public/assets/v2514-writing-typography.css
          python3 scripts/generate-source-manifest.py
          test "$(jq -r .version SOURCE_MANIFEST.json)" = 2.5.14
          test "$(jq -r .schema SOURCE_MANIFEST.json)" = 2401
          test "$(jq -r .runtime_source_file_count SOURCE_MANIFEST.json)" = 74
          python3 scripts/repository-gates.py
          bash scripts/verify-repository.sh
          git diff --check
          echo V2514_SOURCE_AND_PRIVACY_GATES=PASS

      - name: Real Chromium writing comfort regression
        run: |
          set -Eeuo pipefail
          cd product
          ROOT="$RUNNER_TEMP/p02-v2514"; SITE="$ROOT/site"; NODE="$ROOT/node"; mkdir -p "$SITE" "$NODE"
          bash scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.14
          PW='P02-V2514-Writing!'; PORT=18314
          php -S 127.0.0.1:$PORT -t "$SITE" >"$ROOT/server.log" 2>&1 & PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 80);do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1&&break;sleep .25;done
          curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
          TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          x=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',x);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303

          cd "$NODE"; npm init -y >/dev/null 2>&1; npm install --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true); test -n "$CHROME"
          cat > test.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          const [url,password,chrome]=process.argv.slice(2);const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await puppeteer.launch({headless:true,executablePath:chrome,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();await page.setViewport({width:1440,height:900});
          await page.goto(url,{waitUntil:'networkidle0'});
          await page.evaluate(async password=>{const r=await fetch('/api.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok)throw new Error('login '+r.status);},password);
          await page.reload({waitUntil:'networkidle0'});
          await page.click('#scratchLaunchV259');
          await page.waitForSelector('#scratchWorkspaceV259 [data-scratch-editor]:not([disabled])',{timeout:12000});
          const desktop=await page.$eval('[data-scratch-editor]',e=>{const s=getComputedStyle(e);return {fontFamily:s.fontFamily,fontSize:s.fontSize,lineHeight:s.lineHeight,letterSpacing:s.letterSpacing,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight};});
          if(desktop.fontSize!=='17px')throw new Error('desktop font '+JSON.stringify(desktop));
          if(parseFloat(desktop.lineHeight)<31.5||parseFloat(desktop.lineHeight)>32.5)throw new Error('desktop line height '+JSON.stringify(desktop));
          if(parseFloat(desktop.paddingLeft)<180||parseFloat(desktop.paddingRight)<180)throw new Error('desktop measure too wide '+JSON.stringify(desktop));
          if(!/Microsoft YaHei UI/.test(desktop.fontFamily))throw new Error('writing font stack missing '+desktop.fontFamily);
          const editor=await page.$('[data-scratch-editor]');await editor.type('固定方案：\n\n临时工作台用于长期查看与编辑。\nGitHub Hosted Runner 与中文混排需要保持舒适。',{delay:3});
          await page.waitForFunction(()=>document.querySelector('[data-scratch-status]')?.textContent?.includes('已保存'),{timeout:10000});
          console.log('DESKTOP_WRITING_TYPOGRAPHY=PASS',desktop);

          await page.setViewport({width:390,height:844});await sleep(300);
          const mobile=await page.$eval('[data-scratch-editor]',e=>{const s=getComputedStyle(e);return {fontSize:s.fontSize,lineHeight:s.lineHeight,paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};});
          if(mobile.fontSize!=='16px')throw new Error('mobile font '+JSON.stringify(mobile));
          if(parseFloat(mobile.lineHeight)<28.8||parseFloat(mobile.lineHeight)>29.5)throw new Error('mobile line height '+JSON.stringify(mobile));
          if(parseFloat(mobile.paddingLeft)!==18||parseFloat(mobile.paddingRight)!==18)throw new Error('mobile padding '+JSON.stringify(mobile));
          if(mobile.scrollWidth>mobile.clientWidth+1)throw new Error('mobile overflow '+JSON.stringify(mobile));
          console.log('MOBILE_WRITING_TYPOGRAPHY=PASS',mobile);
          await browser.close();
          JS
          node test.mjs "http://127.0.0.1:$PORT/" "$PW" "$CHROME"
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.14" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          echo REAL_CHROMIUM_WRITING_COMFORT=PASS
          echo SCRATCH_AUTOSAVE=PASS
          echo SCHEMA_2401=PASS
          echo PRODUCTION_WRITE=NO

      - name: Push verified private candidate
        env:
          WRITE_TOKEN: '${{ secrets.VF_RELEASE_WRITE_TOKEN }}'
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION CHANGELOG.md SOURCE_MANIFEST.json SOURCE_MANIFEST.txt public/index.php public/assets/v2514-writing-typography.css
          git commit -m "VF Library V2.5.14 · writing typography comfort"
          git push origin HEAD:feature/v2.5.14-writing-typography
          echo VERIFIED_CANDIDATE_PUSH=PASS
