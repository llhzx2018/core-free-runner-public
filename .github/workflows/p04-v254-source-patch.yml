name: P04 V2.5.4 Source Patch Gate

on:
  push:
    paths:
      - '.github/workflows/p04-v254-source-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner patcher
        uses: actions/checkout@v4

      - name: Require controlled write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN"
          echo 'CONTROLLED_WRITE_CREDENTIAL=PASS'

      - name: Checkout exact P04 V2.5.4 working branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: maintenance/p04-v2.5.4-full-backend-ui-20260816
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: vf-infra

      - name: Apply exact fail-soft and timezone patch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/p04-v254-source-patch.py vf-infra/.v254-source-patch.py
          cd vf-infra
          python3 .v254-source-patch.py
          rm .v254-source-patch.py

      - name: Syntax and scope gate
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          php -l public/api.php
          php -l public/index.php
          php -l public/login.php
          php -l src/app/Core/Update/UpdateHistoryService.php
          node --check public/assets/app.js
          node --check public/assets/v254-ui.js
          python3 - <<'PY'
          from pathlib import Path
          assert Path('VERSION').read_text().strip() == '2.5.4'
          app = Path('public/assets/app.js').read_text()
          assert "String(value).slice(0, 16)" not in app
          assert "prepared: '已准备'" in app
          api = Path('public/api.php').read_text()
          assert "'partial_errors' => $partialErrors" in api
          assert "settings/" in api
          history = Path('src/app/Core/Update/UpdateHistoryService.php').read_text()
          assert 'reconciled_by_runtime' in history
          print('STATIC_CONTRACT=PASS')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'public/api.php\npublic/assets/app.js'
          echo 'PATCH_SCOPE=PASS'

      - name: Commit and push exact source patch
        shell: bash
        working-directory: vf-infra
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add public/api.php public/assets/app.js
          git commit -m 'fix(P04): harden V2.5.4 settings feedback and timezone display'
          git push origin HEAD:maintenance/p04-v2.5.4-full-backend-ui-20260816
          echo 'P04_V254_SOURCE_PATCH_PUSH=PASS'
