name: TEMP Dispatch core-agent Current Closure Verify

on:
  push:
    branches:
      - temp/dispatch-core-agent-current-closure-20260907
    paths:
      - '.github/workflows/temp-dispatch-core-agent-current-closure.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch current core-agent independent gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/core-agent-current-verify.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'CORE_AGENT_CURRENT_VERIFY_DISPATCH=PASS'
