name: temp-s01-m3u8-12529-release-shape-confirm-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-m3u8-12529-release-shape-confirm-20260908.yml
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-m3u8
      SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
      TAG: v1.25.29
      ASSET: vf-tools-m3u8_V1.25.29.zip
      EXPECTED_SHA: faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890
    steps:
      - name: Rebuild prior release and compare delivered bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/m3u8-shape "$RUNNER_TEMP/m3u8-old" "$RUNNER_TEMP/m3u8-release"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-shape
          git -C /tmp/m3u8-shape checkout -q "$SHA"
          test "$(git -C /tmp/m3u8-shape rev-parse HEAD)" = "$SHA"
          mkdir -p "$RUNNER_TEMP/m3u8-old" "$RUNNER_TEMP/m3u8-release"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,os
          root=Path('/tmp/m3u8-shape/src')
          rows=sorted([(p.relative_to(root).as_posix(),p.read_bytes()) for p in root.rglob('*') if p.is_file()],key=lambda x:x[0])
          out=Path(os.environ['RUNNER_TEMP'])/'m3u8-old'/os.environ['ASSET']
          dirs={'vf-tool-m3u8/'}
          for rel,_ in rows:
              cur='vf-tool-m3u8'
              for part in rel.split('/')[:-1]:
                  cur+='/'+part; dirs.add(cur+'/')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):
                  zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
              for rel,data in rows:
                  zi=zipfile.ZipInfo('vf-tool-m3u8/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
          runtime=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in rows).encode()
          print('FILES='+str(len(rows)))
          print('REBUILT_SHA='+hashlib.sha256(out.read_bytes()).hexdigest())
          print('RUNTIME_FP='+hashlib.sha256(runtime).hexdigest())
          PY
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/m3u8-release"
          test "$(sha256sum "$RUNNER_TEMP/m3u8-release/$ASSET"|awk '{print $1}')" = "$EXPECTED_SHA"
          cmp "$RUNNER_TEMP/m3u8-old/$ASSET" "$RUNNER_TEMP/m3u8-release/$ASSET"
          echo 'PACKAGE_ROOT=vf-tool-m3u8/'
          echo 'PHYSICAL_LOCATOR=vf-tool-m3u8/vf-tool-m3u8.php'
          echo 'PASS_S01_C03_M3U8_RELEASE_SHAPE_CONFIRM'
