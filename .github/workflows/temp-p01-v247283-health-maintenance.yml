name: TEMP P01 V2.47.283 Health Maintenance Proof
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/temp-p01-v247283-health-maintenance.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.283 health maintenance')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null
      - name: Exact candidate + stable source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 563a10e6fb6194441be65aa062a3ccb043f384cc
          git -C candidate checkout -q --detach 563a10e6fb6194441be65aa062a3ccb043f384cc
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.283"
          git clone -q --depth 1 --branch v2.47.282 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247283_EXACT_SOURCE=PASS
      - name: Focused tests + syntax
        run: |
          set -Eeuo pipefail
          php -l candidate/src/system-health.php
          php -l candidate/tests/unit/system_health_maintenance_flat_v247283_contract.php
          cd candidate
          php tests/unit/system_health_maintenance_flat_v247283_contract.php
          php tests/unit/admin_system_health_page9_polish_contract.php
          php tests/unit/admin_system_health_r18_contract.php
          php tests/unit/admin_backend_closure_contract.php
          php tests/unit/backend_ia_round5_system_v247273_contract.php
          php tests/unit/admin_diagnose_entry_closure_r1_contract.php
          node tests/unit/system_health_manual_refresh_v247282_runtime.js
          echo P01_V247283_FOCUSED=PASS
      - name: Canonical regression
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/regression.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/regression.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/regression.txt
          echo P01_V247283_CANONICAL=PASS
      - name: Strict bounded diff
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 860a7cf9d92542c5a4f9c25d2cc4d0c6411ab56c..563a10e6fb6194441be65aa062a3ccb043f384cc | tee /tmp/changed
          grep -Fx 'src/system-health.php' /tmp/changed
          grep -Fx 'src/assets/admin-consolidation.css' /tmp/changed
          grep -Fx 'docs/authority/ACCEPTANCE_MATRIX.md' /tmp/changed
          if grep -E '(^|/)(migrations|schema|auth|security|update-manager)(/|$)' /tmp/changed; then exit 1; fi
          echo P01_V247283_BOUNDED_SCOPE=PASS
          echo PRODUCTION_WRITE=NO
