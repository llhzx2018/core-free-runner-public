name: S01 Ops 1.21.885 V7 R3 Candidate Gate

on:
  pull_request:
    paths:
      - ".github/workflows/s01-ops-121885-v7-r3-candidate.yml"

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_HEAD: 09b57ea52f16c5541ac08899b7ff0eca73318969
      PRODUCT_BASE: f0455c7551b4a1b9fd65036ecc4d1dc04e0bc906
      EXPECTED_VERSION: 1.21.885
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout exact private product source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Verify exact source identity and scope
        shell: bash
        run: |
          set -euo pipefail
          cd product
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(cat VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: 1.21.885" vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.885'" vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V7-R3-CONTENT-SEO-WORKSPACE" vf-ops.php

          mapfile -t files < <(git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | sort)
          expected=(
            CHANGELOG.md
            VERSION
            assets/css/current/admin-s01-v7-content-seo-r3.css
            docs/ui/S01_MATURE_ADMIN_V7_PRODUCT_SYSTEM.md
            includes/admin-v13/views/content_workflow_v6.php
            includes/admin-v13/views/seo_today_v6.php
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            tests/s01-c02-121885-v7-r3-content-seo-contract.php
            vf-ops.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${files[@]}")

          if git diff --name-only "$PRODUCT_BASE" "$PRODUCT_HEAD" | grep -Eq '(^|/)(schema|migrations?|database|db)/|\.sql$'; then
            echo "Unexpected schema/data migration surface" >&2
            exit 1
          fi

      - name: PHP syntax and R3 contract
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php -v
          find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          php -l vf-ops.php
          php tests/s01-c02-121885-v7-r3-content-seo-contract.php
          grep -Fq "vf_ops_content_workflow_admin_post_v121647" includes/admin-v13/views/content_workflow_v6.php
          grep -Fq "vf_ops_seo_planner_admin_post_v121647" includes/admin-v13/views/seo_today_v6.php
          grep -Fq "wp_nonce_field('ops.content.scan'" includes/admin-v13/views/content_workflow_v6.php
          grep -Fq "wp_nonce_field('ops.seo.runGate'" includes/admin-v13/views/seo_today_v6.php

      - name: Write public-safe candidate receipt
        shell: bash
        run: |
          set -euo pipefail
          cat > candidate-receipt.txt <<EOF
          S01-C02 VF Tools Ops 1.21.885 V7 R3 Candidate
          exact_source=$PRODUCT_HEAD
          base_source=$PRODUCT_BASE
          version=$EXPECTED_VERSION
          php_syntax=PASS
          r3_contract=PASS
          changed_scope=PASS_9_FILES
          schema=6.0.0_UNCHANGED
          data_migration=NONE
          six_domain_ia=UNCHANGED
          canonical_routes=UNCHANGED
          content_write_semantics=UNCHANGED
          seo_keyword_authority=UNCHANGED
          m3u8_ownership=UNCHANGED
          theme_ownership=UNCHANGED
          EOF
          rm -rf product

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: s01-ops-121885-v7-r3-candidate-receipt
          path: candidate-receipt.txt
          if-no-files-found: error
