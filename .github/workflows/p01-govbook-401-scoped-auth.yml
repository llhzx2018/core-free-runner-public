name: P01 GOV-BOOK Scoped Private Auth Repair
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/p01-govbook-401-scoped-auth.yml'
permissions:
  contents: read
jobs:
  exact-private-auth:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-govbook-401-scoped-auth-20261014'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact P01 auth repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b54df5f68bcdcc3a0c10e1892a3064d0696d81e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Native PHP with cURL and protected filesystem
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,mbstring,gd,sqlite3,pdo_sqlite,zip
          coverage: none
      - name: Proof isolated auth, read scope and existing regression
        shell: bash
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = b54df5f68bcdcc3a0c10e1892a3064d0696d81e9
          for file in src/app/UpdateCredentialStore.php src/app/GovBookSync.php src/gov-book-sync.php src/app/CourseLibraryPage.php tests/unit/gov_book_private_auth_isolation_native.php; do
            php -l "$file"
          done
          php tests/unit/gov_book_private_auth_isolation_native.php | tee /tmp/scoped-book-auth-proof.txt
          php tests/unit/admin_update_credential_r27_contract.php
          php tests/unit/gov_book_sync_contract_native.php
          php -r '
          require "src/app/GovBookSync.php";
          $token=getenv("VF_PRIVATE_READ_TOKEN");
          if (!is_string($token) || $token==="") throw new RuntimeException("Runner has no authorized private-read capability");
          $count=VfGovBookSync::verifyCandidateToken($token);
          if ($count!==9) throw new RuntimeException("Exact GOV-BOOK catalog authorization count mismatch");
          echo "P01_GOV_BOOK_REAL_GITHUB_PRIVATE_READ_PROBE=PASS\n";
          '
          for signal in \
            P01_GOV_BOOK_UPDATE_AUTH_ISOLATION \
            P01_GOV_BOOK_PROTECTED_FILE_AND_REVOKE \
            P01_GOV_BOOK_VERIFY_BEFORE_SAVE \
            P01_GOV_BOOK_ADMIN_CSRF_AND_UI; do
            grep -Fx "$signal=PASS" /tmp/scoped-book-auth-proof.txt
          done
          echo P01_GOV_BOOK_401_SCOPED_AUTH_EXACT_NATIVE=PASS
