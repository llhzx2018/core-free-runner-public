name: P03 V1.36.1 YAML Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'evidence/p03-v1361-polish/yaml-fix-trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      - name: Fix and validate release workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/p03-v1361-polish-release.yml')
          lines=p.read_text().splitlines()
          start=None;end=None
          for i,line in enumerate(lines):
              if line == '/* V1.36.1 BACKEND POLISH */': start=i
              if start is not None and i>start and line == "'''": end=i;break
          if start is None or end is None: raise SystemExit('CSS_BLOCK_NOT_FOUND')
          for i in range(start,end+1): lines[i]='          '+lines[i]
          p.write_text('\n'.join(lines)+'\n')
          PY
          ruby -e 'require "yaml"; YAML.load_file(ARGV[0], aliases: true); puts "YAML_PARSE_PASS"' .github/workflows/p03-v1361-polish-release.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/p03-v1361-polish-release.yml
          git config user.name 'VF Agent'
          git config user.email 'vf-agent@users.noreply.github.com'
          git add .github/workflows/p03-v1361-polish-release.yml
          git commit -m 'ci(P03): fix V1.36.1 release workflow YAML'
          git push origin HEAD:main
