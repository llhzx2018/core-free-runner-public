name: P04 V2.7.8 Release Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v278-release-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_VERSION: 2.7.8
  TARGET_TAG: v2.7.8
  SOURCE_COMMIT: ec133d34c1f27098a01aa7b5e9f8e77ba8e847a2
  UPDATE_ASSET: VF_Infra_V2.7.8_UPDATE.zip

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Credential gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo VF_PRIVATE_READ_TOKEN_MISSING; exit 78; }

      - name: Read back exact private release and update asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v278-readback"
          gh api "repos/$TARGET_REPOSITORY/releases/tags/$TARGET_TAG" > "$RUNNER_TEMP/v278-readback/release.json"
          jq -e --arg tag "$TARGET_TAG" '.tag_name==$tag and .draft==false and .prerelease==false' "$RUNNER_TEMP/v278-readback/release.json" >/dev/null
          COUNT=$(jq --arg n "$UPDATE_ASSET" '[.assets[]|select(.name==$n)]|length' "$RUNNER_TEMP/v278-readback/release.json")
          test "$COUNT" = 1
          ASSET_ID=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.id' "$RUNNER_TEMP/v278-readback/release.json")
          ASSET_BYTES=$(jq -r --arg n "$UPDATE_ASSET" '.assets[]|select(.name==$n)|.size' "$RUNNER_TEMP/v278-readback/release.json")
          RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/v278-readback/release.json")
          RELEASED_AT=$(jq -r '.published_at // .created_at' "$RUNNER_TEMP/v278-readback/release.json")
          TARGET_COMMITISH=$(jq -r '.target_commitish' "$RUNNER_TEMP/v278-readback/release.json")
          test "$TARGET_COMMITISH" = "$SOURCE_COMMIT"
          gh api -H 'Accept: application/octet-stream' "repos/$TARGET_REPOSITORY/releases/assets/$ASSET_ID" > "$RUNNER_TEMP/v278-readback/$UPDATE_ASSET"
          ACTUAL_BYTES=$(wc -c < "$RUNNER_TEMP/v278-readback/$UPDATE_ASSET" | tr -d ' ')
          test "$ACTUAL_BYTES" = "$ASSET_BYTES"
          SHA=$(sha256sum "$RUNNER_TEMP/v278-readback/$UPDATE_ASSET" | awk '{print $1}')
          unzip -t "$RUNNER_TEMP/v278-readback/$UPDATE_ASSET" >/dev/null
          python3 - "$RUNNER_TEMP/v278-readback/release.json" "$SHA" "$GITHUB_WORKSPACE/evidence.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); sha=sys.argv[2]
          asset=[a for a in r['assets'] if a['name']=='VF_Infra_V2.7.8_UPDATE.zip'][0]
          out={
            'status':'PASS','project':'P04','version':'2.7.8','schema':14,
            'repository':'llhzx2018/vf-infra','release_tag':'v2.7.8',
            'release_name':r['name'],'release_id':r['id'],
            'release_product_commit':'ec133d34c1f27098a01aa7b5e9f8e77ba8e847a2',
            'asset_name':asset['name'],'asset_id':asset['id'],'asset_bytes':asset['size'],
            'asset_sha256':sha,'released_at':r.get('published_at') or r.get('created_at'),
            'draft':r['draft'],'prerelease':r['prerelease']
          }
          open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('P04_V278_RELEASE_READBACK=PASS')
          print('UPDATE_SHA256='+sha)
          PY

      - name: Publish public-safe readback evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/p04
          cp evidence.json evidence/p04/P04_V278_RELEASE_LATEST.json
          git config user.name 'vf-runner'
          git config user.email 'vf-runner@users.noreply.github.com'
          git add evidence/p04/P04_V278_RELEASE_LATEST.json
          git diff --cached --quiet && exit 0
          git commit -m 'evidence(P04): V2.7.8 release readback'
          git push origin HEAD:main
