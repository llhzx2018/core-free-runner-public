name: P01 course guest-owner visibility exact-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-course-login-scope.yml'
permissions:
  contents: read
jobs:
  regression:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_SHA: 5a1796f65ed68cb909f7e5d8bea524a6abfce585
    steps:
      - name: PHP and Node environment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Eix 'pdo_sqlite|mbstring'
          node --version
      - name: Exact source and formal release baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git"
          live="$(git ls-remote "$remote" refs/heads/fix/p01-course-guest-owner-visibility-20261020 | awk '{print $1}')"
          test "$live" = "$PRODUCT_SHA"
          git clone -q --no-checkout "$remote" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          git clone -q --depth 1 --branch v2.47.396 "$remote" baseline
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d ' \r\n' < candidate/VERSION)" = "2.47.396"
          echo P01_LOGIN_SCOPE_EXACT_SOURCE=PASS
      - name: Focused production bug regression and adjacent contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          for file in src/app/CourseLibraryPage.php src/app/CourseCatalogPresentation.php tests/unit/course_login_scope_visibility_regression.php; do php -l "$file" >/dev/null; done
          node --check src/assets/auth-controls.js
          node --check tests/unit/course_guest_owner_login_native.js
          php tests/unit/course_login_scope_visibility_regression.php
          node tests/unit/course_guest_owner_login_native.js
          for t in course_catalog_pairing_runtime course_duplicate_display_source_contract course_unique_book_stats_contract course_filter_context_contract course_guest_owner_storage_contract course_reading_brief_contract; do php "tests/unit/${t}.php"; done
          php tests/course_learning_brief_regression.php
          echo P01_LOGIN_SCOPE_FOCUSED=PASS
      - name: Canonical full unit regression zero debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/p01-course-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-course-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-course-canonical.txt
          echo P01_COURSE_FULL_REGRESSION=PASS
