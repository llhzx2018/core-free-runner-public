name: p01-v24765-candidate-gate-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24765-candidate-gate-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: c6c5ed1c206932bcb4b1fdd6c829e332c2835a6a
      STABLE_SHA: 8dc91930b94b59ab3e08234cddbdffd8d752b24e
      PRODUCT_BASE_SHA: 6af5cb7842d973cb622d2e988724c3b6e7f1cef8
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact candidate and stable source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in candidate stable; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C candidate fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C stable fetch -q --depth 1 origin "${STABLE_SHA}"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.65"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.65"
          echo P01_V24765_CANDIDATE_EXACT_SOURCE=PASS

      - name: Candidate identity diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_BASE_SHA"
          git -C candidate diff --name-only "$PRODUCT_BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          VERSION
          src/VERSION.txt
          src/app/bootstrap.php
          tests/unit/engineering_consistency_r80_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_V24765_CANDIDATE_IDENTITY_DIFF=PASS

      - name: Focused UI and identity contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/admin_recycle_bin_page6_polish_contract.php
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/recycle_bin_admin_return_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do php "candidate/${t}"; done
          echo P01_V24765_CANDIDATE_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V24765_CANDIDATE_CANONICAL=PASS
