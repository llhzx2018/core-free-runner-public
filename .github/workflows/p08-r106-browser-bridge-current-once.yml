name: P08 R106 issued FULL distinct bridge HTTPS Chromium current channel once
on:
  pull_request:
    paths:
      - .github/workflows/p08-r106-browser-bridge-current-once.yml
permissions:
  contents: read
jobs:
  issued-full-bridge-chromium:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_ACTIONS: "true"
      P08_ISOLATED_INSTALL_TEST: "YES"
      P08_R105_DISPOSABLE: "YES"
      P08_R105_REAL_FULL_ISOLATED: "YES"
      P08_R106_BROWSER: "YES"
      P08_R106_SOURCE: f5795b8a5620667750de7aff5f6928f889716170
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Exact active PR source disposable checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f5795b8a5620667750de7aff5f6928f889716170
          path: p08-private
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Current GOV-DOC canonical structural source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          path: gov-current
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 genuine SQLite and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo, curl, dom, xml, bcmath, intl, sodium
          tools: composer:v2
      - name: Locked Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact-source syntax and browser-only authority guards
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p08-private rev-parse HEAD)" = "$P08_R106_SOURCE"
          test "$(git -C gov-current rev-parse HEAD)" = 64c8a874210f2fa89fee07c7283ffce2bbe6b36c
          test "$(cat p08-private/VERSION)" = 0.1.2
          for file in tests/compatibility/r106_browser_owner_fixture.php \
                      src/Upgrade/FlatLayoutBridgePrepare.php \
                      src/Upgrade/FlatLayoutBridgeActivation.php \
                      src/Upgrade/R106Installed012Source.php; do
            php -l "p08-private/$file" > "$RUNNER_TEMP/r106-lint.log" 2>&1 || {
              echo R106_BROWSER_PHP_LINT=FAIL; exit 1;
            }
          done
          bash -n p08-private/tests/compatibility/run_r106_bridge_https_browser.sh
          python3 -B - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('p08-private/tests/compatibility/r106_browser_current_channel_proxy.py').read_text())
          PY
          echo R106_BROWSER_FIXTURE_PHP_BASH_PYTHON_SYNTAX=PASS
      - name: Build complete separately sourced R106 indexed updater FULL and canonical structural gate
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-browser-build"
          git -C p08-private archive HEAD | tar -xf - -C "$RUNNER_TEMP/p08-r106-browser-build"
          cd "$RUNNER_TEMP/p08-r106-browser-build"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress > "$RUNNER_TEMP/r106-composer.log" 2>&1 || {
            echo R106_BROWSER_COMPOSER_BUILD=FAIL; exit 1;
          }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/r106-npm.log" 2>&1 || {
            echo R106_BROWSER_NPM_LOCKED_BUILD=FAIL; exit 1;
          }
          npm run build >> "$RUNNER_TEMP/r106-npm.log" 2>&1 || {
            echo R106_BROWSER_VITE_BUILD=FAIL; exit 1;
          }
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PY' >"$RUNNER_TEMP/r106-gate.log" 2>&1 || {
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('p08-private/scripts').resolve()))
          from build_full import write_full,verify_canonical_full_contract
          source=Path('p08-private').resolve()
          built=Path(os.environ['RUNNER_TEMP'])/'p08-r106-browser-build'
          artifact=Path(os.environ['RUNNER_TEMP'])/'r106-browser-bridge-full.zip'
          gov=Path('gov-current').resolve()
          sha=os.environ['P08_R106_SOURCE']
          verify_canonical_full_contract(source,artifact,sha,gov,'resolve')
          write_full(built,artifact,'0.1.2',sha)
          verify_canonical_full_contract(source,artifact,sha,gov,'delivery')
          PY
            echo R106_BROWSER_CANONICAL_FULL_GATE=FAIL; exit 1;
          }
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-updater-bridge-browser"
          unzip -q "$RUNNER_TEMP/r106-browser-bridge-full.zip" -d "$RUNNER_TEMP/p08-r106-updater-bridge-browser"
          echo R106_BROWSER_BRIDGE_FULL_SOURCE_CANONICAL=PASS
      - name: Download genuine issued v0.1.2 FULL immutable official ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$P08_PRIVATE_READ_TOKEN"
          curl --fail --silent --show-error --location --max-time 90 \
            --header "Authorization: Bearer $P08_PRIVATE_READ_TOKEN" \
            --header "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/r106-browser-issued-v012.zip"
          test "$(wc -c < "$RUNNER_TEMP/r106-browser-issued-v012.zip")" = 10390070
          echo "1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  $RUNNER_TEMP/r106-browser-issued-v012.zip" | sha256sum -c --status
          mkdir -m 0700 "$RUNNER_TEMP/p08-r106-browser-site-current"
          unzip -q "$RUNNER_TEMP/r106-browser-issued-v012.zip" -d "$RUNNER_TEMP/p08-r106-browser-site-current"
          echo R106_BROWSER_AUTHENTIC_OFFICIAL_V012_FULL_BYTES=PASS
      - name: Actual published FULL Owner install then different R106 offline bridge with native SQLite snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for phase in install bridge; do
            php p08-private/tests/compatibility/r106_browser_owner_fixture.php \
              "$phase" "$RUNNER_TEMP/p08-r106-browser-site-current" \
              "$RUNNER_TEMP/p08-r106-updater-bridge-browser" "$P08_R106_SOURCE" \
              >"$RUNNER_TEMP/r106-phase-$phase.log" 2>&1 || {
                echo R106_BROWSER_OWNER_FULL_OR_BRIDGE=FAIL:$phase; exit 1;
              }
          done
          grep -Fxq 'R106_BROWSER_GENUINE_ISSUED_FULL_OWNER_SQLITE_INSTALLED=PASS' "$RUNNER_TEMP/r106-phase-install.log"
          grep -Fxq 'R106_BROWSER_ISSUED_FULL_DISTINCT_BRIDGE_AND_NATIVE_SNAPSHOT=PASS' "$RUNNER_TEMP/r106-phase-bridge.log"
          echo R106_BROWSER_OWNER_GENUINE_FULL_TO_DISTINCT_BRIDGE_AND_BACKUP=PASS
      - name: Install isolated Nginx and Chromium without Owner/Production access
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx >/dev/null
          cd p08-private
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/r106-browser-deps.log" 2>&1
          npx playwright install --with-deps chromium >"$RUNNER_TEMP/r106-chromium.log" 2>&1
          echo R106_BROWSER_REAL_NGINX_CHROMIUM_DEPENDENCIES=PASS
      - name: Actual Owner Chromium HTTPS session CSRF click current channel and no phantom Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          bash p08-private/tests/compatibility/run_r106_bridge_https_browser.sh \
            "$RUNNER_TEMP/p08-r106-browser-site-current" "$P08_R106_SOURCE"
      - name: Always remove ephemeral private source, fixture tokens, isolated data, ZIP and browser logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- p08-private gov-current \
            "$RUNNER_TEMP/p08-r106-browser-build" \
            "$RUNNER_TEMP/p08-r106-updater-bridge-browser" \
            "$RUNNER_TEMP/p08-r106-browser-site-current" \
            "$RUNNER_TEMP/p08-r106-browser-web-stack"
          rm -f -- "$RUNNER_TEMP"/r106-*.zip "$RUNNER_TEMP"/r106-*.log "$RUNNER_TEMP"/r106-phase-*.log
          echo R106_BROWSER_PRIVATE_SOURCES_OWNER_DATA_AND_FAKE_TOKENS_PURGED=YES
