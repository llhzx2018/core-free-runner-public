name: S01 Theme108 Formal Run Locator
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read public-safe formal run IDs for audited candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/runs?branch=task%2Fs01-theme108-formal-20261011&per_page=30" --jq '.workflow_runs[] | select(.event=="push") | select(.name=="S01 Theme108 candidate-gated exact private formal release") | [.id,.status,.conclusion,.head_sha,.html_url] | @tsv'
