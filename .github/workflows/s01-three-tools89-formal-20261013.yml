name: S01 M3U8 exact candidate gated private formal release
on:
  push:
    branches: [task/s01-three-tools89-formal-20261013]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-m3u8'
      TARGET_VERSION: '1.25.89'
      TARGET_SHA: '4e293f94f40e0c5a2beccacf40b50b7f7cc4c46b'
      TARGET_TREE: '7750db4f5366f2030b4b1573aed62f47d3df70ee'
      TARGET_MAIN_SHA: '4e293f94f40e0c5a2beccacf40b50b7f7cc4c46b'
      TESTED_SOURCE_SHA: '14a34b70ac8fdf0ee81b5f9c4c5b098552be26ee'
      TESTED_SOURCE_TREE: 'cc6d62e712bbd6da73b45e468683b65b0b27aca2'
      SOURCE_VERSION: '1.25.88'
      BASE_SHA: '11382d2ee14fd8339f5159e305b3582af8b1078c'
      M3_BASE_SHA: '11382d2ee14fd8339f5159e305b3582af8b1078c'
      FIXTURE_THEME_SHA: 'a33085f1f741b232a06ab8c951ac0b405b03ca05'
      FIXTURE_THEME_TREE: '95c95632cb0023a796262794446c08f55776ae65'
      CANDIDATE_RUN: '38358835457'
      CANDIDATE_SHA: 'cd8f55acce9329b5b57b16818457903735d15fb3'
      CANDIDATE_ARTIFACT: '11794440148'
      CANDIDATE_DIGEST: 'sha256:f9a9093e54c9175575ae2a06f80493b1c9d93c8beb6326c928593f7ae9ec7116'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-three-tools89-formal-20261013/spec.json --template runner/lanes/s01-three-tools89-formal-20261013/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-three-tools89-formal-20261013.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-three-tools89-formal-20261013/spec.json --input runner/.github/workflows/s01-three-tools89-formal-20261013.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-three-tools89-formal-20261013 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic rebuild and tested asset equality
        run: bash lane/build.sh
      - name: Publish authorized M3U8 formal release and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: three-tools89-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 2
          done
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['m3u8-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PUBLIC_SAFE_FORMAL_RECEIPT',json.dumps({'status':'PASS','artifact_id':m['id'],'bytes':len(b),'digest':m['digest'],'run_id':os.environ['GITHUB_RUN_ID']}))
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip


