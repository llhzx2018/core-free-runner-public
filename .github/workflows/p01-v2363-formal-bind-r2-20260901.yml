name: P01 V2.36.3 Formal Bind R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-formal-bind-r2-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 718e043e3715ef7b21849bc08634fca89bf92c1f
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Formal bind R2
        shell: bash
        run: |
          set -Eeuo pipefail
          E=/tmp/v2363-bind-r2; mkdir -p "$E"
          C=d49a2a2be8c6c0386e03b0c880f1e6024396e4e0
          D=0b2890fed3153086be1c77fe2a3f119264dc24a2
          B=718e043e3715ef7b21849bc08634fca89bf92c1f
          RT=820724b585cb59864211f77c4fb33537b2345029
          test "$(git rev-parse HEAD)" = "$B"
          test "$(git rev-parse HEAD^)" = "$C"
          test "$(git rev-parse HEAD:src)" = "$RT"
          test "$(git diff --name-only "$C..$B" | tr '\n' ' ')" = 'VF_PROJECT.json '
          LIVE=$(git ls-remote origin refs/heads/develop | cut -f1); test "$LIVE" = "$D"
          test "$(cat VERSION)" = 2.36.3; test "$(cat src/VERSION.txt)" = 2.36.3
          python3 - <<'PY'
          import json,urllib.request
          d=json.load(open('VF_PROJECT.json')); g=d['v2_36_3_candidate_gate']
          assert d['candidate_version']=='2.36.3' and d['production_version']=='2.36.2' and d['schema_version']=='2026082901'
          assert g['state']=='PASS' and g['candidate']=='d49a2a2be8c6c0386e03b0c880f1e6024396e4e0'
          assert g['runtime_tree']=='820724b585cb59864211f77c4fb33537b2345029' and g['runtime_delta_count']==7
          assert g['artifact']==9798055642 and g['artifact_sha256']=='39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa'
          assert g['full_zip_sha256']=='337513f31235d92deba9def79c8b8519502ae26850ef46408df0258c879dd0ca'
          assert g['update_zip_sha256']=='d3eefd09548cc731f3b01de502ce106bc48fe890063aebcfe1a2d6de5ed031c8'
          assert g['atomic_upgrade']=='V2.36.2 -> V2.36.3 PASS' and g['visual_readback'].startswith('PASS')
          assert g['harness_r1_classification'].startswith('HARNESS-ONLY') and not g['owner_production_write']
          r=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010'))
          assert r['conclusion']=='success'
          a=json.load(urllib.request.urlopen('https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33501907010/artifacts'))['artifacts']
          a=[x for x in a if x['id']==9798055642][0]
          assert a['digest']=='sha256:39225162784a38693175524142643866e8fafd9ed528324aa5fb4896829eacaa' and not a['expired']
          PY
          git diff --name-only "$D..$B" | sort > "$E/actual"
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php | sort > "$E/expected"
          diff -u "$E/expected" "$E/actual"
          for p in src/app/FunctionalWorkspace.php src/assets/workspace-domain-nav.css src/index.php src/start.php src/surface.php; do test "$(git rev-parse "$D:$p")" = "$(git rev-parse "$B:$p")"; done
          printf 'P01_V2363_FORMAL_BIND_R2=PASS\nBOUND=%s\nRUNTIME_TREE=%s\nLIVE_DEVELOP=%s\nR1=HARNESS_ONLY\nOWNER_PRODUCTION_WRITE=NO\n' "$B" "$RT" "$LIVE" | tee "$E/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-formal-bind-r2-${{ github.run_id }}
          path: /tmp/v2363-bind-r2
          retention-days: 90
