name: P01 V2.36.1 Prepare Candidate
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-prepare-candidate-20260901.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: release/p01-v2361-candidate-20260901
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.1-candidate-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Prepare exact patch candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          BASE='8cce764a455031d6c8cc20ec1c6fd79477f6ff28'
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 ../runner/scripts/p01_v2361_prepare_candidate.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected='CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php '
          test "$actual" = "$expected"
          test "$(cat VERSION)" = '2.36.1'
          test "$(cat src/VERSION.txt)" = '2.36.1'
          grep -Fq "define('VF_VERSION', '2.36.1');" src/app/bootstrap.php
          test -z "$(git diff --name-only -- src/migrations/)"
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'release(P01): prepare V2.36.1 patch candidate'
          echo "CANDIDATE_SOURCE=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          git push origin HEAD:release/v2.36.1-candidate-20260901
