name: P01 V247353 Core Updates Exact-Manifest CI (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247353-core-updates-ci.yml'
permissions:
  contents: read
jobs:
  core-updates-ci:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact distribution proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 7fc5e3a03ee5c20ab5ea4d09e6c663aa18f5213a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip
          coverage: none
      - name: Assert exact P01 distribution identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 7fc5e3a03ee5c20ab5ea4d09e6c663aa18f5213a
          jq -e '.project_id=="P01" and .current_version=="2.47.352" and .target_version=="2.47.353" and .release_tag=="v2.47.353" and .product_identity=="fec449e9a77df806a52fbea867d5e535f2500898" and .asset_bytes==2457397 and .asset_sha256=="cec496ec2a7eb651e6f8836e67c7adc0f3f5d5e42fed04caae72d9e6c19a2c58" and .from_versions==["2.47.352"]' projects/P01.json >/dev/null
          echo P01_EXACT_UPDATE_MANIFEST_IDENTITY=PASS
      - name: Execute canonical manifest contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py | tee /tmp/p01-update-manifest-contract.json
          jq -e '.status=="PASS"' /tmp/p01-update-manifest-contract.json >/dev/null
          echo P01_UPDATE_MANIFEST_CONTRACT=PASS
      - name: Execute PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/tmp/p01-update-php-lint.log
          test -s /tmp/p01-update-php-lint.log
          echo P01_UPDATE_PHP_SYNTAX=PASS
      - name: Execute Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php update-core/php/tests/run.php | tee /tmp/p01-update-core-test.log
          echo P01_UPDATE_CORE_REGRESSION=PASS
