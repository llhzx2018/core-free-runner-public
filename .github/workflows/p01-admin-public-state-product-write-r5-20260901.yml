name: P01 Admin Public State Product Write R5
on:
  push:
    branches: [temp/p01-admin-public-state-clarity-20260901]
    paths: [.github/workflows/p01-admin-public-state-product-write-r5-20260901.yml]
permissions:
  contents: read
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-admin-public-state-clarity-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-admin-public-state-clarity-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Guarded Product mutation with robust legacy JS fences
        shell: bash
        env:
          EXPECTED_BASE: 5ee91a4e0c2ce66a5c22850ae09b1bd6c7cd8081
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$EXPECTED_BASE"
          test -z "$(git -C product status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path

          wf=Path('runner/.github/workflows/p01-admin-public-state-product-write-r2-20260901.yml').read_text()
          script=[]; capture=False
          for line in wf.splitlines(True):
              if line.strip()=="python3 - <<'PY'": capture=True; continue
              if capture and line.strip()=='PY': break
              if capture: script.append(line[10:] if line.startswith('          ') else line)
          code=''.join(script)

          # Normalize both old/new renderHeader triple-string snippets to the live 2-space JS indentation.
          old="function renderHeader() {\n    var auth=!!(state.site&&state.site.auth)"
          new="function renderHeader() {\n  var auth=!!(state.site&&state.site.auth)"
          if code.count(old)!=2: raise SystemExit(f'R5 renderHeader source fence failed: {code.count(old)}')
          code=code.replace(old,new)

          # Execute the already-proven guarded prefix, but stop before the multiline legacy login block.
          tail="replace('src/index.php',\"\"\"  $('#loginButton').innerHTML="
          css="append_once('src/assets/workspace-domain-nav.css'"
          if code.count(tail)!=1 or code.count(css)!=1:
              raise SystemExit(f'R5 split fence failed: tail={code.count(tail)} css={code.count(css)}')
          prefix=code[:code.index(tail)]
          suffix=code[code.index(css):]
          scope={'__name__':'__main__'}
          compile(prefix,'p01-admin-public-state-r5-prefix.py','exec')
          exec(prefix,scope)

          root=Path('product')
          p=root/'src/index.php'; s=p.read_text()
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'index {label} fence failed: {n}')
              s=s.replace(old,new,1)

          one("  $('#loginButton').innerHTML=icon(auth?'logout':'login',15)+'<span>'+(auth?'退出':'登录')+'</span>';",
              "  var stateNode=$('#viewState');if(stateNode){stateNode.textContent=preview?'公开视角':(auth?'管理员视角':'公开视角');stateNode.classList.toggle('is-admin',auth);stateNode.classList.toggle('is-preview',preview);}\n  $('#loginButton').innerHTML=preview?(icon('arrowleft',15)+'<span>返回管理</span>'):(icon(auth?'logout':'login',15)+'<span>'+(auth?'退出':'登录')+'</span>');",
              'login button label')

          one("  $$('.admin-only').forEach(function(node){if(node.id==='globalUpdateButton'){if(!auth)node.classList.add('hidden');return;}node.classList.toggle('hidden',!auth);});document.body.classList.toggle('is-admin',auth);",
              "  $$('.admin-only').forEach(function(node){if(node.id==='globalUpdateButton'){if(!auth)node.classList.add('hidden');return;}node.classList.toggle('hidden',!auth);});document.body.classList.toggle('is-admin',auth);document.body.classList.toggle('is-public-preview',preview);",
              'admin-only state')

          one("  var submit=async function(){var password=$('[name=password]',root).value;try{await api('login',{method:'POST',body:{password:password},csrf:false});(root.closeModal?root.closeModal():(root.remove(),syncOverlayLock()));await load(false);toast('已进入管理模式');}catch(error){toast(error.message,'error');}};",
              "  var submit=async function(){var password=$('[name=password]',root).value;try{await api('login',{method:'POST',body:{password:password},csrf:false});(root.closeModal?root.closeModal():(root.remove(),syncOverlayLock()));var next=document.body.dataset.vfLoginNext||'';if(next){location.href=next;return;}await load(false);toast('已进入管理模式');}catch(error){toast(error.message,'error');}};",
              'login redirect')

          one("  $('#loginButton').addEventListener('click',async function(){if(state.site&&state.site.auth){if(!window.confirm('退出管理模式？'))return;try{await api('logout',{method:'POST',body:{}});state.mode='home';state.selected=0;history.pushState(null,'','#/');await load(false,{preserveScroll:false});toast('已退出管理模式');}catch(error){toast(error.message,'error');}}else openLogin();});",
              "  $('#loginButton').addEventListener('click',async function(){if(state.site&&state.site.publicPreview){location.href=document.body.dataset.vfPreviewReturnHref||'home.php';return;}if(state.site&&state.site.auth){if(!window.confirm('退出管理模式？'))return;try{await api('logout',{method:'POST',body:{}});state.mode='home';state.selected=0;history.pushState(null,'','#/');await load(false,{preserveScroll:false});toast('已退出管理模式');}catch(error){toast(error.message,'error');}}else openLogin();});",
              'desktop preview return')

          one("  $('#mobileCategories').addEventListener('click',openSidebar);$('#mobileSearch').addEventListener('click',openPalette);$('#mobileAccount').addEventListener('click',function(){if(state.site&&state.site.auth){location.href='manage.php';return;}openLogin();});",
              "  $('#mobileCategories').addEventListener('click',openSidebar);$('#mobileSearch').addEventListener('click',openPalette);$('#mobileAccount').addEventListener('click',function(){if(state.site&&state.site.publicPreview){location.href=document.body.dataset.vfPreviewReturnHref||'home.php';return;}if(state.site&&state.site.auth){location.href='manage.php';return;}openLogin();});",
              'mobile preview return')

          one("(function start(){var saved=vfStorage.getItem('vfnav-theme'),dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',saved||(dark?'dark':'light'));initEvents();load(true).catch(function(error){showBootError(error);toast(error.message,'error');});})();",
              "(function start(){var saved=vfStorage.getItem('vfnav-theme'),dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',saved||(dark?'dark':'light'));initEvents();load(true).then(function(){if(document.body.dataset.vfLoginPrompt==='1'&&!(state.site&&state.site.auth)&&!(state.site&&state.site.publicPreview))openLogin();}).catch(function(error){showBootError(error);toast(error.message,'error');});})();",
              'login prompt bootstrap')
          p.write_text(s)

          # Execute only the CSS append suffix from the original guarded script.
          compile(suffix,'p01-admin-public-state-r5-suffix.py','exec')
          exec(suffix,scope)
          PY

          for f in product/src/app/FunctionalWorkspaceCore.php product/src/app/FunctionalWorkspaceShell.php product/src/app/FunctionalWorkspace.php product/src/start.php product/src/index.php product/src/api.php; do php -l "$f"; done
          git -C product diff --check
          git -C product diff --name-only | sort | tee /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          src/api.php
          src/app/FunctionalWorkspace.php
          src/app/FunctionalWorkspaceCore.php
          src/app/FunctionalWorkspaceShell.php
          src/assets/frontend.css
          src/assets/workspace-domain-nav.css
          src/index.php
          src/start.php
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          test -z "$(git -C product diff --name-only | grep -Ev '^(src/api.php|src/app/FunctionalWorkspace.php|src/app/FunctionalWorkspaceCore.php|src/app/FunctionalWorkspaceShell.php|src/assets/frontend.css|src/assets/workspace-domain-nav.css|src/index.php|src/start.php)$' || true)"
          git -C product config user.name VictorForge
          git -C product config user.email llhzx2018@gmail.com
          git -C product add src/api.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/assets/frontend.css src/assets/workspace-domain-nav.css src/index.php src/start.php
          git -C product commit -m 'fix(P01): make admin and public view state explicit'
          git -C product push origin HEAD:product/p01-admin-public-state-clarity-20260901
          git -C product rev-parse HEAD
