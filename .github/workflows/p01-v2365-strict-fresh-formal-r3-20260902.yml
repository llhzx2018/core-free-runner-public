name: P01 V2.36.5 Strict Fresh Formal R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-v2365-strict-fresh-formal-r3-20260902.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33547781563'
      FORMAL_ARTIFACT: p01-v2365-formal-artifacts-33547781563
      FORMAL_ARTIFACT_ID: '9816176949'
      FORMAL_ARTIFACT_DIGEST: sha256:170b6aca563a93a625cb77e1bc6f7918bf9772177da9adcc1fe6bde91d2c8b37
      STRICT_FRESH_R1: '33548191297'
      STRICT_FRESH_R2: '33548388404'
      FORMAL: ef86eba16aec71c1d0dabc16ad23089a78ee5057
      FORMAL_TREE: 926504354eaf4354e852e78b19c0fde69513a133
      FORMAL_RUNTIME_TREE: a7f472ec1f449ada1152d271f2723c52e7b58144
      PREDECESSOR: 6b321422bce5a834521786d8233149c7624aa014
      SCHEMA: '2026082901'
      FULL_BYTES: '587547'
      FULL_SHA: 6718216489852bd4f326f05371b590d8089a63e5ee76f56fc992afa58f8c33cf
      UPDATE_BYTES: '1238610'
      UPDATE_SHA: bb28284f15e8e94673f604c43f1b89692134dc92fdce8343cefc90431e52f6b6
      REPAIR_BYTES: '3595293'
      REPAIR_SHA: b3a3e1a4cc9c6133ea0579430e2bbd900e4bd3a4126ad66abf0d89fecc34a2ee
      DOWNLOAD: /tmp/p01-v2365-strict-r3-download
      FRESH: /tmp/p01-v2365-strict-r3-fresh
      EVID: /tmp/p01-v2365-strict-r3-evidence
      COOKIE: /tmp/p01-v2365-strict-r3.cookies
      PORT: '18597'
      ADMIN_PASS: P01V2365StrictFormalR3
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 95fa7dbcc6c9eb5869412a88bdc58382870abebe
          path: gridhelper
      - name: Frozen artifact exact evidence and fresh install
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID/screens"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_FRESH_R1 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_FRESH_R2 --jq .conclusion)" = failure
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          LIVE=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN/artifacts)
          LIVE_ID=$(jq -r '.artifacts[]|select(.name=="p01-v2365-formal-artifacts-33547781563")|.id' <<<"$LIVE")
          LIVE_DIGEST=$(jq -r '.artifacts[]|select(.id==9816176949)|.digest' <<<"$LIVE")
          LIVE_EXPIRED=$(jq -r '.artifacts[]|select(.id==9816176949)|.expired' <<<"$LIVE")
          test "$LIVE_ID" = "$FORMAL_ARTIFACT_ID"; test "$LIVE_DIGEST" = "$FORMAL_ARTIFACT_DIGEST"; test "$LIVE_EXPIRED" = false
          printf 'R1=HARNESS_ONLY_EXPECTED_ARTIFACT_DIGEST_TYPO\nR2=HARNESS_ONLY_EXPECTED_FILE_SHA_TYPO\nLIVE_ID=%s\nLIVE_DIGEST=%s\n' "$LIVE_ID" "$LIVE_DIGEST" | tee "$EVID/prior-classification.txt"
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.5-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          for spec in \
            "VF-Start-V2.36.5-FULL.zip:$FULL_BYTES:$FULL_SHA" \
            "VF_Start_V2.36.5_UPDATE.zip:$UPDATE_BYTES:$UPDATE_SHA" \
            "repair-v2.36.5.php:$REPAIR_BYTES:$REPAIR_SHA"; do
            IFS=: read -r file bytes sha <<<"$spec"; test "$(stat -c%s "$ART_DIR/$file")" = "$bytes"; test "$(sha256sum "$ART_DIR/$file"|awk '{print $1}')" = "$sha"
          done
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="ef86eba16aec71c1d0dabc16ad23089a78ee5057" and .formal_tree=="926504354eaf4354e852e78b19c0fde69513a133" and .runtime_tree=="a7f472ec1f449ada1152d271f2723c52e7b58144" and .schema=="2026082901" and .migration==null and .added==[] and .removed==[] and (.changed|sort)==(["VERSION.txt","app/FunctionalWorkspace.php","app/ResourceCoverCache.php","app/bootstrap.php","assets/resource-media.css","assets/update-core.js","assets/workspace-rebaseline.css"]|sort)' "$ART_DIR/P01-V2.36.5-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.5
          grep -Fx "define('VF_VERSION', '2.36.5');" "$FRESH/app/bootstrap.php" >/dev/null
          grep -F 'confirmRuntimeThenReload(toVersion)' "$FRESH/assets/update-core.js" >/dev/null
          grep -F "'youtube' => \$candidates === [] ? 3 * 1024 * 1024 : 524288" "$FRESH/app/ResourceCoverCache.php" >/dev/null
          grep -F "'apple-podcasts' => 2 * 1024 * 1024" "$FRESH/app/ResourceCoverCache.php" >/dev/null
          grep -F "vf_asset_url('assets/resource-actions.css')" "$FRESH/app/FunctionalWorkspace.php" >/dev/null
          ! grep -F '@import url("resource-actions.css")' "$FRESH/assets/resource-media.css" >/dev/null
          grep -F '.vf-functional-head>div{min-width:0}' "$FRESH/assets/workspace-rebaseline.css" >/dev/null
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >"$EVID/js-syntax.txt"
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2365-strict-r3.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -L -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 V2.36.5 Strict Formal R3' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          P01_ROOT="$FRESH" php gridhelper/scripts/p01_anonymous_grid_seed.php | tee "$EVID/grid-seed.txt"
          grep -Fx P01_ANONYMOUS_GRID_SEED=PASS "$EVID/grid-seed.txt"
      - name: Canonical asset authority fresh HTTP check
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS "http://127.0.0.1:$PORT/channels.php" -o "$EVID/channels-anon.html"
          grep -F 'asset.php?file=resource-actions.css' "$EVID/channels-anon.html" >/dev/null
          ! grep -F 'href="resource-actions.css"' "$EVID/channels-anon.html" >/dev/null
          ASSET=$(python3 - "$EVID/channels-anon.html" <<'PY'
          import re,sys,html
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'href="([^"]*asset\.php\?file=resource-actions\.css[^\"]*)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          curl -fsS -D "$EVID/resource-actions.headers" "http://127.0.0.1:$PORT/$ASSET" -o "$EVID/resource-actions.css"
          grep -Eqi '^Content-Type: *text/css' "$EVID/resource-actions.headers"; test -s "$EVID/resource-actions.css"
          printf 'CANONICAL_RESOURCE_ACTIONS_ASSET=PASS\nWRONG_ROOT_RESOURCE_ACTIONS_REQUEST=ABSENT\n' | tee "$EVID/asset-authority.txt"
      - name: Install Chromium harness
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then python -m playwright install chromium; fi
      - name: Anonymous authenticated logout browser gate 390 1319 1440
        env:
          P01_BASE_URL: http://127.0.0.1:18597
          P01_ADMIN_PASSWORD: P01V2365StrictFormalR3
          P01_EVIDENCE_DIR: /tmp/p01-v2365-strict-r3-evidence/screens
        run: |
          set -Eeuo pipefail
          python gridhelper/scripts/p01_anonymous_grid_gate.py | tee "$EVID/grid-browser.txt"
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"
      - name: Final fresh runtime privacy SQLite and verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          for route in start.php channels.php watch.php topics.php; do curl -fsS "http://127.0.0.1:$PORT/$route" -o "$EVID/anonymous-${route%.php}.html"; done
          ! grep -R -F '管理员视角' "$EVID"/anonymous-*.html; ! grep -R -F '公开视角' "$EVID"/anonymous-*.html; ! grep -R -F '查看公开版' "$EVID"/anonymous-*.html; ! grep -R -F '返回管理' "$EVID"/anonymous-*.html
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/db-final.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(1);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(2);echo "INTEGRITY=ok\nFK=0\n";
          PHP
          grep -Fx P01_ANONYMOUS_GRID_BROWSER=PASS "$EVID/grid-browser.txt"; grep -Fx CANONICAL_RESOURCE_ACTIONS_ASSET=PASS "$EVID/asset-authority.txt"
          printf 'P01_V2365_STRICT_FRESH_FORMAL_R3=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nPREDECESSOR=%s\nSCHEMA=%s\nFORMAL_RUN=%s\nFORMAL_ARTIFACT=%s\nFORMAL_ARTIFACT_DIGEST=%s\nFULL_SHA=%s\nUPDATE_SHA=%s\nREPAIR_SHA=%s\nANONYMOUS_GRID_390_1319_1440=PASS\nLOGIN_LOGOUT=PASS\nCANONICAL_ASSET_AUTHORITY=PASS\nTERMINAL_RUNTIME_CONFIRM=PASS\nAUTO_COVER_CONTRACTS=PASS\nMOBILE_CONTEXT_PATH_CONTRACT=PASS\nONE_FRONTEND=PASS\nPRIVACY=PASS\nSQLITE=PASS\nR1_FAILURE=HARNESS_ONLY_EXPECTED_ARTIFACT_DIGEST_TYPO\nR2_FAILURE=HARNESS_ONLY_EXPECTED_FILE_SHA_TYPO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$PREDECESSOR" "$SCHEMA" "$FORMAL_RUN" "$FORMAL_ARTIFACT_ID" "$FORMAL_ARTIFACT_DIGEST" "$FULL_SHA" "$UPDATE_SHA" "$REPAIR_SHA" | tee "$EVID/verdict.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2365-strict-fresh-formal-r3-${{ github.run_id }}
          path: /tmp/p01-v2365-strict-r3-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2365-strict-r3.pid 2>/dev/null)" 2>/dev/null || true
