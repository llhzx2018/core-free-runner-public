name: S01 R8 five tool native outputs and browser actual user paths
on:
  push:
    branches: [task/s01-r8-exact-native-20261103]
    paths:
      - '.github/workflows/s01-r8-five-tool-golden-20261103.yml'
      - 'lanes/s01-r8-five-tool-20261103/**'
permissions:
  contents: read
jobs:
  golden-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: synthetic-wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 326fd22662500e6f37df997df1acbaa2931d3e70
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 3305e9447f936c3e2a63a15ac1fc9b2893f188e7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 3f22e61339f7c76eea2c4524885819b10ee59057
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli,mbstring,intl,zip
          coverage: none
      - name: 'Actual native Node five domains: Player VOD Live Converter Checker'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "326fd22662500e6f37df997df1acbaa2931d3e70"
          test "$(git -C theme rev-parse HEAD)" = "3305e9447f936c3e2a63a15ac1fc9b2893f188e7"
          test "$(git -C ops rev-parse HEAD)" = "3f22e61339f7c76eea2c4524885819b10ee59057"
          node --version
          for file in             vod-required-init-segment             live-map-rotation-r3             r3-output-and-cancel             converter-golden-path-r3             playlist-checker-uri-r3             player-manifest-r3; do
            node "candidate/tests/$file.node.cjs"
          done
          node candidate/tests/r8-production-bundle-parity.node.cjs
          echo S01_R8_FIVE_DOMAIN_NATIVE_OUTPUT_GATES=PASS
      - name: Disposable WordPress MariaDB three components with actual tool pages
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSLo /tmp/s01-r8-golden-wpcli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          WP=/tmp/s01-r8-golden-wp
          mkdir -p "$WP"
          php /tmp/s01-r8-golden-wpcli.phar core download --path="$WP" --skip-content --quiet
          php /tmp/s01-r8-golden-wpcli.phar config create --path="$WP" --dbname=wordpress --dbuser=wordpress --dbpass=synthetic-wp --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/s01-r8-golden-wpcli.phar core install --path="$WP" --url=http://127.0.0.1:18880 --title=S01-Golden-Fixture --admin_user=synthetic --admin_password=synthetic-only-password --admin_email=test@example.invalid --skip-email
          php /tmp/s01-r8-golden-wpcli.phar config set WP_CONTENT_URL http://127.0.0.1:18880/wp-content --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_PLUGIN_URL http://127.0.0.1:18880/wp-content/plugins --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_SITEURL http://127.0.0.1:18880 --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar config set WP_HOME http://127.0.0.1:18880 --path="$WP"
          mkdir -p "$WP/wp-content/themes/vf-tools-theme" "$WP/wp-content/plugins/vf-tools-ops" "$WP/wp-content/plugins/vf-tools-m3u8"
          cp -a theme/src/. "$WP/wp-content/themes/vf-tools-theme/"
          cp -a ops/. "$WP/wp-content/plugins/vf-tools-ops/"
          cp -a candidate/src/. "$WP/wp-content/plugins/vf-tools-m3u8/"
          php /tmp/s01-r8-golden-wpcli.phar theme activate vf-tools-theme --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar plugin activate vf-tools-ops/vf-ops.php vf-tools-m3u8/vf-tool-m3u8.php --path="$WP"
          php /tmp/s01-r8-golden-wpcli.phar rewrite structure '/%postname%/' --path="$WP" --hard
          php /tmp/s01-r8-golden-wpcli.phar eval '$ids=["converter","backup-restore","playlist-checker"]; $specs=vf_m3u8_first_run_tool_specs(); foreach($ids as $id){if(!isset($specs[$id]))throw new Exception("MISSING_TOOL_SPEC:".$id);$s=$specs[$id];$post=wp_insert_post(["post_type"=>"page","post_status"=>"publish","post_name"=>$s["route"],"post_title"=>"R8 ".$id,"post_content"=>"[".$s["shortcode"]."]"]);if(is_wp_error($post)||!$post)throw new Exception("PAGE_CREATE_FAILED:".$id);}' --path="$WP"
          cat > "$WP/.s01-router.php" <<'PHP'
          <?php
          $path=parse_url($_SERVER['REQUEST_URI'],PHP_URL_PATH);
          if(is_string($path) && $path!=='/' && is_file(__DIR__.$path)) return false;
          require __DIR__.'/index.php';
          PHP
          php -S 127.0.0.1:18880 -t "$WP" "$WP/.s01-router.php" > /tmp/s01-r8-golden-http.log 2>&1 &
          for i in $(seq 1 30);do if curl -fsS http://127.0.0.1:18880/m3u8-playlist-checker/ >/dev/null;then break;fi;sleep 2;done
          echo S01_R8_GOLDEN_WP_MARIADB_READY=PASS
      - name: Real Chromium 768 and 1440 shipped-bundle business paths
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-audit --no-fund --prefix /tmp/s01-r8-golden-playwright playwright@1.62.1
          /tmp/s01-r8-golden-playwright/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/s01-r8-golden-playwright/node_modules node control/lanes/s01-r8-20261103/business-browser.cjs
      - name: Save bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-r8-five-tool-${{ github.run_id }}
          path: s01-r8-business-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Destroy isolated environment and private source
        if: always()
        shell: bash
        run: rm -rf /tmp/s01-r8-golden-wp /tmp/s01-r8-golden-wpcli.phar /tmp/s01-r8-golden-playwright candidate theme ops
