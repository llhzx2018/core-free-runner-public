name: P07 D04 ephemeral exact source candidate CLI smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-ephemeral-candidate-20261116.yml'
      - 'tests/p07-m03-d04-ephemeral-candidate-20261116.sh'
permissions:
  contents: read
jobs:
  build-and-prove-ephemeral-candidate:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout public synthetic harness only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 54c4b4fbd89fe4c7035e599d90b69add3257e77a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Build and test package in private transient runtime; save only metadata
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = "54c4b4fbd89fe4c7035e599d90b69add3257e77a"
          bash -n tests/p07-m03-d04-ephemeral-candidate-20261116.sh
          bash tests/p07-m03-d04-ephemeral-candidate-20261116.sh
          test -f public-proof/candidate-proof.json
          echo P07_D04_REAL_EPHEMERAL_ARCHIVE_AND_POINTER_ROLLBACK=PASS
      - name: Upload metadata only (never private source or package)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p07-d04-safe-ephemeral-package-proof
          path: public-proof/candidate-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Always clear private checkout and proof workspace
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-exact public-proof
          test ! -e .p07-private-exact
          test ! -e public-proof
          echo P07_D04_PUBLIC_RUNNER_PRIVATE_SOURCE_CLEAN=PASS
