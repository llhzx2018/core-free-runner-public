name: P02 W4 official legacy 2.5.131 isolated import and rollback
on:
  pull_request:
    paths:
      - .github/workflows/p02-w4-official-legacy-offline-exact.yml
permissions:
  contents: read
env:
  P02_EXACT_SHA: 'a3fc779c905179f99a9db1ecf10f852075b9b5ab'
  P02_OFFICIAL_SOURCE_SHA: 'f5dd7782e6fcae14a6ca04b8a263e1bee09f74e7'
jobs:
  w4-native-offline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p02-w4-official-legacy-schema-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Exact P02 private W4 source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_EXACT_SHA }}
          path: p02-private
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Immutable official P02 v2.5.131 comparison checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.P02_OFFICIAL_SOURCE_SHA }}
          path: p02-official
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compare official old SQLite 2401 source exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C p02-private rev-parse HEAD)" = "$P02_EXACT_SHA"
          test "$(git -C p02-official rev-parse HEAD)" = "$P02_OFFICIAL_SOURCE_SHA"
          cmp p02-official/src/app/DatabaseSchema.php p02-private/src/app/DatabaseSchema.php
          cmp p02-official/src/app/SchemaMigration.php p02-private/src/app/SchemaMigration.php
          test "$(git -C p02-private hash-object src/app/DatabaseSchema.php)" = 3b19e61db8ee8d553aa01ed6fef6f82c740efc80
          test "$(git -C p02-private hash-object src/app/SchemaMigration.php)" = d5c7c80b95ce7974b8096e4688992981b50fe5c6
          echo P02_W4_IMMUTABLE_OFFICIAL_25131_SCHEMA_IDENTITY=PASS
      - name: Prepare real PHP SQLite Laravel vendor and Vue build
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sudo apt-get update -qq > "$RUNNER_TEMP/p02-w4-apt.log" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-sqlite3 php-mbstring php-xml php-curl php-zip composer sqlite3 >> "$RUNNER_TEMP/p02-w4-apt.log" 2>&1
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("pdo_sqlite") ? 0 : 1);'
          composer --working-dir=p02-private/modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p02-w4-composer.log" 2>&1
          npm ci --prefix p02-private/modern/inertia-page --no-audit --no-fund > "$RUNNER_TEMP/p02-w4-npm.log" 2>&1
          npm run build --prefix p02-private/modern/inertia-page > "$RUNNER_TEMP/p02-w4-vue.log" 2>&1
          php -l p02-private/modern/laravel/P02W4LegacySqliteBridge.php >/dev/null
          php -l p02-private/modern/laravel/P02W4CleanInstallDataImport.php >/dev/null
          php -l p02-private/modern/laravel/P02W4LegacyRecoveryPoint.php >/dev/null
          python3 -B -m py_compile p02-private/scripts/p02_w4_upgrade_trial_candidate.py p02-private/tests/integration/p02_w4_candidate_from_bundle.py
          echo P02_W4_NATIVE_PHP_COMPOSER_VUE=PASS
      - name: Test official 2401 pin negative fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          (cd p02-private && python3 -B - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import p02_w4_upgrade_trial_candidate as w4
          src={p:Path(p).read_bytes() for p in w4.OFFICIAL_LEGACY_2401_BLOBS}
          w4.require_official_legacy_schema(src)
          for name in src:
              bad=dict(src)
              bad[name]=bad[name]+b"\nnot-the-official-legacy-schema\n"
              try:
                  w4.require_official_legacy_schema(bad)
              except ValueError as e:
                  assert str(e)=="P02_W4_UPGRADE_TRIAL_REJECT=OFFICIAL_LEGACY_2401_SCHEMA_BYTES_CHANGED"
              else:
                  raise AssertionError("FORGED_OFFICIAL_SOURCE_ACCEPTED")
          print("P02_W4_OFFICIAL_BLOB_NEGATIVE_FIXTURES=PASS")
          PY
          ) > "$RUNNER_TEMP/p02-w4-pins.log" 2>&1 || { echo P02_W4_OFFICIAL_BLOB_NEGATIVE_FIXTURES=FAIL; exit 42; }
          echo P02_W4_OFFICIAL_BLOB_NEGATIVE_FIXTURES=PASS
      - name: Actual sealed W4 kit and native old-to-new full data recovery
        shell: bash
        env:
          P02_W4_SYNTHETIC_ONLY: '1'
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: sqlite
          P02_W4_EXPECTED_SOURCE_SHA: 'a3fc779c905179f99a9db1ecf10f852075b9b5ab'
        run: |
          set -Eeuo pipefail
          set +x
          if (cd p02-private && python3 -B tests/integration/p02_w4_candidate_from_bundle.py) > "$RUNNER_TEMP/p02-w4-proof.log" 2>&1; then
            grep '^P02_W4_.*=PASS$' "$RUNNER_TEMP/p02-w4-proof.log"
            echo P02_W4_NATIVE_OFFLINE_SAFETY_DRILL=PASS
          else
            echo P02_W4_NATIVE_OFFLINE_SAFETY_DRILL=FAIL
            exit 43
          fi
      - name: Remove private sources and temporary proof logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- p02-private p02-official
          rm -f "$RUNNER_TEMP"/p02-w4-*.log
          test ! -e p02-private && test ! -e p02-official
          echo P02_W4_TRANSIENT_PRIVATE_SOURCE_REMOVED=YES
