name: TEMP P01 S4 CSV M3U and audio recovery real browser
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-s4-exchange-20261125.yml'
permissions:
  contents: read
concurrency:
  group: temp-p01-s4-exchange-20261125-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-populated-ui:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-s4-media-exchange-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact private P01 candidate only into ephemeral runner workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 8c7e30db3731cec8cba864fd03505c38a5617072
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
      - name: Check exact product source binding
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "8c7e30db3731cec8cba864fd03505c38a5617072"
          node --check private-src/tests/browser/p01_s4_exchange_recovery_browser.mjs
          echo 'P01_S4_EXCHANGE_SOURCE_AND_SYNTAX=PASS'
      - name: Prepare PHP8.4 SQLite for S4 media business proof
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install exact-locked PHP and execute S4 Feature suites
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! python3 scripts/check_php_syntax.py >"$RUNNER_TEMP/p01-home-lint.log" 2>&1; then
            echo 'P01_S3_PHP_SYNTAX=FAIL'; exit 1
          fi
          echo 'P01_S3_PHP_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-home-composer.log" 2>&1; then
            echo 'P01_S3_COMPOSER=FAIL'; exit 1
          fi
          echo 'P01_S3_COMPOSER=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          echo 'P01_S4_EXCHANGE_FEATURE_REUSED=RUN_45549144663_EXACT_SOURCE'
      - name: Compile exact locked Vue for S4 native browser
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund >"$RUNNER_TEMP/p01-npm.log" 2>&1; then echo 'P01_POPULATED_NPM=FAIL'; exit 1; fi
          if ! npm run typecheck >"$RUNNER_TEMP/p01-typecheck.log" 2>&1; then
            grep -Eo 'resources/js/[^: ]+\\([0-9]+,[0-9]+\\): error TS[0-9]+' "$RUNNER_TEMP/p01-typecheck.log" | head -12 || true
            echo 'P01_POPULATED_TYPECHECK=FAIL'; exit 1
          fi
          if ! npm run build >"$RUNNER_TEMP/p01-build.log" 2>&1; then echo 'P01_POPULATED_BUILD=FAIL'; exit 1; fi
          if ! npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0 >"$RUNNER_TEMP/p01-playwright.log" 2>&1; then echo 'P01_POPULATED_DEP=FAIL'; exit 1; fi
          if ! npx playwright install --with-deps chromium >"$RUNNER_TEMP/p01-chrome.log" 2>&1; then echo 'P01_POPULATED_CHROME=FAIL'; exit 1; fi
          echo 'P01_POPULATED_COMPILE=PASS'
          echo 'P01_S4_REUSED_S3_SYNTHETIC_SEED=YES'
      - name: Native local Laravel + synthetic Owner session S4 Chromium, SQLite only
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export APP_ENV=testing
          export APP_DEBUG=false
          export APP_URL=http://127.0.0.1:8777
          export VF_INSTALL_ALLOW_UNMARKED_DEV=true
          export VF_INSTALL_DEV_CLAIM_ENABLED=false
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$RUNNER_TEMP/p01-s3-ephemeral.sqlite"
          export SESSION_DRIVER=file
          export CACHE_STORE=array
          export QUEUE_CONNECTION=sync
          export P01_S3_SYNTH_PASS="$(openssl rand -hex 32)"
          export P01_S3_REAL_URL="$APP_URL"
          touch "$DB_DATABASE"
          if ! php artisan migrate --force --no-interaction >"$RUNNER_TEMP/p01-s3-migrate.log" 2>&1; then
            echo 'P01_S3_ISOLATED_SCHEMA=FAIL'; exit 1
          fi
          echo 'P01_S3_ISOLATED_SCHEMA=PASS'
          test ! -e storage/app/private/vf-startnew/installed.json
          if ! php tests/browser/p01_s3_seed_synthetic.php >"$RUNNER_TEMP/p01-s3-seed.log" 2>&1; then
            echo 'P01_S3_FIXTURE=FAIL'; exit 1
          fi
          grep '^P01_S3_SYNTH_FIXTURE=' "$RUNNER_TEMP/p01-s3-seed.log"
          export APP_ENV=local
          test "$(php artisan env --no-ansi | grep -c local)" -ge 1
          echo 'P01_S3_LOCAL_WEB_ENV=PASS'
          php artisan serve --host=127.0.0.1 --port=8777 >"$RUNNER_TEMP/p01-s3-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=no
          for i in $(seq 1 35); do
            if curl --noproxy '*' -s -o /dev/null "$APP_URL/login"; then READY=yes; break; fi
            sleep 1
          done
          test "$READY" = yes
          echo 'P01_S3_LARAVEL_WEB_READY=PASS'
          if node tests/browser/p01_s4_exchange_recovery_browser.mjs >"$RUNNER_TEMP/p01-s3-real-browser.log" 2>&1; then
            grep '^P01_S4_EXCHANGE_' "$RUNNER_TEMP/p01-s3-real-browser.log"
            grep -q '^P01_S4_EXCHANGE_BROWSER=PASS$' "$RUNNER_TEMP/p01-s3-real-browser.log"
            echo 'P01_S4_EXCHANGE_NATIVE_BROWSER=PASS'
          else
            grep '^P01_S4_' "$RUNNER_TEMP/p01-s3-real-browser.log" || true
            grep -E 'AssertionError|Error:|TimeoutError:|waiting for' "$RUNNER_TEMP/p01-s3-real-browser.log" | head -8 || true
            python3 - "$RUNNER_TEMP/p01-s3-real-browser.log" <<'PY'
          import pathlib,sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          for i,line in enumerate(lines):
              if 'AssertionError [ERR_ASSERTION]: Cross-request CSRF' in line:
                  for nearby in lines[i:i+8]:
                      if any(marker in nearby for marker in ('actual','expected','302','200','403','419')):
                          print('P01_S4_CSRF_ASSERT_DETAIL='+nearby[:120])
          PY
            echo 'P01_S4_EXCHANGE_NATIVE_BROWSER=FAIL'; exit 1
          fi
          test ! -e storage/app/private/vf-startnew/installed.json
          echo 'P01_S3_NO_INSTALL_CLAIM=PASS'
      - name: Remove private test checkout and logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-home-lint.log" "$RUNNER_TEMP/p01-home-composer.log" "$RUNNER_TEMP/p01-home-tests.log" "$RUNNER_TEMP/p01-s4-feature.log"
          rm -f -- "$RUNNER_TEMP/p01-npm.log" "$RUNNER_TEMP/p01-typecheck.log" "$RUNNER_TEMP/p01-build.log" "$RUNNER_TEMP/p01-playwright.log" "$RUNNER_TEMP/p01-chrome.log" "$RUNNER_TEMP/p01-browser.log"
          rm -f -- "$RUNNER_TEMP/p01-s3-"*".sqlite" "$RUNNER_TEMP/p01-s3-"*".log"
          test ! -e private-src
          echo 'P01_POPULATED_PRIVATE_CLEANUP=PASS'
