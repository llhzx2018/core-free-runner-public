name: S01 Bridge Authority Writeback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-bridge-authority-writeback.yml'
      - 'requests/s01-bridge-authority-writeback.txt'

permissions:
  contents: read

jobs:
  writeback:
    runs-on: ubuntu-24.04
    env:
      PUSH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout M3U8 develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: m3u8

      - name: Record M3U8 exact bridge evidence
        working-directory: m3u8
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C03'
          assert d['working_version']=='1.25.3'
          r=d.setdefault('source_identity_rebaseline_20260819',{})
          r['working_source_exact_reverification']='PASS_BRIDGE_AND_EXACT_DIFF_SCOPE'
          r['private_asset_bridge_behavior']='PASS'
          r['exact_source']='4db0265c346dbabe91f206af33a16dba77bb2939'
          r['runner_repository']='llhzx2018/core-free-runner-public'
          r['runner_run']=32271850759
          r['runner_job']=96129947024
          r['php_lint_files']=173
          r['candidate_gate']='BLOCKED_BY_INTERNAL_IDENTITY_DRIFT'
          r['evidence']='docs/evidence/V1.25.3_PRIVATE_ASSET_BRIDGE_EXACT_VERIFY_20260819.md'
          d['candidate_version']=None
          d['next_action']='AUDIT_1.25.3_PACKAGE_PROFILE_AND_PLUGIN_MANIFEST_USAGE_THEN_RECONCILE_IDENTITY_BEFORE_CANDIDATE'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C03): record V1.25.3 bridge machine evidence'
          git push origin HEAD:develop
          echo "M3U8_WRITEBACK_COMMIT=$(git rev-parse HEAD)"

      - name: Checkout Ops develop
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: develop
          token: ${{ env.PUSH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: ops

      - name: Record Ops exact bridge evidence
        working-directory: ops
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['component_id']=='S01-C02'
          assert d['working_version']=='1.21.791'
          r=d.setdefault('source_identity_rebaseline_20260819',{})
          r['working_source_exact_reverification']='PASS_CORRECTIVE_SOURCE_AND_BRIDGE'
          r['private_asset_bridge_behavior']='PASS'
          r['exact_source']='01f111cff3c7a423343e9ba3374dd8702bfdfe06'
          r['runner_repository']='llhzx2018/core-free-runner-public'
          r['runner_run']=32271850759
          r['runner_job']=96129947364
          r['php_lint_files']=743
          r['full_candidate_regression']='NOT_EXECUTED'
          r['evidence']='docs/evidence/V1.21.791_PRIVATE_ASSET_BRIDGE_EXACT_VERIFY_20260819.md'
          d['candidate_version']=None
          d['next_action']='RUN_1.21.791_MINIMAL_FULL_CORRECTIVE_REGRESSION_BEFORE_VERIFIED_CANDIDATE; P3-004_REMAINS_DEFERRED_UNVERIFIED'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = 'VF_PROJECT.json'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          git commit -m 'chore(S01-C02): record V1.21.791 bridge machine evidence'
          git push origin HEAD:develop
          echo "OPS_WRITEBACK_COMMIT=$(git rev-parse HEAD)"
          echo 'RUNTIME_CHANGE=0'
          echo 'MAIN_PROMOTION=0'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
