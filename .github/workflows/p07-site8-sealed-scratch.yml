name: P07 site8 sealed scratch input exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-site8-sealed-scratch.yml'
      - 'experiments/p07-site8-sealed-scratch/**'
permissions:
  contents: read
jobs:
  host-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate source SHA and stage isolated bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = 0.1.0-release112
          test "$(git hash-object experiments/p07-site8-sealed-scratch/lib/scratch_sql_host_policy.py)" = ac4e224b3a9ce57770f7dfe079e76f3628561c6d
          test "$(git hash-object experiments/p07-site8-sealed-scratch/lib/native_scratch_restore.py)" = f2bd59bce111816a67cae6ac7dcaacbf34259c5f
          test "$(git hash-object experiments/p07-site8-sealed-scratch/lib/isolated_db_restore.py)" = 332346c6e2edf99bb592e095ac764afa1de8271c
          test "$(git hash-object experiments/p07-site8-sealed-scratch/tests/test_scratch_sql_host_policy.py)" = 16d9ae0b181323811c9badc6ec3cf84ae154a671
          test "$(git hash-object experiments/p07-site8-sealed-scratch/tests/test_scratch_sealed_input.py)" = 9f8be35d3aeeeb271d1acd34fff5910adce9e1b0
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-site8-seal"
          for file in lib/scratch_sql_host_policy.py lib/native_scratch_restore.py lib/isolated_db_restore.py tests/test_scratch_sql_host_policy.py tests/test_scratch_sealed_input.py; do
            cp "experiments/p07-site8-sealed-scratch/$file" "$RUNNER_TEMP/p07-site8-seal/$file"
          done
          chmod +x "$RUNNER_TEMP/p07-site8-seal/bin/vfops"
          cd "$RUNNER_TEMP/p07-site8-seal"
          python3 -m py_compile lib/scratch_sql_host_policy.py lib/native_scratch_restore.py lib/isolated_db_restore.py tests/test_scratch_sql_host_policy.py tests/test_scratch_sealed_input.py
          echo P07_SITE8_SEAL_EXACT_SOURCE_PASS
      - name: Prove native and Docker fail closed before process start
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-site8-seal"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_scratch_sql_host_policy \
            tests.test_scratch_sealed_input \
            tests.test_native_scratch_restore.NativeRestoreContractTests \
            tests.test_isolated_db_restore.R4IsolationContractTests \
            tests.test_scratch_guard_quarantine.R7QuarantineTests \
            tests.test_restore_sql_preflight
          echo P07_SITE8_SEAL_HOST_SQL_PREIMPORT_FAIL_CLOSED_PASS
      - name: Actual disposable native MariaDB imports with synthetic SQL
        shell: bash
        env:
          P07_R5_NATIVE_INTEGRATION: '1'
          P07_R7_NATIVE_QUARANTINE_ENGINE: '1'
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-server mariadb-client >/dev/null
          cd "$RUNNER_TEMP/p07-site8-seal"
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_native_scratch_restore.NativeRestoreRealEngineTests \
            tests.test_scratch_guard_quarantine.R7ScratchNativeIntegration
          sudo env PYTHONPATH=lib P07_R5_NATIVE_INTEGRATION=1 P07_R7_NATIVE_QUARANTINE_ENGINE=1 \
            python3 -m unittest -v \
            tests.test_native_scratch_restore.NativeRestoreRealEngineTests \
            tests.test_scratch_guard_quarantine.R7ScratchNativeIntegration
          test -z "$(find /tmp -maxdepth 1 -type d -name 'vfops-r5-*' -print -quit)"
          echo P07_SITE8_SEAL_REAL_NATIVE_ENGINE_CLEANUP_PASS
      - name: Original release112 database writers and SQL/migration regression proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-site8-seal"
          PYTHONPATH=lib python3 -m unittest -q \
            tests.test_migration_no_overwrite_resume \
            tests.test_migration_remainder \
            tests.test_private_recovery_gate \
            tests.test_sql_diff_evidence \
            tests.test_sql_row_evidence \
            tests.test_sql_pk_conflict_evidence
          for p in lib/cloudpanel.py lib/restore_apply_core.py lib/server_migration.py lib/verify.py lib/package_core.py BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$p")" = "$(git hash-object "$p")"
          done
          echo P07_SITE8_SEAL_EXISTING_DB_WRITERS_IMMUTABLE_PASS
