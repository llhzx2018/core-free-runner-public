name: p01-v24773-artifact-preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24773-artifact-preflight.yml'
      - 'scripts/p01_build_v24773_preflight.py'
      - 'scripts/p01_v24773_preflight_gate.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 5a90fa61b0e446444b49f8de58438d2de5e9acda
      TARGET_TREE: 9e6fe0e775e95dfb237471a569f604062f267218
      STABLE_SHA: cd176611a24be2dd90155ce84b6b89fab2915150
      STABLE_TAG: v2.47.72
      GOV_SHA: f83697fa3cf648ababfd279996a37bcb5b40eede
      VERSION: 2.47.73
      SOURCE_VERSION: 2.47.72
      SCHEMA: '2026090401'
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact source and Current Authority readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote_main="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" refs/heads/main | awk '{print $1}')"
          remote_gov="$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA"
          test "$remote_gov" = "$GOV_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "$VERSION"
          git clone -q --depth 1 --branch main "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/gov-doc.git" gov
          test "$(git -C gov rev-parse HEAD)" = "$GOV_SHA"
          grep -Fq '| skill-release | V2.9 |' gov/CURRENT.md
          grep -Fq 'Mode A · PREVIEW_FIRST' gov/skills/skill-release/V2.9/SKILL.md
          grep -Fq 'RP-07' candidate/docs/authority/ACCEPTANCE_MATRIX.md
          echo P01_V24773_AUTHORITY_READBACK=PASS
          echo P01_V24773_EXACT_SOURCE=PASS

      - name: Download exact V2.47.72 formal baseline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-rel72/full /tmp/p01-rel72/update
          gh release download "$STABLE_TAG" -R "$PRODUCT_REPO" -D /tmp/p01-rel72 \
            -p 'VF-Start-V2.47.72-FULL.zip' \
            -p 'VF_Start_V2.47.72_UPDATE.zip'
          unzip -q /tmp/p01-rel72/VF-Start-V2.47.72-FULL.zip -d /tmp/p01-rel72/full
          unzip -q /tmp/p01-rel72/VF_Start_V2.47.72_UPDATE.zip -d /tmp/p01-rel72/update
          test "$(tr -d '\r\n ' </tmp/p01-rel72/full/VERSION.txt)" = "$SOURCE_VERSION"
          test -f /tmp/p01-rel72/update/repair-v2.47.72.php
          git clone -q --depth 1 --branch "$STABLE_TAG" "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          test "$(git -C stable rev-parse HEAD)" = "$STABLE_SHA"
          echo P01_V24773_FORMAL_BASELINE=PASS

      - name: Prepare runtime dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
          php -m | grep -Fx curl
          php -m | grep -Fx gd

      - name: Build and verify FULL plus Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p01_v24773_preflight_gate.sh
          RECEIPT=/tmp/p01-v24773-artifacts/P01_V24773_ARTIFACT_RECEIPT.json
          jq -e --arg s "$TARGET_SHA" --arg t "$TARGET_TREE" '.version=="2.47.73" and .source_version=="2.47.72" and .source_sha==$s and .source_tree==$t and .schema=="2026090401"' "$RECEIPT" >/dev/null
          echo P01_V24773_ARTIFACT_PREFLIGHT=PASS

      - name: Focused release authority contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/engineering_consistency_r80_contract.php
            tests/unit/admin_scheduled_tasks_center_contract.php
            tests/unit/admin_secondary_nav_focus_contract.php
            tests/unit/admin_system_capabilities_r62_contract.php
            tests/unit/admin_system_group_polish_r69_contract.php
            tests/unit/admin_backend_coverage_r60_contract.php
            tests/unit/system_health_cron_diagnostic_contract.php
            tests/unit/system_health_cron_runtime_proof.php
            tests/unit/session_csrf_contract.php
            tests/unit/update_csrf_recovery_contract.php
            tests/unit/navigation_owner_behavior_privacy_contract.php
          )
          for t in "${tests[@]}"; do php "candidate/$t"; done
          php candidate/tests/integration/resource_asset_disaster_recovery_contract.php
          echo P01_V24773_SECURITY_CRON_OBSERVABILITY=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-v24773-release-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-v24773-release-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-v24773-release-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-v24773-release-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-v24773-release-canonical.txt
          test "$(git -C candidate status --porcelain)" = ""
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          echo P01_V24773_RELEASE_CANONICAL=PASS

      - name: Record release-time applicability and Preview boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/P01_V24773_RELEASE_PREFLIGHT.txt <<'EOF'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=REQUIRED
          SECURITY=REQUIRED
          TESTING=REQUIRED
          UPGRADE=REQUIRED
          DATA_SCHEMA=REQUIRED
          API_PROVIDER=N_A
          SEO=N_A
          CRON_JOB=REQUIRED
          NOTIFICATION=N_A
          OBSERVABILITY=REQUIRED
          PERFORMANCE=N_A
          GIT=REQUIRED
          UA_UI=REQUIRED
          OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          OWNER_RELEASE_INPUT_MODE=PREVIEW_FIRST
          OWNER_PREVIEW_RUNTIME=PENDING
          OWNER_REAL_USE=PENDING
          RELEASE_INPUT_GATE=BLOCKED_OWNER_ACTION
          TAG_CREATED=NO
          GITHUB_RELEASE_CREATED=NO
          CORE_UPDATES_WRITTEN=NO
          PRODUCTION_CHANGED=NO
          EOF
          cat /tmp/P01_V24773_RELEASE_PREFLIGHT.txt
          echo P01_V24773_MACHINE_RELEASE_READINESS=PASS
          echo P01_V24773_FORMAL_RELEASE_BLOCKED_OWNER_PREVIEW=YES

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p01-v24773-artifact-preflight
          path: |
            /tmp/p01-v24773-artifacts/P01_V24773_ARTIFACT_RECEIPT.json
            /tmp/P01_V24773_RELEASE_PREFLIGHT.txt
            /tmp/p01-v24773-release-canonical.txt
          if-no-files-found: warn
          retention-days: 14
