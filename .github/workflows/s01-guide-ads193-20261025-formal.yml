name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guide-ads193-formal-20261025]
    paths: ['.github/workflows/s01-guide-ads193-20261025-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.193
  TARGET_SHA: 39a6b8ad0f0d16ad3f3bc99ba5e71df1ae88e4e6
  TARGET_TREE: b8e04d0a43dfebc17b88cfe09d06f8be84adf571
  BASE_SHA: 63f06a94a38fb124bf67af8e81bd2e1180ba925d
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-guide-ads193-20261025/formal-spec.json --input control/.github/workflows/s01-guide-ads193-20261025-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 39a6b8ad0f0d16ad3f3bc99ba5e71df1ae88e4e6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40207467167 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40207467167 --jq .head_sha)" = 8643e2d94410f886d45bbab1fbd30dc797465d93
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40207467167 --repo llhzx2018/core-free-runner-public --name s01-home-40207467167 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guide-ads193-20261025/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='4969c3f0e076c4bb9812d81d28a5098b621a8bd1'
          for phase,count in [('before',8),('after',16),('smoke',2)]:
              result=json.loads((r/('guide-ad-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and len(result['rows'])==count
              assert result['errors']==[] and result['writes']==[]
              assert result['realAds']=='SYNTHETIC_CONTRACT_ONLY'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  for mode in ['inline','sidebar']:
                      stem=lang+'-'+str(width)+'-'+mode
                      baseline=json.loads((r/('guide-ad-baseline-'+stem+'.json')).read_text())
                      after=json.loads((r/('guide-ad-after-'+stem+'.json')).read_text())
                      assert after['sideAd']['w']==300 and after['sideAd']['h']==250
                      assert after['sidebar']['x']>=after['reading']['right']+40
                      assert abs(after['hero']['x']-after['reading']['x'])<2
                      assert abs(after['endAd']['w']-728)<2 and after['endAd']['h']==90
                      assert abs(after['endAd']['x']+after['endAd']['w']/2-width/2)<2
                      for key in ['title','h1','description','canonical','hreflang','robots','schema','body','header','footer','nav']:assert after[key]==baseline[key],key
                      for kind in ['top','end']:assert (r/('guide-ad-'+stem+'-'+kind+'.png')).stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='8cdb0ae74d8cc8f486b6c3a9b386a1c88a9aab7b5cbfe29346c833d693ace2f6' and new['bytes']==1998744
          coverage=json.loads(pathlib.Path('control/lanes/s01-guide-ads193-20261025/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='4969c3f0e076c4bb9812d81d28a5098b621a8bd1' and coverage['tree']=='b8e04d0a43dfebc17b88cfe09d06f8be84adf571'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40207467167'
          coverage['merged_source']='39a6b8ad0f0d16ad3f3bc99ba5e71df1ae88e4e6'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.193 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.193 provider/vf-tools-theme_V1.35.193.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.193' --notes '指南详情广告布局补齐：复用现有Theme广告尺寸与Ops公开广告合同，将sidebar广告挂入真实阅读侧栏，消除正文模块后的重复挂载；正文后广告增加明确标识并对齐阅读区域。保留侧栏关闭、目录inline/sidebar/off、阅读宽度与自定义内容，无广告/空内容/不可用时不创建广告空列。不新增Provider、Schema、账号、SDK或投放设置，不修改正式站。双语1440/1024×两种目录模式、有无广告16组、empty/denied/侧栏关闭/短文/自定义/隐藏标题/无JS、文章192输出及SEO正文保持、干净安装、192升级193/回退/重复安装和数据保护通过。476运行文件；隔离合成广告不等于真实投放或CWV通过，Production由Owner手工升级，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.193 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.193 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.193 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.193.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.193.zip remote/vf-tools-theme_V1.35.193.zip
          echo '8cdb0ae74d8cc8f486b6c3a9b386a1c88a9aab7b5cbfe29346c833d693ace2f6  remote/vf-tools-theme_V1.35.193.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.193.zip)" = 1998744
          gh release view v1.35.193 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
