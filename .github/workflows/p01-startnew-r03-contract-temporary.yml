name: TEMP P01 StartNew R03 exact dynamic UI source acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p01-startnew-r03-contract-temporary.yml
permissions:
  contents: read
jobs:
  source-contract:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-startnew-r03-source-contract-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout temporary public orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact new private source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-startnew
          ref: 24f241275c66370538ab73e672bf68e8a5864111
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify exact source and new R03 old UI denominator guard
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = 24f241275c66370538ab73e672bf68e8a5864111
          (
            cd target
            python3 -B scripts/check_bootstrap.py
            python3 -B scripts/check_visual_identity.py
            python3 -B scripts/check_delivery_plan.py
            python3 -B scripts/check_dependency_lock.py
            python3 -B scripts/check_legacy_ui_inventory.py
            python3 -B scripts/check_r03_ui_denominator.py
            python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          ) >"$RUNNER_TEMP/p01-r03-contract.log" 2>&1 || {
            echo P01_R03_SOURCE_GUARDS=FAIL
            grep -E 'FAIL|Error|AssertionError|Exception|ModuleNotFound' "$RUNNER_TEMP/p01-r03-contract.log" | tail -n 16 || true
            exit 1
          }
          echo P01_R03_SOURCE_GUARDS=PASS
          echo P01_R03_NEW_VISUAL_EQUIVALENCE=NOT_PROVEN
      - name: Always delete private source and logs
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf target
          rm -f "$RUNNER_TEMP/p01-r03-contract.log"
          test ! -e target
          echo P01_R03_EXACT_SOURCE_CLEANUP=PASS
