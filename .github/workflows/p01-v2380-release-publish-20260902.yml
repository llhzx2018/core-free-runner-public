name: P01 V2.38.0 Release Write Private Scope Probe
on:
  push:
    branches: [release/p01-v2380-projects-20260902]
    paths: [.github/workflows/p01-v2380-release-publish-20260902.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Scope probe without secret disclosure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-start --jq .full_name)" = 'llhzx2018/vf-start'
          if gh api repos/llhzx2018/core-free-runner-private --jq .full_name >/tmp/private-name 2>/tmp/private-error; then
            echo VF_RELEASE_WRITE_CAN_READ_PRIVATE_RUNNER=YES
            cat /tmp/private-name
          else
            echo VF_RELEASE_WRITE_CAN_READ_PRIVATE_RUNNER=NO
            cat /tmp/private-error >&2
            exit 31
          fi
          echo P01_V2380_RELEASE_SCOPE_PROBE=PASS
