name: P01 v516 legacy PHP bridge real Atomic install rollback
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bridge-atomic:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      LARAVEL_SHA: 0fafc12ca165981b37a7daebc1bece2a5c53c44f
    env:
      BRIDGE_SHA: bdc1e068e4cabec2e9129d750b8f6ba159c74fd5
      SOURCE_TAG: v2.47.515
      BRIDGE_VERSION: 2.47.516
      TARGET_VERSION: 2.47.516
      TARGET_SHA: bdc1e068e4cabec2e9129d750b8f6ba159c74fd5
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate ephemeral lane contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-247516-php-bridge-atomic-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-v516-php-bridge.json >"$RUNNER_TEMP/p01-bridge-lane.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-v516-php-bridge.json --input .github/workflows/p01-v516-php-bridge-oneoff.yml >>"$RUNNER_TEMP/p01-bridge-lane.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-bridge-lane.txt" >/dev/null
          echo P01_PHP_BRIDGE_SAFE_ONEOFF_LANE=PASS
      - name: Checkout bridge from exact immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: bridge-src
      - name: PHP extensions and exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(cat bridge-src/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat bridge-src/src/VERSION.txt)" = "$BRIDGE_VERSION"
          test "$(grep -Foc "define('VF_VERSION', '2.47.516');" bridge-src/src/app/bootstrap.php)" = 1
          sudo apt-get update -qq > "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-zip php8.3-mbstring php8.3-sqlite3 php8.3-gd php8.3-xml composer unzip curl >> "$RUNNER_TEMP/p01-bridge-apt.txt" 2>&1
          php8.3 -l bridge-src/src/app/LegacyMajorMigrationReadiness.php >/dev/null
          php8.3 -l bridge-src/src/app/LegacyMajorOwnerHandoff.php >/dev/null
          php8.3 -l bridge-src/src/api.php >/dev/null
          php8.3 -l bridge-src/src/app/UpdateManager.php >/dev/null
          php8.3 -l bridge-src/src/app/CoreUpdates/GitHubClient.php >/dev/null
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile bridge-src/scripts/build_p01_247516_legacy_atomic.py
          echo P01_BRIDGE_EXACT_SOURCE_AND_PHP83_SYNTAX=PASS
      - name: Download official immutable v515 FULL and UPDATE assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          mkdir -p "$BASE/full" "$BASE/repair"
          gh release download v2.47.515 -R llhzx2018/vf-start -D "$BASE" -p 'VF-Start-V2.47.515-FULL.zip' -p 'VF_Start_V2.47.515_UPDATE.zip' >"$RUNNER_TEMP/p01-bridge-download.txt" 2>&1
          test "$(sha256sum "$BASE/VF-Start-V2.47.515-FULL.zip" | cut -d' ' -f1)" = 5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778
          test "$(sha256sum "$BASE/VF_Start_V2.47.515_UPDATE.zip" | cut -d' ' -f1)" = 3a5e6528e8ef1204ef1fc4f6d4568aad0634dced649200f5744df5cb9c082556
          unzip -q "$BASE/VF-Start-V2.47.515-FULL.zip" -d "$BASE/full"
          unzip -q "$BASE/VF_Start_V2.47.515_UPDATE.zip" -d "$BASE/repair"
          test -f "$BASE/repair/repair-v2.47.515.php"
          echo P01_BRIDGE_REAL_OLD_RELEASE_FULL_UPDATE_SHA=PASS
      - name: Build bounded bridge FULL and journal capable Atomic ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="$RUNNER_TEMP/p01-bridge-base"
          PYTHONDONTWRITEBYTECODE=1 python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$BASE/full" --baseline-repair "$BASE/repair/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "$BRIDGE_SHA" --output-dir "$RUNNER_TEMP/p01-bridge-out" >"$RUNNER_TEMP/p01-bridge-build.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,96}|BridgeError|Traceback|RuntimeError)' "$RUNNER_TEMP/p01-bridge-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          test -f "$RUNNER_TEMP/p01-bridge-out/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip"
          test -f "$RUNNER_TEMP/p01-bridge-out/VF-Start-V2.47.516-FULL-DEV-ONLY.zip"
          test "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$RUNNER_TEMP/p01-bridge-out/bridge-candidate-receipt.json")" = DEVELOPER_ISOLATED_ONLY
          echo P01_BRIDGE_516_DEVELOPER_ATOMIC_FULL_ARTIFACTS=PASS
      - name: Real old v515 install then v516 Atomic success and interrupted rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          export BASE="$RUNNER_TEMP/p01-bridge-base" OUT="$RUNNER_TEMP/p01-bridge-out" WORK="$RUNNER_TEMP/p01-bridge-work"
          mkdir -p "$WORK"/{upgrade,rollback,repair}
          unzip -q "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip" -d "$WORK/repair"
          REPAIR="$WORK/repair/repair-v2.47.516.php"
          test "$(unzip -Z1 "$OUT/VF_Start_V2.47.516_UPDATE-DEV-ONLY.zip")" = repair-v2.47.516.php
          php8.3 -l "$REPAIR" >/dev/null
          php8.3 "$REPAIR" --self-test >"$RUNNER_TEMP/p01-bridge-selftest.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-selftest.txt"
          test -z "$(unzip -Z1 "$OUT/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" | grep -Ei '(^|/)(\.runtime\.php|.*\.sqlite3?$|.*\.db$|private/|backups?/|sessions?/|tokens?/|staging/)' || true)"
          cp -a "$BASE/full/." "$WORK/upgrade/"
          cp -a "$BASE/full/." "$WORK/rollback/"
          install_old() {
            local dir="$1" port="$2"
            (cd "$dir" && php8.3 -S 127.0.0.1:"$port" -t . > "$RUNNER_TEMP/p01-bridge-http-$port.txt" 2>&1 & echo $! > "$RUNNER_TEMP/p01-bridge-http-$port.pid")
            local cookie="$RUNNER_TEMP/p01-bridge-cookie-$port.txt"
            local ready=0
            for i in $(seq 1 35); do
              if curl -fsS -c "$cookie" -b "$cookie" "http://127.0.0.1:$port/setup.php" > "$RUNNER_TEMP/p01-bridge-page-$port.html" 2>/dev/null; then ready=1;break;fi
              sleep 1
            done
            test "$ready" -eq 1
            local csrf
            csrf="$(python3 - "$RUNNER_TEMP/p01-bridge-page-$port.html" <<'PY'
          import re,sys
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',open(sys.argv[1],encoding="utf-8").read())
          assert m, "missing old setup csrf"
          print(m.group(1))
          PY
          )"
            curl -fsS -c "$cookie" -b "$cookie" -X POST "http://127.0.0.1:$port/setup.php" --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=Bridge Test" --data-urlencode "admin_password=BridgePassword-2026!" --data-urlencode "admin_password_confirm=BridgePassword-2026!" > "$RUNNER_TEMP/p01-bridge-setup-$port.html"
            (cd "$dir" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
            kill "$(cat "$RUNNER_TEMP/p01-bridge-http-$port.pid")" || true
          }
          install_old "$WORK/upgrade" 19416
          install_old "$WORK/rollback" 19417
          cp "$REPAIR" "$WORK/upgrade/repair-v2.47.516.php"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --verify-source="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-verify-source.txt"
          php8.3 "$WORK/upgrade/repair-v2.47.516.php" --run="$WORK/upgrade" > "$RUNNER_TEMP/p01-bridge-success.txt"
          grep -Fq '"ok":true' "$RUNNER_TEMP/p01-bridge-success.txt"
          test "$(cat "$WORK/upgrade/VERSION.txt")" = 2.47.516
          (cd "$WORK/upgrade" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          php8.3 -r 'require $argv[1]."/app/bootstrap.php"; $m=new VfUpdateManager(vf_db()); $x=$m->status(); if(($x["major_migration"]["from_version"]??"")!=="2.47.516"||($x["major_migration"]["to_version"]??"")!=="2.47.517"||($x["major_migration"]["can_execute"]??true)!==false) exit(33); echo "P01_BRIDGE_MAJOR_STATUS_NOT_EXECUTABLE=PASS\n";' "$WORK/upgrade"
          echo P01_BRIDGE_OLD_515_TO_516_REAL_ATOMIC_INSTALL=PASS
          cp "$REPAIR" "$WORK/rollback/repair-v2.47.516.php"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php8.3 "$WORK/rollback/repair-v2.47.516.php" --run="$WORK/rollback" >"$RUNNER_TEMP/p01-bridge-failure.txt" 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          test "$(cat "$WORK/rollback/VERSION.txt")" = 2.47.515
          (cd "$WORK/rollback" && php8.3 cli/verify.php) | grep -Fx VERIFY_PASS=YES
          echo P01_BRIDGE_FAILURE_INJECTION_ROLLBACK=PASS
      - name: Checkout exact current Laravel v517 candidate (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.LARAVEL_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate-laravel
      - name: Three-way version identity and v517 PHP major gate native tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate-laravel rev-parse HEAD)" = "$LARAVEL_SHA"
          test "$(cat candidate-laravel/VERSION)" = 2.47.517
          test "$(cat candidate-laravel/src/VERSION.txt)" = 2.47.517
          for rel in src/app/next/runtime/MajorUnsignedReleaseStage.php src/app/next/runtime/MajorSignedReleasePreflight.php src/app/next/runtime/MajorGitHubSha256Preflight.php src/app/next/runtime/MajorTrustedOwnerReleaseGate.php src/app/next/runtime/MajorInnerFullIntegrity.php src/app/next/runtime/MajorOfflineReleaseSigner.php tests/compatibility/laravel/run_major_signed_real_full_contract.php tests/compatibility/laravel/http/p01_major_official_origin_gate.php; do
            php8.3 -l "candidate-laravel/$rel" >/dev/null
          done
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile candidate-laravel/scripts/build_p01_next_major_migration_candidate.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m py_compile candidate-laravel/scripts/build_p01_next_official_update_candidate.py
          php8.3 candidate-laravel/tests/compatibility/laravel/http/p01_major_github_asset_redirect.php >"$RUNNER_TEMP/p01-bridge-517-redirect.txt" 2>&1
          grep -Fx P01_MAJOR_GITHUB_TOKEN_NEVER_FOLLOWS_AUTO_REDIRECT=PASS "$RUNNER_TEMP/p01-bridge-517-redirect.txt"
          php8.3 candidate-laravel/tests/compatibility/laravel/http/p01_major_official_origin_gate.php >"$RUNNER_TEMP/p01-bridge-517-origin.txt" 2>&1 || {
            grep -Eo '(P01_MAJOR_[A-Z0-9_]{4,80}|MAJOR_[A-Z0-9_]{4,80}|Fatal error|TypeError)' "$RUNNER_TEMP/p01-bridge-517-origin.txt" | sort -u | head -n 12 || true
            exit 1
          }
          echo P01_LARAVEL_517_EXACT_BRIDGE_BOUNDARY_PHP83=PASS
      - name: Build genuine v517 CloudPanel Laravel FULL and v516-to-v517 developer MAJOR archive
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate-laravel
          PYTHONDONTWRITEBYTECODE=1 python3 -B tests/architecture/test_p01_shared_helpers_manifest.py >"$RUNNER_TEMP/p01-bridge-517-helpers.txt" 2>&1
          python3 scripts/build_p01_next_clean_full.py build --source-sha "$LARAVEL_SHA" --output "$RUNNER_TEMP/p01-bridge-517-clean.zip" --composer composer >"$RUNNER_TEMP/p01-bridge-517-build.txt" 2>&1 || {
            grep -Eo '(BuildError|Error:|ERROR|AssertionError)' "$RUNNER_TEMP/p01-bridge-517-build.txt" | sort -u | head -n 10 || true
            exit 1
          }
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-bridge-517-clean.zip" >>"$RUNNER_TEMP/p01-bridge-517-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-bridge-517-clean.zip" --output "$RUNNER_TEMP/p01-bridge-517-cloudpanel.zip" >>"$RUNNER_TEMP/p01-bridge-517-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-bridge-517-cloudpanel.zip" >>"$RUNNER_TEMP/p01-bridge-517-build.txt" 2>&1
          echo P01_LARAVEL_517_COMPLETE_REAL_CLOUDPANEL_FULL_BUILD=PASS
          python3 scripts/build_p01_next_major_migration_candidate.py build --bridge-v516-full "$RUNNER_TEMP/p01-bridge-out/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" --laravel-v517-full "$RUNNER_TEMP/p01-bridge-517-cloudpanel.zip" --output "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" >"$RUNNER_TEMP/p01-bridge-517-major-build.txt" 2>&1 || {
            grep -Eo '(BuildError|Error:|ERROR|Traceback)' "$RUNNER_TEMP/p01-bridge-517-major-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          python3 scripts/build_p01_next_major_migration_candidate.py verify --zip "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" >>"$RUNNER_TEMP/p01-bridge-517-major-build.txt" 2>&1
          echo P01_REAL_BRIDGE_516_TO_LARAVEL_517_DEV_MAJOR_ENVELOPE=PASS
      - name: Real paired FULL programs consumed by v517 MAJOR ZIP and synthetic GitHub channel
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate-laravel
          if ! P01_MAJOR_REAL_FULL_ISOLATED_TEST=YES php8.3 tests/compatibility/laravel/run_major_signed_real_full_contract.php --developer-full "$RUNNER_TEMP/p01-bridge-517-cloudpanel.zip" --bridge-full "$RUNNER_TEMP/p01-bridge-out/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" >"$RUNNER_TEMP/p01-bridge-517-channel.txt" 2>&1; then
            grep -Eo '(MAJOR_[A-Z0-9_]{5,100}|P01_MAJOR_[A-Z0-9_]{5,100}|Fatal error|TypeError)' "$RUNNER_TEMP/p01-bridge-517-channel.txt" | sort -u | head -n 15 || true
            exit 1
          fi
          grep -Fx P01_MAJOR_BRIDGE_V516_TO_LARAVEL_V517_REAL_BUNDLES=PASS "$RUNNER_TEMP/p01-bridge-517-channel.txt"
          grep -Fx P01_MAJOR_GITHUB_RELEASE_SHA256_NEGATIVE_MATRIX=PASS "$RUNNER_TEMP/p01-bridge-517-channel.txt"
          grep -Fx P01_MAJOR_REAL_CLOUDPANEL_FULL_SYNTHETIC_SIGNED_CONSUMER=PASS "$RUNNER_TEMP/p01-bridge-517-channel.txt"
          grep -Fx P01_MAJOR_REAL_GITHUB_PUBLISHED_ASSET_AND_OWNER_APPLY=NOT_PROVEN "$RUNNER_TEMP/p01-bridge-517-channel.txt"
          echo P01_TWO_PHASE_515_516_517_REAL_BUILDS_AND_SYNTHETIC_MAJOR=PASS
      - name: Cleanup all private source and FULL/UPDATE and old-site SQLite
        if: always()
        shell: bash
        run: |
          for path in "$RUNNER_TEMP"/p01-bridge-http-*.pid; do
            [ ! -f "$path" ] || kill "$(cat "$path")" 2>/dev/null || true
          done
          rm -rf -- bridge-src candidate-laravel "$RUNNER_TEMP/p01-bridge-base" "$RUNNER_TEMP/p01-bridge-out" "$RUNNER_TEMP/p01-bridge-work"
          rm -f -- "$RUNNER_TEMP"/p01-bridge-*.txt "$RUNNER_TEMP"/p01-bridge-*.html "$RUNNER_TEMP"/p01-bridge-*.pid "$RUNNER_TEMP"/p01-bridge-*.zip "$RUNNER_TEMP"/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip
          echo P01_BRIDGE_PRIVATE_SOURCE_AND_DATA_PERSISTENCE=NONE
