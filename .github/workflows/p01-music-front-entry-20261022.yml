name: P01 Music Owner Front Entry HTTP Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-music-front-entry-20261022.yml']
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.actor == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/p01-music-front-entry-20261022'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: PHP SQLite isolated runtime
        uses: shivammathur/setup-php@2.35.5
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Fetch P01 exact Music front-entry candidate
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ"
          git clone -q --depth 1 --no-checkout \
            "https://x-access-token:${PRIVATE_READ}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q --depth 1 origin 302db8d6177aaf9043c9e4f792db32981d91173e
          git -C candidate checkout -q --detach FETCH_HEAD
          git -C candidate remote set-url origin https://github.com/llhzx2018/vf-start.git
          test "$(git -C candidate rev-parse HEAD)" = 302db8d6177aaf9043c9e4f792db32981d91173e
          test -z "$(git -C candidate status --porcelain)"
          test "$(tr -d '\\r\\n ' <candidate/VERSION)" = '2.47.424'
          test "$(tr -d '\\r\\n ' <candidate/src/VERSION.txt)" = '2.47.424'
          echo P01_MUSIC_FRONT_EXACT_SOURCE=PASS
      - name: Lint and real HTTP owner/guest/CSP/nav/playlist contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for p in src/music-home.php src/app/WorkspaceViewCatalog.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/app/SurfaceShell.php; do
            php -l "candidate/$p"
          done
          bash candidate/tests/integration/music_fresh_http.sh candidate
          echo P01_MUSIC_FRONT_REAL_HTTP_GATE=PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate
          echo P01_MUSIC_FRONT_PRIVATE_CLEANUP=PASS
