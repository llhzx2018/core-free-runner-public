name: S01-C02 1.21.937 R49 Focused Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121937-r49-focused.yml'

permissions:
  contents: read

jobs:
  focused-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 8a1159473c88ae40ebb19715cd532191d67f3213
      EXPECTED_VERSION: 1.21.937
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}

    steps:
      - name: Verify private read
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$EXPECTED_VERSION"
          grep -Fq "Version: $EXPECTED_VERSION" target/vf-ops.php
          grep -Fq "S01-SURVIVOR-PRODUCT-CLOSURE-R49" target/vf-ops.php
          echo "CANDIDATE_IDENTITY=PASS"

      - name: Full PHP syntax gate
        shell: bash
        run: |
          set -Eeuo pipefail
          find target -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l > php-lint.log
          echo "PHP_FILES_LINTED=$(wc -l < php-lint.log | tr -d ' ')"
          echo "PHP_LINT=PASS"

      - name: Product surface lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121935-product-surface-r46-contract.php
          php target/tests/s01-c02-121935-surface-capability-r47-contract.php
          php target/tests/s01-c02-121936-physical-surface-r48-contract.php
          php target/tests/s01-c02-121937-survivor-product-r49-contract.php
          echo "R46_R49_PRODUCT_LINEAGE=PASS"

      - name: Shell and navigation regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php target/tests/s01-c02-121932-navigation-role-r43-contract.php
          php target/tests/s01-c02-121933-navigation-flyout-r44-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          node --check target/assets/js/admin-s01-domain-shell-r1.js
          echo "R43_R45_UI_LINEAGE=PASS"

      - name: Ownership and ordinary-open boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          SERVICE=target/includes/admin-v13/services/system_plugins.php
          VIEW=target/includes/admin-v13/views/system_plugins.php
          grep -Fq "apply_filters('vf_wp_update_components_v1', [])" "$SERVICE"
          grep -Fq "tools.php?page=vf-private-updates" "$SERVICE"
          grep -Fq "LOCAL_SAVED_COMPONENT_UPDATE_AND_GOVERNANCE_STATE_ONLY_NO_REMOTE_CHECK_NO_UPDATE_NO_SCAN_NO_WRITE" "$SERVICE"
          ! grep -Eq "wp_remote_(get|post)|download_url|execute_native_update|vf_ops_wp_update_force_refresh_v1" "$SERVICE"
          grep -Fq "VF 在线更新" "$VIEW"
          grep -Fq "系统健康" "$VIEW"
          ! grep -Fq "vf_ops_update_action" "$VIEW"
          echo "SHARED_UPDATE_OWNERSHIP=PASS"
          echo "SYSTEM_ORDINARY_OPEN_BOUNDARY=PASS"

      - name: Build sanitized evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p={
            "schema":"vf-runner/s01-c02-r49-focused-v1",
            "target_repository":os.environ["TARGET_REPOSITORY"],
            "target_sha":os.environ["TARGET_SHA"],
            "version":os.environ["EXPECTED_VERSION"],
            "formal_owner_routes":13,
            "standalone_tools":1,
            "owner_surface_denominator":14,
            "page_local_capabilities":12,
            "survivor_product_identities":{
              "content_workflow":"内容与 SEO 概览",
              "content_articles":"内容库",
              "publish_zip":"发布中心",
              "acceptance_overview":"质量中心",
              "system_plugins":"组件与系统"
            },
            "unified_update_entry":"vf-private-updates",
            "duplicate_update_protocol":False,
            "ordinary_open_remote_requests":0,
            "ordinary_open_writes":0,
            "private_source_persisted":False,
            "secret_values_persisted":False
          }
          raw=json.dumps(p,sort_keys=True,ensure_ascii=False).encode()
          p["evidence_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-c02-121937-r49-focused.json").write_text(json.dumps(p,indent=2,sort_keys=True,ensure_ascii=False))
          print("R49_EVIDENCE_SHA256="+p["evidence_sha256"])
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121937-r49-focused-${{ github.run_id }}
          path: evidence/s01-c02-121937-r49-focused.json
          if-no-files-found: error
          retention-days: 7
