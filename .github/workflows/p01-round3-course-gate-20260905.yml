name: P01 Round 3 Course Experience Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-round3-course-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REF: feature/p01-course-migration-experience-20260905
      EXPECTED_SHA: 4bc975282804a80165b3f073b499b3754ed8d754
      BASE_SHA: 87edfd46ad61afba23b6998f4d0ccd9a8eabc5ad
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product

      - name: Verify exact source and no-schema boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          tested="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested}"
          test "${tested}" = "${EXPECTED_SHA}"
          test "$(cat VERSION)" = "2.46.1"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then
            echo "Version, schema, migration or runtime bootstrap changed unexpectedly." >&2
            exit 1
          fi

      - name: Syntax and JavaScript parse gate
        shell: bash
        run: |
          set -euo pipefail
          cd product
          for file in \
            src/courses.php \
            src/books.php \
            tests/unit/course_experience_source_contract.php \
            tests/unit/workspace_nine_entry_source_contract.php
          do
            php -l "$file"
          done
          node --check src/assets/course-experience.js

      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/course_experience_source_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/workspace_view_catalog_contract.php
          php tests/integration/p01_books_catalog_acceptance.php
