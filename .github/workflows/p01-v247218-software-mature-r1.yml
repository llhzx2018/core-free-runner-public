name: p01-v247218-software-mature-r1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247218-software-mature-r1.yml'

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: 320291e58b6f43be83a1502fb0d2eee21f4552ad
      BASE_TAG: v2.47.217
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx sqlite3
      - name: Resolve exact source
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.218"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          php tests/unit/software_mature_landing_r1_contract.php
          php tests/unit/software_page_full_polish_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_detail_context_contract.php
          php tests/unit/tool_software_boundary_v247183_contract.php
          php tests/unit/frontend_projects_tools_software_r5_contract.php
          echo P01_SOFTWARE_MATURE_R1_FOCUSED=PASS
      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          bash tests/canonical_release_regression.sh . "$GITHUB_WORKSPACE/stable" --require-zero-debt | tee /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/p01-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-canonical.txt
          echo P01_SOFTWARE_MATURE_R1_CANONICAL=PASS
