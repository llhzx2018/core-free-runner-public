name: S01 Theme207 exact integrated candidate
on:
  push:
    branches: [task/s01-theme207-integrated-20261027]
    paths: ['.github/workflows/s01-theme207-integrated-20261027.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.207
  TARGET_SHA: 7efc0d02dedd82df8dd72bbe485f58cd56c82dea
  TARGET_TREE: abe0cc62d1f227b347780cf252a8973bebca180e
  BASE_SHA: d5e5a77f0626eb93d4b6ad7a4ce5565deaabee53
  SOURCE_VERSION: 1.35.206
  LANE_ID: s01-theme207-integrated-20261027
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Target identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-theme207-integrated-20261027/spec.json --input control/.github/workflows/s01-theme207-integrated-20261027.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7efc0d02dedd82df8dd72bbe485f58cd56c82dea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact package and scoped syntax checks
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider baseline
          python3 control/lanes/s01-theme207-integrated-20261027/package.py
          python3 - <<'PYLIST'
          import subprocess,os
          files=subprocess.check_output(['git','-C','target','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
          for f in files:
              if f.endswith('.php'):subprocess.run(['php','-l','target/'+f],check=True)
          PYLIST
          node --check control/lanes/s01-theme207-integrated-20261027/check.cjs
          node --check target/src/assets/js/main.js
          php target/tests/targeted/test-nav-current-external.php
          gh release download v1.35.206 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.206.zip --dir provider
          echo '8e710ddfb5108933d9f1105d2a8df41971a6d459a543826395ef0a9a39d16655  provider/vf-tools-theme_V1.35.206.zip' | sha256sum -c
          gh release download v1.25.94 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.94.zip --dir provider
          echo '70b90d40da5d69fc7819bd7ada3f15fb0145e64822b788bd94956c7827b2df03  provider/vf-tools-m3u8_V1.25.94.zip' | sha256sum -c
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
          mkdir -p "$HOME/.local/share/fonts"
          curl -g -fsSL --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC[wght].ttf' -o "$HOME/.local/share/fonts/NotoSansSC.ttf"
          fc-cache -f
      - name: Clean207 WordPress,206 upgrade/rollback and focused404/navigation proof
        run: |
          set -euo pipefail
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-theme207-integrated-20261027/clean.cjs lane/warm-admin.cjs
          bash control/lanes/s01-theme207-integrated-20261027/native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target baseline provider
