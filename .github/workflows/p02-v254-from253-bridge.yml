name: P02 V2.5.4 From V2.5.3 Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v254-from253-bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPO: llhzx2018/vf-library
      PRODUCT_REF: 9d5d8e60245def8b7c5f80ab7961d614621dd7e0
      SOURCE_VERSION: 2.5.3
      TARGET_VERSION: 2.5.4
      SCHEMA_VERSION: '2401'
      RELEASE_TAG: v2.5.4
      BRIDGE_NAME: VF_Library_V2.5.4_FROM_V2.5.3_UPDATE.zip
    steps:
      - name: Require registered capabilities
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Checkout exact V2.5.4 formal source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.PRODUCT_REPO }}
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Build deterministic V2.5.3 to V2.5.4 bridge
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          cp scripts/build-release-v2.5.4.py "$RUNNER_TEMP/build-bridge.py"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/placeholder')
          PY
          python3 - "$RUNNER_TEMP/build-bridge.py" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          old="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.4'; SCHEMA=2401; DT=(2026,8,19,2,0,0)"
          new="ROOT=Path.cwd(); SRCVER='2.5.3'; VER='2.5.4'; SCHEMA=2401; DT=(2026,8,19,2,0,0)"
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/build-bridge.py" --out build/from253 --source-commit "$PRODUCT_REF" --source-tree "$(git show -s --format=%T "$PRODUCT_REF")" --source-ref release/v2.5.4 > "$RUNNER_TEMP/build.json"
          mv build/from253/VF_Library_V2.5.4_UPDATE.zip "build/from253/$BRIDGE_NAME"
          python3 - <<'PY'
          import json,os,zipfile
          p='build/from253/'+os.environ['BRIDGE_NAME']
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('atomic-manifest.json'))
          assert m['source_version']=='2.5.3',m
          assert m['target_version']=='2.5.4',m
          assert m['source_schema']==2401 and m['target_schema']==2401,m
          print('BRIDGE_PACKAGE_IDENTITY=PASS')
          PY
          unzip -t "build/from253/$BRIDGE_NAME" >/dev/null
          stat -c 'BRIDGE_BYTES=%s' "build/from253/$BRIDGE_NAME"
          sha256sum "build/from253/$BRIDGE_NAME" | awk '{print "BRIDGE_SHA256="$1}'

      - name: Existing-data UpdateCore V2.5.3 to V2.5.4
        working-directory: product
        env:
          PW: 'P02-V254-From253-${{ github.run_id }}!'
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/upgrade253"; SRC="$ROOT/source-253"; SITE="$ROOT/site"; mkdir -p "$ROOT"
          git clone -q --no-checkout https://x-access-token:${{ secrets.VF_PRIVATE_READ_TOKEN }}@github.com/llhzx2018/vf-library.git "$SRC"
          git -C "$SRC" checkout -q v2.5.3
          mkdir -p "$SITE"; bash "$SRC/scripts/build-deploy-tree.sh" "$SITE" >/dev/null
          test "$(cat "$SITE/VERSION.txt")" = 2.5.3
          php -S 127.0.0.1:18253 -t "$SITE" >"$ROOT/server.log" 2>&1 & echo $! > "$ROOT/pid"
          for _ in $(seq 1 80); do curl -fsS http://127.0.0.1:18253/setup.php >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" http://127.0.0.1:18253/setup.php > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H 'Origin: http://127.0.0.1:18253' --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" http://127.0.0.1:18253/setup.php)" = 303
          SESSION=$(curl -fsS -b "$ROOT/cookie" http://127.0.0.1:18253/api.php?action=session); CSRF=$(jq -r '.csrf' <<<"$SESSION")
          CAT=$(curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"V254 From253 Sentinel","description":"bridge sentinel","icon":"folder"}' 'http://127.0.0.1:18253/api.php?action=category_save'); CID=$(jq -r '.id' <<<"$CAT"); test "$CID" != null
          ITEM=$(jq -nc --argjson cid "$CID" '{category_id:$cid,title:"V254 From253 Existing Data",description:"must survive",content:"# Bridge Sentinel\n\nMust survive.",content_mode:"article",content_format:"markdown",primary_action:"read",status:"active"}')
          SAVED=$(curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "$ITEM" 'http://127.0.0.1:18253/api.php?action=content_save'); IID=$(jq -r '.id' <<<"$SAVED"); test "$IID" != null
          curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "{\"id\":$IID,\"favorite\":true}" 'http://127.0.0.1:18253/api.php?action=content_favorite' | jq -e '.ok==true' >/dev/null
          PKG="$(pwd)/build/from253/$BRIDGE_NAME"; BYTES=$(stat -c%s "$PKG"); SHA=$(sha256sum "$PKG"|awk '{print $1}')
          cat > "$ROOT/upgrade.php" <<'PHP'
          <?php
          $site=$argv[1];$package=$argv[2];$bytes=(int)$argv[3];$sha=$argv[4];
          require $site.'/app/bootstrap.php';require_once $site.'/app/CoreUpdates/UpdateAdapter.php';require_once $site.'/app/CoreUpdates/UpdateCore.php';require_once $site.'/app/VfLibraryCoreUpdateAdapter.php';
          $manifest=['schema_version'=>'1.0','project_id'=>'P02','component_id'=>'APP','enabled'=>true,'current_version'=>'2.5.3','target_version'=>'2.5.4','update_type'=>'ATOMIC','from_versions'=>['2.5.3'],'schema_from'=>'2401','schema_to'=>'2401','repository'=>'llhzx2018/vf-library','release_tag'=>'v2.5.4','asset_name'=>'VF_Library_V2.5.4_FROM_V2.5.3_UPDATE.zip','asset_bytes'=>$bytes,'asset_sha256'=>$sha,'backup_required'=>true,'rollback_supported'=>true,'released_at'=>'2026-08-19T00:00:00Z'];
          $core=new CoreUpdates\UpdateCore('P02','APP');$check=$core->check('2.5.3','2401',$manifest);if(($check['status']??'')!=='AVAILABLE')exit(2);$verify=$core->verifyPackage($package,$manifest);if(($verify['status']??'')!=='VERIFIED')exit(3);$adapter=new VfLibraryCoreUpdateAdapter();$result=$core->upgrade('2.5.3','2401',$adapter,$package,$manifest);echo json_encode($result,JSON_UNESCAPED_UNICODE|JSON_PRETTY_PRINT),"\n";if(!in_array($result['status']??'', ['COMMITTED','COMMITTED_WITH_CLEANUP_WARNING'],true))exit(4);if(empty($result['backup_locator']))exit(5);
          PHP
          php "$ROOT/upgrade.php" "$SITE" "$PKG" "$BYTES" "$SHA" | tee "$ROOT/result.json"
          test "$(cat "$SITE/VERSION.txt")" = 2.5.4
          jq -e '.status=="COMMITTED" or .status=="COMMITTED_WITH_CLEANUP_WARNING"' "$ROOT/result.json" >/dev/null
          jq -e '.backup_locator|length>0' "$ROOT/result.json" >/dev/null
          SESSION2=$(curl -fsS -b "$ROOT/cookie" http://127.0.0.1:18253/api.php?action=session); CSRF2=$(jq -r '.csrf' <<<"$SESSION2"); jq -e '.site.auth==true' <<<"$SESSION2" >/dev/null
          curl -fsS -b "$ROOT/cookie" "http://127.0.0.1:18253/api.php?action=content_get&id=$IID" | jq -e '.item.title=="V254 From253 Existing Data" and (.item.is_favorite|tonumber)==1' >/dev/null
          POST=$(jq -nc --argjson cid "$CID" '{category_id:$cid,title:"V254 From253 Post Upgrade Write",description:"after update",content:"write works",content_mode:"quick",content_format:"plain",primary_action:"copy",status:"active"}')
          curl -fsS -b "$ROOT/cookie" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF2" -d "$POST" 'http://127.0.0.1:18253/api.php?action=content_save' | jq -e '.ok==true' >/dev/null
          php "$SITE/cli/verify.php" > "$ROOT/verify.json"; jq -e '.ok==true and .version=="2.5.4" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' "$ROOT/verify.json" >/dev/null
          test -s "$SITE/app/FaviconAsset.php"; test -s "$SITE/favicon.php"; test -s "$SITE/favicon-action.php"
          kill "$(cat "$ROOT/pid")"
          echo P02_V254_FROM253_EXISTING_DATA_UPDATECORE=PASS

      - name: Publish bridge asset to existing V2.5.4 Release
        working-directory: product
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPO" >/dev/null
          gh release upload "$RELEASE_TAG" "build/from253/$BRIDGE_NAME" --repo "$PRODUCT_REPO" --clobber
          gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPO" --json databaseId,tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          BYTES=$(stat -c%s "build/from253/$BRIDGE_NAME"); SHA=$(sha256sum "build/from253/$BRIDGE_NAME"|awk '{print $1}')
          python3 - "$RUNNER_TEMP/release.json" "$BYTES" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1])); size=int(sys.argv[2]); assert x['tagName']=='v2.5.4' and not x['isDraft'] and not x['isPrerelease']; assets={a['name']:int(a['size']) for a in x['assets']}; assert assets.get(os.environ['BRIDGE_NAME'])==size,(assets.get(os.environ['BRIDGE_NAME']),size); print('RELEASE_ID='+str(x['databaseId'])); print('REMOTE_BRIDGE_METADATA=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/readback"
          GH_TOKEN='${{ secrets.VF_PRIVATE_READ_TOKEN }}' gh release download "$RELEASE_TAG" --repo "$PRODUCT_REPO" --pattern "$BRIDGE_NAME" --dir "$RUNNER_TEMP/readback"
          test "$(stat -c%s "$RUNNER_TEMP/readback/$BRIDGE_NAME")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/readback/$BRIDGE_NAME"|awk '{print $1}')" = "$SHA"
          echo REMOTE_BRIDGE_BYTES_SHA256=PASS
          echo BRIDGE_BYTES=$BYTES
          echo BRIDGE_SHA256=$SHA
          echo PRODUCTION_WRITE=NO
