name: R95 Subject Domain Nav Shell

on:
  pull_request:
    paths:
      - '.github/workflows/r95-subject-domain-nav-shell.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: e9ac919f5cfbee68d0aa224f3773e8da11cd4c7f
    steps:
      - name: Checkout exact private candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_SHA }}
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Verify exact candidate and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C vf-start rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$(tr -d '\r\n' < vf-start/VERSION)" = "2.47.0"
          php -l vf-start/src/app/SubjectPageChrome.php
          php -l vf-start/tests/unit/subject_domain_nav_shell_contract.php
          php vf-start/tests/unit/subject_domain_nav_shell_contract.php
          php vf-start/tests/unit/subject_filter_reset_contract.php
          php vf-start/tests/unit/subject_invalid_kind_query_contract.php
          php vf-start/tests/unit/course_continue_context_contract.php
          echo R95_SUBJECT_DOMAIN_NAV_SHELL_GATE_PASS
          echo R95_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup private source
        if: always()
        shell: bash
        run: rm -rf vf-start
