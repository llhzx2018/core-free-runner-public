name: P02 V2.5.23 Unified Content Workspace

on:
  pull_request:
    branches: [main]
    paths: ['triggers/p02-v2523-unified-content-workspace.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: task/p02-v2523-unified-content-workspace
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Require registered capability
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ env.RELEASE_TOKEN }}
          path: product
          fetch-depth: 0
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.3-cli php8.3-sqlite3 php8.3-zip
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify source and repository
        working-directory: product
        run: |
          set -Eeuo pipefail
          test "$(tr -d '\r\n' < VERSION)" = 2.5.23
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/assets/app.js
          node --check public/assets/scratch-tabs.js
          node tests/unit/v2521_context_ux_contract.mjs
          node tests/unit/v2522_unified_library_workspace_contract.mjs
          node tests/unit/v2523_unified_content_workspace_contract.mjs
          python3 scripts/verify-source-manifest.py
          bash scripts/verify-repository.sh
          bash scripts/build-deploy-tree.sh "$RUNNER_TEMP/p02-v2523-site" >/dev/null
          test "$(cat "$RUNNER_TEMP/p02-v2523-site/VERSION.txt")" = 2.5.23
          echo SOURCE_AND_PHP_GATES=PASS

      - name: Real Chromium unified content UX
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8123 -t "$RUNNER_TEMP/p02-v2523-site" >"$RUNNER_TEMP/p02-v2523-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          cat > "$RUNNER_TEMP/p02-v2523-test.cjs" <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const pageErrors=[];
            page.on('pageerror',error=>pageErrors.push(String(error)));
            await page.route('**/*',route=>{const headers={...route.request().headers()};delete headers.origin;return route.continue({headers});});
            await page.goto('http://127.0.0.1:8123/setup.php',{waitUntil:'domcontentloaded'});
            await page.fill('#password','VF-Test-2523!');
            await page.fill('#password_confirm','VF-Test-2523!');
            await page.click('button[type=submit]');
            await page.waitForTimeout(900);
            if(page.url().includes('/setup.php'))throw new Error('setup did not complete');
            if(await page.locator('[data-open-login]').count()){
              await page.click('[data-open-login]');
              await page.fill('#loginForm [name=password]','VF-Test-2523!');
              await page.click('#loginSubmit');
            }
            await page.waitForSelector('[data-mode="all"]');
            await page.waitForSelector('#scratchLaunchV259');

            const shell=await page.evaluate(()=>({
              search:document.querySelector('#globalSearch')?.getAttribute('placeholder'),
              all:document.querySelector('[data-mode="all"]')?.textContent,
              legacyModes:document.querySelectorAll('[data-mode="quick"],[data-mode="article"]').length,
              typeMenu:!!document.querySelector('#addContentMenuBtn')
            }));
            if(shell.search!=='搜索全部资料'||!shell.all.includes('全部资料')||shell.legacyModes||shell.typeMenu)throw new Error('single material navigation failed');

            const categoryId=await page.evaluate(async()=>{
              await api('category_save',{method:'POST',body:{id:null,name:'统一资料回归',parent_id:null,description:'',icon:'folder',display_style:'',page_size:null,default_sort:'',preview_lines:null}});
              await loadBootstrap();
              return Number(state.categories.find(item=>item.name==='统一资料回归')?.id||0);
            });
            if(!categoryId)throw new Error('fixture category missing');

            await page.click('#addContentBtn');
            await page.waitForSelector('#scratchWorkspaceV259');
            const captureShell=await page.evaluate(()=>({
              inMain:document.querySelector('#scratchWorkspaceV259')?.parentElement?.id==='main',
              topbar:getComputedStyle(document.querySelector('.topbar')).display,
              sidebar:getComputedStyle(document.querySelector('#sidebar')).display,
              search:getComputedStyle(document.querySelector('.search-wrap')).display
            }));
            if(!captureShell.inMain||captureShell.topbar==='none'||captureShell.sidebar==='none'||captureShell.search==='none')throw new Error('capture escaped the application shell');
            await page.fill('[data-scratch-editor]','# 临时统一资料\n\n正文保持原样');
            await page.waitForTimeout(650);
            await page.click('[data-scratch-organize]');
            if(await page.locator('[data-organize-kind]').count())throw new Error('archive still asks for a content type');
            await page.fill('[data-organize-title]','临时资料已归档');
            await page.selectOption('[data-organize-category]',String(categoryId));
            await page.click('[data-organize-submit]');
            await page.waitForSelector('#articleWorkspace');
            await page.waitForSelector('#notebookListPane');
            const archived=await page.evaluate(()=>({
              title:state.readerItem?.title,
              content:state.readerItem?.content,
              mode:state.readerItem?.content_mode,
              action:state.readerItem?.primary_action,
              scratch:!!document.querySelector('#scratchWorkspaceV259')
            }));
            if(archived.title!=='临时资料已归档'||!archived.content.includes('正文保持原样')||archived.mode!=='article'||archived.action!=='read'||archived.scratch)throw new Error('archive-to-workspace flow failed');

            const legacyId=await page.evaluate(async category=>{
              const result=await api('content_save',{method:'POST',body:{id:null,category_id:category,title:'历史短资料',description:'',content:'旧内容',content_mode:'quick',content_format:'plain',primary_action:'copy',tags:'',aliases:'',is_favorite:false,is_pinned:false,status:'active',attachment_ids:[]}});
              return Number(result.id||(result.item&&result.item.id));
            },categoryId);
            await page.evaluate(async id=>{state.editorDirty=false;state.contentView='notebook';await openReader(id,true);},legacyId);
            await page.waitForSelector('#articleWorkspace');
            await page.evaluate(()=>state.workspaceController.setMode('edit'));
            await page.fill('#articleTitleInput','历史短资料已编辑');
            await page.evaluate(()=>document.querySelector('#articleTitleInput').dispatchEvent(new Event('input',{bubbles:true})));
            await page.evaluate(()=>state.workspaceController.save('active'));
            await page.waitForTimeout(450);
            const legacy=await page.evaluate(async id=>{const item=await fetchItem(id);return {mode:item.content_mode,action:item.primary_action,workspace:!!document.querySelector('#articleWorkspace')};},legacyId);
            if(legacy.mode!=='quick'||legacy.action!=='copy'||!legacy.workspace)throw new Error('legacy metadata preservation failed');

            await page.evaluate(async()=>{state.editorDirty=false;state.contentView='list';state.mode='all';state.status='active';state.categoryId=0;await loadList({scrollTop:0});});
            const primaryLabels=await page.locator('[data-primary] span').allTextContents();
            if(!primaryLabels.length||primaryLabels.some(label=>label.trim()!=='打开'))throw new Error('saved materials do not share one primary action');

            await page.setViewportSize({width:390,height:844});
            await page.click('#addContentBtn');
            await page.waitForSelector('#scratchWorkspaceV259');
            await page.waitForTimeout(120);
            const mobile=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+1,topbar:getComputedStyle(document.querySelector('.topbar')).display}));
            if(mobile.overflow||mobile.topbar==='none')throw new Error('mobile capture shell regression');
            if(pageErrors.length)throw new Error(pageErrors.join(' | '));
            console.log('ONE_VISIBLE_MATERIAL_OBJECT=PASS');
            console.log('CAPTURE_SAME_APPLICATION_SHELL=PASS');
            console.log('ARCHIVE_SAME_WORKSPACE=PASS');
            console.log('LEGACY_METADATA_PRESERVED=PASS');
            console.log('MOBILE_390_OVERFLOW=NONE');
            console.log('PRODUCTION_WRITE=NO');
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          node "$RUNNER_TEMP/p02-v2523-test.cjs"
