name: P01 Core Updates V2.47.407 One-shot Equivalent CI
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-core-updates-247407.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_SHA: bdfedca283fcc4ef65ee263a803bc6b07c4995ce
    steps:
      - name: Checkout one-shot public runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Private exact source checkout in temporary runner storage
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          ROOT="$RUNNER_TEMP/p01-coreupdates-247407"
          echo "UPDATES_WORK=$ROOT" >> "$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/$UPDATE_REPO.git" "$ROOT"
          git -C "$ROOT" checkout -q --detach "$UPDATE_SHA"
          git -C "$ROOT" remote set-url origin "https://github.com/$UPDATE_REPO.git"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "$UPDATE_SHA"
          echo P01_247407_DIST_EXACT_SOURCE=PASS
      - name: Manifest contract and native update-core tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$UPDATES_WORK"
          python3 scripts/check_manifest_contract.py | tee "$UPDATES_WORK/manifest-result.json"
          grep -F '"status": "PASS"' "$UPDATES_WORK/manifest-result.json" >/dev/null
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          x=json.load(open('projects/P01.json'))
          assert x['target_version']=='2.47.407'
          assert x['from_versions']==['2.47.406']
          assert x['release_tag']=='v2.47.407'
          assert x['release_id']==419375662
          assert x['product_identity']=='637b5c1e2b67c521b102e844baf31ad95c8eab11'
          assert x['asset_name']=='VF_Start_V2.47.407_UPDATE.zip'
          assert x['asset_bytes']==2663547
          assert x['asset_sha256']=='e38437d0a0b1316407cd658db9564f6ebf6e6b0026bd29c858d232dcf514e05e'
          print('P01_247407_DIST_RELEASE_IDENTITY=PASS')
          PY
          echo P01_247407_DIST_EQUIVALENT_CI=PASS
      - name: No private artifacts retained
        if: always()
        shell: bash
        run: |
          if [ -n "${UPDATES_WORK:-}" ]; then rm -rf -- "$UPDATES_WORK"; fi
          echo P01_247407_DIST_EPHEMERAL=PASS
