name: S01-C01 Theme v1.35.139 formal private release
on:
  push:
    branches: [task/s01-guide-reading-v135139-20261019]
    paths: ['.github/workflows/s01-theme-v135139-formal-20261019.yml']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 1a0796ffc33ce3561f7fee7ec8a3dfd107bf0d38
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
      - name: Exact tested main tree and PHP source gate
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "1a0796ffc33ce3561f7fee7ec8a3dfd107bf0d38"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "dfaeaa77f199482200ea46eaf36a475c8007e13c"
          test "$(cat target/VERSION)" = 1.35.139
          grep -q '^Version: 1.35.139$' target/src/style.css
          find target/src -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/s01-theme-php-lint.txt
          echo 'FORMAL_EXACT_TESTED_MAIN_TREE=PASS'
      - name: Deterministic WordPress ZIP and candidate checksum
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path,PurePosixPath
          import hashlib,json,zipfile
          root=Path('target/src');dest=Path('vf-tools-theme_V1.35.139.zip')
          files=sorted(x for x in root.rglob('*') if x.is_file())
          assert len(files)==476,len(files)
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              entry=zipfile.ZipInfo(str(PurePosixPath('vf-tools-theme')/p.relative_to(root)),date_time=(1980,1,1,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              entry.external_attr=(p.stat().st_mode&0o777)<<16
              z.writestr(entry,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(dest) as z:
            assert z.testzip() is None
            assert 'vf-tools-theme/functions.php' in z.namelist()
            assert 'Version: 1.35.139' in z.read('vf-tools-theme/style.css').decode()
          sha=hashlib.sha256(dest.read_bytes()).hexdigest()
          assert sha=='f28c185805c2cf244c3c9711b377144d673e69676424644a840a59887c82669a',sha
          assert dest.stat().st_size==1955140,dest.stat().st_size
          receipt={'status':'PASS','main':'1a0796ffc33ce3561f7fee7ec8a3dfd107bf0d38','candidate_tree':'dfaeaa77f199482200ea46eaf36a475c8007e13c','sha256':sha,'bytes':dest.stat().st_size,'files':len(files),'production':'UNTOUCHED'}
          print('FORMAL_PACKAGE='+json.dumps(receipt))
          Path('formal-package.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Create immutable private release and verify byte-exact remote download
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          if gh release view v1.35.139 --repo llhzx2018/vf-tools-theme >/dev/null 2>&1; then
            echo 'FORMAL_RELEASE_EXISTS_REFUSE_OVERWRITE' >&2
            exit 1
          fi
          gh release create v1.35.139 vf-tools-theme_V1.35.139.zip --repo llhzx2018/vf-tools-theme --target 1a0796ffc33ce3561f7fee7ec8a3dfd107bf0d38 --title 'VF Tools Theme V1.35.139' --notes 'S01-C01 Guides reading UX cleanup: no nested TOC scroll, no duplicated authored FAQ/workflow, no redundant generic CTA. Isolated WP/MariaDB/Chromium EN/ZH 4/4, SEO 14/14, deterministic package and 138->139->rollback->reapply data preservation PASS. Production manual only; mobile deferred; owner use pending.'
          mkdir -p /tmp/theme-138-verify
          gh release download v1.35.139 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.139.zip --dir /tmp/theme-138-verify
          cmp vf-tools-theme_V1.35.139.zip /tmp/theme-138-verify/vf-tools-theme_V1.35.139.zip
          echo 'REMOTE_PRIVATE_RELEASE_EXACT_BYTES=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-v135138-release-proof-${{ github.run_id }}
          path: formal-package.json
          retention-days: 14
      - name: Remove private transient source and assets
        if: always()
        run: rm -rf target vf-tools-theme_V1.35.139.zip /tmp/theme-138-verify
