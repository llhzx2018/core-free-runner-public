name: P05 V1.1.11 Exact Source Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      P05_EXACT_SOURCE: 6705dfb1886b209187180fd6191c1521624fb6ba
      P05_EXACT_TREE: f8cf4326d7c8631298843b8bd48ff06ae54f4c40
      VERSION: 1.1.11
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P05 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05
      - name: Verify immutable candidate identity
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_EXACT_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node -e "const p=require('./package.json'),l=require('./package-lock.json'),v=require('./VF_PROJECT.json'); if(p.version!='$VERSION'||l.version!='$VERSION'||l.packages[''].version!='$VERSION'||v.version!='$VERSION'||v.status!=='V1.1.11_RELEASE_CANDIDATE / MACHINE_GATE_PENDING / PRODUCTION_NOT_DEPLOYED') process.exit(1)"
      - name: Install PHP runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl
          php -v
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^zip$'
          php -m | grep -i '^curl$'
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Install dependencies
        working-directory: p05
        run: npm ci
      - name: Release source and current-runtime engineering gates
        working-directory: p05
        run: |
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          echo "P05_NODE_POSTGRES_INTEGRATION=NOT_APPLICABLE_TO_PHP_SQLITE_FORMAL_RUNTIME"
      - name: PHP syntax
        working-directory: p05
        run: find php scripts -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Build and verify formal PHP staging
        working-directory: p05
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_EXACT_SOURCE }}
        run: |
          npm run build:php-release
          npm run php:release:gate
          test -f build/vf-seo-php-release/php/src/PhpUpdater.php
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          node - <<'NODE'
          const m=require('./build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json');
          const fail=()=>process.exit(1);
          if(m.version!=='1.1.11'||m.sourceCommit!==process.env.P05_EXACT_SOURCE) fail();
          if(m.onlineUpdate!=='PHP_ATOMIC_FULL_RELEASE'||m.onlineUpdateRequiresShell!==false||m.onlineUpdateRequiresPrivateToken!==false||m.onlineUpdateOpcacheReset!==true) fail();
          if(!String(m.onlineUpdateAuthority).includes('core-free-runner-public')) fail();
          if(m.productionDeployment!=='NOT_DEPLOYED') fail();
          NODE
      - name: Real PHP SQLite public-distribution updater regression
        working-directory: p05
        run: php -d opcache.enable=0 scripts/php-updater-smoke.php build/vf-seo-php-release
      - name: Online update security and UI contract
        working-directory: p05
        run: |
          grep -q "/api/system/update/status" php/src/RuntimeOpsRoutesTrait.php
          grep -q "/api/system/update/apply" php/src/RuntimeOpsRoutesTrait.php
          grep -q "STEP_UP_REQUIRED" php/src/RuntimeOpsRoutesTrait.php
          grep -q "opcache_get_status(false)" php/src/PhpUpdater.php
          grep -q "UPDATE_OPCACHE_RESET_FAILED" php/src/PhpUpdater.php
          grep -q "core-free-runner-public" php/src/PhpUpdater.php
          grep -q "系统与更新" src/client/UpdateShortcut.tsx
          grep -q "final manual CloudPanel update" docs/authority/RELEASE_V1.1.11_CANDIDATE.md
          echo "P05_V1111_EXACT_SOURCE_GATE=PASS"
          echo "P05_ONLINE_UPDATE_BASELINE=PASS"
          echo "P05_PRIVATE_TOKEN_ON_SERVER=0"
          echo "P05_RELEASE_WRITE=0"
          echo "P05_PRODUCTION_WRITE=0"
