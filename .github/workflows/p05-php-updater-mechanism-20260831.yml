name: P05 PHP Online Updater Final Mechanism Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  updater-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      P05_EXACT_SOURCE: 180423d18e21615aeb776633c51f82d8567d5e68
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P05
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: p05
      - name: Verify exact source
        working-directory: p05
        run: |
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = "1.1.10"
      - name: Install PHP updater runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl
          php -v
          php -m | grep -i '^pdo_sqlite$'
          php -m | grep -i '^zip$'
          php -m | grep -i '^curl$'
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json
      - name: Install dependencies
        working-directory: p05
        run: npm ci
      - name: PHP syntax
        working-directory: p05
        run: find php scripts -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Frontend and TypeScript contract
        working-directory: p05
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
      - name: Build formal PHP staging
        working-directory: p05
        env:
          VF_RELEASE_SOURCE_SHA: ${{ env.P05_EXACT_SOURCE }}
        run: |
          npm run build:php-release
          test -f build/vf-seo-php-release/php/src/PhpUpdater.php
          test ! -e build/vf-seo-php-release/VF_INSTALL_INSTANCE.json
          node -e "const m=require('./build/vf-seo-php-release/PHP_RELEASE_MANIFEST.json'); if(m.onlineUpdate!=='PHP_ATOMIC_FULL_RELEASE'||m.onlineUpdateRequiresShell!==false||m.onlineUpdateRequiresPrivateToken!==false||m.onlineUpdateOpcacheReset!==true||!String(m.onlineUpdateAuthority).includes('core-free-runner-public')) process.exit(1)"
      - name: Real public-distribution updater smoke
        working-directory: p05
        run: php -d opcache.enable=0 scripts/php-updater-smoke.php build/vf-seo-php-release
      - name: Static route and production OPcache contract
        working-directory: p05
        run: |
          grep -q "/api/system/update/status" php/src/RuntimeOpsRoutesTrait.php
          grep -q "/api/system/update/apply" php/src/RuntimeOpsRoutesTrait.php
          grep -q "STEP_UP_REQUIRED" php/src/RuntimeOpsRoutesTrait.php
          grep -q "opcache_get_status(false)" php/src/PhpUpdater.php
          grep -q "UPDATE_OPCACHE_RESET_FAILED" php/src/PhpUpdater.php
          grep -q "core-free-runner-public" php/src/PhpUpdater.php
          grep -q "系统与更新" src/client/UpdateShortcut.tsx
          echo "P05_PHP_ONLINE_UPDATE_FINAL_MECHANISM=PASS"
          echo "P05_PUBLIC_DISTRIBUTION_CHANNEL=PASS"
          echo "P05_OPCACHE_RUNTIME_DETECTION=PASS"
          echo "P05_PRIVATE_TOKEN_ON_SERVER=0"
          echo "P05_RELEASE_WRITE=0"
          echo "P05_PRODUCTION_WRITE=0"
