name: P08 R126 exact-source 013 forward identity refusal gate (temporary)
on:
  pull_request:
    paths: [.github/workflows/p08-r126-forward-id-temp.yml]
permissions:
  contents: read
jobs:
  source-refusal-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set PHP 8.4 and trust-preserving extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: posix,sqlite3,pdo_sqlite
      - name: Private exact source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 57f1c3610b00feaa3915aa06b1f82e671f9c8e47
          path: p08-source
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Readonly exact official 013 source and counterfeit-pointer negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -rf -- "$GITHUB_WORKSPACE/p08-source"' EXIT
          cd p08-source
          test "$(git rev-parse HEAD)" = 57f1c3610b00feaa3915aa06b1f82e671f9c8e47
          php -l src/Upgrade/R126Installed013Source.php
          php -l tests/test_r126_installed_013_source.php
          php tests/test_r126_installed_013_source.php
          php tests/test_owner_site_worker_dispatcher.php
          php tests/test_owner_upgrade_transport.php
          php tests/test_owner_release_discovery_controller.php
          echo P08_R126_EXACT_PRIVATE_CODE_NEGATIVE_AND_ROOTLESS_WORKER=PASS
      - name: Always remove transient private checkout
        if: always()
        run: rm -rf -- "$GITHUB_WORKSPACE/p08-source"
