name: P07 Server Ops RC3 CloudPanel Foundation Smoke

on:
  push:
    branches: [main]
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/package.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/package_core.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_apply.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_apply_core.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_integration.py'
      - '.github/workflows/p07-server-ops-rc3-cloudpanel-foundation-smoke.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/package.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/package_core.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_apply.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_apply_core.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel.py'
      - 'dist/p07/0.1.0-rc3/tests/test_cloudpanel_integration.py'
      - '.github/workflows/p07-server-ops-rc3-cloudpanel-foundation-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudpanel-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build RC3 combined runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-cloudpanel-gate
          mkdir -p /tmp/p07-cloudpanel-gate
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-cloudpanel-gate/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-cloudpanel-gate/
          mkdir -p /tmp/p07-cloudpanel-gate/tests
          cp dist/p07/0.1.0-rc3/tests/test_cloudpanel.py /tmp/p07-cloudpanel-gate/tests/test_cloudpanel.py
          cp dist/p07/0.1.0-rc3/tests/test_cloudpanel_integration.py /tmp/p07-cloudpanel-gate/tests/test_cloudpanel_integration.py
          test "$(cat /tmp/p07-cloudpanel-gate/BUILD_ID)" = '0.1.0-rc3-guided-init9'

      - name: Exact mature-core preservation
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/p07-cloudpanel-gate/lib/package_core.py)" = 'a997b70ab0450df193977d8e449dd604c38b49ea'
          test "$(git hash-object /tmp/p07-cloudpanel-gate/lib/restore_apply_core.py)" = '06cf797a3ff0948c5df65dfcf526f56037f6d461'
          test "$(git hash-object /tmp/p07-cloudpanel-gate/lib/cloudpanel.py)" = '0139c01e9738b27ed93213ba38fad3da774987fe'

      - name: Syntax and adapter contract
        run: |
          set -euo pipefail
          python3 -m py_compile \
            /tmp/p07-cloudpanel-gate/lib/cloudpanel.py \
            /tmp/p07-cloudpanel-gate/lib/package.py \
            /tmp/p07-cloudpanel-gate/lib/restore_apply.py \
            /tmp/p07-cloudpanel-gate/lib/restore_apply_core.py \
            /tmp/p07-cloudpanel-gate/tests/test_cloudpanel.py \
            /tmp/p07-cloudpanel-gate/tests/test_cloudpanel_integration.py
          grep -Fq 'site:add:php' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'site:add:static' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'site:add:nodejs' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'site:add:python' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'site:add:reverse-proxy' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'db:add' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'db:export' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'db:import' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'site:install:certificate' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'lets-encrypt:install:certificate' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'system:permissions:reset' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'varnish-cache:purge' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py

      - name: CloudPanel adapter behavioral gate
        env:
          PYTHONPATH: /tmp/p07-cloudpanel-gate/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-cloudpanel-gate
          python3 tests/test_cloudpanel.py -v
          python3 tests/test_cloudpanel_integration.py -v

      - name: Existing backup and restore facade contract
        env:
          PYTHONPATH: /tmp/p07-cloudpanel-gate/lib
        run: |
          set -euo pipefail
          python3 - <<'PY'
import package, package_core, restore_apply, restore_apply_core
assert package_core.export_mysql is package.export_mysql
assert restore_apply_core.run_clpctl is restore_apply.run_clpctl
assert callable(package.build_backup)
assert callable(restore_apply.apply_sandbox)
PY

      - name: Safety boundary
        run: |
          set -euo pipefail
          ! grep -Eiq 'dns.*(write|update|change)|rm[[:space:]]+-rf[[:space:]]+/home' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          ! grep -Fq 'stdout=' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          ! grep -Fq 'stderr=' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py
          grep -Fq 'Never include stderr/stdout' /tmp/p07-cloudpanel-gate/lib/cloudpanel.py

      - name: Result
        run: echo 'P07_RC3_CLOUDPANEL_FOUNDATION=PASS'
