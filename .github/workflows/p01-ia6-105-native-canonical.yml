name: p01-ia6-105-native-canonical-temporary
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-105-native-canonical.yml']
permissions:
  contents: read
jobs:
  canonical-debt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_SHA: 3547eddf33cd2a29a93520ff9f2e20e45add1b39
      BASE_SHA: 342a2ad7d7f3d203010c400af45e59e18c65fe31
    steps:
      - name: Checkout public-safe workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run exact-source P01 canonical PHP unit regression against current baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          ROOT="$(mktemp -d /tmp/p01-ia6-canonical.XXXXXXXX)"
          trap 'rm -rf "$ROOT"' EXIT
          git clone -q --depth 1 --branch fix/p01-v247493-owner-dialog-save-ux \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/candidate"
          git clone -q --depth 1 --branch main \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "$ROOT/stable"
          test "$(git -C "$ROOT/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$ROOT/stable" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$ROOT/candidate" remote set-url origin https://github.com/llhzx2018/vf-start.git
          git -C "$ROOT/stable" remote set-url origin https://github.com/llhzx2018/vf-start.git
          unset READ_TOKEN
          echo "P01_CANONICAL_TARGET_SHA=$TARGET_SHA"
          php -l "$ROOT/candidate/tests/support/p01_ia6_retired_gui_guard.php" >/dev/null
          php -l "$ROOT/candidate/tests/unit/p01_ia6_retired_gui_security_successor_contract.php" >/dev/null
          php "$ROOT/candidate/tests/unit/p01_ia6_105_legacy_map_coverage_contract.php"
          php "$ROOT/candidate/tests/unit/p01_ia6_retired_gui_security_successor_contract.php"
          echo "P01_CANONICAL_BASE_SHA=$BASE_SHA"
          set +e
          bash "$ROOT/candidate/tests/canonical_release_regression.sh" "$ROOT/candidate" "$ROOT/stable" --require-zero-debt >"$ROOT/report.txt" 2>&1
          RC=$?
          set -e
          grep -E '^P01_CANONICAL_(BASELINE_TEST_COUNT|CURRENT_TEST_COUNT|BASELINE_FAILURE_COUNT|CURRENT_FAILURE_COUNT|CHANGED_TEST_COUNT|CHANGED_TEST_FAILURE_COUNT|NEW_REGRESSION_COUNT|REMOVED_BASELINE_TEST_COUNT|LEGACY_TEST_DEBT_COUNT|UNIT_REGRESSION|ZERO_DEBT_REQUIRED)=' "$ROOT/report.txt" || true
          echo "P01_CANONICAL_RC=$RC"
          python3 - "$ROOT/report.txt" "$ROOT/candidate" <<'PY'
          import pathlib,re,sys,collections
          report=pathlib.Path(sys.argv[1]).read_text(errors='replace')
          root=pathlib.Path(sys.argv[2]); files=[line.split('=',1)[1] for line in report.splitlines() if line.startswith('NEW_UNIT_REGRESSION=')]
          by=collections.defaultdict(list)
          for f in files:
              text=(root/f).read_text(errors='replace')
              refs=[x for x in ['AdminShell.php','data-safety.php','all-resources.php','surface-manager.php','update.php','update-credential.php','workbench.php'] if x in text]
              kind='HISTORICAL_GUI_DEPENDENT' if refs else 'UNCLASSIFIED_REQUIRES_REVIEW'
              by[kind].append(f)
          for kind,items in sorted(by.items()):
              print('P01_CANONICAL_CAUSE_GROUP='+kind+' COUNT='+str(len(items)))
              for f in items[:150]: print('P01_CAUSE='+kind+' FILE='+f)
          PY
          if [ "$RC" -ne 0 ]; then
            grep -E '^(REMOVED_BASELINE_TEST=|CHANGED_TEST_FAILURE=|NEW_UNIT_REGRESSION=)' "$ROOT/report.txt" | head -160 || true
            exit "$RC"
          fi
          echo P01_IA6_CANONICAL_REGRESSION=PASS
