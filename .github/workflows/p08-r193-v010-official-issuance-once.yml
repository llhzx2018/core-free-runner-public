name: P08 R193 FINAL v0.1.10 genuine FULL + 0.1.9 to 0.1.10 Atomic official issuance
on:
  pull_request:
    paths:
      - .github/workflows/p08-r193-v010-official-issuance-once.yml
      - scripts/p08_r193_native_once.sh
      - scripts/p08_r193_v010_release_once.py
permissions:
  contents: read
jobs:
  exact-final-real-full-native-atomic-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r193-v010-official-issue-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: ef78dcb21117c822e2756360280f2418f794704f
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout short-lived registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact merged main 0.1.10 source and no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout exact current GOV-DOC canonical 13-domain source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 Composer and DB extension suite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 exact lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native database CLI tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
      - name: Verify exact merged Main, immutable official v0.1.9 and Mode R scope
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(git -C p08 rev-parse HEAD^{tree})" = 1c5975bad5b9795998d4afcedec47ba9d52769a4
          test "$(cat p08/VERSION)" = 0.1.10
          test "$(git -C gov rev-parse HEAD)" = 01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = 01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.9 --jq .id)" = 449880979
          grep -q '## RP-07R · v0.1.10 / merged PR #69' p08/docs/authority/ACCEPTANCE_MATRIX.md
          grep -q '### Mode R · ONE_CASE_P08_ADOPS_010_ONE_CLICK_ATOMIC_POST_RELEASE_OWNER_MANUAL' gov/skills/skill-release/V3.17/SKILL.md
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R193_FINAL_MERGED_MAIN_AND_REVERSIBLE_UI_MODE_D=PASS
      - name: Execute original official 018 to final merged 019 real native SQLite success fault and SIGKILL recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p08_r193_native_once.sh sqlite
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R193_FINAL_MERGED_SOURCE_REAL_018_TO_019_SQLITE_NATIVE=PASS
      - name: Assemble official exact FULL and source-018 manifest-bound Atomic with deterministic build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r193-final"
          cp "$RUNNER_TEMP/p08-r193-sqlite/010-full-A.zip" "$RUNNER_TEMP/p08-r193-final/VF_AdOps_V0.1.10_FULL.zip"
          cp "$RUNNER_TEMP/p08-r193-sqlite/010-update-A.zip" "$RUNNER_TEMP/p08-r193-final/VF_AdOps_V0.1.10_UPDATE.zip"
          cmp "$RUNNER_TEMP/p08-r193-final/VF_AdOps_V0.1.10_FULL.zip" "$RUNNER_TEMP/p08-r193-sqlite/010-full-B.zip"
          cmp "$RUNNER_TEMP/p08-r193-final/VF_AdOps_V0.1.10_UPDATE.zip" "$RUNNER_TEMP/p08-r193-sqlite/010-update-B.zip"
          sha256sum "$RUNNER_TEMP/p08-r193-final/"*.zip
          echo P08_R193_FINAL_REAL_ASSET_BOTH_DOUBLE_BUILD_READBACK=PASS
      - name: Prepare final notes, source/provenance and 4-file SHA256 checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p08-r193-final" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          full="VF_AdOps_V0.1.10_FULL.zip"
          update="VF_AdOps_V0.1.10_UPDATE.zip"
          h=lambda n:hashlib.sha256((root/n).read_bytes()).hexdigest()
          prov={
            "schema_version":"1.0","product":"P08","repository":"llhzx2018/vf-adops",
            "target_version":"0.1.10",
            "target_sha":"ef78dcb21117c822e2756360280f2418f794704f",
            "tree_sha":"1c5975bad5b9795998d4afcedec47ba9d52769a4",
            "governance_sha":"01eff0ed2a6d5b350d370a20bc833ac0ba2e4c34",
            "release_mode":"V3.17_MODE_R_ONE_CLICK_ATOMIC_POST_RELEASE_OWNER_MANUAL",
            "source_pr":69,
            "asset_role":"CLEAN_FULL_AND_ATOMIC_019_TO_010",
            "source_version":"0.1.9",
            "source_sha":"b77c7e8563d93255f5f4a60bb8c5736a994d8151",
            "source_full_manifest_sha256":"0abfd473c3428f5378bd946a26e51ddc1fd0cfbd997790ce6c5572163f34481e",
            "data_included":False,"schema_changes":False,"production_auto_apply":False,
            "full_sha256":h(full),"full_bytes":(root/full).stat().st_size,
            "atomic_sha256":h(update),"atomic_bytes":(root/update).stat().st_size,
            "machine_3db_run":"44335404700"
          }
          (root/"RELEASE_PROVENANCE.json").write_text(json.dumps(prov,sort_keys=True,indent=2)+"\n")
          notes="""# VF AdOps v0.1.10 — Safe Owner one-click Atomic Upgrade

          Official code-only Atomic from existing v0.1.9 to v0.1.10. This update changes the authenticated Owner updater page and background task handoff: after manually checking the genuine official compatible offer, a single Owner click now saves one durable authenticated intent to verify package, make native backups, run the source-locked Atomic update and verify runtime version. No automatic update on page entry. Existing backup-before-pointer, second native execution-time backup, rollback, independent SIGKILL recovery, media and Owner GitHub read Token protections remain required; no database migrations or domain licensing are introduced.

          **Existing v0.1.9 users must use the old interface one last time to upgrade to v0.1.10**: manually check official update, prepare/backup, then confirm existing Atomic. After the update and verified new runtime version, subsequent releases use the new simpler one-click UI. NEVER unzip FULL over an existing site; FULL is for brand-new empty installations only. This Atomic is only compatible with exact issued v0.1.9 source b77c7e8563d93255f5f4a60bb8c5736a994d8151 and previous original FULL manifest SHA256 0abfd473c3428f5378bd946a26e51ddc1fd0cfbd997790ce6c5572163f34481e.

          Source and standalone machine proofs: R190 (three native engines) https://github.com/llhzx2018/core-free-runner-public/actions/runs/44331109068 ; R191 governance+Owner security https://github.com/llhzx2018/core-free-runner-public/actions/runs/44334199266 ; R192 exact final source 3DB https://github.com/llhzx2018/core-free-runner-public/actions/runs/44335404700 ; R189 real HTTPS Chromium first install/login+one-click UI https://github.com/llhzx2018/core-free-runner-public/actions/runs/44316822598 (future compatible offer transport synthetic, not live). One-case GOV-DOC V3.17 Mode R and P08 RP-07R effective. This release performs no Owner Production/CloudPanel/DNS/SSL action. Owner Preview/Real Use remains PENDING after published distribution until their own manual upgrade.
          """
          (root/"RELEASE_NOTES.md").write_text(notes)
          names=[full,update,"RELEASE_PROVENANCE.json","RELEASE_NOTES.md"]
          (root/"SHA256SUMS").write_text("\n".join(h(n)+"  "+n for n in names)+"\n")
          print("P08_R193_FINAL_FULL_ATOMIC_PROVENANCE_AND_SHA256SUMS=PASS")
          PY
      - name: Issue only after verified hard gates then read back official real bytes SHA asset IDs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_R193_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_r193_v010_release_once.py
      - name: Always remove disposable private checkouts and release buffers
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r193-final" "$RUNNER_TEMP/p08-r193-sqlite" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-kill"
          test ! -e p08 && test ! -e gov
