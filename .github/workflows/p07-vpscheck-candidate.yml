name: P07 VPSCheck Candidate

on:
  push:
    branches: [main]
    paths:
      - installers/p07-vpscheck.sh
      - .github/workflows/p07-vpscheck-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Installer safety
        run: |
          bash -n installers/p07-vpscheck.sh
          ! grep -F -- '--no-check-certificate' installers/p07-vpscheck.sh
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' installers/p07-vpscheck.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' installers/p07-vpscheck.sh
          grep -F 'CHANNEL="CANDIDATE"' installers/p07-vpscheck.sh

      - name: Public Candidate install
        run: |
          sudo env P07_SUITE_NO_LAUNCH=1 bash installers/p07-vpscheck.sh | tee /tmp/install.txt
          grep -F 'CANDIDATE' /tmp/install.txt
          grep -F 'SELF_TEST PASS' /tmp/install.txt
          grep -F 'p07-vpscheck' /tmp/install.txt

      - name: Exact installed identities
        run: |
          p07-inspect --version | grep -F '0.3.0'
          p07-benchmark --version | grep -F '0.4.0'
          p07-netcheck --version | grep -F '0.5.0'
          printf '0\n' | NO_COLOR=1 p07-vpscheck | grep -F 'P07 · VPS 验机套件'
          f=/opt/p07-vps-suite/INSTALL_MANIFEST.txt
          grep -F 'channel=CANDIDATE' "$f"
          grep -F 'inspect_blob=93a2dfb95a29d799a176aa4dcaf62308b36fb2d9' "$f"
          grep -F 'benchmark_blob=e00321a725b8eae7564ae7939d17b7c354719090' "$f"
          grep -F 'netcheck_blob=f6141eb76ff5808d1eacd1d23bd82e2a68c61b7d' "$f"

      - name: Candidate demo smoke
        run: |
          NO_COLOR=1 p07-inspect --demo | grep -F 'CloudPanel Sites'
          NO_COLOR=1 p07-benchmark --demo --network --yes | grep -F 'TIMEOUT'
          NO_COLOR=1 p07-netcheck --demo --china | grep -F '综合判断：高风险'
