name: GOV193 exact-source domain portability gate
on:
  pull_request:
    paths:
      - '.github/workflows/temp-gov193-portability.yml'
permissions:
  contents: read
jobs:
  exact-governance-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact GOV-DOC source in disposable workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 1108453376f18c19658a89c129fcac184e3f78c4
          path: private-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exact SHA and project test installation portability negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-gov rev-parse HEAD)" = "1108453376f18c19658a89c129fcac184e3f78c4"
          echo "EXACT_GOV_SOURCE=1108453376f18c19658a89c129fcac184e3f78c4"
          cd private-gov
          python3 -B -m unittest discover -s governance/agent -p 'test_project_test_install_receipt_gate.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_project_evolvability_gate.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_code_architecture_lint.py' -q
          python3 -B -m unittest discover -s governance/agent -p 'test_repository_entry.py' -q
          python3 -B -m unittest discover -s governance/public-authority/tools -p 'test_global_closure_lint.py' -q
          python3 -B governance/public-authority/tools/global_closure_lint.py
          python3 -B governance/catalog/tools/doc_structure_lint.py
          grep -Fq '## 七、部署与运营配置不得绑死' governance/agent/VF_CODE_ARCHITECTURE_QUALITY_CONTRACT_V1.md
          grep -Fq 'require-portability' governance/agent/project_test_install_receipt_gate.py
          grep -Fq '设计可配置、部署可替换' CURRENT.md
          echo 'GOV193_PORTABILITY_GATES=PASS'
      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf -- private-gov
          echo 'TEMP_PRIVATE_CHECKOUT_CLEANED=YES'
