name: R83 Focused Watch Year Genre Zero Result Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r83-watch-year-genre-zero-result.yml'

permissions:
  contents: read

jobs:
  r83-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: f9929872635a4b154742b07bb6ac16e3446203d5
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: f9929872635a4b154742b07bb6ac16e3446203d5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: vf-start
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/WatchMediaLibraryPage.php
          php -l tests/unit/watch_year_genre_zero_result_contract.php
          php tests/unit/watch_year_genre_zero_result_contract.php
          php tests/unit/watch_cross_filter_count_contract.php
          php tests/unit/subject_kind_zero_scope_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          echo R83_WATCH_YEAR_GENRE_ZERO_RESULT_PASS
          echo R83_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
