name: P01 V2.47.280 Browser Helper Owner UX Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247280-browser-helper-owner-ux-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.280 browser helper owner ux')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and stable
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 2c18d3c317c577616142500353ad50fba6e3e1f1
          git -C candidate checkout -q --detach 2c18d3c317c577616142500353ad50fba6e3e1f1
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.280"
          git clone -q --depth 1 --branch v2.47.279 "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" stable
          echo P01_V247280_EXACT_SOURCE=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/browser-helper.php
          php -l candidate/tests/unit/admin_browser_helper_page11_polish_contract.php
          php -l candidate/tests/unit/admin_browser_helper_r15_contract.php
          php -l candidate/tests/unit/browser_helper_owner_acceptance_v247280_contract.php
          node --check candidate/src/assets/browser-helper.js
          cd candidate
          php tests/unit/browser_helper_owner_acceptance_v247280_contract.php
          php tests/unit/admin_browser_helper_page11_polish_contract.php
          php tests/unit/admin_browser_helper_r15_contract.php
          php tests/unit/browser_helper_v17_contract.php
          php tests/unit/browser_helper_distribution_contract.php
          php tests/unit/admin_backend_closure_contract.php
          echo P01_V247280_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247280_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only ffbb50140f935fdf59a5bbed1b6e72257470ccd0..2c18d3c317c577616142500353ad50fba6e3e1f1 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update-manager|setup|install)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"; exit 1
          fi
          grep -Fx 'src/browser-helper.php' /tmp/changed.txt
          grep -Fx 'src/assets/browser-helper.js' /tmp/changed.txt
          grep -Fx 'src/assets/admin-shell.css' /tmp/changed.txt
          echo P01_V247280_BOUNDED_SCOPE=PASS
          echo PRODUCTION_WRITE=NO
