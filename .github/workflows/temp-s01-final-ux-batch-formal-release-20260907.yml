            if ok:rows.append((rel,p.read_bytes()))
          rows.sort();assert len(rows)>=900
          def build(path):
            with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,b in rows:
                zi=zipfile.ZipInfo('vf-ops/'+rel,(2026,9,7,0,0,0));zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
            data=Path(path).read_bytes();return len(rows),len(data),hashlib.sha256(data).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'a'/os.environ['ASSET']);b=build(Path(os.environ['RUNNER_TEMP'])/'b'/os.environ['ASSET']);assert a==b
          print(f'FILES={a[0]}');print(f'BYTES={a[1]}');print(f'SHA256={a[2]}')
          PY
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV";set -a;source "$RUNNER_TEMP/metrics.env";set +a;cmp "$RUNNER_TEMP/a/$ASSET" "$RUNNER_TEMP/b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/a/'+os.environ['ASSET']) as z:assert z.testzip() is None;assert b'Version: 1.21.857' in z.read('vf-ops/vf-ops.php')
          PY
          repo='llhzx2018/vf-tools-ops';created_tag=0;created_release=0
          cleanup(){ rc=$?;if [ "$rc" -ne 0 ];then if [ "$created_release" -eq 1 ];then gh release delete "$TAG" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1||true;fi;if [ "$created_tag" -eq 1 ];then gh api --method DELETE "repos/$repo/git/refs/tags/$TAG" >/dev/null 2>&1||true;fi;fi;exit "$rc";};trap cleanup EXIT
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$SHA";gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null;created_tag=1
          printf 'S01-C02 Final Admin Human Language Closure. Exact source: %s\nRelease Intake: 34146818705 PASS\nProduction: NOT_RUN\n' "$SHA" > "$RUNNER_TEMP/notes"
          gh release create "$TAG" "$RUNNER_TEMP/a/$ASSET" --repo "$repo" --title 'VF Tools Ops V1.21.857' --notes-file "$RUNNER_TEMP/notes" --draft --verify-tag;created_release=1
          mkdir "$RUNNER_TEMP/r";gh release download "$TAG" --repo "$repo" --pattern "$ASSET" --dir "$RUNNER_TEMP/r";test "$(stat -c %s "$RUNNER_TEMP/r/$ASSET")" = "$BYTES";test "$(sha256sum "$RUNNER_TEMP/r/$ASSET"|awk '{print $1}')" = "$SHA256"
          gh release edit "$TAG" --repo "$repo" --draft=false;gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/final.json";test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/final.json")" = "sha256:$SHA256";trap - EXIT
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final.json")";echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/final.json")";echo "ASSET_SHA256=$SHA256";echo 'C02_FORMAL_RELEASE=PASS'

