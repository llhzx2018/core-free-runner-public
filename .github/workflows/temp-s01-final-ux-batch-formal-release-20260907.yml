name: S01 Final UX Batch Formal Release
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-final-ux-batch-formal-release-20260907.yml]
permissions:
  contents: read
concurrency:
  group: s01-final-ux-batch-formal-release-20260907
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      C01_SHA: 6c30935c613802847d138097c63c3f73219ec02a
      C01_BASE: 72d2a83da7b940a080d48c40891555dc815aaafa
      C02_SHA: 3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb
      C02_BASE: 1ac24e55e7e21e1d02154a6fd6c96ac814f377b3
      C03_SHA: 3a50a8557fbdb634f56ab6fd14a3d9072bd927c5
      C03_BASE: 6d603409acf470865e3ca8474cd29bff7fdd0601
    steps:
      - name: Three-component exact source and remote release preflight
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" && test -n "$WRITE_TOKEN"
          echo 'CREDENTIAL_MODEL=READ_WRITE_SEPARATED'
          echo 'PRODUCTION_WRITE_USED=NO MIGRATION_USED=NO'
          for spec in \
            'llhzx2018/vf-tools-theme|v1.35.19|6c30935c613802847d138097c63c3f73219ec02a' \
            'llhzx2018/vf-tools-ops|v1.21.857|3e873a80ff6d3defdc31a3d7b4f9574e8b84cfcb' \
            'llhzx2018/vf-tools-m3u8|v1.25.28|3a50a8557fbdb634f56ab6fd14a3d9072bd927c5'; do
            IFS='|' read -r repo tag sha <<< "$spec"
            test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$sha"
            ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1
            ! gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1
          done
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" c01
          git -C c01 checkout -q "$C01_SHA"
          test "$(tr -d '\r\n' < c01/VERSION)" = '1.35.19'
          grep -Eq '^Version: 1\.35\.19$' c01/src/style.css
          grep -Fq 'V1.35.19_S01_FINAL_ADMIN_HUMAN_CLOSURE' c01/src/style.css
          node --check c01/src/assets/js/admin/admin-preview-human-language-final.js
          find c01/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for t in preview-human-language-followup-contract render-settings-human-language-contract recovery-human-language-closure-contract deep-admin-human-language-contract final-admin-human-closure-contract visible-console-v2-contract workbench-primary-action-contract update-refresh-policy-contract; do php "c01/tests/$t.php"; done
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','c01','diff','--name-only',os.environ['C01_BASE']+'..'+os.environ['C01_SHA']],text=True).splitlines())
          exp={'VERSION','src/assets/js/admin/admin-preview-human-language-final.js','src/inc/admin/admin-s01-uiux-polish.php','src/inc/admin/views/brand.php','src/inc/admin/views/navigation.php','src/inc/admin/views/recovery-v510.php','src/inc/admin/views/render.php','src/style.css','tests/deep-admin-human-language-contract.php','tests/final-admin-human-closure-contract.php','tests/preview-human-language-followup-contract.php','tests/recovery-human-language-closure-contract.php','tests/render-settings-human-language-contract.php','tests/update-refresh-policy-contract.php','tests/visible-console-v2-contract.php','tests/workbench-primary-action-contract.php'}
          assert got==exp,(got,exp)
          PY
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" c02
          git -C c02 checkout -q "$C02_SHA"
          test "$(tr -d '\r\n' < c02/VERSION)" = '1.21.857'
          grep -Fq 'Version: 1.21.857' c02/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.857'" c02/vf-ops.php
          find c02/includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php -l c02/vf-ops.php >/dev/null
          for t in system-components-human-language-contract update-compat-human-language-contract admin-human-language-contract pages-tools-human-closure-contract dashboard-selector-hit-contract visible-console-v2-contract update-refresh-policy-current-contract; do php "c02/tests/$t.php"; done
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','c02','diff','--name-only',os.environ['C02_BASE']+'..'+os.environ['C02_SHA']],text=True).splitlines())
          exp={'VERSION','assets/css/current/admin-s01-console-v2.css','includes/admin-v13/views/dashboard.php','includes/admin-v13/views/system_components.php','includes/views/admin-operations-console-pages.php','includes/wp-update/class-vf-ops-update-admin-v1.php','tests/admin-human-language-contract.php','tests/pages-tools-human-closure-contract.php','tests/system-components-human-language-contract.php','tests/update-compat-human-language-contract.php','tests/update-refresh-policy-current-contract.php','tests/visible-console-v2-contract.php','vf-ops.php'}
          assert got==exp,(got,exp)
          PY
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" c03
          git -C c03 checkout -q "$C03_SHA"
          test "$(tr -d '\r\n' < c03/VERSION)" = '1.25.28'
          grep -Fq 'Version: 1.25.28' c03/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R252'" c03/src/vf-tool-m3u8.php
          grep -Fq 'R252_S01_FINAL_ADMIN_HUMAN_CLOSURE' c03/src/vf-tool-m3u8.php
          node --check c03/src/admin/admin-s01-human-language-final.js
          find c03/src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for t in settings-human-language-followup-contract recovery-runtime-human-language-followup-contract admin-human-language-contract dashboard-human-language-contract host-recovery-human-language-contract package-physical-locator-contract update-refresh-policy-contract visible-console-v2-contract bootstrap-upgrade-contract; do php "c03/tests/unit/$t.php"; done
          php c03/tests/frontend-s01-uiux-final-owner-contract.php
          git -C c03 diff --exit-code "$C03_BASE" -- src/includes/v6-provider-schema.php src/includes/v6-provider-post-migration-readonly.php src/includes/v6-provider-controlled-migration-admin.php src/includes/update
          python3 - <<'PY'
          import os,subprocess
          got=set(subprocess.check_output(['git','-C','c03','diff','--name-only',os.environ['C03_BASE']+'..'+os.environ['C03_SHA']],text=True).splitlines())
          exp={'VERSION','src/vf-tool-m3u8.php','src/admin/admin-s01-human-language-final.js','src/admin/admin-s01-uiux-polish.php','tests/unit/dashboard-human-language-contract.php','tests/unit/host-recovery-human-language-contract.php','tests/unit/package-physical-locator-contract.php','tests/unit/recovery-runtime-human-language-followup-contract.php','tests/unit/settings-human-language-followup-contract.php','tests/unit/update-refresh-policy-contract.php','tests/unit/visible-console-v2-contract.php'}
          assert got==exp,(got,exp)
          PY
          echo 'THREE_COMPONENT_FORMAL_SOURCE_PREFLIGHT=PASS'

  release-c01:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: 6c30935c613802847d138097c63c3f73219ec02a
      TAG: v1.35.19
      ASSET: vf-tools-theme_V1.35.19.zip
    steps:
      - name: Deterministic Theme build and publish
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          git -C repo checkout -q "$SHA"
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
          python3 - <<'PY' > "$RUNNER_TEMP/metrics.env"
          from pathlib import Path
          import hashlib,os,zipfile
          src=Path('repo/src'); rows=[(p.relative_to(src).as_posix(),p.read_bytes()) for p in sorted(src.rglob('*'),key=lambda x:x.relative_to(src).as_posix()) if p.is_file()]
          assert len(rows)>=440
          def build(path):
            dirs={'vf-tools-theme/'}
            for rel,_ in rows:
              cur='vf-tools-theme'
              for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
            with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for d in sorted(dirs):
                zi=zipfile.ZipInfo(d);zi.date_time=(1980,1,1,0,0,0);zi.external_attr=(0o40755<<16)|0x10;z.writestr(zi,b'')
              for rel,b in rows:
                zi=zipfile.ZipInfo('vf-tools-theme/'+rel);zi.date_time=(1980,1,1,0,0,0);zi.compress_type=zipfile.ZIP_DEFLATED;zi.external_attr=0o100644<<16;z.writestr(zi,b)
            data=Path(path).read_bytes(); return len(rows),len(data),hashlib.sha256(data).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'a'/os.environ['ASSET']);b=build(Path(os.environ['RUNNER_TEMP'])/'b'/os.environ['ASSET']);assert a==b
          print(f'FILES={a[0]}');print(f'BYTES={a[1]}');print(f'SHA256={a[2]}')
          PY
          cat "$RUNNER_TEMP/metrics.env" >> "$GITHUB_ENV"; set -a; source "$RUNNER_TEMP/metrics.env"; set +a
          cmp "$RUNNER_TEMP/a/$ASSET" "$RUNNER_TEMP/b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          p=os.environ['RUNNER_TEMP']+'/a/'+os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None; assert b'Version: 1.35.19' in z.read('vf-tools-theme/style.css')
          PY
          repo='llhzx2018/vf-tools-theme'; created_tag=0;created_release=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then if [ "$created_release" -eq 1 ]; then gh release delete "$TAG" --repo "$repo" --cleanup-tag --yes >/dev/null 2>&1||true; fi; if [ "$created_tag" -eq 1 ]; then gh api --method DELETE "repos/$repo/git/refs/tags/$TAG" >/dev/null 2>&1||true; fi; fi; exit "$rc"; }; trap cleanup EXIT
          test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$SHA"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null;created_tag=1
          printf 'S01-C01 Final Admin Human Language Closure. Exact source: %s\nRelease Intake: 34146818705 PASS\nProduction: NOT_RUN\n' "$SHA" > "$RUNNER_TEMP/notes"
          gh release create "$TAG" "$RUNNER_TEMP/a/$ASSET" --repo "$repo" --title 'VF Tools Theme V1.35.19' --notes-file "$RUNNER_TEMP/notes" --draft --verify-tag;created_release=1
          mkdir "$RUNNER_TEMP/r";gh release download "$TAG" --repo "$repo" --pattern "$ASSET" --dir "$RUNNER_TEMP/r"
          test "$(stat -c %s "$RUNNER_TEMP/r/$ASSET")" = "$BYTES";test "$(sha256sum "$RUNNER_TEMP/r/$ASSET"|awk '{print $1}')" = "$SHA256"
          gh release edit "$TAG" --repo "$repo" --draft=false;gh api "repos/$repo/releases/tags/$TAG" > "$RUNNER_TEMP/final.json"
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest' "$RUNNER_TEMP/final.json")" = "sha256:$SHA256";trap - EXIT
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/final.json")";echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/final.json")";echo "ASSET_SHA256=$SHA256";echo 'C01_FORMAL_RELEASE=PASS'

  release-c02:
