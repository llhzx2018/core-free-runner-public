name: P01 V2.37.5 Manifest Gate
on:
  push:
    branches: [release/p01-v2375-hotfix-20260902]
    paths: [.github/workflows/p01-v2375-manifest-gate-20260902.yml]
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 4e75fcde3d15c41fabaec5b3c417f5c07bda5e72
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: live
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: 0698f68ba0aa6a4187de5efd6117f0026f6552d1
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - name: Exact manifest boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 0698f68ba0aa6a4187de5efd6117f0026f6552d1
          test "$(git -C candidate rev-parse HEAD^)" = 4e75fcde3d15c41fabaec5b3c417f5c07bda5e72
          test "$(git -C candidate diff --name-only HEAD^ HEAD)" = projects/P01.json
          jq -e '.current_version=="2.37.3" and .target_version=="2.37.4" and .from_versions==["2.37.3"]' live/projects/P01.json >/dev/null
          jq -e '.enabled==true and .current_version=="2.37.4" and .target_version=="2.37.5" and .from_versions==["2.37.4"] and .update_type=="ATOMIC" and .schema_from=="2026082901" and .schema_to=="2026082901" and .release_tag=="v2.37.5" and .release_id==381104896 and .product_identity=="cefda28149dbf29164adc8ebfa57edacad122474" and .asset_name=="VF_Start_V2.37.5_UPDATE.zip" and .asset_bytes==1273639 and .asset_sha256=="169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492"' candidate/projects/P01.json >/dev/null
          ! jq -e '.from_versions|index("2.37.3")' candidate/projects/P01.json >/dev/null
      - name: Release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          REL="$(gh api repos/llhzx2018/vf-start/releases/381104896)"
          test "$(jq -r .tag_name <<<"$REL")" = v2.37.5
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          ID="$(jq -r '.assets[]|select(.name=="VF_Start_V2.37.5_UPDATE.zip")|.id' <<<"$REL")"
          test -n "$ID"
          curl -L --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/llhzx2018/vf-start/releases/assets/$ID" -o /tmp/update.zip
          test "$(stat -c%s /tmp/update.zip)" = 1273639
          test "$(sha256sum /tmp/update.zip | cut -d' ' -f1)" = 169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492
          printf 'P01_V2375_MANIFEST_GATE=PASS\nSTRICT_HOP=2.37.4_TO_2.37.5\nCROSS_VERSION=NO\nSCHEMA_CHANGE=NO\nMIGRATION=NONE\nRELEASE_ID=381104896\nUPDATE_BYTES=1273639\nUPDATE_SHA256=169929d985fe8b888b660258b49ecf278ae588bc1078aeba2745edd47aa69492\nOWNER_PRODUCTION_WRITE=NO\n'
