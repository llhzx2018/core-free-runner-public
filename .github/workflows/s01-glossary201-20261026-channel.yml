name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-glossary201-channel-20261026]
    paths: ['.github/workflows/s01-glossary201-20261026-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.201
  TARGET_SHA: 1e958b1a0bcab74c97a46f0fd1938a645dcd0159
  UPDATE_SHA: 81de4d8d07807c9e402082376354c2643419e7e5
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 81de4d8d07807c9e402082376354c2643419e7e5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary201-20261026/channel-spec.json --input control/.github/workflows/s01-glossary201-20261026-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 3786412a3e510a7d1b5afeb15c1478c35a26e2bd 81de4d8d07807c9e402082376354c2643419e7e5)" = projects/S01-C01.json
          git -C source diff --exit-code 3786412a3e510a7d1b5afeb15c1478c35a26e2bd 81de4d8d07807c9e402082376354c2643419e7e5 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='847cfb08e0650e1cafa16256bb0c337ac3c4f5eb25ee7aa4ebad42889854c456' and m['asset_bytes']==2006638
          assert m['runtime_files']==476 and '1.35.200' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
