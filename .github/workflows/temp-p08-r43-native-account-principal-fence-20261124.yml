name: TEMP P08 R43 dedicated native SQL account lock drain crash and neighbor continuity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temp-p08-r43-native-account-principal-fence-20261124.yml']
permissions:
  contents: read
concurrency:
  group: p08-r43-account-fence-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.17'
  TARGET_SHA: 1f384c2f93aa3e870a2f415237c31d7dd938b286
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-account-principal-fence-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-native-account-principal-fence-20261124.json --input .github/workflows/temp-p08-r43-native-account-principal-fence-20261124.yml
  native-account-fence:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-native-account-principal-fence-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: isolated-p08-r43-native-db
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: isolated-p08-r43-native-db
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=25
    env:
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R43_NATIVE_ENGINE: ${{ matrix.engine }}
      P08_R43_NATIVE_DB_PASSWORD: isolated-p08-r43-native-db
    steps:
      - name: Transient exact private P08 source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_mysql, posix
      - name: Verify real version and isolated source syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43NativeAccountFenceDrill.php > "$RUNNER_TEMP/r43-account-lint.log" 2>&1 || { echo P08_R43_ACCOUNT_FENCE_CLASS_LINT=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_native_account_fence_drill.php >> "$RUNNER_TEMP/r43-account-lint.log" 2>&1 || { echo P08_R43_ACCOUNT_FENCE_TEST_LINT=FAIL; exit 1; }
          echo P08_R43_ACCOUNT_FENCE_PHP84_SOURCE_AND_SYNTAX=PASS
      - name: Site-only lock and drain vs independent tenant, real SIGKILL and independent audit
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          t=private-p08-bridge/tests/compatibility/r43_native_account_fence_drill.php
          php "$t" setup > "$RUNNER_TEMP/r43-account-setup.log" 2>&1 || { echo P08_R43_ACCOUNT_SETUP=FAIL; exit 1; }
          grep -qx 'P08_R43_ACCOUNT_FENCE_SETUP_DEDICATED_PRINCIPALS=PASS' "$RUNNER_TEMP/r43-account-setup.log"
          grep -qx 'P08_R43_ACCOUNT_FENCE_APP_CANNOT_WRITE_OTHER_TENANT=PASS' "$RUNNER_TEMP/r43-account-setup.log"
          grep -qx 'P08_R43_ACCOUNT_FENCE_OTHER_TENANT_CANNOT_WRITE_APP=PASS' "$RUNNER_TEMP/r43-account-setup.log"
          if ! php "$t" fence > "$RUNNER_TEMP/r43-account-fence.log" 2>&1; then
            echo P08_R43_ACCOUNT_FENCE_PRIVILEGED_LOCK_DRAIN=FAIL
            grep -E '^P08_R43_ACCOUNT_FENCE_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/r43-account-fence.log" | tail -20 || true
            err="$(grep -oE 'R43_ACCOUNT_FENCE_[A-Z0-9_]+' "$RUNNER_TEMP/r43-account-fence.log" | tail -1 || true)"
            if [[ "$err" =~ ^R43_ACCOUNT_FENCE_[A-Z0-9_]+$ ]]; then echo "P08_R43_ACCOUNT_SAFE_CODE=$err"; else echo P08_R43_ACCOUNT_SAFE_CODE=UNCLASSIFIED; fi
            exit 1
          fi
          grep -qx 'P08_R43_ACCOUNT_FENCE_ACCOUNT_LOCK_ALONE_DOES_NOT_STOP_EXISTING_WRITER=PASS' "$RUNNER_TEMP/r43-account-fence.log"
          grep -qx 'P08_R43_ACCOUNT_FENCE_KILL_ROLLED_BACK_INFLIGHT_APP_TRANSACTION=PASS' "$RUNNER_TEMP/r43-account-fence.log"
          grep -qx 'P08_R43_ACCOUNT_FENCE_OTHER_TENANT_FULLY_WRITABLE_DURING_SITE_FENCE=PASS' "$RUNNER_TEMP/r43-account-fence.log"
          set +e
          php "$t" kill-worker > "$RUNNER_TEMP/r43-account-kill.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 137 || { echo "P08_R43_ACCOUNT_SIGKILL_EXIT_NOT_137=$code"; exit 1; }
          grep -qx 'P08_R43_ACCOUNT_FENCE_WORKER_ABOUT_TO_SIGKILL_WITH_DB_LOCKED=PASS' "$RUNNER_TEMP/r43-account-kill.log"
          php "$t" audit-locked > "$RUNNER_TEMP/r43-account-audit.log" 2>&1 || { echo P08_R43_ACCOUNT_FRESH_AUDIT=FAIL; exit 1; }
          grep -qx 'P08_R43_ACCOUNT_FENCE_CRASH_RESILIENT_DATABASE_ACCOUNT_LOCK=PASS' "$RUNNER_TEMP/r43-account-audit.log"
          grep -qx 'P08_R43_ACCOUNT_FENCE_TENANT_WRITE_ALLOWED_AFTER_WORKER_KILL=PASS' "$RUNNER_TEMP/r43-account-audit.log"
          php "$t" release > "$RUNNER_TEMP/r43-account-unlock.log" 2>&1 || { echo P08_R43_ACCOUNT_FENCE_CONTROLLED_UNLOCK=FAIL; exit 1; }
          grep -qx 'P08_R43_ACCOUNT_FENCE_NO_AUTOMATIC_UNLOCK_AFTER_CRASH=PASS' "$RUNNER_TEMP/r43-account-unlock.log"
          echo "P08_R43_NATIVE_ACCOUNT_FENCE_LOCK_DRAIN_KILL_NEIGHBOR_WRITE=PASS engine=$P08_R43_NATIVE_ENGINE"
          echo P08_R43_SHIPPING_SCHEMA_CUTOVER=BLOCKED
      - name: Drop only synthetic databases and principals; erase private source
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          status=1
          if test -f private-p08-bridge/tests/compatibility/r43_native_account_fence_drill.php; then
            php private-p08-bridge/tests/compatibility/r43_native_account_fence_drill.php cleanup > "$RUNNER_TEMP/r43-account-cleanup.log" 2>&1
            status=$?
          fi
          rm -rf -- private-p08-bridge
          rm -f -- "$RUNNER_TEMP"/r43-account-*.log
          if test "$status" -eq 0 && test ! -e private-p08-bridge; then
            echo P08_R43_PRIVATE_SOURCE_SYNTHETIC_DB_ACCOUNT_CLEANUP=PASS
          else
            echo P08_R43_PRIVATE_OR_ACCOUNT_CLEANUP=FAIL
            exit 1
          fi
