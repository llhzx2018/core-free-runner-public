name: P06 AI Book Slice 1 Home Exact Source Gate

on:
  pull_request:
    paths:
      - .github/workflows/temp-p06-ai-book-slice1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p06-ai-book-slice1-home
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPO: llhzx2018/vf-press
      SOURCE_SHA: 9a1409e10aed8f37ad8927d35128c8ff5e50afa3
    steps:
      - name: Require private read capability
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo PRIVATE_READ_CAPABILITY=PASS

      - name: Checkout exact P06 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Prepare PHP SQLite runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-zip php-curl sqlite3 composer >/dev/null
          php -v
          composer --version
          echo MACHINE_RUNTIME=PASS

      - name: Source and authority gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '0.1.6'
          test "$(jq -r .version VF_PROJECT.json)" = '0.1.6'
          test "$(jq -r .schema VF_PROJECT.json)" = '2'
          test "$(jq -r .current_phase VF_PROJECT.json)" = 'AI_BOOK_PRODUCTION_SLICE_1_IMPLEMENTATION'
          test "$(jq -r .release_gates.schema_impact_review VF_PROJECT.json)" = 'PASS_SPLIT_SLICE_1_NO_CHANGE_SLICE_2_MIGRATION_REQUIRED'
          test "$(jq -r .release_gates.schema_migration VF_PROJECT.json)" = 'NOT_AUTHORIZED_DEFERRED_TO_SLICE_2'
          echo SOURCE_IDENTITY=PASS
          echo AUTHORITY_GATE=PASS

      - name: Composer and PHP syntax
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict
          composer dump-autoload --no-dev --optimize --no-interaction
          find src bin public -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          echo COMPOSER_VALIDATE=PASS
          echo PHP_SYNTAX=PASS

      - name: Fresh migration and full regression
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php bin/self-test.php | grep -Fq FOUNDATION_SELF_TEST_PASS
          php bin/security-self-test.php | grep -Fq SECURITY_SELF_TEST_PASS
          php bin/research-self-test.php | grep -Fq RESEARCH_SELF_TEST_PASS
          php bin/publication-self-test.php | grep -Fq PUBLICATION_MANUSCRIPT_SELF_TEST=PASS
          php bin/markdown-import-self-test.php | tee /tmp/p06-markdown-import
          grep -Fq MARKDOWN_IMPORT_SELF_TEST=PASS /tmp/p06-markdown-import
          grep -Fq CANONICAL_MARKDOWN_READBACK=PASS /tmp/p06-markdown-import
          grep -Fq OWNER_READER=PASS /tmp/p06-markdown-import
          grep -Fq EMPTY_FILE_REJECTED=PASS /tmp/p06-markdown-import
          grep -Fq SCHEMA=2 /tmp/p06-markdown-import
          php bin/reader-self-test.php | grep -Fq PUBLISHER_READER_SELF_TEST=PASS
          php bin/edition-self-test.php | grep -Fq EDITION_SELF_TEST=PASS
          php bin/living-publishing-self-test.php | grep -Fq LIVING_PUBLISHING_SELF_TEST=PASS
          php bin/operations-self-test.php | grep -Fq OPERATIONS_SELF_TEST=PASS
          php bin/operations-ui-self-test.php | grep -Fq OPERATIONS_UI_SELF_TEST=PASS
          php bin/public-asset-self-test.php | grep -Fq PUBLIC_ASSET_HTTP_SELF_TEST=PASS
          php bin/job-self-test.php | grep -Fq JOB_QUEUE_SELF_TEST=PASS
          php bin/update-self-test.php | grep -Fq UPDATE_SELF_TEST=PASS
          php bin/migrate.php | grep -Fq MIGRATION_PASS
          php -r '$pdo=new PDO("sqlite:storage/app.db"); if($pdo->query("PRAGMA integrity_check")->fetchColumn()!=="ok") exit(1); if((int)$pdo->query("SELECT MAX(version) FROM schema_migrations")->fetchColumn()!==2) exit(2); echo "SQLITE_INTEGRITY=PASS\nSCHEMA=2 PASS\n";'
          echo FULL_REGRESSION=PASS

      - name: UI and safety contract
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq '/studio/publications/import' src/Http/Studio/PublicationController.php
          grep -Fq 'enctype="multipart/form-data"' src/Http/Studio/PublicationController.php
          grep -Fq 'is_uploaded_file' src/Http/Studio/PublicationController.php
          grep -Fq 'importMarkdownBook' src/Application/Publication/PublicationService.php
          grep -Fq 'Canonical Manuscript' src/Http/Studio/PublicationController.php
          grep -Fq '在线阅读' src/Http/Studio/PublicationController.php
          ! test -f database/schema/0003_ai_book_generation.sql
          echo MARKDOWN_UPLOAD_CONTRACT=PASS
          grep -Fq '继续你的书' src/Http/Studio/OperationsController.php
          grep -Fq '正在生成' src/Http/Studio/OperationsController.php
          grep -Fq '需要确认' src/Http/Studio/OperationsController.php
          grep -Fq '我的书籍' src/Http/Studio/OperationsController.php
          grep -Fq 'ADMIN_IA_SIX_DESTINATIONS=PASS' <(php bin/operations-ui-self-test.php)
          echo OPERATIONS_HOME_CONTRACT=PASS
          echo OWNER_READER_ENTRY=PASS
          echo SCHEMA_CHANGE=0
          echo VERSION_BUMP=0
          echo PRODUCTION_WRITE=0

      - name: Product repository cleanliness
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf storage dist storage-restore-*
          test -z "$(git status --short --untracked-files=all)"
          echo PRODUCT_REPOSITORY_CLEAN=PASS
          echo PRIVATE_DATA_PERSISTED=NO
