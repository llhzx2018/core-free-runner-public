name: P08 R200 v0.1.11 FINAL official FULL and v0.1.10 to v0.1.11 Atomic issuance
on:
  pull_request:
    paths:
      - .github/workflows/p08-v011-official-issuance.yml
      - scripts/p08_v011_final_native.sh
      - scripts/p08_v011_official_release_once.py
      - scripts/specs/p08-v011-final-source.json
permissions:
  contents: read
jobs:
  exact-final-real-full-native-atomic-release:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v011-official-issuance-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: 1de00a198add963c2e87779e71f8d564e67c5328
      TARGET_VERSION: '0.1.11'
      TARGET_SHA: 1de00a198add963c2e87779e71f8d564e67c5328
      TARGET_TREE: 675c73951b42adeaf5d52de8af836baaa616437c
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout short-lived registered Public Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact merged main 0.1.11 source and no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 1de00a198add963c2e87779e71f8d564e67c5328
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout exact current GOV-DOC canonical 13-domain source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 Composer and DB extension suite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22 exact lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native database CLI tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
      - name: Verify final exact main, official v0.1.10 and prerequisite machine gates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(id -u)" -ne 0
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/specs/p08-v011-final-source.json
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/specs/p08-v011-final-source.json --input .github/workflows/p08-v011-official-issuance.yml
          test "$(git -C p08 rev-parse HEAD)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(git -C p08 rev-parse HEAD^{tree})" = 675c73951b42adeaf5d52de8af836baaa616437c
          test "$(cat p08/VERSION)" = 0.1.11
          test "$(git -C gov rev-parse HEAD)" = 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/heads/main --jq .object.sha)" = 1de00a198add963c2e87779e71f8d564e67c5328
          test "$(gh api repos/llhzx2018/gov-doc/git/ref/heads/main --jq .object.sha)" = 45a0df6abb9cdf8cc6d2210368c7a8332b36e25c
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.10 --jq .id)" = 450188625
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = 680c08ffdeeb4a310479b0c2870270cee012da0b
          grep -q '### Mode D · OWNER_DIRECT_REVERSIBLE_UI_RELEASE' gov/skills/skill-release/V3.18/SKILL.md
          grep -q 'OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED' p08/docs/authority/ACCEPTANCE_MATRIX.md
          for rid in 44473046437 44473046440; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$rid --jq .conclusion)" = success
          done
          test "$(gh api 'repos/llhzx2018/core-free-runner-public/actions/runs/44473046440/jobs?per_page=100' --jq '[.jobs[] | select(.conclusion=="success" and (.name | startswith("official-full-to-exact-next-atomic"))) ] | length')" = 3
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R200_FINAL_EXACT_MODE_D_3DB_AND_HTTPS_PREISSUE=PASS
      - name: Rebuild original issued 0.1.10 into final 0.1.11 source-locked FULL and Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p08_v011_final_native.sh sqlite
          test -z "$(git -C p08 status --porcelain --untracked-files=all)"
          echo P08_R200_FINAL_010_TO_011_REBUILT_NATIVE=PASS
      - name: Assemble official exact FULL and source-010 manifest-bound Atomic with deterministic build identity
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 700 -p "$RUNNER_TEMP/p08-r200-final"
          cp "$RUNNER_TEMP/p08-r198-sqlite/011-full-A.zip" "$RUNNER_TEMP/p08-r200-final/VF_AdOps_V0.1.11_FULL.zip"
          cp "$RUNNER_TEMP/p08-r198-sqlite/011-update-A.zip" "$RUNNER_TEMP/p08-r200-final/VF_AdOps_V0.1.11_UPDATE.zip"
          cmp "$RUNNER_TEMP/p08-r200-final/VF_AdOps_V0.1.11_FULL.zip" "$RUNNER_TEMP/p08-r198-sqlite/011-full-B.zip"
          cmp "$RUNNER_TEMP/p08-r200-final/VF_AdOps_V0.1.11_UPDATE.zip" "$RUNNER_TEMP/p08-r198-sqlite/011-update-B.zip"
          sha256sum "$RUNNER_TEMP/p08-r200-final/"*.zip
          echo P08_R200_FINAL_REAL_ASSET_BOTH_DOUBLE_BUILD_READBACK=PASS
      - name: Prepare official provenance, Owner notes and SHA256SUMS
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/p08-r200-final" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          full="VF_AdOps_V0.1.11_FULL.zip"
          update="VF_AdOps_V0.1.11_UPDATE.zip"
          h=lambda n:hashlib.sha256((root/n).read_bytes()).hexdigest()
          assert h(full)=="eeb48ec9fe586c5e593e50955a6bcd8b6b976402a5ffb98f289c1d21a167b177"
          assert h(update)=="5d2ddeab283f0220dcc90d1f163d392c203677995518bcda6d77f60b8c6b1d08"
          prov={
            "schema_version":"1.0","product":"P08","repository":"llhzx2018/vf-adops",
            "target_version":"0.1.11",
            "target_sha":"1de00a198add963c2e87779e71f8d564e67c5328",
            "tree_sha":"675c73951b42adeaf5d52de8af836baaa616437c",
            "governance_sha":"45a0df6abb9cdf8cc6d2210368c7a8332b36e25c",
            "release_mode":"OWNER_DIRECT_REVERSIBLE_UI_RELEASE",
            "source_pr":73,"ux_pr":72,
            "asset_role":"CLEAN_FULL_AND_ATOMIC_010_TO_011",
            "source_version":"0.1.10",
            "source_sha":"ef78dcb21117c822e2756360280f2418f794704f",
            "source_full_manifest_sha256":"ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110",
            "data_included":False,"schema_changes":False,"production_auto_apply":False,
            "full_sha256":h(full),"full_bytes":(root/full).stat().st_size,
            "atomic_sha256":h(update),"atomic_bytes":(root/update).stat().st_size,
            "machine_3db_run":"44473046440","machine_https_run":"44473046437",
            "owner_preview":"POST_RELEASE_REQUIRED_NOT_PASS",
            "owner_real_use":"POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS"
          }
          (root/"RELEASE_PROVENANCE.json").write_text(json.dumps(prov,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          notes="""# VF AdOps v0.1.11 — 系统更新整页 UX/UI 优化

          本次正式更新：把版本、GitHub 只读授权、官方版本检查和安全 Atomic 升级整合到同一工作区。已授权时只需要点击检查官方更新，发现与当前已安装 v0.1.10 相符的正式版本后点击一次「一键安全升级」，后台自动校验官方包、执行原生备份、原子切换并核验真正运行版本后自动同步页面。不中断任务时无需再次手工点击执行，也不需要人为反复按 F5。

          **兼容来源仅为官方 v0.1.10**（源码 ef78dcb21117c822e2756360280f2418f794704f，原始 FULL_MANIFEST sha256 ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110）。UPDATE 是代码升级，不新增数据库迁移。更新前完整备份、故障回滚和 SIGKILL 恢复保护不变，不自动更改已装数据库、媒体、GitHub Token、域名或生产服务。绝对不可将 FULL ZIP 覆盖到已安装网站；FULL 仅供新的干净空站首次安装。

          正式发行身份以 GitHub 此 Tag、Release 资产 ID / ZIP SHA256、更新频道的官方校验为准，而不是源码内部开发阶段标记。发布与频道分发后，Production 仍由 Owner 在后台手工升级；Owner 个人预览/真实使用为后置待验，不得冒充 PASS。

          机器证据：[v0.1.11 最终源码三引擎 Atomic/备份恢复/故障回滚](https://github.com/llhzx2018/core-free-runner-public/actions/runs/44473046440)；[独立 HTTPS Chromium Owner 一键/版本同步](https://github.com/llhzx2018/core-free-runner-public/actions/runs/44473046437)。13 域当前规则及最终 ZIP Public Authority 验收需 PASS 才可发行。
          """
          (root/"RELEASE_NOTES.md").write_text(notes,encoding="utf-8")
          names=[full,update,"RELEASE_PROVENANCE.json","RELEASE_NOTES.md"]
          (root/"SHA256SUMS").write_text("\n".join(h(n)+"  "+n for n in names)+"\n",encoding="utf-8")
          print("P08_R200_FINAL_PROVENANCE_NOTES_AND_CHECKSUMS=PASS")
          PY
      - name: Issue only after verified hard gates then read back official real bytes SHA asset IDs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          P08_R200_ISOLATED: YES
        run: |
          set -Eeuo pipefail
          python3 scripts/p08_v011_official_release_once.py
      - name: Always remove disposable private checkouts and release buffers
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r200-final" "$RUNNER_TEMP/p08-r198-sqlite" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-sqlite-kill"
          test ! -e p08 && test ! -e gov
