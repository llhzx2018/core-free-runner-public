name: P01 V2.24.0 Formal Artifact Gate
on:
  push:
    paths:
      - '.github/workflows/p01-v2240-formal-artifact-gate-20260828.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: runner
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 867e3387b8efb70398287d05fd3652540efa77c8
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: production
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Verify exact release source gate
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api repos/llhzx2018/core-free-runner-public/actions/runs/33155682269 | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null
          test "$(git -C candidate rev-parse HEAD)" = 867e3387b8efb70398287d05fd3652540efa77c8
          test "$(git -C candidate rev-parse HEAD^{tree})" = 5985dab8ee071c881fd1e425864ed363e3bdc905
          test "$(git -C production rev-parse HEAD)" = 6e7d30e6ea0c8f5f70076a69b0d1e6fb9be620b2
          echo P01_V2240_EXACT_SOURCE_DEPENDENCY=PASS
      - name: Build and machine-test formal release set
        run: bash runner/scripts/p01-v2240-formal-artifact-gate.sh
      - name: Upload exact formal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P01-V2.24.0-FORMAL-ARTIFACTS
          path: |
            /tmp/p01-v2240-artifacts/VF-Start-V2.24.0-FULL.zip
            /tmp/p01-v2240-artifacts/VF-Start-V2.24.0-UPDATE.zip
            /tmp/p01-v2240-artifacts/VF_Start_V2.24.0_UPDATE.zip
            /tmp/p01-v2240-artifacts/server-update-v2.24.0-repair.php
            /tmp/p01-v2240-artifacts/P01-V2.24.0-ARTIFACT-GATE.json
            /tmp/p01-v2240-artifacts/P01-V2.24.0-RELEASE-GATE.json
            /tmp/p01-v2240-artifacts/SHA256SUMS.txt
            /tmp/p01-v2240-artifacts/atomic-self-test.json
          if-no-files-found: error
          retention-days: 7
