name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-header178-20261023]
    paths: ['.github/workflows/s01-header178-20261023-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.178
  TARGET_SHA: abf8b798a5da1f4e7a29fe7d6a17fa3c8edb8cca
  TARGET_TREE: d4a36c3ca723b7b0864ed90c7b5f0e4f13fe8be0
  BASE_SHA: b8e944681ae263a585d03748dbf4d111e08d899a
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: abf8b798a5da1f4e7a29fe7d6a17fa3c8edb8cca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39943957536 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39943957536 --jq .head_sha)" = 238cf4393452ef9937490f4d8391e03d3c6086a5
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39943957536 --repo llhzx2018/core-free-runner-public --name s01-home-39943957536 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-header178-20261023/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='8e375f73477f58fc4a87baffc832d1c5c2842ea2'
          phases={phase:json.loads((r/(phase+'-header.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['write_requests']==[] and result['errors']==[]
              assert len(result['rows'])==16
              assert {(x['language'],x['width'],x['route']) for x in result['rows']}=={(lang,width,route) for lang in ['en','zh'] for width in [1920,1440,1319,1024] for route in ['home','tools/']}
              fixed=phase in ['upgrade','after']
              for row in result['rows']:
                  o=row['observed']
                  assert row['result']=='PASS' and o['overflow'] is False and o['clipped']==[]
                  assert o['version']==('1.35.178' if fixed else '1.35.177')
                  assert len(o['top'])==5 and len(o['h1'])==len(o['canonical'])==1
                  assert all(x['height']>=(44 if fixed else 40) and abs(x['centerY']-o['inner']['centerY'])<=2 for x in o['top'])
                  assert all(not i or x['x']>=o['top'][i-1]['right']+4 for i,x in enumerate(o['top']))
                  assert o['language']['x']>=o['top'][-1]['right']+4
                  assert o['actions']['x']>=o['language']['right']+4 and o['actions']['right']<=o['inner']['right']+1
                  if fixed:
                      assert 16<=o['brandNavGap']<=40 and 16<=o['actionGap']<=36
                      assert o['brand']['marginRight']==o['nav']['marginLeft']=='0px'
                      assert all(x['font']=='15px' and x['weight']=='600' for x in o['top'])
                      if row['width']>=1319:assert o['menuUtilityGap']>o['brandNavGap']*2
                  elif row['width']>=1319:assert o['brandNavGap']>100
              if phase in ['before','after']:
                  assert {x['language'] for x in result['interactions']}=={'en','zh'}
                  for x in result['interactions']:
                      assert x['submenu_keyboard']==x['language_escape_focus']==x['language_navigation']==x['tools_click_return']=='PASS'
                      if fixed:assert x['submenu_bounds']==x['submenu_item_containment']=='PASS'
                      elif x['language']=='en':assert x['submenu_item_containment']=='BASELINE_OVERFLOW'
                  for lang in ['en','zh']:
                      menu=json.loads((r/(phase+'-tools-open-'+lang+'.json')).read_text())
                      assert len(menu['links'])==11 and menu['active']
                      assert menu['rect']['left']>=0 and menu['rect']['right']<=1440 and menu['rect']['bottom']<=1000
                      assert all(x['height']>=40 and not x['clipped'] for x in menu['links'])
                      if fixed:assert all(not x['outside'] for x in menu['links'])
                      elif lang=='en':assert any(x['outside'] for x in menu['links'])
          for before,after in zip(phases['before']['rows'],phases['after']['rows']):
              for key in ['hrefs','h1','canonical']:assert before['observed'][key]==after['observed'][key]
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='b1c3cde230e80b25a30b549f09daa96eeec32c86931c0af64b0b38de781418fd' and new['bytes']==1977722
          coverage=json.loads(pathlib.Path('control/lanes/s01-header178-20261023/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='8e375f73477f58fc4a87baffc832d1c5c2842ea2' and coverage['tree']=='d4a36c3ca723b7b0864ed90c7b5f0e4f13fe8be0'
          assert coverage['owner_preview']=='N_A per unchanged Theme SSOT15'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='39943957536'
          coverage['merged_source']='abf8b798a5da1f4e7a29fe7d6a17fa3c8edb8cca'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.178 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.178 provider/vf-tools-theme_V1.35.178.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.178' --notes '修复桌面共享页头双auto边距将主菜单推右的问题：Logo后接主导航，剩余空间位于主菜单与语言/操作区之间；统一一级菜单15px/600与44px点击区域。修复工具下拉长名称撑出底板，允许自然换行；补全语言触发器键盘焦点。沿用Smallpdf官方页头的品牌+主导航/右侧操作分组，不新增账号或业务入口。保留既有内容、菜单、自定义配置、URL、语言配对、SEO、JS及领域逻辑；不改移动断点。中英文四档桌面×首页/工具目录×升级前后/回退/重复安装64组布局观察、11工具子项、真实跳转/返回与键盘操作，以及干净安装和受保护数据验证通过。476运行文件；M3U8保持1.25.94，Ops未改。Production由Owner手工升级，手机实机暂缓；机器验证不等于首页整体运营体验通过，正式站视觉与使用验收仍待Owner。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.178 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.178 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.178 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.178.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.178.zip remote/vf-tools-theme_V1.35.178.zip
          echo 'b1c3cde230e80b25a30b549f09daa96eeec32c86931c0af64b0b38de781418fd  remote/vf-tools-theme_V1.35.178.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.178.zip)" = 1977722
          gh release view v1.35.178 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
