name: P01 V2.32.0 Candidate Metadata Closure
on:
  push:
    branches: [task/p01-v2320-candidate-closure-20260830]
    paths: [.github/workflows/p01-v2320-candidate-metadata-20260830.yml]
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.32.0-candidate-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source V2.32 candidate metadata closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 8944677974e3a512d846f0740897a7a98e4b7b53
          test "$(git rev-parse HEAD^{tree})" = 09412d1b7df21deb01a45e3069ecd48e564fb458
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Version identity: root, runtime marker, bootstrap constant.
          assert Path('VERSION').read_text(encoding='utf-8').strip() == '2.31.0'
          assert Path('src/VERSION.txt').read_text(encoding='utf-8').strip() == '2.31.0'
          Path('VERSION').write_text('2.32.0\n', encoding='utf-8')
          Path('src/VERSION.txt').write_text('2.32.0\n', encoding='utf-8')
          bp = Path('src/app/bootstrap.php')
          bs = bp.read_text(encoding='utf-8')
          old = "define('VF_VERSION', '2.31.0');"
          new = "define('VF_VERSION', '2.32.0');"
          assert bs.count(old) == 1
          assert new not in bs
          bp.write_text(bs.replace(old, new, 1), encoding='utf-8')

          # Project registry: preserve V2.31 Production Truth, add V2.32 Candidate Truth.
          pj = Path('VF_PROJECT.json')
          data = json.loads(pj.read_text(encoding='utf-8'))
          assert data['production_version'] == '2.31.0'
          assert data['schema_version'] == '2026082901'
          data['status'] = 'V2.31.0 OWNER PRODUCTION / V2.32.0 RELEASE CANDIDATE'
          data['working_version'] = '2.32.0'
          data['target_release_version'] = '2.32.0'
          data['working_schema_version'] = '2026082901'
          data['current_working_branch'] = 'release/p01-v2.32.0-candidate-20260830'
          data['current_phase'] = 'V2.32.0 CANDIDATE CLOSURE / UNIFIED READINESS GATE PENDING'
          data['current_change'] = {
              'change_id': 'P01-V232-HOME-COMMAND-CENTER-20260830',
              'base': 'V2.31.0 OWNER PRODUCTION',
              'result': 'PRODUCT COMPLETE / VERSIONED CANDIDATE / UNIFIED GATE PENDING',
              'product_develop_source': '8944677974e3a512d846f0740897a7a98e4b7b53',
              'product_develop_tree': '09412d1b7df21deb01a45e3069ecd48e564fb458',
              'schema_change': False,
              'migration': None,
              'owner_home_command_center': True,
              'all_resources_separate_workspace': True,
              'favorite_launchpad': True,
              'activity_rail': True,
              'health_signal': True,
              'activity_relative_time': True,
              'anonymous_public_root_unchanged': True,
              'production_write_by_assistant': False,
              'prs_merged_to_develop': [61, 62, 63, 64, 65],
              'gates': {
                  'home_command_center': 33259830188,
                  'home_polish': 33260391147,
                  'activity_rail': 33261107637,
                  'health_signal': 33261678947,
                  'activity_time_final': 33262598059,
                  'candidate_readiness': None,
                  'final_metadata_fence': None
              }
          }
          auth = data.setdefault('authority', {})
          auth['current_candidate_evidence'] = 'docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md'
          data['candidate_version'] = '2.32.0'
          data['candidate_schema_version'] = '2026082901'
          data['candidate_state'] = 'VERSIONED / UNIFIED READINESS GATE PENDING'
          data['formal_release_state'] = 'NOT_STARTED / CANDIDATE ONLY'
          data['v2_32_tag_state'] = 'NOT_CREATED'
          data['core_updates_v2_32_state'] = 'NOT_PUBLISHED'
          data['current_authority'] = 'Owner Production V2.31.0 / Schema 2026082901 + V2.32.0 Candidate Closure'
          data['next_action'] = 'Run V2.32 unified Candidate Readiness Gate; no main/tag/release/core-updates/Production before PASS'
          pj.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          Path('docs/authority/CURRENT.md').write_text('''# P01 · VF Start · Current Authority

