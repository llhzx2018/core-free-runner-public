name: P01 V2.32.0 Candidate Metadata Closure
on:
  push:
    branches: [task/p01-v2320-candidate-closure-20260830]
    paths:
      - .github/workflows/p01-v2320-candidate-metadata-20260830.yml
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.32.0-candidate-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source V2.32 candidate metadata closure
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 8944677974e3a512d846f0740897a7a98e4b7b53
          test "$(git rev-parse HEAD^{tree})" = 09412d1b7df21deb01a45e3069ecd48e564fb458
          python3 ../runner/scripts/p01-v2320-candidate-metadata.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php >/dev/null
          test "$(cat VERSION)" = 2.32.0
          test "$(cat src/VERSION.txt)" = 2.32.0
          grep -Fx "define('VF_VERSION', '2.32.0');" src/app/bootstrap.php
          grep -F 'V2.32.0 RELEASE CANDIDATE' docs/authority/CURRENT.md >/dev/null
          grep -F 'Unified Candidate Readiness' docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md >/dev/null
          git diff --name-only | sort > /tmp/v232-candidate-actual.txt
          printf '%s\n' CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php | sort > /tmp/v232-candidate-expected.txt
          diff -u /tmp/v232-candidate-expected.txt /tmp/v232-candidate-actual.txt
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.32.0_CANDIDATE_READINESS_20260830.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php
          git commit -m 'chore(P01): close V2.32.0 candidate metadata'
          git push origin HEAD:release/p01-v2.32.0-candidate-20260830
          echo "NEW_SOURCE=$(git rev-parse HEAD)"
          echo "NEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_SRC_TREE=$(git rev-parse HEAD:src)"
          echo 'VERSION=2.32.0'
          echo 'SCHEMA=2026082901'
          echo 'OWNER_PRODUCTION_WRITE=NO'
          echo 'RELEASE=NO'
