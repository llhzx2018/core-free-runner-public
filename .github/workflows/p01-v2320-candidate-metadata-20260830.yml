Unified Candidate Readiness 必须绑定最终 versioned Candidate Source，并至少验证：

- root `VERSION` / `src/VERSION.txt` / `VF_VERSION` = `2.32.0`；
- Schema=`2026082901`，无 Migration；
- V2.31 Production → V2.32 Candidate 的 6-file runtime delta；
- PHP syntax + Fresh Install + `cli/verify.php`；
- SQLite integrity / foreign keys；
- 真实非生产 `2.31.0 -> 2.32.0` Atomic Update / data preservation；
- Owner Home：Recent / Favorites / Activity / conditional Health / zero-pending behavior；
- authenticated `/` → Home；anonymous `/` → Public Navigator；
- Home cross-domain Add / domain Add lock；
- Desktop + Mobile / no horizontal overflow；
- Runner fixture self-delete；
- `OWNER_PRODUCTION_WRITE=NO`。

