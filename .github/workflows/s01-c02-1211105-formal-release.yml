name: S01 C02 1211105 Formal Release
on:
  push:
    branches: [task/s01-c02-1211105-formal-release-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1105'
      TARGET_SHA: 'f8f3e723564bcee14a6d7c9bfbd8bc51cb477277'
      MAIN_SHA: '67b4911c5c989b635cddf144648b6a6a4e39dade'
      TARGET_TREE: 'b0bd6f9ffdb725e196c70d8792b4217c94fd4916'
      RELEASE_TAG: 'v1.21.1105'
      RUN_ID: '38223675739'
      ARTIFACT_ID: '11735408149'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: f8f3e723564bcee14a6d7c9bfbd8bc51cb477277
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211105/formal-release.sh
          bash runner/lanes/s01-c02-1211105/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211105-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
