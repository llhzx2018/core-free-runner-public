name: TEMP P07 Restore-As rollback recovery exact-source
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-restore-as-rollback-protection-temporary.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-restore-as-rollback-20261017
  cancel-in-progress: false
jobs:
  focused-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require registered private source read token
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P07 private candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: cc3aa2d706840fe56bcc986db9c866e90b98e3b0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Validate Restore-As safety and related restore suites
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = 'cc3aa2d706840fe56bcc986db9c866e90b98e3b0'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -m py_compile lib/restore_as.py tests/test_restore_as.py
          log="$RUNNER_TEMP/p07-restore-as-rollback-regression.log"
          if timeout --signal=TERM --kill-after=5s 780 python3 -m unittest -q tests.test_restore_as tests.test_restore_as_verified tests.test_restore_as_machine_e2e tests.test_restore_as_real_db_compat tests.test_site_lifecycle tests.test_restore_new tests.test_restore tests.test_backup >"$log" 2>&1; then
            echo 'P07_RESTORE_AS_INCOMPLETE_ROLLBACK=PASS'
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_RESTORE_AS_INCOMPLETE_ROLLBACK=FAIL_$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Remove all transient private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-restore-as-rollback-regression.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
