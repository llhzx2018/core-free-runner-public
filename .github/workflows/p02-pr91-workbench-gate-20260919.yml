name: P02 PR91 Workbench Gate

on:
  push:
    branches:
      - task/p02-pr91-workbench-gate-20260919
    paths:
      - '.github/workflows/p02-pr91-workbench-gate-20260919.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: ux/p02-post-v2537-workbench-depth-20260919
      EXPECTED_SOURCE: a5345809631884ef8ba1b3181aebc81bb97e69af
    steps:
      - name: Require registered private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$PRIVATE_READ_TOKEN"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout exact P02 PR91 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Verify exact source identity
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = "2.5.37"
          echo "P02_PR91_EXACT_SOURCE=$EXPECTED_SOURCE"

      - name: Repository and unit gates
        working-directory: product
        run: |
          bash scripts/verify-repository.sh
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          node --check public/assets/app.js
          node --check public/assets/v2537-inkstone-shell.js
          git diff --check
          echo P02_PR91_REPOSITORY_AND_UNIT_GATE=PASS

      - name: Install Chromium harness
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Real Chromium UX gate
        working-directory: product
        run: |
          bash scripts/ux-browser-reverify.sh
          echo P02_PR91_REAL_CHROMIUM_GATE=PASS
