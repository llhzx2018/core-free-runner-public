name: P01 Scroll Sticky Authority Sync R2
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths:
      - .github/workflows/p01-scroll-sticky-authority-sync-r2-20260901.yml
      - scripts/p01-scroll-sticky-authority-sync.py
permissions:
  contents: read
  actions: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT: bd7f08b3fde91e4a20b0970deb5fec325e869159
      RUNTIME_TREE: f6ec50d94dd5023050ccf1aedc3df879603cb5db
      BRANCH: authority/p01-scroll-sticky-clarity-20260901
      MAIN_EXPECTED: 896723136e7535aa94d8d23deef39b892fd2f643
      EVID: /tmp/p01-scroll-sticky-authority-r2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact four-file Authority gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          cd p01
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$PRODUCT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_EXPECTED"
          python3 "$GITHUB_WORKSPACE/runner/scripts/p01-scroll-sticky-authority-sync.py"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          EXPECTED=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_SCROLL_STICKY_OVERLAP_FIX_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          ACTUAL="$(git status --short | sed 's/^...//' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git diff --name-only -- src)"
          test "$(jq -r .current_change.product_pr VF_PROJECT.json)" = 176
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.0
          test "$(jq -r .published_release.version VF_PROJECT.json)" = 2.36.2
          grep -F '共享滚动筛选条穿透修复' docs/authority/CURRENT.md >/dev/null
          grep -F 'DEVELOP ONLY / NOT RELEASED' docs/authority/CURRENT.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json docs/authority/CURRENT.md docs/handoff/CURRENT_STATE.md docs/evidence/P01_SCROLL_STICKY_OVERLAP_FIX_20260901.md
          git commit -m 'docs(P01): record shared sticky scroll fix'
          NEW=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$PRODUCT..$NEW" | sort)" = "$EXPECTED"
          git push origin HEAD:"refs/heads/$BRANCH"
          test "$(git ls-remote origin refs/heads/$BRANCH | awk '{print $1}')" = "$NEW"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$PRODUCT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_EXPECTED"
          printf 'P01_SCROLL_STICKY_AUTHORITY_SYNC_R2=PASS\nAUTHORITY=%s\nPRODUCT_PARENT=%s\nRUNTIME_TREE=%s\nFILES=4\nSRC_CHANGE=0\nMAIN_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$NEW" "$PRODUCT" "$RUNTIME_TREE" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-scroll-sticky-authority-r2-${{ github.run_id }}
          path: /tmp/p01-scroll-sticky-authority-r2
          if-no-files-found: warn
          retention-days: 30
