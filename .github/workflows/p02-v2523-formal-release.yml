name: P02 V2.5.23 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2523-formal-release.yml'
      - 'scripts/p02-v2523-formal-release.sh'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PRODUCT_REF: 523ace40df145d6fc96ff34639c277ce981d3ce0
    steps:
      - name: Require registered release capability
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          echo 'RELEASE_CAPABILITY=PASS'

      - name: Checkout fixed public runner definition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact promoted P02 main source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ env.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Rebuild verify publish and remote-readback V2.5.23
        shell: bash
        run: bash scripts/p02-v2523-formal-release.sh

      - name: Record protected boundary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'CORE_UPDATES_WRITE=NO_IN_THIS_JOB'
          echo 'PRODUCTION_WRITE=NO'
