name: P01 V2.24.0 Publication Readback
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-publication-readback-20260828.yml']
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_SOURCE: 867e3387b8efb70398287d05fd3652540efa77c8
      MAIN_MERGE: c299c313559bbb4f58d9a7180fb482fae7ced67a
      RELEASE_ID: '378353376'
      CORE_UPDATES: 8cbf4386c481e7fd658c0326cdaefa057da0b49e
      ASSET_SHA: 7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca
      ASSET_BYTES: '1210247'
    steps:
      - name: Authenticated final publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$MAIN_MERGE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.24.0 --jq .object.sha)" = "$RELEASE_SOURCE"
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.24.0 --jq .id)" = "$RELEASE_ID"
          gh api repos/llhzx2018/vf-start/releases/tags/v2.24.0 | jq -e --arg sha "$ASSET_SHA" --argjson bytes "$ASSET_BYTES" '.draft==false and .prerelease==false and .target_commitish=="867e3387b8efb70398287d05fd3652540efa77c8" and any(.assets[]; .name=="VF_Start_V2.24.0_UPDATE.zip" and .size==$bytes and .digest==("sha256:"+$sha))' >/dev/null
          CUR_UPDATES=$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          git -C updates merge-base --is-ancestor "$CORE_UPDATES" "$CUR_UPDATES"
          gh api 'repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' --jq .content | tr -d '\n' | base64 -d > /tmp/P01.json
          jq -e --arg sha "$ASSET_SHA" --argjson bytes "$ASSET_BYTES" '.enabled==true and .target_version=="2.24.0" and .from_versions==["2.23.0"] and .schema_from=="2026082801" and .schema_to=="2026082801" and .release_tag=="v2.24.0" and .release_id==378353376 and .asset_name=="VF_Start_V2.24.0_UPDATE.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .rollback_supported==true' /tmp/P01.json >/dev/null
          echo P01_V224_PUBLICATION=PASS
          echo ONLINE_UPGRADE_PUBLISHED=YES
          echo RELEASE_SOURCE=$RELEASE_SOURCE
          echo MAIN_MERGE=$MAIN_MERGE
          echo RELEASE_ID=$RELEASE_ID
          echo CORE_UPDATES_MAIN=$CUR_UPDATES
