name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-layout-save190-channel-20261025]
    paths: ['.github/workflows/s01-layout-save190-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.190
  TARGET_SHA: ad7a93087733fff7473fbcc198682367c17dc0bf
  UPDATE_SHA: c2ec9f3e12b25a5e302684af90a985c957de2d14
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: c2ec9f3e12b25a5e302684af90a985c957de2d14
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-layout-save190-20261025/channel-spec.json --input control/.github/workflows/s01-layout-save190-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          test "$(git -C source diff --name-only 91e6b71607bc87263c2f98cf177513c5995ea013 c2ec9f3e12b25a5e302684af90a985c957de2d14)" = projects/S01-C01.json
          git -C source diff --exit-code 91e6b71607bc87263c2f98cf177513c5995ea013 c2ec9f3e12b25a5e302684af90a985c957de2d14 -- projects/S01-C03.json
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='dd11bb243dfe8d9f7755666123a37d4ae66b8d1584a6a8e8ad433448cebe329c' and m['asset_bytes']==1996738
          assert m['runtime_files']==476 and '1.35.189' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
