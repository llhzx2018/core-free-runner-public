name: P01 V247351 Core Updates Exact-Manifest CI (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247351-core-updates-ci.yml'
permissions:
  contents: read
jobs:
  core-updates-ci:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact distribution proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 0e528d86c97212746bddc4df7c25b45abe90d93f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare compatible PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip
          coverage: none
      - name: Assert exact P01 distribution identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 0e528d86c97212746bddc4df7c25b45abe90d93f
          jq -e '.project_id=="P01" and .current_version=="2.47.350" and .target_version=="2.47.351" and .release_tag=="v2.47.351" and .product_identity=="23f1b838f66d41fec8534e1bb69f900e8c784ead" and .asset_bytes==2456722 and .asset_sha256=="56b9f4db92a27606120a6f698daa436c4aa929226ea06da41436936d9434ce9c" and .from_versions==["2.47.350"]' projects/P01.json >/dev/null
          echo P01_EXACT_UPDATE_MANIFEST_IDENTITY=PASS
      - name: Execute canonical manifest contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py | tee /tmp/p01-update-manifest-contract.json
          jq -e '.status=="PASS"' /tmp/p01-update-manifest-contract.json >/dev/null
          echo P01_UPDATE_MANIFEST_CONTRACT=PASS
      - name: Execute PHP syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/tmp/p01-update-php-lint.log
          test -s /tmp/p01-update-php-lint.log
          echo P01_UPDATE_PHP_SYNTAX=PASS
      - name: Execute Update Core regression
        shell: bash
        run: |
          set -Eeuo pipefail
          php update-core/php/tests/run.php | tee /tmp/p01-update-core-test.log
          echo P01_UPDATE_CORE_REGRESSION=PASS
