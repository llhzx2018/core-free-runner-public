name: P07 release96 sealed formal publication (manual archive)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p07-release96-formal-publication
  cancel-in-progress: false
jobs:
  publish:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_REPO: llhzx2018/core-free-runner-public
      RELEASE_TAG: p07-v0.1.0-release96
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact merged bytes and fail-closed trust chain
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo P07_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/git/ref/heads/main --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_MAIN_MOVED; exit 78; }
          root=dist/p07/0.1.0/overlay
          care=packages/p07-system-care/0.1.0-rc65
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release96'
          test "$(cat "$care/VERSION")" = '0.1.0-rc65'
          test "$(git hash-object "$root/RUNTIME.gitblob")" = ce75abecef579b84ae015cea76d7533b16cd441a
          test "$(git hash-object "$root/MANIFEST.gitblob")" = c99917d597aa847c49db76b311f9651bd7642fb3
          test "$(git hash-object "$care/MANIFEST.gitblob")" = 86c1eee3476c26761cf65779182ce939794b58de
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < RUNTIME.gitblob)
          (cd "$root"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          (cd "$care"; while read -r sha file; do test "$(git hash-object "$file")" = "$sha"; done < MANIFEST.gitblob)
          test "$(git hash-object installers/p07-final.sh)" = 212b6787d153284991f6f614ebf8cb179e792d93
          test "$(git hash-object installers/p07.sh)" = da98ecdccc94d9f373d946c797aff4f14cec3db2
          test "$(git hash-object installers/p07-toolbox.sh)" = eb7f65af7791c596d42cbb031200af7ed4e62f4b
          test "$(git hash-object installers/p07-system-care.sh)" = f9753ae17d78454c5e733124484a065668683a5d
          grep -Fq 'EXPECTED_BLOB="212b6787d153284991f6f614ebf8cb179e792d93"' installers/p07.sh
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release96"' installers/p07-final.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="ce75abecef579b84ae015cea76d7533b16cd441a"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release96"' installers/p07-toolbox.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc65"' installers/p07-toolbox.sh
          grep -Fq "MANIFEST_BLOB='86c1eee3476c26761cf65779182ce939794b58de'" installers/p07-system-care.sh
          bash -n installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          echo P07_RELEASE96_EXACT_MERGED_PREFLIGHT_PASS
      - name: Formal GitHub release with exact target readback
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$RELEASE_TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA" || { echo P07_RELEASE_TAG_COLLISION; exit 81; }
          else
            gh release create "$RELEASE_TAG" -R "$RELEASE_REPO" --target "$GITHUB_SHA" \
              --title 'P07 · release96 · 正式网站数据工具与 System Care rc65' \
              --notes 'P07 release96 / System Care rc65. Exact private candidate 3ebaca86b6e321f479d2ea29fb36be4c7922f6e0; merged private source main 577d108e406562b1ede5c4fa338efe770f3c0fd0 carries the same candidate tree. Disposable real MySQL 8.4 → MariaDB 11.8 verification with 84 schema and 9 data tables PASS; strict full SQL equivalence checks preserve all structural and row differences, normalize only default integer display widths and known high-version session SETs, and block altered data, indexes, collations, triggers or unknown guarded SQL. Exact-source migration and package regression tests PASS; isolated clean install, release95 to release96 upgrade, idempotency, corrupt-download rejection, and rollback PASS. Strict known-format full SQL fingerprint retains every schema object, conditional ALTER, row literal and index. Unknown SQL differences still block. No old CP/CP2/DNS changes. Production CP2 manual upgrade, migration resume, and DNS cutover remain separate OWNER gates.'
          fi
          test "$(gh api repos/$RELEASE_REPO/git/ref/tags/$RELEASE_TAG --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.draft')" = false
          test "$(gh api repos/$RELEASE_REPO/releases/tags/$RELEASE_TAG --jq '.prerelease')" = false
          echo P07_RELEASE96_GITHUB_RELEASE_PASS
      - name: Upload exact installer assets and read back identities
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" -R "$RELEASE_REPO" --clobber installers/p07.sh installers/p07-final.sh installers/p07-toolbox.sh installers/p07-system-care.sh
          mkdir -p /tmp/p07-release96-assets
          gh release download "$RELEASE_TAG" -R "$RELEASE_REPO" --dir /tmp/p07-release96-assets
          for name in p07.sh p07-final.sh p07-toolbox.sh p07-system-care.sh; do
            test -f "/tmp/p07-release96-assets/$name"
            test "$(git hash-object "/tmp/p07-release96-assets/$name")" = "$(git hash-object "installers/$name")"
          done
          echo P07_RELEASE96_ASSET_READBACK_PASS
      - name: Public installer raw-byte distribution readback
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="https://raw.githubusercontent.com/$RELEASE_REPO/$GITHUB_SHA"
          for item in 'installers/p07.sh da98ecdccc94d9f373d946c797aff4f14cec3db2' 'installers/p07-final.sh 212b6787d153284991f6f614ebf8cb179e792d93' 'installers/p07-toolbox.sh eb7f65af7791c596d42cbb031200af7ed4e62f4b' 'installers/p07-system-care.sh f9753ae17d78454c5e733124484a065668683a5d' 'dist/p07/0.1.0/overlay/RUNTIME.gitblob ce75abecef579b84ae015cea76d7533b16cd441a'; do
            read -r file sha <<< "$item"
            curl -fsSL --retry 5 --retry-delay 2 --proto '=https' --tlsv1.2 "$remote/$file" -o /tmp/p07-release96-remote
            test "$(git hash-object /tmp/p07-release96-remote)" = "$sha"
          done
          echo P07_RELEASE96_REMOTE_DISTRIBUTION_READBACK_PASS
