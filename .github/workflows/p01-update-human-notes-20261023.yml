name: P01 Update human notes UX one-shot
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-update-human-notes-20261023.yml'
permissions:
  contents: read
jobs:
  scoped:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: 3512884cd816834f7893969780082bd6b47611a8
      REPO: llhzx2018/vf-start
    steps:
      - name: Prepare PHP and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd,openssl
          coverage: none
      - name: Checkout exact private candidate temporarily
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C candidate remote remove origin
          echo P01_EXACT_MANAGED_EDITOR_SOURCE=PASS
      - name: Node and PHP real update-notes renderer regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          node --check src/assets/update-core.js
          node --check tests/unit/update_release_notes_progressive_native.cjs
          node tests/unit/update_release_notes_progressive_native.cjs
          php -l tests/unit/update_release_notes_progressive_native.php
          php tests/unit/update_release_notes_progressive_native.php
          echo P01_UPDATE_HUMAN_NOTES_SCOPED_GATE=PASS
      - name: Cleanup transient private checkout
        if: always()
        run: |
          rm -rf candidate
          echo P01_PRIVATE_SOURCE_TEMP_CLEANUP=PASS
