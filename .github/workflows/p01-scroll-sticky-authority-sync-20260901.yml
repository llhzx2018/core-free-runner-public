name: P01 Scroll Sticky Authority Sync
on:
  push:
    branches: [release/p01-v2362-candidate-20260901]
    paths: [.github/workflows/p01-scroll-sticky-authority-sync-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT: bd7f08b3fde91e4a20b0970deb5fec325e869159
      PRODUCT_TREE: f3eb1ab9f8c5a6ea6a66cf4374a6fa5dc25b19d7
      RUNTIME_TREE: f6ec50d94dd5023050ccf1aedc3df879603cb5db
      BRANCH: authority/p01-scroll-sticky-clarity-20260901
      MAIN_EXPECTED: 896723136e7535aa94d8d23deef39b892fd2f643
      EVID: /tmp/p01-scroll-sticky-authority
    steps:
      - name: Checkout exact Authority branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Build exact four-file Authority sync
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$EVID"; mkdir -p "$EVID"
          cd p01
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$PRODUCT"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$MAIN_EXPECTED"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          evidence='''# P01 · Shared Sticky Filter Scroll Overlap Fix · 2026-09-01

## Verdict

**PASS / MERGED TO DEVELOP / NOT RELEASED**

This is a post-V2.36.2 L2 Product bug fix. It does not alter the already published V2.36.2 Tag/Release and does not write Owner Production.

## User-visible defect

The shared filter/tab toolbar on `start.php`, `channels.php`, `watch.php`, and `topics.php` became visually broken while scrolling: cards and text appeared to pass underneath and through the controls.

## Root cause

`src/assets/workspace-domain-nav.css` overrode the shared sticky `.vf-workspace-toolbar` with:

- `background: transparent`;
- desktop `top: calc(var(--ws-domain-nav) + var(--ws-topbar) + 8px)`.

The toolbar therefore had no opaque paint layer, and desktop also left an 8px exposed gap between the search/subbar and the sticky filter strip.

## Fresh Runtime diagnostic

- Exact Source: `4ec93adad93977a519675b55806866c896bad09f`
- Diagnostic Run: `33491021229` — PASS
- Artifact: `9793757582`
- Digest: `sha256:93848135fbd3a141a0dc836cfdc37e25eb07ec78937b1acb9128056e5f9860d4`
- Dataset: 96 navigation links, 48 channels, 48 watch items, 40 topics, 8 categories.
- Browser matrix: 390 + 1440, all four routes, top/mid/deep scroll positions.
- Horizontal overflow: 0.
- Reproduced computed toolbar background: fully transparent.
- Reproduced desktop sticky gap: 8px.

## Product fix

Exact Product Candidate: `ee568178804bf8c98abcf4b85f4dc20939712070`.

Exact Product scope:

- `src/assets/workspace-domain-nav.css`

Change:

- keep the filter toolbar sticky;
- use opaque `var(--ws-bg)` background;
- remove the desktop 8px sticky gap;
- do not redesign cards, navigation, or page structure.

## Machine Gate

- Fix Gate Run: `33491546225` — PASS
- Artifact: `9793960558`
- Digest: `sha256:ce5c98f1511c7d90b93468d763d26d7a7e5235a2e9db180ee63e2ef684c6c2df`
- 390 + 1440 / Start + Channels + Watch + Topics / mid + deep scroll: PASS.
- Toolbar background opaque: PASS.
- Desktop toolbar top equals subbar bottom: PASS.
- Mobile toolbar top equals global domain-nav bottom: PASS.
- Horizontal overflow: PASS.
- SQLite integrity / foreign keys: PASS.
- Gate screenshots were visually reread; the bleed-through is no longer present.

## Merge truth

- Product PR: `#176`
- develop merge: `bd7f08b3fde91e4a20b0970deb5fec325e869159`
- Repository Tree: `f3eb1ab9f8c5a6ea6a66cf4374a6fa5dc25b19d7`
- Runtime Tree: `f6ec50d94dd5023050ccf1aedc3df879603cb5db`
- Schema / Migration / Version: unchanged.
- `main`: unchanged by this Product fix.
- Tag / GitHub Release / core-updates / Owner Production: no write.

## Release boundary

Published Latest remains V2.36.2. Owner Production remains V2.36.0, with the safe live online next hop still V2.36.1. This L2 fix is currently **develop-only / not released**.
'''
          (root/'docs/evidence/P01_SCROLL_STICKY_OVERLAP_FIX_20260901.md').write_text(evidence,encoding='utf-8')

          section='''<!-- P01_SCROLL_STICKY_OVERLAP_FIX -->
