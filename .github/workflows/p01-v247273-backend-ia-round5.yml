name: P01 V2.47.273 Backend IA Round 5 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247273-backend-ia-round5.yml"

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.273 backend IA round 5')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin a156e8fc1e27dcc1037d54165f9061eac6d1fab8
          git -C candidate checkout -q --detach a156e8fc1e27dcc1037d54165f9061eac6d1fab8
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.273"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.273"
          grep -F "define('VF_VERSION', '2.47.273');" candidate/src/app/bootstrap.php

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 04561ab9198a70559049ab7cfb4d1c376871f643
          git -C baseline checkout -q --detach 04561ab9198a70559049ab7cfb4d1c376871f643
          test "$(tr -d '\r\n ' < baseline/VERSION)" = "2.47.272"
          echo P01_V247273_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/system-health.php
          php -l candidate/src/jobs.php
          php -l candidate/src/plugins.php
          php -l candidate/src/workbench.php
          php -l candidate/tests/unit/backend_ia_round5_system_v247273_contract.php
          node --check candidate/src/assets/system.js
          node --check candidate/src/assets/jobs.js
          node --check candidate/src/assets/plugins-admin.js
          echo P01_V247273_SYNTAX=PASS

      - name: Focused Round 5 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          tests=(
            tests/unit/backend_ia_round5_system_v247273_contract.php
            tests/unit/admin_system_health_r18_contract.php
            tests/unit/admin_system_health_page9_polish_contract.php
            tests/unit/system_health_cron_diagnostic_contract.php
            tests/unit/system_health_runtime_r7_contract.php
            tests/unit/admin_scheduled_tasks_center_contract.php
            tests/unit/admin_plugins_r17_contract.php
            tests/unit/admin_plugins_page10_polish_contract.php
            tests/unit/admin_plugins_dead_nav_r40_contract.php
            tests/unit/admin_workbench_shadow_config_r38_contract.php
            tests/unit/admin_workbench_copy_r41_contract.php
            tests/unit/admin_diagnose_entry_closure_r1_contract.php
            tests/unit/admin_system_info_r22_contract.php
            tests/unit/admin_system_baseline_r25_contract.php
            tests/unit/admin_system_closure_contract.php
            tests/unit/admin_system_group_polish_r69_contract.php
            tests/unit/admin_system_group_readability_r82_contract.php
            tests/unit/admin_navigation_consistency_contract.php
          )
          for t in "${tests[@]}"; do php "$t"; done
          echo P01_V247273_FOCUSED=PASS

      - name: Inventory current unit failures
        shell: bash
        run: |
          set -Eeuo pipefail
          failures=0
          while IFS= read -r t; do
            if ! out="$(php "$t" 2>&1)"; then
              echo "CURRENT_UNIT_FAILURE=${t#candidate/}"
              printf '%s\n' "$out" | tail -n 12
              failures=$((failures+1))
            fi
          done < <(find candidate/tests/unit -maxdepth 1 -type f -name '*.php' | sort)
          echo "CURRENT_UNIT_FAILURE_COUNT=$failures"

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247273_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 04561ab9198a70559049ab7cfb4d1c376871f643..a156e8fc1e27dcc1037d54165f9061eac6d1fab8 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo BACKEND_IA_ROUND5=YES
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
