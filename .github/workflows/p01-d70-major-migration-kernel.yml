name: P01 D70 major migration durable crash rollback kernel
on:
  push:
    branches:
      - test/p01-d70-major-migration-kernel-20261113
permissions:
  contents: read
jobs:
  offline-transaction-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Checkout exact candidate ephemeral private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 36f9841301575a5e0778b36f8ebf1e081338d2f4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify exactly targeted PR and no Production
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d70-major-migration-kernel-20261113"
          test "$(git -C candidate rev-parse HEAD)" = "36f9841301575a5e0778b36f8ebf1e081338d2f4"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/runtime/MajorMigrationTransaction.php
          echo "P01_D70_EXACT_PRODUCT_SHA=36f9841301575a5e0778b36f8ebf1e081338d2f4"
      - name: Test real PHP CLI 8.3 and durable journal native fault matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v | head -n 1
          php -l candidate/src/app/next/runtime/MajorMigrationTransaction.php
          php -l candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php
          if ! P01_D70_ISOLATED_MIGRATION=YES php             candidate/tests/compatibility/laravel/run_d70_major_migration_transaction.php             matrix 94df026d9bab668b15c9f5f75cd0c0fe57abbb48 36f9841301575a5e0778b36f8ebf1e081338d2f4 > "$RUNNER_TEMP/p01-d70-matrix.txt" 2>&1; then
            grep '^P01_D70_' "$RUNNER_TEMP/p01-d70-matrix.txt" | tail -n 35 || true
            # This fixture has no real Owner data, paths or credentials.
            # Print only bounded developer-owned failure classes.
            grep -E 'D70_PROOF_[A-Z0-9_]+|D70 migration|Fatal error|Uncaught|Parse error' "$RUNNER_TEMP/p01-d70-matrix.txt" | cut -c1-170 | tail -n 8 || true
            exit 1
          fi
          grep '^P01_D70_' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_TRANSACTION_SUCCESS_SNAPSHOT_STAGE_CUTOVER=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_PRE_SWITCH_BAD_SNAPSHOT_AND_STAGE_BLOCKED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_FAILED_HEALTH_OLD_SITE_RESTORED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_FAILED_ROLLBACK_STAYS_RECOVERY_REQUIRED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_LOCKED_REPLAY_IDEMPOTENCE=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_TAMPERED_DURABLE_JOURNAL_FAIL_CLOSED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_FALSE_SIGNED_RELEASE_PROOF_REFUSED=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_ACTUAL_PROCESS_EXIT_88_AND_OLD_RECOVERY=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_MAJOR_MIGRATION_TRANSACTION_NATIVE_MATRIX=PASS' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_REAL_CLOUDPANEL_PRIVILEGED_DOCROOT=NOT_PROVEN' "$RUNNER_TEMP/p01-d70-matrix.txt"
          grep -Fx 'P01_D70_OLD_OWNER_CLICK_WORKER=NOT_PROVEN' "$RUNNER_TEMP/p01-d70-matrix.txt"
          echo 'P01_D70_NATIVE_TX_MACHINE_PROVEN=YES'
      - name: Always remove private checkout and disposable transcripts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d70-matrix.txt"
          echo "P01_D70_PUBLIC_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_D70_PUBLIC_ARTIFACTS=NONE"
