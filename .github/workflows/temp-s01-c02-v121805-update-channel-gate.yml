name: TEMP S01-C02 Ops 1.21.805 Update Channel Gate
on:
  push:
    branches: [temp/s01-c02-v121805-update-channel-gate-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121805-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CORE_SHA: d044db4abb9e7bc7664263195cfe39fbde8c1b09
      OPS_SHA: d533ad1226bd074fa4c275b55d544651c94d6dd8
      OPS_TREE: 9f9f5165fcbbfe0b6f003f6c6d124dd1f5329f00
      RELEASE_ID: '382824688'
      ASSET_ID: '544514825'
      ASSET_NAME: vf-tools-ops_V1.21.805.zip
      ASSET_BYTES: '3210653'
      ASSET_SHA256: 26bc0c032831ccae94d478f83ed6527c9204be3a83c08296ee52d6c424b3ac06
      RUNTIME_FILES: '898'
      RUNTIME_FP: 19b4c105982032ef5b657a01ae94cdb022752a3207829bd8af9f2f9cbfc50024
    steps:
      - name: Checkout exact update authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates
      - name: UpdateCore and manifest gate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CORE_SHA"
          M="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/core-updates/branches/main')"
          test "$(jq -r .commit.sha <<<"$M")" = "$CORE_SHA"
          jq empty updates/projects/S01-C02.json
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          F=updates/projects/S01-C02.json
          jq -e --arg sha "$ASSET_SHA256" --arg fp "$RUNTIME_FP" '
            .schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .component_type=="PLUGIN" and
            .target_version=="1.21.805" and .from_versions==["1.21.804"] and .release_tag=="v1.21.805" and
            .asset_name=="vf-tools-ops_V1.21.805.zip" and .asset_bytes==3210653 and .asset_sha256==$sha and
            .runtime_files==898 and .runtime_fingerprint==$fp and .runtime_file_count==898 and .runtime_fingerprint_sha256==$fp and
            .schema_from=="6.0.0" and .schema_to=="6.0.0" and .minimum_wordpress=="6.5" and .minimum_php=="8.2" and
            .backup_required==true and .rollback_supported==true and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false
          ' "$F" >/dev/null
          grep -Fq 'Candidate Gate run 33888225847 PASS' "$F"
          grep -Fq 'Formal Release run 33888621263 PASS' "$F"
          echo UPDATECORE_AND_MANIFEST=PASS
      - name: Exact release and artifact readback
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          R="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.805')"
          test "$(jq -r .id <<<"$R")" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$R")" = "$ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$R")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$R")" = "sha256:${ASSET_SHA256}"
          T="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.805')"
          test "$(jq -r .object.sha <<<"$T")" = "$OPS_SHA"
          C="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/git/commits/${OPS_SHA}")"
          test "$(jq -r .tree.sha <<<"$C")" = "$OPS_TREE"
          curl -fsSL -L --retry 3 -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/octet-stream' "https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/assets/${ASSET_ID}" -o /tmp/$ASSET_NAME
          test "$(stat -c '%s' /tmp/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/$ASSET_NAME|awk '{print $1}')" = "$ASSET_SHA256"
          unzip -tq /tmp/$ASSET_NAME >/dev/null
          unzip -p /tmp/$ASSET_NAME vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.805'
          unzip -p /tmp/$ASSET_NAME vf-ops/includes/site-release/s01-static-candidate-readiness.php | grep -Fq 'saved_snapshot_lightweight_batch_identity'
          unzip -p /tmp/$ASSET_NAME vf-ops/includes/site-release/s01-static-candidate-readiness.php | grep -Fq 'publishPreflightBasis'
          unzip -p /tmp/$ASSET_NAME vf-ops/includes/site-release/s01-project-authority.runtime.json | jq -e '.search_analytics.final_public_host=="https://ilovem3u8.com"' >/dev/null
          echo RELEASE_ASSET_EXACT=PASS
      - name: Direct source fail-closed gate
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('updates/projects/S01-C02.json'))
          assert p['from_versions']==['1.21.804']
          for old in ['1.21.797','1.21.798','1.21.799','1.21.800','1.21.801','1.21.802','1.21.803']:
              assert old not in p['from_versions']
          assert p['target_version']=='1.21.805'
          print('DIRECT_SOURCE_1_21_804_ONLY=PASS')
          PY
          echo PASS_V121805_UPDATE_CHANNEL_GATE
