name: P01 V2.26.0 Publication Closure
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-publication-closure-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SOURCE: c97a362fc574cd80349526fca016f9e0e6a9c472
      RELEASE_TREE: 784fbbb4b3612145cdfa424659ddc6e843d3694b
      MAIN_SHA: d009e398fbc5a08a3de10e0daf31c988f49186bf
      RELEASE_ID: '378415773'
      CORE_UPDATES: 62122ef87df05b2859d75d561ba1a420d26d3047
      ASSET_NAME: VF_Start_V2.26.0_UPDATE.zip
      ASSET_BYTES: '1216272'
      ASSET_SHA: 7fc55c6dc68aacdad53796b13fa11371a7e1e8ad1e88ee439c31beaa2f981158
    steps:
      - name: Authenticated remote closure readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git -C product rev-parse "$MAIN_SHA^{tree}")" = "$RELEASE_TREE"
          test "$(git -C product rev-parse refs/tags/v2.26.0)" = "$RELEASE_SOURCE"
          test "$(git -C product rev-parse "$RELEASE_SOURCE^{tree}")" = "$RELEASE_TREE"
          test "$(git -C product show "$MAIN_SHA:VERSION"|tr -d '\r\n')" = 2.26.0
          REL=$(gh api "repos/llhzx2018/vf-start/releases/$RELEASE_ID")
          test "$(jq -r '.tag_name' <<<"$REL")" = v2.26.0
          test "$(jq -r '.target_commitish' <<<"$REL")" = "$RELEASE_SOURCE"
          test "$(jq -r '.draft' <<<"$REL")" = false
          test "$(jq -r '.prerelease' <<<"$REL")" = false
          ASSET=$(jq -c --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)' <<<"$REL")
          test -n "$ASSET"
          test "$(jq -r '.size' <<<"$ASSET")" = "$ASSET_BYTES"
          test "$(jq -r '.digest' <<<"$ASSET")" = "sha256:$ASSET_SHA"
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          test "$(git -C updates rev-parse origin/main)" = "$CORE_UPDATES"
          jq -e --arg rid "$RELEASE_ID" --arg sha "$RELEASE_SOURCE" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '.target_version=="2.26.0" and .from_versions==["2.25.0"] and .schema_from=="2026082801" and .schema_to=="2026082801" and .release_tag=="v2.26.0" and .asset_name=="VF_Start_V2.26.0_UPDATE.zip" and .asset_bytes==$ab and .asset_sha256==$ah and (.release_id|tostring)==$rid and .release_identity==("v2.26.0@"+$sha) and .backup_required==true and .rollback_supported==true' updates/projects/P01.json >/dev/null
          rm -rf /tmp/p01-v226-closure; mkdir -p /tmp/p01-v226-closure
          gh release download v2.26.0 -R llhzx2018/vf-start -p "$ASSET_NAME" -D /tmp/p01-v226-closure
          test "$(stat -c %s /tmp/p01-v226-closure/$ASSET_NAME)" = "$ASSET_BYTES"
          test "$(sha256sum /tmp/p01-v226-closure/$ASSET_NAME|awk '{print $1}')" = "$ASSET_SHA"
          test "$(unzip -Z1 /tmp/p01-v226-closure/$ASSET_NAME)" = 'repair-v2.26.0.php'
          echo P01_V226_PUBLICATION_CLOSURE=PASS
          echo OWNER_PRODUCTION_UPGRADE=PENDING
