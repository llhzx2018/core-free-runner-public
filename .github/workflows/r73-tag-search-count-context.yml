name: R73 Focused Tag Search Count Context Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r73-tag-search-count-context.yml'

permissions:
  contents: read

jobs:
  r73-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 58cc36303e18d8b6d2c503b142f07a8589c26a47
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 58cc36303e18d8b6d2c503b142f07a8589c26a47
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/tag_search_count_context_contract.php
          php tests/unit/tag_search_count_context_contract.php
          php tests/unit/watch_status_context_badge_contract.php
          php tests/unit/start_favorite_sort_reset_contract.php
          echo R73_TAG_SEARCH_COUNT_CONTEXT_PASS
          echo R73_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
