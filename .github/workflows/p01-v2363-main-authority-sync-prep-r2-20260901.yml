name: P01 V2.36.3 Main Authority Sync Prep R2
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-main-authority-sync-prep-r2-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      DEVELOP_CLOSURE: f0a54a43af8614426995dc3894ccedfd919be8ac
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      BRANCH: docs/p01-v2363-main-authority-sync-20260901
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      AUTHORITY_GATE: '33505729408'
      EVID: /tmp/p01-v2363-main-authority-sync-prep-r2
    steps:
      - name: Checkout exact product main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: main
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Materialize exact four-file authority snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          exec > >(tee "$EVID/log.txt") 2>&1
          echo 'phase=live-fence'
          test "$(git rev-parse HEAD)" = "$PRODUCT_MAIN"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$PRODUCT_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$DEVELOP_CLOSURE"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$AUTHORITY_GATE --jq .conclusion)" = success

          echo 'phase=source-objects'
          git fetch origin "$DEVELOP_CLOSURE" --quiet
          files=(
            VF_PROJECT.json
            docs/authority/CURRENT.md
            docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md
            docs/handoff/CURRENT_STATE.md
          )
          for f in "${files[@]}"; do
            echo "source-check=$f"
            git cat-file -e "$DEVELOP_CLOSURE:$f"
          done
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          snapshot_diff="$(git diff --name-only "$PRODUCT_MAIN" "$DEVELOP_CLOSURE" | sort)"
          printf 'snapshot-diff:\n%s\n' "$snapshot_diff"
          test "$snapshot_diff" = "$expected"

          echo 'phase=branch-fence'
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "remote-target-branch-already-exists=$BRANCH"
            exit 1
          fi
          git switch -c "$BRANCH"

          echo 'phase=materialize'
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "$DEVELOP_CLOSURE:$f" > "$f"
            echo "materialized=$f bytes=$(stat -c %s "$f")"
          done

          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u )"
          printf 'working-scope:\n%s\n' "$actual"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only -- src)"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --check

          echo 'phase=stage'
          git add "${files[@]}"
          staged="$(git diff --cached --name-only | sort)"
          printf 'staged-scope:\n%s\n' "$staged"
          test "$staged" = "$expected"
          test -z "$(git diff --cached --name-only -- src)"

          echo 'phase=commit-push'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m "docs(P01): sync V2.36.3 release authority to main"
          SYNC_COMMIT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_MAIN"
          test "$(git rev-parse HEAD^:src)" = "$RUNTIME_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$expected"
          git push origin "$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$SYNC_COMMIT"
          printf 'P01_V2363_MAIN_AUTHORITY_SYNC_PREP_R2=PASS\nBASE_MAIN=%s\nDEVELOP_CLOSURE=%s\nSYNC_COMMIT=%s\nSRC_TREE=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$PRODUCT_MAIN" "$DEVELOP_CLOSURE" "$SYNC_COMMIT" "$RUNTIME_TREE" | tee "$EVID/verdict.txt"
      - name: Upload prep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-main-authority-sync-prep-r2-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
