name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-article-runtime188-20261025]
    paths: ['.github/workflows/s01-article-runtime188-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.188
  TARGET_SHA: 9c8877792e4af5aef2be1409ee3648c560452d89
  UPDATE_SHA: 84ce28a84200531fbac2730274caa18572e4947d
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 84ce28a84200531fbac2730274caa18572e4947d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-runtime188-20261025/channel-spec.json --input control/.github/workflows/s01-article-runtime188-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='f45493df564197cb512acbbb35049d87651adc7273a4f36a4c129793e161a3f6' and m['asset_bytes']==1994445
          assert m['runtime_files']==476 and '1.35.187' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
