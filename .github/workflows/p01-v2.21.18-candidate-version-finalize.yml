name: P01 V2.21.18 Candidate Version Finalize
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.18-candidate-version-finalize.yml']
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPO: llhzx2018/vf-start
      BRANCH: candidate/v2.21.18-20260819
      EXPECTED_HEAD: 036133af9865cf19b508373b8932891717239cc8
      RESULT: P01-V2.21.18-CANDIDATE-VERSION-FINALIZE
    steps:
      - name: Finalize exact candidate identity
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"; test -n "$WRITE_TOKEN"
          git clone -q --depth 1 --branch "$BRANCH" "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" candidate
          cd candidate
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '2.21.18'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.21.18'
          grep -F "define('VF_VERSION', '2.21.17');" src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text()
          old="define('VF_VERSION', '2.21.17');"
          new="define('VF_VERSION', '2.21.18');"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add src/app/bootstrap.php
          git commit -q -m 'chore(P01): align runtime identity to V2.21.18 candidate'
          NEW_SHA=$(git rev-parse HEAD)
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/${REPO}.git"
          git push -q origin "HEAD:${BRANCH}"
          printf '%s' "$NEW_SHA" > /tmp/new-sha
          git rev-parse HEAD^{tree} > /tmp/new-tree
      - name: Publish sanitized verdict
        if: always()
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          def r(p):
            try:return open(p).read().strip()
            except:return ''
          payload={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.18','gate':'CANDIDATE_VERSION_FINALIZE','status':os.environ['JOB_STATUS'].upper(),'pass':os.environ['JOB_STATUS']=='success','candidate_sha':r('/tmp/new-sha'),'candidate_tree':r('/tmp/new-tree'),'workflow_run_id':os.environ['RUN_ID'],'private_data_persisted_publicly':False}
          token=os.environ['WRITE_TOKEN']; path='vf-agent/results/P01-V2.21.18-CANDIDATE-VERSION-FINALIZE.json'; api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/'+path; h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x: sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404: raise
          body={'message':'evidence(P01): publish V2.21.18 candidate identity','content':base64.b64encode((json.dumps(payload,indent=2,sort_keys=True)+'\n').encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha: body['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY