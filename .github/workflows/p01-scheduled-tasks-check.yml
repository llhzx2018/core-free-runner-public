name: p01-scheduled-tasks-check

on:
  pull_request:
    paths:
      - '.github/workflows/p01-scheduled-tasks-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      TARGET_SHA: bc802603c266501d0815646175e13af66e041a82
      BASE_SHA: cd176611a24be2dd90155ce84b6b89fab2915150
    steps:
      - name: Checkout runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact P01 candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" candidate
          git -C candidate fetch -q --depth 1 origin "$TARGET_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" stable
          git -C stable fetch -q --depth 1 origin "$BASE_SHA"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C stable rev-parse HEAD)" = "$BASE_SHA"

      - name: Prepare PHP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd unzip >/dev/null

      - name: Focused scheduled-task contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(
            tests/unit/admin_scheduled_tasks_center_contract.php
            tests/unit/admin_secondary_nav_focus_contract.php
            tests/unit/admin_retired_routes_css_r32_contract.php
            tests/unit/admin_system_capabilities_r62_contract.php
            tests/unit/admin_system_group_polish_r69_contract.php
            tests/unit/admin_backend_coverage_r60_contract.php
            tests/unit/system_health_cron_diagnostic_contract.php
            tests/unit/system_health_cron_runtime_proof.php
          )
          for t in "${tests[@]}"; do php "candidate/$t"; done
          echo P01_SCHEDULED_TASKS_FOCUSED=PASS

      - name: Canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-scheduled-tasks-canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/p01-scheduled-tasks-canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/p01-scheduled-tasks-canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/p01-scheduled-tasks-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-scheduled-tasks-canonical.txt
          echo P01_SCHEDULED_TASKS_CANONICAL=PASS
