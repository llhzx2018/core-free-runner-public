name: P08 R16 Temporary Workflow Parse Check
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r16-validate-oneoff.yml'
      - '.github/workflows/p08-r15-simple-kuma-sandbox-oneoff.yml'
permissions:
  contents: read
jobs:
  yaml-parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse target temporary workflow with YAML
        run: |
          python3 -m pip install -q PyYAML
          python3 - <<'PY'
          import yaml
          path='.github/workflows/p08-r15-simple-kuma-sandbox-oneoff.yml'
          with open(path) as f: result=yaml.safe_load(f)
          assert 'jobs' in result and 'kuma-local-real' in result['jobs']
          print('P08_R16_TEMP_WORKFLOW_YAML_PARSE_PASS')
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -oneline -shellcheck= \
            .github/workflows/p08-r15-simple-kuma-sandbox-oneoff.yml
