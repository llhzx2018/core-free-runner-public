name: p01-archive-migration-closure-r1-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-archive-migration-closure-r1-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 617f21d753d43fe7bc4e89f24aeb287f2a9d57af
      TARGET_SHA: ef97e46b9d59bc1751bfccd62301ddb0ee1d5cdf
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "${name}"
          done
          git -C baseline fetch -q --depth 1 origin "${BASE_SHA}"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "${TARGET_SHA}"
          git -C current checkout -q --detach FETCH_HEAD
          test "$(git -C current rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.65"
          echo P01_ARCHIVE_MIGRATION_CLOSURE_R1_EXACT_SOURCE=PASS

      - name: Verify bounded diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort >/tmp/actual.txt
          cat >/tmp/expected.txt <<'EOF'
          src/api.php
          src/app/DataSafety.php
          src/assets/admin-consolidation.css
          src/assets/recycle-bin.js
          src/recycle-bin.php
          tests/unit/admin_recycle_bin_page6_polish_contract.php
          tests/unit/recycle_archive_migration_closure_contract.php
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo P01_ARCHIVE_MIGRATION_CLOSURE_R1_BOUNDED_DIFF=PASS

      - name: Syntax and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l current/src/app/DataSafety.php >/dev/null
          php -l current/src/api.php >/dev/null
          php -l current/src/recycle-bin.php >/dev/null
          node --check current/src/assets/recycle-bin.js
          tests=(
            tests/unit/recycle_archive_migration_closure_contract.php
            tests/unit/admin_recycle_bin_page6_polish_contract.php
            tests/unit/admin_recycle_bin_r11_contract.php
            tests/unit/admin_recycle_bin_r12_pagination_contract.php
            tests/unit/recycle_bin_admin_return_contract.php
            tests/unit/recycle_bin_direct_open_contract.php
            tests/unit/recycle_mobile_card_labels_contract.php
            tests/unit/session_csrf_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/${t}" >/dev/null
            php "current/${t}"
          done
          echo P01_ARCHIVE_MIGRATION_CLOSURE_R1_FOCUSED=PASS

      - name: Canonical zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_CURRENT_FAILURE_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_NEW_REGRESSION_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_ARCHIVE_MIGRATION_CLOSURE_R1_CANONICAL=PASS
