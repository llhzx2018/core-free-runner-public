name: P01 V2.31 Main Promotion
on:
  push:
    branches: [task/p01-v2310-formal-release-20260829]
    paths: [.github/workflows/p01-v2310-main-promotion-20260829.yml]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify exact Gate and concurrent truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          GATE=$(curl -fsSL https://api.github.com/repos/llhzx2018/core-free-runner-public/actions/runs/33256046377)
          test "$(jq -r .status <<<"$GATE")" = completed
          test "$(jq -r .conclusion <<<"$GATE")" = success
          rm -rf product
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          git -C product fetch -q origin main develop --tags
          MAIN=$(git -C product rev-parse origin/main)
          DEVELOP=$(git -C product rev-parse origin/develop)
          test "$MAIN" = 40b2d5239c557ab6c7b9aaaa092acffa9fb926f9
          test "$DEVELOP" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(git -C product rev-parse "$DEVELOP^{tree}")" = f568820198afde57fe3c1522820f45bbbf6e0c96
          test "$(git -C product rev-parse "$DEVELOP:src")" = 772d51ebbc9f8cd6791c0601d29f6b3b2a95a086
          test "$(git -C product merge-base "$MAIN" "$DEVELOP")" = "$MAIN"
          ! git -C product show-ref --verify --quiet refs/tags/v2.31.0
          test "$(git -C product show "$DEVELOP:VERSION" | tr -d '\r\n')" = 2.31.0
          test "$(git -C product show "$DEVELOP:src/VERSION.txt" | tr -d '\r\n')" = 2.31.0
          git -C product show "$DEVELOP:src/app/bootstrap.php" | grep -F "define('VF_VERSION', '2.31.0')" >/dev/null
          echo P01_V2310_PROMOTION_PRECHECK=PASS
      - name: Promote exact develop to main
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C product push "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4:refs/heads/main
          git -C product fetch -q origin main
          test "$(git -C product rev-parse origin/main)" = 0dfc6c7b1b76ca3cec750daed97f5c4ba51b47f4
          test "$(git -C product rev-parse origin/main^{tree})" = f568820198afde57fe3c1522820f45bbbf6e0c96
          echo P01_V2310_MAIN_PROMOTION=PASS
          echo TAG_CREATED=NO
          echo RELEASE_PUBLISHED=NO
          echo OWNER_PRODUCTION_WRITE=NO
