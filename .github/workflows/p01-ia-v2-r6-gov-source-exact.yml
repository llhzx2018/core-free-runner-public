name: P01 IA V2 R6 GOV sources exact-candidate gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia-v2-r6-gov-source-exact.yml'
permissions:
  contents: read
jobs:
  r6-owner-gov-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 842d7e3cef83c7c88515dadad72f312f55d78eff
      BASELINE_SHA: f7478c40e97fb8bd1562f6631061aa7f06fa89cd
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Checkout exact P01 source and remove credential remote
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R6_EXACT_SOURCE_PIN=PASS
      - name: Verify R6 owner-only GOV management and existing guards
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.444"
          for source in src/gov-topic-manager.php src/gov-book-manager.php src/gov-topic-sync.php src/gov-book-sync.php src/app/SubsiteAdminCatalog.php src/app/TopicLibraryPage.php src/app/CourseLibraryPage.php tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php tests/unit/gov_book_backend_shell_contract.php; do
            php -l "$source"
          done
          php tests/unit/p01_ia_v2_r6_gov_source_ownership_contract.php
          php tests/unit/gov_book_backend_shell_contract.php
          php tests/unit/gov_book_sync_dialog_contract.php
          php tests/unit/topic_sync_batch_ux_contract.php
          php tests/unit/topic_sync_modal_refactor_contract.php
          php tests/unit/gov_topic_managed_editor_contract.php
          php tests/unit/gov_book_sync_contract_native.php
          node tests/unit/gov_book_course_progress_runtime.js
          bash tests/integration/p01_ia_v2_r6_gov_source_http.sh .
          echo P01_R6_OWNER_GOV_SOURCE_HTTP_AND_PROTECTION=PASS
      - name: Canonical full regression with zero new debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R6_CANONICAL_ZERO_DEBT=PASS
      - name: Clean private P01 source checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R6_PRIVATE_SOURCE_CLEANUP=PASS
