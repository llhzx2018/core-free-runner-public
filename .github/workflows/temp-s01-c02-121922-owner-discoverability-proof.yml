name: TEMP S01-C02 1.21.922 OWNER discoverability proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 79ddb2bc5896dca396e2bc42779edc14ef16196a
      BASE_SHA: c37dc1cc4754a3792926f8f4a40e04e48fb36ad4
    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 79ddb2bc5896dca396e2bc42779edc14ef16196a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Assert exact source and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.922"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-v6-shell-r1.css \
            includes/views/admin-shell-tabs-parts/02-shell-navigation.php \
            tests/s01-c02-121922-owner-discoverability-r33-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/v6 includes/wp-update docs/authority | wc -l)" = "0"

      - name: PHP syntax and R33 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          php -l product/tests/s01-c02-121922-owner-discoverability-r33-contract.php
          php product/tests/s01-c02-121922-owner-discoverability-r33-contract.php

      - name: Independent 13-route visible-entry proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("product")
          nav=(root/"includes/views/admin-shell-tabs-parts/02-shell-navigation.php").read_text(encoding="utf-8")
          routes=(root/"includes/admin-v13/route-contract.php").read_text(encoding="utf-8")
          css=(root/"assets/css/current/admin-s01-v6-shell-r1.css").read_text(encoding="utf-8")

          assert '<section class="vf-v13-compat-directory" aria-label="历史与兼容页面">' in nav
          assert '<details class="vf-v13-compat-directory"' not in nav
          assert '<summary><span>兼容 / 历史入口</span>' not in nav
          assert '个入口 · 可直接进入' in nav
          assert 'vf_ops_v13_compat_route_url_v121920' in nav

          compat=re.findall(r"'([^']+)'\s*=>\s*\[[^\n]*?'status'=>'migration_evidence'", routes)
          expected={
            'seo_opportunities','seo_gaps','seo_backlinks',
            'publish_workflow','publish_pending','publish_preflight','publish_batches','publish_history',
            'acceptance',
            'system_components','system_search_analytics','system_monetization','system_backup'
          }
          assert set(compat)==expected, (len(compat), compat)
          assert len(compat)==13

          assert 'R33 · OWNER compatibility-route discoverability' in css
          assert '.vf-v13-compat-directory-head' in css
          assert '.vf-v13-compat-directory>summary' not in css
          assert css.count('{')==css.count('}')
          print("S01-C02 1.21.922 exact OWNER discoverability proof PASS")
          PY

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf product
