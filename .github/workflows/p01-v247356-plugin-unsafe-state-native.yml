name: P01 V247356 Plugin State Native Regression (Nonpublishing)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247356-plugin-unsafe-state-native.yml'
permissions:
  contents: read
jobs:
  plugin-status:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: a1e46c6b6dcddd0b9078c507c4bd35c987a18fe5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Checkout exact stable product baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 6c77d2ab082058c712991589c5a1541f0f6d724b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
      - name: Prepare PHP 8.4 with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,mbstring,zip,gd
          coverage: none
      - name: Exact candidate and syntax checks
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = a1e46c6b6dcddd0b9078c507c4bd35c987a18fe5
          test "$(tr -d '\r\n ' < product/VERSION)" = 2.47.356
          test "$(tr -d '\r\n ' < product/src/VERSION.txt)" = 2.47.356
          grep -Fq "define('VF_VERSION', '2.47.356');" product/src/app/bootstrap.php
          node --check product/src/assets/plugins-admin.js
          node --check product/tests/unit/plugins_activation_readback_native.cjs
          php -l product/src/plugins.php
          php -l product/tests/unit/plugins_activation_readback_native.php
          echo P01_PLUGIN_247356_EXACT_SOURCE_AND_SYNTAX=PASS
      - name: Native browserless lifecycle UI regression
        shell: bash
        run: |
          set -Eeuo pipefail
          node product/tests/unit/plugins_activation_readback_native.cjs | tee /tmp/p01-plugin-ui.txt
          grep -Fx P01_PLUGIN_ENABLE_DISABLE_STATUS_READBACK_NATIVE=PASS /tmp/p01-plugin-ui.txt
          grep -Fx P01_PLUGIN_QUARANTINE_AND_FAILURE_NO_FALSE_SUCCESS_NATIVE=PASS /tmp/p01-plugin-ui.txt
          grep -Fx P01_PLUGIN_UNSAFE_STATE_WRITES_BLOCKED_NATIVE=PASS /tmp/p01-plugin-ui.txt
          grep -Fx P01_PLUGIN_HEALTHY_CODE_ONLY_INSTALL_NATIVE=PASS /tmp/p01-plugin-ui.txt
      - name: Canonical zero-debt full unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash product/tests/canonical_release_regression.sh product stable --require-zero-debt | tee /tmp/p01-plugin-canonical.txt
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-plugin-canonical.txt
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-plugin-canonical.txt
          echo P01_PLUGIN_247356_CANONICAL=PASS
