name: P03 V1.37.1 Version Seal Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1371-version-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  P03_BRANCH: maintenance/v1.37.1-owner-runtime-bugfix

jobs:
  seal-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout P03 maintenance branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.P03_REPOSITORY }}
          ref: ${{ env.P03_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: p03

      - name: Establish V1.37.1 patch identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          python3 - <<'PY'
          from pathlib import Path
          import json

          Path('VERSION').write_text('1.37.1\n',encoding='utf-8')

          p=Path('src/app/bootstrap.php'); s=p.read_text(encoding='utf-8')
          old="define('VFAB_VERSION', '1.37.0');"; new="define('VFAB_VERSION', '1.37.1');"
          if new not in s:
              assert old in s
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('scripts/build_atomic.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("TARGET_VERSION='1.37.0'","TARGET_VERSION='1.37.1'",1)
          s=s.replace("ALLOWED_SOURCES=['1.36.2']","ALLOWED_SOURCES=['1.37.0']",1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/unit/project_intelligence_contract_test.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('runtime=THIN_LAYER manifest=49','runtime=THIN_LAYER manifest=50')
          p.write_text(s,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          marker='# 变更记录\n'
          entry='''\n## [1.37.1] - 2026-08-19 · Owner Runtime Bugfix\n\n- 修复桌面左侧“当前项目”区域没有独立滚动容器的问题；项目数量超过视口时，仅项目快捷入口滚动，品牌/主导航与设置/Runtime/退出保持可见。\n- 修复项目缺少 Production / GitHub Authority 时详情页读取 `null.canonical_url` 崩溃；缺失 Authority 现在安全降级为不显示对应外链，项目上下文继续正常渲染。\n- Schema 保持 `30`，Migration = `NONE`；正式 Atomic 来源限定为 `V1.37.0`。\n- PROJECT-ASSET STORAGE = NONE 等永久边界不变。\n'''
          if '## [1.37.1]' not in s:
              assert s.startswith(marker)
              s=marker+entry+s[len(marker):]
              p.write_text(s,encoding='utf-8')

          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V1.37.0 PRODUCTION / V1.37.1 OWNER RUNTIME BUGFIX CANDIDATE'
          d['project_status']='MAINTENANCE_BUGFIX'
          d['lifecycle']='CANDIDATE_PREPARATION'
          d['production_version']='1.37.0'
          d['working_version']='1.37.1'
          d['candidate_version']='1.37.1'
          d['schema_version']=30
          d['migration']='NONE'
          d['version_semantics']={
              'target':'1.37.1','change_class':'PATCH / OWNER RUNTIME BUGFIX',
              'allowed_source_versions':['1.37.0'],'schema_from':30,'schema_to':30,'database_migration':'NONE'
          }
          d['production_truth']={
              'installed_version':'1.37.0','installed_schema':30,
              'owner_real_use_status':'RUNNING / OWNER BUGS OBSERVED',
              'observed_runtime_from_owner_screenshot':'V1.37.0',
              'production_upgrade_this_cycle':'PREVIOUS OWNER UPGRADE TO V1.37.0',
              'production_write':'NO'
          }
          d['bugfix_cycle']={
              'version':'1.37.1','status':'IMPLEMENTED / VERIFYING',
              'owner_reported_at':'2026-08-19',
              'fixes':[
                  {'id':'SIDEBAR_PROJECT_SCROLL','result':'IMPLEMENTED','contract':'PROJECT SHORTCUTS SCROLL INDEPENDENTLY; FOOTER REMAINS VISIBLE'},
                  {'id':'NULL_AUTHORITY_CANONICAL_URL','result':'IMPLEMENTED','contract':'MISSING AUTHORITY OMITS LINK; PROJECT DETAIL MUST RENDER'}
              ],
              'schema_change':'NO','migration':'NONE','production_write':'NO'
          }
          d['release']={
              'installed_production_version':'1.37.0','candidate_version':'1.37.1',
              'release_ready':'PENDING_VERIFY','core_updates':'PENDING','production_write':False
          }
          d['current_phase']='V1.37.1 BUGFIX CANDIDATE VERIFY / ATOMIC PREPARATION'
          d['current_verdict']='BUGFIX_IMPLEMENTED / VERIFYING'
          d['runtime_change']='V1.37.1 CANDIDATE ON MAINTENANCE BRANCH'
          d['version_change']='1.37.0 -> 1.37.1 BUGFIX CANDIDATE'
          d['production_write']='NO'
          d['user_engineering_action']=0
          d['next_action']='VERIFY EXACT V1.37.1 -> TEST 1.37.0 TO 1.37.1 ATOMIC -> DEVELOP -> MAIN -> RELEASE -> CORE-UPDATES -> OWNER UPGRADE'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          test "$(cat VERSION)" = '1.37.1'
          grep -Fq "define('VFAB_VERSION', '1.37.1');" src/app/bootstrap.php
          grep -Fq "TARGET_VERSION='1.37.1'" scripts/build_atomic.py
          grep -Fq "ALLOWED_SOURCES=['1.37.0']" scripts/build_atomic.py
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert d['production_version']=='1.37.0'
          assert d['working_version']=='1.37.1'
          assert d['candidate_version']=='1.37.1'
          assert d['schema_version']==30 and d['migration']=='NONE'
          assert d['version_semantics']['allowed_source_versions']==['1.37.0']
          assert d['permanent_boundaries']['project_asset_storage']=='NONE'
          print('P03_V1371_VERSION_IDENTITY=PASS')
          PY
          node --check public/assets/project-intelligence.js
          python3 tests/integration/source_integrity_test.py
          git diff --check

      - name: Commit V1.37.1 identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p03
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION src/app/bootstrap.php scripts/build_atomic.py tests/unit/project_intelligence_contract_test.py CHANGELOG.md VF_PROJECT.json
          if git diff --cached --quiet; then
            echo 'P03_V1371_VERSION_COMMIT=UNCHANGED'
          else
            git commit -m 'release(P03): establish V1.37.1 bugfix candidate'
            git push origin HEAD:"$P03_BRANCH"
          fi
          echo "P03_V1371_VERSION_SEAL=PASS sha=$(git rev-parse HEAD)"
