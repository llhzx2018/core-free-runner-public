name: GOV-DOC Public Authority Router Exact Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gov-doc-public-authority-router-exact-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout exact GOV-DOC candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 6a41f59a1f5e53607938a878b23a3eefe39197d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov-doc-candidate

      - name: Verify exact source identity
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="6a41f59a1f5e53607938a878b23a3eefe39197d3"
          test "$actual" = "$expected"
          echo "GOV_DOC_EXACT_SOURCE=$actual"

      - name: Validate Public Authority Router
        working-directory: gov-doc-candidate
        run: |
          set -euo pipefail
          python3 governance/public-authority/tools/public_authority_router_lint.py

      - name: Machine receipt
        run: |
          echo 'GOV_DOC_PUBLIC_AUTHORITY_ROUTER_MACHINE=PASS'
          echo 'GOV_DOC_EXACT_SOURCE=6a41f59a1f5e53607938a878b23a3eefe39197d3'
          echo 'PRODUCTION_WRITE=0'
          echo 'GOV_DOC_MAIN_WRITE=0'
