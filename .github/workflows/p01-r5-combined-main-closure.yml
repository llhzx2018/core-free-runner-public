name: P01 R5 combined main exact-source closure
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-r5-combined-main-closure.yml'
permissions:
  contents: read
jobs:
  p01-r5-combined-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: f694891466e133992ffdc0926591326eed1ca6d6
      BASELINE_SHA: 49b6b7331fc81f47f26dfe7832a39d1b2dc591e7
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, curl, zip, openssl
          coverage: none
      - name: Pin merged main and prior source in ephemeral runner
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          for pair in "candidate $CANDIDATE_SHA" "stable $BASELINE_SHA"; do
            set -- $pair
            git init -q "$1"
            git -C "$1" remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
            git -C "$1" -c advice.detachedHead=false fetch -q --depth 1 origin "$2"
            git -C "$1" checkout -q --detach FETCH_HEAD
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            git -C "$1" remote remove origin
          done
          echo P01_R5_COMBINED_MAIN_PIN=PASS
      - name: R5 combined owner Music flows and persistent dock
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.444"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "2.47.444"
          php -l src/music-home.php
          php -l src/music-shell.php
          php -l tests/unit/p01_ia_v2_r5_music_frontstage_contract.php
          node --check src/assets/music-home-manage.js
          node --check src/assets/music-dock.js
          php tests/unit/p01_ia_v2_r5_music_frontstage_contract.php
          php tests/unit/music_quick_import_contract.php
          php tests/unit/music_security_contract.php
          node tests/unit/music_dock_contract.js
          node tests/unit/music_shell_route_contract.js
          bash tests/integration/p01_ia_v2_r5_music_http_roundtrip.sh .
          echo P01_R5_COMBINED_OWNER_HTTP_AUDIO_CSRF=PASS
      - name: Final main exact-source canonical zero-debt regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_R5_FINAL_MAIN_CANONICAL=PASS
      - name: Remove private source checkout
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_R5_COMBINED_PRIVATE_SOURCE_CLEANUP=PASS
