name: P01 V2.47.255 Pending Category Hierarchy Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247255-pending-category-hierarchy.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 88d740eb987d2e1fb986587af4f302bc3f2e6762
          git -C candidate checkout -q --detach 88d740eb987d2e1fb986587af4f302bc3f2e6762
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.255"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.255"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 0dd7ecfef77af836e4bbc1db511fd6828046cdcd
          git -C baseline checkout -q --detach 0dd7ecfef77af836e4bbc1db511fd6828046cdcd
          echo P01_V247255_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l candidate/src/app/Repository.php
          php -l candidate/src/surface-manager.php
          php -l candidate/src/app/bootstrap.php
          node --check candidate/src/assets/pending-inbox-ux.js
          echo P01_V247255_SYNTAX=PASS

      - name: Focused category hierarchy contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/unit/pending_category_hierarchy_v247255_contract.php
          php candidate/tests/unit/pending_category_picker_v247254_contract.php
          php candidate/tests/unit/category_selection_ux_r12_contract.php
          php candidate/tests/unit/category_picker_sort_dialog_r13_contract.php
          php candidate/tests/unit/pending_category_batch_source_contract.php
          php candidate/tests/unit/advanced_manager_daily_entry_contract.php
          echo P01_V247255_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247255_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
