name: P01 Single System Auth Authority Gate
on:
  push:
    branches: [temp/p01-single-system-auth-model-20260901]
    paths: [.github/workflows/p01-single-system-auth-authority-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1111fc5854ecb0cac04231e2b6af09976b0d5ece
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Exact Authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          BASE='2b60b27c1e5cb53f841e9e7f0c8e521bacba1030'
          test "$(git rev-parse HEAD)" = '1111fc5854ecb0cac04231e2b6af09976b0d5ece'
          test "$(git rev-list --count "$BASE..HEAD")" = 1
          actual="$(git diff --name-only "$BASE..HEAD" | sort | tr '\n' ' ')"
          expected='VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md docs/handoff/CURRENT_STATE.md '
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$BASE..HEAD" -- src/)"
          test "$(git rev-parse HEAD:src)" = '9788bdf228f3bd7e140a89f7881ce1b01c43f154'
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json',encoding='utf-8'));c=d['current_change']
          assert d['production_version']=='2.36.0'
          assert d['production_release']['production_closure']=='PASS'
          assert c['change_id']=='P01-SINGLE-SYSTEM-AUTH-MODEL-RESTORE-20260901'
          assert c['latest_merge_pr']==166
          assert c['runtime_product_source']=='2b60b27c1e5cb53f841e9e7f0c8e521bacba1030'
          assert c['runtime_product_tree']=='9788bdf228f3bd7e140a89f7881ce1b01c43f154'
          assert c['machine_gate']==33471511064
          assert c['evidence_artifact']==9786687777
          assert c['dual_view_model']=='REVERTED / NOT PRODUCT CONTRACT'
          assert c['management_entry']==['links-admin.php','settings.php']
          assert c['production_write'] is False and c['main_write'] is False
          for f in ['docs/authority/CURRENT.md','docs/handoff/CURRENT_STATE.md','docs/evidence/P01_SINGLE_SYSTEM_AUTH_MODEL_RESTORE_20260901.md']:
              s=open(f,encoding='utf-8').read()
              assert '一个前台' in s
              assert 'links-admin.php' in s and 'settings.php' in s
              assert '33471511064' in s
          print('AUTHORITY_GATE=PASS')
          PY
          git diff --check "$BASE..HEAD"
