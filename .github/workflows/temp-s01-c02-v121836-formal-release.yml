name: TEMP S01-C02 Ops 1.21.841 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121836-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121836-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: 15c77949d10b55ad3c14e682cea6feaca05eed66
      TREE: 2197b1dfc39bd165eb284276fe74a89f938fa387
      TAG: v1.21.841
      ASSET: vf-tools-ops_V1.21.841.zip
      BYTES: '3289816'
      SHA256: 31463e3b78cfe70801a4f6e0717f23927f374c90bfca7520e96a5349be6a2498
      FILES: '923'
      FP: 85f2cf398071b59fb0cae1527e28ae50f0c0c31813b059f590e1fb2f28c321e6
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.841
          php ops/.github/phase3/v121841-candidate-package-contract-classifier.php | grep -Fxq PASS_V121841_CANDIDATE_PACKAGE_CONTRACT_CLASSIFIER
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,6,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest(); actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.841 adds a second-level, privacy-safe read-only classifier for the single remaining Candidate package Final Audit contract leaf.

          - Focused Gate 34001566703 PASS on exact source 15c77949d10b55ad3c14e682cea6feaca05eed66 / tree 2197b1dfc39bd165eb284276fe74a89f938fa387.
          - Deterministic Artifact Identity 34001595711 PASS.
          - Production V1.21.840 currently has exactly one Final Audit package-contract leaf, source remains reusable, Candidate package is fail-closed, and internal-link failures are zero.
          - V1.21.841 reads only the existing terminal Candidate audit and maps the broad package-contract leaf into allowlisted package-processing classes.
          - Raw failure text, URL, local path, concrete filename, package identity, SHA and job identity are never exported.
          - No Candidate is created, retried, reset or advanced; Static Source is not re-uploaded or mutated; Final Audit, package readiness and finalOnline verdicts are not changed or forced.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema/content governance and DNS are untouched.
          - Asset vf-tools-ops_V1.21.841.zip; 3289816 bytes; SHA256 31463e3b78cfe70801a4f6e0717f23927f374c90bfca7520e96a5349be6a2498; runtime files 923; fingerprint 85f2cf398071b59fb0cae1527e28ae50f0c0c31813b059f590e1fb2f28c321e6.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.841' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo FORMAL_RELEASE_V121841=PASS
