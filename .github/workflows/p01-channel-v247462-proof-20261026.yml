name: "TEMP P01 V2.47.463 exact-channel independent CI proof"
on:
  push:
    branches:
      - "task/p01-channel-v247462-proof-20261026"
permissions:
  contents: read
jobs:
  verify-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed core-updates PR 899 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: "1d457a67d68373629918e90423c1777e06a4f101"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm exact core-updates source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "1d457a67d68373629918e90423c1777e06a4f101"
      - name: Manifest Contract Audit
        run: python3 scripts/check_manifest_contract.py
      - name: PHP environment
        run: php -v
      - name: Update Core V1 PHP syntax check
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Update Core V1 regression tests
        run: php update-core/php/tests/run.php
      - name: Verify exact P01 release channel and atomic rollback identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('projects/P01.json').read_text())
          expected = {
              'project_id': 'P01',
              'current_version': '2.47.461',
              'target_version': '2.47.463',
              'update_type': 'ATOMIC',
              'release_tag': 'v2.47.463',
              'release_id': 423960650,
              'product_identity': 'fe81d6c5b93e01505407e145e3f8989278bc362d',
              'asset_name': 'VF_Start_V2.47.463_UPDATE.zip',
              'asset_bytes': 3097403,
              'asset_sha256': '03964ce31da58794e8039bb7f04769e99002a48ff0be52a292829c6e680363e2',
              'backup_required': True,
              'rollback_supported': True,
          }
          for k,v in expected.items():
              assert p.get(k) == v, (k,p.get(k),v)
          assert '2.47.461' in p['from_versions']
          print('P01_EXACT_CHANNEL_MANIFEST=PASS')
          PY
