name: "TEMP P01 V2.47.462 exact-channel independent CI proof"
on:
  push:
    branches:
      - "task/p01-channel-v247462-proof-20261026"
permissions:
  contents: read
jobs:
  verify-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact proposed core-updates PR 899 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: "30dcccf735f970d4fb0bc2dddece7aaf80365390"
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Confirm exact core-updates source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "30dcccf735f970d4fb0bc2dddece7aaf80365390"
      - name: Manifest Contract Audit
        run: python3 scripts/check_manifest_contract.py
      - name: PHP environment
        run: php -v
      - name: Update Core V1 PHP syntax check
        run: find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Update Core V1 regression tests
        run: php update-core/php/tests/run.php
      - name: Verify exact P01 release channel and atomic rollback identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('projects/P01.json').read_text())
          expected = {
              'project_id': 'P01',
              'current_version': '2.47.461',
              'target_version': '2.47.462',
              'update_type': 'ATOMIC',
              'release_tag': 'v2.47.462',
              'release_id': 423862425,
              'product_identity': '1263acdc0cf47c48172d72307ba7399d39f6b5d8',
              'asset_name': 'VF_Start_V2.47.462_UPDATE.zip',
              'asset_bytes': 3093014,
              'asset_sha256': '69e7a221de88f9f7f6ec810836348f59cdfe8165ce89f799555193d02055dcd8',
              'backup_required': True,
              'rollback_supported': True,
          }
          for k,v in expected.items():
              assert p.get(k) == v, (k,p.get(k),v)
          assert '2.47.461' in p['from_versions']
          print('P01_EXACT_CHANNEL_MANIFEST=PASS')
          PY
