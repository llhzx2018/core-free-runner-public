name: P07 R1 consolidated private snapshot reconciliation rehearsal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-recovery-r1.yml'
      - 'experiments/p07-recovery-r1/**'
permissions:
  contents: read
jobs:
  recovery-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact R1 candidate files and stable release111
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat dist/p07/0.1.0/overlay/BUILD_ID)" = "0.1.0-release111"
          test "$(git hash-object experiments/p07-recovery-r1/lib/migration_recovery_rehearsal.py)" = 4726bdfb7ad4e2e2f9691f89a53c30c15acff138
          test "$(git hash-object experiments/p07-recovery-r1/tests/test_migration_recovery_rehearsal.py)" = 0b8db46016b17d54919635577ab87eee9b4ff382
          cp -a dist/p07/0.1.0/overlay "$RUNNER_TEMP/p07-r1"
          cp experiments/p07-recovery-r1/lib/migration_recovery_rehearsal.py "$RUNNER_TEMP/p07-r1/lib/"
          cp experiments/p07-recovery-r1/tests/test_migration_recovery_rehearsal.py "$RUNNER_TEMP/p07-r1/tests/"
          chmod +x "$RUNNER_TEMP/p07-r1/bin/"*
          echo P07_R1_EXACT_SOURCE_PASS
      - name: New offline reconciliation and existing migration recovery regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r1"
          python3 -m py_compile lib/migration_recovery_rehearsal.py tests/test_migration_recovery_rehearsal.py
          PYTHONPATH=lib python3 -m unittest -v \
            tests.test_migration_recovery_rehearsal \
            tests.test_migration_conflict_recovery \
            tests.test_sql_pk_conflict_evidence \
            tests.test_migration_no_overwrite_resume \
            tests.test_server_migration_pull \
            tests.test_server_migration \
            tests.test_restore_as_verified \
            tests.test_verify
          echo P07_R1_ALL_RELATED_REGRESSIONS_PASS
      - name: Verify no DB, host, filesystem or migration control dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/p07-r1"
          python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path("lib/migration_recovery_rehearsal.py")
          tree=ast.parse(root.read_text())
          imports={a.name.split(".")[0] for n in ast.walk(tree) if isinstance(n,ast.Import) for a in n.names}
          imports|={n.module.split(".")[0] for n in ast.walk(tree) if isinstance(n,ast.ImportFrom) and n.module}
          assert imports <= {"__future__", "copy", "json", "re", "typing"}, imports
          unsafe={"open","exec","eval","compile","__import__"}
          calls={n.func.id for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name)}
          assert not unsafe.intersection(calls),calls
          # Nothing else in the release111 runtime tree was modified.
          PY
          for path in lib/server_migration.py lib/server_migration_pull.py lib/cloudpanel.py lib/verify.py lib/migration_conflict_recovery.py bin/vfops BUILD_ID; do
            test "$(git hash-object "$GITHUB_WORKSPACE/dist/p07/0.1.0/overlay/$path")" = "$(git hash-object "$RUNNER_TEMP/p07-r1/$path")"
          done
          echo P07_R1_PRODUCTION_ISOLATION_PASS
