name: S01-C01 V1.35.139 candidate ZIP install upgrade rollback
on:
  push:
    branches: [task/s01-guide-reading-v135139-20261019]
    paths: ['.github/workflows/s01-theme-v135139-upgrade-20261019.yml']
permissions:
  contents: read
jobs:
  package-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: b782dd2b19317c6891d5fbcb195350bb39631baa
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target
          fetch-depth: 0
      - name: Exact candidate source and deterministic ZIP
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = b782dd2b19317c6891d5fbcb195350bb39631baa
          test "$(cat target/VERSION)" = 1.35.139
          grep -q '^Version: 1.35.139$' target/src/style.css
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile,hashlib,json
          root=Path('target/src');dest=Path('vf-tools-theme_V1.35.139.zip')
          files=sorted(x for x in root.rglob('*') if x.is_file())
          assert len(files)==476,len(files)
          with zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
              name=str(PurePosixPath('vf-tools-theme') / p.relative_to(root))
              entry=zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              entry.external_attr=(p.stat().st_mode & 0o777)<<16
              z.writestr(entry,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          with zipfile.ZipFile(dest) as z:
            assert z.testzip() is None
            assert 'vf-tools-theme/functions.php' in z.namelist()
            assert 'Version: 1.35.139' in z.read('vf-tools-theme/style.css').decode()
            assert b'font-size:15px' in z.read('vf-tools-theme/assets/css/public/vf-theme-public-runtime.css')
          receipt={'status':'PASS','version':'1.35.139','sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'bytes':dest.stat().st_size,'files':len(files),'source':'b782dd2b19317c6891d5fbcb195350bb39631baa','production':'UNTOUCHED'}
          Path('candidate-zip-receipt.json').write_text(json.dumps(receipt,indent=2))
          print('GUIDE_DETAIL_CANDIDATE_ZIP='+json.dumps(receipt))
          PY
      - name: Retrieve exact published 1.35.138 private release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          gh release download v1.35.138 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.138.zip
          echo '986eea087832d8817501ebfbd5b18f2e96b3b4de13781baa91fe340c61bae7bb  vf-tools-theme_V1.35.138.zip' | sha256sum -c
      - name: Isolated WordPress MariaDB installed upgrade rollback reapply
        run: |
          set -Eeuo pipefail
          docker run -d --name s01-c138-db -e MARIADB_ROOT_PASSWORD=synthetic -e MARIADB_DATABASE=wordpress -e MARIADB_USER=wp -e MARIADB_PASSWORD=synthetic mariadb:11.8.8 > /dev/null
          docker run -d --name s01-c138-wp --link s01-c138-db:db -e WORDPRESS_DB_HOST=db -e WORDPRESS_DB_USER=wp -e WORDPRESS_DB_PASSWORD=synthetic -e WORDPRESS_DB_NAME=wordpress wordpress:7.1.2-php8.3-apache > /dev/null
          for i in $(seq 1 80); do docker exec s01-c138-db mariadb-admin ping -uroot -psynthetic --silent >/dev/null 2>&1 && break; sleep 2; done
          curl -fsSLo wp.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker cp wp.phar s01-c138-wp:/usr/local/bin/wp
          docker cp vf-tools-theme_V1.35.138.zip s01-c138-wp:/tmp/old.zip
          docker cp vf-tools-theme_V1.35.139.zip s01-c138-wp:/tmp/new.zip
          cli(){ docker exec --user www-data s01-c138-wp php /usr/local/bin/wp "$@" --path=/var/www/html; }
          for i in $(seq 1 80); do docker exec s01-c138-wp test -f /var/www/html/wp-settings.php && break; sleep 2; done
          cli core install --url=http://example.test --title=Synthetic --admin_user=admin --admin_password=synthetic-only --admin_email=test@example.invalid --skip-email >/dev/null
          cli theme install /tmp/old.zip --activate >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.138
          cli option update s01_138_preserve 'original-synthetic-data' >/dev/null
          cli theme install /tmp/new.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.139
          test "$(cli option get s01_138_preserve)" = original-synthetic-data
          cli theme install /tmp/old.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.138
          cli theme install /tmp/new.zip --force >/dev/null
          test "$(cli theme get vf-tools-theme --field=version)" = 1.35.139
          test "$(cli option get s01_138_preserve)" = original-synthetic-data
          echo 'WP_138_TO_139_ROLLBACK_REAPPLY_DATA_PRESERVATION=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-theme-138-candidate-receipt-${{ github.run_id }}
          path: candidate-zip-receipt.json
          retention-days: 14
      - name: Destroy isolated containers and private assets
        if: always()
        run: |
          docker rm -f s01-c138-wp s01-c138-db >/dev/null 2>&1 || true
          rm -rf target
          rm -f vf-tools-theme_V1.35.138.zip vf-tools-theme_V1.35.139.zip wp.phar
