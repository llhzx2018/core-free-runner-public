name: P05 V1.1.1 Changelog Write

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.1-changelog-write.yml'

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: fix/p05-v1.1.1-cloudpanel-root-entry-20260830
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release write token
        shell: bash
        run: test -n "$GH_TOKEN" || { echo TOKEN_MISSING; exit 78; }
      - name: Checkout P05 patch branch
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ env.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Insert V1.1.1 changelog entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          text=p.read_text()
          marker='## 1.1.1 · CloudPanel Direct-Extract Fix（Release Source · 2026-08-30）'
          if marker not in text:
              entry='''## 1.1.1 · CloudPanel Direct-Extract Fix（Release Source · 2026-08-30）\n\n- 修复 V1.1.0 正式 FULL 包在 CloudPanel 现有站点根目录直接解压后没有根 `index.php`、无法直接打开的问题。\n- 正式 PHP Release Root 新增 `index.php`，并把 Vite `assets/` 镜像到 Release Root，使 CloudPanel Generic PHP 默认 `/index.php` fallback 与静态资源路径可以直接工作。\n- 保留 Hardened 部署方式：CloudPanel Root Directory 仍可设置为 `<release-root>/php/public`。\n- 修复 PHP Runtime 版本漂移：删除硬编码 `APP_VERSION = 1.0.2`，`/api/health`、系统信息与系统健康统一读取 Release `VERSION` Authority。\n- 新安装的真实 Runtime 配置移至 `$HOME/.config/vf-seo/runtime.env`；SQLite 与 Backup 继续位于 `$HOME/.local/share/vf-seo`，避免真实 Secret / DB 落入 Web Root。\n- `php/bin/migrate.php`、`bootstrap-admin.php`、`reset-admin-password.php`、`restore.php` 新增 CLI-only HTTP fail-closed Guard。\n- PHP Release Gate 新增 Root `index.php`、Root Assets、`VERSION ↔ PHP Runtime`、`VF_PROJECT ↔ VERSION`、CLI Web Guard 与 CloudPanel direct-extract Manifest Contract。\n- 新增 `php/tests/cloudpanel-root-smoke.sh`，真实验证 `/`、SPA fallback、`/assets/*`、`/api/health` 版本与 CLI HTTP 404。\n- Dependency graph / Schema 保持不变；Distribution 继续 `FULL_ONLY` / `from_versions=[]`，不声明 V1.1.0 → V1.1.1 Atomic 在线升级。\n- Production 保持 `NOT_DEPLOYED`；本 Patch 只修复正式发布包与 PHP Web Runtime 部署契约。\n\n'''
              assert text.startswith('# 变更记录\n')
              text='# 变更记录\n\n'+entry+text[len('# 变更记录\n\n'):]
              p.write_text(text)
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo P05_V111_CHANGELOG_NOOP=PASS
          else
            git commit -m 'docs(P05): add V1.1.1 CloudPanel patch changelog'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo P05_V111_CHANGELOG_WRITE=PASS
