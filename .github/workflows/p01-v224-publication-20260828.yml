name: P01 V2.24.0 Publication
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v224-publication-20260828.yml']
permissions:
  contents: read
env:
  RELEASE_SOURCE: 867e3387b8efb70398287d05fd3652540efa77c8
  RELEASE_TREE: 5985dab8ee071c881fd1e425864ed363e3bdc905
  VERSION: 2.24.0
  SCHEMA: '2026082801'
  ASSET_SHA: 7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca
  ASSET_BYTES: '1210247'
  ARTIFACT_RUN: '33155651293'
  ARTIFACT_ID: '9679479759'
  PROMOTION_GATE: '33155726629'
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for main merge and verify evidence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          for run in 33155395660 33155651293 "$PROMOTION_GATE"; do gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$run" | jq -e '.status=="completed" and .conclusion=="success"' >/dev/null; done
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/vf-start.git" product
          MAIN=$(git -C product rev-parse origin/main)
          git -C product merge-base --is-ancestor "$RELEASE_SOURCE" "$MAIN"
          test "$(git -C product show "$RELEASE_SOURCE:VERSION"|tr -d '\r\n')" = "$VERSION"
          test "$(git -C product rev-parse "$RELEASE_SOURCE^{tree}")" = "$RELEASE_TREE"
          echo "MAIN_MERGE=$MAIN" >> "$GITHUB_ENV"
      - name: Download exact formal artifact
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/artifact.zip
          rm -rf /tmp/artifact; mkdir /tmp/artifact; unzip -q /tmp/artifact.zip -d /tmp/artifact
          test -f /tmp/artifact/VF_Start_V2.24.0_UPDATE.zip
          test "$(sha256sum /tmp/artifact/VF_Start_V2.24.0_UPDATE.zip|awk '{print $1}')" = "$ASSET_SHA"
          test "$(stat -c %s /tmp/artifact/VF_Start_V2.24.0_UPDATE.zip)" = "$ASSET_BYTES"
      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          if git ls-remote --tags origin refs/tags/v2.24.0 | grep -q .; then
            test "$(git ls-remote --tags origin refs/tags/v2.24.0|awk '{print $1}')" = "$RELEASE_SOURCE"
          else
            git tag v2.24.0 "$RELEASE_SOURCE"
            git push origin refs/tags/v2.24.0
          fi
          if gh release view v2.24.0 --repo llhzx2018/vf-start >/dev/null 2>&1; then
            gh release delete v2.24.0 --repo llhzx2018/vf-start --yes --cleanup-tag=false
          fi
          gh release create v2.24.0 /tmp/artifact/VF_Start_V2.24.0_UPDATE.zip /tmp/artifact/VF-Start-V2.24.0-FULL.zip /tmp/artifact/P01-V2.24.0-ARTIFACT-GATE.json /tmp/artifact/P01-V2.24.0-FORMAL-METADATA.json /tmp/artifact/SHA256SUMS.txt --repo llhzx2018/vf-start --target "$RELEASE_SOURCE" --title 'VF Start V2.24.0' --notes 'V2.24.0 One-System UX/UI formal release. Shared Home / Start / Channels / Watch / Resource Organizer shell; branding cohesion; mobile navigation labels; creator/source Channels cards; human-readable System Baseline. Schema remains 2026082801. Online updater supports V2.23.0 -> V2.24.0 with atomic rollback.'
          RID=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.24.0 --jq .id)
          echo "RELEASE_ID=$RID" >> "$GITHUB_ENV"
      - name: Remote release asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download v2.24.0 --repo llhzx2018/vf-start --pattern 'VF_Start_V2.24.0_UPDATE.zip' --dir /tmp/remote
          test "$(sha256sum /tmp/remote/VF_Start_V2.24.0_UPDATE.zip|awk '{print $1}')" = "$ASSET_SHA"
          test "$(stat -c %s /tmp/remote/VF_Start_V2.24.0_UPDATE.zip)" = "$ASSET_BYTES"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.24.0 --jq .object.sha)" = "$RELEASE_SOURCE"
          echo P01_V224_GITHUB_PUBLICATION=PASS
      - name: Publish core-updates P01 manifest
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-updates.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('updates/projects/P01.json'); x=json.loads(p.read_text(encoding='utf-8'))
          x['project_id']='P01'; x['component_id']='APP'; x['enabled']=True; x['target_version']='2.24.0'; x['update_type']='ATOMIC'; x['from_versions']=['2.23.0']; x['schema_from']='2026082801'; x['schema_to']='2026082801'; x['repository']='llhzx2018/vf-start'; x['release_tag']='v2.24.0'; x['asset_name']='VF_Start_V2.24.0_UPDATE.zip'; x['asset_bytes']=1210247; x['asset_sha256']='7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca'; x['release_identity']='v2.24.0@867e3387b8efb70398287d05fd3652540efa77c8'; x['backup_required']=True; x['rollback_supported']=True; x['minimum_php']='8.0.0'; x['released_at']='2026-08-28T08:35:00Z'
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool updates/projects/P01.json >/dev/null
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          git -C updates diff --cached --check
          if ! git -C updates diff --cached --quiet; then git -C updates commit -m 'release(P01): publish V2.24.0'; git -C updates push origin HEAD:main; fi
          USHA=$(git -C updates rev-parse HEAD); echo "CORE_UPDATES_COMMIT=$USHA" >> "$GITHUB_ENV"
      - name: Final publication readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          RAW=$(curl -fsSL "https://raw.githubusercontent.com/llhzx2018/core-updates/main/projects/P01.json?cb=$(date +%s)")
          echo "$RAW" | jq -e '.target_version=="2.24.0" and .asset_name=="VF_Start_V2.24.0_UPDATE.zip" and .asset_bytes==1210247 and .asset_sha256=="7a8125cbb52fa7693db39dde686f0ae2250c7eb87d08942e3022c209bec8c3ca"' >/dev/null
          echo P01_V224_PUBLICATION=PASS
          echo RELEASE_SOURCE="$RELEASE_SOURCE"
          echo RELEASE_TREE="$RELEASE_TREE"
          echo MAIN_MERGE="$MAIN_MERGE"
          echo RELEASE_ID="$RELEASE_ID"
          echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT"
          echo SCHEMA="$SCHEMA"
