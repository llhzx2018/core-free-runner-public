name: P07 V20 Cgroup Path Probe

on:
  push:
    branches: [experiment/p07-vps-audit-v20]
    paths: [.github/workflows/p07-v20-cgroup-path-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve current cgroup path
        run: |
          set -u
          cat /proc/self/cgroup
          rel="$(awk -F: '$1=="0"{print $3; exit}' /proc/self/cgroup)"
          base="/sys/fs/cgroup${rel}"
          echo "CGROUP_REL=$rel"
          echo "CGROUP_BASE=$base"
          for f in cpu.max memory.max memory.swap.max pids.max; do
            printf '%s = ' "$f"; cat "$base/$f" 2>/dev/null || echo unavailable
          done
