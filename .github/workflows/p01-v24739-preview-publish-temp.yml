name: p01-v24739-preview-publish-temp

on:
  push:
    branches:
      - preview/p01-v24739-20260921

permissions:
  contents: read

concurrency:
  group: p01-v24739-preview-publish
  cancel-in-progress: false

jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PREVIEW_SHA: 761fb624c62e9ec16fe33e5f2f1e9f2c27738963
      SOURCE_TAG: v2.47.38
      SOURCE_SHA: 3394e056ce9c0f6ba3667a67a8bc5ae1c4c513b0
      SOURCE_VERSION: 2.47.38
      TARGET_VERSION: 2.47.39
      TARGET_TAG: v2.47.39-preview.1
      EXPECTED_SCHEMA: '2026090401'
      CANDIDATE_RUN: '35575932207'
      BACKEND_GATE_RUN: '35575018642'
      BIND_PR: '898'
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Exact preview authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$RELEASE_TOKEN"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')" = "$SOURCE_SHA"
          if GH_TOKEN="$READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            echo BLOCK=TARGET_TAG_ALREADY_EXISTS
            exit 81
          fi
          echo P01_V24739_PREVIEW_AUTHORITY=PASS

      - name: Checkout exact formal source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PREVIEW_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.37 baseline
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Checkout proven Atomic primitives
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          persist-credentials: false
          fetch-depth: 1
          path: proven

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd,opcache
          coverage: none

      - name: Exact preview source and release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C vf-start rev-parse HEAD)" = "$PREVIEW_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\\r\\n ' < vf-start/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\\r\\n ' < vf-start/src/VERSION.txt)" = "$TARGET_VERSION"
          grep -Fq "define('VF_VERSION', '${TARGET_VERSION}');" vf-start/src/app/bootstrap.php
          test "$(php -r '$p=json_decode(file_get_contents("vf-start/VF_PROJECT.json"),true); echo $p["working_schema_version"];')" = "$EXPECTED_SCHEMA"
          grep -Fq 'OWNER_PREVIEW_RUNTIME_APPLICABILITY = REQUIRED' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'OWNER_PREVIEW_RUNTIME = PENDING' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'OWNER_REAL_USE = PENDING' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'FORMAL_RELEASE_READY = NO' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'NO_UNKNOWN_APPLICABILITY = YES' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          grep -Fq 'PRE_RELEASE_AUTHORITY_DRIFT_GATE = PASS' vf-start/docs/release/V2.47.39_RELEASE_GATE.md
          find vf-start/src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          find vf-start/src -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          php vf-start/tests/unit/release_authority_r44_contract.php
          php vf-start/tests/unit/readme_runtime_authority_r75_contract.php
          php vf-start/tests/unit/admin_visual_batch_r74_contract.php
          php vf-start/tests/unit/navigation_mobile_list_r73_contract.php
          echo P01_V24739_PREVIEW_SOURCE_AUTHORITY=PASS

      - name: Rebuild deterministic FULL and Atomic UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v24739-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v24739-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          repl=[
            ('7f3492f70276d83efed371296d69709c1e991350',os.environ['PREVIEW_SHA']),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',os.environ['PREVIEW_SHA']),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e',os.environ['SOURCE_SHA']),
            ('33993725218',os.environ['GITHUB_RUN_ID']),
            ('BIND_PR=416','BIND_PR='+os.environ['BIND_PR']),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V24739_OWNER_PREVIEW_20260921'),
            ('V2470','V24739'),('v2470','v24739')
          ]
          for a,b in repl:
              if a not in s: raise SystemExit('missing helper anchor '+a)
              s=s.replace(a,b)
          s=s.replace('2.47.0','__TARGET__').replace('2.46.4',os.environ['SOURCE_VERSION']).replace('__TARGET__',os.environ['TARGET_VERSION'])
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s: raise SystemExit('release-type helper anchor missing')
          inner_patch="src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.37 之后 Data Safety R14 运行时修复与受保护保留真相的正式发布版本.')\nbuilder_anchor=\"    return repair.replace(old,new,1)\"\nbuilder_replacement=\"    repair=repair.replace(old,new,1)\\n    method_anchor=\\\"    public static function selfTest(): array {\\\"\\n    method=\\\"    private static function refreshRuntimeCache(string $root): array {\\\\n        $helper=rtrim($root,'/').'/app/AtomicRuntimeCache.php';\\\\n        if(!is_file($helper)||is_link($helper))throw new RuntimeException('Atomic runtime cache helper missing.');\\\\n        require_once $helper;\\\\n        if(!class_exists('VfAtomicRuntimeCache',false))throw new RuntimeException('Atomic runtime cache helper invalid.');\\\\n        return VfAtomicRuntimeCache::refresh($root);\\\\n    }\\\\n\\\"\\n    if repair.count(method_anchor)!=1: raise SystemExit('atomic cache method anchor mismatch')\\n    repair=repair.replace(method_anchor,method+method_anchor,1)\\n    current_anchor=\\\"$dbv=self::dbVerify((string)$rt['db_file']);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors']];\\\"\\n    current_new=\\\"$dbv=self::dbVerify((string)$rt['db_file']);$runtimeCache=self::refreshRuntimeCache($root);return ['ok'=>true,'already_current'=>true,'interrupted_recovered'=>$recovered,'schema'=>$dbv['schema'],'integrity'=>$dbv['integrity'],'fk'=>$dbv['foreign_key_errors'],'runtime_cache'=>$runtimeCache];\\\"\\n    if repair.count(current_anchor)!=1: raise SystemExit('atomic already-current cache anchor mismatch')\\n    repair=repair.replace(current_anchor,current_new,1)\\n    commit_anchor=\\\"$dbv=self::dbVerify($db);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\\\"\\n    commit_new=\\\"$dbv=self::dbVerify($db);$runtimeCache=self::refreshRuntimeCache($root);self::jsonWrite($journal,['target_version'=>self::TARGET_VERSION,'source_version'=>self::SOURCE_VERSION,'stage'=>$stage,'phase'=>'commit_ready','created_at'=>gmdate('c')]);\\\"\\n    if repair.count(commit_anchor)!=1: raise SystemExit('atomic commit cache anchor mismatch')\\n    repair=repair.replace(commit_anchor,commit_new,1)\\n    return_anchor=\\\"'target_checked'=>$target['checked'],'rollback_supported'=>true];\\\"\\n    return_new=\\\"'target_checked'=>$target['checked'],'rollback_supported'=>true,'runtime_cache'=>$runtimeCache];\\\"\\n    if repair.count(return_anchor)!=1: raise SystemExit('atomic return cache anchor mismatch')\\n    return repair.replace(return_anchor,return_new,1)\"\nif builder_anchor not in src: raise SystemExit('builder Atomic cache anchor missing')\nsrc=src.replace(builder_anchor,builder_replacement,1)"
          s=s.replace(old,inner_patch,1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v24739-artifact-gate.sh
          bash /tmp/p01-v24739-artifact-gate.sh | tee /tmp/p01-v24739-artifact.log
          grep -Fx 'P01_V24739_FORMAL_ARTIFACT_GATE=PASS' /tmp/p01-v24739-artifact.log
          jq -e '.runtime_cache as $r | (($r|type)=="object") and ($r|has("opcache_available")) and ($r|has("files_checked")) and ($r|has("reset"))' /tmp/v24739-formal-upgrade.json >/dev/null
          grep -Fq 'private static function refreshRuntimeCache(string $root): array' /tmp/p01-v24739-formal-artifacts/repair-v2.47.39.php
          grep -Fq 'app/AtomicRuntimeCache.php' /tmp/p01-v24739-formal-artifacts/repair-v2.47.39.php
          grep -Fq 'VfAtomicRuntimeCache::refresh($root)' /tmp/p01-v24739-formal-artifacts/repair-v2.47.39.php
          echo P01_V24739_PREVIEW_REAL_UPGRADE=PASS

      - name: Preview package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24739-formal-artifacts
          FULL="$ASSETS/VF-Start-V2.47.39-FULL.zip"
          UPDATE="$ASSETS/VF_Start_V2.47.39_UPDATE.zip"
          for f in "$FULL" "$FULL.sha256" "$UPDATE" "$UPDATE.sha256"; do test -f "$f"; done
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.39-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.39_UPDATE.zip.sha256)
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\\r\\n ')" = "$TARGET_VERSION"
          unzip -p "$FULL" release-manifest.json >/tmp/p01-v24739-release-manifest.json
          jq -e --arg t "$TARGET_VERSION" --arg s "$SOURCE_VERSION" --arg schema "$EXPECTED_SCHEMA" '.version==$t and .source_version==$s and .schema_version==$schema and .source_schema_version==$schema and .schema_change==false and (.schema_migrations|length)==0 and .runtime_data_included==false and .seed_user_business_data_included==false and .update.backup_required==true and .update.rollback_supported==true and .update.single_hop==true and (.update.supported_from==[$s])' /tmp/p01-v24739-release-manifest.json >/dev/null
          test "$(unzip -Z1 "$UPDATE" | wc -l | tr -d ' ')" = 1
          unzip -Z1 "$UPDATE" | grep -Fxq repair-v2.47.39.php
          php "$ASSETS/repair-v2.47.39.php" --self-test | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          grep -Fq 'AtomicRuntimeCache.php' "$ASSETS/repair-v2.47.39.php"
          grep -Fq 'VfAtomicRuntimeCache::refresh($root)' "$ASSETS/repair-v2.47.39.php"
          ! unzip -Z1 "$FULL" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          (cd "$ASSETS" && sha256sum VF-Start-V2.47.39-FULL.zip VF-Start-V2.47.39-FULL.zip.sha256 VF_Start_V2.47.39_UPDATE.zip VF_Start_V2.47.39_UPDATE.zip.sha256 > SHA256SUMS.txt)
          echo P01_V24739_PREVIEW_PACKAGE_CONTRACT=PASS

      - name: Create preview tag and prerelease
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24739-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${TARGET_TAG}" -f sha="$PREVIEW_SHA" >/dev/null
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$PREVIEW_SHA"
          cat >/tmp/p01-v24739-preview-notes.md <<EOF
          # P01 · VF Start V2.47.39 Preview 1

          Owner Preview Candidate only — not the Formal Stable Release.

          Exact Preview Source: ${PREVIEW_SHA}
          Previous Stable: ${SOURCE_TAG} / ${SOURCE_SHA}
          Schema: ${EXPECTED_SCHEMA} unchanged; Migration: NONE.
          Merged-main Candidate Gate: ${CANDIDATE_RUN} PASS.
          Merged-main backend readiness: ${BACKEND_GATE_RUN} PASS.
          Deterministic FULL + strict 2.47.38 → 2.47.39 Atomic UPDATE / data preservation / backup+rollback / runtime-cache handoff / package safety: PASS in Preview Artifact Gate ${GITHUB_RUN_ID}.
          OWNER_PREVIEW_RUNTIME_APPLICABILITY: REQUIRED.
          OWNER_PREVIEW_RUNTIME: NOT_RUN.
          OWNER_REAL_USE: NOT_RUN.
          Formal Release: BLOCKED_OWNER_PREVIEW.
          Stable Distribution: NOT UPDATED.
          Production: NOT WRITTEN.
          EOF
          gh release create "$TARGET_TAG" \
            "$ASSETS/VF-Start-V2.47.39-FULL.zip" \
            "$ASSETS/VF-Start-V2.47.39-FULL.zip.sha256" \
            "$ASSETS/VF_Start_V2.47.39_UPDATE.zip" \
            "$ASSETS/VF_Start_V2.47.39_UPDATE.zip.sha256" \
            "$ASSETS/SHA256SUMS.txt" \
            --repo "$PRODUCT_REPO" --title 'VF Start V2.47.39 Preview 1' --notes-file /tmp/p01-v24739-preview-notes.md --prerelease --verify-tag
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.prerelease')" = true
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.draft')" = false
          echo P01_V24739_PREVIEW_PRERELEASE=PASS

      - name: Independent remote byte readback
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v24739-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TARGET_TAG}" --jq '.object.sha')" = "$PREVIEW_SHA"
          test "$(gh api "repos/${PRODUCT_REPO}/releases/tags/${TARGET_TAG}" --jq '.prerelease')" = true
          rm -rf /tmp/p01-v24739-remote
          mkdir -p /tmp/p01-v24739-remote
          gh release download "$TARGET_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v24739-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v24739-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          l=Path(os.environ['LOCAL']); r=Path(os.environ['REMOTE'])
          names=['VF-Start-V2.47.39-FULL.zip','VF-Start-V2.47.39-FULL.zip.sha256','VF_Start_V2.47.39_UPDATE.zip','VF_Start_V2.47.39_UPDATE.zip.sha256','SHA256SUMS.txt']
          assert sorted(p.name for p in r.iterdir() if p.is_file())==sorted(names)
          for n in names:
              a,b=l/n,r/n
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'PREVIEW_ASSET={n}|{a.stat().st_size}|{ha}')
          print('P01_V24739_PREVIEW_REMOTE_BYTES=PASS')
          PY

      - name: Final preview verdict
        run: |
          echo PUBLIC_AUTHORITY_INSTALL=PASS
          echo PUBLIC_AUTHORITY_SECURITY=PASS
          echo PUBLIC_AUTHORITY_TESTING=PASS
          echo PUBLIC_AUTHORITY_UPGRADE=PASS
          echo PUBLIC_AUTHORITY_DATA_SCHEMA=PASS
          echo PUBLIC_AUTHORITY_GIT=PASS
          echo PUBLIC_AUTHORITY_UA_UI=MACHINE_PASS_OWNER_PENDING
          echo NO_REQUIRED_MACHINE_GATE_MISSING=YES
          echo NO_UNKNOWN_APPLICABILITY=YES
          echo PRE_RELEASE_AUTHORITY_DRIFT_GATE=PASS
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          echo OWNER_PREVIEW_RUNTIME=NOT_RUN
          echo OWNER_REAL_USE=NOT_RUN
          echo P01_V24739_PREVIEW_ARTIFACT_GATE=PASS
          echo FORMAL_RELEASE=BLOCKED_OWNER_PREVIEW
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION=false

      - name: Cleanup
        if: always()
        run: rm -rf vf-start baseline helper template proven formal candidate /tmp/p01-v24739-*
