name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-guides182-20261024]
    paths: ['.github/workflows/s01-guides182-20261024-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.182
  TARGET_SHA: f1535ec95e2f4d661a3650628bae0b35b0b1c517
  TARGET_TREE: 7b600982c80d2fbfe61280731afa9b95e9137cec
  BASE_SHA: 1f4e8f1917226e255724e185876459ee46e829db
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: f1535ec95e2f4d661a3650628bae0b35b0b1c517
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40056998068 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40056998068 --jq .head_sha)" = 3434c0b2ffe4a93808b51ec74852fcc28adf556a
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40056998068 --repo llhzx2018/core-free-runner-public --name s01-home-40056998068 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-guides182-20261024/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='fd4a82c917cf25d84c5f2f1dbefc9ffc48bdf806'
          phases={phase:json.loads((r/(phase+'-guides-summary.json')).read_text()) for phase in ['before','upgrade','rollback','after']}
          for phase,result in phases.items():
              assert result['status']=='PASS' and result['errors']==result['write_requests']==[]
              assert len(result['rows'])==(8 if phase in ['before','after'] else 1)
              assert all(row['status']=='PASS' for row in result['rows'])
          for lang in ['en','zh']:
              for width in [1440,1312,1280,1024]:
                  before=json.loads((r/('before-guides-'+lang+'-'+str(width)+'.json')).read_text())
                  after=json.loads((r/('after-guides-'+lang+'-'+str(width)+'.json')).read_text())
                  assert not after['overflow'] and after['version']=='1.35.182'
                  for key in ['h1','canonical','hreflang','shell']:assert before[key]==after[key]
                  assert len(after['h1'])==len(after['canonical'])==1
                  assert [(x['href'],x['title'],x['copy']) for x in before['cards']]==[(x['href'],x['title'],x['copy']) for x in after['cards']]
                  assert all(c['box']['paddingLeft']==c['box']['paddingTop']==24 for c in after['cards'])
                  assert abs(after['container']['x']-after['cta']['x'])<1 and abs(after['container']['width']-after['cta']['width'])<1
                  assert after['input']['borderTop']+after['input']['borderBottom']==0
                  for phase in ['before','after']:assert (r/(phase+'-guides-'+lang+'-'+str(width)+'.png')).stat().st_size>1000
          assert len(phases['after']['interactions'])==4
          facts=json.loads((r/'guide-facts.json').read_text());assert facts['status']=='PASS' and facts['cases']==16
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='c6a4ef911b9949ef825b8919636894963483dedd3f40680421fa065ad8bcacc4' and new['bytes']==1985299
          coverage=json.loads(pathlib.Path('control/lanes/s01-guides182-20261024/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA'}
          assert coverage['source']=='fd4a82c917cf25d84c5f2f1dbefc9ffc48bdf806' and coverage['tree']=='7b600982c80d2fbfe61280731afa9b95e9137cec'
          assert coverage['owner_preview']=='N_A per unchanged Theme SSOT15'
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40056998068'
          coverage['merged_source']='f1535ec95e2f4d661a3650628bae0b35b0b1c517'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.182 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.182 provider/vf-tools-theme_V1.35.182.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.182' --notes '指南目录保持现有阅读列表，统一桌面内容边界、搜索与筛选留白、24px条目内边距及长标题换行。步骤数、操作耗时和难度只显示内容方已填写的真实元数据，不再从正文标题推算，也不为静态后备卡片写固定值。保留真实搜索、任务分类、空结果恢复、分页、无脚本GET、既有内容/自定义设置及指南详情估算合同；共享页头页尾、首页、工具目录和其它列表不改。中英文1440/1312/1280/1024实际WordPress定向检查，作者/缺失/非法/别名元数据正负例、键盘及原生新包安装/升级/回退/重复安装数据保护通过。476运行文件；M3U8保持1.25.94。Production由OWNER手工升级后最终验收，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.182 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.182 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.182 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.182.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.182.zip remote/vf-tools-theme_V1.35.182.zip
          echo 'c6a4ef911b9949ef825b8919636894963483dedd3f40680421fa065ad8bcacc4  remote/vf-tools-theme_V1.35.182.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.182.zip)" = 1985299
          gh release view v1.35.182 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
