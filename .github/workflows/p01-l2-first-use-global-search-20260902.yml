name: P01 L2 First Use + Global Search
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-first-use-global-search-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-first-use-global-search-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 1abe3f8808faf43d0214ec98840f0573f5216adb
          test "$(git -C product rev-parse origin/develop)" = 1abe3f8808faf43d0214ec98840f0573f5216adb
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              p.write_text(s.replace(old,new,1))

          # Home: first-use state and direct import/add paths.
          p=Path('src/app/FunctionalHome.php'); s=p.read_text()
          old="""    $healthStatus = (array)($context['health_status'] ?? []);\n"""
          new="""    $healthStatus = (array)($context['health_status'] ?? []);\n    $firstUse = !empty($context['first_use']);\n"""
          if s.count(old)!=1: raise SystemExit('home first-use context drift')
          s=s.replace(old,new,1)
          old="""  <div class=\"vf-home-mobile-command\" aria-label=\"移动端快速操作\">\n    <form action=\"surfaces.php\" method=\"get\"><span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索全部资源\" autocomplete=\"off\"><button type=\"submit\">搜索</button></form>\n    <button type=\"button\" data-open-add>＋ 添加</button>\n  </div>\n\n  <div class=\"vf-home-board\">\n"""
          new="""  <div class=\"vf-home-mobile-command\" aria-label=\"移动端快速操作\">\n    <form action=\"surfaces.php\" method=\"get\"><span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><button type=\"submit\">搜索</button></form>\n    <button type=\"button\" data-open-add>＋ 添加</button>\n  </div>\n\n  <?php if($firstUse): ?>\n  <section class=\"vf-home-first-use\" aria-labelledby=\"vfHomeFirstUseTitle\">\n    <span class=\"vf-home-first-use-kicker\">开始使用</span>\n    <h2 id=\"vfHomeFirstUseTitle\">把你已经在用的互联网带进来</h2>\n    <p>不用从空白开始。可以直接导入 Chrome、Edge 或 Firefox 导出的书签 HTML；系统会先预览、识别重复，正式导入前自动创建恢复点。</p>\n    <div class=\"vf-home-first-use-actions\">\n      <a class=\"vf-home-first-use-primary\" href=\"transfer.php\">导入浏览器书签</a>\n      <button type=\"button\" data-open-add>从空白开始 · 添加第一个网址</button>\n    </div>\n    <small>导入内容默认可以保持私人；不确定归属的内容以后再到“待整理”处理。</small>\n  </section>\n  <?php else: ?>\n\n  <div class=\"vf-home-board\">\n"""
          if s.count(old)!=1: raise SystemExit('home mobile/board anchor drift')
          s=s.replace(old,new,1)
          old="""  </div>\n</section>\n<?php\n}\n\nfunction vf_render_home_workspace(): void\n"""
          new="""  </div>\n  <?php endif; ?>\n</section>\n<?php\n}\n\nfunction vf_render_home_workspace(): void\n"""
          if s.count(old)!=1: raise SystemExit('home board close anchor drift')
          s=s.replace(old,new,1)
          old="""<?php vf_render_home_command_center(['pending'=>$pending,'operations'=>$operations,'operation_asset_titles'=>$operationAssetTitles,'operation_category_titles'=>$operationCategoryTitles,'health_status'=>$healthStatus]); ?>"""
          new="""<?php vf_render_home_command_center(['pending'=>$pending,'operations'=>$operations,'operation_asset_titles'=>$operationAssetTitles,'operation_category_titles'=>$operationCategoryTitles,'health_status'=>$healthStatus,'first_use'=>count($allAssets)===0]); ?>"""
          if s.count(old)!=1: raise SystemExit('home context call drift')
          s=s.replace(old,new,1)
          old="""<form class=\"vf-global-search\" action=\"surfaces.php\" method=\"get\"><span>⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索全部资源\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          new="""<form class=\"vf-global-search\" action=\"surfaces.php\" method=\"get\"><span>⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          if s.count(old)!=1: raise SystemExit('home desktop search drift')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Every workspace top search becomes global Personal Search.
          p=Path('src/app/FunctionalWorkspace.php'); s=p.read_text()
          old="""<form class=\"vf-global-search\" action=\"<?=vf_fw_h(vf_fw_base_route($mode))?>\" method=\"get\"><?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?><?php if($categoryId>0): ?><input type=\"hidden\" name=\"category\" value=\"<?=$categoryId?>\"><?php endif; ?><?php if($kind!==''): ?><input type=\"hidden\" name=\"kind\" value=\"<?=vf_fw_h($kind)?>\"><?php endif; ?><span>⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"<?=vf_fw_h($mode==='start'?'搜索标题、网址、分类或标签':'搜索标题、分类或标签')?>\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          new="""<form class=\"vf-global-search\" action=\"surfaces.php\" method=\"get\"><?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?><span>⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          if s.count(old)!=1: raise SystemExit(f'workspace desktop search drift: {s.count(old)}')
          s=s.replace(old,new,1)
          anchor="""<?php vf_fw_render_mobile_filters($mode,$admin,$scope,$categories,$categoryCounts,$categoryId,$kindCounts,$kind); ?>"""
          addition="""<?php if($q!==''&&$mode==='all'): ?><div class=\"vf-search-fallback\"><span>没有在个人资源里找到想要的？</span><a href=\"https://www.google.com/search?q=<?=rawurlencode($q)?>\" target=\"_blank\" rel=\"noopener noreferrer\">在 Google 搜索“<?=vf_fw_h($q)?>” →</a></div><?php endif; ?>\n"""+anchor
          if s.count(anchor)!=1: raise SystemExit('workspace fallback anchor drift')
          s=s.replace(anchor,addition,1)
          p.write_text(s)

          # Mobile search also becomes global and drops current category/kind constraints.
          p=Path('src/app/FunctionalWorkspaceShell.php'); s=p.read_text()
          old="""  <form class=\"vf-mobile-command-search\" action=\"<?=vf_fw_h(vf_fw_base_route($mode))?>\" method=\"get\">\n    <?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?>\n    <?php if($categoryId>0): ?><input type=\"hidden\" name=\"category\" value=\"<?=$categoryId?>\"><?php endif; ?>\n    <?php if($kind!==''): ?><input type=\"hidden\" name=\"kind\" value=\"<?=vf_fw_h($kind)?>\"><?php endif; ?>\n    <span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索当前资源\" autocomplete=\"off\"><button type=\"submit\">搜索</button>\n  </form>"""
          new="""  <form class=\"vf-mobile-command-search\" action=\"surfaces.php\" method=\"get\">\n    <?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?>\n    <span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><button type=\"submit\">搜索</button>\n  </form>"""
          if s.count(old)!=1: raise SystemExit(f'workspace mobile search drift: {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          # Presentation only: first-use card + light web fallback row.
          p=Path('src/assets/workspace-home.css'); s=p.read_text()
          css='''\n/* First-use entry: turn existing import capability into a discoverable start path. */\n.vf-home-first-use{padding:28px 30px;border:1px solid var(--ws-line);border-radius:12px;background:var(--ws-panel)}\n.vf-home-first-use-kicker{display:block;color:var(--ws-teal);font-size:9px;font-weight:800;letter-spacing:.12em}\n.vf-home-first-use h2{max-width:680px;margin:7px 0 8px;color:var(--ws-text);font-size:21px;line-height:1.25;letter-spacing:-.02em}\n.vf-home-first-use p{max-width:760px;margin:0;color:var(--ws-muted);font-size:12px;line-height:1.7}\n.vf-home-first-use-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}\n.vf-home-first-use-actions a,.vf-home-first-use-actions button{min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ws-line-strong);border-radius:8px;background:var(--ws-panel);color:var(--ws-text);font:inherit;font-size:11.5px;font-weight:750;text-decoration:none;cursor:pointer}\n.vf-home-first-use-actions .vf-home-first-use-primary{border-color:var(--ws-teal);background:var(--ws-teal);color:#fff}\n.vf-home-first-use>small{display:block;margin-top:10px;color:var(--ws-muted-2);font-size:10px;line-height:1.5}\n@media(max-width:760px){.vf-home-first-use{padding:20px 16px}.vf-home-first-use h2{font-size:18px}.vf-home-first-use-actions{display:grid}.vf-home-first-use-actions a,.vf-home-first-use-actions button{width:100%}}\n'''
          if 'First-use entry:' in s: raise SystemExit('home first-use css already present')
          p.write_text(s.rstrip()+css+'\n')

          p=Path('src/assets/workspace-rebaseline.css'); s=p.read_text()
          css='''\n/* Global personal-search fallback. */\n.vf-search-fallback{margin:0 0 10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--ws-line);border-radius:8px;background:var(--ws-soft);font-size:10.5px}\n.vf-search-fallback span{color:var(--ws-muted-2)}\n.vf-search-fallback a{color:var(--ws-teal);font-weight:750;text-decoration:none}\n@media(max-width:600px){.vf-search-fallback{align-items:flex-start;flex-direction:column;gap:4px}}\n'''
          if 'Global personal-search fallback.' in s: raise SystemExit('search fallback css already present')
          p.write_text(s.rstrip()+css+'\n')
          PY
      - name: Verify product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          php -l src/app/FunctionalHome.php
          php -l src/app/FunctionalWorkspace.php
          php -l src/app/FunctionalWorkspaceShell.php
          git diff --check
          grep -F '导入浏览器书签' src/app/FunctionalHome.php >/dev/null
          grep -F "'first_use'=>count(\$allAssets)===0" src/app/FunctionalHome.php >/dev/null
          test "$(grep -R -F 'placeholder=\"搜索我的互联网\"' src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php | wc -l | tr -d ' ')" -ge 4
          grep -F 'class="vf-global-search" action="surfaces.php"' src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'class="vf-mobile-command-search" action="surfaces.php"' src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'https://www.google.com/search?q=' src/app/FunctionalWorkspace.php >/dev/null
          test "$(cat src/VERSION.txt)" = 2.36.4
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-home.css src/assets/workspace-rebaseline.css | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          test "$(git diff --name-only -- database migrations src/migrations | wc -l | tr -d ' ')" = 0
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-home.css src/assets/workspace-rebaseline.css
          git commit -m 'feat(P01): productize first use and global search'
          git push origin HEAD:product/p01-first-use-global-search-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
