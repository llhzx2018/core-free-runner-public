name: S01 C02 Integrations Draft Discard Browser
on:
  push:
    branches: [task/s01-c02-1211097-discard-ui-gate-20261012]
permissions:
  contents: read
jobs:
  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_DIR: ${{ github.workspace }}/product
    steps:
      - name: Checkout registered test lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact integrations candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1c2167490c66a8c1558227a56bfde742ace61767
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Verify source and PHP
        run: |
          test "$(git -C product rev-parse HEAD)" = 1c2167490c66a8c1558227a56bfde742ace61767
          node --check product/assets/js/v13/system/integrations.js
          node --check product/tests/s01-c02-1211092-integrations-state-browser-proof.js
          php -l product/includes/admin-v13/views/integrations.php
          php product/tests/s01-c02-1211092-integrations-state-render.php
      - name: Install disposable Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise all integration states, discard, soft navigation and validation
        env:
          NODE_PATH: ${{ github.workspace }}/product/node_modules
        run: |
          cd product && node tests/s01-c02-1211092-integrations-state-browser-proof.js
          cd .. && node runner/lanes/s01-c02-integrations-discard-1097/browser.cjs
          echo S01_C02_INTEGRATIONS_DISCARD_CHROMIUM_PASS
