name: temp-s01-ops-dashboard-visible-ui-gate-20260908
on:
  push:
    branches:
      - temp/s01-page-update-center-v4-20260907
    paths:
      - .github/workflows/temp-s01-ops-dashboard-visible-ui-gate-20260908.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BRANCH: work/s01-ops-dashboard-visible-ui-20260908
      BASE_SHA: e00281249697d6acf4383833d800eec424fdc60c
      HEAD_SHA: 3b3efca0aa46f914fe4f7434a6acbad7724b06c6
    steps:
      - name: Validate Ops default workbench visible UI candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'GATE_MODE=READ_ONLY MAIN_WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO'
          rm -rf /tmp/ops
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops
          cd /tmp/ops
          git checkout -q "$BRANCH"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(tr -d '\r\n' < VERSION)" = '1.21.858'
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort)
          printf '%s\n' "${changed[@]}" >/tmp/changed
          printf '%s\n' assets/css/current/admin-current-dashboard.css tests/dashboard-visible-ui-contract.php | sort >/tmp/expected
          diff -u /tmp/expected /tmp/changed
          php -l includes/admin-v13/views/dashboard.php >/dev/null
          php tests/dashboard-visible-ui-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/admin-human-language-contract.php
          php tests/error-recovery-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/update-refresh-policy-current-contract.php
          php tests/visible-console-v2-contract.php
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(wc -c < assets/css/current/admin-current-dashboard.css)" -gt 10000
          ! grep -R 'vf-v659-' includes/admin-v13/views/dashboard.php assets/css/current/admin-current-dashboard.css
          echo 'PASS_S01_C02_DASHBOARD_VISIBLE_UI_GATE'
