name: P01 V2.27.0 Formal Artifact Gate
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-formal-artifact-gate-20260828.yml']
permissions:
  contents: read
env:
  CANDIDATE: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
  CANDIDATE_TREE: 6e9fb22d146b6b1e9ab276100331043c8ec647aa
  SOURCE_TAG: v2.26.0
  SOURCE_COMMIT: c97a362fc574cd80349526fca016f9e0e6a9c472
  SOURCE_TREE: 784fbbb4b3612145cdfa424659ddc6e843d3694b
  VERSION: 2.27.0
  SOURCE_VERSION: 2.26.0
  SCHEMA: '2026082801'
  RELEASE_SOURCE_GATE: '33180022275'
  OUT: /tmp/p01-v227-artifacts
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: candidate
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          path: production
      - name: Rebuild exact deterministic artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git -C production rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git clone -q --depth 1 --branch task/p01-v222-multi-surface-gate-20260828 https://github.com/llhzx2018/core-free-runner-public.git runner
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git proven
          python3 runner/scripts/p01-v227-build-artifacts.py | tee /tmp/p01-v227-build1.json
          php -l "$OUT/repair-v2.27.0.php" >/dev/null
          php "$OUT/repair-v2.27.0.php" --self-test | tee "$OUT/atomic-self-test.json"
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' "$OUT/atomic-self-test.json" >/dev/null
          test "$(unzip -Z1 "$OUT/VF_Start_V2.27.0_UPDATE.zip")" = 'repair-v2.27.0.php'
          SHA1=$(sha256sum "$OUT/VF_Start_V2.27.0_UPDATE.zip"|awk '{print $1}'); BYTES1=$(stat -c %s "$OUT/VF_Start_V2.27.0_UPDATE.zip")
          cp "$OUT/VF_Start_V2.27.0_UPDATE.zip" /tmp/p01-v227-alias-first.zip
          python3 runner/scripts/p01-v227-build-artifacts.py >/tmp/p01-v227-build2.json
          SHA2=$(sha256sum "$OUT/VF_Start_V2.27.0_UPDATE.zip"|awk '{print $1}'); BYTES2=$(stat -c %s "$OUT/VF_Start_V2.27.0_UPDATE.zip")
          test "$SHA1" = "$SHA2"; test "$BYTES1" = "$BYTES2"; cmp -s /tmp/p01-v227-alias-first.zip "$OUT/VF_Start_V2.27.0_UPDATE.zip"
          printf 'ASSET_SHA=%s\nASSET_BYTES=%s\n' "$SHA2" "$BYTES2" >> "$GITHUB_ENV"
          echo P01_V227_DETERMINISTIC_ARTIFACT=PASS
      - name: Actual V2.26.0 to V2.27.0 updater with data preservation and workspace operations
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v227-owner; COOKIE=/tmp/p01-v227-owner.cookies
          rm -rf "$ROOT" "$COOKIE"; cp -a production/src "$ROOT"
          php -S 127.0.0.1:18333 -t "$ROOT" >/tmp/p01-v227-owner.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18333/setup.php -o /tmp/p01-v227-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18333/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V227 Owner' --data-urlencode 'admin_password=P01V227!Owner' --data-urlencode 'admin_password_confirm=P01V227!Owner' -o /tmp/p01-v227-post.html
          test -f "$ROOT/app/.runtime.php"
          cat >/tmp/p01-v227-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v227-owner/app/bootstrap.php'; require_once '/tmp/p01-v227-owner/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $c=$r->createCategory(['name'=>'Keep','description'=>'','is_private'=>false]);
          $a=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Start','url'=>'https://example.com/start-v227','description'=>'keep','is_private'=>false,'is_favorite'=>true],'manual');
          $b=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Channel','url'=>'https://youtube.com/@keep-v227','description'=>'keep','is_private'=>true],'manual');
          $s->upsertProfile((int)$b['id'],['surface'=>'channels','resource_kind'=>'creator','background_friendly'=>true,'note'=>'preserve channel']);
          $w=$r->saveLink(null,['category_id'=>$c,'title'=>'Keep Watch','url'=>'https://example.com/watch-v227','description'=>'keep','is_private'=>true],'manual');
          $s->upsertProfile((int)$w['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>'2024','media_status'=>'want','note'=>'preserve watch']);
          file_put_contents('/tmp/p01-v227-ids',json_encode(['cat'=>$c,'start'=>$a['id'],'channel'=>$b['id'],'watch'=>$w['id']]));
          PHP
          php /tmp/p01-v227-seed.php
          cp "$OUT/repair-v2.27.0.php" "$ROOT/repair-v2.27.0.php"
          php "$ROOT/repair-v2.27.0.php" --verify-source="$ROOT" | tee /tmp/p01-v227-source.json | jq -e '.ok==true' >/dev/null
          php "$ROOT/repair-v2.27.0.php" --run="$ROOT" | tee /tmp/p01-v227-update.json
          jq -e '.ok==true and .already_current==false and .schema=="2026082801" and .integrity=="ok" and .fk==0' /tmp/p01-v227-update.json >/dev/null
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$VERSION"
          grep -F "define('VF_VERSION', '2.27.0');" "$ROOT/app/bootstrap.php" >/dev/null
          test -f "$ROOT/workspace-action.php"; test -f "$ROOT/assets/workspace.js"
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          php "$ROOT/cli/surface-verify.php" | tee /tmp/p01-v227-surface.txt; grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v227-surface.txt; grep -Fx 'WORKING_SCHEMA=2026082801' /tmp/p01-v227-surface.txt
          php "$ROOT/cli/baseline-verify.php" | tee /tmp/p01-v227-base.txt; grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v227-base.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v227-base.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/p01-v227-base.txt
          php -r '$ids=json_decode(file_get_contents("/tmp/p01-v227-ids"),true); require "/tmp/p01-v227-owner/app/bootstrap.php"; $p=vf_db(); $q=$p->prepare("SELECT title FROM links WHERE id=?"); foreach([["start","Keep Start"],["channel","Keep Channel"],["watch","Keep Watch"]] as $v){$q->execute([(int)$ids[$v[0]]]); if((string)$q->fetchColumn()!==$v[1])exit(1);} $q=$p->prepare("SELECT surface,note FROM resource_surface_profiles WHERE link_id=?"); $q->execute([(int)$ids["channel"]]); $x=$q->fetch(PDO::FETCH_ASSOC); if(($x["surface"]??"")!=="channels"||($x["note"]??"")!=="preserve channel")exit(2); $q->execute([(int)$ids["watch"]]); $x=$q->fetch(PDO::FETCH_ASSOC); if(($x["surface"]??"")!=="watch"||($x["note"]??"")!=="preserve watch")exit(3); echo "DATA_PRESERVED=YES\n";' | grep -Fx 'DATA_PRESERVED=YES'
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18333/api.php?action=login' --data '{"password":"P01V227!Owner"}' | jq -e '.ok==true' >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18333/surfaces.php -o /tmp/p01-v227-all.html
          grep -F '<h1>全部收藏</h1>' /tmp/p01-v227-all.html >/dev/null; grep -F 'data-open-add' /tmp/p01-v227-all.html >/dev/null; grep -F 'data-bulkbar' /tmp/p01-v227-all.html >/dev/null
          CSRF2=$(python3 - <<'PY'
          import re,json,html
          s=open('/tmp/p01-v227-all.html',encoding='utf-8').read();m=re.search(r'<script type="application/json" id="vf-workspace-data">(.*?)</script>',s,re.S);assert m;print(json.loads(html.unescape(m.group(1)))['csrf'])
          PY
          )
          CAT=$(jq -r '.cat' /tmp/p01-v227-ids)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18333/workspace-action.php --data-urlencode "csrf=$CSRF2" --data-urlencode 'action=create' --data-urlencode "category_id=$CAT" --data-urlencode 'title=Post Upgrade Added' --data-urlencode 'url=https://post-upgrade-v227.example.com' --data-urlencode 'surface=channels' --data-urlencode 'resource_kind=creator' --data-urlencode 'background_friendly=1' | tee /tmp/p01-v227-create.json | jq -e '.ok==true and .duplicate==false' >/dev/null
          NEW_ID=$(jq -r '.id' /tmp/p01-v227-create.json)
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST http://127.0.0.1:18333/workspace-action.php --data-urlencode "csrf=$CSRF2" --data-urlencode 'action=favorite' --data-urlencode "id=$NEW_ID" --data-urlencode 'favorite=1' | jq -e '.ok==true' >/dev/null
          php -r '$id=(int)$argv[1]; require "/tmp/p01-v227-owner/app/bootstrap.php"; $p=vf_db();$r=$p->query("SELECT is_favorite FROM links WHERE id=$id")->fetchColumn();$s=$p->query("SELECT surface FROM resource_surface_profiles WHERE link_id=$id")->fetchColumn(); if((int)$r!==1||$s!=="channels")exit(1);echo "POST_UPGRADE_WORKSPACE=PASS\n";' "$NEW_ID" | grep -Fx 'POST_UPGRADE_WORKSPACE=PASS'
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18333/channels.php -o /tmp/p01-v227-channels.html; grep -F 'Keep Channel' /tmp/p01-v227-channels.html >/dev/null; grep -F 'Post Upgrade Added' /tmp/p01-v227-channels.html >/dev/null
          curl -fsS -c "$COOKIE" -b "$COOKIE" http://127.0.0.1:18333/watch.php -o /tmp/p01-v227-watch.html; grep -F 'Keep Watch' /tmp/p01-v227-watch.html >/dev/null
          curl -fsS -c /tmp/p01-v227-anon.cookies http://127.0.0.1:18333/ -o /tmp/p01-v227-public.html; ! grep -F 'vf-app-sidebar' /tmp/p01-v227-public.html
          test "$(php -r "require '$ROOT/app/bootstrap.php';echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require '$ROOT/app/bootstrap.php';echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          echo P01_V227_ACTUAL_UPDATER=PASS
      - name: Rollback failure injection
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v227-rollback; rm -rf "$ROOT" /tmp/p01-v227-rb.cookies; cp -a production/src "$ROOT"
          php -S 127.0.0.1:18334 -t "$ROOT" >/tmp/p01-v227-rb.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS -c /tmp/p01-v227-rb.cookies -b /tmp/p01-v227-rb.cookies http://127.0.0.1:18334/setup.php -o /tmp/p01-v227-rb-setup.html && break || sleep 1; done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v227-rb-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v227-rb.cookies -b /tmp/p01-v227-rb.cookies -X POST http://127.0.0.1:18334/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Rollback' --data-urlencode 'admin_password=P01V227!Rollback' --data-urlencode 'admin_password_confirm=P01V227!Rollback' -o /tmp/p01-v227-rb-post.html
          cp "$OUT/repair-v2.27.0.php" "$ROOT/repair-v2.27.0.php"
          set +e; VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$ROOT/repair-v2.27.0.php" --run="$ROOT" >/tmp/p01-v227-rb-result.txt 2>&1; RC=$?; set -e
          test "$RC" -ne 0
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$SOURCE_VERSION"
          php "$ROOT/repair-v2.27.0.php" --verify-source="$ROOT" | jq -e '.ok==true' >/dev/null
          php "$ROOT/cli/verify.php" | grep -Fx 'VERIFY_PASS=YES'
          echo P01_V227_ROLLBACK=PASS
      - name: Formal metadata
        shell: bash
        run: |
          printf '{"version":"2.27.0","source_version":"2.26.0","schema":"2026082801","candidate":"%s","candidate_tree":"%s","source_commit":"%s","asset_name":"VF_Start_V2.27.0_UPDATE.zip","asset_bytes":%s,"asset_sha256":"%s","release_source_gate":%s,"status":"PASS"}\n' "$CANDIDATE" "$CANDIDATE_TREE" "$SOURCE_COMMIT" "$ASSET_BYTES" "$ASSET_SHA" "$RELEASE_SOURCE_GATE" > "$OUT/P01-V2.27.0-FORMAL-METADATA.json"
          jq -e --arg c "$CANDIDATE" --arg t "$CANDIDATE_TREE" --arg s "$SOURCE_COMMIT" --arg ah "$ASSET_SHA" --argjson ab "$ASSET_BYTES" '.candidate==$c and .candidate_tree==$t and .source_commit==$s and .version=="2.27.0" and .source_version=="2.26.0" and .asset_bytes==$ab and .asset_sha256==$ah and .status=="PASS"' "$OUT/P01-V2.27.0-FORMAL-METADATA.json" >/dev/null
          cat "$OUT/P01-V2.27.0-FORMAL-METADATA.json"
          echo P01_V227_FORMAL_ARTIFACT_GATE=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v227-formal-artifacts-${{ env.CANDIDATE }}
          path: /tmp/p01-v227-artifacts
          if-no-files-found: error
          retention-days: 7
