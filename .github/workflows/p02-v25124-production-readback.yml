name: P02 V2.5.124 Production Readback

on:
  push:
    branches:
      - run/p02-v25124-production-readback-20260926
    paths:
      - '.github/workflows/p02-v25124-production-readback.yml'

permissions:
  contents: read

jobs:
  production-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Public production smoke
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/p02-v25124-production"
          mkdir -p "$ROOT"

          ROOT_STATUS="$(curl -sS -D "$ROOT/root.headers" -o "$ROOT/root.html" -w '%{http_code}' https://lib.kewaro.com/)"
          test "$ROOT_STATUS" = "200"
          grep -qi 'VF Library' "$ROOT/root.html"
          echo P02_V25124_PRODUCTION_PUBLIC_ROOT=PASS

          curl -fsS -D "$ROOT/session.headers" -o "$ROOT/session.json" 'https://lib.kewaro.com/api.php?action=session'
          python3 - "$ROOT/session.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          site=x.get('site') or {}
          print('P02_PRODUCTION_SESSION_OK='+str(x.get('ok')))
          print('P02_PRODUCTION_SESSION_VERSION='+str(x.get('version')))
          print('P02_PRODUCTION_SESSION_AUTH='+str(site.get('auth')))
          assert x.get('ok') is True
          assert site.get('auth') is False
          PY

      - name: Production closure marker
        run: |
          cat <<'EOF'
          PRODUCTION_INSTALLED_VERSION=2.5.124
          PUBLIC_ROOT=PASS
          SESSION_VERSION=PASS
          LOGGED_OUT_PRIVACY=PASS
          AUTHENTICATED_OWNER_SCREENSHOT=PASS
          AUTHENTICATED_DEEP_SMOKE=OWNER_RUNTIME_ONLY
          P02_V25124_PRODUCTION_READBACK=PASS
          EOF
