name: P08 R184 exact v0.1.8 to 0.1.9 live private GitHub channel read-only discovery
on:
  pull_request:
    paths:
      - .github/workflows/p08-r184-v019-official-readonly-discovery-once.yml
permissions:
  contents: read
jobs:
  real-owner-updater-official-discovery:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r184-v019-real-channel-readback-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout one-time registered machine shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact published P08 v0.1.9 Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: b77c7e8563d93255f5f4a60bb8c5736a994d8151
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: PHP8.4 real curl HTTPS client
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Real official GitHub release and Atomic channel exact preflight readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = b77c7e8563d93255f5f4a60bb8c5736a994d8151
          test "$(gh api repos/llhzx2018/core-updates/git/ref/heads/main --jq .object.sha)" = e20dc8542d6ae623bb93d4bb8498ebf7cb8e2ce6
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.9 --jq .object.sha)" = b77c7e8563d93255f5f4a60bb8c5736a994d8151
          test "$(gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.9 --jq .id)" = 449880979
          echo P08_R184_OFFICIAL_TAG_CHANNEL_AND_RELEASE_REMOTE=PASS
      - name: Actual shipped PHP OwnerNextReleaseGateway live trusted discovery including deny cases
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/OwnerNextReleaseGateway.php';
          $token=(string)getenv('P08_PRIVATE_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('R184_PRIVATE_READER_REQUIRED');
          $gateway=new VF\AdOps\Upgrade\OwnerNextReleaseGateway();
          $base=[
              'version'=>'0.1.8',
              'source_sha'=>'76511f1b0263abf4de34dbfafd87b918eb60e209',
              'source_full_manifest_sha256'=>'fe0f25494df364811c1e58883e7f88c445f34229201dc8ea1e7594dd7c08fd90'
          ];
          $next=$gateway->check($token,$base);
          if(($next['status']??null)!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
              ||($next['target_version']??null)!=='0.1.9'
              ||($next['target_sha']??null)!=='b77c7e8563d93255f5f4a60bb8c5736a994d8151'
              ||($next['source_version']??null)!=='0.1.8'
              ||($next['source_sha']??null)!==$base['source_sha']
              ||($next['source_full_manifest_sha256']??null)!==$base['source_full_manifest_sha256']
              ||($next['asset_sha256']??null)!=='f849c4d5af96ef01727c732f4e1966083aea46cb1959da6b152197f63bf30bc7'
              ||($next['can_install']??true)!==false){
              throw new RuntimeException('R184_REAL_018_OFFICIAL_NEXT_INTAKE_MISMATCH');
          }
          echo "P08_R184_OWNER_PHP_018_OFFICIAL_019_METADATA_VERIFIED_NOT_STAGED=PASS\n";
          $current=$base;
          $current['version']='0.1.9';
          $current['source_sha']='b77c7e8563d93255f5f4a60bb8c5736a994d8151';
          $current['source_full_manifest_sha256']=str_repeat('a',64);
          $same=$gateway->check($token,$current);
          if(($same['status']??null)!=='OFFICIAL_VERSION_CURRENT'
              ||($same['can_install']??true)!==false)throw new RuntimeException('R184_CURRENT_VERSION_NO_APPLY_INVALID');
          echo "P08_R184_OWNER_PHP_019_SAME_VERSION_NO_DOWNGRADE=PASS\n";
          foreach (['source_sha'=>str_repeat('f',40),
                    'source_full_manifest_sha256'=>str_repeat('a',64)] as $field=>$wrong){
              $bad=$base;
              $bad[$field]=$wrong;
              try{
                  $gateway->check($token,$bad);
                  throw new RuntimeException('R184_UNTRUSTED_SOURCE_WAS_ACCEPTED');
              }catch(RuntimeException $e){
                  if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
              }
          }
          echo "P08_R184_WRONG_SOURCE_AND_OLD_MANIFEST_REJECTED=PASS\n";
          echo "P08_R184_NO_DOWNLOAD_NO_BACKUP_NO_APPLY_NO_PRODUCTION=PASS\n";
          PHP
      - name: Delete all transient private source
        if: always()
        shell: bash
        run: |
          rm -rf -- p08
          test ! -e p08
