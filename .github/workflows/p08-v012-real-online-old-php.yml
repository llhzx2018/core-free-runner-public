name: P08 v0.1.12 actual issued v010 PHP live GitHub official legacy Offer
on:
  pull_request:
    paths:
      - .github/workflows/p08-v012-real-online-old-php.yml
permissions:
  contents: read
jobs:
  old-shipped-php-real-online-github:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v012-final-live-discovery-20261119' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout genuinely issued v0.1.10 PHP client unchanged and unprivileged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ef78dcb21117c822e2756360280f2418f794704f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: PHP 8.4 with real HTTPS cURL and OpenSSL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl,openssl
          coverage: none
      - name: Independently verify CURRENT official issued v012 tag, release, channel blob and remote ZIP metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p08 rev-parse HEAD)" = ef78dcb21117c822e2756360280f2418f794704f
          test "$(gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .sha)" = a61e3e9dc2fb27c0ebd467d21634fc07fa0963ec
          test "$(gh api repos/llhzx2018/vf-adops/git/ref/tags/v0.1.12 --jq .object.sha)" = dac7bc1d5410c077f32e522eb5740537f618ef9d
          gh api repos/llhzx2018/vf-adops/releases/tags/v0.1.12 --jq '{id,tag_name,draft,prerelease}' > "$RUNNER_TEMP/r212-official-release.json"
          gh api repos/llhzx2018/core-updates/contents/projects/P08-ADOPS.json --jq .content | base64 -d > "$RUNNER_TEMP/r212-channel.json"
          python3 - "$RUNNER_TEMP/r212-channel.json" "$RUNNER_TEMP/r212-official-release.json" <<'PY'
          import hashlib,json,sys
          c=json.load(open(sys.argv[1]));r=json.load(open(sys.argv[2]))
          assert c['from_versions']==['0.1.10']
          assert c['target_version']=='0.1.12' and c['target_sha']=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
          assert c['source_sha']=='ef78dcb21117c822e2756360280f2418f794704f'
          assert c['source_full_manifest_sha256']=='efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9'
          assert c['asset_sha256']=='9a80f880a9cfbd22efce35383ee933766100e936fc6f99f89272237dd4e0ab56' and c['asset_bytes']==8338181
          assert c['full_asset_sha256']=='721aaad6ae41d1faedff80f06a78320d3bb86faf26ccd0f4917e5d4a2d94cca6'
          assert c['asset_name']=='VF_AdOps_V0.1.12_UPDATE.zip'
          assert c['full_asset_name']=='VF_AdOps_V0.1.12_FULL.zip'
          assert c['production_auto_apply'] is False and c['backup_required'] is True and c['rollback_supported'] is True
          assert r['tag_name']=='v0.1.12' and not r['draft'] and not r['prerelease']
          assert r['id']==c['release_id'] and r['id']>450980192
          print('P08_R212_REAL_PUBLISHED_LEGACY_CHANNEL_AND_RELEASE=PASS')
          PY
      - name: Run real published offer through old v010 PHP and reject wrong clean source/versions
        shell: bash
        env:
          P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);
          require 'p08/src/Upgrade/OwnerNextReleaseGateway.php';
          $token=(string)getenv('P08_PRIVATE_READ_TOKEN');
          if(strlen($token)<20)throw new RuntimeException('P08_R212_READ_SECRET_MISSING');
          $gw=new VF\AdOps\Upgrade\OwnerNextReleaseGateway();
          $installed=[
            'version'=>'0.1.10',
            'source_sha'=>'ef78dcb21117c822e2756360280f2418f794704f',
            'source_full_manifest_sha256'=>'efebfefde3115864dba71c2e56fedae2f7ada8ad4064010473d716b689f67fe9'
          ];
          $next=$gw->check($token,$installed);
          if(($next['status']??null)!=='OFFICIAL_NEXT_VERIFIED_NOT_STAGED'
             ||($next['source_version']??null)!=='0.1.10'
             ||($next['target_version']??null)!=='0.1.12'
             ||($next['source_sha']??null)!==$installed['source_sha']
             ||($next['target_sha']??null)!=='dac7bc1d5410c077f32e522eb5740537f618ef9d'
             ||($next['source_full_manifest_sha256']??null)!==$installed['source_full_manifest_sha256']
             ||($next['can_install']??true)!==false
             ||($next['asset_sha256']??null)!=='9a80f880a9cfbd22efce35383ee933766100e936fc6f99f89272237dd4e0ab56'
             ||($next['asset_id']??null)!==766931637
             ||($next['release_id']??null)!==451081173) {
            throw new RuntimeException('P08_R212_OLD_CLIENT_REAL_OFFICIAL_LEGACY_OFFER_MISMATCH');
          }
          echo "P08_R212_REAL_ISSUED_010_PHP_LEGACY_TO_012_NEXT_OFFER=PASS\n";
          $current=$installed;
          $current['version']='0.1.12';
          $current['source_sha']='dac7bc1d5410c077f32e522eb5740537f618ef9d';
          $current['source_full_manifest_sha256']=str_repeat('d',64);
          $already=$gw->check($token,$current);
          if(($already['status']??null)!=='OFFICIAL_VERSION_CURRENT'
             ||($already['can_install']??true)!==false)
             throw new RuntimeException('P08_R212_REINSTALL_DOWNGRADE_REFUSED_FAILURE');
          echo "P08_R212_NEW_VERSION_NO_REPEAT_NO_DOWNGRADE=PASS\n";
          $wrong=[
            'source_sha'=>str_repeat('a',40),
            'source_full_manifest_sha256'=>'ab7f6b6f5e484c8efdf96d1b0a531b114d2ac1b1a3b45e52a072345a2ea0f110'
          ];
          foreach($wrong as $field=>$v){
            $bad=$installed;$bad[$field]=$v;
            try{$gw->check($token,$bad);throw new RuntimeException('P08_R212_UNSUPPORTED_SOURCE_ACCEPTED');}
            catch(RuntimeException $e){
              if($e->getMessage()!=='P08_NEXT_SOURCE_OR_SCHEMA_UNSUPPORTED')throw $e;
            }
          }
          echo "P08_R212_LEGITIMATE_CLEAN_010_NOT_WRONGLY_CLAIMED_COMPATIBLE=PASS\n";
          echo "P08_R212_NO_DOWNLOAD_NO_APPLY_NO_PRODUCTION_WRITE=PASS\n";
          PHP
      - name: Dispose checkout and onetime channel/metadata
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 "$RUNNER_TEMP/r212-channel.json" "$RUNNER_TEMP/r212-official-release.json"
          test ! -e p08
