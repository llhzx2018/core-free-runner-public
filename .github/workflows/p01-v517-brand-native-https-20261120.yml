name: P01 v517 full native HTTPS SQLite plus logo favicon media restore
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  p01-owner-brand-https-stage:
    if: github.head_ref == 'test/p01-v517-brand-native-https-20261120' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Bind one exact private product revision; public-safe synthetic input
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          echo P01_TEST_FIXTURES=SYNTHETIC_ONLY
          echo P01_REAL_OWNER_PRIVATE_BACKUP_ON_PUBLIC_RUNNER=NO
          echo P01_PRODUCTION_AND_OWNER_CLOUDPANEL_WRITES=NO
      - name: Transient checkout exact private P01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 49c7fe38e8683a56b96ed6dba1b273be1d5cd728
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Exact branch and test code identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "49c7fe38e8683a56b96ed6dba1b273be1d5cd728"
          test "$(cat candidate/VERSION)" = "2.47.517"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.517"
          python3 -m py_compile candidate/tests/compatibility/laravel/http/owner_sqlite_restore_https.py candidate/tests/compatibility/laravel/http/owner_media_restore_https.py
          echo P01_EXACT_BRANDED_OWNER_HTTPS_TEST_SOURCE=PASS
      - name: Install independent native Nginx PHP-FPM SQLite ZIP Composer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx openssl curl unzip composer php8.3-cli php8.3-fpm \
            php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-xml \
            php8.3-curl php8.3-zip >/dev/null
          command -v nginx
          command -v php-fpm8.3
          command -v composer
          php -r 'if(PHP_VERSION_ID<80300||!in_array("sqlite",PDO::getAvailableDrivers(),true)||!class_exists(ZipArchive::class)||!extension_loaded("fileinfo"))exit(2);'
          echo P01_NATIVE_NGINX_PHP_SQLITE_ZIP=PASS
      - name: Pinned Node 22 and lock-based source dependencies
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build true self-contained Laravel FULL with bundled vendor and Vite
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha 49c7fe38e8683a56b96ed6dba1b273be1d5cd728 \
            --output /tmp/p01-v517-real-brand-https-clean.zip
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip /tmp/p01-v517-real-brand-https-clean.zip
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip /tmp/p01-v517-real-brand-https-clean.zip \
            --output /tmp/p01-v517-real-brand-https-cloudpanel.zip
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip /tmp/p01-v517-real-brand-https-cloudpanel.zip
          echo P01_REAL_PACKAGED_LARAVEL_V517_BRAND_HTTPS_BUILD=PASS
      - name: Real installed TLS Nginx PHP-FPM session, SQL, 5-file brand ZIP and readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 tests/compatibility/laravel/http/run_cloudpanel_fpm_full_stage.py \
            --bundle /tmp/p01-v517-real-brand-https-cloudpanel.zip \
            --engine sqlite --only-owner-media-restore
          echo P01_REAL_INSTALLED_LARAVEL_OWNER_BRAND_HTTPS_RECOVERY=PASS
      - name: Always wipe transient private checkout and generated packages
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- /tmp/p01-v517-real-brand-https-clean.zip /tmp/p01-v517-real-brand-https-cloudpanel.zip
          echo P01_PUBLIC_PERSISTED_PRIVATE_INPUTS=NONE
          echo P01_TEMPORARY_SOURCE_PACKAGE_REMOVED=YES
