name: P07 Public Terminal UX V3
on:
  pull_request:
    paths:
      - 'installers/p07-*.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'installers/p07-vpscheck.sh'
      - 'installers/p07.sh'
      - 'installers/p07-system-care.sh'
      - 'experiments/p07-*.sh'
      - 'packages/p07-network-node/**/vf-node.sh'
      - 'packages/p07-system-care/**/vf-system-care.sh'
      - 'docs/authority/P07_TERMINAL_UX_ADOPTION.md'
      - 'docs/authority/P07_PUBLIC_INSTALL_CONTRACT.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/ux-reviews/**'
      - 'scripts/check_p07_public_terminal_ux.py'
      - 'scripts/check_p07_public_install_contract.py'
      - 'tests/test_p07_public_terminal_ux.py'
      - 'tests/test_p07_public_install_contract.py'
      - 'tests/test_p07_public_toolbox_menu_v3_20261118.py'
      - 'tests/test_p07_five_official_owner_route.py'
      - 'tests/test_p07_five_ux_rollback_current.py'
      - 'installers/p07-three-ux-owner-route.py'
      - 'installers/p07-m03-release140-atomic.sh'
      - 'installers/p07-m03-release142-atomic.sh'
      - 'installers/p07-m03-release144-atomic.sh'
      - 'installers/p07-m03-release145-atomic.sh'
      - 'installers/p07-m03-release146-atomic.sh'
      - 'tests/test_p07_m03_release142_public_distribution.py'
      - 'scripts/build_p07_ux_prepublication_candidates.py'
      - 'tests/test_p07_ux_prepublication_bundles.py'
      - 'tests/test_p07_m01_m02_m04_terminal_ux_candidates.py'
      - '.github/workflows/p07-public-terminal-ux-v3.yml'
  push:
    branches: [main]
    paths:
      - 'docs/authority/P07_TERMINAL_UX_ADOPTION.md'
      - 'docs/authority/P07_PUBLIC_INSTALL_CONTRACT.md'
      - 'AGENTS.md'
      - 'README.md'
      - 'scripts/check_p07_public_terminal_ux.py'
      - 'scripts/check_p07_public_install_contract.py'
      - 'tests/test_p07_public_terminal_ux.py'
      - 'tests/test_p07_public_install_contract.py'
      - '.github/workflows/p07-public-terminal-ux-v3.yml'
permissions:
  contents: read
jobs:
  p07-public-terminal-ux:
    name: P07 public toolbox UX authority and PR diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public P07 UX authority and positive-negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B scripts/check_p07_public_install_contract.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_install_contract.py' -q
          python3 -B scripts/check_p07_public_terminal_ux.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_terminal_ux.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_public_toolbox_menu_v3_20261118.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_five_official_owner_route.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_five_ux_rollback_current.py' -q
          bash -n installers/p07-m03-release140-atomic.sh installers/p07-m03-release141-atomic.sh installers/p07-m03-release142-atomic.sh installers/p07-m03-release144-atomic.sh installers/p07-toolbox.sh
          bash -n installers/p07-m03-release145-atomic.sh
          bash -n installers/p07-m03-release146-atomic.sh
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_release141_public_distribution.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m03_release142_public_distribution.py' -q
          python3 -B -m py_compile installers/p07-three-ux-owner-route.py
          python3 -B -m unittest discover -s tests -p 'test_p07_ux_prepublication_bundles.py' -q
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_m02_m04_terminal_ux_candidates.py' -q
          bash -n packages/p07-network-node/0.1.0-ux3/vf-node.sh experiments/p07-vps-audit-v21-ux3.sh packages/p07-system-care/0.1.0-ux5/vf-system-care.sh
          bash -n packages/p07-network-node/0.1.0-ux2/vf-node.sh experiments/p07-vps-audit-v21-ux2.sh
          (cd packages/p07-network-node/0.1.0-ux2 && sha256sum -c MANIFEST.sha256)
          python3 -B -m unittest discover -s tests -p 'test_p07_m01_m02_original_versions.py' -q
      - name: Block unreviewed changed public P07 terminal UI
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          python3 -B scripts/check_p07_public_terminal_ux.py --base-ref "$BASE_SHA"
          echo P07_PUBLIC_TERMINAL_UX_V3_PR_GATE=PASS
