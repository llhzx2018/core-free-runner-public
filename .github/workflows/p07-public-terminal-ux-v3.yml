name: P07 Public Terminal UX V3
on:
  pull_request:
    paths:
      - 'installers/p07-*.sh'
      - 'installers/p07-toolbox.sh'
      - 'installers/vf-node.sh'
      - 'installers/p07-vpscheck.sh'
      - 'installers/p07.sh'
      - 'installers/p07-system-care.sh'
      - 'experiments/p07-*.sh'
      - 'docs/authority/P07_TERMINAL_UX_ADOPTION.md'
      - 'docs/ux-reviews/**'
      - 'scripts/check_p07_public_terminal_ux.py'
      - 'tests/test_p07_public_terminal_ux.py'
      - '.github/workflows/p07-public-terminal-ux-v3.yml'
  push:
    branches: [main]
    paths:
      - 'docs/authority/P07_TERMINAL_UX_ADOPTION.md'
      - 'scripts/check_p07_public_terminal_ux.py'
      - 'tests/test_p07_public_terminal_ux.py'
      - '.github/workflows/p07-public-terminal-ux-v3.yml'
permissions:
  contents: read
jobs:
  p07-public-terminal-ux:
    name: P07 public toolbox UX authority and PR diff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact public source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify public P07 UX authority and positive-negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B scripts/check_p07_public_terminal_ux.py
          python3 -B -m unittest discover -s tests -p 'test_p07_public_terminal_ux.py' -q
      - name: Block unreviewed changed public P07 terminal UI
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          python3 -B scripts/check_p07_public_terminal_ux.py --base-ref "$BASE_SHA"
          echo P07_PUBLIC_TERMINAL_UX_V3_PR_GATE=PASS
