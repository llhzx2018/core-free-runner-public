name: P01 YouTube PR1559 One-Time Exact Source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-youtube-1559-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: p01-youtube-1559-exact-source
  cancel-in-progress: false

jobs:
  verify:
    # Never run private-source checkout on fork contributions.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-start
      PRODUCT_SHA: 2689f7437239dadb2b53d77c2f86a4acd0f314c2
      BASELINE_TAG: v2.47.401
    steps:
      - name: Checkout public runner controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exact PHP extensions in isolated hosted runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, simplexml, mbstring, openssl, zip
          coverage: none

      - name: Bind private exact source without publishing source or credentials
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          WORK="${RUNNER_TEMP}/p01-1559"
          mkdir -p "$WORK"
          chmod 700 "$WORK"
          echo "P01_TEST_WORK=$WORK" >> "$GITHUB_ENV"
          git clone --quiet --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$WORK/candidate"
          git -C "$WORK/candidate" checkout --quiet --detach "$PRODUCT_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/${PRODUCT_REPOSITORY}.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$PRODUCT_SHA"
          git clone --quiet --depth 1 --branch "$BASELINE_TAG" "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$WORK/stable"
          git -C "$WORK/stable" remote set-url origin "https://github.com/${PRODUCT_REPOSITORY}.git"
          test "$(tr -d '\r\n ' < "$WORK/stable/VERSION")" = '2.47.401'
          test "$(git -C "$WORK/candidate" status --porcelain)" = ''
          echo "P01_YOUTUBE_EXACT_SOURCE_BIND=PASS"

      - name: Scope syntax and authentic PHP-extension preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_WORK/candidate"
          php -m | grep -Fix curl
          php -m | grep -Fix mbstring
          php -m | grep -Fix SimpleXML
          php -m | grep -Fix pdo_sqlite
          php -l src/app/YouTubeApiFallback.php
          php -l src/app/YouTubeManualUpdates.php
          php -l tests/unit/youtube_api_fallback_native.php
          php -l tests/unit/youtube_manual_updates_cache_native.php
          node --check src/assets/channel-youtube-updates.js
          echo "P01_YOUTUBE_NATIVE_EXTENSIONS_AND_SYNTAX=PASS"

      - name: Native YouTube focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_TEST_WORK/candidate"
          unset VF_YOUTUBE_API_KEY
          php tests/unit/youtube_api_fallback_native.php
          php tests/unit/youtube_manual_updates_cache_native.php
          echo "P01_YOUTUBE_1559_FOCUSED_NATIVE=PASS"

      - name: Full canonical unit regression against formal stable baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$P01_TEST_WORK/candidate/tests/canonical_release_regression.sh"             "$P01_TEST_WORK/candidate" "$P01_TEST_WORK/stable" --require-zero-debt             | tee "$P01_TEST_WORK/regression.txt"
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' "$P01_TEST_WORK/regression.txt"
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' "$P01_TEST_WORK/regression.txt"
          test "$(git -C "$P01_TEST_WORK/candidate" status --porcelain)" = ''
          echo "P01_YOUTUBE_1559_CANONICAL=PASS"

      - name: Public-safe conclusion and cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "${P01_TEST_WORK:-}" ]; then rm -rf -- "$P01_TEST_WORK"; fi
          echo "P01_ONE_SHOT_NO_PRIVATE_ARTIFACT=PASS"
