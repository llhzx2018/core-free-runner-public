name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-article-reading159-20261021]
    paths: ['.github/workflows/s01-article-reading-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.159
  TARGET_SHA: 81338ba905c3b57b62e9531a2f7d906cfbb778ed
  UPDATE_SHA: f915dd7bd2ba7a28b2a1b70c9df5f2facb9c3635
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: f915dd7bd2ba7a28b2a1b70c9df5f2facb9c3635
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='031f216552632ec9f50c70eb4c803fe93f712021096e140ff4163223a29cb89a' and m['asset_bytes']==1972334
          assert m['runtime_files']==476 and '1.35.158' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
