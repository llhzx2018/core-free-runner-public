name: Core Updates P01 V2.47.134 Distribution Gate

on:
  push:
    branches:
      - test-core-updates-p01-v247134-20260930
    paths:
      - '.github/workflows/temp-core-updates-p01-v247134.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: 2e776e58f8f546c760bd89255367ed1a913a3834
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Manifest contract
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          jq -e '
            .project_id=="P01" and
            .current_version=="2.47.133" and
            .target_version=="2.47.134" and
            .release_tag=="v2.47.134" and
            .release_id==399964652 and
            .product_identity=="4629d9d353ddc7dfae0379ee677bcb344e141da9" and
            .asset_name=="VF_Start_V2.47.134_UPDATE.zip" and
            .asset_bytes==2068296 and
            .asset_sha256=="017b2407c4250777af5b940ed0284eae0c94aa3536719081b8e1faf11ee45736"
          ' projects/P01.json >/dev/null
          echo CORE_UPDATES_P01_V247134_MANIFEST=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          echo CORE_UPDATES_P01_V247134_PHP_LINT=PASS

      - name: Update Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          php update-core/php/tests/run.php
          echo CORE_UPDATES_P01_V247134_REGRESSION=PASS
