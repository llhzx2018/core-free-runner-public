name: P01 D45 real Owner navigation inbox three-engine CloudPanel HTTP
on:
  push:
    branches:
      - test/p01-d45-links-nav-inbox-3db-20261113

permissions:
  contents: read

jobs:
  real-owner-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p01-only-synthetic-test
          MYSQL_DATABASE: p01_d1_test_mysql_20261111
        ports:
          - 3306:3306
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: p01-only-synthetic-test
          MARIADB_DATABASE: p01_d1_test_maria_20261111
        ports:
          - 3307:3306
    steps:
      - name: Bound synthetic route and source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-d45-links-nav-inbox-3db-20261113"
          echo P01_D45_PRODUCTION_AND_RELEASE_WRITES=NONE

      - name: Registered private source read ability
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          test -n "$READ_TOKEN"
          echo P01_D45_TEMP_PRIVATE_READ=AVAILABLE

      - name: Exact private P01 source ephemeral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: d21ff9743c20766d6bea7c6a2a74775682a8e774
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate

      - name: Install actual PHP FPM Nginx Composer runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            nginx php8.3-fpm php8.3-cli php8.3-mysql php8.3-sqlite3 \
            php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip \
            composer openssl unzip >/dev/null
          command -v php-fpm8.3
          command -v nginx
          command -v composer

      - name: Exact source and new HTTP business lint
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "d21ff9743c20766d6bea7c6a2a74775682a8e774"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          for src in \
            candidate/src/app/next/OwnerLinkWorkspace.php \
            candidate/src/app/next/D2CanonicalConnectionScope.php \
            candidate/src/app/next/OwnerDataRuntime.php \
            candidate/src/app/next/http/OwnerHttpRoutes.php; do
            php -l "$src"
          done
          python3 -m py_compile candidate/tests/compatibility/laravel/http/run_d45_owner_links_http.py
          python3 candidate/tests/architecture/test_p01_navigation_parity.py
          python3 candidate/scripts/check_p01_fullstack_contract.py --database-schema
          echo P01_D45_CURRENT_SQLITE_SET_NULL_PARITY_SOURCE=PASS
          echo P01_D45_SOURCE_AND_SYNTAX=PASS

      - name: Genuine Laravel Composer plus Vite self-contained FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/build_p01_next_clean_full.py build \
            --source-sha d21ff9743c20766d6bea7c6a2a74775682a8e774 \
            --output "$RUNNER_TEMP/p01-d45-full.zip" --composer composer
          python3 scripts/build_p01_next_clean_full.py verify \
            --zip "$RUNNER_TEMP/p01-d45-full.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py build \
            --source-zip "$RUNNER_TEMP/p01-d45-full.zip" \
            --output "$RUNNER_TEMP/p01-d45-cloudpanel.zip"
          python3 scripts/build_p01_next_cloudpanel_full.py verify \
            --zip "$RUNNER_TEMP/p01-d45-cloudpanel.zip"
          echo P01_D45_REAL_SELF_CONTAINED_FULL_VERIFIED=PASS

      # TypeScript/Vitest/19 Chromium E2E at 390/768/1440 already
      # passed on source b611d66c, with byte-identical frontend inputs.
      # D45 migration-only change must NOT repeat unchanged browser proof.

      - name: Genuine MariaDB 11.8 Owner capture archive and 27-record cursor
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d45_owner_links_http.py \
            --bundle "$RUNNER_TEMP/p01-d45-cloudpanel.zip" --engine mariadb

      - name: Genuine SQLite Owner capture archive and 27-record cursor
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d45_owner_links_http.py \
            --bundle "$RUNNER_TEMP/p01-d45-cloudpanel.zip" --engine sqlite

      - name: Genuine MySQL 8.4 Owner capture archive and 27-record cursor
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 candidate/tests/compatibility/laravel/http/run_d45_owner_links_http.py \
            --bundle "$RUNNER_TEMP/p01-d45-cloudpanel.zip" --engine mysql

      - name: Ephemeral private source and binary cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP/p01-d45-full.zip" "$RUNNER_TEMP/p01-d45-cloudpanel.zip"
          echo P01_D45_PRIVATE_SOURCE_PERSISTED=NO
          echo P01_D45_RELEASE_OR_TEST_ZIP_PERSISTED=NO
