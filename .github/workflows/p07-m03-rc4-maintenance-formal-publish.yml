# One exact Owner-authorized Mode AC issuance. PR checks never write a release.
# Main publication is a separate normal merge; the public toolbox pin stays RC3.
name: P07-M03 RC4 isolated maintenance formal publication
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p07-m03-rc4-maintenance-formal-publish.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/p07-m03-rc4-maintenance-formal-publish.yml
permissions:
  contents: read
jobs:
  exact-mode-ac-issue:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'llhzx2018' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'release/p07-m03-rc4-maintenance-issue-20261126') ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'P07 M03 RC4 maintenance formal publish')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
      SOURCE_TREE: 'f2d25b3ccbc7d262fcfabf6a8cd8b139c8cd762b'
      PRODUCT_MAIN: '5c0cc6009725ecbb3b0f244183ccb78bbd52faf1'
      GOV_MAIN: '20631614c585aab137c7be89828f21408697491f'
      PUBLIC_CANDIDATE: 'e6a3bbac7de26e9b37f179605dd308d1ac0a5a4c'
      RELEASE_TAG: 'p07-m03-v0.1.0-release147-rc4-maintenance-20261125'
      ASSET: 'P07-M03-0.1.0-release147-rc4-MAINTENANCE.zip'
      EXPECTED_SHA: '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238'
      MANIFEST_BLOB: '3ab5b43f6f9e3431872f96bbfbffc83733f5b6a4'
      INSTALLER_BLOB: '309e32a0acd3903b05b84f3204db07fb6f55d638'
      OLD_SHA: '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d'
      OLD_TAG: 'p07-m03-v0.1.0-release147-rc3-ownertrial-20261123'
      OLD_ASSET: 'P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip'
    steps:
      - name: Exact publisher checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact reviewed public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'e6a3bbac7de26e9b37f179605dd308d1ac0a5a4c'
          path: public-candidate
          persist-credentials: false
      - name: Exact effective product authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: '5c0cc6009725ecbb3b0f244183ccb78bbd52faf1'
          fetch-depth: 0
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact effective GOV authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: '20631614c585aab137c7be89828f21408697491f'
          path: transient-gov
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify final identity and actual CLI delivery structure
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_MAIN"
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_MAIN"
          test "$(git -C public-candidate rev-parse HEAD)" = "$PUBLIC_CANDIDATE"
          git -C transient-p07 merge-base --is-ancestor "$SOURCE_SHA" "$PRODUCT_MAIN"
          test "$(git -C transient-p07 rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          test "$(git -C transient-p07 diff --name-only "$SOURCE_SHA" "$PRODUCT_MAIN")" = "docs/authority/ACCEPTANCE_MATRIX.md"
          test "$(git hash-object installers/p07-toolbox.sh)" = '45b37be100fd1ac1f3b15e445829956dc33a5ba9'
          test "$(git hash-object public-candidate/installers/p07-toolbox.sh)" = '3cf8bc9e7727778e43a35262e58517d47526a7e1'
          test "$(git hash-object public-candidate/installers/p07-m03-ownertrial147rc4-atomic.sh)" = '688f83adbfed530583644f9e5ad2ae32f20fa483'
          grep -Fqx 'M03_OWNER_TRIAL_BUILD="0.1.0-release147-rc3"' installers/p07-toolbox.sh
          grep -Fqx 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release146"' installers/p07-toolbox.sh
          mkdir -m 700 "$RUNNER_TEMP/rc4-issue"
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          src=root/"transient-p07"
          gov=root/"transient-gov"
          case=(gov/"governance/release/cases/P07_M03_RC4_INDEPENDENT_RC3_MAINTENANCE_20261125.md").read_text()
          current=(gov/"CURRENT.md").read_text()
          matrix=(src/"docs/authority/ACCEPTANCE_MATRIX.md").read_text().split("## RP-07AC",1)[1].split("\n## ",1)[0]
          assert "| skill-release | V3.29 |" in current
          assert os.environ["SOURCE_SHA"] in current
          for body in (case,matrix):
              for key in ("SOURCE_SHA","EXPECTED_SHA","MANIFEST_BLOB","INSTALLER_BLOB"):
                  assert os.environ[key] in body
              assert "719295" in body
          receipt={"schema":"vf.public-authority.task-delivery-check.v1","project":"P07",
            "source":os.environ["PRODUCT_MAIN"],
            "project_authority":{"agents":"AGENTS.md","current":"docs/authority/CURRENT.md","acceptance":"docs/authority/ACCEPTANCE_MATRIX.md","applicability":"docs/authority/PUBLIC_AUTHORITY_APPLICABILITY.md"},
            "acceptance_markers":["P07-PUBLIC-01","P07-PUBLIC-03"],
            "delivery":{"profile":"cli_one_command","entrypoint":"p07-toolbox.sh","artifact":"installers/p07-toolbox.sh","sha256":hashlib.sha256((root/"public-candidate/installers/p07-toolbox.sh").read_bytes()).hexdigest(),"requires_git":False,"requires_manual_source_copy":False},
            "required_domains":["INSTALL","UPGRADE","SECURITY","TESTING","DATA_SCHEMA","GIT","UA_UI","API_PROVIDER","OBSERVABILITY"],
            "task_capabilities":["installer","existing_install_transition","candidate","restore","release_source","installer_ui","external_api","upgrade_visibility"]}
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"rc4-issue/delivery.json").write_text(json.dumps(receipt))
          PY
          python3 -B transient-gov/governance/public-authority/tools/task_delivery_contract_lint.py --phase delivery \
            --receipt "$RUNNER_TEMP/rc4-issue/delivery.json" --project-root "$GITHUB_WORKSPACE/transient-p07" \
            --artifact-root "$GITHUB_WORKSPACE/public-candidate" \
            --public-router "$GITHUB_WORKSPACE/transient-gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.json"
          echo P07_RC4_EFFECTIVE_FINAL_IDENTITY_AND_DELIVERY=PASS
      - name: Reconstruct only the exact verified official artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          root="$RUNNER_TEMP/rc4-issue"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 1 --connect-timeout 10 --max-time 100 "https://github.com/llhzx2018/core-free-runner-public/releases/download/$OLD_TAG/$OLD_ASSET" -o "$root/old.zip"
          printf '%s  %s\n' "$OLD_SHA" "$root/old.zip" | sha256sum -c -
          git -C transient-p07 checkout --detach "$SOURCE_SHA" >/dev/null 2>&1
          test "$(git -C transient-p07 rev-parse HEAD)" = "$SOURCE_SHA"
          (cd transient-p07 && python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$root/old.zip" --source . --source-sha "$SOURCE_SHA" --output "$root/$ASSET" >"$root/build.json")
          printf '%s  %s\n' "$EXPECTED_SHA" "$root/$ASSET" | sha256sum -c -
          test "$(wc -c < "$root/$ASSET")" -eq 719295
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          r=pathlib.Path(os.environ["RUNNER_TEMP"])/"rc4-issue"
          e=os.environ
          p=r/e["ASSET"]
          blob=lambda b:hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert blob(z.read("dist/p07/0.1.0/overlay/RUNTIME.gitblob"))==e["MANIFEST_BLOB"]
              assert blob(z.read("installers/p07-final.sh"))==e["INSTALLER_BLOB"]
              assert z.read("dist/p07/0.1.0/overlay/BUILD_ID")==b"0.1.0-release147-rc4\n"
          a=json.loads((r/"build.json").read_text())
          assert a["source_sha"]==e["SOURCE_SHA"] and a["candidate_sha256"]==e["EXPECTED_SHA"]
          assert not a["formal_release"] and not a["public_distribution"]
          # Scope-specific preissue evidence; final remote readback is separate.
          domains={
            "INSTALL":"PASS: real fresh package and actual public entry",
            "UPGRADE":"PASS: genuine RC3, 66 signed caches, reentry, atomic rollback",
            "SECURITY":"PASS: exact package allowlist, bad identities, unsigned cache, unsafe permissions, isolation",
            "TESTING":"PASS: 40 product, 62 public regression, 11 actual entry union",
            "DATA_SCHEMA":"PASS: unchanged SQLite and native/Docker MariaDB recovery; no schema or migration promotion",
            "GIT":"PASS_PREISSUE: normal source and paired authority merge, exact tree; tag and remote verification separate",
            "UA_UI":"PASS: actual terminal, NO_COLOR, non-TTY, cancel/EOF, public UX gate",
            "API_PROVIDER":"PASS: bounded anonymous GitHub download, exact metadata fallback and bad metadata refusal; storage providers unchanged",
            "OBSERVABILITY":"PASS: actual error category and build readback; no production runtime change",
            "PERFORMANCE":"N_A: no performance-sensitive business/backup/query change; bounded cache verification and download limits retained",
            "CRON_JOB":"N_A: scheduler unchanged",
            "SEO":"N_A: CLI, no indexed web application",
            "NOTIFICATION":"N_A: no notification channel"}
          receipt={"schema":"vf.p07.m03.rc4.maintenance.release/v1","module_id":"P07-M03","build_id":"0.1.0-release147-rc4",
              "scope":"isolated RC3 maintenance only; not full migration; stable release146 unchanged",
              "source_commit":e["SOURCE_SHA"],"source_tree":e["SOURCE_TREE"],"product_authority_main":e["PRODUCT_MAIN"],"gov_authority_main":e["GOV_MAIN"],
              "public_candidate":e["PUBLIC_CANDIDATE"],"tag":e["RELEASE_TAG"],"archive_name":p.name,"archive_sha256":e["EXPECTED_SHA"],"archive_bytes":p.stat().st_size,
              "old_issued_asset_id":781359770,"old_issued_sha256":e["OLD_SHA"],"runtime_manifest_gitblob":e["MANIFEST_BLOB"],"inner_installer_gitblob":e["INSTALLER_BLOB"],
              "proof_runs":{"product":45650426367,"public_regressions_and_eight_cases":45651789180,"final_three_cache_cases":45655172268,"governance":45656011583,"sqlite_backup":45597235434,"native_and_docker_mariadb":45643434519,"final_public_ux":45655599048},
              "domains_preissue":domains,"owner_real_use":"PENDING_MANUAL","production":"NOT_TOUCHED","full_migration":"NOT_PROVEN","distribution":"REQUIRES_INDEPENDENT_REMOTE_READBACK"}
          q=r/"receipt.json"
          q.write_text(json.dumps(receipt,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          (r/"SHA256SUMS").write_text("".join(hashlib.sha256(x.read_bytes()).hexdigest()+"  "+x.name+"\n" for x in (p,q)))
          PY
          (cd "$root" && sha256sum -c SHA256SUMS)
          echo P07_RC4_EXACT_ISSUE_ARTIFACT_READY=PASS
      - name: Publish only the authorized immutable source and asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$GH_TOKEN" || { echo P07_RC4_RELEASE_WRITE_CAPABILITY_MISSING; exit 78; }
          p=llhzx2018/vf-server-ops
          g=llhzx2018/gov-doc
          r=llhzx2018/core-free-runner-public
          root="$RUNNER_TEMP/rc4-issue"
          test "$(gh api "repos/$p/branches/main" --jq '.commit.sha')" = "$PRODUCT_MAIN"
          test "$(gh api "repos/$g/branches/main" --jq '.commit.sha')" = "$GOV_MAIN"
          test "$(gh api "repos/$r/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          # Existing tag/release is a stop, not authorization to overwrite or retry.
          for repo in "$p" "$r"; do
            if gh api "repos/$repo/git/ref/tags/$RELEASE_TAG" >"$root/tag-check" 2>"$root/tag-error"; then echo P07_RC4_TAG_ALREADY_EXISTS_STOP; exit 13; fi
            grep -q 'HTTP 404' "$root/tag-error" || { echo P07_RC4_TAG_READ_UNVERIFIED; exit 13; }
            if gh api "repos/$repo/releases/tags/$RELEASE_TAG" >"$root/release-check" 2>"$root/release-error"; then echo P07_RC4_RELEASE_ALREADY_EXISTS_STOP; exit 13; fi
            grep -q 'HTTP 404' "$root/release-error" || { echo P07_RC4_RELEASE_READ_UNVERIFIED; exit 13; }
          done
          gh release create "$RELEASE_TAG" -R "$p" --target "$SOURCE_SHA" --title "P07-M03 RC4 独立维护版" --notes "Exact functional source, isolated RC3 maintenance only. Not full migration; stable release146 unchanged. Public asset and distribution independently verified."
          test "$(gh api "repos/$p/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release create "$RELEASE_TAG" -R "$r" --target "$GITHUB_SHA" --draft --title "P07-M03 RC4 独立维护版" --notes "Only isolated issued RC3 trial maintenance. No migration, database restore, DNS or Production operation. Stable release146 and other modules unchanged. Public toolbox pin changes only after independent anonymous verification." "$root/$ASSET" "$root/receipt.json" "$root/SHA256SUMS"
          gh release view "$RELEASE_TAG" -R "$r" --json isDraft,assets >"$root/draft.json"
          python3 -B - "$root/draft.json" "$ASSET" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a["isDraft"] and {v["name"] for v in a["assets"]}=={sys.argv[2],"receipt.json","SHA256SUMS"}
          assert next(v["size"] for v in a["assets"] if v["name"]==sys.argv[2])==719295
          PY
          gh release edit "$RELEASE_TAG" -R "$r" --draft=false
          test "$(gh api "repos/$r/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$GITHUB_SHA"
          echo P07_RC4_IMMUTABLE_TAG_AND_RELEASE_CREATED=PASS
      - name: Always remove private checkout and temporary package bytes
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov" "$GITHUB_WORKSPACE/public-candidate" "$RUNNER_TEMP/rc4-issue"
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_RC4_TRANSIENT_CLEAN=PASS
