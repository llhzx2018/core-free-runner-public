name: P08 v015 Mode W one-case governance and P08 acceptance exact-authority proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p08-v015-mode-w-authority-20261121.yml
permissions:
  contents: read
jobs:
  p08-mode-w-authority:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-v015-mode-w-authority-20261121' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact GOV-DOC Mode W one-case candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: f3ad8210df6bf122f84128a4d2d78d0177bbd1d3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: Checkout exact P08 RP-07W one-case candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 348ae64c00fd3e6c6ef3ea35adf8df51dc95892f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Validate mutually linked one-case governance and no waiver
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          gov=Path('gov');p=Path('product')
          assert subprocess.check_output(['git','-C','gov','rev-parse','HEAD'],text=True).strip()=='f3ad8210df6bf122f84128a4d2d78d0177bbd1d3'
          assert subprocess.check_output(['git','-C','product','rev-parse','HEAD'],text=True).strip()=='348ae64c00fd3e6c6ef3ea35adf8df51dc95892f'
          current=(gov/'CURRENT.md').read_text()
          assert '| skill-release | V3.22 |' in current
          assert 'P08 v0.1.15' in current and 'Mode W' in current
          skill=(gov/'skills/skill-release/V3.22/SKILL.md').read_text()
          assert 'version: "3.22"' in skill and 'previous_version: "3.21"' in skill
          assert 'Mode W · ONE CASE P08 v0.1.15' in skill
          case=(gov/'governance/release/cases/P08_ADOPS_V015_PR88_PR89_PR90_UX_NATIVE_ONECLICK_POST_RELEASE_OWNER_MANUAL_20261121.md').read_text()
          accept=(p/'docs/authority/ACCEPTANCE_MATRIX.md').read_text()
          assert 'RELEASE_MODE=W_ONE_CASE_P08_V015' in case
          assert 'RELEASE_MODE=W_ONE_CASE_P08_V015' in accept
          assert 'FUNCTIONAL_BASE=f89ed053fe750239d35fce2769ffb584edeacf8f' in case
          assert 'FUNCTIONAL_BASE=f89ed053fe750239d35fce2769ffb584edeacf8f' in accept
          assert (p/'VERSION').read_text().strip()=='0.1.15'
          docs=[case,accept,skill,(p/'AGENTS.md').read_text(),(p/'docs/authority/CURRENT.md').read_text(),(p/'docs/authority/RPD.md').read_text()]
          for d in docs:
            assert 'v0.1.15' in d and 'Owner' in d
          for domain in ['INSTALL','SECURITY','TESTING','UPGRADE','DATA_SCHEMA','API_PROVIDER','SEO','CRON_JOB','NOTIFICATION','OBSERVABILITY','PERFORMANCE','GIT','UA_UI']:
            assert domain in accept
          for assertion in ['SIGKILL','390/768/1440','SQLite','MySQL','MariaDB','restore','rollback','core-updates','production_auto_apply=false']:
            assert assertion.lower() in accept.lower(),assertion
          assert 'POST_RELEASE_REQUIRED_NOT_PASS' in accept
          assert 'POST_OWNER_MANUAL_PRODUCTION_REQUIRED_NOT_PASS' in accept
          assert 'NO TAG/RELEASE/CHANNEL' in accept
          for marker in ['Mode V','v0.1.14']:
            assert marker in skill
          # Inherited V3.21 is immutable byte-for-byte after the new section.
          old=(gov/'skills/skill-release/V3.21/SKILL.md').read_text()
          assert old.startswith('---') and skill.count('# skill-release V3.21')==1
          assert skill.split('# skill-release V3.21',1)[1]==old.split('# skill-release V3.21',1)[1]
          print('P08_MODE_W_GOV_AND_PROJECT_EXACT_PAIRED_RULES=PASS')
          print('P08_MODE_W_ALL_13_DOMAINS_AND_MACHINE_GATES_UNWAIVED=PASS')
          print('P08_MODE_W_NO_RELEASE_BEFORE_EFFECTIVE_MAIN=PASS')
          PY
      - name: Secure cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf -- gov product
          test ! -e gov && test ! -e product
          echo P08_MODE_W_RUNNER_CLEANUP=PASS
