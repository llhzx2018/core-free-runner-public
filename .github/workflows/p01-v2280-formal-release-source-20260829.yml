name: P01 V2.28 Formal Release Source Bind
on:
  push:
    branches: [task/p01-v2280-formal-release-source-20260829]
    paths:
      - .github/workflows/p01-v2280-formal-release-source-20260829.yml
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.28.0-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Bind exact formal release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = '21f5da3dde9899010c7617ff8fcdedd545b7fcbd'
          test "$(tr -d '\r\n' < VERSION)" = '2.28.0'
          test "$(tr -d '\r\n' < src/VERSION.txt)" = '2.28.0'
          grep -Fx "define('VF_VERSION', '2.28.0');" src/app/bootstrap.php >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          old='## V2.28.0 · Candidate / Not Released · 2026-08-29'
          new='## V2.28.0 · Formal Release · 2026-08-29'
          if s.count(old)!=1:
              raise SystemExit('V2.28 candidate changelog header anchor mismatch')
          s=s.replace(old,new,1)
          old2='- 本条目仅声明 `develop` / Candidate 状态；未执行 Tag、GitHub Release、main 晋级、core-updates 或 Production 写入。'
          new2='- 本条目绑定 V2.28.0 Formal Release Source；正式 Publication 仍必须通过 Exact Source / Artifact / main Promotion / Remote Online Update Gate。'
          if s.count(old2)!=1:
              raise SystemExit('V2.28 candidate boundary anchor mismatch')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8',newline='\n')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'CHANGELOG.md'
          grep -F '## V2.28.0 · Formal Release · 2026-08-29' CHANGELOG.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md
          git commit -m 'P01 V2.28: formal release identity'
          git push origin HEAD:release/p01-v2.28.0-20260829
          echo P01_V228_FORMAL_RELEASE_SOURCE_BIND=PASS
