name: P01 V2.21.20 Candidate Authority Seal
on:
  push:
    branches: [vf-agent-operations-v1]
    paths: ['.github/workflows/p01-v2.21.20-authority-seal.yml']
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      W: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      PUB: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Patch Current Truth metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os,json,base64,urllib.request
          token=os.environ['W'];repo='llhzx2018/vf-start';branch='maintenance/sidebar-density-2.21.20-20260819';expected='d5d8ebce7bce34ed37949822d0a479b8e924134a';path='VF_PROJECT.json'
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:return json.load(r)
          ref=get(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}');head=ref['object']['sha'];
          if head!=expected:raise SystemExit(f'HEAD_DRIFT {head}')
          f=get(f'https://api.github.com/repos/{repo}/contents/{path}?ref={branch}');d=json.loads(base64.b64decode(f['content']).decode())
          d.update({'status':'V2.21.19 PRODUCTION / V2.21.20 VERIFIED CANDIDATE / OWNER FORMAL RELEASE GATE','production_version':'2.21.19','working_version':'2.21.20','candidate_version':'2.21.20','candidate_state':'VERIFIED / FORMAL ARTIFACT GATE PASS / RELEASE NOT AUTHORIZED','working_branch':'candidate/v2.21.20-20260819','current_phase':'OWNER FORMAL RELEASE GATE','current_authority':'V2.21.20 VERIFIED CANDIDATE + V2.21.19 PRODUCTION READBACK','current_state':'PRODUCTION 2.21.19 / CANDIDATE 2.21.20 / FORMAL ARTIFACT PASS / OWNER RELEASE REQUIRED','lifecycle':'MAINTENANCE / RELEASE_GATE','verified_release_ready':True,'release_ready':'VERIFIED CANDIDATE / OWNER RELEASE GATE','formal_artifact_gate':'PASS','release_authorization':'PENDING / NOT EXECUTED / PRODUCTION NOT AUTHORIZED'})
          d['candidate_identity']={'candidate_product_patch_identity_commit':'393ac2fafa56cbde66767b7e1afed78742c12c9d','candidate_product_patch_identity_tree':'64cc4d21ab46d165599d59395ffcc99be6af39e0','candidate_product_patch_identity':'V2.21.20 VERIFIED PRODUCT SOURCE','source_version':'2.21.19','schema':'2026080902 / UNCHANGED','browser_helper':'1.6.4 / UNCHANGED','candidate_acceptance_run':32246414939,'formal_artifact_gate_run':32246677391,'runtime_source_changed_after_product_identity':False}
          d['release']={'scope':'V2.21.19 CURRENT FORMAL RELEASE / V2.21.20 VERIFIED CANDIDATE NOT RELEASED','tag':'v2.21.19','release_id':372928279,'candidate_commit':'2784d8de583b016e78887b707e12ed0e89489a7d','update_asset':'VF_Start_V2.21.19_UPDATE.zip','update_bytes':1072258,'update_sha256':'ba8eec70c9fc08208aa66a2a7c091772d1b460ad4ed05984e6390d5f413a82b7','full_asset':'VF_Start_V2.21.19_FULL.zip','full_bytes':490884,'full_sha256':'b95781a5de1943f823ff4a8deb9095e4596718b2a3fe5bc9e4748cfb7a1d191f','release_identity':'PASS / IMMUTABLE BY VF RELEASE CONTRACT'}
          d['update_system']={'project_id':'P01','component_id':'APP','source_version':'2.21.18','target_version':'2.21.19','production_version':'2.21.19','schema_from':'2026080902','schema_to':'2026080902','manifest_truth':'llhzx2018/core-updates/projects/P01.json','release_truth':'GitHub Release v2.21.19','formal_tag':'v2.21.19','candidate_commit':'2784d8de583b016e78887b707e12ed0e89489a7d','update_asset':'VF_Start_V2.21.19_UPDATE.zip','update_asset_bytes':1072258,'update_asset_sha256':'ba8eec70c9fc08208aa66a2a7c091772d1b460ad4ed05984e6390d5f413a82b7','core_updates':'2.21.19 / VERIFIED','production_discovery':'PASS','production_upgrade':'PASS / PRODUCTION VERSION READBACK 2.21.19 / RUN 32246058809','production_equals_latest':'YES','legacy_bridge':'RETIRED / NOT REINTRODUCED','browser_extension_unit':'INDEPENDENT / 1.6.4 / UNCHANGED'}
          raw=(json.dumps(d,ensure_ascii=False,indent=2)+'\n').encode();body={'message':'chore(P01): seal V2.21.20 candidate authority','content':base64.b64encode(raw).decode(),'sha':f['sha'],'branch':branch}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/{path}',data=json.dumps(body).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=45) as r:out=json.load(r)
          nh=out['commit']['sha'];open('/tmp/head','w').write(nh);print('P01_V22120_AUTHORITY_SEAL_PASS',nh)
          PY
      - name: Publish evidence
        if: always()
        shell: bash
        env:
          S: ${{ job.status }}
          RID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.error
          try:h2=open('/tmp/head').read().strip()
          except:h2=''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.20','gate':'CANDIDATE_AUTHORITY_SEAL','status':os.environ['S'].upper(),'pass':os.environ['S']=='success','product_commit':'393ac2fafa56cbde66767b7e1afed78742c12c9d','authority_commit':h2,'changed_path':'VF_PROJECT.json','runtime_source_changed':False,'release_authorized':False,'production_changed':False,'workflow_run_id':os.environ['RID']};c=json.dumps(q,indent=2)+'\n';t=os.environ['PUB'];api='https://api.github.com/repos/llhzx2018/core-free-runner-public/contents/vf-agent/results/P01-V2.21.20-CANDIDATE-AUTHORITY-SEAL.json';h={'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'};sha=None
          try:
            with urllib.request.urlopen(urllib.request.Request(api+'?ref=vf-agent-operations-v1',headers=h)) as x:sha=json.load(x).get('sha')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
          b={'message':'evidence(P01): publish V2.21.20 candidate authority seal','content':base64.b64encode(c.encode()).decode(),'branch':'vf-agent-operations-v1'}
          if sha:b['sha']=sha
          urllib.request.urlopen(urllib.request.Request(api,data=json.dumps(b).encode(),method='PUT',headers={**h,'Content-Type':'application/json'})).read()
          PY
