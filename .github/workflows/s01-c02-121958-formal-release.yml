name: S01-C02 1.21.958 Formal Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-c02-121958-formal-release.yml'

permissions:
  actions: read
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 30aa7d3ec8ae38cd7829c43d70584e5336e2b8b9
      TARGET_VERSION: 1.21.958
      RELEASE_TAG: v1.21.958
      ASSET_NAME: vf-tools-ops_V1.21.958.zip
      TESTED_RUN_ID: '36550474334'
      TESTED_ARTIFACT_NAME: s01-c02-v1.21.958-r9-candidate
      EXPECTED_BYTES: '3411757'
      EXPECTED_SHA256: c723629b16721da3e85ec2aba617f0dc90c68fece36793564e2d4c5bb6bf8959
      EXPECTED_RUNTIME_FILES: '961'
      EXPECTED_RUNTIME_FP: 80da97e7b5d037c4e69bc5368d4c65f054b47cbc66dcf54e5a3b8c2445f05721
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Verify credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          test -n "$RELEASE_WRITE_TOKEN"

      - name: Checkout exact promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: target

      - name: Verify exact tested candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          mkdir tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT_NAME" --dir tested
          test -f "tested/FINAL_EVIDENCE.json"
          test -f "tested/$ASSET_NAME"
          jq -e --arg sha "$TARGET_SHA" --arg ver "$TARGET_VERSION" '.status=="PASS" and .candidate_sha==$sha and .candidate_version==$ver and .upgrade=="PASS" and .security=="PASS" and .r9_contract=="PASS" and .browser.result=="PASS" and .browser.blocking_errors==0 and .browser.responsive_failures==0' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(stat -c %s "tested/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "tested/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "tested/$ASSET_NAME" >/dev/null

      - name: Create formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            cat > release-notes.md <<'MD'
          S01-C02 · VF Tools Ops · V1.21.958

          Production Real-use R9 · Detail Consistency Closure:
          - 内容库复选框恢复真实方形控件
          - 单页精修菜单 current-state 与实际页面一致
          - Content & SEO 高频筛选控件统一为 40px 基线
          - 页面与关键词地图移除重复 normalized-keyword 视觉噪声
          - 内容集群与链接命令条、空状态和筛选细节继续收紧
          - no Shell/Header/Header Menu IA structure change
          - no route semantics / canonical data / schema / permission / business logic / updater semantic change
          - Exact Candidate Gate Run: 36550474334
          - exact source: 30aa7d3ec8ae38cd7829c43d70584e5336e2b8b9

          OWNER Production visual acceptance remains pending after installation.
          MD
            gh release create "$RELEASE_TAG" "tested/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.958" --notes-file release-notes.md
          fi

      - name: Remote exact readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          JSON="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$JSON")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$JSON")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$JSON")"
          PUB="$(jq -r '.published_at' <<<"$JSON")"
          TAG_SHA="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$TAG_SHA" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"
          rm -rf readback; mkdir readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(stat -c %s "readback/$ASSET_NAME")" = "$EXPECTED_BYTES"
          test "$(sha256sum "readback/$ASSET_NAME"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo "FORMAL_RELEASE_REMOTE_READBACK=PASS"
          echo "RELEASE_ID=$RID"
          echo "ASSET_ID=$AID"
          echo "PUBLISHED_AT=$PUB"
          echo "ASSET_BYTES=$SIZE"
          echo "ASSET_SHA256=$EXPECTED_SHA256"
          echo "RUNTIME_FILES=$EXPECTED_RUNTIME_FILES"
          echo "RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP"

      - name: Cleanup
        if: always()
        run: rm -rf target tested readback
