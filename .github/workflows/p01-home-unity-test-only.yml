name: P01 public/owner Home unified shell test-only
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-home-unity-test-only.yml'
permissions:
  contents: read
jobs:
  home-unity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact P01 product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 654d81952eb97924b8d09ce1ba8364677b574fca
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,curl,zip
          coverage: none
      - name: Exact public/owner Home Shell and privacy regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "654d81952eb97924b8d09ce1ba8364677b574fca"
          php -l product/src/index.php
          php -l product/src/app/FunctionalWorkspaceShell.php
          php -l product/src/app/WorkspaceViewCatalog.php
          for t in \
            public_home_owner_shell_unified_v247390_contract.php \
            public_global_nav_contract.php \
            public_brand_route_contract.php \
            public_home_visitor_discovery_v247390_contract.php \
            frontend_home_navigation_r2_contract.php \
            frontend_home_portal_contract.php \
            full_product_public_shared_rhythm_r1_contract.php \
            frontend_global_shell_r1_contract.php \
            uxui_round1_home_root_contract.php \
            home_page_full_polish_contract.php \
            frontend_shared_owner_guest_visibility_v247390_contract.php; do
            php "product/tests/unit/$t"
          done
          echo P01_PUBLIC_HOME_UNIFIED_EXACT_SOURCE=PASS
      - name: Erase temporary product files
        if: always()
        shell: bash
        run: rm -rf product
