name: P01 Inbox 440 JS search routing regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-inbox-440-search-routing.yml'
permissions:
  contents: read
jobs:
  p01-inbox-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO: llhzx2018/vf-start
      CANDIDATE_SHA: 3a05e1f9e09b8f40ee110f03d9e0bee976e6a9ba
      BASELINE_SHA: 5034a88abb444db564dc7e1b9d22b922208e2700
    steps:
      - name: Prepare PHP, SQLite and Node
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, curl, mbstring, zip, gd, openssl
          coverage: none
      - name: Fetch pinned private sources into ephemeral runner only
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'BLOCKED_SECRET_MISSING'; exit 11; }
          git init -q candidate
          git -C candidate remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C candidate -c advice.detachedHead=false fetch -q --depth 1 origin "$CANDIDATE_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          git init -q stable
          git -C stable remote add origin "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git"
          git -C stable -c advice.detachedHead=false fetch -q --depth 1 origin "$BASELINE_SHA"
          git -C stable checkout -q --detach FETCH_HEAD
          test "$(git -C stable rev-parse HEAD)" = "$BASELINE_SHA"
          git -C candidate remote remove origin
          git -C stable remote remove origin
          echo P01_INBOX_EXACT_SOURCE_CHECKOUT=PASS
      - name: Syntax and Inbox focused test cases
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          test "$(tr -d '\r\n ' < VERSION)" = "2.47.440"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "2.47.440"
          grep -Fq "define('VF_VERSION', '2.47.440');" src/app/bootstrap.php
          echo P01_INBOX_CANDIDATE_VERSION_IDENTITY=PASS
          for p in src/inbox.php src/start.php src/quick-save.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php src/app/SurfaceShell.php src/app/WorkspaceViewCatalog.php; do php -l "$p" >/dev/null; done
          for p in src/assets/workspace.js src/assets/surface-home.js tests/unit/inbox_search_browser_submit_boundary.cjs src/browser-extension/background.js src/browser-extension/popup.js; do node --check "$p"; done
          for p in \
            tests/unit/inbox_frontstage_p0_contract.php \
            tests/unit/inbox_search_form_no_global_hijack_contract.php \
            tests/unit/pending_frontstage_r3_contract.php \
            tests/unit/pending_entry_unification_r4_contract.php \
            tests/unit/browser_helper_v17_contract.php \
            tests/unit/quick_save_pending_continuity_contract.php \
            tests/unit/pending_action_input_guard_v247258_contract.php; do
            echo "RUN_TEST=$p"
            php "$p"
          done
          node tests/unit/inbox_search_browser_submit_boundary.cjs
          echo P01_INBOX_SEARCH_ROUTING_FOCUSED_GATE=PASS
      - name: Canonical full unit regression against current main baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt
          echo P01_INBOX_CANONICAL_REGRESSION=PASS
      - name: Synthetic HTTP auth and Inbox capture smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src
          php -S 127.0.0.1:18483 -t . >/tmp/p01-inbox-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS -c /tmp/p01-inbox-cookies -b /tmp/p01-inbox-cookies http://127.0.0.1:18483/setup.php -o /tmp/p01-inbox-setup.html; then break; fi
            sleep 1
          done
          csrf=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-inbox-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m, 'setup csrf missing'
          print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-inbox-cookies -b /tmp/p01-inbox-cookies -X POST http://127.0.0.1:18483/setup.php \
            --data-urlencode "setup_csrf=$csrf" \
            --data-urlencode 'site_title=P01 Inbox Synthetic Smoke' \
            --data-urlencode 'admin_password=Inbox!Synthetic18483' \
            --data-urlencode 'admin_password_confirm=Inbox!Synthetic18483' \
            -o /tmp/p01-inbox-post.html
          php -r '
          require "app/bootstrap.php";
          $repo=new VfRepository(vf_db());
          $repo->createCategory(["name"=>"Inbox Synthetic Category","description"=>"","icon"=>"","is_private"=>1,"sort_order"=>0]);
          $first=$repo->savePendingCapture(["title"=>"P01 Inbox Synthetic Capture","url"=>"https://example.com/vf-inbox-synthetic-18483"],"browser-extension");
          $second=$repo->savePendingCapture(["title"=>"P01 Inbox Synthetic Capture","url"=>"https://example.com/vf-inbox-synthetic-18483"],"browser-extension");
          if((int)($first["id"]??0)<1||empty($second["duplicate"])||(int)$first["id"]!==(int)$second["id"])exit(3);
          $id=(int)$first["id"];$q=vf_db()->prepare("SELECT is_pending,is_private FROM links WHERE id=?");
          $q->execute([$id]);$a=$q->fetch(PDO::FETCH_ASSOC);
          if((int)$a["is_pending"]!==1||(int)$a["is_private"]!==1)exit(4);
          echo "P01_INBOX_CANONICAL_CAPTURE_DEDUP=PASS\\n";
          '
          guest_status=$(curl -sS -o /tmp/p01-inbox-guest.html -w '%{http_code}' http://127.0.0.1:18483/inbox.php)
          test "$guest_status" = 302
          ! grep -Fq 'P01 Inbox Synthetic Capture' /tmp/p01-inbox-guest.html
          echo P01_INBOX_ANONYMOUS_DENIED=PASS
          curl -fsS -c /tmp/p01-inbox-cookies -b /tmp/p01-inbox-cookies \
            -H 'Content-Type: application/json' -d '{"password":"Inbox!Synthetic18483"}' \
            'http://127.0.0.1:18483/api.php?action=login' -o /tmp/p01-inbox-login.json
          grep -Fq '"ok":true' /tmp/p01-inbox-login.json
          curl -fsS -b /tmp/p01-inbox-cookies 'http://127.0.0.1:18483/inbox.php' -o /tmp/p01-inbox-owner.html
          grep -Fq 'P01 Inbox Synthetic Capture' /tmp/p01-inbox-owner.html
          grep -Fq 'vf-inbox-organize' /tmp/p01-inbox-owner.html
          grep -Fq 'aria-current="page"' /tmp/p01-inbox-owner.html
          grep -Fq '收集箱' /tmp/p01-inbox-owner.html
          grep -Fq 'placeholder="搜索收集箱"' /tmp/p01-inbox-owner.html
          grep -Fq 'action="inbox.php"' /tmp/p01-inbox-owner.html
          redirect=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -b /tmp/p01-inbox-cookies \
            'http://127.0.0.1:18483/start.php?view=pending')
          test "$redirect" = '302 http://127.0.0.1:18483/inbox.php'
          echo P01_INBOX_OWNER_HTTP_SMOKE=PASS
      - name: Verify private source never persists in public runner
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          echo P01_INBOX_PRIVATE_SOURCE_CLEANUP=PASS
