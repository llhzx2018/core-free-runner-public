name: TEMP skill-book V4.8 Final Governance Closure

on:
  push:
    branches:
      - release/skill-book-v48-candidate-asset-20260827
    paths:
      - '.github/workflows/temp-skill-book-v48-final-governance-closure.yml'

permissions:
  contents: read

env:
  GOV_REPOSITORY: llhzx2018/gov-doc
  TAG: skill-book-v4.8-candidate-20260827
  ASSET_NAME: skill-book_V4.8_CANDIDATE_20260827.zip
  EXPECTED_RELEASE_ID: '378052388'
  EXPECTED_BYTES: '156008'
  EXPECTED_SHA256: df933b799e7e56a662f055abfe9825d15a4470c86cf9b41a34e30cbb98bf4c4b
  SOURCE_COMMIT: d5d809172f23b31212cf6b66551f775b2e07e35f

jobs:
  close-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify live V4.8 Release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RELEASE_TOKEN"
          j="$(gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          rid="$(jq -r '.id' <<<"$j")"
          zid="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          sid="$(jq -r --arg n "$ASSET_NAME.sha256" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          bytes="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          digest="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          test "$rid" = "$EXPECTED_RELEASE_ID"
          test "$(jq -r '.prerelease' <<<"$j")" = 'true'
          test "$bytes" = "$EXPECTED_BYTES"
          test "$digest" = "sha256:$EXPECTED_SHA256"
          test -n "$zid" && test -n "$sid"
          echo "LIVE_ZIP_ASSET_ID=$zid" >> "$GITHUB_ENV"
          echo "LIVE_SHA_ASSET_ID=$sid" >> "$GITHUB_ENV"
          echo "V48_LIVE_RELEASE_ID=$rid"
          echo "V48_LIVE_ZIP_ASSET_ID=$zid"
          echo "V48_LIVE_SHA_ASSET_ID=$sid"
          echo 'V48_LIVE_RELEASE_AUTHORITY=PASS'

      - name: Re-read live GOV-DOC main and reconcile V4.8 pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${RELEASE_TOKEN}@github.com/${GOV_REPOSITORY}.git" gov
          cd gov
          git config user.name 'VF Candidate Reconcile'
          git config user.email 'release@kewaro.com'
          live="$(git rev-parse origin/main)"
          remote_live="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live" = "$remote_live"
          echo "GOV_MAIN_BEFORE_V48_FINAL=$live"
          git checkout -q -B v48-final origin/main
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          export LIVE_ZIP_ASSET_ID LIVE_SHA_ASSET_ID
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          zid=os.environ['LIVE_ZIP_ASSET_ID']
          sid=os.environ['LIVE_SHA_ASSET_ID']
          sha=os.environ['EXPECTED_SHA256']
          source=os.environ['SOURCE_COMMIT']
          tag=os.environ['TAG']
          asset=os.environ['ASSET_NAME']
          rid=os.environ['EXPECTED_RELEASE_ID']

          p=Path('CURRENT.md')
          s=p.read_text(encoding='utf-8')
          old='| skill-book | V3.5 | V4.6 CANDIDATE（非 Current） |'
          new='| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |'
          assert old in s or new in s
          s=s.replace(old,new)
          s=re.sub(
              r'`skill-book V4\.0/V4\.1/V4\.2/V4\.3/V4\.4/V4\.5/V4\.6` 为保留的历史 Candidate，`V4\.7` 为最新 Candidate；八者均未晋升 Source Current。V4\.7 已进入 Candidate Distribution，但未进入 Current Distribution。',
              '`skill-book V4.0/V4.1/V4.2/V4.3/V4.4/V4.5/V4.6/V4.7` 为保留的历史 Candidate，`V4.8` 为最新 Candidate；九者均未晋升 Source Current。V4.8 已进入 Candidate Distribution，但未进入 Current Distribution。',
              s,
              count=1,
          )
          assert '`V4.8` 为最新 Candidate' in s
          p.write_text(s,encoding='utf-8')

          p=Path('distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md')
          s=p.read_text(encoding='utf-8')
          candidate=f'''## Candidate（不改变 Current）

`skill-book V4.8` 是最新 `CANDIDATE / NOT CURRENT`；Source Current仍为V3.5，且V4.8不包含在Current总包中。Installed Runtime Observation为V4.7 Candidate。

- [直接下载 skill-book V4.8 Candidate ZIP](https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset})
- [下载 SHA-256 文件](https://github.com/llhzx2018/gov-doc/releases/download/{tag}/{asset}.sha256)
- [查看 V4.8 Candidate Release](https://github.com/llhzx2018/gov-doc/releases/tag/{tag})
- [查看 V4.8 Candidate Source](https://github.com/llhzx2018/gov-doc/tree/main/skills/skill-book/V4.8)
- [查看 V4.8 Candidate Mother Overlay](https://github.com/llhzx2018/gov-doc/blob/main/mother-specs/skill-book/V4.8/SKILL_BOOK_V4.8_CANDIDATE_OVERLAY.md)
- [查看 V4.8 Candidate 分发说明](https://github.com/llhzx2018/gov-doc/blob/main/distribution/skills/candidates/skill-book/V4.8/README.md)

Published Distribution Identity：

- Bytes：`156008`
- SHA-256：`{sha}`
- Release ID：`{rid}`
- Remote Asset ID：`{zid}`
- SHA Asset ID：`{sid}`
- Exact Source Commit：`{source}`
- Runner Run：`33105833415`
- Runner Job：`98635300217`
- Unit Tests：`38/38 PASS (modular execution)`
- Python Syntax：`PASS`
- Local / Remote ZIP Identity：`MATCH`
- Remote Download Readback：`PASS`
- ZIP CRC / Unsafe Path / Duplicate Path / pycache：`PASS`
- Backend V4.8 Runtime Test：`NOT_RUN`
- Real Reader Forward Evidence：`NOT_RUN`
- Current Promotion：`NOT_AUTHORIZED`
- Status：`PUBLISHED_REMOTE_VERIFIED`

V4.8 Candidate Publication仅完成分发闭环，不将Source Current从V3.5晋升，也不以机器PASS替代READ / LEARN / TRAIN / DO的真人Reader Outcome。

历史 Candidate：

- [skill-book V4.7](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.7)
- [skill-book V4.6](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.6)
- [skill-book V4.5](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.5)
- [skill-book V4.4](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.4)
- [skill-book V4.3](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.3)
- [skill-book V4.2](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.2)
- [skill-book V4.1](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.1)
- [skill-book V4.0](https://github.com/llhzx2018/gov-doc/tree/main/distribution/skills/candidates/skill-book/V4.0)'''
          ns,n=re.subn(r'## Candidate（不改变 Current）\n.*\Z',candidate,s,flags=re.S)
          assert n==1
          p.write_text(ns,encoding='utf-8')

          for name in [
              'distribution/skills/candidates/skill-book/V4.8/README.md',
              'distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md',
          ]:
              p=Path(name); s=p.read_text(encoding='utf-8')
              s,n1=re.subn(r'(- Remote Asset ID：`)\d+(`)',rf'\g<1>{zid}\g<2>',s,count=1)
              s,n2=re.subn(r'(- SHA Asset ID：`)\d+(`)',rf'\g<1>{sid}\g<2>',s,count=1)
              assert n1==1 and n2==1
              assert 'PUBLISHED_REMOTE_VERIFIED' in s
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git add CURRENT.md distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md distribution/skills/candidates/skill-book/V4.8/README.md distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'V48_GOVERNANCE_ALREADY_FINAL=PASS'; exit 0; }
          git commit -q -m 'skill-book: finalize V4.8 published candidate pointers'
          commit="$(git rev-parse HEAD)"
          before_push="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$before_push" = "$live"
          git push -q origin HEAD:main
          echo "V48_FINAL_GOV_COMMIT=$commit"
          echo 'V48_FINAL_GOV_WRITE=PASS'

      - name: Final remote readback and no-false-green guard
        shell: bash
        run: |
          set -Eeuo pipefail
          cd gov
          git fetch -q origin main
          git reset -q --hard origin/main
          test "$(cat skills/skill-book/V4.8/VERSION)" = '4.8'
          grep -Fq '| skill-book | V3.5 | V4.7 CANDIDATE（非 Current） |' CURRENT.md
          grep -Fq '`V4.8` 为最新 Candidate' CURRENT.md
          grep -Fq '`skill-book V4.8` 是最新 `CANDIDATE / NOT CURRENT`' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$EXPECTED_SHA256" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$LIVE_ZIP_ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$LIVE_SHA_ASSET_ID" distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          grep -Fq "$LIVE_ZIP_ASSET_ID" distribution/skills/candidates/skill-book/V4.8/README.md
          grep -Fq "$LIVE_SHA_ASSET_ID" distribution/skills/candidates/skill-book/V4.8/RUNTIME_ZIP_MIRROR_STATUS.md
          grep -Fq 'Current Promotion：`NOT_AUTHORIZED`' distribution/skills/CURRENT_SKILL_DOWNLOAD_INDEX.md
          j="$(gh api "repos/$GOV_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$j")" = "$LIVE_ZIP_ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME.sha256" '.assets[]|select(.name==$n)|.id' <<<"$j")" = "$LIVE_SHA_ASSET_ID"
          test "$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.digest' <<<"$j")" = "sha256:$EXPECTED_SHA256"
          echo "V48_FINAL_GOV_MAIN=$(git rev-parse HEAD)"
          echo 'LATEST_CANDIDATE=V4.8'
          echo 'SOURCE_CURRENT=V3.5'
          echo 'INSTALLED_RUNTIME_OBSERVATION=V4.7'
          echo 'CURRENT_PROMOTION=NOT_AUTHORIZED'
          echo 'V48_MIRROR=PUBLISHED_REMOTE_VERIFIED'
          echo 'V48_FINAL_REMOTE_READBACK=PASS'

# second push only registers/triggers this temporary workflow; never merge this file to Runner main
