name: TEMP P07 inventory absence safety exact-source regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-restore-inventory-absence-temporary.yml'
permissions:
  contents: read
concurrency:
  group: temp-p07-inventory-absence-20261017
  cancel-in-progress: false
jobs:
  focused-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Require registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact private P07 branch candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 06ff03e2291a240cef66c9ae4324adde042bf9f9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: p07-private
      - name: Test inventory uncertainty and existing restore/backup behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '06ff03e2291a240cef66c9ae4324adde042bf9f9'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release87'
          cd p07-private
          export PYTHONPATH="$PWD/lib"
          python3 -m py_compile lib/restore.py lib/restore_new.py tests/test_restore.py tests/test_restore_new.py
          log="$RUNNER_TEMP/p07-inventory-regression.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q tests.test_restore tests.test_restore_new tests.test_restore_apply tests.test_backup >"$log" 2>&1; then
            echo 'P07_RESTORE_INVENTORY_FAIL_CLOSED=PASS'
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            echo "P07_RESTORE_INVENTORY_FAIL_CLOSED=FAIL_$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi
      - name: Purge temporary private checkout and test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-inventory-regression.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_LOG_PERSISTED=NO'
