name: P05 Database Rebaseline

on:
  push:
    paths:
      - '.github/workflows/p05-database-rebaseline.yml'
      - 'requests/p05-database-rebaseline-*'

permissions:
  contents: read

env:
  EXPECTED_P05_SHA: fcfb44e8d63bdf236b41eb0ca83f348950077954
  NODE_IMAGE: node:24-bookworm
  VF_DATABASE_PROVIDER: sqlite
  VF_SQLITE_PATH: /tmp/vf-seo-rebaseline/vf-seo.sqlite3
  VF_BACKUP_DIR: /tmp/vf-seo-rebaseline/backups
  VF_ADMIN_USERNAME: rebaseline-admin
  VF_ADMIN_PASSWORD: fixture-rebaseline-password-20260816
  VF_SECURE_COOKIES: 'false'
  VF_REQUIRE_HTTPS: 'false'
  VF_TRUST_PROXY: 'false'
  VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

jobs:
  sqlite-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout exact P05 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.EXPECTED_P05_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p05
          fetch-depth: 1
          persist-credentials: false
      - name: Build and SQLite fresh install
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/vf-seo-rebaseline
          docker pull "$NODE_IMAGE" >/dev/null
          docker run --rm \
            -e VF_DATABASE_PROVIDER -e VF_SQLITE_PATH -e VF_BACKUP_DIR -e VF_ADMIN_USERNAME -e VF_ADMIN_PASSWORD \
            -e VF_SECURE_COOKIES -e VF_REQUIRE_HTTPS -e VF_TRUST_PROXY -e VF_MASTER_KEY_BASE64 \
            -v "$GITHUB_WORKSPACE/p05:/work" -w /work "$NODE_IMAGE" \
            bash -lc 'node -v; npm ci; npm run lint; npm run typecheck; npm run build; npm run migrate; npm run verify:schema; npm run bootstrap:admin'
      - name: Cleanup
        if: always()
        run: rm -rf p05 /tmp/vf-seo-rebaseline
