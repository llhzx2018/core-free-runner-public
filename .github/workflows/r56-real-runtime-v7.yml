name: R56 Real Runtime Favorite Coherence Gate V7

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r56-real-runtime-v7.yml'

permissions:
  contents: read

jobs:
  r56-real-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPECTED_SHA: 58217702a6b5399d51d1dbd61a60d65b5ba66500
      APP_URL: http://127.0.0.1:8780
      TEST_PASSWORD: VF-R56-Acceptance-2026!
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 58217702a6b5399d51d1dbd61a60d65b5ba66500
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          node --check src/assets/workspace.js
          php tests/unit/derived_favorite_view_coherence_contract.php
          php tests/unit/tool_home_source_contract.php
          php tests/unit/tool_scene_detail_source_contract.php
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          echo R56_REAL_RUNTIME_SOURCE_PASS

      - name: Install Chromium
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null

      - name: Start clean VF Start runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:8780 -t "$GITHUB_WORKSPACE/vf-start/src" >"$RUNNER_TEMP/r56-real-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/r56-real-server.pid"
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS "$APP_URL/setup.php" >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          test "$ready" -eq 1

      - name: Perform real clean HTTP install
        shell: bash
        run: |
          set -Eeuo pipefail
          COOKIE="$RUNNER_TEMP/r56-setup.cookies"
          curl -fsS -c "$COOKIE" "$APP_URL/setup.php" > "$RUNNER_TEMP/r56-setup.html"
          CSRF="$(python3 - <<'PY'
          import re,os
          p=open(os.environ['RUNNER_TEMP']+'/r56-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf" value="([^"]+)"',p)
          if not m: raise SystemExit('setup csrf not found')
          print(m.group(1))
          PY
          )"
          test -n "$CSRF"
          curl -fsS -b "$COOKIE" -c "$COOKIE" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=VF Start R56 Acceptance" \
            --data-urlencode "admin_password=$TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$TEST_PASSWORD" \
            "$APP_URL/setup.php" > "$RUNNER_TEMP/r56-setup-post.html"
          grep -Fq 'VF Start 安装完成' "$RUNNER_TEMP/r56-setup-post.html"
          echo R56_REAL_INSTALL_PASS

      - name: Seed canonical Start-derived Tool and Software favorites
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/r56-seed.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('GITHUB_WORKSPACE') . '/vf-start/src/app/FunctionalWorkspaceCore.php';
          $db=vf_db();
          $repo=new VfRepository($db);
          $surface=new VfSurfaceRepository($db);
          $category=$repo->createCategory(['name'=>'R56 验收','description'=>'derived favorite coherence','is_private'=>1,'sort_order'=>100]);
          $save=function(array $data) use($repo,$surface,$category): int {
              $data['surface']='start';
              $data['category_id']=$category;
              $data['is_private']=1;
              $result=$repo->saveLink(null,$data,'manual');
              $id=(int)$result['id'];
              $surface->upsertProfile($id,['surface'=>'start']);
              $repo->toggleFavorite($id,true);
              return $id;
          };
          $tool=$save([
              'title'=>'R56 Acceptance API Tool',
              'url'=>'https://example.com/r56-api-tool',
              'description'=>'开发工具 API 调试 建站',
              'tags'=>['场景:做网站','开发工具','API','建站'],
          ]);
          $software=$save([
              'title'=>'R56 Acceptance Desktop Editor',
              'url'=>'https://example.com/r56-desktop-editor',
              'description'=>'Windows 桌面代码编辑器客户端',
              'tags'=>['软件:开发 / 编程','软件','代码编辑器','客户端','OS:Windows'],
          ]);
          echo "R56_TOOL_ID={$tool}\nR56_SOFTWARE_ID={$software}\n";
          PHP
          php "$RUNNER_TEMP/r56-seed.php" | tee "$RUNNER_TEMP/r56-seed.out"
          grep -Fq 'R56_TOOL_ID=' "$RUNNER_TEMP/r56-seed.out"
          grep -Fq 'R56_SOFTWARE_ID=' "$RUNNER_TEMP/r56-seed.out"
          echo R56_REAL_CANONICAL_SEED_PASS

      - name: Real authenticated Chromium desktop and mobile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          cat > r56-real-browser.mjs <<'JS'
          import { chromium } from 'playwright';

          const base=process.env.APP_URL;
          const password=process.env.TEST_PASSWORD;
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const targets=[
            {route:'tools.php',title:'R56 Acceptance API Tool'},
            {route:'software.php',title:'R56 Acceptance Desktop Editor'},
          ];

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900},reducedMotion:'reduce'});
          const auth=await context.newPage();
          const authErrors=[];
          auth.on('pageerror',e=>authErrors.push(`pageerror:${e.message}`));
          auth.on('console',m=>{if(m.type()==='error')authErrors.push(`console:${m.text()}`)});
          await auth.goto(base+'/',{waitUntil:'domcontentloaded'});
          await auth.locator('[data-vf-auth-login]').first().click();
          const dialog=auth.locator('[data-vf-auth-dialog]');
          await dialog.waitFor({state:'visible'});
          await dialog.locator('input[name="password"]').fill(password);
          const loginNav=auth.waitForNavigation({waitUntil:'networkidle'});
          await dialog.locator('[data-vf-auth-submit]').click();
          await loginNav;
          await auth.locator('body.vf-functional-workspace').waitFor({state:'attached'});
          assert(authErrors.length===0,'login errors: '+authErrors.join(' | '));
          await auth.close();

          const setFavoriteNoReload=async(page,route,title,want)=>{
            const row=page.locator('[data-asset-row]').filter({hasText:title}).first();
            await row.waitFor({state:'visible',timeout:5000});
            const btn=row.locator('[data-favorite-id]').first();
            const current=await btn.getAttribute('data-favorite');
            if(current===(want?'1':'0'))return;
            let nav=0;
            const onReq=req=>{if(req.isNavigationRequest()&&new URL(req.url()).pathname.endsWith('/'+route))nav++};
            page.on('request',onReq);
            await btn.click();
            const id=await btn.getAttribute('data-favorite-id');
            await page.waitForFunction(([id,value])=>document.querySelector(`[data-favorite-id="${id}"]`)?.dataset.favorite===value,[id,want?'1':'0'],{timeout:4000});
            await page.waitForTimeout(450);
            page.off('request',onReq);
            assert(nav===0,`${route} view=all unexpectedly reloaded while favorite=${want}`);
            await row.waitFor({state:'visible',timeout:1000});
          };

          for(const width of [1280,390]){
            for(const {route,title} of targets){
              const page=await context.newPage();
              await page.setViewportSize({width,height:900});
              const errors=[];
              page.on('pageerror',e=>errors.push(`pageerror:${e.message}`));
              page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});

              // Force the result route (page=2 is clamped to the real first page when only one page exists).
              await page.goto(`${base}/${route}?view=all&page=2`,{waitUntil:'domcontentloaded'});
              const allRow=page.locator('[data-asset-row]').filter({hasText:title}).first();
              await allRow.waitFor({state:'visible',timeout:5000});

              // Normalize ON, prove unfavorite in ordinary all-view does not reload, then restore ON.
              await setFavoriteNoReload(page,route,title,true);
              await setFavoriteNoReload(page,route,title,false);
              await setFavoriteNoReload(page,route,title,true);

              await page.goto(`${base}/${route}?view=favorite`,{waitUntil:'domcontentloaded'});
              const favoriteRow=page.locator('[data-asset-row]').filter({hasText:title}).first();
              await favoriteRow.waitFor({state:'visible',timeout:5000});
              const favoriteButton=favoriteRow.locator('[data-favorite-id]').first();
              assert(await favoriteButton.getAttribute('data-favorite')==='1',`${route} favorite fixture not active ${width}`);

              let nav=0;
              const onReq=req=>{if(req.isNavigationRequest()&&new URL(req.url()).pathname.endsWith('/'+route))nav++};
              page.on('request',onReq);
              await favoriteButton.click();
              await page.waitForFunction(t=>![...document.querySelectorAll('[data-asset-row]')].some(row=>row.textContent.includes(t)),title,{timeout:5000});
              await page.waitForTimeout(250);
              page.off('request',onReq);

              assert(nav>=1,`${route} favorite view did not reload after unfavorite ${width}`);
              assert(new URL(page.url()).searchParams.get('view')==='favorite',`${route} lost favorite view context ${width}`);
              assert(errors.length===0,`${route} runtime errors ${width}: ${errors.join(' | ')}`);
              await page.close();
            }
          }

          await context.close();
          await browser.close();
          console.log('R56_REAL_BROWSER_DERIVED_FAVORITE_VIEW_COHERENCE_PASS');
          JS
          node r56-real-browser.mjs

      - name: Runtime integrity readback
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/r56-integrity.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getenv('GITHUB_WORKSPACE') . '/vf-start/src/app/FunctionalWorkspaceCore.php';
          $db=vf_db();
          $integrity=(string)$db->query('PRAGMA integrity_check')->fetchColumn();
          $fk=(int)$db->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC) ? 1 : 0;
          if($integrity!=='ok'||$fk!==0){fwrite(STDERR,"integrity={$integrity} fk={$fk}\n");exit(1);}
          echo "R56_SQLITE_INTEGRITY_PASS\n";
          PHP
          php "$RUNNER_TEMP/r56-integrity.php"
          echo R56_REAL_RUNTIME_GATE_PASS

      - name: Cleanup transient private source and runtime
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/r56-real-server.pid" ]; then kill "$(cat "$RUNNER_TEMP/r56-real-server.pid")" 2>/dev/null || true; fi
          rm -rf vf-start
          rm -f "$RUNNER_TEMP"/r56-*
