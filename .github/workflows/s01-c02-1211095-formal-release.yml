name: S01 C02 1211095 Formal Release
on:
  push:
    branches: [task/s01-c02-1211095-formal-release-20261011]
permissions:
  contents: read
  actions: read
jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_VERSION: '1.21.1095'
      TARGET_SHA: 'a1117731f4dbacb18b49f4539c48d0eec60f1a1e'
      MAIN_SHA: '53fdc1172f2d4851c4e143762f961b52e6a01882'
      TARGET_TREE: 'b0fd3433d275ff7a58c3774109c646392497f33b'
      RELEASE_TAG: 'v1.21.1095'
      EXPECTED_BYTES: '3583764'
      EXPECTED_SHA: '9df374cad755deaa80f03ab0babb5891d639e410f9f6c0efaef65ebdfa694bb5'
      EXPECTED_FILES: '989'
      EXPECTED_FINGERPRINT: '6552c12e1e5cea7c3b8fab611339b24d101496b3a30849ffde34da00418943e4'
      RUN_ID: '38130382576'
      ARTIFACT_ID: '11698814033'
    steps:
      - name: Checkout public scoped release harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact machine-proven private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: a1117731f4dbacb18b49f4539c48d0eec60f1a1e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Perform verified formal release and remote asset readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash -n runner/lanes/s01-c02-1211095/formal-release.sh
          bash runner/lanes/s01-c02-1211095/formal-release.sh
      - name: Upload only public-safe release receipt (never binary)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-1211095-formal-${{ github.run_id }}
          path: |
            proof-formal/stage.txt
            proof-formal/build.json
            proof-formal/gate-readback.json
            proof-formal/promoted-main.json
            proof-formal/release.json
            proof-formal/FINAL_FORMAL_RELEASE.json
          if-no-files-found: warn
          retention-days: 30
