name: P07 M03 D04 SQLite WAL online private second-snapshot
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-m03-d04-sqlite-wal-online-20261116.yml']
permissions:
  contents: read
jobs:
  native-sqlite-wal-online:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout short-lived public test scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private P07 candidate in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: b3d58fecc737f52ffcd6d89482e8888b760b394d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: .p07-private
      - name: Transient GOV-DOC current architecture checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: .gov-doc
      - name: Actual SQLite WAL live backup and negative proofs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          PRIVATE="$PWD/.p07-private"
          GOV="$PWD/.gov-doc"
          test "$(git -C "$PRIVATE" rev-parse HEAD)" = "b3d58fecc737f52ffcd6d89482e8888b760b394d"
          cd "$PRIVATE"
          export PYTHONPATH="$PRIVATE/lib:$PRIVATE/scripts"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_prepared_sqlite_online_snapshot.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_prepared_static_online_snapshot.py -q
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_final_sync_guard.py -q
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_single_site_cutover_guard.py -q
          python3 -B lib/server_migration_pull.py _stage-prepared-sqlite-online --help >/dev/null
          python3 -B lib/server_migration_pull.py _stage-prepared-static-online --help >/dev/null
          echo P07_D04_NATIVE_SQLITE_WAL_ONLINE_AND_NO_OVERWRITE=PASS
          python3 -B .github/checks/test_architecture_gate.py -q
          python3 -B scripts/check_p07_modules.py
          python3 -B scripts/check_p07_terminal_ux.py
          python3 -B .github/checks/architecture_gate.py             --manifest "$PRIVATE/.github/checks/code_architecture.json"             --gov-root "$GOV" --git-root "$PRIVATE"             --base-sha 905599e8ca6ac6fd766856c35301328388b3eb81             --head-sha b3d58fecc737f52ffcd6d89482e8888b760b394d
          echo P07_D04_SQLITE_CODE_ARCH_NAMING_AND_MODULE_SCOPE=PASS
          echo P07_D04_SQLITE_REAL_OLD_VPS_CP2_MIGRATION=NOT_RUN
          echo P07_D04_SQLITE_FULL_SITE_CROSS_ASSET_PARITY=NOT_PROVEN
          echo P07_D04_SQLITE_PRODUCTION_DNS=UNCHANGED
      - name: Always remove transient private repository and SQLite fixtures
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private .gov-doc
          test ! -e .p07-private
          test ! -e .gov-doc
          echo P07_D04_SQLITE_PUBLIC_RUNNER_PRIVATE_WORKSPACE_REMOVED=PASS
