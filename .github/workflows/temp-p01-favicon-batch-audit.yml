name: P01 Favicon Batch Audit

on:
  push:
    branches:
      - test-p01-favicon-batch-audit-20260930
    paths:
      - '.github/workflows/temp-p01-favicon-batch-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P01 V2.47.129 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b7f3c2580d6d17b35c63cd14dfd4354b41fa1539
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product

      - name: Audit reported domains through provider and current validator
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >/tmp/favicon-batch-audit.php <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/product/src/app/bootstrap.php';
          $domains=['www.unsubscribe.co','mynimi.net','motrix.app','icesofts.com','7-zip.org','getsharex.com','youtube4kdownloader.com'];
          $ref=new ReflectionClass(VfIconCache::class);
          $cache=$ref->newInstanceWithoutConstructor();
          $validate=$ref->getMethod('validateImage');
          $validate->setAccessible(true);
          foreach($domains as $domain){
              $url='https://a.favicon.im/'.$domain.'?throw-error-on-404=true';
              $cmd='curl -sS --max-time 12 -w '.escapeshellarg("\n__META__%{http_code}|%{content_type}|%{size_download}").' '.escapeshellarg($url);
              $out=shell_exec($cmd);
              if(!is_string($out)){echo json_encode(['domain'=>$domain,'curl'=>false])."\n";continue;}
              $pos=strrpos($out,"\n__META__");
              $body=$pos===false?$out:substr($out,0,$pos);
              $meta=$pos===false?'':substr($out,$pos+9);
              [$status,$ct,$bytes]=array_pad(explode('|',trim($meta),3),3,'');
              $row=['domain'=>$domain,'status'=>(int)$status,'content_type'=>$ct,'bytes'=>(int)$bytes];
              if((int)$status>=200&&(int)$status<300){
                  try{
                      $r=$validate->invoke($cache,$body,$ct);
                      $row['accepted']=true;
                      $row['mime']=$r['mime']??'';
                      $row['width']=$r['width']??0;
                      $row['height']=$r['height']??0;
                  }catch(Throwable $e){
                      $row['accepted']=false;
                      $row['error']=$e->getMessage();
                      $row['head_hex']=bin2hex(substr($body,0,32));
                  }
              }else{
                  $row['accepted']=false;
              }
              echo json_encode($row,JSON_UNESCAPED_UNICODE|JSON_UNESCAPED_SLASHES)."\n";
          }
          PHP
          php /tmp/favicon-batch-audit.php
          echo '--- UNSCRIBE SOURCE CHECK ---'
          curl -L -sS --max-time 12 -D /tmp/unsub-root.headers -o /tmp/unsub-root.body 'https://www.unsubscribe.co/favicon.ico' || true
          tr -d '\r' </tmp/unsub-root.headers | grep -Ei '^(HTTP/|content-type:|content-length:)' || true
          printf 'ROOT_BYTES='; stat -c%s /tmp/unsub-root.body 2>/dev/null || echo 0
          curl -L -sS --max-time 12 -D /tmp/unsub-page.headers -o /tmp/unsub-page.html 'https://www.unsubscribe.co/' || true
          tr -d '\r' </tmp/unsub-page.headers | grep -Ei '^(HTTP/|content-type:|content-length:)' || true
          php -r '$s=@file_get_contents("/tmp/unsub-page.html")?:""; preg_match_all("/<link\\b[^>]*>/i",$s,$m); foreach($m[0] as $tag){ if(preg_match("/rel\\s*=\\s*([\"\x27])[^\"\x27>]*(?:icon|apple-touch-icon)[^\"\x27>]*\\1/i",$tag)) echo $tag,"\n"; }'
          echo P01_FAVICON_BATCH_AUDIT=PASS
