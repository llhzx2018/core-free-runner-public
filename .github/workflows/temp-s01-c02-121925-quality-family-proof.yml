name: TEMP S01-C02 1.21.925 Quality Family Proof

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 851a0c07ae076567fa831ccdf3155a0919462f92
      BASE_SHA: f3e4cdd9203a300e910040a6607f645c011a4373

    steps:
      - name: Checkout exact private product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 851a0c07ae076567fa831ccdf3155a0919462f92
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: product
          persist-credentials: false

      - name: Assert exact source and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(tr -d '\r\n' < product/VERSION)" = "1.21.925"
          actual="$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" | sort)"
          expected="$(printf '%s\n' \
            CHANGELOG.md \
            VERSION \
            assets/css/current/admin-s01-quality-family-r36.css \
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php \
            tests/s01-c02-121925-quality-family-final-r36-contract.php \
            vf-ops.php | sort)"
          test "$actual" = "$expected"
          test "$(git -C product diff --name-only "$BASE_SHA" "$SOURCE_SHA" -- database config includes/v6 includes/wp-update docs/authority includes/admin-v13/services | wc -l)" = "0"

      - name: PHP syntax and R36 contract
        shell: bash
        run: |
          set -euo pipefail
          php -l product/vf-ops.php
          php -l product/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          php -l product/tests/s01-c02-121925-quality-family-final-r36-contract.php
          php product/tests/s01-c02-121925-quality-family-final-r36-contract.php

      - name: Quality child runtime authority proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("product")
          loader=(root/"includes/views/admin-style-helpers/admin-s01-uiux-polish.php").read_text(encoding="utf-8")
          css=(root/"assets/css/current/admin-s01-quality-family-r36.css").read_text(encoding="utf-8")
          assert "$isQualityChild = in_array($routeKey, ['acceptance_source','acceptance_online','acceptance_components','acceptance_export'], true);" in loader
          assert "'vf-ops-admin-s01-quality-family-r36' => 'assets/css/current/admin-s01-quality-family-r36.css'" in loader
          compat=loader.find("vf-ops-admin-s01-compat-r32")
          r36=loader.find("vf-ops-admin-s01-quality-family-r36")
          assert r36>=0 and (compat<0 or r36>compat)
          for cls in [
            ".vf-source-page",".vf-online-page",".vf-component-page",".vf-export-page",
            ".vf-source-head h1",".vf-online-head h1",".vf-component-page-title h1",".vf-export-page-title h1"
          ]:
              assert cls in css, cls
          for token in ["--vf-v6-page-title-size","--vf-v6-brand","--vf-v6-control-radius"]:
              assert token in css, token
          assert css.count("{")==css.count("}")
          print("S01-C02 1.21.925 Quality family final authority PASS")
          PY

      - name: Remove transient private checkout
        if: always()
        shell: bash
        run: rm -rf product

# synchronize proof
