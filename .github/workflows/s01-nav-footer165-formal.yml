name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-nav-footer165-20261022]
    paths: ['.github/workflows/s01-nav-footer165-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.165
  TARGET_SHA: a017844e57272eb85e8bd9563cbd46650ce67ad8
  TARGET_TREE: e656113c1461d1bdd6af5802fad598469e9b90b3
  BASE_SHA: 6142d47bf4f8409ae9d5e7888e5772b669fceee2
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a017844e57272eb85e8bd9563cbd46650ce67ad8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39711214772 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39711214772 --jq .head_sha)" = c97427bcb4bef7d7ee60030c90c7ef03ca47b3a7
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39711214819 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39711214819 --jq .head_sha)" = c97427bcb4bef7d7ee60030c90c7ef03ca47b3a7
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39711214772 --repo llhzx2018/core-free-runner-public --name s01-nav-footer-39711214772 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/review-before.sha256 candidate-proof/review-after.sha256
          python3 control/lanes/s01-nav-footer165-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']==65
          flows=json.loads(pathlib.Path('candidate-proof/flow-results.json').read_text())
          assert flows['status']=='PASS' and flows['passed']==flows['count'] and flows['count']>=12
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='f617fdfccd6fef7999bc17878c923bfad800fae714ec50fedce4f7fb343101e8' and new['bytes']==1969213
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.165 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.165 provider/vf-tools-theme_V1.35.165.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.165' --notes '导航与页脚聚焦正式运营：移出研发统计及技术说明，保留菜单绑定、页头和多语言页脚设置；保存、放弃、检查及错误恢复提示简洁明确。65项定向桌面与字段检查、16项真实保存恢复检查、原生升级回退重复安装及数据保护、干净ZIP安装通过。M3U8保持1.25.94；Production由Owner手工升级，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.165 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.165 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.165 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.165.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.165.zip remote/vf-tools-theme_V1.35.165.zip
          echo 'f617fdfccd6fef7999bc17878c923bfad800fae714ec50fedce4f7fb343101e8  remote/vf-tools-theme_V1.35.165.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.165.zip)" = 1969213
          gh release view v1.35.165 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
