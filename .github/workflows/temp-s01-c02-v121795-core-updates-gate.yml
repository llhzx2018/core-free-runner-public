name: TEMP S01-C02 1.21.795 Core Updates Gate

on:
  push:
    branches:
      - temp/s01-c02-v121795-core-updates-gate-20260903

permissions:
  contents: read

jobs:
  update-channel-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: f32556dd6ad6627defcd9ea9ad7bf03da396ffb7
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify candidate identity and UpdateCore regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = f32556dd6ad6627defcd9ea9ad7bf03da396ffb7
          find updates/update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php updates/update-core/php/tests/run.php
          echo 'UPDATE_CORE_REGRESSION=PASS'

      - name: Verify S01-C02 manifest and released asset readback
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          FILE=updates/projects/S01-C02.json
          jq -e '.schema_version=="wp-component-1.0" and .project_id=="S01" and .component_id=="S01-C02" and .target_version=="1.21.795" and .from_versions==["1.21.794"] and .release_tag=="v1.21.795" and .asset_name=="vf-tools-ops_V1.21.795.zip" and .asset_bytes==3185592 and .asset_sha256=="67d4ad57fc688caf50a8adfb62d4dacc19d292bc3a23544171b2a69083d682e3" and .runtime_files==891 and .runtime_fingerprint=="5a30855fc101fc9975004e8af7ee68e559b2f9522dfce02de7283808f38cffd4" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .backup_required==true and .rollback_supported==true' "$FILE" >/dev/null
          REL="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.795')"
          test "$(jq -r '.id' <<<"$REL")" = 382251692
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.795.zip")|.id' <<<"$REL")" = 543182542
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.795.zip")|.size' <<<"$REL")" = 3185592
          test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.795.zip")|.digest' <<<"$REL")" = 'sha256:67d4ad57fc688caf50a8adfb62d4dacc19d292bc3a23544171b2a69083d682e3'
          TAG="$(curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/llhzx2018/vf-tools-ops/git/ref/tags/v1.21.795')"
          test "$(jq -r '.object.sha' <<<"$TAG")" = 0397b2524049b9b382f760f7b31e36ff66d908f1
          echo 'S01_C02_CHANNEL_IDENTITY=PASS'
