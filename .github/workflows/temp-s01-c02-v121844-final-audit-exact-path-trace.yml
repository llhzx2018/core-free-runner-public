name: TEMP S01-C02 Ops 1.21.844 Final Audit Exact Path Trace
on:
  push:
    branches:
      - temp/s01-c02-v121844-record-isolation-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121844-final-audit-exact-path-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 38be815bd77ae62548fe763b106bfec0b937d2c7
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Resolve exact paths and storage shape
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ops
          test "$(git rev-parse HEAD)" = '38be815bd77ae62548fe763b106bfec0b937d2c7'
          echo '=== REOPEN EMITTER FILES ==='
          mapfile -t emitters < <(git grep -l -F '最终候选包无法打开，不能标记可上传。' -- '*.php')
          printf '%s\n' "${emitters[@]}"
          test "${#emitters[@]}" -ge 1
          for f in "${emitters[@]}"; do
            echo "--- EMITTER $f ---"
            line=$(grep -n -m1 -F '最终候选包无法打开，不能标记可上传。' "$f" | cut -d: -f1)
            start=$((line-18)); [ "$start" -lt 1 ] && start=1
            end=$((line+16))
            sed -n "${start},${end}p" "$f"
          done
          echo '=== FINAL_AUDIT_FAIL HELPER FILES ==='
          mapfile -t helpers < <(git grep -l -E 'function[[:space:]]+final_audit_fail|final_audit_fail[[:space:]]*\(' -- '*.php')
          printf '%s\n' "${helpers[@]}"
          test "${#helpers[@]}" -ge 1
          for f in "${helpers[@]}"; do
            if grep -q -E 'function[[:space:]]+final_audit_fail' "$f"; then
              echo "--- HELPER $f ---"
              line=$(grep -n -m1 -E 'function[[:space:]]+final_audit_fail' "$f" | cut -d: -f1)
              start=$((line-18)); [ "$start" -lt 1 ] && start=1
              end=$((line+55))
              sed -n "${start},${end}p" "$f"
            fi
          done
          echo TRACE_V121844_FINAL_AUDIT_EXACT_PATH=PASS
