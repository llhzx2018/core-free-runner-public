name: TEMP S01-C02 Ops Static Source Authority Extract
on:
  push:
    branches: [temp/s01-c02-v121809-production-readback-20260904]
    paths: ['.github/workflows/temp-s01-c02-v121809-source-authority-extract.yml']
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract exact job and source persistence functions
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$R"
          git clone -q --branch main "https://x-access-token:${R}@github.com/llhzx2018/vf-tools-ops.git" ops
          cd ops
          test "$(git rev-parse HEAD)" = 'e4c5fc3dece349ca23f0fea361d55709d4b3f82c'
          echo '=== FILE LOCATORS ==='
          find . -type f \( -name 'publish-zip.php' -o -name '*static*publish*.php' -o -name '*export*source*.php' \) -print | sort
          echo '=== FUNCTION LOCATORS ==='
          grep -RIn --include='*.php' -E 'function[[:space:]]+vf_ops_static_(jobs|active_job_id|save_jobs|set_active_job|create_job)|function[[:space:]]+vf_ops_publish_zip_model_v121423|vf_ops_static_jobs_v121423|vf_ops_static_active_job_id_v121423' . | sed -n '1,260p'
          echo '=== SOURCE WRITE LOCATORS ==='
          grep -RIn --include='*.php' -E "source_path.*=|\['source_path'\]|source_sha256|source_size|vf-ops-static-sources" . | sed -n '1,360p'
          echo '=== CLEANUP LOCATORS ==='
          grep -RIn --include='*.php' -E 'unlink\(|rmdir\(|delete.*job|remove.*job|unset\(\$jobs|static-sources|source\.zip' . | sed -n '1,360p' || true
          echo '=== EXACT CONTEXTS ==='
          while IFS=: read -r f n rest; do
            [ -n "$f" ] || continue
            start=$(( n>35 ? n-35 : 1 )); end=$(( n+95 ));
            echo "--- $f:$n ---"; sed -n "${start},${end}p" "$f";
          done < <(grep -RIn --include='*.php' -E 'function[[:space:]]+vf_ops_static_jobs_v121423|function[[:space:]]+vf_ops_static_active_job_id_v121423|function[[:space:]]+vf_ops_publish_zip_model_v121423' . | head -n 12)
          echo 'PASS_STATIC_SOURCE_AUTHORITY_EXTRACT'
