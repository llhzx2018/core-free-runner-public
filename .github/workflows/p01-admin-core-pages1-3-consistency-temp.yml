name: p01-admin-core-pages1-3-consistency-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-admin-core-pages1-3-consistency-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: 77e3fdd1f136840ae830730b2100c979adf06eaa
      TARGET_SHA: 1a3f48b6ef8d2323979b4a84b7cd003ae9b57e4f
    steps:
      - name: Checkout exact P01 sources
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in baseline current; do
            git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPO}.git" "$name"
          done
          git -C baseline fetch -q --depth 1 origin "$BASE_SHA"
          git -C baseline checkout -q --detach FETCH_HEAD
          git -C current fetch -q --depth 1 origin "$TARGET_SHA"
          git -C current checkout -q --detach FETCH_HEAD
          echo P01_CORE_PAGES_1_3_EXACT_SOURCE=PASS

      - name: Verify bounded three-file diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C current fetch -q --depth 1 origin "$BASE_SHA"
          git -C current diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/assets/admin-resource-manager-core.js
          src/assets/admin-resource-manager.css
          tests/unit/admin_core_pages_1_3_consistency_closure_contract.php
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          test "$(tr -d '\r\n ' < current/VERSION)" = "2.47.42"
          echo P01_CORE_PAGES_1_3_BOUNDED_DIFF=PASS

      - name: Lint and focused core-page contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check current/src/assets/admin-resource-manager-core.js
          tests=(
            tests/unit/admin_overview_page1_polish_contract.php
            tests/unit/admin_overview_actionable_health_contract.php
            tests/unit/pending_page_visual_closure_contract.php
            tests/unit/pending_inbox_presentation_contract.php
            tests/unit/pending_list_action_continuity_contract.php
            tests/unit/admin_all_resources_page3_polish_contract.php
            tests/unit/resource_manager_pagination_context_contract.php
            tests/unit/admin_core_pages_1_3_consistency_closure_contract.php
          )
          for t in "${tests[@]}"; do
            php -l "current/$t"
            php "current/$t"
          done
          echo P01_CORE_PAGES_1_3_FOCUSED=PASS

      - name: Canonical zero-debt guard
        shell: bash
        run: |
          set -Eeuo pipefail
          bash current/tests/canonical_release_regression.sh current baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -q '^P01_CANONICAL_CURRENT_FAILURE_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_NEW_REGRESSION_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_LEGACY_TEST_DEBT_COUNT=0$' /tmp/canonical.txt
          grep -q '^P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS$' /tmp/canonical.txt
          echo P01_CORE_PAGES_1_3_CANONICAL=PASS
