name: P01 V2.47.261 All Resources Closure Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247261-all-resources-closure.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 2f07f2625301968333b0849b564696c6766b8aa8
          git -C candidate checkout -q --detach 2f07f2625301968333b0849b564696c6766b8aa8
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.261"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.261"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin 96b9633ac7914d7b6f4bdb5320060e0112ccc09b
          git -C baseline checkout -q --detach 96b9633ac7914d7b6f4bdb5320060e0112ccc09b
          echo P01_V247261_EXACT_SOURCE=PASS

      - name: Syntax and focused All Resources contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/admin-resource-manager-core.js
          php -l candidate/src/surface-manager.php
          php -l candidate/src/app/SurfaceRepository.php
          php -l candidate/src/app/ResourceSearch.php
          php -l candidate/src/app/bootstrap.php
          php candidate/tests/unit/all_resources_v247261_closure_contract.php
          php candidate/tests/unit/all_resources_editor_state_contract.php
          php candidate/tests/unit/resource_search_contract.php
          php candidate/tests/unit/resource_manager_pagination_context_contract.php
          php candidate/tests/unit/six_resource_admin_manager_contract.php
          php candidate/tests/unit/admin_all_resources_final_polish_r7_contract.php
          php candidate/tests/unit/admin_all_resources_readability_r6_contract.php
          php candidate/tests/unit/admin_all_resources_mature_list_contract.php
          php candidate/tests/unit/pending_action_input_guard_v247258_contract.php
          echo P01_V247261_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247261_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only 96b9633ac7914d7b6f4bdb5320060e0112ccc09b..2f07f2625301968333b0849b564696c6766b8aa8 | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
