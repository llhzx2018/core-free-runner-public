name: P01 V2.36.4 Formal Staging Develop R4
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-formal-staging-develop-r4-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORMAL_SOURCE: 6b321422bce5a834521786d8233149c7624aa014
      RUNTIME_TREE: e1ee914a6d9e61bac7931b1f5363a8c7e24e925a
      EXPECTED_MAIN: d35038c32b5a287636ee92d9fe074ea12c1469ef
      EXPECTED_DEVELOP: 5615d19b07303132e8fc2e374de1236a37f3cb16
      STRICT_RUN: '33521577888'
      STRICT_ARTIFACT_ID: '9805930257'
      STRICT_ARTIFACT_DIGEST: sha256:82ba94e73a64f31585f9309a3a27f991daf3ff0a54a5b412e4706c51822fd2c6
      STAGING_BRANCH: release/p01-v2364-formal-staging-20260901
    steps:
      - name: Checkout exact develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXPECTED_DEVELOP }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Stage exact formal files preserving closure authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$STRICT_RUN/artifacts --jq ".artifacts[] | select(.id==$STRICT_ARTIFACT_ID) | .digest")" = "$STRICT_ARTIFACT_DIGEST"
          for rid in 33522003733 33522197416 33522443478; do test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$rid --jq .conclusion)" = failure; done
          cd p01
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          ! git ls-remote --exit-code --heads origin "refs/heads/$STAGING_BRANCH" >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin refs/tags/v2.36.4 >/dev/null 2>&1
          git fetch origin "$FORMAL_SOURCE" --quiet
          test "$(git rev-parse "$FORMAL_SOURCE:src")" = "$RUNTIME_TREE"
          ACTUAL_ALL=$(git diff --name-only "$EXPECTED_DEVELOP" "$FORMAL_SOURCE" | sort | tr '\n' ' ')
          EXPECTED_ALL='CHANGELOG.md VERSION VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md src/VERSION.txt src/app/bootstrap.php '
          test "$ACTUAL_ALL" = "$EXPECTED_ALL"
          git switch -c "$STAGING_BRANCH" "$EXPECTED_DEVELOP"
          git checkout "$FORMAL_SOURCE" -- CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php
          EXPECTED_RELEASE='CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php '
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "$EXPECTED_RELEASE"
          test -z "$(git diff --name-only)"
          git diff --cached --check
          for f in CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php; do
            test "$(git hash-object "$f")" = "$(git rev-parse "$FORMAL_SOURCE:$f")"
          done
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git hash-object "$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"
          done
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git commit -m 'release(P01): stage V2.36.4 formal patch source'
          STAGED=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" src/app/bootstrap.php >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.36.3
          test "$(jq -r .candidate_version VF_PROJECT.json)" = 2.36.4
          test "$(jq -r .schema_version VF_PROJECT.json)" = 2026082901
          EXPECTED_REMAIN='docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md '
          test "$(git diff --name-only "$STAGED" "$FORMAL_SOURCE" | sort | tr '\n' ' ')" = "$EXPECTED_REMAIN"
          for f in docs/authority/CURRENT.md docs/evidence/P01_V2.36.3_OWNER_PRODUCTION_CLOSURE_20260901.md docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md docs/handoff/CURRENT_STATE.md; do
            test "$(git rev-parse "$STAGED:$f")" = "$(git rev-parse "$EXPECTED_DEVELOP:$f")"
          done
          git push origin "HEAD:refs/heads/$STAGING_BRANCH"
          test "$(git ls-remote origin refs/heads/$STAGING_BRANCH | awk '{print $1}')" = "$STAGED"
          test "$(git ls-remote origin refs/heads/develop | awk '{print $1}')" = "$EXPECTED_DEVELOP"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          printf 'P01_V2364_FORMAL_STAGING_R4=PASS\nSTAGED=%s\nRUNTIME_TREE=%s\nBASE_DEVELOP=%s\nMAIN=%s\nSTRICT_RUN=%s\nRELEASE_SCOPE=CHANGELOG.md,VERSION,VF_PROJECT.json,src/VERSION.txt,src/app/bootstrap.php\nPRESERVED_AUTHORITY=4_V2363_CLOSURE_DOCS\nR1=HARNESS_ROOT_TREE_POLICY\nR2_R3=HARNESS_GIT_INDEX_DIFF_SEMANTICS\nMAIN_WRITE=NO\nTAG_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$STAGED" "$RUNTIME_TREE" "$EXPECTED_DEVELOP" "$EXPECTED_MAIN" "$STRICT_RUN" | tee /tmp/p01-v2364-formal-staging-r4.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2364-formal-staging-r4-${{ github.run_id }}
          path: /tmp/p01-v2364-formal-staging-r4.txt
          if-no-files-found: warn
          retention-days: 90
