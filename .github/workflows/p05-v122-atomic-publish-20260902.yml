name: P05 V1.2.2 Atomic Asset Publication

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v122-atomic-publish-20260902.yml']

permissions:
  contents: read
  actions: read

jobs:
  publish-atomic-assets:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v122-atomic-publish-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ATOMIC_RUN: '33533825437'
      ATOMIC_JOB: '99943145098'
      ATOMIC_ARTIFACT_ID: '9810799417'
      ATOMIC_ARTIFACT_NAME: P05_V1.2.2_VPS_ATOMIC_d80061a5e84c72a6c3f6e7d4ee240d59cea269b5
      RELEASE_ID: '380671190'
      RELEASE_TAG: v1.2.2
      RELEASE_TARGET: 04e4b8546357301e90b6ab7d9b50907369ea58eb
      FULL_NAME: VF_SEO_V1.2.2_FULL.zip
      FULL_SHA256: fb2bdcd4efb6edd408fb81635b488415d756622f031897acb89021747bf6b297
      UPDATE_SHA256: 078fccae7e3097d842b15233d5325c174abc711d891fe1c9e3952325738a09a2
      UPDATE_BYTES: '1162103'
      REPAIR_SHA256: 5ad86463cafc28642f8782069393d9464308aada75617a053c58d51983f12901
      REPAIR_BYTES: '3651613'
      SELFTEST_SHA256: 4f5179d80f9f9620ee98b8ad836a8b3e972550d2bea05a605e88f6aaffdf08d9
      META_SHA256: 859d0f5efe9663899c90088069ca9da17d5867a1ce09137695432ce443992b6e
      GATE_SHA256: d36f8b5cc2fbe4688715a317a35fb7afbf173ef76bfe4a38f6f2871b1ff973c0
      SUMS_SHA256: ec078f62c587c4616000d1d31cf6d8554a8045298e174d7ffe1a5060fe90e07e
    steps:
      - name: Bind exact Atomic PASS and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$ATOMIC_RUN" > /tmp/run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$ATOMIC_JOB" > /tmp/job.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/artifacts/$ATOMIC_ARTIFACT_ID" > /tmp/artifact.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/run.json')); job=json.load(open('/tmp/job.json')); art=json.load(open('/tmp/artifact.json'))
          assert run['id']==int(os.environ['ATOMIC_RUN']) and run['conclusion']=='success'
          assert job['id']==int(os.environ['ATOMIC_JOB']) and job['run_id']==int(os.environ['ATOMIC_RUN']) and job['conclusion']=='success' and job['name']=='atomic'
          assert art['id']==int(os.environ['ATOMIC_ARTIFACT_ID']) and art['name']==os.environ['ATOMIC_ARTIFACT_NAME'] and not art['expired']
          print('P05_V122_ATOMIC_EVIDENCE_BINDING=PASS')
          PY

      - name: Download exact Atomic evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p05-atomic
          gh run download "$ATOMIC_RUN" --repo llhzx2018/core-free-runner-public --name "$ATOMIC_ARTIFACT_NAME" --dir /tmp/p05-atomic
          find /tmp/p05-atomic -maxdepth 2 -type f -printf '%f\n' | sort

      - name: Verify exact six Atomic assets
        run: |
          set -Eeuo pipefail
          cd /tmp/p05-atomic
          for f in repair-v1.2.2.php VF_SEO_V1.2.2_UPDATE.zip atomic-self-test.json P05-V1.2.2-ATOMIC-METADATA.json P05-V1.2.2-ATOMIC-GATE.json SHA256SUMS.txt; do test -s "$f"; done
          test "$(sha256sum VF_SEO_V1.2.2_UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA256"
          test "$(stat -c%s VF_SEO_V1.2.2_UPDATE.zip)" = "$UPDATE_BYTES"
          test "$(sha256sum repair-v1.2.2.php | awk '{print $1}')" = "$REPAIR_SHA256"
          test "$(stat -c%s repair-v1.2.2.php)" = "$REPAIR_BYTES"
          test "$(sha256sum atomic-self-test.json | awk '{print $1}')" = "$SELFTEST_SHA256"
          test "$(sha256sum P05-V1.2.2-ATOMIC-METADATA.json | awk '{print $1}')" = "$META_SHA256"
          test "$(sha256sum P05-V1.2.2-ATOMIC-GATE.json | awk '{print $1}')" = "$GATE_SHA256"
          test "$(sha256sum SHA256SUMS.txt | awk '{print $1}')" = "$SUMS_SHA256"
          python3 - <<'PY'
          import json
          gate=json.load(open('P05-V1.2.2-ATOMIC-GATE.json'))
          meta=json.load(open('P05-V1.2.2-ATOMIC-METADATA.json'))
          assert gate['project_id']=='P05' and gate['source_version']=='1.2.1' and gate['target_version']=='1.2.2' and gate['result']=='PASS'
          for k in ['self_test','actual_upgrade','data_preservation','idempotence','rollback','interruption_recovery','browser_single_php','proxy_https_same_origin']:
              assert gate[k]=='PASS', (k,gate.get(k))
          assert gate['production_write']==0 and gate['distribution_revision']=='R2'
          assert meta['source_version']=='1.2.1' and meta['target_version']=='1.2.2' and meta['status']=='FORMAL_ATOMIC_ARTIFACT_GATE_PASS'
          assert meta['proxy_https_same_origin']=='PASS' and meta['distribution_revision']=='R2' and meta['production_write']==0
          print('P05_V122_ATOMIC_SIX_ASSETS_LOCAL=PASS')
          PY

      - name: Verify formal Release before supplemental write
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-before.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('/tmp/release-before.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['tag_name']==os.environ['RELEASE_TAG'] and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          forbidden=['repair-v1.2.2.php','VF_SEO_V1.2.2_UPDATE.zip','atomic-self-test.json','P05-V1.2.2-ATOMIC-METADATA.json','P05-V1.2.2-ATOMIC-GATE.json','SHA256SUMS.txt']
          assert all(x not in a for x in forbidden), [x for x in forbidden if x in a]
          print('P05_V122_RELEASE_PRE_SUPPLEMENT=PASS')
          PY

      - name: Publish exact Atomic assets to v1.2.2 Release
        working-directory: /tmp/p05-atomic
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release upload "$RELEASE_TAG" --repo llhzx2018/vf-seo \
            VF_SEO_V1.2.2_UPDATE.zip \
            repair-v1.2.2.php \
            atomic-self-test.json \
            P05-V1.2.2-ATOMIC-METADATA.json \
            P05-V1.2.2-ATOMIC-GATE.json \
            SHA256SUMS.txt
          echo 'P05_V122_ATOMIC_RELEASE_UPLOAD=PASS'

      - name: Remote readback all v1.2.2 Release assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/$RELEASE_TAG" > /tmp/release-after.json
          python3 - <<'PY'
          import json,os,hashlib,pathlib
          r=json.load(open('/tmp/release-after.json')); a={x['name']:x for x in r['assets']}
          assert r['id']==int(os.environ['RELEASE_ID']) and r['target_commitish']==os.environ['RELEASE_TARGET']
          assert a[os.environ['FULL_NAME']]['digest']=='sha256:'+os.environ['FULL_SHA256']
          names=['repair-v1.2.2.php','VF_SEO_V1.2.2_UPDATE.zip','atomic-self-test.json','P05-V1.2.2-ATOMIC-METADATA.json','P05-V1.2.2-ATOMIC-GATE.json','SHA256SUMS.txt']
          for name in names:
              p=pathlib.Path('/tmp/p05-atomic')/name
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert a[name]['digest']=='sha256:'+digest, (name,a[name].get('digest'),digest)
              assert a[name]['size']==p.stat().st_size
              print(f'P05_ASSET_{name}_ID={a[name]["id"]}')
          assert a['VF_SEO_V1.2.2_UPDATE.zip']['digest']=='sha256:'+os.environ['UPDATE_SHA256']
          assert a['repair-v1.2.2.php']['digest']=='sha256:'+os.environ['REPAIR_SHA256']
          print('P05_V122_ATOMIC_RELEASE_REMOTE_READBACK=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY
