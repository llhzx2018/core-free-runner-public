name: TEMP P08 Domain R17-R19 exact-source native acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-domain-r17-r19-20261123.yml'
permissions:
  contents: read
concurrency:
  group: temp-p08-domain-r17-r19-20261123
  cancel-in-progress: false
jobs:
  owner-laravel-vue-sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-domain-r17-r19-bounded-native-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Private exact-source checkout (ephemeral)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: fd7aa877ff85d8616e6dc935e03020b99da508c0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - name: Exact-source identity and files
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = fd7aa877ff85d8616e6dc935e03020b99da508c0
          test -f private-p08/database/migrations/2026_11_23_000013_create_domain_static_bindings.php
          test -f private-p08/tests/Feature/DomainCenterWorkflowTest.php
          echo P08_DOMAIN_SOURCE=PASS
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, pdo_mysql, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP parse all changed controllers, actions, migration and tests
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          for p in app/Http/Controllers/DomainCenterController.php app/Http/Controllers/WorkspaceController.php app/Modules/Domains/Actions/BindDomainStaticBundle.php app/Modules/Domains/Actions/UpdateDomainRegistration.php database/migrations/2026_11_23_000013_create_domain_static_bindings.php tests/Feature/DomainCenterWorkflowTest.php routes/web.php; do
            php -l "$p" > /dev/null
          done
          echo P08_DOMAIN_PHP_LINT=PASS
      - name: Locked dependencies and actual domain Laravel plus Vue tests
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-composer.log" 2>&1 || { echo P08_DOMAIN_COMPOSER=FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-npm.log" 2>&1 || { echo P08_DOMAIN_NPM=FAIL; exit 1; }
          php vendor/bin/phpunit --no-coverage --colors=never tests/Feature/DomainCenterWorkflowTest.php > "$RUNNER_TEMP/p08-phpunit.log" 2>&1 || {
            echo P08_DOMAIN_PHPUNIT=FAIL
            grep -E '^Tests:|^ERRORS!|^FAILURES!' "$RUNNER_TEMP/p08-phpunit.log" | tail -n 5 || true
            exit 1
          }
          echo P08_DOMAIN_OWNER_HTTP_PHPUNIT=PASS
          npm run typecheck > "$RUNNER_TEMP/p08-typecheck.log" 2>&1 || { echo P08_DOMAIN_TYPESCRIPT=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-build.log" 2>&1 || { echo P08_DOMAIN_VUE_BUILD=FAIL; exit 1; }
          npm run test:unit > "$RUNNER_TEMP/p08-vitest.log" 2>&1 || { echo P08_DOMAIN_VITEST=FAIL; exit 1; }
          echo P08_DOMAIN_VUE_TYPES_BUILD_VITEST=PASS
      - name: Guaranteed private source and logs removal
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-*.log
          test ! -e private-p08
          echo P08_DOMAIN_EPHEMERAL_CLEANUP=PASS

  native-schema:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-domain-r17-r19-bounded-native-20261123'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-domain-ci
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-domain-ci
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: p08_domain_ci
      DB_USERNAME: root
      DB_PASSWORD: synthetic-only-domain-ci
      APP_ENV: testing
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Private exact-source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: fd7aa877ff85d8616e6dc935e03020b99da508c0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Native database migration, binding FK and rollback
        shell: bash
        working-directory: private-p08
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = fd7aa877ff85d8616e6dc935e03020b99da508c0
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-sql-composer.log" 2>&1 || { echo P08_DOMAIN_SQL_DEPENDENCIES=FAIL; exit 1; }
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("DB_PASSWORD")); $p->exec("CREATE DATABASE IF NOT EXISTS p08_domain_ci");' > /dev/null
          php artisan migrate --force > "$RUNNER_TEMP/p08-sql-migrate.log" 2>&1 || { echo P08_DOMAIN_SQL_MIGRATE=FAIL; exit 1; }
          php -r '$p = new PDO("mysql:host=127.0.0.1;dbname=p08_domain_ci;port=3306","root",getenv("DB_PASSWORD")); if (!$p->query("SHOW TABLES LIKE '\''domain_static_bindings'\''")->fetchColumn()) exit(1);' || { echo P08_DOMAIN_SQL_TABLE=FAIL; exit 1; }
          echo P08_DOMAIN_NATIVE_DB_SCHEMA=PASS
      - name: Guaranteed private source and logs removal
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-*.log
          test ! -e private-p08
          echo P08_DOMAIN_EPHEMERAL_CLEANUP=PASS
