name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-layout-editor164-20261022]
    paths: ['.github/workflows/s01-layout-editor164-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.164
  TARGET_SHA: 6142d47bf4f8409ae9d5e7888e5772b669fceee2
  TARGET_TREE: 72d60750ea28bb4668b7e13a69c495ce1b32b9bb
  BASE_SHA: c111556c137865d5d523fff2fbd52b57f9f77db3
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 6142d47bf4f8409ae9d5e7888e5772b669fceee2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof render-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39708329639 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39708329639 --jq .head_sha)" = 22fbaa23e18b3f181bb15bc12b33a05ba40fbe0a
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39707693372 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39707693372 --jq .head_sha)" = b54442b989eab0f189b5771df83e5b4d2e4ba228
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39708329639 --repo llhzx2018/core-free-runner-public --name s01-layout-editor-39708329639 --dir candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39707530882 --jq .head_sha)" = e08ae706a291a664b0f3edf91e84e3e8f66592d0
          gh run download 39707530882 --repo llhzx2018/core-free-runner-public --name s01-layout-editor-39707530882 --dir render-proof
          cmp render-proof/state-before.sha256 render-proof/state-after.sha256
          cmp render-proof/review-before.sha256 render-proof/review-after.sha256
          python3 control/lanes/s01-layout-editor164-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('render-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']==84
          flows=json.loads(pathlib.Path('candidate-proof/flow-results.json').read_text())
          assert flows['status']=='PASS' and flows['passed']==flows['count'] and flows['count']>=12
          render=json.loads(pathlib.Path('render-proof/package.json').read_text())
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k]==render[k],k
          assert new['sha256']=='7e15c3528911a00b18ccd4b6237c5a540eca399b1d15ee2b4593e5d9eb9441ed' and new['bytes']==1969957
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.164 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.164 provider/vf-tools-theme_V1.35.164.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.164' --notes '布局编辑聚焦正式运营：移出研发接入状态、消费链、模块ID和重复摘要；保留全部原有设置，放弃和保存集中操作，保存反馈简洁一致。定向20页型字段身份、桌面4宽度、真实保存重载、错误恢复、并发保护、放弃和返回、干净ZIP安装及旧版升级回退重复安装与数据保护通过后发布。M3U8保持1.25.94；Production由Owner手工升级，手机暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.164 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.164 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.164 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.164.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.164.zip remote/vf-tools-theme_V1.35.164.zip
          echo '7e15c3528911a00b18ccd4b6237c5a540eca399b1d15ee2b4593e5d9eb9441ed  remote/vf-tools-theme_V1.35.164.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.164.zip)" = 1969957
          gh release view v1.35.164 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-operations-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
