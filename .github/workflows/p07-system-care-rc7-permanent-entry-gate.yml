name: P07 System Care RC7 Permanent Entry Gate

on:
  push:
    branches: [gate/p07-system-care-rc7-permanent-entry-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc7-permanent-entry-gate.yml'

permissions:
  contents: read

jobs:
  permanent-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify permanent Toolbox main link
        shell: bash
        run: |
          set -Eeuo pipefail
          toolbox=/tmp/p07-toolbox.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-toolbox.sh -o "$toolbox"
          bash -n "$toolbox"
          help="$(NO_COLOR=1 bash "$toolbox" --help)"
          grep -Fq 'P07 · VF Server Ops V0.1.0' <<<"$help"
          grep -Fq '4. 系统维护 / 安全' <<<"$help"
          grep -Fq '（测试中）' <<<"$help"
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc7"' "$toolbox"
          echo P07_RC7_PERMANENT_TOOLBOX_LINK=PASS

      - name: Verify permanent System Care installer and exact package
        shell: bash
        run: |
          set -Eeuo pipefail
          installer=/tmp/p07-system-care.sh
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/installers/p07-system-care.sh -o "$installer"
          bash -n "$installer"
          grep -Fq "VERSION='0.1.0-rc7'" "$installer"
          grep -Fq "MANIFEST_BLOB='f8158064758a110086d092af72ca2d5f40bc21f3'" "$installer"

          manifest=/tmp/MANIFEST.gitblob
          curl -fsSL --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/main/packages/p07-system-care/0.1.0-rc7/MANIFEST.gitblob -o "$manifest"
          bytes="$(wc -c < "$manifest" | tr -d '[:space:]')"
          actual="$( { printf 'blob %s\0' "$bytes"; cat "$manifest"; } | sha1sum | awk '{print $1}')"
          test "$actual" = f8158064758a110086d092af72ca2d5f40bc21f3
          test "$(wc -l < "$manifest" | tr -d '[:space:]')" = 15
          echo P07_RC7_PERMANENT_PACKAGE_IDENTITY=PASS

      - name: Fresh install through permanent main installer
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash /tmp/p07-system-care.sh status >/tmp/p07-rc7-status.txt
          test "$(NO_COLOR=1 /usr/local/bin/vf-system-care --version | awk '{print $NF}')" = 0.1.0-rc7
          test -x /opt/vf-system-care/intrusion-evidence.sh
          test -f /opt/vf-system-care/lib/intrusion_evidence.py
          test -f /opt/vf-system-care/lib/intrusion_logs.py
          test -f /opt/vf-system-care/lib/intrusion_scan.py
          test -f /opt/vf-system-care/lib/intrusion_state.py
          NO_COLOR=1 /usr/local/bin/vf-system-care --help >/tmp/p07-rc7-help.txt
          grep -Fq 'evidence [menu|status|enable|scan|report|rebaseline|disable]' /tmp/p07-rc7-help.txt
          echo P07_RC7_PERMANENT_INSTALL=PASS

      - name: Read-only evidence status smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo NO_COLOR=1 /usr/local/bin/vf-system-care evidence status >/tmp/p07-rc7-evidence-status.txt
          grep -Eq '网站入侵留证|留证状态|未启用|未建立' /tmp/p07-rc7-evidence-status.txt
          echo P07_RC7_EVIDENCE_STATUS_SMOKE=PASS

      - name: Final permanent-entry marker
        shell: bash
        run: |
          echo P07_SYSTEM_CARE_RC7_OWNER_TEST_ENTRY_READY=PASS
