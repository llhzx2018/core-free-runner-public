name: P01 Authority Gate Admin Public State R2
on:
  push:
    branches: [temp/p01-authority-sync-admin-public-state-20260901]
    paths: [.github/workflows/p01-authority-gate-admin-public-state-r2-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_MERGE: 8b210c93f2d4c71126ff1aed6ec3d317abb51d15
      AUTHORITY_SOURCE: 492b48fa3470a8a63139b21a146884f0cd869d8a
      PRODUCT_TREE: c08166da380b3a4cae06be0a037f32fa7cf2b91e
      PRODUCT_CANDIDATE: aeee995f8a4b10f330938151bbc05b9fe5c74e82
      MACHINE_GATE: '33418067027'
      ARTIFACT: '9767801096'
      ARTIFACT_SHA256: 84901f3d781f7a18c6103ebe744b7c467a5c8557dfcd2d13c61b68f956e4cb24
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 492b48fa3470a8a63139b21a146884f0cd869d8a
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact authority-only gate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$AUTHORITY_SOURCE"
          test "$(git -C product rev-list --count "$PRODUCT_MERGE..$AUTHORITY_SOURCE")" = 1
          git -C product diff --name-only "$PRODUCT_MERGE..$AUTHORITY_SOURCE" | sort | tee /tmp/changed.txt
          printf '%s\n' VF_PROJECT.json docs/authority/CURRENT.md docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md docs/handoff/CURRENT_STATE.md >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git -C product diff --quiet "$PRODUCT_MERGE..$AUTHORITY_SOURCE" -- src
          git -C product diff --check "$PRODUCT_MERGE..$AUTHORITY_SOURCE"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          root=Path('product'); d=json.loads((root/'VF_PROJECT.json').read_text()); c=d['current_change']; l=d['l2_admin_public_view_state']
          assert c['change_id']=='P01-L2-ADMIN-PUBLIC-VIEW-STATE-20260901' and c['latest_merge_pr']==159
          assert c['runtime_product_source']==os.environ['PRODUCT_MERGE'] and c['runtime_product_tree']==os.environ['PRODUCT_TREE']
          assert c['latest_product_candidate']==os.environ['PRODUCT_CANDIDATE'] and c['machine_gate']==int(os.environ['MACHINE_GATE'])
          assert c['evidence_artifact']==int(os.environ['ARTIFACT']) and c['evidence_artifact_sha256']==os.environ['ARTIFACT_SHA256']
          assert c['schema_change'] is False and c['owner_production_write'] is False and c['runner_main_write'] is False
          assert l['pr']==159 and l['machine_gate']==int(os.environ['MACHINE_GATE']) and l['develop_product_merge']==os.environ['PRODUCT_MERGE']
          assert l['product_tree']==os.environ['PRODUCT_TREE'] and l['preview_private_data_leak']=='NONE / PASS' and l['preview_csrf']=='NULL / PASS'
          assert l['login_return_allowlist']=='PASS' and l['preview_return_allowlist']=='PASS' and l['main_write'] is False and l['production_write'] is False
          marker='P01-L2-ADMIN-PUBLIC-VIEW-STATE-20260901'
          for f in ['docs/authority/CURRENT.md','docs/evidence/P01_L2_PRODUCT_WAVE_DEVELOP_MERGE_20260831.md','docs/handoff/CURRENT_STATE.md']:
              s=(root/f).read_text(); assert s.count(marker)==1; assert os.environ['PRODUCT_MERGE'] in s and os.environ['PRODUCT_TREE'] in s and os.environ['MACHINE_GATE'] in s
          print('AUTHORITY_GATE=PASS')
          PY
          printf 'AUTHORITY_SOURCE=%s\nAUTHORITY_TREE=%s\nPRODUCT_MERGE=%s\nPRODUCT_TREE=%s\n' "$AUTHORITY_SOURCE" "$(git -C product rev-parse HEAD^{tree})" "$PRODUCT_MERGE" "$PRODUCT_TREE"
