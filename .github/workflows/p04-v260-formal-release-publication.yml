name: P04 VF Infra V2.6.0 Formal Release Publication

on:
  push:
    branches:
      - p04-v260-formal-release
    paths:
      - '.github/workflows/p04-v260-formal-release-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p04-v260-formal-release-publication
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: llhzx2018/vf-infra
  TARGET_COMMIT: b8d080e432ba811f6689372636022774e558ffc1
  TARGET_TREE: 181cb02c1305500006f8cfe70a0e05bdf3ad7225
  TARGET_VERSION: '2.6.0'
  TARGET_SCHEMA: '14'
  TAG: v2.6.0
  RELEASE_NAME: VF Infra V2.6.0
  EXPECTED_RUNTIME_FILES: '168'
  EXPECTED_RUNTIME_FINGERPRINT: 0c5d14bd437ece1c826e76fee186d0a785838aae329e7406133e4d7f14a6212b
  EXPECTED_SOURCE_MANIFEST_COUNT: '166'
  EXPECTED_SOURCE_MANIFEST_SHA: fe2e51f2332909041f44ec34dc2b2f79075bae336b6767e7401498f1ce73de01
  EXPECTED_FULL_BYTES: '456361'
  EXPECTED_FULL_SHA: 9eb272cae0ff36bfc2c738033d310646545fcf2808c67665f0c13b3c7ab33696
  EXPECTED_UPDATE_BYTES: '52605'
  EXPECTED_UPDATE_SHA: f5b2d7e44cbc5ce1b7d7c7c13dbdc27fa4eaef1b117c54f67c2ac1f752deab75
  EXPECTED_REPAIR_BYTES: '141455'
  EXPECTED_REPAIR_SHA: 62355879a0d139a1d5274dd639ffe96d5ee2e032a900ff08294c4480122cee08

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact private V2.6.0 Product Candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: vf-infra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring
          coverage: none

      - name: Verify frozen Product Identity and release boundary
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n' < VERSION)" = "$TARGET_VERSION"
          test "$(find database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')" = "$TARGET_SCHEMA"
          test ! -e database/migrations/015_v260.sql
          echo 'P04_V260_FROZEN_PRODUCT_IDENTITY_PASS'

      - name: Rebuild byte-exact locked Candidate artifacts
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/v260-formal-release
          python3 scripts/build-v260-candidate-artifacts.py --output build/v260-formal-release | tee /tmp/v260-formal-build.txt
          test "$(stat -c%s build/v260-formal-release/VF_Infra_V2.6.0_FULL.zip)" = "$EXPECTED_FULL_BYTES"
          echo "$EXPECTED_FULL_SHA  build/v260-formal-release/VF_Infra_V2.6.0_FULL.zip" | sha256sum -c -
          test "$(stat -c%s build/v260-formal-release/update-set/VF_Infra_V2.6.0_UPDATE.zip)" = "$EXPECTED_UPDATE_BYTES"
          echo "$EXPECTED_UPDATE_SHA  build/v260-formal-release/update-set/VF_Infra_V2.6.0_UPDATE.zip" | sha256sum -c -
          test "$(stat -c%s build/v260-formal-release/update-set/VF_Infra_V2.6.0_ATOMIC.zip)" = "$EXPECTED_UPDATE_BYTES"
          echo "$EXPECTED_UPDATE_SHA  build/v260-formal-release/update-set/VF_Infra_V2.6.0_ATOMIC.zip" | sha256sum -c -
          test "$(stat -c%s build/v260-formal-release/update-set/repair-v2.6.0.php)" = "$EXPECTED_REPAIR_BYTES"
          echo "$EXPECTED_REPAIR_SHA  build/v260-formal-release/update-set/repair-v2.6.0.php" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          m=json.loads(Path('build/v260-formal-release/V260_CANDIDATE_ARTIFACT_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['version']=='2.6.0' and m['schema']==14 and m['migration']=='NONE'
          assert m['runtime_file_count']==int(os.environ['EXPECTED_RUNTIME_FILES'])
          assert m['runtime_fingerprint']==os.environ['EXPECTED_RUNTIME_FINGERPRINT']
          assert m['source_manifest_count']==int(os.environ['EXPECTED_SOURCE_MANIFEST_COUNT'])
          assert m['source_manifest_sha256']==os.environ['EXPECTED_SOURCE_MANIFEST_SHA']
          assert m['update_eligibility']=='2.5.8 -> 2.6.0'
          assert m['formal_release_executed'] is False and m['production_write']==0 and m['main_write']==0
          print('P04_V260_LOCKED_CANDIDATE_ARTIFACT_IDENTITY_PASS')
          PY

      - name: Stage existing formal release contract assets
        working-directory: vf-infra
        shell: bash
        run: |
          set -Eeuo pipefail
          STAGE=/tmp/p04-v260-release-assets
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp build/v260-formal-release/VF_Infra_V2.6.0_FULL.zip "$STAGE/"
          cp build/v260-formal-release/update-set/VF_Infra_V2.6.0_UPDATE.zip "$STAGE/"
          cp build/v260-formal-release/update-set/VF_Infra_V2.6.0_ATOMIC.zip "$STAGE/"
          cp build/v260-formal-release/update-set/repair-v2.6.0.php "$STAGE/"
          cp build/v260-formal-release/update-set/PACKAGE_MANIFEST.json "$STAGE/"
          cp build/v260-formal-release/update-set/PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt "$STAGE/"
          cp build/v260-formal-release/update-set/SHA256SUMS.txt "$STAGE/"
          cp build/v260-formal-release/V260_CANDIDATE_ARTIFACT_MANIFEST.json "$STAGE/FORMAL_ARTIFACT_MANIFEST.json"
          cp build/v260-formal-release/runtime/release-manifest.json "$STAGE/RELEASE_MANIFEST.json"
          cp docs/operations/package/RELEASE_NOTES.md "$STAGE/RELEASE_NOTES.md"
          (cd "$STAGE" && sha256sum FORMAL_ARTIFACT_MANIFEST.json PACKAGE_MANIFEST.json PRODUCTION_SOURCE_MANIFEST_EXPECTED.txt RELEASE_MANIFEST.json RELEASE_NOTES.md SHA256SUMS.txt VF_Infra_V2.6.0_ATOMIC.zip VF_Infra_V2.6.0_FULL.zip VF_Infra_V2.6.0_UPDATE.zip repair-v2.6.0.php > FORMAL_SHA256SUMS.txt)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('/tmp/p04-v260-release-assets')
          rows={}
          for p in sorted(root.iterdir()):
              if p.is_file(): rows[p.name]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          Path('/tmp/p04-v260-release-expected.json').write_text(json.dumps(rows,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rows,sort_keys=True))
          PY
          echo 'P04_V260_EXISTING_RELEASE_CONTRACT_ASSETS_STAGED_PASS'

      - name: Create or verify exact v2.6.0 tag
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}" >/tmp/v260-tag.json 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/v260-tag.json'))
          sha=d['object']['sha']
          if sha!=os.environ['TARGET_COMMIT']: raise SystemExit(f'TAG_TARGET_MISMATCH {sha}')
          print('P04_V260_TAG_ALREADY_PRESENT_EXACT_PASS')
          PY
          else
            gh api --method POST "repos/${TARGET_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${TARGET_COMMIT}" >/tmp/v260-tag-create.json
            gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}" >/tmp/v260-tag.json
            python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/v260-tag.json'))
          assert d['object']['sha']==os.environ['TARGET_COMMIT']
          print('P04_V260_TAG_CREATE_EXACT_PASS')
          PY
          fi

      - name: Create formal GitHub Release and upload locked assets
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/${TARGET_REPOSITORY}/releases/tags/${TAG}" >/tmp/v260-existing-release.json 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/v260-existing-release.json'))
          if d['name']!=os.environ['RELEASE_NAME'] or d['draft'] or d['prerelease']:
              raise SystemExit('EXISTING_RELEASE_IDENTITY_MISMATCH')
          if d.get('assets'):
              raise SystemExit('EXISTING_RELEASE_ALREADY_HAS_ASSETS_STOP_FOR_READBACK')
          print('P04_V260_EXISTING_EMPTY_RELEASE_IDENTITY_PASS')
          PY
          else
            cat >/tmp/v260-release-body.md <<EOF
          VF Infra V2.6.0 正式发布。

          - Product Commit: ${TARGET_COMMIT}
          - Product Tree: ${TARGET_TREE}
          - Schema: 14 → 14
          - Migration: NONE
          - 唯一正式升级关系: 2.5.8 → 2.6.0
          - FULL_RUNTIME_VS_UPDATE_RESULT_SOURCE_EXACT: PASS
          - Production Upgrade: NOT EXECUTED
          EOF
            gh release create "$TAG" --repo "$TARGET_REPOSITORY" --title "$RELEASE_NAME" --target "$TARGET_COMMIT" --notes-file /tmp/v260-release-body.md
          fi
          gh release upload "$TAG" /tmp/p04-v260-release-assets/* --repo "$TARGET_REPOSITORY"
          echo 'P04_V260_GITHUB_RELEASE_PUBLICATION_REQUEST_COMPLETE'

      - name: Remote readback tag release and every asset digest
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${TAG}" >/tmp/v260-tag-final.json
          gh api "repos/${TARGET_REPOSITORY}/releases/tags/${TAG}" >/tmp/v260-release-final.json
          python3 - <<'PY'
          import json,os
          tag=json.load(open('/tmp/v260-tag-final.json'))
          release=json.load(open('/tmp/v260-release-final.json'))
          expected=json.load(open('/tmp/p04-v260-release-expected.json'))
          if tag['object']['sha']!=os.environ['TARGET_COMMIT']: raise SystemExit('REMOTE_TAG_TARGET_MISMATCH')
          if release['tag_name']!=os.environ['TAG'] or release['name']!=os.environ['RELEASE_NAME'] or release['draft'] or release['prerelease']:
              raise SystemExit('REMOTE_RELEASE_IDENTITY_MISMATCH')
          actual={a['name']:a for a in release.get('assets',[])}
          if set(actual)!=set(expected):
              raise SystemExit('REMOTE_ASSET_SET_MISMATCH expected='+str(sorted(expected))+' actual='+str(sorted(actual)))
          for name,meta in expected.items():
              a=actual[name]
              if int(a['size'])!=int(meta['bytes']): raise SystemExit('REMOTE_ASSET_BYTES_MISMATCH '+name)
              digest=a.get('digest') or ''
              if digest!='sha256:'+meta['sha256']: raise SystemExit('REMOTE_ASSET_SHA_MISMATCH '+name+' '+digest)
          summary={
            'tag':os.environ['TAG'],'tag_target':tag['object']['sha'],'release_id':release['id'],'release_name':release['name'],
            'published_at':release['published_at'],'draft':release['draft'],'prerelease':release['prerelease'],
            'assets':{n:{'id':actual[n]['id'],'bytes':actual[n]['size'],'digest':actual[n]['digest']} for n in sorted(actual)}
          }
          open('/tmp/P04_V260_RELEASE_REMOTE_READBACK.json','w').write(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print(json.dumps(summary,ensure_ascii=False,sort_keys=True))
          print('P04_V260_GITHUB_FORMAL_RELEASE_REMOTE_READBACK_PASS')
          PY

      - name: Remove private source before public-safe evidence upload
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf vf-infra /tmp/p04-v260-release-assets
          test ! -e vf-infra

      - name: Upload public-safe Release remote readback
        uses: actions/upload-artifact@v4
        with:
          name: P04-VF-Infra-V2.6.0-Release-Remote-Readback
          path: /tmp/P04_V260_RELEASE_REMOTE_READBACK.json
          if-no-files-found: error
          retention-days: 14
