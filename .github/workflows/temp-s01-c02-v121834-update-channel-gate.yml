name: TEMP S01-C02 Ops 1.21.834 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121834-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121834-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPDATE_REPO: llhzx2018/core-updates
      BASE: eb4e04aadf1c435f3738f72600926a9f08012644
      CANDIDATE: 1f9bd13c61c69ade3ec5a5381737f8441ab2b9d8
      PRODUCT_COMMIT: 3f2fd2b83062bab477408feb2ff36ff2d832be8c
      PRODUCT_TREE: 6be3c3bbd3e26cc947bab8e88af89ea39d840957
      RELEASE_ID: '383363985'
      ASSET_ID: '546269117'
      ASSET: vf-tools-ops_V1.21.834.zip
      BYTES: '3267351'
      SHA256: a3f45a74d9bbc9e9d45d6edd9ad6c4fd394fb9f2f1c84e4484a47bc483985eaf
      FILES: '916'
      FP: 76e80015f6f639f48bf7f323e9412fb1e5571aea5c462e5f60e39a3825527cf0
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$CANDIDATE"
          mapfile -t changed < <(git -C updates diff --name-only "$BASE" "$CANDIDATE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'projects/S01-C02.json'
          M=updates/projects/S01-C02.json
          test "$(jq -r .target_version "$M")" = '1.21.834'
          test "$(jq -r '.from_versions|join(",")' "$M")" = '1.21.833'
          test "$(jq -r .release_tag "$M")" = 'v1.21.834'
          test "$(jq -r .asset_name "$M")" = "$ASSET"
          test "$(jq -r .asset_bytes "$M")" = "$BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$SHA256"
          test "$(jq -r .runtime_files "$M")" = "$FILES"
          test "$(jq -r .runtime_fingerprint "$M")" = "$FP"
          RLS="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.834)"
          test "$(jq -r .id <<<"$RLS")" = "$RELEASE_ID"
          test "$(jq -r .target_commitish <<<"$RLS")" = "$PRODUCT_COMMIT"
          test "$(jq -r '.assets[0].id' <<<"$RLS")" = "$ASSET_ID"
          test "$(jq -r '.assets[0].name' <<<"$RLS")" = "$ASSET"
          test "$(jq -r '.assets[0].size' <<<"$RLS")" = "$BYTES"
          test "$(jq -r '.assets[0].digest' <<<"$RLS")" = "sha256:$SHA256"
          for b in main develop; do
            P="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/llhzx2018/vf-tools-ops/branches/$b")"
            test "$(jq -r .commit.sha <<<"$P")" = "$PRODUCT_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$P")" = "$PRODUCT_TREE"
          done
      - name: Verify Production remains 1.21.833 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL --retry 2 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness')"
          jq -e '
            .pluginVersion == "1.21.833" and
            .activeStaticJobStatus == "FAIL" and
            .activeStaticJobMode == "candidate" and
            .activeStaticJobFirstFailedStep == "candidate_build" and
            .sourceRecoveryCandidateCurrentStage == 4 and
            .sourceRecoveryCandidateFailureClass == "candidate_build_unclassified" and
            .sourceRecoveryCandidateBuildOffset == 225 and
            .sourceRecoveryCandidateBuildTotal == 231 and
            .sourceRecoveryCandidateExactProcessProbeStatus == "pass" and
            .sourceRecoveryCandidateExactProcessProbeShadowWrittenDelta == 0 and
            .sourceRecoveryCandidateExactProcessProbeCompletenessStatus == "pass" and
            .candidatePackageReady == false and
            .manualSourceUploadRequired == false and
            .finalOnlinePass == "NO"
          ' <<<"$J" >/dev/null
      - name: Verify update authority and runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          U="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$U")" = "$BASE"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = "$RUNNER_MAIN"
      - name: Seal result
        shell: bash
        run: echo PASS_V121834_UPDATE_CHANNEL_GATE
