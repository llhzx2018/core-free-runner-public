name: S01 Ops to M3U8 to Theme Settings Readiness Gate
on:
  push:
    branches: [task/s01-three-component-settings-consistency-20261013]
    paths: [.github/workflows/s01-three-component-settings-consistency.yml]
permissions:
  contents: read
jobs:
  contract-coherence:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Check out exact M3U8 candidate transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7ab8bbbf22fedc149a024f0c1d5ea3290c4dd8de
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Check out exact Ops and Theme owner sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5e3c331b20ec72e82c91c8cd3cd0b5a9d0d5e89e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 0bbb9b0fcc05e7d912de15fe5edb8e7dccd12181
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Exact source identity, six-setting contract and executable consumer
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 7ab8bbbf22fedc149a024f0c1d5ea3290c4dd8de
          test "$(git -C ops rev-parse HEAD)" = 5e3c331b20ec72e82c91c8cd3cd0b5a9d0d5e89e
          test "$(git -C theme rev-parse HEAD)" = 0bbb9b0fcc05e7d912de15fe5edb8e7dccd12181
          php -l candidate/src/includes/settings-frontend.php
          php -l candidate/src/includes/download-task-settings.php
          php -l candidate/tests/s01-c03-ops-downloader-front-config-consistency.php
          php candidate/tests/s01-c03-ops-downloader-front-config-consistency.php
          php -l ops/includes/s01/tool-workbench.php
          php -l theme/src/inc/services/provider-widget-host-service.php
          grep -q 'vf_m3u8_save_settings_transaction' ops/includes/s01/tool-workbench.php
          grep -q 'vf_tool_m3u8_operational_profile' candidate/src/includes/settings-frontend.php
          grep -q 'vf_tools_theme_render_widget_host' theme/src/inc/services/provider-widget-host-service.php
          echo S01_THREE_COMPONENT_SETTINGS_EXACT_GATE_PASS
      - name: Cleanup temporary private sources
        if: always()
        run: rm -rf candidate ops theme
