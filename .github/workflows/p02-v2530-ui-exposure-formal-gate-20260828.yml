name: P02 V2.5.30 Human Baseline UI Formal Gate

on:
  push:
    paths:
      - '.github/workflows/p02-v2530-ui-exposure-formal-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE: d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a
      BASE: 49c2bac2497ccc454c2134d3e491d76b2ff63d79
      OLD_SOURCE: 387655e222c1fed0b6e4559b66d254dba5d3c8e4
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout exact V2.5.30 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout exact formal V2.5.29 source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.29
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: old

      - name: Exact source and live main fence
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C old rev-parse HEAD)" = "$OLD_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE"
          test "$(tr -d '\r\n' < product/VERSION)" = '2.5.30'
          test "$(tr -d '\r\n' < old/VERSION)" = '2.5.29'
          echo P02_V2530_LIVE_SOURCE_FENCE=PASS

      - name: Install utility dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip jq sqlite3

      - name: Materialize proven formal gate and adapt only release parameters
        run: |
          set -Eeuo pipefail
          mkdir -p scripts
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d550a22bf02d58a526c449124ffcd4fe963d8abb/scripts/p02-v2529-formal-gate.sh -o scripts/p02-v2529-formal-gate.sh
          curl -fsSL https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d550a22bf02d58a526c449124ffcd4fe963d8abb/scripts/p02-v2529-patch-repair-driver.py -o scripts/p02-v2529-patch-repair-driver.py
          python3 scripts/p02-v2529-patch-repair-driver.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p02-v2529-formal-gate.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace('387655e222c1fed0b6e4559b66d254dba5d3c8e4','d0f3d4f0f65400c5ca4868df844bbc4684b7cd8a')
          s=s.replace('7861999d99a8de385bdd73f7892477e197c4559c','387655e222c1fed0b6e4559b66d254dba5d3c8e4')
          s=s.replace('2.5.29','__P02_TARGET__')
          s=s.replace('2.5.28','2.5.29')
          s=s.replace('__P02_TARGET__','2.5.30')
          s=s.replace('V2529','V2530').replace('v2529','v2530')
          s=s.replace('release/p02-v2.5.30-common-baseline-v2-20260828','ui/p02-common-baseline-human-readable-v2530-20260828')
          old='''mapfile -t relfiles < <(git -C "$PRODUCT" diff --name-only "$BASE..$CANDIDATE" | sort)\ntest "${#relfiles[@]}" -eq 3\ntest "${relfiles[0]}" = SOURCE_MANIFEST.json\ntest "${relfiles[1]}" = SOURCE_MANIFEST.txt\ntest "${relfiles[2]}" = VERSION\npython3 "$PRODUCT/scripts/verify-source-manifest.py"'''
          new='''mapfile -t relfiles < <(git -C "$PRODUCT" diff --name-only "$BASE..$CANDIDATE" | sort)\ntest "${#relfiles[@]}" -eq 8\nexpected=(SOURCE_MANIFEST.json SOURCE_MANIFEST.txt VERSION public/assets/app.js public/diagnose.php public/system-baseline.php public/system-info.php tests/unit/common_baseline_ui_exposure_contract.mjs)\nfor i in "${!expected[@]}"; do test "${relfiles[$i]}" = "${expected[$i]}"; done\npython3 "$PRODUCT/scripts/verify-source-manifest.py"\nnode "$PRODUCT/tests/unit/common_baseline_ui_exposure_contract.mjs"'''
          if old not in s:
              raise SystemExit('exact source scope block changed')
          s=s.replace(old,new,1)
          s=s.replace('Common Product Baseline V2 production release. It standardizes System Info / System Baseline / Runtime Health / Online Update / Backup-Restore semantics and PERSONAL_SINGLE_ADMIN session/security behavior.', 'Human-readable Common Baseline UI release. Existing runtime truth is now visibly reachable as System Info / System Baseline / Online Update / Backup-Restore / Runtime Health. The System Baseline leads with Chinese admin guidance and keeps raw machine evidence folded under technical details.')
          p.write_text(s,encoding='utf-8')
          PY
          bash -n scripts/p02-v2529-formal-gate.sh
          echo P02_V2530_FORMAL_GATE_ADAPTATION=PASS

      - name: Run exact V2.5.30 formal gate
        run: bash scripts/p02-v2529-formal-gate.sh

      - name: Upload verified V2.5.30 release set
        uses: actions/upload-artifact@v4
        with:
          name: P02-V2.5.30-HUMAN-BASELINE-FORMAL-RELEASE-SET
          path: |
            product/build/v2530-a/*
            evidence/P02-V2.5.30-FORMAL-GATE.env
          if-no-files-found: error
          retention-days: 30
