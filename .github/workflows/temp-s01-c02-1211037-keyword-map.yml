name: S01-C02 1.21.1037 keyword map candidate
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture-root
          MARIADB_DATABASE: vf_keyword_1037
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf-fixture-db
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 7036355dc576084d4117d70294ffee5a9b378c2d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 364d2794dc42c5eae3587dea4df011131d4c2dc4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: baseline
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring

      - name: Exact source contracts
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          test "$(git -C target rev-parse HEAD)" = "7036355dc576084d4117d70294ffee5a9b378c2d"
          test "$(git -C target rev-parse HEAD^{tree})" = "ef8193035ac0d9671375b011243e87e1759fd007"
          test "$(cat target/VERSION)" = "1.21.1037"
          test "$(cat baseline/VERSION)" = "1.21.1036"
          grep -F "Version: 1.21.1037" target/vf-ops.php >/dev/null
          php target/tests/s01-c02-1211037-keyword-map-functional-contract.php
          php target/tests/s01-c02-1211037-keyword-map-ux-contract.php
          php target/tests/s01-c02-121994-keyword-map-mature-ui-contract.php
          php target/tests/s01-c02-121995-keyword-research-mature-ui-contract.php
          php target/tests/s01-c02-1211004-keyword-reading-scale-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
          echo SOURCE_CONTRACTS=PASS
          echo PHP_83_SYNTAX=PASS

      - name: Browser responsive proof
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/keyword-node
          cd /tmp/keyword-node
          npm init -y >/dev/null
          npm install --no-save playwright@1.58.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          export NODE_PATH=/tmp/keyword-node/node_modules
          cd "$GITHUB_WORKSPACE"
          node target/tests/s01-c02-1211037-keyword-map-browser-proof.js > evidence/keyword-browser.json
          cat evidence/keyword-browser.json
          jq -e '.pass==true and (.failures|length)==0' evidence/keyword-browser.json

      - name: Build exact baseline and candidate packages
        run: |
          set -Eeuo pipefail
          python3 baseline/.github/release/build-ops-package.py --source baseline --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1036.zip" > baseline-package.json
          python3 target/.github/release/build-ops-package.py --source target --output "$RUNNER_TEMP/vf-tools-ops_V1.21.1037.zip" > package.json
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1036.zip" baseline.zip
          cp "$RUNNER_TEMP/vf-tools-ops_V1.21.1037.zip" candidate.zip
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          for name in ['baseline.zip','candidate.zip']:
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None,name
                  assert all(n.startswith('vf-ops/') and '..' not in n.split('/') for n in z.namelist()),name
          p=json.loads(Path('package.json').read_text())
          Path('evidence/package.json').write_text(json.dumps({
              'asset_name':p.get('asset_name',''),
              'asset_bytes':p.get('asset_bytes',0),
              'asset_sha256':p.get('asset_sha256',''),
              'runtime_fingerprint':p.get('runtime_fingerprint','')
          },indent=2)+'\n')
          print('PACKAGE_CRC_PATH=PASS')
          PY

      - name: WordPress MariaDB functional integration and rollback
        run: |
          set -Eeuo pipefail
          TASK_ROOT="$RUNNER_TEMP/s01-keyword-1037"
          WP="$TASK_ROOT/wordpress"
          mkdir -p "$WP"
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$TASK_ROOT/wp"
          chmod +x "$TASK_ROOT/wp"
          wp(){ php "$TASK_ROOT/wp" --path="$WP" "$@"; }
          wp core download --version=7.0.2 --force >/dev/null
          wp config create --dbname=vf_keyword_1037 --dbuser=vf --dbpass=vf-fixture-db --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --url=http://127.0.0.1:18097 --title='Keyword Candidate 1037' --admin_user=admin --admin_password='Fixture-Keyword-1037!' --admin_email=fixture@example.invalid --skip-email >/dev/null

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --activate >/dev/null
          wp option update vf_ops_keyword_candidate_fixture preserve >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1036")throw new RuntimeException("BASE_VERSION");echo "BASELINE_RUNTIME=PASS\n";'

          wp plugin install "$GITHUB_WORKSPACE/candidate.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1037")throw new RuntimeException("TARGET_VERSION");if(get_option("vf_ops_keyword_candidate_fixture")!=="preserve")throw new RuntimeException("STATE_CHANGED");echo "CANDIDATE_INSTALL_READBACK=PASS\n";'
          export TEST_FILE="$GITHUB_WORKSPACE/target/tests/s01-c02-1211037-keyword-map-wp-integration.php"
          wp eval 'require getenv("TEST_FILE");' > evidence/keyword-wp-integration.json
          cat evidence/keyword-wp-integration.json
          jq -e '.status=="PASS" and .pagination=="PASS" and .filters=="PASS" and .mapped_warning_tab=="PASS" and .export_all_filtered=="PASS" and .unique_primary=="PASS" and .revision_conflict=="PASS" and .idempotent_save=="PASS" and .blocked_row_count=="PASS" and .unassign_readback=="PASS" and .ordinary_open_write_free=="PASS"' evidence/keyword-wp-integration.json

          wp plugin install "$GITHUB_WORKSPACE/baseline.zip" --force >/dev/null
          wp eval 'if(VF_OPS_VERSION!=="1.21.1036")throw new RuntimeException("ROLLBACK_VERSION");if(get_option("vf_ops_keyword_candidate_fixture")!=="preserve")throw new RuntimeException("ROLLBACK_STATE");echo "ROLLBACK=PASS\n";'

      - name: Write public-safe evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          package={}
          if Path('evidence/package.json').exists():
              package=json.loads(Path('evidence/package.json').read_text())
          def read_pass(path):
              p=Path(path)
              if not p.exists() or p.stat().st_size<2:
                  return False
              try:
                  return json.loads(p.read_text()).get('status')=='PASS'
              except Exception:
                  return False
          def browser_pass(path):
              p=Path(path)
              if not p.exists() or p.stat().st_size<2:
                  return False
              try:
                  data=json.loads(p.read_text())
                  return data.get('pass') is True and not data.get('failures')
              except Exception:
                  return False
          proof={
              'schema':'vf-s01-keyword-map-proof/v2',
              'source_repository':'llhzx2018/vf-tools-ops',
              'source_sha':'7036355dc576084d4117d70294ffee5a9b378c2d',
              'source_tree':'ef8193035ac0d9671375b011243e87e1759fd007',
              'version':'1.21.1037',
              'base_version':'1.21.1036',
              'package_sha256':package.get('asset_sha256',''),
              'runtime_fingerprint':package.get('runtime_fingerprint',''),
              'browser':'PASS' if browser_pass('evidence/keyword-browser.json') else 'NOT_PROVEN',
              'wp_mariadb_integration':'PASS' if read_pass('evidence/keyword-wp-integration.json') else 'NOT_PROVEN',
              'production':'NOT_TOUCHED',
              'owner_product_pass':False
          }
          proof['status']='PASS' if proof['browser']=='PASS' and proof['wp_mariadb_integration']=='PASS' else 'FAIL'
          Path('evidence/FINAL_EVIDENCE.json').write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(proof,ensure_ascii=False))
          PY

      - name: Upload public-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c02-1211037-keyword-map-candidate-evidence
          path: |
            evidence/keyword-browser.json
            evidence/keyword-wp-integration.json
            evidence/package.json
            evidence/FINAL_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 30
