name: S01-C02 1.21.1037 keyword map candidate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: b20f1355cb5b6a61c2c200702506beea5bc0105a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: target
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, sodium, mbstring
      - name: Exact source contracts
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "b20f1355cb5b6a61c2c200702506beea5bc0105a"
          test "$(git -C target rev-parse HEAD^{tree})" = "52fc80a8c63fd854d9a2447fab4ef24d1a831c5c"
          test "$(cat target/VERSION)" = "1.21.1037"
          php target/tests/s01-c02-1211037-keyword-map-functional-contract.php
          php target/tests/s01-c02-1211036-keyword-map-ux-contract.php
          php target/tests/s01-c02-121994-keyword-map-mature-ui-contract.php
          php target/tests/s01-c02-121995-keyword-research-mature-ui-contract.php
          php target/tests/s01-c02-1211004-keyword-reading-scale-contract.php
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php
          find target -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.txt
