name: TEMP P01 V22119 UI Smoke Run
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-p01-v22119-ui-smoke-run.yml']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      ADMIN_PASS: Reference-P01-22119!Strong
    steps:
      - uses: actions/checkout@v4
      - name: Run browser smoke
        shell: bash
        run: |
          set +e
          bash scripts/temp-p01-v22119-ui-smoke.sh >/tmp/p01-smoke.log 2>&1
          echo $? >/tmp/p01-smoke.rc
          set -e
          cat /tmp/p01-smoke.log
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rc=$(cat /tmp/p01-smoke.rc 2>/dev/null||echo 999);sha=$(cat /tmp/p01-source-sha 2>/dev/null||echo unknown)
          python3 - "$rc" "$sha" <<'PY'
          import json,os,sys
          rc=int(sys.argv[1]);sha=sys.argv[2]
          try: tail='\n'.join(open('/tmp/p01-smoke.log',encoding='utf-8',errors='replace').read().splitlines()[-50:])
          except: tail=''
          q={'schema':'vf-public-runner-result/v1','project_id':'P01','target_version':'2.21.19','gate':'REFERENCE_UI_BROWSER_REGRESSION','status':'SUCCESS' if rc==0 else 'FAILURE','pass':rc==0,'source_sha':sha,'workflow_run_id':os.environ['GITHUB_RUN_ID'],'rc':rc,'log_tail':tail,'private_data_persisted_publicly':False}
          if rc==0:
            try:q['browser']=json.load(open('/tmp/p01-ui-result.json'))
            except Exception as e:q['browser_read_error']=repr(e)
          open('/tmp/p01-evidence.json','w').write(json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git clone -q --depth 1 --branch vf-agent-operations-v1 https://x-access-token:${GH_TOKEN}@github.com/llhzx2018/core-free-runner-public.git out
          mkdir -p out/vf-agent/results out/evidence/p01/v22119
          cp /tmp/p01-evidence.json out/vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json
          if [ "$rc" = 0 ];then cp "$RUNNER_TEMP"/p01-*.png out/evidence/p01/v22119/;fi
          git -C out config user.name VictorForge;git -C out config user.email llhzx2018@gmail.com
          git -C out add vf-agent/results/P01-V2.21.19-REFERENCE-UI-BROWSER.json evidence/p01/v22119
          git -C out commit -q -m 'evidence(P01): publish V2.21.19 UI browser gate'
          for i in 1 2 3;do git -C out pull -q --rebase origin vf-agent-operations-v1&&git -C out push -q origin HEAD:vf-agent-operations-v1&&break||sleep 2;done
          test "$rc" = 0
      - name: Cleanup
        if: always()
        run: |
          [ -f /tmp/p01-ui.pid ]&&kill "$(cat /tmp/p01-ui.pid)" 2>/dev/null||true
          rm -rf /tmp/p01-ui product "$RUNNER_TEMP/p01-node" || true
# harness revision 4
