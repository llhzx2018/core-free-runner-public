name: P07 D04 static per-vhost ingress and recovery QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-static-ingress-qa-20261116.yml'
permissions:
  contents: read
jobs:
  static-ingress:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Public QA harness checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Transient pinned P07 product checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: c7e70337c4632bd1e147c8665998e113df00588d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-ingress
      - name: Prepare transient local Nginx/TLS runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx openssl curl >/dev/null
      - name: D04 static HTTP ingress, recovery and unsafe scope tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-ingress rev-parse HEAD)" = c7e70337c4632bd1e147c8665998e113df00588d
          cd .p07-private-ingress
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_static_ingress_fence.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_static_ingress_cli.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_ingress_nginx_native.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_d04_single_site_cutover_guard.py -v
          python3 -B scripts/check_p07_modules.py --module P07-M03-D04 \
            --pr-title 'P07-M03-D04 服务器迁移：静态站单站流量隔离与恢复' \
            --changed-file lib/migration_site_ingress_fence.py \
            --changed-file tests/test_p07_m03_d04_static_ingress_fence.py \
            --changed-file tests/test_p07_m03_d04_static_ingress_cli.py \
            --changed-file tests/test_p07_m03_d04_ingress_nginx_native.py \
            --affected P07-M03-D04 --shared-reason '仅 D04 隔离 HTTP 访问辅助模块'
          python3 -B scripts/check_p07_terminal_ux.py
          echo P07_D04_STATIC_SITE_INGRESS_QA=PASS
      - name: Always clean private checkout
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- .p07-private-ingress
          test ! -e .p07-private-ingress
          echo P07_D04_PRIVATE_SOURCE_CLEAN=PASS
