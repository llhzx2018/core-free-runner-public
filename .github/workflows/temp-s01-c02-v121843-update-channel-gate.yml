name: TEMP S01-C02 Ops 1.21.843 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121843-canonical-retry-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121843-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 3ecdd477e253fb5cafe54341e912c5534c775671
      UPDATE_CANDIDATE: b62e30a09c94c7b556910bd2d82944e727ed4ef1
      UPDATE_TREE: 37629e6d5b47fa5ae367394bf3b14281ac17f4ac
      PRODUCT_COMMIT: 904a68e3a60aa58c5d7af8d725f3393f22e9be07
      PRODUCT_TREE: 00abb181effaf9479244792a9e05e031af63e527
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.843.zip
      BYTES: '3298663'
      SHA256: 8d91b11fe50e4be6f0793cb262637dfdb92fd3e9c7f6156611423e13a2da81e1
      FP: c7dfd6146dd8b48c73d5b16a4e958c57ae5a64d1980465335cac3a4155e029c2
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          test "$(git -C updates rev-parse HEAD^{tree})" = "$UPDATE_TREE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.843" and .from_versions==["1.21.842"] and .release_tag=="v1.21.843" and .asset_name=="vf-tools-ops_V1.21.843.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==925 and .runtime_file_count==925 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-06T02:41:06Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.843' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.id==383439629 and .tag_name=="v1.21.843" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.id==546628801 and .name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$PRODUCT_COMMIT --jq .tree.sha)" = "$PRODUCT_TREE"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.842" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.842" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobInternalLinkFailureLeafCount==0 and .activeStaticJobInternalLinkUniqueTargetCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalizeReadbackRetryStatus=="not_run" and .sourceRecoveryFinalizeReadbackRetryCode=="finalize_readback_retry_not_final_audit"' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121843_UPDATE_CHANNEL_GATE
