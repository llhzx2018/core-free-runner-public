name: P02 V2.5.33 Reading Comfort Formal Release

on:
  push:
    branches:
      - task/p02-v2533-formal-release-20260918
    paths:
      - '.github/workflows/p02-v2533-formal-release-20260918.yml'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_REF: f34edd1cf511770e8d25030b5064cdb642a47672
      SOURCE31_REF: 884aaf66b0bf0a8cfc0de6a5564c139149e1bc3e
      SOURCE32_REF: 978548735263e10ab5e084fa0d8e67a600a5cad3
      TARGET_VERSION: 2.5.33
      SOURCE31_VERSION: 2.5.31
      SOURCE32_VERSION: 2.5.32
      SCHEMA: '2401'
      BUILD_TIMESTAMP: '2026-09-18T10:36:11Z'
    steps:
      - name: Require registered release capability
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout exact private source identities
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: product

      - name: Checkout exact V2.5.31 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.SOURCE31_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source31

      - name: Checkout exact V2.5.32 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.SOURCE32_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source32

      - name: Exact source fence and repository gates
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_REF"
          test "$(git -C source31 rev-parse HEAD)" = "$SOURCE31_REF"
          test "$(git -C source32 rev-parse HEAD)" = "$SOURCE32_REF"
          test "$(tr -d '\r\n' < product/VERSION)" = "$TARGET_VERSION"
          test "$(tr -d '\r\n' < source31/VERSION)" = "$SOURCE31_VERSION"
          test "$(tr -d '\r\n' < source32/VERSION)" = "$SOURCE32_VERSION"
          test "$(jq -r .version product/SOURCE_MANIFEST.json)" = "$TARGET_VERSION"
          test "$(jq -r .schema product/SOURCE_MANIFEST.json)" = "$SCHEMA"
          test "$(jq -r .runtime_source_file_count product/SOURCE_MANIFEST.json)" = 67
          cd product
          bash scripts/verify-repository.sh
          while IFS= read -r cmd; do
            test -n "$cmd"
            eval "$cmd"
          done < <(awk '/run: node tests\/unit\//{sub(/^.*run: /,""); print}' .github/workflows/repository-health.yml)
          git diff --check
          echo P02_V2533_EXACT_SOURCE_GATE=PASS

      - name: Real Chromium UX gate
        run: |
          set -Eeuo pipefail
          cd product
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          bash scripts/ux-browser-reverify.sh
          echo P02_V2533_REAL_CHROMIUM_GATE=PASS

      - name: Build deterministic formal release sets
        run: |
          set -Eeuo pipefail
          cd product
          cat > "$RUNNER_TEMP/p02-v2533-formalize.py" <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil,stat,subprocess,sys,zipfile,datetime as dt

          ROOT=Path.cwd()
          TARGET='2.5.33'
          SOURCES=['2.5.31','2.5.32']
          SCHEMA=2401
          TS='2026-09-18T10:36:11Z'
          PRODUCT_REF=os.environ['PRODUCT_REF']
          RUN_ID=os.environ.get('GITHUB_RUN_ID','UNKNOWN')
          stamp=tuple(dt.datetime.fromisoformat(TS.replace('Z','+00:00')).astimezone(dt.timezone.utc).timetuple()[:6])

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def meta(p):
              p=Path(p); return {'path':p.name,'bytes':p.stat().st_size,'sha256':sha(p)}
          def zw(z,name,data,mode=0o644):
              i=zipfile.ZipInfo(name,stamp); i.compress_type=zipfile.ZIP_DEFLATED
              i.external_attr=(stat.S_IFREG|mode)<<16
              z.writestr(i,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          def rezip(root,dst):
              with zipfile.ZipFile(dst,'w') as z:
                  for p in sorted(Path(root).rglob('*')):
                      if p.is_file():
                          zw(z,p.relative_to(root).as_posix(),p.read_bytes(),0o755 if os.access(p,os.X_OK) else 0o644)
          def patch_builder(tmp):
              src=(ROOT/'scripts/build-release-v2.5.4.py').read_text()
              old="ROOT=Path(__file__).resolve().parents[1]; SRCVER='2.5.2'; VER='2.5.4'; SCHEMA=2401; DT=(2026,8,19,2,0,0)"
              new="ROOT=Path.cwd(); SRCVER='2.5.32'; VER='2.5.33'; SCHEMA=2401; DT=(2026,9,18,10,36,11)"
              if old not in src: raise SystemExit('builder identity block changed')
              src=src.replace(old,new,1)
              start="notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''"
              end="''')\n arts=[sz,fz,uz,az,rf,notes]"
              i=src.index(start); j=src.index(end,i)
              notes="""notes=out/f'VF_Library_V{VER}_RELEASE_NOTES.md'; notes.write_text(f'''# VF Library V{VER}

V2.5.33 is the reading-comfort and interface-density release for P02.

- Reader default typography converges to 16px / 1.65 with a 72ch standard measure.
- Narrow / standard / wide reading widths and A-/A+ remain user-adjustable.
- New editor sessions use 15px / 1.64 while existing local editor-size preferences remain preserved.
- Reader, Preview and Scratch share a calmer long-form reading scale.
- Light mode uses warmer paper-like neutral surfaces while preserving the VF Library teal identity.
- Desktop navigation and document-list density are tightened without changing IA or canonical content.
- Schema remains {SCHEMA}; no migration.
- The online UPDATE supports verified direct upgrades from V2.5.31 and V2.5.32.
- OWNER explicitly authorized publish-first; real-use acceptance remains a separate post-publication truth.
''')
 arts=[sz,fz,uz,az,rf,notes]"""
              src=src[:i]+notes+src[j+len(end):]
              Path(tmp).write_text(src)
          def finalize(out):
              out=Path(out)
              deploy=out/'.deploy'
              subprocess.check_call(['bash','scripts/build-deploy-tree.sh',str(deploy)])
              update=out/f'VF_Library_V{TARGET}_UPDATE.zip'
              subprocess.check_call([
                  'python3','scripts/build-multisource-update.py',
                  '--deploy-root',str(deploy),'--output',str(update),
                  '--target-version',TARGET,
                  '--source-version',SOURCES[0],'--source-version',SOURCES[1],
                  '--source-schema',str(SCHEMA),'--target-schema',str(SCHEMA),
                  '--timestamp',TS
              ])
              full=out/f'VF_Library_V{TARGET}_FULL.zip'
              full_dir=out/'.full'
              with zipfile.ZipFile(full) as z: z.extractall(full_dir)
              rm=full_dir/'release-manifest.json'
              data=json.loads(rm.read_text())
              data['upgrade']['supported_from']=SOURCES
              data['upgrade']['update']=meta(update)
              rm.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
              rezip(full_dir,full)
              rel=out/f'VF_Library_V{TARGET}_RELEASE_MANIFEST.json'
              r=json.loads(rel.read_text())
              r['compatibility']['supported_from']=SOURCES
              r['gates']={
                  'exact_source':f'PASS_RUN_{RUN_ID}',
                  'repository_and_unit':f'PASS_RUN_{RUN_ID}',
                  'real_chromium':f'PASS_RUN_{RUN_ID}',
                  'deterministic_build':f'PASS_RUN_{RUN_ID}',
                  'fresh_install':f'PASS_RUN_{RUN_ID}',
                  'atomic_upgrade_2.5.31':f'PASS_RUN_{RUN_ID}',
                  'atomic_upgrade_2.5.32':f'PASS_RUN_{RUN_ID}',
                  'secret':'PASS','private_data':'PASS','db_binary':'PASS','archive':'PASS'
              }
              r['git']={'main_readback':'PRE_RELEASE_CURRENT_MAIN_UNCHANGED','formal_tag':f'v{TARGET}','tag_readback':'PENDING_REMOTE_RELEASE'}
              r['deployment']={'status':'NOT_EXECUTED','production_readback':'NOT_EXECUTED','final_online_pass':False}
              typ={}
              for a in r['artifacts']: typ[a['path']]=a.get('type','')
              artifacts=[]
              for p in [
                  out/f'VF_Library_V{TARGET}_SOURCE.zip',
                  full,
                  update,
                  out/f'VF_Library_V{TARGET}_ATOMIC.zip',
                  out/f'repair-v{TARGET}.php',
                  out/f'VF_Library_V{TARGET}_RELEASE_NOTES.md'
              ]:
                  x=meta(p); x['type']=typ.get(p.name, 'UPDATE' if p==update else '')
                  artifacts.append(x)
              r['artifacts']=artifacts
              rel.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
              shutil.rmtree(deploy,ignore_errors=True); shutil.rmtree(full_dir,ignore_errors=True)
              arts=[p for p in out.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt']
              (out/'SHA256SUMS.txt').write_text(''.join(f'{sha(p)}  {p.name}\n' for p in sorted(arts,key=lambda x:x.name)))
          def build(out):
              tmp=Path(os.environ['RUNNER_TEMP'])/'build-v2533.py'
              patch_builder(tmp)
              tree=subprocess.check_output(['git','show','-s','--format=%T',PRODUCT_REF],text=True).strip()
              subprocess.check_call(['python3',str(tmp),'--out',str(out),'--source-commit',PRODUCT_REF,'--source-tree',tree,'--source-ref','release/v2.5.33'])
              finalize(out)

          for name in ['build/formal-a','build/formal-b']:
              build(name)
          def hashes(root):
              return {p.name:sha(p) for p in Path(root).iterdir() if p.is_file()}
          a=hashes('build/formal-a'); b=hashes('build/formal-b')
          if a!=b: raise SystemExit(f'non-deterministic build: {a} != {b}')
          print('P02_V2533_DETERMINISTIC_FORMAL_BUILD=PASS')
          for n,h in sorted(a.items()): print(f'FORMAL_SHA256 {h} {n}')
          PY
          python3 "$RUNNER_TEMP/p02-v2533-formalize.py"
          for z in build/formal-a/VF_Library_V2.5.33_UPDATE.zip build/formal-a/VF_Library_V2.5.33_FULL.zip build/formal-a/VF_Library_V2.5.33_ATOMIC.zip; do
            unzip -t "$z" >/dev/null
          done
          unzip -p build/formal-a/VF_Library_V2.5.33_UPDATE.zip atomic-manifest.json | jq -e '.format_version==2 and .source_versions==["2.5.31","2.5.32"] and .target_version=="2.5.33" and .source_schema==2401 and .target_schema==2401' >/dev/null
          echo P02_V2533_FORMAL_ARCHIVE_IDENTITY=PASS

      - name: Fresh install from exact FULL asset
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/fresh2533"; SITE="$ROOT/site"; mkdir -p "$SITE"
          unzip -q product/build/formal-a/VF_Library_V2.5.33_FULL.zip -d "$SITE"
          test "$(cat "$SITE/VERSION.txt")" = "$TARGET_VERSION"
          PW="P02-V2533-FRESH-${GITHUB_RUN_ID}!"; PORT=18433
          php -S 127.0.0.1:$PORT -t "$SITE" >/dev/null 2>&1 & PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
          TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303
          php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.33" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
          kill "$PID"; wait "$PID" 2>/dev/null || true; trap - EXIT
          echo P02_V2533_FULL_FRESH_INSTALL=PASS

      - name: Verified direct Atomic upgrades from V2.5.31 and V2.5.32
        run: |
          set -Eeuo pipefail
          PKG="$GITHUB_WORKSPACE/product/build/formal-a/VF_Library_V2.5.33_UPDATE.zip"
          BYTES=$(stat -c%s "$PKG"); SHA=$(sha256sum "$PKG" | awk '{print $1}')
          cat > "$RUNNER_TEMP/upgrade.php" <<'PHP'
          <?php
          $site=$argv[1];$pkg=$argv[2];$source=$argv[3];$bytes=(int)$argv[4];$sha=$argv[5];$out=$argv[6];
          require $site.'/app/bootstrap.php';require_once $site.'/app/CoreUpdates/UpdateAdapter.php';require_once $site.'/app/CoreUpdates/UpdateCore.php';require_once $site.'/app/VfLibraryCoreUpdateAdapter.php';
          $m=['schema_version'=>'1.0','project_id'=>'P02','component_id'=>'APP','enabled'=>true,'current_version'=>$source,'target_version'=>'2.5.33','update_type'=>'ATOMIC','from_versions'=>['2.5.31','2.5.32'],'schema_from'=>'2401','schema_to'=>'2401','repository'=>'llhzx2018/vf-library','release_tag'=>'v2.5.33','asset_name'=>'VF_Library_V2.5.33_UPDATE.zip','asset_bytes'=>$bytes,'asset_sha256'=>$sha,'backup_required'=>true,'rollback_supported'=>true,'released_at'=>'2026-09-18T00:00:00Z'];
          $c=new CoreUpdates\UpdateCore('P02','APP');if(($c->check($source,'2401',$m)['status']??'')!=='AVAILABLE')exit(2);if(($c->verifyPackage($pkg,$m)['status']??'')!=='VERIFIED')exit(3);$r=$c->upgrade($source,'2401',new VfLibraryCoreUpdateAdapter(),$pkg,$m);file_put_contents($out,json_encode($r));if(!in_array($r['status']??'',['COMMITTED','COMMITTED_WITH_CLEANUP_WARNING'],true)||empty($r['backup_locator']))exit(4);
          PHP
          upgrade_case(){
            SRC_DIR="$1"; SRCVER="$2"; PORT="$3"; ROOT="$RUNNER_TEMP/up-${SRCVER//./-}"; SITE="$ROOT/site"
            rm -rf "$ROOT"; mkdir -p "$SITE"; bash "$SRC_DIR/scripts/build-deploy-tree.sh" "$SITE" >/dev/null
            test "$(cat "$SITE/VERSION.txt")" = "$SRCVER"
            PW="P02-UP-${SRCVER}-${GITHUB_RUN_ID}!"; php -S 127.0.0.1:$PORT -t "$SITE" >/dev/null 2>&1 & PID=$!
            for _ in $(seq 1 80); do curl -fsS "http://127.0.0.1:$PORT/setup.php" >/dev/null 2>&1 && break; sleep .25; done
            curl -fsS -c "$ROOT/c" "http://127.0.0.1:$PORT/setup.php" > "$ROOT/setup"
            TOKEN=$(python3 - "$ROOT/setup" <<'PY'
          import re,html,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
            )
            test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/c" -c "$ROOT/c" -H "Origin: http://127.0.0.1:$PORT" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$PW" --data-urlencode "password_confirm=$PW" "http://127.0.0.1:$PORT/setup.php")" = 303
            SESSION=$(curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=session"); CSRF=$(jq -r .csrf<<<"$SESSION")
            CAT=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"name":"Upgrade Preserve","icon":"folder"}' "http://127.0.0.1:$PORT/api.php?action=category_save"); CID=$(jq -r .id<<<"$CAT")
            ITEM=$(jq -nc --argjson cid "$CID" --arg src "$SRCVER" '{category_id:$cid,title:("P02 Preserve "+$src),content:("keep-"+$src),content_mode:"article",content_format:"markdown",primary_action:"read",status:"active"}')
            SAVED=$(curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "$ITEM" "http://127.0.0.1:$PORT/api.php?action=content_save"); IID=$(jq -r .id<<<"$SAVED")
            curl -fsS -b "$ROOT/c" -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d "{\"id\":$IID,\"favorite\":true}" "http://127.0.0.1:$PORT/api.php?action=content_favorite" | jq -e .ok >/dev/null
            php "$RUNNER_TEMP/upgrade.php" "$SITE" "$PKG" "$SRCVER" "$BYTES" "$SHA" "$ROOT/result"
            test "$(cat "$SITE/VERSION.txt")" = "$TARGET_VERSION"; jq -e '.backup_locator|length>0' "$ROOT/result" >/dev/null
            curl -fsS -b "$ROOT/c" "http://127.0.0.1:$PORT/api.php?action=content_get&id=$IID" | jq -e --arg src "$SRCVER" '(.item.is_favorite|tonumber)==1 and .item.content==("keep-"+$src)' >/dev/null
            php "$SITE/cli/verify.php" | jq -e '.ok==true and .version=="2.5.33" and .schema_version==2401 and .integrity=="ok" and .foreign_key_errors==0' >/dev/null
            kill "$PID"; wait "$PID" 2>/dev/null || true
            echo "P02_V2533_ATOMIC_FROM_${SRCVER}=PASS"
          }
          upgrade_case "$GITHUB_WORKSPACE/source31" "$SOURCE31_VERSION" 18431
          upgrade_case "$GITHUB_WORKSPACE/source32" "$SOURCE32_VERSION" 18432
          echo P02_V2533_MULTI_SOURCE_UPGRADE_GATE=PASS

      - name: Publish private formal release and remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cd product
          if gh release view v2.5.33 --repo llhzx2018/vf-library >/dev/null 2>&1; then
            echo "v2.5.33 already exists; refusing to mutate an existing formal release" >&2
            exit 1
          fi
          gh release create v2.5.33 build/formal-a/* --repo llhzx2018/vf-library --target "$PRODUCT_REF" --title 'VF Library V2.5.33' --notes-file build/formal-a/VF_Library_V2.5.33_RELEASE_NOTES.md
          gh release view v2.5.33 --repo llhzx2018/vf-library --json databaseId,tagName,isDraft,isPrerelease,publishedAt > "$RUNNER_TEMP/release2533.json"
          jq -e '.tagName=="v2.5.33" and .isDraft==false and .isPrerelease==false' "$RUNNER_TEMP/release2533.json" >/dev/null
          mkdir -p "$RUNNER_TEMP/readback2533"
          gh release download v2.5.33 --repo llhzx2018/vf-library --pattern 'VF_Library_V2.5.33_UPDATE.zip' --dir "$RUNNER_TEMP/readback2533"
          RBYTES=$(stat -c%s "$RUNNER_TEMP/readback2533/VF_Library_V2.5.33_UPDATE.zip")
          RSHA=$(sha256sum "$RUNNER_TEMP/readback2533/VF_Library_V2.5.33_UPDATE.zip" | awk '{print $1}')
          test "$RBYTES" = "$(stat -c%s build/formal-a/VF_Library_V2.5.33_UPDATE.zip)"
          test "$RSHA" = "$(sha256sum build/formal-a/VF_Library_V2.5.33_UPDATE.zip | awk '{print $1}')"
          TAGSHA=$(gh api repos/llhzx2018/vf-library/git/ref/tags/v2.5.33 --jq .object.sha)
          test "$TAGSHA" = "$PRODUCT_REF"
          echo "P02_RELEASE_ID=$(jq -r .databaseId "$RUNNER_TEMP/release2533.json")"
          echo "P02_PUBLISHED_AT=$(jq -r .publishedAt "$RUNNER_TEMP/release2533.json")"
          echo "P02_UPDATE_BYTES=$RBYTES"
          echo "P02_UPDATE_SHA256=$RSHA"
          echo "P02_TAG_SHA=$TAGSHA"
          echo P02_V2533_FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo P02_PRODUCTION_WRITE=NO
