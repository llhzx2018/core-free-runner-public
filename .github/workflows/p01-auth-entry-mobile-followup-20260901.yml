name: P01 Auth Entry Mobile Follow-up
on:
  push:
    branches: [temp/p01-auth-entry-fix-20260901]
    paths:
      - .github/workflows/p01-auth-entry-mobile-followup-20260901.yml
      - scripts/p01-auth-entry-mobile-followup.py
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_HEAD: 4e5b9df5ef8d35c726df74a073a4f68ce8954172
      PRODUCT_BRANCH: fix/p01-auth-entry-visibility-20260901
    steps:
      - name: Checkout runner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout Product branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Apply mobile auth follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C p01 rev-parse HEAD)" = "$PRODUCT_HEAD"
          P01_ROOT="$GITHUB_WORKSPACE/p01" python3 runner/scripts/p01-auth-entry-mobile-followup.py
          php -l p01/src/app/FunctionalWorkspaceShell.php >/dev/null
          node --check p01/src/assets/auth-controls.js
          git -C p01 diff --check
          mapfile -t changed < <(git -C p01 diff --name-only | sort)
          expected=$(printf '%s\n' src/app/FunctionalWorkspaceShell.php src/assets/auth-controls.js src/assets/workspace-rebaseline.css | sort)
          actual=$(printf '%s\n' "${changed[@]}")
          test "$actual" = "$expected"
          grep -F 'vf-global-auth-action' p01/src/app/FunctionalWorkspaceShell.php >/dev/null
          grep -F 'loginTriggers.forEach' p01/src/assets/auth-controls.js >/dev/null
          grep -F 'logoutTriggers.forEach' p01/src/assets/auth-controls.js >/dev/null
      - name: Commit Product follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$PRODUCT_HEAD"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalWorkspaceShell.php src/assets/auth-controls.js src/assets/workspace-rebaseline.css
          git commit -m 'fix(P01): expose auth entry on mobile workspace'
          git push origin HEAD:"$PRODUCT_BRANCH"
          echo "P01_AUTH_ENTRY_MOBILE_SOURCE=$(git rev-parse HEAD)"
          echo 'P01_AUTH_ENTRY_MOBILE_PREP=PASS'
