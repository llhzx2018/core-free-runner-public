name: P01 V2.37.0 Formal Bind Gate
on:
  push:
    branches:
      - release/p01-v2365-candidate-20260902
    paths:
      - .github/workflows/p01-v2370-formal-bind-20260902.yml
permissions:
  actions: read
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CANDIDATE: 0020ddc866f888a5d9485d3abfd3ae664a15cb7d
      CANDIDATE_TREE: 04b5833614997afe51e542720ec6e1d5e5196592
      RUNTIME_TREE: 057fbba8822950f163aa322d99b889ed3ab24842
      READINESS_RUN: '33567195059'
      READINESS_ARTIFACT: '9823578793'
      READINESS_DIGEST: sha256:aad7d03454c9063ee72c48e5158653a9494e8caa7f2f8d378044545da464edcb
      FORMAL_BRANCH: release/v2.37.0-formal-source-20260902
    steps:
      - name: Verify Candidate Readiness authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json=$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$READINESS_RUN)
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = 6ad7d4f7be29636effe61f577479d00d92116453
          art_json=$(gh api repos/llhzx2018/core-free-runner-public/actions/artifacts/$READINESS_ARTIFACT)
          test "$(jq -r .workflow_run.id <<<"$art_json")" = "$READINESS_RUN"
          test "$(jq -r .digest <<<"$art_json")" = "$READINESS_DIGEST"
          test "$(jq -r .expired <<<"$art_json")" = false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p01
      - name: Bind exact Candidate PASS and push isolated Formal Source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test -z "$(git ls-remote --heads origin "refs/heads/$FORMAL_BRANCH")"
          test -z "$(git ls-remote --tags origin refs/tags/v2.37.0)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text())
          if d.get('candidate_version')!='2.37.0' or d.get('production_version')!='2.36.5': raise SystemExit('candidate/production version drift')
          if d.get('schema_version')!='2026082901': raise SystemExit('schema drift')
          c=d.get('v2_37_0_release_candidate') or {}
          if c.get('unknown_runtime_bytes')!=0: raise SystemExit('unknown runtime byte drift')
          c.update({
            'candidate_source':'0020ddc866f888a5d9485d3abfd3ae664a15cb7d',
            'candidate_tree':'04b5833614997afe51e542720ec6e1d5e5196592',
            'candidate_runtime_tree':'057fbba8822950f163aa322d99b889ed3ab24842',
            'stage_gate_r3':33567057091,
            'stage_r1_classification':'HARNESS_ONLY / WORKFLOW REGISTRATION',
            'stage_r2_gate':33566926255,
            'stage_r2_classification':'HARNESS_ONLY / UNTRACKED QUICK-SAVE DIFF ACCOUNTING',
            'candidate_readiness_gate':33567195059,
            'candidate_readiness_artifact':9823578793,
            'candidate_readiness_artifact_digest':'sha256:aad7d03454c9063ee72c48e5158653a9494e8caa7f2f8d378044545da464edcb',
            'state':'CANDIDATE READINESS PASS / FORMAL BIND GATE',
            'main_write':False,'core_updates_write':False,'owner_production_write':False
          })
          d['v2_37_0_release_candidate']=c
          d['status']='V2.36.5 OWNER PRODUCTION / PUBLISHED / V2.37.0 FORMAL CANDIDATE'
          d['current_phase']='V2.37.0 CANDIDATE READINESS PASS / FORMAL BIND GATE'
          d['candidate_state']='CANDIDATE READINESS PASS / FORMAL SOURCE BINDING'
          d['formal_release_state']='V2.36.5 PUBLISHED + OWNER PRODUCTION / V2.37.0 CANDIDATE PASS / NOT YET RELEASED'
          d['current_authority']='Owner Production V2.36.5 / Published Latest V2.36.5 / V2.37.0 Candidate Readiness PASS / Formal Source binding'
          d['next_action']='Run V2.37.0 Formal Artifact and Strict Fresh gates from immutable Formal Source. No main, Tag, Release, core-updates or Owner Production write before gates pass.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(git diff --name-only)" = VF_PROJECT.json
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          git diff --check
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add VF_PROJECT.json
          test "$(git diff --cached --name-only)" = VF_PROJECT.json
          git commit -m 'release(P01): bind V2.37.0 candidate PASS'
          FORMAL=$(git rev-parse HEAD); FORMAL_TREE=$(git rev-parse HEAD^{tree})
          test "$(git rev-parse HEAD^)" = "$CANDIDATE"
          test "$(git rev-parse HEAD:src)" = "$RUNTIME_TREE"
          test "$(git diff --name-only "$CANDIDATE" HEAD)" = VF_PROJECT.json
          printf 'P01_V2370_FORMAL_BIND=PASS\nFORMAL_SOURCE=%s\nFORMAL_TREE=%s\nRUNTIME_TREE=%s\nPARENT=%s\nREADINESS_RUN=%s\nREADINESS_ARTIFACT=%s\nREADINESS_DIGEST=%s\nMAIN_WRITE=NO\nTAG_RELEASE_WRITE=NO\nCORE_UPDATES_WRITE=NO\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$RUNTIME_TREE" "$CANDIDATE" "$READINESS_RUN" "$READINESS_ARTIFACT" "$READINESS_DIGEST" | tee /tmp/p01-v2370-formal-bind.txt
          git push origin HEAD:"refs/heads/$FORMAL_BRANCH"
          test "$(git ls-remote --heads origin "refs/heads/$FORMAL_BRANCH" | awk '{print $1}')" = "$FORMAL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-v2370-formal-bind-${{ github.run_id }}
          path: /tmp/p01-v2370-formal-bind.txt
          if-no-files-found: error
          retention-days: 90
