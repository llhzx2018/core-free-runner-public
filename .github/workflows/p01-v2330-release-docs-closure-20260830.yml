name: P01 V2.33 Release Docs Closure
on:
  push:
    branches: [task/p01-v2330-formal-release-20260830]
    paths:
      - .github/workflows/p01-v2330-release-docs-closure-20260830.yml
      - scripts/p01-v2330-close-release-docs.py
permissions:
  contents: read
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact release-closure branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: docs/p01-v2.33.0-release-closure-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Write and verify release closure docs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 8c819c8bfd055d16b3ac367cef15f723431d9a42
          test "$(git rev-parse HEAD^{tree})" = db5a6e2b6a852e6925727b974fb7130359e3cdf8
          test "$(git rev-parse HEAD:src)" = febc1b01a5b59963bc974cdc6455cfa824c0adc3
          python3 ../runner/scripts/p01-v2330-close-release-docs.py
          python3 -m json.tool VF_PROJECT.json >/dev/null
          test "$(jq -r .production_version VF_PROJECT.json)" = 2.32.0
          test "$(jq -r .working_version VF_PROJECT.json)" = 2.33.0
          test "$(jq -r .formal_release_state VF_PROJECT.json)" = 'PUBLISHED / REMOTE_GATE_PASS / OWNER_PRODUCTION_PENDING'
          test "$(jq -r .current_change.formal_release.remote_online_update_gate VF_PROJECT.json)" = 33269384118
          test "$(jq -r .current_change.formal_release.release_id VF_PROJECT.json)" = 379071259
          test "$(jq -r .current_change.formal_release.owner_production_write VF_PROJECT.json)" = false
          test "$(jq -r .v2_33_tag_state VF_PROJECT.json)" = 'PUBLISHED / IMMUTABLE'
          test "$(jq -r .core_updates_v2_33_state VF_PROJECT.json)" = 'PUBLISHED / REMOTE VERIFIED'
          test -z "$(git diff --name-only -- src)"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > /tmp/actual.txt
          printf '%s\n' CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/evidence/P01_V2.33.0_RELEASE_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test -s docs/evidence/P01_V2.33.0_RELEASE_CLOSURE_20260830.md
          grep -F '33269384118' docs/authority/CURRENT.md >/dev/null
          grep -F '379071259' docs/evidence/P01_V2.33.0_RELEASE_CLOSURE_20260830.md >/dev/null
          grep -F 'V2.32.0' docs/evidence/P01_V2.33.0_RELEASE_CLOSURE_20260830.md >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md README.md VF_PROJECT.json docs/README.md docs/authority/ACCEPTANCE_MATRIX.md docs/authority/CURRENT.md docs/evidence/P01_V2.33.0_RELEASE_CLOSURE_20260830.md docs/handoff/CURRENT_STATE.md
          git commit -m 'docs(P01): close V2.33.0 formal release authority'
          git push origin HEAD:docs/p01-v2.33.0-release-closure-20260830
          echo "RELEASE_DOCS_SOURCE=$(git rev-parse HEAD)"
          echo "RELEASE_DOCS_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo OWNER_PRODUCTION_WRITE=NO
