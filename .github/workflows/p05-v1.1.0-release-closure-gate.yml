name: P05 V1.1.0 Release Closure Gate

on:
  push:
    branches:
      - verify/p05-v1.1.0-release-source-20260830
    paths:
      - '.github/workflows/p05-v1.1.0-release-closure-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_CLOSURE_SOURCE: 8f6c3eb29a645dd0afb6709563fc3fe5b299b61e
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Verify private read capability
        run: test -n "$PRIVATE_READ_TOKEN" || exit 78
      - name: Checkout exact P05 closure source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_CLOSURE_SOURCE }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Closure truth and regression gate
        working-directory: source
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_CLOSURE_SOURCE"
          test "$(tr -d '\r\n' < VERSION)" = '1.1.0'
          python3 - <<'PY'
          import json
          p=json.load(open('VF_PROJECT.json',encoding='utf-8'))
          assert p['status']=='V1.1.0_RELEASED / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          assert p['version']=='1.1.0' and p['target_version']=='1.1.0' and p['working_version']=='1.1.0'
          assert p['formal_release']=='v1.1.0' and p['formal_release_state']=='RELEASED_CURRENT'
          assert p['formal_release_candidate_commit']=='e3455704cf5fc7254b86fbe84cc3941f585a15ac'
          assert p['formal_release_candidate_tree']=='46b4fca0b04ecae1653ca9d75228c3b949c5267c'
          assert p['formal_release_id']==379062020 and p['formal_release_asset_id']==535551195
          assert p['formal_release_asset_files']==32 and p['formal_release_asset_bytes']==190082
          assert p['formal_release_asset_sha256']=='86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6'
          assert p['production_deployment']=='NOT_DEPLOYED' and p['production_version'] is None
          assert p['release_publication']['state']=='PASS_V1.1.0_CURRENT'
          assert p['release_publication']['distribution_commit']=='294b8b4bb2ee79bfab5bf01478ad6b8448b457c9'
          assert p['release_publication']['distribution_mode']=='FULL_ONLY' and p['release_publication']['from_versions']==[]
          assert p['authority']['release']=='docs/authority/RELEASE_V1.1.0_CURRENT.md'
          print('P05_V110_AUTHORITY_JSON=PASS')
          PY
          grep -F 'Current Formal Release: v1.1.0 · PHP-first Runtime' README.md
          grep -F '## 1.1.0 · PHP-first Runtime（正式发布 · 2026-08-30）' CHANGELOG.md
          grep -F 'P05 V1.1.0 RELEASE = PASS / CLOSED' docs/authority/RELEASE_V1.1.0_CURRENT.md
          grep -F 'Production = NOT_DEPLOYED' docs/authority/RELEASE_V1.1.0_CURRENT.md
          rel="$(gh api repos/llhzx2018/vf-seo/releases/tags/v1.1.0)"
          test "$(jq -r '.id' <<<"$rel")" = '379062020'
          test "$(jq -r '.target_commitish' <<<"$rel")" = 'e3455704cf5fc7254b86fbe84cc3941f585a15ac'
          test "$(jq -r '.assets[]|select(.id==535551195)|.digest' <<<"$rel")" = 'sha256:86d889030ba4029f5b4d7cc4b2de352233d2c81b569765b58b36573f0941c3d6'
          curl -fsS -H "Authorization: Bearer $PRIVATE_READ_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P05.json?ref=main | jq -r '.content' | base64 -d >/tmp/P05.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/P05.json'))
          assert p['target_version']=='1.1.0' and p['release_id']==379062020 and p['asset_id']==535551195
          assert p['update_type']=='FULL_ONLY' and p['from_versions']==[] and p['deployment_state']=='NOT_DEPLOYED'
          print('P05_V110_DISTRIBUTION_MAIN=PASS')
          PY
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          test -z "$(git status --porcelain)"
          echo P05_V110_RELEASE_CLOSURE_MACHINE=PASS
