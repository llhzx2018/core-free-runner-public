name: P04 V2.7 Integrated 15 Task Gate V2
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-integrated-flow-v2.yml]
permissions:
  contents: write
jobs:
  flow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run
        shell: bash
        run: |
          set +e
          result=/tmp/p04-v270-flow-result.json
          cd private
          src=$(grep -rl --include='*.sh' 'v260-user-task-fixture.php' scripts tests 2>/dev/null | head -n1)
          if [ -z "$src" ] && [ -f scripts/run-v258-browser-gate.sh ]; then src=scripts/run-v258-browser-gate.sh; fi
          if [ -z "$src" ]; then printf '{"status":"FAIL","failed_gate":"NO_PROJECT_NATIVE_BROWSER_HARNESS"}\n' > "$result"; exit 0; fi
          tmp="$(dirname "$src")/.v270-integration-run.sh"
          cp "$src" "$tmp"; chmod +x "$tmp"
          python3 - "$tmp" <<'PY'
          import re,sys
          p=sys.argv[1]; s=open(p,encoding='utf-8').read()
          s=re.sub(r'tests/e2e/[A-Za-z0-9._/-]+\.mjs','tests/e2e/v270-integrated-ua.mjs',s)
          open(p,'w',encoding='utf-8').write(s)
          PY
          VF_V270_RESULT="$result" bash "$tmp" >/tmp/v270-harness.log 2>&1
          rc=$?; rm -f "$tmp"
          if [ ! -s "$result" ]; then printf '{"status":"FAIL","failed_gate":"PROJECT_NATIVE_HARNESS","exit":%s}\n' "$rc" > "$result"; fi
          exit 0
      - name: Publish result and pass marker
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp /tmp/p04-v270-flow-result.json evidence/p04-v270-integrated-flow-v2.json || printf '{"status":"FAIL","failed_gate":"RUNNER_SETUP"}\n' > evidence/p04-v270-integrated-flow-v2.json
          rm -f evidence/p04-v270-integrated-flow-v2.PASS
          if jq -e '.status=="PASS" and .task_count==15 and .pass_count==15 and .max_clicks<=3 and .max_context_switch<=1 and .backtracking_total==0 and .dead_end==0 and .unknown_next_action==0' evidence/p04-v270-integrated-flow-v2.json >/dev/null; then
            printf 'P04_V270_INTEGRATED_FLOW_15_15_PASS\n' > evidence/p04-v270-integrated-flow-v2.PASS
          fi
          rm -rf private /tmp/v270-harness.log /tmp/p04-v270-flow-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A evidence/p04-v270-integrated-flow-v2.*
          git commit -m 'evidence(P04): V2.7 integrated 15-task gate v2' || exit 0
          git push origin HEAD:p04-v270-integration-gate
