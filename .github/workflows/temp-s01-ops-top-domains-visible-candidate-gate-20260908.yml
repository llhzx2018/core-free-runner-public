name: temp-s01-ops-top-domains-visible-candidate-gate-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-ops-top-domains-visible-candidate-gate-20260908.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      REPO: llhzx2018/vf-tools-ops
      BASE: fed61edd6df2f8bdd07d8b3f18707fcb33e412bf
      HEAD: 63ca3d9094ca13d3eead74cf28aa470827b5831d
      BRANCH: work/s01-ops-top-domains-visible-refinement-20260908
    steps:
      - name: Exact candidate gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'GATE=S01_C02_TOP_DOMAINS_VISIBLE_REFINEMENT WRITE_USED=NO RELEASE_WRITE_USED=NO DISTRIBUTION_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          rm -rf /tmp/ops-candidate
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/ops-candidate
          cd /tmp/ops-candidate
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" "refs/heads/${BRANCH}" | awk '{print $1}')" = "$HEAD"
          git checkout -q "$HEAD"
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(tr -d '\r\n' < VERSION)" = '1.21.859'
          echo 'EXACT_HEAD_AND_VERSION=PASS'

          mapfile -t changed < <(git diff --name-only "$BASE" "$HEAD" | sort)
          printf 'CHANGED=%s\n' "${changed[*]}"
          expected=(
            assets/css/current/admin-s01-top-domains-v3.css
            includes/views/admin-style-helpers/admin-s01-uiux-polish.php
            tests/top-domains-visible-ui-contract.php
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo 'CHANGE_SCOPE=PASS'

          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          php -l tests/top-domains-visible-ui-contract.php >/dev/null
          php -l includes/admin-v13/views/publish_zip.php >/dev/null
          php -l includes/admin-v13/views/acceptance_overview.php >/dev/null
          php -l includes/admin-v13/views/system_site_release.php >/dev/null
          php tests/top-domains-visible-ui-contract.php
          php tests/visible-console-v2-contract.php
          php tests/dashboard-visible-ui-contract.php
          php tests/update-compat-human-language-contract.php
          php tests/update-refresh-policy-current-contract.php
          echo 'PHP_AND_UI_CONTRACTS=PASS'

          css=assets/css/current/admin-s01-top-domains-v3.css
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/current/admin-s01-top-domains-v3.css')
          s=p.read_text()
          assert s.count('{')==s.count('}'), (s.count('{'),s.count('}'))
          for token in ['.vf-v13-publish-single','.vf-accept-product','.vf-site-release','@media (max-width:782px)',':focus-visible','prefers-reduced-motion']:
              assert token in s, token
          print('CSS_STRUCTURE=PASS')
          PY
          grep -F "admin-s01-top-domains-v3.css" includes/views/admin-style-helpers/admin-s01-uiux-polish.php >/dev/null
          tail -n +1 includes/views/admin-style-helpers/admin-s01-uiux-polish.php | grep -F "PHP_INT_MAX" >/dev/null
          echo 'FINAL_OWNER_LOAD=PASS'

          test -f assets/css/current/admin-s01-top-domains-v3.css
          test -f vf-ops.php
          grep -F 'Version: 1.21.859' vf-ops.php >/dev/null
          grep -RFl --include='*.php' "vf-ops/vf-ops.php" includes tests .github 2>/dev/null | head -n1 >/dev/null || true
          ! git diff "$BASE" "$HEAD" -- vf-ops.php VERSION includes/wp-update | grep -E '^[+-].*(6\.0\.0|locator|vf-ops/vf-ops\.php|migration)' >/dev/null
          echo 'IDENTITY_BOUNDARY=PASS'

          echo 'PRODUCTION=NOT_RUN STATIC=NOT_RUN ONLINE=NOT_RUN FINAL_ONLINE_PASS=NOT_CLAIMED'
          echo 'PASS_S01_C02_TOP_DOMAINS_VISIBLE_CANDIDATE_GATE'
