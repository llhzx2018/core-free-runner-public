name: TEMP S01-C02 Owner WordPress Runtime Gate

on:
  push:
    branches:
      - temp/s01-c02-owner-wordpress-runtime-gate-20260901

permissions:
  contents: read

concurrency:
  group: temp-s01-c02-owner-wordpress-runtime-gate
  cancel-in-progress: false

jobs:
  owner-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: vf_s01_owner
          MARIADB_USER: vf
          MARIADB_PASSWORD: vf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      OPS_SHA: 1fa6ac391b908ccbb7db62412bab17fac5ae0d40
      M3U8_SHA: 2e636cf580b77116c02048b19b36894b0295851b
      THEME_SHA: a293009567c932310d19a310a8ea6361a2ef71c8
      WP_VERSION: 7.0.2
      WP_PATH: /tmp/vf-s01-owner-wp
      WP_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: owner
      EVIDENCE_DIR: /tmp/vf-s01-owner-evidence

    steps:
      - name: Checkout temporary runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          ref: temp/s01-c02-owner-wordpress-runtime-gate-20260901
          fetch-depth: 1
          persist-credentials: false
          path: runner

      - name: Checkout exact Ops recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 1fa6ac391b908ccbb7db62412bab17fac5ae0d40
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops

      - name: Checkout exact M3U8 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 2e636cf580b77116c02048b19b36894b0295851b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: m3u8

      - name: Checkout exact Theme source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24
        with:
          repository: llhzx2018/vf-tools-theme
          ref: a293009567c932310d19a310a8ea6361a2ef71c8
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: theme

      - name: Execute isolated WordPress OWNER runtime gate
        shell: bash
        run: bash runner/scripts/temp-s01-c02-owner-runtime.sh

      - name: Upload public-safe runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 Node24
        with:
          name: s01-c02-owner-wordpress-runtime-gate-${{ github.run_id }}
          path: /tmp/vf-s01-owner-evidence/
          if-no-files-found: warn
          retention-days: 14
