name: P08 v0.1.2 real published v0.1.1 FULL -> 3 source-locked release ZIPs
on:
  pull_request:
    paths:
      - .github/workflows/p08-v012-official-binary-fidelity-once.yml
permissions:
  contents: read
jobs:
  official-source-and-three-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ephemeral public-safe harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Transient exact merged private P08
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f6bb8afa339739cd089c940bf6a58dd400cd556d
          path: p08-v012-private-src
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Canonical GOV-DOC immutable verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 7b60a8b36795cf1b5c5e49d24f258b5a6a141ce4
          path: gov-doc-verify
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: PHP 8.4 + locked deps
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, pdo_sqlite, curl, fileinfo
          tools: composer:v2
          coverage: none
      - name: Read ONLY real published 0.1.1 FULL asset from official GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          src="$PWD/p08-v012-private-src"
          test "$(git -C "$src" rev-parse HEAD)" = f6bb8afa339739cd089c940bf6a58dd400cd556d
          test "$(cat "$src/VERSION")" = 0.1.2
          oldDir="$RUNNER_TEMP/r102-genuine-published-v011"
          test ! -e "$oldDir"
          mkdir -m 0700 "$oldDir"
          gh release download v0.1.1 \
            --repo llhzx2018/vf-adops \
            --pattern VF_AdOps_V0.1.1_FULL.zip \
            --dir "$oldDir" > /dev/null
          test -f "$oldDir/VF_AdOps_V0.1.1_FULL.zip"
          printf '%s  %s\n' \
            'd6caf8893d5ee24944bbcf79ad48e1ebb175938af4c222e0354eec9e4ddc87ba' \
            "$oldDir/VF_AdOps_V0.1.1_FULL.zip" | sha256sum -c -
          test "$(stat -c %s "$oldDir/VF_AdOps_V0.1.1_FULL.zip")" = 8044300
          mkdir -m 0700 "$oldDir/extracted"
          unzip -q "$oldDir/VF_AdOps_V0.1.1_FULL.zip" -d "$oldDir/extracted"
          test "$(sha256sum "$oldDir/extracted/FULL_MANIFEST.json" | cut -d' ' -f1)" = 2da516361324ace4c06a1ff870085a8e3748fa881faa86404ef3175ddba490e8
          echo P08_REAL_OFFICIAL_PUBLISHED_011_ZIP_AND_MANIFEST_SHA256=PASS
      - name: Compile merged 0.1.2 code and original old 0.1.1 Bridge source
        run: |
          set -euo pipefail
          src="$PWD/p08-v012-private-src"
          cd "$src"
          composer install --no-interaction --no-scripts --no-progress --prefer-dist > "$RUNNER_TEMP/p08-v012-fidelity-composer.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-fidelity-composer.log"; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/p08-v012-fidelity-npm.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-fidelity-npm.log"; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-v012-fidelity-vite.log" 2>&1 || { tail -n 15 "$RUNNER_TEMP/p08-v012-fidelity-vite.log"; exit 1; }
          test -f vendor/autoload.php && test -f public/build/manifest.json
          git worktree add --detach "$RUNNER_TEMP/p08-v011-git-published" 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          test "$(git -C "$RUNNER_TEMP/p08-v011-git-published" rev-parse HEAD)" = 9c7f76434fe2d064f2f1ac15c58a760f778cf055
          git worktree add --detach "$RUNNER_TEMP/p08-v012-git-clean" f6bb8afa339739cd089c940bf6a58dd400cd556d
          test -z "$(git -C "$RUNNER_TEMP/p08-v012-git-clean" status --porcelain --untracked-files=all)"
      - name: Canonical FULL and real published old-source Atomic/Bridge
        env:
          GITHUB_ACTIONS: 'true'
          P08_ISOLATED_INSTALL_TEST: YES
          P08_R102_DISPOSABLE_SCHEMA: YES
        run: |
          set -euo pipefail
          src="$PWD/p08-v012-private-src"
          gov="$PWD/gov-doc-verify"
          build="$RUNNER_TEMP/p08-v012-real-release-source-packages"
          old="$RUNNER_TEMP/r102-genuine-published-v011/extracted"
          target="$RUNNER_TEMP/p08-v012-extracted-target"
          bridge="$RUNNER_TEMP/p08-v011-extracted-bridge"
          mkdir -m 0700 "$build" "$target" "$bridge"
          python3 - "$src" "$RUNNER_TEMP/p08-v012-git-clean" "$gov" "$build/VF_AdOps_V0.1.2_FULL.zip" <<'PY'
          import sys
          from pathlib import Path
          src,clean,gov,out=map(Path,sys.argv[1:])
          sys.path.insert(0,str(src/"scripts"))
          from build_full import write_full,verify_canonical_full_contract
          sha="f6bb8afa339739cd089c940bf6a58dd400cd556d"
          verify_canonical_full_contract(clean,out,sha,gov,"resolve")
          write_full(src,out,"0.1.2",sha)
          verify_canonical_full_contract(clean,out,sha,gov,"delivery")
          print("P08_RELEASE_012_CANONICAL_FULL_SOURCE_AND_COMPILED_BYTES=PASS")
          PY
          unzip -q "$build/VF_AdOps_V0.1.2_FULL.zip" -d "$target"
          oldhash="$(sha256sum "$old/FULL_MANIFEST.json" | cut -d' ' -f1)"
          test "$oldhash" = 2da516361324ace4c06a1ff870085a8e3748fa881faa86404ef3175ddba490e8
          python3 "$src/scripts/build_r102_schema_atomic.py" \
            --source "$target" --output "$build/VF_AdOps_V0.1.2_UPDATE.zip" \
            --old-full-sha256 "$oldhash" \
            --target-sha f6bb8afa339739cd089c940bf6a58dd400cd556d
          python3 "$src/scripts/build_r102_owner_bridge.py" \
            --old-full "$old" --overlay "$src" \
            --old-full-sha256 "$oldhash" \
            --overlay-sha f6bb8afa339739cd089c940bf6a58dd400cd556d \
            --old-published-source "$RUNNER_TEMP/p08-v011-git-published" \
            --output "$build/VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip"
          unzip -q "$build/VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip" -d "$bridge"
          php -r 'require $argv[1]."/src/Installation/SetupGuard.php"; VF\AdOps\Installation\SetupGuard::package($argv[2]); VF\AdOps\Installation\SetupGuard::package($argv[3]);' "$src" "$target" "$bridge"
          python3 - "$build" <<'PY'
          import pathlib,hashlib,json,zipfile,sys
          root=pathlib.Path(sys.argv[1])
          names=["VF_AdOps_V0.1.2_FULL.zip","VF_AdOps_V0.1.2_UPDATE.zip","VF_AdOps_V0.1.1_R102_BRIDGE_FULL.zip"]
          for name in names:
            p=root/name;assert p.is_file() and not p.is_symlink()
            with zipfile.ZipFile(p) as z:
              members=z.namelist();assert len(members)>20 and len(members)==len(set(members))
              if "_UPDATE" in name:
                m=json.loads(z.read("ATOMIC_MANIFEST.json"))
                assert m["source_full_manifest_sha256"]=="2da516361324ace4c06a1ff870085a8e3748fa881faa86404ef3175ddba490e8"
                assert m["source_sha"]=="9c7f76434fe2d064f2f1ac15c58a760f778cf055"
                assert m["target_sha"]=="f6bb8afa339739cd089c940bf6a58dd400cd556d"
                assert m["schema_changes"] is True and len(m["migrations"])==10
              else:
                m=json.loads(z.read("FULL_MANIFEST.json"))
                assert m["type"]=="CLEAN_FULL_ONLY" and m["data_included"] is False
            print("P08_V012_REAL_011_SOURCE_ASSET_SHA256="+name+" "+hashlib.sha256(p.read_bytes()).hexdigest()+" "+str(p.stat().st_size))
          PY
          # Real published binary old FULL (NOT a rebuilt v0.1.1 fixture).
          site="$RUNNER_TEMP/p08-v012-real-official-old-owner-site"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/r102-genuine-published-v011/VF_AdOps_V0.1.1_FULL.zip" -d "$site"
          php "$src/tests/compatibility/r102_install_published_sqlite.php" "$site"
          php "$src/tests/compatibility/r102_bridge_installed_sqlite.php" success "$site" "$bridge"
          php "$src/tests/compatibility/r102_clicked_upgrade_sqlite.php" success "$site" "$target" "$build/VF_AdOps_V0.1.2_UPDATE.zip"
          echo P08_REAL_PUBLISHED_011_OWNER_TO_012_SOURCE_BOUND_ATOMIC=PASS
      - name: Always erase private source, official binary and candidate files
        if: always()
        run: |
          rm -rf "$GITHUB_WORKSPACE/p08-v012-private-src" "$GITHUB_WORKSPACE/gov-doc-verify" \
            "$RUNNER_TEMP/r102-genuine-published-v011" "$RUNNER_TEMP/p08-v011-git-published" \
            "$RUNNER_TEMP/p08-v012-git-clean" "$RUNNER_TEMP/p08-v012-real-release-source-packages" \
            "$RUNNER_TEMP/p08-v012-extracted-target" "$RUNNER_TEMP/p08-v011-extracted-bridge" \
            "$RUNNER_TEMP/p08-v012-real-official-old-owner-site"
