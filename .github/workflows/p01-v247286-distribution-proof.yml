name: P01 temporary Distribution exact-source proof
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247286-distribution-proof.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 92c6bf2cd8a07e7b46a83d6d231539c4a2c1a391
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,openssl
          coverage: none
      - name: Canonical distribution validation
        run: |
          set -Eeuo pipefail
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          p=json.load(open('projects/P01.json'))
          assert p['current_version']=='2.47.285'
          assert p['target_version']=='2.47.286'
          assert p['from_versions']==['2.47.285']
          assert p['product_identity']=='9fe459378b940d53819b20e886280177ecdee46f'
          assert p['asset_sha256']=='e39d8149826c2082366318c6fb3914d9601eb1ab5ca6ae965b82a874dac60c5e'
          assert p['asset_bytes']==2362869
          assert p['schema_from']==p['schema_to']=='2026090401'
          print('P01_DISTRIBUTION_IDENTITY=PASS')
          PY
          echo P01_DISTRIBUTION_CANONICAL=PASS
