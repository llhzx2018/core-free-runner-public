name: p01-channel-b2-exact-once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-channel-b2-exact-once.yml'

permissions:
  contents: read

jobs:
  exact-source:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p01-channel-b2-pr1720-exact-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare exact PHP test runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-curl php-xml php-mbstring php-sqlite3 >/dev/null
          php -v
          node --version

      - name: Checkout P01 exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 36377a739139251306a470638d05df3ac8e57f46
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false

      - name: Bind exact source and run focused PHP contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "36377a739139251306a470638d05df3ac8e57f46"
          test "$(tr -d '\r\n' < VERSION)" = "2.47.453"
          test "$(tr -d '\r\n' < src/VERSION.txt)" = "2.47.453"
          php -l src/app/ChannelLibraryPage.php
          php -l tests/unit/channel_owner_direct_edit_unclipped_contract.php
          php -l tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/channel_owner_direct_edit_unclipped_contract.php
          php tests/unit/channels_guest_readonly_layout_v247390_contract.php
          php tests/unit/channel_card_action_hierarchy_contract.php
          php tests/unit/channels_v247140_source_manager_contract.php
          php tests/unit/channels_v247141_source_manager_r2_contract.php
          php tests/unit/channels_v247143_adaptive_density_contract.php
          node --check src/assets/workspace.js
          echo P01_CHANNEL_BATCH2_EXACT_SOURCE=PASS
