name: P01 GOV-BOOK Sync Native Gate
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/p01-gov-book-sync-native.yml'
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'test/p01-gov-book-sync-native-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P01 candidate from private repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 27b37383c79075b67b39f3a09cf19e003444d3e3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
      - name: Native PHP SQLite prerequisites
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,zip,curl,gd,mbstring
          coverage: none
      - name: Exact candidate syntax and version/CSRF/contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = 27b37383c79075b67b39f3a09cf19e003444d3e3
          test "$(tr -d '\r\n ' < VERSION)" = 2.47.359
          for file in src/app/GovBookSync.php src/app/CoursePackageStore.php src/app/ResourceAssetStore.php src/app/CourseLibraryPage.php src/app/JobManager.php src/gov-book-sync.php tests/unit/gov_book_sync_contract_native.php; do
            php -l "$file"
          done
          php tests/unit/gov_book_sync_contract_native.php | tee /tmp/govbook-test.txt
          grep -Fx 'P01_GOV_BOOK_CATALOG_STRICT_IDENTITY=PASS' /tmp/govbook-test.txt
          grep -Fx 'P01_GOV_BOOK_VERSION_MONOTONIC_AND_HASH=PASS' /tmp/govbook-test.txt
          grep -Fx 'P01_GOV_BOOK_PARTIAL_RETRY_AND_MANUAL_GUARDS=PASS' /tmp/govbook-test.txt
          grep -Fx 'P01_GOV_BOOK_ADMIN_CSRF_AND_DAILY_OPT_IN=PASS' /tmp/govbook-test.txt
          echo P01_GOV_BOOK_SYNC_EXACT_NATIVE=PASS
