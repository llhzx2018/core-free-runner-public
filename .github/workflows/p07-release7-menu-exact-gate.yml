name: P07 Release7 Menu Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-release7-menu-exact-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify private read capability
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 7b5a7e2e1f596c6ee5f2ba57005727a271820e45
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Identity and syntax
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7b5a7e2e1f596c6ee5f2ba57005727a271820e45'
          test "$(cat VERSION)" = '0.1.0'
          test "$(cat BUILD_ID)" = '0.1.0-release7'
          for f in bin/vfops-user bin/vfops-site-ui bin/vfops-migrate-ui bin/vfops-auto-backup bin/vfops-cloudpanel-ui lib/cloudpanel_ui_common.sh lib/cloudpanel_ui_sites.sh lib/cloudpanel_ui_ops.sh lib/cloudpanel_ui_admin.sh; do bash -n "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in (Path("lib"), Path("tests"), Path("scripts")):
              for p in sorted(root.rglob("*.py")):
                  py_compile.compile(str(p), doraise=True)
          PY

      - name: Seven-route interaction contract
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests.test_main_menu_routes
          grep -Fq '3) run_module "$SITE_UI" restore' bin/vfops-user
          grep -Fq '没有发现已验证、可恢复的 P07 本地备份。' bin/vfops-site-ui
          grep -Fq '请先使用“备份网站”创建并验证一个备份。' bin/vfops-site-ui
          grep -Fq '功能没有正常完成：' bin/vfops-user
          grep -Fq '主菜单仍可继续使用' bin/vfops-user

      - name: Full Slot3 regressions
        working-directory: source
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Machine and secret boundary
        working-directory: source
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release7'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE7_MENU_EXACT_SOURCE=7b5a7e2e1f596c6ee5f2ba57005727a271820e45'
          echo 'P07_PRODUCTION_MIGRATION=NOT_RUN'
          echo 'P07_DNS_WRITE=NOT_RUN'
          echo 'P07_SOURCE_DELETE=NOT_RUN'
