name: S01 Error Recovery UX Distribution Gate
on:
  push:
    branches: [temp/s01-error-recovery-ux-code-gate-20260907]
    paths: [.github/workflows/temp-s01-error-recovery-ux-distribution-gate-20260907.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      CORE_REPO: llhzx2018/core-updates
      CORE_BRANCH: work/s01-error-recovery-ux-distribution-20260907
      CORE_SHA: c143b0c9d0cc65b0bfc1026af314b5e76a17a859
      CORE_BASE: 36c7538c1c67bf05f6989deac4be2c64c6b6b1f8
      OPS_SHA: e00281249697d6acf4383833d800eec424fdc60c
      M3U8_SHA: f806ad64447cdd84c664dcfa19ad52ab4fd45e17
    steps:
      - name: Exact two-manifest distribution proof
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'WRITE_TOKEN_USED=NO PRODUCT_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${CORE_REPO}.git" core
          git -C core checkout -q "$CORE_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C core rev-parse origin/main)" = "$CORE_BASE"
          git -C core diff --name-only "$CORE_BASE".."$CORE_SHA" | sort > /tmp/actual
          printf '%s\n' projects/S01-C02.json projects/S01-C03.json | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(git -C core show "$CORE_SHA":projects/S01-C01.json | git hash-object --stdin)" = '356ab3d7deaeed9c55886ec8e3f6e2d82e87aa60'
          for f in core/projects/S01-C01.json core/projects/S01-C02.json core/projects/S01-C03.json; do jq -e . "$f" >/dev/null; done
          (cd core && python3 scripts/check_manifest_contract.py > /tmp/contract.json)
          jq -e '.status=="PASS"' /tmp/contract.json >/dev/null
          find core/update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php core/update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          c1=json.load(open('core/projects/S01-C01.json'));c2=json.load(open('core/projects/S01-C02.json'));c3=json.load(open('core/projects/S01-C03.json'))
          assert c1['target_version']=='1.35.19' and c1['release_tag']=='v1.35.19'
          assert c1['asset_bytes']==1806467 and c1['asset_sha256']=='89c3217ded3fb220caa1a934cbc37cea5187edbb69f7b254b3fc1adb794f4f22'
          assert c1['runtime_files']==446 and c1['runtime_fingerprint']=='9113186c89e972aa668cb5c0fb52960a9dfd0302969f3a67ed750455fb9685d6'
          assert c2['target_version']=='1.21.858' and c2['release_tag']=='v1.21.858' and c2['asset_name']=='vf-tools-ops_V1.21.858.zip'
          assert c2['asset_bytes']==3340234 and c2['asset_sha256']=='9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a'
          assert c2['runtime_files']==934 and c2['runtime_file_count']==934 and c2['runtime_fingerprint']=='e5818323f80bb1ac37b34b1ec7e56d1615474f128eba104b59f4fcd17d4ede0a' and c2['runtime_fingerprint_sha256']==c2['runtime_fingerprint']
          assert c2['physical_locator']=='vf-ops/vf-ops.php' and c2['locator_cutover'] is False and c2['schema_from']==c2['schema_to']=='6.0.0'
          assert c2['from_versions']==['1.21.849','1.21.850','1.21.851','1.21.852','1.21.853','1.21.854','1.21.855','1.21.856','1.21.857']
          assert c3['target_version']=='1.25.29' and c3['release_tag']=='v1.25.29' and c3['asset_name']=='vf-tools-m3u8_V1.25.29.zip'
          assert c3['asset_bytes']==3580803 and c3['asset_sha256']=='faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890'
          assert c3['runtime_files']==559 and c3['runtime_file_count']==559 and c3['runtime_fingerprint']=='f9f78b4c655052482a1a806936c3f5e5d511ce7af894a5ac112eb220155f5946' and c3['runtime_fingerprint_sha256']==c3['runtime_fingerprint']
          assert c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php' and c3['locator_cutover'] is False and c3['schema_from']==c3['schema_to']=='1.3.0'
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24','1.25.25','1.25.26','1.25.27','1.25.28']
          assert 'migration remains CLOSED' in c3['notes']
          for c in (c1,c2,c3): assert 'does not claim Production' in c['notes']
          print('PASS_S01_ERROR_RECOVERY_CHANNEL_SEMANTICS')
          PY
          for spec in \
            'llhzx2018/vf-tools-ops|v1.21.858|vf-tools-ops_V1.21.858.zip|3340234|9a5000a0494e677e11c49edb415804566c54bbbca2d6c3442e4775121b73238a|e00281249697d6acf4383833d800eec424fdc60c' \
            'llhzx2018/vf-tools-m3u8|v1.25.29|vf-tools-m3u8_V1.25.29.zip|3580803|faa5137db1c3afdae9a23ed14365ad6af0497ae2281b1f555d967534876a1890|f806ad64447cdd84c664dcfa19ad52ab4fd45e17'; do
            IFS='|' read -r repo tag asset bytes digest sha <<< "$spec"
            test "$(gh api "repos/$repo/branches/main" --jq '.commit.sha')" = "$sha"
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            gh api "repos/$repo/releases/tags/$tag" > /tmp/release.json
            test "$(jq -r '.draft' /tmp/release.json)" = false
            test "$(jq -r '.prerelease' /tmp/release.json)" = false
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.size' /tmp/release.json)" = "$bytes"
            test "$(jq -r --arg a "$asset" '.assets[]|select(.name==$a)|.digest' /tmp/release.json)" = "sha256:$digest"
          done
          echo 'PASS_LIVE_C02_C03_RELEASE_AUTHORITIES'
          echo 'PASS_S01_ERROR_RECOVERY_UX_DISTRIBUTION_GATE'
