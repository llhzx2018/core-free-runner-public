name: P01 V2.46.4 Maintenance Candidate Gate

on:
  push:
    branches:
      - gate/p01-v2464-candidate-version-bump-20260905
    paths:
      - .github/workflows/p01-v2464-maintenance-candidate-gate-20260905.yml

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: 317eb3ee9dacf40ee1f285bd32823d77d2a18f21
      FORMAL_BASE_SHA: 494b7a9a497fed050885f27ccad3a280ba53b0ce
      ACCEPTED_UXUI_SHA: 4723025d7fa8a4ef14084d22e9222400ec1ed1cf
      CANDIDATE_BASE_SHA: a82ca05d5db1d507b6d4c9bf2c20e273e319cc30
      SCHEMA: '2026090401'
      APP_URL: http://127.0.0.1:19704
      TEST_PASSWORD: VF-V2464-Candidate-2026!
      EVIDENCE: ${{ github.workspace }}/evidence/v2464-candidate
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 317eb3ee9dacf40ee1f285bd32823d77d2a18f21
          path: formal
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable V2.46.3 Formal Source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 494b7a9a497fed050885f27ccad3a280ba53b0ce
          path: baseline
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout proven artifact builder template
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2462-artifact-20260905
          path: template
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout proven Atomic builder primitives
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-free-runner-public
          ref: 0468b28ae57c368f80b03f85060318667bcc5834
          path: proven
          fetch-depth: 1
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact cumulative source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C formal rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$FORMAL_BASE_SHA"
          test "$(cat formal/VERSION)" = '2.46.4'
          test "$(cat formal/src/VERSION.txt)" = '2.46.4'
          grep -Fxq "define('VF_VERSION', '2.46.4');" formal/src/app/bootstrap.php
          test "$(cat baseline/VERSION)" = '2.46.3'
          test "$(cat baseline/src/VERSION.txt)" = '2.46.3'
          grep -Fxq "define('VF_VERSION', '2.46.3');" baseline/src/app/bootstrap.php

          staged="$(git -C formal diff --name-only "$CANDIDATE_BASE_SHA"..HEAD | sort)"
          printf '%s\n' "$staged"
          test "$staged" = $'VERSION\nsrc/VERSION.txt\nsrc/app/bootstrap.php'

          accepted_runtime_delta="$(git -C formal diff --name-only "$ACCEPTED_UXUI_SHA"..HEAD -- src | sort)"
          test "$accepted_runtime_delta" = $'src/VERSION.txt\nsrc/app/bootstrap.php'

          cumulative="$(git -C formal diff --name-only "$FORMAL_BASE_SHA"..HEAD)"
          for required in \
            src/app/FunctionalHome.php \
            src/app/CourseLibraryPage.php \
            src/app/TopicLibraryPage.php \
            src/app/ProjectActionCenterPage.php \
            src/app/ToolProductPage.php \
            src/app/SoftwareProductPage.php \
            src/app/ChannelLibraryPage.php \
            src/app/WatchMediaLibraryPage.php \
            src/assets/visual-system-final.css \
            src/assets/quick-open.css; do
            grep -Fxq "$required" <<<"$cumulative"
          done
          ! grep -Eq '^src/migrations/' <<<"$cumulative"
          for forbidden in src/app/MigrationRunner.php src/app/Repository.php src/app/UpdateManager.php src/setup.php; do
            ! grep -Fxq "$forbidden" <<<"$cumulative"
          done
          echo P01_V2464_EXACT_CUMULATIVE_BOUNDARY=PASS

      - name: Frozen R1-R8 and source regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          find formal/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find formal/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          tests=(
            tests/unit/consolidated_product_acceptance_contract.php
            tests/unit/public_global_nav_contract.php
            tests/unit/workspace_nine_entry_source_contract.php
            tests/unit/workspace_view_catalog_contract.php
            tests/unit/course_experience_source_contract.php
            tests/unit/tool_home_source_contract.php
            tests/unit/tool_task_intent_contract.php
            tests/unit/tool_scene_detail_contract.php
            tests/unit/tool_scene_detail_source_contract.php
            tests/unit/software_workspace_contract.php
            tests/unit/software_workspace_source_contract.php
            tests/unit/topic_project_approved_contract.php
            tests/unit/topic_project_approved_source_contract.php
            tests/unit/project_signals_contract.php
            tests/unit/project_signals_source_contract.php
            tests/unit/quick_open_global_contract.php
            tests/unit/primary_open_semantics_contract.php
            tests/unit/uxui_round1_home_root_contract.php
            tests/unit/uxui_round2_subject_identity_contract.php
            tests/unit/uxui_round3_course_identity_contract.php
            tests/unit/uxui_round4_tools_identity_contract.php
            tests/unit/uxui_round5_software_identity_contract.php
            tests/unit/uxui_round6_channels_watch_identity_contract.php
            tests/unit/uxui_round7_navigation_home_identity_contract.php
            tests/unit/uxui_round8_visual_system_contract.php
          )
          for t in "${tests[@]}"; do (cd formal && php "$t"); done
          echo P01_V2464_FROZEN_REGRESSIONS=PASS

      - name: Derive deterministic V2.46.4 candidate test artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('template/scripts/_tmp_p01_v2462_formal_artifact_gate.py')
          src=p.read_text(encoding='utf-8')
          anchors={
            "FORMAL_SOURCE='aba9c59fb8b759a3b6e41e820c5fc0e093207004'":"FORMAL_SOURCE='317eb3ee9dacf40ee1f285bd32823d77d2a18f21'",
            "BASELINE_SOURCE='4821c92eb03cbafe076b63223ad034a99bc18b42'":"BASELINE_SOURCE='494b7a9a497fed050885f27ccad3a280ba53b0ce'",
            'BIND_GATE=33920670250':'BIND_GATE=0',
            'BIND_PR=371':'BIND_PR=0',
            "AUTH='OWNER_AUTHORIZED_ROUND9_FORMAL_RELEASE_20260905'":"AUTH='V2464_CANDIDATE_TEST_ONLY_NO_RELEASE_AUTH'",
          }
          for old,new in anchors.items():
            if old not in src: raise SystemExit('builder anchor missing: '+old)
            src=src.replace(old,new,1)
          src=src.replace('2.46.2','2.46.4').replace('2.46.0','2.46.3')
          src=src.replace("'stage':'FORMAL_ARTIFACT'","'stage':'CANDIDATE_GATE'")
          src=src.replace("'status':'FORMAL_ARTIFACT_PASS'","'status':'CANDIDATE_ARTIFACT_PASS'")
          Path('/tmp/p01-v2464-candidate-builder.py').write_text(src,encoding='utf-8')
          PY
          grep -Fq "VERSION='2.46.4'" /tmp/p01-v2464-candidate-builder.py
          grep -Fq "SOURCE_VERSION='2.46.3'" /tmp/p01-v2464-candidate-builder.py
          grep -Fq "FORMAL_SOURCE='317eb3ee9dacf40ee1f285bd32823d77d2a18f21'" /tmp/p01-v2464-candidate-builder.py
          grep -Fq "BASELINE_SOURCE='494b7a9a497fed050885f27ccad3a280ba53b0ce'" /tmp/p01-v2464-candidate-builder.py
          OUT=/tmp/p01-v2464-artifacts python3 /tmp/p01-v2464-candidate-builder.py >/tmp/p01-v2464-builder.json
          ASSETS=/tmp/p01-v2464-artifacts
          echo "ASSETS=$ASSETS" >> "$GITHUB_ENV"
          test "$(find "$ASSETS" -maxdepth 1 -type f | wc -l | tr -d ' ')" = '8'
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.46.4-FULL.zip.sha256 && sha256sum -c VF_Start_V2.46.4_UPDATE.zip.sha256 && sha256sum -c repair-v2.46.4.php.sha256)
          test "$(unzip -Z1 "$ASSETS/VF_Start_V2.46.4_UPDATE.zip" | wc -l | tr -d ' ')" = '1'
          unzip -Z1 "$ASSETS/VF_Start_V2.46.4_UPDATE.zip" | grep -Fxq repair-v2.46.4.php
          grep -Fq "public const SOURCE_VERSION='2.46.3';" "$ASSETS/repair-v2.46.4.php"
          grep -Fq "public const TARGET_VERSION='2.46.4';" "$ASSETS/repair-v2.46.4.php"
          grep -Fq "public const SOURCE_SCHEMA='2026090401';" "$ASSETS/repair-v2.46.4.php"
          grep -Fq "public const TARGET_SCHEMA='2026090401';" "$ASSETS/repair-v2.46.4.php"
          php "$ASSETS/repair-v2.46.4.php" --self-test | tee /tmp/v2464-selftest.json | jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' >/dev/null
          ! unzip -Z1 "$ASSETS/VF-Start-V2.46.4-FULL.zip" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V2464_CANDIDATE_ARTIFACT_TEST=PASS

      - name: Fresh install V2.46.4 candidate FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          F=/tmp/p01-v2464-fresh; E=/tmp/p01-v2464-fresh-evidence
          rm -rf "$F" "$E"; mkdir -p "$F" "$E"; unzip -q "$ASSETS/VF-Start-V2.46.4-FULL.zip" -d "$F"
          php -S 127.0.0.1:19701 -t "$F" >"$E/server.log" 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          C="$E/cookies"
          for i in $(seq 1 80); do if curl -fsS -c "$C" -b "$C" http://127.0.0.1:19701/setup.php -o "$E/setup.html"; then break; fi; sleep .25; done
          CSRF=$(python3 -c "import re; s=open('$E/setup.html',encoding='utf-8').read(); m=re.search(r'name=\"setup_csrf\"\s+value=\"([^\"]+)\"',s); assert m; print(m.group(1))")
          curl -fsS -c "$C" -b "$C" -X POST http://127.0.0.1:19701/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2464 Candidate Fresh' --data-urlencode "admin_password=$TEST_PASSWORD" --data-urlencode "admin_password_confirm=$TEST_PASSWORD" -o "$E/setup-post.html"
          F="$F" php -r 'require getenv("F")."/app/bootstrap.php"; $d=vf_db(); if(VF_VERSION!=="2.46.4") exit(1); if((string)$d->query("SELECT COALESCE(MAX(version),\"\") FROM schema_migrations WHERE status=\"success\"")->fetchColumn()!=="2026090401") exit(2); if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok") exit(3); echo "P01_V2464_FRESH_IDENTITY=PASS\n";'
          php "$F/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$F/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          kill "$PID"; trap - EXIT
          echo P01_V2464_FRESH_INSTALL=PASS

      - name: Build exact V2.46.3 Owner-like canonical fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          F=/tmp/p01-v2463-owner-fixture; E=/tmp/p01-v2463-owner-evidence
          rm -rf "$F" "$E"; cp -a baseline/src "$F"; mkdir -p "$E"
          php -S 127.0.0.1:19702 -t "$F" >"$E/server.log" 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          C="$E/cookies"
          for i in $(seq 1 80); do if curl -fsS -c "$C" -b "$C" http://127.0.0.1:19702/setup.php -o "$E/setup.html"; then break; fi; sleep .25; done
          CSRF=$(python3 -c "import re; s=open('$E/setup.html',encoding='utf-8').read(); m=re.search(r'name=\"setup_csrf\"\s+value=\"([^\"]+)\"',s); assert m; print(m.group(1))")
          curl -fsS -c "$C" -b "$C" -X POST http://127.0.0.1:19702/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2463 Owner Candidate Fixture' --data-urlencode "admin_password=$TEST_PASSWORD" --data-urlencode "admin_password_confirm=$TEST_PASSWORD" -o "$E/setup-post.html"
          F="$F" php <<'PHP'
          <?php
          require getenv('F').'/app/FunctionalWorkspaceCore.php';
          $db=vf_db();
          if(VF_VERSION!=='2.46.3') exit(1);
          if((string)$db->query("SELECT COALESCE(MAX(version),'') FROM schema_migrations WHERE status='success'")->fetchColumn()!=='2026090401') exit(2);
          $repo=new VfRepository($db);$surface=new VfSurfaceRepository($db);
          $cat=$repo->createCategory(['name'=>'V2464 Preserve','description'=>'candidate upgrade preserve','is_private'=>0,'sort_order'=>100]);
          $start=function(array $d)use($repo,$surface,$cat){$d['surface']='start';$d['category_id']=$cat;$r=$repo->saveLink(null,$d,'manual');$id=(int)$r['id'];$surface->upsertProfile($id,['surface'=>'start']);};
          $domain=function(string $s,array $d,array $p=[])use($repo,$surface){$d['surface']=$s;$r=$repo->saveLink(null,$d,'manual');$id=(int)$r['id'];$surface->upsertProfile($id,array_merge(['surface'=>$s],$p));};
          $start(['title'=>'Acceptance API Tool','url'=>'https://owner.example/api-tool','description'=>'开发工具 API 调试与建站','tags'=>['场景:做网站','开发工具','API','建站'],'is_private'=>0]);
          $start(['title'=>'Acceptance Desktop Editor','url'=>'https://owner.example/desktop-editor','description'=>'桌面代码编辑器客户端','tags'=>['软件:开发 / 编程','软件','代码编辑器','客户端'],'is_private'=>0]);
          $domain('channels',['title'=>'Acceptance Channel','url'=>'https://www.youtube.com/@v2464-owner','description'=>'频道保持','tags'=>['YouTube'],'is_private'=>0],['resource_kind'=>'youtube','background_friendly'=>1]);
          $domain('watch',['title'=>'Acceptance Movie','url'=>'https://owner.example/movie','description'=>'影视保持','tags'=>['电影'],'is_private'=>0],['resource_kind'=>'movie','media_year'=>2026,'media_status'=>'want']);
          $domain('topics',['title'=>'Acceptance Topic','url'=>'https://owner.example/topic','description'=>'专题保持','tags'=>['指南'],'is_private'=>0],['resource_kind'=>'guide','source_kind'=>'remote_url']);
          $domain('books',['title'=>'Acceptance Course','url'=>'https://owner.example/course','description'=>'课程保持','tags'=>['课程'],'is_private'=>0],['resource_kind'=>'course']);
          $domain('projects',['title'=>'Acceptance Project','url'=>'https://owner.example/project','description'=>'项目保持','tags'=>['项目'],'is_private'=>1],['resource_kind'=>'project','project_code'=>'P99','project_status'=>'active','project_sort_order'=>10]);
          $counts=VfWorkspaceViewCatalog::counts($surface->allAssets(true));
          foreach(['start','channels','watch','topics','courses','projects','tools','software'] as $k)if((int)($counts[$k]??0)<1)exit(3);
          if(strtolower((string)$db->query('PRAGMA integrity_check')->fetchColumn())!=='ok') exit(4);
          echo "P01_V2463_OWNER_CANONICAL_FIXTURE=PASS\n";
          PHP
          kill "$PID"; trap - EXIT
          php "$ASSETS/repair-v2.46.4.php" --verify-source="$F" | jq -e '.ok==true' >/dev/null
          echo "FIXTURE=$F" >> "$GITHUB_ENV"
          echo P01_V2463_EXACT_SOURCE_VERIFY=PASS

      - name: Rollback on injected apply failure
        shell: bash
        run: |
          set -Eeuo pipefail
          R=/tmp/p01-v2464-rollback; rm -rf "$R"; cp -a "$FIXTURE" "$R"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$ASSETS/repair-v2.46.4.php" --run="$R" >/tmp/v2464-rollback.out 2>/tmp/v2464-rollback.err
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$(cat "$R/VERSION.txt")" = '2.46.3'
          php "$ASSETS/repair-v2.46.4.php" --verify-source="$R" | jq -e '.ok==true' >/dev/null
          R="$R" php -r 'require getenv("R")."/app/FunctionalWorkspaceCore.php"; $d=vf_db(); if(VF_VERSION!=="2.46.3") exit(1); if((int)$d->query("SELECT COUNT(*) FROM links WHERE title LIKE \"Acceptance %\"")->fetchColumn()!==7) exit(2); if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok") exit(3); echo "P01_V2464_ROLLBACK_DATA=PASS\n";'
          echo P01_V2463_TO_V2464_ROLLBACK=PASS

      - name: Hard interruption recovery then upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          H=/tmp/p01-v2464-interrupt; rm -rf "$H"; cp -a "$FIXTURE" "$H"
          set +e
          VF_ATOMIC_TEST_HARD_EXIT_AFTER_APPLY=1 php "$ASSETS/repair-v2.46.4.php" --run="$H" >/tmp/v2464-hard.out 2>/tmp/v2464-hard.err
          RC=$?
          set -e
          test "$RC" = '97'
          php "$ASSETS/repair-v2.46.4.php" --run="$H" | tee /tmp/v2464-recovered.json | jq -e '.ok==true and .interrupted_recovered==true' >/dev/null
          H="$H" php -r 'require getenv("H")."/app/FunctionalWorkspaceCore.php"; $d=vf_db(); if(VF_VERSION!=="2.46.4") exit(1); if((int)$d->query("SELECT COUNT(*) FROM links WHERE title LIKE \"Acceptance %\"")->fetchColumn()!==7) exit(2); if((string)$d->query("SELECT COALESCE(MAX(version),\"\") FROM schema_migrations WHERE status=\"success\"")->fetchColumn()!=="2026090401") exit(3); if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok") exit(4); echo "P01_V2464_INTERRUPTION_RECOVERY_DATA=PASS\n";'
          echo P01_V2463_TO_V2464_INTERRUPTION_RECOVERY=PASS

      - name: Clean Atomic V2.46.3 to V2.46.4
        shell: bash
        run: |
          set -Eeuo pipefail
          U=/tmp/p01-v2464-upgraded; rm -rf "$U"; cp -a "$FIXTURE" "$U"
          php "$ASSETS/repair-v2.46.4.php" --run="$U" | tee /tmp/v2464-upgrade.json | jq -e '.ok==true and .already_current==false and .schema=="2026090401"' >/dev/null
          test "$(cat "$U/VERSION.txt")" = '2.46.4'
          grep -Fxq "define('VF_VERSION', '2.46.4');" "$U/app/bootstrap.php"
          U="$U" php -r 'require getenv("U")."/app/FunctionalWorkspaceCore.php"; $d=vf_db(); if(VF_VERSION!=="2.46.4") exit(1); if((int)$d->query("SELECT COUNT(*) FROM links WHERE title LIKE \"Acceptance %\"")->fetchColumn()!==7) exit(2); foreach(["Acceptance API Tool","Acceptance Desktop Editor","Acceptance Channel","Acceptance Movie","Acceptance Topic","Acceptance Course","Acceptance Project"] as $t){$s=$d->prepare("SELECT COUNT(*) FROM links WHERE title=?");$s->execute([$t]);if((int)$s->fetchColumn()!==1)exit(3);} if((string)$d->query("SELECT COALESCE(MAX(version),\"\") FROM schema_migrations WHERE status=\"success\"")->fetchColumn()!=="2026090401") exit(4); if(strtolower((string)$d->query("PRAGMA integrity_check")->fetchColumn())!=="ok") exit(5); echo "P01_V2464_CLEAN_UPGRADE_DATA=PASS\n";'
          php "$U/cli/verify.php" | grep -Fx VERIFY_PASS=YES
          php "$U/cli/surface-verify.php" | grep -Fx MULTI_SURFACE_PASS=YES
          echo "UPGRADED=$U" >> "$GITHUB_ENV"
          echo P01_V2463_TO_V2464_ATOMIC=PASS

      - name: Install Chromium for full browser regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Full browser regression on upgraded V2.46.4 fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          php -S 127.0.0.1:19704 -t "$UPGRADED" >"$EVIDENCE/browser-server.log" 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          ready=0; for i in $(seq 1 60); do if curl -fsS "$APP_URL/" >/dev/null; then ready=1; break; fi; sleep .25; done; test "$ready" -eq 1
          cat >"$RUNNER_TEMP/v2464-browser.mjs" <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const base=process.env.APP_URL, password=process.env.TEST_PASSWORD;
          const routes=[['home','/',''],['start','/start.php','Acceptance API Tool'],['channels','/channels.php','Acceptance Channel'],['watch','/watch.php','Acceptance Movie'],['topics','/topics.php','Acceptance Topic'],['courses','/courses.php','Acceptance Course'],['projects','/projects.php','Acceptance Project'],['tools','/tools.php','做网站'],['software','/software.php','开发 / 编程']];
          const nav=['home.php','start.php','channels.php','watch.php','topics.php','courses.php','projects.php','tools.php','software.php'];
          const vps=[['desktop',1440,1000],['tablet',900,1000],['mobile',390,844]];
          const touch=['.vf-icon-button','.vf-theme-toggle','.vf-context-action','.vf-workspace-button','.vf-secondary-button','.vf-mobile-category-close','.vf-subject-pagination a','.vf-project-action-row>a','.vf-project-action-row>button','.vf-topic-open','.vf-course-open','.vf-course-state-action','.vf-watch-coverage-button','.vf-watch-enrich-button','.vf-subject-chips a','.vf-course-chips a'].join(',');
          const browser=await chromium.launch({headless:true}); const ctx=await browser.newContext({reducedMotion:'reduce'});
          const auth=await ctx.newPage(); const authErrors=[],css=[];
          auth.on('pageerror',e=>authErrors.push('pageerror:'+e.message)); auth.on('console',m=>{if(m.type()==='error')authErrors.push('console:'+m.text())}); auth.on('response',r=>{if(r.url().includes('file=visual-system-final.css'))css.push({s:r.status(),t:r.headers()['content-type']||''})});
          await auth.goto(base+'/',{waitUntil:'domcontentloaded'}); await auth.locator('[data-vf-auth-login]').first().click(); const d=auth.locator('[data-vf-auth-dialog]'); await d.locator('input[name="password"]').fill(password); const navwait=auth.waitForNavigation({waitUntil:'networkidle'}); await d.locator('[data-vf-auth-submit]').click(); await navwait; await auth.locator('body.vf-functional-workspace').waitFor({state:'attached'});
          if(!css.some(x=>x.s===200&&String(x.t).toLowerCase().startsWith('text/css')))throw new Error('shared CSS runtime missing'); if(authErrors.length)throw new Error(authErrors.join(' | ')); await auth.close();
          const report=[];
          async function check(mode,route,vp,w,h,expected){const p=await ctx.newPage();await p.setViewportSize({width:w,height:h});const errors=[];p.on('pageerror',e=>errors.push('pageerror:'+e.message));p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});const r=await p.goto(base+route,{waitUntil:'domcontentloaded'});if(!r||r.status()>=400)throw new Error(`${vp}/${mode}: HTTP`);await p.waitForTimeout(180);if(await p.locator('body').getAttribute('data-vf-mode')!==mode)throw new Error(`${vp}/${mode}: identity`);const hrefs=await p.locator('a[href]').evaluateAll(ns=>ns.map(x=>{try{return new URL(x.href).pathname.split('/').filter(Boolean).pop()||''}catch{return ''}}));for(const f of nav)if(!hrefs.includes(f))throw new Error(`${vp}/${mode}: nav ${f}`);const ov=await p.evaluate(()=>({s:document.documentElement.scrollWidth,c:document.documentElement.clientWidth,b:document.body.scrollWidth}));if(ov.s>ov.c+2||ov.b>ov.c+2)throw new Error(`${vp}/${mode}: overflow`);let focused=false;for(let i=0;i<6;i++){await p.keyboard.press('Tab');const f=await p.evaluate(()=>{const e=document.activeElement;if(!e||e===document.body)return null;const s=getComputedStyle(e);return {o:s.outlineStyle,sh:s.boxShadow}});if(f){focused=true;if(f.o==='none'&&(!f.sh||f.sh==='none'))throw new Error(`${vp}/${mode}: focus`);break}}if(!focused)throw new Error(`${vp}/${mode}: no focus`);if(vp==='mobile'){const xs=await p.locator(touch).evaluateAll(ns=>ns.filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(x=>x.getBoundingClientRect().height));for(const h of xs)if(h<39.5)throw new Error(`${vp}/${mode}: touch ${h}`)}if(expected&&!(await p.locator('body').innerText()).includes(expected))throw new Error(`${vp}/${mode}: missing ${expected}`);if(errors.length)throw new Error(`${vp}/${mode}: ${errors.join(' | ')}`);report.push({vp,mode,status:r.status(),overflow:ov});await p.close()}
          for(const [vp,w,h] of vps)for(const [mode,route,expected] of routes)await check(mode,route,vp,w,h,expected);
          for(const [vp,w,h] of vps){await check('tools','/tools.php?q=Acceptance',vp,w,h,'Acceptance API Tool');await check('software','/software.php?q=Acceptance',vp,w,h,'Acceptance Desktop Editor')}
          fs.writeFileSync(process.env.EVIDENCE+'/browser-report.json',JSON.stringify(report,null,2)); await ctx.close(); await browser.close(); console.log('P01_V2464_FULL_BROWSER_REGRESSION=PASS');
          JS
          cd "$RUNNER_TEMP" && node v2464-browser.mjs
          kill "$PID"; trap - EXIT

      - name: Final candidate receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE"
          cat >"$EVIDENCE/P01_V2464_CANDIDATE_GATE.txt" <<EOF
          P01_V2464_CANDIDATE_GATE=PASS
          CANDIDATE_SHA=$CANDIDATE_SHA
          SOURCE_FORMAL_SHA=$FORMAL_BASE_SHA
          ACCEPTED_UXUI_RUNTIME_SHA=$ACCEPTED_UXUI_SHA
          VERSION=2.46.4
          SOURCE_VERSION=2.46.3
          SCHEMA=2026090401
          MIGRATION=NONE
          CUMULATIVE_R1_R8_SCOPE=PASS
          FROZEN_CONTRACTS=PASS
          DETERMINISTIC_TEST_ARTIFACT=PASS
          FRESH_INSTALL=PASS
          ATOMIC_2463_TO_2464=PASS
          ROLLBACK=PASS
          INTERRUPTION_RECOVERY=PASS
          CANONICAL_DATA_PRESERVATION=PASS
          SQLITE_INTEGRITY=PASS
          FULL_BROWSER_9X3_PLUS_DERIVED=PASS
          RELEASE_MUTATION=NO
          CORE_UPDATES_MUTATION=NO
          PRODUCTION_MUTATION=NO
          EOF
          cat "$EVIDENCE/P01_V2464_CANDIDATE_GATE.txt"

      - name: Upload candidate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2464-maintenance-candidate-gate-${{ github.run_id }}
          path: |
            evidence/v2464-candidate
            /tmp/v2464-selftest.json
            /tmp/v2464-upgrade.json
            /tmp/v2464-recovered.json
          if-no-files-found: warn
          retention-days: 14
