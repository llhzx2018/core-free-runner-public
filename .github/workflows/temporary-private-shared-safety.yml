name: TEMP Private Shared Security Review (delete by PR close)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-private-shared-safety.yml'

permissions:
  contents: read

jobs:
  private-synthetic-safety:
    if: >-
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.triggering_actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Exact SHA temporary private checkout, no credentials persisted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/core-free-runner-private
          ref: d3dde701f6c8494361ac6342bd6ec66096962480
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: transient-private-source
          fetch-depth: 1

      - name: Exact-source private synthetic negative and environment tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-private-source
          [[ "$(git rev-parse HEAD)" == d3dde701f6c8494361ac6342bd6ec66096962480 ]] || { echo BLOCKED_SOURCE_MISMATCH; exit 2; }
          [[ -z "$(git status --porcelain)" ]] || { echo BLOCKED_DIRTY_SOURCE; exit 2; }
          if python3 -m unittest discover -s tests -p test_shared_test_private.py >/dev/null 2>&1; then
            echo 'PRIVATE_ENV_ISOLATION_SYNTHETIC=PASS'
            echo 'PRIVATE_EXACT_SOURCE=d3dde701f6c8494361ac6342bd6ec66096962480'
          else
            echo 'PRIVATE_SYNTHETIC_REDACTED_FAIL'
            exit 1
          fi

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- transient-private-source
          echo 'PRIVATE_TRANSIENT_CLEANUP=ATTEMPTED'
