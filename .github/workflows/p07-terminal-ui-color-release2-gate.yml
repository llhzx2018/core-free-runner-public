name: P07 Terminal UI Color Release2 Exact-source Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-terminal-ui-color-release2-gate.yml'

permissions:
  contents: read

jobs:
  exact-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify registered private read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "P07_PRIVATE_READ=PASS"

      - name: Checkout exact private P07 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 5ac75819cbf5aef89e58a3b7cae40f34bcf40c56
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Verify exact source identity
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "5ac75819cbf5aef89e58a3b7cae40f34bcf40c56"
          test "$(cat VERSION)" = "0.1.0"
          test "$(cat BUILD_ID)" = "0.1.0-release2"
          echo "P07_EXACT_SOURCE=PASS"
          echo "P07_BUILD_ID=0.1.0-release2"

      - name: Bash syntax gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in \
            bin/vfops \
            bin/vfops-user \
            bin/vfops-site-ui \
            bin/vfops-migrate-ui \
            bin/vfops-auto-backup \
            bin/vfops-cloudpanel-ui \
            bin/vfops-storage-setup \
            lib/terminal_ui.sh \
            lib/cloudpanel_ui_common.sh \
            lib/cloudpanel_ui_sites.sh \
            lib/cloudpanel_ui_ops.sh \
            lib/cloudpanel_ui_admin.sh \
            tests/smoke.sh
          do
            bash -n "$file"
          done
          echo "P07_BASH_SYNTAX=PASS"

      - name: Python compile gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import py_compile
          for root in (Path("lib"), Path("tests"), Path("scripts")):
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  py_compile.compile(str(path), doraise=True)
          print("P07_PYTHON_COMPILE=PASS")
          PY

      - name: Terminal UI Color Contract gate
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest -v tests.test_terminal_ui_color_contract
          echo "P07_TTY_ANSI_HIERARCHY=PASS"
          echo "P07_NO_COLOR_PLAIN=PASS"
          echo "P07_NON_TTY_PLAIN=PASS"
          echo "P07_SEMANTIC_COLOR=PASS"
          echo "P07_UI_BLOAT_GUARD=PASS"

      - name: Slot3 product regressions
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/lib"
          bash tests/smoke.sh >/tmp/p07-smoke.log 2>&1
          echo "P07_SMOKE=PASS"

          modules="
          tests.test_app_config
          tests.test_auto_backup
          tests.test_backup
          tests.test_backup_frontend
          tests.test_cli_diagnostics
          tests.test_cli_menu
          tests.test_cli_transport
          tests.test_cloudpanel
          tests.test_cloudpanel_integration
          tests.test_cloudpanel_site
          tests.test_cloudpanel_ui_complete
          tests.test_cutover
          tests.test_diagnostics
          tests.test_first_verify_before_scheduler
          tests.test_google_device_oauth
          tests.test_inventory
          tests.test_menu3_modular
          tests.test_migrate
          tests.test_migrate_new
          tests.test_p07_integration_manifest
          tests.test_policy
          tests.test_restore
          tests.test_restore_apply
          tests.test_restore_as
          tests.test_restore_as_machine_e2e
          tests.test_restore_as_real_db_compat
          tests.test_restore_as_verified
          tests.test_restore_new
          tests.test_runtime
          tests.test_runtime_real_regressions
          tests.test_secret_scan
          tests.test_server_migration
          tests.test_site_lifecycle
          tests.test_storage
          tests.test_storage_onboarding_ux
          tests.test_storage_setup
          tests.test_terminal_ui_color_contract
          tests.test_transport
          tests.test_user_entry
          tests.test_user_remote_backup
          tests.test_ux
          tests.test_verify
          "
          fail=0
          for module in $modules; do
            log="/tmp/p07-$(printf '%s' "$module" | tr '.' '_').log"
            set +e
            timeout 240 python3 -m unittest -q "$module" >"$log" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              fail=1
              echo "P07_UNIT_FAIL_MODULE=$module"
              grep -E '^(FAIL|ERROR): ' "$log" | head -20 || true
              echo "P07_UNIT_FAIL_LOG_SHA256=$(sha256sum "$log" | awk '{print $1}')"
            fi
          done
          test "$fail" -eq 0

          sudo -E env PYTHONPATH="$PWD/lib" python3 -m unittest -q tests.test_auto_backup_run_now_ux >/tmp/p07-auto-backup-root.log 2>&1

          echo "P07_SLOT3_TESTS=PASS"
          echo "P07_MIGRATION_TESTS=PASS"
          echo "P07_BACKUP_RESTORE_TESTS=PASS"
          echo "P07_CLOUDPANEL_TESTS=PASS"

      - name: Machine-output and secret boundary
        working-directory: source
        shell: bash
        run: |
          set -Eeuo pipefail
          NO_COLOR=1 bash bin/vfops-user --version | grep -Fx 'VF Server Ops 0.1.0'
          NO_COLOR=1 bash bin/vfops-user --build-id | grep -Fx '0.1.0-release2'
          ! NO_COLOR=1 bash bin/vfops-user --version | grep -q $'\033'
          ! grep -Fq 'source "$ROOT_DIR/lib/terminal_ui.sh"' bin/vfops
          python3 scripts/secret_scan.py --root . >/tmp/p07-secret-scan.log 2>&1
          echo "P07_MACHINE_OUTPUT_PLAIN=PASS"
          echo "P07_SECRET_SCAN=PASS"

      - name: Public-safe result
        if: always()
        shell: bash
        run: |
          echo "P07_TERMINAL_UI_COLOR_RELEASE2_SOURCE=5ac75819cbf5aef89e58a3b7cae40f34bcf40c56"
          echo "P07_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P07_PRODUCTION_DESTRUCTIVE_ACTION=NOT_RUN"
