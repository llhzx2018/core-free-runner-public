name: P01 V2.36.4 Stage Candidate R2
on:
  push:
    branches: [release/p01-v2364-candidate-20260901]
    paths: [.github/workflows/p01-v2364-stage-candidate-r2-20260901.yml]
permissions:
  contents: read
jobs:
  stage-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/v2.36.4-formal-source-r2-20260901
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: candidate
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 0a48be7a99d19fe8485b14b87cc5236682d4e24d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: current
      - name: Build topology-clean V2.36.4 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = '718e043e3715ef7b21849bc08634fca89bf92c1f'
          test "$(git -C current rev-parse HEAD)" = '0a48be7a99d19fe8485b14b87cc5236682d4e24d'
          cp current/src/assets/workspace-domain-nav.css candidate/src/assets/workspace-domain-nav.css
          cd candidate
          python3 - <<'PY'
          from pathlib import Path
          import json
          Path('VERSION').write_text('2.36.4\n')
          Path('src/VERSION.txt').write_text('2.36.4\n')
          b=Path('src/app/bootstrap.php'); t=b.read_text(); t2=t.replace("define('VF_VERSION', '2.36.3');","define('VF_VERSION', '2.36.4');",1)
          if t2==t: raise SystemExit('VF_VERSION source drift')
          b.write_text(t2)
          c=Path('CHANGELOG.md'); old=c.read_text(); block='''## V2.36.4 · Patch Release Candidate · 2026-09-01\n\n- 修复 V2.36.3 匿名/登出状态资源 Grid 错位：管理员选择框不渲染时，不再保留管理员专用选择列。\n- 导航列表、导航卡片与频道卡片按匿名真实子节点重新定义 Grid；登录态继续保留原管理员选择列。\n- 390 / 1319 / 1440 匿名 → 登录 → 再退出浏览器回归 PASS；Start list/cards、Channels、Watch、Topics 无横向溢出。\n- 原始修复 PR #186 / develop merge `0a48be7a99d19fe8485b14b87cc5236682d4e24d`；Gate `33516302573` PASS / Artifact `9803754521`。\n- Formal Candidate R2 直接以 V2.36.3 Formal Source `718e043e3715ef7b21849bc08634fca89bf92c1f` 为父节点，只带匿名 Grid 修复与版本/候选元数据。\n- Schema 保持 `2026082901`，无 Migration；不修改 Owner Production。\n\n'''
          if not old.startswith('## V2.36.4 · Patch Release Candidate'): c.write_text(block+old)
          p=Path('VF_PROJECT.json'); d=json.loads(p.read_text()); cur=json.loads(Path('../current/VF_PROJECT.json').read_text())
          if d.get('schema_version')!='2026082901' or cur.get('production_version')!='2.36.3': raise SystemExit('authority drift')
          d['production_release']=cur['production_release']; d['published_release']=cur['published_release']
          d['status']='V2.36.3 OWNER PRODUCTION / PUBLISHED / V2.36.4 FORMAL CANDIDATE R2'
          d['production_version']='2.36.3'; d['working_version']='2.36.4'; d['target_release_version']='2.36.4'
          d['current_phase']='V2.36.4 FORMAL CANDIDATE R2 / READINESS PENDING'
          d['candidate_version']='2.36.4'; d['candidate_schema_version']='2026082901'; d['candidate_state']='FORMAL CANDIDATE R2 / READINESS PENDING'
          d['formal_release_state']='V2.36.3 PUBLISHED + OWNER INSTALLED / V2.36.4 NOT YET RELEASED'
          d['develop_state']='V2.36.4 ANONYMOUS GRID PATCH MERGED / FORMAL CANDIDATE R2 PREPARED'
          d['current_authority']='Owner Production V2.36.3 / Published Latest V2.36.3 / V2.36.4 topology-clean candidate R2 prepared'
          d['next_action']='Run V2.36.4 Candidate Readiness R2 on exact formal-parent candidate. No main/Tag/Release/core-updates/Owner Production write before gates pass.'
          d['current_change']={
            'change_id':'P01-V2364-ANONYMOUS-GRID-PATCH-20260901','type':'PATCH RELEASE / SHARED ANONYMOUS LAYOUT BUG',
            'formal_parent':'718e043e3715ef7b21849bc08634fca89bf92c1f','product_pr':186,'product_merge':'0a48be7a99d19fe8485b14b87cc5236682d4e24d',
            'scope':['src/assets/workspace-domain-nav.css'],'schema_change':False,'migration':None,'version_change':True,
            'browser_gate':33516302573,'browser_artifact':9803754521,'browser_artifact_sha256':'5f9867c50d8f6d4285ddb6ac28199d6006d6fe85030ce4a6fddf0216cc87abac',
            'main_write':False,'production_write':False,'runner_main_write':False}
          d['v2_36_4_release_candidate']={
            'formal_parent':'718e043e3715ef7b21849bc08634fca89bf92c1f','version':'2.36.4','production_version':'2.36.3',
            'published_predecessor_version':'2.36.3','predecessor_tag':'v2.36.3','predecessor_source':'718e043e3715ef7b21849bc08634fca89bf92c1f',
            'schema_version':'2026082901','schema_change':False,'migration':None,'scope':'PATCH / ANONYMOUS RESOURCE GRID ALIGNMENT',
            'product_pr':186,'product_merge':'0a48be7a99d19fe8485b14b87cc5236682d4e24d','browser_gate':33516302573,'browser_artifact':9803754521,
            'state':'FORMAL CANDIDATE R2 / READINESS PENDING','main_write':False,'core_updates_write':False,'owner_production_write':False}
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 -m json.tool VF_PROJECT.json >/dev/null
          php -l src/app/bootstrap.php
          git diff --check
          test "$(cat VERSION)" = 2.36.4
          test "$(cat src/VERSION.txt)" = 2.36.4
          grep -Fx "define('VF_VERSION', '2.36.4');" src/app/bootstrap.php >/dev/null
          grep -F '.vf-asset-row:not(:has(> .vf-asset-select))' src/assets/workspace-domain-nav.css >/dev/null
          grep -F '.vf-asset-card:not(:has(> .vf-asset-select))' src/assets/workspace-domain-nav.css >/dev/null
          test "$(git diff --name-only 718e043e3715ef7b21849bc08634fca89bf92c1f -- src | sort | tr '\n' ' ')" = 'src/VERSION.txt src/app/bootstrap.php src/assets/workspace-domain-nav.css '
          test "$(git rev-parse HEAD:database)" = "$(git rev-parse 718e043e3715ef7b21849bc08634fca89bf92c1f:database)"
          git config user.name VictorForge; git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION VF_PROJECT.json src/VERSION.txt src/app/bootstrap.php src/assets/workspace-domain-nav.css
          git commit -m 'release(P01): prepare V2.36.4 formal candidate R2'
          echo "CANDIDATE_R2=$(git rev-parse HEAD)"
          echo "TREE_R2=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE_R2=$(git rev-parse HEAD:src)"
          echo "PARENT_R2=$(git rev-parse HEAD^)"
          git push origin HEAD:release/v2.36.4-formal-source-r2-20260901
