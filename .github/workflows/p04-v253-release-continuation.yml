name: P04 V2.5.3 Release Continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p04-v253-release-continuation.yml'

permissions:
  contents: read

jobs:
  continue-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: 4037ef8533747b774716eae96a529f752c4dca16
      TAG: v2.5.3
      ASSET: VF_Infra_V2.5.3_UPDATE.zip
      EXPECTED_BYTES: '198577'
      EXPECTED_SHA256: e98c122e9e2e75c6c2668039488c3e656f1569dfaa46aa4b5bdbcc4f701112ec
    steps:
      - name: Require unified credentials
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"; test -n "$READ_TOKEN"
          echo 'UNIFIED_CREDENTIALS=PASS'

      - name: Exact-read immutable Tag and formal Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag_sha=$(gh api /repos/llhzx2018/vf-infra/git/ref/tags/$TAG --jq .object.sha)
          test "$tag_sha" = "$CANDIDATE"
          release=$(gh release view "$TAG" --repo llhzx2018/vf-infra --json tagName,isDraft,isPrerelease,publishedAt,targetCommitish,assets)
          test "$(printf '%s' "$release"|jq -r .tagName)" = "$TAG"
          test "$(printf '%s' "$release"|jq -r .isDraft)" = false
          test "$(printf '%s' "$release"|jq -r .isPrerelease)" = false
          published=$(printf '%s' "$release"|jq -r .publishedAt)
          test -n "$published"; test "$published" != null
          count=$(printf '%s' "$release"|jq -r --arg n "$ASSET" '[.assets[]|select(.name==$n)]|length')
          size=$(printf '%s' "$release"|jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' | head -1)
          test "$count" = 1; test "$size" = "$EXPECTED_BYTES"
          printf '%s' "$published" > "$RUNNER_TEMP/v253-released-at.txt"
          echo "TAG_TARGET=$tag_sha"
          echo "FORMAL_RELEASED_AT=$published"
          echo 'FORMAL_RELEASE_METADATA=PASS'

      - name: Download exact already-published Release asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/v253-remote"
          gh release download "$TAG" --repo llhzx2018/vf-infra --pattern "$ASSET" --dir "$RUNNER_TEMP/v253-remote"
          p="$RUNNER_TEMP/v253-remote/$ASSET"
          test -f "$p"
          bytes=$(stat -c%s "$p")
          sha=$(sha256sum "$p"|awk '{print $1}')
          test "$bytes" = "$EXPECTED_BYTES"
          test "$sha" = "$EXPECTED_SHA256"
          unzip -t "$p" >/dev/null
          test "$(unzip -Z1 "$p" | wc -l)" = 1
          test "$(unzip -Z1 "$p")" = repair-v2.5.3.php
          echo "REMOTE_ASSET_BYTES=$bytes"
          echo "REMOTE_ASSET_SHA256=$sha"
          echo 'REMOTE_RELEASE_ASSET_EXACT=PASS'

      - name: Publish exact core-updates P04 manifest
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/core-updates.git" core-updates
          cd core-updates
          git checkout -q main
          released_at=$(cat "$RUNNER_TEMP/v253-released-at.txt")
          mkdir -p projects
          python3 - "$released_at" > projects/P04.json <<'PY'
          import json,os,sys
          d={
            'schema_version':'1.0',
            'project_id':'P04',
            'component_id':'APP',
            'enabled':True,
            'target_version':'2.5.3',
            'update_type':'ATOMIC',
            'from_versions':['2.5.2'],
            'schema_from':'14',
            'schema_to':'14',
            'repository':'llhzx2018/vf-infra',
            'release_tag':'v2.5.3',
            'asset_name':'VF_Infra_V2.5.3_UPDATE.zip',
            'asset_bytes':int(os.environ['EXPECTED_BYTES']),
            'asset_sha256':os.environ['EXPECTED_SHA256'],
            'backup_required':True,
            'rollback_supported':True,
            'released_at':sys.argv[1],
            'minimum_php':'8.0.0',
            'notes':'P04 V2.5.3 hotfix: Settings unified update trust, Maintenance/Atomic CSP UI, runtime cache invalidation and release cleanup.'
          }
          print(json.dumps(d,ensure_ascii=False,indent=2)+"\n",end='')
          PY
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          if [[ -n "$(git status --porcelain -- projects/P04.json)" ]]; then
            git add projects/P04.json
            git commit -m 'release(P04): publish V2.5.3 hotfix manifest'
            git push -q origin main
          fi
          echo "CORE_UPDATES_P04_BLOB=$(git rev-parse HEAD:projects/P04.json)"
          echo 'CORE_UPDATES_P04_PUBLISH=PASS'

      - name: Remote manifest exact readback with write credential
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api /repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/p04-write-readback.json"
          python3 - "$RUNNER_TEMP/p04-write-readback.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['target_version']=='2.5.3'
          assert d['from_versions']==['2.5.2']
          assert d['release_tag']=='v2.5.3'
          assert d['asset_name']=='VF_Infra_V2.5.3_UPDATE.zip'
          assert d['asset_bytes']==int(os.environ['EXPECTED_BYTES'])
          assert d['asset_sha256']==os.environ['EXPECTED_SHA256']
          assert d['schema_from']=='14' and d['schema_to']=='14'
          assert d['backup_required'] is True and d['rollback_supported'] is True
          print('REMOTE_MANIFEST_EXACT=PASS')
          PY

      - name: Unified read token live discovery and asset identity
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh api /repos/llhzx2018/core-updates/contents/projects/P04.json?ref=main --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/p04-read-token.json"
          python3 - "$RUNNER_TEMP/p04-read-token.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['target_version']=='2.5.3' and d['from_versions']==['2.5.2']
          assert d['release_tag']=='v2.5.3' and d['asset_name']=='VF_Infra_V2.5.3_UPDATE.zip'
          assert d['asset_bytes']==int(os.environ['EXPECTED_BYTES']) and d['asset_sha256']==os.environ['EXPECTED_SHA256']
          PY
          rm -rf "$RUNNER_TEMP/v253-read-token"; mkdir -p "$RUNNER_TEMP/v253-read-token"
          gh release download "$TAG" --repo llhzx2018/vf-infra --pattern "$ASSET" --dir "$RUNNER_TEMP/v253-read-token"
          p="$RUNNER_TEMP/v253-read-token/$ASSET"
          test "$(stat -c%s "$p")" = "$EXPECTED_BYTES"
          test "$(sha256sum "$p"|awk '{print $1}')" = "$EXPECTED_SHA256"
          echo 'UNIFIED_READ_TOKEN_ONLINE_DISCOVERY=PASS'

      - name: Confirm Production main has not advanced
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          main=$(gh api /repos/llhzx2018/vf-infra/branches/main --jq .commit.sha)
          test "$main" = bc23fcaca79f20f91f058b5de164a4a42c73bae6
          echo "PRODUCTION_MAIN=$main"
          echo 'PRODUCTION_MAIN_NON_ADVANCEMENT=PASS'

      - name: Cleanup
        if: always()
        run: rm -rf core-updates "$RUNNER_TEMP/v253-remote" "$RUNNER_TEMP/v253-read-token" "$RUNNER_TEMP/v253-released-at.txt" "$RUNNER_TEMP/p04-write-readback.json" "$RUNNER_TEMP/p04-read-token.json"
