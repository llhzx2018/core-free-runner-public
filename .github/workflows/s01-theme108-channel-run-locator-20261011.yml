name: S01 Theme108 Channel Audit Run Locator
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Report public-safe channel audit run IDs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api "repos/${{ github.repository }}/actions/runs?branch=task%2Fs01-theme108-channel-audit-20261011&per_page=30" --jq '.workflow_runs[] | select(.event=="push") | select(.name=="S01 Theme108 exact channel and M3U879 preservation gate") | [.id,.status,.conclusion,.head_sha,.html_url] | @tsv'
