name: S01-C02 1087 System policy modal real interaction proof
on:
  push:
    branches: [test/s01-c02-1211087-policy-modal-20261010]
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 62fa985a50875b233df4b520c518bba1fbc3aadd
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP + JS syntax and exact source contract
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = 1.21.1087
          php -l includes/admin-v13/views/system_plugins.php
          node --check assets/js/v13/system/plugins.js
          node --check tests/s01-c02-1211087-system-policy-modal-browser-proof.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --only-shell
      - name: Browser 1440 1024 768 390 actual SaaS move / native policy form
        run: node tests/s01-c02-1211087-system-policy-modal-browser-proof.js
      - name: Previous system page one-page regressions
        run: |
          node tests/s01-c02-1211016-system-one-page-hierarchy-browser-proof.js
          node tests/s01-c02-1211015-system-one-page-browser-proof.js
