name: P08 R59 stable manifest release asset exact source gate (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p08-r59-release-gate-once.yml'
permissions:
  contents: read
jobs:
  exact-source-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout disposable public test workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact private VF AdOps PR22 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-adops
          ref: 1b38855bd8d48fe8e7ce66b9563557650198b552
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
          coverage: none
          extensions: zip, sodium, mbstring
      - name: Exact-source P08 manifest Release and hash gates
        run: |
          set -euo pipefail
          test "$(git -C private-p08 rev-parse HEAD)" = '1b38855bd8d48fe8e7ce66b9563557650198b552'
          cd private-p08
          php -l src/Upgrade/GitHubStableReleaseGate.php
          php -l tests/test_github_stable_release_gate.php
          php -l src/Upgrade/GitHubStableReleaseClient.php
          php -l tests/test_github_stable_release_client.php
          php tests/test_github_stable_release_gate.php
          php tests/test_github_stable_release_client.php
          bash scripts/dev_check.sh > "$RUNNER_TEMP/p08-r59-dev-check.log" 2>&1 || { tail -n 45 "$RUNNER_TEMP/p08-r59-dev-check.log"; exit 1; }
          grep -F 'R1_LOCAL_SOURCE_TESTS=PASS' "$RUNNER_TEMP/p08-r59-dev-check.log"
          echo P08_R59_EXACT_SOURCE_RELEASE_GATE=PASS
          echo P08_R59_OFFICIAL_VF_ADOPS_RELEASE=NOT_PUBLISHED
      - name: Always delete private workspace and temporary test output
        if: always()
        run: |
          rm -rf private-p08
          rm -f "$RUNNER_TEMP/p08-r59-dev-check.log"
          echo P08_R59_TEMP_SOURCE_CLEANUP=COMPLETE
