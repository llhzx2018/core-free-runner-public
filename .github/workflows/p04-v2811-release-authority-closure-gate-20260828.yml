name: P04 V2.8.11 Release Authority Closure Gate

on:
  push:
    paths:
      - '.github/workflows/p04-v2811-release-authority-closure-gate-20260828.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTHORITY_SOURCE: 3ad47c71272ffd2b6fa9329a0d14e94e5716c84d
      BASE_MAIN: d6f1e0660ba859d160bc3393cc281bcbe186c779
      BRANCH: governance/p04-v2811-release-authority-closure-20260828
      RELEASE_SOURCE: d6f1e0660ba859d160bc3393cc281bcbe186c779
      CORE_UPDATES_SOURCE: 01bde0e169b3a1bcd774acb7ccc0f56742f77050
      TAG: v2.8.11

    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact P04 authority source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.AUTHORITY_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Checkout exact distribution source
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_UPDATES_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates

      - name: Verify release authority closure
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$AUTHORITY_SOURCE"
          test "$(git -C product rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git -C product rev-parse origin/$BRANCH)" = "$AUTHORITY_SOURCE"
          test "$(git -C updates rev-parse HEAD)" = "$CORE_UPDATES_SOURCE"
          mapfile -t changed < <(git -C product diff --name-only "$BASE_MAIN" "$AUTHORITY_SOURCE")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'VF_PROJECT.json'
          test "$(git -C product show "$AUTHORITY_SOURCE:VERSION" | tr -d '\r\n')" = '2.8.11'

          python3 - <<'PY'
          import json
          p=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          assert p['project_id']=='P04' and p['version']=='2.8.11'
          assert p['status']=='V2.8.11 RELEASE CURRENT / V2.8.10 PRODUCTION'
          assert p['lifecycle']=='RELEASE_CURRENT_PRODUCTION_PENDING_OWNER_UPDATE'
          assert p['production_version']=='2.8.10' and p['schema']==14
          c=p['release_source_contract']
          assert c['candidate_source']=='cab41a436126ccfb050ba37642ffc7a7c87953e6'
          assert c['release_source']=='d6f1e0660ba859d160bc3393cc281bcbe186c779'
          assert c['release_product_tree']=='7adeb8045fa027b9bdc2a9956343dea516c27efe'
          assert c['runtime_resolver_change'] is False and c['provider_authority_change'] is False
          e=c['candidate_evidence']
          assert e['status']=='PASS'
          assert e['browser_r2_run']==33164230554 and e['browser_r2_job']==98825698054
          assert e['final_exact_source_run']==33164572288 and e['final_exact_source_job']==98826800175
          assert e['final_artifact_id']==9683043980
          r=p['release']
          assert r['current_release']=='2.8.11' and r['formal_gate']=='PASS' and r['published'] is True
          assert r['tag']=='v2.8.11' and r['release_id']==378421906
          assert r['release_source']=='d6f1e0660ba859d160bc3393cc281bcbe186c779'
          assert r['publication_run']==33164868097 and r['publication_job']==98827752721
          assert r['update_asset']['id']==533660511
          assert r['update_asset']['bytes']==1303637
          assert r['update_asset']['sha256']=='c5b11d1985039a4defb75835e809400e994b46801a38b01ee0439b89fc4317ab'
          assert r['core_updates']['status']=='PUBLISHED_VERIFIED'
          assert r['core_updates']['source']=='01bde0e169b3a1bcd774acb7ccc0f56742f77050'
          assert r['core_updates']['manifest_gate_run']==33165023532
          prod=p['production_truth']
          assert prod['installed_version']=='2.8.10' and prod['installed_schema']==14
          assert prod['available_release']=='2.8.11'
          assert prod['production_write']=='NO'
          assert p['next_action']=='OWNER_AUTHENTICATED_PRODUCTION_UPDATE_V2.8.10_TO_V2.8.11'

          u=json.load(open('updates/projects/P04.json',encoding='utf-8'))
          assert u['target_version']=='2.8.11' and u['from_versions']==['2.8.10']
          assert u['release_id']==r['release_id']
          assert u['release_product_commit']==r['release_source']
          assert u['asset_id']==r['update_asset']['id']
          assert u['asset_bytes']==r['update_asset']['bytes']
          assert u['asset_sha256']==r['update_asset']['sha256']
          PY

          RELEASE_JSON="$(gh api repos/llhzx2018/vf-infra/releases/tags/$TAG)"
          test "$(jq -r '.id' <<<"$RELEASE_JSON")" = '378421906'
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.id' <<<"$RELEASE_JSON")" = '533660511'
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.size' <<<"$RELEASE_JSON")" = '1303637'
          test "$(jq -r '.assets[]|select(.name=="VF_Infra_V2.8.11_UPDATE.zip")|.digest' <<<"$RELEASE_JSON")" = 'sha256:c5b11d1985039a4defb75835e809400e994b46801a38b01ee0439b89fc4317ab'
          test "$(gh api repos/llhzx2018/vf-infra/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"

          echo P04_V2811_RELEASE_AUTHORITY_CLOSURE_GATE=PASS
          echo AUTHORITY_SOURCE="$AUTHORITY_SOURCE"
          echo PRODUCTION_VERSION=2.8.10
          echo AVAILABLE_RELEASE=2.8.11
