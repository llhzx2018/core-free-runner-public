name: P01 v517 Laravel major from real v516 PHP bridge FULL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  laravel-major:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_VERSION: 2.47.517
      TARGET_SHA: 0fafc12ca165981b37a7daebc1bece2a5c53c44f
      BRIDGE_SHA: bdc1e068e4cabec2e9129d750b8f6ba159c74fd5
    steps:
      - name: Checkout public-safe one-off
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit registered ephemeral exact-source lane
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_HEAD_REF" = "test/p01-247516-php-bridge-atomic-20261115"
          python3 scripts/ephemeral_lane_spec.py validate --spec scripts/ephemeral/p01-v517-major.json >"$RUNNER_TEMP/p01-517-spec.txt"
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec scripts/ephemeral/p01-v517-major.json --input .github/workflows/p01-v517-major-oneoff.yml >"$RUNNER_TEMP/p01-517-audit.txt"
          grep -F '"status": "PASS"' "$RUNNER_TEMP/p01-517-audit.txt" >/dev/null
          echo P01_517_MAJOR_EXACT_SOURCE_ONEOFF_AUDIT=PASS
      - name: Checkout exact approved PHP bridge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: bdc1e068e4cabec2e9129d750b8f6ba159c74fd5
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: bridge-src
      - name: Checkout exact Laravel v517 development candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0fafc12ca165981b37a7daebc1bece2a5c53c44f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: laravel-src
      - name: Native PHP plus exact Git identities and negative tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C bridge-src rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(cat bridge-src/VERSION)" = "2.47.516"
          test "$(git -C laravel-src rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat laravel-src/VERSION)" = "2.47.517"
          test "$(cat laravel-src/src/VERSION.txt)" = "2.47.517"
          sudo apt-get update -qq >"$RUNNER_TEMP/p01-517-apt.txt" 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-cli php8.3-curl php8.3-zip php8.3-sqlite3 php8.3-mbstring php8.3-xml composer unzip >>"$RUNNER_TEMP/p01-517-apt.txt" 2>&1
          php8.3 -l laravel-src/src/app/next/runtime/MajorTrustedOwnerReleaseGate.php >/dev/null
          php8.3 -l laravel-src/src/app/next/runtime/MajorUnsignedReleaseStage.php >/dev/null
          php8.3 -l laravel-src/src/app/next/runtime/MajorSignedReleasePreflight.php >/dev/null
          php8.3 -l laravel-src/tests/compatibility/laravel/run_major_signed_real_full_contract.php >/dev/null
          python3 -B laravel-src/tests/architecture/test_p01_shared_helpers_manifest.py >"$RUNNER_TEMP/p01-517-inventory.txt" 2>&1
          php8.3 laravel-src/tests/compatibility/laravel/http/p01_major_official_origin_gate.php >"$RUNNER_TEMP/p01-517-origin.txt" 2>&1 || {
            grep -Eo '(P01_MAJOR_[A-Z0-9_]{5,100}|MAJOR_[A-Z0-9_]{5,100}|Fatal error|TypeError)' "$RUNNER_TEMP/p01-517-origin.txt" | sort -u | head -n 15 || true
            exit 1
          }
          php8.3 laravel-src/tests/compatibility/laravel/http/p01_major_github_asset_redirect.php >"$RUNNER_TEMP/p01-517-url.txt" 2>&1
          grep -Fx P01_MAJOR_GITHUB_TOKEN_NEVER_FOLLOWS_AUTO_REDIRECT=PASS "$RUNNER_TEMP/p01-517-url.txt"
          echo P01_517_MAJOR_PHP83_AND_NEGATIVE_GATES=PASS
      - name: Official immutable v515 FULL plus UPDATE bytes for PHP bridge baseline
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$RUNNER_TEMP/p01-517-old"
          mkdir -p "$base/full" "$base/repair"
          gh release download v2.47.515 -R llhzx2018/vf-start -D "$base" -p 'VF-Start-V2.47.515-FULL.zip' -p 'VF_Start_V2.47.515_UPDATE.zip' >"$RUNNER_TEMP/p01-517-download.txt" 2>&1
          test "$(sha256sum "$base/VF-Start-V2.47.515-FULL.zip" | cut -d' ' -f1)" = "5ee0c031dda82c53353929dc4519b0cc1b647b2af82a1bcd8a27a03ab7866778"
          test "$(sha256sum "$base/VF_Start_V2.47.515_UPDATE.zip" | cut -d' ' -f1)" = "3a5e6528e8ef1204ef1fc4f6d4568aad0634dced649200f5744df5cb9c082556"
          unzip -q "$base/VF-Start-V2.47.515-FULL.zip" -d "$base/full"
          unzip -q "$base/VF_Start_V2.47.515_UPDATE.zip" -d "$base/repair"
          echo P01_517_MIGRATION_SOURCE_BRIDGE_FROM_REAL_515=PASS
      - name: Build PHP bridge v516 FULL from strict old official ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B bridge-src/scripts/build_p01_247516_legacy_atomic.py --candidate bridge-src/src --baseline-full-dir "$RUNNER_TEMP/p01-517-old/full" --baseline-repair "$RUNNER_TEMP/p01-517-old/repair/repair-v2.47.515.php" --runner-atomic-engine scripts/p01-build-release-v2.py --target-sha "$BRIDGE_SHA" --output-dir "$RUNNER_TEMP/p01-517-bridge" >"$RUNNER_TEMP/p01-517-bridge-build.txt" 2>&1 || {
            grep -Eo '(P01_247516_BRIDGE_[A-Z0-9_]{4,90}|BridgeError)' "$RUNNER_TEMP/p01-517-bridge-build.txt" | sort -u | head -n 9 || true
            exit 1
          }
          test -f "$RUNNER_TEMP/p01-517-bridge/VF-Start-V2.47.516-FULL-DEV-ONLY.zip"
          echo P01_517_REAL_OLD_LEDGER_PHP_BRIDGE_FULL_READY=PASS
      - name: Build true Composer/Vite Laravel 517 Clean and CloudPanel FULL
        shell: bash
        run: |
          set -Eeuo pipefail
          cd laravel-src
          python3 scripts/build_p01_next_clean_full.py build --source-sha "$TARGET_SHA" --output "$RUNNER_TEMP/p01-517-clean.zip" --composer composer >"$RUNNER_TEMP/p01-517-build.txt" 2>&1 || {
            grep -Eo '(BuildError|Error:|ERROR|AssertionError)' "$RUNNER_TEMP/p01-517-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          python3 scripts/build_p01_next_clean_full.py verify --zip "$RUNNER_TEMP/p01-517-clean.zip" >>"$RUNNER_TEMP/p01-517-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py build --source-zip "$RUNNER_TEMP/p01-517-clean.zip" --output "$RUNNER_TEMP/p01-517-cloudpanel.zip" >>"$RUNNER_TEMP/p01-517-build.txt" 2>&1
          python3 scripts/build_p01_next_cloudpanel_full.py verify --zip "$RUNNER_TEMP/p01-517-cloudpanel.zip" >>"$RUNNER_TEMP/p01-517-build.txt" 2>&1
          echo P01_517_REAL_COMPOSER_VITE_CLOUDPANEL_FULL=PASS
      - name: Verify developer MAJOR outer and nested FULL from actual paired programs
        shell: bash
        run: |
          set -Eeuo pipefail
          cd laravel-src
          python3 scripts/build_p01_next_major_migration_candidate.py build --bridge-v516-full "$RUNNER_TEMP/p01-517-bridge/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" --laravel-v517-full "$RUNNER_TEMP/p01-517-cloudpanel.zip" --output "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" >"$RUNNER_TEMP/p01-517-major-build.txt" 2>&1 || {
            grep -Eo '(BuildError|Error:|ERROR|Traceback)' "$RUNNER_TEMP/p01-517-major-build.txt" | sort -u | head -n 12 || true
            exit 1
          }
          python3 scripts/build_p01_next_major_migration_candidate.py verify --zip "$RUNNER_TEMP/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip" >>"$RUNNER_TEMP/p01-517-major-build.txt" 2>&1
          echo P01_517_TWO_SOURCE_REAL_FULL_DEV_MAJOR_ENVELOPE=PASS
          P01_MAJOR_REAL_FULL_ISOLATED_TEST=YES php8.3 tests/compatibility/laravel/run_major_signed_real_full_contract.php --developer-full "$RUNNER_TEMP/p01-517-cloudpanel.zip" --bridge-full "$RUNNER_TEMP/p01-517-bridge/VF-Start-V2.47.516-FULL-DEV-ONLY.zip" >"$RUNNER_TEMP/p01-517-major-test.txt" 2>&1 || {
            grep -Eo '(MAJOR_[A-Z0-9_]{5,90}|P01_MAJOR_[A-Z0-9_]{5,90}|Fatal error|TypeError)' "$RUNNER_TEMP/p01-517-major-test.txt" | sort -u | head -n 15 || true
            exit 1
          }
          grep -Fx P01_MAJOR_BRIDGE_V516_TO_LARAVEL_V517_REAL_BUNDLES=PASS "$RUNNER_TEMP/p01-517-major-test.txt"
          grep -Fx P01_MAJOR_GITHUB_RELEASE_SHA256_NEGATIVE_MATRIX=PASS "$RUNNER_TEMP/p01-517-major-test.txt"
          grep -Fx P01_MAJOR_REAL_CLOUDPANEL_FULL_SYNTHETIC_SIGNED_CONSUMER=PASS "$RUNNER_TEMP/p01-517-major-test.txt"
          echo P01_517_FULL_DEV_MAJOR_AND_FAKE_RELEASE_NEGATIVES=PASS
      - name: Private source and ZIP cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- bridge-src laravel-src "$RUNNER_TEMP/p01-517-old" "$RUNNER_TEMP/p01-517-bridge"
          rm -f -- "$RUNNER_TEMP"/p01-517-*.txt "$RUNNER_TEMP"/p01-517-*.zip "$RUNNER_TEMP"/VF_Start_V2.47.516_to_V2.47.517_MAJOR_DEV_ONLY.zip
          echo P01_517_PRIVATE_SOURCE_ZIP_PERSISTENCE=NONE
