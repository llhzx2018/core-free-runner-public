name: TEMP P07 M05 UX15 exact ownertrial dev and rollback proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-m05-ux15-ownertrial-dev-proof-20261125.yml
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-m05-ux15-ownertrial-dev-proof-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: 'b6b7f1b631f18367898540404961fd72d39b327a'
      HEAD_SHA: 'fe41e16bd2e4953d8b202ebf3a38d5b489070c52'
      GOV_SHA: '74db859d21b0f93c7c2230d13eae9de8f0fd576a'
      UX14_SHA: '8cca47f0a7bfed619daefe3074697f3837fc92c50103d218a12ca9149cd9d11d'
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Exact private P07 candidate ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fe41e16bd2e4953d8b202ebf3a38d5b489070c52
          path: transient-p07
          fetch-depth: 0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Exact GOV rule ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/gov-doc
          ref: 74db859d21b0f93c7c2230d13eae9de8f0fd576a
          path: transient-gov
          token: __TOKEN__
          persist-credentials: false
      - name: Actual Git SHA and authority architecture and Terminal UX
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C transient-p07 rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C transient-gov rev-parse HEAD)" = "$GOV_SHA"
          test "$(git -C transient-p07 merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          cd transient-p07
          python3 -B .github/checks/architecture_gate.py \
            --manifest .github/checks/code_architecture.json \
            --gov-root ../transient-gov --git-root . \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          python3 -B scripts/check_p07_terminal_ux.py \
            --module P07-M05 --base-ref "$BASE_SHA"
          echo P07_M05_UX15_GIT_ARCH_UX=PASS
      - name: New diagnosis and all adjacent M05 security module tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          total=0
          for suite in \
            test_p07_m05_owner_trial_diagnosis.py \
            test_p07_m05_trial_cache_guard.py \
            test_p07_m05_dirty_host_guard.py \
            test_p07_m05_installed_root_guard.py \
            test_p07_m05_isolated_module.py \
            test_p07_m05_host_write_gate.py \
            test_p07_m05_db_engine_boundary.py \
            test_p07_m05_first_install_order.py; do
            log="$RUNNER_TEMP/$suite.log"
            if ! python3 -B -m unittest discover -s tests -p "$suite" -q >"$log" 2>&1; then
              echo "P07_M05_UX15_TEST=FAIL:$suite"
              grep -E '^(FAIL|ERROR): test_[A-Za-z0-9_]+ ' "$log" | head -15 || true
              grep -E '^AssertionError:|^SyntaxError:|^ModuleNotFoundError:|^  File ' "$log" | tail -12 || true
              exit 13
            fi
            n="$(grep -E '^Ran [0-9]+ tests?' "$log" | tail -1 | awk '{print $2}')"
            test -n "$n"
            total=$((total+n))
            echo "P07_M05_UX15_TEST=PASS:$suite:$n"
          done
          echo "P07_M05_UX15_TOTAL_TESTS=$total"
      - name: Double-build deterministic standalone UX15 with diagnosis helper
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          cd transient-p07
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/ux15-a.zip" >"$RUNNER_TEMP/ux15.json"
          python3 -B scripts/build_p07_m05_bundle.py --output "$RUNNER_TEMP/ux15-b.zip" >/dev/null
          cmp -s "$RUNNER_TEMP/ux15-a.zip" "$RUNNER_TEMP/ux15-b.zip"
          python3 -B - <<'PY'
          import os,pathlib,json,zipfile
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(p/"ux15-a.zip") as z:
              names=z.namelist()
              assert z.testzip() is None
              assert "p07-m05/lib/m05_owner_trial_diagnosis.py" in names
              assert z.read("p07-m05/BUILD_ID")==b"0.1.0-m05-ux15-ownertrial-diagnosis\n"
              assert all("/__pycache__/" not in x and not x.endswith(".pyc") for x in names)
          receipt=json.loads((p/"ux15.json").read_text())
          assert receipt["formal_release"] is False
          assert receipt["production_install"] is False
          print("P07_M05_UX15_DETERMINISTIC_ZIP=PASS")
          print("P07_M05_UX15_ZIP_SHA="+receipt["sha256"])
          PY
      - name: Real issued UX14 to unissued UX15 Atomic and rollback in disposable /tmp
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 2 --max-time 100 \
            'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m05-v0.1.0-ux14-verified-pycache-20261125/P07-M05-0.1.0-m05-ux14-verified-pycache.zip' \
            -o "$RUNNER_TEMP/ux14-official.zip"
          printf '%s  %s\n' "$UX14_SHA" "$RUNNER_TEMP/ux14-official.zip" | sha256sum -c - >/dev/null
          python3 -B - <<'PY'
          import hashlib,os,pathlib,sys,tempfile
          src=pathlib.Path("transient-p07").resolve()
          sys.path.insert(0,str(src/"scripts"))
          import install_p07_m05_bundle as inst
          os.environ["P07_M05_DISPOSABLE_TEST"]="1"
          tmp=pathlib.Path(os.environ["RUNNER_TEMP"])
          old=tmp/"ux14-official.zip"
          new=tmp/"ux15-a.zip"
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert sha(old)==os.environ["UX14_SHA"]
          with tempfile.TemporaryDirectory(dir=tmp,prefix="p07-ux15-") as td:
              root=pathlib.Path(td)/"modules"
              root.mkdir()
              marker={}
              for mod in ("m01","m02","m03","m04"):
                  p=root/mod/"identity"
                  p.parent.mkdir()
                  p.write_bytes(mod.encode())
                  marker[mod]=p.read_bytes()
              a=inst.install(old,sha(old),root,test_mode=True)
              assert a["installed_build"]=="0.1.0-m05-ux14-verified-pycache"
              b=inst.install(new,sha(new),root,test_mode=True)
              assert b["installed_build"]=="0.1.0-m05-ux15-ownertrial-diagnosis"
              active=root/"m05/current"
              assert active.resolve().joinpath("BUILD_ID").read_text().strip()==b["installed_build"]
              assert inst.install(new,sha(new),root,test_mode=True)["already_current"]
              try:
                  inst.install(new,"0"*64,root,test_mode=True)
                  raise AssertionError("bad ZIP hash passed")
              except inst.IsolatedInstallError:
                  pass
              assert active.resolve().joinpath("BUILD_ID").read_text().strip()==b["installed_build"]
              restored=inst.rollback(a["installed_build"],root,test_mode=True)
              assert restored["restored_build"]==a["installed_build"]
              assert active.resolve().joinpath("BUILD_ID").read_text().strip()==a["installed_build"]
              for mod,payload in marker.items():
                  assert (root/mod/"identity").read_bytes()==payload
              print("P07_M05_UX14_TO_UX15_REAL_ATOMIC_ROLLBACK=PASS")
              print("P07_M05_M01_M04_UNCHANGED=PASS")
          PY
      - name: Clean ephemeral private bytes and source
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/transient-gov"
          rm -f -- "$RUNNER_TEMP"/ux15-*.zip "$RUNNER_TEMP"/ux15.json \
            "$RUNNER_TEMP"/ux14-official.zip "$RUNNER_TEMP"/test_p07_m05_*.py.log
          test ! -e "$GITHUB_WORKSPACE/transient-p07"
          test ! -e "$GITHUB_WORKSPACE/transient-gov"
          echo P07_M05_UX15_EPHEMERAL_PRIVATE_CLEANUP=PASS
