name: P01 Software Legacy Profile Recovery D57 Exact Source
on:
  push:
    branches:
      - test/p01-software-recovery-20261113-d57

permissions:
  contents: read

jobs:
  software-recovery:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Confirm temporary public-safe private checkout authority
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-software-recovery-20261113-d57"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=D57_SOFTWARE_MULTI_PROFILE_BROWSER_LOCAL_RECOVERY"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Private exact-source checkout in ephemeral job workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: bef40901769354bf8a81ff8fd68e3883fbe8ec9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate identity and independent modules
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "bef40901769354bf8a81ff8fd68e3883fbe8ec9a"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          test -f candidate/src/app/next/frontend/src/software-profiles.ts
          test -f candidate/src/app/next/frontend/src/OwnerSoftwareManage.vue
          test -f candidate/tests/p01_d57_software_plan.php
          echo "P01_D57_EXACT_SOURCE=bef40901769354bf8a81ff8fd68e3883fbe8ec9a"
      - name: PHP lint and isolated Composer/Laravel SQLite
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php -r 'exit(extension_loaded("pdo_sqlite")&&extension_loaded("mbstring") ? 0 : 1);'; then
            sudo apt-get update -qq > "$RUNNER_TEMP/p01-apt.txt" 2>&1
            sudo apt-get install -y php8.3-sqlite3 php8.3-mbstring >> "$RUNNER_TEMP/p01-apt.txt" 2>&1
          fi
          for f in candidate/src/app/next/OwnerPersonalCatalog.php candidate/src/app/next/http/OwnerHttpRoutes.php candidate/tests/p01_d57_software_plan.php; do
            php -l "$f" > "$RUNNER_TEMP/p01-lint.txt" 2>&1
          done
          cd candidate/src/app/next
          composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist > "$RUNNER_TEMP/p01-composer.txt" 2>&1
          echo "P01_D57_PHP_LARAVEL_READY=PASS"
      - name: Actual Laravel SQLite software resolve and earlier home/tool regression
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! php candidate/tests/p01_d57_software_plan.php > "$RUNNER_TEMP/p01-new.txt" 2>&1; then
            echo "P01_D57_SQLITE=FAIL"
            grep -E 'P01 D57 FAIL|P01 D57 UNSAFE|Fatal error|Uncaught|Exception|Error' "$RUNNER_TEMP/p01-new.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 19 || true
            exit 1
          fi
          grep '^P01_D57_.*=PASS$' "$RUNNER_TEMP/p01-new.txt"
          echo "P01_D57_SQLITE=PASS"
          if ! php candidate/tests/p01_d52_personal_catalog.php > "$RUNNER_TEMP/p01-old.txt" 2>&1; then
            echo "P01_D52_OWNED_CATALOG_REGRESSION=FAIL"
            grep -E 'D52 check failed|D52 unsafe|Fatal error|Uncaught|Exception|Error' "$RUNNER_TEMP/p01-old.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 18 || true
            exit 1
          fi
          echo "P01_D52_OWNED_CATALOG_REGRESSION=PASS"
      - name: Typecheck full Vue Vitest and production Vite compile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D57_VUE_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|software-profiles|OwnerSoftware|OwnerPersonal' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 34 || true
            exit 1
          fi
          echo "P01_D57_VUE_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D57_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError|Expected' "$RUNNER_TEMP/p01-unit.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 34 || true
            exit 1
          fi
          echo "P01_D57_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D57_VITE_PRODUCTION_BUILD=PASS"
      - name: Full 390 768 1440 Chromium and legacy interactions
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D57_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 40 || true
            exit 1
          fi
          echo "P01_D57_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always wipe ephemeral private checkout and test logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_PUBLIC_ARTIFACTS=NONE"

  software-browser-diagnostics:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Verify exact-source synthetic-only diagnosis
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-software-recovery-20261113-d57"
          test -n "$PRIVATE_READ"
          echo "P01_D57_BROWSER_FAILURE_CLASSIFICATION=FOCUSED_SYNTHETIC_ONLY"
      - name: Private exact bef40901769354bf8a81ff8fd68e3883fbe8ec9a checkout transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: bef40901769354bf8a81ff8fd68e3883fbe8ec9a
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Install locked Playwright and diagnose only D57 synthetic fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "bef40901769354bf8a81ff8fd68e3883fbe8ec9a"
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npx playwright test tests/software-recovery.spec.ts > "$RUNNER_TEMP/p01-synthetic.txt" 2>&1; then
            echo "P01_D57_SYNTHETIC_BROWSER=FAIL"
            grep -E 'tests/software-recovery.spec.ts:[0-9]+|Locator:|Expected:|Received:|toBeVisible|toBeDisabled|element\\(s\\) not found|waiting for|timeout|failed|passed|Call log' "$RUNNER_TEMP/p01-synthetic.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 100 || true
            exit 1
          fi
          echo "P01_D57_SYNTHETIC_BROWSER=PASS"
      - name: Remove private checkout and logs without artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PUBLIC_PRIVATE_ARTIFACTS=NONE"

  software-final-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate final registered synthetic browser proof
        shell: bash
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "llhzx2018/core-free-runner-public"
          test "$GITHUB_REF_NAME" = "test/p01-software-recovery-20261113-d57"
          test -n "$PRIVATE_READ"
          echo "P01_SCOPE=D57_FINAL_SOFTWARE_PROFILES_AND_LEGACY_VIEW"
          echo "P01_PRODUCTION=UNTOUCHED"
      - name: Private exact final source transient checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: b628c26ea1360227b55bd327b84051ce9c6afe8e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Verify final candidate identity, typecheck, unit and build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "b628c26ea1360227b55bd327b84051ce9c6afe8e"
          test "$(cat candidate/VERSION)" = "2.47.516"
          test "$(cat candidate/src/VERSION.txt)" = "2.47.516"
          cd candidate/src/app/next/frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p01-npm.txt" 2>&1
          if ! npm run typecheck > "$RUNNER_TEMP/p01-type.txt" 2>&1; then
            echo "P01_D57_FINAL_TYPECHECK=FAIL"
            grep -E 'error TS[0-9]+|software-profiles|OwnerSoftware|OwnerPersonal' "$RUNNER_TEMP/p01-type.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 28 || true
            exit 1
          fi
          echo "P01_D57_FINAL_TYPECHECK=PASS"
          if ! npm run test:unit > "$RUNNER_TEMP/p01-unit.txt" 2>&1; then
            echo "P01_D57_FINAL_VITEST=FAIL"
            grep -E ' FAIL |Test Files|Tests |AssertionError' "$RUNNER_TEMP/p01-unit.txt" | tail -n 22 || true
            exit 1
          fi
          echo "P01_D57_FINAL_VITEST=PASS"
          npm run build > "$RUNNER_TEMP/p01-build.txt" 2>&1
          test -f ../public/build/.vite/manifest.json
          echo "P01_D57_FINAL_VITE_BUILD=PASS"
      - name: Full Chromium E2E and safe reload/restore 390 768 1440
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate/src/app/next/frontend
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/p01-chromium.txt" 2>&1
          if ! npm run test:e2e > "$RUNNER_TEMP/p01-e2e.txt" 2>&1; then
            echo "P01_D57_FINAL_BROWSER=FAIL"
            grep -E '^  [0-9]+\)|Error:|Locator:|Expected:|Received:|software-recovery.spec.ts:[0-9]+|failed|passed' "$RUNNER_TEMP/p01-e2e.txt" | sed -E 's#/(home|tmp|mnt)/[^ :]+#<PRIVATE_PATH>#g' | tail -n 50 || true
            exit 1
          fi
          echo "P01_D57_FINAL_FULL_CHROMIUM_390_768_1440=PASS"
      - name: Always discard private checkout and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf -- candidate
          rm -f -- "$RUNNER_TEMP"/p01-*.txt
          echo "P01_PRIVATE_SOURCE_PERSISTED=NO"
          echo "P01_PRIVATE_PUBLIC_ARTIFACTS=NONE"
