name: S01 Page Body V1 A6 Candidate Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-page-body-v1-a6-gate-20260926.yml'

permissions:
  contents: read

jobs:
  gate:
    if: github.head_ref == 'task/s01-page-body-v1-a6-gate-20260926'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPS_SHA: 7e629d10021382addd3d0a0df749d65ab93c6de0
      THEME_SHA: aad8e9d6c082d9edc12a3a3f9ac8fb157102c7c7
      M3U8_SHA: 3c6ad9d0d8512617d0a41b7e1584056bef4b8043
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: test -n "$READ_TOKEN"

      - name: Checkout exact OPS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.OPS_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: ops

      - name: Checkout exact Theme
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme

      - name: Checkout exact M3U8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8

      - name: OPS A1-A6 contracts
        working-directory: ops
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$OPS_SHA"
          php -l includes/admin-v13/views/seo_technical.php
          php -l includes/admin-v13/views/seo_reviews.php
          php -l includes/admin-v13/views/acceptance_overview.php
          php -l includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          for f in             tests/s01-c02-page-body-system-v1-a1-baseline-contract.php             tests/s01-c02-page-body-system-v1-a2-baseline-contract.php             tests/s01-c02-page-body-system-v1-a3-contract.php             tests/s01-c02-page-body-system-v1-a4-contract.php             tests/s01-c02-page-body-system-v1-a5-baseline-contract.php             tests/s01-c02-page-body-system-v1-a6-contract.php; do
            php -l "$f"
            php "$f"
          done
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-ops-s01-shell' assets/css/current/admin-s01-page-body-system-v1.css

      - name: Theme A1-A6 contracts
        working-directory: theme
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$THEME_SHA"
          php -l src/inc/admin/views/preview.php
          for f in             tests/s01-c01-page-body-system-v1-a1-contract.php             tests/s01-c01-page-body-system-v1-a2-contract.php             tests/s01-c01-page-body-system-v1-a5-contract.php             tests/s01-c01-page-body-system-v1-a6-contract.php; do
            php -l "$f"
            php "$f"
          done
          php tests/s01-c01-page-visual-closure-r5-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-theme-maintenance-menu|\.vf-theme-admin-header' src/assets/css/admin/admin-s01-page-body-system-v1.css

      - name: M3U8 A1-A6 contracts
        working-directory: m3u8
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$M3U8_SHA"
          php -l src/admin/Controller/class-v6-provider-operations-controller.php
          for f in             tests/s01-c03-page-body-system-v1-a1-contract.php             tests/s01-c03-page-body-system-v1-a2-contract.php             tests/s01-c03-page-body-system-v1-a3-contract.php             tests/s01-c03-page-body-system-v1-a4-contract.php             tests/s01-c03-page-body-system-v1-a5-contract.php             tests/s01-c03-page-body-system-v1-a6-contract.php; do
            php -l "$f"
            php "$f"
          done
          php tests/s01-c03-page-visual-closure-r5-contract.php
          ! grep -Eq '\.vf-v6-shell-header|\.vf-v6-domain-nav|\.vf-v6-domain-menu|\.vf-m3u8-console-head|\.vf-m3u8-primary-nav' src/admin/ui-v4/admin-s01-page-body-system-v1.css

      - name: CSS balance
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('ops/assets/css/current/admin-s01-page-body-system-v1.css'),
              Path('theme/src/assets/css/admin/admin-s01-page-body-system-v1.css'),
              Path('m3u8/src/admin/ui-v4/admin-s01-page-body-system-v1.css'),
          ]:
              c=path.read_text()
              assert c.count('{')==c.count('}'), path
          print('PASS_CSS_BALANCE')
          PY
