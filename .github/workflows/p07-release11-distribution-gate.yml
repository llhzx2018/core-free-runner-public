name: P07 Release11 Distribution Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'installers/p07.sh'
      - 'installers/p07-final.sh'
      - 'installers/p07-toolbox.sh'
      - 'dist/p07/0.1.0/overlay/**'
      - '.github/workflows/p07-release11-distribution-gate.yml'

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Release11 identity
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release11'
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-release11"' installers/p07-final.sh
          grep -Fq 'VF_SERVER_OPS_BUILD_EXPECTED="0.1.0-release11"' installers/p07-toolbox.sh
          grep -Fq 'RUNTIME_MANIFEST_BLOB="6cdba91349d0f4659f06ddb89b5a30d86273ef38"' installers/p07-final.sh
          grep -Fq 'EXPECTED_BLOB="54680a674367dfb32a434c267bb5f19eedee0af7"' installers/p07.sh

      - name: Exact runtime manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('dist/p07/0.1.0/overlay')
          for line in (root/'RUNTIME.gitblob').read_text().splitlines():
              if not line.strip():
                  continue
              expected, rel=line.split('  ',1)
              path=root/rel
              assert path.is_file(), rel
              data=path.read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==expected, (rel,actual,expected)
          PY

      - name: Menu 3 information architecture
        run: |
          set -Eeuo pipefail
          f='dist/p07/0.1.0/overlay/bin/vfops-user'
          grep -Fq 'P07 · 网站与数据' "$f"
          grep -Fq '1. 网站与服务器概况' "$f"
          grep -Fq '2. 备份与恢复' "$f"
          grep -Fq '3. 服务器迁移' "$f"
          grep -Fq '4. 网站管理' "$f"
          grep -Fq '5. 面板管理（CloudPanel）' "$f"
          grep -Fq '立即备份一个网站' "$f"
          grep -Fq '从备份恢复网站' "$f"
          ! grep -Fq '11. 新服务器初始化' "$f"

      - name: Recovery and self-check contract
        run: |
          set -Eeuo pipefail
          root='dist/p07/0.1.0/overlay'
          grep -Fq 'backup package contains external symlink' "$root/lib/package_core.py"
          grep -Fq 'copy_private_follow(root, source, target)' "$root/lib/package_core.py"
          grep -Fq '备份文件完整性复检失败，P07 已停止恢复' "$root/bin/vfops-site-ui"
          grep -Fq '重新安装 P07 运行文件' "$root/bin/vfops-selfcheck-ui"
          grep -Fq "ui_confirm_exact '修复'" "$root/bin/vfops-selfcheck-ui"
          ! grep -Fq 'docs/authority/P07_INTEGRATION_MANIFEST.json' "$root/bin/vfops-selfcheck-ui"

      - name: Focused overlay regressions
        run: |
          set -Eeuo pipefail
          cd dist/p07/0.1.0/overlay
          export PYTHONPATH="$PWD/lib"
          python3 -m unittest -q \
            tests.test_main_menu_routes \
            tests.test_menu3_modular \
            tests.test_ops_console_r9 \
            tests.test_terminal_ui_color_contract \
            tests.test_user_entry \
            tests.test_user_remote_backup

      - name: Isolated current-runtime install
        run: |
          set -Eeuo pipefail
          root="$PWD"
          tmp="$(mktemp -d)"
          export P07_PUBLIC_ROOT="file://$root"
          export P07_INSTALL_DIR="$tmp/install"
          export P07_PREVIOUS_DIR="$tmp/previous"
          export P07_BIN_LINK="$tmp/vfops"
          export P07_ALLOW_NONROOT=1
          export P07_NO_EXEC=1
          bash installers/p07-final.sh >"$tmp/install.log"
          test "$("$tmp/vfops" --version)" = 'VF Server Ops 0.1.0'
          test "$("$tmp/vfops" --build-id)" = '0.1.0-release11'
          bash installers/p07-final.sh >"$tmp/second.log"
          grep -Fq '已是当前版本，无需下载或重复安装' "$tmp/second.log"

      - name: Result
        if: always()
        run: |
          echo 'P07_RELEASE11_DISTRIBUTION_GATE=COMPLETE'
          echo 'P07_PRODUCTION_WRITE=NOT_RUN'
