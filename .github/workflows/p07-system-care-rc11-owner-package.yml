name: P07 System Care RC11 Owner Package

on:
  push:
    branches: [gate/p07-system-care-rc11-inventory-discovery-20260908]
    paths:
      - '.github/workflows/p07-system-care-rc11-owner-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gate/p07-system-care-rc11-inventory-discovery-20260908
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout exact RC11 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 502a598b2973be91da3cbd11fb8eb7c7ff5d14f4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Re-run exact source gates
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 502a598b2973be91da3cbd11fb8eb7c7ff5d14f4
          test "$(cat product/modules/system-care/VERSION)" = 0.1.0-rc11
          cd product
          bash modules/system-care/tests/static_gate.sh
          bash modules/system-care/tests/functional_gate.sh
          echo P07_RC11_OWNER_SOURCE_GATE=PASS

      - name: Build full exact runtime package
        shell: bash
        run: |
          set -Eeuo pipefail
          src="$GITHUB_WORKSPACE/product/modules/system-care"
          pkg="$GITHUB_WORKSPACE/packages/p07-system-care/0.1.0-rc11"
          rm -rf "$pkg"
          mkdir -p "$pkg/lib"
          files=(
            VERSION
            vf-system-care.sh
            status.sh
            audit.sh
            updates.sh
            cleanup.sh
            memory.sh
            services.sh
            security-audit.sh
            intrusion-evidence.sh
            intrusion-evidence-entry.sh
            lib/common.sh
            lib/intrusion_evidence.py
            lib/intrusion_logs.py
            lib/intrusion_scan.py
            lib/intrusion_state.py
            lib/intrusion_discovery.py
          )
          for path in "${files[@]}"; do
            mkdir -p "$pkg/$(dirname "$path")"
            cp "$src/$path" "$pkg/$path"
          done
          find "$pkg" -type d -name __pycache__ -prune -exec rm -rf {} +
          : > "$pkg/MANIFEST.gitblob"
          for path in "${files[@]}"; do
            printf '%s  %s\n' "$(git -C product hash-object "modules/system-care/$path")" "$path" >> "$pkg/MANIFEST.gitblob"
          done
          manifest_blob="$(git hash-object "$pkg/MANIFEST.gitblob")"
          echo "$manifest_blob" > /tmp/rc11-manifest-blob
          test "$(wc -l < "$pkg/MANIFEST.gitblob" | tr -d '[:space:]')" = 17
          while read -r expected path; do
            test "$(git hash-object "$pkg/$path")" = "$expected"
          done < "$pkg/MANIFEST.gitblob"
          echo "P07_RC11_OWNER_MANIFEST_BLOB=$manifest_blob"
          echo P07_RC11_OWNER_EXACT_BYTES=PASS

      - name: Build permanent installers from known full-package installer
        shell: bash
        run: |
          set -Eeuo pipefail
          manifest_blob="$(cat /tmp/rc11-manifest-blob)"
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/llhzx2018/core-free-runner-public/d0aa91804cf577ef43400b4171880b9d5a6f225e/installers/p07-system-care.sh \
            -o installers/p07-system-care.sh
          python3 - "$manifest_blob" <<'PY'
          import re, sys
          from pathlib import Path
          manifest=sys.argv[1]
          p=Path('installers/p07-system-care.sh')
          text=p.read_text(encoding='utf-8')
          text=text.replace("VERSION='0.1.0-rc9'", "VERSION='0.1.0-rc11'", 1)
          text=re.sub(r"^MANIFEST_BLOB='[^']+'$", f"MANIFEST_BLOB='{manifest}'", text, count=1, flags=re.M)
          old='[[ -x "$ENTRY" && -x "$TARGET/vf-system-care.sh" && -x "$TARGET/status.sh" && -x "$TARGET/intrusion-evidence.sh" && -f "$TARGET/lib/intrusion_evidence.py" ]] || return 1'
          new='[[ -x "$ENTRY" && -x "$TARGET/vf-system-care.sh" && -x "$TARGET/status.sh" && -x "$TARGET/intrusion-evidence.sh" && -x "$TARGET/intrusion-evidence-entry.sh" && -f "$TARGET/lib/intrusion_evidence.py" && -f "$TARGET/lib/intrusion_scan.py" && -f "$TARGET/lib/intrusion_discovery.py" ]] || return 1'
          if old not in text: raise SystemExit('manager_ready anchor missing')
          text=text.replace(old,new,1)
          old='chmod 0755 "$stage/vf-system-care.sh" "$stage/status.sh" "$stage/audit.sh" "$stage/updates.sh" "$stage/cleanup.sh" "$stage/memory.sh" "$stage/services.sh" "$stage/security-audit.sh" "$stage/intrusion-evidence.sh"'
          new=old[:-1] + ' "$stage/intrusion-evidence-entry.sh"'
          if old not in text: raise SystemExit('exec chmod anchor missing')
          text=text.replace(old,new,1)
          old='chmod 0644 "$stage/VERSION" "$stage/lib/common.sh" "$stage/lib/intrusion_evidence.py" "$stage/lib/intrusion_logs.py" "$stage/lib/intrusion_scan.py" "$stage/lib/intrusion_state.py"'
          new=old[:-1] + ' "$stage/lib/intrusion_discovery.py"'
          if old not in text: raise SystemExit('lib chmod anchor missing')
          text=text.replace(old,new,1)
          p.write_text(text, encoding='utf-8')

          toolbox=Path('installers/p07-toolbox.sh')
          t=toolbox.read_text(encoding='utf-8')
          t,n=re.subn(r'^SYSTEM_CARE_EXPECTED="[^"]+"$', 'SYSTEM_CARE_EXPECTED="0.1.0-rc11"', t, count=1, flags=re.M)
          if n != 1: raise SystemExit('toolbox System Care anchor missing')
          toolbox.write_text(t, encoding='utf-8')
          PY
          bash -n installers/p07-system-care.sh
          bash -n installers/p07-toolbox.sh
          grep -Fq "VERSION='0.1.0-rc11'" installers/p07-system-care.sh
          grep -Fq "MANIFEST_BLOB='$manifest_blob'" installers/p07-system-care.sh
          grep -Fq 'intrusion-evidence-entry.sh' installers/p07-system-care.sh
          grep -Fq 'lib/intrusion_discovery.py' installers/p07-system-care.sh
          grep -Fq 'SYSTEM_CARE_EXPECTED="0.1.0-rc11"' installers/p07-toolbox.sh
          echo P07_RC11_OWNER_INSTALLER_BUILD=PASS

      - name: Commit candidate package
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add packages/p07-system-care/0.1.0-rc11 installers/p07-system-care.sh installers/p07-toolbox.sh
          git commit -m 'test(P07): publish System Care RC11 owner-test candidate'
          git push origin HEAD:gate/p07-system-care-rc11-inventory-discovery-20260908
          echo P07_RC11_OWNER_PACKAGE_COMMIT=PASS
