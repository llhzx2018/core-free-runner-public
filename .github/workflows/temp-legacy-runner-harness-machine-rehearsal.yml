name: TEMP Legacy Runner Harness Machine Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-legacy-runner-harness-machine-rehearsal.yml'
      - 'harness/wordpress-phase3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-legacy-runner-harness-machine-rehearsal
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run contract and security tests
        run: |
          set -Eeuo pipefail
          python -m unittest discover -s harness/wordpress-phase3/tests -v
          python harness/wordpress-phase3/scripts/validate_job.py \
            harness/wordpress-phase3/templates/job.example.json

      - name: Execute real WordPress and MariaDB environment
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/evidence-output
        run: |
          set -Eeuo pipefail
          bash harness/wordpress-phase3/scripts/run_job.sh \
            harness/wordpress-phase3/templates/job.example.json

      - name: Verify V2 machine result
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence-output/result.json').read_text(encoding='utf-8'))
          assert result['schema_version'] == '2.0'
          assert result['status'] == 'PASS'
          assert len(result['checks']) >= 4
          print('WORDPRESS_PHASE3_HARNESS=PASS')
          PY

      - name: Upload public-safe migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-runner-harness-rehearsal-${{ github.run_id }}
          path: evidence-output/
          if-no-files-found: error
          retention-days: 14
