name: TEMP S01-C02 1.21.954 Distribution Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-s01-c02-121954-distribution-proof.yml'

permissions:
  contents: read

jobs:
  exact-distribution-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATES_SHA: 01e271ebab161688eca8b55a02b99d91ed8ecfe2
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_SHA: c16fc1cfe9a3e903bb499c0a6038216da3e736aa
      TAG: v1.21.954
      ASSET: vf-tools-ops_V1.21.954.zip
      ASSET_BYTES: '3405710'
      ASSET_SHA256: c57e883dd1aabc7178e9541bc52d112c631ee39657e9e36d3412bc6b6ad11f00
      RUNTIME_FILES: '961'
      RUNTIME_FP: 4ab4631542cbf3bc0285ab86b3592582c0e655ec89191eca9684f1269c4b0eb2

    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATES_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: updates
          persist-credentials: false

      - name: Assert exact manifest identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATES_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("updates/projects/S01-C02.json").read_text())
          assert m["target_version"]=="1.21.954"
          assert m["release_tag"]=="v1.21.954"
          assert m["asset_name"]=="vf-tools-ops_V1.21.954.zip"
          assert m["asset_bytes"]==3405710
          assert m["asset_sha256"]=="c57e883dd1aabc7178e9541bc52d112c631ee39657e9e36d3412bc6b6ad11f00"
          assert m["runtime_files"]==961
          assert m["runtime_fingerprint"]=="4ab4631542cbf3bc0285ab86b3592582c0e655ec89191eca9684f1269c4b0eb2"
          assert m["runtime_file_count"]==961
          assert m["runtime_fingerprint_sha256"]=="4ab4631542cbf3bc0285ab86b3592582c0e655ec89191eca9684f1269c4b0eb2"
          assert "1.21.953" in m["from_versions"]
          assert m["schema_from"]=="6.0.0" and m["schema_to"]=="6.0.0"
          assert m["backup_required"] is True and m["rollback_supported"] is True
          print("S01-C02 1.21.954 manifest identity PASS")
          PY

      - name: Manifest contract audit
        working-directory: updates
        run: python3 scripts/check_manifest_contract.py

      - name: PHP syntax and Update Core regression
        shell: bash
        working-directory: updates
        run: |
          set -euo pipefail
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php

      - name: Exact Formal Release readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          JSON="$(gh api "repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$PRODUCT_SHA"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$JSON")" = "$ASSET_BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$JSON")" = "sha256:$ASSET_SHA256"
          echo "S01-C02 1.21.954 Distribution exact-source proof PASS"

      - name: Cleanup
        if: always()
        run: rm -rf updates
