name: P07 PR233 exact-source SQL diagnostic gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p07-pr233-diagnostic-gate.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.head_ref == 'test/p07-pr233-diagnostic-gate' && github.event.pull_request.head.repo.full_name == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PRODUCT_SHA: e5453c8658939f0ecba2dbf3dedefe07d9e7e778
    steps:
      - name: Verify configured private read capability
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          test -n "$VF_PRIVATE_READ_TOKEN" || { echo P07_PRIVATE_READ_UNAVAILABLE; exit 78; }
      - name: Checkout immutable P07 PR233 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: e5453c8658939f0ecba2dbf3dedefe07d9e7e778
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p07-private
      - name: Execute targeted exact-source regression and fail-closed SQL tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p07-private
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat BUILD_ID)" = 0.1.0-release99
          export PYTHONPATH="$PWD/lib:$PWD"
          python3 -m compileall -q lib/verify.py lib/server_migration_pull.py
          for module in test_cross_engine_sql_format.py test_server_migration_pull.py test_verify.py test_mariadb_owner_policy.py test_restore_as_real_db_compat.py; do
            python3 -m unittest discover -s tests -p "$module" -v
          done
          echo P07_PR233_EXACT_SOURCE_DIAGNOSTIC_REGRESSION_PASS
      - name: Remove private checkout
        if: always()
        shell: bash
        run: |
          if test -d p07-private; then
            find p07-private -type f -name '*.sql*' -delete
            rm -rf p07-private
          fi
