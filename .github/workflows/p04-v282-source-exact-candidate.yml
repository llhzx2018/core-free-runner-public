name: P04 V2.8.2 Source Exact Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p04-v282-source-exact-candidate.yml'
      - 'requests/p04-v282-source-exact-candidate.txt'

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: llhzx2018/vf-infra
  SOURCE_COMMIT: '65035be259968ece3434b728e153389edc54a5fb'
  TARGET_VERSION: '2.8.2'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_COMMIT }}
          token: ${{ env.READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: candidate

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo, sodium, zip, curl, mbstring

      - name: Source health
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = '2.8.2'
          python3 candidate/scripts/repository-health-gate.py
          python3 candidate/scripts/check-migrations.py
          python3 -m py_compile candidate/scripts/build-release-tree.py candidate/scripts/build-v282-update-release.py
          find candidate/src candidate/public candidate/tests/integration -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          node --check candidate/public/assets/v280-navigation-simplify.js
          grep -Fq 'Auth::requireAuth();' candidate/public/source-integrity.php
          grep -Fq "'unlisted_source'" candidate/public/source-integrity.php
          grep -Fq 'v282-integrity-detail' candidate/public/assets/v280-navigation-simplify.js
          echo 'P04_V282_SOURCE_HEALTH=PASS'

      - name: Build deterministic FULL and source-exact UPDATE
        shell: bash
        run: |
          set -Eeuo pipefail
          R1="$RUNNER_TEMP/runtime-a"; R2="$RUNNER_TEMP/runtime-b"
          O1="$RUNNER_TEMP/update-a"; O2="$RUNNER_TEMP/update-b"
          python3 candidate/scripts/build-release-tree.py "$R1" --source-root candidate | tee "$RUNNER_TEMP/build-a.log"
          python3 candidate/scripts/build-release-tree.py "$R2" --source-root candidate | tee "$RUNNER_TEMP/build-b.log"
          diff -ru "$R1" "$R2"
          python3 - "$R1/release-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          assert m['version']=='2.8.2' and m['target_schema']==14 and m['release_kind']=='maintenance_release'
          assert m['file_count']==len(m['files'])
          paths={x['path'] for x in m['files']}
          assert 'source-integrity.php' in paths
          assert 'assets/v280-navigation-simplify.js' in paths
          print('P04_V282_RELEASE_MANIFEST=PASS')
          print('RUNTIME_FINGERPRINT='+m['source_fingerprint'])
          print('MANIFEST_ENTRIES='+str(len(m['files'])))
          PY
          python3 - "$R1" "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip" <<'PY'
          import pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,strict_timestamps=True) as z:
            for p in sorted(x for x in root.rglob('*') if x.is_file()):
              i=zipfile.ZipInfo(p.relative_to(root).as_posix(),date_time=(1980,1,1,0,0,0)); i.compress_type=zipfile.ZIP_DEFLATED; i.create_system=3; i.external_attr=(0o100644<<16); z.writestr(i,p.read_bytes())
          PY
          python3 candidate/scripts/build-v282-update-release.py --target-runtime "$R1" --output "$O1" | tee "$RUNNER_TEMP/update-a.log"
          python3 candidate/scripts/build-v282-update-release.py --target-runtime "$R1" --output "$O2" | tee "$RUNNER_TEMP/update-b.log"
          cmp "$O1/VF_Infra_V2.8.2_UPDATE.zip" "$O2/VF_Infra_V2.8.2_UPDATE.zip"
          cmp "$O1/VF_Infra_V2.8.2_UPDATE.zip" "$O1/VF_Infra_V2.8.2_ATOMIC.zip"
          php "$O1/repair-v2.8.2.php" --self-test | tee "$RUNNER_TEMP/selftest.log"
          grep -Fq 'ATOMIC_SELF_TEST_PASS target=2.8.2 schema=14' "$RUNNER_TEMP/selftest.log"
          grep -Fq "Source Exact" "$O1/repair-v2.8.2.php"
          grep -Fq '升级后版本文件完整性仍未归零' "$O1/repair-v2.8.2.php"
          grep -Fq 'legacy' candidate/tests/integration/v282_atomic_transaction_contract.php
          python3 - "$R1/release-manifest.json" "$O1/PACKAGE_MANIFEST.json" <<'PY'
          import json,sys,re
          rm=json.load(open(sys.argv[1],encoding='utf-8')); pm=json.load(open(sys.argv[2],encoding='utf-8'))
          assert pm['version']=='2.8.2' and pm['schema']==14
          assert pm['allowed_source_versions']==['2.7.9','2.8.0','2.8.1']
          assert pm['release_kind']=='source_exact_reconciliation'
          assert pm['source_exact_reconciliation'] is True
          assert pm['reconcile_all_release_manifest_files'] is True
          assert pm['remove_unlisted_managed_source'] is True
          assert pm['post_repair_manifest_integrity_required'] is True
          assert pm['payload_file_count']==len(rm['files'])+1
          forbidden=[]
          for p in pm['changed_files']:
            x=p.lower()
            if p=='config.php' or re.search(r'(^|/)(private|private_data|backup|backups|cache|caches|session|sessions|log|logs|temp|tmp)(/|$)',x) or re.search(r'\.(sqlite3?|db)$',x): forbidden.append(p)
          assert not forbidden, forbidden
          print('P04_V282_FULL_SOURCE_PAYLOAD=PASS')
          PY
          cp "$O1/VF_Infra_V2.8.2_UPDATE.zip" "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip"
          cp "$O1/PACKAGE_MANIFEST.json" "$RUNNER_TEMP/V282_PACKAGE_MANIFEST.json"
          cp "$O1/SHA256SUMS.txt" "$RUNNER_TEMP/V282_SHA256SUMS.txt"
          echo "RUNTIME=$R1" >> "$GITHUB_ENV"
          echo "UPDATE_DIR=$O1" >> "$GITHUB_ENV"
          echo 'P04_V282_DETERMINISTIC_ARTIFACTS=PASS'

      - name: Verify three immutable upgrade sources source-exact
        shell: bash
        run: |
          set -Eeuo pipefail
          for src in 2.7.9 2.8.0 2.8.1; do
            dir="$RUNNER_TEMP/v${src//./}"
            mkdir -p "$dir"
            gh release download "v$src" -R llhzx2018/vf-infra --pattern "VF_Infra_V${src}_FULL.zip" --dir "$dir"
            python3 candidate/scripts/full-runtime-vs-update-result-source-exact-gate.py \
              --baseline-full "$dir/VF_Infra_V${src}_FULL.zip" \
              --candidate-full "$RUNNER_TEMP/VF_Infra_V2.8.2_FULL.zip" \
              --candidate-update "$RUNNER_TEMP/VF_Infra_V2.8.2_UPDATE.zip" \
              --expected-source-version "$src" --expected-target-version 2.8.2
            echo "P04_${src}_TO_2.8.2_SOURCE_EXACT=PASS"
          done

      - name: Atomic transaction deletion and rollback contract
        shell: bash
        run: |
          set -Eeuo pipefail
          php candidate/tests/integration/v282_atomic_transaction_contract.php candidate | tee "$RUNNER_TEMP/tx.log"
          grep -Fxq 'PASS source_replace_and_unlisted_delete' "$RUNNER_TEMP/tx.log"
          grep -Fxq 'PASS rollback_restores_deleted_legacy_source' "$RUNNER_TEMP/tx.log"
          grep -Fxq 'PASS commit_keeps_source_exact_target' "$RUNNER_TEMP/tx.log"
          grep -Fxq 'P04_V282_ATOMIC_TRANSACTION_CONTRACT_PASS' "$RUNNER_TEMP/tx.log"

      - name: Preserve real Branding private-data contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/private"; chmod 700 "$RUNNER_TEMP/private"
          cat > "$RUNTIME/config.php" <<PHP
          <?php
          return ['app_name'=>'VF Infra Candidate','base_url'=>'http://localhost','allowed_hosts'=>['localhost'],'host_mode'=>'serve_all','trusted_proxy_ips'=>[],'rdap_allow_http'=>false,'data_path'=>'$RUNNER_TEMP/private','timezone'=>'Asia/Shanghai','app_key'=>'0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef','session_name'=>'vf282'];
          PHP
          chmod 600 "$RUNTIME/config.php"
          php candidate/tests/integration/common_branding_contract_v279.php "$RUNTIME" | tee "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS logo_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS favicon_1024_square_accepted' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS brand_file_owner_only' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS brand_dir_owner_only' "$RUNNER_TEMP/branding.log"
          grep -Fxq 'PASS reset_to_default' "$RUNNER_TEMP/branding.log"
          echo 'P04_V282_BRANDING_PRESERVED=PASS'

      - name: Emit exact identity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,json
          t=pathlib.Path(os.environ['RUNNER_TEMP']); f=t/'VF_Infra_V2.8.2_FULL.zip'; u=t/'VF_Infra_V2.8.2_UPDATE.zip'; sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          pm=json.load(open(t/'V282_PACKAGE_MANIFEST.json',encoding='utf-8'))
          print('P04_V282_SOURCE_EXACT_CANDIDATE=PASS'); print('SOURCE_SHA='+os.environ['SOURCE_COMMIT']); print('FULL_BYTES='+str(f.stat().st_size)); print('FULL_SHA256='+sha(f)); print('UPDATE_BYTES='+str(u.stat().st_size)); print('UPDATE_SHA256='+sha(u)); print('PAYLOAD_FILES='+str(pm['payload_file_count'])); print('ALLOWED_SOURCES=2.7.9,2.8.0,2.8.1'); print('SCHEMA=14'); print('PRODUCTION_WRITE=0'); print('RELEASE_WRITE=0')
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P04-V2.8.2-SOURCE-EXACT-CANDIDATE
          path: |
            ${{ runner.temp }}/VF_Infra_V2.8.2_FULL.zip
            ${{ runner.temp }}/VF_Infra_V2.8.2_UPDATE.zip
            ${{ runner.temp }}/V282_PACKAGE_MANIFEST.json
            ${{ runner.temp }}/V282_SHA256SUMS.txt
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 14
