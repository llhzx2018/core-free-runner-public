name: TEMP P08 R43 read-only 3DB schema safety classifier and Owner Vue
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-r43-schema-safety-readiness-20261124.yml'
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: 3fe0acb3eed6bf8171246bb82e5e963c0e292345
  BRIDGE_VERSION: '0.1.17'
  BRIDGE_SHA: 93d5f12f70466e481b427902dfe17834b28497e8
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-safety-readiness-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-r43-schema-safety-readiness-20261124.json --input .github/workflows/temp-p08-r43-schema-safety-readiness-20261124.yml
  sqlite-schema-readiness:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-schema-safety-readiness-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
      P08_R145_ISOLATED: 'YES'
      P08_R43_DISPOSABLE: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.BRIDGE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo, posix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source locked dependencies and two real source-built FULL archives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-bridge rev-parse HEAD)" = "$BRIDGE_SHA"
          test "$(git -C private-p08-target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat private-p08-bridge/VERSION)" = "$BRIDGE_VERSION"
          test "$(cat private-p08-target/VERSION)" = "$TARGET_VERSION"
          php -l private-p08-bridge/src/Upgrade/R43IsolatedSchemaTransaction.php > "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TRANSACTION_PHP_SYNTAX=FAIL; exit 1; }
          php -l private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php >> "$RUNNER_TEMP/r43-php-syntax.log" 2>&1 || { echo R43_TEST_PHP_SYNTAX=FAIL; exit 1; }
          for d in private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/r43-$d-composer.log" 2>&1) || { echo R43_COMPOSER_LOCK=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/r43-$d-npm.log" 2>&1 && npm run build > "$RUNNER_TEMP/r43-$d-vite.log" 2>&1) || { echo R43_NPM_VITE=FAIL; exit 1; }
          done
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/r43-bridge.zip" --version "$BRIDGE_VERSION" --source-sha "$BRIDGE_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-bridge-package.log" 2>&1 || { echo R43_BRIDGE_CANONICAL_FULL=FAIL; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/r43-target.zip" --version "$TARGET_VERSION" --source-sha "$TARGET_SHA" --governance-root gov-proof > "$RUNNER_TEMP/r43-target-package.log" 2>&1 || { echo R43_TARGET_CANONICAL_FULL=FAIL; exit 1; }
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-bridge-extract"
          unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$RUNNER_TEMP/p08-r43-bridge-extract"
          echo P08_R43_CANONICAL_DEV_FULLS_EXTRACTED=PASS
      - name: Three-engine refusal and Vue Owner page machine tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for f in src/Upgrade/R43SchemaExecutionReadiness.php src/Upgrade/OwnerNextReleaseGateway.php tests/compatibility/r43_schema_execution_readiness.php tests/compatibility/r43_owner_schema_preparation.php; do
            php -l "private-p08-bridge/$f" >> "$RUNNER_TEMP/r43-readiness-lint.log" 2>&1 || { echo P08_R43_SAFETY_SYNTAX=FAIL; exit 1; }
          done
          php private-p08-bridge/tests/compatibility/r43_schema_execution_readiness.php > "$RUNNER_TEMP/r43-readiness-unit.log" 2>&1 || { echo P08_R43_SAFETY_POLICY_UNIT=FAIL; exit 1; }
          grep -qx 'P08_R43_SCHEMA_READINESS_THREE_ENGINE_READ_ONLY_MATRIX=PASS' "$RUNNER_TEMP/r43-readiness-unit.log"
          echo P08_R43_SAFETY_POLICY_THREE_DATABASES_FAIL_CLOSED=PASS
          (cd private-p08-bridge && npm run typecheck > "$RUNNER_TEMP/r43-readiness-ts.log" 2>&1) || { echo P08_R43_SAFETY_TYPESCRIPT=FAIL; exit 1; }
          (cd private-p08-bridge && npx vitest run tests/js/r43-schema-owner-prepare-page.test.ts tests/js/future-update-check-feedback.test.ts > "$RUNNER_TEMP/r43-readiness-vue.log" 2>&1) || { echo P08_R43_SAFETY_VUE_TESTS=FAIL; exit 1; }
          (cd private-p08-bridge && npm run build > "$RUNNER_TEMP/r43-readiness-build.log" 2>&1) || { echo P08_R43_SAFETY_VITE_BUILD=FAIL; exit 1; }
          echo P08_R43_OWNER_PAGE_TYPESCRIPT_VITEST_BUILD=PASS
      - name: Real installed v017 Owner and official-style private schema prepare positive negative
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          manifest="$(sha256sum "$RUNNER_TEMP/p08-r43-bridge-extract/FULL_MANIFEST.json" | cut -d' ' -f1)"
          python3 private-p08-bridge/scripts/build_r43_schema_atomic.py --source-full "$RUNNER_TEMP/p08-r43-bridge-extract" --target-runtime private-p08-target --output "$RUNNER_TEMP/p08-r43-schema-a.zip" --source-sha "$BRIDGE_SHA" --source-full-sha256 "$manifest" --target-sha "$TARGET_SHA" > "$RUNNER_TEMP/r43-readiness-schema-zip.log" 2>&1 || { echo P08_R43_SCHEMA_DEV_ZIP_BUILD=FAIL; exit 1; }
          for mode in good bad; do
            site="$RUNNER_TEMP/p08-r43-site-owner-$mode"
            mkdir -m 700 "$site"
            unzip -q "$RUNNER_TEMP/r43-bridge.zip" -d "$site"
            php private-p08-bridge/tests/compatibility/r43_isolated_installed_transaction.php setup "$site" "$RUNNER_TEMP/p08-r43-target-extract" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-readiness-install-$mode.log" 2>&1 || { echo "P08_R43_INSTALLED_OWNER_SETUP=FAIL_$mode"; exit 1; }
            if ! php private-p08-bridge/tests/compatibility/r43_owner_schema_preparation.php "$mode" "$site" "$RUNNER_TEMP/p08-r43-schema-a.zip" "$BRIDGE_SHA" "$TARGET_SHA" > "$RUNNER_TEMP/r43-readiness-owner-$mode.log" 2>&1; then
              echo "P08_R43_OWNER_SCHEMA_SAFE_READINESS=FAIL_$mode"
              grep -E '^P08_R43_OWNER_PREPARE_[A-Z0-9_]+=PASS$' "$RUNNER_TEMP/r43-readiness-owner-$mode.log" | tail -15 || true
              reason="$(grep -oE 'R43_[A-Z][A-Z0-9_]+' "$RUNNER_TEMP/r43-readiness-owner-$mode.log" | tail -1 || true)"
              if [[ "$reason" =~ ^R43_[A-Z][A-Z0-9_]+$ ]]; then echo "P08_R43_SAFE_REASON=$reason"; else echo P08_R43_SAFE_REASON=UNCLASSIFIED; fi
              exit 1
            fi
            grep -qx "P08_R43_OWNER_SCHEMA_PRIVATE_PREPARATION_$mode=PASS" "$RUNNER_TEMP/r43-readiness-owner-$mode.log"
            grep -qx 'P08_R43_OWNER_PREPARE_REAL_INSTALLED_SQLITE_SCHEMA_METADATA_HAS_NONINSTALLABLE_SAFETY_VERDICT=PASS' "$RUNNER_TEMP/r43-readiness-owner-$mode.log"
            echo "P08_R43_REAL_INSTALLED_OWNER_SCHEMA_SAFETY_$mode=PASS"
          done
          echo P08_R43_OWNER_SCHEMA_PREPARE_READINESS_BOTH_CASES=PASS
          echo P08_R43_PRODUCTION_SCHEMA_APPLY=BLOCKED
      - name: Remove private source and synthetic Owner fixtures
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf -- private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-site-owner-good" "$RUNNER_TEMP/p08-r43-site-owner-bad" "$RUNNER_TEMP/p08-r43-target-extract" "$RUNNER_TEMP/p08-r43-bridge-extract"
          rm -f -- "$RUNNER_TEMP"/r43-*.zip "$RUNNER_TEMP"/r43-*.log "$RUNNER_TEMP"/p08-r43-*.zip
          if test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof && test ! -e "$RUNNER_TEMP/p08-r43-site-owner-good"; then
            echo P08_R43_PRIVATE_SOURCE_AND_SYNTHETIC_OWNER_CLEANUP=PASS
          else
            echo P08_R43_PRIVATE_CLEANUP=FAIL
            exit 1
          fi
