name: P01 V2.33 Health Triage Edit
on:
  push:
    branches: [task/p01-v233-health-triage-20260830]
    paths:
      - .github/workflows/p01-v233-health-triage-edit.yml
      - scripts/p01-v233-health-triage-edit.py
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner
      - name: Checkout exact product feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-v2.33-health-triage-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact-source fenced edit
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          BASE=b63b6605a723e4e8d34dfb3368e0e7dd993558a6
          test "$(git rev-parse HEAD)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$BASE"
          test "$(cat VERSION)" = 2.32.0
          test "$(cat src/VERSION.txt)" = 2.32.0
          python3 ../runner/scripts/p01-v233-health-triage-edit.py
          php -l src/app/LinkHealth.php
          php -l src/app/FunctionalHome.php
          php -l src/health.php
          node -e "new Function(require('fs').readFileSync('src/assets/health.js','utf8')); console.log('HEALTH_JS_SYNTAX=PASS')"
          git diff --check
          git diff --name-only | sort >/tmp/p01-v233-actual.txt
          printf '%s\n' \
            src/app/FunctionalHome.php \
            src/app/LinkHealth.php \
            src/assets/health.js \
            src/health.php | sort >/tmp/p01-v233-expected.txt
          diff -u /tmp/p01-v233-expected.txt /tmp/p01-v233-actual.txt
          test "$(cat VERSION)" = 2.32.0
          test "$(cat src/VERSION.txt)" = 2.32.0
          test -z "$(git diff --name-only -- src/app/Schema.php migrations 2>/dev/null || true)"
          grep -F "'needsAction'=>" src/app/LinkHealth.php >/dev/null
          grep -F '访问受限（人工确认）' src/app/FunctionalHome.php >/dev/null
          grep -F '访问受限（需人工确认）' src/health.php >/dev/null
          grep -F '打开网址' src/assets/health.js >/dev/null
          grep -F '不要直接判定失效' src/assets/health.js >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/app/LinkHealth.php src/assets/health.js src/health.php
          git commit -m 'refine(P01): rebaseline link health triage'
          git push origin HEAD:feature/p01-v2.33-health-triage-20260830
          echo "PRODUCT_SOURCE=$(git rev-parse HEAD)"
          echo "PRODUCT_TREE=$(git rev-parse HEAD^{tree})"
          echo "RUNTIME_TREE=$(git rev-parse HEAD:src)"
          echo P01_V233_HEALTH_TRIAGE_EDIT=PASS
          echo VERSION=2.32.0
          echo SCHEMA_CHANGE=NO
          echo RELEASE=NO
          echo PRODUCTION=NO
