name: TEMP S01-C01 v1.35.10 Update Channel Gate
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-c01-v13510-update-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CORE_BASE: ccecf180742724abed7e85d1561c905cee7b0e85
      CORE_CANDIDATE: 6c5f69c34d2604dcc03e7f16a0a2de625d2216b0
      THEME_SHA: cae5a32961c067d1336635610154b2f009a6bd03
      THEME_DEVELOP: 63eb30f4250951e9a2c3dfe0a43c7f18af6e1f81
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Verify live core base and exact one-file scope
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')"
          test "$live" = "$CORE_BASE"
          test "$(git -C core diff --name-only "$CORE_BASE" "$CORE_CANDIDATE")" = 'projects/S01-C01.json'
          jq -e '.target_version=="1.35.10" and .from_versions==["1.35.8","1.35.9"] and .release_tag=="v1.35.10" and .asset_name=="vf-tools-theme_V1.35.10.zip" and .asset_bytes==1776173 and .asset_sha256=="2dcf9ab10e29c2f5fac6274e53c7a76e32e1c279e95760f41070bc535bfd2e64" and .runtime_files==438 and .runtime_fingerprint=="6dbdb672dbc166e66da02697b645279d6ace6800436a984f101822cc2547ec4f"' core/projects/S01-C01.json >/dev/null
          jq -e '.target_version=="1.21.811"' core/projects/S01-C02.json >/dev/null
          jq -e '.target_version=="1.25.20"' core/projects/S01-C03.json >/dev/null
          echo EXACT_CHANNEL_SCOPE=PASS
      - name: Verify formal release and branch authority
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          main="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-theme/branches/main | jq -r '.commit.sha')"
          develop="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-theme/branches/develop | jq -r '.commit.sha')"
          test "$main" = "$THEME_SHA"
          test "$develop" = "$THEME_DEVELOP"
          j="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/vf-tools-theme/releases/tags/v1.35.10)"
          test "$(jq -r '.target_commitish' <<<"$j")" = "$THEME_SHA"
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.10.zip")|.size' <<<"$j")" = 1776173
          test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.10.zip")|.digest' <<<"$j")" = sha256:2dcf9ab10e29c2f5fac6274e53c7a76e32e1c279e95760f41070bc535bfd2e64
          echo FORMAL_RELEASE_AND_BRANCH=PASS
          echo PASS_THEME_V13510_UPDATE_CHANNEL_GATE
