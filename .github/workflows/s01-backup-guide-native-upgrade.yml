name: S01 backup 157-94 native upgrade rollback exact
on:
  push:
    branches: [task/s01-backup-guide157-94-20261021]
    paths:
      - '.github/workflows/s01-backup-guide-native-upgrade.yml'
      - 'lanes/s01-backup-guide157-94-20261021/**'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 02d4591eed025a3d3a67bc0a150b3ddc448c2ab8
          persist-credentials: false
          path: established
      - name: Reuse established isolated WordPress lane
        run: |
          mkdir -p proof provider
          cp -a established/lanes/s01-frontend-design-20261017 lane
          cp control/lanes/s01-backup-guide157-94-20261021/browser.cjs lane/backup-guide.cjs
          node --check lane/backup-guide.cjs
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: cc15f8256f6def8e6a0372994ca09c8cc6ff3fb6
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: theme-candidate
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: d712db7b08a9bf05ffdd04afcaa636e7af5f647d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: m3u8-candidate
      - name: PHP syntax and exact released predecessor
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          php -l theme-candidate/src/inc/modules/module-tool-shortcode.php
          php -l theme-candidate/src/inc/seo-flow/seo-flow-content.php
          php -l m3u8-candidate/src/templates/backup-restore.php
          php -l m3u8-candidate/src/includes/v510-copy.php
          php -l m3u8-candidate/src/includes/public-shortcode-registry.php
          grep -R -n -F '输入并执行任务' theme-candidate/src/inc m3u8-candidate/src/includes m3u8-candidate/src/templates | head -n 8 || true
          gh release download v1.25.93 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.93.zip --dir provider
          echo '4e032449f4581115a33e4e5b122ec0eef7651ac7a1f23937102a49cd0a7e5815  provider/vf-tools-m3u8_V1.25.93.zip' | sha256sum -c
          gh release download v1.35.156 --repo llhzx2018/vf-tools-theme --pattern vf-tools-theme_V1.35.156.zip --dir provider
          echo '1afacdf813b2b757623ce278f253bd565d8f5274a97798c367f5a90e5cbd4193  provider/vf-tools-theme_V1.35.156.zip' | sha256sum -c
      - name: Deterministic candidate ZIPs from exact Git trees
        run: |
          set -euo pipefail
          python3 - <<'PYBUNDLE'
          from pathlib import Path,PurePosixPath
          import hashlib,json,subprocess,zipfile,io
          theme=Path('theme-candidate');plugin=Path('m3u8-candidate')
          tsha='cc15f8256f6def8e6a0372994ca09c8cc6ff3fb6';psha='d712db7b08a9bf05ffdd04afcaa636e7af5f647d'
          def git(p,*args):return subprocess.check_output(['git','-C',str(p),*args])
          assert git(theme,'rev-parse','HEAD').decode().strip()==tsha
          assert git(theme,'rev-parse','HEAD^{tree}').decode().strip()=='212e835352b2cc92d686e7d4333164c7221444c8'
          assert git(plugin,'rev-parse','HEAD').decode().strip()==psha
          assert git(plugin,'rev-parse','HEAD^{tree}').decode().strip()=='0e57c74fd67c3b7e03c7b9193583394a063ab9fd'
          assert (theme/'VERSION').read_text().strip()=='1.35.157'
          assert (plugin/'VERSION').read_text().strip()=='1.25.94'
          expected_theme={'CHANGELOG.md','VERSION','src/inc/modules/module-tool-shortcode.php','src/inc/seo-flow/seo-flow-content.php','src/style.css','src/inc/runtime-constants.php'}
          expected_plugin={'CHANGELOG.md','VERSION','src/templates/backup-restore.php','src/vf-tool-m3u8.php','src/plugin-manifest.json','src/PACKAGE_PROFILE.json','src/includes/v510-copy.php','src/includes/public-shortcode-registry.php'}
          assert set(git(theme,'diff','--name-only','9b6eab29445fa80297f7fe06d8f283b262e1c374','HEAD').decode().splitlines())==expected_theme
          assert set(git(plugin,'diff','--name-only','19a6f27b5f7fa402c326d283a1a2eac072c777c3','HEAD').decode().splitlines())==expected_plugin
          faq=(theme/'src/inc/seo-flow/seo-flow-content.php').read_text()
          assert faq.count("'workspace' => vf_theme_seo_pick(")==2
          assert "这里备份的是哪些数据" in faq
          code=(plugin/'src/templates/backup-restore.php').read_text()
          assert "['开始', '立即开始', '开始处理', 'Start', 'Run', 'Go']" in code
          assert 'data-vf-backup-action="preview-workspace"' in code
          files=sorted(p for p in (theme/'src').rglob('*') if p.is_file())
          assert len(files)==476
          def write_theme():
           b=io.BytesIO()
           with zipfile.ZipFile(b,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for p in files:
             assert not p.is_symlink()
             inf=zipfile.ZipInfo(str(PurePosixPath('vf-tools-theme')/p.relative_to(theme/'src')),date_time=(1980,1,1,0,0,0))
             inf.compress_type=zipfile.ZIP_DEFLATED;inf.external_attr=(p.stat().st_mode&0o777)<<16
             z.writestr(inf,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
           return b.getvalue()
          theme_zip=Path('provider/vf-tools-theme_V1.35.157.zip')
          data=write_theme();assert data==write_theme();theme_zip.write_bytes(data)
          old=Path('provider/vf-tools-m3u8_V1.25.93.zip')
          updated={p[4:]:plugin/p for p in expected_plugin if p.startswith('src/') and p!='src/PACKAGE_PROFILE.json'}
          def write_plugin():
           b=io.BytesIO()
           with zipfile.ZipFile(old) as zin,zipfile.ZipFile(b,'w') as zout:
            entries=zin.infolist();assert sum(not e.is_dir() for e in entries)==568
            done=set()
            for info in entries:
             assert info.filename.startswith('vf-tool-m3u8/'),info.filename
             rel=info.filename[len('vf-tool-m3u8/'):]
             assert '..' not in PurePosixPath(rel).parts
             payload=zin.read(info)
             if rel in updated:
              baseline=git(plugin,'show','19a6f27b5f7fa402c326d283a1a2eac072c777c3:src/'+rel)
              assert payload==baseline,rel
              payload=updated[rel].read_bytes()
              done.add(rel)
             zout.writestr(info,payload)
            assert done==set(updated),sorted(set(updated)-done)
           return b.getvalue()
          nextp=Path('provider/vf-tools-m3u8_V1.25.94.zip')
          pdata=write_plugin();assert pdata==write_plugin();nextp.write_bytes(pdata)
          for path,count,root,ver in [(theme_zip,476,'vf-tools-theme/style.css','Version: 1.35.157'),(nextp,568,'vf-tool-m3u8/vf-tool-m3u8.php','Version: 1.25.94')]:
           with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            assert len([x for x in z.namelist() if not x.endswith('/')])==count
            assert ver in z.read(root).decode()
          receipt={'status':'PASS','theme':{'version':'1.35.157','bytes':theme_zip.stat().st_size,'sha256':hashlib.sha256(data).hexdigest(),'files':476,'source':tsha},'m3u8':{'version':'1.25.94','bytes':nextp.stat().st_size,'sha256':hashlib.sha256(pdata).hexdigest(),'files':568,'source':psha},'production':'UNTOUCHED'}
          Path('proof/backup-guide-package.json').write_text(json.dumps(receipt,indent=2))
          print('BACKUP_GUIDE_EXACT_CANDIDATES_PASS '+json.dumps(receipt))
          PYBUNDLE
          ln -s theme-candidate target
      - name: Chromium
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: Real WordPress theme and plugin candidate browser gate
        run: |
          set -euo pipefail
          python3 - <<'PYNATIVE'
          from pathlib import Path
          s=Path('lane/native.sh').read_text()
          key='docker cp provider/vf-tools-m3u8_V1.25.91.zip "$WP:/tmp/provider.zip"'
          assert s.count(key)==1
          s=s.replace(key,'docker cp provider/vf-tools-m3u8_V1.25.94.zip "$WP:/tmp/provider.zip"')
          installer='cli plugin install polylang --version=3.8.10 --activate >/dev/null'
          assert s.count(installer)==1
          s=s.replace(installer,'for attempt in 1 2 3; do '+installer+' && break; test "$attempt" -lt 3 || exit 1; sleep 3; done')
          s=s.replace('node lane/warm-admin.cjs','true')
          marker='if [ "${VF_REVIEW_ONLY_STATE:-0}" = "1" ];then'
          assert s.count(marker)==1
          s=s.split(marker)[0]+"""
          docker cp provider/vf-tools-theme_V1.35.156.zip "$WP:/tmp/theme-old.zip"
          docker cp provider/vf-tools-theme_V1.35.157.zip "$WP:/tmp/theme-new.zip"
          docker cp provider/vf-tools-m3u8_V1.25.93.zip "$WP:/tmp/plugin-old.zip"
          docker cp provider/vf-tools-m3u8_V1.25.94.zip "$WP:/tmp/plugin-new.zip"
          version_check(){ test "$(cli theme get vf-tools-theme --field=version)" = "$1" && test "$(cli plugin get vf-tool-m3u8 --field=version)" = "$2"; echo INSTALLED_VERSIONS_PASS="$1/$2"; }
          cli theme install /tmp/theme-old.zip --force >/dev/null
          cli plugin install /tmp/plugin-old.zip --force --activate >/dev/null
          version_check 1.35.156 1.25.93
          cli theme install /tmp/theme-new.zip --force >/dev/null
          cli plugin install /tmp/plugin-new.zip --force --activate >/dev/null
          version_check 1.35.157 1.25.94
          node lane/backup-guide.cjs
          cli theme install /tmp/theme-old.zip --force >/dev/null
          cli plugin install /tmp/plugin-old.zip --force --activate >/dev/null
          version_check 1.35.156 1.25.93
          cli theme install /tmp/theme-new.zip --force >/dev/null
          cli plugin install /tmp/plugin-new.zip --force --activate >/dev/null
          version_check 1.35.157 1.25.94
          cli theme install /tmp/theme-new.zip --force >/dev/null
          cli plugin install /tmp/plugin-new.zip --force --activate >/dev/null
          version_check 1.35.157 1.25.94
          cli eval-file /tmp/snapshot.php > proof/state-after.sha256
          cmp proof/state-before.sha256 proof/state-after.sha256
          echo BACKUP_GUIDE_PROTECTED_DATABASE_STATE_IDENTICAL_PASS
          echo BACKUP_GUIDE_BOTH_NATIVE_UPGRADE_ROLLBACK_REPEAT_PASS
          """
          Path('lane/backup-guide-native.sh').write_text(s)
          PYNATIVE
          bash lane/backup-guide-native.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-backup-guide157-94-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private sources
        if: always()
        run: rm -rf target theme-candidate m3u8-candidate provider
