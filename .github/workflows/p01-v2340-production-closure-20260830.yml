name: P01 V2.34 Owner Production Closure Gate

on:
  push:
    branches:
      - task/p01-v2340-production-closure-20260830
    paths:
      - .github/workflows/p01-v2340-production-closure-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      EVID: /tmp/p01-v2340-production-closure-final
    steps:
      - name: Checkout gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: runner

      - name: Checkout exact final P01 closure source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: p01

      - name: Final closure docs-only fence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git -C p01 rev-parse HEAD)" = 84f7ba02a8ab79ba6d7675c76b7d07e4895a3436
          test "$(git -C p01 rev-parse HEAD^{tree})" = 6a499ba0747c39ae5d4481c6ca50dcd867ca6ecc
          test "$(git -C p01 rev-parse HEAD:src)" = f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          git -C p01 cat-file -e 518d10f446ea85445d1110a3defafc5bcbece473^{commit}

          git -C p01 diff --name-only 518d10f446ea85445d1110a3defafc5bcbece473..HEAD | sort > "$EVID/actual-files.txt"
          cat > "$EVID/expected-files.txt" <<'EOF'
          VF_PROJECT.json
          docs/authority/ACCEPTANCE_MATRIX.md
          docs/authority/CURRENT.md
          docs/evidence/P01_V2.34.0_PRODUCTION_CLOSURE_20260830.md
          docs/evidence/P01_V2.34.0_RELEASE_CLOSURE_20260830.md
          docs/handoff/CURRENT_STATE.md
          EOF
          sort -o "$EVID/expected-files.txt" "$EVID/expected-files.txt"
          diff -u "$EVID/expected-files.txt" "$EVID/actual-files.txt"
          test -z "$(git -C p01 diff --name-only 518d10f446ea85445d1110a3defafc5bcbece473..HEAD -- src)"

          test "$(tr -d '\r\n' < p01/VERSION)" = 2.34.0
          test "$(tr -d '\r\n' < p01/src/VERSION.txt)" = 2.34.0
          grep -Fq "define('VF_VERSION', '2.34.0')" p01/src/app/bootstrap.php
          echo P01_V2340_FINAL_CLOSURE_SOURCE_FENCE=PASS | tee "$EVID/source-fence.txt"

      - name: Immutable release and upstream gate fence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.34.0 --jq .object.sha)" = 518d10f446ea85445d1110a3defafc5bcbece473
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0 --jq .id)" = 379298288
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = 8db85499605c34c6b72e664778fa709aa40dc963

          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.34.0)
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.size' <<<"$REL")" = 1366286
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.34.0_UPDATE.zip")|.digest' <<<"$REL")" = sha256:0a40b2510eec12a01b194890536d2157ed8de4e256a3ee4926813acec80bfa58

          for run in 33313092778 33314444500 33314745327 33315452296 33315524945 33315611859 33315670683 33315793899 33315897887 33316255253 33316831037; do
            test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$run --jq .conclusion)" = success
          done
          echo P01_V2340_FINAL_CLOSURE_PUBLICATION_FENCE=PASS | tee "$EVID/publication-fence.txt"

      - name: Closed authority fence
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '
            .status=="V2.34.0 OWNER PRODUCTION / PRODUCTION CLOSED" and
            .production_version=="2.34.0" and
            .schema_version=="2026082901" and
            .current_phase=="V2.34.0 OWNER PRODUCTION / PRODUCTION CLOSED / L2 OPTIMIZATION READY" and
            .production_release.version=="2.34.0" and
            .production_release.release_source=="518d10f446ea85445d1110a3defafc5bcbece473" and
            .production_release.release_tree=="90ffab51a20640a4e3f6f07122a8e6e147592f64" and
            .production_release.runtime_tree=="f3eeb66fbce3949ef50483ac4c5a821edbd15d35" and
            .production_release.production_closure_gate==33316831037 and
            .production_release.production_closure_artifact==9733701308 and
            .production_release.production_closure_artifact_sha256=="f44556785f29ea151ad3b307f2b0913f016f0803a171005c5a7ee3590efe8a85" and
            .production_release.production_closure=="PASS / CLOSED" and
            .production_release.assistant_production_write==false and
            .current_change.gates.production_closure==33316831037 and
            .current_change.owner_production.version=="2.34.0" and
            .current_change.owner_production.production_closure_gate==33316831037 and
            .current_change.owner_production.assistant_production_write==false and
            .formal_release_state=="PUBLISHED / CLOSED" and
            .current_authority=="Owner Production V2.34.0 / Production Closed"
          ' p01/VF_PROJECT.json >/dev/null

          grep -Fq '状态：`CURRENT / V2.34.0 OWNER PRODUCTION / PRODUCTION CLOSED`' p01/docs/authority/CURRENT.md
          grep -Fq '33316831037 PASS  Owner Production Closure Gate' p01/docs/authority/CURRENT.md
          grep -Fq 'State：`OWNER PRODUCTION / PRODUCTION CLOSED`' p01/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'Owner Production Closure Gate | `33316831037` / PASS' p01/docs/authority/ACCEPTANCE_MATRIX.md
          grep -Fq 'Owner Production: V2.34.0 / Schema 2026082901 / CLOSED' p01/docs/handoff/CURRENT_STATE.md
          grep -Fq '33316831037 PASS' p01/docs/evidence/P01_V2.34.0_PRODUCTION_CLOSURE_20260830.md
          grep -Fq '**V2.34.0 = OWNER PRODUCTION / PRODUCTION CLOSED.**' p01/docs/evidence/P01_V2.34.0_PRODUCTION_CLOSURE_20260830.md
          echo P01_V2340_FINAL_CLOSED_AUTHORITY=PASS | tee "$EVID/closed-authority.txt"

      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$EVID/verdict.txt" <<'EOF'
          P01_V2340_FINAL_CLOSURE_METADATA_FENCE=PASS
          FINAL_CLOSURE_SOURCE=84f7ba02a8ab79ba6d7675c76b7d07e4895a3436
          FINAL_CLOSURE_TREE=6a499ba0747c39ae5d4481c6ca50dcd867ca6ecc
          FORMAL_SOURCE=518d10f446ea85445d1110a3defafc5bcbece473
          RUNTIME_TREE=f3eeb66fbce3949ef50483ac4c5a821edbd15d35
          OWNER_PRODUCTION=2.34.0
          PRODUCTION_CLOSURE_GATE=33316831037
          ASSISTANT_PRODUCTION_WRITE=NO
          EOF
          cat "$EVID/verdict.txt"

      - name: Upload final closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2340-final-closure-metadata-${{ github.run_id }}
          path: ${{ env.EVID }}
          retention-days: 90
