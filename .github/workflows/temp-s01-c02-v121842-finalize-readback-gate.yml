name: TEMP S01-C02 Ops 1.21.842 Finalize Durable Readback Gate
on:
  push:
    branches:
      - temp/s01-c02-v121842-finalize-readback-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121842-finalize-readback-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_COMMIT: 3bc8b87ccaa19c9eff472e971a9ab513f5b88478
      PRODUCT_TREE: d138d30e51476aa5dff64c4755da961f621bd705
      PRODUCT_BASE: 15c77949d10b55ad3c14e682cea6feaca05eed66
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: ops
      - name: Verify identity syntax phase3 and exact five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.842
          php -l ops/includes/release/steps/class-step-finalize-candidate.php >/dev/null
          php -l ops/includes/site-release/s01-static-finalize-readback-retry-v121842.php >/dev/null
          php -l ops/vf-ops.php >/dev/null
          php -l ops/.github/phase3/v121842-finalize-durable-readback-closure.php >/dev/null
          php ops/.github/phase3/v121842-finalize-durable-readback-closure.php | grep -Fxq PASS_V121842_FINALIZE_DURABLE_READBACK_CLOSURE
          mapfile -t files < <(git -C ops diff --name-only "$PRODUCT_BASE" "$PRODUCT_COMMIT" | sort)
          expected=(
            .github/phase3/v121842-finalize-durable-readback-closure.php
            VERSION
            includes/release/steps/class-step-finalize-candidate.php
            includes/site-release/s01-static-finalize-readback-retry-v121842.php
            vf-ops.php
          )
          test "${#files[@]}" = "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
      - name: Verify large-package finalize is readback-only and fail-closed
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/includes/release/steps/class-step-finalize-candidate.php
          grep -Fq "A5_PIPELINE_LARGE_PACKAGE_BATCHED" "$f"
          grep -Fq "helperFiles' => 'already_finalized'" "$f"
          grep -Fq "assert_durable_readback" "$f"
          grep -Fq 'if ($zip->close() !== true)' "$f"
          grep -Fq '$readback->open($path)' "$f"
          grep -Fq 'if ($readback->close() !== true)' "$f"
          grep -Fq "'_headers','_redirects','release-health.json','static-release-report.json','VERSION.txt','candidate-actions.json','index.html','sitemap.xml','sitemap_index.xml'" "$f"
          b=ops/includes/release/builders/class-candidate-batch-builder.php
          grep -Fq '$state['"'"'helper_phase'"'"'] = '"'"'done'"'"'' "$b"
          grep -Fq '$state['"'"'helpers_written'"'"'] = true' "$b"
      - name: Verify fresh Candidate rearm is bounded and Source preserving
        shell: bash
        run: |
          set -Eeuo pipefail
          f=ops/includes/site-release/s01-static-finalize-readback-retry-v121842.php
          grep -Fq 'vf_ops_s01_static_recovery_continuation_inspection_v121829()' "$f"
          grep -Fq 'VF_Ops_Release_Async_Job::sync_record($inspectionJob)' "$f"
          grep -Fq 'vf_ops_publish_release_prepare_candidate_v121771($inspectionId)' "$f"
          grep -Fq 'vf_ops_s01_static_zero_write_retry_store_v121834' "$f"
          grep -Fq 'vf_ops_s01_static_zero_write_retry_schedule_v121834(1)' "$f"
          grep -Fq 'vf_ops_s01_static_zero_write_retry_worker_v121834()' "$f"
          ! grep -Eq 'wp_insert_post|wp_update_post|wp_delete_post|TRUNCATE|DROP TABLE|DELETE FROM|move_uploaded_file|wp_handle_upload' "$f"
          ! grep -Eq 'run_next_stage|Async_Job::save|candidatePackageReady.*true|finalOnlinePass.*PASS' "$f"
      - name: Verify Product authority before promotion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_BASE"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_BASE"
      - name: Verify Production 1.21.841 exact pre-fix truth
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.841" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.841" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO" and .activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractClassifiedCount==0 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobInternalLinkFailureLeafCount==0 and .activeStaticJobInternalLinkUniqueTargetCount==0' /tmp/static.json >/dev/null
      - name: Verify runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121842_FINALIZE_DURABLE_READBACK_GATE
