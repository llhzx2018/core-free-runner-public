name: P04 V2.7 UA Direction Regression
on:
  push:
    branches: [p04-v270-integration-gate]
    paths: [.github/workflows/p04-v270-ua-direction.yml]
permissions:
  contents: write
jobs:
  ua:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: p04-v270-integration-gate}
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: integration/v2.7.0-personal-infra
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run accepted direction gate
        shell: bash
        run: |
          set +e
          result=/tmp/p04-v270-ua-direction.json
          cd private
          src=$(grep -rl --include='*.sh' 'v260-user-task-fixture.php' scripts tests 2>/dev/null | head -n1)
          if [ -z "$src" ] && [ -f scripts/run-v258-browser-gate.sh ]; then src=scripts/run-v258-browser-gate.sh; fi
          if [ -z "$src" ]; then printf '{"status":"FAIL","failed":"NO_HARNESS"}\n' > "$result"; exit 0; fi
          tmp="$(dirname "$src")/.v270-ua-direction.sh"; cp "$src" "$tmp"; chmod +x "$tmp"
          python3 - "$tmp" <<'PY'
          import re,sys
          p=sys.argv[1];s=open(p,encoding='utf-8').read();s=re.sub(r'tests/e2e/[A-Za-z0-9._/-]+\.mjs','tests/e2e/v270-ua-direction-regression.mjs',s);open(p,'w',encoding='utf-8').write(s)
          PY
          VF_V270_UA_RESULT="$result" bash "$tmp" >/tmp/v270-ua.log 2>&1
          rc=$?;rm -f "$tmp";if [ ! -s "$result" ];then printf '{"status":"FAIL","failed":"HARNESS","exit":%s}\n' "$rc" > "$result";fi
          exit 0
      - name: Publish safe UA result
        if: always()
        shell: bash
        run: |
          mkdir -p evidence;cp /tmp/p04-v270-ua-direction.json evidence/p04-v270-ua-direction.json || printf '{"status":"FAIL"}\n' > evidence/p04-v270-ua-direction.json
          rm -f evidence/p04-v270-ua-direction.PASS
          if jq -e '.status=="PASS" and ([.checks[]]|all)' evidence/p04-v270-ua-direction.json >/dev/null;then printf 'P04_V270_ACCEPTED_UA_DIRECTION_PASS\n' > evidence/p04-v270-ua-direction.PASS;fi
          rm -rf private /tmp/v270-ua.log /tmp/p04-v270-ua-direction.json
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A evidence/p04-v270-ua-direction.*;git commit -m 'evidence(P04): V2.7 accepted UA direction result' || exit 0;git push origin HEAD:p04-v270-integration-gate
