name: S01 M3U8 1.25.47 Dropdown Interaction R19 Formal Release

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c03-m3u8-12547-formal-release-20260925.yml'

permissions:
  contents: read
  actions: read

jobs:
  release:
    if: github.head_ref == 'task/s01-c03-m3u8-12547-formal-release-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-m3u8
      SHA: aa42bba5ee2b1ff898eed9ebdf41a9707239952f
      VERSION: 1.25.47
      TAG: v1.25.47
      ASSET: vf-tools-m3u8_V1.25.47.zip
      PREVIOUS_TAG: v1.25.46
      PREVIOUS_ASSET: vf-tools-m3u8_V1.25.46.zip
    steps:
      - name: Credential presence
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact M3U8 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: aa42bba5ee2b1ff898eed9ebdf41a9707239952f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8
          persist-credentials: false

      - name: Exact source and R17-R19 Header contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.25.47' m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.47'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R269'" m3u8/src/vf-tool-m3u8.php
          grep -Fq 'R17 · Unified compact Professional Mode dropdown' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:272px!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'R18 · Compact primary nav hit-area parity' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:112px!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:132px!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'R19 Header dropdown interaction parity with OPS' m3u8/src/admin/admin-s01-human-language-final.js
          grep -Fq "addEventListener('toggle'" m3u8/src/admin/admin-s01-human-language-final.js
          grep -Fq "event.key !== 'Escape'" m3u8/src/admin/admin-s01-human-language-final.js
          grep -Fq "addEventListener('pointerdown'" m3u8/src/admin/admin-s01-human-language-final.js
          grep -Fq ".vf-v6-domain-flyout a" m3u8/src/admin/admin-s01-human-language-final.js
          grep -Fq "details.open = false" m3u8/src/admin/admin-s01-human-language-final.js
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/unit/package-physical-locator-contract.php

      - name: PHP syntax and package security fence
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find m3u8/src -type f -name '*.php' -print0 | sort -z)
          test "$(find m3u8/src -type l | wc -l)" = "0"
          ! find m3u8/src -type f | grep -E '/(?:\.env|wp-config\.php)$'
          ! find m3u8/src -type f | grep -Ei '\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$'

      - name: Build deterministic package and Runtime Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tool-m3u8 stage2/vf-tool-m3u8 dist previous
          cp -a m3u8/src/. stage1/vf-tool-m3u8/
          cp -a m3u8/src/. stage2/vf-tool-m3u8/
          rm -f stage1/vf-tool-m3u8/README.md stage1/vf-tool-m3u8/PACKAGE_PROFILE.json
          rm -f stage2/vf-tool-m3u8/README.md stage2/vf-tool-m3u8/PACKAGE_PROFILE.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage1/vf-tool-m3u8')
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/count').write_text(str(len(rows)))
          Path('/tmp/fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          test "$(cat /tmp/count)" = "564"
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tool-m3u8)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tool-m3u8)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tool-m3u8"
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.47'
          ! unzip -Z1 "dist/$ASSET" | grep -E '(^|/)(\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)'
          ! unzip -Z1 "dist/$ASSET" | grep -Ei '\.(sql|sqlite|sqlite3|db|log|tar|gz|bak|tmp)$'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/sha
          stat -c '%s' "dist/$ASSET" > /tmp/bytes

      - name: Previous release rollback source
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.46'

      - name: Publish and remote-readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          else
            cat > /tmp/notes.md <<EOF
          # VF Tools M3U8 V1.25.47
          S01-C03 Dropdown Interaction Parity R19.
          - Aligns Professional Mode with the OPS transient dropdown behavior.
          - Adds outside-pointer close, Escape close with focus restoration, destination-click close and single-open behavior.
          - Preserves R17 272px dropdown, R18 compact primary Header, seven canonical destinations and one Chevron.
          - Interaction-only; no Provider algorithm, route, state or schema change.
          - Post-production OWNER interaction verification remains required.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools M3U8 $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools M3U8 V$VERSION" --notes-file /tmp/notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/bytes)"; lsha="$(cat /tmp/sha)"
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          mkdir -p /tmp/readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/readback --clobber
          test "$(sha256sum "/tmp/readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/readback/$ASSET"
          cat > /tmp/receipt.json <<EOF
          {"component_id":"S01-C03","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/count),"runtime_fingerprint":"$(cat /tmp/fp)","schema_from":"1.3.0","schema_to":"1.3.0","remote_readback":"PASS"}
          EOF

      - name: Upload receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-12547-formal-release-${{ github.run_id }}
          path: /tmp/receipt.json
          if-no-files-found: error
          retention-days: 30
