name: S01 Fine Polish R3 Human Language Gate

on:
  push:
    branches:
      - task/s01-fine-polish-r3-human-language-gate
    paths:
      - .github/workflows/s01-fine-polish-r3-human-language-gate.yml

permissions:
  contents: read

jobs:
  exact:
    name: R3 Exact (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: OPS
            repo: llhzx2018/vf-tools-ops
            base: 7425508f9dc362540760e5c338352dc28974c883
            head: 427d33c748739fae0ddfc7821293b4931fdad0c2
            test: tests/s01-c02-page-body-v2-fine-polish-r3-human-language-contract.php
            full: tests/s01-c02-page-body-v2-fine-polish-r1-full-surface-contract.php
            macro: tests/s01-c02-page-body-system-v2-full-surface-contract.php
            allowed: includes/admin-v13/views/integrations.php,includes/admin-v13/views/system_recovery.php,tests/s01-c02-page-body-v2-fine-polish-r3-human-language-contract.php
            phpfiles: includes/admin-v13/views/integrations.php,includes/admin-v13/views/system_recovery.php,tests/s01-c02-page-body-v2-fine-polish-r3-human-language-contract.php
          - component: THEME
            repo: llhzx2018/vf-tools-theme
            base: 887186ef985e551c717b086ae18983bb8558192a
            head: a553141c80d5a3036ad59925dc3e82e977df518d
            test: tests/s01-c01-page-body-v2-fine-polish-r3-human-language-contract.php
            full: tests/s01-c01-page-body-v2-fine-polish-r1-full-surface-contract.php
            macro: tests/s01-c01-page-body-system-v2-full-surface-contract.php
            allowed: src/inc/admin/views/render.php,tests/s01-c01-page-body-v2-fine-polish-r3-human-language-contract.php
            phpfiles: src/inc/admin/views/render.php,tests/s01-c01-page-body-v2-fine-polish-r3-human-language-contract.php
          - component: M3U8
            repo: llhzx2018/vf-tools-m3u8
            base: 8e9269ecb0615f57dca26e70cabf9f28f9e3af76
            head: c68af840305e7d6d79c1a9c19969bb54fb64d983
            test: tests/s01-c03-page-body-v2-fine-polish-r3-human-language-contract.php
            full: tests/s01-c03-page-body-v2-fine-polish-r1-full-surface-contract.php
            macro: tests/s01-c03-page-body-system-v2-full-surface-contract.php
            allowed: src/admin/Controller/class-v6-provider-contracts-controller.php,src/admin/Controller/class-v6-provider-fixtures-controller.php,src/admin/Controller/class-v6-provider-operations-controller.php,src/admin/pages/acceptance-overview.php,src/admin/pages/acceptance-real.php,src/admin/pages/acceptance-evidence.php,src/admin/pages/runtime.php,tests/s01-c03-page-body-v2-fine-polish-r3-human-language-contract.php
            phpfiles: src/admin/Controller/class-v6-provider-contracts-controller.php,src/admin/Controller/class-v6-provider-fixtures-controller.php,src/admin/Controller/class-v6-provider-operations-controller.php,src/admin/pages/acceptance-overview.php,src/admin/pages/acceptance-real.php,src/admin/pages/acceptance-evidence.php,src/admin/pages/runtime.php,tests/s01-c03-page-body-v2-fine-polish-r3-human-language-contract.php

    steps:
      - name: Credential
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"

      - name: Exact source + bounded diff
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          REPO: ${{ matrix.repo }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          ALLOWED: ${{ matrix.allowed }}
        run: |
          set -Eeuo pipefail
          curl -fsSL -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/compare/$BASE...$HEAD" -o /tmp/compare.json
          test "$(jq -r '.status' /tmp/compare.json)" = "ahead"
          IFS=',' read -r -a EXPECTED <<< "$ALLOWED"
          mapfile -t ACTUAL < <(jq -r '.files[].filename' /tmp/compare.json | sort)
          mapfile -t WANT < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          diff -u <(printf '%s\n' "${WANT[@]}") <(printf '%s\n' "${ACTUAL[@]}")

          rm -rf /tmp/src /tmp/src.tar.gz
          mkdir -p /tmp/src
          curl -fsSL -L -H "Authorization: Bearer $READ_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/tarball/$HEAD" -o /tmp/src.tar.gz
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          SOURCE_DIR="$(find /tmp/src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "BOUNDED_DIFF=PASS"

      - name: PHP syntax
        env:
          PHPFILES: ${{ matrix.phpfiles }}
        run: |
          set -Eeuo pipefail
          IFS=',' read -r -a FILES <<< "$PHPFILES"
          for rel in "${FILES[@]}"; do php -l "$SOURCE_DIR/$rel"; done
          echo "PHP_SYNTAX=PASS"

      - name: Human-language + inherited contracts
        env:
          TEST: ${{ matrix.test }}
          FULL: ${{ matrix.full }}
          MACRO: ${{ matrix.macro }}
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          php "$SOURCE_DIR/$TEST"
          php "$SOURCE_DIR/$FULL"
          php "$SOURCE_DIR/$MACRO"
          if [ "$COMPONENT" = "M3U8" ]; then
            php "$SOURCE_DIR/tests/unit/package-physical-locator-contract.php"
            php "$SOURCE_DIR/tests/unit/update-schema-authority-contract.php"
          fi
          echo "INHERITED_CONTRACTS=PASS"

      - name: Release identity must remain unchanged
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -Eeuo pipefail
          case "$COMPONENT" in
            OPS) test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "1.21.951";;
            THEME) test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "1.35.52";;
            M3U8) test "$(tr -d '\r\n' < "$SOURCE_DIR/VERSION")" = "1.25.55";;
          esac
          echo "SOURCE_ONLY_IDENTITY=PASS"

      - name: Summary
        run: |
          echo "FINE_POLISH_R3_HUMAN_LANGUAGE=PASS"
          echo "V2_MACRO=FROZEN"
          echo "SHELL_HEADER_MENU=FROZEN"
          echo "FORMAL_RELEASE=NOT_EXECUTED"
          echo "PRODUCTION=NOT_EXECUTED"
