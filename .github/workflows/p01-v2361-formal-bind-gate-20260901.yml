name: P01 V2.36.1 Formal Bind Gate
on:
  push:
    branches: [release/p01-v2361-candidate-20260901]
    paths: [.github/workflows/p01-v2361-formal-bind-gate-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: e7bc22e6b62112e1ef53f2e5fb0a89a56ec7bf63
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: formal
      - name: Exact one-file Candidate PASS binding
        shell: bash
        run: |
          set -Eeuo pipefail
          cd formal
          test "$(git rev-parse HEAD)" = 'e7bc22e6b62112e1ef53f2e5fb0a89a56ec7bf63'
          test "$(git rev-parse HEAD^1)" = '411404af399fc13856d71faec1ab4a6633a73ba3'
          actual="$(git diff --name-only HEAD^1..HEAD | tr '\n' ' ')"
          test "$actual" = 'VF_PROJECT.json '
          test "$(git rev-parse HEAD:src)" = '91f92c5d3e7080469a7f5ab1497145454014c87a'
          test "$(git rev-parse HEAD:database)" = "$(git rev-parse HEAD^1:database)"
          python3 -m json.tool VF_PROJECT.json >/dev/null
          jq -e '.candidate_state=="PASS" and .v2_36_1_candidate_gate.run==33472637909 and .v2_36_1_candidate_gate.artifact==9787058642 and .v2_36_1_candidate_gate.artifact_digest=="sha256:1e6dfd1aa9b7612f5ccf0b85bc46919979f224a0e75734680bce0de2b0ebcf60" and .v2_36_1_candidate_gate.atomic_upgrade=="2.36.0 -> 2.36.1 / PASS" and .production_version=="2.36.0" and .candidate_version=="2.36.1"' VF_PROJECT.json >/dev/null
          git diff --check HEAD^1..HEAD
          echo 'P01_V2361_FORMAL_BIND=PASS'
          echo 'SRC_ZERO_CHANGE=PASS'
          echo 'SCHEMA_MIGRATION_ZERO_CHANGE=PASS'
