name: Core Updates P01 V2.35.1 Manifest Gate
on:
  push:
    branches: [release/p01-v2350-orchestrator-20260831]
    paths: [.github/workflows/core-updates-p01-v2350-manifest-gate-20260831.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-updates
          ref: a7a601e0880becb78c9835648d06dcda2625b2dc
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: updates
      - name: Verify manifest and published release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=2b04f8fbcc0424f10d073c7382a3df52dd9d5e09
          CANDIDATE=a7a601e0880becb78c9835648d06dcda2625b2dc
          PRODUCT=eb36fd19d269aed4ef4246c2c18f172b2c761bde
          ASSET_SHA=e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af
          test "$(git -C updates rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C updates merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git -C updates diff --name-only "$BASE"...HEAD)" = projects/P01.json
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/33340348260 --jq .conclusion)" = success
          M=updates/projects/P01.json
          jq -e '
            .schema_version=="1.0" and
            .project_id=="P01" and .component_id=="APP" and .enabled==true and
            .current_version=="2.35.0" and .target_version=="2.35.1" and
            .update_type=="ATOMIC" and .from_versions==["2.35.0"] and
            .schema_from=="2026082901" and .schema_to=="2026082901" and
            .repository=="llhzx2018/vf-start" and .release_tag=="v2.35.1" and
            .release_id==379424818 and
            .product_identity=="eb36fd19d269aed4ef4246c2c18f172b2c761bde" and
            .asset_name=="VF_Start_V2.35.1_UPDATE.zip" and
            .asset_bytes==1376805 and
            .asset_sha256=="e6e40b77d75319f24ea4e0e803863a1b5ffffcdf2f3405d62dc9399cbc7114af" and
            .backup_required==true and .rollback_supported==true and
            .released_at=="2026-08-30T22:53:44Z" and .minimum_php=="8.0.0"
          ' "$M" >/dev/null
          TAG=$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.35.1)
          test "$(jq -r .object.sha <<<"$TAG")" = "$PRODUCT"
          REL=$(gh api repos/llhzx2018/vf-start/releases/tags/v2.35.1)
          test "$(jq -r .id <<<"$REL")" = 379424818
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq '.assets|length' <<<"$REL")" = 8
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.1_UPDATE.zip")|.size' <<<"$REL")" = 1376805
          test "$(jq -r '.assets[]|select(.name=="VF_Start_V2.35.1_UPDATE.zip")|.digest' <<<"$REL")" = "sha256:$ASSET_SHA"
          rm -rf /tmp/p01-v2351-manifest-asset && mkdir -p /tmp/p01-v2351-manifest-asset
          gh release download v2.35.1 --repo llhzx2018/vf-start --pattern VF_Start_V2.35.1_UPDATE.zip --dir /tmp/p01-v2351-manifest-asset
          A=/tmp/p01-v2351-manifest-asset/VF_Start_V2.35.1_UPDATE.zip
          test "$(stat -c%s "$A")" = 1376805
          echo "$ASSET_SHA  $A" | sha256sum -c -
          unzip -Z1 "$A" | grep -Fx repair-v2.35.1.php >/dev/null
          cp "$M" /tmp/P01-V2.35.1-manifest.json
          jq -n --arg candidate "$CANDIDATE" --arg base "$BASE" --arg asset_sha "$ASSET_SHA" '{candidate:$candidate,base:$base,manifest_gate:"PASS",release_id:379424818,tag:"v2.35.1",asset_bytes:1376805,asset_sha256:$asset_sha,owner_production_write:false}' >/tmp/P01-V2.35.1-manifest-gate.json
          echo CORE_UPDATES_P01_V2351_MANIFEST_GATE=PASS
          echo READY_FOR_CORE_UPDATES_MAIN_PROMOTION=YES
          echo OWNER_PRODUCTION_WRITE=NO
      - name: Upload manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: p01-v2351-core-updates-manifest-${{ github.run_id }}
          path: |
            /tmp/P01-V2.35.1-manifest.json
            /tmp/P01-V2.35.1-manifest-gate.json
          if-no-files-found: error
          retention-days: 90
