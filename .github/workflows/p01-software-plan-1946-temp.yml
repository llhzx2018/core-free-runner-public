name: p01-software-plan-parity-1946
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-software-plan-1946-temp.yml'
      - 'specs/p01_software_plan_parity_1946.json'
      - 'templates/p01_software_plan_1946.yml.in'
permissions:
  contents: read
jobs:
  exact-software:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      WORK: /tmp/p01-software-plan-${{ github.run_id }}
      TARGET_REPO: llhzx2018/vf-start
      TARGET_VERSION: 2.47.504
      TARGET_SHA: f628e2ec8b9e691bec2f92279ccfe6fc238cde15
      TARGET_TREE: 9fa7b23d69546987afaf9b623bf712e170069f6f
      HEAD_BRANCH: feat/p01-cross-subsite-legacy-watch-tmdb-parity
      BASE_SHA: 465890414fa9981af3ac8797c65f84f75db0d946
    steps:
      - name: Checkout registered public-safe Runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify rendered exact identity before touching private source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$WORK"
          python3 scripts/ephemeral_lane_spec.py validate --spec specs/p01_software_plan_parity_1946.json >/dev/null
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/p01_software_plan_parity_1946.json --input .github/workflows/p01-software-plan-1946-temp.yml
          python3 scripts/ephemeral_lane_spec.py render --spec specs/p01_software_plan_parity_1946.json --template templates/p01_software_plan_1946.yml.in --output "$WORK/rendered.yml"
          cmp "$WORK/rendered.yml" .github/workflows/p01-software-plan-1946-temp.yml
          echo P01_SOFTWARE_PLAN_EXACT_RENDER=PASS
      - name: Verify transient P01 exact SHA tree and diff scope
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          set +x
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote" = "$TARGET_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$TARGET_REPO.git" "$WORK/candidate"
          git -C "$WORK/candidate" checkout -q --detach "$TARGET_SHA"
          git -C "$WORK/candidate" remote set-url origin "https://github.com/$TARGET_REPO.git"
          test "$(git -C "$WORK/candidate" rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C "$WORK/candidate" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test "$(tr -d '\r\n ' < "$WORK/candidate/VERSION")" = "$TARGET_VERSION"
          git -C "$WORK/candidate" cat-file -e "$BASE_SHA^{commit}"
          git -C "$WORK/candidate" diff --name-only "$BASE_SHA" "$TARGET_SHA" | sort > "$WORK/diff.txt"
          printf '%s\n' src/assets/frontstage-legacy-entry.js src/assets/global-remote-music.js src/assets/global-remote-software.js src/assets/global-remote-sources.js src/assets/local-subsite-management.js src/settings.php tests/unit/p01_ia5_remote_music_quick_r48_contract.cjs tests/unit/p01_ia5_remote_software_r39_contract.cjs tests/unit/p01_ia6_governed_source_uncertain_post_contract.cjs tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs tests/unit/p01_ia6_music_remote_unknown_readback_guard_contract.cjs tests/unit/p01_ia6_software_browser_plan_parity_contract.cjs tests/unit/p01_ia6_toolbox_group_delete_remap_contract.cjs tests/unit/p01_ia6_tools_acknowledged_write_readback_guard_contract.cjs | sort > "$WORK/expected.txt"
          cmp "$WORK/expected.txt" "$WORK/diff.txt"
          echo P01_SOFTWARE_PLAN_14_FILE_SCOPE=PASS
      - name: Execute actual local Software editor and related regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORK/candidate"
          for file in src/assets/global-remote-software.js src/assets/software-workspace.js tests/unit/p01_ia6_software_browser_plan_parity_contract.cjs; do node --check "$file"; done
          node tests/unit/p01_ia6_software_browser_plan_parity_contract.cjs
          node tests/unit/p01_ia5_remote_software_r39_contract.cjs
          node tests/unit/p01_ia5_derived_tools_software_r26_contract.cjs
          node tests/unit/p01_ia6_governed_source_uncertain_post_contract.cjs
          node tests/unit/p01_ia6_tools_acknowledged_write_readback_guard_contract.cjs
          node tests/unit/p01_ia6_music_remote_unknown_readback_guard_contract.cjs
          node tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs
          echo P01_SOFTWARE_NATIVE_OWNER_PLAN_BEHAVIOR=PASS
      - name: Always remove private source and work files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_SOFTWARE_PUBLIC_ARTIFACT=NONE
          echo P01_SOFTWARE_PRODUCTION_WRITE=NONE
          case "$WORK" in /tmp/p01-software-plan-*) rm -rf -- "$WORK";; *) exit 66;; esac
