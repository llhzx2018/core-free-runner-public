name: TEMP skill-book V4.6 Governance Reconcile via V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-skill-book-v46-candidate-release-v2.yml'

permissions:
  contents: read

concurrency:
  group: temp-skill-book-v46-governance-reconcile-v2
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout temporary runner branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          path: runner

      - name: Verify V4.6 published Candidate governance
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN_MISSING' >&2; exit 78; }
          test -f runner/.github/scripts/temp_v46_governance_reconcile.py
          python3 runner/.github/scripts/temp_v46_governance_reconcile.py

# final read-only verification revision: 2
