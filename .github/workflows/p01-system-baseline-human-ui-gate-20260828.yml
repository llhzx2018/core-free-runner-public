name: P01 System Baseline Human UI Exact Source Gate

on:
  push:
    paths:
      - '.github/workflows/p01-system-baseline-human-ui-gate-20260828.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXACT_SOURCE: 50cb7f5ab672abfbbadbddf3395b605d2d6a383e
      BASE_SOURCE: 5b6f8c63b0040deaa60e69f08a7cec33e31a052b
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout exact P01 source
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" p01 >/dev/null 2>&1
          cd p01
          git checkout --detach "$EXACT_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          git fetch origin "$BASE_SOURCE" --depth=1
          test "$(git merge-base "$BASE_SOURCE" "$EXACT_SOURCE")" = "$BASE_SOURCE"
          echo P01_EXACT_CHECKOUT=PASS

      - name: Exact three-file scope fence
        run: |
          set -Eeuo pipefail
          cd p01
          git diff --name-only "$BASE_SOURCE" "$EXACT_SOURCE" | sort > /tmp/p01-files.txt
          cat /tmp/p01-files.txt
          cat > /tmp/p01-expected.txt <<'EOF'
          CHANGELOG.md
          src/system-baseline.php
          tests/unit/system_baseline_human_ui_contract.php
          EOF
          diff -u /tmp/p01-expected.txt /tmp/p01-files.txt
          git diff --quiet "$BASE_SOURCE" "$EXACT_SOURCE" -- src/app/CommonBaseline.php
          git diff --check "$BASE_SOURCE" "$EXACT_SOURCE"
          echo P01_SCOPE_FENCE=PASS
          echo P01_BASELINE_RUNTIME_LOGIC_UNCHANGED=PASS

      - name: Human-readable UI contract
        run: |
          set -Eeuo pipefail
          cd p01
          php -l src/system-baseline.php
          php -l tests/unit/system_baseline_human_ui_contract.php
          php tests/unit/system_baseline_human_ui_contract.php
          grep -Fq "'PASS' => ['label'=>'正常'" src/system-baseline.php
          grep -Fq "'DRIFT' => ['label'=>'需要处理'" src/system-baseline.php
          grep -Fq '技术详情（给开发 / 排障使用）' src/system-baseline.php
          grep -Fq '<details class="vf-baseline-tech">' src/system-baseline.php
          ! grep -Fq '<h2>Effective 参数</h2>' src/system-baseline.php
          echo P01_HUMAN_UI=PASS

      - name: Current repository baseline regression
        run: |
          set -Eeuo pipefail
          cd p01
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('.')
          version=(root/'VERSION').read_text(encoding='utf-8').strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',version),version
          assert (root/'src/VERSION.txt').read_text(encoding='utf-8').strip()==version
          boot=(root/'src/app/bootstrap.php').read_text(encoding='utf-8')
          m=re.search(r"define\('VF_VERSION',\s*'([^']+)'\);",boot)
          assert m and m.group(1)==version
          project=json.loads((root/'VF_PROJECT.json').read_text(encoding='utf-8'))
          assert project.get('project_id')=='P01'
          assert str(project.get('schema_version',''))=='2026082801'
          gate=json.loads((root/'REMOTE_IMPORT_GATE_REPORT.json').read_text(encoding='utf-8'))
          assert gate.get('overall')=='PASS'
          print(f'P01_REPOSITORY_CONTRACT=PASS version={version} schema=2026082801')
          PY
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_FULL_SYNTAX=PASS

      - name: Final verdict
        run: |
          echo 'P01_SYSTEM_BASELINE_HUMAN_UI_MACHINE=PASS'
          echo 'Release=NO Tag=NO Production=NO'
