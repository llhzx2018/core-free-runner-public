name: P01 Five Domain Visual Audit
on:
  push:
    branches: [task/p01-five-domain-visual-audit-20260831]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      SOURCE: 312a22a1a1ea005e28e5b93d879e1d0cb128ad6f
      ROOT: /tmp/p01-five-domain-audit
      EVID: /tmp/p01-five-domain-audit-evid
      PORT: 18371
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          fetch-depth: 0
          path: product
      - name: Exact source
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(cat product/VERSION)" = '2.34.0'
          echo P01_FIVE_DOMAIN_SOURCE=PASS
      - name: Fresh runtime fixture
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT" "$EVID"
          cp -a product/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" >/tmp/p01-five-domain-server.log 2>&1 & echo $! >/tmp/p01-five-domain.pid
          sleep 1
          curl -fsS -c /tmp/p01-five-domain.cookies -b /tmp/p01-five-domain.cookies "http://127.0.0.1:$PORT/setup.php" -o /tmp/p01-five-domain-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-five-domain-setup.html',encoding='utf-8').read()
          print(re.search(r'name="setup_csrf"\s+value="([^"]+)"',s).group(1))
          PY
          )
          curl -fsS -c /tmp/p01-five-domain.cookies -b /tmp/p01-five-domain.cookies -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=Five Domain Audit' --data-urlencode 'admin_password=FiveDomain2026' --data-urlencode 'admin_password_confirm=FiveDomain2026' -o /tmp/p01-five-domain-post.html
          cat >/tmp/p01-five-domain-seed.php <<'PHP'
          <?php
          require '/tmp/p01-five-domain-audit/app/bootstrap.php';
          require_once '/tmp/p01-five-domain-audit/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db()); $s=new VfSurfaceRepository(vf_db());
          $c1=$r->createCategory(['name'=>'开发工具','description'=>'','is_private'=>false]);
          $c2=$r->createCategory(['name'=>'常用服务','description'=>'','is_private'=>false]);
          for($i=1;$i<=8;$i++){
            $r->saveLink(null,['category_id'=>$i%2?$c1:$c2,'title'=>'导航资源 '.$i,'url'=>'https://example.com/start-'.$i,'description'=>'用于五域视觉验证的导航资源','tags'=>'工具,验证','is_private'=>$i===8,'is_favorite'=>$i<=2],'manual');
          }
          foreach(['技术频道','商业频道','效率频道','设计频道','叙事频道','研究频道'] as $i=>$name){
            $x=$r->saveLink(null,['category_id'=>$c1,'title'=>$name,'url'=>'https://example.com/channel-'.$i,'description'=>'长期订阅频道','tags'=>'频道','is_private'=>$i===5,'is_favorite'=>$i===0],'manual');
            $s->upsertProfile((int)$x['id'],['surface'=>'channels','resource_kind'=>$i<3?'技术':'知识','surface_note'=>'适合持续关注','background_friendly'=>$i%2===0]);
          }
          foreach(['山海剧集','城市电影','历史纪录片','科幻剧集','喜剧电影','人物纪录片'] as $i=>$name){
            $x=$r->saveLink(null,['category_id'=>$c2,'title'=>$name,'url'=>'https://example.com/watch-'.$i,'description'=>'影视条目','tags'=>'影视','is_private'=>$i===5,'is_favorite'=>$i===1],'manual');
            $s->upsertProfile((int)$x['id'],['surface'=>'watch','resource_kind'=>$i%3===2?'纪录片':($i%2?'电影':'剧集'),'media_year'=>2021+$i,'media_status'=>$i%2?'watched':'watching','surface_note'=>'视觉验证条目']);
          }
          foreach(['独立网站出海指南','VPS 迁移专题','Web 安全学习路线','SEO 赚钱完整指南'] as $i=>$name){
            $x=$r->saveLink(null,['category_id'=>$c1,'title'=>$name,'url'=>'https://example.com/topic-'.$i,'description'=>'长期专题知识页','tags'=>'专题,指南','is_private'=>$i===3,'is_favorite'=>$i===0],'manual');
            $s->upsertProfile((int)$x['id'],['surface'=>'topics','resource_kind'=>$i%2?'学习路线':'指南','surface_note'=>'长期维护']);
          }
          echo "P01_FIVE_DOMAIN_SEED=PASS\n";
          PHP
          php /tmp/p01-five-domain-seed.php | grep -Fx P01_FIVE_DOMAIN_SEED=PASS
      - name: Chromium stable frames
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID" /tmp/p01-five-domain-pw
          cd /tmp/p01-five-domain-pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >audit.cjs <<'JS'
          const {chromium}=require('playwright'),fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1440,height:1000}});
            const login=await context.request.post('http://127.0.0.1:18371/api.php?action=login',{data:{password:'FiveDomain2026'}});
            if(!login.ok()||!(await login.json()).ok)throw Error('login failed');
            const page=await context.newPage();
            const routes=[['home','home.php'],['start','start.php'],['channels','channels.php'],['watch','watch.php'],['topics','topics.php']];
            const metrics={};
            for(const [name,route] of routes){
              await page.setViewportSize({width:1440,height:1000});
              await page.goto('http://127.0.0.1:18371/'+route,{waitUntil:'networkidle'}); await page.waitForTimeout(160);
              metrics[name]={desktop:await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,nav:!!document.querySelector('.vf-global-domain-nav'),sidebar:document.querySelector('.vf-app-sidebar')?.getBoundingClientRect().width||0,stage:document.querySelector('.vf-app-stage')?.getBoundingClientRect().width||0}))};
              if(metrics[name].desktop.overflow>1||!metrics[name].desktop.nav)throw Error(name+' desktop shell '+JSON.stringify(metrics[name].desktop));
              await page.screenshot({path:process.env.EVID+'/'+name+'-1440-light.png'});
              await page.evaluate(()=>document.documentElement.setAttribute('data-theme','dark')); await page.waitForTimeout(80);
              await page.screenshot({path:process.env.EVID+'/'+name+'-1440-dark.png'});
              await page.setViewportSize({width:390,height:844});
              await page.goto('http://127.0.0.1:18371/'+route,{waitUntil:'networkidle'}); await page.waitForTimeout(160);
              metrics[name].mobile=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,nav:!!document.querySelector('.vf-global-domain-nav'),command:!!document.querySelector('.vf-mobile-command-row'),sidebar:document.querySelector('.vf-app-sidebar')?.getBoundingClientRect().width||0}));
              if(metrics[name].mobile.overflow>1||!metrics[name].mobile.nav)throw Error(name+' mobile shell '+JSON.stringify(metrics[name].mobile));
              await page.screenshot({path:process.env.EVID+'/'+name+'-390-light.png'});
            }
            fs.writeFileSync(process.env.EVID+'/metrics.json',JSON.stringify(metrics,null,2));
            fs.writeFileSync(process.env.EVID+'/verdict.txt','P01_FIVE_DOMAIN_VISUAL_AUDIT=PASS\nSOURCE='+process.env.SOURCE+'\n');
            await browser.close(); console.log('P01_FIVE_DOMAIN_VISUAL_AUDIT=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" SOURCE="$SOURCE" node audit.cjs | tee "$EVID/result.txt"
          grep -Fx P01_FIVE_DOMAIN_VISUAL_AUDIT=PASS "$EVID/result.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-five-domain-visual-audit-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-five-domain.pid 2>/dev/null)" 2>/dev/null || true
