name: S01 C02 Update Compatibility Readonly Gate
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c02-update-compat-readonly-20260907.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      HEAD_SHA: 546183cb10ac9ab78d73f4cedf17bb4eca1fb7e4
    steps:
      - name: Verify exact C02 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'PRODUCT_WRITE_USED=NO MAIN_WRITE_USED=NO RELEASE_WRITE_USED=NO PRODUCTION_WRITE_USED=NO'
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-ops.git" repo
          cd repo
          git checkout -q "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(cat VERSION)" = '1.21.857'
          php -l includes/wp-update/class-vf-ops-update-admin-v1.php >/dev/null
          php tests/update-compat-human-language-contract.php
          php tests/admin-human-language-contract.php
          php tests/pages-tools-human-closure-contract.php
          php tests/dashboard-selector-hit-contract.php
          php tests/visible-console-v2-contract.php
          php tests/update-refresh-policy-current-contract.php
          git diff --exit-code
          echo 'PASS_S01_C02_UPDATE_COMPAT_READONLY_GATE'
