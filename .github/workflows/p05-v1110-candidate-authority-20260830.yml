name: P05 V1.1.10 Candidate Authority

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      P05_BRANCH: fix/p05-runtime-pointer-v1110-20260830
      P05_EXPECTED_HEAD: efe061fb3d1de9eb702c59b2a775971f98c0cf6f
      MECHANISM_SOURCE: 34c7e03bd18283e27aa58e0ef138486fec15a901
      MECHANISM_RUN: '33316433128'
      MECHANISM_JOB: '99270632195'
    steps:
      - name: Checkout runner source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout P05 candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
          path: p05

      - name: Verify starting source
        working-directory: p05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXPECTED_HEAD"
          test "$(cat VERSION)" = '1.1.10'
          node -e "const p=require('./package.json'); if(p.version!=='1.1.10') process.exit(1)"
          grep -Fq 'Working Candidate: v1.1.10' README.md
          grep -Fq 'Mechanism Gate: 33316433128 · PASS' README.md

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Reconcile version lock and candidate authority
        working-directory: p05
        run: |
          set -euo pipefail
          npm version 1.1.10 --no-git-tag-version --allow-same-version
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('VF_PROJECT.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['status']='V1.1.10_RELEASE_CANDIDATE / FINAL_EXACT_SOURCE_GATE_PENDING / PRODUCTION_NOT_DEPLOYED'
          d['version']='1.1.10'
          d['target_version']='1.1.10'
          d['working_version']='1.1.10'
          d['formal_release']='v1.1.9'
          d['formal_release_state']='RELEASED_CURRENT_REAL_USER_FAIL'
          d['runtime_recovery_candidate']='V1.1.10_RUNTIME_POINTER_INSTALL_FIX'
          d['runtime_recovery_release']='PENDING_FINAL_EXACT_SOURCE_GATE'
          d['production_runtime_acceptance']='V1.1.9_REAL_USER_FAIL_V1.1.10_NOT_DEPLOYED'
          d['production_deployment']='NOT_DEPLOYED'
          d['production_write']=0
          d['working_branch']='fix/p05-runtime-pointer-v1110-20260830'
          d['owner_real_use_review']='V1.1.9_REAL_FAIL_V1.1.10_REAL_ENDPOINT_NOT_PROVEN'
          d['owner_real_use_pass']='NOT_PROVEN_FOR_V1.1.10'
          d['release_authorization']='PENDING_V1.1.10_FINAL_EXACT_SOURCE_GATE'
          d['product_failure']='V1.1.9_FIRST_REQUEST_MARKER_CREATION_PLUS_HOME_ENV_STORAGE_DISCOVERY_COULD_REBIND_OLD_STATE'
          d['next_action']='RUN FINAL V1.1.10 EXACT SOURCE FULL GATE; RELEASE ONLY AFTER PASS'
          d['deployment_readiness']='V1.1.10_CANDIDATE_MACHINE_GATE_PENDING'
          d['runtime_evidence']='docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md'
          d.setdefault('authority', {})['browser_first_install']='docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md'
          d['authority']['release_candidate']='docs/authority/RELEASE_V1.1.10_CANDIDATE.md'
          d['v1_1_10_runtime_pointer_install_fix']={
            'state':'RELEASE_CANDIDATE',
            'install_identity_authority':'WEBROOT_RUNTIME_POINTER',
            'runtime_pointer':'VF_INSTALL_INSTANCE.json',
            'pointer_created':'AFTER_SUCCESSFUL_SETUP_ONLY',
            'fresh_rule':'POINTER_ABSENT_MEANS_NEW_INSTALL',
            'private_state_isolation':'POINTER_BOUND_RANDOM_SIBLING',
            'runtime_config':'../.vfseo-data-<instance_id>/config/runtime.env',
            'runtime_data':'../.vfseo-data-<instance_id>/data',
            'setup_lock':'../.vfseo-data-<instance_id>/config/setup.lock.json',
            'backup_data':'../.vfseo-data-<instance_id>/backups',
            'fresh_install_uses_home':False,
            'fresh_install_uses_environment_storage_paths':False,
            'fresh_install_database_heuristics':False,
            'legacy_in_place_compatibility':True,
            'mechanism_source':'34c7e03bd18283e27aa58e0ef138486fec15a901',
            'mechanism_gate_run':33316433128,
            'mechanism_gate_job':99270632195,
            'mechanism_gate':'PASS',
            'formal_staging_immutable_during_tests':'PASS',
            'dirty_state_full_delete_reinstall':'PASS',
            'old_private_data_preserved_not_adopted':'PASS',
            'chrome_e2e':'PASS',
            'production_state':'NOT_DEPLOYED'
          }
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Write current authority documents
        working-directory: p05
        run: |
          set -euo pipefail
          cat > docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md <<'EOF'
          # P05 · VF SEO · Browser-first Install Current Authority

          ## Current Contract

          Version candidate: `v1.1.10`

          Normal owner install is:

          ```text
          CloudPanel PHP Site
          → upload/extract pristine FULL
          → open domain
          → no VF_INSTALL_INSTANCE.json means NEW INSTALL
          → /setup
          → create owner username/password
          → initialize and self-test SQLite
          → atomically write VF_INSTALL_INSTANCE.json LAST
          → enter application
          ```

          No SSH, CLI, manual `.env`, manual migration, or manual deletion of historical private data is part of the normal install contract.

          ## Installation Identity Authority

          `VF_INSTALL_INSTANCE.json` is the only current Webroot runtime pointer.

          - Pointer absent: fresh install. Do not inspect old SQLite, setup locks, login events, business rows, HOME paths, or storage environment variables to guess install state.
          - Pointer present and valid: installed instance. Runtime resolves only the private storage bound by that pointer.
          - Opening `/` or `/setup` must never create the pointer.
          - Pointer creation is the final commit step after database/admin initialization and final self-test pass.

          ## Private Storage

          A new install binds a random sibling directory outside Webroot:

          ```text
          ../.vfseo-data-<instance_id>/
            config/runtime.env
            config/setup.lock.json
            data/vf-seo.sqlite3
            backups/
          ```

          Fresh install path resolution does not depend on `$HOME`, POSIX home, `VF_ENV_FILE`, `VF_SQLITE_PATH`, or `VF_BACKUP_DIR`.

          ## Full-delete Semantics

          Deleting the entire Webroot removes the runtime pointer. Re-extracting a pristine FULL therefore creates a fresh installation path even when historical private SQLite/config/login data remains elsewhere. Historical data is preserved but not auto-adopted.

          ## Legacy In-place Compatibility

          Existing historical Webroots may retain compatibility pointers/markers and continue their existing private state. This compatibility must never affect a rebuilt Webroot with no current runtime pointer.

          ## Release Packaging Boundary

          Formal FULL must not contain runtime state, including:

          - `VF_INSTALL_INSTANCE.json`
          - `.vf-seo-site-instance.json`
          - `.vf-seo-installing.lock`
          - SQLite/DB/WAL/SHM files
          - `runtime.env`
          - `setup.lock.json`
          - `.vfseo-data-*`
          - backup/private runtime data

          Browser and Chrome tests run only on isolated copies. Formal staging must remain byte-identical before and after runtime tests.

          ## Mechanism Evidence

          - Exact mechanism source: `34c7e03bd18283e27aa58e0ef138486fec15a901`
          - Public Runner run: `33316433128`
          - Job: `99270632195`
          - Result: `PASS`
          - Production write: `0`
          EOF

          cat > docs/handoff/CURRENT_STATE.md <<'EOF'
          # P05 · VF SEO · Current State

          ```text
          Current Formal Release: v1.1.9
          Real-user verdict for v1.1.9: FAIL for fresh-reinstall issue
          Working Candidate: v1.1.10
          Candidate purpose: Runtime Pointer Install Model
          Mechanism Gate: PASS
          Mechanism Run: 33316433128
          Production: NOT_DEPLOYED
          Production Write: 0
          Schema: VF-SEO-SCHEMA@1 / 1
          ```

          v1.1.10 removes install-state guessing. A Webroot without `VF_INSTALL_INSTANCE.json` is fresh, and the application is forbidden from discovering or adopting historical private SQLite/config state. The pointer is created only after successful Browser Setup and binds one random sibling private directory.

          Current sequence:

          1. Candidate Authority reconciliation.
          2. Freeze one v1.1.10 Exact Source.
          3. Run final Exact Source FULL/Browser/Chrome/dirty-state/staging-immutability Gate.
          4. Only after PASS: promote to main and publish pristine `VF_SEO_V1.1.10_FULL.zip`.
          5. Production remains untouched until separate real deployment authorization.
          EOF

          cat > php/README.md <<'EOF'
          # P05 · VF SEO · PHP Runtime

          PHP 8.2+ / PDO_SQLite is the normal CloudPanel web runtime. Node remains optional for advanced worker capabilities; normal browser installation does not require Node/PM2/SSH.

          ## First Install

          Upload and extract the pristine FULL into the PHP site Webroot, then open the domain.

          ```text
          no VF_INSTALL_INSTANCE.json
          → /setup
          → create owner
          → initialize SQLite
          → final self-test
          → write VF_INSTALL_INSTANCE.json
          ```

          The pointer is deliberately written last. Merely visiting the site never creates it.

          ## Runtime Pointer

          `VF_INSTALL_INSTANCE.json` binds the installed Webroot to one random sibling private directory. New installation data is outside Webroot:

          ```text
          ../.vfseo-data-<instance_id>/config/runtime.env
          ../.vfseo-data-<instance_id>/config/setup.lock.json
          ../.vfseo-data-<instance_id>/data/vf-seo.sqlite3
          ../.vfseo-data-<instance_id>/backups/
          ```

          Fresh installs do not use HOME/POSIX-home discovery or storage path environment overrides. Historical private data is never used to decide whether a pointer-less Webroot is installed.

          ## Reinstall

          A full Webroot delete removes the pointer. Re-extracting a pristine FULL therefore returns to `/setup`; old private data remains untouched but is not adopted.

          ## Security / Packaging

          Runtime pointer, SQLite, private config, setup lock, backups and tests must never ship inside formal FULL. Setup/Auth dynamic responses are no-store. CLI maintenance scripts remain web-guarded.
          EOF

          cat > docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md <<'EOF'
          # V1.1.10 Runtime Pointer Install Mechanism Evidence

          Mechanism Exact Source: `34c7e03bd18283e27aa58e0ef138486fec15a901`

          Public Runner:

          ```text
          Run: 33316433128
          Job: 99270632195
          Result: PASS
          Release Write: 0
          Production Write: 0
          ```

          Validated conditions included intentionally dirty historical state: old SQLite, old admin, successful login history, real project rows, HOME-related state, and poisoned storage environment variables. The test deleted the complete Webroot and re-extracted the same formal FULL staging.

          PASS required all of the following:

          - pointer absent before setup;
          - first GET redirects/renders first installation without creating pointer;
          - historical SQLite/config state is not inspected or adopted by the fresh Webroot;
          - successful setup initializes a new random sibling private directory;
          - runtime pointer is written only after final database/admin self-test;
          - old SQLite SHA-256 remains unchanged;
          - Browser smoke PASS;
          - real Google Chrome E2E PASS at mobile and desktop sizes;
          - formal staging file hashes are byte-identical before/after runtime tests;
          - package gate excludes all runtime/private state.

          This evidence validates the mechanism only. Formal v1.1.10 release still requires a final gate bound to the complete candidate Exact Source.
          EOF

          cat > docs/authority/RELEASE_V1.1.10_CANDIDATE.md <<'EOF'
          # P05 · VF SEO · v1.1.10 Release Candidate Authority

          State: `FINAL_EXACT_SOURCE_GATE_PENDING`

          v1.1.10 is the candidate that replaces fresh-install heuristics with the P01/P02-style Webroot runtime-pointer model.

          Release may proceed only if one complete candidate SHA passes:

          - version/package/VF_PROJECT authority consistency;
          - lint/typecheck/PHP syntax;
          - formal PHP FULL package gate;
          - Browser pointer-last setup;
          - full-delete reinstall while old private state remains dirty;
          - poisoned HOME/storage env isolation;
          - real Chrome E2E;
          - staging immutability before/after runtime tests;
          - pristine post-test rebuild from the same Exact Source;
          - zero Production writes.

          Formal release before this candidate remains `v1.1.9`, whose historical machine evidence is preserved but whose real-user fresh-reinstall verdict is FAIL.
          EOF

      - name: Prepend V1.1.10 changelog
        working-directory: p05
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text(encoding='utf-8')
          if '## 1.1.10 · Runtime Pointer Install Model' not in s:
              header='# 变更记录\n\n'
              assert s.startswith(header)
              entry='''## 1.1.10 · Runtime Pointer Install Model（Candidate · 2026-08-30）\n\n- 对照 P01/P02/P03/P04 的成熟安装模型，P05 停止通过 HOME、SQLite、setup lock、LOGIN_SUCCESS 或业务数据推断“是否已安装”。\n- `VF_INSTALL_INSTANCE.json` 升级为唯一 Webroot Runtime Pointer；文件不存在即新安装。\n- 首次 GET 不再创建 pointer；只有管理员创建、SQLite 初始化与最终自检全部成功后才原子写入 pointer。\n- 新实例 private state 绑定随机 Webroot 同级目录 `../.vfseo-data-<instance_id>/`，不再依赖 HOME/POSIX-home 或 `VF_SQLITE_PATH` / `VF_BACKUP_DIR` 等存储环境覆盖。\n- 删除整个 Webroot 后重新解压 pristine FULL 必然回到 `/setup`；旧 SQLite/config/login/business data 保留但不自动采用。\n- 正式 FULL Package Gate 禁止 runtime pointer、SQLite、runtime.env、setup lock、`.vfseo-data-*` 与测试运行产物。\n- Browser/Chrome 测试只在隔离副本运行，formal staging 前后逐文件 SHA-256 必须 byte-identical。\n- 机制 Exact Source `34c7e03bd18283e27aa58e0ef138486fec15a901` / Public Runner `33316433128` / Job `99270632195` = PASS。\n- 当前仍为 Candidate；完整 v1.1.10 Exact Source Gate PASS 后才允许正式发布。\n- Production 继续 `NOT_DEPLOYED` / `PRODUCTION_WRITE=0`。\n\n'''
              s=header+entry+s[len(header):]
              p.write_text(s,encoding='utf-8')
          PY

      - name: Verify exact candidate mutation scope
        working-directory: p05
        run: |
          set -euo pipefail
          git diff --name-only "$P05_EXPECTED_HEAD" -- | tee /tmp/changed.txt
          for f in CHANGELOG.md VF_PROJECT.json package-lock.json docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md docs/authority/RELEASE_V1.1.10_CANDIDATE.md docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md docs/handoff/CURRENT_STATE.md php/README.md; do
            grep -Fxq "$f" /tmp/changed.txt
          done
          test "$(wc -l < /tmp/changed.txt)" -eq 8
          test "$(cat VERSION)" = '1.1.10'
          node - <<'NODE'
          const p=require('./package.json'); const l=require('./package-lock.json');
          if(p.version!=='1.1.10'||l.version!=='1.1.10'||l.packages[''].version!=='1.1.10') process.exit(1);
          NODE
          python3 - <<'PY'
          import json
          d=json.load(open('VF_PROJECT.json'))
          assert d['version']==d['target_version']==d['working_version']=='1.1.10'
          assert d['formal_release']=='v1.1.9'
          assert d['v1_1_10_runtime_pointer_install_fix']['pointer_created']=='AFTER_SUCCESSFUL_SETUP_ONLY'
          assert d['v1_1_10_runtime_pointer_install_fix']['fresh_install_uses_home'] is False
          assert d['production_deployment']=='NOT_DEPLOYED'
          assert d['production_write']==0
          PY

      - name: Commit and push complete V1.1.10 candidate authority
        working-directory: p05
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add CHANGELOG.md VF_PROJECT.json package-lock.json docs/authority/BROWSER_FIRST_INSTALL_MAIN_CURRENT.md docs/authority/RELEASE_V1.1.10_CANDIDATE.md docs/evidence/V1.1.10_RUNTIME_POINTER_INSTALL_MECHANISM_20260830.md docs/handoff/CURRENT_STATE.md php/README.md
          git commit -m 'release(P05): freeze V1.1.10 candidate authority'
          git push origin HEAD:"$P05_BRANCH"
          echo "P05_V1110_CANDIDATE_SOURCE=$(git rev-parse HEAD)"

      - name: Receipt
        run: |
          echo 'P05_V1110_CANDIDATE_AUTHORITY=PASS'
          echo 'MECHANISM_GATE=33316433128'
          echo 'RELEASE_WRITE=0'
          echo 'PRODUCTION_WRITE=0'
