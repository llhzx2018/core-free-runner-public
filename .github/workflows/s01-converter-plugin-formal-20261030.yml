name: S01 M3U8 converter formal exact release
on:
  push:
    branches: [task/s01-converter-i18n-proof-20261030]
    paths: ['.github/workflows/s01-converter-plugin-formal-20261030.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 506467df8bdf7eb4584800b31ef3334a8ffd30ce
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Verify machine proof and reproducible release ZIP
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p provider prior proof
          test "$(git -C target rev-parse HEAD)" = 506467df8bdf7eb4584800b31ef3334a8ffd30ce
          test "$(git -C target rev-parse 'HEAD^{tree}')" = ad171a63549a2afe25c84446c2c614a7c0dab8d2
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/commits/main --jq .sha)" = 506467df8bdf7eb4584800b31ef3334a8ffd30ce
          test "$(cat target/VERSION | tr -d '\n\r')" = 1.25.96
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/41065230867 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/41065230867 --jq .head_sha)" = 7a0fe3c12137bdeab82ddcd79d2deffed96c35dd
          gh run download 41065230867 --repo llhzx2018/core-free-runner-public --name s01-iptv-41065230867 --dir prior
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('prior/packages.json').read_text())
          x=[x for x in p if x['package'].endswith('vf-tools-m3u8_V1.25.96.zip')]
          assert len(x)==1 and x[0]['sha256']=='c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723' and x[0]['bytes']==3794853 and x[0]['files']==570
          assert json.loads(Path('prior/legacy-metadata-warning.json').read_text())['snapshot_preserved'] is False
          PY
          gh release download v1.25.95 --repo llhzx2018/vf-tools-m3u8 --pattern vf-tools-m3u8_V1.25.95.zip --dir provider
          echo '030f28066417802dc973cb17be05bd33d182da282dc459f98e096043ddd4fd92  provider/vf-tools-m3u8_V1.25.95.zip' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib,io,json,re,subprocess,zipfile
          root=Path('target/src');old=Path('provider/vf-tools-m3u8_V1.25.95.zip')
          updates=['vf-tool-m3u8.php','plugin-manifest.json','includes/i18n.php']
          def build():
              b=io.BytesIO();seen=set()
              with zipfile.ZipFile(old) as zin,zipfile.ZipFile(b,'w') as zout:
                  for info in zin.infolist():
                      assert info.filename.startswith('vf-tool-m3u8/') and '..' not in PurePosixPath(info.filename).parts
                      rel=info.filename[len('vf-tool-m3u8/'):];data=zin.read(info)
                      if rel in updates:
                          before=subprocess.check_output(['git','-C','target','show','a3e54d82817a557c62584976b803c6a2223d847c:src/'+rel])
                          assert data==before,rel;data=(root/rel).read_bytes();seen.add(rel)
                      zout.writestr(info,data)
              assert seen==set(updates);return b.getvalue()
          data=build();assert data==build() and len(data)==3794853
          assert hashlib.sha256(data).hexdigest()=='c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723'
          out=Path('provider/vf-tools-m3u8_V1.25.96.zip');out.write_bytes(data)
          files={}
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              for info in z.infolist():
                  if info.is_dir():continue
                  rel=info.filename[len('vf-tool-m3u8/'):]
                  if re.search(r'(^|/)(?:\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)',rel,re.I):continue
                  if PurePosixPath(rel).name.lower() in ['readme.md','changelog.md','license','license.txt','package_profile.json']:continue
                  if re.search(r'\.(?:sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',rel,re.I):continue
                  if '/' not in rel and rel not in ['vf-tool-m3u8.php','uninstall.php','plugin-manifest.json','tool-settings.schema.json']:continue
                  if '/' in rel and not re.match(r'^(?:admin|config|includes|public|templates|tools)/',rel):continue
                  files[rel]=hashlib.sha256(z.read(info)).hexdigest()
          canonical=''.join(k+'\0'+files[k]+'\n' for k in sorted(files)).encode()
          receipt={'status':'PASS','version':'1.25.96','sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'runtime_files':len(files),'runtime_fingerprint':hashlib.sha256(canonical).hexdigest(),'source':'506467df8bdf7eb4584800b31ef3334a8ffd30ce'}
          assert len(files)==569
          Path('proof/package.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
          PY
      - name: Publish exact asset and verify remote bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/commits/main --jq .sha)" = 506467df8bdf7eb4584800b31ef3334a8ffd30ce
          if gh api repos/llhzx2018/vf-tools-m3u8/git/ref/tags/v1.25.96 >/dev/null 2>&1; then echo TAG_ALREADY_EXISTS; exit 1; fi
          if gh release view v1.25.96 -R llhzx2018/vf-tools-m3u8 >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS; exit 1; fi
          gh api --method POST repos/llhzx2018/vf-tools-m3u8/git/refs -f ref=refs/tags/v1.25.96 -f sha=506467df8bdf7eb4584800b31ef3334a8ffd30ce >/dev/null
          gh release create v1.25.96 provider/vf-tools-m3u8_V1.25.96.zip -R llhzx2018/vf-tools-m3u8 --verify-tag --title 'VF Tools M3U8 V1.25.96' --notes '修复中文转换器分片数量与实际结果不一致。旧版皮肤迁移记录的现有行为未改变；正式站升级前请确认完整数据库备份，正式站由 Owner 手工升级，真实使用验收待完成。'
          mkdir -p remote
          gh release download v1.25.96 -R llhzx2018/vf-tools-m3u8 -p vf-tools-m3u8_V1.25.96.zip -D remote
          echo 'c49b51b8d4f92acb88fe5b1f1f6a2dc9ce523a49a394425f2123d1e9bed24723  remote/vf-tools-m3u8_V1.25.96.zip' | sha256sum -c
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/commits/v1.25.96 --jq .sha)" = 506467df8bdf7eb4584800b31ef3334a8ffd30ce
          echo PLUGIN_FORMAL_RELEASE_REMOTE_BYTES_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: converter-plugin-release-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Remove private source and package
        if: always()
        run: rm -rf target provider prior remote
