name: P01 nine-entry dual-auth browser layout (temporary)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-nine-entry-auth-layout-proof.yml']
permissions:
  contents: read
jobs:
  nine-entry-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Transient exact P01 candidate checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 94774ab41d7825e144d4da51f4a497a8c9148d60
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: candidate
          persist-credentials: false
      - name: Transient current stable baseline checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.391
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: stable
          persist-credentials: false
      - name: Prepare PHP and browser dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring,gd
          coverage: none
      - name: Exact source canonical regression and Shell contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "94774ab41d7825e144d4da51f4a497a8c9148d60"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.393"
          php candidate/tests/integration/p01_nine_entry_auth_shell_contract.php
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/nine-entry-canonical.log
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/nine-entry-canonical.log
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/nine-entry-canonical.log
          echo P01_NINE_ENTRY_EXACT_CANONICAL=PASS
      - name: Install clean synthetic instance locally
        shell: bash
        run: |
          set -Eeuo pipefail
          (cd candidate/src && php -S 127.0.0.1:18621 -t . >/tmp/p01-nine-browser-server.log 2>&1 & echo $! >/tmp/p01-nine-browser.pid)
          for n in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-nine-cookie -b /tmp/p01-nine-cookie http://127.0.0.1:18621/setup.php -o /tmp/p01-nine-setup.html; then break; fi
            sleep 1
          done
          python3 - <<'PY' > /tmp/p01-nine-csrf
          import re
          s=open('/tmp/p01-nine-setup.html').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m, "No CSRF setup token"
          print(m.group(1))
          PY
          csrf="$(cat /tmp/p01-nine-csrf)"
          curl -fsS -c /tmp/p01-nine-cookie -b /tmp/p01-nine-cookie -X POST http://127.0.0.1:18621/setup.php --data-urlencode "setup_csrf=$csrf" --data-urlencode "site_title=VF Start Synthetic" --data-urlencode "admin_password=P01LocalSyntheticPass_771" --data-urlencode "admin_password_confirm=P01LocalSyntheticPass_771" -o /tmp/p01-nine-setup-result.html
          (cd candidate/src && php cli/verify.php) | grep -Fx 'VERIFY_PASS=YES'
          echo P01_NINE_ENTRY_SYNTHETIC_INSTALL=PASS
      - name: Install isolated chromium test binary
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          npm install --no-save --ignore-scripts playwright@1.56.1 >/dev/null
          npx playwright install chromium --with-deps >/tmp/p01-browser-install.log
          echo P01_NINE_ENTRY_BROWSER_READY=PASS
      - name: Real browser signed-in and visitor layout matrix
        shell: bash
        env:
          P01_TEST_PASSWORD: P01LocalSyntheticPass_771
          P01_TEST_ORIGIN: http://127.0.0.1:18621
        run: |
          set -Eeuo pipefail
          node candidate/tests/integration/p01_nine_entry_auth_shell_browser.mjs | tee /tmp/p01-nine-visual.json
          grep -Fx 'P01_NINE_ENTRY_TWO_AUTH_BROWSER_GEOMETRY=PASS' /tmp/p01-nine-visual.json
          echo P01_NINE_ENTRY_72_BROWSER_CASES=PASS
      - name: Cleanup synthetic runtime
        if: always()
        run: |
          if test -f /tmp/p01-nine-browser.pid; then kill "$(cat /tmp/p01-nine-browser.pid)" >/dev/null 2>&1 || true; fi
