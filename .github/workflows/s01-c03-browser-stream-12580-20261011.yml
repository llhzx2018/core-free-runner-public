name: S01 C03 Browser Stream 12580 Candidate Safety
on:
  push:
    branches: [task/s01-c03-browser-stream-12580-20261011]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private candidate read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 9c5373a9344d41c480bb19019318443a6a2ddd02
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: candidate
      - name: Verify immutable version and PHP+JS syntax
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "9c5373a9344d41c480bb19019318443a6a2ddd02"
          test "$(cat candidate/VERSION)" = "1.25.80"
          grep -Fq 'Version: 1.25.80' candidate/src/vf-tool-m3u8.php
          grep -Fq "'VF_TOOL_M3U8_VERSION', '1.25.80'" candidate/src/vf-tool-m3u8.php
          php -l candidate/src/vf-tool-m3u8.php
          php -l candidate/src/includes/renderers/raw-browser-stream-test.php
          node --check candidate/src/public/js/modules/browser-stream-test.js
          node --check candidate/src/public/dist/browser-stream-test.js
          python3 - <<'PYBUNDLE'
          import pathlib,json
          root=pathlib.Path('candidate/src')
          row=json.loads((root/'config/performance-bundles.php').read_text().splitlines()[2])['browser-stream-test']
          for kind,sources,target in [('js','jsSources','script'),('css','cssSources','style')]:
           assembled='\\n'.join((root/p).read_text() for p in row[sources])+'\\n'
           served=(root/row[target]).read_text()
           assert assembled==served,kind+' deployed bundle is stale'
           print('EXACT_DEPLOYED_BUNDLE',kind,'PASS',len(served))
          PYBUNDLE
          node --check candidate/tests/browser-stream-safety.node.cjs
      - name: Run real Node VM operation regression
        run: node candidate/tests/browser-stream-safety.node.cjs
      - name: Verify standalone UX CSS boundaries
        run: |
          set -Eeuo pipefail
          grep -Fq 'font:400 16px/1.6 system-ui' candidate/src/public/css/modules/browser-stream-test.css
          grep -Fq 'min-height:44px;padding:9px 14px' candidate/src/public/css/modules/browser-stream-test.css
          grep -Fq 'font-size:15px' candidate/src/public/css/modules/browser-stream-test.css
          test -f candidate/src/includes/renderers/raw-browser-stream-test.php
      - name: Checkout public-safe acceptance scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Prepare headless Chromium
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: Real isolated WordPress MariaDB browser use
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          cp -a runner/lanes/s01-c03-browser12580 lane
          bash -n lane/native.sh
          node --check lane/browser.cjs
          bash lane/native.sh
      - name: Write public-safe receipt
        run: |
          mkdir -p proof
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate/src/public/js/modules/browser-stream-test.js')
          payload={'status':'PASS','project':'S01-C03','version':'1.25.80','candidate_sha':'9c5373a9344d41c480bb19019318443a6a2ddd02','test':'browser-stream-safety.node.cjs','source_js_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'production':'NOT_EXECUTED'}
          pathlib.Path('proof/S01-C03-browser-12580.json').write_text(json.dumps(payload,indent=2))
          print('CANDIDATE_RECEIPT',json.dumps(payload))
          PY
      - name: Upload public-safe evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-browser12580-${{ github.run_id }}
          path: |
            proof/S01-C03-browser-12580.json
            proof/browser.json
            proof/wp-final.json
            proof/wp-install.json
            proof/bst-390.png
          retention-days: 21
      - name: Remove private checkout
        if: always()
        run: rm -rf candidate
