name: P02 R32 Notebook Layout Ownership Write
on:
  push:
    branches: [run/p02-r32-notebook-layout-ownership-write]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      BASE_REF: ca8d806b11cfbc8cdb5e5998ef65aa8d64abd238
    steps:
      - name: Checkout exact current develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.BASE_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: product

      - name: Narrow legacy notebook pane ownership
        working-directory: product
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          css_path=Path('public/assets/app.css')
          css=css_path.read_text(encoding='utf-8')
          old_comment='''  /* V2.5.0 could enter edit mode with the Document List track still reserved
   * while the pane/resizer themselves were display:none, creating a large dead
   * blank column. Unless the user explicitly collapses the list, keep the pane
   * and its single boundary control visible in every workspace mode. */'''
          new_comment='''  /* V2.5.32 ownership boundary: the legacy V2.5.2 rule may keep the
   * document list visible only in non-editing notebook states. Edit and Split
   * own the full workspace width and must not inherit this older flex override. */'''
          if css.count(old_comment)!=1:
              raise SystemExit(f'legacy v252 comment count={css.count(old_comment)}')
          css=css.replace(old_comment,new_comment,1)
          old_sel='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-list-pane{'
          new_sel='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-list-pane{'
          old_res='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-resizer{'
          new_res='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-resizer{'
          if css.count(old_sel)!=1 or css.count(old_res)!=1:
              raise SystemExit(f'legacy selector counts pane={css.count(old_sel)} resizer={css.count(old_res)}')
          css=css.replace(old_sel,new_sel,1).replace(old_res,new_res,1)
          css_path.write_text(css,encoding='utf-8')

          identity_path=Path('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json')
          identity=json.loads(identity_path.read_text(encoding='utf-8'))
          identity['convergence']['desktop_edit_list_auto_collapsed']=True
          identity['convergence']['legacy_notebook_pane_rule_narrowed']=True
          identity['next_gate']='RERUN_REAL_CHROMIUM_VISUAL_AND_TASK_FLOW_THEN_CONTINUE_FULL_PRODUCT_AUDIT'
          identity_path.write_text(json.dumps(identity,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('tests/unit/p02_notebook_layout_ownership.mjs').write_text("""import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const css=fs.readFileSync('public/assets/app.css','utf8');
          const oldPane='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-list-pane{';
          const oldRes='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-resizer{';
          const readPane='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-list-pane{';
          const readRes='.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus):not(.notebook-editing) .notebook-resizer{';
          assert.ok(!css.includes(oldPane),'legacy pane flex selector must not own editing state');
          assert.ok(!css.includes(oldRes),'legacy resizer selector must not own editing state');
          assert.ok(css.includes(readPane),'non-editing pane ownership selector missing');
          assert.ok(css.includes(readRes),'non-editing resizer ownership selector missing');
          assert.ok(css.includes('.notebook-layout.notebook-mode-edit .notebook-list-pane'));
          assert.ok(css.includes('.notebook-layout.notebook-mode-split .notebook-list-pane'));
          assert.ok(css.includes('display:none!important'));
          console.log('P02_NOTEBOOK_LAYOUT_OWNERSHIP=PASS');
          """,encoding='utf-8')

          Path('docs/evidence/P02_NOTEBOOK_LAYOUT_OWNERSHIP_20260831.md').write_text("""# P02 Notebook Layout Ownership · 2026-08-31

## Finding

Real Chromium R31 showed that desktop Edit remained visually split because the historical V2.5.2 selector
`.notebook-layout:not(.notebook-list-collapsed):not(.notebook-focus) .notebook-list-pane`
forced `display:flex!important`. Its specificity exceeded the later V2.5.32 Edit/Split `display:none!important` rules.

## Fix

The historical rule now explicitly excludes `.notebook-editing`. Read / normal Notebook keeps its document list; Edit and Split own the full workspace width.

This is an ownership correction inside the consolidated historical block, not a new override layer.

## Boundary

No schema, API, content model, main, tag, release, update-channel, or production change.
""",encoding='utf-8')
          PY
          python3 scripts/generate-source-manifest.py
          python3 scripts/verify-source-manifest.py

      - name: Verify all contracts and repository gates
        working-directory: product
        run: |
          set -Eeuo pipefail
          node --check public/assets/app.js
          php -l public/index.php
          test "$(tr -d '\r\n' < VERSION)" = '2.5.32'
          test "$(grep -c '<link rel="stylesheet"' public/index.php)" = '1'
          for t in tests/unit/p02_*.mjs; do node "$t"; done
          python3 scripts/verify-source-manifest.py
          python3 scripts/repository-gates.py
          python3 - <<'PY'
          import json
          m=json.load(open('SOURCE_MANIFEST.json',encoding='utf-8'))
          c=json.load(open('docs/authority/P02_DEVELOP_CANDIDATE_IDENTITY.json',encoding='utf-8'))
          assert m['version']=='2.5.32'
          assert m['runtime_source_file_count']==72
          assert c['candidate_version']=='2.5.32'
          assert c['runtime_source_file_count']==72
          assert c['production_version']=='2.5.31'
          assert c['convergence']['legacy_notebook_pane_rule_narrowed'] is True
          print('P02_R32_NOTEBOOK_LAYOUT_OWNERSHIP_GATES=PASS')
          PY

      - name: Commit and push develop only
        working-directory: product
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-library.git"
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "$BASE_REF"
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(P02): narrow V2.5.32 notebook pane ownership'
          git push origin HEAD:develop
          git remote set-url origin "https://github.com/llhzx2018/vf-library"
          echo P02_DEVELOP_WRITE=PASS
          echo P02_MAIN_WRITE=NO
          echo TAG_WRITE=NO
          echo RELEASE_WRITE=NO
          echo UPDATE_CHANNEL_WRITE=NO
          echo PRODUCTION_WRITE=NO
