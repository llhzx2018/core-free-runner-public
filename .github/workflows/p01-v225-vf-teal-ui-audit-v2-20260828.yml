name: P01 V2.25 VF Teal UI Audit V2
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v225-vf-teal-ui-audit-v2-20260828.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_SOURCE: d3904c4e7a9c44aaed5da9c4653c99c5a5a83bb8
      SOURCE_BRANCH: feature/p01-v2.25.0-vf-teal-rebaseline-20260828
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.EXACT_SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - name: Exact source and syntax
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p01
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git ls-remote "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" "refs/heads/${SOURCE_BRANCH}"|awk '{print $1}')" = "$EXACT_SOURCE"
          find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          grep -F -- '--vfui-sidebar:#fff' src/assets/surface-vf-theme.css >/dev/null
          grep -F -- '.vf-main-nav b,.vf-secondary-nav b{font-size:13px' src/assets/surface-vf-theme.css >/dev/null
          grep -F -- 'font-size:clamp(25px,2vw,30px)' src/assets/surface-vf-theme.css >/dev/null
          echo P01_V225_UI_V2_SOURCE=PASS
      - name: Fresh runtime, seed and regression
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v225-v2 /tmp/p01-v225-v2.cookies
          cp -a p01/src /tmp/p01-v225-v2
          cd /tmp/p01-v225-v2
          php -S 127.0.0.1:18251 -t . >/tmp/p01-v225-v2-server.log 2>&1 & echo $! >/tmp/p01-v225-v2.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18251/setup.php -o /tmp/p01-v225-v2-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v225-v2.cookies -b /tmp/p01-v225-v2.cookies http://127.0.0.1:18251/setup.php -o /tmp/p01-v225-v2-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v225-v2-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -sS -c /tmp/p01-v225-v2.cookies -b /tmp/p01-v225-v2.cookies -X POST http://127.0.0.1:18251/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start UI Audit' --data-urlencode 'admin_password=P01V225!TealAudit' --data-urlencode 'admin_password_confirm=P01V225!TealAudit' -o /tmp/p01-v225-v2-setup-post.html
          curl -fsS -c /tmp/p01-v225-v2.cookies -b /tmp/p01-v225-v2.cookies -H 'Content-Type: application/json' -X POST 'http://127.0.0.1:18251/api.php?action=login' --data '{"password":"P01V225!TealAudit"}' -o /tmp/p01-v225-v2-login.json
          jq -e '.ok==true' /tmp/p01-v225-v2-login.json >/dev/null
          cat >/tmp/p01-v225-v2-seed.php <<'PHP'
          <?php
          require '/tmp/p01-v225-v2/app/bootstrap.php'; require_once '/tmp/p01-v225-v2/app/SurfaceRepository.php';
          $r=new VfRepository(vf_db());$s=new VfSurfaceRepository(vf_db());
          $cats=[]; foreach(['桌面与文件','影视与片源','服务器、域名与运维','成人收藏','AI 与自动化','增长资源与联盟','账号、邮箱与身份','开发、API 与代码'] as $n){$cats[]=$r->createCategory(['name'=>$n,'description'=>'','is_private'=>false]);}
          for($i=0;$i<72;$i++){$r->saveLink(null,['category_id'=>$cats[$i%count($cats)],'title'=>'网站入口 '.($i+1),'url'=>'https://example.com/site-'.$i,'description'=>'这是用于真实高密度界面审计的说明文字，验证字号、卡片密度和长文本截断。','click_count'=>100-$i,'is_favorite'=>$i<5],'import');}
          foreach([['硅谷101','TheValley101'],['42章经','42zhangjing'],['蜉蝣天地 Meanders','meanders'],['大问题 Dialectic','dialectic']] as $x){$z=$r->saveLink(null,['category_id'=>$cats[1],'title'=>$x[0],'url'=>'https://www.youtube.com/@'.$x[1],'description'=>'适合工作时后台收听的长内容频道','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'channels','resource_kind'=>'youtube','background_friendly'=>true]);}
          foreach([['流浪地球 2','2023'],['宇宙探索编辑部','2023'],['信条','2020'],['布达佩斯大饭店','2014']] as $x){$z=$r->saveLink(null,['category_id'=>$cats[1],'title'=>$x[0],'url'=>'https://example.com/watch/'.rawurlencode($x[0]),'description'=>'私人影视索引条目','is_private'=>true],'manual');$s->upsertProfile((int)$z['id'],['surface'=>'watch','resource_kind'=>'movie','media_year'=>$x[1],'media_status'=>'want']);}
          $r->saveLink(null,['category_id'=>$cats[1],'title'=>'未整理 YouTube 频道','url'=>'https://www.youtube.com/@pending-demo','description'=>'等待归属','is_private'=>true],'manual');
          echo "SEED=PASS\n";
          PHP
          php /tmp/p01-v225-v2-seed.php
          php cli/verify.php | grep -Fx 'VERIFY_PASS=YES'
          php cli/surface-verify.php | grep -Fx 'MULTI_SURFACE_PASS=YES'
          php cli/baseline-verify.php | tee /tmp/b.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/b.txt; grep -Fx 'DRIFT_COUNT=0' /tmp/b.txt; grep -Fx 'UNKNOWN_COUNT=0' /tmp/b.txt
      - name: Whole-site screenshots
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v225-v2
          for spec in 'home:surfaces.php' 'start:start.php' 'channels:channels.php' 'watch:watch.php' 'organizer:surface-manager.php'; do name=${spec%%:*};url=${spec#*:};curl -fsS -c /tmp/p01-v225-v2.cookies -b /tmp/p01-v225-v2.cookies "http://127.0.0.1:18251/$url" -o "audit-$name.html";grep -F 'surface-vf-theme.css' "audit-$name.html" >/dev/null;done
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser); test -n "$BROWSER"; mkdir -p /tmp/p01-v225-v2-shots
          for name in home start channels watch organizer; do "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1365,900 --screenshot="/tmp/p01-v225-v2-shots/${name}-1365.png" "http://127.0.0.1:18251/audit-${name}.html";done
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=/tmp/p01-v225-v2-shots/home-mobile.png http://127.0.0.1:18251/audit-home.html
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --screenshot=/tmp/p01-v225-v2-shots/start-mobile.png http://127.0.0.1:18251/audit-start.html
          test "$(find /tmp/p01-v225-v2-shots -type f -name '*.png' -size +10k|wc -l)" -eq 7
          printf 'EXACT_SOURCE=%s\nDESKTOP=1365x900\nMOBILE=390x844\n' "$EXACT_SOURCE" >/tmp/p01-v225-v2-shots/MANIFEST.txt
      - name: Database integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/p01-v225-v2
          test "$(php -r "require 'app/bootstrap.php';echo strtolower((string)vf_db()->query('PRAGMA integrity_check')->fetchColumn());")" = ok
          test "$(php -r "require 'app/bootstrap.php';echo count(vf_db()->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC));")" = 0
          kill "$(cat /tmp/p01-v225-v2.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: p01-v225-vf-teal-ui-audit-v2-${{ env.EXACT_SOURCE }}
          path: /tmp/p01-v225-v2-shots
          if-no-files-found: error
          retention-days: 7
      - name: Verdict
        run: |
          echo P01_V225_VF_TEAL_UI_V2_MACHINE=PASS
          echo RELEASE=NO
          echo PRODUCTION=NO
