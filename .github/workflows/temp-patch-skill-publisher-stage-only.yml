name: TEMP Patch Skill Publisher Stage Only

on:
  push:
    branches:
      - temp/patch-skill-publisher-stage-only
    paths:
      - '.github/workflows/temp-patch-skill-publisher-stage-only.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/skill-publisher-stage-only
          fetch-depth: 0

      - name: Patch publisher and contract test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/gov-doc-skill-pack-publish.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          pulls = call('GET', f'/repos/{repo}/pulls?state=open&head=llhzx2018:{urllib.parse.quote(branch, safe=\"\")}')"
          end_marker = "          print('GOV_DOC_MIRROR_REMOTE_READBACK=PASS')"
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = """          print(f'GOV_DOC_MIRROR_BRANCH={branch}')
          print('GOV_DOC_MIRROR_REMOTE_READBACK=PASS')
          print('GOV_DOC_DISTRIBUTION_PR=EXTERNAL_ORCHESTRATION_REQUIRED')"""
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "echo 'GOV_DOC_DISTRIBUTION_MERGE_GATE=PENDING_PR'",
              "echo 'GOV_DOC_DISTRIBUTION_MERGE_GATE=PENDING_EXTERNAL_PR'",
          )
          workflow.write_text(text, encoding='utf-8')

          test_file = Path('tests/test_skill_pack_publisher_contract.py')
          test_text = test_file.read_text(encoding='utf-8')
          old_start = test_text.index('    def test_distribution_mirror_remains_pr_gated(self) -> None:')
          old_end = test_text.index('\n\n\nif __name__', old_start)
          new_method = """    def test_distribution_mirror_remains_external_pr_gated(self) -> None:
        self.assertIn("GOV_DOC_DISTRIBUTION_MERGE_GATE=PENDING_EXTERNAL_PR", self.text)
        self.assertIn("GOV_DOC_DISTRIBUTION_PR=EXTERNAL_ORCHESTRATION_REQUIRED", self.text)
        self.assertNotIn("/pulls?", self.text)
        self.assertNotIn("call('POST', f'/repos/{repo}/pulls'", self.text)
        self.assertNotIn("/merges", self.text)
"""
          test_text = test_text[:old_start] + new_method.rstrip() + test_text[old_end:]
          test_file.write_text(test_text, encoding='utf-8')
          PY

      - name: Run publisher contract test
        run: python3 -m unittest tests.test_skill_pack_publisher_contract -v

      - name: Commit bounded patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add .github/workflows/gov-doc-skill-pack-publish.yml tests/test_skill_pack_publisher_contract.py
          git diff --cached --check
          git commit -m 'fix(runner): stage Skill mirror without Pull API dependency'
          git push origin HEAD:fix/skill-publisher-stage-only
