name: S01 Theme 1.35.20 Identity Inventory
on:
  push:
    branches: [temp/s01-update-center-id-closure-20260907]
    paths: [.github/workflows/temp-s01-theme-13520-identity-inventory-20260907.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      SHA: ca3080bb6a257aba9495fabad16ce161acddb0d8
    steps:
      - name: Inventory current version identity references
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-theme.git" repo
          git -C repo checkout -q "$SHA"
          cd repo
          printf '%s\n' 'IDENTITY_PATHS_BEGIN'
          grep -RIl --exclude='CHANGELOG.md' --exclude='README.md' --exclude='GIT_IMPORT_MANIFEST' --exclude='SOURCE_MANIFEST' '1.35.19' VERSION src tests | sort
          printf '%s\n' 'IDENTITY_PATHS_END'
          echo 'WRITE_USED=NO RELEASE_USED=NO DISTRIBUTION_USED=NO PRODUCTION_USED=NO'
