name: p01-full-uxui-final-regression-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-full-uxui-final-regression-temp.yml'
      - 'requests/p01-full-uxui-visual-baseline-20260922.json'

permissions:
  contents: read

jobs:
  canonical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANE_SPEC: requests/p01-full-uxui-visual-baseline-20260922.json
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate exact UXUI lane
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py validate --spec "$LANE_SPEC" >/tmp/lane.json
          python3 scripts/ephemeral_lane_spec.py github-output --spec "$LANE_SPEC" >> "$GITHUB_ENV"
          grep -F '"status": "PASS"' /tmp/lane.json >/dev/null

      - name: Checkout current P01 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v24741-candidate
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: candidate

      - name: Checkout V2.47.40 production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.40
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: stable

      - name: Verify exact clean current source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_worktree.py verify             --spec "$LANE_SPEC"             --repo candidate             --version-file VERSION             --version-file src/VERSION.txt             | tee /tmp/p01-uxui-final-exact.json
          grep -F '"status": "PASS"' /tmp/p01-uxui-final-exact.json >/dev/null
          test "$(git -C stable rev-parse HEAD)" = "73bdfa38310aaabcf6df48810fe8479024a1a819"
          echo P01_UXUI_FINAL_EXACT_SOURCE=PASS

      - name: Isolated canonical regression against V2.47.40
        shell: bash
        run: |
          set -Eeuo pipefail
          stable_abs="$(pwd)/stable"
          set +e
          python3 scripts/ephemeral_lane_worktree.py run-isolated             --spec "$LANE_SPEC"             --repo candidate             --label "p01-uxui-final-canonical"             -- bash tests/canonical_release_regression.sh . "$stable_abs"             | tee /tmp/p01-uxui-final-canonical.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          grep -F '"status": "PASS"' /tmp/p01-uxui-final-canonical.txt >/dev/null
          grep -F '"source_unchanged": true' /tmp/p01-uxui-final-canonical.txt >/dev/null
          echo P01_UXUI_FINAL_CANONICAL=PASS

      - name: Final closure receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'P01_FULL_PRODUCT_UXUI_MACHINE_CLOSURE=PASS'
          echo 'P01_UXUI_VISUAL_SCREENSHOTS=88'
          echo 'P01_UXUI_COMPAT_ROUTES=10'
          echo 'PRODUCTION_WRITE=0'
