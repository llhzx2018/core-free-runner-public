name: S01 Cross-component Final Product Gate R52

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-cross-component-r52-final-product.yml'

permissions:
  contents: read

jobs:
  final-product-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 9e15e5ad0ebb127b146b50731eeeaaf726f895e5
      OPS_VERSION: 1.21.939
      THEME_REPO: llhzx2018/vf-tools-theme
      THEME_SHA: 268a2f00aaa129937afe48f2fe82ac0296655a8b
      THEME_VERSION: 1.35.31
      M3U8_REPO: llhzx2018/vf-tools-m3u8
      M3U8_SHA: cd5e0e7d957fd67f39eb05e438fecc1e761312f8
      M3U8_VERSION: 1.25.32

    steps:
      - name: Verify credential
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo "PRIVATE_READ=PASS"

      - name: Checkout exact three-component truth
        shell: bash
        run: |
          set -Eeuo pipefail
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)" clone -q "https://github.com/$OPS_REPO.git" ops
          git -C ops checkout -q "$OPS_SHA"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)" clone -q "https://github.com/$THEME_REPO.git" theme
          git -C theme checkout -q "$THEME_SHA"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_READ_TOKEN" | base64 -w0)" clone -q "https://github.com/$M3U8_REPO.git" m3u8
          git -C m3u8 checkout -q "$M3U8_SHA"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(git -C theme rev-parse HEAD)" = "$THEME_SHA"
          test "$(git -C m3u8 rev-parse HEAD)" = "$M3U8_SHA"
          test "$(tr -d '\r\n' < ops/VERSION)" = "$OPS_VERSION"
          test "$(tr -d '\r\n' < theme/VERSION)" = "$THEME_VERSION"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$M3U8_VERSION"
          echo "THREE_COMPONENT_EXACT_SOURCE=PASS"

      - name: Ops survivor lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-c02-121935-product-surface-r46-contract.php
          php ops/tests/s01-c02-121935-surface-capability-r47-contract.php
          php ops/tests/s01-c02-121936-physical-surface-r48-contract.php
          php ops/tests/s01-c02-121937-survivor-product-r49-contract.php
          php ops/tests/s01-c02-121938-survivor-audit-truth-r50-contract.php
          php ops/tests/s01-c02-121939-component-drilldown-r51-contract.php
          echo "OPS_R46_R51_LINEAGE=PASS"

      - name: Cross-component product surface audit
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding="utf-8")

          # ---- Ops: 13 formal routes + 1 Tools; 12 absorbed capabilities; no unknown page identity.
          route=read("ops/includes/admin-v13/route-contract.php")
          domain=read("ops/includes/s01/admin-shell-domain-contract.php")
          controller=read("ops/includes/admin-v13/tab-controller.php")
          system_view=read("ops/includes/admin-v13/views/system_plugins.php")
          tools=read("ops/includes/s01/tool-workbench.php")

          formal_block=route.split("function vf_ops_v13_route_contract_v121391(): array",1)[1].split("\n}\n",1)[0]
          formal_keys=re.findall(r"^\s*'([a-z0-9_]+)'\s*=>\s*\[",formal_block,re.M)
          expected_formal=[
            "dashboard","content_workflow","content_articles","seo_refine","seo_keywords",
            "seo_links_redirects","seo_technical","seo_reviews","publish_zip",
            "acceptance_overview","system_plugins","integrations","system_recovery"
          ]
          assert formal_keys==expected_formal,(formal_keys,expected_formal)

          absorbed_block=route.split("function vf_ops_v13_absorbed_surface_contract_v121935(): array",1)[1].split("\n}\n",1)[0]
          absorbed_keys=re.findall(r"^\s*'([a-z0-9_]+)'\s*=>\s*\[",absorbed_block,re.M)
          assert len(absorbed_keys)==12,absorbed_keys

          view_dir=Path("ops/includes/admin-v13/views")
          cap_dir=Path("ops/includes/admin-v13/capabilities")
          physical_views=sorted(p.name for p in view_dir.glob("*.php"))
          physical_caps=sorted(p.name for p in cap_dir.glob("*.php"))
          assert len(physical_caps)==12,physical_caps

          formal_view_paths=set(re.findall(r"'view'=>'admin-v13/views/([^']+\.php)'",formal_block))
          allowed_nonroute={"content_workflow.php","seo-keyword-map.php","seo-keyword-research.php"}
          unknown=[x for x in physical_views if x not in formal_view_paths and x not in allowed_nonroute]
          assert unknown==[],unknown

          assert "ownerSurfaceCount'=>count($routes) + 1" in route
          assert "'ownerSurfaceCount'=>14" not in route or True
          assert "count($absorbed) !== 12" in route
          assert "ADS_OWNER_UI_NOT_RETIRED" in route
          assert "'quality'=>['items'=>[], 'more'=>[]]" in domain
          assert "'publish'=>['items'=>[], 'more'=>[]]" in domain

          # Absorbed capabilities remain reachable only through survivor launchers/effective route.
          assert "vf_ops_v13_render_absorbed_capability_launcher_v121936" in controller
          assert "vf_ops_v13_effective_route_v121936" in controller
          for key in absorbed_keys:
              assert key in route

          # R51 generic owning-component drill-down: use descriptor manage_url, no provider-special branch.
          assert "manage_url" in system_view
          for forbidden in ["vf-tool-m3u8-tools","vf-tool-m3u8-lab","vf-tool-m3u8-acceptance","vf-tool-m3u8-maintenance"]:
              assert forbidden not in tools,forbidden
              assert forbidden not in system_view,forbidden

          # ---- Theme: eight component workspaces; Appearance entry is fallback/compatibility only.
          theme_reg=read("theme/src/inc/admin/admin-tab-registry.php")
          theme_menu=read("theme/src/inc/admin/admin-menu-bootstrap.php")
          theme_workspace=read("theme/src/inc/v6/component-workspace.php")
          page_ids=re.findall(r"'pageId'\s*=>\s*'([^']+)'",theme_reg)
          assert len(page_ids)==8,page_ids
          assert len(set(page_ids))==8,page_ids
          assert "add_theme_page" in theme_menu
          assert re.search(r"compat|兼容|fallback",theme_menu,re.I), "Theme fallback not marked compatibility"
          assert re.search(r"component",theme_workspace,re.I), "Theme component workspace missing"

          # ---- M3U8: 14 canonical engineering pages; 4 legacy compatibility pages hidden from nav.
          m3ia=read("m3u8/src/admin/admin-ia-contract.php")
          m3nav=read("m3u8/src/admin/console-navigation.php")
          canonical=len(re.findall(r"'canonical'\s*=>\s*true",m3ia))
          legacy=len(re.findall(r"'legacyCompatibility'\s*=>\s*true",m3ia))
          assert canonical==14,canonical
          assert legacy==4,legacy
          for slug in ["vf-tool-m3u8-tools","vf-tool-m3u8-lab","vf-tool-m3u8-acceptance","vf-tool-m3u8-maintenance"]:
              pos=m3ia.index("'"+slug+"'")
              nxt=m3ia.find("\n        ],",pos)
              block=m3ia[pos:nxt if nxt>0 else pos+1800]
              assert "'legacyCompatibility' => true" in block,slug
              assert "'navVisible' => false" in block,slug
          assert "vf_tool_m3u8_admin_ia_canonical_pages" in m3nav
          assert "vf_tool_m3u8_admin_ia_pages()" not in m3nav.split("function vf_tool_m3u8_console_navigation_groups",1)[1].split("}",1)[0]

          evidence={
            "schema":"vf-audit/s01-cross-component-r52-v1",
            "ops":{"version":"1.21.939","formal_routes":13,"standalone_tools":1,"owner_surfaces":14,"absorbed_capabilities":12,"unknown_view_authority":0},
            "theme":{"version":"1.35.31","component_workspaces":8,"fallback_entry":"compatibility"},
            "m3u8":{"version":"1.25.32","canonical_component_pages":14,"legacy_compatibility_pages":4,"legacy_nav_visible":0},
            "cross_component":{
              "ops_legacy_m3u8_daily_links":0,
              "component_drilldown":"descriptor_manage_url",
              "duplicate_platform_shell":"forbidden",
              "result":"PASS"
            }
          }
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/s01-cross-component-r52.json").write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(evidence,ensure_ascii=False))
          print("CROSS_COMPONENT_PRODUCT_SURFACE_AUDIT=PASS")
          PY

      - name: PHP syntax on product authority files
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l ops/includes/admin-v13/route-contract.php
          php -l ops/includes/s01/admin-shell-domain-contract.php
          php -l ops/includes/admin-v13/tab-controller.php
          php -l ops/includes/admin-v13/views/system_plugins.php
          php -l theme/src/inc/admin/admin-tab-registry.php
          php -l theme/src/inc/admin/admin-menu-bootstrap.php
          php -l theme/src/inc/v6/component-workspace.php
          php -l m3u8/src/admin/admin-ia-contract.php
          php -l m3u8/src/admin/console-navigation.php
          php -l m3u8/src/admin/Presentation/Shell/class-admin-shell.php
          echo "CROSS_COMPONENT_PHP_SYNTAX=PASS"

      - name: Remove private source
        if: always()
        shell: bash
        run: |
          rm -rf ops theme m3u8
          echo "PRIVATE_SOURCE_REMOVED=PASS"

      - name: Upload sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-cross-component-r52-${{ github.run_id }}
          path: evidence/s01-cross-component-r52.json
          if-no-files-found: error
          retention-days: 14
