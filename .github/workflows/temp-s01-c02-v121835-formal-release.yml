name: TEMP S01-C02 Ops 1.21.835 Formal Release
on:
  push:
    branches:
      - temp/s01-c02-v121835-formal-release-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121835-formal-release.yml'
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      COMMIT: e1195a4c5c5eaf7b53565973413a8273a8fa3f48
      TREE: 08906950f4bd57a0acbc279b352b4b9f2731a21c
      TAG: v1.21.835
      ASSET: vf-tools-ops_V1.21.835.zip
      BYTES: '3270407'
      SHA256: be53f97212aa7f69837af75a801e225d9b9fb9358cea1097efd1399ec3833fa9
      FILES: '917'
      FP: ce2c9956bda5066eba6cd7a692ad02cc89ed49beee7a19e07ab4f7c9d3db5623
    steps:
      - name: Verify authority gates and release absence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$COMMIT"
          if gh api "repos/llhzx2018/vf-tools-ops/git/ref/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" --repo llhzx2018/vf-tools-ops >/dev/null 2>&1; then exit 1; fi
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Rebuild exact artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$COMMIT"
          test "$(git -C ops rev-parse HEAD^{tree})" = "$TREE"
          test "$(tr -d '\r\n' < ops/VERSION)" = 1.21.835
          php ops/.github/phase3/v121835-helper-finalize-closure.php | grep -Fxq PASS_V121835_HELPER_FINALIZE_CLOSURE
          mkdir -p /tmp/release
          python3 - <<'PY'
          import re, hashlib, zipfile, os
          from pathlib import Path
          root=Path('ops'); files={}
          def ok(r):
              p=r.as_posix(); q=p.split('/')
              if any(x.lower() in {'.git','.github','test','tests','doc','docs','evidence','private','tmp','temp','cache','log','logs'} for x in q): return False
              if re.search(r'\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$',p,re.I): return False
              if '/' not in p: return p in {'vf-ops.php','uninstall.php'}
              return q[0] in {'includes','assets','languages','config'}
          for s in root.rglob('*'):
              if s.is_file() and not s.is_symlink():
                  r=s.relative_to(root)
                  if ok(r): files[r.as_posix()]=s.read_bytes()
          files=dict(sorted(files.items())); fp=hashlib.sha256()
          for r,b in files.items(): fp.update((r+'\0'+hashlib.sha256(b).hexdigest()+'\n').encode())
          z=Path('/tmp/release/'+os.environ['ASSET'])
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for r,b in files.items():
                  info=zipfile.ZipInfo('vf-ops/'+r,(2026,9,5,0,0,0)); info.compress_type=zipfile.ZIP_DEFLATED; info.external_attr=0o100644<<16; out.writestr(info,b)
          actual_sha=hashlib.sha256(z.read_bytes()).hexdigest()
          actual_fp=fp.hexdigest()
          assert str(z.stat().st_size)==os.environ['BYTES']
          assert actual_sha==os.environ['SHA256']
          assert str(len(files))==os.environ['FILES']
          assert actual_fp==os.environ['FP']
          print('FORMAL_ASSET_BYTES='+str(z.stat().st_size))
          print('FORMAL_ASSET_SHA256='+actual_sha)
          print('FORMAL_RUNTIME_FILES='+str(len(files)))
          print('FORMAL_RUNTIME_FP='+actual_fp)
          PY
          unzip -tq "/tmp/release/$ASSET" >/dev/null
      - name: Create formal tag release and asset
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<'EOF'
          VF Tools Ops V1.21.835 closes the recovered Static Candidate helper/finalize boundary while preserving fail-closed release gates.

          - Focused Gate 33990955229 PASS on exact source e1195a4c5c5eaf7b53565973413a8273a8fa3f48 / tree 08906950f4bd57a0acbc279b352b4b9f2731a21c.
          - Deterministic Artifact Identity 33991001679 PASS.
          - V1.21.834 Production created a distinct fresh Candidate, but it still terminated at Stage 4 before Final Audit with package=false and finalOnline=NO.
          - V1.21.835 removes the duplicate helper rewrite: resource backfill runs first, then helper/sitemap/action files are generated once, followed by explicit ZIP close.
          - Helper sub-phases are persisted and mapped to privacy-safe failure classes.
          - A new Candidate is re-armed only when the previous V1.21.834 fresh Candidate locally proves offset==total, Completeness PASS, helpers_written=false and the prior build remains unclassified. Otherwise it blocks without retry.
          - The old Candidate job is never reset or reused. Static Source is not re-uploaded or mutated. Final Audit, package, DNS and finalOnline gates are not relaxed or forced.
          - M3U8 migration/data, Seed HOLD, JD.gg, WPvivid, schema and content governance are untouched.
          - Asset vf-tools-ops_V1.21.835.zip; 3270407 bytes; SHA256 be53f97212aa7f69837af75a801e225d9b9fb9358cea1097efd1399ec3833fa9; runtime files 917; fingerprint ce2c9956bda5066eba6cd7a692ad02cc89ed49beee7a19e07ab4f7c9d3db5623.
          - Production upgrade is NOT executed by this GitHub Release.
          EOF
          gh release create "$TAG" "/tmp/release/$ASSET#$ASSET" --repo llhzx2018/vf-tools-ops --target "$COMMIT" --title 'VF Tools Ops v1.21.835' --notes-file /tmp/notes.md
          gh api "repos/llhzx2018/vf-tools-ops/releases/tags/$TAG" > /tmp/release.json
          jq -e --arg t "$TAG" --arg c "$COMMIT" --arg a "$ASSET" --argjson b "$BYTES" --arg d "sha256:$SHA256" '.tag_name==$t and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.name==$a and .size==$b and .digest==$d)] | length)==1' /tmp/release.json >/dev/null
          jq -r '"FORMAL_RELEASE_ID=" + (.id|tostring), "FORMAL_ASSET_ID=" + (.assets[0].id|tostring), "FORMAL_PUBLISHED_AT=" + .published_at' /tmp/release.json
          echo FORMAL_RELEASE_V121835=PASS
