name: P07 136 existing DB native readback synthetic proof
on:
  push:
    branches:
      - task/p07-136-readback-proof-20261110
permissions:
  contents: read
concurrency:
  group: p07-136-native-readback-20261110
  cancel-in-progress: false
jobs:
  readback-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PRODUCT_SHA: 2152844c720bbbc7acfe47e5cdeeb77a66ac29ba
      WORK: /tmp/p07-136-readback-20261110
    steps:
      - name: Checkout exact private P07 source transiently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 2152844c720bbbc7acfe47e5cdeeb77a66ac29ba
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - name: Focused native readback / backup / security / no-reimport regression
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(cat product/BUILD_ID)" = '0.1.0-release136'
          (cd product && python3 -B -m unittest -q \
            tests.test_p07_original_db_protection \
            tests.test_p07_native_existing_db_adoption \
            tests.test_migration_laravel_live_parity \
            tests.test_migration_failed_prepare_audit \
            tests.test_p07_untouched_suffix \
            tests.test_p07_failed_whole_vps_native_readonly)
          echo P07_136_FOCUSED_SYNTHETIC=PASS
      - name: Exact private source real MariaDB 11.8 disposable check
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SHA"
          docker run -d --rm --name p07-136-synthetic \
            -e MARIADB_ROOT_PASSWORD=p07-synthetic-only \
            -p 127.0.0.1:3306:3306 mariadb:11.8 >/dev/null
          trap 'docker rm -f p07-136-synthetic >/dev/null 2>&1 || true' EXIT
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mariadb-client >/dev/null
          for attempt in $(seq 1 60); do
            if MYSQL_PWD=p07-synthetic-only mariadb --no-defaults -h127.0.0.1 -P3306 -uroot --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          (cd product && P07_SYNTHETIC_MARIADB=1 P07_DB_TEST_HOST=127.0.0.1 P07_DB_TEST_PORT=3306 P07_DB_TEST_PASSWORD=p07-synthetic-only \
            python3 -B -m unittest -q tests.test_migration_laravel_readonly_engine tests.test_migration_laravel_mariadb_engine)
          echo P07_136_REAL_DISPOSABLE_MARIADB=PASS
      - name: Cleanup private source and transient files
        if: always()
        shell: bash
        run: |
          rm -rf -- product "$WORK"
          echo P07_136_PRIVATE_WORKSPACE_CLEANED=YES
          echo P07_136_OWNER_DB_WRITES=NONE
          echo P07_136_FORMAL_RELEASE=NO
