name: P07 release86 postrelease Authority exact source
on:
  pull_request:
    branches: [main]
    paths:
      - 'candidates/p07-release86-postrelease/**'
      - '.github/workflows/p07-release86-authority-proof.yml'
permissions:
  contents: read
jobs:
  postrelease-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck exact published source and historical Owner boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$RUNNER_TEMP/p07-release86-postrelease"
          cp -a dist/p07/0.1.0/overlay "$root"
          test "$(cat "$root/BUILD_ID")" = '0.1.0-release86'
          test "$(git hash-object "candidates/p07-release86-postrelease/docs/authority/P07_INTEGRATION_MANIFEST.json")" = 'b18a730d26862052b0d14c587243a13037368e9f'
          mkdir -p "$root/$(dirname 'docs/authority/P07_INTEGRATION_MANIFEST.json')"
          cp "candidates/p07-release86-postrelease/docs/authority/P07_INTEGRATION_MANIFEST.json" "$root/docs/authority/P07_INTEGRATION_MANIFEST.json"
          test "$(git hash-object "candidates/p07-release86-postrelease/README.md")" = 'bd856c0d6304e0e79229e126c0da46207a4897b6'
          mkdir -p "$root/$(dirname 'README.md')"
          cp "candidates/p07-release86-postrelease/README.md" "$root/README.md"
          test "$(git hash-object "candidates/p07-release86-postrelease/docs/authority/USER_ACCEPTANCE.md")" = '87d72a8ae27921a466276babb33385a33e923a9c'
          mkdir -p "$root/$(dirname 'docs/authority/USER_ACCEPTANCE.md')"
          cp "candidates/p07-release86-postrelease/docs/authority/USER_ACCEPTANCE.md" "$root/docs/authority/USER_ACCEPTANCE.md"
          test "$(git hash-object "candidates/p07-release86-postrelease/docs/authority/ACCEPTANCE_MATRIX.md")" = 'c4ddcceb697eec06ddadb119de22a8420b63002e'
          mkdir -p "$root/$(dirname 'docs/authority/ACCEPTANCE_MATRIX.md')"
          cp "candidates/p07-release86-postrelease/docs/authority/ACCEPTANCE_MATRIX.md" "$root/docs/authority/ACCEPTANCE_MATRIX.md"
          test "$(git hash-object "candidates/p07-release86-postrelease/tests/test_p07_integration_manifest.py")" = '223bfa5a689267e187fb2c06998189fe6128ea08'
          mkdir -p "$root/$(dirname 'tests/test_p07_integration_manifest.py')"
          cp "candidates/p07-release86-postrelease/tests/test_p07_integration_manifest.py" "$root/tests/test_p07_integration_manifest.py"
          (cd "$root" && python3 -m json.tool docs/authority/P07_INTEGRATION_MANIFEST.json >/dev/null && PYTHONPATH=lib python3 -m unittest -v tests.test_p07_integration_manifest)
          echo P07_RELEASE86_POSTRELEASE_AUTHORITY_EXACT_MACHINE_PASS
