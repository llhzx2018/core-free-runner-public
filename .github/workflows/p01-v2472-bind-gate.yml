name: P01 V2.47.2 Formal Bind Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2472-bind-gate.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'temp/p01-v2472-bind-gate-20260908'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      FORMAL_SHA: d821f52729da9f4f454d6e81e2ff6dcf520e6b2f
      BASE_SHA: c49c883bf075998acad2ecf5c7f1b156dd05a7fb
    steps:
      - name: Require registered private read capability
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'BIND_GATE_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 81; }

      - name: Verify exact current main identity
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-start/git/ref/heads/main --jq '.object.sha')" = "$FORMAL_SHA"
          echo P01_V2472_MAIN_IDENTITY=PASS

      - name: Checkout exact V2.47.2 Formal Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.FORMAL_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 4
          path: vf-start

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify exact release bind identity
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$FORMAL_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = '2.47.2'
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = '2.47.2'
          grep -Fq "define('VF_VERSION', '2.47.2');" src/app/bootstrap.php
          test "$(git diff --name-only "$BASE_SHA" "$FORMAL_SHA" | wc -l | tr -d ' ')" = '3'
          git diff --name-only "$BASE_SHA" "$FORMAL_SHA" | sort > /tmp/v2472-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort > /tmp/v2472-expected
          diff -u /tmp/v2472-expected /tmp/v2472-files
          test "$(git diff --numstat "$BASE_SHA" "$FORMAL_SHA" | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          echo P01_V2472_FORMAL_BIND_IDENTITY=PASS

      - name: Syntax and Projects UX regression contracts
        working-directory: vf-start
        run: |
          set -Eeuo pipefail
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-php-lint.log
          while IFS= read -r -d '' file; do node --check "$file" >/dev/null; done < <(find src/assets -type f -name '*.js' -print0)
          php tests/unit/projects_description_truth_contract.php
          echo P01_V2472_BIND_GATE=PASS

      - name: Cleanup private source
        if: always()
        run: rm -rf vf-start
