name: P08 R79 real first FULL install on MySQL MariaDB and SQLite
on:
  push:
    branches: [test/p08-r79-owner-install-20261113]
permissions:
  contents: read
jobs:
  r79-native-new-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - driver: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      sql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TEST_DB_DRIVER: ${{ matrix.driver }}
      P08_TEST_DB_HOST: 127.0.0.1
      P08_TEST_DB_CLEAN: p08_ci_clean
      P08_TEST_DB_DIRTY: p08_ci_dirty
      P08_TEST_DB_USER: root
      P08_TEST_DB_PASSWORD: synthetic-only-p08-ci-pass
      COMPOSER_NO_INTERACTION: 1
    steps:
      - name: Verify exact temporary public-safe runner scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = llhzx2018/core-free-runner-public
          test "$GITHUB_REF_NAME" = test/p08-r79-owner-install-20261113
          echo 'P08_R79_NATIVE_DB_NO_PRODUCTION_ACCESS=YES'
      - name: Private exact-source checkout from approved ephemeral Secret
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 0b0c3d7b31123f6229edf71478967530e126435e
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Native PHP 8.4 Composer SQL drivers
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3,pdo_sqlite,pdo_mysql,zip,curl,sodium,mbstring,dom,xml,intl,bcmath,fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and first install contracts
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 0b0c3d7b31123f6229edf71478967530e126435e
          git cat-file -e 956c4d2144915e392d745f6ddbbad3c7e1c21442^{commit}
          php -l src/Installation/SetupGuard.php
          php -l src/Installation/OwnerWebInstaller.php
          php -l tests/test_install_mysql_e2e.php
          php -l tests/test_install_sqlite_e2e.php
          php tests/test_setup_guard.php
          php tests/test_setup_experience_contract.php
          python3 scripts/check_bridge_runtime_parity.py
          python3 scripts/check_stack_contract.py --phase foundation
          composer validate --strict --no-check-publish
          echo 'P08_R79_NATIVE_NEW_INSTALL_SOURCE_GATE=PASS'
      - name: Build and audit real Composer and Vite Bridge FULL target FULL Atomic
        shell: bash
        working-directory: source
        run: |
          set -Eeuo pipefail
          python3 scripts/build_owner_atomic_pair.py \
            --repo "$PWD" \
            --target-sha 0b0c3d7b31123f6229edf71478967530e126435e \
            --output-dir "$RUNNER_TEMP/p08-r79-artifacts"
          python3 scripts/verify_owner_atomic_pair.py \
            "$RUNNER_TEMP/p08-r79-artifacts" \
            956c4d2144915e392d745f6ddbbad3c7e1c21442 \
            0b0c3d7b31123f6229edf71478967530e126435e
          echo 'P08_R79_GENUINE_SOURCE_LOCKED_FULL=PASS'
      - name: Create isolated native MySQL MariaDB clean dirty schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          php source/tests/fixtures/create_ci_databases.php
          echo 'P08_R79_SQL_CLEAN_DIRTY_FIXTURES=PASS'
      - name: Real new FULL first install to native MySQL or MariaDB invalid optional token skip
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/p08-r79-sql-first"
          unzip -q "$RUNNER_TEMP/p08-r79-artifacts/VF_AdOps_V0.1.1_FULL.zip" \
            -d "$RUNNER_TEMP/p08-r79-sql-first"
          test ! -e "$RUNNER_TEMP/p08-r79-sql-first/.env"
          mkdir "$RUNNER_TEMP/p08-r79-sql-first/tests"
          cp source/tests/test_install_mysql_e2e.php "$RUNNER_TEMP/p08-r79-sql-first/tests/"
          cd "$RUNNER_TEMP/p08-r79-sql-first"
          php tests/test_install_mysql_e2e.php
          test -f storage/app/private/adops/installation/installed.json
          test ! -f storage/app/private/adops/upgrade/github-read-token
          echo 'P08_R79_NATIVE_MYSQL_FAMILY_CLEAN_FULL_INVALID_TOKEN_SKIP=PASS'
      - name: Independently install new FULL SQLite with positive mocked read Token
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/p08-r79-sqlite-first"
          unzip -q "$RUNNER_TEMP/p08-r79-artifacts/VF_AdOps_V0.1.1_FULL.zip" \
            -d "$RUNNER_TEMP/p08-r79-sqlite-first"
          mkdir "$RUNNER_TEMP/p08-r79-sqlite-first/tests"
          cp source/tests/test_install_sqlite_e2e.php "$RUNNER_TEMP/p08-r79-sqlite-first/tests/"
          cd "$RUNNER_TEMP/p08-r79-sqlite-first"
          php tests/test_install_sqlite_e2e.php
          test -f storage/app/private/adops/upgrade/github-read-token
          echo 'P08_R79_SQLITE_CLEAN_FULL_TEST_TOKEN_NATIVE_PROOF=PASS'
      - name: Always remove private source databases and unsigned ZIPs from public runner
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source "$RUNNER_TEMP/p08-r79-artifacts" \
            "$RUNNER_TEMP/p08-r79-sql-first" "$RUNNER_TEMP/p08-r79-sqlite-first"
          echo 'P08_R79_PRIVATE_SOURCE_AND_SQL_DATA_PERSISTED=NO'
