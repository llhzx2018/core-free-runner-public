name: R62 Focused Contextual Favorite Badge Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r62-contextual-favorite.yml'

permissions:
  contents: read

jobs:
  r62-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ed57144ca62d6eb1c5d2500ffffeb5214da4930d
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: ed57144ca62d6eb1c5d2500ffffeb5214da4930d
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,curl
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l tests/unit/contextual_favorite_badge_contract.php
          php tests/unit/contextual_favorite_badge_contract.php
          php tests/unit/start_popular_sort_control_contract.php
          php tests/unit/card_layout_density_control_contract.php
          echo R62_CONTEXTUAL_FAVORITE_BADGE_PASS
          echo R62_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
