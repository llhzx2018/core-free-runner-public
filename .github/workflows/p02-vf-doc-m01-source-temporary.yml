name: TEMP P02 VF Doc M01 exact private source tests
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p02-vf-doc-m01-source-temporary.yml

permissions:
  contents: read

jobs:
  vf-doc-source:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/p02-vf-doc-m01-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, mariadb]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic_p02_m01
          MYSQL_DATABASE: p02_m01
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -psynthetic_p02_m01"
          --health-interval=10s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: synthetic_p02_m01
          MARIADB_DATABASE: p02_m01
        ports: [3307:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      APP_ALLOWED_HOSTS: localhost
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db == 'mariadb' && '3307' || '3306' }}
      DB_DATABASE: ${{ matrix.db == 'sqlite' && ':memory:' || 'p02_m01' }}
      DB_USERNAME: root
      DB_PASSWORD: synthetic_p02_m01
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout temp public runner orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact private vf-doc SHA with transient credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-doc
          ref: f463cc06988ebe3e11acac4ecb4b2316d97c2891
          path: target
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP8.4 native extensions and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, xml, curl, zip, openssl
          coverage: none
      - name: Node22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify exact source and fast static tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = f463cc06988ebe3e11acac4ecb4b2316d97c2891
          test "$(cat target/VERSION)" = 0.1.0-dev.1
          (
            cd target
            python3 -B scripts/check_bootstrap.py
            python3 -B scripts/check_source_contract.py
            python3 -m unittest discover -s tests -p test_bootstrap.py
            python3 -m unittest discover -s tests/guards -p 'test_*.py'
            python3 -m unittest discover -s tests/evolution -p test_second_module.py
            find app routes config database/migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          )
          echo P02_M01_SOURCE_GUARDS=PASS
      - name: Resolve dev-only dependencies and build
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          composer update --no-interaction --prefer-dist --no-progress --no-audit
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test:frontend
          npm run build
          echo P02_M01_FRONTEND_BUILD=PASS
      - name: Real engine migration and native test
        shell: bash
        working-directory: target
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          composer test
          echo P02_M01_NATIVE_TEST=PASS
      - name: Always remove private checkout and generated credentials
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf target
          test ! -e target
          echo P02_M01_PRIVATE_CHECKOUT_CLEANUP=PASS
