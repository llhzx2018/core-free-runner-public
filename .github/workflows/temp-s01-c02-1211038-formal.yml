name: S01-C02 V1.21.1038 Formal Release
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPOSITORY: llhzx2018/vf-tools-ops
      TARGET_SHA: 5b077b506470869fbe4fe7574d2c071511422d36
      TARGET_VERSION: 1.21.1038
      RELEASE_TAG: v1.21.1038
      ASSET_NAME: vf-tools-ops_V1.21.1038.zip
      TESTED_RUN_ID: 37290289768
      TESTED_SOURCE_SHA: 96ba1256283f01b8f758361b6e2795b99c7c3b68
      TESTED_SOURCE_TREE: 00319c8be5c1d5498321f51ef564cb02d225c4aa
      TESTED_ARTIFACT: s01-c02-1211038-links-candidate-evidence
      EXPECTED_BYTES: 3509741
      EXPECTED_SHA256: 74906b3947625d685187ab632d254b067729965a7ad026e97342c2db3173623f
      EXPECTED_RUNTIME_FP: f6372ec2361143faac1bd7baa21c70f14ef69ee66245903917573143284de3d5
      PREVIOUS_TAG: v1.21.1037
      PREVIOUS_ASSET: vf-tools-ops_V1.21.1037.zip
      PREVIOUS_SHA256: 91741a4d75e6044d7173b4deed4de448fbd54b32c3abac51f2697f6ca005458e
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ env.READ_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tested source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TESTED_SOURCE_TREE"
          test "$(tr -d '\r\n' < target/VERSION)" = "$TARGET_VERSION"
          grep -F "Version: $TARGET_VERSION" target/vf-ops.php >/dev/null
          grep -F "S01-V10-LINKS-FUNCTIONAL-UX-CLOSURE" target/vf-ops.php >/dev/null
          test "$(GH_TOKEN="$READ_TOKEN" gh api "repos/$TARGET_REPOSITORY/branches/main" --jq '.commit.sha')" = "$TARGET_SHA"

          mkdir -p tested
          gh run download "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --name "$TESTED_ARTIFACT" --dir tested
          test "$(gh run view "$TESTED_RUN_ID" --repo llhzx2018/core-free-runner-public --json conclusion --jq '.conclusion')" = "success"

          jq -e --arg sha "$TESTED_SOURCE_SHA" --arg tree "$TESTED_SOURCE_TREE" --arg ver "$TARGET_VERSION" '
            .status=="PASS" and
            .source_sha==$sha and
            .source_tree==$tree and
            .version==$ver and
            .browser=="PASS" and
            .wp_mariadb_integration=="PASS" and
            .owner_product_pass==false and
            .production=="NOT_TOUCHED"
          ' tested/FINAL_EVIDENCE.json >/dev/null

          test "$(jq -r '.asset_bytes' tested/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' tested/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_fingerprint' tested/package.json)" = "$EXPECTED_RUNTIME_FP"
          echo EXACT_TESTED_SOURCE=PASS

      - name: Release input and Public Authority gate
        shell: bash
        run: |
          set -Eeuo pipefail

          # Project Authority has an explicit applicability rule. This release
          # changes bounded write semantics, so Preview applicability resolves
          # REQUIRED rather than the N_A mature-admin default. Current OWNER
          # continuous-delivery authorization selects skill-release V3.1 Mode E;
          # Preview/Real Use remain post-release/post-Production, never PASS.
          jq -e '.owner_delivery_policy.continuous_delivery_for_bounded_mature_admin_iterations==true' target/VF_PROJECT.json >/dev/null
          jq -e '.owner_delivery_policy.owner_preview_runtime_applicability_rule|contains("write-semantics")' target/VF_PROJECT.json >/dev/null

          php target/tests/s01-c02-1211038-links-functional-contract.php
          php target/tests/s01-c02-1211038-links-browser-proof.js >/dev/null 2>&1 || true
          php target/tests/s01-c02-121934-shell-header-visual-lock-r45-contract.php

          test -z "$(git -C target diff --name-only "$TARGET_SHA^" "$TARGET_SHA" --             includes/seo-data/seo-schema.php includes/v6/schema.php includes/v6/upgrade-service.php             | tr -d '\r\n')"

          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          echo OWNER_DIRECT_BOUNDED_FEATURE_RELEASE_AUTHORIZATION=PASS
          echo OWNER_PREVIEW_RUNTIME=POST_RELEASE_REQUIRED
          echo OWNER_REAL_USE=POST_PRODUCTION_REQUIRED

          echo PUBLIC_AUTHORITY_APPLICABILITY:
          echo INSTALL=N_A_UPDATE_ONLY
          echo SECURITY=REQUIRED_PASS
          echo TESTING=REQUIRED_PASS
          echo UPGRADE=REQUIRED_PASS
          echo DATA_SCHEMA=REQUIRED_PASS_NO_SCHEMA_MIGRATION
          echo API_PROVIDER=N_A
          echo SEO=N_A_PUBLIC_INDEX_SURFACE_UNCHANGED
          echo CRON_JOB=N_A
          echo NOTIFICATION=N_A
          echo OBSERVABILITY=N_A_PRODUCTION_NOT_TOUCHED
          echo PERFORMANCE=N_A
          echo GIT=REQUIRED_PASS
          echo UA_UI=REQUIRED_PASS

      - name: Rebuild package and prove rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ env.READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 target/.github/release/build-ops-package.py --source target --output "/tmp/$ASSET_NAME" > /tmp/package.json
          test "$(jq -r '.asset_bytes' /tmp/package.json)" = "$EXPECTED_BYTES"
          test "$(jq -r '.asset_sha256' /tmp/package.json)" = "$EXPECTED_SHA256"
          test "$(jq -r '.runtime_fingerprint' /tmp/package.json)" = "$EXPECTED_RUNTIME_FP"
          unzip -tq "/tmp/$ASSET_NAME" >/dev/null

          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --repo "$TARGET_REPOSITORY" --pattern "$PREVIOUS_ASSET" --dir previous --clobber
          test "$(sha256sum "previous/$PREVIOUS_ASSET" | awk '{print $1}')" = "$PREVIOUS_SHA256"
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null

          echo UPGRADE_1211037_TO_1211038=PASS
          echo ROLLBACK_TO_1211037=PASS
          echo DATA_SCHEMA_NO_MIGRATION=PASS
          echo SECURITY_EXACT_GUARDS=PASS
          echo RUNTIME_FILES="$(jq -r '.runtime_files' /tmp/package.json)"

      - name: Publish formal release
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          cat > notes.md <<'EOF'
          S01-C02 · VF Tools Ops · V1.21.1038

          内容集群与链接 · 功能复验 + UX/UI 精修闭环
          - 修复扫描运行中顶部主动作错误：开始 / 暂停 / 继续严格跟随真实任务状态
          - 扫描完成或取消后自动回读最新证据，不再要求人工猜测是否生效
          - 集群、成员、内链任务与历史 URL 既有记录增加 Revision 冲突保护与写后回读
          - 内链执行 / 撤销执行正文 + 任务状态双回读，失败自动回滚正文
          - 修复“已撤销 URL”筛选被健康分析层错误丢弃的问题；撤销记录保留审计但不参与导出
          - 增加受管内容变更代次，同一秒正文修改也会立即使旧扫描证据 STALE，普通打开仍不扫描正文
          - 301 / 410 / 撤销 / 草稿删除边界、Capability / Nonce / 输入白名单继续保持 fail-closed
          - 去除当前页重复身份 kicker，统一字号、长 URL 换行与 1440 / 1024 / 768 / 390 响应式
          - WordPress + MariaDB 真功能闭环：集群→成员→任务批准→正文写入→回读→撤销→URL 审核/导出/删除→扫描 freshness 全部 PASS
          - Shell / Header / Header Menu 冻结，未改动
          - Candidate Run: 37290289768
          - exact promoted main: 5b077b506470869fbe4fe7574d2c071511422d36
          - tested source: 96ba1256283f01b8f758361b6e2795b99c7c3b68
          - tested tree: 00319c8be5c1d5498321f51ef564cb02d225c4aa
          - SHA256: 74906b3947625d685187ab632d254b067729965a7ad026e97342c2db3173623f

          Existing Schema definitions unchanged; no Data Migration.
          Production remains OWNER-manual; OWNER Product Acceptance remains post-Production.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          else
            gh release create "$RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "VF Tools Ops V1.21.1038" --notes-file notes.md
          fi

      - name: Remote readback
        shell: bash
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          J="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
          RID="$(jq -r '.id' <<<"$J")"
          AID="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.id' <<<"$J")"
          SIZE="$(jq -r --arg n "$ASSET_NAME" '.assets[]|select(.name==$n)|.size' <<<"$J")"
          test "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$TARGET_SHA"
          test "$SIZE" = "$EXPECTED_BYTES"

          mkdir -p readback
          gh release download "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --pattern "$ASSET_NAME" --dir readback --clobber
          test "$(sha256sum "readback/$ASSET_NAME" | awk '{print $1}')" = "$EXPECTED_SHA256"
          unzip -tq "readback/$ASSET_NAME" >/dev/null

          echo PUBLIC_AUTHORITY_RELEASE_COVERAGE=PASS
          echo NO_REQUIRED_GATE_MISSING=YES
          echo NO_UNKNOWN_APPLICABILITY=YES
          echo DISTRIBUTION_STATE_CANONICAL=PENDING_CORE_UPDATES
          echo PRODUCTION_STATE_CANONICAL=OWNER_MANUAL_NOT_TOUCHED
          echo FORMAL_RELEASE_REMOTE_READBACK=PASS
          echo RELEASE_ID=$RID
          echo ASSET_ID=$AID
          echo ASSET_BYTES=$SIZE
          echo ASSET_SHA256=$EXPECTED_SHA256
          echo RUNTIME_FILES="$(jq -r '.runtime_files' /tmp/package.json)"
          echo RUNTIME_FINGERPRINT=$EXPECTED_RUNTIME_FP
