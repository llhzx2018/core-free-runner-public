name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-nav-footer165-20261022]
    paths: ['.github/workflows/s01-nav-footer165-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.165
  TARGET_SHA: a017844e57272eb85e8bd9563cbd46650ce67ad8
  UPDATE_SHA: e581fd10fca83e531dbe5b8bf61d35e05af3cdea
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: e581fd10fca83e531dbe5b8bf61d35e05af3cdea
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='f617fdfccd6fef7999bc17878c923bfad800fae714ec50fedce4f7fb343101e8' and m['asset_bytes']==1969213
          assert m['runtime_files']==476 and '1.35.164' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
