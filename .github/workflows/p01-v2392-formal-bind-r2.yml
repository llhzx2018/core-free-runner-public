name: P01 V2.39.2 Formal Bind R2 Probe

on:
  push:
    branches:
      - gate/p01-v2392-formal-bind-20260903-r1
    paths:
      - '.github/workflows/p01-v2392-formal-bind-r2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_P01_HEAD: f639a9dee3120e688d9faf96d29ea3e230cdb59b
      P01_REF: f639a9dee3120e688d9faf96d29ea3e230cdb59b
    steps:
      - name: Require private checkout credential
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          echo 'PRIVATE_CHECKOUT_CREDENTIAL_PRESENT=YES'

      - name: Checkout exact private P01 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.P01_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p01

      - name: Bind exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          ACTUAL="$(git -C p01 rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_P01_HEAD"
          echo "P01_V2392_PROBE_HEAD=$ACTUAL"

      - name: Private source cleanup
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf p01
          test ! -e p01
          echo 'P01_PRIVATE_SOURCE_CLEANUP=PASS'
