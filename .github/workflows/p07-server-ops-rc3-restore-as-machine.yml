name: P07 Server Ops RC3 Restore-As Machine Gate

on:
  push:
    branches: [main, work/p07-guided-init9-cloudpanel-foundation, work/p07-guided-init9-real-gate-ux]
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/BUILD_ID'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-user'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-site-ui'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-migrate-ui'
      - 'dist/p07/0.1.0-rc3/overlay/bin/vfops-cloudpanel-ui'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/cloudpanel_site.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/site_lifecycle.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as.py'
      - 'dist/p07/0.1.0-rc3/overlay/lib/restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_machine_e2e.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - 'installers/p07-rc3-candidate.sh'
      - '.github/workflows/p07-server-ops-rc3-restore-as-machine.yml'
  pull_request:
    paths:
      - 'dist/p07/0.1.0-rc3/overlay/**'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_verified.py'
      - 'dist/p07/0.1.0-rc3/tests/test_restore_as_machine_e2e.py'
      - 'dist/p07/0.1.0-rc3/tests/test_menu3_modular.py'
      - 'installers/p07-rc3-candidate.sh'
      - '.github/workflows/p07-server-ops-rc3-restore-as-machine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-as-machine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build guided-init9 combined runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/p07-restore-as-gate
          mkdir -p /tmp/p07-restore-as-gate
          cp -a dist/p07/0.1.0-rc2/vf-server-ops/. /tmp/p07-restore-as-gate/
          cp -a dist/p07/0.1.0-rc3/overlay/. /tmp/p07-restore-as-gate/
          mkdir -p /tmp/p07-restore-as-gate/tests
          cp dist/p07/0.1.0-rc3/tests/test_restore_as.py /tmp/p07-restore-as-gate/tests/
          cp dist/p07/0.1.0-rc3/tests/test_restore_as_verified.py /tmp/p07-restore-as-gate/tests/
          cp dist/p07/0.1.0-rc3/tests/test_restore_as_machine_e2e.py /tmp/p07-restore-as-gate/tests/
          cp dist/p07/0.1.0-rc3/tests/test_menu3_modular.py /tmp/p07-restore-as-gate/tests/
          test "$(cat /tmp/p07-restore-as-gate/BUILD_ID)" = '0.1.0-rc3-guided-init9'

      - name: Exact source identity
        run: |
          set -euo pipefail
          test "$(git hash-object /tmp/p07-restore-as-gate/bin/vfops-user)" = '71b35360d24fa2a4d8fc55ea1f3e2ae1598c5032'
          test "$(git hash-object /tmp/p07-restore-as-gate/bin/vfops-site-ui)" = 'e1c210466dbfdcd81a41e1af3a40bc074866de35'
          test "$(git hash-object /tmp/p07-restore-as-gate/bin/vfops-migrate-ui)" = 'acd3230599fda6eb9f2901bf0ac68ec08964c18b'
          test "$(git hash-object /tmp/p07-restore-as-gate/bin/vfops-cloudpanel-ui)" = 'a37d218a3ba0614a59a9e9c53230425215406cae'
          test "$(git hash-object /tmp/p07-restore-as-gate/lib/cloudpanel.py)" = 'fb9f7ab742d981a0fe180b1c2304afb81a6b3b48'
          test "$(git hash-object /tmp/p07-restore-as-gate/lib/cloudpanel_site.py)" = '3de08127e517c1a460706f64aa7fde9aa6b86f2b'
          test "$(git hash-object /tmp/p07-restore-as-gate/lib/site_lifecycle.py)" = '9a24156d87223de67aae57d744abed7a63fbce4a'
          test "$(git hash-object /tmp/p07-restore-as-gate/lib/restore_as.py)" = '296373b81a1af46fbccd922926520b85cd49a9bf'
          test "$(git hash-object /tmp/p07-restore-as-gate/lib/restore_as_verified.py)" = '05897451b0f8e068271211f2052e2af9197f5736'
          test "$(git hash-object /tmp/p07-restore-as-gate/tests/test_restore_as.py)" = 'd7760cdf28700588702595e8286b67d27893fbf2'
          test "$(git hash-object /tmp/p07-restore-as-gate/tests/test_restore_as_machine_e2e.py)" = 'e3e06d40df40d70b24dabc0c8eb0a5234d3afca0'
          test "$(git hash-object /tmp/p07-restore-as-gate/tests/test_menu3_modular.py)" = '98889c04f0657fc4770b67bdef9e7aa7ab198cc4'

      - name: Syntax and modular UX gate
        run: |
          set -euo pipefail
          bash -n /tmp/p07-restore-as-gate/bin/vfops-user
          bash -n /tmp/p07-restore-as-gate/bin/vfops-site-ui
          bash -n /tmp/p07-restore-as-gate/bin/vfops-migrate-ui
          bash -n /tmp/p07-restore-as-gate/bin/vfops-cloudpanel-ui
          python3 -m py_compile \
            /tmp/p07-restore-as-gate/lib/cloudpanel.py \
            /tmp/p07-restore-as-gate/lib/cloudpanel_site.py \
            /tmp/p07-restore-as-gate/lib/site_lifecycle.py \
            /tmp/p07-restore-as-gate/lib/restore_as.py \
            /tmp/p07-restore-as-gate/lib/restore_as_verified.py \
            /tmp/p07-restore-as-gate/tests/test_restore_as.py \
            /tmp/p07-restore-as-gate/tests/test_restore_as_verified.py \
            /tmp/p07-restore-as-gate/tests/test_restore_as_machine_e2e.py \
            /tmp/p07-restore-as-gate/tests/test_menu3_modular.py
          cd /tmp/p07-restore-as-gate
          python3 tests/test_menu3_modular.py -v

      - name: Restore-As lifecycle behavior
        env:
          PYTHONPATH: /tmp/p07-restore-as-gate/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-restore-as-gate
          python3 tests/test_restore_as.py -v

      - name: Automatic local verification and rollback behavior
        env:
          PYTHONPATH: /tmp/p07-restore-as-gate/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-restore-as-gate
          python3 tests/test_restore_as_verified.py -v

      - name: End-to-end synthetic CloudPanel Restore-As
        env:
          PYTHONPATH: /tmp/p07-restore-as-gate/lib
        run: |
          set -euo pipefail
          cd /tmp/p07-restore-as-gate
          python3 tests/test_restore_as_machine_e2e.py -v

      - name: Fail-closed safety and evidence invariants
        run: |
          set -euo pipefail
          grep -Fq 'existing_site_overwrite_allowed": False' /tmp/p07-restore-as-gate/lib/restore_as.py
          grep -Fq 'dns_changed": False' /tmp/p07-restore-as-gate/lib/restore_as.py
          grep -Fq 'source_deleted": False' /tmp/p07-restore-as-gate/lib/restore_as.py
          grep -Fq 'SOURCE_DOMAIN_CERTIFICATE_NOT_REUSED' /tmp/p07-restore-as-gate/lib/restore_as.py
          grep -Fq 'LOCAL_HTTP_RESOLVE' /tmp/p07-restore-as-gate/lib/restore_as_verified.py
          grep -Fq 'LOCAL_HTTPS_SNI' /tmp/p07-restore-as-gate/lib/restore_as_verified.py
          grep -Fq 'TARGET_VHOST_PRESENT_TLS_DEFERRED' /tmp/p07-restore-as-gate/lib/restore_as_verified.py
          grep -Fq '/var/lib/vf-server-ops/evidence/restore-as' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          grep -Fq 'install -d -m 700 "$EVIDENCE_DIR"' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          grep -Fq 'install -m 600 "$result_file" "$evidence_file"' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          grep -Fq 'P07_RESTORE_AS_VERIFIED=' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          grep -Fq 'P07_RESTORE_DNS_CHANGED=0' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          ! grep -Fq 'REAL_PASS' /tmp/p07-restore-as-gate/bin/vfops-site-ui
          ! grep -Eiq '\b(update_dns|write_dns|set_dns|delete_dns|cloudflare)\b' /tmp/p07-restore-as-gate/lib/restore_as.py /tmp/p07-restore-as-gate/lib/restore_as_verified.py

      - name: Candidate installer carries full runtime
        run: |
          set -euo pipefail
          grep -Fq 'EXPECTED_BUILD_ID="0.1.0-rc3-guided-init9"' installers/p07-rc3-candidate.sh
          grep -Fq 'bin/vfops-site-ui' installers/p07-rc3-candidate.sh
          grep -Fq 'bin/vfops-migrate-ui' installers/p07-rc3-candidate.sh
          grep -Fq 'bin/vfops-cloudpanel-ui' installers/p07-rc3-candidate.sh
          grep -Fq 'lib/cloudpanel.py' installers/p07-rc3-candidate.sh
          grep -Fq 'lib/site_lifecycle.py' installers/p07-rc3-candidate.sh
          grep -Fq 'lib/restore_as.py' installers/p07-rc3-candidate.sh
          grep -Fq 'lib/restore_as_verified.py' installers/p07-rc3-candidate.sh
          grep -Fq '71b35360d24fa2a4d8fc55ea1f3e2ae1598c5032' installers/p07-rc3-candidate.sh
          grep -Fq 'e1c210466dbfdcd81a41e1af3a40bc074866de35' installers/p07-rc3-candidate.sh
          grep -Fq '296373b81a1af46fbccd922926520b85cd49a9bf' installers/p07-rc3-candidate.sh
          grep -Fq 'P07_RESTORE_AS_VERIFIED=' installers/p07-rc3-candidate.sh
          grep -Fq "if grep -Fq 'REAL_PASS' \"\$SRC_DIR/bin/vfops-site-ui\"; then" installers/p07-rc3-candidate.sh
          grep -Fq 'Restore-As UI 不得把 Machine/未知环境冒充 Real PASS。' installers/p07-rc3-candidate.sh

      - name: Result
        run: echo 'P07_RC3_RESTORE_AS_MACHINE=PASS'
