name: P01 IA6 v2.47.492 canonical zero-debt prepublish gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia6-247492-integrated-preflight-20261103.yml']
permissions:
  contents: read
jobs:
  canonical:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'test(P01):')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      PRODUCT_BRANCH: release/p01-ia6-247492-candidate-20261103
      PRODUCT_SHA: 7668b58542717bb858df447b092134b410f9b5ee
      BASE_TAG: v2.47.491
    steps:
      - name: Checkout test-only gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare canonical PHP runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx curl
      - name: Pin candidate and last formal release without publishing
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          remote="$(git ls-remote "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$remote" = "$PRODUCT_SHA"
          git clone -q --no-checkout "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" candidate
          git -C candidate fetch -q --depth 1 origin "$PRODUCT_SHA"
          git -C candidate checkout -q --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$PRODUCT_SHA"
          git clone -q --depth 1 --branch "$BASE_TAG" "https://x-access-token:$READ_TOKEN@github.com/$PRODUCT_REPO.git" stable
          test "$(tr -d '\r\n ' < stable/VERSION)" = "2.47.491"
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.492"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.492"
          grep -Fqx "define('VF_VERSION', '2.47.492');" <(grep -F "define('VF_VERSION'," candidate/src/app/bootstrap.php)
          echo P01_IA6_CANONICAL_EXACT_SOURCE_AND_FORMAL_BASELINE=PASS
      - name: Canonical repository-native release regression against v2.47.491
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate stable --require-zero-debt | tee /tmp/p01-ia6-canonical-247492.txt
          grep -Fx P01_CANONICAL_UNIT_REGRESSION=PASS /tmp/p01-ia6-canonical-247492.txt
          grep -Fx P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS /tmp/p01-ia6-canonical-247492.txt
          test -z "$(git -C candidate status --porcelain)"
          echo P01_IA6_247492_CANONICAL_PREPUBLISH=PASS
      - name: Delete disposable private source
        if: always()
        shell: bash
        run: |
          rm -rf candidate stable
          rm -f /tmp/p01-ia6-canonical-247492.txt
          echo P01_IA6_247492_CANONICAL_CLEANUP=PASS
