name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-recovery170-20261022]
    paths: ['.github/workflows/s01-recovery170-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.170
  TARGET_SHA: 5e54d38be3dca221438f28519b2faf5f2c77d241
  UPDATE_SHA: 102cdccf78e44c252fb70fabe8b12b66d9f93967
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 102cdccf78e44c252fb70fabe8b12b66d9f93967
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='d66a7f2522a0e69fe04aa6de6e5eed4e42d7ff096093853cc35cba25f4b9a2fa' and m['asset_bytes']==1971834
          assert m['runtime_files']==476 and '1.35.169' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
