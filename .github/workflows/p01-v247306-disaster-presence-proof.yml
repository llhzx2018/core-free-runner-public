name: P01 V247306 Disaster Package Presence Source Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-v247306-disaster-presence-proof.yml']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: dac58e095bc4414f7214df9a5ea48281a55ee7b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout prior formal stable
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: v2.47.305
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: stable
      - name: Prepare PHP 8.3 SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,curl,zip,mbstring
          coverage: none
      - name: Focused disaster package and backup safety
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = dac58e095bc4414f7214df9a5ea48281a55ee7b4
          node --check src/assets/data-recovery.js
          node --check tests/browser/disaster_package_presence_v247306_smoke.cjs
          node tests/browser/disaster_package_presence_v247306_smoke.cjs
          php tests/unit/admin_data_safety_page8_polish_contract.php
          node tests/browser/backup_missing_alert_v247297_smoke.cjs
          node tests/browser/backup_upgrade_retention_preview_v247298_smoke.cjs
          php tests/unit/backup_missing_history_readonly_audit_native.php
          php tests/unit/backup_upgrade_age_readonly_native.php
          php tests/unit/backup_storage_capacity_readonly_contract.php
          echo P01_DISASTER_PRESENCE_FOCUSED=PASS
      - name: Canonical exact-source zero-debt
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tests/canonical_release_regression.sh . stable --require-zero-debt
          echo P01_DISASTER_PRESENCE_CANONICAL=PASS
