name: P01 V2.26 Release Identity
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v226-release-identity-20260828.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      RELEASE_BRANCH: release/p01-v2.26.0-20260828
      EXACT_BASE: 66c3b69527c3273c8dc923c88b3d5bfee8eda3ce
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.RELEASE_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify exact release base
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_BASE"
          test "$(git rev-parse HEAD^{tree})" = '1f68db30b1a060456378dd482bbf7aaa5235f9fd'
          test "$(cat VERSION)" = '2.25.0'
          test "$(cat src/VERSION.txt)" = '2.25.0'
          grep -F "define('VF_VERSION', '2.25.0');" src/app/bootstrap.php >/dev/null
          test "$(find src/migrations -type f | wc -l)" -ge 1
      - name: Prepare V2.26.0 formal identity
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '2.26.0\n' > VERSION
          printf '2.26.0\n' > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.25.0');"
          new="define('VF_VERSION', '2.26.0');"
          if s.count(old)!=1: raise SystemExit('bootstrap version anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          c=Path('CHANGELOG.md')
          t=c.read_text(encoding='utf-8')
          if '## V2.26.0 · Formal Release · 2026-08-28' not in t:
              entry="""## V2.26.0 · Formal Release · 2026-08-28\n\n- 私人工作区锁定 Raindrop-inspired 单工作区交互 Authority；VF AdminShell 继续作为视觉 Authority。\n- Dashboard Home 退出日常路径，管理员默认进入“全部收藏”；Start / Channels / Watch 成为同一资产库的资源视图。\n- Start 改为紧凑 Collection/List；Channels 改为创作者/内容源列表；Watch 保留影视索引 Grid。\n- 资源整理降级为 Inbox / 待整理；Classic Start、管理网址与伪新增快捷入口退出日常 Topbar。\n- Desktop 1365×768 / Mobile 390×844 Screenshot Audit PASS；匿名 Public Start、Schema、权限、隐私、URL Identity 不变。\n- Feature Gate `33161906048`、Screenshot Audit `33162117162`、Final Feature Head Gate `33162587296`、Develop Exact Gate `33162766997` PASS。\n\n"""
              c.write_text(entry+t,encoding='utf-8',newline='\n')
          PY
          test "$(git diff --name-only | sort | paste -sd, -)" = 'CHANGELOG.md,VERSION,src/VERSION.txt,src/app/bootstrap.php'
          git diff --check
          test "$(cat VERSION)" = '2.26.0'
          grep -F "define('VF_VERSION', '2.26.0');" src/app/bootstrap.php >/dev/null
      - name: Commit and push exact release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add CHANGELOG.md VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): prepare V2.26.0 identity'
          git push origin HEAD:"$RELEASE_BRANCH"
          echo "P01_V226_RELEASE_SOURCE=$(git rev-parse HEAD)"
          echo "P01_V226_RELEASE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Verdict
        run: |
          echo P01_V226_RELEASE_IDENTITY=PASS
          echo SCHEMA=2026082801
          echo FEATURE_TREE=1f68db30b1a060456378dd482bbf7aaa5235f9fd
          echo PRODUCTION_WRITE=NO
