name: P02 V2.5.81 R2 Browser Gate

on:
  push:
    branches:
      - task/p02-v2581-r1-hash-gate-20260921
    paths:
      - '.github/workflows/p02-v2581-r2-browser-gate.yml'
      - 'requests/p02-v2581-r2/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Checkout exact P02 R2 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 4db743d7d42634132aed0f4e6822cabc7a3eda24
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none
      - name: Install Playwright Chromium
        working-directory: product
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run R2 exact-source browser gate
        run: bash runner/requests/p02-v2581-r2/run.sh product
      - name: Run existing full UX browser regression
        working-directory: product
        run: bash scripts/ux-browser-reverify.sh
      - name: Remove transient private checkout
        if: always()
        run: rm -rf product
