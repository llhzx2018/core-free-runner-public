name: P01 Round 6 Software Reinstall Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p01-round6-software-gate-20260905.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_REF: feature/p01-software-reinstall-workspace-20260905
      EXPECTED_SHA: 7017df64a3140045dc79750aca51865af3273aaa
      BASE_SHA: 02e1b158a5800e47a9689b7e11ae914a45d2c501
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Verify exact source and no-schema boundary
        shell: bash
        run: |
          set -euo pipefail
          cd product
          tested="$(git rev-parse HEAD)"
          echo "TESTED_SHA=${tested}"
          test "${tested}" = "${EXPECTED_SHA}"
          test "$(cat VERSION)" = "2.46.1"
          changed="$(git diff --name-only "${BASE_SHA}..HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(VERSION|src/VERSION\.txt|src/migrations/|src/app/bootstrap\.php)$'; then exit 1; fi
      - name: PHP and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          cd product
          for file in src/software.php src/app/SoftwareWorkspaceHome.php src/app/SoftwareWorkspaceDetail.php tests/unit/software_workspace_contract.php tests/unit/software_workspace_source_contract.php; do php -l "$file"; done
          node --check src/assets/software-workspace.js
      - name: Focused contracts
        shell: bash
        run: |
          set -euo pipefail
          cd product
          php tests/unit/software_workspace_contract.php
          php tests/unit/software_workspace_source_contract.php
          php tests/unit/workspace_view_catalog_contract.php
          php tests/unit/workspace_nine_entry_source_contract.php
          php tests/unit/resource_search_contract.php
          php tests/unit/quick_open_global_contract.php
