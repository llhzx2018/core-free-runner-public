name: P02 V2.4.25 Formal Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p02-v2.4.25-formal-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p02-v2-4-25-formal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REPOSITORY: llhzx2018/vf-library
      PRODUCT_SHA: 11019841b837038092b153930ab8e185bf2a2676
      AUTHORITY_SHA: 08233e0cf5aab0bcebb131b4a35321d9352c66fc
      PRODUCTION_SHA: b8f26afd81e0c736923579eb6fe5b298dd9fc8e3
      VERSION: 2.4.25
      SOURCE_VERSION: 2.4.24
      SCHEMA: '2401'
      TAG: v2.4.25
      SOURCE_REF: task/v2.4.25-product-optimization
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Require governed credentials
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN" || { echo 'VF_PRIVATE_READ_TOKEN missing' >&2; exit 78; }
          test -n "$WRITE_TOKEN" || { echo 'VF_RELEASE_WRITE_TOKEN missing' >&2; exit 79; }
          echo GOVERNED_CREDENTIAL_GATE=PASS

      - name: Checkout exact Product Runtime Identity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: 11019841b837038092b153930ab8e185bf2a2676
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Production 2.4.24 base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-library
          ref: b8f26afd81e0c736923579eb6fe5b298dd9fc8e3
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: p02-old
          fetch-depth: 1
          persist-credentials: false

      - name: Exact Product and Remote Truth gate
        working-directory: p02
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          test "$(python3 -c 'import json;print(json.load(open("SOURCE_MANIFEST.json"))["version"])')" = "$VERSION"
          test "$(python3 -c 'import json;print(json.load(open("SOURCE_MANIFEST.json"))["schema"])')" = "$SCHEMA"
          test "$(python3 -c 'import json;print(json.load(open("SOURCE_MANIFEST.json"))["runtime_source_file_count"])')" = 53
          python3 scripts/verify-source-manifest.py
          DEVELOP=$(gh api repos/$REPOSITORY/branches/develop --jq .commit.sha)
          MAIN=$(gh api repos/$REPOSITORY/branches/main --jq .commit.sha)
          test "$DEVELOP" = "$AUTHORITY_SHA"
          test "$MAIN" = "$PRODUCTION_SHA"
          git merge-base --is-ancestor "$PRODUCT_SHA" "$AUTHORITY_SHA"
          test -z "$(git diff "$PRODUCT_SHA".."$AUTHORITY_SHA" -- src public config database migrations templates assets scripts/build-deploy-tree.sh scripts/build-release.py scripts/repair-template.php VERSION SOURCE_MANIFEST.json SOURCE_MANIFEST.txt)"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then echo 'Release already exists; immutable duplicate refused.' >&2; exit 80; fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then echo 'Tag already exists; immutable duplicate refused.' >&2; exit 81; fi
          echo EXACT_PRODUCT_IDENTITY=PASS
          echo REMOTE_TRUTH_GATE=PASS
          echo MAIN_UNCHANGED=PASS

      - name: Install release verification runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-zip php-curl sqlite3 curl unzip
          php -r 'foreach(["pdo_sqlite","sqlite3","zip","fileinfo","sodium"] as $x){if(!extension_loaded($x)){fwrite(STDERR,"missing:$x\n");exit(1);}} echo "RELEASE_RUNTIME=PASS\n";'

      - name: Deterministic Formal Build A and B
        working-directory: p02
        run: |
          set -Eeuo pipefail
          TREE=$(git show -s --format=%T "$PRODUCT_SHA")
          python3 scripts/build-release.py --out build/formal-a --source-commit "$PRODUCT_SHA" --source-tree "$TREE" --source-ref "$SOURCE_REF" | tee "$RUNNER_TEMP/build-a.json"
          python3 scripts/build-release.py --out build/formal-b --source-commit "$PRODUCT_SHA" --source-tree "$TREE" --source-ref "$SOURCE_REF" | tee "$RUNNER_TEMP/build-b.json"
          mapfile -t A < <(find build/formal-a -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t B < <(find build/formal-b -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${A[*]}" = "${B[*]}"
          test "${#A[@]}" = 8
          for n in "${A[@]}"; do cmp -s "build/formal-a/$n" "build/formal-b/$n" || { echo "NON_DETERMINISTIC:$n" >&2; exit 82; }; done
          (cd build/formal-a && sha256sum -c SHA256SUMS.txt)
          (cd build/formal-b && sha256sum -c SHA256SUMS.txt)
          git diff --exit-code
          git diff --cached --exit-code
          echo DETERMINISTIC_FORMAL_BUILD=PASS

      - name: ZIP integrity path safety privacy identity SHA bytes
        working-directory: p02
        run: |
          set -Eeuo pipefail
          OUT="$PWD/build/formal-a"
          for z in "$OUT"/*.zip; do unzip -t "$z" >/dev/null; done
          python3 - "$OUT" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,re,sys,zipfile
          from pathlib import Path,PurePosixPath
          out=Path(sys.argv[1]); commit=sys.argv[2]; ver='2.4.25'; src='2.4.24'
          required=[f'VF_Library_V{ver}_SOURCE.zip',f'VF_Library_V{ver}_FULL.zip',f'VF_Library_V{ver}_UPDATE.zip',f'VF_Library_V{ver}_ATOMIC.zip',f'repair-v{ver}.php',f'VF_Library_V{ver}_RELEASE_MANIFEST.json',f'VF_Library_V{ver}_RELEASE_NOTES.md','SHA256SUMS.txt']
          assert sorted(p.name for p in out.iterdir() if p.is_file())==sorted(required)
          def safe(names):
              assert len(names)==len(set(names))
              for n in names:
                  p=PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts and '\\' not in n and not re.match(r'^[A-Za-z]:',n),n
          for zpath in out.glob('*.zip'):
              with zipfile.ZipFile(zpath) as z: safe(z.namelist())
          with zipfile.ZipFile(out/f'VF_Library_V{ver}_FULL.zip') as z:
              names=z.namelist(); assert z.read('VERSION.txt').decode().strip()==ver; assert 'assets/navigation-refresh-policy.js' in names
              m=json.loads(z.read('release-manifest.json')); assert m['version']==ver and m['schema_version']==2401 and m['source_commit']==commit
              bad=[n for n in names if re.search(r'(^|/)(_import_chunks|private_data|node_modules|\.git)(/|$)',n,re.I) or n.lower().endswith(('.sqlite','.sqlite3','.db','.log','.env')) or n.startswith('tests/') or n.startswith('.github/')]
              assert not bad,bad
          with zipfile.ZipFile(out/f'VF_Library_V{ver}_UPDATE.zip') as z:
              m=json.loads(z.read('atomic-manifest.json')); assert m['source_version']==src and m['target_version']==ver and m['source_schema']==m['target_schema']==2401
              seen=set()
              for e in m['files']:
                  p='payload/'+e['path']; assert p in z.namelist() and p not in seen; seen.add(p); b=z.read(p); assert len(b)==e['bytes'] and hashlib.sha256(b).hexdigest()==e['sha256']
              assert 'payload/assets/navigation-refresh-policy.js' in seen
          with zipfile.ZipFile(out/f'VF_Library_V{ver}_SOURCE.zip') as z:
              names=z.namelist(); assert z.read('VERSION').decode().strip()==ver; assert 'public/assets/navigation-refresh-policy.js' in names
              bad=[n for n in names if re.search(r'(^|/)(_import_chunks|private_data|node_modules|\.git)(/|$)',n,re.I) or n.lower().endswith(('.sqlite','.sqlite3','.db','.log','.env'))]
              assert not bad,bad
          repair=out/f'repair-v{ver}.php'
          with zipfile.ZipFile(out/f'VF_Library_V{ver}_ATOMIC.zip') as z: assert z.namelist()==[repair.name] and z.read(repair.name)==repair.read_bytes()
          rm=json.load(open(out/f'VF_Library_V{ver}_RELEASE_MANIFEST.json',encoding='utf-8')); assert rm['version']==ver and rm['source']['candidate_commit']==commit and rm['build']['schema']==2401 and rm['build']['runtime_source_files']==53 and rm['compatibility']['supported_from']==[src]
          sums={}
          for line in (out/'SHA256SUMS.txt').read_text().splitlines():
              h,n=line.split('  ',1); sums[n]=h
          assert set(sums)==set(required)-{'SHA256SUMS.txt'}
          for n,h in sums.items(): assert hashlib.sha256((out/n).read_bytes()).hexdigest()==h
          print('ZIP_INTEGRITY_PATH_SAFETY_PRIVACY_IDENTITY_SHA_BYTES=PASS')
          for n in required:
              p=out/n; print(f'ASSET {n} {p.stat().st_size} {hashlib.sha256(p.read_bytes()).hexdigest()}')
          PY

      - name: Formal FULL Fresh Install
        working-directory: p02
        env:
          TEST_PASSWORD: P02-FORMAL-FULL-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/formal-full"; SITE="$ROOT/site"; PORT=18250; BASE="http://127.0.0.1:$PORT"; mkdir -p "$SITE"
          unzip -q build/formal-a/VF_Library_V2.4.25_FULL.zip -d "$SITE"
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$ROOT/server.log" 2>&1 & PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" "$BASE/setup.php" > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H "Origin: $BASE" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")" = 303
          curl -fsS -b "$ROOT/cookie" "$BASE/api.php?action=session" > "$ROOT/session.json"
          python3 - "$ROOT/session.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.4.25'
          PY
          (cd "$SITE" && php cli/verify.php) > "$ROOT/verify.json"
          python3 - "$ROOT/verify.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['schema_version']==2401 and x['integrity']=='ok' and x['foreign_key_errors']==0
          PY
          test -f "$SITE/assets/navigation-refresh-policy.js"
          kill "$PID" 2>/dev/null || true; trap - EXIT
          echo FORMAL_FULL_FRESH_INSTALL=PASS

      - name: Formal 2.4.24 to 2.4.25 UPDATE identity and existing-data gate
        working-directory: p02
        env:
          TEST_PASSWORD: P02-FORMAL-UPGRADE-${{ github.run_id }}!
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/formal-upgrade"; SITE="$ROOT/site"; PKG="$ROOT/pkg"; PORT=18251; BASE="http://127.0.0.1:$PORT"; mkdir -p "$ROOT" "$PKG"
          bash ../p02-old/scripts/build-deploy-tree.sh "$SITE" >/dev/null
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = 2.4.24
          php -d display_errors=0 -S "127.0.0.1:$PORT" -t "$SITE" >"$ROOT/server.log" 2>&1 & PID=$!; trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do curl -fsS "$BASE/setup.php" >/dev/null 2>&1 && break; sleep .25; done
          curl -fsS -c "$ROOT/cookie" "$BASE/setup.php" > "$ROOT/setup.html"
          TOKEN=$(python3 - "$ROOT/setup.html" <<'PY'
          import html,re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf" value="([^"]+)"',s);assert m;print(html.unescape(m.group(1)))
          PY
          )
          test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$ROOT/cookie" -c "$ROOT/cookie" -H "Origin: $BASE" --data-urlencode "setup_csrf=$TOKEN" --data-urlencode "password=$TEST_PASSWORD" --data-urlencode "password_confirm=$TEST_PASSWORD" "$BASE/setup.php")" = 303
          curl -fsS -b "$ROOT/cookie" "$BASE/api.php?action=session" > "$ROOT/session.json"; CSRF=$(python3 -c 'import json;print(json.load(open("'$ROOT'/session.json"))["csrf"])')
          printf '%s' '{"name":"Formal Existing Data","description":"release fixture","icon":"folder"}' > "$ROOT/cat.json"
          curl -fsS -b "$ROOT/cookie" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' --data-binary @"$ROOT/cat.json" "$BASE/api.php?action=category_save" > "$ROOT/cat.out"; CID=$(python3 -c 'import json;print(json.load(open("'$ROOT'/cat.out"))["id"])')
          python3 - "$ROOT/item.json" "$CID" <<'PY'
          import json,sys
          json.dump({'category_id':int(sys.argv[2]),'title':'正式发布升级保持 UTF-8 ✓','content':'formal release durable body 中文','content_mode':'article','content_format':'markdown','primary_action':'read','status':'active'},open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False)
          PY
          curl -fsS -b "$ROOT/cookie" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' --data-binary @"$ROOT/item.json" "$BASE/api.php?action=content_save" > "$ROOT/item.out"; IID=$(python3 -c 'import json;print(json.load(open("'$ROOT'/item.out"))["id"])')
          printf '%s' '{"note":"formal pre-upgrade backup"}' > "$ROOT/backup.json"
          curl -fsS -b "$ROOT/cookie" -H "Origin: $BASE" -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' --data-binary @"$ROOT/backup.json" "$BASE/api.php?action=backup" > "$ROOT/backup.out"
          python3 - "$ROOT/backup.out" <<'PY'
          import json,sys
          assert json.load(open(sys.argv[1]))['ok']
          PY
          unzip -q build/formal-a/VF_Library_V2.4.25_UPDATE.zip -d "$PKG"
          php -r 'require $argv[1]."/app/bootstrap.php";$m=json_decode(file_get_contents($argv[2]."/atomic-manifest.json"),true);$files=[];foreach($m["files"] as $e)$files[$e["path"]]=["bytes"=>(int)$e["bytes"],"sha256"=>(string)$e["sha256"]];$r=VfLibraryAtomicUpgradeService::fromCurrentRuntime()->upgrade("2.4.24","2.4.25",$argv[2]."/payload",$files,["source_schema"=>2401,"target_schema"=>2401]);if(($r["target"]??"")!=="2.4.25"||empty($r["self_check"]["ok"]))exit(22);echo "FORMAL_UPDATE_EXECUTION=PASS\n";' "$SITE" "$PKG"
          test "$(tr -d '\r\n' < "$SITE/VERSION.txt")" = 2.4.25
          php -r 'require $argv[1]."/app/bootstrap.php";$d=vftb_db();if(VfLibrarySchemaMigration::currentVersion($d)!==2401)exit(31);$q=$d->prepare("SELECT title,content FROM text_items WHERE id=?");$q->execute([(int)$argv[2]]);$x=$q->fetch(PDO::FETCH_ASSOC);if(!$x||$x["title"]!=="正式发布升级保持 UTF-8 ✓"||$x["content"]!=="formal release durable body 中文")exit(32);if($d->query("PRAGMA integrity_check")->fetchColumn()!=="ok")exit(33);if(count($d->query("PRAGMA foreign_key_check")->fetchAll())!==0)exit(34);echo "FORMAL_EXISTING_DATA_SQLITE=PASS\n";' "$SITE" "$IID"
          curl -fsS -b "$ROOT/cookie" "$BASE/api.php?action=session" > "$ROOT/post.json"
          python3 - "$ROOT/post.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['ok'] and x['site']['auth'] and x['version']=='2.4.25'
          PY
          kill "$PID" 2>/dev/null || true; trap - EXIT
          echo FORMAL_2424_TO_2425_UPGRADE_IDENTITY=PASS

      - name: Create immutable exact tag and GitHub Release
        working-directory: p02
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT="$PWD/build/formal-a"
          gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$PRODUCT_SHA" >/dev/null
          TAG_SHA=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$TAG_SHA" = "$PRODUCT_SHA"
          gh release create "$TAG" "$OUT/VF_Library_V2.4.25_SOURCE.zip" "$OUT/VF_Library_V2.4.25_FULL.zip" "$OUT/VF_Library_V2.4.25_UPDATE.zip" "$OUT/VF_Library_V2.4.25_ATOMIC.zip" "$OUT/repair-v2.4.25.php" "$OUT/VF_Library_V2.4.25_RELEASE_MANIFEST.json" "$OUT/VF_Library_V2.4.25_RELEASE_NOTES.md" "$OUT/SHA256SUMS.txt" --repo "$REPOSITORY" --verify-tag --title "VF Library V2.4.25" --notes-file "$OUT/VF_Library_V2.4.25_RELEASE_NOTES.md"
          echo FORMAL_TAG_AND_RELEASE_CREATE=PASS

      - name: Exact immutable Release readback
        working-directory: p02
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          OUT="$PWD/build/formal-a"
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$OUT" "$PRODUCT_SHA" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          rel=json.load(open(sys.argv[1])); out=Path(sys.argv[2]); product=sys.argv[3]
          assert rel['tag_name']=='v2.4.25' and rel['name']=='VF Library V2.4.25' and not rel['draft'] and not rel['prerelease']
          expected={p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in out.iterdir() if p.is_file()}
          assets={a['name']:a for a in rel['assets']}
          assert set(assets)==set(expected),(set(assets),set(expected))
          for n,(size,sha) in expected.items():
              a=assets[n]; assert a['size']==size,(n,a['size'],size)
              digest=a.get('digest')
              if digest is not None: assert digest==f'sha256:{sha}',(n,digest,sha)
          print('RELEASE_ID='+str(rel['id']))
          print('TAG='+rel['tag_name'])
          for n in ['VF_Library_V2.4.25_FULL.zip','VF_Library_V2.4.25_UPDATE.zip','VF_Library_V2.4.25_ATOMIC.zip']:
              size,sha=expected[n]; print(f'FINAL {n} {size} {sha}')
          print('GITHUB_RELEASE_EXACT_READBACK=PASS')
          PY
          TAG_SHA=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          test "$TAG_SHA" = "$PRODUCT_SHA"
          test "$(gh api repos/$REPOSITORY/branches/main --jq .commit.sha)" = "$PRODUCTION_SHA"
          echo MAIN_POST_RELEASE_UNCHANGED=PASS

      - name: Publish metadata-only formal release evidence
        working-directory: p02
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/p02-release-evidence"
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$PWD/build/formal-a" "$RUNNER_TEMP/p02-release-evidence/release-summary.json" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          rel=json.load(open(sys.argv[1])); out=Path(sys.argv[2]); dest=sys.argv[3]
          keep=['VF_Library_V2.4.25_FULL.zip','VF_Library_V2.4.25_UPDATE.zip','VF_Library_V2.4.25_ATOMIC.zip']
          d={'project':'P02','version':'2.4.25','product_runtime_commit':os.environ['PRODUCT_SHA'],'schema':2401,'tag':'v2.4.25','release_id':rel['id'],'assets':{},'deterministic_build':'PASS','zip_integrity':'PASS','path_safety':'PASS','privacy':'PASS','fresh_install':'PASS','upgrade_identity_2_4_24_to_2_4_25':'PASS','production_upgrade':'NOT_EXECUTED','production_write':0,'main_promotion':'NOT_EXECUTED'}
          for n in keep:
              p=out/n; d['assets'][n]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          json.dump(d,open(dest,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          if grep -RIE '(cookie|session|password|PRIVATE_DATA|BEGIN [A-Z ]*PRIVATE KEY|ghp_|github_pat_)' "$RUNNER_TEMP/p02-release-evidence"; then exit 90; fi
          cat "$RUNNER_TEMP/p02-release-evidence/release-summary.json"

      - name: Upload metadata evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p02-v2.4.25-formal-release-${{ github.run_id }}
          path: ${{ runner.temp }}/p02-release-evidence
          retention-days: 14

      - name: Cleanup private checkout and release build
        if: always()
        run: rm -rf p02 p02-old "$RUNNER_TEMP/formal-full" "$RUNNER_TEMP/formal-upgrade" "$RUNNER_TEMP/p02-release-evidence" "$RUNNER_TEMP/release.json" || true
