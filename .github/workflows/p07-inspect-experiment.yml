name: P07 Inspect Experiment

on:
  push:
    branches:
      - experiment/p07-inspect-v01
    paths:
      - experiments/p07-inspect.sh
      - .github/workflows/p07-inspect-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NO_COLOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        run: bash -n experiments/p07-inspect.sh

      - name: Version
        run: |
          chmod +x experiments/p07-inspect.sh
          ./experiments/p07-inspect.sh --version | grep -F '0.3.0'

      - name: Self-test
        run: ./experiments/p07-inspect.sh --self-test | grep -F 'SELF_TEST=PASS'

      - name: Demo human accuracy
        run: |
          ./experiments/p07-inspect.sh --demo | tee /tmp/inspect.txt
          grep -F 'Root Filesystem' /tmp/inspect.txt
          grep -F 'Nested Virt Flag' /tmp/inspect.txt
          grep -F 'CloudPanel Sites   3' /tmp/inspect.txt
          grep -F 'Inventory Source   cloudpanel_db+vhost' /tmp/inspect.txt
          grep -F '134.199.214.199' /tmp/inspect.txt
          ! grep -F 'Total Disk' /tmp/inspect.txt

      - name: Demo JSON contract
        run: |
          ./experiments/p07-inspect.sh --demo --json | tee /tmp/inspect.json
          python3 -c "import json; p=json.load(open('/tmp/inspect.json',encoding='utf-8')); assert p['module']=='p07-inspect'; assert p['version']=='0.3.0'; assert p['disk']['scope']=='root_filesystem'; assert p['inventory']['status']=='AVAILABLE'; assert p['inventory']['site_count']=='3'; assert 'nested_virtualization_flag' in p['cpu']"

      - name: Explicit Inventory JSON adapter
        run: |
          cat > /tmp/inventory.json <<'JSON'
          {"schema":"vf-server-ops.inventory.v1","system":{"cloudpanel_version":"2.5-test"},"discovery_source":"cloudpanel_db+vhost","summary":{"site_count":7,"mysql_database_count_known":4,"sqlite_file_count_known":2,"pm2_process_count_known":3},"warnings":["demo"]}
          JSON
          ./experiments/p07-inspect.sh --inventory-json /tmp/inventory.json --json > /tmp/inspect-with-inventory.json
          python3 -c "import json; p=json.load(open('/tmp/inspect-with-inventory.json')); i=p['inventory']; assert i['site_count']=='7'; assert i['mysql_database_count_known']=='4'; assert i['warning_count']=='1'"

      - name: Inventory Authority boundary
        run: |
          grep -F 'VFOPS_INVENTORY_PY' experiments/p07-inspect.sh
          grep -F '/opt/vf-server-ops/lib/inventory.py' experiments/p07-inspect.sh
          ! grep -F '/home/clp/htdocs/app/data/db.sq3' experiments/p07-inspect.sh
          ! grep -F 'SELECT id, domain_name' experiments/p07-inspect.sh

      - name: Supply-chain and read-only safety
        run: |
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' experiments/p07-inspect.sh
          ! grep -F -- '--no-check-certificate' experiments/p07-inspect.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' experiments/p07-inspect.sh
          ! grep -Eq 'sysctl[[:space:]]+-w|systemctl[[:space:]]+(restart|stop)|reboot|shutdown' experiments/p07-inspect.sh
