name: temp-s01-m3u8-12531-formal-release-20260908
on:
  push:
    branches: [temp/s01-page-update-center-v4-20260907]
    paths: [.github/workflows/temp-s01-m3u8-12531-formal-release-20260908.yml]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      SHA: c1c682a69ef34d0eca16a5ad1f2db5bd052775bd
      TAG: v1.25.31
      ASSET: vf-tools-m3u8_V1.25.31.zip
      REPO: llhzx2018/vf-tools-m3u8
    steps:
      - name: Build verify publish and read back M3U8 1.25.31
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo 'RELEASE_MODE=EXACT_MAIN PRODUCTION_WRITE_USED=NO STATIC_WRITE_USED=NO ONLINE_WRITE_USED=NO MIGRATION_WRITE_USED=NO THEME_WRITE_USED=NO OPS_WRITE_USED=NO'
          test "$(gh api repos/$REPO/branches/main --jq '.commit.sha')" = "$SHA"
          ! gh api repos/$REPO/git/ref/tags/$TAG >/dev/null 2>&1
          ! gh api repos/$REPO/releases/tags/$TAG >/dev/null 2>&1
          rm -rf /tmp/m3u8-src "$RUNNER_TEMP/m3u8-a" "$RUNNER_TEMP/m3u8-b" "$RUNNER_TEMP/m3u8-r"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/${REPO}.git" /tmp/m3u8-src
          git -C /tmp/m3u8-src checkout -q "$SHA"
          test "$(git -C /tmp/m3u8-src rev-parse HEAD)" = "$SHA"
          cd /tmp/m3u8-src
          test "$(tr -d '\r\n' < VERSION)" = '1.25.31'
          grep -F 'Version: 1.25.31' src/vf-tool-m3u8.php >/dev/null
          grep -F "VF_TOOL_M3U8_VERSION', '1.25.31" src/vf-tool-m3u8.php >/dev/null
          test -f src/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css
          grep -F 'vf-tool-m3u8-routine-surfaces-v4' src/admin/admin-s01-uiux-polish.php >/dev/null
          grep -F 'admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css' src/admin/admin-s01-uiux-polish.php >/dev/null
          php tests/routine-surfaces-visible-ui-contract.php
          php tests/provider-dashboard-visible-ui-contract.php
          php tests/frontend-s01-uiux-final-owner-contract.php
          for f in tests/unit/*.php; do php "$f"; done
          php -l src/vf-tool-m3u8.php >/dev/null
          git diff --exit-code "$SHA" -- src/config src/database src/migrations docs/authority/CURRENT.md
          mkdir -p "$RUNNER_TEMP/m3u8-a" "$RUNNER_TEMP/m3u8-b" "$RUNNER_TEMP/m3u8-r"
          python3 - <<'PY' > "$RUNNER_TEMP/m3u8-metrics.env"
          from pathlib import Path
          import hashlib,zipfile,os
          root=Path('/tmp/m3u8-src/src')
          rows=sorted([(p.relative_to(root).as_posix(),p.read_bytes()) for p in root.rglob('*') if p.is_file()], key=lambda x:x[0])
          assert len(rows)==562, len(rows)
          runtime=''.join(f'{rel}\0{hashlib.sha256(data).hexdigest()}\n' for rel,data in rows).encode()
          runtime_fp=hashlib.sha256(runtime).hexdigest()
          def build(path):
              dirs={'vf-tool-m3u8/'}
              for rel,_ in rows:
                  cur='vf-tool-m3u8'
                  for part in rel.split('/')[:-1]: cur+='/'+part; dirs.add(cur+'/')
              with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for d in sorted(dirs):
                      zi=zipfile.ZipInfo(d); zi.date_time=(1980,1,1,0,0,0); zi.external_attr=(0o40755<<16)|0x10; z.writestr(zi,b'')
                  for rel,data in rows:
                      zi=zipfile.ZipInfo('vf-tool-m3u8/'+rel); zi.date_time=(1980,1,1,0,0,0); zi.compress_type=zipfile.ZIP_DEFLATED; zi.external_attr=0o100644<<16; z.writestr(zi,data)
              blob=Path(path).read_bytes(); return len(rows),len(blob),hashlib.sha256(blob).hexdigest()
          a=build(Path(os.environ['RUNNER_TEMP'])/'m3u8-a'/os.environ['ASSET']); b=build(Path(os.environ['RUNNER_TEMP'])/'m3u8-b'/os.environ['ASSET']); assert a==b
          print(f'FILES={a[0]}'); print(f'BYTES={a[1]}'); print(f'SHA256={a[2]}'); print(f'RUNTIME_FP={runtime_fp}')
          PY
          cat "$RUNNER_TEMP/m3u8-metrics.env" >> "$GITHUB_ENV"; set -a; source "$RUNNER_TEMP/m3u8-metrics.env"; set +a
          cmp "$RUNNER_TEMP/m3u8-a/$ASSET" "$RUNNER_TEMP/m3u8-b/$ASSET"
          python3 - <<'PY'
          import os,zipfile
          p=os.environ['RUNNER_TEMP']+'/m3u8-a/'+os.environ['ASSET']
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              assert len(names)==562 and z.testzip() is None
              assert all(n.startswith('vf-tool-m3u8/') for n in names)
              assert 'vf-tool-m3u8/vf-tool-m3u8.php' in names
              assert 'vf-tool-m3u8/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css' in names
              main=z.read('vf-tool-m3u8/vf-tool-m3u8.php'); assert b'Version: 1.25.31' in main
              loader=z.read('vf-tool-m3u8/admin/admin-s01-uiux-polish.php'); assert b'vf-tool-m3u8-routine-surfaces-v4' in loader
              css=z.read('vf-tool-m3u8/admin/ui-v4/pages/r78-routine-surfaces-visible-v4.css')
              for token in [b'.vf-v510-settings',b'.vf-preview',b'.vf-recovery',b'@media (max-width:782px)']:
                  assert token in css, token
          PY
          created_tag=0; created_release=0
          cleanup(){ rc=$?; if [ "$rc" -ne 0 ]; then if [ "$created_release" -eq 1 ]; then gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes >/dev/null 2>&1||true; elif [ "$created_tag" -eq 1 ]; then gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1||true; fi; fi; exit "$rc"; }
          trap cleanup EXIT
          gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null; created_tag=1
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          cat > "$RUNNER_TEMP/m3u8-notes" <<EOF
          S01-C03 Routine Admin Surfaces Visible UI Refinement.
          Exact main source: $SHA
          Visible Candidate Gate: 34222039200 PASS
          1.25.31 Bump Gate: 34222216105 PASS
          Post-push exact Bump Gate: 34222341521 PASS
          Tool Settings, Real Frontend Preview and Backup & Restore now share one visible hierarchy, dominant action model, focused workspace layout and responsive behavior.
          Provider schema remains 1.3.0; physical locator remains vf-tool-m3u8/vf-tool-m3u8.php; locator cutover remains false; migration remains CLOSED.
          Production: NOT_RUN
          Static: NOT_RUN
          Online: NOT_RUN
          EOF
          gh release create "$TAG" "$RUNNER_TEMP/m3u8-a/$ASSET" --repo "$REPO" --title 'VF Tools M3U8 V1.25.31' --notes-file "$RUNNER_TEMP/m3u8-notes" --draft --verify-tag; created_release=1
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir "$RUNNER_TEMP/m3u8-r"
          test "$(stat -c %s "$RUNNER_TEMP/m3u8-r/$ASSET")" = "$BYTES"
          test "$(sha256sum "$RUNNER_TEMP/m3u8-r/$ASSET"|awk '{print $1}')" = "$SHA256"
          cmp "$RUNNER_TEMP/m3u8-a/$ASSET" "$RUNNER_TEMP/m3u8-r/$ASSET"
          gh release edit "$TAG" --repo "$REPO" --draft=false
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/m3u8-final.json"
          test "$(jq -r '.draft' "$RUNNER_TEMP/m3u8-final.json")" = false
          test "$(jq -r '.prerelease' "$RUNNER_TEMP/m3u8-final.json")" = false
          test "$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.size' "$RUNNER_TEMP/m3u8-final.json")" = "$BYTES"
          digest="$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.digest // empty' "$RUNNER_TEMP/m3u8-final.json")"; if [ -n "$digest" ]; then test "$digest" = "sha256:$SHA256"; fi
          trap - EXIT
          echo "TAG_TARGET=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "RELEASE_ID=$(jq -r '.id' "$RUNNER_TEMP/m3u8-final.json")"
          echo "ASSET_ID=$(jq -r --arg a "$ASSET" '.assets[]|select(.name==$a)|.id' "$RUNNER_TEMP/m3u8-final.json")"
          echo "REMOTE_BYTES=$BYTES"; echo "ASSET_SHA256=$SHA256"; echo "RUNTIME_FILES=$FILES"; echo "RUNTIME_FP=$RUNTIME_FP"
          echo 'TESTED_ARTIFACT_EQUALS_DELIVERED_ARTIFACT=PASS'
          echo 'PASS_S01_C03_M3U8_12531_FORMAL_RELEASE'
