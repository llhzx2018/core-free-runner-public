name: P01 V2.47.410 native update discovery (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v247410-native-discovery-20261021.yml'
permissions:
  contents: read
jobs:
  native-discovery:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify live public-channel manifest with original V2.47.409 UpdateCore
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          trap 'rm -rf "$GITHUB_WORKSPACE/product" "$GITHUB_WORKSPACE/channel.json"' EXIT
          curl -fsSL --retry 2 \
            -H "Authorization: Bearer ${READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main' \
            | jq -r '.content' | base64 -d > channel.json
          jq -e '.project_id=="P01" and .component_id=="APP"
            and .target_version=="2.47.410"
            and .current_version=="2.47.409"
            and .from_versions==["2.47.409"]
            and .release_tag=="v2.47.410"
            and .asset_name=="VF_Start_V2.47.410_UPDATE.zip"
            and .asset_bytes==2667772
            and .asset_sha256=="e93f14b03b0591f8c72470fc8709ca39adcfe10f49e780828610e6bd74473a39"
            and .product_identity=="930b0e78fdaf00732d6040cc0dd569ebe41340d9"' channel.json >/dev/null
          git clone -q --depth 1 --branch v2.47.409 \
            "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" product
          test "$(git -C product rev-parse HEAD)" = "1ba6d2e0fbc79ac5e4026c0d7209098910359e5c"
          php -r '
            require "product/src/app/CoreUpdates/UpdateCore.php";
            $manifest=json_decode(file_get_contents("channel.json"),true,512,JSON_THROW_ON_ERROR);
            $core=new CoreUpdates\UpdateCore("P01","APP");
            $available=$core->check("2.47.409","2026090401",$manifest);
            $old=$core->check("2.47.408","2026090401",$manifest);
            $current=$core->check("2.47.410","2026090401",$manifest);
            if (($available["status"]??"")!=="AVAILABLE"
                || ($available["target_version"]??"")!=="2.47.410"
                || ($old["status"]??"")!=="BLOCKED_SOURCE_VERSION"
                || ($current["status"]??"")!=="UP_TO_DATE") {
                fwrite(STDERR,"NATIVE_DISCOVERY_GATE_FAILED\n"); exit(2);
            }
            echo "P01_V247410_NATIVE_DISCOVERY=PASS\n";
          '
