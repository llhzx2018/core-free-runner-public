name: S01 Problems directory desktop baseline
on:
  push:
    branches: [task/s01-problems-directory-20261019]
    paths: ['.github/workflows/s01-problems-directory-baseline.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.141
  TARGET_SHA: 127d9b7d7431f3ceab167318db44f4fb4b719907
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install established Chromium lane
        run: |
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install chromium
      - name: Read-only real desktop page and control evidence
        run: |
          mkdir -p proof
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const records=[];
            for(const lang of ['en','zh']){
              for(const width of [1440,1024]){
                const page=await browser.newPage({viewport:{width,height:1000},deviceScaleFactor:1});
                const base='https://www3.m3u8.one'+(lang==='zh'?'/zh':'')+'/problems/';
                const res=await page.goto(base,{waitUntil:'networkidle',timeout:45000});
                await page.screenshot({path:'proof/problems-'+lang+'-'+width+'.png',fullPage:true});
                const data=await page.evaluate(()=>({
                  h1:[...document.querySelectorAll('h1')].map(x=>x.innerText),
                  context:document.body.className,
                  overflow:document.documentElement.scrollWidth>innerWidth+1,
                  headings:[...document.querySelectorAll('#content h2')].map(x=>x.innerText),
                  cards:[...document.querySelectorAll('#content .vf-directory-card')].map(x=>({text:x.innerText,links:[...x.querySelectorAll('a')].map(a=>({text:a.innerText,url:a.href})),attributes:[...x.attributes].map(a=>[a.name,a.value])})),
                  inputs:[...document.querySelectorAll('#content input,#content select')].map(x=>({tag:x.tagName,name:x.name,type:x.type,placeholder:x.placeholder,value:x.value,options:x.options?[...x.options].map(o=>({value:o.value,text:o.text})):null})),
                  controls:[...document.querySelectorAll('#content button,#content [data-vf-directory-filter],#content a[role=button]')].map(x=>({tag:x.tagName,text:x.innerText,attributes:[...x.attributes].map(a=>[a.name,a.value])})),
                  canonical:document.querySelector('link[rel=canonical]')?.href,
                  title:document.title,
                  description:document.querySelector('meta[name=description]')?.content,
                  robots:document.querySelector('meta[name=robots]')?.content
                }));
                data.language=lang;data.width=width;data.http=res.status();records.push(data);
                if(width===1440){
                  for(const query of ['CORS','vf-no-match-problems-8f23']){
                    await page.goto(base+'?vf_q='+encodeURIComponent(query),{waitUntil:'networkidle',timeout:45000});
                    records.push({language:lang,width,query,h1:await page.locator('h1').allTextContents(),cards:await page.locator('#content .vf-directory-card').allTextContents(),body:(await page.locator('#content').innerText()).slice(0,7000)});
                  }
                }
                await page.close();
              }
            }
            fs.writeFileSync('proof/problems-baseline.json',JSON.stringify(records,null,2));
            console.log(JSON.stringify(records.map(x=>({language:x.language,width:x.width,http:x.http,query:x.query,overflow:x.overflow,h1:x.h1,cards:x.cards?.length}))));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-problems-directory-baseline-${{ github.run_id }}
          path: proof/
          retention-days: 14
