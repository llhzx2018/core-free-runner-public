name: P08 0.1.2 one-case current governance + R102 real isolated systemd root supervisor
on:
  pull_request:
    paths:
      - .github/workflows/p08-v012-real-systemd-governance-once.yml
permissions:
  contents: read
jobs:
  actual-systemd-and-branch-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Genuine exact R102 project PR source (private transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: dc967a489023d7218369bfd75254c767cc38a89d
          path: p08-exact-bridge
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Genuine GOV-DOC proposed V3.11 source (private transient)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: 36ab115c70ab8f30155ffd183906f1f98f0bdfa7
          path: gov-v311
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      - name: Governance source and actual Git diff dependency lint
        run: |
          set -euo pipefail
          test "$(git -C gov-v311 rev-parse HEAD)" = 36ab115c70ab8f30155ffd183906f1f98f0bdfa7
          test "$(git -C p08-exact-bridge rev-parse HEAD)" = dc967a489023d7218369bfd75254c767cc38a89d
          test "$(cat p08-exact-bridge/VERSION)" = 0.1.2
          test -f gov-v311/skills/skill-release/V3.11/SKILL.md
          test -f gov-v311/governance/release/cases/P08_ADOPS_012_SCHEMA_ATOMIC_POST_RELEASE_OWNER_MANUAL_20261114.md
          test -f p08-exact-bridge/docs/evidence/P08_012_FORMAL_RELEASE_GATE_20261114.md
          python3 -B gov-v311/governance/public-authority/tools/current_dependency_lint.py \
            --root "$PWD/gov-v311" \
            --git-base 7b60a8b36795cf1b5c5e49d24f258b5a6a141ce4 \
            --git-head 36ab115c70ab8f30155ffd183906f1f98f0bdfa7
          bash -n p08-exact-bridge/scripts/r102_cloudpanel_offline_once.sh
          grep -Fq 'printf '"'"'%s\n'"'"' "$"' '$$' p08-exact-bridge/scripts/r102_cloudpanel_offline_once.sh || true
          echo P08_MODE_L_V311_CURRENT_BRANCH_AND_CLEAN_DIFF=PASS
        env:
          PR_BODY: |
            PUBLIC_AUTHORITY_IMPACT: UPDATED
            AFFECTED_DOMAINS: INSTALL,UPGRADE,SECURITY,TESTING,DATA_SCHEMA,GIT,UA_UI,OBSERVABILITY
            IMPACT_REASON: The only change is high-risk P08 v0.1.2 case-specific human acceptance timing; all real installation, security, backups and schema machine gates remain required.
      - name: Install actual isolated systemd nginx cron and PHP8.4-FPM
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/r102-systemd-apt.log" 2>&1 || { tail -n 16 "$RUNNER_TEMP/r102-systemd-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq software-properties-common >> "$RUNNER_TEMP/r102-systemd-apt.log" 2>&1 || { tail -n 16 "$RUNNER_TEMP/r102-systemd-apt.log"; exit 1; }
          sudo add-apt-repository -y ppa:ondrej/php >> "$RUNNER_TEMP/r102-systemd-apt.log" 2>&1 || { tail -n 16 "$RUNNER_TEMP/r102-systemd-apt.log"; exit 1; }
          sudo apt-get update -qq >> "$RUNNER_TEMP/r102-systemd-apt.log" 2>&1 || { tail -n 16 "$RUNNER_TEMP/r102-systemd-apt.log"; exit 1; }
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx cron php8.4-cli php8.4-fpm php8.4-sqlite3 php8.4-zip php8.4-curl >> "$RUNNER_TEMP/r102-systemd-apt.log" 2>&1 || { tail -n 23 "$RUNNER_TEMP/r102-systemd-apt.log"; exit 1; }
          test -x /usr/bin/php8.4
          /usr/bin/php8.4 -r 'exit(extension_loaded("posix") ? 0 : 1);'
          echo R102_ACTUAL_SYSTEMD_NGINX_CRON_PHP84_FPM_INSTALLED=PASS
      - name: Setup real disposable Linux Owner UID CloudPanel layout and test-only CLI shim
        run: |
          set -euo pipefail
          sudo useradd -m -s /bin/bash r102ci
          site=/home/r102ci/htdocs/r102-test.invalid
          old="releases/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          new="releases/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          sudo mkdir -p "$site/public" "$site/$old/src/Upgrade" "$site/$new"
          sudo cp p08-exact-bridge/src/Upgrade/R102CloudPanelOfflineGuard.php "$site/$old/src/Upgrade/R102CloudPanelOfflineGuard.php"
          sudo tee "$site/$old/src/Upgrade/r102-official-offline-cli.php" > /dev/null <<'PHP'
          <?php
          declare(strict_types=1);
          if (PHP_SAPI!=='cli'||count($argv)!==3)exit(98);
          require_once __DIR__.'/R102CloudPanelOfflineGuard.php';
          use VF\AdOps\Upgrade\R102CloudPanelOfflineGuard;
          $site=$argv[2];$mode=$argv[1];$marker=$site.'/status-marker';
          if ($mode==='prepare') {
            if ((new R102CloudPanelOfflineGuard())->check($site))exit(78);
            echo "R102_CLI_PREPARE=R102_OFFICIAL_ASSETS_READY_OWNER_CLICK_PENDING\n";exit(0);
          }
          if ($mode==='status') {
            $status=is_file($marker)?trim(file_get_contents($marker)):'R102_NO_CLICK_TRANSACTION';
            echo 'R102_CLI_STATUS='.$status."\n";exit(0);
          }
          if ($mode==='apply') {
            $gate=(new R102CloudPanelOfflineGuard())->check($site);
            if (!$gate) {
              @mkdir($site.'/storage/app/private/adops/maintenance',0770,true);
              file_put_contents($site.'/storage/app/private/adops/maintenance/maintenance.json',"{}\n");
              file_put_contents($marker,"R102_OFFLINE_RECONCILIATION_REQUIRED\n");
              fwrite(STDERR,"R102_TEST_SITE_UID_WRITER_DENIAL=PASS\n");
              exit(71);
            }
            file_put_contents($site.'/proved-real-root-lease',"ROOT_FLOCK_PID_FPM_STOP_UID_CLEAN\n");
            $ptr=$site.'/current';
            symlink('releases/'.str_repeat('b',40),$site.'/current-next');
            if (!rename($site.'/current-next',$ptr))exit(80);
            file_put_contents($marker,"R102_RECOVERY_CLOSED_SUCCESS\n");
            echo "R102_CLI_APPLY=REAL_SYSTEMD_GUARD_PASS_SYNTHETIC_OWNER\n";
            exit(0);
          }
          exit(99);
          PHP
          sudo tee "$site/public/index.php" > /dev/null <<'PHP'
          <?php echo 'R102_DISPOSABLE_ONLY';
          PHP
          sudo ln -s "$old" "$site/current"
          sudo tee /etc/php/8.4/fpm/pool.d/r102ci.conf > /dev/null <<'EOF'
          [r102ci]
          user = r102ci
          group = r102ci
          listen = /run/php/r102ci-fpm.sock
          listen.owner = www-data
          listen.group = www-data
          pm = ondemand
          pm.max_children = 2
          pm.process_idle_timeout = 10s
          EOF
          sudo tee /etc/nginx/sites-enabled/r102-test.invalid.conf > /dev/null <<'EOF'
          server {
            listen 127.0.0.1:18926;
            server_name r102-test.invalid;
            root /home/r102ci/htdocs/r102-test.invalid/public;
            index index.php;
            location / { try_files $uri $uri/ /index.php?$query_string; }
            location ~ \.php$ {
              include snippets/fastcgi-php.conf;
              fastcgi_pass unix:/run/php/r102ci-fpm.sock;
            }
          }
          EOF
          sudo chown -R r102ci:r102ci /home/r102ci
          sudo chmod 0755 /home/r102ci /home/r102ci/htdocs "$site"
          sudo nginx -t -q
          sudo systemctl restart php8.4-fpm cron nginx
          for unit in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$unit"; done
          echo R102_REAL_SYSTEMD_AND_CLOUDPANEL_OWNER_UID_ACTIVE=PASS
      - name: Real kernel root lease and systemd negative + success + fresh FPM
        run: |
          set -euo pipefail
          site=/home/r102ci/htdocs/r102-test.invalid
          script="$PWD/p08-exact-bridge/scripts/r102_cloudpanel_offline_once.sh"
          sudo chmod 0755 "$script"
          oldPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$oldPid" -gt 1
          # NO GH Release is published; the stub runs on disposable host only.
          # First probe an actual OTHER same-UID sleeping writer: the real
          # CloudPanel guard must refuse even though nginx/cron/FPM all stop.
          sudo runuser -u r102ci -- sleep 60 &
          writer=$!
          sleep 1
          set +e
          sudo bash "$script" --apply --ack-global-service-outage "$site" r102ci 8.4 \
             > "$RUNNER_TEMP/r102-writer-denial.log" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq 'R102_CLOUDPANEL=STOPPED_RECOVERY_REQUIRED' "$RUNNER_TEMP/r102-writer-denial.log"
          test "$(sudo systemctl is-active nginx || true)" = inactive
          test "$(sudo systemctl is-active cron || true)" = inactive
          test "$(sudo systemctl is-active php8.4-fpm || true)" = inactive
          test -f "$site/storage/app/private/adops/maintenance/maintenance.json"
          test "$(sudo readlink "$site/current")" = releases/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          # Cleanup intentionally happens only on disposable Runner, never
          # automatically in the product script after unknown interrupted.
          sudo pkill -u r102ci -f 'sleep 60' || true
          wait "$writer" || true
          sudo rm -rf "$site/storage/app/private/adops/maintenance"
          sudo rm -f "$site/status-marker"
          sudo systemctl start php8.4-fpm cron nginx
          oldPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$oldPid" -gt 1
          for unit in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$unit"; done
          echo R102_REAL_SYSTEMD_FAIL_CLOSED_EXTRA_UID_WRITER=PASS
          # Now real nginx, cron and FPM fully stopped: the *production*
          # PHP guard reads the real root shell pid/locked kernel FLOCK;
          # no synthetic PHP proof injection is allowed here.
          if ! sudo bash "$script" --apply --ack-global-service-outage "$site" r102ci 8.4 \
            > "$RUNNER_TEMP/r102-real-stop-success.log" 2>&1; then
            grep -E 'R102_(CLI|CLOUDPANEL|TEST)=' "$RUNNER_TEMP/r102-real-stop-success.log" | tail -n 14 || true
            echo R102_REAL_SYSTEMD_SUCCESS_SOURCE_REFUSED
            exit 1
          fi
          grep -Fq 'R102_CLOUDPANEL=OFFICIAL_012_COMMITTED_PRE_RESTART' "$RUNNER_TEMP/r102-real-stop-success.log"
          grep -Fq 'R102_CLOUDPANEL=SERVICES_RESTARTED_WITH_FRESH_FPM' "$RUNNER_TEMP/r102-real-stop-success.log"
          test "$(sudo readlink "$site/current")" = releases/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          test -f "$site/proved-real-root-lease"
          grep -Fxq 'ROOT_FLOCK_PID_FPM_STOP_UID_CLEAN' "$site/proved-real-root-lease"
          newPid="$(sudo systemctl show -p MainPID --value php8.4-fpm)"
          test "$newPid" -gt 1 && test "$newPid" != "$oldPid"
          for unit in php8.4-fpm cron nginx; do sudo systemctl is-active --quiet "$unit"; done
          test "$(curl -fsS --max-time 10 http://127.0.0.1:18926/)" = R102_DISPOSABLE_ONLY
          echo R102_REAL_SYSTEMD_ROOT_LEASE_NO_WRITERS_FRESH_FPM_RESTART=PASS
      - name: Always destroy private checkout and disposable systemd site
        if: always()
        run: |
          sudo systemctl stop nginx cron php8.4-fpm 2>/dev/null || true
          sudo rm -f /etc/nginx/sites-enabled/r102-test.invalid.conf /etc/php/8.4/fpm/pool.d/r102ci.conf
          sudo pkill -u r102ci 2>/dev/null || true
          sudo userdel -r r102ci 2>/dev/null || true
          rm -rf "$GITHUB_WORKSPACE/p08-exact-bridge" "$GITHUB_WORKSPACE/gov-v311"
          echo R102_ISOLATED_SYSTEMD_ALL_PRIVATE_SITE_AND_SOURCE_CLEANUP=YES
