name: P03 V1.37.0 Final Release Asset Readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p03-v1370-release-final-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  P03_REPOSITORY: llhzx2018/vf-forge
  TAG: v1.37.0
  EXPECTED_TAG_SHA: 296675dde8d2d76a48ffae603af5e911586be748
  EXPECTED_UPDATE_SHA256: 78bab1069a115d0cc96f5abe66b71e2989e01d5acda20c4b474d70a018638ba6
  EXPECTED_SOURCE_MANIFEST_SHA256: c9226a6f0cdcc8212589e1e61635461f67dfbb44bbbe8142e59fa90d08e19f45

jobs:
  release-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify tag and formal release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          repo="https://x-access-token:${GH_TOKEN}@github.com/${P03_REPOSITORY}.git"
          TAG_SHA=$(git ls-remote "$repo" "refs/tags/$TAG" | awk '{print $1}')
          test "$TAG_SHA" = "$EXPECTED_TAG_SHA"
          gh api "repos/$P03_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['tag_name']=='v1.37.0'
          assert not d.get('draft') and not d.get('prerelease')
          assets={a['name']:a for a in d.get('assets',[])}
          assert 'VF_Forge_V1.37.0_UPDATE.zip' in assets,assets.keys()
          assert 'RELEASE_SHA256SUMS.txt' in assets,assets.keys()
          a=assets['VF_Forge_V1.37.0_UPDATE.zip']
          print('V1370_RELEASE_METADATA_PASS','release_id='+str(d['id']),'asset_id='+str(a['id']),'bytes='+str(a['size']),'published_at='+str(d.get('published_at')),'target='+str(d.get('target_commitish')))
          open('/tmp/update_asset_id','w').write(str(a['id']))
          open('/tmp/checksum_asset_id','w').write(str(assets['RELEASE_SHA256SUMS.txt']['id']))
          PY

      - name: Download and reverse verify published UPDATE asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          UPDATE_ID=$(cat /tmp/update_asset_id)
          CHECKSUM_ID=$(cat /tmp/checksum_asset_id)
          gh api -H 'Accept: application/octet-stream' "repos/$P03_REPOSITORY/releases/assets/$UPDATE_ID" > "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip"
          gh api -H 'Accept: application/octet-stream' "repos/$P03_REPOSITORY/releases/assets/$CHECKSUM_ID" > "$RUNNER_TEMP/RELEASE_SHA256SUMS.txt"
          ACTUAL_SHA=$(sha256sum "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip" | awk '{print $1}')
          BYTES=$(stat -c %s "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip")
          test "$ACTUAL_SHA" = "$EXPECTED_UPDATE_SHA256"
          grep -Fq "$EXPECTED_UPDATE_SHA256  VF_Forge_V1.37.0_UPDATE.zip" "$RUNNER_TEMP/RELEASE_SHA256SUMS.txt"
          unzip -t "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip"
          test "$(unzip -Z1 "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip" | wc -l | tr -d ' ')" = '1'
          test "$(unzip -Z1 "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip")" = 'repair-v1.37.0.php'
          unzip -p "$RUNNER_TEMP/VF_Forge_V1.37.0_UPDATE.zip" repair-v1.37.0.php > "$RUNNER_TEMP/repair-v1.37.0.php"
          grep -Fq "const VFF_ATOMIC_TARGET='1.37.0';" "$RUNNER_TEMP/repair-v1.37.0.php"
          grep -Fq 'const VFF_ATOMIC_SCHEMA=30;' "$RUNNER_TEMP/repair-v1.37.0.php"
          grep -Fq 'const VFF_ATOMIC_ALLOWED=["1.36.2"];' "$RUNNER_TEMP/repair-v1.37.0.php"
          echo "P03_V1370_PUBLISHED_ASSET_READBACK=PASS sha256=$ACTUAL_SHA bytes=$BYTES source_manifest=$EXPECTED_SOURCE_MANIFEST_SHA256"
