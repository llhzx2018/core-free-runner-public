name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-glossary202-candidate-20261026]
    paths: ['.github/workflows/s01-glossary202-20261026-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.202
  TARGET_SHA: d6d158b5a3db47d058fd525af28d4ea430564179
  TARGET_TREE: 21ccfb8722a539b8871fec742fa9dd84f3b340b5
  BASE_SHA: 1e958b1a0bcab74c97a46f0fd1938a645dcd0159
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - name: Formal identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-glossary202-20261026/formal-spec.json --input control/.github/workflows/s01-glossary202-20261026-formal.yml
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: d6d158b5a3db47d058fd525af28d4ea430564179
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact candidate, merged tree and required evidence readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40339590780 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/40339590780 --jq .head_sha)" = 620180e50dde4bb538ef429f7371b87fb3f2a64e
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 40339590780 --repo llhzx2018/core-free-runner-public --name s01-home-40339590780 --dir candidate-proof
          cmp candidate-proof/state-before.sha256 candidate-proof/state-after.sha256
          cmp candidate-proof/contracts-before.json candidate-proof/contracts-after.json
          python3 control/lanes/s01-glossary202-20261026/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib,subprocess,urllib.parse
          r=pathlib.Path('candidate-proof')
          old=json.loads((r/'package.json').read_text());new=json.loads(pathlib.Path('proof/package.json').read_text())
          assert old['source']=='981708544d00585e7f6efcf19a398fc1e7529fbc'
          for phase in ['before','after','smoke']:
              result=json.loads((r/('glossary-'+phase+'.json')).read_text())
              assert result['status']=='PASS' and result['rows']==2 and result['errors']==[]
          result=json.loads((r/'glossary-after.json').read_text())
          assert result['checks']>=60
          assert result['ownerContentSEO']=='BYTE_IDENTICAL'
          assert result['layout']=='SINGLE_RAIL_ZH_EN_1440_1024'
          assert result['legacyEnglishDefinitions']=='11_REAL_DEFINITIONS_RENDERED'
          assert result['legacyChinese']=='GENERIC_COPY_REJECTED_CONTENT_PUBLICATION_PENDING'
          assert result['preparedContent']=='13_TERMS_PER_LANGUAGE_SIMULATED_NOT_PUBLISHED'
          assert result['operationalAcceptance']=='NEEDS_CHANGES_UNTIL_REAL_BILINGUAL_CONTENT_PUBLISHED'
          assert result['interaction']=='PAGE_DEFINITIONS_SEARCH_CATEGORY_LETTER_PAGINATION_RESET_NOJS_SAFE_HTML'
          for lang in ['zh','en']:
              for width in [1440,1024]:
                  assert (r/f'glossary-{lang}-{width}.png').stat().st_size>1000
          assert json.loads((r/'clean-install.json').read_text())['status']=='PASS'
          assert json.loads((r/'bootstrap.json').read_text())['status']=='PASS'
          for k in ['status','version','tree','sha256','bytes','files']: assert old[k]==new[k],k
          assert new['sha256']=='62e322437cce9b4f393cc87f0be0605db10f822ed0634eee5a508c82dc50d719' and new['bytes']==2009032
          coverage=json.loads(pathlib.Path('control/lanes/s01-glossary202-20261026/release-authority.json').read_text())
          assert set(coverage['required'])=={'TESTING','GIT','UA_UI','SEO','SECURITY','INSTALL','UPGRADE','DATA_SCHEMA','PERFORMANCE'}
          assert coverage['source']=='981708544d00585e7f6efcf19a398fc1e7529fbc' and coverage['tree']=='21ccfb8722a539b8871fec742fa9dd84f3b340b5'
          assert coverage['owner_preview_runtime']=='N_A'
          assert coverage['release_mode']=='PROJECT_PREVIEW_N_A'
          assert coverage['owner_real_use']=='POST_PRODUCTION_REQUIRED'
          assert coverage['production_auto_apply'] is False
          for item in coverage['required'].values():
              assert item['sha'] and item['acceptance']
              endpoint='repos/llhzx2018/gov-doc/contents/'+urllib.parse.quote(item['path'],safe='/')+'?ref=main'
              live=json.loads(subprocess.check_output(['gh','api',endpoint]))
              assert live['sha']==item['sha'],item['path']
              item['evidence_status']='PASS_EXACT_CANDIDATE_MACHINE'
          coverage['candidate_run']='40339590780'
          coverage['merged_source']='d6d158b5a3db47d058fd525af28d4ea430564179'
          coverage['formal_release_gate']='PASS'
          coverage['production_effect']='NOT_PROVEN_POST_MANUAL_UPGRADE_READBACK_REQUIRED'
          pathlib.Path('proof/public-authority-coverage.json').write_text(json.dumps(coverage,ensure_ascii=False,indent=2))
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Publish only the exact verified package
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.202 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.202 provider/vf-tools-theme_V1.35.202.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.202' --notes '术语表真实内容呈现修复：无独立术语条目时，只读读取当前语言页面正文中的dt/dd或既有strong标签定义，完整呈现并支持原生搜索、分类、首字母和分页；独立条目优先，显式来源、语言隔离、原文/Head/设置/保护数据保持，不生成不存在的详情地址。实际WordPress复现201漏读英文11定义，并验证202恢复；中文通用运营说明不冒充术语。双语13项正文候选只在隔离内存中测试，尚未写入正式站；本页运营验收仍需真实双语内容发布后复验。201升级202、回退与重复安装保护门禁通过；476运行文件。Production由Owner手工升级，手机及其它文章内容暂缓。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.202 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.202 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated remote ZIP byte comparison
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.202 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.202.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.202.zip remote/vf-tools-theme_V1.35.202.zip
          echo '62e322437cce9b4f393cc87f0be0605db10f822ed0634eee5a508c82dc50d719  remote/vf-tools-theme_V1.35.202.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.202.zip)" = 2009032
          gh release view v1.35.202 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-home-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources and packages
        if: always()
        run: rm -rf target provider remote candidate-proof
