name: P01 V2.22.0 Online Updater Publication Fix

on:
  push:
    branches:
      - task/p01-v222-multi-surface-gate-20260828
    paths:
      - '.github/workflows/p01-v222-online-updater-publication-fix-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  UPDATES_REPO: llhzx2018/core-updates
  RUNNER_REPO: llhzx2018/core-free-runner-public
  RUNNER_BRANCH: task/p01-v222-multi-surface-gate-20260828
  TAG: v2.22.0
  RELEASE_ID: '378266367'
  RELEASE_SOURCE: 2c159b4b7ecfc03e79eff2e6103f7e2c768ded08
  COMPAT_GATE_RUN: '33143671134'
  COMPAT_GATE_HEAD: 80cea651f4f24f52f054cce84f8f9f75402d9625
  COMPAT_ARTIFACT_ID: '9674924357'
  ONLINE_ASSET: VF_Start_V2.22.0_UPDATE.zip
  OLD_ONLINE_SHA: 2851ef220776a5d4e4dc92a7e86d76e69111ea56c612511c548592d14edb7ed1
  ONLINE_SHA: 9ed38f665742ab485944b14a6d72c48a0e4f30f52c053e32b612a635a37a21dc
  ONLINE_BYTES: '1170492'
  CANONICAL_UPDATE_SHA: 2851ef220776a5d4e4dc92a7e86d76e69111ea56c612511c548592d14edb7ed1
  FULL_SHA: 89f8ddd6237601d9f18dfec6c149200b24325fa6e4c0340775bfca6ac1374628
  REPAIR_SHA: bba23e58ef9012fdbaec0692f1bd1991e41456aa934b1319f74227a05a8c0e93

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact compatibility gate and release fence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${RUNNER_REPO}/actions/runs/${COMPAT_GATE_RUN}" > /tmp/p01-v222-compat-run.json
          test "$(jq -r '.status' /tmp/p01-v222-compat-run.json)" = completed
          test "$(jq -r '.conclusion' /tmp/p01-v222-compat-run.json)" = success
          test "$(jq -r '.head_sha' /tmp/p01-v222-compat-run.json)" = "$COMPAT_GATE_HEAD"
          gh api "repos/${PRODUCT_REPO}/git/ref/tags/${TAG}" > /tmp/p01-v222-tag.json
          test "$(jq -r '.object.sha' /tmp/p01-v222-tag.json)" = "$RELEASE_SOURCE"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v222-release-before.json
          test "$(jq -r '.id' /tmp/p01-v222-release-before.json)" = "$RELEASE_ID"
          test "$(jq -r '.draft' /tmp/p01-v222-release-before.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v222-release-before.json)" = false
          test "$(jq -r --arg n 'VF-Start-V2.22.0-FULL.zip' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-before.json)" = "sha256:${FULL_SHA}"
          test "$(jq -r --arg n 'VF-Start-V2.22.0-UPDATE.zip' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-before.json)" = "sha256:${CANONICAL_UPDATE_SHA}"
          test "$(jq -r --arg n 'server-update-v2.22.0-repair.php' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-before.json)" = "sha256:${REPAIR_SHA}"
          CURRENT_ALIAS_SHA="$(jq -r --arg n "$ONLINE_ASSET" '.assets[]|select(.name==$n)|.digest // empty' /tmp/p01-v222-release-before.json | sed 's/^sha256://')"
          test "$CURRENT_ALIAS_SHA" = "$OLD_ONLINE_SHA" -o "$CURRENT_ALIAS_SHA" = "$ONLINE_SHA"
          echo P01_COMPAT_PUBLICATION_FENCE=PASS

      - name: Fetch exact verified online updater asset
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v222-compat-release /tmp/p01-v222-compat-artifact.zip
          mkdir -p /tmp/p01-v222-compat-release
          gh api --method GET "repos/${RUNNER_REPO}/actions/artifacts/${COMPAT_ARTIFACT_ID}/zip" > /tmp/p01-v222-compat-artifact.zip
          unzip -q /tmp/p01-v222-compat-artifact.zip -d /tmp/p01-v222-compat-release
          ONLINE="$(find /tmp/p01-v222-compat-release -type f -name "$ONLINE_ASSET" -print -quit)"
          EVIDENCE="$(find /tmp/p01-v222-compat-release -type f -name 'P01-V2.22.0-ONLINE-UPDATER-COMPAT-V2.json' -print -quit)"
          test -f "$ONLINE" && test -f "$EVIDENCE"
          test "$(stat -c %s "$ONLINE")" = "$ONLINE_BYTES"
          test "$(sha256sum "$ONLINE" | awk '{print $1}')" = "$ONLINE_SHA"
          test "$(unzip -Z1 "$ONLINE" | wc -l)" -eq 1
          unzip -Z1 "$ONLINE" | grep -Fxq 'repair-v2.22.0.php'
          jq -e --arg sha "$ONLINE_SHA" --argjson bytes "$ONLINE_BYTES" '.status=="PASS" and .gate=="V2.22.0_ONLINE_UPDATER_COMPAT_V2" and .asset_name=="VF_Start_V2.22.0_UPDATE.zip" and .asset_sha256==$sha and .asset_bytes==$bytes and .inner_repair_name=="repair-v2.22.0.php"' "$EVIDENCE" >/dev/null
          echo ONLINE_PATH="$ONLINE" >> "$GITHUB_ENV"
          echo P01_EXACT_COMPAT_ASSET=PASS

      - name: Replace only legacy online updater alias and read back bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$TAG" "$ONLINE_PATH" --repo "$PRODUCT_REPO" --clobber
          gh api "repos/${PRODUCT_REPO}/releases/tags/${TAG}" > /tmp/p01-v222-release-after.json
          test "$(jq -r '.id' /tmp/p01-v222-release-after.json)" = "$RELEASE_ID"
          test "$(jq -r --arg n "$ONLINE_ASSET" '.assets[]|select(.name==$n)|.size' /tmp/p01-v222-release-after.json)" = "$ONLINE_BYTES"
          test "$(jq -r --arg n "$ONLINE_ASSET" '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-after.json)" = "sha256:${ONLINE_SHA}"
          test "$(jq -r --arg n 'VF-Start-V2.22.0-FULL.zip' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-after.json)" = "sha256:${FULL_SHA}"
          test "$(jq -r --arg n 'VF-Start-V2.22.0-UPDATE.zip' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-after.json)" = "sha256:${CANONICAL_UPDATE_SHA}"
          test "$(jq -r --arg n 'server-update-v2.22.0-repair.php' '.assets[]|select(.name==$n)|.digest' /tmp/p01-v222-release-after.json)" = "sha256:${REPAIR_SHA}"
          rm -rf /tmp/p01-v222-remote-alias && mkdir -p /tmp/p01-v222-remote-alias
          gh release download "$TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v222-remote-alias --pattern "$ONLINE_ASSET"
          test "$(sha256sum "/tmp/p01-v222-remote-alias/$ONLINE_ASSET" | awk '{print $1}')" = "$ONLINE_SHA"
          test "$(unzip -Z1 "/tmp/p01-v222-remote-alias/$ONLINE_ASSET" | wc -l)" -eq 1
          unzip -Z1 "/tmp/p01-v222-remote-alias/$ONLINE_ASSET" | grep -Fxq 'repair-v2.22.0.php'
          echo P01_REMOTE_ONLINE_ALIAS=PASS

      - name: Publish corrected core-updates P01 bytes
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf updates
          git clone -q --depth 1 --branch main "https://x-access-token:${WRITE_TOKEN}@github.com/${UPDATES_REPO}.git" updates
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          p=Path('updates/projects/P01.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['target_version']=='2.22.0',d
          assert d['from_versions']==['2.21.25'],d
          assert d['schema_from']=='2026080902' and d['schema_to']=='2026082801',d
          assert d['release_tag']=='v2.22.0',d
          assert d['release_id']==378266367,d
          assert d['release_identity']=='v2.22.0@2c159b4b7ecfc03e79eff2e6103f7e2c768ded08',d
          assert d['asset_name']=='VF_Start_V2.22.0_UPDATE.zip',d
          assert d['asset_sha256'] in {
              '2851ef220776a5d4e4dc92a7e86d76e69111ea56c612511c548592d14edb7ed1',
              '9ed38f665742ab485944b14a6d72c48a0e4f30f52c053e32b612a635a37a21dc'
          },d
          d['asset_bytes']=1170492
          d['asset_sha256']='9ed38f665742ab485944b14a6d72c48a0e4f30f52c053e32b612a635a37a21dc'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git -C updates config user.name VictorForge
          git -C updates config user.email llhzx2018@gmail.com
          git -C updates add projects/P01.json
          if ! git -C updates diff --cached --quiet; then git -C updates commit -m 'fix(P01): publish V2.22.0 legacy updater compatible bytes'; fi
          for i in 1 2 3; do
            if git -C updates push origin main; then break; fi
            git -C updates pull --rebase origin main
            test "$i" -lt 3
          done
          git -C updates pull --ff-only origin main
          jq -e '.target_version=="2.22.0" and .asset_name=="VF_Start_V2.22.0_UPDATE.zip" and .asset_bytes==1170492 and .asset_sha256=="9ed38f665742ab485944b14a6d72c48a0e4f30f52c053e32b612a635a37a21dc" and .release_id==378266367' updates/projects/P01.json >/dev/null
          CORE_UPDATES_COMMIT="$(git -C updates rev-parse HEAD)"
          echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT" >> "$GITHUB_ENV"
          echo P01_CORE_UPDATES_COMPAT_FIX=PASS

      - name: Persist online updater publication-fix evidence
        env:
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf evidence
          git clone -q --depth 1 --branch "$RUNNER_BRANCH" "https://x-access-token:${WRITE_TOKEN}@github.com/${RUNNER_REPO}.git" evidence
          mkdir -p evidence/vf-agent/results
          jq -n \
            --arg core_updates_commit "$CORE_UPDATES_COMMIT" \
            '{schema:"vf-public-runner-result/v1",project_id:"P01",gate:"V2.22.0_ONLINE_UPDATER_PUBLICATION_FIX",status:"PASS",release_id:378266367,tag:"v2.22.0",release_source:"2c159b4b7ecfc03e79eff2e6103f7e2c768ded08",compat_gate_run:33143671134,compat_artifact_id:9674924357,asset_name:"VF_Start_V2.22.0_UPDATE.zip",old_asset_sha256:"2851ef220776a5d4e4dc92a7e86d76e69111ea56c612511c548592d14edb7ed1",asset_sha256:"9ed38f665742ab485944b14a6d72c48a0e4f30f52c053e32b612a635a37a21dc",asset_bytes:1170492,inner_repair_name:"repair-v2.22.0.php",canonical_full_unchanged:true,canonical_update_unchanged:true,direct_repair_unchanged:true,core_updates_commit:$core_updates_commit,production_upgrade_executed:false}' \
            > evidence/vf-agent/results/P01-V2.22.0-ONLINE-UPDATER-PUBLICATION-FIX.json
          git -C evidence config user.name VictorForge
          git -C evidence config user.email llhzx2018@gmail.com
          git -C evidence add vf-agent/results/P01-V2.22.0-ONLINE-UPDATER-PUBLICATION-FIX.json
          if ! git -C evidence diff --cached --quiet; then git -C evidence commit -m 'evidence(P01): close V2.22.0 online updater publication fix'; fi
          git -C evidence push origin "$RUNNER_BRANCH"
          echo P01_COMPAT_FIX_EVIDENCE=PASS

      - name: Final publication-fix verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_V2_22_0_ONLINE_UPDATER_PUBLICATION_FIX=PASS
          echo COMPAT_GATE_RUN="$COMPAT_GATE_RUN"
          echo RELEASE_ID="$RELEASE_ID"
          echo ONLINE_ASSET="$ONLINE_ASSET"
          echo ONLINE_SHA="$ONLINE_SHA"
          echo CORE_UPDATES_COMMIT="$CORE_UPDATES_COMMIT"
          echo PRODUCTION_UPGRADE=NO
