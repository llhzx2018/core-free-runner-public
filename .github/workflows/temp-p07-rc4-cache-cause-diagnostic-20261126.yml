name: TEMP P07 RC4 two cache cases root cause diagnostic
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temp-p07-rc4-cache-cause-diagnostic-20261126.yml
permissions:
  contents: read
jobs:
  real-entry:
    if: >-
      github.repository == 'llhzx2018/core-free-runner-public' &&
      github.actor == 'llhzx2018' &&
      github.event.pull_request.user.login == 'llhzx2018' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'temp/p07-rc4-cache-cause-diagnostic-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLIC_SHA: 'e6a3bbac7de26e9b37f179605dd308d1ac0a5a4c'
      PUBLIC_BASE: '7789eaf083bad6e3d0fce19982f930f30794e3e3'
      PRODUCT_SHA: '54c46dfa862a5c4a39020c1bd80a129bd992077b'
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Checkout exact public entry candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e6a3bbac7de26e9b37f179605dd308d1ac0a5a4c
          fetch-depth: 0
          path: public-candidate
          persist-credentials: false
      - name: Checkout exact private functional source temporarily
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 54c46dfa862a5c4a39020c1bd80a129bd992077b
          path: transient-p07
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Public source boundary and actual prepublication archive
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C public-candidate rev-parse HEAD)" = "$PUBLIC_SHA"
          test "$(git -C transient-p07 rev-parse HEAD)" = "$PRODUCT_SHA"
          python3 -B - <<'PY'
          import os, subprocess,re
          from pathlib import Path
          p=Path("public-candidate")
          old=subprocess.check_output(["git","-C",str(p),"show",os.environ["PUBLIC_BASE"]+":installers/p07-toolbox.sh"],text=True)
          new=(p/"installers/p07-toolbox.sh").read_text()
          def unaffected(s):
              start=s.index("m03_owner_trial_previous_pinned()") if "m03_owner_trial_previous_pinned()" in s else s.index("m03_verified_owner_trial()")
              end=s.index("\nrun_server_ops()",start)
              s=s[:start]+s[end:]
              return "\n".join(l for l in s.splitlines() if not l.startswith("M03_OWNER_TRIAL_") and not ('say "  2.' in l and '$M03_OWNER_TRIAL_BUILD' in l))
          assert unaffected(old)==unaffected(new)
          assert "VF_SERVER_OPS_BUILD_EXPECTED=\"0.1.0-release146\"" in new
          print("P07_RC4_PUBLIC_OTHER_MODULES_AND_STABLE_SOURCE_UNCHANGED=PASS")
          PY
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --max-time 120 'https://github.com/llhzx2018/core-free-runner-public/releases/download/p07-m03-v0.1.0-release147-rc3-ownertrial-20261123/P07-M03-0.1.0-release147-rc3-OWNER-TRIAL.zip' -o "$RUNNER_TEMP/rc3-original.zip"
          printf '%s  %s\n' '3646285a2732c8249d0296a72c7ce6fae83be1e9564d76849e65bc396642672d' "$RUNNER_TEMP/rc3-original.zip" | sha256sum -c - >/dev/null
          cd transient-p07
          python3 -B scripts/p07_m03_rc3_recovery_bundle.py --official "$RUNNER_TEMP/rc3-original.zip" --source . --source-sha "$PRODUCT_SHA" --output "$RUNNER_TEMP/rc4-candidate.zip" >"$RUNNER_TEMP/candidate.json"
          printf '%s  %s\n' '85570da2d135e39ae3634e511298e50dede81015019e305c7de068e04ca93238' "$RUNNER_TEMP/rc4-candidate.zip" | sha256sum -c - >/dev/null
          echo P07_RC4_REAL_ENTRY_EXACT_PACKAGE=PASS
      - name: Final three cache cases after metadata-proven fixture correction
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
            [[ ! -e "$p" && ! -L "$p" ]] || { echo P07_RC4_TEST_HOST_NOT_EMPTY; exit 31; }
          done
          touch "$RUNNER_TEMP/p07-rc4-owned-sandbox"
          cat > "$RUNNER_TEMP/rc4-cache-diagnostic.py" <<'PY'
          import importlib.util,os,pathlib,re,shutil,subprocess,sys,unittest,zipfile
          file=pathlib.Path(sys.argv[1]).resolve()
          spec=importlib.util.spec_from_file_location("exact_public_tests",file)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          print("FIXTURE_PYTHON_VERSION="+sys.version.split()[0],flush=True)
          print("FIXTURE_CACHE_TAG="+str(sys.implementation.cache_tag),flush=True)
          inherited=os.umask(0o022); os.umask(inherited)
          print("FIXTURE_INHERITED_UMASK="+oct(inherited),flush=True)
          with zipfile.ZipFile(os.environ["P07_RC4_ZIP"]) as z:
              script=z.read("installers/p07-final.sh").decode("utf-8")
              for line in script.splitlines():
                  if re.search(r"^\s*(?:if\s+!?\s*)?(?:/usr/bin/)?python3\s+.*<<",line):
                      print("SIGNED_INSTALLER_PYTHON_CALL="+line.strip()[:180],flush=True)
                  if re.search(r"^\s*(?:export\s+)?PATH=",line):
                      print("SIGNED_INSTALLER_PATH_ASSIGNMENT_PRESENT",flush=True)
          class Diagnostic(m.RealEntry):
              def entry(self,*args,**kwargs):
                  caches=list((m.ROOT/"lib/__pycache__").glob("*.pyc"))
                  print("CASE="+self._testMethodName+" CACHE_COUNT="+str(len(caches)),flush=True)
                  tags=sorted({x.name.split(".")[1] for x in caches if len(x.name.split("."))>2})
                  print("CACHE_TAGS="+repr(tags),flush=True)
                  probe=subprocess.run(["bash","-c","python3 -B -c 'import sys; print(sys.version.split()[0], sys.implementation.cache_tag)'"],env=self.env,text=True,capture_output=True,timeout=10)
                  print("ENTRY_PATH_PYTHON="+probe.stdout.strip()[:120],flush=True)
                  out=super().entry(*args,**kwargs)
                  patterns=[r"RC3_UPGRADE_PROVENANCE_BLOCKED=[^\r\n]+",r"错误阶段：[A-Z_]+",r"原运行时归属或完整性无法确认",r"独立维护程序已就绪",r"无须重新下载",r"试用包安装失败",r"已有试用目录、恢复点或命令身份未确认"]
                  for pattern in patterns:
                      for value in re.findall(pattern,out):
                          print("DIAG_MARKER="+value[:160],flush=True)
                  return out
          suite=unittest.TestSuite(Diagnostic(n) for n in ("test_real_public_upgrade_legacy_caches_and_reentry","test_unsigned_extra_cache_is_rejected_not_run","test_group_writable_cache_directory_rejected_without_mutation"))
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print("CACHE_DIAGNOSTIC_CASES="+str(result.testsRun),flush=True)
          for case,detail in result.failures+result.errors:
              for line in detail.splitlines():
                  if re.fullmatch(r"AssertionError: .*fixture permission: [A-Za-z0-9_./-]+ 0o[0-7]+",line): print("FIXTURE_FAILURE="+line[:200],flush=True)
          sys.exit(0 if result.wasSuccessful() else 32)
          PY
          cd public-candidate
          set +e
          sudo env PATH="$PATH" GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted P07_RC4_REAL_ENTRY=1 P07_RC3_ZIP="$RUNNER_TEMP/rc3-original.zip" P07_RC4_ZIP="$RUNNER_TEMP/rc4-candidate.zip" "$(command -v python3)" -B "$RUNNER_TEMP/rc4-cache-diagnostic.py" tests/test_p07_m03_rc4_public_maintenance.py >"$RUNNER_TEMP/public-real-entry.log" 2>&1
          rc=$?
          set -e
          grep -E '^(FIXTURE_|ENTRY_PATH_PYTHON=|SIGNED_INSTALLER_|CASE=|CACHE_TAGS=|DIAG_MARKER=|CACHE_DIAGNOSTIC_CASES=|test_|FAIL:|ERROR:|Ran [0-9]+ tests|FAILED|OK$)' "$RUNNER_TEMP/public-real-entry.log" | cut -c1-320
          test "$rc" -eq 0
          grep -Fxq OK "$RUNNER_TEMP/public-real-entry.log"
          grep -Eq '^Ran 3 tests in ' "$RUNNER_TEMP/public-real-entry.log"
          echo P07_RC4_TARGETED_CACHE_CASES=PASS
      - name: Always verify isolated test path and private source cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rc=0
          if [[ -f "$RUNNER_TEMP/p07-rc4-owned-sandbox" ]]; then
            for p in /opt/vf-server-ops-ownertrial147rc3 /opt/vf-server-ops-ownertrial147rc3.previous /opt/vf-server-ops-ownertrial147rc3.new /opt/vf-server-ops-ownertrial147rc3.upgrade.lock /usr/local/bin/vfops-rc147rc3 /opt/vf-server-ops /opt/vfops-modules /var/lib/vf-server-ops; do
              if [[ -e "$p" || -L "$p" ]]; then rc=1; sudo rm -rf -- "$p"; fi
            done
          fi
          rm -rf -- "$GITHUB_WORKSPACE/transient-p07" "$GITHUB_WORKSPACE/public-candidate"
          rm -f -- "$RUNNER_TEMP"/rc3-original.zip "$RUNNER_TEMP"/rc4-candidate.zip "$RUNNER_TEMP"/candidate.json "$RUNNER_TEMP"/public-contract.log "$RUNNER_TEMP"/public-real-entry.log "$RUNNER_TEMP"/p07-rc4-owned-sandbox
          rm -f -- "$RUNNER_TEMP"/rc4-cache-diagnostic.py
          [[ ! -e "$GITHUB_WORKSPACE/transient-p07" ]] || exit 39
          [[ "$rc" -eq 0 ]] || { echo P07_RC4_TEST_RUNTIME_RESIDUE=FAIL; exit 39; }
          echo P07_RC4_TRANSIENT_AND_SANDBOX_CLEAN=PASS
