name: TEMP P08 S6 Google Meta TikTok CAS Gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p08-s6-trio-cas-20261125.yml'
permissions:
  contents: read
concurrency:
  group: p08-s6-trio-cas-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  TARGET_REPO: llhzx2018/vf-adops
  TARGET_VERSION: '0.1.18'
  TARGET_SHA: e2f0a66a23cb67f01fa92ea09e2bf923c8685107
  TEST_PROJECT: P08
  TEST_LANE: P08_S6_TRIO_CAS_20261125
jobs:
  identity-preflight:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s6-trio-cas-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact product source and rendered workflow identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ephemeral_lane_spec.py audit-rendered --spec specs/ephemeral/p08-s6-trio-cas-20261125.json --input .github/workflows/temp-p08-s6-trio-cas-20261125.yml
          echo P08_S6_TRIO_CAS_IDENTITY=PASS
  trio-feature:
    needs: identity-preflight
    # Focused current-head Google/Meta/TikTok S6 and unchanged PopAds/Review PHP Feature.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s6-trio-cas-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned source, PHP syntax, dependencies and frontend asset precondition
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(cat VERSION)" = "$TARGET_VERSION"
          for f in app/Http/Controllers/AdsCenterController.php app/Http/Controllers/MetaAdsController.php app/Http/Controllers/TikTokAdsController.php tests/Feature/AdsCenterWorkflowTest.php tests/Feature/MetaAdsWorkflowTest.php tests/Feature/TikTokAdsWorkflowTest.php; do php -l "$f" > /dev/null || exit 1; done
          echo P08_S6_TRIO_CAS_PHP_SYNTAX=PASS
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-s6-composer.log" 2>&1 || { echo P08_S6_TRIO_CAS_COMPOSER=FAIL; exit 1; }
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-s6-npm.log" 2>&1 || { echo P08_S6_TRIO_CAS_NPM=FAIL; exit 1; }
          npm run build > "$RUNNER_TEMP/p08-s6-build.log" 2>&1 || { echo P08_S6_TRIO_CAS_VITE=FAIL; exit 1; }
          test -s public/build/manifest.json
          echo P08_S6_TRIO_CAS_FRAMEWORK=PASS
      - name: Focused Google/Meta/TikTok S6 Owner concurrency and original provider suites
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if php vendor/bin/phpunit --no-coverage --colors=never --log-junit "$RUNNER_TEMP/p08-s6-junit.xml" tests/Feature/AdsCenterWorkflowTest.php tests/Feature/MetaAdsWorkflowTest.php tests/Feature/TikTokAdsWorkflowTest.php tests/Feature/GoogleAdsHierarchyWorkflowTest.php tests/Feature/PopAdsWorkflowTest.php tests/Feature/AdReviewDraftWorkflowTest.php > "$RUNNER_TEMP/p08-s6-phpunit.log" 2>&1; then
            echo P08_S6_TRIO_CAS_BOTH_FEATURES=PASS
          else
            echo P08_S6_TRIO_CAS_BOTH_FEATURES=FAIL
            python3 - "$RUNNER_TEMP/p08-s6-junit.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          try:
              root=ET.parse(sys.argv[1]).getroot()
              print("P08_S6_JUNIT_TESTS="+str(root.get("tests","UNKNOWN")))
              print("P08_S6_JUNIT_ERRORS="+str(root.get("errors","UNKNOWN")))
              print("P08_S6_JUNIT_FAILURES="+str(root.get("failures","UNKNOWN")))
              for case in root.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      print("P08_S6_FAIL_CASE="+str(case.get("name","UNKNOWN"))[:120])
          except (OSError,ET.ParseError):
              print("P08_S6_JUNIT_UNAVAILABLE")
          PY
            exit 1
          fi
          echo P08_S6_EXTERNAL_CREDENTIALS=NOT_USED
      - name: Erase private checkout, dependencies and local test logs
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-s6-*.log "$RUNNER_TEMP/p08-s6-junit.xml"
          test ! -e private-p08
          echo P08_S6_PRIVATE_CLEANUP=PASS

  native-cas:
    needs: identity-preflight
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-s6-trio-cas-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: p08-s6-synthetic
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: p08-s6-synthetic
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: p08_s6_pop_ci
      DB_USERNAME: root
      DB_PASSWORD: p08-s6-synthetic
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Native database CAS stale rejection and latest-write acceptance
        working-directory: private-p08
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-s6-native-composer.log" 2>&1 || { echo P08_S6_NATIVE_COMPOSER=FAIL; exit 1; }
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("DB_PASSWORD"));$p->exec("CREATE DATABASE IF NOT EXISTS p08_s6_pop_ci");'
          php artisan migrate --force > "$RUNNER_TEMP/p08-s6-native-migration.log" 2>&1 || { echo P08_S6_NATIVE_MIGRATE=FAIL; exit 1; }
          cat > "$RUNNER_TEMP/p08-s6-trio-native.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/vendor/autoload.php';
          $app=require getcwd().'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $db=\Illuminate\Support\Facades\DB::getFacadeRoot();
          $owner=$db->table('users')->insertGetId([
              'name'=>'Synthetic S6 Owner','email'=>'s6-native-trio@isolated.example',
              'password'=>\Illuminate\Support\Facades\Hash::make('Synthetic-Only-CI'),
              'created_at'=>now(),'updated_at'=>now()
          ]);
          $entries=[
              ['table'=>'ad_channel_connections',
               'id'=>'a12e0e10-2c3d-4e5f-89ab-cdef01234561',
               'identity'=>['provider'=>'google_ads','client_id'=>'synthetic_google_app',
                  'encrypted_client_secret'=>'ci-only-google-app-secret',
                  'encrypted_refresh_token'=>'ci-only-google-refresh'],
               'extra'=>['accessible_customers_json'=>'["1234567890"]']],
              ['table'=>'ad_meta_connections',
               'id'=>'a12e0e10-2c3d-4e5f-89ab-cdef01234562',
               'identity'=>['app_id'=>'synthetic_meta_app',
                  'encrypted_app_secret'=>'ci-only-meta-app-secret',
                  'encrypted_access_token'=>'ci-only-meta-token'],
               'extra'=>['accounts_json'=>'{"accounts":[]}',
                        'token_expires_at'=>now()->addDay()]],
              ['table'=>'ad_tiktok_connections',
               'id'=>'a12e0e10-2c3d-4e5f-89ab-cdef01234563',
               'identity'=>['app_id'=>'synthetic_tiktok_app',
                  'encrypted_secret'=>'ci-only-tiktok-secret',
                  'encrypted_access_token'=>'ci-only-tiktok-token'],
               'extra'=>['accounts_json'=>'{"accounts":[]}']],
          ];
          foreach($entries as $e) {
              $db->table($e['table'])->insert([
                  'id'=>$e['id'],'owner_id'=>$owner,'state'=>'CONNECTED',
                  'created_at'=>now(),'updated_at'=>now(),
              ]+$e['identity']+$e['extra']);
              $q=fn()=>$db->table($e['table'])->where('id',$e['id'])->where('owner_id',$owner);
              $guard=static function(object $old)use($q,$e) {
                  $query=$q();
                  foreach(array_keys($e['identity']) as $col) $query->where($col,$old->{$col});
                  $query->where('state',$old->state)
                        ->where('snapshot_json',$old->snapshot_json)
                        ->where('last_checked_at',$old->last_checked_at);
                  return $query;
              };
              $old=$q()->first();
              $q()->update(['snapshot_json'=>'{"source":"newer"}','updated_at'=>now()]);
              if($guard($old)->update(['snapshot_json'=>'{"source":"stale"}'])!==0) exit(41);
              if($q()->value('snapshot_json')!=='{"source":"newer"}') exit(42);
              $fresh=$q()->first();
              if($guard($fresh)->update(['snapshot_json'=>'{"source":"accepted"}'])!==1) exit(43);
              if($q()->value('snapshot_json')!=='{"source":"accepted"}') exit(44);
              $priorFailure=$q()->first();
              $q()->update(['snapshot_json'=>'{"source":"newer_failure"}','state'=>'CONNECTED']);
              if($guard($priorFailure)->update(['state'=>'DEGRADED'])!==0) exit(45);
              if($q()->value('state')!=='CONNECTED') exit(46);
              if($q()->value('snapshot_json')!=='{"source":"newer_failure"}') exit(47);
          }
          echo "P08_S6_NATIVE_TRIO_CAS=PASS\n";
          PHP
          php "$RUNNER_TEMP/p08-s6-trio-native.php" > "$RUNNER_TEMP/p08-s6-native-test.log" 2>&1 || { echo P08_S6_NATIVE_CAS=FAIL; exit 1; }
          echo P08_S6_NATIVE_CAS=PASS
      - name: Cleanup private P08 source and synthetic DB evidence
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-p08
          rm -f -- "$RUNNER_TEMP"/p08-s6-native-*.log "$RUNNER_TEMP/p08-s6-trio-native.php"
          test ! -e private-p08
          echo P08_S6_NATIVE_PRIVATE_CLEANUP=PASS
