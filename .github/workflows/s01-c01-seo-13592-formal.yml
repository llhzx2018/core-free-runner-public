name: S01-C01 SEO formal release
on:
  push:
    branches: [task/s01-c01-seo-13592-formal]
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.92'
      TARGET_SHA: 'fbf74412336d99ff3b83f3d3d6c0bf4f338ab3aa'
      TARGET_TREE: '49f8a739ee4a77c66eebbd511b51ef1bcd56b2fc'
      SOURCE_VERSION: '1.35.91'
      BASE_SHA: 'a9bd60c080d57fd7872fd2d5aadd9fb34b210ef2'
      CANDIDATE_RUN: '37406446543'
      CANDIDATE_SHA: 'd721a133976b838dbd736ecb59911866b91503d1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: runner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Reverse verify exact tested tree and rebuilt bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$CANDIDATE_RUN --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --repo llhzx2018/core-free-runner-public --name "s01-c01-seo-candidate-$CANDIDATE_RUN" --dir tested
          jq -e --arg sha "$CANDIDATE_SHA" --arg tree "$TARGET_TREE" --arg ver "$TARGET_VERSION" '.status=="PASS" and .source_sha==$sha and .source_tree==$tree and .version==$ver and .upgrade=="PASS" and .source_rollback=="PASS" and .wordpress_browser=="PASS" and .security_boundary=="PASS" and .frozen_shell_header_menu=="PASS" and .seo_native_cases==6 and .public_width_cases==6 and .seo_controls=="PASS" and .seo_draft_preservation=="PASS" and .seo_persistence=="PASS" and .seo_csrf=="PASS" and .seo_revision_conflict=="PASS" and .seo_invalid_contract=="PASS" and .seo_keyboard=="PASS" and .seo_alignment=="PASS" and .seo_disclosures=="PASS" and .seo_network_failure=="PASS" and .seo_busy_lock=="PASS" and .seo_native_post=="PASS" and .seo_true_blocked_state=="PASS" and .actual_seo_consumers=="PASS" and .complete_save_readback=="PASS" and .seo_legacy_upgrade_repair=="PASS" and .seo_known_value_repair=="PASS" and .seo_repair_rollback=="PASS" and .seo_initial_state=="PASS" and .seo_front_preview=="PASS" and .seo_modal_background=="PASS" and .polylang_actual_pairing=="PASS" and .bounded_performance=="PASS" and .tool_sitemap_policy=="PASS" and .tool_sitemap_policy_cases==10 and .sitemap_diagnostics_refresh=="PASS" and .save_toast_state=="PASS" and .clean_install=="PASS" and .recovery_data=="PASS" and .recovery_checks>=42 and .function_cases>=70 and .public_function_cases>=19' tested/FINAL_EVIDENCE.json >/dev/null
          test "$(git -C target rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git -C target rev-parse HEAD^{tree})" = "$TARGET_TREE"
          cp -a runner/lanes/s01-c01-seo-13592 lane
          python3 lane/build.py
          python3 - <<'PY'
          import json,pathlib
          tested=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text()); built=json.loads(pathlib.Path('proof/identity.json').read_text())
          for key in ['asset','asset_bytes','asset_sha256','source_tree','version']: assert tested[key]==built[key],key
          PY
      - name: Publish private formal Release and exact remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          ASSET="vf-tools-theme_V${TARGET_VERSION}.zip"; TAG="v$TARGET_VERSION"
          cat > /tmp/release-notes.md <<EOF
          VF Tools Theme V$TARGET_VERSION

          技术 SEO 与路由整页回归：修复连续保存/重查时上一轮成功提示残留；Sitemap 数量、发现原因与旧数据保护随完整回读刷新，残缺信息不报已确认。搜索结果页标明“已保存 Head”。
          工具 Sitemap 读取既有 Theme Resolver 的 sitemap purpose，正确排除 noindex 和无 Canonical URL；现有 SEO Option 更新时刷新请求内工具状态与 XML 缓存。零有效工具与接口缺失分别给出真实原因。
          全部路由控件、添加/移除/切换、独立草稿、保存/重查、真实前台入口、异常恢复与无JS保存继续覆盖；本页布局保持。合成 Provider 边界输入验证实际 Theme Resolver/XML，未宣称真实 Provider 全功能验收。
          Exact candidate Run: $CANDIDATE_RUN。真实 WordPress 六宽度全部控件、保存/回读/失败/冲突/重试/无JS、实际 Head/Sitemap/Resolver/Polylang消费者、干净安装、42项数据恢复及$SOURCE_VERSION→$TARGET_VERSION原生升级/回退/再应用通过。Assistant读取最终真实截图。
          Scope限定技术 SEO 与路由本页及其现有保存状态。Shell/Header/Main Menu、Ops Canonical Truth、权限/nonce、签名、Schema、Updater与Provider协议保持。OWNER真实使用待手工升级后复验，Production未执行；独立Preview Runtime按SSOT为N_A。
          Exact promoted source: $TARGET_SHA; tree: $TARGET_TREE。
          EOF
          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          else
            gh release create "$TAG" "proof/$ASSET" --repo "$TARGET_REPO" --target "$TARGET_SHA" --title "VF Tools Theme V$TARGET_VERSION" --notes-file /tmp/release-notes.md
          fi
          gh api "repos/$TARGET_REPO/releases/tags/$TAG" > proof/remote-release.json
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq .object.sha)" = "$TARGET_SHA"
          mkdir readback
          gh release download "$TAG" --repo "$TARGET_REPO" --pattern "$ASSET" --dir readback
          cmp "proof/$ASSET" "readback/$ASSET"
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('proof'); m=json.loads((p/'identity.json').read_text());r=json.loads((p/'remote-release.json').read_text());t=json.loads(pathlib.Path('tested/FINAL_EVIDENCE.json').read_text());assert not r['draft'] and not r['prerelease'];a=[a for a in r['assets'] if a['name']==m['asset']];assert len(a)==1 and a[0]['size']==m['asset_bytes'] and a[0]['digest']=='sha256:'+m['asset_sha256'];m.update(release_id=r['id'],asset_id=a[0]['id'],released_at=r['published_at'],runtime_files=t['runtime_files'],runtime_fingerprint=t['runtime_fingerprint'],candidate_run=t['candidate_run'],formal_release='PASS',remote_readback='PASS',distribution='NOT_EXECUTED',production='NOT_EXECUTED');(p/'RELEASE_RECEIPT.json').write_text(json.dumps(m,indent=2));print(json.dumps(m))
          PY
      - name: Public-safe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c01-seo-release-${{ github.run_id }}
          path: proof/RELEASE_RECEIPT.json
          retention-days: 30
          if-no-files-found: error
      - name: Private workspace cleanup
        if: always()
        run: rm -rf target readback proof/*.zip
