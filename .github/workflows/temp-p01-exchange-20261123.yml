name: TEMP P01 mature exchange exact-source Laravel and Vue checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-p01-exchange-20261123.yml'

permissions:
  contents: read

concurrency:
  group: temp-p01-exchange-20261123-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  laravel-feature:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-exchange-feature-vue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 60d278eefb81c9073c9d04a5613dd235d4c1c91b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Bind exact source without exposing source content
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "60d278eefb81c9073c9d04a5613dd235d4c1c91b"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Prepare Laravel PHP 8.4 with real SQLite and XML extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, fileinfo, curl, openssl, zip
          tools: composer:v2
          coverage: none

      - name: Run source syntax, real Laravel and in-memory SQLite feature tests
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          php -l app/Modules/Navigation/Infrastructure/BookmarkFormats.php >/dev/null
          php -l app/Modules/News/Application/NewsOpmlExchange.php >/dev/null
          php -l app/Modules/Software/Application/SoftwarePlanCsvTransfer.php >/dev/null
          php -l app/Modules/Subsites/Application/SubsiteCsvTransfer.php >/dev/null
          echo 'P01_FOUR_PHP_SYNTAX=PASS'
          if ! composer install --no-interaction --prefer-dist --no-progress --quiet >"$RUNNER_TEMP/p01-composer.log" 2>&1; then
            echo 'P01_COMPOSER_DEPENDENCIES=FAIL'
            exit 1
          fi
          echo 'P01_COMPOSER_DEPENDENCIES=PASS'
          export APP_ENV=testing
          export APP_KEY="base64:$(openssl rand -base64 32)"
          export DB_CONNECTION=sqlite
          export DB_DATABASE=:memory:
          if php artisan test --filter='(MatureBookmarkExchangeTest|NewsOpmlExchangeTest|SoftwarePlanCsvExchangeTest|SubsiteCsvExchangeTest)' >"$RUNNER_TEMP/p01-tests.log" 2>&1; then
            echo 'P01_FOUR_EXCHANGE_LARAVEL_FEATURE=PASS'
            grep -E '^  Tests:|^Tests:' "$RUNNER_TEMP/p01-tests.log" | tail -1 || true
          else
            echo 'P01_FOUR_EXCHANGE_LARAVEL_FEATURE=FAIL'
            grep -E '^  (FAIL|Tests:)|^Tests:' "$RUNNER_TEMP/p01-tests.log" | cut -c 1-180 | head -20 || true
            exit 1
          fi

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-composer.log" "$RUNNER_TEMP/p01-tests.log"
          test ! -e private-src

  vue-vite:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'test/p01-exchange-feature-vue-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private development source only in transient workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: llhzx2018/vf-startnew
          ref: 60d278eefb81c9073c9d04a5613dd235d4c1c91b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C private-src rev-parse HEAD)" = "60d278eefb81c9073c9d04a5613dd235d4c1c91b"
          echo 'P01_EXACT_SOURCE_BINDING=PASS'

      - name: Configure Node.js 22 from public runner
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run real Vue typecheck and production-mode Vite compilation
        working-directory: private-src
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          if ! npm ci --no-audit --no-fund --silent >"$RUNNER_TEMP/p01-npm.log" 2>&1; then
            echo 'P01_NPM_DEPENDENCIES=FAIL'
            exit 1
          fi
          echo 'P01_NPM_DEPENDENCIES=PASS'
          if npm run typecheck >"$RUNNER_TEMP/p01-typecheck.log" 2>&1; then
            echo 'P01_VUE_TYPECHECK=PASS'
          else
            echo 'P01_VUE_TYPECHECK=FAIL'
            sed -n -E 's#^([^(: ]+)\([0-9]+,[0-9]+\): error (TS[0-9]+):.*#\1 \2#p' "$RUNNER_TEMP/p01-typecheck.log" | head -30 || true
            exit 1
          fi
          if npm run build >"$RUNNER_TEMP/p01-vite.log" 2>&1; then
            echo 'P01_VITE_BUILD=PASS'
          else
            echo 'P01_VITE_BUILD=FAIL'
            exit 1
          fi

      - name: Remove all private checked-out content and temporary output
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- private-src
          rm -f -- "$RUNNER_TEMP/p01-npm.log" "$RUNNER_TEMP/p01-typecheck.log" "$RUNNER_TEMP/p01-vite.log"
          test ! -e private-src
