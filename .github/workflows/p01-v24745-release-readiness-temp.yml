name: p01-v24745-release-readiness-temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-v24745-release-readiness-temp.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout runner control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact P01 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 41d4253b8439deb098a44db6aa25acb94cc5ce93
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: product

      - name: Checkout exact gov-doc authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: d27f1391a63b4f7cc366894a445f771df14ba4d9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov

      - name: Exact source and authority pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "41d4253b8439deb098a44db6aa25acb94cc5ce93"
          test "$(git -C gov rev-parse HEAD)" = "d27f1391a63b4f7cc366894a445f771df14ba4d9"
          test "$(tr -d '\r\n ' < product/VERSION)" = "2.47.45"
          python3 - <<'PY'
          import json
          p=json.load(open('product/VF_PROJECT.json',encoding='utf-8'))
          expected={
            'current':'docs/authority/CURRENT.md',
            'rpd':'docs/authority/RPD.md',
            'ssot':'docs/authority/SSOT.md',
            'acceptance_matrix':'docs/authority/ACCEPTANCE_MATRIX.md',
            'functional_contract':'docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md',
          }
          assert p.get('authority')==expected, p.get('authority')
          forbidden={'status','lifecycle','phase','version','release_id','runner_run','next_action','production_version'}
          assert not (forbidden & set(p)), forbidden & set(p)
          print('P01_V24745_AUTHORITY_POINTERS=PASS')
          PY

      - name: Authority drift marker scan
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 gov/governance/authority/tools/authority_drift_lint.py product \
            --rules gov/governance/authority/VF_AUTHORITY_DRIFT_LINT_RULES_V1.0.json \
            --json > /tmp/drift.json
          cat /tmp/drift.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/drift.json',encoding='utf-8'))
          current={
            'docs/authority/CURRENT.md',
            'docs/authority/RPD.md',
            'docs/authority/SSOT.md',
            'docs/authority/ACCEPTANCE_MATRIX.md',
            'docs/authority/P01_FUNCTIONAL_CONTRACT_20260829.md',
          }
          negation=('不保存','不记录','不能外推','不得外推','不写入','不存放','不复制')
          def bounded_by_semantics(x):
            if any(n in x.get('text','') for n in negation):
              return True
            path='product/'+x['file']
            lines=open(path,encoding='utf-8',errors='replace').read().splitlines()
            i=max(0,int(x.get('line',1))-1)
            context='\n'.join(lines[max(0,i-12):min(len(lines),i+5)])
            return any(n in context for n in negation)
          bad=[
            x for x in d['findings']
            if x['severity']=='REVIEW_REQUIRED'
            and x['file'] in current
            and not bounded_by_semantics(x)
          ]
          print('P01_V24745_DRIFT_SEMANTIC_NEGATION_BOUNDED=PASS')
          print('P01_V24745_DRIFT_SCAN_FILES='+str(d['scanned_files']))
          print('P01_V24745_DRIFT_TOTAL_REVIEW='+str(d['review_required']))
          print('P01_V24745_DRIFT_CURRENT_REVIEW='+str(len(bad)))
          if bad:
            print(json.dumps(bad,ensure_ascii=False,indent=2))
            raise SystemExit(2)
          print('P01_V24745_CURRENT_AUTHORITY_DRIFT=PASS')
          PY

      - name: README and dynamic-truth separation
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'README 不是 Runtime Authority' product/README.md >/dev/null
          grep -F '本 README 只是文档导航，不是 Current Runtime / Release / Production Authority' product/docs/README.md >/dev/null
          ! grep -F '2.47.45' product/README.md product/docs/README.md
          ! grep -F '41d4253b8439deb098a44db6aa25acb94cc5ce93' product/README.md product/docs/README.md
          ! grep -E 'release_id|runner_run|artifact_id|production_version|target_version' product/VF_PROJECT.json
          echo P01_V24745_README_NOT_RUNTIME_AUTHORITY=PASS
          echo P01_V24745_NO_DUPLICATE_DYNAMIC_TRUTH=PASS

      - name: Release authority coverage matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f gov/governance/public-authority/VF_PUBLIC_AUTHORITY_APPLICABILITY_ROUTER_V1.0.md
          test -f gov/skills/skill-release/V2.7/SKILL.md
          test -f product/docs/authority/ACCEPTANCE_MATRIX.md
          grep -F 'RP-07' product/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F 'RP-08' product/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          grep -F 'RP-09' product/docs/authority/ACCEPTANCE_MATRIX.md >/dev/null
          cat <<'EOF'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=REQUIRED:EVIDENCE_PRESENT
          SECURITY=REQUIRED:EVIDENCE_PRESENT
          TESTING=REQUIRED:EVIDENCE_PRESENT
          UPGRADE=REQUIRED:EVIDENCE_PRESENT
          DATA_SCHEMA=REQUIRED:EVIDENCE_PRESENT_SCHEMA_UNCHANGED
          API_PROVIDER=N_A
          SEO=N_A
          CRON_JOB=N_A
          NOTIFICATION=N_A
          OBSERVABILITY=REQUIRED:EVIDENCE_PRESENT
          PERFORMANCE=N_A
          GIT=REQUIRED:EVIDENCE_PRESENT
          UA_UI=REQUIRED:MACHINE_PRESENT_OWNER_REAL_USE_PENDING
          NO_UNKNOWN_APPLICABILITY=YES
          EOF
          echo P01_V24745_PUBLIC_AUTHORITY_COVERAGE=MACHINE_COMPLETE_OWNER_GATE_PENDING

      - name: Release readiness conclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P01_V24745_MACHINE_READINESS=PASS
          echo MACHINE_PREFLIGHT_RUN=35938855504
          echo OWNER_PREVIEW_RUNTIME_APPLICABILITY=REQUIRED
          echo OWNER_PREVIEW_RUNTIME=PENDING
          echo OWNER_REAL_USE=PENDING
          echo RELEASE_INPUT_GATE=BLOCKED_OWNER_ACTION
          echo FORMAL_RELEASE_NOT_EXECUTED=YES