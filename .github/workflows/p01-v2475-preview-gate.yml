name: P01 V2.47.5 Preview Candidate Gate

on:
  pull_request:
    paths:
      - '.github/workflows/p01-v2475-preview-gate.yml'

permissions:
  contents: read

concurrency:
  group: p01-v2475-preview-candidate
  cancel-in-progress: false

jobs:
  preview:
    if: github.head_ref == 'temp/p01-v2475-preview-gate-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PRODUCT_REPO: llhzx2018/vf-start
      BASE_SHA: caf6994d2689fc30d52cd12d71f82310f4fb2d2b
      SOURCE_TAG: v2.47.4
      SOURCE_SHA: f24b01af34b173aef3ae6a7ecb5489aa6df19cc8
      SOURCE_VERSION: 2.47.4
      TARGET_VERSION: 2.47.5
      TARGET_BRANCH: release/v2.47.5-preview-20260910
      EXPECTED_SCHEMA: '2026090401'
      PREVIEW_TAG: v2.47.5-preview.1
      PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}

    steps:
      - name: Release-time public authority applicability
        shell: bash
        run: |
          set -Eeuo pipefail
          cat <<'EOF'
          PUBLIC_AUTHORITY_APPLICABILITY
          INSTALL=REQUIRED
          SECURITY=REQUIRED
          TESTING=REQUIRED
          UPGRADE=REQUIRED
          DATA_SCHEMA=REQUIRED
          GIT=REQUIRED
          UA_UI=REQUIRED
          API_PROVIDER=N_A
          SEO=N_A
          CRON_JOB=N_A
          NOTIFICATION=N_A
          OBSERVABILITY=N_A
          PERFORMANCE=N_A
          EOF
          echo P01_V2475_PUBLIC_AUTHORITY_ROUTING=PASS

      - name: Exact live source and release authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'PREVIEW_BLOCK=VF_PRIVATE_READ_TOKEN_MISSING'; exit 81; }
          test -n "$RELEASE_TOKEN" || { echo 'PREVIEW_BLOCK=VF_RELEASE_WRITE_TOKEN_MISSING'; exit 82; }
          current="$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$BASE_SHA" || { echo "PREVIEW_BLOCK=MAIN_DRIFT:${current}"; exit 83; }
          source="$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${SOURCE_TAG}" --jq '.object.sha')"
          test "$source" = "$SOURCE_SHA" || { echo "PREVIEW_BLOCK=SOURCE_TAG_DRIFT:${source}"; exit 84; }
          target="$(GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')"
          test "$target" = "$BASE_SHA" || { echo "PREVIEW_BLOCK=TARGET_BRANCH_DRIFT:${target}"; exit 85; }
          test "$(GH_TOKEN="$RELEASE_TOKEN" gh api "repos/${PRODUCT_REPO}" --jq '.permissions.push')" = true
          if GH_TOKEN="$PRIVATE_READ_TOKEN" gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" >/dev/null 2>&1; then
            echo 'PREVIEW_BLOCK=PREVIEW_TAG_ALREADY_EXISTS'
            exit 86
          fi
          echo P01_V2475_EXACT_LIVE_AUTHORITY=PASS

      - name: Checkout exact P01 release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.BASE_SHA }}
          token: ${{ env.RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true
          path: vf-start

      - name: Checkout exact V2.47.4 formal baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: baseline

      - name: Checkout proven artifact helper and template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 1dd635d8e8d4485736458672fb7a5be397d94f89
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: helper

      - name: Checkout proven artifact template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 0439b0df027ae0bc6c21a8dbf91b066a564130f9
          token: ${{ env.PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: template

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite,sqlite3,curl,zip,simplexml,mbstring,openssl,fileinfo,gd
          coverage: none

      - name: Exact V2.47.5 three-point version bind
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse "$SOURCE_TAG^{commit}")" = "$SOURCE_SHA"
          test "$(tr -d '\r\n ' < VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n ' < src/VERSION.txt)" = "$SOURCE_VERSION"
          grep -Fq "define('VF_VERSION', '$SOURCE_VERSION');" src/app/bootstrap.php
          printf '%s\n' "$TARGET_VERSION" > VERSION
          printf '%s\n' "$TARGET_VERSION" > src/VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          old="define('VF_VERSION', '2.47.4');"
          new="define('VF_VERSION', '2.47.5');"
          if s.count(old) != 1:
              raise SystemExit('VF_VERSION anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --name-only | sort >/tmp/p01-v2475-bind-files
          printf '%s\n' VERSION src/VERSION.txt src/app/bootstrap.php | sort >/tmp/p01-v2475-bind-expected
          diff -u /tmp/p01-v2475-bind-expected /tmp/p01-v2475-bind-files
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          echo P01_V2475_VERSION_IDENTITY_BIND=PASS

      - name: Exact scope schema security and syntax gate
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          schema="$(php -r '$p=json_decode(file_get_contents("VF_PROJECT.json"),true); echo $p["working_schema_version"];')"
          test "$schema" = "$EXPECTED_SCHEMA"
          git diff --name-only "$SOURCE_TAG" "$BASE_SHA" | sort >/tmp/p01-v2475-product-files
          printf '%s\n' src/assets/workspace-domain-nav.css tests/integration/p01_content_first_shell_acceptance.php | sort >/tmp/p01-v2475-product-expected
          diff -u /tmp/p01-v2475-product-expected /tmp/p01-v2475-product-files
          test -z "$(git diff --name-only "$SOURCE_TAG" "$BASE_SHA" -- src/migrations VF_PROJECT.json src/app/UpdateManager.php src/update.php src/app/Auth.php src/app/SecurityManager.php src/app/Repository.php)"
          find src -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-v2475-php-lint.log
          while IFS= read -r -d '' f; do node --check "$f" >/dev/null; done < <(find src -type f -name '*.js' -print0)
          php tests/integration/p01_content_first_shell_acceptance.php | tee /tmp/p01-v2475-shell-contract.txt
          grep -Fx 'P01_CONTENT_FIRST_SHELL_ACCEPTANCE=PASS' /tmp/p01-v2475-shell-contract.txt
          echo P01_V2475_SCOPE_SCHEMA_SECURITY_SYNTAX=PASS

      - name: Canonical integration regression
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          php tests/integration/p01_v2391_resource_groups_acceptance.php
          php tests/integration/p01_books_catalog_acceptance.php
          php tests/integration/p01_six_surface_authority_acceptance.php
          php tests/integration/p01_start_category_return_acceptance.php
          echo P01_V2475_CANONICAL_INTEGRATIONS=PASS

      - name: Fresh install runtime and nine-surface smoke
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          RUNTIME=/tmp/p01-v2475-preview-runtime
          rm -rf "$RUNTIME"
          cp -a src "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18115 -t . >/tmp/p01-v2475-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS -c /tmp/p01-v2475.cookies -b /tmp/p01-v2475.cookies http://127.0.0.1:18115/setup.php -o /tmp/p01-v2475-setup.html && break
            sleep 1
          done
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v2475-setup.html',encoding='utf-8').read()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m
          print(m.group(1))
          PY
          )
          PASS="Gate${GITHUB_RUN_ID}V2475x"
          curl -fsS -c /tmp/p01-v2475.cookies -b /tmp/p01-v2475.cookies -X POST http://127.0.0.1:18115/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=VF Start V2.47.5 Preview' --data-urlencode "admin_password=$PASS" --data-urlencode "admin_password_confirm=$PASS" -o /tmp/p01-v2475-post.html
          test -f app/.runtime.php
          php cli/verify.php | tee /tmp/p01-v2475-verify.txt
          grep -Fx 'VERIFY_PASS=YES' /tmp/p01-v2475-verify.txt
          php cli/surface-verify.php | tee /tmp/p01-v2475-surface-verify.txt
          grep -Fx 'MULTI_SURFACE_PASS=YES' /tmp/p01-v2475-surface-verify.txt
          for p in / /start.php /channels.php /watch.php /topics.php /courses.php /projects.php /tools.php /software.php; do
            test "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18115$p")" = 200
          done
          echo "$SERVER_PID" >/tmp/p01-v2475-server.pid
          trap - EXIT
          echo P01_V2475_FRESH_INSTALL_RUNTIME=PASS

      - name: Exact browser shell geometry and responsive evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2475-browser-evidence /tmp/p01-v2475-playwright
          cd /tmp/p01-v2475-playwright
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const desktop = await browser.newPage({viewport:{width:1440,height:1000}});
          await desktop.goto('http://127.0.0.1:18115/start.php',{waitUntil:'networkidle'});
          const nav = await desktop.evaluate(() => ({
            sidebar:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,
            sidebarWidth:document.querySelector('.vf-app-sidebar').getBoundingClientRect().width,
            stageLeft:document.querySelector('.vf-app-stage').getBoundingClientRect().left,
            overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          }));
          if (nav.sidebar === 'none' || nav.sidebarWidth < 150 || nav.stageLeft < 150 || nav.overflow > 1) throw new Error('Navigation rail contract failed '+JSON.stringify(nav));
          await desktop.screenshot({path:'/tmp/p01-v2475-browser-evidence/navigation-desktop.png',fullPage:true});
          const subjectPaths=['channels.php','watch.php','topics.php','courses.php','projects.php','tools.php','software.php'];
          const results={navigation:nav,subjects:{}};
          for (const path of subjectPaths) {
            await desktop.goto('http://127.0.0.1:18115/'+path,{waitUntil:'networkidle'});
            const r=await desktop.evaluate(() => ({
              sidebar:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,
              stageLeft:document.querySelector('.vf-app-stage').getBoundingClientRect().left,
              mainWidth:document.querySelector('.vf-shell-main').getBoundingClientRect().width,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if (r.sidebar !== 'none' || Math.abs(r.stageLeft) > 1 || r.mainWidth < 1100 || r.overflow > 1) throw new Error(path+' content-first contract failed '+JSON.stringify(r));
            results.subjects[path]=r;
          }
          await desktop.goto('http://127.0.0.1:18115/software.php',{waitUntil:'networkidle'});
          await desktop.screenshot({path:'/tmp/p01-v2475-browser-evidence/software-desktop.png',fullPage:true});
          const mobile=await browser.newPage({viewport:{width:390,height:844}});
          for (const path of subjectPaths) {
            await mobile.goto('http://127.0.0.1:18115/'+path,{waitUntil:'networkidle'});
            const r=await mobile.evaluate(() => ({
              sidebar:getComputedStyle(document.querySelector('.vf-app-sidebar')).display,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if (r.sidebar !== 'none' || r.overflow > 1) throw new Error(path+' mobile contract failed '+JSON.stringify(r));
          }
          await mobile.goto('http://127.0.0.1:18115/courses.php',{waitUntil:'networkidle'});
          await mobile.screenshot({path:'/tmp/p01-v2475-browser-evidence/courses-mobile.png',fullPage:true});
          fs.writeFileSync('/tmp/p01-v2475-browser-evidence/geometry.json',JSON.stringify(results,null,2));
          await browser.close();
          console.log('P01_V2475_BROWSER_SHELL_GEOMETRY=PASS');
          JS
          node verify.mjs
          kill "$(cat /tmp/p01-v2475-server.pid)" 2>/dev/null || true
          echo P01_V2475_UA_UI_RESPONSIVE=PASS

      - name: Publish exact V2.47.5 preview candidate branch
        working-directory: vf-start
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --numstat | awk '{a+=$1;d+=$2} END{print a":"d}')" = '3:3'
          git config user.name 'VictorForge Release Runner'
          git config user.email 'llhzx2018@users.noreply.github.com'
          git checkout -b p01-v2475-preview-candidate
          git add VERSION src/VERSION.txt src/app/bootstrap.php
          git commit -m 'release(P01): bind V2.47.5 preview candidate'
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease="refs/heads/${TARGET_BRANCH}:${BASE_SHA}"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "P01_V2475_PREVIEW_CANDIDATE_SHA=$CANDIDATE_SHA"
          echo P01_V2475_PREVIEW_CANDIDATE_PUBLISHED=PASS

      - name: Deterministic FULL and ATOMIC UPDATE gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf formal candidate
          cp -a vf-start formal
          cp -a vf-start candidate
          cp helper/scripts/_tmp_p01_v2470_formal_artifact_gate.sh /tmp/p01-v2475-preview-artifact-gate.sh
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/p01-v2475-preview-artifact-gate.sh')
          s=p.read_text(encoding='utf-8')
          candidate=os.environ['CANDIDATE_SHA']
          run_id=os.environ['GITHUB_RUN_ID']
          replacements=[
            ('7f3492f70276d83efed371296d69709c1e991350',candidate),
            ('b70971514ccf1c6b8f3793bfc5a2200cad47dfe9',candidate),
            ('1bd95e8777e72f6cd89206ddb9daf934ad4e6b9e','f24b01af34b173aef3ae6a7ecb5489aa6df19cc8'),
            ('33993725218',run_id),
            ('BIND_PR=416','BIND_PR=0'),
            ('OWNER_AUTHORIZED_V2470_RELEASE_CHAIN_20260906','OWNER_AUTHORIZED_V2475_CONTENT_FIRST_RELEASE_20260910'),
            ('V2470','V2475'),
            ('v2470','v2475'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('missing V2.47.0 gate anchor: '+old)
              s=s.replace(old,new)
          s=s.replace('2.47.0','__P01_TARGET__').replace('2.46.4','2.47.4').replace('__P01_TARGET__','2.47.5')
          old="src=src.replace(\"'release_type':'patch'\",\"'release_type':'minor'\")"
          if old not in s:
              raise SystemExit('release type anchor missing')
          s=s.replace(old,"src=src.replace('V2.46.1 之后 Consolidated L2 Product Optimization 的正式发布版本。','V2.47.4 之后 content-first shell / Navigation-only taxonomy rail 的维护版本。')",1)
          p.write_text(s,encoding='utf-8')
          PY
          chmod +x /tmp/p01-v2475-preview-artifact-gate.sh
          bash /tmp/p01-v2475-preview-artifact-gate.sh
          ASSETS=/tmp/p01-v2475-formal-artifacts
          test -f "$ASSETS/VF-Start-V2.47.5-FULL.zip"
          test -f "$ASSETS/VF-Start-V2.47.5-FULL.zip.sha256"
          test -f "$ASSETS/VF_Start_V2.47.5_UPDATE.zip"
          test -f "$ASSETS/VF_Start_V2.47.5_UPDATE.zip.sha256"
          (cd "$ASSETS" && sha256sum -c VF-Start-V2.47.5-FULL.zip.sha256 && sha256sum -c VF_Start_V2.47.5_UPDATE.zip.sha256)
          ! unzip -Z1 "$ASSETS/VF-Start-V2.47.5-FULL.zip" | grep -Eq '(^|/)(private|backups|uploads|runtime-data)(/|$)'
          echo P01_V2475_INSTALL_UPGRADE_DATA_SECURITY=PASS

      - name: Publish exact GitHub prerelease preview
        env:
          GH_TOKEN: ${{ env.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-formal-artifacts
          gh api --method POST "repos/${PRODUCT_REPO}/git/refs" -f ref="refs/tags/${PREVIEW_TAG}" -f sha="$CANDIDATE_SHA" >/tmp/p01-v2475-preview-tag.json
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          cat >/tmp/p01-v2475-preview-notes.md <<EOF
          P01 · VF Start V2.47.5 Preview 1

          - Exact candidate: ${CANDIDATE_SHA}
          - Base main: ${BASE_SHA}
          - Previous formal release: ${SOURCE_TAG} / ${SOURCE_SHA}
          - Product change: Navigation keeps the desktop taxonomy rail; Home and all subject product pages are content-first/full-width.
          - Schema: ${EXPECTED_SCHEMA}; Migration: NONE
          - Candidate / browser / install / atomic update / data preservation / security gates: PASS on Runner ${GITHUB_RUN_ID}
          - Stable Distribution: NOT UPDATED
          - Production: NOT WRITTEN / NOT VERIFIED
          EOF
          gh release create "$PREVIEW_TAG" \
            "$ASSETS/VF-Start-V2.47.5-FULL.zip" \
            "$ASSETS/VF-Start-V2.47.5-FULL.zip.sha256" \
            "$ASSETS/VF_Start_V2.47.5_UPDATE.zip" \
            "$ASSETS/VF_Start_V2.47.5_UPDATE.zip.sha256" \
            --repo "$PRODUCT_REPO" --title 'VF Start V2.47.5 Preview 1' --notes-file /tmp/p01-v2475-preview-notes.md --prerelease --verify-tag
          echo P01_V2475_PREVIEW_PRERELEASE=PASS

      - name: Independent preview remote-byte readback
        env:
          GH_TOKEN: ${{ env.PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ASSETS=/tmp/p01-v2475-formal-artifacts
          test "$(gh api "repos/${PRODUCT_REPO}/git/ref/tags/${PREVIEW_TAG}" --jq '.object.sha')" = "$CANDIDATE_SHA"
          gh api "repos/${PRODUCT_REPO}/releases/tags/${PREVIEW_TAG}" >/tmp/p01-v2475-preview-release.json
          test "$(jq -r '.draft' /tmp/p01-v2475-preview-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/p01-v2475-preview-release.json)" = true
          rm -rf /tmp/p01-v2475-preview-remote
          mkdir -p /tmp/p01-v2475-preview-remote
          gh release download "$PREVIEW_TAG" --repo "$PRODUCT_REPO" --dir /tmp/p01-v2475-preview-remote
          LOCAL="$ASSETS" REMOTE=/tmp/p01-v2475-preview-remote python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          local=Path(os.environ['LOCAL']); remote=Path(os.environ['REMOTE'])
          expected=['VF-Start-V2.47.5-FULL.zip','VF-Start-V2.47.5-FULL.zip.sha256','VF_Start_V2.47.5_UPDATE.zip','VF_Start_V2.47.5_UPDATE.zip.sha256']
          got=sorted(p.name for p in remote.iterdir() if p.is_file())
          assert sorted(expected)==got, {'expected':sorted(expected),'got':got}
          for name in expected:
              a,b=local/name,remote/name
              ha=hashlib.sha256(a.read_bytes()).hexdigest(); hb=hashlib.sha256(b.read_bytes()).hexdigest()
              assert a.stat().st_size==b.stat().st_size and ha==hb
              print(f'PREVIEW_ASSET={name}|{a.stat().st_size}|{ha}')
          print('P01_V2475_PREVIEW_REMOTE_BYTE_IDENTITY=PASS')
          PY
          echo "PREVIEW_RELEASE_ID=$(jq -r '.id' /tmp/p01-v2475-preview-release.json)" >> "$GITHUB_ENV"
          echo P01_V2475_PREVIEW_REMOTE_READBACK=PASS

      - name: Build public-safe release evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2475-public-evidence
          cp -a /tmp/p01-v2475-browser-evidence/. /tmp/p01-v2475-public-evidence/ 2>/dev/null || true
          jq -n --arg base "$BASE_SHA" --arg candidate "${CANDIDATE_SHA:-}" --arg tag "$PREVIEW_TAG" --arg run_id "$GITHUB_RUN_ID" '{schema:"p01-preview-evidence/v2",project_id:"P01",version:"2.47.5",source_version:"2.47.4",schema_version:"2026090401",migration:"NONE",base_main:$base,candidate:$candidate,preview_tag:$tag,runner_run_id:$run_id,public_authority:{install:"REQUIRED",security:"REQUIRED",testing:"REQUIRED",upgrade:"REQUIRED",data_schema:"REQUIRED",git:"REQUIRED",ua_ui:"REQUIRED"},stable_distribution_updated:false,production_write:false}' > /tmp/p01-v2475-public-evidence/P01-V2.47.5-PREVIEW-EVIDENCE.json

      - name: Upload public-safe release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P01-V2.47.5-PREVIEW-EVIDENCE-${{ github.run_id }}
          path: /tmp/p01-v2475-public-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Final verdict
        run: |
          echo P01_V2475_PREVIEW_GATE=PASS
          echo INSTALL_GATE=PASS
          echo UPGRADE_GATE=PASS
          echo DATA_PRESERVATION_GATE=PASS
          echo SECURITY_GATE=PASS
          echo UA_UI_GATE=PASS
          echo STABLE_DISTRIBUTION_UPDATED=false
          echo PRODUCTION_WRITE=false

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat /tmp/p01-v2475-server.pid 2>/dev/null)" 2>/dev/null || true
          rm -rf vf-start baseline helper template formal candidate /tmp/p01-v2475-*