name: TEMP S01-C03 Online Update Contract Recovery Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-online-update-contract-recovery-gate.yml

permissions:
  contents: read

jobs:
  candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRODUCT_REPO: llhzx2018/vf-tools-m3u8
      BASE_SHA: d7b67319ae3c0b077d39d0f84df3facd38a2c44d
      CANDIDATE_SHA: 14c7f47f457a5766276d5ec1fc4f7b9d2c20c553
    steps:
      - name: Checkout exact S01-C03 candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 14c7f47f457a5766276d5ec1fc4f7b9d2c20c553
          fetch-depth: 0

      - name: Exact identity and diff scope gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"

          mapfile -t actual < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort)
          expected=(
            "scripts/s01-c03-bootstrap-upgrade-1254.php"
            "src/includes/update/class-vf-m3u8-update-contract-v1.php"
            "src/includes/update/class-vf-m3u8-update-source-v1.php"
            "tests/unit/bootstrap-upgrade-contract.php"
            "tests/unit/update-schema-authority-contract.php"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${actual[$i]}" = "${expected_sorted[$i]}"
          done

          git diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- VERSION src/vf-tool-m3u8.php src/PACKAGE_PROFILE.json src/plugin-manifest.json
          test "$(tr -d '\r\n' < VERSION)" = "1.25.5"
          grep -Fq "Version: 1.25.5" src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R229'" src/vf-tool-m3u8.php
          echo "Exact identity / 5-path scope / no-version-write PASS"

      - name: PHP lint changed runtime and contract files
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l scripts/s01-c03-bootstrap-upgrade-1254.php
          php -l src/includes/update/class-vf-m3u8-update-contract-v1.php
          php -l src/includes/update/class-vf-m3u8-update-source-v1.php
          php -l tests/unit/bootstrap-upgrade-contract.php
          php -l tests/unit/update-schema-authority-contract.php

      - name: Canonical Schema Authority invariant gate
        run: php tests/unit/update-schema-authority-contract.php

      - name: Sealed 1.25.4 bootstrap contract gate
        run: php tests/unit/bootstrap-upgrade-contract.php

      - name: Diagnostic-first Schema Repair regression gate
        run: php tests/unit/schema-repair-contract.php

      - name: Seal evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse HEAD^{tree})"
          php_version="$(php -r 'echo PHP_VERSION;')"
          cat > s01-c03-online-update-contract-recovery-gate.txt <<EOF
          S01_C03_ONLINE_UPDATE_CONTRACT_RECOVERY_CANDIDATE_GATE=PASS
          BASE_SHA=$BASE_SHA
          CANDIDATE_SHA=$CANDIDATE_SHA
          CANDIDATE_TREE_SHA=$tree_sha
          PHP_VERSION=$php_version
          CHANGED_PATH_COUNT=5
          SCHEMA_AUTHORITY=CANONICAL_1.3.0
          NATIVE_UPDATE_SCHEMA_INVARIANT=PASS
          BOOTSTRAP_1254_SOURCE_ONLY_CONTRACT=PASS
          SCHEMA_REPAIR_REGRESSION=PASS
          VERSION_WRITE=NO
          MAIN_PROMOTION=NO
          TAG_RELEASE_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          NEW_RUNNER=NO
          NEW_SECRET=NO
          NEW_SSH=NO
          EOF
          cat s01-c03-online-update-contract-recovery-gate.txt

      - name: Upload gate evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s01-c03-online-update-contract-recovery-gate-${{ github.run_id }}
          path: s01-c03-online-update-contract-recovery-gate.txt
          if-no-files-found: error
          retention-days: 14
