name: TEMP S01-C03 Online Update Contract Recovery Gate

on:
  push:
    branches:
      - temp/s01-release-prep-gate-20260902
    paths:
      - .github/workflows/temp-s01-c03-online-update-contract-recovery-gate.yml

permissions:
  contents: read

concurrency:
  group: temp-s01-c03-online-update-contract-recovery-gate-20260902
  cancel-in-progress: true

env:
  BASE_SHA: d7b67319ae3c0b077d39d0f84df3facd38a2c44d
  CANDIDATE_SHA: 38fd1617525f6e0e261c790f65b1ae15cbd3a333
  EVIDENCE_DIR: /tmp/s01-c03-online-update-contract-recovery-evidence

jobs:
  candidate-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact S01-C03 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.CANDIDATE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: m3u8

      - name: Exact identity and diff scope gate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git -C m3u8 rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C m3u8 cat-file -e "$BASE_SHA^{commit}"
          test "$(git -C m3u8 merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"

          mapfile -t actual < <(git -C m3u8 diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | LC_ALL=C sort)
          expected=(
            "scripts/s01-c03-bootstrap-upgrade-1254.php"
            "src/includes/update/class-vf-m3u8-update-contract-v1.php"
            "src/includes/update/class-vf-m3u8-update-source-v1.php"
            "tests/unit/bootstrap-upgrade-contract.php"
            "tests/unit/update-schema-authority-contract.php"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${actual[$i]}" = "${expected_sorted[$i]}"
          done

          git -C m3u8 diff --quiet "$BASE_SHA" "$CANDIDATE_SHA" -- VERSION src/vf-tool-m3u8.php src/PACKAGE_PROFILE.json src/plugin-manifest.json
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "1.25.5"
          grep -Fq "Version: 1.25.5" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R229'" m3u8/src/vf-tool-m3u8.php
          printf '%s\n' "BASE_SHA=$BASE_SHA" "CANDIDATE_SHA=$CANDIDATE_SHA" "DIFF_PATHS=${actual[*]}" > "$EVIDENCE_DIR/identity.txt"
          echo "Exact identity / 5-path scope / no-version-write PASS"

      - name: PHP lint changed runtime and contract files
        shell: bash
        run: |
          set -Eeuo pipefail
          php -v | tee "$EVIDENCE_DIR/php-version.txt"
          php -l m3u8/scripts/s01-c03-bootstrap-upgrade-1254.php | tee "$EVIDENCE_DIR/lint-bootstrap.txt"
          php -l m3u8/src/includes/update/class-vf-m3u8-update-contract-v1.php | tee "$EVIDENCE_DIR/lint-update-contract.txt"
          php -l m3u8/src/includes/update/class-vf-m3u8-update-source-v1.php | tee "$EVIDENCE_DIR/lint-update-source.txt"
          php -l m3u8/tests/unit/bootstrap-upgrade-contract.php | tee "$EVIDENCE_DIR/lint-bootstrap-contract.txt"
          php -l m3u8/tests/unit/update-schema-authority-contract.php | tee "$EVIDENCE_DIR/lint-schema-authority-contract.txt"

      - name: Canonical Schema Authority invariant gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php m3u8/tests/unit/update-schema-authority-contract.php | tee "$EVIDENCE_DIR/schema-authority-contract.txt"

      - name: Sealed 1.25.4 bootstrap contract gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php m3u8/tests/unit/bootstrap-upgrade-contract.php | tee "$EVIDENCE_DIR/bootstrap-contract.txt"

      - name: Diagnostic-first Schema Repair regression gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php m3u8/tests/unit/schema-repair-contract.php | tee "$EVIDENCE_DIR/schema-repair-regression.txt"

      - name: Seal evidence
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          tree_sha="$(git -C m3u8 rev-parse HEAD^{tree})"
          php_version="$(php -r 'echo PHP_VERSION;')"
          cat > "$EVIDENCE_DIR/S01_C03_ONLINE_UPDATE_CONTRACT_RECOVERY_CANDIDATE_GATE.txt" <<EOF
          S01_C03_ONLINE_UPDATE_CONTRACT_RECOVERY_CANDIDATE_GATE=PASS
          BASE_SHA=$BASE_SHA
          CANDIDATE_SHA=$CANDIDATE_SHA
          CANDIDATE_TREE_SHA=$tree_sha
          PHP_VERSION=$php_version
          CHANGED_PATH_COUNT=5
          SCHEMA_AUTHORITY=CANONICAL_1.3.0
          NATIVE_UPDATE_SCHEMA_INVARIANT=PASS
          BOOTSTRAP_1254_SOURCE_ONLY_CONTRACT=PASS
          SCHEMA_REPAIR_REGRESSION=PASS
          VERSION_WRITE=NO
          MAIN_PROMOTION=NO
          TAG_RELEASE_WRITE=NO
          CORE_UPDATES_WRITE=NO
          PRODUCTION_WRITE=NO
          NEW_RUNNER=NO
          NEW_SECRET=NO
          NEW_SSH=NO
          EOF
          cat "$EVIDENCE_DIR/S01_C03_ONLINE_UPDATE_CONTRACT_RECOVERY_CANDIDATE_GATE.txt"

      - name: Upload gate evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-online-update-contract-recovery-gate-${{ github.run_id }}
          path: /tmp/s01-c03-online-update-contract-recovery-evidence/
          if-no-files-found: error
          retention-days: 14
