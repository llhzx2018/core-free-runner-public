name: S01 C03 M3U8 1.25.27 Core Update Gate

on:
  push:
    branches:
      - temp/s01-c03-12527-core-update-gate-20260907

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_SHA: 1810863ae13a3df26c80368c4e3b14c623b22c01
      CORE_BASE: cd8e8e02460b80509979ba585b0f43407773cd9c
      M3U8_SHA: 6d603409acf470865e3ca8474cd29bff7fdd0601
      M3U8_TAG: v1.25.27
      M3U8_ASSET: vf-tools-m3u8_V1.25.27.zip
      M3U8_BYTES: '3578775'
      M3U8_SHA256: 200162a974c4429723438d95c3be328da745ce5377951ed8d3b88d0d5c1274ee
      M3U8_RUNTIME_FILES: '558'
      M3U8_RUNTIME_FP: 3f44da39583118aec5b539a98de1e3b649fecfa2ac15f23841e6e54ec1caea12
      M3U8_RELEASE_ID: '384182651'
      M3U8_ASSET_ID: '548992079'

    steps:
      - name: Credential read-only boundary
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          echo 'WRITE_TOKEN_USED=NO'
          echo 'PRODUCTION_WRITE_USED=NO'

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core

      - name: Exact one-manifest fence
        shell: bash
        run: |
          set -euo pipefail
          cd core
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          git cat-file -e "$CORE_BASE^{commit}"
          git diff --name-only "$CORE_BASE" HEAD | sort > /tmp/actual.txt
          printf '%s\n' 'projects/S01-C03.json' > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          echo PASS_EXACT_ONE_MANIFEST_FENCE

      - name: JSON and canonical manifest contract
        shell: bash
        run: |
          set -euo pipefail
          cd core
          jq -e . projects/S01-C01.json >/dev/null
          jq -e . projects/S01-C02.json >/dev/null
          jq -e . projects/S01-C03.json >/dev/null
          python3 scripts/check_manifest_contract.py >/tmp/manifest-contract.json
          jq -e '.status=="PASS"' /tmp/manifest-contract.json >/dev/null
          echo PASS_CANONICAL_MANIFEST_CONTRACT

      - name: Update Core PHP regression
        shell: bash
        run: |
          set -euo pipefail
          cd core
          find update-core/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/update-core-lint.log
          php update-core/php/tests/run.php
          echo PASS_UPDATE_CORE_PHP_REGRESSION

      - name: Exact S01 channel semantics
        shell: bash
        run: |
          set -euo pipefail
          cd core
          python3 - <<'PY'
          import json
          c1=json.load(open('projects/S01-C01.json'))
          c2=json.load(open('projects/S01-C02.json'))
          c3=json.load(open('projects/S01-C03.json'))

          assert c1['target_version']=='1.35.18'
          assert c1['release_tag']=='v1.35.18'
          assert c1['asset_sha256']=='a2b80df81e7a15f466fe7bd36ecfe3a1256d17a3cc5e31415cd89cb4cc8f4380'
          assert c1['runtime_fingerprint']=='40290643f59d876fcdf872c27ef11a65ab63c13e85381c3ba1ddf5dd1fc05954'

          assert c2['target_version']=='1.21.856'
          assert c2['release_tag']=='v1.21.856'
          assert c2['asset_sha256']=='7989e1814051de7e7e5236b0b530836d2812a85482be8f6e7b0ec7a799ca9b96'
          assert c2['runtime_fingerprint']=='f8a2ff5201f29ee4b5d3860041ba6eb89ac04e1fec56d310e263056ff1d2e0b4'

          assert c3['target_version']=='1.25.27'
          assert c3['release_tag']=='v1.25.27'
          assert c3['asset_name']=='vf-tools-m3u8_V1.25.27.zip'
          assert c3['asset_bytes']==3578775
          assert c3['asset_sha256']=='200162a974c4429723438d95c3be328da745ce5377951ed8d3b88d0d5c1274ee'
          assert c3['runtime_files']==558 and c3['runtime_file_count']==558
          assert c3['runtime_fingerprint']=='3f44da39583118aec5b539a98de1e3b649fecfa2ac15f23841e6e54ec1caea12'
          assert c3['runtime_fingerprint_sha256']==c3['runtime_fingerprint']
          assert c3['from_versions']==['1.25.20','1.25.21','1.25.22','1.25.23','1.25.24','1.25.25','1.25.26']
          assert c3['physical_locator']=='vf-tool-m3u8/vf-tool-m3u8.php'
          assert c3['canonical_locator']=='vf-tools-m3u8/vf-tools-m3u8.php'
          assert c3['locator_cutover'] is False
          assert c3['schema_from']=='1.3.0' and c3['schema_to']=='1.3.0'
          assert 'migration remains CLOSED' in c3['notes']
          assert 'Production' in c3['notes'] and 'does not claim' in c3['notes']
          assert '34137686458' in c3['notes'] and '34138309000' in c3['notes']
          print('PASS_S01_EXACT_CHANNEL_SEMANTICS')
          PY

      - name: Live M3U8 Release authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/branches/main --jq '.commit.sha')" = "$M3U8_SHA"
          test "$(gh api repos/llhzx2018/vf-tools-m3u8/git/ref/tags/$M3U8_TAG --jq '.object.sha')" = "$M3U8_SHA"
          gh api repos/llhzx2018/vf-tools-m3u8/releases/tags/$M3U8_TAG > /tmp/m3u8-release.json
          test "$(jq -r '.id' /tmp/m3u8-release.json)" = "$M3U8_RELEASE_ID"
          test "$(jq -r '.draft' /tmp/m3u8-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/m3u8-release.json)" = false
          test "$(jq -r --arg a "$M3U8_ASSET" '.assets[]|select(.name==$a)|.id' /tmp/m3u8-release.json)" = "$M3U8_ASSET_ID"
          test "$(jq -r --arg a "$M3U8_ASSET" '.assets[]|select(.name==$a)|.size' /tmp/m3u8-release.json)" = "$M3U8_BYTES"
          test "$(jq -r --arg a "$M3U8_ASSET" '.assets[]|select(.name==$a)|.digest' /tmp/m3u8-release.json)" = "sha256:$M3U8_SHA256"
          grep -Fq "Runtime files: $M3U8_RUNTIME_FILES" /tmp/m3u8-release.json
          grep -Fq "Runtime fingerprint: $M3U8_RUNTIME_FP" /tmp/m3u8-release.json
          grep -Fq 'Production: NOT_RUN' /tmp/m3u8-release.json
          echo PASS_LIVE_M3U8_RELEASE_AUTHORITY

      - name: C01 and C02 unchanged from base
        shell: bash
        run: |
          set -euo pipefail
          cd core
          git show "$CORE_BASE:projects/S01-C01.json" > /tmp/base-c01.json
          git show "$CORE_BASE:projects/S01-C02.json" > /tmp/base-c02.json
          cmp -s /tmp/base-c01.json projects/S01-C01.json
          cmp -s /tmp/base-c02.json projects/S01-C02.json
          echo PASS_C01_C02_UNCHANGED
