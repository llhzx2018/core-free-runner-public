name: P08 R111 early 503 gateway recovery on original FULL (one off)
on:
  pull_request:
    paths:
      - .github/workflows/p08-r111-early-barrier-recovery.yml
permissions:
  contents: read
jobs:
  isolated-early-barrier:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITHUB_ACTIONS: "true"
      P08_R111_ISOLATED: "YES"
      P08_SOURCE_SHA: f5f6085cea70318ec8b68121ef324c16bbdf6ee5
      P08_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Ephemeral exact private checkout with registered runtime read token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: f5f6085cea70318ec8b68121ef324c16bbdf6ee5
          path: private-p08
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: Real PHP 8.4 old full package verifier
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, zip, sqlite3, pdo_sqlite, pdo_mysql, fileinfo
      - name: Real official v0.1.2 FULL + early 503 barrier foreign-content refusal + safe recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08 rev-parse HEAD)" = "$P08_SOURCE_SHA"
          php -l private-p08/tests/compatibility/r111_early_barrier_recovery.php
          curl --fail --silent --show-error --location --max-time 90 \
            -H "Authorization: Bearer $P08_READ_TOKEN" \
            -H "Accept: application/octet-stream" \
            https://api.github.com/repos/llhzx2018/vf-adops/releases/assets/747260263 \
            --output "$RUNNER_TEMP/official-012.zip"
          echo '1b3d7fc3743fb44af12c0b50905a65ea68d47c80f0e1e2ddc5e03c08d534b081  '"$RUNNER_TEMP/official-012.zip" | sha256sum -c --status
          site="$RUNNER_TEMP/p08-r111-early-barrier-official-012"
          mkdir -m 0700 "$site"
          unzip -q "$RUNNER_TEMP/official-012.zip" -d "$site"
          php private-p08/tests/compatibility/r111_early_barrier_recovery.php "$site" "$P08_SOURCE_SHA"
          echo R111_EARLY_GATEWAY_CRASH_RECOVERY_OFFICIAL_FULL=PASS
      - name: Purge all private source and disposable site data
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08 "$RUNNER_TEMP/p08-r111-early-barrier-official-012"
          rm -f -- "$RUNNER_TEMP/official-012.zip"
          echo R111_EARLY_PRIVATE_TEST_DATA_PURGED=YES
