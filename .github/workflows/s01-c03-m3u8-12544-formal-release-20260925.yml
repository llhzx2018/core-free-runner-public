name: S01 M3U8 1.25.44 Professional Dropdown R16 Formal Release

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/s01-c03-m3u8-12544-formal-release-20260925.yml'

permissions:
  contents: read
  actions: read

jobs:
  m3u8-release:
    if: github.head_ref == 'task/s01-c03-m3u8-12544-formal-release-20260925'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: llhzx2018/vf-tools-m3u8
      SHA: 7e9eafeb3087b19de7d24ecc3906d37affd2ed66
      VERSION: 1.25.44
      ROUND: R266
      TAG: v1.25.44
      ASSET: vf-tools-m3u8_V1.25.44.zip
      PREVIOUS_TAG: v1.25.43
      PREVIOUS_ASSET: vf-tools-m3u8_V1.25.43.zip
    steps:
      - name: Credential presence
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          test -n "$WRITE_TOKEN"

      - name: Checkout exact M3U8 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 7e9eafeb3087b19de7d24ecc3906d37affd2ed66
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: m3u8
          persist-credentials: false

      - name: Exact source, identity and R16 contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C m3u8 rev-parse HEAD)" = "$SHA"
          test "$(tr -d '\r\n' < m3u8/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.25.44' m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.44'" m3u8/src/vf-tool-m3u8.php
          grep -Fq "VF_TOOL_M3U8_ROUND', 'R266'" m3u8/src/vf-tool-m3u8.php
          grep -Fq 'R16 · Professional Mode flyout visual parity' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'width:min(520px,calc(100vw - 250px))!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'grid-row:1 / span 2!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq 'justify-content:flex-start!important' m3u8/src/admin/ui-v4/admin-s01-shell-header-final-r14.css
          grep -Fq "'主要能力' => ['capabilities','pipelines']" m3u8/src/admin/Presentation/Components/class-admin-components.php
          grep -Fq "'运行与测试' => ['runtime_v6','playground','fixtures']" m3u8/src/admin/Presentation/Components/class-admin-components.php
          grep -Fq "'维护' => ['diagnostics_v6','provider_backup']" m3u8/src/admin/Presentation/Components/class-admin-components.php
          php m3u8/tests/s01-c03-admin-shell-alignment-r1-contract.php
          php m3u8/tests/unit/package-physical-locator-contract.php

      - name: PHP syntax and package security fence
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find m3u8/src -type f -name '*.php' -print0 | sort -z)
          test "$(find m3u8/src -type l | wc -l)" = "0"
          ! find m3u8/src -type f | grep -E '/(?:\.env|wp-config\.php)$'
          ! find m3u8/src -type f | grep -Ei '\.(sql|sqlite|sqlite3|db|log|zip|tar|gz|bak|tmp)$'

      - name: Build deterministic M3U8 package and Runtime Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf stage1 stage2 dist previous
          mkdir -p stage1/vf-tool-m3u8 stage2/vf-tool-m3u8 dist previous
          cp -a m3u8/src/. stage1/vf-tool-m3u8/
          cp -a m3u8/src/. stage2/vf-tool-m3u8/
          rm -f stage1/vf-tool-m3u8/README.md stage1/vf-tool-m3u8/PACKAGE_PROFILE.json
          rm -f stage2/vf-tool-m3u8/README.md stage2/vf-tool-m3u8/PACKAGE_PROFILE.json
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage1/vf-tool-m3u8 -type f -name '*.php' -print0 | sort -z)
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage1/vf-tool-m3u8')
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+b'\0'+sha.encode()+b'\n' for rel,sha in rows)
          Path('/tmp/m3u8_runtime_count').write_text(str(len(rows)))
          Path('/tmp/m3u8_runtime_fp').write_text(hashlib.sha256(canonical).hexdigest())
          PY
          (cd stage1 && zip -X -q -r "../dist/$ASSET" vf-tool-m3u8)
          (cd stage2 && zip -X -q -r "../dist/rebuild-$ASSET" vf-tool-m3u8)
          cmp "dist/$ASSET" "dist/rebuild-$ASSET"
          unzip -tq "dist/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-tool-m3u8"
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.44'
          unzip -p "dist/$ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq "VF_TOOL_M3U8_VERSION', '1.25.44'"
          test "$(cat /tmp/m3u8_runtime_count)" = "564"
          ! unzip -Z1 "dist/$ASSET" | grep -E '(^|/)(\.git|\.github|tests?|docs?|evidence|private|tmp|temp|cache|logs?)(/|$)'
          ! unzip -Z1 "dist/$ASSET" | grep -Ei '\.(sql|sqlite|sqlite3|db|log|tar|gz|bak|tmp)$'
          sha256sum "dist/$ASSET" | awk '{print $1}' > /tmp/m3u8_sha
          stat -c '%s' "dist/$ASSET" > /tmp/m3u8_bytes

      - name: Previous M3U8 release rollback source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh release download "$PREVIOUS_TAG" --repo "$REPO" --pattern "$PREVIOUS_ASSET" --dir previous
          unzip -tq "previous/$PREVIOUS_ASSET" >/dev/null
          unzip -p "previous/$PREVIOUS_ASSET" vf-tool-m3u8/vf-tool-m3u8.php | grep -Fq 'Version: 1.25.43'

      - name: Publish and remote-readback M3U8 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
            test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          else
            cat > /tmp/m3u8-notes.md <<EOF
          # VF Tools M3U8 V1.25.44
          S01-C03 Professional Dropdown Visual Parity R16.
          - Keeps the approved Professional Mode IA: 520px, two columns, seven destinations, three groups and one Chevron.
          - Stacks 主要能力 + 维护 continuously in the left column and keeps 运行与测试 in the right column.
          - Removes the stray Maintenance divider and dead grid gap.
          - Aligns group labels, links, hover/current states and left alignment with OPS/Theme dropdown language.
          - Presentation-only; Provider algorithms, routes, state and schema remain unchanged.
          - Exact source, R16 contract, PHP syntax, deterministic package, security fence and rollback source are verified.
          - Post-production OWNER visual verification remains required.
          - Rollback source: $PREVIOUS_TAG.
          EOF
            gh release create "$TAG" "dist/$ASSET#VF Tools M3U8 $VERSION" --repo "$REPO" --target "$SHA" --title "VF Tools M3U8 V$VERSION" --notes-file /tmp/m3u8-notes.md
            j="$(gh api "repos/$REPO/releases/tags/$TAG")"
          fi
          aid="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.id' <<<"$j")"
          rbytes="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$j")"
          rdigest="$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$j")"
          lbytes="$(cat /tmp/m3u8_bytes)"
          lsha="$(cat /tmp/m3u8_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rbytes" = "$lbytes"
          test "$rdigest" = "sha256:$lsha"
          test "$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SHA"
          rm -rf /tmp/m3u8-readback && mkdir -p /tmp/m3u8-readback
          gh release download "$TAG" --repo "$REPO" --pattern "$ASSET" --dir /tmp/m3u8-readback --clobber
          test "$(sha256sum "/tmp/m3u8-readback/$ASSET" | awk '{print $1}')" = "$lsha"
          cmp "dist/$ASSET" "/tmp/m3u8-readback/$ASSET"
          cat > /tmp/m3u8-release-receipt.json <<EOF
          {"component_id":"S01-C03","version":"$VERSION","source_sha":"$SHA","tag":"$TAG","asset":"$ASSET","asset_id":$aid,"asset_bytes":$lbytes,"asset_sha256":"$lsha","runtime_files":$(cat /tmp/m3u8_runtime_count),"runtime_fingerprint":"$(cat /tmp/m3u8_runtime_fp)","schema_from":"1.3.0","schema_to":"1.3.0","owner_product_acceptance":"POST_PRODUCTION_REQUIRED","remote_readback":"PASS"}
          EOF

      - name: Upload M3U8 release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c03-12544-formal-release-${{ github.run_id }}
          path: /tmp/m3u8-release-receipt.json
          if-no-files-found: error
          retention-days: 30
