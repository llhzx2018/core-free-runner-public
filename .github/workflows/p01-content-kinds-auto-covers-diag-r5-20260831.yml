name: P01 Content Kinds Auto Covers Diagnostic R5
on:
  push:
    branches: [gate/p01-content-kinds-auto-covers-r2-20260831]
    paths: [.github/workflows/p01-content-kinds-auto-covers-diag-r5-20260831.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE: f578ca9306ee0ace4d851ad10a1049e66c7708e2
      BASE: a429d2660c165feae51a46f2144f8de6bda3961f
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-content-covers-r5/evidence
      PORT: '18521'
      ADMIN_PASS: P01ContentCoversPass2026
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {path: runner}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Source fence and fresh runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-content-covers-r5; mkdir -p "$EVID"
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse "$SOURCE^")" = "$BASE"
          python3 - <<'PY'
          import struct,zlib,binascii
          w,h=120,180;rows=[]
          for y in range(h):
              r=bytearray([0])
              for x in range(w): r.extend(((20+x)%256,(110+y//2)%256,125))
              rows.append(bytes(r))
          def c(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
          open('/tmp/p01-content-covers-r5/poster.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(b''.join(rows),9))+c(b'IEND',b''))
          PY
          php -S 127.0.0.1:$PORT -t "$ROOT" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-content-covers-r5.pid
          COOKIE=/tmp/p01-content-covers-r5.cookies
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Cover Diagnostic R5' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          ROOT="$ROOT" IMG=/tmp/p01-content-covers-r5/poster.png EVID="$EVID" php runner/scripts/p01_content_kinds_auto_covers_gate.php | tee "$EVID/php-contract.txt"
      - name: Browser queue diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"; test -n "$CHROME"
          mkdir -p /tmp/p01-content-covers-r5/pw; cd /tmp/p01-content-covers-r5/pw; npm init -y >/dev/null 2>&1; npm install playwright-core@1.55.0 >/dev/null 2>&1
          cat >diag.cjs <<'JS'
          const {chromium}=require('playwright-core'),fs=require('fs');
          const base=`http://127.0.0.1:${process.env.PORT}/`,ids=JSON.parse(fs.readFileSync(process.env.EVID+'/ids.json','utf8'));
          const pixel='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
            const c=await b.newContext({viewport:{width:390,height:844}});
            const login=await c.request.post(base+'api.php?action=login',{data:{password:process.env.ADMIN_PASS}}); const lj=await login.json().catch(()=>({})); if(!login.ok()||!lj.ok) throw Error('login');
            let calls=0; const events=[];
            await c.route('**/resource-cover-refresh.php',async r=>{calls++;events.push({type:'route',postData:r.request().postData()||''});await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,processed:1,results:[{id:Number(ids.hydrate),success:true,cover:{url:pixel}}]})})});
            const p=await c.newPage();
            p.on('console',m=>events.push({type:'console',level:m.type(),text:m.text()}));
            p.on('pageerror',e=>events.push({type:'pageerror',text:String(e&&e.stack||e)}));
            await p.goto(base+'channels.php',{waitUntil:'domcontentloaded'});
            const initial=await p.evaluate(id=>{const n=document.getElementById('vf-workspace-data');let s={},err='';try{s=JSON.parse(n?.textContent||'{}')}catch(e){err=String(e)}const list=Object.values(s.assets||{});const a=list.find(x=>Number(x.id)===Number(id))||null;return{node:!!n,parseError:err,csrfLength:String(s.csrf||'').length,assetCount:list.length,hydrate:a,queue:list.filter(x=>['channels','watch'].includes(String(x.surface||''))&&!x.cover_url).map(x=>({id:Number(x.id),surface:x.surface,title:x.title,cover_url:x.cover_url||''})),rowExists:!!document.querySelector(`[data-asset-row="${id}"]`),retry:localStorage.getItem(`vf-cover-retry:${id}`)||'',scripts:Array.from(document.scripts).map(x=>x.src).filter(Boolean)}},ids.hydrate);
            await p.waitForTimeout(2500);
            const after=await p.evaluate(id=>({imgCount:document.querySelectorAll(`[data-asset-row="${id}"] .vf-asset-icon img`).length,retry:localStorage.getItem(`vf-cover-retry:${id}`)||'',row:document.querySelector(`[data-asset-row="${id}"]`)?.outerHTML||''}),ids.hydrate);
            const autoCalls=calls;
            const manual=await p.evaluate(async()=>{const fd=new FormData();fd.set('csrf','diag');fd.set('ids','[]');const r=await fetch('resource-cover-refresh.php',{method:'POST',body:fd,credentials:'same-origin',headers:{'X-Requested-With':'XMLHttpRequest'}});return{status:r.status,text:await r.text()}}).catch(e=>({error:String(e)}));
            await p.waitForTimeout(200);
            const out={initial,after,autoCalls,totalCalls:calls,manual,events};fs.writeFileSync(process.env.EVID+'/browser-diag.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));await p.screenshot({path:process.env.EVID+'/channels-diag-390.png',fullPage:true});await c.close();await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          CHROME="$CHROME" PORT="$PORT" EVID="$EVID" ADMIN_PASS="$ADMIN_PASS" node diag.cjs | tee "$EVID/browser-diag.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-content-kinds-auto-covers-r5-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-content-covers-r5.pid 2>/dev/null)" 2>/dev/null || true
