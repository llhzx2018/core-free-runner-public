name: P02 V2.5.124 Distribution Verify

on:
  push:
    branches:
      - run/p02-v25124-distribution-verify-20260926
    paths:
      - '.github/workflows/p02-v25124-distribution-verify.yml'

permissions:
  contents: read

jobs:
  distribution-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner

      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: c994fd18380ea0d1aa00e8af601e08c52fc16f6f
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: core-updates

      - name: Validate Update Core and P02 manifest
        working-directory: core-updates
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "c994fd18380ea0d1aa00e8af601e08c52fc16f6f"
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php update-core/php/tests/run.php
          python3 - <<'PY'
          import json
          x=json.load(open('projects/P02.json',encoding='utf-8'))
          assert x['schema_version']=='1.0'
          assert x['project_id']=='P02' and x['component_id']=='APP' and x['enabled'] is True
          assert x['current_version']=='2.5.122'
          assert x['target_version']=='2.5.124'
          assert x['update_type']=='ATOMIC'
          assert '2.5.122' in x['from_versions']
          assert x['schema_from']=='2401' and x['schema_to']=='2401'
          assert x['repository']=='llhzx2018/vf-library'
          assert x['release_tag']=='v2.5.124'
          assert x['release_id']==397288166
          assert x['product_identity']=='913a8e38c9162c3455859e3b3f3db9095c44dd90'
          assert x['asset_name']=='VF_Library_V2.5.124_UPDATE.zip'
          assert x['asset_bytes']==448277
          assert x['asset_sha256']=='4ea859ebb2343a8b12920e086f789af159b27faa5831cbf86720c70cfc5e13ae'
          assert x['backup_required'] is True and x['rollback_supported'] is True
          print('P02_V25124_DISTRIBUTION_MANIFEST_CONTRACT=PASS')
          PY

      - name: Verify exact Formal Release asset mapping
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          RELEASE_JSON="$RUNNER_TEMP/p02-v25124-release.json"
          gh api repos/llhzx2018/vf-library/releases/tags/v2.5.124 > "$RELEASE_JSON"
          python3 - "$RELEASE_JSON" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['id']==397288166
          assert x['tag_name']=='v2.5.124'
          assert x['target_commitish']=='913a8e38c9162c3455859e3b3f3db9095c44dd90'
          a=next(a for a in x['assets'] if a['name']=='VF_Library_V2.5.124_UPDATE.zip')
          assert a['size']==448277
          assert a.get('digest')=='sha256:4ea859ebb2343a8b12920e086f789af159b27faa5831cbf86720c70cfc5e13ae'
          print('P02_V25124_RELEASE_MAPPING=PASS')
          PY
          mkdir -p "$RUNNER_TEMP/p02-v25124-update"
          gh release download v2.5.124 --repo llhzx2018/vf-library --pattern VF_Library_V2.5.124_UPDATE.zip --dir "$RUNNER_TEMP/p02-v25124-update"
          FILE="$RUNNER_TEMP/p02-v25124-update/VF_Library_V2.5.124_UPDATE.zip"
          test "$(stat -c%s "$FILE")" = "448277"
          test "$(sha256sum "$FILE" | awk '{print $1}')" = "4ea859ebb2343a8b12920e086f789af159b27faa5831cbf86720c70cfc5e13ae"
          echo P02_V25124_DISTRIBUTION_REMOTE_ASSET_READBACK=PASS

      - name: Distribution closure marker
        run: |
          cat <<'EOF'
          FORMAL_RELEASE=PASS
          DISTRIBUTION_MANIFEST=PASS
          EXACT_ASSET_MAPPING=PASS
          REMOTE_ASSET_READBACK=PASS
          PRODUCTION=NOT_EXECUTED
          P02_V25124_DISTRIBUTION_GATE=PASS
          EOF
