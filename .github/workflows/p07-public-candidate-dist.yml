name: P07 Public Candidate Distribution

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-triggers/p07-rc2-public-dist.json'

permissions:
  contents: write

jobs:
  build-public-rc2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact private P07 RC2 candidate
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          SRC_SHA='06c9434a40f83ea0d5bb84231ea274623a9ef365'
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}" \
            -o "${TMP}/source.tar.gz"
          mkdir -p "${TMP}/src"
          tar -xzf "${TMP}/source.tar.gz" -C "${TMP}/src"
          SRC_DIR="$(find "${TMP}/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -f "${SRC_DIR}/bin/vfops"
          test -f "${SRC_DIR}/bin/vfops-user"
          test -f "${SRC_DIR}/tests/test_user_entry.py"
          test -f "${SRC_DIR}/tests/test_user_remote_backup.py"
          test -f "${SRC_DIR}/VERSION"
          test "$(cat "${SRC_DIR}/VERSION")" = '0.1.0'

          rm -rf .p07-source
          mkdir -p .p07-source
          cp -a "${SRC_DIR}/." .p07-source/

          rm -rf dist/p07/0.1.0-rc2
          mkdir -p dist/p07/0.1.0-rc2/vf-server-ops
          cp -a "${SRC_DIR}/bin" dist/p07/0.1.0-rc2/vf-server-ops/
          cp -a "${SRC_DIR}/lib" dist/p07/0.1.0-rc2/vf-server-ops/
          cp -a "${SRC_DIR}/config" dist/p07/0.1.0-rc2/vf-server-ops/
          cp -a "${SRC_DIR}/VERSION" dist/p07/0.1.0-rc2/vf-server-ops/
          chmod +x dist/p07/0.1.0-rc2/vf-server-ops/bin/vfops dist/p07/0.1.0-rc2/vf-server-ops/bin/vfops-user
          printf 'source_repository=llhzx2018/vf-server-ops\nsource_commit=%s\nversion=0.1.0\nchannel=RC2\n' "$SRC_SHA" > dist/p07/0.1.0-rc2/SOURCE_IDENTITY.txt

      - name: Syntax and module checks
        run: |
          set -euo pipefail
          cd .p07-source
          python3 -m py_compile lib/*.py
          bash -n bin/vfops
          bash -n bin/vfops-user
          rm -rf lib/__pycache__

      - name: Core regression suite
        run: |
          set -euo pipefail
          cd .p07-source
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Beginner user-path regression suite
        run: |
          set -euo pipefail
          cd .p07-source
          python3 -m unittest -v tests.test_user_entry tests.test_user_remote_backup

      - name: Beginner UX contract guard
        run: |
          set -euo pipefail
          cd .p07-source
          grep -F '1. 查看这台服务器' bin/vfops-user
          grep -F '2. 备份网站' bin/vfops-user
          grep -F '3. 迁移网站到新服务器' bin/vfops-user
          grep -F '4. 恢复备份' bin/vfops-user
          grep -F '连接状态：%s' bin/vfops-user
          grep -F '远程副本：未设置（本地备份不受影响）' bin/vfops-user
          grep -F '当前网站流量：仍在旧服务器' bin/vfops-user
          ! grep -F 'GitHub Token' bin/vfops-user
          ! grep -F '网站域名：' bin/vfops-user

      - name: Installed-entry regression test
        run: |
          set -euo pipefail
          SRC="$PWD/dist/p07/0.1.0-rc2/vf-server-ops"
          sudo rm -rf /opt/vf-server-ops
          sudo cp -a "$SRC" /opt/vf-server-ops
          sudo chmod +x /opt/vf-server-ops/bin/vfops /opt/vf-server-ops/bin/vfops-user
          sudo ln -sfn /opt/vf-server-ops/bin/vfops-user /usr/local/bin/vfops

          test "$(vfops --version)" = 'VF Server Ops 0.1.0 RC2'
          vfops inventory --compact > /tmp/p07-inventory.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/p07-inventory.json'))
          assert p['schema'] == 'vf-server-ops.inventory.v1'
          PY
          printf '1\n\n0\n' | vfops > /tmp/p07-user-menu.txt
          grep -F '1. 查看这台服务器' /tmp/p07-user-menu.txt
          grep -F '网站数量：' /tmp/p07-user-menu.txt
          ! grep -F 'VF Server Ops UNKNOWN' /tmp/p07-user-menu.txt
          ! grep -F '/usr/local/lib/inventory.py' /tmp/p07-user-menu.txt

      - name: Build public install package
        run: |
          set -euo pipefail
          cd dist/p07/0.1.0-rc2
          tar -czf P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz vf-server-ops
          sha256sum P07_VF_SERVER_OPS_0.1.0-rc2.tar.gz > SHA256SUMS.txt

      - name: Publish exact public candidate bytes
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add dist/p07/0.1.0-rc2
          if git diff --cached --quiet; then
            echo 'Public RC2 distribution already current.'
            exit 0
          fi
          git commit -m 'dist(P07): publish refined 0.1.0-rc2 candidate'
          git push origin HEAD:main
