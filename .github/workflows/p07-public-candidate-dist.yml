name: P07 Public Candidate Distribution

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-triggers/p07-rc1-public-dist.json'

permissions:
  contents: write

jobs:
  build-public-rc1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact private P07 candidate
        env:
          VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VF_PRIVATE_READ_TOKEN:-}" || { echo 'VF_PRIVATE_READ_TOKEN is not configured'; exit 20; }
          SRC_SHA='c841622291ebc06c5811c8bb50539947b2744718'
          TMP="$(mktemp -d)"
          curl -fL \
            -H "Authorization: Bearer ${VF_PRIVATE_READ_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/llhzx2018/vf-server-ops/tarball/${SRC_SHA}" \
            -o "${TMP}/source.tar.gz"
          mkdir -p "${TMP}/src"
          tar -xzf "${TMP}/source.tar.gz" -C "${TMP}/src"
          SRC_DIR="$(find "${TMP}/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -x "${SRC_DIR}/bin/vfops"
          test -f "${SRC_DIR}/VERSION"
          test "$(cat "${SRC_DIR}/VERSION")" = '0.1.0'

          rm -rf dist/p07/0.1.0-rc1
          mkdir -p dist/p07/0.1.0-rc1/vf-server-ops
          cp -a "${SRC_DIR}/bin" dist/p07/0.1.0-rc1/vf-server-ops/
          cp -a "${SRC_DIR}/lib" dist/p07/0.1.0-rc1/vf-server-ops/
          cp -a "${SRC_DIR}/config" dist/p07/0.1.0-rc1/vf-server-ops/
          cp -a "${SRC_DIR}/VERSION" dist/p07/0.1.0-rc1/vf-server-ops/
          printf 'source_repository=llhzx2018/vf-server-ops\nsource_commit=%s\nversion=0.1.0\nchannel=RC1\n' "$SRC_SHA" > dist/p07/0.1.0-rc1/SOURCE_IDENTITY.txt

      - name: Build public install package
        run: |
          set -euo pipefail
          cd dist/p07/0.1.0-rc1
          tar -czf P07_VF_SERVER_OPS_0.1.0-rc1.tar.gz vf-server-ops
          sha256sum P07_VF_SERVER_OPS_0.1.0-rc1.tar.gz > SHA256SUMS.txt
          python3 -m py_compile vf-server-ops/lib/*.py
          bash -n vf-server-ops/bin/vfops
          rm -rf vf-server-ops/lib/__pycache__

      - name: Publish exact public candidate bytes
        run: |
          set -euo pipefail
          git config user.name 'VictorForge'
          git config user.email 'llhzx2018@gmail.com'
          git add dist/p07/0.1.0-rc1
          if git diff --cached --quiet; then
            echo 'Public RC1 distribution already current.'
            exit 0
          fi
          git commit -m 'dist(P07): publish exact 0.1.0-rc1 candidate'
          git push origin HEAD:main
