name: P05 V1.2.1 Final Exact Source Gate
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p05-v121-final-exact-source-42def53.yml']
permissions:
  contents: read
jobs:
  p05-v121-final-exact-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v121-final-exact-source-42def53-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: vfseo_test, POSTGRES_USER: vfseo, POSTGRES_PASSWORD: vfseo-test-password }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      P05_EXACT_SOURCE: 42def535d9ec49052e84048c5995293c3ad2d502
      P05_BASE_MAIN: 666c5b4d9371858ff8956d311043a18442e192d1
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
      APP_ENV: test
      VF_DATABASE_PROVIDER: sqlite
      VF_SECURE_COOKIES: 'false'
      VF_REQUIRE_HTTPS: 'false'
      VF_ADMIN_USERNAME: admin
      VF_ADMIN_PASSWORD: php-ci-portable-password-123
    steps:
      - name: Checkout exact private P05 v1.2.1 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_EXACT_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact v1.2.1 source and five-file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          git cat-file -e "$P05_BASE_MAIN^{commit}"
          git diff --check "$P05_BASE_MAIN" "$P05_EXACT_SOURCE"
          git diff --name-only "$P05_BASE_MAIN" "$P05_EXACT_SOURCE" | sort > /tmp/changed
          printf '%s\n' \
            VERSION \
            VF_PROJECT.json \
            docs/authority/RELEASE_V1.2.1_CANDIDATE.md \
            package.json \
            src/client/ProductApp.tsx | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          test "$(cat VERSION)" = '1.2.1'
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.1'||v.version!=='1.2.1'||v.target_version!=='1.2.1'||v.working_version!=='1.2.1') process.exit(1);
          if(v.production_version!=='1.1.12') process.exit(1);
          if(!String(v.release_authorization||'').includes('PENDING_OWNER_AUTHORIZATION_V1.2.1')) process.exit(1);
          NODE
          echo 'P05_V121_EXACT_SOURCE_BINDING=PASS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 24, cache: npm }
      - name: Install exact dependencies
        run: npm ci
      - name: Full Engineering regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run migrate
          npm run verify:schema
          npm run test
          npm run build
          echo 'P05_V121_ENGINEERING=PASS'
      - name: v1.2.1 hotfix and cumulative Product truth
        shell: bash
        run: |
          set -Eeuo pipefail
          node --import tsx --test \
            tests/unit/product-simple-update-ux-truth.test.ts \
            tests/unit/product-empty-portfolio-real-site-bootstrap-truth.test.ts \
            tests/unit/demo-dataset.test.ts \
            tests/unit/product-site-load-race-truth.test.ts \
            tests/unit/product-login-workspace-read-truth.test.ts \
            tests/unit/product-portfolio-top-opportunity-routing-truth.test.ts \
            tests/unit/product-data-source-capability-truth.test.ts \
            tests/unit/product-search-query-evidence-routing-truth.test.ts \
            tests/unit/product-keyword-page-drilldown-truth.test.ts \
            tests/unit/product-aeo-blocker-page-evidence-truth.test.ts \
            tests/unit/product-settings-truth.test.ts
          node --import tsx --test tests/contract/backend-online-update-v2.test.ts
          npm run test:php-product-parity
          MAIN_RECORD="$(find dist/client/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%s %p\n' | sort -nr | head -n1)"
          test -n "$MAIN_RECORD"
          MAIN_BYTES="${MAIN_RECORD%% *}"
          test "$MAIN_BYTES" -lt 500000
          echo "P05_CLASSIC_MAIN_CHUNK_BYTES=$MAIN_BYTES"
          echo 'P05_V121_PRODUCT_TRUTH=PASS'
      - name: PHP CloudPanel and browser staging regression
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          npm run build:php-release
          npm run php:release:gate
          bash php/tests/cloudpanel-root-smoke.sh build/vf-seo-php-release
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT=build/vf-seo-php-release python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT=build/vf-seo-php-release bash php/tests/cloudpanel-fpm-real-install-smoke.sh
          echo 'P05_V121_PHP_BROWSER_STAGING=PASS'
      - name: Source dependency and security gates
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate
          echo 'P05_V121_SOURCE_SECURITY=PASS'
      - name: Seal v1.2.1 readiness without publication
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_EXACT_SOURCE"
          test "$(cat VERSION)" = '1.2.1'
          echo 'P05_V121_FINAL_EXACT_SOURCE_GATE=PASS'
          echo "P05_EXACT_SOURCE=$P05_EXACT_SOURCE"
          echo 'P05_RELEASE_AUTHORIZATION=PENDING_OWNER_AUTHORIZATION_V1.2.1'
          echo 'P05_RELEASE_WRITE=0'
          echo 'P05_TAG_WRITE=0'
          echo 'P05_CORE_UPDATES_WRITE=0'
          echo 'P05_PRODUCTION_WRITE=0'
