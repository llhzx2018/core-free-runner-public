name: P01 V2.31.0 Runtime Version Bind
on:
  push:
    branches: [task/p01-v2310-final-candidate-gate-20260829]
    paths: [.github/workflows/p01-v2310-runtime-version-bind-20260829.yml]
permissions:
  contents: read
jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: release/p01-v2.31.0-candidate-20260829
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Exact candidate runtime version bind
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          test "$(git rev-parse HEAD)" = be006e19bab6e51e5d31f3db69a44b1a159f73ed
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/bootstrap.php')
          s=p.read_text()
          old="define('VF_VERSION', '2.30.0');"
          new="define('VF_VERSION', '2.31.0');"
          assert s.count(old)==1, f'expected one old VF_VERSION, got {s.count(old)}'
          assert new not in s
          p.write_text(s.replace(old,new,1))
          PY
          test "$(git diff --name-only)" = src/app/bootstrap.php
          grep -Fx "define('VF_VERSION', '2.31.0');" src/app/bootstrap.php
          php -l src/app/bootstrap.php >/dev/null
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/bootstrap.php
          git commit -m 'chore(P01): bind VF_VERSION to V2.31.0 candidate'
          git push origin HEAD:release/p01-v2.31.0-candidate-20260829
