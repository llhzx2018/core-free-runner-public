name: P01 V2.27.0 Release Asset Closure
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-publication-20260828.yml']
permissions:
  actions: read
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-start
  TAG: v2.27.0
  RELEASE_SOURCE: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
  ARTIFACT_NAME: p01-v227-formal-artifacts-8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
  UPDATE_SHA: bec0e6d60a5d1a7ac537ee30f50fd0889fb812303d84871445fd26d06a363002
  SELFTEST_SHA: f3c52780738de44f42d103a8f2b6710b0635af334f9601b0ac5679699e3f9bd6
  REPAIR_SHA: 698885d3092f6140a802d0aa9e948f76a30955c2e98f75e1b4a6dce76dff60a1
jobs:
  close-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Guard immutable release identity
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          test "$(gh api repos/$TARGET_REPO/releases/tags/$TAG --jq '.target_commitish')" = "$RELEASE_SOURCE"
          for f in VF-Start-V2.27.0-UPDATE.zip atomic-self-test.json repair-v2.27.0.php; do
            if gh api repos/$TARGET_REPO/releases/tags/$TAG --jq '.assets[].name' | grep -Fxq "$f"; then echo "UNEXPECTED_EXISTING_ASSET=$f"; exit 31; fi
          done
          echo P01_V227_RELEASE_IDENTITY_GUARD=PASS
      - name: Download already-proven Formal Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v227-formal
          gh run download 33180166710 -R llhzx2018/core-free-runner-public -n "$ARTIFACT_NAME" -D /tmp/p01-v227-formal
          test "$(sha256sum /tmp/p01-v227-formal/VF-Start-V2.27.0-UPDATE.zip | awk '{print $1}')" = "$UPDATE_SHA"
          test "$(sha256sum /tmp/p01-v227-formal/atomic-self-test.json | awk '{print $1}')" = "$SELFTEST_SHA"
          test "$(sha256sum /tmp/p01-v227-formal/repair-v2.27.0.php | awk '{print $1}')" = "$REPAIR_SHA"
          echo P01_V227_MISSING_ASSETS_EXACT=PASS
      - name: Upload only missing proven assets
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release upload "$TAG" -R "$TARGET_REPO" \
            /tmp/p01-v227-formal/VF-Start-V2.27.0-UPDATE.zip \
            /tmp/p01-v227-formal/atomic-self-test.json \
            /tmp/p01-v227-formal/repair-v2.27.0.php
          echo P01_V227_ASSET_UPLOAD=PASS
      - name: Validate eight-file contract remotely
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON=$(gh api repos/$TARGET_REPO/releases/tags/$TAG)
          test "$(jq '.assets | length' <<<"$JSON")" = 8
          for f in P01-V2.27.0-ARTIFACT-GATE.json P01-V2.27.0-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.27.0-FULL.zip VF-Start-V2.27.0-UPDATE.zip VF_Start_V2.27.0_UPDATE.zip atomic-self-test.json repair-v2.27.0.php; do
            jq -e --arg f "$f" '.assets[] | select(.name==$f and .state=="uploaded")' <<<"$JSON" >/dev/null
          done
          test "$(jq -r '.assets[] | select(.name=="VF-Start-V2.27.0-UPDATE.zip") | .digest' <<<"$JSON")" = "sha256:$UPDATE_SHA"
          test "$(jq -r '.assets[] | select(.name=="atomic-self-test.json") | .digest' <<<"$JSON")" = "sha256:$SELFTEST_SHA"
          test "$(jq -r '.assets[] | select(.name=="repair-v2.27.0.php") | .digest' <<<"$JSON")" = "sha256:$REPAIR_SHA"
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          echo P01_V227_EIGHT_FILE_RELEASE_CONTRACT=PASS
