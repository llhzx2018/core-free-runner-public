name: P01 V2.27.0 Publication
on:
  push:
    branches: [task/p01-v222-multi-surface-gate-20260828]
    paths: ['.github/workflows/p01-v227-publication-20260828.yml']
permissions:
  actions: read
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-start
  TAG: v2.27.0
  RELEASE_SOURCE: 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
  RELEASE_TREE: 6e9fb22d146b6b1e9ab276100331043c8ec647aa
  MAIN_SHA: 3bf8fe79b9901c70fe45185efd0f36cf2df3077e
  ARTIFACT_ID: '9689352031'
  ARTIFACT_NAME: p01-v227-formal-artifacts-8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3
  EXPECT_FULL_SHA: d2f0ede38c19a9ab9e736c00c0329e6c6457e75ff8629d54d5cf47a95c69b4ac
  EXPECT_UPDATE_SHA: bec0e6d60a5d1a7ac537ee30f50fd0889fb812303d84871445fd26d06a363002
  EXPECT_UPDATE_BYTES: '1246236'
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Guard exact remote truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/$TARGET_REPO/branches/main --jq '.commit.sha')" = "$MAIN_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$MAIN_SHA --jq '.tree.sha')" = "$RELEASE_TREE"
          test "$(gh api repos/$TARGET_REPO/git/commits/$RELEASE_SOURCE --jq '.tree.sha')" = "$RELEASE_TREE"
          test "$(gh api repos/$TARGET_REPO/contents/VERSION?ref=$RELEASE_SOURCE --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n')" = '2.27.0'
          if gh api repos/$TARGET_REPO/git/ref/tags/$TAG >/dev/null 2>&1; then echo TAG_ALREADY_EXISTS; exit 21; fi
          if gh api repos/$TARGET_REPO/releases/tags/$TAG >/dev/null 2>&1; then echo RELEASE_ALREADY_EXISTS; exit 22; fi
          echo P01_V227_PUBLICATION_GUARD=PASS
      - name: Download already-proven Formal Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v227-formal
          gh run download 33180166710 -R llhzx2018/core-free-runner-public -n "$ARTIFACT_NAME" -D /tmp/p01-v227-formal
          test -f /tmp/p01-v227-formal/P01-V2.27.0-ARTIFACT-GATE.json
          test -f /tmp/p01-v227-formal/P01-V2.27.0-FORMAL-METADATA.json
          test -f /tmp/p01-v227-formal/SHA256SUMS.txt
          test -f /tmp/p01-v227-formal/VF-Start-V2.27.0-FULL.zip
          test -f /tmp/p01-v227-formal/VF_Start_V2.27.0_UPDATE.zip
          test "$(sha256sum /tmp/p01-v227-formal/VF-Start-V2.27.0-FULL.zip | awk '{print $1}')" = "$EXPECT_FULL_SHA"
          test "$(sha256sum /tmp/p01-v227-formal/VF_Start_V2.27.0_UPDATE.zip | awk '{print $1}')" = "$EXPECT_UPDATE_SHA"
          test "$(stat -c %s /tmp/p01-v227-formal/VF_Start_V2.27.0_UPDATE.zip)" = "$EXPECT_UPDATE_BYTES"
          jq -e --arg c "$RELEASE_SOURCE" --arg t "$RELEASE_TREE" --arg h "$EXPECT_UPDATE_SHA" '.candidate==$c and .candidate_tree==$t and .asset_sha256==$h and .asset_bytes==1246236 and .status=="PASS"' /tmp/p01-v227-formal/P01-V2.27.0-FORMAL-METADATA.json >/dev/null
          echo P01_V227_ARTIFACT_REUSE=PASS
      - name: Create exact Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "$TAG" \
            -R "$TARGET_REPO" \
            --target "$RELEASE_SOURCE" \
            --title 'VF Start V2.27.0' \
            --notes 'V2.27.0 workspace productization formal release. Same-shell Add Modal, Detail/Edit Drawer, Favorite/Open, multi-select bulk operations, filtered counts, pagination, sort/filter/view/density controls, Channels creator/source workflow, Watch media workflow, and focused Inbox classification. Schema remains 2026082801. Formal Release Source 8c3d18e1243d4b6ddc40bc7922746131a5d0d9c3; Release Exact Source Gate 33180022275 PASS; Formal Artifact Gate 33180166710 PASS. Production server is not modified by this publication.' \
            /tmp/p01-v227-formal/P01-V2.27.0-ARTIFACT-GATE.json \
            /tmp/p01-v227-formal/P01-V2.27.0-FORMAL-METADATA.json \
            /tmp/p01-v227-formal/SHA256SUMS.txt \
            /tmp/p01-v227-formal/VF-Start-V2.27.0-FULL.zip \
            /tmp/p01-v227-formal/VF_Start_V2.27.0_UPDATE.zip
          echo P01_V227_RELEASE_CREATE=PASS
      - name: Remote release validation
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          JSON=$(gh api repos/$TARGET_REPO/releases/tags/$TAG)
          test "$(jq -r '.tag_name' <<<"$JSON")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$JSON")" = "$RELEASE_SOURCE"
          test "$(jq -r '.draft' <<<"$JSON")" = false
          test "$(jq -r '.prerelease' <<<"$JSON")" = false
          test "$(jq '.assets | length' <<<"$JSON")" = 5
          for f in P01-V2.27.0-ARTIFACT-GATE.json P01-V2.27.0-FORMAL-METADATA.json SHA256SUMS.txt VF-Start-V2.27.0-FULL.zip VF_Start_V2.27.0_UPDATE.zip; do jq -e --arg f "$f" '.assets[] | select(.name==$f and .state=="uploaded")' <<<"$JSON" >/dev/null; done
          test "$(jq -r '.assets[] | select(.name=="VF-Start-V2.27.0-FULL.zip") | .digest' <<<"$JSON")" = "sha256:$EXPECT_FULL_SHA"
          test "$(jq -r '.assets[] | select(.name=="VF_Start_V2.27.0_UPDATE.zip") | .digest' <<<"$JSON")" = "sha256:$EXPECT_UPDATE_SHA"
          test "$(jq -r '.assets[] | select(.name=="VF_Start_V2.27.0_UPDATE.zip") | .size' <<<"$JSON")" = "$EXPECT_UPDATE_BYTES"
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/$TAG --jq '.object.sha')" = "$RELEASE_SOURCE"
          echo P01_V227_PUBLICATION=PASS