name: S01 Ops 1.21.873 Formal Release

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPS_REPO: llhzx2018/vf-tools-ops
      OPS_SHA: 8d63c75773ea2dd9c096356dbb4791d0cfbc8de9
      BASE_SHA: a986bb85736e044c2ef45251614026712c069c69
      VERSION: 1.21.873
      PREVIOUS_TAG: v1.21.872
      PREVIOUS_ASSET: vf-tools-ops_V1.21.872.zip
      TAG: v1.21.873
      ASSET: vf-tools-ops_V1.21.873.zip
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Checkout exact merged Ops main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 8d63c75773ea2dd9c096356dbb4791d0cfbc8de9
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Verify release identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(git -C ops rev-parse HEAD)" = "$OPS_SHA"
          test "$(cat ops/VERSION)" = "$VERSION"
          grep -Fq 'Version: 1.21.873' ops/vf-ops.php
          grep -Fq "VF_OPS_VERSION', '1.21.873" ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R5-PUBLISH-SYSTEM" ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$OPS_SHA" | sort)"
          expected="$(printf '%s\n'             VERSION             vf-ops.php             includes/admin-v13/tab-controller.php             includes/admin-v13/views/publish_zip_v6.php             includes/admin-v13/views/system_site_release_v6.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             assets/css/current/admin-s01-v6-publish-system-r5.css             tests/s01-v6-r5-publish-system-contract.php | sort)"
          test "$actual" = "$expected"
          if gh release view "$TAG" --repo "$OPS_REPO" >/dev/null 2>&1; then
            echo "release exists" >&2; exit 1
          fi
          if gh api "repos/$OPS_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag exists" >&2; exit 1
          fi
          echo OPS_121873_RELEASE_IDENTITY=PASS

      - name: Re-run R5 contract and changed PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          php ops/tests/s01-v6-r5-publish-system-contract.php
          for f in             ops/vf-ops.php             ops/includes/admin-v13/tab-controller.php             ops/includes/admin-v13/views/publish_zip_v6.php             ops/includes/admin-v13/views/system_site_release_v6.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/tests/s01-v6-r5-publish-system-contract.php; do
            php -l "$f" >/dev/null
          done
          echo OPS_121873_RELEASE_CONTRACTS=PASS

      - name: Reconstruct from sealed 1.21.872 Runtime Authority
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/ops-prev stage-ops dist-ops
          mkdir -p /tmp/ops-prev stage-ops dist-ops
          gh release download "$PREVIOUS_TAG" --repo "$OPS_REPO" --pattern "$PREVIOUS_ASSET" --dir /tmp/ops-prev --clobber
          unzip -tq "/tmp/ops-prev/$PREVIOUS_ASSET" >/dev/null
          unzip -q "/tmp/ops-prev/$PREVIOUS_ASSET" -d stage-ops
          test -f stage-ops/vf-ops/vf-ops.php
          grep -Fq 'Version: 1.21.872' stage-ops/vf-ops/vf-ops.php

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage-ops/vf-ops')
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+bytes([0])+sha.encode()+bytes([10]) for rel,sha in rows)
          fp=hashlib.sha256(canonical).hexdigest()
          print('BASELINE_FILES='+str(len(rows)))
          print('BASELINE_FINGERPRINT='+fp)
          if len(rows)!=950: raise SystemExit('sealed 1.21.872 runtime file count mismatch')
          if fp!='5052cdca708104b212e56f153f05175c8a02684526031a1c2fb6df7b2b57704a':
              raise SystemExit('sealed 1.21.872 runtime fingerprint mismatch')
          PY

          # Overlay only the changed Runtime Authority paths. Test/docs remain excluded.
          install -m 0644 ops/vf-ops.php stage-ops/vf-ops/vf-ops.php
          install -D -m 0644 ops/includes/admin-v13/tab-controller.php stage-ops/vf-ops/includes/admin-v13/tab-controller.php
          install -D -m 0644 ops/includes/admin-v13/views/publish_zip_v6.php stage-ops/vf-ops/includes/admin-v13/views/publish_zip_v6.php
          install -D -m 0644 ops/includes/admin-v13/views/system_site_release_v6.php stage-ops/vf-ops/includes/admin-v13/views/system_site_release_v6.php
          install -D -m 0644 ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php stage-ops/vf-ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          install -D -m 0644 ops/assets/css/current/admin-s01-v6-publish-system-r5.css stage-ops/vf-ops/assets/css/current/admin-s01-v6-publish-system-r5.css
          if test -f stage-ops/vf-ops/VERSION; then install -m 0644 ops/VERSION stage-ops/vf-ops/VERSION; fi

          ! find stage-ops/vf-ops -type l -print -quit | grep -q .
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find stage-ops/vf-ops -type f -name '*.php' -print0 | sort -z)

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('stage-ops/vf-ops')
          rows=[]
          for p in sorted((x for x in root.rglob('*') if x.is_file()), key=lambda x:x.relative_to(root).as_posix()):
              rel=p.relative_to(root).as_posix()
              rows.append((rel,hashlib.sha256(p.read_bytes()).hexdigest()))
          canonical=b''.join(rel.encode()+bytes([0])+sha.encode()+bytes([10]) for rel,sha in rows)
          fp=hashlib.sha256(canonical).hexdigest()
          Path('/tmp/ops_count').write_text(str(len(rows)))
          Path('/tmp/ops_fp').write_text(fp)
          print('OPS_RUNTIME_FILES='+str(len(rows)))
          print('OPS_RUNTIME_FINGERPRINT='+fp)
          if len(rows)!=953: raise SystemExit('expected 953 runtime files after three new runtime assets')
          PY

          (cd stage-ops && zip -X -q -r "../dist-ops/$ASSET" vf-ops)
          unzip -tq "dist-ops/$ASSET" >/dev/null
          test "$(unzip -Z1 "dist-ops/$ASSET" | cut -d/ -f1 | sort -u)" = "vf-ops"
          unzip -p "dist-ops/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.873'
          unzip -Z1 "dist-ops/$ASSET" | grep -Fxq 'vf-ops/includes/admin-v13/views/publish_zip_v6.php'
          unzip -Z1 "dist-ops/$ASSET" | grep -Fxq 'vf-ops/includes/admin-v13/views/system_site_release_v6.php'
          unzip -Z1 "dist-ops/$ASSET" | grep -Fxq 'vf-ops/assets/css/current/admin-s01-v6-publish-system-r5.css'
          sha256sum "dist-ops/$ASSET" | tee /tmp/ops_sha
          stat -c '%s' "dist-ops/$ASSET" | tee /tmp/ops_bytes
          echo OPS_121873_RUNTIME_PACKAGE=PASS

      - name: Create formal release
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/notes.md <<EOF
          S01-C02 1.21.873 Mature Admin V6 R5 Publish + System.
          Exact merged main source: $OPS_SHA

          Migrates the Publish landing and System environment landing to dedicated Mature Admin V6 views while preserving the existing six-domain shell, ZIP chunk/job runtime, release preparation/export owners, site-release save/test owners, existing update transport and all business/data services.

          Publish now prioritizes the current release task, blocking decisions and Cloudflare candidate package, with complete gates/history moved to disclosures. System now prioritizes production-domain configuration and domain-chain state, with component/integration/recovery/search workspaces clearly separated and professional evidence collapsed by default.

          Runtime files: $(cat /tmp/ops_count)
          Runtime fingerprint SHA256: $(cat /tmp/ops_fp)
          Product/Git/Release only. Production installation is not claimed.
          EOF
          gh release create "$TAG" "dist-ops/$ASSET#VF Tools Ops $VERSION Runtime Authority ZIP"             --repo "$OPS_REPO" --target "$OPS_SHA" --title "VF Tools Ops V$VERSION" --notes-file /tmp/notes.md
          echo OPS_121873_RELEASE_CREATE=PASS

      - name: Independent release readback
        shell: bash
        run: |
          set -Eeuo pipefail
          j="$(gh api "repos/$OPS_REPO/releases/tags/$TAG")"
          aid="$(jq -r --arg n "$ASSET" '.assets[] | select(.name==$n) | .id' <<<"$j")"
          rb="$(jq -r --arg n "$ASSET" '.assets[] | select(.name==$n) | .size' <<<"$j")"
          lb="$(cat /tmp/ops_bytes)"
          ls="$(awk '{print $1}' /tmp/ops_sha)"
          test -n "$aid" && test "$aid" != null
          test "$rb" = "$lb"
          test "$(jq -r '.object.sha' <<<"$(gh api "repos/$OPS_REPO/git/ref/tags/$TAG")")" = "$OPS_SHA"
          rm -rf /tmp/readback && mkdir -p /tmp/readback
          gh release download "$TAG" --repo "$OPS_REPO" --pattern "$ASSET" --dir /tmp/readback --clobber
          test "$(sha256sum "/tmp/readback/$ASSET" | awk '{print $1}')" = "$ls"
          unzip -tq "/tmp/readback/$ASSET" >/dev/null
          unzip -p "/tmp/readback/$ASSET" vf-ops/vf-ops.php | grep -Fq 'Version: 1.21.873'
          cat > /tmp/ops-release-receipt.txt <<EOF
          COMPONENT=S01-C02
          VERSION=$VERSION
          SOURCE_SHA=$OPS_SHA
          TAG=$TAG
          ASSET=$ASSET
          ASSET_ID=$aid
          BYTES=$lb
          SHA256=$ls
          RUNTIME_FILES=$(cat /tmp/ops_count)
          RUNTIME_FINGERPRINT=$(cat /tmp/ops_fp)
          PUBLISHED_AT=$(jq -r '.published_at' <<<"$j")
          EOF
          cat /tmp/ops-release-receipt.txt
          echo OPS_121873_FORMAL_RELEASE=PASS

      - name: Upload release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s01-c02-121873-release-${{ github.run_id }}
          path: /tmp/ops-release-receipt.txt
          if-no-files-found: error
          retention-days: 14
