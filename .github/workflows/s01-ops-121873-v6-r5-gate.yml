name: S01 Ops 1.21.873 V6 R5 Gate

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: 5cc4385bb24c67157bc791880c5affa889b1a021
      BASE_SHA: a986bb85736e044c2ef45251614026712c069c69
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Checkout exact Ops candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 5cc4385bb24c67157bc791880c5affa889b1a021
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          path: ops
          persist-credentials: false

      - name: Exact identity and scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(cat ops/VERSION)" = "1.21.873"
          grep -Fq 'Version: 1.21.873' ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R5-PUBLISH-SYSTEM" ops/vf-ops.php
          actual="$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | sort)"
          expected="$(printf '%s\n'             VERSION             vf-ops.php             includes/admin-v13/tab-controller.php             includes/admin-v13/views/publish_zip_v6.php             includes/admin-v13/views/system_site_release_v6.php             includes/views/admin-style-helpers/admin-s01-uiux-polish.php             assets/css/current/admin-s01-v6-publish-system-r5.css             tests/s01-v6-r5-publish-system-contract.php | sort)"
          test "$actual" = "$expected"
          echo OPS_121873_SCOPE=PASS

      - name: Mature Admin current and compatibility contracts
        shell: bash
        run: |
          set -Eeuo pipefail

          # Current R5 contract is version-aware and runs unchanged.
          php ops/tests/s01-v6-r5-publish-system-contract.php

          # R4.1 remains structurally current; run its historical contract with
          # only its frozen release identity restored temporarily.
          cp ops/VERSION /tmp/ops-version
          cp ops/vf-ops.php /tmp/ops-plugin
          printf '1.21.872\n' > ops/VERSION
          sed -i \
            -e 's/Version: 1.21.873/Version: 1.21.872/' \
            -e "s/VF_OPS_VERSION', '1.21.873/VF_OPS_VERSION', '1.21.872/" \
            -e "s/S01-MATURE-ADMIN-V6-R5-PUBLISH-SYSTEM/S01-MATURE-ADMIN-V6-R41-CONTENT-SEO-CLOSURE/" \
            ops/vf-ops.php
          php ops/tests/s01-v6-r41-content-seo-closure-contract.php
          mv /tmp/ops-version ops/VERSION
          mv /tmp/ops-plugin ops/vf-ops.php

          # R1/R3 test files freeze old point-release identities and obsolete
          # loader clauses, so retain their enduring structural gates explicitly.
          grep -Fq "['工作台','工具','内容与 SEO','质量','发布','系统']" ops/includes/s01/admin-shell-domain-contract.php
          grep -Fq 'class="vf-v6-shell-header"' ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          grep -Fq 'vf_ops_s01_admin_domain_contract_v1' ops/includes/views/admin-shell-tabs-parts/02-shell-navigation.php
          grep -Fq 'admin-s01-v6-shell-r1.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'admin-s01-v6-quality-r3.css' ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php
          grep -Fq 'data-vf-acceptance-overview-root' ops/includes/admin-v13/views/acceptance_overview.php
          grep -Fq 'body.vf-ops-v6-admin .vf-v6-quality-page' ops/assets/css/current/admin-s01-v6-quality-r3.css
          ! grep -Fq ':root' ops/assets/css/current/admin-s01-v6-quality-r3.css
          ! grep -Fq '.vf-m3u8-' ops/assets/css/current/admin-s01-v6-quality-r3.css

          # Restore/current identity readback.
          test "$(cat ops/VERSION)" = "1.21.873"
          grep -Fq 'Version: 1.21.873' ops/vf-ops.php
          grep -Fq "S01-MATURE-ADMIN-V6-R5-PUBLISH-SYSTEM" ops/vf-ops.php
          echo OPS_121873_V6_CONTRACTS=PASS

      - name: PHP syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in             ops/vf-ops.php             ops/includes/admin-v13/tab-controller.php             ops/includes/admin-v13/views/publish_zip_v6.php             ops/includes/admin-v13/views/system_site_release_v6.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/tests/s01-v6-r5-publish-system-contract.php; do
            php -l "$f"
          done
          echo OPS_121873_PHP=PASS

      - name: Boundary and secret fence
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'vf_ops_publish_release_prepare_v121762' ops/includes/admin-v13/views/publish_zip_v6.php
          grep -Fq 'vf_ops_publish_zip_export_v121423' ops/includes/admin-v13/views/publish_zip_v6.php
          grep -Fq 'vf_ops_site_release_admin_post_v121646' ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq "wp_nonce_field('ops.siteRelease.save'" ops/includes/admin-v13/views/system_site_release_v6.php
          grep -Fq "wp_nonce_field('ops.siteRelease.test'" ops/includes/admin-v13/views/system_site_release_v6.php
          test "$(git -C ops diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" --             includes/wp-update             includes/site-release             includes/publish-o10             assets/js/admin-publish-zip.js             assets/js/v13/system/site-release.js | wc -l)" = "0"
          ! grep -RInE 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'             ops/includes/admin-v13/views/publish_zip_v6.php             ops/includes/admin-v13/views/system_site_release_v6.php             ops/includes/views/admin-style-helpers/admin-s01-uiux-polish.php             ops/assets/css/current/admin-s01-v6-publish-system-r5.css
          echo OPS_121873_BOUNDARY=PASS

      - name: Result
        run: echo PASS_S01_OPS_121873_V6_R5_GATE
