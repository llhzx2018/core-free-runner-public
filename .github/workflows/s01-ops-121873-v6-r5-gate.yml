name: S01 Ops 1.21.873 Live Update Smoke

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-update-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - name: Verify private authorities
        shell: bash
        run: |
          set -Eeuo pipefail
          for repo in core-updates vf-tools-theme vf-tools-ops vf-tools-m3u8; do
            code="$(curl -sS -o /dev/null -w '%{http_code}'               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/llhzx2018/$repo" || true)"
            echo "$repo HTTP $code"
            test "$code" = "200"
          done
          echo S01_PRIVATE_AUTHORITIES=PASS

      - name: Read live S01 manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/live
          for c in S01-C01 S01-C02 S01-C03; do
            curl -fsSL               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/llhzx2018/core-updates/contents/projects/$c.json?ref=main"               | jq -r '.content' | tr -d '\n' | base64 -d > "/tmp/live/$c.json"
          done
          test "$(jq -r '.target_version' /tmp/live/S01-C01.json)" = "1.35.28"
          test "$(jq -r '.target_version' /tmp/live/S01-C02.json)" = "1.21.873"
          test "$(jq -r '.target_version' /tmp/live/S01-C03.json)" = "1.25.32"
          jq -e '.from_versions | index("1.21.872") != null' /tmp/live/S01-C02.json >/dev/null
          jq -e '.from_versions | index("1.21.861") == null' /tmp/live/S01-C02.json >/dev/null
          echo S01_LIVE_MANIFESTS=PASS

      - name: Download live formal packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/assets
          verify() {
            m="$1"; root="$2"; identity="$3"; needle="$4"
            repo="$(jq -r '.repository' "$m")"
            tag="$(jq -r '.release_tag' "$m")"
            asset="$(jq -r '.asset_name' "$m")"
            bytes="$(jq -r '.asset_bytes' "$m")"
            sha="$(jq -r '.asset_sha256' "$m")"
            curl -fsSL               -H 'Accept: application/vnd.github+json'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/$repo/releases/tags/$tag" > /tmp/release.json
            aid="$(jq -r --arg n "$asset" '.assets[] | select(.name==$n) | .id' /tmp/release.json | head -n1)"
            test -n "$aid" && test "$aid" != null
            curl -fsSL -L               -H 'Accept: application/octet-stream'               -H "Authorization: Bearer $VF_PRIVATE_READ_TOKEN"               "https://api.github.com/repos/$repo/releases/assets/$aid" -o "/tmp/assets/$asset"
            test "$(stat -c '%s' "/tmp/assets/$asset")" = "$bytes"
            test "$(sha256sum "/tmp/assets/$asset" | awk '{print $1}')" = "$sha"
            unzip -tq "/tmp/assets/$asset" >/dev/null
            test "$(unzip -Z1 "/tmp/assets/$asset" | cut -d/ -f1 | sort -u)" = "$root"
            unzip -p "/tmp/assets/$asset" "$identity" | grep -Fq "$needle"
            echo "PASS $asset"
          }
          verify /tmp/live/S01-C01.json vf-tools-theme vf-tools-theme/style.css 'Version: 1.35.28'
          verify /tmp/live/S01-C02.json vf-ops vf-ops/vf-ops.php 'Version: 1.21.873'
          verify /tmp/live/S01-C03.json vf-tool-m3u8 vf-tool-m3u8/vf-tool-m3u8.php 'Version: 1.25.32'
          unzip -Z1 /tmp/assets/vf-tools-ops_V1.21.873.zip | grep -Fxq 'vf-ops/includes/admin-v13/views/publish_zip_v6.php'
          unzip -Z1 /tmp/assets/vf-tools-ops_V1.21.873.zip | grep -Fxq 'vf-ops/includes/admin-v13/views/system_site_release_v6.php'
          unzip -Z1 /tmp/assets/vf-tools-ops_V1.21.873.zip | grep -Fxq 'vf-ops/assets/css/current/admin-s01-v6-publish-system-r5.css'
          echo S01_LIVE_PACKAGES=PASS

      - name: Result
        run: |
          echo PASS_S01_OPS_121873_LIVE_UPDATE_AVAILABLE
          echo LIVE_TARGETS=Theme_1.35.28,Ops_1.21.873,M3U8_1.25.32
