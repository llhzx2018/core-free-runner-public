name: P01 V2.36.0 Strict Fresh
on:
  push:
    branches: [temp/p01-v2360-release-gate-20260901]
    paths: [.github/workflows/p01-v2360-strict-fresh-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  strict-fresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_RUN: '33420558251'
      FORMAL_ARTIFACT: p01-v2360-formal-artifact-33420558251
      FORMAL: 225780b1ed56bbcc8e62ba465b1129e1c22ee60a
      FORMAL_TREE: 8af6d8ea6168fae52988cae8272a19073a0a7a2e
      FORMAL_RUNTIME_TREE: ad3f96345ead330adffb20c7ecb3cdf6537036b6
      SCHEMA: '2026082901'
      DOWNLOAD: /tmp/p01-v2360-strict-download
      FRESH: /tmp/p01-v2360-strict-fresh
      EVID: /tmp/p01-v2360-strict-evidence
      COOKIE: /tmp/p01-v2360-strict.cookies
      PORT: '18463'
      ADMIN_PASS: V2360StrictFresh2026
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - name: Exact Formal package identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf "$DOWNLOAD" "$FRESH" "$EVID" "$COOKIE"; mkdir -p "$DOWNLOAD" "$FRESH" "$EVID"
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$FORMAL_RUN --jq .conclusion)" = success
          gh run download "$FORMAL_RUN" -R llhzx2018/core-free-runner-public -n "$FORMAL_ARTIFACT" -D "$DOWNLOAD"
          FULL=$(find "$DOWNLOAD" -type f -name 'VF-Start-V2.36.0-FULL.zip' -print -quit); test -n "$FULL"; ART_DIR=$(dirname "$FULL")
          (cd "$ART_DIR" && sha256sum -c SHA256SUMS.txt) | tee "$EVID/sha256.txt"
          jq -e '.status=="FORMAL_ARTIFACT_GATE_PASS" and .formal_source=="225780b1ed56bbcc8e62ba465b1129e1c22ee60a" and .formal_tree=="8af6d8ea6168fae52988cae8272a19073a0a7a2e" and .runtime_tree=="ad3f96345ead330adffb20c7ecb3cdf6537036b6" and .schema=="2026082901" and .migration==null' "$ART_DIR/P01-V2.36.0-ARTIFACT-GATE.json" >/dev/null
          unzip -q "$FULL" -d "$FRESH"
          test "$(cat "$FRESH/VERSION.txt")" = 2.36.0
          grep -Fx "define('VF_VERSION', '2.36.0');" "$FRESH/app/bootstrap.php" >/dev/null
          test -f "$FRESH/app/ResourceCoverCache.php"
          test -f "$FRESH/app/ResourceMetadata.php"
          test -f "$FRESH/resource-cover-refresh.php"
          find "$FRESH" -type f -name '*.php' -print0 | xargs -0 -n1 php -l >"$EVID/php-syntax.txt"
          find "$FRESH/assets" -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          echo P01_V2360_STRICT_FORMAL_BYTES=PASS | tee "$EVID/formal.txt"
      - name: Fresh install zero data routing
        shell: bash
        run: |
          set -Eeuo pipefail
          php -S 127.0.0.1:$PORT -t "$FRESH" >"$EVID/server.log" 2>&1 & echo $! >/tmp/p01-v2360-strict.pid
          for i in $(seq 1 60); do curl -fsS -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/setup.php" -o "$EVID/setup.html" && break; sleep .25; done
          CSRF=$(python3 - "$EVID/setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c "$COOKIE" -b "$COOKIE" -X POST "http://127.0.0.1:$PORT/setup.php" --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=V2360 Strict' --data-urlencode "admin_password=$ADMIN_PASS" --data-urlencode "admin_password_confirm=$ADMIN_PASS" -o "$EVID/setup-post.html"
          php "$FRESH/cli/verify.php" | tee "$EVID/verify.txt" | grep -Fx VERIFY_PASS=YES
          php "$FRESH/cli/surface-verify.php" | tee "$EVID/surface.txt" | grep -Fx CURRENT_DOMAIN_PASS=YES
          ROOT="$FRESH" php <<'PHP' | tee "$EVID/database.txt"
          <?php require getenv('ROOT').'/app/bootstrap.php';$d=vf_db();foreach(['categories','links','import_batches','backup_records','operation_history'] as $t){$n=(int)$d->query("SELECT COUNT(*) FROM $t")->fetchColumn();echo "$t=$n\n";if($n!==0)exit(10);}if(strtolower((string)$d->query('PRAGMA integrity_check')->fetchColumn())!=='ok')exit(11);if($d->query('PRAGMA foreign_key_check')->fetchAll(PDO::FETCH_ASSOC))exit(12);echo "P01_V2360_STRICT_ZERO_DATA=PASS\nP01_V2360_STRICT_SQLITE=PASS\n";
          PHP
          rm -f "$COOKIE"
          curl -fsS -c "$COOKIE" -b "$COOKIE" -H 'Content-Type: application/json' -H 'Accept: application/json' -X POST "http://127.0.0.1:$PORT/api.php?action=login" --data "{\"password\":\"$ADMIN_PASS\"}" | tee "$EVID/login.json" | jq -e '.ok==true' >/dev/null
          curl -sS -D "$EVID/root.headers" -o /dev/null -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/"
          tr -d '\r' < "$EVID/root.headers" > "$EVID/root.headers.normalized"
          test "$(awk 'NR==1{print $2}' "$EVID/root.headers.normalized")" = 302
          grep -Fqx 'Location: home.php' "$EVID/root.headers.normalized"
          : > "$EVID/http-codes.txt"
          for page in home.php start.php channels.php watch.php topics.php update.php links-admin.php settings.php; do code=$(curl -sS -o "$EVID/${page%.php}.html" -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" "http://127.0.0.1:$PORT/$page"); echo "$page=$code" | tee -a "$EVID/http-codes.txt"; test "$code" = 200; done
          printf 'P01_V2360_STRICT_ROOT_REDIRECT=PASS\nP01_V2360_STRICT_CORE_HTTP=PASS\n' | tee "$EVID/http.txt"
      - name: Packaged Chromium terminal and view-state check
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/p01-v2360-strict-pw; cd /tmp/p01-v2360-strict-pw
          npm init -y >/dev/null 2>&1; npm install playwright@1.55.0 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat >gate.cjs <<'JS'
          const {chromium}=require('playwright');
          const base='http://127.0.0.1:18463/';
          const status={ok:true,status:{current_version:'2.36.0',latest_version:'2.36.0',available:false,can_update:false,current_withdrawn:false,reason:'当前已经是最新版本。',update_priority:'normal',last_check_at:'2026-09-01T00:00:00Z',history:[],release_notes:{summary:'V2.36.0'}}};
          (async()=>{const b=await chromium.launch({headless:true});const c=await b.newContext({viewport:{width:1440,height:900}});let q=await c.request.post(base+'api.php?action=login',{data:{password:'V2360StrictFresh2026'}});if(!q.ok()||!(await q.json()).ok)throw Error('login');const p=await c.newPage();await p.route('**/api.php?action=update_status',r=>r.fulfill({status:200,contentType:'application/json',body:JSON.stringify(status)}));await p.goto(base+'update.php',{waitUntil:'networkidle'});await p.waitForTimeout(150);const read=()=>p.evaluate(()=>{const x=document.getElementById('installUpdate'),s=document.getElementById('updateSteps'),e=document.getElementById('updateError');return{current:document.getElementById('updateCurrent')?.textContent||'',latest:document.getElementById('updateLatest')?.textContent||'',state:document.getElementById('updateState')?.textContent||'',footer:document.querySelector('.vf-rail-footer')?.textContent||'',hidden:!!x?.hidden,disabled:!!x?.disabled,display:x?getComputedStyle(x).display:'',stepsHidden:!!s?.hidden,stepsDisplay:s?getComputedStyle(s).display:'',errorShown:!!e?.classList.contains('show'),overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth}});let m=await read();if(m.current!=='V2.36.0'||m.latest!=='V2.36.0'||m.footer!=='VF Start · V2.36.0'||!m.hidden||!m.disabled||m.display!=='none'||!m.stepsHidden||m.stepsDisplay!=='none'||m.errorShown||!m.state.includes('最新')||m.overflow>1)throw Error('desktop '+JSON.stringify(m));await p.screenshot({path:process.env.EVID+'/terminal-1440.png',fullPage:true});await p.setViewportSize({width:390,height:844});await p.waitForTimeout(100);m=await read();if(m.display!=='none'||m.footer!=='VF Start · V2.36.0'||m.overflow>1)throw Error('mobile '+JSON.stringify(m));await p.screenshot({path:process.env.EVID+'/terminal-390.png',fullPage:true});await p.goto(base+'home.php',{waitUntil:'networkidle'});const body=await p.locator('body').innerText();if(!body.includes('管理员视角')||!body.includes('查看公开版'))throw Error('admin state missing');await b.close();console.log('P01_V2360_STRICT_CHROMIUM=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          EVID="$EVID" node gate.cjs | tee "$EVID/chromium.txt"
          grep -Fx P01_V2360_STRICT_CHROMIUM=PASS "$EVID/chromium.txt"
      - name: Final verdict
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fx P01_V2360_STRICT_FORMAL_BYTES=PASS "$EVID/formal.txt"
          grep -Fx P01_V2360_STRICT_ZERO_DATA=PASS "$EVID/database.txt"
          grep -Fx P01_V2360_STRICT_SQLITE=PASS "$EVID/database.txt"
          grep -Fx P01_V2360_STRICT_CORE_HTTP=PASS "$EVID/http.txt"
          grep -Fx P01_V2360_STRICT_CHROMIUM=PASS "$EVID/chromium.txt"
          printf 'P01_V2360_STRICT_FRESH_GATE=PASS\nFORMAL=%s\nTREE=%s\nRUNTIME_TREE=%s\nSCHEMA=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$FORMAL" "$FORMAL_TREE" "$FORMAL_RUNTIME_TREE" "$SCHEMA" | tee "$EVID/verdict.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2360-strict-fresh-${{ github.run_id }}
          path: /tmp/p01-v2360-strict-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/p01-v2360-strict.pid 2>/dev/null)" 2>/dev/null || true
