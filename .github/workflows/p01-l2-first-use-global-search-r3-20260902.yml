name: P01 L2 First Use + True Global Search R3
on:
  push:
    branches: [release/p01-v2365-candidate-20260902]
    paths: [.github/workflows/p01-l2-first-use-global-search-r3-20260902.yml]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: product/p01-first-use-global-search-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh source fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = 1abe3f8808faf43d0214ec98840f0573f5216adb
          test "$(git -C product rev-parse origin/develop)" = 1abe3f8808faf43d0214ec98840f0573f5216adb
      - name: Apply product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          python3 - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              count=s.count(old)
              if count != 1: raise SystemExit(f'{label}: expected 1 match, got {count}')
              return s.replace(old,new,1)

          p=Path('src/app/FunctionalHome.php'); s=p.read_text()
          s=once(s,"    $healthStatus = (array)($context['health_status'] ?? []);\n","    $healthStatus = (array)($context['health_status'] ?? []);\n    $firstUse = !empty($context['first_use']);\n",'home context')
          s=once(s,"""  <div class=\"vf-home-mobile-command\" aria-label=\"移动端快速操作\">\n    <form action=\"surfaces.php\" method=\"get\"><span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索全部资源\" autocomplete=\"off\"><button type=\"submit\">搜索</button></form>\n    <button type=\"button\" data-open-add>＋ 添加</button>\n  </div>\n\n  <div class=\"vf-home-board\">\n""","""  <div class=\"vf-home-mobile-command\" aria-label=\"移动端快速操作\">\n    <form action=\"surfaces.php\" method=\"get\"><span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><button type=\"submit\">搜索</button></form>\n    <button type=\"button\" data-open-add>＋ 添加</button>\n  </div>\n\n  <?php if($firstUse): ?>\n  <section class=\"vf-home-first-use\" aria-labelledby=\"vfHomeFirstUseTitle\">\n    <span class=\"vf-home-first-use-kicker\">开始使用</span>\n    <h2 id=\"vfHomeFirstUseTitle\">把你已经在用的互联网带进来</h2>\n    <p>不用从空白开始。可以直接导入 Chrome、Edge 或 Firefox 导出的书签 HTML；系统会先预览、识别重复，正式导入前自动创建恢复点。</p>\n    <div class=\"vf-home-first-use-actions\">\n      <a class=\"vf-home-first-use-primary\" href=\"transfer.php\">导入浏览器书签</a>\n      <button type=\"button\" data-open-add>从空白开始 · 添加第一个网址</button>\n    </div>\n    <small>书签 HTML 可以默认按私人导入；完成后再按需要整理分类与归属。</small>\n  </section>\n  <?php else: ?>\n\n  <div class=\"vf-home-board\">\n""",'home first-use block')
          s=once(s,"""  </div>\n</section>\n<?php\n}\n\nfunction vf_render_home_workspace(): void\n""","""  </div>\n  <?php endif; ?>\n</section>\n<?php\n}\n\nfunction vf_render_home_workspace(): void\n""",'home block close')
          s=once(s,"<?php vf_render_home_command_center(['pending'=>$pending,'operations'=>$operations,'operation_asset_titles'=>$operationAssetTitles,'operation_category_titles'=>$operationCategoryTitles,'health_status'=>$healthStatus]); ?>","<?php vf_render_home_command_center(['pending'=>$pending,'operations'=>$operations,'operation_asset_titles'=>$operationAssetTitles,'operation_category_titles'=>$operationCategoryTitles,'health_status'=>$healthStatus,'first_use'=>count($allAssets)===0]); ?>",'home call')
          s=once(s,'<form class="vf-global-search" action="surfaces.php" method="get"><span>⌕</span><input type="search" name="q" placeholder="搜索全部资源" autocomplete="off"><kbd>⌘ K</kbd></form>','<form class="vf-global-search" action="surfaces.php" method="get"><span>⌕</span><input type="search" name="q" placeholder="搜索我的互联网" autocomplete="off"><kbd>⌘ K</kbd></form>','home desktop search')
          p.write_text(s)

          p=Path('src/app/FunctionalWorkspace.php'); s=p.read_text()
          old="""<form class=\"vf-global-search\" action=\"<?=vf_fw_h(vf_fw_base_route($mode))?>\" method=\"get\"><?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?><?php if($categoryId>0): ?><input type=\"hidden\" name=\"category\" value=\"<?=$categoryId?>\"><?php endif; ?><?php if($kind!==''): ?><input type=\"hidden\" name=\"kind\" value=\"<?=vf_fw_h($kind)?>\"><?php endif; ?><span>⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"<?=vf_fw_h($mode==='start'?'搜索标题、网址、分类或标签':'搜索标题、分类或标签')?>\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          new="""<form class=\"vf-global-search\" action=\"surfaces.php\" method=\"get\"><span>⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><kbd>⌘ K</kbd></form>"""
          s=once(s,old,new,'workspace desktop global search')
          anchor="<?php vf_fw_render_mobile_filters($mode,$admin,$scope,$categories,$categoryCounts,$categoryId,$kindCounts,$kind); ?>"
          fallback="""<?php if($q!==''&&$mode==='all'&&$total===0): ?><div class=\"vf-search-fallback\"><span>个人资源里没有找到。</span><a href=\"https://www.google.com/search?q=<?=rawurlencode($q)?>\" target=\"_blank\" rel=\"noopener noreferrer\">在 Google 搜索“<?=vf_fw_h($q)?>” →</a></div><?php endif; ?>\n"""+anchor
          s=once(s,anchor,fallback,'workspace web fallback')
          p.write_text(s)

          p=Path('src/app/FunctionalWorkspaceShell.php'); s=p.read_text()
          old="""  <form class=\"vf-mobile-command-search\" action=\"<?=vf_fw_h(vf_fw_base_route($mode))?>\" method=\"get\">\n    <?php if($admin&&$scope!=='all'): ?><input type=\"hidden\" name=\"scope\" value=\"<?=vf_fw_h($scope)?>\"><?php endif; ?>\n    <?php if($categoryId>0): ?><input type=\"hidden\" name=\"category\" value=\"<?=$categoryId?>\"><?php endif; ?>\n    <?php if($kind!==''): ?><input type=\"hidden\" name=\"kind\" value=\"<?=vf_fw_h($kind)?>\"><?php endif; ?>\n    <span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索当前资源\" autocomplete=\"off\"><button type=\"submit\">搜索</button>\n  </form>"""
          new="""  <form class=\"vf-mobile-command-search\" action=\"surfaces.php\" method=\"get\">\n    <span aria-hidden=\"true\">⌕</span><input type=\"search\" name=\"q\" value=\"<?=vf_fw_h($q)?>\" placeholder=\"搜索我的互联网\" autocomplete=\"off\"><button type=\"submit\">搜索</button>\n  </form>"""
          p.write_text(once(s,old,new,'workspace mobile global search'))

          p=Path('src/assets/workspace-home.css'); s=p.read_text()
          css='''/* First-use entry: expose existing safe import instead of an empty dashboard. */\n.vf-home-first-use{padding:28px 30px;border:1px solid var(--ws-line);border-radius:12px;background:var(--ws-panel)}\n.vf-home-first-use-kicker{display:block;color:var(--ws-teal);font-size:9px;font-weight:800;letter-spacing:.12em}\n.vf-home-first-use h2{max-width:680px;margin:7px 0 8px;color:var(--ws-text);font-size:21px;line-height:1.25;letter-spacing:-.02em}\n.vf-home-first-use p{max-width:760px;margin:0;color:var(--ws-muted);font-size:12px;line-height:1.7}\n.vf-home-first-use-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}\n.vf-home-first-use-actions a,.vf-home-first-use-actions button{min-height:38px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ws-line-strong);border-radius:8px;background:var(--ws-panel);color:var(--ws-text);font:inherit;font-size:11.5px;font-weight:750;text-decoration:none;cursor:pointer}\n.vf-home-first-use-actions .vf-home-first-use-primary{border-color:var(--ws-teal);background:var(--ws-teal);color:#fff}\n.vf-home-first-use>small{display:block;margin-top:10px;color:var(--ws-muted-2);font-size:10px;line-height:1.5}\n@media(max-width:760px){.vf-home-first-use{padding:20px 16px}.vf-home-first-use h2{font-size:18px}.vf-home-first-use-actions{display:grid}.vf-home-first-use-actions a,.vf-home-first-use-actions button{width:100%}}'''
          if 'First-use entry:' in s: raise SystemExit('home css duplicate')
          p.write_text(s.rstrip()+'\n'+css+'\n')

          p=Path('src/assets/workspace-rebaseline.css'); s=p.read_text()
          css='''/* Global personal-search fallback: only after zero local matches. */\n.vf-search-fallback{margin:0 0 10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--ws-line);border-radius:8px;background:var(--ws-soft);font-size:10.5px}\n.vf-search-fallback span{color:var(--ws-muted-2)}\n.vf-search-fallback a{color:var(--ws-teal);font-weight:750;text-decoration:none}\n@media(max-width:600px){.vf-search-fallback{align-items:flex-start;flex-direction:column;gap:4px}}'''
          if 'Global personal-search fallback:' in s: raise SystemExit('fallback css duplicate')
          p.write_text(s.rstrip()+'\n'+css+'\n')
          PY
      - name: Verify exact product contract
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          echo '[1] PHP lint'
          php -l src/app/FunctionalHome.php >/dev/null
          php -l src/app/FunctionalWorkspace.php >/dev/null
          php -l src/app/FunctionalWorkspaceShell.php >/dev/null
          echo '[2] whitespace'
          git diff --check
          echo '[3] first-use contract'
          grep -F '导入浏览器书签' src/app/FunctionalHome.php >/dev/null
          grep -F "'first_use'=>count(\$allAssets)===0" src/app/FunctionalHome.php >/dev/null
          grep -F '书签 HTML 可以默认按私人导入' src/app/FunctionalHome.php >/dev/null
          echo '[4] true global search contract'
          grep -F '<form class="vf-global-search" action="surfaces.php" method="get"><span>⌕</span><input type="search" name="q"' src/app/FunctionalWorkspace.php >/dev/null
          grep -F '<form class="vf-mobile-command-search" action="surfaces.php" method="get">' src/app/FunctionalWorkspaceShell.php >/dev/null
          ! grep -A3 -F '<form class="vf-global-search" action="surfaces.php" method="get">' src/app/FunctionalWorkspace.php | grep -E 'name="(scope|category|kind)"'
          ! grep -A3 -F '<form class="vf-mobile-command-search" action="surfaces.php" method="get">' src/app/FunctionalWorkspaceShell.php | grep -E 'name="(scope|category|kind)"'
          echo '[5] web fallback only after zero matches'
          grep -F "if(\$q!==''&&\$mode==='all'&&\$total===0)" src/app/FunctionalWorkspace.php >/dev/null
          grep -F 'https://www.google.com/search?q=' src/app/FunctionalWorkspace.php >/dev/null
          echo '[6] boundaries'
          test "$(cat src/VERSION.txt)" = 2.36.4
          python3 -m json.tool VF_PROJECT.json >/dev/null
          git diff --name-only | sort | tee /tmp/changed.txt
          expected=$(printf '%s\n' src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-home.css src/assets/workspace-rebaseline.css | sort)
          test "$(cat /tmp/changed.txt)" = "$expected"
          test "$(git diff --name-only -- database src/migrations | wc -l | tr -d ' ')" = 0
          echo 'PRODUCT CONTRACT PASS'
      - name: Commit and push candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/FunctionalHome.php src/app/FunctionalWorkspace.php src/app/FunctionalWorkspaceShell.php src/assets/workspace-home.css src/assets/workspace-rebaseline.css
          git commit -m 'feat(P01): productize first use and true global search'
          git push origin HEAD:product/p01-first-use-global-search-20260902
          echo "CANDIDATE=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
