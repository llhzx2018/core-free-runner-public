name: P01 V2.47.282 Core Updates Proof
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/p01-v247282-core-updates-proof.yml"]
permissions:
  contents: read
jobs:
  proof:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'llhzx2018' &&
      startsWith(github.event.pull_request.title, 'proof(P01): V2.47.282 core-updates')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli jq >/dev/null
      - name: Exact distribution candidate
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/core-updates.git" candidate
          git -C candidate fetch -q origin 925243b3211d949b582641dfc65e275eae6174d3
          git -C candidate checkout -q --detach 925243b3211d949b582641dfc65e275eae6174d3
          echo CORE_UPDATES_EXACT_SOURCE=PASS
      - name: Canonical CI equivalent
        run: |
          set -Eeuo pipefail
          cd candidate
          python3 scripts/check_manifest_contract.py
          while IFS= read -r -d '' f; do php -l "$f" >/dev/null; done < <(find update-core/php -type f -name '*.php' -print0)
          php update-core/php/tests/run.php
          echo CORE_UPDATES_CANONICAL_CI_EQUIVALENT=PASS
      - name: Manifest exact identity
        run: |
          set -Eeuo pipefail
          cd candidate
          jq -e '
            .current_version=="2.47.281" and
            .target_version=="2.47.282" and
            .from_versions==["2.47.281"] and
            .release_id==406352795 and
            .product_identity=="860a7cf9d92542c5a4f9c25d2cc4d0c6411ab56c" and
            .asset_name=="VF_Start_V2.47.282_UPDATE.zip" and
            .asset_bytes==2361869 and
            .asset_sha256=="fbe840c7db61ab73059728c140d6b9fc263ab27a2cd39000141111a0f8b00c09" and
            (.notes|contains("重新检查")) and
            (.notes|contains("检查中"))
          ' projects/P01.json >/dev/null
          echo P01_V247282_MANIFEST_IDENTITY=PASS
      - name: Bounded delta
        run: |
          set -Eeuo pipefail
          cd candidate
          git fetch -q origin main
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "projects/P01.json"
          echo CORE_UPDATES_BOUNDED_DELTA=PASS
          echo PRODUCTION_WRITE=NO
