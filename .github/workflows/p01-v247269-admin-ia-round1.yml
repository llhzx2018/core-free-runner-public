name: P01 V2.47.269 Backend IA Round 1 Proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p01-v247269-admin-ia-round1.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout proof control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-gd nodejs >/dev/null

      - name: Clone exact candidate and baseline
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" candidate
          git -C candidate fetch -q origin 33fd36a881209e9bad5d4168379cbf0a9006309d
          git -C candidate checkout -q --detach 33fd36a881209e9bad5d4168379cbf0a9006309d
          test "$(tr -d '\r\n ' < candidate/VERSION)" = "2.47.269"
          test "$(tr -d '\r\n ' < candidate/src/VERSION.txt)" = "2.47.269"

          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-start.git" baseline
          git -C baseline fetch -q origin e13d7161ded778aae5ed8495c9c98b31ff89e5b8
          git -C baseline checkout -q --detach e13d7161ded778aae5ed8495c9c98b31ff89e5b8
          echo P01_V247269_EXACT_SOURCE=PASS

      - name: Syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check candidate/src/assets/category-admin.js
          php -l candidate/src/app/AdminShell.php
          php -l candidate/src/links-admin.php
          php -l candidate/src/surface-manager.php
          php -l candidate/src/transfer.php
          php -l candidate/src/resources.php
          php -l candidate/src/governance.php
          php -l candidate/src/app/bootstrap.php
          echo P01_V247269_SYNTAX=PASS

      - name: Focused IA contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd candidate
          php tests/unit/backend_ia_round1_v247269_contract.php
          php tests/unit/admin_ia_v247253_contract.php
          php tests/unit/admin_navigation_consistency_contract.php
          php tests/unit/admin_navigation_task_separation_contract.php
          php tests/unit/admin_secondary_nav_focus_contract.php
          php tests/unit/admin_group_single_authority_r39_contract.php
          php tests/unit/navigation_category_accordion_v247267_contract.php
          php tests/unit/navigation_category_editor_v247265_contract.php
          php tests/unit/navigation_category_sort_v247263_contract.php
          php tests/unit/navigation_category_runtime_binding_v247264_contract.php
          php tests/unit/pending_ai_governance_entry_contract.php
          php tests/unit/pending_ai_governance_return_contract.php
          php tests/unit/admin_transfer_r16_contract.php
          echo P01_V247269_FOCUSED=PASS

      - name: Canonical regression
        shell: bash
        run: |
          set -Eeuo pipefail
          bash candidate/tests/canonical_release_regression.sh candidate baseline --require-zero-debt | tee /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_UNIT_REGRESSION=PASS' /tmp/canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/canonical.txt
          echo P01_V247269_CANONICAL=PASS

      - name: Bounded scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C candidate diff --name-only e13d7161ded778aae5ed8495c9c98b31ff89e5b8..33fd36a881209e9bad5d4168379cbf0a9006309d | tee /tmp/changed.txt
          if grep -E '(^|/)(migrations|schema|auth|security|update|install|setup)' /tmp/changed.txt; then
            echo "Unexpected high-risk scope"
            exit 1
          fi
          echo ROUND2_STARTED=NO
          echo FORMAL_RELEASE_CALLED=NO
          echo DISTRIBUTION_WRITE=NO
          echo PRODUCTION_WRITE=NO
