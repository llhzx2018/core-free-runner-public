name: TEMP S01-C02 Ops 1.21.827 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121827-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121827-update-channel-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_BASE: 2f25d54e4c4aadbe55f4ed9ea59108f14392cae0
      UPDATE_HEAD: 4285eafb67a638cd287318eadba126049c76bfe1
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_COMMIT: 3a59068c8e9c6adc533e37883f48bd38224e7362
      PRODUCT_TREE: 5d4378a15d3c2a14da603cebe27348df502b32aa
      TAG: v1.21.827
      ASSET: vf-tools-ops_V1.21.827.zip
      BYTES: '3247976'
      SHA256: 903a315c934c8437e980bfd9d6776b0be08f597464a02d1a44006d40ab1c13a2
      FILES: '909'
      FP: 795a5fd53b8a36c04599a4fe4a45c1416f9abf91c91d910a461ec5b21641226a
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_HEAD }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify manifest source scope and formal release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_HEAD"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE..$UPDATE_HEAD")
          test "${#files[@]}" = 1
          test "${files[0]}" = projects/S01-C02.json
          M=updates/projects/S01-C02.json
          jq -e '.target_version=="1.21.827" and .from_versions==["1.21.826"] and .release_tag=="v1.21.827" and .asset_name=="vf-tools-ops_V1.21.827.zip" and .asset_bytes==3247976 and .asset_sha256=="903a315c934c8437e980bfd9d6776b0be08f597464a02d1a44006d40ab1c13a2" and .runtime_files==909 and .runtime_file_count==909 and .runtime_fingerprint=="795a5fd53b8a36c04599a4fe4a45c1416f9abf91c91d910a461ec5b21641226a" and .runtime_fingerprint_sha256=="795a5fd53b8a36c04599a4fe4a45c1416f9abf91c91d910a461ec5b21641226a" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false' "$M" >/dev/null
          L="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/$TAG")"
          test "$(jq -r .tag_name <<<"$L")" = "$TAG"
          test "$(jq -r .draft <<<"$L")" = false
          test "$(jq -r .prerelease <<<"$L")" = false
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.size' <<<"$L")" = "$BYTES"
          test "$(jq -r --arg n "$ASSET" '.assets[]|select(.name==$n)|.digest' <<<"$L")" = "sha256:$SHA256"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$PRODUCT_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$PRODUCT_TREE"
          done
          T="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/git/ref/tags/$TAG")"
          test "$(jq -r .object.sha <<<"$T")" = "$PRODUCT_COMMIT"
          echo UPDATE_RELEASE_AUTHORITY_V121827=PASS
      - name: Verify direct Production remains 1.21.826 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority' -o /tmp/domain.json
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.826" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com" and .configuredPublicBaseUrl=="https://ilovem3u8.com" and .authorityMatch==true' /tmp/domain.json >/dev/null
          jq -e '.pluginVersion=="1.21.826" and .activeStaticJobMode=="candidate" and .activeStaticJobStatus=="FAIL" and .activeStaticJobAuditFailureCount==202 and .candidatePackageReady==false and .manualSourceUploadRequired==false and .finalOnlinePass=="NO" and .activeStaticJobFailureSubtypeCounts.internal_link_missing==195' /tmp/static.json >/dev/null
          echo PRODUCTION_REMAINS_V121826_FAIL_CLOSED=PASS
      - name: Verify runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = '0160b557ad4ae0e8c6acd97e7551285bc05870bd'
      - name: Seal result
        run: echo PASS_V121827_UPDATE_CHANNEL_GATE
