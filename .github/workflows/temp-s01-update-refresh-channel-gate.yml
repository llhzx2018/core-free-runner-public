name: TEMP S01 Update Refresh Channel Gate
on:
  push:
    branches: [temp/s01-update-refresh-policy-gate-20260904]
    paths: ['.github/workflows/temp-s01-update-refresh-channel-gate.yml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_BASE: 9d428114461798a103cb4d15f19d6ddeb2c37f74
      CORE_CANDIDATE: 299b08aedbd89c10369df72f8d643ad2b3bcf660
      OPS_SHA: fbdd766314d3f9abe8d1834343e8058d99167307
      M3U8_SHA: 44ff4a658ed87af8746d7fc81244df80f24aa5c3
      THEME_SHA: 2db7feab0fa975bcadf01867a044983b51b17145
    steps:
      - name: Checkout exact core-updates candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.CORE_CANDIDATE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: core
      - name: Checkout exact M3U8 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3U8_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3u8
      - name: Checkout exact Theme source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.THEME_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Verify exact channel scope and manifests
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          live="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-updates/branches/main | jq -r '.commit.sha')"
          test "$live" = "$CORE_BASE"
          printf '%s\n' projects/S01-C01.json projects/S01-C02.json projects/S01-C03.json | sort >/tmp/expected
          git -C core diff --name-only "$CORE_BASE" "$CORE_CANDIDATE" | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual
          jq -e '.target_version=="1.21.811" and .from_versions==["1.21.809","1.21.810"] and .release_tag=="v1.21.811" and .asset_bytes==3217144 and .asset_sha256=="d650af9f5191b6b362ae45712f350676008abefd717823ad64f7aed456cd71b1" and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .runtime_files==899 and .runtime_fingerprint=="358084a51ef6649a6e708b39c8db807e4ec0f05623590bfe6589f821dd817416"' core/projects/S01-C02.json >/dev/null
          jq -e '.target_version=="1.25.20" and .from_versions==["1.25.19"] and .release_tag=="v1.25.20" and .asset_bytes==3548397 and .asset_sha256=="87021cce154a16233eab8220e9913096ffc6e135288835a851f1abc324fdd221" and .schema_from=="1.3.0" and .schema_to=="1.3.0" and .physical_locator=="vf-tool-m3u8/vf-tool-m3u8.php" and .runtime_files==552 and .runtime_fingerprint=="52512513aa00582aeaffd11d25cc431d072de3ad44454f2736237d831e64cb63"' core/projects/S01-C03.json >/dev/null
          jq -e '.target_version=="1.35.9" and .from_versions==["1.35.8"] and .release_tag=="v1.35.9" and .asset_bytes==1774398 and .asset_sha256=="e542fb3c3925f7ee9a0620891decf3669570a54afd878fa072306af9ab710164" and .runtime_files==437 and .runtime_fingerprint=="c1cbc13021630d000dfb1df69efde5acf942036f5ee252cbf531353d045aee22"' core/projects/S01-C01.json >/dev/null
          echo EXACT_UPDATE_CHANNEL_SCOPE=PASS
      - name: Recompute M3U8 and Theme target Runtime Authority
        run: |
          set -Eeuo pipefail
          cat >/tmp/m3.php <<'PHP'
          <?php
          define('ABSPATH','/'); class WP_Error { public function __construct(...$x){} }
          final class VF_M3U8_Update_Contract_V1 { public const COMPONENT_ID='S01-C03'; public const RUNTIME_CONTRACT='VF_WP_COMPONENT_RUNTIME_AUTHORITY_V1'; }
          require 'm3u8/src/includes/update/class-vf-m3u8-runtime-authority-v1.php';
          $s=VF_M3U8_Runtime_Authority_V1::snapshot('m3u8/src'); unset($s['files']); echo json_encode($s),"\n";
          PHP
          cat >/tmp/th.php <<'PHP'
          <?php
          define('ABSPATH','/'); class WP_Error { public function __construct(...$x){} }
          require 'theme/src/inc/update/class-vf-theme-runtime-authority-v1.php';
          $s=VF_Theme_Runtime_Authority_V1::snapshot('theme/src'); unset($s['files']); echo json_encode($s),"\n";
          PHP
          m="$(php /tmp/m3.php)"; t="$(php /tmp/th.php)"
          test "$(jq -r '.file_count' <<<"$m")" = 552
          test "$(jq -r '.fingerprint_sha256' <<<"$m")" = 52512513aa00582aeaffd11d25cc431d072de3ad44454f2736237d831e64cb63
          test "$(jq -r '.file_count' <<<"$t")" = 437
          test "$(jq -r '.fingerprint_sha256' <<<"$t")" = c1cbc13021630d000dfb1df69efde5acf942036f5ee252cbf531353d045aee22
          echo TARGET_RUNTIME_AUTHORITIES=PASS
      - name: Verify formal Releases and promoted sources
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          branch(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$1/branches/$2" | jq -r '.commit.sha'; }
          release(){ curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$1/releases/tags/$2"; }
          test "$(branch llhzx2018/vf-tools-ops main)" = "$OPS_SHA"; test "$(branch llhzx2018/vf-tools-ops develop)" = "$OPS_SHA"
          test "$(branch llhzx2018/vf-tools-m3u8 main)" = "$M3U8_SHA"; test "$(branch llhzx2018/vf-tools-m3u8 develop)" = "$M3U8_SHA"
          test "$(branch llhzx2018/vf-tools-theme main)" = "$THEME_SHA"; test "$(branch llhzx2018/vf-tools-theme develop)" = 63eb30f4250951e9a2c3dfe0a43c7f18af6e1f81
          o="$(release llhzx2018/vf-tools-ops v1.21.811)"; test "$(jq -r '.target_commitish' <<<"$o")" = "$OPS_SHA"; test "$(jq -r '.assets[]|select(.name=="vf-tools-ops_V1.21.811.zip")|.digest' <<<"$o")" = sha256:d650af9f5191b6b362ae45712f350676008abefd717823ad64f7aed456cd71b1
          m="$(release llhzx2018/vf-tools-m3u8 v1.25.20)"; test "$(jq -r '.target_commitish' <<<"$m")" = "$M3U8_SHA"; test "$(jq -r '.assets[]|select(.name=="vf-tools-m3u8_V1.25.20.zip")|.digest' <<<"$m")" = sha256:87021cce154a16233eab8220e9913096ffc6e135288835a851f1abc324fdd221
          t="$(release llhzx2018/vf-tools-theme v1.35.9)"; test "$(jq -r '.target_commitish' <<<"$t")" = "$THEME_SHA"; test "$(jq -r '.assets[]|select(.name=="vf-tools-theme_V1.35.9.zip")|.digest' <<<"$t")" = sha256:e542fb3c3925f7ee9a0620891decf3669570a54afd878fa072306af9ab710164
          echo FORMAL_RELEASES_AND_SOURCES=PASS
      - name: Production source sanity
        run: |
          set -Eeuo pipefail
          prod="$(curl -fsSL --retry 2 --max-time 20 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-domain-authority')"
          echo "$prod" | jq -e '.pluginVersion=="1.21.809" and .status=="CURRENT" and .authorityFinalHost=="https://ilovem3u8.com"' >/dev/null
          echo PRODUCTION_OPS_SOURCE_1_21_809=PASS
          echo PASS_S01_UPDATE_REFRESH_CHANNEL_GATE
