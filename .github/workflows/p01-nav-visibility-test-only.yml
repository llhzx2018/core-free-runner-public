name: P01 navigation visibility context exact-source test-only
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-nav-visibility-test-only.yml']
permissions:
  contents: read
jobs:
  nav-visibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout registered public gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout private P01 candidate exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-start
          ref: 4d522cf7e8f32a0df3156609e6477f9f5f93f767
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
      - name: Prepare PHP with SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite,sqlite3,mbstring,openssl,curl,zip
          coverage: none
      - name: Verify real Navigation contexts and existing privacy contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "4d522cf7e8f32a0df3156609e6477f9f5f93f767"
          php -l product/src/app/FunctionalWorkspace.php
          php -l product/src/app/FunctionalWorkspaceShell.php
          php -l product/tests/unit/navigation_visibility_search_context_v247390_contract.php
          for file in \
            navigation_visibility_search_context_v247390_contract.php \
            navigation_owner_behavior_privacy_contract.php \
            navigation_search_context_contract.php \
            navigation_search_authority_contract.php \
            navigation_category_facet_recovery_contract.php \
            navigation_page_visual_closure_contract.php \
            navigation_public_row_layout_contract.php \
            public_global_nav_contract.php \
            public_brand_route_contract.php \
            public_navigation_seo_route_v247390_contract.php; do
            php "product/tests/unit/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          css=Path('product/src/assets/frontend-start-r9.css').read_text()
          assert css.count('{')==css.count('}')
          assert 'body.surface-start.vf-functional-workspace .vf-start-visibility-note{' in css
          print('P01_NAV_VISIBILITY_RESPONSIVE_CSS=PASS')
          PY
          echo P01_NAV_VISIBILITY_EXACT_SOURCE=PASS
      - name: Erase temporary private source
        if: always()
        shell: bash
        run: rm -rf product
