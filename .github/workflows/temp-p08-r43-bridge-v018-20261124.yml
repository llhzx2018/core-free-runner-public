name: TEMP P08 R43 code-only bridge plus schema-inventory exact-source proof
on:
  pull_request:
    paths:
      - .github/workflows/temp-p08-r43-bridge-v018-20261124.yml
permissions:
  contents: read
concurrency:
  group: p08-r43-schema-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source-bound-developer-bridge:
    # Earlier exact source R43 bridge/archive tests passed in run 45312421427.
    # This rerun checks only the new disposable migration helper on all engines.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      P08_R43_DISPOSABLE: 'YES'
    steps:
      - name: Checkout exact original issued v016 PHP and runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-issued
      - name: Checkout exact v017 development bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-p08-bridge
      - name: Checkout exact v018 feature development target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8d645d498fec5271434f4756c8b483d455575ed4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-p08-target
      - name: Read canonical current governance for builder gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: main
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: gov-proof
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source ancestry, versions, PHP syntax and immutable migration byte parity
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-issued rev-parse HEAD)" = 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          test "$(git -C private-p08-bridge rev-parse HEAD)" = '37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72'
          test "$(git -C private-p08-target rev-parse HEAD)" = '8d645d498fec5271434f4756c8b483d455575ed4'
          test "$(cat private-p08-issued/VERSION)" = '0.1.16'
          test "$(cat private-p08-bridge/VERSION)" = '0.1.17'
          test "$(cat private-p08-target/VERSION)" = '0.1.18'
          test "$(git -C private-p08-bridge merge-base ed96b18627cd0a63b1da20a1fd8c9b6c1808f159 HEAD)" = 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          php -l private-p08-bridge/src/Upgrade/R43SchemaUpgradeAdmission.php > "$RUNNER_TEMP/p08-r43-php-lint.log" 2>&1
          php -l private-p08-bridge/tests/compatibility/r43_schema_upgrade_admission.php >> "$RUNNER_TEMP/p08-r43-php-lint.log" 2>&1
          (cd private-p08-issued && git ls-tree -r HEAD database/migrations/ | awk '{print $3" "$4}' | sort) > "$RUNNER_TEMP/p08-r43-issued-migrations.txt"
          (cd private-p08-bridge && git ls-tree -r HEAD database/migrations/ | awk '{print $3" "$4}' | sort) > "$RUNNER_TEMP/p08-r43-bridge-migrations.txt"
          cmp -s "$RUNNER_TEMP/p08-r43-issued-migrations.txt" "$RUNNER_TEMP/p08-r43-bridge-migrations.txt" || { echo P08_R43_V017_CODE_ONLY_SCHEMA_PARITY=FAIL; exit 1; }
          python3 private-p08-bridge/scripts/check_r101_atomic_schema_compat.py --repo private-p08-bridge --base-ref 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --target-ref '37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72' > "$RUNNER_TEMP/p08-r43-compat.json" 2>&1 || { echo P08_R43_NATIVE_BRIDGE_COMPAT=FAIL; exit 1; }
          grep -q 'R101_ATOMIC_CODE_ONLY_COMPAT=PASS' "$RUNNER_TEMP/p08-r43-compat.json"
          echo P08_R43_ISSUED_V016_TO_V017_SCHEMA_CODE_ONLY=PASS
      - name: Build all three immutable source-bound PHP and frontend runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          for d in private-p08-issued private-p08-bridge private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-dev --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_LOCKED_PHP_DEPENDENCIES=FAIL; exit 1; }
            (cd "$d" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/p08-r43-$d-npm.log" 2>&1) || { echo P08_R43_LOCKED_NPM_DEPENDENCIES=FAIL; exit 1; }
            (cd "$d" && npm run build > "$RUNNER_TEMP/p08-r43-$d-vite.log" 2>&1) || { echo P08_R43_LOCKED_VITE_BUILD=FAIL; exit 1; }
            (cd "$d" && python3 scripts/check_stack_contract.py --root . --phase full > "$RUNNER_TEMP/p08-r43-$d-stack.log" 2>&1) || { echo P08_R43_FULL_STACK_CODE_GATE=FAIL; exit 1; }
          done
          echo P08_R43_THREE_LOCKED_FULL_RUNTIMES=PASS
      - name: Build immutable development FULLs with actual GOV resolve and delivery gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 private-p08-issued/scripts/build_full.py --source private-p08-issued --output "$RUNNER_TEMP/p08-r43-issued.zip" --version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-issued-full.log" 2>&1 || { echo P08_R43_ORIGINAL_ISSUED_SOURCE_FULL=FAIL; grep -E 'CONTRACT_REASON=|FULL_BLOCKED' "$RUNNER_TEMP/p08-r43-issued-full.log" | head -n 7 || true; exit 1; }
          python3 private-p08-bridge/scripts/build_full.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge.zip" --version 0.1.17 --source-sha '37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-bridge-full.log" 2>&1 || { echo P08_R43_BRIDGE_FULL=FAIL; grep -E 'CONTRACT_REASON=|FULL_BLOCKED' "$RUNNER_TEMP/p08-r43-bridge-full.log" | head -n 7 || true; exit 1; }
          python3 private-p08-target/scripts/build_full.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-target.zip" --version 0.1.18 --source-sha '8d645d498fec5271434f4756c8b483d455575ed4' --governance-root gov-proof > "$RUNNER_TEMP/p08-r43-target-full.log" 2>&1 || { echo P08_R43_TARGET_FULL=FAIL; grep -E 'CONTRACT_REASON=|FULL_BLOCKED' "$RUNNER_TEMP/p08-r43-target-full.log" | head -n 7 || true; exit 1; }
          unzip -p "$RUNNER_TEMP/p08-r43-issued.zip" FULL_MANIFEST.json > "$RUNNER_TEMP/p08-r43-original-manifest.json"
          echo P08_R43_THREE_SOURCE_LOCKED_CANONICAL_DEV_FULLS=PASS
      - name: Build real code-only v016 to v017 Atomic and reject direct schema-changing Atomic
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          sha="$(sha256sum "$RUNNER_TEMP/p08-r43-original-manifest.json" | awk '{print $1}')"
          python3 private-p08-bridge/scripts/build_atomic.py --source private-p08-bridge --output "$RUNNER_TEMP/p08-r43-bridge-atomic.zip" --source-version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --source-full-manifest-sha256 "$sha" --previous-full-manifest "$RUNNER_TEMP/p08-r43-original-manifest.json" --target-version 0.1.17 --target-sha '37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72' > "$RUNNER_TEMP/p08-r43-atomic.log" 2>&1 || { echo P08_R43_CODE_ONLY_BRIDGE_ATOMIC=FAIL; grep -E 'ATOMIC_BUILD_BLOCKED|ATOMIC_REJECTED' "$RUNNER_TEMP/p08-r43-atomic.log" | head -n 6 || true; exit 1; }
          test -s "$RUNNER_TEMP/p08-r43-bridge-atomic.zip"
          set +e
          python3 private-p08-target/scripts/build_atomic.py --source private-p08-target --output "$RUNNER_TEMP/p08-r43-unsafe-atomic.zip" --source-version 0.1.16 --source-sha 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159' --source-full-manifest-sha256 "$sha" --previous-full-manifest "$RUNNER_TEMP/p08-r43-original-manifest.json" --target-version 0.1.18 --target-sha '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-reject.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 2 || { echo P08_R43_DIRECT_SCHEMA_ATOMIC_UNEXPECTED_EXIT; exit 1; }
          grep -q 'database files changed; schema-aware Atomic required' "$RUNNER_TEMP/p08-r43-reject.log" || { echo P08_R43_UNSAFE_SCHEMA_ATOMIC_NOT_REFUSED; exit 1; }
          test ! -e "$RUNNER_TEMP/p08-r43-unsafe-atomic.zip"
          echo P08_R43_REAL_CODE_ONLY_BRIDGE_ARCHIVE=PASS
          echo P08_R43_DIRECT_V016_TO_V018_SCHEMA_ATOMIC=REFUSED_SAFE
      - name: Inspect actual pair of extracted FULLs with pinned migration identity and negatives
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          mkdir -m 700 "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-target-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-bridge.zip" -d "$RUNNER_TEMP/p08-r43-bridge-extract"
          unzip -q "$RUNNER_TEMP/p08-r43-target.zip" -d "$RUNNER_TEMP/p08-r43-target-extract"
          php private-p08-bridge/tests/compatibility/r43_schema_upgrade_admission.php "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-target-extract" '37cbcfc3b39c36ceb1f6474fca2b9cdef4600c72' '8d645d498fec5271434f4756c8b483d455575ed4' > "$RUNNER_TEMP/p08-r43-schema-admission.log" 2>&1 || { echo P08_R43_SCHEMA_ADMISSION=FAIL; grep -E '^P08_|R43_' "$RUNNER_TEMP/p08-r43-schema-admission.log" | head -n 12 || true; exit 1; }
          grep -q 'P08_R43_MANIFEST_VERSION_WRONG_IDENTITY_REFUSAL=PASS' "$RUNNER_TEMP/p08-r43-schema-admission.log"
          echo P08_R43_REAL_EXTRACTED_SCHEMA_ADMISSION_NEGATIVES=PASS
          echo P08_R43_NEXT_SCHEMA_UPGRADE_APPLY=NOT_IMPLEMENTED
      - name: Delete all transient private source archives and test logs
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-issued private-p08-bridge private-p08-target gov-proof
          rm -rf -- "$RUNNER_TEMP/p08-r43-bridge-extract" "$RUNNER_TEMP/p08-r43-target-extract"
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.zip "$RUNNER_TEMP"/p08-r43-*.json "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP"/p08-r43-*.txt
          test ! -e private-p08-issued && test ! -e private-p08-bridge && test ! -e private-p08-target && test ! -e gov-proof
          echo P08_R43_PRIVATE_SOURCE_AND_ARTIFACT_CLEANUP=PASS

  native-schema-migration:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-v017-bridge-v018-source-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, mariadb]
    services:
      db:
        image: ${{ matrix.engine == 'mysql' && 'mysql:8.4' || 'mariadb:11.8' }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-r43-schema
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-r43-schema
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="sh -c 'mariadb-admin ping --silent || mysqladmin ping --silent'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      DB_CONNECTION: ${{ matrix.engine }}
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: p08_ci_r43_dev_schema
      DB_USERNAME: root
      DB_PASSWORD: synthetic-r43-schema
      SESSION_DRIVER: array
      CACHE_STORE: array
      GITHUB_ACTIONS: 'true'
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - name: Original v016 schema exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-issued
      - name: Source-locked v017 bridge plan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 19e81c68fb1de3ce2bc2e938ba243341dca79519
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-bridge
      - name: Exact v018 new migration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8d645d498fec5271434f4756c8b483d455575ed4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-target
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Native disposable old-schema to new-schema with owner persistence and fault rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test "$(git -C private-p08-issued rev-parse HEAD)" = 'ed96b18627cd0a63b1da20a1fd8c9b6c1808f159'
          test "$(git -C private-p08-bridge rev-parse HEAD)" = '19e81c68fb1de3ce2bc2e938ba243341dca79519'
          test "$(git -C private-p08-target rev-parse HEAD)" = '8d645d498fec5271434f4756c8b483d455575ed4'
          php -l private-p08-bridge/src/Upgrade/R43AdditiveSchemaPlan.php > "$RUNNER_TEMP/p08-r43-schema-lint.log" 2>&1
          php -l private-p08-bridge/tests/compatibility/r43_isolated_schema_native.php >> "$RUNNER_TEMP/p08-r43-schema-lint.log" 2>&1
          for d in private-p08-issued private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_NATIVE_SCHEMA_DEPS=FAIL; exit 1; }
          done
          php -r '$p = new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("DB_PASSWORD")); $p->exec("CREATE DATABASE p08_ci_r43_dev_schema");'
          (cd private-p08-issued && php artisan migrate --force > "$RUNNER_TEMP/p08-r43-issued-schema.log" 2>&1) || { echo P08_R43_NATIVE_ISSUED_BASE_MIGRATE=FAIL; exit 1; }
          php private-p08-bridge/tests/compatibility/r43_isolated_schema_native.php private-p08-target > "$RUNNER_TEMP/p08-r43-native-schema.log" 2>&1 || { echo P08_R43_NATIVE_SCHEMA_TEST=FAIL; grep -E 'R43_|P08_R43_|PHP Fatal|Error' "$RUNNER_TEMP/p08-r43-native-schema.log" | tail -n 15 || true; exit 1; }
          grep -q 'P08_R43_NATIVE_EMPTY_TABLE_ROLLBACK_OWNER_PARITY=PASS' "$RUNNER_TEMP/p08-r43-native-schema.log"
          echo P08_R43_NATIVE_SIX_MIGRATION_FAULT_AND_ROLLBACK=PASS engine=${{ matrix.engine }}
      - name: Clear private source and synthetic secrets
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-issued private-p08-bridge private-p08-target
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.log
          test ! -e private-p08-issued && test ! -e private-p08-bridge && test ! -e private-p08-target
          echo P08_R43_NATIVE_SCHEMA_PRIVATE_CLEANUP=PASS

  sqlite-schema-migration:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'evidence/p08-r43-v017-bridge-v018-source-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_KEY: base64:REREREREREREREREREREREREREREREREREREREREREQ=
      DB_CONNECTION: sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      P08_ISOLATED_INSTALL_TEST: 'YES'
      P08_R43_DISPOSABLE_SCHEMA: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: ed96b18627cd0a63b1da20a1fd8c9b6c1808f159
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-issued
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 19e81c68fb1de3ce2bc2e938ba243341dca79519
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-bridge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 8d645d498fec5271434f4756c8b483d455575ed4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: private-p08-target
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: pdo_mysql, pdo_sqlite, sqlite3, zip, mbstring, intl, bcmath, dom, fileinfo
      - name: Real old SQLite schema and disposable v018 migrations/rollback/fault
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          export DB_DATABASE="$RUNNER_TEMP/p08-r43-old-v016.sqlite"
          test ! -e "$DB_DATABASE"
          touch "$DB_DATABASE"
          for d in private-p08-issued private-p08-target; do
            mkdir -p "$d/bootstrap/cache" "$d/storage/framework/cache/data" "$d/storage/framework/sessions" "$d/storage/framework/views" "$d/storage/logs"
            (cd "$d" && composer install --no-scripts --prefer-dist --no-interaction --no-progress > "$RUNNER_TEMP/p08-r43-$d-composer.log" 2>&1) || { echo P08_R43_SQLITE_DEPENDENCIES=FAIL; exit 1; }
          done
          (cd private-p08-issued && php artisan migrate --force > "$RUNNER_TEMP/p08-r43-issued-schema.log" 2>&1) || { echo P08_R43_SQLITE_ISSUED_MIGRATE=FAIL; exit 1; }
          php private-p08-bridge/tests/compatibility/r43_isolated_schema_native.php private-p08-target > "$RUNNER_TEMP/p08-r43-sqlite-schema.log" 2>&1 || { echo P08_R43_SQLITE_SCHEMA_TEST=FAIL; grep -E 'R43_|P08_R43_|PHP Fatal|Error' "$RUNNER_TEMP/p08-r43-sqlite-schema.log" | tail -n 15 || true; exit 1; }
          grep -q 'P08_R43_NATIVE_EMPTY_TABLE_ROLLBACK_OWNER_PARITY=PASS' "$RUNNER_TEMP/p08-r43-sqlite-schema.log"
          echo P08_R43_NATIVE_SIX_MIGRATION_FAULT_AND_ROLLBACK=PASS engine=sqlite
      - name: Delete all private checked out source and temp SQLite
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- private-p08-issued private-p08-bridge private-p08-target
          rm -f -- "$RUNNER_TEMP"/p08-r43-*.log "$RUNNER_TEMP"/p08-r43-old-v016.sqlite "$RUNNER_TEMP"/p08-r43-old-v016.sqlite-wal "$RUNNER_TEMP"/p08-r43-old-v016.sqlite-shm
          test ! -e private-p08-issued && test ! -e private-p08-bridge && test ! -e private-p08-target
          echo P08_R43_SQLITE_SCHEMA_PRIVATE_CLEANUP=PASS
