name: S01 embed exact theme PHP regressions
on:
  push:
    branches: [task/s01-embed-recheck-20261031]
    paths: ['.github/workflows/s01-embed-php-regression-20261031.yml']
permissions:
  contents: read
jobs:
  php-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 7a57972416ab0f6185f97c61117c8de4c21e70d2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: theme
      - name: Run same bounded PHP contracts as theme workflow
        run: |
          set -Eeuo pipefail
          cd theme
          test "$(git rev-parse HEAD)" = 7a57972416ab0f6185f97c61117c8de4c21e70d2
          php --version
          for file in src/inc/modules/module-faq.php src/inc/seo-parts/seo-jsonld.php tests/player-faq-copy-contract.php tests/player-advanced-seo-jsonld-contract.php; do
            if [[ -f "$file" ]]; then php -l "$file"; fi
          done
          for file in tests/player-faq-copy-contract.php tests/player-advanced-seo-jsonld-contract.php; do
            if [[ -f "$file" ]]; then php "$file"; fi
          done
