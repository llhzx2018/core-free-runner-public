name: P02 V2.5.38 Compact Workbench Release

on:
  push:
    branches:
      - task/p02-v2538-compact-workbench-release-20260919
    paths:
      - '.github/workflows/p02-v2538-compact-workbench-release-20260919.yml'

permissions:
  contents: read

jobs:
  formal-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT_BRANCH: release/p02-v2538-inkstone-compact-workbench-20260919
      EXPECTED_PRESEAL: 3feb653d2fcc1f0340fbdc8de521c7b05d36eb74
      TARGET_VERSION: 2.5.38
      SOURCE35_VERSION: 2.5.36
      SOURCE36_VERSION: 2.5.37
      SCHEMA: '2401'
      RETRY_MARKER: '3'
    steps:
      - name: Require registered release capability
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: test -n "$RELEASE_TOKEN"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, zip, curl, mbstring, openssl
          coverage: none

      - name: Checkout P02 V2.5.38 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: ${{ env.PRODUCT_BRANCH }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: product

      - name: Checkout exact V2.5.36 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.36
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source35

      - name: Checkout exact V2.5.37 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: v2.5.37
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: source36

      - name: Run exact formal gate and publish
        env:
          RELEASE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: bash tmp/p02-v2538-formal-gate.sh
