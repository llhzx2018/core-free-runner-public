name: S01 Theme exact formal release
on:
  push:
    branches: [task/s01-history162-20261022]
    paths: ['.github/workflows/s01-history162-formal.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.162
  TARGET_SHA: 2be0168bce3d4ba4e9880f06bff532479a3c5ad0
  TARGET_TREE: aea247ce09418f91a3216b059bde44508f4ce1f9
  BASE_SHA: 3fb4432fa30faabf6c61574f62a4d0bc796e2cc0
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 2be0168bce3d4ba4e9880f06bff532479a3c5ad0
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - name: Exact verified candidate and merged source readback
        env:
          GH_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p proof provider candidate-proof
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39700085035 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/39700085035 --jq .head_sha)" = ac21fbc08f53e1f80878c708a56d1cd39ef925a1
          test "$(gh api repos/$TARGET_REPO/commits/main --jq .sha)" = "$TARGET_SHA"
          test "$(gh api repos/$TARGET_REPO/git/commits/$TARGET_SHA --jq .tree.sha)" = "$TARGET_TREE"
          gh run download 39700085035 --repo llhzx2018/core-free-runner-public --name s01-page-history-39700085035 --dir candidate-proof
          python3 control/lanes/s01-history162-20261022/package.py
          python3 - <<'PYVERIFY'
          import json,pathlib
          old=json.loads(pathlib.Path('candidate-proof/package.json').read_text())
          new=json.loads(pathlib.Path('proof/package.json').read_text())
          browser=json.loads(pathlib.Path('candidate-proof/browser-results.json').read_text())
          assert browser['status']=='PASS' and browser['passed']==browser['count']
          for k in ['status','version','tree','sha256','bytes','files']:assert old[k]==new[k],k
          assert new['sha256']=='3ad005de80b78d3cf703695aa67690d7a79b5a5f87104592d3e1b2e0f18db844' and new['bytes']==1976859
          print('MERGED_TREE_EQUALS_TESTED_TREE_AND_EXACT_PACKAGE_PASS')
          PYVERIFY
      - name: Formal release only exact verified bytes
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view v1.35.162 --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release create v1.35.162 provider/vf-tools-theme_V1.35.162.zip --repo "$TARGET_REPO" --target "$TARGET_SHA" --title 'VF Tools Theme V1.35.162' --notes '前台总览为20类页型及公共页头页尾显示已发布版本的桌面精修范围与原始证据；没有人工记录时明确说明未保存，不把历史验证自动视为当前站或手机通过。保留人工备注、版本复核及未知schema保护。定向后台浏览器与161→162原生升级回退重装和数据保留验证通过后发布。M3U8保持1.25.94，Owner手工升级Production。' --latest
          fi
          test "$(gh api repos/$TARGET_REPO/git/ref/tags/v1.35.162 --jq .object.sha)" = "$TARGET_SHA"
          test "$(gh release view v1.35.162 --repo "$TARGET_REPO" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
      - name: Authenticated formal asset remote bytes readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download v1.35.162 --repo "$TARGET_REPO" --pattern vf-tools-theme_V1.35.162.zip --dir remote
          cmp provider/vf-tools-theme_V1.35.162.zip remote/vf-tools-theme_V1.35.162.zip
          echo '3ad005de80b78d3cf703695aa67690d7a79b5a5f87104592d3e1b2e0f18db844  remote/vf-tools-theme_V1.35.162.zip' | sha256sum -c
          test "$(stat -c %s remote/vf-tools-theme_V1.35.162.zip)" = 1976859
          gh release view v1.35.162 --repo "$TARGET_REPO" --json url,publishedAt,tagName > proof/formal-release.json
          echo FORMAL_RELEASE_EXACT_REMOTE_ASSET_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s01-history-formal-${{ github.run_id }}
          path: proof/
          retention-days: 14
      - name: Cleanup private sources packages
        if: always()
        run: rm -rf target provider remote candidate-proof
