name: P05 V1.1.2 Prepare Release Source

on:
  push:
    branches:
      - release/p05-v1.1.2-orchestrator-20260830
    paths:
      - '.github/workflows/p05-v1.1.2-prepare-release-source.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPO: llhzx2018/vf-seo
      TARGET_BRANCH: release/p05-v1.1.2-browser-first-20260830
      TARGET_VERSION: 1.1.2
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
    steps:
      - name: Verify release write token
        run: test -n "$GH_TOKEN" || { echo TOKEN_MISSING; exit 78; }

      - name: Checkout P05 release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: release/p05-v1.1.2-browser-first-20260830
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: p05

      - name: Apply V1.1.2 release identity
        working-directory: p05
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          version = '1.1.2'
          root = Path('.')

          (root / 'VERSION').write_text(version + '\n', encoding='utf-8')

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = version
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          project_path = root / 'VF_PROJECT.json'
          project = json.loads(project_path.read_text(encoding='utf-8'))
          project['status'] = 'V1.1.2_RELEASE_CANDIDATE / DEPLOYMENT_READY / PRODUCTION_NOT_DEPLOYED'
          project['version'] = version
          project['target_version'] = version
          project['working_version'] = version
          project['version_change'] = True
          project['release_authorization'] = 'OWNER_AUTHORIZED_V1.1.2'
          project['next_action'] = 'P05 V1.1.2 RELEASE AUTHORIZED; RUN EXACT SOURCE / EXACT MAIN / PUBLICATION / DISTRIBUTION CLOSURE; PRODUCTION REMAINS NOT_DEPLOYED'
          project['v1_1_2_browser_first_install'] = {
              'state': 'RELEASE_CANDIDATE',
              'capability': 'BROWSER_FIRST_ZERO_SSH_FIRST_INSTALL',
              'source_main_before_version_bump': '7fc30cf980e3c175888336879a62fcd5dcaf9964',
              'verified_feature_source': '8d7158cc344cae2998cc6fa094cfd7999febb1a8',
              'verified_feature_tree': 'df4f8609081ad1a67834424ebbfbcfb1c636232f',
              'machine_gate_repository': 'llhzx2018/core-free-runner-public',
              'machine_gate_run': 33295759635,
              'machine_gate_job': 99215017153,
              'machine_gate': 'PASS',
              'browser': 'GOOGLE_CHROME_151',
              'mobile_390': 'PASS',
              'desktop_1440': 'PASS',
              'normal_install_requires_shell': False,
              'setup_path': '/setup',
              'setup_lock': '$HOME/.config/vf-seo/setup.lock.json',
              'production_state': 'NOT_DEPLOYED'
          }
          project_path.write_text(json.dumps(project, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'Repository VERSION: 1.1.1 · MAIN CONTAINS UNRELEASED BROWSER-FIRST INSTALL IMPROVEMENT',
              'Repository VERSION: 1.1.2 · RELEASE CANDIDATE / BROWSER-FIRST MACHINE PASS'
          )
          readme = readme.replace(
              'Browser-first Install: MERGED TO MAIN / MACHINE PASS / NOT FORMALLY RELEASED',
              'Browser-first Install: RELEASE CANDIDATE / MACHINE PASS / PRODUCTION NOT DEPLOYED'
          )
          readme = readme.replace(
              '`v1.1.1` 的正式 Tag / GitHub Release / FULL 资产保持不可变；当前 `main` 已在其后合入 Browser-first Zero-SSH 首次安装能力，但该能力尚未形成新的 Formal Release，也未部署到 Production。Formal Release、Current Source 与 Production Deployment 必须分开判断。',
              '`v1.1.1` 的正式 Tag / GitHub Release / FULL 资产保持不可变；仓库现已进入 `v1.1.2` Browser-first Zero-SSH Release Candidate。正式发布前 `v1.1.1` 仍是 Current Formal Release；Production 继续 `NOT_DEPLOYED`。'
          )
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## 1.1.2 · Browser-first Zero-SSH Install（Release Candidate · 2026-08-30）'
          if heading not in changelog:
              insert = '''\n## 1.1.2 · Browser-first Zero-SSH Install（Release Candidate · 2026-08-30）\n\n- 正常首次安装改为：上传 FULL ZIP → 解压 → 打开域名 → `/setup` → 管理员账号/密码 → 一键初始化 → Setup Lock → 进入系统。\n- 普通首次安装不再要求 SSH、Shell、手工 `.env`、手工 Migration 或 CLI 创建管理员。\n- 新增共享 `RuntimePaths`、`MigrationService`、`AdminService`，Browser Setup 与 CLI 使用同一 Authority。\n- 保持 Setup CSRF、Same-Origin / Fetch Metadata、非本机 HTTPS、Existing Data Protection、私有 SQLite/Runtime Config、CLI HTTP 404 fail-closed。\n- Clean FULL、CloudPanel direct-extract、真实 Google Chrome 151、390/1440 viewport、Security/Dependency/Source/Scope 全链已在 Public Runner Run `33295759635` / Job `99215017153` 通过。\n- Schema 继续 `VF-SEO-SCHEMA@1 / 1`；Distribution 继续 `FULL_ONLY` / `from_versions=[]`。\n- Production 继续 `NOT_DEPLOYED`，本 Patch 只发布 Browser-first 首次安装能力。\n\n'''
              changelog = changelog.replace('# 变更记录\n', '# 变更记录\n' + insert, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

          test "$(cat VERSION)" = "$TARGET_VERSION"
          test "$(jq -r .version package.json)" = "$TARGET_VERSION"
          test "$(jq -r .version VF_PROJECT.json)" = "$TARGET_VERSION"
          test "$(jq -r .target_version VF_PROJECT.json)" = "$TARGET_VERSION"
          test "$(jq -r .working_version VF_PROJECT.json)" = "$TARGET_VERSION"
          git diff --check

      - name: Commit and push release source
        working-directory: p05
        shell: bash
        run: |
          set -euo pipefail
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add VERSION package.json VF_PROJECT.json README.md CHANGELOG.md
          git diff --cached --quiet && { echo NO_CHANGES; exit 1; }
          git commit -m 'release(P05): prepare V1.1.2 browser-first source'
          git push origin HEAD:$TARGET_BRANCH
          echo "P05_V112_PREPARED_SHA=$(git rev-parse HEAD)"
          echo P05_V112_RELEASE_SOURCE_PREPARE=PASS
