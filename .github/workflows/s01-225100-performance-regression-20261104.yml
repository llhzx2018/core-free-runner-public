name: S01 Theme225 M3U8-100 real WP performance regression
on:
  push:
    branches: [test/s01-m3u8-125100-wp-security-20261104]
    paths: [.github/workflows/s01-225100-performance-regression-20261104.yml]
permissions: {contents: read}
jobs:
  scoped-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      db:
        image: mariadb:11.8
        env: {MARIADB_DATABASE: s01_perf, MARIADB_USER: vf, MARIADB_PASSWORD: vf, MARIADB_ROOT_PASSWORD: fixture-only}
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pfixture-only"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: 93e1fccec37f7b608a18c1d49711e9dc563bb973
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: theme
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: 20f5ce58567c5380843229c6e737a7d1f0a498e7
          token: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'
          persist-credentials: false
          path: m3u8
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli,mbstring,intl,zip', coverage: none}
      - name: Exact identity and cold/warm real WordPress baseline
        shell: bash
        env: {GH_TOKEN: '${{ secrets.VF_PRIVATE_READ_TOKEN }}'}
        run: |
          set -Eeuo pipefail
          test "$(git -C theme rev-parse HEAD)" = 93e1fccec37f7b608a18c1d49711e9dc563bb973
          test "$(git -C m3u8 rev-parse HEAD)" = 20f5ce58567c5380843229c6e737a7d1f0a498e7
          test -n "$GH_TOKEN"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php8.3-mysql php8.3-xml php8.3-mbstring php8.3-curl php8.3-zip >/dev/null
          curl -fsSLo /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
          mkdir -p "$RUNNER_TEMP/zips" "$RUNNER_TEMP/site"
          gh release download v1.35.224 -R llhzx2018/vf-tools-theme -p vf-tools-theme_V1.35.224.zip -D "$RUNNER_TEMP/zips"
          gh release download v1.25.99 -R llhzx2018/vf-tools-m3u8 -p vf-tools-m3u8_V1.25.99.zip -D "$RUNNER_TEMP/zips"
          gh release download v1.21.1114 -R llhzx2018/vf-tools-ops -p vf-tools-ops_V1.21.1114.zip -D "$RUNNER_TEMP/zips"
          echo "7d64ce96ac15c482b653666a54fd587437b8aa214a73eb82e6e6771eaa02a4de  $RUNNER_TEMP/zips/vf-tools-theme_V1.35.224.zip" | sha256sum -c
          echo "7bd5c648fc1eb3513896404e8d433bc64044ce79928ddf7ed79f73b2fd2ba2a4  $RUNNER_TEMP/zips/vf-tools-m3u8_V1.25.99.zip" | sha256sum -c
          echo "07accbb20cb23fae08d308f23be729a62daadc6d252c3a4ff213d550030e49a3  $RUNNER_TEMP/zips/vf-tools-ops_V1.21.1114.zip" | sha256sum -c
          wp core download --path="$RUNNER_TEMP/site" --version=7.1.3 --allow-root --quiet
          wp config create --path="$RUNNER_TEMP/site" --dbname=s01_perf --dbuser=vf --dbpass=vf --dbhost=127.0.0.1:3306 --skip-check --allow-root >/dev/null
          wp core install --path="$RUNNER_TEMP/site" --url=http://127.0.0.1:18943 --title=S01 --admin_user=fixture --admin_password=fixture-only --admin_email=fixture@example.invalid --skip-email --allow-root >/dev/null
          wp theme install "$RUNNER_TEMP/zips/vf-tools-theme_V1.35.224.zip" --activate --path="$RUNNER_TEMP/site" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/zips/vf-tools-ops_V1.21.1114.zip" --activate --path="$RUNNER_TEMP/site" --allow-root >/dev/null
          wp plugin install "$RUNNER_TEMP/zips/vf-tools-m3u8_V1.25.99.zip" --activate --path="$RUNNER_TEMP/site" --allow-root >/dev/null
          cat > "$RUNNER_TEMP/site/.router.php" <<'PHP'
          <?php
          $u = parse_url($_SERVER['REQUEST_URI'],PHP_URL_PATH);
          if (is_string($u) && $u!=='/') {
            if (is_file(__DIR__.$u)) return false;
            if (is_dir(__DIR__.$u) && is_file(__DIR__.$u.'/index.php')) return false;
          }
          require __DIR__.'/index.php';
          PHP
          php -S 127.0.0.1:18943 -t "$RUNNER_TEMP/site" "$RUNNER_TEMP/site/.router.php" > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30);do if curl -fsS http://127.0.0.1:18943/ >/dev/null;then break;fi;sleep 1;done
          for i in $(seq 1 4);do curl -fsS http://127.0.0.1:18943/ >/dev/null;done
          for i in $(seq 1 14);do curl -fsS -o /dev/null -w '%{time_starttransfer}\n' http://127.0.0.1:18943/;done > "$RUNNER_TEMP/baseline.txt"
          cp -a theme/src/. "$RUNNER_TEMP/site/wp-content/themes/vf-tools-theme/"
          cp -a m3u8/src/. "$RUNNER_TEMP/site/wp-content/plugins/vf-tools-m3u8/"
          test "$(wp theme get vf-tools-theme --field=version --path="$RUNNER_TEMP/site" --allow-root)" = 1.35.225
          test "$(wp plugin get vf-tools-m3u8 --field=version --path="$RUNNER_TEMP/site" --allow-root)" = 1.25.100
          for i in $(seq 1 4);do curl -fsS http://127.0.0.1:18943/ >/dev/null;done
          for i in $(seq 1 14);do curl -fsS -o /dev/null -w '%{time_starttransfer}\n' http://127.0.0.1:18943/;done > "$RUNNER_TEMP/candidate.txt"
          python3 - <<'PY'
          import os,pathlib,statistics
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          def metrics(name):
            a=[float(x) for x in (root/name).read_text().split()]
            assert len(a)==14 and max(a)<4
            a.sort()
            return {'median':round(statistics.median(a),4),'p95':round(a[13],4),'samples':len(a)}
          a=metrics('baseline.txt');b=metrics('candidate.txt')
          print('S01_SCOPED_PERFORMANCE_BASELINE',a)
          print('S01_SCOPED_PERFORMANCE_CANDIDATE',b)
          assert b['median']<=a['median']*1.40+0.15, 'median regression'
          assert b['p95']<=a['p95']*1.50+0.20, 'p95 regression'
          print('S01_225100_REAL_WP_HTTP_TTFB_REGRESSION=PASS')
          PY
      - name: Cleanup source ZIP and synthetic database
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/server.pid"; then kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true; fi
          rm -rf theme m3u8 "$RUNNER_TEMP/site" "$RUNNER_TEMP/zips" "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/server.pid" "$RUNNER_TEMP/baseline.txt" "$RUNNER_TEMP/candidate.txt" /tmp/wp-cli.phar
