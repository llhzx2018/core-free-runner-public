name: P07 VPS Suite Installer Experiment

on:
  push:
    branches:
      - experiment/p07-netcheck-v01
    paths:
      - installers/p07-vps-suite-experiment.sh
      - .github/workflows/p07-vps-suite-installer-experiment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer syntax and safety
        run: |
          bash -n installers/p07-vps-suite-experiment.sh
          ! grep -F -- '--no-check-certificate' installers/p07-vps-suite-experiment.sh
          ! grep -Eq 'curl[[:space:]].*(-k|--insecure)' installers/p07-vps-suite-experiment.sh
          ! grep -Eq 'apt(-get)? install|yum install|dnf install' installers/p07-vps-suite-experiment.sh
          grep -F 'vfops_integration=NOT_RUN' installers/p07-vps-suite-experiment.sh
          grep -F 'P07_SUITE_NO_LAUNCH' installers/p07-vps-suite-experiment.sh

      - name: Real public install
        run: |
          sudo env P07_SUITE_NO_LAUNCH=1 bash installers/p07-vps-suite-experiment.sh | tee /tmp/install.txt
          grep -F 'Inspect' /tmp/install.txt
          grep -F 'Benchmark' /tmp/install.txt
          grep -F 'NetCheck' /tmp/install.txt
          grep -F 'SELF_TEST PASS' /tmp/install.txt
          grep -F 'p07-vpscheck' /tmp/install.txt

      - name: Installed commands and dispatcher
        run: |
          test -x /opt/p07-vps-suite/modules/p07-inspect.sh
          test -x /opt/p07-vps-suite/modules/p07-benchmark.sh
          test -x /opt/p07-vps-suite/modules/p07-netcheck.sh
          test -x /opt/p07-vps-suite/p07-vpscheck
          test -L /usr/local/bin/p07-inspect
          test -L /usr/local/bin/p07-benchmark
          test -L /usr/local/bin/p07-netcheck
          test -L /usr/local/bin/p07-vpscheck
          bash -n /usr/local/bin/p07-vpscheck
          p07-inspect --version | grep -F '0.3.0'
          p07-benchmark --version | grep -F '0.4.0'
          p07-netcheck --version | grep -F '0.5.0'
          printf '0\n' | NO_COLOR=1 p07-vpscheck | grep -F 'P07 · VPS 验机套件'

      - name: Manifest exact identities
        run: |
          f=/opt/p07-vps-suite/INSTALL_MANIFEST.txt
          test -s "$f"
          grep -F 'suite_version=0.2.0' "$f"
          grep -F 'inspect_blob=93a2dfb95a29d799a176aa4dcaf62308b36fb2d9' "$f"
          grep -F 'benchmark_blob=e00321a725b8eae7564ae7939d17b7c354719090' "$f"
          grep -F 'netcheck_blob=f6141eb76ff5808d1eacd1d23bd82e2a68c61b7d' "$f"
          grep -F 'suite_dispatcher=p07-vpscheck' "$f"
          grep -F 'vfops_integration=NOT_RUN' "$f"

      - name: Installed demo smoke
        run: |
          NO_COLOR=1 p07-inspect --demo | grep -F 'CloudPanel Sites'
          NO_COLOR=1 p07-benchmark --demo --network --yes | grep -F 'Suzhou CN'
          NO_COLOR=1 p07-netcheck --demo --china | grep -F '综合判断：高风险'
