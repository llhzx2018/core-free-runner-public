name: P01 V2.21.25 Formal Artifact Gate

on:
  push:
    branches:
      - task/p01-v22125-release-candidate-prep-20260828
    paths:
      - '.github/workflows/p01-v22125-formal-artifact-gate-20260828.yml'

permissions:
  contents: read

env:
  PRODUCT_REPO: llhzx2018/vf-start
  CANDIDATE: 6bc09cd152210183972dcb3f2c361eb65a4cadab
  CANDIDATE_TREE: 56ab66918e394477faad175e5ce9656eb0bc7b3f
  SOURCE_TAG: v2.21.24
  SOURCE_COMMIT: 7363949d18f44652458ec7ef0f7c67c9cae1bbb4
  VERSION: 2.21.25
  SOURCE_VERSION: 2.21.24
  SCHEMA: '2026080902'
  OUT: /tmp/p01-v22125-artifacts

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl
          coverage: none

      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Checkout exact production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.SOURCE_TAG }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: production

      - name: Exact source and package boundary fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git -C production rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '\r\n' < candidate/VERSION)" = "$VERSION"
          test "$(tr -d '\r\n' < candidate/src/VERSION.txt)" = "$VERSION"
          test "$(tr -d '\r\n' < production/VERSION)" = "$SOURCE_VERSION"
          test "$(tr -d '\r\n' < production/src/VERSION.txt)" = "$SOURCE_VERSION"
          find candidate/src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l >/dev/null
          find candidate/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check >/dev/null
          echo P01_ARTIFACT_SOURCE_FENCE=PASS

      - name: Load proven P01 atomic builders
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone -q --depth 1 --branch agent/p01-22121-formal-artifact-gate-20260819 https://github.com/llhzx2018/core-free-runner-public.git proven
          test -f proven/scripts/p01-build-release.py
          test -f proven/scripts/p01-build-release-v2.py
          echo P01_PROVEN_ATOMIC_BUILDER=PASS

      - name: Build deterministic FULL UPDATE and repair
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT"
          cat > /tmp/p01-build-22125.py <<'PY'
          from pathlib import Path
          import importlib.util, json, hashlib, base64

          ROOT=Path.cwd()
          VERSION='2.21.25'; SOURCE_VERSION='2.21.24'; SCHEMA='2026080902'
          CANDIDATE='6bc09cd152210183972dcb3f2c361eb65a4cadab'
          CANDIDATE_TREE='56ab66918e394477faad175e5ce9656eb0bc7b3f'
          SOURCE='7363949d18f44652458ec7ef0f7c67c9cae1bbb4'
          cand=ROOT/'candidate'/'src'; prod=ROOT/'production'/'src'; out=Path('/tmp/p01-v22125-artifacts')

          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              if spec is None or spec.loader is None: raise SystemExit(f'cannot load {path}')
              m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); return m
          base=load('p01_base',ROOT/'proven'/'scripts'/'p01-build-release.py')
          v2=load('p01_v2',ROOT/'proven'/'scripts'/'p01-build-release-v2.py')
          def sha(b): return hashlib.sha256(b).hexdigest()
          gate_only={'.gitignore','CHANGELOG.md','DEPLOY-HERE.txt','FULL-PACKAGE-NOTES.txt','README.md','UPGRADE-V2.txt','robots.txt'}
          def runtime(files):
              return {k:v for k,v in files.items() if k!='release-manifest.json' and k not in gate_only and k!='VF-Start-Browser-Extension.zip'}

          target_delivery=base.collect(cand)
          source_delivery=base.collect(prod)
          if target_delivery.get('VERSION.txt',b'').strip()!=VERSION.encode(): raise SystemExit('candidate VERSION.txt mismatch')
          if source_delivery.get('VERSION.txt',b'').strip()!=SOURCE_VERSION.encode(): raise SystemExit('source VERSION.txt mismatch')
          target=runtime(target_delivery); source=runtime(source_delivery)
          added=sorted(set(target)-set(source)); removed=sorted(set(source)-set(target))
          changed=sorted(k for k in target if k not in source or sha(target[k])!=sha(source[k]))
          if not changed: raise SystemExit('empty runtime delta')
          for required in ['app/CommonBaseline.php','system-info.php','system-baseline.php','system.php','update.php','data-safety.php','cli/baseline-verify.php']:
              if required not in target: raise SystemExit(f'missing V2 runtime file {required}')
          ext=json.loads(target_delivery['browser-extension/manifest.json'].decode('utf-8'))
          if str(ext.get('version'))!='1.6.4': raise SystemExit('browser helper drift')

          manifest={
            'project':'VF Start','project_id':'P01','project_slug':'vf-start','component_id':'APP',
            'version':VERSION,'source_version':SOURCE_VERSION,'schema_version':SCHEMA,
            'release_type':'formal','stage':'FORMAL_ARTIFACT_GATE','deployable':True,'release_authorized':False,
            'source_commit':CANDIDATE,'source_tree':CANDIDATE_TREE,'production_source_commit':SOURCE,
            'schema_change':False,'schema_migrations':[], 'runtime_data_included':False,'seed_user_business_data_included':False,
            'runtime_hashed_file_count':len(target),'runtime_files':{k:sha(v) for k,v in sorted(target.items())},
            'atomic_runtime_boundary':{'source_version':SOURCE_VERSION,'target_version':VERSION,'source_app_gate_count':len(source),'target_app_gate_count':len(target),'added_files':added,'removed_files':removed,'runtime_delta':changed},
            'browser_extension':{'version':'1.6.4','release_unit':'INDEPENDENT','released_this_round':False,'mechanical_version_bump':False},
            'update':{'project_id':'P01','component_id':'APP','manifest_truth':'llhzx2018/core-updates/projects/P01.json','release_truth':'GitHub Release','asset_name':f'VF-Start-V{VERSION}-UPDATE.zip','supported_from':[SOURCE_VERSION],'backup_required':True,'rollback_supported':True},
            'common_product_baseline':{'id':'VF-COMMON-PRODUCT-BASELINE@2.0','profile':'PERSONAL_SINGLE_ADMIN','current':True}
          }
          mb=(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          full=dict(target_delivery); full['release-manifest.json']=mb
          atomic=dict(target); atomic['release-manifest.json']=mb
          bridge=sha(target['app/UpdateManager.php'])
          repair=v2.build_repair(source,atomic,bridge)
          old_s="public const SOURCE_VERSION='2.21.14';"; old_t="public const TARGET_VERSION='2.21.15';"
          if repair.count(old_s)!=1 or repair.count(old_t)!=1: raise SystemExit('atomic version template anchor mismatch')
          repair=repair.replace(old_s,"public const SOURCE_VERSION='2.21.24';",1).replace(old_t,"public const TARGET_VERSION='2.21.25';",1)
          rp=out/f'server-update-v{VERSION}-repair.php'; rp.write_text(repair,encoding='utf-8',newline='\n')
          base.deterministic_zip(out/f'VF-Start-V{VERSION}-FULL.zip',full)
          base.deterministic_zip(out/f'VF-Start-V{VERSION}-UPDATE.zip',{rp.name:rp.read_bytes()})
          result={'project_id':'P01','version':VERSION,'source_version':SOURCE_VERSION,'candidate':CANDIDATE,'candidate_tree':CANDIDATE_TREE,'source_commit':SOURCE,'schema':SCHEMA,'runtime_source_files':len(source),'runtime_target_files':len(target),'runtime_added':added,'runtime_removed':removed,'runtime_delta':changed,'runtime_delta_count':len(changed),'status':'BUILD_PASS'}
          (out/'P01-V2.21.25-ARTIFACT-GATE.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          arts=[p for p in sorted(out.iterdir()) if p.is_file()]
          (out/'SHA256SUMS.txt').write_text(''.join(f'{base.sha256_file(p)}  {p.name}\n' for p in arts),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
          python3 /tmp/p01-build-22125.py | tee /tmp/p01-build-22125.log
          php -l "$OUT/server-update-v2.21.25-repair.php"
          php "$OUT/server-update-v2.21.25-repair.php" --self-test | tee /tmp/p01-repair-selftest.json
          jq -e '.ok==true and .global_barrier==true and .interruption_recovery==true' /tmp/p01-repair-selftest.json >/dev/null
          test -s "$OUT/VF-Start-V2.21.25-FULL.zip"
          test -s "$OUT/VF-Start-V2.21.25-UPDATE.zip"
          echo P01_V2_21_25_BUILD=PASS

      - name: Package safety and deterministic content gate
        shell: bash
        run: |
          set -Eeuo pipefail
          FULL="$OUT/VF-Start-V2.21.25-FULL.zip"
          UPDATE="$OUT/VF-Start-V2.21.25-UPDATE.zip"
          unzip -t "$FULL" >/dev/null
          unzip -t "$UPDATE" >/dev/null
          unzip -Z1 "$FULL" > /tmp/p01-full-files.txt
          ! grep -E '(^|/)(\.git|node_modules|private_data|PRIVATE_DATA)(/|$)|\.(sqlite|sqlite3|db|log|env)$|app/\.runtime\.php$|app/\.setup-key\.php$|app/\.setup\.lock$' /tmp/p01-full-files.txt
          grep -Fxq 'VERSION.txt' /tmp/p01-full-files.txt
          grep -Fxq 'app/CommonBaseline.php' /tmp/p01-full-files.txt
          grep -Fxq 'system-baseline.php' /tmp/p01-full-files.txt
          test "$(unzip -p "$FULL" VERSION.txt | tr -d '\r\n')" = "$VERSION"
          test "$(unzip -Z1 "$UPDATE" | wc -l)" -eq 1
          unzip -Z1 "$UPDATE" | grep -Fxq 'server-update-v2.21.25-repair.php'
          echo P01_PACKAGE_SAFETY=PASS

      - name: Clean FULL install gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/p01-v22125-full
          mkdir -p /tmp/p01-v22125-full
          unzip -q "$OUT/VF-Start-V2.21.25-FULL.zip" -d /tmp/p01-v22125-full
          cd /tmp/p01-v22125-full
          php -S 127.0.0.1:18251 -t . > /tmp/p01-v22125-full-server.log 2>&1 & PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18251/setup.php -o /tmp/p01-v22125-full-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v22125-full.cookies -b /tmp/p01-v22125-full.cookies http://127.0.0.1:18251/setup.php -o /tmp/p01-v22125-full-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v22125-full-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v22125-full.cookies -b /tmp/p01-v22125-full.cookies -X POST http://127.0.0.1:18251/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Full Gate' --data-urlencode 'admin_password=P01V22125!FullGate' --data-urlencode 'admin_password_confirm=P01V22125!FullGate' -o /tmp/p01-v22125-full-post.html
          test -f app/.runtime.php
          php cli/verify.php
          php cli/baseline-verify.php | tee /tmp/p01-v22125-full-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v22125-full-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v22125-full-baseline.txt
          test "$(tr -d '\r\n' < VERSION.txt)" = "$VERSION"
          echo P01_FULL_CLEAN_INSTALL=PASS

      - name: Exact atomic upgrade 2.21.24 to 2.21.25
        shell: bash
        run: |
          set -Eeuo pipefail
          setup_root(){
            ROOT="$1"; PORT="$2"; rm -rf "$ROOT"; cp -a production/src "$ROOT";
            php -S 127.0.0.1:"$PORT" -t "$ROOT" > "$ROOT-server.log" 2>&1 & local PID=$!;
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:"$PORT"/setup.php -o "$ROOT-setup.html" && break; sleep 1; done;
            curl -fsS -c "$ROOT.cookies" -b "$ROOT.cookies" http://127.0.0.1:"$PORT"/setup.php -o "$ROOT-setup.html";
            local CSRF; CSRF=$(python3 - "$ROOT-setup.html" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          );
            curl -fsS -c "$ROOT.cookies" -b "$ROOT.cookies" -X POST http://127.0.0.1:"$PORT"/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Upgrade Gate' --data-urlencode 'admin_password=P01V22124!UpgradeGate' --data-urlencode 'admin_password_confirm=P01V22124!UpgradeGate' -o "$ROOT-post.html";
            kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true;
            test -f "$ROOT/app/.runtime.php"; test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$SOURCE_VERSION";
          }
          REPAIR="$OUT/server-update-v2.21.25-repair.php"
          setup_root /tmp/p01-v22125-upgrade 18252
          php "$REPAIR" --verify-source=/tmp/p01-v22125-upgrade | tee /tmp/p01-v22125-source-verify.json
          jq -e '.ok==true' /tmp/p01-v22125-source-verify.json >/dev/null
          php "$REPAIR" --run=/tmp/p01-v22125-upgrade | tee /tmp/p01-v22125-upgrade-result.json
          jq -e '.ok==true and .already_current==false and .schema=="2026080902" and .integrity=="ok" and .fk==0' /tmp/p01-v22125-upgrade-result.json >/dev/null
          test "$(tr -d '\r\n' < /tmp/p01-v22125-upgrade/VERSION.txt)" = "$VERSION"
          php "$REPAIR" --verify-target=/tmp/p01-v22125-upgrade | jq -e '.ok==true' >/dev/null
          php /tmp/p01-v22125-upgrade/cli/verify.php
          php /tmp/p01-v22125-upgrade/cli/baseline-verify.php | tee /tmp/p01-v22125-upgrade-baseline.txt
          grep -Fx 'BASELINE_CORE_PASS=YES' /tmp/p01-v22125-upgrade-baseline.txt
          grep -Fx 'DRIFT_COUNT=0' /tmp/p01-v22125-upgrade-baseline.txt
          php "$REPAIR" --run=/tmp/p01-v22125-upgrade | tee /tmp/p01-v22125-idempotent.json
          jq -e '.ok==true and .already_current==true' /tmp/p01-v22125-idempotent.json >/dev/null
          echo P01_ATOMIC_UPGRADE=PASS

      - name: Atomic rollback injection gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT=/tmp/p01-v22125-rollback
          PORT=18253
          rm -rf "$ROOT"; cp -a production/src "$ROOT"
          php -S 127.0.0.1:$PORT -t "$ROOT" > /tmp/p01-v22125-rollback-server.log 2>&1 & PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:$PORT/setup.php -o /tmp/p01-v22125-rollback-setup.html && break; sleep 1; done
          curl -fsS -c /tmp/p01-v22125-rollback.cookies -b /tmp/p01-v22125-rollback.cookies http://127.0.0.1:$PORT/setup.php -o /tmp/p01-v22125-rollback-setup.html
          CSRF=$(python3 - <<'PY'
          import re
          s=open('/tmp/p01-v22125-rollback-setup.html',encoding='utf-8').read();m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s);assert m;print(m.group(1))
          PY
          )
          curl -fsS -c /tmp/p01-v22125-rollback.cookies -b /tmp/p01-v22125-rollback.cookies -X POST http://127.0.0.1:$PORT/setup.php --data-urlencode "setup_csrf=$CSRF" --data-urlencode 'site_title=P01 Rollback Gate' --data-urlencode 'admin_password=P01V22124!RollbackGate' --data-urlencode 'admin_password_confirm=P01V22124!RollbackGate' -o /tmp/p01-v22125-rollback-post.html
          kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true
          test -f "$ROOT/app/.runtime.php"
          set +e
          VF_ATOMIC_TEST_FAIL_AFTER_APPLY=1 php "$OUT/server-update-v2.21.25-repair.php" --run="$ROOT" > /tmp/p01-v22125-rollback.out 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0
          test "$(tr -d '\r\n' < "$ROOT/VERSION.txt")" = "$SOURCE_VERSION"
          php "$OUT/server-update-v2.21.25-repair.php" --verify-source="$ROOT" | jq -e '.ok==true' >/dev/null
          php "$ROOT/cli/verify.php"
          echo P01_ATOMIC_ROLLBACK=PASS

      - name: Final artifact verdict and hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$OUT"
          sha256sum VF-Start-V2.21.25-FULL.zip VF-Start-V2.21.25-UPDATE.zip server-update-v2.21.25-repair.php | tee /tmp/p01-v22125-final-sha.txt
          echo P01_V2_21_25_FORMAL_ARTIFACT_GATE=PASS
          echo CANDIDATE="$CANDIDATE"
          echo SOURCE="$SOURCE_COMMIT"
          echo VERSION="$VERSION"
          echo SCHEMA="$SCHEMA"
          echo PRODUCTION=NO

      - name: Upload formal release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P01-V2.21.25-FORMAL-ARTIFACTS
          path: |
            /tmp/p01-v22125-artifacts/VF-Start-V2.21.25-FULL.zip
            /tmp/p01-v22125-artifacts/VF-Start-V2.21.25-UPDATE.zip
            /tmp/p01-v22125-artifacts/server-update-v2.21.25-repair.php
            /tmp/p01-v22125-artifacts/P01-V2.21.25-ARTIFACT-GATE.json
            /tmp/p01-v22125-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
