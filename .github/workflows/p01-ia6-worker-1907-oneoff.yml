name: P01 IA V6 focused canonical failure diagnostics existing PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-worker-1907-oneoff.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia6-worker-1907-oneoff
  cancel-in-progress: false

jobs:
  isolated-transfer-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p01-ia6-worker-1907-a052ee61-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-start
      EXPECTED_SHA: f14e0204df2811199c664a53b6e0321c83a21223
      CANDIDATE: /tmp/p01-ia6-worker-1907-candidate
      RUNTIME: /tmp/p01-ia6-owner-native-1907
      P01_TEST_ORIGIN: http://127.0.0.1:18091
      P01_TEST_PASSWORD: SyntheticP01Worker!2026
    steps:
      - name: Checkout only public-safe runner workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact private source transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${READ_TOKEN:-}" || { echo 'PRIVATE_READ_TOKEN_UNAVAILABLE'; exit 40; }
          rm -rf "$CANDIDATE" "$RUNTIME"
          git clone -q --depth 1 --branch feat/p01-ia6-legacy-retirement-final-20261103 \
            "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$CANDIDATE" \
            >/dev/null 2>&1 || { echo 'EXACT_PRIVATE_CHECKOUT_BLOCKED'; exit 41; }
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo 'EXACT_SHA_DRIFT_BLOCKED'; exit 42;
          }
          test "$(tr -d '\r\n' <"$CANDIDATE/VERSION")" = '2.47.492'
          test "$(tr -d '\r\n' <"$CANDIDATE/src/VERSION.txt")" = '2.47.492'
          echo 'P01_IA6_PRIVATE_EXACT_SHA_AND_VERSION=PASS'

      - name: Diagnose 25 canonical failures only on exact product SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-xml php-gd >/dev/null
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "P01_CANONICAL_DIAGNOSTIC_SHA_LOCK=PASS"
          failures=0
          for test_name in 'admin_group_single_authority_r39_contract.php' 'admin_overview_action_board_v247321_contract.php' 'admin_plain_language_17_tasks_v247287_contract.php' 'admin_plugins_dead_nav_r40_contract.php' 'backend_ia_round1_v247269_contract.php' 'backend_ia_round3_resource_maintenance_v247271_contract.php' 'frontstage_daily_ops_r1_contract.php' 'ia_v2_r7_project_source_contract.php' 'legacy_entrypoint_convergence_r6_contract.php' 'links_dialog_cancel_save_guard_contract.php' 'music_security_contract.php' 'navigation_page_visual_closure_contract.php' 'navigation_v247262_closure_contract.php' 'p01_ia_v2_r10_admin_closure_contract.php' 'p01_ia_v2_r6_gov_source_ownership_contract.php' 'p01_ia_v2_r8_derived_tool_software_contract.php' 'p01_ia_v2_r9_resource_center_17_task_contract.php' 'p01_ia_v3_r6_direct_specialist_nav_contract.php' 'p01_navigation_duplicate_native_contract.php' 'p01_r1_subsite_admin_catalog_contract.php' 'tools_toolbox_manager_v247210_contract.php' 'url_availability_human_verdict_v247288_contract.php' 'url_health_action_first_r7_contract.php' 'url_health_decision_first_r10_contract.php' 'url_health_freshness_r9_contract.php'; do
            output="$(timeout 40 php "$CANDIDATE/tests/unit/$test_name" 2>&1)" && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              failures=$((failures+1))
              message="$(printf '%s' "$output" | tr '\n\r' '  ' | sed -E 's#[A-Za-z0-9_./-]+/tests/unit/#tests/unit/#g;s#[[:cntrl:]]# #g' | cut -c 1-300)"
              printf 'CANONICAL_DIAGNOSE_FAIL=%s;RC=%s;MESSAGE=%s\n' "$test_name" "$rc" "$message"
            else
              printf 'CANONICAL_DIAGNOSE_PASS=%s\n' "$test_name"
            fi
          done
          printf 'CANONICAL_DIAGNOSE_FAILURE_COUNT=%s\n' "$failures"
          test "$failures" -eq 25
          echo P01_CANONICAL_25_FAILURES_REPRODUCED=PASS

      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf "$CANDIDATE" "$RUNTIME" "/tmp/p01-ia6-491-source-$GITHUB_RUN_ID" "/tmp/p01-ia6-browser-deps-$GITHUB_RUN_ID" || true
          echo 'P01_IA6_ATOMIC_PUBLIC_RUNNER_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P01_IA6_ATOMIC_FORMAL_RELEASE_OR_DISTRIBUTION=NONE'
          echo 'P01_IA6_ATOMIC_PRODUCTION_MUTATION=NONE'
