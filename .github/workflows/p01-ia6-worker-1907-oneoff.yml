name: P01 IA V6 matched 491 492 performance preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-worker-1907-oneoff.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia6-worker-1907-oneoff
  cancel-in-progress: false

jobs:
  isolated-transfer-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p01-ia6-worker-1907-a052ee61-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-start
      EXPECTED_SHA: 8d8464ce6b46c482baa77b3f4bcaeef8da0ba50b
      CANDIDATE: /tmp/p01-ia6-worker-1907-candidate
      RUNTIME: /tmp/p01-ia6-gui-1907-runtime
      BASELINE: /tmp/p01-ia6-perf-source-491
      OLD_ROOT: /tmp/p01-ia6-perf-instance-491
      NEW_ROOT: /tmp/p01-ia6-perf-instance-492
      P01_TEST_ORIGIN: http://127.0.0.1:18091
      P01_TEST_PASSWORD: SyntheticP01Worker!2026
    steps:
      - name: Checkout only public-safe runner workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact private source transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${READ_TOKEN:-}" || { echo 'PRIVATE_READ_TOKEN_UNAVAILABLE'; exit 40; }
          if test -f /tmp/p01-ia6-perf-pids; then
            while read -r pid; do kill "$pid" 2>/dev/null || true; done </tmp/p01-ia6-perf-pids
          fi
          rm -rf "$BASELINE" "$OLD_ROOT" "$NEW_ROOT" "$CANDIDATE" "$RUNTIME"
          rm -f /tmp/p01-ia6-perf-pids /tmp/p01-ia6-perf-*.log /tmp/p01-ia6-perf-setup-*.html /tmp/p01-ia6-perf-post-*.html /tmp/p01-ia6-perf-cookie-*
          git clone -q --depth 1 --branch feat/p01-ia6-legacy-retirement-final-20261103 \
            "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$CANDIDATE" \
            >/dev/null 2>&1 || { echo 'EXACT_PRIVATE_CHECKOUT_BLOCKED'; exit 41; }
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo 'EXACT_SHA_DRIFT_BLOCKED'; exit 42;
          }
          test "$(tr -d '\r\n' <"$CANDIDATE/VERSION")" = '2.47.492'
          test "$(tr -d '\r\n' <"$CANDIDATE/src/VERSION.txt")" = '2.47.492'
          echo 'P01_IA6_PRIVATE_EXACT_SHA_AND_VERSION=PASS'
          git clone -q --depth 1 --branch v2.47.491 \
            "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$BASELINE" >/dev/null 2>&1 || { echo 'BASELINE_CLONE_BLOCKED'; exit 43; }
          test "$(git -C "$BASELINE" rev-parse HEAD)" = '9b1cf56c432833f6ae75b260ed9aae5207fbb0e0'
          test "$(tr -d '\r\n' <"$BASELINE/VERSION")" = '2.47.491'
          echo 'P01_IA6_FORMAL_491_BASELINE_IDENTITY=PASS'

      - name: Prepare ephemeral PHP and Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-xml php-gd >/dev/null
          php -m | grep -qi pdo_sqlite
          php -m | grep -qi sqlite3
          cd "$CANDIDATE"
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
          echo 'P01_IA6_ISOLATED_PHP_CHROMIUM=PASS'

      - name: Compare identical synthetic 232-row data and warm request latency
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e "$OLD_ROOT" && test ! -e "$NEW_ROOT" || exit 45
          : >/tmp/p01-ia6-perf-pids
          install_fixture() {
            local source="$1" root="$2" port="$3" origin="http://127.0.0.1:$3"
            mkdir -p "$root/tests/integration"
            cp -a "$source/src" "$root/src"
            cp "$source/tests/integration/p01_populated_pagination_fixture.php" "$root/tests/integration/"
            php -S "127.0.0.1:$port" -t "$root/src" >/tmp/p01-ia6-perf-"$port".log 2>&1 &
            echo $! >>/tmp/p01-ia6-perf-pids
            for i in $(seq 1 40); do
              if curl -fsS -c "/tmp/p01-ia6-perf-cookie-$port" -b "/tmp/p01-ia6-perf-cookie-$port" "$origin/setup.php" -o "/tmp/p01-ia6-perf-setup-$port.html" 2>/dev/null; then break; fi
              sleep 1
            done
            local csrf
            csrf="$(python3 - "/tmp/p01-ia6-perf-setup-$port.html" <<'PY'
          import re,sys,pathlib
          body=pathlib.Path(sys.argv[1]).read_text(encoding="utf8")
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',body)
          assert match, "MISSING_SYNTHETIC_CSRF"
          print(match.group(1))
          PY
            )"
            curl -fsS -c "/tmp/p01-ia6-perf-cookie-$port" -b "/tmp/p01-ia6-perf-cookie-$port" -X POST "$origin/setup.php" --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode "site_title=P01 Perf Isolated" \
              --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
              --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
              -o "/tmp/p01-ia6-perf-post-$port.html"
            test -f "$root/src/app/.runtime.php" || { echo 'ISOLATED_SETUP_FAILED_BEFORE_DATA_SEED'; exit 47; }
            (cd "$root/src" && php cli/verify.php | grep -Fx 'VERIFY_PASS=YES')
            P01_SYNTHETIC_PAGINATION=YES php "$root/tests/integration/p01_populated_pagination_fixture.php" |
              grep -Fx 'P01_POPULATED_PAGINATION_FIXTURE=PASS'
          }
          install_fixture "$BASELINE" "$OLD_ROOT" 18131
          install_fixture "$CANDIDATE" "$NEW_ROOT" 18132
          python3 - <<'PY'
          import time,json,math,statistics,urllib.request,urllib.error,http.cookiejar
          clients={}
          for version,port in (("491",18131),("492",18132)):
            cookie=http.cookiejar.CookieJar()
            opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookie))
            base=f"http://127.0.0.1:{port}"
            request=urllib.request.Request(base+"/api.php?action=login",method="POST",data=json.dumps({"password":"SyntheticP01Worker!2026"}).encode(),headers={"Content-Type":"application/json"})
            with opener.open(request,timeout=12) as response:
              assert response.status==200 and json.loads(response.read()).get("ok") is True,"LOGIN_FAILED"
            clients[version]=(opener,base)
          paths={"public_start":"/start.php?q=P01MULTIPAGE&sort=title",
                 "owner_inventory":"/api.php?action=resource_inventory&surface=all&limit=60"}
          def request(version,kind):
            opener,base=clients[version];start=time.perf_counter()
            with opener.open(urllib.request.Request(base+paths[kind],headers={"Cache-Control":"no-cache"}),timeout=12) as response:
              assert response.status==200,"BENCH_HTTP_FAILURE"
              body=response.read()
              if kind=="owner_inventory":
                j=json.loads(body)
                assert j.get("ok") is True and j.get("total",0)>=232,"BENCH_INVENTORY_MISSING"
              else: assert b"P01MULTIPAGE" in body and len(body)>1000,"BENCH_PUBLIC_FIXTURE_MISSING"
            return 1000*(time.perf_counter()-start)
          for i in range(3):
            for kind in paths:
              for version in clients:request(version,kind)
          results={kind:{"491":[],"492":[]} for kind in paths}
          for i in range(21):
            for kind in paths:
              order=("491","492") if i%2==0 else ("492","491")
              for version in order:results[kind][version].append(request(version,kind))
          failures=[]
          for kind,sets in results.items():
            a,b=sorted(sets["491"]),sorted(sets["492"])
            old,new=statistics.median(a),statistics.median(b)
            slow=new>old*2.5 and new>old+100
            if slow:failures.append(kind)
            print("P01_PERF_"+kind.upper()+"="+json.dumps({"median_491_ms":round(old,2),"median_492_ms":round(new,2),"p95_491_ms":round(a[19],2),"p95_492_ms":round(b[19],2),"samples_each":21,"material_regression":slow}))
          assert not failures,"MATERIAL_LATENCY_REGRESSION:"+",".join(failures)
          print("P01_IA6_MATCHED_232_ROW_PERF_491_TO_492=PASS")
          PY

      - name: Clean ephemeral source and report public-safe receipt
        if: always()
        shell: bash
        run: |
          rm -rf "$CANDIDATE" "$RUNTIME" /tmp/p01-ia6-cookie \
            /tmp/p01-ia6-setup.html /tmp/p01-ia6-setup-post.html \
            /tmp/p01-ia6-worker-server.log || true
          echo 'P01_IA6_PUBLIC_RUNNER_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P01_IA6_PUBLIC_RUNNER_PRODUCTION_MUTATION=NONE'
          echo 'P01_IA6_PUBLIC_RUNNER_RELEASE=NONE'
