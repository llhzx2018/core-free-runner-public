name: P01 IA V6 exact candidate final Atomic native browser and canonical gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-worker-1907-oneoff.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia6-worker-1907-oneoff
  cancel-in-progress: false

jobs:
  isolated-transfer-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p01-ia6-worker-1907-a052ee61-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-start
      EXPECTED_SHA: f14e0204df2811199c664a53b6e0321c83a21223
      CANDIDATE: /tmp/p01-ia6-worker-1907-candidate
      RUNTIME: /tmp/p01-ia6-owner-native-1907
      P01_TEST_ORIGIN: http://127.0.0.1:18091
      P01_TEST_PASSWORD: SyntheticP01Worker!2026
    steps:
      - name: Checkout only public-safe runner workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact private source transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${READ_TOKEN:-}" || { echo 'PRIVATE_READ_TOKEN_UNAVAILABLE'; exit 40; }
          rm -rf "$CANDIDATE" "$RUNTIME"
          git clone -q --depth 1 --branch feat/p01-ia6-legacy-retirement-final-20261103 \
            "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$CANDIDATE" \
            >/dev/null 2>&1 || { echo 'EXACT_PRIVATE_CHECKOUT_BLOCKED'; exit 41; }
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo 'EXACT_SHA_DRIFT_BLOCKED'; exit 42;
          }
          test "$(tr -d '\r\n' <"$CANDIDATE/VERSION")" = '2.47.492'
          test "$(tr -d '\r\n' <"$CANDIDATE/src/VERSION.txt")" = '2.47.492'
          echo 'P01_IA6_PRIVATE_EXACT_SHA_AND_VERSION=PASS'

      - name: Execute formal release baseline to candidate FULL and Atomic rollback gate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-xml php-gd unzip >/dev/null
          test -x "$(command -v gh)"
          php -m | grep -qi pdo_sqlite
          php -m | grep -qi zip
          bash scripts/p01-ia6-atomic-491-to-492-oneoff.sh


      - name: Exact-head PHP and native Owner Chromium route regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git hash-object scripts/p01-maintenance-release.py)" = 4233897ce7f6b1b321563c332380020d8e6cea3d
          php -l "$CANDIDATE/src/diagnose.php" >/dev/null
          php -l "$CANDIDATE/tests/unit/admin_diagnose_entry_closure_r1_contract.php" >/dev/null
          node --check "$CANDIDATE/tests/integration/p01_ia6_legacy_bookmark_native_browser.mjs"
          node "$CANDIDATE/tests/unit/p01_ia6_legacy_bookmark_native_contract.cjs"
          php "$CANDIDATE/tests/unit/admin_diagnose_entry_closure_r1_contract.php"
          echo P01_IA6_EXACT_DIAGNOSIS_SYNTAX_UNIT=PASS
          MODULES="/tmp/p01-ia6-browser-deps-$GITHUB_RUN_ID"
          LOG="/tmp/p01-ia6-owner-$GITHUB_RUN_ID.log"
          rm -rf "$RUNTIME" "$MODULES"
          mkdir -p "$MODULES"
          printf '{"name":"p01-ia6-disposable-browser","private":true}\n' >"$MODULES/package.json"
          npm --prefix "$MODULES" install --ignore-scripts --no-audit --no-fund playwright@1.57.0 >/dev/null
          "$MODULES/node_modules/.bin/playwright" install --with-deps chromium >/dev/null
          ln -s "$MODULES/node_modules" "$CANDIDATE/node_modules"
          cp -a "$CANDIDATE/src" "$RUNTIME"
          php -S 127.0.0.1:18091 -t "$RUNTIME" >"$LOG" 2>&1 &
          SERVER_PID=$!
          cleanup_browser() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -rf "$RUNTIME" "$MODULES"
            rm -f "$CANDIDATE/node_modules" "$LOG"
          }
          trap cleanup_browser EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-cookie-1907 -b /tmp/p01-ia6-cookie-1907 \
              "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-setup-1907.html 2>/dev/null; then break; fi
            sleep 1
          done
          CSRF="$(python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/p01-ia6-setup-1907.html').read_text()
          m=re.search(r'name="setup_csrf"\s+value="([^"]+)"',s)
          assert m,'setup csrf'
          print(m.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-cookie-1907 -b /tmp/p01-ia6-cookie-1907 -X POST \
            "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode 'site_title=IA6 Exact Native Gate' \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            -o /tmp/p01-ia6-installed-1907.html
          test -f "$RUNTIME/app/.runtime.php"
          (cd "$RUNTIME" && php cli/verify.php) | grep -Fx VERIFY_PASS=YES
          node "$CANDIDATE/tests/integration/p01_ia6_legacy_bookmark_native_browser.mjs"
          echo P01_IA6_EXACT_11_TAB_LEGACY_AND_DIAGNOSIS_CHROMIUM=PASS

      - name: Canonical PHP regression against published 2.47.491 Git baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          BASELINE_REPO="/tmp/p01-ia6-491-source-$GITHUB_RUN_ID"
          rm -rf "$BASELINE_REPO"
          git -C "$CANDIDATE" fetch -q --depth 1 origin refs/tags/v2.47.491
          test "$(git -C "$CANDIDATE" rev-parse FETCH_HEAD)" = 9b1cf56c432833f6ae75b260ed9aae5207fbb0e0
          git -C "$CANDIDATE" worktree add -q --detach "$BASELINE_REPO" FETCH_HEAD
          test "$(cat "$BASELINE_REPO/VERSION")" = 2.47.491
          bash "$CANDIDATE/tests/canonical_release_regression.sh" "$CANDIDATE" "$BASELINE_REPO"
          rm -rf "$BASELINE_REPO"
          echo P01_IA6_EXACT_CANONICAL_RELATIVE_TO_491=PASS

      - name: Cleanup transient private checkout
        if: always()
        shell: bash
        run: |
          rm -rf "$CANDIDATE" "$RUNTIME" "/tmp/p01-ia6-491-source-$GITHUB_RUN_ID" "/tmp/p01-ia6-browser-deps-$GITHUB_RUN_ID" || true
          echo 'P01_IA6_ATOMIC_PUBLIC_RUNNER_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P01_IA6_ATOMIC_FORMAL_RELEASE_OR_DISTRIBUTION=NONE'
          echo 'P01_IA6_ATOMIC_PRODUCTION_MUTATION=NONE'
