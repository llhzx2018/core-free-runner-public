name: P01 IA V6 exact-head Security Transfer Worker Recovery proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p01-ia6-worker-1907-oneoff.yml'

permissions:
  contents: read

concurrency:
  group: p01-ia6-worker-1907-oneoff
  cancel-in-progress: false

jobs:
  isolated-transfer-proof:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p01-ia6-worker-1907-a052ee61-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_REPOSITORY: llhzx2018/vf-start
      EXPECTED_SHA: 8d8464ce6b46c482baa77b3f4bcaeef8da0ba50b
      CANDIDATE: /tmp/p01-ia6-worker-1907-candidate
      RUNTIME: /tmp/p01-ia6-gui-1907-runtime
      P01_TEST_ORIGIN: http://127.0.0.1:18091
      P01_TEST_PASSWORD: SyntheticP01Worker!2026
    steps:
      - name: Checkout only public-safe runner workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Fetch exact private source transiently
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${READ_TOKEN:-}" || { echo 'PRIVATE_READ_TOKEN_UNAVAILABLE'; exit 40; }
          rm -rf "$CANDIDATE" "$RUNTIME"
          git clone -q --depth 1 --branch feat/p01-ia6-legacy-retirement-final-20261103 \
            "https://x-access-token:${READ_TOKEN}@github.com/${PRODUCT_REPOSITORY}.git" "$CANDIDATE" \
            >/dev/null 2>&1 || { echo 'EXACT_PRIVATE_CHECKOUT_BLOCKED'; exit 41; }
          test "$(git -C "$CANDIDATE" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo 'EXACT_SHA_DRIFT_BLOCKED'; exit 42;
          }
          test "$(tr -d '\r\n' <"$CANDIDATE/VERSION")" = '2.47.492'
          test "$(tr -d '\r\n' <"$CANDIDATE/src/VERSION.txt")" = '2.47.492'
          echo 'P01_IA6_PRIVATE_EXACT_SHA_AND_VERSION=PASS'

      - name: Prepare ephemeral PHP and Playwright
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 php-curl php-mbstring php-zip php-xml php-gd >/dev/null
          php -m | grep -qi pdo_sqlite
          php -m | grep -qi sqlite3
          cd "$CANDIDATE"
          npm install --no-audit --no-fund --no-save playwright@1.57.0 >/dev/null
          npx playwright install chromium >/dev/null
          echo 'P01_IA6_ISOLATED_PHP_CHROMIUM=PASS'

      - name: Exact-source focused unit contracts and syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$CANDIDATE"
          php -l src/app/FunctionalWorkspaceShell.php >/dev/null
          php -l src/data-safety.php >/dev/null
          php -l tests/integration/p01_ia6_disaster_roundtrip_disposable.php >/dev/null
          php -l tests/integration/p01_ia6_interrupted_restore_disposable.php >/dev/null
          node tests/unit/p01_ia6_disposable_recovery_version_identity_contract.cjs
          node tests/unit/p01_ia6_worker_manual_step_native_contract.cjs
          node tests/unit/p01_ia6_worker_continuation_r7_contract.cjs
          node tests/unit/p01_ia6_system_jobs_r1_contract.cjs
          node tests/unit/p01_ia6_transfer_protected_backup_readback_contract.cjs
          node tests/unit/p01_ia6_recovery_mutation_independent_readback_contract.cjs
          node tests/unit/p01_ia6_rss_mutation_readback_native.cjs
          php -l src/plugins/rss/RssService.php >/dev/null
          php -l src/plugins/rss/plugin.php >/dev/null
          node --check src/assets/frontstage-recovery-files.js
          node --check src/assets/frontstage-system-operations.js
          echo 'P01_IA6_EXACT_HIGH_RISK_UNIT_CONTRACTS=PASS'

      - name: FULL installation and real API plus Chromium browser tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a "$CANDIDATE/src" "$RUNTIME"
          cd "$RUNTIME"
          php -S 127.0.0.1:18091 -t . >/tmp/p01-ia6-worker-server.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS -c /tmp/p01-ia6-cookie -b /tmp/p01-ia6-cookie \
              "$P01_TEST_ORIGIN/setup.php" -o /tmp/p01-ia6-setup.html; then break; fi
            sleep 1
          done
          CSRF="$(python3 - <<'PY'
          import re
          text=open('/tmp/p01-ia6-setup.html',encoding='utf-8').read()
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',text)
          assert match,'No initial setup token'
          print(match.group(1))
          PY
          )"
          curl -fsS -c /tmp/p01-ia6-cookie -b /tmp/p01-ia6-cookie -X POST \
            "$P01_TEST_ORIGIN/setup.php" \
            --data-urlencode "setup_csrf=$CSRF" \
            --data-urlencode "site_title=P01 IA V6 Synthetic Test" \
            --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
            --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
            -o /tmp/p01-ia6-setup-post.html
          test -f app/.runtime.php
          php cli/verify.php | grep -F 'VERIFY_PASS=YES'
          cd "$CANDIDATE"
          node tests/integration/p01_ia6_worker_manual_step_browser.mjs
          node tests/integration/p01_ia6_worker_continuation_browser.mjs
          VF_E2E_RUNTIME_ROOT="$RUNTIME" VF_IA6_DISPOSABLE_ACK=IA6-TRANSFER-ONLY \
            python3 tests/integration/p01_ia6_transfer_formats_owner_http.py
          node tests/integration/p01_ia6_import_dialog_write_outcomes_browser.mjs
          node tests/integration/p01_ia6_transfer_backup_receipt_browser.mjs
          node tests/integration/p01_ia6_recovery_mutation_readback_browser.mjs
          echo 'P01_IA6_EXACT_WORKER_TRANSFER_BACKUP_RECOVERY_BROWSER=PASS'

      - name: Fresh disposable disaster and interrupted restore real execution
        shell: bash
        run: |
          set -Eeuo pipefail
          initialize_site() {
            local site="$1" port="$2" pid=''
            test ! -e "$site"
            cp -a "$CANDIDATE/src" "$site"
            php -S "127.0.0.1:$port" -t "$site" >/tmp/p01-ia6-install-"${port}".log 2>&1 &
            pid=$!
            local target="http://127.0.0.1:$port"
            for i in $(seq 1 40); do
              if curl -fsS -c "/tmp/p01-ia6-cookie-$port" -b "/tmp/p01-ia6-cookie-$port" "$target/setup.php" -o /tmp/p01-ia6-install-"${port}".html 2>/dev/null; then break; fi
              sleep 1
            done
            local csrf
            csrf="$(python3 - "/tmp/p01-ia6-install-${port}.html" <<'PY'
          import pathlib,re,sys
          source=pathlib.Path(sys.argv[1]).read_text(encoding='utf8')
          match=re.search(r'name="setup_csrf"\s+value="([^"]+)"',source)
          assert match,"Missing disposable setup CSRF"
          print(match.group(1))
          PY
            )"
            curl -fsS -c "/tmp/p01-ia6-cookie-$port" -b "/tmp/p01-ia6-cookie-$port" -X POST "$target/setup.php" \
              --data-urlencode "setup_csrf=$csrf" \
              --data-urlencode "site_title=IA6 Synthetic Restore" \
              --data-urlencode "admin_password=$P01_TEST_PASSWORD" \
              --data-urlencode "admin_password_confirm=$P01_TEST_PASSWORD" \
              -o /tmp/p01-ia6-install-"${port}".result.html
            kill "$pid" >/dev/null 2>&1 || true
            wait "$pid" 2>/dev/null || true
            test -f "$site/app/.runtime.php"
            (cd "$site" && php cli/verify.php | grep -Fx 'VERIFY_PASS=YES')
          }
          DISASTER="/tmp/p01-ia6-disaster-parity-${GITHUB_RUN_ID}"
          INTERRUPTED="/tmp/p01-ia6-r11-${GITHUB_RUN_ID}"
          trap 'rm -rf "$DISASTER" "$INTERRUPTED" /tmp/p01-ia6-install-18093.* /tmp/p01-ia6-install-18094.*' EXIT
          initialize_site "$DISASTER" 18093
          VF_E2E_RUNTIME_ROOT="$DISASTER" VF_IA6_DISPOSABLE_ACK=IA6-DISASTER-DISPOSABLE-ONLY \
            php "$CANDIDATE/tests/integration/p01_ia6_disaster_roundtrip_disposable.php"
          echo 'P01_IA6_DISASTER_ROUNDTRIP_EXACT_SOURCE=PASS'
          initialize_site "$INTERRUPTED" 18094
          VF_E2E_RUNTIME_ROOT="$INTERRUPTED" \
            php "$CANDIDATE/tests/integration/p01_ia6_interrupted_restore_disposable.php"
          echo 'P01_IA6_CORE_AND_DISASTER_INTERRUPTED_RECOVERY=PASS'

      - name: Clean ephemeral source and report public-safe receipt
        if: always()
        shell: bash
        run: |
          rm -rf "$CANDIDATE" "$RUNTIME" /tmp/p01-ia6-cookie \
            /tmp/p01-ia6-setup.html /tmp/p01-ia6-setup-post.html \
            /tmp/p01-ia6-worker-server.log || true
          echo 'P01_IA6_PUBLIC_RUNNER_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P01_IA6_PUBLIC_RUNNER_PRODUCTION_MUTATION=NONE'
          echo 'P01_IA6_PUBLIC_RUNNER_RELEASE=NONE'
