name: S01 exact Theme channel contract
on:
  push:
    branches: [task/s01-article-ads189-channel-20261025]
    paths: ['.github/workflows/s01-article-ads189-20261025-channel.yml']
permissions:
  contents: read
env:
  TARGET_REPO: llhzx2018/vf-tools-theme
  TARGET_VERSION: 1.35.189
  TARGET_SHA: 58438a8b2e70808e5c155db9425e05e8e10b73e7
  UPDATE_SHA: 0307472ae6ac0e8642547a5d980de911ee91a5b4
jobs:
  channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@v4
        with:
          repository: llhzx2018/core-updates
          ref: 0307472ae6ac0e8642547a5d980de911ee91a5b4
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Channel identity preflight
        run: python3 control/scripts/ephemeral_lane_spec.py audit-rendered --spec control/lanes/s01-article-ads189-20261025/channel-spec.json --input control/.github/workflows/s01-article-ads189-20261025-channel.yml
      - name: Exact changed manifest and native protocol tests
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$UPDATE_SHA"
          cd source
          python3 scripts/check_manifest_contract.py
          find update-core/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php update-core/php/tests/run.php
          python3 - <<'PYCHANNEL'
          import json,os
          m=json.load(open('projects/S01-C01.json'))
          assert m['target_version']==os.environ['TARGET_VERSION']
          assert m['asset_sha256']=='9510212164cf0c84f59eeace71c99f59b079816734219af28f573328c6734b5e' and m['asset_bytes']==1996332
          assert m['runtime_files']==476 and '1.35.188' in m['from_versions']
          assert m['release_tag']=='v'+os.environ['TARGET_VERSION']
          print('EXACT_CHANNEL_CONTRACT_PASS')
          PYCHANNEL
      - name: Cleanup
        if: always()
        run: rm -rf source
