name: S01 Checker85 Theme109 exact candidate gated private formal release
on:
  push:
    branches: [task/s01-checker85-theme109-formal-20261012]
permissions:
  contents: read
  actions: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TARGET_REPO: 'llhzx2018/vf-tools-theme'
      TARGET_VERSION: '1.35.109'
      TARGET_SHA: '1592daff1bfe86d7d3aba2ea3d9d860d961d4a46'
      TARGET_TREE: '3ff304ed7e02be49a3f0f52a651f149eabacb843'
      TARGET_MAIN_SHA: 'be09c071b9e6d102fc9d0f83200680fd2b8ee221'
      SOURCE_VERSION: '1.35.108'
      BASE_SHA: 'b5e9af880dd0d4c69a976f7b51b629f63143c18f'
      M3_VERSION: '1.25.85'
      M3_SHA: 'a67e13de8362eeb1185d8d56302db575d2c065ae'
      M3_TREE: '8b072f430807a74b5ee27692873fef6dabd2f110'
      M3_MAIN_SHA: 'edad6b8842b5928b2170e1d2e11e9a93c9102b5d'
      M3_SOURCE_VERSION: '1.25.84'
      CANDIDATE_RUN: '38244490871'
      CANDIDATE_SHA: 'eae3aad510fe16f22a6ec7ffe5cefb3572367733'
      CANDIDATE_ARTIFACT: '11744815418'
      CANDIDATE_DIGEST: 'sha256:49f5ade41902f6736b702d8693a7714d3d10caff4f735b232fb22bf3fc46a3ce'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: runner
      - name: Exact formal spec audit
        run: |
          set -Eeuo pipefail
          mkdir -p proof
          python3 runner/scripts/ephemeral_lane_spec.py render --spec runner/lanes/s01-checker85-theme109-formal-20261012/spec.json --template runner/lanes/s01-checker85-theme109-formal-20261012/formal.template.yml --output /tmp/formal-rendered.yml
          cmp /tmp/formal-rendered.yml runner/.github/workflows/s01-checker85-theme109-formal-20261012.yml
          python3 runner/scripts/ephemeral_lane_spec.py audit-rendered --spec runner/lanes/s01-checker85-theme109-formal-20261012/spec.json --input runner/.github/workflows/s01-checker85-theme109-formal-20261012.yml > proof/lane-audit.json
          cp -a runner/lanes/s01-checker85-theme109-formal-20261012 lane
          cp lane/release-authority.json proof/release-authority.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-theme
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: target
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-m3u8
          ref: ${{ env.M3_SHA }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: m3target
      - name: Reverse exact uploaded candidate proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lane/reverse.py
      - name: Deterministic dual rebuild and asset equality
        run: bash lane/build.sh
      - name: Publish authorized private formal releases and authenticated remote readback
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: python3 lane/publish.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        id: receipt
        with:
          name: s01-checker-components-formal-${{ github.run_id }}
          path: proof/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Artifact reverse readback
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.receipt.outputs.artifact-id }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/formal-meta.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/formal-receipt.zip
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,os
          m=json.loads(pathlib.Path('/tmp/formal-meta.json').read_text());b=pathlib.Path('/tmp/formal-receipt.zip').read_bytes()
          assert m['workflow_run']['head_sha']==os.environ['GITHUB_SHA'] and m['size_in_bytes']==len(b)
          assert m['digest']=='sha256:'+hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('/tmp/formal-receipt.zip') as z:
              assert z.testzip() is None
              assert all(pathlib.PurePosixPath(n).suffix=='.json' for n in z.namelist())
              for n in ['theme-FINAL_RELEASE.json','m3u8-FINAL_RELEASE.json','candidate-reverse.json']:
                  assert json.loads(z.read(n))['status']=='PASS'
          print('PASS dual formal public-safe receipt reverse readback')
          PY
      - name: Remove transient private sources and release packages
        if: always()
        run: rm -rf target m3target m3run readback proof/*.zip /tmp/checker-candidate-proof.zip

