name: TEMP S01-C02 Ops 1.21.847 URL Contract Source Trace
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121847-url-contract-source-trace.yml'
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_COMMIT: 8e4127d67d27df90d56f96ccdd86d545877d70df
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
    steps:
      - name: Checkout exact Product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: ${{ env.PRODUCT_COMMIT }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: ops
      - name: Trace URL extractor entry-exists sitemap and canonical repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C ops rev-parse HEAD)" = "$PRODUCT_COMMIT"
          for needle in \
            'function vf_toolsite_cf_release_final_audit_urls_from_text' \
            'function vf_toolsite_cf_release_final_audit_entry_exists' \
            'function vf_toolsite_cf_release_sitemap_urlset_for_entries' \
            'function vf_toolsite_cf_release_repair_html_for_static_package' \
            'function vf_toolsite_cf_release_candidate_text_final_autoscrub'; do
            echo "=== $needle ==="
            grep -R -n -F -C 12 "$needle" ops/includes | head -260 || true
          done
          echo '=== CANONICAL REPAIR MARKERS ==='
          grep -R -n -E -C 8 'canonical.*self|rel=["'"']canonical|robots.*noindex|sitemap_urlset_for_entries|sitemap.*entries' ops/includes/release ops/includes/site-release | head -500 || true
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
          echo PASS_V121847_URL_CONTRACT_SOURCE_TRACE
