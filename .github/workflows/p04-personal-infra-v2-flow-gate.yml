name: P04 Personal Infra V2 Flow Gate

on:
  push:
    branches:
      - p04-personal-infra-v2-flow-gate

permissions:
  contents: read

env:
  PRODUCT_REF: prototype/p04-personal-infra-v2

jobs:
  flow-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public runner
        uses: actions/checkout@v4

      - name: Checkout private VF Infra prototype
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-infra
          ref: ${{ env.PRODUCT_REF }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          path: product
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium

      - name: Start static prototype server
        run: |
          cd product
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/p04-flow-http.log 2>&1 &
          echo $! > /tmp/p04-flow-http.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/prototype/p04-personal-infra-v2/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/p04-flow-http.log
          exit 1

      - name: Run measurable task flow gate
        env:
          P04_PROTO_URL: http://127.0.0.1:4173/prototype/p04-personal-infra-v2/index.html
          P04_FLOW_REPORT: p04-flow-gate.json
        run: node product/tests/e2e/p04-personal-infra-v2-flow-gate.mjs

      - name: Print public-safe flow summary
        if: always()
        run: |
          if [ -f p04-flow-gate.json ]; then
            python3 - <<'PY'
          import json
          d=json.load(open('p04-flow-gate.json',encoding='utf-8'))
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
          fi

      - name: Upload flow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-personal-infra-v2-flow-gate
          path: p04-flow-gate.json
          if-no-files-found: warn
