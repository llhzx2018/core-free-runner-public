name: TEMP S01-C02 Ops 1.21.846 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121845-runtime-suffix-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121846-update-channel-gate.yml'
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      UPDATE_BASE: 29ca1491efbaf33501c4849a94dd2ce4a6600324
      UPDATE_CANDIDATE: 1cbae32a0be0b3e21e12d98605c7e302105d885b
      UPDATE_TREE: 462a4977a400a3ca9df673b90847c7cc710139eb
      PRODUCT_COMMIT: b6745c09ecaa7a27deed3c970f683d86425fcc35
      PRODUCT_TREE: c7338359ba9db173e57749ba6bbbc94ec7ef0491
      RUNNER_MAIN: 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      ASSET: vf-tools-ops_V1.21.846.zip
      BYTES: '3313202'
      SHA256: a847d50c2b8d865f3ea845646f5e4db37fa1203b2322781c6d67190dc75e54f7
      FP: 150f64b642066f24895dc56286cb3ae1ccff755313196c23429c2519b6d94f64
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/core-updates
          ref: ${{ env.UPDATE_CANDIDATE }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest and exact release
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse HEAD)" = "$UPDATE_CANDIDATE"
          test "$(git -C updates rev-parse HEAD^{tree})" = "$UPDATE_TREE"
          mapfile -t files < <(git -C updates diff --name-only "$UPDATE_BASE" "$UPDATE_CANDIDATE")
          test "${#files[@]}" = 1
          test "${files[0]}" = 'projects/S01-C02.json'
          jq -e --arg sha "$SHA256" --arg fp "$FP" --argjson bytes "$BYTES" '.target_version=="1.21.846" and .from_versions==["1.21.845"] and .release_tag=="v1.21.846" and .asset_name=="vf-tools-ops_V1.21.846.zip" and .asset_bytes==$bytes and .asset_sha256==$sha and .runtime_files==928 and .runtime_file_count==928 and .runtime_fingerprint==$fp and .runtime_fingerprint_sha256==$fp and .schema_from=="6.0.0" and .schema_to=="6.0.0" and .physical_locator=="vf-ops/vf-ops.php" and .locator_cutover==false and .released_at=="2026-09-06T04:06:47Z"' updates/projects/S01-C02.json >/dev/null
          gh api 'repos/llhzx2018/vf-tools-ops/releases/tags/v1.21.846' > /tmp/release.json
          jq -e --arg c "$PRODUCT_COMMIT" --arg a "$ASSET" --arg d "sha256:$SHA256" --argjson b "$BYTES" '.id==383459818 and .tag_name=="v1.21.846" and .target_commitish==$c and .draft==false and .prerelease==false and ([.assets[] | select(.id==546702997 and .name==$a and .size==$b and .digest==$d)]|length)==1' /tmp/release.json >/dev/null
      - name: Verify Product and Production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/main --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/ref/heads/develop --jq .object.sha)" = "$PRODUCT_COMMIT"
          test "$(gh api repos/llhzx2018/vf-tools-ops/git/commits/$PRODUCT_COMMIT --jq .tree.sha)" = "$PRODUCT_TREE"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 'https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness' -o /tmp/static.json
          jq -e '.pluginVersion=="1.21.845" and .sourceArtifactAvailable==true and .manualSourceUploadRequired==false and .candidatePackageReady==false and .finalOnlinePass=="NO"' /tmp/static.json >/dev/null
          jq -e '.activeStaticJobStatus=="FAIL" and .activeStaticJobMode=="candidate" and .activeStaticJobFirstFailedStep=="final_decision" and .activeStaticJobAuditFailureCount==1 and .activeStaticJobInternalLinkFailureLeafCount==0' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryRuntimeSuffixRetryStatus=="blocked" and .sourceRecoveryRuntimeSuffixRetryCode=="runtime_suffix_final_audit_boundary_changed"' /tmp/static.json >/dev/null
          jq -e '.sourceRecoveryFinalAuditOtherLeafCount==1 and .sourceRecoveryFinalAuditOtherPrimaryClass=="candidate_package_contract" and .sourceRecoveryFinalAuditPackageContractLeafCount==1 and .sourceRecoveryFinalAuditPackageContractUnclassifiedCount==1 and .sourceRecoveryFinalAuditPackageContractPrimaryClass=="candidate_package_contract_unclassified"' /tmp/static.json >/dev/null
      - name: Verify update authority and runner main untouched
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C updates rev-parse origin/main)" = "$UPDATE_BASE"
          test "$(git -C updates rev-parse origin/develop)" = "$UPDATE_BASE"
          test "$(git ls-remote https://github.com/llhzx2018/core-free-runner-public.git refs/heads/main | awk '{print $1}')" = "$RUNNER_MAIN"
      - name: Seal result
        run: echo PASS_V121846_UPDATE_CHANNEL_GATE
