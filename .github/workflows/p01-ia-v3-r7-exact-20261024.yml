name: P01 IA V3 R7 exact-source regression
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/p01-ia-v3-r7-exact-20261024.yml']
permissions:
  contents: read
jobs:
  r7:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: llhzx2018/vf-start
      SOURCE_BRANCH: test/p01-ia-v3-r7-e2e-20261024
      SOURCE_SHA: 6f341b0496edfb7a5ce88fed98481028a97de17d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install PHP SQLite Curl and Node toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y php-cli php-sqlite3 php-curl php-mbstring php-xml php-zip php-gd unzip jq >/dev/null
          php -m | grep -Fx pdo_sqlite
          php -m | grep -Fx curl
          node --version
      - name: Pin exact P01 R7 candidate and stable regression baseline
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$READ_TOKEN"
          root="$RUNNER_TEMP/p01-r7"
          mkdir -p "$root"
          echo "P01_R7_ROOT=$root" >>"$GITHUB_ENV"
          git clone -q --no-checkout "https://x-access-token:${READ_TOKEN}@github.com/${SOURCE_REPO}.git" "$root/candidate"
          git -C "$root/candidate" fetch -q origin "refs/heads/${SOURCE_BRANCH}"
          git -C "$root/candidate" checkout -q --detach FETCH_HEAD
          git -C "$root/candidate" remote set-url origin "https://github.com/${SOURCE_REPO}.git"
          test "$(git -C "$root/candidate" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$root/candidate" worktree add -q --detach "$root/stable" v2.47.445
          test "$(tr -d '\r\n ' < "$root/candidate/VERSION")" = 2.47.448
          test "$(tr -d '\r\n ' < "$root/candidate/src/VERSION.txt")" = 2.47.448
          echo P01_R7_EXACT_SOURCE=PASS
      - name: Focused IA V3 and previously conflicting legacy contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_R7_ROOT/candidate"
          failed=0
          for name in admin_eight_resource_tasks_v247286_contract.php admin_overview_ia_contract.php admin_secondary_nav_focus_contract.php backend_ia_round1_v247269_contract.php engineering_consistency_r80_contract.php gov_book_backend_shell_contract.php gov_book_private_auth_isolation_native.php gov_book_sync_contract_native.php navigation_category_header_contract.php p01_ia_v3_r6_direct_specialist_nav_contract.php; do
            echo "CHECKED_CONTRACT=$name"
            php "tests/unit/$name" || failed=$((failed+1))
          done
          test "$failed" -eq 0 || { echo "P01_R7_FOCUSED_FAILED=$failed";exit 1; }
          echo P01_R7_FOCUSED_RECOVERY=PASS
      - name: Syntax and canonical PHP regression with fixed baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$P01_R7_ROOT/candidate"
          find src tests/unit -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/p01-r7-php-lint.txt
          echo "P01_R7_PHP_LINT_FILES=$(wc -l </tmp/p01-r7-php-lint.txt)"
          bash tests/canonical_release_regression.sh . "$P01_R7_ROOT/stable" --require-zero-debt | tee /tmp/p01-r7-canonical.txt
          grep -Fx 'P01_CANONICAL_ZERO_DEBT_REQUIRED=PASS' /tmp/p01-r7-canonical.txt
          echo P01_R7_CANONICAL=PASS
      - name: Owner navigation, source permissions and one-shot interaction JS
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$P01_R7_ROOT/candidate"
          cd "$P01_R7_ROOT/candidate"
          node tests/unit/p01_ia_v3_r3_mutation_return_behavior.cjs
          node tests/unit/p01_ia_v3_r4_specialist_return_behavior.cjs
          node tests/unit/p01_ia_v3_r3_mutation_return_behavior.cjs
          find src/assets -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check >/dev/null
          bash tests/integration/p01_ia_v3_r7_routes_http.sh .
          bash tests/integration/p01_ia_v2_r6_gov_source_http.sh .
          bash tests/integration/p01_ia_v2_r5_music_http_roundtrip.sh .
          echo P01_R7_HTTP_AND_JS=PASS
      - name: Ephemeral workspace cleanup
        if: always()
        shell: bash
        run: |
          if [ -n "${P01_R7_ROOT:-}" ]; then rm -rf -- "$P01_R7_ROOT"; fi
          echo P01_R7_EPHEMERAL_CLEANUP=PASS
