name: TEMP S01-C02 Ops 1.21.831 Update Channel Gate
on:
  push:
    branches:
      - temp/s01-c02-v121831-update-channel-gate-20260905
    paths:
      - '.github/workflows/temp-s01-c02-v121831-update-channel-gate.yml'
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      UPDATE_REPO: llhzx2018/core-updates
      UPDATE_BASE: 792ca52645f371c1f4f9b79feb8cb5c3e5afb1b2
      UPDATE_COMMIT: 967c714b2e2999498a3fedfc62d43117e769f23c
      PRODUCT_REPO: llhzx2018/vf-tools-ops
      PRODUCT_COMMIT: b0ef670e5a9564ad33329cfee8d5902bfe6a0d47
      PRODUCT_TREE: bc1290af8750d54f2f2c85b6814948b7b86d891c
      ASSET: vf-tools-ops_V1.21.831.zip
      SHA256: 5f85cbf2d385fc5a87e0c3a74b88da9a85dd8888823d9d252f3edf4390826cc2
      BYTES: '3259206'
    steps:
      - name: Checkout exact update candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.UPDATE_REPO }}
          ref: ${{ env.UPDATE_COMMIT }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: updates
      - name: Verify one-file manifest scope and exact release
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          C="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$UPDATE_REPO/compare/$UPDATE_BASE...$UPDATE_COMMIT")"
          test "$(jq -r .status <<<"$C")" = ahead
          test "$(jq '.files|length' <<<"$C")" = 1
          test "$(jq -r '.files[0].filename' <<<"$C")" = projects/S01-C02.json
          M=updates/projects/S01-C02.json
          test "$(jq -r .target_version "$M")" = 1.21.831
          test "$(jq -r '.from_versions|join(",")' "$M")" = 1.21.830
          test "$(jq -r .release_tag "$M")" = v1.21.831
          test "$(jq -r .asset_name "$M")" = "$ASSET"
          test "$(jq -r .asset_bytes "$M")" = "$BYTES"
          test "$(jq -r .asset_sha256 "$M")" = "$SHA256"
          test "$(jq -r .runtime_files "$M")" = 913
          test "$(jq -r .runtime_fingerprint "$M")" = 29248ca9c1e62f8043ae9c244bd29405954319c0a26665907bdd318d9a5fce15
          REL="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/releases/tags/v1.21.831")"
          test "$(jq -r .target_commitish <<<"$REL")" = "$PRODUCT_COMMIT"
          test "$(jq -r .draft <<<"$REL")" = false
          test "$(jq -r .prerelease <<<"$REL")" = false
          test "$(jq -r '.assets[]|select(.name==env.ASSET)|.size' <<<"$REL")" = "$BYTES"
          test "$(jq -r '.assets[]|select(.name==env.ASSET)|.digest' <<<"$REL")" = "sha256:$SHA256"
          for b in main develop; do
            B="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$PRODUCT_REPO/branches/$b")"
            test "$(jq -r .commit.sha <<<"$B")" = "$PRODUCT_COMMIT"
            test "$(jq -r .commit.commit.tree.sha <<<"$B")" = "$PRODUCT_TREE"
          done
      - name: Verify direct Production remains 1.21.830 fail-closed before owner upgrade
        shell: bash
        run: |
          set -Eeuo pipefail
          J="$(curl -fsSL https://www3.m3u8.one/wp-json/vf-ops/v1/s01-static-candidate-readiness)"
          test "$(jq -r .pluginVersion <<<"$J")" = 1.21.830
          test "$(jq -r .activeStaticJobStatus <<<"$J")" = FAIL
          test "$(jq -r .activeStaticJobFirstFailedStep <<<"$J")" = candidate_build
          test "$(jq -r .sourceRecoveryCandidateFailureClass <<<"$J")" = candidate_build_unclassified
          test "$(jq -r .sourceRecoveryCandidateBuildOffset <<<"$J")" = 225
          test "$(jq -r .sourceRecoveryCandidateBuildTotal <<<"$J")" = 231
          test "$(jq -r .candidatePackageReady <<<"$J")" = false
          test "$(jq -r .manualSourceUploadRequired <<<"$J")" = false
          test "$(jq -r .finalOnlinePass <<<"$J")" = NO
          test "$(jq 'has("sourceRecoveryCandidateTailProbeStatus")' <<<"$J")" = false
      - name: Verify update authority and runner main untouched
        env:
          R: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          U="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$UPDATE_REPO/git/ref/heads/main")"
          test "$(jq -r .object.sha <<<"$U")" = "$UPDATE_BASE"
          J="$(curl -fsSL -H "Authorization: Bearer $R" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/llhzx2018/core-free-runner-public/git/ref/heads/main)"
          test "$(jq -r .object.sha <<<"$J")" = 0160b557ad4ae0e8c6acd97e7551285bc05870bd
      - name: Seal result
        run: echo PASS_V121831_UPDATE_CHANNEL_GATE
