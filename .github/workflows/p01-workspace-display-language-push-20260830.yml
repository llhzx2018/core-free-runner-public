name: P01 Workspace Display Language Push

on:
  push:
    branches:
      - task/p01-workspace-display-language-20260830
    paths:
      - .github/workflows/p01-workspace-display-language-push-20260830.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-push:
    runs-on: ubuntu-24.04
    env:
      VF_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: feature/p01-workspace-display-language-20260830
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0

      - name: Fence feature branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 1183ac6672e8cacfbb1c8cab0643f7f4a08c3b88
          test "$(git rev-parse HEAD^)" = 8f934157aa2215f7fedf12797c5add7b47c8e70a

      - name: Apply validated display patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/app')
          core=root/'FunctionalWorkspaceCore.php'; s=core.read_text()
          old="""function vf_fw_kind_label(string $mode): string
          {
              return match ($mode) {
                  'channels' => '频道分类',
                  'watch' => '内容类型',
                  'topics' => '专题分类',
                  default => '主分类',
              };
          }
          """
          new=old+"""
          function vf_fw_kind_display_label(string $mode, string $kind): string
          {
              $raw = trim($kind);
              if ($raw === '') return '';
              $key = strtolower($raw);
              $labels = match ($mode) {
                  'channels' => ['youtube'=>'YouTube','podcast'=>'播客','bilibili'=>'哔哩哔哩'],
                  'watch' => ['movie'=>'电影','series'=>'剧集','documentary'=>'纪录片','variety'=>'综艺','anime'=>'动漫'],
                  default => [],
              };
              return $labels[$key] ?? $raw;
          }
          """
          if s.count(old)!=1: raise SystemExit('Core anchor mismatch')
          core.write_text(s.replace(old,new,1))

          home=root/'FunctionalHome.php'; s=home.read_text()
          old="""function vf_home_asset_class(array $asset): string
          {
              $surface = (string)($asset['surface'] ?? 'start');
              if ($surface === 'start') return trim((string)($asset['category_name'] ?? ''));

              $raw = trim((string)($asset['resource_kind'] ?? ''));
              if ($raw === '') return '';
              $key = strtolower($raw);
              $labels = match ($surface) {
                  'channels' => [
                      'youtube' => 'YouTube',
                      'podcast' => '播客',
                      'bilibili' => '哔哩哔哩',
                  ],
                  'watch' => [
                      'movie' => '电影',
                      'series' => '剧集',
                      'documentary' => '纪录片',
                      'variety' => '综艺',
                      'anime' => '动漫',
                  ],
                  default => [],
              };
              return $labels[$key] ?? $raw;
          }
          """
          new="""function vf_home_asset_class(array $asset): string
          {
              $surface = (string)($asset['surface'] ?? 'start');
              if ($surface === 'start') return trim((string)($asset['category_name'] ?? ''));
              return vf_fw_kind_display_label($surface, (string)($asset['resource_kind'] ?? ''));
          }
          """
          if s.count(old)!=1: raise SystemExit('Home anchor mismatch')
          home.write_text(s.replace(old,new,1))

          shell=root/'FunctionalWorkspaceShell.php'; s=shell.read_text()
          old="""function vf_fw_render_kind_nodes(array $counts, string $mode, string $selectedKind): void
          {
              foreach ($counts as $name => $count) {
                  $name = (string)$name;
                  $active = $selectedKind === $name;
                  echo '<a class=\"vf-category-node' . ($active ? ' active' : '') . '\" data-category-node data-label=\"' . vf_fw_h(mb_strtolower($name, 'UTF-8')) . '\" href=\"' . vf_fw_link($mode, ['kind'=>$name]) . '\"><span>' . vf_fw_h($name) . '</span><em>' . number_format((int)$count) . '</em></a>';
              }
          }
          """
          new="""function vf_fw_render_kind_nodes(array $counts, string $mode, string $selectedKind): void
          {
              foreach ($counts as $name => $count) {
                  $name = (string)$name;
                  $display = vf_fw_kind_display_label($mode, $name);
                  $active = $selectedKind === $name;
                  $searchLabel = mb_strtolower(trim($display . ' ' . $name), 'UTF-8');
                  echo '<a class=\"vf-category-node' . ($active ? ' active' : '') . '\" data-category-node data-label=\"' . vf_fw_h($searchLabel) . '\" href=\"' . vf_fw_link($mode, ['kind'=>$name]) . '\"><span>' . vf_fw_h($display) . '</span><em>' . number_format((int)$count) . '</em></a>';
              }
          }
          """
          if s.count(old)!=1: raise SystemExit('Kind node anchor mismatch')
          s=s.replace(old,new,1)
          pairs=[
            ("<?php if($kind!==''): ?><span class=\"vf-context-chip\"><?=vf_fw_h($kindLabel)?>：<?=vf_fw_h($kind)?></span><?php endif; ?>","<?php if($kind!==''): ?><span class=\"vf-context-chip\"><?=vf_fw_h($kindLabel)?>：<?=vf_fw_h(vf_fw_kind_display_label($mode,$kind))?></span><?php endif; ?>"),
            ("<?=$kind===(string)$name?'selected':''?>><?=vf_fw_h((string)$name)?> · <?=number_format((int)$count)?>","<?=$kind===(string)$name?'selected':''?>><?=vf_fw_h(vf_fw_kind_display_label($mode,(string)$name))?> · <?=number_format((int)$count)?>"),
            ("$surface=(string)($asset['surface']??'start');$domain=(string)(parse_url((string)$asset['url'],PHP_URL_HOST)?:'');$isFav=(int)($asset['is_favorite']??0)===1;$private=vf_fw_is_private($asset);$class=$surface==='start'?(string)($asset['category_name']??''):(string)($asset['resource_kind']??'');","$surface=(string)($asset['surface']??'start');$domain=(string)(parse_url((string)$asset['url'],PHP_URL_HOST)?:'');$isFav=(int)($asset['is_favorite']??0)===1;$private=vf_fw_is_private($asset);$class=$surface==='start'?(string)($asset['category_name']??''):vf_fw_kind_display_label($surface,(string)($asset['resource_kind']??''));")
          ]
          for old,new in pairs:
              if s.count(old)!=1: raise SystemExit('Shell anchor mismatch')
              s=s.replace(old,new,1)
          old="<?=vf_fw_h((string)($asset['resource_kind']?:'未分类'))?>"
          if s.count(old)!=2: raise SystemExit('Card anchor mismatch')
          s=s.replace(old,"<?=vf_fw_h(vf_fw_kind_display_label('watch',(string)($asset['resource_kind']??'')) ?: '未分类')?>",1)
          s=s.replace(old,"<?=vf_fw_h(vf_fw_kind_display_label('topics',(string)($asset['resource_kind']??'')) ?: '未分类')?>",1)
          shell.write_text(s)
          PY
          git diff --check

      - name: Gate product files
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l src/app/FunctionalWorkspaceCore.php
          php -l src/app/FunctionalWorkspaceShell.php
          php -l src/app/FunctionalHome.php
          php -r '
            require "src/app/FunctionalHome.php";
            foreach([["channels","youtube","YouTube"],["channels","podcast","播客"],["channels","bilibili","哔哩哔哩"],["watch","movie","电影"],["watch","series","剧集"],["watch","documentary","纪录片"],["watch","variety","综艺"],["watch","anime","动漫"],["watch","自定义","自定义"]] as [$m,$k,$w]) if(vf_fw_kind_display_label($m,$k)!==$w) exit(1);
            $_GET=[];ob_start();vf_fw_render_kind_nodes(["movie"=>2],"watch","movie");$x=ob_get_clean();if(strpos($x,">电影<")===false||strpos($x,">movie<")!==false||strpos($x,"kind=movie")===false)exit(2);echo "PASS\n";
          '

      - name: Commit product files and remove temp workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/_temp-p01-workspace-display-language-20260830.yml
          git config user.name "VictorForge"
          git config user.email "llhzx2018@gmail.com"
          git add -A
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/_temp-p01-workspace-display-language-20260830.yml src/app/FunctionalHome.php src/app/FunctionalWorkspaceCore.php src/app/FunctionalWorkspaceShell.php "
          git commit -m "ui(P01): unify workspace display taxonomy labels"
          git push origin HEAD:feature/p01-workspace-display-language-20260830
