name: P02 D0 Windows-first PHP API exact-source safety proof (temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p02-d0-exact-20261111.yml'
permissions:
  contents: read
jobs:
  p02-d0:
    name: P02 D0 exact PHP API and 21-denial-source baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify runtime-only private source read capability
        env:
          PRIVATE_READ: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          if test -z "$PRIVATE_READ"; then echo BLOCKED_PRIVATE_READ_CAPABILITY; exit 78; fi
          echo PRIVATE_READ_CAPABILITY=PRESENT
      - name: Checkout exact P02 private source transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-library
          ref: 7172669bef2de16b31aec9fd99c46010ca5d23c2
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: product
          fetch-depth: 1
      - name: Syntax and exact identity
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 7172669bef2de16b31aec9fd99c46010ca5d23c2
          python3 -m py_compile scripts/p02-modernization-d0-gate.py tests/unit/test_p02_modernization_d0.py
          echo P02_D0_EXACT_SOURCE_SYNTAX=PASS
      - name: Run live D0 source route inventory
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/p02-modernization-d0-gate.py --phase auto --inventory
      - name: Run 21 real security denial fixtures
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/unit -p test_p02_modernization_d0.py -v
      - name: Run existing P02 repository verification entry
        working-directory: product
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-repository.sh
      - name: Cleanup private checkout, no source or DB artifacts
        if: always()
        shell: bash
        run: |
          rm -rf product
          echo PRIVATE_SOURCE_PERSISTED_IN_PUBLIC_GIT_OR_ARTIFACT=NO
