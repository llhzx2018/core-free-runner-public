name: P05 V1.2.3 Formal FULL Publication

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p05-v123-formal-full-20260902.yml'

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'tmp/p05-v123-formal-full-20260902'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vfseo_test
          POSTGRES_USER: vfseo
          POSTGRES_PASSWORD: vfseo-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfseo -d vfseo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      P05_MAIN_SOURCE: 66a56dafdfba2ca7243d1984791ecbe0fd7382ae
      P05_VERIFIED_TREE: b858117477fd1cb41fb53a62da6bdebfa26ad21f
      P05_EXACT_SOURCE: 45f81677c206476013ed1d543ab661356107800c
      P05_FINAL_GATE_RUN: '33547042654'
      P05_FINAL_GATE_JOB: '99987005980'
      VERSION: 1.2.3
      PREVIOUS_PRODUCTION_VERSION: 1.2.2
      ASSET: VF_SEO_V1.2.3_FULL.zip
      RECEIPT: VF_SEO_V1.2.3_RELEASE_RECEIPT.txt
      DATABASE_URL: postgresql://vfseo:vfseo-test-password@127.0.0.1:5432/vfseo_test
      VF_MASTER_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test
    steps:
      - name: Bind canonical Final Exact Source PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/core-free-runner-public/actions/runs/$P05_FINAL_GATE_RUN" > /tmp/final-run.json
          gh api "repos/llhzx2018/core-free-runner-public/actions/jobs/$P05_FINAL_GATE_JOB" > /tmp/final-job.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/final-run.json'))
          job=json.load(open('/tmp/final-job.json'))
          assert run['id']==int(os.environ['P05_FINAL_GATE_RUN'])
          assert run['conclusion']=='success'
          assert job['id']==int(os.environ['P05_FINAL_GATE_JOB'])
          assert job['run_id']==int(os.environ['P05_FINAL_GATE_RUN'])
          assert job['conclusion']=='success'
          assert job['name']=='final-exact-source'
          print('P05_V123_FINAL_GATE_BINDING=PASS')
          PY

      - name: Checkout exact promoted P05 main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-seo
          ref: ${{ env.P05_MAIN_SOURCE }}
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: p05

      - name: Verify exact promotion and Production baseline
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$P05_MAIN_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$P05_VERIFIED_TREE"
          test "$(git rev-parse "$P05_EXACT_SOURCE^{tree}")" = "$P05_VERIFIED_TREE"
          test "$(cat VERSION)" = "$VERSION"
          node - <<'NODE'
          const p=require('./package.json'), v=require('./VF_PROJECT.json');
          if(p.version!=='1.2.3') process.exit(1);
          if(v.version!=='1.2.3'||v.target_version!=='1.2.3'||v.working_version!=='1.2.3') process.exit(1);
          if(v.production_version!=='1.2.2') process.exit(1);
          if(v.release_authorization!=='OWNER_AUTHORIZED_V1.2.3 / EXECUTION_PENDING') process.exit(1);
          if(v.production_deployment_authorization!=='OWNER_AUTHORIZED_V1.2.3_FULL_CLOSURE / EXECUTION_PENDING') process.exit(1);
          NODE
          test ! -e VF_INSTALL_INSTANCE.json
          test -f php/bin/init-update-service.php
          echo P05_V123_MAIN_TREE_EQUIVALENT=PASS

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: p05/package-lock.json

      - name: Install dependencies and PHP runtime modules
        shell: bash
        run: |
          set -Eeuo pipefail
          cd p05 && npm ci && cd ..
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-zip php-curl sqlite3
          php -r 'foreach(["pdo_sqlite","curl"] as $e){if(!extension_loaded($e))exit(1);} if(!class_exists("ZipArchive"))exit(1);'

      - name: Complete engineering and security regression
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run release:source:gate
          npm run lint
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:integration
          npm run build
          npm run source:gate
          npm run scope:gate
          npm run dependency:gate
          npm audit --audit-level=high
          npm run security:gate

      - name: PHP CloudPanel and browser regression
        working-directory: p05
        shell: bash
        env:
          APP_ENV: test
          VF_DATABASE_PROVIDER: sqlite
          VF_SECURE_COOKIES: 'false'
          VF_REQUIRE_HTTPS: 'false'
          VF_ADMIN_USERNAME: admin
          VF_ADMIN_PASSWORD: php-ci-portable-password-123
        run: |
          set -Eeuo pipefail
          npm run php:lint
          php php/tests/security-interop.php
          bash php/tests/http-smoke.sh
          bash php/tests/cloudpanel-fpm-home-cache-smoke.sh
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = "$VERSION"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test -f "$S/php/src/PhpUpdater.php"
          test -f "$S/php/src/CoreUpdates/UpdateCore.php"
          test -f "$S/php/bin/init-update-service.php"
          grep -F 'core-updates:llhzx2018/core-updates/projects/P05.json' "$S/PHP_RELEASE_MANIFEST.json" >/dev/null
          ! grep -F 'core-free-runner-public' "$S/PHP_RELEASE_MANIFEST.json"
          bash php/tests/cloudpanel-root-smoke.sh "$S"
          VF_INSTALL_ROOT="$S" bash php/tests/browser-install-smoke.sh
          VF_INSTALL_ROOT="$S" python3 php/tests/browser-install-e2e.py
          VF_INSTALL_ROOT="$S" bash php/tests/cloudpanel-fpm-real-install-smoke.sh

      - name: Rebuild pristine formal staging
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf build/vf-seo-php-release dist/client
          VF_RELEASE_SOURCE_SHA="$P05_MAIN_SOURCE" npm run build:php-release
          npm run php:release:gate
          S=build/vf-seo-php-release
          test "$(cat "$S/VERSION")" = "$VERSION"
          test ! -e "$S/VF_INSTALL_INSTANCE.json"
          test ! -e "$S/.env"
          test -f "$S/php/bin/init-update-service.php"
          if find "$S" -type f \( -iname '*.sqlite' -o -iname '*.sqlite3' -o -iname '*.db' -o -name runtime.env -o -name setup.lock.json \) | grep -q .; then exit 1; fi

      - name: Deterministic FULL build and receipt
        working-directory: p05
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          import os
          root=Path('build/vf-seo-php-release')
          asset=os.environ['ASSET']
          def build(out):
              with ZipFile(out,'w') as z:
                  for p in sorted(x for x in root.rglob('*') if x.is_file()):
                      rel=p.relative_to(root).as_posix()
                      info=ZipInfo(rel,(1980,1,1,0,0,0))
                      info.external_attr=((p.stat().st_mode & 0o777)&0xFFFF)<<16
                      info.compress_type=ZIP_DEFLATED
                      z.writestr(info,p.read_bytes(),compress_type=ZIP_DEFLATED,compresslevel=9)
          build('../'+asset+'.a')
          build('../'+asset+'.b')
          PY
          cmp "../$ASSET.a" "../$ASSET.b"
          mv "../$ASSET.a" "../$ASSET"
          rm "../$ASSET.b"
          sha="$(sha256sum "../$ASSET" | awk '{print $1}')"
          bytes="$(stat -c%s "../$ASSET")"
          files="$(python3 -c 'from zipfile import ZipFile; import os; print(len(ZipFile("../"+os.environ["ASSET"]).namelist()))')"
          printf 'P05_VERSION=%s\nP05_MAIN_SOURCE=%s\nP05_EXACT_SOURCE=%s\nP05_TREE=%s\nP05_FINAL_GATE_RUN=%s\nP05_FINAL_GATE_JOB=%s\nP05_FILES=%s\nP05_BYTES=%s\nP05_SHA256=%s\nUPDATE_AUTHORITY=core-updates:llhzx2018/core-updates/projects/P05.json\nBINARY_AUTHORITY=llhzx2018/vf-seo Release UPDATE.zip\nATOMIC_AUTHORITY=repair-v*.php\nPREVIOUS_PRODUCTION_VERSION=%s\nPRODUCTION_WRITE=0\n' "$VERSION" "$P05_MAIN_SOURCE" "$P05_EXACT_SOURCE" "$P05_VERIFIED_TREE" "$P05_FINAL_GATE_RUN" "$P05_FINAL_GATE_JOB" "$files" "$bytes" "$sha" "$PREVIOUS_PRODUCTION_VERSION" > "../$RECEIPT"
          echo "P05_FILES=$files" >> "$GITHUB_ENV"
          echo "P05_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "P05_SHA256=$sha" >> "$GITHUB_ENV"
          echo "P05_V123_FULL_SHA256=$sha"
          echo "P05_V123_FULL_BYTES=$bytes"
          echo "P05_V123_FULL_FILES=$files"

      - name: Reconfirm remote v1.2.3 absence
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "v$VERSION" --repo llhzx2018/vf-seo >/dev/null 2>&1; then echo "release v$VERSION already exists" >&2; exit 1; fi
          if gh api "repos/llhzx2018/vf-seo/git/ref/tags/v$VERSION" >/dev/null 2>&1; then echo "tag v$VERSION already exists" >&2; exit 1; fi
          echo P05_V123_REMOTE_ABSENCE=PASS

      - name: Publish private Product Release v1.2.3 FULL
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release create "v$VERSION" --repo llhzx2018/vf-seo --target "$P05_MAIN_SOURCE" \
            --title 'P05 · VF SEO v1.2.3 · Update Service Bootstrap Patch' \
            --notes 'V1.2.3 closes the post-v1.2.2 update-service initialization gap. The Product browser truthfully reports an uninitialized update service without collecting GitHub Secrets or administrator passwords. A CLI-only server-side initializer consumes the global VF_PRIVATE_READ_TOKEN from the server process environment, verifies private core-updates plus the P05 Release identity, and persists the verified credential into Runtime Pointer-bound private runtime.env. Schema remains VF-SEO-SCHEMA@1/1, SQLite remains the default database, and no business-data semantics change. Native CI and a separate Final Exact Source R2 Gate passed on the frozen release tree. This step publishes the formal FULL binary; direct v1.2.2 → v1.2.3 Atomic assets and core-updates channel are gated separately. Production deployment is not performed by this publisher.' \
            "$ASSET" "$RECEIPT"

      - name: Remote readback FULL Release truth
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/llhzx2018/vf-seo/releases/tags/v$VERSION" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/release.json'))
          assets={x['name']:x for x in r['assets']}
          assert r['tag_name']=='v'+os.environ['VERSION']
          assert r['target_commitish']==os.environ['P05_MAIN_SOURCE']
          full=assets[os.environ['ASSET']]
          assert int(full['size'])==int(os.environ['P05_BYTES'])
          assert full.get('digest')=='sha256:'+os.environ['P05_SHA256']
          assert os.environ['RECEIPT'] in assets
          print('P05_RELEASE_ID='+str(r['id']))
          print('P05_FULL_ASSET_ID='+str(full['id']))
          print('P05_RECEIPT_ASSET_ID='+str(assets[os.environ['RECEIPT']]['id']))
          print('P05_V123_FORMAL_FULL_PUBLICATION=PASS')
          print('P05_CORE_UPDATES_WRITE=0')
          print('P05_PRODUCTION_WRITE=0')
          PY
