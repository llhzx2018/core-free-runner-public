name: P01 Single System Auth Formal Gate R3
on:
  push:
    branches: [temp/p01-single-system-auth-model-20260901]
    paths: [.github/workflows/p01-single-system-auth-formal-gate-r3-20260901.yml]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE: e0faf773a6f7643974dc0f08b653b19669f9908d
      BASE: 388f8f75777fc131e47ef7dc7a136ff2cb7d8cc9
      ROOT: ${{ github.workspace }}/product/src
      EVID: /tmp/p01-single-system-auth-r3/evidence
      PORT: 18553
      ADMIN_PASS: P01SingleSystemAuth2026
    steps:
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, curl, zip, simplexml, mbstring, openssl, fileinfo
          coverage: none
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/core-free-runner-public
          ref: temp/p01-single-system-auth-model-20260901
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: e0faf773a6f7643974dc0f08b653b19669f9908d
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Execute R2 gates with mobile-sidebar contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('runner/.github/workflows/p01-single-system-auth-formal-gate-r2-20260901.yml').read_text().splitlines()
          targets=['Exact source and removal fence','Fresh Runtime and seed','Chromium auth-state gate','SQLite integrity and FK']
          out=[]
          for i,name in enumerate(targets,1):
              marker='      - name: '+name
              start=src.index(marker); run=None
              for j in range(start+1,len(src)):
                  if j>start+1 and src[j].startswith('      - '): break
                  if src[j].strip()=='run: |': run=j+1; break
              if run is None: raise SystemExit('missing run '+name)
              body=[]
              for j in range(run,len(src)):
                  line=src[j]
                  if line.startswith('      - '): break
                  body.append(line[10:] if line.startswith('          ') else line)
              text='\n'.join(body)+'\n'
              if name=='Chromium auth-state gate':
                  old="A(t.includes('资源管理')&&t.includes('系统设置'),`admin management labels missing ${route}`);"
                  new="if(width===1440)A(t.includes('资源管理')&&t.includes('系统设置'),`admin management labels missing ${route}`);"
                  if text.count(old)!=1: raise SystemExit('admin label patch fence '+str(text.count(old)))
                  text=text.replace(old,new,1)
                  old="A(await visibleCount(p,'a[href=\"links-admin.php\"]')>0,`admin resource management missing ${route}`);A(await visibleCount(p,'a[href=\"settings.php\"]')>0,`admin settings missing ${route}`);"
                  new="A(await p.locator('a[href=\"links-admin.php\"]').count()>0,`admin resource management DOM missing ${route}`);A(await p.locator('a[href=\"settings.php\"]').count()>0,`admin settings DOM missing ${route}`);if(width===1440){A(await visibleCount(p,'a[href=\"links-admin.php\"]')>0,`admin resource management not visible ${route}`);A(await visibleCount(p,'a[href=\"settings.php\"]')>0,`admin settings not visible ${route}`);}"
                  if text.count(old)!=1: raise SystemExit('admin link patch fence '+str(text.count(old)))
                  text=text.replace(old,new,1)
                  old="A(t.includes('资源管理')&&t.includes('系统设置'),`old query hides management ${route}`);"
                  new="A(await p.locator('a[href=\"links-admin.php\"]').count()>0&&await p.locator('a[href=\"settings.php\"]').count()>0,`old query hides management ${route}`);if(width===1440)A(t.includes('资源管理')&&t.includes('系统设置'),`old query hides visible management ${route}`);"
                  if text.count(old)!=1: raise SystemExit('old query patch fence '+str(text.count(old)))
                  text=text.replace(old,new,1)
              p=Path(f'/tmp/p01-single-system-auth-r3-step-{i}.sh');p.write_text(text);out.append(str(p))
          Path('/tmp/p01-single-system-auth-r3-steps.txt').write_text('\n'.join(out)+'\n')
          PY
          while IFS= read -r step; do echo "== RUN $step =="; bash "$step"; done </tmp/p01-single-system-auth-r3-steps.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p01-single-system-auth-gate-r3-${{ github.run_id }}
          path: /tmp/p01-single-system-auth-r3/evidence
          if-no-files-found: warn
          retention-days: 30
      - name: Stop server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/p01-single-system-auth-r2.pid 2>/dev/null)" 2>/dev/null || kill "$(cat /tmp/p01-single-system-auth-r3.pid 2>/dev/null)" 2>/dev/null || true
