name: P01 iyf mview cover fallback gate
on:
  push:
    branches:
      - run/p01-iyf-mview-cover-fallback-20260902
    paths:
      - .github/workflows/p01-iyf-mview-cover-fallback-20260902.yml
      - scripts/p01_iyf_mview_cover_fallback_20260902.py
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: 2d429e08131311063fa9edf01b167d6617035fe2
      BRANCH: hotfix/p01-iyf-mview-cover-fallback-20260902
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: run/p01-iyf-mview-cover-fallback-20260902
          path: runner
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: hotfix/p01-iyf-mview-cover-fallback-20260902
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
          path: product
      - name: Fresh fence
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C product rev-parse HEAD)" = "$BASE"
          git -C product fetch origin main
          test "$(git -C product rev-parse origin/main)" = "$BASE"
          test "$(cat product/VERSION)" = 2.37.1
      - name: Apply focused patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 runner/scripts/p01_iyf_mview_cover_fallback_20260902.py
      - name: Static and exact-scope gate
        shell: bash
        run: |
          set -Eeuo pipefail
          php -l product/src/app/ResourceCoverCache.php
          node --check product/src/assets/workspace.js
          grep -Fq "mview.iyf.tv" product/src/app/ResourceCoverCache.php
          grep -Fq "https://www.iyf.tv" product/src/app/ResourceCoverCache.php
          grep -Fq 'vf-cover-retry:v3:' product/src/assets/workspace.js
          git -C product diff --check
          ACTUAL=$(git -C product diff --name-only "$BASE" | sort)
          EXPECTED=$(printf '%s\n' src/app/ResourceCoverCache.php src/assets/workspace.js | sort)
          test "$ACTUAL" = "$EXPECTED"
          test -z "$(git -C product diff --name-only "$BASE" -- VERSION src/VERSION.txt src/migrations)"
      - name: Canonical helper behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/test_iyf.php <<'PHP'
          <?php
          require 'product/src/app/ResourceCoverCache.php';
          $m = new ReflectionMethod(VfResourceCoverCache::class, 'metadataPageUrls');
          $urls = $m->invoke(null, 'https://mview.iyf.tv/play/27Qr2mVwuzJ', ['code'=>'iyf']);
          if ($urls !== ['https://www.iyf.tv/play/27Qr2mVwuzJ', 'https://mview.iyf.tv/play/27Qr2mVwuzJ']) exit(2);
          $normal = $m->invoke(null, 'https://www.iyf.tv/play/27Qr2mVwuzJ', ['code'=>'iyf']);
          if ($normal !== ['https://www.iyf.tv/play/27Qr2mVwuzJ']) exit(3);
          echo "IYF_CANONICAL_HELPER=PASS\n";
          PHP
          php /tmp/test_iyf.php
      - name: Live same-token proof
        shell: bash
        run: |
          set -Eeuo pipefail
          MOBILE='https://mview.iyf.tv/play/27Qr2mVwuzJ'
          DESKTOP='https://www.iyf.tv/play/27Qr2mVwuzJ'
          curl -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0' -o /tmp/m.html "$MOBILE"
          curl -L --fail --silent --show-error --connect-timeout 5 --max-time 15 -A 'Mozilla/5.0' -o /tmp/d.html "$DESKTOP"
          test "$( (grep -oi 'og:image' /tmp/m.html || true) | wc -l )" -eq 0
          test "$( (grep -oi 'og:image' /tmp/d.html || true) | wc -l )" -ge 1
          echo 'IYF_SAME_TOKEN_LIVE_PROOF=PASS'
      - name: Commit candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd product
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add src/app/ResourceCoverCache.php src/assets/workspace.js
          git commit -m 'fix: hydrate iyf mobile watch covers'
          git push origin "HEAD:$BRANCH"
          echo 'P01_IYF_MVIEW_COVER_FALLBACK=PASS'
