name: P03 V1.36.0 Harness SQLite Discovery Patch
on:
  push:
    branches: [p03-v1360-runtime-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      WRITE_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
      EXPECTED_HEAD: 209358a52ba5f65f51345638c098796d9f8ed703
    steps:
      - name: Patch exact private harness line
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WRITE_TOKEN:-}"
          git clone --quiet --branch integration/v1.36.0-product-experience --single-branch "https://x-access-token:${WRITE_TOKEN}@github.com/llhzx2018/vf-forge.git" p03
          cd p03
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/integration/v1360_formal_runtime_gate.sh')
          s=p.read_text(encoding='utf-8')
          old='DB=$(find "$DATA_ROOT/database" -maxdepth 1 -type f -name \'*.sqlite\' | head -n1); test -n "$DB"; export DB'
          new='DB=$(find "$DATA_ROOT" -type f -name \'*.sqlite\' -print -quit); test -n "$DB"; export DB'
          assert s.count(old)==1, 'DB_FIND_ANCHOR_MISMATCH'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          bash -n tests/integration/v1360_formal_runtime_gate.sh
          test "$(git status --short | wc -l)" -eq 1
          test "$(git status --short | awk '{print $2}')" = 'tests/integration/v1360_formal_runtime_gate.sh'
          git config user.name VictorForge
          git config user.email llhzx2018@gmail.com
          git add tests/integration/v1360_formal_runtime_gate.sh
          git commit -m 'test(v1.36.0): make sqlite fixture discovery pipefail-safe'
          git push origin HEAD:integration/v1.36.0-product-experience
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
