name: P07-M03-D04 native two-CloudPanel real migration acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-native-vm-probe-20261114.yml'
      - 'tests/p07_m03_d04_real_native_dualvm.sh'
permissions:
  contents: read
jobs:
  actual-two-vm-pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout temporary public test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact private M03-D04 source for disposable VMs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fc346593199b98198819a609103d774f3145e7e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Run official Debian13 two VM CloudPanel to CloudPanel test, no cutover
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = fc346593199b98198819a609103d774f3145e7e9
          bash -n tests/p07_m03_d04_real_native_dualvm.sh
          timeout --signal=TERM --kill-after=60s 3200s bash tests/p07_m03_d04_real_native_dualvm.sh
      - name: Defense-in-depth private source cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_PRIVATE_SOURCE_NOT_PERSISTED=PASS
