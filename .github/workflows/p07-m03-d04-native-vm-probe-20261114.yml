name: P07-M03-D04 two native CloudPanel migration acceptance after fixture correction
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-native-vm-probe-20261114.yml'
      - 'tests/p07_m03_d04_real_native_dualvm.sh'
permissions:
  contents: read
jobs:
  actual-two-vm-pull:
    # Historical full dual-VM jobs are already running for the prior source;
    # do not rebuild the same two VMs for this source-only preimport gate.
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout temporary public test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch exact private M03-D04 source for disposable VMs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: fc346593199b98198819a609103d774f3145e7e9
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Source and target Debian13 CloudPanel full synthetic Pull acceptance
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = fc346593199b98198819a609103d774f3145e7e9
          bash -n tests/p07_m03_d04_real_native_dualvm.sh
          timeout --signal=TERM --kill-after=60s 3100s bash tests/p07_m03_d04_real_native_dualvm.sh
      - name: Defense-in-depth private source cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_PRIVATE_SOURCE_NOT_PERSISTED=PASS

  sql-preimport-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch exact private P07-M03-D04 product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 510df3b01f92074f09c3933cc05f6bdd996a674b
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: .p07-private-exact
      - name: Run scoped source SQL safety and existing parity regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C .p07-private-exact rev-parse HEAD)" = 510df3b01f92074f09c3933cc05f6bdd996a674b
          cd .p07-private-exact
          export PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1
          export PYTHONPATH="$PWD/lib"
          python3 -B -m unittest discover -s tests -p test_p07_m03_source_sql_safety_preimport.py -v
          python3 -B -m unittest discover -s tests -p test_migration_safe_session_guard.py -v
          python3 -B -m unittest discover -s tests -p test_cross_engine_sql_format.py -v
          python3 -B -m unittest discover -s tests -p test_p07_m03_dynamic_sqlite_scope.py -v
          echo P07_M03_D04_EXACT_SOURCE_PREIMPORT_AND_PRIOR_GUARDS=PASS
      - name: Delete temporary private source
        if: always()
        run: |
          rm -rf -- .p07-private-exact
          test ! -e .p07-private-exact
          echo P07_M03_D04_UNIT_PRIVATE_SOURCE_CLEANED=PASS
