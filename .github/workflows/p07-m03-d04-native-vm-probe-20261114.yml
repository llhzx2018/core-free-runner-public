name: P07-M03-D04 dual CloudPanel VM host capability (one-shot)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-m03-d04-native-vm-probe-20261114.yml'
permissions:
  contents: read
jobs:
  isolated-vm-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check REAL VM prerequisites for two isolated CloudPanel servers
        shell: bash
        run: |
          set -Eeuo pipefail
          echo P07_M03_D04_MACHINE_CHECK=START
          echo "P07_M03_D04_HOST_OS=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"')"
          echo "P07_M03_D04_CPU_COUNT=$(nproc)"
          echo "P07_M03_D04_MEMORY_KIB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          echo "P07_M03_D04_FREE_DISK_KIB=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if test -e /dev/kvm && sudo -n test -r /dev/kvm && sudo -n test -w /dev/kvm; then
            echo P07_M03_D04_KVM=AVAILABLE
            echo P07_M03_D04_TWO_NATIVE_CLOUDPANEL_VM_HOST=ELIGIBLE_FOR_INSTALL_TEST
          else
            echo P07_M03_D04_KVM=UNAVAILABLE
            echo P07_M03_D04_TWO_NATIVE_CLOUDPANEL_VM_HOST=BLOCKED_NO_NESTED_VIRTUALIZATION
          fi
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo P07_M03_D04_CONTAINER_RUNTIME=AVAILABLE_BUT_CLOUDPANEL_UNSUPPORTED
          else
            echo P07_M03_D04_CONTAINER_RUNTIME=UNAVAILABLE
          fi
          echo P07_M03_D04_PRODUCTION_DNS_EXTERNAL_VPS=UNTOUCHED
