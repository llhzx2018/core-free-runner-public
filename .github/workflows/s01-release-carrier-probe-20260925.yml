name: S01 Release Carrier Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s01-release-carrier-probe-20260925.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: token presence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          echo "probe"
