name: P02 v2.5.133 exact-source SQL parity isolated diagnostic
on:
  push:
    branches: [p02-25133-formal-preflight-20261120]
    paths: [.github/workflows/p02-25133-sql-parity-diagnostic.yml]
permissions:
  contents: read
jobs:
  sql-parity-stage:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: p02_w3_disposable_only
          MYSQL_ROOT_HOST: '%'
        ports: [33306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=25
    steps:
      - name: Transient exact private checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-library
          ref: 8e7328877df9c471aef6e14a0cf5df1b3b48bb24
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p02-source
      - name: Install disposable native PHP and Laravel vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/p02-source"
          test "$(git rev-parse HEAD)" = '8e7328877df9c471aef6e14a0cf5df1b3b48bb24'
          test "$(cat VERSION)" = '2.5.133'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-mysql php-sqlite3 php-mbstring php-xml php-curl php-zip composer >/tmp/p02-sql-diag-deps.txt 2>&1
          composer --working-dir=modern/laravel install --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction --no-progress >/tmp/p02-sql-diag-composer.txt 2>&1
          test -f modern/laravel/vendor/autoload.php
      - name: Classify exact-source SQL Schema2401 structural failure without logging source
        shell: bash
        env:
          P02_W3_SYNTHETIC_ONLY: '1'
          P02_W3_ENGINE: mysql
          P02_W3_USER: root
          P02_W3_PASS: p02_w3_disposable_only
          P02_W3_DSN: mysql:host=127.0.0.1;port=33306;dbname=p02_w3_mysql;charset=utf8mb4
        run: |
          set -Eeuo pipefail
          umask 077
          cd "$GITHUB_WORKSPACE/p02-source"
          export P02_W3_VENDOR_AUTOLOAD="$PWD/modern/laravel/vendor/autoload.php"
          if php tests/integration/p02_w3_relational_schema_2401.php >/tmp/p02-sql-diag-struct.txt 2>&1; then
            echo 'P02_SQL_MYSQL_RELATIONAL_PARITY=PASS'
          else
            python3 - <<'PY'
          import pathlib,re
          data=pathlib.Path('/tmp/p02-sql-diag-struct.txt').read_text(errors='replace')[:100000]
          markers=sorted(set(re.findall(r'(?:P02|NEGATIVE)_[A-Z0-9_]{4,70}',data)))
          state=re.search(r'SQLSTATE\[([0-9A-Z]{5})\]',data)
          name=re.search(r'\b(PDOException|RuntimeException|Error|TypeError|InvalidArgumentException)\b',data)
          line=re.search(r'p02_w3_relational_schema_2401\.php(?: on line |:)([0-9]{1,4})',data)
          print('P02_SQL_FAIL_MARKER='+(','.join(markers[:4]) if markers else 'NONE'))
          print('P02_SQL_SQLSTATE='+(state.group(1) if state else 'NONE'))
          print('P02_SQL_EXCEPTION_CLASS='+(name.group(1) if name else 'UNKNOWN'))
          print('P02_SQL_TEST_LINE='+(line.group(1) if line else 'UNKNOWN'))
          frames=re.findall(r'p02_w3_relational_schema_2401\.php(?: on line |:|\()([0-9]{1,4})',data)
          print('P02_SQL_STACK_LINES='+(','.join(dict.fromkeys(frames[-8:])) if frames else 'UNKNOWN'))
          for key in ('idx_text_categories_parent_name',
                      'uq_library_sources_type_key','uq_library_sources_canonical',
                      'uq_item_relation','uq_derivative_item_level',
                      'uq_derivative_logical_asset','uq_derivative_attachment_level'):
              if key.lower() in data.lower():
                  print('P02_SQL_CONSTRAINT_KEY='+key)
                  break
          PY
            echo 'P02_SQL_MYSQL_RELATIONAL_PARITY=FAIL'
            exit 96
          fi
      - name: Remove disposable private checkout and diagnostics
        if: always()
        shell: bash
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p02-source"
          rm -f -- /tmp/p02-sql-diag-deps.txt /tmp/p02-sql-diag-composer.txt /tmp/p02-sql-diag-struct.txt
          echo P02_PRIVATE_SOURCE_WORKSPACE_CLEANUP=PASS
