name: S01 C03 12528 Identity Probe
on:
  push:
    branches: [temp/s01-final-ux-candidate-patch-20260907]
    paths: [.github/workflows/temp-s01-c03-12528-identity-probe-20260907.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      C03_SHA: c457bd921a45442b60f2f4abac7e46cd8195c0dd
    steps:
      - name: Enumerate release identity bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          git clone -q "https://x-access-token:${READ_TOKEN}@github.com/llhzx2018/vf-tools-m3u8.git" repo
          cd repo
          git checkout -q "$C03_SHA"
          test "$(git rev-parse HEAD)" = "$C03_SHA"
          echo '=== VERSION/R251 BINDINGS ==='
          git grep -n -E '1\.25\.27|R251' -- VERSION src tests ':!docs' ':!CHANGELOG.md' || true
          echo 'PASS_S01_C03_12528_IDENTITY_PROBE'
