name: P08 R181 v0.1.9 real official 018 FULL to native 3DB Atomic one-shot
on:
  pull_request:
    paths:
      - .github/workflows/p08-r181-v019-official-018-atomic-3db-once.yml
      - scripts/p08_r181_native_once.sh
permissions:
  contents: read
jobs:
  official-full-to-exact-next-atomic:
    if: github.repository == 'llhzx2018/core-free-runner-public' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'proof/p08-r181-v019-atomic-018-once-20261118' && github.event.pull_request.base.ref == 'main' && github.actor == 'llhzx2018'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: sqlite
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mysql
            image: mysql:8.4
            health: mysqladmin ping --silent
          - kind: mariadb
            image: mariadb:11.8
            health: healthcheck.sh --connect --innodb_initialized
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MYSQL_ROOT_HOST: '%'
          MARIADB_ROOT_PASSWORD: synthetic-only-p08-ci-pass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      P08_ISOLATED_INSTALL_TEST: YES
      P08_TARGET_SHA: 728de18cede35520b8399d61b4a655ca450c3e73
      P08_PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
      P08_TEST_DB_DRIVER: ${{ matrix.kind }}
    steps:
      - name: Checkout exact isolated Runner harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact P08 v0.1.9 candidate without token persistence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-adops
          ref: 728de18cede35520b8399d61b4a655ca450c3e73
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: p08
      - name: Checkout canonical Source Current for real FULL structural gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/gov-doc
          ref: a1d783e31e6e22b037f0d9140a8046f25da210fc
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: gov
      - name: PHP 8.4 locked packages and native extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: zip,curl,mbstring,pdo_mysql,pdo_sqlite,sqlite3,openssl,posix,dom,intl,fileinfo
          coverage: none
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: p08/package-lock.json
      - name: Install independent native SQL dump and sqlite tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq install -y mariadb-client sqlite3
          command -v mariadb-dump
      - name: Real official v0.1.8 FULL install then target Atomic switch rollback and hard-crash recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/p08_r181_native_once.sh ${{ matrix.kind }}
      - name: Destroy all private checkouts and temporary real packages
        if: always()
        shell: bash
        run: |
          rm -rf -- p08 gov "$RUNNER_TEMP/p08-r181-${{ matrix.kind }}" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-first" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-fault" "$RUNNER_TEMP/p08-r129-real-issued-r131-r155-${{ matrix.kind }}-kill"
          test ! -e p08 && test ! -e gov
