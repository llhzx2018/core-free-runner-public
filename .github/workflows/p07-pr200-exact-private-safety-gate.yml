name: TEMP P07 PR200 exact-private-source sharded regression
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p07-pr200-exact-private-safety-gate.yml'

permissions:
  contents: read

concurrency:
  group: p07-pr200-exact-private-regression
  cancel-in-progress: false

jobs:
  remaining-regression:
    if: github.repository == 'llhzx2018/core-free-runner-public'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Verify registered private source read capability
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$PRIVATE_READ_TOKEN" || { echo 'P07_PRIVATE_READ_CAPABILITY=BLOCKED'; exit 78; }
          echo 'P07_PRIVATE_READ_CAPABILITY=PASS'

      - name: Fetch exact immutable P07 PR200 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-server-ops
          ref: 15b6dc7b26dc12489251f49387d033b5a2862577
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: p07-private

      - name: Execute deterministic bounded shard on exact source
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -Eeuo pipefail
          test "$(git -C p07-private rev-parse HEAD)" = '15b6dc7b26dc12489251f49387d033b5a2862577'
          test "$(cat p07-private/BUILD_ID)" = '0.1.0-release86'
          cd p07-private
          mapfile -t modules < <(python3 - "$SHARD_INDEX" <<'PY'
          import pathlib, sys
          excluded = {
              "test_backup.py", "test_restore_new.py", "test_auto_backup.py",
              "test_cloudpanel.py", "test_server_migration_pull.py", "test_policy.py",
              "test_storage.py", "test_restore.py", "test_restore_apply.py",
              "test_mariadb_owner_policy.py", "test_cli_menu.py",
          }
          remaining = sorted(p.stem for p in pathlib.Path("tests").glob("test_*.py") if p.name not in excluded)
          assert len(remaining) == 45, "Unexpected regression inventory"
          shard = int(sys.argv[1])
          selected = [f"tests.{name}" for index, name in enumerate(remaining) if index % 5 == shard]
          assert len(selected) == 9, "Unexpected shard size"
          print("\n".join(selected))
          PY
          )
          test "${#modules[@]}" -eq 9
          echo "P07_REMAINING_SHARD_${SHARD_INDEX}_MODULES=${#modules[@]}"
          log="$RUNNER_TEMP/p07-remaining-shard-${SHARD_INDEX}.log"
          if timeout --signal=TERM --kill-after=5s 750 python3 -m unittest -q "${modules[@]}" >"$log" 2>&1; then
            echo "P07_REMAINING_SHARD_${SHARD_INDEX}=PASS"
            grep -E '^Ran [0-9]+ tests? in ' "$log" | tail -n1 || true
          else
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "P07_REMAINING_SHARD_${SHARD_INDEX}=TIMEOUT"
            else
              echo "P07_REMAINING_SHARD_${SHARD_INDEX}=UNRESOLVED_TEST_FAILURE"
            fi
            echo "P07_REMAINING_SHARD_${SHARD_INDEX}_EXIT=$rc"
            grep -E '^Ran [0-9]+ tests? in |^FAILED \(' "$log" | tail -n2 || true
            exit "$rc"
          fi

      - name: Erase private worktree and private test output
        if: always()
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          rm -rf -- "$GITHUB_WORKSPACE/p07-private"
          rm -f -- "$RUNNER_TEMP/p07-remaining-shard-${SHARD_INDEX}.log"
          echo 'P07_PRIVATE_SOURCE_PERSISTED=NO'
          echo 'P07_PRIVATE_TEST_RAW_LOG_UPLOADED=NO'
