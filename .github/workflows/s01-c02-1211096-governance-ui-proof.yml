name: S01 C02 1211096 Governance UX Four Viewports
on:
  push:
    branches: [task/s01-c02-1211096-governance-audit-machine-20261012]
permissions:
  contents: read
jobs:
  governance-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact published product source (no persistent credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llhzx2018/vf-tools-ops
          ref: 308b8872d17297e8bd7344c9a81698f423cc246d
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          persist-credentials: false
      - name: PHP route audit and security contracts
        run: |
          set -Eeuo pipefail
          php tests/s01-c02-1211089-one-click-audit-ajax-security.php
          php tests/s01-c02-1211090-audit-progress-php-contract.php
          php tests/s01-c02-1211091-audit-outcome-evidence-render.php
          php tests/s01-c02-1211095-system-update-blocker-visibility.php
      - name: Install pinned disposable browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Governance modal, native input, 1-click batch and evidence UI
        run: |
          set -Eeuo pipefail
          node tests/s01-c02-1211087-system-policy-modal-browser-proof.js
          node tests/s01-c02-1211088-system-policy-native-select-browser-proof.js
          node tests/s01-c02-1211089-one-click-audit-browser-proof.js
          node tests/s01-c02-1211091-audit-outcome-evidence-browser-proof.js
          echo S01_C02_GOVERNANCE_UX_4_VIEWPORTS_PASS
