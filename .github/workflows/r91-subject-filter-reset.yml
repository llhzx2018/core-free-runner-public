name: R91 Focused Subject Filter Reset Gate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r91-subject-filter-reset.yml'

permissions:
  contents: read

jobs:
  r91-focused-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: 52a8811b5cd2f968c4b1c2e97ef183778764e27b
    steps:
      - name: Checkout exact private P01 candidate transiently
        uses: actions/checkout@v4
        with:
          repository: llhzx2018/vf-start
          ref: 52a8811b5cd2f968c4b1c2e97ef183778764e27b
          path: vf-start
          token: ${{ secrets.VF_PRIVATE_READ_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Exact source and focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          cd vf-start
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat VERSION)" = '2.47.0'
          php -l src/app/SubjectPageChrome.php
          php -l tests/unit/subject_filter_reset_contract.php
          php tests/unit/subject_filter_reset_contract.php
          php tests/unit/channel_watch_search_context_contract.php
          php tests/unit/sidebar_context_count_contract.php
          php tests/unit/scope_context_count_contract.php
          echo R91_SUBJECT_FILTER_RESET_PASS
          echo R91_EXACT_CANDIDATE_GATE_PASS

      - name: Cleanup transient private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/vf-start"
