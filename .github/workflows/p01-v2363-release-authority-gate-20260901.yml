name: P01 V2.36.3 Release Authority Gate
on:
  push:
    branches: [release/p01-v2363-candidate-20260901]
    paths: [.github/workflows/p01-v2363-release-authority-gate-20260901.yml]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE: bcecac5d3a9c103bfc37863a8870ec15285dcc5c
      HEAD: 3aaa69e6206368c4f733630eb790c86525126e25
      FORMAL: 718e043e3715ef7b21849bc08634fca89bf92c1f
      RUNTIME_TREE: 820724b585cb59864211f77c4fb33537b2345029
      PRODUCT_MAIN: 21ac0ff14f17237212d288f71e95bde6eae503ec
      CORE_LIVE: 650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf
      RELEASE_ID: '380449563'
      REMOTE_TRUTH_R2: '33504969865'
      EVID: /tmp/p01-v2363-release-authority-gate
    steps:
      - name: Checkout exact authority candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: llhzx2018/vf-start
          ref: ${{ env.HEAD }}
          token: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
          fetch-depth: 0
      - name: Validate exact release closure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VF_RELEASE_WRITE_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVID"
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE"
          expected=$'VF_PROJECT.json\ndocs/authority/CURRENT.md\ndocs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md\ndocs/handoff/CURRENT_STATE.md'
          actual="$(git diff --name-only "$BASE" "$HEAD" | sort)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          test -z "$(git diff --name-only "$BASE" "$HEAD" -- src)"
          test "$(git rev-parse "$BASE:src")" = "$RUNTIME_TREE"
          test "$(git rev-parse "$HEAD:src")" = "$RUNTIME_TREE"
          jq -e '.production_version=="2.36.2" and .working_version=="2.36.3" and .target_release_version=="2.36.3"' VF_PROJECT.json >/dev/null
          jq -e '.candidate_state=="PUBLISHED / CANDIDATE CLOSED"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.version=="2.36.3" and .published_release.tag=="v2.36.3" and .published_release.release_id==380449563' VF_PROJECT.json >/dev/null
          jq -e '.published_release.release_source=="718e043e3715ef7b21849bc08634fca89bf92c1f" and .published_release.runtime_tree=="820724b585cb59864211f77c4fb33537b2345029"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.live_core_updates_commit=="650935cc9d71570a7ab7a0dd1c615ea5e3bf74bf" and .published_release.online_asset_sha256=="7110d0e232ce7dec521b4e76148441d06376a02124249d68237b774f2d33447d"' VF_PROJECT.json >/dev/null
          jq -e '.published_release.remote_release_truth_gate==33504969865 and .published_release.remote_release_truth_artifact==9799217396' VF_PROJECT.json >/dev/null
          jq -e '.current_change.production_write==false and .current_change.runner_main_write==false' VF_PROJECT.json >/dev/null
          jq -e '.authority.current_formal_release_evidence=="docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md"' VF_PROJECT.json >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/authority/CURRENT.md >/dev/null
          grep -F '<!-- P01_V2363_RELEASE_CLOSURE -->' docs/handoff/CURRENT_STATE.md >/dev/null
          grep -F 'Owner Production remains **V2.36.2**' docs/evidence/P01_V2.36.3_RELEASE_CLOSURE_20260901.md >/dev/null
          test "$(gh api repos/llhzx2018/vf-start/branches/develop --jq .commit.sha)" = "$BASE"
          test "$(gh api repos/llhzx2018/vf-start/branches/main --jq .commit.sha)" = "$PRODUCT_MAIN"
          test "$(gh api repos/llhzx2018/vf-start/git/ref/tags/v2.36.3 --jq .object.sha)" = "$FORMAL"
          test "$(gh api repos/llhzx2018/vf-start/releases/tags/v2.36.3 --jq .id)" = "$RELEASE_ID"
          test "$(gh api repos/llhzx2018/core-updates/branches/main --jq .commit.sha)" = "$CORE_LIVE"
          gh api repos/llhzx2018/core-updates/contents/projects/P01.json?ref=main -H 'Accept: application/vnd.github.raw+json' > "$EVID/live-P01.json"
          jq -e '.current_version=="2.36.2" and .target_version=="2.36.3" and .from_versions==["2.36.2"] and .release_id==380449563' "$EVID/live-P01.json" >/dev/null
          test "$(gh api repos/llhzx2018/core-free-runner-public/actions/runs/$REMOTE_TRUTH_R2 --jq .conclusion)" = success
          test "$(gh api repos/llhzx2018/core-free-runner-public/branches/main --jq .commit.sha)" = e569c491506e2a367d01a18cfa89a234a22abb79
          printf 'P01_V2363_RELEASE_AUTHORITY_GATE=PASS\nBASE=%s\nHEAD=%s\nSRC_TREE=%s\nPUBLISHED_LATEST=2.36.3\nOWNER_PRODUCTION=2.36.2\nCORE_UPDATES_MAIN=%s\nOWNER_PRODUCTION_WRITE=NO\n' "$BASE" "$HEAD" "$RUNTIME_TREE" "$CORE_LIVE" | tee "$EVID/verdict.txt"
      - name: Upload authority gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p01-v2363-release-authority-gate-${{ github.run_id }}
          path: ${{ env.EVID }}
          if-no-files-found: error
          retention-days: 90
